# Landing page at /, the PWA at /app/. Security headers are set by the reverse proxy
# in production (deploy/vps/lumen.caddy); nginx only handles routing and caching.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /app { return 301 /app/; }
  location = /app/sw.js { add_header Cache-Control "no-cache"; }
  location = /app/index.html { add_header Cache-Control "no-cache"; }
  location = /app/content/manifest.json { add_header Cache-Control "no-cache"; }
  # content-hashed bundles and assets never change
  location /app/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /app/content/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /app/ { try_files $uri /app/index.html; }

  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
