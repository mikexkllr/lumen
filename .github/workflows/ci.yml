name: CI
on:
  push:
    branches: [main]
    tags: ['v*'] # v1.2.3 = App Store release of apps/mobile version 1.2.3 (job "ios")
  pull_request:
  workflow_dispatch: # re-run checks and deploy by hand (Actions → CI → Run workflow)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (engine, CLI, server)
        run: npm test
      - name: Content evals (schema, solvability, uniqueness, fuzzing, readability, license)
        run: node packages/cli/src/cli.ts check content --strict && node packages/cli/src/cli.ts check content --locale en --strict
      - name: Build content bundles and PWA
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  docker:
    # Builds both images and checks the deployment configs; nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files and Caddyfile are valid
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          docker run --rm -e LUMEN_DOMAIN=lumen.example.org -e LUMEN_ACME_EMAIL=admin@example.org \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build server image
        run: docker build -f deploy/Dockerfile.server -t lumen-server:ci .
      - name: Build web image and test its nginx config
        run: |
          docker build -f deploy/Dockerfile.web -t lumen-web:ci .
          docker run --rm lumen-web:ci nginx -t
      - name: Backup script parses
        run: sh -n deploy/backup.sh

  deploy:
    # Ships both images to https://lumen.mikekeller.cloud after every green run on main.
    # Same pattern as the other sites on the VPS: the deploy key may only run
    # /usr/local/bin/deploy-site for "lumen" (docker load from stdin, then docker compose up
    # in /opt/sites/lumen). No registry needed. Compose file, Caddy site and the server .env
    # (OpenRouter key, admin token) stay on the server – change those with deploy/vps/deploy.sh.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'mikexkllr/lumen'
    needs: [check, docker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lumen.mikekeller.cloud
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        env:
          # public operator details for the in-app imprint (repository variables, not secrets)
          OPERATOR: ${{ vars.LUMEN_OPERATOR }}
          OPERATOR_ADDRESS: ${{ vars.LUMEN_OPERATOR_ADDRESS }}
          CONTACT: ${{ vars.LUMEN_CONTACT }}
          PHONE: ${{ vars.LUMEN_PHONE }}
          VAT_ID: ${{ vars.LUMEN_VAT_ID }}
          ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues/new
        run: |
          docker build -f deploy/Dockerfile.web -t lumen-web:latest \
            --build-arg VITE_LUMEN_API_URL=/api \
            --build-arg VITE_LUMEN_OPERATOR="$OPERATOR" \
            --build-arg VITE_LUMEN_OPERATOR_ADDRESS="$OPERATOR_ADDRESS" \
            --build-arg VITE_LUMEN_CONTACT="$CONTACT" \
            --build-arg VITE_LUMEN_PHONE="$PHONE" \
            --build-arg VITE_LUMEN_VAT_ID="$VAT_ID" \
            --build-arg VITE_LUMEN_ISSUES_URL="$ISSUES_URL" \
            --build-arg LUMEN_SITE_ORIGIN=https://lumen.mikekeller.cloud .
          docker build -f deploy/Dockerfile.server -t lumen-sync:latest .
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy to VPS
        run: |
          docker save lumen-web:latest lumen-sync:latest | gzip | \
            ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} lumen
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do curl -fsS https://lumen.mikekeller.cloud/api/healthz && break; sleep 3; done
          curl -fsS -o /dev/null https://lumen.mikekeller.cloud/
          curl -fsS https://lumen.mikekeller.cloud/app/ | grep -q 'assets/index-'
          curl -fsS https://lumen.mikekeller.cloud/api/v1/tutor

  ios:
    # iOS app "Lumen – Microlearning" (cloud.mikekeller.lumen) in App Store Connect:
    #   push to main  -> build, sign and upload to TestFlight
    #   tag v1.2.3    -> the same, then submit version 1.2.3 for review; it is released
    #                    automatically once Apple approves it (apps/mobile/scripts/asc.ts)
    # Secrets live in the "app-store" environment; setup and renewal: docs/store-release.md.
    # This repository is public and so are these logs: never print a secret or a decoded file.
    if: github.event_name != 'pull_request' && github.repository == 'mikexkllr/lumen' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [check]
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    concurrency:
      group: app-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Version and build number
        id: version
        run: |
          version="$(node -p "require('./apps/mobile/package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/mobile/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # strictly increasing across all runs and versions (UTC yymmddHHMM)
          echo "build=$(date -u +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - name: Build the web app into the iOS project
        env:
          VITE_LUMEN_API_URL: https://lumen.mikekeller.cloud/api
          VITE_LUMEN_OPERATOR: ${{ vars.LUMEN_OPERATOR }}
          VITE_LUMEN_OPERATOR_ADDRESS: ${{ vars.LUMEN_OPERATOR_ADDRESS }}
          VITE_LUMEN_CONTACT: ${{ vars.LUMEN_CONTACT }}
          VITE_LUMEN_PHONE: ${{ vars.LUMEN_PHONE }}
          VITE_LUMEN_VAT_ID: ${{ vars.LUMEN_VAT_ID }}
          VITE_LUMEN_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues/new
        run: npm run sync -w @lumen/mobile -- ios
      - name: Install certificate and profile
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$P12_BASE64" > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          base64 --decode <<<"$PROFILE_BASE64" > "$profiles/lumen-app-store.mobileprovision"
      # -quiet keeps certificate and profile details out of the public log.
      - name: Archive
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild archive -quiet -project App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Lumen.xcarchive" \
            DEVELOPMENT_TEAM=9G5PKNZCQF CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Lumen App Store CI" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}"
      - name: Upload to App Store Connect
        working-directory: apps/mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          base64 --decode <<<"$ASC_KEY_P8_BASE64" > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -exportArchive -quiet -archivePath "$RUNNER_TEMP/Lumen.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist ../ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "uploaded ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }})"
      - name: Submit for App Store review
        if: github.ref_type == 'tag'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ runner.temp }}/AuthKey.p8
        run: |
          # "What's New": the annotated tag's message, else a generic line
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^-----BEGIN/,$d')"
          [ -n "$notes" ] || notes="Improvements and new lessons."
          printf '%s\n' "$notes" > "$RUNNER_TEMP/whats-new.txt"
          node apps/mobile/scripts/asc.ts submit cloud.mikekeller.lumen \
            "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}" \
            --whats-new-file "$RUNNER_TEMP/whats-new.txt"
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/lumen-app-store.mobileprovision"
