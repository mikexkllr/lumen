# Simple self-hosting: `docker compose up -d --build`, then open http://localhost:8080
# (website at /, the app at /app/)
# The web container serves the PWA and proxies /api/ to the Lumen server (sync, Lux
# tutor, social), so everything is same-origin. For a public HTTPS deployment use
# docker-compose.prod.yml (see docs/deploy-vps.md and docs/self-hosting.md).
services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_LUMEN_API_URL: /api
    environment:
      LUMEN_API_UPSTREAM: http://sync:8787
    ports: ["8080:80"]
    restart: unless-stopped
  sync:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      # same-origin requests need no CORS entry; add other web/app origins here
      LUMEN_CORS_ORIGINS: http://localhost:8080
      # no model configured: Lux answers with the rule tutor (see docs/self-hosting.md)
      LUMEN_TUTOR: "off"
    volumes: ["lumen-data:/data"]
    restart: unless-stopped
volumes:
  lumen-data:
