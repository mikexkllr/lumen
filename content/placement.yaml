# Einstufung: regelbasiert und deterministisch. Die erste falsch beantwortete
# Aufgabe bestimmt, wo das Lernen beginnt.
type: placement
locale: de
mastered: { topic: alg.linear, unit: alg.linear.u3 }
items:
  - recommends: { topic: math.fractions, unit: math.fractions.u1 }
    step:
      kind: problem
      widget: choice
      prompt: Welcher Bruch beschreibt 3 von 4 gleich großen Teilen?
      params:
        layout: grid
        options:
          - { label: "3/4", correct: true }
          - { label: "4/3" }
          - { label: "1/4" }
          - { label: "3/7" }
  - recommends: { topic: math.fractions, unit: math.fractions.u2 }
    step:
      kind: problem
      widget: numeric
      prompt: "Kürze so weit wie möglich: 6/8"
      answer: { value: "3/4", form: simplified }
  - recommends: { topic: alg.linear, unit: alg.linear.u1 }
    step:
      kind: problem
      widget: numeric
      prompt: "x + 6 = 10. Wie groß ist x?"
      answer: { value: 4 }
  - recommends: { topic: alg.linear, unit: alg.linear.u2 }
    step:
      kind: problem
      widget: numeric
      prompt: "Löse: 2x − 3 = 9"
      answer: { value: 6 }
  - recommends: { topic: alg.linear, unit: alg.linear.u3 }
    step:
      kind: problem
      widget: choice
      prompt: Welcher Punkt liegt rechts oben im Koordinatensystem?
      params:
        layout: grid
        options:
          - { label: "(2 | 3)", correct: true }
          - { label: "(−2 | 3)" }
          - { label: "(2 | −3)" }
          - { label: "(−2 | −3)" }
