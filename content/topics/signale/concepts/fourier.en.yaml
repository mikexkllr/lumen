id: ee.signals.fourier
type: concept
title: "Every signal is a sum of sine waves"
summary: "Fundamental, harmonics and the spectrum – Fourier’s idea."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Mixing waves
    body: "Radio, Wi-Fi, music: every signal can be split into **sine waves**. Here you build a wave yourself. Add waves with double and triple the frequency to the sine. What happens to the shape?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: sin(x) + a*sin(2*x) + b*sin(3*x)
        x:
          - 0
          - 12.6
        y:
          - -3
          - 3
        showCoordinates: false
        sliders:
          - id: a
            label: Share of double frequency
            min: -1
            max: 1
            step: 0.1
            initial: 0
          - id: b
            label: Share of triple frequency
            min: -1
            max: 1
            step: 0.1
            initial: 0

  - kind: problem
    id: hook
    widget: choice
    prompt: A violin and a flute play the same note A at 440 Hz. Why do they still sound different?
    params:
      options:
        - label: On top of 440 Hz come harmonics at 880, 1320 Hz … in different strengths
          correct: true
        - label: Because the violin is louder
          feedback: Even at equal loudness they sound different.
        - label: Because they play different frequencies
          feedback: The fundamental is 440 Hz for both.
    hints:
      - A real note is not a pure sine.
      - The shape of the wave sets the timbre.
    explanation: Timbre comes from the mix of harmonics. A flute sounds almost like a sine, a violin has many strong harmonics.

  - kind: explain
    id: c1
    body: "The **Fourier series** says: every periodic signal is a sum of sine waves. The lowest has the fundamental frequency f. All the others, the harmonics, have 2f, 3f, 4f and so on."

  - kind: problem
    id: c2
    widget: numeric
    prompt: A note has a fundamental of {{f}} Hz. What frequency is its {{k}}th multiple, the {{k}}th harmonic?
    params:
      unit: Hz
    answer:
      value: "{{k * f}}"
    hints:
      - Harmonics are whole-number multiples.
      - "{{k}} × {{f}} Hz."
    explanation: "{{k}} × {{f}} = {{k * f}} Hz."
    variants:
      params:
        f: choice[110,220,440]
        k: choice[2,3,5]
      defaults:
        f: 440
        k: 3

  - kind: problem
    id: c3
    widget: slider
    prompt: "Build a square wave from three sines: sin x + sin(3x)/b + sin(5x)/c. Set b and c so your curve matches the dashed one."
    params:
      expr: sin(x) + sin(3*x)/b + sin(5*x)/c
      x:
        - 0
        - 6.3
      y:
        - -1.5
        - 1.5
      showCoordinates: false
      sliders:
        - id: b
          label: b
          min: 1
          max: 9
          step: 1
          initial: 1
        - id: c
          label: c
          min: 1
          max: 9
          step: 1
          initial: 1
      target:
        expr: sin(x) + sin(3*x)/3 + sin(5*x)/5
        label: Target
    answer:
      matchTarget: true
    hints:
      - The divisors are exactly the harmonic numbers.
      - The nth harmonic has strength 1/n.
    explanation: b = 3 and c = 5. With more and more odd harmonics, each at 1/n, the curve gets ever squarer.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Is this frequency contained in a 1 kHz square wave?
    params:
      buckets:
        - id: b1
          label: Contained
        - id: b2
          label: Missing
      items:
        - label: 1 kHz
          bucket: b1
        - label: 2 kHz
          bucket: b2
        - label: 3 kHz
          bucket: b1
        - label: 4 kHz
          bucket: b2
        - label: 5 kHz
          bucket: b1
        - label: 500 Hz
          bucket: b2
    hints:
      - A symmetric square wave has only odd harmonics.
      - There is nothing below the fundamental.
    explanation: 1, 3, 5, 7 … kHz. The even ones are missing because the upper and lower halves mirror each other.

  - kind: explain
    id: d1
    depth: 2
    body: The **spectrum** shows which frequencies a signal contains and how strongly. A pure sine is a single line. A square wave has a line at every odd harmonic, each weaker than the last.

  - kind: problem
    id: d2
    depth: 2
    widget: match
    prompt: Which spectrum belongs to which signal?
    params:
      pairs:
        - left: Pure sine
          right: One single line
        - left: Square wave
          right: Odd lines, each 1/n
        - left: Sawtooth
          right: All lines, each 1/n
        - left: White noise
          right: Equally strong everywhere
      leftTitle: Signal
      rightTitle: Spectrum
    hints:
      - The sawtooth isn’t symmetric, so it has even lines too.
      - Noise has no fixed period.
    explanation: The shape in the time domain and the spectrum in the frequency domain describe the same signal in two ways.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A square wave jumps between −1 V and +1 V. Its fundamental has an amplitude of 4/π V. How much is that? To two decimal places.
    params:
      unit: V
    answer:
      value: 1.27
      tolerance: 0.006
    hints:
      - π ≈ 3.1416.
      - 4 ÷ 3.1416.
    explanation: ≈ 1.27 V – more than the square wave itself! The harmonics push the peaks back down to 1 V.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Building a square wave from more and more harmonics leaves an overshoot of about 9 % at the jumps. What happens to it with infinitely many harmonics?
    params:
      options:
        - label: It gets ever narrower, but not lower
          correct: true
        - label: It vanishes
          feedback: Its height stays at about 9 %.
        - label: It grows ever taller
          feedback: It stays the same height.
    hints:
      - This is the Gibbs phenomenon.
      - The area under the overshoot tends to zero.
    explanation: The height stays, the width shrinks. The series still converges on average. In images it shows up as rings around sharp edges.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A 1 kHz square wave passes through a filter that lets through frequencies up to 10 kHz only. How many spectral lines get through?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 10
        misconception: all-harmonics
        text: The square wave has only odd harmonics.
    hints:
      - Which harmonics lie below 10 kHz?
      - 1, 3, 5, 7, 9 kHz.
    explanation: "Five lines: 1, 3, 5, 7 and 9 kHz. The result looks like a square wave with rounded edges."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what Fourier’s idea “every signal is a sum of sine waves” means.
    params:
      keywords:
        - - sinus
          - sine
        - - summe
          - sum
          - addier
          - add
          - zusammen
          - together
        - - frequenz
          - frequency
          - vielfach
          - multiple
          - oberton
          - harmonic
        - - spektrum
          - spectrum
          - stärke
          - staerke
          - strength
          - amplitude
      sample: Every periodic signal can be built as a sum of sine waves. The first has the fundamental frequency, the others whole multiples of it, the harmonics. How strong each one is shows in the spectrum. A square wave, for example, is sin x + sin 3x/3 + sin 5x/5 + …
    explanation: "The core: breaking a signal into sines at multiples of the fundamental. Filters, MP3 and JPEG all rely on this."
    difficulty: 3

srs:
  cards_from: ["c2", "d3", "x2"]
