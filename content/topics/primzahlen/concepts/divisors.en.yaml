id: math.primes.divisors
type: concept
title: Finding divisors
summary: Divisors come in pairs.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: teiler-24
    widget: choice
    prompt: Which numbers divide 24 with no remainder? Choose all.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "3", correct: true }
        - { label: "4", correct: true }
        - { label: "5" }
        - { label: "6", correct: true }
        - { label: "8", correct: true }
        - { label: "9" }
    hints:
      - Try 24 divided by each number.
      - Think in pairs – 24 = 3 · 8 = 4 · 6.
    explanation: 3, 4, 6 and 8 – plus 1, 2, 12 and 24.

  - kind: explain
    id: s2
    body: |
      A **divisor** fits with no remainder. Divisors come in **pairs** – 24 = 1 · 24 = 2 · 12 = 3 · 8 = 4 · 6.
      You only need to search up to the middle.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: How many divisors does {{n}} have? Count 1 and {{n}} too.
    params: { unit: divisors }
    answer: { value: "{{d}}" }
    hints:
      - Write the divisors down as pairs.
    explanation: "{{n}} has {{d}} divisors."
    variants:
      params: { n: "choice[12,16,18,20,28,36]" }
      derive: { d: "n == 16 ? 5 : n == 36 ? 9 : 6" }
      defaults: { n: 12 }

  - kind: explain
    id: s4
    body: |
      **Quick rules:** By 2 if the last digit is even. By 5 if it is 0 or 5.
      By 3 if the **digit sum** is divisible by 3.

  - kind: problem
    id: quersumme
    widget: buckets
    prompt: Divisible by 3 or not? Use the digit sum.
    params:
      buckets: [{ label: divisible by 3 }, { label: not divisible }]
      items:
        - { label: "123", bucket: divisible by 3 }
        - { label: "451", bucket: not divisible }
        - { label: "702", bucket: divisible by 3 }
        - { label: "1001", bucket: not divisible }
        - { label: "2841", bucket: divisible by 3 }
        - { label: "577", bucket: not divisible }
    hints:
      - "The digit sum of 123 is 1 + 2 + 3 = 6."
    explanation: Digit sums 6, 10, 9, 2, 15 and 19 – only 6, 9 and 15 are divisible by 3.

  - kind: problem
    id: durch-vier
    widget: choice
    prompt: When is a number divisible by 4?
    params:
      options:
        - { label: If its last two digits are divisible by 4., correct: true }
        - { label: If its digit sum is divisible by 4., feedback: "The digit sum helps with 3 and 9. Try 13 – digit sum 4, but not divisible." }
        - { label: If it ends in 4., feedback: "14 ends in 4 but is not divisible by 4." }
    hints:
      - 100 is divisible by 4. What does that mean for the hundreds?
    explanation: All full hundreds are divisible by 4. Only the last two digits count.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 714 is divisible by 3.
          right: true
        - text: 1,000,002 is divisible by 9.
          right: false
          why: Digit sum 3 – by 3 yes, by 9 no.
        - text: Every number is divisible by 1 and by itself.
          right: true
        - text: 134 is divisible by 4.
          right: false
          why: 34 is not divisible by 4.

  - kind: problem
    id: ma-c1
    widget: rect
    prompt: "Divisors you can touch: drag a rectangle of exactly 12 squares. Each shape shows a divisor pair."
    params:
      maxW: 12
      maxH: 8
      w: 2
      h: 2
      show:
        - area
    check:
      predicate: area == 12
    hints:
      - Which number times which makes 12?
      - For example 3 rows of 4.
    explanation: 1 × 12, 2 × 6 and 3 × 4 – those are the divisor pairs of 12.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many divisors does 72 have?
    answer:
      value: 12
    hints:
      - 72 = 2³ · 3².
      - "For each prime factor: exponent plus 1 – then multiply."
    explanation: (3 + 1) · (2 + 1) = 12. Each divisor picks 0 to 3 twos and 0 to 2 threes.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "**Divisibility rules** can be combined. Divisible by 6 means: by 2 and by 3. Divisible by 9 means: the digit sum is divisible by 9."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: Divisible by 6 or not?
    params:
      buckets:
        - id: b1
          label: divisible by 6
        - id: b2
          label: not divisible
      items:
        - label: "114"
          bucket: b1
        - label: "222"
          bucket: b1
        - label: "732"
          bucket: b1
        - label: "316"
          bucket: b2
        - label: "405"
          bucket: b2
        - label: "1001"
          bucket: b2
    hints:
      - "First check: even?"
      - "Then the digit sum: divisible by 3?"
    explanation: 114, 222 and 732 are even with digit sums 6, 6 and 12. 316 has digit sum 10, 405 is odd, so is 1001.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Which digit goes in the gap so that 4□2 is divisible by 9?
    answer:
      value: 3
    hints:
      - The digit sum must be divisible by 9.
      - 4 + □ + 2 = 9.
    explanation: "4 + 3 + 2 = 9. So 432 is divisible by 9: 432 = 9 · 48."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which numbers have an **odd** number of divisors?
    params:
      options:
        - label: Exactly the square numbers
          correct: true
        - label: Exactly the primes
          feedback: Primes have 2 divisors – that is even.
        - label: Exactly the odd numbers
          feedback: 15 has the divisors 1, 3, 5, 15 – four of them.
    hints:
      - Divisors come in pairs. When is a divisor its own partner?
    explanation: Only when n = d · d does a divisor pair with itself. 36 has 9 divisors.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: The prime factors give the **number of divisors**. 72 = 2³ · 3². Each divisor has 0 to 3 twos and 0 to 2 threes. That makes 4 · 3 = 12 divisors.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: How many divisors does {{2 ** a * 3 ** b}} = $2^{ {{a}} } \cdot 3^{ {{b}} }$ have?
    answer:
      value: "{{(a + 1) * (b + 1)}}"
    feedback:
      - when: numval(state.input) == a * b && a * b != (a + 1) * (b + 1)
        misconception: forgot-zero-exponent
        text: Zero twos or zero threes are allowed too.
    hints:
      - How many twos can a divisor have? 0 to {{a}}.
      - "{{a + 1}} options times {{b + 1}} options."
    explanation: ({{a}} + 1) · ({{b}} + 1) = {{(a + 1) * (b + 1)}} divisors.
    difficulty: 3
    variants:
      params:
        a: int[1,5]
        b: int[1,3]
      defaults:
        a: 3
        b: 1

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: What is the smallest number with exactly 6 divisors?
    answer:
      value: 12
    hints:
      - 6 = 2 · 3 = (1 + 1)(2 + 1).
      - Try $2^2 \cdot 3$.
    explanation: 12 has the divisors 1, 2, 3, 4, 6, 12. All smaller numbers have fewer.
    difficulty: 3

srs:
  cards_from: [anzahl, quersumme]
