id: math.primes.riddles
type: concept
title: Primzahl-Rätsel
summary: Zwillinge, Lücken und offene Fragen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Lieblingsspalten
    body: Primzahlen wirken zufällig – oder doch nicht? Die Tafel hat 6 Spalten. Tippe alle Primzahlen bis 30 an. In welchen Spalten landen sie fast immer? Ein überraschendes **Muster**!
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 5
        cols: 6
        numbers:
          start: 1
        counter: true

  - kind: problem
    id: zwillinge
    widget: choice
    prompt: Primzahlzwillinge liegen nur 2 auseinander, wie 11 und 13. Welches Paar ist auch ein Zwilling?
    params:
      layout: grid
      options:
        - { label: 17 und 19, correct: true }
        - { label: 23 und 25, feedback: "25 = 5 · 5 ist keine Primzahl." }
        - { label: 31 und 33, feedback: "33 = 3 · 11." }
        - { label: 7 und 9, feedback: "9 = 3 · 3." }
    hints:
      - Prüfe die größere Zahl auf Teiler.
    explanation: 17 und 19 sind beide prim.

  - kind: explain
    id: s2
    body: |
      **Goldbach** vermutete 1742: Jede gerade Zahl über 2 ist die Summe zweier Primzahlen. 10 = 3 + 7.
      Bewiesen ist das bis heute nicht.

  - kind: problem
    id: goldbach
    widget: numeric
    prompt: "{{n}} = 7 + ? – welche Primzahl fehlt?"
    params: { placeholder: "Primzahl" }
    answer: { value: "{{n - 7}}" }
    hints:
      - "Rechne {{n}} − 7."
    explanation: "{{n}} = 7 + {{n - 7}}."
    variants:
      params: { n: "choice[10,12,14,18,20,24,30]" }
      defaults: { n: 18 }

  - kind: problem
    id: luecke
    widget: choice
    prompt: Gibt es zwischen 90 und 96 eine Primzahl?
    params:
      options:
        - { label: Nein, correct: true }
        - { label: Ja, feedback: "91 = 7 · 13, 93 = 3 · 31, 95 = 5 · 19. Die geraden fallen ohnehin weg." }
    hints:
      - Prüfe 91, 93 und 95.
    explanation: Alle sind zusammengesetzt. Primzahlen werden mit der Zeit seltener.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 2 ist die einzige gerade Primzahl.
          right: true
        - text: Alle ungeraden Zahlen sind Primzahlen.
          right: false
          why: 9 = 3 · 3 ist ungerade und nicht prim.
        - text: 91 ist eine Primzahl.
          right: false
          why: 91 = 7 · 13.
        - text: 97 ist die größte zweistellige Primzahl.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Finde fünf aufeinanderfolgende Zahlen ohne Primzahl. Die kleinste solche Folge beginnt bei …?
    answer:
      value: 24
    hints:
      - Such nach zwei Primzahlen, die 6 auseinanderliegen und nichts dazwischen haben.
    explanation: 24, 25, 26, 27, 28 – zwischen 23 und 29 ist keine Primzahl.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: Auf wie viele Arten lässt sich 30 als Summe zweier Primzahlen schreiben? Die Reihenfolge zählt nicht.
    answer:
      value: 3
    hints:
      - Probiere 30 − p für jede Primzahl p bis 15.
      - 7 + 23 passt. Was noch?
    explanation: 7 + 23, 11 + 19, 13 + 17. Je größer die Zahl, desto mehr Goldbach-Zerlegungen gibt es meist.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Jede Primzahl über 3 liegt direkt neben einem **Vielfachen von 6**: 5 und 7 neben 6, 11 und 13 neben 12. Alle anderen Zahlen sind durch 2 oder 3 teilbar."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Liegt die Primzahl eins unter oder eins über einem Vielfachen von 6?
    params:
      buckets:
        - id: b1
          label: eins darunter (6k − 1)
        - id: b2
          label: eins darüber (6k + 1)
      items:
        - label: "29"
          bucket: b1
        - label: "41"
          bucket: b1
        - label: "47"
          bucket: b1
        - label: "31"
          bucket: b2
        - label: "37"
          bucket: b2
        - label: "43"
          bucket: b2
    hints:
      - Welches Vielfache von 6 liegt am nächsten?
      - 30, 36, 42 und 48.
    explanation: 29 = 30 − 1, 41 = 42 − 1, 47 = 48 − 1. 31 = 30 + 1, 37 = 36 + 1, 43 = 42 + 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie viele Primzahlen gibt es ungefähr unter einer großen Zahl n?
    params:
      options:
        - label: Etwa n / ln(n)
          correct: true
        - label: Etwa n / 2
          feedback: Schon unter 100 sind es nur 25.
        - label: Etwa √n
          feedback: Unter 100 wären das 10 – es sind aber 25.
    hints:
      - Primzahlen werden seltener – aber langsam.
    explanation: Das ist der **Primzahlsatz**, bewiesen 1896. Unter einer Million sagt er 72 382 voraus, wirklich sind es 78 498.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Die Zahlen $10! + 2$, $10! + 3$, …, $10! + 10$ sind alle zusammengesetzt. Wie viele aufeinanderfolgende Nicht-Primzahlen sind das?
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 10
        misconception: off-by-one
        text: Zähle von 2 bis 10 – das sind 9 Zahlen.
    hints:
      - $10! + k$ ist durch k teilbar.
      - k läuft von 2 bis 10.
    explanation: Neun Zahlen ohne Primzahl. Mit n! baut man beliebig lange Lücken – Primzahlen haben riesige Abstände.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Gibt es unendlich viele Primzahlzwillinge?
    params:
      options:
        - label: Ja, das hat Euklid bewiesen
          feedback: "Euklid bewies nur: unendlich viele Primzahlen."
        - label: Nein, ab einer Grenze gibt es keine mehr
          feedback: Das ist nicht bekannt – man vermutet das Gegenteil.
        - label: "Unbekannt – bewiesen ist: unendlich viele Paare mit Abstand höchstens 246"
          correct: true
    hints:
      - Das ist eine berühmte offene Frage.
      - "2013 gelang ein Durchbruch: ein fester maximaler Abstand."
    explanation: Zhang Yitang bewies 2013 einen Abstand unter 70 Millionen. Gemeinsame Arbeit drückte ihn auf 246. Der Abstand 2 ist offen.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: Die **Riemannsche Vermutung** beschreibt, wie gleichmäßig Primzahlen verteilt sind. Sie ist seit 1859 offen. Für einen Beweis gibt es eine Million Dollar Preisgeld.

srs:
  cards_from: [zwillinge, goldbach]
