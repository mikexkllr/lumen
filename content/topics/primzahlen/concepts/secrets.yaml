id: math.primes.secrets
type: concept
title: Primzahlen schützen Geheimnisse
summary: Leicht multipliziert, schwer zerlegt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: mal
    widget: numeric
    prompt: Multipliziere – {{p}} · {{q}}.
    params: { placeholder: "Produkt" }
    answer: { value: "{{p * q}}" }
    hints:
      - Zerlege eine Zahl, zum Beispiel {{q}} = 10 + {{q - 10}}.
    explanation: "{{p}} · {{q}} = {{p * q}}."
    variants:
      params: { p: "choice[11,13,17,19]", q: "choice[23,29,31,37]" }
      defaults: { p: 13, q: 17 }

  - kind: problem
    id: zerlegen
    widget: choice
    prompt: 221 ist das Produkt zweier Primzahlen. Welcher Faktor steckt darin?
    params:
      layout: grid
      options:
        - { label: "13", correct: true }
        - { label: "7", feedback: "221 : 7 geht nicht auf." }
        - { label: "11", feedback: "221 : 11 geht nicht auf." }
        - { label: "3", feedback: "Die Quersumme 5 ist nicht durch 3 teilbar." }
    hints:
      - Probiere die Primzahlen der Reihe nach.
    explanation: 221 = 13 · 17. Zurückrechnen dauert viel länger als Malnehmen.

  - kind: explain
    body: |
      Darauf beruht viel Verschlüsselung: Zwei riesige Primzahlen multipliziert man in Millisekunden.
      Das Produkt zurück zu zerlegen würde Jahrtausende dauern.

  - kind: problem
    id: zikaden
    widget: numeric
    prompt: Zikaden schlüpfen alle 13 oder 17 Jahre. Nach wie vielen Jahren schlüpfen beide Arten wieder gleichzeitig?
    params: { unit: Jahre }
    answer: { value: 221 }
    hints:
      - Das kleinste gemeinsame Vielfache von zwei Primzahlen ist ihr Produkt.
    explanation: 13 · 17 = 221 Jahre. Primzahl-Zyklen treffen selten auf Feinde mit kürzeren Zyklen.

srs:
  cards_from: [mal, zerlegen]
