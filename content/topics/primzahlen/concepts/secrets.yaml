id: math.primes.secrets
type: concept
title: Primzahlen schützen Geheimnisse
summary: Leicht multipliziert, schwer zerlegt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Schloss aus Primzahlen
    body: "Wenn du online bezahlst, schützen Primzahlen deine Daten. Deck auf, wie eine geheime Nachricht sicher ankommt. Der Trick: **Malnehmen ist leicht**, Zerlegen ist schwer."
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔓
            front: Das offene Schloss
            back: Anna verteilt offene Vorhängeschlösser – jeder darf eins zuschnappen lassen.
          - icon: 📦
            front: Die Kiste
            back: Ben legt seine Nachricht in eine Kiste und lässt Annas Schloss zuschnappen.
          - icon: 🔑
            front: Der Schlüssel
            back: Nur Anna hat den Schlüssel – nicht einmal Ben kann die Kiste wieder öffnen.
          - icon: 🔢
            front: Die Mathematik
            back: Das Schloss ist ein Produkt zweier riesiger Primzahlen, den Schlüssel baut man aus den Primzahlen selbst.

  - kind: problem
    id: mal
    widget: numeric
    prompt: Multipliziere – {{p}} · {{q}}.
    params: { placeholder: "Produkt" }
    answer: { value: "{{p * q}}" }
    hints:
      - Zerlege eine Zahl, zum Beispiel {{q}} = 10 + {{q - 10}}.
    explanation: "{{p}} · {{q}} = {{p * q}}."
    variants:
      params: { p: "choice[11,13,17,19]", q: "choice[23,29,31,37]" }
      defaults: { p: 13, q: 17 }

  - kind: problem
    id: zerlegen
    widget: choice
    prompt: 221 ist das Produkt zweier Primzahlen. Welcher Faktor steckt darin?
    params:
      layout: grid
      options:
        - { label: "13", correct: true }
        - { label: "7", feedback: "221 : 7 geht nicht auf." }
        - { label: "11", feedback: "221 : 11 geht nicht auf." }
        - { label: "3", feedback: "Die Quersumme 5 ist nicht durch 3 teilbar." }
    hints:
      - Probiere die Primzahlen der Reihe nach.
    explanation: 221 = 13 · 17. Zurückrechnen dauert viel länger als Malnehmen.

  - kind: explain
    id: s3
    body: |
      Darauf beruht viel **Verschlüsselung**: Zwei riesige Primzahlen multipliziert man in Millisekunden.
      Das Produkt zurück zu zerlegen würde Jahrtausende dauern.

  - kind: problem
    id: zikaden
    widget: numeric
    prompt: Zikaden schlüpfen alle 13 oder 17 Jahre. Nach wie vielen Jahren schlüpfen beide Arten wieder gleichzeitig?
    params: { unit: Jahre }
    answer: { value: 221 }
    hints:
      - Das kleinste gemeinsame Vielfache von zwei Primzahlen ist ihr Produkt.
    explanation: 13 · 17 = 221 Jahre. Primzahl-Zyklen treffen selten auf Feinde mit kürzeren Zyklen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 437 ist das Produkt zweier Primzahlen nahe 20. Wie heißt die kleinere?
    answer:
      value: 19
    hints:
      - 437 = 441 − 4 = 21² − 2².
    explanation: (21 − 2) · (21 + 2) = 19 · 23. Liegen die Faktoren nah beieinander, ist ein Schlüssel leicht zu knacken.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Bei der **Modulo-Rechnung** zählt nur der Rest. 17 Uhr ist 5 Uhr auf dem Zifferblatt: 17 mod 12 = 5. Verschlüsselung rechnet genau so – nur mit riesigen Zahlen."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Berechne {{a}} mod {{m}}, also den Rest von {{a}} : {{m}}."
    answer:
      value: "{{a % m}}"
    feedback:
      - when: numval(state.input) == floor(a / m) && floor(a / m) != a % m
        misconception: quotient-not-remainder
        text: Das ist, wie oft {{m}} hineinpasst. Gesucht ist der Rest.
    hints:
      - Wie oft passt {{m}} in {{a}}?
      - "{{floor(a / m)}} · {{m}} = {{floor(a / m) * m}}. Was bleibt?"
    explanation: "{{a}} = {{floor(a / m)}} · {{m}} + {{a % m}}. Der Rest ist {{a % m}}."
    difficulty: 2
    variants:
      params:
        a: int[20,99]
        m: choice[5,7,12]
      defaults:
        a: 47
        m: 12

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: "Caesar verschob jeden Buchstaben um 3: Aus A wird D. Was wird aus X?"
    params:
      options:
        - label: A
          correct: true
        - label: Z
          feedback: Das ist nur zwei weiter.
        - label: B
          feedback: Nach Z geht es bei A weiter – B ist eins zu weit.
        - label: U
          feedback: Das ist drei zurück.
    hints:
      - "Zähle weiter: Y, Z, …"
      - Nach Z beginnt das Alphabet von vorn.
    explanation: X → Y → Z → A. Das ist Rechnen modulo 26.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist RSA-Verschlüsselung sicher?
    params:
      options:
        - label: Weil niemand ein schnelles Verfahren kennt, riesige Zahlen zu zerlegen
          correct: true
        - label: Weil bewiesen ist, dass Zerlegen unmöglich ist
          feedback: Es ist möglich, nur extrem langsam. Ein Beweis fehlt bis heute.
        - label: Weil die Primzahlen geheim gehalten werden und niemand sie finden kann
          feedback: Geheim sind sie – sicher ist es aber nur, weil das Produkt sie nicht verrät.
    hints:
      - Ist »schwer« dasselbe wie »bewiesen unmöglich«?
    explanation: Die Sicherheit ist eine Vermutung. Ein großer Quantencomputer könnte mit Shors Algorithmus schnell zerlegen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum eignen sich Primzahlen für Verschlüsselung?"
    params:
      keywords:
        - - multiplizier
          - malnehmen
          - produkt
          - multiply
          - product
        - - zerleg
          - faktor
          - factor
          - rückwärts
          - undo
          - reverse
        - - schwer
          - lange
          - langsam
          - hard
          - slow
          - long
      sample: Zwei große Primzahlen lassen sich schnell multiplizieren. Das Produkt wieder in seine Faktoren zu zerlegen dauert aber extrem lange – das ist schwer.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Bei RSA ist der **öffentliche Schlüssel** das Produkt n = p · q. Geheim bleibt (p − 1)(q − 1). Wer n nicht zerlegen kann, kennt diese Zahl nicht – und kann nicht entschlüsseln.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Mini-RSA mit n = 33 und dem Schlüssel e = 3. Verschlüssle die Nachricht 4: Berechne $4^3 \\bmod 33$."
    answer:
      value: 31
    feedback:
      - when: numval(state.input) == 64
        misconception: forgot-mod
        text: Jetzt noch der Rest beim Teilen durch 33.
    hints:
      - $4^3 = 64$.
      - 64 − 33 = ?
    explanation: 64 = 1 · 33 + 31. Die verschlüsselte Nachricht ist 31.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: "Entschlüssle mit dem geheimen Schlüssel d = 7: $31^7 \\bmod 33$. Tipp: 31 ist dasselbe wie −2."
    answer:
      value: 4
    hints:
      - $(-2)^7 = -128$.
      - "Addiere Vielfache von 33, bis du bei 0 bis 32 landest: −128 + 132."
    explanation: −128 + 4 · 33 = 4. Die Nachricht 4 ist zurück! Das klappt, weil 3 · 7 = 21 bei (3 − 1)(11 − 1) = 20 den Rest 1 lässt.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: choice
    prompt: Warum könnten Quantencomputer RSA gefährden?
    params:
      options:
        - label: Mit dem Shor-Algorithmus könnten sie große Zahlen schnell zerlegen
          correct: true
        - label: Sie können alle Schlüssel gleichzeitig ausprobieren
          feedback: So einfach ist es nicht – sie brauchen einen speziellen Algorithmus.
        - label: Sie rechnen ohne Primzahlen
          feedback: Auch Quantencomputer rechnen mit denselben Zahlen.
    hints:
      - Worauf beruht die Sicherheit von RSA?
      - Auf der Schwierigkeit des Zerlegens.
    explanation: Shor fand 1994 einen Quanten-Algorithmus zum schnellen Zerlegen. Darum entwickelt man schon heute neue Verfahren.
    difficulty: 3

srs:
  cards_from: [mal, zerlegen]
