id: math.primes.factor
type: concept
title: Primfaktoren, ggT und kgV
summary: Jede Zahl hat einen Bauplan.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: zerlegung
    widget: choice
    prompt: Welche Zerlegung von 36 besteht nur aus Primzahlen?
    params:
      options:
        - { label: "2 · 2 · 3 · 3", correct: true }
        - { label: "4 · 9", feedback: "4 und 9 lassen sich noch weiter zerlegen." }
        - { label: "6 · 6", feedback: "6 ist keine Primzahl – 6 = 2 · 3." }
        - { label: "2 · 18", feedback: "18 ist keine Primzahl." }
    hints:
      - Zerlege so lange, bis nichts mehr geht.
    explanation: 36 = 2 · 2 · 3 · 3. Weiter geht es nicht.

  - kind: explain
    id: s2
    body: |
      Jede Zahl über 1 lässt sich **auf genau eine Art** in Primfaktoren zerlegen – wie ein Bauplan.
      Zum Beispiel 60 = 2 · 2 · 3 · 5.

  - kind: problem
    id: fehlt
    widget: numeric
    prompt: "{{a}} = 2 · 2 · 5 · ? – welche Primzahl fehlt?"
    params: { placeholder: "?" }
    answer: { value: "{{x}}" }
    hints:
      - Teile {{a}} durch 20.
    explanation: "{{a}} : 20 = {{x}}."
    variants:
      params: { x: "choice[3,7,11,13,17]" }
      derive: { a: "20 * x" }
      defaults: { x: 7 }

  - kind: explain
    id: s4
    body: |
      Der **ggT** nimmt die gemeinsamen Primfaktoren.
      12 = 2 · 2 · 3 und 18 = 2 · 3 · 3 teilen sich 2 · 3. Ihr ggT ist also 6.

  - kind: problem
    id: ggt
    widget: numeric
    prompt: Was ist der größte gemeinsame Teiler von {{a}} und {{b}}?
    params: { placeholder: "ggT" }
    answer: { value: "{{gcd(a, b)}}" }
    feedback:
      - when: "numval(state.input) == lcm(a, b)"
        misconception: lcm-for-gcd
        text: Das ist das kleinste gemeinsame Vielfache. Gesucht ist der größte Teiler.
    hints:
      - Zerlege beide Zahlen in Primfaktoren.
    explanation: "ggT({{a}}, {{b}}) = {{gcd(a, b)}}."
    variants:
      params: { g: "int[2,7]", p: "choice[2,3,5]", q: "choice[7,11]" }
      derive: { a: "g * p", b: "g * q" }
      defaults: { g: 6, p: 2, q: 7 }

  - kind: problem
    id: busse
    widget: numeric
    prompt: Bus A fährt alle {{p}} Minuten, Bus B alle {{q}} Minuten. Beide starten jetzt. Wann starten sie wieder gleichzeitig?
    params: { unit: Minuten }
    answer: { value: "{{lcm(p, q)}}" }
    feedback:
      - when: "numval(state.input) == p * q && p * q != lcm(p, q)"
        misconception: product-not-lcm
        text: Dann treffen sie sich auch – aber nicht zum ersten Mal.
    hints:
      - Schreib die Abfahrtszeiten beider Busse auf.
    explanation: Das kleinste gemeinsame Vielfache – nach {{lcm(p, q)}} Minuten.
    variants:
      params: { p: "choice[6,8,10,12]", q: "choice[9,15,20]" }
      defaults: { p: 6, q: 9 }

  - kind: problem
    id: c1
    widget: match
    prompt: Welche Zerlegung gehört zu welcher Zahl?
    params:
      pairs:
        - left: 2 · 2 · 7
          right: "28"
        - left: 2 · 3 · 7
          right: "42"
        - left: 3 · 3 · 5
          right: "45"
        - left: 2 · 2 · 2 · 7
          right: "56"
        - left: 2 · 5 · 5
          right: "50"
    hints:
      - Multipliziere die Faktoren aus.
    explanation: Jede Zahl hat genau eine Primfaktorzerlegung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: ggT(84, 126) = 42. Wie groß ist das kgV von 84 und 126?
    answer:
      value: 252
    hints:
      - Es gilt ggT · kgV = a · b.
    explanation: "84 · 126 : 42 = 252."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: tiles
    prompt: Lege die Primfaktorzerlegung von 90 – die Faktoren der Größe nach.
    params:
      tiles:
        - "2"
        - "3"
        - "3"
        - "5"
        - ·
        - ·
        - ·
        - "9"
        - "10"
        - "6"
      slots: 7
    answer:
      sequence:
        - "2"
        - ·
        - "3"
        - ·
        - "3"
        - ·
        - "5"
    hints:
      - 90 = 9 · 10. Zerlege beide weiter.
      - 9 = 3 · 3 und 10 = 2 · 5.
    explanation: 90 = 2 · 3 · 3 · 5. 9, 10 und 6 sind keine Primzahlen.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: Das **kgV** nimmt jeden Primfaktor so oft, wie er höchstens vorkommt. 12 = 2 · 2 · 3 und 18 = 2 · 3 · 3. Also kgV = 2 · 2 · 3 · 3 = 36.

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Was ist das kleinste gemeinsame Vielfache von {{a}} und {{b}}?
    answer:
      value: "{{lcm(a, b)}}"
    feedback:
      - when: numval(state.input) == a * b && gcd(a, b) > 1
        misconception: product-not-lcm
        text: Das ist ein gemeinsames Vielfaches – aber nicht das kleinste.
    hints:
      - Zerlege beide in Primfaktoren.
      - "Oder: {{a}} · {{b}} : ggT = {{a * b}} : {{gcd(a, b)}}."
    explanation: kgV({{a}}, {{b}}) = {{lcm(a, b)}}.
    difficulty: 2
    variants:
      params:
        a: choice[4,6,8,9,10,12]
        b: choice[6,9,14,15,16,21]
      constraints:
        - a != b
      defaults:
        a: 12
        b: 15

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Zwei Zahnräder mit 12 und 18 Zähnen greifen ineinander. Nach wie vielen Umdrehungen des kleinen Rades stehen beide wieder wie am Anfang?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 36
        misconception: teeth-not-turns
        text: 36 Zähne müssen vorbeiwandern. Wie viele Umdrehungen sind das beim kleinen Rad?
    hints:
      - Wie viele Zähne müssen vorbeilaufen? kgV(12, 18).
      - "36 Zähne : 12 Zähne pro Umdrehung."
    explanation: kgV(12, 18) = 36. Das kleine Rad dreht sich 3-mal, das große 2-mal.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Der euklidische Algorithmus: ggT(1071, 462). Teile immer mit Rest weiter. Was kommt heraus?"
    answer:
      value: 21
    hints:
      - 1071 = 2 · 462 + 147. Weiter mit 462 und 147.
      - 462 = 3 · 147 + 21 und 147 = 7 · 21.
    explanation: "Der letzte Rest ungleich null ist der ggT: 21. Das Verfahren braucht keine Primfaktoren und ist blitzschnell."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Dass jede Zahl genau eine Zerlegung hat, heißt **Hauptsatz der Arithmetik**. Selbstverständlich ist er nicht. In manchen Zahlbereichen gibt es zwei: 6 = 2 · 3 = (1 + √−5)(1 − √−5)."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Wie viele Nullen stehen am Ende von $20! = 1 \cdot 2 \cdot 3 \cdots 20$?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: too-few-fives
        text: "Zähle alle Fünfen: 5, 10, 15 und 20 liefern je eine."
    hints:
      - Jede Null am Ende braucht ein Paar 2 · 5.
      - Zweien gibt es genug. Zähle die Fünfen.
    explanation: 5, 10, 15, 20 – vier Fünfen, also vier Nullen. 20! = 2 432 902 008 176 640 000.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man mit Primfaktoren den ggT von 12 und 18 findet.
    params:
      keywords:
        - - primfaktor
          - zerleg
          - prime
          - factor
        - - gemeinsam
          - beide
          - common
          - both
          - shared
        - - sechs
          - six
          - 2 · 3
          - 2·3
      sample: "Ich zerlege beide Zahlen: 12 = 2 · 2 · 3 und 18 = 2 · 3 · 3. Gemeinsam haben beide eine 2 und eine 3. Der ggT ist also 2 · 3 = 6."
    explanation: "Kernidee: Der ggT besteht genau aus den gemeinsamen Primfaktoren."
    difficulty: 3

srs:
  cards_from: [ggt, busse]
