id: math.primes.sieve
type: concept
title: Das Sieb des Eratosthenes
summary: Primzahlen finden durch Streichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Muster in der Zahlentafel
    body: Primzahlen wirken wild verstreut – ihre Vielfachen dagegen bilden Muster. Tippe in der Tafel alle Vielfachen von 3 an. Welches Muster entsteht? Zahlen, die nie getroffen werden, sind Kandidaten für **Primzahlen**.
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 3
        cols: 10
        numbers:
          start: 1
        counter: true

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Primzahlen gibt es unter 100?"
    params:
      min: 0
      max: 100
    answer:
      value: 25
      tolerance: 4
    explanation: Genau 25. Je größer die Zahlen, desto seltener werden Primzahlen.

  - kind: problem
    id: welche-prim
    widget: choice
    prompt: Welche dieser Zahlen ist eine Primzahl?
    params:
      layout: grid
      options:
        - { label: "53", correct: true }
        - { label: "51", feedback: "51 = 3 · 17. Die Quersumme 6 verrät es." }
        - { label: "57", feedback: "57 = 3 · 19." }
        - { label: "91", feedback: "91 = 7 · 13 – eine beliebte Falle." }
    hints:
      - Prüfe die Teiler 3 und 7.
    explanation: 53 hat nur die Teiler 1 und 53.

  - kind: explain
    id: s2
    body: |
      Eine **Primzahl** hat genau zwei Teiler – die 1 und sich selbst.
      Die 1 ist keine Primzahl. Sie hat nur einen Teiler.

  - kind: explain
    id: s3
    body: |
      Das **Sieb des Eratosthenes:** Streiche alle Vielfachen von 2, dann von 3, dann von 5.
      Was übrig bleibt, ist prim. Bis 30 genügen diese drei.

  - kind: problem
    id: sieb
    widget: pixels
    prompt: Markiere alle Primzahlen von 1 bis 30.
    params: { numbers: { start: 1 }, cells: ["..........", "..........", ".........."], counter: true }
    answer: { pattern: [".##.#.#...", "#.#...#.#.", "..#.....#."] }
    feedback:
      - when: "onLabels.includes(1)"
        misconception: one-is-prime
        text: Die 1 ist keine Primzahl. Sie hat nur einen Teiler.
      - when: "onLabels.includes(9) || onLabels.includes(15) || onLabels.includes(21) || onLabels.includes(25) || onLabels.includes(27)"
        misconception: odd-is-prime
        text: Nicht jede ungerade Zahl ist prim. Prüfe die Vielfachen von 3 und 5.
    hints:
      - Von den geraden Zahlen ist nur die 2 prim.
      - Streiche 9, 15, 21, 25 und 27.
    explanation: 2, 3, 5, 7, 11, 13, 17, 19, 23 und 29 – zehn Primzahlen.

  - kind: problem
    id: bis-zwanzig
    widget: numeric
    prompt: Wie viele Primzahlen gibt es von 1 bis 20?
    params: { unit: Primzahlen }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 9"
        misconception: one-is-prime
        text: Zählst du die 1 mit? Sie ist keine Primzahl.
    hints:
      - Nutze dein Sieb von eben.
    explanation: 2, 3, 5, 7, 11, 13, 17 und 19.

  - kind: explain
    id: s6
    body: Gibt es eine größte Primzahl?
    reveal:
      body: Nein. Euklid bewies vor über 2000 Jahren, dass es unendlich viele gibt. Die größte bekannte hat über 41 Millionen Stellen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ist 221 eine Primzahl, musst du nur Teiler bis zu einer bestimmten Zahl testen. Bis zu welcher ganzen Zahl?
    answer:
      value: 14
    hints:
      - Der kleinere Teiler eines Paares ist höchstens die Wurzel.
    explanation: "√221 ≈ 14,9. Bei 13 wirst du fündig: 221 = 13 · 17."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Warum reicht es, bis zur **Wurzel** zu prüfen? Teiler kommen in Paaren. Ist einer größer als √n, muss sein Partner kleiner sein. Bei 91 reicht es, bis 9 zu testen.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Ist 91 eine Primzahl? Gib ihren kleinsten Teiler größer als 1 an.
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 91
        misconception: looks-prime
        text: 91 sieht prim aus – ist es aber nicht. Teste 7.
    hints:
      - Nicht durch 2, 3 oder 5 teilbar. Was kommt als Nächstes?
      - 7 · 13 = ?
    explanation: "91 = 7 · 13. Eine typische Falle: Sie ist ungerade, endet nicht auf 5 und hat Quersumme 10."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Primzahl oder nicht?
    params:
      buckets:
        - id: b1
          label: Primzahl
        - id: b2
          label: zusammengesetzt
      items:
        - label: "127"
          bucket: b1
        - label: "137"
          bucket: b1
        - label: "119"
          bucket: b2
        - label: "121"
          bucket: b2
        - label: "133"
          bucket: b2
        - label: "143"
          bucket: b2
    hints:
      - Teste 7, 11 und 13.
      - 119 = 7 · 17, 121 = 11 · 11.
    explanation: 127 und 137 sind prim. 119 = 7 · 17, 121 = 11², 133 = 7 · 19, 143 = 11 · 13.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Du willst alle Primzahlen bis 120 sieben. Bis zu welcher Primzahl musst du Vielfache streichen?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 11
        misconception: one-too-far
        text: 11 · 11 = 121 liegt schon über 120. Die 11 brauchst du nicht.
    hints:
      - Welche Primzahl hat ein Quadrat unter 120?
      - 7² = 49, 11² = 121.
    explanation: Jede zusammengesetzte Zahl bis 120 hat einen Primfaktor höchstens √120 ≈ 11. Also reichen 2, 3, 5 und 7.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: "Euklids Beweis: Es gibt unendlich viele Primzahlen. Ordne die Schritte."
    params:
      items:
        - label: Angenommen, es gäbe nur endlich viele Primzahlen.
        - label: Multipliziere alle und addiere 1.
        - label: Diese Zahl lässt bei jeder der Primzahlen den Rest 1.
        - label: Sie hat also einen Primfaktor, der nicht auf der Liste steht.
        - label: Widerspruch – die Liste war nicht vollständig.
    hints:
      - "Es ist ein Widerspruchsbeweis: Er beginnt mit einer Annahme."
    explanation: Der Beweis ist über 2000 Jahre alt und gilt als einer der schönsten der Mathematik.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Euklids Trick: Rechne $2 \\cdot 3 \\cdot 5 \\cdot 7 + 1$."
    answer:
      value: 211
    hints:
      - $2 \cdot 3 \cdot 5 \cdot 7 = 210$.
      - Plus 1.
    explanation: 211 lässt bei 2, 3, 5 und 7 jeweils den Rest 1. Es ist selbst prim.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: $2 \cdot 3 \cdot 5 \cdot 7 \cdot 11 \cdot 13 + 1 = 30031 = 59 \cdot 509$. Widerlegt das Euklids Beweis?
    params:
      options:
        - label: Ja – die Zahl ist nicht prim
          feedback: Der Beweis behauptet nicht, dass die Zahl prim ist.
        - label: Nein – 59 und 509 sind neue Primzahlen, die nicht in der Liste stehen
          correct: true
        - label: Nein, weil 30031 doch prim ist
          feedback: 59 · 509 = 30031.
    hints:
      - Was genau zeigt der Beweis?
      - "Er zeigt: Es gibt einen Primfaktor außerhalb der Liste."
    explanation: Die Zahl hat Primfaktoren, die keine der Listen-Primzahlen sind. Also war die Liste unvollständig – der Beweis hält.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: Primzahlen werden seltener, aber sie gehen nie aus. Zwischen n und 2n liegt immer mindestens eine. Das ist das **Bertrandsche Postulat**, 1852 von Tschebyschow bewiesen.

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man beim Primzahltest nur bis zur Wurzel prüfen muss.
    params:
      keywords:
        - - paar
          - pair
          - partner
        - - wurzel
          - root
        - - klein
          - kleiner
          - smaller
          - small
          - at most
          - höchstens
      sample: Teiler kommen in Paaren. Wenn beide größer als die Wurzel wären, wäre ihr Produkt zu groß. Also ist einer immer kleiner oder gleich der Wurzel – den findet man vorher.
    explanation: "Kernidee: In jedem Teilerpaar ist ein Partner höchstens √n."
    difficulty: 3

srs:
  cards_from: [welche-prim, bis-zwanzig]
