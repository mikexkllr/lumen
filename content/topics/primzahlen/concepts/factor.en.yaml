id: math.primes.factor
type: concept
title: Prime factors, GCD and LCM
summary: Every number has a blueprint.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Breaking down to the core
    body: Every number is built from primes – like a house from bricks. Uncover step by step how 84 falls apart. In the end, only **prime factors** are left.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🧱
            front: 84 = 2 · 42
            back: 84 is even, so 2 fits – and 42 can be split further.
          - icon: 🔨
            front: 42 = 2 · 21
            back: 42 is even too – another 2 pops out.
          - icon: ⛏️
            front: 21 = 3 · 7
            back: "The digit sum 3 gives it away: 21 is divisible by 3."
          - icon: 💎
            front: 84 = 2 · 2 · 3 · 7
            back: All primes – you cannot go further, and no other split exists.

  - kind: problem
    id: zerlegung
    widget: choice
    prompt: Which factorization of 36 uses only primes?
    params:
      options:
        - { label: "2 · 2 · 3 · 3", correct: true }
        - { label: "4 · 9", feedback: "4 and 9 can be broken down further." }
        - { label: "6 · 6", feedback: "6 is not a prime – 6 = 2 · 3." }
        - { label: "2 · 18", feedback: "18 is not a prime." }
    hints:
      - Keep breaking down until you can't go on.
    explanation: 36 = 2 · 2 · 3 · 3. You can't go further.

  - kind: explain
    id: s2
    body: |
      Every number above 1 can be broken into **prime factors** in **exactly one way** – like a blueprint.
      For example, 60 = 2 · 2 · 3 · 5.

  - kind: problem
    id: fehlt
    widget: numeric
    prompt: "{{a}} = 2 · 2 · 5 · ? – which prime is missing?"
    params: { placeholder: "?" }
    answer: { value: "{{x}}" }
    hints:
      - Divide {{a}} by 20.
    explanation: "{{a}} ÷ 20 = {{x}}."
    variants:
      params: { x: "choice[3,7,11,13,17]" }
      derive: { a: "20 * x" }
      defaults: { x: 7 }

  - kind: explain
    id: s4
    body: |
      The **GCD** takes the shared prime factors.
      12 = 2 · 2 · 3 and 18 = 2 · 3 · 3 share 2 · 3. So their GCD is 6.

  - kind: problem
    id: ggt
    widget: numeric
    prompt: What is the greatest common divisor of {{a}} and {{b}}?
    params: { placeholder: "GCD" }
    answer: { value: "{{gcd(a, b)}}" }
    feedback:
      - when: "numval(state.input) == lcm(a, b)"
        misconception: lcm-for-gcd
        text: That is the least common multiple. You need the greatest divisor.
    hints:
      - Break both numbers into prime factors.
    explanation: "GCD({{a}}, {{b}}) = {{gcd(a, b)}}."
    variants:
      params: { g: "int[2,7]", p: "choice[2,3,5]", q: "choice[7,11]" }
      derive: { a: "g * p", b: "g * q" }
      defaults: { g: 6, p: 2, q: 7 }

  - kind: problem
    id: busse
    widget: numeric
    prompt: Bus A runs every {{p}} minutes, bus B every {{q}} minutes. Both leave now. When do they leave together again?
    params: { unit: minutes }
    answer: { value: "{{lcm(p, q)}}" }
    feedback:
      - when: "numval(state.input) == p * q && p * q != lcm(p, q)"
        misconception: product-not-lcm
        text: They also meet then – but not for the first time.
    hints:
      - Write down the departure times of both buses.
    explanation: The least common multiple – after {{lcm(p, q)}} minutes.
    variants:
      params: { p: "choice[6,8,10,12]", q: "choice[9,15,20]" }
      defaults: { p: 6, q: 9 }

  - kind: problem
    id: c1
    widget: match
    prompt: Which factorisation belongs to which number?
    params:
      pairs:
        - left: 2 · 2 · 7
          right: "28"
        - left: 2 · 3 · 7
          right: "42"
        - left: 3 · 3 · 5
          right: "45"
        - left: 2 · 2 · 2 · 7
          right: "56"
        - left: 2 · 5 · 5
          right: "50"
    hints:
      - Multiply the factors out.
    explanation: Every number has exactly one prime factorisation.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: gcd(84, 126) = 42. How large is the lcm of 84 and 126?
    answer:
      value: 252
    hints:
      - We have gcd · lcm = a · b.
    explanation: 84 · 126 ÷ 42 = 252.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: tiles
    prompt: Build the prime factorisation of 90 – factors in increasing order.
    params:
      tiles:
        - "2"
        - "3"
        - "3"
        - "5"
        - ·
        - ·
        - ·
        - "9"
        - "10"
        - "6"
      slots: 7
    answer:
      sequence:
        - "2"
        - ·
        - "3"
        - ·
        - "3"
        - ·
        - "5"
    hints:
      - 90 = 9 · 10. Split both further.
      - 9 = 3 · 3 and 10 = 2 · 5.
    explanation: 90 = 2 · 3 · 3 · 5. 9, 10 and 6 are not primes.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: The **lcm** takes each prime factor as often as it appears at most. 12 = 2 · 2 · 3 and 18 = 2 · 3 · 3. So lcm = 2 · 2 · 3 · 3 = 36.

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: What is the least common multiple of {{a}} and {{b}}?
    answer:
      value: "{{lcm(a, b)}}"
    feedback:
      - when: numval(state.input) == a * b && gcd(a, b) > 1
        misconception: product-not-lcm
        text: That is a common multiple – but not the least one.
    hints:
      - Factor both into primes.
      - "Or: {{a}} · {{b}} : gcd = {{a * b}} : {{gcd(a, b)}}."
    explanation: lcm({{a}}, {{b}}) = {{lcm(a, b)}}.
    difficulty: 2
    variants:
      params:
        a: choice[4,6,8,9,10,12]
        b: choice[6,9,14,15,16,21]
      constraints:
        - a != b
      defaults:
        a: 12
        b: 15

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Two gears with 12 and 18 teeth mesh together. After how many turns of the small gear are both back in their starting position?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 36
        misconception: teeth-not-turns
        text: 36 teeth must pass. How many turns is that for the small gear?
    hints:
      - How many teeth must pass? lcm(12, 18).
      - "36 teeth : 12 teeth per turn."
    explanation: lcm(12, 18) = 36. The small gear turns 3 times, the large one 2 times.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The Euclidean algorithm: gcd(1071, 462). Keep dividing with remainder. What comes out?"
    answer:
      value: 21
    hints:
      - 1071 = 2 · 462 + 147. Continue with 462 and 147.
      - 462 = 3 · 147 + 21 and 147 = 7 · 21.
    explanation: "The last non-zero remainder is the gcd: 21. The method needs no prime factors and is lightning fast."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "That every number has exactly one factorisation is the **fundamental theorem of arithmetic**. It is not obvious. In some number systems there are two: 6 = 2 · 3 = (1 + √−5)(1 − √−5)."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: How many zeros are at the end of $20! = 1 \cdot 2 \cdot 3 \cdots 20$?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: too-few-fives
        text: "Count all fives: 5, 10, 15 and 20 each give one."
    hints:
      - Each trailing zero needs a pair 2 · 5.
      - There are plenty of twos. Count the fives.
    explanation: 5, 10, 15, 20 – four fives, so four zeros. 20! = 2,432,902,008,176,640,000.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how to find the gcd of 12 and 18 using prime factors.
    params:
      keywords:
        - - primfaktor
          - zerleg
          - prime
          - factor
        - - gemeinsam
          - beide
          - common
          - both
          - shared
        - - sechs
          - six
          - 2 · 3
          - 2·3
      sample: "I factor both numbers: 12 = 2 · 2 · 3 and 18 = 2 · 3 · 3. Both share one 2 and one 3. So the gcd is 2 · 3 = 6."
    explanation: "Key idea: the gcd is made of exactly the shared prime factors."
    difficulty: 3

srs:
  cards_from: [ggt, busse]
