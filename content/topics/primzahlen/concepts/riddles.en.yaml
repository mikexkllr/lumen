id: math.primes.riddles
type: concept
title: Prime puzzles
summary: Twins, gaps and open questions.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: zwillinge
    widget: choice
    prompt: Twin primes are only 2 apart, like 11 and 13. Which pair is also a twin?
    params:
      layout: grid
      options:
        - { label: 17 and 19, correct: true }
        - { label: 23 and 25, feedback: "25 = 5 · 5 is not a prime." }
        - { label: 31 and 33, feedback: "33 = 3 · 11." }
        - { label: 7 and 9, feedback: "9 = 3 · 3." }
    hints:
      - Check the larger number for divisors.
    explanation: 17 and 19 are both prime.

  - kind: explain
    id: s2
    body: |
      **Goldbach** conjectured in 1742 that every even number above 2 is the sum of two primes. 10 = 3 + 7.
      To this day, nobody has proved it.

  - kind: problem
    id: goldbach
    widget: numeric
    prompt: "{{n}} = 7 + ? – which prime is missing?"
    params: { placeholder: "Prime" }
    answer: { value: "{{n - 7}}" }
    hints:
      - "Calculate {{n}} − 7."
    explanation: "{{n}} = 7 + {{n - 7}}."
    variants:
      params: { n: "choice[10,12,14,18,20,24,30]" }
      defaults: { n: 18 }

  - kind: problem
    id: luecke
    widget: choice
    prompt: Is there a prime between 90 and 96?
    params:
      options:
        - { label: "No", correct: true }
        - { label: "Yes", feedback: "91 = 7 · 13, 93 = 3 · 31, 95 = 5 · 19. The even numbers drop out anyway." }
    hints:
      - Check 91, 93 and 95.
    explanation: All are composite. Primes get rarer over time.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 2 is the only even prime.
          right: true
        - text: All odd numbers are prime.
          right: false
          why: 9 = 3 · 3 is odd and not prime.
        - text: 91 is a prime.
          right: false
          why: 91 = 7 · 13.
        - text: 97 is the largest two-digit prime.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Find five consecutive numbers with no prime. The smallest such run starts at …?
    answer:
      value: 24
    hints:
      - Look for two primes that are 6 apart with nothing between them.
    explanation: 24, 25, 26, 27, 28 – there is no prime between 23 and 29.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: In how many ways can 30 be written as a sum of two primes? Order does not matter.
    answer:
      value: 3
    hints:
      - Try 30 − p for each prime p up to 15.
      - 7 + 23 works. What else?
    explanation: 7 + 23, 11 + 19, 13 + 17. The bigger the number, the more Goldbach splits there usually are.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Every prime above 3 sits right next to a **multiple of 6**: 5 and 7 next to 6, 11 and 13 next to 12. All other numbers are divisible by 2 or 3."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Is the prime one below or one above a multiple of 6?
    params:
      buckets:
        - id: b1
          label: one below (6k − 1)
        - id: b2
          label: one above (6k + 1)
      items:
        - label: "29"
          bucket: b1
        - label: "41"
          bucket: b1
        - label: "47"
          bucket: b1
        - label: "31"
          bucket: b2
        - label: "37"
          bucket: b2
        - label: "43"
          bucket: b2
    hints:
      - Which multiple of 6 is closest?
      - 30, 36, 42 and 48.
    explanation: 29 = 30 − 1, 41 = 42 − 1, 47 = 48 − 1. 31 = 30 + 1, 37 = 36 + 1, 43 = 42 + 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Roughly how many primes are there below a large number n?
    params:
      options:
        - label: About n / ln(n)
          correct: true
        - label: About n / 2
          feedback: Below 100 there are already only 25.
        - label: About √n
          feedback: Below 100 that would be 10 – but there are 25.
    hints:
      - Primes thin out – but slowly.
    explanation: This is the **prime number theorem**, proved in 1896. Below a million it predicts 72,382; there really are 78,498.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: The numbers $10! + 2$, $10! + 3$, …, $10! + 10$ are all composite. How many consecutive non-primes is that?
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 10
        misconception: off-by-one
        text: Count from 2 to 10 – that is 9 numbers.
    hints:
      - $10! + k$ is divisible by k.
      - k runs from 2 to 10.
    explanation: Nine numbers without a prime. With n! you can build gaps as long as you like – primes have huge gaps.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Are there infinitely many twin primes?
    params:
      options:
        - label: "Euclid only proved: infinitely many primes."
          feedback: "Euklid bewies nur: unendlich viele Primzahlen."
        - label: That is not known – the opposite is suspected.
          feedback: Das ist nicht bekannt – man vermutet das Gegenteil.
        - label: "Unknown – what is proven: infinitely many pairs at most 246 apart"
          correct: true
    hints:
      - This is a famous open question.
      - "In 2013 came a breakthrough: a fixed maximum gap."
    explanation: Yitang Zhang proved a gap below 70 million in 2013. Joint work pushed it down to 246. The gap 2 is still open.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: The **Riemann hypothesis** describes how evenly the primes are spread out. It has been open since 1859. A proof would win a million-dollar prize.

srs:
  cards_from: [zwillinge, goldbach]
