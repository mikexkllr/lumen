id: math.primes.secrets
type: concept
title: Primes protect secrets
summary: Easy to multiply, hard to break apart.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The lock made of primes
    body: "When you pay online, primes protect your data. Uncover how a secret message arrives safely. The trick: **multiplying is easy**, splitting apart is hard."
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔓
            front: The open padlock
            back: Anna hands out open padlocks – anyone may snap one shut.
          - icon: 📦
            front: The box
            back: Ben puts his message in a box and snaps Anna's padlock shut.
          - icon: 🔑
            front: The key
            back: Only Anna has the key – not even Ben can open the box again.
          - icon: 🔢
            front: The maths
            back: The lock is the product of two huge primes, and the key is built from the primes themselves.

  - kind: problem
    id: mal
    widget: numeric
    prompt: Multiply – {{p}} · {{q}}.
    params: { placeholder: "Product" }
    answer: { value: "{{p * q}}" }
    hints:
      - Split one number, for example {{q}} = 10 + {{q - 10}}.
    explanation: "{{p}} · {{q}} = {{p * q}}."
    variants:
      params: { p: "choice[11,13,17,19]", q: "choice[23,29,31,37]" }
      defaults: { p: 13, q: 17 }

  - kind: problem
    id: zerlegen
    widget: choice
    prompt: 221 is the product of two primes. Which factor is in it?
    params:
      layout: grid
      options:
        - { label: "13", correct: true }
        - { label: "7", feedback: "221 ÷ 7 doesn't divide evenly." }
        - { label: "11", feedback: "221 ÷ 11 doesn't divide evenly." }
        - { label: "3", feedback: "The digit sum 5 is not divisible by 3." }
    hints:
      - Try the primes in order.
    explanation: 221 = 13 · 17. Working backward takes far longer than multiplying.

  - kind: explain
    id: s3
    body: |
      Much **encryption** is built on this. You can multiply two huge primes in milliseconds.
      Breaking the product back apart would take millennia.

  - kind: problem
    id: zikaden
    widget: numeric
    prompt: Cicadas emerge every 13 or 17 years. After how many years do both kinds emerge together again?
    params: { unit: years }
    answer: { value: 221 }
    hints:
      - The least common multiple of two primes is their product.
    explanation: 13 · 17 = 221 years. Prime cycles rarely meet enemies with shorter cycles.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 437 is the product of two primes near 20. What is the smaller one?
    answer:
      value: 19
    hints:
      - 437 = 441 − 4 = 21² − 2².
    explanation: (21 − 2) · (21 + 2) = 19 · 23. If the factors are close together, a key is easy to crack.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "In **modular arithmetic** only the remainder counts. 17:00 is 5 o’clock on a clock face: 17 mod 12 = 5. Encryption works just like this – only with huge numbers."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Work out {{a}} mod {{m}}, the remainder of {{a}} : {{m}}."
    answer:
      value: "{{a % m}}"
    feedback:
      - when: numval(state.input) == floor(a / m) && floor(a / m) != a % m
        misconception: quotient-not-remainder
        text: That is how often {{m}} fits in. We want the remainder.
    hints:
      - How often does {{m}} fit into {{a}}?
      - "{{floor(a / m)}} · {{m}} = {{floor(a / m) * m}}. What is left?"
    explanation: "{{a}} = {{floor(a / m)}} · {{m}} + {{a % m}}. The remainder is {{a % m}}."
    difficulty: 2
    variants:
      params:
        a: int[20,99]
        m: choice[5,7,12]
      defaults:
        a: 47
        m: 12

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: "Caesar shifted every letter by 3: A becomes D. What does X become?"
    params:
      options:
        - label: A
          correct: true
        - label: That is only two along.
          feedback: Das ist nur zwei weiter.
        - label: After Z you go on from A – B is one too far.
          feedback: Nach Z geht es bei A weiter – B ist eins zu weit.
        - label: That is three back.
          feedback: Das ist drei zurück.
    hints:
      - "Count on: Y, Z, …"
      - After Z the alphabet starts again.
    explanation: X → Y → Z → A. That is arithmetic modulo 26.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is RSA encryption secure?
    params:
      options:
        - label: Because nobody knows a fast method to factor huge numbers
          correct: true
        - label: Because factoring is proven impossible
          feedback: It is possible, just extremely slow. A proof is still missing.
        - label: Because the primes are kept secret and cannot be found
          feedback: They are secret – but it is only safe because the product does not reveal them.
    hints:
      - Is “hard” the same as “proven impossible”?
    explanation: The security is a conjecture. A large quantum computer could factor quickly with Shor’s algorithm.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why are primes suited to encryption?"
    params:
      keywords:
        - - multiplizier
          - malnehmen
          - produkt
          - multiply
          - product
        - - zerleg
          - faktor
          - factor
          - rückwärts
          - undo
          - reverse
        - - schwer
          - lange
          - langsam
          - hard
          - slow
          - long
      sample: Two large primes multiply quickly. But to factor the product back takes extremely long – it is hard.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: In RSA the **public key** is the product n = p · q. What stays secret is (p − 1)(q − 1). Anyone who cannot factor n does not know this number – and cannot decrypt.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Mini-RSA with n = 33 and key e = 3. Encrypt the message 4: work out $4^3 \\bmod 33$."
    answer:
      value: 31
    feedback:
      - when: numval(state.input) == 64
        misconception: forgot-mod
        text: Now take the remainder when dividing by 33.
    hints:
      - $4^3 = 64$.
      - 64 − 33 = ?
    explanation: 64 = 1 · 33 + 31. The encrypted message is 31.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: "Decrypt with the secret key d = 7: $31^7 \\bmod 33$. Hint: 31 is the same as −2."
    answer:
      value: 4
    hints:
      - $(-2)^7 = -128$.
      - "Add multiples of 33 until you land in 0 to 32: −128 + 132."
    explanation: −128 + 4 · 33 = 4. The message 4 is back! It works because 3 · 7 = 21 leaves remainder 1 modulo (3 − 1)(11 − 1) = 20.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: choice
    prompt: Why could quantum computers threaten RSA?
    params:
      options:
        - label: With Shor’s algorithm they could factor large numbers quickly
          correct: true
        - label: It is not that simple – they need a special algorithm.
          feedback: So einfach ist es nicht – sie brauchen einen speziellen Algorithmus.
        - label: Quantum computers use the same numbers.
          feedback: Auch Quantencomputer rechnen mit denselben Zahlen.
    hints:
      - What is RSA’s security based on?
      - On how hard factoring is.
    explanation: Shor found a quantum algorithm for fast factoring in 1994. That is why new methods are already being developed.
    difficulty: 3

srs:
  cards_from: [mal, zerlegen]
