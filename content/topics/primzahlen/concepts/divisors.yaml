id: math.primes.divisors
type: concept
title: Teiler finden
summary: Teiler kommen in Paaren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Tafeln aus 18 Stücken
    body: Schokoladentafeln sind Rechtecke – und sie verraten Teiler. Zieh ein Rechteck aus genau 18 Kästchen. Wie viele verschiedene Formen findest du? Jede Form zeigt ein **Teilerpaar**.
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 14
        maxH: 10
        w: 3
        h: 3
        show:
          - area
        unit: cm

  - kind: problem
    id: teiler-24
    widget: choice
    prompt: Welche Zahlen teilen 24 ohne Rest? Wähle alle.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "3", correct: true }
        - { label: "4", correct: true }
        - { label: "5" }
        - { label: "6", correct: true }
        - { label: "8", correct: true }
        - { label: "9" }
    hints:
      - Probiere 24 geteilt durch jede Zahl.
      - Denk an Paare – 24 = 3 · 8 = 4 · 6.
    explanation: 3, 4, 6 und 8 – dazu kommen noch 1, 2, 12 und 24.

  - kind: explain
    id: s2
    body: |
      Ein **Teiler** passt ohne Rest. Teiler kommen in **Paaren** – 24 = 1 · 24 = 2 · 12 = 3 · 8 = 4 · 6.
      Du musst nur bis zur Mitte suchen.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Wie viele Teiler hat {{n}}? Zähle 1 und {{n}} mit.
    params: { unit: Teiler }
    answer: { value: "{{d}}" }
    hints:
      - Schreibe die Teiler als Paare auf.
    explanation: "{{n}} hat {{d}} Teiler."
    variants:
      params: { n: "choice[12,16,18,20,28,36]" }
      derive: { d: "n == 16 ? 5 : n == 36 ? 9 : 6" }
      defaults: { n: 12 }

  - kind: explain
    id: s4
    body: |
      **Schnelle Regeln:** Durch 2, wenn die letzte Ziffer gerade ist. Durch 5, wenn sie 0 oder 5 ist.
      Durch 3, wenn die **Quersumme** durch 3 teilbar ist.

  - kind: problem
    id: quersumme
    widget: buckets
    prompt: Durch 3 teilbar oder nicht? Nutze die Quersumme.
    params:
      buckets: [{ label: durch 3 teilbar }, { label: nicht teilbar }]
      items:
        - { label: "123", bucket: durch 3 teilbar }
        - { label: "451", bucket: nicht teilbar }
        - { label: "702", bucket: durch 3 teilbar }
        - { label: "1001", bucket: nicht teilbar }
        - { label: "2841", bucket: durch 3 teilbar }
        - { label: "577", bucket: nicht teilbar }
    hints:
      - "Quersumme von 123 ist 1 + 2 + 3 = 6."
    explanation: Quersummen 6, 10, 9, 2, 15 und 19 – nur 6, 9 und 15 sind durch 3 teilbar.

  - kind: problem
    id: durch-vier
    widget: choice
    prompt: Wann ist eine Zahl durch 4 teilbar?
    params:
      options:
        - { label: Wenn ihre letzten zwei Ziffern durch 4 teilbar sind., correct: true }
        - { label: Wenn ihre Quersumme durch 4 teilbar ist., feedback: "Die Quersumme hilft bei 3 und 9. Probier 13 – Quersumme 4, aber nicht teilbar." }
        - { label: Wenn sie auf 4 endet., feedback: "14 endet auf 4, ist aber nicht durch 4 teilbar." }
    hints:
      - 100 ist durch 4 teilbar. Was bedeutet das für die Hunderter?
    explanation: Alle vollen Hunderter sind durch 4 teilbar. Es zählen nur die letzten zwei Ziffern.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 714 ist durch 3 teilbar.
          right: true
        - text: 1 000 002 ist durch 9 teilbar.
          right: false
          why: Quersumme 3 – durch 3 ja, durch 9 nein.
        - text: Jede Zahl ist durch 1 und durch sich selbst teilbar.
          right: true
        - text: 134 ist durch 4 teilbar.
          right: false
          why: 34 ist nicht durch 4 teilbar.

  - kind: problem
    id: ma-c1
    widget: rect
    prompt: "Teiler zum Anfassen: Zieh ein Rechteck aus genau 12 Kästchen. Jede Form zeigt ein Teilerpaar."
    params:
      maxW: 12
      maxH: 8
      w: 2
      h: 2
      show:
        - area
    check:
      predicate: area == 12
    hints:
      - Welche Zahl mal welche ergibt 12?
      - Zum Beispiel 3 Reihen zu je 4.
    explanation: 1 × 12, 2 × 6 und 3 × 4 – das sind die Teilerpaare von 12.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Teiler hat 72?
    answer:
      value: 12
    hints:
      - 72 = 2³ · 3².
      - "Für jeden Primfaktor: Exponent plus 1 – und dann malnehmen."
    explanation: (3 + 1) · (2 + 1) = 12. Jeder Teiler wählt 0 bis 3 Zweien und 0 bis 2 Dreien.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "**Teilbarkeitsregeln** lassen sich kombinieren. Durch 6 teilbar heißt: durch 2 und durch 3. Durch 9 teilbar heißt: Die Quersumme ist durch 9 teilbar."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: Durch 6 teilbar oder nicht?
    params:
      buckets:
        - id: b1
          label: durch 6 teilbar
        - id: b2
          label: nicht teilbar
      items:
        - label: "114"
          bucket: b1
        - label: "222"
          bucket: b1
        - label: "732"
          bucket: b1
        - label: "316"
          bucket: b2
        - label: "405"
          bucket: b2
        - label: "1001"
          bucket: b2
    hints:
      - "Prüfe zuerst: gerade?"
      - "Dann die Quersumme: durch 3 teilbar?"
    explanation: 114, 222 und 732 sind gerade mit Quersumme 6, 6 und 12. 316 hat Quersumme 10, 405 ist ungerade, 1001 auch.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Welche Ziffer muss in die Lücke, damit 4□2 durch 9 teilbar ist?
    answer:
      value: 3
    hints:
      - Die Quersumme muss durch 9 teilbar sein.
      - 4 + □ + 2 = 9.
    explanation: "4 + 3 + 2 = 9. Also ist 432 durch 9 teilbar: 432 = 9 · 48."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welche Zahlen haben eine **ungerade** Anzahl von Teilern?
    params:
      options:
        - label: Genau die Quadratzahlen
          correct: true
        - label: Genau die Primzahlen
          feedback: Primzahlen haben 2 Teiler – das ist gerade.
        - label: Genau die ungeraden Zahlen
          feedback: 15 hat die Teiler 1, 3, 5, 15 – vier Stück.
    hints:
      - Teiler kommen in Paaren. Wann ist ein Teiler sein eigener Partner?
    explanation: Nur bei n = d · d paart sich ein Teiler mit sich selbst. 36 hat 9 Teiler.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Aus den Primfaktoren folgt die **Teileranzahl**. 72 = 2³ · 3². Jeder Teiler hat 0 bis 3 Zweien und 0 bis 2 Dreien. Das sind 4 · 3 = 12 Teiler.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Wie viele Teiler hat {{2 ** a * 3 ** b}} = $2^{ {{a}} } \cdot 3^{ {{b}} }$?
    answer:
      value: "{{(a + 1) * (b + 1)}}"
    feedback:
      - when: numval(state.input) == a * b && a * b != (a + 1) * (b + 1)
        misconception: forgot-zero-exponent
        text: Auch null Zweien oder null Dreien sind erlaubt.
    hints:
      - Wie viele Zweien kann ein Teiler haben? 0 bis {{a}}.
      - "{{a + 1}} Möglichkeiten mal {{b + 1}} Möglichkeiten."
    explanation: ({{a}} + 1) · ({{b}} + 1) = {{(a + 1) * (b + 1)}} Teiler.
    difficulty: 3
    variants:
      params:
        a: int[1,5]
        b: int[1,3]
      defaults:
        a: 3
        b: 1

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Welche ist die kleinste Zahl mit genau 6 Teilern?
    answer:
      value: 12
    hints:
      - 6 = 2 · 3 = (1 + 1)(2 + 1).
      - Probiere $2^2 \cdot 3$.
    explanation: 12 hat die Teiler 1, 2, 3, 4, 6, 12. Alle kleineren Zahlen haben weniger.
    difficulty: 3

srs:
  cards_from: [anzahl, quersumme]
