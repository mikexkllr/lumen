id: math.primes.divisors
type: concept
title: Teiler finden
summary: Teiler kommen in Paaren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: teiler-24
    widget: choice
    prompt: Welche Zahlen teilen 24 ohne Rest? Wähle alle.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "3", correct: true }
        - { label: "4", correct: true }
        - { label: "5" }
        - { label: "6", correct: true }
        - { label: "8", correct: true }
        - { label: "9" }
    hints:
      - Probiere 24 geteilt durch jede Zahl.
      - Denk an Paare – 24 = 3 · 8 = 4 · 6.
    explanation: 3, 4, 6 und 8 – dazu kommen noch 1, 2, 12 und 24.

  - kind: explain
    body: |
      Ein **Teiler** passt ohne Rest. Teiler kommen in **Paaren** – 24 = 1 · 24 = 2 · 12 = 3 · 8 = 4 · 6.
      Du musst nur bis zur Mitte suchen.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Wie viele Teiler hat {{n}}? Zähle 1 und {{n}} mit.
    params: { unit: Teiler }
    answer: { value: "{{d}}" }
    hints:
      - Schreibe die Teiler als Paare auf.
    explanation: "{{n}} hat {{d}} Teiler."
    variants:
      params: { n: "choice[12,16,18,20,28,36]" }
      derive: { d: "n == 16 ? 5 : n == 36 ? 9 : 6" }
      defaults: { n: 12 }

  - kind: explain
    body: |
      **Schnelle Regeln:** Durch 2, wenn die letzte Ziffer gerade ist. Durch 5, wenn sie 0 oder 5 ist.
      Durch 3, wenn die **Quersumme** durch 3 teilbar ist.

  - kind: problem
    id: quersumme
    widget: buckets
    prompt: Durch 3 teilbar oder nicht? Nutze die Quersumme.
    params:
      buckets: [{ label: durch 3 teilbar }, { label: nicht teilbar }]
      items:
        - { label: "123", bucket: durch 3 teilbar }
        - { label: "451", bucket: nicht teilbar }
        - { label: "702", bucket: durch 3 teilbar }
        - { label: "1001", bucket: nicht teilbar }
        - { label: "2841", bucket: durch 3 teilbar }
        - { label: "577", bucket: nicht teilbar }
    hints:
      - "Quersumme von 123 ist 1 + 2 + 3 = 6."
    explanation: Quersummen 6, 10, 9, 2, 15 und 19 – nur 6, 9 und 15 sind durch 3 teilbar.

  - kind: problem
    id: durch-vier
    widget: choice
    prompt: Wann ist eine Zahl durch 4 teilbar?
    params:
      options:
        - { label: Wenn ihre letzten zwei Ziffern durch 4 teilbar sind., correct: true }
        - { label: Wenn ihre Quersumme durch 4 teilbar ist., feedback: "Die Quersumme hilft bei 3 und 9. Probier 13 – Quersumme 4, aber nicht teilbar." }
        - { label: Wenn sie auf 4 endet., feedback: "14 endet auf 4, ist aber nicht durch 4 teilbar." }
    hints:
      - 100 ist durch 4 teilbar. Was bedeutet das für die Hunderter?
    explanation: Alle vollen Hunderter sind durch 4 teilbar. Es zählen nur die letzten zwei Ziffern.

srs:
  cards_from: [anzahl, quersumme]
