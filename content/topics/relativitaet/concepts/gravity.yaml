id: sci.relativity.gravity
type: concept
title: Gravitation ist Krümmung
summary: Die allgemeine Relativität.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Laut **allgemeiner Relativität** krümmt Masse Raum und Zeit. Planeten folgen dieser Krümmung wie Kugeln auf einem gespannten Tuch. Nahe großer Massen läuft die Zeit sogar langsamer.

  - kind: problem
    id: licht
    widget: choice
    prompt: Was passiert mit Sternenlicht, das knapp an der Sonne vorbeiläuft?
    params:
      options:
        - { label: Es wird abgelenkt., correct: true }
        - { label: Nichts – Licht hat keine Masse., feedback: "Licht folgt dem gekrümmten Raum, auch ohne Masse." }
    hints:
      - Licht folgt dem gekrümmten Raum.
    explanation: 1919 wurde das bei einer Sonnenfinsternis gemessen – der Durchbruch für Einstein.

  - kind: problem
    id: gps
    widget: numeric
    body: GPS-Uhren gehen gegenüber Uhren auf der Erde pro Tag etwa 38 Mikrosekunden vor. Licht legt pro Mikrosekunde 300 m zurück.
    prompt: Wie viele Kilometer Ortsfehler entstünden ohne Korrektur pro Tag?
    params: { unit: km }
    answer: { value: 11.4, tolerance: 0.6 }
    hints:
      - 38 · 300 m.
    explanation: 38 · 300 m = 11 400 m – rund 11 km pro Tag.

  - kind: problem
    id: loch
    widget: choice
    prompt: Was ist ein Schwarzes Loch?
    params:
      options:
        - { label: "Eine so starke Krümmung, dass nicht einmal Licht entkommt.", correct: true }
        - { label: Ein Loch im Weltall ohne alles, feedback: "Es ist das Gegenteil – extrem viel Masse auf kleinstem Raum." }
    hints:
      - Denk an die stärkste denkbare Krümmung.
    explanation: Unterhalb des Ereignishorizonts führen alle Wege nach innen.

srs:
  cards_from: [licht, loch]
