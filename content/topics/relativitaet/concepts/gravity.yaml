id: sci.relativity.gravity
type: concept
title: Gravitation ist Krümmung
summary: Die allgemeine Relativität.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Auf einem Trampolin liegt eine Bowlingkugel. Du rollst eine Murmel daran vorbei. Was macht die Murmel?
    params:
      options:
        - label: Sie rollt in einer Kurve um die Kugel
          correct: true
        - label: Sie rollt geradeaus
          feedback: Das Tuch ist eingedellt.
        - label: Sie bleibt stehen
          feedback: Sie rollt weiter.
    hints:
      - Die schwere Kugel dellt das Tuch ein.
    explanation: "So ähnlich lenkt die Sonne die Planeten: Sie krümmt den Raum."

  - kind: explain
    id: s1
    body: |
      Laut **allgemeiner Relativität** krümmt Masse Raum und Zeit. Planeten folgen dieser Krümmung wie Kugeln auf einem gespannten Tuch. Nahe großer Massen läuft die Zeit sogar langsamer.

  - kind: problem
    id: licht
    widget: choice
    prompt: Was passiert mit Sternenlicht, das knapp an der Sonne vorbeiläuft?
    params:
      options:
        - { label: Es wird abgelenkt., correct: true }
        - { label: Nichts – Licht hat keine Masse., feedback: "Licht folgt dem gekrümmten Raum, auch ohne Masse." }
    hints:
      - Licht folgt dem gekrümmten Raum.
    explanation: 1919 wurde das bei einer Sonnenfinsternis gemessen – der Durchbruch für Einstein.

  - kind: problem
    id: gps
    widget: numeric
    body: GPS-Uhren gehen gegenüber Uhren auf der Erde pro Tag etwa 38 Mikrosekunden vor. Licht legt pro Mikrosekunde 300 m zurück.
    prompt: Wie viele Kilometer Ortsfehler entstünden ohne Korrektur pro Tag?
    params: { unit: km }
    answer: { value: 11.4, tolerance: 0.6 }
    hints:
      - 38 · 300 m.
    explanation: 38 · 300 m = 11 400 m – rund 11 km pro Tag.

  - kind: problem
    id: loch
    widget: choice
    prompt: Was ist ein Schwarzes Loch?
    params:
      options:
        - { label: "Eine so starke Krümmung, dass nicht einmal Licht entkommt.", correct: true }
        - { label: Ein Loch im Weltall ohne alles, feedback: "Es ist das Gegenteil – extrem viel Masse auf kleinstem Raum." }
    hints:
      - Denk an die stärkste denkbare Krümmung.
    explanation: Unterhalb des Ereignishorizonts führen alle Wege nach innen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Auf einem Berg vergeht die Zeit etwas schneller als im Tal.
          right: true
        - text: Licht hat keine Masse und wird darum nicht von Gravitation abgelenkt.
          right: false
          why: Licht folgt der gekrümmten Raumzeit – 1919 erstmals gemessen.
        - text: Verschmelzende Schwarze Löcher senden Gravitationswellen aus.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Einsteins **Äquivalenzprinzip**: Du stehst in einem fensterlosen Raum und spürst dein Gewicht. Was kannst du **nicht** unterscheiden?"
    params:
      options:
        - label: Ob du auf der Erde stehst oder in einer beschleunigenden Rakete
          correct: true
        - label: Ob es Tag oder Nacht ist
          feedback: Das stimmt zwar, hat aber nichts mit Gravitation zu tun.
        - label: Ob du schwer oder leicht bist
          feedback: Es geht darum, **woher** das Gewichtsgefühl kommt.
    hints:
      - Wie fühlt es sich an, wenn ein Aufzug nach oben beschleunigt?
    explanation: Schwerkraft und Beschleunigung sind lokal nicht unterscheidbar. Daraus baute Einstein die ganze Theorie.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Bring den Satelliten auf Fluchtkurs: so schnell, dass er nie zurückkehrt."
    params:
      scene: orbit
      controls:
        radius:
          fixed: true
    answer:
      kind: 1
    explanation: Ab etwa 7,9 km/s. Bei Newton ist das eine Frage der Kraft – bei Einstein folgt der Satellit der Krümmung des Raums.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: GPS-Uhren gehen wegen der schwächeren Schwerkraft 45 µs pro Tag vor. Wegen ihres Tempos gehen sie 7 µs pro Tag nach. Wie viele µs pro Tag gehen sie insgesamt vor?
    params:
      unit: µs
    answer:
      value: 38
    feedback:
      - when: numval(state.input) == 52
        misconception: add-effects
        text: "Die beiden Effekte wirken gegeneinander: einer beschleunigt, einer bremst."
    hints:
      - Vorgehen und Nachgehen heben sich teilweise auf.
      - 45 − 7 = ?
    explanation: 38 µs pro Tag. Mal Lichtgeschwindigkeit sind das über 11 km Ortsfehler. Die Satellitenuhren werden darum vor dem Start absichtlich verstellt.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Auf einem Teleskopbild erscheint eine ferne Galaxie als Ring um eine nähere. Was ist passiert?
    params:
      options:
        - label: Die Masse der nahen Galaxie krümmt den Raum und lenkt das Licht der fernen um sich herum.
          correct: true
        - label: Die ferne Galaxie ist wirklich ringförmig.
          feedback: Solche Ringe liegen immer genau um eine Masse herum. Das ist kein Zufall.
        - label: Staub spiegelt das Licht.
          feedback: Staub schluckt und streut, bildet aber keine sauberen Ringe.
    hints:
      - Was macht Masse laut Einstein mit Lichtwegen?
      - Die nahe Galaxie wirkt wie eine riesige Linse.
    explanation: Das ist eine **Gravitationslinse**. Liegen beide genau hintereinander, wird das Bild zum Einsteinring. Astronomen wiegen so Galaxien – samt dunkler Materie.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Der Radius eines Schwarzen Lochs wächst mit der Masse: etwa 3 km pro Sonnenmasse. Wie groß wäre der Radius bei 10 Sonnenmassen?"
    params:
      unit: km
    answer:
      value: 30
    hints:
      - 3 km mal 10.
    explanation: 30 km – das ist der **Schwarzschild-Radius**. Die Erde müsste man dafür auf 9 mm zusammendrücken.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Wie klein müsste man die Erde zusammenpressen, damit sie ein Schwarzes Loch wird? Es gilt r = 2GM : c² mit G = 6,67 · 10⁻¹¹, M = 5,97 · 10²⁴ kg, c = 3 · 10⁸ m/s. In Millimetern, auf eine Stelle."
    params:
      unit: mm
    answer:
      value: 8.9
      tolerance: 0.2
    hints:
      - 2 · 6,67 · 10⁻¹¹ · 5,97 · 10²⁴ ≈ 7,96 · 10¹⁴.
      - Durch 9 · 10¹⁶ teilen ergibt Meter.
    explanation: r ≈ 0,0089 m – die ganze Erde in einer Murmel von knapp 2 cm Durchmesser. Für die Sonne sind es 3 km.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: 2015 maß der Detektor LIGO zum ersten Mal Gravitationswellen. Was genau wurde gemessen?
    params:
      options:
        - label: Winzige Längenänderungen von 4 km langen Messarmen – kleiner als ein Protondurchmesser.
          correct: true
        - label: Ein Lichtblitz von zwei Schwarzen Löchern.
          feedback: Verschmelzende Schwarze Löcher leuchten nicht. Man spürte die Raumzeit selbst schwingen.
        - label: Eine Änderung der Erdschwerkraft.
          feedback: Die Welle dehnt und staucht den Raum, die Schwerkraft am Boden ändert sich nicht messbar.
    hints:
      - Eine Gravitationswelle dehnt und staucht den Raum.
      - Gemessen wird mit Laserlicht zwischen Spiegeln.
    explanation: Zwei Schwarze Löcher, 1,3 Milliarden Lichtjahre entfernt, verschmolzen. Die Welle änderte die Armlänge um etwa 10⁻¹⁸ m. Das war 2017 einen Nobelpreis wert.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Licht an der Sonne abgelenkt wird, obwohl es keine Masse hat.
    params:
      keywords:
        - - raum
          - space
          - raumzeit
          - spacetime
        - - krumm
          - krümm
          - curv
          - bend
          - gebogen
        - - weg
          - path
          - folgt
          - follows
          - gerade
          - straight
      sample: Die Sonne krümmt die Raumzeit um sich herum. Licht läuft immer den geradesten Weg durch die Raumzeit. Weil diese gekrümmt ist, folgt auch der Lichtweg einer Kurve – ganz ohne Masse.
    difficulty: 3

srs:
  cards_from: [licht, loch]
