id: sci.relativity.lab
type: concept
title: Relativitäts-Labor
summary: Gamma einstellen, Effekte einordnen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: s1
    body: |
      Der Faktor $\gamma = \frac{1}{\sqrt{1 - v^2}}$ sagt, wie stark Zeit und Länge sich ändern – mit v als Anteil der **Lichtgeschwindigkeit**. Bei 0 ist γ = 1, nahe 1 explodiert er.

  - kind: problem
    id: gamma
    widget: slider
    prompt: Die Linie zeigt γ. Stelle das Tempo so ein, dass γ etwa 2 ist – die gestrichelte Linie.
    params:
      expr: "1/sqrt(1 - v^2)"
      x: [0, 1]
      y: [0, 4]
      showCoordinates: false
      sliders: [{ id: v, label: "Tempo (Anteil von c)", min: 0, max: 0.95, step: 0.025, initial: 0.5 }]
      target: { expr: "2" }
    check: { predicate: "abs(1/sqrt(1 - v*v) - 2) < 0.08" }
    hints:
      - Erstaunlich schnell – über 80 % der Lichtgeschwindigkeit.
    explanation: Bei etwa 87 % der Lichtgeschwindigkeit vergeht die Zeit halb so schnell.

  - kind: problem
    id: sechzig
    widget: numberline
    prompt: Bei 60 % der Lichtgeschwindigkeit ist γ = 1 / 0,8. Markiere den Wert.
    params: { min: 1, max: 2, ticks: 4, labels: decimals }
    answer: { value: 1.25 }
    hints:
      - 1 geteilt durch 0,8.
    explanation: γ = 1,25 – Uhren gehen um ein Fünftel langsamer.

  - kind: problem
    id: spuerbar
    widget: buckets
    prompt: Sind relativistische Effekte hier spürbar?
    params:
      buckets: [{ label: winzig }, { label: deutlich }]
      items:
        - { label: Fahrt auf der Autobahn, bucket: winzig }
        - { label: Flug nach New York, bucket: winzig }
        - { label: Teilchenbeschleuniger, bucket: deutlich }
        - { label: Myonen aus dem All, bucket: deutlich }
    hints:
      - Wie nah kommt man an die Lichtgeschwindigkeit?
    explanation: Erst nahe der Lichtgeschwindigkeit werden die Effekte groß.

  - kind: problem
    id: tempi
    widget: order
    prompt: Ordne von langsam nach schnell.
    params:
      items:
        - { label: Auto auf der Autobahn }
        - { label: Schall in Luft }
        - { label: Raumstation im Orbit }
        - { label: Licht }
    hints:
      - Die Raumstation schafft fast 8 km pro Sekunde.
    explanation: 40 m/s, 343 m/s, 7,7 km/s und 300 000 km/s.

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numberline
    prompt: Ein Raumschiff ist in Ruhe 10 m lang. Es fliegt mit 0,6 c vorbei, also γ = 1,25. Markiere die Länge, die du misst.
    params:
      min: 0
      max: 10
      ticks: 2
      labels: integers
    answer:
      value: 8
    hints:
      - Bewegte Längen werden durch γ geteilt.
      - "10 : 1,25 = ?"
    explanation: "10 m : 1,25 = 8 m. Für die Crew bleibt das Schiff 10 m lang."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: chart
    prompt: "Stell für jedes Tempo den Faktor γ ein. Rechne γ = 1 : √(1 − v²)."
    params:
      labels:
        - "0"
        - 0,6 c
        - 0,866 c
      values:
        - 1
        - 1
        - 1
      editable:
        - 1
        - 2
      min: 1
      max: 3
      step: 0.25
    answer:
      values:
        - 1
        - 1.25
        - 2
    hints:
      - Bei 0,6 c ist 1 − v² = 0,64.
      - Bei 0,866 c ist 1 − v² = 0,25.
    explanation: γ = 1, 1,25 und 2. Die Balken wachsen immer steiler – nahe c gibt es kein Halten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Raumschiff fliegt mit 0,8 c (γ = 5/3) zu einem 8 Lichtjahre entfernten Stern. Wie viele Jahre vergehen für die **Crew** auf dem Hinflug?
    params:
      unit: Jahre
    answer:
      value: 6
    hints:
      - "Erdzeit: 8 : 0,8 = 10 Jahre. Teile durch γ."
    explanation: "10 : (5/3) = 6 Jahre. Für die Crew ist die Strecke auf 4,8 Lichtjahre geschrumpft."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum müssen sich Zeit und Raum ändern, wenn Licht für alle gleich schnell ist?"
    params:
      keywords:
        - - geschwindigkeit
          - tempo
          - speed
          - schnell
          - fast
        - - weg
          - strecke
          - raum
          - länge
          - distance
          - space
          - length
        - - zeit
          - uhr
          - time
          - clock
        - - beobachter
          - beweg
          - observer
          - mov
          - sicht
          - view
      min: 3
      sample: Geschwindigkeit ist Weg durch Zeit. Wenn zwei Beobachter, die sich gegeneinander bewegen, dasselbe Licht gleich schnell messen sollen, müssen sie Wege und Zeiten verschieden messen.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Pion lebt in Ruhe nur 26 Nanosekunden. Im Beschleuniger fliegt es fast mit Lichtgeschwindigkeit, mit γ = 100. Wie viele Meter kommt es im Mittel?
    params:
      unit: m
    answer:
      value: 780
      tolerance: 5
    feedback:
      - when: abs(numval(state.input) - 7.8) < 0.1
        misconception: forgot-gamma
        text: Das wäre ohne Zeitdilatation. Seine Uhr läuft 100-mal langsamer.
    hints:
      - "Lebensdauer im Labor: 100 · 26 ns."
      - Mal 3 · 10⁸ m/s.
    explanation: 2,6 µs · 3 · 10⁸ m/s = 780 m statt 7,8 m. Teilchenphysiker planen ihre Strahlrohre genau so.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: "Manche Bücher sagen: »Schnelle Körper werden schwerer.« Wie sagt man es heute genauer?"
    params:
      options:
        - label: Die Ruhemasse bleibt gleich – Energie und Impuls wachsen mit γ.
          correct: true
        - label: Die Masse wächst wirklich, das Teilchen wird größer.
          feedback: Ein Elektron bleibt ein Elektron. Was wächst, sind Energie und Impuls.
        - label: Die Masse sinkt.
          feedback: Die Ruhemasse ändert sich gar nicht.
    hints:
      - Was ist für alle Beobachter gleich?
      - p = γ m v und E = γ m c².
    explanation: Die Ruhemasse m ist eine feste Eigenschaft. Mit γ wachsen p = γmv und E = γmc² ohne Grenze. Darum braucht man für v → c unendlich viel Energie.
    difficulty: 3

srs:
  cards_from: [gamma, spuerbar]
