id: sci.relativity.lab
type: concept
title: Relativity lab
summary: Tune gamma, classify effects.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: s1
    body: |
      The factor $\gamma = \frac{1}{\sqrt{1 - v^2}}$ tells you how strongly time and length change, with v as a fraction of the **speed of light**. At 0, γ = 1. Near 1, it explodes.

  - kind: problem
    id: gamma
    widget: slider
    prompt: The line shows γ. Set the speed so that γ is about 2, the dashed line.
    params:
      expr: "1/sqrt(1 - v^2)"
      x: [0, 1]
      y: [0, 4]
      showCoordinates: false
      sliders: [{ id: v, label: "Speed (fraction of c)", min: 0, max: 0.95, step: 0.025, initial: 0.5 }]
      target: { expr: "2" }
    check: { predicate: "abs(1/sqrt(1 - v*v) - 2) < 0.08" }
    hints:
      - Surprisingly fast, over 80% of the speed of light.
    explanation: At about 87% of the speed of light, time passes half as fast.

  - kind: problem
    id: sechzig
    widget: numberline
    prompt: At 60% of the speed of light, γ = 1 / 0.8. Mark the value.
    params: { min: 1, max: 2, ticks: 4, labels: decimals }
    answer: { value: 1.25 }
    hints:
      - 1 divided by 0.8.
    explanation: γ = 1.25. Clocks run one fifth slower.

  - kind: problem
    id: spuerbar
    widget: buckets
    prompt: Are relativistic effects noticeable here?
    params:
      buckets: [{ label: tiny }, { label: clear }]
      items:
        - { label: Driving on the highway, bucket: tiny }
        - { label: Flight to New York, bucket: tiny }
        - { label: Particle accelerator, bucket: clear }
        - { label: Muons from space, bucket: clear }
    hints:
      - How close do you get to the speed of light?
    explanation: Only near the speed of light do the effects become large.

  - kind: problem
    id: tempi
    widget: order
    prompt: Order from slow to fast.
    params:
      items:
        - { label: Car on the highway }
        - { label: Sound in air }
        - { label: Space station in orbit }
        - { label: Light }
    hints:
      - The space station makes almost 8 km per second.
    explanation: 40 m/s, 343 m/s, 7.7 km/s and 300,000 km/s.

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numberline
    prompt: A spaceship is 10 m long at rest. It flies past at 0.6 c, so γ = 1.25. Mark the length you measure.
    params:
      min: 0
      max: 10
      ticks: 2
      labels: integers
    answer:
      value: 8
    hints:
      - Moving lengths are divided by γ.
      - 10 ÷ 1.25 = ?
    explanation: 10 m ÷ 1.25 = 8 m. For the crew the ship stays 10 m long.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: chart
    prompt: Set the factor γ for each speed. Use γ = 1 ÷ √(1 − v²).
    params:
      labels:
        - "0"
        - 0.6 c
        - 0.866 c
      values:
        - 1
        - 1
        - 1
      editable:
        - 1
        - 2
      min: 1
      max: 3
      step: 0.25
    answer:
      values:
        - 1
        - 1.25
        - 2
    hints:
      - At 0.6 c, 1 − v² = 0.64.
      - At 0.866 c, 1 − v² = 0.25.
    explanation: γ = 1, 1.25 and 2. The bars grow ever more steeply – near c there is no stopping.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A spaceship flies at 0.8 c (γ = 5/3) to a star 8 light-years away. How many years pass for the **crew** on the way there?
    params:
      unit: years
    answer:
      value: 6
    hints:
      - "Earth time: 8 ÷ 0.8 = 10 years. Divide by γ."
    explanation: 10 ÷ (5/3) = 6 years. For the crew the distance has shrunk to 4.8 light-years.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why must time and space change if light is equally fast for everyone?"
    params:
      keywords:
        - - geschwindigkeit
          - tempo
          - speed
          - schnell
          - fast
        - - weg
          - strecke
          - raum
          - länge
          - distance
          - space
          - length
        - - zeit
          - uhr
          - time
          - clock
        - - beobachter
          - beweg
          - observer
          - mov
          - sicht
          - view
      min: 3
      sample: Speed is distance over time. If two observers moving relative to each other are to measure the same light as equally fast, they must measure distances and times differently.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A pion lives only 26 nanoseconds at rest. In an accelerator it flies at almost the speed of light, with γ = 100. How many metres does it get on average?
    params:
      unit: m
    answer:
      value: 780
      tolerance: 5
    feedback:
      - when: abs(numval(state.input) - 7.8) < 0.1
        misconception: forgot-gamma
        text: That would be without time dilation. Its clock runs 100 times slower.
    hints:
      - "Lifetime in the lab: 100 · 26 ns."
      - Times 3 · 10⁸ m/s.
    explanation: 2.6 µs · 3 · 10⁸ m/s = 780 m instead of 7.8 m. Particle physicists plan their beam lines exactly like this.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: "Some books say: »Fast bodies get heavier.« How is it put more precisely today?"
    params:
      options:
        - label: The rest mass stays the same – energy and momentum grow with γ.
          correct: true
        - label: The mass really grows; the particle gets bigger.
          feedback: An electron stays an electron. What grows is energy and momentum.
        - label: The mass decreases.
          feedback: The rest mass does not change at all.
    hints:
      - What is the same for all observers?
      - p = γ m v and E = γ m c².
    explanation: The rest mass m is a fixed property. With γ, p = γmv and E = γmc² grow without limit. That is why v → c would need infinite energy.
    difficulty: 3

srs:
  cards_from: [gamma, spuerbar]
