id: sci.relativity.energy
type: concept
title: E = mc²
summary: Masse ist gespeicherte Energie.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Formel auf dem T-Shirt
    body: "Die berühmteste Formel der Welt passt auf jedes T-Shirt: $E = mc^2$. Deck die Karten auf: Wo wird **Masse** wirklich zu Energie?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏥
            front: PET-Scanner
            back: Im Krankenhaus treffen Teilchen auf ihre Antiteilchen. Ihre ganze Masse wird zu Licht.
          - icon: ⚛️
            front: Das Proton
            back: Fast seine ganze Masse ist Bewegungs- und Bindungsenergie der Quarks darin.
          - icon: 📜
            front: "1905: Ein Nachtrag"
            back: Einstein schrieb die Idee in einem Aufsatz von nur drei Seiten auf.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Millionen Tonnen Masse verwandelt die Sonne jede Sekunde in Licht?"
    params:
      min: 0
      max: 20
    answer:
      value: 4
      tolerance: 1.5
    explanation: Rund 4 Millionen Tonnen pro Sekunde – seit Milliarden Jahren.

  - kind: explain
    id: s1
    body: |
      Einsteins berühmteste Formel $E = mc^2$ sagt: **Masse** ist eine extrem dichte Form von Energie. Weil $c^2$ riesig ist, steckt schon in winzigen Massen gewaltige Energie.

  - kind: problem
    id: gramm
    widget: choice
    prompt: Wie viel Energie steckt ungefähr in einem einzigen Gramm Masse?
    params:
      options:
        - { label: So viel wie in einer Atombombe, correct: true }
        - { label: So viel wie in einer Batterie, feedback: "Milliardenfach mehr – c² ist eine riesige Zahl." }
        - { label: So viel wie in einem Liter Benzin, feedback: "Immer noch millionenfach zu wenig." }
    hints:
      - "c² ist etwa 90 Billiarden – in Quadratmetern pro Quadratsekunde."
    explanation: Rund 90 Billionen Joule – etwa die Energie der Hiroshima-Bombe.

  - kind: problem
    id: sonne
    widget: choice
    prompt: Woher nimmt die Sonne ihre Energie?
    params:
      options:
        - { label: Bei der Kernfusion geht Masse verloren und wird zu Energie., correct: true }
        - { label: Sie verbrennt Kohle und Gas., feedback: "Chemisches Brennen hätte nur für einige tausend Jahre gereicht." }
    hints:
      - Wasserstoff verschmilzt zu Helium.
    explanation: Ein Heliumkern wiegt weniger als seine Bausteine. Die fehlende Masse wird Licht.

  - kind: problem
    id: wie-viel
    widget: numeric
    prompt: Die Sonne wandelt jede Sekunde etwa 4 Millionen Tonnen Masse in Energie. Wie viele Tonnen sind das pro Minute?
    params: { unit: Mio. t }
    answer: { value: 240 }
    hints:
      - 4 · 60.
    explanation: 240 Millionen Tonnen pro Minute – und trotzdem reicht ihr Vorrat für Milliarden Jahre.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Wie viel Energie steckt in 1 kg Masse? $E = mc^2$ mit c = 3 · 10⁸ m/s. Gib den Exponenten an: 9 · 10 hoch … Joule."
    answer:
      value: 16
    hints:
      - (3 · 10⁸)² = 9 · 10¹⁶.
    explanation: 9 · 10¹⁶ J – der Strombedarf Deutschlands für zwei Monate.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Ein Kraftwerk gibt in einem Jahr 9 · 10¹⁶ J Wärme ab. Wie viele Kilogramm Masse verschwinden dabei aus dem Brennstoff? c = 3 · 10⁸ m/s.
    params:
      unit: kg
    answer:
      value: 1
    feedback:
      - when: abs(numval(state.input) - 300000000) < 1000
        misconception: not-squared
        text: Teile durch c², nicht durch c.
    hints:
      - "m = E : c²."
      - c² = 9 · 10¹⁶.
    explanation: Genau 1 kg. Ein ganzes Jahr Großkraftwerk – ein Kilogramm Masse. Auch ein Kohlekraftwerk verliert Masse, nur unmessbar wenig pro Tonne Kohle.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Wird eine gespannte Feder schwerer als eine entspannte?
    params:
      options:
        - label: Ja, winzig – gespeicherte Energie hat Masse.
          correct: true
        - label: Nein, es kommt ja kein Material dazu.
          feedback: E = mc² gilt für jede Energie, nicht nur für Kernenergie.
        - label: Nein, sie wird leichter.
          feedback: Energie hineinstecken erhöht die Masse.
    hints:
      - Steckt in der gespannten Feder mehr Energie?
      - "Jede Energie E entspricht der Masse E : c²."
    explanation: "10 J Federenergie wiegen 10 : 9 · 10¹⁶ ≈ 10⁻¹⁶ kg – viel zu wenig zum Messen. Bei Kernen sind die Energien so groß, dass man den Massenverlust wiegen kann."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum kann man ein Teilchen mit Masse nie auf Lichtgeschwindigkeit beschleunigen?
    params:
      options:
        - label: Seine Energie wächst mit γ – für v = c wäre unendlich viel Energie nötig
          correct: true
        - label: Weil die Motoren nicht stark genug sind
          feedback: Kein noch so starker Antrieb reicht – es ist eine Grenze der Natur.
        - label: Weil der Luftwiderstand zu groß wird
          feedback: Die Grenze gilt auch im Vakuum.
    hints:
      - Was passiert mit γ, wenn v gegen c geht?
    explanation: Im Teilchenbeschleuniger erreichen Protonen 99,999999 % von c – schneller werden sie kaum, nur »schwerer«.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Die volle Formel lautet $E^2 = (pc)^2 + (mc^2)^2$. In Ruhe ist p = 0 und es bleibt $E = mc^2$. Ein **Photon** hat keine Masse und trotzdem Energie und Impuls: E = pc."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Ein Elektron hat 9,11 · 10⁻³¹ kg Masse. Wie groß ist seine Ruheenergie mc² in MeV? (1 MeV = 1,6 · 10⁻¹³ J, c = 3 · 10⁸ m/s). Auf drei Stellen.
    params:
      unit: MeV
    answer:
      value: 0.512
      tolerance: 0.01
    hints:
      - 9,11 · 10⁻³¹ · 9 · 10¹⁶ ≈ 8,2 · 10⁻¹⁴ J.
      - Durch 1,6 · 10⁻¹³ teilen.
    explanation: Rund 0,51 MeV. Treffen Elektron und Positron aufeinander, entstehen genau zwei Photonen mit je 0,511 MeV – das nutzt die PET-Untersuchung im Krankenhaus.
    difficulty: 3

srs:
  cards_from: [gramm, sonne]
