id: sci.relativity.energy
type: concept
title: E = mc²
summary: Masse ist gespeicherte Energie.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Millionen Tonnen Masse verwandelt die Sonne jede Sekunde in Licht?"
    params:
      min: 0
      max: 20
    answer:
      value: 4
      tolerance: 1.5
    explanation: Rund 4 Millionen Tonnen pro Sekunde – seit Milliarden Jahren.

  - kind: explain
    id: s1
    body: |
      Einsteins berühmteste Formel $E = mc^2$ sagt: **Masse** ist eine extrem dichte Form von Energie. Weil $c^2$ riesig ist, steckt schon in winzigen Massen gewaltige Energie.

  - kind: problem
    id: gramm
    widget: choice
    prompt: Wie viel Energie steckt ungefähr in einem einzigen Gramm Masse?
    params:
      options:
        - { label: So viel wie in einer Atombombe, correct: true }
        - { label: So viel wie in einer Batterie, feedback: "Milliardenfach mehr – c² ist eine riesige Zahl." }
        - { label: So viel wie in einem Liter Benzin, feedback: "Immer noch millionenfach zu wenig." }
    hints:
      - "c² ist etwa 90 Billiarden – in Quadratmetern pro Quadratsekunde."
    explanation: Rund 90 Billionen Joule – etwa die Energie der Hiroshima-Bombe.

  - kind: problem
    id: sonne
    widget: choice
    prompt: Woher nimmt die Sonne ihre Energie?
    params:
      options:
        - { label: Bei der Kernfusion geht Masse verloren und wird zu Energie., correct: true }
        - { label: Sie verbrennt Kohle und Gas., feedback: "Chemisches Brennen hätte nur für einige tausend Jahre gereicht." }
    hints:
      - Wasserstoff verschmilzt zu Helium.
    explanation: Ein Heliumkern wiegt weniger als seine Bausteine. Die fehlende Masse wird Licht.

  - kind: problem
    id: wie-viel
    widget: numeric
    prompt: Die Sonne wandelt jede Sekunde etwa 4 Millionen Tonnen Masse in Energie. Wie viele Tonnen sind das pro Minute?
    params: { unit: Mio. t }
    answer: { value: 240 }
    hints:
      - 4 · 60.
    explanation: 240 Millionen Tonnen pro Minute – und trotzdem reicht ihr Vorrat für Milliarden Jahre.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Wie viel Energie steckt in 1 kg Masse? $E = mc^2$ mit c = 3 · 10⁸ m/s. Gib den Exponenten an: 9 · 10 hoch … Joule."
    answer:
      value: 16
    hints:
      - (3 · 10⁸)² = 9 · 10¹⁶.
    explanation: 9 · 10¹⁶ J – der Strombedarf Deutschlands für zwei Monate.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum kann man ein Teilchen mit Masse nie auf Lichtgeschwindigkeit beschleunigen?
    params:
      options:
        - label: Seine Energie wächst mit γ – für v = c wäre unendlich viel Energie nötig
          correct: true
        - label: Weil die Motoren nicht stark genug sind
          feedback: Kein noch so starker Antrieb reicht – es ist eine Grenze der Natur.
        - label: Weil der Luftwiderstand zu groß wird
          feedback: Die Grenze gilt auch im Vakuum.
    hints:
      - Was passiert mit γ, wenn v gegen c geht?
    explanation: Im Teilchenbeschleuniger erreichen Protonen 99,999999 % von c – schneller werden sie kaum, nur »schwerer«.
    difficulty: 3

srs:
  cards_from: [gramm, sonne]
