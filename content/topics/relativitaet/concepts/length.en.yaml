id: sci.relativity.length
type: concept
title: Moving things get shorter
summary: Length contraction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Moving objects appear **shortened** in their direction of travel, by the same factor γ by which clocks run slower.

  - kind: problem
    id: schiff
    widget: numeric
    prompt: A spaceship is {{l}} m long at rest and flies with γ = {{g}}. How long is it, measured from outside?
    params: { unit: m }
    answer: { value: "{{l / g}}" }
    feedback:
      - when: "numval(state.input) == l * g"
        misconception: longer
        text: Moving lengths shrink. Divide, don't multiply.
    hints:
      - Divide by γ.
    explanation: "{{l}} ÷ {{g}} = {{l / g}} m."
    variants:
      params: { g: "choice[2,4,5]", l: "choice[100,200,400]" }
      defaults: { g: 2, l: 100 }

  - kind: problem
    id: myonen
    widget: choice
    body: Muons form high in the atmosphere and should decay before they could reach the ground. Still, many are measured at the ground.
    prompt: Why do they arrive?
    params:
      options:
        - { label: "For them, the path is shortened and their clock runs slowly.", correct: true }
        - { label: They fly faster than light., feedback: "Nothing with mass is faster than light." }
    hints:
      - The muons fly at almost the speed of light.
    explanation: Relativity is not a thought game. It decides what arrives at the ground.

  - kind: problem
    id: spuren
    widget: choice
    prompt: Do you notice length contraction when driving?
    params:
      options:
        - { label: "No, the effect is tiny.", correct: true }
        - { label: "Yes, cars become visibly shorter.", feedback: "At 100 km/h, the effect is smaller than an atomic nucleus." }
    hints:
      - How close is a car to the speed of light?
    explanation: Only near the speed of light do the effects become large.

srs:
  cards_from: [schiff, myonen]
