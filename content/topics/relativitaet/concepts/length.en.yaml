id: sci.relativity.length
type: concept
title: Moving things get shorter
summary: Length contraction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: At the universe's speed limit
    body: "Nothing in the universe is faster than light. Yet some things get very close. Flip the cards: how close do probes, particles and rays get to the **speed of light**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚀
            front: Parker probe
            back: The fastest space probe flies at almost 200 km/s – less than a thousandth of light speed.
          - icon: ⚛️
            front: Particle accelerator
            back: At CERN, protons race around at 99.999999% of light speed.
          - icon: ☄️
            front: Cosmic rays
            back: A single particle from space once carried as much energy as a thrown ball.

  - kind: problem
    id: hook
    widget: choice
    prompt: A spaceship races past you at almost the speed of light. How does it appear to you?
    params:
      options:
        - label: Squashed in the direction of flight
          correct: true
        - label: Stretched longer
          feedback: It is the other way round.
        - label: Unchanged
          feedback: At such speeds much changes.
    hints:
      - Moving clocks run slow. And lengths?
    explanation: Not only time but also space depends on speed.

  - kind: explain
    id: s1
    body: |
      Moving objects appear **shortened** in their direction of travel, by the same factor γ by which clocks run slower.

  - kind: problem
    id: schiff
    widget: numeric
    prompt: A spaceship is {{l}} m long at rest and flies with γ = {{g}}. How long is it, measured from outside?
    params: { unit: m }
    answer: { value: "{{l / g}}" }
    feedback:
      - when: "numval(state.input) == l * g"
        misconception: longer
        text: Moving lengths shrink. Divide, don't multiply.
    hints:
      - Divide by γ.
    explanation: "{{l}} ÷ {{g}} = {{l / g}} m."
    variants:
      params: { g: "choice[2,4,5]", l: "choice[100,200,400]" }
      defaults: { g: 2, l: 100 }

  - kind: problem
    id: myonen
    widget: choice
    body: Muons form high in the atmosphere and should decay before they could reach the ground. Still, many are measured at the ground.
    prompt: Why do they arrive?
    params:
      options:
        - { label: "For them, the path is shortened and their clock runs slowly.", correct: true }
        - { label: They fly faster than light., feedback: "Nothing with mass is faster than light." }
    hints:
      - The muons fly at almost the speed of light.
    explanation: Relativity is not a thought game. It decides what arrives at the ground.

  - kind: problem
    id: spuren
    widget: choice
    prompt: Do you notice length contraction when driving?
    params:
      options:
        - { label: "No, the effect is tiny.", correct: true }
        - { label: "Yes, cars become visibly shorter.", feedback: "At 100 km/h, the effect is smaller than an atomic nucleus." }
    hints:
      - How close is a car to the speed of light?
    explanation: Only near the speed of light do the effects become large.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: A spaceship flies past. Order by the length you measure – from long to short.
    params:
      items:
        - label: It is at rest
        - label: Half the speed of light
        - label: 90% of the speed of light
        - label: 99% of the speed of light
    hints:
      - The faster, the shorter.
    explanation: At 99% you measure only a seventh of the rest length.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The muons from before fly with γ = 20. How thick is the 10 km atmosphere from **their** view – in metres?
    params:
      unit: m
    answer:
      value: 500
    hints:
      - 10,000 m divided by γ.
    explanation: 500 m – less than their 660 m range. Both viewpoints reach the same result.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: How fast must a rod fly to shrink to half its length? As a fraction of c, to three decimals.
    answer:
      value: 0.866
      tolerance: 0.003
    feedback:
      - when: abs(numval(state.input) - 0.5) < 0.003
        misconception: v-vs-gamma
        text: Half length means γ = 2, not v = 0.5 c. At 0.5 c γ is only 1.15.
    hints:
      - Half length means γ = 2. So √(1 − v²) = 0.5.
      - 1 − v² = 0.25, so v² = 0.75.
    explanation: v = √0.75 ≈ 0.866 c – 87 % of the speed of light.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: A spaceship passes you with γ = 2. Does it get narrower too?
    params:
      options:
        - label: No – it only contracts in the direction of motion.
          correct: true
        - label: Yes, it shrinks in all directions.
          feedback: Across the motion nothing changes. Otherwise there would be contradictions about who fits through which ring.
        - label: It gets wider so the volume stays the same.
          feedback: Volume is not conserved. Only the length along the motion changes.
    hints:
      - What moves, and in which direction?
      - Across the motion both measure the same.
    explanation: Contraction only affects the direction of motion. The ship looks squashed along its path; height and width stay.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A 10 m pole flies with γ = 2 through a 6 m barn. Does it fit inside?
    params:
      options:
        - label: From the barn’s view yes (5 m) – from the pole’s view the doors do not close simultaneously
          correct: true
        - label: No, never
          feedback: For the barn the pole is only 5 m long.
        - label: Yes, from every view alike
          feedback: For the pole the barn is only 3 m long. The solution lies in simultaneity.
    hints:
      - Who says both doors are closed “at the same time”?
    explanation: The **barn paradox** dissolves because simultaneity depends on the observer.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Time and space are linked. The **spacetime interval** $s^2 = (ct)^2 - x^2$ is the same for all observers. Whoever measures more distance between two events also measures more time – but s stays the same.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: An event lies 5 light-years away and 13 years later. Someone travels uniformly from one event to the other. How many years pass for them?
    params:
      unit: years
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 8
        misconception: no-squares
        text: "Do not subtract directly – the quantities are squared: √(13² − 5²)."
    hints:
      - For the traveller x = 0. Their time is s.
      - s² = 13² − 5² = 169 − 25.
    explanation: √144 = 12 years of proper time. It looks like Pythagoras – only with a minus. That is the geometry of spacetime.
    difficulty: 3

srs:
  cards_from: [schiff, myonen]
