id: sci.relativity.time
type: concept
title: Bewegte Uhren gehen langsamer
summary: Zeitdilatation.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Astronaut war ein halbes Jahr auf der Raumstation (28 000 km/h). Um wie viele Millisekunden ist er weniger gealtert?"
    params:
      min: 0
      max: 100
      unit: ms
    answer:
      value: 5
      tolerance: 4
    explanation: Etwa 5 Millisekunden. Winzig, aber mit Atomuhren messbar.


  - kind: explain
    id: s1
    body: |
      Eine schnell bewegte Uhr tickt – von außen betrachtet – langsamer. Um wie viel, sagt der **Faktor γ** (Gamma). Bei 87 % der Lichtgeschwindigkeit ist γ = 2: Die Zeit vergeht halb so schnell.

  - kind: problem
    id: reise
    widget: numeric
    prompt: Ein Raumschiff fliegt mit γ = {{g}}. Für die Crew vergehen {{t}} Jahre. Wie viele Jahre vergehen auf der Erde?
    params: { unit: Jahre }
    answer: { value: "{{g * t}}" }
    feedback:
      - when: "numval(state.input) == t / g"
        misconception: inverted
        text: Die Uhr an Bord geht langsamer – auf der Erde vergeht mehr Zeit.
    hints:
      - "Die Erdzeit ist γ-mal so lang."
    explanation: "{{g}} · {{t}} = {{g * t}} Jahre – die Crew kehrt jünger zurück als ihre Zwillinge."
    variants:
      params: { g: "int[2,5]", t: "int[2,10]" }
      defaults: { g: 2, t: 5 }

  - kind: problem
    id: gps
    widget: choice
    prompt: Warum müssen GPS-Satelliten die Relativitätstheorie berücksichtigen?
    params:
      options:
        - { label: Ihre Uhren gehen messbar anders als auf der Erde., correct: true }
        - { label: Sie fliegen schneller als Licht., feedback: "Sie fliegen etwa 4 km pro Sekunde – weit unter Lichtgeschwindigkeit." }
    hints:
      - Schon winzige Uhrenfehler bedeuten große Ortsfehler.
    explanation: Ohne Korrektur wäre die Ortung nach einem Tag kilometerweit falsch.

  - kind: problem
    id: wer
    widget: choice
    prompt: Wer altert bei einer Reise mit fast Lichtgeschwindigkeit langsamer?
    params:
      options:
        - { label: Wer reist und umkehrt, correct: true }
        - { label: Wer zu Hause bleibt, feedback: "Die Reisende wechselt das Bezugssystem beim Umkehren – sie ist am Ende jünger." }
    hints:
      - Wer beschleunigt und bremst?
    explanation: Das berühmte Zwillingsparadoxon – messbar mit Atomuhren in Flugzeugen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Faktor ist $\gamma = \frac{1}{\sqrt{1 - v^2}}$. Wie groß ist γ bei v = 0,6 c?
    answer:
      value: 1.25
    hints:
      - 1 − 0,36 = 0,64. Die Wurzel daraus ist 0,8.
    explanation: "1 : 0,8 = 1,25. Bei 60 % der Lichtgeschwindigkeit vergeht die Zeit um ein Viertel langsamer."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Myonen entstehen in 10 km Höhe und leben nur 2,2 Mikrosekunden – das reicht für 660 m. Sie fliegen mit γ = 20. Wie viele Kilometer schaffen sie aus unserer Sicht?
    params:
      unit: km
    answer:
      value: 13.2
      tolerance: 0.2
    hints:
      - "Ihre Uhr geht 20-mal langsamer: 660 m · 20."
    explanation: 13,2 km – genug bis zum Boden. Dass wir sie dort messen, ist ein direkter Beweis der Zeitdilatation.
    difficulty: 3

srs:
  cards_from: [reise, gps]
