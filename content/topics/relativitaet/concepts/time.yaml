id: sci.relativity.time
type: concept
title: Bewegte Uhren gehen langsamer
summary: Zeitdilatation.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Uhr im Raumschiff
    body: "Für schnelle Reisende vergeht die Zeit langsamer. Nach rechts laufen die Jahre an Bord, nach oben die Jahre auf der Erde. Zieh das **Tempo** Richtung Licht: Was passiert mit der Linie?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: x/sqrt(1 - v^2)
        x:
          - 0
          - 10
        y:
          - 0
          - 50
        sliders:
          - id: v
            label: Tempo (Anteil von c)
            min: 0
            max: 0.98
            step: 0.02
            initial: 0.5

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Astronaut war ein halbes Jahr auf der Raumstation (28 000 km/h). Um wie viele Millisekunden ist er weniger gealtert?"
    params:
      min: 0
      max: 100
      unit: ms
    answer:
      value: 5
      tolerance: 4
    explanation: Etwa 5 Millisekunden. Winzig, aber mit Atomuhren messbar.

  - kind: explain
    id: s1
    body: |
      Eine schnell bewegte Uhr tickt – von außen betrachtet – langsamer. Um wie viel, sagt der **Faktor γ** (Gamma). Bei 87 % der Lichtgeschwindigkeit ist γ = 2: Die Zeit vergeht halb so schnell.

  - kind: problem
    id: reise
    widget: numeric
    prompt: Ein Raumschiff fliegt mit γ = {{g}}. Für die Crew vergehen {{t}} Jahre. Wie viele Jahre vergehen auf der Erde?
    params: { unit: Jahre }
    answer: { value: "{{g * t}}" }
    feedback:
      - when: "numval(state.input) == t / g"
        misconception: inverted
        text: Die Uhr an Bord geht langsamer – auf der Erde vergeht mehr Zeit.
    hints:
      - "Die Erdzeit ist γ-mal so lang."
    explanation: "{{g}} · {{t}} = {{g * t}} Jahre – die Crew kehrt jünger zurück als ihre Zwillinge."
    variants:
      params: { g: "int[2,5]", t: "int[2,10]" }
      defaults: { g: 2, t: 5 }

  - kind: problem
    id: gps
    widget: choice
    prompt: Warum müssen GPS-Satelliten die Relativitätstheorie berücksichtigen?
    params:
      options:
        - { label: Ihre Uhren gehen messbar anders als auf der Erde., correct: true }
        - { label: Sie fliegen schneller als Licht., feedback: "Sie fliegen etwa 4 km pro Sekunde – weit unter Lichtgeschwindigkeit." }
    hints:
      - Schon winzige Uhrenfehler bedeuten große Ortsfehler.
    explanation: Ohne Korrektur wäre die Ortung nach einem Tag kilometerweit falsch.

  - kind: problem
    id: wer
    widget: choice
    prompt: Wer altert bei einer Reise mit fast Lichtgeschwindigkeit langsamer?
    params:
      options:
        - { label: Wer reist und umkehrt, correct: true }
        - { label: Wer zu Hause bleibt, feedback: "Die Reisende wechselt das Bezugssystem beim Umkehren – sie ist am Ende jünger." }
    hints:
      - Wer beschleunigt und bremst?
    explanation: Das berühmte Zwillingsparadoxon – messbar mit Atomuhren in Flugzeugen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Faktor ist $\gamma = \frac{1}{\sqrt{1 - v^2}}$. Wie groß ist γ bei v = 0,6 c?
    answer:
      value: 1.25
    hints:
      - 1 − 0,36 = 0,64. Die Wurzel daraus ist 0,8.
    explanation: "1 : 0,8 = 1,25. Bei 60 % der Lichtgeschwindigkeit vergeht die Zeit um ein Viertel langsamer."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Berechne γ = 1 : √(1 − v²) für v = {{v}} c. Auf zwei Stellen."
    answer:
      value: "{{1 / sqrt(1 - v * v)}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - sqrt(1 - v * v)) < 0.01
        misconception: forgot-reciprocal
        text: Das ist √(1 − v²). γ ist der **Kehrwert** davon.
    hints:
      - Erst v² berechnen, dann 1 − v².
      - Wurzel ziehen und den Kehrwert bilden.
    explanation: γ = {{1 / sqrt(1 - v * v)}}. Unter 0,5 c bleibt γ fast 1. Ab 0,9 c wächst es steil.
    difficulty: 2
    variants:
      params:
        v: choice[0.6,0.8,0.96]
      defaults:
        v: 0.8

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: "Zwillingsparadoxon: Jeder Zwilling sieht die Uhr des anderen langsamer gehen. Warum ist trotzdem der Reisende jünger?"
    params:
      options:
        - label: Er muss umkehren und wechselt dabei das Bezugssystem – die Lage ist nicht symmetrisch.
          correct: true
        - label: Weil Raumfahrt den Körper schont.
          feedback: Es geht nicht um Biologie. Alle Uhren laufen gleich langsamer.
        - label: Er ist gar nicht jünger – das ist ein Widerspruch.
          feedback: Messungen mit Uhren in Flugzeugen bestätigen den Effekt.
    hints:
      - Wer von beiden spürt Beschleunigung?
      - Nur der Zuhausegebliebene bleibt die ganze Zeit in einem Bezugssystem.
    explanation: Der Erdzwilling ruht die ganze Zeit in einem Inertialsystem. Der Reisende wechselt beim Umkehren in ein anderes. Seine Weltlinie ist kürzer – er erlebt weniger Zeit.
    difficulty: 2

  - kind: problem
    id: intro-d1
    depth: 2
    widget: slider
    prompt: An Bord vergehen 15 Jahre, auf der Erde 25 Jahre. Stelle das Tempo so ein, dass die Linie durch den Punkt geht.
    params:
      expr: x/sqrt(1 - v^2)
      x:
        - 0
        - 20
      y:
        - 0
        - 50
      showCoordinates: false
      sliders:
        - id: v
          label: Tempo (Anteil von c)
          min: 0
          max: 0.98
          step: 0.02
          initial: 0.5
      markers:
        - x: 15
          y: 25
          label: 15 → 25
    answer:
      values:
        v: 0.8
    hints:
      - "Auf der Erde vergeht γ-mal so viel Zeit: γ = 25 : 15 = 5/3."
      - γ = 5/3 heißt √(1 − v²) = 3/5. Welches v passt?
    explanation: "Bei 80 % der Lichtgeschwindigkeit ist γ = 1 : 0,6 = 5/3. Aus 15 Jahren an Bord werden 25 Jahre auf der Erde."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Myonen entstehen in 10 km Höhe und leben nur 2,2 Mikrosekunden – das reicht für 660 m. Sie fliegen mit γ = 20. Wie viele Kilometer schaffen sie aus unserer Sicht?
    params:
      unit: km
    answer:
      value: 13.2
      tolerance: 0.2
    hints:
      - "Ihre Uhr geht 20-mal langsamer: 660 m · 20."
    explanation: 13,2 km – genug bis zum Boden. Dass wir sie dort messen, ist ein direkter Beweis der Zeitdilatation.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Für kleine Tempi gilt γ ≈ 1 + v² : (2c²). Ein Flugzeug fliegt 10 Stunden mit 250 m/s. Um wie viele Nanosekunden geht seine Uhr nach? Nur spezielle Relativität, c = 3 · 10⁸ m/s."
    params:
      unit: ns
    answer:
      value: 12.5
      tolerance: 0.3
    hints:
      - "v² : (2c²) = 62 500 : (1,8 · 10¹⁷) ≈ 3,5 · 10⁻¹³."
      - Mal 36 000 Sekunden.
    explanation: 3,47 · 10⁻¹³ · 36 000 s ≈ 1,25 · 10⁻⁸ s = 12,5 ns. Hafele und Keating maßen 1971 solche Effekte mit Atomuhren in Linienflugzeugen.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Um wie viele Mikrosekunden pro Tag gehen GPS-Uhren gegenüber Uhren am Boden insgesamt vor?"
    params:
      min: 0
      max: 100
    answer:
      value: 38
      tolerance: 5
    explanation: Rund 38 µs. Die schwächere Schwerkraft oben macht sie um 45 µs schneller, das Tempo um 7 µs langsamer. Ohne Korrektur wäre GPS nach einem Tag um über 10 km falsch.
    difficulty: 3

srs:
  cards_from: [reise, gps]
