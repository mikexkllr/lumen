id: sci.relativity.light
type: concept
title: Licht ist immer gleich schnell
summary: Der Ausgangspunkt von Einstein.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: zug
    widget: numeric
    prompt: Ein Zug fährt 100 km/h. Im Zug wirft jemand einen Ball mit {{v}} km/h nach vorn. Wie schnell ist der Ball vom Bahnsteig aus?
    params: { unit: km/h }
    answer: { value: "{{100 + v}}" }
    hints:
      - Die Geschwindigkeiten addieren sich.
    explanation: "100 + {{v}} = {{100 + v}} km/h – im Alltag addieren sich Tempi einfach."
    variants:
      params: { v: "int[10,40]" }
      defaults: { v: 20 }

  - kind: problem
    id: licht
    widget: choice
    prompt: Jetzt schaltet jemand im Zug eine Lampe nach vorn an. Wie schnell ist das Licht vom Bahnsteig aus?
    params:
      options:
        - { label: Genau Lichtgeschwindigkeit, correct: true }
        - { label: Lichtgeschwindigkeit plus 100 km/h, feedback: "So würde man es erwarten – Messungen zeigen aber immer exakt dasselbe Tempo." }
    hints:
      - Licht ist die große Ausnahme.
    explanation: Licht ist für alle Beobachter gleich schnell – egal wie sie sich bewegen.

  - kind: explain
    body: |
      Wenn Licht für alle gleich schnell ist, müssen sich stattdessen **Zeit und Raum** anpassen. Das ist der Kern von Einsteins **spezieller Relativitätstheorie**.

  - kind: problem
    id: grenze
    widget: choice
    prompt: Kann ein Raumschiff mit Antrieb schneller als das Licht werden?
    params:
      options:
        - { label: Nein – Licht ist die Höchstgeschwindigkeit., correct: true }
        - { label: "Ja, mit genug Energie", feedback: "Je näher man dem Licht kommt, desto mehr Energie braucht jeder weitere Schritt – unendlich viel am Ende." }
    hints:
      - Was kostet jeder weitere km/h nahe der Lichtgeschwindigkeit?
    explanation: Für Masse ist Lichtgeschwindigkeit unerreichbar.

srs:
  cards_from: [licht, grenze]
