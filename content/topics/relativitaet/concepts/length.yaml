id: sci.relativity.length
type: concept
title: Bewegte Dinge werden kürzer
summary: Längenkontraktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Raumschiff rast fast mit Lichtgeschwindigkeit an dir vorbei. Wie erscheint es dir?
    params:
      options:
        - label: In Flugrichtung gestaucht
          correct: true
        - label: Länger gezogen
          feedback: Es ist umgekehrt.
        - label: Unverändert
          feedback: Bei solchen Tempos ändert sich vieles.
    hints:
      - Bewegte Uhren gehen langsamer. Und Längen?
    explanation: Nicht nur die Zeit, auch der Raum hängt vom Tempo ab.

  - kind: explain
    id: s1
    body: |
      Bewegte Objekte erscheinen in Flugrichtung **verkürzt** – um denselben Faktor γ, um den Uhren langsamer gehen.

  - kind: problem
    id: schiff
    widget: numeric
    prompt: Ein Raumschiff ist im Ruhezustand {{l}} m lang und fliegt mit γ = {{g}}. Wie lang ist es von außen gemessen?
    params: { unit: m }
    answer: { value: "{{l / g}}" }
    feedback:
      - when: "numval(state.input) == l * g"
        misconception: longer
        text: Bewegte Längen schrumpfen – geteilt, nicht mal.
    hints:
      - Teile durch γ.
    explanation: "{{l}} : {{g}} = {{l / g}} m."
    variants:
      params: { g: "choice[2,4,5]", l: "choice[100,200,400]" }
      defaults: { g: 2, l: 100 }

  - kind: problem
    id: myonen
    widget: choice
    body: Myonen entstehen hoch in der Atmosphäre und zerfallen eigentlich, bevor sie den Boden erreichen könnten. Trotzdem misst man viele am Boden.
    prompt: Warum kommen sie an?
    params:
      options:
        - { label: Für sie ist der Weg verkürzt und ihre Uhr läuft langsam., correct: true }
        - { label: Sie fliegen schneller als Licht., feedback: "Nichts mit Masse ist schneller als Licht." }
    hints:
      - Die Myonen fliegen mit fast Lichtgeschwindigkeit.
    explanation: Relativität ist kein Gedankenspiel – sie entscheidet, was am Boden ankommt.

  - kind: problem
    id: spuren
    widget: choice
    prompt: Merkst du die Längenkontraktion beim Autofahren?
    params:
      options:
        - { label: Nein – der Effekt ist winzig., correct: true }
        - { label: Ja – Autos werden sichtbar kürzer., feedback: "Bei 100 km/h ist der Effekt kleiner als ein Atomkern." }
    hints:
      - Wie nah ist ein Auto an der Lichtgeschwindigkeit?
    explanation: Erst nahe der Lichtgeschwindigkeit werden die Effekte groß.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ein Raumschiff fliegt vorbei. Ordne nach der Länge, die du misst – von lang nach kurz.
    params:
      items:
        - label: Es steht still
        - label: Halbe Lichtgeschwindigkeit
        - label: 90 % der Lichtgeschwindigkeit
        - label: 99 % der Lichtgeschwindigkeit
    hints:
      - Je schneller, desto kürzer.
    explanation: Bei 99 % misst du nur noch ein Siebtel der Ruhelänge.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Myonen von eben fliegen mit γ = 20. Wie dick ist die 10 km dicke Atmosphäre aus **ihrer** Sicht – in Metern?
    params:
      unit: m
    answer:
      value: 500
    hints:
      - 10 000 m geteilt durch γ.
    explanation: 500 m – weniger als ihre 660 m Reichweite. Beide Sichtweisen kommen zum selben Ergebnis.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Wie schnell muss ein Stab fliegen, damit er auf die Hälfte seiner Länge schrumpft? In Anteilen von c, auf drei Stellen.
    answer:
      value: 0.866
      tolerance: 0.003
    feedback:
      - when: abs(numval(state.input) - 0.5) < 0.003
        misconception: v-vs-gamma
        text: Halbe Länge heißt γ = 2, nicht v = 0,5 c. Bei 0,5 c ist γ nur 1,15.
    hints:
      - Halbe Länge heißt γ = 2. Also √(1 − v²) = 0,5.
      - 1 − v² = 0,25, also v² = 0,75.
    explanation: v = √0,75 ≈ 0,866 c – 87 % der Lichtgeschwindigkeit.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Ein Raumschiff fliegt mit γ = 2 an dir vorbei. Wird es auch schmaler?
    params:
      options:
        - label: Nein – es verkürzt sich nur in Flugrichtung.
          correct: true
        - label: Ja, es schrumpft in alle Richtungen.
          feedback: Quer zur Bewegung ändert sich nichts. Sonst gäbe es Widersprüche, wer durch welchen Ring passt.
        - label: Es wird breiter, damit das Volumen gleich bleibt.
          feedback: Das Volumen bleibt nicht gleich. Nur die Länge in Flugrichtung ändert sich.
    hints:
      - Was bewegt sich, und in welche Richtung?
      - Quer zur Bewegung messen beide dasselbe.
    explanation: Die Kontraktion betrifft nur die Richtung der Bewegung. Das Raumschiff wirkt wie eine flachgedrückte Scheibe in Flugrichtung, Höhe und Breite bleiben.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein 10 m langer Stab fliegt mit γ = 2 durch eine 6 m lange Scheune. Passt er hinein?
    params:
      options:
        - label: Aus Sicht der Scheune ja (5 m) – aus Sicht des Stabs schließen die Tore nicht gleichzeitig
          correct: true
        - label: Nein, nie
          feedback: Für die Scheune ist der Stab nur 5 m lang.
        - label: Ja, aus jeder Sicht gleich
          feedback: Für den Stab ist die Scheune nur 3 m lang. Die Lösung liegt in der Gleichzeitigkeit.
    hints:
      - Wer sagt, dass beide Tore »gleichzeitig« zu sind?
    explanation: Das **Scheunen-Paradoxon** löst sich auf, weil Gleichzeitigkeit vom Beobachter abhängt.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Zeit und Raum hängen zusammen. Für alle Beobachter gleich bleibt das **Raumzeit-Intervall** $s^2 = (ct)^2 - x^2$. Wer zwischen zwei Ereignissen mehr Strecke misst, misst auch mehr Zeit – aber s bleibt.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Ein Ereignis liegt 5 Lichtjahre entfernt und 13 Jahre später. Jemand reist gleichförmig von einem Ereignis zum anderen. Wie viele Jahre vergehen für ihn?
    params:
      unit: Jahre
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 8
        misconception: no-squares
        text: "Nicht abziehen – die Größen stehen im Quadrat: √(13² − 5²)."
    hints:
      - Für den Reisenden ist x = 0. Seine Zeit ist s.
      - s² = 13² − 5² = 169 − 25.
    explanation: √144 = 12 Jahre Eigenzeit. Die Rechnung sieht aus wie Pythagoras – nur mit Minus. Das ist die Geometrie der Raumzeit.
    difficulty: 3

srs:
  cards_from: [schiff, myonen]
