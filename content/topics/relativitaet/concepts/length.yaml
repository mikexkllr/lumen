id: sci.relativity.length
type: concept
title: Bewegte Dinge werden kürzer
summary: Längenkontraktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Bewegte Objekte erscheinen in Flugrichtung **verkürzt** – um denselben Faktor γ, um den Uhren langsamer gehen.

  - kind: problem
    id: schiff
    widget: numeric
    prompt: Ein Raumschiff ist im Ruhezustand {{l}} m lang und fliegt mit γ = {{g}}. Wie lang ist es von außen gemessen?
    params: { unit: m }
    answer: { value: "{{l / g}}" }
    feedback:
      - when: "numval(state.input) == l * g"
        misconception: longer
        text: Bewegte Längen schrumpfen – geteilt, nicht mal.
    hints:
      - Teile durch γ.
    explanation: "{{l}} : {{g}} = {{l / g}} m."
    variants:
      params: { g: "choice[2,4,5]", l: "choice[100,200,400]" }
      defaults: { g: 2, l: 100 }

  - kind: problem
    id: myonen
    widget: choice
    body: Myonen entstehen hoch in der Atmosphäre und zerfallen eigentlich, bevor sie den Boden erreichen könnten. Trotzdem misst man viele am Boden.
    prompt: Warum kommen sie an?
    params:
      options:
        - { label: Für sie ist der Weg verkürzt und ihre Uhr läuft langsam., correct: true }
        - { label: Sie fliegen schneller als Licht., feedback: "Nichts mit Masse ist schneller als Licht." }
    hints:
      - Die Myonen fliegen mit fast Lichtgeschwindigkeit.
    explanation: Relativität ist kein Gedankenspiel – sie entscheidet, was am Boden ankommt.

  - kind: problem
    id: spuren
    widget: choice
    prompt: Merkst du die Längenkontraktion beim Autofahren?
    params:
      options:
        - { label: Nein – der Effekt ist winzig., correct: true }
        - { label: Ja – Autos werden sichtbar kürzer., feedback: "Bei 100 km/h ist der Effekt kleiner als ein Atomkern." }
    hints:
      - Wie nah ist ein Auto an der Lichtgeschwindigkeit?
    explanation: Erst nahe der Lichtgeschwindigkeit werden die Effekte groß.

srs:
  cards_from: [schiff, myonen]
