id: sci.relativity.light
type: concept
title: Light always has the same speed
summary: Einstein's starting point.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: zug
    widget: numeric
    prompt: A train travels 100 km/h. On the train, someone throws a ball forward at {{v}} km/h. How fast is the ball from the platform's point of view?
    params: { unit: km/h }
    answer: { value: "{{100 + v}}" }
    hints:
      - The speeds add up.
    explanation: "100 + {{v}} = {{100 + v}} km/h. In everyday life, speeds simply add."
    variants:
      params: { v: "int[10,40]" }
      defaults: { v: 20 }

  - kind: problem
    id: licht
    widget: choice
    prompt: Now someone on the train switches on a lamp pointing forward. How fast is the light from the platform's point of view?
    params:
      options:
        - { label: Exactly the speed of light, correct: true }
        - { label: The speed of light plus 100 km/h, feedback: "That is what you would expect. But measurements always show exactly the same speed." }
    hints:
      - Light is the big exception.
    explanation: Light has the same speed for all observers, however they move.

  - kind: explain
    id: s3
    body: |
      If light has the same speed for everyone, then **time and space** must adjust instead. This is the core of Einstein's **special relativity**.

  - kind: problem
    id: grenze
    widget: choice
    prompt: Can a spaceship with an engine become faster than light?
    params:
      options:
        - { label: "No, light is the top speed.", correct: true }
        - { label: "Yes, with enough energy", feedback: "The closer you get to light, the more energy each further step needs, in the end infinitely much." }
    hints:
      - What does each extra km/h cost near the speed of light?
    explanation: For anything with mass, the speed of light is out of reach.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Light is equally fast for every observer.
          right: true
        - text: Someone flying after light sees it slow down.
          right: false
          why: It still recedes at exactly c.
        - text: Nothing with mass reaches the speed of light.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Velocities add relativistically like this: $w = \\frac{u + v}{1 + uv}$ (as fractions of c). Two spaceships fly at 0.5 c each towards one another. How fast do they approach from one ship’s view?"
    params:
      unit: c
    answer:
      value: 0.8
    hints:
      - (0.5 + 0.5) ÷ (1 + 0.25).
    explanation: 1 ÷ 1.25 = 0.8 c – not 1 c. The formula always stays below the speed of light.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: "In 1887 Michelson and Morley looked for the »ether wind«: light should travel at different speeds depending on its direction relative to Earth's motion. What did they find?"
    params:
      options:
        - label: No difference – light was equally fast in every direction.
          correct: true
        - label: A small difference, as expected.
          feedback: Their apparatus was precise enough – and showed nothing.
        - label: Light was faster against Earth's motion.
          feedback: The ether predicted a difference – but nothing was measured.
    hints:
      - It is the most famous »failed« experiment in physics.
      - Einstein turned the result into a principle.
    explanation: "Earth races round the Sun at 30 km/s – and still no effect. In 1905 Einstein concluded: light is equally fast for everyone; no ether is needed."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: A spaceship flies at {{u}} c. It fires a probe forward at {{v}} c. How fast is the probe seen from outside? Use w = (u + v) ÷ (1 + u · v). As a fraction of c, to three decimals.
    answer:
      value: "{{(u + v) / (1 + u * v)}}"
      tolerance: 0.003
    feedback:
      - when: abs(numval(state.input) - (u + v)) < 0.003
        misconception: galilean-addition
        text: Plain adding only works at low speeds. Still divide by 1 + u · v.
    hints:
      - "Numerator: {{u}} + {{v}}. Denominator: 1 + {{u}} · {{v}}."
      - The result must stay below 1.
    explanation: w = {{(u + v) / (1 + u * v)}} c. However you combine them, it always stays below 1. At everyday speeds u · v is tiny and you simply add.
    difficulty: 2
    variants:
      params:
        u: choice[0.5,0.6,0.8]
        v: choice[0.5,0.6,0.8]
      defaults:
        u: 0.8
        v: 0.6

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Two lightning bolts strike the front and back of a moving train. On the platform they are simultaneous. And for someone on the train?
    params:
      options:
        - label: The front bolt comes first – simultaneity is relative
          correct: true
        - label: Also simultaneous
          feedback: The passenger moves towards the front light, and light is equally fast for them.
        - label: The rear bolt comes first
          feedback: They move away from the rear light.
    hints:
      - The passenger sits in the middle and moves forward.
    explanation: There is no universal “now”. This is the deepest consequence of the constant speed of light.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "A **light clock**: a pulse bounces between two mirrors a distance L apart. If the clock flies past at v, the light travels on a slant. Pythagoras gives $(ct)^2 = L^2 + (vt)^2$, so $t = \\gamma \\cdot \\frac{L}{c}$."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A light clock ticks once per microsecond at rest. It flies past you at 0.8 c. How many microseconds does one tick last for you? To two decimals.
    params:
      unit: µs
    answer:
      value: 1.67
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 0.6) < 0.01
        misconception: inverse-gamma
        text: Moving clocks run **slow** – a tick lasts longer, not shorter.
    hints:
      - γ = 1 ÷ √(1 − 0.8²) = 1 ÷ √0.36.
      - 1 ÷ 0.6 = ?
    explanation: γ = 1 ÷ 0.6 ≈ 1.67. The slanted light path is longer, but light is not faster – so each tick takes longer.
    difficulty: 3

srs:
  cards_from: [licht, grenze]
