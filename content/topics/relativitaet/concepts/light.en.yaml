id: sci.relativity.light
type: concept
title: Light always has the same speed
summary: Einstein's starting point.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: zug
    widget: numeric
    prompt: A train travels 100 km/h. On the train, someone throws a ball forward at {{v}} km/h. How fast is the ball from the platform's point of view?
    params: { unit: km/h }
    answer: { value: "{{100 + v}}" }
    hints:
      - The speeds add up.
    explanation: "100 + {{v}} = {{100 + v}} km/h. In everyday life, speeds simply add."
    variants:
      params: { v: "int[10,40]" }
      defaults: { v: 20 }

  - kind: problem
    id: licht
    widget: choice
    prompt: Now someone on the train switches on a lamp pointing forward. How fast is the light from the platform's point of view?
    params:
      options:
        - { label: Exactly the speed of light, correct: true }
        - { label: The speed of light plus 100 km/h, feedback: "That is what you would expect. But measurements always show exactly the same speed." }
    hints:
      - Light is the big exception.
    explanation: Light has the same speed for all observers, however they move.

  - kind: explain
    body: |
      If light has the same speed for everyone, then **time and space** must adjust instead. This is the core of Einstein's **special relativity**.

  - kind: problem
    id: grenze
    widget: choice
    prompt: Can a spaceship with an engine become faster than light?
    params:
      options:
        - { label: "No, light is the top speed.", correct: true }
        - { label: "Yes, with enough energy", feedback: "The closer you get to light, the more energy each further step needs, in the end infinitely much." }
    hints:
      - What does each extra km/h cost near the speed of light?
    explanation: For anything with mass, the speed of light is out of reach.

srs:
  cards_from: [licht, grenze]
