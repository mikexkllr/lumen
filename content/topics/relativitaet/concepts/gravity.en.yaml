id: sci.relativity.gravity
type: concept
title: Gravity is curvature
summary: General relativity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: From apple to spacetime
    body: "For Newton, a force pulled the apple from the tree. Einstein saw it quite differently. Uncover the ideas step by step: what does **gravity** have to do with space and time?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🍎
            front: Newton
            back: An invisible force pulls the apple to the Earth – and the Moon along its orbit.
          - icon: 💭
            front: Einstein's idea
            back: Someone in free fall feels no weight – as if there were no force at all.
          - icon: 🪐
            front: The test
            back: Mercury's orbit turns a tiny bit too fast. Only Einstein could explain it.
          - icon: ⏱️
            front: Today
            back: "Atomic clocks can already tell: a clock 33 cm higher ticks a little faster."

  - kind: problem
    id: hook
    widget: choice
    prompt: A bowling ball lies on a trampoline. You roll a marble past it. What does the marble do?
    params:
      options:
        - label: It rolls in a curve around the ball
          correct: true
        - label: It rolls straight on
          feedback: The sheet is dented.
        - label: It stops
          feedback: It keeps rolling.
    hints:
      - The heavy ball dents the sheet.
    explanation: "The Sun steers the planets in a similar way: it curves space."

  - kind: explain
    id: s1
    body: |
      According to **general relativity**, mass curves space and time. Planets follow this curvature like balls on a stretched sheet. Near large masses, time even runs slower.

  - kind: problem
    id: licht
    widget: choice
    prompt: What happens to starlight that passes close to the Sun?
    params:
      options:
        - { label: It is deflected., correct: true }
        - { label: "Nothing, since light has no mass.", feedback: "Light follows curved space, even without mass." }
    hints:
      - Light follows curved space.
    explanation: This was measured during a solar eclipse in 1919. It was Einstein's breakthrough.

  - kind: problem
    id: gps
    widget: numeric
    body: GPS clocks run ahead of clocks on Earth by about 38 microseconds per day. Light travels 300 m per microsecond.
    prompt: How many kilometers of position error per day would result without correction?
    params: { unit: km }
    answer: { value: 11.4, tolerance: 0.6 }
    hints:
      - 38 · 300 m.
    explanation: 38 · 300 m = 11,400 m, about 11 km per day.

  - kind: problem
    id: loch
    widget: choice
    prompt: What is a black hole?
    params:
      options:
        - { label: "A curvature so strong that not even light escapes.", correct: true }
        - { label: A hole in space with nothing in it, feedback: "It is the opposite: extremely much mass in the smallest space." }
    hints:
      - Think of the strongest curvature imaginable.
    explanation: Below the event horizon, all paths lead inward.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: On a mountain time passes slightly faster than in the valley.
          right: true
        - text: Light has no mass and is therefore not deflected by gravity.
          right: false
          why: Light follows curved spacetime – first measured in 1919.
        - text: Merging black holes emit gravitational waves.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Einstein’s **equivalence principle**: you stand in a windowless room and feel your weight. What can you **not** tell apart?"
    params:
      options:
        - label: Whether you stand on Earth or in an accelerating rocket
          correct: true
        - label: Whether it is day or night
          feedback: True, but that has nothing to do with gravity.
        - label: Whether you are heavy or light
          feedback: It is about **where** the feeling of weight comes from.
    hints:
      - How does it feel when a lift accelerates upward?
    explanation: Gravity and acceleration are locally indistinguishable. From this Einstein built the whole theory.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Put the satellite on an escape course: so fast that it never returns."
    params:
      scene: orbit
      controls:
        radius:
          fixed: true
    answer:
      kind: 1
    explanation: From about 7.9 km/s. For Newton this is a matter of force – for Einstein the satellite follows the curvature of space.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: GPS clocks run fast by 45 µs per day because of weaker gravity. Because of their speed they run slow by 7 µs per day. By how many µs per day do they run fast overall?
    params:
      unit: µs
    answer:
      value: 38
    feedback:
      - when: numval(state.input) == 52
        misconception: add-effects
        text: "The two effects work against each other: one speeds up, one slows down."
    hints:
      - Running fast and running slow partly cancel.
      - 45 − 7 = ?
    explanation: 38 µs per day. Times the speed of light that is over 11 km of position error. That is why the satellite clocks are deliberately detuned before launch.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: A telescope image shows a distant galaxy as a ring around a nearer one. What has happened?
    params:
      options:
        - label: The mass of the near galaxy curves space and bends the far galaxy's light around itself.
          correct: true
        - label: The distant galaxy really is ring-shaped.
          feedback: Such rings always sit exactly around a mass. That is no coincidence.
        - label: Dust reflects the light.
          feedback: Dust absorbs and scatters but does not form clean rings.
    hints:
      - What does mass do to light paths according to Einstein?
      - The near galaxy acts like a giant lens.
    explanation: That is a gravitational lens. If both line up exactly, the image becomes an Einstein ring. Astronomers weigh galaxies this way – dark matter included.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The radius of a black hole grows with mass: about 3 km per solar mass. How large would the radius be at 10 solar masses?"
    params:
      unit: km
    answer:
      value: 30
    hints:
      - 3 km times 10.
    explanation: 30 km – this is the **Schwarzschild radius**. The Earth would have to be squeezed to 9 mm for that.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: How small would Earth have to be squeezed to become a black hole? We have r = 2GM ÷ c² with G = 6.67 · 10⁻¹¹, M = 5.97 · 10²⁴ kg, c = 3 · 10⁸ m/s. In millimetres, to one decimal.
    params:
      unit: mm
    answer:
      value: 8.9
      tolerance: 0.2
    hints:
      - 2 · 6.67 · 10⁻¹¹ · 5.97 · 10²⁴ ≈ 7.96 · 10¹⁴.
      - Dividing by 9 · 10¹⁶ gives metres.
    explanation: r ≈ 0.0089 m – the whole Earth in a marble just under 2 cm across. For the Sun it is 3 km.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: In 2015 the LIGO lab first picked up waves of gravity. What did it really measure?
    params:
      options:
        - label: Tiny changes in the length of 4 km arms – smaller than a proton's diameter.
          correct: true
        - label: A flash of light from two black holes.
          feedback: Merging black holes do not shine. The vibration of spacetime itself was detected.
        - label: A change in Earth's gravity.
          feedback: The wave stretches and squeezes space; ground-level gravity does not change measurably.
    hints:
      - A gravitational wave stretches and squeezes space.
      - It is measured with laser light between mirrors.
    explanation: Two black holes 1.3 billion light-years away merged. The wave changed the arm length by about 10⁻¹⁸ m. That earned a Nobel Prize in 2017.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why light is bent by the Sun even though it has no mass.
    params:
      keywords:
        - - raum
          - space
          - raumzeit
          - spacetime
        - - krumm
          - krümm
          - curv
          - bend
          - gebogen
        - - weg
          - path
          - folgt
          - follows
          - gerade
          - straight
      sample: The Sun curves spacetime around it. Light always takes the straightest path through spacetime. Because spacetime is curved, the light path follows a curve too – no mass needed.
    difficulty: 3

srs:
  cards_from: [licht, loch]
