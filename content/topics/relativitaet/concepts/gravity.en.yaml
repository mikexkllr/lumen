id: sci.relativity.gravity
type: concept
title: Gravity is curvature
summary: General relativity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A bowling ball lies on a trampoline. You roll a marble past it. What does the marble do?
    params:
      options:
        - label: It rolls in a curve around the ball
          correct: true
        - label: It rolls straight on
          feedback: The sheet is dented.
        - label: It stops
          feedback: It keeps rolling.
    hints:
      - The heavy ball dents the sheet.
    explanation: "The Sun steers the planets in a similar way: it curves space."

  - kind: explain
    id: s1
    body: |
      According to **general relativity**, mass curves space and time. Planets follow this curvature like balls on a stretched sheet. Near large masses, time even runs slower.

  - kind: problem
    id: licht
    widget: choice
    prompt: What happens to starlight that passes close to the Sun?
    params:
      options:
        - { label: It is deflected., correct: true }
        - { label: "Nothing, since light has no mass.", feedback: "Light follows curved space, even without mass." }
    hints:
      - Light follows curved space.
    explanation: This was measured during a solar eclipse in 1919. It was Einstein's breakthrough.

  - kind: problem
    id: gps
    widget: numeric
    body: GPS clocks run ahead of clocks on Earth by about 38 microseconds per day. Light travels 300 m per microsecond.
    prompt: How many kilometers of position error per day would result without correction?
    params: { unit: km }
    answer: { value: 11.4, tolerance: 0.6 }
    hints:
      - 38 · 300 m.
    explanation: 38 · 300 m = 11,400 m, about 11 km per day.

  - kind: problem
    id: loch
    widget: choice
    prompt: What is a black hole?
    params:
      options:
        - { label: "A curvature so strong that not even light escapes.", correct: true }
        - { label: A hole in space with nothing in it, feedback: "It is the opposite: extremely much mass in the smallest space." }
    hints:
      - Think of the strongest curvature imaginable.
    explanation: Below the event horizon, all paths lead inward.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: On a mountain time passes slightly faster than in the valley.
          right: true
        - text: Light has no mass and is therefore not deflected by gravity.
          right: false
          why: Light follows curved spacetime – first measured in 1919.
        - text: Merging black holes emit gravitational waves.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Einstein’s **equivalence principle**: you stand in a windowless room and feel your weight. What can you **not** tell apart?"
    params:
      options:
        - label: Whether you stand on Earth or in an accelerating rocket
          correct: true
        - label: Whether it is day or night
          feedback: True, but that has nothing to do with gravity.
        - label: Whether you are heavy or light
          feedback: It is about **where** the feeling of weight comes from.
    hints:
      - How does it feel when a lift accelerates upward?
    explanation: Gravity and acceleration are locally indistinguishable. From this Einstein built the whole theory.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Put the satellite on an escape course: so fast that it never returns."
    params:
      scene: orbit
      controls:
        radius:
          fixed: true
    answer:
      kind: 1
    explanation: From about 7.9 km/s. For Newton this is a matter of force – for Einstein the satellite follows the curvature of space.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The radius of a black hole grows with mass: about 3 km per solar mass. How large would the radius be at 10 solar masses?"
    params:
      unit: km
    answer:
      value: 30
    hints:
      - 3 km times 10.
    explanation: 30 km – this is the **Schwarzschild radius**. The Earth would have to be squeezed to 9 mm for that.
    difficulty: 3

srs:
  cards_from: [licht, loch]
