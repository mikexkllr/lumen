id: sci.relativity.energy
type: concept
title: E = mc²
summary: Mass is stored energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many million tonnes of mass does the Sun turn into light every second?"
    params:
      min: 0
      max: 20
    answer:
      value: 4
      tolerance: 1.5
    explanation: About 4 million tonnes per second – for billions of years.

  - kind: explain
    id: s1
    body: |
      Einstein's most famous formula $E = mc^2$ says that **mass** is an extremely dense form of energy. Because $c^2$ is huge, even tiny masses hold enormous energy.

  - kind: problem
    id: gramm
    widget: choice
    prompt: Roughly how much energy is in a single gram of mass?
    params:
      options:
        - { label: As much as in an atomic bomb, correct: true }
        - { label: As much as in a battery, feedback: "Billions of times more. c² is a huge number." }
        - { label: As much as in a liter of gasoline, feedback: "Still millions of times too little." }
    hints:
      - "c² is about 90 quadrillion, in square meters per square second."
    explanation: Around 90 trillion joules, about the energy of the Hiroshima bomb.

  - kind: problem
    id: sonne
    widget: choice
    prompt: Where does the Sun get its energy?
    params:
      options:
        - { label: "In nuclear fusion, mass is lost and becomes energy.", correct: true }
        - { label: It burns coal and gas., feedback: "Chemical burning would have lasted only a few thousand years." }
    hints:
      - Hydrogen fuses into helium.
    explanation: A helium nucleus weighs less than its building blocks. The missing mass becomes light.

  - kind: problem
    id: wie-viel
    widget: numeric
    prompt: The Sun converts about 4 million tons of mass into energy every second. How many tons is that per minute?
    params: { unit: million t }
    answer: { value: 240 }
    hints:
      - 4 · 60.
    explanation: 240 million tons per minute, and its supply still lasts for billions of years.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "How much energy is in 1 kg of mass? $E = mc^2$ with c = 3 · 10⁸ m/s. Give the exponent: 9 · 10 to the … joules."
    answer:
      value: 16
    hints:
      - (3 · 10⁸)² = 9 · 10¹⁶.
    explanation: 9 · 10¹⁶ J – Germany’s electricity demand for two months.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A power plant gives off 9 · 10¹⁶ J of heat in one year. How many kilograms of mass vanish from the fuel? c = 3 · 10⁸ m/s.
    params:
      unit: kg
    answer:
      value: 1
    feedback:
      - when: abs(numval(state.input) - 300000000) < 1000
        misconception: not-squared
        text: Divide by c², not by c.
    hints:
      - m = E ÷ c².
      - c² = 9 · 10¹⁶.
    explanation: Exactly 1 kg. A whole year of a big power plant – one kilogram of mass. A coal plant loses mass too, just immeasurably little per tonne of coal.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Is a compressed spring heavier than a relaxed one?
    params:
      options:
        - label: Yes, by a tiny amount – stored energy has mass.
          correct: true
        - label: No, no material is added.
          feedback: E = mc² holds for any energy, not just nuclear energy.
        - label: No, it gets lighter.
          feedback: Putting energy in increases the mass.
    hints:
      - Does the compressed spring hold more energy?
      - Any energy E corresponds to the mass E ÷ c².
    explanation: 10 J of spring energy weighs 10 ÷ 9 · 10¹⁶ ≈ 10⁻¹⁶ kg – far too little to measure. In nuclei the energies are so large that the mass loss can be weighed.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why can a particle with mass never be accelerated to the speed of light?
    params:
      options:
        - label: Its energy grows with γ – for v = c infinitely much energy would be needed
          correct: true
        - label: Because engines are not strong enough
          feedback: No engine however strong suffices – it is a limit of nature.
        - label: Because air resistance becomes too large
          feedback: The limit holds in a vacuum too.
    hints:
      - What happens to γ as v approaches c?
    explanation: In a particle accelerator protons reach 99.999999% of c – they hardly get faster, only “heavier”.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "The full formula reads $E^2 = (pc)^2 + (mc^2)^2$. At rest p = 0 and $E = mc^2$ remains. A **photon** has no mass and still has energy and momentum: E = pc."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: An electron has a mass of 9.11 · 10⁻³¹ kg. What is its rest energy mc² in MeV? (1 MeV = 1.6 · 10⁻¹³ J, c = 3 · 10⁸ m/s). To three decimals.
    params:
      unit: MeV
    answer:
      value: 0.512
      tolerance: 0.01
    hints:
      - 9.11 · 10⁻³¹ · 9 · 10¹⁶ ≈ 8.2 · 10⁻¹⁴ J.
      - Divide by 1.6 · 10⁻¹³.
    explanation: About 0.51 MeV. When an electron meets a positron, exactly two photons of 0.511 MeV each appear – PET scans in hospitals use this.
    difficulty: 3

srs:
  cards_from: [gramm, sonne]
