id: sci.relativity.energy
type: concept
title: E = mc²
summary: Mass is stored energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Einstein's most famous formula $E = mc^2$ says that mass is an extremely dense form of energy. Because $c^2$ is huge, even tiny masses hold enormous energy.

  - kind: problem
    id: gramm
    widget: choice
    prompt: Roughly how much energy is in a single gram of mass?
    params:
      options:
        - { label: As much as in an atomic bomb, correct: true }
        - { label: As much as in a battery, feedback: "Billions of times more. c² is a huge number." }
        - { label: As much as in a liter of gasoline, feedback: "Still millions of times too little." }
    hints:
      - "c² is about 90 quadrillion, in square meters per square second."
    explanation: Around 90 trillion joules, about the energy of the Hiroshima bomb.

  - kind: problem
    id: sonne
    widget: choice
    prompt: Where does the Sun get its energy?
    params:
      options:
        - { label: "In nuclear fusion, mass is lost and becomes energy.", correct: true }
        - { label: It burns coal and gas., feedback: "Chemical burning would have lasted only a few thousand years." }
    hints:
      - Hydrogen fuses into helium.
    explanation: A helium nucleus weighs less than its building blocks. The missing mass becomes light.

  - kind: problem
    id: wie-viel
    widget: numeric
    prompt: The Sun converts about 4 million tons of mass into energy every second. How many tons is that per minute?
    params: { unit: million t }
    answer: { value: 240 }
    hints:
      - 4 · 60.
    explanation: 240 million tons per minute, and its supply still lasts for billions of years.

srs:
  cards_from: [gramm, sonne]
