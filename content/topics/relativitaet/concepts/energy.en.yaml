id: sci.relativity.energy
type: concept
title: E = mc²
summary: Mass is stored energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many million tonnes of mass does the Sun turn into light every second?"
    params:
      min: 0
      max: 20
    answer:
      value: 4
      tolerance: 1.5
    explanation: About 4 million tonnes per second – for billions of years.

  - kind: explain
    id: s1
    body: |
      Einstein's most famous formula $E = mc^2$ says that **mass** is an extremely dense form of energy. Because $c^2$ is huge, even tiny masses hold enormous energy.

  - kind: problem
    id: gramm
    widget: choice
    prompt: Roughly how much energy is in a single gram of mass?
    params:
      options:
        - { label: As much as in an atomic bomb, correct: true }
        - { label: As much as in a battery, feedback: "Billions of times more. c² is a huge number." }
        - { label: As much as in a liter of gasoline, feedback: "Still millions of times too little." }
    hints:
      - "c² is about 90 quadrillion, in square meters per square second."
    explanation: Around 90 trillion joules, about the energy of the Hiroshima bomb.

  - kind: problem
    id: sonne
    widget: choice
    prompt: Where does the Sun get its energy?
    params:
      options:
        - { label: "In nuclear fusion, mass is lost and becomes energy.", correct: true }
        - { label: It burns coal and gas., feedback: "Chemical burning would have lasted only a few thousand years." }
    hints:
      - Hydrogen fuses into helium.
    explanation: A helium nucleus weighs less than its building blocks. The missing mass becomes light.

  - kind: problem
    id: wie-viel
    widget: numeric
    prompt: The Sun converts about 4 million tons of mass into energy every second. How many tons is that per minute?
    params: { unit: million t }
    answer: { value: 240 }
    hints:
      - 4 · 60.
    explanation: 240 million tons per minute, and its supply still lasts for billions of years.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "How much energy is in 1 kg of mass? $E = mc^2$ with c = 3 · 10⁸ m/s. Give the exponent: 9 · 10 to the … joules."
    answer:
      value: 16
    hints:
      - (3 · 10⁸)² = 9 · 10¹⁶.
    explanation: 9 · 10¹⁶ J – Germany’s electricity demand for two months.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why can a particle with mass never be accelerated to the speed of light?
    params:
      options:
        - label: Its energy grows with γ – for v = c infinitely much energy would be needed
          correct: true
        - label: Because engines are not strong enough
          feedback: No engine however strong suffices – it is a limit of nature.
        - label: Because air resistance becomes too large
          feedback: The limit holds in a vacuum too.
    hints:
      - What happens to γ as v approaches c?
    explanation: In a particle accelerator protons reach 99.999999% of c – they hardly get faster, only “heavier”.
    difficulty: 3

srs:
  cards_from: [gramm, sonne]
