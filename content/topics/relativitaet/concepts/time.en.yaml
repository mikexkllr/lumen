id: sci.relativity.time
type: concept
title: Moving clocks run slower
summary: Time dilation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      A fast-moving clock ticks slower, seen from outside. The **factor γ** (gamma) says by how much. At 87% of the speed of light, γ = 2, so time passes half as fast.

  - kind: problem
    id: reise
    widget: numeric
    prompt: A spaceship flies with γ = {{g}}. For the crew, {{t}} years pass. How many years pass on Earth?
    params: { unit: years }
    answer: { value: "{{g * t}}" }
    feedback:
      - when: "numval(state.input) == t / g"
        misconception: inverted
        text: The clock on board runs slower, so more time passes on Earth.
    hints:
      - "Earth time is γ times as long."
    explanation: "{{g}} · {{t}} = {{g * t}} years. The crew returns younger than their twins."
    variants:
      params: { g: "int[2,5]", t: "int[2,10]" }
      defaults: { g: 2, t: 5 }

  - kind: problem
    id: gps
    widget: choice
    prompt: Why does GPS need relativity?
    params:
      options:
        - { label: Satellite clocks run differently from clocks on Earth., correct: true }
        - { label: They fly faster than light., feedback: "They fly about 4 km per second, far below the speed of light." }
    hints:
      - Even tiny clock errors mean large position errors.
    explanation: Without correction, positioning would be off by kilometers after one day.

  - kind: problem
    id: wer
    widget: choice
    prompt: Who ages more slowly on a trip at almost the speed of light?
    params:
      options:
        - { label: The one who travels and turns around, correct: true }
        - { label: The one who stays home, feedback: "The traveler changes reference frame on turning around, and ends up younger." }
    hints:
      - Who accelerates and brakes?
    explanation: This is the famous twin paradox, measurable with atomic clocks on airplanes.

srs:
  cards_from: [reise, gps]
