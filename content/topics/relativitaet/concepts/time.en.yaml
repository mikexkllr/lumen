id: sci.relativity.time
type: concept
title: Moving clocks run slower
summary: Time dilation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: an astronaut spent half a year on the space station (28,000 km/h). By how many milliseconds has he aged less?"
    params:
      min: 0
      max: 100
      unit: ms
    answer:
      value: 5
      tolerance: 4
    explanation: About 5 milliseconds. Tiny, but measurable with atomic clocks.

  - kind: explain
    id: s1
    body: |
      A fast-moving clock ticks slower, seen from outside. The **factor γ** (gamma) says by how much. At 87% of the speed of light, γ = 2, so time passes half as fast.

  - kind: problem
    id: reise
    widget: numeric
    prompt: A spaceship flies with γ = {{g}}. For the crew, {{t}} years pass. How many years pass on Earth?
    params: { unit: years }
    answer: { value: "{{g * t}}" }
    feedback:
      - when: "numval(state.input) == t / g"
        misconception: inverted
        text: The clock on board runs slower, so more time passes on Earth.
    hints:
      - "Earth time is γ times as long."
    explanation: "{{g}} · {{t}} = {{g * t}} years. The crew returns younger than their twins."
    variants:
      params: { g: "int[2,5]", t: "int[2,10]" }
      defaults: { g: 2, t: 5 }

  - kind: problem
    id: gps
    widget: choice
    prompt: Why does GPS need relativity?
    params:
      options:
        - { label: Satellite clocks run differently from clocks on Earth., correct: true }
        - { label: They fly faster than light., feedback: "They fly about 4 km per second, far below the speed of light." }
    hints:
      - Even tiny clock errors mean large position errors.
    explanation: Without correction, positioning would be off by kilometers after one day.

  - kind: problem
    id: wer
    widget: choice
    prompt: Who ages more slowly on a trip at almost the speed of light?
    params:
      options:
        - { label: The one who travels and turns around, correct: true }
        - { label: The one who stays home, feedback: "The traveler changes reference frame on turning around, and ends up younger." }
    hints:
      - Who accelerates and brakes?
    explanation: This is the famous twin paradox, measurable with atomic clocks on airplanes.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The factor is $\gamma = \frac{1}{\sqrt{1 - v^2}}$. What is γ at v = 0.6 c?
    answer:
      value: 1.25
    hints:
      - 1 − 0.36 = 0.64. Its square root is 0.8.
    explanation: 1 ÷ 0.8 = 1.25. At 60% of the speed of light time passes a quarter more slowly.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Calculate γ = 1 ÷ √(1 − v²) for v = {{v}} c. To two decimals.
    answer:
      value: "{{1 / sqrt(1 - v * v)}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - sqrt(1 - v * v)) < 0.01
        misconception: forgot-reciprocal
        text: That is √(1 − v²). γ is its **reciprocal**.
    hints:
      - First compute v², then 1 − v².
      - Take the square root and then the reciprocal.
    explanation: γ = {{1 / sqrt(1 - v * v)}}. Below 0.5 c γ stays close to 1. Beyond 0.9 c it climbs steeply.
    difficulty: 2
    variants:
      params:
        v: choice[0.6,0.8,0.96]
      defaults:
        v: 0.8

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: "Twin paradox: each twin sees the other's clock run slow. Why is the traveller still the younger one?"
    params:
      options:
        - label: He has to turn around and switches reference frames – the situation is not symmetric.
          correct: true
        - label: Because space travel is easy on the body.
          feedback: It is not about biology. All clocks slow down equally.
        - label: He is not younger at all – it is a contradiction.
          feedback: Measurements with clocks on aircraft confirm the effect.
    hints:
      - Which of the two feels acceleration?
      - Only the stay-at-home remains in one reference frame the whole time.
    explanation: The Earth twin stays in one inertial frame throughout. The traveller switches to another when turning round. His world line is shorter – he experiences less time.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Muons form at 10 km altitude and live only 2.2 microseconds – enough for 660 m. They fly with γ = 20. How many kilometres do they manage from our point of view?
    params:
      unit: km
    answer:
      value: 13.2
      tolerance: 0.2
    hints:
      - "Their clock runs 20 times slower: 660 m · 20."
    explanation: 13.2 km – enough to reach the ground. Measuring them there is direct proof of time dilation.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: For low speeds γ ≈ 1 + v² ÷ (2c²). A plane flies for 10 hours at 250 m/s. By how many nanoseconds does its clock fall behind? Special relativity only, c = 3 · 10⁸ m/s.
    params:
      unit: ns
    answer:
      value: 12.5
      tolerance: 0.3
    hints:
      - v² ÷ (2c²) = 62,500 ÷ (1.8 · 10¹⁷) ≈ 3.5 · 10⁻¹³.
      - Times 36,000 seconds.
    explanation: 3.47 · 10⁻¹³ · 36,000 s ≈ 1.25 · 10⁻⁸ s = 12.5 ns. In 1971 Hafele and Keating measured such effects with atomic clocks on airliners.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Take a guess: by how many microseconds per day do GPS clocks run fast compared with clocks on the ground, in total?"
    params:
      min: 0
      max: 100
    answer:
      value: 38
      tolerance: 5
    explanation: About 38 µs. The weaker gravity up there speeds them up by 45 µs, their speed slows them by 7 µs. Uncorrected, GPS would be off by over 10 km after a day.
    difficulty: 3

srs:
  cards_from: [reise, gps]
