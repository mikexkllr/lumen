id: geo.solids.lab
type: concept
title: Volumen-Labor
summary: Würfel wachsen lassen, Grundflächen ziehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wuerfel
    widget: chart
    prompt: Stell das Volumen der Würfel mit Kante 2 und 3 ein.
    params:
      labels: [Kante 1, Kante 2, Kante 3]
      values: [1, 0, 0]
      editable: [1, 2]
      min: 0
      max: 30
      unit: "cm³"
    answer: { values: [1, 8, 27] }
    feedback:
      - when: "values[1] == 4"
        misconception: square-not-cube
        text: Das ist die Fläche einer Seite. Ein Würfel hat drei Richtungen.
    hints:
      - Kante mal Kante mal Kante.
    explanation: 1, 8, 27 – doppelte Kante, achtfaches Volumen.

  - kind: problem
    id: grundflaeche
    widget: rect
    prompt: Ein Quader ist 2 m hoch und hat 24 m³ Volumen. Zieh eine passende Grundfläche.
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "area == 12" }
    hints:
      - Volumen = Grundfläche · Höhe.
    explanation: "24 : 2 = 12 m² – zum Beispiel 3 × 4 oder 2 × 6."

  - kind: problem
    id: formeln
    widget: match
    prompt: Welche Formel gehört zu welchem Körper?
    params:
      pairs:
        - { left: Quader, right: "a · b · c" }
        - { left: Zylinder, right: "π · r² · h" }
        - { left: Pyramide, right: "⅓ · G · h" }
        - { left: Kugel, right: "4/3 · π · r³" }
    hints:
      - Spitze Körper haben ein Drittel.
    explanation: Prismen und Zylinder – Grundfläche mal Höhe. Spitze Körper – ein Drittel davon.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne nach dem Volumen, das kleinste zuerst.
    params:
      items:
        - { label: "Pyramide, G = 1, h = 1" }
        - { label: Würfel mit Kante 1 }
        - { label: Kugel mit r = 1 }
        - { label: "Zylinder, r = 1, h = 2" }
    hints:
      - Kugel etwa 4,2, Zylinder etwa 6,3.
    explanation: 0,33 – 1 – 4,19 – 6,28.

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Der **Eulersche Polyedersatz**: Ecken − Kanten + Flächen = 2. Ein Fußball hat 32 Flächen und 90 Kanten. Wie viele Ecken hat er?"
    answer:
      value: 60
    hints:
      - E − 90 + 32 = 2.
    explanation: 60 Ecken. Dieselbe Form hat das Kohlenstoff-Molekül C₆₀.
    difficulty: 3

srs:
  cards_from: [wuerfel, grundflaeche]
