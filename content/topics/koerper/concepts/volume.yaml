id: geo.solids.volume
type: concept
title: Volumen zählen
summary: Wie viele Würfel passen hinein?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Liter Luft sind in einem Zimmer von 4 m × 5 m × 2,5 m?"
    params:
      min: 100
      max: 1000000
      scale: log
      unit: l
    answer:
      value: 50000
      within: 50
    explanation: 50 m³, und jeder Kubikmeter fasst 1000 Liter.

  - kind: problem
    id: quader
    widget: numeric
    prompt: Ein Quader ist {{a}} cm lang, {{b}} cm breit und {{c}} cm hoch. Wie viele 1-cm-Würfel passen hinein?
    params: { unit: Würfel }
    answer: { value: "{{a * b * c}}" }
    feedback:
      - when: "numval(state.input) == a + b + c"
        misconception: add-dimensions
        text: Du hast addiert. Denk in Schichten – eine Schicht hat {{a * b}} Würfel.
    hints:
      - "Eine Schicht hat {{a}} · {{b}} Würfel. Wie viele Schichten gibt es?"
    explanation: "{{a}} · {{b}} · {{c}} = {{a * b * c}} Würfel."
    variants:
      params: { a: "int[2,6]", b: "int[2,5]", c: "int[2,4]" }
      defaults: { a: 4, b: 3, c: 2 }

  - kind: explain
    id: s2
    body: |
      **Volumen = Länge · Breite · Höhe.**
      Man zählt, wie viele **Einheitswürfel** hineinpassen. Daher die Einheit cm³.

  - kind: problem
    id: wuerfel
    widget: numeric
    prompt: Ein Würfel hat die Kantenlänge {{a}} cm. Wie groß ist sein Volumen?
    params: { unit: cm³ }
    answer: { value: "{{a ** 3}}" }
    feedback:
      - when: "numval(state.input) == 3 * a"
        misconception: power-as-product
        text: Hoch 3 heißt {{a}} · {{a}} · {{a}}, nicht {{a}} · 3.
    hints:
      - Länge, Breite und Höhe sind gleich.
    explanation: "{{a}}³ = {{a ** 3}} cm³."
    variants:
      params: { a: "int[2,10]" }
      defaults: { a: 5 }

  - kind: problem
    id: aquarium
    widget: numeric
    prompt: Ein Aquarium ist 50 cm lang, 30 cm breit und 40 cm hoch. Wie viele Liter passen hinein?
    body: 1 Liter = 1000 cm³
    params: { unit: Liter }
    answer: { value: 60 }
    feedback:
      - when: "numval(state.input) == 60000"
        misconception: no-conversion
        text: Das sind cm³. Teile noch durch 1000.
    hints:
      - Rechne erst das Volumen in cm³ aus.
    explanation: 50 · 30 · 40 = 60 000 cm³ = 60 Liter.

  - kind: explain
    id: s5
    body: Wie viel Wasser fasst ein Würfel mit 1 m Kantenlänge?
    reveal:
      body: 1000 Liter – eine Tonne Wasser. Denn 1 m³ sind 1000 dm³, und ein dm³ ist genau ein Liter.

  - kind: problem
    id: einheiten
    widget: match
    prompt: Was gehört zusammen?
    params:
      pairs:
        - { left: 1 Liter, right: 1 dm³ }
        - { left: 1 m³, right: 1000 Liter }
        - { left: 1 Milliliter, right: 1 cm³ }
        - { left: 1 Hektoliter, right: 100 Liter }
    hints:
      - Ein Milliliter ist ein Tausendstel Liter.
    explanation: 1 l = 1 dm³, 1 ml = 1 cm³, 1 m³ = 1000 l, 1 hl = 100 l.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Schwimmbecken ist 25 m lang, 10 m breit und 2 m tief. Wie viele Liter fasst es?
    params:
      unit: l
    answer:
      value: 500000
    hints:
      - Erst m³ ausrechnen, dann mal 1000.
    explanation: 500 m³ · 1000 = 500 000 Liter.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Jeder gerade Körper mit gleichem Querschnitt ist ein **Prisma**: Dreieck, Sechseck oder Kreis unten, darüber senkrecht gestapelt. Für alle gilt: Volumen = Grundfläche · Höhe."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Ein Zelt ist ein Prisma. Sein Querschnitt ist ein rechtwinkliges Dreieck mit den Katheten {{a}} m und {{b}} m. Es ist {{h}} m lang. Wie viel m³ Luft sind drin?
    params:
      unit: m³
    answer:
      value: "{{a * b * h / 2}}"
    feedback:
      - when: numval(state.input) == a * b * h
        misconception: triangle-half
        text: Das wäre ein Quader. Das Dreieck ist nur halb so groß wie das Rechteck {{a}} · {{b}}.
    hints:
      - "Erst die Grundfläche: Dreieck = Kathete mal Kathete durch 2."
      - Dann mal die Länge {{h}} m.
    explanation: "Grundfläche {{a}} · {{b}} : 2 = {{a * b / 2}} m², mal {{h}} m ergibt {{a * b * h / 2}} m³."
    difficulty: 2
    variants:
      params:
        a: int[2,6]
        b: step[2,6,2]
        h: int[2,9]
      defaults:
        a: 3
        b: 4
        h: 5

  - kind: problem
    id: mb-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viel wiegt die Luft in einem Würfel von 1 m Kantenlänge?"
    params:
      min: 0
      max: 10
      step: 0.1
      unit: kg
    answer:
      value: 1.2
      tolerance: 0.4
    explanation: Rund 1,2 kg bei 20 °C auf Meereshöhe. Ein Zimmer mit 50 m³ enthält also etwa 60 kg Luft – so viel wie ein Mensch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viele cm³ sind 1 m³?
    answer:
      value: 1000000
    hints:
      - 100 cm in jeder der drei Richtungen.
    explanation: 100³ = 1 000 000. Beim Volumen wird der Umrechnungsfaktor **hoch drei** genommen.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Schieb einen Stapel Münzen schräg. Jede Scheibe bleibt gleich groß, also bleibt das Volumen gleich. Das ist das **Prinzip von Cavalieri**: Gleiche Querschnitte in jeder Höhe heißt gleiches Volumen."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: Ein gerader und ein schiefer Zylinder haben dieselbe Grundfläche und dieselbe senkrechte Höhe. Was gilt für ihr Volumen?
    params:
      options:
        - label: Gleich groß
          correct: true
        - label: Der schiefe hat mehr – seine Seite ist länger
          feedback: Die schräge Seite ist länger, aber jede waagerechte Scheibe ist gleich groß.
        - label: Der schiefe hat weniger
          feedback: Verschieben nimmt keiner Scheibe etwas weg.
    hints:
      - Schneide beide Zylinder in dünne waagerechte Scheiben.
      - Vergleiche je zwei Scheiben auf gleicher Höhe.
    explanation: "Jede Scheibe ist derselbe Kreis, nur seitlich versetzt. Nach Cavalieri sind die Volumen gleich: Grundfläche mal senkrechte Höhe."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Du zerlegst einen Würfel von 1 m Kante in Würfel von 1 cm Kante und stapelst sie zu einem einzigen Turm. Wie viele km hoch wird er?
    params:
      unit: km
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 1
        misconception: linear-scale
        text: Ein m³ hat nicht 100, sondern 100 · 100 · 100 kleine Würfel.
      - when: numval(state.input) == 0.1
        misconception: area-scale
        text: Du hast 10 000 Würfel gezählt – es sind 1 000 000.
    hints:
      - Wie viele 1-cm-Würfel passen in 1 m³?
      - 1 000 000 cm sind wie viele km?
    explanation: "100³ = 1 000 000 Würfel, je 1 cm hoch: 1 000 000 cm = 10 000 m = 10 km – höher als der Mount Everest."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum hat ein schief gekippter Bücherstapel dasselbe Volumen wie ein gerader?"
    params:
      keywords:
        - - scheibe
          - schicht
          - buch
          - slice
          - layer
          - book
        - - gleich
          - dasselbe
          - same
          - equal
        - - höhe
          - querschnitt
          - height
          - cross
      sample: Der Stapel besteht aus denselben Büchern. In jeder Höhe liegt eine gleich große Schicht, nur verschoben. Gleiche Schichten auf gleicher Höhe ergeben dasselbe Volumen.
    explanation: "Der Kern ist Cavalieri: gleiche Querschnitte in jeder Höhe ergeben gleiches Volumen – egal, wie schief der Stapel steht."
    difficulty: 3

srs:
  cards_from: [quader, wuerfel]
