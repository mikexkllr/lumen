id: geo.solids.scale
type: concept
title: Größer bauen
summary: Länge mal k, Volumen mal k³.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alles dreimal so groß
    body: Modellbauer, Architekten und Filmtricks vergrößern ständig. Zieh das Quadrat von Seite 1 auf Seite 3. Die Seite wird dreimal so lang – und die **Fläche**? Was würde dann mit einem Würfel passieren?
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 8
        maxH: 8
        w: 1
        h: 1
        show:
          - area

  - kind: problem
    id: verdoppeln
    widget: choice
    prompt: Du verdoppelst alle Kanten eines Würfels. Wie verändert sich das Volumen?
    params:
      options:
        - { label: Es wird 8-mal so groß., correct: true }
        - { label: Es wird doppelt so groß., feedback: "Das wäre, wenn nur eine Kante wächst. Hier wachsen alle drei." }
        - { label: Es wird 4-mal so groß., feedback: "Das gilt für die Flächen. Volumen hat eine Dimension mehr." }
    hints:
      - Wie viele kleine Würfel passen in einen doppelt so großen?
    explanation: 2 · 2 · 2 = 8. Acht kleine Würfel ergeben einen großen.

  - kind: explain
    id: s2
    body: |
      Wird alles k-mal so lang, wachsen **Flächen** mit k² und **Volumen** mit k³.

  - kind: problem
    id: volumen-k
    widget: numeric
    prompt: Alle Kanten eines Körpers werden {{k}}-mal so lang. Wie viel Mal so groß wird das Volumen?
    params: { placeholder: "-mal" }
    answer: { value: "{{k ** 3}}" }
    feedback:
      - when: "numval(state.input) == k * k"
        misconception: area-for-volume
        text: Das gilt für Flächen. Beim Volumen kommt die Höhe dazu.
    hints:
      - "Rechne {{k}} · {{k}} · {{k}}."
    explanation: "{{k}}³ = {{k ** 3}}."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 3 }

  - kind: problem
    id: flaeche-k
    widget: numeric
    prompt: Und die Oberfläche – wie viel Mal so groß wird sie, wenn alle Kanten {{k}}-mal so lang werden?
    params: { placeholder: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k ** 3"
        misconception: volume-for-area
        text: Das gilt für das Volumen. Flächen haben nur zwei Richtungen.
    hints:
      - Jede Fläche wächst in Länge und Breite.
    explanation: "{{k}}² = {{k * k}}."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 3 }

  - kind: explain
    id: s5
    body: Warum gibt es keine Ameisen so groß wie Pferde?
    reveal:
      body: Das Gewicht wächst mit k³, die Dicke der Beine nur mit k². Ab einer gewissen Größe tragen die Beine den Körper nicht mehr.

  - kind: problem
    id: statue
    widget: choice
    prompt: Eine Statue wird halb so groß nachgebaut. Wie viel Bronze braucht man im Vergleich?
    params:
      options:
        - { label: Ein Achtel, correct: true }
        - { label: Die Hälfte, feedback: "Nur die Höhe halbiert sich so. Breite und Tiefe auch." }
        - { label: Ein Viertel, feedback: "Das gilt für die Oberfläche." }
    hints:
      - "k = 1/2. Rechne k³."
    explanation: (1/2)³ = 1/8.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Wird alles 3-mal so lang, wächst die Oberfläche auf das [[9]]-Fache und das Volumen auf das [[27]]-Fache.
      distractors:
        - "3"
        - "6"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Modell im Maßstab 1 : 10 wiegt 2 kg. Wie viel wiegt das Original aus demselben Material?"
    params:
      unit: kg
    answer:
      value: 2000
    hints:
      - "Das Gewicht wächst mit dem Volumen: 10³."
    explanation: 2 kg · 1000 = 2000 kg.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Ein Knochen trägt mit seinem Querschnitt, der wächst mit k². Das Gewicht wächst mit k³. Die Last pro cm² wächst also mit k. Das ist das **Quadrat-Würfel-Gesetz** – schon Galilei kannte es.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Ein Riese ist {{k}}-mal so groß wie ein Mensch und genauso gebaut. Um welchen Faktor steigt die Last auf jeden cm² seiner Knochen?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == k * k * k
        misconception: weight-only
        text: Das ist das Gewicht. Es verteilt sich aber auf k² mehr Fläche.
      - when: numval(state.input) == k * k
        misconception: area-only
        text: Das ist der Querschnitt. Teile das Gewicht durch ihn.
    hints:
      - Gewicht mal k³, tragende Fläche mal k².
      - "Last pro Fläche = k³ : k²."
    explanation: "k³ : k² = k. Ein zehnfach großer Mensch hätte zehnfach belastete Knochen – sie würden brechen."
    difficulty: 2
    variants:
      params:
        k: int[2,9]
      defaults:
        k: 10

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Ein Würfel hat {{a}} cm Kantenlänge. Wie viel cm² Oberfläche kommen auf jeden cm³ Volumen?
    answer:
      value: "{{6 / a}}"
      tolerance: 0.01
    hints:
      - Oberfläche 6 · a², Volumen a³.
      - "Teile: 6a² : a³ = 6 : a."
    explanation: "6 · {{a}}² : {{a}}³ = 6 : {{a}} = {{6 / a}}. Je größer der Körper, desto weniger Haut pro Volumen – darum frieren Mäuse schneller als Elefanten."
    difficulty: 2
    variants:
      params:
        a: choice[1,2,3,4,5,6]
      defaults:
        a: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum kühlen kleine Tiere schneller aus als große?
    params:
      options:
        - label: Sie haben im Verhältnis zum Volumen mehr Oberfläche
          correct: true
        - label: Sie haben dünneres Fell
          feedback: Auch bei gleichem Fell bliebe der Effekt.
        - label: Sie haben weniger Blut
          feedback: Entscheidend ist das Verhältnis von Fläche zu Volumen.
    hints:
      - Wärme entsteht im Volumen und entweicht über die Oberfläche.
    explanation: Oberfläche/Volumen fällt mit 1/k. Eine Maus muss darum ständig fressen.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Vergrößert man ein Quadrat mit Faktor 2, besteht es aus 4 = 2² Kopien. Ein Würfel aus 8 = 2³. Der Exponent ist die **Dimension**: N = k hoch D. Manche Fraktale haben eine krumme Dimension."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Das Sierpinski-Dreieck besteht nach Vergrößern mit Faktor 2 aus genau 3 Kopien von sich. Welche Dimension D hat es, also $2^D = 3$? Auf zwei Stellen.
    answer:
      value: 1.58
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 1.5
        misconception: rough
        text: Fast – aber 2 hoch 1,5 ist 2,83, nicht 3.
    hints:
      - D liegt zwischen 1 (Linie) und 2 (Fläche).
      - "D = log 3 : log 2."
    explanation: "D = log 3 : log 2 ≈ 0,477 : 0,301 ≈ 1,58. Mehr als eine Linie, weniger als eine Fläche."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum braucht ein Elefant so dicke Beine?"
    params:
      keywords:
        - - gewicht
          - masse
          - volumen
          - weight
          - mass
          - volume
          - k³
        - - querschnitt
          - fläche
          - dicke
          - cross
          - area
          - k²
        - - schneller
          - stärker
          - wächst
          - faster
          - grows
          - more
      sample: Wird ein Tier größer, wächst sein Gewicht mit k³, der Querschnitt der Beine nur mit k². Damit die Last pro Fläche nicht zu groß wird, müssen die Beine überproportional dick werden.
    explanation: Gewicht wächst mit k³, Tragkraft mit k². Darum werden große Tiere plump und kleine zierlich.
    difficulty: 3

srs:
  cards_from: [volumen-k, statue]
