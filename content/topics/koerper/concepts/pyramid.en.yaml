id: geo.solids.pyramid
type: concept
title: Pyramid and cone
summary: A third of the prism.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: drittel
    widget: choice
    prompt: A pyramid and a cuboid have the same base area and height. How many times does the pyramid fit into the cuboid?
    params:
      layout: grid
      options:
        - { label: Three times, correct: true }
        - { label: Twice, feedback: "It is less than half. It is exactly a third." }
        - { label: Four times, feedback: "Too many. Imagine pouring water between them." }
    hints:
      - Pouring water gives a clean fraction.
    explanation: The pyramid has exactly one third of the volume.

  - kind: explain
    body: |
      **Pointed solids**, pyramids and cones, have a third of the volume: V = ⅓ · base area · height.

  - kind: problem
    id: pyramide
    widget: numeric
    prompt: A pyramid has a square base with sides of {{a}} m and is {{h}} m tall. What is its volume?
    params: { unit: m³ }
    answer: { value: "{{a * a * h / 3}}" }
    feedback:
      - when: "numval(state.input) == a * a * h"
        misconception: forget-third
        text: That would be the cuboid. The pyramid has a third of that.
    hints:
      - "{{a}}² · {{h}} ÷ 3."
    explanation: "{{a * a}} · {{h}} ÷ 3 = {{a * a * h / 3}} m³."
    variants:
      params: { a: "choice[3,6,9]", h: "int[2,10]" }
      defaults: { a: 6, h: 5 }

  - kind: problem
    id: eis
    widget: choice
    prompt: An ice cream cone and a cup (cylinder) are equally wide and equally tall. Which holds more ice cream?
    params:
      options:
        - { label: "The cup, three times as much", correct: true }
        - { label: The same, feedback: "The cone tapers to a point and holds only a third." }
        - { label: The cone, feedback: "The tip wastes a lot of space." }
    hints:
      - A cone is a third of a cylinder.
    explanation: The cone holds only a third of the cylinder.

srs:
  cards_from: [pyramide, drittel]
