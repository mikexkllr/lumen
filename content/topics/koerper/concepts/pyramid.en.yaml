id: geo.solids.pyramid
type: concept
title: Pyramid and cone
summary: A third of the prism.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Everything comes to a point
    body: Pyramids, tents and volcanoes all come to a point at the top. Turn over the cards. What do these **pointed solids** have in common?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🔺
            front: Great Pyramid
            back: For almost 4000 years it was the tallest building in the world.
          - icon: ⛺
            front: Tipi
            back: "A cone of poles and covers: stable and quick to put up."
          - icon: 🌋
            front: Volcano
            back: Ash and lava pile up into a cone all by themselves.
          - icon: ⏳
            front: Hourglass
            back: Two cones, tip to tip. The sand runs from one into the other.

  - kind: problem
    id: drittel
    widget: choice
    prompt: A pyramid and a cuboid have the same base area and height. How many times does the pyramid fit into the cuboid?
    params:
      layout: grid
      options:
        - { label: Three times, correct: true }
        - { label: Twice, feedback: "It is less than half. It is exactly a third." }
        - { label: Four times, feedback: "Too many. Imagine pouring water between them." }
    hints:
      - Pouring water gives a clean fraction.
    explanation: The pyramid has exactly one third of the volume.

  - kind: explain
    id: s2
    body: |
      **Pointed solids**, pyramids and cones, have a third of the volume: V = ⅓ · base area · height.

  - kind: problem
    id: pyramide
    widget: numeric
    prompt: A pyramid has a square base with sides of {{a}} m and is {{h}} m tall. What is its volume?
    params: { unit: m³ }
    answer: { value: "{{a * a * h / 3}}" }
    feedback:
      - when: "numval(state.input) == a * a * h"
        misconception: forget-third
        text: That would be the cuboid. The pyramid has a third of that.
    hints:
      - "{{a}}² · {{h}} ÷ 3."
    explanation: "{{a * a}} · {{h}} ÷ 3 = {{a * a * h / 3}} m³."
    variants:
      params: { a: "choice[3,6,9]", h: "int[2,10]" }
      defaults: { a: 6, h: 5 }

  - kind: problem
    id: eis
    widget: choice
    prompt: An ice cream cone and a cup (cylinder) are equally wide and equally tall. Which holds more ice cream?
    params:
      options:
        - { label: "The cup, three times as much", correct: true }
        - { label: The same, feedback: "The cone tapers to a point and holds only a third." }
        - { label: The cone, feedback: "The tip wastes a lot of space." }
    hints:
      - A cone is a third of a cylinder.
    explanation: The cone holds only a third of the cylinder.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Which formula gives the volume?
    params:
      buckets:
        - id: b1
          label: Base · height
        - id: b2
          label: A third of that
      items:
        - label: Cube
          bucket: b1
        - label: Pyramid
          bucket: b2
        - label: Cylinder
          bucket: b1
        - label: Cone
          bucket: b2
        - label: Cuboid
          bucket: b1
    hints:
      - Does the solid come to a point at the top?
    explanation: Pointed solids hold exactly a third of the matching straight solid.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A cone has radius 3 cm and height 4 cm. What is its volume? π ≈ 3.14.
    params:
      unit: cm³
    answer:
      value: 37.68
      tolerance: 0.1
    hints:
      - One third of π · r² · h.
    explanation: 3.14 · 9 · 4 ÷ 3 = 37.68.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Where does the third come from? A cube can be cut into three equal pyramids. Each has a face of the cube as base and its tip in the same far corner. This **dissection** shows: ⅓ · a² · a."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: the Great Pyramid has 230 m sides and was 146 m tall. How many million m³ of stone is that?"
    params:
      min: 0.1
      max: 100
      scale: log
      unit: million m³
    answer:
      value: 2.6
      within: 25
    explanation: ⅓ · 230² · 146 ≈ 2.57 million m³. That is more than 2 million stone blocks.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A cone has radius {{r}} cm and height {{h}} cm. What is its volume? Use π ≈ 3.14.
    params:
      unit: cm³
    answer:
      value: "{{3.14 * r * r * h / 3}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 3.14 * r * r * h) < 0.2
        misconception: no-third
        text: That is the cylinder. The cone has only a third.
    hints:
      - Base πr², then times the height.
      - Finally divide by 3.
    explanation: 3.14 · {{r}}² · {{h}} / 3 ≈ {{3.14 * r * r * h / 3}} cm³.
    difficulty: 2
    variants:
      params:
        r: int[2,6]
        h: step[3,12,3]
      defaults:
        r: 2
        h: 6

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The Great Pyramid was 146 m tall. You cut off the top 73 m. What share of the volume is that?
    params:
      options:
        - label: One eighth
          correct: true
        - label: Half
          feedback: The tip is also only half as wide and half as deep.
        - label: A quarter
          feedback: Three directions are halved, not two.
    hints:
      - The tip is a scaled copy with factor 1/2.
    explanation: (1/2)³ = 1/8. Seven eighths of the stone are in the lower half.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: A pyramid has a base of {{g}} m². How large is its horizontal cross-section halfway up?
    params:
      unit: m²
    answer:
      value: "{{g / 4}}"
    feedback:
      - when: numval(state.input) == g / 2
        misconception: linear-area
        text: Every length halves – so the area shrinks by ½ · ½.
    hints:
      - Halfway up the cross-section is a shrunk copy of the base.
      - Lengths times ½, areas times ¼.
    explanation: "Half the lengths, a quarter of the area: {{g}} / 4 = {{g / 4}} m²."
    difficulty: 3
    variants:
      params:
        g: choice[16,36,64,100,144]
      defaults:
        g: 36

  - kind: explain
    id: mb-x2
    depth: 3
    body: At height z the cross-section is $G\,(1 - \frac{z}{h})^2$. Adding all the slices becomes the **integral** $\int_0^h G\,(1 - \frac{z}{h})^2\,dz = \frac13 G h$. The third comes from the square.

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a pyramid have exactly one third of the prism with the same base and height?"
    params:
      keywords:
        - - drei
          - drittel
          - three
          - third
        - - würfel
          - zerlegen
          - cube
          - split
          - cut
        - - gleich
          - identisch
          - same
          - equal
          - cavalieri
      sample: A cube splits into three equal pyramids sharing one tip. So each is a third. By Cavalieri this holds for every pyramid with the same base and height.
    explanation: Three equal pyramids fill a cube; Cavalieri carries this over to every pyramid.
    difficulty: 3

srs:
  cards_from: [pyramide, drittel]
