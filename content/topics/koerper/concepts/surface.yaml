id: geo.solids.surface
type: concept
title: Oberfläche
summary: Alle Seiten zusammen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: wuerfel-o
    widget: numeric
    prompt: Ein Würfel hat die Kantenlänge {{a}} cm. Wie groß ist seine Oberfläche?
    params: { unit: cm² }
    answer: { value: "{{6 * a * a}}" }
    feedback:
      - when: "numval(state.input) == a ** 3"
        misconception: volume-for-surface
        text: Das ist das Volumen. Die Oberfläche besteht aus den Seiten.
    hints:
      - Ein Würfel hat 6 gleiche quadratische Seiten.
    explanation: "6 · {{a}}² = {{6 * a * a}} cm²."
    variants:
      params: { a: "int[2,8]" }
      constraints: ["a != 6"]
      defaults: { a: 3 }

  - kind: explain
    id: s2
    body: |
      Die **Oberfläche** ist die Summe aller Seitenflächen.
      Ein Quader hat drei Paare gleicher Rechtecke.

  - kind: problem
    id: quader-o
    widget: numeric
    prompt: Ein Quader ist {{a}} cm lang, {{b}} cm breit und {{c}} cm hoch. Wie groß ist seine Oberfläche?
    params: { unit: cm² }
    answer: { value: "{{2 * (a * b + a * c + b * c)}}" }
    feedback:
      - when: "numval(state.input) == a * b + a * c + b * c"
        misconception: half-surface
        text: Jede Seite gibt es zweimal – oben und unten, vorn und hinten, links und rechts.
    hints:
      - "Rechne {{a}} · {{b}}, {{a}} · {{c}} und {{b}} · {{c}} – jeweils doppelt."
    explanation: "2 · ({{a * b}} + {{a * c}} + {{b * c}}) = {{2 * (a * b + a * c + b * c)}} cm²."
    variants:
      params: { a: "int[3,8]", b: "int[2,5]", c: "int[1,4]" }
      defaults: { a: 5, b: 4, c: 2 }

  - kind: problem
    id: netze
    widget: choice
    prompt: Wie viele verschiedene Würfelnetze gibt es – also Faltmuster aus sechs Quadraten?
    params:
      layout: grid
      options:
        - { label: "11", correct: true }
        - { label: "6", feedback: "Es gibt mehr Muster als Seiten." }
        - { label: "4", feedback: "Es gibt deutlich mehr – probier es mit Papier." }
        - { label: "24", feedback: "Zu viele. Gedrehte und gespiegelte Muster zählen nur einmal." }
    hints:
      - Mehr als du denkst, aber weniger als 20.
    explanation: Es gibt genau 11 Würfelnetze.

  - kind: explain
    id: s5
    body: Bei gleichem Volumen hat die **Kugel** die kleinste Oberfläche. Darum sind Seifenblasen rund und Tropfen fast kugelig.

  - kind: problem
    id: dose
    widget: choice
    prompt: Welche Dose braucht für einen Liter am wenigsten Blech?
    params:
      options:
        - { label: "Eine, die etwa so hoch wie breit ist", correct: true }
        - { label: Eine sehr hohe und schmale, feedback: "Hohe Dosen haben viel Seitenfläche." }
        - { label: Eine sehr flache und breite, feedback: "Flache Dosen haben riesige Deckel." }
    hints:
      - Welche Form kommt einer Kugel am nächsten?
    explanation: Am günstigsten ist eine Dose mit Höhe gleich Durchmesser.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Würfel hat 216 cm³ Volumen. Wie groß ist seine Oberfläche?
    params:
      unit: cm²
    answer:
      value: 216
    hints:
      - Welche Zahl hoch 3 ergibt 216?
    explanation: Kante 6 cm, also 6 · 36 = 216 cm². Nur bei Kante 6 stimmen beide Zahlen überein.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Schneide den Mantel einer Dose auf und roll ihn ab. Er wird ein **Rechteck**: so hoch wie die Dose, so breit wie der Kreisumfang 2πr. Dazu kommen Deckel und Boden mit je πr²."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Eine Dose hat den Radius {{r}} cm und die Höhe {{h}} cm. Wie viel cm² Blech braucht sie? Rechne mit π ≈ 3,14.
    params:
      unit: cm²
    answer:
      value: "{{2 * 3.14 * r * r + 2 * 3.14 * r * h}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 2 * 3.14 * r * h) < 0.2
        misconception: no-lids
        text: Das ist nur der Mantel. Deckel und Boden fehlen.
    hints:
      - Mantel = 2πr · h.
      - Plus zweimal πr² für Deckel und Boden.
    explanation: 2 · 3,14 · {{r}}² + 2 · 3,14 · {{r}} · {{h}} ≈ {{2 * 3.14 * r * r + 2 * 3.14 * r * h}} cm².
    difficulty: 2
    variants:
      params:
        r: int[2,5]
        h: int[5,12]
      defaults:
        r: 2
        h: 5

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Ein Würfel aus {{n}} · {{n}} · {{n}} kleinen Würfeln wird außen rot angemalt. Wie viele kleine Würfel bleiben ganz ohne Farbe?
    answer:
      value: "{{(n - 2) ** 3}}"
    feedback:
      - when: numval(state.input) == (n - 1) ** 3
        misconception: one-layer
        text: Es fällt auf jeder Seite eine Schicht weg – also zwei pro Richtung.
    hints:
      - Die unbemalten Würfel bilden einen inneren Würfel.
      - "Er ist auf jeder Seite eine Schicht kleiner: Kante n − 2."
    explanation: Innen bleibt ein Würfel mit Kante {{n - 2}}, also {{(n - 2) ** 3}} kleine Würfel.
    difficulty: 2
    variants:
      params:
        n: int[3,8]
      defaults:
        n: 5

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Würfel aus 27 kleinen Würfeln wird außen rot angemalt. Wie viele kleine Würfel haben genau **zwei** rote Seiten?
    answer:
      value: 12
    hints:
      - Das sind die Würfel in der Mitte jeder Kante.
    explanation: Ein Würfel hat 12 Kanten. 8 Ecken haben drei, 6 Mitten eine, 1 Kern keine rote Seite.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Welche Dose mit festem Volumen V braucht am wenigsten Blech? Mit h = V : πr² ist die Fläche $O(r) = 2\\pi r^2 + \\frac{2V}{r}$. Die **Ableitung** null setzen liefert $V = 2\\pi r^3$, also h = 2r."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: Was folgt aus h = 2r für die beste Dose?
    params:
      options:
        - label: Sie ist genau so hoch wie breit.
          correct: true
        - label: Sie ist doppelt so hoch wie breit.
          feedback: 2r ist der Durchmesser, also die Breite.
        - label: Sie ist halb so hoch wie breit.
          feedback: "Andersherum: Die Höhe ist das Doppelte des Radius."
    hints:
      - Was ist 2r bei einem Kreis?
      - 2r ist der Durchmesser.
    explanation: h = 2r = Durchmesser. Echte Dosen sind oft höher – wegen Etikett, Griff und Stapeln, nicht wegen des Blechs.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Ein Würfel und eine Kugel fassen beide 1 Liter. Wie viel Prozent mehr Oberfläche hat der Würfel?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 24
      tolerance: 6
    explanation: "Würfel: 600 cm². Kugel: r ≈ 6,2 cm, also 4πr² ≈ 484 cm². Das sind rund 24 % mehr. Die Kugel ist die sparsamste Hülle – das besagt die isoperimetrische Ungleichung."
    difficulty: 3

srs:
  cards_from: [wuerfel-o, quader-o]
