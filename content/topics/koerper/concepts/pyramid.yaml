id: geo.solids.pyramid
type: concept
title: Pyramide und Kegel
summary: Ein Drittel vom Prisma.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alles läuft spitz zu
    body: Pyramiden, Zelte und Vulkane laufen nach oben spitz zu. Deck die Karten auf. Was haben diese **spitzen Körper** gemeinsam?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🔺
            front: Cheops-Pyramide
            back: Fast 4000 Jahre lang war sie das höchste Bauwerk der Welt.
          - icon: ⛺
            front: Tipi
            back: "Ein Kegel aus Stangen und Planen: stabil und schnell aufgebaut."
          - icon: 🌋
            front: Vulkan
            back: Asche und Lava türmen sich von selbst zu einem Kegel auf.
          - icon: ⏳
            front: Sanduhr
            back: Zwei Kegel, Spitze an Spitze. Der Sand rinnt vom einen in den anderen.

  - kind: problem
    id: drittel
    widget: choice
    prompt: Eine Pyramide und ein Quader haben dieselbe Grundfläche und Höhe. Wie oft passt die Pyramide in den Quader?
    params:
      layout: grid
      options:
        - { label: Dreimal, correct: true }
        - { label: Zweimal, feedback: "Es ist weniger als die Hälfte – genau ein Drittel." }
        - { label: Viermal, feedback: "Zu oft. Füll in Gedanken Wasser um." }
    hints:
      - Mit Wasser umfüllen ergibt einen glatten Bruch.
    explanation: Die Pyramide hat genau ein Drittel des Volumens.

  - kind: explain
    id: s2
    body: |
      **Spitze Körper** – Pyramide und Kegel – haben ein Drittel des Volumens: V = ⅓ · Grundfläche · Höhe.

  - kind: problem
    id: pyramide
    widget: numeric
    prompt: Eine Pyramide hat eine quadratische Grundfläche mit {{a}} m Seite und ist {{h}} m hoch. Wie groß ist ihr Volumen?
    params: { unit: m³ }
    answer: { value: "{{a * a * h / 3}}" }
    feedback:
      - when: "numval(state.input) == a * a * h"
        misconception: forget-third
        text: Das wäre der Quader. Die Pyramide hat ein Drittel davon.
    hints:
      - "{{a}}² · {{h}} : 3."
    explanation: "{{a * a}} · {{h}} : 3 = {{a * a * h / 3}} m³."
    variants:
      params: { a: "choice[3,6,9]", h: "int[2,10]" }
      defaults: { a: 6, h: 5 }

  - kind: problem
    id: eis
    widget: choice
    prompt: Eine Eiswaffel (Kegel) und ein Becher (Zylinder) sind gleich breit und gleich hoch. Wo passt mehr Eis hinein?
    params:
      options:
        - { label: "Im Becher – dreimal so viel", correct: true }
        - { label: Gleich viel, feedback: "Der Kegel läuft spitz zu und hat nur ein Drittel." }
        - { label: In der Waffel, feedback: "Die Spitze kostet viel Platz." }
    hints:
      - Kegel ist ein Drittel vom Zylinder.
    explanation: Der Kegel fasst nur ein Drittel des Zylinders.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Welche Formel gilt für das Volumen?
    params:
      buckets:
        - id: b1
          label: Grundfläche · Höhe
        - id: b2
          label: Ein Drittel davon
      items:
        - label: Würfel
          bucket: b1
        - label: Pyramide
          bucket: b2
        - label: Zylinder
          bucket: b1
        - label: Kegel
          bucket: b2
        - label: Quader
          bucket: b1
    hints:
      - Läuft der Körper oben spitz zu?
    explanation: Spitze Körper fassen genau ein Drittel des passenden geraden Körpers.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Kegel hat den Radius 3 cm und die Höhe 4 cm. Wie groß ist sein Volumen? π ≈ 3,14.
    params:
      unit: cm³
    answer:
      value: 37.68
      tolerance: 0.1
    hints:
      - Ein Drittel von π · r² · h.
    explanation: "3,14 · 9 · 4 : 3 = 37,68."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Woher kommt das Drittel? Ein Würfel lässt sich in drei gleiche Pyramiden zerlegen. Jede hat eine Würfelfläche als Grundfläche und die Spitze in derselben Ecke. Diese **Zerlegung** zeigt: ⅓ · a² · a."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Die Cheops-Pyramide hat 230 m Seitenlänge und war 146 m hoch. Wie viele Millionen m³ Stein sind das?"
    params:
      min: 0.1
      max: 100
      scale: log
      unit: Mio. m³
    answer:
      value: 2.6
      within: 25
    explanation: ⅓ · 230² · 146 ≈ 2,57 Millionen m³. Das sind über 2 Millionen Steinblöcke.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Ein Kegel hat den Radius {{r}} cm und die Höhe {{h}} cm. Wie groß ist sein Volumen? Rechne mit π ≈ 3,14.
    params:
      unit: cm³
    answer:
      value: "{{3.14 * r * r * h / 3}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 3.14 * r * r * h) < 0.2
        misconception: no-third
        text: Das ist der Zylinder. Der Kegel hat nur ein Drittel.
    hints:
      - Grundfläche πr², dann mal Höhe.
      - Zum Schluss durch 3 teilen.
    explanation: "3,14 · {{r}}² · {{h}} : 3 ≈ {{3.14 * r * r * h / 3}} cm³."
    difficulty: 2
    variants:
      params:
        r: int[2,6]
        h: step[3,12,3]
      defaults:
        r: 2
        h: 6

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Cheops-Pyramide war 146 m hoch. Du schneidest die oberen 73 m ab. Welcher Anteil des Volumens ist das?
    params:
      options:
        - label: Ein Achtel
          correct: true
        - label: Die Hälfte
          feedback: Die Spitze ist auch nur halb so breit und halb so tief.
        - label: Ein Viertel
          feedback: Drei Richtungen halbieren sich, nicht zwei.
    hints:
      - Die Spitze ist eine verkleinerte Kopie mit Faktor 1/2.
    explanation: (1/2)³ = 1/8. Sieben Achtel des Steins stecken in der unteren Hälfte.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Eine Pyramide hat die Grundfläche {{g}} m². Wie groß ist ihr waagerechter Querschnitt auf halber Höhe?
    params:
      unit: m²
    answer:
      value: "{{g / 4}}"
    feedback:
      - when: numval(state.input) == g / 2
        misconception: linear-area
        text: Jede Länge halbiert sich – die Fläche also mit ½ · ½.
    hints:
      - Auf halber Höhe ist der Querschnitt eine verkleinerte Grundfläche.
      - Längen mal ½, Flächen mal ¼.
    explanation: "Längen halb so groß, Fläche ein Viertel: {{g}} : 4 = {{g / 4}} m²."
    difficulty: 3
    variants:
      params:
        g: choice[16,36,64,100,144]
      defaults:
        g: 36

  - kind: explain
    id: mb-x2
    depth: 3
    body: In Höhe z ist der Querschnitt $G\,(1 - \frac{z}{h})^2$. Addiert man alle Scheiben, wird das zum **Integral** $\int_0^h G\,(1 - \frac{z}{h})^2\,dz = \frac13 G h$. Das Drittel kommt aus dem Quadrat.

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum hat eine Pyramide genau ein Drittel des Prismas mit gleicher Grundfläche und Höhe?"
    params:
      keywords:
        - - drei
          - drittel
          - three
          - third
        - - würfel
          - zerlegen
          - cube
          - split
          - cut
        - - gleich
          - identisch
          - same
          - equal
          - cavalieri
      sample: Ein Würfel zerfällt in drei gleiche Pyramiden, die alle dieselbe Spitze haben. Also ist jede ein Drittel. Nach Cavalieri gilt das dann für jede Pyramide mit gleicher Grundfläche und Höhe.
    explanation: Drei gleiche Pyramiden füllen einen Würfel; Cavalieri überträgt das auf jede Pyramide.
    difficulty: 3

srs:
  cards_from: [pyramide, drittel]
