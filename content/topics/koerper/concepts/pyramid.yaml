id: geo.solids.pyramid
type: concept
title: Pyramide und Kegel
summary: Ein Drittel vom Prisma.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: drittel
    widget: choice
    prompt: Eine Pyramide und ein Quader haben dieselbe Grundfläche und Höhe. Wie oft passt die Pyramide in den Quader?
    params:
      layout: grid
      options:
        - { label: Dreimal, correct: true }
        - { label: Zweimal, feedback: "Es ist weniger als die Hälfte – genau ein Drittel." }
        - { label: Viermal, feedback: "Zu oft. Füll in Gedanken Wasser um." }
    hints:
      - Mit Wasser umfüllen ergibt einen glatten Bruch.
    explanation: Die Pyramide hat genau ein Drittel des Volumens.

  - kind: explain
    body: |
      **Spitze Körper** – Pyramide und Kegel – haben ein Drittel des Volumens: V = ⅓ · Grundfläche · Höhe.

  - kind: problem
    id: pyramide
    widget: numeric
    prompt: Eine Pyramide hat eine quadratische Grundfläche mit {{a}} m Seite und ist {{h}} m hoch. Wie groß ist ihr Volumen?
    params: { unit: m³ }
    answer: { value: "{{a * a * h / 3}}" }
    feedback:
      - when: "numval(state.input) == a * a * h"
        misconception: forget-third
        text: Das wäre der Quader. Die Pyramide hat ein Drittel davon.
    hints:
      - "{{a}}² · {{h}} : 3."
    explanation: "{{a * a}} · {{h}} : 3 = {{a * a * h / 3}} m³."
    variants:
      params: { a: "choice[3,6,9]", h: "int[2,10]" }
      defaults: { a: 6, h: 5 }

  - kind: problem
    id: eis
    widget: choice
    prompt: Eine Eiswaffel (Kegel) und ein Becher (Zylinder) sind gleich breit und gleich hoch. Wo passt mehr Eis hinein?
    params:
      options:
        - { label: "Im Becher – dreimal so viel", correct: true }
        - { label: Gleich viel, feedback: "Der Kegel läuft spitz zu und hat nur ein Drittel." }
        - { label: In der Waffel, feedback: "Die Spitze kostet viel Platz." }
    hints:
      - Kegel ist ein Drittel vom Zylinder.
    explanation: Der Kegel fasst nur ein Drittel des Zylinders.

srs:
  cards_from: [pyramide, drittel]
