id: geo.solids.lab
type: concept
title: Volume lab
summary: Grow cubes, drag base areas.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wuerfel
    widget: chart
    prompt: Set the volume of the cubes with edge 2 and 3.
    params:
      labels: [Edge 1, Edge 2, Edge 3]
      values: [1, 0, 0]
      editable: [1, 2]
      min: 0
      max: 30
      unit: "cm³"
    answer: { values: [1, 8, 27] }
    feedback:
      - when: "values[1] == 4"
        misconception: square-not-cube
        text: That is the area of one face. A cube has three directions.
    hints:
      - Edge times edge times edge.
    explanation: 1, 8, 27. Double the edge gives eight times the volume.

  - kind: problem
    id: grundflaeche
    widget: rect
    prompt: A cuboid is 2 m tall and has a volume of 24 m³. Drag a matching base.
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "area == 12" }
    hints:
      - Volume = base area · height.
    explanation: "24 ÷ 2 = 12 m², for example 3 × 4 or 2 × 6."

  - kind: problem
    id: formeln
    widget: match
    prompt: Which formula belongs to which solid?
    params:
      pairs:
        - { left: Cuboid, right: "a · b · c" }
        - { left: Cylinder, right: "π · r² · h" }
        - { left: Pyramid, right: "⅓ · G · h" }
        - { left: Sphere, right: "4/3 · π · r³" }
    hints:
      - Pointed solids get a third.
    explanation: Prisms and cylinders use base area times height. Pointed solids use a third of that.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Order by volume, smallest first.
    params:
      items:
        - { label: "Pyramid, G = 1, h = 1" }
        - { label: Cube with edge 1 }
        - { label: Sphere with r = 1 }
        - { label: "Cylinder, r = 1, h = 2" }
    hints:
      - Sphere about 4.2, cylinder about 6.3.
    explanation: 0.33, 1, 4.19, 6.28.

srs:
  cards_from: [wuerfel, grundflaeche]
