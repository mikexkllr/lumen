id: geo.solids.sphere
type: concept
title: Kugeln
summary: Vier Drittel π r³.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie oft passt das Volumen eines Tischtennisballs in einen Fußball?"
    params:
      min: 1
      max: 1000
    answer:
      value: 166
      tolerance: 50
    explanation: Etwa 166-mal. Der Radius ist 5,5-mal so groß, das Volumen wächst mit hoch drei.

  - kind: explain
    id: s1
    body: |
      Eine **Kugel** mit Radius r hat das Volumen V = 4/3 · π · r³.
      Ihre Oberfläche ist 4 · π · r² – genau viermal ihr Querschnitt.

  - kind: problem
    id: ball
    widget: numeric
    prompt: Eine Kugel hat den Radius {{r}} cm. Wie groß ist ihr Volumen? Rechne mit π ≈ 3,14 und runde auf ganze cm³.
    params: { unit: cm³ }
    answer: { value: "{{round(4 / 3 * 3.14 * r ** 3)}}", tolerance: 2 }
    hints:
      - "{{r}}³ = {{r ** 3}}. Dann mal 4/3 und mal 3,14."
    explanation: "4/3 · 3,14 · {{r ** 3}} ≈ {{round(4 / 3 * 3.14 * r ** 3)}} cm³."
    variants:
      params: { r: "int[2,6]" }
      defaults: { r: 3 }

  - kind: problem
    id: doppelt
    widget: numeric
    prompt: Ein Ballon wird aufgeblasen, bis sein Radius doppelt so groß ist. Wie viel Mal so viel Luft ist drin?
    params: { unit: "-mal" }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: square-not-cube
        text: Das gilt für die Haut des Ballons. Beim Volumen steht r hoch 3.
    hints:
      - 2³.
    explanation: 2 · 2 · 2 = 8.

  - kind: problem
    id: orange
    widget: choice
    prompt: Warum sind Wassertropfen und Seifenblasen rund?
    params:
      options:
        - { label: Die Kugel hat bei gleichem Volumen die kleinste Oberfläche., correct: true }
        - { label: Wegen der Schwerkraft., feedback: "Die Schwerkraft würde sie eher plattdrücken." }
        - { label: Zufall., feedback: "Die Form folgt einem Prinzip." }
    hints:
      - Die Oberflächenspannung zieht die Haut so klein wie möglich.
    explanation: Die Oberflächenspannung minimiert die Haut – das Ergebnis ist eine Kugel.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Doppelter Radius heißt achtfaches Kugelvolumen.
          right: true
        - text: Doppelter Radius heißt doppelte Oberfläche.
          right: false
          why: "Die Oberfläche wächst mit r²: viermal so groß."
        - text: Die Kugeloberfläche ist viermal so groß wie ihr Querschnitt.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Erde hat den Radius 6400 km. Wie groß ist ihre Oberfläche in Millionen km²? π ≈ 3,14.
    answer:
      value: 514
      tolerance: 5
    hints:
      - 4 · π · r² mit r² = 40,96 Millionen.
    explanation: 4 · 3,14 · 40,96 ≈ 514 Millionen km².
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Archimedes' Trick: Schneide eine Halbkugel, einen Zylinder und einen Kegel auf gleicher Höhe z. Die Kugelscheibe hat π(r² − z²) – genau **Zylinder minus Kegel**. Also ist die Halbkugel πr³ − ⅓πr³ = ⅔πr³."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Ein Zylinder mit r = h = 3 cm hat 84,78 cm³ (π ≈ 3,14). Nimm den Kegel mit gleicher Grundfläche und Höhe weg. Wie viel cm³ bleiben – das Volumen der Halbkugel?
    params:
      unit: cm³
    answer:
      value: 56.52
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - 28.26) < 0.05
        misconception: cone-not-rest
        text: Das ist der Kegel selbst. Zieh ihn vom Zylinder ab.
    hints:
      - Der Kegel ist ein Drittel des Zylinders.
      - 84,78 − 28,26.
    explanation: "84,78 − 28,26 = 56,52 cm³. Probe: ⅔ · 3,14 · 27 = 56,52."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Der Mond hat einen Radius von 1737 km, die Erde von 6371 km. Wie viele Monde passen vom Volumen her in die Erde?"
    params:
      min: 1
      max: 200
    answer:
      value: 49
      tolerance: 8
    explanation: Der Radius ist 3,67-mal so groß, das Volumen also 3,67³ ≈ 49-mal.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Archimedes fand: Eine Kugel füllt genau … des Zylinders, der sie knapp umschließt."
    params:
      options:
        - label: zwei Drittel
          correct: true
        - label: die Hälfte
          feedback: "Rechne: 4/3 π r³ geteilt durch π r² · 2r."
        - label: drei Viertel
          feedback: "(4/3) : 2 = 2/3."
    hints:
      - Der Zylinder hat die Höhe 2r und das Volumen π r² · 2r.
    explanation: "(4/3 π r³) : (2 π r³) = 2/3. Archimedes ließ das Bild auf seinen Grabstein setzen."
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: choice
    prompt: Leite das Volumen $V(r) = \frac43\pi r^3$ nach r ab. Was kommt heraus?
    params:
      options:
        - label: $4\pi r^2$ – genau die Oberfläche
          correct: true
        - label: $\frac43\pi r^2$
          feedback: "Der Exponent 3 wandert nach vorn: 3 · ⁴⁄₃ = 4."
        - label: $\pi r^2$
          feedback: Das ist nur der Querschnitt.
    hints:
      - Aus r³ wird 3r².
      - ⁴⁄₃ · 3 = 4.
    explanation: "Wächst r um ein winziges dr, kommt eine dünne Schale dazu: Oberfläche mal dr. Darum ist V′ = O. Beim Kreis genauso: (πr²)′ = 2πr, der Umfang."
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wie viel Prozent des Volumens einer Kugel liegen in der äußeren Hälfte des Radius, also zwischen r/2 und r?
    params:
      unit: "%"
    answer:
      value: 87.5
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 50
        misconception: linear-thinking
        text: Die äußere Schale ist viel dicker an Volumen, weil sie weiter außen liegt.
    hints:
      - Die innere Kugel hat den halben Radius – also welchen Anteil am Volumen?
      - (½)³ = ⅛ innen, der Rest außen.
    explanation: Innen ⅛ = 12,5 %, außen 87,5 %. In 100 Dimensionen wäre es 1 − 0,5¹⁰⁰ – praktisch alles. Hochdimensionale Kugeln sind fast nur Haut.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist die Ableitung des Kugelvolumens genau die Oberfläche?"
    params:
      keywords:
        - - schale
          - schicht
          - haut
          - shell
          - layer
          - skin
        - - dünn
          - winzig
          - klein
          - thin
          - tiny
          - small
        - - oberfläche
          - fläche
          - surface
          - area
      sample: Wächst der Radius ein winziges Stück, kommt eine dünne Schale dazu. Ihr Volumen ist Oberfläche mal Dicke. Die Änderung des Volumens pro Radius ist also die Oberfläche.
    explanation: Neues Volumen = Oberfläche · Schalendicke. Darum ist dV/dr = O.
    difficulty: 3

srs:
  cards_from: [ball, doppelt]
