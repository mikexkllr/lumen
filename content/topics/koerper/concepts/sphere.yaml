id: geo.solids.sphere
type: concept
title: Kugeln
summary: Vier Drittel π r³.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie oft passt das Volumen eines Tischtennisballs in einen Fußball?"
    params:
      min: 1
      max: 1000
    answer:
      value: 166
      tolerance: 50
    explanation: Etwa 166-mal. Der Radius ist 5,5-mal so groß, das Volumen wächst mit hoch drei.


  - kind: explain
    id: s1
    body: |
      Eine **Kugel** mit Radius r hat das Volumen V = 4/3 · π · r³.
      Ihre Oberfläche ist 4 · π · r² – genau viermal ihr Querschnitt.

  - kind: problem
    id: ball
    widget: numeric
    prompt: Eine Kugel hat den Radius {{r}} cm. Wie groß ist ihr Volumen? Rechne mit π ≈ 3,14 und runde auf ganze cm³.
    params: { unit: cm³ }
    answer: { value: "{{round(4 / 3 * 3.14 * r ** 3)}}", tolerance: 2 }
    hints:
      - "{{r}}³ = {{r ** 3}}. Dann mal 4/3 und mal 3,14."
    explanation: "4/3 · 3,14 · {{r ** 3}} ≈ {{round(4 / 3 * 3.14 * r ** 3)}} cm³."
    variants:
      params: { r: "int[2,6]" }
      defaults: { r: 3 }

  - kind: problem
    id: doppelt
    widget: numeric
    prompt: Ein Ballon wird aufgeblasen, bis sein Radius doppelt so groß ist. Wie viel Mal so viel Luft ist drin?
    params: { unit: "-mal" }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: square-not-cube
        text: Das gilt für die Haut des Ballons. Beim Volumen steht r hoch 3.
    hints:
      - 2³.
    explanation: 2 · 2 · 2 = 8.

  - kind: problem
    id: orange
    widget: choice
    prompt: Warum sind Wassertropfen und Seifenblasen rund?
    params:
      options:
        - { label: Die Kugel hat bei gleichem Volumen die kleinste Oberfläche., correct: true }
        - { label: Wegen der Schwerkraft., feedback: "Die Schwerkraft würde sie eher plattdrücken." }
        - { label: Zufall., feedback: "Die Form folgt einem Prinzip." }
    hints:
      - Die Oberflächenspannung zieht die Haut so klein wie möglich.
    explanation: Die Oberflächenspannung minimiert die Haut – das Ergebnis ist eine Kugel.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Doppelter Radius heißt achtfaches Kugelvolumen.
          right: true
        - text: Doppelter Radius heißt doppelte Oberfläche.
          right: false
          why: "Die Oberfläche wächst mit r²: viermal so groß."
        - text: Die Kugeloberfläche ist viermal so groß wie ihr Querschnitt.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Erde hat den Radius 6400 km. Wie groß ist ihre Oberfläche in Millionen km²? π ≈ 3,14.
    answer:
      value: 514
      tolerance: 5
    hints:
      - 4 · π · r² mit r² = 40,96 Millionen.
    explanation: 4 · 3,14 · 40,96 ≈ 514 Millionen km².
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Archimedes fand: Eine Kugel füllt genau … des Zylinders, der sie knapp umschließt."
    params:
      options:
        - label: zwei Drittel
          correct: true
        - label: die Hälfte
          feedback: "Rechne: 4/3 π r³ geteilt durch π r² · 2r."
        - label: drei Viertel
          feedback: "(4/3) : 2 = 2/3."
    hints:
      - Der Zylinder hat die Höhe 2r und das Volumen π r² · 2r.
    explanation: "(4/3 π r³) : (2 π r³) = 2/3. Archimedes ließ das Bild auf seinen Grabstein setzen."
    difficulty: 3

srs:
  cards_from: [ball, doppelt]
