id: geo.solids.surface
type: concept
title: Surface area
summary: All faces together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The skin of things
    body: The surface decides how fast something cools down, dissolves or swaps air. Turn over the cards. Where is a big **surface** an advantage?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🫁
            front: Your lungs
            back: Spread out, the air sacs cover about 70 m² – as much as a small flat.
          - icon: 🐘
            front: Elephant ears
            back: "Huge, thin ears give off heat: lots of surface, little volume."
          - icon: 🍬
            front: Icing sugar
            back: It dissolves faster than a sugar cube – same amount, far more surface.
          - icon: 🌳
            front: Tree crown
            back: Thousands of leaves catch light on an area far bigger than the ground below.

  - kind: problem
    id: wuerfel-o
    widget: numeric
    prompt: A cube has edge length {{a}} cm. What is its surface area?
    params: { unit: cm² }
    answer: { value: "{{6 * a * a}}" }
    feedback:
      - when: "numval(state.input) == a ** 3"
        misconception: volume-for-surface
        text: That is the volume. The surface area is made of the faces.
    hints:
      - A cube has 6 equal square faces.
    explanation: "6 · {{a}}² = {{6 * a * a}} cm²."
    variants:
      params: { a: "int[2,8]" }
      constraints: ["a != 6"]
      defaults: { a: 3 }

  - kind: explain
    id: s2
    body: |
      The **surface area** is the sum of all faces.
      A cuboid has three pairs of equal rectangles.

  - kind: problem
    id: quader-o
    widget: numeric
    prompt: A cuboid is {{a}} cm long, {{b}} cm wide and {{c}} cm tall. What is its surface area?
    params: { unit: cm² }
    answer: { value: "{{2 * (a * b + a * c + b * c)}}" }
    feedback:
      - when: "numval(state.input) == a * b + a * c + b * c"
        misconception: half-surface
        text: "Every face appears twice: top and bottom, front and back, left and right."
    hints:
      - "Calculate {{a}} · {{b}}, {{a}} · {{c}} and {{b}} · {{c}}, each counted twice."
    explanation: "2 · ({{a * b}} + {{a * c}} + {{b * c}}) = {{2 * (a * b + a * c + b * c)}} cm²."
    variants:
      params: { a: "int[3,8]", b: "int[2,5]", c: "int[1,4]" }
      defaults: { a: 5, b: 4, c: 2 }

  - kind: problem
    id: netze
    widget: choice
    prompt: How many different cube nets are there, meaning fold patterns made of six squares?
    params:
      layout: grid
      options:
        - { label: "11", correct: true }
        - { label: "6", feedback: "There are more patterns than faces." }
        - { label: "4", feedback: "There are many more. Try it with paper." }
        - { label: "24", feedback: "Too many. Rotated and mirrored patterns count only once." }
    hints:
      - More than you think, but fewer than 20.
    explanation: There are exactly 11 cube nets.

  - kind: explain
    id: s5
    body: For a given volume, the **sphere** has the smallest surface area. That is why soap bubbles are round and drops are almost spherical.

  - kind: problem
    id: dose
    widget: choice
    prompt: Which can needs the least metal for one liter?
    params:
      options:
        - { label: "One that is about as tall as it is wide", correct: true }
        - { label: A very tall and narrow one, feedback: "Tall cans have a lot of side area." }
        - { label: A very flat and wide one, feedback: "Flat cans have huge lids." }
    hints:
      - Which shape comes closest to a sphere?
    explanation: The cheapest can has height equal to diameter.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A cube has a volume of 216 cm³. How large is its surface?
    params:
      unit: cm²
    answer:
      value: 216
    hints:
      - Which number cubed gives 216?
    explanation: Edge 6 cm, so 6 · 36 = 216 cm². Only for edge 6 do both numbers coincide.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Cut open the side of a can and unroll it. It becomes a **rectangle**: as tall as the can and as wide as the circumference 2πr. Add the lid and the bottom with πr² each."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: A can has radius {{r}} cm and height {{h}} cm. How many cm² of tin does it need? Use π ≈ 3.14.
    params:
      unit: cm²
    answer:
      value: "{{2 * 3.14 * r * r + 2 * 3.14 * r * h}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 2 * 3.14 * r * h) < 0.2
        misconception: no-lids
        text: That is only the side. The lid and bottom are missing.
    hints:
      - Side = 2πr · h.
      - Plus twice πr² for lid and bottom.
    explanation: 2 · 3.14 · {{r}}² + 2 · 3.14 · {{r}} · {{h}} ≈ {{2 * 3.14 * r * r + 2 * 3.14 * r * h}} cm².
    difficulty: 2
    variants:
      params:
        r: int[2,5]
        h: int[5,12]
      defaults:
        r: 2
        h: 5

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A cube made of {{n}} · {{n}} · {{n}} small cubes is painted red on the outside. How many small cubes have no paint at all?
    answer:
      value: "{{(n - 2) ** 3}}"
    feedback:
      - when: numval(state.input) == (n - 1) ** 3
        misconception: one-layer
        text: A layer goes on each side – so two per direction.
    hints:
      - The unpainted cubes form an inner cube.
      - "It is one layer smaller on each side: edge n − 2."
    explanation: Inside is a cube with edge {{n - 2}}, so {{(n - 2) ** 3}} small cubes.
    difficulty: 2
    variants:
      params:
        n: int[3,8]
      defaults:
        n: 5

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A cube made of 27 small cubes is painted red outside. How many small cubes have exactly **two** red faces?
    answer:
      value: 12
    hints:
      - Those are the cubes in the middle of each edge.
    explanation: A cube has 12 edges. 8 corners have three, 6 centres one, 1 core no red face.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Which can with fixed volume V needs the least tin? With h = V / πr² the area is $O(r) = 2\pi r^2 + \frac{2V}{r}$. Setting the **derivative** to zero gives $V = 2\pi r^3$, so h = 2r.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: What does h = 2r mean for the best can?
    params:
      options:
        - label: It is exactly as tall as it is wide.
          correct: true
        - label: 2r is the diameter, i.e. the width.
          feedback: 2r ist der Durchmesser, also die Breite.
        - label: "The other way round: the height is twice the radius."
          feedback: "Andersherum: Die Höhe ist das Doppelte des Radius."
    hints:
      - What is 2r for a circle?
      - 2r is the diameter.
    explanation: h = 2r = diameter. Real cans are often taller – for the label, the grip and stacking, not for the tin.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: estimate
    prompt: "Take a guess: a cube and a sphere both hold 1 litre. How many percent more surface does the cube have?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 24
      tolerance: 6
    explanation: "Cube: 600 cm². Sphere: r ≈ 6.2 cm, so 4πr² ≈ 484 cm². That is about 24 % more. The sphere is the most economical wrapper – that is the isoperimetric inequality."
    difficulty: 3

srs:
  cards_from: [wuerfel-o, quader-o]
