id: geo.solids.sphere
type: concept
title: Spheres
summary: Four thirds π r³.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The orange trick
    body: Spheres are everywhere – from footballs to planets. You can measure their surface with an orange. Turn over the cards in order. How many circles does the peel of a **sphere** fill?
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔪
            front: Cut in half
            back: Cut an orange through the middle and draw its cut circle several times on paper.
          - icon: 🍊
            front: Peel
            back: Peel the orange and lay the peel in small pieces into the circles.
          - icon: ⭕
            front: Count
            back: The peel fills exactly four circles. So the surface is 4 · π · r².

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many times does the volume of a table tennis ball fit into a football?"
    params:
      min: 1
      max: 1000
    answer:
      value: 166
      tolerance: 50
    explanation: About 166 times. The radius is 5.5 times as large, and volume grows with the cube.

  - kind: explain
    id: s1
    body: |
      A **sphere** with radius r has volume V = 4/3 · π · r³.
      Its surface area is 4 · π · r², exactly four times its cross-section.

  - kind: problem
    id: ball
    widget: numeric
    prompt: A sphere has radius {{r}} cm. What is its volume? Use π ≈ 3.14 and round to whole cm³.
    params: { unit: cm³ }
    answer: { value: "{{round(4 / 3 * 3.14 * r ** 3)}}", tolerance: 2 }
    hints:
      - "{{r}}³ = {{r ** 3}}. Then times 4/3 and times 3.14."
    explanation: "4/3 · 3.14 · {{r ** 3}} ≈ {{round(4 / 3 * 3.14 * r ** 3)}} cm³."
    variants:
      params: { r: "int[2,6]" }
      defaults: { r: 3 }

  - kind: problem
    id: doppelt
    widget: numeric
    prompt: A balloon is inflated until its radius is twice as big. How many times as much air is inside?
    params: { unit: "times" }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: square-not-cube
        text: That is true for the balloon's skin. For volume, r is cubed.
    hints:
      - 2³.
    explanation: 2 · 2 · 2 = 8.

  - kind: problem
    id: orange
    widget: choice
    prompt: Why are water drops and soap bubbles round?
    params:
      options:
        - { label: "For a given volume, a sphere has the smallest surface area.", correct: true }
        - { label: Because of gravity., feedback: "Gravity would rather flatten them." }
        - { label: Chance., feedback: "The shape follows a principle." }
    hints:
      - Surface tension pulls the skin as small as possible.
    explanation: Surface tension minimizes the skin, and the result is a sphere.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Double the radius means eight times the sphere volume.
          right: true
        - text: Double the radius means double the surface.
          right: false
          why: "The surface grows with r²: four times as large."
        - text: The surface of a sphere is four times its cross-section.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The Earth has a radius of 6400 km. How large is its surface in million km²? π ≈ 3.14.
    answer:
      value: 514
      tolerance: 5
    hints:
      - 4 · π · r² with r² = 40.96 million.
    explanation: 4 · 3.14 · 40.96 ≈ 514 million km².
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Archimedes' trick: slice a hemisphere, a cylinder and a cone at the same height z. The sphere slice has π(r² − z²) – exactly **cylinder minus cone**. So the hemisphere is πr³ − ⅓πr³ = ⅔πr³."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: A cylinder with r = h = 3 cm holds 84.78 cm³ (π ≈ 3.14). Remove the cone with the same base and height. How many cm³ are left – the volume of the hemisphere?
    params:
      unit: cm³
    answer:
      value: 56.52
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - 28.26) < 0.05
        misconception: cone-not-rest
        text: That is the cone itself. Subtract it from the cylinder.
    hints:
      - The cone is one third of the cylinder.
      - 84.78 − 28.26.
    explanation: "84.78 − 28.26 = 56.52 cm³. Check: ⅔ · 3.14 · 27 = 56.52."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: the Moon has a radius of 1737 km, Earth 6371 km. How many Moons fit into Earth by volume?"
    params:
      min: 1
      max: 200
    answer:
      value: 49
      tolerance: 8
    explanation: The radius is 3.67 times as big, so the volume is 3.67³ ≈ 49 times.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Archimedes found: a sphere fills exactly … of the cylinder that just encloses it."
    params:
      options:
        - label: two thirds
          correct: true
        - label: half
          feedback: "Compute: 4/3 π r³ divided by π r² · 2r."
        - label: three quarters
          feedback: (4/3) ÷ 2 = 2/3.
    hints:
      - The cylinder has height 2r and volume π r² · 2r.
    explanation: (4/3 π r³) ÷ (2 π r³) = 2/3. Archimedes had the picture put on his tombstone.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: choice
    prompt: Differentiate the volume $V(r) = \frac43\pi r^3$ with respect to r. What do you get?
    params:
      options:
        - label: $4\pi r^2$ – exactly the surface area
          correct: true
        - label: "The exponent 3 moves to the front: 3 · ⁴⁄₃ = 4."
          feedback: "Der Exponent 3 wandert nach vorn: 3 · ⁴⁄₃ = 4."
        - label: That is just the cross-section.
          feedback: Das ist nur der Querschnitt.
    hints:
      - r³ becomes 3r².
      - ⁴⁄₃ · 3 = 4.
    explanation: "If r grows by a tiny dr, a thin shell is added: surface times dr. That is why V′ = S. Same for the circle: (πr²)′ = 2πr, the circumference."
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: What percentage of a ball's volume lies in the outer half of the radius, between r/2 and r?
    params:
      unit: "%"
    answer:
      value: 87.5
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 50
        misconception: linear-thinking
        text: The outer shell holds far more volume because it is further out.
    hints:
      - The inner ball has half the radius – so what share of the volume?
      - (½)³ = ⅛ inside, the rest outside.
    explanation: ⅛ = 12.5 % inside, 87.5 % outside. In 100 dimensions it would be 1 − 0.5¹⁰⁰ – practically everything. High-dimensional balls are almost all skin.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is the derivative of the ball's volume exactly its surface area?"
    params:
      keywords:
        - - schale
          - schicht
          - haut
          - shell
          - layer
          - skin
        - - dünn
          - winzig
          - klein
          - thin
          - tiny
          - small
        - - oberfläche
          - fläche
          - surface
          - area
      sample: When the radius grows a tiny bit, a thin shell is added. Its volume is surface times thickness. So the change of volume per radius is the surface area.
    explanation: New volume = surface · shell thickness. That is why dV/dr = S.
    difficulty: 3

srs:
  cards_from: [ball, doppelt]
