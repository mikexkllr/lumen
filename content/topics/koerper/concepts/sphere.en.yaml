id: geo.solids.sphere
type: concept
title: Spheres
summary: Four thirds π r³.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many times does the volume of a table tennis ball fit into a football?"
    params:
      min: 1
      max: 1000
    answer:
      value: 166
      tolerance: 50
    explanation: About 166 times. The radius is 5.5 times as large, and volume grows with the cube.


  - kind: explain
    id: s1
    body: |
      A **sphere** with radius r has volume V = 4/3 · π · r³.
      Its surface area is 4 · π · r², exactly four times its cross-section.

  - kind: problem
    id: ball
    widget: numeric
    prompt: A sphere has radius {{r}} cm. What is its volume? Use π ≈ 3.14 and round to whole cm³.
    params: { unit: cm³ }
    answer: { value: "{{round(4 / 3 * 3.14 * r ** 3)}}", tolerance: 2 }
    hints:
      - "{{r}}³ = {{r ** 3}}. Then times 4/3 and times 3.14."
    explanation: "4/3 · 3.14 · {{r ** 3}} ≈ {{round(4 / 3 * 3.14 * r ** 3)}} cm³."
    variants:
      params: { r: "int[2,6]" }
      defaults: { r: 3 }

  - kind: problem
    id: doppelt
    widget: numeric
    prompt: A balloon is inflated until its radius is twice as big. How many times as much air is inside?
    params: { unit: "times" }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: square-not-cube
        text: That is true for the balloon's skin. For volume, r is cubed.
    hints:
      - 2³.
    explanation: 2 · 2 · 2 = 8.

  - kind: problem
    id: orange
    widget: choice
    prompt: Why are water drops and soap bubbles round?
    params:
      options:
        - { label: "For a given volume, a sphere has the smallest surface area.", correct: true }
        - { label: Because of gravity., feedback: "Gravity would rather flatten them." }
        - { label: Chance., feedback: "The shape follows a principle." }
    hints:
      - Surface tension pulls the skin as small as possible.
    explanation: Surface tension minimizes the skin, and the result is a sphere.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Double the radius means eight times the sphere volume.
          right: true
        - text: Double the radius means double the surface.
          right: false
          why: "The surface grows with r²: four times as large."
        - text: The surface of a sphere is four times its cross-section.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The Earth has a radius of 6400 km. How large is its surface in million km²? π ≈ 3.14.
    answer:
      value: 514
      tolerance: 5
    hints:
      - 4 · π · r² with r² = 40.96 million.
    explanation: 4 · 3.14 · 40.96 ≈ 514 million km².
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Archimedes found: a sphere fills exactly … of the cylinder that just encloses it."
    params:
      options:
        - label: two thirds
          correct: true
        - label: half
          feedback: "Compute: 4/3 π r³ divided by π r² · 2r."
        - label: three quarters
          feedback: (4/3) ÷ 2 = 2/3.
    hints:
      - The cylinder has height 2r and volume π r² · 2r.
    explanation: (4/3 π r³) ÷ (2 π r³) = 2/3. Archimedes had the picture put on his tombstone.
    difficulty: 3

srs:
  cards_from: [ball, doppelt]
