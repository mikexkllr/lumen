id: cs.security.storage
type: concept
title: How services store passwords
summary: Hash, salt and password managers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: When the database goes missing
    body: Almost every big service has been hacked at some point. Flip the cards. What matters is **how** the service stored your password.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💥
            front: Three billion accounts
            back: That is how many accounts a single web service lost in one attack in 2013.
          - icon: 🛒
            front: The black market
            back: Stolen logins are often sold online for next to nothing.
          - icon: 🔍
            front: Am I affected?
            back: Checker sites show whether your email address is in a data leak – it often is.

  - kind: problem
    id: hook
    widget: choice
    prompt: A hacker steals a service’s database. When is your password protected anyway?
    params:
      options:
        - label: If only a fingerprint of the password is stored there
          correct: true
        - label: If it is stored in plain text
          feedback: Then he can simply read it.
        - label: If the service is well known
          feedback: Big services get hacked too.
    hints:
      - What is not stored cannot be stolen.
    explanation: Good services do not know your password themselves.

  - kind: explain
    id: s1
    body: |
      Good services never store the password itself. They store a **hash** made with a **salt**: a random addition for each person. At login, your input is processed the same way and compared.

  - kind: problem
    id: salz
    widget: choice
    prompt: Two people have the same password. Why do their stored hashes still look different?
    params:
      options:
        - { label: Each gets a different salt., correct: true }
        - { label: The computer calculates imprecisely., feedback: "Hashes are exact. The salt makes the difference." }
    hints:
      - What is mixed in before hashing?
    explanation: That way an attacker cannot crack everyone at once with precomputed tables.

  - kind: problem
    id: vergessen
    widget: choice
    prompt: You click "Forgot password" and get your old password back by email. What does that tell you?
    params:
      options:
        - { label: The service stores passwords insecurely., correct: true }
        - { label: The service is especially helpful., feedback: "A secure service doesn't know your password. It could only let you set a new one." }
    hints:
      - Can a hash be reversed?
    explanation: If a service can send your password back, it stored it as plain text or in a reversible form.

  - kind: problem
    id: manager
    widget: choice
    prompt: What does a password manager do?
    params:
      options:
        - { label: It creates and remembers a separate strong password for each service., correct: true }
        - { label: It makes all passwords the same., feedback: "Quite the opposite. Each one is unique." }
    hints:
      - How many passwords do you still have to remember?
    explanation: One strong master password protects the whole vault.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Good or bad storage?
    params:
      buckets:
        - id: b1
          label: Good
        - id: b2
          label: Bad
      items:
        - label: Password in plain text
          bucket: b2
        - label: Hash with salt
          bucket: b1
        - label: Hash without salt
          bucket: b2
        - label: Slow hash with salt
          bucket: b1
    hints:
      - What helps a thief of the database least?
    explanation: Without salt equal passwords have equal hashes. Ready-made lists crack them at once.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Good services store only a [[hash]] with [[salt]] – never the password itself.
      distractors:
        - code
        - sugar

  - kind: problem
    id: mix-c3
    widget: order
    prompt: What happens at login? Order.
    params:
      items:
        - label: You type in your password
        - label: The service adds your salt
        - label: It computes the hash from that
        - label: It compares it with the stored one
    hints:
      - First salt, then hash, then compare.
    explanation: The service checks your password without knowing it.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Attackers use ready-made lists with billions of hashes of common passwords. How does salt make these lists worthless?
    params:
      options:
        - label: Each password is hashed with its own random number – precomputed hashes no longer match
          correct: true
        - label: Salt additionally encrypts the hash
          feedback: The salt is not secret. It only makes every hash unique.
        - label: Salt makes the password longer
          feedback: The password itself stays the same.
    hints:
      - The list was computed without your salt.
    explanation: The attacker must start from scratch for each person instead of once for all.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Two people have the same password but different salt. How many different hashes are stored for them in the database?
    answer:
      value: 2
    hints:
      - The salt changes the input of the hash.
    explanation: Two. Nobody can see that the passwords are equal.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A password cannot be computed back from a hash.
          right: true
        - text: A good service can send you your old password.
          right: false
          why: If it can, it stores it in plain text.
        - text: Salt makes ready-made hash lists useless.
          right: true
        - text: With a hash even a short password is safe.
          right: false
          why: Short passwords are simply tried one by one.
      left: "False"
      right: "True"
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: bcrypt with cost factor 12 runs $2^{12}$ rounds. How many times slower is cost factor 14?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: linear-cost
        text: Each step doubles – two steps quadruple.
    hints:
      - $2^{14}$ / $2^{12}$.
      - $2^2$.
    explanation: Four times slower – a few milliseconds for you, a multiple of years for an attacker with billions of attempts.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: A graphics card does 10 billion simple hashes per second but only 10,000 bcrypt hashes. How many times slower does the attack get?
    answer:
      value: 1000000
    hints:
      - $10^{10}$ / $10^4$.
      - Subtract the exponents.
    explanation: A million times slower. What took one second now takes 11 days.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: For passwords deliberately **slow** hash functions such as bcrypt or Argon2 are used. Why?
    params:
      options:
        - label: A login takes imperceptibly longer – an attacker with billions of tries is slowed a millionfold
          correct: true
        - label: Slow hashes are shorter
          feedback: Length plays no role.
        - label: Fast hashes are faulty
          feedback: They are correct – just too fast for this purpose.
    hints:
      - Who suffers more from 0.1 seconds per try – you or the attacker?
    explanation: "Asymmetry: once for you, billions of times for the attacker."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: "Some services also use a »pepper«: a secret value kept outside the database. What does that achieve?"
    params:
      options:
        - label: Someone who steals only the database cannot even start guessing
          correct: true
        - label: It replaces the salt
          feedback: Salt is still needed – it makes every hash unique.
        - label: It makes logins faster
          feedback: It costs hardly any time but speeds nothing up.
    hints:
      - What does the thief lack if part of the calculation lives elsewhere?
      - Without the pepper he cannot check a single guess.
    explanation: The pepper lives, say, in a hardware module. Only someone who steals both database and pepper can guess offline.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Argon2 deliberately needs lots of memory. Why?
    params:
      options:
        - label: Graphics cards and special chips have little memory per core – that slows down mass attacks
          correct: true
        - label: To store more passwords
          feedback: The memory is only used during the computation.
        - label: To make the hash longer
          feedback: The hash length is independent of that.
    hints:
      - Attackers compute on thousands of cores at once.
      - Computing is cheap, memory is expensive.
    explanation: "Memory-hard means: every guess needs lots of RAM. Thousands of parallel guesses become unaffordable."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: With passkeys the service stores only a public key. What can a hacker do with the stolen database?
    params:
      options:
        - label: Nothing for logging in – the private key stays on your device
          correct: true
        - label: Read all passwords
          feedback: There are no passwords any more.
        - label: Compute the private keys
          feedback: That is exactly the hard problem of public-key cryptography.
    hints:
      - What is at the service, what is with you?
      - "Public means: anyone may know it."
    explanation: At login your device signs a random number. The service checks it with the public key. A leak reveals nothing that lets anyone log in.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why services salt and hash passwords.
    params:
      keywords:
        - - hash
          - fingerabdruck
          - fingerprint
        - - salz
          - salt
        - - zurück
          - umkehr
          - reverse
          - back
        - - tabelle
          - liste
          - table
          - list
          - gleich
          - same
      sample: "Only a hash is stored, a fingerprint that cannot be turned back into the password. The salt is a random value per person: equal passwords then look different, and ready-made tables of hashes are useless to the attacker."
    difficulty: 3

srs:
  cards_from: [salz, vergessen]
