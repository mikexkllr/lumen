id: cs.security.attacks
type: concept
title: How attackers think
summary: Understanding typical attacks.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: arten
    widget: match
    prompt: What is behind each term?
    params:
      pairs:
        - { left: Ransomware, right: "Locking data and demanding a ransom" }
        - { left: Social engineering, right: Skillfully deceiving people }
        - { left: Security vulnerability, right: Exploiting a flaw in software }
    hints:
      - A ransom is money paid to get something back.
    explanation: Often the human is the weakest link, not the technology.

  - kind: explain
    id: s2
    body: |
      Attackers look for the **easiest way in**: old software with flaws, reused passwords, or helpful people on the phone. Protection means closing these paths.

  - kind: problem
    id: updates
    widget: choice
    prompt: Why are updates so important?
    params:
      options:
        - { label: They close known security vulnerabilities., correct: true }
        - { label: They mostly bring new colors., feedback: "Many updates are pure security patches." }
    hints:
      - What happens when a flaw becomes public?
    explanation: Once a flaw is known, unpatched software is an open target.

  - kind: problem
    id: anruf
    widget: choice
    prompt: An "IT employee" calls and briefly needs your password for maintenance. What is this?
    params:
      options:
        - { label: Social engineering, correct: true }
        - { label: Normal maintenance, feedback: "Real IT departments never ask for your password." }
    hints:
      - Who really needs your password?
    explanation: Nobody but you needs your password, not even IT.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In a **DDoS attack** hundreds of thousands of hijacked devices call a website at once. What is the goal?
    params:
      options:
        - label: Overload the site until nobody can reach it
          correct: true
        - label: Steal passwords
          feedback: Nothing is stolen – only blocked.
        - label: Change the site
          feedback: The content stays untouched.
    hints:
      - How many visitors can a shop handle at once?
    explanation: What is attacked is **availability** – the third security goal besides confidentiality and integrity.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A **zero-day vulnerability** is a weakness that …
    params:
      options:
        - label: … the vendor does not yet know – so there is no update yet
          correct: true
        - label: … exists only on the first day after purchase
          feedback: "The name counts the days since disclosure: zero."
        - label: … causes zero damage
          feedback: Such flaws are the most dangerous of all.
    hints:
      - How many days did the vendor have to fix it?
    explanation: Updates do not help against the unknown – only several layers of protection backing each other up.
    difficulty: 3

srs:
  cards_from: [arten, anruf]
