id: cs.security.defense
type: concept
title: Verteidigung
summary: Zwei Faktoren und gute Backups.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Doppelt hält besser
    body: Ein gestohlenes Passwort allein soll nicht reichen. Schalte Passwort und Handy an und aus. Wann öffnet sich das Konto? So funktioniert **Zwei-Faktor**.
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: P
            label: Passwort
          - id: H
            label: Handy
        gates:
          - id: g
            type: AND
            in:
              - P
              - H
        outputs:
          - id: Z
            from: g
            label: Zugang

  - kind: problem
    id: hook
    widget: choice
    prompt: Am Geldautomaten brauchst du zwei Dinge. Welche?
    params:
      options:
        - label: Karte und PIN
          correct: true
        - label: Nur die Karte
          feedback: Dann könnte jeder Finder Geld abheben.
        - label: Nur die PIN
          feedback: Ohne Karte geht nichts.
    hints:
      - Etwas, das du hast – und etwas, das du weißt.
    explanation: Zwei Hürden statt einer. Das geht auch bei Online-Konten.

  - kind: explain
    id: s1
    body: |
      Bei der **Zwei-Faktor-Anmeldung** braucht man etwas, das man **weiß** (Passwort), und etwas, das man **hat** (Handy, Sicherheitsschlüssel). Ein gestohlenes Passwort allein reicht dann nicht mehr.

  - kind: problem
    id: zweiter
    widget: choice
    prompt: Welcher zweite Faktor gilt als am sichersten gegen Phishing?
    params:
      options:
        - { label: Ein Hardware-Sicherheitsschlüssel, correct: true }
        - { label: Ein Code per SMS, feedback: "SMS lassen sich abfangen oder umleiten – besser als nichts, aber nicht am besten." }
    hints:
      - Welcher Faktor prüft selbst, ob die Website echt ist?
    explanation: Sicherheitsschlüssel funktionieren nur auf der echten Seite – Fälschungen gehen leer aus.

  - kind: problem
    id: backup
    widget: numeric
    prompt: Die 3-2-1-Regel – 3 Kopien, 2 verschiedene Speicher, 1 Kopie außer Haus. Wie viele Kopien deiner Daten gibt es insgesamt?
    params: { unit: Kopien }
    answer: { value: 3 }
    hints:
      - Die erste Zahl.
    explanation: Drei Kopien – so übersteht man Ransomware, Brand und Diebstahl.

  - kind: problem
    id: gewohnheiten
    widget: buckets
    prompt: Gute oder riskante Gewohnheit?
    params:
      buckets: [{ label: gut }, { label: riskant }]
      items:
        - { label: Updates automatisch installieren, bucket: gut }
        - { label: Passwort-Manager nutzen, bucket: gut }
        - { label: Gefundenen USB-Stick anschließen, bucket: riskant }
        - { label: Überall dasselbe Passwort, bucket: riskant }
    hints:
      - Was würde ein Angreifer sich wünschen?
    explanation: Gefundene USB-Sticks sind ein klassischer Köder für Schadsoftware.

  - kind: problem
    id: intro-c1
    widget: gates
    prompt: Das Konto soll sich öffnen, wenn das Passwort stimmt und dazu die App oder der Sicherheitsschlüssel bestätigt. Wähle die beiden Gatter.
    params:
      inputs:
        - id: P
          label: Passwort
        - id: A
          label: App
        - id: K
          label: Schlüssel
      gates:
        - id: o
          type: "?"
          in:
            - A
            - K
          options:
            - AND
            - OR
        - id: g
          type: "?"
          in:
            - P
            - o
          options:
            - AND
            - OR
      outputs:
        - id: Z
          from: g
          label: Zugang
    check:
      predicate: table('Z') == [0, 0, 0, 0, 0, 1, 1, 1]
    hints:
      - "Für den zweiten Faktor genügt eins von beiden: App oder Schlüssel."
      - Das Passwort muss immer stimmen – dafür braucht es ein UND.
    explanation: Passwort UND (App ODER Schlüssel). Wer nur das Passwort gestohlen hat, kommt nicht hinein.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Code per SMS als zweiter Faktor ist besser als nichts. Warum gilt er trotzdem als schwach?
    params:
      options:
        - label: SMS lassen sich abfangen, und eine Phishing-Seite kann den Code einfach mit abfragen
          correct: true
        - label: SMS kommen zu langsam an
          feedback: Tempo ist nicht das Sicherheitsproblem.
        - label: Der Code ist zu kurz
          feedback: Sechs Ziffern reichen – das Problem ist der Übertragungsweg.
    hints:
      - Was hindert dich daran, den Code auf einer gefälschten Seite einzutippen?
    explanation: Ein Hardware-Schlüssel prüft die echte Adresse der Seite mit – er lässt sich nicht austricksen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: Eine Authenticator-App macht alle 30 Sekunden einen neuen 6-stelligen Code. Wie viele Codes sind das an einem Tag?
    answer:
      value: 2880
    hints:
      - Ein Tag hat 86 400 Sekunden.
      - 86 400 / 30.
    explanation: 2880 Codes. Jeder gilt nur 30 Sekunden – ein abgefangener Code ist schnell wertlos.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Ein Angreifer rät einen 6-stelligen Code und hat 3 Versuche. Wie groß ist seine Chance in Prozent?
    params:
      unit: "%"
    answer:
      value: 0.0003
      tolerance: 0.00001
    hints:
      - Es gibt $10^6$ Codes.
      - 3 / 1 000 000, mal 100.
    explanation: 3 / $10^6$ = 0,0003 %. Raten ist aussichtslos – darum versuchen Angreifer lieber, dir den Code zu entlocken.
    difficulty: 2

  - kind: explain
    id: cs-d3
    depth: 2
    body: Nach dem **Prinzip der minimalen Rechte** bekommt jedes Konto nur, was es wirklich braucht. Wird es gekapert, bleibt der Schaden klein. Admin-Rechte nutzt man nur, wenn es nötig ist.

  - kind: problem
    id: cs-d4
    depth: 2
    widget: buckets
    prompt: Welche Art von Faktor ist das?
    params:
      buckets:
        - id: b1
          label: Wissen
        - id: b2
          label: Haben
        - id: b3
          label: Sein
      items:
        - label: Passwort
          bucket: b1
        - label: PIN
          bucket: b1
        - label: Fingerabdruck
          bucket: b3
        - label: Gesicht
          bucket: b3
        - label: Sicherheitsschlüssel
          bucket: b2
        - label: Handy mit App
          bucket: b2
    hints:
      - Was man vergessen kann, ist Wissen.
      - Was man verlieren kann, ist Haben.
    explanation: Zwei Faktoren verschiedener Art schützen am besten – ein Dieb braucht dann zwei ganz verschiedene Dinge.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist der Mensch oft das schwächste Glied der IT-Sicherheit?"
    params:
      keywords:
        - - vertrau
          - hilfsbereit
          - trust
          - helpful
          - glaub
          - believe
        - - täusch
          - trick
          - manipul
          - deceiv
          - social
          - phishing
          - köder
        - - technik
          - system
          - software
          - technology
          - passwort
          - password
      sample: Die beste Technik hilft nicht, wenn jemand sein Passwort freiwillig herausgibt. Angreifer täuschen deshalb Menschen, nutzen ihr Vertrauen und ihre Hilfsbereitschaft – das ist oft leichter, als ein System zu knacken.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Was bedeutet »Zero Trust« in Firmennetzen?
    params:
      options:
        - label: Jede Anfrage wird geprüft – auch aus dem eigenen Netz
          correct: true
        - label: Niemand bekommt Zugang
          feedback: Zugang gibt es – nur nie ungeprüft.
        - label: Man vertraut nur der Firewall
          feedback: Genau dieses Burg-Denken soll Zero Trust ersetzen.
    hints:
      - Was passiert, wenn ein Angreifer einmal drin ist?
      - Innen heißt nicht automatisch vertrauenswürdig.
    explanation: "Früher galt: Wer im Netz ist, ist Freund. Heute prüft man Gerät, Person und Recht bei jedem Zugriff."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Eine Festplatte fällt in einem Jahr mit 5 % Wahrscheinlichkeit aus. Wie wahrscheinlich fallen zwei unabhängige Kopien im selben Jahr beide aus? In Prozent.
    params:
      unit: "%"
    answer:
      value: 0.25
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 10
        misconception: add-vs-multiply
        text: "Addiert ergibt das die Chance, dass irgendeine ausfällt. Beide zugleich: multiplizieren."
    hints:
      - "Unabhängig heißt: Wahrscheinlichkeiten multiplizieren."
      - 0,05 · 0,05.
    explanation: "0,05 · 0,05 = 0,0025 = 0,25 %. Aber Vorsicht: Ein Brand oder Trojaner trifft beide Kopien gleichzeitig – darum eine außer Haus."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Wer kann bei Ende-zu-Ende-Verschlüsselung die Nachrichten lesen?
    params:
      options:
        - label: Nur Absender und Empfänger – nicht einmal der Anbieter
          correct: true
        - label: Auch der Anbieter, aber kein Hacker
          feedback: Gerade der Anbieter soll nicht mitlesen können.
        - label: Jeder mit dem Passwort des Servers
          feedback: Die Schlüssel liegen nur auf den Geräten.
    hints:
      - Wo liegen die Schlüssel?
      - "Ende zu Ende heißt: von Gerät zu Gerät."
    explanation: Der Server leitet nur verschlüsselte Daten weiter. Selbst bei einem Einbruch dort bleiben die Inhalte geschützt.
    difficulty: 3

srs:
  cards_from: [zweiter, gewohnheiten]
