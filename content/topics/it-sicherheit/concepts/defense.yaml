id: cs.security.defense
type: concept
title: Verteidigung
summary: Zwei Faktoren und gute Backups.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Am Geldautomaten brauchst du zwei Dinge. Welche?
    params:
      options:
        - label: Karte und PIN
          correct: true
        - label: Nur die Karte
          feedback: Dann könnte jeder Finder Geld abheben.
        - label: Nur die PIN
          feedback: Ohne Karte geht nichts.
    hints:
      - Etwas, das du hast – und etwas, das du weißt.
    explanation: Zwei Hürden statt einer. Das geht auch bei Online-Konten.


  - kind: explain
    id: s1
    body: |
      Bei der **Zwei-Faktor-Anmeldung** braucht man etwas, das man **weiß** (Passwort), und etwas, das man **hat** (Handy, Sicherheitsschlüssel). Ein gestohlenes Passwort allein reicht dann nicht mehr.

  - kind: problem
    id: zweiter
    widget: choice
    prompt: Welcher zweite Faktor gilt als am sichersten gegen Phishing?
    params:
      options:
        - { label: Ein Hardware-Sicherheitsschlüssel, correct: true }
        - { label: Ein Code per SMS, feedback: "SMS lassen sich abfangen oder umleiten – besser als nichts, aber nicht am besten." }
    hints:
      - Welcher Faktor prüft selbst, ob die Website echt ist?
    explanation: Sicherheitsschlüssel funktionieren nur auf der echten Seite – Fälschungen gehen leer aus.

  - kind: problem
    id: backup
    widget: numeric
    prompt: Die 3-2-1-Regel – 3 Kopien, 2 verschiedene Speicher, 1 Kopie außer Haus. Wie viele Kopien deiner Daten gibt es insgesamt?
    params: { unit: Kopien }
    answer: { value: 3 }
    hints:
      - Die erste Zahl.
    explanation: Drei Kopien – so übersteht man Ransomware, Brand und Diebstahl.

  - kind: problem
    id: gewohnheiten
    widget: buckets
    prompt: Gute oder riskante Gewohnheit?
    params:
      buckets: [{ label: gut }, { label: riskant }]
      items:
        - { label: Updates automatisch installieren, bucket: gut }
        - { label: Passwort-Manager nutzen, bucket: gut }
        - { label: Gefundenen USB-Stick anschließen, bucket: riskant }
        - { label: Überall dasselbe Passwort, bucket: riskant }
    hints:
      - Was würde ein Angreifer sich wünschen?
    explanation: Gefundene USB-Sticks sind ein klassischer Köder für Schadsoftware.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Code per SMS als zweiter Faktor ist besser als nichts. Warum gilt er trotzdem als schwach?
    params:
      options:
        - label: SMS lassen sich abfangen, und eine Phishing-Seite kann den Code einfach mit abfragen
          correct: true
        - label: SMS kommen zu langsam an
          feedback: Tempo ist nicht das Sicherheitsproblem.
        - label: Der Code ist zu kurz
          feedback: Sechs Ziffern reichen – das Problem ist der Übertragungsweg.
    hints:
      - Was hindert dich daran, den Code auf einer gefälschten Seite einzutippen?
    explanation: Ein Hardware-Schlüssel prüft die echte Adresse der Seite mit – er lässt sich nicht austricksen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist der Mensch oft das schwächste Glied der IT-Sicherheit?"
    params:
      keywords:
        - - vertrau
          - hilfsbereit
          - trust
          - helpful
          - glaub
          - believe
        - - täusch
          - trick
          - manipul
          - deceiv
          - social
          - phishing
          - köder
        - - technik
          - system
          - software
          - technology
          - passwort
          - password
      sample: Die beste Technik hilft nicht, wenn jemand sein Passwort freiwillig herausgibt. Angreifer täuschen deshalb Menschen, nutzen ihr Vertrauen und ihre Hilfsbereitschaft – das ist oft leichter, als ein System zu knacken.
    difficulty: 3

srs:
  cards_from: [zweiter, gewohnheiten]
