id: cs.security.storage
type: concept
title: Wie Dienste Passwörter speichern
summary: Hash, Salz und Passwort-Manager.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Hacker stiehlt die Datenbank eines Dienstes. Wann ist dein Passwort trotzdem geschützt?
    params:
      options:
        - label: Wenn dort nur ein Fingerabdruck des Passworts liegt
          correct: true
        - label: Wenn es im Klartext gespeichert ist
          feedback: Dann kann er es einfach ablesen.
        - label: Wenn der Dienst bekannt ist
          feedback: Auch große Dienste werden gehackt.
    hints:
      - Was man nicht speichert, kann niemand stehlen.
    explanation: Gute Dienste kennen dein Passwort selbst gar nicht.

  - kind: explain
    id: s1
    body: |
      Gute Dienste speichern nie das Passwort selbst, sondern einen **Hash** mit **Salz**: eine zufällige Beigabe pro Person. Beim Login wird die Eingabe genauso verarbeitet und verglichen.

  - kind: problem
    id: salz
    widget: choice
    prompt: Zwei Menschen haben dasselbe Passwort. Warum sehen ihre gespeicherten Hashes trotzdem verschieden aus?
    params:
      options:
        - { label: Jeder bekommt ein anderes Salz., correct: true }
        - { label: Der Computer rechnet ungenau., feedback: "Hashes sind exakt – das Salz macht den Unterschied." }
    hints:
      - Was wird vor dem Hashen beigemischt?
    explanation: So kann ein Angreifer nicht mit vorberechneten Tabellen alle auf einmal knacken.

  - kind: problem
    id: vergessen
    widget: choice
    prompt: Du klickst »Passwort vergessen« und bekommst dein altes Passwort per E-Mail zurück. Was sagt das?
    params:
      options:
        - { label: Der Dienst speichert Passwörter unsicher., correct: true }
        - { label: Der Dienst ist besonders hilfsbereit., feedback: "Ein sicherer Dienst kennt dein Passwort gar nicht – er könnte nur ein neues setzen lassen." }
    hints:
      - Kann man einen Hash zurückrechnen?
    explanation: Wer dein Passwort zurückschicken kann, hat es im Klartext oder umkehrbar gespeichert.

  - kind: problem
    id: manager
    widget: choice
    prompt: Was macht ein Passwort-Manager?
    params:
      options:
        - { label: Er erzeugt und merkt sich für jeden Dienst ein eigenes starkes Passwort., correct: true }
        - { label: Er macht alle Passwörter gleich., feedback: "Im Gegenteil – jedes ist einzigartig." }
    hints:
      - Wie viele Passwörter musst du dir dann noch merken?
    explanation: Ein starkes Hauptpasswort schützt den ganzen Tresor.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Gute oder schlechte Speicherung?
    params:
      buckets:
        - id: b1
          label: Gut
        - id: b2
          label: Schlecht
      items:
        - label: Passwort im Klartext
          bucket: b2
        - label: Hash mit Salz
          bucket: b1
        - label: Hash ohne Salz
          bucket: b2
        - label: Langsamer Hash mit Salz
          bucket: b1
    hints:
      - Was hilft einem Dieb der Datenbank am wenigsten?
    explanation: Ohne Salz haben gleiche Passwörter gleiche Hashes. Fertige Listen knacken sie sofort.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Gute Dienste speichern nur einen [[Hash]] mit [[Salz]] – nie das Passwort selbst.
      distractors:
        - Code
        - Zucker

  - kind: problem
    id: mix-c3
    widget: order
    prompt: Was passiert beim Login? Ordne.
    params:
      items:
        - label: Du tippst dein Passwort ein
        - label: Der Dienst hängt dein Salz an
        - label: Er berechnet daraus den Hash
        - label: Er vergleicht ihn mit dem gespeicherten
    hints:
      - Erst Salz, dann Hash, dann Vergleich.
    explanation: Der Dienst prüft dein Passwort, ohne es zu kennen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Angreifer nutzen fertige Listen mit Milliarden Hashes häufiger Passwörter. Wie macht Salz diese Listen wertlos?
    params:
      options:
        - label: Jedes Passwort wird mit einer eigenen Zufallszahl gehasht – vorberechnete Hashes passen nicht mehr
          correct: true
        - label: Salz verschlüsselt den Hash zusätzlich
          feedback: Das Salz ist nicht geheim. Es macht nur jeden Hash einzigartig.
        - label: Salz macht das Passwort länger
          feedback: Das Passwort selbst bleibt gleich.
    hints:
      - Die Liste wurde ohne dein Salz berechnet.
    explanation: Der Angreifer muss für jede Person von vorn rechnen statt einmal für alle.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Zwei Leute haben dasselbe Passwort, aber verschiedenes Salz. Wie viele verschiedene Hashes stehen dafür in der Datenbank?
    answer:
      value: 2
    hints:
      - Das Salz ändert die Eingabe für den Hash.
    explanation: Zwei. Niemand sieht, dass die Passwörter gleich sind.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Aus einem Hash lässt sich das Passwort nicht zurückrechnen.
          right: true
        - text: Ein guter Dienst kann dir dein altes Passwort zuschicken.
          right: false
          why: Kann er das, speichert er es im Klartext.
        - text: Salz macht fertige Hash-Listen nutzlos.
          right: true
        - text: Mit Hash ist auch ein kurzes Passwort sicher.
          right: false
          why: Kurze Passwörter probiert man einfach durch.
      left: Falsch
      right: Wahr
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: bcrypt mit dem Kostenfaktor 12 rechnet $2^{12}$ Runden. Wievielmal langsamer ist Kostenfaktor 14?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: linear-cost
        text: Jede Stufe verdoppelt – zwei Stufen vervierfachen.
    hints:
      - $2^{14}$ / $2^{12}$.
      - $2^2$.
    explanation: Viermal langsamer – für dich ein paar Millisekunden, für einen Angreifer mit Milliarden Versuchen ein Vielfaches an Jahren.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Eine Grafikkarte schafft 10 Milliarden einfache Hashes pro Sekunde, aber nur 10 000 bcrypt-Hashes. Wievielmal langsamer wird der Angriff?
    answer:
      value: 1000000
    hints:
      - $10^{10}$ / $10^4$.
      - Exponenten abziehen.
    explanation: Eine Million mal langsamer. Was in einer Sekunde ging, dauert nun 11 Tage.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Für Passwörter nutzt man absichtlich **langsame** Hashfunktionen wie bcrypt oder Argon2. Warum?
    params:
      options:
        - label: Ein Login dauert unmerklich länger – ein Angreifer mit Milliarden Versuchen wird millionenfach gebremst
          correct: true
        - label: Langsame Hashes sind kürzer
          feedback: Die Länge spielt keine Rolle.
        - label: Schnelle Hashes sind fehlerhaft
          feedback: Sie sind korrekt – nur für diesen Zweck zu schnell.
    hints:
      - Wer leidet mehr unter 0,1 Sekunden pro Versuch – du oder der Angreifer?
    explanation: "Asymmetrie: einmal für dich, Milliarden Mal für den Angreifer."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: "Manche Dienste nutzen zusätzlich einen »Pfeffer«: einen geheimen Wert, der nicht in der Datenbank liegt. Was bringt das?"
    params:
      options:
        - label: Wer nur die Datenbank stiehlt, kann gar nicht erst anfangen zu raten
          correct: true
        - label: Er ersetzt das Salz
          feedback: Salz bleibt nötig – es macht jeden Hash einzigartig.
        - label: Er macht das Login schneller
          feedback: Er kostet kaum Zeit, beschleunigt aber nichts.
    hints:
      - Was fehlt dem Dieb, wenn ein Teil der Rechnung woanders liegt?
      - Ohne Pfeffer kann er keinen einzigen Rateversuch prüfen.
    explanation: Der Pfeffer liegt etwa in einem Hardware-Modul. Erst wer Datenbank und Pfeffer erbeutet, kann offline raten.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Argon2 braucht absichtlich viel Arbeitsspeicher. Warum?
    params:
      options:
        - label: Grafikkarten und Spezialchips haben wenig Speicher pro Rechenkern – das bremst Massenangriffe
          correct: true
        - label: Um mehr Passwörter zu speichern
          feedback: Der Speicher wird nur beim Rechnen gebraucht.
        - label: Damit der Hash länger wird
          feedback: Die Hashlänge ist davon unabhängig.
    hints:
      - Angreifer rechnen auf Tausenden Kernen gleichzeitig.
      - Rechnen ist billig, Speicher ist teuer.
    explanation: "Speicherhart heißt: Jeder Rateversuch braucht viel RAM. Tausende Versuche parallel werden so unbezahlbar."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Bei Passkeys speichert der Dienst nur einen öffentlichen Schlüssel. Was kann ein Hacker mit der gestohlenen Datenbank anfangen?
    params:
      options:
        - label: Nichts zum Einloggen – der private Schlüssel bleibt auf deinem Gerät
          correct: true
        - label: Alle Passwörter auslesen
          feedback: Es gibt gar keine Passwörter mehr.
        - label: Die privaten Schlüssel ausrechnen
          feedback: Das ist genau das schwere Problem der Public-Key-Kryptografie.
    hints:
      - Was liegt beim Dienst, was bei dir?
      - "Öffentlich heißt: darf jeder kennen."
    explanation: Beim Login signiert dein Gerät eine Zufallszahl. Der Dienst prüft mit dem öffentlichen Schlüssel. Ein Datenleck verrät nichts, womit man sich anmelden könnte.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Dienste Passwörter salzen und hashen.
    params:
      keywords:
        - - hash
          - fingerabdruck
          - fingerprint
        - - salz
          - salt
        - - zurück
          - umkehr
          - reverse
          - back
        - - tabelle
          - liste
          - table
          - list
          - gleich
          - same
      sample: "Gespeichert wird nur ein Hash, ein Fingerabdruck, aus dem man das Passwort nicht zurückrechnen kann. Das Salz ist ein Zufallswert pro Person: So sehen gleiche Passwörter verschieden aus, und fertige Tabellen mit Hashes nützen dem Angreifer nichts."
    difficulty: 3

srs:
  cards_from: [salz, vergessen]
