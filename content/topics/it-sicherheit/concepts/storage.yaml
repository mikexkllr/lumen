id: cs.security.storage
type: concept
title: Wie Dienste Passwörter speichern
summary: Hash, Salz und Passwort-Manager.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Hacker stiehlt die Datenbank eines Dienstes. Wann ist dein Passwort trotzdem geschützt?
    params:
      options:
        - label: Wenn dort nur ein Fingerabdruck des Passworts liegt
          correct: true
        - label: Wenn es im Klartext gespeichert ist
          feedback: Dann kann er es einfach ablesen.
        - label: Wenn der Dienst bekannt ist
          feedback: Auch große Dienste werden gehackt.
    hints:
      - Was man nicht speichert, kann niemand stehlen.
    explanation: Gute Dienste kennen dein Passwort selbst gar nicht.


  - kind: explain
    id: s1
    body: |
      Gute Dienste speichern nie das Passwort selbst, sondern einen **Hash** mit **Salz**: eine zufällige Beigabe pro Person. Beim Login wird die Eingabe genauso verarbeitet und verglichen.

  - kind: problem
    id: salz
    widget: choice
    prompt: Zwei Menschen haben dasselbe Passwort. Warum sehen ihre gespeicherten Hashes trotzdem verschieden aus?
    params:
      options:
        - { label: Jeder bekommt ein anderes Salz., correct: true }
        - { label: Der Computer rechnet ungenau., feedback: "Hashes sind exakt – das Salz macht den Unterschied." }
    hints:
      - Was wird vor dem Hashen beigemischt?
    explanation: So kann ein Angreifer nicht mit vorberechneten Tabellen alle auf einmal knacken.

  - kind: problem
    id: vergessen
    widget: choice
    prompt: Du klickst »Passwort vergessen« und bekommst dein altes Passwort per E-Mail zurück. Was sagt das?
    params:
      options:
        - { label: Der Dienst speichert Passwörter unsicher., correct: true }
        - { label: Der Dienst ist besonders hilfsbereit., feedback: "Ein sicherer Dienst kennt dein Passwort gar nicht – er könnte nur ein neues setzen lassen." }
    hints:
      - Kann man einen Hash zurückrechnen?
    explanation: Wer dein Passwort zurückschicken kann, hat es im Klartext oder umkehrbar gespeichert.

  - kind: problem
    id: manager
    widget: choice
    prompt: Was macht ein Passwort-Manager?
    params:
      options:
        - { label: Er erzeugt und merkt sich für jeden Dienst ein eigenes starkes Passwort., correct: true }
        - { label: Er macht alle Passwörter gleich., feedback: "Im Gegenteil – jedes ist einzigartig." }
    hints:
      - Wie viele Passwörter musst du dir dann noch merken?
    explanation: Ein starkes Hauptpasswort schützt den ganzen Tresor.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Angreifer nutzen fertige Listen mit Milliarden Hashes häufiger Passwörter. Wie macht Salz diese Listen wertlos?
    params:
      options:
        - label: Jedes Passwort wird mit einer eigenen Zufallszahl gehasht – vorberechnete Hashes passen nicht mehr
          correct: true
        - label: Salz verschlüsselt den Hash zusätzlich
          feedback: Das Salz ist nicht geheim. Es macht nur jeden Hash einzigartig.
        - label: Salz macht das Passwort länger
          feedback: Das Passwort selbst bleibt gleich.
    hints:
      - Die Liste wurde ohne dein Salz berechnet.
    explanation: Der Angreifer muss für jede Person von vorn rechnen statt einmal für alle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Für Passwörter nutzt man absichtlich **langsame** Hashfunktionen wie bcrypt oder Argon2. Warum?
    params:
      options:
        - label: Ein Login dauert unmerklich länger – ein Angreifer mit Milliarden Versuchen wird millionenfach gebremst
          correct: true
        - label: Langsame Hashes sind kürzer
          feedback: Die Länge spielt keine Rolle.
        - label: Schnelle Hashes sind fehlerhaft
          feedback: Sie sind korrekt – nur für diesen Zweck zu schnell.
    hints:
      - Wer leidet mehr unter 0,1 Sekunden pro Versuch – du oder der Angreifer?
    explanation: "Asymmetrie: einmal für dich, Milliarden Mal für den Angreifer."
    difficulty: 3

srs:
  cards_from: [salz, vergessen]
