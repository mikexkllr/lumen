id: cs.security.phishing
type: concept
title: Spotting phishing
summary: When a message baits you.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: zeichen
    widget: buckets
    prompt: Warning sign or probably harmless?
    params:
      buckets: [{ label: Warning sign }, { label: harmless }]
      items:
        - { label: "“Account locked in 2 hours!”", bucket: Warning sign }
        - { label: Link to bank-security-login.com, bucket: Warning sign }
        - { label: Password request by email, bucket: Warning sign }
        - { label: "An invoice you were expecting", bucket: harmless }
    hints:
      - Pressure, unfamiliar addresses, questions about secrets.
    explanation: Time pressure and fear are meant to keep you from thinking.

  - kind: explain
    id: s2
    body: |
      **Phishing** imitates trusted senders to get your passwords or money. Real banks never ask for your password by email.

  - kind: problem
    id: tun
    widget: order
    prompt: An email from your "bank" seems urgent. Put the sensible steps in order.
    params:
      items:
        - { label: Do not click the link }
        - { label: Open the bank's website yourself in your browser }
        - { label: "Check for messages there, or call" }
        - { label: Report the email as phishing }
    hints:
      - First click nothing, then check in your own way.
    explanation: Your own route to the real site gets around any fake.

  - kind: problem
    id: geklickt
    widget: choice
    prompt: You entered your password on a phishing page. What do you do first?
    params:
      options:
        - { label: Change the password at the real service right away, correct: true }
        - { label: "Wait and see if anything happens", feedback: "Attackers often use stolen data within minutes." }
    hints:
      - How fast do attackers act?
    explanation: Changing it quickly makes the stolen data worthless.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Warning sign or harmless?
    params:
      buckets:
        - id: b1
          label: Warning sign
        - id: b2
          label: Harmless
      items:
        - label: “Act now or be locked out!”
          bucket: b1
        - label: Link leads to a strange address
          bucket: b1
        - label: You type the address yourself
          bucket: b2
        - label: Mail asks for your password
          bucket: b1
    hints:
      - Pressure, strange links and questions about secrets are suspicious.
    explanation: "When in doubt: do not click, open the site yourself."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A mail comes from “service@paypaI.com”. What is fishy?
    params:
      options:
        - label: The last letter is a capital i instead of a lower-case L
          correct: true
        - label: Nothing – the address is right
          feedback: "Look closely: I and l look almost alike."
        - label: PayPal never sends e-mails
          feedback: It does – but from the real domain.
    hints:
      - Some letters look the same in many fonts.
    explanation: Such **homograph attacks** use look-alike characters. When in doubt type the address yourself.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: swipe
    prompt: Genuine or fake?
    params:
      cards:
        - text: https://www.sparkasse.de.konto-check.info
          right: false
          why: The site belongs to konto-check.info.
        - text: https://accounts.google.com
          right: true
          why: A subdomain of google.com.
        - text: https://amaz0n.de
          right: false
          why: A zero instead of the o.
        - text: https://paypal.com-sicherheit.de
          right: false
          why: The domain is com-sicherheit.de.
        - text: https://login.microsoftonline.com
          right: true
          why: Microsoft's real sign-in domain.
      left: fake
      right: genuine
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: A **homograph attack** uses characters that look the same – like the Cyrillic »а« instead of the Latin »a«. To the eye it says apple.com, to the computer it is a completely different address.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: An email shows the link »www.bank.de«. How do you see where it really leads?
    params:
      options:
        - label: Hover with the mouse or long-press and read the real target
          correct: true
        - label: The displayed text is the target
          feedback: A link's text and target can be completely different.
        - label: Click once and see
          feedback: The click itself can do harm.
    hints:
      - A link has a visible text and a hidden target.
      - The browser shows the target without a click.
    explanation: "Safer still: never log in via links in emails – type the address yourself or use a bookmark."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "**Spear phishing** targets one person specifically, with real names and details. Why is it so much more dangerous?"
    params:
      options:
        - label: The usual warning signs are missing – the message seems credible and fitting
          correct: true
        - label: It uses better malware
          feedback: The difference lies in research, not technology.
        - label: It always comes by phone
          feedback: Usually by mail or messenger.
    hints:
      - How do you usually recognise a phishing mail?
    explanation: "Only a second channel protects: for unusual requests call briefly and check."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Why does a hardware security key protect against phishing while an SMS code does not?
    params:
      options:
        - label: The key checks the real address of the site and simply does not answer a fake
          correct: true
        - label: The key is more expensive
          feedback: The price does not protect – the principle does.
        - label: SMS codes are too short
          feedback: Even a long code could be typed into a fake site.
    hints:
      - Who types the SMS code – and where?
      - The key cannot be talked into anything.
    explanation: The person types the SMS code into the fake site, which relays it. The key binds its answer to the real domain – on bank-login.xyz it stays silent.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: "A call, supposedly from the boss: »Please transfer €40,000 right away, strictly confidential.« What helps most?"
    params:
      options:
        - label: Call back via a known channel and ask
          correct: true
        - label: Transfer quickly, the boss is in a hurry
          feedback: Urgency is exactly the fraudsters' lever.
        - label: Listen to the voice
          feedback: Voices can be faked very convincingly today.
    hints:
      - Pressure, urgency, secrecy – three warning signs at once.
      - Check via a channel the caller does not control.
    explanation: This »CEO fraud« costs companies millions every year. Fixed rules like two-person approval help more than any gut feeling.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: A filter catches 99 % of all phishing emails. Of 100,000 emails, 1000 are phishing. How many phishing emails still get through?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 1000
        misconception: missed-rate
        text: The question is what the filter misses – 1 % of them.
    hints:
      - 1 % of phishing emails slip through.
      - 1 % of 1000.
    explanation: 10 emails per 100,000 – at a big company that is several a day. A single click is enough. That is why technology alone is never enough.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how to spot phishing.
    params:
      keywords:
        - - absender
          - adresse
          - sender
          - address
          - link
          - url
          - domain
        - - dring
          - druck
          - eile
          - urgent
          - pressure
          - hurry
        - - passwort
          - daten
          - password
          - data
          - login
      sample: Phishing wants your password or your data. Pressure and urgency are typical, like »your account will be locked«. Check the sender and the real address behind every link – if the domain is wrong, it is a scam.
    difficulty: 3

srs:
  cards_from: [zeichen, geklickt]
