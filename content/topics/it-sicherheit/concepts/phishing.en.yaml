id: cs.security.phishing
type: concept
title: Spotting phishing
summary: When a message baits you.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: zeichen
    widget: buckets
    prompt: Warning sign or probably harmless?
    params:
      buckets: [{ label: Warning sign }, { label: harmless }]
      items:
        - { label: "“Account locked in 2 hours!”", bucket: Warning sign }
        - { label: Link to bank-security-login.com, bucket: Warning sign }
        - { label: Password request by email, bucket: Warning sign }
        - { label: "An invoice you were expecting", bucket: harmless }
    hints:
      - Pressure, unfamiliar addresses, questions about secrets.
    explanation: Time pressure and fear are meant to keep you from thinking.

  - kind: explain
    body: |
      **Phishing** imitates trusted senders to get your passwords or money. Real banks never ask for your password by email.

  - kind: problem
    id: tun
    widget: order
    prompt: An email from your "bank" seems urgent. Put the sensible steps in order.
    params:
      items:
        - { label: Do not click the link }
        - { label: Open the bank's website yourself in your browser }
        - { label: "Check for messages there, or call" }
        - { label: Report the email as phishing }
    hints:
      - First click nothing, then check in your own way.
    explanation: Your own route to the real site gets around any fake.

  - kind: problem
    id: geklickt
    widget: choice
    prompt: You entered your password on a phishing page. What do you do first?
    params:
      options:
        - { label: Change the password at the real service right away, correct: true }
        - { label: "Wait and see if anything happens", feedback: "Attackers often use stolen data within minutes." }
    hints:
      - How fast do attackers act?
    explanation: Changing it quickly makes the stolen data worthless.

srs:
  cards_from: [zeichen, geklickt]
