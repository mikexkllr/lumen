id: cs.security.attacks
type: concept
title: Wie Angreifer denken
summary: Typische Angriffe verstehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der leichteste Weg hinein
    body: Angreifer brechen selten die stärkste Tür auf. Sie suchen **die schwächste Stelle**. Deck die Karten auf – manche Wege klingen kaum glaublich.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐠
            front: Das Aquarium
            back: Hacker kamen über das vernetzte Thermometer eines Aquariums in das Netz eines Casinos.
          - icon: 💾
            front: Der Fund im Parkhaus
            back: In einem Test steckten viele Finder einen fremden USB-Stick einfach in ihren Rechner.
          - icon: 📝
            front: Der Zettel am Monitor
            back: Ein Passwort auf einem Zettel schlägt jede Verschlüsselung.

  - kind: problem
    id: arten
    widget: match
    prompt: Was steckt hinter dem Begriff?
    params:
      pairs:
        - { left: Ransomware, right: "Daten sperren und Lösegeld fordern" }
        - { left: Social Engineering, right: Menschen geschickt täuschen }
        - { left: Sicherheitslücke, right: Fehler in Software ausnutzen }
    hints:
      - Ransom heißt Lösegeld.
    explanation: Oft ist der Mensch das schwächste Glied – nicht die Technik.

  - kind: explain
    id: s2
    body: |
      Angreifer suchen den **leichtesten Weg**: alte Software mit Lücken, mehrfach genutzte Passwörter oder hilfsbereite Menschen am Telefon. Schutz heißt, diese Wege zu schließen.

  - kind: problem
    id: updates
    widget: choice
    prompt: Warum sind Updates so wichtig?
    params:
      options:
        - { label: Sie schließen bekannte Sicherheitslücken., correct: true }
        - { label: Sie bringen vor allem neue Farben., feedback: "Viele Updates sind reine Sicherheitsflicken." }
    hints:
      - Was passiert, wenn eine Lücke öffentlich bekannt wird?
    explanation: Nach Bekanntwerden einer Lücke ist ungepatchte Software ein offenes Ziel.

  - kind: problem
    id: anruf
    widget: choice
    prompt: Ein »IT-Mitarbeiter« ruft an und braucht kurz dein Passwort zur Wartung. Was ist das?
    params:
      options:
        - { label: Social Engineering, correct: true }
        - { label: Normale Wartung, feedback: "Echte IT-Abteilungen fragen nie nach deinem Passwort." }
    hints:
      - Wer braucht wirklich dein Passwort?
    explanation: Niemand außer dir braucht dein Passwort – auch nicht die IT.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Was ist für Angreifer am leichtesten? Ordne von leicht nach schwer.
    params:
      items:
        - label: Das Passwort »123456« raten
        - label: Alte Software mit bekannter Lücke nutzen
        - label: Ein langes Zufallspasswort knacken
        - label: Moderne Verschlüsselung brechen
    hints:
      - Was kostet am wenigsten Mühe?
    explanation: Angreifer gehen selten durch die dickste Mauer.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Angreifer suchen den [[leichtesten]] Weg. Oft ist das nicht die Technik, sondern der [[Mensch]].
      distractors:
        - längsten
        - Computer

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Bei einem **DDoS-Angriff** rufen Hunderttausende gekaperte Geräte gleichzeitig eine Webseite auf. Was ist das Ziel?
    params:
      options:
        - label: Die Seite überlasten, bis sie für niemanden mehr erreichbar ist
          correct: true
        - label: Passwörter stehlen
          feedback: Es wird nichts gestohlen – nur blockiert.
        - label: Die Seite verändern
          feedback: Der Inhalt bleibt unberührt.
    hints:
      - Wie viele Besucher verkraftet ein Laden gleichzeitig?
    explanation: Angegriffen wird die **Verfügbarkeit** – neben Vertraulichkeit und Integrität das dritte Schutzziel.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: Bei einem **Pufferüberlauf** schreibt ein Programm mehr Daten in einen Speicherbereich, als hineinpassen. Die überzähligen Bytes überschreiben Nachbardaten – im schlimmsten Fall die Rücksprungadresse. Dann läuft fremder Code.

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Ein Forum zeigt Kommentare ungefiltert an. Jemand postet ein `<script>` mit eigenem Code. Was passiert?
    params:
      options:
        - label: Der Code läuft im Browser jedes Lesers – Cross-Site-Scripting
          correct: true
        - label: Nichts, Browser ignorieren Code in Kommentaren
          feedback: Der Browser sieht nur HTML und weiß nicht, was Kommentar ist.
        - label: Der Server stürzt ab
          feedback: Der Server reicht den Text nur weiter.
    hints:
      - Wer führt Code aus, der in einer Webseite steht?
      - Der Browser vertraut allem, was von der Seite kommt.
    explanation: "Der Code läuft mit den Rechten der Seite und kann etwa Sitzungen stehlen. Abhilfe: Ausgaben maskieren, damit < als Text erscheint."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: 100 000 gekaperte Geräte senden je 2 Mbit/s an eine Webseite. Wie viele Gbit/s treffen die Seite?
    params:
      unit: Gbit/s
    answer:
      value: 200
    feedback:
      - when: numval(state.input) == 200000
        misconception: unit
        text: Das sind Mbit/s. 1000 Mbit sind 1 Gbit.
    hints:
      - 100 000 · 2 Mbit/s = 200 000 Mbit/s.
      - Teile durch 1000.
    explanation: 200 Gbit/s – mehr, als die meisten Rechenzentren annehmen können. Schutz bieten Netze, die den Ansturm auf viele Standorte verteilen.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: match
    prompt: Welche Abwehr passt zu welchem Angriff?
    params:
      pairs:
        - left: SQL-Injection
          right: Abfragen mit Platzhaltern
        - left: Cross-Site-Scripting
          right: Ausgaben maskieren
        - left: Pufferüberlauf
          right: Grenzen prüfen, sichere Sprachen
        - left: Phishing
          right: Hardware-Schlüssel
        - left: DDoS
          right: Last auf viele Server verteilen
    hints:
      - Die ersten drei entstehen, wenn Daten zu Code werden.
      - Gegen Massenansturm hilft nur Breite.
    explanation: "Viele Angriffe folgen einem Muster: Eingaben werden nicht als Daten behandelt. Gute Abwehr trennt Daten und Code strikt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine **Zero-Day-Lücke** ist eine Schwachstelle, die …
    params:
      options:
        - label: … der Hersteller noch nicht kennt – es gibt also noch kein Update
          correct: true
        - label: … nur am ersten Tag nach dem Kauf besteht
          feedback: "Der Name zählt die Tage seit Bekanntwerden: null."
        - label: … null Schaden anrichtet
          feedback: Solche Lücken sind die gefährlichsten überhaupt.
    hints:
      - Wie viele Tage hatte der Hersteller Zeit zum Reparieren?
    explanation: Gegen Unbekanntes helfen keine Updates – nur mehrere Schutzschichten, die einander absichern.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Ein Trojaner sperrt alle Dateien und will Geld. Was hilft da am besten?
    params:
      options:
        - label: Getrennte, regelmäßig geprüfte Backups
          correct: true
        - label: Lösegeld zahlen
          feedback: Ob die Täter entschlüsseln, ist offen – und Zahlung lockt neue Angriffe an.
        - label: Ein Backup auf derselben Platte
          feedback: Das verschlüsselt der Trojaner gleich mit.
    hints:
      - Was braucht man, wenn alle Daten unlesbar sind?
      - Das Backup muss für den Trojaner unerreichbar sein.
    explanation: "Mit einem getrennten Backup ist der Angriff ärgerlich, aber nicht tödlich. Prüfen heißt: Wiederherstellen wirklich üben."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Angreifer schleusen Schadcode in ein beliebtes Software-Paket ein. Warum ist das so wirksam?
    params:
      options:
        - label: Tausende Firmen installieren das Update selbst – mit vollem Vertrauen
          correct: true
        - label: Weil Updates verboten sind
          feedback: Updates sind wichtig – gerade deshalb wirkt der Trick.
        - label: Weil das Paket dann langsamer wird
          feedback: Langsamkeit wäre auffällig, der Schadcode ist es nicht.
    hints:
      - Wer installiert die Schadsoftware?
      - Die Opfer selbst, über einen vertrauten Weg.
    explanation: "Solche Lieferketten-Angriffe trafen etwa 2020 SolarWinds. Abhilfe: signierte Pakete, geprüfte Abhängigkeiten, wenig Fremdcode."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Angreifer typischerweise vorgehen.
    params:
      keywords:
        - - leicht
          - schwach
          - easiest
          - weakest
          - einfach
          - easy
        - - update
          - lücke
          - vulnerab
          - patch
        - - mensch
          - täusch
          - social
          - trick
          - human
      sample: Angreifer suchen den leichtesten Weg. Das sind oft alte Software mit bekannten Lücken, für die ein Update fehlt, oder Menschen, die man täuschen kann – etwa mit Phishing. Teure Tricks braucht es selten.
    difficulty: 3

srs:
  cards_from: [arten, anruf]
