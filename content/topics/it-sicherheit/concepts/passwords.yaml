id: cs.security.passwords
type: concept
title: Starke Passwörter
summary: Länge schlägt Sonderzeichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Hält dein Passwort?
    body: Angreifer raten nicht von Hand. Sie lassen Rechner raten – Milliarden Mal pro Sekunde. Deck die Karten auf. Welches Passwort hält **am längsten** durch?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🙈
            front: hallo
            back: Steht in jeder Wortliste. Geknackt, bevor du blinzelst.
          - icon: 🔢
            front: Hallo123!
            back: Großbuchstabe, Zahl, Zeichen – aber ein bekanntes Muster. Nach Sekunden geknackt.
          - icon: 🎲
            front: x7#Qp
            back: Wild gemischt, aber nur fünf Zeichen. Auch das ist in Sekunden durchprobiert.
          - icon: 🐯
            front: tiger wolke gabel regen
            back: "Vier zufällige Wörter: lang, leicht zu merken – und schwer zu knacken."

  - kind: problem
    id: zeichen
    widget: numeric
    prompt: Ein Passwort besteht aus Kleinbuchstaben (26 Möglichkeiten pro Zeichen). Wievielmal mehr Kombinationen bringt ein zusätzliches Zeichen?
    params: { unit: "-mal" }
    answer: { value: 26 }
    hints:
      - Jede Stelle hat 26 Möglichkeiten.
    explanation: Jedes Zeichen multipliziert mit 26 – Länge wächst exponentiell.

  - kind: explain
    id: s2
    body: |
      Angreifer testen Milliarden Passwörter pro Sekunde. Zuerst kommen bekannte Muster wie »Passwort1!«. Am stärksten sind **lange, zufällige** Passwörter – etwa vier zufällige Wörter.

  - kind: problem
    id: staerker
    widget: buckets
    prompt: Stark oder schwach?
    params:
      buckets: [{ label: stark }, { label: schwach }]
      items:
        - { label: "Tisch-Wolke-Ampel-Senf", bucket: stark }
        - { label: Zufallsfolge mit 16 Zeichen, bucket: stark }
        - { label: "P@ssw0rt1", bucket: schwach }
        - { label: Name des Haustiers plus 2024, bucket: schwach }
    hints:
      - Steht es in einer Liste beliebter Passwörter oder lässt es sich erraten?
    explanation: Ersetzte Buchstaben wie @ für a kennen Angreifer längst.

  - kind: problem
    id: wiederverwenden
    widget: choice
    prompt: Warum ist es gefährlich, dasselbe Passwort überall zu nutzen?
    params:
      options:
        - { label: "Wird ein Dienst gehackt, probieren Angreifer es überall aus.", correct: true }
        - { label: Man vergisst es leichter., feedback: "Eher im Gegenteil – das Risiko ist die Kettenreaktion." }
    hints:
      - Was passiert mit geleakten Passwörtern?
    explanation: Ein Passwort-Manager macht einzigartige Passwörter bequem.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Sommer2024!
          right: false
          why: Jahreszeit, Jahr, Ausrufezeichen – ein bekanntes Muster.
        - text: korrekt-pferd-batterie-heftklammer
          right: true
        - text: P@ssw0rt
          right: false
          why: Solche Ersetzungen kennt jedes Angriffsprogramm.
        - text: 18 zufällige Zeichen aus dem Passwort-Manager
          right: true
      left: Schwach
      right: Stark

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Passwort aus 10 Kleinbuchstaben hat 26¹⁰ ≈ 1,4 · 10¹⁴ Möglichkeiten. Bei 10 Milliarden Versuchen pro Sekunde: Wie viele Stunden dauert das Durchprobieren? Gerundet."
    params:
      unit: h
    answer:
      value: 4
      tolerance: 0.3
    hints:
      - "1,4 · 10¹⁴ : 10¹⁰ = 14 000 Sekunden."
    explanation: Knapp 4 Stunden. Mit 14 Buchstaben wären es über 200 Jahre.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: choice
    prompt: "Was hat mehr Kombinationen: 8 Zeichen aus 94 möglichen oder 12 Kleinbuchstaben?"
    params:
      options:
        - label: 12 Kleinbuchstaben
          correct: true
        - label: 8 Zeichen aus 94
          feedback: $94^8$ ≈ 6 · $10^{15}$, $26^{12}$ ≈ 9,5 · $10^{16}$.
        - label: Beide gleich viele
          feedback: Rechne beide Potenzen aus.
    hints:
      - Vergleiche $94^8$ mit $26^{12}$.
      - Die Länge steht im Exponenten.
    explanation: $26^{12}$ ist rund 15-mal größer als $94^8$. Vier Zeichen mehr schlagen alle Sonderzeichen.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: "Eine **Passphrase** aus mehreren zufälligen Wörtern ist lang und trotzdem leicht zu merken. Entscheidend ist der Zufall: Ein bekanntes Zitat ist schnell erraten, egal wie lang es ist."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Sechs Wörter, ausgewürfelt aus einer Liste mit 7776 Wörtern. Jedes bringt etwa 12,9 Bit. Wie viele Bit sind es zusammen? Runde auf eine Stelle.
    params:
      unit: Bit
    answer:
      value: 77.4
      tolerance: 0.5
    hints:
      - 7776 = $6^5$ – fünf Würfelwürfe pro Wort.
      - 6 · 12,9.
    explanation: 6 · 12,9 ≈ 77 Bit. Das ist etwa so viel wie ein Zufallspasswort aus 12 beliebigen Tastaturzeichen.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: Ein Dienst wird gehackt. Angreifer probieren die erbeuteten Paare aus E-Mail und Passwort bei vielen anderen Diensten. Wie heißt das?
    params:
      options:
        - label: Credential Stuffing
          correct: true
        - label: Phishing
          feedback: Beim Phishing gibt das Opfer sein Passwort selbst preis.
        - label: Brute Force
          feedback: Hier wird nicht geraten – die Passwörter sind schon bekannt.
    hints:
      - Die Angreifer müssen nichts raten.
      - Sie nutzen aus, dass Menschen Passwörter wiederverwenden.
    explanation: "Gegen Credential Stuffing hilft nur: für jeden Dienst ein eigenes Passwort, am besten aus einem Passwort-Manager."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Früher hieß es: Passwort alle 90 Tage ändern. Heute raten Fachleute davon ab. Warum?"
    params:
      options:
        - label: Menschen wählen dann schwache, vorhersehbare Varianten wie Sommer1, Sommer2
          correct: true
        - label: Ändern ist technisch riskant
          feedback: Technisch ist es harmlos – das Problem ist der Mensch.
        - label: Passwörter werden mit der Zeit sicherer
          feedback: Sie werden weder sicherer noch unsicherer.
    hints:
      - Was tust du, wenn du dir ständig Neues merken musst?
    explanation: Gute Sicherheit rechnet mit menschlichem Verhalten. Ändern nur bei Verdacht – dafür lang und einzigartig.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Ein Login erlaubt 10 Versuche pro Minute. Wie viele Tage braucht ein Angreifer, um alle 6-stelligen PINs durchzuprobieren? Runde auf eine Stelle.
    params:
      unit: Tage
    answer:
      value: 69.4
      tolerance: 0.1
    hints:
      - Es gibt $10^6$ PINs, also $10^5$ Minuten.
      - Ein Tag hat 1440 Minuten.
    explanation: 100 000 / 1440 ≈ 69,4 Tage – und echte Dienste sperren schon nach wenigen Fehlversuchen.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Warum ist Raten online viel weniger gefährlich als offline?
    params:
      options:
        - label: Online bremst der Server, offline rechnet der Angreifer ungebremst auf eigener Hardware
          correct: true
        - label: Online ist das Passwort länger
          feedback: Das Passwort ist dasselbe.
        - label: Offline gibt es keine Passwörter
          feedback: "Offline heißt: mit einer gestohlenen Hash-Datenbank."
    hints:
      - Wer begrenzt die Versuche pro Sekunde?
      - Mit einer gestohlenen Datenbank fragt niemand mehr den Server.
    explanation: Online vielleicht 10 Versuche pro Minute, offline Milliarden pro Sekunde. Darum müssen gespeicherte Passwörter langsam gehasht werden.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein starkes Passwort ausmacht.
    params:
      keywords:
        - - lang
          - länge
          - long
          - length
        - - zufäll
          - random
        - - einzigartig
          - nur einmal
          - unique
          - eigenes
          - own
          - different
      sample: "Ein starkes Passwort ist lang und zufällig gewählt, etwa vier zufällige Wörter. Und es ist einzigartig: Für jeden Dienst ein eigenes, damit ein Datenleck nicht alle Konten öffnet."
    difficulty: 3

srs:
  cards_from: [staerker, wiederverwenden]
