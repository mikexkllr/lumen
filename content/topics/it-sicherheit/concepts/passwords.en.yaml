id: cs.security.passwords
type: concept
title: Strong passwords
summary: Length beats special characters.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: zeichen
    widget: numeric
    prompt: A password is made of lowercase letters (26 options per character). How many times more combinations does one extra character give?
    params: { unit: "times" }
    answer: { value: 26 }
    hints:
      - Each position has 26 options.
    explanation: Each character multiplies by 26. Length grows exponentially.

  - kind: explain
    id: s2
    body: |
      Attackers test billions of passwords per second. Known patterns like "Password1!" come first. **Long, random** passwords are the strongest, such as four random words.

  - kind: problem
    id: staerker
    widget: buckets
    prompt: Strong or weak?
    params:
      buckets: [{ label: strong }, { label: weak }]
      items:
        - { label: "Table-Cloud-Lamp-Mustard", bucket: strong }
        - { label: Random string of 16 characters, bucket: strong }
        - { label: "P@ssw0rd1", bucket: weak }
        - { label: Pet's name plus 2024, bucket: weak }
    hints:
      - Is it on a list of popular passwords, or can it be guessed?
    explanation: Attackers have long known swapped letters like @ for a.

  - kind: problem
    id: wiederverwenden
    widget: choice
    prompt: Why is it dangerous to use the same password everywhere?
    params:
      options:
        - { label: "If one service is hacked, attackers try it everywhere.", correct: true }
        - { label: It is easier to forget., feedback: "Quite the opposite. The risk is the chain reaction." }
    hints:
      - What happens to leaked passwords?
    explanation: A password manager makes unique passwords convenient.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Summer2024!
          right: false
          why: Season, year, exclamation mark – a well-known pattern.
        - text: correct-horse-battery-staple
          right: true
        - text: P@ssw0rd
          right: false
          why: Every cracking tool knows such substitutions.
        - text: 18 random characters from a password manager
          right: true
      left: Weak
      right: Strong

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A password of 10 lower-case letters has 26¹⁰ ≈ 1.4 · 10¹⁴ possibilities. At 10 billion tries per second: how many hours does trying them all take? Rounded."
    params:
      unit: h
    answer:
      value: 4
      tolerance: 0.3
    hints:
      - 1.4 · 10¹⁴ ÷ 10¹⁰ = 14,000 seconds.
    explanation: Just under 4 hours. With 14 letters it would be over 200 years.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: choice
    prompt: "What has more combinations: 8 characters from 94 options or 12 lowercase letters?"
    params:
      options:
        - label: 12 lowercase letters
          correct: true
        - label: 8 characters from 94
          feedback: $94^8$ ≈ 6 · $10^{15}$, $26^{12}$ ≈ 9.5 · $10^{16}$.
        - label: Both the same
          feedback: Work out both powers.
    hints:
      - Compare $94^8$ with $26^{12}$.
      - The length sits in the exponent.
    explanation: $26^{12}$ is about 15 times larger than $94^8$. Four more characters beat all the special characters.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: "A **passphrase** of several random words is long and still easy to remember. Randomness is what matters: a famous quote is guessed quickly, however long it is."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Six words, rolled with dice from a list of 7776 words. Each adds about 12.9 bits. How many bits in total? Round to one decimal.
    params:
      unit: Bit
    answer:
      value: 77.4
      tolerance: 0.5
    hints:
      - 7776 = $6^5$ – five dice rolls per word.
      - 6 · 12.9.
    explanation: 6 · 12.9 ≈ 77 bits. That is about as much as a random password of 12 arbitrary keyboard characters.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: A service is hacked. Attackers try the stolen pairs of email and password at many other services. What is this called?
    params:
      options:
        - label: Credential stuffing
          correct: true
        - label: Phishing
          feedback: In phishing the victim hands over the password.
        - label: Brute force
          feedback: No guessing here – the passwords are already known.
    hints:
      - The attackers do not have to guess anything.
      - They exploit people reusing passwords.
    explanation: "Only one thing helps against credential stuffing: a separate password for each service, ideally from a password manager."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "It used to be: change your password every 90 days. Today experts advise against it. Why?"
    params:
      options:
        - label: People then choose weak, predictable variants such as Summer1, Summer2
          correct: true
        - label: Changing is technically risky
          feedback: Technically it is harmless – the problem is the human.
        - label: Passwords get more secure over time
          feedback: They get neither more nor less secure.
    hints:
      - What do you do when you constantly have to remember new ones?
    explanation: Good security accounts for human behaviour. Change only on suspicion – but make it long and unique.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: A login allows 10 attempts per minute. How many days does an attacker need to try all 6-digit PINs? Round to one decimal.
    params:
      unit: days
    answer:
      value: 69.4
      tolerance: 0.1
    hints:
      - There are $10^6$ PINs, so $10^5$ minutes.
      - A day has 1440 minutes.
    explanation: 100,000 / 1440 ≈ 69.4 days – and real services lock out after a few failures.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Why is online guessing much less dangerous than offline guessing?
    params:
      options:
        - label: Online the server slows things down, offline the attacker computes at full speed on their own hardware
          correct: true
        - label: Online the password is longer
          feedback: The password is the same.
        - label: Offline there are no passwords
          feedback: "Offline means: with a stolen hash database."
    hints:
      - Who limits the attempts per second?
      - With a stolen database nobody asks the server any more.
    explanation: Online perhaps 10 attempts per minute, offline billions per second. That is why stored passwords must be hashed slowly.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what makes a password strong.
    params:
      keywords:
        - - lang
          - länge
          - long
          - length
        - - zufäll
          - random
        - - einzigartig
          - nur einmal
          - unique
          - eigenes
          - own
          - different
      sample: "A strong password is long and randomly chosen, like four random words. And it is unique: a different one for each service, so one leak does not open every account."
    difficulty: 3

srs:
  cards_from: [staerker, wiederverwenden]
