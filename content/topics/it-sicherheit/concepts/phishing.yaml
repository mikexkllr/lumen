id: cs.security.phishing
type: concept
title: Phishing erkennen
summary: Wenn eine Nachricht dich ködert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: zeichen
    widget: buckets
    prompt: Warnzeichen oder eher unverdächtig?
    params:
      buckets: [{ label: Warnzeichen }, { label: unverdächtig }]
      items:
        - { label: »Ihr Konto wird in 2 Stunden gesperrt!«, bucket: Warnzeichen }
        - { label: Link zu bank-sicherheit-login.com, bucket: Warnzeichen }
        - { label: Bitte um Passwort per Mail, bucket: Warnzeichen }
        - { label: "Rechnung, die du erwartet hast", bucket: unverdächtig }
    hints:
      - Druck, fremde Adressen, Fragen nach Geheimem.
    explanation: Zeitdruck und Angst sollen dich vom Nachdenken abhalten.

  - kind: explain
    id: s2
    body: |
      **Phishing** ahmt vertraute Absender nach, um an Passwörter oder Geld zu kommen. Echte Banken fragen nie per Mail nach deinem Passwort.

  - kind: problem
    id: tun
    widget: order
    prompt: Eine Mail deiner »Bank« wirkt dringend. Bring die sinnvollen Schritte in Reihenfolge.
    params:
      items:
        - { label: Nicht auf den Link klicken }
        - { label: Die Bank-Website selbst im Browser öffnen }
        - { label: Dort nach Nachrichten schauen oder anrufen }
        - { label: Die Mail als Phishing melden }
    hints:
      - Erst nichts anklicken, dann auf eigenem Weg prüfen.
    explanation: Der eigene Weg zur echten Seite umgeht jede Fälschung.

  - kind: problem
    id: geklickt
    widget: choice
    prompt: Du hast auf einer Phishing-Seite dein Passwort eingegeben. Was tust du zuerst?
    params:
      options:
        - { label: Sofort das Passwort beim echten Dienst ändern, correct: true }
        - { label: "Abwarten, ob etwas passiert", feedback: "Angreifer nutzen Daten oft innerhalb von Minuten." }
    hints:
      - Wie schnell handeln Angreifer?
    explanation: Schnelles Ändern macht die gestohlenen Daten wertlos.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Warnsignal oder unverdächtig?
    params:
      buckets:
        - id: b1
          label: Warnsignal
        - id: b2
          label: Unverdächtig
      items:
        - label: »Sofort handeln, sonst Sperre!«
          bucket: b1
        - label: Link führt zu fremder Adresse
          bucket: b1
        - label: Du tippst die Adresse selbst ein
          bucket: b2
        - label: Mail fragt nach deinem Passwort
          bucket: b1
    hints:
      - Druck, fremde Links und Fragen nach Geheimnissen sind verdächtig.
    explanation: "Im Zweifel: nicht klicken, sondern die Seite selbst aufrufen."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Mail kommt von »service@paypaI.com«. Was ist faul?
    params:
      options:
        - label: Das letzte Zeichen ist ein großes i statt eines kleinen L
          correct: true
        - label: Nichts – die Adresse stimmt
          feedback: "Sieh genau hin: I und l sehen fast gleich aus."
        - label: PayPal verschickt nie E-Mails
          feedback: Doch – aber von der echten Domain.
    hints:
      - Manche Buchstaben sehen in vielen Schriften gleich aus.
    explanation: Solche **Homograph-Angriffe** nutzen ähnlich aussehende Zeichen. Im Zweifel die Adresse selbst eintippen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: swipe
    prompt: Echt oder Fälschung?
    params:
      cards:
        - text: https://www.sparkasse.de.konto-check.info
          right: false
          why: Die Seite gehört konto-check.info.
        - text: https://accounts.google.com
          right: true
          why: Eine Unterseite von google.com.
        - text: https://amaz0n.de
          right: false
          why: Eine Null statt des o.
        - text: https://paypal.com-sicherheit.de
          right: false
          why: Die Domain ist com-sicherheit.de.
        - text: https://login.microsoftonline.com
          right: true
          why: Die echte Anmeldeseite von Microsoft.
      left: Fälschung
      right: echt
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: Ein **Homograph-Angriff** nutzt Zeichen, die gleich aussehen – etwa das kyrillische »а« statt des lateinischen »a«. Für das Auge steht dort apple.com, für den Computer eine ganz andere Adresse.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Eine Mail zeigt den Link »www.bank.de«. Wie siehst du, wohin er wirklich führt?
    params:
      options:
        - label: Mit der Maus darüberfahren oder lange drücken und das echte Ziel lesen
          correct: true
        - label: Der angezeigte Text ist das Ziel
          feedback: Text und Ziel eines Links können völlig verschieden sein.
        - label: Einmal draufklicken und schauen
          feedback: Schon der Klick kann schaden.
    hints:
      - Ein Link hat einen sichtbaren Text und ein verstecktes Ziel.
      - Das Ziel zeigt der Browser, ohne dass du klickst.
    explanation: "Sicherer noch: Nie über Links in Mails anmelden, sondern die Adresse selbst eintippen oder ein Lesezeichen nutzen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "**Spear-Phishing** richtet sich gezielt an eine Person, mit echten Namen und Details. Warum ist es so viel gefährlicher?"
    params:
      options:
        - label: Die üblichen Warnzeichen fehlen – die Nachricht wirkt glaubwürdig und passend
          correct: true
        - label: Es nutzt bessere Schadsoftware
          feedback: Der Unterschied liegt in der Recherche, nicht in der Technik.
        - label: Es kommt immer per Telefon
          feedback: Meist per Mail oder Messenger.
    hints:
      - Woran erkennst du normalerweise eine Phishing-Mail?
    explanation: "Schutz bietet nur ein zweiter Kanal: bei ungewöhnlichen Bitten kurz anrufen und nachfragen."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Warum schützt ein Hardware-Sicherheitsschlüssel gegen Phishing, ein SMS-Code aber nicht?
    params:
      options:
        - label: Der Schlüssel prüft die echte Adresse der Seite und antwortet einer Fälschung gar nicht
          correct: true
        - label: Der Schlüssel ist teurer
          feedback: Der Preis schützt nicht – das Prinzip schon.
        - label: SMS-Codes sind zu kurz
          feedback: Auch ein langer Code ließe sich auf einer Fälschung eintippen.
    hints:
      - Wer tippt den SMS-Code ein – und wo?
      - Den Schlüssel kann man nicht überreden.
    explanation: Den SMS-Code gibt der Mensch auf der Fälschung ein, und die reicht ihn weiter. Der Schlüssel bindet seine Antwort an die echte Domain – auf bank-login.xyz bleibt er stumm.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: "Ein Anruf, angeblich vom Chef: »Bitte sofort 40 000 € überweisen, ganz vertraulich.« Was hilft am besten?"
    params:
      options:
        - label: Über einen bekannten Weg zurückrufen und nachfragen
          correct: true
        - label: Schnell überweisen, der Chef hat es eilig
          feedback: Eile ist genau der Hebel der Betrüger.
        - label: Auf die Stimme achten
          feedback: Stimmen lassen sich heute täuschend echt fälschen.
    hints:
      - Druck, Eile, Geheimhaltung – drei Warnzeichen auf einmal.
      - Prüfe über einen Weg, den der Anrufer nicht kontrolliert.
    explanation: Diese »Chef-Masche« kostet Firmen jährlich Millionen. Feste Regeln wie das Vier-Augen-Prinzip helfen mehr als jedes Bauchgefühl.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Ein Filter erkennt 99 % aller Phishing-Mails. Von 100 000 Mails sind 1000 Phishing. Wie viele Phishing-Mails kommen trotzdem durch?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 1000
        misconception: missed-rate
        text: Gefragt ist, was der Filter verpasst – 1 % davon.
    hints:
      - 1 % der Phishing-Mails rutscht durch.
      - 1 % von 1000.
    explanation: 10 Mails pro 100 000 – bei einer großen Firma sind das täglich einige. Ein einziger Klick reicht. Darum ist Technik allein nie genug.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, woran man Phishing erkennt.
    params:
      keywords:
        - - absender
          - adresse
          - sender
          - address
          - link
          - url
          - domain
        - - dring
          - druck
          - eile
          - urgent
          - pressure
          - hurry
        - - passwort
          - daten
          - password
          - data
          - login
      sample: Phishing will an dein Passwort oder deine Daten. Typisch sind Druck und Eile, etwa »Konto wird gesperrt«. Prüfe den Absender und die echte Adresse hinter jedem Link – stimmt die Domain nicht, ist es Betrug.
    difficulty: 3

srs:
  cards_from: [zeichen, geklickt]
