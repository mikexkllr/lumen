id: bio.metabolism.inhibitor
type: concept
title: "Inhibitors as drugs"
summary: "How to slow enzymes down – and heal with it."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Someone has drunk methanol. Doctors give a drug that stops the liver breaking it down. Why does that help?
    params:
      options:
        - label: Breakdown is what makes methanol toxic. Slowed down, it is excreted harmlessly.
          correct: true
        - label: The drug destroys the methanol.
          feedback: It only slows the enzyme. The methanol stays unchanged.
        - label: It does not help at all.
          feedback: The treatment often saves eyesight and life.
    hints:
      - Methanol is broken down to formic acid.
      - The drug occupies the enzyme.
    explanation: The drug fomepizole – or ethanol in an emergency – blocks the enzyme alcohol dehydrogenase. An inhibitor as an antidote!

  - kind: explain
    id: c1
    body: A **competitive inhibitor** resembles the substrate. It sits in the active site but does not react. So it blocks the spot. With lots of substrate it can be pushed out again.

  - kind: problem
    id: c2
    widget: sim
    prompt: An inhibitor triples the apparent Kₘ to 15 mM. How much substrate does the enzyme now need for 75 % of vₘₐₓ?
    params:
      scene: enzyme
      controls:
        km:
          fixed: true
        inhibitor:
          value: 3
          fixed: true
    answer:
      rate:
        - 75
        - 76
    explanation: "45 mM, three times as much as without the inhibitor. But it works: vₘₐₓ remains reachable."

  - kind: problem
    id: c3
    widget: sim
    prompt: At 10 mM substrate (Kₘ = 5 mM) the enzyme runs at 67 %. Dose the inhibitor so that it drops to 50 %.
    params:
      scene: enzyme
      controls:
        km:
          fixed: true
        substrate:
          value: 10
          fixed: true
        inhibitor:
          fixed: false
    answer:
      rate: 50
    explanation: "Factor 2: the apparent Kₘ rises to 10 mM and matches the substrate. Half the top speed."

  - kind: problem
    id: c4
    widget: buckets
    prompt: Which drug inhibits which target?
    params:
      buckets:
        - id: b1
          label: Enzyme in humans
        - id: b2
          label: Enzyme in the pathogen
      items:
        - label: Statins against cholesterol
          bucket: b1
        - label: Aspirin against pain
          bucket: b1
        - label: Penicillin against bacteria
          bucket: b2
        - label: HIV protease inhibitors
          bucket: b2
    hints:
      - Which drugs kill germs?
      - Statins slow a liver enzyme.
    explanation: Many drugs are inhibitors – against our own enzymes or against those of pathogens.

  - kind: explain
    id: d1
    depth: 2
    body: Some inhibitors bind **irreversibly**, for good. Aspirin attaches a group permanently to its enzyme. Only new enzymes undo the effect. Platelets have no nucleus and make no new ones.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A small dose of aspirin acts on platelets for about as long as they live – around 7 to 10 days. Why?
    params:
      options:
        - label: Without a nucleus they cannot make new enzyme.
          correct: true
        - label: Aspirin stays in the blood for 10 days.
          feedback: Aspirin is broken down within hours. The effect stays anyway.
        - label: Platelets love aspirin.
          feedback: It is about the inability to replace enzymes.
    hints:
      - Where is the blueprint for enzymes kept?
      - "Irreversible means: the old enzyme stays broken."
    explanation: That is why a small daily dose protects some heart patients against blood clots.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A competitive inhibitor raises the apparent Kₘ by a factor of {{f}}. Without inhibitor [S] = Kₘ gives 50 %. How many times as much substrate is now needed for 50 %?
    answer:
      value: "{{f}}"
    hints:
      - 50 % always holds at [S] = apparent Kₘ.
      - The apparent Kₘ is {{f}} times as large.
    explanation: "{{f}} times as much substrate. Competitive means: shifts Kₘ, leaves vₘₐₓ unchanged."
    difficulty: 2
    variants:
      params:
        f: choice[2,3,4,5]
      defaults:
        f: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Another inhibitor binds not in the active site but bends the enzyme from outside. What changes?
    params:
      options:
        - label: vₘₐₓ drops – even lots of substrate cannot bring back full output.
          correct: true
        - label: Only Kₘ rises, as with a competitive inhibitor.
          feedback: It does not compete for the site – more substrate does not help.
        - label: Nothing, the outside does not matter.
          feedback: The shape of the whole protein determines the active site.
    hints:
      - Can substrate displace an inhibitor sitting elsewhere?
      - Some of the enzymes are simply out of action.
    explanation: "That is non-competitive inhibition. Cells often regulate their own pathways this way: the end product slows the first enzyme."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a competitive inhibitor works and why it makes a good drug.
    params:
      keywords:
        - - aktive zentrum
          - aktiven zentrum
          - active site
          - platz
          - spot
        - - ähnelt
          - aehnelt
          - ähnlich
          - aehnlich
          - resembl
          - similar
          - looks like
        - - substrat
          - substrate
        - - medikament
          - gift
          - enzym bremsen
          - drug
          - medicine
          - slow
      sample: A competitive inhibitor resembles the substrate and occupies the active site. That slows the enzyme. Lots of substrate can push it out. Drugs use this to slow one particular enzyme, for example a bacterial one.
    explanation: Plugging one particular lock – the principle behind many drugs.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
