id: bio.metabolism.inhibitor
type: concept
title: "Hemmstoffe als Medikamente"
summary: "Wie man Enzyme bremst – und damit heilt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Bremsklötze für Enzyme
    body: "Viele Medikamente bremsen gezielt ein Enzym. Dreh den **Hemmstoff** hoch: Das Enzym wird langsamer. Gib dann mehr Substrat dazu. Schaffst du es, die Bremse wieder zu überspielen?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: enzyme
        controls:
          inhibitor:
            fixed: false
          km:
            fixed: true

  - kind: problem
    id: hook
    widget: choice
    prompt: Jemand hat Methanol getrunken. Ärzte geben ihm ein Mittel, das die Leber am Abbau hindert. Warum hilft das?
    params:
      options:
        - label: Erst der Abbau macht Methanol giftig. Gebremst wird es harmlos ausgeschieden.
          correct: true
        - label: Das Mittel zerstört das Methanol.
          feedback: Es bremst nur das Enzym. Das Methanol bleibt unverändert.
        - label: Es hilft gar nicht.
          feedback: Die Behandlung rettet oft das Augenlicht und das Leben.
    hints:
      - Methanol wird zu Ameisensäure abgebaut.
      - Das Mittel besetzt das Enzym.
    explanation: Das Mittel Fomepizol – oder notfalls Ethanol – blockiert das Enzym Alkoholdehydrogenase. Ein Hemmstoff als Gegengift!

  - kind: explain
    id: c1
    body: Ein **kompetitiver Hemmstoff** ähnelt dem Substrat. Er setzt sich ins aktive Zentrum, reagiert aber nicht. So blockiert er den Platz. Mit viel Substrat kann man ihn wieder verdrängen.

  - kind: problem
    id: c2
    widget: sim
    prompt: Ein Hemmstoff verdreifacht das wirksame Kₘ auf 15 mM. Wie viel Substrat braucht das Enzym jetzt für 75 % von vₘₐₓ?
    params:
      scene: enzyme
      controls:
        km:
          fixed: true
        inhibitor:
          value: 3
          fixed: true
    answer:
      rate:
        - 75
        - 76
    explanation: "45 mM, dreimal so viel wie ohne Hemmstoff. Aber es geht: vₘₐₓ bleibt erreichbar."

  - kind: problem
    id: c3
    widget: sim
    prompt: Bei 10 mM Substrat (Kₘ = 5 mM) läuft das Enzym mit 67 %. Dosiere den Hemmstoff so, dass es auf 50 % sinkt.
    params:
      scene: enzyme
      controls:
        km:
          fixed: true
        substrate:
          value: 10
          fixed: true
        inhibitor:
          fixed: false
    answer:
      rate: 50
    explanation: "Faktor 2: Das wirksame Kₘ steigt auf 10 mM und gleicht dem Substrat. Halbe Höchstgeschwindigkeit."

  - kind: problem
    id: c4
    widget: buckets
    prompt: Welches Medikament hemmt welches Ziel?
    params:
      buckets:
        - id: b1
          label: Enzym im Menschen
        - id: b2
          label: Enzym im Erreger
      items:
        - label: Statine gegen Cholesterin
          bucket: b1
        - label: Aspirin gegen Schmerz
          bucket: b1
        - label: Penicillin gegen Bakterien
          bucket: b2
        - label: HIV-Proteasehemmer
          bucket: b2
    hints:
      - Welche Mittel töten Keime?
      - Statine bremsen ein Leberenzym.
    explanation: Viele Medikamente sind Hemmstoffe – gegen eigene Enzyme oder gegen die von Erregern.

  - kind: explain
    id: d1
    depth: 2
    body: Manche Hemmstoffe binden **irreversibel**, also für immer. Aspirin hängt eine Gruppe fest an sein Enzym. Erst neue Enzyme heben die Wirkung auf. Blutplättchen haben keinen Kern und bauen keine neuen.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Eine kleine Dosis Aspirin wirkt auf Blutplättchen etwa so lange, wie sie leben – rund 7 bis 10 Tage. Warum?
    params:
      options:
        - label: Ohne Zellkern können sie kein neues Enzym bilden.
          correct: true
        - label: Aspirin bleibt 10 Tage im Blut.
          feedback: Aspirin wird in Stunden abgebaut. Die Wirkung bleibt trotzdem.
        - label: Blutplättchen lieben Aspirin.
          feedback: Es geht um die fehlende Möglichkeit, Enzyme zu ersetzen.
    hints:
      - Wo steht der Bauplan für Enzyme?
      - "Irreversibel heißt: Das alte Enzym bleibt kaputt."
    explanation: Darum schützt eine tägliche kleine Dosis manche Herzpatienten vor Blutgerinnseln.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Ein kompetitiver Hemmstoff erhöht das wirksame Kₘ um den Faktor {{f}}. Ohne Hemmstoff reicht [S] = Kₘ für 50 %. Wievielmal so viel Substrat braucht es jetzt für 50 %?
    answer:
      value: "{{f}}"
    hints:
      - 50 % gilt immer bei [S] = wirksames Kₘ.
      - Das wirksame Kₘ ist {{f}}-mal so groß.
    explanation: "{{f}}-mal so viel Substrat. Kompetitiv heißt: verschiebt Kₘ, lässt vₘₐₓ gleich."
    difficulty: 2
    variants:
      params:
        f: choice[2,3,4,5]
      defaults:
        f: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein anderer Hemmstoff bindet nicht im aktiven Zentrum, sondern verbiegt das Enzym von außen. Was ändert sich?
    params:
      options:
        - label: vₘₐₓ sinkt – auch viel Substrat holt die volle Leistung nicht zurück.
          correct: true
        - label: Nur Kₘ steigt, wie beim kompetitiven Hemmstoff.
          feedback: Hier konkurriert er nicht um den Platz – mehr Substrat hilft nicht.
        - label: Nichts, außen ist egal.
          feedback: Die Form des ganzen Eiweißes bestimmt das aktive Zentrum.
    hints:
      - Kann Substrat einen Hemmstoff verdrängen, der woanders sitzt?
      - Ein Teil der Enzyme ist einfach außer Betrieb.
    explanation: "Das ist nicht-kompetitive Hemmung. So regeln Zellen oft ihre eigenen Stoffwechselwege: Das Endprodukt bremst das erste Enzym."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein kompetitiver Hemmstoff wirkt und warum er als Medikament taugt.
    params:
      keywords:
        - - aktive zentrum
          - aktiven zentrum
          - active site
          - platz
          - spot
        - - ähnelt
          - aehnelt
          - ähnlich
          - aehnlich
          - resembl
          - similar
          - looks like
        - - substrat
          - substrate
        - - medikament
          - gift
          - enzym bremsen
          - drug
          - medicine
          - slow
      sample: Ein kompetitiver Hemmstoff ähnelt dem Substrat und besetzt das aktive Zentrum. So bremst er das Enzym. Viel Substrat kann ihn verdrängen. Medikamente bremsen so gezielt ein Enzym, etwa eines von Bakterien.
    explanation: Gezielt ein Schloss verstopfen – das Prinzip vieler Medikamente.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
