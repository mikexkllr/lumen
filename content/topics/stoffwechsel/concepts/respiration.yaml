id: bio.metabolism.respiration
type: concept
title: "Zellatmung im Detail"
summary: "Glykolyse, Zitronensäurezyklus, Atmungskette und Gärung."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du atmest Sauerstoff ein. Wo landet er am Ende?
    params:
      options:
        - label: In Wasser, das in deinen Mitochondrien entsteht
          correct: true
        - label: Im ausgeatmeten CO₂
          feedback: Der Kohlenstoff im CO₂ stammt aus der Nahrung. Der eingeatmete O₂ wird zu Wasser.
        - label: Er bleibt als Gas im Blut.
          feedback: Er wird verbraucht, nicht gelagert.
    hints:
      - Sauerstoff nimmt am Ende Elektronen auf.
      - O₂ plus Wasserstoff ergibt …
    explanation: O₂ ist der letzte Empfänger in der Atmungskette und wird zu H₂O. Ohne ihn stockt alles.

  - kind: explain
    id: c1
    body: Die Zellatmung läuft in drei Etappen. In der **Glykolyse** wird Zucker im Zellplasma gespalten. Im Zitronensäurezyklus wird der Rest zu CO₂ zerlegt. In der Atmungskette entsteht mit Sauerstoff das meiste ATP.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne die Etappen der Zellatmung.
    params:
      items:
        - label: Glykolyse im Zellplasma
        - label: Zitronensäurezyklus im Mitochondrium
        - label: Atmungskette an der inneren Membran
    hints:
      - Zucker wird zuerst außerhalb der Mitochondrien gespalten.
      - Am Schluss braucht es Sauerstoff.
    explanation: "Spalten, zerlegen, ernten: Die letzte Etappe liefert rund 90 % des ATP."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Mit Sauerstoff liefert ein Zucker etwa 32 ATP, ohne nur 2. Wievielmal so viel ATP bringt die Atmung?
    answer:
      value: 16
    feedback:
      - when: numval(state.input) == 30
        misconception: difference
        text: Das ist der Unterschied. Gefragt ist das Verhältnis.
    hints:
      - Teile die beiden Zahlen.
      - "32 : 2"
    explanation: 16-mal so viel. Darum sind wir auf Sauerstoff angewiesen.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Wo läuft das ab?
    params:
      buckets:
        - id: b1
          label: Zellplasma
        - id: b2
          label: Mitochondrium
      items:
        - label: Glykolyse
          bucket: b1
        - label: Milchsäuregärung
          bucket: b1
        - label: Zitronensäurezyklus
          bucket: b2
        - label: Atmungskette
          bucket: b2
        - label: O₂ wird zu Wasser
          bucket: b2
    hints:
      - Was ohne Sauerstoff geht, läuft draußen.
      - Die Mitochondrien sind die Kraftwerke.
    explanation: Glykolyse und Gärung brauchen kein Mitochondrium. Alles mit Sauerstoff läuft darin.

  - kind: explain
    id: d1
    depth: 2
    body: Ohne Sauerstoff hilft die **Gärung**. Muskeln machen aus Zucker Milchsäure, Hefe macht Alkohol und CO₂. Dabei entstehen nur 2 ATP pro Zucker. Dafür geht es schnell und ohne O₂.

  - kind: problem
    id: d2
    depth: 2
    widget: match
    prompt: Was passiert wo?
    params:
      pairs:
        - left: Hefe im Brotteig
          right: CO₂ lässt ihn aufgehen
        - left: Hefe im Traubensaft
          right: Alkohol entsteht
        - left: Muskel beim Sprint
          right: Milchsäure entsteht
        - left: Muskel beim Wandern
          right: Zellatmung mit O₂
    hints:
      - Hefe macht Alkohol und CO₂.
      - Bei langsamer Belastung reicht der Sauerstoff.
    explanation: Gärung ist der Notgenerator. Die Zellatmung ist das große Kraftwerk.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Ein Muskel braucht pro Minute {{n}} ATP. Wie viele Zucker verbraucht er pro Minute mit Gärung (2 ATP pro Zucker) mehr als mit Atmung (32 ATP)?
    answer:
      value: "{{n / 2 - n / 32}}"
    hints:
      - "Gärung: {{n}} : 2. Atmung: {{n}} : 32."
      - "{{n / 2}} − {{n / 32}}"
    explanation: "{{n / 2}} statt {{n / 32}} Zucker: {{n / 2 - n / 32}} mehr. Gärung verschwendet Vorräte."
    difficulty: 2
    variants:
      params:
        n: choice[320,640,960]
      defaults:
        n: 640

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Cyanid blockiert das letzte Enzym der Atmungskette. Warum ist es so schnell tödlich, obwohl Blut genug Sauerstoff hat?
    params:
      options:
        - label: Die Zellen können den Sauerstoff nicht mehr nutzen. Herz und Gehirn bekommen kaum ATP.
          correct: true
        - label: Es zerstört die roten Blutkörperchen.
          feedback: Das Blut bleibt sogar sauerstoffreich und hellrot.
        - label: Es verstopft die Lunge.
          feedback: Die Atmung in der Lunge funktioniert, die in der Zelle nicht.
    hints:
      - Wo wird Sauerstoff wirklich verbraucht?
      - Gärung allein reicht nicht für Herz und Gehirn.
    explanation: "Cyanid hemmt die Cytochrom-c-Oxidase. Das zeigt: Atmen heißt am Ende Zellatmung."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Zelle aus Zucker Energie gewinnt – mit und ohne Sauerstoff.
    params:
      keywords:
        - - glykolyse
          - glycolysis
        - - mitochond
        - - sauerstoff
          - oxygen
          - o2
          - o₂
        - - gärung
          - gaerung
          - ferment
          - milchsäure
          - milchsaeure
          - lactic
        - - atp
      sample: In der Glykolyse wird Zucker gespalten, das gibt 2 ATP. Mit Sauerstoff geht es in den Mitochondrien weiter, und es entstehen etwa 32 ATP. Ohne Sauerstoff bleibt nur die Gärung, etwa zu Milchsäure.
    explanation: Sauerstoff macht den Unterschied zwischen 2 und rund 32 ATP.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
