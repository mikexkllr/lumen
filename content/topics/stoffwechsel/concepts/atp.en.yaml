id: bio.metabolism.atp
type: concept
title: "ATP, the energy currency"
summary: "How cells store and spend energy."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The cell's battery
    body: Every movement, every thought costs energy. Your cells pay for it with a single coin. Uncover how it is spent and recharged. Its name is **ATP**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🔋
            front: "ATP: fully charged"
            back: Three phosphate groups hang on it – like a loaded spring.
          - icon: ⚡
            front: Spend
            back: The cell splits off one group. The energy released drives muscles and pumps.
          - icon: 📉
            front: "ADP: almost empty"
            back: What is left is ADP with only two phosphate groups.
          - icon: 🍞
            front: Recharge
            back: Using energy from your food, the cell attaches the group again.

  - kind: problem
    id: hook
    widget: estimate
    prompt: Your cells build up and break down ATP every day. Roughly how many kilograms of ATP does an adult turn over per day?
    params:
      min: 0.01
      max: 1000
      scale: log
      unit: kg
    answer:
      value: 50
      within: 60
    explanation: About your own body weight! The stock is small – so each ATP is recycled many hundreds of times a day.

  - kind: explain
    id: c1
    body: "**ATP** stands for adenosine triphosphate. It carries three phosphate groups. When the cell splits one off, energy is released. What remains is ADP. With energy from food it becomes ATP again."

  - kind: problem
    id: c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: ATP gives up a [[phosphate group]] and becomes [[ADP]]. This releases [[energy]].
      distractors:
        - glucose
        - DNA
        - heat
    explanation: ATP is like a charged battery, ADP like an empty one.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Does this cost ATP?
    params:
      buckets:
        - id: b1
          label: costs ATP
        - id: b2
          label: costs no ATP
      items:
        - label: Muscle contracts
          bucket: b1
        - label: Na⁺–K⁺ pump works
          bucket: b1
        - label: Cell builds a protein
          bucket: b1
        - label: O₂ diffuses into the blood
          bucket: b2
        - label: Water flows by osmosis
          bucket: b2
    hints:
      - Does it happen by itself, with the gradient?
      - Building, moving and pumping cost energy.
    explanation: Everything that creates order or movement costs ATP. Diffusion and osmosis run by themselves.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why do cells use ATP instead of burning sugar directly everywhere?
    params:
      options:
        - label: ATP delivers small, handy portions that can be used anywhere in the cell.
          correct: true
        - label: Sugar contains no energy.
          feedback: Sugar contains a lot of energy – too much at once.
        - label: ATP is cheaper than sugar.
          feedback: ATP is made using sugar energy in the first place.
    hints:
      - Think of small change versus a big banknote.
      - One sugar is exchanged for many ATP.
    explanation: ATP is the cell’s small change. One sugar yields about 30 ATP.

  - kind: explain
    id: d1
    depth: 2
    body: Many reactions in the cell do not run by themselves. The cell **couples** them to the splitting of ATP. The free energy of ATP drags the difficult reaction along.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Splitting ATP releases about 30 kJ per mole. A reaction needs {{e}} kJ per mole. At least how many ATP must be coupled to it?
    answer:
      value: "{{ceil(e / 30)}}"
    feedback:
      - when: numval(state.input) == e / 30 && !isInt(e / 30)
        misconception: no-ceil
        text: There are no half ATP. Round up.
    hints:
      - Divide {{e}} by 30.
      - Round up, because it must be enough.
    explanation: "{{e}} ÷ 30 rounded up = {{ceil(e / 30)}} ATP."
    difficulty: 2
    variants:
      params:
        e: choice[20,45,50,80,100]
      defaults:
        e: 50

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A sprinter’s muscles hold ATP for only about 2 to 3 seconds. How does he still run flat out for 10 seconds?
    params:
      options:
        - label: Creatine phosphate recharges ADP to ATP in a flash.
          correct: true
        - label: He runs on without energy.
          feedback: No muscle contracts without ATP.
        - label: He breathes so fast that fat burns.
          feedback: Fat supplies energy far too slowly for a sprint.
    hints:
      - There is a fast backup store.
      - It hands its phosphate group to ADP.
    explanation: "First creatine phosphate, then lactic fermentation, finally respiration: muscles have three gears."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A poison uncouples the mitochondria: they burn sugar but make hardly any ATP. What happens?"
    params:
      options:
        - label: The energy turns into heat – the body overheats while the cells starve.
          correct: true
        - label: You get stronger.
          feedback: Without ATP the cells lack energy.
        - label: Nothing, sugar is enough.
          feedback: The cell can only use sugar energy via ATP.
    hints:
      - Energy does not vanish.
      - If it does not go into ATP, where does it go?
    explanation: The diet drug DNP worked this way and caused deaths. Brown fat, by contrast, uses uncoupling deliberately to produce heat.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why ATP is called the cell’s energy currency.
    params:
      keywords:
        - - atp
        - - adp
        - - phosphat
          - phosphate
        - - energie
          - energy
        - - recycel
          - wieder aufgeladen
          - aufladen
          - recycl
          - recharg
      sample: ATP gives up a phosphate group and becomes ADP. This releases energy that drives muscles, pumps and building work. Energy from sugar recharges ADP back to ATP – constant recycling.
    explanation: One currency for every expense, constantly re-earned.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
