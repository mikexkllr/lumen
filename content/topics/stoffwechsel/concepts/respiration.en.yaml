id: bio.metabolism.respiration
type: concept
title: "Cellular respiration in detail"
summary: "Glycolysis, citric acid cycle, respiratory chain and fermentation."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Fire without a flame
    body: In your cells, a fire without a flame burns around the clock. It turns sugar into energy. Uncover the cards and discover surprising sides of **cellular respiration**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 👶
            front: Babies with heating
            back: Babies have brown fat. There, the energy from sugar turns straight into heat.
          - icon: 🏃
            front: Sore muscles?
            back: For a long time lactic acid got the blame. But tiny tears in the muscle are the cause.
          - icon: 🏭
            front: Thousands of power plants
            back: A single heart muscle cell contains thousands of mitochondria.

  - kind: problem
    id: hook
    widget: choice
    prompt: You breathe in oxygen. Where does it end up?
    params:
      options:
        - label: In water formed in your mitochondria
          correct: true
        - label: In the CO₂ you breathe out
          feedback: The carbon in CO₂ comes from food. The inhaled O₂ becomes water.
        - label: It stays as gas in the blood.
          feedback: It is used up, not stored.
    hints:
      - At the end oxygen accepts electrons.
      - O₂ plus hydrogen gives …
    explanation: O₂ is the final acceptor in the respiratory chain and becomes H₂O. Without it everything stalls.

  - kind: explain
    id: c1
    body: Cellular respiration runs in three stages. In **glycolysis** sugar is split in the cytoplasm. In the citric acid cycle the rest is broken down to CO₂. In the respiratory chain most ATP is made using oxygen.

  - kind: problem
    id: c2
    widget: order
    prompt: Order the stages of cellular respiration.
    params:
      items:
        - label: Glycolysis in the cytoplasm
        - label: Citric acid cycle in the mitochondrion
        - label: Respiratory chain on the inner membrane
    hints:
      - Sugar is first split outside the mitochondria.
      - Oxygen is needed at the end.
    explanation: "Split, break down, harvest: the last stage supplies about 90 % of the ATP."

  - kind: problem
    id: c3
    widget: numeric
    prompt: With oxygen one sugar yields about 32 ATP, without only 2. How many times more ATP does respiration deliver?
    answer:
      value: 16
    feedback:
      - when: numval(state.input) == 30
        misconception: difference
        text: That is the difference. The question asks for the ratio.
    hints:
      - Divide the two numbers.
      - 32 ÷ 2
    explanation: 16 times as much. That is why we depend on oxygen.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Where does this happen?
    params:
      buckets:
        - id: b1
          label: Cytoplasm
        - id: b2
          label: Mitochondrion
      items:
        - label: Glycolysis
          bucket: b1
        - label: Lactic fermentation
          bucket: b1
        - label: Citric acid cycle
          bucket: b2
        - label: Respiratory chain
          bucket: b2
        - label: O₂ becomes water
          bucket: b2
    hints:
      - What works without oxygen runs outside.
      - The mitochondria are the power plants.
    explanation: Glycolysis and fermentation need no mitochondrion. Everything involving oxygen happens inside it.

  - kind: explain
    id: d1
    depth: 2
    body: Without oxygen **fermentation** helps out. Muscles turn sugar into lactic acid, yeast makes alcohol and CO₂. This yields only 2 ATP per sugar. But it is fast and needs no O₂.

  - kind: problem
    id: d2
    depth: 2
    widget: match
    prompt: What happens where?
    params:
      pairs:
        - left: Yeast in bread dough
          right: CO₂ makes it rise
        - left: Yeast in grape juice
          right: Alcohol forms
        - left: Muscle in a sprint
          right: Lactic acid forms
        - left: Muscle on a hike
          right: Respiration with O₂
    hints:
      - Yeast makes alcohol and CO₂.
      - With slow effort there is enough oxygen.
    explanation: Fermentation is the emergency generator. Respiration is the big power plant.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A muscle needs {{n}} ATP per minute. How many more sugars per minute does it use with fermentation (2 ATP per sugar) than with respiration (32 ATP)?
    answer:
      value: "{{n / 2 - n / 32}}"
    hints:
      - "Fermentation: {{n}} ÷ 2. Respiration: {{n}} ÷ 32."
      - "{{n / 2}} − {{n / 32}}"
    explanation: "{{n / 2}} instead of {{n / 32}} sugars: {{n / 2 - n / 32}} more. Fermentation wastes reserves."
    difficulty: 2
    variants:
      params:
        n: choice[320,640,960]
      defaults:
        n: 640

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Cyanide blocks the last enzyme of the respiratory chain. Why is it so quickly fatal, even though the blood has plenty of oxygen?
    params:
      options:
        - label: The cells can no longer use the oxygen. Heart and brain get hardly any ATP.
          correct: true
        - label: It destroys the red blood cells.
          feedback: The blood even stays oxygen-rich and bright red.
        - label: It clogs the lungs.
          feedback: Breathing in the lungs works; respiration in the cells does not.
    hints:
      - Where is oxygen actually used?
      - Fermentation alone is not enough for heart and brain.
    explanation: "Cyanide inhibits cytochrome c oxidase. That shows: breathing ultimately means cellular respiration."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a cell gets energy from sugar – with and without oxygen.
    params:
      keywords:
        - - glykolyse
          - glycolysis
        - - mitochond
        - - sauerstoff
          - oxygen
          - o2
          - o₂
        - - gärung
          - gaerung
          - ferment
          - milchsäure
          - milchsaeure
          - lactic
        - - atp
      sample: In glycolysis sugar is split, giving 2 ATP. With oxygen it continues in the mitochondria and about 32 ATP are made. Without oxygen only fermentation remains, for example to lactic acid.
    explanation: Oxygen makes the difference between 2 and about 32 ATP.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
