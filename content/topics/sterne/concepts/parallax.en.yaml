id: sci.astro.parallax
type: concept
title: "Light-years and parallax"
summary: "Using Earth's orbit as a measuring stick to the stars – and beyond with standard candles."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Hold a thumb in front of your face and close your left and right eye in turn. What happens?
    params:
      options:
        - label: The thumb jumps back and forth against the background.
          correct: true
        - label: Nothing – the thumb stays put.
          feedback: Try it! Each eye looks from a different place.
        - label: The background jumps more than the thumb.
          feedback: Near things jump more than distant ones.
    hints:
      - Your eyes are a few centimetres apart.
      - The closer the thumb, the bigger the jump.
    explanation: This jump is called parallax. The wider apart the eyes and the closer the object, the more it jumps.

  - kind: explain
    id: c1
    body: Astronomers use Earth's orbit as a giant distance between eyes. Half a year apart, a nearby star seems to shift against the distant stars. From this angle, the **parallax**, its distance follows.

  - kind: problem
    id: c2
    widget: numeric
    prompt: A star has a parallax of {{p}} arcseconds. Its distance in parsecs is 1 ÷ parallax. How far away is it?
    params:
      unit: pc
    answer:
      value: "{{1 / p}}"
    feedback:
      - when: abs(numval(state.input) - p) < 0.001
        misconception: not-reciprocal
        text: A small angle means a **large** distance. Take the reciprocal.
    hints:
      - d = 1 ÷ p.
      - 1 ÷ {{p}} = ?
    explanation: d = 1 ÷ {{p}} = {{1 / p}} pc. Half the parallax means twice the distance.
    variants:
      params:
        p: choice[0.1,0.2,0.5]
      defaults:
        p: 0.2

  - kind: problem
    id: c3
    widget: numeric
    prompt: 1 parsec is 3.26 light-years. Proxima Centauri is 1.30 pc away. How many light-years is that? To two decimals.
    params:
      unit: ly
    answer:
      value: 4.24
      tolerance: 0.02
    hints:
      - Parsecs times 3.26.
      - 1.30 · 3.26 = ?
    explanation: About 4.24 light-years – the nearest star after the Sun. Even its parallax is less than one arcsecond.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why can distant galaxies not be measured with parallax?
    params:
      options:
        - label: Their angle would be far too small to measure.
          correct: true
        - label: Galaxies move too fast.
          feedback: The motion is not the problem. The huge distance is.
        - label: Galaxies are too faint.
          feedback: Bright galaxies are easy to see. Their angle still stays tiny.
    hints:
      - The farther away, the smaller the parallax.
      - Andromeda is a million times farther than Proxima.
    explanation: "For the Andromeda galaxy the parallax would be about a millionth of an arcsecond. That needs other methods: standard candles."

  - kind: explain
    id: d1
    depth: 2
    body: "One arcsecond is 1/3600 of a degree, so 1/206,265 of a radian. A star at distance d sees Earth's orbital radius at the angle p: $p = \\frac{1\\,\\text{AU}}{d}$. At p = 1″, d is exactly one **parsec**."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A parsec is the distance from which 1 AU appears at an angle of 1/206,265 radian. How many AU is 1 parsec?
    params:
      unit: AU
    answer:
      value: 206265
      tolerance: 1
    hints:
      - "Small angle: angle = base ÷ distance."
      - Distance = 1 AU ÷ (1/206,265).
    explanation: 206,265 AU – about 31 trillion km. The unit is built straight from the measuring method.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: The Gaia satellite still measures parallaxes of 0.0002″ reliably. How many light-years away is a star with this parallax? 1 pc = 3.26 ly. To the nearest hundred.
    params:
      unit: ly
    answer:
      value: 16300
      tolerance: 100
    hints:
      - 1 ÷ 0.0002 = 5000 pc.
      - 5000 · 3.26 = ?
    explanation: About 16,300 light-years – a large part of our Milky Way. Gaia has measured over a billion stars this way.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Farther out, **standard candles** help: objects whose true luminosity is known. Their apparent brightness falls with the square of distance. Comparing the two gives the distance."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Two stars are truly equally luminous. The second appears 100 times fainter. How many times farther away is it?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 100
        misconception: not-root
        text: Brightness falls with the **square** of the distance. Take the square root.
    hints:
      - Brightness ∝ 1 ÷ d².
      - √100 = ?
    explanation: Ten times as far. With Cepheids and type Ia supernovae distances of up to billions of light-years are measured this way.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: In 1912 Henrietta Leavitt found that the more luminous a Cepheid star truly is, the slower it pulses. Why is that so valuable?
    params:
      options:
        - label: The period gives the true luminosity – and comparing with brightness gives the distance.
          correct: true
        - label: It reveals the star's age.
          feedback: Age does not follow directly. It is about luminosity.
        - label: Cepheids show whether a planet orbits them.
          feedback: Planets are found differently. Cepheids serve as a measuring stick.
    hints:
      - The period is easy to measure – even very far away.
      - Whoever knows the true luminosity has a standard candle.
    explanation: Using Leavitt's law, Hubble showed in 1924 that Andromeda lies far outside the Milky Way. Suddenly the universe was full of galaxies.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how the distance to a nearby star is measured.
    params:
      keywords:
        - - parallax
          - winkel
          - angle
        - - erdbahn
          - orbit
          - halbjahr
          - half a year
          - sonne
          - sun
        - - verschieb
          - shift
          - wander
          - hintergrund
          - background
      sample: You photograph the star half a year apart, from two sides of Earth's orbit. It seems to shift against the background. From this small angle and the orbit radius you work out the distance.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "x2"]
