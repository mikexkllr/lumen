id: sci.astro.endings
type: concept
title: "Weiße Zwerge, Neutronensterne, Schwarze Löcher"
summary: "Was von Sternen übrig bleibt – je nach Masse."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Kein Entkommen
    body: "Aus einem Schwarzen Loch entkommt nicht einmal Licht. Auch die Erde hält fest, was zu langsam ist. Gib dem Satelliten Tempo: Ab wann fliegt er für immer davon? Das ist das **Fluchttempo**."
    visual:
      widget: sim
      interactive: true
      params:
        scene: orbit

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Teelöffel Neutronenstern-Materie (5 ml) – wie viele Tonnen wiegt er?"
    params:
      min: 1
      max: 1000000000000000
      scale: log
    answer:
      value: 2000000000
      within: 80
    explanation: Rund 2 Milliarden Tonnen. Im Neutronenstern sind Atomkerne so dicht gepackt wie in einem einzigen riesigen Kern.

  - kind: explain
    id: c1
    body: Wie ein Stern endet, hängt von seiner Masse ab. Leichte Sterne wie die Sonne werden Weiße Zwerge. Schwere Sterne explodieren als **Supernova**. Ihr Kern wird zum Neutronenstern oder zum Schwarzen Loch.

  - kind: problem
    id: c2
    widget: match
    prompt: Was passt zusammen?
    params:
      pairs:
        - left: Weißer Zwerg
          right: so groß wie die Erde
        - left: Neutronenstern
          right: so groß wie eine Stadt
        - left: Schwarzes Loch
          right: nicht einmal Licht entkommt
        - left: Supernova
          right: heller als eine Galaxie
    hints:
      - Je dichter der Rest, desto kleiner.
      - Die Explosion selbst ist für Wochen extrem hell.
    explanation: Ein Weißer Zwerg packt eine Sonnenmasse auf Erdgröße, ein Neutronenstern auf 20 km Durchmesser. Ein Schwarzes Loch ist noch kompakter.

  - kind: problem
    id: c3
    widget: choice
    prompt: Wird die Sonne einmal zu einem Schwarzen Loch?
    params:
      options:
        - label: Nein – dafür ist sie zu leicht. Sie endet als Weißer Zwerg.
          correct: true
        - label: Ja, jeder Stern endet so.
          feedback: Nur sehr schwere Sterne enden als Schwarzes Loch.
        - label: Ja, in einer Supernova.
          feedback: Sterne wie die Sonne explodieren nicht. Sie stoßen ihre Hülle sanft ab.
    hints:
      - Ab etwa 8 Sonnenmassen gibt es eine Supernova.
      - Die Sonne hat genau eine Sonnenmasse.
    explanation: Die Sonne wird zum Roten Riesen, stößt ihre Hülle als Nebel ab, und ihr Kern bleibt als Weißer Zwerg zurück, der über Milliarden Jahre auskühlt.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Der Radius eines Schwarzen Lochs ist etwa 3 km pro Sonnenmasse. Im Zentrum der Milchstraße sitzt eins mit 4 Millionen Sonnenmassen. Wie groß ist sein Radius – in Millionen km?
    params:
      unit: Mio. km
    answer:
      value: 12
    hints:
      - 4 000 000 · 3 km = ?
      - "In Millionen km: 12 000 000 km."
    explanation: Etwa 12 Millionen km – kleiner als die Bahn des Merkur. 2022 wurde sein Schatten fotografiert.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: Der Satellit startet 4 Erdradien vom Erdmittelpunkt entfernt. Finde das kleinste Tempo, mit dem er der Erde für immer entkommt.
    params:
      scene: orbit
      controls:
        radius:
          value: 4
          fixed: true
    answer:
      kind: 1
      speed:
        - 5.55
        - 5.65
    hints:
      - Unter dem Fluchttempo kehrt er immer zurück.
      - Steigere das Tempo in kleinen Schritten, bis die Bahn offen bleibt.
    explanation: Bei 5,6 km/s entkommt er. Weiter draußen zieht die Erde schwächer, das Fluchttempo sinkt. Am Rand eines Schwarzen Lochs erreicht es die Lichtgeschwindigkeit.

  - kind: explain
    id: d1
    depth: 2
    body: Ein Weißer Zwerg wird nicht von Hitze getragen, sondern vom Gegendruck dicht gepackter Elektronen. Über etwa 1,4 Sonnenmassen reicht der nicht mehr – das ist die **Chandrasekhar-Grenze**. Darüber stürzt der Rest weiter zusammen.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Weißer Zwerg hat die Masse der Sonne, aber nur den Radius der Erde. Die Sonne ist 109-mal so breit wie die Erde. Wievielmal stärker ist die Schwerkraft an seiner Oberfläche als an der Sonnenoberfläche?
    answer:
      value: 11881
      tolerance: 100
    feedback:
      - when: numval(state.input) == 109
        misconception: not-squared
        text: "Die Schwerkraft wächst mit 1 : r². 109-mal kleiner heißt 109²-mal stärker."
    hints:
      - "Gleiche Masse, also g ∝ 1 : r²."
      - 109² = ?
    explanation: Rund 12 000-mal stärker. Ein Mensch würde dort einige tausend Tonnen wiegen.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Woher stammt wahrscheinlich ein großer Teil des Goldes in deinem Ring?
    params:
      options:
        - label: Aus der Verschmelzung von Neutronensternen.
          correct: true
        - label: Aus der Kernfusion in der Sonne.
          feedback: Die Sonne macht nur Helium. Sterne fusionieren höchstens bis Eisen.
        - label: Es entstand beim Urknall.
          feedback: Der Urknall erzeugte fast nur Wasserstoff und Helium.
    hints:
      - Schwerer als Eisen geht nur mit vielen eingefangenen Neutronen.
      - Wo gibt es extrem viele freie Neutronen?
    explanation: 2017 sah man zwei verschmelzende Neutronensterne – in Gravitationswellen und Licht. Dabei entstanden Elemente wie Gold und Platin. Wir tragen Sternenstaub.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Die Fluchtgeschwindigkeit ist $v = \sqrt{2GM/r}$. Erreicht sie c, kann nichts mehr entkommen. Das passiert beim **Schwarzschild-Radius** $r_s = \frac{2GM}{c^2}$, dem Ereignishorizont.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: "Ein Neutronenstern hat 1,4 Sonnenmassen und 12 km Radius. Sein Schwarzschild-Radius wäre 4,2 km. Wie groß ist seine Fluchtgeschwindigkeit in Anteilen von c? v : c = √(r_s : r). Auf zwei Stellen."
    answer:
      value: 0.59
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 0.35) < 0.01
        misconception: forgot-root
        text: Noch die Wurzel ziehen.
    hints:
      - "r_s : r = 4,2 : 12 = 0,35."
      - √0,35 = ?
    explanation: Fast 60 % der Lichtgeschwindigkeit. Neutronensterne sind nur knapp davon entfernt, Schwarze Löcher zu sein.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Können Schwarze Löcher wieder verschwinden?
    params:
      options:
        - label: Ja – nach Hawking strahlen sie durch Quanteneffekte ganz langsam Energie ab und verdampfen.
          correct: true
        - label: Nein, aus einem Schwarzen Loch kommt nie etwas heraus.
          feedback: Klassisch stimmt das. Die Quantentheorie erlaubt eine winzige Strahlung.
        - label: Ja, sie explodieren nach einigen Jahren.
          feedback: Ein Schwarzes Loch mit Sternmasse bräuchte unvorstellbar viel länger als das Alter des Universums.
    hints:
      - Am Horizont spielen Quanteneffekte mit.
      - Die Strahlung ist umso schwächer, je schwerer das Loch ist.
    explanation: Hawking-Strahlung ist für Sternlöcher so schwach, dass sie mehr Hintergrundstrahlung schlucken als abgeben. Verdampfen würden sie erst nach etwa 10⁶⁷ Jahren.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum nicht einmal Licht aus einem Schwarzen Loch entkommt.
    params:
      keywords:
        - - flucht
          - escape
          - entkomm
        - - lichtgeschwindigkeit
          - speed of light
          - licht
          - light
        - - horizont
          - horizon
          - radius
          - schwarzschild
          - krümm
          - curv
      sample: Um von einem Körper wegzukommen, braucht man die Fluchtgeschwindigkeit. Je kompakter die Masse, desto größer ist sie. Innerhalb des Schwarzschild-Radius wäre sie größer als die Lichtgeschwindigkeit – darum entkommt dort nichts, nicht einmal Licht.
    difficulty: 3

srs:
  cards_from: ["c4", "d2", "x2"]
