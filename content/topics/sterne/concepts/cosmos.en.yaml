id: sci.astro.cosmos
type: concept
title: "The expanding universe"
summary: "Hubble's law, the age of the cosmos and the traces of dark matter."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Almost all galaxies are moving away from us – and the farther, the faster. Does that mean we are at the centre of the universe?
    params:
      options:
        - label: No – it looks just the same from every galaxy, like raisins in a rising cake.
          correct: true
        - label: Yes, that is why they all flee from us.
          feedback: With uniform expansion every observer sees the same thing.
        - label: Yes, the Milky Way was the site of the Big Bang.
          feedback: The Big Bang happened everywhere at once, not at one place.
    hints:
      - Imagine a yeast cake with raisins rising.
      - What does any raisin see?
    explanation: Every raisin sees all others fly away, the distant ones fastest. There is no centre – space itself expands.

  - kind: explain
    id: c1
    body: "**Hubble's law**: a galaxy's recession speed grows with its distance, v = H₀ · d. The Hubble constant is about 70 km/s per megaparsec. A megaparsec is 3.26 million light-years."

  - kind: problem
    id: c2
    widget: numeric
    prompt: A galaxy is {{d}} megaparsecs away. How fast is it receding – in km/s? H₀ = 70 km/s per Mpc.
    params:
      unit: km/s
    answer:
      value: "{{70 * d}}"
    hints:
      - v = H₀ · d.
      - 70 · {{d}} = ?
    explanation: v = 70 · {{d}} = {{70 * d}} km/s. Double the distance, double the speed.
    variants:
      params:
        d: choice[10,50,100,300]
      defaults:
        d: 100

  - kind: problem
    id: c3
    widget: numeric
    prompt: A galaxy recedes at 7000 km/s. How far away is it – in megaparsecs?
    params:
      unit: Mpc
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 490000
        misconception: multiply
        text: "The other way round: d = v ÷ H₀."
    hints:
      - Solve v = H₀ · d for d.
      - 7000 ÷ 70 = ?
    explanation: 100 Mpc, a little over 300 million light-years. That is how one spectrum measures great distances.

  - kind: problem
    id: c4
    widget: choice
    prompt: Because of the expansion, do your room, Earth or the Milky Way expand too?
    params:
      options:
        - label: No – whatever is held together by forces stays the same size.
          correct: true
        - label: Yes, just unnoticeably.
          feedback: Bound systems do not expand at all. Their forces keep them stable.
        - label: Only Earth, not the room.
          feedback: Neither. The expansion only acts between clusters of galaxies.
    hints:
      - Atoms are held together by electric forces.
      - The Milky Way is held together by its gravity.
    explanation: Expansion only shows where nothing binds things together – between clusters of galaxies. Atoms, planets and galaxies keep their size.

  - kind: explain
    id: d1
    depth: 2
    body: Running the expansion backwards, all galaxies were together about $1/H_0$ ago. This **Hubble time** estimates the age of the universe. More precise models give 13.8 billion years.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Calculate the Hubble time 1 ÷ H₀. H₀ = 70 km/s per Mpc, 1 Mpc = 3.09 · 10¹⁹ km, 1 year = 3.15 · 10⁷ s. In billions of years, to one decimal place.
    params:
      unit: billion years
    answer:
      value: 14
      tolerance: 0.2
    hints:
      - 1 ÷ H₀ = 3.09 · 10¹⁹ km ÷ 70 km/s ≈ 4.4 · 10¹⁷ s.
      - Divide by 3.15 · 10⁷ s per year.
    explanation: About 14 billion years – amazingly close to 13.8. One single constant roughly gives the age of the cosmos.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A spectral line at 500 nm is measured at 550 nm in a galaxy. For small redshift z = Δλ ÷ λ we have v ≈ z · c. How fast is it receding – in km/s? c = 300,000 km/s.
    params:
      unit: km/s
    answer:
      value: 30000
    feedback:
      - when: abs(numval(state.input) - 330000) < 1000
        misconception: whole-wavelength
        text: Only the shift Δλ = 50 nm counts, not the whole wavelength.
    hints:
      - z = 50 ÷ 500 = 0.1.
      - v ≈ 0.1 · 300,000 km/s.
    explanation: 30,000 km/s, by Hubble about 430 Mpc away. For even larger z you need relativity.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Stars in the outer parts of galaxies orbit almost as fast as those inside. With the visible mass they should be much slower according to Kepler. Invisible mass is missing – **dark matter**.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Without extra mass, orbital speed outside the visible galaxy falls as 1 ÷ √r. Inside, a star orbits at 200 km/s. How fast should a star at four times the distance be?
    params:
      unit: km/s
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 50
        misconception: linear
        text: Speed falls with the **square root** of distance, not linearly.
    hints:
      - √4 = 2.
      - 200 ÷ 2 = ?
    explanation: "Expected: 100 km/s. Measured: still almost 200 km/s. These flat rotation curves, found by Vera Rubin, are a key piece of evidence for dark matter."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: buckets
    prompt: Is this evidence for dark matter?
    params:
      buckets:
        - id: b1
          label: Evidence for dark matter
        - id: b2
          label: Not evidence
      items:
        - label: Flat rotation curves
          bucket: b1
        - label: Strong gravitational lensing
          bucket: b1
        - label: Too-fast galaxies in clusters
          bucket: b1
        - label: Redshift of distant galaxies
          bucket: b2
        - label: Colour of stars
          bucket: b2
        - label: Parallax of nearby stars
          bucket: b2
    hints:
      - Dark matter shows itself only through its gravity.
      - Redshift shows the expansion.
    explanation: Rotation curves, lensing and galaxy clusters reveal more gravity than visible mass. Redshift, colour and parallax measure something else.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: choice
    prompt: What is the universe made of? How does it split up, as measured today?
    params:
      options:
        - label: About 5 % normal matter, 27 % dark matter, 68 % dark energy.
          correct: true
        - label: Almost only stars and gas.
          feedback: Everything we see is only about 5 %.
        - label: Half matter and half light.
          feedback: Light contributes almost nothing today. We do not know what most of it is.
    hints:
      - The visible is a small fraction.
      - Dark energy drives the accelerating expansion.
    explanation: Normal matter makes up only about 5 %. What dark matter and dark energy are is one of the biggest open questions in physics.
    difficulty: 3

  - kind: problem
    id: x5
    depth: 3
    widget: teach
    prompt: Explain to Lux how we know dark matter exists although no one can see it.
    params:
      keywords:
        - - schwerkraft
          - gravity
          - masse
          - mass
        - - rotation
          - kreisen
          - orbit
          - schnell
          - fast
          - tempo
          - speed
        - - linse
          - lens
          - unsichtbar
          - invisible
          - sichtbar
          - visible
      sample: Stars in the outer parts of galaxies orbit far too fast for the visible mass. Gravitational lenses also bend light more than the visible mass can. So there must be invisible mass that acts only through its gravity.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
