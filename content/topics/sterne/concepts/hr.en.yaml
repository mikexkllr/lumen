id: sci.astro.hr
type: concept
title: "The Hertzsprung–Russell diagram"
summary: "Colour reveals temperature, brightness reveals size – the map of the stars."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Which stars are hottest: red, yellow or blue?"
    params:
      options:
        - label: Blue ones
          correct: true
        - label: Red ones
          feedback: Red looks hot but is the coolest colour for stars.
        - label: Yellow ones
          feedback: Yellow stars like the Sun lie in the middle.
    hints:
      - "Think of a hob heating up: first red, then orange."
      - Hotter still it glows white and bluish.
    explanation: Red stars have about 3000 K, the yellow Sun 5800 K, blue stars over 10,000 K.

  - kind: explain
    id: c1
    body: A star's **colour** reveals its temperature. By Wien's law the peak of the radiation is at $\lambda_{max} = \frac{2.9 \cdot 10^6\,\text{nm·K}}{T}$. Hotter means shorter waves, so bluer.

  - kind: problem
    id: c2
    widget: numeric
    prompt: The Sun's surface is at 5800 K. At what wavelength does it radiate most strongly? λ = 2,900,000 ÷ T, in nm.
    params:
      unit: nm
    answer:
      value: 500
    hints:
      - 2,900,000 ÷ 5800 = ?
      - The result lies in the middle of visible light.
    explanation: 500 nm – blue-green, right in the visible range. Our eyes are tuned exactly to sunlight.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Where does this star lie in the Hertzsprung–Russell diagram?
    params:
      buckets:
        - id: b1
          label: Main sequence
        - id: b2
          label: Giant
        - id: b3
          label: White dwarf
      items:
        - label: Sun
          bucket: b1
        - label: Proxima Centauri
          bucket: b1
        - label: Sirius A
          bucket: b1
        - label: Betelgeuse
          bucket: b2
        - label: Rigel
          bucket: b2
        - label: Sirius B
          bucket: b3
    hints:
      - Most stars lie on the main sequence.
      - Betelgeuse and Rigel are huge, Sirius B is tiny and hot.
    explanation: Sun, Proxima and Sirius A burn hydrogen. Betelgeuse is a red and Rigel a blue supergiant. Sirius B is a white dwarf.

  - kind: problem
    id: c4
    widget: choice
    prompt: In the HR diagram most stars lie on a narrow band, the main sequence. Why?
    params:
      options:
        - label: Stars spend most of their lives there – as long as they burn hydrogen.
          correct: true
        - label: Because only those stars are bright enough to see.
          feedback: Giants are much brighter and still rarer.
        - label: Because all stars form at the same rate.
          feedback: It is not about formation but about how long each phase lasts.
    hints:
      - A snapshot mainly shows long phases.
      - How long does the giant phase last in comparison?
    explanation: Stars sit on the main sequence for about 90 % of their lives. Giant phases are short – so they are seen less often.

  - kind: explain
    id: d1
    depth: 2
    body: A star's luminosity is $L = 4\pi R^2 \sigma T^4$ – surface area times radiation per area. A cool star can therefore be very bright if it is huge. That is how **giant stars** are recognised.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A star has half the Sun's surface temperature and 100 times its radius. How many times brighter than the Sun does it shine?
    answer:
      value: 625
    feedback:
      - when: numval(state.input) == 5000
        misconception: linear-temperature
        text: "Temperature enters to the 4th power: (1/2)⁴ = 1/16, not 1/2."
    hints:
      - L ∝ R² · T⁴.
      - 100² · (1/2)⁴ = 10,000 ÷ 16.
    explanation: 625 times as bright, although much cooler. Its huge surface more than makes up for it.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Betelgeuse is at about 3500 K. At what wavelength does it radiate most strongly? λ = 2,900,000 ÷ T, in nm. To whole nm.
    params:
      unit: nm
    answer:
      value: 829
      tolerance: 3
    hints:
      - 2,900,000 ÷ 3500 = ?
      - Above 700 nm it is already infrared.
    explanation: About 829 nm – in the infrared. We see only the red flank of its light, which is why it looks orange-red.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Astronomers measure brightness in **magnitudes**. 5 magnitudes are exactly a factor of 100. A larger number means fainter: a 6th-magnitude star is just visible to the naked eye."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Star A has magnitude 1, star B magnitude 6. How many times brighter does A appear?
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 5
        misconception: linear-magnitude
        text: "Magnitudes count factors, not differences: 5 magnitudes are a factor of 100."
    hints:
      - The difference is 5 magnitudes.
      - 5 magnitudes = factor 100.
    explanation: A factor of 100. The scale is logarithmic like decibels – our eyes perceive brightness the same way.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: 5 magnitudes are a factor of 100. What factor is one magnitude, then? It is the fifth root of 100. To two decimals.
    answer:
      value: 2.51
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 20
        misconception: divide-factor
        text: "Dividing does not work here: factors are spread with roots."
    hints:
      - x · x · x · x · x = 100.
      - "Try 2.5: 2.5⁵ ≈ 98."
    explanation: 100 to the 1/5 ≈ 2.512. Each magnitude is about two and a half times as bright as the next.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how you can read a star's temperature from its colour.
    params:
      keywords:
        - - farbe
          - colour
          - color
          - rot
          - red
          - blau
          - blue
        - - temperatur
          - temperature
          - heiß
          - hot
          - kühl
          - cool
        - - wellenlänge
          - wavelength
          - maximum
          - peak
          - wien
      sample: "Every hot body radiates most strongly at a wavelength that depends on its temperature. The hotter, the shorter: cool stars glow red, hot ones blue. With Wien's law you calculate the temperature from the colour."
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x2"]
