id: sci.astro.stars
type: concept
title: "How stars live"
summary: "Fusion in the core, a balance of forces and why massive stars die young."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: for how many billion years does the Sun shine in total as a calm star?"
    params:
      min: 0.1
      max: 1000
      scale: log
    answer:
      value: 10
      within: 30
    explanation: About 10 billion years. Almost half of it has passed – the Sun is 4.6 billion years old.

  - kind: explain
    id: c1
    body: In a star's core hydrogen nuclei fuse into helium. This **nuclear fusion** supplies the energy. The hot gas pressure holds out against gravity, which tries to squeeze the star.

  - kind: problem
    id: c2
    widget: order
    prompt: Put the life of a Sun-like star in the right order.
    params:
      items:
        - label: A gas cloud contracts
        - label: A protostar heats up
        - label: "Main sequence: hydrogen burns"
        - label: A red giant swells
        - label: The envelope is shed
        - label: A white dwarf cools
    hints:
      - It starts with gas and ends with a hot remnant.
      - Only when core hydrogen runs low does the star swell.
    explanation: A star spends most of its life on the main sequence. The Sun will become a red giant in 5 billion years and end as a white dwarf.

  - kind: problem
    id: c3
    widget: choice
    prompt: Why does a star not collapse under its own enormous gravity?
    params:
      options:
        - label: The pressure of the hot gas pushes outwards just as hard.
          correct: true
        - label: Because it spins fast.
          feedback: The Sun turns slowly, about once a month. It is the gas pressure.
        - label: Because stars are solid.
          feedback: Stars are balls of gas. They are held up by pressure.
    hints:
      - Two forces are in balance.
      - Fusion keeps the gas hot.
    explanation: Gravity squeezes, hot gas pushes back. When fusion ends, gravity wins – and the core shrinks.

  - kind: problem
    id: c4
    widget: numeric
    prompt: The Sun is 4.6 billion years old and stays on the main sequence for about 10 billion years. What percentage of that time has passed?
    params:
      unit: "%"
    answer:
      value: 46
    hints:
      - Part divided by whole.
      - 4.6 ÷ 10 = ?
    explanation: 46 %. The Sun is a star in the prime of life.

  - kind: explain
    id: d1
    depth: 2
    body: "Massive stars have more fuel but shine much brighter: luminosity grows roughly as $M^{3.5}$. So the **lifetime** falls with mass: $t \\approx 10^{10}\\,\\text{years} \\cdot M^{-2.5}$, with M in solar masses."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: How many million years does a star of {{m}} solar masses live? Use t = 10,000 million years · M to the (−2.5). To one decimal place.
    params:
      unit: million years
    answer:
      value: "{{10000 / (m * m * sqrt(m))}}"
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 10000 / m) < 1
        misconception: linear-lifetime
        text: "More fuel alone would give t ∝ M. The much higher luminosity counts too: M to the (−2.5)."
    hints:
      - M to the 2.5 = M² · √M.
      - 10,000 ÷ ({{m * m}} · {{sqrt(m)}}) = ?
    explanation: t ≈ {{10000 / (m * m * sqrt(m))}} million years. The dinosaurs lived longer than some giant stars exist.
    difficulty: 2
    variants:
      params:
        m: choice[4,9,16]
      defaults:
        m: 4

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Why do massive stars live shorter lives although they have much more fuel?
    params:
      options:
        - label: Their core is hotter and denser – they burn their fuel much faster.
          correct: true
        - label: They have less hydrogen.
          feedback: They have more hydrogen. What matters is the rate.
        - label: They are disturbed by neighbours.
          feedback: Even solitary massive stars live briefly. It is the interior.
    hints:
      - More mass, more gravity, more pressure in the core.
      - Fusion runs much faster at higher temperature.
    explanation: To hold out against stronger gravity the core needs more pressure and heat – fusion then runs furiously. A star of 20 solar masses lives only a few million years.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: When 4 hydrogen nuclei fuse into helium, 0.7 % of their mass turns into energy. How much energy does 1 kg of hydrogen yield? E = mc², c = 3 · 10⁸ m/s. In 10¹⁴ J, to one decimal place.
    answer:
      value: 6.3
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 900) < 1
        misconception: full-mass
        text: Only 0.7 % of the mass is converted, not the whole kilogram.
    hints:
      - Δm = 0.007 kg.
      - 0.007 · 9 · 10¹⁶ = ?
    explanation: 6.3 · 10¹⁴ J – as much as 20,000 tonnes of coal from a single kilogram.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: A photon created in the Sun's core takes tens of thousands of years to reach the surface. Why so long, when light is so fast?
    params:
      options:
        - label: It is constantly scattered in the dense gas and zigzags its way outwards.
          correct: true
        - label: Inside, light is much slower than c.
          feedback: Between collisions it flies at c. The problem is the countless changes of direction.
        - label: Gravity holds it back.
          feedback: The Sun's gravity does not noticeably slow light.
    hints:
      - How far does a photon get in the core before it hits a particle?
      - In a random walk the distance grows only with the square root of the number of steps.
    explanation: Between two collisions it covers only millimetres. A random walk needs about (R ÷ step)² steps for a distance R – unimaginably many. After that it needs just 8 minutes to reach us.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what a star lives on and why it eventually dies.
    params:
      keywords:
        - - fusion
          - verschmelz
          - fuse
          - wasserstoff
          - hydrogen
        - - schwerkraft
          - gravity
          - druck
          - pressure
          - gleichgewicht
          - balance
        - - brennstoff
          - fuel
          - aus
          - runs out
          - verbraucht
          - used up
          - end
      sample: In the core hydrogen nuclei fuse into helium and release energy. The hot gas pressure holds against gravity. When the fuel in the core is used up, the pressure is gone – the core collapses and the star dies.
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x1"]
