id: sci.astro.hr
type: concept
title: "Das Hertzsprung-Russell-Diagramm"
summary: "Farbe verrät Temperatur, Helligkeit verrät Größe – die Landkarte der Sterne."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ordnung am Sternenhimmel
    body: "Sterne sehen auf den ersten Blick alle gleich aus. Doch ihr Licht verrät viel. Deck die Karten auf: Wie wurde aus Punkten eine **Landkarte** der Sterne?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 👩‍🔬
            front: Annie Cannon
            back: Sie sortierte von Hand über 300 000 Sterne nach ihrem Licht – schneller als jeder andere.
          - icon: 🗂️
            front: O B A F G K M
            back: "So heißen ihre Klassen bis heute. Merksatz: Oh Be A Fine Girl, Kiss Me."
          - icon: 📊
            front: "Um 1910: Das Diagramm"
            back: Hertzsprung und Russell tragen Helligkeit gegen Farbe auf – und finden ein klares Muster.

  - kind: problem
    id: hook
    widget: choice
    prompt: "Welche Sterne sind am heißesten: rote, gelbe oder blaue?"
    params:
      options:
        - label: Blaue
          correct: true
        - label: Rote
          feedback: Rot wirkt heiß, ist bei Sternen aber die kühlste Farbe.
        - label: Gelbe
          feedback: Gelbe Sterne wie die Sonne liegen in der Mitte.
    hints:
      - "Denk an eine Herdplatte, die heißer wird: erst rot, dann orange."
      - Noch heißer leuchtet es weiß und bläulich.
    explanation: Rote Sterne haben etwa 3000 K, die gelbe Sonne 5800 K, blaue Sterne über 10 000 K.

  - kind: explain
    id: c1
    body: Die **Farbe** eines Sterns verrät seine Temperatur. Nach Wien liegt das Strahlungsmaximum bei $\lambda_{max} = \frac{2{,}9 \cdot 10^6\,\text{nm·K}}{T}$. Heißer heißt kürzere Wellen, also blauer.

  - kind: problem
    id: c2
    widget: numeric
    prompt: "Die Sonnenoberfläche hat 5800 K. Bei welcher Wellenlänge strahlt sie am stärksten? λ = 2 900 000 : T, in nm."
    params:
      unit: nm
    answer:
      value: 500
    hints:
      - "2 900 000 : 5800 = ?"
      - Das Ergebnis liegt mitten im sichtbaren Licht.
    explanation: 500 nm – blaugrün, mitten im sichtbaren Bereich. Unsere Augen sind genau auf das Sonnenlicht abgestimmt.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Wo liegt dieser Stern im Hertzsprung-Russell-Diagramm?
    params:
      buckets:
        - id: b1
          label: Hauptreihe
        - id: b2
          label: Riese
        - id: b3
          label: Weißer Zwerg
      items:
        - label: Sonne
          bucket: b1
        - label: Proxima Centauri
          bucket: b1
        - label: Sirius A
          bucket: b1
        - label: Beteigeuze
          bucket: b2
        - label: Rigel
          bucket: b2
        - label: Sirius B
          bucket: b3
    hints:
      - Die meisten Sterne liegen auf der Hauptreihe.
      - Beteigeuze und Rigel sind riesig, Sirius B ist winzig und heiß.
    explanation: Sonne, Proxima und Sirius A verbrennen Wasserstoff. Beteigeuze ist ein roter, Rigel ein blauer Überriese. Sirius B ist ein Weißer Zwerg.

  - kind: problem
    id: c4
    widget: choice
    prompt: Im HR-Diagramm liegen die meisten Sterne auf einem schmalen Band, der Hauptreihe. Warum?
    params:
      options:
        - label: Sterne verbringen dort den größten Teil ihres Lebens – solange sie Wasserstoff verbrennen.
          correct: true
        - label: Weil nur diese Sterne hell genug zum Sehen sind.
          feedback: Riesen sind viel heller und trotzdem seltener.
        - label: Weil sich alle Sterne gleich schnell bilden.
          feedback: Es geht nicht um die Entstehung, sondern um die Dauer der Phasen.
    hints:
      - Ein Schnappschuss zeigt vor allem lange Phasen.
      - Wie lange dauert die Riesenphase im Vergleich?
    explanation: Auf der Hauptreihe sitzen Sterne rund 90 % ihres Lebens. Riesenphasen sind kurz – darum sieht man sie seltener.

  - kind: explain
    id: d1
    depth: 2
    body: Die Leuchtkraft eines Sterns ist $L = 4\pi R^2 \sigma T^4$ – Oberfläche mal Strahlung pro Fläche. Ein kühler Stern kann darum sehr hell sein, wenn er riesig ist. So erkennt man **Riesensterne**.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Stern hat die halbe Oberflächentemperatur der Sonne und den 100-fachen Radius. Wievielmal heller leuchtet er als die Sonne?
    answer:
      value: 625
    feedback:
      - when: numval(state.input) == 5000
        misconception: linear-temperature
        text: "Die Temperatur geht hoch 4 ein: (1/2)⁴ = 1/16, nicht 1/2."
    hints:
      - L ∝ R² · T⁴.
      - "100² · (1/2)⁴ = 10 000 : 16."
    explanation: 625-mal so hell, obwohl er viel kühler ist. Seine riesige Oberfläche gleicht das mehr als aus.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: "Beteigeuze hat etwa 3500 K. Bei welcher Wellenlänge strahlt sie am stärksten? λ = 2 900 000 : T, in nm. Auf ganze nm."
    params:
      unit: nm
    answer:
      value: 829
      tolerance: 3
    hints:
      - "2 900 000 : 3500 = ?"
      - Über 700 nm ist es schon Infrarot.
    explanation: Etwa 829 nm – im Infraroten. Wir sehen nur die rote Flanke ihres Lichts, darum wirkt sie orangerot.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Astronomen messen Helligkeit in **Größenklassen**. 5 Größenklassen sind genau der Faktor 100. Größere Zahl heißt schwächer: Ein Stern 6. Größe ist gerade noch mit bloßem Auge sichtbar."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Stern A hat die 1. Größenklasse, Stern B die 6. Wievielmal heller erscheint A?
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 5
        misconception: linear-magnitude
        text: "Größenklassen zählen Faktoren, nicht Differenzen: 5 Klassen sind Faktor 100."
    hints:
      - Der Unterschied ist 5 Größenklassen.
      - 5 Klassen = Faktor 100.
    explanation: Faktor 100. Die Skala ist logarithmisch wie die Dezibel – unser Auge empfindet Helligkeit genauso.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: 5 Größenklassen sind der Faktor 100. Welcher Faktor ist dann eine Größenklasse? Es ist die fünfte Wurzel aus 100. Auf zwei Stellen.
    answer:
      value: 2.51
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 20
        misconception: divide-factor
        text: "Teilen geht hier nicht: Faktoren verteilt man mit Wurzeln."
    hints:
      - x · x · x · x · x = 100.
      - "Probier 2,5: 2,5⁵ ≈ 98."
    explanation: 100 hoch 1/5 ≈ 2,512. Jede Größenklasse ist gut zweieinhalbmal so hell wie die nächste.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man an der Farbe eines Sterns seine Temperatur ablesen kann.
    params:
      keywords:
        - - farbe
          - colour
          - color
          - rot
          - red
          - blau
          - blue
        - - temperatur
          - temperature
          - heiß
          - hot
          - kühl
          - cool
        - - wellenlänge
          - wavelength
          - maximum
          - peak
          - wien
      sample: "Jeder heiße Körper strahlt am stärksten bei einer Wellenlänge, die von der Temperatur abhängt. Je heißer, desto kürzer: Kühle Sterne leuchten rot, heiße blau. Nach Wien rechnet man aus der Farbe die Temperatur."
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x2"]
