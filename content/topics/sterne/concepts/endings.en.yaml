id: sci.astro.endings
type: concept
title: "White dwarfs, neutron stars, black holes"
summary: "What is left of stars – depending on their mass."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a teaspoon of neutron-star matter (5 ml) – how many tonnes does it weigh?"
    params:
      min: 1
      max: 1000000000000000
      scale: log
    answer:
      value: 2000000000
      within: 80
    explanation: About 2 billion tonnes. In a neutron star nuclei are packed as densely as in a single giant nucleus.

  - kind: explain
    id: c1
    body: How a star ends depends on its mass. Light stars like the Sun become white dwarfs. Massive stars explode as a **supernova**. Their core becomes a neutron star or a black hole.

  - kind: problem
    id: c2
    widget: match
    prompt: What belongs together?
    params:
      pairs:
        - left: White dwarf
          right: the size of Earth
        - left: Neutron star
          right: the size of a city
        - left: Black hole
          right: not even light escapes
        - left: Supernova
          right: brighter than a galaxy
    hints:
      - The denser the remnant, the smaller.
      - The explosion itself is extremely bright for weeks.
    explanation: A white dwarf packs a solar mass into the size of Earth, a neutron star into 20 km across. A black hole is more compact still.

  - kind: problem
    id: c3
    widget: choice
    prompt: Will the Sun one day become a black hole?
    params:
      options:
        - label: No – it is too light for that. It will end as a white dwarf.
          correct: true
        - label: Yes, every star ends that way.
          feedback: Only very massive stars end as black holes.
        - label: Yes, in a supernova.
          feedback: Stars like the Sun do not explode. They shed their envelope gently.
    hints:
      - From about 8 solar masses there is a supernova.
      - The Sun has exactly one solar mass.
    explanation: The Sun will become a red giant, shed its envelope as a nebula, and its core will remain as a white dwarf cooling over billions of years.

  - kind: problem
    id: c4
    widget: numeric
    prompt: A black hole's radius is about 3 km per solar mass. At the centre of the Milky Way sits one of 4 million solar masses. How large is its radius – in millions of km?
    params:
      unit: million km
    answer:
      value: 12
    hints:
      - 4,000,000 · 3 km = ?
      - "In millions of km: 12,000,000 km."
    explanation: About 12 million km – smaller than Mercury's orbit. In 2022 its shadow was photographed.

  - kind: explain
    id: d1
    depth: 2
    body: A white dwarf is held up not by heat but by the push-back of tightly packed electrons. Above about 1.4 solar masses that is no longer enough – the **Chandrasekhar limit**. Beyond it the remnant collapses further.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A white dwarf has the Sun's mass but only Earth's radius. The Sun is 109 times as wide as Earth. How many times stronger is gravity at its surface than at the Sun's surface?
    answer:
      value: 11881
      tolerance: 100
    feedback:
      - when: numval(state.input) == 109
        misconception: not-squared
        text: Gravity grows as 1 ÷ r². 109 times smaller means 109² times stronger.
    hints:
      - Same mass, so g ∝ 1 ÷ r².
      - 109² = ?
    explanation: About 12,000 times stronger. A person there would weigh several thousand tonnes.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Where does much of the gold in your ring probably come from?
    params:
      options:
        - label: From merging neutron stars.
          correct: true
        - label: From nuclear fusion in the Sun.
          feedback: The Sun only makes helium. Stars fuse at most up to iron.
        - label: It formed in the Big Bang.
          feedback: The Big Bang made almost only hydrogen and helium.
    hints:
      - Heavier than iron only works by capturing many neutrons.
      - Where are there extremely many free neutrons?
    explanation: In 2017 two merging neutron stars were seen – in gravitational waves and in light. Elements like gold and platinum formed in the process. We are wearing stardust.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: The escape velocity is $v = \sqrt{2GM/r}$. When it reaches c, nothing can escape any more. That happens at the **Schwarzschild radius** $r_s = \frac{2GM}{c^2}$, the event horizon.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A neutron star has 1.4 solar masses and a 12 km radius. Its Schwarzschild radius would be 4.2 km. What is its escape velocity as a fraction of c? v ÷ c = √(r_s ÷ r). To two decimals.
    answer:
      value: 0.59
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 0.35) < 0.01
        misconception: forgot-root
        text: Still take the square root.
    hints:
      - r_s ÷ r = 4.2 ÷ 12 = 0.35.
      - √0.35 = ?
    explanation: Almost 60 % of the speed of light. Neutron stars are only a little short of being black holes.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Can black holes ever disappear?
    params:
      options:
        - label: Yes – according to Hawking they radiate energy very slowly through quantum effects and evaporate.
          correct: true
        - label: No, nothing ever comes out of a black hole.
          feedback: Classically that is true. Quantum theory allows a tiny radiation.
        - label: Yes, they explode after a few years.
          feedback: A black hole of stellar mass would need unimaginably longer than the age of the universe.
    hints:
      - Quantum effects play a part at the horizon.
      - The radiation is the weaker, the heavier the hole.
    explanation: Hawking radiation is so weak for stellar black holes that they absorb more background radiation than they emit. They would only evaporate after about 10⁶⁷ years.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why not even light escapes from a black hole.
    params:
      keywords:
        - - flucht
          - escape
          - entkomm
        - - lichtgeschwindigkeit
          - speed of light
          - licht
          - light
        - - horizont
          - horizon
          - radius
          - schwarzschild
          - krümm
          - curv
      sample: To get away from a body you need the escape velocity. The more compact the mass, the larger it is. Inside the Schwarzschild radius it would exceed the speed of light – so nothing escapes there, not even light.
    difficulty: 3

srs:
  cards_from: ["c4", "d2", "x2"]
