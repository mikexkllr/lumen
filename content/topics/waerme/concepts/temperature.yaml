id: sci.heat.temperature
type: concept
title: Was Temperatur ist
summary: Zappelnde Teilchen und Kelvin.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie heiß ist es im Inneren der Sonne – in Millionen Grad?"
    params:
      min: 0
      max: 100
    answer:
      value: 15
      tolerance: 5
    explanation: Etwa 15 Millionen Grad. Nach oben gibt es praktisch keine Grenze – nach unten schon.

  - kind: problem
    id: zappeln
    widget: choice
    prompt: Was passiert mit den Teilchen eines Stoffes, wenn er wärmer wird?
    params:
      options:
        - { label: Sie bewegen sich schneller., correct: true }
        - { label: Sie werden größer., feedback: "Die Teilchen selbst wachsen nicht – sie bewegen sich heftiger." }
        - { label: Es werden mehr Teilchen., feedback: "Die Zahl bleibt gleich." }
    hints:
      - Denk an ein Gewimmel, das immer wilder wird.
    explanation: Temperatur ist ein Maß dafür, wie heftig sich die Teilchen bewegen.

  - kind: explain
    id: s2
    body: |
      Bei **−273 °C** stehen die Teilchen fast still – kälter geht es nicht. Diesen absoluten Nullpunkt nennt man **0 Kelvin**. Ein Kelvin-Schritt ist so groß wie ein Grad Celsius: Kelvin = Grad Celsius + 273.

  - kind: problem
    id: kelvin
    widget: numeric
    prompt: Wie viel Kelvin sind {{c}} °C?
    params: { unit: K }
    answer: { value: "{{c + 273}}" }
    hints:
      - 273 dazuzählen.
    explanation: "{{c}} + 273 = {{c + 273}} K."
    variants:
      params: { c: "int[-40,100]" }
      defaults: { c: 20 }

  - kind: problem
    id: kaelter
    widget: choice
    prompt: Gibt es etwas Kälteres als −273 °C?
    params:
      options:
        - { label: Nein – langsamer als Stillstand geht nicht., correct: true }
        - { label: Ja – im Weltall ist es kälter., feedback: "Selbst das All ist etwa −270 °C warm – knapp darüber." }
    hints:
      - Was bedeutet 0 Kelvin für die Bewegung der Teilchen?
    explanation: 0 K ist eine echte Untergrenze – man kann ihr nahekommen, sie aber nie erreichen.

  - kind: problem
    id: c1
    widget: sim
    prompt: Das Gas ist bei 300 K eingeschlossen. Heiz es auf, bis sich der Druck **verdoppelt** hat (etwa 200 kPa).
    params:
      scene: gas
      controls:
        volume:
          value: 5
          fixed: true
    answer:
      pressure:
        - 195
        - 205
    explanation: Bei 600 K. Doppelte Kelvin-Temperatur, doppelt so heftige Stöße, doppelter Druck.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Autoreifen hat bei 7 °C (280 K) einen Druck von 2,8 bar. Welchen Druck hat er bei 37 °C (310 K), wenn das Volumen gleich bleibt?
    params:
      unit: bar
    answer:
      value: 3.1
      tolerance: 0.02
    hints:
      - "Der Druck wächst im selben Verhältnis wie die Kelvin-Temperatur: 310 : 280."
    explanation: 2,8 · 310/280 = 3,1 bar. Mit Celsius gerechnet käme Unsinn heraus.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "In den USA misst man in Fahrenheit: °F = 1,8 · °C + 32. Wie viel °F sind {{c}} °C?"
    params:
      unit: °F
    answer:
      value: "{{1.8 * c + 32}}"
    feedback:
      - when: abs(numval(state.input) - 1.8 * c) < 0.1
        misconception: forgot-offset
        text: "Die 32 fehlen noch: Der Nullpunkt der Skalen ist verschoben."
    hints:
      - Erst mal 1,8 nehmen.
      - Dann 32 dazuzählen.
    explanation: 1,8 · {{c}} + 32 = {{1.8 * c + 32}} °F. 100 °F sind leichtes Fieber, 0 °F sind −18 °C.
    difficulty: 2
    variants:
      params:
        c: choice[10,20,37,100]
      defaults:
        c: 37

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Wasser A hat 20 °C, Wasser B hat 40 °C. Bewegen sich die Teilchen in B im Mittel doppelt so heftig?
    params:
      options:
        - label: Nein – in Kelvin sind es 293 K und 313 K, nur etwa 7 % mehr.
          correct: true
        - label: Ja, 40 ist doppelt so viel wie 20.
          feedback: Celsius beginnt nicht beim echten Nullpunkt. Zum Vergleichen braucht man Kelvin.
        - label: Nein, sie bewegen sich gleich schnell.
          feedback: Wärmer heißt schneller – nur eben nicht doppelt so.
    hints:
      - Rechne beide Temperaturen in Kelvin um.
      - Die Teilchenenergie ist proportional zu T in Kelvin.
    explanation: "313 : 293 ≈ 1,07. Doppelt so viel Bewegungsenergie hätte Wasser erst bei 586 K, also 313 °C."
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: sim
    prompt: Die Temperatur bleibt fest bei 300 K. Drück das Gas so zusammen, dass sich der Druck verdoppelt – auf etwa 200 kPa.
    params:
      scene: gas
      controls:
        temperature:
          value: 300
          fixed: true
    answer:
      pressure:
        - 195
        - 205
    explanation: "Bei halbem Volumen (2,5 L) prallen die Teilchen doppelt so oft gegen die Wand. Das ist das Gesetz von Boyle: p · V bleibt gleich."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was ist Temperatur – physikalisch genau?
    params:
      options:
        - label: Ein Maß für die mittlere Bewegungsenergie der Teilchen
          correct: true
        - label: Die gesamte Wärmeenergie eines Körpers
          feedback: Ein Eisberg enthält mehr Energie als eine Tasse Tee – und ist doch kälter.
        - label: Ein Maß dafür, wie heiß sich etwas anfühlt
          feedback: Metall und Holz fühlen sich bei gleicher Temperatur verschieden an.
    hints:
      - "Ein Eisberg und eine Tasse Tee: Wer hat mehr Energie, wer die höhere Temperatur?"
    explanation: Temperatur ist ein **Durchschnitt** pro Teilchen, Wärme eine Gesamtmenge.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Die mittlere Bewegungsenergie eines Gasteilchens ist $\frac{3}{2} k T$. Dabei ist k die **Boltzmann-Konstante**, 1,38 · 10⁻²³ J/K. Sie verbindet die Temperatur mit der Energie einzelner Teilchen.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Wie schnell fliegen Stickstoffmoleküle bei Zimmertemperatur im Mittel – in m/s?"
    params:
      min: 0
      max: 3000
    answer:
      value: 510
      tolerance: 100
    explanation: Aus ½ m v² = 3/2 k T folgt v = √(3kT/m) ≈ 510 m/s – schneller als der Schall. Weil sie ständig zusammenstoßen, kommen sie trotzdem nur langsam voran.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: numeric
    prompt: Bei welcher Temperatur in Kelvin haben Gasteilchen doppelt so viel Bewegungsenergie wie bei 27 °C?
    params:
      unit: K
    answer:
      value: 600
    feedback:
      - when: numval(state.input) == 54
        misconception: celsius-double
        text: Das sind 54 °C – verdoppelt in Celsius. Die Energie ist proportional zur Kelvin-Temperatur.
      - when: numval(state.input) == 327
        misconception: unit-confusion
        text: Das ist richtig gerechnet – aber in °C. Gefragt war Kelvin.
    hints:
      - 27 °C sind 300 K.
      - Doppelte Energie heißt doppelte Kelvin-Temperatur.
    explanation: 2 · 300 K = 600 K, das sind 327 °C. Die Teilchen sind dann um den Faktor √2 schneller.
    difficulty: 3

srs:
  cards_from: [kelvin, kaelter]
