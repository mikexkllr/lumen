id: sci.heat.temperature
type: concept
title: Was Temperatur ist
summary: Zappelnde Teilchen und Kelvin.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie heiß ist es im Inneren der Sonne – in Millionen Grad?"
    params:
      min: 0
      max: 100
    answer:
      value: 15
      tolerance: 5
    explanation: Etwa 15 Millionen Grad. Nach oben gibt es praktisch keine Grenze – nach unten schon.


  - kind: problem
    id: zappeln
    widget: choice
    prompt: Was passiert mit den Teilchen eines Stoffes, wenn er wärmer wird?
    params:
      options:
        - { label: Sie bewegen sich schneller., correct: true }
        - { label: Sie werden größer., feedback: "Die Teilchen selbst wachsen nicht – sie bewegen sich heftiger." }
        - { label: Es werden mehr Teilchen., feedback: "Die Zahl bleibt gleich." }
    hints:
      - Denk an ein Gewimmel, das immer wilder wird.
    explanation: Temperatur ist ein Maß dafür, wie heftig sich die Teilchen bewegen.

  - kind: explain
    id: s2
    body: |
      Bei **−273 °C** stehen die Teilchen fast still – kälter geht es nicht. Diesen absoluten Nullpunkt nennt man **0 Kelvin**. Ein Kelvin-Schritt ist so groß wie ein Grad Celsius: Kelvin = Grad Celsius + 273.

  - kind: problem
    id: kelvin
    widget: numeric
    prompt: Wie viel Kelvin sind {{c}} °C?
    params: { unit: K }
    answer: { value: "{{c + 273}}" }
    hints:
      - 273 dazuzählen.
    explanation: "{{c}} + 273 = {{c + 273}} K."
    variants:
      params: { c: "int[-40,100]" }
      defaults: { c: 20 }

  - kind: problem
    id: kaelter
    widget: choice
    prompt: Gibt es etwas Kälteres als −273 °C?
    params:
      options:
        - { label: Nein – langsamer als Stillstand geht nicht., correct: true }
        - { label: Ja – im Weltall ist es kälter., feedback: "Selbst das All ist etwa −270 °C warm – knapp darüber." }
    hints:
      - Was bedeutet 0 Kelvin für die Bewegung der Teilchen?
    explanation: 0 K ist eine echte Untergrenze – man kann ihr nahekommen, sie aber nie erreichen.

  - kind: problem
    id: c1
    widget: sim
    prompt: Das Gas ist bei 300 K eingeschlossen. Heiz es auf, bis sich der Druck **verdoppelt** hat (etwa 200 kPa).
    params:
      scene: gas
      controls:
        volume:
          value: 5
          fixed: true
    answer:
      pressure:
        - 195
        - 205
    explanation: Bei 600 K. Doppelte Kelvin-Temperatur, doppelt so heftige Stöße, doppelter Druck.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Autoreifen hat bei 7 °C (280 K) einen Druck von 2,8 bar. Welchen Druck hat er bei 37 °C (310 K), wenn das Volumen gleich bleibt?
    params:
      unit: bar
    answer:
      value: 3.1
      tolerance: 0.02
    hints:
      - "Der Druck wächst im selben Verhältnis wie die Kelvin-Temperatur: 310 : 280."
    explanation: 2,8 · 310/280 = 3,1 bar. Mit Celsius gerechnet käme Unsinn heraus.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was ist Temperatur – physikalisch genau?
    params:
      options:
        - label: Ein Maß für die mittlere Bewegungsenergie der Teilchen
          correct: true
        - label: Die gesamte Wärmeenergie eines Körpers
          feedback: Ein Eisberg enthält mehr Energie als eine Tasse Tee – und ist doch kälter.
        - label: Ein Maß dafür, wie heiß sich etwas anfühlt
          feedback: Metall und Holz fühlen sich bei gleicher Temperatur verschieden an.
    hints:
      - "Ein Eisberg und eine Tasse Tee: Wer hat mehr Energie, wer die höhere Temperatur?"
    explanation: Temperatur ist ein **Durchschnitt** pro Teilchen, Wärme eine Gesamtmenge.
    difficulty: 3

srs:
  cards_from: [kelvin, kaelter]
