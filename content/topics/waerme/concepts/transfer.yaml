id: sci.heat.transfer
type: concept
title: Wie Wärme wandert
summary: Leitung, Strömung, Strahlung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In heißer Suppe wird der Metalllöffel schnell heiß, der Holzlöffel kaum. Warum?
    params:
      options:
        - label: Metall leitet Wärme viel besser
          correct: true
        - label: Holz ist kälter
          feedback: Beide waren vorher gleich warm.
        - label: Metall erzeugt Wärme
          feedback: Es leitet sie nur weiter.
    hints:
      - Die Wärme wandert durch den Löffel.
    explanation: Das ist einer von drei Wegen, auf denen Wärme wandert.

  - kind: explain
    id: s1
    body: |
      Wärme fließt immer vom Warmen zum Kalten – auf drei Wegen: **Leitung** durch einen Stoff, **Strömung** mit bewegter Luft oder Flüssigkeit und **Strahlung**, die sogar durchs Vakuum geht.

  - kind: problem
    id: wege
    widget: buckets
    prompt: Welcher Weg ist das?
    params:
      buckets: [{ label: Leitung }, { label: Strömung }, { label: Strahlung }]
      items:
        - { label: Heißer Löffelstiel im Tee, bucket: Leitung }
        - { label: Warme Luft steigt über der Heizung, bucket: Strömung }
        - { label: Sonne wärmt die Erde, bucket: Strahlung }
        - { label: Lagerfeuer wärmt das Gesicht, bucket: Strahlung }
    hints:
      - Braucht der Weg einen Stoff dazwischen?
    explanation: Die Sonne erreicht uns durchs leere All – das schafft nur Strahlung.

  - kind: problem
    id: metall
    widget: choice
    prompt: Metall und Holz liegen im selben Raum. Warum fühlt sich das Metall kälter an?
    params:
      options:
        - { label: Es leitet die Wärme schneller aus der Hand., correct: true }
        - { label: Es ist wirklich kälter., feedback: "Beide haben Raumtemperatur." }
    hints:
      - Deine Hand misst nicht die Temperatur, sondern den Wärmefluss.
    explanation: Metall zieht die Wärme schnell aus der Haut – das fühlt sich kalt an.

  - kind: problem
    id: heizung
    widget: choice
    prompt: Warum hängen Heizkörper meist unter dem Fenster?
    params:
      options:
        - { label: Die warme Luft steigt auf und fängt die kalte Fensterluft ab., correct: true }
        - { label: Weil dort am meisten Platz ist., feedback: "Es hat einen physikalischen Grund – denk an Strömung." }
    hints:
      - Wohin bewegt sich warme Luft?
    explanation: Aufsteigende warme Luft bildet einen Vorhang vor dem kalten Glas.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Wärme fließt von selbst nur von warm nach kalt.
          right: true
        - text: Eine Decke erzeugt Wärme.
          right: false
          why: Sie bremst nur den Wärmeverlust deines Körpers.
        - text: Die Wärme der Sonne kommt als Strahlung durch das Vakuum.
          right: true
        - text: Kälte kriecht durch das offene Fenster herein.
          right: false
          why: Physikalisch fließt Wärme hinaus. Kälte ist nur fehlende Wärme.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Warum fühlt sich 20 °C warmes **Wasser** viel kälter an als 20 °C warme **Luft**?
    params:
      options:
        - label: Wasser leitet Wärme etwa 25-mal besser ab
          correct: true
        - label: Das Wasser ist in Wahrheit kälter
          feedback: Beide haben dieselbe Temperatur.
        - label: Die Haut misst die Temperatur im Wasser falsch
          feedback: Sie misst gar keine Temperatur, sondern den Wärmestrom.
    hints:
      - Deine Haut spürt, wie schnell Wärme abfließt.
    explanation: Wir fühlen den **Wärmestrom**, nicht die Temperatur.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Körper strahlt Wärme proportional zu $T^4$ ab (T in Kelvin). Die Temperatur verdoppelt sich. Wievielmal mehr strahlt er ab?
    answer:
      value: 16
    hints:
      - 2 hoch 4.
    explanation: 16-mal. Das **Stefan-Boltzmann-Gesetz** erklärt, warum heiße Sterne so viel heller sind.
    difficulty: 3

srs:
  cards_from: [wege, metall]
