id: sci.heat.transfer
type: concept
title: Wie Wärme wandert
summary: Leitung, Strömung, Strahlung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Tee wird kalt
    body: "Heißer Tee wird nie von allein heißer, nur kälter. **Wärme** fließt immer vom Warmen zum Kalten – hier ins Zimmer mit 20 °C. Zieh am Regler: Wie schnell kühlt die Tasse ab?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: 20 + 70*0.5^(x/h)
        x:
          - 0
          - 60
        y:
          - 0
          - 100
        sliders:
          - id: h
            label: Halbwertszeit (min)
            min: 5
            max: 30
            step: 5
            initial: 10

  - kind: problem
    id: hook
    widget: choice
    prompt: In heißer Suppe wird der Metalllöffel schnell heiß, der Holzlöffel kaum. Warum?
    params:
      options:
        - label: Metall leitet Wärme viel besser
          correct: true
        - label: Holz ist kälter
          feedback: Beide waren vorher gleich warm.
        - label: Metall erzeugt Wärme
          feedback: Es leitet sie nur weiter.
    hints:
      - Die Wärme wandert durch den Löffel.
    explanation: Das ist einer von drei Wegen, auf denen Wärme wandert.

  - kind: explain
    id: s1
    body: |
      Wärme fließt immer vom Warmen zum Kalten – auf drei Wegen: **Leitung** durch einen Stoff, **Strömung** mit bewegter Luft oder Flüssigkeit und **Strahlung**, die sogar durchs Vakuum geht.

  - kind: problem
    id: wege
    widget: buckets
    prompt: Welcher Weg ist das?
    params:
      buckets: [{ label: Leitung }, { label: Strömung }, { label: Strahlung }]
      items:
        - { label: Heißer Löffelstiel im Tee, bucket: Leitung }
        - { label: Warme Luft steigt über der Heizung, bucket: Strömung }
        - { label: Sonne wärmt die Erde, bucket: Strahlung }
        - { label: Lagerfeuer wärmt das Gesicht, bucket: Strahlung }
    hints:
      - Braucht der Weg einen Stoff dazwischen?
    explanation: Die Sonne erreicht uns durchs leere All – das schafft nur Strahlung.

  - kind: problem
    id: metall
    widget: choice
    prompt: Metall und Holz liegen im selben Raum. Warum fühlt sich das Metall kälter an?
    params:
      options:
        - { label: Es leitet die Wärme schneller aus der Hand., correct: true }
        - { label: Es ist wirklich kälter., feedback: "Beide haben Raumtemperatur." }
    hints:
      - Deine Hand misst nicht die Temperatur, sondern den Wärmefluss.
    explanation: Metall zieht die Wärme schnell aus der Haut – das fühlt sich kalt an.

  - kind: problem
    id: heizung
    widget: choice
    prompt: Warum hängen Heizkörper meist unter dem Fenster?
    params:
      options:
        - { label: Die warme Luft steigt auf und fängt die kalte Fensterluft ab., correct: true }
        - { label: Weil dort am meisten Platz ist., feedback: "Es hat einen physikalischen Grund – denk an Strömung." }
    hints:
      - Wohin bewegt sich warme Luft?
    explanation: Aufsteigende warme Luft bildet einen Vorhang vor dem kalten Glas.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Wärme fließt von selbst nur von warm nach kalt.
          right: true
        - text: Eine Decke erzeugt Wärme.
          right: false
          why: Sie bremst nur den Wärmeverlust deines Körpers.
        - text: Die Wärme der Sonne kommt als Strahlung durch das Vakuum.
          right: true
        - text: Kälte kriecht durch das offene Fenster herein.
          right: false
          why: Physikalisch fließt Wärme hinaus. Kälte ist nur fehlende Wärme.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Dein Tee hat 90 °C, das Zimmer 20 °C. Nach 10 Minuten hat der Tee nur noch 55 °C. Stelle die Halbwertszeit so ein, dass die Kurve den Punkt trifft.
    params:
      expr: 20 + 70*0.5^(x/h)
      x:
        - 0
        - 60
      y:
        - 0
        - 100
      showCoordinates: false
      sliders:
        - id: h
          label: Halbwertszeit (min)
          min: 5
          max: 30
          step: 5
          initial: 30
      markers:
        - x: 10
          y: 55
          label: 10 min
    answer:
      values:
        h: 10
    hints:
      - "Es zählt der Abstand zum Zimmer: am Anfang 70 Grad, nach 10 Minuten 35 Grad."
      - Der Abstand hat sich in 10 Minuten halbiert.
    explanation: Die Halbwertszeit ist 10 Minuten. Je näher der Tee an 20 °C kommt, desto langsamer kühlt er ab.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Warum fühlt sich 20 °C warmes **Wasser** viel kälter an als 20 °C warme **Luft**?
    params:
      options:
        - label: Wasser leitet Wärme etwa 25-mal besser ab
          correct: true
        - label: Das Wasser ist in Wahrheit kälter
          feedback: Beide haben dieselbe Temperatur.
        - label: Die Haut misst die Temperatur im Wasser falsch
          feedback: Sie misst gar keine Temperatur, sondern den Wärmestrom.
    hints:
      - Deine Haut spürt, wie schnell Wärme abfließt.
    explanation: Wir fühlen den **Wärmestrom**, nicht die Temperatur.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: An einem klaren Winterabend frierst du mehr als an einem bewölkten – bei gleicher Lufttemperatur. Warum?
    params:
      options:
        - label: Dein Körper strahlt Wärme ins kalte All ab, Wolken strahlen sie zurück.
          correct: true
        - label: Klare Luft leitet Wärme besser.
          feedback: Luft leitet in beiden Fällen schlecht. Hier geht es um Strahlung.
        - label: Wolken bestehen aus warmem Dampf.
          feedback: Wolken sind kalt. Aber sie sind wärmer als das All.
    hints:
      - Welcher Wärmeweg funktioniert auch durch leeren Raum?
      - "Was sieht deine Haut über sich: Wolke oder schwarzes All?"
    explanation: Jeder Körper strahlt. Der klare Himmel strahlt kaum zurück, eine Wolke schon. Darum gibt es nach klaren Nächten Bodenfrost.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Durch eine Dämmschicht fließt Wärme proportional zu Fläche und Temperaturunterschied, aber umgekehrt proportional zur Dicke. Du machst sie doppelt so dick. Auf welchen Bruchteil sinkt der Verlust?
    answer:
      value: 1/2
    feedback:
      - when: abs(numval(state.input) - 0.25) < 0.01
        misconception: square-thickness
        text: Die Dicke steht einfach im Nenner, nicht im Quadrat.
    hints:
      - "Umgekehrt proportional: doppelt so dick heißt …?"
      - Teile durch 2.
    explanation: "Doppelte Dicke halbiert den Verlust. Die nächsten Zentimeter bringen aber immer weniger: von 20 auf 40 cm spart man viel weniger als von 0 auf 20 cm."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Körper strahlt Wärme proportional zu $T^4$ ab (T in Kelvin). Die Temperatur verdoppelt sich. Wievielmal mehr strahlt er ab?
    answer:
      value: 16
    hints:
      - 2 hoch 4.
    explanation: 16-mal. Das **Stefan-Boltzmann-Gesetz** erklärt, warum heiße Sterne so viel heller sind.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Mensch hat 2 m² Haut mit 306 K. Das Zimmer hat 293 K. Netto strahlt er P = σ · A · (T₁⁴ − T₂⁴) ab, mit σ = 5,67 · 10⁻⁸ W/(m²·K⁴). Wie viel Watt?
    params:
      unit: W
    answer:
      value: 159
      tolerance: 5
    hints:
      - 306⁴ ≈ 8,77 · 10⁹ und 293⁴ ≈ 7,37 · 10⁹.
      - Differenz mal 5,67 · 10⁻⁸ mal 2.
    explanation: Etwa 160 W – mehr als dein Körper in Ruhe erzeugt (rund 100 W). Kleidung bremst die Strahlung, darum frierst du nackt schon bei 20 °C.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Ein Auto steht in der Sonne und wird innen viel heißer als die Luft draußen. Warum?
    params:
      options:
        - label: Glas lässt Sonnenlicht hinein, aber die Wärmestrahlung des Innenraums kaum hinaus.
          correct: true
        - label: Glas erzeugt Wärme.
          feedback: Glas erzeugt nichts. Es sortiert nur, welche Strahlung durchkommt.
        - label: Das Auto zieht Wärme aus dem Boden.
          feedback: Der Boden spielt kaum eine Rolle. Es geht um Strahlung durch die Scheiben.
    hints:
      - Sitze strahlen als warme Körper vor allem Infrarot ab.
      - Glas ist für sichtbares Licht durchsichtig, für Infrarot kaum.
    explanation: "Licht kommt herein, Infrarot bleibt drin, und die warme Luft kann nicht abströmen. Treibhausgase wirken ähnlich: Sie halten Wärmestrahlung der Erde zurück."
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux die drei Wege, auf denen eine Tasse Tee Wärme verliert.
    params:
      keywords:
        - - leit
          - conduct
          - tasse
          - cup
          - hand
        - - ström
          - convect
          - luft
          - air
          - dampf
          - steam
          - aufsteig
          - rise
        - - strahl
          - radiat
          - infrarot
          - infrared
      sample: Durch Leitung wandert Wärme durch die Tasse in die Hand und den Tisch. Durch Strömung steigt warme Luft und Dampf nach oben. Durch Strahlung gibt der Tee Infrarot in alle Richtungen ab.
    difficulty: 3

srs:
  cards_from: [wege, metall]
