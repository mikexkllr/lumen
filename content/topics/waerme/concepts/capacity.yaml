id: sci.heat.capacity
type: concept
title: Wärme speichern
summary: Warum Wasser so träge ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Volle Kanne, lange Wartezeit
    body: "Ein voller Wasserkocher braucht länger als ein halb leerer. Der Kocher heizt immer gleich stark. Zieh die Wassermenge hoch: Wie schnell steigt die **Temperatur** jetzt?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: 20 + 30*x/m
        x:
          - 0
          - 5
        y:
          - 0
          - 100
        sliders:
          - id: m
            label: Wasser (kg)
            min: 0.5
            max: 2.5
            step: 0.5
            initial: 0.5

  - kind: problem
    id: strand
    widget: choice
    prompt: Mittags am Strand ist der Sand glühend heiß, das Meer kühl. Warum?
    params:
      options:
        - { label: "Wasser braucht viel mehr Energie, um warm zu werden.", correct: true }
        - { label: Das Meer bekommt weniger Sonne., feedback: "Beide bekommen gleich viel Sonnenlicht." }
    hints:
      - Wer reagiert träger auf dieselbe Energie?
    explanation: Wasser hat eine riesige **Wärmekapazität** – es speichert viel Energie pro Grad.

  - kind: explain
    id: s2
    body: |
      Um 1 kg Wasser um 1 °C zu erwärmen, braucht man rund **4,2 kJ** – fünfmal so viel wie für Sand. Darum gleichen **Meere** das Klima aus und Wärmflaschen bleiben lange warm.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Wie viel Energie braucht man, um {{m}} kg Wasser um {{t}} °C zu erwärmen?
    params: { unit: kJ }
    answer: { value: "{{m * t * 42 / 10}}" }
    hints:
      - "4,2 · {{m}} · {{t}}."
    explanation: "4,2 · {{m}} · {{t}} = {{m * t * 42 / 10}} kJ."
    variants:
      params: { m: "int[1,5]", t: "choice[10,20,50]" }
      defaults: { m: 2, t: 10 }

  - kind: problem
    id: klima
    widget: choice
    prompt: Warum sind Winter an der Küste milder als im Landesinneren?
    params:
      options:
        - { label: Das Meer gibt gespeicherte Sommerwärme langsam ab., correct: true }
        - { label: An der Küste scheint öfter die Sonne., feedback: "Im Winter liegt es vor allem am Wärmespeicher Meer." }
    hints:
      - Was macht ein riesiger Wärmespeicher im Winter?
    explanation: Das Meer kühlt langsam ab und heizt die Küste mit.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Der Kocher heizt 1 kg Wasser in jeder Minute um 30 °C. Stelle die Wassermenge so ein, dass das Wasser nach 4 Minuten 80 °C hat.
    params:
      expr: 20 + 30*x/m
      x:
        - 0
        - 5
      y:
        - 0
        - 100
      showCoordinates: false
      sliders:
        - id: m
          label: Wasser (kg)
          min: 0.5
          max: 3
          step: 0.5
          initial: 0.5
      markers:
        - x: 4
          y: 80
          label: 4 min, 80 °C
    answer:
      values:
        m: 2
    hints:
      - Das Wasser soll um 60 °C wärmer werden.
      - Für 1 kg dauert das 2 Minuten. Wie viel Wasser braucht doppelt so lange?
    explanation: "2 kg Wasser: Doppelt so viel Wasser braucht doppelt so viel Energie für dieselben 60 Grad."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du mischst 2 kg Wasser von 80 °C mit 3 kg Wasser von 20 °C. Welche Temperatur stellt sich ein?
    params:
      unit: °C
    answer:
      value: 44
    hints:
      - "Gewichteter Mittelwert: (2 · 80 + 3 · 20) : 5."
    explanation: "220 : 5 = 44 °C. Die abgegebene Wärme ist gleich der aufgenommenen."
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Die **Wärmekapazität** c sagt, wie viel Energie 1 kg eines Stoffes für 1 Grad braucht. Allgemein gilt $Q = m \cdot c \cdot \Delta T$. Wasser hat c = 4,2 kJ pro kg und Grad.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Du gibst 2 kg Wasser {{q}} kJ Energie. Um wie viel Grad wird es wärmer?
    params:
      unit: °C
    answer:
      value: "{{q / 8.4}}"
    feedback:
      - when: abs(numval(state.input) - q / 4.2) < 0.01
        misconception: forgot-mass
        text: Das gilt für 1 kg. Hier sind es 2 kg – die Energie verteilt sich auf doppelt so viel Wasser.
    hints:
      - Stell Q = m · c · ΔT nach ΔT um.
      - "ΔT = {{q}} : (2 · 4,2)."
    explanation: "ΔT = {{q}} : 8,4 = {{q / 8.4}} °C. Doppelte Masse, halbe Erwärmung."
    difficulty: 2
    variants:
      params:
        q: choice[42,84,168,336]
      defaults:
        q: 84

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein 1-kg-Eisenblock (0,45 kJ pro kg und Grad) von 100 °C fällt in 1 kg Wasser von 20 °C (4,2 kJ). Welche Temperatur stellt sich ein? Auf ganze Grad.
    params:
      unit: °C
    answer:
      value: 28
      tolerance: 1
    hints:
      - 0,45 · (100 − T) = 4,2 · (T − 20).
    explanation: T ≈ 27,7 °C. Wasser nimmt fast zehnmal so viel Wärme auf wie Eisen – es gewinnt.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Ein Mensch (70 kg, c ≈ 3,5 kJ pro kg und Grad) erzeugt in Ruhe 100 W. Könnte er keine Wärme abgeben: Um wie viel Grad stiege seine Temperatur in einer Stunde?"
    params:
      unit: °C
    answer:
      value: 1.47
      tolerance: 0.05
    hints:
      - "In einer Stunde: 100 W · 3600 s = 360 kJ."
      - "ΔT = 360 : (70 · 3,5)."
    explanation: Fast 1,5 °C pro Stunde. Nach zwei Stunden hätte man schon Fieber. Schwitzen, Atmen und Strahlung müssen also ständig 100 W loswerden.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Über jedem m² Erde liegen 10 000 kg Luft mit 1 kJ pro kg und Grad. Wie viele Meter Meerwasser (4,2 kJ pro kg und Grad) speichern pro Grad genauso viel Wärme?
    params:
      unit: m
    answer:
      value: 2.4
      tolerance: 0.1
    hints:
      - Die Luftsäule braucht 10 000 kJ pro Grad.
      - Wie viel kg Wasser brauchen auch 10 000 kJ? 1 m Wasser auf 1 m² sind 1000 kg.
    explanation: "10 000 : 4,2 ≈ 2400 kg, also 2,4 m Wasser. Die obersten paar Meter Ozean speichern so viel Wärme wie die ganze Atmosphäre. Darum steckt der Großteil der Erderwärmung im Meer."
    difficulty: 3

srs:
  cards_from: [strand, rechnen]
