id: sci.heat.capacity
type: concept
title: Wärme speichern
summary: Warum Wasser so träge ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: strand
    widget: choice
    prompt: Mittags am Strand ist der Sand glühend heiß, das Meer kühl. Warum?
    params:
      options:
        - { label: "Wasser braucht viel mehr Energie, um warm zu werden.", correct: true }
        - { label: Das Meer bekommt weniger Sonne., feedback: "Beide bekommen gleich viel Sonnenlicht." }
    hints:
      - Wer reagiert träger auf dieselbe Energie?
    explanation: Wasser hat eine riesige **Wärmekapazität** – es speichert viel Energie pro Grad.

  - kind: explain
    id: s2
    body: |
      Um 1 kg Wasser um 1 °C zu erwärmen, braucht man rund **4,2 kJ** – fünfmal so viel wie für Sand. Darum gleichen Meere das Klima aus und Wärmflaschen bleiben lange warm.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Wie viel Energie braucht man, um {{m}} kg Wasser um {{t}} °C zu erwärmen?
    params: { unit: kJ }
    answer: { value: "{{m * t * 42 / 10}}" }
    hints:
      - "4,2 · {{m}} · {{t}}."
    explanation: "4,2 · {{m}} · {{t}} = {{m * t * 42 / 10}} kJ."
    variants:
      params: { m: "int[1,5]", t: "choice[10,20,50]" }
      defaults: { m: 2, t: 10 }

  - kind: problem
    id: klima
    widget: choice
    prompt: Warum sind Winter an der Küste milder als im Landesinneren?
    params:
      options:
        - { label: Das Meer gibt gespeicherte Sommerwärme langsam ab., correct: true }
        - { label: An der Küste scheint öfter die Sonne., feedback: "Im Winter liegt es vor allem am Wärmespeicher Meer." }
    hints:
      - Was macht ein riesiger Wärmespeicher im Winter?
    explanation: Das Meer kühlt langsam ab und heizt die Küste mit.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du mischst 2 kg Wasser von 80 °C mit 3 kg Wasser von 20 °C. Welche Temperatur stellt sich ein?
    params:
      unit: °C
    answer:
      value: 44
    hints:
      - "Gewichteter Mittelwert: (2 · 80 + 3 · 20) : 5."
    explanation: "220 : 5 = 44 °C. Die abgegebene Wärme ist gleich der aufgenommenen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein 1-kg-Eisenblock (0,45 kJ pro kg und Grad) von 100 °C fällt in 1 kg Wasser von 20 °C (4,2 kJ). Welche Temperatur stellt sich ein? Auf ganze Grad.
    params:
      unit: °C
    answer:
      value: 28
      tolerance: 1
    hints:
      - 0,45 · (100 − T) = 4,2 · (T − 20).
    explanation: T ≈ 27,7 °C. Wasser nimmt fast zehnmal so viel Wärme auf wie Eisen – es gewinnt.
    difficulty: 3

srs:
  cards_from: [strand, rechnen]
