id: sci.heat.transfer
type: concept
title: How Heat Travels
summary: Conduction, convection, radiation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The tea goes cold
    body: "Hot tea never gets hotter by itself, only colder. **Heat** always flows from warm to cold – here into a room at 20 °C. Drag the slider: how fast does the cup cool down?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: 20 + 70*0.5^(x/h)
        x:
          - 0
          - 60
        y:
          - 0
          - 100
        sliders:
          - id: h
            label: Half-life (min)
            min: 5
            max: 30
            step: 5
            initial: 10

  - kind: problem
    id: hook
    widget: choice
    prompt: In hot soup the metal spoon gets hot quickly, the wooden one hardly. Why?
    params:
      options:
        - label: Metal conducts heat far better
          correct: true
        - label: Wood is colder
          feedback: Both were equally warm before.
        - label: Metal produces heat
          feedback: It only passes it on.
    hints:
      - The heat travels through the spoon.
    explanation: That is one of three ways heat travels.

  - kind: explain
    id: s1
    body: |
      Heat always flows from warm to cold, in three ways: **conduction** through a material, **convection** with moving air or liquid, and **radiation**, which even works through a vacuum.

  - kind: problem
    id: wege
    widget: buckets
    prompt: Which path is it?
    params:
      buckets: [{ label: conduction }, { label: convection }, { label: radiation }]
      items:
        - { label: Hot spoon handle in tea, bucket: conduction }
        - { label: Warm air rising above a heater, bucket: convection }
        - { label: The Sun warming the Earth, bucket: radiation }
        - { label: A campfire warming your face, bucket: radiation }
    hints:
      - Does the path need a material in between?
    explanation: The Sun reaches us through empty space, which only radiation can do.

  - kind: problem
    id: metall
    widget: choice
    prompt: Metal and wood lie in the same room. Why does the metal feel colder?
    params:
      options:
        - { label: It conducts heat away from your hand faster., correct: true }
        - { label: It really is colder., feedback: "Both are at room temperature." }
    hints:
      - Your hand doesn't measure temperature, but heat flow.
    explanation: Metal pulls heat out of the skin quickly, and that feels cold.

  - kind: problem
    id: heizung
    widget: choice
    prompt: Why are radiators usually mounted under the window?
    params:
      options:
        - { label: Warm air rises and intercepts the cold air from the window., correct: true }
        - { label: Because there is the most space., feedback: "There is a physical reason. Think of convection." }
    hints:
      - Where does warm air move?
    explanation: Rising warm air forms a curtain in front of the cold glass.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Heat flows by itself only from warm to cold.
          right: true
        - text: A blanket produces heat.
          right: false
          why: It only slows the heat loss of your body.
        - text: The Sun’s heat comes through the vacuum as radiation.
          right: true
        - text: Cold creeps in through the open window.
          right: false
          why: Physically heat flows out. Cold is merely missing heat.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Your tea is at 90 °C, the room at 20 °C. After 10 minutes the tea is down to 55 °C. Set the half-life so that the curve hits the point.
    params:
      expr: 20 + 70*0.5^(x/h)
      x:
        - 0
        - 60
      y:
        - 0
        - 100
      showCoordinates: false
      sliders:
        - id: h
          label: Half-life (min)
          min: 5
          max: 30
          step: 5
          initial: 30
      markers:
        - x: 10
          y: 55
          label: 10 min
    answer:
      values:
        h: 10
    hints:
      - "What counts is the gap to the room: 70 degrees at the start, 35 degrees after 10 minutes."
      - The gap halved in 10 minutes.
    explanation: The half-life is 10 minutes. The closer the tea gets to 20 °C, the more slowly it cools.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Why does 20 °C **water** feel much colder than 20 °C **air**?
    params:
      options:
        - label: Water conducts heat away about 25 times better
          correct: true
        - label: The water is actually colder
          feedback: Both have the same temperature.
        - label: Skin measures temperature wrongly in water
          feedback: It measures no temperature at all, but heat flow.
    hints:
      - Your skin senses how fast heat flows away.
    explanation: We feel the **heat flow**, not the temperature.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: On a clear winter evening you feel colder than on a cloudy one – at the same air temperature. Why?
    params:
      options:
        - label: Your body radiates heat into cold space; clouds radiate it back.
          correct: true
        - label: Clear air conducts heat better.
          feedback: Air conducts poorly either way. This is about radiation.
        - label: Clouds are made of warm steam.
          feedback: Clouds are cold. But they are warmer than space.
    hints:
      - Which heat path works even through empty space?
      - "What does your skin see above: cloud or black space?"
    explanation: Every body radiates. A clear sky sends almost nothing back, a cloud does. That is why clear nights bring ground frost.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Heat flows through insulation in proportion to area and temperature difference, but inversely to thickness. You make it twice as thick. To what fraction does the loss fall?
    answer:
      value: 1/2
    feedback:
      - when: abs(numval(state.input) - 0.25) < 0.01
        misconception: square-thickness
        text: Thickness is simply in the denominator, not squared.
    hints:
      - "Inversely proportional: twice as thick means …?"
      - Divide by 2.
    explanation: "Double the thickness halves the loss. But each extra centimetre helps less: going from 20 to 40 cm saves much less than from 0 to 20 cm."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A body radiates heat in proportion to $T^4$ (T in kelvin). The temperature doubles. How many times more does it radiate?
    answer:
      value: 16
    hints:
      - 2 to the 4th.
    explanation: 16 times. The **Stefan–Boltzmann law** explains why hot stars are so much brighter.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A person has 2 m² of skin at 306 K. The room is at 293 K. Net radiation is P = σ · A · (T₁⁴ − T₂⁴), with σ = 5.67 · 10⁻⁸ W/(m²·K⁴). How many watts?
    params:
      unit: W
    answer:
      value: 159
      tolerance: 5
    hints:
      - 306⁴ ≈ 8.77 · 10⁹ and 293⁴ ≈ 7.37 · 10⁹.
      - Difference times 5.67 · 10⁻⁸ times 2.
    explanation: About 160 W – more than your body makes at rest (about 100 W). Clothes reduce the radiation, which is why you feel cold naked even at 20 °C.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: A car parked in the sun gets much hotter inside than the air outside. Why?
    params:
      options:
        - label: Glass lets sunlight in but hardly lets the heat radiation of the interior out.
          correct: true
        - label: Glass produces heat.
          feedback: Glass produces nothing. It only sorts which radiation gets through.
        - label: The car draws heat from the ground.
          feedback: The ground hardly matters. It is about radiation through the windows.
    hints:
      - As warm bodies the seats radiate mostly infrared.
      - Glass is transparent to visible light, hardly to infrared.
    explanation: "Light comes in, infrared stays inside, and the warm air cannot flow away. Greenhouse gases act in a similar way: they hold back Earth's heat radiation."
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux the three ways a cup of tea loses heat.
    params:
      keywords:
        - - leit
          - conduct
          - tasse
          - cup
          - hand
        - - ström
          - convect
          - luft
          - air
          - dampf
          - steam
          - aufsteig
          - rise
        - - strahl
          - radiat
          - infrarot
          - infrared
      sample: By conduction heat travels through the cup into your hand and the table. By convection warm air and steam rise. By radiation the tea gives off infrared in all directions.
    difficulty: 3

srs:
  cards_from: [wege, metall]
