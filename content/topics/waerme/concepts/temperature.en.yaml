id: sci.heat.temperature
type: concept
title: What Temperature Is
summary: Jiggling particles and kelvin.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: zappeln
    widget: choice
    prompt: What happens to the particles of a substance when it gets warmer?
    params:
      options:
        - { label: They move faster., correct: true }
        - { label: They get bigger., feedback: "The particles themselves don't grow. They move more vigorously." }
        - { label: There are more particles., feedback: "The number stays the same." }
    hints:
      - Think of a crowd getting wilder and wilder.
    explanation: Temperature is a measure of how vigorously the particles move.

  - kind: explain
    body: |
      At **−273 °C**, the particles are almost still, and nothing can be colder. This absolute zero is called **0 kelvin**. One kelvin step is as large as one degree Celsius: kelvin = degrees Celsius + 273.

  - kind: problem
    id: kelvin
    widget: numeric
    prompt: How many kelvin is {{c}} °C?
    params: { unit: K }
    answer: { value: "{{c + 273}}" }
    hints:
      - Add 273.
    explanation: "{{c}} + 273 = {{c + 273}} K."
    variants:
      params: { c: "int[-40,100]" }
      defaults: { c: 20 }

  - kind: problem
    id: kaelter
    widget: choice
    prompt: Is there anything colder than −273 °C?
    params:
      options:
        - { label: "No, nothing can be slower than standing still.", correct: true }
        - { label: "Yes, space is colder.", feedback: "Even space is about −270 °C, just above." }
    hints:
      - What does 0 kelvin mean for the motion of particles?
    explanation: 0 K is a true lower limit. You can come close to it but never reach it.

srs:
  cards_from: [kelvin, kaelter]
