id: sci.heat.insulation
type: concept
title: Holding Heat In
summary: Insulation, thermos flasks, heating costs.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: thermoskanne
    widget: match
    prompt: How does a thermos flask slow down each path of heat?
    params:
      pairs:
        - { left: Vacuum between the walls, right: No conduction or convection }
        - { left: Mirrored inner wall, right: Less radiation }
        - { left: Tight lid, right: No warm air escapes }
    hints:
      - A vacuum has no particles to carry heat.
    explanation: All three paths are slowed down, which is why tea stays hot for hours.

  - kind: explain
    body: |
      A house loses heat roughly in proportion to the **temperature difference** between inside and outside. Twice the difference means twice the loss.

  - kind: problem
    id: verlust
    widget: numeric
    prompt: At 20 °C inside and 0 °C outside, a house loses 1000 W. How much does it lose at {{a}} °C outside?
    params: { unit: W }
    answer: { value: "{{(20 - a) * 50}}" }
    hints:
      - "The difference is now {{20 - a}} degrees instead of 20."
    explanation: "{{20 - a}} ÷ 20 · 1000 = {{(20 - a) * 50}} W."
    variants:
      params: { a: "choice[-10,-5,5,10]" }
      defaults: { a: -10 }

  - kind: problem
    id: luft
    widget: choice
    prompt: Why do down jackets and double-pane windows insulate so well?
    params:
      options:
        - { label: "Trapped, still air conducts heat poorly.", correct: true }
        - { label: They produce heat themselves., feedback: "They produce nothing. They hold heat in." }
    hints:
      - What is between the down feathers and between the panes?
    explanation: Still air is a poor heat conductor, and that is exactly what makes good insulation.

srs:
  cards_from: [thermoskanne, verlust]
