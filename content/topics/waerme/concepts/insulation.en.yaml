id: sci.heat.insulation
type: concept
title: Holding Heat In
summary: Insulation, thermos flasks, heating costs.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: thermoskanne
    widget: match
    prompt: How does a thermos flask slow down each path of heat?
    params:
      pairs:
        - { left: Vacuum between the walls, right: No conduction or convection }
        - { left: Mirrored inner wall, right: Less radiation }
        - { left: Tight lid, right: No warm air escapes }
    hints:
      - A vacuum has no particles to carry heat.
    explanation: All three paths are slowed down, which is why tea stays hot for hours.

  - kind: explain
    id: s2
    body: |
      A house loses heat roughly in proportion to the **temperature difference** between inside and outside. Twice the difference means twice the loss.

  - kind: problem
    id: verlust
    widget: numeric
    prompt: At 20 °C inside and 0 °C outside, a house loses 1000 W. How much does it lose at {{a}} °C outside?
    params: { unit: W }
    answer: { value: "{{(20 - a) * 50}}" }
    hints:
      - "The difference is now {{20 - a}} degrees instead of 20."
    explanation: "{{20 - a}} ÷ 20 · 1000 = {{(20 - a) * 50}} W."
    variants:
      params: { a: "choice[-10,-5,5,10]" }
      defaults: { a: -10 }

  - kind: problem
    id: luft
    widget: choice
    prompt: Why do down jackets and double-pane windows insulate so well?
    params:
      options:
        - { label: "Trapped, still air conducts heat poorly.", correct: true }
        - { label: They produce heat themselves., feedback: "They produce nothing. They hold heat in." }
    hints:
      - What is between the down feathers and between the panes?
    explanation: Still air is a poor heat conductor, and that is exactly what makes good insulation.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A window loses 150 W, an equally large piece of insulated wall only 15 W. You replace the window by triple glazing with a third of the loss. How many watts do you save?
    params:
      unit: W
    answer:
      value: 100
    hints:
      - A third of 150 W remains.
    explanation: 150 − 50 = 100 W.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You make coffee and must wait 5 minutes. When do you add the cold milk so that it is as **hot** as possible at the end?
    params:
      options:
        - label: Right away
          correct: true
        - label: Only at the end
          feedback: Hot coffee loses heat faster. With milk the difference to the air is smaller.
        - label: It does not matter
          feedback: The cooling rate depends on the temperature difference.
    hints:
      - Heat loss grows with the temperature difference to the surroundings.
    explanation: "**Newton’s law of cooling**: the hotter, the faster the loss. Cooled early it loses less overall."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a down jacket keep you warm?"
    params:
      keywords:
        - - luft
          - air
        - - leit
          - conduct
          - isolier
          - insulat
          - dämm
        - - körper
          - body
          - wärme
          - heat
          - verlust
          - loss
      sample: The down traps lots of still air. Air conducts heat poorly, so the body’s heat stays in longer. The jacket produces no heat, it only slows the loss.
    difficulty: 3

srs:
  cards_from: [thermoskanne, verlust]
