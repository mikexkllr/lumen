id: sci.heat.capacity
type: concept
title: Storing Heat
summary: Why water is so slow to change.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: strand
    widget: choice
    prompt: At noon on the beach, the sand is scorching hot and the sea is cool. Why?
    params:
      options:
        - { label: "Water needs much more energy to warm up.", correct: true }
        - { label: The sea gets less sun., feedback: "Both get the same amount of sunlight." }
    hints:
      - Which one responds more slowly to the same energy?
    explanation: Water has a huge **heat capacity**. It stores a lot of energy per degree.

  - kind: explain
    id: s2
    body: |
      Warming 1 kg of water by 1 °C takes about **4.2 kJ**, five times as much as for sand. That is why **oceans** even out the climate and hot-water bottles stay warm for a long time.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: How much energy does it take to warm {{m}} kg of water by {{t}} °C?
    params: { unit: kJ }
    answer: { value: "{{m * t * 42 / 10}}" }
    hints:
      - "4.2 · {{m}} · {{t}}."
    explanation: "4.2 · {{m}} · {{t}} = {{m * t * 42 / 10}} kJ."
    variants:
      params: { m: "int[1,5]", t: "choice[10,20,50]" }
      defaults: { m: 2, t: 10 }

  - kind: problem
    id: klima
    widget: choice
    prompt: Why are winters milder on the coast than inland?
    params:
      options:
        - { label: The sea slowly releases stored summer heat., correct: true }
        - { label: The sun shines more often on the coast., feedback: "In winter, it is mainly the sea acting as a heat store." }
    hints:
      - What does a huge heat store do in winter?
    explanation: The sea cools slowly and heats the coast along with it.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You mix 2 kg of water at 80 °C with 3 kg at 20 °C. What temperature results?
    params:
      unit: °C
    answer:
      value: 44
    hints:
      - "Weighted mean: (2 · 80 + 3 · 20) ÷ 5."
    explanation: 220 ÷ 5 = 44 °C. The heat given off equals the heat taken up.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A 1 kg iron block (0.45 kJ per kg and degree) at 100 °C drops into 1 kg of water at 20 °C (4.2 kJ). What temperature results? To whole degrees.
    params:
      unit: °C
    answer:
      value: 28
      tolerance: 1
    hints:
      - 0.45 · (100 − T) = 4.2 · (T − 20).
    explanation: T ≈ 27.7 °C. Water absorbs almost ten times as much heat as iron – it wins.
    difficulty: 3

srs:
  cards_from: [strand, rechnen]
