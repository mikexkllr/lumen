id: sci.heat.capacity
type: concept
title: Storing Heat
summary: Why water is so slow to change.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: strand
    widget: choice
    prompt: At noon on the beach, the sand is scorching hot and the sea is cool. Why?
    params:
      options:
        - { label: "Water needs much more energy to warm up.", correct: true }
        - { label: The sea gets less sun., feedback: "Both get the same amount of sunlight." }
    hints:
      - Which one responds more slowly to the same energy?
    explanation: Water has a huge **heat capacity**. It stores a lot of energy per degree.

  - kind: explain
    id: s2
    body: |
      Warming 1 kg of water by 1 °C takes about **4.2 kJ**, five times as much as for sand. That is why **oceans** even out the climate and hot-water bottles stay warm for a long time.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: How much energy does it take to warm {{m}} kg of water by {{t}} °C?
    params: { unit: kJ }
    answer: { value: "{{m * t * 42 / 10}}" }
    hints:
      - "4.2 · {{m}} · {{t}}."
    explanation: "4.2 · {{m}} · {{t}} = {{m * t * 42 / 10}} kJ."
    variants:
      params: { m: "int[1,5]", t: "choice[10,20,50]" }
      defaults: { m: 2, t: 10 }

  - kind: problem
    id: klima
    widget: choice
    prompt: Why are winters milder on the coast than inland?
    params:
      options:
        - { label: The sea slowly releases stored summer heat., correct: true }
        - { label: The sun shines more often on the coast., feedback: "In winter, it is mainly the sea acting as a heat store." }
    hints:
      - What does a huge heat store do in winter?
    explanation: The sea cools slowly and heats the coast along with it.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You mix 2 kg of water at 80 °C with 3 kg at 20 °C. What temperature results?
    params:
      unit: °C
    answer:
      value: 44
    hints:
      - "Weighted mean: (2 · 80 + 3 · 20) ÷ 5."
    explanation: 220 ÷ 5 = 44 °C. The heat given off equals the heat taken up.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: The **specific heat capacity** c tells how much energy 1 kg of a substance needs for 1 degree. In general $Q = m \cdot c \cdot \Delta T$. Water has c = 4.2 kJ per kg and degree.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: You give 2 kg of water {{q}} kJ of energy. By how many degrees does it warm up?
    params:
      unit: °C
    answer:
      value: "{{q / 8.4}}"
    feedback:
      - when: abs(numval(state.input) - q / 4.2) < 0.01
        misconception: forgot-mass
        text: That holds for 1 kg. Here there are 2 kg – the energy is shared by twice as much water.
    hints:
      - Solve Q = m · c · ΔT for ΔT.
      - ΔT = {{q}} ÷ (2 · 4.2).
    explanation: ΔT = {{q}} ÷ 8.4 = {{q / 8.4}} °C. Double the mass, half the warming.
    difficulty: 2
    variants:
      params:
        q: choice[42,84,168,336]
      defaults:
        q: 84

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A 1 kg iron block (0.45 kJ per kg and degree) at 100 °C drops into 1 kg of water at 20 °C (4.2 kJ). What temperature results? To whole degrees.
    params:
      unit: °C
    answer:
      value: 28
      tolerance: 1
    hints:
      - 0.45 · (100 − T) = 4.2 · (T − 20).
    explanation: T ≈ 27.7 °C. Water absorbs almost ten times as much heat as iron – it wins.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "A person (70 kg, c ≈ 3.5 kJ per kg and degree) produces 100 W at rest. If he could not lose any heat: by how many degrees would his temperature rise in one hour?"
    params:
      unit: °C
    answer:
      value: 1.47
      tolerance: 0.05
    hints:
      - "In one hour: 100 W · 3600 s = 360 kJ."
      - ΔT = 360 ÷ (70 · 3.5).
    explanation: Almost 1.5 °C per hour. After two hours you would already have a fever. Sweating, breathing and radiation must constantly get rid of 100 W.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Above every m² of Earth there are 10,000 kg of air at 1 kJ per kg and degree. How many metres of sea water (4.2 kJ per kg and degree) store as much heat per degree?
    params:
      unit: m
    answer:
      value: 2.4
      tolerance: 0.1
    hints:
      - The air column needs 10,000 kJ per degree.
      - How many kg of water also need 10,000 kJ? 1 m of water on 1 m² is 1000 kg.
    explanation: 10,000 ÷ 4.2 ≈ 2400 kg, that is 2.4 m of water. The top few metres of ocean store as much heat as the whole atmosphere. That is why most global warming ends up in the sea.
    difficulty: 3

srs:
  cards_from: [strand, rechnen]
