id: sci.heat.insulation
type: concept
title: Wärme festhalten
summary: Dämmen, Thermoskanne, Heizkosten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: thermoskanne
    widget: match
    prompt: Wie bremst die Thermoskanne jeden Wärmeweg?
    params:
      pairs:
        - { left: Vakuum zwischen den Wänden, right: Keine Leitung und Strömung }
        - { left: Verspiegelte Innenwand, right: Weniger Strahlung }
        - { left: Fester Deckel, right: Keine warme Luft entweicht }
    hints:
      - Im Vakuum gibt es keine Teilchen, die Wärme tragen.
    explanation: Alle drei Wege werden gebremst – darum bleibt Tee stundenlang heiß.

  - kind: explain
    id: s2
    body: |
      Ein Haus verliert Wärme ungefähr im Verhältnis zum **Temperaturunterschied** zwischen innen und außen. Doppelt so großer Unterschied – doppelt so viel Verlust.

  - kind: problem
    id: verlust
    widget: numeric
    prompt: Bei 20 °C innen und 0 °C außen verliert ein Haus 1000 W. Wie viel sind es bei {{a}} °C außen?
    params: { unit: W }
    answer: { value: "{{(20 - a) * 50}}" }
    hints:
      - "Der Unterschied ist jetzt {{20 - a}} statt 20 Grad."
    explanation: "{{20 - a}} : 20 · 1000 = {{(20 - a) * 50}} W."
    variants:
      params: { a: "choice[-10,-5,5,10]" }
      defaults: { a: -10 }

  - kind: problem
    id: luft
    widget: choice
    prompt: Warum dämmen Daunenjacken und Doppelfenster so gut?
    params:
      options:
        - { label: "Eingeschlossene, ruhende Luft leitet Wärme schlecht.", correct: true }
        - { label: Sie erzeugen selbst Wärme., feedback: "Sie erzeugen nichts – sie halten fest." }
    hints:
      - Was steckt zwischen den Daunen und den Scheiben?
    explanation: Ruhende Luft ist ein schlechter Wärmeleiter – genau das macht gute Dämmung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Fenster verliert 150 W, ein gleich großes Stück gedämmte Wand nur 15 W. Du ersetzt das Fenster durch Dreifachglas mit einem Drittel Verlust. Wie viel Watt sparst du?
    params:
      unit: W
    answer:
      value: 100
    hints:
      - Ein Drittel von 150 W bleibt.
    explanation: 150 − 50 = 100 W.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du kochst Kaffee und musst 5 Minuten warten. Wann gibst du die kalte Milch dazu, damit er am Ende möglichst **heiß** ist?
    params:
      options:
        - label: Sofort
          correct: true
        - label: Erst am Ende
          feedback: Heißer Kaffee verliert schneller Wärme. Mit Milch ist der Unterschied zur Luft kleiner.
        - label: Das ist egal
          feedback: Die Abkühlrate hängt vom Temperaturunterschied ab.
    hints:
      - Der Wärmeverlust wächst mit dem Temperaturunterschied zur Umgebung.
    explanation: "**Newtons Abkühlungsgesetz**: Je heißer, desto schneller der Verlust. Früh abgekühlt verliert er insgesamt weniger."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum hält eine Daunenjacke warm?"
    params:
      keywords:
        - - luft
          - air
        - - leit
          - conduct
          - isolier
          - insulat
          - dämm
        - - körper
          - body
          - wärme
          - heat
          - verlust
          - loss
      sample: Die Daunen schließen viel ruhende Luft ein. Luft leitet Wärme schlecht, also bleibt die Wärme des Körpers länger drin. Die Jacke erzeugt keine Wärme, sie bremst nur den Verlust.
    difficulty: 3

srs:
  cards_from: [thermoskanne, verlust]
