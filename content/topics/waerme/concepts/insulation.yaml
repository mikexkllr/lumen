id: sci.heat.insulation
type: concept
title: Wärme festhalten
summary: Dämmen, Thermoskanne, Heizkosten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wärme durchs Fenster
    body: "Durch ein altes Fenster heizt du im Winter auch die Straße. Zieh am **U-Wert**: Einfachglas hat 5, ein modernes Fenster unter 1. Nach rechts wird es draußen wärmer – wie viel Wärme geht dann verloren?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: u*10*(20 - x)
        x:
          - -15
          - 20
        y:
          - 0
          - 2000
        sliders:
          - id: u
            label: U-Wert
            min: 0.5
            max: 5
            step: 0.5
            initial: 5

  - kind: problem
    id: thermoskanne
    widget: match
    prompt: Wie bremst die Thermoskanne jeden Wärmeweg?
    params:
      pairs:
        - { left: Vakuum zwischen den Wänden, right: Keine Leitung und Strömung }
        - { left: Verspiegelte Innenwand, right: Weniger Strahlung }
        - { left: Fester Deckel, right: Keine warme Luft entweicht }
    hints:
      - Im Vakuum gibt es keine Teilchen, die Wärme tragen.
    explanation: Alle drei Wege werden gebremst – darum bleibt Tee stundenlang heiß.

  - kind: explain
    id: s2
    body: |
      Ein Haus verliert Wärme ungefähr im Verhältnis zum **Temperaturunterschied** zwischen innen und außen. Doppelt so großer Unterschied – doppelt so viel Verlust.

  - kind: problem
    id: verlust
    widget: numeric
    prompt: Bei 20 °C innen und 0 °C außen verliert ein Haus 1000 W. Wie viel sind es bei {{a}} °C außen?
    params: { unit: W }
    answer: { value: "{{(20 - a) * 50}}" }
    hints:
      - "Der Unterschied ist jetzt {{20 - a}} statt 20 Grad."
    explanation: "{{20 - a}} : 20 · 1000 = {{(20 - a) * 50}} W."
    variants:
      params: { a: "choice[-10,-5,5,10]" }
      defaults: { a: -10 }

  - kind: problem
    id: luft
    widget: choice
    prompt: Warum dämmen Daunenjacken und Doppelfenster so gut?
    params:
      options:
        - { label: "Eingeschlossene, ruhende Luft leitet Wärme schlecht.", correct: true }
        - { label: Sie erzeugen selbst Wärme., feedback: "Sie erzeugen nichts – sie halten fest." }
    hints:
      - Was steckt zwischen den Daunen und den Scheiben?
    explanation: Ruhende Luft ist ein schlechter Wärmeleiter – genau das macht gute Dämmung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Fenster verliert 150 W, ein gleich großes Stück gedämmte Wand nur 15 W. Du ersetzt das Fenster durch Dreifachglas mit einem Drittel Verlust. Wie viel Watt sparst du?
    params:
      unit: W
    answer:
      value: 100
    hints:
      - Ein Drittel von 150 W bleibt.
    explanation: 150 − 50 = 100 W.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Der **U-Wert** sagt, wie viele Watt pro m² und pro Grad Temperaturunterschied durch ein Bauteil gehen. Kleiner U-Wert heißt gute Dämmung. Einfachglas hat etwa 5, Dreifachglas unter 1.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Ein Fenster hat 2 m² und den U-Wert {{u}} W/(m²·K). Innen sind es 20 °C, außen 0 °C. Wie viele Watt gehen verloren?
    params:
      unit: W
    answer:
      value: "{{40 * u}}"
    feedback:
      - when: numval(state.input) == 20 * u
        misconception: forgot-area
        text: Die Fläche ist 2 m² – mal 2 nehmen.
    hints:
      - Verlust = U · Fläche · Temperaturunterschied.
      - "{{u}} · 2 · 20 = ?"
    explanation: "{{u}} · 2 · 20 = {{40 * u}} W. Ein altes Einfachfenster verliert so viel wie eine kleine Heizung leistet."
    difficulty: 2
    variants:
      params:
        u: choice[1,3,5]
      defaults:
        u: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du kochst Kaffee und musst 5 Minuten warten. Wann gibst du die kalte Milch dazu, damit er am Ende möglichst **heiß** ist?
    params:
      options:
        - label: Sofort
          correct: true
        - label: Erst am Ende
          feedback: Heißer Kaffee verliert schneller Wärme. Mit Milch ist der Unterschied zur Luft kleiner.
        - label: Das ist egal
          feedback: Die Abkühlrate hängt vom Temperaturunterschied ab.
    hints:
      - Der Wärmeverlust wächst mit dem Temperaturunterschied zur Umgebung.
    explanation: "**Newtons Abkühlungsgesetz**: Je heißer, desto schneller der Verlust. Früh abgekühlt verliert er insgesamt weniger."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum hält eine Daunenjacke warm?"
    params:
      keywords:
        - - luft
          - air
        - - leit
          - conduct
          - isolier
          - insulat
          - dämm
        - - körper
          - body
          - wärme
          - heat
          - verlust
          - loss
      sample: Die Daunen schließen viel ruhende Luft ein. Luft leitet Wärme schlecht, also bleibt die Wärme des Körpers länger drin. Die Jacke erzeugt keine Wärme, sie bremst nur den Verlust.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Haus verliert 200 W pro Grad Unterschied zwischen innen und außen. Im Winter ist es 200 Tage lang draußen im Mittel 15 Grad kälter als drinnen. Wie viele kWh Heizenergie braucht es?
    params:
      unit: kWh
    answer:
      value: 14400
    feedback:
      - when: numval(state.input) == 600
        misconception: days-not-hours
        text: Das wären Kilowatt mal **Tage**. Ein Tag hat 24 Stunden.
    hints:
      - "Mittlere Verlustleistung: 200 W · 15 = 3 kW."
      - "Zeit: 200 Tage · 24 h = 4800 h."
    explanation: 3 kW · 4800 h = 14 400 kWh. Mit Öl wären das rund 1400 Liter. Halbiert Dämmung die 200 W, halbieren sich auch die Kosten.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Im Winter beschlägt ein altes Fenster mit einer Scheibe innen. Ein Fenster mit zwei Scheiben kaum. Warum?
    params:
      options:
        - label: Die innere Scheibe bleibt wärmer und kühlt die Raumluft nicht unter den Taupunkt ab.
          correct: true
        - label: Doppelfenster lassen keine Feuchtigkeit durch.
          feedback: Der Wasserdampf kommt aus dem Raum. Entscheidend ist, wie kalt die Scheibe ist.
        - label: Zwischen den Scheiben ist ein Trockenmittel.
          feedback: Das hält nur den Spalt trocken. Innen beschlägt Glas, wenn es kalt ist.
    hints:
      - "Wo bildet sich Tau: an warmen oder kalten Flächen?"
      - Wie warm ist die innere Scheibe bei guter Dämmung?
    explanation: Kalte Flächen kühlen die Luft daneben ab, bis ihr Wasserdampf kondensiert. Die gut gedämmte Innenscheibe ist fast so warm wie der Raum.
    difficulty: 3

srs:
  cards_from: [thermoskanne, verlust]
