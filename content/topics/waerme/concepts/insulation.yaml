id: sci.heat.insulation
type: concept
title: Wärme festhalten
summary: Dämmen, Thermoskanne, Heizkosten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: thermoskanne
    widget: match
    prompt: Wie bremst die Thermoskanne jeden Wärmeweg?
    params:
      pairs:
        - { left: Vakuum zwischen den Wänden, right: Keine Leitung und Strömung }
        - { left: Verspiegelte Innenwand, right: Weniger Strahlung }
        - { left: Fester Deckel, right: Keine warme Luft entweicht }
    hints:
      - Im Vakuum gibt es keine Teilchen, die Wärme tragen.
    explanation: Alle drei Wege werden gebremst – darum bleibt Tee stundenlang heiß.

  - kind: explain
    body: |
      Ein Haus verliert Wärme ungefähr im Verhältnis zum **Temperaturunterschied** zwischen innen und außen. Doppelt so großer Unterschied – doppelt so viel Verlust.

  - kind: problem
    id: verlust
    widget: numeric
    prompt: Bei 20 °C innen und 0 °C außen verliert ein Haus 1000 W. Wie viel sind es bei {{a}} °C außen?
    params: { unit: W }
    answer: { value: "{{(20 - a) * 50}}" }
    hints:
      - "Der Unterschied ist jetzt {{20 - a}} statt 20 Grad."
    explanation: "{{20 - a}} : 20 · 1000 = {{(20 - a) * 50}} W."
    variants:
      params: { a: "choice[-10,-5,5,10]" }
      defaults: { a: -10 }

  - kind: problem
    id: luft
    widget: choice
    prompt: Warum dämmen Daunenjacken und Doppelfenster so gut?
    params:
      options:
        - { label: "Eingeschlossene, ruhende Luft leitet Wärme schlecht.", correct: true }
        - { label: Sie erzeugen selbst Wärme., feedback: "Sie erzeugen nichts – sie halten fest." }
    hints:
      - Was steckt zwischen den Daunen und den Scheiben?
    explanation: Ruhende Luft ist ein schlechter Wärmeleiter – genau das macht gute Dämmung.

srs:
  cards_from: [thermoskanne, verlust]
