id: sci.heat.phase
type: concept
title: Schmelzen und Verdampfen
summary: Wärme, die nicht wärmer macht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: kochen
    widget: choice
    prompt: Wasser kocht. Du drehst die Herdplatte höher. Was passiert mit der Wassertemperatur?
    params:
      options:
        - { label: Sie bleibt bei 100 °C., correct: true }
        - { label: Sie steigt weiter., feedback: "Die zusätzliche Energie geht ins Verdampfen, nicht in mehr Hitze." }
    hints:
      - Wofür wird die Energie beim Sieden gebraucht?
    explanation: Es verdampft nur schneller. Die Energie löst Teilchen aus der Flüssigkeit.

  - kind: explain
    id: s2
    body: |
      Beim **Schmelzen** und **Verdampfen** steckt die Energie im Lösen der Teilchen voneinander. Die Temperatur bleibt so lange gleich, bis alles umgewandelt ist.

  - kind: problem
    id: phasen
    widget: order
    prompt: Bring die Zustände in die Reihenfolge beim Erwärmen.
    params:
      items:
        - { label: Eis }
        - { label: Wasser }
        - { label: Wasserdampf }
    hints:
      - Von fest über flüssig zu gasförmig.
    explanation: Fest, flüssig, gasförmig – mit jeder Stufe bewegen sich die Teilchen freier.

  - kind: problem
    id: schwitzen
    widget: choice
    prompt: Warum kühlt Schwitzen?
    params:
      options:
        - { label: Verdunstender Schweiß nimmt Wärme von der Haut mit., correct: true }
        - { label: Schweiß ist kälter als die Haut., feedback: "Schweiß kommt warm aus dem Körper – das Verdunsten kühlt." }
    hints:
      - Wofür braucht Verdunsten Energie?
    explanation: Jedes verdunstende Wassermolekül nimmt Energie mit – die Haut kühlt ab.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Beim Schmelzen bleibt die Temperatur [[gleich]], obwohl Energie zugeführt wird. Die Energie löst die [[Bindungen]] zwischen den Teilchen.
      distractors:
        - höher
        - Atome

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Um 1 kg Wasser zu verdampfen, braucht man 2260 kJ. Um es von 0 auf 100 °C zu erwärmen, 420 kJ. Wievielmal mehr kostet das Verdampfen? Auf eine Stelle.
    answer:
      value: 5.4
      tolerance: 0.1
    hints:
      - "2260 : 420."
    explanation: Gut fünfmal so viel. Darum ist Dampf so gefährlich – und Schwitzen so wirksam.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Auf dem Mount Everest kocht Wasser schon bei 70 °C. Warum?
    params:
      options:
        - label: Der geringere Luftdruck lässt die Teilchen leichter entweichen
          correct: true
        - label: Weil es dort oben kälter ist
          feedback: Die Außentemperatur ändert den Siedepunkt nicht – der Druck schon.
        - label: Weil das Wasser dort reiner ist
          feedback: Reinheit ändert den Siedepunkt kaum.
    hints:
      - "Im Schnellkochtopf ist es umgekehrt: mehr Druck, höherer Siedepunkt."
    explanation: Der Siedepunkt hängt vom Druck ab. Nudeln brauchen dort oben viel länger.
    difficulty: 3

srs:
  cards_from: [kochen, schwitzen]
