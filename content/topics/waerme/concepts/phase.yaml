id: sci.heat.phase
type: concept
title: Schmelzen und Verdampfen
summary: Wärme, die nicht wärmer macht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Versteckte Wärme
    body: "Wasser reist ständig zwischen Meer, Wolke und Gletscher. Bei jedem Wechsel wandert viel Energie mit. Deck den Kreislauf auf: Wann schluckt Wasser **Wärme**, wann gibt es sie ab?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: ☀️
            front: Verdunsten
            back: Die Sonne lässt Meerwasser verdunsten. Dabei schluckt es riesige Mengen Wärme.
          - icon: ⛈️
            front: Wolken
            back: Wird der Dampf wieder flüssig, gibt er diese Wärme frei. Sie treibt Gewitter an.
          - icon: ❄️
            front: Schnee
            back: Gefriert das Wasser, gibt es noch einmal Wärme ab.
          - icon: 🏔️
            front: Schmelze
            back: Im Frühling schluckt das Schmelzen wieder Wärme. Dann fließt alles zurück ins Meer.

  - kind: problem
    id: kochen
    widget: choice
    prompt: Wasser kocht. Du drehst die Herdplatte höher. Was passiert mit der Wassertemperatur?
    params:
      options:
        - { label: Sie bleibt bei 100 °C., correct: true }
        - { label: Sie steigt weiter., feedback: "Die zusätzliche Energie geht ins Verdampfen, nicht in mehr Hitze." }
    hints:
      - Wofür wird die Energie beim Sieden gebraucht?
    explanation: Es verdampft nur schneller. Die Energie löst Teilchen aus der Flüssigkeit.

  - kind: explain
    id: s2
    body: |
      Beim **Schmelzen** und **Verdampfen** steckt die Energie im Lösen der Teilchen voneinander. Die Temperatur bleibt so lange gleich, bis alles umgewandelt ist.

  - kind: problem
    id: phasen
    widget: order
    prompt: Bring die Zustände in die Reihenfolge beim Erwärmen.
    params:
      items:
        - { label: Eis }
        - { label: Wasser }
        - { label: Wasserdampf }
    hints:
      - Von fest über flüssig zu gasförmig.
    explanation: Fest, flüssig, gasförmig – mit jeder Stufe bewegen sich die Teilchen freier.

  - kind: problem
    id: schwitzen
    widget: choice
    prompt: Warum kühlt Schwitzen?
    params:
      options:
        - { label: Verdunstender Schweiß nimmt Wärme von der Haut mit., correct: true }
        - { label: Schweiß ist kälter als die Haut., feedback: "Schweiß kommt warm aus dem Körper – das Verdunsten kühlt." }
    hints:
      - Wofür braucht Verdunsten Energie?
    explanation: Jedes verdunstende Wassermolekül nimmt Energie mit – die Haut kühlt ab.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Beim Schmelzen bleibt die Temperatur [[gleich]], obwohl Energie zugeführt wird. Die Energie löst die [[Bindungen]] zwischen den Teilchen.
      distractors:
        - höher
        - Atome

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Um 1 kg Wasser zu verdampfen, braucht man 2260 kJ. Um es von 0 auf 100 °C zu erwärmen, 420 kJ. Wievielmal mehr kostet das Verdampfen? Auf eine Stelle.
    answer:
      value: 5.4
      tolerance: 0.1
    hints:
      - "2260 : 420."
    explanation: Gut fünfmal so viel. Darum ist Dampf so gefährlich – und Schwitzen so wirksam.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Um 1 kg Eis zu schmelzen, braucht man 334 kJ. Um wie viel Grad könnte man mit derselben Energie 1 kg Wasser erwärmen?
    params:
      unit: °C
    answer:
      value: 80
      tolerance: 1
    hints:
      - Wasser braucht 4,2 kJ pro kg und Grad.
      - "334 : 4,2 = ?"
    explanation: "Rund 80 °C! Darum kühlen Eiswürfel so stark: Allein ihr Schmelzen schluckt so viel Energie, wie Wasser von 0 auf 80 °C braucht."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Warum verbrüht Dampf von 100 °C die Haut schlimmer als Wasser von 100 °C?
    params:
      options:
        - label: Dampf kondensiert auf der Haut und gibt dabei viel Verdampfungswärme ab.
          correct: true
        - label: Dampf ist in Wahrheit heißer.
          feedback: Beide haben hier 100 °C. Es ist die versteckte Wärme.
        - label: Dampf dringt tiefer ein.
          feedback: Die Haut wird nicht durchdrungen. Es liegt an der Energie beim Kondensieren.
    hints:
      - Was passiert mit Dampf, der auf kalte Haut trifft?
      - Beim Verdampfen steckt man 2260 kJ pro kg hinein. Wo bleiben sie?
    explanation: Beim Kondensieren werden die 2260 kJ pro kg wieder frei – direkt auf der Haut. Das ist über fünfmal so viel wie beim Abkühlen von 100 auf 0 °C.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Auf dem Mount Everest kocht Wasser schon bei 70 °C. Warum?
    params:
      options:
        - label: Der geringere Luftdruck lässt die Teilchen leichter entweichen
          correct: true
        - label: Weil es dort oben kälter ist
          feedback: Die Außentemperatur ändert den Siedepunkt nicht – der Druck schon.
        - label: Weil das Wasser dort reiner ist
          feedback: Reinheit ändert den Siedepunkt kaum.
    hints:
      - "Im Schnellkochtopf ist es umgekehrt: mehr Druck, höherer Siedepunkt."
    explanation: Der Siedepunkt hängt vom Druck ab. Nudeln brauchen dort oben viel länger.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Du wirfst 100 g Eis von 0 °C in 400 g Wasser von 30 °C. Welche Temperatur hat das Wasser, wenn alles geschmolzen ist? Schmelzwärme 334 kJ/kg, c = 4,2 kJ/(kg·K). Auf eine Stelle.
    params:
      unit: °C
    answer:
      value: 8.1
      tolerance: 0.3
    feedback:
      - when: abs(numval(state.input) - 24) < 0.3
        misconception: forgot-latent
        text: Das wäre ohne Schmelzen gerechnet. Das Schmelzen schluckt zuerst 33,4 kJ.
    hints:
      - "Das warme Wasser gibt ab: 0,4 · 4,2 · (30 − T)."
      - "Das Eis nimmt auf: 33,4 kJ zum Schmelzen plus 0,1 · 4,2 · T."
    explanation: 50,4 − 1,68 T = 33,4 + 0,42 T ergibt 17 = 2,1 T, also T ≈ 8,1 °C. Ohne die Schmelzwärme kämen 24 °C heraus.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: "Oft hört man: »Eis ist glatt, weil der Druck der Kufe es schmilzt.« Warum reicht das nicht als Erklärung?"
    params:
      options:
        - label: Der Druck senkt den Schmelzpunkt nur um wenige Grad – auch bei −20 °C ist Eis glatt.
          correct: true
        - label: Druck erhöht den Schmelzpunkt von Eis.
          feedback: Bei Eis senkt Druck den Schmelzpunkt – nur viel zu wenig.
        - label: Kufen sind zu leicht, um Druck auszuüben.
          feedback: Der Druck unter der schmalen Kufe ist groß. Er reicht trotzdem nicht.
    hints:
      - Wie stark müsste der Druck den Schmelzpunkt senken?
      - Selbst hoher Druck schafft nur wenige Grad.
    explanation: Wichtiger sind eine dünne, flüssigkeitsähnliche Schicht an der Eisoberfläche und Reibungswärme. Die genaue Erklärung wird bis heute erforscht.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum wird kochendes Wasser nicht heißer als 100 °C, obwohl die Platte weiter heizt?"
    params:
      keywords:
        - - verdampf
          - vapor
          - evapor
          - dampf
          - steam
          - boil
        - - energie
          - energy
          - wärme
          - heat
        - - lösen
          - break
          - trenn
          - separat
          - teilchen
          - particle
          - molek
      sample: Die zugeführte Energie macht das Wasser nicht wärmer, sondern verdampft es. Sie trennt die Teilchen voneinander, bis sie als Dampf davonfliegen. Erst wenn alles verdampft ist, könnte die Temperatur weiter steigen.
    difficulty: 3

srs:
  cards_from: [kochen, schwitzen]
