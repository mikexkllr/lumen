id: sci.heat.phase
type: concept
title: Melting and Evaporating
summary: Heat that doesn't make things warmer.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: kochen
    widget: choice
    prompt: Water is boiling. You turn the burner higher. What happens to the water temperature?
    params:
      options:
        - { label: It stays at 100 °C., correct: true }
        - { label: It keeps rising., feedback: "The extra energy goes into evaporating, not into more heat." }
    hints:
      - What is the energy needed for during boiling?
    explanation: It just evaporates faster. The energy frees particles from the liquid.

  - kind: explain
    body: |
      When something **melts** or **evaporates**, the energy pulls particles apart. The temperature stays put until all of it has changed.

  - kind: problem
    id: phasen
    widget: order
    prompt: Put the states in the order they occur when heating.
    params:
      items:
        - { label: Ice }
        - { label: Water }
        - { label: Steam }
    hints:
      - From solid through liquid to gas.
    explanation: Solid, liquid, gas. With each step, the particles move more freely.

  - kind: problem
    id: schwitzen
    widget: choice
    prompt: Why does sweating cool you down?
    params:
      options:
        - { label: Evaporating sweat takes heat away from the skin., correct: true }
        - { label: Sweat is colder than the skin., feedback: "Sweat comes out of the body warm. The evaporation does the cooling." }
    hints:
      - What does evaporating need energy for?
    explanation: Each evaporating water molecule takes energy with it, and the skin cools.

srs:
  cards_from: [kochen, schwitzen]
