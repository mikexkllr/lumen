id: sci.heat.phase
type: concept
title: Melting and Evaporating
summary: Heat that doesn't make things warmer.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Hidden heat
    body: "Water keeps travelling between sea, cloud and glacier. Each change carries a lot of energy. Uncover the cycle: when does water swallow **heat**, and when does it give it off?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: ☀️
            front: Evaporating
            back: The Sun makes sea water evaporate. In doing so it swallows huge amounts of heat.
          - icon: ⛈️
            front: Clouds
            back: When the vapour turns liquid again, it releases this heat. It powers thunderstorms.
          - icon: ❄️
            front: Snow
            back: When the water freezes, it gives off heat once more.
          - icon: 🏔️
            front: Thaw
            back: In spring, melting swallows heat again. Then everything flows back to the sea.

  - kind: problem
    id: kochen
    widget: choice
    prompt: Water is boiling. You turn the burner higher. What happens to the water temperature?
    params:
      options:
        - { label: It stays at 100 °C., correct: true }
        - { label: It keeps rising., feedback: "The extra energy goes into evaporating, not into more heat." }
    hints:
      - What is the energy needed for during boiling?
    explanation: It just evaporates faster. The energy frees particles from the liquid.

  - kind: explain
    id: s2
    body: |
      When something **melts** or **evaporates**, the energy pulls particles apart. The temperature stays put until all of it has changed.

  - kind: problem
    id: phasen
    widget: order
    prompt: Put the states in the order they occur when heating.
    params:
      items:
        - { label: Ice }
        - { label: Water }
        - { label: Steam }
    hints:
      - From solid through liquid to gas.
    explanation: Solid, liquid, gas. With each step, the particles move more freely.

  - kind: problem
    id: schwitzen
    widget: choice
    prompt: Why does sweating cool you down?
    params:
      options:
        - { label: Evaporating sweat takes heat away from the skin., correct: true }
        - { label: Sweat is colder than the skin., feedback: "Sweat comes out of the body warm. The evaporation does the cooling." }
    hints:
      - What does evaporating need energy for?
    explanation: Each evaporating water molecule takes energy with it, and the skin cools.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: During melting the temperature stays [[constant]] although energy is added. The energy loosens the [[bonds]] between the particles.
      distractors:
        - higher
        - atoms

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Evaporating 1 kg of water takes 2260 kJ. Heating it from 0 to 100 °C takes 420 kJ. How many times more does evaporation cost? To one place.
    answer:
      value: 5.4
      tolerance: 0.1
    hints:
      - 2260 ÷ 420.
    explanation: More than five times as much. That is why steam is so dangerous – and sweating so effective.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Melting 1 kg of ice takes 334 kJ. By how many degrees could the same energy warm 1 kg of water?
    params:
      unit: °C
    answer:
      value: 80
      tolerance: 1
    hints:
      - Water needs 4.2 kJ per kg and degree.
      - 334 ÷ 4.2 = ?
    explanation: "About 80 °C! That is why ice cubes cool so well: melting alone swallows as much energy as heating water from 0 to 80 °C."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Why does steam at 100 °C scald the skin worse than water at 100 °C?
    params:
      options:
        - label: Steam condenses on the skin and releases a lot of heat of vaporisation.
          correct: true
        - label: Steam is really hotter.
          feedback: Both are at 100 °C here. It is the hidden heat.
        - label: Steam penetrates deeper.
          feedback: The skin is not penetrated. It is the energy released on condensing.
    hints:
      - What happens to steam hitting cool skin?
      - Vaporising puts 2260 kJ per kg in. Where does it go?
    explanation: On condensing the 2260 kJ per kg are released again – right on the skin. That is over five times as much as cooling from 100 to 0 °C.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: On Mount Everest water already boils at 70 °C. Why?
    params:
      options:
        - label: The lower air pressure lets the particles escape more easily
          correct: true
        - label: Because it is colder up there
          feedback: The outside temperature does not change the boiling point – pressure does.
        - label: Because the water is purer there
          feedback: Purity hardly changes the boiling point.
    hints:
      - "In a pressure cooker it is the other way round: more pressure, higher boiling point."
    explanation: The boiling point depends on pressure. Pasta takes much longer up there.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: You drop 100 g of ice at 0 °C into 400 g of water at 30 °C. What is the temperature once everything has melted? Heat of fusion 334 kJ/kg, c = 4.2 kJ/(kg·K). To one decimal place.
    params:
      unit: °C
    answer:
      value: 8.1
      tolerance: 0.3
    feedback:
      - when: abs(numval(state.input) - 24) < 0.3
        misconception: forgot-latent
        text: That ignores melting. Melting swallows 33.4 kJ first.
    hints:
      - "The warm water gives off: 0.4 · 4.2 · (30 − T)."
      - "The ice takes: 33.4 kJ to melt plus 0.1 · 4.2 · T."
    explanation: 50.4 − 1.68 T = 33.4 + 0.42 T gives 17 = 2.1 T, so T ≈ 8.1 °C. Without the heat of fusion you would get 24 °C.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: "People often say: »Ice is slippery because the pressure of the blade melts it.« Why is that not enough of an explanation?"
    params:
      options:
        - label: Pressure lowers the melting point by only a few degrees – ice is slippery even at −20 °C.
          correct: true
        - label: Pressure raises the melting point of ice.
          feedback: For ice pressure lowers the melting point – just far too little.
        - label: Blades are too light to exert pressure.
          feedback: The pressure under the narrow blade is large. It still is not enough.
    hints:
      - How far would pressure have to lower the melting point?
      - Even high pressure manages only a few degrees.
    explanation: More important are a thin liquid-like layer on the ice surface and frictional heat. The exact explanation is still being researched.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: "Explain to Lux: why does boiling water get no hotter than 100 °C although the hob keeps heating?"
    params:
      keywords:
        - - verdampf
          - vapor
          - evapor
          - dampf
          - steam
          - boil
        - - energie
          - energy
          - wärme
          - heat
        - - lösen
          - break
          - trenn
          - separat
          - teilchen
          - particle
          - molek
      sample: The energy added does not make the water hotter; it boils it away. It separates the particles until they fly off as steam. Only when all of it has boiled could the temperature rise further.
    difficulty: 3

srs:
  cards_from: [kochen, schwitzen]
