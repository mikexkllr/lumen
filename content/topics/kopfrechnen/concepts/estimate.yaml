id: math.mental.estimate
type: concept
title: Überschlagen
summary: Größenordnungen sicher einschätzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zu Fuß zum Mond
    body: Stell dir vor, du läufst zum Mond. Wie lange dauert das? Genau rechnet das niemand – grob reicht völlig. Deck die Schritte nacheinander auf. Mit runden Zahlen gelingt jeder **Überschlag**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🌕
            front: Wie weit ist der Mond?
            back: Rund 400 000 km – auf eine Stelle gerundet.
          - icon: 👟
            front: Wie lang ist ein Schritt?
            back: Grob 1 m – so bleibt die Rechnung leicht.
          - icon: 🔢
            front: Wie viele Schritte?
            back: 400 000 km sind 400 Millionen Meter – also 400 Millionen Schritte.
          - icon: ⏳
            front: Wie lange dauert das?
            back: "Bei 10 000 Schritten am Tag: 40 000 Tage – über 100 Jahre."

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie oft atmest du an einem Tag?"
    params:
      min: 1000
      max: 1000000
      scale: log
    answer:
      value: 22000
      within: 45
    explanation: Etwa 15 Atemzüge pro Minute mal 1440 Minuten sind rund 22 000.

  - kind: problem
    id: groessenordnung
    widget: choice
    prompt: Ist 398 · 21 ungefähr 800, 8 000 oder 80 000?
    params:
      layout: grid
      options:
        - { label: "8 000", correct: true }
        - { label: "800", feedback: "Zu klein. 400 · 20 hat schon vier Stellen." }
        - { label: "80 000", feedback: "Zu groß. Rechne 400 · 20." }
    hints:
      - Runde beide Zahlen.
    explanation: 400 · 20 = 8000. Genau sind es 8358.

  - kind: explain
    id: s2
    body: |
      **Überschlag:** Runde auf eine Stelle und rechne damit.
      398 · 21 ≈ 400 · 20 = 8000. So fallen falsche Ergebnisse sofort auf.

  - kind: problem
    id: ueberschlag
    widget: numeric
    prompt: Überschlage – {{a}} · {{b}}. Ungefähr genügt.
    params: { placeholder: "ungefähr" }
    answer: { value: "{{a * b}}", tolerance: "{{round(a * b * 0.15)}}" }
    hints:
      - "Runde {{a}} und {{b}} auf eine Stelle."
    explanation: "Genau sind es {{a * b}}."
    variants:
      params: { a: "int[31,89]", b: "int[21,79]" }
      defaults: { a: 49, b: 61 }

  - kind: problem
    id: einkauf
    widget: choice
    prompt: Dein Einkauf – 4,95 €, 12,10 €, 2,89 € und 7,05 €. Reichen 25 €?
    params:
      options:
        - { label: Nein, correct: true }
        - { label: Ja, feedback: "Runde – 5 + 12 + 3 + 7 = 27." }
    hints:
      - Runde jeden Preis auf ganze Euro.
    explanation: Gerundet 5 + 12 + 3 + 7 = 27 €. Genau sind es 26,99 €.

  - kind: explain
    id: s5
    body: Wie oft schlägt ein Herz in einem Menschenleben – grob?
    reveal:
      body: 70-mal pro Minute · 60 · 24 · 365 · 80 Jahre ≈ 3 Milliarden. Solche **Fermi-Schätzungen** helfen, Größen zu fühlen.

  - kind: problem
    id: sekunden
    widget: choice
    prompt: Wie viele Sekunden hat ein Jahr ungefähr?
    params:
      options:
        - { label: Rund 30 Millionen, correct: true }
        - { label: Rund 3 Millionen, feedback: "Zu wenig. Ein Tag hat schon über 86 000 Sekunden." }
        - { label: Rund 300 Millionen, feedback: "Zu viel. Rechne 90 000 · 365." }
    hints:
      - Ein Tag hat rund 90 000 Sekunden.
    explanation: 86 400 · 365 ≈ 31,5 Millionen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 49 · 31 ist ungefähr 1500.
          right: true
        - text: 7,9 · 0,52 ist ungefähr 40.
          right: false
          why: 8 · 0,5 = 4. Mal 0,5 halbiert.
        - text: "612 : 19 ist ungefähr 30."
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Fermi-Frage: Du trinkst etwa 2 Liter am Tag. Wie viele Liter sind das in 80 Jahren – grob?"
    params:
      unit: l
    answer:
      value: 58400
      tolerance: 12000
    hints:
      - 2 Liter mal 365 Tage sind rund 700 Liter im Jahr.
    explanation: 700 · 80 ≈ 56 000 Liter – ein kleines Schwimmbecken.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Haare hat ein Mensch auf dem Kopf?"
    params:
      min: 1000
      max: 10000000
      scale: log
    answer:
      value: 100000
      within: 50
    explanation: Etwa 100 000. Rund 2 Haare pro mm² mal etwa 600 cm² Kopfhaut ergibt gut 100 000.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Wie viele Minuten hat eine Woche?
    answer:
      value: 10080
    feedback:
      - when: numval(state.input) == 168
        misconception: unit-step
        text: Das sind die Stunden. Jede Stunde hat 60 Minuten.
    hints:
      - "Erst die Stunden: 7 · 24."
      - 168 Stunden mal 60.
    explanation: 7 · 24 = 168 Stunden, 168 · 60 = 10 080 Minuten.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: Wie viele Sekunden lebt ein Mensch in 80 Jahren – grob?
    params:
      options:
        - label: 2,5 Millionen
          feedback: Das sind nur gut 29 Tage.
        - label: 2,5 Milliarden
          correct: true
        - label: 2,5 Billionen
          feedback: Tausendmal zu viel – das wären 80 000 Jahre.
    hints:
      - Ein Jahr hat rund 30 Millionen Sekunden.
      - Rechne 30 Millionen · 80.
    explanation: 3 · 10⁷ · 80 = 2,4 · 10⁹ – also rund 2,5 Milliarden Sekunden.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Du rundest bei 38 · 47 beide Faktoren auf: 40 · 50. Was gilt für den Überschlag?"
    params:
      options:
        - label: Er ist sicher zu groß
          correct: true
        - label: Er ist sicher zu klein
          feedback: Beide Faktoren wurden größer – das Produkt auch.
        - label: Die Fehler heben sich auf
          feedback: Das passiert nur, wenn du einen Faktor auf- und den anderen abrundest.
    hints:
      - Was passiert mit einem Produkt, wenn beide Faktoren wachsen?
    explanation: "2000 statt 1786. Wer genauer schätzen will, rundet gegenläufig: 40 · 45 = 1800."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Bei Fermi-Fragen landet man oft erstaunlich nah am wahren Wert. Manche Annahmen sind zu groß, andere zu klein. Diese **Fehler** heben sich oft teilweise auf.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Liegt eine Größe zwischen 10 und 1000, schätzt man das **geometrische Mittel**: $\\sqrt{10 \\cdot 1000}$. Wie viel ist das?"
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 505
        misconception: arithmetic-mean
        text: Das ist der Durchschnitt. Er liegt viel näher an 1000 – das geometrische Mittel liegt in der Mitte der Zehnerpotenzen.
    hints:
      - 10 · 1000 = 10 000.
      - Welche Zahl mal sich selbst ergibt 10 000?
    explanation: √10 000 = 100. Von 10 bis 100 ist es Faktor 10, von 100 bis 1000 auch. 100 liegt genau dazwischen.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Ein Buch hat 300 Seiten, jede mit 40 Zeilen zu etwa 10 Wörtern. Wie viele Wörter hat es?
    answer:
      value: 120000
    hints:
      - Erst die Wörter pro Seite.
      - 400 Wörter · 300 Seiten.
    explanation: 40 · 10 = 400 Wörter pro Seite, mal 300 ergibt 120 000 Wörter.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie du die Herzschläge in einem Leben grob schätzt.
    params:
      keywords:
        - - minute
          - pro
          - per
        - - mal
          - multipli
          - multiply
          - times
        - - rund
          - ungefähr
          - grob
          - runde
          - round
          - rough
          - about
      sample: Ich nehme 70 Schläge pro Minute und rechne mal 60, mal 24, mal 365 und mal 80 Jahre. Dabei runde ich grob. Es kommen etwa 3 Milliarden heraus.
    explanation: "Kernidee: eine bekannte Rate (pro Minute) Schritt für Schritt hochrechnen und dabei großzügig runden."
    difficulty: 3

srs:
  cards_from: [ueberschlag, groessenordnung]
