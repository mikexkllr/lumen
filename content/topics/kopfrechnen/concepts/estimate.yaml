id: math.mental.estimate
type: concept
title: Überschlagen
summary: Größenordnungen sicher einschätzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie oft atmest du an einem Tag?"
    params:
      min: 1000
      max: 1000000
      scale: log
    answer:
      value: 22000
      within: 45
    explanation: Etwa 15 Atemzüge pro Minute mal 1440 Minuten sind rund 22 000.


  - kind: problem
    id: groessenordnung
    widget: choice
    prompt: Ist 398 · 21 ungefähr 800, 8 000 oder 80 000?
    params:
      layout: grid
      options:
        - { label: "8 000", correct: true }
        - { label: "800", feedback: "Zu klein. 400 · 20 hat schon vier Stellen." }
        - { label: "80 000", feedback: "Zu groß. Rechne 400 · 20." }
    hints:
      - Runde beide Zahlen.
    explanation: 400 · 20 = 8000. Genau sind es 8358.

  - kind: explain
    id: s2
    body: |
      **Überschlag:** Runde auf eine Stelle und rechne damit.
      398 · 21 ≈ 400 · 20 = 8000. So fallen falsche Ergebnisse sofort auf.

  - kind: problem
    id: ueberschlag
    widget: numeric
    prompt: Überschlage – {{a}} · {{b}}. Ungefähr genügt.
    params: { placeholder: "ungefähr" }
    answer: { value: "{{a * b}}", tolerance: "{{round(a * b * 0.15)}}" }
    hints:
      - "Runde {{a}} und {{b}} auf eine Stelle."
    explanation: "Genau sind es {{a * b}}."
    variants:
      params: { a: "int[31,89]", b: "int[21,79]" }
      defaults: { a: 49, b: 61 }

  - kind: problem
    id: einkauf
    widget: choice
    prompt: Dein Einkauf – 4,95 €, 12,10 €, 2,89 € und 7,05 €. Reichen 25 €?
    params:
      options:
        - { label: Nein, correct: true }
        - { label: Ja, feedback: "Runde – 5 + 12 + 3 + 7 = 27." }
    hints:
      - Runde jeden Preis auf ganze Euro.
    explanation: Gerundet 5 + 12 + 3 + 7 = 27 €. Genau sind es 26,99 €.

  - kind: explain
    id: s5
    body: Wie oft schlägt ein Herz in einem Menschenleben – grob?
    reveal:
      body: 70-mal pro Minute · 60 · 24 · 365 · 80 Jahre ≈ 3 Milliarden. Solche **Fermi-Schätzungen** helfen, Größen zu fühlen.

  - kind: problem
    id: sekunden
    widget: choice
    prompt: Wie viele Sekunden hat ein Jahr ungefähr?
    params:
      options:
        - { label: Rund 30 Millionen, correct: true }
        - { label: Rund 3 Millionen, feedback: "Zu wenig. Ein Tag hat schon über 86 000 Sekunden." }
        - { label: Rund 300 Millionen, feedback: "Zu viel. Rechne 90 000 · 365." }
    hints:
      - Ein Tag hat rund 90 000 Sekunden.
    explanation: 86 400 · 365 ≈ 31,5 Millionen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 49 · 31 ist ungefähr 1500.
          right: true
        - text: 7,9 · 0,52 ist ungefähr 40.
          right: false
          why: 8 · 0,5 = 4. Mal 0,5 halbiert.
        - text: "612 : 19 ist ungefähr 30."
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Fermi-Frage: Du trinkst etwa 2 Liter am Tag. Wie viele Liter sind das in 80 Jahren – grob?"
    params:
      unit: l
    answer:
      value: 58400
      tolerance: 12000
    hints:
      - 2 Liter mal 365 Tage sind rund 700 Liter im Jahr.
    explanation: 700 · 80 ≈ 56 000 Liter – ein kleines Schwimmbecken.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Du rundest bei 38 · 47 beide Faktoren auf: 40 · 50. Was gilt für den Überschlag?"
    params:
      options:
        - label: Er ist sicher zu groß
          correct: true
        - label: Er ist sicher zu klein
          feedback: Beide Faktoren wurden größer – das Produkt auch.
        - label: Die Fehler heben sich auf
          feedback: Das passiert nur, wenn du einen Faktor auf- und den anderen abrundest.
    hints:
      - Was passiert mit einem Produkt, wenn beide Faktoren wachsen?
    explanation: "2000 statt 1786. Wer genauer schätzen will, rundet gegenläufig: 40 · 45 = 1800."
    difficulty: 3

srs:
  cards_from: [ueberschlag, groessenordnung]
