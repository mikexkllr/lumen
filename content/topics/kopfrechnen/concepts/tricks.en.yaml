id: math.mental.tricks
type: concept
title: Eleven and squares ending in 5
summary: Two tricks that feel like magic.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: ma-hook
    widget: estimate
    prompt: "Gut feeling: what is 65 · 65?"
    params:
      min: 1000
      max: 10000
    answer:
      value: 4225
      tolerance: 400
    explanation: 65² = 4225. You are about to learn a trick that does this in seconds.

  - kind: problem
    id: elf
    widget: numeric
    prompt: Calculate 36 · 11.
    params: { placeholder: "Result" }
    answer: { value: 396 }
    hints:
      - 36 · 10 + 36.
    explanation: 360 + 36 = 396.

  - kind: explain
    id: s2
    body: |
      **Times 11** for two-digit numbers: pull the digits apart and put their sum in the middle.
      36 · 11 → 3 | 9 | 6 = 396. If the sum is 10 or more, you **carry**.

  - kind: problem
    id: elf-variante
    widget: numeric
    prompt: Use the eleven trick. {{n}} · 11.
    params: { placeholder: "Result" }
    answer: { value: "{{n * 11}}" }
    hints:
      - "Digits {{floor(n / 10)}} and {{mod(n, 10)}}, with their sum {{floor(n / 10) + mod(n, 10)}} in the middle."
    explanation: "{{n}} · 11 = {{n * 11}}."
    variants:
      params: { n: "int[12,98]" }
      constraints: ["mod(n, 10) != 0"]
      defaults: { n: 54 }

  - kind: explain
    id: s4
    body: |
      **Squares of numbers ending in 5:** For 35², work out 3 · 4 = 12 and attach 25. That gives 1225.
      Take the first digit times its **successor**, then add 25.

  - kind: problem
    id: fuenfer-quadrat
    widget: numeric
    prompt: Work it out in your head. {{d}}5².
    params: { placeholder: "Result" }
    answer: { value: "{{(10 * d + 5) ** 2}}" }
    feedback:
      - when: "numval(state.input) == d * d * 100 + 25"
        misconception: forget-successor
        text: Almost. Take {{d}} times its successor {{d + 1}}, not times itself.
    hints:
      - "{{d}} · {{d + 1}} = {{d * (d + 1)}}. Attach 25."
    explanation: "{{d * (d + 1)}} and 25 make {{(10 * d + 5) ** 2}}."
    variants:
      params: { d: "int[1,9]" }
      defaults: { d: 6 }

  - kind: explain
    id: s6
    body: Why does the trick for fives work?
    reveal:
      body: "$(10a + 5)^2 = 100 \\cdot a \\cdot (a + 1) + 25$. The trick is just this formula, worked out in your head."

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 45 · 11 = 495
          right: true
        - text: 67 · 11 = 6137
          right: false
          why: "6 + 7 = 13 carries over: 737."
        - text: 65² = 4225
          right: true
        - text: 25² = 425
          right: false
          why: "2 · 3 = 6, then append 25: 625."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Use the eleven trick – 78 · 11.
    answer:
      value: 858
    hints:
      - 7 + 8 = 15. The 5 goes in the middle, the 1 carries to the front.
    explanation: 7 | 15 | 8 becomes 858.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: Times-11 trick with a carry – {{n}} · 11.
    answer:
      value: "{{n * 11}}"
    feedback:
      - when: numval(state.input) == floor(n / 10) * 1000 + (floor(n / 10) + n % 10) * 10 + n % 10
        misconception: no-carry
        text: The sum has two digits. Its 1 carries to the front.
    hints:
      - The digit sum is 10 or more.
      - Write the ones digit of the sum in the middle and add 1 to the first digit.
    explanation: "{{n}} · 11 = {{n * 10}} + {{n}} = {{n * 11}}."
    difficulty: 2
    variants:
      params:
        n: choice[48,57,68,76,87,95,79]
      defaults:
        n: 87

  - kind: explain
    id: ma-d2
    depth: 2
    body: Why does the times-11 trick work? 36 · 11 = 360 + 36. The digits 3 and 6 end up on top of each other in the **tens place**. There they add up.

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Neighbour square: 45² = 2025. What is {{d}}6²?"
    answer:
      value: "{{(10 * d + 6) ** 2}}"
    hints:
      - From $n^2$ to $(n+1)^2$ you add n and n + 1.
      - "First {{d}}5² with the fives trick: {{(10 * d + 5) ** 2}}. Then add {{10 * d + 5}} and {{10 * d + 6}}."
    explanation: "{{(10 * d + 5) ** 2}} + {{10 * d + 5}} + {{10 * d + 6}} = {{(10 * d + 6) ** 2}}."
    difficulty: 2
    variants:
      params:
        d: int[1,9]
      defaults:
        d: 4

  - kind: problem
    id: ma-d4
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 25 · 11 = 275
          right: true
          why: 2 | 7 | 5 – the sum 7 goes in the middle.
        - text: 75² = 4925
          right: false
          why: "7 · 8 = 56, then 25: 5625."
        - text: 95² = 9025
          right: true
          why: 9 · 10 = 90, then 25.
        - text: 64 · 11 = 6104
          right: false
          why: "Carry: 6 + 4 = 10, so 704."
    hints:
      - Check each trick step by step.
      - Watch out for the carry.
    explanation: Both tricks are reliable – as long as you do not forget the carry.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The five trick also works with three digits. Compute 105².
    answer:
      value: 11025
    hints:
      - The number before the 5 is 10. Compute 10 · 11 and append 25.
    explanation: "10 · 11 = 110, then 25: 11,025. The formula $(10a+5)^2 = 100a(a+1) + 25$ holds for every a."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: The times-11 trick also works with three digits. Work out {{100 * a + 10 * b + c}} · 11.
    answer:
      value: "{{(100 * a + 10 * b + c) * 11}}"
    hints:
      - The first and last digits stay on the outside.
      - "Inside go the sums of neighbouring digits: {{a}} | {{a + b}} | {{b + c}} | {{c}}."
    explanation: "{{100 * a + 10 * b + c}} · 11 = {{1000 * a + 100 * b + 10 * c}} + {{100 * a + 10 * b + c}} = {{(100 * a + 10 * b + c) * 11}}."
    difficulty: 3
    variants:
      params:
        a: int[1,4]
        b: int[1,4]
        c: int[1,5]
      defaults:
        a: 1
        b: 2
        c: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Eleven has one more trick: the **alternating sum**. Work it out for 9163: 9 − 1 + 6 − 3."
    answer:
      value: 11
    hints:
      - "Work from the left: 9 − 1 = 8."
      - 8 + 6 − 3 = ?
    explanation: "The alternating sum is 11, which is divisible by 11. So 9163 is divisible by 11 too: 9163 = 11 · 833."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: "Explain the times-11 trick to Lux: why does the digit sum go in the middle?"
    params:
      keywords:
        - - "10"
          - zehn
          - ten
          - "360"
        - - plus
          - addier
          - summe
          - add
          - sum
        - - stelle
          - zehner
          - mitte
          - übereinander
          - place
          - tens
          - middle
      sample: Times 11 is times 10 plus once more. Times 10 shifts the number one place left. Then both digits sit on the tens place and get added.
    explanation: "Key idea: times 11 = times 10 + times 1. The shifted number and the number itself overlap in the middle."
    difficulty: 3

srs:
  cards_from: [elf-variante, fuenfer-quadrat]
