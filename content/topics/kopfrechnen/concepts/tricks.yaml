id: math.mental.tricks
type: concept
title: Elf und die Fünfer-Quadrate
summary: Zwei Tricks, die wie Zauberei wirken.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: elf
    widget: numeric
    prompt: Rechne – 36 · 11.
    params: { placeholder: "Ergebnis" }
    answer: { value: 396 }
    hints:
      - 36 · 10 + 36.
    explanation: 360 + 36 = 396.

  - kind: explain
    id: s2
    body: |
      **Mal 11** bei zweistelligen Zahlen: Ziffern auseinanderziehen, ihre Summe in die Mitte.
      36 · 11 → 3 | 9 | 6 = 396. Ist die Summe 10 oder mehr, gibt es einen **Übertrag**.

  - kind: problem
    id: elf-variante
    widget: numeric
    prompt: Rechne mit dem Elfer-Trick – {{n}} · 11.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{n * 11}}" }
    hints:
      - "Ziffern {{floor(n / 10)}} und {{mod(n, 10)}}, in der Mitte ihre Summe {{floor(n / 10) + mod(n, 10)}}."
    explanation: "{{n}} · 11 = {{n * 11}}."
    variants:
      params: { n: "int[12,98]" }
      constraints: ["mod(n, 10) != 0"]
      defaults: { n: 54 }

  - kind: explain
    id: s4
    body: |
      **Quadrate mit 5 am Ende:** Bei 35² rechnet man 3 · 4 = 12 und hängt 25 an. Ergibt 1225.
      Die erste Ziffer mal ihren **Nachfolger** – dann 25.

  - kind: problem
    id: fuenfer-quadrat
    widget: numeric
    prompt: Rechne im Kopf – {{d}}5².
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{(10 * d + 5) ** 2}}" }
    feedback:
      - when: "numval(state.input) == d * d * 100 + 25"
        misconception: forget-successor
        text: Fast. Nimm {{d}} mal den Nachfolger {{d + 1}}, nicht mal sich selbst.
    hints:
      - "{{d}} · {{d + 1}} = {{d * (d + 1)}}. Hänge 25 an."
    explanation: "{{d * (d + 1)}} und 25 ergeben {{(10 * d + 5) ** 2}}."
    variants:
      params: { d: "int[1,9]" }
      defaults: { d: 6 }

  - kind: explain
    id: s6
    body: Warum funktioniert der Fünfer-Trick?
    reveal:
      body: "$(10a + 5)^2 = 100 \\cdot a \\cdot (a + 1) + 25$. Der Trick ist nur diese Formel – im Kopf ausgerechnet."

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 45 · 11 = 495
          right: true
        - text: 67 · 11 = 6137
          right: false
          why: "6 + 7 = 13 gibt einen Übertrag: 737."
        - text: 65² = 4225
          right: true
        - text: 25² = 425
          right: false
          why: "2 · 3 = 6, dann 25 anhängen: 625."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Rechne mit dem Elfer-Trick – 78 · 11.
    answer:
      value: 858
    hints:
      - 7 + 8 = 15. Die 5 kommt in die Mitte, die 1 wandert nach vorn.
    explanation: 7 | 15 | 8 wird zu 858.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Der Fünfer-Trick geht auch dreistellig. Rechne 105².
    answer:
      value: 11025
    hints:
      - Die Zahl vor der 5 ist 10. Rechne 10 · 11 und häng 25 an.
    explanation: "10 · 11 = 110, dahinter 25: 11 025. Die Formel $(10a+5)^2 = 100a(a+1) + 25$ gilt für jedes a."
    difficulty: 3

srs:
  cards_from: [elf-variante, fuenfer-quadrat]
