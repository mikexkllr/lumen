id: math.mental.lab
type: concept
title: Schätz-Labor
summary: Überschlagen mit Säulen und Zahlenstrahl.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Mal macht nicht immer mehr
    body: Wird eine Zahl beim Malnehmen immer größer? Die gestrichelte Linie zeigt mal 1. Zieh den Regler unter 1 und schau, wo die Gerade landet. Mal eine Zahl unter 1 macht **kleiner**.
    visual:
      widget: slider
      interactive: true
      params:
        expr: a*x
        x:
          - 0
          - 10
        y:
          - 0
          - 20
        showCoordinates: false
        sliders:
          - id: a
            label: Faktor
            min: 0.1
            max: 2
            step: 0.1
            initial: 1.5
        target:
          expr: x
          label: mal 1

  - kind: problem
    id: einstieg-hundert
    widget: buckets
    prompt: Liegt das Ergebnis über oder unter 100? Schätze.
    params:
      buckets:
        - id: b1
          label: unter 100
        - id: b2
          label: über 100
      items:
        - label: 9 · 9
          bucket: b1
        - label: 11 · 11
          bucket: b2
        - label: 48 + 49
          bucket: b1
        - label: 52 + 51
          bucket: b2
        - label: 4 · 24
          bucket: b1
        - label: 5 · 21
          bucket: b2
    hints:
      - "Vergleiche mit runden Zahlen: 9 · 9 ist weniger als 10 · 10."
      - 50 + 50 = 100. Liegen beide Zahlen darunter oder beide darüber?
    explanation: 81, 97 und 96 liegen knapp unter 100. 121, 103 und 105 liegen knapp darüber.

  - kind: problem
    id: einstieg-halb
    widget: numberline
    prompt: Mal 0,5 heißt halbieren. Markiere 0,5 · 8 auf dem Zahlenstrahl.
    params:
      min: 0
      max: 10
      ticks: 1
    answer:
      value: 4
    feedback:
      - when: state.value == 8
        misconception: unchanged
        text: Das ist die 8 selbst. Mal 0,5 macht die Zahl halb so groß.
    hints:
      - 0,5 ist ein Halbes.
      - Die Hälfte von 8 liegt genau in der Mitte zwischen 0 und 8.
    explanation: 0,5 · 8 = 4. Mal 0,5 ist dasselbe wie durch 2.

  - kind: problem
    id: ueber
    widget: buckets
    prompt: Liegt das Ergebnis über oder unter 1000? Schätze, ohne genau zu rechnen.
    params:
      buckets: [{ label: unter 1000 }, { label: über 1000 }]
      items:
        - { label: "31 · 29", bucket: unter 1000 }
        - { label: "497 · 2", bucket: unter 1000 }
        - { label: "52 · 21", bucket: über 1000 }
        - { label: "999 + 12", bucket: über 1000 }
    hints:
      - 31 · 29 ist etwa 30 · 30.
    explanation: 899, 994, 1092 und 1011 – knapp, aber Runden hilft.

  - kind: problem
    id: saeulen
    widget: chart
    prompt: Stell die Säulen auf eine gute Schätzung – auf 50 gerundet.
    params:
      labels: ["4 · 98", "6 · 51"]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 450
      step: 50
    answer: { values: [400, 300] }
    hints:
      - 98 ist fast 100, 51 fast 50.
    explanation: 392 ≈ 400 und 306 ≈ 300.

  - kind: problem
    id: strahl
    widget: numberline
    prompt: Markiere 0,5 · 1,4 auf dem Zahlenstrahl.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: 0.7 }
    hints:
      - Die Hälfte von 1,4.
    explanation: 0,5 · 1,4 = 0,7.

  - kind: problem
    id: tricks
    widget: match
    prompt: Welcher Trick passt zu welcher Aufgabe?
    params:
      pairs:
        - { left: "48 · 5", right: "mal 10, dann halbieren" }
        - { left: "23 · 9", right: "mal 10, minus einmal" }
        - { left: "34 · 11", right: "mal 10, plus einmal" }
    hints:
      - 5 ist die Hälfte von 10.
    explanation: 240, 207 und 374 – jeweils über die bequeme 10.

  - kind: problem
    id: d1
    depth: 2
    widget: estimate
    prompt: "Schätz ohne zu rechnen: 0,48 · 617."
    params:
      min: 0
      max: 1000
    answer:
      value: 296
      tolerance: 25
    explanation: "Mal 0,48 ist fast halbieren: 617 : 2 ≈ 308, etwas weniger."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: rect
    prompt: "Zerlegen zum Anfassen: Zieh ein Rechteck aus 84 Kästchen, bei dem eine Seite 7 lang ist."
    params:
      maxW: 14
      maxH: 8
      w: 3
      h: 3
      show:
        - area
      unit: cm
    check:
      predicate: area == 84 && (w == 7 || h == 7)
    hints:
      - "84 : 7 = ?"
      - Die andere Seite ist 12 lang.
    explanation: 7 · 12 = 7 · 10 + 7 · 2 = 70 + 14 = 84. Ein Rechteck zeigt jedes Zerlegen auf einen Blick.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Tage alt ist jemand an seinem 12. Geburtstag?"
    params:
      min: 1000
      max: 10000
    answer:
      value: 4383
      tolerance: 200
    explanation: 12 · 365 = 4380, plus etwa 3 Schalttage – rund 4383 Tage.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numberline
    prompt: Markiere 0,9 · 0,5 auf dem Zahlenstrahl.
    params:
      min: 0
      max: 1
      ticks: 20
      labels: decimals
    answer:
      value: 0.45
    hints:
      - Die Hälfte von 0,9.
      - "0,9 : 2 = 0,45."
    explanation: Mal 0,5 heißt halbieren. Das Ergebnis ist kleiner als 0,9.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Fermi: Ein Stadion fasst 60 000 Menschen. Jeder isst im Schnitt 1,5 Bratwürste. Wie viele Kilometer Wurst sind das, wenn eine 20 cm lang ist?"
    params:
      unit: km
    answer:
      value: 18
      tolerance: 1
    hints:
      - 90 000 Würste mal 0,2 m.
    explanation: 90 000 · 0,2 m = 18 000 m = 18 km.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Wie groß ist $2^{20}$ – also zwanzigmal verdoppeln?"
    params:
      min: 1000
      max: 1000000000
      scale: log
    answer:
      value: 1048576
      within: 30
    explanation: "$2^{10} = 1024 \\approx 1000$. Also ist $2^{20} \\approx 1000 \\cdot 1000$ = 1 Million. Genau: 1 048 576."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Mit $2^{10} \\approx 1000$: Wie viele Stellen hat $2^{30}$ ungefähr?"
    answer:
      value: 10
    hints:
      - $2^{30} = (2^{10})^3$.
      - $1000^3 = 10^9$ – wie viele Stellen hat eine Milliarde?
    explanation: "$2^{30} \\approx 10^9$, eine 1 mit 9 Nullen – also 10 Stellen. Genau: 1 073 741 824."
    difficulty: 3

srs:
  cards_from: [ueber, tricks]
