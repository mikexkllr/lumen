id: math.mental.check
type: concept
title: Checking your answer
summary: Spot mistakes right away.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: endziffer
    widget: choice
    prompt: Which result for 37 · 48 must be wrong? Do not calculate it.
    params:
      options:
        - { label: "1773", correct: true }
        - { label: "1776", feedback: "That one is actually right. 7 · 8 = 56 ends in 6." }
    hints:
      - What digit does 7 · 8 end in?
    explanation: 7 · 8 = 56, so the result must end in 6.

  - kind: explain
    id: s2
    body: |
      **Quick checks:** Check the last digit. Estimate the size. Even times even is always even.

  - kind: problem
    id: plausibel
    widget: buckets
    prompt: Plausible or definitely wrong?
    params:
      buckets: [{ label: plausible }, { label: definitely wrong }]
      items:
        - { label: "52 · 48 = 2496", bucket: plausible }
        - { label: "19 · 21 = 399", bucket: plausible }
        - { label: "46 · 24 = 1103", bucket: definitely wrong }
        - { label: "33 · 31 = 10 230", bucket: definitely wrong }
        - { label: "25 · 25 = 615", bucket: definitely wrong }
    hints:
      - Check even and odd, the last digit, and the size.
    explanation: Even times even can't be 1103, 33 · 31 is about 1000, and 25 · 25 ends in 25.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Calculate {{a}} · {{b}}. Then check the last digit.
    params: { placeholder: "Result" }
    answer: { value: "{{a * b}}" }
    hints:
      - "Split {{b}} into tens and ones."
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[12,19]", b: "int[21,29]" }
      defaults: { a: 14, b: 23 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Odd times odd can be even.
          right: false
          why: Odd times odd is always odd.
        - text: 23 · 47 must end in 1.
          right: true
        - text: If one factor ends in 5 and the other is even, the product ends in 0.
          right: true
        - text: 312 · 29 can be 904.
          right: false
          why: 300 · 30 = 9000 – the magnitude is off.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The digit sum reveals the remainder when dividing by 9. What remainder does 4732 leave?
    answer:
      value: 7
    hints:
      - 4 + 7 + 3 + 2 = 16. And what remainder does 16 leave?
    explanation: 16 = 9 + 7, so the remainder is 7. This is the basis of **casting out nines**.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Why does the digit sum reveal the remainder mod 9? 10 is 9 + 1, 100 is 99 + 1. Each place leaves only its digit as the **remainder** when you divide by 9.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: Which check exposes the mistake?
    params:
      buckets:
        - id: b1
          label: Last digit
        - id: b2
          label: Size
      items:
        - label: 32 · 41 = 1313
          bucket: b1
        - label: 32 · 41 = 13,120
          bucket: b2
        - label: 19 · 21 = 3,999
          bucket: b2
        - label: 15 · 15 = 224
          bucket: b1
        - label: 26 · 34 = 8,844
          bucket: b2
        - label: 17 · 13 = 223
          bucket: b1
    hints:
      - What must the last digit be? 2 · 1, 5 · 5, 7 · 3 …
      - "Round both factors: roughly how big is the result?"
    explanation: 1313, 224 and 223 have the wrong last digit. 13,120, 3,999 and 8,844 are about ten times too big.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Casting out nines: 37 leaves remainder 1, 48 leaves 3. Which remainder must 37 · 48 leave?"
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 4
        misconception: add-remainders
        text: For a product you multiply the remainders, not add them.
    hints:
      - Remainders behave like the numbers themselves.
      - Work out 1 · 3.
    explanation: "1 · 3 = 3. Check: 37 · 48 = 1776, digit sum 21, and 21 leaves remainder 3."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Casting out nines for 34 · 52 = 1768 works out. What does that prove?
    params:
      options:
        - label: Nothing for certain – but most errors would have shown
          correct: true
        - label: The result is certainly right
          feedback: 1786 has the same digit sum and would pass too.
        - label: The result is divisible by 9
          feedback: The check only compares remainders, it says nothing about divisibility.
    hints:
      - What does swapping two digits do to the digit sum?
    explanation: A check can find errors but not prove correctness. It misses swapped digits.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: Correct is 34 · 52 = 1768. Which wrong result still passes casting out nines?
    params:
      options:
        - label: "1786"
          correct: true
        - label: Digit sum 21, remainder 3 – it should be 4.
          feedback: Quersumme 21, Rest 3 – richtig wäre Rest 4.
        - label: Digit sum 23, remainder 5 – it should be 4.
          feedback: Quersumme 23, Rest 5 – richtig wäre Rest 4.
    hints:
      - The digit sum of 1768 is 22.
      - Which number has the same digits?
    explanation: Swapped digits do not change the digit sum. Casting out nines misses this kind of typo.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Calculating with remainders is called **modular arithmetic**. You write $4732 \equiv 7 \pmod 9$. Check digits in ISBNs, IBANs and barcodes are built on it.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why the digit sum gives the remainder when dividing by 9.
    params:
      keywords:
        - - "10"
          - zehn
          - ten
          - "100"
          - hundert
        - - rest
          - remainder
          - übrig
          - left
        - - neun
          - nine
          - "99"
          - neuner
      sample: 10 is 9 + 1 and 100 is 99 + 1. The nines divide evenly. From each place only the digit is left over. So the number has the same remainder as its digit sum.
    explanation: "Key idea: every power of ten leaves remainder 1 when divided by 9."
    difficulty: 3

srs:
  cards_from: [plausibel, rechnen]
