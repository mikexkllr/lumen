id: math.mental.check
type: concept
title: Checking your answer
summary: Spot mistakes right away.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: endziffer
    widget: choice
    prompt: Which result for 37 · 48 must be wrong? Do not calculate it.
    params:
      options:
        - { label: "1773", correct: true }
        - { label: "1776", feedback: "That one is actually right. 7 · 8 = 56 ends in 6." }
    hints:
      - What digit does 7 · 8 end in?
    explanation: 7 · 8 = 56, so the result must end in 6.

  - kind: explain
    body: |
      **Quick checks:** Check the last digit. Estimate the size. Even times even is always even.

  - kind: problem
    id: plausibel
    widget: buckets
    prompt: Plausible or definitely wrong?
    params:
      buckets: [{ label: plausible }, { label: definitely wrong }]
      items:
        - { label: "52 · 48 = 2496", bucket: plausible }
        - { label: "19 · 21 = 399", bucket: plausible }
        - { label: "46 · 24 = 1103", bucket: definitely wrong }
        - { label: "33 · 31 = 10 230", bucket: definitely wrong }
        - { label: "25 · 25 = 615", bucket: definitely wrong }
    hints:
      - Check even and odd, the last digit, and the size.
    explanation: Even times even can't be 1103, 33 · 31 is about 1000, and 25 · 25 ends in 25.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Calculate {{a}} · {{b}}. Then check the last digit.
    params: { placeholder: "Result" }
    answer: { value: "{{a * b}}" }
    hints:
      - "Split {{b}} into tens and ones."
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[12,19]", b: "int[21,29]" }
      defaults: { a: 14, b: 23 }

srs:
  cards_from: [plausibel, rechnen]
