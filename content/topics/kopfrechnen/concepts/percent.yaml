id: math.mental.percent
type: concept
title: Prozente im Kopf
summary: Erst 10 %, dann den Rest.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Erst zehn Prozent
    body: "Trinkgeld, Rabatt, Steuer – Prozente begegnen dir täglich. Jedes Stück im Quadrat ist **10 %**. Färbe ein paar Stücke. Teile dann in 20 Stücke: Wie viel Prozent ist jetzt ein Stück wert?"
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 10
        shape: square
        shaded:
          - 0
        partOptions:
          - 10
          - 20

  - kind: problem
    id: ma-hook
    widget: estimate
    prompt: "Schätz mal: Wie viel sind 15 % von 60 €?"
    params:
      min: 0
      max: 30
      unit: €
    answer:
      value: 9
      tolerance: 2
    explanation: 10 % sind 6 €, 5 % sind 3 €. Zusammen 9 €.

  - kind: problem
    id: zehn
    widget: numeric
    prompt: Wie viel sind 10 % von {{n}} €?
    params: { unit: "€" }
    answer: { value: "{{n / 10}}" }
    hints:
      - Komma eine Stelle nach links.
    explanation: "{{n}} : 10 = {{n / 10}} €."
    variants:
      params: { n: "step[20,90,10]" }
      defaults: { n: 60 }

  - kind: explain
    id: s2
    body: |
      **Trick:** 10 % ist ein Zehntel. Daraus baust du alles: 5 % ist die Hälfte davon, 20 % das Doppelte, 15 % = 10 % + 5 %.

  - kind: problem
    id: trinkgeld
    widget: numeric
    prompt: Die Rechnung beträgt {{n}} €. Wie viel sind 15 % Trinkgeld?
    params: { unit: "€" }
    answer: { value: "{{n * 0.15}}" }
    feedback:
      - when: "numval(state.input) == n / 10"
        misconception: ten-only
        text: Das sind 10 %. Nimm die Hälfte davon noch dazu.
    hints:
      - "10 % sind {{n / 10}} €, 5 % sind {{n / 20}} €."
    explanation: "{{n / 10}} + {{n / 20}} = {{n * 0.15}} €."
    variants:
      params: { n: "step[20,80,20]" }
      defaults: { n: 40 }

  - kind: problem
    id: rabatt
    widget: numeric
    prompt: Eine Jacke kostet {{p}} €. Es gibt 30 % Rabatt. Was zahlst du?
    params: { unit: "€" }
    answer: { value: "{{p * 0.7}}" }
    feedback:
      - when: "numval(state.input) == p * 0.3"
        misconception: discount-not-price
        text: Das ist der Rabatt. Gefragt ist, was du noch zahlst.
    hints:
      - "Du zahlst 70 % – oder: 10 % sind {{p / 10}} €."
    explanation: "{{p}} − {{p * 0.3}} = {{p * 0.7}} €."
    variants:
      params: { p: "step[40,200,20]" }
      defaults: { p: 120 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: 15 % sind 10 % plus [[5 %]]. Dabei ist 5 % die [[Hälfte]] von 10 %. Und 1 % ist ein [[Hundertstel]].
      distractors:
        - Zehntel
        - 20 %

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: 15 % passen nicht in Zehntel. Teile das Quadrat passend und färbe 15 %.
    params:
      parts: 10
      shape: square
      partOptions:
        - 10
        - 20
    answer:
      fraction: 3/20
    hints:
      - 15 % sind 10 % und noch einmal 5 %.
      - Teile in 20 Stücke – jedes ist 5 %. Färbe 3 davon.
    explanation: 15 % = $\frac{3}{20}$, denn jedes der 20 Stücke ist 5 % wert.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Im Kopf: Wie viel sind 17,5 % von 80 €?"
    params:
      unit: €
    answer:
      value: 14
    hints:
      - 10 % sind 8 €. Davon die Hälfte und noch einmal die Hälfte.
    explanation: 8 + 4 + 2 = 14 €. Aus 10 % baust du durch Halbieren fast jeden Prozentsatz.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: match
    prompt: Welcher Bruch gehört zu welchem Prozentsatz?
    params:
      pairs:
        - left: 50 %
          right: 1/2
        - left: 25 %
          right: 1/4
        - left: 20 %
          right: 1/5
        - left: 10 %
          right: 1/10
        - left: 12,5 %
          right: 1/8
    hints:
      - Prozent heißt »von Hundert«.
      - 1/8 ist die Hälfte von 1/4.
    explanation: 1/2 = 50/100, 1/4 = 25/100, 1/5 = 20/100, 1/10 = 10/100 und 1/8 = 12,5/100.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Rechne im Kopf: 12 % von {{n}} €."
    params:
      unit: €
    answer:
      value: "{{n * 0.12}}"
    hints:
      - 12 % = 10 % + 2 %.
      - 10 % sind {{n / 10}} €, 1 % sind {{n / 100}} €.
    explanation: "{{n / 10}} € + 2 · {{n / 100}} € = {{n * 0.12}} €."
    difficulty: 2
    variants:
      params:
        n: step[50,400,50]
      defaults:
        n: 150

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Von 12 Äpfeln sind 9 rot. Wie viel Prozent sind das?
    params:
      unit: "%"
    answer:
      value: 75
    feedback:
      - when: numval(state.input) == 9
        misconception: count-not-share
        text: Das ist die Anzahl. Gefragt ist der Anteil von 100.
    hints:
      - Kürze 9/12 erst.
      - 9/12 = 3/4. Wie viel Prozent sind drei Viertel?
    explanation: 9/12 = 3/4 = 75/100 = 75 %.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Trick: x % von y ist dasselbe wie y % von x. Wie viel sind 4 % von 75?"
    answer:
      value: 3
    hints:
      - "Dreh es um: 75 % von 4."
    explanation: 75 % von 4 sind 3. Beide Male rechnest du $x \cdot y / 100$ – die Reihenfolge ist egal.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie rechnest du 15 % Trinkgeld im Kopf aus?"
    params:
      keywords:
        - - "10"
          - zehn
          - ten
          - zehntel
          - tenth
        - - hälfte
          - halb
          - half
          - fünf
          - five
        - - addier
          - plus
          - zusammen
          - add
          - sum
          - dazu
      sample: Ich nehme 10 % – das ist ein Zehntel. Davon die Hälfte sind 5 %. Beides zusammen ergibt 15 %.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Prozent lässt sich als **Faktor** schreiben. Plus 15 % heißt mal 1,15. Minus 30 % heißt mal 0,7. Mehrere Schritte nimmt man einfach nacheinander mal.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Erst +{{p}} %, dann −{{p}} %. Wie viel Prozent vom Startpreis bleiben?
    params:
      unit: "%"
    answer:
      value: "{{100 * (1 + p / 100) * (1 - p / 100)}}"
    feedback:
      - when: numval(state.input) == 100
        misconception: same-base
        text: Die −{{p}} % beziehen sich auf den höheren Preis. Sie nehmen mehr weg.
    hints:
      - Schreib beide Schritte als Faktoren.
      - Rechne {{1 + p / 100}} · {{1 - p / 100}}.
    explanation: "{{1 + p / 100}} · {{1 - p / 100}} = {{(1 + p / 100) * (1 - p / 100)}}. Es bleiben {{100 - p * p / 100}} %."
    difficulty: 3
    variants:
      params:
        p: choice[10,20,30,40,50]
      defaults:
        p: 20

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Ein Preis steigt zweimal hintereinander um 10 %. Um wie viel Prozent ist er insgesamt gestiegen?
    params:
      unit: "%"
    answer:
      value: 21
    feedback:
      - when: numval(state.input) == 20
        misconception: add-percents
        text: Die zweite Erhöhung rechnet auch auf die erste drauf.
    hints:
      - Zweimal mal 1,1.
      - 1,1 · 1,1 = 1,21.
    explanation: 1,1 · 1,1 = 1,21, also 21 % mehr. Das ist der Zinseszins-Effekt im Kleinen.
    difficulty: 3

srs:
  cards_from: [trinkgeld, rabatt]
