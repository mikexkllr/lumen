id: math.mental.percent
type: concept
title: Prozente im Kopf
summary: Erst 10 %, dann den Rest.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zehn
    widget: numeric
    prompt: Wie viel sind 10 % von {{n}} €?
    params: { unit: "€" }
    answer: { value: "{{n / 10}}" }
    hints:
      - Komma eine Stelle nach links.
    explanation: "{{n}} : 10 = {{n / 10}} €."
    variants:
      params: { n: "step[20,90,10]" }
      defaults: { n: 60 }

  - kind: explain
    id: s2
    body: |
      **Trick:** 10 % ist ein Zehntel. Daraus baust du alles: 5 % ist die Hälfte davon, 20 % das Doppelte, 15 % = 10 % + 5 %.

  - kind: problem
    id: trinkgeld
    widget: numeric
    prompt: Die Rechnung beträgt {{n}} €. Wie viel sind 15 % Trinkgeld?
    params: { unit: "€" }
    answer: { value: "{{n * 0.15}}" }
    feedback:
      - when: "numval(state.input) == n / 10"
        misconception: ten-only
        text: Das sind 10 %. Nimm die Hälfte davon noch dazu.
    hints:
      - "10 % sind {{n / 10}} €, 5 % sind {{n / 20}} €."
    explanation: "{{n / 10}} + {{n / 20}} = {{n * 0.15}} €."
    variants:
      params: { n: "step[20,80,20]" }
      defaults: { n: 40 }

  - kind: problem
    id: rabatt
    widget: numeric
    prompt: Eine Jacke kostet {{p}} €. Es gibt 30 % Rabatt. Was zahlst du?
    params: { unit: "€" }
    answer: { value: "{{p * 0.7}}" }
    feedback:
      - when: "numval(state.input) == p * 0.3"
        misconception: discount-not-price
        text: Das ist der Rabatt. Gefragt ist, was du noch zahlst.
    hints:
      - "Du zahlst 70 % – oder: 10 % sind {{p / 10}} €."
    explanation: "{{p}} − {{p * 0.3}} = {{p * 0.7}} €."
    variants:
      params: { p: "step[40,200,20]" }
      defaults: { p: 120 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: 15 % sind 10 % plus [[5 %]]. Dabei ist 5 % die [[Hälfte]] von 10 %. Und 1 % ist ein [[Hundertstel]].
      distractors:
        - Zehntel
        - 20 %

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Im Kopf: Wie viel sind 17,5 % von 80 €?"
    params:
      unit: €
    answer:
      value: 14
    hints:
      - 10 % sind 8 €. Davon die Hälfte und noch einmal die Hälfte.
    explanation: 8 + 4 + 2 = 14 €. Aus 10 % baust du durch Halbieren fast jeden Prozentsatz.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Trick: x % von y ist dasselbe wie y % von x. Wie viel sind 4 % von 75?"
    answer:
      value: 3
    hints:
      - "Dreh es um: 75 % von 4."
    explanation: 75 % von 4 sind 3. Beide Male rechnest du $x \cdot y / 100$ – die Reihenfolge ist egal.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie rechnest du 15 % Trinkgeld im Kopf aus?"
    params:
      keywords:
        - - "10"
          - zehn
          - ten
          - zehntel
          - tenth
        - - hälfte
          - halb
          - half
          - fünf
          - five
        - - addier
          - plus
          - zusammen
          - add
          - sum
          - dazu
      sample: Ich nehme 10 % – das ist ein Zehntel. Davon die Hälfte sind 5 %. Beides zusammen ergibt 15 %.
    difficulty: 3

srs:
  cards_from: [trinkgeld, rabatt]
