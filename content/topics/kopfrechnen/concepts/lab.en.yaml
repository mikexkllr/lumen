id: math.mental.lab
type: concept
title: Estimation lab
summary: Estimating with bars and number lines.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Times is not always more
    body: Does multiplying always make a number bigger? The dashed line shows times 1. Drag the slider below 1 and watch where the line ends up. Times a number below 1 makes it **smaller**.
    visual:
      widget: slider
      interactive: true
      params:
        expr: a*x
        x:
          - 0
          - 10
        y:
          - 0
          - 20
        showCoordinates: false
        sliders:
          - id: a
            label: Factor
            min: 0.1
            max: 2
            step: 0.1
            initial: 1.5
        target:
          expr: x
          label: times 1

  - kind: problem
    id: ueber
    widget: buckets
    prompt: Is the result over or under 1000? Estimate it.
    params:
      buckets: [{ label: under 1000 }, { label: over 1000 }]
      items:
        - { label: "31 · 29", bucket: under 1000 }
        - { label: "497 · 2", bucket: under 1000 }
        - { label: "52 · 21", bucket: over 1000 }
        - { label: "999 + 12", bucket: over 1000 }
    hints:
      - 31 · 29 is about 30 · 30.
    explanation: 899, 994, 1092 and 1011. They are close, but rounding helps.

  - kind: problem
    id: saeulen
    widget: chart
    prompt: Set the bars to a good estimate, rounded to the nearest 50.
    params:
      labels: ["4 · 98", "6 · 51"]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 450
      step: 50
    answer: { values: [400, 300] }
    hints:
      - 98 is almost 100, and 51 is almost 50.
    explanation: 392 ≈ 400 and 306 ≈ 300.

  - kind: problem
    id: strahl
    widget: numberline
    prompt: Mark 0.5 · 1.4 on the number line.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: 0.7 }
    hints:
      - Half of 1.4.
    explanation: 0.5 · 1.4 = 0.7.

  - kind: problem
    id: tricks
    widget: match
    prompt: Which trick fits which problem?
    params:
      pairs:
        - { left: "48 · 5", right: "times 10, then halve" }
        - { left: "23 · 9", right: "times 10, minus one copy" }
        - { left: "34 · 11", right: "times 10, plus one copy" }
    hints:
      - 5 is half of 10.
    explanation: 240, 207 and 374, each found through the easy 10.

  - kind: problem
    id: d1
    depth: 2
    widget: estimate
    prompt: "Estimate without calculating: 0.48 · 617."
    params:
      min: 0
      max: 1000
    answer:
      value: 296
      tolerance: 25
    explanation: "Times 0.48 is almost halving: 617 ÷ 2 ≈ 308, a bit less."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: rect
    prompt: "Splitting you can touch: drag a rectangle of 84 squares with one side of length 7."
    params:
      maxW: 14
      maxH: 8
      w: 3
      h: 3
      show:
        - area
      unit: cm
    check:
      predicate: area == 84 && (w == 7 || h == 7)
    hints:
      - "84 : 7 = ?"
      - The other side is 12 long.
    explanation: 7 · 12 = 7 · 10 + 7 · 2 = 70 + 14 = 84. A rectangle shows any splitting at a glance.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many days old is someone on their 12th birthday?"
    params:
      min: 1000
      max: 10000
    answer:
      value: 4383
      tolerance: 200
    explanation: 12 · 365 = 4380, plus about 3 leap days – roughly 4383 days.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numberline
    prompt: Mark 0.9 · 0.5 on the number line.
    params:
      min: 0
      max: 1
      ticks: 20
      labels: decimals
    answer:
      value: 0.45
    hints:
      - Half of 0.9.
      - "0.9 : 2 = 0.45."
    explanation: Times 0.5 means halving. The result is smaller than 0.9.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Fermi: a stadium holds 60,000 people. Each eats 1.5 sausages on average. How many kilometres of sausage is that if one is 20 cm long?"
    params:
      unit: km
    answer:
      value: 18
      tolerance: 1
    hints:
      - 90,000 sausages times 0.2 m.
    explanation: 90,000 · 0.2 m = 18,000 m = 18 km.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: estimate
    prompt: "Take a guess: how big is $2^{20}$ – doubling twenty times?"
    params:
      min: 1000
      max: 1000000000
      scale: log
    answer:
      value: 1048576
      within: 30
    explanation: "$2^{10} = 1024 \\approx 1000$. So $2^{20} \\approx 1000 \\cdot 1000$ = 1 million. Exactly: 1,048,576."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Using $2^{10} \\approx 1000$: about how many digits does $2^{30}$ have?"
    answer:
      value: 10
    hints:
      - $2^{30} = (2^{10})^3$.
      - $1000^3 = 10^9$ – how many digits does a billion have?
    explanation: "$2^{30} \\approx 10^9$, a 1 with 9 zeros – so 10 digits. Exactly: 1,073,741,824."
    difficulty: 3

srs:
  cards_from: [ueber, tricks]
