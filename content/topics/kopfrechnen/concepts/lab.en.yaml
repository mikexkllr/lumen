id: math.mental.lab
type: concept
title: Estimation lab
summary: Estimating with bars and number lines.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: ueber
    widget: buckets
    prompt: Is the result over or under 1000? Estimate it.
    params:
      buckets: [{ label: under 1000 }, { label: over 1000 }]
      items:
        - { label: "31 · 29", bucket: under 1000 }
        - { label: "497 · 2", bucket: under 1000 }
        - { label: "52 · 21", bucket: over 1000 }
        - { label: "999 + 12", bucket: over 1000 }
    hints:
      - 31 · 29 is about 30 · 30.
    explanation: 899, 994, 1092 and 1011. They are close, but rounding helps.

  - kind: problem
    id: saeulen
    widget: chart
    prompt: Set the bars to a good estimate, rounded to the nearest 50.
    params:
      labels: ["4 · 98", "6 · 51"]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 450
      step: 50
    answer: { values: [400, 300] }
    hints:
      - 98 is almost 100, and 51 is almost 50.
    explanation: 392 ≈ 400 and 306 ≈ 300.

  - kind: problem
    id: strahl
    widget: numberline
    prompt: Mark 0.5 · 1.4 on the number line.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: 0.7 }
    hints:
      - Half of 1.4.
    explanation: 0.5 · 1.4 = 0.7.

  - kind: problem
    id: tricks
    widget: match
    prompt: Which trick fits which problem?
    params:
      pairs:
        - { left: "48 · 5", right: "times 10, then halve" }
        - { left: "23 · 9", right: "times 10, minus one copy" }
        - { left: "34 · 11", right: "times 10, plus one copy" }
    hints:
      - 5 is half of 10.
    explanation: 240, 207 and 374, each found through the easy 10.

srs:
  cards_from: [ueber, tricks]
