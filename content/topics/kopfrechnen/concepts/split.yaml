id: math.mental.split
type: concept
title: Zerlegen statt plagen
summary: Runde Zahlen machen alles leichter.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: sieben-achtzehn
    widget: numeric
    prompt: Rechne im Kopf – 7 · 18.
    params: { placeholder: "Ergebnis" }
    answer: { value: 126 }
    hints:
      - "Denk an 7 · 20 und zieh etwas ab."
    explanation: 7 · 20 = 140, minus 7 · 2 = 14. Ergibt 126.

  - kind: explain
    body: |
      **Zerlegen:** 7 · 18 = 7 · 20 − 7 · 2 = 140 − 14 = 126.
      Runde Zahlen rechnet der Kopf viel leichter.

  - kind: problem
    id: fast-rund
    widget: numeric
    prompt: Rechne im Kopf – {{a}} · {{b}}.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{a * b}}" }
    hints:
      - "{{b}} liegt nah an {{b + (10 - mod(b, 10)) % 10}}."
    explanation: "{{a}} · {{b + (10 - mod(b, 10)) % 10}} − {{a}} · {{(10 - mod(b, 10)) % 10}} = {{a * b}}."
    variants:
      params: { a: "int[3,9]", b: "choice[19,29,39,49,98,99]" }
      defaults: { a: 6, b: 29 }

  - kind: explain
    body: |
      **Mal 5** ist mal 10 und dann halbieren. **Mal 25** ist mal 100 und dann durch 4.
      **Mal 9** ist mal 10 und einmal abziehen.

  - kind: problem
    id: mal-fuenfundzwanzig
    widget: numeric
    prompt: Rechne im Kopf – 25 · {{n}}.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{25 * n}}" }
    hints:
      - "{{n}} · 100 = {{n * 100}}. Jetzt durch 4."
    explanation: "{{n * 100}} : 4 = {{25 * n}}."
    variants:
      params: { n: "choice[12,16,24,36,44]" }
      defaults: { n: 16 }

  - kind: problem
    id: mal-fuenf
    widget: numeric
    prompt: Rechne im Kopf – {{n}} · 5.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{5 * n}}" }
    hints:
      - "{{n}} · 10 = {{n * 10}}. Jetzt halbieren."
    explanation: "{{n * 10}} : 2 = {{5 * n}}."
    variants:
      params: { n: "step[24,98,2]" }
      defaults: { n: 48 }

srs:
  cards_from: [fast-rund, mal-fuenfundzwanzig]
