id: math.mental.check
type: concept
title: Die Probe machen
summary: Fehler sofort erkennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Finde den Fehler
    body: Taschenrechner irren nicht – aber Finger vertippen sich. Jede Karte zeigt ein falsches Ergebnis. Überleg kurz, warum es nicht stimmen kann. Dann dreh die Karte um. Eine schnelle **Probe** genügt.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🔍
            front: 23 · 14 = 327?
            back: "Falsch: 3 · 4 endet auf 2, also muss auch das Ergebnis auf 2 enden."
          - icon: 📏
            front: 52 · 19 = 9880?
            back: "Falsch: 50 · 20 sind nur 1000 – das ist zehnmal zu viel."
          - icon: ⚖️
            front: 36 · 17 = 611?
            back: "Falsch: Eine gerade Zahl mal irgendwas ergibt immer eine gerade Zahl."

  - kind: problem
    id: einstieg-groesse
    widget: choice
    prompt: Tim rechnet 9 + 8 = 71. Kann das stimmen?
    params:
      options:
        - label: Nein, das ist viel zu groß
          correct: true
        - label: Ja, das stimmt
          feedback: 9 + 8 ist weniger als 10 + 10. Das Ergebnis muss also unter 20 liegen.
        - label: Nein, das ist zu klein
          feedback: "Schätz ab: 9 + 8 ist weniger als 20. Die 71 ist also zu groß."
    hints:
      - Du musst nicht genau rechnen. Vergleiche mit 10 + 10.
      - 9 + 8 ist weniger als 20. Passt 71 dazu?
    explanation: 9 + 8 = 17. Tim hat die Ziffern vertauscht. Ein Blick auf die Größe deckt das sofort auf.

  - kind: problem
    id: einstieg-letzte-ziffer
    widget: numeric
    prompt: Auf welche Ziffer endet 13 · 14? Du musst nicht alles ausrechnen.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 182
        misconception: full-result
        text: Das ist das ganze Ergebnis. Gefragt ist nur die letzte Ziffer.
      - when: numval(state.input) == 12
        misconception: both-digits
        text: 3 · 4 = 12 stimmt. Gefragt ist nur die letzte Ziffer davon.
      - when: numval(state.input) == 7
        misconception: added-digits
        text: Du hast 3 + 4 gerechnet. Nimm die beiden letzten Ziffern mal.
    hints:
      - "Nur die letzten Ziffern zählen: 3 und 4."
      - 3 · 4 = 12. Welche Ziffer steht hinten?
    explanation: 3 · 4 = 12, also endet 13 · 14 auf 2. Genau sind es 182.

  - kind: problem
    id: endziffer
    widget: choice
    prompt: Welches Ergebnis für 37 · 48 ist sicher falsch – ohne genau zu rechnen?
    params:
      options:
        - { label: "1773", correct: true }
        - { label: "1776", feedback: "Das stimmt sogar. 7 · 8 = 56 endet auf 6." }
    hints:
      - Auf welche Ziffer endet 7 · 8?
    explanation: 7 · 8 = 56 – das Ergebnis muss auf 6 enden.

  - kind: explain
    id: s2
    body: |
      **Schnelle Proben:** Die letzte Ziffer prüfen. Die Größenordnung überschlagen. Gerade mal gerade ist immer gerade.

  - kind: problem
    id: plausibel
    widget: buckets
    prompt: Plausibel oder sicher falsch?
    params:
      buckets: [{ label: plausibel }, { label: sicher falsch }]
      items:
        - { label: "52 · 48 = 2496", bucket: plausibel }
        - { label: "19 · 21 = 399", bucket: plausibel }
        - { label: "46 · 24 = 1103", bucket: sicher falsch }
        - { label: "33 · 31 = 10 230", bucket: sicher falsch }
        - { label: "25 · 25 = 615", bucket: sicher falsch }
    hints:
      - Prüfe gerade und ungerade, die letzte Ziffer und die Größe.
    explanation: Gerade mal gerade kann nicht 1103 sein, 33 · 31 ist rund 1000, und 25 · 25 endet auf 25.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Rechne – {{a}} · {{b}}. Mach danach die Endziffer-Probe.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{a * b}}" }
    hints:
      - "Zerlege {{b}} in Zehner und Einer."
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[12,19]", b: "int[21,29]" }
      defaults: { a: 14, b: 23 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ungerade mal ungerade kann gerade sein.
          right: false
          why: Ungerade mal ungerade ist immer ungerade.
        - text: 23 · 47 muss auf 1 enden.
          right: true
        - text: Endet ein Faktor auf 5 und der andere ist gerade, endet das Produkt auf 0.
          right: true
        - text: 312 · 29 kann 904 sein.
          right: false
          why: 300 · 30 = 9000 – die Größenordnung passt nicht.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Quersumme verrät den Rest beim Teilen durch 9. Welchen Rest lässt 4732?
    answer:
      value: 7
    hints:
      - 4 + 7 + 3 + 2 = 16. Und 16 lässt welchen Rest?
    explanation: 16 = 9 + 7, also Rest 7. Das ist die Grundlage der **Neunerprobe**.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Warum verrät die Quersumme den Neunerrest? 10 ist 9 + 1, 100 ist 99 + 1. Jede Stelle lässt beim Teilen durch 9 nur ihre Ziffer als **Rest** übrig.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: Welche Probe entlarvt den Fehler?
    params:
      buckets:
        - id: b1
          label: Endziffer
        - id: b2
          label: Größenordnung
      items:
        - label: 32 · 41 = 1313
          bucket: b1
        - label: 32 · 41 = 13 120
          bucket: b2
        - label: 19 · 21 = 3999
          bucket: b2
        - label: 15 · 15 = 224
          bucket: b1
        - label: 26 · 34 = 8844
          bucket: b2
        - label: 17 · 13 = 223
          bucket: b1
    hints:
      - Was muss die letzte Ziffer sein? 2 · 1, 5 · 5, 7 · 3 …
      - "Runde beide Faktoren: Wie groß ist das Ergebnis ungefähr?"
    explanation: Bei 1313, 224 und 223 passt die Endziffer nicht. 13 120, 3999 und 8844 sind etwa zehnmal zu groß.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Neunerprobe: 37 lässt den Rest 1, 48 den Rest 3. Welchen Rest muss 37 · 48 lassen?"
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 4
        misconception: add-remainders
        text: Bei einem Produkt nimmt man die Reste mal, nicht plus.
    hints:
      - Reste verhalten sich wie die Zahlen selbst.
      - Rechne 1 · 3.
    explanation: "1 · 3 = 3. Probe: 37 · 48 = 1776, Quersumme 21, und 21 lässt den Rest 3."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Neunerprobe für 34 · 52 = 1768 geht auf. Was beweist das?
    params:
      options:
        - label: Nichts sicher – aber die meisten Fehler wären aufgefallen
          correct: true
        - label: Das Ergebnis stimmt sicher
          feedback: 1786 hat dieselbe Quersumme und wäre auch durchgekommen.
        - label: Das Ergebnis ist durch 9 teilbar
          feedback: Die Probe vergleicht nur Reste, sie sagt nichts über Teilbarkeit.
    hints:
      - Was passiert bei einem Zahlendreher mit der Quersumme?
    explanation: Eine Probe kann Fehler finden, aber Richtigkeit nicht beweisen. Zahlendreher übersieht sie.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: Richtig ist 34 · 52 = 1768. Welches falsche Ergebnis besteht trotzdem die Neunerprobe?
    params:
      options:
        - label: "1786"
          correct: true
        - label: "1767"
          feedback: Quersumme 21, Rest 3 – richtig wäre Rest 4.
        - label: "1778"
          feedback: Quersumme 23, Rest 5 – richtig wäre Rest 4.
    hints:
      - Die Quersumme von 1768 ist 22.
      - Welche Zahl hat dieselben Ziffern?
    explanation: Vertauschte Ziffern ändern die Quersumme nicht. Diesen Zahlendreher übersieht die Neunerprobe.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Rechnen mit Resten heißt **Modulo-Rechnung**. Man schreibt $4732 \equiv 7 \pmod 9$. Prüfziffern in ISBN, IBAN und Strichcodes beruhen genau darauf.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Quersumme den Rest beim Teilen durch 9 verrät.
    params:
      keywords:
        - - "10"
          - zehn
          - ten
          - "100"
          - hundert
        - - rest
          - remainder
          - übrig
          - left
        - - neun
          - nine
          - "99"
          - neuner
      sample: 10 ist 9 + 1 und 100 ist 99 + 1. Die Neuner gehen glatt auf. Von jeder Stelle bleibt nur die Ziffer als Rest übrig. Also hat die Zahl denselben Rest wie ihre Quersumme.
    explanation: "Kernidee: Jede Zehnerpotenz lässt beim Teilen durch 9 den Rest 1."
    difficulty: 3

srs:
  cards_from: [plausibel, rechnen]
