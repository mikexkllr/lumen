id: math.mental.check
type: concept
title: Die Probe machen
summary: Fehler sofort erkennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: endziffer
    widget: choice
    prompt: Welches Ergebnis für 37 · 48 ist sicher falsch – ohne genau zu rechnen?
    params:
      options:
        - { label: "1773", correct: true }
        - { label: "1776", feedback: "Das stimmt sogar. 7 · 8 = 56 endet auf 6." }
    hints:
      - Auf welche Ziffer endet 7 · 8?
    explanation: 7 · 8 = 56 – das Ergebnis muss auf 6 enden.

  - kind: explain
    body: |
      **Schnelle Proben:** Die letzte Ziffer prüfen. Die Größenordnung überschlagen. Gerade mal gerade ist immer gerade.

  - kind: problem
    id: plausibel
    widget: buckets
    prompt: Plausibel oder sicher falsch?
    params:
      buckets: [{ label: plausibel }, { label: sicher falsch }]
      items:
        - { label: "52 · 48 = 2496", bucket: plausibel }
        - { label: "19 · 21 = 399", bucket: plausibel }
        - { label: "46 · 24 = 1103", bucket: sicher falsch }
        - { label: "33 · 31 = 10 230", bucket: sicher falsch }
        - { label: "25 · 25 = 615", bucket: sicher falsch }
    hints:
      - Prüfe gerade und ungerade, die letzte Ziffer und die Größe.
    explanation: Gerade mal gerade kann nicht 1103 sein, 33 · 31 ist rund 1000, und 25 · 25 endet auf 25.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Rechne – {{a}} · {{b}}. Mach danach die Endziffer-Probe.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{a * b}}" }
    hints:
      - "Zerlege {{b}} in Zehner und Einer."
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[12,19]", b: "int[21,29]" }
      defaults: { a: 14, b: 23 }

srs:
  cards_from: [plausibel, rechnen]
