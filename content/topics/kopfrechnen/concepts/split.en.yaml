id: math.mental.split
type: concept
title: Split instead of struggle
summary: Round numbers make everything easier.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Gut feeling: what is 19 · 21?"
    params:
      min: 100
      max: 1000
    answer:
      value: 399
      tolerance: 45
    explanation: 20 · 20 = 400 – and 19 · 21 is just 1 below. You are about to see why.


  - kind: problem
    id: sieben-achtzehn
    widget: numeric
    prompt: Work it out in your head. 7 · 18.
    params: { placeholder: "Result" }
    answer: { value: 126 }
    hints:
      - "Think 7 · 20 and subtract something."
    explanation: 7 · 20 = 140, minus 7 · 2 = 14. That gives 126.

  - kind: explain
    id: s2
    body: |
      **Splitting:** 7 · 18 = 7 · 20 − 7 · 2 = 140 − 14 = 126.
      Your head handles round numbers much more easily.

  - kind: problem
    id: fast-rund
    widget: numeric
    prompt: Work it out in your head. {{a}} · {{b}}.
    params: { placeholder: "Result" }
    answer: { value: "{{a * b}}" }
    hints:
      - "{{b}} is close to {{b + (10 - mod(b, 10)) % 10}}."
    explanation: "{{a}} · {{b + (10 - mod(b, 10)) % 10}} − {{a}} · {{(10 - mod(b, 10)) % 10}} = {{a * b}}."
    variants:
      params: { a: "int[3,9]", b: "choice[19,29,39,49,98,99]" }
      defaults: { a: 6, b: 29 }

  - kind: explain
    id: s4
    body: |
      **Times 5** is times 10, then **halve**. **Times 25** is times 100, then divide by 4.
      **Times 9** is times 10, minus one copy.

  - kind: problem
    id: mal-fuenfundzwanzig
    widget: numeric
    prompt: Work it out in your head. 25 · {{n}}.
    params: { placeholder: "Result" }
    answer: { value: "{{25 * n}}" }
    hints:
      - "{{n}} · 100 = {{n * 100}}. Now divide by 4."
    explanation: "{{n * 100}} ÷ 4 = {{25 * n}}."
    variants:
      params: { n: "choice[12,16,24,36,44]" }
      defaults: { n: 16 }

  - kind: problem
    id: mal-fuenf
    widget: numeric
    prompt: Work it out in your head. {{n}} · 5.
    params: { placeholder: "Result" }
    answer: { value: "{{5 * n}}" }
    hints:
      - "{{n}} · 10 = {{n * 10}}. Now halve it."
    explanation: "{{n * 10}} ÷ 2 = {{5 * n}}."
    variants:
      params: { n: "step[24,98,2]" }
      defaults: { n: 48 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Times 5 means times [[10]] and then halve. Times 25 means times [[100]] and then divide by [[4]].
      distractors:
        - "2"
        - "50"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In your head – 99 · {{n}}.
    answer:
      value: "{{99 * n}}"
    hints:
      - Compute 100 · {{n}} and subtract {{n}} once.
    explanation: 100 · {{n}} − {{n}} = {{99 * n}}.
    difficulty: 2
    variants:
      params:
        n: int[12,48]
      defaults:
        n: 23

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In your head – 48 · 52.
    answer:
      value: 2496
    hints:
      - Both numbers are equally far from 50.
      - (50 − 2) · (50 + 2) = 50² − 2²
    explanation: 2500 − 4 = 2496. Behind it is the formula $(a-b)(a+b) = a^2 - b^2$.
    difficulty: 3

srs:
  cards_from: [fast-rund, mal-fuenfundzwanzig]
