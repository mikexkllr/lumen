id: math.mental.split
type: concept
title: Split instead of struggle
summary: Round numbers make everything easier.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: sieben-achtzehn
    widget: numeric
    prompt: Work it out in your head. 7 · 18.
    params: { placeholder: "Result" }
    answer: { value: 126 }
    hints:
      - "Think 7 · 20 and subtract something."
    explanation: 7 · 20 = 140, minus 7 · 2 = 14. That gives 126.

  - kind: explain
    body: |
      **Splitting:** 7 · 18 = 7 · 20 − 7 · 2 = 140 − 14 = 126.
      Your head handles round numbers much more easily.

  - kind: problem
    id: fast-rund
    widget: numeric
    prompt: Work it out in your head. {{a}} · {{b}}.
    params: { placeholder: "Result" }
    answer: { value: "{{a * b}}" }
    hints:
      - "{{b}} is close to {{b + (10 - mod(b, 10)) % 10}}."
    explanation: "{{a}} · {{b + (10 - mod(b, 10)) % 10}} − {{a}} · {{(10 - mod(b, 10)) % 10}} = {{a * b}}."
    variants:
      params: { a: "int[3,9]", b: "choice[19,29,39,49,98,99]" }
      defaults: { a: 6, b: 29 }

  - kind: explain
    body: |
      **Times 5** is times 10, then halve. **Times 25** is times 100, then divide by 4.
      **Times 9** is times 10, minus one copy.

  - kind: problem
    id: mal-fuenfundzwanzig
    widget: numeric
    prompt: Work it out in your head. 25 · {{n}}.
    params: { placeholder: "Result" }
    answer: { value: "{{25 * n}}" }
    hints:
      - "{{n}} · 100 = {{n * 100}}. Now divide by 4."
    explanation: "{{n * 100}} ÷ 4 = {{25 * n}}."
    variants:
      params: { n: "choice[12,16,24,36,44]" }
      defaults: { n: 16 }

  - kind: problem
    id: mal-fuenf
    widget: numeric
    prompt: Work it out in your head. {{n}} · 5.
    params: { placeholder: "Result" }
    answer: { value: "{{5 * n}}" }
    hints:
      - "{{n}} · 10 = {{n * 10}}. Now halve it."
    explanation: "{{n * 10}} ÷ 2 = {{5 * n}}."
    variants:
      params: { n: "step[24,98,2]" }
      defaults: { n: 48 }

srs:
  cards_from: [fast-rund, mal-fuenfundzwanzig]
