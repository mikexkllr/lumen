id: math.mental.split
type: concept
title: Split instead of struggle
summary: Round numbers make everything easier.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Gut feeling: what is 19 · 21?"
    params:
      min: 100
      max: 1000
    answer:
      value: 399
      tolerance: 45
    explanation: 20 · 20 = 400 – and 19 · 21 is just 1 below. You are about to see why.

  - kind: problem
    id: sieben-achtzehn
    widget: numeric
    prompt: Work it out in your head. 7 · 18.
    params: { placeholder: "Result" }
    answer: { value: 126 }
    hints:
      - "Think 7 · 20 and subtract something."
    explanation: 7 · 20 = 140, minus 7 · 2 = 14. That gives 126.

  - kind: explain
    id: s2
    body: |
      **Splitting:** 7 · 18 = 7 · 20 − 7 · 2 = 140 − 14 = 126.
      Your head handles round numbers much more easily.

  - kind: problem
    id: fast-rund
    widget: numeric
    prompt: Work it out in your head. {{a}} · {{b}}.
    params: { placeholder: "Result" }
    answer: { value: "{{a * b}}" }
    hints:
      - "{{b}} is close to {{b + (10 - mod(b, 10)) % 10}}."
    explanation: "{{a}} · {{b + (10 - mod(b, 10)) % 10}} − {{a}} · {{(10 - mod(b, 10)) % 10}} = {{a * b}}."
    variants:
      params: { a: "int[3,9]", b: "choice[19,29,39,49,98,99]" }
      defaults: { a: 6, b: 29 }

  - kind: explain
    id: s4
    body: |
      **Times 5** is times 10, then **halve**. **Times 25** is times 100, then divide by 4.
      **Times 9** is times 10, minus one copy.

  - kind: problem
    id: mal-fuenfundzwanzig
    widget: numeric
    prompt: Work it out in your head. 25 · {{n}}.
    params: { placeholder: "Result" }
    answer: { value: "{{25 * n}}" }
    hints:
      - "{{n}} · 100 = {{n * 100}}. Now divide by 4."
    explanation: "{{n * 100}} ÷ 4 = {{25 * n}}."
    variants:
      params: { n: "choice[12,16,24,36,44]" }
      defaults: { n: 16 }

  - kind: problem
    id: mal-fuenf
    widget: numeric
    prompt: Work it out in your head. {{n}} · 5.
    params: { placeholder: "Result" }
    answer: { value: "{{5 * n}}" }
    hints:
      - "{{n}} · 10 = {{n * 10}}. Now halve it."
    explanation: "{{n * 10}} ÷ 2 = {{5 * n}}."
    variants:
      params: { n: "step[24,98,2]" }
      defaults: { n: 48 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Times 5 means times [[10]] and then halve. Times 25 means times [[100]] and then divide by [[4]].
      distractors:
        - "2"
        - "50"

  - kind: problem
    id: ma-c1
    widget: numeric
    prompt: Mental maths – {{n}} · 9.
    answer:
      value: "{{9 * n}}"
    feedback:
      - when: numval(state.input) == 10 * n
        misconception: forgot-correction
        text: That is {{n}} · 10. Now subtract {{n}} once.
    hints:
      - Times 9 is almost times 10.
      - Work out {{n}} · 10 = {{10 * n}} and subtract {{n}}.
    explanation: "{{n}} · 10 − {{n}} = {{10 * n}} − {{n}} = {{9 * n}}."
    variants:
      params:
        n: int[12,48]
      defaults:
        n: 27

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In your head – 99 · {{n}}.
    answer:
      value: "{{99 * n}}"
    hints:
      - Compute 100 · {{n}} and subtract {{n}} once.
    explanation: 100 · {{n}} − {{n}} = {{99 * n}}.
    difficulty: 2
    variants:
      params:
        n: int[12,48]
      defaults:
        n: 23

  - kind: explain
    id: ma-d1
    depth: 2
    body: Why does splitting work? 7 · 12 means 7 rows of 12 squares. Cut them into 7 · 10 and 7 · 2. This is the **distributive law**.
    visual:
      widget: rect
      params:
        maxW: 12
        maxH: 8
        w: 12
        h: 7
        show:
          - area
        unit: cm

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Double and halve – {{a}} · {{b}}.
    answer:
      value: "{{a * b}}"
    hints:
      - Halve {{a}} and double {{b}}. The product stays the same.
      - Work out {{a / 2}} · {{2 * b}}.
    explanation: "{{a}} · {{b}} = {{a / 2}} · {{2 * b}} = {{a * b}}. Halving and doubling cancel out."
    difficulty: 2
    variants:
      params:
        a: step[12,28,2]
        b: choice[15,35,45]
      defaults:
        a: 14
        b: 15

  - kind: problem
    id: ma-d3
    depth: 2
    widget: order
    prompt: Work out 23 · 19 in your head. Put the steps in order.
    params:
      items:
        - label: 19 is 20 − 1
        - label: 23 · 20 = 460
        - label: 23 · 1 = 23
        - label: 460 − 23 = 437
    hints:
      - Which round number is close to 19?
      - First times 20, then subtract the rest.
    explanation: 23 · 19 = 23 · (20 − 1) = 460 − 23 = 437.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: choice
    prompt: Which way of splitting 8 · 26 is wrong?
    params:
      options:
        - label: 8 · 20 + 6
          correct: true
        - label: Correctly split – 160 + 48 = 208.
          feedback: Richtig zerlegt – 160 + 48 = 208.
        - label: Also correct – 240 − 32 = 208.
          feedback: Auch richtig – 240 − 32 = 208.
        - label: Correct – halved and doubled.
          feedback: Richtig – halbiert und verdoppelt.
    hints:
      - Every part must be multiplied by 8.
      - Where is one part missing the 8?
    explanation: In 8 · 20 + 6 the 6 is not multiplied by 8. Correct is 8 · 20 + 8 · 6 = 208.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In your head – 48 · 52.
    answer:
      value: 2496
    hints:
      - Both numbers are equally far from 50.
      - (50 − 2) · (50 + 2) = 50² − 2²
    explanation: 2500 − 4 = 2496. Behind it is the formula $(a-b)(a+b) = a^2 - b^2$.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Calculate cleverly – {{m - k}} · {{m + k}}.
    answer:
      value: "{{m * m - k * k}}"
    feedback:
      - when: numval(state.input) == m * m
        misconception: forgot-square
        text: Almost! You still have to subtract {{k}}² = {{k * k}}.
    hints:
      - Both numbers are {{k}} away from {{m}}.
      - Work out {{m}}² − {{k}}².
    explanation: $(m-k)(m+k) = m^2 - k^2$, so {{m * m}} − {{k * k}} = {{m * m - k * k}}.
    difficulty: 3
    variants:
      params:
        m: choice[30,40,60,70]
        k: int[2,6]
      defaults:
        m: 40
        k: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Why is 19 · 21 = 20 · 20 − 1?
    reveal:
      body: "Take one row off the 20 × 20 square and add it as a column. Only one corner square is missing. In algebra: $(a-b)(a+b) = a^2 - b^2$."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why 7 · 18 is the same as 7 · 20 − 7 · 2.
    params:
      keywords:
        - - "20"
          - zwanzig
          - twenty
        - - zwei
          - two
          - weniger
          - minus
          - less
          - fewer
        - - sieben
          - seven
          - reihe
          - mal
          - row
          - times
          - jede
          - each
      sample: 18 is 20 minus 2. Seven times 20 is too much – exactly seven times 2 too much. So you subtract 7 · 2 again.
    explanation: "Key idea: 7 · 20 counts 7 · 2 too many – so you take them away. That is the distributive law."
    difficulty: 3

srs:
  cards_from: [fast-rund, mal-fuenfundzwanzig]
