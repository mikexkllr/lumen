id: math.mental.estimate
type: concept
title: Estimating
summary: Judge orders of magnitude with confidence.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many breaths do you take in a day?"
    params:
      min: 1000
      max: 1000000
      scale: log
    answer:
      value: 22000
      within: 45
    explanation: About 15 breaths a minute times 1440 minutes is roughly 22,000.

  - kind: problem
    id: groessenordnung
    widget: choice
    prompt: Is 398 · 21 roughly 800, 8,000 or 80,000?
    params:
      layout: grid
      options:
        - { label: "8,000", correct: true }
        - { label: "800", feedback: "Too small. 400 · 20 already has four digits." }
        - { label: "80,000", feedback: "Too big. Work out 400 · 20." }
    hints:
      - Round both numbers.
    explanation: 400 · 20 = 8000. The exact value is 8358.

  - kind: explain
    id: s2
    body: |
      **Estimate:** Round to one digit and calculate with that.
      398 · 21 ≈ 400 · 20 = 8000. This way wrong results stand out at once.

  - kind: problem
    id: ueberschlag
    widget: numeric
    prompt: Estimate {{a}} · {{b}}. Roughly is enough.
    params: { placeholder: "roughly" }
    answer: { value: "{{a * b}}", tolerance: "{{round(a * b * 0.15)}}" }
    hints:
      - "Round {{a}} and {{b}} to one digit."
    explanation: "The exact value is {{a * b}}."
    variants:
      params: { a: "int[31,89]", b: "int[21,79]" }
      defaults: { a: 49, b: 61 }

  - kind: problem
    id: einkauf
    widget: choice
    prompt: Your shopping comes to 4.95 €, 12.10 €, 2.89 € and 7.05 €. Is 25 € enough?
    params:
      options:
        - { label: "No", correct: true }
        - { label: "Yes", feedback: "Round: 5 + 12 + 3 + 7 = 27." }
    hints:
      - Round each price to whole euros.
    explanation: Rounded, it is 5 + 12 + 3 + 7 = 27 €. The exact total is 26.99 €.

  - kind: explain
    id: s5
    body: Roughly how often does a heart beat in a human lifetime?
    reveal:
      body: 70 beats per minute · 60 · 24 · 365 · 80 years ≈ 3 billion. Such **Fermi estimates** help you get a feel for sizes.

  - kind: problem
    id: sekunden
    widget: choice
    prompt: About how many seconds are in a year?
    params:
      options:
        - { label: About 30 million, correct: true }
        - { label: About 3 million, feedback: "Too few. A single day has over 86,000 seconds." }
        - { label: About 300 million, feedback: "Too many. Work out 90,000 · 365." }
    hints:
      - A day has about 90,000 seconds.
    explanation: 86,400 · 365 ≈ 31.5 million.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 49 · 31 is roughly 1500.
          right: true
        - text: 7.9 · 0.52 is roughly 40.
          right: false
          why: 8 · 0.5 = 4. Times 0.5 halves.
        - text: 612 ÷ 19 is roughly 30.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Fermi question: you drink about 2 litres a day. How many litres is that in 80 years – roughly?"
    params:
      unit: l
    answer:
      value: 58400
      tolerance: 12000
    hints:
      - 2 litres times 365 days is about 700 litres a year.
    explanation: 700 · 80 ≈ 56,000 litres – a small swimming pool.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many hairs are on a human head?"
    params:
      min: 1000
      max: 10000000
      scale: log
    answer:
      value: 100000
      within: 50
    explanation: About 100,000. Roughly 2 hairs per mm² times about 600 cm² of scalp gives just over 100,000.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: How many minutes are in a week?
    answer:
      value: 10080
    feedback:
      - when: numval(state.input) == 168
        misconception: unit-step
        text: Those are the hours. Each hour has 60 minutes.
    hints:
      - "Hours first: 7 · 24."
      - 168 hours times 60.
    explanation: 7 · 24 = 168 hours, 168 · 60 = 10,080 minutes.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: Roughly how many seconds does a person live in 80 years?
    params:
      options:
        - label: 2.5 million
          feedback: That is only about 29 days.
        - label: 2.5 billion
          correct: true
        - label: 2.5 trillion
          feedback: A thousand times too much – that would be 80,000 years.
    hints:
      - A year has about 30 million seconds.
      - Work out 30 million · 80.
    explanation: 3 · 10⁷ · 80 = 2.4 · 10⁹ – roughly 2.5 billion seconds.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "For 38 · 47 you round both factors up: 40 · 50. What is true of the estimate?"
    params:
      options:
        - label: It is certainly too large
          correct: true
        - label: It is certainly too small
          feedback: Both factors grew – so did the product.
        - label: The errors cancel
          feedback: That only happens if you round one factor up and the other down.
    hints:
      - What happens to a product when both factors grow?
    explanation: "2000 instead of 1786. For a closer estimate round in opposite directions: 40 · 45 = 1800."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Fermi estimates often land surprisingly close. Some guesses are too big, others too small. These **errors** often partly cancel out.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "If a quantity lies between 10 and 1000, estimate the **geometric mean**: $\\sqrt{10 \\cdot 1000}$. What is it?"
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 505
        misconception: arithmetic-mean
        text: That is the ordinary average. It is far closer to 1000 – the geometric mean sits halfway between the powers of ten.
    hints:
      - 10 · 1000 = 10,000.
      - Which number times itself gives 10,000?
    explanation: √10,000 = 100. From 10 to 100 is a factor of 10, and from 100 to 1000 as well. 100 is right in the middle.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: A book has 300 pages, each with 40 lines of about 10 words. How many words does it have?
    answer:
      value: 120000
    hints:
      - First the words per page.
      - 400 words · 300 pages.
    explanation: 40 · 10 = 400 words per page, times 300 gives 120,000 words.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how you roughly estimate the heartbeats in a lifetime.
    params:
      keywords:
        - - minute
          - pro
          - per
        - - mal
          - multipli
          - multiply
          - times
        - - rund
          - ungefähr
          - grob
          - runde
          - round
          - rough
          - about
      sample: I take 70 beats per minute and multiply by 60, 24, 365 and 80 years, rounding roughly. That gives about 3 billion.
    explanation: "Key idea: scale up a known rate (per minute) step by step and round generously."
    difficulty: 3

srs:
  cards_from: [ueberschlag, groessenordnung]
