id: cs.databases.keys
type: concept
title: Schlüssel
summary: Jeder Datensatz eindeutig.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Keine Verwechslung möglich
    body: "Ein Paket unter Millionen, ein Auto unter allen in Europa: Verwechselt wird trotzdem nichts. Deck die Karten auf. Was ist **ihr gemeinsamer Trick**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📦
            front: Die Sendungsnummer
            back: Jedes Paket bekommt eine eigene Nummer. Damit findet es jeder Scanner unterwegs.
          - icon: 🚗
            front: Das Kennzeichen
            back: Kein Kennzeichen gibt es in einem Land zweimal. Daran hängen Halter und Versicherung.
          - icon: 📚
            front: Die ISBN
            back: Jedes Buch hat eine eigene 13-stellige Nummer. Buchläden bestellen nur über sie.
          - icon: 🎫
            front: Die Ticketnummer
            back: Am Einlass wird sie gescannt. Ein zweites Mal kommt mit demselben Ticket niemand rein.

  - kind: problem
    id: hook
    widget: choice
    prompt: An einer Schule gibt es zwei Kinder namens Mia Müller. Woran unterscheidet die Schule sie sicher?
    params:
      options:
        - label: An einer eindeutigen Schülernummer
          correct: true
        - label: Am Namen
          feedback: Der ist ja gleich.
        - label: An der Haarfarbe
          feedback: Die kann sich ändern – oder gleich sein.
    hints:
      - Was hat jedes Kind nur einmal?
    explanation: Eine solche Nummer heißt in Datenbanken Schlüssel.

  - kind: explain
    id: s1
    body: |
      Ein **Primärschlüssel** macht jede Zeile eindeutig – meist eine laufende Nummer. Andere Tabellen zeigen mit einem **Fremdschlüssel** darauf. So muss man nichts kopieren.

  - kind: problem
    id: gut
    widget: choice
    prompt: Welche Spalte eignet sich als Primärschlüssel für Kunden?
    params:
      options:
        - { label: Eine vergebene Kundennummer, correct: true }
        - { label: Der Nachname, feedback: "Viele Menschen heißen Müller – der Schlüssel muss eindeutig sein." }
        - { label: Die Stadt, feedback: "Viele Kunden wohnen in derselben Stadt." }
    hints:
      - Kann der Wert bei zwei Menschen gleich sein?
    explanation: Eine eigene Nummer ist eindeutig und ändert sich nie.

  - kind: problem
    id: fremd
    widget: choice
    body: "Spalten der Tabelle »Bestellung«: Nr, Kunde, Artikel."
    prompt: Was steht in der Spalte »Kunde«?
    params:
      options:
        - { label: Ein Verweis auf eine Zeile der Kundenliste, correct: true }
        - { label: Die Nummer der Bestellung, feedback: "Die steht in »Nr«. Ein Kunde kann oft bestellen." }
    hints:
      - Worauf zeigt sie?
    explanation: So ein Verweis heißt **Fremdschlüssel**. Man zeigt auf den Kunden, statt alles zu kopieren.

  - kind: problem
    id: doppelt
    widget: choice
    prompt: Warum speichert man die Adresse nur einmal in der Kundentabelle statt in jeder Bestellung?
    params:
      options:
        - { label: Bei einem Umzug muss man sie dann nur an einer Stelle ändern., correct: true }
        - { label: Es sieht ordentlicher aus., feedback: "Es geht um Widerspruchsfreiheit – doppelte Daten laufen auseinander." }
    hints:
      - Was passiert bei einem Umzug, wenn die Adresse hundertmal gespeichert ist?
    explanation: Daten nur einmal speichern – das nennt man **Normalisierung**.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der [[Primärschlüssel]] macht jede Zeile eindeutig. Ein [[Fremdschlüssel]] verweist auf eine Zeile in einer anderen [[Tabelle]].
      distractors:
        - Index
        - Spalte

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Taugt das als Primärschlüssel?
    params:
      buckets:
        - id: b1
          label: Ja – eindeutig
        - id: b2
          label: Nein – kann doppelt sein
      items:
        - label: Kundennummer
          bucket: b1
        - label: Vorname
          bucket: b2
        - label: Ausweisnummer
          bucket: b1
        - label: Geburtsdatum
          bucket: b2
        - label: Wohnort
          bucket: b2
    hints:
      - Kann es zwei Menschen mit demselben Wert geben?
    explanation: Ein Schlüssel muss jede Zeile eindeutig machen.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein [[Primärschlüssel]] macht jede Zeile eindeutig. Ein [[Fremdschlüssel]] zeigt auf eine Zeile in einer anderen Tabelle.
      distractors:
        - Suchindex
        - Datentyp

  - kind: problem
    id: mix-c3
    widget: match
    prompt: Verbinde Begriff und Bedeutung.
    params:
      pairs:
        - left: Zeile
          right: Ein Datensatz
        - left: Spalte
          right: Eine Eigenschaft
        - left: Primärschlüssel
          right: Eindeutige Nummer
        - left: Fremdschlüssel
          right: Verweis auf andere Tabelle
    hints:
      - Eine Kundin ist eine Zeile, ihr Name steht in einer Spalte.
    explanation: Mit diesen vier Begriffen versteht man jede Tabelle.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Warum taugt der Name nicht als Primärschlüssel für Personen?
    params:
      options:
        - label: Namen sind nicht eindeutig und können sich ändern
          correct: true
        - label: Namen sind zu lang
          feedback: Die Länge ist nicht das Problem.
        - label: Namen enthalten Buchstaben
          feedback: Schlüssel dürfen Text sein.
    hints:
      - Wie viele Menschen heißen Anna Müller?
    explanation: Ein guter Schlüssel ist eindeutig und bleibt für immer gleich.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Eine Kundin hat 3 Bestellungen aufgegeben. Wie oft steht ihre Adresse in einer gut gebauten Datenbank?
    answer:
      value: 1
    hints:
      - Die Bestellungen zeigen mit einem Schlüssel auf die Kundin.
    explanation: Genau einmal. Zieht sie um, ändert man eine einzige Zeile.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Manchmal macht erst eine Kombination eine Zeile eindeutig. In einer Tabelle »Belegung« ist (Schüler, Kurs) ein **zusammengesetzter Schlüssel**: Jeder Schüler belegt jeden Kurs höchstens einmal."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Schüler belegen viele Kurse, Kurse haben viele Schüler. Wie bildet man das in Tabellen ab?
    params:
      options:
        - label: Mit einer dritten Tabelle, die Paare aus Schülernummer und Kursnummer speichert
          correct: true
        - label: Eine Spalte »Kurse« beim Schüler mit allen Kursen
          feedback: Das verletzt die erste Normalform.
        - label: Kurse und Schüler in eine große Tabelle
          feedback: Dann stehen Namen und Kursdaten vielfach doppelt.
    hints:
      - Weder Schüler noch Kurs kann einen einzelnen Fremdschlüssel tragen.
      - Die Beziehung selbst bekommt eine Tabelle.
    explanation: Viele-zu-viele-Beziehungen brauchen eine Verbindungstabelle. Jede Zeile darin ist ein Paar aus zwei Fremdschlüsseln.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: 30 Schüler belegen je 4 Kurse. Wie viele Zeilen hat die Belegungstabelle?
    answer:
      value: 120
    hints:
      - Jede Belegung ist eine Zeile.
      - 30 · 4.
    explanation: 30 · 4 = 120 Zeilen – jede nur zwei kleine Nummern. Namen und Kursdaten stehen weiter nur einmal.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Jemand löscht eine Kundin, zu der noch Bestellungen gehören. Was sollte eine gute Datenbank tun?
    params:
      options:
        - label: Das Löschen verweigern oder die Bestellungen mitbehandeln – Verweise ins Leere sind verboten
          correct: true
        - label: Einfach löschen
          feedback: Dann zeigen Bestellungen auf eine Kundin, die es nicht mehr gibt.
        - label: Die ganze Datenbank sperren
          feedback: Das wäre übertrieben.
    hints:
      - Worauf zeigt der Fremdschlüssel der Bestellung danach?
    explanation: "**Referenzielle Integrität**: Die Datenbank garantiert, dass jeder Verweis ein Ziel hat."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Die **dritte Normalform** sagt: Jede Spalte hängt vom Schlüssel ab, vom ganzen Schlüssel und von nichts als dem Schlüssel. Steht in »Kunden« der Ort zur Postleitzahl, hängt er an der PLZ – er gehört in eine eigene Tabelle."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Belegung(Schüler, Kurs, Kursraum) mit Schlüssel (Schüler, Kurs). Der Raum hängt nur vom Kurs ab. Was ist das Problem?
    params:
      options:
        - label: Der Raum steht bei jedem Schüler des Kurses erneut – er gehört in die Kurstabelle
          correct: true
        - label: Keins, der Schlüssel ist eindeutig
          feedback: Eindeutig ja, aber der Raum hängt nur an einem Teil davon.
        - label: Schüler können dann keine Kurse wechseln
          feedback: Wechseln geht – nur der Raum ist mehrfach gespeichert.
    hints:
      - Hängt der Raum vom ganzen Schlüssel ab?
      - Was passiert, wenn ein Kurs umzieht?
    explanation: Das verletzt die zweite Normalform. Zieht der Kurs um, muss man 30 Zeilen ändern – vergisst man eine, widerspricht sich die Datenbank.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Warum nehmen viele Datenbanken eine künstliche Nummer statt der E-Mail-Adresse als Primärschlüssel?
    params:
      options:
        - label: E-Mails ändern sich – die Nummer bleibt für immer gleich
          correct: true
        - label: Weil E-Mails nicht eindeutig sind
          feedback: Meist sind sie eindeutig – aber nicht dauerhaft.
        - label: Weil Nummern geheim sind
          feedback: Geheim muss ein Schlüssel nicht sein.
    hints:
      - Was passiert mit allen Fremdschlüsseln, wenn sich der Schlüssel ändert?
      - Ein guter Schlüssel ändert sich nie.
    explanation: Ändert sich ein Primärschlüssel, müssen alle Verweise mitziehen. Eine künstliche Nummer hat keine Bedeutung – und deshalb nie einen Grund, sich zu ändern.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wozu Primärschlüssel und Fremdschlüssel gut sind.
    params:
      keywords:
        - - eindeutig
          - unique
          - einmalig
        - - verweis
          - zeigt
          - refer
          - point
          - link
        - - doppelt
          - kopie
          - redundan
          - duplicate
          - copy
          - einmal
          - once
      sample: Der Primärschlüssel macht jede Zeile eindeutig, etwa eine Kundennummer. Ein Fremdschlüssel in einer anderen Tabelle verweist auf diese Nummer. So muss man Daten wie die Adresse nicht kopieren – sie stehen nur einmal da.
    difficulty: 3

srs:
  cards_from: [gut, doppelt]
