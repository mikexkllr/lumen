id: cs.databases.joins
type: concept
title: Tabellen verbinden
summary: Der Join.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Shop schreibt bei jeder Bestellung die volle Adresse neu dazu. Die Kundin zieht um. Was ist das Problem?
    params:
      options:
        - label: Die Adresse steht an vielen Stellen und muss überall geändert werden
          correct: true
        - label: Es gibt keins
          feedback: Alte Bestellungen zeigen dann die falsche Adresse.
        - label: Die Kundin wird gelöscht
          feedback: Nichts wird gelöscht.
    hints:
      - Wie oft ist die Adresse gespeichert?
    explanation: "Besser: einmal speichern und bei Bedarf verbinden."

  - kind: explain
    id: s1
    body: |
      Ein **Join** verbindet Tabellen über ihre Schlüssel. So bekommt jede Bestellung den Namen der Kundin dazu – ohne dass er doppelt gespeichert ist.

  - kind: problem
    id: wer
    widget: choice
    body: "Kunden: 1 Ana, 2 Ben, 3 Cem. Bestellungen: Lampe → Kunde 2, Tisch → Kunde 3, Stuhl → Kunde 2."
    prompt: Wer hat die Lampe bestellt?
    params:
      options:
        - { label: Ben, correct: true }
        - { label: Ana, feedback: "Die Lampe gehört zu Kunde 2." }
        - { label: Cem, feedback: "Cem hat Nummer 3 – er bestellte den Tisch." }
    hints:
      - Folge der Kundennummer.
    explanation: Kunde 2 ist Ben – genau diese Verknüpfung macht ein Join automatisch.

  - kind: problem
    id: anzahl
    widget: numeric
    body: "Kunden: 1 Ana, 2 Ben, 3 Cem. Bestellungen: Lampe → 2, Tisch → 3, Stuhl → 2."
    prompt: Wie viele Bestellungen hat Ben?
    params: { unit: Bestellungen }
    answer: { value: 2 }
    hints:
      - Zähle die Bestellungen mit Kunde 2.
    explanation: Lampe und Stuhl – zwei Bestellungen.

  - kind: problem
    id: ohne
    widget: choice
    prompt: Ana taucht im Ergebnis des Joins gar nicht auf. Warum?
    params:
      options:
        - { label: "Sie hat keine Bestellung, die auf sie verweist.", correct: true }
        - { label: Ihr Datensatz ist kaputt., feedback: "Ein normaler Join zeigt nur Paare, die zueinander passen." }
    hints:
      - Welche Bestellung zeigt auf Kunde 1?
    explanation: Wer keine Partner in der anderen Tabelle hat, fällt beim einfachen Join heraus.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein [[Join]] verbindet zwei Tabellen über ihre [[Schlüssel]].
      distractors:
        - Index
        - Namen

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Tabelle A hat 100 Zeilen, Tabelle B hat 50. Du verbindest sie **ohne** Bedingung – jede Zeile mit jeder. Wie viele Zeilen entstehen?
    answer:
      value: 5000
    hints:
      - Jede der 100 mit jeder der 50.
    explanation: 5000 – ein **Kreuzprodukt**. Bei Millionen Zeilen legt ein vergessenes ON den Server lahm.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Kunden: 1 Ana, 2 Ben, 3 Cem. Bestellungen: A von Kunde 2, B von Kunde 2, C von Kunde 3, D von Kunde 5. Der **INNER JOIN** behält nur Paare, bei denen die Kundennummern zusammenpassen."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Wie viele Zeilen liefert der INNER JOIN von Kunden und Bestellungen oben?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 4
        misconception: orphan
        text: Bestellung D zeigt auf Kunde 5 – den gibt es nicht.
    hints:
      - "Geh jede Bestellung durch: Gibt es ihren Kunden?"
      - A und B gehören Ben, C gehört Cem.
    explanation: Ben–A, Ben–B, Cem–C. Ana hat keine Bestellung, D keinen Kunden – beide fallen weg.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Und wie viele Zeilen liefert kunden LEFT JOIN bestellungen?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: inner-vs-left
        text: LEFT JOIN behält alle Kunden – auch Ana ohne Bestellung.
    hints:
      - Alle Zeilen der linken Tabelle bleiben.
      - Die 3 Treffer plus Ana mit NULL.
    explanation: "Ben–A, Ben–B, Cem–C und Ana–NULL: 4 Zeilen. So findet man Kunden ohne Bestellung: WHERE bestellung IS NULL."
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: match
    prompt: Welcher Join macht was?
    params:
      pairs:
        - left: INNER JOIN
          right: Nur Treffer auf beiden Seiten
        - left: LEFT JOIN
          right: Alle links, rechts notfalls NULL
        - left: FULL JOIN
          right: Alle von beiden Seiten
        - left: CROSS JOIN
          right: Jede Zeile mit jeder
    hints:
      - "LEFT heißt: Die linke Tabelle wird vollständig behalten."
      - CROSS kennt keine Bedingung.
    explanation: Die Joins unterscheiden sich darin, was mit Zeilen ohne Partner passiert.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du willst **alle** Kunden sehen – auch die ohne Bestellung. Welcher Join passt?
    params:
      options:
        - label: LEFT JOIN – er behält alle Zeilen der linken Tabelle
          correct: true
        - label: INNER JOIN
          feedback: Der zeigt nur Kunden, die mindestens eine Bestellung haben.
        - label: Gar keiner – das geht nicht
          feedback: Genau dafür gibt es den äußeren Join.
    hints:
      - Ana tauchte vorhin nicht auf. Wie holt man sie zurück?
    explanation: Fehlende Partner werden mit **NULL** aufgefüllt – dem Zeichen für »kein Wert«.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Wie viele Zeilen liefert ein FULL JOIN der Tabellen oben?
    answer:
      value: 5
    hints:
      - Alle Treffer, dazu alle Partnerlosen von beiden Seiten.
      - 3 Treffer + Ana + Bestellung D.
    explanation: "3 + 1 + 1 = 5. Bestellung D ohne Kunden zeigt: Eine Fremdschlüssel-Regel hätte sie gar nicht erst erlaubt."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Ein Join zweier Tabellen mit je einer Million Zeilen – ohne Index, jede Zeile mit jeder vergleichen. Wie viele Vergleiche sind das?
    params:
      options:
        - label: $10^{12}$ – darum nutzt man Indizes oder Hash-Joins
          correct: true
        - label: 2 Millionen
          feedback: Das wäre nur einmal durch beide Tabellen.
        - label: $10^6$
          feedback: Es sind eine Million mal eine Million.
    hints:
      - Jede der Millionen Zeilen links trifft jede der Millionen rechts.
      - $10^6$ · $10^6$.
    explanation: Eine Billion Vergleiche dauern Minuten. Ein Hash-Join braucht nur etwa zwei Millionen Schritte.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Wie arbeitet ein Hash-Join?
    params:
      options:
        - label: Er baut aus der kleineren Tabelle eine Hash-Tabelle und schlägt jede Zeile der größeren darin nach
          correct: true
        - label: Er sortiert beide Tabellen
          feedback: Das macht der Merge-Join.
        - label: Er vergleicht jede mit jeder, nur schneller
          feedback: Gerade das vermeidet er.
    hints:
      - Nachschlagen in einer Hash-Tabelle kostet O(1).
      - Einmal bauen, dann nur noch nachschlagen.
    explanation: Bauen kostet O(n), Nachschlagen O(m) – zusammen linear statt n · m. Datenstrukturen machen Datenbanken schnell.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein Join macht und warum man ihn braucht.
    params:
      keywords:
        - - schlüssel
          - key
          - nummer
          - number
          - id
        - - verbind
          - kombin
          - connect
          - combin
          - zusammen
          - join
        - - doppelt
          - redundan
          - einmal
          - once
          - duplicate
      sample: Daten liegen auf mehrere Tabellen verteilt, damit nichts doppelt gespeichert ist – jede Angabe nur einmal. Ein Join verbindet die Tabellen beim Abfragen über ihre Schlüssel, etwa die Kundennummer in der Bestellung.
    difficulty: 3

srs:
  cards_from: [wer, ohne]
