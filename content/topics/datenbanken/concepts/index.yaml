id: cs.databases.index
type: concept
title: Schnell und sicher
summary: Indizes und SQL-Injection.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du suchst »Fotosynthese« in einem dicken Biologiebuch. Wie geht es am schnellsten?
    params:
      options:
        - label: Hinten im Stichwortverzeichnis nachsehen
          correct: true
        - label: Jede Seite lesen
          feedback: Das dauert Stunden.
        - label: Zufällig aufschlagen
          feedback: Das ist reines Glück.
    hints:
      - Wo steht, auf welcher Seite ein Wort vorkommt?
    explanation: Datenbanken haben auch so ein Verzeichnis.

  - kind: explain
    id: s1
    body: |
      Ein **Index** ist wie das Stichwortverzeichnis eines Buches: eine sortierte Liste, die auf die richtigen Zeilen zeigt. Statt alles zu durchsuchen, springt die Datenbank fast direkt hin.

  - kind: problem
    id: schritte
    widget: choice
    prompt: Eine Tabelle hat eine Million Zeilen und einen sortierten Index. Wie viele Vergleiche braucht die Suche ungefähr?
    params:
      options:
        - { label: Etwa 20, correct: true }
        - { label: Etwa 500 000, feedback: "So viele braucht man ohne Index im Schnitt." }
        - { label: Genau einen, feedback: "Ganz ohne Vergleiche geht es nicht – aber fast." }
    hints:
      - Binäre Suche halbiert bei jedem Schritt.
    explanation: $2^{20}$ ist etwa eine Million – 20 Halbierungen reichen.

  - kind: problem
    id: injection
    widget: choice
    prompt: Ein Login baut die Abfrage direkt aus dem eingegebenen Text zusammen. Warum ist das gefährlich?
    params:
      options:
        - { label: Angreifer können eigenen SQL-Code einschleusen., correct: true }
        - { label: Es ist nur langsamer., feedback: "Es ist eine der häufigsten Sicherheitslücken überhaupt." }
    hints:
      - Was, wenn jemand SQL-Befehle ins Namensfeld tippt?
    explanation: Das heißt **SQL-Injection** – Eingaben werden zu Befehlen.

  - kind: problem
    id: schutz
    widget: choice
    prompt: Was schützt zuverlässig vor SQL-Injection?
    params:
      options:
        - { label: Vorbereitete Abfragen mit Platzhaltern, correct: true }
        - { label: Verbotene Wörter herausfiltern, feedback: "Filter lassen sich fast immer umgehen." }
    hints:
      - Eingaben sollten nie als Befehl gelesen werden.
    explanation: Mit Platzhaltern bleiben Eingaben immer reine Daten.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Lohnt sich hier ein Index?
    params:
      buckets:
        - id: b1
          label: Lohnt sich
        - id: b2
          label: Lohnt sich nicht
      items:
        - label: Spalte, nach der ständig gesucht wird
          bucket: b1
        - label: Tabelle mit nur 10 Zeilen
          bucket: b2
        - label: Spalte, die nie abgefragt wird
          bucket: b2
        - label: Kundennummer in einer Riesentabelle
          bucket: b1
    hints:
      - Ein Index kostet Platz und Pflege.
    explanation: Er lohnt sich, wo oft und in vielen Zeilen gesucht wird.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Index macht das [[Suchen]] schneller, aber das [[Schreiben]] etwas langsamer.
      distractors:
        - Zählen
        - Löschen

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Indizes machen das Suchen schnell. Warum legt man nicht auf jede Spalte einen?
    params:
      options:
        - label: Jeder Index muss bei jedem Schreiben mitgepflegt werden – das bremst und kostet Platz
          correct: true
        - label: Mehr als ein Index ist technisch unmöglich
          feedback: Tabellen haben oft mehrere.
        - label: Indizes machen Abfragen ungenau
          feedback: Sie ändern das Ergebnis nicht, nur das Tempo.
    hints:
      - Was muss beim Einfügen einer Zeile mit dem Index passieren?
    explanation: Lesen wird schneller, Schreiben langsamer – ein klassischer Kompromiss.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Eine Tabelle hat eine Million Zeilen. Wie viele Schritte braucht eine Suche mit Index ungefähr?"
    params:
      min: 1
      max: 100
    answer:
      value: 20
      tolerance: 5
    explanation: Etwa 20 statt einer Million. Jeder Schritt halbiert den Rest.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: numeric
    prompt: Ohne Index prüft die Datenbank jede Zeile. Im Schnitt findet sie den Treffer nach der Hälfte. Wie viele Zeilen sind das bei 1000 Zeilen?
    answer:
      value: 500
    hints:
      - Die Hälfte von 1000.
    explanation: 500 Schritte statt etwa 10 mit Index.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Überweisung bucht 100 € bei A ab und bei B auf. Zwischen beiden Schritten stürzt der Server ab. Was garantiert eine **Transaktion**?
    params:
      options:
        - label: Ganz oder gar nicht – die Abbuchung wird rückgängig gemacht
          correct: true
        - label: Dass der Server nie abstürzt
          feedback: Das kann niemand garantieren.
        - label: Dass das Geld bei der Bank bleibt
          feedback: Es darf weder verschwinden noch doppelt entstehen.
    hints:
      - Zwei Schritte, die nur gemeinsam Sinn ergeben.
    explanation: "Das **A** in ACID: Atomarität. Ohne sie könnte keine Bank mit Datenbanken arbeiten."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum verteilt man Daten auf mehrere Tabellen, statt alles in eine zu schreiben?"
    params:
      keywords:
        - - doppelt
          - wiederhol
          - einmal
          - mehrfach
          - duplicate
          - repeat
          - once
          - redundan
        - - änder
          - aktuell
          - fehler
          - widerspruch
          - change
          - update
          - error
          - inconsisten
        - - schlüssel
          - verweis
          - verbind
          - key
          - reference
          - link
          - join
      sample: So steht jede Information nur einmal da und muss bei einer Änderung nur an einer Stelle aktualisiert werden. Die Tabellen verbindet man über Schlüssel wieder miteinander.
    difficulty: 3

srs:
  cards_from: [schritte, injection]
