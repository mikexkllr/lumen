id: cs.databases.tables
type: concept
title: Daten in Tabellen
summary: Zeilen, Spalten, Datentypen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Eine **Datenbank** speichert Daten in Tabellen. Jede **Zeile** ist ein Datensatz – etwa eine Kundin. Jede **Spalte** ist eine Eigenschaft mit festem Datentyp – etwa Name oder Geburtsjahr.

  - kind: problem
    id: zellen
    widget: numeric
    prompt: Eine Tabelle hat {{r}} Zeilen und {{c}} Spalten. Wie viele Werte speichert sie?
    params: { unit: Werte }
    answer: { value: "{{r * c}}" }
    hints:
      - Zeilen mal Spalten.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "choice[100,250,1000]", c: "int[3,8]" }
      defaults: { r: 1000, c: 5 }

  - kind: problem
    id: typen
    widget: match
    prompt: Welcher Datentyp passt zur Spalte?
    params:
      pairs:
        - { left: Name, right: Text }
        - { left: Geburtsjahr, right: Ganze Zahl }
        - { left: Newsletter erwünscht, right: Ja oder Nein }
        - { left: Kontostand, right: Dezimalzahl }
    hints:
      - Mit welchen Werten will man rechnen?
    explanation: Feste Typen verhindern Unsinn – etwa »blau« als Geburtsjahr.

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum speichert eine App ihre Kunden nicht einfach in einer langen Textdatei?
    params:
      options:
        - { label: "Gezielt suchen, ändern und prüfen geht in Tabellen viel besser.", correct: true }
        - { label: Textdateien sind verboten., feedback: "Erlaubt schon – aber bei Millionen Einträgen hoffnungslos langsam und fehleranfällig." }
    hints:
      - Wie findest du in einem Roman alle Kunden aus Köln?
    explanation: Struktur macht Daten durchsuchbar und verlässlich.

srs:
  cards_from: [typen, warum]
