id: cs.databases.tables
type: concept
title: Daten in Tabellen
summary: Zeilen, Spalten, Datentypen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Welt in Tabellen
    body: Ob Playlist, Arzttermin oder Bahnticket – hinter fast jeder App steckt eine **Datenbank**. Deck die Karten auf. Was steht wohl in ihren Tabellen?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎵
            front: Deine Playlist
            back: "Jeder Song ist eine Zeile: Titel, Künstler, Länge. Jede Angabe hat ihre eigene Spalte."
          - icon: 🚆
            front: Das Bahnticket
            back: Jeder Sitzplatz darf nur einmal verkauft werden – auch wenn Tausende gleichzeitig buchen.
          - icon: 🩺
            front: Die Arztpraxis
            back: "Patienten, Termine, Rezepte: Jede Sorte von Daten bekommt ihre eigene Tabelle."
          - icon: 👟
            front: Die Suche im Shop
            back: Unter Millionen Produkten findet die Datenbank in Millisekunden rote Schuhe in Größe 42.

  - kind: problem
    id: hook
    widget: choice
    prompt: Wo findest du Omas Telefonnummer am schnellsten?
    params:
      options:
        - label: In der sortierten Kontaktliste
          correct: true
        - label: In einem Stapel loser Zettel
          feedback: Da musst du jeden Zettel ansehen.
        - label: In alten Chatnachrichten
          feedback: Das kann lange dauern.
    hints:
      - Wo ist alles gleich aufgebaut?
    explanation: Ordnung in Zeilen und Spalten macht Daten auffindbar.

  - kind: explain
    id: s1
    body: |
      Eine **Datenbank** speichert Daten in Tabellen. Jede **Zeile** ist ein Datensatz – etwa eine Kundin. Jede **Spalte** ist eine Eigenschaft mit festem Datentyp – etwa Name oder Geburtsjahr.

  - kind: problem
    id: zellen
    widget: numeric
    prompt: Eine Tabelle hat {{r}} Zeilen und {{c}} Spalten. Wie viele Werte speichert sie?
    params: { unit: Werte }
    answer: { value: "{{r * c}}" }
    hints:
      - Zeilen mal Spalten.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "choice[100,250,1000]", c: "int[3,8]" }
      defaults: { r: 1000, c: 5 }

  - kind: problem
    id: typen
    widget: match
    prompt: Welcher Datentyp passt zur Spalte?
    params:
      pairs:
        - { left: Name, right: Text }
        - { left: Geburtsjahr, right: Ganze Zahl }
        - { left: Newsletter erwünscht, right: Ja oder Nein }
        - { left: Kontostand, right: Dezimalzahl }
    hints:
      - Mit welchen Werten will man rechnen?
    explanation: Feste Typen verhindern Unsinn – etwa »blau« als Geburtsjahr.

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum speichert eine App ihre Kunden nicht einfach in einer langen Textdatei?
    params:
      options:
        - { label: "Gezielt suchen, ändern und prüfen geht in Tabellen viel besser.", correct: true }
        - { label: Textdateien sind verboten., feedback: "Erlaubt schon – aber bei Millionen Einträgen hoffnungslos langsam und fehleranfällig." }
    hints:
      - Wie findest du in einem Roman alle Kunden aus Köln?
    explanation: Struktur macht Daten durchsuchbar und verlässlich.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Jede Zeile einer Tabelle ist ein Datensatz.
          right: true
        - text: In einer Spalte dürfen Zahlen und Texte gemischt stehen.
          right: false
          why: Jede Spalte hat einen festen Datentyp.
        - text: Eine Datenbank kann aus vielen Tabellen bestehen.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Welchen Datentyp wählst du für eine Postleitzahl wie 01067?
    params:
      options:
        - label: Text – sonst geht die führende Null verloren
          correct: true
        - label: Ganze Zahl
          feedback: Aus 01067 würde 1067.
        - label: Kommazahl
          feedback: Mit Postleitzahlen rechnet man nicht.
    hints:
      - Rechnest du jemals mit einer Postleitzahl?
    explanation: Was wie eine Zahl aussieht, ist nicht immer eine. Telefonnummern und Postleitzahlen sind Text.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Die **erste Normalform** verlangt: In jeder Zelle steht genau ein Wert. »Telefon: 0151…, 0170…« in einer Zelle ist verboten. Jede Nummer bekommt eine eigene Zeile in einer eigenen Tabelle."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: buckets
    prompt: Erfüllt die Zelle die erste Normalform?
    params:
      buckets:
        - id: b1
          label: ein Wert – in Ordnung
        - id: b2
          label: mehrere Werte – verboten
      items:
        - label: "Geburtsdatum: 2001-05-03"
          bucket: b1
        - label: "Hobbys: Lesen, Tennis"
          bucket: b2
        - label: "Preis: 4,99"
          bucket: b1
        - label: "Kinder: Mia, Ben"
          bucket: b2
        - label: "Tags: rot; blau"
          bucket: b2
        - label: "Stadt: Leipzig"
          bucket: b1
    hints:
      - Steht in der Zelle eine Aufzählung?
      - Kommas oder Strichpunkte trennen oft mehrere Werte.
    explanation: Listen in Zellen kann man schlecht durchsuchen und zählen. »Wer spielt Tennis?« geht nur sauber, wenn jedes Hobby eine eigene Zeile hat.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Eine Tabelle hat {{r}} Millionen Zeilen zu je {{b}} Byte. Wie viele Megabyte sind das?
    params:
      unit: MB
    answer:
      value: "{{r * b}}"
    hints:
      - Eine Million Byte sind 1 MB.
      - "{{r}} · {{b}}."
    explanation: "{{r}} Millionen · {{b}} Byte = {{r * b}} MB – dazu kommen noch Indizes."
    difficulty: 2
    variants:
      params:
        r: int[1,9]
        b: choice[100,200,250,500]
      defaults:
        r: 1
        b: 200

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Tabelle speichert zu jeder Bestellung Kundenname, Adresse und Artikel. Derselbe Kunde bestellt 50-mal. Was ist das Problem?
    params:
      options:
        - label: Die Adresse steht 50-mal da – bei einem Umzug entstehen leicht Widersprüche
          correct: true
        - label: Die Tabelle wird zu breit
          feedback: Das Problem ist die Wiederholung, nicht die Breite.
        - label: Es gibt kein Problem
          feedback: Ändert man nur 49 der 50 Einträge, sind die Daten falsch.
    hints:
      - Was passiert, wenn man eine der 50 Kopien vergisst?
    explanation: "**Normalisierung**: Jede Information steht genau einmal. Das ist das Grundprinzip guten Datenbankdesigns."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Fehlt ein Wert, steht **NULL** in der Zelle – »unbekannt«, nicht 0 und nicht leer. Vorsicht: NULL = NULL ist nicht wahr, sondern wieder unbekannt. Man prüft darum mit IS NULL."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Was zählt SELECT COUNT(telefon) FROM kunden?
    params:
      options:
        - label: Nur die Zeilen, in denen telefon nicht NULL ist
          correct: true
        - label: Alle Zeilen
          feedback: Das macht COUNT(*).
        - label: Die verschiedenen Telefonnummern
          feedback: Dafür bräuchte man COUNT(DISTINCT telefon).
    hints:
      - COUNT einer Spalte überspringt fehlende Werte.
      - Was ist der Unterschied zu COUNT(*)?
    explanation: COUNT(*) zählt Zeilen, COUNT(spalte) zählt vorhandene Werte. Fehlt bei 30 von 100 Kunden die Nummer, ergibt das 70.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Warum speichert man Geldbeträge nicht als Gleitkommazahl?
    params:
      options:
        - label: Wegen Rundungsfehlern – man nimmt DECIMAL oder rechnet in ganzen Cent
          correct: true
        - label: Weil Gleitkomma zu viel Platz braucht
          feedback: Ein double hat nur 8 Byte.
        - label: Weil Datenbanken keine Kommazahlen kennen
          feedback: Sie kennen sogar mehrere Arten.
    hints:
      - Was ergibt 0,1 + 0,2 im Computer?
      - Bei Geld darf kein Cent verloren gehen.
    explanation: 0,10 € ist binär nicht exakt darstellbar. Über Millionen Buchungen summieren sich die Fehler. DECIMAL speichert Dezimalstellen exakt.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Tabelle in einer Datenbank aufgebaut ist.
    params:
      keywords:
        - - zeile
          - row
          - datensatz
          - record
        - - spalte
          - column
          - eigenschaft
          - attribute
        - - typ
          - type
      sample: Jede Zeile ist ein Datensatz, etwa eine Kundin. Jede Spalte ist eine Eigenschaft wie Name oder Alter und hat einen festen Datentyp, etwa Text oder Zahl.
    difficulty: 3

srs:
  cards_from: [typen, warum]
