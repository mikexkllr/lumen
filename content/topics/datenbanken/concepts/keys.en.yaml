id: cs.databases.keys
type: concept
title: Keys
summary: Every record unique.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: No mix-ups possible
    body: "One parcel among millions, one car among all those in Europe: still nothing gets mixed up. Flip the cards. What is **the trick they share**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📦
            front: The tracking number
            back: Every parcel gets its own number. With it, every scanner on the way finds it.
          - icon: 🚗
            front: The number plate
            back: No number plate exists twice in one country. Owner and insurance are linked to it.
          - icon: 📚
            front: The ISBN
            back: Every book has its own 13-digit number. Bookshops order by that alone.
          - icon: 🎫
            front: The ticket number
            back: It is scanned at the entrance. No one gets in a second time with the same ticket.

  - kind: problem
    id: hook
    widget: choice
    prompt: A school has two children called Mia Miller. How does the school tell them apart for sure?
    params:
      options:
        - label: By a unique pupil number
          correct: true
        - label: By the name
          feedback: That is the same.
        - label: By hair colour
          feedback: That can change – or be the same.
    hints:
      - What does each child have only once?
    explanation: In databases such a number is called a key.

  - kind: explain
    id: s1
    body: |
      A **primary key** makes each row unique, usually a running number. Other tables point to it with a **foreign key**. That way nothing needs to be copied.

  - kind: problem
    id: gut
    widget: choice
    prompt: Which column works as a primary key for customers?
    params:
      options:
        - { label: An assigned customer number, correct: true }
        - { label: The last name, feedback: "Many people are called Smith. The key must be unique." }
        - { label: The city, feedback: "Many customers live in the same city." }
    hints:
      - Can two people have the same value?
    explanation: A dedicated number is unique and never changes.

  - kind: problem
    id: fremd
    widget: choice
    body: "Columns of the table “Order”: No, Customer, Item."
    prompt: What is stored in the column “Customer”?
    params:
      options:
        - { label: A reference to a row in the customer list, correct: true }
        - { label: The number of the order, feedback: "That is in “No”. A customer can often order." }
    hints:
      - What does it point to?
    explanation: Such a reference is called a **foreign key**. You point to the customer instead of copying everything.

  - kind: problem
    id: doppelt
    widget: choice
    prompt: Why store the address only once in the customer table instead of in every order?
    params:
      options:
        - { label: "After a move, you only change it in one place.", correct: true }
        - { label: It looks tidier., feedback: "It is about consistency. Duplicated data drifts apart." }
    hints:
      - What happens after a move if the address is stored a hundred times?
    explanation: Store data only once. This is called **normalization**.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[primary key]] makes every row unique. A [[foreign key]] points to a row in another [[table]].
      distractors:
        - index
        - column

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does this work as a primary key?
    params:
      buckets:
        - id: b1
          label: Yes – unique
        - id: b2
          label: No – can repeat
      items:
        - label: Customer number
          bucket: b1
        - label: First name
          bucket: b2
        - label: ID card number
          bucket: b1
        - label: Date of birth
          bucket: b2
        - label: Home town
          bucket: b2
    hints:
      - Can two people have the same value?
    explanation: A key must make every row unique.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A [[primary key]] makes every row unique. A [[foreign key]] points to a row in another table.
      distractors:
        - search index
        - data type

  - kind: problem
    id: mix-c3
    widget: match
    prompt: Match term and meaning.
    params:
      pairs:
        - left: Row
          right: One record
        - left: Column
          right: One property
        - left: Primary key
          right: Unique number
        - left: Foreign key
          right: Link to another table
    hints:
      - A customer is a row, her name is in a column.
    explanation: With these four terms you understand any table.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Why is the name unsuitable as a primary key for people?
    params:
      options:
        - label: Names are not unique and can change
          correct: true
        - label: Names are too long
          feedback: Length is not the problem.
        - label: Names contain letters
          feedback: Keys may be text.
    hints:
      - How many people are called Anna Müller?
    explanation: A good key is unique and stays the same forever.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: A customer has placed 3 orders. How often is her address stored in a well-built database?
    answer:
      value: 1
    hints:
      - The orders point to the customer with a key.
    explanation: Exactly once. If she moves, a single row is changed.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Sometimes only a combination makes a row unique. In an »enrolment« table, (student, course) is a **composite key**: each student takes each course at most once."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Students take many courses, courses have many students. How do you model that in tables?
    params:
      options:
        - label: With a third table that stores pairs of student number and course number
          correct: true
        - label: A column »courses« with all courses at the student
          feedback: That breaks the first normal form.
        - label: Students and courses in one big table
          feedback: Then names and course data repeat many times.
    hints:
      - Neither student nor course can carry a single foreign key.
      - The relationship itself gets a table.
    explanation: Many-to-many relationships need a link table. Each of its rows is a pair of two foreign keys.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: 30 students take 4 courses each. How many rows does the enrolment table have?
    answer:
      value: 120
    hints:
      - Each enrolment is a row.
      - 30 · 4.
    explanation: 30 · 4 = 120 rows – each just two small numbers. Names and course data still appear only once.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Someone deletes a customer who still has orders. What should a good database do?
    params:
      options:
        - label: Refuse the deletion or handle the orders too – dangling references are forbidden
          correct: true
        - label: Simply delete
          feedback: Then orders point to a customer who no longer exists.
        - label: Lock the whole database
          feedback: That would be excessive.
    hints:
      - What does the order’s foreign key point to afterwards?
    explanation: "**Referential integrity**: the database guarantees that every reference has a target."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "The **third normal form** says: every column depends on the key, the whole key and nothing but the key. If »customers« stores the town of each postcode, the town depends on the postcode – it needs its own table."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Enrolment(student, course, course room) with key (student, course). The room depends only on the course. What is the problem?
    params:
      options:
        - label: The room is repeated for every student of the course – it belongs in the course table
          correct: true
        - label: None, the key is unique
          feedback: Unique yes, but the room depends on only part of it.
        - label: Students then cannot change courses
          feedback: Changing works – only the room is stored many times.
    hints:
      - Does the room depend on the whole key?
      - What happens if a course moves rooms?
    explanation: That violates the second normal form. If the course moves, 30 rows must change – forget one and the database contradicts itself.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Why do many databases pick a made-up number as the main key, not the email?
    params:
      options:
        - label: Emails change – the number stays the same forever
          correct: true
        - label: Because emails are not unique
          feedback: Usually they are unique – but not permanent.
        - label: Because numbers are secret
          feedback: A key need not be secret.
    hints:
      - What happens to all foreign keys if the key changes?
      - A good key never changes.
    explanation: If a primary key changes, every reference must follow. An artificial number has no meaning – so it never has a reason to change.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what primary keys and foreign keys are good for.
    params:
      keywords:
        - - eindeutig
          - unique
          - einmalig
        - - verweis
          - zeigt
          - refer
          - point
          - link
        - - doppelt
          - kopie
          - redundan
          - duplicate
          - copy
          - einmal
          - once
      sample: The primary key makes each row unique, like a customer number. A foreign key in another table refers to that number. So data like the address need not be copied – it is stored only once.
    difficulty: 3

srs:
  cards_from: [gut, doppelt]
