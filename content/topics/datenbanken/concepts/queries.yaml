id: cs.databases.queries
type: concept
title: Abfragen
summary: Fragen an die Datenbank.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Suchanfragen beantwortet Google pro Sekunde?"
    params:
      min: 100
      max: 10000000
      scale: log
    answer:
      value: 100000
      within: 60
    explanation: Rund 100 000 – jede ist eine Abfrage an riesige Datenbanken.

  - kind: explain
    id: s1
    body: |
      Mit der Sprache **SQL** stellt man Fragen an eine Datenbank: `SELECT name FROM kunden WHERE alter > 30` heißt – gib mir die Namen aller Kunden über 30.

  - kind: problem
    id: zaehlen
    widget: numeric
    body: "Tabelle kunden: Ana 28, Ben 35, Cem 41, Dana 30, Eli 52."
    prompt: Wie viele Zeilen liefert die Abfrage mit WHERE alter > 30?
    params: { unit: Zeilen }
    answer: { value: 3 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: inclusive
        text: Größer als 30 schließt Dana mit genau 30 aus.
    hints:
      - Genau 30 zählt nicht.
    explanation: Ben, Cem und Eli – Dana ist genau 30, nicht darüber.

  - kind: problem
    id: reihenfolge
    widget: order
    prompt: Bring die Teile einer SQL-Abfrage in die richtige Reihenfolge.
    params:
      items:
        - { label: SELECT name }
        - { label: FROM kunden }
        - { label: WHERE stadt = 'Köln' }
        - { label: ORDER BY name }
    hints:
      - Was, woher, welche, wie sortiert.
    explanation: Was du willst, woher, welche Zeilen, in welcher Ordnung.

  - kind: problem
    id: summe
    widget: choice
    prompt: Was liefert SELECT COUNT(*) FROM kunden?
    params:
      options:
        - { label: Die Zahl aller Kunden, correct: true }
        - { label: Alle Kundendaten, feedback: "COUNT zählt nur – es gibt eine einzige Zahl zurück." }
    hints:
      - COUNT heißt zählen.
    explanation: Solche Zusammenfassungen rechnet die Datenbank selbst – blitzschnell.

  - kind: problem
    id: c1
    widget: match
    prompt: Was macht der SQL-Teil?
    params:
      pairs:
        - left: SELECT
          right: wählt Spalten aus
        - left: FROM
          right: nennt die Tabelle
        - left: WHERE
          right: filtert Zeilen
        - left: ORDER BY
          right: sortiert das Ergebnis
    hints:
      - Lies eine Abfrage wie einen englischen Satz.
    explanation: SQL beschreibt, **was** man will – nicht, wie die Datenbank es findet.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Eine Tabelle hat 200 Kunden: 80 aus Berlin, davon 30 über 40 Jahre alt. Wie viele Zeilen liefert WHERE stadt = »Berlin« AND alter > 40?"
    answer:
      value: 30
    hints:
      - "AND heißt: beide Bedingungen müssen gelten."
    explanation: 30 – nur wer beides erfüllt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was liefert SELECT stadt, COUNT(*) FROM kunden GROUP BY stadt?
    params:
      options:
        - label: Für jede Stadt eine Zeile mit der Zahl ihrer Kunden
          correct: true
        - label: Alle Kunden, nach Stadt sortiert
          feedback: Sortieren wäre ORDER BY. Hier wird zusammengefasst.
        - label: Nur die Gesamtzahl aller Kunden
          feedback: Ohne GROUP BY wäre es so.
    hints:
      - GROUP BY bildet Gruppen, COUNT zählt in jeder.
    explanation: Gruppieren und Zusammenfassen – das Herz jeder Auswertung und jedes Dashboards.
    difficulty: 3

srs:
  cards_from: [zaehlen, reihenfolge]
