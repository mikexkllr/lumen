id: cs.databases.queries
type: concept
title: Abfragen
summary: Fragen an die Datenbank.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Sieb für Daten
    body: "Eine Abfrage siebt aus Millionen Zeilen genau die passenden heraus. Färbe die Kunden, die **beide** Bedingungen erfüllen: über 30 und aus Köln. Was würde sich bei ODER ändern?"
    visual:
      widget: venn
      interactive: true
      params:
        sets:
          - über 30
          - aus Köln
        universe: Kunden

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Suchanfragen beantwortet Google pro Sekunde?"
    params:
      min: 100
      max: 10000000
      scale: log
    answer:
      value: 100000
      within: 60
    explanation: Rund 100 000 – jede ist eine Abfrage an riesige Datenbanken.

  - kind: explain
    id: s1
    body: |
      Mit der Sprache **SQL** stellt man Fragen an eine Datenbank: `SELECT name FROM kunden WHERE alter > 30` heißt – gib mir die Namen aller Kunden über 30.

  - kind: problem
    id: zaehlen
    widget: numeric
    body: "Tabelle kunden: Ana 28, Ben 35, Cem 41, Dana 30, Eli 52."
    prompt: Wie viele Zeilen liefert die Abfrage mit WHERE alter > 30?
    params: { unit: Zeilen }
    answer: { value: 3 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: inclusive
        text: Größer als 30 schließt Dana mit genau 30 aus.
    hints:
      - Genau 30 zählt nicht.
    explanation: Ben, Cem und Eli – Dana ist genau 30, nicht darüber.

  - kind: problem
    id: reihenfolge
    widget: order
    prompt: Bring die Teile einer SQL-Abfrage in die richtige Reihenfolge.
    params:
      items:
        - { label: SELECT name }
        - { label: FROM kunden }
        - { label: WHERE stadt = 'Köln' }
        - { label: ORDER BY name }
    hints:
      - Was, woher, welche, wie sortiert.
    explanation: Was du willst, woher, welche Zeilen, in welcher Ordnung.

  - kind: problem
    id: summe
    widget: choice
    prompt: Was liefert SELECT COUNT(*) FROM kunden?
    params:
      options:
        - { label: Die Zahl aller Kunden, correct: true }
        - { label: Alle Kundendaten, feedback: "COUNT zählt nur – es gibt eine einzige Zahl zurück." }
    hints:
      - COUNT heißt zählen.
    explanation: Solche Zusammenfassungen rechnet die Datenbank selbst – blitzschnell.

  - kind: problem
    id: c1
    widget: match
    prompt: Was macht der SQL-Teil?
    params:
      pairs:
        - left: SELECT
          right: wählt Spalten aus
        - left: FROM
          right: nennt die Tabelle
        - left: WHERE
          right: filtert Zeilen
        - left: ORDER BY
          right: sortiert das Ergebnis
    hints:
      - Lies eine Abfrage wie einen englischen Satz.
    explanation: SQL beschreibt, **was** man will – nicht, wie die Datenbank es findet.

  - kind: problem
    id: intro-c1
    widget: venn
    prompt: Welche Kunden liefert `WHERE alter > 30 OR stadt = 'Köln'`? Färbe alle passenden Bereiche.
    params:
      sets:
        - über 30
        - aus Köln
      universe: Kunden
    answer:
      regions:
        - A
        - B
        - AB
    hints:
      - Bei ODER genügt eine der beiden Bedingungen.
      - Färbe beide Kreise ganz – auch die Mitte.
    explanation: ODER liefert alle über 30, alle aus Köln und alle, auf die beides zutrifft. Nur wer außerhalb beider Kreise liegt, fällt weg.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Eine Tabelle hat 200 Kunden: 80 aus Berlin, davon 30 über 40 Jahre alt. Wie viele Zeilen liefert WHERE stadt = »Berlin« AND alter > 40?"
    answer:
      value: 30
    hints:
      - "AND heißt: beide Bedingungen müssen gelten."
    explanation: 30 – nur wer beides erfüllt.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: In welcher Reihenfolge geht die Datenbank die Teile einer Abfrage durch?
    params:
      items:
        - label: FROM
        - label: WHERE
        - label: GROUP BY
        - label: HAVING
        - label: SELECT
        - label: ORDER BY
    hints:
      - Erst muss klar sein, aus welcher Tabelle die Zeilen kommen.
      - Gefiltert wird vor dem Gruppieren, sortiert ganz am Schluss.
    explanation: Deshalb darf WHERE keine Spaltennamen nutzen, die erst SELECT vergibt. Die Schreibreihenfolge ist eine andere als die Denkreihenfolge.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Die Spalte alter enthält 25, 34, 41, 29 und 52. Was liefert SELECT AVG(alter) FROM kunden?
    answer:
      value: 36.2
    hints:
      - Summe geteilt durch Anzahl.
      - 181 / 5.
    explanation: 25 + 34 + 41 + 29 + 52 = 181, durch 5 ergibt 36,2. Solche Rechnungen heißen Aggregatfunktionen.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Was unterscheidet WHERE von HAVING?
    params:
      options:
        - label: WHERE filtert Zeilen vor dem Gruppieren, HAVING filtert Gruppen danach
          correct: true
        - label: Nichts, beides ist gleich
          feedback: HAVING kann Bedingungen wie COUNT(*) > 10 prüfen, WHERE nicht.
        - label: HAVING ist nur schneller
          feedback: Es arbeitet an einer ganz anderen Stelle.
    hints:
      - Wann gibt es die Gruppen überhaupt erst?
      - COUNT(*) pro Stadt kennt man erst nach GROUP BY.
    explanation: »Städte mit über 10 Kunden« braucht HAVING COUNT(*) > 10 – dieser Wert entsteht erst beim Gruppieren.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: cloze
    prompt: Ergänze die Abfrage »Städte mit mehr als 10 Kunden, alphabetisch«.
    params:
      text: SELECT stadt, COUNT(*) FROM kunden [[GROUP BY]] stadt [[HAVING]] COUNT(*) > 10 [[ORDER BY]] stadt
      distractors:
        - WHERE
        - JOIN
    hints:
      - Erst gruppieren, dann Gruppen filtern, dann sortieren.
      - Die Bedingung über COUNT(*) steht bei HAVING.
    explanation: GROUP BY bildet die Städte, HAVING behält die großen, ORDER BY sortiert.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was liefert SELECT stadt, COUNT(*) FROM kunden GROUP BY stadt?
    params:
      options:
        - label: Für jede Stadt eine Zeile mit der Zahl ihrer Kunden
          correct: true
        - label: Alle Kunden, nach Stadt sortiert
          feedback: Sortieren wäre ORDER BY. Hier wird zusammengefasst.
        - label: Nur die Gesamtzahl aller Kunden
          feedback: Ohne GROUP BY wäre es so.
    hints:
      - GROUP BY bildet Gruppen, COUNT zählt in jeder.
    explanation: Gruppieren und Zusammenfassen – das Herz jeder Auswertung und jedes Dashboards.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Die Spalte alter enthält 20, NULL, 40, NULL und 60. Wie viele Zeilen liefert WHERE alter > 30 OR alter <= 30?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 5
        misconception: null-logic
        text: Für NULL ist jeder Vergleich »unbekannt« – und unbekannt fliegt raus.
    hints:
      - Was ergibt NULL > 30?
      - Unbekannt ODER unbekannt bleibt unbekannt.
    explanation: "SQL kennt drei Wahrheitswerte: wahr, falsch, unbekannt. Die beiden NULL-Zeilen fallen weg, obwohl die Bedingung »immer« klingt."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: SQL beschreibt, was man will, nicht wie man es findet. Wer entscheidet über den Weg?
    params:
      options:
        - label: Der Abfrageoptimierer der Datenbank
          correct: true
        - label: Der Programmierer in jeder Abfrage
          feedback: Er kann Hinweise geben – entscheiden muss er nicht.
        - label: Der Zufall
          feedback: Der Optimierer schätzt Kosten und wählt planvoll.
    hints:
      - Index nutzen oder alles durchgehen – wer weiß, was schneller ist?
      - Die Datenbank kennt ihre Tabellengrößen.
    explanation: Der Optimierer vergleicht Pläne – welcher Index, welche Join-Reihenfolge – und nimmt den billigsten. Mit EXPLAIN kann man ihm zuschauen.
    difficulty: 3

srs:
  cards_from: [zaehlen, reihenfolge]
