id: cs.databases.index
type: concept
title: Fast and safe
summary: Indexes and SQL injection.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A shortcut through the alphabet
    body: 'How does a database find one name among millions? It arranges the names in a **tree**. Tap the path from the top to "Omar": left means earlier in the alphabet, right means later.'
    visual:
      widget: network
      interactive: true
      params:
        start: L
        end: O
        unit: steps
        nodes:
          - id: L
            x: 50
            y: 8
            label: Lea
          - id: E
            x: 26
            y: 50
            label: Elif
          - id: S
            x: 74
            y: 50
            label: Sven
          - id: B
            x: 12
            y: 92
            label: Ben
          - id: J
            x: 38
            y: 92
            label: Jan
          - id: O
            x: 62
            y: 92
            label: Omar
          - id: T
            x: 88
            y: 92
            label: Tom
        edges:
          - a: L
            b: E
          - a: L
            b: S
          - a: E
            b: B
          - a: E
            b: J
          - a: S
            b: O
          - a: S
            b: T

  - kind: problem
    id: hook
    widget: choice
    prompt: You look for “photosynthesis” in a thick biology book. What is fastest?
    params:
      options:
        - label: Look it up in the index at the back
          correct: true
        - label: Read every page
          feedback: That takes hours.
        - label: Open at random
          feedback: That is pure luck.
    hints:
      - Where does it say on which page a word appears?
    explanation: Databases have such a directory too.

  - kind: explain
    id: s1
    body: |
      An **index** is like the index at the back of a book: a sorted list that points to the right rows. Instead of searching everything, the database jumps almost straight there.

  - kind: problem
    id: schritte
    widget: choice
    prompt: A table has a million rows and a sorted index. Roughly how many comparisons does a search need?
    params:
      options:
        - { label: About 20, correct: true }
        - { label: "About 500,000", feedback: "That is the average without an index." }
        - { label: Exactly one, feedback: "You can't do it with no comparisons, but it is close." }
    hints:
      - Binary search halves the range at every step.
    explanation: $2^{20}$ is about a million, so 20 halvings are enough.

  - kind: problem
    id: injection
    widget: choice
    prompt: A login builds its query directly from the text typed in. Why is that dangerous?
    params:
      options:
        - { label: Attackers can smuggle in their own SQL code., correct: true }
        - { label: It is only slower., feedback: "It is one of the most common security holes there is." }
    hints:
      - What if someone types SQL commands into the name field?
    explanation: This is called **SQL injection**. Input turns into commands.

  - kind: problem
    id: schutz
    widget: choice
    prompt: What reliably protects against SQL injection?
    params:
      options:
        - { label: Prepared statements with placeholders, correct: true }
        - { label: Filtering out forbidden words, feedback: "Filters can almost always be bypassed." }
    hints:
      - Input should never be read as a command.
    explanation: With placeholders, input always stays plain data.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Is an index worth it here?
    params:
      buckets:
        - id: b1
          label: Worth it
        - id: b2
          label: Not worth it
      items:
        - label: Column that is searched all the time
          bucket: b1
        - label: Table with only 10 rows
          bucket: b2
        - label: Column that is never queried
          bucket: b2
        - label: Customer number in a huge table
          bucket: b1
    hints:
      - An index costs space and upkeep.
    explanation: It pays where searches are frequent and rows are many.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An index makes [[searching]] faster but [[writing]] a little slower.
      distractors:
        - counting
        - deleting

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Indexes make searching fast. Why not put one on every column?
    params:
      options:
        - label: Every index must be updated on every write – that slows things down and costs space
          correct: true
        - label: More than one index is technically impossible
          feedback: Tables often have several.
        - label: Indexes make queries inexact
          feedback: They do not change the result, only the speed.
    hints:
      - What must happen to the index when a row is inserted?
    explanation: Reading gets faster, writing slower – a classic trade-off.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: a table has a million rows. Roughly how many steps does a search with an index take?"
    params:
      min: 1
      max: 100
    answer:
      value: 20
      tolerance: 5
    explanation: About 20 instead of a million. Each step halves the rest.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: numeric
    prompt: Without an index the database checks every row. On average it finds the hit after half of them. How many rows is that for 1000 rows?
    answer:
      value: 500
    hints:
      - Half of 1000.
    explanation: 500 steps instead of about 10 with an index.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: An index is a B-tree with up to 500 entries per node. How many levels does it need for 100 million rows?
    answer:
      value: 3
    hints:
      - Two levels manage 500 · 500 = 250,000.
      - Three levels manage 125 million.
    explanation: $500^3$ = 125 million ≥ 100 million. Three reads find any row – the upper levels usually even sit in memory.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: "A login builds: … WHERE name = 'INPUT' AND pw = '…'. Which input as the name bypasses the password check?"
    params:
      options:
        - label: admin' --
          correct: true
        - label: admin
          feedback: Then the password is checked as usual.
        - label: --admin
          feedback: That sits harmlessly inside the quotes.
    hints:
      - A quote mark ends the text early.
      - Two dashes start a comment in SQL.
    explanation: "The input becomes: name = 'admin' -- '… – the rest is a comment and the password is never checked. Placeholders prevent this because input never turns into code."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A transfer debits €100 from A and credits B. Between the two steps the server crashes. What does a **transaction** guarantee?
    params:
      options:
        - label: All or nothing – the debit is rolled back
          correct: true
        - label: That the server never crashes
          feedback: Nobody can guarantee that.
        - label: That the money stays with the bank
          feedback: It may neither vanish nor appear twice.
    hints:
      - Two steps that only make sense together.
    explanation: "The **A** in ACID: atomicity. Without it no bank could work with databases."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why are data spread over several tables instead of writing everything into one?"
    params:
      keywords:
        - - doppelt
          - wiederhol
          - einmal
          - mehrfach
          - duplicate
          - repeat
          - once
          - redundan
        - - änder
          - aktuell
          - fehler
          - widerspruch
          - change
          - update
          - error
          - inconsisten
        - - schlüssel
          - verweis
          - verbind
          - key
          - reference
          - link
          - join
      sample: That way every piece of information is stored only once and needs updating in just one place when it changes. The tables are linked back together via keys.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Transactions follow **ACID**. A: all or nothing. C: the rules still hold. I: nobody sees half-done states. D: what is confirmed stays saved."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: match
    prompt: Which letter of ACID promises what?
    params:
      pairs:
        - left: Atomic
          right: All or nothing
        - left: Consistent
          right: Rules still hold
        - left: Isolated
          right: No outside meddling
        - left: Durable
          right: Survives crashes
    hints:
      - The transfer that must not half-happen is A.
      - "Power lost after the OK – still saved: D."
    explanation: Together the four properties make a database reliable enough for banks.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Two people book the last seat at the same moment. What prevents a double booking?
    params:
      options:
        - label: Isolation – the first transaction locks the seat, the second then sees it as taken
          correct: true
        - label: A faster server
          feedback: Even fast servers handle requests at the same time.
        - label: Durability
          feedback: That only makes sure saved data stays.
    hints:
      - Both read »free« – that is the problem.
      - One must wait until the other has finished.
    explanation: Without isolation both read »free« and write »booked«. With locks or versions each transaction sees a clean state.
    difficulty: 3

srs:
  cards_from: [schritte, injection]
