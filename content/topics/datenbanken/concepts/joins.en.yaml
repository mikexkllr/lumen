id: cs.databases.joins
type: concept
title: Joining tables
summary: The join.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A shop writes the full address anew with every order. The customer moves. What is the problem?
    params:
      options:
        - label: The address is in many places and must be changed everywhere
          correct: true
        - label: There is none
          feedback: Old orders then show the wrong address.
        - label: The customer is deleted
          feedback: Nothing is deleted.
    hints:
      - How often is the address stored?
    explanation: "Better: store it once and connect when needed."

  - kind: explain
    id: s1
    body: |
      A **join** links tables through their keys. Each order gets the customer's name added, without storing it twice.

  - kind: problem
    id: wer
    widget: choice
    body: "Customers: 1 Ana, 2 Ben, 3 Cem. Orders: lamp → customer 2, table → customer 3, chair → customer 2."
    prompt: Who ordered the lamp?
    params:
      options:
        - { label: Ben, correct: true }
        - { label: Ana, feedback: "The lamp belongs to customer 2." }
        - { label: Cem, feedback: "Cem is number 3. He ordered the table." }
    hints:
      - Follow the customer number.
    explanation: Customer 2 is Ben. A join makes exactly this link automatically.

  - kind: problem
    id: anzahl
    widget: numeric
    body: "Customers: 1 Ana, 2 Ben, 3 Cem. Orders: lamp → 2, table → 3, chair → 2."
    prompt: How many orders does Ben have?
    params: { unit: orders }
    answer: { value: 2 }
    hints:
      - Count the orders with customer 2.
    explanation: Lamp and chair, so two orders.

  - kind: problem
    id: ohne
    widget: choice
    prompt: Ana does not appear in the result of the join at all. Why?
    params:
      options:
        - { label: "No order points to her.", correct: true }
        - { label: Her record is broken., feedback: "A plain join only shows pairs that match each other." }
    hints:
      - Which order points to customer 1?
    explanation: Rows with no partner in the other table drop out of a simple join.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A [[join]] connects two tables through their [[keys]].
      distractors:
        - index
        - names

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Table A has 100 rows, table B has 50. You join them **without** a condition – every row with every row. How many rows result?
    answer:
      value: 5000
    hints:
      - Each of the 100 with each of the 50.
    explanation: 5000 – a **cross product**. With millions of rows a forgotten ON brings the server to its knees.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Customers: 1 Ana, 2 Ben, 3 Cem. Orders: A by customer 2, B by customer 2, C by customer 3, D by customer 5. The **INNER JOIN** keeps only pairs whose customer numbers match."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: How many rows does the INNER JOIN of the customers and orders above return?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 4
        misconception: orphan
        text: Order D points to customer 5 – who does not exist.
    hints:
      - "Go through each order: does its customer exist?"
      - A and B belong to Ben, C to Cem.
    explanation: Ben–A, Ben–B, Cem–C. Ana has no order, D no customer – both drop out.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: And how many rows does customers LEFT JOIN orders return?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: inner-vs-left
        text: LEFT JOIN keeps every customer – Ana without an order too.
    hints:
      - All rows of the left table stay.
      - The 3 matches plus Ana with NULL.
    explanation: "Ben–A, Ben–B, Cem–C and Ana–NULL: 4 rows. That is how you find customers without orders: WHERE order IS NULL."
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: match
    prompt: Which join does what?
    params:
      pairs:
        - left: INNER JOIN
          right: Only matches on both sides
        - left: LEFT JOIN
          right: All on the left, NULL on the right if needed
        - left: FULL JOIN
          right: Everything from both sides
        - left: CROSS JOIN
          right: Every row with every row
    hints:
      - "LEFT means: the left table is kept completely."
      - CROSS has no condition.
    explanation: The joins differ in what happens to rows without a partner.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You want to see **all** customers – including those without orders. Which join fits?
    params:
      options:
        - label: LEFT JOIN – it keeps all rows of the left table
          correct: true
        - label: INNER JOIN
          feedback: It only shows customers with at least one order.
        - label: None – that is impossible
          feedback: That is exactly what the outer join is for.
    hints:
      - Ana did not show up before. How do you get her back?
    explanation: Missing partners are filled with **NULL** – the sign for “no value”.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: How many rows does a FULL JOIN of the tables above return?
    answer:
      value: 5
    hints:
      - All matches, plus all unmatched rows from both sides.
      - 3 matches + Ana + order D.
    explanation: 3 + 1 + 1 = 5. Order D without a customer shows that a foreign-key rule would never have allowed it.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: A join of two tables with a million rows each – no index, every row compared with every row. How many comparisons is that?
    params:
      options:
        - label: $10^{12}$ – that is why indexes or hash joins are used
          correct: true
        - label: 2 million
          feedback: That would just be one pass through both tables.
        - label: $10^6$
          feedback: It is a million times a million.
    hints:
      - Each of the million rows on the left meets each on the right.
      - $10^6$ · $10^6$.
    explanation: A trillion comparisons take minutes. A hash join needs only about two million steps.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: How does a hash join work?
    params:
      options:
        - label: It builds a hash table from the smaller table and looks up every row of the larger one in it
          correct: true
        - label: It sorts both tables
          feedback: That is the merge join.
        - label: It compares each with each, only faster
          feedback: That is exactly what it avoids.
    hints:
      - A hash table lookup costs O(1).
      - Build once, then just look up.
    explanation: Building costs O(n), looking up O(m) – linear in total instead of n · m. Data structures make databases fast.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what a join does and why it is needed.
    params:
      keywords:
        - - schlüssel
          - key
          - nummer
          - number
          - id
        - - verbind
          - kombin
          - connect
          - combin
          - zusammen
          - join
        - - doppelt
          - redundan
          - einmal
          - once
          - duplicate
      sample: Data is spread over several tables so that nothing is stored twice – each fact once. A join combines the tables at query time via their keys, such as the customer number in an order.
    difficulty: 3

srs:
  cards_from: [wer, ohne]
