id: cs.databases.joins
type: concept
title: Joining tables
summary: The join.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      A **join** links tables through their keys. Each order gets the customer's name added, without storing it twice.

  - kind: problem
    id: wer
    widget: choice
    body: "Customers: 1 Ana, 2 Ben, 3 Cem. Orders: lamp → customer 2, table → customer 3, chair → customer 2."
    prompt: Who ordered the lamp?
    params:
      options:
        - { label: Ben, correct: true }
        - { label: Ana, feedback: "The lamp belongs to customer 2." }
        - { label: Cem, feedback: "Cem is number 3. He ordered the table." }
    hints:
      - Follow the customer number.
    explanation: Customer 2 is Ben. A join makes exactly this link automatically.

  - kind: problem
    id: anzahl
    widget: numeric
    body: "Customers: 1 Ana, 2 Ben, 3 Cem. Orders: lamp → 2, table → 3, chair → 2."
    prompt: How many orders does Ben have?
    params: { unit: orders }
    answer: { value: 2 }
    hints:
      - Count the orders with customer 2.
    explanation: Lamp and chair, so two orders.

  - kind: problem
    id: ohne
    widget: choice
    prompt: Ana does not appear in the result of the join at all. Why?
    params:
      options:
        - { label: "No order points to her.", correct: true }
        - { label: Her record is broken., feedback: "A plain join only shows pairs that match each other." }
    hints:
      - Which order points to customer 1?
    explanation: Rows with no partner in the other table drop out of a simple join.

srs:
  cards_from: [wer, ohne]
