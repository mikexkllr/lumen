id: cs.databases.tables
type: concept
title: Data in tables
summary: Rows, columns, data types.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The world in tables
    body: Playlist, doctor's appointment or train ticket – behind almost every app there is a **database**. Flip the cards. What do you think is in its tables?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎵
            front: Your playlist
            back: "Every song is a row: title, artist, length. Each detail has its own column."
          - icon: 🚆
            front: The train ticket
            back: Every seat may be sold only once – even when thousands book at the same moment.
          - icon: 🩺
            front: The doctor's surgery
            back: "Patients, appointments, prescriptions: each kind of data gets its own table."
          - icon: 👟
            front: The shop search
            back: Among millions of products the database finds red shoes in size 42 within milliseconds.

  - kind: problem
    id: hook
    widget: choice
    prompt: Where do you find grandma’s phone number fastest?
    params:
      options:
        - label: In the sorted contact list
          correct: true
        - label: In a pile of loose notes
          feedback: There you must look at every note.
        - label: In old chat messages
          feedback: That can take a long time.
    hints:
      - Where is everything laid out the same way?
    explanation: Order in rows and columns makes data findable.

  - kind: explain
    id: s1
    body: |
      A **database** stores data in tables. Each **row** is one record, such as a customer. Each **column** is a property with a fixed data type, such as name or birth year.

  - kind: problem
    id: zellen
    widget: numeric
    prompt: A table has {{r}} rows and {{c}} columns. How many values does it store?
    params: { unit: values }
    answer: { value: "{{r * c}}" }
    hints:
      - Rows times columns.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "choice[100,250,1000]", c: "int[3,8]" }
      defaults: { r: 1000, c: 5 }

  - kind: problem
    id: typen
    widget: match
    prompt: Which data type fits the column?
    params:
      pairs:
        - { left: Name, right: Text }
        - { left: Birth year, right: Integer }
        - { left: Wants newsletter, right: Yes or no }
        - { left: Account balance, right: Decimal number }
    hints:
      - Which values do you want to calculate with?
    explanation: Fixed types prevent nonsense, such as “blue” as a birth year.

  - kind: problem
    id: warum
    widget: choice
    prompt: Why doesn't an app just store its customers in one long text file?
    params:
      options:
        - { label: "Targeted searching, changing and checking work much better in tables.", correct: true }
        - { label: Text files are forbidden., feedback: "They are allowed, but with millions of entries they are hopelessly slow and error-prone." }
    hints:
      - How would you find all customers from Cologne in a novel?
    explanation: Structure makes data searchable and reliable.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Each row of a table is a record.
          right: true
        - text: A column may mix numbers and text.
          right: false
          why: Each column has a fixed data type.
        - text: A database can consist of many tables.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which data type do you choose for a postcode such as 01067?
    params:
      options:
        - label: Text – otherwise the leading zero is lost
          correct: true
        - label: Integer
          feedback: 01067 would become 1067.
        - label: Decimal number
          feedback: You do not calculate with postcodes.
    hints:
      - Do you ever calculate with a postcode?
    explanation: What looks like a number is not always one. Phone numbers and postcodes are text.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "The **first normal form** demands: every cell holds exactly one value. »Phone: 0151…, 0170…« in one cell is not allowed. Each number gets its own row in a table of its own."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: buckets
    prompt: Does the cell satisfy the first normal form?
    params:
      buckets:
        - id: b1
          label: one value – fine
        - id: b2
          label: several values – not allowed
      items:
        - label: "Birth date: 2001-05-03"
          bucket: b1
        - label: "Hobbies: reading, tennis"
          bucket: b2
        - label: "Price: 4.99"
          bucket: b1
        - label: "Children: Mia, Ben"
          bucket: b2
        - label: "Tags: red; blue"
          bucket: b2
        - label: "City: Leipzig"
          bucket: b1
    hints:
      - Is there a list inside the cell?
      - Commas or semicolons often separate several values.
    explanation: Lists inside cells are hard to search and count. »Who plays tennis?« only works cleanly if each hobby has a row of its own.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: A table has {{r}} million rows of {{b}} bytes each. How many megabytes is that?
    params:
      unit: MB
    answer:
      value: "{{r * b}}"
    hints:
      - One million bytes are 1 MB.
      - "{{r}} · {{b}}."
    explanation: "{{r}} million · {{b}} bytes = {{r * b}} MB – plus the indexes on top."
    difficulty: 2
    variants:
      params:
        r: int[1,9]
        b: choice[100,200,250,500]
      defaults:
        r: 1
        b: 200

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A table stores customer name, address and item for every order. The same customer orders 50 times. What is the problem?
    params:
      options:
        - label: The address is there 50 times – a move easily creates contradictions
          correct: true
        - label: The table gets too wide
          feedback: The problem is repetition, not width.
        - label: There is no problem
          feedback: If only 49 of the 50 entries are changed, the data are wrong.
    hints:
      - What happens if one of the 50 copies is forgotten?
    explanation: "**Normalisation**: every piece of information is stored exactly once. That is the basic principle of good database design."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "If a value is missing, the cell holds **NULL** – »unknown«, not 0 and not empty. Careful: NULL = NULL is not true but unknown again. So you test with IS NULL."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: What does SELECT COUNT(phone) FROM customers count?
    params:
      options:
        - label: Only the rows where phone is not NULL
          correct: true
        - label: All rows
          feedback: That is what COUNT(*) does.
        - label: The distinct phone numbers
          feedback: That needs COUNT(DISTINCT phone).
    hints:
      - COUNT of a column skips missing values.
      - What is the difference from COUNT(*)?
    explanation: COUNT(*) counts rows, COUNT(column) counts values that are present. If 30 of 100 customers lack a number, that gives 70.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Why are money amounts not stored as floating-point numbers?
    params:
      options:
        - label: Because of rounding errors – you use DECIMAL or whole cents
          correct: true
        - label: Because floating point takes too much space
          feedback: A double has only 8 bytes.
        - label: Because databases do not know decimals
          feedback: They even know several kinds.
    hints:
      - What does 0.1 + 0.2 give on a computer?
      - With money no cent may be lost.
    explanation: €0.10 cannot be represented exactly in binary. Over millions of bookings the errors add up. DECIMAL stores decimal places exactly.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how a table in a database is built.
    params:
      keywords:
        - - zeile
          - row
          - datensatz
          - record
        - - spalte
          - column
          - eigenschaft
          - attribute
        - - typ
          - type
      sample: Each row is a record, such as one customer. Each column is an attribute such as name or age and has a fixed data type, like text or number.
    difficulty: 3

srs:
  cards_from: [typen, warum]
