id: cs.databases.tables
type: concept
title: Data in tables
summary: Rows, columns, data types.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Where do you find grandma’s phone number fastest?
    params:
      options:
        - label: In the sorted contact list
          correct: true
        - label: In a pile of loose notes
          feedback: There you must look at every note.
        - label: In old chat messages
          feedback: That can take a long time.
    hints:
      - Where is everything laid out the same way?
    explanation: Order in rows and columns makes data findable.

  - kind: explain
    id: s1
    body: |
      A **database** stores data in tables. Each **row** is one record, such as a customer. Each **column** is a property with a fixed data type, such as name or birth year.

  - kind: problem
    id: zellen
    widget: numeric
    prompt: A table has {{r}} rows and {{c}} columns. How many values does it store?
    params: { unit: values }
    answer: { value: "{{r * c}}" }
    hints:
      - Rows times columns.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "choice[100,250,1000]", c: "int[3,8]" }
      defaults: { r: 1000, c: 5 }

  - kind: problem
    id: typen
    widget: match
    prompt: Which data type fits the column?
    params:
      pairs:
        - { left: Name, right: Text }
        - { left: Birth year, right: Integer }
        - { left: Wants newsletter, right: Yes or no }
        - { left: Account balance, right: Decimal number }
    hints:
      - Which values do you want to calculate with?
    explanation: Fixed types prevent nonsense, such as “blue” as a birth year.

  - kind: problem
    id: warum
    widget: choice
    prompt: Why doesn't an app just store its customers in one long text file?
    params:
      options:
        - { label: "Targeted searching, changing and checking work much better in tables.", correct: true }
        - { label: Text files are forbidden., feedback: "They are allowed, but with millions of entries they are hopelessly slow and error-prone." }
    hints:
      - How would you find all customers from Cologne in a novel?
    explanation: Structure makes data searchable and reliable.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Each row of a table is a record.
          right: true
        - text: A column may mix numbers and text.
          right: false
          why: Each column has a fixed data type.
        - text: A database can consist of many tables.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which data type do you choose for a postcode such as 01067?
    params:
      options:
        - label: Text – otherwise the leading zero is lost
          correct: true
        - label: Integer
          feedback: 01067 would become 1067.
        - label: Decimal number
          feedback: You do not calculate with postcodes.
    hints:
      - Do you ever calculate with a postcode?
    explanation: What looks like a number is not always one. Phone numbers and postcodes are text.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A table stores customer name, address and item for every order. The same customer orders 50 times. What is the problem?
    params:
      options:
        - label: The address is there 50 times – a move easily creates contradictions
          correct: true
        - label: The table gets too wide
          feedback: The problem is repetition, not width.
        - label: There is no problem
          feedback: If only 49 of the 50 entries are changed, the data are wrong.
    hints:
      - What happens if one of the 50 copies is forgotten?
    explanation: "**Normalisation**: every piece of information is stored exactly once. That is the basic principle of good database design."
    difficulty: 3

srs:
  cards_from: [typen, warum]
