id: ee.semiconductors.doping
type: concept
title: "Halbleiter und Dotieren"
summary: "Silizium leitet kaum – bis man ein paar Fremdatome hineinmischt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Kupfer leitet, Glas isoliert. Was macht reines Silizium?
    params:
      options:
        - label: Es leitet schlecht, aber warm besser als kalt
          correct: true
        - label: Es leitet wie Kupfer
          feedback: Reines Silizium hat kaum freie Ladungsträger.
        - label: Es isoliert immer perfekt
          feedback: Wärme macht einige Elektronen frei.
    hints:
      - Silizium liegt zwischen Leiter und Isolator.
      - Wärme kann Elektronen aus ihren Bindungen lösen.
    explanation: Silizium ist ein Halbleiter. Bei Metallen steigt der Widerstand mit der Temperatur, bei Halbleitern sinkt er.

  - kind: explain
    id: c1
    body: Ein **Halbleiter** wie Silizium hat vier Außenelektronen. Im Kristall sind alle in Bindungen fest. Erst ein Energieschub von 1,12 eV, die Bandlücke, macht ein Elektron frei beweglich.

  - kind: explain
    id: c2
    body: "Beim **Dotieren** ersetzt man wenige Siliziumatome durch Fremdatome. Phosphor hat fünf Außenelektronen: Eins bleibt frei, das ist n-dotiert. Bor hat drei: Es fehlt eins, ein Loch. Das ist p-dotiert."

  - kind: problem
    id: c3
    widget: buckets
    prompt: Welche Dotierung entsteht?
    params:
      buckets:
        - id: b1
          label: n-dotiert
        - id: b2
          label: p-dotiert
      items:
        - label: Phosphor (5 Außenelektronen)
          bucket: b1
        - label: Bor (3 Außenelektronen)
          bucket: b2
        - label: Arsen (5)
          bucket: b1
        - label: Gallium (3)
          bucket: b2
        - label: Antimon (5)
          bucket: b1
        - label: Indium (3)
          bucket: b2
    hints:
      - Mehr als vier Außenelektronen bringt freie Elektronen.
      - Weniger als vier bringt Löcher.
    explanation: Fünfwertige Atome spenden ein Elektron (n), dreiwertige nehmen eins auf und hinterlassen ein Loch (p).

  - kind: problem
    id: c4
    widget: choice
    prompt: Ein Loch im p-Silizium wandert nach rechts. Was passiert eigentlich?
    params:
      options:
        - label: Nachbarelektronen springen nach links in die Lücke
          correct: true
        - label: Ein positives Teilchen fliegt durch den Kristall
          feedback: Das Loch ist kein Teilchen, sondern eine fehlende Bindung.
        - label: Das Boratom wandert
          feedback: Die Atome sitzen fest im Gitter.
    hints:
      - Denk an eine Lücke in einer Reihe Kinositze.
      - Rückt jeder einen Platz auf, wandert die Lücke in die Gegenrichtung.
    explanation: Das Loch verhält sich wie eine positive Ladung, die sich bewegt. Physikalisch rücken Elektronen nach.

  - kind: problem
    id: d1
    depth: 2
    widget: match
    prompt: Welche Bandlücke gehört zu welchem Material?
    params:
      pairs:
        - left: Germanium
          right: 0,66 eV
        - left: Silizium
          right: 1,12 eV
        - left: Galliumnitrid (blaue LED)
          right: 3,4 eV
        - left: Diamant
          right: 5,5 eV
      leftTitle: Material
      rightTitle: Bandlücke
    hints:
      - Diamant ist fast ein Isolator.
      - Germanium ist der alte Halbleiter mit kleiner Lücke.
    explanation: Große Bandlücken vertragen hohe Spannungen und Temperaturen. Darum nutzen Schnellladegeräte und E-Autos Galliumnitrid und Siliziumkarbid.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Reines Silizium hat bei Raumtemperatur etwa 10¹⁰ freie Elektronen pro cm³. Dotiert man mit 10¹⁶ Phosphoratomen pro cm³, um welchen Faktor steigt die Zahl?
    answer:
      value: 1000000
    hints:
      - Fast jedes Phosphoratom gibt ein Elektron ab.
      - "10¹⁶ : 10¹⁰."
    explanation: Faktor 10⁶, eine Million. Dabei ist nur etwa jedes fünfmillionste Atom ein Phosphoratom, denn Silizium hat 5 · 10²² Atome pro cm³.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum sinkt der Widerstand eines Halbleiters, wenn er wärmer wird?
    params:
      options:
        - label: Wärme hebt mehr Elektronen über die Bandlücke, es gibt mehr Ladungsträger
          correct: true
        - label: Weil sich das Gitter ausdehnt
          feedback: Das ist ein kleiner Effekt und würde eher bremsen.
        - label: Weil die Elektronen schneller werden
          feedback: Schneller schwingende Atome bremsen sie sogar stärker.
    hints:
      - Beim Metall ist die Zahl der Elektronen fest.
      - Beim Halbleiter hängt die Zahl der freien Elektronen von der Temperatur ab.
    explanation: Die Zahl der freien Ladungsträger wächst etwa mit e^(−Eg/(2kT)) – stark mit der Temperatur. Das überwiegt die stärkere Streuung. So funktionieren NTC-Temperaturfühler.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was n- und p-Dotierung bedeuten.
    params:
      keywords:
        - - fünf
          - fuenf
          - five
          - phosphor
        - - drei
          - three
          - bor
          - boron
        - - elektron
          - electron
        - - loch
          - hole
          - fehlt
          - missing
      sample: "Silizium hat vier Außenelektronen. Ein Phosphoratom bringt fünf mit, eins bleibt frei: n-dotiert, mit beweglichen Elektronen. Ein Boratom hat nur drei, es fehlt ein Elektron. Dieses Loch wandert wie eine positive Ladung: p-dotiert."
    explanation: "Kern: ein Elektron zu viel oder zu wenig. Winzige Mengen genügen."
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x1"]
