id: ee.semiconductors.doping
type: concept
title: "Semiconductors and doping"
summary: "Silicon barely conducts – until you mix in a few foreign atoms."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Sand with superpowers
    body: "Every chip in your phone starts out as sand. Turn over the cards: how does sand become a **semiconductor**, and why is a whole valley named after it?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏖️
            front: Made from sand
            back: Silicon is made from quartz sand. After oxygen it is the most common element in the Earth's crust.
          - icon: 💎
            front: Purer than pure
            back: Chip silicon is 99.9999999 % pure. Barely one foreign atom per billion.
          - icon: 🧂
            front: Then comes the pinch
            back: Then tiny amounts of boron or phosphorus are mixed in on purpose.
          - icon: 🌁
            front: Silicon Valley
            back: The valley in California is named after the silicon its chip firms grew big with.

  - kind: problem
    id: hook
    widget: choice
    prompt: Copper conducts, glass insulates. What does pure silicon do?
    params:
      options:
        - label: It conducts poorly, but better when warm than cold
          correct: true
        - label: It conducts like copper
          feedback: Pure silicon has hardly any free charge carriers.
        - label: It always insulates perfectly
          feedback: Heat frees some electrons.
    hints:
      - Silicon sits between conductor and insulator.
      - Heat can free electrons from their bonds.
    explanation: Silicon is a semiconductor. In metals resistance rises with temperature, in semiconductors it falls.

  - kind: explain
    id: c1
    body: A **semiconductor** such as silicon has four outer electrons. In the crystal they are all tied up in bonds. Only an energy kick of 1.12 eV, the band gap, sets an electron free.

  - kind: explain
    id: c2
    body: "**Doping** replaces a few silicon atoms with foreign atoms. Phosphorus has five outer electrons: one is left free, that is n-type. Boron has three: one is missing, a hole. That is p-type."

  - kind: problem
    id: c3
    widget: buckets
    prompt: Which doping results?
    params:
      buckets:
        - id: b1
          label: n-type
        - id: b2
          label: p-type
      items:
        - label: Phosphorus (5 outer electrons)
          bucket: b1
        - label: Boron (3 outer electrons)
          bucket: b2
        - label: Arsenic (5)
          bucket: b1
        - label: Gallium (3)
          bucket: b2
        - label: Antimony (5)
          bucket: b1
        - label: Indium (3)
          bucket: b2
    hints:
      - More than four outer electrons brings free electrons.
      - Fewer than four brings holes.
    explanation: Pentavalent atoms donate an electron (n), trivalent ones accept one and leave a hole (p).

  - kind: problem
    id: c4
    widget: choice
    prompt: A hole in p-type silicon moves to the right. What is really happening?
    params:
      options:
        - label: Neighbouring electrons jump left into the gap
          correct: true
        - label: A positive particle flies through the crystal
          feedback: The hole is not a particle but a missing bond.
        - label: The boron atom moves
          feedback: The atoms are fixed in the lattice.
    hints:
      - Think of a gap in a row of cinema seats.
      - If everyone moves up one seat, the gap moves the other way.
    explanation: The hole behaves like a moving positive charge. Physically, electrons move up into it.

  - kind: problem
    id: d1
    depth: 2
    widget: match
    prompt: Which band gap belongs to which material?
    params:
      pairs:
        - left: Germanium
          right: 0.66 eV
        - left: Silicon
          right: 1.12 eV
        - left: Gallium nitride (blue LED)
          right: 3.4 eV
        - left: Diamond
          right: 5.5 eV
      leftTitle: Material
      rightTitle: Band gap
    hints:
      - Diamond is almost an insulator.
      - Germanium is the old semiconductor with a small gap.
    explanation: Wide band gaps tolerate high voltages and temperatures. That is why fast chargers and EVs use gallium nitride and silicon carbide.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Pure silicon at room temperature has about 10¹⁰ free electrons per cm³. Doping with 10¹⁶ phosphorus atoms per cm³ raises the number by what factor?
    answer:
      value: 1000000
    hints:
      - Almost every phosphorus atom gives up an electron.
      - 10¹⁶ ÷ 10¹⁰.
    explanation: A factor of 10⁶, a million. Yet only about one atom in five million is phosphorus, since silicon has 5 × 10²² atoms per cm³.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: "Silicon has 5 × 10²² atoms per cm³. With 10¹⁶ phosphorus atoms per cm³: one in how many atoms is phosphorus?"
    answer:
      value: 5000000
    hints:
      - Divide the number of silicon atoms by the number of dopant atoms.
      - 5 × 10²² ÷ 10¹⁶.
    explanation: One in five million. A pinch is enough to change conductivity a millionfold. That is why chip fabs must be extremely clean.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does a semiconductor’s resistance fall when it gets warmer?
    params:
      options:
        - label: Heat lifts more electrons across the band gap, so there are more carriers
          correct: true
        - label: Because the lattice expands
          feedback: That is a small effect and would rather slow things down.
        - label: Because the electrons get faster
          feedback: Faster vibrating atoms actually slow them more.
    hints:
      - In a metal the number of electrons is fixed.
      - In a semiconductor the number of free electrons depends on temperature.
    explanation: The number of free carriers grows roughly like e^(−Eg/(2kT)) – strongly with temperature. That outweighs the extra scattering. This is how NTC temperature sensors work.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what n-type and p-type doping mean.
    params:
      keywords:
        - - fünf
          - fuenf
          - five
          - phosphor
        - - drei
          - three
          - bor
          - boron
        - - elektron
          - electron
        - - loch
          - hole
          - fehlt
          - missing
      sample: "Silicon has four outer electrons. A phosphorus atom brings five, one is left free: n-type, with mobile electrons. A boron atom has only three, one electron is missing. This hole moves like a positive charge: p-type."
    explanation: "The core: one electron too many or too few. Tiny amounts are enough."
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x1"]
