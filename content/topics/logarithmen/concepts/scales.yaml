id: math.logs.scales
type: concept
title: Logarithmische Skalen
summary: Dezibel, Erdbeben und Kurven.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel mal so viel Energie setzt ein Erdbeben der Stärke 7 frei wie eines der Stärke 5?"
    params:
      min: 2
      max: 100000
      scale: log
    answer:
      value: 1000
      within: 70
    explanation: Rund 1000-mal. Jede Stufe bedeutet etwa 32-mal so viel Energie.

  - kind: explain
    id: s1
    body: |
      Manche Größen umfassen riesige Bereiche. Dann zählt man in Zehnerschritten: Bei **Dezibel** bedeuten +10 dB zehnmal so viel Schallenergie.

  - kind: problem
    id: dezibel
    widget: numeric
    prompt: Der Lärm steigt von {{a}} dB auf {{a + 10 * k}} dB. Wievielmal mehr Schallenergie ist das?
    params: { unit: "-mal" }
    answer: { value: "{{10 ** k}}" }
    feedback:
      - when: "numval(state.input) == 10 * k"
        misconception: linear
        text: Jede 10 dB multiplizieren mit 10 – sie addieren nicht.
    hints:
      - "{{k}}-mal 10 dB heißt {{k}}-mal mal 10."
    explanation: "$10^{ {{k}} } = {{10 ** k}}$-mal so viel Energie."
    variants:
      params: { a: "choice[30,40,50,60,70]", k: "int[2,4]" }
      defaults: { a: 60, k: 2 }

  - kind: problem
    id: kurve
    widget: choice
    prompt: Warum zeigt man exponentielles Wachstum oft auf einer logarithmischen Achse?
    params:
      options:
        - { label: Dort wird es zu einer geraden Linie., correct: true }
        - { label: Damit es harmloser aussieht., feedback: "Es geht um Lesbarkeit – gleiche Wachstumsraten werden gleich steil." }
    hints:
      - Was macht der Logarithmus aus einer Verdopplung?
    explanation: Jede Verdopplung ist auf der Log-Achse ein gleich großer Schritt – die Kurve wird gerade.

  - kind: problem
    id: erdbeben
    widget: choice
    prompt: Ein Erdbeben der Stärke 7 und eines der Stärke 5. Wie verhalten sich die Ausschläge?
    params:
      options:
        - { label: Der Ausschlag ist 100-mal so groß., correct: true }
        - { label: Er ist 2-mal so groß., feedback: "Jede Stufe bedeutet den zehnfachen Ausschlag." }
        - { label: "Er ist 1,4-mal so groß.", feedback: "Die Skala ist logarithmisch, nicht linear." }
    hints:
      - Zwei Stufen, je Faktor 10.
    explanation: 10 · 10 = 100 – zwei Stufen machen einen gewaltigen Unterschied.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Zwei gleich laute Lautsprecher zusammen sind um wie viele Dezibel lauter als einer? (log₁₀ 2 ≈ 0,3)
    params:
      unit: dB
    answer:
      value: 3
    hints:
      - Doppelte Energie heißt 10 · log₁₀ 2.
    explanation: 10 · 0,3 = 3 dB. Nicht das Doppelte – Dezibel addieren sich nicht einfach.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Bei Erdbeben bedeutet eine Stufe mehr auf der **Magnitude**-Skala etwa 31,6-mal so viel Energie, denn $10^{1{,}5} \approx 31{,}6$. Zwei Stufen sind $10^3 = 1000$-mal so viel.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Ein Beben hat Magnitude {{m + k}}, ein anderes {{m}}. Wievielmal so viel Energie setzt das stärkere frei? Runde auf eine ganze Zahl.
    answer:
      value: "{{round(10 ** (1.5 * k))}}"
      tolerance: 1
    feedback:
      - when: numval(state.input) == 10 ** k
        misconception: amplitude-not-energy
        text: Das gilt für den Ausschlag. Die Energie wächst pro Stufe mit 10 hoch 1,5.
    hints:
      - Pro Stufe Faktor $10^{1{,}5}$.
      - $10^{1{,}5 \cdot {{k}}}$.
    explanation: $10^{ {{1.5 * k}} } \approx {{round(10 ** (1.5 * k))}}$.
    difficulty: 2
    variants:
      params:
        m: int[3,6]
        k: choice[1,2,3,4]
      defaults:
        m: 6
        k: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Bei Sternen bedeuten 5 Größenklassen genau den Faktor 100 in der Helligkeit. Wie viel mal heller ist ein Stern, der 10 Größenklassen heller ist?
    answer:
      value: 10000
    feedback:
      - when: numval(state.input) == 200
        misconception: additive
        text: "Größenklassen werden nicht addiert, sondern ihre Faktoren malgenommen: 100 · 100."
    hints:
      - 10 Klassen = 2-mal 5 Klassen.
      - 100 · 100.
    explanation: 100² = 10 000. Eine Klasse ist $\sqrt[5]{100} \approx 2{,}512$. Das Auge empfindet Helligkeit logarithmisch – darum ist die Skala so gebaut.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Der pH-Wert ist $-\log_{10}$ der H⁺-Konzentration. Zitronensaft hat pH 2, Kaffee pH 5. Wievielmal saurer ist die Zitrone?
    answer:
      value: 1000
    hints:
      - Jede pH-Stufe ist ein Faktor 10.
    explanation: 10³ = 1000. Logarithmische Skalen machen aus Faktoren Abstände.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Das **Benford-Gesetz**: In vielen echten Datensätzen beginnt eine Zahl mit der Ziffer d mit der Wahrscheinlichkeit $\\log_{10}\\left(1 + \\frac1d\\right)$. Eine 1 vorne kommt in rund 30 % der Fälle. Steuerprüfer suchen so gefälschte Zahlen."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wie wahrscheinlich beginnt eine Zahl nach Benford mit der Ziffer 9? Gib Prozent auf eine Stelle an. (log₁₀ 10/9 ≈ 0,0458)
    params:
      unit: "%"
    answer:
      value: 4.6
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - 11.1) < 0.1
        misconception: uniform
        text: Das wäre bei gleich häufigen Ziffern 1 bis 9. Benford ist ungleich verteilt.
    hints:
      - "Setze d = 9 ein: log₁₀(1 + 1/9)."
      - 0,0458 = 4,58 %.
    explanation: "Nur 4,6 %, gegenüber 30,1 % für die 1. Benford gilt, wo Daten über viele Größenordnungen streuen: Einwohnerzahlen, Flusslängen, Rechnungsbeträge."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Ein Halbton erhöht die Frequenz um den Faktor $2^{1/12}$. Der Ton A hat 440 Hz. Welche Frequenz hat das E, 7 Halbtöne höher? Auf eine Stelle.
    params:
      unit: Hz
    answer:
      value: 659.3
      tolerance: 0.2
    feedback:
      - when: abs(numval(state.input) - 660) < 0.05
        misconception: just-fifth
        text: Das wäre die reine Quinte 3/2. Die gleichstufige ist minimal tiefer.
    hints:
      - $2^{7/12} \approx 1{,}4983$.
      - 440 · 1,4983.
    explanation: "440 · 1,4983 ≈ 659,3 Hz. Unsere Tonleiter ist eine logarithmische Skala: Gleiche Abstände für das Ohr sind gleiche Faktoren."
    difficulty: 3

srs:
  cards_from: [dezibel, kurve]
