id: math.logs.idea
type: concept
title: Wie oft mal?
summary: Der Logarithmus fragt nach dem Exponenten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie oft musst du 1 verdoppeln, um über eine Milliarde zu kommen?"
    params:
      min: 5
      max: 200
    answer:
      value: 30
      tolerance: 4
    explanation: Nur 30-mal. Genau diese Frage – »wie oft?« – beantwortet der Logarithmus.

  - kind: problem
    id: zweier
    widget: numeric
    prompt: 2 hoch wie viel ergibt {{2 ** k}}?
    params: { placeholder: "Exponent" }
    answer: { value: "{{k}}" }
    hints:
      - "Verdopple ab 1 und zähle: 2, 4, 8, 16 …"
    explanation: "$2^{ {{k}} } = {{2 ** k}}$."
    variants:
      params: { k: "int[3,10]" }
      defaults: { k: 5 }

  - kind: explain
    id: s2
    body: |
      Der **Logarithmus** beantwortet genau diese Frage: $\log_2 32 = 5$, weil $2^5 = 32$. Beim Zehnerlogarithmus zählt man im Grunde die Nullen: $\log_{10} 1000 = 3$.

  - kind: problem
    id: nullen
    widget: numeric
    prompt: "Was ist log₁₀ von 1 gefolgt von {{k}} Nullen?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{k}}" }
    hints:
      - Wie oft muss man 10 mit sich multiplizieren?
    explanation: "$10^{ {{k}} }$ hat {{k}} Nullen – also ist der Logarithmus {{k}}."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 6 }

  - kind: problem
    id: dazwischen
    widget: choice
    prompt: Zwischen welchen Zahlen liegt log₁₀ 500?
    params:
      options:
        - { label: Zwischen 2 und 3, correct: true }
        - { label: Zwischen 50 und 51, feedback: "Der Logarithmus ist der Exponent – der bleibt klein." }
        - { label: Zwischen 5 und 6, feedback: "$10^5$ ist schon 100 000." }
    hints:
      - 500 liegt zwischen 100 und 1000.
    explanation: $10^2 = 100$ und $10^3 = 1000$ – also liegt der Logarithmus dazwischen.

  - kind: problem
    id: c1
    widget: match
    prompt: Was gehört zusammen?
    params:
      pairs:
        - left: $\log_2 8$
          right: "3"
        - left: $\log_{10} 10000$
          right: "4"
        - left: $\log_3 9$
          right: "2"
        - left: $\log_5 1$
          right: "0"
        - left: $\log_2 \frac{1}{2}$
          right: −1
    hints:
      - "Frag jedes Mal: Basis hoch wie viel?"
    explanation: Der Logarithmus ist die Umkehrung des Potenzierens.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ist $\log_4 8$?
    answer:
      value: 1.5
    hints:
      - "Schreib beide als Zweierpotenz: 4 = 2² und 8 = 2³."
    explanation: (2²)^x = 2³ heißt 2x = 3. Auch Bruch-Exponenten sind erlaubt.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Taschenrechner kennen oft nur log₁₀ und ln. Mit dem **Basiswechsel** geht jede Basis: $\\log_b x = \\frac{\\log x}{\\log b}$. Beispiel: $\\log_2 8 = \\frac{0{,}903}{0{,}301} = 3$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Berechne $\log_2 1000$ mit dem Basiswechsel. (log₁₀ 2 ≈ 0,301) Auf zwei Stellen.
    answer:
      value: 9.97
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 10
        misconception: rounded
        text: "Fast: 2¹⁰ = 1024 ist etwas mehr als 1000, also liegt der Wert knapp unter 10."
    hints:
      - log₁₀ 1000 = 3.
      - "3 : 0,301."
    explanation: "3 : 0,301 ≈ 9,97."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Was ist $\log_{ {{b}} } {{b ** k}}$?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == b ** k / b
        misconception: divide
        text: Der Logarithmus zählt die Faktoren, er teilt nicht.
    hints:
      - Wie oft musst du {{b}} mit sich malnehmen?
      - "{{b}} hoch wie viel ergibt {{b ** k}}?"
    explanation: ${{b}}^{ {{k}} } = {{b ** k}}$, also {{k}}.
    difficulty: 2
    variants:
      params:
        b: choice[3,5,7]
        k: int[2,5]
      defaults:
        b: 5
        k: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum gibt es keinen Logarithmus von −8?
    params:
      options:
        - label: Weil eine positive Basis hoch irgendetwas immer positiv bleibt
          correct: true
        - label: Weil −8 zu klein ist
          feedback: Auch 0,001 ist klein und hat den Logarithmus −3.
        - label: "Den gibt es: −3"
          feedback: 2⁻³ ist 1/8, nicht −8.
    hints:
      - Was ist 2 hoch −3?
    explanation: Negative Exponenten machen klein, nicht negativ. Erst mit komplexen Zahlen bekommt log(−8) einen Sinn.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Der **natürliche Logarithmus** ln hat die Basis e ≈ 2,718. Geometrisch ist ln x die Fläche unter der Kurve 1/t von 1 bis x. Darum ist seine Ableitung 1/x – und darum taucht er in der Analysis überall auf.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wie viele Stellen hat $3^{50}$? (log₁₀ 3 ≈ 0,4771)
    answer:
      value: 24
    feedback:
      - when: numval(state.input) == 23
        misconception: floor-not-plus-one
        text: "log₁₀ ≈ 23,86 heißt: zwischen 10²³ und 10²⁴ – das sind 24 Stellen."
    hints:
      - log₁₀ 3⁵⁰ = 50 · 0,4771.
      - Eine Zahl mit log₁₀ zwischen 23 und 24 hat 24 Stellen.
    explanation: "50 · 0,4771 = 23,86. Die Stellenzahl ist der abgerundete Logarithmus plus 1: 24."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: "Was wächst für sehr große x schneller: ln x oder √x?"
    params:
      options:
        - label: √x – jede Wurzel schlägt den Logarithmus irgendwann.
          correct: true
        - label: ln x
          feedback: Bei x = 10¹⁰⁰ ist ln x ≈ 230, √x = 10⁵⁰.
        - label: Beide gleich schnell
          feedback: Der Abstand wird riesig.
    hints:
      - Setz x = 10¹⁰⁰ ein.
      - ln 10¹⁰⁰ = 100 · ln 10 ≈ 230.
    explanation: Der Logarithmus wächst langsamer als jede noch so kleine Potenz $x^\varepsilon$. Darum ist ein Algorithmus mit log n Schritten so gut.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum log₁₀ 1000 = 3 ist.
    params:
      keywords:
        - - hoch
          - exponent
          - power
        - - zehn
          - ten
          - basis
          - base
        - - nullen
          - mal
          - zeros
          - times
          - three
      sample: "Der Logarithmus fragt: Zehn hoch wie viel ergibt 1000? Zehn mal zehn mal zehn ist 1000, also ist der Exponent drei. Man zählt im Grunde die Nullen."
    explanation: Logarithmus = gesuchter Exponent. $10^3 = 1000 \Leftrightarrow \log_{10} 1000 = 3$.
    difficulty: 3

srs:
  cards_from: [zweier, dazwischen]
