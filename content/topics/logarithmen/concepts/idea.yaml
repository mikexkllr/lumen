id: math.logs.idea
type: concept
title: Wie oft mal?
summary: Der Logarithmus fragt nach dem Exponenten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie oft musst du 1 verdoppeln, um über eine Milliarde zu kommen?"
    params:
      min: 5
      max: 200
    answer:
      value: 30
      tolerance: 4
    explanation: Nur 30-mal. Genau diese Frage – »wie oft?« – beantwortet der Logarithmus.

  - kind: problem
    id: zweier
    widget: numeric
    prompt: 2 hoch wie viel ergibt {{2 ** k}}?
    params: { placeholder: "Exponent" }
    answer: { value: "{{k}}" }
    hints:
      - "Verdopple ab 1 und zähle: 2, 4, 8, 16 …"
    explanation: "$2^{ {{k}} } = {{2 ** k}}$."
    variants:
      params: { k: "int[3,10]" }
      defaults: { k: 5 }

  - kind: explain
    id: s2
    body: |
      Der **Logarithmus** beantwortet genau diese Frage: $\log_2 32 = 5$, weil $2^5 = 32$. Beim Zehnerlogarithmus zählt man im Grunde die Nullen: $\log_{10} 1000 = 3$.

  - kind: problem
    id: nullen
    widget: numeric
    prompt: "Was ist log₁₀ von 1 gefolgt von {{k}} Nullen?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{k}}" }
    hints:
      - Wie oft muss man 10 mit sich multiplizieren?
    explanation: "$10^{ {{k}} }$ hat {{k}} Nullen – also ist der Logarithmus {{k}}."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 6 }

  - kind: problem
    id: dazwischen
    widget: choice
    prompt: Zwischen welchen Zahlen liegt log₁₀ 500?
    params:
      options:
        - { label: Zwischen 2 und 3, correct: true }
        - { label: Zwischen 50 und 51, feedback: "Der Logarithmus ist der Exponent – der bleibt klein." }
        - { label: Zwischen 5 und 6, feedback: "$10^5$ ist schon 100 000." }
    hints:
      - 500 liegt zwischen 100 und 1000.
    explanation: $10^2 = 100$ und $10^3 = 1000$ – also liegt der Logarithmus dazwischen.

  - kind: problem
    id: c1
    widget: match
    prompt: Was gehört zusammen?
    params:
      pairs:
        - left: $\log_2 8$
          right: "3"
        - left: $\log_{10} 10000$
          right: "4"
        - left: $\log_3 9$
          right: "2"
        - left: $\log_5 1$
          right: "0"
        - left: $\log_2 \frac{1}{2}$
          right: −1
    hints:
      - "Frag jedes Mal: Basis hoch wie viel?"
    explanation: Der Logarithmus ist die Umkehrung des Potenzierens.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ist $\log_4 8$?
    answer:
      value: 1.5
    hints:
      - "Schreib beide als Zweierpotenz: 4 = 2² und 8 = 2³."
    explanation: (2²)^x = 2³ heißt 2x = 3. Auch Bruch-Exponenten sind erlaubt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum gibt es keinen Logarithmus von −8?
    params:
      options:
        - label: Weil eine positive Basis hoch irgendetwas immer positiv bleibt
          correct: true
        - label: Weil −8 zu klein ist
          feedback: Auch 0,001 ist klein und hat den Logarithmus −3.
        - label: "Den gibt es: −3"
          feedback: 2⁻³ ist 1/8, nicht −8.
    hints:
      - Was ist 2 hoch −3?
    explanation: Negative Exponenten machen klein, nicht negativ. Erst mit komplexen Zahlen bekommt log(−8) einen Sinn.
    difficulty: 3

srs:
  cards_from: [zweier, dazwischen]
