id: math.logs.solve
type: concept
title: Solving exponential equations
summary: When is it twice as much?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: gleichung
    widget: numeric
    prompt: "Solve: 3 to the power of x = {{3 ** k}}"
    params: { placeholder: "x" }
    answer: { value: "{{k}}" }
    hints:
      - "3, 9, 27, 81 …"
    explanation: "x = log₃ {{3 ** k}} = {{k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 4 }

  - kind: explain
    id: s2
    body: |
      With interest, you often ask: when has the money doubled? The **rule of 72** gives a quick answer: 72 divided by the interest rate in percent gives the years.

  - kind: problem
    id: regel72
    widget: numeric
    prompt: About how many years does it take for money to double at {{p}}% interest?
    params: { unit: years }
    answer: { value: "{{72 / p}}" }
    hints:
      - "72 ÷ {{p}}."
    explanation: "72 ÷ {{p}} = {{72 / p}} years."
    variants:
      params: { p: "choice[2,3,4,6,8,9,12]" }
      defaults: { p: 6 }

  - kind: problem
    id: inflation
    widget: choice
    prompt: Inflation is 4% per year. What does that mean by the rule of 72?
    params:
      options:
        - { label: "After about 18 years, prices are twice as high.", correct: true }
        - { label: "After 25 years, prices are twice as high.", feedback: "That would be linear growth – 4% of ever higher prices adds up faster." }
    hints:
      - "72 ÷ 4."
    explanation: Inflation grows like compound interest – money loses half its value in 18 years.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Solve $2^{x+1} = 32$.
    answer:
      value: 4
    hints:
      - 32 = 2⁵.
    explanation: x + 1 = 5, so x = 4.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: The money grows by 7% a year. After how many years has it more than doubled for the first time?
    params:
      scene: growth
    answer:
      rate: 7
      factor:
        - 2
        - 2.11
    explanation: "After 11 years. The rule of 72 estimates: 72 ÷ 7 ≈ 10.3."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: When the unknown is in the exponent, take the **logarithm** of both sides. $a^x = b$ becomes $x \log a = \log b$, so $x = \frac{\log b}{\log a}$.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Solve $2^x = 10$ to two decimals. (log₁₀ 2 ≈ 0.301)
    answer:
      value: 3.32
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 5
        misconception: multiply-not-power
        text: 2 · 5 = 10, but here 2 to the power x is wanted.
    hints:
      - x = log 10 / log 2.
      - 1 / 0.301.
    explanation: "x ≈ 3.32. Check: 2³ = 8, 2⁴ = 16 – the solution is in between."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Money grows at 5 % a year. After how many years has it tripled? Solve $1.05^x = 3$ to one decimal. (ln 3 ≈ 1.0986, ln 1.05 ≈ 0.0488)
    params:
      unit: years
    answer:
      value: 22.5
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 40
        misconception: simple-interest
        text: "That would be without compounding: 3 = 1 + 0.05 · 40."
    hints:
      - x = ln 3 / ln 1.05.
      - 1.0986 / 0.0488.
    explanation: ≈ 22.5 years – so after 23 full years.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Solve $5^x = 100$ to two places. (log₁₀ 5 ≈ 0.699)
    answer:
      value: 2.86
      tolerance: 0.01
    hints:
      - "Take logs of both sides: x · log 5 = log 100."
    explanation: x = 2 ÷ 0.699 ≈ 2.86. The logarithm brings the x down from the exponent.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what is a logarithm?"
    params:
      keywords:
        - - exponent
          - hochzahl
          - hoch
          - power
        - - umkehr
          - rückwärts
          - inverse
          - reverse
          - undo
          - frage
          - asks
        - - basis
          - base
      sample: "The logarithm is the inverse of raising to a power. It asks: to which exponent must I raise the base to get the number?"
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Logarithms only exist for positive numbers. Solving $\log x + \log(x - 3) = 1$ gives x(x − 3) = 10 with x = 5 or x = −2. The **domain** requires x > 3 – only x = 5 remains.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Solve $\log_2 x + \log_2(x + 2) = 3$.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == -4
        misconception: domain
        text: x = −4 solves x(x + 2) = 8, but log₂(−4) does not exist.
    hints:
      - "Combine: $\\log_2(x(x + 2)) = 3$, so x(x + 2) = 8."
      - x² + 2x − 8 = (x − 2)(x + 4).
    explanation: "x = 2 or x = −4; only x = 2 is allowed. Check: log₂ 2 + log₂ 4 = 1 + 2 = 3."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Solve $e^{2x} = 7$ to three decimals. (ln 7 ≈ 1.9459)
    answer:
      value: 0.973
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 1.946) < 0.002
        misconception: forgot-coefficient
        text: That is 2x. Now divide by 2.
    hints:
      - "ln of both sides: 2x = ln 7."
      - x = 1.9459 / 2.
    explanation: x ≈ 0.973. For decay $e^{-\lambda t}$ you solve for t the same way.
    difficulty: 3

srs:
  cards_from: [gleichung, regel72]
