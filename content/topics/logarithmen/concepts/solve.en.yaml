id: math.logs.solve
type: concept
title: Solving exponential equations
summary: When is it twice as much?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gleichung
    widget: numeric
    prompt: "Solve: 3 to the power of x = {{3 ** k}}"
    params: { placeholder: "x" }
    answer: { value: "{{k}}" }
    hints:
      - "3, 9, 27, 81 …"
    explanation: "x = log₃ {{3 ** k}} = {{k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 4 }

  - kind: explain
    id: s2
    body: |
      With interest, you often ask: when has the money doubled? The **rule of 72** gives a quick answer: 72 divided by the interest rate in percent gives the years.

  - kind: problem
    id: regel72
    widget: numeric
    prompt: About how many years does it take for money to double at {{p}}% interest?
    params: { unit: years }
    answer: { value: "{{72 / p}}" }
    hints:
      - "72 ÷ {{p}}."
    explanation: "72 ÷ {{p}} = {{72 / p}} years."
    variants:
      params: { p: "choice[2,3,4,6,8,9,12]" }
      defaults: { p: 6 }

  - kind: problem
    id: inflation
    widget: choice
    prompt: Inflation is 4% per year. What does that mean by the rule of 72?
    params:
      options:
        - { label: "After about 18 years, prices are twice as high.", correct: true }
        - { label: "After 25 years, prices are twice as high.", feedback: "That would be linear growth – 4% of ever higher prices adds up faster." }
    hints:
      - "72 ÷ 4."
    explanation: Inflation grows like compound interest – money loses half its value in 18 years.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Solve $2^{x+1} = 32$.
    answer:
      value: 4
    hints:
      - 32 = 2⁵.
    explanation: x + 1 = 5, so x = 4.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: The money grows by 7% a year. After how many years has it more than doubled for the first time?
    params:
      scene: growth
    answer:
      rate: 7
      factor:
        - 2
        - 2.11
    explanation: "After 11 years. The rule of 72 estimates: 72 ÷ 7 ≈ 10.3."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Solve $5^x = 100$ to two places. (log₁₀ 5 ≈ 0.699)
    answer:
      value: 2.86
      tolerance: 0.01
    hints:
      - "Take logs of both sides: x · log 5 = log 100."
    explanation: x = 2 ÷ 0.699 ≈ 2.86. The logarithm brings the x down from the exponent.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what is a logarithm?"
    params:
      keywords:
        - - exponent
          - hochzahl
          - hoch
          - power
        - - umkehr
          - rückwärts
          - inverse
          - reverse
          - undo
          - frage
          - asks
        - - basis
          - base
      sample: "The logarithm is the inverse of raising to a power. It asks: to which exponent must I raise the base to get the number?"
    difficulty: 3

srs:
  cards_from: [gleichung, regel72]
