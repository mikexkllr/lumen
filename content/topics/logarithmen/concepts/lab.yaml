id: math.logs.lab
type: concept
title: Logarithmus-Labor
summary: Kurven, Skalen und Halbwertszeiten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: kurve
    widget: graph
    prompt: Setze P auf die Kurve y = 2 hoch x – genau dort, wo y = 8 ist.
    params:
      x: [-1, 4]
      y: [0, 10]
      functions: [{ expr: "2^x" }]
      points: [{ id: P, x: 0, y: 1 }]
    answer: { points: { P: { x: 3, y: 8 } } }
    hints:
      - Wie oft muss man 2 mit sich multiplizieren, um 8 zu erhalten?
    explanation: x = 3, denn $2^3 = 8$ – also $\log_2 8 = 3$.

  - kind: problem
    id: strahl
    widget: numberline
    prompt: Markiere ungefähr, wo log₁₀ 500 liegt.
    params: { min: 2, max: 3, ticks: 10, labels: decimals }
    answer: { value: 2.7 }
    hints:
      - log₁₀ 1000 = 3, und 500 ist halb so viel – aber im Logarithmus fehlt nur ein kleines Stück.
    explanation: log₁₀ 500 ≈ 2,7. Halbieren kostet nur 0,3 auf der Log-Skala.

  - kind: problem
    id: zerfall
    widget: slider
    prompt: Die Kurve zeigt, wie viel Prozent eines Stoffes übrig sind. Stelle die Halbwertszeit so ein, dass die Kurve die Punkte trifft.
    params:
      expr: "100 * 0.5^(x / t)"
      x: [0, 8]
      y: [0, 100]
      showCoordinates: false
      sliders: [{ id: t, label: "Halbwertszeit (Jahre)", min: 1, max: 5, step: 1, initial: 4 }]
      markers:
        - { x: 2, y: 50, group: a }
        - { x: 4, y: 25, group: a }
    check: { predicate: "t == 2" }
    hints:
      - Nach wie vielen Jahren ist nur noch die Hälfte da?
    explanation: Nach 2 Jahren 50 %, nach 4 Jahren 25 % – die Halbwertszeit ist 2 Jahre.

  - kind: problem
    id: laut
    widget: order
    prompt: Ordne nach der Lautstärke in Dezibel, das leiseste zuerst.
    params:
      items:
        - { label: Flüstern }
        - { label: Gespräch }
        - { label: Straßenverkehr }
        - { label: Rockkonzert }
    hints:
      - Jede 10 dB mehr bedeuten zehnmal so viel Schallenergie.
    explanation: Etwa 30, 60, 80 und 110 dB – das Konzert hat millionenfach mehr Energie als Flüstern.

  - kind: problem
    id: mb-d1
    depth: 2
    widget: slider
    prompt: Die Kurve zeigt $y = \log_b x$. Stell die Basis b so ein, dass sie genau auf der gestrichelten Kurve liegt.
    params:
      expr: ln(x)/ln(b)
      x:
        - 0.25
        - 8
      y:
        - -3
        - 4
      sliders:
        - id: b
          label: b
          min: 1.5
          max: 5
          step: 0.5
          initial: 4
      target:
        expr: ln(x)/ln(2)
      markers:
        - x: 8
          y: 3
          label: P
    answer:
      matchTarget: true
    hints:
      - Die gestrichelte Kurve geht durch (8 | 3).
      - b hoch 3 = 8.
    explanation: b = 2, denn 2³ = 8. Alle Logarithmus-Kurven gehen durch (1 | 0) – egal welche Basis.
    difficulty: 2

  - kind: problem
    id: mb-d2
    depth: 2
    widget: choice
    prompt: In einem Diagramm sind beide Achsen logarithmisch. Die Kurve $y = x^3$ wird dort zu …?
    params:
      options:
        - label: einer Geraden mit Steigung 3
          correct: true
        - label: einer Parabel
          feedback: "Logarithmen machen aus Potenzen Faktoren: log y = 3 log x."
        - label: einer waagerechten Linie
          feedback: y wächst ja weiter mit x.
    hints:
      - Nimm auf beiden Seiten den Logarithmus.
      - log y = 3 · log x.
    explanation: log y = 3 log x ist eine Gerade in den Koordinaten (log x, log y). Ihre Steigung verrät den Exponenten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was ist das Besondere an der Zahl e ≈ 2,718?
    params:
      options:
        - label: $e^x$ ist ihre eigene Ableitung – die Steigung ist überall gleich dem Wert
          correct: true
        - label: Sie ist die größte irrationale Zahl
          feedback: Es gibt unendlich viele größere, etwa π.
        - label: Sie ist nur eine praktische Abkürzung für 2,7
          feedback: Sie entsteht zwingend bei stetigem Wachstum.
    hints:
      - Was passiert bei 100 % Zins, wenn man unendlich oft verzinst?
    explanation: (1 + 1/n)ⁿ nähert sich e. Darum ist ln, der Logarithmus zur Basis e, der »natürliche«.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Viele Naturgesetze sind **Potenzgesetze** $y = c \\cdot x^k$: Fallzeit und Höhe, Umlaufzeit und Bahnradius, Stoffwechsel und Körpermasse. Im doppellogarithmischen Plot werden sie zu Geraden, und die Steigung ist k."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "Bei Planeten gilt: Ist die Bahn 100-mal so weit, dauert ein Umlauf 1000-mal so lang. Im Log-Plot sind das 2 Stufen nach rechts und 3 nach oben. Welches k steht in T ∝ rᵏ?"
    answer:
      value: 1.5
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 0.667) < 0.01
        misconception: inverted
        text: "Steigung ist Höhe durch Breite: 3 : 2, nicht 2 : 3."
    hints:
      - "Steigung = Δlog T : Δlog r."
      - "3 : 2."
    explanation: "k = 1,5: T² ∝ r³, das dritte Keplersche Gesetz. Kepler fand es 1619 – mit Logarithmen als Werkzeug kurz danach."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum wird Wachstum mit festem Faktor auf einer Log-Achse zur Geraden?"
    params:
      keywords:
        - - faktor
          - mal
          - factor
          - times
        - - gleich
          - gleiche schritte
          - same
          - equal steps
        - - gerade
          - linear
          - line
          - straight
      sample: "Exponentiell heißt: in gleichen Zeitschritten mal denselben Faktor. Auf der logarithmischen Achse ist jeder Faktor ein gleich großer Schritt nach oben. Gleiche Schritte pro Zeit ergeben eine Gerade."
    explanation: log(a · qᵗ) = log a + t · log q – das ist eine lineare Funktion von t mit Steigung log q.
    difficulty: 3

srs:
  cards_from: [kurve, zerfall]
