id: math.logs.idea
type: concept
title: How many times?
summary: The logarithm asks for the exponent.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how often must you double 1 to exceed a billion?"
    params:
      min: 5
      max: 200
    answer:
      value: 30
      tolerance: 4
    explanation: Only 30 times. Exactly this question – “how often?” – is what the logarithm answers.

  - kind: problem
    id: zweier
    widget: numeric
    prompt: 2 to the power of what gives {{2 ** k}}?
    params: { placeholder: "Exponent" }
    answer: { value: "{{k}}" }
    hints:
      - "Start at 1 and keep doubling: 2, 4, 8, 16 …"
    explanation: "$2^{ {{k}} } = {{2 ** k}}$."
    variants:
      params: { k: "int[3,10]" }
      defaults: { k: 5 }

  - kind: explain
    id: s2
    body: |
      The **logarithm** answers exactly this question: $\log_2 32 = 5$, because $2^5 = 32$. With the base-10 logarithm, you are basically counting zeros: $\log_{10} 1000 = 3$.

  - kind: problem
    id: nullen
    widget: numeric
    prompt: "What is log₁₀ of 1 followed by {{k}} zeros?"
    params: { placeholder: "Number" }
    answer: { value: "{{k}}" }
    hints:
      - How many times must you multiply 10 by itself?
    explanation: "$10^{ {{k}} }$ has {{k}} zeros – so the logarithm is {{k}}."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 6 }

  - kind: problem
    id: dazwischen
    widget: choice
    prompt: Between which numbers does log₁₀ 500 lie?
    params:
      options:
        - { label: Between 2 and 3, correct: true }
        - { label: Between 50 and 51, feedback: "The logarithm is the exponent – and that stays small." }
        - { label: Between 5 and 6, feedback: "$10^5$ is already 100,000." }
    hints:
      - 500 lies between 100 and 1000.
    explanation: $10^2 = 100$ and $10^3 = 1000$ – so the logarithm lies in between.

  - kind: problem
    id: c1
    widget: match
    prompt: What belongs together?
    params:
      pairs:
        - left: $\log_2 8$
          right: "3"
        - left: $\log_{10} 10000$
          right: "4"
        - left: $\log_3 9$
          right: "2"
        - left: $\log_5 1$
          right: "0"
        - left: $\log_2 \frac{1}{2}$
          right: −1
    hints:
      - "Ask each time: base to what power?"
    explanation: The logarithm is the inverse of raising to a power.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is $\log_4 8$?
    answer:
      value: 1.5
    hints:
      - "Write both as powers of two: 4 = 2² and 8 = 2³."
    explanation: (2²)^x = 2³ means 2x = 3. Fractional exponents are allowed too.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Calculators often only know log₁₀ and ln. The **change of base** handles any base: $\\log_b x = \\frac{\\log x}{\\log b}$. Example: $\\log_2 8 = \\frac{0.903}{0.301} = 3$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Compute $\log_2 1000$ with the change of base. (log₁₀ 2 ≈ 0.301) To two decimals.
    answer:
      value: 9.97
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 10
        misconception: rounded
        text: "Close: 2¹⁰ = 1024 is a bit more than 1000, so the value is just under 10."
    hints:
      - log₁₀ 1000 = 3.
      - 3 / 0.301.
    explanation: 3 / 0.301 ≈ 9.97.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: What is $\log_{ {{b}} } {{b ** k}}$?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == b ** k / b
        misconception: divide
        text: The logarithm counts the factors, it does not divide.
    hints:
      - How many times must you multiply {{b}} by itself?
      - "{{b}} to what power gives {{b ** k}}?"
    explanation: ${{b}}^{ {{k}} } = {{b ** k}}$, so {{k}}.
    difficulty: 2
    variants:
      params:
        b: choice[3,5,7]
        k: int[2,5]
      defaults:
        b: 5
        k: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is there no logarithm of −8?
    params:
      options:
        - label: Because a positive base to any power always stays positive
          correct: true
        - label: Because −8 is too small
          feedback: 0.001 is small too and has logarithm −3.
        - label: "There is one: −3"
          feedback: 2⁻³ is 1/8, not −8.
    hints:
      - What is 2 to the −3?
    explanation: Negative exponents make small, not negative. Only with complex numbers does log(−8) make sense.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: The **natural logarithm** ln has the base e ≈ 2.718. Geometrically ln x is the area under the curve 1/t from 1 to x. That is why its derivative is 1/x – and why it shows up everywhere in calculus.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: How many digits does $3^{50}$ have? (log₁₀ 3 ≈ 0.4771)
    answer:
      value: 24
    feedback:
      - when: numval(state.input) == 23
        misconception: floor-not-plus-one
        text: log₁₀ ≈ 23.86 means between 10²³ and 10²⁴ – that is 24 digits.
    hints:
      - log₁₀ 3⁵⁰ = 50 · 0.4771.
      - A number with log₁₀ between 23 and 24 has 24 digits.
    explanation: "50 · 0.4771 = 23.86. The number of digits is the rounded-down logarithm plus 1: 24."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: "Which grows faster for very large x: ln x or √x?"
    params:
      options:
        - label: √x – every root eventually beats the logarithm.
          correct: true
        - label: At x = 10¹⁰⁰, ln x ≈ 230 while √x = 10⁵⁰.
          feedback: Bei x = 10¹⁰⁰ ist ln x ≈ 230, √x = 10⁵⁰.
        - label: The gap becomes enormous.
          feedback: Der Abstand wird riesig.
    hints:
      - Plug in x = 10¹⁰⁰.
      - ln 10¹⁰⁰ = 100 · ln 10 ≈ 230.
    explanation: The logarithm grows more slowly than any power $x^\varepsilon$, however small. That is why an algorithm with log n steps is so good.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Tell Lux why log₁₀ 1000 = 3.
    params:
      keywords:
        - - hoch
          - exponent
          - power
        - - zehn
          - ten
          - basis
          - base
        - - nullen
          - mal
          - zeros
          - times
          - three
      sample: "The logarithm asks: ten to what power gives 1000? Ten times ten times ten is 1000, so the exponent is three. You basically count the zeros."
    explanation: Logarithm = the exponent you are looking for. $10^3 = 1000 \Leftrightarrow \log_{10} 1000 = 3$.
    difficulty: 3

srs:
  cards_from: [zweier, dazwischen]
