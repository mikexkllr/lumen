id: math.logs.halflife
type: concept
title: Halbwertszeiten
summary: Immer wieder halbieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Uhr im Knochen
    body: "Archäologen lesen das Alter von Knochen an einer inneren Uhr ab: am zerfallenden Kohlenstoff. Zieh die Zeit weiter und zähl mit, wie oft sich der Rest **halbiert**."
    visual:
      widget: sim
      interactive: true
      params:
        scene: decay

  - kind: problem
    id: achtel
    widget: numeric
    prompt: Ein Stoff hat eine Halbwertszeit von {{t}} Jahren. Nach wie vielen Jahren ist nur noch ein Achtel übrig?
    params: { unit: Jahre }
    answer: { value: "{{3 * t}}" }
    hints:
      - "1 → ½ → ¼ → ⅛ – wie viele Halbierungen?"
    explanation: "Drei Halbwertszeiten – 3 · {{t}} = {{3 * t}} Jahre."
    variants:
      params: { t: "choice[5,8,10,30]" }
      defaults: { t: 8 }

  - kind: explain
    id: s2
    body: |
      Wie viele Halbierungen bis zu einem Anteil? Das beantwortet der **Logarithmus** zur Basis 2. Ein Tausendstel braucht rund 10 Halbierungen, weil $2^{10} = 1024$.

  - kind: problem
    id: tausendstel
    widget: numeric
    prompt: Wie viele Halbwertszeiten dauert es ungefähr, bis nur noch ein Tausendstel übrig ist?
    params: { unit: Halbwertszeiten }
    answer: { value: 10 }
    hints:
      - "$2^{10}$ ist etwa 1000."
    explanation: Nach 10 Halbwertszeiten bleibt rund ein Tausendstel.

  - kind: problem
    id: c14
    widget: choice
    prompt: Kohlenstoff-14 hat eine Halbwertszeit von 5730 Jahren. Ein Knochen enthält noch ein Viertel davon. Wie alt ist er etwa?
    params:
      options:
        - { label: Etwa 11 500 Jahre, correct: true }
        - { label: Etwa 1430 Jahre, feedback: "Ein Viertel heißt zwei volle Halbwertszeiten." }
        - { label: Etwa 23 000 Jahre, feedback: "Das wären vier Halbwertszeiten – ein Sechzehntel." }
    hints:
      - Ein Viertel heißt zwei Halbierungen.
    explanation: 2 · 5730 ≈ 11 460 Jahre – so funktioniert die Radiokarbon-Datierung.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: Die Halbwertszeit ist 2 Stunden. Zieh die Zeit genau so weit, dass nur noch ein Sechzehntel übrig ist.
    params:
      scene: decay
    answer:
      halflife: 2
      left:
        - 6
        - 6.5
    hints:
      - Ein Sechzehntel ist ½ · ½ · ½ · ½ – vier Halbierungen.
      - Vier Halbierungen zu je 2 Stunden.
    explanation: "$16 = 2^4$, also vier Halbwertszeiten: 4 · 2 h = 8 h. Dann sind 6,25 % übrig."

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Ein Medikament hat 4 Stunden Halbwertszeit. Nach wie vielen Stunden ist genau ein Achtel (12,5 %) übrig?
    params:
      scene: decay
      controls:
        halflife:
          value: 4
          fixed: true
    answer:
      left: 12.5
    explanation: "Drei Halbierungen: 12 Stunden. log₂ 8 = 3."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Wie lange dauert es bis zum Anteil N/N₀? Die **Halbierungen** zählt der Logarithmus zur Basis 2: $t = T \\cdot \\log_2 \\frac{N_0}{N}$. Bis zu einem Hundertstel sind es $\\log_2 100 \\approx 6{,}64$ Halbwertszeiten."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: "Halbwertszeit 3 Stunden: Finde den frühesten vollen Zeitpunkt, an dem die Anzeige höchstens 1 % zeigt."
    params:
      scene: decay
      controls:
        halflife:
          value: 3
          fixed: true
      show:
        - left
        - halvings
    answer:
      left:
        - 0.9
        - 1
    explanation: 3 · 6,64 ≈ 19,9 h. Nach 20 h sind 0,98 % übrig, nach 19 h noch 1,24 %.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Stoff zerfällt mit 8 Tagen Halbwertszeit. Nach wie vielen Tagen ist noch 1 % übrig? (log₂ 100 ≈ 6,64)
    answer:
      value: 53
      tolerance: 0.5
    hints:
      - Es braucht log₂ 100 Halbwertszeiten.
    explanation: 6,64 · 8 ≈ 53 Tage.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Trägt man den **Logarithmus** der Menge über der Zeit auf, wird jede Zerfallskurve zur Geraden: $\\ln N = \\ln N_0 - \\lambda t$. Ihre Steigung ist −λ. So bestimmen Labore Halbwertszeiten aus verrauschten Messwerten."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Ein Zähler misst 800 Impulse pro Minute, 12 Tage später nur noch 50. Wie groß ist die Halbwertszeit in Tagen?
    params:
      unit: Tage
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 0.75
        misconception: inverted
        text: Das wären Tage pro Faktor 16. Zähl erst die Halbierungen.
      - when: numval(state.input) == 6
        misconception: miscount
        text: "Von 800 auf 50 ist nicht zweimal halbieren. 800 : 50 = 16."
    hints:
      - "800 : 50 = 16 = 2⁴."
      - 4 Halbierungen in 12 Tagen.
    explanation: "12 : 4 = 3 Tage."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man ohne Taschenrechner schätzt, wann nur noch ein Tausendstel übrig ist.
    params:
      keywords:
        - - "1024"
          - zehn
          - ten
        - - halbier
          - halbwertszeit
          - halv
          - half-life
        - - mal
          - times
          - multipl
      sample: Zehnmal halbieren ergibt 1 durch 1024, also fast ein Tausendstel. Ich nehme die Halbwertszeit einfach mal zehn.
    explanation: "$2^{10} \\approx 10^3$: zehn Halbwertszeiten für ein Tausendstel, zwanzig für ein Millionstel."
    difficulty: 3

srs:
  cards_from: [achtel, c14]
