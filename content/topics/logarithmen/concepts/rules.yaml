id: math.logs.rules
type: concept
title: Aus mal wird plus
summary: Die Rechenregeln.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Vor dem Taschenrechner nutzte man für große Malaufgaben einen Rechenschieber. Was tat man damit eigentlich?
    params:
      options:
        - label: Zwei Längen aneinanderlegen – also addieren
          correct: true
        - label: Im Kopf malnehmen
          feedback: Dafür bräuchte man kein Gerät.
        - label: Raten
          feedback: Rechenschieber waren sehr genau.
    hints:
      - Zwei Stäbe werden gegeneinander verschoben.
    explanation: Ein Trick macht aus Malnehmen ein Addieren.


  - kind: explain
    id: s1
    body: |
      Der Logarithmus macht aus mal ein plus: $\log(a \cdot b) = \log a + \log b$. So rechnete man früher mit dem Rechenschieber.

  - kind: problem
    id: plus
    widget: numeric
    prompt: Was ist log₁₀ 100 + log₁₀ 1000?
    params: { placeholder: "Zahl" }
    answer: { value: 5 }
    hints:
      - Zähle die Nullen.
    explanation: 2 + 3 = 5 – und tatsächlich ist 100 · 1000 = 100 000 = $10^5$.

  - kind: problem
    id: hoch
    widget: numeric
    prompt: "Was ist log₂ von 8 hoch {{k}}?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{3 * k}}" }
    feedback:
      - when: "numval(state.input) == 3 + k"
        misconception: add-instead
        text: Aus Hoch wird mal – $\log(a^n) = n \cdot \log a$.
    hints:
      - "log₂ 8 = 3. Der Exponent {{k}} wandert nach vorn."
    explanation: "{{k}} · 3 = {{3 * k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 4 }

  - kind: problem
    id: regel
    widget: choice
    prompt: Welche Regel stimmt?
    params:
      options:
        - { label: "log(a · b) = log a + log b", correct: true }
        - { label: "log(a + b) = log a · log b", feedback: "Für Summen gibt es keine einfache Regel." }
        - { label: "log(a · b) = log a · log b", feedback: "Aus mal wird plus, nicht mal." }
    hints:
      - Denk an 100 · 1000 und die Nullen.
    explanation: Nullen addieren sich, wenn man Zehnerpotenzen multipliziert.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: log(a · b) = log a + log b
          right: true
        - text: log(a + b) = log a · log b
          right: false
          why: Für Summen gibt es keine Regel.
        - text: log(aⁿ) = n · log a
          right: true
        - text: log(a / b) = log a − log b
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: log₁₀ 2 ≈ 0,301. Wie groß ist log₁₀ 8? Auf drei Stellen.
    answer:
      value: 0.903
      tolerance: 0.002
    hints:
      - 8 = 2³.
    explanation: 3 · 0,301 = 0,903.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viele Stellen hat $2^{100}$? (log₁₀ 2 ≈ 0,301)
    answer:
      value: 31
    hints:
      - log₁₀ von 2¹⁰⁰ ist 100 · 0,301. Die Stellenzahl ist eins mehr als der ganze Teil.
    explanation: 30,1 – also 31 Stellen. Der Zehnerlogarithmus zählt Stellen.
    difficulty: 3

srs:
  cards_from: [plus, regel]
