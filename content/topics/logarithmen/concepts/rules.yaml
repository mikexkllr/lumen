id: math.logs.rules
type: concept
title: Aus mal wird plus
summary: Die Rechenregeln.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Trick der Sternforscher
    body: Vor Taschenrechnern dauerten große Malaufgaben Stunden. Ein Trick sparte Sternforschern jahrelanges Rechnen. Deck die Stationen der Reihe nach auf und folge ihm durch **400 Jahre**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔭
            front: Kepler rechnet
            back: Planetenbahnen brauchen endlose Malaufgaben mit vielen Stellen.
          - icon: 📖
            front: Napier, 1614
            back: Er veröffentlicht die ersten Tafeln mit Logarithmen. Kepler ist begeistert.
          - icon: 📏
            front: Der Rechenschieber
            back: Bald steckt der Trick in einem Lineal. Bis in die 1970er trägt fast jede Ingenieurin eines bei sich.
          - icon: 🚀
            front: Apollo 11
            back: Selbst auf dem Flug zum Mond war ein Rechenschieber an Bord.

  - kind: problem
    id: hook
    widget: choice
    prompt: Vor dem Taschenrechner nutzte man für große Malaufgaben einen Rechenschieber. Was tat man damit eigentlich?
    params:
      options:
        - label: Zwei Längen aneinanderlegen – also addieren
          correct: true
        - label: Im Kopf malnehmen
          feedback: Dafür bräuchte man kein Gerät.
        - label: Raten
          feedback: Rechenschieber waren sehr genau.
    hints:
      - Zwei Stäbe werden gegeneinander verschoben.
    explanation: Ein Trick macht aus Malnehmen ein Addieren.

  - kind: explain
    id: s1
    body: |
      Der Logarithmus macht aus mal ein plus: $\log(a \cdot b) = \log a + \log b$. So rechnete man früher mit dem **Rechenschieber**.

  - kind: problem
    id: plus
    widget: numeric
    prompt: Was ist log₁₀ 100 + log₁₀ 1000?
    params: { placeholder: "Zahl" }
    answer: { value: 5 }
    hints:
      - Zähle die Nullen.
    explanation: 2 + 3 = 5 – und tatsächlich ist 100 · 1000 = 100 000 = $10^5$.

  - kind: problem
    id: hoch
    widget: numeric
    prompt: "Was ist log₂ von 8 hoch {{k}}?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{3 * k}}" }
    feedback:
      - when: "numval(state.input) == 3 + k"
        misconception: add-instead
        text: Aus Hoch wird mal – $\log(a^n) = n \cdot \log a$.
    hints:
      - "log₂ 8 = 3. Der Exponent {{k}} wandert nach vorn."
    explanation: "{{k}} · 3 = {{3 * k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 4 }

  - kind: problem
    id: regel
    widget: choice
    prompt: Welche Regel stimmt?
    params:
      options:
        - { label: "log(a · b) = log a + log b", correct: true }
        - { label: "log(a + b) = log a · log b", feedback: "Für Summen gibt es keine einfache Regel." }
        - { label: "log(a · b) = log a · log b", feedback: "Aus mal wird plus, nicht mal." }
    hints:
      - Denk an 100 · 1000 und die Nullen.
    explanation: Nullen addieren sich, wenn man Zehnerpotenzen multipliziert.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: log(a · b) = log a + log b
          right: true
        - text: log(a + b) = log a · log b
          right: false
          why: Für Summen gibt es keine Regel.
        - text: log(aⁿ) = n · log a
          right: true
        - text: log(a / b) = log a − log b
          right: true

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Die Kurve zeigt $y = \log_{10}(a \cdot x)$. Stell a so ein, dass sie genau auf der gestrichelten Kurve $\log_{10} x + 1$ liegt.
    params:
      expr: log(a*x)
      x:
        - 0.5
        - 10
      y:
        - -0.5
        - 2.5
      showCoordinates: false
      sliders:
        - id: a
          label: a
          min: 1
          max: 20
          step: 1
          initial: 2
      target:
        expr: log(x) + 1
    answer:
      matchTarget: true
    hints:
      - "Aus mal wird plus: $\\log(a \\cdot x) = \\log a + \\log x$."
      - Für welches a ist $\log_{10} a = 1$?
    explanation: a = 10, denn $\log(10 \cdot x) = \log 10 + \log x = 1 + \log x$. Mal 10 schiebt die Kurve um 1 nach oben.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: log₁₀ 2 ≈ 0,301. Wie groß ist log₁₀ 8? Auf drei Stellen.
    answer:
      value: 0.903
      tolerance: 0.002
    hints:
      - 8 = 2³.
    explanation: 3 · 0,301 = 0,903.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Aus der Produktregel folgt die **Potenzregel**: $\\log(a^k) = \\log(a \\cdot a \\cdots a) = k \\cdot \\log a$. Ein Exponent wird zum Faktor. Damit holt man Unbekannte aus dem Exponenten."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: "log₁₀ 2 ≈ 0,301. Wie groß ist log₁₀ 5? Tipp: 5 = 10 : 2. Auf drei Stellen."
    answer:
      value: 0.699
      tolerance: 0.002
    feedback:
      - when: abs(numval(state.input) - 0.7525) < 0.003
        misconception: power-misuse
        text: "Das ist 2,5 · log 2. Aber 5 ist 10 : 2, nicht 2 hoch 2,5."
    hints:
      - "log(10 : 2) = log 10 − log 2."
      - 1 − 0,301.
    explanation: log₁₀ 5 = 1 − 0,301 = 0,699. Mit log 2 und log 3 bekommt man so die Logarithmen vieler Zahlen.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Berechne $\log_2 48 - \log_2 3$.
    answer:
      value: 4
    hints:
      - Minus von Logarithmen heißt geteilt im Inneren.
      - "48 : 3 = 16."
    explanation: $\log_2 16 = 4$. Weder log₂ 48 noch log₂ 3 ist eine ganze Zahl – ihre Differenz schon.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viele Stellen hat $2^{100}$? (log₁₀ 2 ≈ 0,301)
    answer:
      value: 31
    hints:
      - log₁₀ von 2¹⁰⁰ ist 100 · 0,301. Die Stellenzahl ist eins mehr als der ganze Teil.
    explanation: 30,1 – also 31 Stellen. Der Zehnerlogarithmus zählt Stellen.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: swipe
    prompt: Stimmt die Regel?
    params:
      cards:
        - text: log(a + b) = log a + log b
          right: false
          why: "Plus im Inneren hat keine Regel. Probe: log 2 ≠ 2 · log 1 = 0."
        - text: "log(a : b) = log a − log b"
          right: true
          why: Teilen wird zu Minus.
        - text: log √a = ½ · log a
          right: true
          why: Die Wurzel ist die Potenz ½.
        - text: log a · log b = log(ab)
          right: false
          why: Mal im Inneren wird plus außen, nicht mal.
        - text: log 1 = 0
          right: true
          why: Jede Basis hoch 0 ist 1.
      left: Falsch
      right: Richtig
    explanation: Logarithmen verwandeln mal in plus, geteilt in minus und hoch in mal – sonst nichts.
    difficulty: 3

  - kind: explain
    id: mb-x2
    depth: 3
    body: "John Napier veröffentlichte 1614 die ersten Logarithmentafeln, Henry Briggs bald darauf die mit Basis 10. Astronomen wie Kepler sparten damit Jahre an Rechenzeit: Sie schlugen Logarithmen nach und **addierten** statt zu multiplizieren."

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: "Mit log₁₀ 2 ≈ 0,301 und log₁₀ 3 ≈ 0,477: Wie groß ist log₁₀ 6? Auf drei Stellen."
    answer:
      value: 0.778
      tolerance: 0.002
    feedback:
      - when: abs(numval(state.input) - 0.1436) < 0.002
        misconception: multiply-logs
        text: "Malnehmen der Logarithmen ist falsch. 6 = 2 · 3 heißt: Logarithmen addieren."
    hints:
      - 6 = 2 · 3.
      - 0,301 + 0,477.
    explanation: "0,301 + 0,477 = 0,778. So rechnete man mit Tafeln: nachschlagen, addieren, zurückschlagen."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum der Logarithmus aus mal plus macht.
    params:
      keywords:
        - - exponent
          - hochzahl
          - power
        - - addieren
          - plus
          - addier
          - add
        - - malnehmen
          - multiplizieren
          - produkt
          - multipl
          - product
      sample: "Der Logarithmus ist ein Exponent. Wenn ich zwei Potenzen derselben Basis malnehme, addieren sich ihre Exponenten: 10² · 10³ = 10⁵. Also wird aus dem Produkt der Zahlen die Summe der Logarithmen."
    explanation: $b^x \cdot b^y = b^{x+y}$ – rückwärts gelesen ist das die Produktregel der Logarithmen.
    difficulty: 3

srs:
  cards_from: [plus, regel]
