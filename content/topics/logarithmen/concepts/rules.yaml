id: math.logs.rules
type: concept
title: Aus mal wird plus
summary: Die Rechenregeln.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Der Logarithmus macht aus mal ein plus: $\log(a \cdot b) = \log a + \log b$. So rechnete man früher mit dem Rechenschieber.

  - kind: problem
    id: plus
    widget: numeric
    prompt: Was ist log₁₀ 100 + log₁₀ 1000?
    params: { placeholder: "Zahl" }
    answer: { value: 5 }
    hints:
      - Zähle die Nullen.
    explanation: 2 + 3 = 5 – und tatsächlich ist 100 · 1000 = 100 000 = $10^5$.

  - kind: problem
    id: hoch
    widget: numeric
    prompt: "Was ist log₂ von 8 hoch {{k}}?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{3 * k}}" }
    feedback:
      - when: "numval(state.input) == 3 + k"
        misconception: add-instead
        text: Aus Hoch wird mal – $\log(a^n) = n \cdot \log a$.
    hints:
      - "log₂ 8 = 3. Der Exponent {{k}} wandert nach vorn."
    explanation: "{{k}} · 3 = {{3 * k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 4 }

  - kind: problem
    id: regel
    widget: choice
    prompt: Welche Regel stimmt?
    params:
      options:
        - { label: "log(a · b) = log a + log b", correct: true }
        - { label: "log(a + b) = log a · log b", feedback: "Für Summen gibt es keine einfache Regel." }
        - { label: "log(a · b) = log a · log b", feedback: "Aus mal wird plus, nicht mal." }
    hints:
      - Denk an 100 · 1000 und die Nullen.
    explanation: Nullen addieren sich, wenn man Zehnerpotenzen multipliziert.

srs:
  cards_from: [plus, regel]
