id: math.logs.halflife
type: concept
title: Half-lives
summary: Halving again and again.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The clock in the bone
    body: "Archaeologists read the age of bones from a hidden clock: decaying carbon. Drag the time forward and count how often the rest is **halved**."
    visual:
      widget: sim
      interactive: true
      params:
        scene: decay

  - kind: problem
    id: achtel
    widget: numeric
    prompt: A substance has a half-life of {{t}} years. After how many years is only an eighth left?
    params: { unit: years }
    answer: { value: "{{3 * t}}" }
    hints:
      - "1 → ½ → ¼ → ⅛ – how many halvings?"
    explanation: "Three half-lives – 3 · {{t}} = {{3 * t}} years."
    variants:
      params: { t: "choice[5,8,10,30]" }
      defaults: { t: 8 }

  - kind: explain
    id: s2
    body: |
      How many halvings does it take to reach a given fraction? The **logarithm** to base 2 answers that. A thousandth takes about 10 halvings, because $2^{10} = 1024$.

  - kind: problem
    id: tausendstel
    widget: numeric
    prompt: About how many half-lives does it take until only a thousandth is left?
    params: { unit: half-lives }
    answer: { value: 10 }
    hints:
      - "$2^{10}$ is about 1000."
    explanation: After 10 half-lives, about a thousandth is left.

  - kind: problem
    id: c14
    widget: choice
    prompt: Carbon-14 has a half-life of 5730 years. A bone still contains a quarter of it. About how old is it?
    params:
      options:
        - { label: "About 11,500 years", correct: true }
        - { label: About 1430 years, feedback: "A quarter means two full half-lives." }
        - { label: "About 23,000 years", feedback: "That would be four half-lives – a sixteenth." }
    hints:
      - A quarter means two halvings.
    explanation: 2 · 5730 ≈ 11,460 years – that is how radiocarbon dating works.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: The half-life is 2 hours. Drag the time exactly to the point where only a sixteenth is left.
    params:
      scene: decay
    answer:
      halflife: 2
      left:
        - 6
        - 6.5
    hints:
      - A sixteenth is ½ · ½ · ½ · ½ – four halvings.
      - Four halvings of 2 hours each.
    explanation: "$16 = 2^4$, so four half-lives: 4 · 2 h = 8 h. Then 6.25 % is left."

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: A drug has a half-life of 4 hours. After how many hours is exactly one eighth (12.5%) left?
    params:
      scene: decay
      controls:
        halflife:
          value: 4
          fixed: true
    answer:
      left: 12.5
    explanation: "Three halvings: 12 hours. log₂ 8 = 3."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "How long until the share N/N₀ is left? The logarithm to base 2 counts the **halvings**: $t = T \\cdot \\log_2 \\frac{N_0}{N}$. Down to one hundredth it takes $\\log_2 100 \\approx 6.64$ half-lives."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: "Half-life 3 hours: find the earliest whole hour at which the display shows at most 1 %."
    params:
      scene: decay
      controls:
        halflife:
          value: 3
          fixed: true
      show:
        - left
        - halvings
    answer:
      left:
        - 0.9
        - 1
    explanation: 3 · 6.64 ≈ 19.9 h. After 20 h 0.98 % is left, after 19 h still 1.24 %.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A substance decays with a half-life of 8 days. After how many days is 1% left? (log₂ 100 ≈ 6.64)
    answer:
      value: 53
      tolerance: 0.5
    hints:
      - It takes log₂ 100 half-lives.
    explanation: 6.64 · 8 ≈ 53 days.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "If you plot the **logarithm** of the amount against time, every decay curve becomes a straight line: $\\ln N = \\ln N_0 - \\lambda t$. Its slope is −λ. That is how labs get half-lives from noisy measurements."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: A counter measures 800 counts per minute, 12 days later only 50. What is the half-life in days?
    params:
      unit: days
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 0.75
        misconception: inverted
        text: That would be days per factor 16. Count the halvings first.
      - when: numval(state.input) == 6
        misconception: miscount
        text: 800 to 50 is not two halvings. 800 / 50 = 16.
    hints:
      - 800 / 50 = 16 = 2⁴.
      - 4 halvings in 12 days.
    explanation: 12 / 4 = 3 days.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux how to estimate without a calculator when only a thousandth is left.
    params:
      keywords:
        - - "1024"
          - zehn
          - ten
        - - halbier
          - halbwertszeit
          - halv
          - half-life
        - - mal
          - times
          - multipl
      sample: Halving ten times gives 1 over 1024, almost a thousandth. I simply multiply the half-life by ten.
    explanation: "$2^{10} \\approx 10^3$: ten half-lives for a thousandth, twenty for a millionth."
    difficulty: 3

srs:
  cards_from: [achtel, c14]
