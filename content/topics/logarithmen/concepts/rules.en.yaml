id: math.logs.rules
type: concept
title: Multiplying becomes adding
summary: The rules of calculation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Before calculators people used a slide rule for big multiplications. What did they actually do with it?
    params:
      options:
        - label: Put two lengths end to end – that is, add
          correct: true
        - label: Multiply in the head
          feedback: No device would be needed for that.
        - label: Guess
          feedback: Slide rules were very accurate.
    hints:
      - Two rods are slid against each other.
    explanation: A trick turns multiplying into adding.

  - kind: explain
    id: s1
    body: |
      The logarithm turns multiplying into adding: $\log(a \cdot b) = \log a + \log b$. That is how people used to calculate with a **slide rule**.

  - kind: problem
    id: plus
    widget: numeric
    prompt: What is log₁₀ 100 + log₁₀ 1000?
    params: { placeholder: "Number" }
    answer: { value: 5 }
    hints:
      - Count the zeros.
    explanation: 2 + 3 = 5 – and indeed 100 · 1000 = 100,000 = $10^5$.

  - kind: problem
    id: hoch
    widget: numeric
    prompt: "What is log₂ of 8 to the power of {{k}}?"
    params: { placeholder: "Number" }
    answer: { value: "{{3 * k}}" }
    feedback:
      - when: "numval(state.input) == 3 + k"
        misconception: add-instead
        text: A power becomes a product – $\log(a^n) = n \cdot \log a$.
    hints:
      - "log₂ 8 = 3. The exponent {{k}} moves to the front."
    explanation: "{{k}} · 3 = {{3 * k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 4 }

  - kind: problem
    id: regel
    widget: choice
    prompt: Which rule is correct?
    params:
      options:
        - { label: "log(a · b) = log a + log b", correct: true }
        - { label: "log(a + b) = log a · log b", feedback: "There is no simple rule for sums." }
        - { label: "log(a · b) = log a · log b", feedback: "Multiplying becomes adding, not multiplying." }
    hints:
      - Think of 100 · 1000 and the zeros.
    explanation: Zeros add up when you multiply powers of ten.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: log(a · b) = log a + log b
          right: true
        - text: log(a + b) = log a · log b
          right: false
          why: There is no rule for sums.
        - text: log(aⁿ) = n · log a
          right: true
        - text: log(a / b) = log a − log b
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: log₁₀ 2 ≈ 0.301. What is log₁₀ 8? To three places.
    answer:
      value: 0.903
      tolerance: 0.002
    hints:
      - 8 = 2³.
    explanation: 3 · 0.301 = 0.903.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "The product rule implies the **power rule**: $\\log(a^k) = \\log(a \\cdot a \\cdots a) = k \\cdot \\log a$. An exponent becomes a factor. This gets unknowns out of the exponent."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: "log₁₀ 2 ≈ 0.301. What is log₁₀ 5? Hint: 5 = 10 / 2. To three decimals."
    answer:
      value: 0.699
      tolerance: 0.002
    feedback:
      - when: abs(numval(state.input) - 0.7525) < 0.003
        misconception: power-misuse
        text: That is 2.5 · log 2. But 5 is 10 / 2, not 2 to the 2.5.
    hints:
      - log(10 / 2) = log 10 − log 2.
      - 1 − 0.301.
    explanation: log₁₀ 5 = 1 − 0.301 = 0.699. With log 2 and log 3 you get the logarithms of many numbers this way.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Compute $\log_2 48 - \log_2 3$.
    answer:
      value: 4
    hints:
      - Subtracting logarithms means dividing inside.
      - 48 / 3 = 16.
    explanation: $\log_2 16 = 4$. Neither log₂ 48 nor log₂ 3 is a whole number – but their difference is.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: How many digits does $2^{100}$ have? (log₁₀ 2 ≈ 0.301)
    answer:
      value: 31
    hints:
      - log₁₀ of 2¹⁰⁰ is 100 · 0.301. The digit count is one more than the whole part.
    explanation: 30.1 – so 31 digits. The base-ten logarithm counts digits.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: swipe
    prompt: Is the rule right?
    params:
      cards:
        - text: log(a + b) = log a + log b
          right: false
          why: "Plus inside has no rule. Check: log 2 ≠ 2 · log 1 = 0."
        - text: log(a / b) = log a − log b
          right: true
          why: Dividing turns into minus.
        - text: log √a = ½ · log a
          right: true
          why: The root is the power ½.
        - text: log a · log b = log(ab)
          right: false
          why: Times inside becomes plus outside, not times.
        - text: log 1 = 0
          right: true
          why: Every base to the power 0 is 1.
      left: Wrong
      right: Right
    explanation: Logarithms turn times into plus, divided into minus and powers into times – nothing else.
    difficulty: 3

  - kind: explain
    id: mb-x2
    depth: 3
    body: "John Napier published the first logarithm tables in 1614, Henry Briggs soon after the base-10 ones. Astronomers like Kepler saved years of computing time: they looked up logarithms and **added** instead of multiplying."

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: "With log₁₀ 2 ≈ 0.301 and log₁₀ 3 ≈ 0.477: what is log₁₀ 6? To three decimals."
    answer:
      value: 0.778
      tolerance: 0.002
    feedback:
      - when: abs(numval(state.input) - 0.1436) < 0.002
        misconception: multiply-logs
        text: "Multiplying the logarithms is wrong. 6 = 2 · 3 means: add the logarithms."
    hints:
      - 6 = 2 · 3.
      - 0.301 + 0.477.
    explanation: "0.301 + 0.477 = 0.778. That is how people computed with tables: look up, add, look back."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Tell Lux why the logarithm turns times into plus.
    params:
      keywords:
        - - exponent
          - hochzahl
          - power
        - - addieren
          - plus
          - addier
          - add
        - - malnehmen
          - multiplizieren
          - produkt
          - multipl
          - product
      sample: "The logarithm is an exponent. When I multiply two powers of the same base, their exponents add: 10² · 10³ = 10⁵. So the product of the numbers becomes the sum of the logarithms."
    explanation: $b^x \cdot b^y = b^{x+y}$ – read backwards, that is the product rule of logarithms.
    difficulty: 3

srs:
  cards_from: [plus, regel]
