id: math.logs.lab
type: concept
title: Logarithm lab
summary: Curves, scales and half-lives.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Two curves, one mirror
    body: Powers and logarithms undo each other – and you can see it. The curves $2^x$ and $\log_2 x$ mirror each other in the line y = x. Drag P and Q. Swap x and y, and you land on the **other curve**.
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -2
          - 6
        y:
          - -2
          - 6
        functions:
          - expr: 2^x
            label: 2^x
          - expr: log(x)/log(2)
            label: log₂ x
          - expr: x
            label: y = x
        points:
          - id: P
            x: 1
            y: 2
          - id: Q
            x: 2
            y: 1

  - kind: problem
    id: kurve
    widget: graph
    prompt: Place P on the curve y = 2 to the power of x – exactly where y = 8.
    params:
      x: [-1, 4]
      y: [0, 10]
      functions: [{ expr: "2^x" }]
      points: [{ id: P, x: 0, y: 1 }]
    answer: { points: { P: { x: 3, y: 8 } } }
    hints:
      - How many times must you multiply 2 by itself to get 8?
    explanation: x = 3, because $2^3 = 8$ – so $\log_2 8 = 3$.

  - kind: problem
    id: strahl
    widget: numberline
    prompt: Mark roughly where log₁₀ 500 lies.
    params: { min: 2, max: 3, ticks: 10, labels: decimals }
    answer: { value: 2.7 }
    hints:
      - log₁₀ 1000 = 3, and 500 is half as much – but in the logarithm, only a small piece is missing.
    explanation: log₁₀ 500 ≈ 2.7. Halving costs only 0.3 on the log scale.

  - kind: problem
    id: zerfall
    widget: slider
    prompt: The curve shows what percentage of a substance is left. Set the half-life so the curve hits the points.
    params:
      expr: "100 * 0.5^(x / t)"
      x: [0, 8]
      y: [0, 100]
      showCoordinates: false
      sliders: [{ id: t, label: "Half-life (years)", min: 1, max: 5, step: 1, initial: 4 }]
      markers:
        - { x: 2, y: 50, group: a }
        - { x: 4, y: 25, group: a }
    check: { predicate: "t == 2" }
    hints:
      - After how many years is only half left?
    explanation: After 2 years 50%, after 4 years 25% – the half-life is 2 years.

  - kind: problem
    id: laut
    widget: order
    prompt: Sort by loudness in decibels, quietest first.
    params:
      items:
        - { label: Whispering }
        - { label: Conversation }
        - { label: Road traffic }
        - { label: Rock concert }
    hints:
      - Every 10 dB more means ten times as much sound energy.
    explanation: About 30, 60, 80 and 110 dB – the concert has a million times more energy than whispering.

  - kind: problem
    id: mb-d1
    depth: 2
    widget: slider
    prompt: The curve shows $y = \log_b x$. Set the base b so that it lies exactly on the dashed curve.
    params:
      expr: ln(x)/ln(b)
      x:
        - 0.25
        - 8
      y:
        - -3
        - 4
      sliders:
        - id: b
          label: b
          min: 1.5
          max: 5
          step: 0.5
          initial: 4
      target:
        expr: ln(x)/ln(2)
      markers:
        - x: 8
          y: 3
          label: P
    answer:
      matchTarget: true
    hints:
      - The dashed curve passes through (8 | 3).
      - b to the 3 = 8.
    explanation: b = 2, because 2³ = 8. Every logarithm curve passes through (1 | 0) – whatever the base.
    difficulty: 2

  - kind: problem
    id: mb-d2
    depth: 2
    widget: choice
    prompt: In a chart both axes are logarithmic. The curve $y = x^3$ becomes …?
    params:
      options:
        - label: a straight line with slope 3
          correct: true
        - label: "Logarithms turn powers into factors: log y = 3 log x."
          feedback: "Logarithmen machen aus Potenzen Faktoren: log y = 3 log x."
        - label: y still grows with x.
          feedback: y wächst ja weiter mit x.
    hints:
      - Take the logarithm of both sides.
      - log y = 3 · log x.
    explanation: log y = 3 log x is a line in the coordinates (log x, log y). Its slope reveals the exponent.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What is special about the number e ≈ 2.718?
    params:
      options:
        - label: $e^x$ is its own derivative – the slope everywhere equals the value
          correct: true
        - label: It is the largest irrational number
          feedback: There are infinitely many larger ones, such as π.
        - label: It is just a handy shorthand for 2.7
          feedback: It arises necessarily in continuous growth.
    hints:
      - What happens at 100% interest compounded infinitely often?
    explanation: (1 + 1/n)ⁿ approaches e. That is why ln, the logarithm to base e, is the “natural” one.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Many laws of nature are **power laws** $y = c \\cdot x^k$: fall time and height, orbital period and radius, metabolism and body mass. In a log–log plot they become straight lines with slope k."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "For planets: if the orbit is 100 times as wide, one orbit takes 1000 times as long. In a log–log plot that is 2 steps right and 3 up. What k is in T ∝ rᵏ?"
    answer:
      value: 1.5
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 0.667) < 0.01
        misconception: inverted
        text: "Slope is rise over run: 3 / 2, not 2 / 3."
    hints:
      - Slope = Δlog T / Δlog r.
      - 3 / 2.
    explanation: "k = 1.5: T² ∝ r³, Kepler's third law. He found it in 1619 – and logarithms soon became his tool."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why exponential growth is a straight line on a logarithmic axis.
    params:
      keywords:
        - - faktor
          - mal
          - factor
          - times
        - - gleich
          - gleiche schritte
          - same
          - equal steps
        - - gerade
          - linear
          - line
          - straight
      sample: "Exponential means: in equal time steps times the same factor. On a logarithmic axis every factor is an equal step up. Equal steps per time give a straight line."
    explanation: log(a · qᵗ) = log a + t · log q – a linear function of t with slope log q.
    difficulty: 3

srs:
  cards_from: [kurve, zerfall]
