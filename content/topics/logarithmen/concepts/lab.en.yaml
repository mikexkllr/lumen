id: math.logs.lab
type: concept
title: Logarithm lab
summary: Curves, scales and half-lives.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: kurve
    widget: graph
    prompt: Place P on the curve y = 2 to the power of x – exactly where y = 8.
    params:
      x: [-1, 4]
      y: [0, 10]
      functions: [{ expr: "2^x" }]
      points: [{ id: P, x: 0, y: 1 }]
    answer: { points: { P: { x: 3, y: 8 } } }
    hints:
      - How many times must you multiply 2 by itself to get 8?
    explanation: x = 3, because $2^3 = 8$ – so $\log_2 8 = 3$.

  - kind: problem
    id: strahl
    widget: numberline
    prompt: Mark roughly where log₁₀ 500 lies.
    params: { min: 2, max: 3, ticks: 10, labels: decimals }
    answer: { value: 2.7 }
    hints:
      - log₁₀ 1000 = 3, and 500 is half as much – but in the logarithm, only a small piece is missing.
    explanation: log₁₀ 500 ≈ 2.7. Halving costs only 0.3 on the log scale.

  - kind: problem
    id: zerfall
    widget: slider
    prompt: The curve shows what percentage of a substance is left. Set the half-life so the curve hits the points.
    params:
      expr: "100 * 0.5^(x / t)"
      x: [0, 8]
      y: [0, 100]
      showCoordinates: false
      sliders: [{ id: t, label: "Half-life (years)", min: 1, max: 5, step: 1, initial: 4 }]
      markers:
        - { x: 2, y: 50, group: a }
        - { x: 4, y: 25, group: a }
    check: { predicate: "t == 2" }
    hints:
      - After how many years is only half left?
    explanation: After 2 years 50%, after 4 years 25% – the half-life is 2 years.

  - kind: problem
    id: laut
    widget: order
    prompt: Sort by loudness in decibels, quietest first.
    params:
      items:
        - { label: Whispering }
        - { label: Conversation }
        - { label: Road traffic }
        - { label: Rock concert }
    hints:
      - Every 10 dB more means ten times as much sound energy.
    explanation: About 30, 60, 80 and 110 dB – the concert has a million times more energy than whispering.

srs:
  cards_from: [kurve, zerfall]
