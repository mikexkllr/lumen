id: math.series.geometric
type: concept
title: "The geometric series"
summary: "Half a pizza, a quarter, an eighth – and still just one pizza."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Infinite, yet finite
    body: "Can a sum of infinitely many numbers stay finite? The curve shows $1 + q + q^2 + \\dots$ after x terms. Drag q and watch: the sum grows and grows – yet hits a **ceiling**."
    visual:
      widget: slider
      interactive: true
      params:
        expr: (1 - q^x)/(1 - q)
        x:
          - 0
          - 12
        y:
          - 0
          - 6
        showCoordinates: false
        sliders:
          - id: q
            label: q
            min: 0.1
            max: 0.8
            step: 0.1
            initial: 0.3

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: you eat half a pizza, then a quarter, then an eighth – and so on forever. How many pizzas do you eat in total?"
    params:
      min: 0
      max: 4
      step: 0.1
    answer:
      value: 1
      tolerance: 0.1
    explanation: Exactly one. Each slice is half of what is left – you never go beyond one pizza, yet you finish it.

  - kind: explain
    id: c1
    body: Adding the first n terms gives the **partial sum** $S_n$. For ½ + ¼ + ⅛ + … after n steps exactly $\frac{1}{2^n}$ is missing up to 1. That gap gets arbitrarily small.

  - kind: problem
    id: c2
    widget: numeric
    prompt: What is $\frac12 + \frac14 + \dots + \frac{1}{ {{2 ** n}} }$ – the sum of the first {{n}} terms? As a fraction.
    answer:
      value: "{{2 ** n - 1}}/{{2 ** n}}"
    feedback:
      - when: numval(state.input) == 1
        misconception: limit-too-early
        text: Only infinitely many terms give 1. After {{n}} steps a piece is still missing.
    hints:
      - How much is missing up to 1?
      - Exactly the last term is missing, i.e. 1/{{2 ** n}}.
    explanation: 1 − 1/{{2 ** n}} = {{2 ** n - 1}}/{{2 ** n}}.
    variants:
      params:
        n: int[3,10]
      defaults:
        n: 4

  - kind: problem
    id: c3
    widget: numberline
    prompt: Mark ½ + ¼ + ⅛ on the number line.
    params:
      min: 0
      max: 1
      ticks: 8
      labels: decimals
    answer:
      value: 0.875
    hints:
      - 0.5 + 0.25 + 0.125.
      - One eighth before 1.
    explanation: 0.875 – one eighth short of 1. The next step halves that gap.

  - kind: explain
    id: c4
    body: "In general, for |q| < 1: $a + aq + aq^2 + \\dots = \\frac{a}{1 - q}$. This is the **geometric series** – the most important infinite sum in mathematics."

  - kind: problem
    id: c5
    widget: numeric
    prompt: Compute ${{a}} + {{a}} \cdot \frac{1}{ {{k}} } + {{a}} \cdot \frac{1}{ {{k * k}} } + \dots$ To two decimals.
    answer:
      value: "{{a * k / (k - 1)}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - a / (1 - k)) < 0.01
        misconception: q-inverted
        text: Here q = 1/{{k}}, not {{k}}.
    hints:
      - a = {{a}}, q = 1/{{k}}.
      - "{{a}} / (1 − 1/{{k}})."
    explanation: "{{a}} / ({{k - 1}}/{{k}}) = {{a * k / (k - 1)}}."
    variants:
      params:
        a: int[2,9]
        k: choice[2,3,4,5]
      defaults:
        a: 6
        k: 3

  - kind: explain
    id: d1
    depth: 2
    body: "If |q| ≥ 1, the terms do not shrink. Then the sum grows without bound or jumps back and forth: it **diverges**. A series can only converge if its terms tend to 0."

  - kind: problem
    id: d2
    depth: 2
    widget: buckets
    prompt: Does the series $\sum q^n$ converge or not?
    params:
      buckets:
        - id: b1
          label: Converges
        - id: b2
          label: Diverges
      items:
        - label: q = 1/2
          bucket: b1
        - label: q = −1/2
          bucket: b1
        - label: q = 0.99
          bucket: b1
        - label: q = 2
          bucket: b2
        - label: q = −1
          bucket: b2
        - label: q = 1
          bucket: b2
    hints:
      - Only |q| matters.
      - Convergence exactly for |q| < 1.
    explanation: "Even q = 0.99 converges, just slowly: to 1 / 0.01 = 100. At q = −1 the sum jumps between 1 and 0."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: What is 0.9 + 0.09 + 0.009 + …?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 0.999
        misconception: finite
        text: That is only three terms. Infinitely many close the gap completely.
    hints:
      - a = 0.9, q = 0.1.
      - 0.9 / 0.9.
    explanation: 0.9 / (1 − 0.1) = 1. That is why 0.999… = 1.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "The **Koch snowflake**: put a small triangle on every edge of a triangle, again and again. The perimeter grows by 4/3 each time – so to infinity. But the area is a geometric series and stays finite."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: The snowflake's starting triangle has area 1. The new triangles add $\frac13 + \frac13 \cdot \frac49 + \frac13 \cdot \left(\frac49\right)^2 + \dots$ How large is the final area?
    answer:
      value: 1.6
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.6
        misconception: forgot-start
        text: That is only the increase. Add the starting triangle.
    hints:
      - "Increase: (1/3) / (1 − 4/9) = (1/3) / (5/9)."
      - That is 3/5. Plus 1.
    explanation: 1 + 3/5 = 8/5 = 1.6. An infinite boundary around a finite area – a fractal.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: What is 1 − 1 + 1 − 1 + 1 − …?
    params:
      options:
        - label: No limit – the partial sums jump 1, 0, 1, 0.
          correct: true
        - label: Grouped as (1 − 1) + (1 − 1) it looks like that. Grouped differently you get 1.
          feedback: Klammert man (1 − 1) + (1 − 1), sieht es so aus. Anders geklammert kommt 1 heraus.
        - label: That is the average of the partial sums – a substitute value, not a limit.
          feedback: Das ist der Mittelwert der Teilsummen – ein Ersatzwert, kein Grenzwert.
    hints:
      - Write out the partial sums.
      - Do they approach a number?
    explanation: The series diverges because q = −1. Regrouping infinite sums at will can »prove« anything – that is why we need limits.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: "Tell Lux: how can infinitely many pieces ½ + ¼ + ⅛ + … add up to exactly 1?"
    params:
      keywords:
        - - rest
          - lücke
          - fehlt
          - gap
          - missing
          - left
        - - halb
          - hälfte
          - half
          - halv
        - - grenzwert
          - beliebig klein
          - "null"
          - limit
          - tiny
          - zero
      sample: After each step a gap is left up to 1, and the next step fills exactly half of it. So the gap gets arbitrarily small. The limit of the partial sums is therefore exactly 1.
    explanation: An infinite sum is the limit of its partial sums. If the gap shrinks to 0, the result is finite.
    difficulty: 3

srs:
  cards_from: ["c2", "c5", "d2"]
