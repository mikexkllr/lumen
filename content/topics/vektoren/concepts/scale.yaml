id: math.vectors.scale
type: concept
title: Strecken und umdrehen
summary: Vektor mal Zahl.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: doppelt
    widget: graph
    prompt: Der Pfeil zeigt nach A. Zieh P an die Spitze des doppelt so langen Pfeils.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 1, y: 2, draggable: false }
        - { id: P, x: 4, y: 1 }
      segments: [[O, A], [O, P]]
    answer: { points: { P: { x: 2, y: 4 } } }
    hints:
      - Beide Werte verdoppeln.
    explanation: 2 · (1, 2) = (2, 4) – gleiche Richtung, doppelte Länge.

  - kind: explain
    id: s2
    body: |
      Mal eine Zahl wird ein Vektor **gestreckt** oder gestaucht. Mal −1 zeigt er genau in die Gegenrichtung.

  - kind: problem
    id: drohne
    widget: numeric
    prompt: Eine Drohne fliegt pro Minute ({{a}}, {{b}}) Meter. Wie weit ist sie nach {{k}} Minuten nach rechts gekommen?
    params: { unit: m }
    answer: { value: "{{k * a}}" }
    hints:
      - "{{k}} · ({{a}}, {{b}}) – erst der x-Wert."
    explanation: "{{k}} · {{a}} = {{k * a}} m nach rechts und {{k * b}} m nach oben."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]", k: "int[3,8]" }
      defaults: { a: 4, b: 3, k: 5 }

  - kind: problem
    id: minus
    widget: choice
    prompt: Was macht −1 · (3, 2) mit dem Pfeil?
    params:
      options:
        - { label: Er zeigt genau in die Gegenrichtung., correct: true }
        - { label: Er wird kürzer., feedback: "Die Länge bleibt gleich." }
        - { label: Er dreht sich um 90°., feedback: "Er dreht sich um 180°." }
    hints:
      - Rechne aus – was ist −1 · (3, 2)?
    explanation: (−3, −2) – gleiche Länge, umgekehrte Richtung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Punkt P liegt auf einem Drittel des Wegs von A(0 | 0) nach B(9 | 6). Welche x-Koordinate hat P?
    answer:
      value: 3
    hints:
      - P = A + ⅓ · (B − A).
    explanation: ⅓ · (9, 6) = (3, 2). So berechnen Animationen Zwischenbilder.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Der Punkt $\vec a + t \cdot (\vec b - \vec a)$ wandert für t von 0 bis 1 von A nach B. Bei t = ½ liegt die Mitte $\frac{\vec a + \vec b}{2}$. Diese **Parameterform** beschreibt jede Gerade – und jede Animation in Spielen.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Welche y-Koordinate hat die Mitte zwischen A({{a}} | {{b}}) und B({{c}} | {{d}})?
    answer:
      value: "{{(b + d) / 2}}"
    feedback:
      - when: numval(state.input) == (a + c) / 2
        misconception: wrong-component
        text: Das ist die x-Koordinate.
      - when: numval(state.input) == (d - b) / 2
        misconception: difference
        text: "Addieren, nicht abziehen: die Mitte ist der Durchschnitt."
    hints:
      - Die Mitte ist der Durchschnitt beider Punkte.
      - "({{b}} + {{d}}) : 2."
    explanation: "({{b}} + {{d}}) : 2 = {{(b + d) / 2}}."
    difficulty: 2
    variants:
      params:
        a: int[-8,8]
        b: int[-8,8]
        c: int[-8,8]
        d: int[-8,8]
      constraints:
        - b != d
        - a + c != b + d
        - b != 0
      defaults:
        a: 2
        b: 8
        c: 10
        d: -4

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Der Schwerpunkt eines Dreiecks ist $\frac{\vec a + \vec b + \vec c}{3}$. Welche y-Koordinate hat er für A(0 | 0), B(6 | 0) und C(3 | 9)?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 4.5
        misconception: half-height
        text: Das ist die halbe Höhe. Der Schwerpunkt liegt tiefer, bei einem Drittel.
    hints:
      - "Addiere die y-Werte: 0 + 0 + 9."
      - Teile durch 3.
    explanation: "9 : 3 = 3. Auf dieser Höhe balanciert ein Papierdreieck auf einer Nadelspitze."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Das **Skalarprodukt**: (2, 3) · (4, −1) = 2 · 4 + 3 · (−1). Was kommt heraus?"
    answer:
      value: 5
    hints:
      - Komponenten paarweise malnehmen, dann addieren.
    explanation: 8 − 3 = 5. Ist das Skalarprodukt null, stehen die Vektoren senkrecht aufeinander.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Welcher Vektor steht senkrecht auf (2, 3)?
    params:
      options:
        - label: (3, −2)
          correct: true
        - label: (3, 2)
          feedback: 2 · 3 + 3 · 2 = 12, nicht null.
        - label: (−2, −3)
          feedback: Das ist die Gegenrichtung, nicht senkrecht.
    hints:
      - Das Skalarprodukt muss null sein.
    explanation: 2 · 3 + 3 · (−2) = 0. Vertauschen und ein Vorzeichen drehen ergibt immer einen senkrechten Vektor.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Zwei Vektoren sind **linear abhängig**, wenn einer ein Vielfaches des anderen ist – sie sind parallel. Drei Punkte liegen genau dann auf einer Geraden, wenn die Pfeile von einem zu den beiden anderen abhängig sind.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Liegen A(1 | 1), B(3 | 5) und C(6 | 11) auf einer Geraden? Gib den Faktor k mit $\vec{AC} = k \cdot \vec{AB}$ an.
    answer:
      value: 2.5
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.4
        misconception: inverted
        text: "Andersherum: $\\vec{AC}$ ist das längere."
    hints:
      - $\vec{AB}$ = (2, 4), $\vec{AC}$ = (5, 10).
      - "5 : 2 und 10 : 4."
    explanation: Beide Komponenten ergeben 2,5. Also sind die Pfeile parallel, und A, B, C liegen auf einer Geraden.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was die Zahl t in $\vec a + t(\vec b - \vec a)$ bedeutet.
    params:
      keywords:
        - - anteil
          - bruchteil
          - wie weit
          - share
          - fraction
          - how far
        - - "null"
          - start
          - anfang
          - zero
          - begin
        - - eins
          - ende
          - ziel
          - one
          - end
      sample: t sagt, welchen Anteil des Wegs von A nach B man gegangen ist. Bei t gleich null steht man am Anfang A, bei t gleich eins am Ende B, bei 0,5 in der Mitte. Werte über eins gehen über B hinaus.
    explanation: t ist wie die Zeit einer gleichmäßigen Fahrt von A nach B. Negative t liegen vor A.
    difficulty: 3

srs:
  cards_from: [doppelt, minus]
