id: math.vectors.scale
type: concept
title: Strecken und umdrehen
summary: Vektor mal Zahl.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: doppelt
    widget: graph
    prompt: Der Pfeil zeigt nach A. Zieh P an die Spitze des doppelt so langen Pfeils.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 1, y: 2, draggable: false }
        - { id: P, x: 4, y: 1 }
      segments: [[O, A], [O, P]]
    answer: { points: { P: { x: 2, y: 4 } } }
    hints:
      - Beide Werte verdoppeln.
    explanation: 2 · (1, 2) = (2, 4) – gleiche Richtung, doppelte Länge.

  - kind: explain
    id: s2
    body: |
      Mal eine Zahl wird ein Vektor **gestreckt** oder gestaucht. Mal −1 zeigt er genau in die Gegenrichtung.

  - kind: problem
    id: drohne
    widget: numeric
    prompt: Eine Drohne fliegt pro Minute ({{a}}, {{b}}) Meter. Wie weit ist sie nach {{k}} Minuten nach rechts gekommen?
    params: { unit: m }
    answer: { value: "{{k * a}}" }
    hints:
      - "{{k}} · ({{a}}, {{b}}) – erst der x-Wert."
    explanation: "{{k}} · {{a}} = {{k * a}} m nach rechts und {{k * b}} m nach oben."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]", k: "int[3,8]" }
      defaults: { a: 4, b: 3, k: 5 }

  - kind: problem
    id: minus
    widget: choice
    prompt: Was macht −1 · (3, 2) mit dem Pfeil?
    params:
      options:
        - { label: Er zeigt genau in die Gegenrichtung., correct: true }
        - { label: Er wird kürzer., feedback: "Die Länge bleibt gleich." }
        - { label: Er dreht sich um 90°., feedback: "Er dreht sich um 180°." }
    hints:
      - Rechne aus – was ist −1 · (3, 2)?
    explanation: (−3, −2) – gleiche Länge, umgekehrte Richtung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Punkt P liegt auf einem Drittel des Wegs von A(0 | 0) nach B(9 | 6). Welche x-Koordinate hat P?
    answer:
      value: 3
    hints:
      - P = A + ⅓ · (B − A).
    explanation: ⅓ · (9, 6) = (3, 2). So berechnen Animationen Zwischenbilder.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Das **Skalarprodukt**: (2, 3) · (4, −1) = 2 · 4 + 3 · (−1). Was kommt heraus?"
    answer:
      value: 5
    hints:
      - Komponenten paarweise malnehmen, dann addieren.
    explanation: 8 − 3 = 5. Ist das Skalarprodukt null, stehen die Vektoren senkrecht aufeinander.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Welcher Vektor steht senkrecht auf (2, 3)?
    params:
      options:
        - label: (3, −2)
          correct: true
        - label: (3, 2)
          feedback: 2 · 3 + 3 · 2 = 12, nicht null.
        - label: (−2, −3)
          feedback: Das ist die Gegenrichtung, nicht senkrecht.
    hints:
      - Das Skalarprodukt muss null sein.
    explanation: 2 · 3 + 3 · (−2) = 0. Vertauschen und ein Vorzeichen drehen ergibt immer einen senkrechten Vektor.
    difficulty: 3

srs:
  cards_from: [doppelt, minus]
