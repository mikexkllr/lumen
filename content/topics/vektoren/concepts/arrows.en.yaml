id: math.vectors.arrows
type: concept
title: Arrows with direction
summary: What a vector is.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: “Walk 5 steps!” What is missing for you to know where you end up?
    params:
      options:
        - label: The direction
          correct: true
        - label: The time of day
          feedback: That does not change the goal.
        - label: Nothing
          feedback: You could end up anywhere on a circle.
    hints:
      - Which way should you go?
    explanation: Length and direction together – that is a vector.

  - kind: explain
    id: s1
    body: |
      A **vector** is an arrow. It says how far to go to the right and how far up. You write it as $\binom{3}{2}$, which means 3 to the right and 2 up.

  - kind: problem
    id: ziehen
    widget: graph
    prompt: Drag the tip P so the arrow points {{a}} to the right and {{b}} up.
    params:
      x: [-5, 5]
      y: [-5, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 1, y: 1 }
      segments: [[O, P]]
    answer: { points: { P: { x: "{{a}}", y: "{{b}}" } } }
    hints:
      - Negative values mean left or down.
    explanation: "The tip is at ({{a}} | {{b}})."
    variants:
      params: { a: "int[-4,4]", b: "int[-4,4]" }
      constraints: ["a != 0", "b != 0", "a != 1"]
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: ablesen
    widget: numeric
    prompt: An arrow goes from (1 | 2) to ({{1 + a}} | 5). How far does it go to the right?
    params: { placeholder: "x" }
    answer: { value: "{{a}}" }
    feedback:
      - when: "numval(state.input) == 1 + a"
        misconception: endpoint
        text: That is the endpoint. The question asks for the displacement, which is end minus start.
    hints:
      - End minus start.
    explanation: "{{1 + a}} − 1 = {{a}}."
    variants:
      params: { a: "int[2,8]" }
      defaults: { a: 5 }

  - kind: problem
    id: was-ist
    widget: buckets
    prompt: Vector or plain number?
    params:
      buckets: [{ label: Vector }, { label: Number }]
      items:
        - { label: 3 km to the northeast, bucket: Vector }
        - { label: Wind from the west at 20 km/h, bucket: Vector }
        - { label: One step to the left, bucket: Vector }
        - { label: "Temperature 21 °C", bucket: Number }
        - { label: Mass 5 kg, bucket: Number }
    hints:
      - Does a direction matter?
    explanation: As soon as a direction is part of it, it is a vector.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Wind velocity with direction
          right: true
        - text: Temperature
          right: false
        - text: Force
          right: true
        - text: Mass
          right: false
        - text: Displacement from A to B
          right: true
      left: Scalar
      right: Vector

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The vector from A(2, 5) to B(7, 1) has which y-component?
    answer:
      value: -4
    hints:
      - "Tip minus tail: 1 − 5."
    explanation: "The vector is (5, −4): 5 right, 4 down."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Two arrows have the same length and direction but start at different points. Are they different vectors?
    params:
      options:
        - label: No – a vector has no fixed position
          correct: true
        - label: Yes – the start point belongs to it
          feedback: The start point belongs to the **arrow**, not the vector.
        - label: Only if they are parallel
          feedback: They are parallel – and still the same vector.
    hints:
      - A vector only describes “how far and which way”.
    explanation: A vector is the whole class of equal arrows. That is why you may move it freely when adding.
    difficulty: 3

srs:
  cards_from: [ziehen, was-ist]
