id: math.vectors.arrows
type: concept
title: Arrows with direction
summary: What a vector is.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One arrow, two numbers
    body: "Satnavs, weather maps and games draw arrows all the time. Drag the tip P around. The coordinates show how far the arrow reaches to the right and up: **two numbers** for one arrow."
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -5
          - 5
        y:
          - -5
          - 5
        points:
          - id: O
            x: 0
            y: 0
            draggable: false
          - id: P
            x: 3
            y: 2
        segments:
          - - O
            - P

  - kind: problem
    id: hook
    widget: choice
    prompt: “Walk 5 steps!” What is missing for you to know where you end up?
    params:
      options:
        - label: The direction
          correct: true
        - label: The time of day
          feedback: That does not change the goal.
        - label: Nothing
          feedback: You could end up anywhere on a circle.
    hints:
      - Which way should you go?
    explanation: Length and direction together – that is a vector.

  - kind: explain
    id: s1
    body: |
      A **vector** is an arrow. It says how far to go to the right and how far up. You write it as $\binom{3}{2}$, which means 3 to the right and 2 up.

  - kind: problem
    id: ziehen
    widget: graph
    prompt: Drag the tip P so the arrow points {{a}} to the right and {{b}} up.
    params:
      x: [-5, 5]
      y: [-5, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 1, y: 1 }
      segments: [[O, P]]
    answer: { points: { P: { x: "{{a}}", y: "{{b}}" } } }
    hints:
      - Negative values mean left or down.
    explanation: "The tip is at ({{a}} | {{b}})."
    variants:
      params: { a: "int[-4,4]", b: "int[-4,4]" }
      constraints: ["a != 0", "b != 0", "a != 1"]
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: ablesen
    widget: numeric
    prompt: An arrow goes from (1 | 2) to ({{1 + a}} | 5). How far does it go to the right?
    params: { placeholder: "x" }
    answer: { value: "{{a}}" }
    feedback:
      - when: "numval(state.input) == 1 + a"
        misconception: endpoint
        text: That is the endpoint. The question asks for the displacement, which is end minus start.
    hints:
      - End minus start.
    explanation: "{{1 + a}} − 1 = {{a}}."
    variants:
      params: { a: "int[2,8]" }
      defaults: { a: 5 }

  - kind: problem
    id: was-ist
    widget: buckets
    prompt: Vector or plain number?
    params:
      buckets: [{ label: Vector }, { label: Number }]
      items:
        - { label: 3 km to the northeast, bucket: Vector }
        - { label: Wind from the west at 20 km/h, bucket: Vector }
        - { label: One step to the left, bucket: Vector }
        - { label: "Temperature 21 °C", bucket: Number }
        - { label: Mass 5 kg, bucket: Number }
    hints:
      - Does a direction matter?
    explanation: As soon as a direction is part of it, it is a vector.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Wind velocity with direction
          right: true
        - text: Temperature
          right: false
        - text: Force
          right: true
        - text: Mass
          right: false
        - text: Displacement from A to B
          right: true
      left: Scalar
      right: Vector

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The vector from A(2, 5) to B(7, 1) has which y-component?
    answer:
      value: -4
    hints:
      - "Tip minus tail: 1 − 5."
    explanation: "The vector is (5, −4): 5 right, 4 down."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "In space a vector has three **components**: right, back, up – for example (2, 5, −1). To a computer that is just a list of numbers. That is why there are also vectors with 100 or 1000 components."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: The arrow goes from A(1 | 2 | {{c}}) to B(4 | 0 | {{c + d}}). What is its third component?
    answer:
      value: "{{d}}"
    feedback:
      - when: numval(state.input) == -d
        misconception: tail-minus-tip
        text: "The other way round: tip minus tail, i.e. B minus A."
    hints:
      - Compute tip minus tail.
      - "{{c + d}} − ({{c}})."
    explanation: B − A = (3, −2, {{d}}).
    difficulty: 2
    variants:
      params:
        c: int[-5,5]
        d: int[-6,8]
      constraints:
        - d != 0
        - c != 0
      defaults:
        c: 3
        d: 4

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Two arrows have the same length and direction but start at different points. Are they different vectors?
    params:
      options:
        - label: No – a vector has no fixed position
          correct: true
        - label: Yes – the start point belongs to it
          feedback: The start point belongs to the **arrow**, not the vector.
        - label: Only if they are parallel
          feedback: They are parallel – and still the same vector.
    hints:
      - A vector only describes “how far and which way”.
    explanation: A vector is the whole class of equal arrows. That is why you may move it freely when adding.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Mathematicians call anything a vector that can be added and scaled by numbers. Polynomials $a + bx + cx^2$ also form such a **vector space**: their coefficients (a, b, c) are the components. So do sounds, images and functions."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: How many numbers do you need to pin down any polynomial of degree at most {{n}} – what is the dimension of this vector space?
    answer:
      value: "{{n + 1}}"
    feedback:
      - when: numval(state.input) == n
        misconception: forgot-constant
        text: The constant term $x^0$ counts too.
    hints:
      - "Count the powers: $x^0, x^1, \\dots, x^{ {{n}} }$."
      - Each power gets one coefficient.
    explanation: "{{n + 1}} coefficients, so dimension {{n + 1}}. The powers $1, x, x^2, \\dots$ are a basis – like the axis directions in space."
    difficulty: 3
    variants:
      params:
        n: int[2,9]
      defaults:
        n: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a vector have no fixed place?"
    params:
      keywords:
        - - richtung
          - direction
        - - länge
          - wie weit
          - length
          - how far
        - - verschieb
          - egal
          - überall
          - move
          - anywhere
          - shift
      sample: A vector only says how far and in which direction to go – not where to start. Two arrows of equal length and direction in different places are the same vector. You may shift it anywhere.
    explanation: A vector is a displacement, not a point. Only position vectors attach it to the origin.
    difficulty: 3

srs:
  cards_from: [ziehen, was-ist]
