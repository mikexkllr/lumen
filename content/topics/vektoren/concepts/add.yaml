id: math.vectors.add
type: concept
title: Pfeile aneinanderhängen
summary: Vektoren addieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: anhaengen
    widget: graph
    prompt: Der erste Pfeil endet bei A. Häng den Pfeil (1, 3) an A an und zieh P an seine Spitze.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 2, y: 1, draggable: false }
        - { id: P, x: 3, y: 1 }
      segments: [[O, A], [A, P]]
    answer: { points: { P: { x: 3, y: 4 } } }
    hints:
      - Von A aus 1 nach rechts und 3 nach oben.
    explanation: A + (1, 3) = (3 | 4).

  - kind: explain
    id: s2
    body: |
      Vektoren **addiert** man, indem man sie aneinanderhängt. Gerechnet heißt das – x-Werte addieren, y-Werte addieren.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: Was ist (2, 5) + (−1, 3)?
    params:
      options:
        - { label: "(1, 8)", correct: true }
        - { label: "(3, 8)", feedback: "2 + (−1) ist 1, nicht 3." }
        - { label: "(1, 2)", feedback: "5 + 3 ergibt 8." }
    hints:
      - Erst die ersten Zahlen, dann die zweiten.
    explanation: (2 − 1, 5 + 3) = (1, 8).

  - kind: problem
    id: boot
    widget: numeric
    body: Ein Boot fährt mit 4 m/s nach Osten. Die Strömung schiebt es mit 3 m/s nach Süden.
    prompt: Wie schnell ist das Boot insgesamt?
    params: { unit: m/s }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-lengths
        text: Die Pfeile zeigen in verschiedene Richtungen. Ihre Längen darf man nicht einfach addieren.
    hints:
      - Der Gesamtpfeil ist die schräge Seite eines rechtwinkligen Dreiecks.
    explanation: (4, −3) hat die Länge 5 – das Boot fährt schräg mit 5 m/s.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Vektoren addiert man [[komponentenweise]]: (2, 5) + (−1, 3) = ([[1]], [[8]])."
      distractors:
        - "3"
        - kreuzweise

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Flugzeug fliegt 300 km/h nach Norden. Der Wind weht mit 40 km/h aus Süden. Wie schnell ist es über Grund?
    params:
      unit: km/h
    answer:
      value: 340
    hints:
      - Wind aus Süden schiebt nach Norden.
    explanation: "Beide Vektoren zeigen in dieselbe Richtung: 300 + 40."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Schwimmer schwimmt 3 km/h quer zum Fluss, der mit 4 km/h strömt. Um wie viele Meter wird er abgetrieben, wenn der Fluss 60 m breit ist?
    params:
      unit: m
    answer:
      value: 80
    hints:
      - Quer und längs laufen unabhängig. Das Verhältnis ist 3 zu 4.
    explanation: "Für je 3 m quer geht es 4 m flussab: 60 · 4/3 = 80 m."
    difficulty: 3

srs:
  cards_from: [rechnen, boot]
