id: math.vectors.add
type: concept
title: Pfeile aneinanderhängen
summary: Vektoren addieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pfeile in Kette
    body: "Ein Boot im Fluss, ein Flugzeug im Wind: Zwei Bewegungen ergeben zusammen eine neue. Zieh A und B. Der Pfeil von O nach B ist die **Summe** beider Wege."
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -1
          - 7
        y:
          - -1
          - 6
        points:
          - id: O
            x: 0
            y: 0
            draggable: false
          - id: A
            x: 3
            y: 1
          - id: B
            x: 5
            y: 3
        segments:
          - - O
            - A
          - - A
            - B
          - - O
            - B

  - kind: problem
    id: anhaengen
    widget: graph
    prompt: Der erste Pfeil endet bei A. Häng den Pfeil (1, 3) an A an und zieh P an seine Spitze.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 2, y: 1, draggable: false }
        - { id: P, x: 3, y: 1 }
      segments: [[O, A], [A, P]]
    answer: { points: { P: { x: 3, y: 4 } } }
    hints:
      - Von A aus 1 nach rechts und 3 nach oben.
    explanation: A + (1, 3) = (3 | 4).

  - kind: explain
    id: s2
    body: |
      Vektoren **addiert** man, indem man sie aneinanderhängt. Gerechnet heißt das – x-Werte addieren, y-Werte addieren.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: Was ist (2, 5) + (−1, 3)?
    params:
      options:
        - { label: "(1, 8)", correct: true }
        - { label: "(3, 8)", feedback: "2 + (−1) ist 1, nicht 3." }
        - { label: "(1, 2)", feedback: "5 + 3 ergibt 8." }
    hints:
      - Erst die ersten Zahlen, dann die zweiten.
    explanation: (2 − 1, 5 + 3) = (1, 8).

  - kind: problem
    id: boot
    widget: numeric
    body: Ein Boot fährt mit 4 m/s nach Osten. Die Strömung schiebt es mit 3 m/s nach Süden.
    prompt: Wie schnell ist das Boot insgesamt?
    params: { unit: m/s }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-lengths
        text: Die Pfeile zeigen in verschiedene Richtungen. Ihre Längen darf man nicht einfach addieren.
    hints:
      - Der Gesamtpfeil ist die schräge Seite eines rechtwinkligen Dreiecks.
    explanation: (4, −3) hat die Länge 5 – das Boot fährt schräg mit 5 m/s.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Vektoren addiert man [[komponentenweise]]: (2, 5) + (−1, 3) = ([[1]], [[8]])."
      distractors:
        - "3"
        - kreuzweise

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Flugzeug fliegt 300 km/h nach Norden. Der Wind weht mit 40 km/h aus Süden. Wie schnell ist es über Grund?
    params:
      unit: km/h
    answer:
      value: 340
    hints:
      - Wind aus Süden schiebt nach Norden.
    explanation: "Beide Vektoren zeigen in dieselbe Richtung: 300 + 40."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Der Pfeil von A nach B ist der **Differenzvektor** $\\vec b - \\vec a$: Spitze minus Fuß. Denn wer erst $\\vec a$ geht und dann $\\vec b - \\vec a$, landet bei $\\vec b$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: graph
    prompt: Zieh D so, dass der Pfeil vom Nullpunkt nach D gleich $\vec b - \vec a$ ist.
    params:
      x:
        - -4
        - 5
      y:
        - -2
        - 5
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
        - id: A
          x: 3
          y: 1
          draggable: false
          label: a
        - id: B
          x: 1
          y: 3
          draggable: false
          label: b
        - id: D
          x: 2
          y: -1
      segments:
        - - O
          - A
        - - O
          - B
        - - O
          - D
    answer:
      points:
        D:
          x: -2
          y: 2
    hints:
      - "Rechne komponentenweise: (1 − 3, 3 − 1)."
      - Das ist (−2, 2).
    explanation: $\vec b - \vec a$ = (−2, 2). Das ist genau der Pfeil von A nach B, nur an den Nullpunkt verschoben.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: An einem Knoten ziehen drei Seile. Zwei Kräfte sind (3, 4) N und (−5, 1) N. Der Knoten bewegt sich nicht. Welche y-Komponente hat die dritte Kraft?
    params:
      unit: N
    answer:
      value: -5
    feedback:
      - when: numval(state.input) == 5
        misconception: no-negation
        text: Die dritte Kraft muss die Summe der beiden aufheben – also ihr Gegenteil sein.
    hints:
      - Im Gleichgewicht ist die Summe aller Kräfte null.
      - Die ersten zwei ergeben (−2, 5).
    explanation: "Dritte Kraft = −(−2, 5) = (2, −5). Statiker prüfen so jede Brücke: An jedem Knoten muss die Vektorsumme null sein."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Schwimmer schwimmt 3 km/h quer zum Fluss, der mit 4 km/h strömt. Um wie viele Meter wird er abgetrieben, wenn der Fluss 60 m breit ist?
    params:
      unit: m
    answer:
      value: 80
    hints:
      - Quer und längs laufen unabhängig. Das Verhältnis ist 3 zu 4.
    explanation: "Für je 3 m quer geht es 4 m flussab: 60 · 4/3 = 80 m."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Zwei nicht parallele Pfeile $\\vec u$ und $\\vec v$ bilden eine **Basis**: Jeder Vektor der Ebene ist genau eine Kombination $s\\,\\vec u + t\\,\\vec v$. Die Zahlen s und t sind seine Koordinaten in diesem schiefen Gitter."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Schreib (7, 4) als $s \cdot (1, 1) + t \cdot (1, -1)$. Wie groß ist s?
    answer:
      value: 5.5
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 1.5
        misconception: swapped
        text: Das ist t. s ist der Anteil von (1, 1).
    hints:
      - "Komponentenweise: s + t = 7 und s − t = 4."
      - Addiere beide Gleichungen.
    explanation: "2s = 11, also s = 5,5 und t = 1,5. Probe: (5,5 + 1,5, 5,5 − 1,5) = (7, 4)."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man aus den Punkten A und B den Pfeil von A nach B ausrechnet.
    params:
      keywords:
        - - minus
          - abziehen
          - differenz
          - subtract
          - difference
        - - spitze
          - ende
          - ziel
          - tip
          - end
          - target
        - - fuß
          - anfang
          - start
          - tail
      sample: Ich rechne Spitze minus Fuß, also B minus A, für jede Komponente einzeln. Denn wer vom Anfang A diesen Pfeil geht, kommt am Ende B an.
    explanation: $\vec{AB} = \vec b - \vec a$ – die Reihenfolge zählt, sonst zeigt der Pfeil in die Gegenrichtung.
    difficulty: 3

srs:
  cards_from: [rechnen, boot]
