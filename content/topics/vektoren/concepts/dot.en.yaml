id: math.vectors.dot
type: concept
title: "The dot product"
summary: "One number that tells how well two arrows fit together."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Tailwind or headwind
    body: A tailwind helps, a headwind slows you down, a crosswind does almost nothing. Turn the arrow round the circle. The number cos measures how strongly it pulls **to the right** – positive, zero or negative.
    visual:
      widget: sim
      interactive: true
      params:
        scene: unitcircle
        show:
          - cos

  - kind: problem
    id: c1
    widget: numeric
    prompt: You buy 3 apples and 2 loaves. An apple costs €1, a loaf €4. How much do you pay?
    params:
      unit: €
    answer:
      value: 11
    hints:
      - 3 · 1 + 2 · 4.
    explanation: "You just computed a dot product: amounts (3, 2) times prices (1, 4)."

  - kind: explain
    id: c2
    body: "The **dot product** turns two vectors into **one number**: multiply matching entries, then add everything. (3, 2) · (1, 4) = 3 · 1 + 2 · 4 = 11."

  - kind: problem
    id: c3
    widget: numeric
    prompt: "Work out: (2, 5) · (4, 1)."
    answer:
      value: 13
    hints:
      - 2 · 4 + 5 · 1.
    explanation: 8 + 5 = 13.

  - kind: problem
    id: c4
    widget: numeric
    prompt: "Work out: (3, 4) · (4, −3)."
    answer:
      value: 0
    hints:
      - 3 · 4 + 4 · (−3).
    explanation: 12 − 12 = 0. Zero is something special here.

  - kind: explain
    id: c5
    body: If the dot product is **zero**, the arrows are **perpendicular**. If it is positive, they point roughly the same way. If it is negative, they point rather against each other.

  - kind: problem
    id: c6
    widget: buckets
    prompt: What angle is between the arrows? Work out the dot product.
    params:
      buckets:
        - id: b1
          label: Acute (above 0)
        - id: b2
          label: Right angle (0)
        - id: b3
          label: Obtuse (below 0)
      items:
        - label: (1, 0) and (1, 1)
          bucket: b1
        - label: (1, 2) and (2, −1)
          bucket: b2
        - label: (1, 0) and (−1, 1)
          bucket: b3
        - label: (2, 3) and (3, −2)
          bucket: b2
        - label: (2, 1) and (1, 2)
          bucket: b1
    hints:
      - Multiply matching entries and add. Then look at the sign.
    explanation: The sign reveals the angle – without any protractor.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: The arrow has length 1. Its dot product with (1, 0) is exactly cos α. Turn it up and to the left until the dot product is −0.5.
    params:
      scene: unitcircle
    answer:
      cos: -0.5
      angle:
        - 90
        - 180
    hints:
      - Negative means the arrow points rather against (1, 0), so to the left.
      - Turn past 90° until cos drops to −0.5.
    explanation: (cos 120°, sin 120°) · (1, 0) = cos 120° = −0.5. The angle is more than 90°, so the product is negative.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What does a vector times itself give? Work out (3, 4) · (3, 4).
    answer:
      value: 25
    hints:
      - 3 · 3 + 4 · 4.
    explanation: 25 – the square of the length 5. The dot product contains Pythagoras’ theorem.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "For the angle: cos = dot product divided by both lengths. Take a = (1, 0) and b = (1, 1). The lengths are 1 and √2. What is the angle in degrees?"
    params:
      unit: °
    answer:
      value: 45
    hints:
      - cos = 1 ÷ √2 ≈ 0.707. Which angle has this cosine?
    explanation: 45° – b is the diagonal of a square.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: We have $\vec a \cdot \vec b = |\vec a|\,|\vec b| \cos\theta$. Dividing by $|\vec a|$ gives the length of the **shadow** of $\vec b$ on the direction of $\vec a$ – the projection.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: How long is the shadow of $\vec b$ = (2, 3) on the direction of $\vec a$ = (3, 4)? To one decimal.
    answer:
      value: 3.6
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 18
        misconception: no-normalise
        text: That is the dot product. Now divide by the length of (3, 4).
    hints:
      - "Dot product: 2 · 3 + 3 · 4 = 18."
      - The length of (3, 4) is 5.
    explanation: 18 / 5 = 3.6. Physics uses projections to split forces, such as the downhill force on a slope.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: What is cos θ for the angle between (3, 4) and (4, 3)? To two decimals.
    answer:
      value: 0.96
      tolerance: 0.005
    feedback:
      - when: numval(state.input) == 24
        misconception: no-normalise
        text: That is the dot product. Divide by both lengths.
    hints:
      - Dot product 12 + 12 = 24.
      - "Both lengths are 5: 24 / 25."
    explanation: cos θ = 24/25 = 0.96, so θ ≈ 16°. The arrows point almost the same way.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In physics work = force · path, as a dot product. The force is (10, 5) newtons, the path (4, 0) metres. How many joules of work is that?
    params:
      unit: J
    answer:
      value: 40
    hints:
      - 10 · 4 + 5 · 0.
    explanation: 40 J. Only the part of the force along the path counts – the rest does no work.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: AI search stores texts as vectors with hundreds of numbers. How does it measure whether two texts are similar?
    params:
      options:
        - label: With the dot product – as the cosine of the angle between the vectors
          correct: true
        - label: They count equal letters
          feedback: Then “hound” and “bound” would be almost the same.
        - label: They compare only the length
          feedback: The direction carries the meaning.
    hints:
      - Same direction means similar meaning.
    explanation: "**Cosine similarity**: 1 means same direction, 0 means nothing in common."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Tell Lux what the sign of the dot product reveals about two arrows.
    params:
      keywords:
        - - positiv
          - positive
          - größer
          - greater
        - - "null"
          - zero
          - senkrecht
          - perpendicular
        - - negativ
          - negative
          - entgegen
          - opposite
          - gegeneinander
          - against
      sample: If it is positive, the arrows point roughly the same way. At zero they are perpendicular. If it is negative, they point rather against each other.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Why is $\\frac{\\vec a \\cdot \\vec b}{|\\vec a|\\,|\\vec b|}$ never bigger than 1? That is the **Cauchy–Schwarz inequality**: $|\\vec a \\cdot \\vec b| \\le |\\vec a|\\,|\\vec b|$. It holds in every dimension – which is why we may speak of angles even in 1000 dimensions."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Two words have the meaning vectors (1, 2, 2) and (2, 1, 2). What is their cosine similarity? To two decimals.
    answer:
      value: 0.89
      tolerance: 0.005
    feedback:
      - when: numval(state.input) == 8
        misconception: no-normalise
        text: That is the dot product. Divide by both lengths.
    hints:
      - "Dot product: 2 + 2 + 4 = 8."
      - Both lengths are √9 = 3.
    explanation: 8 / 9 ≈ 0.89 – very similar. Language models compare vectors with hundreds of components this way.
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
