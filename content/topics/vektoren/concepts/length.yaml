id: math.vectors.length
type: concept
title: Wie lang ist der Pfeil?
summary: Pythagoras misst Vektoren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: drei-vier
    widget: numeric
    prompt: Ein Pfeil geht 3 nach rechts und 4 nach oben. Wie lang ist er?
    params: { placeholder: "Länge" }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-components
        text: Der Pfeil läuft schräg – das ist kürzer als erst 3 und dann 4.
    hints:
      - Der Pfeil ist die schräge Seite eines rechtwinkligen Dreiecks.
    explanation: "$\\sqrt{3^2 + 4^2} = \\sqrt{25} = 5$."

  - kind: explain
    id: s2
    body: |
      Die Länge eines Vektors kommt aus dem **Satz des Pythagoras**: $\sqrt{x^2 + y^2}$.

  - kind: problem
    id: skaliert
    widget: numeric
    prompt: Wie lang ist der Pfeil ({{3 * k}}, {{4 * k}})?
    params: { placeholder: "Länge" }
    answer: { value: "{{5 * k}}" }
    hints:
      - "Das ist {{k}}-mal der Pfeil (3, 4)."
    explanation: "{{k}} · 5 = {{5 * k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 3 }

  - kind: problem
    id: setzen
    widget: graph
    prompt: Setze P so, dass der Pfeil genau 5 lang ist und nach rechts oben zeigt.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 1, y: 1 }
      segments: [[O, P]]
    check: { predicate: "state.points.P.x > 0 && state.points.P.y > 0 && state.points.P.x * state.points.P.x + state.points.P.y * state.points.P.y == 25" }
    hints:
      - Denk an das Dreieck mit den Seiten 3, 4 und 5.
    explanation: (3 | 4) oder (4 | 3) – beide Pfeile sind genau 5 lang.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie lang ist der Vektor (1, 2, 2) im Raum?
    answer:
      value: 3
    hints:
      - √(1² + 2² + 2²).
    explanation: √9 = 3. Die Formel wächst mit jeder Dimension um ein Quadrat.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Ein Pfeil der Länge 1 soll gleich weit nach links wie nach oben zeigen. Dreh ihn dorthin.
    params:
      scene: unitcircle
    answer:
      angle: 135
    explanation: "Bei 135°: etwa (−0,71, 0,71). Probe: 0,71² + 0,71² ≈ 1."
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: Wie weit liegen die Punkte ({{a}} | {{b}}) und ({{a + 3 * k}} | {{b + 4 * k}}) auseinander?
    answer:
      value: "{{5 * k}}"
    feedback:
      - when: numval(state.input) == 7 * k
        misconception: manhattan
        text: Das ist der Weg entlang der Gitterlinien. Gefragt ist die Luftlinie.
    hints:
      - "Bilde den Differenzvektor: ({{3 * k}}, {{4 * k}})."
      - Seine Länge nach Pythagoras.
    explanation: √(({{3 * k}})² + ({{4 * k}})²) = {{5 * k}}. Der Abstand zweier Punkte ist die Länge ihres Differenzvektors.
    difficulty: 2
    variants:
      params:
        a: int[-5,5]
        b: int[-5,5]
        k: int[1,4]
      defaults:
        a: 1
        b: 2
        k: 1

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Ein Raum ist 3 m breit, 4 m lang und 12 m hoch. Wie lang ist die Raumdiagonale von einer unteren Ecke zur gegenüberliegenden oberen?
    params:
      unit: m
    answer:
      value: 13
    feedback:
      - when: numval(state.input) == 5
        misconception: floor-only
        text: Das ist nur die Bodendiagonale. Die Höhe kommt noch dazu.
    hints:
      - "Erst die Bodendiagonale: √(3² + 4²) = 5."
      - Dann √(5² + 12²).
    explanation: √(9 + 16 + 144) = √169 = 13 m. Im Raum gilt einfach $\sqrt{x^2 + y^2 + z^2}$.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein **Einheitsvektor** hat die Länge 1. Du teilst (3, 4) durch seine Länge. Welche x-Komponente hat das Ergebnis?
    answer:
      value: 0.6
    hints:
      - Die Länge ist 5.
    explanation: (0,6 | 0,8) zeigt in dieselbe Richtung, hat aber Länge 1. Das heißt **Normieren**.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "In einer Stadt mit Straßengitter läuft man nicht Luftlinie. Dort misst der **Manhattan-Abstand** |x| + |y|. Beides sind Normen: Sie sind nie negativ, strecken sich mit und erfüllen die Dreiecksungleichung."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Ein Taxi fährt in Manhattan von (0 | 0) nach (3 | 4), nur entlang der Straßen. Wie lang ist der kürzeste Weg in Blocks?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 5
        misconception: euclid
        text: Das ist die Luftlinie. Das Taxi kann nicht durch Häuser fahren.
    hints:
      - Wie viele Blocks nach rechts, wie viele nach oben?
      - 3 + 4.
    explanation: 3 + 4 = 7 Blocks. Und es gibt $\binom{7}{3} = 35$ solcher kürzesten Wege.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Wie sieht ein »Kreis« im Manhattan-Abstand aus – alle Punkte mit Abstand 1 vom Nullpunkt?
    params:
      options:
        - label: Ein auf der Spitze stehendes Quadrat
          correct: true
        - label: Ein normaler Kreis
          feedback: "Prüf (0,5 | 0,5): Luftlinie 0,71, Manhattan genau 1."
        - label: Ein Kreuz
          feedback: Auch Punkte wie (0,5 | 0,5) haben Abstand 1.
    hints:
      - "Probiere Punkte: (1 | 0), (0 | 1), (0,5 | 0,5)."
      - "|x| + |y| = 1 ist im ersten Viertel die Gerade y = 1 − x."
    explanation: "Vier Geradenstücke durch (1 | 0), (0 | 1), (−1 | 0) und (0 | −1): eine Raute. Was »rund« ist, hängt davon ab, wie man misst."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Länge des Vektors (3, 4) genau 5 ist.
    params:
      keywords:
        - - pythagoras
          - rechtwinklig
          - right triangle
        - - quadrat
          - hoch zwei
          - square
          - "25"
        - - wurzel
          - square root
          - root
      sample: Der Pfeil ist die Hypotenuse eines rechtwinkligen Dreiecks mit den Katheten 3 und 4. Nach Pythagoras ist seine Länge die Wurzel aus 3² + 4² = 25, also 5.
    explanation: Komponenten sind Katheten, die Länge ist die Hypotenuse. Im Raum kommt einfach ein drittes Quadrat dazu.
    difficulty: 3

srs:
  cards_from: [drei-vier, skaliert]
