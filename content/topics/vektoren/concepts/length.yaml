id: math.vectors.length
type: concept
title: Wie lang ist der Pfeil?
summary: Pythagoras misst Vektoren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: drei-vier
    widget: numeric
    prompt: Ein Pfeil geht 3 nach rechts und 4 nach oben. Wie lang ist er?
    params: { placeholder: "Länge" }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-components
        text: Der Pfeil läuft schräg – das ist kürzer als erst 3 und dann 4.
    hints:
      - Der Pfeil ist die schräge Seite eines rechtwinkligen Dreiecks.
    explanation: "$\\sqrt{3^2 + 4^2} = \\sqrt{25} = 5$."

  - kind: explain
    body: |
      Die Länge eines Vektors kommt aus dem Satz des Pythagoras: $\sqrt{x^2 + y^2}$.

  - kind: problem
    id: skaliert
    widget: numeric
    prompt: Wie lang ist der Pfeil ({{3 * k}}, {{4 * k}})?
    params: { placeholder: "Länge" }
    answer: { value: "{{5 * k}}" }
    hints:
      - "Das ist {{k}}-mal der Pfeil (3, 4)."
    explanation: "{{k}} · 5 = {{5 * k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 3 }

  - kind: problem
    id: setzen
    widget: graph
    prompt: Setze P so, dass der Pfeil genau 5 lang ist und nach rechts oben zeigt.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 1, y: 1 }
      segments: [[O, P]]
    check: { predicate: "state.points.P.x > 0 && state.points.P.y > 0 && state.points.P.x * state.points.P.x + state.points.P.y * state.points.P.y == 25" }
    hints:
      - Denk an das Dreieck mit den Seiten 3, 4 und 5.
    explanation: (3 | 4) oder (4 | 3) – beide Pfeile sind genau 5 lang.

srs:
  cards_from: [drei-vier, skaliert]
