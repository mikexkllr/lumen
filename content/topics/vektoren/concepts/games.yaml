id: math.vectors.games
type: concept
title: Bewegung in Spielen
summary: Position plus Geschwindigkeit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: Eine Spielfigur steht auf Feld 10. In jedem Bild läuft sie 3 Felder weiter. Wo steht sie nach 4 Bildern?
    answer:
      value: 22
    hints:
      - 10 + 4 · 3.
    explanation: Ort plus Tempo mal Zeit. So bewegt sich jede Spielfigur.

  - kind: explain
    id: s1
    body: |
      In Spielen hat jede Figur eine **Position** und eine **Geschwindigkeit** – beides Vektoren. In jedem Bild gilt: neue Position = alte Position + Geschwindigkeit.

  - kind: problem
    id: raumschiff
    widget: numeric
    prompt: Ein Raumschiff steht bei (10 | 5) und fliegt pro Bild (2, −1). Welchen x-Wert hat es nach {{n}} Bildern?
    params: { placeholder: "x" }
    answer: { value: "{{10 + 2 * n}}" }
    hints:
      - "Pro Bild 2 nach rechts – {{n}}-mal."
    explanation: "10 + {{n}} · 2 = {{10 + 2 * n}}."
    variants:
      params: { n: "int[3,12]" }
      defaults: { n: 4 }

  - kind: problem
    id: schleife
    widget: order
    prompt: Bring die Schritte eines Spielbilds in die richtige Reihenfolge.
    params:
      items:
        - { label: Eingaben lesen }
        - { label: Geschwindigkeit anpassen }
        - { label: Position + Geschwindigkeit }
        - { label: Bild zeichnen }
    hints:
      - Erst wissen, was der Spieler will, zuletzt anzeigen.
    explanation: Das passiert 60-mal pro Sekunde – die **Spielschleife**.

  - kind: problem
    id: wurf
    widget: choice
    prompt: Jedes Bild kommt (0, −1) zur Geschwindigkeit eines Balls dazu. Welche Bahn fliegt er?
    params:
      options:
        - { label: Eine Parabel, correct: true }
        - { label: Eine gerade Linie, feedback: "Die Geschwindigkeit ändert sich jedes Bild – die Bahn krümmt sich." }
        - { label: Einen Kreis, feedback: "Dafür müsste die Kraft immer zur Mitte zeigen." }
    hints:
      - Die Schwerkraft zieht immer gleich stark nach unten.
    explanation: So simulieren fast alle Spiele die Schwerkraft – mit einer Vektor-Addition pro Bild.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Ball startet bei (0 | 0) mit Geschwindigkeit (3, 4). Jedes Bild kommt (0, −1) zur Geschwindigkeit dazu. Welche y-Koordinate hat er nach 3 Bildern?
    answer:
      value: 9
    hints:
      - "Bewege erst, ändere dann die Geschwindigkeit: 4, dann 3, dann 2."
    explanation: 4 + 3 + 2 = 9. Dieses schrittweise Rechnen heißt **Euler-Verfahren**.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Ein Spiel rechnet in jedem Bild zwei Zeilen: Geschwindigkeit plus Beschleunigung, dann Position plus Geschwindigkeit. Diese **Physik-Schleife** läuft 60-mal pro Sekunde. Reibung heißt einfach: Geschwindigkeit mal 0,9."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Ein Puck gleitet mit (10, 0) pro Bild. Reibung nimmt seine Geschwindigkeit jedes Bild mal 0,9. Wie groß ist die x-Komponente nach 2 Bildern?
    answer:
      value: 8.1
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 8
        misconception: linear-friction
        text: Reibung zieht nicht immer 1 ab – sie nimmt mal 0,9.
    hints:
      - "Nach einem Bild: 10 · 0,9 = 9."
      - "Nach zwei Bildern: 9 · 0,9."
    explanation: 10 · 0,9² = 8,1. Die Geschwindigkeit nimmt exponentiell ab – der Puck wird nie ganz null, nur winzig.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Zwei Kugeln im Spiel haben die Radien 2 und 3. Ihre Mitten liegen bei (1 | 1) und (5 | 4). Wie weit sind die Mitten voneinander entfernt?
    answer:
      value: 5
    hints:
      - "Differenzvektor: (4, 3)."
      - Länge √(16 + 9).
    explanation: "Abstand 5 = 2 + 3: Die Kugeln berühren sich gerade. So prüft ein Spiel jede Kollision: Abstand kleiner als die Summe der Radien?"
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Ball trifft auf eine waagerechte Wand. Wie berechnet ein Spiel den Abprall?
    params:
      options:
        - label: Es dreht das Vorzeichen der y-Komponente der Geschwindigkeit um
          correct: true
        - label: Es dreht beide Vorzeichen um
          feedback: Dann flöge der Ball genau zurück, statt abzuprallen.
        - label: Es setzt die Geschwindigkeit auf null
          feedback: Dann bliebe der Ball kleben.
    hints:
      - Die Bewegung entlang der Wand bleibt erhalten.
    explanation: "Aus (vx, vy) wird (vx, −vy): Einfallswinkel gleich Ausfallswinkel."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie bewegt ein Computerspiel eine Figur mit Vektoren?"
    params:
      keywords:
        - - position
          - ort
          - place
        - - geschwindigkeit
          - velocity
          - speed
        - - addier
          - plus
          - dazu
          - add
        - - bild
          - frame
          - schritt
          - step
      min: 3
      sample: Jede Figur hat eine Position und eine Geschwindigkeit. In jedem Bild wird die Geschwindigkeit zur Position addiert – so entsteht die Bewegung.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Für einen Abprall an einer schrägen Wand braucht man ihre **Normale** n, einen Pfeil der Länge 1 senkrecht zur Wand. Dann gilt $\vec v\,' = \vec v - 2\,(\vec v \cdot \vec n)\,\vec n$. Nur der Teil senkrecht zur Wand dreht sich um.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Ein Ball fliegt mit $\vec v$ = (3, −4) auf den Boden mit der Normalen $\vec n$ = (0, 1). Welche y-Komponente hat er nach dem Abprall?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == -4
        misconception: no-flip
        text: Ohne Abprall bliebe es −4. Der senkrechte Teil dreht sich um.
    hints:
      - $\vec v \cdot \vec n = -4$.
      - (3, −4) − 2 · (−4) · (0, 1).
    explanation: (3, −4) + (0, 8) = (3, 4). Am Boden ist das einfach »y umdrehen« – die Formel funktioniert aber für jede Wand.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Jetzt eine schräge Wand mit $\vec n = \frac{1}{\sqrt2}(1, 1)$. Der Ball kommt mit (−2, 0). Welche y-Komponente hat er nach dem Abprall?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: axis-only
        text: Bei einer schrägen Wand ändert sich auch die y-Richtung.
    hints:
      - $\vec v \cdot \vec n = -\frac{2}{\sqrt2} = -\sqrt2$.
      - $-2 \cdot (-\sqrt2) \cdot \frac{1}{\sqrt2}(1, 1) = (2, 2)$.
    explanation: (−2, 0) + (2, 2) = (0, 2). Der Ball kam von rechts und fliegt nach dem 45°-Abprall senkrecht hoch.
    difficulty: 3

srs:
  cards_from: [raumschiff, wurf]
