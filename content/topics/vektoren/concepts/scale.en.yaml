id: math.vectors.scale
type: concept
title: Stretching and flipping
summary: Vector times number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: doppelt
    widget: graph
    prompt: The arrow points to A. Drag P to the tip of the arrow that is twice as long.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 1, y: 2, draggable: false }
        - { id: P, x: 4, y: 1 }
      segments: [[O, A], [O, P]]
    answer: { points: { P: { x: 2, y: 4 } } }
    hints:
      - Double both values.
    explanation: 2 · (1, 2) = (2, 4). Same direction, double the length.

  - kind: explain
    body: |
      Multiplying by a number **stretches** or shrinks a vector. Multiplying by −1 makes it point in exactly the opposite direction.

  - kind: problem
    id: drohne
    widget: numeric
    prompt: A drone flies ({{a}}, {{b}}) meters per minute. How far to the right has it come after {{k}} minutes?
    params: { unit: m }
    answer: { value: "{{k * a}}" }
    hints:
      - "{{k}} · ({{a}}, {{b}}). Start with the x-value."
    explanation: "{{k}} · {{a}} = {{k * a}} m to the right and {{k * b}} m up."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]", k: "int[3,8]" }
      defaults: { a: 4, b: 3, k: 5 }

  - kind: problem
    id: minus
    widget: choice
    prompt: What does −1 · (3, 2) do to the arrow?
    params:
      options:
        - { label: It points in exactly the opposite direction., correct: true }
        - { label: It gets shorter., feedback: "The length stays the same." }
        - { label: It turns by 90°., feedback: "It turns by 180°." }
    hints:
      - Work it out. What is −1 · (3, 2)?
    explanation: (−3, −2), which has the same length and the opposite direction.

srs:
  cards_from: [doppelt, minus]
