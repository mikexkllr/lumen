id: math.vectors.scale
type: concept
title: Stretching and flipping
summary: Vector times number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Longer, shorter, reversed
    body: "A zoom on your phone, reverse gear, a drone at half speed: here an arrow is **multiplied** by a number. Uncover the cards and find out what each number does to the arrow."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🔍
            front: Times 2
            back: The zoom makes every arrow in the picture twice as long – the direction stays.
          - icon: 🐢
            front: Times ½
            back: The drone flies the same way, but covers only half the distance per minute.
          - icon: 🔙
            front: Times −1
            back: In reverse the car goes just as fast – only the other way.
          - icon: 🫥
            front: Times 0
            back: The arrow shrinks to a point. It no longer has a direction.

  - kind: problem
    id: doppelt
    widget: graph
    prompt: The arrow points to A. Drag P to the tip of the arrow that is twice as long.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 1, y: 2, draggable: false }
        - { id: P, x: 4, y: 1 }
      segments: [[O, A], [O, P]]
    answer: { points: { P: { x: 2, y: 4 } } }
    hints:
      - Double both values.
    explanation: 2 · (1, 2) = (2, 4). Same direction, double the length.

  - kind: explain
    id: s2
    body: |
      Multiplying by a number **stretches** or shrinks a vector. Multiplying by −1 makes it point in exactly the opposite direction.

  - kind: problem
    id: drohne
    widget: numeric
    prompt: A drone flies ({{a}}, {{b}}) meters per minute. How far to the right has it come after {{k}} minutes?
    params: { unit: m }
    answer: { value: "{{k * a}}" }
    hints:
      - "{{k}} · ({{a}}, {{b}}). Start with the x-value."
    explanation: "{{k}} · {{a}} = {{k * a}} m to the right and {{k * b}} m up."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]", k: "int[3,8]" }
      defaults: { a: 4, b: 3, k: 5 }

  - kind: problem
    id: minus
    widget: choice
    prompt: What does −1 · (3, 2) do to the arrow?
    params:
      options:
        - { label: It points in exactly the opposite direction., correct: true }
        - { label: It gets shorter., feedback: "The length stays the same." }
        - { label: It turns by 90°., feedback: "It turns by 180°." }
    hints:
      - Work it out. What is −1 · (3, 2)?
    explanation: (−3, −2), which has the same length and the opposite direction.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Point P lies one third of the way from A(0, 0) to B(9, 6). What is the x-coordinate of P?
    answer:
      value: 3
    hints:
      - P = A + ⅓ · (B − A).
    explanation: ⅓ · (9, 6) = (3, 2). This is how animations compute in-between frames.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: The point $\vec a + t \cdot (\vec b - \vec a)$ moves from A to B as t goes from 0 to 1. At t = ½ it is the midpoint $\frac{\vec a + \vec b}{2}$. This **parametric form** describes every line – and every animation in games.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: What is the y-coordinate of the midpoint between A({{a}} | {{b}}) and B({{c}} | {{d}})?
    answer:
      value: "{{(b + d) / 2}}"
    feedback:
      - when: numval(state.input) == (a + c) / 2
        misconception: wrong-component
        text: That is the x-coordinate.
      - when: numval(state.input) == (d - b) / 2
        misconception: difference
        text: "Add, do not subtract: the midpoint is the average."
    hints:
      - The midpoint is the average of both points.
      - ({{b}} + {{d}}) / 2.
    explanation: ({{b}} + {{d}}) / 2 = {{(b + d) / 2}}.
    difficulty: 2
    variants:
      params:
        a: int[-8,8]
        b: int[-8,8]
        c: int[-8,8]
        d: int[-8,8]
      constraints:
        - b != d
        - a + c != b + d
        - b != 0
      defaults:
        a: 2
        b: 8
        c: 10
        d: -4

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: The centroid of a triangle is $\frac{\vec a + \vec b + \vec c}{3}$. What is its y-coordinate for A(0 | 0), B(6 | 0) and C(3 | 9)?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 4.5
        misconception: half-height
        text: That is half the height. The centroid lies lower, at one third.
    hints:
      - "Add the y-values: 0 + 0 + 9."
      - Divide by 3.
    explanation: 9 / 3 = 3. At this height a paper triangle balances on a pin.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The **dot product**: (2, 3) · (4, −1) = 2 · 4 + 3 · (−1). What is the result?"
    answer:
      value: 5
    hints:
      - Multiply components pairwise, then add.
    explanation: 8 − 3 = 5. If the dot product is zero, the vectors are perpendicular.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Which vector is perpendicular to (2, 3)?
    params:
      options:
        - label: (3, −2)
          correct: true
        - label: (3, 2)
          feedback: 2 · 3 + 3 · 2 = 12, not zero.
        - label: (−2, −3)
          feedback: That is the opposite direction, not perpendicular.
    hints:
      - The dot product must be zero.
    explanation: 2 · 3 + 3 · (−2) = 0. Swapping and flipping one sign always gives a perpendicular vector.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Two vectors are **linearly dependent** if one is a multiple of the other – they are parallel. Three points lie on one line exactly when the arrows from one to the other two are dependent.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Do A(1 | 1), B(3 | 5) and C(6 | 11) lie on one line? Give the factor k with $\vec{AC} = k \cdot \vec{AB}$.
    answer:
      value: 2.5
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.4
        misconception: inverted
        text: "The other way round: $\\vec{AC}$ is the longer one."
    hints:
      - $\vec{AB}$ = (2, 4), $\vec{AC}$ = (5, 10).
      - 5 / 2 and 10 / 4.
    explanation: Both components give 2.5. So the arrows are parallel and A, B, C lie on one line.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux what the number t means in $\vec a + t(\vec b - \vec a)$.
    params:
      keywords:
        - - anteil
          - bruchteil
          - wie weit
          - share
          - fraction
          - how far
        - - "null"
          - start
          - anfang
          - zero
          - begin
        - - eins
          - ende
          - ziel
          - one
          - end
      sample: t says what share of the way from A to B you have walked. At t equal to zero you are at the start A, at one at the end B, at 0.5 in the middle. Values above one go past B.
    explanation: t is like the time of an even trip from A to B. Negative t lie before A.
    difficulty: 3

srs:
  cards_from: [doppelt, minus]
