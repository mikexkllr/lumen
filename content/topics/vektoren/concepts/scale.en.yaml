id: math.vectors.scale
type: concept
title: Stretching and flipping
summary: Vector times number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: doppelt
    widget: graph
    prompt: The arrow points to A. Drag P to the tip of the arrow that is twice as long.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 1, y: 2, draggable: false }
        - { id: P, x: 4, y: 1 }
      segments: [[O, A], [O, P]]
    answer: { points: { P: { x: 2, y: 4 } } }
    hints:
      - Double both values.
    explanation: 2 · (1, 2) = (2, 4). Same direction, double the length.

  - kind: explain
    id: s2
    body: |
      Multiplying by a number **stretches** or shrinks a vector. Multiplying by −1 makes it point in exactly the opposite direction.

  - kind: problem
    id: drohne
    widget: numeric
    prompt: A drone flies ({{a}}, {{b}}) meters per minute. How far to the right has it come after {{k}} minutes?
    params: { unit: m }
    answer: { value: "{{k * a}}" }
    hints:
      - "{{k}} · ({{a}}, {{b}}). Start with the x-value."
    explanation: "{{k}} · {{a}} = {{k * a}} m to the right and {{k * b}} m up."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]", k: "int[3,8]" }
      defaults: { a: 4, b: 3, k: 5 }

  - kind: problem
    id: minus
    widget: choice
    prompt: What does −1 · (3, 2) do to the arrow?
    params:
      options:
        - { label: It points in exactly the opposite direction., correct: true }
        - { label: It gets shorter., feedback: "The length stays the same." }
        - { label: It turns by 90°., feedback: "It turns by 180°." }
    hints:
      - Work it out. What is −1 · (3, 2)?
    explanation: (−3, −2), which has the same length and the opposite direction.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Point P lies one third of the way from A(0, 0) to B(9, 6). What is the x-coordinate of P?
    answer:
      value: 3
    hints:
      - P = A + ⅓ · (B − A).
    explanation: ⅓ · (9, 6) = (3, 2). This is how animations compute in-between frames.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The **dot product**: (2, 3) · (4, −1) = 2 · 4 + 3 · (−1). What is the result?"
    answer:
      value: 5
    hints:
      - Multiply components pairwise, then add.
    explanation: 8 − 3 = 5. If the dot product is zero, the vectors are perpendicular.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Which vector is perpendicular to (2, 3)?
    params:
      options:
        - label: (3, −2)
          correct: true
        - label: (3, 2)
          feedback: 2 · 3 + 3 · 2 = 12, not zero.
        - label: (−2, −3)
          feedback: That is the opposite direction, not perpendicular.
    hints:
      - The dot product must be zero.
    explanation: 2 · 3 + 3 · (−2) = 0. Swapping and flipping one sign always gives a perpendicular vector.
    difficulty: 3

srs:
  cards_from: [doppelt, minus]
