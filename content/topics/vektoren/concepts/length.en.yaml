id: math.vectors.length
type: concept
title: How long is the arrow?
summary: Pythagoras measures vectors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: drei-vier
    widget: numeric
    prompt: An arrow goes 3 to the right and 4 up. How long is it?
    params: { placeholder: "Length" }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-components
        text: The arrow runs diagonally, which is shorter than going 3 and then 4.
    hints:
      - The arrow is the slanted side of a right triangle.
    explanation: "$\\sqrt{3^2 + 4^2} = \\sqrt{25} = 5$."

  - kind: explain
    id: s2
    body: |
      The length of a vector comes from the Pythagorean theorem: $\sqrt{x^2 + y^2}$.

  - kind: problem
    id: skaliert
    widget: numeric
    prompt: How long is the arrow ({{3 * k}}, {{4 * k}})?
    params: { placeholder: "Length" }
    answer: { value: "{{5 * k}}" }
    hints:
      - "That is the arrow (3, 4) times {{k}}."
    explanation: "{{k}} · 5 = {{5 * k}}."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 3 }

  - kind: problem
    id: setzen
    widget: graph
    prompt: Place P so that the arrow is exactly 5 long and points up and to the right.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 1, y: 1 }
      segments: [[O, P]]
    check: { predicate: "state.points.P.x > 0 && state.points.P.y > 0 && state.points.P.x * state.points.P.x + state.points.P.y * state.points.P.y == 25" }
    hints:
      - Think of the triangle with sides 3, 4 and 5.
    explanation: (3 | 4) or (4 | 3). Both arrows are exactly 5 long.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How long is the vector (1, 2, 2) in space?
    answer:
      value: 3
    hints:
      - √(1² + 2² + 2²).
    explanation: √9 = 3. The formula gains one square with each dimension.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A **unit vector** has length 1. You divide (3, 4) by its length. What is the x-component of the result?
    answer:
      value: 0.6
    hints:
      - The length is 5.
    explanation: (0.6, 0.8) points the same way but has length 1. This is called **normalising**.
    difficulty: 3

srs:
  cards_from: [drei-vier, skaliert]
