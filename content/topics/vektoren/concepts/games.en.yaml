id: math.vectors.games
type: concept
title: Movement in games
summary: Position plus velocity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Physics in the game
    body: In games, balls, birds and rockets fly along realistic paths. Behind it is a simple sum with **vectors**, frame by frame. Set the angle and speed and see how far the throw goes.
    visual:
      widget: sim
      interactive: true
      params:
        scene: projectile

  - kind: problem
    id: hook
    widget: numeric
    prompt: A game figure stands on square 10. In each frame it moves 3 squares on. Where is it after 4 frames?
    answer:
      value: 22
    hints:
      - 10 + 4 · 3.
    explanation: Place plus speed times time. That is how every game figure moves.

  - kind: explain
    id: s1
    body: |
      In games, every character has a **position** and a **velocity**. Both are vectors. Each frame, you add the velocity to the position.

  - kind: problem
    id: raumschiff
    widget: numeric
    prompt: A spaceship is at (10 | 5) and flies (2, −1) per frame. What is its x-value after {{n}} frames?
    params: { placeholder: "x" }
    answer: { value: "{{10 + 2 * n}}" }
    hints:
      - "2 to the right per frame, {{n}} times."
    explanation: "10 + {{n}} · 2 = {{10 + 2 * n}}."
    variants:
      params: { n: "int[3,12]" }
      defaults: { n: 4 }

  - kind: problem
    id: schleife
    widget: order
    prompt: Put the steps of one game frame in the right order.
    params:
      items:
        - { label: Read input }
        - { label: Adjust velocity }
        - { label: Position + velocity }
        - { label: Draw the frame }
    hints:
      - First learn what the player wants, and show it last.
    explanation: This happens 60 times per second. It is called the **game loop**.

  - kind: problem
    id: wurf
    widget: choice
    prompt: Each frame, (0, −1) is added to a ball's velocity. What path does it fly?
    params:
      options:
        - { label: A parabola, correct: true }
        - { label: A straight line, feedback: "The velocity changes every frame, so the path curves." }
        - { label: A circle, feedback: "For that, the force would have to always point to the center." }
    hints:
      - Gravity always pulls down with the same strength.
    explanation: This is how almost all games simulate gravity, with one vector addition per frame.

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: A spaceship is at S (1, 1) and moves (2, 1) per frame. Drag P to its position after 2 frames.
    params:
      x:
        - -1
        - 7
      y:
        - -1
        - 5
      points:
        - id: S
          x: 1
          y: 1
          draggable: false
        - id: P
          x: 1
          y: 4
      segments:
        - - S
          - P
    answer:
      points:
        P:
          x: 5
          y: 3
    hints:
      - Every frame adds (2, 1) to the position – twice here.
      - "x: 1 + 2 + 2, y: 1 + 1 + 1."
    explanation: (1, 1) + 2 · (2, 1) = (5, 3). New position = old position + velocity, twice in a row.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A ball starts at (0, 0) with velocity (3, 4). Each frame (0, −1) is added to the velocity. What is its y-coordinate after 3 frames?
    answer:
      value: 9
    hints:
      - "Move first, then change the velocity: 4, then 3, then 2."
    explanation: 4 + 3 + 2 = 9. This step-by-step method is called the **Euler method**.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Each frame a game does two sums. Speed plus push gives the new speed. Place plus speed gives the new place. This **physics loop** runs 60 times a second. Friction just means: speed times 0.9."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: A puck slides at (10, 0) per frame. Friction multiplies its velocity by 0.9 each frame. What is the x-component after 2 frames?
    answer:
      value: 8.1
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 8
        misconception: linear-friction
        text: Friction does not subtract 1 each time – it multiplies by 0.9.
    hints:
      - "After one frame: 10 · 0.9 = 9."
      - "After two frames: 9 · 0.9."
    explanation: 10 · 0.9² = 8.1. The speed decreases exponentially – the puck never quite reaches zero, it just gets tiny.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Two balls in a game have radii 2 and 3. Their centres are at (1 | 1) and (5 | 4). How far apart are the centres?
    answer:
      value: 5
    hints:
      - "Difference vector: (4, 3)."
      - Length √(16 + 9).
    explanation: "Distance 5 = 2 + 3: the balls just touch. That is how a game checks every collision: is the distance less than the sum of the radii?"
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A ball hits a horizontal wall. How does a game compute the bounce?
    params:
      options:
        - label: It flips the sign of the y-component of the velocity
          correct: true
        - label: It flips both signs
          feedback: Then the ball would fly straight back instead of bouncing.
        - label: It sets the velocity to zero
          feedback: Then the ball would stick.
    hints:
      - The motion along the wall is preserved.
    explanation: "(vx, vy) becomes (vx, −vy): angle of incidence equals angle of reflection."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: how does a video game move a character with vectors?"
    params:
      keywords:
        - - position
          - ort
          - place
        - - geschwindigkeit
          - velocity
          - speed
        - - addier
          - plus
          - dazu
          - add
        - - bild
          - frame
          - schritt
          - step
      min: 3
      sample: Every character has a position and a velocity. In each frame the velocity is added to the position – that creates the motion.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: For a bounce off a slanted wall you need its **normal** n, an arrow of length 1 perpendicular to the wall. Then $\vec v\,' = \vec v - 2\,(\vec v \cdot \vec n)\,\vec n$. Only the part perpendicular to the wall flips.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: A ball flies with $\vec v$ = (3, −4) onto the floor with normal $\vec n$ = (0, 1). What is its y-component after the bounce?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == -4
        misconception: no-flip
        text: Without bouncing it would stay −4. The perpendicular part flips.
    hints:
      - $\vec v \cdot \vec n = -4$.
      - (3, −4) − 2 · (−4) · (0, 1).
    explanation: (3, −4) + (0, 8) = (3, 4). On the floor that is just »flip y« – but the formula works for any wall.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Now a slanted wall with $\vec n = \frac{1}{\sqrt2}(1, 1)$. The ball comes in at (−2, 0). What is its y-component after the bounce?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: axis-only
        text: With a slanted wall the y-direction changes too.
    hints:
      - $\vec v \cdot \vec n = -\frac{2}{\sqrt2} = -\sqrt2$.
      - $-2 \cdot (-\sqrt2) \cdot \frac{1}{\sqrt2}(1, 1) = (2, 2)$.
    explanation: (−2, 0) + (2, 2) = (0, 2). The ball came from the right and flies straight up after the 45° bounce.
    difficulty: 3

srs:
  cards_from: [raumschiff, wurf]
