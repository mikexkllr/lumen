id: math.vectors.games
type: concept
title: Movement in games
summary: Position plus velocity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      In games, every character has a **position** and a **velocity**. Both are vectors. Each frame, you add the velocity to the position.

  - kind: problem
    id: raumschiff
    widget: numeric
    prompt: A spaceship is at (10 | 5) and flies (2, −1) per frame. What is its x-value after {{n}} frames?
    params: { placeholder: "x" }
    answer: { value: "{{10 + 2 * n}}" }
    hints:
      - "2 to the right per frame, {{n}} times."
    explanation: "10 + {{n}} · 2 = {{10 + 2 * n}}."
    variants:
      params: { n: "int[3,12]" }
      defaults: { n: 4 }

  - kind: problem
    id: schleife
    widget: order
    prompt: Put the steps of one game frame in the right order.
    params:
      items:
        - { label: Read input }
        - { label: Adjust velocity }
        - { label: Position + velocity }
        - { label: Draw the frame }
    hints:
      - First learn what the player wants, and show it last.
    explanation: This happens 60 times per second. It is called the **game loop**.

  - kind: problem
    id: wurf
    widget: choice
    prompt: Each frame, (0, −1) is added to a ball's velocity. What path does it fly?
    params:
      options:
        - { label: A parabola, correct: true }
        - { label: A straight line, feedback: "The velocity changes every frame, so the path curves." }
        - { label: A circle, feedback: "For that, the force would have to always point to the center." }
    hints:
      - Gravity always pulls down with the same strength.
    explanation: This is how almost all games simulate gravity, with one vector addition per frame.

srs:
  cards_from: [raumschiff, wurf]
