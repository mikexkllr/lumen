id: math.vectors.arrows
type: concept
title: Pfeile mit Richtung
summary: Was ein Vektor ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: »Geh 5 Schritte!« Was fehlt, damit du weißt, wo du landest?
    params:
      options:
        - label: Die Richtung
          correct: true
        - label: Die Uhrzeit
          feedback: Die ändert das Ziel nicht.
        - label: Nichts
          feedback: Du könntest überall auf einem Kreis landen.
    hints:
      - Wohin sollst du gehen?
    explanation: Länge und Richtung zusammen – das ist ein Vektor.

  - kind: explain
    id: s1
    body: |
      Ein **Vektor** ist ein Pfeil. Er sagt, wie weit es nach rechts und wie weit nach oben geht. Man schreibt ihn als $\binom{3}{2}$ – 3 nach rechts, 2 nach oben.

  - kind: problem
    id: ziehen
    widget: graph
    prompt: Zieh die Spitze P so, dass der Pfeil {{a}} nach rechts und {{b}} nach oben zeigt.
    params:
      x: [-5, 5]
      y: [-5, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 1, y: 1 }
      segments: [[O, P]]
    answer: { points: { P: { x: "{{a}}", y: "{{b}}" } } }
    hints:
      - Negative Werte heißen nach links oder nach unten.
    explanation: "Die Spitze liegt bei ({{a}} | {{b}})."
    variants:
      params: { a: "int[-4,4]", b: "int[-4,4]" }
      constraints: ["a != 0", "b != 0", "a != 1"]
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: ablesen
    widget: numeric
    prompt: Ein Pfeil geht von (1 | 2) nach ({{1 + a}} | 5). Wie weit geht er nach rechts?
    params: { placeholder: "x" }
    answer: { value: "{{a}}" }
    feedback:
      - when: "numval(state.input) == 1 + a"
        misconception: endpoint
        text: Das ist der Endpunkt. Gefragt ist die Verschiebung – Ende minus Anfang.
    hints:
      - Ende minus Anfang.
    explanation: "{{1 + a}} − 1 = {{a}}."
    variants:
      params: { a: "int[2,8]" }
      defaults: { a: 5 }

  - kind: problem
    id: was-ist
    widget: buckets
    prompt: Vektor oder einfache Zahl?
    params:
      buckets: [{ label: Vektor }, { label: Zahl }]
      items:
        - { label: 3 km nach Nordosten, bucket: Vektor }
        - { label: Wind aus Westen mit 20 km/h, bucket: Vektor }
        - { label: Ein Schritt nach links, bucket: Vektor }
        - { label: "Temperatur 21 °C", bucket: Zahl }
        - { label: Masse 5 kg, bucket: Zahl }
    hints:
      - Spielt eine Richtung eine Rolle?
    explanation: Sobald eine Richtung dazugehört, ist es ein Vektor.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Windgeschwindigkeit mit Richtung
          right: true
        - text: Temperatur
          right: false
        - text: Kraft
          right: true
        - text: Masse
          right: false
        - text: Verschiebung von A nach B
          right: true
      left: Skalar
      right: Vektor

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Vektor von A(2 | 5) nach B(7 | 1) hat welche y-Komponente?
    answer:
      value: -4
    hints:
      - "Spitze minus Fuß: 1 − 5."
    explanation: "Der Vektor ist (5, −4): 5 nach rechts, 4 nach unten."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Zwei Pfeile sind gleich lang und zeigen in dieselbe Richtung, starten aber an verschiedenen Punkten. Sind es verschiedene Vektoren?
    params:
      options:
        - label: Nein – ein Vektor hat keinen festen Ort
          correct: true
        - label: Ja – der Startpunkt gehört dazu
          feedback: Der Startpunkt gehört zum **Pfeil**, nicht zum Vektor.
        - label: Nur wenn sie parallel sind
          feedback: Sie sind parallel – und trotzdem derselbe Vektor.
    hints:
      - Ein Vektor beschreibt nur »wie weit und wohin«.
    explanation: Ein Vektor ist die ganze Klasse gleicher Pfeile. Darum darf man ihn beim Addieren frei verschieben.
    difficulty: 3

srs:
  cards_from: [ziehen, was-ist]
