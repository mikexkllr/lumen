id: math.vectors.dot
type: concept
title: "Das Skalarprodukt"
summary: "Eine Zahl, die sagt, wie gut zwei Pfeile zusammenpassen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Rückenwind oder Gegenwind
    body: Rückenwind hilft, Gegenwind bremst, Seitenwind tut fast nichts. Dreh den Pfeil im Kreis. Die Zahl cos misst, wie stark er **nach rechts** zieht – mal positiv, mal null, mal negativ.
    visual:
      widget: sim
      interactive: true
      params:
        scene: unitcircle
        show:
          - cos

  - kind: problem
    id: c1
    widget: numeric
    prompt: Du kaufst 3 Äpfel und 2 Brote. Ein Apfel kostet 1 €, ein Brot 4 €. Wie viel zahlst du?
    params:
      unit: €
    answer:
      value: 11
    hints:
      - 3 · 1 + 2 · 4.
    explanation: "Du hast gerade ein Skalarprodukt gerechnet: Mengen (3, 2) mal Preise (1, 4)."

  - kind: explain
    id: c2
    body: "Das **Skalarprodukt** macht aus zwei Vektoren **eine Zahl**: gleiche Stellen malnehmen, dann alles addieren. (3, 2) · (1, 4) = 3 · 1 + 2 · 4 = 11."

  - kind: problem
    id: c3
    widget: numeric
    prompt: "Rechne: (2, 5) · (4, 1)."
    answer:
      value: 13
    hints:
      - 2 · 4 + 5 · 1.
    explanation: 8 + 5 = 13.

  - kind: problem
    id: c4
    widget: numeric
    prompt: "Rechne: (3, 4) · (4, −3)."
    answer:
      value: 0
    hints:
      - 3 · 4 + 4 · (−3).
    explanation: 12 − 12 = 0. Null ist hier etwas Besonderes.

  - kind: explain
    id: c5
    body: Ist das Skalarprodukt **null**, stehen die Pfeile **senkrecht** aufeinander. Ist es positiv, zeigen sie grob in dieselbe Richtung. Ist es negativ, zeigen sie eher gegeneinander.

  - kind: problem
    id: c6
    widget: buckets
    prompt: Welchen Winkel schließen die Pfeile ein? Rechne das Skalarprodukt.
    params:
      buckets:
        - id: b1
          label: Spitz (größer 0)
        - id: b2
          label: Rechter Winkel (0)
        - id: b3
          label: Stumpf (kleiner 0)
      items:
        - label: (1, 0) und (1, 1)
          bucket: b1
        - label: (1, 2) und (2, −1)
          bucket: b2
        - label: (1, 0) und (−1, 1)
          bucket: b3
        - label: (2, 3) und (3, −2)
          bucket: b2
        - label: (2, 1) und (1, 2)
          bucket: b1
    hints:
      - Gleiche Stellen malnehmen und addieren. Dann aufs Vorzeichen schauen.
    explanation: Das Vorzeichen verrät den Winkel – ganz ohne Geodreieck.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: Der Pfeil hat die Länge 1. Sein Skalarprodukt mit (1, 0) ist genau cos α. Dreh ihn nach links oben, bis das Skalarprodukt −0,5 ist.
    params:
      scene: unitcircle
    answer:
      cos: -0.5
      angle:
        - 90
        - 180
    hints:
      - "Negativ heißt: Der Pfeil zeigt eher gegen (1, 0), also nach links."
      - Dreh über 90° hinaus, bis cos auf −0,5 fällt.
    explanation: (cos 120°, sin 120°) · (1, 0) = cos 120° = −0,5. Der Winkel ist größer als 90°, darum ist das Produkt negativ.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ergibt ein Vektor mal sich selbst? Rechne (3, 4) · (3, 4).
    answer:
      value: 25
    hints:
      - 3 · 3 + 4 · 4.
    explanation: 25 – das Quadrat der Länge 5. Im Skalarprodukt steckt der Satz des Pythagoras.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Für den Winkel gilt: cos = Skalarprodukt geteilt durch beide Längen. Nimm a = (1, 0) und b = (1, 1). Die Längen sind 1 und √2. Wie groß ist der Winkel in Grad?"
    params:
      unit: °
    answer:
      value: 45
    hints:
      - "cos = 1 : √2 ≈ 0,707. Welcher Winkel hat diesen Kosinus?"
    explanation: 45° – b ist die Diagonale eines Quadrats.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Es gilt $\vec a \cdot \vec b = |\vec a|\,|\vec b| \cos\theta$. Teilt man durch $|\vec a|$, erhält man die Länge des **Schattens** von $\vec b$ auf der Richtung von $\vec a$ – die Projektion.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie lang ist der Schatten von $\vec b$ = (2, 3) auf der Richtung von $\vec a$ = (3, 4)? Auf eine Stelle.
    answer:
      value: 3.6
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 18
        misconception: no-normalise
        text: Das ist das Skalarprodukt. Teile noch durch die Länge von (3, 4).
    hints:
      - "Skalarprodukt: 2 · 3 + 3 · 4 = 18."
      - Länge von (3, 4) ist 5.
    explanation: "18 : 5 = 3,6. Mit Projektionen zerlegt die Physik Kräfte, etwa die Hangabtriebskraft."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Wie groß ist cos θ für den Winkel zwischen (3, 4) und (4, 3)? Auf zwei Stellen.
    answer:
      value: 0.96
      tolerance: 0.005
    feedback:
      - when: numval(state.input) == 24
        misconception: no-normalise
        text: Das ist das Skalarprodukt. Teile durch beide Längen.
    hints:
      - Skalarprodukt 12 + 12 = 24.
      - "Beide Längen sind 5: 24 : 25."
    explanation: cos θ = 24/25 = 0,96, also θ ≈ 16°. Die Pfeile zeigen fast gleich.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In der Physik ist Arbeit = Kraft · Weg, als Skalarprodukt. Die Kraft ist (10, 5) Newton, der Weg (4, 0) Meter. Wie viel Joule Arbeit sind das?
    params:
      unit: J
    answer:
      value: 40
    hints:
      - 10 · 4 + 5 · 0.
    explanation: 40 J. Nur der Teil der Kraft in Wegrichtung zählt – der Rest leistet keine Arbeit.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: KI-Suchen speichern Texte als Vektoren mit Hunderten Zahlen. Wie messen sie, ob zwei Texte ähnlich sind?
    params:
      options:
        - label: Mit dem Skalarprodukt – als Kosinus des Winkels zwischen den Vektoren
          correct: true
        - label: Sie zählen gleiche Buchstaben
          feedback: Dann wären »Hund« und »Bund« fast gleich.
        - label: Sie vergleichen nur die Länge
          feedback: Die Richtung trägt die Bedeutung.
    hints:
      - Gleiche Richtung heißt ähnliche Bedeutung.
    explanation: "Die **Kosinus-Ähnlichkeit**: 1 heißt gleiche Richtung, 0 heißt nichts gemeinsam."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was das Vorzeichen des Skalarprodukts über zwei Pfeile verrät.
    params:
      keywords:
        - - positiv
          - positive
          - größer
          - greater
        - - "null"
          - zero
          - senkrecht
          - perpendicular
        - - negativ
          - negative
          - entgegen
          - opposite
          - gegeneinander
          - against
      sample: Ist es positiv, zeigen die Pfeile grob in dieselbe Richtung. Bei null stehen sie senkrecht. Ist es negativ, zeigen sie eher gegeneinander.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Warum ist $\\frac{\\vec a \\cdot \\vec b}{|\\vec a|\\,|\\vec b|}$ nie größer als 1? Das sagt die **Cauchy-Schwarz-Ungleichung**: $|\\vec a \\cdot \\vec b| \\le |\\vec a|\\,|\\vec b|$. Sie gilt in jeder Dimension – darum darf man auch in 1000 Dimensionen von Winkeln reden."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Zwei Wörter haben die Bedeutungsvektoren (1, 2, 2) und (2, 1, 2). Wie groß ist ihre Kosinus-Ähnlichkeit? Auf zwei Stellen.
    answer:
      value: 0.89
      tolerance: 0.005
    feedback:
      - when: numval(state.input) == 8
        misconception: no-normalise
        text: Das ist das Skalarprodukt. Teile durch beide Längen.
    hints:
      - "Skalarprodukt: 2 + 2 + 4 = 8."
      - Beide Längen sind √9 = 3.
    explanation: "8 : 9 ≈ 0,89 – sehr ähnlich. Sprachmodelle vergleichen so Vektoren mit Hunderten Komponenten."
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
