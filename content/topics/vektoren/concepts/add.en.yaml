id: math.vectors.add
type: concept
title: Chaining arrows
summary: Adding vectors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: anhaengen
    widget: graph
    prompt: The first arrow ends at A. Attach the arrow (1, 3) to A and drag P to its tip.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 2, y: 1, draggable: false }
        - { id: P, x: 3, y: 1 }
      segments: [[O, A], [A, P]]
    answer: { points: { P: { x: 3, y: 4 } } }
    hints:
      - From A, go 1 to the right and 3 up.
    explanation: A + (1, 3) = (3 | 4).

  - kind: explain
    body: |
      You **add** vectors by chaining them together. In numbers, that means adding the x-values and adding the y-values.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: What is (2, 5) + (−1, 3)?
    params:
      options:
        - { label: "(1, 8)", correct: true }
        - { label: "(3, 8)", feedback: "2 + (−1) is 1, not 3." }
        - { label: "(1, 2)", feedback: "5 + 3 makes 8." }
    hints:
      - First the first numbers, then the second ones.
    explanation: (2 − 1, 5 + 3) = (1, 8).

  - kind: problem
    id: boot
    widget: numeric
    body: A boat travels east at 4 m/s. The current pushes it south at 3 m/s.
    prompt: How fast is the boat moving overall?
    params: { unit: m/s }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-lengths
        text: The arrows point in different directions. You can't simply add their lengths.
    hints:
      - The total arrow is the slanted side of a right triangle.
    explanation: (4, −3) has length 5, so the boat moves diagonally at 5 m/s.

srs:
  cards_from: [rechnen, boot]
