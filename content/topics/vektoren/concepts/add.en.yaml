id: math.vectors.add
type: concept
title: Chaining arrows
summary: Adding vectors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: anhaengen
    widget: graph
    prompt: The first arrow ends at A. Attach the arrow (1, 3) to A and drag P to its tip.
    params:
      x: [-1, 6]
      y: [-1, 6]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 2, y: 1, draggable: false }
        - { id: P, x: 3, y: 1 }
      segments: [[O, A], [A, P]]
    answer: { points: { P: { x: 3, y: 4 } } }
    hints:
      - From A, go 1 to the right and 3 up.
    explanation: A + (1, 3) = (3 | 4).

  - kind: explain
    id: s2
    body: |
      You **add** vectors by chaining them together. In numbers, that means adding the x-values and adding the y-values.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: What is (2, 5) + (−1, 3)?
    params:
      options:
        - { label: "(1, 8)", correct: true }
        - { label: "(3, 8)", feedback: "2 + (−1) is 1, not 3." }
        - { label: "(1, 2)", feedback: "5 + 3 makes 8." }
    hints:
      - First the first numbers, then the second ones.
    explanation: (2 − 1, 5 + 3) = (1, 8).

  - kind: problem
    id: boot
    widget: numeric
    body: A boat travels east at 4 m/s. The current pushes it south at 3 m/s.
    prompt: How fast is the boat moving overall?
    params: { unit: m/s }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-lengths
        text: The arrows point in different directions. You can't simply add their lengths.
    hints:
      - The total arrow is the slanted side of a right triangle.
    explanation: (4, −3) has length 5, so the boat moves diagonally at 5 m/s.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Vectors are added [[componentwise]]: (2, 5) + (−1, 3) = ([[1]], [[8]])."
      distractors:
        - "3"
        - crosswise

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A plane flies 300 km/h north. The wind blows at 40 km/h from the south. How fast is it over ground?
    params:
      unit: km/h
    answer:
      value: 340
    hints:
      - Wind from the south pushes north.
    explanation: "Both vectors point the same way: 300 + 40."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "The arrow from A to B is the **difference vector** $\\vec b - \\vec a$: tip minus tail. Because walking $\\vec a$ and then $\\vec b - \\vec a$ lands you at $\\vec b$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: graph
    prompt: Drag D so that the arrow from the origin to D equals $\vec b - \vec a$.
    params:
      x:
        - -4
        - 5
      y:
        - -2
        - 5
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
        - id: A
          x: 3
          y: 1
          draggable: false
          label: a
        - id: B
          x: 1
          y: 3
          draggable: false
          label: b
        - id: D
          x: 2
          y: -1
      segments:
        - - O
          - A
        - - O
          - B
        - - O
          - D
    answer:
      points:
        D:
          x: -2
          y: 2
    hints:
      - "Compute component by component: (1 − 3, 3 − 1)."
      - That is (−2, 2).
    explanation: $\vec b - \vec a$ = (−2, 2). That is exactly the arrow from A to B, shifted to the origin.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Three ropes pull on a knot. Two forces are (3, 4) N and (−5, 1) N. The knot does not move. What is the y-component of the third force?
    params:
      unit: N
    answer:
      value: -5
    feedback:
      - when: numval(state.input) == 5
        misconception: no-negation
        text: The third force must cancel the sum of the other two – so it is its opposite.
    hints:
      - In equilibrium all forces add up to zero.
      - The first two add up to (−2, 5).
    explanation: "Third force = −(−2, 5) = (2, −5). Engineers check every bridge this way: at each joint the vector sum must be zero."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A swimmer swims 3 km/h across a river flowing at 4 km/h. By how many metres is he carried downstream if the river is 60 m wide?
    params:
      unit: m
    answer:
      value: 80
    hints:
      - Across and along run independently. The ratio is 3 to 4.
    explanation: "For every 3 m across he drifts 4 m: 60 · 4/3 = 80 m."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Two non-parallel arrows $\\vec u$ and $\\vec v$ form a **basis**: every vector in the plane is exactly one combination $s\\,\\vec u + t\\,\\vec v$. The numbers s and t are its coordinates in this slanted grid."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Write (7, 4) as $s \cdot (1, 1) + t \cdot (1, -1)$. What is s?
    answer:
      value: 5.5
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 1.5
        misconception: swapped
        text: That is t. s is the share of (1, 1).
    hints:
      - "Component-wise: s + t = 7 and s − t = 4."
      - Add both equations.
    explanation: "2s = 11, so s = 5.5 and t = 1.5. Check: (5.5 + 1.5, 5.5 − 1.5) = (7, 4)."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux how to compute the arrow from A to B out of the points A and B.
    params:
      keywords:
        - - minus
          - abziehen
          - differenz
          - subtract
          - difference
        - - spitze
          - ende
          - ziel
          - tip
          - end
          - target
        - - fuß
          - anfang
          - start
          - tail
      sample: I compute tip minus tail, B minus A, for each component separately. Because walking this arrow from the start A ends at B.
    explanation: $\vec{AB} = \vec b - \vec a$ – the order matters, or the arrow points backwards.
    difficulty: 3

srs:
  cards_from: [rechnen, boot]
