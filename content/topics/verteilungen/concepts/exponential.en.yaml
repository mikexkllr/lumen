id: stats.distributions.exponential
type: concept
title: "Waiting times: the exponential distribution"
summary: "How long until the next event? And why atoms do not age."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: An atom has a half-life of 1 hour. It has already survived 5 hours. How likely does it decay in the next hour?
    params:
      options:
        - label: 50 % – just like a fresh atom
          correct: true
        - label: Atoms do not age.
          feedback: Atome altern nicht.
        - label: Every atom of this kind is the same.
          feedback: Jedes Atom dieser Sorte ist gleich.
    hints:
      - Does the atom remember the 5 hours?
      - The chance per hour always stays the same.
    explanation: The decay time is memoryless. The exponential distribution is the only continuous distribution with this property.

  - kind: explain
    id: c1
    body: Some things happen at random, but at a steady rate on average. Then the time until the next one is **exponential**. Short waits are common. Long waits get rarer and rarer.

  - kind: problem
    id: c2
    widget: sim
    prompt: The half-life is 4 hours. Set the time so that only 12.5 % of the atoms are left.
    params:
      scene: decay
      controls:
        halflife:
          value: 4
          fixed: true
    answer:
      left:
        - 12
        - 13
    explanation: 12.5 % = ½ · ½ · ½ – three half-lives, so 12 hours. For each single atom, »left« is the chance of surviving that long.

  - kind: problem
    id: c3
    widget: numeric
    prompt: On average 6 customers arrive per hour, at random and independently. How many minutes do you wait for the next one on average?
    answer:
      value: 10
    hints:
      - The mean waiting time is 1 ÷ rate.
      - 60 minutes ÷ 6.
    explanation: "1/λ = 1/6 hour = 10 minutes. Exponential and Poisson are two sides of the same randomness: Poisson counts, exponential waits."

  - kind: problem
    id: c4
    widget: numeric
    prompt: Rate 6 per hour. How likely do you wait longer than 20 minutes? P(T > t) = e^(−λt). In percent, to one decimal. (e² ≈ 7.389)
    answer:
      value: 13.5
      tolerance: 0.1
    hints:
      - λt = 6 · 1/3 hour = 2.
      - e^(−2) ≈ 0.135.
    explanation: "About 13.5 % – the same number as P(0 customers in 20 minutes) under Poisson. No coincidence: waiting longer than t means nobody comes within t."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The half-life is the median lifetime. How long is it at a rate of λ = 0.1 per year? To one decimal. (ln 2 ≈ 0.693)
    params:
      unit: years
    answer:
      value: 6.9
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 10
        misconception: mean-vs-median
        text: "That is the mean lifetime 1/λ. The median is shorter: ln 2 / λ."
    hints:
      - Set e^(−λT) = ½ and solve for T.
      - T = ln 2 ÷ λ.
    explanation: 0.693 ÷ 0.1 ≈ 6.9 years. The mean (10 years) is higher because a few very long lives pull it up – the distribution is right-skewed.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: sim
    prompt: A drug is cleared with a half-life of 6 hours. After what time is less than 10 % left? Set the smallest fitting number of hours.
    params:
      scene: decay
      controls:
        halflife:
          value: 6
          fixed: true
    answer:
      time: 20
    explanation: After 18 h 12.5 % is left, after 20 h about 9.9 %. Doctors use this to judge when a drug is practically gone – after about 3.3 half-lives.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Light bulbs fail at a fixed rate, humans do not. Why does the exponential distribution not fit human lifetimes?
    params:
      options:
        - label: Humans age – their risk of death rises with age
          correct: true
        - label: The length is not the problem, the rising rate is.
          feedback: Die Länge ist nicht das Problem, die steigende Rate ist es.
        - label: Then a 90-year-old would be as much at risk as a 20-year-old.
          feedback: Dann wäre ein 90-Jähriger so gefährdet wie ein 20-Jähriger.
    hints:
      - Is the risk per year the same at 20 and at 90?
      - "Memoryless means: age does not matter."
    explanation: For humans the hazard rate rises roughly exponentially with age (Gompertz). Only with a constant rate is the waiting time exponential.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Two independent hotlines: A gets 2 calls per minute, B gets 3. How long do you wait on average until either one rings? In seconds."
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 30
        misconception: single-line
        text: That is the wait for A alone. Together they ring more often.
    hints:
      - "Rates add up: 2 + 3 = 5 per minute."
      - 60 seconds ÷ 5.
    explanation: The minimum of two exponential waits is again exponential with rate 5. So 1/5 minute = 12 seconds.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: "Proof idea for memorylessness: P(T > s + t | T > s) = e^(−λ(s+t)) ÷ e^(−λs). What comes out?"
    params:
      options:
        - label: e^(−λt) – the same as P(T > t)
          correct: true
        - label: "Simplify the exponents correctly: (s + t) − s = t."
          feedback: "Kürze die Exponenten richtig: (s + t) − s = t."
        - label: The denominator does not just vanish.
          feedback: Der Nenner fällt nicht weg.
    hints:
      - eᵃ ÷ eᵇ = e^(a − b).
      - −λ(s + t) + λs = −λt.
    explanation: The elapsed time s cancels out. That is exactly why an atom has no age – and every wait starts afresh at every moment.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what »memoryless« means for waiting times – with an example.
    params:
      keywords:
        - - gedächtnis
          - erinner
          - memory
          - remember
        - - gleich
          - konstant
          - same
          - constant
          - rate
        - - atom
          - zerfall
          - decay
          - anruf
          - call
          - kunde
          - customer
      sample: The chance that an atom decays in the next hour is always the same. It has no memory of the time it has already survived. So the wait starts over at every moment.
    explanation: "A constant rate means: past waiting buys nothing – the future always looks the same."
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
