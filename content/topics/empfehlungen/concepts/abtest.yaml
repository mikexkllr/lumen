id: ai.recommend.abtest
type: concept
title: Der A/B-Test
summary: Wie Apps herausfinden, was wirkt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zufall oder besser?
    body: "Apps testen ständig zwei Versionen gegeneinander. Hier sind A und B **gleich gut**. Zieh 10 Käufe: Oft wirkt eine Version klar besser. Zieh dann 100. Was passiert?"
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: Kauf bei A
            weight: 1
          - label: Kauf bei B
            weight: 1
        sample:
          - 10
          - 100

  - kind: problem
    id: start-test
    widget: choice
    prompt: "Eine App will wissen: Wird ein roter oder ein grüner Knopf öfter gedrückt? Wie findet sie das am besten heraus?"
    params:
      options:
        - label: Beide Farben zeigen und mitzählen
          correct: true
        - label: Die Chefin entscheidet nach Gefühl
          feedback: Ein Gefühl kann täuschen. Zählen zeigt, was Menschen wirklich tun.
        - label: Die schönere Farbe nehmen
          feedback: Schön heißt nicht, dass mehr Leute drücken. Das muss man messen.
    hints:
      - Wie erfährst du, was Menschen wirklich tun?
      - Ausprobieren und zählen schlägt jede Vermutung.
    explanation: Die App zeigt einigen den roten und anderen den grünen Knopf. Dann zählt sie. Das ist schon die Idee des A/B-Tests.

  - kind: explain
    id: s2
    body: |
      **A/B-Test:** Besucher werden zufällig auf zwei Versionen verteilt. Nur eine Sache ist verschieden. So zeigt der Vergleich, was diese eine Sache bewirkt.

  - kind: problem
    id: zufall
    widget: choice
    prompt: Warum zufällig verteilen – statt A morgens und B abends zu zeigen?
    params:
      options:
        - { label: Sonst unterscheiden sich die Gruppen in mehr als der Version., correct: true }
        - { label: Zufall ist billiger., feedback: "Es geht um faire Gruppen, nicht ums Geld." }
    hints:
      - Kaufen Leute abends anders als morgens?
    explanation: Morgen- und Abendkunden sind verschieden. Zufall macht beide Gruppen gleich.

  - kind: problem
    id: wenig
    widget: choice
    prompt: Bei je 40 Besuchern hat B drei Käufe mehr. Ist B damit sicher besser?
    params:
      options:
        - { label: Nein – das kann Zufall sein., correct: true }
        - { label: Ja, feedback: "Bei so wenigen Besuchern schwanken die Zahlen stark." }
    hints:
      - Wie stark schwankt das Ergebnis bei kleinen Gruppen?
    explanation: Erst große Gruppen trennen echte Wirkung von Zufall.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne die Schritte eines A/B-Tests.
    params:
      items:
        - label: Eine einzige Änderung festlegen
        - label: Besucher zufällig aufteilen
        - label: Beide Versionen zur selben Zeit zeigen
        - label: Die Ergebnisse vergleichen
    hints:
      - Erst planen, dann aufteilen, dann messen.
    explanation: Der Zufall sorgt dafür, dass sich die Gruppen nur in einer Sache unterscheiden.

  - kind: problem
    id: start-mehr
    widget: numeric
    prompt: "Version A: 50 Käufe. Version B: 65 Käufe. Wie viele Käufe hat B mehr als A?"
    params:
      unit: Käufe
    answer:
      value: 15
    hints:
      - Zieh die kleinere Zahl von der größeren ab.
      - Rechne 65 − 50.
    explanation: 65 − 50 = 15 Käufe mehr. Gleich rechnest du aus, wie viel Prozent das sind.

  - kind: problem
    id: rate
    widget: numeric
    prompt: Version A – 1000 Besucher, 50 Käufe. Version B – 1000 Besucher, 65 Käufe. Um wie viel Prozent ist B besser?
    params: { unit: "%" }
    answer: { value: 30 }
    feedback:
      - when: "numval(state.input) == 15"
        misconception: absolute
        text: 15 ist der Unterschied in Käufen. Gefragt ist, um wie viel Prozent B mehr hat.
    hints:
      - 15 mehr, bezogen auf 50.
      - "Rechne 15 : 50 und nimm das Ergebnis mal 100."
    explanation: "15 : 50 = 0,3 – also 30 % mehr Käufe."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Team testet 20 Farben für einen Knopf gleichzeitig. Eine ist »signifikant besser«. Wie sicher ist das?
    params:
      options:
        - label: Wenig – bei 20 Vergleichen ist ein Zufallstreffer zu erwarten
          correct: true
        - label: Sehr sicher
          feedback: Bei vielen Tests findet man immer etwas.
        - label: Unmöglich zu sagen
          feedback: "Man kann es abschätzen: 20 · 5 % = 1 erwarteter Zufallstreffer."
    hints:
      - Jeder Vergleich hat 5 % Fehlalarm-Chance.
    explanation: Der Gewinner sollte in einem neuen Test bestätigt werden.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Version A: {{n}} Besucher, {{a}} Käufe. Version B: {{n}} Besucher, {{b}} Käufe. Um wie viel Prozent kauft man bei B mehr?"
    answer:
      value: "{{100 * (b - a) / a}}"
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == b - a
        misconception: absolute
        text: Das sind zusätzliche Käufe, kein Prozentwert.
    hints:
      - Der Unterschied ist {{b - a}} Käufe.
      - "Teile ihn durch A: {{b - a}} / {{a}}."
    explanation: "{{b - a}} / {{a}} = {{(b - a) / a}}, also {{100 * (b - a) / a}} % mehr. Das ist der **relative** Unterschied – der absolute wären {{100 * (b - a) / n}} Prozentpunkte."
    difficulty: 2
    variants:
      params:
        n: choice[1000,2000,5000]
        a: step[40,80,20]
        k: choice[10,20,25,50]
      derive:
        b: a + a * k / 100
      defaults:
        n: 2000
        a: 80
        k: 25

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Team schaut jeden Tag auf den Test und stoppt ihn, sobald B »signifikant« vorn liegt. Was ist das Problem?
    params:
      options:
        - label: Bei so vielen Blicken kommt ein Zufallsvorsprung fast sicher irgendwann vor.
          correct: true
        - label: Gar keins – früher Erfolg ist Erfolg.
          feedback: Man stoppt genau dann, wenn der Zufall gerade günstig war.
        - label: Der Test ist dann zu lang.
          feedback: Er wird eher zu früh beendet.
    hints:
      - Jeder Blick ist wie ein eigener Test.
      - Viele Tests bedeuten viele Chancen auf einen Fehlalarm.
    explanation: Dieses **Zwischengucken** erhöht die Fehlerrate stark. Seriös legt man Laufzeit und Stichprobengröße vorher fest – oder nutzt Verfahren, die für viele Blicke gebaut sind.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie entsteht eine Filterblase – und was kann man selbst dagegen tun?"
    params:
      keywords:
        - - klick
          - verhalten
          - click
          - behaviour
          - behavior
        - - ähnlich
          - gleich
          - bestätig
          - similar
          - same
          - confirm
          - passend
        - - andere
          - vielfalt
          - gezielt
          - verschieden
          - other
          - divers
          - different
          - bewusst
          - deliberate
      sample: Das System zeigt mir mehr von dem, was ich anklicke. So sehe ich immer Ähnliches und werde in meiner Sicht bestätigt. Dagegen hilft, bewusst auch andere Quellen und Themen zu suchen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein Team testet 20 Varianten, keine wirkt wirklich. Jeder Test meldet mit 5 % einen Zufallstreffer. Wie wahrscheinlich ist mindestens ein Fehlalarm? In Prozent, gerundet.
    answer:
      value: 64
      tolerance: 1
    feedback:
      - when: numval(state.input) == 5
        misconception: single-test
        text: Das gilt für einen Test. Bei 20 Tests summiert sich das Risiko.
      - when: numval(state.input) == 100
        misconception: additive
        text: Einfach 20 · 5 % zu rechnen geht nicht – die Fälle überlappen.
    hints:
      - "Rechne erst die Chance für »kein einziger Fehlalarm«: 0,95²⁰."
      - 0,95²⁰ ≈ 0,36. Der Rest ist »mindestens einer«.
    explanation: "1 − 0,95²⁰ ≈ 0,64. Darum korrigiert man bei **vielen Vergleichen**, etwa mit der Bonferroni-Regel: Jeder Test braucht dann 5 % / 20 = 0,25 %."
    difficulty: 3

srs:
  cards_from: [zufall, wenig]
