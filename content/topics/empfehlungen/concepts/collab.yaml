id: ai.recommend.collab
type: concept
title: Leute wie du mochten auch …
summary: Empfehlen aus dem Verhalten anderer.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: empfehlen
    widget: choice
    body: Carla hat fast denselben Geschmack wie du. Sie liebt eine Serie, die du noch nicht kennst.
    prompt: Was empfiehlt ein System dir wohl?
    params:
      options:
        - { label: Genau diese Serie, correct: true }
        - { label: Die meistgesehene Serie überhaupt, feedback: "Das wäre eine einfache Bestenliste – ohne Bezug zu dir." }
        - { label: "Eine Serie, die Carla nicht mag", feedback: "Ihr Geschmack ist ja deinem ähnlich." }
    hints:
      - Wofür hat das System eben Ähnlichkeit gemessen?
    explanation: Das nennt man **kollaboratives Filtern** – ähnliche Menschen helfen sich gegenseitig, ohne es zu wissen.

  - kind: explain
    id: s2
    body: |
      Es gibt zwei Grundideen. **Inhaltsbasiert** – du mochtest Krimis, hier ist noch ein Krimi.
      **Kollaborativ** – Menschen wie du mochten auch das.

  - kind: problem
    id: art
    widget: buckets
    prompt: Inhaltsbasiert oder kollaborativ?
    params:
      buckets: [{ label: inhaltsbasiert }, { label: kollaborativ }]
      items:
        - { label: Mehr vom selben Regisseur, bucket: inhaltsbasiert }
        - { label: Ein Song im gleichen Tempo, bucket: inhaltsbasiert }
        - { label: "Wer das kaufte, kaufte auch …", bucket: kollaborativ }
        - { label: Beliebt bei ähnlichen Hörern, bucket: kollaborativ }
    hints:
      - Geht es um Eigenschaften des Inhalts – oder um andere Menschen?
    explanation: Viele Dienste mischen beides.

  - kind: problem
    id: kaltstart
    widget: choice
    prompt: Ein brandneuer Film hat noch keine einzige Bewertung. Welche Methode kann ihn trotzdem empfehlen?
    params:
      options:
        - { label: Inhaltsbasiert, correct: true }
        - { label: Kollaborativ, feedback: "Ohne Bewertungen weiß niemand, welche Menschen ihn mögen." }
    hints:
      - Was weiß man über einen Film ohne Zuschauer?
    explanation: Das ist das **Kaltstart-Problem**. Merkmale wie Genre helfen, bis Bewertungen da sind.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: »Kunden, die das kauften, kauften auch …«
          right: true
        - text: "»Weil du einen Krimi gesehen hast: noch ein Krimi.«"
          right: false
        - text: »Leute mit ähnlichem Geschmack hören gerade das.«
          right: true
        - text: »Ähnliche Zutaten wie dein letztes Rezept.«
          right: false
      left: Inhaltsbasiert
      right: Kollaborativ

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Welche Grundidee steckt dahinter?
    params:
      buckets:
        - id: b1
          label: Inhaltsbasiert
        - id: b2
          label: Kollaborativ
      items:
        - label: »Du magst Krimis – hier ist noch einer.«
          bucket: b1
        - label: »Leute mit deinem Geschmack hörten das.«
          bucket: b2
        - label: »Ähnlich wie dein letzter Film.«
          bucket: b1
        - label: »Kunden kauften außerdem …«
          bucket: b2
    hints:
      - Geht es um das Ding selbst – oder um andere Menschen?
    explanation: Die meisten Dienste mischen beide Ideen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein neuer Nutzer meldet sich an und hat noch nichts bewertet. Was ist das Problem?
    params:
      options:
        - label: Ohne Daten findet das System keine ähnlichen Nutzer – der Kaltstart
          correct: true
        - label: Das Konto ist gesperrt
          feedback: Es fehlen nur Daten.
        - label: Es gibt keins
          feedback: Ohne Verhalten gibt es nichts zu vergleichen.
    hints:
      - Wem ist jemand ähnlich, über den man nichts weiß?
    explanation: Das **Kaltstart-Problem**. Darum fragen Apps am Anfang nach Lieblingsgenres.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Drei Nutzer mit ähnlichem Geschmack gaben einem Film {{a}}, {{b}} und {{c}} Sterne. Welche Bewertung sagt das System für dich voraus?
    answer:
      value: "{{(a + b + c) / 3}}"
      tolerance: 0.01
    hints:
      - Nimm den Durchschnitt der Nachbarn.
      - ({{a}} + {{b}} + {{c}}) / 3.
    explanation: ({{a}} + {{b}} + {{c}}) / 3 = {{(a + b + c) / 3}}. Das ist **kollaboratives Filtern** in seiner einfachsten Form.
    difficulty: 2
    variants:
      params:
        a: int[1,5]
        b: int[1,5]
        c: int[1,5]
      constraints:
        - (a + b + c) % 3 == 0
        - a != b
      defaults:
        a: 4
        b: 5
        c: 3

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Ein sehr ähnlicher Nutzer (Ähnlichkeit 0,9) gab 5 Sterne, ein wenig ähnlicher (0,3) gab 2. Wie lautet der gewichtete Durchschnitt?
    answer:
      value: 4.25
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 3.5
        misconception: unweighted
        text: Das ist der einfache Durchschnitt. Der ähnlichere Nutzer soll mehr zählen.
    hints:
      - Rechne (0,9 · 5 + 0,3 · 2) und teile durch die Summe der Gewichte.
      - (4,5 + 0,6) / 1,2 = ?
    explanation: 5,1 / 1,2 = 4,25. Ähnliche Nutzer bekommen mehr **Gewicht** – ihre Meinung sagt mehr über deinen Geschmack.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Tabelle aus 1 Million Nutzern und 100 000 Filmen ist fast leer. Wie füllt man die Lücken?
    params:
      options:
        - label: Man beschreibt jeden Nutzer und jeden Film mit wenigen versteckten Merkmalen und multipliziert sie
          correct: true
        - label: Man trägt überall den Durchschnitt ein
          feedback: Dann bekäme jeder dieselben Empfehlungen.
        - label: Man bittet alle, alles zu bewerten
          feedback: 100 000 Filme schaut niemand.
    hints:
      - Vielleicht genügen 50 Zahlen, um einen Geschmack zu beschreiben.
    explanation: "**Matrixfaktorisierung**: Die Merkmale lernt das System selbst – etwa »wie viel Action«, »wie ernst«."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein System beschreibt dich mit dem Vektor (2, 1) – etwa »mag Action«, »mag Humor«. Ein Film hat den Vektor (1,5; 1). Die Vorhersage ist das Skalarprodukt. Wie lautet sie?
    answer:
      value: 4
    hints:
      - "Skalarprodukt: Paare multiplizieren, dann addieren."
      - 2 · 1,5 + 1 · 1 = ?
    explanation: 3 + 1 = 4 Sterne. Bei der **Matrixfaktorisierung** lernt das System solche Vektoren für alle Nutzer und Filme aus den bekannten Bewertungen. Die Achsen haben meist keine eindeutige Bedeutung.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie »Leute wie du mochten auch …« funktioniert.
    params:
      keywords:
        - - ähnlich
          - gleich
          - similar
          - like you
        - - bewert
          - mochten
          - gefallen
          - rated
          - liked
        - - vorher
          - empfehl
          - empfiehl
          - predict
          - recommend
      sample: Das System sucht Menschen, die bisher ähnlich bewertet haben wie du. Filme, die diese mochten und du noch nicht kennst, empfiehlt es dir.
    difficulty: 3

srs:
  cards_from: [art, kaltstart]
