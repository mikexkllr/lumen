id: ai.recommend.metrics
type: concept
title: What Gets Measured Gets Optimized
summary: Click rates and their side effects.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The cobra trap
    body: "What gets measured gets optimized – often in strange ways. Uncover the cards: each shows a **metric** that became the goal. What went wrong?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐍
            front: The cobra bounty
            back: Legend has it there was a reward for every dead cobra. Soon people were breeding cobras.
          - icon: 📞
            front: The speedy call centre
            back: Calls were judged by their length. Some staff simply hung up sooner.
          - icon: 🏫
            front: The exam
            back: When only test scores count, schools drill the test instead of the subject.
          - icon: 🧮
            front: The line counter
            back: Pay per line of code, and code gets long instead of good.

  - kind: problem
    id: nur-klicks
    widget: choice
    prompt: A feed shows only what is clicked most. What will probably win out?
    params:
      options:
        - { label: Sensational titles and outrage, correct: true }
        - { label: The most thorough articles, feedback: "Thorough does not mean click-heavy." }
    hints:
      - What makes people tap quickly?
    explanation: Clicks measure curiosity, not quality. The system learns to stir curiosity.

  - kind: problem
    id: start-hundert
    widget: numeric
    prompt: 100 people see a post, 5 click on it. What is the click rate in percent?
    params:
      unit: "%"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 20
        misconception: inverted-ratio
        text: "You divided 100 by 5. The question is: how many out of 100 click?"
      - when: numval(state.input) == 0.05
        misconception: decimal-not-percent
        text: That is the share as a decimal. In percent it is 5.
    hints:
      - Percent means "out of a hundred".
      - 5 out of 100 is what percent?
    explanation: 5 out of 100 is 5%. The click rate tells you what share of viewers click.

  - kind: problem
    id: klickrate
    widget: numeric
    prompt: "{{n}} people see a post, {{k}} click on it. What is the click rate?"
    params: { unit: "%" }
    answer: { value: "{{p}}" }
    hints:
      - Clicks divided by views, times 100.
    explanation: "{{k}} ÷ {{n}} = {{p}}%."
    variants:
      params: { n: "choice[200,500,1000,2000]", p: "int[2,15]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 1000, p: 4 }

  - kind: explain
    id: s3
    body: |
      **Goodhart's law:** When a metric becomes a goal, it stops being a good measure. So good systems combine several signals.

  - kind: problem
    id: signale
    widget: buckets
    prompt: Does this measure short-term attention or real benefit?
    params:
      buckets: [{ label: Attention }, { label: Benefit }]
      items:
        - { label: Clicks, bucket: Attention }
        - { label: Watched the first 3 seconds, bucket: Attention }
        - { label: Comes back after a week, bucket: Benefit }
        - { label: Rating “was worth it”, bucket: Benefit }
    hints:
      - What says something about the time afterward?
    explanation: People who come back or are satisfied got real benefit.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A video is shown 20,000 times and clicked 800 times. Viewers stay 30 seconds on average of 5 minutes. What is the click rate in percent?
    params:
      unit: "%"
    answer:
      value: 4
    hints:
      - 800 of 20,000.
    explanation: 4% – but only 10% of the video is watched. The title lures, the content disappoints.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Video A gets 1000 clicks, each watched for 30 seconds. Video B gets 400 clicks, each watched for 3 minutes. How many more minutes of watch time does B bring than A?
    answer:
      value: 700
    feedback:
      - when: numval(state.input) == 1200
        misconception: forgot-subtract
        text: That is B's watch time. Subtract A's.
    hints:
      - "A: 1000 · 0.5 minutes. B: 400 · 3 minutes."
      - 1200 − 500 = ?
    explanation: A has more clicks, but B has more than twice the watch time. Which metric you optimise decides which video wins.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: An AI is told to “maximise clicks” and shows only outrage. It does exactly what was asked. What is this basic problem called?
    params:
      options:
        - label: The goal was badly chosen – the metric is not what you actually want
          correct: true
        - label: The AI is broken
          feedback: It works flawlessly.
        - label: The AI is malicious
          feedback: It has no intentions – only a goal.
    hints:
      - Did the developers want clicks – or satisfied users?
    explanation: "The **alignment problem**: machines optimise what you measure, not what you mean."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A feed scores videos as 0.5 · click rate + 0.5 · satisfaction (both from 0 to 1). Video B has click rate 0.5 and satisfaction 0.9. What score does it get?
    answer:
      value: 0.7
      tolerance: 0.001
    hints:
      - "Plug in: 0.5 · 0.5 + 0.5 · 0.9."
      - 0.25 + 0.45 = ?
    explanation: 0.7. A clickbait video with 0.8 and 0.2 would only reach 0.5. Mixing several goals makes it harder to game a single number. But the weights themselves are a value judgement.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain Goodhart's law to Lux with your own example.
    params:
      keywords:
        - - kennzahl
          - zahl
          - messung
          - metric
          - measure
          - number
        - - ziel
          - optimier
          - target
          - optimi
        - - trick
          - nebenwirkung
          - taugt
          - game
          - side effect
          - stops working
      sample: Once a metric becomes the target, people optimise the number itself. If a school only counts grades, students learn for the test instead of for understanding. The measure stops working.
    difficulty: 3

srs:
  cards_from: [nur-klicks, signale]
