id: ai.recommend.metrics
type: concept
title: Was gemessen wird, wird optimiert
summary: Klickraten und ihre Nebenwirkungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: klickrate
    widget: numeric
    prompt: "{{n}} Leute sehen einen Beitrag, {{k}} klicken darauf. Wie hoch ist die Klickrate?"
    params: { unit: "%" }
    answer: { value: "{{p}}" }
    hints:
      - Klicks geteilt durch Aufrufe, mal 100.
    explanation: "{{k}} : {{n}} = {{p}} %."
    variants:
      params: { n: "choice[200,500,1000,2000]", p: "int[2,15]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 1000, p: 4 }

  - kind: problem
    id: nur-klicks
    widget: choice
    prompt: Ein Feed zeigt nur, was am meisten angeklickt wird. Was setzt sich wahrscheinlich durch?
    params:
      options:
        - { label: Reißerische Titel und Aufreger, correct: true }
        - { label: Die gründlichsten Artikel, feedback: "Gründlich heißt nicht klickstark." }
    hints:
      - Was lässt Leute schnell tippen?
    explanation: Klicks messen Neugier, nicht Qualität. Das System lernt, Neugier zu wecken.

  - kind: explain
    id: s3
    body: |
      **Goodharts Gesetz:** Wird eine Kennzahl zum Ziel, taugt sie nicht mehr als Messung. Gute Systeme kombinieren darum mehrere Signale.

  - kind: problem
    id: signale
    widget: buckets
    prompt: Misst das eher kurzfristige Aufmerksamkeit oder echten Nutzen?
    params:
      buckets: [{ label: Aufmerksamkeit }, { label: Nutzen }]
      items:
        - { label: Klicks, bucket: Aufmerksamkeit }
        - { label: Die ersten 3 Sekunden geschaut, bucket: Aufmerksamkeit }
        - { label: Kommt nach einer Woche wieder, bucket: Nutzen }
        - { label: Bewertung »hat sich gelohnt«, bucket: Nutzen }
    hints:
      - Was sagt etwas über die Zeit danach?
    explanation: Wer wiederkommt oder zufrieden ist, hatte echten Nutzen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Video wird 20 000-mal angezeigt und 800-mal geklickt. Die Zuschauer bleiben im Schnitt 30 Sekunden bei 5 Minuten Länge. Wie hoch ist die Klickrate in Prozent?
    params:
      unit: "%"
    answer:
      value: 4
    hints:
      - 800 von 20 000.
    explanation: 4 % – aber nur 10 % des Videos werden gesehen. Der Titel lockt, der Inhalt enttäuscht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine KI soll »Klicks maximieren« und zeigt nur noch Empörendes. Sie tut genau, was verlangt wurde. Wie heißt dieses Grundproblem?
    params:
      options:
        - label: Das Ziel war falsch gewählt – die Messgröße ist nicht das, was man eigentlich will
          correct: true
        - label: Die KI ist kaputt
          feedback: Sie funktioniert einwandfrei.
        - label: Die KI ist böswillig
          feedback: Sie hat keine Absichten – nur ein Ziel.
    hints:
      - Wollten die Entwickler Klicks – oder zufriedene Nutzer?
    explanation: "Das **Ausrichtungsproblem**: Maschinen optimieren, was man misst, nicht was man meint."
    difficulty: 3

srs:
  cards_from: [nur-klicks, signale]
