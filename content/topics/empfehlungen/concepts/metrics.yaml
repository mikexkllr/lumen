id: ai.recommend.metrics
type: concept
title: Was gemessen wird, wird optimiert
summary: Klickraten und ihre Nebenwirkungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Kobra-Falle
    body: "Was man misst, wird optimiert – oft auf seltsame Weise. Deck die Karten auf: Jede zeigt eine **Kennzahl**, die zum Ziel wurde. Was ging dabei schief?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐍
            front: Die Kobra-Prämie
            back: Der Legende nach gab es für jede tote Kobra Geld. Bald züchteten Leute Kobras.
          - icon: 📞
            front: Das schnelle Callcenter
            back: Gezählt wurde die Dauer der Anrufe. Manche legten einfach früher auf.
          - icon: 🏫
            front: Die Prüfung
            back: Zählen nur Testergebnisse, üben Schulen den Test statt das Fach.
          - icon: 🧮
            front: Der Zeilenzähler
            back: Bezahlt man pro Zeile Code, wird Code lang statt gut.

  - kind: problem
    id: klickrate
    widget: numeric
    prompt: "{{n}} Leute sehen einen Beitrag, {{k}} klicken darauf. Wie hoch ist die Klickrate?"
    params: { unit: "%" }
    answer: { value: "{{p}}" }
    hints:
      - Klicks geteilt durch Aufrufe, mal 100.
    explanation: "{{k}} : {{n}} = {{p}} %."
    variants:
      params: { n: "choice[200,500,1000,2000]", p: "int[2,15]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 1000, p: 4 }

  - kind: problem
    id: nur-klicks
    widget: choice
    prompt: Ein Feed zeigt nur, was am meisten angeklickt wird. Was setzt sich wahrscheinlich durch?
    params:
      options:
        - { label: Reißerische Titel und Aufreger, correct: true }
        - { label: Die gründlichsten Artikel, feedback: "Gründlich heißt nicht klickstark." }
    hints:
      - Was lässt Leute schnell tippen?
    explanation: Klicks messen Neugier, nicht Qualität. Das System lernt, Neugier zu wecken.

  - kind: explain
    id: s3
    body: |
      **Goodharts Gesetz:** Wird eine Kennzahl zum Ziel, taugt sie nicht mehr als Messung. Gute Systeme kombinieren darum mehrere Signale.

  - kind: problem
    id: signale
    widget: buckets
    prompt: Misst das eher kurzfristige Aufmerksamkeit oder echten Nutzen?
    params:
      buckets: [{ label: Aufmerksamkeit }, { label: Nutzen }]
      items:
        - { label: Klicks, bucket: Aufmerksamkeit }
        - { label: Die ersten 3 Sekunden geschaut, bucket: Aufmerksamkeit }
        - { label: Kommt nach einer Woche wieder, bucket: Nutzen }
        - { label: Bewertung »hat sich gelohnt«, bucket: Nutzen }
    hints:
      - Was sagt etwas über die Zeit danach?
    explanation: Wer wiederkommt oder zufrieden ist, hatte echten Nutzen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Video wird 20 000-mal angezeigt und 800-mal geklickt. Die Zuschauer bleiben im Schnitt 30 Sekunden bei 5 Minuten Länge. Wie hoch ist die Klickrate in Prozent?
    params:
      unit: "%"
    answer:
      value: 4
    hints:
      - 800 von 20 000.
    explanation: 4 % – aber nur 10 % des Videos werden gesehen. Der Titel lockt, der Inhalt enttäuscht.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Video A wird 1000-mal geklickt und je 30 Sekunden geschaut. Video B wird 400-mal geklickt und je 3 Minuten geschaut. Wie viele Minuten Sehzeit bringt B mehr als A?
    answer:
      value: 700
    feedback:
      - when: numval(state.input) == 1200
        misconception: forgot-subtract
        text: Das ist die Sehzeit von B. Zieh die von A ab.
    hints:
      - "A: 1000 · 0,5 Minuten. B: 400 · 3 Minuten."
      - 1200 − 500 = ?
    explanation: A hat mehr Klicks, B aber mehr als doppelt so viel Sehzeit. Welche **Kennzahl** man optimiert, entscheidet, welches Video gewinnt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine KI soll »Klicks maximieren« und zeigt nur noch Empörendes. Sie tut genau, was verlangt wurde. Wie heißt dieses Grundproblem?
    params:
      options:
        - label: Das Ziel war falsch gewählt – die Messgröße ist nicht das, was man eigentlich will
          correct: true
        - label: Die KI ist kaputt
          feedback: Sie funktioniert einwandfrei.
        - label: Die KI ist böswillig
          feedback: Sie hat keine Absichten – nur ein Ziel.
    hints:
      - Wollten die Entwickler Klicks – oder zufriedene Nutzer?
    explanation: "Das **Ausrichtungsproblem**: Maschinen optimieren, was man misst, nicht was man meint."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein Feed bewertet Videos mit 0,5 · Klickrate + 0,5 · Zufriedenheit (beides von 0 bis 1). Video B hat Klickrate 0,5 und Zufriedenheit 0,9. Welche Punktzahl bekommt es?
    answer:
      value: 0.7
      tolerance: 0.001
    hints:
      - "Setze ein: 0,5 · 0,5 + 0,5 · 0,9."
      - 0,25 + 0,45 = ?
    explanation: 0,7. Ein Klick-Köder mit 0,8 und 0,2 käme nur auf 0,5. Wer **mehrere Ziele** mischt, macht es schwerer, eine einzelne Zahl auszutricksen. Die Gewichte sind aber selbst eine Wertentscheidung.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux Goodharts Gesetz an einem eigenen Beispiel.
    params:
      keywords:
        - - kennzahl
          - zahl
          - messung
          - metric
          - measure
          - number
        - - ziel
          - optimier
          - target
          - optimi
        - - trick
          - nebenwirkung
          - taugt
          - game
          - side effect
          - stops working
      sample: Wird eine Kennzahl selbst zum Ziel, optimiert man nur noch die Zahl. Zählt eine Schule nur Noten, lernt man für die Prüfung statt fürs Verstehen. Die Messung taugt dann nicht mehr.
    difficulty: 3

srs:
  cards_from: [nur-klicks, signale]
