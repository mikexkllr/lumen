id: ai.recommend.similar
type: concept
title: Ähnlichkeit messen
summary: Wie nah liegen zwei Geschmäcker?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent dessen, was Menschen auf großen Streaming-Plattformen schauen, stammt aus Empfehlungen?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 75
      tolerance: 12
    explanation: Rund 70 bis 80 %. Die meisten Entscheidungen trifft der Algorithmus vor – nicht die Suche.

  - kind: problem
    id: abstand
    widget: numeric
    body: Anna bewertet vier Filme mit 5, 1, 4, 2 Sternen. Ben mit 4, 2, 4, 1.
    prompt: Zähle die Unterschiede pro Film zusammen. Wie groß ist der Abstand?
    params: { placeholder: "Summe" }
    answer: { value: 3 }
    hints:
      - Die Unterschiede sind 1, 1, 0 und 1.
    explanation: 1 + 1 + 0 + 1 = 3. Ein kleiner Abstand heißt ähnlicher Geschmack.

  - kind: explain
    id: s2
    body: |
      Empfehlungen beginnen mit **Ähnlichkeit**. Ein System misst, wie nah sich zwei Menschen oder zwei Filme sind.
      Je kleiner der Abstand, desto ähnlicher.

  - kind: problem
    id: wer
    widget: choice
    body: Du bewertest drei Serien mit 5, 1, 3. Carla – 4, 1, 3. David – 1, 5, 2. Eva – 5, 3, 1.
    prompt: Wer hat den ähnlichsten Geschmack?
    params:
      options:
        - { label: Carla, correct: true }
        - { label: David, feedback: "Abstand 4 + 4 + 1 = 9. Das ist fast das Gegenteil." }
        - { label: Eva, feedback: "Abstand 0 + 2 + 2 = 4. Carla liegt näher." }
    hints:
      - Rechne für jeden den Abstand aus.
    explanation: Carla hat Abstand 1 + 0 + 0 = 1 – am nächsten an dir.

  - kind: problem
    id: merkmale
    widget: match
    prompt: Womit vergleicht ein System Filme? Verbinde.
    params:
      pairs:
        - { left: Genre, right: Krimi oder Komödie }
        - { left: Länge, right: Minuten }
        - { left: Stimmung, right: Düster oder heiter }
        - { left: Publikum, right: Wer ihn schon mochte }
    hints:
      - Jedes Merkmal ist eine Zahl oder eine Kategorie.
    explanation: Aus solchen Merkmalen wird ein Zahlenprofil. Ähnliche Profile liegen nah beieinander.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Anna bewertet drei Filme mit (5, 1, 4), Ben mit (4, 2, 4). Wie groß ist ihr Abstand, wenn man die Unterschiede **quadriert**, addiert und die Wurzel zieht? Auf eine Stelle.
    answer:
      value: 1.4
      tolerance: 0.05
    hints:
      - "Unterschiede: 1, 1, 0."
    explanation: √(1 + 1 + 0) ≈ 1,4 – der **euklidische Abstand**, Pythagoras in vielen Dimensionen.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Anna bewertet drei Filme mit ({{a1}}, {{a2}}, {{a3}}), Ben mit ({{b1}}, {{b2}}, {{b3}}). Wie groß ist der Abstand, wenn du die Unterschiede ohne Vorzeichen addierst?
    answer:
      value: "{{abs(a1 - b1) + abs(a2 - b2) + abs(a3 - b3)}}"
    hints:
      - "Rechne Film für Film: Wie weit liegen die Sterne auseinander?"
      - Addiere die drei Abstände.
    explanation: "{{abs(a1 - b1)}} + {{abs(a2 - b2)}} + {{abs(a3 - b3)}} = {{abs(a1 - b1) + abs(a2 - b2) + abs(a3 - b3)}}. Dieses Maß heißt **Manhattan-Abstand** – wie Laufen durch ein Straßengitter."
    difficulty: 2
    variants:
      params:
        a1: int[1,5]
        a2: int[1,5]
        a3: int[1,5]
        b1: int[1,5]
        b2: int[1,5]
        b3: int[1,5]
      constraints:
        - a1 != b1
        - a2 != b2
      defaults:
        a1: 5
        a2: 2
        a3: 4
        b1: 3
        b2: 3
        b3: 4

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Lea vergibt fast immer 4 oder 5 Sterne, Tom fast nur 1 oder 2. Wie macht ein System ihre Bewertungen vergleichbar?
    params:
      options:
        - label: Von jeder Bewertung den eigenen Durchschnitt abziehen.
          correct: true
        - label: Toms Bewertungen löschen.
          feedback: Dann fehlen wertvolle Daten – Tom ist nur strenger.
        - label: Alle Bewertungen auf 3 setzen.
          feedback: Dann ist jede Information weg.
    hints:
      - Für Lea ist eine 4 eher schwach, für Tom wäre sie ein Lob.
      - Wichtig ist, wie ein Film im Vergleich zum eigenen Schnitt abschneidet.
    explanation: "Nach dem **Zentrieren** heißt +1: »besser als mein Schnitt«. So passen strenge und großzügige Bewerter zusammen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Lea bewertet alles mit 4 bis 5 Sternen, Tom alles mit 1 bis 2 – aber beide mögen dieselben Filme am liebsten. Welches Maß erkennt ihre Ähnlichkeit?
    params:
      options:
        - label: Der Winkel zwischen ihren Bewertungen – die Kosinus-Ähnlichkeit
          correct: true
        - label: Der einfache Abstand
          feedback: Der wäre groß, weil Toms Zahlen überall kleiner sind.
        - label: Die Zahl der bewerteten Filme
          feedback: Die sagt nichts über den Geschmack.
    hints:
      - Es kommt auf die Richtung an, nicht auf die Länge.
    explanation: Die **Kosinus-Ähnlichkeit** vergleicht Muster statt Größen. Sie steckt in fast jeder Suche und jedem Sprachmodell.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Lea gibt drei Filmen 5, 4 und 3 Sterne. Wie lautet ihre zentrierte Bewertung für den dritten Film?
    answer:
      value: -1
    feedback:
      - when: numval(state.input) == 3
        misconception: raw
        text: Das ist die rohe Bewertung. Zieh ihren Durchschnitt ab.
    hints:
      - Ihr Durchschnitt ist (5 + 4 + 3) / 3.
      - Rechne 3 − 4.
    explanation: 3 − 4 = −1. Berechnet man auf zentrierten Bewertungen den Kosinus der Winkel, erhält man die **Pearson-Korrelation** – ein Standardmaß für Geschmacksähnlichkeit.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Empfehlungssystem misst, ob zwei Menschen einen ähnlichen Geschmack haben.
    params:
      keywords:
        - - bewert
          - sterne
          - rating
          - stars
        - - abstand
          - unterschied
          - distance
          - difference
        - - klein
          - nah
          - ähnlich
          - small
          - close
          - similar
      sample: Es vergleicht ihre Bewertungen Film für Film und rechnet einen Abstand aus. Je kleiner der Abstand, desto ähnlicher ist ihr Geschmack. Oft zieht man vorher den eigenen Durchschnitt ab.
    difficulty: 3

srs:
  cards_from: [abstand, wer]
