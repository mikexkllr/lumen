id: ai.recommend.similar
type: concept
title: Ähnlichkeit messen
summary: Wie nah liegen zwei Geschmäcker?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent dessen, was Menschen auf großen Streaming-Plattformen schauen, stammt aus Empfehlungen?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 75
      tolerance: 12
    explanation: Rund 70 bis 80 %. Die meisten Entscheidungen trifft der Algorithmus vor – nicht die Suche.


  - kind: problem
    id: abstand
    widget: numeric
    body: Anna bewertet vier Filme mit 5, 1, 4, 2 Sternen. Ben mit 4, 2, 4, 1.
    prompt: Zähle die Unterschiede pro Film zusammen. Wie groß ist der Abstand?
    params: { placeholder: "Summe" }
    answer: { value: 3 }
    hints:
      - Die Unterschiede sind 1, 1, 0 und 1.
    explanation: 1 + 1 + 0 + 1 = 3. Ein kleiner Abstand heißt ähnlicher Geschmack.

  - kind: explain
    id: s2
    body: |
      Empfehlungen beginnen mit **Ähnlichkeit**. Ein System misst, wie nah sich zwei Menschen oder zwei Filme sind.
      Je kleiner der Abstand, desto ähnlicher.

  - kind: problem
    id: wer
    widget: choice
    body: Du bewertest drei Serien mit 5, 1, 3. Carla – 4, 1, 3. David – 1, 5, 2. Eva – 5, 3, 1.
    prompt: Wer hat den ähnlichsten Geschmack?
    params:
      options:
        - { label: Carla, correct: true }
        - { label: David, feedback: "Abstand 4 + 4 + 1 = 9. Das ist fast das Gegenteil." }
        - { label: Eva, feedback: "Abstand 0 + 2 + 2 = 4. Carla liegt näher." }
    hints:
      - Rechne für jeden den Abstand aus.
    explanation: Carla hat Abstand 1 + 0 + 0 = 1 – am nächsten an dir.

  - kind: problem
    id: merkmale
    widget: match
    prompt: Womit vergleicht ein System Filme? Verbinde.
    params:
      pairs:
        - { left: Genre, right: Krimi oder Komödie }
        - { left: Länge, right: Minuten }
        - { left: Stimmung, right: Düster oder heiter }
        - { left: Publikum, right: Wer ihn schon mochte }
    hints:
      - Jedes Merkmal ist eine Zahl oder eine Kategorie.
    explanation: Aus solchen Merkmalen wird ein Zahlenprofil. Ähnliche Profile liegen nah beieinander.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Anna bewertet drei Filme mit (5, 1, 4), Ben mit (4, 2, 4). Wie groß ist ihr Abstand, wenn man die Unterschiede **quadriert**, addiert und die Wurzel zieht? Auf eine Stelle.
    answer:
      value: 1.4
      tolerance: 0.05
    hints:
      - "Unterschiede: 1, 1, 0."
    explanation: √(1 + 1 + 0) ≈ 1,4 – der **euklidische Abstand**, Pythagoras in vielen Dimensionen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Lea bewertet alles mit 4 bis 5 Sternen, Tom alles mit 1 bis 2 – aber beide mögen dieselben Filme am liebsten. Welches Maß erkennt ihre Ähnlichkeit?
    params:
      options:
        - label: Der Winkel zwischen ihren Bewertungen – die Kosinus-Ähnlichkeit
          correct: true
        - label: Der einfache Abstand
          feedback: Der wäre groß, weil Toms Zahlen überall kleiner sind.
        - label: Die Zahl der bewerteten Filme
          feedback: Die sagt nichts über den Geschmack.
    hints:
      - Es kommt auf die Richtung an, nicht auf die Länge.
    explanation: Die **Kosinus-Ähnlichkeit** vergleicht Muster statt Größen. Sie steckt in fast jeder Suche und jedem Sprachmodell.
    difficulty: 3

srs:
  cards_from: [abstand, wer]
