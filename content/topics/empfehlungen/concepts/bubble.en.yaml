id: ai.recommend.bubble
type: concept
title: Filter Bubbles
summary: When the feed only confirms.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: schleife
    widget: order
    prompt: How does a filter bubble form? Put the steps in order.
    params:
      items:
        - { label: You click on a video about a topic. }
        - { label: The system shows you more of it. }
        - { label: "You click again – it fits, after all." }
        - { label: Other topics hardly show up anymore. }
    hints:
      - It starts with a single click.
    explanation: Each click reinforces the selection. This is a **feedback loop**.

  - kind: explain
    body: |
      Systems reward what is clicked often. Exciting content gets more room that way.
      If you only see what fits, you are in a **filter bubble**.

  - kind: problem
    id: helfen
    widget: buckets
    prompt: Does it help against the filter bubble – or reinforce it?
    params:
      buckets: [{ label: helps }, { label: reinforces }]
      items:
        - { label: Deliberately reading other sources, bucket: helps }
        - { label: Clearing your history now and then, bucket: helps }
        - { label: Choosing the chronological view, bucket: helps }
        - { label: Clicking only on outrage, bucket: reinforces }
        - { label: Following only channels with one opinion, bucket: reinforces }
    hints:
      - What brings new signals into the system?
    explanation: Variety in your clicks brings variety to the recommendations.

  - kind: explain
    body: Are recommendations bad, then?
    reveal:
      body: No – without them you would hardly find anything among millions of videos. What matters is knowing that a selection is made – and by what goals.

srs:
  cards_from: [schleife, helfen]
