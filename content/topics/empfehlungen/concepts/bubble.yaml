id: ai.recommend.bubble
type: concept
title: Filterblasen
summary: Wenn der Feed nur noch bestätigt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: schleife
    widget: order
    prompt: Wie entsteht eine Filterblase? Bring die Schritte in Reihenfolge.
    params:
      items:
        - { label: Du klickst auf ein Video zu einem Thema. }
        - { label: Das System zeigt dir mehr davon. }
        - { label: Du klickst wieder – es passt ja. }
        - { label: Andere Themen tauchen kaum noch auf. }
    hints:
      - Es beginnt mit einem einzigen Klick.
    explanation: Jeder Klick verstärkt die Auswahl. Das ist eine **Rückkopplung**.

  - kind: explain
    id: s2
    body: |
      Systeme belohnen, was oft angeklickt wird. Aufregende Inhalte bekommen so mehr Raum.
      Wer nur noch Passendes sieht, steckt in einer **Filterblase**.

  - kind: problem
    id: helfen
    widget: buckets
    prompt: Hilft das gegen die Filterblase – oder verstärkt es sie?
    params:
      buckets: [{ label: hilft }, { label: verstärkt }]
      items:
        - { label: Bewusst andere Quellen lesen, bucket: hilft }
        - { label: Verlauf ab und zu löschen, bucket: hilft }
        - { label: Chronologische Ansicht wählen, bucket: hilft }
        - { label: Nur auf Empörung klicken, bucket: verstärkt }
        - { label: Nur Kanälen einer Meinung folgen, bucket: verstärkt }
    hints:
      - Was bringt neue Signale ins System?
    explanation: Vielfalt in deinen Klicks bringt Vielfalt in die Empfehlungen.

  - kind: explain
    id: s4
    body: Sind Empfehlungen also schlecht?
    reveal:
      body: Nein – ohne sie fände man in Millionen Videos kaum etwas. Wichtig ist, zu wissen, dass ausgewählt wird – und nach welchen Zielen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein System zeigt, was du anklickst. Du klickst, was es zeigt. Wie nennt man so einen Kreislauf?
    params:
      options:
        - label: Rückkopplungsschleife
          correct: true
        - label: Zufallsstichprobe
          feedback: Hier ist nichts zufällig – es verstärkt sich selbst.
        - label: A/B-Test
          feedback: Dabei werden zwei Versionen verglichen.
    hints:
      - Das Ergebnis wird wieder zur Eingabe.
    explanation: Das System lernt aus Daten, die es selbst erzeugt hat. So werden kleine Vorlieben zu großen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Empfehlungssystem zeigt manchmal absichtlich etwas, das **nicht** am besten passt. Warum?
    params:
      options:
        - label: Um Neues auszuprobieren – sonst erfährt es nie, was du noch mögen könntest
          correct: true
        - label: Aus Versehen
          feedback: Es ist eine bewusste Strategie.
        - label: Um dich zu ärgern
          feedback: Es dient dem Lernen.
    hints:
      - Wer immer dasselbe Restaurant wählt, entdeckt nie ein besseres.
    explanation: Die Abwägung **Erkunden gegen Ausnutzen** – ein Grundproblem des Lernens, auch für Menschen.
    difficulty: 3

srs:
  cards_from: [schleife, helfen]
