id: ai.recommend.abtest
type: concept
title: The A/B Test
summary: How apps find out what works.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: rate
    widget: numeric
    prompt: Version A – 1000 visitors, 50 purchases. Version B – 1000 visitors, 65 purchases. By what percent is B better?
    params: { unit: "%" }
    answer: { value: 30 }
    feedback:
      - when: "numval(state.input) == 15"
        misconception: absolute
        text: 15 is the difference in purchases. The question is by what percent B has more.
    hints:
      - 15 more, relative to 50.
    explanation: "15 ÷ 50 = 0.3 – so 30% more purchases."

  - kind: explain
    body: |
      **A/B test:** Visitors are randomly split between two versions. Only one thing differs. So the comparison shows what that one thing does.

  - kind: problem
    id: zufall
    widget: choice
    prompt: Why split visitors randomly – instead of showing A in the morning and B in the evening?
    params:
      options:
        - { label: Otherwise the groups differ in more than the version., correct: true }
        - { label: Randomness is cheaper., feedback: "It is about fair groups, not money." }
    hints:
      - Do people buy differently in the evening than in the morning?
    explanation: Morning and evening customers differ. Randomness makes both groups alike.

  - kind: problem
    id: wenig
    widget: choice
    prompt: With 40 visitors each, B has three more purchases. Is B surely better?
    params:
      options:
        - { label: No – that can be chance., correct: true }
        - { label: "Yes", feedback: "With so few visitors, the numbers fluctuate a lot." }
    hints:
      - How much does the result fluctuate in small groups?
    explanation: Only large groups separate a real effect from chance.

srs:
  cards_from: [zufall, wenig]
