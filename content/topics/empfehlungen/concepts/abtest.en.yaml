id: ai.recommend.abtest
type: concept
title: The A/B Test
summary: How apps find out what works.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: rate
    widget: numeric
    prompt: Version A – 1000 visitors, 50 purchases. Version B – 1000 visitors, 65 purchases. By what percent is B better?
    params: { unit: "%" }
    answer: { value: 30 }
    feedback:
      - when: "numval(state.input) == 15"
        misconception: absolute
        text: 15 is the difference in purchases. The question is by what percent B has more.
    hints:
      - 15 more, relative to 50.
    explanation: "15 ÷ 50 = 0.3 – so 30% more purchases."

  - kind: explain
    id: s2
    body: |
      **A/B test:** Visitors are randomly split between two versions. Only one thing differs. So the comparison shows what that one thing does.

  - kind: problem
    id: zufall
    widget: choice
    prompt: Why split visitors randomly – instead of showing A in the morning and B in the evening?
    params:
      options:
        - { label: Otherwise the groups differ in more than the version., correct: true }
        - { label: Randomness is cheaper., feedback: "It is about fair groups, not money." }
    hints:
      - Do people buy differently in the evening than in the morning?
    explanation: Morning and evening customers differ. Randomness makes both groups alike.

  - kind: problem
    id: wenig
    widget: choice
    prompt: With 40 visitors each, B has three more purchases. Is B surely better?
    params:
      options:
        - { label: No – that can be chance., correct: true }
        - { label: "Yes", feedback: "With so few visitors, the numbers fluctuate a lot." }
    hints:
      - How much does the result fluctuate in small groups?
    explanation: Only large groups separate a real effect from chance.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order the steps of an A/B test.
    params:
      items:
        - label: Fix one single change
        - label: Split visitors at random
        - label: Show both versions at the same time
        - label: Compare the results
    hints:
      - First plan, then split, then measure.
    explanation: Chance makes sure the groups differ in one thing only.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A team tests 20 colours for a button at once. One is “significantly better”. How certain is that?
    params:
      options:
        - label: Not very – with 20 comparisons one chance hit is to be expected
          correct: true
        - label: Very certain
          feedback: With many tests you always find something.
        - label: Impossible to say
          feedback: "It can be estimated: 20 · 5% = 1 expected chance hit."
    hints:
      - Each comparison has a 5% false-alarm chance.
    explanation: The winner should be confirmed in a new test.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Version A: {{n}} visitors, {{a}} purchases. Version B: {{n}} visitors, {{b}} purchases. By what percentage do people buy more with B?"
    answer:
      value: "{{100 * (b - a) / a}}"
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == b - a
        misconception: absolute
        text: That is extra purchases, not a percentage.
    hints:
      - The difference is {{b - a}} purchases.
      - "Divide it by A: {{b - a}} / {{a}}."
    explanation: "{{b - a}} / {{a}} = {{(b - a) / a}}, so {{100 * (b - a) / a}} % more. That is the relative difference – the absolute one would be {{100 * (b - a) / n}} percentage points."
    difficulty: 2
    variants:
      params:
        n: choice[1000,2000,5000]
        a: step[40,80,20]
        k: choice[10,20,25,50]
      derive:
        b: a + a * k / 100
      defaults:
        n: 2000
        a: 80
        k: 25

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: A team checks the test daily and stops it as soon as B is "significantly" ahead. What is the problem?
    params:
      options:
        - label: With so many looks, a lucky lead is almost bound to show up at some point.
          correct: true
        - label: None – early success is success.
          feedback: You stop exactly when chance happened to be favourable.
        - label: The test becomes too long.
          feedback: It tends to be stopped too early.
    hints:
      - Each look is like a separate test.
      - Many tests mean many chances of a false alarm.
    explanation: This peeking strongly raises the error rate. Done properly, you fix the duration and sample size in advance – or use methods built for repeated looks.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: how does a filter bubble arise – and what can you do about it yourself?"
    params:
      keywords:
        - - klick
          - verhalten
          - click
          - behaviour
          - behavior
        - - ähnlich
          - gleich
          - bestätig
          - similar
          - same
          - confirm
          - passend
        - - andere
          - vielfalt
          - gezielt
          - verschieden
          - other
          - divers
          - different
          - bewusst
          - deliberate
      sample: The system shows me more of what I click. So I keep seeing similar things and my view is confirmed. It helps to deliberately seek out other sources and topics.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A team tests 20 variants, none really works. Each test gives a chance hit with 5 % probability. How likely is at least one false alarm? In percent, rounded.
    answer:
      value: 64
      tolerance: 1
    feedback:
      - when: numval(state.input) == 5
        misconception: single-test
        text: That is for one test. With 20 tests the risk adds up.
      - when: numval(state.input) == 100
        misconception: additive
        text: Simply computing 20 · 5 % does not work – the cases overlap.
    hints:
      - 'First compute the chance of "no false alarm at all": 0.95²⁰.'
      - 0.95²⁰ ≈ 0.36. The rest is "at least one".
    explanation: "1 − 0.95²⁰ ≈ 0.64. That is why you correct for multiple comparisons, e.g. with the Bonferroni rule: each test then needs 5 % / 20 = 0.25 %."
    difficulty: 3

srs:
  cards_from: [zufall, wenig]
