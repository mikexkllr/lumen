id: ai.recommend.similar
type: concept
title: Measuring Similarity
summary: How close are two tastes?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The taste map
    body: Streaming services put you on a **taste map**. Right means more action, up means more comedy. Drag your dot to where you see yourself. Who is closest to you then?
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 6
        y:
          - 0
          - 6
        showCoordinates: false
        points:
          - id: du
            x: 3
            y: 3
            label: You
          - id: mia
            x: 5
            y: 5
            draggable: false
            label: Mia
          - id: tom
            x: 1
            y: 1
            draggable: false
            label: Tom
          - id: lea
            x: 5
            y: 1
            draggable: false
            label: Lea

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of what people watch on large streaming platforms comes from recommendations?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 75
      tolerance: 12
    explanation: About 70 to 80%. Most choices are pre-made by the algorithm – not by search.

  - kind: problem
    id: abstand
    widget: numeric
    body: Anna rates four films with 5, 1, 4, 2 stars. Ben rates them 4, 2, 4, 1.
    prompt: Add up the differences per film. What is the distance?
    params: { placeholder: "Sum" }
    answer: { value: 3 }
    hints:
      - The differences are 1, 1, 0, and 1.
    explanation: 1 + 1 + 0 + 1 = 3. A small distance means similar taste.

  - kind: explain
    id: s2
    body: |
      Recommendations start with **similarity**. A system measures how close two people or two films are.
      The smaller the distance, the more similar.

  - kind: problem
    id: wer
    widget: choice
    body: You rate three series 5, 1, 3. Carla – 4, 1, 3. David – 1, 5, 2. Eva – 5, 3, 1.
    prompt: Who has the most similar taste?
    params:
      options:
        - { label: Carla, correct: true }
        - { label: David, feedback: "Distance 4 + 4 + 1 = 9. That is almost the opposite." }
        - { label: Eva, feedback: "Distance 0 + 2 + 2 = 4. Carla is closer." }
    hints:
      - Calculate the distance for each person.
    explanation: Carla has distance 1 + 0 + 0 = 1 – closest to you.

  - kind: problem
    id: merkmale
    widget: match
    prompt: What does a system compare films by? Connect them.
    params:
      pairs:
        - { left: Genre, right: Crime or comedy }
        - { left: Length, right: Minutes }
        - { left: Mood, right: Dark or cheerful }
        - { left: Audience, right: Who already liked it }
    hints:
      - Each feature is a number or a category.
    explanation: Such features form a number profile. Similar profiles lie close together.

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: Mia gives action 5 stars and comedy 4. Place your dot so that your distance is exactly 2 – the differences per genre added up.
    params:
      x:
        - 0
        - 8
      y:
        - 0
        - 6
      points:
        - id: du
          x: 1
          y: 1
          label: You
        - id: mia
          x: 5
          y: 4
          draggable: false
          label: Mia
    check:
      predicate: abs(state.points.du.x - 5) + abs(state.points.du.y - 4) == 2
    hints:
      - Right means more action, up means more comedy. Count the squares to Mia.
      - "For example, one star less action and one less comedy: (4, 3)."
    explanation: "For example (4, 3), (3, 4) or (5, 2): the differences add up to 2. To the system, all these dots are equally similar to Mia."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Anna rates three films (5, 1, 4), Ben (4, 2, 4). What is their distance if you **square** the differences, add them and take the root? To one place.
    answer:
      value: 1.4
      tolerance: 0.05
    hints:
      - "Differences: 1, 1, 0."
    explanation: √(1 + 1 + 0) ≈ 1.4 – the **Euclidean distance**, Pythagoras in many dimensions.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Anna rates three films ({{a1}}, {{a2}}, {{a3}}), Ben ({{b1}}, {{b2}}, {{b3}}). How big is the distance if you add up the differences without signs?
    answer:
      value: "{{abs(a1 - b1) + abs(a2 - b2) + abs(a3 - b3)}}"
    hints:
      - "Go film by film: how far apart are the stars?"
      - Add the three gaps.
    explanation: "{{abs(a1 - b1)}} + {{abs(a2 - b2)}} + {{abs(a3 - b3)}} = {{abs(a1 - b1) + abs(a2 - b2) + abs(a3 - b3)}}. This measure is called the Manhattan distance – like walking through a street grid."
    difficulty: 2
    variants:
      params:
        a1: int[1,5]
        a2: int[1,5]
        a3: int[1,5]
        b1: int[1,5]
        b2: int[1,5]
        b3: int[1,5]
      constraints:
        - a1 != b1
        - a2 != b2
      defaults:
        a1: 5
        a2: 2
        a3: 4
        b1: 3
        b2: 3
        b3: 4

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Lea almost always gives 4 or 5 stars, Tom mostly 1 or 2. How does a system make their ratings comparable?
    params:
      options:
        - label: Subtract each person's own average from their ratings.
          correct: true
        - label: Delete Tom's ratings.
          feedback: Then valuable data is lost – Tom is just stricter.
        - label: Set all ratings to 3.
          feedback: Then all information is gone.
    hints:
      - For Lea a 4 is rather weak; for Tom it would be praise.
      - What matters is how a film compares with one's own average.
    explanation: After centring, +1 means "better than my average". That way strict and generous raters fit together.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Lea rates everything 4 to 5 stars, Tom everything 1 to 2 – but both like the same films best. Which measure recognises their similarity?
    params:
      options:
        - label: The angle between their ratings – cosine similarity
          correct: true
        - label: The simple distance
          feedback: That would be large because Tom’s numbers are smaller everywhere.
        - label: The number of rated films
          feedback: That says nothing about taste.
    hints:
      - What matters is the direction, not the length.
    explanation: "**Cosine similarity** compares patterns rather than magnitudes. It is in almost every search and every language model."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Lea gives three films 5, 4 and 3 stars. What is her centred rating for the third film?
    answer:
      value: -1
    feedback:
      - when: numval(state.input) == 3
        misconception: raw
        text: That is the raw rating. Subtract her average.
    hints:
      - Her average is (5 + 4 + 3) / 3.
      - Compute 3 − 4.
    explanation: 3 − 4 = −1. Taking the cosine of the angle between centred ratings gives the Pearson correlation – a standard measure of taste similarity.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a recommender measures whether two people have similar taste.
    params:
      keywords:
        - - bewert
          - sterne
          - rating
          - stars
        - - abstand
          - unterschied
          - distance
          - difference
        - - klein
          - nah
          - ähnlich
          - small
          - close
          - similar
      sample: It compares their ratings film by film and computes a distance. The smaller the distance, the more similar their taste. Often each person's own average is subtracted first.
    difficulty: 3

srs:
  cards_from: [abstand, wer]
