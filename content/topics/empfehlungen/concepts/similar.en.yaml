id: ai.recommend.similar
type: concept
title: Measuring Similarity
summary: How close are two tastes?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of what people watch on large streaming platforms comes from recommendations?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 75
      tolerance: 12
    explanation: About 70 to 80%. Most choices are pre-made by the algorithm – not by search.


  - kind: problem
    id: abstand
    widget: numeric
    body: Anna rates four films with 5, 1, 4, 2 stars. Ben rates them 4, 2, 4, 1.
    prompt: Add up the differences per film. What is the distance?
    params: { placeholder: "Sum" }
    answer: { value: 3 }
    hints:
      - The differences are 1, 1, 0, and 1.
    explanation: 1 + 1 + 0 + 1 = 3. A small distance means similar taste.

  - kind: explain
    id: s2
    body: |
      Recommendations start with **similarity**. A system measures how close two people or two films are.
      The smaller the distance, the more similar.

  - kind: problem
    id: wer
    widget: choice
    body: You rate three series 5, 1, 3. Carla – 4, 1, 3. David – 1, 5, 2. Eva – 5, 3, 1.
    prompt: Who has the most similar taste?
    params:
      options:
        - { label: Carla, correct: true }
        - { label: David, feedback: "Distance 4 + 4 + 1 = 9. That is almost the opposite." }
        - { label: Eva, feedback: "Distance 0 + 2 + 2 = 4. Carla is closer." }
    hints:
      - Calculate the distance for each person.
    explanation: Carla has distance 1 + 0 + 0 = 1 – closest to you.

  - kind: problem
    id: merkmale
    widget: match
    prompt: What does a system compare films by? Connect them.
    params:
      pairs:
        - { left: Genre, right: Crime or comedy }
        - { left: Length, right: Minutes }
        - { left: Mood, right: Dark or cheerful }
        - { left: Audience, right: Who already liked it }
    hints:
      - Each feature is a number or a category.
    explanation: Such features form a number profile. Similar profiles lie close together.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Anna rates three films (5, 1, 4), Ben (4, 2, 4). What is their distance if you **square** the differences, add them and take the root? To one place.
    answer:
      value: 1.4
      tolerance: 0.05
    hints:
      - "Differences: 1, 1, 0."
    explanation: √(1 + 1 + 0) ≈ 1.4 – the **Euclidean distance**, Pythagoras in many dimensions.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Lea rates everything 4 to 5 stars, Tom everything 1 to 2 – but both like the same films best. Which measure recognises their similarity?
    params:
      options:
        - label: The angle between their ratings – cosine similarity
          correct: true
        - label: The simple distance
          feedback: That would be large because Tom’s numbers are smaller everywhere.
        - label: The number of rated films
          feedback: That says nothing about taste.
    hints:
      - What matters is the direction, not the length.
    explanation: "**Cosine similarity** compares patterns rather than magnitudes. It is in almost every search and every language model."
    difficulty: 3

srs:
  cards_from: [abstand, wer]
