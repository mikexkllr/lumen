id: ai.recommend.collab
type: concept
title: People Like You Also Liked …
summary: Recommending from the behavior of others.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Recommended by a detour
    body: “People who liked this also liked …” – that is how big shops recommend. Tap your way from you via a film to a person with **similar taste**. Where do you end up?
    visual:
      widget: network
      interactive: true
      params:
        start: du
        nodes:
          - id: du
            x: 8
            y: 50
            label: You
          - id: f1
            x: 35
            y: 18
            label: Crime
          - id: f2
            x: 35
            y: 82
            label: Docu
          - id: lea
            x: 62
            y: 18
            label: Lea
          - id: ben
            x: 62
            y: 82
            label: Ben
          - id: f3
            x: 88
            y: 18
            label: Anime
          - id: f4
            x: 88
            y: 82
            label: Western
        edges:
          - a: du
            b: f1
          - a: du
            b: f2
          - a: f1
            b: lea
          - a: f2
            b: lea
          - a: f2
            b: ben
          - a: lea
            b: f3
          - a: ben
            b: f4

  - kind: problem
    id: empfehlen
    widget: choice
    body: Carla has almost the same taste as you. She loves a series you do not know yet.
    prompt: What will a system probably recommend to you?
    params:
      options:
        - { label: Exactly that series, correct: true }
        - { label: The most-watched series overall, feedback: "That would be a simple top list – unrelated to you." }
        - { label: "A series that Carla does not like", feedback: "Her taste is similar to yours." }
    hints:
      - What did the system just measure similarity for?
    explanation: This is called **collaborative filtering** – similar people help each other without knowing it.

  - kind: explain
    id: s2
    body: |
      There are two basic ideas. **Content-based** – you liked crime shows, here is another one.
      **Collaborative** – people like you also liked this.

  - kind: problem
    id: art
    widget: buckets
    prompt: Content-based or collaborative?
    params:
      buckets: [{ label: content-based }, { label: collaborative }]
      items:
        - { label: More from the same director, bucket: content-based }
        - { label: A song at the same tempo, bucket: content-based }
        - { label: "People who bought this also bought …", bucket: collaborative }
        - { label: Popular with similar listeners, bucket: collaborative }
    hints:
      - Is it about properties of the item – or about other people?
    explanation: Many services mix both.

  - kind: problem
    id: kaltstart
    widget: choice
    prompt: A brand-new film has no ratings yet. Which method can still recommend it?
    params:
      options:
        - { label: Content-based, correct: true }
        - { label: Collaborative, feedback: "Without ratings, nobody knows which people like it." }
    hints:
      - What do you know about a film without viewers?
    explanation: This is the **cold-start problem**. Features like genre help until ratings arrive.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: “Customers who bought this also bought …”
          right: true
        - text: "“Because you watched a crime show: another crime show.”"
          right: false
        - text: “People with similar taste are listening to this now.”
          right: true
        - text: “Similar ingredients to your last recipe.”
          right: false
      left: Content-based
      right: Collaborative

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Which basic idea is behind it?
    params:
      buckets:
        - id: b1
          label: Content-based
        - id: b2
          label: Collaborative
      items:
        - label: “You like thrillers – here is one more.”
          bucket: b1
        - label: “People with your taste heard this.”
          bucket: b2
        - label: “Similar to your last film.”
          bucket: b1
        - label: “Customers also bought …”
          bucket: b2
    hints:
      - Is it about the item itself – or about other people?
    explanation: Most services mix both ideas.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A new user signs up and has not rated anything yet. What is the problem?
    params:
      options:
        - label: Without data the system finds no similar users – the cold start
          correct: true
        - label: The account is locked
          feedback: Only data are missing.
        - label: There is none
          feedback: Without behaviour there is nothing to compare.
    hints:
      - Whom does someone resemble about whom nothing is known?
    explanation: The **cold start problem**. That is why apps ask for favourite genres at the start.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Three users with similar taste gave a film {{a}}, {{b}} and {{c}} stars. Which rating does the system predict for you?
    answer:
      value: "{{(a + b + c) / 3}}"
      tolerance: 0.01
    hints:
      - Take the neighbours' average.
      - ({{a}} + {{b}} + {{c}}) / 3.
    explanation: ({{a}} + {{b}} + {{c}}) / 3 = {{(a + b + c) / 3}}. That is collaborative filtering in its simplest form.
    difficulty: 2
    variants:
      params:
        a: int[1,5]
        b: int[1,5]
        c: int[1,5]
      constraints:
        - (a + b + c) % 3 == 0
        - a != b
      defaults:
        a: 4
        b: 5
        c: 3

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: A very similar user (similarity 0.9) gave 5 stars, a less similar one (0.3) gave 2. What is the weighted average?
    answer:
      value: 4.25
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 3.5
        misconception: unweighted
        text: That is the plain average. The more similar user should count more.
    hints:
      - Compute (0.9 · 5 + 0.3 · 2) and divide by the sum of the weights.
      - (4.5 + 0.6) / 1.2 = ?
    explanation: 5.1 / 1.2 = 4.25. Similar users get more weight – their opinion says more about your taste.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A table of 1 million users and 100,000 films is almost empty. How are the gaps filled?
    params:
      options:
        - label: Each user and each film is described by a few hidden features and these are multiplied
          correct: true
        - label: The average is entered everywhere
          feedback: Then everyone would get the same recommendations.
        - label: Everyone is asked to rate everything
          feedback: Nobody watches 100,000 films.
    hints:
      - Perhaps 50 numbers suffice to describe a taste.
    explanation: "**Matrix factorisation**: the system learns the features itself – such as “how much action”, “how serious”."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A system describes you with the vector (2, 1) – say "likes action", "likes humour". A film has the vector (1.5, 1). The prediction is the dot product. What is it?
    answer:
      value: 4
    hints:
      - "Dot product: multiply pairs, then add."
      - 2 · 1.5 + 1 · 1 = ?
    explanation: 3 + 1 = 4 stars. In matrix factorisation the system learns such vectors for all users and films from the known ratings. The axes usually have no clear meaning.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how "people like you also liked …" works.
    params:
      keywords:
        - - ähnlich
          - gleich
          - similar
          - like you
        - - bewert
          - mochten
          - gefallen
          - rated
          - liked
        - - vorher
          - empfehl
          - empfiehl
          - predict
          - recommend
      sample: The system looks for people who have rated things similarly to you. Films they liked that you have not seen yet get recommended to you.
    difficulty: 3

srs:
  cards_from: [art, kaltstart]
