id: bio.life.cells
type: concept
title: "Everything is made of cells"
summary: "The cell is the smallest living unit."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Discovering the cell
    body: Every person, every tree, every midge is built from tiny building blocks. But for a long time nobody knew. Uncover how researchers discovered the **cell**, step by step.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 💧
            front: "1674: Life in a drop"
            back: Antoni van Leeuwenhoek sees tiny animals in water through lenses he made himself.
          - icon: 🌿
            front: "1838: Plants made of cells"
            back: "Matthias Schleiden realises: every plant is built from cells."
          - icon: 🐟
            front: "1839: Animals too"
            back: Theodor Schwann shows the same for animals. The cell is the building block of all life.
          - icon: 🧫
            front: "1855: Cell from cell"
            back: "Rudolf Virchow writes: every cell comes from a cell."

  - kind: problem
    id: start-baustein
    widget: choice
    prompt: What is every living thing made of – whether human, tree or mosquito?
    params:
      options:
        - label: Of cells
          correct: true
        - label: Of wood
          feedback: Only trees have wood. And even wood is made of cells.
        - label: Of sand
          feedback: Sand is not a building block of life.
    hints:
      - The intro names the tiny building block.
      - Schleiden and Schwann found it in plants and animals.
    explanation: All living things are made of cells – from a bacterium to a blue whale.

  - kind: problem
    id: start-mikroskop
    widget: choice
    prompt: Most cells are tiny. What do you need to see them?
    params:
      options:
        - label: A microscope
          correct: true
        - label: The naked eye
          feedback: Almost all cells are far too small for that.
        - label: Binoculars
          feedback: Binoculars bring distant things closer. They do not magnify tiny things enough.
    hints:
      - Leeuwenhoek built his own lenses for this.
      - You are looking for a device that greatly magnifies tiny things.
    explanation: Only the microscope made cells visible. Before that, nobody knew they existed.

  - kind: problem
    id: hook
    widget: estimate
    prompt: How many cells make up your body? Take a guess – in trillions.
    params:
      min: 1
      max: 1000
      scale: log
      unit: trillion
    answer:
      value: 37
      within: 50
    explanation: About 37 trillion – a 37 followed by twelve zeros. Roughly as many bacteria live in and on you.

  - kind: explain
    id: c1
    body: The **cell** is the smallest unit that is alive on its own. Every living thing is made of one cell or of many. New cells only come from cells, by division.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Single-celled or multicellular?
    params:
      buckets:
        - id: b1
          label: Single-celled
        - id: b2
          label: Multicellular
      items:
        - label: Bacterium
          bucket: b1
        - label: Baker’s yeast
          bucket: b1
        - label: Paramecium
          bucket: b1
        - label: Earthworm
          bucket: b2
        - label: Oak tree
          bucket: b2
        - label: Button mushroom
          bucket: b2
    hints:
      - Could this living thing be a single cell?
      - You can only see yeast and paramecia under a microscope.
    explanation: Bacteria, yeast and paramecia are single cells. The worm, the tree and the mushroom are made of billions of cells.

  - kind: problem
    id: start-teilung
    widget: numeric
    prompt: One cell divides into two. Then both divide once more. How many cells are there now?
    params:
      unit: cells
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: one-divides
        text: "**Both** cells divide. So 2 become 4."
    hints:
      - After the first division there are 2 cells.
      - "Each of the two becomes two again: 2 · 2."
    explanation: 1 → 2 → 4. Each division doubles the number of cells.

  - kind: problem
    id: c3
    widget: numeric
    prompt: A bacterium divides every 20 minutes. One cell becomes two, then four. How many cells are there after {{h}} hours?
    answer:
      value: "{{2 ** (3 * h)}}"
    feedback:
      - when: numval(state.input) == 6 * h
        misconception: linear-growth
        text: Each division doubles, it does not add. Multiply 2 · 2 · 2 …
    hints:
      - How many divisions fit into {{h}} hours?
      - That is {{3 * h}} divisions. Double that many times, starting from 1.
    explanation: "{{h}} hours are {{3 * h}} divisions: 2 to the power {{3 * h}} = {{2 ** (3 * h)}} cells."
    variants:
      params:
        h: int[1,3]
      defaults:
        h: 2

  - kind: problem
    id: c4
    widget: choice
    prompt: Where did the very first cell of your body come from?
    params:
      options:
        - label: An egg cell and a sperm cell fused into one cell.
          correct: true
        - label: It formed by itself from food.
          feedback: Cells never form anew from dead matter. They always come from cells.
        - label: It formed from air and water.
          feedback: Air and water supply matter, but not cells.
    hints:
      - New cells only come from cells.
      - At fertilisation two cells fuse.
    explanation: The fertilised egg divides again and again. All 37 trillion cells come from it.

  - kind: explain
    id: d1
    depth: 2
    body: Why is the cell called a "cell" at all?
    reveal:
      body: In 1665 Robert Hooke looked at cork through his microscope and saw lots of tiny chambers. They reminded him of monks’ cells. The Latin word cella means small room.

  - kind: explain
    id: d2
    depth: 2
    body: '**Cell theory** says: all living things are made of cells. The cell is the basic unit of life. Every cell comes from a cell. Rudolf Virchow wrote in 1855: "Omnis cellula e cellula".'

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: You have about 25 trillion red blood cells. Each lives about 120 days. How many billion must you replace per day? Round to a whole number.
    params:
      unit: billion
    answer:
      value: 208
      tolerance: 2
    feedback:
      - when: numval(state.input) == 25
        misconception: whole-stock
        text: That is the whole stock. Spread it over 120 days.
    hints:
      - Every 120 days the whole stock is replaced once.
      - 25,000 billion divided by 120.
    explanation: 25,000 billion ÷ 120 ≈ 208 billion per day. That is about 2.4 million per second!
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: choice
    prompt: Red blood cells are the most common cells in your body. Yet they make up only a small share of cell mass. Why?
    params:
      options:
        - label: They are tiny. Muscle and fat cells are much larger.
          correct: true
        - label: They are made only of air.
          feedback: They carry oxygen, but they are full of haemoglobin and water.
        - label: They are not counted.
          feedback: They are counted – and they are the majority.
    hints:
      - Mass depends on number and size.
      - A red blood cell is only about 8 µm across.
    explanation: Many small cells weigh less than a few large ones. Muscle fibres can be centimetres long.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A roundworm called C. elegans has exactly 959 body cells as an adult (hermaphrodite). What makes it so valuable for research?
    params:
      options:
        - label: You can follow the fate of every single cell.
          correct: true
        - label: It has no nerve cells at all.
          feedback: It has 302 nerve cells – and a fully mapped nerve network.
        - label: Its cells never divide.
          feedback: They divide during development following a fixed plan.
    hints:
      - With 959 cells, each one can be named.
      - Researchers have mapped the family tree of all its cells.
    explanation: For C. elegans the cell lineage from egg to worm is known. It earned the 2002 Nobel Prize.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Explain to Lux: what does cell theory say?"
    params:
      keywords:
        - - zelle
          - cell
        - - alle lebewesen
          - alles leben
          - jedes lebewesen
          - all living
          - every living
          - all life
        - - teil
          - abstamm
          - stammt
          - divid
          - come from
          - comes from
          - arise
        - - einheit
          - kleinst
          - grundbau
          - unit
          - smallest
          - basic
      sample: All living things are made of cells. The cell is the smallest living unit. Every cell comes from another cell, by division.
    explanation: "Three statements: all life is made of cells, the cell is the basic unit, and cells only arise from cells."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d3"]
