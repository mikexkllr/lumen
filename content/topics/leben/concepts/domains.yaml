id: bio.life.domains
type: concept
title: "Ordnung in der Vielfalt"
summary: "Arten, Namen, Stammbaum-Ränge und die drei Domänen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Dein Platz im Stammbaum
    body: Alles Leben hängt an einem einzigen Stammbaum. Tippe dich von »Du« zu den Archaeen. Dann such den Weg zu den Bakterien. Wer ist näher mit dir verwandt? Die drei großen Äste heißen **Domänen**.
    visual:
      widget: network
      interactive: true
      params:
        start: D
        unit: Schritte
        nodes:
          - id: R
            x: 12
            y: 50
            label: Urzelle
          - id: B
            x: 80
            y: 10
            label: Bakterien
          - id: X
            x: 42
            y: 62
            label: ◆
          - id: A
            x: 80
            y: 40
            label: Archaeen
          - id: E
            x: 58
            y: 84
            label: ◇
          - id: P
            x: 86
            y: 66
            label: Pflanzen
          - id: D
            x: 86
            y: 94
            label: Du
        edges:
          - a: R
            b: B
          - a: R
            b: X
          - a: X
            b: A
          - a: X
            b: E
          - a: E
            b: P
          - a: E
            b: D

  - kind: problem
    id: start-verwandt
    widget: choice
    prompt: Wer ist am engsten mit dem Hund verwandt?
    params:
      options:
        - label: Der Wolf
          correct: true
        - label: Die Forelle
          feedback: Ein Fisch ist nur sehr entfernt mit dem Hund verwandt.
        - label: Die Eiche
          feedback: Auch Hund und Baum sind verwandt – aber nur sehr, sehr entfernt.
    hints:
      - Wer sieht dem Hund am ähnlichsten?
      - Hunde stammen von einem dieser drei ab.
    explanation: Hunde stammen vom Wolf ab. Je mehr zwei Lebewesen gemeinsam haben, desto enger sind sie meist verwandt.

  - kind: problem
    id: start-gruppe
    widget: buckets
    prompt: "Bring Ordnung hinein: Tier oder Pflanze?"
    params:
      buckets:
        - id: b1
          label: Tier
        - id: b2
          label: Pflanze
      items:
        - label: Spatz
          bucket: b1
        - label: Forelle
          bucket: b1
        - label: Biene
          bucket: b1
        - label: Eiche
          bucket: b2
        - label: Tulpe
          bucket: b2
        - label: Moos
          bucket: b2
    hints:
      - Was bewegt sich fort und frisst?
      - Eiche, Tulpe und Moos sind grün und wachsen an einem Ort.
    explanation: "So beginnt jede Ordnung: Ähnliches kommt in dieselbe Gruppe. Die Biologie ordnet genauso – nur viel feiner."

  - kind: problem
    id: hook
    widget: estimate
    prompt: Wie viele Arten haben Forschende bisher beschrieben? Schätz mal – in Millionen.
    params:
      min: 0.1
      max: 100
      scale: log
      unit: Millionen
    answer:
      value: 2
      within: 50
    explanation: Rund 2 Millionen. Geschätzt gibt es aber viel mehr – allein bei Lebewesen mit Zellkern vielleicht 8 bis 9 Millionen.

  - kind: explain
    id: c1
    body: Eine **Art** ist eine Gruppe von Lebewesen, die miteinander fruchtbaren Nachwuchs bekommen. Pferd und Esel sind zwei Arten. Ihr Junges, das Maultier, ist fast immer unfruchtbar.

  - kind: problem
    id: start-art
    widget: choice
    prompt: Ein Dackel und ein Pudel bekommen Welpen. Die Welpen können später selbst Junge haben. Was folgt daraus?
    params:
      options:
        - label: Dackel und Pudel gehören zur selben Art.
          correct: true
        - label: Dackel und Pudel sind zwei Arten.
          feedback: Dann wäre ihr Nachwuchs meist unfruchtbar – wie das Maultier.
        - label: Daraus folgt nichts.
          feedback: "Doch: Fruchtbarer Nachwuchs ist genau das Merkmal einer Art."
    hints:
      - Lies noch einmal nach, was eine Art ausmacht.
      - "Fruchtbarer Nachwuchs heißt: dieselbe Art."
    explanation: Alle Hunde gehören zu einer Art, so verschieden sie auch aussehen.

  - kind: explain
    id: c3
    body: Linné ordnete Arten in Stufen. Ähnliche Arten bilden eine Gattung. Darüber folgen Familie, Ordnung, Klasse, Stamm und Reich. Ganz oben steht die **Domäne**.

  - kind: problem
    id: c4
    widget: order
    prompt: Ordne die Stufen von groß nach klein.
    params:
      items:
        - label: Domäne
        - label: Reich
        - label: Stamm
        - label: Klasse
        - label: Ordnung
        - label: Familie
        - label: Gattung
        - label: Art
      startLabel: umfassend
      endLabel: eng
    hints:
      - Ganz oben stehen nur drei Gruppen, ganz unten Millionen.
      - "Merksatz: Der Riese Steht Kaum Ohne Feste Gummistiefel Auf."
    explanation: "Domäne, Reich, Stamm, Klasse, Ordnung, Familie, Gattung, Art. Der Mensch: Eukaryoten, Tiere, Chordatiere, Säugetiere, Primaten, Menschenaffen, Homo, Homo sapiens."

  - kind: problem
    id: c2
    widget: choice
    prompt: Wolf heißt Canis lupus, Kojote heißt Canis latrans. Was verrät das über die beiden?
    params:
      options:
        - label: Beide gehören zur selben Gattung, aber zu zwei Arten.
          correct: true
        - label: Sie sind dieselbe Art.
          feedback: Der zweite Teil des Namens unterscheidet sich – also zwei Arten.
        - label: Sie sind nicht verwandt.
          feedback: Der gleiche erste Name zeigt enge Verwandtschaft.
    hints:
      - Ein Artname hat zwei Teile.
      - Der erste Teil ist die Gattung, der zweite die Art.
    explanation: "Seit Carl von Linné hat jede Art einen Doppelnamen: Gattung plus Art. Wir heißen Homo sapiens."

  - kind: explain
    id: c5
    body: "Alles Leben teilt man in drei Domänen: Bakterien, Archaeen und Eukaryoten. Nur **Eukaryoten** haben einen Zellkern. Dazu gehören Tiere, Pflanzen, Pilze – und du."

  - kind: problem
    id: c6
    widget: buckets
    prompt: In welche Domäne gehört es?
    params:
      buckets:
        - id: b1
          label: Bakterien
        - id: b2
          label: Archaeen
        - id: b3
          label: Eukaryoten
      items:
        - label: Darmbakterium E. coli
          bucket: b1
        - label: Milchsäurebakterien im Joghurt
          bucket: b1
        - label: Methanbildner im Kuhmagen
          bucket: b2
        - label: Sonnenblume
          bucket: b3
        - label: Steinpilz
          bucket: b3
        - label: Bäckerhefe
          bucket: b3
    hints:
      - Hat das Lebewesen einen Zellkern?
      - Hefe ist ein Pilz – also ein Eukaryot.
    explanation: "Methanbildner sind Archaeen: Sie sehen aus wie Bakterien, sind aber eine eigene Domäne. Pilze und Hefe haben einen Zellkern."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Pilze galten lange als Pflanzen. Mit wem sind sie heute nach Stammbaum näher verwandt?
    params:
      options:
        - label: Mit den Tieren
          correct: true
        - label: Mit den Pflanzen
          feedback: Pilze machen keine Photosynthese und speichern Glykogen wie Tiere, nicht Stärke.
        - label: Mit den Bakterien
          feedback: Pilze haben einen Zellkern – sie sind Eukaryoten.
    hints:
      - Vergleiche Ernährung und Speicherstoff.
      - Pilze fressen andere Stoffe, statt Licht zu nutzen.
    explanation: "Erbgutvergleiche zeigen: Pilze und Tiere haben einen gemeinsamen Vorfahren, der nach der Trennung von den Pflanzen lebte."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: Stimmt das?
    params:
      cards:
        - text: Ein Wal ist ein Fisch.
          right: false
          why: "Wale sind Säugetiere: Sie atmen Luft und säugen ihre Jungen."
        - text: Archaeen sind keine Bakterien, sondern eine eigene Domäne.
          right: true
          why: Ihre Zellwand und ihre Gene unterscheiden sich stark.
        - text: Pilze machen Photosynthese.
          right: false
          why: Pilze haben kein Chlorophyll. Sie zersetzen andere Stoffe.
        - text: Hefe ist ein Pilz.
          right: true
          why: Hefe ist ein einzelliger Pilz.
        - text: Der Mensch gehört zu den Primaten.
          right: true
          why: Wie Schimpansen, Gorillas und Lemuren.
    explanation: Ordnung folgt der Verwandtschaft, nicht dem Aussehen.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Heute ordnet man nach Abstammung. Eine gute Gruppe umfasst einen Vorfahren und alle seine Nachfahren. Das heißt **monophyletisch**. Die »Fische« sind keine solche Gruppe. Ihre Nachfahren an Land fehlen darin – auch wir.

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Sind Reptilien ohne die Vögel eine gute Gruppe im Stammbaum? Warum nicht?
    params:
      options:
        - label: Vögel stammen von Dinosauriern ab – sie sind Nachfahren derselben Ahnen.
          correct: true
        - label: Weil Vögel fliegen können.
          feedback: Fliegen ist kein Kriterium. Es zählt nur die Abstammung.
        - label: Weil Reptilien kaltblütig sind.
          feedback: Körperwärme ist ein Merkmal, keine Verwandtschaft.
    hints:
      - Wer gehört zu den Nachfahren des gemeinsamen Ahnen?
      - Krokodile sind mit Vögeln näher verwandt als mit Eidechsen.
    explanation: Lässt man die Vögel weg, fehlt ein Teil der Nachfahren. Fachleute nennen so eine Gruppe paraphyletisch.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was ist eine Art, und wie bekommt sie ihren Namen?"
    params:
      keywords:
        - - nachwuchs
          - fortpflanz
          - junge
          - offspring
          - breed
          - reproduc
        - - fruchtbar
          - fertil
        - - gattung
          - genus
        - - zwei
          - doppel
          - two
          - homo sapiens
      sample: "Eine Art sind Lebewesen, die zusammen fruchtbaren Nachwuchs bekommen. Jede Art hat einen Namen aus zwei Teilen: Gattung und Art, zum Beispiel Homo sapiens."
    explanation: Fruchtbarer Nachwuchs grenzt Arten ab, der Doppelname ordnet sie in Gattungen.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "c6"]
