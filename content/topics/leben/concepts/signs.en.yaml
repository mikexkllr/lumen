id: bio.life.signs
type: concept
title: "Signs of life"
summary: "Cells, metabolism, growth, reproduction and stimuli."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Life at the limit
    body: "Life can take more than you think: heat, cold, even outer space. But how do you tell that something is alive at all? Uncover the cards. All these living things share a few **signs**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐻
            front: Water bears in space
            back: Dried out, they survived ten days in open space in 2007 – and carried on living afterwards.
          - icon: 🌋
            front: Life at 122 °C
            back: A single-celled organism from the deep sea still grows at 122 °C. Water only stays liquid there under high pressure.
          - icon: 🌲
            front: A tree almost 5,000 years old
            back: The pine “Methuselah” in California sprouted even before the pyramids were built.

  - kind: problem
    id: start-lebt
    widget: swipe
    prompt: "To warm up: is it alive? Swipe left or right."
    params:
      cards:
        - text: A dog
          right: true
        - text: A rock
          right: false
        - text: A daisy
          right: true
          why: Plants are alive too. They grow and make seeds.
        - text: A bicycle
          right: false
      left: not alive
      right: alive
    explanation: Animals and plants are alive, rocks and machines are not. It gets trickier in a moment.

  - kind: problem
    id: start-katze
    widget: choice
    prompt: What can a cat do that a rock cannot?
    params:
      options:
        - label: Grow and have young
          correct: true
        - label: Be heavy
          feedback: Rocks are heavy too. Weight says nothing about life.
        - label: Get warm in the sun
          feedback: A rock manages that just as well.
    hints:
      - What happens to a kitten over the course of a year?
      - A rock stays as it is. A cat gets bigger and has offspring.
    explanation: Living things grow and reproduce. These are two signs of life – you will soon get to know them all.

  - kind: problem
    id: hook
    widget: swipe
    prompt: Is it alive? Swipe left or right.
    params:
      cards:
        - text: A mushroom in the forest
          right: true
          why: Fungi are living things – neither plants nor animals.
        - text: A growing crystal
          right: false
          why: It grows, but it has no cells and no metabolism.
        - text: Yeast in bread dough
          right: true
          why: Yeast is made of tiny cells. It eats sugar and makes gas.
        - text: A candle flame
          right: false
          why: It "eats" wax and grows. But it has no cells and passes nothing on.
        - text: A seed in winter
          right: true
          why: It is only resting. In spring it sprouts.
        - text: A robot charging its battery
          right: false
          why: It takes in energy, but it is not made of cells and cannot build copies of itself.
      left: not alive
      right: alive
    explanation: Growing or taking in energy is not enough. Living things are made of cells and reproduce.

  - kind: explain
    id: c1
    body: Living things share a few **signs of life**. They are made of cells and have a metabolism. They grow, reproduce and respond to stimuli. A single trait is not enough.

  - kind: problem
    id: start-reiz
    widget: choice
    prompt: You step into bright sunlight and squint. What is the stimulus here?
    params:
      options:
        - label: The bright light
          correct: true
        - label: The squinting
          feedback: That is the response. The stimulus is what triggers it.
        - label: Your eyes
          feedback: The eyes only sense the stimulus.
    hints:
      - A stimulus comes from outside and triggers something.
      - What are your eyes reacting to?
    explanation: The light is the stimulus, the squinting is the response. Responding to stimuli is one of the signs of life.

  - kind: explain
    id: c3
    body: In **metabolism**, a living thing takes in matter, transforms it and releases waste. That gives it energy and building material for its body.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Which sign of life does each observation show?
    params:
      buckets:
        - id: b1
          label: Responding to stimuli
        - id: b2
          label: Metabolism
        - id: b3
          label: Reproduction
      items:
        - label: Snail pulls in its feelers
          bucket: b1
        - label: Pupils shrink in bright light
          bucket: b1
        - label: Cow eats grass, makes dung
          bucket: b2
        - label: You breathe in O₂, out CO₂
          bucket: b2
        - label: Dandelion scatters seeds
          bucket: b3
        - label: Bacterium splits in two
          bucket: b3
    hints:
      - "Ask yourself: is it reacting, processing matter, or making offspring?"
      - Pupils and feelers react to something from outside.
    explanation: Stimuli trigger responses. Metabolism processes matter. Reproduction makes offspring.

  - kind: problem
    id: c4
    widget: choice
    prompt: A car takes in fuel, burns it and releases exhaust. Why is it still not alive?
    params:
      options:
        - label: It is not made of cells and does not build copies of itself.
          correct: true
        - label: It has no metabolism.
          feedback: Fuelling and burning resemble a metabolism. Other signs are missing.
        - label: It does not move by itself.
          feedback: Movement alone decides nothing. Plants do not walk around either.
    hints:
      - Go through the signs one by one.
      - What is a car made of? And who builds new cars?
    explanation: Only all the signs together make up life. The car lacks cells and reproduction.

  - kind: problem
    id: c5
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Living things are made of [[cells]]. They have a [[metabolism]] and respond to [[stimuli]].
      distractors:
        - atoms
        - engine
        - colours
    explanation: You just sorted these three signs.

  - kind: explain
    id: d1
    depth: 2
    body: Living things keep conditions inside stable, even when a lot changes outside. This is called **homeostasis**. You sweat in the heat and shiver in the cold. That keeps you at about 37 °C.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: You jog in the sun. How does your body keep its temperature?
    params:
      options:
        - label: It sweats. Evaporating sweat cools the skin.
          correct: true
        - label: It shivers.
          feedback: Shivering makes heat. That helps against cold, not heat.
        - label: Not at all, the temperature simply rises.
          feedback: Then you would have a fever within minutes. The body works against it.
    hints:
      - What happens to your skin during exercise?
      - Water that evaporates takes heat with it.
    explanation: "Sweating is homeostasis: the body senses a change and corrects it."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Viruses are a borderline case. True or false?
    params:
      cards:
        - text: A virus contains genetic material.
          right: true
          why: Viruses carry DNA or RNA.
        - text: A virus has its own metabolism.
          right: false
          why: It uses the metabolism of its host cell.
        - text: A virus reproduces without a host cell.
          right: false
          why: Outside a cell, a virus is just a particle.
        - text: Viruses change through evolution.
          right: true
          why: New flu variants show this every year.
    explanation: Viruses have genes and evolve, but no cells.
    difficulty: 2

  - kind: explain
    id: d4
    depth: 2
    body: So are viruses living things?
    reveal:
      body: That is debated. Viruses have genes and evolve. But they have no cells and no metabolism of their own. Many therefore call them borderline cases of life.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A NASA working definition says: life is a self-sustaining chemical system capable of Darwinian evolution. What does not count as life by this definition?"
    params:
      options:
        - label: A computer virus that copies itself
          correct: true
        - label: A bacterium
          feedback: Es erhält sich selbst, ist chemisch und evolviert. Das passt genau.
        - label: A mould fungus
          feedback: Pilze sind chemische Systeme mit Stoffwechsel und Evolution.
    hints:
      - "Check every word of the definition: chemical, self-sustaining, evolution."
      - What is a computer virus made of?
    explanation: A computer virus is information, not a chemical system. It copies itself only using other machines.
    difficulty: 3

  - kind: explain
    id: x2
    depth: 3
    body: Living things build order without breaking a law of nature. They take in ordered energy, such as food or light. They give off heat and increase disorder outside. They export **entropy**.

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: "Explain to Lux: how can you tell whether something is alive?"
    params:
      keywords:
        - - zelle
          - cell
        - - stoffwechsel
          - energie
          - nahrung
          - metabol
          - energy
          - food
        - - vermehr
          - fortpflanz
          - nachwuchs
          - teil
          - reproduc
          - offspring
          - divid
        - - reiz
          - reagier
          - stimul
          - respon
          - react
      sample: A living thing is made of cells and has a metabolism that supplies energy. It grows, reproduces and reacts to stimuli. Only all of it together counts.
    explanation: No single trait is enough. Only cells, metabolism, growth, reproduction and responsiveness together make a living thing.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "d2"]
