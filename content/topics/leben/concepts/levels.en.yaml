id: bio.life.levels
type: concept
title: "From molecule to biosphere"
summary: "Levels of organisation and why the whole is more than its parts."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: How many atoms are in a single body cell? Take a guess.
    params:
      min: 1000000
      max: 100000000000000000000
      scale: log
    answer:
      value: 100000000000000
      within: 80
    explanation: Roughly 100 trillion atoms, most of them in water molecules. So one cell has more atoms than your body has cells.

  - kind: explain
    id: c1
    body: Life is built in **levels**. Molecules form cells. Many similar cells form a tissue. Tissues form organs. Organs work together in a body.

  - kind: problem
    id: c2
    widget: order
    prompt: Order from small to large.
    params:
      items:
        - label: Molecule
        - label: Cell
        - label: Tissue
        - label: Organ
        - label: Organ system
        - label: Organism
      startLabel: small
      endLabel: large
    hints:
      - What is made of what?
      - Many cells form a tissue, several tissues an organ.
    explanation: "Each level builds on the one before: molecules, cells, tissues, organs, organ systems, organism."

  - kind: explain
    id: c3
    body: There are levels above the individual too. All the deer in a forest are a **population**. All species together form a community. Add soil, water and climate and you get an ecosystem.

  - kind: problem
    id: c4
    widget: match
    prompt: Match each level with an example.
    params:
      pairs:
        - left: Tissue
          right: Heart muscle
        - left: Organ
          right: Liver
        - left: Population
          right: All the trout in a lake
        - left: Ecosystem
          right: The lake and everything in it
        - left: Biosphere
          right: All life on Earth
    hints:
      - A population is just one species.
      - An ecosystem also includes water and soil.
    explanation: From tissue to biosphere each level is larger and contains the one before.

  - kind: problem
    id: c5
    widget: order
    prompt: "Now beyond the individual: order from small to large."
    params:
      items:
        - label: Organism
        - label: Population
        - label: Community
        - label: Ecosystem
        - label: Biosphere
      startLabel: small
      endLabel: large
    hints:
      - A population is one species, a community is many species.
      - The ecosystem adds soil, water and climate.
    explanation: One deer, all the deer, all species in the forest, the forest with soil and climate, all of living Earth.

  - kind: explain
    id: d1
    depth: 2
    body: New properties appear at every level. A protein in heart muscle does not beat. A heart cell only twitches. Only the whole organ pumps blood. This is called **emergence**.

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: Does something new appear only in the whole?
    params:
      cards:
        - text: Ants build bridges that no single ant plans.
          right: true
          why: The bridge arises from many simple rules.
        - text: A single water molecule is wet.
          right: false
          why: Wetness only exists with very many molecules.
        - text: A flock of birds dodges a falcon as a whole.
          right: true
          why: Each bird only follows its neighbours.
        - text: A single nerve cell can think.
          right: false
          why: Thinking only arises in a network of billions of cells.
      left: no
      right: yes
    explanation: Only the whole has emergent properties, never a single part.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Which level is this?
    params:
      buckets:
        - id: b1
          label: Molecule
        - id: b2
          label: Cell
        - id: b3
          label: Tissue
        - id: b4
          label: Organ
      items:
        - label: Haemoglobin
          bucket: b1
        - label: DNA
          bucket: b1
        - label: Nerve cell
          bucket: b2
        - label: Egg cell
          bucket: b2
        - label: Muscle tissue
          bucket: b3
        - label: Lung
          bucket: b4
        - label: Skin
          bucket: b4
    hints:
      - An organ is made of several tissue types and has a job.
      - The skin is your largest organ.
    explanation: "Haemoglobin and DNA are molecules. The skin is an organ: it has several tissue layers, nerves and glands."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A researcher knows every molecule in a cell exactly. Does she then fully understand how the cell lives?
    params:
      options:
        - label: No. It also depends on how the parts interact with each other.
          correct: true
        - label: Yes. The whole is exactly the sum of its parts.
          feedback: The parts alone do not explain feedback loops and networks.
        - label: No, because cells are not made of molecules.
          feedback: They are made of molecules – but how they work together matters.
    hints:
      - Think of emergence.
      - A parts list is not yet a blueprint.
    explanation: "Systems biology studies exactly this interplay: networks of genes, proteins and signals."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Explain to Lux: what are levels of organisation, and what does emergence mean?"
    params:
      keywords:
        - - zelle
          - cell
        - - gewebe
          - organ
          - tissue
        - - population
          - ökosystem
          - oekosystem
          - ecosystem
          - biosph
        - - neu
          - emerg
          - ganze
          - new
          - whole
      sample: Molecules form cells, cells form tissues, tissues form organs. Above that come population, ecosystem and biosphere. At each level something new arises in the whole – that is emergence.
    explanation: The levels build on each other, and each has properties its parts lack.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "d3"]
