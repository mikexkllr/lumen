id: bio.life.cells
type: concept
title: "Alles aus Zellen"
summary: "Die Zelle ist die kleinste lebende Einheit."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Entdeckung der Zelle
    body: Jeder Mensch, jeder Baum, jede Mücke besteht aus winzigen Bausteinen. Doch das wusste lange niemand. Deck auf, wie Forschende die **Zelle** Schritt für Schritt entdeckten.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 💧
            front: "1674: Leben im Tropfen"
            back: Antoni van Leeuwenhoek sieht mit selbst gebauten Linsen winzige Tierchen im Wasser.
          - icon: 🌿
            front: "1838: Pflanzen aus Zellen"
            back: "Matthias Schleiden erkennt: Jede Pflanze ist aus Zellen gebaut."
          - icon: 🐟
            front: "1839: Tiere auch"
            back: Theodor Schwann zeigt dasselbe für Tiere. Die Zelle ist der Baustein allen Lebens.
          - icon: 🧫
            front: "1855: Zelle aus Zelle"
            back: "Rudolf Virchow schreibt: Jede Zelle stammt von einer Zelle ab."

  - kind: problem
    id: start-baustein
    widget: choice
    prompt: Woraus besteht jedes Lebewesen – ob Mensch, Baum oder Mücke?
    params:
      options:
        - label: Aus Zellen
          correct: true
        - label: Aus Holz
          feedback: Holz gibt es nur bei Bäumen. Und selbst Holz besteht aus Zellen.
        - label: Aus Sand
          feedback: Sand ist kein Baustein des Lebens.
    hints:
      - Die Einleitung nennt den winzigen Baustein.
      - Schleiden und Schwann fanden ihn in Pflanzen und Tieren.
    explanation: Alle Lebewesen bestehen aus Zellen – vom Bakterium bis zum Blauwal.

  - kind: problem
    id: start-mikroskop
    widget: choice
    prompt: Die meisten Zellen sind winzig. Womit kannst du sie sehen?
    params:
      options:
        - label: Mit einem Mikroskop
          correct: true
        - label: Mit bloßem Auge
          feedback: Dafür sind fast alle Zellen viel zu klein.
        - label: Mit einem Fernglas
          feedback: Ein Fernglas holt Fernes heran. Winziges vergrößert es nicht genug.
    hints:
      - Leeuwenhoek baute sich dafür eigene Linsen.
      - Gesucht ist ein Gerät, das Winziges stark vergrößert.
    explanation: Erst das Mikroskop machte Zellen sichtbar. Vorher wusste niemand, dass es sie gibt.

  - kind: problem
    id: hook
    widget: estimate
    prompt: Aus wie vielen Zellen besteht dein Körper? Schätz mal – in Billionen.
    params:
      min: 1
      max: 1000
      scale: log
      unit: Billionen
    answer:
      value: 37
      within: 50
    explanation: Rund 37 Billionen – eine 37 mit zwölf Nullen. Etwa ebenso viele Bakterien leben in und auf dir.

  - kind: explain
    id: c1
    body: Die **Zelle** ist die kleinste Einheit, die selbst lebt. Jedes Lebewesen besteht aus einer oder aus vielen Zellen. Neue Zellen entstehen nur aus Zellen, durch Teilung.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Einzeller oder Vielzeller?
    params:
      buckets:
        - id: b1
          label: Einzeller
        - id: b2
          label: Vielzeller
      items:
        - label: Bakterium
          bucket: b1
        - label: Bäckerhefe
          bucket: b1
        - label: Pantoffeltierchen
          bucket: b1
        - label: Regenwurm
          bucket: b2
        - label: Eiche
          bucket: b2
        - label: Champignon
          bucket: b2
    hints:
      - Kann das Lebewesen aus einer einzigen Zelle bestehen?
      - Hefe und Pantoffeltierchen sieht man nur unter dem Mikroskop.
    explanation: Bakterien, Hefe und Pantoffeltierchen sind je eine Zelle. Wurm, Baum und Pilz bestehen aus Milliarden Zellen.

  - kind: problem
    id: start-teilung
    widget: numeric
    prompt: Eine Zelle teilt sich in zwei. Dann teilen sich beide noch einmal. Wie viele Zellen sind es jetzt?
    params:
      unit: Zellen
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: one-divides
        text: Es teilen sich **beide** Zellen. Aus 2 werden also 4.
    hints:
      - Nach der ersten Teilung sind es 2 Zellen.
      - "Jede der beiden wird wieder zu zwei: 2 · 2."
    explanation: 1 → 2 → 4. Jede Teilung verdoppelt die Zahl der Zellen.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Bakterium teilt sich alle 20 Minuten. Aus einer Zelle werden zwei, dann vier. Wie viele Zellen sind es nach {{h}} Stunden?
    answer:
      value: "{{2 ** (3 * h)}}"
    feedback:
      - when: numval(state.input) == 6 * h
        misconception: linear-growth
        text: Jede Teilung verdoppelt, sie addiert nicht. Rechne 2 · 2 · 2 …
    hints:
      - Wie viele Teilungen passen in {{h}} Stunden?
      - Das sind {{3 * h}} Teilungen. Verdopple so oft, ausgehend von 1.
    explanation: "{{h}} Stunden sind {{3 * h}} Teilungen: 2 hoch {{3 * h}} = {{2 ** (3 * h)}} Zellen."
    variants:
      params:
        h: int[1,3]
      defaults:
        h: 2

  - kind: problem
    id: c4
    widget: choice
    prompt: Woher stammt die allererste Zelle deines Körpers?
    params:
      options:
        - label: Eizelle und Spermium verschmolzen zu einer Zelle.
          correct: true
        - label: Sie entstand von selbst aus Nahrung.
          feedback: Zellen entstehen nie neu aus toten Stoffen. Sie stammen immer von Zellen ab.
        - label: Sie bildete sich aus Luft und Wasser.
          feedback: Luft und Wasser liefern Stoffe, aber keine Zellen.
    hints:
      - Neue Zellen entstehen nur aus Zellen.
      - Bei der Befruchtung verschmelzen zwei Zellen.
    explanation: Die befruchtete Eizelle teilt sich immer wieder. Aus ihr gehen alle 37 Billionen Zellen hervor.

  - kind: explain
    id: d1
    depth: 2
    body: Warum heißt die Zelle eigentlich »Zelle«?
    reveal:
      body: Robert Hooke sah 1665 durch sein Mikroskop in Kork lauter kleine Kammern. Sie erinnerten ihn an die Zellen von Mönchen. Das lateinische Wort cella heißt kleiner Raum.

  - kind: explain
    id: d2
    depth: 2
    body: "Die **Zelltheorie** sagt: Alle Lebewesen bestehen aus Zellen. Die Zelle ist die Grundeinheit des Lebens. Jede Zelle stammt von einer Zelle ab. Rudolf Virchow schrieb 1855: »Omnis cellula e cellula«."

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Du hast rund 25 Billionen rote Blutkörperchen. Jedes lebt etwa 120 Tage. Wie viele Milliarden musst du pro Tag ersetzen? Runde auf eine ganze Zahl.
    params:
      unit: Milliarden
    answer:
      value: 208
      tolerance: 2
    feedback:
      - when: numval(state.input) == 25
        misconception: whole-stock
        text: Das ist der ganze Bestand. Verteile ihn auf 120 Tage.
    hints:
      - Alle 120 Tage wird der ganze Bestand einmal ersetzt.
      - 25 000 Milliarden geteilt durch 120.
    explanation: "25 000 Milliarden : 120 ≈ 208 Milliarden pro Tag. Das sind rund 2,4 Millionen pro Sekunde!"
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: choice
    prompt: Rote Blutkörperchen sind die häufigsten Zellen in dir. Trotzdem machen sie nur einen kleinen Teil der Zellmasse aus. Warum?
    params:
      options:
        - label: Sie sind winzig. Muskel- und Fettzellen sind viel größer.
          correct: true
        - label: Sie bestehen nur aus Luft.
          feedback: Sie transportieren Sauerstoff, sind aber voller Hämoglobin und Wasser.
        - label: Sie werden nicht mitgezählt.
          feedback: Doch, sie zählen mit – und sind die Mehrheit.
    hints:
      - Masse hängt von Anzahl und Größe ab.
      - Eine rote Blutzelle misst nur etwa 8 µm.
    explanation: Viele kleine Zellen wiegen weniger als wenige große. Muskelfasern können Zentimeter lang werden.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Fadenwurm namens C. elegans hat als Erwachsener genau 959 Körperzellen (Zwitter). Was macht ihn für die Forschung so wertvoll?
    params:
      options:
        - label: Man kann das Schicksal jeder einzelnen Zelle verfolgen.
          correct: true
        - label: Er hat gar keine Nervenzellen.
          feedback: Er hat 302 Nervenzellen – und ein vollständig kartiertes Nervennetz.
        - label: Seine Zellen teilen sich nie.
          feedback: Sie teilen sich in der Entwicklung nach festem Plan.
    hints:
      - Bei 959 Zellen kennt man jede beim Namen.
      - Forschende haben den Stammbaum aller Zellen aufgezeichnet.
    explanation: Für C. elegans kennt man den Zellstammbaum vom Ei bis zum Wurm. Dafür gab es 2002 den Nobelpreis.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was sagt die Zelltheorie?"
    params:
      keywords:
        - - zelle
          - cell
        - - alle lebewesen
          - alles leben
          - jedes lebewesen
          - all living
          - every living
          - all life
        - - teil
          - abstamm
          - stammt
          - divid
          - come from
          - comes from
          - arise
        - - einheit
          - kleinst
          - grundbau
          - unit
          - smallest
          - basic
      sample: Alle Lebewesen bestehen aus Zellen. Die Zelle ist die kleinste lebende Einheit. Jede Zelle stammt von einer anderen Zelle ab, durch Teilung.
    explanation: "Drei Sätze: Alles Leben besteht aus Zellen, die Zelle ist die Grundeinheit, und Zellen entstehen nur aus Zellen."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d3"]
