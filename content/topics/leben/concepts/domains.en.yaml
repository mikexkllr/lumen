id: bio.life.domains
type: concept
title: "Order in diversity"
summary: "Species, names, ranks and the three domains."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: How many species have scientists described so far? Take a guess – in millions.
    params:
      min: 0.1
      max: 100
      scale: log
      unit: million
    answer:
      value: 2
      within: 50
    explanation: About 2 million. But there are probably many more – perhaps 8 to 9 million among organisms with a nucleus alone.

  - kind: explain
    id: c1
    body: A **species** is a group of organisms that can have fertile offspring together. Horse and donkey are two species. Their young, the mule, is almost always infertile.

  - kind: problem
    id: c2
    widget: choice
    prompt: The wolf is called Canis lupus, the coyote Canis latrans. What does that tell you about them?
    params:
      options:
        - label: Both belong to the same genus, but to two species.
          correct: true
        - label: They are the same species.
          feedback: The second part of the name differs – so two species.
        - label: They are not related.
          feedback: The shared first name shows close kinship.
    hints:
      - A species name has two parts.
      - The first part is the genus, the second the species.
    explanation: "Since Carl Linnaeus every species has a two-part name: genus plus species. We are Homo sapiens."

  - kind: explain
    id: c3
    body: Linnaeus arranged species in ranks. Similar species form a genus, genera form a family, and so on. The highest rank is the **domain**.

  - kind: problem
    id: c4
    widget: order
    prompt: Order the ranks from broad to narrow.
    params:
      items:
        - label: Domain
        - label: Kingdom
        - label: Phylum
        - label: Class
        - label: Order
        - label: Family
        - label: Genus
        - label: Species
      startLabel: broad
      endLabel: narrow
    hints:
      - At the top there are only three groups, at the bottom millions.
      - "Mnemonic: Dear King Philip Came Over For Good Soup."
    explanation: "Domain, kingdom, phylum, class, order, family, genus, species. Humans: eukaryotes, animals, chordates, mammals, primates, great apes, Homo, Homo sapiens."

  - kind: explain
    id: c5
    body: "All life is split into three domains: bacteria, archaea and eukaryotes. Only **eukaryotes** have a cell nucleus. They include animals, plants, fungi – and you."

  - kind: problem
    id: c6
    widget: buckets
    prompt: Which domain does it belong to?
    params:
      buckets:
        - id: b1
          label: Bacteria
        - id: b2
          label: Archaea
        - id: b3
          label: Eukaryotes
      items:
        - label: Gut bacterium E. coli
          bucket: b1
        - label: Lactic acid bacteria in yogurt
          bucket: b1
        - label: Methane makers in a cow’s gut
          bucket: b2
        - label: Sunflower
          bucket: b3
        - label: Porcini mushroom
          bucket: b3
        - label: Baker’s yeast
          bucket: b3
    hints:
      - Does the organism have a nucleus?
      - Yeast is a fungus – so a eukaryote.
    explanation: "Methane makers are archaea: they look like bacteria but form their own domain. Fungi and yeast have a nucleus."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Fungi were long thought to be plants. Who are they more closely related to, according to the tree of life?
    params:
      options:
        - label: With animals
          correct: true
        - label: With plants
          feedback: Fungi do not photosynthesise and store glycogen like animals, not starch.
        - label: With bacteria
          feedback: Fungi have a nucleus – they are eukaryotes.
    hints:
      - Compare nutrition and storage material.
      - Fungi feed on other matter instead of using light.
    explanation: "Genome comparisons show: fungi and animals share an ancestor that lived after the split from plants."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: True or false?
    params:
      cards:
        - text: A whale is a fish.
          right: false
          why: "Whales are mammals: they breathe air and suckle their young."
        - text: Archaea are not bacteria but a domain of their own.
          right: true
          why: Their cell walls and genes are very different.
        - text: Fungi photosynthesise.
          right: false
          why: Fungi have no chlorophyll. They break down other matter.
        - text: Yeast is a fungus.
          right: true
          why: Yeast is a single-celled fungus.
        - text: Humans are primates.
          right: true
          why: Like chimpanzees, gorillas and lemurs.
    explanation: Classification follows kinship, not appearance.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Today we classify by descent. A good group contains an ancestor and all its descendants. This is called **monophyletic**. "Fish" are not such a group. Their descendants on land are left out – including us.

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Are reptiles without birds a proper group on the tree of life? Why not?
    params:
      options:
        - label: Birds descend from dinosaurs – they are descendants of the same ancestors.
          correct: true
        - label: Because birds can fly.
          feedback: Flying is not a criterion. Only descent counts.
        - label: Because reptiles are cold-blooded.
          feedback: Body temperature is a trait, not kinship.
    hints:
      - Who is among the descendants of the common ancestor?
      - Crocodiles are more closely related to birds than to lizards.
    explanation: Leaving out birds omits some descendants. Experts call such a group paraphyletic.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: "Explain to Lux: what is a species, and how does it get its name?"
    params:
      keywords:
        - - nachwuchs
          - fortpflanz
          - junge
          - offspring
          - breed
          - reproduc
        - - fruchtbar
          - fertil
        - - gattung
          - genus
        - - zwei
          - doppel
          - two
          - homo sapiens
      sample: "A species is a group of organisms that have fertile offspring together. Each species has a two-part name: genus and species, for example Homo sapiens."
    explanation: Fertile offspring separates species; the two-part name places them in genera.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "c6"]
