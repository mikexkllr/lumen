id: bio.life.levels
type: concept
title: "Vom Molekül zur Biosphäre"
summary: "Organisationsebenen und warum das Ganze mehr ist als seine Teile."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: Wie viele Atome stecken in einer einzigen Körperzelle? Schätz mal.
    params:
      min: 1000000
      max: 100000000000000000000
      scale: log
    answer:
      value: 100000000000000
      within: 80
    explanation: Grob 100 Billionen Atome, die meisten in Wassermolekülen. Eine Zelle hat also mehr Atome als dein Körper Zellen hat.

  - kind: explain
    id: c1
    body: Das Leben ist in **Ebenen** gebaut. Moleküle bilden Zellen. Viele gleiche Zellen bilden ein Gewebe. Gewebe bilden Organe. Organe arbeiten in einem Körper zusammen.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne von klein nach groß.
    params:
      items:
        - label: Molekül
        - label: Zelle
        - label: Gewebe
        - label: Organ
        - label: Organsystem
        - label: Organismus
      startLabel: klein
      endLabel: groß
    hints:
      - Was besteht woraus?
      - Viele Zellen bilden ein Gewebe, mehrere Gewebe ein Organ.
    explanation: "Jede Ebene baut auf der vorigen auf: Moleküle, Zellen, Gewebe, Organe, Organsysteme, Organismus."

  - kind: explain
    id: c3
    body: Auch über dem Einzelwesen gibt es Ebenen. Alle Rehe eines Waldes sind eine **Population**. Alle Arten zusammen bilden eine Lebensgemeinschaft. Mit Boden, Wasser und Klima wird daraus ein Ökosystem.

  - kind: problem
    id: c4
    widget: match
    prompt: Verbinde Ebene und Beispiel.
    params:
      pairs:
        - left: Gewebe
          right: Herzmuskel
        - left: Organ
          right: Leber
        - left: Population
          right: Alle Forellen im See
        - left: Ökosystem
          right: Der See mit allem darin
        - left: Biosphäre
          right: Alles Leben der Erde
    hints:
      - Eine Population ist nur eine Art.
      - Zum Ökosystem gehören auch Wasser und Boden.
    explanation: Vom Gewebe bis zur Biosphäre wird jede Ebene größer und umfasst die vorige.

  - kind: problem
    id: c5
    widget: order
    prompt: "Und jetzt über das Einzelwesen hinaus: Ordne von klein nach groß."
    params:
      items:
        - label: Organismus
        - label: Population
        - label: Lebensgemeinschaft
        - label: Ökosystem
        - label: Biosphäre
      startLabel: klein
      endLabel: groß
    hints:
      - Eine Population ist eine Art, eine Lebensgemeinschaft sind viele Arten.
      - Das Ökosystem fügt Boden, Wasser und Klima hinzu.
    explanation: Ein Reh, alle Rehe, alle Arten im Wald, der Wald mit Boden und Klima, die ganze belebte Erde.

  - kind: explain
    id: d1
    depth: 2
    body: Auf jeder Ebene tauchen neue Eigenschaften auf. Ein Eiweiß im Herzmuskel schlägt nicht. Eine Herzzelle zuckt nur. Erst das ganze Organ pumpt Blut. Das nennt man **Emergenz**.

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: Entsteht hier etwas Neues erst im Ganzen?
    params:
      cards:
        - text: Ameisen bauen Brücken, die keine einzelne Ameise plant.
          right: true
          why: Die Brücke entsteht aus vielen einfachen Regeln.
        - text: Ein einzelnes Wassermolekül ist nass.
          right: false
          why: Nässe gibt es erst bei sehr vielen Molekülen.
        - text: Ein Vogelschwarm weicht als Ganzes einem Falken aus.
          right: true
          why: Jeder Vogel folgt nur seinen Nachbarn.
        - text: Eine einzelne Nervenzelle kann denken.
          right: false
          why: Denken entsteht erst im Netz aus Milliarden Zellen.
      left: nein
      right: ja
    explanation: Emergente Eigenschaften hat nur das Ganze, nie das einzelne Teil.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Welche Ebene ist das?
    params:
      buckets:
        - id: b1
          label: Molekül
        - id: b2
          label: Zelle
        - id: b3
          label: Gewebe
        - id: b4
          label: Organ
      items:
        - label: Hämoglobin
          bucket: b1
        - label: DNA
          bucket: b1
        - label: Nervenzelle
          bucket: b2
        - label: Eizelle
          bucket: b2
        - label: Muskelgewebe
          bucket: b3
        - label: Lunge
          bucket: b4
        - label: Haut
          bucket: b4
    hints:
      - Ein Organ besteht aus mehreren Gewebearten und hat eine Aufgabe.
      - Die Haut ist dein größtes Organ.
    explanation: "Hämoglobin und DNA sind Moleküle. Die Haut ist ein Organ: Sie hat mehrere Gewebeschichten, Nerven und Drüsen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Forscherin kennt alle Moleküle einer Zelle genau. Versteht sie damit vollständig, wie die Zelle lebt?
    params:
      options:
        - label: Nein. Es kommt auch darauf an, wie die Teile miteinander wechselwirken.
          correct: true
        - label: Ja. Das Ganze ist genau die Summe seiner Teile.
          feedback: Die Teile allein erklären keine Rückkopplungen und Netzwerke.
        - label: Nein, denn Zellen bestehen nicht aus Molekülen.
          feedback: Doch, sie bestehen aus Molekülen – aber deren Zusammenspiel zählt.
    hints:
      - Denk an die Emergenz.
      - Eine Liste von Bauteilen ist noch kein Bauplan.
    explanation: "Die Systembiologie untersucht genau dieses Zusammenspiel: Netzwerke von Genen, Eiweißen und Signalen."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was sind die Ebenen des Lebens, und was ist Emergenz?"
    params:
      keywords:
        - - zelle
          - cell
        - - gewebe
          - organ
          - tissue
        - - population
          - ökosystem
          - oekosystem
          - ecosystem
          - biosph
        - - neu
          - emerg
          - ganze
          - new
          - whole
      sample: Moleküle bilden Zellen, Zellen Gewebe, Gewebe Organe. Darüber kommen Population, Ökosystem und Biosphäre. Auf jeder Ebene entsteht im Ganzen etwas Neues, das heißt Emergenz.
    explanation: Die Ebenen bauen aufeinander auf, und jede hat Eigenschaften, die ihre Teile nicht haben.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "d3"]
