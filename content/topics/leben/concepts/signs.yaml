id: bio.life.signs
type: concept
title: "Kennzeichen des Lebens"
summary: "Zellen, Stoffwechsel, Wachstum, Vermehrung und Reize."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Leben am Limit
    body: "Leben hält mehr aus, als du denkst: Hitze, Kälte, sogar das Weltall. Doch woran erkennt man überhaupt, dass etwas lebt? Deck die Karten auf. Alle diese Lebewesen teilen ein paar **Kennzeichen**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐻
            front: Bärtierchen im Weltall
            back: Ausgetrocknet überlebten sie 2007 zehn Tage im offenen All – und lebten danach weiter.
          - icon: 🌋
            front: Leben bei 122 °C
            back: Ein Einzeller aus der Tiefsee wächst noch bei 122 °C. Wasser bleibt dort nur unter hohem Druck flüssig.
          - icon: 🌲
            front: Ein Baum, fast 5000 Jahre alt
            back: Die Kiefer »Methusalem« in Kalifornien keimte noch vor dem Bau der Pyramiden.

  - kind: problem
    id: start-lebt
    widget: swipe
    prompt: "Zum Aufwärmen: Lebt das? Wisch nach links oder rechts."
    params:
      cards:
        - text: Ein Hund
          right: true
        - text: Ein Stein
          right: false
        - text: Ein Gänseblümchen
          right: true
          why: Auch Pflanzen leben. Sie wachsen und bilden Samen.
        - text: Ein Fahrrad
          right: false
      left: unbelebt
      right: lebendig
    explanation: Tiere und Pflanzen leben, Steine und Maschinen nicht. Gleich wird es kniffliger.

  - kind: problem
    id: start-katze
    widget: choice
    prompt: Was kann eine Katze, ein Stein aber nicht?
    params:
      options:
        - label: Wachsen und Junge bekommen
          correct: true
        - label: Schwer sein
          feedback: Auch Steine sind schwer. Das Gewicht sagt nichts über Leben.
        - label: In der Sonne warm werden
          feedback: Das schafft ein Stein genauso.
    hints:
      - Was passiert mit einem Kätzchen im Lauf eines Jahres?
      - Ein Stein bleibt, wie er ist. Eine Katze wird größer und bekommt Nachwuchs.
    explanation: Lebewesen wachsen und vermehren sich. Das sind zwei Kennzeichen des Lebens – gleich lernst du alle kennen.

  - kind: problem
    id: hook
    widget: swipe
    prompt: Lebt das? Wisch nach links oder rechts.
    params:
      cards:
        - text: Ein Pilz im Wald
          right: true
          why: Pilze sind Lebewesen – weder Pflanze noch Tier.
        - text: Ein Kristall, der wächst
          right: false
          why: Er wächst, hat aber keine Zellen und keinen Stoffwechsel.
        - text: Hefe im Brotteig
          right: true
          why: Hefe besteht aus winzigen Zellen. Sie frisst Zucker und macht Gas.
        - text: Eine Kerzenflamme
          right: false
          why: Sie »frisst« Wachs und wächst. Aber sie hat keine Zellen und vererbt nichts.
        - text: Ein Samen im Winter
          right: true
          why: Er ruht nur. Im Frühling keimt er.
        - text: Ein Roboter, der Akkus lädt
          right: false
          why: Er nimmt Energie auf, ist aber nicht aus Zellen gebaut und baut sich nicht selbst nach.
      left: unbelebt
      right: lebendig
    explanation: Wachsen oder Energie aufnehmen reicht nicht. Lebewesen bestehen aus Zellen und vermehren sich.

  - kind: explain
    id: c1
    body: Lebewesen teilen einige **Kennzeichen des Lebens**. Sie bestehen aus Zellen und haben einen Stoffwechsel. Sie wachsen, vermehren sich und reagieren auf Reize. Ein einzelnes Merkmal reicht nicht.

  - kind: problem
    id: start-reiz
    widget: choice
    prompt: Du trittst in die grelle Sonne und kneifst die Augen zu. Was ist hier der Reiz?
    params:
      options:
        - label: Das grelle Licht
          correct: true
        - label: Das Zukneifen der Augen
          feedback: Das ist die Reaktion. Der Reiz ist das, was sie auslöst.
        - label: Deine Augen
          feedback: Die Augen nehmen den Reiz nur wahr.
    hints:
      - Ein Reiz kommt von außen und löst etwas aus.
      - Worauf reagieren deine Augen?
    explanation: Das Licht ist der Reiz, das Zukneifen die Reaktion. Dass Lebewesen auf Reize reagieren, nennt man Reizbarkeit.

  - kind: explain
    id: c3
    body: Beim **Stoffwechsel** nimmt ein Lebewesen Stoffe auf, wandelt sie um und gibt Reste ab. So gewinnt es Energie und Baustoffe für seinen Körper.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Welches Kennzeichen zeigt die Beobachtung?
    params:
      buckets:
        - id: b1
          label: Reizbarkeit
        - id: b2
          label: Stoffwechsel
        - id: b3
          label: Fortpflanzung
      items:
        - label: Schnecke zieht Fühler ein
          bucket: b1
        - label: Pupillen werden im Hellen klein
          bucket: b1
        - label: Kuh frisst Gras, macht Mist
          bucket: b2
        - label: Du atmest O₂ ein und CO₂ aus
          bucket: b2
        - label: Löwenzahn verstreut Samen
          bucket: b3
        - label: Bakterium teilt sich in zwei
          bucket: b3
    hints:
      - "Frag dich: Reagiert es, verarbeitet es Stoffe oder entsteht Nachwuchs?"
      - Pupillen und Fühler reagieren auf etwas von außen.
    explanation: Reize lösen Reaktionen aus. Stoffwechsel verarbeitet Stoffe. Fortpflanzung schafft Nachwuchs.

  - kind: problem
    id: c4
    widget: choice
    prompt: Ein Auto tankt Benzin, verbrennt es und stößt Abgase aus. Warum lebt es trotzdem nicht?
    params:
      options:
        - label: Es besteht nicht aus Zellen und baut keine Kopien von sich.
          correct: true
        - label: Es hat keinen Stoffwechsel.
          feedback: Tanken und Verbrennen ähnelt einem Stoffwechsel. Es fehlen andere Kennzeichen.
        - label: Es bewegt sich nicht von selbst.
          feedback: Bewegung allein entscheidet nichts. Auch Pflanzen laufen nicht herum.
    hints:
      - Geh die Kennzeichen einzeln durch.
      - Woraus ist ein Auto gebaut? Und wer baut neue Autos?
    explanation: Erst alle Kennzeichen zusammen machen Leben aus. Dem Auto fehlen Zellen und Fortpflanzung.

  - kind: problem
    id: c5
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Lebewesen bestehen aus [[Zellen]]. Sie haben einen [[Stoffwechsel]] und reagieren auf [[Reize]].
      distractors:
        - Atomen
        - Motor
        - Farben
    explanation: Diese drei Kennzeichen hast du gerade sortiert.

  - kind: explain
    id: d1
    depth: 2
    body: Lebewesen halten innen stabile Bedingungen, auch wenn sich außen viel ändert. Das heißt **Homöostase**. Du schwitzt bei Hitze und zitterst bei Kälte. So bleibst du bei etwa 37 °C.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Du joggst in der Sonne. Wie hält dein Körper die Temperatur?
    params:
      options:
        - label: Er schwitzt. Verdunstender Schweiß kühlt die Haut.
          correct: true
        - label: Er zittert.
          feedback: Zittern erzeugt Wärme. Das hilft gegen Kälte, nicht gegen Hitze.
        - label: Gar nicht, die Temperatur steigt einfach mit.
          feedback: Dann hättest du nach Minuten Fieber. Der Körper regelt dagegen.
    hints:
      - Was passiert mit deiner Haut beim Sport?
      - Wasser, das verdunstet, nimmt Wärme mit.
    explanation: "Schwitzen ist Homöostase: Der Körper misst, weicht ab und regelt zurück."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Viren sind ein Grenzfall. Stimmt das?
    params:
      cards:
        - text: Ein Virus enthält Erbgut.
          right: true
          why: Viren tragen DNA oder RNA.
        - text: Ein Virus hat einen eigenen Stoffwechsel.
          right: false
          why: Es nutzt den Stoffwechsel der Wirtszelle.
        - text: Ein Virus vermehrt sich ohne Wirtszelle.
          right: false
          why: Außerhalb einer Zelle ist ein Virus nur ein Teilchen.
        - text: Viren verändern sich durch Evolution.
          right: true
          why: Neue Grippe-Varianten zeigen das jedes Jahr.
    explanation: Viren haben Erbgut und evolvieren, aber keine Zellen.
    difficulty: 2

  - kind: explain
    id: d4
    depth: 2
    body: Sind Viren nun Lebewesen?
    reveal:
      body: Das ist umstritten. Viren haben Erbgut und evolvieren. Aber sie haben keine Zellen und keinen eigenen Stoffwechsel. Viele nennen sie darum Grenzfälle des Lebens.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Eine Arbeitsdefinition der NASA lautet: Leben ist ein sich selbst erhaltendes chemisches System, das zu darwinscher Evolution fähig ist. Was zählt danach nicht als Leben?"
    params:
      options:
        - label: Ein Computervirus, der sich kopiert
          correct: true
        - label: Ein Bakterium
          feedback: ""
        - label: Ein Schimmelpilz
          feedback: ""
    hints:
      - "Prüfe jedes Wort der Definition: chemisch, selbst erhaltend, Evolution."
      - Woraus besteht ein Computervirus?
    explanation: Ein Computervirus ist Information, kein chemisches System. Er kopiert sich nur mithilfe fremder Rechner.
    difficulty: 3

  - kind: explain
    id: x2
    depth: 3
    body: Lebewesen bauen Ordnung auf, ohne ein Naturgesetz zu brechen. Sie nehmen geordnete Energie auf, etwa Nahrung oder Licht. Sie geben Wärme ab und erhöhen draußen die Unordnung. Sie exportieren **Entropie**.

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Woran erkennt man, ob etwas lebt?"
    params:
      keywords:
        - - zelle
          - cell
        - - stoffwechsel
          - energie
          - nahrung
          - metabol
          - energy
          - food
        - - vermehr
          - fortpflanz
          - nachwuchs
          - teil
          - reproduc
          - offspring
          - divid
        - - reiz
          - reagier
          - stimul
          - respon
          - react
      sample: Ein Lebewesen besteht aus Zellen und hat einen Stoffwechsel, der Energie liefert. Es wächst, vermehrt sich und reagiert auf Reize. Erst alles zusammen zählt.
    explanation: Kein einzelnes Merkmal genügt. Erst Zellen, Stoffwechsel, Wachstum, Vermehrung und Reizbarkeit zusammen machen ein Lebewesen.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "d2"]
