id: stats.clustering.kmeans
type: concept
title: "Finding groups with k-means"
summary: "Place centres, assign, move – until nothing changes."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Groups without labels
    body: "An algorithm sorts millions of data points into groups – without anyone telling it which groups exist. Uncover the cards in any order. The same idea is everywhere: **centres** in the middle of their points."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 👕
            front: S, M or L?
            back: Makers group the body measurements of thousands of people. The centres of the groups become clothing sizes.
          - icon: 🎨
            front: 16 colours, not millions
            back: "A photo can be boiled down to 16 colours: similar pixels form a group, and their average becomes the colour."
          - icon: 🍕
            front: Where to put the pizzeria?
            back: A chain looks for three spots for new branches. Each should sit in the middle of its customers.

  - kind: problem
    id: hook
    widget: choice
    prompt: How many groups do you see in this scatter plot?
    visual:
      widget: graph
      params:
        x:
          - 0
          - 9
        y:
          - 0
          - 8
        showCoordinates: false
        points:
          - id: a
            x: 1
            y: 2
            draggable: false
            label: ""
          - id: b
            x: 2
            y: 1
            draggable: false
            label: ""
          - id: c
            x: 2
            y: 3
            draggable: false
            label: ""
          - id: d
            x: 3
            y: 2
            draggable: false
            label: ""
          - id: e
            x: 6
            y: 6
            draggable: false
            label: ""
          - id: f
            x: 7
            y: 5
            draggable: false
            label: ""
          - id: g
            x: 7
            y: 7
            draggable: false
            label: ""
          - id: h
            x: 8
            y: 6
            draggable: false
            label: ""
    params:
      options:
        - label: Two
          correct: true
        - label: There is a clear gap between the clumps.
          feedback: Zwischen den Haufen ist eine deutliche Lücke.
        - label: Each point alone is no group.
          feedback: Jeder Punkt allein ist keine Gruppe.
    hints:
      - Where are the points close together?
      - Bottom left and top right.
    explanation: The eye sees two clumps at once. Clustering teaches computers to do this without given labels.

  - kind: explain
    id: c1
    body: "The **k-means** algorithm: place k centres. Assign each point to its nearest centre. Move each centre to the mean of its points. Repeat until nothing changes."

  - kind: problem
    id: c2
    widget: graph
    prompt: Drag the two centres M and N exactly to the middle of one group each.
    params:
      x:
        - 0
        - 9
      y:
        - 0
        - 8
      showCoordinates: true
      points:
        - id: a
          x: 1
          y: 2
          draggable: false
          label: ""
        - id: b
          x: 2
          y: 1
          draggable: false
          label: ""
        - id: c
          x: 2
          y: 3
          draggable: false
          label: ""
        - id: d
          x: 3
          y: 2
          draggable: false
          label: ""
        - id: e
          x: 6
          y: 6
          draggable: false
          label: ""
        - id: f
          x: 7
          y: 5
          draggable: false
          label: ""
        - id: g
          x: 7
          y: 7
          draggable: false
          label: ""
        - id: h
          x: 8
          y: 6
          draggable: false
          label: ""
        - id: M
          x: 4
          y: 7
          label: M
        - id: N
          x: 5
          y: 1
          label: N
    check:
      predicate: (state.points.M.x == 2 && state.points.M.y == 2 && state.points.N.x == 7 && state.points.N.y == 6) || (state.points.M.x == 7 && state.points.M.y == 6 && state.points.N.x == 2 && state.points.N.y == 2)
    solution:
      state:
        points:
          M:
            x: 2
            y: 2
          N:
            x: 7
            y: 6
    hints:
      - The middle has the mean of the x-values as x and the mean of the y-values as y.
      - "Left: x-values 1, 2, 2, 3 → 2. y-values 2, 1, 3, 2 → 2."
    explanation: The centres sit at (2, 2) and (7, 6). Each centre is the mean of its group – hence the name »means«.

  - kind: problem
    id: c3
    widget: choice
    prompt: Centres at (2, 2) and (7, 6). Which one does the point (4, 4) belong to?
    params:
      options:
        - label: To (2, 2) – distance √8 ≈ 2.8 instead of √13 ≈ 3.6
          correct: true
        - label: "Compute both distances: (2² + 2²) versus (3² + 2²)."
          feedback: "Rechne beide Abstände: (2² + 2²) gegen (3² + 2²)."
        - label: k-means assigns every point to exactly one centre.
          feedback: k-Means ordnet jeden Punkt genau einem Zentrum zu.
    hints:
      - "Distance to (2, 2): differences 2 and 2."
      - "Distance to (7, 6): differences 3 and 2."
    explanation: √8 < √13, so to the left centre. Each point goes to its nearest centre.

  - kind: problem
    id: c4
    widget: numeric
    prompt: A group consists of (1, 2), (3, 4) and (5, 0). Where is the y-coordinate of its centre?
    answer:
      value: 2
    hints:
      - Average the three y-values.
      - (2 + 4 + 0) ÷ 3.
    explanation: 6 ÷ 3 = 2; the centre is (3, 2). In the next step the centre moves exactly there.

  - kind: problem
    id: c5
    widget: order
    prompt: Put the steps of k-means in order.
    params:
      items:
        - label: Choose the number of groups k
        - label: Place k starting centres
        - label: Assign each point to its nearest centre
        - label: Move each centre to the mean of its points
        - label: Repeat until nothing changes
    hints:
      - k must be fixed beforehand.
      - Assigning and moving alternate.
    explanation: "Two steps in turn: assign, move. Usually everything is stable after a few rounds."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "k-means minimises the sum of squared distances to the centres. A group on a line: 1, 3, 8, centre 4. What is its sum of squares?"
    answer:
      value: 26
    hints:
      - "Distances: −3, −1, 4."
      - 9 + 1 + 16.
    explanation: 26. Each k-means step lowers this within-group spread or leaves it unchanged – that is why the method surely stops.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Two k-means runs with different starting centres give different groups. How can that be?
    params:
      options:
        - label: k-means only finds a local optimum – the start matters
          correct: true
        - label: This behaviour is normal for k-means.
          feedback: Das Verhalten ist normal für k-Means.
        - label: Same data, different start.
          feedback: Gleiche Daten, anderer Start.
    hints:
      - Can a centre get stuck in a bad valley?
      - So people often start several times and take the best result.
    explanation: A clever start such as k-means++ spreads the starting centres far apart. Several runs, keeping the smallest sum of squares, help as well.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Points form two rings, a small one inside a large one. Can k-means with k = 2 separate the rings?
    params:
      options:
        - label: No – k-means cuts space with straight lines and finds round clumps
          correct: true
        - label: More rounds do not change the shape of the groups.
          feedback: Mehr Runden ändern die Form der Gruppen nicht.
        - label: Scaling does not turn rings into clumps.
          feedback: Skalierung macht aus Ringen keine Klumpen.
    hints:
      - The border between two centres is always a straight line.
      - Rings need a round border.
    explanation: "For such shapes you use density-based methods such as DBSCAN: a group is whatever hangs together densely."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Why does k-means surely end after finitely many steps?
    params:
      options:
        - label: The sum of squares falls with every change, and there are only finitely many assignments
          correct: true
        - label: That is a safety net, not the reason.
          feedback: Das ist ein Notbehelf, nicht der Grund.
        - label: Centres can be any means.
          feedback: Die Zentren können beliebige Mittelpunkte sein.
    hints:
      - Can an assignment repeat if the sum keeps falling?
      - "n points into k groups: at most kⁿ options."
    explanation: A strictly falling quantity cannot visit a state twice. With finitely many states it must stop. A typical convergence argument.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how k-means finds groups.
    params:
      keywords:
        - - zentr
          - centre
          - center
          - mittelpunkt
          - mean
        - - nächst
          - zuordn
          - nearest
          - assign
        - - verschieb
          - wiederhol
          - move
          - repeat
      sample: You place k centres. Each point is assigned to its nearest centre. Then you move each centre to the mean of its points and repeat until nothing changes.
    explanation: Assigning and moving improve each other until a stable state is reached.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "d1"]
