id: stats.bayes.thinking
type: concept
title: Denken in Wahrscheinlichkeiten
summary: Meinungen klug anpassen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Vorher, nachher
    body: Kluge Leute ändern ihre Meinung – aber nicht beliebig. Auf der x-Achse steht, wie sicher du vorher bist, auf der y-Achse, wie sicher danach. Zieh am Regler die **Stärke des Hinweises**. Was passiert bei 1?
    visual:
      widget: slider
      interactive: true
      params:
        expr: k*x/(k*x + 1 - x)
        x:
          - 0
          - 1
        y:
          - 0
          - 1
        showCoordinates: false
        sliders:
          - id: k
            label: Stärke des Hinweises
            min: 0.25
            max: 8
            step: 0.25
            initial: 1

  - kind: problem
    id: hook
    widget: choice
    prompt: "Du glaubst zu 70 %, dass es morgen regnet. Dann sagt eine gute Vorhersage: Sonne. Was tust du?"
    params:
      options:
        - label: Meine Schätzung deutlich senken
          correct: true
        - label: Bei 70 % bleiben
          feedback: Dann wäre der neue Hinweis nichts wert.
        - label: Sofort auf 0 % gehen
          feedback: Auch gute Vorhersagen irren manchmal.
    hints:
      - Wie stark ist der Hinweis?
    explanation: Glauben anpassen statt umwerfen – das ist Denken in Wahrscheinlichkeiten.

  - kind: explain
    id: s1
    body: |
      Bayes-Denken heißt: Überzeugungen nicht als ja oder nein sehen, sondern als **Wahrscheinlichkeiten**. Jeder neue Hinweis verschiebt sie – starke Hinweise stark, schwache schwach.

  - kind: problem
    id: staerke
    widget: buckets
    prompt: Wie stark spricht der Hinweis dafür, dass es heute regnet?
    params:
      buckets: [{ label: stark }, { label: schwach }]
      items:
        - { label: Dunkle Wolken und Donner, bucket: stark }
        - { label: Der Wetterbericht sagt 90 % Regen, bucket: stark }
        - { label: Es ist Montag, bucket: schwach }
        - { label: Gestern hat es geregnet, bucket: schwach }
    hints:
      - Wie viel häufiger tritt der Hinweis bei Regen auf als ohne?
    explanation: Stark ist ein Hinweis, der bei Regen viel häufiger auftritt als ohne.

  - kind: problem
    id: sturkopf
    widget: choice
    prompt: Jemand ist sich zu 100 % sicher. Was sagt Bayes dazu?
    params:
      options:
        - { label: Dann kann ihn kein Beweis der Welt mehr umstimmen., correct: true }
        - { label: Das ist die beste Haltung., feedback: "Wer mit 100 % startet, kann nichts mehr dazulernen." }
    hints:
      - Was ergibt 100 % mal irgendein Hinweis?
    explanation: Kluge Menschen lassen immer etwas Raum für Irrtum.

  - kind: problem
    id: wetten
    widget: numeric
    prompt: Du schätzt etwas auf 1 zu {{k}} – also eins von {{k + 1}} gleich wahrscheinlichen Fällen. Wie viel Prozent sind das, gerundet?
    params: { unit: "%" }
    answer: { value: "{{round(100 / (k + 1))}}", tolerance: 1 }
    hints:
      - "100 : {{k + 1}}."
    explanation: "Etwa {{round(100 / (k + 1))}} %."
    variants:
      params: { k: "choice[1,3,4,9,19]" }
      defaults: { k: 3 }

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Wahrscheinlichkeit – von fast unmöglich bis fast sicher.
    params:
      items:
        - label: Du gewinnst morgen im Lotto
        - label: Du würfelst eine Sechs
        - label: Eine Münze zeigt Kopf
        - label: Morgen geht die Sonne auf
    hints:
      - "Denk an Zahlen: 1 zu Millionen, 1 zu 6, 1 zu 2 …"
    explanation: Zwischen unmöglich und sicher liegt eine ganze Skala.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Vorher bist du dir zu 50 % sicher. Stell die Stärke des Hinweises so ein, dass du danach zu 80 % sicher bist.
    params:
      expr: k*x/(k*x + 1 - x)
      x:
        - 0
        - 1
      y:
        - 0
        - 1
      showCoordinates: false
      sliders:
        - id: k
          label: Stärke des Hinweises
          min: 0.25
          max: 8
          step: 0.25
          initial: 1
      markers:
        - x: 0.5
          y: 0.8
    answer:
      values:
        k: 4
    hints:
      - Schau, wo die Kurve bei x = 0,5 liegt. Sie soll durch den Punkt gehen.
      - "50 : 50 ist 1 zu 1. Ein Hinweis der Stärke 4 macht daraus 4 zu 1 – das sind 80 %."
    explanation: "Mit Stärke 4 wird aus 1 : 1 ein 4 : 1, also 80 %. Ein Hinweis der Stärke 1 ändert gar nichts."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du hältst eine Hypothese für 50 % wahrscheinlich. Dann erfährst du etwas, das bei wahr und falsch gleich wahrscheinlich wäre. Was tust du?
    params:
      options:
        - label: Nichts – der Hinweis unterscheidet nicht zwischen den Möglichkeiten
          correct: true
        - label: Die Wahrscheinlichkeit erhöhen
          feedback: Nur was besser zu einer Seite passt, verschiebt.
        - label: Die Wahrscheinlichkeit senken
          feedback: Auch dafür gibt es keinen Grund.
    hints:
      - Das Likelihood-Verhältnis ist 1.
    explanation: Ein Hinweis zählt nur, wenn er unter einer Annahme wahrscheinlicher ist als unter der anderen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Die Chance steht {{k}} : 1. Wie viel Prozent sind das?"
    answer:
      value: "{{100 * k / (k + 1)}}"
    feedback:
      - when: numval(state.input) == 100 * k / (k + 2)
        misconception: odds-count
        text: "Bei {{k}} : 1 gibt es {{k + 1}} Fälle insgesamt, nicht {{k + 2}}."
    hints:
      - "{{k}} : 1 heißt {{k}} günstige auf 1 ungünstigen Fall."
      - "Rechne {{k}} : {{k + 1}}."
    explanation: "{{k}}/{{k + 1}} = {{100 * k / (k + 1)}} %. **Chancen** und Wahrscheinlichkeiten sind zwei Schreibweisen derselben Überzeugung."
    difficulty: 2
    variants:
      params:
        k: choice[1,3,4,9,19,99]
      defaults:
        k: 4

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Ein Hinweis hat das Likelihood-Verhältnis 1. Was bewirkt er?
    params:
      options:
        - label: Nichts – er ist unter beiden Annahmen gleich wahrscheinlich
          correct: true
        - label: Er bestätigt die Hypothese
          feedback: Bestätigen kann nur ein Verhältnis über 1.
        - label: Er widerlegt die Hypothese
          feedback: Widerlegen kann nur ein Verhältnis unter 1.
    hints:
      - Chance mal 1 ergibt …?
      - Ein Hinweis zählt nur, wenn er zwischen den Möglichkeiten unterscheidet.
    explanation: Ein Hinweis, der zu allem passt, sagt nichts. Die Frage ist nie »passt das?«, sondern »wie viel besser passt es zu A als zu B?«.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Zwei Menschen starten mit sehr verschiedenen Meinungen, sehen aber immer dieselben Daten. Was sagt die Bayes-Theorie voraus?
    params:
      options:
        - label: Ihre Einschätzungen nähern sich an – genug Daten überstimmen jeden Prior
          correct: true
        - label: Sie bleiben für immer uneins
          feedback: Nur wer mit 0 % oder 100 % startet, bewegt sich nie.
        - label: Sie tauschen ihre Meinungen
          feedback: Sie bewegen sich aufeinander zu.
    hints:
      - Jeder Hinweis verschiebt beide in dieselbe Richtung.
    explanation: "Darum ist es klug, nie absolut sicher zu sein: Dann können Daten dich noch korrigieren."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Du startest bei 50 %. Ein Hinweis hat Faktor 3, ein zweiter Faktor 1/3. Wo landest du? In Prozent.
    answer:
      value: 50
    hints:
      - "Startchance 1 : 1."
      - 1 · 3 · 1/3 = 1.
    explanation: "Zurück bei 50 %. In **Log-Odds** sind das +log 3 und −log 3: Hinweise sind Schritte auf einer Skala, die sich aufheben können."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Jemand sucht nur nach Hinweisen, die seine Meinung bestätigen, und übersieht Gegenbeweise. Was verletzt er im Sinne von Bayes?
    params:
      options:
        - label: Er nutzt nicht alle Daten – Bayes braucht jeden Hinweis, auch unbequeme
          correct: true
        - label: Nichts, Bayes erlaubt Vorwissen
          feedback: Vorwissen ja, aber Hinweise dürfen nicht ausgesiebt werden.
        - label: Er hat einen zu kleinen Prior
          feedback: Das Problem liegt bei der Auswahl der Daten.
    hints:
      - Was passiert mit der Rechnung, wenn Gegenbeweise fehlen?
      - Ausgesiebte Daten sind eine verzerrte Stichprobe.
    explanation: Der **Bestätigungsfehler** füttert Bayes nur mit halben Daten. Dann wandert die Überzeugung immer in dieselbe Richtung – egal, was wahr ist.
    difficulty: 3

srs:
  cards_from: [staerke, sturkopf]
