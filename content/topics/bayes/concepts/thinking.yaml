id: stats.bayes.thinking
type: concept
title: Denken in Wahrscheinlichkeiten
summary: Meinungen klug anpassen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Du glaubst zu 70 %, dass es morgen regnet. Dann sagt eine gute Vorhersage: Sonne. Was tust du?"
    params:
      options:
        - label: Meine Schätzung deutlich senken
          correct: true
        - label: Bei 70 % bleiben
          feedback: Dann wäre der neue Hinweis nichts wert.
        - label: Sofort auf 0 % gehen
          feedback: Auch gute Vorhersagen irren manchmal.
    hints:
      - Wie stark ist der Hinweis?
    explanation: Glauben anpassen statt umwerfen – das ist Denken in Wahrscheinlichkeiten.

  - kind: explain
    id: s1
    body: |
      Bayes-Denken heißt: Überzeugungen nicht als ja oder nein sehen, sondern als **Wahrscheinlichkeiten**. Jeder neue Hinweis verschiebt sie – starke Hinweise stark, schwache schwach.

  - kind: problem
    id: staerke
    widget: buckets
    prompt: Wie stark spricht der Hinweis dafür, dass es heute regnet?
    params:
      buckets: [{ label: stark }, { label: schwach }]
      items:
        - { label: Dunkle Wolken und Donner, bucket: stark }
        - { label: Der Wetterbericht sagt 90 % Regen, bucket: stark }
        - { label: Es ist Montag, bucket: schwach }
        - { label: Gestern hat es geregnet, bucket: schwach }
    hints:
      - Wie viel häufiger tritt der Hinweis bei Regen auf als ohne?
    explanation: Stark ist ein Hinweis, der bei Regen viel häufiger auftritt als ohne.

  - kind: problem
    id: sturkopf
    widget: choice
    prompt: Jemand ist sich zu 100 % sicher. Was sagt Bayes dazu?
    params:
      options:
        - { label: Dann kann ihn kein Beweis der Welt mehr umstimmen., correct: true }
        - { label: Das ist die beste Haltung., feedback: "Wer mit 100 % startet, kann nichts mehr dazulernen." }
    hints:
      - Was ergibt 100 % mal irgendein Hinweis?
    explanation: Kluge Menschen lassen immer etwas Raum für Irrtum.

  - kind: problem
    id: wetten
    widget: numeric
    prompt: Du schätzt etwas auf 1 zu {{k}} – also eins von {{k + 1}} gleich wahrscheinlichen Fällen. Wie viel Prozent sind das, gerundet?
    params: { unit: "%" }
    answer: { value: "{{round(100 / (k + 1))}}", tolerance: 1 }
    hints:
      - "100 : {{k + 1}}."
    explanation: "Etwa {{round(100 / (k + 1))}} %."
    variants:
      params: { k: "choice[1,3,4,9,19]" }
      defaults: { k: 3 }

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Wahrscheinlichkeit – von fast unmöglich bis fast sicher.
    params:
      items:
        - label: Du gewinnst morgen im Lotto
        - label: Du würfelst eine Sechs
        - label: Eine Münze zeigt Kopf
        - label: Morgen geht die Sonne auf
    hints:
      - "Denk an Zahlen: 1 zu Millionen, 1 zu 6, 1 zu 2 …"
    explanation: Zwischen unmöglich und sicher liegt eine ganze Skala.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du hältst eine Hypothese für 50 % wahrscheinlich. Dann erfährst du etwas, das bei wahr und falsch gleich wahrscheinlich wäre. Was tust du?
    params:
      options:
        - label: Nichts – der Hinweis unterscheidet nicht zwischen den Möglichkeiten
          correct: true
        - label: Die Wahrscheinlichkeit erhöhen
          feedback: Nur was besser zu einer Seite passt, verschiebt.
        - label: Die Wahrscheinlichkeit senken
          feedback: Auch dafür gibt es keinen Grund.
    hints:
      - Das Likelihood-Verhältnis ist 1.
    explanation: Ein Hinweis zählt nur, wenn er unter einer Annahme wahrscheinlicher ist als unter der anderen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Zwei Menschen starten mit sehr verschiedenen Meinungen, sehen aber immer dieselben Daten. Was sagt die Bayes-Theorie voraus?
    params:
      options:
        - label: Ihre Einschätzungen nähern sich an – genug Daten überstimmen jeden Prior
          correct: true
        - label: Sie bleiben für immer uneins
          feedback: Nur wer mit 0 % oder 100 % startet, bewegt sich nie.
        - label: Sie tauschen ihre Meinungen
          feedback: Sie bewegen sich aufeinander zu.
    hints:
      - Jeder Hinweis verschiebt beide in dieselbe Richtung.
    explanation: "Darum ist es klug, nie absolut sicher zu sein: Dann können Daten dich noch korrigieren."
    difficulty: 3

srs:
  cards_from: [staerke, sturkopf]
