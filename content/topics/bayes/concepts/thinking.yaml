id: stats.bayes.thinking
type: concept
title: Denken in Wahrscheinlichkeiten
summary: Meinungen klug anpassen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Bayes-Denken heißt: Überzeugungen nicht als ja oder nein sehen, sondern als **Wahrscheinlichkeiten**. Jeder neue Hinweis verschiebt sie – starke Hinweise stark, schwache schwach.

  - kind: problem
    id: staerke
    widget: buckets
    prompt: Wie stark spricht der Hinweis dafür, dass es heute regnet?
    params:
      buckets: [{ label: stark }, { label: schwach }]
      items:
        - { label: Dunkle Wolken und Donner, bucket: stark }
        - { label: Der Wetterbericht sagt 90 % Regen, bucket: stark }
        - { label: Es ist Montag, bucket: schwach }
        - { label: Gestern hat es geregnet, bucket: schwach }
    hints:
      - Wie viel häufiger tritt der Hinweis bei Regen auf als ohne?
    explanation: Stark ist ein Hinweis, der bei Regen viel häufiger auftritt als ohne.

  - kind: problem
    id: sturkopf
    widget: choice
    prompt: Jemand ist sich zu 100 % sicher. Was sagt Bayes dazu?
    params:
      options:
        - { label: Dann kann ihn kein Beweis der Welt mehr umstimmen., correct: true }
        - { label: Das ist die beste Haltung., feedback: "Wer mit 100 % startet, kann nichts mehr dazulernen." }
    hints:
      - Was ergibt 100 % mal irgendein Hinweis?
    explanation: Kluge Menschen lassen immer etwas Raum für Irrtum.

  - kind: problem
    id: wetten
    widget: numeric
    prompt: Du schätzt etwas auf 1 zu {{k}} – also eins von {{k + 1}} gleich wahrscheinlichen Fällen. Wie viel Prozent sind das, gerundet?
    params: { unit: "%" }
    answer: { value: "{{round(100 / (k + 1))}}", tolerance: 1 }
    hints:
      - "100 : {{k + 1}}."
    explanation: "Etwa {{round(100 / (k + 1))}} %."
    variants:
      params: { k: "choice[1,3,4,9,19]" }
      defaults: { k: 3 }

srs:
  cards_from: [staerke, sturkopf]
