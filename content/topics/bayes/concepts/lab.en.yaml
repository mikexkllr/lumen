id: stats.bayes.lab
type: concept
title: Bayes Lab
summary: A hands-on spam filter.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: haeufigkeiten
    widget: chart
    body: Of 100 emails, 50 are spam. The word "Prize" appears in 40 % of spam emails, but only 2 % of regular ones.
    prompt: Set how many spam and how many regular emails contain the word.
    params:
      labels: [Spam, regular]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 25
    answer: { values: [20, 1] }
    hints:
      - 40 % of 50 and 2 % of 50.
    explanation: 20 spam emails, but only one regular one.

  - kind: problem
    id: wahrscheinlich
    widget: numberline
    prompt: An email contains "Prize". Mark roughly how likely it is to be spam.
    params: { min: 0, max: 1, ticks: 20, labels: decimals }
    answer: { value: 0.95 }
    hints:
      - 20 out of 21 emails with the word.
    explanation: "20 ÷ 21 ≈ 0.95. That is a strong signal."

  - kind: problem
    id: mengen
    widget: venn
    prompt: Shade all emails that contain the word "Prize".
    params: { sets: [Spam, Prize] }
    answer: { regions: [B, AB] }
    hints:
      - The whole "Prize" circle.
    explanation: Bayes asks how much of this circle lies inside spam.

  - kind: problem
    id: hinweise
    widget: buckets
    prompt: Does the clue strengthen or weaken the guess "It rained"?
    params:
      buckets: [{ label: strengthens }, { label: weakens }]
      items:
        - { label: The street is wet, bucket: strengthens }
        - { label: Many umbrellas are open, bucket: strengthens }
        - { label: The sidewalk is bone dry, bucket: weakens }
        - { label: Everyone is wearing sunglasses, bucket: weakens }
    hints:
      - Is the clue more or less common when it rains?
    explanation: Each clue shifts the probability one way or the other.

srs:
  cards_from: [haeufigkeiten, wahrscheinlich]
