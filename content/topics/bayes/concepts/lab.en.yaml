id: stats.bayes.lab
type: concept
title: Bayes Lab
summary: A hands-on spam filter.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: haeufigkeiten
    widget: chart
    body: Of 100 emails, 50 are spam. The word "Prize" appears in 40 % of spam emails, but only 2 % of regular ones.
    prompt: Set how many spam and how many regular emails contain the word.
    params:
      labels: [Spam, regular]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 25
    answer: { values: [20, 1] }
    hints:
      - 40 % of 50 and 2 % of 50.
    explanation: 20 spam emails, but only one regular one.

  - kind: problem
    id: wahrscheinlich
    widget: numberline
    prompt: An email contains "Prize". Mark roughly how likely it is to be spam.
    params: { min: 0, max: 1, ticks: 20, labels: decimals }
    answer: { value: 0.95 }
    hints:
      - 20 out of 21 emails with the word.
    explanation: "20 ÷ 21 ≈ 0.95. That is a strong signal."

  - kind: problem
    id: mengen
    widget: venn
    prompt: Shade all emails that contain the word "Prize".
    params: { sets: [Spam, Prize] }
    answer: { regions: [B, AB] }
    hints:
      - The whole "Prize" circle.
    explanation: Bayes asks how much of this circle lies inside spam.

  - kind: problem
    id: hinweise
    widget: buckets
    prompt: Does the clue strengthen or weaken the guess "It rained"?
    params:
      buckets: [{ label: strengthens }, { label: weakens }]
      items:
        - { label: The street is wet, bucket: strengthens }
        - { label: Many umbrellas are open, bucket: strengthens }
        - { label: The sidewalk is bone dry, bucket: weakens }
        - { label: Everyone is wearing sunglasses, bucket: weakens }
    hints:
      - Is the clue more or less common when it rains?
    explanation: Each clue shifts the probability one way or the other.

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: In the lab chart, 20 spam mails and 1 normal mail contain the word. How likely is a mail with this word spam? In percent, to one decimal.
    answer:
      value: 95.2
      tolerance: 0.1
    hints:
      - "Mails with the word: 20 + 1 = 21."
      - Compute 20 ÷ 21.
    explanation: "20/21 ≈ 95.2 %. Natural frequencies: just count the cases with the clue."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: what does it mean to think “like a Bayesian”?"
    params:
      keywords:
        - - vorwissen
          - basisrate
          - vorher
          - prior
          - base rate
          - before
        - - hinweis
          - daten
          - beweis
          - evidence
          - data
        - - anpass
          - aktualisier
          - verschieb
          - update
          - adjust
          - shift
        - - wahrscheinlich
          - probab
          - likely
      min: 3
      sample: You start with a probability from prior knowledge and update it with every new piece of evidence. Strong evidence shifts it a lot, weak evidence little – and you never stay 100% certain.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: You know nothing about a coin and want to estimate its heads chance p. Which prior is a sensible start?
    params:
      options:
        - label: All values of p between 0 and 1 equally likely
          correct: true
        - label: A 100 % prior can no longer be changed by any data.
          feedback: Ein Prior von 100 % lässt sich durch keine Daten mehr ändern.
        - label: Bayes always needs a prior – you just have to state it.
          feedback: Bayes braucht immer einen Prior – man muss ihn nur offenlegen.
    hints:
      - Which prior keeps all possibilities open?
      - Laplace's rule of succession follows from it.
    explanation: The flat prior rules nothing out. After a few flips the data dominate. That is why the choice barely matters with lots of data – but does with little.
    difficulty: 3

srs:
  cards_from: [haeufigkeiten, wahrscheinlich]
