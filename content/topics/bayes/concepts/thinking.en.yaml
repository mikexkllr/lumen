id: stats.bayes.thinking
type: concept
title: Thinking in Probabilities
summary: Adjust your beliefs wisely.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "You think it is 70% likely to rain tomorrow. Then a good forecast says: sun. What do you do?"
    params:
      options:
        - label: Lower my estimate clearly
          correct: true
        - label: Stay at 70%
          feedback: Then the new clue would be worth nothing.
        - label: Go to 0% at once
          feedback: Even good forecasts are sometimes wrong.
    hints:
      - How strong is the clue?
    explanation: Adjust beliefs instead of flipping them – that is thinking in probabilities.

  - kind: explain
    id: s1
    body: |
      Bayesian thinking means seeing beliefs not as yes or no, but as **probabilities**. Each new clue shifts them. Strong clues shift them a lot, weak clues a little.

  - kind: problem
    id: staerke
    widget: buckets
    prompt: How strongly does the clue suggest that it is raining today?
    params:
      buckets: [{ label: strong }, { label: weak }]
      items:
        - { label: Dark clouds and thunder, bucket: strong }
        - { label: The forecast says 90 % chance of rain, bucket: strong }
        - { label: It is Monday, bucket: weak }
        - { label: It rained yesterday, bucket: weak }
    hints:
      - How much more often does the clue appear with rain than without?
    explanation: A clue is strong if it appears much more often with rain than without.

  - kind: problem
    id: sturkopf
    widget: choice
    prompt: Someone is 100 % sure. What does Bayes say about that?
    params:
      options:
        - { label: Then no evidence in the world can change their mind., correct: true }
        - { label: That is the best attitude., feedback: "Starting at 100 % leaves no room to learn." }
    hints:
      - What is 100 % times any clue?
    explanation: Wise people always leave some room for error.

  - kind: problem
    id: wetten
    widget: numeric
    prompt: You put the odds at 1 to {{k}}, which is one out of {{k + 1}} equally likely cases. What percentage is that, rounded?
    params: { unit: "%" }
    answer: { value: "{{round(100 / (k + 1))}}", tolerance: 1 }
    hints:
      - "100 ÷ {{k + 1}}."
    explanation: "About {{round(100 / (k + 1))}} %."
    variants:
      params: { k: "choice[1,3,4,9,19]" }
      defaults: { k: 3 }

  - kind: problem
    id: mix-c1
    widget: order
    prompt: How likely is it? Order from almost never to almost sure.
    params:
      items:
        - label: You win the lottery tomorrow
        - label: You roll a six
        - label: A coin shows heads
        - label: The Sun rises tomorrow
    hints:
      - "Think in numbers: 1 in millions, 1 in 6, 1 in 2 …"
    explanation: Between impossible and certain lies a whole scale.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: You hold a hypothesis to be 50% likely. Then you learn something that would be equally likely whether it is true or false. What do you do?
    params:
      options:
        - label: Nothing – the evidence does not discriminate between the possibilities
          correct: true
        - label: Raise the probability
          feedback: Only what fits one side better shifts it.
        - label: Lower the probability
          feedback: There is no reason for that either.
    hints:
      - The likelihood ratio is 1.
    explanation: Evidence only counts if it is more likely under one assumption than under the other.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "The odds are {{k}} : 1. What percent is that?"
    answer:
      value: "{{100 * k / (k + 1)}}"
    feedback:
      - when: numval(state.input) == 100 * k / (k + 2)
        misconception: odds-count
        text: "With {{k}} : 1 there are {{k + 1}} cases in total, not {{k + 2}}."
    hints:
      - "{{k}} : 1 means {{k}} favourable cases for 1 unfavourable one."
      - Compute {{k}} ÷ {{k + 1}}.
    explanation: "{{k}}/{{k + 1}} = {{100 * k / (k + 1)}} %. Odds and probabilities are two ways to write the same belief."
    difficulty: 2
    variants:
      params:
        k: choice[1,3,4,9,19,99]
      defaults:
        k: 4

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A clue has likelihood ratio 1. What does it do?
    params:
      options:
        - label: Nothing – it is equally likely under both hypotheses
          correct: true
        - label: Only a ratio above 1 can confirm.
          feedback: Bestätigen kann nur ein Verhältnis über 1.
        - label: Only a ratio below 1 can refute.
          feedback: Widerlegen kann nur ein Verhältnis unter 1.
    hints:
      - Odds times 1 gives …?
      - Evidence only counts if it tells the options apart.
    explanation: A clue that fits everything says nothing. The question is never »does it fit?« but »how much better does it fit A than B?«.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Two people start with very different opinions but always see the same data. What does Bayesian theory predict?
    params:
      options:
        - label: Their assessments converge – enough data overrule any prior
          correct: true
        - label: They stay at odds forever
          feedback: Only someone starting at 0% or 100% never moves.
        - label: They swap opinions
          feedback: They move towards each other.
    hints:
      - Every piece of evidence shifts both in the same direction.
    explanation: "That is why it is wise never to be absolutely certain: then data can still correct you."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: You start at 50 %. One clue has factor 3, a second one factor 1/3. Where do you end up? In percent.
    answer:
      value: 50
    hints:
      - "Starting odds 1 : 1."
      - 1 · 3 · 1/3 = 1.
    explanation: "Back at 50 %. In log-odds these are +log 3 and −log 3: clues are steps on a scale that can cancel out."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Someone looks only for clues that confirm their opinion and overlooks counter-evidence. What do they violate in Bayesian terms?
    params:
      options:
        - label: They do not use all the data – Bayes needs every clue, including awkward ones
          correct: true
        - label: Prior knowledge yes, but evidence must not be filtered.
          feedback: Vorwissen ja, aber Hinweise dürfen nicht ausgesiebt werden.
        - label: The problem is the selection of data.
          feedback: Das Problem liegt bei der Auswahl der Daten.
    hints:
      - What happens to the calculation if counter-evidence is missing?
      - Filtered data are a biased sample.
    explanation: Confirmation bias feeds Bayes only half the data. Then belief always drifts in the same direction – whatever is true.
    difficulty: 3

srs:
  cards_from: [staerke, sturkopf]
