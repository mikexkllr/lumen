id: stats.bayes.update
type: concept
title: Calculating with Frequencies
summary: Bayes without a formula.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: 1 in 100 people is ill. A test spots 9 of 10 ill people but also flags 9 of 100 healthy ones. You test positive. How likely are you ill?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 9
      tolerance: 6
    explanation: Only about 9%. Most people guess far higher.

  - kind: explain
    id: s1
    body: |
      Bayes is easiest with **natural frequencies**. Picture 1000 people. 1 % are sick, so 10. The test catches 9 of them. Among the 990 healthy people, it falsely shows positive for 9 %.

  - kind: problem
    id: falsch
    widget: numeric
    prompt: How many of the 990 healthy people get a false positive?
    params: { unit: people }
    answer: { value: 89, tolerance: 1 }
    hints:
      - 9 % of 990.
    explanation: About 89 healthy people. That is far more than the 9 truly sick.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: What percentage of positive results are truly sick?
    params: { unit: "%" }
    answer: { value: 9, tolerance: 1 }
    feedback:
      - when: "numval(state.input) == 90"
        misconception: confuse-sensitivity
        text: 90 % is the share of sick people the test catches. The question is the share among all positives.
    hints:
      - 9 true cases out of 9 + 89 positives.
    explanation: 9 out of 98, only about 9 %.

  - kind: problem
    id: zweiter
    widget: choice
    prompt: What helps when a test for a rare condition comes back positive?
    params:
      options:
        - { label: "Take a second, independent test", correct: true }
        - { label: Repeat the same test right away several times, feedback: "Repeated errors from the same test are often not independent." }
    hints:
      - After the first test, the new base rate is much higher.
    explanation: The first positive raises the prior from 1 % to 9 %. A second test boosts it a lot more.

  - kind: problem
    id: c1
    widget: order
    prompt: Bayes with natural frequencies. Order the steps.
    params:
      items:
        - label: Imagine 1000 people.
        - label: Split them by the base rate into sick and healthy.
        - label: Count the positive tests in both groups.
        - label: Divide the sick positives by all positives.
    hints:
      - First split the people, then test.
    explanation: With whole people instead of percentages even doctors solve the task three times as often.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A drawer holds 3 coins: 2 fair and 1 with two heads. You draw one and toss heads. How likely is it the two-headed one? As a fraction."
    answer:
      value: 1/2
    hints:
      - "Count head faces: the fair ones have one each, the special one two."
    explanation: Of 4 possible head faces 2 belong to the double coin. One toss turns 1/3 into 1/2.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "A drawer holds {{k}} coins: one with two heads, the rest fair. You draw one and flip heads. How likely is it the two-headed one? As a fraction."
    answer:
      value: 2/{{k + 1}}
    feedback:
      - when: numval(state.input) == 1 / k
        misconception: ignore-evidence
        text: That is the prior. The heads result points to the two-headed coin.
    hints:
      - "Imagine 2 flips per coin: the two-headed one gives 2 heads, each fair one gives 1."
      - "Heads in total: 2 + {{k - 1}} = {{k + 1}}."
    explanation: 2 of the {{k + 1}} heads come from the two-headed coin. Natural frequencies turn Bayes into a tally.
    difficulty: 2
    variants:
      params:
        k: choice[2,3,4,5,7,9]
      defaults:
        k: 3

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Drawer with 3 coins (2 fair, 1 two-headed). You flip the drawn coin twice: heads twice. How likely is it the two-headed one? As a fraction."
    answer:
      value: 2/3
    hints:
      - "Two-headed: chance 1 of HH. Fair: chance 1/4 of HH."
      - "Weights: 1/3 · 1 versus 2/3 · 1/4 = 1/3 versus 1/6."
    explanation: (1/3) ÷ (1/3 + 1/6) = 2/3. After one head 1/2, after two 2/3, after ten almost 100 %. Each flip updates the belief.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Bayes’ formula in odds: new odds = old odds · likelihood ratio. The odds are 1 to 99. A test is positive 10 times as often in the sick as in the healthy. What percent is it afterwards? Rounded."
    params:
      unit: "%"
    answer:
      value: 9
      tolerance: 0.5
    hints:
      - "New odds: 10 to 99. That is 10 out of 109."
    explanation: 10/109 ≈ 9%. Calculated in odds, Bayes is a single multiplication.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Laplace asked: the sun rose on n days, never failing. How likely does it rise tomorrow? His rule of succession: (successes + 1) ÷ (trials + 2). What is that for 10 out of 10? As a fraction."
    answer:
      value: 11/12
    hints:
      - Successes 10, trials 10.
      - (10 + 1) ÷ (10 + 2).
    explanation: 11/12. The rule follows from Bayes with a uniform prior. It never says 100 % – even after many successes there is room for surprise.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: "Two pieces of evidence arrive at a clinic: first a blood test, then an X-ray. The next day in the other order. What does Bayes say about the result?"
    params:
      options:
        - label: The same – the order does not matter
          correct: true
        - label: Not for Bayes, though often for people.
          feedback: Bei Bayes nicht, bei Menschen oft schon.
        - label: The likelihoods are simply multiplied.
          feedback: Die Likelihoods werden einfach multipliziert.
    hints:
      - Bayes multiplies the odds by each likelihood ratio.
      - Is a · b the same as b · a?
    explanation: With independent evidence, today's posterior becomes tomorrow's prior. Because of the multiplication, order does not matter.
    difficulty: 3

srs:
  cards_from: [anteil, zweiter]
