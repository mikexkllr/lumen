id: stats.bayes.spam
type: concept
title: The Bayesian Spam Filter
summary: Words as evidence.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The filter counts words
    body: 'Your email app sorts out spam without understanding the emails. It only counts words. Here you only see emails containing the word "free". Draw 10, then 100 of them: how often is it **spam**?'
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: spam
            weight: 6
          - label: real email
            weight: 1
        sample:
          - 10
          - 100

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percentage of all e-mails worldwide is spam?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 45
      tolerance: 12
    explanation: Almost half. Without filters your inbox would be useless.

  - kind: explain
    id: s1
    body: |
      A **Bayesian filter** asks: how often does a word appear in spam, and how often in regular emails? Say 500 of 1000 emails are spam. The word "Prize" appears in 40 % of spam emails, but only 1 % of regular ones.

  - kind: problem
    id: spam
    widget: numeric
    prompt: In how many of the 500 spam emails does "Prize" appear?
    params: { unit: emails }
    answer: { value: 200 }
    hints:
      - 40 % of 500.
    explanation: 200 spam emails contain the word.

  - kind: problem
    id: normal
    widget: numeric
    prompt: In how many of the 500 regular emails does "Prize" appear?
    params: { unit: emails }
    answer: { value: 5 }
    hints:
      - 1 % of 500.
    explanation: Only 5 regular emails. The word is a strong spam signal.

  - kind: problem
    id: schluss
    widget: choice
    prompt: A new email contains "Prize". How likely is it to be spam?
    params:
      options:
        - { label: "Very likely, about 98 %", correct: true }
        - { label: Exactly 40 %, feedback: "40 % is the share among spam. The question is the share of spam among all Prize emails." }
    hints:
      - 200 out of 205 emails with this word.
    explanation: 200 out of 205 ≈ 98 %. Real filters combine hundreds of words this way.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A mail contains two words. “Free” is 20 times as frequent in spam as in normal mail, “meeting” only 1/5 as frequent in spam. By what factor do both together change the odds of spam?
    answer:
      value: 4
    hints:
      - "Multiply the ratios: 20 · 1/5."
    explanation: Factor 4. Every word is a piece of evidence – for or against.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: »Free« appears in 40 % of spam mails and in 1 % of normal ones. What is the likelihood ratio for this word?
    answer:
      value: 40
    hints:
      - Divide the frequency in spam by that in normal mail.
      - 40 % ÷ 1 %.
    explanation: "Factor 40: the word is 40 times more common in spam. Each time it appears, the spam odds are multiplied by 40."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Only 20 % of all mails are spam – odds 1 : 4. A mail contains »free« (factor 40). How likely is it spam? In percent, to one decimal."
    answer:
      value: 90.9
      tolerance: 0.1
    hints:
      - "New odds: 1 : 4 · 40 = 40 : 4 = 10 : 1."
      - Probability = 10 ÷ (10 + 1).
    explanation: 10/11 ≈ 90.9 %. With a base rate of 50 % it would be 97.6 %. The prior always counts.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The filter is called “naive” Bayes. What is naive about it?
    params:
      options:
        - label: It assumes that all words occur independently of each other
          correct: true
        - label: It was programmed by beginners
          feedback: The name describes a mathematical simplification.
        - label: It believes every mail
          feedback: It rates by probabilities.
    hints:
      - “Free” and “prize” often occur together.
    explanation: The assumption is false – and works surprisingly well anyway. A simple robust model often beats a complicated one.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: The word »crosswalk« never appeared in a single spam mail during training. The filter uses 0 %. What happens to a spam mail containing that word?
    params:
      options:
        - label: It counts as certainly not spam – whatever other words it contains
          correct: true
        - label: Times zero stays zero.
          feedback: Mal null bleibt null.
        - label: The zero works the other way.
          feedback: Die Null wirkt in die andere Richtung.
    hints:
      - Bayes multiplies. What does multiplying by 0 give?
      - So one adds a small number to every word count.
    explanation: A single unseen word would set everything to zero. Laplace smoothing counts every word once extra – then nothing is impossible.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Real filters use the logarithm of the likelihood ratios and add them up. Why?
    params:
      options:
        - label: Products of many small numbers underflow to zero on a computer – sums do not
          correct: true
        - label: Mathematically it is the same result.
          feedback: Mathematisch ist es dasselbe Ergebnis.
        - label: Every word counts exactly as much as before.
          feedback: Jedes Wort zählt genau gleich viel wie vorher.
    hints:
      - log(a · b) = log a + log b.
      - What happens when you multiply 1000 numbers like 0.001?
    explanation: "In log-odds space Bayes becomes addition: each word gives points for or against spam. That is fast and numerically stable."
    difficulty: 3

srs:
  cards_from: [normal, schluss]
