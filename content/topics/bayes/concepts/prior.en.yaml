id: stats.bayes.prior
type: concept
title: Prior Knowledge Matters
summary: Don't forget the base rate.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: bibliothek
    widget: choice
    body: Tom is quiet, tidy, and likes to read.
    prompt: Is Tom more likely a librarian or a salesperson?
    params:
      options:
        - { label: More likely a salesperson, correct: true }
        - { label: More likely a librarian, feedback: "There are over 20 times more salespeople. That outweighs the description." }
    hints:
      - How many salespeople are there compared to librarians?
    explanation: Even if the description fits librarians better, how common each job is also counts.

  - kind: explain
    id: s2
    body: |
      The **base rate** is how common something is to begin with. If you forget it, you overestimate rare things. **Bayesian thinking** means weighing prior knowledge and new clues together.

  - kind: problem
    id: selten
    widget: numeric
    prompt: A disease affects 1 in {{n}} people. How many sick people do you expect among 10,000 people?
    params: { unit: sick people }
    answer: { value: "{{10000 / n}}" }
    hints:
      - "10,000 ÷ {{n}}."
    explanation: "{{10000 / n}} sick people. That is very few compared to the healthy."
    variants:
      params: { n: "choice[100,500,1000,2000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: hufe
    widget: choice
    prompt: "\"When you hear hoofbeats, think horses, not zebras.\" What do doctors mean by this?"
    params:
      options:
        - { label: Common causes are more likely than exotic ones., correct: true }
        - { label: Zebras are more dangerous., feedback: "It is about how common something is, not how dangerous." }
    hints:
      - What is more common in Europe?
    explanation: Check the common explanations first. That is base-rate thinking.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Linda is 31, bright and committed to social justice. Which is more likely?
    params:
      options:
        - label: Linda is a bank teller
          correct: true
        - label: Linda is a bank teller and an active feminist
          feedback: Two conditions together can never be more likely than one of them.
    hints:
      - Every feminist bank teller is also a bank teller.
    explanation: "The **conjunction fallacy**: a fitting story feels more likely – but never is."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What is the **prior** in Bayesian thinking?
    params:
      options:
        - label: The probability before seeing the new data
          correct: true
        - label: The probability of the data
          feedback: That is the likelihood.
        - label: The final result after the calculation
          feedback: That is the posterior.
    hints:
      - “Prior” means “before”.
    explanation: Prior times likelihood gives the **posterior** – and that is the prior for the next piece of evidence.
    difficulty: 3

srs:
  cards_from: [bibliothek, hufe]
