id: stats.bayes.prior
type: concept
title: Prior Knowledge Matters
summary: Don't forget the base rate.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The gut gets it wrong
    body: Our gut often mistakes the rare for the common. Uncover the cards in any order. Guess first, then flip – and think of the **base rate**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦈
            front: Shark or cow?
            back: In the US, more people die from cows than from sharks every year. There are simply far more cows around.
          - icon: ✈️
            front: Plane or car?
            back: Per kilometre, driving is far more dangerous than flying. Crashes just stick in our minds better.
          - icon: 🎰
            front: Jackpot or lightning?
            back: The chance of the lottery jackpot is smaller than the chance of being struck by lightning within a year.

  - kind: problem
    id: bibliothek
    widget: choice
    body: Tom is quiet, tidy, and likes to read.
    prompt: Is Tom more likely a librarian or a salesperson?
    params:
      options:
        - { label: More likely a salesperson, correct: true }
        - { label: More likely a librarian, feedback: "There are over 20 times more salespeople. That outweighs the description." }
    hints:
      - How many salespeople are there compared to librarians?
    explanation: Even if the description fits librarians better, how common each job is also counts.

  - kind: explain
    id: s2
    body: |
      The **base rate** is how common something is to begin with. If you forget it, you overestimate rare things. **Bayesian thinking** means weighing prior knowledge and new clues together.

  - kind: problem
    id: selten
    widget: numeric
    prompt: A disease affects 1 in {{n}} people. How many sick people do you expect among 10,000 people?
    params: { unit: sick people }
    answer: { value: "{{10000 / n}}" }
    hints:
      - "10,000 ÷ {{n}}."
    explanation: "{{10000 / n}} sick people. That is very few compared to the healthy."
    variants:
      params: { n: "choice[100,500,1000,2000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: hufe
    widget: choice
    prompt: "\"When you hear hoofbeats, think horses, not zebras.\" What do doctors mean by this?"
    params:
      options:
        - { label: Common causes are more likely than exotic ones., correct: true }
        - { label: Zebras are more dangerous., feedback: "It is about how common something is, not how dangerous." }
    hints:
      - What is more common in Europe?
    explanation: Check the common explanations first. That is base-rate thinking.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[base rate]] tells how common something is at all. Whoever forgets it [[overrates]] rare things.
      distractors:
        - error rate
        - forgets

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Linda is 31, bright and committed to social justice. Which is more likely?
    params:
      options:
        - label: Linda is a bank teller
          correct: true
        - label: Linda is a bank teller and an active feminist
          feedback: Two conditions together can never be more likely than one of them.
    hints:
      - Every feminist bank teller is also a bank teller.
    explanation: "The **conjunction fallacy**: a fitting story feels more likely – but never is."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: 85 of 100 taxis are green, 15 blue. A witness gets colours right 80% of the time. He says “blue”. How likely was the taxi blue?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 41
      tolerance: 8
    explanation: Only 41%. He reports 12 of the 15 blue ones rightly – but also 17 green ones wrongly as blue.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "The taxi puzzle with 100 cabs: 15 are blue, 85 green. The witness identifies colours correctly 80 % of the time. How many of the 100 cabs would he call »blue«?"
    answer:
      value: 29
    feedback:
      - when: numval(state.input) == 12
        misconception: forgot-false-pos
        text: Those are only the real blue cabs he gets right. Add the green ones he gets wrong.
    hints:
      - "Blue, correctly named: 80 % of 15 = 12."
      - "Green, wrongly called »blue«: 20 % of 85 = 17."
    explanation: 12 + 17 = 29 cabs get called »blue«. More than half of them are actually green!
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Of these 29 »blue« cabs, 12 are really blue. How likely was the cab blue? In percent, to one decimal.
    answer:
      value: 41.4
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 80
        misconception: base-rate-neglect
        text: 80 % is the witness's accuracy. The base rate of only 15 % blue cabs is missing.
    hints:
      - Compute 12 ÷ 29.
      - That is about 0.414.
    explanation: 12/29 ≈ 41.4 %. Most people guess 80 % – they forget the base rate.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What is the **prior** in Bayesian thinking?
    params:
      options:
        - label: The probability before seeing the new data
          correct: true
        - label: The probability of the data
          feedback: That is the likelihood.
        - label: The final result after the calculation
          feedback: That is the posterior.
    hints:
      - “Prior” means “before”.
    explanation: Prior times likelihood gives the **posterior** – and that is the prior for the next piece of evidence.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Bayes as a formula: P(H | E) = P(E | H) · P(H) ÷ P(E). Here P(H) = 0.2, P(E | H) = 0.9 and P(E | not H) = 0.3. What is P(H | E) in percent? To one decimal."
    answer:
      value: 42.9
      tolerance: 0.1
    hints:
      - P(E) = 0.9 · 0.2 + 0.3 · 0.8 = 0.18 + 0.24 = 0.42.
      - Compute 0.18 ÷ 0.42.
    explanation: 0.18/0.42 = 3/7 ≈ 42.9 %. The denominator P(E) collects all routes to the evidence – with and without H.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A prior needs a reference class. How likely is a new restaurant in your street to still be open after 3 years? What is the best starting point?
    params:
      options:
        - label: With the share of similar restaurants that survive 3 years
          correct: true
        - label: That is evidence – the base rate comes first.
          feedback: Das ist ein Hinweis – erst kommt die Basisrate.
        - label: Two options do not mean equal chances.
          feedback: Zwei Möglichkeiten heißen nicht gleiche Chancen.
    hints:
      - What do you know about many similar cases?
      - Then you adjust with the details.
    explanation: First the outside view (base rate of similar cases), then the inside view (specifics). Those who see only details are usually too optimistic.
    difficulty: 3

srs:
  cards_from: [bibliothek, hufe]
