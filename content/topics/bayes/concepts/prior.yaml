id: stats.bayes.prior
type: concept
title: Vorwissen zählt
summary: Die Basisrate nicht vergessen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Bauchgefühl irrt
    body: Unser Bauchgefühl hält Seltenes oft für häufig. Deck die Karten auf, in beliebiger Reihenfolge. Rate erst, dann dreh um – und denk an die **Basisrate**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦈
            front: Hai oder Kuh?
            back: In den USA sterben jedes Jahr mehr Menschen durch Kühe als durch Haie. Kühe gibt es eben viel mehr.
          - icon: ✈️
            front: Flugzeug oder Auto?
            back: Pro Kilometer ist Autofahren viel gefährlicher als Fliegen. Abstürze bleiben uns nur besser im Kopf.
          - icon: 🎰
            front: Jackpot oder Blitz?
            back: Die Chance auf den Lotto-Jackpot ist kleiner als die, in einem Jahr vom Blitz getroffen zu werden.

  - kind: problem
    id: bibliothek
    widget: choice
    body: Tom ist still, ordentlich und liest gern.
    prompt: Ist Tom eher Bibliothekar oder eher Verkäufer?
    params:
      options:
        - { label: Eher Verkäufer, correct: true }
        - { label: Eher Bibliothekar, feedback: "Es gibt über 20-mal mehr Verkäufer – das wiegt die Beschreibung auf." }
    hints:
      - Wie viele Verkäufer gibt es im Vergleich zu Bibliothekaren?
    explanation: Selbst wenn die Beschreibung besser zu Bibliothekaren passt – die Häufigkeit zählt mit.

  - kind: explain
    id: s2
    body: |
      Die **Basisrate** ist, wie häufig etwas überhaupt vorkommt. Wer sie vergisst, überschätzt seltene Dinge. **Bayes-Denken** heißt: Vorwissen und neue Hinweise zusammen gewichten.

  - kind: problem
    id: selten
    widget: numeric
    prompt: Eine Krankheit hat 1 von {{n}} Menschen. Wie viele Kranke erwartet man unter 10 000 Menschen?
    params: { unit: Kranke }
    answer: { value: "{{10000 / n}}" }
    hints:
      - "10 000 : {{n}}."
    explanation: "{{10000 / n}} Kranke – sehr wenige gegenüber den Gesunden."
    variants:
      params: { n: "choice[100,500,1000,2000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: hufe
    widget: choice
    prompt: »Wenn du Hufe hörst, denk an Pferde, nicht an Zebras.« Was meinen Ärzte damit?
    params:
      options:
        - { label: Häufige Ursachen sind wahrscheinlicher als exotische., correct: true }
        - { label: Zebras sind gefährlicher., feedback: "Es geht um Häufigkeit, nicht um Gefahr." }
    hints:
      - Was ist in Europa häufiger?
    explanation: Erst die häufigen Erklärungen prüfen – das ist Basisraten-Denken.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die [[Basisrate]] sagt, wie häufig etwas überhaupt vorkommt. Wer sie vergisst, [[überschätzt]] seltene Dinge.
      distractors:
        - Fehlerquote
        - vergisst

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Linda ist 31, klug und engagiert sich für soziale Gerechtigkeit. Was ist wahrscheinlicher?
    params:
      options:
        - label: Linda ist Bankangestellte
          correct: true
        - label: Linda ist Bankangestellte und aktive Feministin
          feedback: Zwei Bedingungen zugleich können nie wahrscheinlicher sein als eine davon.
    hints:
      - Jede feministische Bankangestellte ist auch eine Bankangestellte.
    explanation: "Der **Konjunktionsfehlschluss**: Eine passende Geschichte fühlt sich wahrscheinlicher an – ist es aber nie."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: 85 von 100 Taxis sind grün, 15 blau. Ein Zeuge erkennt Farben zu 80 % richtig. Er sagt »blau«. Wie wahrscheinlich war das Taxi blau?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 41
      tolerance: 8
    explanation: Nur 41 %. Er meldet 12 der 15 blauen richtig – aber auch 17 grüne fälschlich als blau.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Taxi-Rätsel mit 100 Taxis: 15 sind blau, 85 grün. Der Zeuge erkennt Farben zu 80 % richtig. Wie viele der 100 Taxis würde er »blau« nennen?"
    answer:
      value: 29
    feedback:
      - when: numval(state.input) == 12
        misconception: forgot-false-pos
        text: Das sind nur die echten blauen, die er richtig erkennt. Dazu kommen grüne, die er falsch nennt.
    hints:
      - "Blaue, richtig erkannt: 80 % von 15 = 12."
      - "Grüne, falsch »blau« genannt: 20 % von 85 = 17."
    explanation: 12 + 17 = 29 Taxis heißen »blau«. Mehr als die Hälfte davon ist in Wahrheit grün!
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Von diesen 29 »blauen« Taxis sind 12 wirklich blau. Wie wahrscheinlich war das Taxi blau? In Prozent, auf eine Stelle.
    answer:
      value: 41.4
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 80
        misconception: base-rate-neglect
        text: 80 % ist die Treffsicherheit des Zeugen. Die Basisrate von nur 15 % blauen Taxis fehlt.
    hints:
      - "Rechne 12 : 29."
      - Das sind etwa 0,414.
    explanation: 12/29 ≈ 41,4 %. Die meisten Menschen tippen auf 80 % – sie vergessen die **Basisrate**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was ist der **Prior** im Bayes-Denken?
    params:
      options:
        - label: Die Wahrscheinlichkeit, bevor man die neuen Daten gesehen hat
          correct: true
        - label: Die Wahrscheinlichkeit der Daten
          feedback: Das ist die Likelihood.
        - label: Das Endergebnis nach der Rechnung
          feedback: Das ist der Posterior.
    hints:
      - »Prior« heißt »vorher«.
    explanation: Prior mal Likelihood ergibt den **Posterior** – und der ist der Prior für den nächsten Hinweis.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Bayes als Formel: P(H | E) = P(E | H) · P(H) : P(E). Es gilt P(H) = 0,2, P(E | H) = 0,9 und P(E | nicht H) = 0,3. Wie groß ist P(H | E) in Prozent? Auf eine Stelle."
    answer:
      value: 42.9
      tolerance: 0.1
    hints:
      - P(E) = 0,9 · 0,2 + 0,3 · 0,8 = 0,18 + 0,24 = 0,42.
      - "Rechne 0,18 : 0,42."
    explanation: 0,18/0,42 = 3/7 ≈ 42,9 %. Der Nenner P(E) sammelt **alle** Wege zum Hinweis – mit und ohne H.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Für einen Prior braucht man eine **Referenzklasse**. Wie wahrscheinlich ist es, dass ein neues Restaurant in deiner Straße nach 3 Jahren noch offen ist? Womit startest du am besten?
    params:
      options:
        - label: Mit dem Anteil ähnlicher Restaurants, die 3 Jahre überleben
          correct: true
        - label: Mit dem Bauchgefühl, wie gut das Essen ist
          feedback: Das ist ein Hinweis – erst kommt die Basisrate.
        - label: Mit 50 %, weil es offen oder zu sein kann
          feedback: Zwei Möglichkeiten heißen nicht gleiche Chancen.
    hints:
      - Was weißt du über viele ähnliche Fälle?
      - Danach passt man mit den Details an.
    explanation: Erst die Außensicht (Basisrate ähnlicher Fälle), dann die Innensicht (Besonderheiten). Wer nur Details sieht, ist meist zu optimistisch.
    difficulty: 3

srs:
  cards_from: [bibliothek, hufe]
