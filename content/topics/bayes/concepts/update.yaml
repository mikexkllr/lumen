id: stats.bayes.update
type: concept
title: Mit Häufigkeiten rechnen
summary: Bayes ohne Formel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ärzte verrechnen sich
    body: "Selbst Ärzte verrechnen sich bei positiven Tests – und zwar kräftig. Deck die Geschichte Schritt für Schritt auf. Am Ende steht ein einfacher Trick: **natürliche Häufigkeiten**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🩺
            front: Die Frage
            back: Rund 160 Frauenärzte sollten sagen, wie sicher ein positives Mammogramm Krebs bedeutet.
          - icon: 😬
            front: Die Antworten
            back: Die Antworten reichten von 1 % bis 90 %. Nur etwa jeder Fünfte wählte die richtige – seltener als bei bloßem Raten.
          - icon: 💡
            front: Der Trick
            back: "Dann bekamen sie die Zahlen als Häufigkeiten: »Von 1000 Frauen …«. Danach lagen 87 % richtig."

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: 1 von 100 Menschen ist krank. Ein Test erkennt 9 von 10 Kranken, schlägt aber auch bei 9 von 100 Gesunden an. Du testest positiv. Wie wahrscheinlich bist du krank?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 9
      tolerance: 6
    explanation: Nur etwa 9 %. Die meisten schätzen viel höher.

  - kind: explain
    id: s1
    body: |
      Bayes geht am einfachsten mit **natürlichen Häufigkeiten**: Stell dir 1000 Menschen vor. 1 % ist krank, also 10. Der Test erkennt 9 davon. Von den 990 Gesunden zeigt er bei 9 % fälschlich positiv.

  - kind: problem
    id: falsch
    widget: numeric
    prompt: Wie viele der 990 Gesunden bekommen ein falsch positives Ergebnis?
    params: { unit: Menschen }
    answer: { value: 89, tolerance: 1 }
    hints:
      - 9 % von 990.
    explanation: Rund 89 Gesunde – viel mehr als die 9 echten Kranken.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: Wie viel Prozent der positiv Getesteten sind wirklich krank?
    params: { unit: "%" }
    answer: { value: 9, tolerance: 1 }
    feedback:
      - when: "numval(state.input) == 90"
        misconception: confuse-sensitivity
        text: 90 % sind die erkannten Kranken – gefragt ist der Anteil unter allen Positiven.
    hints:
      - 9 echte von 9 + 89 Positiven.
    explanation: 9 von 98 – nur etwa 9 %.

  - kind: problem
    id: zweiter
    widget: choice
    prompt: Was hilft, wenn ein seltener Test positiv ausfällt?
    params:
      options:
        - { label: "Einen zweiten, unabhängigen Test machen", correct: true }
        - { label: Den gleichen Test sofort mehrmals wiederholen, feedback: "Wiederholte Fehler desselben Tests sind oft nicht unabhängig." }
    hints:
      - Nach dem ersten Test ist die neue Basisrate viel höher.
    explanation: Der erste Treffer hebt das Vorwissen von 1 % auf 9 % – ein zweiter Test steigert es stark.

  - kind: problem
    id: c1
    widget: order
    prompt: Bayes mit natürlichen Häufigkeiten. Ordne die Schritte.
    params:
      items:
        - label: Stell dir 1000 Menschen vor.
        - label: Teile sie nach der Basisrate in Kranke und Gesunde.
        - label: Zähle in beiden Gruppen die positiven Tests.
        - label: Teile die kranken Positiven durch alle Positiven.
    hints:
      - Erst die Menschen aufteilen, dann testen.
    explanation: Mit ganzen Menschen statt Prozenten lösen selbst Ärzte die Aufgabe dreimal so oft richtig.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Von 100 Menschen sind 5 krank. Der Test findet 4 davon, schlägt aber auch bei 10 Gesunden an. Färbe im Raster alle, die positiv testen.
    params:
      parts: 100
      shape: square
    answer:
      fraction: 7/50
    hints:
      - Positiv sind die erkannten Kranken und die falsch alarmierten Gesunden.
      - 4 + 10 = 14 Felder.
    explanation: 14 Menschen testen positiv, aber nur 4 davon sind krank – weniger als ein Drittel. So einfach wird Bayes mit **natürlichen Häufigkeiten**.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "In einer Schublade sind 3 Münzen: 2 faire und 1 mit zwei Köpfen. Du ziehst eine und wirfst Kopf. Wie wahrscheinlich ist es die doppelköpfige? Als Bruch."
    answer:
      value: 1/2
    hints:
      - "Zähle Kopf-Seiten: Die fairen haben je eine, die besondere zwei."
    explanation: Von 4 möglichen Kopf-Seiten gehören 2 zur Doppelmünze. Aus 1/3 wird durch einen Wurf 1/2.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Eine Schublade hat {{k}} Münzen: eine mit zwei Köpfen, die übrigen fair. Du ziehst eine und wirfst Kopf. Wie wahrscheinlich ist es die doppelköpfige? Als Bruch."
    answer:
      value: 2/{{k + 1}}
    feedback:
      - when: numval(state.input) == 1 / k
        misconception: ignore-evidence
        text: Das ist der Prior. Der Kopf-Wurf spricht für die doppelköpfige.
    hints:
      - "Stell dir 2 Würfe pro Münze vor: Die doppelköpfige gibt 2 Köpfe, jede faire 1."
      - "Köpfe insgesamt: 2 + {{k - 1}} = {{k + 1}}."
    explanation: 2 von {{k + 1}} Köpfen stammen von der doppelköpfigen. Natürliche Häufigkeiten machen Bayes zur Strichliste.
    difficulty: 2
    variants:
      params:
        k: choice[2,3,4,5,7,9]
      defaults:
        k: 3

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Schublade mit 3 Münzen (2 fair, 1 doppelköpfig). Du wirfst die gezogene Münze **zweimal**: zweimal Kopf. Wie wahrscheinlich ist es die doppelköpfige? Als Bruch."
    answer:
      value: 2/3
    hints:
      - "Doppelköpfig: Chance 1 auf KK. Fair: Chance 1/4 auf KK."
      - "Gewichte: 1/3 · 1 gegen 2/3 · 1/4 = 1/3 gegen 1/6."
    explanation: "(1/3) : (1/3 + 1/6) = 2/3. Nach einem Kopf 1/2, nach zwei 2/3, nach zehn fast 100 %. Jeder Wurf **aktualisiert** die Einschätzung."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Die Bayes-Formel in Chancen: neue Chance = alte Chance · Likelihood-Verhältnis. Die Chance steht 1 zu 99. Ein Test ist bei Kranken 10-mal so oft positiv wie bei Gesunden. Wie viel Prozent sind es danach? Gerundet."
    params:
      unit: "%"
    answer:
      value: 9
      tolerance: 0.5
    hints:
      - "Neue Chance: 10 zu 99. Das sind 10 von 109."
    explanation: 10/109 ≈ 9 %. In Chancen gerechnet ist Bayes eine einzige Multiplikation.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Laplace fragte: Die Sonne ging an n Tagen auf, nie nicht. Wie wahrscheinlich geht sie morgen auf? Seine **Folgeregel**: (Erfolge + 1) : (Versuche + 2). Wie groß ist das für 10 von 10? Als Bruch."
    answer:
      value: 11/12
    hints:
      - Erfolge 10, Versuche 10.
      - "(10 + 1) : (10 + 2)."
    explanation: 11/12. Die Regel folgt aus Bayes mit gleichverteiltem Prior. Sie sagt nie 100 % – selbst nach vielen Erfolgen bleibt Platz für eine Überraschung.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: "Zwei Hinweise kommen in einer Ärztin-Praxis an: erst Blutwert, dann Röntgenbild. Am Tag danach in anderer Reihenfolge. Was gilt für das Ergebnis nach Bayes?"
    params:
      options:
        - label: Dasselbe – die Reihenfolge spielt keine Rolle
          correct: true
        - label: Der erste Hinweis zählt mehr
          feedback: Bei Bayes nicht, bei Menschen oft schon.
        - label: Der letzte Hinweis zählt mehr
          feedback: Die Likelihoods werden einfach multipliziert.
    hints:
      - Bayes multipliziert die Chance mit jedem Likelihood-Verhältnis.
      - Ist a · b dasselbe wie b · a?
    explanation: Bei unabhängigen Hinweisen wird das **Posterior** von heute zum Prior von morgen. Wegen der Multiplikation ist die Reihenfolge egal.
    difficulty: 3

srs:
  cards_from: [anteil, zweiter]
