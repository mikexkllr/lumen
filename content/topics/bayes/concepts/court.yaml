id: stats.bayes.court
type: concept
title: Bayes vor Gericht
summary: Der Fehlschluss des Anklägers.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Eins zu 73 Millionen
    body: Eine einzige Zahl kann vor Gericht über ein Leben entscheiden. Deck den echten Fall Schritt für Schritt auf. Er zeigt, wie gefährlich der **Fehlschluss des Anklägers** ist.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: ⚖️
            front: Sally Clark, 1999
            back: Zwei ihrer Babys starben plötzlich. Ein Experte nannte die Chance dafür 1 zu 73 Millionen. Sie wurde verurteilt.
          - icon: 🔍
            front: Der Fehler
            back: Er tat so, als wären beide Todesfälle unabhängig. Und er verglich nie mit der Chance auf zwei Morde.
          - icon: 🔓
            front: Das Ende
            back: 2003 wurde das Urteil aufgehoben. Die Statistik hatte das Gericht in die Irre geführt.

  - kind: problem
    id: treffer
    widget: numeric
    body: Eine DNA-Spur passt zufällig nur bei 1 von 1 Million Menschen. In der Region leben {{m}} Millionen Menschen.
    prompt: Wie viele Menschen in der Region passen rein zufällig zur Spur?
    params: { unit: Menschen }
    answer: { value: "{{m}}" }
    hints:
      - "Eine Person pro Million, {{m}} Millionen Menschen."
    explanation: "Etwa {{m}} Menschen – der Angeklagte ist nur einer davon."
    variants:
      params: { m: "int[3,9]" }
      defaults: { m: 5 }

  - kind: problem
    id: schuld
    widget: choice
    prompt: Der Ankläger sagt – die Chance auf einen Zufallstreffer ist eins zu einer Million, also ist der Angeklagte sicher schuldig. Stimmt das?
    params:
      options:
        - { label: Nein – ohne weitere Beweise ist er nur einer von mehreren Kandidaten., correct: true }
        - { label: Ja, feedback: "Das verwechselt zwei Fragen – wie selten ein Treffer ist und wie wahrscheinlich die Schuld." }
    hints:
      - Wie viele Menschen passen insgesamt?
    explanation: Das ist der **Fehlschluss des Anklägers** – er hat echte Fehlurteile verursacht.

  - kind: explain
    id: s3
    body: |
      Ein Beweis macht eine Hypothese wahrscheinlicher – wie stark, hängt vom **Vorwissen** ab. Kommen weitere unabhängige Hinweise dazu, etwa Zeugen oder ein Motiv, steigt die Wahrscheinlichkeit Schritt für Schritt.

  - kind: problem
    id: kombinieren
    widget: choice
    prompt: Was macht ein Urteil am verlässlichsten?
    params:
      options:
        - { label: "Mehrere unabhängige Beweise, die alle in dieselbe Richtung zeigen", correct: true }
        - { label: Ein einziger sehr seltener Treffer, feedback: "Ein Treffer allein lässt viele Kandidaten übrig." }
    hints:
      - Wie viele Kandidaten überstehen mehrere Prüfungen?
    explanation: Jeder unabhängige Beweis siebt weiter aus – zusammen werden sie stark.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Wie stark belastet der Hinweis? Ordne von schwach nach stark.
    params:
      items:
        - label: Der Täter trug eine Jacke
        - label: Die Blutgruppe passt (bei jedem Dritten)
        - label: Ein Schuhabdruck passt (1 von 1000)
        - label: Die DNA passt (1 von einer Milliarde)
    hints:
      - Je seltener das Merkmal, desto stärker der Hinweis.
    explanation: Ein Hinweis zählt umso mehr, je schlechter er auf Unschuldige passt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Eine Spur passt zu 1 von 100 000 Menschen. In der Region leben 2 Millionen. Ohne weitere Hinweise: Wie wahrscheinlich ist ein Passender der Täter? In Prozent, gerundet."
    params:
      unit: "%"
    answer:
      value: 5
      tolerance: 0.5
    hints:
      - Etwa 20 Menschen passen zufällig – plus der Täter.
    explanation: 1 von rund 20 – etwa 5 %, nicht 99,999 %. Erst weitere Indizien machen daraus Gewissheit.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Vor der Spur steht die Chance auf Schuld bei 1 : 1 000 000. Eine DNA-Spur hat das Likelihood-Verhältnis 1000, ein Zeuge 10. Beide sind unabhängig. Wie viel Prozent Schuld-Wahrscheinlichkeit ergibt das? Auf eine Stelle."
    answer:
      value: 1
      tolerance: 0.05
    hints:
      - "Neue Chance: 1 : 1 000 000 · 1000 · 10 = 1 : 100."
      - "Wahrscheinlichkeit = 1 : 101."
    explanation: 1/101 ≈ 1,0 %. Starke Hinweise können einen winzigen Prior nur bis zu einem gewissen Punkt heben. Für ein Urteil braucht es mehr.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: buckets
    prompt: Richtig gedacht oder ein Fehlschluss?
    params:
      buckets:
        - id: b1
          label: Fehlschluss
        - id: b2
          label: Richtig
      items:
        - label: »1 zu 1 Mio. Zufall, also schuldig.«
          bucket: b1
        - label: »20 passen, also ist die Spur wertlos.«
          bucket: b1
        - label: »Die Spur hebt die Chance stark an.«
          bucket: b2
        - label: »Wir brauchen weitere Beweise.«
          bucket: b2
    hints:
      - Verwechselt die Aussage P(Spur | unschuldig) mit P(unschuldig | Spur)?
      - Eine Spur, die 2 Mio. auf 20 eingrenzt, ist nicht wertlos.
    explanation: "Der **Anklägerfehlschluss** überschätzt, der Verteidigerfehlschluss unterschätzt die Spur. Richtig ist: Die Spur multipliziert die Chance, sie ersetzt sie nicht."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Der Verteidiger sagt: »20 Menschen passen – also ist die Spur wertlos.« Ist das richtig?"
    params:
      options:
        - label: Nein – sie hat 2 Millionen Verdächtige auf 20 reduziert
          correct: true
        - label: Ja – 5 % sind zu wenig
          feedback: Zusammen mit anderen Hinweisen kann sie entscheidend sein.
        - label: Ja – Zufallstreffer gibt es immer
          feedback: Das macht den Hinweis nicht wertlos.
    hints:
      - Wie groß war die Wahrscheinlichkeit vor der Spur?
    explanation: Der **Fehlschluss des Verteidigers**. Ein Hinweis ist so viel wert, wie er die Wahrscheinlichkeit **verschiebt**.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "Ein Verteidiger argumentierte 1995: Nur etwa 1 von 1000 Männern, die ihre Frau schlagen, tötet sie später. Also sei Gewalt in der Ehe kein Hinweis auf Mord. Wo liegt der Fehler?"
    params:
      options:
        - label: Die Frau wurde ermordet – man muss auf dieses Wissen bedingen
          correct: true
        - label: Die Zahl 1 von 1000 ist zu klein
          feedback: Auch mit korrekter Zahl bleibt die Frage falsch gestellt.
        - label: Es gibt keinen Fehler
          feedback: Die richtige Frage verändert das Ergebnis drastisch.
    hints:
      - Gesucht ist nicht P(Mord | Gewalt), sondern …?
      - P(Täter ist der Mann | Gewalt **und** Frau ermordet).
    explanation: Bedingt man auf »Frau wurde ermordet und vorher geschlagen«, war in den meisten Fällen der Mann der Täter. Die **richtige Bedingung** dreht das Argument um.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Fehlschluss des Anklägers mit Zahlen.
    params:
      keywords:
        - - million
          - region
          - einwohner
          - people
          - population
        - - passen
          - treffer
          - match
          - zufall
          - chance
        - - verwechsel
          - umgekehrt
          - confus
          - revers
          - swap
      sample: Eine Spur passt zufällig zu 1 von 1 Million Menschen. In einer Region mit 2 Millionen Einwohnern passen also etwa 2 Unschuldige plus der Täter. Der Ankläger verwechselt die Chance eines Zufallstreffers mit der Chance der Unschuld.
    explanation: P(Spur | unschuldig) ist winzig, P(unschuldig | Spur) aber nicht – das hängt davon ab, wie viele Menschen infrage kommen.
    difficulty: 3

srs:
  cards_from: [treffer, schuld]
