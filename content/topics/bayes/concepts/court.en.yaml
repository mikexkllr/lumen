id: stats.bayes.court
type: concept
title: Bayes in Court
summary: The prosecutor's fallacy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One in 73 million
    body: A single number can decide a life in court. Uncover the real case step by step. It shows how dangerous the **prosecutor's fallacy** is.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: ⚖️
            front: Sally Clark, 1999
            back: Two of her babies died suddenly. An expert put the chance at 1 in 73 million. She was convicted.
          - icon: 🔍
            front: The mistake
            back: He treated both deaths as independent. And he never compared it with the chance of two murders.
          - icon: 🔓
            front: The end
            back: In 2003 the verdict was overturned. The statistics had misled the court.

  - kind: problem
    id: treffer
    widget: numeric
    body: A DNA trace matches only 1 in 1 million people by chance. The region has {{m}} million people.
    prompt: How many people in the region match the trace purely by chance?
    params: { unit: people }
    answer: { value: "{{m}}" }
    hints:
      - "One person per million, {{m}} million people."
    explanation: "About {{m}} people. The defendant is only one of them."
    variants:
      params: { m: "int[3,9]" }
      defaults: { m: 5 }

  - kind: problem
    id: schuld
    widget: choice
    prompt: The prosecutor says the chance of a random match is one in a million, so the defendant must be guilty. Is that right?
    params:
      options:
        - { label: "No. Without more evidence, he is only one of several candidates.", correct: true }
        - { label: Yes, feedback: "This mixes up two questions: how rare a match is and how likely guilt is." }
    hints:
      - How many people match in total?
    explanation: This is the **prosecutor's fallacy**. It has caused real wrongful convictions.

  - kind: explain
    id: s3
    body: |
      Evidence makes a hypothesis more likely. How much depends on your **prior knowledge**. Further independent clues, such as witnesses or a motive, raise the probability step by step.

  - kind: problem
    id: kombinieren
    widget: choice
    prompt: What makes a verdict most reliable?
    params:
      options:
        - { label: "Several independent pieces of evidence that all point the same way", correct: true }
        - { label: "A single, very rare match", feedback: "A match alone leaves many candidates." }
    hints:
      - How many candidates survive several checks?
    explanation: Each independent piece of evidence narrows the field further. Together they are strong.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: How strongly does the clue incriminate? Order from weak to strong.
    params:
      items:
        - label: The culprit wore a jacket
        - label: The blood group fits (one in three)
        - label: A shoe print fits (1 in 1000)
        - label: The DNA fits (1 in a billion)
    hints:
      - The rarer the feature, the stronger the clue.
    explanation: A clue counts the more, the worse it fits innocent people.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A trace matches 1 in 100,000 people. 2 million live in the region. Without further evidence: how likely is a matching person the culprit? In percent, rounded."
    params:
      unit: "%"
    answer:
      value: 5
      tolerance: 0.5
    hints:
      - About 20 people match by chance – plus the culprit.
    explanation: 1 of about 20 – roughly 5%, not 99.999%. Only further evidence turns that into certainty.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Before the evidence the odds of guilt are 1 : 1,000,000. A DNA trace has likelihood ratio 1000, a witness 10. Both are independent. What probability of guilt results, in percent? To one decimal."
    answer:
      value: 1
      tolerance: 0.05
    hints:
      - "New odds: 1 : 1,000,000 · 1000 · 10 = 1 : 100."
      - Probability = 1 ÷ 101.
    explanation: 1/101 ≈ 1.0 %. Strong evidence can only lift a tiny prior so far. A verdict needs more.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: buckets
    prompt: Sound reasoning or a fallacy?
    params:
      buckets:
        - id: b1
          label: Fallacy
        - id: b2
          label: Sound
      items:
        - label: »1 in a million chance, so guilty.«
          bucket: b1
        - label: »20 people match, so it is worthless.«
          bucket: b1
        - label: »The trace raises the odds a lot.«
          bucket: b2
        - label: »We need further evidence.«
          bucket: b2
    hints:
      - Does the statement confuse P(trace | innocent) with P(innocent | trace)?
      - A trace that narrows 2 million down to 20 is not worthless.
    explanation: "The prosecutor's fallacy overrates the trace, the defence fallacy underrates it. The truth: the trace multiplies the odds, it does not replace them."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The defence lawyer says: “20 people match – so the trace is worthless.” Is that right?"
    params:
      options:
        - label: No – it has reduced 2 million suspects to 20
          correct: true
        - label: Yes – 5% is too little
          feedback: Together with other evidence it can be decisive.
        - label: Yes – chance matches always exist
          feedback: That does not make the evidence worthless.
    hints:
      - How large was the probability before the trace?
    explanation: The **defence attorney’s fallacy**. Evidence is worth as much as it **shifts** the probability.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "A defence lawyer argued in 1995: only about 1 in 1000 men who beat their wives later kill them. So domestic violence is no evidence of murder. Where is the error?"
    params:
      options:
        - label: The wife was murdered – one must condition on that fact
          correct: true
        - label: Even with the right number the question is wrong.
          feedback: Auch mit korrekter Zahl bleibt die Frage falsch gestellt.
        - label: The right question changes the result drastically.
          feedback: Die richtige Frage verändert das Ergebnis drastisch.
    hints:
      - The question is not P(murder | violence), but …?
      - P(husband did it | violence and the wife was murdered).
    explanation: Conditioning on »the wife was murdered and had been beaten«, in most cases the husband was the killer. The right condition flips the argument.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Explain the prosecutor's fallacy to Lux with numbers.
    params:
      keywords:
        - - million
          - region
          - einwohner
          - people
          - population
        - - passen
          - treffer
          - match
          - zufall
          - chance
        - - verwechsel
          - umgekehrt
          - confus
          - revers
          - swap
      sample: A trace matches 1 in a million people by chance. In a region of 2 million people about 2 innocent people match, plus the culprit. The prosecutor confuses the chance of a random match with the chance of innocence.
    explanation: P(trace | innocent) is tiny, but P(innocent | trace) need not be – it depends on how many people could have done it.
    difficulty: 3

srs:
  cards_from: [treffer, schuld]
