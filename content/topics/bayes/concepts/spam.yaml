id: stats.bayes.spam
type: concept
title: Der Bayes-Spamfilter
summary: Wörter als Beweise.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent aller E-Mails weltweit sind Spam?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 45
      tolerance: 12
    explanation: Fast die Hälfte. Ohne Filter wäre dein Postfach unbrauchbar.

  - kind: explain
    id: s1
    body: |
      Ein **Bayes-Filter** fragt: Wie oft kommt ein Wort in Spam vor – und wie oft in normalen Mails? Von 1000 Mails seien 500 Spam. Das Wort »Gewinn« steht in 40 % der Spam-Mails, aber nur in 1 % der normalen.

  - kind: problem
    id: spam
    widget: numeric
    prompt: In wie vielen der 500 Spam-Mails steht »Gewinn«?
    params: { unit: Mails }
    answer: { value: 200 }
    hints:
      - 40 % von 500.
    explanation: 200 Spam-Mails enthalten das Wort.

  - kind: problem
    id: normal
    widget: numeric
    prompt: In wie vielen der 500 normalen Mails steht »Gewinn«?
    params: { unit: Mails }
    answer: { value: 5 }
    hints:
      - 1 % von 500.
    explanation: Nur 5 normale Mails – das Wort ist ein starkes Spam-Signal.

  - kind: problem
    id: schluss
    widget: choice
    prompt: Eine neue Mail enthält »Gewinn«. Wie wahrscheinlich ist sie Spam?
    params:
      options:
        - { label: Sehr wahrscheinlich – etwa 98 %, correct: true }
        - { label: Genau 40 %, feedback: "40 % ist der Anteil unter Spam – gefragt ist der Anteil Spam unter allen Gewinn-Mails." }
    hints:
      - 200 von 205 Mails mit diesem Wort.
    explanation: 200 von 205 ≈ 98 %. Echte Filter kombinieren Hunderte Wörter so.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Mail enthält zwei Wörter. »Gratis« ist in Spam 20-mal so häufig wie in normalen Mails, »Meeting« in Spam nur 1/5-mal so häufig. Mit welchem Faktor ändern beide zusammen die Spam-Chance?
    answer:
      value: 4
    hints:
      - "Verhältnisse multiplizieren: 20 · 1/5."
    explanation: Faktor 4. Jedes Wort ist ein Hinweis – dafür oder dagegen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: »Gratis« steht in 40 % der Spam-Mails und in 1 % der normalen. Wie groß ist das Likelihood-Verhältnis für dieses Wort?
    answer:
      value: 40
    hints:
      - Teile die Häufigkeit in Spam durch die in normalen Mails.
      - "40 % : 1 %."
    explanation: "Faktor 40: Das Wort ist in Spam 40-mal so häufig. Jedes Mal, wenn es vorkommt, wird die Spam-Chance mal 40 genommen."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Nur 20 % aller Mails sind Spam – die Chance steht also 1 : 4. Eine Mail enthält »Gratis« (Faktor 40). Wie wahrscheinlich ist sie Spam? In Prozent, auf eine Stelle."
    answer:
      value: 90.9
      tolerance: 0.1
    hints:
      - "Neue Chance: 1 : 4 · 40 = 40 : 4 = 10 : 1."
      - "Wahrscheinlichkeit = 10 : (10 + 1)."
    explanation: 10/11 ≈ 90,9 %. Bei einer Basisrate von 50 % wären es 97,6 %. Der Prior zählt immer mit.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Filter heißt »naiver« Bayes. Was ist an ihm naiv?
    params:
      options:
        - label: Er nimmt an, dass alle Wörter unabhängig voneinander auftreten
          correct: true
        - label: Er wurde von Anfängern programmiert
          feedback: Der Name beschreibt eine mathematische Vereinfachung.
        - label: Er glaubt jeder Mail
          feedback: Er bewertet nach Wahrscheinlichkeiten.
    hints:
      - »Gratis« und »Gewinn« treten oft gemeinsam auf.
    explanation: Die Annahme ist falsch – und funktioniert trotzdem erstaunlich gut. Ein einfaches, robustes Modell schlägt oft ein kompliziertes.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Das Wort »Zebrastreifen« kam beim Lernen in keiner einzigen Spam-Mail vor. Der Filter rechnet mit 0 %. Was passiert bei einer Spam-Mail mit diesem Wort?
    params:
      options:
        - label: Sie gilt als sicher kein Spam – egal welche anderen Wörter drinstehen
          correct: true
        - label: Nichts, ein Wort fällt nicht ins Gewicht
          feedback: Mal null bleibt null.
        - label: Sie wird sicher als Spam erkannt
          feedback: Die Null wirkt in die andere Richtung.
    hints:
      - Bayes multipliziert. Was ergibt eine Multiplikation mit 0?
      - Man zählt darum zu jedem Wort eine kleine Zahl dazu.
    explanation: Ein einziges unbekanntes Wort würde alles auf null setzen. Die **Laplace-Glättung** zählt jedes Wort einmal extra – dann ist nichts unmöglich.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Echte Filter rechnen mit dem Logarithmus der Likelihood-Verhältnisse und addieren sie. Warum?
    params:
      options:
        - label: Produkte vieler kleiner Zahlen werden für den Computer zu null – Summen nicht
          correct: true
        - label: Logarithmen sind genauer als die Wahrheit
          feedback: Mathematisch ist es dasselbe Ergebnis.
        - label: Damit Wörter weniger zählen
          feedback: Jedes Wort zählt genau gleich viel wie vorher.
    hints:
      - log(a · b) = log a + log b.
      - Was passiert, wenn man 1000 Zahlen wie 0,001 malnimmt?
    explanation: "Im **Log-Odds**-Raum wird Bayes zur Addition: Jedes Wort gibt Punkte für oder gegen Spam. Das ist schnell und numerisch stabil."
    difficulty: 3

srs:
  cards_from: [normal, schluss]
