id: stats.bayes.lab
type: concept
title: Bayes-Labor
summary: Spamfilter zum Anfassen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: haeufigkeiten
    widget: chart
    body: Von 100 Mails sind 50 Spam. »Gewinn« steht in 40 % der Spam-Mails, aber nur in 2 % der normalen.
    prompt: Stell ein, wie viele Spam- und wie viele normale Mails das Wort enthalten.
    params:
      labels: [Spam, normal]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 25
    answer: { values: [20, 1] }
    hints:
      - 40 % von 50 und 2 % von 50.
    explanation: 20 Spam-Mails, aber nur eine normale.

  - kind: problem
    id: wahrscheinlich
    widget: numberline
    prompt: Eine Mail enthält »Gewinn«. Markiere ungefähr, wie wahrscheinlich sie Spam ist.
    params: { min: 0, max: 1, ticks: 20, labels: decimals }
    answer: { value: 0.95 }
    hints:
      - 20 von 21 Mails mit dem Wort.
    explanation: "20 : 21 ≈ 0,95 – ein starkes Signal."

  - kind: problem
    id: mengen
    widget: venn
    prompt: Färbe alle Mails, die das Wort »Gewinn« enthalten.
    params: { sets: [Spam, Gewinn] }
    answer: { regions: [B, AB] }
    hints:
      - Den ganzen Kreis »Gewinn«.
    explanation: Bayes fragt – wie viel von diesem Kreis liegt im Spam?

  - kind: problem
    id: hinweise
    widget: buckets
    prompt: Stärkt oder schwächt der Hinweis die Vermutung »Es hat geregnet«?
    params:
      buckets: [{ label: stärkt }, { label: schwächt }]
      items:
        - { label: Die Straße ist nass, bucket: stärkt }
        - { label: Viele Schirme sind offen, bucket: stärkt }
        - { label: Der Gehweg ist staubtrocken, bucket: schwächt }
        - { label: Alle tragen Sonnenbrillen, bucket: schwächt }
    hints:
      - Ist der Hinweis bei Regen häufiger oder seltener?
    explanation: Jeder Hinweis verschiebt die Wahrscheinlichkeit – in die eine oder andere Richtung.

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was bedeutet es, »bayesianisch« zu denken?"
    params:
      keywords:
        - - vorwissen
          - basisrate
          - vorher
          - prior
          - base rate
          - before
        - - hinweis
          - daten
          - beweis
          - evidence
          - data
        - - anpass
          - aktualisier
          - verschieb
          - update
          - adjust
          - shift
        - - wahrscheinlich
          - probab
          - likely
      min: 3
      sample: Man startet mit einer Wahrscheinlichkeit aus dem Vorwissen und passt sie mit jedem neuen Hinweis an. Starke Hinweise verschieben sie stark, schwache wenig – und man bleibt nie zu 100 % sicher.
    difficulty: 3

srs:
  cards_from: [haeufigkeiten, wahrscheinlich]
