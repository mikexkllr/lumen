id: stats.bayes.lab
type: concept
title: Bayes-Labor
summary: Spamfilter zum Anfassen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Deine Spam-Grenze
    body: Ab wann ist eine Mail Spam? Zieh den Punkt auf deine Grenze. Liegt sie zu tief, landen echte Mails im Müll, liegt sie zu hoch, rutscht Spam durch. Jeder Filter braucht so eine **Schwelle**.
    visual:
      widget: numberline
      interactive: true
      params:
        min: 0
        max: 1
        ticks: 10
        labels: decimals
        initial: 0.5
        markers:
          - value: 0
            label: sicher echt
          - value: 1
            label: sicher Spam

  - kind: problem
    id: haeufigkeiten
    widget: chart
    body: Von 100 Mails sind 50 Spam. »Gewinn« steht in 40 % der Spam-Mails, aber nur in 2 % der normalen.
    prompt: Stell ein, wie viele Spam- und wie viele normale Mails das Wort enthalten.
    params:
      labels: [Spam, normal]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 25
    answer: { values: [20, 1] }
    hints:
      - 40 % von 50 und 2 % von 50.
    explanation: 20 Spam-Mails, aber nur eine normale.

  - kind: problem
    id: wahrscheinlich
    widget: numberline
    prompt: Eine Mail enthält »Gewinn«. Markiere ungefähr, wie wahrscheinlich sie Spam ist.
    params: { min: 0, max: 1, ticks: 20, labels: decimals }
    answer: { value: 0.95 }
    hints:
      - 20 von 21 Mails mit dem Wort.
    explanation: "20 : 21 ≈ 0,95 – ein starkes Signal."

  - kind: problem
    id: mengen
    widget: venn
    prompt: Färbe alle Mails, die das Wort »Gewinn« enthalten.
    params: { sets: [Spam, Gewinn] }
    answer: { regions: [B, AB] }
    hints:
      - Den ganzen Kreis »Gewinn«.
    explanation: Bayes fragt – wie viel von diesem Kreis liegt im Spam?

  - kind: problem
    id: hinweise
    widget: buckets
    prompt: Stärkt oder schwächt der Hinweis die Vermutung »Es hat geregnet«?
    params:
      buckets: [{ label: stärkt }, { label: schwächt }]
      items:
        - { label: Die Straße ist nass, bucket: stärkt }
        - { label: Viele Schirme sind offen, bucket: stärkt }
        - { label: Der Gehweg ist staubtrocken, bucket: schwächt }
        - { label: Alle tragen Sonnenbrillen, bucket: schwächt }
    hints:
      - Ist der Hinweis bei Regen häufiger oder seltener?
    explanation: Jeder Hinweis verschiebt die Wahrscheinlichkeit – in die eine oder andere Richtung.

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Im Labor-Diagramm enthalten 20 Spam- und 1 normale Mail das Wort. Wie wahrscheinlich ist eine Mail mit diesem Wort Spam? In Prozent, auf eine Stelle.
    answer:
      value: 95.2
      tolerance: 0.1
    hints:
      - "Mails mit dem Wort: 20 + 1 = 21."
      - "Rechne 20 : 21."
    explanation: "20/21 ≈ 95,2 %. Natürliche Häufigkeiten: einfach die Fälle mit dem Hinweis zählen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was bedeutet es, »bayesianisch« zu denken?"
    params:
      keywords:
        - - vorwissen
          - basisrate
          - vorher
          - prior
          - base rate
          - before
        - - hinweis
          - daten
          - beweis
          - evidence
          - data
        - - anpass
          - aktualisier
          - verschieb
          - update
          - adjust
          - shift
        - - wahrscheinlich
          - probab
          - likely
      min: 3
      sample: Man startet mit einer Wahrscheinlichkeit aus dem Vorwissen und passt sie mit jedem neuen Hinweis an. Starke Hinweise verschieben sie stark, schwache wenig – und man bleibt nie zu 100 % sicher.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Du weißt gar nichts über eine Münze und willst ihre Kopf-Chance p schätzen. Welcher Prior ist ein vernünftiger Start?
    params:
      options:
        - label: Alle Werte von p zwischen 0 und 1 gleich wahrscheinlich
          correct: true
        - label: Sicher p = 0,5
          feedback: Ein Prior von 100 % lässt sich durch keine Daten mehr ändern.
        - label: Gar keiner
          feedback: Bayes braucht immer einen Prior – man muss ihn nur offenlegen.
    hints:
      - Welcher Prior lässt alle Möglichkeiten offen?
      - Aus ihm folgt Laplaces Folgeregel.
    explanation: Der flache Prior schließt nichts aus. Nach ein paar Würfen dominieren die Daten. Darum ist die Wahl bei vielen Daten fast egal – bei wenigen nicht.
    difficulty: 3

srs:
  cards_from: [haeufigkeiten, wahrscheinlich]
