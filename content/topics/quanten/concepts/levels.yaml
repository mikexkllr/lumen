id: sci.quantum.levels
type: concept
title: Energiestufen im Atom
summary: Warum Neon rot leuchtet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Elektronen im Atom dürfen nur bestimmte **Energiestufen** besetzen – wie Sprossen einer Leiter. Springt ein Elektron eine Stufe herunter, sendet es ein Photon mit genau dieser Energiedifferenz aus.

  - kind: problem
    id: sprung
    widget: numeric
    prompt: Ein Elektron springt von einer Stufe mit {{a}} eV auf eine mit {{b}} eV. Wie viel Energie hat das Photon?
    params: { unit: eV }
    answer: { value: "{{a - b}}" }
    hints:
      - Die Differenz der beiden Stufen.
    explanation: "{{a}} − {{b}} = {{a - b}} eV."
    variants:
      params: { b: "int[1,4]", d: "int[1,3]" }
      derive: { a: "b + d" }
      defaults: { b: 2, d: 2 }

  - kind: problem
    id: farben
    widget: choice
    prompt: Warum leuchtet jede Gasröhre in ihrer eigenen Farbe?
    params:
      options:
        - { label: Jedes Element hat eigene Energiestufen., correct: true }
        - { label: Die Röhren sind gefärbt., feedback: "Das Glas ist klar – die Farbe kommt vom Gas." }
    hints:
      - Feste Stufen bedeuten feste Photonenenergien.
    explanation: Neon leuchtet rot, Natrium gelb – ein Fingerabdruck, mit dem man sogar Sterne untersucht.

  - kind: problem
    id: sterne
    widget: choice
    prompt: Wie weiß man, woraus ferne Sterne bestehen?
    params:
      options:
        - { label: Man zerlegt ihr Licht und sucht die Farblinien der Elemente., correct: true }
        - { label: Man fliegt hin und nimmt Proben., feedback: "Dafür sind sie viel zu weit weg." }
    hints:
      - Jedes Element hat einen Licht-Fingerabdruck.
    explanation: So wurde Helium zuerst in der Sonne entdeckt – noch bevor man es auf der Erde fand.

srs:
  cards_from: [sprung, farben]
