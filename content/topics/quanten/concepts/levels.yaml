id: sci.quantum.levels
type: concept
title: Energiestufen im Atom
summary: Warum Neon rot leuchtet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Feuerwerk leuchtet rot, grün oder blau – je nach Stoff. Warum hat jeder Stoff seine eigene Farbe?
    params:
      options:
        - label: Seine Elektronen können nur ganz bestimmte Energien abgeben
          correct: true
        - label: Es wird verschieden heiß
          feedback: Die Farbe hängt am Stoff, nicht an der Hitze.
        - label: Zufall
          feedback: Es ist jedes Mal dieselbe Farbe.
    hints:
      - Die Farbe ist wie ein Fingerabdruck.
    explanation: Jedes Element hat seine eigenen Stufen – und damit seine Farben.

  - kind: explain
    id: s1
    body: |
      Elektronen im Atom dürfen nur bestimmte **Energiestufen** besetzen – wie Sprossen einer Leiter. Springt ein Elektron eine Stufe herunter, sendet es ein Photon mit genau dieser Energiedifferenz aus.

  - kind: problem
    id: sprung
    widget: numeric
    prompt: Ein Elektron springt von einer Stufe mit {{a}} eV auf eine mit {{b}} eV. Wie viel Energie hat das Photon?
    params: { unit: eV }
    answer: { value: "{{a - b}}" }
    hints:
      - Die Differenz der beiden Stufen.
    explanation: "{{a}} − {{b}} = {{a - b}} eV."
    variants:
      params: { b: "int[1,4]", d: "int[1,3]" }
      derive: { a: "b + d" }
      defaults: { b: 2, d: 2 }

  - kind: problem
    id: farben
    widget: choice
    prompt: Warum leuchtet jede Gasröhre in ihrer eigenen Farbe?
    params:
      options:
        - { label: Jedes Element hat eigene Energiestufen., correct: true }
        - { label: Die Röhren sind gefärbt., feedback: "Das Glas ist klar – die Farbe kommt vom Gas." }
    hints:
      - Feste Stufen bedeuten feste Photonenenergien.
    explanation: Neon leuchtet rot, Natrium gelb – ein Fingerabdruck, mit dem man sogar Sterne untersucht.

  - kind: problem
    id: sterne
    widget: choice
    prompt: Wie weiß man, woraus ferne Sterne bestehen?
    params:
      options:
        - { label: Man zerlegt ihr Licht und sucht die Farblinien der Elemente., correct: true }
        - { label: Man fliegt hin und nimmt Proben., feedback: "Dafür sind sie viel zu weit weg." }
    hints:
      - Jedes Element hat einen Licht-Fingerabdruck.
    explanation: So wurde Helium zuerst in der Sonne entdeckt – noch bevor man es auf der Erde fand.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Elektronen dürfen nur bestimmte [[Energiestufen]] besetzen. Springt eines herunter, sendet es ein [[Photon]] aus.
      distractors:
        - Umlaufbahnen
        - Proton

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Im Wasserstoffatom liegt Stufe n bei $-\frac{13{,}6}{n^2}$ eV. Wie viel Energie hat das Photon beim Sprung von n = 3 auf n = 2? Auf eine Stelle.
    params:
      unit: eV
    answer:
      value: 1.9
      tolerance: 0.05
    hints:
      - −13,6/9 = −1,51 und −13,6/4 = −3,4.
    explanation: "3,4 − 1,51 ≈ 1,9 eV: das rote Leuchten des Wasserstoffs, die **H-alpha-Linie**."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Im Wasserstoff liegt Stufe n bei −13,6 eV : n². Wie viel Energie braucht ein Elektron auf Stufe {{n}}, um das Atom ganz zu verlassen – in eV?"
    params:
      unit: eV
    answer:
      value: "{{13.6 / (n * n)}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 13.6 / n) < 0.01
        misconception: not-squared
        text: "n steht im Quadrat: Teile durch {{n * n}}."
    hints:
      - Ganz frei heißt Energie 0.
      - "Der Abstand von −13,6 : {{n * n}} bis 0."
    explanation: "13,6 : {{n * n}} = {{13.6 / (n * n)}} eV. Je höher die Stufe, desto lockerer sitzt das Elektron."
    difficulty: 2
    variants:
      params:
        n: choice[2,3,4]
      defaults:
        n: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "Beim Sprung von n = 3 auf n = 2 entsteht ein Photon mit 1,89 eV. Welche Wellenlänge hat es? Nutze λ in nm = 1240 : E in eV."
    params:
      unit: nm
    answer:
      value: 656
      tolerance: 3
    hints:
      - "1240 : 1,89 = ?"
      - Das Ergebnis liegt im sichtbaren Bereich.
    explanation: 656 nm – das rote Licht des Wasserstoffs. Astronomen sehen es überall, wo Gaswolken leuchten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum stürzt das Elektron nicht in den Kern, obwohl es angezogen wird?
    params:
      options:
        - label: Es gibt eine tiefste Stufe – darunter ist kein Zustand erlaubt
          correct: true
        - label: Es kreist so schnell wie ein Planet
          feedback: Ein kreisendes geladenes Teilchen müsste strahlen und abstürzen.
        - label: Der Kern stößt es auf kurze Distanz ab
          feedback: Kern und Elektron ziehen sich immer an.
    hints:
      - Ein enger eingesperrtes Elektron hat nach der Unschärferelation mehr Bewegungsenergie.
    explanation: Der **Grundzustand** ist der Kompromiss aus Anziehung und Unschärfe. Er macht Atome stabil – und Materie fest.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Im **Bohrschen Atommodell** ist der Drehimpuls gequantelt: $m v r = n \\hbar$. Zusammen mit der elektrischen Anziehung folgen Radien $r_n = n^2 \\cdot 0{,}053$ nm und Energien $E_n = -13{,}6\\,\\text{eV} / n^2$."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Wie groß ist nach Bohr der Radius der Bahn n = 3 im Wasserstoff – in nm? Auf drei Stellen.
    params:
      unit: nm
    answer:
      value: 0.477
      tolerance: 0.005
    feedback:
      - when: abs(numval(state.input) - 0.159) < 0.005
        misconception: linear-n
        text: Der Radius wächst mit n², nicht mit n.
    hints:
      - r₃ = 3² · 0,053 nm.
      - 9 · 0,053 = ?
    explanation: 9 · 0,053 ≈ 0,477 nm. Das Modell stimmt für Wasserstoff erstaunlich gut. Die Quantenmechanik ersetzt die Bahnen später durch Wolken aus Wahrscheinlichkeit.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Ein Textmarker leuchtet unter UV-Licht hell gelbgrün – also in einer anderen Farbe als das UV. Wie geht das?
    params:
      options:
        - label: Er schluckt energiereiche UV-Photonen und gibt die Energie in kleineren Portionen wieder ab.
          correct: true
        - label: Er spiegelt das UV-Licht.
          feedback: Gespiegeltes Licht behält seine Farbe. Hier entsteht neues Licht.
        - label: Er macht aus UV energiereicheres Licht.
          feedback: Mehr Energie pro Photon kann nicht herauskommen als hineingeht.
    hints:
      - UV hebt Elektronen weit hinauf.
      - Zurück geht es über Zwischenstufen.
    explanation: "Das ist Fluoreszenz: Ein Teil der Energie geht als Wärme verloren, der Rest kommt als Photon mit längerer Wellenlänge heraus. Weiße LEDs nutzen dasselbe Prinzip."
    difficulty: 3

srs:
  cards_from: [sprung, farben]
