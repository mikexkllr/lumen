id: sci.quantum.uncertainty
type: concept
title: Uncertainty and superposition
summary: Limits of knowledge.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      According to the **uncertainty principle**, you cannot know a particle's position and momentum both with arbitrary precision. This is not due to poor instruments. It is a property of nature.

  - kind: problem
    id: ort
    widget: choice
    prompt: You measure an electron's position more and more precisely. What happens to its momentum?
    params:
      options:
        - { label: It becomes more and more uncertain., correct: true }
        - { label: It becomes more precise too., feedback: "The opposite. The sharper one is, the fuzzier the other." }
    hints:
      - It is a trade-off.
    explanation: Precision in position costs precision in momentum.

  - kind: problem
    id: ueberlagerung
    widget: choice
    prompt: A quantum particle is in a superposition of “left” and “right”. What do you find when you measure?
    params:
      options:
        - { label: Randomly either left or right, correct: true }
        - { label: Half a particle on each side, feedback: "You always find a whole particle, in exactly one place." }
    hints:
      - The measurement forces a decision.
    explanation: Before, both possibilities are superposed. The measurement picks one at random.

  - kind: problem
    id: katze
    widget: choice
    prompt: What does Schrödinger's cat, supposedly both alive and dead, stand for?
    params:
      options:
        - { label: "The question of where quantum rules turn into everyday rules", correct: true }
        - { label: A real animal experiment, feedback: "It is a thought experiment. No animal was involved." }
    hints:
      - Schrödinger wanted to sharpen a point.
    explanation: Large objects show no superposition. Exactly why is still being researched.

srs:
  cards_from: [ort, ueberlagerung]
