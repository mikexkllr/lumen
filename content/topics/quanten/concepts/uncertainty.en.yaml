id: sci.quantum.uncertainty
type: concept
title: Uncertainty and superposition
summary: Limits of knowledge.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Photo of a flying ball: a short exposure is sharp but shows no speed. A long one shows the trail but no exact place. Can one photo show both perfectly?"
    params:
      options:
        - label: No
          correct: true
        - label: Yes, with a better camera
          feedback: The camera is not the issue.
        - label: Yes, always
          feedback: Sharp and blurred exclude each other.
    hints:
      - Sharp or blurred?
    explanation: For tiny particles this is no measuring problem but nature.

  - kind: explain
    id: s1
    body: |
      According to the **uncertainty principle**, you cannot know a particle's position and momentum both with arbitrary precision. This is not due to poor instruments. It is a property of nature.

  - kind: problem
    id: ort
    widget: choice
    prompt: You measure an electron's position more and more precisely. What happens to its momentum?
    params:
      options:
        - { label: It becomes more and more uncertain., correct: true }
        - { label: It becomes more precise too., feedback: "The opposite. The sharper one is, the fuzzier the other." }
    hints:
      - It is a trade-off.
    explanation: Precision in position costs precision in momentum.

  - kind: problem
    id: ueberlagerung
    widget: choice
    prompt: A quantum particle is in a superposition of “left” and “right”. What do you find when you measure?
    params:
      options:
        - { label: Randomly either left or right, correct: true }
        - { label: Half a particle on each side, feedback: "You always find a whole particle, in exactly one place." }
    hints:
      - The measurement forces a decision.
    explanation: Before, both possibilities are superposed. The measurement picks one at random.

  - kind: problem
    id: katze
    widget: choice
    prompt: What does Schrödinger's cat, supposedly both alive and dead, stand for?
    params:
      options:
        - { label: "The question of where quantum rules turn into everyday rules", correct: true }
        - { label: A real animal experiment, feedback: "It is a thought experiment. No animal was involved." }
    hints:
      - Schrödinger wanted to sharpen a point.
    explanation: Large objects show no superposition. Exactly why is still being researched.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The position and [[momentum]] of a particle cannot both be known as [[exactly]] as you like.
      distractors:
        - colour
        - quickly

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Quantum world or everyday life?
    params:
      buckets:
        - id: b1
          label: Quantum world
        - id: b2
          label: Everyday life
      items:
        - label: Two states at once
          bucket: b1
        - label: A ball lies at exactly one place
          bucket: b2
        - label: Measuring changes the state
          bucket: b1
        - label: Position and speed both known
          bucket: b2
    hints:
      - Different rules hold at the smallest scale.
    explanation: For large things quantum effects are tiny. That is why we do not notice them.

  - kind: problem
    id: mix-c3
    widget: match
    prompt: Match term and meaning.
    params:
      pairs:
        - left: Uncertainty
          right: Never both exact
        - left: Superposition
          right: Several states at once
        - left: Measurement
          right: Fixes the state
        - left: Photon
          right: A portion of light
    hints:
      - Two terms are about knowledge, one about light.
    explanation: All quantum physics starts with these four terms.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Two entangled particles are separated far apart. You measure one. What holds for the other?
    params:
      options:
        - label: Its result is fixed at once – but no information can be sent this way
          correct: true
        - label: It stays completely independent
          feedback: The results match more strongly than any prior agreement could explain.
        - label: You can signal faster than light this way
          feedback: Each side sees only randomness. The link only shows when comparing.
    hints:
      - Each observer alone sees only random results.
    explanation: "**Entanglement** – Einstein called it “spooky action at a distance”. Experiments have confirmed it since 1982."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Uncertainty is due to imprecise instruments.
          right: false
          why: It is a property of nature.
        - text: The more exact the position, the less exact the momentum.
          right: true
        - text: A measurement fixes the state.
          right: true
        - text: "Superposition means: we just do not know the state."
          right: false
          why: "Experiments show: the state really is undetermined."
      left: "False"
      right: "True"
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: an atom is about 0.000 000 000 1 m across. How many zeros come before the 1 – counting the one before the point?"
    params:
      min: 1
      max: 30
    answer:
      value: 10
      tolerance: 1
    explanation: Ten. A ten-billionth of a metre – that is where quantum physics rules.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: The **uncertainty principle** reads $\Delta x \cdot \Delta p \geq \frac{\hbar}{2}$, with ħ ≈ 1.05 · 10⁻³⁴ Js. If the position uncertainty is halved, the momentum uncertainty must at least double.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: An electron is confined in an atom to Δx = 10⁻¹⁰ m. What is its minimum velocity uncertainty? Δv = ħ ÷ (2 · m · Δx), m = 9.1 · 10⁻³¹ kg. In km/s.
    params:
      unit: km/s
    answer:
      value: 580
      tolerance: 20
    feedback:
      - when: abs(numval(state.input) - 580000) < 20000
        misconception: unit-km
        text: That is m/s. Divide by 1000.
    hints:
      - 2 · 9.1 · 10⁻³¹ · 10⁻¹⁰ = 1.82 · 10⁻⁴⁰.
      - 1.05 · 10⁻³⁴ ÷ 1.82 · 10⁻⁴⁰ ≈ 5.8 · 10⁵ m/s.
    explanation: About 580 km/s. A confined electron cannot keep still. This »zero-point motion« stops it from falling into the nucleus.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In the **tunnel effect** a particle crosses a barrier its energy does not suffice for. Where is that vital?
    params:
      options:
        - label: In the Sun – only by tunnelling do protons get close enough to fuse
          correct: true
        - label: When driving through a road tunnel
          feedback: The name is only a picture.
        - label: Nowhere – it is a thought experiment
          feedback: Flash memory and scanning tunnelling microscopes use it daily.
    hints:
      - It is actually too cold for fusion in the Sun’s core.
    explanation: Without the tunnel effect the Sun would not shine. The wave function reaches a little way into the barrier.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "A dust grain (10⁻¹⁵ kg) is located to within 1 µm. What is its minimum velocity uncertainty? Give the exponent: about 5 · 10 to the … m/s."
    answer:
      value: -14
    hints:
      - Δv = 1.05 · 10⁻³⁴ ÷ (2 · 10⁻¹⁵ · 10⁻⁶).
      - The denominator is 2 · 10⁻²¹.
    explanation: Δv ≈ 5 · 10⁻¹⁴ m/s – not even a hair's breadth in a thousand years. For everyday objects the uncertainty is completely invisible.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Spectral lines are never infinitely sharp but have a natural width. Where does it come from?
    params:
      options:
        - label: Excited states live only briefly – and by ΔE · Δt ≥ ħ/2 their energy is then blurred.
          correct: true
        - label: Spectrometers are imprecise.
          feedback: Even perfect instruments measure this width. It is nature, not technology.
        - label: The atoms differ in size.
          feedback: All atoms of an element are the same. It is the short lifetime.
    hints:
      - There is also an uncertainty between energy and time.
      - Short lifetime, large energy spread.
    explanation: A state that lives only nanoseconds has no exactly defined energy. The shorter the lifetime, the broader the line.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why uncertainty is not due to poor measuring devices.
    params:
      keywords:
        - - welle
          - wave
          - wellenpaket
          - packet
        - - ort
          - position
          - impuls
          - momentum
        - - eigenschaft
          - property
          - natur
          - nature
          - grundsätzlich
          - fundamental
          - prinzip
          - principle
      sample: A particle is also a wave. A wave packet sitting in one place is made of many wavelengths – so of many momenta. A precise position and a precise momentum exclude each other. That is a property of nature.
    difficulty: 3

srs:
  cards_from: [ort, ueberlagerung]
