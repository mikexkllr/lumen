id: sci.quantum.tech
type: concept
title: Quanten in der Technik
summary: Laser, LED und Qubits.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Bit gegen Qubit
    body: "Ein normales Bit ist entweder 0 oder 1. Schalte die vier Bits um: Jedes Muster steht für genau eine Zahl. Ein **Qubit** dagegen kann 0 und 1 zugleich sein."
    visual:
      widget: bits
      interactive: true
      params:
        bits: 4
        initial: "0101"

  - kind: problem
    id: technik
    widget: match
    prompt: Welcher Quanteneffekt steckt dahinter?
    params:
      pairs:
        - { left: LED, right: Elektronensprünge }
        - { left: Solarzelle, right: Photoeffekt }
        - { left: Laser, right: Photonen im Gleichtakt }
    hints:
      - Die Solarzelle kennst du vom Photoeffekt.
    explanation: Fast jede moderne Elektronik beruht auf Quantenphysik.

  - kind: explain
    id: s2
    body: |
      Ein **Qubit** kann in einer Überlagerung aus 0 und 1 sein. Mehrere Qubits zusammen beschreiben alle Kombinationen gleichzeitig – mit jedem Qubit verdoppelt sich die Zahl.

  - kind: problem
    id: qubits
    widget: numeric
    prompt: Wie viele Kombinationen aus 0 und 1 beschreiben {{n}} Qubits zugleich?
    params: { unit: Kombinationen }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear
        text: Jedes Qubit verdoppelt – das wächst exponentiell, nicht linear.
    hints:
      - "Jedes Qubit verdoppelt: 2, 4, 8 …"
    explanation: "$2^{ {{n}} } = {{2 ** n}}$. Bei 300 Qubits wären es mehr als Atome im Universum."
    variants:
      params: { n: "int[3,10]" }
      defaults: { n: 5 }

  - kind: problem
    id: grenzen
    widget: choice
    prompt: Werden Quantencomputer bald normale Computer ersetzen?
    params:
      options:
        - { label: Nein – sie sind nur bei speziellen Aufgaben schneller., correct: true }
        - { label: Ja – sie sind bei allem schneller., feedback: "Für E-Mails oder Spiele bringen sie nichts – sie glänzen bei Spezialproblemen." }
    hints:
      - Wofür braucht man Überlagerung überhaupt?
    explanation: Simulation von Molekülen oder bestimmte Kryptografie – dafür lohnen sie sich.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Mit jedem Qubit verdoppelt sich die Zahl der Zustände. Ab wie vielen Qubits sind es mehr als eine Billion (10¹²)?
    answer:
      value: 40
    hints:
      - 2¹⁰ ≈ 10³.
    explanation: 2⁴⁰ ≈ 1,1 · 10¹². Schon 300 Qubits beschreiben mehr Zustände, als es Atome im Universum gibt.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Eine LED leuchtet mit der Energie ihrer Bandlücke. Bei 2,7 eV – welche Wellenlänge hat ihr Licht? Nutze λ in nm = 1240 : E. Auf ganze nm."
    params:
      unit: nm
    answer:
      value: 459
      tolerance: 3
    hints:
      - "1240 : 2,7 = ?"
      - Das Ergebnis liegt im blauen Bereich.
    explanation: Rund 459 nm – blau. Blaue LEDs brauchten eine große Bandlücke und gelangen erst in den 1990ern. Das war 2014 einen Nobelpreis wert.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Was macht das Licht eines Lasers so besonders?
    params:
      options:
        - label: Ein Photon löst den Sprung weiterer Elektronen aus – alle Photonen haben dieselbe Farbe, Richtung und denselben Takt.
          correct: true
        - label: Es ist einfach sehr helles Licht.
          feedback: Eine Lampe kann heller sein. Besonders ist der Gleichtakt.
        - label: Laserlicht besteht nicht aus Photonen.
          feedback: Auch Laserlicht kommt in Photonen – nur besonders geordnet.
    hints:
      - »Laser« steht für Lichtverstärkung durch angeregte Aussendung.
      - Ein Photon kann ein angeregtes Atom anstoßen, ein Zwillingsphoton auszusenden.
    explanation: Bei der stimulierten Emission entsteht ein exakter Zwilling des auslösenden Photons. Spiegel lassen diesen Vorgang lawinenartig wachsen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist es so schwer, große Quantencomputer zu bauen?
    params:
      options:
        - label: Jede kleinste Störung zerstört die Überlagerung – man nennt das Dekohärenz
          correct: true
        - label: Qubits sind zu teuer
          feedback: Das Problem ist physikalisch, nicht finanziell.
        - label: Es fehlt die passende Software
          feedback: Algorithmen gibt es seit 1994 – es fehlt stabile Hardware.
    hints:
      - Was passierte am Doppelspalt, sobald man hinsah?
    explanation: Qubits müssen fast perfekt isoliert sein und werden auf Tausendstel Grad über dem Nullpunkt gekühlt. Fehlerkorrektur kostet Tausende Qubits pro nutzbarem.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Ein Quantencomputer durchsucht eine unsortierte Liste mit N Einträgen in etwa √N Schritten. Ein normaler Computer braucht im Mittel N : 2. Wie viele Schritte braucht der Quantencomputer für N = 10⁶?"
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 500000
        misconception: classical
        text: Das ist der normale Computer. Der Quantenrechner braucht nur √N.
    hints:
      - √(10⁶) = 10³.
      - Die Wurzel halbiert den Exponenten.
    explanation: 1000 statt 500 000 Schritte. Das ist ein großer, aber kein exponentieller Vorteil. Für viele Aufgaben bringen Quantencomputer gar keinen.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Warum gilt Quantenkryptografie als abhörsicher?
    params:
      options:
        - label: Jede Messung stört den Quantenzustand – ein Lauscher hinterlässt Fehler, die man bemerkt.
          correct: true
        - label: Die Photonen sind zu schnell zum Abfangen.
          feedback: Abfangen geht – aber nicht unbemerkt.
        - label: Die Daten werden in Qubits versteckt, die niemand lesen kann.
          feedback: Der Empfänger liest sie ja. Der Trick ist, dass Lesen Spuren hinterlässt.
    hints:
      - Kann man einen unbekannten Quantenzustand kopieren?
      - Messen verändert, was man misst.
    explanation: Unbekannte Quantenzustände lassen sich nicht kopieren, und Messen verändert sie. Vergleichen Sender und Empfänger einen Teil ihrer Daten, fällt jeder Lauscher auf.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein Qubit von einem normalen Bit unterscheidet.
    params:
      keywords:
        - - überlager
          - superpos
          - beides
          - both
          - zugleich
          - same time
        - - mess
          - measur
          - zufall
          - random
        - - kombination
          - combination
          - verdoppel
          - doubl
          - viele
          - many
      sample: Ein Bit ist 0 oder 1. Ein Qubit kann in einer Überlagerung aus 0 und 1 sein. Erst beim Messen kommt zufällig 0 oder 1 heraus. Viele Qubits zusammen beschreiben alle Kombinationen gleichzeitig.
    difficulty: 3

srs:
  cards_from: [qubits, grenzen]
