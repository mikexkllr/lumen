id: sci.quantum.levels
type: concept
title: Energy levels in the atom
summary: Why neon glows red.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Fireworks glow red, green or blue – depending on the substance. Why does each substance have its own colour?
    params:
      options:
        - label: Its electrons can only give off quite specific energies
          correct: true
        - label: It gets differently hot
          feedback: The colour depends on the substance, not the heat.
        - label: Chance
          feedback: It is the same colour every time.
    hints:
      - The colour is like a fingerprint.
    explanation: Each element has its own levels – and thus its colours.

  - kind: explain
    id: s1
    body: |
      Electrons in an atom may only occupy certain **energy levels**, like rungs of a ladder. When an electron drops one level, it emits a photon with exactly that energy difference.

  - kind: problem
    id: sprung
    widget: numeric
    prompt: An electron jumps from a level at {{a}} eV to one at {{b}} eV. How much energy does the photon have?
    params: { unit: eV }
    answer: { value: "{{a - b}}" }
    hints:
      - The difference between the two levels.
    explanation: "{{a}} − {{b}} = {{a - b}} eV."
    variants:
      params: { b: "int[1,4]", d: "int[1,3]" }
      derive: { a: "b + d" }
      defaults: { b: 2, d: 2 }

  - kind: problem
    id: farben
    widget: choice
    prompt: Why does each gas tube glow in its own color?
    params:
      options:
        - { label: Each element has its own energy levels., correct: true }
        - { label: The tubes are tinted., feedback: "The glass is clear. The color comes from the gas." }
    hints:
      - Fixed levels mean fixed photon energies.
    explanation: Neon glows red and sodium yellow. It is a fingerprint, used even to study stars.

  - kind: problem
    id: sterne
    widget: choice
    prompt: How do we know what distant stars are made of?
    params:
      options:
        - { label: "We split their light and look for the color lines of elements.", correct: true }
        - { label: We fly there and take samples., feedback: "They are far too distant for that." }
    hints:
      - Each element has a light fingerprint.
    explanation: This is how helium was first discovered in the Sun, before it was found on Earth.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Electrons may only occupy certain [[energy levels]]. If one jumps down, it emits a [[photon]].
      distractors:
        - orbits
        - proton

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In the hydrogen atom level n lies at $-\frac{13.6}{n^2}$ eV. How much energy does the photon have for the jump from n = 3 to n = 2? To one place.
    params:
      unit: eV
    answer:
      value: 1.9
      tolerance: 0.05
    hints:
      - −13.6/9 = −1.51 and −13.6/4 = −3.4.
    explanation: "3.4 − 1.51 ≈ 1.9 eV: the red glow of hydrogen, the **H-alpha line**."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does the electron not crash into the nucleus although it is attracted?
    params:
      options:
        - label: There is a lowest level – no state is allowed below it
          correct: true
        - label: It orbits as fast as a planet
          feedback: An orbiting charged particle would have to radiate and crash.
        - label: The nucleus repels it at short range
          feedback: Nucleus and electron always attract.
    hints:
      - By the uncertainty principle a more tightly confined electron has more kinetic energy.
    explanation: The **ground state** is the compromise between attraction and uncertainty. It makes atoms stable – and matter solid.
    difficulty: 3

srs:
  cards_from: [sprung, farben]
