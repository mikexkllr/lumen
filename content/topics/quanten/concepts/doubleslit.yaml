id: sci.quantum.doubleslit
type: concept
title: Der Doppelspalt
summary: Teilchen, die sich wie Wellen verhalten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: erwartung
    widget: choice
    prompt: Man schießt einzelne Elektronen auf eine Wand mit zwei Spalten. Was erwartet man für kleine Kugeln dahinter?
    params:
      options:
        - { label: Zwei Streifen, correct: true }
        - { label: Viele Streifen, feedback: "Für Kugeln wären zwei Streifen naheliegend – aber warte ab." }
    hints:
      - Jede Kugel fliegt durch einen der Spalte.
    explanation: So würde man es erwarten. Die Natur macht es anders.

  - kind: explain
    id: s2
    body: |
      Tatsächlich entsteht ein **Muster aus vielen Streifen** – wie bei Wasserwellen, die sich überlagern. Jedes einzelne Elektron verhält sich, als ginge es als Welle durch **beide** Spalte.

  - kind: problem
    id: beobachten
    widget: choice
    prompt: Was passiert, wenn man misst, durch welchen Spalt jedes Elektron fliegt?
    params:
      options:
        - { label: Das Streifenmuster verschwindet., correct: true }
        - { label: Nichts ändert sich., feedback: "Genau hier wird es seltsam – die Messung verändert das Ergebnis." }
    hints:
      - Messen heißt in der Quantenwelt eingreifen.
    explanation: Wer den Weg kennt, zerstört die Überlagerung – es bleiben zwei Streifen.

  - kind: problem
    id: was
    widget: choice
    prompt: Was zeigt dieser Versuch?
    params:
      options:
        - { label: Teilchen haben auch Welleneigenschaften., correct: true }
        - { label: Elektronen sind kaputt., feedback: "Sie verhalten sich ganz normal – für Quantenobjekte." }
    hints:
      - Welche Eigenschaft erzeugt Streifenmuster?
    explanation: Quantenobjekte sind weder reine Teilchen noch reine Wellen – sie sind beides.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Auch einzelne Elektronen erzeugen nach und nach ein Streifenmuster.
          right: true
        - text: Das Muster entsteht, weil Elektronen miteinander zusammenstoßen.
          right: false
          why: Es entsteht auch, wenn immer nur eines unterwegs ist.
        - text: Misst man den Weg, verschwindet das Muster.
          right: true

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne das Doppelspalt-Experiment.
    params:
      items:
        - label: Ein Elektron fliegt auf zwei Spalte zu
        - label: Es trifft als einzelner Punkt auf den Schirm
        - label: Viele Elektronen folgen nacheinander
        - label: Aus den Punkten wächst ein Streifenmuster
    hints:
      - Erst ein Teilchen, dann viele.
    explanation: Jeder Treffer ist ein Punkt – aber alle zusammen zeichnen ein Wellenmuster.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was beschreibt die **Wellenfunktion** eines Elektrons?
    params:
      options:
        - label: Die Wahrscheinlichkeit, es an einem Ort zu finden
          correct: true
        - label: Wie das Elektron als verschmierte Wolke wirklich aussieht
          feedback: Gemessen findet man es immer als Punkt.
        - label: Die Bahn, auf der es fliegt
          feedback: Eine Bahn gibt es zwischen den Messungen nicht.
    hints:
      - Wo viele Elektronen landen, ist das Muster hell.
    explanation: "Die **Bornsche Regel**: Das Quadrat der Wellenfunktion ist die Wahrscheinlichkeitsdichte."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Die de-Broglie-Wellenlänge ist λ = h : (m · v). Ein Elektron (9,1 · 10⁻³¹ kg) fliegt mit 10⁶ m/s, h = 6,6 · 10⁻³⁴ Js. Wie groß ist λ – in nm? Auf zwei Stellen."
    params:
      unit: nm
    answer:
      value: 0.73
      tolerance: 0.02
    hints:
      - m · v = 9,1 · 10⁻²⁵ kg·m/s.
      - "6,6 · 10⁻³⁴ : 9,1 · 10⁻²⁵ ≈ 7,3 · 10⁻¹⁰ m."
    explanation: Etwa 0,73 nm – so groß wie Atomabstände im Kristall. Darum zeigen Elektronen an Kristallen Beugung, und Elektronenmikroskope sehen viel feiner als Lichtmikroskope.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "Ein Tennisball (60 g) fliegt mit 50 m/s. Seine de-Broglie-Wellenlänge ist 6,6 · 10⁻³⁴ : 3 Meter. Gib den Exponenten an: etwa 2 · 10 hoch … m."
    answer:
      value: -34
    feedback:
      - when: numval(state.input) == 34
        misconception: sign
        text: Die Zahl ist winzig – der Exponent ist negativ.
    hints:
      - m · v = 0,06 · 50 = 3 kg·m/s.
      - "6,6 : 3 = 2,2, die Zehnerpotenz bleibt."
    explanation: 2,2 · 10⁻³⁴ m – Billiarden Mal kleiner als ein Proton. Darum sieht man bei Tennisbällen nie Interferenz.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die de-Broglie-Wellenlänge ist $\lambda = \frac{h}{m v}$. Ein Elektron wird doppelt so schnell. Auf welchen Bruchteil sinkt seine Wellenlänge?
    answer:
      value: 1/2
    hints:
      - v steht im Nenner.
    explanation: Die Hälfte. Schnelle Elektronen haben winzige Wellenlängen – darum sehen Elektronenmikroskope Atome.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Licht mit 500 nm fällt auf zwei Spalte im Abstand 0,1 mm. Der Schirm steht 2 m entfernt. Die hellen Streifen haben den Abstand Δx = λ · L : d. Wie groß ist Δx – in mm?"
    params:
      unit: mm
    answer:
      value: 10
    feedback:
      - when: abs(numval(state.input) - 0.01) < 0.001
        misconception: unit-mm
        text: Das sind Meter. Gefragt sind Millimeter.
    hints:
      - "5 · 10⁻⁷ m · 2 m : 10⁻⁴ m."
      - Ergebnis in Metern mal 1000.
    explanation: Δx = 0,01 m = 10 mm. Engere Spalte oder längere Wellen spreizen das Muster. Thomas Young bewies so um 1801 die Wellennatur des Lichts.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Selbst Fußball-Moleküle aus 60 Kohlenstoffatomen zeigen am Doppelspalt Interferenz. Warum sieht man das bei Fußbällen nie?
    params:
      options:
        - label: Ihre Wellenlänge ist winzig, und ständige Stöße mit der Umgebung zerstören die Überlagerung.
          correct: true
        - label: Für große Dinge gelten andere Naturgesetze.
          feedback: Die Gesetze sind dieselben. Die Effekte werden nur unmessbar klein.
        - label: Fußbälle sind zu langsam.
          feedback: Langsamer heißt sogar längere Wellen. Das Problem ist die riesige Masse.
    hints:
      - "Denk an λ = h : (m · v) für große m."
      - Luftmoleküle und Licht »messen« einen Fußball ständig.
    explanation: "Zwei Gründe: winzige Wellenlänge und **Dekohärenz** – jede Wechselwirkung mit der Umgebung wirkt wie eine Messung. Forscher kühlen und isolieren darum immer größere Objekte, um Quanteneffekte zu sehen."
    difficulty: 3

srs:
  cards_from: [beobachten, was]
