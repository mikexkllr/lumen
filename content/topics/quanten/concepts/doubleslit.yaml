id: sci.quantum.doubleslit
type: concept
title: Der Doppelspalt
summary: Teilchen, die sich wie Wellen verhalten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: erwartung
    widget: choice
    prompt: Man schießt einzelne Elektronen auf eine Wand mit zwei Spalten. Was erwartet man für kleine Kugeln dahinter?
    params:
      options:
        - { label: Zwei Streifen, correct: true }
        - { label: Viele Streifen, feedback: "Für Kugeln wären zwei Streifen naheliegend – aber warte ab." }
    hints:
      - Jede Kugel fliegt durch einen der Spalte.
    explanation: So würde man es erwarten. Die Natur macht es anders.

  - kind: explain
    id: s2
    body: |
      Tatsächlich entsteht ein **Muster aus vielen Streifen** – wie bei Wasserwellen, die sich überlagern. Jedes einzelne Elektron verhält sich, als ginge es als Welle durch **beide** Spalte.

  - kind: problem
    id: beobachten
    widget: choice
    prompt: Was passiert, wenn man misst, durch welchen Spalt jedes Elektron fliegt?
    params:
      options:
        - { label: Das Streifenmuster verschwindet., correct: true }
        - { label: Nichts ändert sich., feedback: "Genau hier wird es seltsam – die Messung verändert das Ergebnis." }
    hints:
      - Messen heißt in der Quantenwelt eingreifen.
    explanation: Wer den Weg kennt, zerstört die Überlagerung – es bleiben zwei Streifen.

  - kind: problem
    id: was
    widget: choice
    prompt: Was zeigt dieser Versuch?
    params:
      options:
        - { label: Teilchen haben auch Welleneigenschaften., correct: true }
        - { label: Elektronen sind kaputt., feedback: "Sie verhalten sich ganz normal – für Quantenobjekte." }
    hints:
      - Welche Eigenschaft erzeugt Streifenmuster?
    explanation: Quantenobjekte sind weder reine Teilchen noch reine Wellen – sie sind beides.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Auch einzelne Elektronen erzeugen nach und nach ein Streifenmuster.
          right: true
        - text: Das Muster entsteht, weil Elektronen miteinander zusammenstoßen.
          right: false
          why: Es entsteht auch, wenn immer nur eines unterwegs ist.
        - text: Misst man den Weg, verschwindet das Muster.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was beschreibt die **Wellenfunktion** eines Elektrons?
    params:
      options:
        - label: Die Wahrscheinlichkeit, es an einem Ort zu finden
          correct: true
        - label: Wie das Elektron als verschmierte Wolke wirklich aussieht
          feedback: Gemessen findet man es immer als Punkt.
        - label: Die Bahn, auf der es fliegt
          feedback: Eine Bahn gibt es zwischen den Messungen nicht.
    hints:
      - Wo viele Elektronen landen, ist das Muster hell.
    explanation: "Die **Bornsche Regel**: Das Quadrat der Wellenfunktion ist die Wahrscheinlichkeitsdichte."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die de-Broglie-Wellenlänge ist $\lambda = \frac{h}{m v}$. Ein Elektron wird doppelt so schnell. Auf welchen Bruchteil sinkt seine Wellenlänge?
    answer:
      value: 1/2
    hints:
      - v steht im Nenner.
    explanation: Die Hälfte. Schnelle Elektronen haben winzige Wellenlängen – darum sehen Elektronenmikroskope Atome.
    difficulty: 3

srs:
  cards_from: [beobachten, was]
