id: sci.quantum.doubleslit
type: concept
title: The double slit
summary: Particles that behave like waves.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: erwartung
    widget: choice
    prompt: You fire single electrons at a wall with two slits. What would you expect for small balls behind it?
    params:
      options:
        - { label: Two stripes, correct: true }
        - { label: Many stripes, feedback: "For balls, two stripes are the obvious answer. But wait." }
    hints:
      - Each ball flies through one of the slits.
    explanation: That is what you would expect. Nature does it differently.

  - kind: explain
    id: s2
    body: |
      In fact, a **pattern of many stripes** appears, like water waves overlapping. Each single electron behaves as if it went through **both** slits as a wave.

  - kind: problem
    id: beobachten
    widget: choice
    prompt: What happens if you measure which slit each electron goes through?
    params:
      options:
        - { label: The stripe pattern disappears., correct: true }
        - { label: Nothing changes., feedback: "This is exactly where it gets strange. The measurement changes the result." }
    hints:
      - In the quantum world, measuring means interfering.
    explanation: If you know the path, you destroy the superposition. Two stripes remain.

  - kind: problem
    id: was
    widget: choice
    prompt: What does this experiment show?
    params:
      options:
        - { label: Particles also have wave properties., correct: true }
        - { label: Electrons are broken., feedback: "They behave quite normally, for quantum objects." }
    hints:
      - Which property creates stripe patterns?
    explanation: Quantum objects are neither pure particles nor pure waves. They are both.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Even single electrons gradually build up a stripe pattern.
          right: true
        - text: The pattern arises because electrons collide with each other.
          right: false
          why: It also arises when only one is ever under way.
        - text: If you measure the path, the pattern vanishes.
          right: true

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order the double-slit experiment.
    params:
      items:
        - label: An electron flies towards two slits
        - label: It hits the screen as a single dot
        - label: Many electrons follow one by one
        - label: A stripe pattern grows from the dots
    hints:
      - First one particle, then many.
    explanation: Each hit is a dot – but together they draw a wave pattern.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What does the **wave function** of an electron describe?
    params:
      options:
        - label: The probability of finding it at a place
          correct: true
        - label: What the electron really looks like as a smeared cloud
          feedback: When measured it is always found as a point.
        - label: The path along which it flies
          feedback: There is no path between measurements.
    hints:
      - Where many electrons land the pattern is bright.
    explanation: "The **Born rule**: the square of the wave function is the probability density."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The de Broglie wavelength is $\lambda = \frac{h}{m v}$. An electron becomes twice as fast. To what fraction does its wavelength drop?
    answer:
      value: 1/2
    hints:
      - v is in the denominator.
    explanation: Half. Fast electrons have tiny wavelengths – that is why electron microscopes see atoms.
    difficulty: 3

srs:
  cards_from: [beobachten, was]
