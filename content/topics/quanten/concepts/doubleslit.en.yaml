id: sci.quantum.doubleslit
type: concept
title: The double slit
summary: Particles that behave like waves.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Crest meets trough
    body: "When two waves meet, they add up. Drag the slider to shift the second wave: sometimes they pile up, sometimes they cancel out. This **superposition** is the key to the double slit."
    visual:
      widget: slider
      interactive: true
      params:
        expr: sin(2*x) + sin(2*x + p*pi)
        x:
          - 0
          - 6
        y:
          - -2.5
          - 2.5
        sliders:
          - id: p
            label: Shift (× π)
            min: 0
            max: 2
            step: 0.25
            initial: 0

  - kind: problem
    id: erwartung
    widget: choice
    prompt: You fire single electrons at a wall with two slits. What would you expect for small balls behind it?
    params:
      options:
        - { label: Two stripes, correct: true }
        - { label: Many stripes, feedback: "For balls, two stripes are the obvious answer. But wait." }
    hints:
      - Each ball flies through one of the slits.
    explanation: That is what you would expect. Nature does it differently.

  - kind: explain
    id: s2
    body: |
      In fact, a **pattern of many stripes** appears, like water waves overlapping. Each single electron behaves as if it went through **both** slits as a wave.

  - kind: problem
    id: beobachten
    widget: choice
    prompt: What happens if you measure which slit each electron goes through?
    params:
      options:
        - { label: The stripe pattern disappears., correct: true }
        - { label: Nothing changes., feedback: "This is exactly where it gets strange. The measurement changes the result." }
    hints:
      - In the quantum world, measuring means interfering.
    explanation: If you know the path, you destroy the superposition. Two stripes remain.

  - kind: problem
    id: was
    widget: choice
    prompt: What does this experiment show?
    params:
      options:
        - { label: Particles also have wave properties., correct: true }
        - { label: Electrons are broken., feedback: "They behave quite normally, for quantum objects." }
    hints:
      - Which property creates stripe patterns?
    explanation: Quantum objects are neither pure particles nor pure waves. They are both.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Even single electrons gradually build up a stripe pattern.
          right: true
        - text: The pattern arises because electrons collide with each other.
          right: false
          why: It also arises when only one is ever under way.
        - text: If you measure the path, the pattern vanishes.
          right: true

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order the double-slit experiment.
    params:
      items:
        - label: An electron flies towards two slits
        - label: It hits the screen as a single dot
        - label: Many electrons follow one by one
        - label: A stripe pattern grows from the dots
    hints:
      - First one particle, then many.
    explanation: Each hit is a dot – but together they draw a wave pattern.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Shift the second wave so that the two cancel each other out everywhere.
    params:
      expr: sin(2*x) + sin(2*x + p*pi)
      x:
        - 0
        - 6
      y:
        - -2.5
        - 2.5
      sliders:
        - id: p
          label: Shift (× π)
          min: 0
          max: 2
          step: 0.25
          initial: 0.5
    answer:
      values:
        p: 1
    hints:
      - Cancelling means a crest meets a trough exactly.
      - A trough lies half a wavelength behind the crest – that is a shift of π.
    explanation: With a shift of π the sum is zero everywhere. That is exactly how the dark stripes at the double slit arise.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What does the **wave function** of an electron describe?
    params:
      options:
        - label: The probability of finding it at a place
          correct: true
        - label: What the electron really looks like as a smeared cloud
          feedback: When measured it is always found as a point.
        - label: The path along which it flies
          feedback: There is no path between measurements.
    hints:
      - Where many electrons land the pattern is bright.
    explanation: "The **Born rule**: the square of the wave function is the probability density."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: The de Broglie wavelength is λ = h ÷ (m · v). An electron (9.1 · 10⁻³¹ kg) flies at 10⁶ m/s, h = 6.6 · 10⁻³⁴ Js. What is λ – in nm? To two decimals.
    params:
      unit: nm
    answer:
      value: 0.73
      tolerance: 0.02
    hints:
      - m · v = 9.1 · 10⁻²⁵ kg·m/s.
      - 6.6 · 10⁻³⁴ ÷ 9.1 · 10⁻²⁵ ≈ 7.3 · 10⁻¹⁰ m.
    explanation: About 0.73 nm – the size of atomic spacings in a crystal. That is why electrons diffract off crystals, and electron microscopes see far finer than light microscopes.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "A tennis ball (60 g) flies at 50 m/s. Its de Broglie wavelength is 6.6 · 10⁻³⁴ ÷ 3 metres. Give the exponent: about 2 · 10 to the … m."
    answer:
      value: -34
    feedback:
      - when: numval(state.input) == 34
        misconception: sign
        text: The number is tiny – the exponent is negative.
    hints:
      - m · v = 0.06 · 50 = 3 kg·m/s.
      - 6.6 ÷ 3 = 2.2, the power of ten stays.
    explanation: 2.2 · 10⁻³⁴ m – quadrillions of times smaller than a proton. That is why tennis balls never show interference.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The de Broglie wavelength is $\lambda = \frac{h}{m v}$. An electron becomes twice as fast. To what fraction does its wavelength drop?
    answer:
      value: 1/2
    hints:
      - v is in the denominator.
    explanation: Half. Fast electrons have tiny wavelengths – that is why electron microscopes see atoms.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Light of 500 nm falls on two slits 0.1 mm apart. The screen is 2 m away. The bright fringes are spaced Δx = λ · L ÷ d. What is Δx – in mm?
    params:
      unit: mm
    answer:
      value: 10
    feedback:
      - when: abs(numval(state.input) - 0.01) < 0.001
        misconception: unit-mm
        text: That is metres. Millimetres are asked for.
    hints:
      - 5 · 10⁻⁷ m · 2 m ÷ 10⁻⁴ m.
      - Result in metres times 1000.
    explanation: Δx = 0.01 m = 10 mm. Narrower slits or longer waves spread the pattern. Thomas Young proved the wave nature of light this way around 1801.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Even football-shaped molecules of 60 carbon atoms show interference at a double slit. Why do we never see it with footballs?
    params:
      options:
        - label: Their wavelength is tiny, and constant collisions with the surroundings destroy the superposition.
          correct: true
        - label: Large objects obey different laws of nature.
          feedback: The laws are the same. The effects just become immeasurably small.
        - label: Footballs are too slow.
          feedback: Slower would even mean longer waves. The problem is the huge mass.
    hints:
      - Think of λ = h ÷ (m · v) for large m.
      - Air molecules and light keep »measuring« a football.
    explanation: "Two reasons: tiny wavelength and decoherence – every interaction with the surroundings acts like a measurement. Researchers therefore cool and isolate ever larger objects to see quantum effects."
    difficulty: 3

srs:
  cards_from: [beobachten, was]
