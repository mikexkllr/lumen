id: sci.quantum.uncertainty
type: concept
title: Unschärfe und Überlagerung
summary: Grenzen des Wissens.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Laut **Unschärferelation** kann man Ort und Impuls eines Teilchens nicht gleichzeitig beliebig genau kennen. Das liegt nicht an schlechten Geräten – es ist eine Eigenschaft der Natur.

  - kind: problem
    id: ort
    widget: choice
    prompt: Man misst den Ort eines Elektrons immer genauer. Was passiert mit seinem Impuls?
    params:
      options:
        - { label: Er wird immer unbestimmter., correct: true }
        - { label: Er wird auch genauer., feedback: "Das Gegenteil – je schärfer das eine, desto unschärfer das andere." }
    hints:
      - Es ist ein Tauschhandel.
    explanation: Genauigkeit beim Ort kostet Genauigkeit beim Impuls.

  - kind: problem
    id: ueberlagerung
    widget: choice
    prompt: Ein Quantenteilchen ist in einer Überlagerung aus »links« und »rechts«. Was findet man bei einer Messung?
    params:
      options:
        - { label: Zufällig entweder links oder rechts, correct: true }
        - { label: Ein halbes Teilchen auf jeder Seite, feedback: "Man findet immer ein ganzes Teilchen – an genau einem Ort." }
    hints:
      - Die Messung zwingt zu einer Entscheidung.
    explanation: Vorher sind beide Möglichkeiten überlagert, die Messung wählt zufällig eine.

  - kind: problem
    id: katze
    widget: choice
    prompt: Wofür steht Schrödingers Katze, die zugleich lebendig und tot sein soll?
    params:
      options:
        - { label: "Für die Frage, wo Quantenregeln in Alltagsregeln übergehen", correct: true }
        - { label: Für ein echtes Tierexperiment, feedback: "Es ist ein Gedankenexperiment – kein Tier war beteiligt." }
    hints:
      - Schrödinger wollte etwas zuspitzen.
    explanation: Große Dinge zeigen keine Überlagerung – warum genau, wird bis heute erforscht.

srs:
  cards_from: [ort, ueberlagerung]
