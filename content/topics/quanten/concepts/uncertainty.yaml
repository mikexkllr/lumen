id: sci.quantum.uncertainty
type: concept
title: Unschärfe und Überlagerung
summary: Grenzen des Wissens.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Foto eines fliegenden Balls: Kurz belichtet ist er scharf, aber man sieht kein Tempo. Lang belichtet sieht man die Spur, aber keinen genauen Ort. Kann ein Foto beides perfekt zeigen?"
    params:
      options:
        - label: Nein
          correct: true
        - label: Ja, mit einer besseren Kamera
          feedback: Das liegt nicht an der Kamera.
        - label: Ja, immer
          feedback: Scharf und verwischt schließen sich aus.
    hints:
      - Scharf oder verwischt?
    explanation: Bei winzigen Teilchen ist das kein Messproblem, sondern Natur.

  - kind: explain
    id: s1
    body: |
      Laut **Unschärferelation** kann man Ort und Impuls eines Teilchens nicht gleichzeitig beliebig genau kennen. Das liegt nicht an schlechten Geräten – es ist eine Eigenschaft der Natur.

  - kind: problem
    id: ort
    widget: choice
    prompt: Man misst den Ort eines Elektrons immer genauer. Was passiert mit seinem Impuls?
    params:
      options:
        - { label: Er wird immer unbestimmter., correct: true }
        - { label: Er wird auch genauer., feedback: "Das Gegenteil – je schärfer das eine, desto unschärfer das andere." }
    hints:
      - Es ist ein Tauschhandel.
    explanation: Genauigkeit beim Ort kostet Genauigkeit beim Impuls.

  - kind: problem
    id: ueberlagerung
    widget: choice
    prompt: Ein Quantenteilchen ist in einer Überlagerung aus »links« und »rechts«. Was findet man bei einer Messung?
    params:
      options:
        - { label: Zufällig entweder links oder rechts, correct: true }
        - { label: Ein halbes Teilchen auf jeder Seite, feedback: "Man findet immer ein ganzes Teilchen – an genau einem Ort." }
    hints:
      - Die Messung zwingt zu einer Entscheidung.
    explanation: Vorher sind beide Möglichkeiten überlagert, die Messung wählt zufällig eine.

  - kind: problem
    id: katze
    widget: choice
    prompt: Wofür steht Schrödingers Katze, die zugleich lebendig und tot sein soll?
    params:
      options:
        - { label: "Für die Frage, wo Quantenregeln in Alltagsregeln übergehen", correct: true }
        - { label: Für ein echtes Tierexperiment, feedback: "Es ist ein Gedankenexperiment – kein Tier war beteiligt." }
    hints:
      - Schrödinger wollte etwas zuspitzen.
    explanation: Große Dinge zeigen keine Überlagerung – warum genau, wird bis heute erforscht.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ort und [[Impuls]] eines Teilchens lassen sich nicht zugleich beliebig [[genau]] kennen.
      distractors:
        - Farbe
        - schnell

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Quantenwelt oder Alltag?
    params:
      buckets:
        - id: b1
          label: Quantenwelt
        - id: b2
          label: Alltag
      items:
        - label: Zwei Zustände zugleich
          bucket: b1
        - label: Ein Ball liegt an genau einem Ort
          bucket: b2
        - label: Messen verändert den Zustand
          bucket: b1
        - label: Ort und Tempo zugleich bekannt
          bucket: b2
    hints:
      - Im Kleinsten gelten andere Regeln.
    explanation: Bei großen Dingen sind die Quanteneffekte winzig. Darum merken wir sie nicht.

  - kind: problem
    id: mix-c3
    widget: match
    prompt: Verbinde Begriff und Bedeutung.
    params:
      pairs:
        - left: Unschärfe
          right: Ort und Impuls nie beide genau
        - left: Überlagerung
          right: Mehrere Zustände zugleich
        - left: Messung
          right: Legt den Zustand fest
        - left: Photon
          right: Eine Portion Licht
    hints:
      - Zwei Begriffe handeln vom Wissen, einer vom Licht.
    explanation: Mit diesen vier Begriffen beginnt jede Quantenphysik.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zwei verschränkte Teilchen werden weit getrennt. Man misst das eine. Was gilt für das andere?
    params:
      options:
        - label: Sein Messergebnis ist sofort festgelegt – aber Information lässt sich so nicht übertragen
          correct: true
        - label: Es bleibt völlig unabhängig
          feedback: Die Ergebnisse passen stärker zusammen, als jede Absprache erklären könnte.
        - label: Man kann so schneller als Licht funken
          feedback: Jeder sieht für sich nur Zufall. Der Zusammenhang zeigt sich erst beim Vergleich.
    hints:
      - Jeder Beobachter sieht allein nur zufällige Ergebnisse.
    explanation: "**Verschränkung** – Einstein nannte sie »spukhafte Fernwirkung«. Experimente bestätigen sie seit 1982."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Die Unschärfe liegt an ungenauen Messgeräten.
          right: false
          why: Sie ist eine Eigenschaft der Natur.
        - text: Je genauer der Ort, desto ungenauer der Impuls.
          right: true
        - text: Eine Messung legt den Zustand fest.
          right: true
        - text: "Überlagerung heißt: Wir kennen den Zustand nur nicht."
          right: false
          why: "Experimente zeigen: Der Zustand ist wirklich unbestimmt."
      left: Falsch
      right: Wahr
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Ein Atom ist etwa 0,000 000 000 1 m groß. Wie viele Nullen stehen vor der 1 – die vor dem Komma mitgezählt?"
    params:
      min: 1
      max: 30
    answer:
      value: 10
      tolerance: 1
    explanation: Zehn. Ein Zehnmilliardstel Meter – dort regiert die Quantenphysik.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Die **Unschärferelation** lautet $\Delta x \cdot \Delta p \geq \frac{\hbar}{2}$, mit ħ ≈ 1,05 · 10⁻³⁴ Js. Wird die Ortsunschärfe halbiert, muss sich die Impulsunschärfe mindestens verdoppeln.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "Ein Elektron ist in einem Atom auf Δx = 10⁻¹⁰ m eingesperrt. Wie groß ist seine Geschwindigkeitsunschärfe mindestens? Δv = ħ : (2 · m · Δx), m = 9,1 · 10⁻³¹ kg. In km/s."
    params:
      unit: km/s
    answer:
      value: 580
      tolerance: 20
    feedback:
      - when: abs(numval(state.input) - 580000) < 20000
        misconception: unit-km
        text: Das sind m/s. Teile durch 1000.
    hints:
      - 2 · 9,1 · 10⁻³¹ · 10⁻¹⁰ = 1,82 · 10⁻⁴⁰.
      - "1,05 · 10⁻³⁴ : 1,82 · 10⁻⁴⁰ ≈ 5,8 · 10⁵ m/s."
    explanation: Etwa 580 km/s. Ein eingesperrtes Elektron kann nicht stillhalten. Diese »Nullpunktbewegung« verhindert, dass es in den Kern stürzt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Beim **Tunneleffekt** durchquert ein Teilchen eine Barriere, für die seine Energie nicht reicht. Wo ist das lebenswichtig?
    params:
      options:
        - label: In der Sonne – nur durch Tunneln kommen sich Protonen nah genug für die Fusion
          correct: true
        - label: Beim Durchfahren eines Straßentunnels
          feedback: Der Name ist nur ein Bild.
        - label: Nirgends – es ist ein Gedankenexperiment
          feedback: Flash-Speicher und Rastertunnelmikroskope nutzen ihn täglich.
    hints:
      - Im Sonneninneren ist es eigentlich zu kalt für Fusion.
    explanation: Ohne Tunneleffekt würde die Sonne nicht leuchten. Die Wellenfunktion reicht ein Stück in die Barriere hinein.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Ein Staubkorn (10⁻¹⁵ kg) ist auf 1 µm genau bekannt. Wie groß ist seine Geschwindigkeitsunschärfe mindestens? Gib den Exponenten an: etwa 5 · 10 hoch … m/s."
    answer:
      value: -14
    hints:
      - "Δv = 1,05 · 10⁻³⁴ : (2 · 10⁻¹⁵ · 10⁻⁶)."
      - Der Nenner ist 2 · 10⁻²¹.
    explanation: Δv ≈ 5 · 10⁻¹⁴ m/s – in tausend Jahren nicht einmal ein Haar breit. Bei Alltagsdingen ist die Unschärfe völlig unsichtbar.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Spektrallinien sind nie unendlich scharf, sondern haben eine natürliche Breite. Woher kommt sie?
    params:
      options:
        - label: Angeregte Zustände leben nur kurz – und nach ΔE · Δt ≥ ħ/2 ist ihre Energie dann unscharf.
          correct: true
        - label: Die Spektrometer sind ungenau.
          feedback: Auch perfekte Geräte messen diese Breite. Sie ist Natur, nicht Technik.
        - label: Die Atome sind verschieden groß.
          feedback: Alle Atome eines Elements sind gleich. Es liegt an der kurzen Lebensdauer.
    hints:
      - Es gibt auch eine Unschärfe zwischen Energie und Zeit.
      - Kurze Lebensdauer, große Energieunschärfe.
    explanation: Ein Zustand, der nur Nanosekunden lebt, hat keine exakt bestimmte Energie. Je kürzer die Lebensdauer, desto breiter die Linie.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Unschärfe nicht an schlechten Messgeräten liegt.
    params:
      keywords:
        - - welle
          - wave
          - wellenpaket
          - packet
        - - ort
          - position
          - impuls
          - momentum
        - - eigenschaft
          - property
          - natur
          - nature
          - grundsätzlich
          - fundamental
          - prinzip
          - principle
      sample: Ein Teilchen ist auch eine Welle. Ein Wellenpaket, das an einem Ort sitzt, besteht aus vielen Wellenlängen – also aus vielen Impulsen. Genauer Ort und genauer Impuls schließen sich aus. Das ist eine Eigenschaft der Natur.
    difficulty: 3

srs:
  cards_from: [ort, ueberlagerung]
