id: sci.quantum.photons
type: concept
title: Light in portions
summary: Photons and their energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "What gives you sunburn: red light or UV light?"
    params:
      options:
        - label: UV light
          correct: true
        - label: Red light
          feedback: Red lamps only warm.
        - label: Both equally
          feedback: The effect is very different.
    hints:
      - What does sunscreen protect against?
    explanation: UV light carries more energy per portion.

  - kind: explain
    id: s1
    body: |
      Light comes in tiny energy packets called **photons**. Their energy depends on frequency. Blue light has more energetic photons than red, and ultraviolet has even more.

  - kind: problem
    id: sonnenbrand
    widget: choice
    prompt: Why does UV light cause sunburn, but a red lamp does not, no matter how bright?
    params:
      options:
        - { label: "Single UV photons have enough energy to damage skin.", correct: true }
        - { label: Red light is too weak., feedback: "Even a very bright red lamp can't do it. It depends on the energy per photon." }
    hints:
      - What counts is the single packet, not the amount.
    explanation: Many weak photons do not replace one strong one. That is the core of quantum physics.

  - kind: problem
    id: frequenz
    widget: numeric
    prompt: One photon has {{k}} times the frequency of another. How many times as much energy does it carry?
    params: { unit: "times" }
    answer: { value: "{{k}}" }
    hints:
      - Energy and frequency are proportional.
    explanation: "Double the frequency, double the energy. Here {{k}} times."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 2 }

  - kind: problem
    id: solarzelle
    widget: choice
    prompt: A solar cell only reacts to light from a certain color on. Why?
    params:
      options:
        - { label: "Each photon needs enough energy to free an electron.", correct: true }
        - { label: The light must be bright enough., feedback: "Brightness means more photons, but each single one needs enough energy." }
    hints:
      - Remember the sunburn.
    explanation: This is the **photoelectric effect**. Einstein won the Nobel Prize for explaining it.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Light comes in packets, the [[photons]]. The higher the [[frequency]], the more [[energy]] each packet has.
      distractors:
        - electrons
        - brightness

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "The energy of a photon is $E = h \\cdot f$. Green light has $f = 6 \\cdot 10^{14}$ Hz, and $h = 6.6 \\cdot 10^{-34}$ Js. Give the exponent of the energy: about 4 · 10 to the … joules."
    answer:
      value: -19
    hints:
      - 6.6 · 6 ≈ 40 and −34 + 14 = −20.
    explanation: 40 · 10⁻²⁰ = 4 · 10⁻¹⁹ J. A light bulb emits around 10²⁰ photons per second.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In the **photoelectric effect** light knocks electrons out of metal. What was observed that wave theory could not explain?
    params:
      options:
        - label: Below a threshold frequency nothing happens – however bright the light
          correct: true
        - label: Brighter light releases more electrons
          feedback: That fits wave theory too.
        - label: The metal gets warm
          feedback: Every theory explains that.
    hints:
      - A wave could accumulate energy. A single packet suffices – or it does not.
    explanation: Einstein explained this in 1905 with light quanta and received the Nobel Prize for it – not for relativity.
    difficulty: 3

srs:
  cards_from: [sonnenbrand, solarzelle]
