id: sci.quantum.photons
type: concept
title: Light in portions
summary: Photons and their energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Light comes in tiny energy packets called **photons**. Their energy depends on frequency. Blue light has more energetic photons than red, and ultraviolet has even more.

  - kind: problem
    id: sonnenbrand
    widget: choice
    prompt: Why does UV light cause sunburn, but a red lamp does not, no matter how bright?
    params:
      options:
        - { label: "Single UV photons have enough energy to damage skin.", correct: true }
        - { label: Red light is too weak., feedback: "Even a very bright red lamp can't do it. It depends on the energy per photon." }
    hints:
      - What counts is the single packet, not the amount.
    explanation: Many weak photons do not replace one strong one. That is the core of quantum physics.

  - kind: problem
    id: frequenz
    widget: numeric
    prompt: One photon has {{k}} times the frequency of another. How many times as much energy does it carry?
    params: { unit: "times" }
    answer: { value: "{{k}}" }
    hints:
      - Energy and frequency are proportional.
    explanation: "Double the frequency, double the energy. Here {{k}} times."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 2 }

  - kind: problem
    id: solarzelle
    widget: choice
    prompt: A solar cell only reacts to light from a certain color on. Why?
    params:
      options:
        - { label: "Each photon needs enough energy to free an electron.", correct: true }
        - { label: The light must be bright enough., feedback: "Brightness means more photons, but each single one needs enough energy." }
    hints:
      - Remember the sunburn.
    explanation: This is the **photoelectric effect**. Einstein won the Nobel Prize for explaining it.

srs:
  cards_from: [sonnenbrand, solarzelle]
