id: sci.quantum.photons
type: concept
title: Light in portions
summary: Photons and their energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "What gives you sunburn: red light or UV light?"
    params:
      options:
        - label: UV light
          correct: true
        - label: Red light
          feedback: Red lamps only warm.
        - label: Both equally
          feedback: The effect is very different.
    hints:
      - What does sunscreen protect against?
    explanation: UV light carries more energy per portion.

  - kind: explain
    id: s1
    body: |
      Light comes in tiny energy packets called **photons**. Their energy depends on frequency. Blue light has more energetic photons than red, and ultraviolet has even more.

  - kind: problem
    id: sonnenbrand
    widget: choice
    prompt: Why does UV light cause sunburn, but a red lamp does not, no matter how bright?
    params:
      options:
        - { label: "Single UV photons have enough energy to damage skin.", correct: true }
        - { label: Red light is too weak., feedback: "Even a very bright red lamp can't do it. It depends on the energy per photon." }
    hints:
      - What counts is the single packet, not the amount.
    explanation: Many weak photons do not replace one strong one. That is the core of quantum physics.

  - kind: problem
    id: frequenz
    widget: numeric
    prompt: One photon has {{k}} times the frequency of another. How many times as much energy does it carry?
    params: { unit: "times" }
    answer: { value: "{{k}}" }
    hints:
      - Energy and frequency are proportional.
    explanation: "Double the frequency, double the energy. Here {{k}} times."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 2 }

  - kind: problem
    id: solarzelle
    widget: choice
    prompt: A solar cell only reacts to light from a certain color on. Why?
    params:
      options:
        - { label: "Each photon needs enough energy to free an electron.", correct: true }
        - { label: The light must be bright enough., feedback: "Brightness means more photons, but each single one needs enough energy." }
    hints:
      - Remember the sunburn.
    explanation: This is the **photoelectric effect**. Einstein won the Nobel Prize for explaining it.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Light comes in packets, the [[photons]]. The higher the [[frequency]], the more [[energy]] each packet has.
      distractors:
        - electrons
        - brightness

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "The energy of a photon is $E = h \\cdot f$. Green light has $f = 6 \\cdot 10^{14}$ Hz, and $h = 6.6 \\cdot 10^{-34}$ Js. Give the exponent of the energy: about 4 · 10 to the … joules."
    answer:
      value: -19
    hints:
      - 6.6 · 6 ≈ 40 and −34 + 14 = −20.
    explanation: 40 · 10⁻²⁰ = 4 · 10⁻¹⁹ J. A light bulb emits around 10²⁰ photons per second.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "In the **photoelectric effect** a photon gives all its energy hf to a single electron. Part of it frees the electron from the metal – the work function W. The rest becomes kinetic energy: $E_{kin} = hf - W$."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Photons of {{e}} eV hit sodium. Its work function is 2.3 eV. With at most how much kinetic energy do the electrons fly out – in eV?
    params:
      unit: eV
    answer:
      value: "{{e - 2.3}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - e) < 0.01
        misconception: forgot-work-function
        text: Part of the energy is spent freeing the electron. Subtract the work function.
    hints:
      - E_kin = hf − W.
      - "{{e}} − 2.3 = ?"
    explanation: "{{e}} − 2.3 = {{e - 2.3}} eV. Below 2.3 eV no electron comes out at all – however bright the light."
    difficulty: 2
    variants:
      params:
        e: choice[2.8,3.1,3.5,4.1]
      defaults:
        e: 3.1

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: "A handy formula: photon energy in eV = 1240 ÷ wavelength in nm. How much energy does a photon of red light at 620 nm have?"
    params:
      unit: eV
    answer:
      value: 2
    hints:
      - Divide 1240 by the wavelength.
      - 1240 ÷ 620 = ?
    explanation: 2.0 eV. Blue at 413 nm has 3.0 eV, UV at 310 nm 4.0 eV. Shorter wave, more energy per photon.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In the **photoelectric effect** light knocks electrons out of metal. What was observed that wave theory could not explain?
    params:
      options:
        - label: Below a threshold frequency nothing happens – however bright the light
          correct: true
        - label: Brighter light releases more electrons
          feedback: That fits wave theory too.
        - label: The metal gets warm
          feedback: Every theory explains that.
    hints:
      - A wave could accumulate energy. A single packet suffices – or it does not.
    explanation: Einstein explained this in 1905 with light quanta and received the Nobel Prize for it – not for relativity.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: In the photoelectric effect you make the light twice as bright, same colour. What changes?
    params:
      options:
        - label: Twice as many electrons come out – each with the same energy.
          correct: true
        - label: The electrons get twice as fast.
          feedback: That is what wave theory predicted – wrongly. Each photon brings the same amount.
        - label: Nothing.
          feedback: More photons hit more electrons. The current grows.
    hints:
      - "Brighter means: more photons of the same kind."
      - One photon – one electron.
    explanation: Brightness sets the number of photons, colour their energy. This explanation earned Einstein the 1921 Nobel Prize – not relativity.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Fermi question: how many photons per second does a 1 mW red laser pointer (650 nm) emit?"
    params:
      min: 100000
      max: 1e+25
      scale: log
    answer:
      value: 3300000000000000
      within: 60
    explanation: One photon has 1240 ÷ 650 ≈ 1.9 eV ≈ 3 · 10⁻¹⁹ J. 10⁻³ J ÷ 3 · 10⁻¹⁹ J ≈ 3 · 10¹⁵ photons per second. That is why everyday light looks like a smooth flow.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why red light knocks no electrons out of zinc – however bright it is.
    params:
      keywords:
        - - photon
          - portion
          - paket
          - packet
        - - energie
          - energy
          - frequenz
          - frequency
          - farbe
          - colour
          - color
        - - einzeln
          - single
          - one
          - ein
          - jedes
          - each
          - reicht
          - enough
      sample: Light comes in photons. Each photon gives its energy to a single electron. Red photons have too little energy to free it. Brighter just means more photons, not stronger ones.
    difficulty: 3

srs:
  cards_from: [sonnenbrand, solarzelle]
