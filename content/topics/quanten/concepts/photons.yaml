id: sci.quantum.photons
type: concept
title: Licht in Portionen
summary: Photonen und ihre Energie.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Wovon bekommst du Sonnenbrand: von rotem Licht oder von UV-Licht?"
    params:
      options:
        - label: Von UV-Licht
          correct: true
        - label: Von rotem Licht
          feedback: Rotlichtlampen wärmen nur.
        - label: Von beidem gleich
          feedback: Die Wirkung ist sehr verschieden.
    hints:
      - Wovor schützt Sonnencreme?
    explanation: UV-Licht bringt mehr Energie pro Portion mit.

  - kind: explain
    id: s1
    body: |
      Licht kommt in winzigen Energiepaketen, den **Photonen**. Ihre Energie hängt von der Frequenz ab: blaues Licht hat energiereichere Photonen als rotes, ultraviolettes noch mehr.

  - kind: problem
    id: sonnenbrand
    widget: choice
    prompt: Warum bekommt man Sonnenbrand von UV-Licht, aber nicht von einer roten Lampe – egal wie hell sie ist?
    params:
      options:
        - { label: "Einzelne UV-Photonen haben genug Energie, die Haut zu schädigen.", correct: true }
        - { label: Rotes Licht ist zu schwach., feedback: "Auch eine sehr helle rote Lampe schafft es nicht – es liegt an der Energie pro Photon." }
    hints:
      - Es kommt auf das einzelne Paket an, nicht auf die Menge.
    explanation: Viele schwache Photonen ersetzen kein starkes – das ist der Kern der Quantenphysik.

  - kind: problem
    id: frequenz
    widget: numeric
    prompt: Ein Photon hat die {{k}}-fache Frequenz eines anderen. Wievielmal so viel Energie trägt es?
    params: { unit: "-mal" }
    answer: { value: "{{k}}" }
    hints:
      - Energie und Frequenz sind proportional.
    explanation: "Doppelte Frequenz, doppelte Energie – hier {{k}}-mal."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 2 }

  - kind: problem
    id: solarzelle
    widget: choice
    prompt: Eine Solarzelle reagiert auf Licht erst ab einer bestimmten Farbe. Warum?
    params:
      options:
        - { label: "Jedes Photon muss genug Energie haben, um ein Elektron zu lösen.", correct: true }
        - { label: Das Licht muss hell genug sein., feedback: "Helligkeit bedeutet mehr Photonen – aber jedes einzelne braucht genug Energie." }
    hints:
      - Erinnere dich an den Sonnenbrand.
    explanation: Das ist der **Photoeffekt** – für seine Erklärung bekam Einstein den Nobelpreis.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Licht kommt in Paketen, den [[Photonen]]. Je höher die [[Frequenz]], desto mehr [[Energie]] hat jedes Paket.
      distractors:
        - Elektronen
        - Helligkeit

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Die Energie eines Photons ist $E = h \\cdot f$. Grünes Licht hat $f = 6 \\cdot 10^{14}$ Hz, und $h = 6{,}6 \\cdot 10^{-34}$ Js. Gib den Exponenten der Energie an: etwa 4 · 10 hoch … Joule."
    answer:
      value: -19
    hints:
      - 6,6 · 6 ≈ 40 und −34 + 14 = −20.
    explanation: 40 · 10⁻²⁰ = 4 · 10⁻¹⁹ J. Eine Glühbirne sendet rund 10²⁰ Photonen pro Sekunde.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "Beim **Photoeffekt** gibt ein Photon seine ganze Energie hf an ein einziges Elektron ab. Ein Teil löst es aus dem Metall, das ist die Austrittsarbeit W. Der Rest wird Bewegungsenergie: $E_{kin} = hf - W$."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Photonen mit {{e}} eV treffen auf Natrium. Seine Austrittsarbeit ist 2,3 eV. Mit wie viel Bewegungsenergie fliegen die Elektronen höchstens heraus – in eV?
    params:
      unit: eV
    answer:
      value: "{{e - 2.3}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - e) < 0.01
        misconception: forgot-work-function
        text: Ein Teil der Energie geht für das Herauslösen drauf. Zieh die Austrittsarbeit ab.
    hints:
      - E_kin = hf − W.
      - "{{e}} − 2,3 = ?"
    explanation: "{{e}} − 2,3 = {{e - 2.3}} eV. Unter 2,3 eV kommt gar kein Elektron heraus – egal wie hell das Licht ist."
    difficulty: 2
    variants:
      params:
        e: choice[2.8,3.1,3.5,4.1]
      defaults:
        e: 3.1

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: "Eine praktische Formel: Photonenenergie in eV = 1240 : Wellenlänge in nm. Wie viel Energie hat ein Photon roten Lichts mit 620 nm?"
    params:
      unit: eV
    answer:
      value: 2
    hints:
      - Teile 1240 durch die Wellenlänge.
      - "1240 : 620 = ?"
    explanation: 2,0 eV. Blau mit 413 nm hat 3,0 eV, UV mit 310 nm 4,0 eV. Kürzere Welle, mehr Energie pro Photon.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Beim **Photoeffekt** schlägt Licht Elektronen aus Metall. Was beobachtete man, das die Wellentheorie nicht erklären konnte?
    params:
      options:
        - label: Unter einer Grenzfrequenz passiert nichts – egal wie hell das Licht ist
          correct: true
        - label: Helleres Licht löst mehr Elektronen aus
          feedback: Das passt auch zur Wellentheorie.
        - label: Das Metall wird warm
          feedback: Das erklärt jede Theorie.
    hints:
      - Eine Welle könnte Energie ansammeln. Ein einzelnes Paket reicht – oder eben nicht.
    explanation: Einstein erklärte das 1905 mit Lichtquanten und bekam dafür den Nobelpreis – nicht für die Relativität.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Beim Photoeffekt machst du das Licht doppelt so hell, die Farbe bleibt. Was ändert sich?
    params:
      options:
        - label: Es kommen doppelt so viele Elektronen heraus – jedes mit derselben Energie.
          correct: true
        - label: Die Elektronen werden doppelt so schnell.
          feedback: Das sagte die Wellentheorie voraus – und lag falsch. Jedes Photon bringt gleich viel.
        - label: Nichts.
          feedback: Mehr Photonen treffen mehr Elektronen. Der Strom wächst.
    hints:
      - "Heller heißt: mehr Photonen derselben Sorte."
      - Ein Photon – ein Elektron.
    explanation: Helligkeit bestimmt die Zahl, Farbe die Energie der Photonen. Diese Erklärung brachte Einstein 1921 den Nobelpreis – nicht die Relativität.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Fermi-Frage: Wie viele Photonen pro Sekunde sendet ein roter Laserpointer mit 1 mW (650 nm)?"
    params:
      min: 100000
      max: 1e+25
      scale: log
    answer:
      value: 3300000000000000
      within: 60
    explanation: "Ein Photon hat 1240 : 650 ≈ 1,9 eV ≈ 3 · 10⁻¹⁹ J. 10⁻³ J : 3 · 10⁻¹⁹ J ≈ 3 · 10¹⁵ Photonen pro Sekunde. Darum wirkt Licht im Alltag wie ein glatter Strom."
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum rotes Licht keine Elektronen aus Zink schlägt – egal wie hell es ist.
    params:
      keywords:
        - - photon
          - portion
          - paket
          - packet
        - - energie
          - energy
          - frequenz
          - frequency
          - farbe
          - colour
          - color
        - - einzeln
          - single
          - one
          - ein
          - jedes
          - each
          - reicht
          - enough
      sample: Licht kommt in Photonen. Jedes Photon gibt seine Energie einem einzelnen Elektron. Rote Photonen haben zu wenig Energie, um es zu lösen. Heller heißt nur mehr Photonen, nicht stärkere.
    difficulty: 3

srs:
  cards_from: [sonnenbrand, solarzelle]
