id: sci.quantum.tech
type: concept
title: Quanta in technology
summary: Lasers, LEDs and qubits.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: technik
    widget: match
    prompt: Which quantum effect is behind it?
    params:
      pairs:
        - { left: LED, right: Electron jumps }
        - { left: Solar cell, right: Photoelectric effect }
        - { left: Laser, right: Photons in step }
    hints:
      - You know the solar cell from the photoelectric effect.
    explanation: Almost all modern electronics rely on quantum physics.

  - kind: explain
    id: s2
    body: |
      A **qubit** can be in a superposition of 0 and 1. Several qubits together describe all combinations at once. Each extra qubit doubles the number.

  - kind: problem
    id: qubits
    widget: numeric
    prompt: How many combinations of 0 and 1 do {{n}} qubits describe at once?
    params: { unit: combinations }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear
        text: Each qubit doubles the count. It grows exponentially, not linearly.
    hints:
      - "Each qubit doubles: 2, 4, 8 …"
    explanation: "$2^{ {{n}} } = {{2 ** n}}$. With 300 qubits, that would be more than the atoms in the universe."
    variants:
      params: { n: "int[3,10]" }
      defaults: { n: 5 }

  - kind: problem
    id: grenzen
    widget: choice
    prompt: Will quantum computers soon replace normal computers?
    params:
      options:
        - { label: "No, they are only faster at special tasks.", correct: true }
        - { label: "Yes, they are faster at everything.", feedback: "They bring nothing for email or games. They shine at special problems." }
    hints:
      - What do you need superposition for in the first place?
    explanation: Simulating molecules or certain cryptography is where they pay off.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: With every qubit the number of states doubles. From how many qubits are there more than a trillion (10¹²)?
    answer:
      value: 40
    hints:
      - 2¹⁰ ≈ 10³.
    explanation: 2⁴⁰ ≈ 1.1 · 10¹². Just 300 qubits describe more states than there are atoms in the universe.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is it so hard to build large quantum computers?
    params:
      options:
        - label: The slightest disturbance destroys the superposition – this is called decoherence
          correct: true
        - label: Qubits are too expensive
          feedback: The problem is physical, not financial.
        - label: The right software is missing
          feedback: Algorithms have existed since 1994 – stable hardware is missing.
    hints:
      - What happened at the double slit as soon as you looked?
    explanation: Qubits must be almost perfectly isolated and are cooled to thousandths of a degree above zero. Error correction costs thousands of qubits per usable one.
    difficulty: 3

srs:
  cards_from: [qubits, grenzen]
