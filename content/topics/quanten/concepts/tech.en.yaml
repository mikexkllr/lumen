id: sci.quantum.tech
type: concept
title: Quanta in technology
summary: Lasers, LEDs and qubits.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: technik
    widget: match
    prompt: Which quantum effect is behind it?
    params:
      pairs:
        - { left: LED, right: Electron jumps }
        - { left: Solar cell, right: Photoelectric effect }
        - { left: Laser, right: Photons in step }
    hints:
      - You know the solar cell from the photoelectric effect.
    explanation: Almost all modern electronics rely on quantum physics.

  - kind: explain
    id: s2
    body: |
      A **qubit** can be in a superposition of 0 and 1. Several qubits together describe all combinations at once. Each extra qubit doubles the number.

  - kind: problem
    id: qubits
    widget: numeric
    prompt: How many combinations of 0 and 1 do {{n}} qubits describe at once?
    params: { unit: combinations }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear
        text: Each qubit doubles the count. It grows exponentially, not linearly.
    hints:
      - "Each qubit doubles: 2, 4, 8 …"
    explanation: "$2^{ {{n}} } = {{2 ** n}}$. With 300 qubits, that would be more than the atoms in the universe."
    variants:
      params: { n: "int[3,10]" }
      defaults: { n: 5 }

  - kind: problem
    id: grenzen
    widget: choice
    prompt: Will quantum computers soon replace normal computers?
    params:
      options:
        - { label: "No, they are only faster at special tasks.", correct: true }
        - { label: "Yes, they are faster at everything.", feedback: "They bring nothing for email or games. They shine at special problems." }
    hints:
      - What do you need superposition for in the first place?
    explanation: Simulating molecules or certain cryptography is where they pay off.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: With every qubit the number of states doubles. From how many qubits are there more than a trillion (10¹²)?
    answer:
      value: 40
    hints:
      - 2¹⁰ ≈ 10³.
    explanation: 2⁴⁰ ≈ 1.1 · 10¹². Just 300 qubits describe more states than there are atoms in the universe.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: An LED emits light at the energy of its band gap. At 2.7 eV – what wavelength is its light? Use λ in nm = 1240 ÷ E. To whole nm.
    params:
      unit: nm
    answer:
      value: 459
      tolerance: 3
    hints:
      - 1240 ÷ 2.7 = ?
      - The result lies in the blue range.
    explanation: About 459 nm – blue. Blue LEDs needed a large band gap and only succeeded in the 1990s. That earned a Nobel Prize in 2014.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: What makes laser light so special?
    params:
      options:
        - label: One photon triggers more electrons to jump – all photons share the same colour, direction and rhythm.
          correct: true
        - label: It is just very bright light.
          feedback: A lamp can be brighter. What is special is the lockstep.
        - label: Laser light is not made of photons.
          feedback: Laser light also comes in photons – just especially orderly.
    hints:
      - »Laser« stands for light amplification by stimulated emission.
      - A photon can nudge an excited atom into emitting a twin photon.
    explanation: In stimulated emission an exact twin of the triggering photon is created. Mirrors make this process grow like an avalanche.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is it so hard to build large quantum computers?
    params:
      options:
        - label: The slightest disturbance destroys the superposition – this is called decoherence
          correct: true
        - label: Qubits are too expensive
          feedback: The problem is physical, not financial.
        - label: The right software is missing
          feedback: Algorithms have existed since 1994 – stable hardware is missing.
    hints:
      - What happened at the double slit as soon as you looked?
    explanation: Qubits must be almost perfectly isolated and are cooled to thousandths of a degree above zero. Error correction costs thousands of qubits per usable one.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A quantum computer searches an unsorted list of N entries in about √N steps. A normal computer needs N ÷ 2 on average. How many steps does the quantum computer need for N = 10⁶?
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 500000
        misconception: classical
        text: That is the normal computer. The quantum computer needs only √N.
    hints:
      - √(10⁶) = 10³.
      - The square root halves the exponent.
    explanation: 1000 instead of 500,000 steps. A big advantage, but not an exponential one. For many tasks quantum computers bring none at all.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Why can no one secretly listen in on a quantum key?
    params:
      options:
        - label: Every measurement disturbs the quantum state – an eavesdropper leaves errors that can be noticed.
          correct: true
        - label: The photons are too fast to intercept.
          feedback: Interception is possible – but not unnoticed.
        - label: The data are hidden in qubits that no one can read.
          feedback: The receiver reads them. The trick is that reading leaves traces.
    hints:
      - Can you copy an unknown quantum state?
      - Measuring changes what you measure.
    explanation: Unknown quantum states cannot be copied, and measuring changes them. When sender and receiver compare part of their data, any eavesdropper shows up.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what makes a qubit different from a normal bit.
    params:
      keywords:
        - - überlager
          - superpos
          - beides
          - both
          - zugleich
          - same time
        - - mess
          - measur
          - zufall
          - random
        - - kombination
          - combination
          - verdoppel
          - doubl
          - viele
          - many
      sample: A bit is 0 or 1. A qubit can be in a superposition of 0 and 1. Only when measured does it give 0 or 1 at random. Many qubits together describe all combinations at once.
    difficulty: 3

srs:
  cards_from: [qubits, grenzen]
