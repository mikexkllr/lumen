id: sci.quantum.lab
type: concept
title: Quanten-Labor
summary: Doppelspalt simulieren, Photonen einstellen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Licht schlägt Elektronen
    body: Licht kann Elektronen aus Metall schlagen – aber erst ab einer bestimmten Farbe. Nach rechts steigt die Frequenz, nach oben die Energie der Elektronen. Zieh an der **Austrittsarbeit** des Metalls.
    visual:
      widget: slider
      interactive: true
      params:
        expr: 0.414*x - w
        x:
          - 0
          - 15
        y:
          - 0
          - 4
        sliders:
          - id: w
            label: Austrittsarbeit (eV)
            min: 1
            max: 5
            step: 0.5
            initial: 2.5

  - kind: problem
    id: doppelspalt
    widget: distribution
    prompt: Schicke mindestens 200 Elektronen einzeln durch den Doppelspalt und beobachte, wo sie am Schirm landen.
    params:
      items: [{ label: "−3", weight: 3 }, { label: "−2", weight: 0.3 }, { label: "−1", weight: 6 }, { label: "0", weight: 10 }, { label: "1", weight: 6 }, { label: "2", weight: 0.3 }, { label: "3", weight: 3 }]
    check: { predicate: "draws >= 200" }
    hints:
      - Viele auf einmal schicken.
    explanation: Helle und dunkle Streifen – ein Interferenzmuster, obwohl jedes Elektron einzeln kam.

  - kind: problem
    id: frequenz
    widget: slider
    prompt: Stelle die Welle auf die doppelte Frequenz. Dann hat jedes Photon doppelt so viel Energie.
    params:
      expr: "sin(f*x)"
      x: [0, 6]
      y: [-2, 2]
      showCoordinates: false
      sliders: [{ id: f, label: Frequenz, min: 1, max: 6, step: 1, initial: 2 }]
      target: { expr: "sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - Doppelt so viele Schwingungen auf derselben Strecke.
    explanation: Frequenz 4 statt 2 – jedes Photon trägt doppelt so viel Energie.

  - kind: problem
    id: sprung
    widget: numberline
    prompt: Ein Elektron springt von 5 eV auf 2 eV. Markiere die Energie des ausgesandten Photons.
    params: { min: 0, max: 5, ticks: 1, labels: integers }
    answer: { value: 3 }
    hints:
      - Die Differenz der Stufen.
    explanation: 5 − 2 = 3 eV – das Photon trägt genau die Differenz.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Ordne nach der Energie pro Photon, die kleinste zuerst.
    params:
      items:
        - { label: Radiowelle }
        - { label: Rotes Licht }
        - { label: Blaues Licht }
        - { label: UV-Licht }
    hints:
      - Höhere Frequenz, mehr Energie.
    explanation: Darum macht UV Sonnenbrand und Radio nicht.

  - kind: problem
    id: ph-d1
    depth: 2
    widget: buckets
    prompt: Welle oder Teilchen – was zeigt dieser Versuch vor allem?
    params:
      buckets:
        - id: b1
          label: Welle
        - id: b2
          label: Teilchen
      items:
        - label: Doppelspalt-Streifen
          bucket: b1
        - label: Seifenblasen-Farben
          bucket: b1
        - label: Elektronen am Kristall
          bucket: b1
        - label: Photoeffekt
          bucket: b2
        - label: Klicks im Detektor
          bucket: b2
        - label: Compton-Stoß
          bucket: b2
    hints:
      - Überlagerung und Streifen sind typisch für Wellen.
      - Portionen, Klicks und Stöße sind typisch für Teilchen.
    explanation: "Licht und Elektronen zeigen beides – je nach Versuch. Das ist der Welle-Teilchen-Dualismus. Beim Doppelspalt mit einzelnen Teilchen sieht man sogar beides zugleich: Klicks, die Streifen bilden."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numberline
    prompt: "Grünes Licht hat 500 nm. Markiere die Energie eines Photons: E in eV = 1240 : 500."
    params:
      min: 0
      max: 4
      ticks: 4
      labels: decimals
    answer:
      value: 2.5
      tolerance: 0.05
    hints:
      - "1240 : 500 ≈ 2,5."
      - Zwischen 2 und 3 liegt die Hälfte bei 2,5.
    explanation: 2,48 eV – rund 2,5. Sichtbares Licht liegt etwa zwischen 1,7 eV (rot) und 3,1 eV (violett).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux, was am Doppelspalt-Versuch so merkwürdig ist.
    params:
      keywords:
        - - welle
          - wave
          - muster
          - streifen
          - pattern
          - stripe
          - interferenz
          - interference
        - - teilchen
          - einzeln
          - particle
          - single
          - elektron
          - electron
        - - mess
          - misst
          - beobacht
          - measur
          - observ
          - hinseh
          - look
      sample: Einzelne Teilchen wie Elektronen erzeugen ein Streifenmuster, als wären sie Wellen, die durch beide Spalte gehen. Sobald man aber misst, welchen Spalt sie nehmen, verschwindet das Muster.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: In einem Kasten der Länge L passen nur stehende Wellen mit $L = n \cdot \frac{\lambda}{2}$. Mit $p = h/\lambda$ folgt $E_n = n^2 \cdot E_1$. Diese **Quantisierung** erklärt, warum eingesperrte Teilchen nur feste Energien haben.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Ein Elektron sitzt in einem winzigen Kasten. Sein tiefster Zustand hat E₁ = 1 eV. Welche Energie hat der dritte Zustand?
    params:
      unit: eV
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 3
        misconception: linear-n
        text: Die Energie wächst mit n², nicht mit n.
    hints:
      - E_n = n² · E₁.
      - 3² · 1 eV = ?
    explanation: 9 eV. Je kleiner der Kasten, desto größer E₁. So stellt man in Quantenpunkten die Farbe allein über ihre Größe ein – das steckt in manchen Fernsehern.
    difficulty: 3

srs:
  cards_from: [frequenz, sprung]
