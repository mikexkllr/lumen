id: sci.quantum.lab
type: concept
title: Quanten-Labor
summary: Doppelspalt simulieren, Photonen einstellen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: doppelspalt
    widget: distribution
    prompt: Schicke mindestens 200 Elektronen einzeln durch den Doppelspalt und beobachte, wo sie am Schirm landen.
    params:
      items: [{ label: "−3", weight: 3 }, { label: "−2", weight: 0.3 }, { label: "−1", weight: 6 }, { label: "0", weight: 10 }, { label: "1", weight: 6 }, { label: "2", weight: 0.3 }, { label: "3", weight: 3 }]
    check: { predicate: "draws >= 200" }
    hints:
      - Viele auf einmal schicken.
    explanation: Helle und dunkle Streifen – ein Interferenzmuster, obwohl jedes Elektron einzeln kam.

  - kind: problem
    id: frequenz
    widget: slider
    prompt: Stelle die Welle auf die doppelte Frequenz. Dann hat jedes Photon doppelt so viel Energie.
    params:
      expr: "sin(f*x)"
      x: [0, 6]
      y: [-2, 2]
      showCoordinates: false
      sliders: [{ id: f, label: Frequenz, min: 1, max: 6, step: 1, initial: 2 }]
      target: { expr: "sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - Doppelt so viele Schwingungen auf derselben Strecke.
    explanation: Frequenz 4 statt 2 – jedes Photon trägt doppelt so viel Energie.

  - kind: problem
    id: sprung
    widget: numberline
    prompt: Ein Elektron springt von 5 eV auf 2 eV. Markiere die Energie des ausgesandten Photons.
    params: { min: 0, max: 5, ticks: 1, labels: integers }
    answer: { value: 3 }
    hints:
      - Die Differenz der Stufen.
    explanation: 5 − 2 = 3 eV – das Photon trägt genau die Differenz.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Ordne nach der Energie pro Photon, die kleinste zuerst.
    params:
      items:
        - { label: Radiowelle }
        - { label: Rotes Licht }
        - { label: Blaues Licht }
        - { label: UV-Licht }
    hints:
      - Höhere Frequenz, mehr Energie.
    explanation: Darum macht UV Sonnenbrand und Radio nicht.

srs:
  cards_from: [frequenz, sprung]
