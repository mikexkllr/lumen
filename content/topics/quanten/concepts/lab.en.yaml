id: sci.quantum.lab
type: concept
title: Quantum lab
summary: Simulate the double slit, tune photons.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Light knocks out electrons
    body: Light can knock electrons out of a metal – but only from a certain colour on. To the right the frequency rises, upwards the energy of the electrons. Drag the **work function** of the metal.
    visual:
      widget: slider
      interactive: true
      params:
        expr: 0.414*x - w
        x:
          - 0
          - 15
        y:
          - 0
          - 4
        sliders:
          - id: w
            label: Work function (eV)
            min: 1
            max: 5
            step: 0.5
            initial: 2.5

  - kind: problem
    id: doppelspalt
    widget: distribution
    prompt: Send at least 200 electrons one by one through the double slit and watch where they land on the screen.
    params:
      items: [{ label: "−3", weight: 3 }, { label: "−2", weight: 0.3 }, { label: "−1", weight: 6 }, { label: "0", weight: 10 }, { label: "1", weight: 6 }, { label: "2", weight: 0.3 }, { label: "3", weight: 3 }]
    check: { predicate: "draws >= 200" }
    hints:
      - Send many at once.
    explanation: Bright and dark stripes, an interference pattern, even though each electron came alone.

  - kind: problem
    id: frequenz
    widget: slider
    prompt: Set the wave to double the frequency. Then each photon has twice the energy.
    params:
      expr: "sin(f*x)"
      x: [0, 6]
      y: [-2, 2]
      showCoordinates: false
      sliders: [{ id: f, label: Frequency, min: 1, max: 6, step: 1, initial: 2 }]
      target: { expr: "sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - Twice as many oscillations over the same distance.
    explanation: Frequency 4 instead of 2. Each photon carries twice the energy.

  - kind: problem
    id: sprung
    widget: numberline
    prompt: An electron jumps from 5 eV to 2 eV. Mark the energy of the emitted photon.
    params: { min: 0, max: 5, ticks: 1, labels: integers }
    answer: { value: 3 }
    hints:
      - The difference between the levels.
    explanation: 5 − 2 = 3 eV. The photon carries exactly the difference.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Order by energy per photon, smallest first.
    params:
      items:
        - { label: Radio wave }
        - { label: Red light }
        - { label: Blue light }
        - { label: UV light }
    hints:
      - Higher frequency, more energy.
    explanation: That is why UV causes sunburn and radio does not.

  - kind: problem
    id: ph-d1
    depth: 2
    widget: buckets
    prompt: Wave or particle – what does this experiment mainly show?
    params:
      buckets:
        - id: b1
          label: wave
        - id: b2
          label: particle
      items:
        - label: Double-slit fringes
          bucket: b1
        - label: Soap-bubble colours
          bucket: b1
        - label: Electrons on a crystal
          bucket: b1
        - label: Photoelectric effect
          bucket: b2
        - label: Detector clicks
          bucket: b2
        - label: Compton collision
          bucket: b2
    hints:
      - Superposition and fringes are typical of waves.
      - Portions, clicks and collisions are typical of particles.
    explanation: "Light and electrons show both – depending on the experiment. That is wave–particle duality. In the double slit with single particles you even see both at once: clicks that build fringes."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numberline
    prompt: "Green light has 500 nm. Mark the energy of one photon: E in eV = 1240 ÷ 500."
    params:
      min: 0
      max: 4
      ticks: 4
      labels: decimals
    answer:
      value: 2.5
      tolerance: 0.05
    hints:
      - 1240 ÷ 500 ≈ 2.5.
      - Halfway between 2 and 3 is 2.5.
    explanation: 2.48 eV – about 2.5. Visible light lies roughly between 1.7 eV (red) and 3.1 eV (violet).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux what is so strange about the double-slit experiment.
    params:
      keywords:
        - - welle
          - wave
          - muster
          - streifen
          - pattern
          - stripe
          - interferenz
          - interference
        - - teilchen
          - einzeln
          - particle
          - single
          - elektron
          - electron
        - - mess
          - misst
          - beobacht
          - measur
          - observ
          - hinseh
          - look
      sample: Single particles such as electrons build up a stripe pattern as if they were waves passing through both slits. But as soon as you measure which slit they take, the pattern vanishes.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: In a box of length L only standing waves with $L = n \cdot \frac{\lambda}{2}$ fit. With $p = h/\lambda$ this gives $E_n = n^2 \cdot E_1$. This **quantisation** explains why confined particles have only fixed energies.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: An electron sits in a tiny box. Its lowest state has E₁ = 1 eV. What energy does the third state have?
    params:
      unit: eV
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 3
        misconception: linear-n
        text: The energy grows with n², not with n.
    hints:
      - E_n = n² · E₁.
      - 3² · 1 eV = ?
    explanation: 9 eV. The smaller the box, the larger E₁. That is how the colour of quantum dots is tuned by size alone – used in some TVs.
    difficulty: 3

srs:
  cards_from: [frequenz, sprung]
