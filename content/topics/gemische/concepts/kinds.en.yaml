id: chem.mixtures.kinds
type: concept
title: Pure substance or mixture?
summary: What things are made of.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pure or mixed?
    body: "Each cell is a particle. Right now they are all the same: a **pure substance**. Tap a few cells – they turn into a second kind. When does it become a mixture?"
    visual:
      widget: pixels
      interactive: true
      params:
        cells:
          - "#####"
          - "#####"
          - "#####"
          - "#####"
          - "#####"
        shades: 3

  - kind: problem
    id: hook
    widget: choice
    prompt: Which of these is a single pure substance?
    params:
      options:
        - label: Distilled water
          correct: true
        - label: Sea water
          feedback: Salt is dissolved in it.
        - label: Air
          feedback: Air consists of several gases.
    hints:
      - Which holds only one kind of particle?
    explanation: Almost everything around us is a mixture.

  - kind: explain
    id: s1
    body: |
      A **pure substance** has the same composition everywhere and fixed properties – such as a fixed boiling point. A **mixture** consists of several substances that you can separate again.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Pure substance or mixture?
    params:
      buckets: [{ label: Pure substance }, { label: Mixture }]
      items:
        - { label: Distilled water, bucket: Pure substance }
        - { label: Gold, bucket: Pure substance }
        - { label: Table salt, bucket: Pure substance }
        - { label: Seawater, bucket: Mixture }
        - { label: Air, bucket: Mixture }
        - { label: Muesli, bucket: Mixture }
    hints:
      - Can you split it into different substances without a reaction?
    explanation: Seawater is water plus salt – separable by evaporating.

  - kind: problem
    id: luft
    widget: numeric
    prompt: Air is 78% nitrogen and 21% oxygen. What percent is left for everything else?
    params: { unit: "%" }
    answer: { value: 1 }
    hints:
      - 100 − 78 − 21.
    explanation: About 1% – mostly argon, plus a little CO₂.

  - kind: problem
    id: sichtbar
    widget: choice
    prompt: Salt water looks completely uniform. Is it still a mixture?
    params:
      options:
        - { label: Yes – the salt is just dissolved., correct: true }
        - { label: No – you only see one liquid., feedback: "Dissolved substances are invisible but present – evaporating shows it." }
    hints:
      - What is left when the water evaporates?
    explanation: Mixtures that look uniform are called **homogeneous**, visibly mixed ones **heterogeneous**.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Distilled water
          right: true
        - text: Tap water
          right: false
          why: It contains dissolved minerals and gases.
        - text: Gold (24 carat)
          right: true
        - text: Milk
          right: false
        - text: Air
          right: false
      left: Mixture
      right: Pure substance

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: How can you tell in the lab whether a clear liquid is a pure substance?
    params:
      options:
        - label: It boils at exactly one fixed temperature
          correct: true
        - label: It is transparent
          feedback: Salt water is clear too.
        - label: It has no smell
          feedback: Many mixtures are odourless.
    hints:
      - Pure substances have fixed properties.
    explanation: A mixture boils over a temperature range because its composition changes meanwhile.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: match
    prompt: Visible mixtures have names of their own. Which fits?
    params:
      pairs:
        - left: Muddy water
          right: solid in liquid (suspension)
        - left: Milk
          right: liquid in liquid (emulsion)
        - left: Smoke
          right: solid in gas
        - left: Fog
          right: liquid in gas
        - left: Whipped cream
          right: gas in liquid (foam)
    hints:
      - "Ask yourself: what is spread out – and in what?"
      - Milk holds tiny droplets of fat.
    explanation: The name tells you which state is spread through which. Foam is air in a liquid, fog is droplets in air.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: A substance does not melt at one fixed temperature but slowly between 30 and 36 °C. What do you conclude?
    params:
      options:
        - label: It is a mixture
          correct: true
        - label: It is a pure substance
          feedback: Pure substances melt at exactly one temperature.
        - label: The thermometer is broken
          feedback: No – this behaviour is typical, for example for chocolate.
    hints:
      - How does pure ice melt?
      - Ice melts at exactly 0 °C.
    explanation: A melting range gives away a mixture. Chocolate contains several fats that melt at different temperatures.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Air contains 21% oxygen. How many litres of oxygen are in {{v}} litres of air?
    params:
      unit: L
    answer:
      value: "{{21 * v / 100}}"
    hints:
      - 21% means 21 out of 100.
      - Work out {{v}} · 0.21.
    explanation: "{{v}} L · 0.21 = {{21 * v / 100}} L of oxygen."
    difficulty: 2
    variants:
      params:
        v: step[100,1000,100]
      defaults:
        v: 500

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Brass is a mixture of copper and zinc – solid and completely uniform. What is that called?
    params:
      options:
        - label: Alloy
          correct: true
        - label: Compound
          feedback: In a compound the ratio would be fixed. In brass it can vary.
        - label: Suspension
          feedback: That is solid particles floating in a liquid.
    hints:
      - Bronze, steel and brass belong to it.
    explanation: An **alloy** is a solid solution. It is often harder than its components.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Some mixtures look clear yet contain particles of 1 to 1000 nanometres. They never settle, but they scatter light. Such mixtures are called **colloids**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: You shine a laser pointer through diluted milk and through salt water. Where can you see the beam inside the glass?
    params:
      options:
        - label: Only in the milk
          correct: true
        - label: Only in the salt water
          feedback: Dissolved ions are far too small to scatter light.
        - label: Equally in both
          feedback: Only larger particles scatter light sideways.
    hints:
      - The beam becomes visible when particles deflect light sideways.
      - Fat droplets are much bigger than ions.
    explanation: "This is the Tyndall effect: colloids like milk or fog scatter light, true solutions do not."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Iron powder and sulfur can be separated with a magnet. After heating, this no longer works. Why?
    params:
      options:
        - label: "A compound has formed: iron sulfide"
          correct: true
        - label: The magnet got hot
          feedback: Even a cold magnet pulls nothing out any more.
        - label: The iron evaporated
          feedback: Iron only boils at around 2860 °C.
    hints:
      - Mixtures are easy to separate, compounds are not.
      - When heated, the mixture keeps glowing on its own.
    explanation: Fe + S → FeS. In iron sulfide the atoms are firmly bonded – with new properties.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how you can tell a pure substance from a mixture in the lab.
    params:
      keywords:
        - - siede
          - schmelz
          - boil
          - melt
        - - fest
          - genau
          - eine temperatur
          - exact
          - one temperature
          - fixed
        - - bereich
          - range
          - trenn
          - separat
          - mehrere
          - several
      sample: A pure substance boils and melts at one exact, fixed temperature. A mixture melts over a range and can be separated into several substances.
    explanation: A fixed boiling and melting point means a pure substance. A range means a mixture.
    difficulty: 3

srs:
  cards_from: [sortieren, sichtbar]
