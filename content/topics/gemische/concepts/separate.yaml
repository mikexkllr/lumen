id: chem.mixtures.separate
type: concept
title: Gemische trennen
summary: Filtern, eindampfen, sortieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Sand ist ins Wasser gefallen. Wie holst du ihn am einfachsten wieder heraus?
    params:
      options:
        - label: Durch einen Filter gießen
          correct: true
        - label: Mit einem Magneten
          feedback: Sand ist nicht magnetisch.
        - label: Umrühren
          feedback: Dann verteilt er sich nur.
    hints:
      - Sandkörner sind viel größer als Wasserteilchen.
    explanation: "Du hast einen Unterschied genutzt: die Größe."

  - kind: explain
    id: s1
    body: |
      Gemische trennt man, indem man einen **Unterschied** nutzt: Größe, Siedepunkt, Dichte oder Magnetismus. Jedes Verfahren nutzt genau einen davon.

  - kind: problem
    id: verfahren
    widget: match
    prompt: Welches Verfahren trennt das Gemisch?
    params:
      pairs:
        - { left: Sand und Wasser, right: Filtrieren }
        - { left: Salzwasser, right: Eindampfen }
        - { left: Eisenspäne und Sand, right: Magnet }
        - { left: Öl und Wasser, right: Abschöpfen }
    hints:
      - Welcher Unterschied lässt sich jeweils nutzen?
    explanation: Größe, Siedepunkt, Magnetismus, Dichte – je ein Unterschied, je ein Verfahren.

  - kind: problem
    id: meer
    widget: numeric
    prompt: Ein Liter Meerwasser enthält etwa 35 g Salz. Wie viel Salz bleibt nach dem Eindampfen von {{l}} Litern?
    params: { unit: g }
    answer: { value: "{{35 * l}}" }
    hints:
      - "35 · {{l}}."
    explanation: "{{35 * l}} g – so gewinnen Salinen seit Jahrtausenden Salz."
    variants:
      params: { l: "int[2,10]" }
      defaults: { l: 4 }

  - kind: problem
    id: kaffee
    widget: choice
    prompt: Welches Trennverfahren steckt in einer Kaffeemaschine?
    params:
      options:
        - { label: Filtrieren und Lösen, correct: true }
        - { label: Destillieren, feedback: "Es wird nichts verdampft und wieder aufgefangen." }
    hints:
      - Was hält der Filter zurück, was geht hindurch?
    explanation: Heißes Wasser löst Aromen heraus, der Filter hält das Pulver zurück.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Sand aus Wasser filtern
          right: true
        - text: Salz aus Salzwasser filtern
          right: false
          why: Gelöste Teilchen sind viel kleiner als die Poren.
        - text: Eisenspäne mit einem Magneten aus Sand holen
          right: true
        - text: Öl von Wasser abschöpfen
          right: true
      left: Klappt nicht
      right: Klappt

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Filzstiftpunkt auf Filterpapier wird mit Wasser getränkt. Die Farbe läuft in mehrere bunte Flecken auseinander. Was zeigt das?
    params:
      options:
        - label: Die Farbe ist ein Gemisch – die Farbstoffe wandern verschieden schnell
          correct: true
        - label: Das Wasser färbt das Papier
          feedback: Wasser ist farblos.
        - label: Der Farbstoff zersetzt sich
          feedback: Er wird getrennt, nicht zerstört.
    hints:
      - Manche Farbstoffe haften stärker am Papier als andere.
    explanation: "**Chromatografie** – so weisen Labore Doping und Schadstoffe nach."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie macht eine Entsalzungsanlage aus Meerwasser Trinkwasser, ohne es zu kochen?
    params:
      options:
        - label: Sie presst es mit hohem Druck durch eine Membran, die nur Wasser durchlässt
          correct: true
        - label: Sie filtert das Salz mit feinem Sand heraus
          feedback: Gelöstes Salz geht durch jeden Sandfilter.
        - label: Sie gibt einen Stoff zu, der Salz neutralisiert
          feedback: Salz ist bereits neutral.
    hints:
      - Das Verfahren heißt Umkehrosmose.
    explanation: "**Umkehrosmose** braucht etwa 60 bar – aber viel weniger Energie als Verdampfen."
    difficulty: 3

srs:
  cards_from: [verfahren, kaffee]
