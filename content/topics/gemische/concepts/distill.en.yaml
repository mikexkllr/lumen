id: chem.mixtures.distill
type: concept
title: Distilling
summary: Separating by boiling point.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You boil salt water until all the water has evaporated. What is left in the pot?
    params:
      options:
        - label: The salt
          correct: true
        - label: Nothing
          feedback: Salt does not evaporate at this heat.
        - label: Fresh water
          feedback: The water is gone.
    hints:
      - What evaporates at 100 °C – and what does not?
    explanation: And if you catch the steam, you have pure water.


  - kind: explain
    id: s1
    body: |
      In **distillation**, you heat a liquid mixture. The substance with the lower boiling point evaporates first. It turns liquid again in the condenser. Then you collect it separately.

  - kind: problem
    id: zuerst
    widget: choice
    prompt: Alcohol boils at 78 °C, water at 100 °C. What evaporates first when you heat wine?
    params:
      options:
        - { label: Mostly the alcohol, correct: true }
        - { label: Mostly the water, feedback: "Water needs the higher temperature." }
    hints:
      - Which one has the lower boiling point?
    explanation: This is how spirits are made – the alcohol gets concentrated.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the steps of a distillation in the right order.
    params:
      items:
        - { label: Heat the mixture }
        - { label: The lower-boiling substance evaporates }
        - { label: The vapor cools in the condenser }
        - { label: The liquid is collected }
    hints:
      - From the flask through the condenser to the receiver.
    explanation: Evaporating and condensing – two changes of state, one separation.

  - kind: problem
    id: erdoel
    widget: choice
    prompt: How does a refinery separate crude oil into gasoline, diesel and heating oil?
    params:
      options:
        - { label: By distillation at different boiling ranges, correct: true }
        - { label: By filtering, feedback: "The components are dissolved – a filter does not help." }
    hints:
      - Short chains boil earlier than long ones.
    explanation: In a tall tower, the components collect at different heights.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wine has 12% alcohol. How many millilitres of pure alcohol are in a 750 ml bottle?
    params:
      unit: ml
    answer:
      value: 90
    hints:
      - 12% of 750.
    explanation: 0.12 · 750 = 90 ml.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: By simple distillation you never get alcohol purer than 96%. Why?
    params:
      options:
        - label: At 96% alcohol and water evaporate in the same ratio as in the liquid
          correct: true
        - label: The apparatus is not tight enough
          feedback: Even perfect equipment hits this limit.
        - label: Pure alcohol decomposes at once
          feedback: It is stable – just not reachable by distilling.
    hints:
      - Distilling only works if vapour and liquid differ in composition.
    explanation: Such a mixture is called an **azeotrope**. It boils like a pure substance.
    difficulty: 3

srs:
  cards_from: [zuerst, erdoel]
