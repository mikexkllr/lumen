id: chem.mixtures.distill
type: concept
title: Distilling
summary: Separating by boiling point.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You boil salt water until all the water has evaporated. What is left in the pot?
    params:
      options:
        - label: The salt
          correct: true
        - label: Nothing
          feedback: Salt does not evaporate at this heat.
        - label: Fresh water
          feedback: The water is gone.
    hints:
      - What evaporates at 100 °C – and what does not?
    explanation: And if you catch the steam, you have pure water.

  - kind: explain
    id: s1
    body: |
      In **distillation**, you heat a liquid mixture. The substance with the lower boiling point evaporates first. It turns liquid again in the condenser. Then you collect it separately.

  - kind: problem
    id: zuerst
    widget: choice
    prompt: Alcohol boils at 78 °C, water at 100 °C. What evaporates first when you heat wine?
    params:
      options:
        - { label: Mostly the alcohol, correct: true }
        - { label: Mostly the water, feedback: "Water needs the higher temperature." }
    hints:
      - Which one has the lower boiling point?
    explanation: This is how spirits are made – the alcohol gets concentrated.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the steps of a distillation in the right order.
    params:
      items:
        - { label: Heat the mixture }
        - { label: The lower-boiling substance evaporates }
        - { label: The vapor cools in the condenser }
        - { label: The liquid is collected }
    hints:
      - From the flask through the condenser to the receiver.
    explanation: Evaporating and condensing – two changes of state, one separation.

  - kind: problem
    id: erdoel
    widget: choice
    prompt: How does a refinery separate crude oil into gasoline, diesel and heating oil?
    params:
      options:
        - { label: By distillation at different boiling ranges, correct: true }
        - { label: By filtering, feedback: "The components are dissolved – a filter does not help." }
    hints:
      - Short chains boil earlier than long ones.
    explanation: In a tall tower, the components collect at different heights.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The substance with the [[lower]] boiling point evaporates first. In the [[condenser]] it turns liquid again.
      distractors:
        - higher
        - filter

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wine has 12% alcohol. How many millilitres of pure alcohol are in a 750 ml bottle?
    params:
      unit: ml
    answer:
      value: 90
    hints:
      - 12% of 750.
    explanation: 0.12 · 750 = 90 ml.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: order
    prompt: In a refinery, hot crude-oil vapour rises up a tower. Order what is collected from top to bottom.
    params:
      items:
        - label: Refinery gas (propane, butane)
        - label: Petrol
        - label: Kerosene
        - label: Diesel
        - label: Heavy fuel oil
        - label: Bitumen
      startLabel: top (cool)
      endLabel: bottom (hot)
    hints:
      - The top is cool – only low-boiling substances get there.
      - Short chains boil early, long ones late.
    explanation: Each level collects substances with a similar boiling range. Bitumen for roads stays at the very bottom.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: From {{v}} litres of mash with {{p}}% alcohol, the alcohol is distilled off. At most how many litres of pure alcohol do you get?
    params:
      unit: L
    answer:
      value: "{{v * p / 100}}"
    hints:
      - Distilling only separates – it does not make alcohol.
      - Work out {{p}}% of {{v}} L.
    explanation: "{{v}} · {{p}} ÷ 100 = {{v * p / 100}} L. You cannot get out more than was in there."
    difficulty: 2
    variants:
      params:
        v: step[10,50,10]
        p: choice[5,8,10]
      defaults:
        v: 20
        p: 8

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Water boils at 100 °C, ethanol at 78 °C. When distilling wine, when do you swap the collecting flask?
    params:
      options:
        - label: When the temperature at the top climbs clearly above 78 °C
          correct: true
        - label: Right at the start
          feedback: The start is exactly when the most alcohol-rich part comes over.
        - label: Only at 120 °C
          feedback: By then all the water would have come over.
    hints:
      - The thermometer shows which vapour is rising right now.
      - As the temperature rises towards 100 °C, more water comes over.
    explanation: While the temperature stays near 78 °C, mostly alcohol comes over. After that the share of water rises.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: By simple distillation you never get alcohol purer than 96%. Why?
    params:
      options:
        - label: At 96% alcohol and water evaporate in the same ratio as in the liquid
          correct: true
        - label: The apparatus is not tight enough
          feedback: Even perfect equipment hits this limit.
        - label: Pure alcohol decomposes at once
          feedback: It is stable – just not reachable by distilling.
    hints:
      - Distilling only works if vapour and liquid differ in composition.
    explanation: Such a mixture is called an **azeotrope**. It boils like a pure substance.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: estimate
    prompt: "Take a guess: at what temperature in Celsius does water boil on the summit of Mount Everest?"
    params:
      min: 40
      max: 110
      unit: °C
    answer:
      value: 70
      tolerance: 5
    explanation: At about 70 °C, because the air pressure up there is only about a third. Pasta hardly cooks.
    difficulty: 3

  - kind: explain
    id: ch-x2
    depth: 3
    body: The boiling point depends on pressure. Lower the pressure and a substance boils at a lower temperature. This is what **vacuum distillation** uses.

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Why do people distil the scent of flowers at low pressure?
    params:
      options:
        - label: They then boil at a low temperature and do not break down
          correct: true
        - label: They smell stronger in a vacuum
          feedback: The scent itself does not change.
        - label: Without air they need no condenser
          feedback: You still have to cool them.
    hints:
      - Many fragrances break down at high heat.
      - Less pressure, lower boiling point.
    explanation: That keeps the molecules intact. Sugar syrup and medicines are often purified under vacuum too.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how boiling can split alcohol from water.
    params:
      keywords:
        - - siede
          - boil
        - - verdampf
          - dampf
          - vapour
          - vapor
          - evaporat
        - - kühl
          - kondens
          - cool
          - condens
        - - "78"
          - früher
          - zuerst
          - first
          - lower
          - niedriger
      sample: Alcohol boils at 78 °C, water only at 100 °C. When heated, mostly the alcohol evaporates first. The vapour is condensed in a cooler and collected separately.
    explanation: The difference in boiling points makes the separation possible.
    difficulty: 3

srs:
  cards_from: [zuerst, erdoel]
