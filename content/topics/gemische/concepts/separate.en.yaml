id: chem.mixtures.separate
type: concept
title: Separating mixtures
summary: Filtering, evaporating, sorting.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Sand has fallen into water. What is the easiest way to get it out?
    params:
      options:
        - label: Pour it through a filter
          correct: true
        - label: With a magnet
          feedback: Sand is not magnetic.
        - label: Stir
          feedback: Then it only spreads.
    hints:
      - Grains of sand are far bigger than water particles.
    explanation: "You used a difference: size."

  - kind: explain
    id: s1
    body: |
      You separate mixtures by using a **difference**: size, boiling point, density or magnetism. Each method uses exactly one of them.

  - kind: problem
    id: verfahren
    widget: match
    prompt: Which method separates the mixture?
    params:
      pairs:
        - { left: Sand and water, right: Filtering }
        - { left: Salt water, right: Evaporating }
        - { left: Iron filings and sand, right: Magnet }
        - { left: Oil and water, right: Skimming }
    hints:
      - Which difference can you use in each case?
    explanation: Size, boiling point, magnetism, density – one difference, one method each.

  - kind: problem
    id: meer
    widget: numeric
    prompt: One liter of seawater contains about 35 g of salt. How much salt is left after evaporating {{l}} liters?
    params: { unit: g }
    answer: { value: "{{35 * l}}" }
    hints:
      - "35 · {{l}}."
    explanation: "{{35 * l}} g – this is how salt works have harvested salt for thousands of years."
    variants:
      params: { l: "int[2,10]" }
      defaults: { l: 4 }

  - kind: problem
    id: kaffee
    widget: choice
    prompt: Which separation method is inside a coffee maker?
    params:
      options:
        - { label: Filtering and dissolving, correct: true }
        - { label: Distilling, feedback: "Nothing is evaporated and collected again." }
    hints:
      - What does the filter hold back, and what passes through?
    explanation: Hot water dissolves the flavors, and the filter holds back the grounds.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Filtering sand out of water
          right: true
        - text: Filtering salt out of salt water
          right: false
          why: Dissolved particles are far smaller than the pores.
        - text: Pulling iron filings out of sand with a magnet
          right: true
        - text: Skimming oil off water
          right: true
      left: Fails
      right: Works

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A felt-tip dot on filter paper is soaked with water. The colour runs apart into several coloured spots. What does that show?
    params:
      options:
        - label: The colour is a mixture – the dyes travel at different speeds
          correct: true
        - label: The water dyes the paper
          feedback: Water is colourless.
        - label: The dye decomposes
          feedback: It is separated, not destroyed.
    hints:
      - Some dyes cling to the paper more strongly than others.
    explanation: "**Chromatography** – this is how labs detect doping and pollutants."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: order
    prompt: Sand, salt and iron filings are mixed up. Put the steps in order to separate all three.
    params:
      items:
        - label: Pull out the iron with a magnet
        - label: Add water and stir – the salt dissolves
        - label: Filter – the sand stays in the filter
        - label: Evaporate the solution – the salt is left behind
    hints:
      - The iron is best removed while dry.
      - First dissolve, then filter, then evaporate.
    explanation: "Each step uses a different property: magnetism, solubility, particle size, boiling point."
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Which difference does the method use?
    params:
      buckets:
        - id: b1
          label: Particle size
        - id: b2
          label: Boiling point
        - id: b3
          label: Density
        - id: b4
          label: Magnetism
      items:
        - label: Filtering
          bucket: b1
        - label: Sieving
          bucket: b1
        - label: Distilling
          bucket: b2
        - label: Evaporating
          bucket: b2
        - label: Letting it settle
          bucket: b3
        - label: Centrifuging
          bucket: b3
        - label: Magnetic separator
          bucket: b4
    hints:
      - Whatever lets heavy things sink uses density.
      - Anything using heat uses the boiling point.
    explanation: "A centrifuge is settling on fast-forward: it boosts the density difference a thousandfold."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Blood is spun in a centrifuge. What collects at the very bottom of the tube?
    params:
      options:
        - label: The red blood cells
          correct: true
        - label: The blood plasma
          feedback: The liquid plasma is lighter and floats on top.
        - label: Nothing – blood is a solution
          feedback: Blood contains cells, so solid particles.
    hints:
      - Whatever is densest ends up at the bottom.
      - Cells full of haemoglobin are denser than water.
    explanation: Red blood cells at the bottom, a thin layer of white cells above, and yellowish plasma on top.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How can a plant turn seawater into drinking water without boiling it?
    params:
      options:
        - label: It presses it at high pressure through a membrane that only lets water pass
          correct: true
        - label: It filters the salt out with fine sand
          feedback: Dissolved salt passes through any sand filter.
        - label: It adds a substance that neutralises salt
          feedback: Salt is already neutral.
    hints:
      - The process is called reverse osmosis.
    explanation: "**Reverse osmosis** needs about 60 bar – but far less energy than evaporation."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: In **chromatography** a solvent carries a mixture across paper. Dyes that cling strongly to the paper travel slowly. Others race ahead with the solvent.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: "A dye travels {{a}} cm, the solvent {{b}} cm. Work out the Rf value: distance of the dye divided by distance of the solvent."
    answer:
      value: "{{a / b}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - b / a) < 0.01
        misconception: rf-inverted
        text: "The other way round: dye divided by solvent. Rf is always between 0 and 1."
    hints:
      - The dye can never get further than the solvent.
      - Work out {{a}} ÷ {{b}}.
    explanation: Rf = {{a}} ÷ {{b}} = {{a / b}}. Under the same conditions every substance has its own Rf value – like a fingerprint.
    difficulty: 3
    variants:
      params:
        a: int[1,4]
        b: choice[5,10]
      defaults:
        a: 3
        b: 5

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Two dyes have the same Rf value on paper with water. What is the best next step?
    params:
      options:
        - label: Repeat with a different solvent
          correct: true
        - label: They must be the same substance
          feedback: The same Rf in one solvent can be a coincidence.
        - label: Wait longer
          feedback: The Rf value is a ratio – it does not change with time.
    hints:
      - Rf depends on the substance and on the solvent.
      - A second test under other conditions might still separate them.
    explanation: Only when two substances run the same in several solvents are they probably identical. Forensic labs work the same way.
    difficulty: 3

srs:
  cards_from: [verfahren, kaffee]
