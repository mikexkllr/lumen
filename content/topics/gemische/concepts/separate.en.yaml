id: chem.mixtures.separate
type: concept
title: Separating mixtures
summary: Filtering, evaporating, sorting.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Sand has fallen into water. What is the easiest way to get it out?
    params:
      options:
        - label: Pour it through a filter
          correct: true
        - label: With a magnet
          feedback: Sand is not magnetic.
        - label: Stir
          feedback: Then it only spreads.
    hints:
      - Grains of sand are far bigger than water particles.
    explanation: "You used a difference: size."

  - kind: explain
    id: s1
    body: |
      You separate mixtures by using a **difference**: size, boiling point, density or magnetism. Each method uses exactly one of them.

  - kind: problem
    id: verfahren
    widget: match
    prompt: Which method separates the mixture?
    params:
      pairs:
        - { left: Sand and water, right: Filtering }
        - { left: Salt water, right: Evaporating }
        - { left: Iron filings and sand, right: Magnet }
        - { left: Oil and water, right: Skimming }
    hints:
      - Which difference can you use in each case?
    explanation: Size, boiling point, magnetism, density – one difference, one method each.

  - kind: problem
    id: meer
    widget: numeric
    prompt: One liter of seawater contains about 35 g of salt. How much salt is left after evaporating {{l}} liters?
    params: { unit: g }
    answer: { value: "{{35 * l}}" }
    hints:
      - "35 · {{l}}."
    explanation: "{{35 * l}} g – this is how salt works have harvested salt for thousands of years."
    variants:
      params: { l: "int[2,10]" }
      defaults: { l: 4 }

  - kind: problem
    id: kaffee
    widget: choice
    prompt: Which separation method is inside a coffee maker?
    params:
      options:
        - { label: Filtering and dissolving, correct: true }
        - { label: Distilling, feedback: "Nothing is evaporated and collected again." }
    hints:
      - What does the filter hold back, and what passes through?
    explanation: Hot water dissolves the flavors, and the filter holds back the grounds.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Filtering sand out of water
          right: true
        - text: Filtering salt out of salt water
          right: false
          why: Dissolved particles are far smaller than the pores.
        - text: Pulling iron filings out of sand with a magnet
          right: true
        - text: Skimming oil off water
          right: true
      left: Fails
      right: Works

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A felt-tip dot on filter paper is soaked with water. The colour runs apart into several coloured spots. What does that show?
    params:
      options:
        - label: The colour is a mixture – the dyes travel at different speeds
          correct: true
        - label: The water dyes the paper
          feedback: Water is colourless.
        - label: The dye decomposes
          feedback: It is separated, not destroyed.
    hints:
      - Some dyes cling to the paper more strongly than others.
    explanation: "**Chromatography** – this is how labs detect doping and pollutants."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How can a plant turn seawater into drinking water without boiling it?
    params:
      options:
        - label: It presses it at high pressure through a membrane that only lets water pass
          correct: true
        - label: It filters the salt out with fine sand
          feedback: Dissolved salt passes through any sand filter.
        - label: It adds a substance that neutralises salt
          feedback: Salt is already neutral.
    hints:
      - The process is called reverse osmosis.
    explanation: "**Reverse osmosis** needs about 60 bar – but far less energy than evaporation."
    difficulty: 3

srs:
  cards_from: [verfahren, kaffee]
