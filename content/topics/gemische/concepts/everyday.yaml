id: chem.mixtures.everyday
type: concept
title: Gemische im Alltag
summary: Dressing, Schorle, Granit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: art
    widget: buckets
    prompt: Gleichmäßig gemischt oder sichtbar gemischt?
    params:
      buckets: [{ label: homogen }, { label: heterogen }]
      items:
        - { label: Salzwasser, bucket: homogen }
        - { label: Klare Apfelschorle, bucket: homogen }
        - { label: Granit, bucket: heterogen }
        - { label: Müsli, bucket: heterogen }
    hints:
      - Siehst du die Bestandteile?
    explanation: Bei Granit erkennt man Körner verschiedener Mineralien.

  - kind: problem
    id: dressing
    widget: choice
    prompt: Warum muss man Salatdressing vor dem Servieren schütteln?
    params:
      options:
        - { label: Öl und Essig entmischen sich mit der Zeit., correct: true }
        - { label: Damit es kälter wird., feedback: "Es geht um das Entmischen." }
    hints:
      - Mischen sich Öl und Wasser von allein?
    explanation: Geschüttelt entsteht eine **Emulsion** – feine Tröpfchen, die sich langsam wieder trennen.

  - kind: problem
    id: schorle
    widget: numeric
    prompt: Eine Schorle wird 1 zu 3 gemischt – 1 Teil Saft, 3 Teile Wasser. Wie viel Saft steckt in {{v}} ml?
    params: { unit: ml }
    answer: { value: "{{v / 4}}" }
    feedback:
      - when: "numval(state.input) == v / 3"
        misconception: ratio-parts
        text: 1 zu 3 heißt vier Teile insgesamt – der Saft ist ein Viertel.
    hints:
      - Wie viele Teile sind es insgesamt?
    explanation: "{{v}} : 4 = {{v / 4}} ml Saft."
    variants:
      params: { v: "choice[400,800,1000,1200]" }
      defaults: { v: 1000 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Mayonnaise besteht aus Öl und Essig – und trennt sich trotzdem nicht. Warum?
    params:
      options:
        - label: Eigelb enthält einen Emulgator, der Öltröpfchen umhüllt
          correct: true
        - label: Weil sie gekühlt wird
          feedback: Kälte verlangsamt, verhindert aber nicht.
        - label: Öl und Essig reagieren miteinander
          feedback: Sie bleiben chemisch getrennt, nur fein verteilt.
    hints:
      - Ein Molekül mit einem wasserliebenden und einem fettliebenden Ende.
    explanation: Lecithin hält die **Emulsion** stabil – nach demselben Prinzip wie Seife.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen einem Gemisch und einer Verbindung.
    params:
      keywords:
        - - trenn
          - separat
          - filter
          - physikalisch
          - physical
        - - bindung
          - gebunden
          - bond
          - bound
          - reaktion
          - reaction
          - chemisch
          - chemical
        - - eigenschaft
          - propert
          - neu
          - new
      sample: In einem Gemisch liegen die Stoffe nur nebeneinander und lassen sich physikalisch trennen, etwa durch Filtern. In einer Verbindung sind die Atome chemisch gebunden und haben neue Eigenschaften.
    difficulty: 3

srs:
  cards_from: [art, schorle]
