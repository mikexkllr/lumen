id: chem.mixtures.everyday
type: concept
title: Gemische im Alltag
summary: Dressing, Schorle, Granit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alles gemischt
    body: "Fast nichts um dich herum ist ein reiner Stoff. Selbst in Wolken und Schokolade stecken **Gemische**. Deck die Karten auf und rate vorher: Was ist darin vermischt?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌫️
            front: Nebel
            back: Winzige Wassertropfen schweben in der Luft – ein Gemisch, das du einatmest.
          - icon: 🍦
            front: Schlagsahne
            back: Fast die Hälfte davon ist Luft, eingefangen in Fett und Wasser.
          - icon: 🩸
            front: Blut
            back: Rote Zellen schwimmen in gelblichem Plasma. In der Zentrifuge trennen sie sich.
          - icon: 🍫
            front: Schokolade
            back: Kakao, Zucker, Fett und oft Milch – ein festes Gemisch, das im Mund schmilzt.

  - kind: problem
    id: ch-hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent von Kuhmilch sind Wasser?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 87
      tolerance: 4
    explanation: Rund 87 %. Der Rest sind Fett, Eiweiß, Milchzucker und Mineralstoffe – fein verteilt.

  - kind: problem
    id: art
    widget: buckets
    prompt: Gleichmäßig gemischt oder sichtbar gemischt?
    params:
      buckets: [{ label: homogen }, { label: heterogen }]
      items:
        - { label: Salzwasser, bucket: homogen }
        - { label: Klare Apfelschorle, bucket: homogen }
        - { label: Granit, bucket: heterogen }
        - { label: Müsli, bucket: heterogen }
    hints:
      - Siehst du die Bestandteile?
    explanation: Bei Granit erkennt man Körner verschiedener Mineralien.

  - kind: problem
    id: dressing
    widget: choice
    prompt: Warum muss man Salatdressing vor dem Servieren schütteln?
    params:
      options:
        - { label: Öl und Essig entmischen sich mit der Zeit., correct: true }
        - { label: Damit es kälter wird., feedback: "Es geht um das Entmischen." }
    hints:
      - Mischen sich Öl und Wasser von allein?
    explanation: Geschüttelt entsteht eine **Emulsion** – feine Tröpfchen, die sich langsam wieder trennen.

  - kind: problem
    id: schorle
    widget: numeric
    prompt: Eine Schorle wird 1 zu 3 gemischt – 1 Teil Saft, 3 Teile Wasser. Wie viel Saft steckt in {{v}} ml?
    params: { unit: ml }
    answer: { value: "{{v / 4}}" }
    feedback:
      - when: "numval(state.input) == v / 3"
        misconception: ratio-parts
        text: 1 zu 3 heißt vier Teile insgesamt – der Saft ist ein Viertel.
    hints:
      - Wie viele Teile sind es insgesamt?
    explanation: "{{v}} : 4 = {{v / 4}} ml Saft."
    variants:
      params: { v: "choice[400,800,1000,1200]" }
      defaults: { v: 1000 }

  - kind: problem
    id: ch-c1
    widget: choice
    prompt: Bei Orangensaft mit Fruchtfleisch steht »Vor Gebrauch schütteln«. Warum?
    params:
      options:
        - label: Das Fruchtfleisch sinkt mit der Zeit nach unten
          correct: true
        - label: Der Saft wird sonst sauer
          feedback: Schütteln ändert den Geschmack nicht.
        - label: Damit sich der Zucker löst
          feedback: Der Zucker ist längst gelöst.
    hints:
      - Fruchtstücke sind fest und schwerer als Saft.
      - Feste Teilchen in Flüssigkeit setzen sich ab.
    explanation: "Saft mit Fruchtfleisch ist eine **Suspension**: Feste Teilchen schweben nur, bis sie sich absetzen."

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: "Eine Schorle wird 1 zu 2 gemischt: 1 Teil Saft, 2 Teile Wasser. Teile das Glas passend ein und färbe den Saft."
    params:
      parts: 2
      shape: bar
      partOptions:
        - 2
        - 3
        - 4
        - 6
    answer:
      fraction: 1/3
    hints:
      - "Zähl zuerst alle Teile zusammen: Saft und Wasser."
      - Teile das Glas in 3 gleiche Teile und färbe einen davon.
    explanation: "Drei Teile insgesamt, einer davon ist Saft: $\\frac{1}{3}$. »1 zu 2« heißt also nicht die Hälfte."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Mayonnaise besteht aus Öl und Essig – und trennt sich trotzdem nicht. Warum?
    params:
      options:
        - label: Eigelb enthält einen Emulgator, der Öltröpfchen umhüllt
          correct: true
        - label: Weil sie gekühlt wird
          feedback: Kälte verlangsamt, verhindert aber nicht.
        - label: Öl und Essig reagieren miteinander
          feedback: Sie bleiben chemisch getrennt, nur fein verteilt.
    hints:
      - Ein Molekül mit einem wasserliebenden und einem fettliebenden Ende.
    explanation: Lecithin hält die **Emulsion** stabil – nach demselben Prinzip wie Seife.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Lösung, Emulsion oder Suspension?
    params:
      buckets:
        - id: b1
          label: Lösung
        - id: b2
          label: Emulsion
        - id: b3
          label: Suspension
      items:
        - label: Salzwasser
          bucket: b1
        - label: Tee mit Zucker
          bucket: b1
        - label: Milch
          bucket: b2
        - label: Mayonnaise
          bucket: b2
        - label: Schlamm
          bucket: b3
        - label: Kakao mit Pulver am Boden
          bucket: b3
    hints:
      - "Lösung: völlig klar. Emulsion: Tröpfchen. Suspension: feste Krümel."
      - In Mayonnaise sind Öltröpfchen verteilt.
    explanation: Lösungen setzen sich nie ab, Suspensionen schon. Emulsionen entmischen sich ohne Emulgator.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Dressing besteht aus 3 Teilen Öl und 1 Teil Essig. Wie viele Milliliter Öl brauchst du für {{v}} ml Dressing?
    params:
      unit: ml
    answer:
      value: "{{3 * v / 4}}"
    feedback:
      - when: numval(state.input) == v / 3
        misconception: ratio-parts
        text: Insgesamt sind es 4 Teile, nicht 3.
    hints:
      - 3 + 1 = 4 Teile insgesamt.
      - Ein Teil sind {{v / 4}} ml.
    explanation: "{{v}} : 4 · 3 = {{3 * v / 4}} ml Öl."
    difficulty: 2
    variants:
      params:
        v: step[80,400,40]
      defaults:
        v: 200

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen einem Gemisch und einer Verbindung.
    params:
      keywords:
        - - trenn
          - separat
          - filter
          - physikalisch
          - physical
        - - bindung
          - gebunden
          - bond
          - bound
          - reaktion
          - reaction
          - chemisch
          - chemical
        - - eigenschaft
          - propert
          - neu
          - new
      sample: In einem Gemisch liegen die Stoffe nur nebeneinander und lassen sich physikalisch trennen, etwa durch Filtern. In einer Verbindung sind die Atome chemisch gebunden und haben neue Eigenschaften.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Ein **Emulgator** hat ein wasserliebendes und ein fettliebendes Ende. Er setzt sich zwischen Öl und Wasser und hält die Tröpfchen getrennt. Im Eigelb ist das Lecithin.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Homogenisierte Milch bildet keine Rahmschicht mehr. Was wurde mit ihr gemacht?
    params:
      options:
        - label: Die Fetttröpfchen wurden unter Hochdruck winzig klein zerteilt
          correct: true
        - label: Das Fett wurde entfernt
          feedback: Dann wäre es Magermilch.
        - label: Es wurde Zucker zugesetzt
          feedback: Zucker hält Fett nicht in der Schwebe.
    hints:
      - Fett ist leichter als Wasser und steigt auf.
      - Sehr kleine Tröpfchen steigen kaum noch.
    explanation: Je kleiner ein Tröpfchen, desto langsamer steigt es. Homogenisieren zerteilt sie auf unter einen Mikrometer.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Luft ist ein Gemisch, Wasser eine Verbindung. Woran sieht man das?
    params:
      options:
        - label: Luft lässt sich durch Verflüssigen und Destillieren trennen, Wasser nur durch eine Reaktion
          correct: true
        - label: Luft ist ein Gas, Wasser flüssig
          feedback: Der Zustand verrät nicht, ob Gemisch oder Verbindung.
        - label: Wasser enthält nur eine Atomsorte
          feedback: Wasser enthält Wasserstoff und Sauerstoff.
    hints:
      - Bei einem Gemisch genügt ein physikalisches Verfahren.
      - "Wasser zerlegt man mit Strom: Elektrolyse."
    explanation: Flüssige Luft trennt sich beim Destillieren in Stickstoff und Sauerstoff. Wasser bleibt beim Sieden Wasser.
    difficulty: 3

srs:
  cards_from: [art, schorle]
