id: chem.mixtures.kinds
type: concept
title: Reinstoff oder Gemisch?
summary: Woraus Dinge bestehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Rein oder gemischt?
    body: "Jedes Feld ist ein Teilchen. Noch sind alle gleich: ein **Reinstoff**. Tippe einige Felder an – sie werden zu einer zweiten Sorte. Ab wann ist es ein Gemisch?"
    visual:
      widget: pixels
      interactive: true
      params:
        cells:
          - "#####"
          - "#####"
          - "#####"
          - "#####"
          - "#####"
        shades: 3

  - kind: problem
    id: hook
    widget: choice
    prompt: Was davon ist ein einziger reiner Stoff?
    params:
      options:
        - label: Destilliertes Wasser
          correct: true
        - label: Meerwasser
          feedback: Darin ist Salz gelöst.
        - label: Luft
          feedback: Luft besteht aus mehreren Gasen.
    hints:
      - Worin steckt nur eine Sorte Teilchen?
    explanation: Fast alles um uns herum ist ein Gemisch.

  - kind: explain
    id: s1
    body: |
      Ein **Reinstoff** hat überall dieselbe Zusammensetzung und feste Eigenschaften – etwa einen festen Siedepunkt. Ein **Gemisch** besteht aus mehreren Stoffen, die man wieder trennen kann.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Reinstoff oder Gemisch?
    params:
      buckets: [{ label: Reinstoff }, { label: Gemisch }]
      items:
        - { label: Destilliertes Wasser, bucket: Reinstoff }
        - { label: Gold, bucket: Reinstoff }
        - { label: Kochsalz, bucket: Reinstoff }
        - { label: Meerwasser, bucket: Gemisch }
        - { label: Luft, bucket: Gemisch }
        - { label: Müsli, bucket: Gemisch }
    hints:
      - Kann man es in verschiedene Stoffe zerlegen, ohne eine Reaktion?
    explanation: Meerwasser ist Wasser plus Salz – trennbar durch Verdampfen.

  - kind: problem
    id: luft
    widget: numeric
    prompt: Luft besteht zu 78 % aus Stickstoff und zu 21 % aus Sauerstoff. Wie viel Prozent bleiben für alles andere?
    params: { unit: "%" }
    answer: { value: 1 }
    hints:
      - 100 − 78 − 21.
    explanation: Rund 1 % – vor allem Argon, dazu ein wenig CO₂.

  - kind: problem
    id: sichtbar
    widget: choice
    prompt: Salzwasser sieht völlig gleichmäßig aus. Ist es trotzdem ein Gemisch?
    params:
      options:
        - { label: Ja – das Salz ist nur gelöst., correct: true }
        - { label: Nein – man sieht ja nur eine Flüssigkeit., feedback: "Gelöste Stoffe sind unsichtbar, aber vorhanden – Verdampfen zeigt es." }
    hints:
      - Was bleibt übrig, wenn das Wasser verdunstet?
    explanation: Gleichmäßig aussehende Gemische heißen **homogen**, sichtbar gemischte **heterogen**.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Destilliertes Wasser
          right: true
        - text: Leitungswasser
          right: false
          why: Es enthält gelöste Mineralien und Gase.
        - text: Gold (24 Karat)
          right: true
        - text: Milch
          right: false
        - text: Luft
          right: false
      left: Gemisch
      right: Reinstoff

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Wie erkennt man im Labor, ob eine klare Flüssigkeit ein Reinstoff ist?
    params:
      options:
        - label: Sie siedet bei genau einer festen Temperatur
          correct: true
        - label: Sie ist durchsichtig
          feedback: Salzwasser ist auch klar.
        - label: Sie hat keinen Geruch
          feedback: Viele Gemische sind geruchlos.
    hints:
      - Reinstoffe haben feste Eigenschaften.
    explanation: Ein Gemisch siedet über einen Temperaturbereich, weil sich seine Zusammensetzung dabei ändert.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: match
    prompt: Sichtbare Gemische haben eigene Namen. Was passt?
    params:
      pairs:
        - left: Schlammwasser
          right: fest in flüssig (Suspension)
        - left: Milch
          right: flüssig in flüssig (Emulsion)
        - left: Rauch
          right: fest in Gas
        - left: Nebel
          right: flüssig in Gas
        - left: Schlagsahne
          right: Gas in flüssig (Schaum)
    hints:
      - "Frag dich: Was ist verteilt – und worin?"
      - In Milch schwimmen winzige Fetttröpfchen.
    explanation: Der Name sagt, welcher Zustand in welchem verteilt ist. Schaum ist Luft in Flüssigkeit, Nebel sind Tröpfchen in Luft.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Ein Stoff schmilzt nicht bei einer festen Temperatur, sondern langsam zwischen 30 und 36 °C. Was schließt du?
    params:
      options:
        - label: Es ist ein Gemisch
          correct: true
        - label: Es ist ein Reinstoff
          feedback: Reinstoffe schmelzen bei genau einer Temperatur.
        - label: Das Thermometer ist kaputt
          feedback: Nein – das Verhalten ist typisch, etwa für Schokolade.
    hints:
      - Wie schmilzt reines Eis?
      - Eis schmilzt genau bei 0 °C.
    explanation: Ein Schmelzbereich verrät ein Gemisch. Schokolade enthält mehrere Fette, die verschieden früh schmelzen.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Luft enthält 21 % Sauerstoff. Wie viele Liter Sauerstoff stecken in {{v}} Litern Luft?
    params:
      unit: L
    answer:
      value: "{{21 * v / 100}}"
    hints:
      - 21 % heißt 21 von 100.
      - Rechne {{v}} · 0,21.
    explanation: "{{v}} L · 0,21 = {{21 * v / 100}} L Sauerstoff."
    difficulty: 2
    variants:
      params:
        v: step[100,1000,100]
      defaults:
        v: 500

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Messing ist ein Gemisch aus Kupfer und Zink – fest und völlig gleichmäßig. Wie nennt man das?
    params:
      options:
        - label: Legierung
          correct: true
        - label: Verbindung
          feedback: In einer Verbindung wäre das Verhältnis fest. Bei Messing kann man es variieren.
        - label: Suspension
          feedback: Dort schweben feste Teilchen in einer Flüssigkeit.
    hints:
      - Bronze, Stahl und Messing gehören dazu.
    explanation: Eine **Legierung** ist eine feste Lösung. Sie ist oft härter als ihre Bestandteile.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Manche Gemische sehen klar aus, enthalten aber Teilchen von 1 bis 1000 Nanometer. Sie setzen sich nie ab, streuen aber Licht. Solche Gemische heißen **Kolloide**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Du leuchtest mit einem Laserpointer durch verdünnte Milch und durch Salzwasser. Wo siehst du den Strahl im Glas?
    params:
      options:
        - label: Nur in der Milch
          correct: true
        - label: Nur im Salzwasser
          feedback: Gelöste Ionen sind viel zu klein, um Licht zu streuen.
        - label: In beiden gleich
          feedback: Nur größere Teilchen streuen das Licht zur Seite.
    hints:
      - Sichtbar wird der Strahl, wenn Teilchen Licht zur Seite lenken.
      - Fetttröpfchen sind viel größer als Ionen.
    explanation: "Das ist der Tyndall-Effekt: Kolloide wie Milch oder Nebel streuen Licht, echte Lösungen nicht."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Eisenpulver und Schwefel lassen sich mit einem Magneten trennen. Nach dem Erhitzen klappt das nicht mehr. Warum?
    params:
      options:
        - label: "Es ist eine Verbindung entstanden: Eisensulfid"
          correct: true
        - label: Der Magnet wurde heiß
          feedback: Auch ein kalter Magnet zieht nichts mehr heraus.
        - label: Das Eisen ist verdampft
          feedback: Eisen siedet erst bei rund 2860 °C.
    hints:
      - Gemische lassen sich leicht trennen, Verbindungen nicht.
      - Beim Erhitzen glüht das Gemisch von selbst weiter.
    explanation: Fe + S → FeS. Im Eisensulfid sind die Atome fest gebunden – mit neuen Eigenschaften.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, woran man im Labor einen Reinstoff von einem Gemisch unterscheidet.
    params:
      keywords:
        - - siede
          - schmelz
          - boil
          - melt
        - - fest
          - genau
          - eine temperatur
          - exact
          - one temperature
          - fixed
        - - bereich
          - range
          - trenn
          - separat
          - mehrere
          - several
      sample: Ein Reinstoff siedet und schmilzt bei genau einer festen Temperatur. Ein Gemisch schmilzt über einen Bereich und lässt sich in mehrere Stoffe trennen.
    explanation: Feste Siede- und Schmelztemperatur heißt Reinstoff. Ein Bereich heißt Gemisch.
    difficulty: 3

srs:
  cards_from: [sortieren, sichtbar]
