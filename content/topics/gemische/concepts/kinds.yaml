id: chem.mixtures.kinds
type: concept
title: Reinstoff oder Gemisch?
summary: Woraus Dinge bestehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Was davon ist ein einziger reiner Stoff?
    params:
      options:
        - label: Destilliertes Wasser
          correct: true
        - label: Meerwasser
          feedback: Darin ist Salz gelöst.
        - label: Luft
          feedback: Luft besteht aus mehreren Gasen.
    hints:
      - Worin steckt nur eine Sorte Teilchen?
    explanation: Fast alles um uns herum ist ein Gemisch.

  - kind: explain
    id: s1
    body: |
      Ein **Reinstoff** hat überall dieselbe Zusammensetzung und feste Eigenschaften – etwa einen festen Siedepunkt. Ein **Gemisch** besteht aus mehreren Stoffen, die man wieder trennen kann.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Reinstoff oder Gemisch?
    params:
      buckets: [{ label: Reinstoff }, { label: Gemisch }]
      items:
        - { label: Destilliertes Wasser, bucket: Reinstoff }
        - { label: Gold, bucket: Reinstoff }
        - { label: Kochsalz, bucket: Reinstoff }
        - { label: Meerwasser, bucket: Gemisch }
        - { label: Luft, bucket: Gemisch }
        - { label: Müsli, bucket: Gemisch }
    hints:
      - Kann man es in verschiedene Stoffe zerlegen, ohne eine Reaktion?
    explanation: Meerwasser ist Wasser plus Salz – trennbar durch Verdampfen.

  - kind: problem
    id: luft
    widget: numeric
    prompt: Luft besteht zu 78 % aus Stickstoff und zu 21 % aus Sauerstoff. Wie viel Prozent bleiben für alles andere?
    params: { unit: "%" }
    answer: { value: 1 }
    hints:
      - 100 − 78 − 21.
    explanation: Rund 1 % – vor allem Argon, dazu ein wenig CO₂.

  - kind: problem
    id: sichtbar
    widget: choice
    prompt: Salzwasser sieht völlig gleichmäßig aus. Ist es trotzdem ein Gemisch?
    params:
      options:
        - { label: Ja – das Salz ist nur gelöst., correct: true }
        - { label: Nein – man sieht ja nur eine Flüssigkeit., feedback: "Gelöste Stoffe sind unsichtbar, aber vorhanden – Verdampfen zeigt es." }
    hints:
      - Was bleibt übrig, wenn das Wasser verdunstet?
    explanation: Gleichmäßig aussehende Gemische heißen **homogen**, sichtbar gemischte **heterogen**.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Destilliertes Wasser
          right: true
        - text: Leitungswasser
          right: false
          why: Es enthält gelöste Mineralien und Gase.
        - text: Gold (24 Karat)
          right: true
        - text: Milch
          right: false
        - text: Luft
          right: false
      left: Gemisch
      right: Reinstoff

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Wie erkennt man im Labor, ob eine klare Flüssigkeit ein Reinstoff ist?
    params:
      options:
        - label: Sie siedet bei genau einer festen Temperatur
          correct: true
        - label: Sie ist durchsichtig
          feedback: Salzwasser ist auch klar.
        - label: Sie hat keinen Geruch
          feedback: Viele Gemische sind geruchlos.
    hints:
      - Reinstoffe haben feste Eigenschaften.
    explanation: Ein Gemisch siedet über einen Temperaturbereich, weil sich seine Zusammensetzung dabei ändert.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Messing ist ein Gemisch aus Kupfer und Zink – fest und völlig gleichmäßig. Wie nennt man das?
    params:
      options:
        - label: Legierung
          correct: true
        - label: Verbindung
          feedback: In einer Verbindung wäre das Verhältnis fest. Bei Messing kann man es variieren.
        - label: Suspension
          feedback: Dort schweben feste Teilchen in einer Flüssigkeit.
    hints:
      - Bronze, Stahl und Messing gehören dazu.
    explanation: Eine **Legierung** ist eine feste Lösung. Sie ist oft härter als ihre Bestandteile.
    difficulty: 3

srs:
  cards_from: [sortieren, sichtbar]
