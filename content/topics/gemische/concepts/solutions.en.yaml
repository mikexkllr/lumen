id: chem.mixtures.solutions
type: concept
title: Solutions
summary: How much fits in?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: prozent
    widget: numeric
    prompt: "{{g}} g of sugar is stirred into 100 g of solution in total. What percent sugar does it contain?"
    params: { unit: "%" }
    answer: { value: "{{g}}" }
    hints:
      - The share of 100 g.
    explanation: "{{g}} out of 100 g is {{g}}%."
    variants:
      params: { g: "int[5,30]" }
      defaults: { g: 10 }

  - kind: explain
    body: |
      Water can only dissolve a limited amount. Once the limit is reached, the solution is **saturated** – every further grain stays on the bottom. Warm water usually dissolves more than cold.

  - kind: problem
    id: gesaettigt
    widget: choice
    prompt: You add another spoonful of salt to a saturated salt solution. What happens?
    params:
      options:
        - { label: The salt stays undissolved on the bottom., correct: true }
        - { label: It dissolves as usual., feedback: "Saturated means nothing more fits in." }
    hints:
      - What does saturated mean?
    explanation: Only more water or more heat makes room again.

  - kind: problem
    id: tee
    widget: choice
    prompt: Why does sugar dissolve faster in hot tea than in iced tea?
    params:
      options:
        - { label: The faster particles pull the sugar out more quickly., correct: true }
        - { label: Hot tea contains less water., feedback: "The amount is the same – the particles move faster." }
    hints:
      - What does a higher temperature mean for the particles?
    explanation: Heat means motion – and motion speeds up dissolving.

srs:
  cards_from: [prozent, gesaettigt]
