id: chem.mixtures.distill
type: concept
title: Destillieren
summary: Trennen über den Siedepunkt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du kochst Salzwasser, bis alles Wasser verdampft ist. Was bleibt im Topf?
    params:
      options:
        - label: Das Salz
          correct: true
        - label: Nichts
          feedback: Salz verdampft bei dieser Hitze nicht.
        - label: Süßes Wasser
          feedback: Das Wasser ist ja weg.
    hints:
      - Was verdampft bei 100 °C – und was nicht?
    explanation: Und fängt man den Dampf auf, hat man reines Wasser.

  - kind: explain
    id: s1
    body: |
      Beim **Destillieren** erhitzt man ein flüssiges Gemisch. Der Stoff mit dem niedrigeren Siedepunkt verdampft zuerst, wird im Kühler wieder flüssig und separat aufgefangen.

  - kind: problem
    id: zuerst
    widget: choice
    prompt: Alkohol siedet bei 78 °C, Wasser bei 100 °C. Was verdampft beim Erhitzen von Wein zuerst?
    params:
      options:
        - { label: Vor allem der Alkohol, correct: true }
        - { label: Vor allem das Wasser, feedback: "Wasser braucht die höhere Temperatur." }
    hints:
      - Wer hat den niedrigeren Siedepunkt?
    explanation: So entstehen Schnäpse – der Alkohol wird angereichert.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Schritte einer Destillation in die richtige Reihenfolge.
    params:
      items:
        - { label: Gemisch erhitzen }
        - { label: Der leichter siedende Stoff verdampft }
        - { label: Der Dampf kühlt im Kühler ab }
        - { label: Die Flüssigkeit wird aufgefangen }
    hints:
      - Vom Kolben über den Kühler zur Vorlage.
    explanation: Verdampfen und Kondensieren – zweimal Zustandswechsel, einmal getrennt.

  - kind: problem
    id: erdoel
    widget: choice
    prompt: Wie trennt eine Raffinerie Erdöl in Benzin, Diesel und Heizöl?
    params:
      options:
        - { label: Durch Destillation nach verschiedenen Siedebereichen, correct: true }
        - { label: Durch Filtern, feedback: "Die Bestandteile sind gelöst – ein Filter hilft nicht." }
    hints:
      - Kurze Ketten sieden früher als lange.
    explanation: In einem hohen Turm sammeln sich die Bestandteile auf verschiedenen Höhen.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der Stoff mit dem [[niedrigeren]] Siedepunkt verdampft zuerst. Im [[Kühler]] wird er wieder flüssig.
      distractors:
        - höheren
        - Filter

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wein hat 12 % Alkohol. Wie viele Milliliter reiner Alkohol stecken in einer 750-ml-Flasche?
    params:
      unit: ml
    answer:
      value: 90
    hints:
      - 12 % von 750.
    explanation: 0,12 · 750 = 90 ml.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: order
    prompt: In der Raffinerie steigt heißer Erdöldampf in einem Turm auf. Ordne, was von oben nach unten aufgefangen wird.
    params:
      items:
        - label: Flüssiggas (Propan, Butan)
        - label: Benzin
        - label: Kerosin
        - label: Diesel
        - label: Schweröl
        - label: Bitumen
      startLabel: oben (kühl)
      endLabel: unten (heiß)
    hints:
      - Oben ist es kühl – dort kommen nur Stoffe mit niedrigem Siedepunkt an.
      - Kurze Ketten sieden früh, lange spät.
    explanation: Jede Etage fängt Stoffe mit ähnlichem Siedebereich auf. Bitumen für Straßen bleibt ganz unten.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Aus {{v}} Litern Maische mit {{p}} % Alkohol wird der Alkohol herausdestilliert. Wie viele Liter reinen Alkohol gibt es höchstens?
    params:
      unit: L
    answer:
      value: "{{v * p / 100}}"
    hints:
      - Destillieren trennt nur – es erzeugt keinen Alkohol.
      - Rechne {{p}} % von {{v}} L.
    explanation: "{{v}} · {{p}} : 100 = {{v * p / 100}} L. Mehr kann nicht herauskommen, als drin ist."
    difficulty: 2
    variants:
      params:
        v: step[10,50,10]
        p: choice[5,8,10]
      defaults:
        v: 20
        p: 8

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Wasser siedet bei 100 °C, Ethanol bei 78 °C. Wann wird beim Destillieren von Wein die Vorlage gewechselt?
    params:
      options:
        - label: Wenn die Temperatur am Kopf deutlich über 78 °C steigt
          correct: true
        - label: Gleich zu Beginn
          feedback: Am Anfang kommt gerade der alkoholreichste Teil.
        - label: Erst bei 120 °C
          feedback: Dann wäre schon das ganze Wasser übergegangen.
    hints:
      - Das Thermometer zeigt, welcher Dampf gerade aufsteigt.
      - Steigt die Temperatur Richtung 100 °C, kommt mehr Wasser.
    explanation: Solange die Temperatur nahe 78 °C bleibt, kommt vor allem Alkohol. Danach steigt der Wasseranteil.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Durch einfaches Destillieren bekommt man Alkohol nie reiner als 96 %. Warum?
    params:
      options:
        - label: Bei 96 % verdampfen Alkohol und Wasser im selben Verhältnis wie in der Flüssigkeit
          correct: true
        - label: Die Apparaturen sind nicht dicht genug
          feedback: Auch perfekte Geräte stoßen an diese Grenze.
        - label: Reiner Alkohol zerfällt sofort
          feedback: Er ist stabil – nur nicht durch Destillieren erreichbar.
    hints:
      - Destillieren klappt nur, wenn Dampf und Flüssigkeit verschieden zusammengesetzt sind.
    explanation: Ein solches Gemisch heißt **Azeotrop**. Es siedet wie ein Reinstoff.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Bei wie viel Grad Celsius siedet Wasser auf dem Gipfel des Mount Everest?"
    params:
      min: 40
      max: 110
      unit: °C
    answer:
      value: 70
      tolerance: 5
    explanation: Bei rund 70 °C, denn dort oben herrscht nur gut ein Drittel des Luftdrucks. Nudeln werden dabei kaum gar.
    difficulty: 3

  - kind: explain
    id: ch-x2
    depth: 3
    body: Der Siedepunkt hängt vom Druck ab. Senkt man den Druck, siedet ein Stoff schon bei niedrigerer Temperatur. Das nutzt die **Vakuumdestillation**.

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Warum destilliert man empfindliche Duftstoffe aus Blüten im Vakuum?
    params:
      options:
        - label: Sie sieden dann schon bei niedriger Temperatur und zerfallen nicht
          correct: true
        - label: Im Vakuum riechen sie stärker
          feedback: Der Duft selbst ändert sich nicht.
        - label: Ohne Luft brauchen sie keinen Kühler
          feedback: Kühlen muss man trotzdem.
    hints:
      - Viele Duftstoffe zersetzen sich bei großer Hitze.
      - Weniger Druck, niedrigerer Siedepunkt.
    explanation: So bleiben die Moleküle heil. Auch Zuckersirup und Medikamente reinigt man oft im Vakuum.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man durch Destillieren Alkohol vom Wasser trennt.
    params:
      keywords:
        - - siede
          - boil
        - - verdampf
          - dampf
          - vapour
          - vapor
          - evaporat
        - - kühl
          - kondens
          - cool
          - condens
        - - "78"
          - früher
          - zuerst
          - first
          - lower
          - niedriger
      sample: Alkohol siedet schon bei 78 °C, Wasser erst bei 100 °C. Beim Erhitzen verdampft also zuerst vor allem der Alkohol. Der Dampf wird im Kühler kondensiert und getrennt aufgefangen.
    explanation: Der Unterschied der Siedepunkte macht die Trennung möglich.
    difficulty: 3

srs:
  cards_from: [zuerst, erdoel]
