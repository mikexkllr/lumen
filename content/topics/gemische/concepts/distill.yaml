id: chem.mixtures.distill
type: concept
title: Destillieren
summary: Trennen über den Siedepunkt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Beim **Destillieren** erhitzt man ein flüssiges Gemisch. Der Stoff mit dem niedrigeren Siedepunkt verdampft zuerst, wird im Kühler wieder flüssig und separat aufgefangen.

  - kind: problem
    id: zuerst
    widget: choice
    prompt: Alkohol siedet bei 78 °C, Wasser bei 100 °C. Was verdampft beim Erhitzen von Wein zuerst?
    params:
      options:
        - { label: Vor allem der Alkohol, correct: true }
        - { label: Vor allem das Wasser, feedback: "Wasser braucht die höhere Temperatur." }
    hints:
      - Wer hat den niedrigeren Siedepunkt?
    explanation: So entstehen Schnäpse – der Alkohol wird angereichert.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Schritte einer Destillation in die richtige Reihenfolge.
    params:
      items:
        - { label: Gemisch erhitzen }
        - { label: Der leichter siedende Stoff verdampft }
        - { label: Der Dampf kühlt im Kühler ab }
        - { label: Die Flüssigkeit wird aufgefangen }
    hints:
      - Vom Kolben über den Kühler zur Vorlage.
    explanation: Verdampfen und Kondensieren – zweimal Zustandswechsel, einmal getrennt.

  - kind: problem
    id: erdoel
    widget: choice
    prompt: Wie trennt eine Raffinerie Erdöl in Benzin, Diesel und Heizöl?
    params:
      options:
        - { label: Durch Destillation nach verschiedenen Siedebereichen, correct: true }
        - { label: Durch Filtern, feedback: "Die Bestandteile sind gelöst – ein Filter hilft nicht." }
    hints:
      - Kurze Ketten sieden früher als lange.
    explanation: In einem hohen Turm sammeln sich die Bestandteile auf verschiedenen Höhen.

srs:
  cards_from: [zuerst, erdoel]
