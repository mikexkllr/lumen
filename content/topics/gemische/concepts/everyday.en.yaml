id: chem.mixtures.everyday
type: concept
title: Mixtures in everyday life
summary: Dressing, spritzer, granite.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Everything is mixed
    body: "Almost nothing around you is a pure substance. Even clouds and chocolate hide **mixtures**. Uncover the cards – but guess first: what is mixed in there?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌫️
            front: Fog
            back: Tiny water droplets float in the air – a mixture you breathe in.
          - icon: 🍦
            front: Whipped cream
            back: Almost half of it is air, trapped in fat and water.
          - icon: 🩸
            front: Blood
            back: Red cells float in yellowish plasma. In a centrifuge they separate.
          - icon: 🍫
            front: Chocolate
            back: Cocoa, sugar, fat and often milk – a solid mixture that melts in your mouth.

  - kind: problem
    id: ch-hook
    widget: estimate
    prompt: "Take a guess: what percentage of cow's milk is water?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 87
      tolerance: 4
    explanation: About 87%. The rest is fat, protein, milk sugar and minerals – finely spread out.

  - kind: problem
    id: art
    widget: buckets
    prompt: Evenly mixed or visibly mixed?
    params:
      buckets: [{ label: homogeneous }, { label: heterogeneous }]
      items:
        - { label: Salt water, bucket: homogeneous }
        - { label: Clear apple spritzer, bucket: homogeneous }
        - { label: Granite, bucket: heterogeneous }
        - { label: Muesli, bucket: heterogeneous }
    hints:
      - Can you see the components?
    explanation: In granite, you can see grains of different minerals.

  - kind: problem
    id: dressing
    widget: choice
    prompt: Why do you have to shake salad dressing before serving?
    params:
      options:
        - { label: Oil and vinegar separate over time., correct: true }
        - { label: To make it colder., feedback: "It is about the separation." }
    hints:
      - Do oil and water mix on their own?
    explanation: Shaking creates an **emulsion** – fine droplets that slowly separate again.

  - kind: problem
    id: schorle
    widget: numeric
    prompt: A spritzer is mixed 1 to 3 – 1 part juice, 3 parts water. How much juice is in {{v}} ml?
    params: { unit: ml }
    answer: { value: "{{v / 4}}" }
    feedback:
      - when: "numval(state.input) == v / 3"
        misconception: ratio-parts
        text: 1 to 3 means four parts in total – the juice is one quarter.
    hints:
      - How many parts are there in total?
    explanation: "{{v}} ÷ 4 = {{v / 4}} ml of juice."
    variants:
      params: { v: "choice[400,800,1000,1200]" }
      defaults: { v: 1000 }

  - kind: problem
    id: ch-c1
    widget: choice
    prompt: Orange juice with pulp says "Shake before use". Why?
    params:
      options:
        - label: The pulp sinks to the bottom over time
          correct: true
        - label: Otherwise the juice turns sour
          feedback: Shaking does not change the taste.
        - label: So the sugar dissolves
          feedback: The sugar has long been dissolved.
    hints:
      - Bits of fruit are solid and heavier than juice.
      - Solid bits in a liquid settle.
    explanation: "Juice with pulp is a **suspension**: solid bits only float until they settle."

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: "A spritzer is mixed 1 to 2: 1 part juice, 2 parts water. Split the glass to match and shade the juice."
    params:
      parts: 2
      shape: bar
      partOptions:
        - 2
        - 3
        - 4
        - 6
    answer:
      fraction: 1/3
    hints:
      - "First count all the parts together: juice and water."
      - Split the glass into 3 equal parts and shade one of them.
    explanation: "Three parts in total, one of them juice: $\\frac{1}{3}$. So »1 to 2« does not mean a half."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Mayonnaise consists of oil and vinegar – and still does not separate. Why?
    params:
      options:
        - label: Egg yolk contains an emulsifier that coats oil droplets
          correct: true
        - label: Because it is chilled
          feedback: Cold slows it down but does not prevent it.
        - label: Oil and vinegar react with each other
          feedback: They stay chemically separate, just finely dispersed.
    hints:
      - A molecule with a water-loving and a fat-loving end.
    explanation: Lecithin keeps the **emulsion** stable – by the same principle as soap.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Solution, emulsion or suspension?
    params:
      buckets:
        - id: b1
          label: Solution
        - id: b2
          label: Emulsion
        - id: b3
          label: Suspension
      items:
        - label: Salt water
          bucket: b1
        - label: Tea with sugar
          bucket: b1
        - label: Milk
          bucket: b2
        - label: Mayonnaise
          bucket: b2
        - label: Mud
          bucket: b3
        - label: Cocoa with powder on the bottom
          bucket: b3
    hints:
      - "Solution: fully clear. Emulsion: droplets. Suspension: solid bits."
      - Mayonnaise has oil droplets spread through it.
    explanation: Solutions never settle, suspensions do. Emulsions separate unless there is an emulsifier.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: A dressing is 3 parts oil and 1 part vinegar. How many millilitres of oil do you need for {{v}} ml of dressing?
    params:
      unit: ml
    answer:
      value: "{{3 * v / 4}}"
    feedback:
      - when: numval(state.input) == v / 3
        misconception: ratio-parts
        text: There are 4 parts in total, not 3.
    hints:
      - 3 + 1 = 4 parts in total.
      - One part is {{v / 4}} ml.
    explanation: "{{v}} ÷ 4 · 3 = {{3 * v / 4}} ml of oil."
    difficulty: 2
    variants:
      params:
        v: step[80,400,40]
      defaults:
        v: 200

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between a mixture and a compound.
    params:
      keywords:
        - - trenn
          - separat
          - filter
          - physikalisch
          - physical
        - - bindung
          - gebunden
          - bond
          - bound
          - reaktion
          - reaction
          - chemisch
          - chemical
        - - eigenschaft
          - propert
          - neu
          - new
      sample: In a mixture the substances merely lie side by side and can be separated physically, for example by filtering. In a compound the atoms are chemically bound and have new properties.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: An **emulsifier** has a water-loving end and a fat-loving end. It sits between oil and water and keeps the droplets apart. In egg yolk, that is lecithin.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Homogenised milk no longer forms a layer of cream. What was done to it?
    params:
      options:
        - label: The fat droplets were broken up into tiny ones under high pressure
          correct: true
        - label: The fat was removed
          feedback: Then it would be skimmed milk.
        - label: Sugar was added
          feedback: Sugar does not keep fat suspended.
    hints:
      - Fat is lighter than water and rises.
      - Very small droplets barely rise at all.
    explanation: The smaller a droplet, the slower it rises. Homogenising breaks them down to below one micrometre.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Air is a mixture, water a compound. How can you tell?
    params:
      options:
        - label: Air can be separated by liquefying and distilling, water only by a reaction
          correct: true
        - label: Air is a gas, water is a liquid
          feedback: The state does not tell you mixture or compound.
        - label: Water contains only one kind of atom
          feedback: Water contains hydrogen and oxygen.
    hints:
      - For a mixture, a physical method is enough.
      - "Water is split with electricity: electrolysis."
    explanation: Liquid air separates into nitrogen and oxygen when distilled. Water stays water when it boils.
    difficulty: 3

srs:
  cards_from: [art, schorle]
