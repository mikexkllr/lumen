id: chem.equilibrium.speed
type: concept
title: How fast does it react?
summary: Temperature, surface area, concentration.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Where does milk go sour faster?
    params:
      options:
        - label: On the warm table
          correct: true
        - label: In the fridge
          feedback: That is what the fridge is for.
        - label: Equally fast everywhere
          feedback: Then nobody would need a fridge.
    hints:
      - Why do we cool food?
    explanation: Heat makes reactions faster. You will see why in a moment.

  - kind: explain
    id: s1
    body: |
      Particles only react when they **collide**, and hard enough. Anything that causes more or harder collisions speeds up a reaction.

  - kind: problem
    id: tempo
    widget: buckets
    prompt: Does the reaction get faster or slower?
    params:
      buckets: [{ label: faster }, { label: slower }]
      items:
        - { label: Higher temperature, bucket: faster }
        - { label: Fine powder instead of lumps, bucket: faster }
        - { label: Higher concentration, bucket: faster }
        - { label: Storing in the fridge, bucket: slower }
    hints:
      - More collisions or fewer?
    explanation: That is why food keeps longer in the fridge. Spoiling is chemistry too.

  - kind: problem
    id: regel
    widget: numeric
    prompt: "Rule of thumb: for every 10 °C warmer, twice as fast. How many times faster does a reaction run at {{10 * k}} °C more?"
    params: { unit: "times" }
    answer: { value: "{{2 ** k}}" }
    feedback:
      - when: "numval(state.input) == 2 * k"
        misconception: linear
        text: Each step doubles, so the factors multiply.
    hints:
      - "Double it {{k}} times."
    explanation: "$2^{ {{k}} } = {{2 ** k}}$ times as fast."
    variants:
      params: { k: "int[3,5]" }
      defaults: { k: 3 }

  - kind: problem
    id: mehl
    widget: choice
    prompt: A sack of flour hardly burns, but finely dispersed flour dust can explode. Why?
    params:
      options:
        - { label: Fine dust has a huge surface area., correct: true }
        - { label: Dust is hotter., feedback: "The temperature is the same. The contact area with oxygen is not." }
    hints:
      - Where can oxygen attack?
    explanation: More surface means more collisions, and the reaction runs explosively.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Raising the temperature
          right: true
        - text: Putting food in the fridge
          right: false
        - text: Grinding a substance finely
          right: true
        - text: Diluting a solution
          right: false
      left: Slower
      right: Faster

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Milk turns sour in 1 day at 20 °C. How many days does it keep at 0 °C by the rule of thumb?
    answer:
      value: 4
    hints:
      - 20 degrees colder is two halvings of the rate.
    explanation: Four times as long. That is why fridges exist.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does a small warming of 10 °C double the rate although the particles get only 2% faster?
    params:
      options:
        - label: The share of particles with enough energy to react grows steeply
          correct: true
        - label: The particles collide twice as often
          feedback: The collision count rises by only a few percent.
        - label: The rule of thumb is wrong
          feedback: It holds well for many reactions.
    hints:
      - Only the fastest particles make it over the energy barrier.
    explanation: "The **Arrhenius equation**: the rate depends exponentially on temperature."
    difficulty: 3

srs:
  cards_from: [tempo, mehl]
