id: chem.equilibrium.balance
type: concept
title: Back and forth
summary: Chemical equilibrium.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In a store 20 people a minute ride the escalator up and 20 ride down. What happens to the number of people upstairs?
    params:
      options:
        - label: It stays the same – although everyone is moving
          correct: true
        - label: It rises
          feedback: Just as many come down.
        - label: It falls
          feedback: Just as many ride up.
    hints:
      - Compare arrivals and departures.
    explanation: "Lots of motion, no change: a dynamic equilibrium."

  - kind: explain
    id: s1
    body: |
      Many reactions run in **both directions**. At some point, products form as fast as they break down again. From the outside, nothing changes anymore. This is **chemical equilibrium**.

  - kind: problem
    id: stillstand
    widget: choice
    prompt: What happens at equilibrium on the particle level?
    params:
      options:
        - { label: The forward and reverse reactions keep running at the same rate., correct: true }
        - { label: All reactions stand still., feedback: "It only looks that way. Inside, things move back and forth all the time." }
    hints:
      - Think of two escalators of equal speed going in opposite directions.
    explanation: A **dynamic** equilibrium. Constant motion, constant amounts.

  - kind: problem
    id: verhaeltnis
    widget: numeric
    prompt: At equilibrium there are {{p}} mol of product and {{a}} mol of reactant. What is the ratio of product to reactant?
    params: { placeholder: "Ratio" }
    answer: { value: "{{p / a}}" }
    hints:
      - Product divided by reactant.
    explanation: "{{p}} ÷ {{a}} = {{p / a}}. A large ratio means the equilibrium lies on the product side."
    variants:
      params: { a: "choice[1,2,4]", k: "choice[2,3,5]" }
      derive: { p: "a * k" }
      defaults: { a: 2, k: 3 }

  - kind: problem
    id: blut
    widget: choice
    prompt: In the blood, oxygen binds to hemoglobin in the lungs and is released in the muscles. Why does both work?
    params:
      options:
        - { label: The equilibrium shifts with the amount of oxygen., correct: true }
        - { label: The lungs force the oxygen in., feedback: "It is pure chemistry. A lot of oxygen here, little there." }
    hints:
      - Where is there a lot of oxygen, and where is there little?
    explanation: Much O₂ in the lungs pushes toward binding. Little O₂ in the muscles pushes toward release.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In equilibrium the forward and reverse reactions run equally [[fast]]. From outside it looks as if everything stood [[still]].
      distractors:
        - hot
        - loud

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: For A ⇌ B the equilibrium constant is K = 4. At the start there are 10 mol of A and no B. How many moles of B are present at equilibrium?
    params:
      unit: mol
    answer:
      value: 8
    hints:
      - "B : A = 4 : 1, and together they remain 10 mol."
    explanation: "8 mol of B and 2 mol of A: 8/2 = 4."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: At equilibrium nothing changes any more. So has the reaction stopped?
    params:
      options:
        - label: No – forward and reverse reactions continue, just equally fast
          correct: true
        - label: Yes – all particles have reacted
          feedback: Then no starting material would be left.
        - label: Yes – the energy is used up
          feedback: The particles keep moving and colliding.
    hints:
      - "As in a full department store: as many go in as come out."
    explanation: A **dynamic equilibrium**. Labelled atoms prove the constant exchange.
    difficulty: 3

srs:
  cards_from: [stillstand, blut]
