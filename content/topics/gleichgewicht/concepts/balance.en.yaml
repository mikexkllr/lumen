id: chem.equilibrium.balance
type: concept
title: Back and forth
summary: Chemical equilibrium.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In a store 20 people a minute ride the escalator up and 20 ride down. What happens to the number of people upstairs?
    params:
      options:
        - label: It stays the same – although everyone is moving
          correct: true
        - label: It rises
          feedback: Just as many come down.
        - label: It falls
          feedback: Just as many ride up.
    hints:
      - Compare arrivals and departures.
    explanation: "Lots of motion, no change: a dynamic equilibrium."

  - kind: explain
    id: s1
    body: |
      Many reactions run in **both directions**. At some point, products form as fast as they break down again. From the outside, nothing changes anymore. This is **chemical equilibrium**.

  - kind: problem
    id: stillstand
    widget: choice
    prompt: What happens at equilibrium on the particle level?
    params:
      options:
        - { label: The forward and reverse reactions keep running at the same rate., correct: true }
        - { label: All reactions stand still., feedback: "It only looks that way. Inside, things move back and forth all the time." }
    hints:
      - Think of two escalators of equal speed going in opposite directions.
    explanation: A **dynamic** equilibrium. Constant motion, constant amounts.

  - kind: problem
    id: verhaeltnis
    widget: numeric
    prompt: At equilibrium there are {{p}} mol of product and {{a}} mol of reactant. What is the ratio of product to reactant?
    params: { placeholder: "Ratio" }
    answer: { value: "{{p / a}}" }
    hints:
      - Product divided by reactant.
    explanation: "{{p}} ÷ {{a}} = {{p / a}}. A large ratio means the equilibrium lies on the product side."
    variants:
      params: { a: "choice[1,2,4]", k: "choice[2,3,5]" }
      derive: { p: "a * k" }
      defaults: { a: 2, k: 3 }

  - kind: problem
    id: blut
    widget: choice
    prompt: In the blood, oxygen binds to hemoglobin in the lungs and is released in the muscles. Why does both work?
    params:
      options:
        - { label: The equilibrium shifts with the amount of oxygen., correct: true }
        - { label: The lungs force the oxygen in., feedback: "It is pure chemistry. A lot of oxygen here, little there." }
    hints:
      - Where is there a lot of oxygen, and where is there little?
    explanation: Much O₂ in the lungs pushes toward binding. Little O₂ in the muscles pushes toward release.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In equilibrium the forward and reverse reactions run equally [[fast]]. From outside it looks as if everything stood [[still]].
      distractors:
        - hot
        - loud

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: For A ⇌ B the equilibrium constant is K = 4. At the start there are 10 mol of A and no B. How many moles of B are present at equilibrium?
    params:
      unit: mol
    answer:
      value: 8
    hints:
      - "B : A = 4 : 1, and together they remain 10 mol."
    explanation: "8 mol of B and 2 mol of A: 8/2 = 4."
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "At equilibrium the **law of mass action** holds: K = [products] ÷ [reactants], each concentration raised to its number in the equation. K depends only on temperature."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: A ⇌ B has K = {{K}}. At the start there are {{a}} mol of A and no B. How many moles of B are there at equilibrium?
    params:
      unit: mol
    answer:
      value: "{{K * m}}"
    feedback:
      - when: numval(state.input) == a
        misconception: complete-reaction
        text: Not everything converts – some A is left over.
    hints:
      - "B : A = {{K}} and A + B = {{a}}."
      - "Split {{a}} in the ratio {{K}} : 1."
    explanation: "B = {{a}} · {{K}}/{{K + 1}} = {{K * m}} mol, A = {{m}} mol. Check: {{K * m}} ÷ {{m}} = {{K}}."
    difficulty: 2
    variants:
      params:
        K: choice[1,3,4,9]
        m: int[1,5]
      derive:
        a: (1 + K) * m
      defaults:
        K: 3
        m: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: A reaction has K = 10¹⁰. What is present at equilibrium?
    params:
      options:
        - label: Almost only products
          correct: true
        - label: Almost only reactants
          feedback: That would be the case for a very small K.
        - label: Half and half
          feedback: That is roughly K = 1.
    hints:
      - K stands for products over reactants.
      - Ten billion to one.
    explanation: "Large K: the reaction runs practically to completion. Small K: it barely gets going."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: At equilibrium nothing changes any more. So has the reaction stopped?
    params:
      options:
        - label: No – forward and reverse reactions continue, just equally fast
          correct: true
        - label: Yes – all particles have reacted
          feedback: Then no starting material would be left.
        - label: Yes – the energy is used up
          feedback: The particles keep moving and colliding.
    hints:
      - "As in a full department store: as many go in as come out."
    explanation: A **dynamic equilibrium**. Labelled atoms prove the constant exchange.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: H₂ + I₂ ⇌ 2 HI. At equilibrium [HI] = 0.8 mol/L and [H₂] = [I₂] = 0.1 mol/L. What is K?
    answer:
      value: 64
    feedback:
      - when: numval(state.input) == 80
        misconception: exponent-ignored
        text: HI has a 2 in the equation – so square it.
      - when: numval(state.input) == 8
        misconception: exponent-ignored
        text: Square [HI] and multiply the concentrations below.
    hints:
      - K = [HI]² ÷ ([H₂] · [I₂]).
      - 0.64 ÷ 0.01.
    explanation: K = 0.64 ÷ 0.01 = 64. The coefficients become exponents.
    difficulty: 3

  - kind: explain
    id: ch-x2
    depth: 3
    body: "K and the **standard free energy** are linked: $\\Delta G^\\circ = -R \\cdot T \\cdot \\ln K$. Every 5.7 kJ/mol more negative at 25 °C makes K ten times larger."

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: A reaction has ΔG° = −11.4 kJ/mol at 298 K. Roughly how big is K? (Each −5.7 kJ/mol is a factor of 10)
    answer:
      value: 100
      tolerance: 3
    feedback:
      - when: numval(state.input) == 20
        misconception: add-not-multiply
        text: "The factors multiply: 10 · 10."
    hints:
      - −11.4 is twice −5.7.
      - Twice a factor of 10.
    explanation: K ≈ 10 · 10 = 100. Small differences in ΔG make huge differences at equilibrium.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: choice
    prompt: You compare the current quotient Q with K. Here Q < K. Which way does the reaction run?
    params:
      options:
        - label: Towards the products, until Q = K
          correct: true
        - label: Towards the reactants
          feedback: That happens when Q > K.
        - label: Not at all
          feedback: It only rests when Q = K.
    hints:
      - Q has the same formula as K, but with the current values.
      - Too little product on top means more has to form.
    explanation: "Q points the way to equilibrium: Q < K means forwards, Q > K backwards."
    difficulty: 3

srs:
  cards_from: [stillstand, blut]
