id: chem.equilibrium.balance
type: concept
title: Hin und zurück
summary: Das chemische Gleichgewicht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Nie ganz fertig
    body: Manche Reaktionen werden **nie ganz fertig**. Die Kurve zeigt, wie viel Produkt mit der Zeit entsteht. Zieh am Regler für Hin- und Rückreaktion. Wo bleibt die Kurve stehen – und warum?
    visual:
      widget: slider
      interactive: true
      params:
        expr: 10*k/(1 + k)*(1 - exp(0 - (1 + k)*x/2))
        x:
          - 0
          - 6
        y:
          - 0
          - 10
        showCoordinates: false
        sliders:
          - id: k
            label: Hin gegen zurück
            min: 0.5
            max: 9
            step: 0.5
            initial: 1

  - kind: problem
    id: hook
    widget: choice
    prompt: Im Kaufhaus fahren pro Minute 20 Leute die Rolltreppe hoch und 20 wieder herunter. Was passiert mit der Zahl der Leute oben?
    params:
      options:
        - label: Sie bleibt gleich – obwohl sich alle bewegen
          correct: true
        - label: Sie steigt
          feedback: Es kommen genauso viele herunter.
        - label: Sie fällt
          feedback: Es fahren genauso viele hinauf.
    hints:
      - Vergleich Zugang und Abgang.
    explanation: "Viel Bewegung, kein Unterschied: ein dynamisches Gleichgewicht."

  - kind: explain
    id: s1
    body: |
      Viele Reaktionen laufen in **beide Richtungen**. Irgendwann entstehen genauso viele Produkte, wie wieder zerfallen. Dann ändert sich von außen nichts mehr – das **chemische Gleichgewicht**.

  - kind: problem
    id: stillstand
    widget: choice
    prompt: Was passiert im Gleichgewicht auf Teilchenebene?
    params:
      options:
        - { label: Hin- und Rückreaktion laufen gleich schnell weiter., correct: true }
        - { label: Alle Reaktionen stehen still., feedback: "Es sieht nur so aus – im Inneren geht es ständig hin und her." }
    hints:
      - Denk an zwei gleich schnelle Rolltreppen in entgegengesetzte Richtungen.
    explanation: Ein **dynamisches** Gleichgewicht – ständige Bewegung, konstante Mengen.

  - kind: problem
    id: verhaeltnis
    widget: numeric
    prompt: Im Gleichgewicht liegen {{p}} mol Produkt und {{a}} mol Ausgangsstoff vor. Wie groß ist das Verhältnis Produkt zu Ausgangsstoff?
    params: { placeholder: "Verhältnis" }
    answer: { value: "{{p / a}}" }
    hints:
      - Produkt geteilt durch Ausgangsstoff.
    explanation: "{{p}} : {{a}} = {{p / a}}. Großes Verhältnis heißt – das Gleichgewicht liegt auf der Produktseite."
    variants:
      params: { a: "choice[1,2,4]", k: "choice[2,3,5]" }
      derive: { p: "a * k" }
      defaults: { a: 2, k: 3 }

  - kind: problem
    id: blut
    widget: choice
    prompt: Im Blut binden sich Sauerstoff und Hämoglobin in der Lunge und lösen sich im Muskel. Warum klappt beides?
    params:
      options:
        - { label: Das Gleichgewicht verschiebt sich je nach Sauerstoffmenge., correct: true }
        - { label: Die Lunge zwingt den Sauerstoff hinein., feedback: "Es ist reine Chemie – viel Sauerstoff hier, wenig dort." }
    hints:
      - Wo ist viel Sauerstoff, wo wenig?
    explanation: Viel O₂ in der Lunge drückt zur Bindung, wenig O₂ im Muskel zur Abgabe.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Im Gleichgewicht laufen Hin- und Rückreaktion gleich [[schnell]]. Von außen sieht es aus, als stünde alles [[still]].
      distractors:
        - heiß
        - laut

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Am Anfang liegen 10 mol Ausgangsstoff vor. Stell den Regler so ein, dass im Gleichgewicht 7,5 mol Produkt entstehen.
    params:
      expr: 10*k/(1 + k)*(1 - exp(0 - (1 + k)*x/2))
      x:
        - 0
        - 6
      y:
        - 0
        - 10
      showCoordinates: false
      sliders:
        - id: k
          label: Hin gegen zurück
          min: 0.5
          max: 9
          step: 0.5
          initial: 1
      markers:
        - x: 6
          y: 7.5
          group: a
    answer:
      values:
        k: 3
    hints:
      - Die Kurve muss rechts auf der Höhe der Markierung auslaufen.
      - Im Gleichgewicht stehen 7,5 mol Produkt 2,5 mol Ausgangsstoff gegenüber. Rechne das Verhältnis aus.
    explanation: "7,5 : 2,5 = 3. Läuft die Hinreaktion von sich aus dreimal so leicht wie die Rückreaktion, kommen im Gleichgewicht drei Teile Produkt auf einen Teil Ausgangsstoff."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Für A ⇌ B ist die Gleichgewichtskonstante K = 4. Am Anfang gibt es 10 mol A und kein B. Wie viel Mol B liegen im Gleichgewicht vor?
    params:
      unit: mol
    answer:
      value: 8
    hints:
      - "B : A = 4 : 1, und zusammen bleiben es 10 mol."
    explanation: "8 mol B und 2 mol A: 8/2 = 4."
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "Im Gleichgewicht gilt das **Massenwirkungsgesetz**: K = [Produkte] : [Ausgangsstoffe], jede Konzentration hoch ihrer Zahl in der Gleichung. K hängt nur von der Temperatur ab."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: A ⇌ B hat K = {{K}}. Am Anfang liegen {{a}} mol A und kein B vor. Wie viel Mol B sind im Gleichgewicht da?
    params:
      unit: mol
    answer:
      value: "{{K * m}}"
    feedback:
      - when: numval(state.input) == a
        misconception: complete-reaction
        text: Nicht alles wird umgesetzt – ein Teil A bleibt übrig.
    hints:
      - "B : A = {{K}} und A + B = {{a}}."
      - "Teile {{a}} im Verhältnis {{K}} : 1."
    explanation: "B = {{a}} · {{K}}/{{K + 1}} = {{K * m}} mol, A = {{m}} mol. Probe: {{K * m}} : {{m}} = {{K}}."
    difficulty: 2
    variants:
      params:
        K: choice[1,3,4,9]
        m: int[1,5]
      derive:
        a: (1 + K) * m
      defaults:
        K: 3
        m: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Eine Reaktion hat K = 10¹⁰. Was liegt im Gleichgewicht vor?
    params:
      options:
        - label: Fast nur Produkte
          correct: true
        - label: Fast nur Ausgangsstoffe
          feedback: Das wäre bei sehr kleinem K so.
        - label: Halb und halb
          feedback: Das gilt etwa für K = 1.
    hints:
      - K steht für Produkte durch Ausgangsstoffe.
      - Zehn Milliarden zu eins.
    explanation: "Großes K: Die Reaktion läuft praktisch vollständig. Kleines K: Sie kommt kaum in Gang."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Im Gleichgewicht ändert sich nichts mehr. Steht die Reaktion also still?
    params:
      options:
        - label: Nein – Hin- und Rückreaktion laufen weiter, nur gleich schnell
          correct: true
        - label: Ja – alle Teilchen haben reagiert
          feedback: Dann gäbe es keinen Ausgangsstoff mehr.
        - label: Ja – die Energie ist verbraucht
          feedback: Die Teilchen bewegen und stoßen weiter.
    hints:
      - "Wie in einem vollen Kaufhaus: gleich viele gehen rein wie raus."
    explanation: Ein **dynamisches Gleichgewicht**. Mit markierten Atomen lässt sich der ständige Austausch nachweisen.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: H₂ + I₂ ⇌ 2 HI. Im Gleichgewicht gilt [HI] = 0,8 mol/L und [H₂] = [I₂] = 0,1 mol/L. Wie groß ist K?
    answer:
      value: 64
    feedback:
      - when: numval(state.input) == 80
        misconception: exponent-ignored
        text: HI steht mit der Zahl 2 in der Gleichung – also quadrieren.
      - when: numval(state.input) == 8
        misconception: exponent-ignored
        text: Quadriere [HI] und multipliziere die Konzentrationen unten.
    hints:
      - "K = [HI]² : ([H₂] · [I₂])."
      - "0,64 : 0,01."
    explanation: "K = 0,64 : 0,01 = 64. Die Koeffizienten werden zu Hochzahlen."
    difficulty: 3

  - kind: explain
    id: ch-x2
    depth: 3
    body: "K und die **freie Standardenthalpie** hängen zusammen: $\\Delta G^\\circ = -R \\cdot T \\cdot \\ln K$. Jedes Minus von 5,7 kJ/mol bei 25 °C macht K zehnmal größer."

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Eine Reaktion hat bei 298 K ΔG° = −11,4 kJ/mol. Wie groß ist K ungefähr? (Je −5,7 kJ/mol ein Faktor 10)
    answer:
      value: 100
      tolerance: 3
    feedback:
      - when: numval(state.input) == 20
        misconception: add-not-multiply
        text: "Die Faktoren werden multipliziert: 10 · 10."
    hints:
      - −11,4 sind zweimal −5,7.
      - Zweimal Faktor 10.
    explanation: K ≈ 10 · 10 = 100. Kleine Unterschiede in ΔG machen riesige Unterschiede im Gleichgewicht.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: choice
    prompt: Man vergleicht den aktuellen Quotienten Q mit K. Es gilt Q < K. In welche Richtung läuft die Reaktion?
    params:
      options:
        - label: Zu den Produkten, bis Q = K
          correct: true
        - label: Zu den Ausgangsstoffen
          feedback: Das passiert bei Q > K.
        - label: Gar nicht
          feedback: Still steht sie nur bei Q = K.
    hints:
      - Q hat dieselbe Formel wie K, aber mit den Werten von jetzt.
      - "Zu wenig Produkt im Zähler heißt: Es muss mehr entstehen."
    explanation: "Q zeigt den Weg zum Gleichgewicht: Q < K heißt vorwärts, Q > K rückwärts."
    difficulty: 3

srs:
  cards_from: [stillstand, blut]
