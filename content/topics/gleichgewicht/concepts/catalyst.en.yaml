id: chem.equilibrium.catalyst
type: concept
title: Catalysts
summary: A shortcut over the energy hill.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A high mountain lies between two valleys. How do more hikers get across?
    params:
      options:
        - label: Through a tunnel
          correct: true
        - label: With a higher mountain
          feedback: Then even fewer make it.
        - label: By swapping the valleys
          feedback: That does not change the path.
    hints:
      - The mountain is the obstacle.
    explanation: A catalyst is such a tunnel for reactions.


  - kind: explain
    id: s1
    body: |
      Many reactions first have to get over an **energy hill**. A **catalyst** offers a path with a smaller hill. It is not used up in the process.

  - kind: problem
    id: verbraucht
    widget: choice
    prompt: What happens to a catalyst during the reaction?
    params:
      options:
        - { label: It is left unchanged at the end., correct: true }
        - { label: It is used up., feedback: "It helps again and again, so tiny amounts are enough." }
    hints:
      - Do you have to refill a car's catalytic converter?
    explanation: A catalyst is a helper, not an ingredient.

  - kind: problem
    id: wo
    widget: match
    prompt: Which catalyst works where?
    params:
      pairs:
        - { left: Platinum in the exhaust, right: Converting toxic exhaust gases }
        - { left: Enzymes in the body, right: Digesting food }
        - { left: Iron in factories, right: Making ammonia }
    hints:
      - Enzymes are the catalysts of life.
    explanation: Without enzymes, the reactions in your body would run millions of times too slowly.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Does a catalyst change how much product forms in the end?
    params:
      options:
        - { label: "No, only how fast it forms.", correct: true }
        - { label: "Yes, more forms.", feedback: "It lowers the hill equally in both directions, so the destination stays the same." }
    hints:
      - It speeds up the forward and reverse paths equally.
    explanation: Catalysts save time, not material.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The catalytic converter in a car consists of platinum on a honeycomb. Why the honeycomb?
    params:
      options:
        - label: It creates a huge surface – that is where the reaction takes place
          correct: true
        - label: It filters out soot
          feedback: That is what the particulate filter is for.
        - label: It dampens noise
          feedback: That is the silencer’s job.
    hints:
      - Only atoms at the surface can act.
    explanation: A few grams of platinum cover the area of several football pitches.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Enzymes speed up reactions in the body a millionfold – but each only **one** particular reaction. Why?
    params:
      options:
        - label: Their shape fits only one molecule – like a lock to a key
          correct: true
        - label: They are used up after one reaction
          feedback: Catalysts are not used up.
        - label: The body has only one enzyme
          feedback: It has thousands of different ones.
    hints:
      - Think of starch and cellulose.
    explanation: "The **lock-and-key principle**. That is why fever is dangerous: above 42 °C enzymes lose their shape."
    difficulty: 3

srs:
  cards_from: [verbraucht, gleich]
