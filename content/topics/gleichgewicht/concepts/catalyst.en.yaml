id: chem.equilibrium.catalyst
type: concept
title: Catalysts
summary: A shortcut over the energy hill.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A high mountain lies between two valleys. How do more hikers get across?
    params:
      options:
        - label: Through a tunnel
          correct: true
        - label: With a higher mountain
          feedback: Then even fewer make it.
        - label: By swapping the valleys
          feedback: That does not change the path.
    hints:
      - The mountain is the obstacle.
    explanation: A catalyst is such a tunnel for reactions.

  - kind: explain
    id: s1
    body: |
      Many reactions first have to get over an **energy hill**. A **catalyst** offers a path with a smaller hill. It is not used up in the process.

  - kind: problem
    id: verbraucht
    widget: choice
    prompt: What happens to a catalyst during the reaction?
    params:
      options:
        - { label: It is left unchanged at the end., correct: true }
        - { label: It is used up., feedback: "It helps again and again, so tiny amounts are enough." }
    hints:
      - Do you have to refill a car's catalytic converter?
    explanation: A catalyst is a helper, not an ingredient.

  - kind: problem
    id: wo
    widget: match
    prompt: Which catalyst works where?
    params:
      pairs:
        - { left: Platinum in the exhaust, right: Converting toxic exhaust gases }
        - { left: Enzymes in the body, right: Digesting food }
        - { left: Iron in factories, right: Making ammonia }
    hints:
      - Enzymes are the catalysts of life.
    explanation: Without enzymes, the reactions in your body would run millions of times too slowly.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Does a catalyst change how much product forms in the end?
    params:
      options:
        - { label: "No, only how fast it forms.", correct: true }
        - { label: "Yes, more forms.", feedback: "It lowers the hill equally in both directions, so the destination stays the same." }
    hints:
      - It speeds up the forward and reverse paths equally.
    explanation: Catalysts save time, not material.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A catalyst lowers the [[energy hill]]. It is not [[used up]] in the process.
      distractors:
        - boiling point
        - created

  - kind: problem
    id: mix-c2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A catalyst makes a reaction faster.
          right: true
        - text: It changes how much product forms in the end.
          right: false
          why: It only changes the speed.
        - text: Enzymes are catalysts in the body.
          right: true
        - text: After the reaction it is used up.
          right: false
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The catalytic converter in a car consists of platinum on a honeycomb. Why the honeycomb?
    params:
      options:
        - label: It creates a huge surface – that is where the reaction takes place
          correct: true
        - label: It filters out soot
          feedback: That is what the particulate filter is for.
        - label: It dampens noise
          feedback: That is the silencer’s job.
    hints:
      - Only atoms at the surface can act.
    explanation: A few grams of platinum cover the area of several football pitches.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: The catalytic converter in a car converts 9 out of 10 pollutant particles. How many of 500 particles are left?
    answer:
      value: 50
    hints:
      - One tenth remains.
    explanation: 500 ÷ 10 = 50. Without it all 500 would remain.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Is the catalyst in the same phase as the other substances, or in a different one?
    params:
      buckets:
        - id: b1
          label: homogeneous
        - id: b2
          label: heterogeneous
      items:
        - label: Enzyme in a cell
          bucket: b1
        - label: Chlorine atoms in ozone loss
          bucket: b1
        - label: Acid in ester formation
          bucket: b1
        - label: Platinum in a car's converter
          bucket: b2
        - label: Iron in the Haber–Bosch process
          bucket: b2
        - label: Nickel in hardening fat
          bucket: b2
    hints:
      - A solid catalyst with gases or liquids is heterogeneous.
      - Enzymes are dissolved, just like their partners.
    explanation: Heterogeneous catalysts are easy to separate – which is why industry likes them. There, every bit of surface counts.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Petrol used to contain lead. Why did it have to go once cars got catalytic converters?
    params:
      options:
        - label: Lead settles on the platinum and blocks the surface – it poisons the catalyst
          correct: true
        - label: Lead makes the engine too fast
          feedback: The problem was in the exhaust.
        - label: Lead reacts with platinum to make gold
          feedback: Chemistry does not create new elements.
    hints:
      - Catalysts work at their surface.
      - Whatever sticks there takes the room.
    explanation: This is called a **catalyst poison**. Unleaded petrol protected the converter – and incidentally millions of children from lead poisoning.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Enzymes speed up reactions in the body a millionfold – but each only **one** particular reaction. Why?
    params:
      options:
        - label: Their shape fits only one molecule – like a lock to a key
          correct: true
        - label: They are used up after one reaction
          feedback: Catalysts are not used up.
        - label: The body has only one enzyme
          feedback: It has thousands of different ones.
    hints:
      - Think of starch and cellulose.
    explanation: "The **lock-and-key principle**. That is why fever is dangerous: above 42 °C enzymes lose their shape."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: A three-way converter does three jobs at once. It burns CO and unburnt fuel to CO₂. And it turns toxic nitrogen oxides into harmless **nitrogen**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: "In the catalytic converter: 2 NO + 2 CO → N₂ + ? CO₂. Which number is missing?"
    answer:
      value: 2
    hints:
      - Count the C atoms on the left.
      - "Check O too: left 2 + 2 = 4."
    explanation: 2 NO + 2 CO → N₂ + 2 CO₂. CO gives up electrons, NO takes them – a redox reaction on platinum.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: A catalyst lowers the activation energy by 10 kJ/mol. Roughly how much faster does the reaction get at 25 °C?
    params:
      options:
        - label: About 50 times
          correct: true
        - label: About 10%
          feedback: The effect sits in an exponent – it is far bigger.
        - label: About double
          feedback: That is more like warming by 10 °C.
    hints:
      - The share of fast particles depends on e to the −Eₐ/(RT).
      - e to the (10,000 ÷ (8.314 · 298)) = e to the 4.
    explanation: e⁴ ≈ 55. Even a small cut in the barrier multiplies the rate – enzymes often lower it by 50 kJ/mol or more.
    difficulty: 3

srs:
  cards_from: [verbraucht, gleich]
