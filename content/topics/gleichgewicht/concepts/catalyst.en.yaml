id: chem.equilibrium.catalyst
type: concept
title: Catalysts
summary: A shortcut over the energy hill.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Many reactions first have to get over an **energy hill**. A **catalyst** offers a path with a smaller hill. It is not used up in the process.

  - kind: problem
    id: verbraucht
    widget: choice
    prompt: What happens to a catalyst during the reaction?
    params:
      options:
        - { label: It is left unchanged at the end., correct: true }
        - { label: It is used up., feedback: "It helps again and again, so tiny amounts are enough." }
    hints:
      - Do you have to refill a car's catalytic converter?
    explanation: A catalyst is a helper, not an ingredient.

  - kind: problem
    id: wo
    widget: match
    prompt: Which catalyst works where?
    params:
      pairs:
        - { left: Platinum in the exhaust, right: Converting toxic exhaust gases }
        - { left: Enzymes in the body, right: Digesting food }
        - { left: Iron in factories, right: Making ammonia }
    hints:
      - Enzymes are the catalysts of life.
    explanation: Without enzymes, the reactions in your body would run millions of times too slowly.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Does a catalyst change how much product forms in the end?
    params:
      options:
        - { label: "No, only how fast it forms.", correct: true }
        - { label: "Yes, more forms.", feedback: "It lowers the hill equally in both directions, so the destination stays the same." }
    hints:
      - It speeds up the forward and reverse paths equally.
    explanation: Catalysts save time, not material.

srs:
  cards_from: [verbraucht, gleich]
