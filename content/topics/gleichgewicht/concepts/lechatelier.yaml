id: chem.equilibrium.lechatelier
type: concept
title: Das Prinzip von Le Chatelier
summary: Das Gleichgewicht weicht aus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Du öffnest eine Sprudelflasche: Der Druck fällt. Was passiert im Wasser?"
    params:
      options:
        - label: Gas perlt aus
          correct: true
        - label: Es löst sich mehr Gas
          feedback: Dafür bräuchte es mehr Druck.
        - label: Nichts
          feedback: Du hörst es zischen.
    hints:
      - Was siehst und hörst du beim Öffnen?
    explanation: Das System gleicht die Störung aus. Dahinter steckt ein Prinzip.

  - kind: explain
    id: s1
    body: |
      Stört man ein **Gleichgewicht**, **weicht es dem Zwang aus**: Gibt man Ausgangsstoff dazu, entsteht mehr Produkt. Erhöht man den Druck, bevorzugt es die Seite mit weniger Gasteilchen.

  - kind: problem
    id: zugabe
    widget: choice
    prompt: Man gibt mehr Ausgangsstoff in ein Gleichgewicht. Was passiert?
    params:
      options:
        - { label: Es entsteht mehr Produkt., correct: true }
        - { label: Es entsteht weniger Produkt., feedback: "Das System baut den Überschuss ab – zur Produktseite hin." }
        - { label: Nichts, feedback: "Die Störung wird ausgeglichen – das ändert die Mengen." }
    hints:
      - Wie baut das System den Überschuss ab?
    explanation: Der Überschuss wird verbraucht – zu Produkt.

  - kind: problem
    id: sprudel
    widget: choice
    prompt: Warum sprudelt eine Mineralwasserflasche beim Öffnen?
    params:
      options:
        - { label: "Der Druck sinkt, und gelöstes CO₂ entweicht als Gas.", correct: true }
        - { label: Weil sie geschüttelt wurde., feedback: "Auch ungeschüttelt sprudelt sie – der Druck entscheidet." }
    hints:
      - Was ändert sich beim Öffnen?
    explanation: Weniger Druck verschiebt das Gleichgewicht zum gasförmigen CO₂.

  - kind: problem
    id: waerme
    widget: choice
    prompt: Eine Reaktion gibt Wärme ab. Man heizt das Gleichgewicht auf. Was passiert?
    params:
      options:
        - { label: Es entsteht weniger Produkt., correct: true }
        - { label: Es entsteht mehr Produkt., feedback: "Die Reaktion liefert selbst Wärme – zusätzliche Wärme drängt sie zurück." }
    hints:
      - Wärme ist hier wie ein Produkt der Reaktion.
    explanation: Das System weicht der Wärme aus und läuft verstärkt rückwärts.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Mehr Ausgangsstoff zugeben
          right: true
        - text: Produkt laufend entfernen
          right: true
        - text: Produkt zugeben
          right: false
        - text: Eine wärmeabgebende Reaktion erhitzen
          right: false
      left: Weniger Produkt
      right: Mehr Produkt

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Stickstoff und Wasserstoff werden zu Ammoniak. Die Reaktion gibt Wärme ab und verbraucht Gasteilchen. Was bringt mehr Ammoniak?
    params:
      buckets:
        - id: b1
          label: Mehr Ammoniak
        - id: b2
          label: Weniger Ammoniak
      items:
        - label: Druck erhöhen
          bucket: b1
        - label: Stickstoff zugeben
          bucket: b1
        - label: Temperatur erhöhen
          bucket: b2
        - label: Ammoniak laufend entfernen
          bucket: b1
        - label: Druck senken
          bucket: b2
    hints:
      - Das Gleichgewicht weicht jeder Störung aus.
    explanation: Mehr Wärme drängt die Reaktion zurück, denn sie gibt selbst Wärme ab.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Stört man ein Gleichgewicht, weicht es dem [[Zwang]] aus. Mehr Druck begünstigt die Seite mit [[weniger]] Gasteilchen.
      distractors:
        - Zufall
        - schnelleren

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In großer Höhe gibt es weniger Sauerstoff. Wie reagiert der Körper nach einigen Wochen?
    params:
      options:
        - label: Er bildet mehr rote Blutkörperchen – und gleicht so den Mangel aus
          correct: true
        - label: Er atmet langsamer
          feedback: Er atmet schneller.
        - label: Gar nicht
          feedback: Höhentraining nutzt genau diese Anpassung.
    hints:
      - Weniger Sauerstoff verschiebt das Gleichgewicht – mehr Hämoglobin gleicht es aus.
    explanation: Mehr Hämoglobin verschiebt das Gleichgewicht O₂ + Hb ⇌ HbO₂ wieder nach rechts.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Mehr Druck verschiebt ein Gas-Gleichgewicht. Verkleinere das Volumen, bis der Druck etwa 200 kPa erreicht.
    params:
      scene: gas
      controls:
        temperature:
          fixed: true
    answer:
      pressure:
        - 195
        - 205
    explanation: Bei 2,5 Litern. Unter Druck weicht das Gleichgewicht zur Seite mit weniger Gasteilchen aus.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: choice
    prompt: "Braunes NO₂ steht im Gleichgewicht mit farblosem N₂O₄: 2 NO₂ ⇌ N₂O₄, die Hinreaktion ist exotherm. Was passiert im Eisbad?"
    params:
      options:
        - label: Das Gas wird heller, weil mehr N₂O₄ entsteht
          correct: true
        - label: Das Gas wird dunkler
          feedback: Kälte begünstigt die Wärme liefernde Richtung – hin zu N₂O₄.
        - label: Nichts – Temperatur verschiebt kein Gleichgewicht
          feedback: Gerade die Temperatur ändert sogar K.
    hints:
      - Kälte nimmt Wärme weg. Welche Richtung liefert Wärme nach?
      - Die Hinreaktion zu N₂O₄ ist exotherm.
    explanation: Im Eis verblasst das Braun, im heißen Wasser wird es dunkler. Man sieht Le Chatelier mit bloßem Auge.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Bei einer Kohlenmonoxid-Vergiftung blockiert CO das Hämoglobin. Warum hilft reiner Sauerstoff unter Überdruck?
    params:
      options:
        - label: Viel O₂ verdrängt das CO nach Le Chatelier vom Hämoglobin
          correct: true
        - label: O₂ zerstört das CO direkt
          feedback: CO und O₂ reagieren im Blut kaum.
        - label: Der Druck presst CO aus der Lunge
          feedback: Es geht um ein Gleichgewicht am Hämoglobin.
    hints:
      - Hb–CO + O₂ ⇌ Hb–O₂ + CO.
      - Mehr von einem Ausgangsstoff verschiebt nach rechts.
    explanation: Hämoglobin bindet CO rund 200-mal stärker als O₂. Nur ein großer O₂-Überschuss drängt es zügig zurück.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Katalysator wird in ein Gleichgewicht gegeben. Was verschiebt sich?
    params:
      options:
        - label: Nichts – er beschleunigt Hin- und Rückreaktion gleich stark
          correct: true
        - label: Es entsteht mehr Produkt
          feedback: Das Gleichgewicht stellt sich nur **schneller** ein.
        - label: Es entsteht weniger Produkt
          feedback: Die Lage bleibt genau gleich.
    hints:
      - Er senkt den Energieberg – in beide Richtungen.
    explanation: Die Lage des Gleichgewichts hängt nur von den Energien der Stoffe ab, nicht vom Weg.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: A ⇌ B mit K = 4. Im Gleichgewicht liegen 2 mol A und 8 mol B vor. Du gibst 5 mol A dazu. Wie viel Mol B liegen nach der neuen Einstellung vor?
    params:
      unit: mol
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 8
        misconception: no-shift
        text: Das Gleichgewicht weicht aus – es bildet sich neues B.
      - when: numval(state.input) == 28
        misconception: overshoot
        text: Insgesamt gibt es nur 15 mol – davon vier Fünftel B.
    hints:
      - Zusammen sind es jetzt 2 + 8 + 5 = 15 mol.
      - "B : A = 4 : 1, also vier Fünftel B."
    explanation: B = 12 mol, A = 3 mol. Von den 5 zugegebenen mol A wurden 4 umgesetzt – das System weicht dem Zwang aus.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Was ändert die Gleichgewichtskonstante K wirklich?
    params:
      options:
        - label: Nur die Temperatur
          correct: true
        - label: Jede Zugabe von Stoff
          feedback: Zugaben verschieben die Lage, K bleibt.
        - label: Ein Katalysator
          feedback: Er beschleunigt beide Richtungen gleich.
    hints:
      - Druck und Konzentration ändern Q, nicht K.
      - K ist mit ΔG° verknüpft – und dort steht T.
    explanation: "Le Chatelier bei Konzentration oder Druck heißt: Q weicht ab, das System läuft zurück zu K. Bei Temperatur wandert K selbst."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux das Prinzip von Le Chatelier an einem Beispiel.
    params:
      keywords:
        - - gleichgewicht
          - equilibrium
        - - stör
          - zwang
          - ändert
          - change
          - disturb
          - stress
        - - weicht
          - verschieb
          - gegen
          - shift
          - counter
          - oppos
      sample: Stört man ein Gleichgewicht, verschiebt es sich so, dass die Störung kleiner wird. Gibt man zum Beispiel Ausgangsstoff dazu, wird ein Teil davon zu Produkt umgesetzt.
    explanation: Das System arbeitet gegen jede Änderung – wie ein Stehaufmännchen.
    difficulty: 3

srs:
  cards_from: [zugabe, waerme]
