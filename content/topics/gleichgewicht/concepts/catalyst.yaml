id: chem.equilibrium.catalyst
type: concept
title: Katalysatoren
summary: Abkürzung über den Energieberg.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Zwischen zwei Tälern liegt ein hoher Berg. Wie kommen mehr Wanderer hinüber?
    params:
      options:
        - label: Durch einen Tunnel
          correct: true
        - label: Mit einem höheren Berg
          feedback: Dann schaffen es noch weniger.
        - label: Indem man die Täler vertauscht
          feedback: Das ändert den Weg nicht.
    hints:
      - Der Berg ist das Hindernis.
    explanation: Ein Katalysator ist so ein Tunnel für Reaktionen.

  - kind: explain
    id: s1
    body: |
      Viele Reaktionen müssen erst über einen **Energieberg**. Ein **Katalysator** bietet einen Weg mit kleinerem Berg. Er wird dabei nicht verbraucht.

  - kind: problem
    id: verbraucht
    widget: choice
    prompt: Was passiert mit einem Katalysator während der Reaktion?
    params:
      options:
        - { label: Er bleibt am Ende unverändert übrig., correct: true }
        - { label: Er wird aufgebraucht., feedback: "Er hilft immer wieder neu – darum reichen winzige Mengen." }
    hints:
      - Muss man den Auto-Katalysator nachfüllen?
    explanation: Ein Katalysator ist Helfer, nicht Zutat.

  - kind: problem
    id: wo
    widget: match
    prompt: Wo arbeitet welcher Katalysator?
    params:
      pairs:
        - { left: Platin im Auspuff, right: Giftige Abgase umwandeln }
        - { left: Enzyme im Körper, right: Nahrung verdauen }
        - { left: Eisen in Fabriken, right: Ammoniak herstellen }
    hints:
      - Enzyme sind die Katalysatoren des Lebens.
    explanation: Ohne Enzyme liefen die Reaktionen im Körper Millionen Mal zu langsam.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Verändert ein Katalysator, wie viel Produkt am Ende entsteht?
    params:
      options:
        - { label: Nein – nur wie schnell es entsteht., correct: true }
        - { label: Ja – es entsteht mehr., feedback: "Er senkt den Berg in beide Richtungen gleich – das Ziel bleibt dasselbe." }
    hints:
      - Er beschleunigt Hin- und Rückweg gleichermaßen.
    explanation: Katalysatoren sparen Zeit, nicht Material.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Katalysator senkt den [[Energieberg]]. Er wird dabei nicht [[verbraucht]].
      distractors:
        - Siedepunkt
        - erzeugt

  - kind: problem
    id: mix-c2
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Katalysator macht eine Reaktion schneller.
          right: true
        - text: Er ändert, wie viel Produkt am Ende entsteht.
          right: false
          why: Er ändert nur das Tempo.
        - text: Enzyme sind Katalysatoren im Körper.
          right: true
        - text: Nach der Reaktion ist er aufgebraucht.
          right: false
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Der Katalysator im Auto besteht aus Platin auf einer Wabenstruktur. Wozu die Waben?
    params:
      options:
        - label: Sie schaffen eine riesige Oberfläche – dort findet die Reaktion statt
          correct: true
        - label: Sie filtern Ruß heraus
          feedback: Dafür gibt es den Partikelfilter.
        - label: Sie dämpfen den Lärm
          feedback: Das macht der Schalldämpfer.
    hints:
      - Nur Atome an der Oberfläche können wirken.
    explanation: Wenige Gramm Platin bedecken die Fläche mehrerer Fußballfelder.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Der Katalysator im Auto wandelt 9 von 10 Schadstoff-Teilchen um. Wie viele von 500 Teilchen bleiben übrig?
    answer:
      value: 50
    hints:
      - Ein Zehntel bleibt.
    explanation: "500 : 10 = 50. Ohne ihn wären es alle 500."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Liegt der Katalysator in derselben Phase wie die Stoffe (homogen) oder in einer anderen (heterogen)?
    params:
      buckets:
        - id: b1
          label: homogen
        - id: b2
          label: heterogen
      items:
        - label: Enzym in der Zelle
          bucket: b1
        - label: Chloratome beim Ozonabbau
          bucket: b1
        - label: Säure bei der Esterbildung
          bucket: b1
        - label: Platin im Autokatalysator
          bucket: b2
        - label: Eisen beim Haber-Bosch-Verfahren
          bucket: b2
        - label: Nickel beim Härten von Fett
          bucket: b2
    hints:
      - Ein fester Katalysator mit Gasen oder Flüssigkeiten ist heterogen.
      - Enzyme sind gelöst wie ihre Partner.
    explanation: Heterogene Katalysatoren lassen sich leicht abtrennen – darum mag sie die Industrie. Dort zählt jede Oberfläche.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Früher enthielt Benzin Blei. Warum musste es weg, als Autos Katalysatoren bekamen?
    params:
      options:
        - label: Blei setzt sich auf das Platin und blockiert die Oberfläche – es vergiftet den Katalysator
          correct: true
        - label: Blei macht den Motor zu schnell
          feedback: Das Problem lag im Abgas.
        - label: Blei reagiert mit Platin zu Gold
          feedback: Chemisch entsteht kein neues Element.
    hints:
      - Katalysatoren arbeiten an ihrer Oberfläche.
      - Was dort klebt, nimmt den Platz weg.
    explanation: Das heißt **Katalysatorgift**. Bleifreies Benzin schützte so den Kat – und nebenbei Millionen Kinder vor Bleivergiftung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Enzyme machen Reaktionen im Körper rasend schnell. Aber jedes Enzym schafft nur **eine** Reaktion. Warum?
    params:
      options:
        - label: Ihre Form passt nur zu einem Molekül – wie ein Schloss zum Schlüssel
          correct: true
        - label: Sie werden nach einer Reaktion verbraucht
          feedback: Katalysatoren werden nicht verbraucht.
        - label: Der Körper hat nur ein Enzym
          feedback: Er hat Tausende verschiedene.
    hints:
      - Denk an Stärke und Zellulose.
    explanation: "Das **Schlüssel-Schloss-Prinzip**. Darum wirkt Fieber gefährlich: Über 42 °C verlieren Enzyme ihre Form."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Ein Drei-Wege-Kat macht drei Dinge auf einmal. Er verbrennt CO und Reste von Benzin zu CO₂. Und er macht aus giftigen Stickoxiden harmlosen **Stickstoff**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: "Im Autokatalysator: 2 NO + 2 CO → N₂ + ? CO₂. Welche Zahl fehlt?"
    answer:
      value: 2
    hints:
      - Zähle die C-Atome links.
      - "Prüfe auch O: links 2 + 2 = 4."
    explanation: 2 NO + 2 CO → N₂ + 2 CO₂. CO gibt Elektronen ab, NO nimmt sie auf – eine Redoxreaktion am Platin.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Ein Katalysator senkt die Aktivierungsenergie um 10 kJ/mol. Um wie viel schneller wird die Reaktion bei 25 °C etwa?
    params:
      options:
        - label: Etwa 50-mal
          correct: true
        - label: Etwa 10 %
          feedback: Der Effekt wirkt im Exponenten – er ist viel größer.
        - label: Etwa doppelt
          feedback: Das gilt eher für 10 °C Erwärmung.
    hints:
      - Der Anteil schneller Teilchen hängt von e hoch −Eₐ/(RT) ab.
      - "e hoch (10 000 : (8,314 · 298)) = e hoch 4."
    explanation: e⁴ ≈ 55. Schon ein kleiner Abschlag am Berg vervielfacht das Tempo – Enzyme senken ihn oft um 50 kJ/mol und mehr.
    difficulty: 3

srs:
  cards_from: [verbraucht, gleich]
