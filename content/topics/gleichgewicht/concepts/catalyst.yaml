id: chem.equilibrium.catalyst
type: concept
title: Katalysatoren
summary: Abkürzung über den Energieberg.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Viele Reaktionen müssen erst über einen **Energieberg**. Ein **Katalysator** bietet einen Weg mit kleinerem Berg. Er wird dabei nicht verbraucht.

  - kind: problem
    id: verbraucht
    widget: choice
    prompt: Was passiert mit einem Katalysator während der Reaktion?
    params:
      options:
        - { label: Er bleibt am Ende unverändert übrig., correct: true }
        - { label: Er wird aufgebraucht., feedback: "Er hilft immer wieder neu – darum reichen winzige Mengen." }
    hints:
      - Muss man den Auto-Katalysator nachfüllen?
    explanation: Ein Katalysator ist Helfer, nicht Zutat.

  - kind: problem
    id: wo
    widget: match
    prompt: Wo arbeitet welcher Katalysator?
    params:
      pairs:
        - { left: Platin im Auspuff, right: Giftige Abgase umwandeln }
        - { left: Enzyme im Körper, right: Nahrung verdauen }
        - { left: Eisen in Fabriken, right: Ammoniak herstellen }
    hints:
      - Enzyme sind die Katalysatoren des Lebens.
    explanation: Ohne Enzyme liefen die Reaktionen im Körper Millionen Mal zu langsam.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Verändert ein Katalysator, wie viel Produkt am Ende entsteht?
    params:
      options:
        - { label: Nein – nur wie schnell es entsteht., correct: true }
        - { label: Ja – es entsteht mehr., feedback: "Er senkt den Berg in beide Richtungen gleich – das Ziel bleibt dasselbe." }
    hints:
      - Er beschleunigt Hin- und Rückweg gleichermaßen.
    explanation: Katalysatoren sparen Zeit, nicht Material.

srs:
  cards_from: [verbraucht, gleich]
