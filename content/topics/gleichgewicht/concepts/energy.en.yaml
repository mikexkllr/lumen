id: chem.equilibrium.energy
type: concept
title: "Energy in reactions"
summary: "Why some reactions warm, others cool – and all need a push."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 14
steps:
  - kind: problem
    id: c1
    widget: buckets
    prompt: Does it get warm or cold?
    params:
      buckets:
        - id: b1
          label: Gives off heat
        - id: b2
          label: Takes in heat
      items:
        - label: Candle burns
          bucket: b1
        - label: Hand warmer
          bucket: b1
        - label: Instant cold pack
          bucket: b2
        - label: Photosynthesis
          bucket: b2
    hints:
      - What do you feel in your hand? And what does a plant need to grow?
    explanation: Plants store solar energy in sugar. The candle sets stored energy free again.

  - kind: explain
    id: c2
    body: "**Exothermic**: the reaction gives off energy, it gets warm. **Endothermic**: it takes in energy, it gets cold. The reason lies in the bonds between the atoms."

  - kind: problem
    id: c3
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Breaking bonds [[costs]] energy. Forming new bonds [[yields]] energy.
      distractors:
        - destroys
        - colours

  - kind: problem
    id: c4
    widget: numeric
    prompt: In a reaction breaking the bonds costs 900 kJ. The new bonds yield 1200 kJ. How much energy is set free on balance?
    params:
      unit: kJ
    answer:
      value: 300
    hints:
      - Gain minus cost.
    explanation: 1200 − 900 = 300 kJ – an exothermic reaction.

  - kind: problem
    id: c5
    widget: choice
    prompt: Wood does not burn by itself although the reaction yields a lot of energy. Why?
    params:
      options:
        - label: It first needs a push – the activation energy
          correct: true
        - label: Wood holds no energy
          feedback: A campfire proves the opposite.
        - label: The air is too cold
          feedback: Even in summer wood does not ignite itself.
    hints:
      - What do you need a match for?
    explanation: First old bonds must break. This hill is called the **activation energy**.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The energy hill of a reaction is 80 kJ high. Overall it gives off 200 kJ. How high is the hill for the **reverse** reaction?
    params:
      unit: kJ
    answer:
      value: 280
    hints:
      - Going back you first climb the 200 kJ – and then over the top as well.
    explanation: 200 + 80 = 280 kJ. That is why strongly exothermic reactions hardly run backwards.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: What does a catalyst change about this energy hill?
    params:
      options:
        - label: It lowers the top – start and finish stay at the same height
          correct: true
        - label: It lowers the finish
          feedback: The energy set free stays the same.
        - label: It raises the start
          feedback: The substances themselves do not change.
    hints:
      - A tunnel through the hill does not change the height of the valleys.
    explanation: An easier path, the same balance. Forward and reverse reaction both get faster.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "The heat a reaction gives off or takes in at constant pressure is called the **enthalpy** ΔH. If it gives off heat, ΔH is negative: the system loses energy to its surroundings."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Is ΔH negative or positive?
    params:
      buckets:
        - id: b1
          label: ΔH < 0 (exothermic)
        - id: b2
          label: ΔH > 0 (endothermic)
      items:
        - label: Wood burns
          bucket: b1
        - label: Oxyhydrogen explodes
          bucket: b1
        - label: Acid meets base
          bucket: b1
        - label: Ice melts
          bucket: b2
        - label: Photosynthesis
          bucket: b2
        - label: Limestone is burnt to quicklime
          bucket: b2
    hints:
      - If it gets warm, ΔH is negative.
      - Melting and lime burning constantly need heat.
    explanation: "The sign counts from the reaction's point of view: what it gives away is minus."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: "Hess's law: C + O₂ → CO₂ has ΔH = −394 kJ. CO + ½ O₂ → CO₂ has ΔH = −283 kJ. What is ΔH for C + ½ O₂ → CO?"
    params:
      unit: kJ
    answer:
      value: -111
    feedback:
      - when: numval(state.input) == 111
        misconception: sign
        text: "Mind the sign: forming CO also releases heat."
      - when: numval(state.input) == -677
        misconception: hess-reverse
        text: The second reaction must be reversed – and its sign too.
    hints:
      - "Route 1: C straight to CO₂. Route 2: first to CO, then to CO₂."
      - "Both routes give −394 kJ in total: x + (−283) = −394."
    explanation: x = −394 + 283 = −111 kJ. The energy depends only on start and finish, not on the route.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Methane burns. Breaking the old bonds costs 2648 kJ per mole. The new bonds in CO₂ and water yield 3466 kJ. How much energy is set free per mole?
    params:
      unit: kJ
    answer:
      value: 818
    hints:
      - 3466 − 2648.
    explanation: About 800 kJ per mole – that is only 16 g of methane. That is why natural gas heats so well.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: A cold pack gets cold by itself although the reaction **takes in** energy. What drives it?
    params:
      options:
        - label: Entropy – the disorder rises sharply
          correct: true
        - label: A catalyst
          feedback: It only makes things faster, not possible.
        - label: Nothing – that is impossible
          feedback: You can buy it in any pharmacy.
    hints:
      - "A salt dissolves: an ordered crystal becomes freely floating particles."
    explanation: Whether a reaction runs by itself is decided by energy **and** entropy together – the free enthalpy.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: when is a reaction exothermic, and when is it endothermic?"
    params:
      keywords:
        - - exotherm
        - - endotherm
        - - abgibt
          - gibt
          - frei
          - give
          - releas
          - warm
        - - aufnimmt
          - nimmt
          - take
          - absorb
          - kalt
          - cold
      sample: If a reaction gives off energy, it gets warm. That is exothermic. If it takes in energy, it gets cold. That is endothermic.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Whether a reaction runs by itself is decided by the **Gibbs free energy**: $\\Delta G = \\Delta H - T \\cdot \\Delta S$. If ΔG is negative, it runs spontaneously. Releasing heat and creating disorder both help."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: "Ammonium nitrate dissolves in water: ΔH = +25.7 kJ/mol, ΔS = +0.1087 kJ/(mol·K). What is ΔG at 298 K? Give one decimal place."
    answer:
      value: -6.7
      tolerance: 0.06
    feedback:
      - when: abs(numval(state.input) - 58.1) < 0.2
        misconception: gibbs-sign
        text: Minus T times ΔS – not plus.
    hints:
      - T · ΔS = 298 · 0.1087 ≈ 32.4 kJ/mol.
      - ΔG = 25.7 − 32.4.
    explanation: "ΔG ≈ −6.7 kJ/mol: it dissolves spontaneously even though it absorbs heat. Entropy wins – that is how the cold pack works."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: "Limestone breaks down: CaCO₃ → CaO + CO₂ with ΔH = +178 kJ/mol and ΔS = +0.161 kJ/(mol·K). Above what temperature does ΔG turn negative? Round to whole kelvin."
    params:
      unit: K
    answer:
      value: 1106
      tolerance: 3
    hints:
      - At the threshold ΔG = 0, so ΔH = T · ΔS.
      - T = 178 ÷ 0.161.
    explanation: T ≈ 1106 K, so just over 830 °C. That is why lime kilns run at about 900 °C.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: match
    prompt: ΔG = ΔH − T·ΔS. When does the reaction run by itself?
    params:
      pairs:
        - left: ΔH < 0 and ΔS > 0
          right: always
        - left: ΔH > 0 and ΔS < 0
          right: never
        - left: ΔH < 0 and ΔS < 0
          right: only at low temperature
        - left: ΔH > 0 and ΔS > 0
          right: only at high temperature
    hints:
      - The higher T, the more the entropy term counts.
      - "Water freezes: ΔH < 0, ΔS < 0 – only in the cold."
    explanation: Temperature weights the entropy. That is why some reactions reverse when heated.
    difficulty: 3

srs:
  cards_from: ["c4", "d1"]
