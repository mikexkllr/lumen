id: chem.equilibrium.speed
type: concept
title: Wie schnell reagiert es?
summary: Temperatur, Oberfläche, Konzentration.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Wo wird Milch schneller sauer?
    params:
      options:
        - label: Auf dem warmen Tisch
          correct: true
        - label: Im Kühlschrank
          feedback: Dafür ist der Kühlschrank ja da.
        - label: Überall gleich schnell
          feedback: Dann bräuchte niemand einen Kühlschrank.
    hints:
      - Wozu kühlt man Lebensmittel?
    explanation: Wärme macht Reaktionen schneller. Warum, siehst du gleich.

  - kind: explain
    id: s1
    body: |
      Teilchen reagieren nur, wenn sie **zusammenstoßen** – und zwar heftig genug. Alles, was mehr oder härtere Stöße bewirkt, beschleunigt eine Reaktion.

  - kind: problem
    id: tempo
    widget: buckets
    prompt: Wird die Reaktion schneller oder langsamer?
    params:
      buckets: [{ label: schneller }, { label: langsamer }]
      items:
        - { label: Höhere Temperatur, bucket: schneller }
        - { label: Feineres Pulver statt Klumpen, bucket: schneller }
        - { label: Höhere Konzentration, bucket: schneller }
        - { label: Lagern im Kühlschrank, bucket: langsamer }
    hints:
      - Mehr Stöße oder weniger?
    explanation: Darum hält Essen im Kühlschrank länger – Verderben ist auch Chemie.

  - kind: problem
    id: regel
    widget: numeric
    prompt: Faustregel – je 10 °C wärmer, doppelt so schnell. Wievielmal schneller läuft eine Reaktion bei {{10 * k}} °C mehr?
    params: { unit: "-mal" }
    answer: { value: "{{2 ** k}}" }
    feedback:
      - when: "numval(state.input) == 2 * k"
        misconception: linear
        text: Jede Stufe verdoppelt – das multipliziert sich.
    hints:
      - "{{k}}-mal verdoppeln."
    explanation: "$2^{ {{k}} } = {{2 ** k}}$-mal so schnell."
    variants:
      params: { k: "int[3,5]" }
      defaults: { k: 3 }

  - kind: problem
    id: mehl
    widget: choice
    prompt: Ein Mehlsack brennt kaum – fein verteilter Mehlstaub kann explodieren. Warum?
    params:
      options:
        - { label: Feiner Staub hat eine riesige Oberfläche., correct: true }
        - { label: Staub ist heißer., feedback: "Die Temperatur ist gleich – die Kontaktfläche zum Sauerstoff nicht." }
    hints:
      - Wo kann Sauerstoff angreifen?
    explanation: Mehr Oberfläche, mehr Stöße – die Reaktion läuft explosionsartig.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Temperatur erhöhen
          right: true
        - text: Lebensmittel in den Kühlschrank stellen
          right: false
        - text: Einen Stoff fein zermahlen
          right: true
        - text: Eine Lösung verdünnen
          right: false
      left: Langsamer
      right: Schneller

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Milch wird bei 20 °C in 1 Tag sauer. Wie viele Tage hält sie nach der Faustregel bei 0 °C?
    answer:
      value: 4
    hints:
      - 20 Grad kälter sind zwei Halbierungen des Tempos.
    explanation: Viermal so lang. Darum gibt es Kühlschränke.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: choice
    prompt: Stahlwolle glimmt an der Luft nur. In reinem Sauerstoff verbrennt sie mit Funkenregen. Warum?
    params:
      options:
        - label: In reinem Sauerstoff treffen fast fünfmal so viele O₂-Teilchen das Eisen
          correct: true
        - label: Reiner Sauerstoff ist heißer
          feedback: Er hat dieselbe Temperatur.
        - label: Stickstoff ist ein Katalysator
          feedback: Stickstoff bremst eher, weil er Platz wegnimmt.
    hints:
      - Luft hat 21 % Sauerstoff.
      - Mehr Teilchen, mehr Zusammenstöße.
    explanation: Höhere Konzentration heißt mehr Stöße pro Sekunde. Darum ist reiner Sauerstoff in Kliniken streng gesichert.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Würfel mit 1 cm Kantenlänge wird in Würfelchen mit 1/{{n}} cm Kante zerteilt. Wievielmal so groß ist die gesamte Oberfläche danach?
    answer:
      value: "{{n}}"
    feedback:
      - when: numval(state.input) == n * n * n
        misconception: count-not-area
        text: Das ist die Zahl der Würfelchen. Jedes hat aber eine viel kleinere Fläche.
    hints:
      - Es gibt {{n * n * n}} Würfelchen mit je 6 · (1/{{n}})² cm².
      - "Gesamt: 6 · {{n}} cm² statt 6 cm²."
    explanation: Die Oberfläche wächst {{n}}-fach. Zu Staub gemahlen wird sie riesig – darum explodiert Mehlstaub.
    difficulty: 2
    variants:
      params:
        n: int[2,10]
      defaults:
        n: 10

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum verdoppelt eine kleine Erwärmung um 10 °C das Tempo, obwohl die Teilchen nur 2 % schneller werden?
    params:
      options:
        - label: Der Anteil der Teilchen mit genug Energie für die Reaktion wächst sprunghaft
          correct: true
        - label: Die Teilchen stoßen doppelt so oft zusammen
          feedback: Die Stoßzahl steigt nur um wenige Prozent.
        - label: Die Faustregel ist falsch
          feedback: Sie stimmt für viele Reaktionen gut.
    hints:
      - Nur die schnellsten Teilchen schaffen den Energieberg.
    explanation: "Die **Arrhenius-Gleichung**: Das Tempo hängt exponentiell von der Temperatur ab."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: "Eine Reaktion läuft in drei Schritten: zwei schnelle und ein sehr langsamer. Wovon hängt das Gesamttempo ab?"
    params:
      options:
        - label: Vom langsamsten Schritt – wie ein Stau an der engsten Stelle
          correct: true
        - label: Vom Mittelwert aller drei
          feedback: Schnelle Schritte warten auf den langsamen.
        - label: Vom schnellsten Schritt
          feedback: Der schnellste kann nicht mehr liefern, als nachkommt.
    hints:
      - Denk an eine Flasche mit engem Hals.
      - Alles muss durch den Engpass.
    explanation: Der langsamste Schritt heißt **geschwindigkeitsbestimmend**. Katalysatoren greifen meist genau dort an.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Wasserstoff und Sauerstoff verbrennen nicht einfach ruhig – Knallgas explodiert. Warum so heftig?
    params:
      options:
        - label: Jedes Radikal erzeugt zwei neue – die Kette verzweigt sich lawinenartig
          correct: true
        - label: Wasserstoff ist radioaktiv
          feedback: Das ist er nicht.
        - label: Es entsteht ein giftiges Gas
          feedback: Es entsteht nur Wasser.
    hints:
      - Radikale sind Teilchen mit einem ungepaarten Elektron.
      - H· + O₂ → HO· + ·O· – aus einem werden zwei.
    explanation: Bei verzweigten Kettenreaktionen wächst die Zahl der Radikale exponentiell. Innerhalb von Millisekunden reagiert alles.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Wärme eine Reaktion schneller macht.
    params:
      keywords:
        - - stoß
          - stöße
          - zusammenst
          - collid
          - collision
        - - schnell
          - energie
          - energy
          - fast
          - heftig
        - - aktivierung
          - activation
          - berg
          - barrier
          - genug
          - enough
      sample: "Teilchen reagieren nur, wenn sie zusammenstoßen und genug Energie für den Aktivierungsberg mitbringen. In der Wärme sind sie schneller: Sie stoßen öfter und heftiger, und viel mehr Stöße schaffen es über den Berg."
    explanation: Mehr Stöße – und vor allem mehr energiereiche Stöße.
    difficulty: 3

srs:
  cards_from: [tempo, mehl]
