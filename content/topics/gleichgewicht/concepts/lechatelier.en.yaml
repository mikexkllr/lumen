id: chem.equilibrium.lechatelier
type: concept
title: Le Chatelier's principle
summary: The equilibrium sidesteps.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Under pressure
    body: "Push the piston in and watch: the pressure rises. A chemical **equilibrium** reacts to such pressure – it dodges. Try it out before you find out which way."
    visual:
      widget: sim
      interactive: true
      params:
        scene: gas
        controls:
          temperature:
            fixed: true

  - kind: problem
    id: hook
    widget: choice
    prompt: "You open a bottle of fizzy water: the pressure drops. What happens in the water?"
    params:
      options:
        - label: Gas bubbles out
          correct: true
        - label: More gas dissolves
          feedback: That would need more pressure.
        - label: Nothing
          feedback: You hear it hiss.
    hints:
      - What do you see and hear when opening it?
    explanation: The system counteracts the change. There is a principle behind it.

  - kind: explain
    id: s1
    body: |
      If you disturb an **equilibrium**, it **counteracts the change**. Add reactant, and more product forms. Raise the pressure, and it favors the side with fewer gas particles.

  - kind: problem
    id: zugabe
    widget: choice
    prompt: You add more reactant to an equilibrium. What happens?
    params:
      options:
        - { label: More product forms., correct: true }
        - { label: Less product forms., feedback: "The system removes the excess, toward the product side." }
        - { label: Nothing, feedback: "The disturbance is balanced out, and that changes the amounts." }
    hints:
      - How does the system get rid of the excess?
    explanation: The excess is used up and becomes product.

  - kind: problem
    id: sprudel
    widget: choice
    prompt: Why does a bottle of sparkling water fizz when you open it?
    params:
      options:
        - { label: "The pressure drops, and dissolved CO₂ escapes as gas.", correct: true }
        - { label: Because it was shaken., feedback: "It fizzes even when not shaken. Pressure decides." }
    hints:
      - What changes when you open it?
    explanation: Lower pressure shifts the equilibrium toward gaseous CO₂.

  - kind: problem
    id: waerme
    widget: choice
    prompt: A reaction gives off heat. You heat the equilibrium. What happens?
    params:
      options:
        - { label: Less product forms., correct: true }
        - { label: More product forms., feedback: "The reaction itself releases heat, and extra heat pushes it back." }
    hints:
      - Here, heat is like a product of the reaction.
    explanation: The system counteracts the heat and runs more in reverse.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Adding more starting material
          right: true
        - text: Removing product continuously
          right: true
        - text: Adding product
          right: false
        - text: Heating a heat-releasing reaction
          right: false
      left: Less product
      right: More product

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Nitrogen and hydrogen become ammonia. The reaction gives off heat and uses up gas particles. What yields more ammonia?
    params:
      buckets:
        - id: b1
          label: More ammonia
        - id: b2
          label: Less ammonia
      items:
        - label: Raise the pressure
          bucket: b1
        - label: Add nitrogen
          bucket: b1
        - label: Raise the temperature
          bucket: b2
        - label: Keep removing ammonia
          bucket: b1
        - label: Lower the pressure
          bucket: b2
    hints:
      - The equilibrium dodges every disturbance.
    explanation: More heat pushes the reaction back because it gives off heat itself.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: If you disturb an equilibrium, it dodges the [[stress]]. More pressure favours the side with [[fewer]] gas particles.
      distractors:
        - chance
        - faster

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: At high altitude there is less oxygen. How does the body respond after a few weeks?
    params:
      options:
        - label: It makes more red blood cells – and thus compensates for the shortage
          correct: true
        - label: It breathes more slowly
          feedback: It breathes faster.
        - label: Not at all
          feedback: Altitude training uses exactly this adaptation.
    hints:
      - Less oxygen shifts the equilibrium – more haemoglobin offsets it.
    explanation: More haemoglobin shifts the equilibrium O₂ + Hb ⇌ HbO₂ back to the right.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: More pressure shifts a gas equilibrium. Shrink the volume until the pressure reaches about 200 kPa.
    params:
      scene: gas
      controls:
        temperature:
          fixed: true
    answer:
      pressure:
        - 195
        - 205
    explanation: At 2.5 litres. Under pressure the equilibrium shifts to the side with fewer gas particles.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: choice
    prompt: "Brown NO₂ is in equilibrium with colourless N₂O₄: 2 NO₂ ⇌ N₂O₄, and the forward reaction is exothermic. What happens in an ice bath?"
    params:
      options:
        - label: The gas gets paler because more N₂O₄ forms
          correct: true
        - label: The gas gets darker
          feedback: Cold favours the heat-releasing direction – towards N₂O₄.
        - label: Nothing – temperature does not shift an equilibrium
          feedback: Temperature is exactly what changes K.
    hints:
      - Cold removes heat. Which direction supplies heat?
      - The forward reaction to N₂O₄ is exothermic.
    explanation: In ice the brown fades, in hot water it darkens. You can see Le Chatelier with the naked eye.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: In carbon monoxide poisoning, CO blocks haemoglobin. Why does pure oxygen under high pressure help?
    params:
      options:
        - label: Lots of O₂ pushes the CO off the haemoglobin, following Le Chatelier
          correct: true
        - label: O₂ destroys the CO directly
          feedback: CO and O₂ hardly react in the blood.
        - label: The pressure squeezes CO out of the lungs
          feedback: It is about an equilibrium at the haemoglobin.
    hints:
      - Hb–CO + O₂ ⇌ Hb–O₂ + CO.
      - More of one reactant shifts it to the right.
    explanation: Haemoglobin binds CO about 200 times more strongly than O₂. Only a large excess of O₂ pushes it back quickly.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A catalyst is added to an equilibrium. What shifts?
    params:
      options:
        - label: Nothing – it speeds up forward and reverse reactions equally
          correct: true
        - label: More product forms
          feedback: The equilibrium is merely reached **faster**.
        - label: Less product forms
          feedback: The position stays exactly the same.
    hints:
      - It lowers the energy barrier – in both directions.
    explanation: The position of equilibrium depends only on the energies of the substances, not on the path.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: A ⇌ B with K = 4. At equilibrium there are 2 mol of A and 8 mol of B. You add 5 mol of A. How many moles of B are there once equilibrium is restored?
    params:
      unit: mol
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 8
        misconception: no-shift
        text: The equilibrium shifts – new B forms.
      - when: numval(state.input) == 28
        misconception: overshoot
        text: There are only 15 mol in total – four fifths of them B.
    hints:
      - Together there are now 2 + 8 + 5 = 15 mol.
      - "B : A = 4 : 1, so four fifths are B."
    explanation: B = 12 mol, A = 3 mol. Of the 5 mol of A added, 4 were converted – the system gives way to the change.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: What actually changes the equilibrium constant K?
    params:
      options:
        - label: Only temperature
          correct: true
        - label: Any addition of substance
          feedback: Additions shift the position, K stays.
        - label: A catalyst
          feedback: It speeds up both directions equally.
    hints:
      - Pressure and concentration change Q, not K.
      - K is linked to ΔG° – and that contains T.
    explanation: "Le Chatelier with concentration or pressure means: Q moves away and the system runs back to K. With temperature, K itself moves."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Explain Le Chatelier's principle to Lux with an example.
    params:
      keywords:
        - - gleichgewicht
          - equilibrium
        - - stör
          - zwang
          - ändert
          - change
          - disturb
          - stress
        - - weicht
          - verschieb
          - gegen
          - shift
          - counter
          - oppos
      sample: If you disturb an equilibrium, it shifts so as to reduce the disturbance. For example, if you add reactant, some of it is turned into product.
    explanation: The system works against every change – like a roly-poly toy.
    difficulty: 3

srs:
  cards_from: [zugabe, waerme]
