id: bio.body.digestion
type: concept
title: "Die Verdauung"
summary: "Die Reise eines Bissens vom Mund bis zum Darm."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: order
    prompt: Ein Bissen Brot geht auf Reise. Bring die Stationen in die richtige Reihenfolge.
    params:
      items:
        - label: Mund
        - label: Speiseröhre
        - label: Magen
        - label: Dünndarm
        - label: Dickdarm
        - label: Enddarm
    hints:
      - Nach dem Schlucken kommt ein Muskelschlauch.
      - Erst der dünne, dann der dicke Darm.
    explanation: Mund, Speiseröhre, Magen, Dünndarm, Dickdarm, Enddarm – zusammen viele Meter lang.

  - kind: explain
    id: c1
    body: Bei der **Verdauung** zerlegt der Körper Nahrung in winzige Bausteine. Aus Stärke wird Zucker, aus Eiweiß werden Aminosäuren. Nur so kleine Teile gelangen ins Blut.

  - kind: problem
    id: c2
    widget: match
    prompt: Was passiert wo?
    params:
      pairs:
        - left: Mund
          right: Kauen und Speichel
        - left: Magen
          right: Säure tötet Keime
        - left: Dünndarm
          right: Bausteine ins Blut
        - left: Dickdarm
          right: Wasser zurückholen
        - left: Leber
          right: Galle bilden
    hints:
      - Wo ist es besonders sauer?
      - Der Dünndarm ist lang – dort wird am meisten aufgenommen.
    explanation: Jede Station hat ihren Job. Die meiste Arbeit leistet der Dünndarm.

  - kind: problem
    id: c3
    widget: choice
    prompt: Kau ein Stück Brot sehr lange. Es schmeckt plötzlich süß. Warum?
    params:
      options:
        - label: Der Speichel spaltet Stärke in Zucker.
          correct: true
        - label: Brot enthält viel Zucker.
          feedback: Brot enthält vor allem Stärke. Erst im Mund entsteht Zucker.
        - label: Die Zunge wird müde.
          feedback: Die Zunge schmeckt richtig. Etwas im Brot hat sich verändert.
    hints:
      - Speichel ist mehr als Wasser.
      - Er enthält ein Enzym namens Amylase.
    explanation: Amylase im Speichel zerlegt Stärke in Zucker. Die Verdauung beginnt also schon im Mund.

  - kind: problem
    id: c4
    widget: estimate
    prompt: Wie lang ist dein Dünndarm etwa?
    params:
      min: 0.5
      max: 20
      unit: m
    answer:
      value: 5
      tolerance: 1.5
    explanation: Etwa 3 bis 7 Meter, je nach Messung. Er liegt in vielen Schlingen im Bauch.

  - kind: explain
    id: d1
    depth: 2
    body: "**Enzyme** sind Eiweiße, die Stoffe zerlegen, ohne sich zu verbrauchen. Jedes passt nur zu einem Stoff, wie ein Schlüssel zum Schloss."

  - kind: problem
    id: d2
    depth: 2
    widget: match
    prompt: Welches Enzym zerlegt was?
    params:
      pairs:
        - left: Amylase
          right: Stärke
        - left: Pepsin
          right: Eiweiß
        - left: Lipase
          right: Fett
    hints:
      - Amylase kennst du schon aus dem Speichel.
      - Lip- steht für Fett, wie in »Lipide«.
    explanation: Amylase spaltet Stärke, Pepsin im Magen Eiweiß, Lipase im Dünndarm Fett.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: estimate
    prompt: Der Dünndarm hat Falten, Zotten und Mikrozotten. Wie groß ist die ganze innere Oberfläche des Darms?
    params:
      min: 1
      max: 1000
      scale: log
      unit: m²
    answer:
      value: 32
      within: 50
    explanation: Neue Messungen ergeben rund 30 m², eine kleine Wohnung. Früher hieß es oft »ein Tennisplatz« – das war zu hoch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Magensäure hat einen pH-Wert von 1 bis 2. Warum verdaut der Magen sich nicht selbst?
    params:
      options:
        - label: Eine Schleimschicht mit basischem Puffer schützt die Wand, und die Zellen erneuern sich ständig.
          correct: true
        - label: Magensäure ist gar nicht stark.
          feedback: pH 1 bis 2 ist stärker als Zitronensaft. Der Schutz kommt von der Wand.
        - label: Der Magen ist aus Knorpel.
          feedback: Der Magen ist ein Muskel mit Schleimhaut.
    hints:
      - Was liegt zwischen Säure und Magenwand?
      - Fällt der Schutz aus, entsteht ein Geschwür.
    explanation: Schleim und Hydrogencarbonat puffern die Säure. Das Bakterium Helicobacter pylori kann den Schutz stören – das erkannten Marshall und Warren, Nobelpreis 2005.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie aus einem Brot Zucker in deinem Blut wird.
    params:
      keywords:
        - - stärke
          - staerke
          - starch
        - - enzym
          - amylase
          - enzyme
        - - zucker
          - glucose
          - sugar
        - - dünndarm
          - duenndarm
          - darm
          - intestin
          - gut
        - - blut
          - blood
      sample: Brot besteht aus Stärke. Das Enzym Amylase im Speichel und im Dünndarm zerlegt sie in Zucker. Der Zucker ist so klein, dass er durch die Darmwand ins Blut gelangt.
    explanation: Große Moleküle werden zerlegt, kleine werden aufgenommen.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d3"]
