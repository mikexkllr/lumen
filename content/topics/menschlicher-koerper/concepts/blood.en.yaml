id: bio.body.blood
type: concept
title: "Blood and vessels"
summary: "What floats in your blood and how it gets everywhere."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: How many litres of blood does an adult have?
    params:
      min: 0.5
      max: 20
      unit: L
    answer:
      value: 5
      tolerance: 1
    explanation: About 5 litres, roughly 7 to 8 % of body weight.

  - kind: explain
    id: c1
    body: Blood is a liquid full of cells. A little over half is **blood plasma**, a yellowish solution of water, salts and nutrients. Red and white blood cells and platelets float in it.

  - kind: problem
    id: c2
    widget: match
    prompt: Who does which job?
    params:
      pairs:
        - left: Red blood cells
          right: Carry oxygen
        - left: White blood cells
          right: Fight germs
        - left: Platelets
          right: Seal wounds
        - left: Blood plasma
          right: Dissolve nutrients
    hints:
      - The red ones colour the blood – through the substance that binds oxygen.
      - Platelets are cell fragments that stick together.
    explanation: "Transport, defence, clotting and dissolving: blood is delivery service, guard and plaster all at once."

  - kind: explain
    id: c3
    body: "**Arteries** carry blood away from the heart. Veins carry it back to the heart. In between lie the capillaries, hair-thin vessels. There the blood exchanges substances with the cells."

  - kind: problem
    id: c4
    widget: buckets
    prompt: Artery, vein or capillary?
    params:
      buckets:
        - id: b1
          label: Artery
        - id: b2
          label: Vein
        - id: b3
          label: Capillary
      items:
        - label: Leads away from the heart
          bucket: b1
        - label: Thick, elastic wall
          bucket: b1
        - label: Leads to the heart
          bucket: b2
        - label: Has pocket valves
          bucket: b2
        - label: Wall only one cell thick
          bucket: b3
        - label: O₂ and CO₂ swap here
          bucket: b3
    hints:
      - Where is the pressure high, where low?
      - Veins have valves so the blood does not sink back.
    explanation: Arteries withstand high pressure. Veins need valves. Capillaries are thin for exchange.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A person has {{v}} L of blood. {{z}} % of it is cells, the rest plasma. How many litres of plasma is that?
    params:
      unit: L
    answer:
      value: "{{v * (100 - z) / 100}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == v * z / 100
        misconception: share-swap
        text: That is the cell share. The question asks for plasma, the rest.
    hints:
      - What percentage is plasma?
      - 100 − {{z}} = {{100 - z}} %. Take that share of {{v}} L.
    explanation: "{{100 - z}} % of {{v}} L is {{v * (100 - z) / 100}} L of plasma."
    difficulty: 2
    variants:
      params:
        v: choice[4,5,6]
        z: choice[40,45]
      defaults:
        v: 5
        z: 45

  - kind: explain
    id: d2
    depth: 2
    body: Red blood cells are packed with **haemoglobin**. This protein contains iron and binds oxygen in the lungs. In the tissues it releases it again. That is why iron deficiency makes you tired.

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Blood pressure 120 over 80 – what do the two numbers mean?
    params:
      options:
        - label: The pressure during a heartbeat and in the pause between
          correct: true
        - label: The pressure in arm and leg
          feedback: It is measured in one place, at two moments.
        - label: Pulse and breaths per minute
          feedback: Both numbers are pressures in mmHg.
    hints:
      - The pressure rises and falls with each beat.
      - The upper value is the highest, the lower one the lowest.
    explanation: Systolic 120 mmHg during ejection, diastolic 80 mmHg during relaxation.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The pulmonary artery carries oxygen-poor blood. Why is it still called an artery?
    params:
      options:
        - label: Because it leads away from the heart. Only the direction counts.
          correct: true
        - label: Because it is drawn in red.
          feedback: Colours in diagrams are only a guide, not a definition.
        - label: That is a textbook error.
          feedback: 'No: artery means "away from the heart", not "oxygen-rich".'
    hints:
      - How did we define arteries?
      - From the right ventricle the blood goes to the lungs.
    explanation: "Artery means: away from the heart. Pulmonary artery: low in O₂. Pulmonary vein: rich in O₂."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Blood flows slowest in the capillaries. Why, even though they are so thin?
    params:
      options:
        - label: There are billions of them. Their combined cross-section is far larger than that of the aorta.
          correct: true
        - label: The blood gets thicker there.
          feedback: The viscosity stays about the same. It is about area.
        - label: The heart pumps more weakly there.
          feedback: The heart pumps from one place. What matters is the branching.
    hints:
      - The same amount of blood must pass through all capillaries together each second.
      - A large cross-section means slow flow, like a wide river.
    explanation: Flow = cross-section × speed. The total cross-section is huge, so the speed is low. That gives time for exchange.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what blood carries and how it flows through the vessels.
    params:
      keywords:
        - - sauerstoff
          - oxygen
          - o2
          - o₂
        - - arterie
          - artery
          - arteries
        - - vene
          - vein
        - - kapillar
          - capillar
        - - abwehr
          - keim
          - immun
          - germ
          - defen
      sample: Red blood cells carry oxygen, white ones fight germs. Arteries carry blood away from the heart, veins bring it back. In the capillaries it exchanges substances with the cells.
    explanation: "Blood is the transport system: way out, way back, and exchange in between."
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "d1"]
