id: bio.body.digestion
type: concept
title: "Digestion"
summary: "The journey of a bite from mouth to gut."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Journey inside
    body: Every slice of bread you eat disappears into a long laboratory. There it is broken down into tiny building blocks. Uncover the cards and see what your **digestion** achieves.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ⏱️
            front: How long is the journey?
            back: Usually one to three days – from the first bite to the loo.
          - icon: 🤸
            front: Eating upside down?
            back: It works! Muscles push each bite along in waves, not gravity.
          - icon: 💦
            front: How much saliva?
            back: About a litre a day – enough for a big bottle.
          - icon: 🦠
            front: Who helps?
            back: Trillions of bacteria in your large intestine break down what you cannot.

  - kind: problem
    id: hook
    widget: order
    prompt: A bite of bread goes on a journey. Put the stops in the right order.
    params:
      items:
        - label: Mouth
        - label: Gullet
        - label: Stomach
        - label: Small intestine
        - label: Large intestine
        - label: Rectum
    hints:
      - After swallowing comes a muscular tube.
      - First the small, then the large intestine.
    explanation: Mouth, gullet, stomach, small intestine, large intestine, rectum – many metres in total.

  - kind: explain
    id: c1
    body: In **digestion** the body breaks food into tiny building blocks. Starch becomes sugar, protein becomes amino acids. Only parts that small can enter the blood.

  - kind: problem
    id: c2
    widget: match
    prompt: What happens where?
    params:
      pairs:
        - left: Mouth
          right: Chewing and saliva
        - left: Stomach
          right: Acid kills germs
        - left: Small intestine
          right: Building blocks into blood
        - left: Large intestine
          right: Water taken back
        - left: Liver
          right: Make bile
    hints:
      - Where is it especially acidic?
      - The small intestine is long – most absorption happens there.
    explanation: Each stop has its job. The small intestine does most of the work.

  - kind: problem
    id: c3
    widget: choice
    prompt: Chew a piece of bread for a long time. It suddenly tastes sweet. Why?
    params:
      options:
        - label: Saliva splits starch into sugar.
          correct: true
        - label: Bread contains lots of sugar.
          feedback: Bread contains mostly starch. Sugar forms only in the mouth.
        - label: The tongue gets tired.
          feedback: The tongue tastes correctly. Something in the bread has changed.
    hints:
      - Saliva is more than water.
      - It contains an enzyme called amylase.
    explanation: Amylase in saliva breaks starch into sugar. So digestion starts in the mouth.

  - kind: problem
    id: c4
    widget: estimate
    prompt: About how long is your small intestine?
    params:
      min: 0.5
      max: 20
      unit: m
    answer:
      value: 5
      tolerance: 1.5
    explanation: About 3 to 7 metres, depending on how it is measured. It lies in many loops in the belly.

  - kind: explain
    id: d1
    depth: 2
    body: "**Enzymes** are proteins that break down substances without being used up. Each one fits only one substance, like a key fits a lock."

  - kind: problem
    id: d2
    depth: 2
    widget: match
    prompt: Which enzyme breaks down what?
    params:
      pairs:
        - left: Amylase
          right: Starch
        - left: Pepsin
          right: Protein
        - left: Lipase
          right: Fat
    hints:
      - You already know amylase from saliva.
      - Lip- stands for fat, as in "lipids".
    explanation: Amylase splits starch, pepsin in the stomach splits protein, lipase in the small intestine splits fat.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: estimate
    prompt: The small intestine has folds, villi and microvilli. How large is the gut’s whole inner surface?
    params:
      min: 1
      max: 1000
      scale: log
      unit: m²
    answer:
      value: 32
      within: 50
    explanation: Recent measurements give about 30 m², a small flat. Older books often said "a tennis court" – that was too high.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Stomach acid has a pH of 1 to 2. Why doesn’t the stomach digest itself?
    params:
      options:
        - label: A mucus layer with an alkaline buffer protects the wall, and its cells are constantly renewed.
          correct: true
        - label: Stomach acid isn’t really strong.
          feedback: pH 1 to 2 is stronger than lemon juice. Protection comes from the wall.
        - label: The stomach is made of cartilage.
          feedback: The stomach is a muscle lined with mucous membrane.
    hints:
      - What lies between the acid and the stomach wall?
      - If the protection fails, an ulcer forms.
    explanation: Mucus and bicarbonate buffer the acid. The bacterium Helicobacter pylori can disrupt this protection – shown by Marshall and Warren, Nobel Prize 2005.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how bread turns into sugar in your blood.
    params:
      keywords:
        - - stärke
          - staerke
          - starch
        - - enzym
          - amylase
          - enzyme
        - - zucker
          - glucose
          - sugar
        - - dünndarm
          - duenndarm
          - darm
          - intestin
          - gut
        - - blut
          - blood
      sample: Bread is mostly starch. The enzyme amylase in saliva and the small intestine breaks it into sugar. The sugar is small enough to pass through the gut wall into the blood.
    explanation: Big molecules are broken down, small ones are absorbed.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d3"]
