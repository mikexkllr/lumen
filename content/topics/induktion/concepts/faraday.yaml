id: ee.induction.faraday
type: concept
title: "Induktion: Faraday und Lenz"
summary: "Ein sich änderndes Magnetfeld erzeugt Spannung – und wehrt sich gegen seine Ursache."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du schiebst einen Magneten in eine Spule. Das Messgerät schlägt aus. Dann hältst du den Magneten in der Spule still. Was zeigt es jetzt?
    params:
      options:
        - label: "Null"
          correct: true
        - label: Weiter den gleichen Ausschlag
          feedback: Nur eine Änderung des Feldes erzeugt Spannung.
        - label: Einen noch größeren Ausschlag
          feedback: Ein ruhender Magnet ändert nichts.
    hints:
      - Der Magnet ist da, aber bewegt sich nicht.
      - Es kommt auf die Änderung an.
    explanation: Nur ein sich änderndes Magnetfeld erzeugt Spannung. Ziehst du den Magneten heraus, schlägt das Gerät in die andere Richtung aus.

  - kind: explain
    id: c1
    body: "Das ist **Induktion**: Ändert sich das Magnetfeld in einer Spule, entsteht eine Spannung. Sie ist umso größer, je schneller die Änderung ist und je mehr Windungen die Spule hat."

  - kind: problem
    id: c2
    widget: swipe
    prompt: Wird hier Spannung induziert?
    params:
      cards:
        - text: Ein Magnet liegt ruhig in einer Spule.
          right: false
        - text: Eine Spule dreht sich zwischen zwei Magneten.
          right: true
        - text: Im Nachbardraht wird der Strom eingeschaltet.
          right: true
        - text: Im Nachbardraht fließt konstanter Gleichstrom.
          right: false
        - text: Ein Magnet fällt durch eine Spule.
          right: true
      left: Nein
      right: Ja
    explanation: Immer wenn sich das Feld durch die Spule ändert, entsteht Spannung – egal ob durch Bewegung oder Ein- und Ausschalten.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Der magnetische Fluss Φ misst das Feld durch eine Fläche, in Weber (Wb). In einer Spule mit {{n}} Windungen ändert er sich um {{f}} mWb in {{t}} s. Welche Spannung entsteht?
    params:
      unit: V
    answer:
      value: "{{n * f / 1000 / t}}"
      tolerance: 0.01
    hints:
      - "U = N · ΔΦ : Δt, mit Φ in Wb."
      - "{{n}} · {{f / 1000}} : {{t}}."
    explanation: "{{n}} · {{f / 1000}} Wb : {{t}} s = {{n * f / 1000 / t}} V. Halb so viel Zeit ergäbe doppelt so viel Spannung."
    variants:
      params:
        n: choice[100,200,500]
        f: choice[1,2,5]
        t: choice[0.1,0.5,1]
      defaults:
        n: 100
        f: 2
        t: 0.1

  - kind: explain
    id: d1
    depth: 2
    body: "Die **lenzsche Regel** sagt: Der induzierte Strom wirkt seiner Ursache entgegen. Schiebst du einen Magneten heran, stößt ihn die Spule ab. Ziehst du ihn weg, hält sie ihn fest."

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Ein starker Magnet fällt durch ein senkrechtes Kupferrohr. Kupfer ist nicht magnetisch. Was passiert?
    params:
      options:
        - label: Er fällt auffallend langsam
          correct: true
        - label: Er fällt wie im freien Fall
          feedback: Im Rohr entstehen Wirbelströme, die bremsen.
        - label: Er bleibt im Rohr hängen
          feedback: Die Bremskraft entsteht nur bei Bewegung.
    hints:
      - Das Rohr ist ein Leiter, durch den sich das Feld ändert.
      - Die induzierten Ströme wirken gegen die Bewegung.
    explanation: Im Kupfer laufen Wirbelströme. Nach Lenz bremsen sie den Magneten. Die Bewegungsenergie wird zu Wärme im Rohr.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: match
    prompt: Welches Prinzip steckt dahinter?
    params:
      pairs:
        - left: Induktionsherd
          right: Wirbelströme heizen den Topf
        - left: Fahrraddynamo
          right: Drehender Magnet erzeugt Spannung
        - left: Wirbelstrombremse im ICE
          right: Lenz bremst die Bewegung
        - left: Kabelloses Laden
          right: Spule induziert in Spule
      leftTitle: Gerät
      rightTitle: Prinzip
    hints:
      - Wo wird Wärme erzeugt, wo Strom, wo Bremskraft?
      - Beim kabellosen Laden liegen zwei Spulen übereinander.
    explanation: Alle vier nutzen ein sich änderndes Magnetfeld. Sie unterscheiden sich nur darin, was mit der induzierten Energie passiert.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Auch eine Spule wirkt auf sich selbst. Ändert sich ihr Strom, ändert sich ihr eigenes Feld und induziert eine Gegenspannung U = L · ΔI : Δt. Das ist die **Selbstinduktion**."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Eine Relaisspule hat L = 0,1 H. Ihr Strom von 0,1 A wird in 10 µs abgeschaltet. Wie groß ist die Spannungsspitze?
    params:
      unit: V
    answer:
      value: 1000
    hints:
      - "U = L · ΔI : Δt."
      - "0,1 H · 0,1 A : 0,000 01 s."
    explanation: 1000 V aus einer 5-V-Schaltung! Das zerstört den Transistor, der die Spule schaltet.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Wie schützt man den Schalttransistor vor dieser Spitze?
    params:
      options:
        - label: Eine Diode parallel zur Spule lässt den Strom langsam abklingen
          correct: true
        - label: Einen größeren Schalter nehmen
          feedback: Die Spitze bleibt, solange der Strom schlagartig endet.
        - label: Die Spule mit mehr Windungen wickeln
          feedback: Mehr L macht die Spitze sogar größer.
    hints:
      - Der Strom will weiterfließen. Gib ihm einen Weg.
      - Diese Diode heißt Freilaufdiode.
    explanation: Die Freilaufdiode lässt den Spulenstrom im Kreis weiterfließen, bis die Energie ½ L I² verbraucht ist. Die Spannung bleibt bei etwa 0,7 V über der Versorgung.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux die lenzsche Regel am Beispiel des Magneten im Kupferrohr.
    params:
      keywords:
        - - induz
          - induc
          - wirbelstr
          - eddy
        - - entgegen
          - oppos
          - gegen
          - against
          - brems
          - brake
        - - änder
          - aender
          - chang
          - beweg
          - motion
          - mov
        - - magnet
      sample: Der fallende Magnet ändert das Feld im Kupferrohr. Dadurch werden Wirbelströme induziert. Nach Lenz wirken sie ihrer Ursache entgegen, also der Bewegung. Sie bremsen den Magneten, und er fällt langsam.
    explanation: "Kern: Änderung induziert Strom, und der Strom wehrt sich gegen die Änderung. Sonst gäbe es Energie aus dem Nichts."
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x2"]
