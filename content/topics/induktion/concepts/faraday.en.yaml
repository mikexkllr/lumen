id: ee.induction.faraday
type: concept
title: "Induction: Faraday and Lenz"
summary: "A changing magnetic field makes a voltage – and pushes back against its cause."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You push a magnet into a coil and the meter swings. Then you hold the magnet still inside the coil. What does it show now?
    params:
      options:
        - label: Zero
          correct: true
        - label: The same reading
          feedback: Only a change in the field makes a voltage.
        - label: An even bigger reading
          feedback: A magnet at rest changes nothing.
    hints:
      - The magnet is there but not moving.
      - What matters is the change.
    explanation: Only a changing magnetic field makes a voltage. Pull the magnet out and the meter swings the other way.

  - kind: explain
    id: c1
    body: "This is **induction**: when the magnetic field in a coil changes, a voltage appears. It is larger the faster the change and the more turns the coil has."

  - kind: problem
    id: c2
    widget: swipe
    prompt: Is a voltage induced here?
    params:
      cards:
        - text: A magnet lies still inside a coil.
          right: false
        - text: A coil spins between two magnets.
          right: true
        - text: The current in a nearby wire is switched on.
          right: true
        - text: A steady direct current flows in a nearby wire.
          right: false
        - text: A magnet falls through a coil.
          right: true
      left: No
      right: Yes
    explanation: Whenever the field through the coil changes, a voltage appears – whether by motion or by switching.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Magnetic flux Φ measures the field through an area, in webers (Wb). In a coil with {{n}} turns it changes by {{f}} mWb in {{t}} s. What voltage is induced?
    params:
      unit: V
    answer:
      value: "{{n * f / 1000 / t}}"
      tolerance: 0.01
    hints:
      - U = N × ΔΦ ÷ Δt, with Φ in Wb.
      - "{{n}} × {{f / 1000}} ÷ {{t}}."
    explanation: "{{n}} × {{f / 1000}} Wb ÷ {{t}} s = {{n * f / 1000 / t}} V. Half the time would give twice the voltage."
    variants:
      params:
        n: choice[100,200,500]
        f: choice[1,2,5]
        t: choice[0.1,0.5,1]
      defaults:
        n: 100
        f: 2
        t: 0.1

  - kind: explain
    id: d1
    depth: 2
    body: "**Lenz’s law** says: the induced current opposes its cause. Push a magnet in and the coil repels it. Pull it away and the coil holds it back."

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A strong magnet falls through a vertical copper pipe. Copper is not magnetic. What happens?
    params:
      options:
        - label: It falls remarkably slowly
          correct: true
        - label: It falls freely
          feedback: Eddy currents form in the pipe and brake it.
        - label: It sticks inside the pipe
          feedback: The braking force only appears while it moves.
    hints:
      - The pipe is a conductor in which the field changes.
      - The induced currents oppose the motion.
    explanation: Eddy currents circle in the copper. By Lenz’s law they brake the magnet. Its motion energy becomes heat in the pipe.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: match
    prompt: Which principle is behind it?
    params:
      pairs:
        - left: Induction hob
          right: Eddy currents heat the pot
        - left: Bicycle dynamo
          right: Spinning magnet makes voltage
        - left: Eddy-current brake on a train
          right: Lenz brakes the motion
        - left: Wireless charging
          right: Coil induces in coil
      leftTitle: Device
      rightTitle: Principle
    hints:
      - Where is heat made, where current, where braking?
      - In wireless charging two coils lie on top of each other.
    explanation: All four use a changing magnetic field. They differ only in what happens to the induced energy.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: A coil also acts on itself. When its current changes, its own field changes and induces a back voltage U = L × ΔI ÷ Δt. This is **self-induction**.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A relay coil has L = 0.1 H. Its current of 0.1 A is switched off within 10 µs. How large is the voltage spike?
    params:
      unit: V
    answer:
      value: 1000
    hints:
      - U = L × ΔI ÷ Δt.
      - 0.1 H × 0.1 A ÷ 0.00001 s.
    explanation: 1000 V from a 5 V circuit! That destroys the transistor switching the coil.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: How do you protect the switching transistor from that spike?
    params:
      options:
        - label: A diode across the coil lets the current die down slowly
          correct: true
        - label: Use a bigger switch
          feedback: The spike remains as long as the current stops abruptly.
        - label: Wind the coil with more turns
          feedback: More L makes the spike even larger.
    hints:
      - The current wants to keep flowing. Give it a path.
      - This diode is called a flyback diode.
    explanation: The flyback diode lets the coil current keep circling until the energy ½ L I² is used up. The voltage stays about 0.7 V above the supply.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain Lenz’s law to Lux using the magnet in the copper pipe.
    params:
      keywords:
        - - induz
          - induc
          - wirbelstr
          - eddy
        - - entgegen
          - oppos
          - gegen
          - against
          - brems
          - brake
        - - änder
          - aender
          - chang
          - beweg
          - motion
          - mov
        - - magnet
      sample: The falling magnet changes the field in the copper pipe. That induces eddy currents. By Lenz’s law they oppose their cause, the motion. They brake the magnet and it falls slowly.
    explanation: "The core: change induces current, and the current resists the change. Otherwise there would be energy from nothing."
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x2"]
