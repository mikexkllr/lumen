id: chem.redox.idea
type: concept
title: Electrons on the Move
summary: Oxidation and reduction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: An iron nail lies in the rain for weeks and turns red-brown. What happened?
    params:
      options:
        - label: The iron has reacted with oxygen
          correct: true
        - label: It got dirty
          feedback: Rust cannot be washed off.
        - label: The paint flaked off
          feedback: The nail was not painted.
    hints:
      - "A new substance has formed: rust."
    explanation: In the process electrons moved from the iron to the oxygen.

  - kind: explain
    id: s1
    body: |
      **Oxidation** means a substance gives up electrons. **Reduction** means a substance takes up electrons. Both always happen together – that is why we speak of **redox** reactions.

  - kind: problem
    id: wer
    widget: choice
    prompt: Sodium gives an electron to chlorine. Which substance is oxidized?
    params:
      options:
        - { label: Sodium, correct: true }
        - { label: Chlorine, feedback: "Chlorine takes up the electron – it is reduced." }
    hints:
      - Oxidation means giving up.
    explanation: Sodium is oxidized, chlorine is reduced – together a redox reaction.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Oxidation or reduction?
    params:
      buckets: [{ label: Oxidation }, { label: Reduction }]
      items:
        - { label: Iron gives up electrons, bucket: Oxidation }
        - { label: Magnesium becomes Mg²⁺, bucket: Oxidation }
        - { label: Oxygen takes up electrons, bucket: Reduction }
        - { label: Cu²⁺ becomes copper, bucket: Reduction }
    hints:
      - If the charge becomes more positive, electrons were given up.
    explanation: More plus means electrons lost – oxidation.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: A metal atom becomes an ion with charge {{z}}+. How many electrons did it give up?
    params: { unit: electrons }
    answer: { value: "{{z}}" }
    hints:
      - Each electron given up makes the charge 1 more positive.
    explanation: "{{z}} electrons lost, charge {{z}}+."
    variants:
      params: { z: "int[1,3]" }
      defaults: { z: 2 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In oxidation a substance [[gives off]] electrons, in reduction it [[takes up]] electrons. Both always happen [[together]].
      distractors:
        - in turn
        - further

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The **oxidation number** of oxygen is almost always −2. What is the oxidation number of carbon in CO₂?
    answer:
      value: 4
    hints:
      - "The molecule is neutral: C + 2 · (−2) = 0."
    explanation: +4. In methane CH₄ it is −4 – burning oxidises carbon by eight steps.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "In $2\\,Mg + O_2 \\to 2\\,MgO$: what is the **oxidising agent**?"
    params:
      options:
        - label: Oxygen – it takes up the electrons and is itself reduced
          correct: true
        - label: Magnesium – it is oxidised
          feedback: The oxidising agent oxidises **others** and is itself reduced.
        - label: Magnesium oxide
          feedback: That is the product.
    hints:
      - Who takes the electrons of the magnesium?
    explanation: The oxidising agent is reduced, the reducing agent oxidised – the names describe what they do to the **partner**.
    difficulty: 3

srs:
  cards_from: [wer, sortieren]
