id: chem.redox.idea
type: concept
title: Electrons on the Move
summary: Oxidation and reduction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One idea for everything
    body: "Fire, breathing and batteries look completely different. Yet the same thing happens in all of them: **electrons** move from one substance to another. Uncover the cards and follow them."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🔥
            front: The campfire
            back: Wood hands electrons to oxygen – and heat is released.
          - icon: 🫁
            front: Your breath
            back: In every cell, electrons move from sugar to oxygen. That is how you get energy.
          - icon: 🔋
            front: The battery
            back: Here electrons travel through a wire – and power your phone.
          - icon: 📸
            front: The old photo
            back: Light turns silver ions in the film into dark grains of silver.

  - kind: problem
    id: hook
    widget: choice
    prompt: An iron nail lies in the rain for weeks and turns red-brown. What happened?
    params:
      options:
        - label: The iron has reacted with oxygen
          correct: true
        - label: It got dirty
          feedback: Rust cannot be washed off.
        - label: The paint flaked off
          feedback: The nail was not painted.
    hints:
      - "A new substance has formed: rust."
    explanation: In the process electrons moved from the iron to the oxygen.

  - kind: explain
    id: s1
    body: |
      **Oxidation** means a substance gives up electrons. **Reduction** means a substance takes up electrons. Both always happen together – that is why we speak of **redox** reactions.

  - kind: problem
    id: wer
    widget: choice
    prompt: Sodium gives an electron to chlorine. Which substance is oxidized?
    params:
      options:
        - { label: Sodium, correct: true }
        - { label: Chlorine, feedback: "Chlorine takes up the electron – it is reduced." }
    hints:
      - Oxidation means giving up.
    explanation: Sodium is oxidized, chlorine is reduced – together a redox reaction.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Oxidation or reduction?
    params:
      buckets: [{ label: Oxidation }, { label: Reduction }]
      items:
        - { label: Iron gives up electrons, bucket: Oxidation }
        - { label: Magnesium becomes Mg²⁺, bucket: Oxidation }
        - { label: Oxygen takes up electrons, bucket: Reduction }
        - { label: Cu²⁺ becomes copper, bucket: Reduction }
    hints:
      - If the charge becomes more positive, electrons were given up.
    explanation: More plus means electrons lost – oxidation.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: A metal atom becomes an ion with charge {{z}}+. How many electrons did it give up?
    params: { unit: electrons }
    answer: { value: "{{z}}" }
    hints:
      - Each electron given up makes the charge 1 more positive.
    explanation: "{{z}} electrons lost, charge {{z}}+."
    variants:
      params: { z: "int[1,3]" }
      defaults: { z: 2 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In oxidation a substance [[gives off]] electrons, in reduction it [[takes up]] electrons. Both always happen [[together]].
      distractors:
        - in turn
        - further

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The **oxidation number** of oxygen is almost always −2. What is the oxidation number of carbon in CO₂?
    answer:
      value: 4
    hints:
      - "The molecule is neutral: C + 2 · (−2) = 0."
    explanation: +4. In methane CH₄ it is −4 – burning oxidises carbon by eight steps.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: Oxidation numbers keep count of electrons. We pretend that the electrons in a bond belong to the atom that pulls harder. If an atom's **oxidation number** goes up, it has been oxidised.

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Oxygen counts −2, hydrogen +1. What is the oxidation number of {{el}} in {{f}}? Include the sign, such as −3.
    answer:
      value: "{{ox}}"
    feedback:
      - when: numval(state.input) == -ox
        misconception: ox-sign
        text: "The sign is wrong: next to O the atom is positive, next to H negative."
    hints:
      - All oxidation numbers together add up to the charge of the particle.
      - Count O as −2 and H as +1; the rest belongs to {{el}}.
    explanation: '{{el}} has oxidation number {{ox}} in {{f}}. This shows how much an atom has been "robbed".'
    difficulty: 2
    variants:
      params:
        i: int[0,6]
      derive:
        el: '["S", "S", "N", "N", "C", "Mn", "Fe"][i]'
        f: '["SO₂", "H₂SO₄", "NH₃", "NO₂", "CH₄", "MnO₄⁻", "Fe₂O₃"][i]'
        ox: "[4, 6, -3, 4, -4, 7, 3][i]"
      defaults:
        i: 1

  - kind: problem
    id: ch-d3
    depth: 2
    widget: buckets
    prompt: Does the element gain or lose electrons? Look at how its oxidation number changes.
    params:
      buckets:
        - id: b1
          label: loses electrons (oxidised)
        - id: b2
          label: gains electrons (reduced)
      items:
        - label: Fe → Fe³⁺
          bucket: b1
        - label: C in CH₄ → C in CO₂
          bucket: b1
        - label: S in SO₂ → S in SO₃
          bucket: b1
        - label: Cl₂ → 2 Cl⁻
          bucket: b2
        - label: O₂ → O in H₂O
          bucket: b2
        - label: Cu²⁺ → Cu
          bucket: b2
    hints:
      - Work out the start and end values.
      - C goes from −4 to +4, O from 0 to −2.
    explanation: "Burning is oxidation: carbon rises from −4 to +4. Oxygen is always reduced in the process."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "In $2\\,Mg + O_2 \\to 2\\,MgO$: what is the **oxidising agent**?"
    params:
      options:
        - label: Oxygen – it takes up the electrons and is itself reduced
          correct: true
        - label: Magnesium – it is oxidised
          feedback: The oxidising agent oxidises **others** and is itself reduced.
        - label: Magnesium oxide
          feedback: That is the product.
    hints:
      - Who takes the electrons of the magnesium?
    explanation: The oxidising agent is reduced, the reducing agent oxidised – the names describe what they do to the **partner**.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Redox equations are balanced through the electrons. Every electron given away must be taken up. You write two **half-equations** and match up their electrons.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: Al → Al³⁺ + 3 e⁻ and O₂ + 4 e⁻ → 2 O²⁻. How many Al atoms are needed for 3 O₂?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: electron-balance
        text: "Count the electrons: 3 O₂ take up 12."
    hints:
      - 3 O₂ take up 3 · 4 = 12 electrons.
      - Each Al gives away 3.
    explanation: "12 ÷ 3 = 4 Al. Overall: 4 Al + 3 O₂ → 2 Al₂O₃."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: "Permanganate takes 5 electrons: MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O. Iron gives one: Fe²⁺ → Fe³⁺ + e⁻. How many Fe²⁺ does one MnO₄⁻ oxidise?"
    answer:
      value: 5
    hints:
      - How many electrons does one MnO₄⁻ need?
      - Each Fe²⁺ supplies exactly one.
    explanation: 5 Fe²⁺ per MnO₄⁻. The purple solution turns colourless – that is how iron is measured in the lab by titration.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why one substance can only lose electrons if another one gains them.
    params:
      keywords:
        - - elektron
          - electron
        - - abgeb
          - abgabe
          - gibt
          - give
          - lose
          - oxid
        - - aufnehm
          - nimmt
          - take
          - gain
          - accept
          - redu
      sample: "In oxidation a substance gives away electrons. But electrons cannot simply vanish – another substance must take them and is reduced. So there is only ever both together: redox."
    explanation: Electrons are passed on, not destroyed.
    difficulty: 3

srs:
  cards_from: [wer, sortieren]
