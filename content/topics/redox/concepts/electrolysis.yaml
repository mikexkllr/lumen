id: chem.redox.electrolysis
type: concept
title: Elektrolyse
summary: Mit Strom Stoffe zerlegen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Eine Batterie macht aus einer chemischen Reaktion Strom. Geht das auch umgekehrt?
    params:
      options:
        - label: Ja – Strom kann Reaktionen erzwingen
          correct: true
        - label: Nein, nie
          feedback: Jeder Akku wird so geladen.
        - label: Nur bei Gold
          feedback: Es geht mit sehr vielen Stoffen.
    hints:
      - Was passiert beim Laden eines Akkus?
    explanation: So gewinnt man Aluminium, Chlor und Wasserstoff.

  - kind: explain
    id: s1
    body: |
      Bei der **Elektrolyse** erzwingt Strom eine Redoxreaktion, die von allein nicht abläuft. So zerlegt man Wasser in Wasserstoff und Sauerstoff: $2\,H_2O \to 2\,H_2 + O_2$.

  - kind: problem
    id: gas
    widget: numeric
    prompt: Beim Zerlegen von Wasser entstehen {{v}} Liter Sauerstoff. Wie viel Liter Wasserstoff sind es?
    params: { unit: L }
    answer: { value: "{{2 * v}}" }
    hints:
      - Pro O₂ entstehen zwei H₂. Gleich viele Gasteilchen brauchen gleich viel Platz.
    explanation: "Doppelt so viel – {{2 * v}} Liter."
    variants:
      params: { v: "int[2,10]" }
      defaults: { v: 5 }

  - kind: problem
    id: akku
    widget: choice
    prompt: Was passiert chemisch, wenn du einen Akku auflädst?
    params:
      options:
        - { label: Strom kehrt die Entlade-Reaktion um., correct: true }
        - { label: Man füllt neue Elektronen ein., feedback: "Die Elektronen werden nur zurückgeschoben – die Stoffe zurückverwandelt." }
    hints:
      - Laden ist das Gegenteil von Entladen.
    explanation: Aufladen ist eine Elektrolyse im Kleinen.

  - kind: problem
    id: gruen
    widget: choice
    prompt: Wann ist Wasserstoff »grün«?
    params:
      options:
        - { label: Wenn der Strom für die Elektrolyse aus erneuerbaren Quellen stammt, correct: true }
        - { label: Wenn das Gas grün leuchtet, feedback: "Wasserstoff ist farblos – grün beschreibt die Herkunft der Energie." }
    hints:
      - Woher kommt die Energie für die Zerlegung?
    explanation: Grüner Wasserstoff speichert Sonnen- und Windstrom chemisch.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Aluminium kommt in der Natur nur als Oxid vor. Wie gewinnt man das Metall?
    params:
      options:
        - label: Durch Elektrolyse der Schmelze – mit enorm viel Strom
          correct: true
        - label: Durch Erhitzen mit Kohle wie bei Eisen
          feedback: Aluminium hält Sauerstoff zu fest dafür.
        - label: Durch Filtern
          feedback: Es ist chemisch gebunden.
    hints:
      - Aluminium ist sehr unedel – Kohle reicht als Reduktionsmittel nicht.
    explanation: "Darum lohnt sich Recycling: Es spart 95 % der Energie."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Um 1 mol Kupfer aus Cu²⁺ abzuscheiden, braucht man 2 mol Elektronen. Ein Mol Elektronen trägt 96 500 Coulomb. Wie viele Stunden dauert das bei 10 A? Auf eine Stelle.
    params:
      unit: h
    answer:
      value: 5.4
      tolerance: 0.1
    hints:
      - "193 000 C : 10 A = 19 300 s."
    explanation: 19 300 s ≈ 5,4 h. Die **Faraday-Gesetze** verbinden Strom und Stoffmenge.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie erzeugt eine Batterie Strom?"
    params:
      keywords:
        - - elektron
          - electron
        - - abgeb
          - gibt
          - oxid
          - release
          - give
          - lose
        - - aufnehm
          - nimmt
          - redu
          - accept
          - take
          - gain
        - - draht
          - gerät
          - leiter
          - kreis
          - wire
          - device
          - circuit
          - außen
          - outside
      min: 3
      sample: An einem Pol gibt ein Stoff Elektronen ab, am anderen nimmt ein Stoff sie auf. Weil beide getrennt sind, müssen die Elektronen außen durch das Gerät fließen – das ist der Strom.
    difficulty: 3

srs:
  cards_from: [gas, akku]
