id: chem.redox.electrolysis
type: concept
title: Elektrolyse
summary: Mit Strom Stoffe zerlegen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Teurer als Gold
    body: "Reines Aluminium war einst teurer als Gold. Heute steckt es in jeder Getränkedose. Deck die Karten der Reihe nach auf: Was ist seitdem passiert – und wie zerlegt man so feste **Verbindungen**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: ⚗️
            front: "1807: Davy"
            back: Humphry Davy gewann als Erster reines Natrium und Kalium.
          - icon: 🍴
            front: "Um 1860: Napoleon III."
            back: Der Kaiser aß mit Besteck aus Aluminium. Es galt als wertvoller als Gold.
          - icon: 🚀
            front: "Heute: die ISS"
            back: Die Station gewinnt ihren Atem-Sauerstoff aus Wasser – sie spaltet es Tag für Tag.

  - kind: problem
    id: hook
    widget: choice
    prompt: Eine Batterie macht aus einer chemischen Reaktion Strom. Geht das auch umgekehrt?
    params:
      options:
        - label: Ja – Strom kann Reaktionen erzwingen
          correct: true
        - label: Nein, nie
          feedback: Jeder Akku wird so geladen.
        - label: Nur bei Gold
          feedback: Es geht mit sehr vielen Stoffen.
    hints:
      - Was passiert beim Laden eines Akkus?
    explanation: So gewinnt man Aluminium, Chlor und Wasserstoff.

  - kind: explain
    id: s1
    body: |
      Bei der **Elektrolyse** erzwingt Strom eine Redoxreaktion, die von allein nicht abläuft. So zerlegt man Wasser in Wasserstoff und Sauerstoff: $2\,H_2O \to 2\,H_2 + O_2$.

  - kind: problem
    id: gas
    widget: numeric
    prompt: Beim Zerlegen von Wasser entstehen {{v}} Liter Sauerstoff. Wie viel Liter Wasserstoff sind es?
    params: { unit: L }
    answer: { value: "{{2 * v}}" }
    hints:
      - Pro O₂ entstehen zwei H₂. Gleich viele Gasteilchen brauchen gleich viel Platz.
    explanation: "Doppelt so viel – {{2 * v}} Liter."
    variants:
      params: { v: "int[2,10]" }
      defaults: { v: 5 }

  - kind: problem
    id: akku
    widget: choice
    prompt: Was passiert chemisch, wenn du einen Akku auflädst?
    params:
      options:
        - { label: Strom kehrt die Entlade-Reaktion um., correct: true }
        - { label: Man füllt neue Elektronen ein., feedback: "Die Elektronen werden nur zurückgeschoben – die Stoffe zurückverwandelt." }
    hints:
      - Laden ist das Gegenteil von Entladen.
    explanation: Aufladen ist eine Elektrolyse im Kleinen.

  - kind: problem
    id: gruen
    widget: choice
    prompt: Wann ist Wasserstoff »grün«?
    params:
      options:
        - { label: Wenn der Strom für die Elektrolyse aus erneuerbaren Quellen stammt, correct: true }
        - { label: Wenn das Gas grün leuchtet, feedback: "Wasserstoff ist farblos – grün beschreibt die Herkunft der Energie." }
    hints:
      - Woher kommt die Energie für die Zerlegung?
    explanation: Grüner Wasserstoff speichert Sonnen- und Windstrom chemisch.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Aluminium kommt in der Natur nur als Oxid vor. Wie gewinnt man das Metall?
    params:
      options:
        - label: Durch Elektrolyse der Schmelze – mit enorm viel Strom
          correct: true
        - label: Durch Erhitzen mit Kohle wie bei Eisen
          feedback: Aluminium hält Sauerstoff zu fest dafür.
        - label: Durch Filtern
          feedback: Es ist chemisch gebunden.
    hints:
      - Aluminium ist sehr unedel – Kohle reicht als Reduktionsmittel nicht.
    explanation: "Darum lohnt sich Recycling: Es spart 95 % der Energie."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Ein Strom von {{i}} A fließt {{s}} Sekunden. Wie viel Mol Elektronen sind das? (1 mol Elektronen = 96 500 C)
    params:
      unit: mol
    answer:
      value: "{{k / 10}}"
      tolerance: 0.001
    hints:
      - Ladung Q = I · t = {{i}} · {{s}} C.
      - Teile {{9650 * k}} C durch 96 500 C/mol.
    explanation: "{{9650 * k}} C : 96 500 C/mol = {{k / 10}} mol Elektronen. Das ist das Gesetz von Faraday."
    difficulty: 2
    variants:
      params:
        i: choice[2,5,10]
        k: int[1,9]
      derive:
        s: 9650 * k / i
      defaults:
        i: 5
        k: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Cu²⁺ + 2 e⁻ → Cu. Wie viel Gramm Kupfer (63,5 g/mol) scheidet 1 mol Elektronen ab? Auf eine Nachkommastelle.
    answer:
      value: 31.8
      tolerance: 0.06
    feedback:
      - when: abs(numval(state.input) - 63.5) < 0.1
        misconception: charge-ignored
        text: Jedes Kupfer-Ion braucht zwei Elektronen.
    hints:
      - 1 mol Elektronen reicht für ein halbes Mol Cu²⁺.
      - "Rechne 63,5 : 2."
    explanation: "63,5 : 2 ≈ 31,8 g. Bei Silber (Ag⁺) wären es volle 107,9 g."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Bei der Elektrolyse von Kochsalzlösung entstehen drei wichtige Grundstoffe der Chemie. Welche?
    params:
      options:
        - label: Chlor, Wasserstoff und Natronlauge
          correct: true
        - label: Natrium, Chlor und Wasser
          feedback: Natrium-Metall entsteht nur aus geschmolzenem Salz ohne Wasser.
        - label: Sauerstoff, Salz und Zucker
          feedback: Zucker entsteht hier nicht.
    hints:
      - Am Pluspol werden Cl⁻ zu Cl₂ oxidiert.
      - Am Minuspol wird Wasser zu H₂ und OH⁻ reduziert.
    explanation: 2 NaCl + 2 H₂O → Cl₂ + H₂ + 2 NaOH. Dieses Verfahren ist einer der größten Stromverbraucher der Chemieindustrie.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Um 1 mol Kupfer aus Cu²⁺ abzuscheiden, braucht man 2 mol Elektronen. Ein Mol Elektronen trägt 96 500 Coulomb. Wie viele Stunden dauert das bei 10 A? Auf eine Stelle.
    params:
      unit: h
    answer:
      value: 5.4
      tolerance: 0.1
    hints:
      - "193 000 C : 10 A = 19 300 s."
    explanation: 19 300 s ≈ 5,4 h. Die **Faraday-Gesetze** verbinden Strom und Stoffmenge.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie erzeugt eine Batterie Strom?"
    params:
      keywords:
        - - elektron
          - electron
        - - abgeb
          - gibt
          - oxid
          - release
          - give
          - lose
        - - aufnehm
          - nimmt
          - redu
          - accept
          - take
          - gain
        - - draht
          - gerät
          - leiter
          - kreis
          - wire
          - device
          - circuit
          - außen
          - outside
      min: 3
      sample: An einem Pol gibt ein Stoff Elektronen ab, am anderen nimmt ein Stoff sie auf. Weil beide getrennt sind, müssen die Elektronen außen durch das Gerät fließen – das ist der Strom.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Theoretisch zerlegt schon 1,23 V Wasser. In der Praxis braucht man 1,8 bis 2 V. Die Differenz heißt **Überspannung**: Die Elektroden müssen die Reaktion erst in Gang bringen."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: 1 kg Wasserstoff sind 500 mol H₂ und brauchen 1000 mol Elektronen. Wie viele Kilowattstunden kostet das mindestens bei 1,23 V? (96 485 C/mol, 1 kWh = 3,6 · 10⁶ J) Auf ganze Zahlen.
    answer:
      value: 33
      tolerance: 0.5
    hints:
      - Energie = Ladung · Spannung = 1000 · 96 485 · 1,23 J.
      - Das sind rund 1,19 · 10⁸ J. Teile durch 3,6 · 10⁶.
    explanation: Mindestens rund 33 kWh. Echte Elektrolyseure brauchen etwa 50 – wegen der Überspannung und Wärmeverlusten.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Aluminium-Recycling spart rund 95 % der Energie der Neuherstellung. Warum so viel?
    params:
      options:
        - label: Neues Aluminium muss man aus dem Oxid per Elektrolyse herausholen – Schrott muss man nur einschmelzen
          correct: true
        - label: Altes Aluminium ist leichter
          feedback: Die Masse ist dieselbe.
        - label: Beim Recycling entsteht Strom
          feedback: Einschmelzen kostet Energie, nur viel weniger.
    hints:
      - Aluminium ist sehr unedel – im Oxid sitzt es fest.
      - Die Redoxarbeit ist beim Schrott schon erledigt.
    explanation: Pro Kilo neues Aluminium braucht die Elektrolyse etwa 13 bis 15 kWh. Eine Getränkedose ist darum ein kleiner Energiespeicher.
    difficulty: 3

srs:
  cards_from: [gas, akku]
