id: chem.redox.battery
type: concept
title: How a Battery Works
summary: Redox, spatially separated.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many watt-hours does a typical smartphone battery store?"
    params:
      min: 1
      max: 500
      unit: Wh
    answer:
      value: 15
      tolerance: 6
    explanation: About 15 Wh. An electric car battery has about 60,000 Wh – as much as 4000 phones.


  - kind: explain
    id: s1
    body: |
      A **battery** separates oxidation and reduction in space. The electrons must take the detour through your device – this flow of electrons is the current.

  - kind: problem
    id: weg
    widget: order
    prompt: Put the sequence inside a battery in the right order.
    params:
      items:
        - { label: At the negative terminal a metal gives up electrons }
        - { label: The electrons flow through the device }
        - { label: At the positive terminal they are taken up }
    hints:
      - Where do the electrons start?
    explanation: Oxidation at the negative terminal, reduction at the positive terminal – the lamp lights up in between.

  - kind: problem
    id: reihe
    widget: numeric
    prompt: One cell delivers 1.5 V. How much voltage do {{n}} cells in series deliver?
    params: { unit: V }
    answer: { value: "{{n * 1.5}}" }
    hints:
      - In series, voltages add up.
    explanation: "{{n}} · 1.5 = {{n * 1.5}} V."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 4 }

  - kind: problem
    id: leer
    widget: choice
    prompt: Why does a battery go flat eventually?
    params:
      options:
        - { label: "The substances that give up electrons are used up.", correct: true }
        - { label: The electrons have leaked out., feedback: "Electrons are not lost – the reaction comes to an end." }
    hints:
      - What happens to the metal at the negative terminal?
    explanation: A rechargeable battery can be turned back with current – a disposable one cannot.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A battery has 3.7 V and 4000 mAh. How many watt-hours does it store?
    params:
      unit: Wh
    answer:
      value: 14.8
    hints:
      - 4000 mAh is 4 Ah. Energy = voltage · charge.
    explanation: 3.7 V · 4 Ah = 14.8 Wh.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is lithium of all metals the one in modern batteries?
    params:
      options:
        - label: It is the lightest metal and gives up its electron especially readily
          correct: true
        - label: It is the cheapest metal
          feedback: Iron and aluminium are much cheaper.
        - label: It is non-toxic and non-flammable
          feedback: Lithium batteries can even burn.
    hints:
      - Much voltage for little weight.
    explanation: The lowest potential of the series (−3.04 V) and only 7 g per mole – that gives the highest energy density.
    difficulty: 3

srs:
  cards_from: [weg, leer]
