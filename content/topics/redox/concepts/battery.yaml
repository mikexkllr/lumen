id: chem.redox.battery
type: concept
title: Wie eine Batterie funktioniert
summary: Redox, räumlich getrennt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Elektronen-Schieber
    body: Eine Batterie schiebt Elektronen durch dein Gerät. Je stärker sie schiebt, desto höher ist ihre **Spannung**. Dreh an Spannung und Widerstand und sieh, wie viel Strom fließt.
    visual:
      widget: sim
      interactive: true
      params:
        scene: circuit

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Wattstunden speichert der Akku eines typischen Smartphones?"
    params:
      min: 1
      max: 500
      unit: Wh
    answer:
      value: 15
      tolerance: 6
    explanation: Etwa 15 Wh. Ein E-Auto-Akku hat rund 60 000 Wh – so viel wie 4000 Handys.

  - kind: explain
    id: s1
    body: |
      Eine **Batterie** trennt Oxidation und Reduktion räumlich. Die Elektronen müssen den Umweg durch dein Gerät nehmen – dieser Elektronenfluss ist der Strom.

  - kind: problem
    id: weg
    widget: order
    prompt: Bring den Ablauf in einer Batterie in die richtige Reihenfolge.
    params:
      items:
        - { label: Am Minuspol gibt ein Metall Elektronen ab }
        - { label: Die Elektronen fließen durch das Gerät }
        - { label: Am Pluspol werden sie aufgenommen }
    hints:
      - Wo starten die Elektronen?
    explanation: Oxidation am Minuspol, Reduktion am Pluspol – dazwischen leuchtet die Lampe.

  - kind: problem
    id: reihe
    widget: numeric
    prompt: Eine Zelle liefert 1,5 V. Wie viel Spannung liefern {{n}} Zellen in Reihe?
    params: { unit: V }
    answer: { value: "{{n * 1.5}}" }
    hints:
      - In Reihe addieren sich Spannungen.
    explanation: "{{n}} · 1,5 = {{n * 1.5}} V."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 4 }

  - kind: problem
    id: leer
    widget: choice
    prompt: Warum ist eine Batterie irgendwann leer?
    params:
      options:
        - { label: "Die Stoffe, die Elektronen abgeben, sind verbraucht.", correct: true }
        - { label: Die Elektronen sind ausgelaufen., feedback: "Elektronen gehen nicht verloren – die Reaktion kommt zum Ende." }
    hints:
      - Was passiert mit dem Metall am Minuspol?
    explanation: Ein Akku lässt sich mit Strom zurückverwandeln – eine Batterie nicht.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Akku hat 3,7 V und 4000 mAh. Wie viele Wattstunden speichert er?
    params:
      unit: Wh
    answer:
      value: 14.8
    hints:
      - 4000 mAh sind 4 Ah. Energie = Spannung · Ladung.
    explanation: 3,7 V · 4 Ah = 14,8 Wh.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Ein Akku hat {{v}} V und {{c}} mAh. Wie viele Wattstunden speichert er?
    params:
      unit: Wh
    answer:
      value: "{{v * c / 1000}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - v * c) < 0.01
        misconception: milli
        text: mAh sind Milliamperestunden – teile durch 1000.
    hints:
      - Energie = Spannung · Ladung.
      - "{{c}} mAh = {{c / 1000}} Ah."
    explanation: "{{v}} V · {{c / 1000}} Ah = {{v * c / 1000}} Wh."
    difficulty: 2
    variants:
      params:
        v: choice[1.2,3.7]
        c: step[1000,5000,500]
      defaults:
        v: 3.7
        c: 3000

  - kind: problem
    id: ch-d2
    depth: 2
    widget: match
    prompt: Welche Chemie steckt in welcher Batterie?
    params:
      pairs:
        - left: Alkali-Batterie (AA)
          right: Zink und Mangandioxid
        - left: Autobatterie
          right: Blei, Bleidioxid, Schwefelsäure
        - left: Handy-Akku
          right: Lithium-Ionen, Graphit, Metalloxid
        - left: Knopfzelle im Hörgerät
          right: Zink und Luftsauerstoff
    hints:
      - Die schwere Autobatterie heißt auch Bleiakku.
      - Hörgeräte-Zellen haben kleine Luftlöcher.
    explanation: "Alle nutzen dasselbe Prinzip: ein Stoff gibt Elektronen ab, ein anderer nimmt sie auf – getrennt durch einen Ionenleiter."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Warum lässt ein Handy-Akku im Winter draußen schneller nach?
    params:
      options:
        - label: Bei Kälte laufen die Reaktionen und die Ionenwanderung langsamer
          correct: true
        - label: Kälte zerstört das Lithium
          feedback: Danach erholt sich der Akku im Warmen wieder.
        - label: Die Elektronen frieren ein
          feedback: Die Elektronen im Draht sind nicht das Problem.
    hints:
      - Was macht Kälte mit dem Reaktionstempo?
      - Im Akku müssen Ionen durch eine Flüssigkeit wandern.
    explanation: Der Innenwiderstand steigt, die Spannung bricht unter Last ein. Im Warmen ist die Ladung wieder da.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist ausgerechnet Lithium das Metall moderner Akkus?
    params:
      options:
        - label: Es ist das leichteste Metall und gibt sein Elektron besonders bereitwillig ab
          correct: true
        - label: Es ist das billigste Metall
          feedback: Eisen und Aluminium sind viel billiger.
        - label: Es ist ungiftig und unbrennbar
          feedback: Lithium-Akkus können sogar brennen.
    hints:
      - Viel Spannung bei wenig Gewicht.
    explanation: Niedrigstes Potenzial der Spannungsreihe (−3,04 V) und nur 7 g pro Mol – das ergibt die höchste Energiedichte.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Eine Akkuzelle (Typ 18650) hat 3,6 V und 3 Ah und wiegt 47 g. Wie viele Wattstunden speichert sie pro Kilogramm? Auf ganze Zahlen.
    params:
      unit: Wh/kg
    answer:
      value: 230
      tolerance: 1
    hints:
      - "Erst die Energie: 3,6 V · 3 Ah = 10,8 Wh."
      - "Dann auf 1000 g hochrechnen: 10,8 : 47 · 1000."
    explanation: Etwa 230 Wh/kg. Das ist die **Energiedichte** – entscheidend für Reichweite und Gewicht von E-Autos.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Benzin speichert rund 12 000 Wh pro Kilogramm, ein Lithium-Akku etwa 250. Warum fahren E-Autos trotzdem weit?
    params:
      options:
        - label: Elektromotoren nutzen rund 90 % der Energie, Verbrenner nur etwa ein Drittel
          correct: true
        - label: Akkus werden beim Fahren nachgeladen
          feedback: Bremsen gewinnt nur einen kleinen Teil zurück.
        - label: Die Zahlen sind gleich groß
          feedback: Benzin speichert pro Kilo fast fünfzigmal mehr.
    hints:
      - Wichtig ist, wie viel Energie am Rad ankommt.
      - Ein Verbrenner macht vor allem Wärme.
    explanation: Der Wirkungsgrad gleicht einen Teil aus. Trotzdem wiegt ein Akku für 500 km ein paar hundert Kilo – Benzin für 500 km nur rund 25.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Warum soll man Lithium-Akkus nicht beschädigen oder stark überladen?
    params:
      options:
        - label: Ein Kurzschluss im Inneren kann die Zelle so stark erhitzen, dass der brennbare Elektrolyt Feuer fängt
          correct: true
        - label: Sie laufen dann einfach leer
          feedback: Gefährlich ist die Wärme, nicht die Leere.
        - label: Lithium wird dann radioaktiv
          feedback: Lithium ist nicht radioaktiv.
    hints:
      - Im Akku steckt eine organische, brennbare Flüssigkeit.
      - Wärme beschleunigt die Reaktionen – die erzeugen noch mehr Wärme.
    explanation: "Man spricht vom thermischen Durchgehen: Die Reaktion heizt sich selbst immer weiter auf. Darum haben Akkus Schutzschaltungen."
    difficulty: 3

srs:
  cards_from: [weg, leer]
