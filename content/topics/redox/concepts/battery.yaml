id: chem.redox.battery
type: concept
title: Wie eine Batterie funktioniert
summary: Redox, räumlich getrennt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Eine **Batterie** trennt Oxidation und Reduktion räumlich. Die Elektronen müssen den Umweg durch dein Gerät nehmen – dieser Elektronenfluss ist der Strom.

  - kind: problem
    id: weg
    widget: order
    prompt: Bring den Ablauf in einer Batterie in die richtige Reihenfolge.
    params:
      items:
        - { label: Am Minuspol gibt ein Metall Elektronen ab }
        - { label: Die Elektronen fließen durch das Gerät }
        - { label: Am Pluspol werden sie aufgenommen }
    hints:
      - Wo starten die Elektronen?
    explanation: Oxidation am Minuspol, Reduktion am Pluspol – dazwischen leuchtet die Lampe.

  - kind: problem
    id: reihe
    widget: numeric
    prompt: Eine Zelle liefert 1,5 V. Wie viel Spannung liefern {{n}} Zellen in Reihe?
    params: { unit: V }
    answer: { value: "{{n * 1.5}}" }
    hints:
      - In Reihe addieren sich Spannungen.
    explanation: "{{n}} · 1,5 = {{n * 1.5}} V."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 4 }

  - kind: problem
    id: leer
    widget: choice
    prompt: Warum ist eine Batterie irgendwann leer?
    params:
      options:
        - { label: "Die Stoffe, die Elektronen abgeben, sind verbraucht.", correct: true }
        - { label: Die Elektronen sind ausgelaufen., feedback: "Elektronen gehen nicht verloren – die Reaktion kommt zum Ende." }
    hints:
      - Was passiert mit dem Metall am Minuspol?
    explanation: Ein Akku lässt sich mit Strom zurückverwandeln – eine Batterie nicht.

srs:
  cards_from: [weg, leer]
