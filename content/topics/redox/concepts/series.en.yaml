id: chem.redox.series
type: concept
title: Noble and Base Metals
summary: The electrochemical series.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Metals differ in how readily they give up electrons. **Base** metals like zinc do it easily, **noble** metals like gold hardly at all. This ranking is called the **electrochemical series**.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort from base to noble.
    params:
      items:
        - { label: Potassium }
        - { label: Zinc }
        - { label: Iron }
        - { label: Copper }
        - { label: Gold }
    hints:
      - Gold still shines after a thousand years.
    explanation: Potassium reacts violently, gold hardly at all.

  - kind: problem
    id: nagel
    widget: choice
    prompt: An iron nail lies in a blue copper salt solution. What happens?
    params:
      options:
        - { label: The nail becomes coated with copper., correct: true }
        - { label: Nothing, feedback: "Iron is less noble – it gives electrons to the copper ions." }
    hints:
      - Which gives up electrons more readily – iron or copper?
    explanation: Iron dissolves, and copper deposits.

  - kind: problem
    id: spannung
    widget: numeric
    prompt: Zinc sits at −0.76 V and copper at +0.34 V. What voltage does a zinc-copper cell deliver?
    params: { unit: V }
    answer: { value: 1.1 }
    hints:
      - The distance between the two values.
    explanation: 0.34 − (−0.76) = 1.1 V. The farther apart two metals are, the more voltage.

srs:
  cards_from: [ordnen, spannung]
