id: chem.redox.series
type: concept
title: Noble and Base Metals
summary: The electrochemical series.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Gold coins from old shipwrecks still shine after 300 years. Iron nails have long crumbled. Why?
    params:
      options:
        - label: Gold hardly gives up its electrons
          correct: true
        - label: Gold is harder
          feedback: Gold is in fact very soft.
        - label: Gold is heavier
          feedback: Weight does not protect.
    hints:
      - "Rusting means: giving up electrons."
    explanation: Metals can be ranked by how readily they give up electrons.

  - kind: explain
    id: s1
    body: |
      Metals differ in how readily they give up electrons. **Base** metals like zinc do it easily, **noble** metals like gold hardly at all. This ranking is called the **electrochemical series**.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort from base to noble.
    params:
      items:
        - { label: Potassium }
        - { label: Zinc }
        - { label: Iron }
        - { label: Copper }
        - { label: Gold }
    hints:
      - Gold still shines after a thousand years.
    explanation: Potassium reacts violently, gold hardly at all.

  - kind: problem
    id: nagel
    widget: choice
    prompt: An iron nail lies in a blue copper salt solution. What happens?
    params:
      options:
        - { label: The nail becomes coated with copper., correct: true }
        - { label: Nothing, feedback: "Iron is less noble – it gives electrons to the copper ions." }
    hints:
      - Which gives up electrons more readily – iron or copper?
    explanation: Iron dissolves, and copper deposits.

  - kind: problem
    id: spannung
    widget: numeric
    prompt: Zinc sits at −0.76 V and copper at +0.34 V. What voltage does a zinc-copper cell deliver?
    params: { unit: V }
    answer: { value: 1.1 }
    hints:
      - The distance between the two values.
    explanation: 0.34 − (−0.76) = 1.1 V. The farther apart two metals are, the more voltage.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Can you store a copper salt solution in an iron pot?
    params:
      options:
        - label: No – the less noble iron dissolves, copper is deposited
          correct: true
        - label: Yes – metals do not react with salts
          feedback: The iron nail from before shows the opposite.
        - label: Yes, but only cold
          feedback: The reaction runs cold as well.
    hints:
      - What happened to the iron nail?
    explanation: The less noble metal displaces the nobler one from its solution.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: "Electrochemical series: Mg −2.37 · Al −1.66 · Zn −0.76 · Fe −0.44 · Cu +0.34 · Ag +0.80 V. What voltage does a cell made of {{a}} and {{b}} deliver?"
    params:
      unit: V
    answer:
      value: "{{eb - ea}}"
      tolerance: 0.005
    feedback:
      - when: ea < 0 && eb > 0 && abs(numval(state.input) - (eb + ea)) < 0.005
        misconception: potential-sign
        text: "The sign matters: subtract the lower value from the higher one."
    hints:
      - The voltage is the distance along the series.
      - Work out {{eb}} − ({{ea}}).
    explanation: "{{eb}} − ({{ea}}) = {{eb - ea}} V. {{a}} is the negative terminal, because it gives up its electrons more easily."
    difficulty: 2
    variants:
      params:
        i: int[0,4]
        j: int[1,5]
      constraints:
        - i < j
      derive:
        a: '["Mg", "Al", "Zn", "Fe", "Cu", "Ag"][i]'
        b: '["Mg", "Al", "Zn", "Fe", "Cu", "Ag"][j]'
        ea: "[-2.37, -1.66, -0.76, -0.44, 0.34, 0.80][i]"
        eb: "[-2.37, -1.66, -0.76, -0.44, 0.34, 0.80][j]"
      defaults:
        i: 2
        j: 5

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Hydrogen sits at 0 V in the series. Which metals dissolve in hydrochloric acid, giving off bubbles?
    params:
      buckets:
        - id: b1
          label: dissolves, H₂ bubbles
        - id: b2
          label: stays shiny
      items:
        - label: Magnesium
          bucket: b1
        - label: Zinc
          bucket: b1
        - label: Iron
          bucket: b1
        - label: Copper
          bucket: b2
        - label: Silver
          bucket: b2
        - label: Gold
          bucket: b2
    hints:
      - Only metals below 0 V can give electrons to H⁺.
      - Copper sits at +0.34 V.
    explanation: Reactive metals reduce H⁺ to H₂ gas. Noble metals stay shiny in hydrochloric acid.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: A copper wire hangs in a colourless silver nitrate solution. What do you see after an hour?
    params:
      options:
        - label: Silver crystals grow on the wire and the solution turns blue
          correct: true
        - label: Nothing – copper is a noble metal
          feedback: Silver is more noble still.
        - label: Copper comes out of the solution
          feedback: At first there is no copper in the solution at all.
    hints:
      - Compare Cu (+0.34 V) and Ag (+0.80 V).
      - Cu²⁺ ions colour water blue.
    explanation: Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag. The more noble metal comes out, the less noble one dissolves.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Magnesium is at −2.37 V, silver at +0.80 V. What voltage does a cell made of both deliver?
    params:
      unit: V
    answer:
      value: 3.17
    hints:
      - "Difference: noble minus base."
    explanation: 0.80 − (−2.37) = 3.17 V. The further apart the metals, the higher the voltage.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: The values in the series are called **standard potentials**. They are measured against a hydrogen electrode set to 0 V – at 25 °C, 1 mol/L and 1 bar.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: The free energy of a cell is ΔG = −n · F · E. For the zinc–copper cell, n = 2, F = 96,485 C/mol, E = 1.10 V. What is ΔG in kJ/mol? Round to a whole number.
    answer:
      value: -212
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 212) < 1
        misconception: dg-sign
        text: "The minus belongs there: the reaction runs by itself and releases energy."
      - when: abs(numval(state.input) + 106) < 1
        misconception: n-ignored
        text: Two electrons move per reaction – n = 2.
    hints:
      - 2 · 96,485 · 1.10 gives joules per mole.
      - Divide by 1000 and put the minus in front.
    explanation: ΔG ≈ −212 kJ/mol. A negative ΔG means the reaction runs by itself. A positive cell voltage and a negative ΔG say the same thing in two languages.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Lithium has the most negative standard potential at −3.04 V. Yet caesium reacts far more violently with water. How does that fit?
    params:
      options:
        - label: The potential tells you how much energy is released – not how fast it happens
          correct: true
        - label: The table is wrong
          feedback: The values are well measured.
        - label: Caesium is more noble than lithium
          feedback: Both are extremely reactive.
    hints:
      - Thermodynamics and kinetics are two different questions.
      - The tiny Li⁺ gets wrapped up by water especially tightly. That releases a lot of energy.
    explanation: Lithium does not melt and reacts steadily. Caesium melts at 28 °C, its surface stays fresh – it almost explodes.
    difficulty: 3

srs:
  cards_from: [ordnen, spannung]
