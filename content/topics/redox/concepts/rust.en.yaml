id: chem.redox.rust
type: concept
title: Rust and Protection
summary: Slow oxidation in everyday life.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: braun
    widget: choice
    prompt: A cut apple turns brown. What is happening?
    params:
      options:
        - { label: Substances in the apple react with oxygen., correct: true }
        - { label: It rots right away., feedback: "It is a fast oxidation, not rot." }
    hints:
      - What reaches the cut surface?
    explanation: Lemon juice slows it down – it reacts more readily with the oxygen.

  - kind: explain
    id: s2
    body: |
      **Rusting** is the slow oxidation of iron with oxygen and water. Rust flakes off and exposes fresh iron – so it eats ever deeper.

  - kind: problem
    id: zink
    widget: choice
    prompt: Why does galvanized steel hardly rust, even when scratched?
    params:
      options:
        - { label: Zinc gives up its electrons more easily and sacrifices itself., correct: true }
        - { label: Zinc is waterproof., feedback: "Zinc protects even at scratches – it reacts in place of the iron." }
    hints:
      - Which metal oxidizes more easily?
    explanation: Zinc is a **sacrificial anode** – it oxidizes first.

  - kind: problem
    id: schutz
    widget: buckets
    prompt: Does it protect the iron from rust?
    params:
      buckets: [{ label: protects }, { label: does not protect }]
      items:
        - { label: Painting, bucket: protects }
        - { label: Oiling, bucket: protects }
        - { label: Galvanizing, bucket: protects }
        - { label: Rinsing with salt water, bucket: does not protect }
    hints:
      - Salt speeds up the reaction.
    explanation: Road salt in winter makes cars rust especially fast.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does this protect iron from rust?
    params:
      buckets:
        - id: b1
          label: Protects
        - id: b2
          label: Does not protect
      items:
        - label: Painting
          bucket: b1
        - label: Galvanising
          bucket: b1
        - label: Rinsing with salt water
          bucket: b2
        - label: Oiling
          bucket: b1
        - label: Storing it damp
          bucket: b2
    hints:
      - Rust needs oxygen and water.
    explanation: Paint, oil and zinc keep water and air away. Salt even speeds up rusting.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Rust forms from iron, [[oxygen]] and [[water]].
      distractors:
        - nitrogen
        - oil

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zinc blocks are attached to ship hulls. What for?
    params:
      options:
        - label: The zinc dissolves in place of the steel – a sacrificial anode
          correct: true
        - label: As weight for stability
          feedback: Cheaper material would be used for that.
        - label: Zinc repels water
          feedback: Zinc gets wet like any metal.
    hints:
      - Zinc gives off electrons more readily than iron.
    explanation: As long as zinc is there, the steel stays protected. The blocks are replaced regularly.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Aluminium is far less noble than iron – and still does not rust through. Why?
    params:
      options:
        - label: It instantly forms a dense, firmly adhering oxide layer that protects it
          correct: true
        - label: It does not react with oxygen
          feedback: It reacts very quickly – exactly that protects it.
        - label: It is always painted
          feedback: Bare aluminium holds too.
    hints:
      - Rust flakes off. Aluminium oxide does not.
    explanation: "**Passivation**: the layer is only millionths of a millimetre thick but dense. Stainless steel uses the same principle with chromium."
    difficulty: 3

srs:
  cards_from: [zink, schutz]
