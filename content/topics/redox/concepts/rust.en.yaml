id: chem.redox.rust
type: concept
title: Rust and Protection
summary: Slow oxidation in everyday life.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The rust cycle
    body: Rust is not dirt but a cycle that eats into iron. Uncover the stages in order. Where could you break this **cycle**?
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 💧
            front: A drop of rain
            back: Water and air settle on the bare iron.
          - icon: ⚡
            front: Electrons move
            back: The iron hands electrons to the oxygen.
          - icon: 🟤
            front: Rust grows
            back: Loose, reddish-brown rust forms.
          - icon: 🍂
            front: Rust flakes off
            back: Fresh iron lies bare beneath – and it all starts again.

  - kind: problem
    id: braun
    widget: choice
    prompt: A cut apple turns brown. What is happening?
    params:
      options:
        - { label: Substances in the apple react with oxygen., correct: true }
        - { label: It rots right away., feedback: "It is a fast oxidation, not rot." }
    hints:
      - What reaches the cut surface?
    explanation: Lemon juice slows it down – it reacts more readily with the oxygen.

  - kind: explain
    id: s2
    body: |
      **Rusting** is the slow oxidation of iron with oxygen and water. Rust flakes off and exposes fresh iron – so it eats ever deeper.

  - kind: problem
    id: zink
    widget: choice
    prompt: Why does galvanized steel hardly rust, even when scratched?
    params:
      options:
        - { label: Zinc gives up its electrons more easily and sacrifices itself., correct: true }
        - { label: Zinc is waterproof., feedback: "Zinc protects even at scratches – it reacts in place of the iron." }
    hints:
      - Which metal oxidizes more easily?
    explanation: Zinc is a **sacrificial anode** – it oxidizes first.

  - kind: problem
    id: schutz
    widget: buckets
    prompt: Does it protect the iron from rust?
    params:
      buckets: [{ label: protects }, { label: does not protect }]
      items:
        - { label: Painting, bucket: protects }
        - { label: Oiling, bucket: protects }
        - { label: Galvanizing, bucket: protects }
        - { label: Rinsing with salt water, bucket: does not protect }
    hints:
      - Salt speeds up the reaction.
    explanation: Road salt in winter makes cars rust especially fast.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does this protect iron from rust?
    params:
      buckets:
        - id: b1
          label: Protects
        - id: b2
          label: Does not protect
      items:
        - label: Painting
          bucket: b1
        - label: Galvanising
          bucket: b1
        - label: Rinsing with salt water
          bucket: b2
        - label: Oiling
          bucket: b1
        - label: Storing it damp
          bucket: b2
    hints:
      - Rust needs oxygen and water.
    explanation: Paint, oil and zinc keep water and air away. Salt even speeds up rusting.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Rust forms from iron, [[oxygen]] and [[water]].
      distractors:
        - nitrogen
        - oil

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zinc blocks are attached to ship hulls. What for?
    params:
      options:
        - label: The zinc dissolves in place of the steel – a sacrificial anode
          correct: true
        - label: As weight for stability
          feedback: Cheaper material would be used for that.
        - label: Zinc repels water
          feedback: Zinc gets wet like any metal.
    hints:
      - Zinc gives off electrons more readily than iron.
    explanation: As long as zinc is there, the steel stays protected. The blocks are replaced regularly.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Five iron nails sit in jars for a week. Which ones rust?
    params:
      buckets:
        - id: b1
          label: rusts
        - id: b2
          label: barely rusts
      items:
        - label: in tap water
          bucket: b1
        - label: in salt water
          bucket: b1
        - label: wrapped in copper wire, in water
          bucket: b1
        - label: in dry air with a drying agent
          bucket: b2
        - label: in boiled water under oil
          bucket: b2
        - label: galvanised, in water
          bucket: b2
    hints:
      - Rust needs water and oxygen at the same time.
      - Boiled water holds hardly any dissolved oxygen, and the oil keeps new oxygen out.
    explanation: More noble copper speeds rusting up, less noble zinc prevents it. Salt makes the water more conductive – which speeds it up too.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: "Simplified: 4 Fe + 3 O₂ → 2 Fe₂O₃. How many O₂ molecules are needed for {{4 * k}} iron atoms?"
    answer:
      value: "{{3 * k}}"
    feedback:
      - when: numval(state.input) == 4 * k
        misconception: ratio-ignored
        text: The ratio is 4 Fe to 3 O₂, not 1 to 1.
    hints:
      - Every 4 Fe need 3 O₂.
      - Work out {{4 * k}} ÷ 4 · 3.
    explanation: "{{4 * k}} ÷ 4 · 3 = {{3 * k}} O₂."
    difficulty: 2
    variants:
      params:
        k: int[2,15]
      defaults:
        k: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: How many grams of Fe₂O₃ (160 g/mol) form from 112 g of iron (56 g/mol)?
    params:
      unit: g
    answer:
      value: 160
    feedback:
      - when: numval(state.input) == 320
        misconception: atom-count
        text: One Fe₂O₃ contains two Fe atoms.
      - when: numval(state.input) == 112
        misconception: mass-ignored
        text: Rust weighs more than the iron – the oxygen is added.
    hints:
      - 112 g of Fe is 2 mol.
      - One Fe₂O₃ needs 2 Fe.
    explanation: 2 mol of Fe give 1 mol of Fe₂O₃ = 160 g. A rusting car actually gets heavier!
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Aluminium is far less noble than iron – and still does not rust through. Why?
    params:
      options:
        - label: It instantly forms a dense, firmly adhering oxide layer that protects it
          correct: true
        - label: It does not react with oxygen
          feedback: It reacts very quickly – exactly that protects it.
        - label: It is always painted
          feedback: Bare aluminium holds too.
    hints:
      - Rust flakes off. Aluminium oxide does not.
    explanation: "**Passivation**: the layer is only millionths of a millimetre thick but dense. Stainless steel uses the same principle with chromium."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: Rusting reinforcing steel can burst concrete from the inside. How?
    params:
      options:
        - label: Rust takes up several times the volume of iron and pushes the concrete apart
          correct: true
        - label: Rust is acidic and dissolves concrete
          feedback: The problem is the space it needs, not acid.
        - label: The steel heats up as it rusts
          feedback: Rusting is far too slow to warm anything noticeably.
    hints:
      - Rust is loose and contains a lot of water.
      - More volume inside solid concrete creates pressure.
    explanation: Depending on the type of rust, the volume grows two to six times. That is why old bridges and balconies crumble.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Stainless steel contains at least 10.5% chromium and hardly rusts. Why?
    params:
      options:
        - label: Chromium forms a wafer-thin, dense oxide layer on the surface that heals itself
          correct: true
        - label: Chromium is more noble than gold
          feedback: Chromium is actually less noble than iron.
        - label: Chromium repels water
          feedback: It is about an oxide layer, not about water beading off.
    hints:
      - Think of aluminium, which does not rust through despite being reactive.
      - The layer is only a few nanometres thick.
    explanation: This **passivation** protects as long as enough oxygen reaches it. Scratches close up again by themselves.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what happens to iron when it rusts.
    params:
      keywords:
        - - oxid
          - elektron
          - electron
        - - sauerstoff
          - oxygen
          - o₂
        - - wasser
          - water
          - feucht
          - moist
      sample: "When rusting, iron is oxidised: it gives away electrons. Oxygen takes them. This needs water – so iron barely rusts in dry air."
    explanation: Iron, oxygen and water – take one away and rusting stops.
    difficulty: 3

srs:
  cards_from: [zink, schutz]
