id: chem.redox.idea
type: concept
title: Elektronen wandern
summary: Oxidation und Reduktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Eisennagel liegt wochenlang im Regen und wird rotbraun. Was ist passiert?
    params:
      options:
        - label: Das Eisen hat mit Sauerstoff reagiert
          correct: true
        - label: Er ist schmutzig geworden
          feedback: Rost lässt sich nicht abwaschen.
        - label: Die Farbe ist abgeblättert
          feedback: Der Nagel war nicht lackiert.
    hints:
      - "Ein neuer Stoff ist entstanden: Rost."
    explanation: Dabei sind Elektronen vom Eisen zum Sauerstoff gewandert.

  - kind: explain
    id: s1
    body: |
      **Oxidation** heißt: Ein Stoff gibt Elektronen ab. **Reduktion** heißt: Ein Stoff nimmt Elektronen auf. Beides passiert immer gemeinsam – darum spricht man von **Redox**-Reaktionen.

  - kind: problem
    id: wer
    widget: choice
    prompt: Natrium gibt ein Elektron an Chlor ab. Welcher Stoff wird oxidiert?
    params:
      options:
        - { label: Natrium, correct: true }
        - { label: Chlor, feedback: "Chlor nimmt das Elektron auf – es wird reduziert." }
    hints:
      - Oxidation heißt abgeben.
    explanation: Natrium wird oxidiert, Chlor reduziert – zusammen eine Redoxreaktion.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Oxidation oder Reduktion?
    params:
      buckets: [{ label: Oxidation }, { label: Reduktion }]
      items:
        - { label: Eisen gibt Elektronen ab, bucket: Oxidation }
        - { label: Magnesium wird zu Mg²⁺, bucket: Oxidation }
        - { label: Sauerstoff nimmt Elektronen auf, bucket: Reduktion }
        - { label: Cu²⁺ wird zu Kupfer, bucket: Reduktion }
    hints:
      - Wird die Ladung positiver, wurden Elektronen abgegeben.
    explanation: Mehr Plus heißt Elektronen weg – Oxidation.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Ein Metallatom wird zum Ion mit Ladung {{z}}+. Wie viele Elektronen hat es abgegeben?
    params: { unit: Elektronen }
    answer: { value: "{{z}}" }
    hints:
      - Jedes abgegebene Elektron macht die Ladung um 1 positiver.
    explanation: "{{z}} Elektronen weg, Ladung {{z}}+."
    variants:
      params: { z: "int[1,3]" }
      defaults: { z: 2 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Bei der Oxidation gibt ein Stoff Elektronen [[ab]], bei der Reduktion nimmt er sie [[auf]]. Beides passiert immer [[gleichzeitig]].
      distractors:
        - nacheinander
        - weiter

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **Oxidationszahl** von Sauerstoff ist fast immer −2. Welche Oxidationszahl hat Kohlenstoff in CO₂?
    answer:
      value: 4
    hints:
      - "Das Molekül ist neutral: C + 2 · (−2) = 0."
    explanation: +4. In Methan CH₄ ist sie −4 – Verbrennen oxidiert Kohlenstoff um acht Stufen.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: Oxidationszahlen sind eine Buchhaltung für Elektronen. Man tut so, als gehörten die Bindungselektronen ganz dem stärker ziehenden Atom. Steigt die **Oxidationszahl**, wurde das Atom oxidiert.

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Sauerstoff zählt −2, Wasserstoff +1. Welche Oxidationszahl hat {{el}} in {{f}}? Mit Vorzeichen, etwa −3.
    answer:
      value: "{{ox}}"
    feedback:
      - when: numval(state.input) == -ox
        misconception: ox-sign
        text: "Das Vorzeichen stimmt nicht: Gegenüber O ist das Atom positiv, gegenüber H negativ."
    hints:
      - Alle Oxidationszahlen zusammen ergeben die Ladung des Teilchens.
      - Zähle O mit −2 und H mit +1, der Rest gehört {{el}}.
    explanation: "{{el}} hat in {{f}} die Oxidationszahl {{ox}}. So sieht man, wie stark ein Atom »ausgeraubt« ist."
    difficulty: 2
    variants:
      params:
        i: int[0,6]
      derive:
        el: '["S", "S", "N", "N", "C", "Mn", "Fe"][i]'
        f: '["SO₂", "H₂SO₄", "NH₃", "NO₂", "CH₄", "MnO₄⁻", "Fe₂O₃"][i]'
        ox: "[4, 6, -3, 4, -4, 7, 3][i]"
      defaults:
        i: 1

  - kind: problem
    id: ch-d3
    depth: 2
    widget: buckets
    prompt: Wird das Element oxidiert oder reduziert? Achte auf die Oxidationszahl.
    params:
      buckets:
        - id: b1
          label: oxidiert (steigt)
        - id: b2
          label: reduziert (sinkt)
      items:
        - label: Fe → Fe³⁺
          bucket: b1
        - label: C in CH₄ → C in CO₂
          bucket: b1
        - label: S in SO₂ → S in SO₃
          bucket: b1
        - label: Cl₂ → 2 Cl⁻
          bucket: b2
        - label: O₂ → O in H₂O
          bucket: b2
        - label: Cu²⁺ → Cu
          bucket: b2
    hints:
      - Rechne Start- und Endwert aus.
      - C geht von −4 auf +4, O von 0 auf −2.
    explanation: "Verbrennen ist Oxidation: Kohlenstoff steigt von −4 auf +4. Sauerstoff wird dabei immer reduziert."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Bei $2\\,Mg + O_2 \\to 2\\,MgO$: Was ist das **Oxidationsmittel**?"
    params:
      options:
        - label: Sauerstoff – er nimmt die Elektronen auf und wird selbst reduziert
          correct: true
        - label: Magnesium – es wird oxidiert
          feedback: Das Oxidationsmittel oxidiert **andere** und wird dabei selbst reduziert.
        - label: Magnesiumoxid
          feedback: Das ist das Produkt.
    hints:
      - Wer nimmt die Elektronen des Magnesiums?
    explanation: Das Oxidationsmittel wird reduziert, das Reduktionsmittel oxidiert – die Namen beschreiben, was sie dem **Partner** antun.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Redoxgleichungen gleicht man über die Elektronen aus. Jedes abgegebene Elektron muss jemand aufnehmen. Man schreibt zwei **Teilgleichungen** und gleicht ihre Elektronen an.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: Al → Al³⁺ + 3 e⁻ und O₂ + 4 e⁻ → 2 O²⁻. Wie viele Al-Atome braucht man für 3 O₂?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: electron-balance
        text: "Zähle die Elektronen: 3 O₂ nehmen 12 auf."
    hints:
      - 3 O₂ nehmen 3 · 4 = 12 Elektronen auf.
      - Jedes Al gibt 3 ab.
    explanation: "12 : 3 = 4 Al. Gesamt: 4 Al + 3 O₂ → 2 Al₂O₃."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: "Permanganat nimmt 5 Elektronen auf: MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O. Eisen gibt eins ab: Fe²⁺ → Fe³⁺ + e⁻. Wie viele Fe²⁺ oxidiert ein MnO₄⁻?"
    answer:
      value: 5
    hints:
      - Wie viele Elektronen braucht ein MnO₄⁻?
      - Jedes Fe²⁺ liefert genau eins.
    explanation: 5 Fe²⁺ pro MnO₄⁻. Die violette Lösung wird dabei farblos – so bestimmt man Eisen im Labor durch Titration.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum es Oxidation nie ohne Reduktion gibt. Wer gibt, braucht einen, der nimmt.
    params:
      keywords:
        - - elektron
          - electron
        - - abgeb
          - abgabe
          - gibt
          - give
          - lose
          - oxid
        - - aufnehm
          - nimmt
          - take
          - gain
          - accept
          - redu
      sample: "Bei der Oxidation gibt ein Stoff Elektronen ab. Elektronen können aber nicht einfach verschwinden – ein anderer Stoff muss sie aufnehmen und wird dabei reduziert. Darum gibt es nur beides zusammen: Redox."
    explanation: Elektronen werden weitergereicht, nicht vernichtet.
    difficulty: 3

srs:
  cards_from: [wer, sortieren]
