id: chem.redox.idea
type: concept
title: Elektronen wandern
summary: Oxidation und Reduktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Eisennagel liegt wochenlang im Regen und wird rotbraun. Was ist passiert?
    params:
      options:
        - label: Das Eisen hat mit Sauerstoff reagiert
          correct: true
        - label: Er ist schmutzig geworden
          feedback: Rost lässt sich nicht abwaschen.
        - label: Die Farbe ist abgeblättert
          feedback: Der Nagel war nicht lackiert.
    hints:
      - "Ein neuer Stoff ist entstanden: Rost."
    explanation: Dabei sind Elektronen vom Eisen zum Sauerstoff gewandert.

  - kind: explain
    id: s1
    body: |
      **Oxidation** heißt: Ein Stoff gibt Elektronen ab. **Reduktion** heißt: Ein Stoff nimmt Elektronen auf. Beides passiert immer gemeinsam – darum spricht man von **Redox**-Reaktionen.

  - kind: problem
    id: wer
    widget: choice
    prompt: Natrium gibt ein Elektron an Chlor ab. Welcher Stoff wird oxidiert?
    params:
      options:
        - { label: Natrium, correct: true }
        - { label: Chlor, feedback: "Chlor nimmt das Elektron auf – es wird reduziert." }
    hints:
      - Oxidation heißt abgeben.
    explanation: Natrium wird oxidiert, Chlor reduziert – zusammen eine Redoxreaktion.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Oxidation oder Reduktion?
    params:
      buckets: [{ label: Oxidation }, { label: Reduktion }]
      items:
        - { label: Eisen gibt Elektronen ab, bucket: Oxidation }
        - { label: Magnesium wird zu Mg²⁺, bucket: Oxidation }
        - { label: Sauerstoff nimmt Elektronen auf, bucket: Reduktion }
        - { label: Cu²⁺ wird zu Kupfer, bucket: Reduktion }
    hints:
      - Wird die Ladung positiver, wurden Elektronen abgegeben.
    explanation: Mehr Plus heißt Elektronen weg – Oxidation.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Ein Metallatom wird zum Ion mit Ladung {{z}}+. Wie viele Elektronen hat es abgegeben?
    params: { unit: Elektronen }
    answer: { value: "{{z}}" }
    hints:
      - Jedes abgegebene Elektron macht die Ladung um 1 positiver.
    explanation: "{{z}} Elektronen weg, Ladung {{z}}+."
    variants:
      params: { z: "int[1,3]" }
      defaults: { z: 2 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Bei der Oxidation gibt ein Stoff Elektronen [[ab]], bei der Reduktion nimmt er sie [[auf]]. Beides passiert immer [[gleichzeitig]].
      distractors:
        - nacheinander
        - weiter

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **Oxidationszahl** von Sauerstoff ist fast immer −2. Welche Oxidationszahl hat Kohlenstoff in CO₂?
    answer:
      value: 4
    hints:
      - "Das Molekül ist neutral: C + 2 · (−2) = 0."
    explanation: +4. In Methan CH₄ ist sie −4 – Verbrennen oxidiert Kohlenstoff um acht Stufen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Bei $2\\,Mg + O_2 \\to 2\\,MgO$: Was ist das **Oxidationsmittel**?"
    params:
      options:
        - label: Sauerstoff – er nimmt die Elektronen auf und wird selbst reduziert
          correct: true
        - label: Magnesium – es wird oxidiert
          feedback: Das Oxidationsmittel oxidiert **andere** und wird dabei selbst reduziert.
        - label: Magnesiumoxid
          feedback: Das ist das Produkt.
    hints:
      - Wer nimmt die Elektronen des Magnesiums?
    explanation: Das Oxidationsmittel wird reduziert, das Reduktionsmittel oxidiert – die Namen beschreiben, was sie dem **Partner** antun.
    difficulty: 3

srs:
  cards_from: [wer, sortieren]
