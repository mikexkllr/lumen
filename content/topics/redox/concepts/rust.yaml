id: chem.redox.rust
type: concept
title: Rost und Schutz
summary: Langsame Oxidation im Alltag.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: braun
    widget: choice
    prompt: Ein angeschnittener Apfel wird braun. Was passiert?
    params:
      options:
        - { label: Stoffe im Apfel reagieren mit Sauerstoff., correct: true }
        - { label: Er verfault sofort., feedback: "Es ist eine schnelle Oxidation, keine Fäulnis." }
    hints:
      - Was kommt an die Schnittfläche?
    explanation: Zitronensaft bremst das – er reagiert bereitwilliger mit dem Sauerstoff.

  - kind: explain
    id: s2
    body: |
      **Rosten** ist die langsame Oxidation von Eisen mit Sauerstoff und Wasser. Rost blättert ab und legt neues Eisen frei – darum frisst er sich immer tiefer.

  - kind: problem
    id: zink
    widget: choice
    prompt: Warum rostet verzinkter Stahl kaum, selbst bei Kratzern?
    params:
      options:
        - { label: Das Zink gibt seine Elektronen leichter ab und opfert sich., correct: true }
        - { label: Zink ist wasserdicht., feedback: "Auch an Kratzern schützt Zink – es reagiert anstelle des Eisens." }
    hints:
      - Welches Metall oxidiert leichter?
    explanation: Zink ist eine **Opferanode** – es oxidiert zuerst.

  - kind: problem
    id: schutz
    widget: buckets
    prompt: Schützt das Eisen vor Rost?
    params:
      buckets: [{ label: schützt }, { label: schützt nicht }]
      items:
        - { label: Lackieren, bucket: schützt }
        - { label: Einölen, bucket: schützt }
        - { label: Verzinken, bucket: schützt }
        - { label: Mit Salzwasser abspülen, bucket: schützt nicht }
    hints:
      - Salz beschleunigt die Reaktion.
    explanation: Streusalz im Winter lässt Autos besonders schnell rosten.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Schützt das Eisen vor Rost?
    params:
      buckets:
        - id: b1
          label: Schützt
        - id: b2
          label: Schützt nicht
      items:
        - label: Lackieren
          bucket: b1
        - label: Verzinken
          bucket: b1
        - label: Mit Salzwasser abspülen
          bucket: b2
        - label: Einölen
          bucket: b1
        - label: Feucht lagern
          bucket: b2
    hints:
      - Rost braucht Sauerstoff und Wasser.
    explanation: Lack, Öl und Zink halten Wasser und Luft fern. Salz beschleunigt das Rosten sogar.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Rost entsteht aus Eisen, [[Sauerstoff]] und [[Wasser]].
      distractors:
        - Stickstoff
        - Öl

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: An Schiffsrümpfen befestigt man Zinkblöcke. Wozu?
    params:
      options:
        - label: Das Zink löst sich anstelle des Stahls auf – eine Opferanode
          correct: true
        - label: Als Gewicht zum Stabilisieren
          feedback: Dafür nähme man billigeres Material.
        - label: Zink stößt Wasser ab
          feedback: Zink wird nass wie jedes Metall.
    hints:
      - Zink gibt Elektronen leichter ab als Eisen.
    explanation: Solange Zink da ist, bleibt der Stahl geschützt. Die Blöcke werden regelmäßig ersetzt.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Fünf Eisennägel liegen eine Woche im Glas. Welche rosten?
    params:
      buckets:
        - id: b1
          label: rostet
        - id: b2
          label: rostet kaum
      items:
        - label: in Leitungswasser
          bucket: b1
        - label: in Salzwasser
          bucket: b1
        - label: mit Kupferdraht umwickelt, in Wasser
          bucket: b1
        - label: in trockener Luft mit Trockenmittel
          bucket: b2
        - label: in abgekochtem Wasser unter Öl
          bucket: b2
        - label: verzinkt, in Wasser
          bucket: b2
    hints:
      - Rost braucht Wasser und Sauerstoff zugleich.
      - Abgekochtes Wasser enthält kaum gelösten Sauerstoff, das Öl hält neuen fern.
    explanation: Edleres Kupfer beschleunigt das Rosten, unedleres Zink verhindert es. Salz macht das Wasser leitfähiger – auch das beschleunigt.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: "Vereinfacht: 4 Fe + 3 O₂ → 2 Fe₂O₃. Wie viele O₂-Moleküle braucht man für {{4 * k}} Eisenatome?"
    answer:
      value: "{{3 * k}}"
    feedback:
      - when: numval(state.input) == 4 * k
        misconception: ratio-ignored
        text: Das Verhältnis ist 4 Fe zu 3 O₂, nicht 1 zu 1.
    hints:
      - Je 4 Fe brauchen 3 O₂.
      - "Rechne {{4 * k}} : 4 · 3."
    explanation: "{{4 * k}} : 4 · 3 = {{3 * k}} O₂."
    difficulty: 2
    variants:
      params:
        k: int[2,15]
      defaults:
        k: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Wie viel Gramm Fe₂O₃ (160 g/mol) entstehen aus 112 g Eisen (56 g/mol)?
    params:
      unit: g
    answer:
      value: 160
    feedback:
      - when: numval(state.input) == 320
        misconception: atom-count
        text: Ein Fe₂O₃ enthält zwei Fe-Atome.
      - when: numval(state.input) == 112
        misconception: mass-ignored
        text: Rost wiegt mehr als das Eisen – der Sauerstoff kommt dazu.
    hints:
      - 112 g Fe sind 2 mol.
      - Für ein Fe₂O₃ braucht man 2 Fe.
    explanation: 2 mol Fe ergeben 1 mol Fe₂O₃ = 160 g. Ein rostendes Auto wird also schwerer!
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Aluminium ist viel unedler als Eisen – und rostet trotzdem nicht durch. Warum?
    params:
      options:
        - label: Es bildet sofort eine dichte, fest haftende Oxidschicht, die es schützt
          correct: true
        - label: Es reagiert nicht mit Sauerstoff
          feedback: Es reagiert sogar sehr schnell – genau das schützt es.
        - label: Es ist immer lackiert
          feedback: Auch blankes Aluminium hält.
    hints:
      - Rost blättert ab. Aluminiumoxid nicht.
    explanation: "**Passivierung**: Die Schicht ist nur Millionstel Millimeter dick, aber dicht. Edelstahl nutzt dasselbe Prinzip mit Chrom."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: Rostender Bewehrungsstahl kann Beton von innen sprengen. Wie geht das?
    params:
      options:
        - label: Rost braucht ein Mehrfaches des Volumens von Eisen und drückt den Beton auf
          correct: true
        - label: Rost ist sauer und löst Beton
          feedback: Das Problem ist der Platzbedarf, nicht Säure.
        - label: Der Stahl wird beim Rosten heiß
          feedback: Rosten ist viel zu langsam, um spürbar zu wärmen.
    hints:
      - Rost ist locker und enthält viel Wasser.
      - Mehr Volumen in festem Beton erzeugt Druck.
    explanation: Je nach Rostsorte wächst das Volumen auf das Zwei- bis Sechsfache. Darum bröckeln alte Brücken und Balkone.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Edelstahl enthält mindestens 10,5 % Chrom und rostet kaum. Warum?
    params:
      options:
        - label: Chrom bildet an der Oberfläche eine hauchdünne, dichte Oxidschicht, die sich selbst heilt
          correct: true
        - label: Chrom ist edler als Gold
          feedback: Chrom ist sogar unedler als Eisen.
        - label: Chrom stößt Wasser ab
          feedback: Es geht um eine Oxidschicht, nicht ums Abperlen.
    hints:
      - Denk an Aluminium, das trotz unedel nicht durchrostet.
      - Die Schicht ist nur wenige Nanometer dick.
    explanation: Diese **Passivierung** schützt, solange genug Sauerstoff nachkommt. Kratzer schließen sich von selbst wieder.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was beim Rosten mit dem Eisen passiert.
    params:
      keywords:
        - - oxid
          - elektron
          - electron
        - - sauerstoff
          - oxygen
          - o₂
        - - wasser
          - water
          - feucht
          - moist
      sample: "Beim Rosten wird Eisen oxidiert: Es gibt Elektronen ab. Sauerstoff nimmt sie auf. Dafür braucht es Wasser – darum rostet Eisen in trockener Luft kaum."
    explanation: Eisen, Sauerstoff und Wasser – fehlt eins, stoppt der Rost.
    difficulty: 3

srs:
  cards_from: [zink, schutz]
