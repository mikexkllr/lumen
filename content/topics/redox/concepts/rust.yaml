id: chem.redox.rust
type: concept
title: Rost und Schutz
summary: Langsame Oxidation im Alltag.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: braun
    widget: choice
    prompt: Ein angeschnittener Apfel wird braun. Was passiert?
    params:
      options:
        - { label: Stoffe im Apfel reagieren mit Sauerstoff., correct: true }
        - { label: Er verfault sofort., feedback: "Es ist eine schnelle Oxidation, keine Fäulnis." }
    hints:
      - Was kommt an die Schnittfläche?
    explanation: Zitronensaft bremst das – er reagiert bereitwilliger mit dem Sauerstoff.

  - kind: explain
    body: |
      **Rosten** ist die langsame Oxidation von Eisen mit Sauerstoff und Wasser. Rost blättert ab und legt neues Eisen frei – darum frisst er sich immer tiefer.

  - kind: problem
    id: zink
    widget: choice
    prompt: Warum rostet verzinkter Stahl kaum, selbst bei Kratzern?
    params:
      options:
        - { label: Das Zink gibt seine Elektronen leichter ab und opfert sich., correct: true }
        - { label: Zink ist wasserdicht., feedback: "Auch an Kratzern schützt Zink – es reagiert anstelle des Eisens." }
    hints:
      - Welches Metall oxidiert leichter?
    explanation: Zink ist eine **Opferanode** – es oxidiert zuerst.

  - kind: problem
    id: schutz
    widget: buckets
    prompt: Schützt das Eisen vor Rost?
    params:
      buckets: [{ label: schützt }, { label: schützt nicht }]
      items:
        - { label: Lackieren, bucket: schützt }
        - { label: Einölen, bucket: schützt }
        - { label: Verzinken, bucket: schützt }
        - { label: Mit Salzwasser abspülen, bucket: schützt nicht }
    hints:
      - Salz beschleunigt die Reaktion.
    explanation: Streusalz im Winter lässt Autos besonders schnell rosten.

srs:
  cards_from: [zink, schutz]
