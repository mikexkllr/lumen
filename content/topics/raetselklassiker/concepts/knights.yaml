id: logic.classics.knights
type: concept
title: Ritter und Schurken
summary: Wer lügt, wer sagt die Wahrheit?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ritter oder Schurke?
    body: Auf dieser Insel sagen Ritter immer die Wahrheit, Schurken lügen immer. Wer ist was? Deck Schritt für Schritt auf, wie man das mit einer **Fallunterscheidung** knackt.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🗣️
            front: "A sagt: »B lügt.«"
            back: "B sagt: »A und ich sind gleich.« Wer ist Ritter, wer Schurke?"
          - icon: 🤔
            front: "Annahme: A ist Ritter"
            back: "Dann stimmt sein Satz: B ist Schurke. Also lügt B – und wirklich sind beide verschieden. Passt!"
          - icon: 🔄
            front: "Gegenprobe: A ist Schurke"
            back: Dann ist B Ritter und sagt die Wahrheit. Aber A und B sind verschieden – Widerspruch!
          - icon: ✅
            front: Ergebnis
            back: A ist Ritter, B ist Schurke. Nur ein Fall bleibt ohne Widerspruch.

  - kind: problem
    id: einer
    widget: choice
    body: Auf einer Insel sagen Ritter immer die Wahrheit, Schurken lügen immer. A sagt – »Ich bin ein Schurke.«
    prompt: Was ist A?
    params:
      options:
        - { label: Das kann niemand sagen – es ist unmöglich., correct: true }
        - { label: Ein Ritter, feedback: "Ein Ritter würde nicht lügen und sich Schurke nennen." }
        - { label: Ein Schurke, feedback: "Dann wäre der Satz wahr – Schurken sagen aber nie die Wahrheit." }
    hints:
      - Prüfe beide Möglichkeiten.
    explanation: Beide Fälle führen zum Widerspruch. Diesen Satz kann auf der Insel niemand sagen.

  - kind: problem
    id: zwei
    widget: choice
    body: A sagt – »B ist ein Schurke.« B sagt – »Wir sind beide Ritter.«
    prompt: Was sind A und B?
    params:
      options:
        - { label: A ist Ritter – B ist Schurke, correct: true }
        - { label: Beide Ritter, feedback: "Dann wäre A's Satz über B gelogen." }
        - { label: Beide Schurken, feedback: "Dann wäre A's Satz »B ist Schurke« wahr – unmöglich für einen Schurken." }
    hints:
      - Wäre B ein Ritter, müsste A auch Ritter sein. Passt das zu A's Satz?
    explanation: B lügt – also sind nicht beide Ritter. A sagt die Wahrheit über B, ist also Ritter.

  - kind: explain
    id: s3
    body: |
      Solche Rätsel löst man mit **Fallunterscheidung**: Nimm an, jemand ist Ritter. Führt das zum Widerspruch, ist er Schurke.

  - kind: problem
    id: frage
    widget: choice
    body: An einer Weggabelung steht ein Ritter oder ein Schurke. Du weißt nicht, wer. Ein Weg führt ins Dorf.
    prompt: Welche Frage verrät dir sicher den Weg?
    params:
      options:
        - { label: "»Würdest du sagen, dass links ins Dorf führt?«", correct: true }
        - { label: »Führt links ins Dorf?«, feedback: "Ein Schurke würde lügen – du wüsstest nicht, wem du glauben sollst." }
        - { label: »Bist du ein Ritter?«, feedback: "Beide antworten mit Ja." }
    hints:
      - Lässt sich die Lüge doppelt verneinen?
    explanation: Der Schurke lügt über seine Lüge – die doppelte Verneinung ergibt die Wahrheit.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Ritter sagen immer die Wahrheit, Schurken lügen immer. Wer kann den Satz sagen?
    params:
      buckets:
        - id: b1
          label: Nur ein Ritter
        - id: b2
          label: Nur ein Schurke
        - id: b3
          label: Beide
        - id: b4
          label: Keiner
      items:
        - label: »2 + 2 = 4.«
          bucket: b1
        - label: »2 + 2 = 5.«
          bucket: b2
        - label: »Ich bin ein Ritter.«
          bucket: b3
        - label: »Ich bin ein Schurke.«
          bucket: b4
    hints:
      - Prüf jeden Satz für beide Fälle.
    explanation: "Niemand kann sich selbst Schurke nennen: Der Ritter löge, der Schurke spräche wahr."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Solche Rätsel löst man mit [[Fallunterscheidung]]: Nimm an, jemand ist Ritter. Führt das zum [[Widerspruch]], ist er Schurke."
      distractors:
        - Raten
        - Beweis

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "A sagt: »Mindestens einer von uns beiden ist ein Schurke.« Was sind A und B?"
    params:
      options:
        - label: A ist Ritter, B ist Schurke
          correct: true
        - label: Beide sind Schurken
          feedback: Dann wäre A’s Satz wahr – Schurken sagen nie die Wahrheit.
        - label: Beide sind Ritter
          feedback: Dann wäre der Satz falsch – Ritter lügen nie.
    hints:
      - Wäre A ein Schurke, wäre sein Satz wahr.
    explanation: A kann kein Schurke sein, also ist der Satz wahr – und der Schurke muss B sein.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: order
    prompt: "A sagt: »Wir sind beide Schurken.« Ordne die Lösung."
    params:
      items:
        - label: Angenommen, A ist Ritter
        - label: "Dann wäre der Satz wahr: A ist Schurke"
        - label: Widerspruch – also ist A Schurke
        - label: "Sein Satz ist gelogen: B ist Ritter"
    hints:
      - Fang mit der Annahme »Ritter« an.
    explanation: Ein einziger Satz verrät hier beide Rollen.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: numeric
    prompt: "A sagt: »Wir sind beide Schurken.« Wie viele Ritter gibt es unter A und B?"
    answer:
      value: 1
    hints:
      - A kann kein Ritter sein. Was folgt für B?
    explanation: "Genau einer: B. A lügt, also sind nicht beide Schurken."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: "A sagt: »Wir drei sind alle Schurken.« B sagt: »Genau einer von uns ist ein Ritter.« Was ist C?"
    params:
      options:
        - label: Ein Schurke
          correct: true
        - label: Ein Ritter
          feedback: Dann wäre C der einzige Ritter und Bs Satz wahr – aber dann wäre B auch ein Ritter.
        - label: Das lässt sich nicht sagen.
          feedback: Doch – nach zwei Annahmen bleibt nur ein Fall übrig.
    hints:
      - Kann A ein Ritter sein?
      - "A lügt, also gibt es mindestens einen Ritter. Probiere: B ist Ritter – und B ist Schurke."
    explanation: A kann kein Ritter sein. Ist B Schurke, muss C Ritter sein – dann gäbe es genau einen Ritter und B hätte recht. Widerspruch. Also ist B Ritter, der einzige. C ist ein Schurke.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "A sagt: »B ist ein Ritter.« B sagt: »A und ich sind von verschiedenem Typ.« Wie viele Ritter gibt es unter den beiden?"
    answer:
      value: 0
    feedback:
      - when: numval(state.input) == 2
        misconception: not-checked
        text: Sind beide Ritter, sind sie vom gleichen Typ – dann lügt B.
    hints:
      - Nimm an, A ist ein Ritter. Was folgt für B und seinen Satz?
      - A lügt also. Was ist dann B – und ist Bs Satz dann falsch?
    explanation: Wäre A Ritter, wäre B Ritter – aber dann wären beide gleich, und B würde lügen. Also lügt A, und B ist Schurke. Bs Satz ist falsch, denn beide sind gleich. Kein Ritter.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Zwei Wächter: Einer lügt immer, einer nie. Eine Tür führt in die Freiheit. Du darfst **eine** Frage stellen. Welche?"
    params:
      options:
        - label: »Welche Tür würde der andere Wächter nennen?« – und dann die andere nehmen
          correct: true
        - label: »Bist du der Lügner?«
          feedback: Beide antworten »Nein« – du erfährst nichts.
        - label: »Welche Tür führt in die Freiheit?«
          feedback: Du weißt nicht, ob die Antwort gelogen ist.
    hints:
      - Bau die Lüge **genau einmal** in jede mögliche Antwort ein.
    explanation: In beiden Fällen steckt genau eine Lüge in der Antwort – sie zeigt immer auf die falsche Tür.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "A sagt: »B und ich sind vom gleichen Typ.« Was weißt du sicher?"
    params:
      options:
        - label: B ist ein Ritter – über A weiß man nichts.
          correct: true
        - label: Beide sind Ritter.
          feedback: "Auch ein Schurke A kann das sagen: Dann ist B Ritter, und der Satz ist gelogen."
        - label: Gar nichts.
          feedback: Spiel beide Fälle für A durch – in beiden kommt für B dasselbe heraus.
    hints:
      - "Fall 1: A ist Ritter. Dann stimmt der Satz. Was ist B?"
      - "Fall 2: A ist Schurke. Dann sind die beiden verschieden. Was ist B?"
    explanation: "Ritter A: gleicher Typ, also B Ritter. Schurke A: verschiedener Typ, also B Ritter. Logisch gilt »A ↔ (A ↔ B)« genau dann, wenn B wahr ist. Mit diesem Trick bauen Rätsel Fragen, die immer funktionieren."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Frage »Würdest du sagen, dass links ins Dorf führt?« auch einen Schurken zur Wahrheit zwingt.
    params:
      keywords:
        - - zweimal
          - doppelt
          - zwei lügen
          - twice
          - double
        - - lüge
          - lügt
          - gelogen
          - lie
          - lies
        - - wahr
          - richtig
          - stimmt
          - "true"
          - truth
          - right
          - correct
      sample: Ein Schurke lügt über seine eigene Antwort. Er würde auf »Führt links ins Dorf?« lügen, und über diese Lüge lügt er noch einmal. Zweimal gelogen ergibt die Wahrheit.
    difficulty: 3

srs:
  cards_from: [zwei, frage]
