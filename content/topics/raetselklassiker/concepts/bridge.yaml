id: logic.classics.bridge
type: concept
title: Die Brücke bei Nacht
summary: Wer geht mit wem?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: naiv
    widget: numeric
    body: Vier Leute brauchen für eine Brücke 1, 2, 5 und 10 Minuten. Höchstens zwei gehen zusammen – im Tempo des Langsameren. Es gibt nur eine Lampe.
    prompt: Der Schnellste begleitet jeden einzeln und läuft zurück. Wie lange dauert das?
    params: { unit: Minuten }
    answer: { value: 19 }
    hints:
      - 2 + 1 + 5 + 1 + 10.
    explanation: 2 + 1 + 5 + 1 + 10 = 19 Minuten. Es geht aber schneller!

  - kind: explain
    id: s2
    body: Der Trick – die zwei Langsamsten gehen **zusammen**. Dann zählt die 5 nicht extra.

  - kind: problem
    id: besser
    widget: order
    prompt: Bring die Gänge für 17 Minuten in die richtige Reihenfolge.
    params:
      items:
        - { id: hin1, label: "1 und 2 gehen hin (2 Min.)" }
        - { id: zur1, label: "1 kommt zurück (1 Min.)" }
        - { id: lang, label: "5 und 10 gehen hin (10 Min.)" }
        - { id: zur2, label: "2 kommt zurück (2 Min.)" }
        - { id: hin2, label: "1 und 2 gehen wieder hin (2 Min.)" }
    answer:
      anyOf: [[hin1, zur2, lang, zur1, hin2]]
    hints:
      - Die zwei Langsamen dürfen nicht mit der Lampe zurück müssen.
    explanation: 2 + 1 + 10 + 2 + 2 = 17 Minuten.

  - kind: problem
    id: minimum
    widget: numeric
    prompt: Wie viele Minuten braucht die beste Lösung?
    params: { unit: Minuten }
    answer: { value: 17 }
    hints:
      - Rechne die Schritte von eben zusammen.
    explanation: 17 Minuten – zwei weniger als die naheliegende Lösung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Vier Leute brauchen 1, 2, 7 und 10 Minuten. Höchstens zwei gehen zugleich, mit der einzigen Lampe. Wie viele Minuten braucht die beste Lösung?
    answer:
      value: 17
    hints:
      - 1 und 2 hin, 1 zurück, 7 und 10 hin, 2 zurück, 1 und 2 hin.
    explanation: 2 + 1 + 10 + 2 + 2 = 17. Die beiden Langsamen gehen zusammen – so zählt die 7 nicht extra.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Jetzt brauchen die vier 1, 2, 5 und 8 Minuten. Wie schnell schaffen sie es bestenfalls?
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 17
        misconception: escort-only
        text: So lange dauert es, wenn der Schnellste jeden begleitet. Lass die zwei Langsamsten zusammen gehen.
    hints:
      - "Probier den Trick: 1 und 2 hin, 1 zurück, 5 und 8 hin …"
      - Danach geht 2 zurück und holt 1 ab.
    explanation: 2 + 1 + 8 + 2 + 2 = 15 Minuten. Die 5 läuft mit der 8 und kostet nichts extra.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Neue Gruppe: 1, 4, 5 und 6 Minuten. Wie viele Minuten braucht die beste Lösung?"
    answer:
      value: 17
    feedback:
      - when: numval(state.input) == 19
        misconception: pair-trick-always
        text: "Hier lohnt der Paar-Trick nicht: Die 4 müsste zweimal extra laufen."
    hints:
      - "Rechne beide Strategien aus: Begleiten durch die 1 und den Paar-Trick."
      - "Begleiten: 4 + 1 + 5 + 1 + 6. Paar-Trick: 4 + 1 + 6 + 4 + 4."
    explanation: Begleiten kostet 17, der Paar-Trick 19. Kein Trick gewinnt immer – man muss vergleichen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist es beim Brückenrätsel nicht am besten, wenn der Schnellste alle begleitet?"
    params:
      keywords:
        - - langsam
          - slow
        - - zusammen
          - gemeinsam
          - together
        - - einmal
          - nur einmal
          - once
          - zählt
          - count
          - doppelt
          - twice
          - extra
      sample: Jeder Gang dauert so lange wie der Langsamere. Gehen die beiden Langsamsten zusammen, zählt ihre lange Zeit nur einmal – statt dass jede von ihnen einen eigenen langen Gang kostet.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Die Zeiten sind a ≤ b ≤ c ≤ d. Wann ist der Paar-Trick besser als das Begleiten?
    params:
      options:
        - label: Wenn 2b < a + c
          correct: true
        - label: Wenn d sehr groß ist
          feedback: d zählt bei beiden Strategien genau einmal.
        - label: Immer
          feedback: Bei 1, 4, 5, 6 verliert der Trick.
    hints:
      - Begleiten kostet b + c + d + 2a. Der Paar-Trick kostet a + 3b + d.
      - Ziehe beides voneinander ab. Was bleibt übrig?
    explanation: Der Unterschied ist (2a + b + c + d) − (a + 3b + d) = a + c − 2b. Ist 2b kleiner als a + c, gewinnt der Trick. Bei 1, 2, 7, 10 gilt 4 < 8.
    difficulty: 3

srs:
  cards_from: [minimum, naiv]
