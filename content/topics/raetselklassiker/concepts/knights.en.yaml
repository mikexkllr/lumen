id: logic.classics.knights
type: concept
title: Knights and knaves
summary: Who lies, who tells the truth?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Knight or knave?
    body: On this island, knights always tell the truth and knaves always lie. Who is who? Uncover step by step how to crack it by checking **case by case**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🗣️
            front: 'A says: "B lies."'
            back: 'B says: "A and I are the same." Who is the knight, who the knave?'
          - icon: 🤔
            front: Suppose A is a knight
            back: "Then his sentence is true: B is a knave. So B lies – and the two really are different. It fits!"
          - icon: 🔄
            front: "Check: A is a knave"
            back: Then B is a knight and tells the truth. But A and B are different – a contradiction!
          - icon: ✅
            front: Result
            back: A is a knight, B is a knave. Only one case survives without a contradiction.

  - kind: problem
    id: einer
    widget: choice
    body: On an island, knights always tell the truth and knaves always lie. A says, “I am a knave.”
    prompt: What is A?
    params:
      options:
        - { label: "No one can say, because it is impossible.", correct: true }
        - { label: A knight, feedback: "A knight would not lie and call himself a knave." }
        - { label: A knave, feedback: "Then the sentence would be true, but knaves never tell the truth." }
    hints:
      - Check both possibilities.
    explanation: Both cases lead to a contradiction. No one on the island can say this sentence.

  - kind: problem
    id: zwei
    widget: choice
    body: A says, “B is a knave.” B says, “We are both knights.”
    prompt: What are A and B?
    params:
      options:
        - { label: "A is a knight, B is a knave", correct: true }
        - { label: Both knights, feedback: "Then A's statement about B would be a lie." }
        - { label: Both knaves, feedback: "Then A's statement “B is a knave” would be true, which is impossible for a knave." }
    hints:
      - If B were a knight, A would have to be a knight too. Does that fit A's statement?
    explanation: B lies, so they are not both knights. A tells the truth about B, so A is a knight.

  - kind: explain
    id: s3
    body: |
      You solve such puzzles with **case analysis**. Assume someone is a knight. If that leads to a contradiction, he is a knave.

  - kind: problem
    id: frage
    widget: choice
    body: At a fork in the road stands a knight or a knave. You don't know which. One path leads to the village.
    prompt: Which question reliably shows you the way?
    params:
      options:
        - { label: "“Would you say that the left path leads to the village?”", correct: true }
        - { label: “Does the left path lead to the village?”, feedback: "A knave would lie, and you would not know whom to believe." }
        - { label: “Are you a knight?”, feedback: "Both answer yes." }
    hints:
      - Can you make the lie cancel itself out?
    explanation: The knave lies about his lie. The double negation gives the truth.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Knights always tell the truth, knaves always lie. Who can say the sentence?
    params:
      buckets:
        - id: b1
          label: Only a knight
        - id: b2
          label: Only a knave
        - id: b3
          label: Both
        - id: b4
          label: Neither
      items:
        - label: “2 + 2 = 4.”
          bucket: b1
        - label: “2 + 2 = 5.”
          bucket: b2
        - label: “I am a knight.”
          bucket: b3
        - label: “I am a knave.”
          bucket: b4
    hints:
      - Check each sentence for both cases.
    explanation: "Nobody can call themselves a knave: the knight would lie, the knave would tell the truth."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Such puzzles are solved by [[case analysis]]: suppose someone is a knight. If that leads to a [[contradiction]], they are a knave."
      distractors:
        - guessing
        - proof

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "A says: “At least one of the two of us is a knave.” What are A and B?"
    params:
      options:
        - label: A is a knight, B is a knave
          correct: true
        - label: Both are knaves
          feedback: Then A’s sentence would be true – knaves never tell the truth.
        - label: Both are knights
          feedback: Then the sentence would be false – knights never lie.
    hints:
      - If A were a knave, his sentence would be true.
    explanation: A cannot be a knave, so the sentence is true – and the knave must be B.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: order
    prompt: "A says: “We are both knaves.” Order the solution."
    params:
      items:
        - label: Suppose A is a knight
        - label: "Then the sentence is true: A is a knave"
        - label: Contradiction – so A is a knave
        - label: "His sentence is a lie: B is a knight"
    hints:
      - Start with the assumption “knight”.
    explanation: A single sentence reveals both roles here.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: numeric
    prompt: "A says: “We are both knaves.” How many knights are there among A and B?"
    answer:
      value: 1
    hints:
      - A cannot be a knight. What follows for B?
    explanation: "Exactly one: B. A lies, so they are not both knaves."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: 'A says: "All three of us are knaves." B says: "Exactly one of us is a knight." What is C?'
    params:
      options:
        - label: A knave
          correct: true
        - label: A knight
          feedback: Then C would be the only knight and B would be telling the truth – so B would be a knight too.
        - label: It cannot be determined.
          feedback: It can – after two assumptions only one case is left.
    hints:
      - Can A be a knight?
      - A lies, so there is at least one knight. Try B as a knight and B as a knave.
    explanation: A cannot be a knight. If B were a knave, C would have to be a knight – then there would be exactly one knight and B would be right. Contradiction. So B is the only knight, and C is a knave.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: 'A says: "B is a knight." B says: "A and I are of different types." How many knights are there among the two?'
    answer:
      value: 0
    feedback:
      - when: numval(state.input) == 2
        misconception: not-checked
        text: If both are knights they are the same type – then B is lying.
    hints:
      - Assume A is a knight. What follows for B and his statement?
      - So A lies. What is B then – and is B's statement false then?
    explanation: If A were a knight, B would be one too – but then both would be alike and B would be lying. So A lies and B is a knave. B's statement is false, since both are alike. No knights.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Two guards: one always lies, one never. One door leads to freedom. You may ask **one** question. Which?"
    params:
      options:
        - label: “Which door would the other guard name?” – and then take the other one
          correct: true
        - label: “Are you the liar?”
          feedback: Both answer “no” – you learn nothing.
        - label: “Which door leads to freedom?”
          feedback: You do not know whether the answer is a lie.
    hints:
      - Build the lie into every possible answer **exactly once**.
    explanation: In both cases exactly one lie is in the answer – it always points to the wrong door.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: 'A says: "B and I are of the same type." What do you know for sure?'
    params:
      options:
        - label: B is a knight – nothing is known about A.
          correct: true
        - label: Both are knights.
          feedback: "A knave A can say it too: then B is a knight and the sentence is a lie."
        - label: Nothing at all.
          feedback: Play through both cases for A – both give the same result for B.
    hints:
      - "Case 1: A is a knight. Then the sentence is true. What is B?"
      - "Case 2: A is a knave. Then the two differ. What is B?"
    explanation: 'Knight A: same type, so B is a knight. Knave A: different types, so B is a knight. Logically, "A ↔ (A ↔ B)" holds exactly when B is true. Puzzles use this trick to build questions that always work.'
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why the question "Would you say that the left path leads to the village?" forces even a knave to tell the truth.
    params:
      keywords:
        - - zweimal
          - doppelt
          - zwei lügen
          - twice
          - double
        - - lüge
          - lügt
          - gelogen
          - lie
          - lies
        - - wahr
          - richtig
          - stimmt
          - "true"
          - truth
          - right
          - correct
      sample: A knave lies about his own answer. He would lie to "Does the left path lead to the village?", and he lies about that lie once more. Lying twice gives the truth.
    difficulty: 3

srs:
  cards_from: [zwei, frage]
