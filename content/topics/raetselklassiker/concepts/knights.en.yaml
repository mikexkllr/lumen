id: logic.classics.knights
type: concept
title: Knights and knaves
summary: Who lies, who tells the truth?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: einer
    widget: choice
    body: On an island, knights always tell the truth and knaves always lie. A says, “I am a knave.”
    prompt: What is A?
    params:
      options:
        - { label: "No one can say, because it is impossible.", correct: true }
        - { label: A knight, feedback: "A knight would not lie and call himself a knave." }
        - { label: A knave, feedback: "Then the sentence would be true, but knaves never tell the truth." }
    hints:
      - Check both possibilities.
    explanation: Both cases lead to a contradiction. No one on the island can say this sentence.

  - kind: problem
    id: zwei
    widget: choice
    body: A says, “B is a knave.” B says, “We are both knights.”
    prompt: What are A and B?
    params:
      options:
        - { label: "A is a knight, B is a knave", correct: true }
        - { label: Both knights, feedback: "Then A's statement about B would be a lie." }
        - { label: Both knaves, feedback: "Then A's statement “B is a knave” would be true, which is impossible for a knave." }
    hints:
      - If B were a knight, A would have to be a knight too. Does that fit A's statement?
    explanation: B lies, so they are not both knights. A tells the truth about B, so A is a knight.

  - kind: explain
    body: |
      You solve such puzzles with **case analysis**. Assume someone is a knight. If that leads to a contradiction, he is a knave.

  - kind: problem
    id: frage
    widget: choice
    body: At a fork in the road stands a knight or a knave. You don't know which. One path leads to the village.
    prompt: Which question reliably shows you the way?
    params:
      options:
        - { label: "“Would you say that the left path leads to the village?”", correct: true }
        - { label: “Does the left path lead to the village?”, feedback: "A knave would lie, and you would not know whom to believe." }
        - { label: “Are you a knight?”, feedback: "Both answer yes." }
    hints:
      - Can you make the lie cancel itself out?
    explanation: The knave lies about his lie. The double negation gives the truth.

srs:
  cards_from: [zwei, frage]
