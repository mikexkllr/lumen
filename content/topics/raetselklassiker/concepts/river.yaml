id: logic.classics.river
type: concept
title: Wolf, Ziege und Kohl
summary: Planen, damit niemand gefressen wird.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das älteste Flussrätsel
    body: Dieses Rätsel ist über 1200 Jahre alt und noch immer knifflig. Deck die Karten der Reihe nach auf. Dann siehst du, warum der Bauer einen klugen **Plan** braucht, damit niemand gefressen wird.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 📜
            front: Um das Jahr 800
            back: Alkuin, ein Gelehrter am Hof Karls des Großen, schreibt das Rätsel auf.
          - icon: 🐺
            front: Der Wolf
            back: Bleibt er ohne den Bauern bei der Ziege, frisst er sie.
          - icon: 🐐
            front: Die Ziege
            back: Bleibt sie ohne den Bauern beim Kohl, frisst sie ihn.
          - icon: 🛶
            front: Das kleine Boot
            back: "Es trägt den Bauern und genau eins: Wolf, Ziege oder Kohl."

  - kind: problem
    id: zuerst
    widget: choice
    body: Ein Bauer will Wolf, Ziege und Kohl über den Fluss bringen. Ins Boot passt nur eins. Allein frisst der Wolf die Ziege und die Ziege den Kohl.
    prompt: Was muss er zuerst mitnehmen?
    params:
      options:
        - { label: Die Ziege, correct: true }
        - { label: Den Wolf, feedback: "Dann frisst die Ziege den Kohl." }
        - { label: Den Kohl, feedback: "Dann frisst der Wolf die Ziege." }
    hints:
      - Wer darf auf keinen Fall mit einem anderen allein bleiben?
    explanation: Nur Wolf und Kohl vertragen sich. Also muss die Ziege zuerst weg.

  - kind: problem
    id: zurueck
    widget: choice
    prompt: Der Bauer hat den Wolf hinübergebracht. Dort wartet schon die Ziege. Was nimmt er auf der Rückfahrt mit?
    params:
      options:
        - { label: Die Ziege, correct: true }
        - { label: Nichts, feedback: "Dann frisst der Wolf die Ziege, sobald er weg ist." }
        - { label: Den Wolf, feedback: "Dann wäre er wieder am Anfang." }
    hints:
      - Wolf und Ziege dürfen nicht allein bleiben.
    explanation: Der Trick – die Ziege fährt zurück. Das fühlt sich wie ein Rückschritt an, ist aber der Schlüssel.

  - kind: problem
    id: fahrten
    widget: numeric
    prompt: Wie viele Fahrten über den Fluss braucht der Bauer mindestens? Jede Richtung zählt einzeln.
    params: { unit: Fahrten }
    answer: { value: 7 }
    hints:
      - Ziege hin, allein zurück, Wolf hin, Ziege zurück …
    explanation: Ziege hin, zurück, Wolf hin, Ziege zurück, Kohl hin, zurück, Ziege hin – 7 Fahrten.

  - kind: explain
    id: s4
    body: Solche Rätsel löst man, indem man **Zustände** aufschreibt – wer steht wo? Ein Computer durchsucht genauso alle Zustände, bis er den kürzesten Weg findet.

  - kind: problem
    id: eimer
    widget: order
    prompt: Du hast einen 3-Liter- und einen 5-Liter-Eimer. Bring die Schritte in Reihenfolge, um genau 4 Liter abzumessen.
    params:
      items:
        - { label: Den 5-Liter-Eimer füllen }
        - { label: Damit den 3-Liter-Eimer füllen – 2 Liter bleiben }
        - { label: Den 3-Liter-Eimer leeren }
        - { label: Die 2 Liter in den 3-Liter-Eimer gießen }
        - { label: Den 5-Liter-Eimer wieder füllen }
        - { label: Den 3-Liter-Eimer auffüllen – 4 Liter bleiben }
    hints:
      - Fang mit dem großen Eimer an.
    explanation: 5 − 3 = 2, und später 5 − 1 = 4. Der kleine Eimer dient als Messbecher.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bauer, Wolf, Ziege, Kohl: Jeder ist links oder rechts. Wie viele Zustände gibt es insgesamt – erlaubte und verbotene?"
    answer:
      value: 16
    hints:
      - Vier Dinge, je zwei Ufer.
    explanation: 2⁴ = 16. Davon sind 10 erlaubt – der Lösungsweg führt durch 8 von ihnen.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: network
    prompt: "Jeder Punkt zeigt, wer noch links steht: B Bauer, W Wolf, Z Ziege, K Kohl. Linien sind erlaubte Fahrten. Finde den kürzesten Weg von »alle links« zu »alle rechts«."
    params:
      start: n1
      end: n10
      aspect: 0.5
      nodes:
        - id: n1
          x: 4
          y: 50
          label: BWZK
        - id: n2
          x: 16
          y: 50
          label: WK
        - id: n3
          x: 29
          y: 50
          label: BWK
        - id: n4
          x: 43
          y: 12
          label: K
        - id: n5
          x: 43
          y: 88
          label: W
        - id: n6
          x: 58
          y: 12
          label: BZK
        - id: n7
          x: 58
          y: 88
          label: BWZ
        - id: n8
          x: 71
          y: 50
          label: Z
        - id: n9
          x: 84
          y: 50
          label: BZ
        - id: n10
          x: 96
          y: 50
          label: –
      edges:
        - a: n1
          b: n2
        - a: n2
          b: n3
        - a: n3
          b: n4
        - a: n3
          b: n5
        - a: n4
          b: n6
        - a: n5
          b: n7
        - a: n6
          b: n8
        - a: n7
          b: n8
        - a: n8
          b: n9
        - a: n9
          b: n10
    hints:
      - "Vom Start aus gibt es nur eine erlaubte Fahrt: die Ziege rüber."
      - In der Mitte teilt sich der Weg – beide Zweige sind gleich lang.
    explanation: "Sieben Fahrten, und es gibt genau zwei kürzeste Lösungen: erst Wolf oder erst Kohl. Das Rätsel ist eine Suche im **Zustandsgraphen**."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Drei Mönche und drei Räuber wollen über den Fluss. Das Boot trägt zwei. Nie dürfen an einem Ufer mehr Räuber als Mönche sein, wenn dort Mönche stehen. Wie viele Fahrten braucht man mindestens?
    answer:
      value: 11
    hints:
      - Jede Richtung zählt als eine Fahrt. Das Boot muss immer wieder zurück.
      - Eine Breitensuche über alle erlaubten Zustände findet die Antwort sicher.
    explanation: Die kürzeste Lösung hat 11 Fahrten. Man findet sie, indem man alle erlaubten Zustände durchsucht – wie beim Wolf-Ziege-Kohl-Rätsel.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie findet ein Computer garantiert die **kürzeste** Lösung eines solchen Rätsels?
    params:
      options:
        - label: Er untersucht erst alle Zustände nach 1 Zug, dann nach 2, dann nach 3 – die Breitensuche
          correct: true
        - label: Er probiert einen Weg bis zum Ende und nimmt den ersten Treffer
          feedback: Der erste gefundene Weg ist nicht unbedingt der kürzeste.
        - label: Er rät zufällig
          feedback: Dann gäbe es keine Garantie.
    hints:
      - Was man zuerst erreicht, ist am nächsten.
    explanation: Die **Breitensuche** breitet sich wie eine Welle aus. Die App prüft genau so, ob ihre Rätsel lösbar sind.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Du hast einen 4-Liter- und einen 6-Liter-Eimer und einen Wasserhahn. Kannst du genau 3 Liter abmessen?
    params:
      options:
        - label: Nein – jede erreichbare Menge ist gerade.
          correct: true
        - label: Ja, mit genug Umfüllen.
          feedback: "Probier es: Es entstehen immer nur 0, 2, 4 oder 6 Liter."
        - label: Ja, man halbiert den 6-Liter-Eimer.
          feedback: Halbieren nach Augenmaß ist nicht genau – erlaubt ist nur Füllen, Leeren und Umgießen.
    hints:
      - Welche Mengen entstehen, wenn du füllst, leerst und umgießt?
      - Alle Mengen sind Summen und Differenzen von 4 und 6. Was haben die gemeinsam?
    explanation: "Das ist eine **Invariante**: Jede Menge ist ein Vielfaches von ggT(4, 6) = 2. Bei 3 und 5 Litern ist der ggT 1 – darum klappt dort jede ganze Literzahl."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Computer ein Flussrätsel sicher mit den wenigsten Fahrten löst.
    params:
      keywords:
        - - zustand
          - zustände
          - state
        - - fahrt
          - zug
          - übergang
          - schritt
          - crossing
          - move
          - step
        - - kürzest
          - wenigst
          - breit
          - shortest
          - fewest
          - breadth
      sample: Er schreibt jeden Zustand auf, also wer an welchem Ufer steht. Dann probiert er erst alle Fahrten mit einem Schritt, dann mit zwei und so weiter. Die Breitensuche findet so zuerst den kürzesten Weg.
    difficulty: 3

srs:
  cards_from: [zuerst, fahrten]
