id: logic.classics.river
type: concept
title: Wolf, Ziege und Kohl
summary: Planen, damit niemand gefressen wird.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zuerst
    widget: choice
    body: Ein Bauer will Wolf, Ziege und Kohl über den Fluss bringen. Ins Boot passt nur eins. Allein frisst der Wolf die Ziege und die Ziege den Kohl.
    prompt: Was muss er zuerst mitnehmen?
    params:
      options:
        - { label: Die Ziege, correct: true }
        - { label: Den Wolf, feedback: "Dann frisst die Ziege den Kohl." }
        - { label: Den Kohl, feedback: "Dann frisst der Wolf die Ziege." }
    hints:
      - Wer darf auf keinen Fall mit einem anderen allein bleiben?
    explanation: Nur Wolf und Kohl vertragen sich. Also muss die Ziege zuerst weg.

  - kind: problem
    id: zurueck
    widget: choice
    prompt: Der Bauer hat den Wolf hinübergebracht. Dort wartet schon die Ziege. Was nimmt er auf der Rückfahrt mit?
    params:
      options:
        - { label: Die Ziege, correct: true }
        - { label: Nichts, feedback: "Dann frisst der Wolf die Ziege, sobald er weg ist." }
        - { label: Den Wolf, feedback: "Dann wäre er wieder am Anfang." }
    hints:
      - Wolf und Ziege dürfen nicht allein bleiben.
    explanation: Der Trick – die Ziege fährt zurück. Das fühlt sich wie ein Rückschritt an, ist aber der Schlüssel.

  - kind: problem
    id: fahrten
    widget: numeric
    prompt: Wie viele Fahrten über den Fluss braucht der Bauer mindestens? Jede Richtung zählt einzeln.
    params: { unit: Fahrten }
    answer: { value: 7 }
    hints:
      - Ziege hin, allein zurück, Wolf hin, Ziege zurück …
    explanation: Ziege hin, zurück, Wolf hin, Ziege zurück, Kohl hin, zurück, Ziege hin – 7 Fahrten.

  - kind: explain
    id: s4
    body: Solche Rätsel löst man, indem man **Zustände** aufschreibt – wer steht wo? Ein Computer durchsucht genauso alle Zustände, bis er den kürzesten Weg findet.

  - kind: problem
    id: eimer
    widget: order
    prompt: Du hast einen 3-Liter- und einen 5-Liter-Eimer. Bring die Schritte in Reihenfolge, um genau 4 Liter abzumessen.
    params:
      items:
        - { label: Den 5-Liter-Eimer füllen }
        - { label: Damit den 3-Liter-Eimer füllen – 2 Liter bleiben }
        - { label: Den 3-Liter-Eimer leeren }
        - { label: Die 2 Liter in den 3-Liter-Eimer gießen }
        - { label: Den 5-Liter-Eimer wieder füllen }
        - { label: Den 3-Liter-Eimer auffüllen – 4 Liter bleiben }
    hints:
      - Fang mit dem großen Eimer an.
    explanation: 5 − 3 = 2, und später 5 − 1 = 4. Der kleine Eimer dient als Messbecher.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bauer, Wolf, Ziege, Kohl: Jeder ist links oder rechts. Wie viele Zustände gibt es insgesamt – erlaubte und verbotene?"
    answer:
      value: 16
    hints:
      - Vier Dinge, je zwei Ufer.
    explanation: 2⁴ = 16. Davon sind 10 erlaubt – der Lösungsweg führt durch 8 von ihnen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie findet ein Computer garantiert die **kürzeste** Lösung eines solchen Rätsels?
    params:
      options:
        - label: Er untersucht erst alle Zustände nach 1 Zug, dann nach 2, dann nach 3 – die Breitensuche
          correct: true
        - label: Er probiert einen Weg bis zum Ende und nimmt den ersten Treffer
          feedback: Der erste gefundene Weg ist nicht unbedingt der kürzeste.
        - label: Er rät zufällig
          feedback: Dann gäbe es keine Garantie.
    hints:
      - Was man zuerst erreicht, ist am nächsten.
    explanation: Die **Breitensuche** breitet sich wie eine Welle aus. Die App prüft genau so, ob ihre Rätsel lösbar sind.
    difficulty: 3

srs:
  cards_from: [zuerst, fahrten]
