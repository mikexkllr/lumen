id: logic.classics.lights
type: concept
title: Lichter aus!
summary: Jeder Tipp schaltet auch die Nachbarn um.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: plus
    widget: pixels
    body: Ein Tipp schaltet das Feld und seine vier Nachbarn um – an wird aus, aus wird an.
    prompt: Mach alle Lichter aus.
    params: { cells: [".#.", "###", ".#."], rule: lightsout }
    answer: { pattern: ["...", "...", "..."] }
    hints:
      - Ein einziger Tipp genügt. Welches Feld hat genau dieses Muster als Nachbarn?
    explanation: Die Mitte schaltet sich und ihre vier Nachbarn – genau das Plus.

  - kind: explain
    id: s2
    body: Wichtig – zweimal dasselbe Feld drücken hebt sich auf. Und die **Reihenfolge** ist egal. Man muss nur wissen, **welche** Felder man drückt.

  - kind: problem
    id: ecken
    widget: pixels
    prompt: Mach alle Lichter aus. Zwei Tipps reichen.
    params: { cells: ["##.", "#.#", ".##"], rule: lightsout }
    answer: { pattern: ["...", "...", "..."] }
    hints:
      - Schau dir die Ecken oben links und unten rechts an.
    explanation: Ein Tipp oben links und einer unten rechts schalten alles aus.

  - kind: problem
    id: reihenfolge
    widget: choice
    prompt: Spielt die Reihenfolge der Tipps eine Rolle?
    params:
      options:
        - { label: "Nein – nur, welche Felder gedrückt werden", correct: true }
        - { label: "Ja – man muss von oben nach unten arbeiten", feedback: "Das ist eine gute Strategie, aber keine Pflicht. Jedes Umschalten ist unabhängig." }
    hints:
      - Wie oft wird ein Feld umgeschaltet – und hängt das von der Reihenfolge ab?
    explanation: Jedes Licht wird so oft umgeschaltet, wie Felder in seiner Nähe gedrückt werden. Die Reihenfolge ändert die Anzahl nicht.

  - kind: explain
    id: s5
    body: Profi-Trick – arbeite **Zeile für Zeile**. Brennt oben ein Licht, drücke das Feld direkt darunter. So schiebst du alle Lichter nach unten.

  - kind: problem
    id: vier
    widget: pixels
    prompt: Großes Feld. Mach alle Lichter aus.
    params: { cells: ["###.", ".#.#", "#.##", "##.#"], rule: lightsout }
    answer: { pattern: ["....", "....", "....", "...."] }
    hints:
      - Drücke zuerst das Feld unter jedem Licht der obersten Zeile.
      - Drei Tipps reichen, wenn du die richtigen findest.
    explanation: Die Tipps auf Zeile 1 Spalte 2, Zeile 3 Spalte 4 und Zeile 4 Spalte 1 lösen das Feld.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein 3 × 3-Feld mit Lichtern. Jedes Feld drückt man entweder oder nicht. Wie viele verschiedene Drück-Kombinationen gibt es?
    answer:
      value: 512
    hints:
      - 9 Felder, je zwei Möglichkeiten.
    explanation: 2⁹ = 512. Weil Reihenfolge und Wiederholung egal sind, ist das der ganze Suchraum.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum lässt sich »Lichter aus« mit einem Gleichungssystem lösen?
    params:
      options:
        - label: Jedes Licht ist am Ende aus, wenn es eine gerade Zahl von Malen umgeschaltet wurde – das ist Rechnen modulo 2
          correct: true
        - label: Weil die Lichter Zahlen anzeigen
          feedback: Sie sind nur an oder aus.
        - label: Das geht nicht – man muss probieren
          feedback: Computer lösen es mit linearer Algebra in Millisekunden.
    hints:
      - An + an = aus. Wie bei 1 + 1 = 0 modulo 2.
    explanation: Ein Rätsel wird zu **linearer Algebra über zwei Zahlen**. Dieselbe Mathematik steckt in fehlerkorrigierenden Codes.
    difficulty: 3

srs:
  cards_from: [reihenfolge, ecken]
