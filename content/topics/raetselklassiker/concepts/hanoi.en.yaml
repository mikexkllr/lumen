id: logic.classics.hanoi
type: concept
title: The Towers of Hanoi
summary: One tower, three pegs, one golden rule.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: la-hook
    widget: estimate
    prompt: "Take a guess: how many moves do you need at least for a tower of 10 disks?"
    params:
      min: 10
      max: 100000
      scale: log
    answer:
      value: 1023
      within: 40
    explanation: 2¹⁰ − 1 = 1023. Every extra disk doubles the work – plus one move.

  - kind: problem
    id: zwei
    widget: hanoi
    prompt: Move the tower to peg C. A larger disk must never sit on a smaller one.
    params: { disks: 2 }
    hints:
      - The small disk has to make room first.
    explanation: Small to B, large to C, small to C. Three moves.

  - kind: problem
    id: drei
    widget: hanoi
    prompt: Now with three disks. Can you do it in 7 moves?
    params: { disks: 3, maxMoves: 7 }
    hints:
      - First move the top two disks to B, as before.
      - Then move the large one to C and the two from B on top.
    explanation: Move the small tower away, move the large disk across, put the small tower on top. That is 3 + 1 + 3 = 7 moves.

  - kind: explain
    id: s3
    body: Do you see the pattern? How do you move a tower of n disks?
    reveal:
      body: Move a tower of n − 1 disks aside, move the largest disk to the goal, put the tower back on top. Each new disk doubles the work, plus one move.

  - kind: problem
    id: vier-zuege
    widget: numeric
    prompt: What is the minimum number of moves for {{n}} disks?
    params: { unit: moves }
    answer: { value: "{{2 ** n - 1}}" }
    feedback:
      - when: "numval(state.input) == 2 ** n"
        misconception: off-by-one
        text: Almost. It is one less. 3 disks need 7 moves, not 8.
    hints:
      - 1 disk takes 1 move, 2 take 3 moves, 3 take 7 moves. Double it and add 1.
    explanation: "$2^{ {{n}} } - 1 = {{2 ** n - 1}}$ moves."
    variants:
      params: { n: "int[4,8]" }
      defaults: { n: 4 }

  - kind: problem
    id: legende
    widget: choice
    prompt: A legend tells of 64 disks and one move per second. How long does that take?
    params:
      options:
        - { label: About 585 billion years, correct: true }
        - { label: About 64 years, feedback: "The moves double with each disk. That grows much faster." }
        - { label: About 2 years, feedback: "Far too little. Think of $2^{64}$." }
    hints:
      - $2^{64}$ is a number with 20 digits.
    explanation: $2^{64} - 1$ seconds is about 585 billion years, more than 40 times the age of the universe.

  - kind: problem
    id: vier
    widget: hanoi
    prompt: "Master test: four disks in 15 moves."
    params: { disks: 4, maxMoves: 15 }
    hints:
      - First move three disks to B. That is the puzzle from before, just with a different goal.
      - The smallest disk always moves in a circle. A, B, C, A …
    explanation: 7 moves, 1 move, 7 moves, 15 in total.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "In the best solution for 4 discs: how often is the **smallest** disc moved?"
    answer:
      value: 8
    hints:
      - It moves on every second move. There are 15 moves in total.
    explanation: "8 of 15. Each disc moves twice as often as the next larger one: 8, 4, 2, 1."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Why can n disks not be done faster than 2 · (moves for n − 1) + 1?
    params:
      options:
        - label: Before the largest disk moves, all others must sit on the third peg – and afterwards they must go back on top of it.
          correct: true
        - label: Because the smallest disk makes every second move.
          feedback: True, but it does not explain why it cannot be shorter.
        - label: Because the legend says so.
          feedback: A legend proves nothing – we need an argument.
    hints:
      - What has to happen before the largest disk can move at all?
      - Where must the n − 1 smaller disks be at that moment?
    explanation: The largest disk moves at least once. For that, the tower of n − 1 disks must move away and later back on top. So moves(n) ≥ 2 · moves(n − 1) + 1 – and the recursive solution achieves exactly that.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "{{n - 1}} disks need {{2 ** (n - 1) - 1}} moves. How many does that make for {{n}} disks?"
    answer:
      value: "{{2 ** n - 1}}"
    feedback:
      - when: numval(state.input) == 2 * (2 ** (n - 1) - 1)
        misconception: forgot-plus-one
        text: Almost – the largest disk has to move once as well.
    hints:
      - Small tower away, big disk across, small tower back on top.
      - Compute 2 · {{2 ** (n - 1) - 1}} + 1.
    explanation: 2 · {{2 ** (n - 1) - 1}} + 1 = {{2 ** n - 1}}. The recursion T(n) = 2 · T(n − 1) + 1 with T(1) = 1 gives T(n) = 2ⁿ − 1 by induction.
    difficulty: 2
    variants:
      params:
        n: int[5,9]
      defaults:
        n: 6

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The moves in the Tower of Hanoi follow exactly the pattern of another familiar thing. Which?
    params:
      options:
        - label: Counting up in binary – the bit that flips gives the disc
          correct: true
        - label: The primes
          feedback: They have no such regular pattern.
        - label: Pascal’s triangle
          feedback: That is about selections.
    hints:
      - Disc 1 on every second move, disc 2 on every fourth …
    explanation: Count from 0001 to 1111 and always move the disc of the flipping bit. Two entirely different things with the same structure.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Number the disks from small (1) to large. With {{n}} disks: how often does disk 2 move in the best solution?"
    answer:
      value: "{{2 ** (n - 2)}}"
    hints:
      - The largest disk moves once, the second largest twice, the next 4 times …
      - Disk k moves 2^(n − k) times.
    explanation: "Disk 2 moves 2^({{n}} − 2) = {{2 ** (n - 2)}} times. All together: 1 + 2 + 4 + … + 2ⁿ⁻¹ = 2ⁿ − 1 – the familiar total."
    difficulty: 3
    variants:
      params:
        n: int[4,7]
      defaults:
        n: 5

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how to move a tower of n disks – and why it takes 2ⁿ − 1 moves.
    params:
      keywords:
        - - kleiner
          - n − 1
          - n-1
          - smaller
        - - größte
          - groesste
          - unterste
          - largest
          - biggest
          - bottom
        - - verdoppel
          - doppelt
          - zweimal
          - double
          - twice
      sample: "First move the smaller tower of n − 1 disks aside, then the largest disk to the goal, then the small tower back on top. So the moves double with every disk, plus one: 2ⁿ − 1."
    difficulty: 3

srs:
  cards_from: [vier-zuege, drei]
