id: logic.classics.bridge
type: concept
title: The bridge at night
summary: Who goes with whom?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Four people, one lamp
    body: A puzzle where the obvious plan is not the best one. Uncover the cards in order. Then you know all the rules of the **bridge at night**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🌉
            front: Night at the bridge
            back: Four people must cross a shaky bridge. It is pitch dark.
          - icon: 🔦
            front: Only one lamp
            back: Nobody walks without light. So the lamp has to be brought back again and again.
          - icon: 👥
            front: Two at most
            back: The bridge holds two. People walking together move at the slower one's pace.
          - icon: ⏱️
            front: The clock is ticking
            back: Who goes with whom – and who brings the lamp back? Everything depends on that.

  - kind: problem
    id: naiv
    widget: numeric
    body: Four people need 1, 2, 5 and 10 minutes to cross a bridge. Two at most go together, at the slower pace. There is one lamp.
    prompt: The fastest walks each person over and runs back. How long does that take?
    params: { unit: minutes }
    answer: { value: 19 }
    hints:
      - 2 + 1 + 5 + 1 + 10.
    explanation: 2 + 1 + 5 + 1 + 10 = 19 minutes. But it can be done faster!

  - kind: explain
    id: s2
    body: The trick is that the two slowest go **together**. Then the 5 does not count extra.

  - kind: problem
    id: besser
    widget: order
    prompt: Put the crossings for 17 minutes in the right order.
    params:
      items:
        - { id: hin1, label: "1 and 2 cross (2 min)" }
        - { id: zur1, label: "1 comes back (1 min)" }
        - { id: lang, label: "5 and 10 cross (10 min)" }
        - { id: zur2, label: "2 comes back (2 min)" }
        - { id: hin2, label: "1 and 2 cross again (2 min)" }
    answer:
      anyOf: [[hin1, zur2, lang, zur1, hin2]]
    hints:
      - The two slow ones must not have to carry the lamp back.
    explanation: 2 + 1 + 10 + 2 + 2 = 17 minutes.

  - kind: problem
    id: minimum
    widget: numeric
    prompt: How many minutes does the best solution take?
    params: { unit: minutes }
    answer: { value: 17 }
    hints:
      - Add up the steps from before.
    explanation: 17 minutes, two fewer than the obvious solution.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Four people need 1, 2, 7 and 10 minutes. At most two cross at once, with the only torch. How many minutes does the best solution take?
    answer:
      value: 17
    hints:
      - 1 and 2 across, 1 back, 7 and 10 across, 2 back, 1 and 2 across.
    explanation: 2 + 1 + 10 + 2 + 2 = 17. The two slow ones cross together – so the 7 does not count extra.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Now the four need 1, 2, 5 and 8 minutes. What is the best possible time?
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 17
        misconception: escort-only
        text: That is the time when the fastest escorts everyone. Let the two slowest go together.
    hints:
      - "Try the trick: 1 and 2 across, 1 back, 5 and 8 across …"
      - Then 2 goes back and fetches 1.
    explanation: 2 + 1 + 8 + 2 + 2 = 15 minutes. The 5 walks with the 8 and costs nothing extra.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "New group: 1, 4, 5 and 6 minutes. How many minutes does the best solution take?"
    answer:
      value: 17
    feedback:
      - when: numval(state.input) == 19
        misconception: pair-trick-always
        text: "Here the pair trick does not pay off: the 4 would have to walk twice extra."
    hints:
      - "Work out both strategies: escorting by the 1 and the pair trick."
      - "Escorting: 4 + 1 + 5 + 1 + 6. Pair trick: 4 + 1 + 6 + 4 + 4."
    explanation: Escorting costs 17, the pair trick 19. No trick always wins – you have to compare.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is it not best in the bridge puzzle for the fastest to escort everyone?"
    params:
      keywords:
        - - langsam
          - slow
        - - zusammen
          - gemeinsam
          - together
        - - einmal
          - nur einmal
          - once
          - zählt
          - count
          - doppelt
          - twice
          - extra
      sample: Every crossing takes as long as the slower one. If the two slowest cross together, their long time counts only once – instead of each of them costing a long crossing of their own.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: The times are a ≤ b ≤ c ≤ d. When is the pair trick better than escorting?
    params:
      options:
        - label: When 2b < a + c
          correct: true
        - label: When d is very large
          feedback: d counts exactly once in both strategies.
        - label: Always
          feedback: With 1, 4, 5, 6 the trick loses.
    hints:
      - Escorting costs b + c + d + 2a. The pair trick costs a + 3b + d.
      - Subtract one from the other. What is left?
    explanation: The difference is (2a + b + c + d) − (a + 3b + d) = a + c − 2b. If 2b is smaller than a + c, the trick wins. For 1, 2, 7, 10 we have 4 < 8.
    difficulty: 3

srs:
  cards_from: [minimum, naiv]
