id: logic.classics.bridge
type: concept
title: The bridge at night
summary: Who goes with whom?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: naiv
    widget: numeric
    body: Four people need 1, 2, 5 and 10 minutes to cross a bridge. Two at most go together, at the slower pace. There is one lamp.
    prompt: The fastest walks each person over and runs back. How long does that take?
    params: { unit: minutes }
    answer: { value: 19 }
    hints:
      - 2 + 1 + 5 + 1 + 10.
    explanation: 2 + 1 + 5 + 1 + 10 = 19 minutes. But it can be done faster!

  - kind: explain
    id: s2
    body: The trick is that the two slowest go **together**. Then the 5 does not count extra.

  - kind: problem
    id: besser
    widget: order
    prompt: Put the crossings for 17 minutes in the right order.
    params:
      items:
        - { id: hin1, label: "1 and 2 cross (2 min)" }
        - { id: zur1, label: "1 comes back (1 min)" }
        - { id: lang, label: "5 and 10 cross (10 min)" }
        - { id: zur2, label: "2 comes back (2 min)" }
        - { id: hin2, label: "1 and 2 cross again (2 min)" }
    answer:
      anyOf: [[hin1, zur2, lang, zur1, hin2]]
    hints:
      - The two slow ones must not have to carry the lamp back.
    explanation: 2 + 1 + 10 + 2 + 2 = 17 minutes.

  - kind: problem
    id: minimum
    widget: numeric
    prompt: How many minutes does the best solution take?
    params: { unit: minutes }
    answer: { value: 17 }
    hints:
      - Add up the steps from before.
    explanation: 17 minutes, two fewer than the obvious solution.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Four people need 1, 2, 7 and 10 minutes. At most two cross at once, with the only torch. How many minutes does the best solution take?
    answer:
      value: 17
    hints:
      - 1 and 2 across, 1 back, 7 and 10 across, 2 back, 1 and 2 across.
    explanation: 2 + 1 + 10 + 2 + 2 = 17. The two slow ones cross together – so the 7 does not count extra.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is it not best in the bridge puzzle for the fastest to escort everyone?"
    params:
      keywords:
        - - langsam
          - slow
        - - zusammen
          - gemeinsam
          - together
        - - einmal
          - nur einmal
          - once
          - zählt
          - count
          - doppelt
          - twice
          - extra
      sample: Every crossing takes as long as the slower one. If the two slowest cross together, their long time counts only once – instead of each of them costing a long crossing of their own.
    difficulty: 3

srs:
  cards_from: [minimum, naiv]
