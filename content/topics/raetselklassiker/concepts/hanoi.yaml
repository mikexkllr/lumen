id: logic.classics.hanoi
type: concept
title: Die Türme von Hanoi
summary: Ein Turm, drei Stäbe, eine goldene Regel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Tempel der Scheiben
    body: "Eine Legende erzählt von Mönchen, die goldene Scheiben umschichten. Probier es selbst: Bring den Turm auf Stab B. Bewege immer nur eine Scheibe – und lege nie eine große auf eine kleine. Das ist die **goldene Regel**."
    visual:
      widget: hanoi
      interactive: true
      params:
        disks: 3
        target: 1

  - kind: problem
    id: la-hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Züge braucht man mindestens für einen Turm aus 10 Scheiben?"
    params:
      min: 10
      max: 100000
      scale: log
    answer:
      value: 1023
      within: 40
    explanation: 2¹⁰ − 1 = 1023. Jede weitere Scheibe verdoppelt die Arbeit – plus ein Zug.

  - kind: problem
    id: zwei
    widget: hanoi
    prompt: Bring den Turm auf Stab C. Nie darf eine größere Scheibe auf einer kleineren liegen.
    params: { disks: 2 }
    hints:
      - Die kleine Scheibe muss zuerst Platz machen.
    explanation: Klein nach B, groß nach C, klein nach C – drei Züge.

  - kind: problem
    id: drei
    widget: hanoi
    prompt: Jetzt mit drei Scheiben. Schaffst du es in 7 Zügen?
    params: { disks: 3, maxMoves: 7 }
    hints:
      - Erst die oberen zwei Scheiben nach B bringen – wie eben.
      - Dann die große nach C und die zwei von B obendrauf.
    explanation: Kleiner Turm weg, große Scheibe rüber, kleiner Turm drauf. Das sind 3 + 1 + 3 = 7 Züge.

  - kind: explain
    id: s3
    body: Merkst du das Muster? Wie bekommt man einen Turm aus n Scheiben bewegt?
    reveal:
      body: Turm aus n − 1 Scheiben zur Seite, größte Scheibe ans Ziel, Turm wieder drauf. Jede neue Scheibe verdoppelt die Arbeit – plus ein Zug.

  - kind: problem
    id: vier-zuege
    widget: numeric
    prompt: Wie viele Züge braucht man mindestens für {{n}} Scheiben?
    params: { unit: Züge }
    answer: { value: "{{2 ** n - 1}}" }
    feedback:
      - when: "numval(state.input) == 2 ** n"
        misconception: off-by-one
        text: Fast – es ist eins weniger. 3 Scheiben brauchen 7, nicht 8 Züge.
    hints:
      - 1 Scheibe – 1 Zug, 2 – 3 Züge, 3 – 7 Züge. Verdoppeln und 1 dazu.
    explanation: "$2^{ {{n}} } - 1 = {{2 ** n - 1}}$ Züge."
    variants:
      params: { n: "int[4,8]" }
      defaults: { n: 4 }

  - kind: problem
    id: legende
    widget: choice
    prompt: Eine Legende erzählt von 64 Scheiben und einem Zug pro Sekunde. Wie lange dauert das?
    params:
      options:
        - { label: Rund 585 Milliarden Jahre, correct: true }
        - { label: Rund 64 Jahre, feedback: "Die Züge verdoppeln sich mit jeder Scheibe. Das wächst viel schneller." }
        - { label: Rund 2 Jahre, feedback: "Viel zu wenig. Denk an $2^{64}$." }
    hints:
      - $2^{64}$ ist eine Zahl mit 20 Stellen.
    explanation: $2^{64} - 1$ Sekunden sind rund 585 Milliarden Jahre – über 40-mal das Alter des Universums.

  - kind: problem
    id: vier
    widget: hanoi
    prompt: Meisterprüfung – vier Scheiben in 15 Zügen.
    params: { disks: 4, maxMoves: 15 }
    hints:
      - Bringe erst drei Scheiben nach B. Das ist das Rätsel von eben, nur mit anderem Ziel.
      - Die kleinste Scheibe wandert immer im Kreis – A, B, C, A …
    explanation: 7 Züge, 1 Zug, 7 Züge – zusammen 15.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bei der besten Lösung für 4 Scheiben: Wie oft wird die **kleinste** Scheibe bewegt?"
    answer:
      value: 8
    hints:
      - Sie bewegt sich bei jedem zweiten Zug. Insgesamt sind es 15 Züge.
    explanation: "8 von 15. Jede Scheibe bewegt sich doppelt so oft wie die nächstgrößere: 8, 4, 2, 1."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Warum kann es für n Scheiben nicht schneller gehen als 2 · (Züge für n − 1) + 1?
    params:
      options:
        - label: Bevor die größte Scheibe zieht, müssen alle anderen auf dem dritten Stab liegen – und danach wieder auf sie.
          correct: true
        - label: Weil die kleinste Scheibe jeden zweiten Zug macht.
          feedback: Das stimmt zwar, erklärt aber nicht, warum es nicht kürzer geht.
        - label: Weil es so in der Legende steht.
          feedback: Eine Legende beweist nichts – gesucht ist ein Argument.
    hints:
      - Was muss passieren, damit die größte Scheibe überhaupt ziehen kann?
      - Wo müssen die n − 1 kleineren Scheiben in diesem Moment liegen?
    explanation: Die größte Scheibe zieht mindestens einmal. Dafür muss der Turm aus n − 1 Scheiben weg und danach wieder drauf. Also gilt Züge(n) ≥ 2 · Züge(n − 1) + 1 – und die rekursive Lösung erreicht genau das.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Für {{n - 1}} Scheiben braucht man {{2 ** (n - 1) - 1}} Züge. Wie viele sind es dann für {{n}} Scheiben?
    answer:
      value: "{{2 ** n - 1}}"
    feedback:
      - when: numval(state.input) == 2 * (2 ** (n - 1) - 1)
        misconception: forgot-plus-one
        text: Fast – die größte Scheibe muss auch noch einmal ziehen.
    hints:
      - Kleiner Turm weg, große Scheibe rüber, kleiner Turm drauf.
      - Rechne 2 · {{2 ** (n - 1) - 1}} + 1.
    explanation: 2 · {{2 ** (n - 1) - 1}} + 1 = {{2 ** n - 1}}. Aus der **Rekursion** Z(n) = 2 · Z(n − 1) + 1 mit Z(1) = 1 folgt per Induktion Z(n) = 2ⁿ − 1.
    difficulty: 2
    variants:
      params:
        n: int[5,9]
      defaults:
        n: 6

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Züge beim Turm von Hanoi folgen genau dem Muster einer anderen bekannten Sache. Welcher?
    params:
      options:
        - label: Dem Hochzählen im Binärsystem – das Bit, das umspringt, gibt die Scheibe an
          correct: true
        - label: Den Primzahlen
          feedback: Die haben kein so regelmäßiges Muster.
        - label: Dem Pascalschen Dreieck
          feedback: Dort geht es um Auswahlen.
    hints:
      - Scheibe 1 bei jedem zweiten Zug, Scheibe 2 bei jedem vierten …
    explanation: Von 0001 bis 1111 zählen und immer die Scheibe des umspringenden Bits bewegen. Zwei völlig verschiedene Dinge mit derselben Struktur.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Nummeriere die Scheiben von klein (1) nach groß. Bei {{n}} Scheiben: Wie oft wird Scheibe 2 in der besten Lösung bewegt?"
    answer:
      value: "{{2 ** (n - 2)}}"
    hints:
      - Die größte Scheibe zieht 1-mal, die zweitgrößte 2-mal, die nächste 4-mal …
      - Scheibe k zieht 2^(n − k)-mal.
    explanation: "Scheibe 2 zieht 2^({{n}} − 2) = {{2 ** (n - 2)}}-mal. Alle zusammen: 1 + 2 + 4 + … + 2ⁿ⁻¹ = 2ⁿ − 1 – die bekannte Summe."
    difficulty: 3
    variants:
      params:
        n: int[4,7]
      defaults:
        n: 5

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man einen Turm aus n Scheiben bewegt – und warum dafür 2ⁿ − 1 Züge nötig sind.
    params:
      keywords:
        - - kleiner
          - n − 1
          - n-1
          - smaller
        - - größte
          - groesste
          - unterste
          - largest
          - biggest
          - bottom
        - - verdoppel
          - doppelt
          - zweimal
          - double
          - twice
      sample: "Erst den kleineren Turm aus n − 1 Scheiben zur Seite, dann die größte Scheibe ans Ziel, dann den kleinen Turm wieder drauf. So verdoppelt sich die Zahl der Züge bei jeder Scheibe, plus eins: 2ⁿ − 1."
    difficulty: 3

srs:
  cards_from: [vier-zuege, drei]
