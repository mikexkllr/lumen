id: logic.classics.lights
type: concept
title: Lights out!
summary: Every tap also toggles the neighbors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: plus
    widget: pixels
    body: A tap toggles the cell and its four neighbors. On becomes off, off becomes on.
    prompt: Turn off all the lights.
    params: { cells: [".#.", "###", ".#."], rule: lightsout }
    answer: { pattern: ["...", "...", "..."] }
    hints:
      - A single tap is enough. Which cell has exactly this pattern as its neighbors?
    explanation: The center toggles itself and its four neighbors, exactly the plus shape.

  - kind: explain
    id: s2
    body: Important. Pressing the same cell twice cancels out. And the **order** does not matter. You only need to know **which** cells you press.

  - kind: problem
    id: ecken
    widget: pixels
    prompt: Turn off all the lights. Two taps are enough.
    params: { cells: ["##.", "#.#", ".##"], rule: lightsout }
    answer: { pattern: ["...", "...", "..."] }
    hints:
      - Look at the top left and bottom right corners.
    explanation: One tap at the top left and one at the bottom right turn everything off.

  - kind: problem
    id: reihenfolge
    widget: choice
    prompt: Does the order of the taps matter?
    params:
      options:
        - { label: "No, only which cells are pressed", correct: true }
        - { label: "Yes, you have to work from top to bottom", feedback: "That is a good strategy, but not a must. Each toggle is independent." }
    hints:
      - How often is a cell toggled, and does that depend on the order?
    explanation: Each light is toggled as often as cells near it are pressed. The order does not change the count.

  - kind: explain
    id: s5
    body: Pro trick. Work **row by row**. If a light is on at the top, press the cell directly below it. That way you push all the lights down.

  - kind: problem
    id: vier
    widget: pixels
    prompt: A bigger grid. Turn off all the lights.
    params: { cells: ["###.", ".#.#", "#.##", "##.#"], rule: lightsout }
    answer: { pattern: ["....", "....", "....", "...."] }
    hints:
      - First press the cell under each light in the top row.
      - Three taps are enough if you find the right ones.
    explanation: The taps at row 1 column 2, row 3 column 4 and row 4 column 1 solve the grid.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A 3 × 3 grid of lights. Each cell is either pressed or not. How many different press combinations are there?
    answer:
      value: 512
    hints:
      - 9 cells, two options each.
    explanation: 2⁹ = 512. Since order and repetition do not matter, that is the entire search space.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: pixels
    prompt: Almost everything is lit. Switch all lights off – three taps are enough.
    params:
      cells:
        - "###"
        - .##
        - "###"
      rule: lightsout
    answer:
      pattern:
        - ...
        - ...
        - ...
    hints:
      - The top-left corner also toggles the dark cell below it.
      - Tap the top left, the bottom left and the middle cell on the right.
    explanation: Top left and bottom left each toggle the dark cell once, so together it stays off. The middle right cell clears the rest.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: The board is completely dark. You tap each of the 9 cells exactly once. How many lights are on afterwards?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 9
        misconception: ignore-parity
        text: Some cells are toggled several times – an even number of times means off again.
    hints:
      - "For each cell count how often it is toggled: once by itself plus once per neighbour."
      - "Corner: 1 + 2 = 3 times. Edge: 1 + 3 = 4 times. Centre: 1 + 4 = 5 times."
    explanation: "Only parity matters: an odd number of toggles means on. The 4 corners (3 times) and the centre (5 times) are lit, the 4 edge cells (4 times) are not. That makes 5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why can “Lights Out” be solved with a system of equations?
    params:
      options:
        - label: Each light is off in the end if it was toggled an even number of times – that is arithmetic modulo 2
          correct: true
        - label: Because the lights display numbers
          feedback: They are only on or off.
        - label: That is impossible – you have to try
          feedback: Computers solve it with linear algebra in milliseconds.
    hints:
      - On + on = off. As with 1 + 1 = 0 modulo 2.
    explanation: A puzzle becomes **linear algebra over two numbers**. The same mathematics is behind error-correcting codes.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "On the 3 × 3 board: how many different sets of taps solve a given starting picture?"
    params:
      options:
        - label: Exactly one – every starting picture has exactly one solution.
          correct: true
        - label: Usually several.
          feedback: There are 512 sets of taps and 512 pictures, and every set produces a different picture.
        - label: None for some.
          feedback: The 5 × 5 board has unsolvable pictures, the 3 × 3 board does not.
    hints:
      - How many sets of taps are there, and how many pictures?
      - If two different sets never give the same picture, the matching is one-to-one.
    explanation: As a system of equations modulo 2, the 3 × 3 matrix is invertible, so each of the 512 pictures has exactly one of the 512 tap sets. On the 5 × 5 board the matrix is not of full rank, and only one picture in four is solvable.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why the order does not matter in Lights Out and why tapping twice does nothing.
    params:
      keywords:
        - - reihenfolge
          - egal
          - order
          - does not matter
        - - zweimal
          - doppelt
          - aufheb
          - twice
          - cancel
          - undo
        - - schalt
          - toggle
          - flip
          - switch
      sample: Each tap toggles certain cells, and in the end only the number of toggles per cell counts. So the order does not matter, and the same tap twice cancels out.
    difficulty: 3

srs:
  cards_from: [reihenfolge, ecken]
