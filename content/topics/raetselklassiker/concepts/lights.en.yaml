id: logic.classics.lights
type: concept
title: Lights out!
summary: Every tap also toggles the neighbors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: plus
    widget: pixels
    body: A tap toggles the cell and its four neighbors. On becomes off, off becomes on.
    prompt: Turn off all the lights.
    params: { cells: [".#.", "###", ".#."], rule: lightsout }
    answer: { pattern: ["...", "...", "..."] }
    hints:
      - A single tap is enough. Which cell has exactly this pattern as its neighbors?
    explanation: The center toggles itself and its four neighbors, exactly the plus shape.

  - kind: explain
    body: Important. Pressing the same cell twice cancels out. And the order does not matter. You only need to know **which** cells you press.

  - kind: problem
    id: ecken
    widget: pixels
    prompt: Turn off all the lights. Two taps are enough.
    params: { cells: ["##.", "#.#", ".##"], rule: lightsout }
    answer: { pattern: ["...", "...", "..."] }
    hints:
      - Look at the top left and bottom right corners.
    explanation: One tap at the top left and one at the bottom right turn everything off.

  - kind: problem
    id: reihenfolge
    widget: choice
    prompt: Does the order of the taps matter?
    params:
      options:
        - { label: "No, only which cells are pressed", correct: true }
        - { label: "Yes, you have to work from top to bottom", feedback: "That is a good strategy, but not a must. Each toggle is independent." }
    hints:
      - How often is a cell toggled, and does that depend on the order?
    explanation: Each light is toggled as often as cells near it are pressed. The order does not change the count.

  - kind: explain
    body: Pro trick. Work row by row. If a light is on at the top, press the cell directly below it. That way you push all the lights down.

  - kind: problem
    id: vier
    widget: pixels
    prompt: A bigger grid. Turn off all the lights.
    params: { cells: ["###.", ".#.#", "#.##", "##.#"], rule: lightsout }
    answer: { pattern: ["....", "....", "....", "...."] }
    hints:
      - First press the cell under each light in the top row.
      - Three taps are enough if you find the right ones.
    explanation: The taps at row 1 column 2, row 3 column 4 and row 4 column 1 solve the grid.

srs:
  cards_from: [reihenfolge, ecken]
