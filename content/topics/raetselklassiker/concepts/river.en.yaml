id: logic.classics.river
type: concept
title: Wolf, goat and cabbage
summary: Plan so that nobody gets eaten.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: zuerst
    widget: choice
    body: A farmer wants to take a wolf, a goat and a cabbage across a river. The boat holds only one. Left alone, the wolf eats the goat and the goat eats the cabbage.
    prompt: What must he take first?
    params:
      options:
        - { label: The goat, correct: true }
        - { label: The wolf, feedback: "Then the goat eats the cabbage." }
        - { label: The cabbage, feedback: "Then the wolf eats the goat." }
    hints:
      - Who must never be left alone with another?
    explanation: Only the wolf and the cabbage get along. So the goat must go first.

  - kind: problem
    id: zurueck
    widget: choice
    prompt: The farmer has taken the wolf across. The goat is already waiting there. What does he take on the way back?
    params:
      options:
        - { label: The goat, correct: true }
        - { label: Nothing, feedback: "Then the wolf eats the goat as soon as he leaves." }
        - { label: The wolf, feedback: "Then he would be back at the start." }
    hints:
      - The wolf and the goat must not be left alone.
    explanation: The trick is that the goat rides back. It feels like a step backward, but it is the key.

  - kind: problem
    id: fahrten
    widget: numeric
    prompt: What is the minimum number of crossings the farmer needs? Each direction counts separately.
    params: { unit: crossings }
    answer: { value: 7 }
    hints:
      - Goat over, back alone, wolf over, goat back …
    explanation: Goat over, back, wolf over, goat back, cabbage over, back, goat over. That is 7 crossings.

  - kind: explain
    id: s4
    body: You solve such puzzles by writing down the **states**, meaning who is where. A computer searches through all states in the same way until it finds the shortest path.

  - kind: problem
    id: eimer
    widget: order
    prompt: You have a 3-liter and a 5-liter bucket. Put the steps in order to measure exactly 4 liters.
    params:
      items:
        - { label: Fill the 5-liter bucket }
        - { label: "Use it to fill the 3-liter bucket, leaving 2 liters" }
        - { label: Empty the 3-liter bucket }
        - { label: Pour the 2 liters into the 3-liter bucket }
        - { label: Fill the 5-liter bucket again }
        - { label: "Top off the 3-liter bucket, leaving 4 liters" }
    hints:
      - Start with the big bucket.
    explanation: 5 − 3 = 2, and later 5 − 1 = 4. The small bucket works as a measuring cup.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Farmer, wolf, goat, cabbage: each is on the left or the right. How many states are there in total – allowed and forbidden?"
    answer:
      value: 16
    hints:
      - Four things, two banks each.
    explanation: 2⁴ = 16. Of these 10 are allowed – the solution path passes through 8 of them.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: network
    prompt: 'Each node shows who is still on the left: F farmer, W wolf, G goat, C cabbage. Lines are allowed crossings. Find the shortest route from "all left" to "all right".'
    params:
      start: n1
      end: n10
      aspect: 0.5
      nodes:
        - id: n1
          x: 4
          y: 50
          label: FWGC
        - id: n2
          x: 16
          y: 50
          label: WC
        - id: n3
          x: 29
          y: 50
          label: FWC
        - id: n4
          x: 43
          y: 12
          label: C
        - id: n5
          x: 43
          y: 88
          label: W
        - id: n6
          x: 58
          y: 12
          label: FGC
        - id: n7
          x: 58
          y: 88
          label: FWG
        - id: n8
          x: 71
          y: 50
          label: G
        - id: n9
          x: 84
          y: 50
          label: FG
        - id: n10
          x: 96
          y: 50
          label: –
      edges:
        - a: n1
          b: n2
        - a: n2
          b: n3
        - a: n3
          b: n4
        - a: n3
          b: n5
        - a: n4
          b: n6
        - a: n5
          b: n7
        - a: n6
          b: n8
        - a: n7
          b: n8
        - a: n8
          b: n9
        - a: n9
          b: n10
    hints:
      - "From the start there is only one allowed crossing: the goat goes across."
      - In the middle the route splits – both branches are equally long.
    explanation: "Seven crossings, and there are exactly two shortest solutions: wolf first or cabbage first. The puzzle is a search in the state graph."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Three monks and three robbers want to cross a river. The boat holds two. Robbers may never outnumber monks on a bank where monks are present. How many crossings are needed at least?
    answer:
      value: 11
    hints:
      - Each direction counts as one crossing. The boat always has to come back.
      - A breadth-first search over all allowed states finds the answer for sure.
    explanation: The shortest solution has 11 crossings. You find it by searching all allowed states, just as with the wolf–goat–cabbage puzzle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How does a computer find the **shortest** solution of such a puzzle for certain?
    params:
      options:
        - label: It examines first all states after 1 move, then after 2, then after 3 – breadth-first search
          correct: true
        - label: It follows one path to the end and takes the first hit
          feedback: The first path found is not necessarily the shortest.
        - label: It guesses at random
          feedback: Then there would be no guarantee.
    hints:
      - What you reach first is nearest.
    explanation: "**Breadth-first search** spreads like a wave. The app checks in exactly this way whether its puzzles are solvable."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: You have a 4-litre and a 6-litre bucket and a tap. Can you measure exactly 3 litres?
    params:
      options:
        - label: No – every amount you can reach is even.
          correct: true
        - label: Yes, with enough pouring.
          feedback: "Try it: you only ever get 0, 2, 4 or 6 litres."
        - label: Yes, by filling the 6-litre bucket halfway.
          feedback: Halving by eye is not exact – only filling, emptying and pouring are allowed.
    hints:
      - Which amounts appear when you fill, empty and pour?
      - All amounts are sums and differences of 4 and 6. What do they have in common?
    explanation: "This is an invariant: every amount is a multiple of gcd(4, 6) = 2. With 3 and 5 litres the gcd is 1, which is why every whole number of litres works there."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a computer reliably solves a river puzzle with the fewest crossings.
    params:
      keywords:
        - - zustand
          - zustände
          - state
        - - fahrt
          - zug
          - übergang
          - schritt
          - crossing
          - move
          - step
        - - kürzest
          - wenigst
          - breit
          - shortest
          - fewest
          - breadth
      sample: It lists every state, meaning who is on which bank. Then it tries all crossings one step away, then two, and so on. Breadth-first search finds the shortest route first.
    difficulty: 3

srs:
  cards_from: [zuerst, fahrten]
