id: logic.classics.river
type: concept
title: Wolf, goat and cabbage
summary: Plan so that nobody gets eaten.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zuerst
    widget: choice
    body: A farmer wants to take a wolf, a goat and a cabbage across a river. The boat holds only one. Left alone, the wolf eats the goat and the goat eats the cabbage.
    prompt: What must he take first?
    params:
      options:
        - { label: The goat, correct: true }
        - { label: The wolf, feedback: "Then the goat eats the cabbage." }
        - { label: The cabbage, feedback: "Then the wolf eats the goat." }
    hints:
      - Who must never be left alone with another?
    explanation: Only the wolf and the cabbage get along. So the goat must go first.

  - kind: problem
    id: zurueck
    widget: choice
    prompt: The farmer has taken the wolf across. The goat is already waiting there. What does he take on the way back?
    params:
      options:
        - { label: The goat, correct: true }
        - { label: Nothing, feedback: "Then the wolf eats the goat as soon as he leaves." }
        - { label: The wolf, feedback: "Then he would be back at the start." }
    hints:
      - The wolf and the goat must not be left alone.
    explanation: The trick is that the goat rides back. It feels like a step backward, but it is the key.

  - kind: problem
    id: fahrten
    widget: numeric
    prompt: What is the minimum number of crossings the farmer needs? Each direction counts separately.
    params: { unit: crossings }
    answer: { value: 7 }
    hints:
      - Goat over, back alone, wolf over, goat back …
    explanation: Goat over, back, wolf over, goat back, cabbage over, back, goat over. That is 7 crossings.

  - kind: explain
    id: s4
    body: You solve such puzzles by writing down the **states**, meaning who is where. A computer searches through all states in the same way until it finds the shortest path.

  - kind: problem
    id: eimer
    widget: order
    prompt: You have a 3-liter and a 5-liter bucket. Put the steps in order to measure exactly 4 liters.
    params:
      items:
        - { label: Fill the 5-liter bucket }
        - { label: "Use it to fill the 3-liter bucket, leaving 2 liters" }
        - { label: Empty the 3-liter bucket }
        - { label: Pour the 2 liters into the 3-liter bucket }
        - { label: Fill the 5-liter bucket again }
        - { label: "Top off the 3-liter bucket, leaving 4 liters" }
    hints:
      - Start with the big bucket.
    explanation: 5 − 3 = 2, and later 5 − 1 = 4. The small bucket works as a measuring cup.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Farmer, wolf, goat, cabbage: each is on the left or the right. How many states are there in total – allowed and forbidden?"
    answer:
      value: 16
    hints:
      - Four things, two banks each.
    explanation: 2⁴ = 16. Of these 10 are allowed – the solution path passes through 8 of them.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How does a computer find the **shortest** solution of such a puzzle for certain?
    params:
      options:
        - label: It examines first all states after 1 move, then after 2, then after 3 – breadth-first search
          correct: true
        - label: It follows one path to the end and takes the first hit
          feedback: The first path found is not necessarily the shortest.
        - label: It guesses at random
          feedback: Then there would be no guarantee.
    hints:
      - What you reach first is nearest.
    explanation: "**Breadth-first search** spreads like a wave. The app checks in exactly this way whether its puzzles are solvable."
    difficulty: 3

srs:
  cards_from: [zuerst, fahrten]
