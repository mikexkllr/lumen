id: cs.complexity.np
type: concept
title: Prüfen ist leicht, finden ist schwer
summary: Die Klasse NP.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sudoku
    widget: choice
    prompt: Was geht bei einem großen Sudoku schneller?
    params:
      options:
        - { label: Eine fertige Lösung prüfen, correct: true }
        - { label: Selbst eine Lösung finden, feedback: "Finden kann sehr lange dauern – prüfen geht Zeile für Zeile." }
    hints:
      - Was musst du beim Prüfen tun?
    explanation: Prüfen heißt nur, Zeilen, Spalten und Blöcke durchzugehen.

  - kind: explain
    id: s2
    body: |
      Probleme, deren Lösungen man schnell **prüfen** kann, bilden die Klasse **NP**. Die große offene Frage lautet: Ist alles, was sich schnell prüfen lässt, auch schnell lösbar? **P = NP?** Darauf ist ein Preis von einer Million Dollar ausgesetzt.

  - kind: problem
    id: folgen
    widget: choice
    prompt: Was würde passieren, wenn jemand beweist, dass P = NP gilt – mit einem schnellen Verfahren?
    params:
      options:
        - { label: Viele heutige Verschlüsselungen wären gebrochen., correct: true }
        - { label: Computer würden langsamer., feedback: "Im Gegenteil – auf einen Schlag wären viele schwere Probleme leicht." }
    hints:
      - Passwörter zu prüfen ist leicht – sie zu finden soll schwer sein.
    explanation: Kryptografie verlässt sich darauf, dass manches schwer zu finden ist.

  - kind: problem
    id: meinung
    widget: choice
    prompt: Was vermuten die meisten Fachleute?
    params:
      options:
        - { label: P ist ungleich NP., correct: true }
        - { label: P ist gleich NP., feedback: "Möglich ist es – aber die meisten glauben es nicht." }
    hints:
      - Seit Jahrzehnten hat niemand ein schnelles Verfahren für die schweren Probleme gefunden.
    explanation: Bewiesen ist es nicht – es ist eines der größten offenen Rätsel der Mathematik.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Eine Sudoku-Lösung zu prüfen geht schnell.
          right: true
        - text: NP heißt »nicht polynomiell«.
          right: false
          why: Es heißt »nichtdeterministisch polynomiell« – schnell prüfbar.
        - text: Jedes Problem in P liegt auch in NP.
          right: true
        - text: Es ist bewiesen, dass P ungleich NP ist.
          right: false
          why: Es ist nur die verbreitete Vermutung.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was zeichnet ein **NP-vollständiges** Problem aus?
    params:
      options:
        - label: Jedes andere Problem aus NP lässt sich schnell in es übersetzen
          correct: true
        - label: Es ist unlösbar
          feedback: Es ist lösbar – nur vermutlich nicht schnell.
        - label: Es hat keine prüfbare Lösung
          feedback: Gerade das Prüfen geht schnell.
    hints:
      - Wer eines davon schnell löst, löst alle.
    explanation: "Sudoku, Stundenpläne, Rundreise: tausende Probleme sind im Kern **dasselbe**. Ein schnelles Verfahren für eines bewiese P = NP."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Für die Lösung der P-NP-Frage ist ein Preisgeld ausgesetzt. Wie viele Millionen Dollar?
    answer:
      value: 1
    hints:
      - Es ist eines der sieben Millennium-Probleme.
    explanation: Eine Million Dollar vom Clay-Institut. Von den sieben Problemen ist bisher erst eines gelöst.
    difficulty: 3

srs:
  cards_from: [sudoku, folgen]
