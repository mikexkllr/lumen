id: cs.complexity.np
type: concept
title: Checking is easy, finding is hard
summary: The class NP.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sudoku
    widget: choice
    prompt: What is faster for a large Sudoku?
    params:
      options:
        - { label: Checking a finished solution, correct: true }
        - { label: Finding a solution yourself, feedback: "Finding can take very long. Checking goes row by row." }
    hints:
      - What do you have to do when checking?
    explanation: Checking only means going through rows, columns and blocks.

  - kind: explain
    id: s2
    body: |
      Problems whose solutions can be **checked** quickly form the class **NP**. The big open question: can everything that is quick to check also be solved quickly? **P = NP?** A prize of one million dollars is offered for the answer.

  - kind: problem
    id: folgen
    widget: choice
    prompt: What would happen if someone proved P = NP with a fast method?
    params:
      options:
        - { label: Many of today's encryption schemes would be broken., correct: true }
        - { label: Computers would get slower., feedback: "On the contrary. Many hard problems would suddenly become easy." }
    hints:
      - Checking passwords is easy. Finding them is supposed to be hard.
    explanation: Cryptography relies on some things being hard to find.

  - kind: problem
    id: meinung
    widget: choice
    prompt: What do most experts suspect?
    params:
      options:
        - { label: P does not equal NP., correct: true }
        - { label: P equals NP., feedback: "It is possible, but most people don't believe it." }
    hints:
      - For decades, nobody has found a fast method for the hard problems.
    explanation: It is not proven. It is one of the biggest open puzzles in mathematics.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Checking a Sudoku solution is quick.
          right: true
        - text: NP means “not polynomial”.
          right: false
          why: It means “nondeterministic polynomial” – quickly checkable.
        - text: Every problem in P is also in NP.
          right: true
        - text: It is proven that P is not equal to NP.
          right: false
          why: It is only the common conjecture.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: NP holds problems whose solution can be [[checked]] quickly. Whether it can also be [[found]] quickly, nobody knows.
      distractors:
        - guessed
        - deleted

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What characterises an **NP-complete** problem?
    params:
      options:
        - label: Every other problem in NP can be translated into it quickly
          correct: true
        - label: It is unsolvable
          feedback: It is solvable – just presumably not quickly.
        - label: It has no checkable solution
          feedback: Checking is exactly what is quick.
    hints:
      - Whoever solves one of them quickly solves all.
    explanation: "Sudoku, timetables, the round trip: thousands of problems are **the same** at heart. A fast method for one would prove P = NP."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A prize is offered for solving the P versus NP question. How many million dollars?
    answer:
      value: 1
    hints:
      - It is one of the seven Millennium Problems.
    explanation: One million dollars from the Clay Institute. Of the seven problems only one has been solved so far.
    difficulty: 3

srs:
  cards_from: [sudoku, folgen]
