id: cs.complexity.p
type: concept
title: Easy and hard problems
summary: The class P.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: What is hardest for a computer?
    params:
      options:
        - label: Finding the shortest round trip through 100 cities
          correct: true
        - label: Sorting 100 numbers
          feedback: That takes a fraction of a second.
        - label: Adding 100 numbers
          feedback: That is the easiest.
    hints:
      - Where is there the most to try out?
    explanation: Some problems grow so fast that even supercomputers fail.

  - kind: explain
    id: s1
    body: |
      Problems that can be solved with **polynomial** effort, such as $n$, $n^2$ or $n^3$, belong to the class **P**. They count as practically solvable, even for large inputs.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Quickly solvable for large inputs, or are only slow methods known?
    params:
      buckets: [{ label: quickly solvable }, { label: only slow methods known }]
      items:
        - { label: Sorting a list, bucket: quickly solvable }
        - { label: Shortest route in a navigation app, bucket: quickly solvable }
        - { label: "Checking whether a number is prime", bucket: quickly solvable }
        - { label: Shortest round trip through all cities, bucket: only slow methods known }
        - { label: Solving huge Sudokus, bucket: only slow methods known }
    hints:
      - For round trips, only methods that try almost everything are known.
    explanation: Surprisingly many everyday problems are easy, but a few puzzles stay stubbornly hard.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: A method needs n³ steps. How many is that for n = {{n}}?
    params: { unit: steps }
    answer: { value: "{{n * n * n}}" }
    hints:
      - "{{n}} · {{n}} · {{n}}."
    explanation: "{{n * n * n}} steps, which is easy for a computer."
    variants:
      params: { n: "choice[10,20,50,100]" }
      defaults: { n: 20 }

  - kind: problem
    id: grenze
    widget: choice
    prompt: A computer does a billion steps per second. How long does a 2ⁿ method take for n = 100?
    params:
      options:
        - { label: Much longer than the age of the universe, correct: true }
        - { label: A few minutes, feedback: "$2^{100}$ is a number with 31 digits." }
    hints:
      - "$2^{100}$ is about $10^{30}$."
    explanation: Faster computers don't help against exponential growth.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order by growth – from slowest to fastest.
    params:
      items:
        - label: log n
        - label: n
        - label: n²
        - label: 2ⁿ
    hints:
      - Put in n = 100.
    explanation: "For n = 100: about 7, 100, 10,000 – and a number with 31 digits."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Primality test: is a 1000-digit number prime? Is this problem in P?"
    params:
      options:
        - label: Yes – a provably fast method has been known since 2002
          correct: true
        - label: No – you must try all divisors
          feedback: There are far cleverer tests that work without searching for divisors.
        - label: Nobody knows
          feedback: The AKS test settled the question.
    hints:
      - "**Checking** primality is easy – **finding** the factors is hard."
    explanation: "Remarkably: you can know that a number is composite without knowing a divisor."
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: buckets
    prompt: Is a fast, polynomial method known for this?
    params:
      buckets:
        - id: b1
          label: yes, in P
        - id: b2
          label: none known
      items:
        - label: Sort a list
          bucket: b1
        - label: Shortest route in a road network
          bucket: b1
        - label: Is a number prime?
          bucket: b1
        - label: Cheapest spanning tree
          bucket: b1
        - label: Shortest round trip
          bucket: b2
        - label: Colour a network with 3 colours
          bucket: b2
        - label: Factor a large number into primes
          bucket: b2
    hints:
      - You know fast methods for Dijkstra and Kruskal.
      - Primality testing is easy, factoring is not.
    explanation: "Factoring is a special case: no fast method is known, but it is not proven NP-complete either. RSA is built on it."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: An n³ method, $10^9$ steps per second. How many seconds does it take for n = 10,000?
    params:
      unit: s
    answer:
      value: 1000
    hints:
      - $10000^3$ = $10^{12}$.
      - $10^{12}$ / $10^9$.
    explanation: Just over a quarter of an hour. Polynomial means feasible – but not always fast.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Is a method with $n^{log n}$ steps polynomial?
    params:
      options:
        - label: No – the exponent grows with n
          correct: true
        - label: Yes, it is n to the power of something
          feedback: In polynomials the exponent is a fixed number.
        - label: Yes, log n is small
          feedback: Small, but not fixed.
    hints:
      - What does a polynomial look like?
      - n², n³, $n^{100}$ – the exponent is fixed.
    explanation: $n^{log n}$ is called quasi-polynomial – faster than 2ⁿ but slower than any polynomial. In 2015 Babai gave such a method for graph isomorphism.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does “polynomial” count as the boundary between feasible and infeasible – even though n¹⁰⁰ would be absurdly slow?
    params:
      options:
        - label: Polynomials stay polynomial when methods are chained – and in practice the exponents are almost always small
          correct: true
        - label: Because n¹⁰⁰ is faster than 2ⁿ once n exceeds 10
          feedback: 2ⁿ only overtakes from about n = 1000.
        - label: It is an arbitrary definition without reason
          feedback: It has good mathematical reasons.
    hints:
      - What happens if an n² method uses an n³ method as a building block?
    explanation: "The class P is robust: independent of the machine model and closed under combination."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: Complexity classes talk about **decision problems** with a yes-or-no answer. »Is there a round trip shorter than 1000 km?« instead of »find the shortest«. The variants are usually equally hard.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Testing for primes by trying each divisor up to √N – is that polynomial?
    params:
      options:
        - label: No – the input size is the number of digits, and √N grows exponentially in it
          correct: true
        - label: Yes, √N is a polynomial in N
          feedback: It is measured in the length of the input, not its value.
        - label: Yes, roots grow slowly
          feedback: With 100 digits that is $10^{50}$ tries.
    hints:
      - How long is the input for a 100-digit number?
      - One more digit multiplies N by ten.
    explanation: With d digits √N ≈ $10^{d/2}$ – exponential in d. Only the AKS test from 2002 is truly polynomial.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: A number has 100 digits. About how many divisors up to √N would you have to try? Give the power of ten.
    answer:
      value: 50
    hints:
      - N is about $10^{100}$.
      - The square root halves the exponent.
    explanation: √($10^{100}$) = $10^{50}$ – more than any computer will ever manage. The AKS test needs only a polynomial in 100.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what the class P is.
    params:
      keywords:
        - - polynom
          - n²
          - n hoch
          - power of n
        - - schnell
          - effizient
          - fast
          - efficient
          - machbar
          - feasible
        - - groß
          - wachs
          - grow
          - large
          - size
      sample: P is all yes-or-no problems solved by a method with polynomial running time, such as n² or n³ steps. Even as the input grows large, the effort grows only moderately – such problems count as efficiently solvable.
    difficulty: 3

srs:
  cards_from: [sortieren, grenze]
