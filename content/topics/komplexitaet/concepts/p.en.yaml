id: cs.complexity.p
type: concept
title: Easy and hard problems
summary: The class P.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Problems that can be solved with polynomial effort, such as $n$, $n^2$ or $n^3$, belong to the class **P**. They count as practically solvable, even for large inputs.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Quickly solvable for large inputs, or are only slow methods known?
    params:
      buckets: [{ label: quickly solvable }, { label: only slow methods known }]
      items:
        - { label: Sorting a list, bucket: quickly solvable }
        - { label: Shortest route in a navigation app, bucket: quickly solvable }
        - { label: "Checking whether a number is prime", bucket: quickly solvable }
        - { label: Shortest round trip through all cities, bucket: only slow methods known }
        - { label: Solving huge Sudokus, bucket: only slow methods known }
    hints:
      - For round trips, only methods that try almost everything are known.
    explanation: Surprisingly many everyday problems are easy, but a few puzzles stay stubbornly hard.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: A method needs n³ steps. How many is that for n = {{n}}?
    params: { unit: steps }
    answer: { value: "{{n * n * n}}" }
    hints:
      - "{{n}} · {{n}} · {{n}}."
    explanation: "{{n * n * n}} steps, which is easy for a computer."
    variants:
      params: { n: "choice[10,20,50,100]" }
      defaults: { n: 20 }

  - kind: problem
    id: grenze
    widget: choice
    prompt: A computer does a billion steps per second. How long does a 2ⁿ method take for n = 100?
    params:
      options:
        - { label: Much longer than the age of the universe, correct: true }
        - { label: A few minutes, feedback: "$2^{100}$ is a number with 31 digits." }
    hints:
      - "$2^{100}$ is about $10^{30}$."
    explanation: Faster computers don't help against exponential growth.

srs:
  cards_from: [sortieren, grenze]
