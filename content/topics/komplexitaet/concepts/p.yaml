id: cs.complexity.p
type: concept
title: Leichte und schwere Probleme
summary: Die Klasse P.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Was ist für einen Computer am schwersten?
    params:
      options:
        - label: Die kürzeste Rundreise durch 100 Städte finden
          correct: true
        - label: 100 Zahlen sortieren
          feedback: Das geht in Bruchteilen einer Sekunde.
        - label: 100 Zahlen addieren
          feedback: Das ist das Leichteste.
    hints:
      - Wo gibt es am meisten auszuprobieren?
    explanation: Manche Probleme wachsen so schnell, dass selbst Supercomputer scheitern.

  - kind: explain
    id: s1
    body: |
      Probleme, die sich mit **polynomiellem** Aufwand lösen lassen – etwa $n$, $n^2$ oder $n^3$ – gehören zur Klasse **P**. Sie gelten als praktisch lösbar, auch für große Eingaben.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Für große Eingaben schnell lösbar – oder kennt man nur langsame Verfahren?
    params:
      buckets: [{ label: schnell lösbar }, { label: nur langsam bekannt }]
      items:
        - { label: Eine Liste sortieren, bucket: schnell lösbar }
        - { label: Kürzester Weg im Navi, bucket: schnell lösbar }
        - { label: "Prüfen, ob eine Zahl prim ist", bucket: schnell lösbar }
        - { label: Kürzeste Rundreise durch alle Städte, bucket: nur langsam bekannt }
        - { label: Riesige Sudokus lösen, bucket: nur langsam bekannt }
    hints:
      - Für Rundreisen kennt man nur Verfahren, die fast alles durchprobieren.
    explanation: Erstaunlich viele Alltagsprobleme sind leicht – einige Rätsel aber hartnäckig schwer.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: Ein Verfahren braucht n³ Schritte. Wie viele sind es für n = {{n}}?
    params: { unit: Schritte }
    answer: { value: "{{n * n * n}}" }
    hints:
      - "{{n}} · {{n}} · {{n}}."
    explanation: "{{n * n * n}} Schritte – für einen Computer ein Klacks."
    variants:
      params: { n: "choice[10,20,50,100]" }
      defaults: { n: 20 }

  - kind: problem
    id: grenze
    widget: choice
    prompt: Ein Computer schafft eine Milliarde Schritte pro Sekunde. Wie lange braucht ein 2ⁿ-Verfahren für n = 100?
    params:
      options:
        - { label: Viel länger als das Alter des Universums, correct: true }
        - { label: Ein paar Minuten, feedback: "$2^{100}$ ist eine Zahl mit 31 Stellen." }
    hints:
      - "$2^{100}$ ist etwa $10^{30}$."
    explanation: Gegen exponentielles Wachstum helfen keine schnelleren Computer.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Wachstum – vom langsamsten zum schnellsten.
    params:
      items:
        - label: log n
        - label: n
        - label: n²
        - label: 2ⁿ
    hints:
      - Setz n = 100 ein.
    explanation: "Für n = 100: etwa 7, 100, 10 000 – und eine Zahl mit 31 Stellen."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Primzahltest: Ist eine 1000-stellige Zahl prim? Liegt dieses Problem in P?"
    params:
      options:
        - label: Ja – seit 2002 kennt man ein beweisbar schnelles Verfahren
          correct: true
        - label: Nein – man muss alle Teiler durchprobieren
          feedback: Es gibt weit klügere Tests, die ohne Teilersuche auskommen.
        - label: Das weiß niemand
          feedback: Der AKS-Test hat die Frage entschieden.
    hints:
      - "**Prüfen**, ob prim, ist leicht – die **Zerlegung** finden ist schwer."
    explanation: "Erstaunlich: Man kann wissen, dass eine Zahl zerlegbar ist, ohne einen Teiler zu kennen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum gilt »polynomiell« als Grenze zwischen machbar und nicht machbar – auch wenn n¹⁰⁰ absurd langsam wäre?
    params:
      options:
        - label: Polynome bleiben beim Verketten von Verfahren polynomiell – und in der Praxis sind die Exponenten fast immer klein
          correct: true
        - label: Weil n¹⁰⁰ schneller ist als 2ⁿ, sobald n über 10 liegt
          feedback: Erst ab etwa n = 1000 überholt 2ⁿ.
        - label: Es ist eine willkürliche Festlegung ohne Grund
          feedback: Sie hat gute mathematische Gründe.
    hints:
      - Was passiert, wenn ein n²-Verfahren ein n³-Verfahren als Baustein nutzt?
    explanation: "Die Klasse P ist robust: unabhängig vom Rechnermodell und abgeschlossen unter Kombination."
    difficulty: 3

srs:
  cards_from: [sortieren, grenze]
