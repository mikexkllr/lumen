id: cs.complexity.p
type: concept
title: Leichte und schwere Probleme
summary: Die Klasse P.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zahm oder wild?
    body: Manche Aufgaben wachsen mit ihrer Größe **zahm** mit, andere explodieren. Deck die Karten auf. Welche würdest du einem Computer mit einer Milliarde Daten zutrauen?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📞
            front: Das Telefonbuch
            back: "Doppelt so dick heißt: nur ein Blick mehr. Zahmer geht es kaum."
          - icon: 🤝
            front: Händeschütteln
            back: "Doppelt so viele Gäste, etwa viermal so viele Handschläge: Das wächst noch zahm."
          - icon: 🔐
            front: Das Zahlenschloss
            back: Jede weitere Ziffer verzehnfacht das Probieren. Das wächst wild.
          - icon: 🧳
            front: Den Koffer packen
            back: Welche Dinge passen zusammen am besten hinein? Für viele Dinge kennt niemand einen schnellen Weg.

  - kind: problem
    id: hook
    widget: choice
    prompt: Was ist für einen Computer am schwersten?
    params:
      options:
        - label: Die kürzeste Rundreise durch 100 Städte finden
          correct: true
        - label: 100 Zahlen sortieren
          feedback: Das geht in Bruchteilen einer Sekunde.
        - label: 100 Zahlen addieren
          feedback: Das ist das Leichteste.
    hints:
      - Wo gibt es am meisten auszuprobieren?
    explanation: Manche Probleme wachsen so schnell, dass selbst Supercomputer scheitern.

  - kind: explain
    id: s1
    body: |
      Probleme, die sich mit **polynomiellem** Aufwand lösen lassen – etwa $n$, $n^2$ oder $n^3$ – gehören zur Klasse **P**. Sie gelten als praktisch lösbar, auch für große Eingaben.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Für große Eingaben schnell lösbar – oder kennt man nur langsame Verfahren?
    params:
      buckets: [{ label: schnell lösbar }, { label: nur langsam bekannt }]
      items:
        - { label: Eine Liste sortieren, bucket: schnell lösbar }
        - { label: Kürzester Weg im Navi, bucket: schnell lösbar }
        - { label: "Prüfen, ob eine Zahl prim ist", bucket: schnell lösbar }
        - { label: Kürzeste Rundreise durch alle Städte, bucket: nur langsam bekannt }
        - { label: Riesige Sudokus lösen, bucket: nur langsam bekannt }
    hints:
      - Für Rundreisen kennt man nur Verfahren, die fast alles durchprobieren.
    explanation: Erstaunlich viele Alltagsprobleme sind leicht – einige Rätsel aber hartnäckig schwer.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: Ein Verfahren braucht n³ Schritte. Wie viele sind es für n = {{n}}?
    params: { unit: Schritte }
    answer: { value: "{{n * n * n}}" }
    hints:
      - "{{n}} · {{n}} · {{n}}."
    explanation: "{{n * n * n}} Schritte – für einen Computer ein Klacks."
    variants:
      params: { n: "choice[10,20,50,100]" }
      defaults: { n: 20 }

  - kind: problem
    id: grenze
    widget: choice
    prompt: Ein Computer schafft eine Milliarde Schritte pro Sekunde. Wie lange braucht ein 2ⁿ-Verfahren für n = 100?
    params:
      options:
        - { label: Viel länger als das Alter des Universums, correct: true }
        - { label: Ein paar Minuten, feedback: "$2^{100}$ ist eine Zahl mit 31 Stellen." }
    hints:
      - "$2^{100}$ ist etwa $10^{30}$."
    explanation: Gegen exponentielles Wachstum helfen keine schnelleren Computer.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Wachstum – vom langsamsten zum schnellsten.
    params:
      items:
        - label: log n
        - label: n
        - label: n²
        - label: 2ⁿ
    hints:
      - Setz n = 100 ein.
    explanation: "Für n = 100: etwa 7, 100, 10 000 – und eine Zahl mit 31 Stellen."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Primzahltest: Ist eine 1000-stellige Zahl prim? Liegt dieses Problem in P?"
    params:
      options:
        - label: Ja – seit 2002 kennt man ein beweisbar schnelles Verfahren
          correct: true
        - label: Nein – man muss alle Teiler durchprobieren
          feedback: Es gibt weit klügere Tests, die ohne Teilersuche auskommen.
        - label: Das weiß niemand
          feedback: Der AKS-Test hat die Frage entschieden.
    hints:
      - "**Prüfen**, ob prim, ist leicht – die **Zerlegung** finden ist schwer."
    explanation: "Erstaunlich: Man kann wissen, dass eine Zahl zerlegbar ist, ohne einen Teiler zu kennen."
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: buckets
    prompt: Kennt man dafür ein schnelles, polynomielles Verfahren?
    params:
      buckets:
        - id: b1
          label: ja, in P
        - id: b2
          label: keins bekannt
      items:
        - label: Eine Liste sortieren
          bucket: b1
        - label: Kürzester Weg im Straßennetz
          bucket: b1
        - label: Ist eine Zahl prim?
          bucket: b1
        - label: Günstigster Spannbaum
          bucket: b1
        - label: Kürzeste Rundreise
          bucket: b2
        - label: Netz mit 3 Farben färben
          bucket: b2
        - label: Große Zahl in Primfaktoren zerlegen
          bucket: b2
    hints:
      - Für Dijkstra und Kruskal kennst du schnelle Verfahren.
      - Primzahltest ist leicht, Faktorisieren nicht.
    explanation: "Faktorisieren ist ein Sonderfall: kein schnelles Verfahren bekannt, aber auch nicht als NP-vollständig bewiesen. Darauf baut RSA."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Ein n³-Verfahren, $10^9$ Schritte pro Sekunde. Wie viele Sekunden dauert es für n = 10 000?
    params:
      unit: s
    answer:
      value: 1000
    hints:
      - $10000^3$ = $10^{12}$.
      - $10^{12}$ / $10^9$.
    explanation: Gut eine Viertelstunde. Polynomiell heißt machbar – aber nicht immer schnell.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Ist ein Verfahren mit $n^{log n}$ Schritten polynomiell?
    params:
      options:
        - label: Nein – der Exponent wächst mit n
          correct: true
        - label: Ja, es ist n hoch etwas
          feedback: Bei Polynomen ist der Exponent eine feste Zahl.
        - label: Ja, log n ist klein
          feedback: Klein, aber nicht fest.
    hints:
      - Wie sieht ein Polynom aus?
      - n², n³, $n^{100}$ – der Exponent steht fest.
    explanation: $n^{log n}$ heißt quasipolynomiell – schneller als 2ⁿ, aber langsamer als jedes Polynom. 2015 zeigte Babai solch ein Verfahren für die Graphisomorphie.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum gilt »polynomiell« als Grenze zwischen machbar und nicht machbar – auch wenn n¹⁰⁰ absurd langsam wäre?
    params:
      options:
        - label: Polynome bleiben beim Verketten von Verfahren polynomiell – und in der Praxis sind die Exponenten fast immer klein
          correct: true
        - label: Weil n¹⁰⁰ schneller ist als 2ⁿ, sobald n über 10 liegt
          feedback: Erst ab etwa n = 1000 überholt 2ⁿ.
        - label: Es ist eine willkürliche Festlegung ohne Grund
          feedback: Sie hat gute mathematische Gründe.
    hints:
      - Was passiert, wenn ein n²-Verfahren ein n³-Verfahren als Baustein nutzt?
    explanation: "Die Klasse P ist robust: unabhängig vom Rechnermodell und abgeschlossen unter Kombination."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: Komplexitätsklassen sprechen über **Entscheidungsprobleme** mit der Antwort ja oder nein. »Gibt es eine Rundreise kürzer als 1000 km?« statt »Finde die kürzeste«. Die Varianten sind meist gleich schwer.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Primzahltest durch Probieren aller Teiler bis √N – ist das ein polynomielles Verfahren?
    params:
      options:
        - label: Nein – die Eingabegröße ist die Stellenzahl, und √N wächst exponentiell darin
          correct: true
        - label: Ja, √N ist ein Polynom in N
          feedback: Gemessen wird in der Länge der Eingabe, nicht im Zahlenwert.
        - label: Ja, Wurzeln wachsen langsam
          feedback: Bei 100 Stellen sind es $10^{50}$ Versuche.
    hints:
      - Wie lang ist die Eingabe bei einer 100-stelligen Zahl?
      - Eine Stelle mehr verzehnfacht N.
    explanation: Bei d Stellen ist √N ≈ $10^{d/2}$ – exponentiell in d. Erst der AKS-Test von 2002 ist wirklich polynomiell.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Eine Zahl hat 100 Stellen. Wie viele Teiler bis √N müsste man etwa probieren? Gib den Zehnerexponenten an.
    answer:
      value: 50
    hints:
      - N ist etwa $10^{100}$.
      - Die Wurzel halbiert den Exponenten.
    explanation: √($10^{100}$) = $10^{50}$ – mehr als jeder Computer je schafft. Der AKS-Test braucht dagegen nur ein Polynom in 100.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was die Klasse P ist.
    params:
      keywords:
        - - polynom
          - n²
          - n hoch
          - power of n
        - - schnell
          - effizient
          - fast
          - efficient
          - machbar
          - feasible
        - - groß
          - wachs
          - grow
          - large
          - size
      sample: P sind alle Ja-Nein-Probleme, die ein Verfahren mit polynomieller Laufzeit löst, etwa n² oder n³ Schritte. Auch wenn die Eingabe groß wird, wächst der Aufwand nur maßvoll – solche Probleme gelten als effizient lösbar.
    difficulty: 3

srs:
  cards_from: [sortieren, grenze]
