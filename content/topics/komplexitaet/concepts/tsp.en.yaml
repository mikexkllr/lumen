id: cs.complexity.tsp
type: concept
title: The round trip
summary: A classic hard problem.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      A salesperson wants to visit all cities exactly once and return, by the shortest route. With n cities, there are $\frac{(n-1)!}{2}$ different round trips.

  - kind: problem
    id: fuenf
    widget: numeric
    prompt: How many different round trips are there for 5 cities?
    params: { unit: round trips }
    answer: { value: 12 }
    hints:
      - "4! = 24, divided by 2."
    explanation: "4 · 3 · 2 · 1 ÷ 2 = 12. Still easy to try them all."

  - kind: problem
    id: zehn
    widget: numeric
    prompt: And for 10 cities?
    params: { unit: round trips }
    answer: { value: 181440 }
    hints:
      - "9! = 362,880, divided by 2."
    explanation: Already 181,440. With 20 cities, there are over 60 quadrillion.

  - kind: problem
    id: praxis
    widget: choice
    prompt: How do delivery firms plan routes anyway?
    params:
      options:
        - { label: "With smart shortcuts that find very good routes", correct: true }
        - { label: They try all routes., feedback: "With a hundred stops, that would take longer than the universe has existed." }
    hints:
      - Does it always have to be the very best solution?
    explanation: Heuristics deliver routes only a few percent above the optimum.

srs:
  cards_from: [fuenf, praxis]
