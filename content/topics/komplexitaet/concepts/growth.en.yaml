id: cs.complexity.growth
type: concept
title: How fast does the effort grow?
summary: n, n² and 2ⁿ.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a method needs 2ⁿ steps; the computer does a billion per second. From which n does it take longer than a year?"
    params:
      min: 10
      max: 500
    answer:
      value: 55
      tolerance: 8
    explanation: 2⁵⁵ ≈ 3.6 · 10¹⁶ steps – just over a year. For n = 100 it would be trillions of years.

  - kind: explain
    id: s1
    body: |
      How long a program takes depends on the input size n. What matters is how the effort **grows**: linearly like n, quadratically like $n^2$, or explosively like $2^n$.

  - kind: problem
    id: verdoppeln
    widget: choice
    prompt: An algorithm with effort n² takes one second for 1000 items. How long for 2000?
    params:
      options:
        - { label: About 4 seconds, correct: true }
        - { label: About 2 seconds, feedback: "That would be linear. With n², the effort quadruples." }
        - { label: About 1000 seconds, feedback: "Only exponential effort explodes like that." }
    hints:
      - Twice as much data, squared.
    explanation: "$2^2 = 4$, so four times as long."

  - kind: problem
    id: exponentiell
    widget: numeric
    prompt: An algorithm tries all combinations of {{n}} yes/no questions. How many combinations is that?
    params: { unit: combinations }
    answer: { value: "{{2 ** n}}" }
    hints:
      - Each question doubles the possibilities.
    explanation: "$2^{ {{n}} } = {{2 ** n}}$. With 60 questions, it would be more than a quintillion."
    variants:
      params: { n: "int[8,20]" }
      defaults: { n: 10 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort from the slowest-growing to the fastest-growing.
    params:
      items:
        - { label: "log n – binary search" }
        - { label: "n – look at everything once" }
        - { label: "n² – compare every pair" }
        - { label: "2ⁿ – try all subsets" }
    hints:
      - Plug in n = 30.
    explanation: At n = 30, that is about 5, 30, 900 and over a billion steps.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An n² method and a 2ⁿ method take about equally long at n = 10. How many times longer does the 2ⁿ method take at n = 20 than the n² method? Rounded to the hundred.
    answer:
      value: 2600
      tolerance: 30
    hints:
      - 2²⁰ ≈ 1,048,576 and 20² = 400.
    explanation: 1,048,576 ÷ 400 ≈ 2600. Exponential growth leaves everything polynomial behind.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Computers double in speed every two years. By how much does the input size n that a 2ⁿ method manages in the same time grow?
    params:
      options:
        - label: By exactly 1
          correct: true
        - label: It doubles
          feedback: That is true for linear methods.
        - label: By 2
          feedback: Double speed offsets exactly one doubling of the effort.
    hints:
      - 2ⁿ⁺¹ is twice as much as 2ⁿ.
    explanation: Hardware practically does not help against exponential growth. Only better algorithms do.
    difficulty: 3

srs:
  cards_from: [verdoppeln, ordnen]
