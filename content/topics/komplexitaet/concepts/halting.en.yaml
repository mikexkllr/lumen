id: cs.complexity.halting
type: concept
title: The halting problem
summary: What no computer can ever do.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: frage
    widget: choice
    prompt: Is there a program that can predict, for any other program, whether it eventually halts or runs forever?
    params:
      options:
        - { label: No. This is provably impossible., correct: true }
        - { label: "Yes, you just have to run it fast enough.", feedback: "If it is still running, how do you know it won't stop soon?" }
    hints:
      - How long would you have to wait to conclude "forever"?
    explanation: Alan Turing proved in 1936 that no such program can exist.

  - kind: explain
    id: s2
    body: |
      Turing's trick: suppose a **program** H predicts halting. Build a program that asks H about itself and does **the opposite**. If H says it halts, it loops forever. If H says it loops, it halts. That is a contradiction.

  - kind: problem
    id: beweis
    widget: order
    prompt: Put Turing's proof in the right order.
    params:
      items:
        - { label: "Suppose a perfect halting checker H exists" }
        - { label: "Build a program that asks H about itself" }
        - { label: It always does the opposite of the prediction }
        - { label: "So H is always wrong, a contradiction" }
    hints:
      - As in any proof by contradiction, the assumption comes first.
    explanation: Self-reference exposes the impossible, as in the liar paradox.

  - kind: problem
    id: folge
    widget: choice
    prompt: What follows from this for virus scanners?
    params:
      options:
        - { label: No scanner can reliably detect all malware., correct: true }
        - { label: Good scanners detect everything., feedback: "A perfect scanner would also solve the halting problem." }
    hints:
      - A perfect scanner would have to predict the behavior of every program.
    explanation: Scanners work with patterns and experience. Perfection is mathematically ruled out.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: No program can tell for [[every]] other program whether it will ever [[halt]].
      distractors:
        - no
        - start

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Can the halting problem be solved by simply running the program and waiting?
    params:
      options:
        - label: No – if it is still running after an hour you do not know whether it will ever halt
          correct: true
        - label: Yes – eventually every program halts
          feedback: Infinite loops never halt.
        - label: Yes, with a faster computer
          feedback: Speed changes nothing about “infinite”.
    hints:
      - How long do you wait before saying “runs forever”?
    explanation: Halting can be observed, non-halting never. The problem is only semi-decidable.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Turing's trick is called **diagonalisation**: you build an object that differs from every entry of a list in one place. Cantor used it to show there are more real than natural numbers."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: "D(P) asks H: »Does P halt on itself as input?« If H says yes, D loops forever. If H says no, D halts. What happens with D(D)?"
    params:
      options:
        - label: Every answer of H is wrong – so H cannot exist
          correct: true
        - label: D just halts
          feedback: Then H said »no« – yet D halts. Contradiction.
        - label: D simply loops
          feedback: Then H said »yes« – yet D loops. Contradiction.
    hints:
      - Play through both answers of H.
      - In both cases D does the opposite of what H predicts.
    explanation: The assumption that H exists leads to a contradiction. So no program predicts halting for all programs.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: A program searches for the first number whose Collatz sequence does not reach 1. Does it halt?
    params:
      options:
        - label: Nobody knows – a halting oracle would settle the Collatz conjecture
          correct: true
        - label: Yes, immediately
          feedback: For every number tested the sequence reaches 1.
        - label: No, that is proven
          feedback: The conjecture is unproven.
    hints:
      - When would the program halt?
      - Only if the conjecture is false.
    explanation: Many open questions in mathematics are halting questions. If halting could be predicted, they would be solved at a stroke.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: buckets
    prompt: Decidable or not?
    params:
      buckets:
        - id: b1
          label: decidable
        - id: b2
          label: undecidable
      items:
        - label: Halts within 1000 steps?
          bucket: b1
        - label: Does any given program ever halt?
          bucket: b2
        - label: Outputs 0 on every input?
          bucket: b2
        - label: Is a number prime?
          bucket: b1
        - label: Is »print« in the source code?
          bucket: b1
        - label: Do two programs compute the same?
          bucket: b2
    hints:
      - With a fixed step limit you can just run it.
      - Questions about behaviour on all inputs are undecidable by Rice.
    explanation: Much can be decided about a program's text. Almost nothing about its behaviour on all inputs.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Rice’s theorem generalises the halting problem. What does it say?
    params:
      options:
        - label: No non-trivial property of the **behaviour** of programs can be decided automatically in general
          correct: true
        - label: Programs cannot be analysed at all
          feedback: For many individual programs it works – just not for all.
        - label: Every program contains bugs
          feedback: The theorem is not about that.
    hints:
      - “Does this program ever output 42?” – is that decidable?
    explanation: That is why analysis tools never find all bugs and sometimes report false ones. It is not a weakness of the tools but of logic.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between “hard” and “impossible” for computers.
    params:
      keywords:
        - - zeit
          - lang
          - dauer
          - time
          - long
          - takes
        - - lösbar
          - grundsätzlich
          - prinzip
          - solvable
          - principle
          - theoretically
        - - nie
          - kein
          - never
          - no program
          - unentscheidbar
          - undecidable
          - unmöglich
          - impossible
      sample: Hard problems are solvable in principle but take so much time that it is practically out of reach. Impossible problems such as the halting problem can never be solved by any program – however long it computes.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: The **busy beaver** BB(n) is the largest number of steps a halting Turing machine with n states can make. BB(5) = 47,176,870 was only proven in 2024. BB grows faster than any computable function.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Why does the halting problem imply that BB is not computable?
    params:
      options:
        - label: With BB(n) you could run any program for BB(n) steps – if it has not halted by then, it never will
          correct: true
        - label: Because BB is too large for memory
          feedback: Being large alone does not make it uncomputable.
        - label: It does not follow
          feedback: It is a classic proof.
    hints:
      - What would you know if you knew BB(n)?
      - A bound for all halting programs of that size.
    explanation: A computable BB function would solve the halting problem. That is impossible – so BB is uncomputable.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: In 1931 Kurt Gödel showed something related for mathematics. What?
    params:
      options:
        - label: Every consistent, sufficiently strong system has true statements it cannot prove
          correct: true
        - label: Every true statement is provable
          feedback: That is exactly what Gödel refuted.
        - label: Mathematics is contradictory
          feedback: Gödel showed incompleteness, not a contradiction.
    hints:
      - He too used a statement that talks about itself.
      - »This sentence is not provable.«
    explanation: The incompleteness theorem. Turing built on it in 1936 – computing and proving share the same limits.
    difficulty: 3

srs:
  cards_from: [frage, folge]
