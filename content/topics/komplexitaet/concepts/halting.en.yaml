id: cs.complexity.halting
type: concept
title: The halting problem
summary: What no computer can ever do.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: frage
    widget: choice
    prompt: Is there a program that can predict, for any other program, whether it eventually halts or runs forever?
    params:
      options:
        - { label: No. This is provably impossible., correct: true }
        - { label: "Yes, you just have to run it fast enough.", feedback: "If it is still running, how do you know it won't stop soon?" }
    hints:
      - How long would you have to wait to conclude "forever"?
    explanation: Alan Turing proved in 1936 that no such program can exist.

  - kind: explain
    id: s2
    body: |
      Turing's trick: suppose a **program** H predicts halting. Build a program that asks H about itself and does **the opposite**. If H says it halts, it loops forever. If H says it loops, it halts. That is a contradiction.

  - kind: problem
    id: beweis
    widget: order
    prompt: Put Turing's proof in the right order.
    params:
      items:
        - { label: "Suppose a perfect halting checker H exists" }
        - { label: "Build a program that asks H about itself" }
        - { label: It always does the opposite of the prediction }
        - { label: "So H is always wrong, a contradiction" }
    hints:
      - As in any proof by contradiction, the assumption comes first.
    explanation: Self-reference exposes the impossible, as in the liar paradox.

  - kind: problem
    id: folge
    widget: choice
    prompt: What follows from this for virus scanners?
    params:
      options:
        - { label: No scanner can reliably detect all malware., correct: true }
        - { label: Good scanners detect everything., feedback: "A perfect scanner would also solve the halting problem." }
    hints:
      - A perfect scanner would have to predict the behavior of every program.
    explanation: Scanners work with patterns and experience. Perfection is mathematically ruled out.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: No program can tell for [[every]] other program whether it will ever [[halt]].
      distractors:
        - no
        - start

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Can the halting problem be solved by simply running the program and waiting?
    params:
      options:
        - label: No – if it is still running after an hour you do not know whether it will ever halt
          correct: true
        - label: Yes – eventually every program halts
          feedback: Infinite loops never halt.
        - label: Yes, with a faster computer
          feedback: Speed changes nothing about “infinite”.
    hints:
      - How long do you wait before saying “runs forever”?
    explanation: Halting can be observed, non-halting never. The problem is only semi-decidable.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Rice’s theorem generalises the halting problem. What does it say?
    params:
      options:
        - label: No non-trivial property of the **behaviour** of programs can be decided automatically in general
          correct: true
        - label: Programs cannot be analysed at all
          feedback: For many individual programs it works – just not for all.
        - label: Every program contains bugs
          feedback: The theorem is not about that.
    hints:
      - “Does this program ever output 42?” – is that decidable?
    explanation: That is why analysis tools never find all bugs and sometimes report false ones. It is not a weakness of the tools but of logic.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between “hard” and “impossible” for computers.
    params:
      keywords:
        - - zeit
          - lang
          - dauer
          - time
          - long
          - takes
        - - lösbar
          - grundsätzlich
          - prinzip
          - solvable
          - principle
          - theoretically
        - - nie
          - kein
          - never
          - no program
          - unentscheidbar
          - undecidable
          - unmöglich
          - impossible
      sample: Hard problems are solvable in principle but take so much time that it is practically out of reach. Impossible problems such as the halting problem can never be solved by any program – however long it computes.
    difficulty: 3

srs:
  cards_from: [frage, folge]
