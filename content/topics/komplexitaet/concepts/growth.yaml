id: cs.complexity.growth
type: concept
title: Wie schnell wächst der Aufwand?
summary: n, n² und 2ⁿ.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Verfahren braucht 2ⁿ Schritte, der Computer schafft eine Milliarde pro Sekunde. Ab welchem n dauert es länger als ein Jahr?"
    params:
      min: 10
      max: 500
    answer:
      value: 55
      tolerance: 8
    explanation: 2⁵⁵ ≈ 3,6 · 10¹⁶ Schritte – gut ein Jahr. Bei n = 100 wären es Billionen Jahre.

  - kind: explain
    id: s1
    body: |
      Wie lange ein Programm braucht, hängt von der Eingabegröße n ab. Entscheidend ist, wie der Aufwand **wächst**: linear wie n, quadratisch wie $n^2$ oder explosiv wie $2^n$.

  - kind: problem
    id: verdoppeln
    widget: choice
    prompt: Ein Algorithmus mit Aufwand n² braucht für 1000 Daten eine Sekunde. Wie lange für 2000?
    params:
      options:
        - { label: Etwa 4 Sekunden, correct: true }
        - { label: Etwa 2 Sekunden, feedback: "Das wäre linear. Bei n² vervierfacht sich der Aufwand." }
        - { label: Etwa 1000 Sekunden, feedback: "So explodiert erst exponentieller Aufwand." }
    hints:
      - Doppelt so viele Daten, quadriert.
    explanation: "$2^2 = 4$ – viermal so lange."

  - kind: problem
    id: exponentiell
    widget: numeric
    prompt: Ein Algorithmus probiert alle Kombinationen aus {{n}} Ja/Nein-Fragen. Wie viele Kombinationen sind das?
    params: { unit: Kombinationen }
    answer: { value: "{{2 ** n}}" }
    hints:
      - Jede Frage verdoppelt die Möglichkeiten.
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ – bei 60 Fragen wären es mehr als eine Trillion."
    variants:
      params: { n: "int[8,20]" }
      defaults: { n: 10 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne vom schnellsten zum langsamsten Wachstum.
    params:
      items:
        - { label: "log n – binäre Suche" }
        - { label: "n – alles einmal ansehen" }
        - { label: "n² – jedes Paar vergleichen" }
        - { label: "2ⁿ – alle Teilmengen probieren" }
    hints:
      - Setze n = 30 ein.
    explanation: Bei n = 30 – etwa 5, 30, 900 und über eine Milliarde Schritte.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein n²-Verfahren und ein 2ⁿ-Verfahren brauchen bei n = 10 beide etwa gleich lang. Wievielmal länger braucht das 2ⁿ-Verfahren bei n = 20 als das n²-Verfahren? Gerundet auf Hundert.
    answer:
      value: 2600
      tolerance: 30
    hints:
      - 2²⁰ ≈ 1 048 576 und 20² = 400.
    explanation: "1 048 576 : 400 ≈ 2600. Exponentielles Wachstum hängt alles Polynomielle ab."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Computer werden alle zwei Jahre doppelt so schnell. Um wie viel wächst dadurch die Eingabegröße n, die ein 2ⁿ-Verfahren in derselben Zeit schafft?
    params:
      options:
        - label: Um genau 1
          correct: true
        - label: Sie verdoppelt sich
          feedback: Das gilt für lineare Verfahren.
        - label: Um 2
          feedback: Doppeltes Tempo gleicht genau eine Verdopplung des Aufwands aus.
    hints:
      - 2ⁿ⁺¹ ist doppelt so viel wie 2ⁿ.
    explanation: Hardware hilft gegen exponentielles Wachstum praktisch nicht. Nur bessere Algorithmen tun es.
    difficulty: 3

srs:
  cards_from: [verdoppeln, ordnen]
