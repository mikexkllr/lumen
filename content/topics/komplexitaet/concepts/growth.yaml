id: cs.complexity.growth
type: concept
title: Wie schnell wächst der Aufwand?
summary: n, n² und 2ⁿ.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Wie lange ein Programm braucht, hängt von der Eingabegröße n ab. Entscheidend ist, wie der Aufwand **wächst**: linear wie n, quadratisch wie $n^2$ oder explosiv wie $2^n$.

  - kind: problem
    id: verdoppeln
    widget: choice
    prompt: Ein Algorithmus mit Aufwand n² braucht für 1000 Daten eine Sekunde. Wie lange für 2000?
    params:
      options:
        - { label: Etwa 4 Sekunden, correct: true }
        - { label: Etwa 2 Sekunden, feedback: "Das wäre linear. Bei n² vervierfacht sich der Aufwand." }
        - { label: Etwa 1000 Sekunden, feedback: "So explodiert erst exponentieller Aufwand." }
    hints:
      - Doppelt so viele Daten, quadriert.
    explanation: "$2^2 = 4$ – viermal so lange."

  - kind: problem
    id: exponentiell
    widget: numeric
    prompt: Ein Algorithmus probiert alle Kombinationen aus {{n}} Ja/Nein-Fragen. Wie viele Kombinationen sind das?
    params: { unit: Kombinationen }
    answer: { value: "{{2 ** n}}" }
    hints:
      - Jede Frage verdoppelt die Möglichkeiten.
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ – bei 60 Fragen wären es mehr als eine Trillion."
    variants:
      params: { n: "int[8,20]" }
      defaults: { n: 10 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne vom schnellsten zum langsamsten Wachstum.
    params:
      items:
        - { label: "log n – binäre Suche" }
        - { label: "n – alles einmal ansehen" }
        - { label: "n² – jedes Paar vergleichen" }
        - { label: "2ⁿ – alle Teilmengen probieren" }
    hints:
      - Setze n = 30 ein.
    explanation: Bei n = 30 – etwa 5, 30, 900 und über eine Milliarde Schritte.

srs:
  cards_from: [verdoppeln, ordnen]
