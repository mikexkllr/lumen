id: cs.complexity.halting
type: concept
title: Das Halteproblem
summary: Was kein Computer je kann.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: frage
    widget: choice
    prompt: Gibt es ein Programm, das für jedes andere Programm sicher vorhersagt, ob es irgendwann anhält oder ewig läuft?
    params:
      options:
        - { label: Nein – das ist beweisbar unmöglich., correct: true }
        - { label: "Ja, man muss es nur schnell genug laufen lassen.", feedback: "Wenn es noch läuft – woher weißt du, dass es nicht gleich anhält?" }
    hints:
      - Wie lange müsste man warten, um »ewig« festzustellen?
    explanation: Alan Turing bewies 1936, dass es so ein Programm nicht geben kann.

  - kind: explain
    id: s2
    body: |
      Turings Trick: Angenommen, ein **Programm** H sagt das Anhalten vorher. Dann baut man ein Programm, das H über sich selbst befragt – und **genau das Gegenteil** tut. Hält es an, läuft es ewig; läuft es ewig, hält es an. Widerspruch.

  - kind: problem
    id: beweis
    widget: order
    prompt: Bring Turings Beweis in die richtige Reihenfolge.
    params:
      items:
        - { label: "Angenommen, ein perfekter Halte-Prüfer H existiert" }
        - { label: "Baue ein Programm, das H über sich selbst fragt" }
        - { label: Es tut immer das Gegenteil der Vorhersage }
        - { label: H liegt also immer falsch – Widerspruch }
    hints:
      - Wie bei jedem Widerspruchsbeweis steht die Annahme vorn.
    explanation: Selbstbezug macht das Unmögliche sichtbar – wie beim Lügner-Paradox.

  - kind: problem
    id: folge
    widget: choice
    prompt: Was folgt daraus für Virenscanner?
    params:
      options:
        - { label: Kein Scanner kann jede Schadsoftware sicher erkennen., correct: true }
        - { label: Gute Scanner erkennen alles., feedback: "Ein perfekter Scanner würde auch das Halteproblem lösen." }
    hints:
      - Ein perfekter Scanner müsste das Verhalten jedes Programms vorhersagen.
    explanation: Scanner arbeiten mit Mustern und Erfahrung – Perfektion ist mathematisch ausgeschlossen.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Kein Programm kann für [[jedes]] andere Programm sicher sagen, ob es irgendwann [[anhält]].
      distractors:
        - kein
        - startet

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Lässt sich das Halteproblem lösen, indem man das Programm einfach laufen lässt und wartet?
    params:
      options:
        - label: Nein – läuft es nach einer Stunde noch, weiß man nicht, ob es je anhält
          correct: true
        - label: Ja – irgendwann hält jedes Programm
          feedback: Endlosschleifen halten nie.
        - label: Ja, mit einem schnelleren Computer
          feedback: Tempo ändert nichts an »unendlich«.
    hints:
      - Wie lange wartest du, bevor du »läuft ewig« sagst?
    explanation: Anhalten kann man beobachten, Nicht-Anhalten nie. Das Problem ist nur halb entscheidbar.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Turings Trick heißt **Diagonalisierung**: Man baut ein Objekt, das sich von jedem Eintrag einer Liste an einer Stelle unterscheidet. So zeigte schon Cantor, dass es mehr reelle als natürliche Zahlen gibt."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: "D(P) fragt H: »Hält P mit sich selbst als Eingabe?« Sagt H ja, läuft D endlos. Sagt H nein, hält D. Was passiert bei D(D)?"
    params:
      options:
        - label: Jede Antwort von H ist falsch – also kann es H nicht geben
          correct: true
        - label: D hält einfach
          feedback: Dann hätte H »nein« gesagt – und D hält doch. Widerspruch.
        - label: D läuft einfach endlos
          feedback: Dann hätte H »ja« gesagt – und D läuft doch endlos. Widerspruch.
    hints:
      - Spiel beide Antworten von H durch.
      - Bei beiden tut D das Gegenteil dessen, was H vorhersagt.
    explanation: Die Annahme, H existiere, führt zum Widerspruch. Also gibt es kein Programm, das für alle Programme das Halten vorhersagt.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Ein Programm sucht die erste Zahl, deren Collatz-Folge nicht bei 1 endet. Hält es?
    params:
      options:
        - label: Niemand weiß es – ein Halte-Orakel würde die Collatz-Vermutung lösen
          correct: true
        - label: Ja, sofort
          feedback: Für alle getesteten Zahlen endet die Folge bei 1.
        - label: Nein, das ist bewiesen
          feedback: Die Vermutung ist unbewiesen.
    hints:
      - Wann würde das Programm halten?
      - Nur, wenn die Vermutung falsch ist.
    explanation: Viele offene Fragen der Mathematik sind Halte-Fragen. Könnte man das Halten vorhersagen, wären sie mit einem Schlag gelöst.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: buckets
    prompt: Entscheidbar oder nicht?
    params:
      buckets:
        - id: b1
          label: entscheidbar
        - id: b2
          label: unentscheidbar
      items:
        - label: Hält es in 1000 Schritten?
          bucket: b1
        - label: Hält ein beliebiges Programm je?
          bucket: b2
        - label: Gibt es bei jeder Eingabe 0 aus?
          bucket: b2
        - label: Ist eine Zahl prim?
          bucket: b1
        - label: Steht »print« im Quelltext?
          bucket: b1
        - label: Rechnen zwei Programme dasselbe?
          bucket: b2
    hints:
      - Mit fester Schrittgrenze kann man einfach laufen lassen.
      - Fragen nach dem Verhalten für alle Eingaben sind nach Rice unentscheidbar.
    explanation: Über den Text eines Programms kann man vieles entscheiden. Über sein Verhalten auf allen Eingaben fast nichts.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Satz von Rice verallgemeinert das Halteproblem. Was sagt er?
    params:
      options:
        - label: Keine nichttriviale Eigenschaft des **Verhaltens** von Programmen lässt sich allgemein automatisch entscheiden
          correct: true
        - label: Programme lassen sich gar nicht analysieren
          feedback: Für viele einzelne Programme geht es – nur nicht für alle.
        - label: Jedes Programm enthält Fehler
          feedback: Davon handelt der Satz nicht.
    hints:
      - »Gibt dieses Programm je 42 aus?« – ist das entscheidbar?
    explanation: Darum finden Prüfwerkzeuge nie alle Fehler und melden manchmal falsche. Es ist keine Schwäche der Werkzeuge, sondern der Logik.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen »schwer« und »unmöglich« für Computer.
    params:
      keywords:
        - - zeit
          - lang
          - dauer
          - time
          - long
          - takes
        - - lösbar
          - grundsätzlich
          - prinzip
          - solvable
          - principle
          - theoretically
        - - nie
          - kein
          - never
          - no program
          - unentscheidbar
          - undecidable
          - unmöglich
          - impossible
      sample: Schwere Probleme sind grundsätzlich lösbar, brauchen aber so viel Zeit, dass es praktisch nicht geht. Unmögliche Probleme wie das Halteproblem kann kein Programm je lösen – egal, wie lange es rechnet.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: Der **Fleißige Biber** BB(n) ist die größte Schrittzahl, die eine haltende Turingmaschine mit n Zuständen machen kann. BB(5) = 47 176 870 wurde erst 2024 bewiesen. BB wächst schneller als jede berechenbare Funktion.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Warum folgt aus dem Halteproblem, dass BB nicht berechenbar ist?
    params:
      options:
        - label: Mit BB(n) ließe man jedes Programm BB(n) Schritte laufen – hält es dann nicht, hält es nie
          correct: true
        - label: Weil BB zu groß für Speicher ist
          feedback: Groß allein macht nichts unberechenbar.
        - label: Es folgt gar nicht
          feedback: Es ist ein klassischer Beweis.
    hints:
      - Was wüsste man, wenn man BB(n) kennt?
      - Eine Schranke für alle haltenden Programme dieser Größe.
    explanation: Eine berechenbare BB-Funktion würde das Halteproblem lösen. Das geht nicht – also ist BB unberechenbar.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: 1931 zeigte Kurt Gödel etwas Verwandtes für die Mathematik. Was?
    params:
      options:
        - label: Jedes widerspruchsfreie, genügend starke System hat wahre Aussagen, die es nicht beweisen kann
          correct: true
        - label: Jede wahre Aussage ist beweisbar
          feedback: Das ist genau das, was Gödel widerlegte.
        - label: Die Mathematik ist widersprüchlich
          feedback: Gödel zeigte Unvollständigkeit, keinen Widerspruch.
    hints:
      - Auch er nutzte eine Aussage, die über sich selbst spricht.
      - »Dieser Satz ist nicht beweisbar.«
    explanation: Der Unvollständigkeitssatz. Turing knüpfte 1936 daran an – Berechnen und Beweisen haben dieselben Grenzen.
    difficulty: 3

srs:
  cards_from: [frage, folge]
