id: math.calculus.rules
type: concept
title: "Product and chain rule"
summary: "Two rules that let you differentiate almost anything."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: "We have x² · x³ = x⁵, so the derivative is 5x⁴. May you instead just differentiate both factors and multiply: 2x · 3x²?"
    params:
      options:
        - label: No – that would give 6x³, not 5x⁴
          correct: true
        - label: Yes, that is the same
          feedback: "Check: 2x · 3x² = 6x³."
        - label: Only for even exponents
          feedback: The rule never works like that.
    hints:
      - Work out 2x · 3x² and compare with 5x⁴.
    explanation: Products need a rule of their own.

  - kind: explain
    id: c2
    body: "The **product rule**: each factor is differentiated once while the other stays. Then add: $(u \\cdot v)' = u' \\cdot v + u \\cdot v'$."

  - kind: problem
    id: c3
    widget: expression
    prompt: "Differentiate with the product rule: $f(x) = x^2 \\cdot (x + 1)$"
    params:
      variables:
        - x
      prefix: f′(x) =
    answer:
      equivalentTo: 3*x^2 + 2*x
    hints:
      - u = x², v = x + 1. So 2x · (x + 1) + x² · 1.
    explanation: 2x(x + 1) + x² = 3x² + 2x.

  - kind: explain
    id: c4
    body: "The **chain rule** helps with nested functions like $(3x + 2)^2$: first differentiate the outside, then times the derivative of the inside. In short: **outer times inner**."

  - kind: problem
    id: c5
    widget: expression
    prompt: "Differentiate with the chain rule: $f(x) = (3x + 2)^2$"
    params:
      variables:
        - x
      prefix: f′(x) =
    answer:
      equivalentTo: 18*x + 12
    hints:
      - "Outer: 2 · (3x + 2). Inner: 3."
    explanation: 2 · (3x + 2) · 3 = 6(3x + 2) = 18x + 12.

  - kind: problem
    id: c6
    widget: buckets
    prompt: Which rule do you need here?
    params:
      buckets:
        - id: b1
          label: Product rule
        - id: b2
          label: Chain rule
      items:
        - label: x³ · (x + 4)
          bucket: b1
        - label: (x² + 1)⁵
          bucket: b2
        - label: √(3x + 1)
          bucket: b2
        - label: (x + 1) · (x − 2)
          bucket: b1
        - label: (5x − 1)⁴
          bucket: b2
    hints:
      - Is there a times between two parts – or is one term inside another?
    explanation: "Product: two factors side by side. Chain: one function inside another."

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Differentiate: $f(x) = (x^2 + 1)^3$"
    params:
      variables:
        - x
      prefix: f′(x) =
    answer:
      equivalentTo: 6*x*(x^2 + 1)^2
    hints:
      - "Outer: 3 · (x² + 1)². Inner: 2x."
    explanation: 3(x² + 1)² · 2x = 6x(x² + 1)².
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Both rules together: $f(x) = x \\cdot (x - 4)^2$. What is f′(2)?"
    answer:
      value: -4
    hints:
      - f′(x) = 1 · (x − 4)² + x · 2(x − 4). Put in x = 2.
    explanation: (−2)² + 2 · 2 · (−2) = 4 − 8 = −4.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An oil slick is a circle with area A = π · r². Its radius grows by 2 cm per second. How fast does the area grow at r = 5 cm? Give the number in front of π.
    answer:
      value: 20
    hints:
      - "Chain rule: change of A = 2πr · change of r."
    explanation: 2π · 5 · 2 = 20π cm² per second. The chain rule links rates.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: How do you differentiate $f(x) = 1/(x^2 + 1)$ – without any new rule?
    params:
      options:
        - label: Write it as (x² + 1)⁻¹ and use the chain rule
          correct: true
        - label: Differentiate top and bottom separately
          feedback: That would give 0 over 2x – wrong.
        - label: That is impossible
          feedback: It works with the chain rule.
    hints:
      - 1 over something is “something to the power −1”.
    explanation: −1 · (x² + 1)⁻² · 2x. The quotient rule too is just product plus chain.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain the chain rule to Lux with a picture from everyday life.
    params:
      keywords:
        - - außen
          - äußere
          - outer
          - outside
        - - innen
          - innere
          - inner
          - inside
        - - mal
          - multipli
          - times
          - multipl
          - produkt
          - product
      sample: "With nested functions you first differentiate the outer one and take that times the derivative of the inner one. Like gears: the ratios multiply."
    difficulty: 3

srs:
  cards_from: ["c3", "c5", "d1"]
