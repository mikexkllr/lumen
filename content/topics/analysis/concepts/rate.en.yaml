id: math.calculus.rate
type: concept
title: How fast does it change?
summary: The average rate of change.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a sprinter runs 100 m in 10 s. What is their **top speed** in km/h?"
    params:
      min: 20
      max: 60
      unit: km/h
    answer:
      value: 44
      tolerance: 4
    explanation: 36 km/h on average – about 44 at the peak. Average and instantaneous speed differ.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: A train travels {{s}} km in {{t}} hours. What is its average speed?
    params: { unit: km/h }
    answer: { value: "{{v}}" }
    hints:
      - Distance divided by time.
    explanation: "{{s}} ÷ {{t}} = {{v}} km/h."
    variants:
      params: { t: "choice[2,3,4]", v: "choice[60,80,90,120]" }
      derive: { s: "v * t" }
      defaults: { t: 3, v: 80 }

  - kind: explain
    id: s2
    body: |
      The **rate of change** is the change in y divided by the change in x. On a graph, it is the slope of the line through two points.

  - kind: problem
    id: sekante
    widget: slider
    prompt: Turn the line so that it passes through both points.
    params:
      expr: "m*(x-1) + 2"
      x: [0, 4]
      y: [0, 10]
      showCoordinates: false
      sliders: [{ id: m, label: Slope, min: 0, max: 5, step: 0.5, initial: 1 }]
      markers:
        - { x: 1, y: 2, group: a }
        - { x: 3, y: 8, group: a }
    check: { predicate: "m == 3" }
    hints:
      - From x = 1 to x = 3, y rises by 6.
    explanation: "Slope = (8 − 2) ÷ (3 − 1) = 3."

  - kind: problem
    id: baum
    widget: numeric
    prompt: A tree grows from {{a}} cm to {{b}} cm in {{n}} years. How much does it grow per year on average?
    params: { unit: cm }
    answer: { value: "{{r}}" }
    hints:
      - Growth divided by the number of years.
    explanation: "({{b}} − {{a}}) ÷ {{n}} = {{r}} cm per year."
    variants:
      params: { a: "int[40,120]", n: "int[2,6]", r: "int[5,30]" }
      derive: { b: "a + r * n" }
      defaults: { a: 80, n: 4, r: 15 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "For $f(x) = x^2$: what is the average rate of change between x = 1 and x = 3?"
    answer:
      value: 4
    hints:
      - (f(3) − f(1)) ÷ (3 − 1).
    explanation: (9 − 1) ÷ 2 = 4. This is the slope of the secant.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: For $f(x) = x^2$ between x = 1 and x = 1 + h the rate of change is 2 + h. What value does it approach as h goes to 0?
    answer:
      value: 2
    hints:
      - Put in smaller and smaller numbers for h.
    explanation: The **limit** is 2 – the slope exactly at x = 1.
    difficulty: 3

srs:
  cards_from: [sekante, baum]
