id: math.calculus.rate
type: concept
title: How fast does it change?
summary: The average rate of change.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Everything has a speed
    body: "It's not just cars that have a speed. Everything that changes does so at a **rate**: hair, continents, plants. Uncover the cards, and guess first how fast it goes."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💇
            front: Hair
            back: About 1 cm a month – roughly 12 cm a year.
          - icon: 🌍
            front: Continents
            back: Europe and America drift apart by about 2.5 cm a year – roughly as fast as fingernails grow.
          - icon: 🎋
            front: Bamboo
            back: Some species grow almost 1 m in a single day.
          - icon: 🐌
            front: Snail
            back: A garden snail manages about 1 mm a second – that is 3.6 m an hour.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a sprinter runs 100 m in 10 s. What is their **top speed** in km/h?"
    params:
      min: 20
      max: 60
      unit: km/h
    answer:
      value: 44
      tolerance: 4
    explanation: 36 km/h on average – about 44 at the peak. Average and instantaneous speed differ.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: A train travels {{s}} km in {{t}} hours. What is its average speed?
    params: { unit: km/h }
    answer: { value: "{{v}}" }
    hints:
      - Distance divided by time.
    explanation: "{{s}} ÷ {{t}} = {{v}} km/h."
    variants:
      params: { t: "choice[2,3,4]", v: "choice[60,80,90,120]" }
      derive: { s: "v * t" }
      defaults: { t: 3, v: 80 }

  - kind: explain
    id: s2
    body: |
      The **rate of change** is the change in y divided by the change in x. On a graph, it is the slope of the line through two points.

  - kind: problem
    id: sekante
    widget: slider
    prompt: Turn the line so that it passes through both points.
    params:
      expr: "m*(x-1) + 2"
      x: [0, 4]
      y: [0, 10]
      showCoordinates: false
      sliders: [{ id: m, label: Slope, min: 0, max: 5, step: 0.5, initial: 1 }]
      markers:
        - { x: 1, y: 2, group: a }
        - { x: 3, y: 8, group: a }
    check: { predicate: "m == 3" }
    hints:
      - From x = 1 to x = 3, y rises by 6.
    explanation: "Slope = (8 − 2) ÷ (3 − 1) = 3."

  - kind: problem
    id: baum
    widget: numeric
    prompt: A tree grows from {{a}} cm to {{b}} cm in {{n}} years. How much does it grow per year on average?
    params: { unit: cm }
    answer: { value: "{{r}}" }
    hints:
      - Growth divided by the number of years.
    explanation: "({{b}} − {{a}}) ÷ {{n}} = {{r}} cm per year."
    variants:
      params: { a: "int[40,120]", n: "int[2,6]", r: "int[5,30]" }
      derive: { b: "a + r * n" }
      defaults: { a: 80, n: 4, r: 15 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "For $f(x) = x^2$: what is the average rate of change between x = 1 and x = 3?"
    answer:
      value: 4
    hints:
      - (f(3) − f(1)) ÷ (3 − 1).
    explanation: (9 − 1) ÷ 2 = 4. This is the slope of the secant.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: The slope between x and x + h is the **difference quotient** $\frac{f(x + h) - f(x)}{h}$. For $f(x) = x^2$ at x = 2 it is $\frac{(2 + h)^2 - 4}{h} = 4 + h$.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: For $f(x) = x^2$ the difference quotient at x = {{a}} is {{2 * a}} + h. What is it for h = {{h}}?
    answer:
      value: "{{2 * a + h}}"
      tolerance: 0.0001
    feedback:
      - when: numval(state.input) == 2 * a
        misconception: limit-too-early
        text: That is the limit as h → 0. Here h is still {{h}}.
    hints:
      - Put h = {{h}} into {{2 * a}} + h.
      - "{{2 * a}} + {{h}}."
    explanation: "{{2 * a}} + {{h}} = {{2 * a + h}}. The smaller h, the closer to {{2 * a}}."
    difficulty: 2
    variants:
      params:
        a: int[1,6]
        h: choice[0.1,0.01,0.5]
      defaults:
        a: 2
        h: 0.1

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: Stay at x = 1. Set h so that the secant has slope exactly 2.1.
    params:
      scene: tangent
      expr: x^2
      controls:
        x:
          value: 1
          fixed: true
        h:
          value: 1
      show:
        - secant
        - slope
    answer:
      secant:
        - 2.095
        - 2.105
    explanation: "h = 0.1: the secant slope is 2 + h. As h gets tiny, 2 remains – the slope of the tangent."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: For $f(x) = x^2$ between x = 1 and x = 1 + h the rate of change is 2 + h. What value does it approach as h goes to 0?
    answer:
      value: 2
    hints:
      - Put in smaller and smaller numbers for h.
    explanation: The **limit** is 2 – the slope exactly at x = 1.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "The derivative is the **limit** of the difference quotient. For x²: $(x + h)^2 - x^2 = 2xh + h^2$. Divided by h, 2x + h remains. Let h go to 0 and exactly 2x is left."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: For $f(x) = x^3$, $\frac{(2 + h)^3 - 8}{h} = 12 + 6h + h^2$. What value does it approach as h → 0?
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 8
        misconception: value-not-slope
        text: That is f(2), the function value. The slope is wanted.
    hints:
      - What happens to 6h and h² when h gets tiny?
      - Both vanish.
    explanation: 12 = 3 · 2². That confirms the power rule $(x^3)' = 3x^2$.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why the derivative of x² is exactly 2x.
    params:
      keywords:
        - - winzig
          - "null"
          - tiny
          - zero
          - gegen 0
        - - 2xh
          - ausmultipl
          - expand
          - binom
        - - sekante
          - differenzenquotient
          - secant
          - difference quotient
          - steigung
          - slope
      sample: I take the secant from x to x + h. Expanded, (x + h)² − x² = 2xh + h². Divided by h the slope is 2x + h. When h gets tiny, 2x remains.
    explanation: "Secant → tangent: the leftover h vanishes in the limit."
    difficulty: 3

srs:
  cards_from: [sekante, baum]
