id: math.calculus.optimum
type: concept
title: Finding the peak
summary: Where the slope is zero.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The best angle
    body: "Shot-putters, gardeners and companies all look for the best: the longest throw, the most area, the biggest profit. Set the angle. At which angle does the ball fly **furthest**?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: projectile

  - kind: problem
    id: gipfel
    widget: choice
    visual:
      widget: graph
      params: { x: [0, 6], y: [0, 10], functions: [{ expr: "-x*x + 6*x" }] }
    prompt: How steep is the curve exactly at its highest point?
    params:
      options:
        - { label: Not at all – it is flat there, correct: true }
        - { label: Steepest, feedback: "It is steep on the flanks. At the top it just turns over." }
        - { label: It falls there, feedback: "It only goes downhill to the right of the peak." }
    hints:
      - It rises on the left and falls on the right. What is in between?
    explanation: At the peak, the slope is zero.

  - kind: explain
    id: s2
    body: |
      So to find the highest or lowest point, you set the **derivative** to zero. This is how companies optimize prices, engineers optimize shapes, and apps optimize their recommendations.

  - kind: problem
    id: maximum
    widget: numeric
    prompt: "For f(x) = −x² + {{2 * k}}x, f′(x) = −2x + {{2 * k}}. At which x is the maximum?"
    params: { placeholder: "x" }
    answer: { value: "{{k}}" }
    hints:
      - "When does −2x + {{2 * k}} equal 0?"
    explanation: "−2x + {{2 * k}} = 0 gives x = {{k}}."
    variants:
      params: { k: "int[2,8]" }
      defaults: { k: 3 }

  - kind: problem
    id: zaun
    widget: numeric
    prompt: You have {{4 * a}} m of fence for a rectangular garden bed that should be as large as possible. How long is one side?
    params: { unit: m }
    answer: { value: "{{a}}" }
    hints:
      - Try a few rectangles with a perimeter of {{4 * a}} m. When is the area largest?
    explanation: "A square with sides of {{a}} m. The area is {{a * a}} m², and you can't do better."
    variants:
      params: { a: "int[3,10]" }
      defaults: { a: 5 }

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: "The curve is f(x) = −x² + 2x. Move the point to the top: there the slope is zero."
    params:
      scene: tangent
      expr: 2*x - x^2
    answer:
      slope: 0
    explanation: At x = 1. The derivative −2x + 2 is zero there.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "For $f(x) = x^3 - 12x$: at which **positive** x is there a minimum?"
    answer:
      value: 2
    hints:
      - f′(x) = 3x² − 12 = 0.
    explanation: x² = 4. The minimum is at x = 2, the maximum at x = −2.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "If f′(a) = 0, the **second derivative** decides: if f″(a) > 0, the curve bends upwards – a minimum. If f″(a) < 0, it bends downwards – a maximum."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: The curve is $y = x^3 - 3x$. Find a point with a horizontal tangent.
    params:
      scene: tangent
      expr: x^3 - 3*x
      controls:
        h:
          value: 0.5
        x:
          value: 0
      show:
        - secant
        - slope
    answer:
      slope: 0
    explanation: "At x = −1 and x = 1, since f′(x) = 3x² − 3. At −1, f″ = −6: maximum. At 1, f″ = 6: minimum."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: What value does $f(x) = x^3 - 3x$ take at its maximum?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == -1
        misconception: x-not-y
        text: That is the location x. The function value is wanted.
      - when: numval(state.input) == -2
        misconception: min-not-max
        text: That is the minimum at x = 1.
    hints:
      - The maximum is at x = −1.
      - (−1)³ − 3 · (−1).
    explanation: "−1 + 3 = 2. It is only a local maximum: for large x, f grows without bound."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: f′(a) = 0. Is there certainly a maximum or minimum at a?
    params:
      options:
        - label: No – it can also be a saddle point, as with x³
          correct: true
        - label: Yes, always
          feedback: For f(x) = x³, f′(0) = 0, but the curve keeps rising.
        - label: Only if f(a) = 0
          feedback: The function value plays no role.
    hints:
      - Picture y = x³.
    explanation: The derivative must **change sign**. The second derivative checks that.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do you set the derivative to zero to find a maximum?"
    params:
      keywords:
        - - steigung
          - slope
          - steil
          - steep
        - - "null"
          - zero
          - waagerecht
          - flach
          - flat
          - horizontal
        - - gipfel
          - höchst
          - highest
          - maximum
          - peak
          - top
      sample: The derivative is the slope. At the highest point the curve goes neither up nor down – it is flat, so the slope is zero.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Light takes the fastest path – **Fermat's principle**. Setting the derivative of the travel time to zero yields the law of refraction: $\\frac{\\sin\\alpha}{\\sin\\beta} = \\frac{v_1}{v_2}$. A lifeguard who first runs and then swims computes the same way."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Where does $f(x) = x \cdot e^{-x}$ have its maximum? We have $f'(x) = (1 - x)\,e^{-x}$.
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 0
        misconception: zero-of-f
        text: At x = 0, f itself is zero, not f′.
    hints:
      - $e^{-x}$ is never zero.
      - So 1 − x = 0.
    explanation: x = 1, with f(1) = 1/e ≈ 0.37. This is how, for example, a drug level rises and falls after a pill.
    difficulty: 3

srs:
  cards_from: [gipfel, maximum]
