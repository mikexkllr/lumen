id: math.calculus.optimum
type: concept
title: Finding the peak
summary: Where the slope is zero.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gipfel
    widget: choice
    visual:
      widget: graph
      params: { x: [0, 6], y: [0, 10], functions: [{ expr: "-x*x + 6*x" }] }
    prompt: How steep is the curve exactly at its highest point?
    params:
      options:
        - { label: Not at all – it is flat there, correct: true }
        - { label: Steepest, feedback: "It is steep on the flanks. At the top it just turns over." }
        - { label: It falls there, feedback: "It only goes downhill to the right of the peak." }
    hints:
      - It rises on the left and falls on the right. What is in between?
    explanation: At the peak, the slope is zero.

  - kind: explain
    id: s2
    body: |
      So to find the highest or lowest point, you **set the derivative to zero**. This is how companies optimize prices, engineers optimize shapes, and apps optimize their recommendations.

  - kind: problem
    id: maximum
    widget: numeric
    prompt: "For f(x) = −x² + {{2 * k}}x, f′(x) = −2x + {{2 * k}}. At which x is the maximum?"
    params: { placeholder: "x" }
    answer: { value: "{{k}}" }
    hints:
      - "When does −2x + {{2 * k}} equal 0?"
    explanation: "−2x + {{2 * k}} = 0 gives x = {{k}}."
    variants:
      params: { k: "int[2,8]" }
      defaults: { k: 3 }

  - kind: problem
    id: zaun
    widget: numeric
    prompt: You have {{4 * a}} m of fence for a rectangular garden bed that should be as large as possible. How long is one side?
    params: { unit: m }
    answer: { value: "{{a}}" }
    hints:
      - Try a few rectangles with a perimeter of {{4 * a}} m. When is the area largest?
    explanation: "A square with sides of {{a}} m. The area is {{a * a}} m², and you can't do better."
    variants:
      params: { a: "int[3,10]" }
      defaults: { a: 5 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "For $f(x) = x^3 - 12x$: at which **positive** x is there a minimum?"
    answer:
      value: 2
    hints:
      - f′(x) = 3x² − 12 = 0.
    explanation: x² = 4. The minimum is at x = 2, the maximum at x = −2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: f′(a) = 0. Is there certainly a maximum or minimum at a?
    params:
      options:
        - label: No – it can also be a saddle point, as with x³
          correct: true
        - label: Yes, always
          feedback: For f(x) = x³, f′(0) = 0, but the curve keeps rising.
        - label: Only if f(a) = 0
          feedback: The function value plays no role.
    hints:
      - Picture y = x³.
    explanation: The derivative must **change sign**. The second derivative checks that.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do you set the derivative to zero to find a maximum?"
    params:
      keywords:
        - - steigung
          - slope
          - steil
          - steep
        - - "null"
          - zero
          - waagerecht
          - flach
          - flat
          - horizontal
        - - gipfel
          - höchst
          - highest
          - maximum
          - peak
          - top
      sample: The derivative is the slope. At the highest point the curve goes neither up nor down – it is flat, so the slope is zero.
    difficulty: 3

srs:
  cards_from: [gipfel, maximum]
