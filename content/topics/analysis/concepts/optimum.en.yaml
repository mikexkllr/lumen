id: math.calculus.optimum
type: concept
title: Finding the peak
summary: Where the slope is zero.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gipfel
    widget: choice
    visual:
      widget: graph
      params: { x: [0, 6], y: [0, 10], functions: [{ expr: "-x*x + 6*x" }] }
    prompt: How steep is the curve exactly at its highest point?
    params:
      options:
        - { label: Not at all – it is flat there, correct: true }
        - { label: Steepest, feedback: "It is steep on the flanks. At the top it just turns over." }
        - { label: It falls there, feedback: "It only goes downhill to the right of the peak." }
    hints:
      - It rises on the left and falls on the right. What is in between?
    explanation: At the peak, the slope is zero.

  - kind: explain
    body: |
      So to find the highest or lowest point, you **set the derivative to zero**. This is how companies optimize prices, engineers optimize shapes, and apps optimize their recommendations.

  - kind: problem
    id: maximum
    widget: numeric
    prompt: "For f(x) = −x² + {{2 * k}}x, f′(x) = −2x + {{2 * k}}. At which x is the maximum?"
    params: { placeholder: "x" }
    answer: { value: "{{k}}" }
    hints:
      - "When does −2x + {{2 * k}} equal 0?"
    explanation: "−2x + {{2 * k}} = 0 gives x = {{k}}."
    variants:
      params: { k: "int[2,8]" }
      defaults: { k: 3 }

  - kind: problem
    id: zaun
    widget: numeric
    prompt: You have {{4 * a}} m of fence for a rectangular garden bed that should be as large as possible. How long is one side?
    params: { unit: m }
    answer: { value: "{{a}}" }
    hints:
      - Try a few rectangles with a perimeter of {{4 * a}} m. When is the area largest?
    explanation: "A square with sides of {{a}} m. The area is {{a * a}} m², and you can't do better."
    variants:
      params: { a: "int[3,10]" }
      defaults: { a: 5 }

srs:
  cards_from: [gipfel, maximum]
