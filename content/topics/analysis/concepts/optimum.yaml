id: math.calculus.optimum
type: concept
title: Den Gipfel finden
summary: Wo die Steigung null ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gipfel
    widget: choice
    visual:
      widget: graph
      params: { x: [0, 6], y: [0, 10], functions: [{ expr: "-x*x + 6*x" }] }
    prompt: Wie steil ist die Kurve genau an ihrem höchsten Punkt?
    params:
      options:
        - { label: Gar nicht – sie ist dort waagerecht, correct: true }
        - { label: Am steilsten, feedback: "Steil ist sie an den Flanken. Oben kippt sie gerade um." }
        - { label: Sie fällt dort, feedback: "Erst rechts vom Gipfel geht es bergab." }
    hints:
      - Links steigt sie, rechts fällt sie. Was ist dazwischen?
    explanation: Am Gipfel ist die Steigung null.

  - kind: explain
    body: |
      Darum sucht man den höchsten oder tiefsten Punkt, indem man die **Ableitung null setzt**. So optimieren Firmen Preise, Ingenieure Formen und Apps ihre Empfehlungen.

  - kind: problem
    id: maximum
    widget: numeric
    prompt: "Für f(x) = −x² + {{2 * k}}x gilt f′(x) = −2x + {{2 * k}}. Bei welchem x liegt das Maximum?"
    params: { placeholder: "x" }
    answer: { value: "{{k}}" }
    hints:
      - "Wann ist −2x + {{2 * k}} gleich 0?"
    explanation: "−2x + {{2 * k}} = 0 ergibt x = {{k}}."
    variants:
      params: { k: "int[2,8]" }
      defaults: { k: 3 }

  - kind: problem
    id: zaun
    widget: numeric
    prompt: Mit {{4 * a}} m Zaun soll ein rechteckiges Beet möglichst groß werden. Wie lang wird eine Seite?
    params: { unit: m }
    answer: { value: "{{a}}" }
    hints:
      - Probier ein paar Rechtecke mit {{4 * a}} m Umfang. Wann ist die Fläche am größten?
    explanation: "Ein Quadrat mit {{a}} m Seite – die Fläche ist {{a * a}} m², mehr geht nicht."
    variants:
      params: { a: "int[3,10]" }
      defaults: { a: 5 }

srs:
  cards_from: [gipfel, maximum]
