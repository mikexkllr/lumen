id: math.calculus.optimum
type: concept
title: Den Gipfel finden
summary: Wo die Steigung null ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der beste Winkel
    body: "Kugelstoßer, Gärtner und Firmen suchen alle das Beste: die größte Weite, die meiste Fläche, den höchsten Gewinn. Stell den Winkel ein. Bei welchem Winkel fliegt der Ball am **weitesten**?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: projectile

  - kind: problem
    id: gipfel
    widget: choice
    visual:
      widget: graph
      params: { x: [0, 6], y: [0, 10], functions: [{ expr: "-x*x + 6*x" }] }
    prompt: Wie steil ist die Kurve genau an ihrem höchsten Punkt?
    params:
      options:
        - { label: Gar nicht – sie ist dort waagerecht, correct: true }
        - { label: Am steilsten, feedback: "Steil ist sie an den Flanken. Oben kippt sie gerade um." }
        - { label: Sie fällt dort, feedback: "Erst rechts vom Gipfel geht es bergab." }
    hints:
      - Links steigt sie, rechts fällt sie. Was ist dazwischen?
    explanation: Am Gipfel ist die Steigung null.

  - kind: explain
    id: s2
    body: |
      Darum sucht man den höchsten oder tiefsten Punkt, indem man die **Ableitung null setzt**. So optimieren Firmen Preise, Ingenieure Formen und Apps ihre Empfehlungen.

  - kind: problem
    id: maximum
    widget: numeric
    prompt: "Für f(x) = −x² + {{2 * k}}x gilt f′(x) = −2x + {{2 * k}}. Bei welchem x liegt das Maximum?"
    params: { placeholder: "x" }
    answer: { value: "{{k}}" }
    hints:
      - "Wann ist −2x + {{2 * k}} gleich 0?"
    explanation: "−2x + {{2 * k}} = 0 ergibt x = {{k}}."
    variants:
      params: { k: "int[2,8]" }
      defaults: { k: 3 }

  - kind: problem
    id: zaun
    widget: numeric
    prompt: Mit {{4 * a}} m Zaun soll ein rechteckiges Beet möglichst groß werden. Wie lang wird eine Seite?
    params: { unit: m }
    answer: { value: "{{a}}" }
    hints:
      - Probier ein paar Rechtecke mit {{4 * a}} m Umfang. Wann ist die Fläche am größten?
    explanation: "Ein Quadrat mit {{a}} m Seite – die Fläche ist {{a * a}} m², mehr geht nicht."
    variants:
      params: { a: "int[3,10]" }
      defaults: { a: 5 }

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: "Die Kurve ist f(x) = −x² + 2x. Schieb den Punkt auf den Gipfel: Dort ist die Steigung null."
    params:
      scene: tangent
      expr: 2*x - x^2
    answer:
      slope: 0
    explanation: Bei x = 1. Die Ableitung −2x + 2 ist dort null.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Für $f(x) = x^3 - 12x$: Bei welchem **positiven** x liegt ein Tiefpunkt?"
    answer:
      value: 2
    hints:
      - f′(x) = 3x² − 12 = 0.
    explanation: x² = 4. Bei x = 2 liegt das Minimum, bei x = −2 das Maximum.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Ist f′(a) = 0, entscheidet die **zweite Ableitung**: Ist f″(a) > 0, biegt sich die Kurve nach oben – ein Tiefpunkt. Ist f″(a) < 0, biegt sie sich nach unten – ein Hochpunkt."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: Die Kurve ist $y = x^3 - 3x$. Finde eine Stelle mit waagerechter Tangente.
    params:
      scene: tangent
      expr: x^3 - 3*x
      controls:
        h:
          value: 0.5
        x:
          value: 0
      show:
        - secant
        - slope
    answer:
      slope: 0
    explanation: "Bei x = −1 und x = 1, denn f′(x) = 3x² − 3. Bei −1 ist f″ = −6: Hochpunkt. Bei 1 ist f″ = 6: Tiefpunkt."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Welchen Wert hat $f(x) = x^3 - 3x$ an ihrem Hochpunkt?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == -1
        misconception: x-not-y
        text: Das ist die Stelle x. Gefragt ist der Funktionswert.
      - when: numval(state.input) == -2
        misconception: min-not-max
        text: Das ist der Tiefpunkt bei x = 1.
    hints:
      - Der Hochpunkt liegt bei x = −1.
      - (−1)³ − 3 · (−1).
    explanation: "−1 + 3 = 2. Es ist nur ein lokales Maximum: Für große x wird f beliebig groß."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: f′(a) = 0. Liegt bei a sicher ein Hoch- oder Tiefpunkt?
    params:
      options:
        - label: Nein – es kann auch ein Sattelpunkt sein, wie bei x³
          correct: true
        - label: Ja, immer
          feedback: Bei f(x) = x³ ist f′(0) = 0, aber die Kurve steigt weiter.
        - label: Nur wenn f(a) = 0 ist
          feedback: Der Funktionswert spielt keine Rolle.
    hints:
      - Zeichne y = x³ in Gedanken.
    explanation: Die Ableitung muss das **Vorzeichen wechseln**. Das prüft die zweite Ableitung.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum setzt man die Ableitung null, um ein Maximum zu finden?"
    params:
      keywords:
        - - steigung
          - slope
          - steil
          - steep
        - - "null"
          - zero
          - waagerecht
          - flach
          - flat
          - horizontal
        - - gipfel
          - höchst
          - highest
          - maximum
          - peak
          - top
      sample: Die Ableitung ist die Steigung. Am höchsten Punkt geht es weder bergauf noch bergab – die Kurve ist waagerecht, die Steigung also null.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Licht nimmt den schnellsten Weg – das **Fermat-Prinzip**. Setzt man die Ableitung der Laufzeit null, folgt das Brechungsgesetz: $\\frac{\\sin\\alpha}{\\sin\\beta} = \\frac{v_1}{v_2}$. Ein Rettungsschwimmer, der erst rennt und dann schwimmt, rechnet genauso."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wo hat $f(x) = x \cdot e^{-x}$ ihr Maximum? Es ist $f'(x) = (1 - x)\,e^{-x}$.
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 0
        misconception: zero-of-f
        text: Bei x = 0 ist f selbst null, nicht f′.
    hints:
      - $e^{-x}$ ist nie null.
      - Also muss 1 − x = 0 sein.
    explanation: x = 1, mit f(1) = 1/e ≈ 0,37. So steigt und fällt zum Beispiel der Wirkstoffspiegel nach einer Tablette.
    difficulty: 3

srs:
  cards_from: [gipfel, maximum]
