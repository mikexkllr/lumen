id: math.calculus.rules
type: concept
title: "Produkt- und Kettenregel"
summary: "Zwei Regeln, mit denen sich fast alles ableiten lässt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wenn beide Seiten wachsen
    body: Ein Foto wird zugleich breiter und höher. Wie schnell wächst seine Fläche? Zieh die Ecke des Rechtecks und lass beide Seiten wachsen. Überleg dir, wo genau die **neue Fläche** dazukommt.
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 8
        maxH: 6
        w: 3
        h: 2
        show:
          - area
        unit: cm

  - kind: problem
    id: c1
    widget: choice
    prompt: "Es ist x² · x³ = x⁵, also ist die Ableitung 5x⁴. Darf man stattdessen einfach beide Faktoren einzeln ableiten und malnehmen: 2x · 3x²?"
    params:
      options:
        - label: Nein – das ergäbe 6x³, nicht 5x⁴
          correct: true
        - label: Ja, das ist dasselbe
          feedback: "Rechne nach: 2x · 3x² = 6x³."
        - label: Nur bei geraden Exponenten
          feedback: Die Regel gilt nie so.
    hints:
      - Rechne 2x · 3x² aus und vergleiche mit 5x⁴.
    explanation: Produkte brauchen eine eigene Regel.

  - kind: explain
    id: c2
    body: "Die **Produktregel**: Jeder Faktor wird einmal abgeleitet, der andere bleibt stehen. Dann addieren: $(u \\cdot v)' = u' \\cdot v + u \\cdot v'$."

  - kind: problem
    id: c3
    widget: expression
    prompt: "Leite mit der Produktregel ab: $f(x) = x^2 \\cdot (x + 1)$"
    params:
      variables:
        - x
      prefix: f′(x) =
    answer:
      equivalentTo: 3*x^2 + 2*x
    hints:
      - u = x², v = x + 1. Also 2x · (x + 1) + x² · 1.
    explanation: 2x(x + 1) + x² = 3x² + 2x.

  - kind: explain
    id: c4
    body: "Die **Kettenregel** hilft bei verschachtelten Funktionen wie $(3x + 2)^2$: erst außen ableiten, dann mal die Ableitung von innen. Kurz: **außen mal innen**."

  - kind: problem
    id: c5
    widget: expression
    prompt: "Leite mit der Kettenregel ab: $f(x) = (3x + 2)^2$"
    params:
      variables:
        - x
      prefix: f′(x) =
    answer:
      equivalentTo: 18*x + 12
    hints:
      - "Außen: 2 · (3x + 2). Innen: 3."
    explanation: 2 · (3x + 2) · 3 = 6(3x + 2) = 18x + 12.

  - kind: problem
    id: c6
    widget: buckets
    prompt: Welche Regel brauchst du hier?
    params:
      buckets:
        - id: b1
          label: Produktregel
        - id: b2
          label: Kettenregel
      items:
        - label: x³ · (x + 4)
          bucket: b1
        - label: (x² + 1)⁵
          bucket: b2
        - label: √(3x + 1)
          bucket: b2
        - label: (x + 1) · (x − 2)
          bucket: b1
        - label: (5x − 1)⁴
          bucket: b2
    hints:
      - Steht ein Mal zwischen zwei Teilen – oder steckt ein Term in einem anderen?
    explanation: "Produkt: zwei Faktoren nebeneinander. Kette: eine Funktion in einer anderen."

  - kind: problem
    id: intro-c1
    widget: rect
    prompt: Ein Rechteck ist 4 cm breit und 3 cm hoch. Beide Seiten wachsen um 1 cm. Zieh es auf die neue Größe.
    params:
      maxW: 8
      maxH: 6
      w: 4
      h: 3
      show:
        - area
      unit: cm
    check:
      predicate: w == 5 && h == 4
    hints:
      - Breite 4 + 1, Höhe 3 + 1.
      - "Vergleich die Flächen: vorher 12 cm², nachher?"
    explanation: 5 · 4 = 20 cm². Dazu kamen die Streifen 1 · 3 und 4 · 1 und die kleine Ecke 1 · 1. Die zwei Streifen sind die zwei Teile der Produktregel.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Leite ab: $f(x) = (x^2 + 1)^3$"
    params:
      variables:
        - x
      prefix: f′(x) =
    answer:
      equivalentTo: 6*x*(x^2 + 1)^2
    hints:
      - "Außen: 3 · (x² + 1)². Innen: 2x."
    explanation: 3(x² + 1)² · 2x = 6x(x² + 1)².
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Beide Regeln zusammen: $f(x) = x \\cdot (x - 4)^2$. Wie groß ist f′(2)?"
    answer:
      value: -4
    hints:
      - f′(x) = 1 · (x − 4)² + x · 2(x − 4). Setz x = 2 ein.
    explanation: (−2)² + 2 · 2 · (−2) = 4 − 8 = −4.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Bild zur Produktregel: Ein Rechteck hat die Seiten u und v. Wachsen beide ein wenig, kommen zwei schmale Streifen dazu: $u' \\cdot v$ und $u \\cdot v'$. Die winzige Ecke $u' v'$ zählt nicht. So entsteht die **Produktregel**."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Leite $f(x) = (x^2 + 1)(x - 1)$ mit der Produktregel ab. Wie groß ist f′(2)?
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 4
        misconception: product-of-derivatives
        text: Das ist nur u′ · v′ = 2x · 1. Die Produktregel hat zwei Summanden.
    hints:
      - u = x² + 1, v = x − 1, u′ = 2x, v′ = 1.
      - f′(2) = 4 · 1 + 5 · 1.
    explanation: "f′(x) = 2x(x − 1) + (x² + 1), also f′(2) = 4 + 5 = 9. Probe durch Ausmultiplizieren: f = x³ − x² + x − 1, f′(2) = 12 − 4 + 1."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Ölfleck ist ein Kreis mit Fläche A = π · r². Sein Radius wächst um 2 cm pro Sekunde. Wie schnell wächst die Fläche bei r = 5 cm? Gib die Zahl vor π an.
    answer:
      value: 20
    hints:
      - "Kettenregel: Änderung von A = 2πr · Änderung von r."
    explanation: 2π · 5 · 2 = 20π cm² pro Sekunde. Die Kettenregel verknüpft Tempos.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Wie leitet man $f(x) = 1/(x^2 + 1)$ ab – ganz ohne neue Regel?
    params:
      options:
        - label: Als (x² + 1)⁻¹ schreiben und die Kettenregel nutzen
          correct: true
        - label: Oben und unten einzeln ableiten
          feedback: Das ergäbe 0 durch 2x – falsch.
        - label: Das geht nicht
          feedback: Es geht mit der Kettenregel.
    hints:
      - 1 durch etwas ist »etwas hoch −1«.
    explanation: −1 · (x² + 1)⁻² · 2x. Auch die Quotientenregel ist nur Produkt plus Kette.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux die Kettenregel mit einem Bild aus dem Alltag.
    params:
      keywords:
        - - außen
          - äußere
          - outer
          - outside
        - - innen
          - innere
          - inner
          - inside
        - - mal
          - multipli
          - times
          - multipl
          - produkt
          - product
      sample: "Bei verschachtelten Funktionen leitet man erst die äußere ab und nimmt das mal die Ableitung der inneren. Wie bei Zahnrädern: Die Übersetzungen multiplizieren sich."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Die Kettenregel ist wie ein Getriebe: Dreht sich u doppelt so schnell wie x und y dreimal so schnell wie u, dann dreht sich y sechsmal so schnell wie x. **Änderungsraten** werden malgenommen: $\\frac{dy}{dx} = \\frac{dy}{du} \\cdot \\frac{du}{dx}$."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Zahnrad A dreht sich 3-mal pro Umdrehung von B, B dreht sich 4-mal pro Umdrehung von C. Wie oft dreht sich A pro Umdrehung von C?
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 7
        misconception: add-rates
        text: Raten werden nicht addiert, sondern malgenommen.
    hints:
      - Eine Umdrehung von C sind 4 von B.
      - Jede davon sind 3 von A.
    explanation: 3 · 4 = 12 – genau die Kettenregel.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: "Mit der Potenzregel: $(x^{-1})' = -x^{-2}$. Wie steil ist $f(x) = \\frac1x$ bei x = 2?"
    answer:
      value: -0.25
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.25
        misconception: sign-error
        text: Die Hyperbel fällt – die Steigung ist negativ.
      - when: numval(state.input) == 0.5
        misconception: value-not-slope
        text: Das ist f(2).
    hints:
      - $-x^{-2} = -\frac{1}{x^2}$.
      - $-\frac14$.
    explanation: −1/4 = −0,25. Die Potenzregel gilt auch für negative Exponenten.
    difficulty: 3

srs:
  cards_from: ["c3", "c5", "d1"]
