id: math.calculus.area
type: concept
title: Area under the curve
summary: From speed to distance.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: konstant
    widget: numeric
    prompt: A car drives at a constant {{v}} km/h for {{t}} hours. How far does it get?
    params: { unit: km }
    answer: { value: "{{v * t}}" }
    hints:
      - Speed times time.
    explanation: "{{v}} · {{t}} = {{v * t}} km – exactly the area of the rectangle under the speed line."
    variants:
      params: { t: "int[2,5]", v: "choice[50,60,80,100]" }
      defaults: { t: 3, v: 60 }

  - kind: explain
    id: s2
    body: |
      In a speed-time graph, the **area under the curve** is the distance. For curved lines, you cut the area into thin strips and add them up. This is called an **integral**.

  - kind: problem
    id: dreieck
    widget: numeric
    prompt: A wheel speeds up evenly from 0 to {{v}} m/s in {{t}} s. How far does it travel?
    params: { unit: m }
    answer: { value: "{{v * t / 2}}" }
    feedback:
      - when: "numval(state.input) == v * t"
        misconception: full-rectangle
        text: That would be the distance at full speed from the start. Under the curve there is only a triangle.
    hints:
      - The area is a triangle – half the base times the height.
    explanation: "{{t}} · {{v}} ÷ 2 = {{v * t / 2}} m."
    variants:
      params: { t: "choice[4,6,10]", v: "choice[4,6,8,10]" }
      defaults: { t: 6, v: 8 }

  - kind: problem
    id: wasser
    widget: choice
    prompt: A graph shows how many liters per minute flow into a tub. What does the area under it measure?
    params:
      options:
        - { label: The total amount of water, correct: true }
        - { label: The highest flow rate, feedback: "That is the highest point of the curve." }
        - { label: The duration, feedback: "The duration is on the x-axis." }
    hints:
      - Liters per minute times minutes gives …
    explanation: Rate times time gives the amount. The area adds up everything that has flowed.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Approximate the area under $y = x^2$ from 0 to 2 with rectangles. Make the error smaller than 0.15.
    params:
      scene: riemann
      expr: x^2
      interval:
        - 0
        - 2
    answer:
      error:
        - 0
        - 0.15
    explanation: "From about 27 rectangles. More strips, smaller error – the limit is the **integral**: 8/3."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: If the curve lies below the x-axis, the area counts **negatively**. For speed that means driving backwards. The integral then gives the displacement, not the distance driven.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: Approximate the area under $y = x^3$ from 0 to 2 with rectangles. The exact area is 4. Make the error smaller than 0.3.
    params:
      scene: riemann
      expr: x^3
      interval:
        - 0
        - 2
    answer:
      error:
        - 0
        - 0.3
    explanation: Left rectangles underestimate a rising curve. With 40 rectangles only about 0.2 is missing.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A cart speeds up with $v(t) = 2t$ m/s. How far does it go in the first {{t}} seconds?
    params:
      unit: m
    answer:
      value: "{{t * t}}"
    feedback:
      - when: numval(state.input) == 2 * t * t
        misconception: no-half
        text: "The area is a triangle: ½ · base · height."
    hints:
      - Under v(t) = 2t lies a triangle.
      - ½ · {{t}} · {{2 * t}}.
    explanation: ½ · {{t}} · {{2 * t}} = {{t * t}} m.
    difficulty: 2
    variants:
      params:
        t: int[2,10]
      defaults:
        t: 5

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "A car accelerates: $v(t) = 3t$ m/s. How far does it travel in the first 4 seconds?"
    params:
      unit: m
    answer:
      value: 24
    hints:
      - The area under the line is a triangle.
    explanation: ½ · 4 · 12 = 24 m. Differentiating turns distance into speed – integrating turns speed into distance.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Let A(x) be the area under f from 0 to x. If x moves a tiny dx further, a strip of area f(x) · dx is added. So A′(x) = f(x). The **area function** is an antiderivative – that is the fundamental theorem.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: The area function of $f(x) = x^2$ is $A(x) = \frac{x^3}{3}$. What is the area from 0 to 3?
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 27
        misconception: no-third
        text: Do not forget to divide by 3.
      - when: numval(state.input) == 6
        misconception: derivative
        text: That is the derivative 2x at 3, not an area.
    hints:
      - A(3) = 27 / 3.
      - A(0) = 0.
    explanation: 9. No rectangles, no limit – differentiating backwards is enough.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why the area under a speed curve is the distance travelled.
    params:
      keywords:
        - - streifen
          - rechteck
          - strip
          - rectangle
        - - tempo mal zeit
          - mal zeit
          - speed times time
          - times time
        - - addier
          - summe
          - add
          - sum
      sample: In a short slice of time the speed is almost constant. The distance in it is speed times time – exactly the area of a thin rectangle. Adding all strips gives the whole distance.
    explanation: Distance = speed · time holds in every thin strip. The sum of all strips is the area.
    difficulty: 3

srs:
  cards_from: [dreieck, wasser]
