id: math.calculus.derivative
type: concept
title: Die Ableitung
summary: Eine Formel für alle Steigungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Steigungsmaschine
    body: "Achterbahnen, Aktienkurse, Bergstraßen: Mal geht es steil hinauf, mal flach, mal bergab. Schieb den Punkt über die Kurve. Die Zahl zeigt die **Steigung** an jeder Stelle. Wo ist sie null, wo negativ?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: tangent
        expr: x^3 - 3*x
        controls:
          h:
            value: 0.01
            fixed: true
        show:
          - slope

  - kind: problem
    id: hook
    widget: choice
    prompt: Die Parabel y = x² wird nach rechts immer steiler. Wo ist sie steiler?
    params:
      options:
        - label: Bei x = 3
          correct: true
        - label: Bei x = 1
          feedback: Weiter rechts geht es steiler hinauf.
        - label: Überall gleich
          feedback: Nur eine Gerade ist überall gleich steil.
    hints:
      - Stell dir vor, du läufst die Kurve hinauf.
    explanation: Die Steilheit hängt von der Stelle ab. Eine Formel dafür wäre praktisch.

  - kind: explain
    id: s1
    body: |
      Die **Ableitung** f′ gibt die Steigung an jeder Stelle an. Für Potenzen gilt: Aus $x^n$ wird $n \cdot x^{n-1}$ – der Exponent wandert nach vorn und wird um eins kleiner.

  - kind: problem
    id: hoch-drei
    widget: expression
    prompt: "Leite ab: $f(x) = x^3$"
    params: { variables: [x], prefix: "f′(x) =" }
    answer: { equivalentTo: "3*x^2" }
    hints:
      - Die 3 wandert nach vorn, der Exponent wird 2.
    explanation: "$f'(x) = 3x^2$."

  - kind: problem
    id: paare
    widget: match
    prompt: Verbinde jede Funktion mit ihrer Ableitung.
    params:
      pairs:
        - { left: "x²", right: "2x" }
        - { left: "x³", right: "3x²" }
        - { left: "5x", right: "5" }
        - { left: "7", right: "0" }
    hints:
      - Eine Konstante ändert sich nie – ihre Steigung ist 0.
    explanation: Eine Gerade 5x hat überall die Steigung 5, eine Konstante die Steigung 0.

  - kind: problem
    id: anwenden
    widget: numeric
    prompt: Wie steil ist f(x) = {{a}}x² bei x = {{b}}?
    params: { placeholder: "Steigung" }
    answer: { value: "{{2 * a * b}}" }
    hints:
      - "f′(x) = {{2 * a}}x."
    explanation: "f′({{b}}) = {{2 * a}} · {{b}} = {{2 * a * b}}."
    variants:
      params: { a: "int[2,5]", b: "int[1,4]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Die Ableitung von $x^5$ ist $5x^4$.
          right: true
        - text: Die Ableitung von $x^2$ ist $x$.
          right: false
          why: "Der Exponent wandert nach vorn: 2x."
        - text: Die Ableitung einer Konstanten ist 0.
          right: true
        - text: Die Ableitung von $3x$ ist $3x$.
          right: false
          why: Eine Gerade hat überall die Steigung 3.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Die Ableitung von x² ist 2x. Finde die Stelle, an der die Parabel genau die Steigung 3 hat.
    params:
      scene: tangent
      expr: x^2
    answer:
      slope: 3
    explanation: Bei x = 1,5, denn 2 · 1,5 = 3.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Leite ab: $f(x) = 2x^3 - 5x + 7$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*x^2 - 5
    hints:
      - Leite jeden Summanden einzeln ab. Die 7 verschwindet.
    explanation: 2 · 3x² − 5 + 0. Summen leitet man gliedweise ab.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Ableiten geht Stück für Stück. Die **Summenregel**: $(f + g)' = f' + g'$. Ein fester Faktor bleibt stehen: $(5x^2)' = 5 \\cdot 2x$. Eine Konstante allein hat die Ableitung 0 – sie verschiebt nur."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie steil ist $f(x) = 4x^3 - 2x^2 + x + 7$ bei x = 1?
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 10
        misconception: value-not-slope
        text: Das ist f(1). Gefragt ist f′(1).
      - when: numval(state.input) == 16
        misconception: kept-constant
        text: Die Konstante 7 fällt beim Ableiten weg.
    hints:
      - f′(x) = 12x² − 4x + 1.
      - Setz x = 1 ein.
    explanation: 12 − 4 + 1 = 9.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: "Neue Kurve: $y = \\sin x$ (x im Bogenmaß). Finde die Stelle, an der die Tangente die Steigung genau 1 hat."
    params:
      scene: tangent
      expr: sin(x)
      controls:
        h:
          value: 0.5
        x:
          value: -2
      show:
        - secant
        - slope
    answer:
      slope: 1
    explanation: Bei x = 0. Die Steigung von sin x ist cos x, und cos 0 = 1. Darum ist sin x ≈ x für kleine x.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: expression
    prompt: "Kettenregel: Leite $f(x) = (2x + 1)^3$ ab."
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*(2*x + 1)^2
    hints:
      - "Äußere Ableitung mal innere: 3 · (…)² · 2."
    explanation: Außen 3(2x + 1)², innen 2 – zusammen 6(2x + 1)².
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Zwei Ableitungen muss man kennen: $(e^x)' = e^x$ – die **e-Funktion** ist ihre eigene Ableitung. Und $(\\sin x)' = \\cos x$: Ein Punkt auf dem Einheitskreis bewegt sich immer senkrecht zum Radius."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: sim
    prompt: "Kurve $y = e^x$: Bei welcher Stelle hat die Tangente die Steigung e ≈ 2,72?"
    params:
      scene: tangent
      expr: exp(x)
      controls:
        h:
          value: 0.5
        x:
          value: -1
      show:
        - secant
        - slope
    answer:
      slope:
        - 2.7
        - 2.75
    explanation: Bei x = 1. Steigung und Höhe sind überall gleich – genau das heißt $(e^x)' = e^x$.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux die Potenzregel: Warum wird aus $x^n$ die Ableitung $n x^{n-1}$?"
    params:
      keywords:
        - - n faktoren
          - n factors
          - n-mal
          - n times
          - jeder faktor
          - each factor
        - - klein
          - winzig
          - tiny
          - small
        - - exponent
          - hochzahl
          - power
          - eins weniger
          - one less
      sample: "In (x + h)ⁿ gibt es n Faktoren. Für die winzigen Terme zählt nur, wenn genau ein Faktor das h liefert: Das passiert auf n Arten und ergibt n · xⁿ⁻¹ · h. Geteilt durch h bleibt n xⁿ⁻¹, der Exponent ist eins weniger."
    explanation: "Binomisch: $(x + h)^n = x^n + n x^{n-1} h + \\dots$ Alle weiteren Terme enthalten h² und verschwinden."
    difficulty: 3

srs:
  cards_from: [hoch-drei, anwenden]
