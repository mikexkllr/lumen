id: math.calculus.derivative
type: concept
title: Die Ableitung
summary: Eine Formel für alle Steigungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Die Parabel y = x² wird nach rechts immer steiler. Wo ist sie steiler?
    params:
      options:
        - label: Bei x = 3
          correct: true
        - label: Bei x = 1
          feedback: Weiter rechts geht es steiler hinauf.
        - label: Überall gleich
          feedback: Nur eine Gerade ist überall gleich steil.
    hints:
      - Stell dir vor, du läufst die Kurve hinauf.
    explanation: Die Steilheit hängt von der Stelle ab. Eine Formel dafür wäre praktisch.


  - kind: explain
    id: s1
    body: |
      Die **Ableitung** f′ gibt die Steigung an jeder Stelle an. Für Potenzen gilt: Aus $x^n$ wird $n \cdot x^{n-1}$ – der Exponent wandert nach vorn und wird um eins kleiner.

  - kind: problem
    id: hoch-drei
    widget: expression
    prompt: "Leite ab: $f(x) = x^3$"
    params: { variables: [x], prefix: "f′(x) =" }
    answer: { equivalentTo: "3*x^2" }
    hints:
      - Die 3 wandert nach vorn, der Exponent wird 2.
    explanation: "$f'(x) = 3x^2$."

  - kind: problem
    id: paare
    widget: match
    prompt: Verbinde jede Funktion mit ihrer Ableitung.
    params:
      pairs:
        - { left: "x²", right: "2x" }
        - { left: "x³", right: "3x²" }
        - { left: "5x", right: "5" }
        - { left: "7", right: "0" }
    hints:
      - Eine Konstante ändert sich nie – ihre Steigung ist 0.
    explanation: Eine Gerade 5x hat überall die Steigung 5, eine Konstante die Steigung 0.

  - kind: problem
    id: anwenden
    widget: numeric
    prompt: Wie steil ist f(x) = {{a}}x² bei x = {{b}}?
    params: { placeholder: "Steigung" }
    answer: { value: "{{2 * a * b}}" }
    hints:
      - "f′(x) = {{2 * a}}x."
    explanation: "f′({{b}}) = {{2 * a}} · {{b}} = {{2 * a * b}}."
    variants:
      params: { a: "int[2,5]", b: "int[1,4]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Die Ableitung von $x^5$ ist $5x^4$.
          right: true
        - text: Die Ableitung von $x^2$ ist $x$.
          right: false
          why: "Der Exponent wandert nach vorn: 2x."
        - text: Die Ableitung einer Konstanten ist 0.
          right: true
        - text: Die Ableitung von $3x$ ist $3x$.
          right: false
          why: Eine Gerade hat überall die Steigung 3.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Leite ab: $f(x) = 2x^3 - 5x + 7$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*x^2 - 5
    hints:
      - Leite jeden Summanden einzeln ab. Die 7 verschwindet.
    explanation: 2 · 3x² − 5 + 0. Summen leitet man gliedweise ab.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: expression
    prompt: "Kettenregel: Leite $f(x) = (2x + 1)^3$ ab."
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*(2*x + 1)^2
    hints:
      - "Äußere Ableitung mal innere: 3 · (…)² · 2."
    explanation: Außen 3(2x + 1)², innen 2 – zusammen 6(2x + 1)².
    difficulty: 3

srs:
  cards_from: [hoch-drei, anwenden]
