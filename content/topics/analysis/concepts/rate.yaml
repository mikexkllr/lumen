id: math.calculus.rate
type: concept
title: Wie schnell ändert es sich?
summary: Die mittlere Änderungsrate.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: tempo
    widget: numeric
    prompt: Ein Zug fährt in {{t}} Stunden {{s}} km. Wie schnell ist er im Schnitt?
    params: { unit: km/h }
    answer: { value: "{{v}}" }
    hints:
      - Strecke geteilt durch Zeit.
    explanation: "{{s}} : {{t}} = {{v}} km/h."
    variants:
      params: { t: "choice[2,3,4]", v: "choice[60,80,90,120]" }
      derive: { s: "v * t" }
      defaults: { t: 3, v: 80 }

  - kind: explain
    body: |
      Die **Änderungsrate** ist die Änderung von y geteilt durch die Änderung von x. Im Graphen ist das die Steigung der Geraden durch zwei Punkte.

  - kind: problem
    id: sekante
    widget: slider
    prompt: Dreh die Gerade so, dass sie durch beide Punkte geht.
    params:
      expr: "m*(x-1) + 2"
      x: [0, 4]
      y: [0, 10]
      showCoordinates: false
      sliders: [{ id: m, label: Steigung, min: 0, max: 5, step: 0.5, initial: 1 }]
      markers:
        - { x: 1, y: 2, group: a }
        - { x: 3, y: 8, group: a }
    check: { predicate: "m == 3" }
    hints:
      - Von x = 1 bis x = 3 steigt y um 6.
    explanation: "Steigung = (8 − 2) : (3 − 1) = 3."

  - kind: problem
    id: baum
    widget: numeric
    prompt: Ein Baum wächst in {{n}} Jahren von {{a}} cm auf {{b}} cm. Wie viel wächst er im Schnitt pro Jahr?
    params: { unit: cm }
    answer: { value: "{{r}}" }
    hints:
      - Zuwachs geteilt durch die Jahre.
    explanation: "({{b}} − {{a}}) : {{n}} = {{r}} cm pro Jahr."
    variants:
      params: { a: "int[40,120]", n: "int[2,6]", r: "int[5,30]" }
      derive: { b: "a + r * n" }
      defaults: { a: 80, n: 4, r: 15 }

srs:
  cards_from: [sekante, baum]
