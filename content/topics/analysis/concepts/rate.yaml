id: math.calculus.rate
type: concept
title: Wie schnell ändert es sich?
summary: Die mittlere Änderungsrate.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alles hat ein Tempo
    body: "Nicht nur Autos haben ein Tempo. Alles, was sich ändert, ändert sich mit einer **Rate**: Haare, Kontinente, Pflanzen. Deck die Karten auf und schätz vorher, wie schnell es geht."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💇
            front: Haare
            back: Etwa 1 cm pro Monat – rund 12 cm im Jahr.
          - icon: 🌍
            front: Kontinente
            back: Europa und Amerika driften etwa 2,5 cm pro Jahr auseinander – ungefähr so schnell wachsen Fingernägel.
          - icon: 🎋
            front: Bambus
            back: Manche Arten wachsen fast 1 m an einem einzigen Tag.
          - icon: 🐌
            front: Schnecke
            back: Eine Gartenschnecke schafft etwa 1 mm pro Sekunde – das sind 3,6 m pro Stunde.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Sprinter läuft 100 m in 10 s. Wie hoch ist sein **Spitzentempo** in km/h?"
    params:
      min: 20
      max: 60
      unit: km/h
    answer:
      value: 44
      tolerance: 4
    explanation: Im Schnitt 36 km/h – in der Spitze rund 44. Durchschnitt und Momentantempo sind verschieden.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: Ein Zug fährt in {{t}} Stunden {{s}} km. Wie schnell ist er im Schnitt?
    params: { unit: km/h }
    answer: { value: "{{v}}" }
    hints:
      - Strecke geteilt durch Zeit.
    explanation: "{{s}} : {{t}} = {{v}} km/h."
    variants:
      params: { t: "choice[2,3,4]", v: "choice[60,80,90,120]" }
      derive: { s: "v * t" }
      defaults: { t: 3, v: 80 }

  - kind: explain
    id: s2
    body: |
      Die **Änderungsrate** ist die Änderung von y geteilt durch die Änderung von x. Im Graphen ist das die Steigung der Geraden durch zwei Punkte.

  - kind: problem
    id: sekante
    widget: slider
    prompt: Dreh die Gerade so, dass sie durch beide Punkte geht.
    params:
      expr: "m*(x-1) + 2"
      x: [0, 4]
      y: [0, 10]
      showCoordinates: false
      sliders: [{ id: m, label: Steigung, min: 0, max: 5, step: 0.5, initial: 1 }]
      markers:
        - { x: 1, y: 2, group: a }
        - { x: 3, y: 8, group: a }
    check: { predicate: "m == 3" }
    hints:
      - Von x = 1 bis x = 3 steigt y um 6.
    explanation: "Steigung = (8 − 2) : (3 − 1) = 3."

  - kind: problem
    id: baum
    widget: numeric
    prompt: Ein Baum wächst in {{n}} Jahren von {{a}} cm auf {{b}} cm. Wie viel wächst er im Schnitt pro Jahr?
    params: { unit: cm }
    answer: { value: "{{r}}" }
    hints:
      - Zuwachs geteilt durch die Jahre.
    explanation: "({{b}} − {{a}}) : {{n}} = {{r}} cm pro Jahr."
    variants:
      params: { a: "int[40,120]", n: "int[2,6]", r: "int[5,30]" }
      derive: { b: "a + r * n" }
      defaults: { a: 80, n: 4, r: 15 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Für $f(x) = x^2$: Wie groß ist die mittlere Änderungsrate zwischen x = 1 und x = 3?"
    answer:
      value: 4
    hints:
      - "(f(3) − f(1)) : (3 − 1)."
    explanation: "(9 − 1) : 2 = 4. Das ist die Steigung der Sekante."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Die Steigung zwischen x und x + h ist der **Differenzenquotient** $\frac{f(x + h) - f(x)}{h}$. Für $f(x) = x^2$ bei x = 2 ist das $\frac{(2 + h)^2 - 4}{h} = 4 + h$.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Für $f(x) = x^2$ ist der Differenzenquotient bei x = {{a}} gleich {{2 * a}} + h. Wie groß ist er für h = {{h}}?
    answer:
      value: "{{2 * a + h}}"
      tolerance: 0.0001
    feedback:
      - when: numval(state.input) == 2 * a
        misconception: limit-too-early
        text: Das ist der Grenzwert für h → 0. Hier ist h noch {{h}}.
    hints:
      - Setz h = {{h}} in {{2 * a}} + h ein.
      - "{{2 * a}} + {{h}}."
    explanation: "{{2 * a}} + {{h}} = {{2 * a + h}}. Je kleiner h, desto näher an {{2 * a}}."
    difficulty: 2
    variants:
      params:
        a: int[1,6]
        h: choice[0.1,0.01,0.5]
      defaults:
        a: 2
        h: 0.1

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: Bleib bei x = 1. Stell h so ein, dass die Sekante genau die Steigung 2,1 hat.
    params:
      scene: tangent
      expr: x^2
      controls:
        x:
          value: 1
          fixed: true
        h:
          value: 1
      show:
        - secant
        - slope
    answer:
      secant:
        - 2.095
        - 2.105
    explanation: "h = 0,1: Die Sekantensteigung ist 2 + h. Wird h winzig, bleibt die 2 – die Steigung der Tangente."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Für $f(x) = x^2$ zwischen x = 1 und x = 1 + h ist die Änderungsrate 2 + h. Welchem Wert nähert sie sich, wenn h gegen 0 geht?
    answer:
      value: 2
    hints:
      - Setz für h immer kleinere Zahlen ein.
    explanation: Der **Grenzwert** ist 2 – die Steigung genau im Punkt x = 1.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Die Ableitung ist der **Grenzwert** des Differenzenquotienten. Für x²: $(x + h)^2 - x^2 = 2xh + h^2$. Geteilt durch h bleibt 2x + h. Lässt man h gegen 0 gehen, bleibt genau 2x."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Für $f(x) = x^3$ ist $\frac{(2 + h)^3 - 8}{h} = 12 + 6h + h^2$. Welchem Wert nähert er sich für h → 0?
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 8
        misconception: value-not-slope
        text: Das ist f(2), der Funktionswert. Gesucht ist die Steigung.
    hints:
      - Was passiert mit 6h und h², wenn h winzig wird?
      - Beide verschwinden.
    explanation: 12 = 3 · 2². Das bestätigt die Potenzregel $(x^3)' = 3x^2$.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Ableitung von x² genau 2x ist.
    params:
      keywords:
        - - winzig
          - "null"
          - tiny
          - zero
          - gegen 0
        - - 2xh
          - ausmultipl
          - expand
          - binom
        - - sekante
          - differenzenquotient
          - secant
          - difference quotient
          - steigung
          - slope
      sample: Ich nehme die Sekante von x bis x + h. Ausmultipliziert ist (x + h)² − x² = 2xh + h². Geteilt durch h ergibt die Steigung 2x + h. Wird h winzig, bleibt 2x.
    explanation: "Sekante → Tangente: Der Rest h verschwindet im Grenzwert."
    difficulty: 3

srs:
  cards_from: [sekante, baum]
