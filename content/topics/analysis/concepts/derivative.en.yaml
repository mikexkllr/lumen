id: math.calculus.derivative
type: concept
title: The derivative
summary: One formula for all slopes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: The parabola y = x² gets steeper to the right. Where is it steeper?
    params:
      options:
        - label: At x = 3
          correct: true
        - label: At x = 1
          feedback: Further right it climbs more steeply.
        - label: The same everywhere
          feedback: Only a straight line is equally steep everywhere.
    hints:
      - Imagine walking up the curve.
    explanation: The steepness depends on the spot. A formula for it would be handy.


  - kind: explain
    id: s1
    body: |
      The **derivative** f′ gives the slope at every point. For powers, $x^n$ becomes $n \cdot x^{n-1}$. The exponent moves to the front and drops by one.

  - kind: problem
    id: hoch-drei
    widget: expression
    prompt: "Differentiate: $f(x) = x^3$"
    params: { variables: [x], prefix: "f′(x) =" }
    answer: { equivalentTo: "3*x^2" }
    hints:
      - The 3 moves to the front, and the exponent becomes 2.
    explanation: "$f'(x) = 3x^2$."

  - kind: problem
    id: paare
    widget: match
    prompt: Match each function with its derivative.
    params:
      pairs:
        - { left: "x²", right: "2x" }
        - { left: "x³", right: "3x²" }
        - { left: "5x", right: "5" }
        - { left: "7", right: "0" }
    hints:
      - A constant never changes, so its slope is 0.
    explanation: A line 5x has slope 5 everywhere. A constant has slope 0.

  - kind: problem
    id: anwenden
    widget: numeric
    prompt: How steep is f(x) = {{a}}x² at x = {{b}}?
    params: { placeholder: "Slope" }
    answer: { value: "{{2 * a * b}}" }
    hints:
      - "f′(x) = {{2 * a}}x."
    explanation: "f′({{b}}) = {{2 * a}} · {{b}} = {{2 * a * b}}."
    variants:
      params: { a: "int[2,5]", b: "int[1,4]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: The derivative of $x^5$ is $5x^4$.
          right: true
        - text: The derivative of $x^2$ is $x$.
          right: false
          why: "The exponent moves to the front: 2x."
        - text: The derivative of a constant is 0.
          right: true
        - text: The derivative of $3x$ is $3x$.
          right: false
          why: A straight line has slope 3 everywhere.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Differentiate: $f(x) = 2x^3 - 5x + 7$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*x^2 - 5
    hints:
      - Differentiate each term separately. The 7 vanishes.
    explanation: 2 · 3x² − 5 + 0. Sums are differentiated term by term.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: expression
    prompt: "Chain rule: differentiate $f(x) = (2x + 1)^3$."
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*(2*x + 1)^2
    hints:
      - "Outer derivative times inner: 3 · (…)² · 2."
    explanation: Outside 3(2x + 1)², inside 2 – together 6(2x + 1)².
    difficulty: 3

srs:
  cards_from: [hoch-drei, anwenden]
