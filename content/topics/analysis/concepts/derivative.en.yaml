id: math.calculus.derivative
type: concept
title: The derivative
summary: One formula for all slopes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The slope machine
    body: "Roller coasters, share prices, mountain roads: sometimes steeply up, sometimes flat, sometimes downhill. Slide the point along the curve. The number shows the **slope** at every spot. Where is it zero, where negative?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: tangent
        expr: x^3 - 3*x
        controls:
          h:
            value: 0.01
            fixed: true
        show:
          - slope

  - kind: problem
    id: hook
    widget: choice
    prompt: The parabola y = x² gets steeper to the right. Where is it steeper?
    params:
      options:
        - label: At x = 3
          correct: true
        - label: At x = 1
          feedback: Further right it climbs more steeply.
        - label: The same everywhere
          feedback: Only a straight line is equally steep everywhere.
    hints:
      - Imagine walking up the curve.
    explanation: The steepness depends on the spot. A formula for it would be handy.

  - kind: explain
    id: s1
    body: |
      The **derivative** f′ gives the slope at every point. For powers, $x^n$ becomes $n \cdot x^{n-1}$. The exponent moves to the front and drops by one.

  - kind: problem
    id: hoch-drei
    widget: expression
    prompt: "Differentiate: $f(x) = x^3$"
    params: { variables: [x], prefix: "f′(x) =" }
    answer: { equivalentTo: "3*x^2" }
    hints:
      - The 3 moves to the front, and the exponent becomes 2.
    explanation: "$f'(x) = 3x^2$."

  - kind: problem
    id: paare
    widget: match
    prompt: Match each function with its derivative.
    params:
      pairs:
        - { left: "x²", right: "2x" }
        - { left: "x³", right: "3x²" }
        - { left: "5x", right: "5" }
        - { left: "7", right: "0" }
    hints:
      - A constant never changes, so its slope is 0.
    explanation: A line 5x has slope 5 everywhere. A constant has slope 0.

  - kind: problem
    id: anwenden
    widget: numeric
    prompt: How steep is f(x) = {{a}}x² at x = {{b}}?
    params: { placeholder: "Slope" }
    answer: { value: "{{2 * a * b}}" }
    hints:
      - "f′(x) = {{2 * a}}x."
    explanation: "f′({{b}}) = {{2 * a}} · {{b}} = {{2 * a * b}}."
    variants:
      params: { a: "int[2,5]", b: "int[1,4]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: The derivative of $x^5$ is $5x^4$.
          right: true
        - text: The derivative of $x^2$ is $x$.
          right: false
          why: "The exponent moves to the front: 2x."
        - text: The derivative of a constant is 0.
          right: true
        - text: The derivative of $3x$ is $3x$.
          right: false
          why: A straight line has slope 3 everywhere.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: The derivative of x² is 2x. Find the point where the parabola has exactly the slope 3.
    params:
      scene: tangent
      expr: x^2
    answer:
      slope: 3
    explanation: At x = 1.5, since 2 · 1.5 = 3.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Differentiate: $f(x) = 2x^3 - 5x + 7$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*x^2 - 5
    hints:
      - Differentiate each term separately. The 7 vanishes.
    explanation: 2 · 3x² − 5 + 0. Sums are differentiated term by term.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Differentiating works piece by piece. The **sum rule**: $(f + g)' = f' + g'$. A constant factor stays: $(5x^2)' = 5 \\cdot 2x$. A constant on its own has derivative 0 – it only shifts."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: How steep is $f(x) = 4x^3 - 2x^2 + x + 7$ at x = 1?
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 10
        misconception: value-not-slope
        text: That is f(1). You want f′(1).
      - when: numval(state.input) == 16
        misconception: kept-constant
        text: The constant 7 vanishes when differentiating.
    hints:
      - f′(x) = 12x² − 4x + 1.
      - Put x = 1.
    explanation: 12 − 4 + 1 = 9.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: "New curve: $y = \\sin x$ (x in radians). Find the point where the tangent has slope exactly 1."
    params:
      scene: tangent
      expr: sin(x)
      controls:
        h:
          value: 0.5
        x:
          value: -2
      show:
        - secant
        - slope
    answer:
      slope: 1
    explanation: At x = 0. The slope of sin x is cos x, and cos 0 = 1. That is why sin x ≈ x for small x.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: expression
    prompt: "Chain rule: differentiate $f(x) = (2x + 1)^3$."
    params:
      variables:
        - x
    answer:
      equivalentTo: 6*(2*x + 1)^2
    hints:
      - "Outer derivative times inner: 3 · (…)² · 2."
    explanation: Outside 3(2x + 1)², inside 2 – together 6(2x + 1)².
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Two derivatives everyone should know: $(e^x)' = e^x$ – the **exponential function** is its own derivative. And $(\\sin x)' = \\cos x$: a point on the unit circle always moves at right angles to the radius."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: sim
    prompt: "Curve $y = e^x$: where does the tangent have slope e ≈ 2.72?"
    params:
      scene: tangent
      expr: exp(x)
      controls:
        h:
          value: 0.5
        x:
          value: -1
      show:
        - secant
        - slope
    answer:
      slope:
        - 2.7
        - 2.75
    explanation: At x = 1. Slope and height are equal everywhere – that is exactly what $(e^x)' = e^x$ means.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux the power rule: why does $x^n$ have the derivative $n x^{n-1}$?"
    params:
      keywords:
        - - n faktoren
          - n factors
          - n-mal
          - n times
          - jeder faktor
          - each factor
        - - klein
          - winzig
          - tiny
          - small
        - - exponent
          - hochzahl
          - power
          - eins weniger
          - one less
      sample: "(x + h)ⁿ has n factors. For tiny h only the terms where exactly one factor gives h matter: that happens in n ways and gives n · xⁿ⁻¹ · h. Divided by h, n xⁿ⁻¹ remains – the exponent is one less."
    explanation: "By the binomial theorem: $(x + h)^n = x^n + n x^{n-1} h + \\dots$ All later terms contain h² and vanish."
    difficulty: 3

srs:
  cards_from: [hoch-drei, anwenden]
