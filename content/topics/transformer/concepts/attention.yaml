id: ai.transformers.attention
type: concept
title: Aufmerksamkeit
summary: Welches Wort auf welches schaut.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: sie
    widget: choice
    body: "»Die Katze jagte die Maus, weil sie hungrig war.«"
    prompt: Auf welches Wort bezieht sich »sie«?
    params:
      options:
        - { label: Katze, correct: true }
        - { label: Maus, feedback: "Wer jagt, weil er hungrig ist?" }
    hints:
      - Wer hat einen Grund zu jagen?
    explanation: Um »sie« zu verstehen, muss man auf »Katze« schauen – genau das macht Attention.

  - kind: explain
    id: s2
    body: |
      **Attention** lässt jedes Token prüfen, welche anderen Tokens für es wichtig sind. Es verteilt **Gewichte**, die zusammen 1 ergeben, und mischt die Informationen entsprechend.

  - kind: problem
    id: gewichte
    widget: numeric
    prompt: Das Wort »sie« verteilt Aufmerksamkeit – 0,7 auf »Katze« und 0,2 auf »Maus«. Wie viel bleibt für alle übrigen Wörter?
    params: { placeholder: "Gewicht" }
    answer: { value: 0.1 }
    hints:
      - Alle Gewichte zusammen ergeben 1.
    explanation: 1 − 0,7 − 0,2 = 0,1.

  - kind: problem
    id: bank
    widget: choice
    body: "»Ich setze mich auf die Bank im Park.«"
    prompt: Welches Wort hilft dem Modell am meisten, »Bank« richtig zu deuten?
    params:
      options:
        - { label: Park, correct: true }
        - { label: Ich, feedback: "»Ich« passt zu Sitzbank und Geldbank gleichermaßen." }
    hints:
      - Geldinstitut oder Sitzgelegenheit?
    explanation: Attention holt sich den Zusammenhang – im Park steht eine Sitzbank.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "[[Attention]] lässt jedes Token prüfen, welche anderen wichtig sind. Es verteilt [[Gewichte]], die zusammen 1 ergeben."
      distractors:
        - Training
        - Fehler

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Drei Tokens haben für eine Anfrage die Rohwerte 2, 1 und 0. Vereinfacht: Die Gewichte sind proportional zu 4, 2 und 1. Wie viel Aufmerksamkeit bekommt das erste Token? Als Bruch."
    answer:
      value: 4/7
    hints:
      - Die Gewichte müssen zusammen 1 ergeben.
    explanation: 4 von 7. Diese Normierung heißt **Softmax** – sie macht aus beliebigen Zahlen eine Verteilung.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Ein Token verteilt seine Aufmerksamkeit: 0,7 auf ein Wort mit Wert 10, 0,2 auf eins mit Wert 0 und 0,1 auf eins mit Wert 5. Was ist die gewichtete Mischung?"
    answer:
      value: 7.5
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 5
        misconception: unweighted
        text: Das ist der einfache Mittelwert. Die Gewichte sollen zählen.
    hints:
      - Multipliziere jeden Wert mit seinem Gewicht.
      - 7 + 0 + 0,5 = ?
    explanation: "7,5. **Attention** ist im Kern ein gewichteter Mittelwert: Die Gewichte sagen, wie wichtig jedes Token gerade ist. In echten Modellen sind die Werte lange Vektoren."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Query und Key haben das Skalarprodukt 8. Die Vektoren haben je 16 Zahlen. Vor dem Softmax teilt man durch √16. Welche Zahl geht in den Softmax?
    answer:
      value: 2
    hints:
      - √16 = 4.
      - 8 / 4 = ?
    explanation: Ohne diese **Skalierung** würden Skalarprodukte bei langen Vektoren riesig. Softmax würde dann fast alles auf ein einziges Token setzen, und das Lernen stockt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Attention arbeitet mit **Query**, **Key** und **Value**. Welches Bild beschreibt das am besten?
    params:
      options:
        - label: "Eine weiche Datenbankabfrage: Die Frage wird mit allen Schlüsseln verglichen, die Inhalte werden nach Passung gemischt"
          correct: true
        - label: Ein Wörterbuch mit genau einem Treffer
          feedback: Es gibt nicht einen Treffer, sondern eine gewichtete Mischung.
        - label: Ein Zufallsgenerator
          feedback: Die Gewichte werden berechnet, nicht gewürfelt.
    hints:
      - Jedes Token stellt eine Frage und bietet eine Antwort an.
    explanation: Weil alles differenzierbar ist, lernt das Modell selbst, welche Fragen und Schlüssel nützlich sind.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Drei Tokens haben die Scores 2, 0 und 0. Ihre Werte sind 10, 0 und 0. Berechne die Ausgabe mit Softmax-Gewichten (e² ≈ 7,39). Auf zwei Stellen.
    answer:
      value: 7.87
      tolerance: 0.03
    feedback:
      - when: numval(state.input) == 10
        misconception: hard-max
        text: Softmax gibt nicht alles dem Besten – die anderen bekommen auch etwas.
    hints:
      - "Gewichte: 7,39 / (7,39 + 1 + 1) ≈ 0,787 für das erste Token."
      - Ausgabe = 0,787 · 10 + 0 + 0.
    explanation: "≈ 7,87. Softmax ist eine **weiche** Auswahl: das wichtigste Token dominiert, die anderen tragen etwas bei. So bleibt alles ableitbar und damit lernbar."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Beim Training eines Sprachmodells darf ein Token nur auf frühere Tokens schauen, nie auf spätere. Warum?
    params:
      options:
        - label: Sonst könnte es das nächste Wort einfach abschreiben, statt es vorherzusagen.
          correct: true
        - label: Weil spätere Tokens unwichtig sind.
          feedback: Beim Verstehen sind sie oft sehr wichtig – nur beim Vorhersagen wären sie Schummeln.
        - label: Um Speicher zu sparen.
          feedback: Die Maske spart kaum Speicher – sie verhindert, dass das Modell die Antwort sieht.
    hints:
      - Was soll das Modell an jeder Stelle lernen?
      - Wer das nächste Wort sehen kann, muss es nicht vorhersagen.
    explanation: Diese **kausale Maske** setzt die Scores zu späteren Tokens auf −∞, ihr Softmax-Gewicht wird 0. So kann man alle Positionen eines Textes gleichzeitig trainieren, ohne zu schummeln.
    difficulty: 3

srs:
  cards_from: [sie, gewichte]
