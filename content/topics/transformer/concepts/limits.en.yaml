id: ai.transformers.limits
type: concept
title: Limits of the Architecture
summary: Cost, context, and open questions.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: quadrat
    widget: numeric
    prompt: In attention, every token compares itself with every other token. The text becomes {{k}} times as long. How many times more comparisons are needed?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Every token with every other one. That grows with the square.
    hints:
      - "{{k}} times as many tokens, each looking at {{k}} times as many others."
    explanation: "{{k}}² = {{k * k}}. That is why very long texts are expensive."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 2 }

  - kind: explain
    id: s2
    body: |
      Transformers are powerful, but not all-knowing. They have a limited **context window**, no direct access to new facts, and often calculate inaccurately without tools.

  - kind: problem
    id: gut
    widget: buckets
    prompt: Strength or weakness of a plain language model?
    params:
      buckets: [{ label: strength }, { label: weakness }]
      items:
        - { label: Rephrasing texts, bucket: strength }
        - { label: Translating between languages, bucket: strength }
        - { label: Exact math with large numbers, bucket: weakness }
        - { label: Today's knowledge without search, bucket: weakness }
    hints:
      - What relates to language patterns, and what to exact facts?
    explanation: With tools such as a calculator and search, modern systems make up for these weaknesses.

  - kind: problem
    id: werkzeug
    widget: choice
    prompt: How does a language model reliably get the result of 4837 · 9281?
    params:
      options:
        - { label: It calls a calculator as a tool., correct: true }
        - { label: It guesses from training., feedback: "Guessing often gives wrong digits with large numbers." }
    hints:
      - What does a person do with a task like this?
    explanation: Good systems combine language with exact tools.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: How does a very long context often affect a language model?
    params:
      options:
        - label: It tends to overlook details in the middle – beginning and end weigh more
          correct: true
        - label: It gets ever more precise
          feedback: More text also means more distraction.
        - label: It forgets its name
          feedback: That is not the point.
    hints:
      - Attention is limited – for machines too.
    explanation: Important things belong at the beginning or the end of a prompt.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: A language model writes token by token. It makes a mistake at the start of a calculation. What typically happens?
    params:
      options:
        - label: The mistake stays, and everything after builds on it.
          correct: true
        - label: It deletes the mistake at once.
          feedback: Written tokens stay – at most it can notice and fix the mistake later.
        - label: The mistake has no consequences.
          feedback: Every new token depends on all earlier ones.
    hints:
      - Can the model change a token it already wrote?
      - What does it look at for the next token?
    explanation: "Generation is autoregressive: every token becomes part of the input. That is why it helps when models check intermediate steps or use tools."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: what does attention do in a language model?"
    params:
      keywords:
        - - wort
          - token
          - word
        - - wichtig
          - relevant
          - passend
          - important
          - relevant
        - - gewicht
          - weight
          - anteil
        - - beziehen
          - kontext
          - zusammenhang
          - context
          - relate
          - bezug
          - refer
      min: 3
      sample: Attention lets every word check which other words in the text are important for it. It distributes weights over them and mixes in their information – that is how the model understands words in context.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: How do people try to reduce the quadratic cost of attention for very long texts?
    params:
      options:
        - label: Each token looks only at some of the others, such as a nearby window.
          correct: true
        - label: You drop attention entirely.
          feedback: Without attention the tokens cannot exchange information.
        - label: You use faster computers – then it is no longer quadratic.
          feedback: Faster hardware does not change the maths, only the speed.
    hints:
      - "Quadratic means: every token with every other."
      - What if you no longer compare every pair?
    explanation: "Windows, sparse patterns or approximations save compute. The price: distant connections get lost more easily. Many models therefore combine several tricks."
    difficulty: 3

srs:
  cards_from: [quadrat, gut]
