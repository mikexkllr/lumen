id: ai.transformers.training
type: concept
title: Wie Transformer lernen
summary: Das nächste Wort vorhersagen – Billionen Mal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Billionen kleine Schritte
    body: "Niemand bringt einem Sprachmodell Grammatik oder Fakten bei. Es lernt aus einem einzigen Spiel: dem **nächsten Wort**. Deck die Stationen auf: Wie läuft eine Runde ab?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🔮
            front: Raten
            back: Das Modell liest »Der Himmel ist …« und tippt auf »grün«.
          - icon: 📏
            front: Vergleichen
            back: Im Text stand »blau«. Der Fehler wird gemessen.
          - icon: 🔧
            front: Anpassen
            back: Milliarden Gewichte rücken ein winziges Stück in Richtung »blau«.
          - icon: 📚
            front: Nächster Satz
            back: Weiter mit dem nächsten Wort – Billionen Mal.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Jahre müsste ein Mensch ohne Pause lesen, um so viel Text zu schaffen, wie ein großes Sprachmodell im Training sieht?"
    params:
      min: 1
      max: 10000000
      scale: log
    answer:
      value: 50000
      within: 90
    explanation: Grob 50 000 Jahre. Aus dieser Menge lernt das Modell – Wort für Wort.

  - kind: explain
    id: s1
    body: |
      Im **Vortraining** sieht das Modell riesige Textmengen und rät immer das nächste Token. Jeder Fehler verschiebt Milliarden Gewichte ein klein wenig. Aus dieser simplen Aufgabe entstehen Grammatik, Wissen und Schlussfolgern.

  - kind: problem
    id: menge
    widget: numeric
    prompt: Ein Modell liest {{t}} Billionen Tokens. Ein Mensch liest im Leben etwa eine Milliarde Wörter. Wievielmal mehr ist das ungefähr?
    params: { unit: "-mal" }
    answer: { value: "{{t * 1000}}" }
    hints:
      - Eine Billion sind tausend Milliarden.
    explanation: "{{t}} Billionen sind {{t * 1000}} Milliarden – {{t * 1000}}-mal ein Leseleben."
    variants:
      params: { t: "int[2,15]" }
      defaults: { t: 10 }

  - kind: problem
    id: erfinden
    widget: choice
    prompt: Sprachmodelle erfinden manchmal Fakten, die echt klingen. Warum?
    params:
      options:
        - { label: "Sie lernen, was wahrscheinlich klingt – nicht, was wahr ist.", correct: true }
        - { label: Sie lügen absichtlich., feedback: "Es gibt keine Absicht – nur Wahrscheinlichkeiten." }
    hints:
      - Was genau wurde im Training belohnt?
    explanation: Was gut klingt, ist meist wahr – aber eben nicht immer.

  - kind: problem
    id: phasen
    widget: order
    prompt: Bring die Trainingsphasen eines Chatbots in die richtige Reihenfolge.
    params:
      items:
        - { label: Vortraining auf riesigen Textmengen }
        - { label: Feinschliff mit Beispieldialogen }
        - { label: Bestärkendes Lernen mit Bewertungen }
    hints:
      - Erst die breite Basis, dann das Verhalten.
    explanation: Aus einem Textvervollständiger wird so ein hilfreicher Assistent.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Modell hat 100 Milliarden Gewichte, jedes mit 2 Bytes gespeichert. Wie viele Gigabyte braucht es?
    params:
      unit: GB
    answer:
      value: 200
    hints:
      - 100 Milliarden mal 2 Bytes.
    explanation: 200 GB. Darum laufen große Modelle in Rechenzentren und nicht auf dem Handy.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Faustregel: Training kostet etwa 6 · N · D Rechenschritte (N Gewichte, D Tokens). Mit N = 10⁹ und D = 2 · 10¹⁰: Wie viel mal 10²⁰ ist das?"
    answer:
      value: 1.2
      tolerance: 0.01
    hints:
      - 6 · 2 = 12 und 10⁹ · 10¹⁰ = 10¹⁹.
      - 12 · 10¹⁹ = 1,2 · 10²⁰.
    explanation: Rund 1,2 · 10²⁰. Doppelte Größe oder doppelte Daten verdoppeln die **Rechenkosten**. Darum ist die Wahl von N und D bei festem Budget so wichtig.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Was hilft beim Vortraining oft mehr als einfach noch mehr Text?
    params:
      options:
        - label: "Bessere Daten: Doppeltes entfernen, Müll filtern, gute Quellen bevorzugen."
          correct: true
        - label: Den Text rückwärts lesen lassen.
          feedback: Die Leserichtung ist nicht das Problem.
        - label: Nur Text aus einem einzigen Buch.
          feedback: Dann fehlt die Vielfalt.
    hints:
      - Was lernt ein Modell aus tausend Kopien derselben Seite?
      - Schlechte Daten kosten Rechenzeit und schaden.
    explanation: "**Datenqualität** zählt enorm. Doppelte Texte fördern Auswendiglernen, Müll verschwendet Rechenzeit. Viel Arbeit beim Bau großer Modelle steckt im Aufbereiten der Daten."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Nach dem Vortraining kann ein Modell Text fortsetzen, verhält sich aber nicht wie ein hilfreicher Assistent. Was fehlt?
    params:
      options:
        - label: Feinabstimmung auf Dialoge und menschliche Bewertungen – erst sie formt das Verhalten
          correct: true
        - label: Mehr Rechenleistung
          feedback: Es fehlt nicht Kraft, sondern Ausrichtung.
        - label: Ein Internetzugang
          feedback: Das ist ein Werkzeug, kein Trainingsschritt.
    hints:
      - Das Internet besteht nicht nur aus hilfreichen Antworten.
    explanation: "Vortraining liefert Wissen, **Feinabstimmung** den Charakter: hilfreich, ehrlich, vorsichtig."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Was sagen »Skalierungsgesetze« über Sprachmodelle?
    params:
      options:
        - label: Der Vorhersagefehler sinkt recht gleichmäßig mit mehr Rechenleistung, Daten und Größe.
          correct: true
        - label: Jede Verdopplung verdoppelt die Intelligenz.
          feedback: Der Fehler sinkt immer langsamer – und »Intelligenz« ist keine gemessene Größe.
        - label: Ab einer bestimmten Größe wird jedes Modell fehlerfrei.
          feedback: Die Kurven nähern sich einer Untergrenze, erreichen null aber nie.
    hints:
      - Die Gesetze beschreiben den Fehler beim Vorhersagen des nächsten Tokens.
      - Auf doppelt-logarithmischem Papier sind es fast Geraden.
    explanation: "Die Messungen folgen **Potenzgesetzen**: Jede Verzehnfachung bringt eine ähnliche Verbesserung. Wann welche Fähigkeit auftaucht, sagen sie aber schlecht voraus."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Sprachmodell beim Vortraining lernt.
    params:
      keywords:
        - - nächst
          - next
        - - token
          - wort
          - word
        - - fehler
          - korrigier
          - gewicht
          - error
          - correct
          - weight
      sample: Das Modell liest riesige Mengen Text und rät immer das nächste Token. Liegt es daneben, werden seine Gewichte ein wenig korrigiert. Nach Billionen solcher Schritte hat es viel über Sprache und Welt gelernt.
    difficulty: 3

srs:
  cards_from: [erfinden, phasen]
