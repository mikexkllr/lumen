id: ai.transformers.training
type: concept
title: Wie Transformer lernen
summary: Das nächste Wort vorhersagen – Billionen Mal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Jahre müsste ein Mensch ohne Pause lesen, um so viel Text zu schaffen, wie ein großes Sprachmodell im Training sieht?"
    params:
      min: 1
      max: 10000000
      scale: log
    answer:
      value: 50000
      within: 90
    explanation: Grob 50 000 Jahre. Aus dieser Menge lernt das Modell – Wort für Wort.

  - kind: explain
    id: s1
    body: |
      Im **Vortraining** sieht das Modell riesige Textmengen und rät immer das nächste Token. Jeder Fehler verschiebt Milliarden Gewichte ein klein wenig. Aus dieser simplen Aufgabe entstehen Grammatik, Wissen und Schlussfolgern.

  - kind: problem
    id: menge
    widget: numeric
    prompt: Ein Modell liest {{t}} Billionen Tokens. Ein Mensch liest im Leben etwa eine Milliarde Wörter. Wievielmal mehr ist das ungefähr?
    params: { unit: "-mal" }
    answer: { value: "{{t * 1000}}" }
    hints:
      - Eine Billion sind tausend Milliarden.
    explanation: "{{t}} Billionen sind {{t * 1000}} Milliarden – {{t * 1000}}-mal ein Leseleben."
    variants:
      params: { t: "int[2,15]" }
      defaults: { t: 10 }

  - kind: problem
    id: erfinden
    widget: choice
    prompt: Sprachmodelle erfinden manchmal Fakten, die echt klingen. Warum?
    params:
      options:
        - { label: "Sie lernen, was wahrscheinlich klingt – nicht, was wahr ist.", correct: true }
        - { label: Sie lügen absichtlich., feedback: "Es gibt keine Absicht – nur Wahrscheinlichkeiten." }
    hints:
      - Was genau wurde im Training belohnt?
    explanation: Was gut klingt, ist meist wahr – aber eben nicht immer.

  - kind: problem
    id: phasen
    widget: order
    prompt: Bring die Trainingsphasen eines Chatbots in die richtige Reihenfolge.
    params:
      items:
        - { label: Vortraining auf riesigen Textmengen }
        - { label: Feinschliff mit Beispieldialogen }
        - { label: Bestärkendes Lernen mit Bewertungen }
    hints:
      - Erst die breite Basis, dann das Verhalten.
    explanation: Aus einem Textvervollständiger wird so ein hilfreicher Assistent.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Modell hat 100 Milliarden Gewichte, jedes mit 2 Bytes gespeichert. Wie viele Gigabyte braucht es?
    params:
      unit: GB
    answer:
      value: 200
    hints:
      - 100 Milliarden mal 2 Bytes.
    explanation: 200 GB. Darum laufen große Modelle in Rechenzentren und nicht auf dem Handy.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Nach dem Vortraining kann ein Modell Text fortsetzen, verhält sich aber nicht wie ein hilfreicher Assistent. Was fehlt?
    params:
      options:
        - label: Feinabstimmung auf Dialoge und menschliche Bewertungen – erst sie formt das Verhalten
          correct: true
        - label: Mehr Rechenleistung
          feedback: Es fehlt nicht Kraft, sondern Ausrichtung.
        - label: Ein Internetzugang
          feedback: Das ist ein Werkzeug, kein Trainingsschritt.
    hints:
      - Das Internet besteht nicht nur aus hilfreichen Antworten.
    explanation: "Vortraining liefert Wissen, **Feinabstimmung** den Charakter: hilfreich, ehrlich, vorsichtig."
    difficulty: 3

srs:
  cards_from: [erfinden, phasen]
