id: ai.transformers.limits
type: concept
title: Grenzen der Architektur
summary: Kosten, Kontext und offene Fragen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Genial und doch blind
    body: "Transformer schreiben Gedichte und Code. Trotzdem stolpern sie manchmal über erstaunlich einfache Dinge. Deck die Karten auf: Wo liegen ihre **Grenzen**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🔁
            front: Der Umkehrfluch
            back: Ein Modell weiß, wer die Mutter eines Stars ist – aber oft nicht, wessen Mutter diese Frau ist.
          - icon: 📅
            front: Das Gestern
            back: Was nach dem Training passiert ist, kennt ein reines Sprachmodell nicht.
          - icon: 🎲
            front: Mal so, mal so
            back: Dieselbe Frage, zweimal gestellt – und zwei verschiedene Antworten.
          - icon: 🧩
            front: Ganz neue Rätsel
            back: Bei Aufgaben, die anders sind als alles im Training, versagen Modelle oft plötzlich.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: Bei Attention vergleicht jedes Token jedes andere. Der Text wird {{k}}-mal so lang. Wievielmal mehr Vergleiche sind nötig?
    params: { unit: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Jedes Token mit jedem – das wächst mit dem Quadrat.
    hints:
      - "{{k}}-mal so viele Tokens, die je {{k}}-mal so viele andere ansehen."
    explanation: "{{k}}² = {{k * k}} – darum sind sehr lange Texte teuer."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 2 }

  - kind: explain
    id: s2
    body: |
      Transformer sind mächtig, aber nicht allwissend. Sie haben ein begrenztes **Kontextfenster**, keinen direkten Zugang zu neuen Fakten und rechnen ohne Werkzeuge oft ungenau.

  - kind: problem
    id: gut
    widget: buckets
    prompt: Stärke oder Schwäche eines reinen Sprachmodells?
    params:
      buckets: [{ label: Stärke }, { label: Schwäche }]
      items:
        - { label: Texte umformulieren, bucket: Stärke }
        - { label: Zwischen Sprachen übersetzen, bucket: Stärke }
        - { label: Exakt mit großen Zahlen rechnen, bucket: Schwäche }
        - { label: Wissen von heute ohne Suche, bucket: Schwäche }
    hints:
      - Was hat mit Sprachmustern zu tun, was mit exakten Fakten?
    explanation: Mit Werkzeugen wie Taschenrechner und Suche gleichen moderne Systeme Schwächen aus.

  - kind: problem
    id: werkzeug
    widget: choice
    prompt: Wie bekommt ein Sprachmodell zuverlässig das Ergebnis von 4837 · 9281?
    params:
      options:
        - { label: Es ruft einen Rechner als Werkzeug auf., correct: true }
        - { label: Es rät aus dem Training., feedback: "Raten liefert bei großen Zahlen oft falsche Ziffern." }
    hints:
      - Was macht ein Mensch bei so einer Aufgabe?
    explanation: Gute Systeme kombinieren Sprache mit exakten Werkzeugen.

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: "Bei Attention schaut jedes Token auf jedes. Ein Feld ist ein Vergleich: Die Zeile schaut auf die Spalte. Markiere alle Vergleiche für die **ersten 3** Tokens."
    params:
      rows: 6
      cols: 6
      counter: true
    answer:
      pattern:
        - "###..."
        - "###..."
        - "###..."
        - ......
        - ......
        - ......
    hints:
      - Die ersten 3 Tokens sind die ersten 3 Zeilen – und sie schauen nur auf die ersten 3 Spalten.
      - "Markiere das Quadrat oben links: 3 · 3 = 9 Felder."
    explanation: Für 3 Tokens sind es 9 Vergleiche, für alle 6 schon 36. Doppelte Länge heißt vierfache Arbeit.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Wie wirkt sich ein sehr langer Kontext auf ein Sprachmodell oft aus?
    params:
      options:
        - label: Es übersieht eher Details in der Mitte – Anfang und Ende wirken stärker
          correct: true
        - label: Es wird immer genauer
          feedback: Mehr Text heißt auch mehr Ablenkung.
        - label: Es vergisst seinen Namen
          feedback: Darum geht es nicht.
    hints:
      - Aufmerksamkeit ist begrenzt – auch bei Maschinen.
    explanation: Wichtiges gehört an den Anfang oder das Ende eines Prompts.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Ein Sprachmodell schreibt Token für Token. Am Anfang einer Rechnung macht es einen Fehler. Was passiert typischerweise?
    params:
      options:
        - label: Der Fehler bleibt stehen, und alles danach baut darauf auf.
          correct: true
        - label: Es löscht den Fehler sofort.
          feedback: Geschriebene Tokens bleiben – es kann höchstens später einen Fehler bemerken und korrigieren.
        - label: Der Fehler hat keine Folgen.
          feedback: Jedes neue Token hängt von allen früheren ab.
    hints:
      - Kann das Modell ein bereits geschriebenes Token ändern?
      - Worauf schaut es beim nächsten Token?
    explanation: "Die Erzeugung ist **autoregressiv**: Jedes Token wird Teil der Eingabe. Darum hilft es, wenn Modelle Zwischenschritte prüfen oder Werkzeuge nutzen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was macht Attention in einem Sprachmodell?"
    params:
      keywords:
        - - wort
          - token
          - word
        - - wichtig
          - relevant
          - passend
          - important
          - relevant
        - - gewicht
          - weight
          - anteil
        - - beziehen
          - kontext
          - zusammenhang
          - context
          - relate
          - bezug
          - refer
      min: 3
      sample: Attention lässt jedes Wort prüfen, welche anderen Wörter im Text für es wichtig sind. Es verteilt Gewichte auf sie und mischt ihre Information ein – so versteht das Modell Wörter im Kontext.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Wie versucht man, die quadratischen Kosten der Attention bei sehr langen Texten zu senken?
    params:
      options:
        - label: Jedes Token schaut nur auf einen Teil der anderen, etwa ein Fenster in der Nähe.
          correct: true
        - label: Man lässt Attention ganz weg.
          feedback: Ohne Attention fehlt der Austausch zwischen den Tokens.
        - label: Man nimmt schnellere Computer – dann ist es nicht mehr quadratisch.
          feedback: Schnellere Hardware ändert die Rechnung nicht, nur das Tempo.
    hints:
      - "Quadratisch heißt: jedes Token mit jedem."
      - Was, wenn man nicht mehr jedes Paar vergleicht?
    explanation: "Fenster, **dünn besetzte** Muster oder Näherungen sparen Rechenzeit. Der Preis: Weit entfernte Zusammenhänge gehen leichter verloren. Viele Modelle kombinieren darum mehrere Tricks."
    difficulty: 3

srs:
  cards_from: [quadrat, gut]
