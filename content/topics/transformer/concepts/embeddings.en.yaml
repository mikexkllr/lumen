id: ai.transformers.embeddings
type: concept
title: Words as Vectors
summary: Meaning as direction in space.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Words as arrows
    body: To a language model, every word is an arrow, an **embedding**. Here, “dog” and “apple” already point their way. Drag “cat” and “banana” to where you think they belong.
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 7
        y:
          - 0
          - 6
        showCoordinates: false
        points:
          - id: o
            x: 0
            y: 0
            draggable: false
            label: "0"
          - id: hund
            x: 1
            y: 5
            draggable: false
            label: dog
          - id: apfel
            x: 5
            y: 1
            draggable: false
            label: apple
          - id: katze
            x: 3
            y: 2
            label: cat
          - id: banane
            x: 2
            y: 3
            label: banana
        segments:
          - - o
            - hund
          - - o
            - apfel
          - - o
            - katze
          - - o
            - banane

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: with how many numbers does a large language model describe a single token?"
    params:
      min: 2
      max: 100000
      scale: log
    answer:
      value: 4000
      within: 75
    explanation: Several thousand. In that many dimensions there is room for countless fine distinctions of meaning.

  - kind: explain
    id: s1
    body: |
      A language model turns each token into a long vector of numbers, an **embedding**. Words with similar meanings point in similar directions. "Dog" lies close to "cat" and far from "tax return."

  - kind: problem
    id: nah
    widget: choice
    prompt: Which word is probably closest to "car" in embedding space?
    params:
      options:
        - { label: vehicle, correct: true }
        - { label: banana, feedback: "Bananas appear in very different texts." }
        - { label: poem, feedback: "Similar means appearing in similar contexts." }
    hints:
      - Which word shows up in similar sentences?
    explanation: Embeddings learn meaning from the context in which words appear.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: "A famous example: king − man + woman gives, in embedding space, roughly …"
    params:
      options:
        - { label: queen, correct: true }
        - { label: prince, feedback: "The direction from male to female was just added." }
        - { label: man, feedback: "Man was subtracted, not added." }
    hints:
      - Which direction was subtracted, and which was added?
    explanation: Differences in meaning become directions that you can calculate with.

  - kind: problem
    id: aehnlich
    widget: numeric
    prompt: "Similarity is often measured with the dot product. What is (1, 2) · (3, 4) = 1 · 3 + 2 · 4?"
    params: { placeholder: "Number" }
    answer: { value: 11 }
    hints:
      - 3 + 8.
    explanation: 11. A large dot product means the vectors point in a similar direction.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Cosine similarity is the dot product divided by both lengths. What is it for (3, 4) and (4, 3)?
    answer:
      value: 0.96
    hints:
      - Dot product 24, both lengths 5.
    explanation: 24 ÷ 25 = 0.96 – almost the same direction. 1 would mean identical, 0 unrelated.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Toy vectors with two numbers: king (5, 1), man (4, 0), woman (4, 2). Compute king − man + woman. What is the **second** number of the result?"
    answer:
      value: 3
    hints:
      - "Compute each position separately: 1 − 0 + 2."
      - The first position is 5 − 4 + 4 = 5.
    explanation: Result (5, 3). The difference woman − man = (0, 2) is a direction in the space. Added to king, it lands near queen. In real models this only works approximately.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Nobody taught the embeddings what “female” or “capital city” means. How do such directions arise?
    params:
      options:
        - label: Words that appear in similar contexts get similar vectors – the structure emerges by itself
          correct: true
        - label: From a built-in dictionary
          feedback: There is none – only text.
        - label: Developers define every direction
          feedback: With thousands of dimensions that would be impossible.
    hints:
      - “You shall know a word by the company it keeps.”
    explanation: The **distributional hypothesis** of linguistics from 1957 – today the foundation of all language models.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: At the start "bank" always has the same vector. What happens to it in the transformer's layers?
    params:
      options:
        - label: Attention changes it depending on the sentence – "bench in the park" and "bank with interest" end up different.
          correct: true
        - label: It stays the same in all layers.
          feedback: Then the model could never tell the two meanings apart.
        - label: It is deleted.
          feedback: It is not deleted but enriched with information from the sentence.
    hints:
      - Why does each token look at the others?
      - What does "park" contribute to the meaning of "bank"?
    explanation: The fixed word vector becomes a context-dependent vector. That is the advance over older word vectors with just one vector per word.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what an embedding is.
    params:
      keywords:
        - - vektor
          - zahlen
          - liste
          - vector
          - numbers
          - list
        - - bedeutung
          - ähnlich
          - meaning
          - similar
        - - richtung
          - nah
          - raum
          - direction
          - close
          - space
      sample: An embedding is a long list of numbers, a vector, for a word or token. Words with similar meaning point in similar directions and lie close together in the space.
    difficulty: 3

srs:
  cards_from: [nah, rechnen]
