id: ai.transformers.layers
type: concept
title: Layer by Layer
summary: How a transformer is built.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A look inside the tower
    body: "A language model is a tower of many **layers**. For a long time, nobody knew what happens inside. Uncover the cards: what have researchers found in there?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧱
            front: A hundred floors
            back: Large models often stack around a hundred identically built layers.
          - icon: 🔤
            front: "Low down: grammar"
            back: Early layers tend to track word types and sentence structure.
          - icon: 🌉
            front: A feature for one bridge
            back: Researchers found a feature inside a model just for the Golden Gate Bridge.
          - icon: 📚
            front: Facts in the middle
            back: Much factual knowledge seems to sit in the middle layers.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the processing steps in a language model in the right order.
    params:
      items:
        - { label: Split the text into tokens }
        - { label: Convert tokens into embeddings }
        - { label: Many attention layers process them }
        - { label: Probabilities for the next token }
    hints:
      - A prediction comes at the end.
    explanation: Dozens of layers refine the understanding step by step.

  - kind: explain
    id: s2
    body: |
      A **transformer** stacks many identical layers. Each layer has attention and a small neural network. Early layers tend to capture grammar, and later ones meaning and context.

  - kind: problem
    id: parallel
    widget: choice
    prompt: What was the big advantage of transformers over older language models?
    params:
      options:
        - { label: They process all the words of a text at once., correct: true }
        - { label: They need no data., feedback: "Quite the opposite. They need huge amounts of data." }
    hints:
      - Older models read word by word, one after another.
    explanation: Parallel computing fits graphics chips perfectly. That made huge models possible.

  - kind: problem
    id: koepfe
    widget: numeric
    prompt: A layer has {{h}} attention heads, and the model has {{l}} layers. How many heads are there in total?
    params: { unit: heads }
    answer: { value: "{{h * l}}" }
    hints:
      - Heads per layer times layers.
    explanation: "{{h}} · {{l}} = {{h * l}}. Each one attends to different relationships."
    variants:
      params: { h: "choice[8,12,16]", l: "choice[12,24,32]" }
      defaults: { h: 12, l: 24 }

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: What is inside every layer of a transformer?
    params:
      buckets:
        - id: b1
          label: Part of every layer
        - id: b2
          label: Not part of it
      items:
        - label: Attention
          bucket: b1
        - label: A small neural network
          bucket: b1
        - label: A database of facts
          bucket: b2
        - label: A search engine
          bucket: b2
    hints:
      - Every layer is built the same – from two parts.
    explanation: The knowledge is in the weights, not in a database.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Attention handles all tokens at once – without order. How then does the model know that “dog bites man” differs from “man bites dog”?
    params:
      options:
        - label: Every token additionally gets a marker for its position
          correct: true
        - label: It does not know
          feedback: Without position information both sentences would be identical – that is why it is added.
        - label: It secretly reads left to right
          feedback: Processing is parallel.
    hints:
      - A position vector is added to the word vector.
    explanation: "**Positional encoding** – without it a text would be just an unordered bag of words to the model."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: A layer has several attention heads. What does that bring?
    params:
      options:
        - label: Each head can attend to a different kind of relation – such as grammar or references.
          correct: true
        - label: They all compute the same thing, for safety.
          feedback: Each head has its own weights and learns something different.
        - label: Only one is used; the others are spares.
          feedback: All are used at once and their results combined.
    hints:
      - A word stands in many relations at once.
      - A single head mixes in only one way.
    explanation: Multiple heads look at different patterns in parallel. Researchers found heads that follow repetitions or link references. Not every head is that easy to interpret.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "The small network in a layer has two weight matrices: d × 4d and 4d × d, with d = 1024. How many million weights is that? To one decimal."
    answer:
      value: 8.4
      tolerance: 0.05
    hints:
      - "One matrix: 1024 · 4096 ≈ 4.19 million."
      - Two of them.
    explanation: 2 · 4 · d² = 8d² ≈ 8.4 million. Attention adds another 4d². So most of the parameters sit in these small networks.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In every layer the result is **added** to the input instead of replacing it. What are these “residual connections” for?
    params:
      options:
        - label: Signals and learning impulses can flow unhindered through hundreds of layers
          correct: true
        - label: They save memory
          feedback: They actually need slightly more.
        - label: They prevent hallucinations
          feedback: They have nothing to do with that.
    hints:
      - Each layer only has to learn a small correction.
    explanation: Without them the learning signal vanishes in deep networks. Only this idea made truly deep models trainable.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Attention has four matrices of size d × d: for query, key, value and output. How many million weights is that for d = 1024? To one decimal."
    answer:
      value: 4.2
      tolerance: 0.05
    hints:
      - d² = 1,048,576.
      - 4 · d² = ?
    explanation: 4d² ≈ 4.2 million. With the small network it is about 12d² per layer. A model with 96 layers and d = 12,288 thus reaches roughly 175 billion weights.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what happens in one layer of a transformer.
    params:
      keywords:
        - - attention
          - aufmerksamkeit
        - - netz
          - mlp
          - feedforward
          - network
        - - addier
          - residual
          - behält
          - add
          - keep
      sample: First attention mixes information between the tokens. Then a small network processes each token on its own. Both results are added to the input, so nothing gets lost.
    difficulty: 3

srs:
  cards_from: [ablauf, parallel]
