id: ai.transformers.layers
type: concept
title: Schicht für Schicht
summary: Der Aufbau eines Transformers.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Blick in den Turm
    body: "Ein Sprachmodell ist ein Turm aus vielen **Schichten**. Lange wusste niemand, was darin passiert. Deck die Karten auf: Was haben Forscher im Inneren entdeckt?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧱
            front: Hundert Stockwerke
            back: Große Modelle stapeln oft rund hundert gleich gebaute Schichten.
          - icon: 🔤
            front: "Unten: Grammatik"
            back: Frühe Schichten achten eher auf Wortarten und Satzbau.
          - icon: 🌉
            front: Ein Merkmal für eine Brücke
            back: Forscher fanden in einem Modell ein Merkmal nur für die Golden Gate Bridge.
          - icon: 📚
            front: Fakten in der Mitte
            back: Viel Faktenwissen scheint in den mittleren Schichten zu sitzen.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Verarbeitung in einem Sprachmodell in die richtige Reihenfolge.
    params:
      items:
        - { label: Text in Tokens zerlegen }
        - { label: Tokens in Embeddings umwandeln }
        - { label: Viele Attention-Schichten verarbeiten sie }
        - { label: Wahrscheinlichkeiten für das nächste Token }
    hints:
      - Am Ende steht eine Vorhersage.
    explanation: Dutzende Schichten verfeinern das Verständnis Stück für Stück.

  - kind: explain
    id: s2
    body: |
      Ein **Transformer** stapelt viele gleich gebaute Schichten. Jede Schicht hat Attention und ein kleines neuronales Netz. Frühe Schichten erfassen eher Grammatik, spätere eher Bedeutung und Zusammenhänge.

  - kind: problem
    id: parallel
    widget: choice
    prompt: Was war der große Vorteil von Transformern gegenüber älteren Sprachmodellen?
    params:
      options:
        - { label: Sie verarbeiten alle Wörter eines Textes gleichzeitig., correct: true }
        - { label: Sie brauchen keine Daten., feedback: "Im Gegenteil – sie brauchen riesige Datenmengen." }
    hints:
      - Ältere Modelle lasen Wort für Wort nacheinander.
    explanation: Parallel rechnen passt perfekt zu Grafikchips – so wurden riesige Modelle möglich.

  - kind: problem
    id: koepfe
    widget: numeric
    prompt: Eine Schicht hat {{h}} Attention-Köpfe, das Modell {{l}} Schichten. Wie viele Köpfe gibt es insgesamt?
    params: { unit: Köpfe }
    answer: { value: "{{h * l}}" }
    hints:
      - Köpfe pro Schicht mal Schichten.
    explanation: "{{h}} · {{l}} = {{h * l}} – jeder achtet auf andere Zusammenhänge."
    variants:
      params: { h: "choice[8,12,16]", l: "choice[12,24,32]" }
      defaults: { h: 12, l: 24 }

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Was steckt in jeder Schicht eines Transformers?
    params:
      buckets:
        - id: b1
          label: Teil jeder Schicht
        - id: b2
          label: Gehört nicht dazu
      items:
        - label: Attention
          bucket: b1
        - label: Ein kleines neuronales Netz
          bucket: b1
        - label: Eine Datenbank mit Fakten
          bucket: b2
        - label: Eine Suchmaschine
          bucket: b2
    hints:
      - Jede Schicht ist gleich gebaut – aus zwei Teilen.
    explanation: Das Wissen steckt in den Gewichten, nicht in einer Datenbank.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Attention behandelt alle Tokens gleichzeitig – ohne Reihenfolge. Woher weiß das Modell dann, dass »Hund beißt Mann« etwas anderes ist als »Mann beißt Hund«?
    params:
      options:
        - label: Jedes Token bekommt zusätzlich eine Markierung für seine Position
          correct: true
        - label: Es weiß es nicht
          feedback: Ohne Positionsangabe wären beide Sätze identisch – darum fügt man sie hinzu.
        - label: Es liest heimlich von links nach rechts
          feedback: Die Verarbeitung ist parallel.
    hints:
      - Zum Wortvektor kommt ein Positionsvektor.
    explanation: Die **Positionskodierung** – ohne sie wäre ein Text für das Modell nur ein ungeordneter Beutel Wörter.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Eine Schicht hat mehrere Attention-Köpfe. Was bringt das?
    params:
      options:
        - label: Jeder Kopf kann auf eine andere Art von Beziehung achten – etwa Grammatik oder Bezüge.
          correct: true
        - label: Sie rechnen alle dasselbe, zur Sicherheit.
          feedback: Jeder Kopf hat eigene Gewichte und lernt etwas anderes.
        - label: Nur einer wird benutzt, die anderen sind Ersatz.
          feedback: Alle werden gleichzeitig genutzt und ihre Ergebnisse kombiniert.
    hints:
      - Ein Wort steht in vielen Beziehungen zugleich.
      - Ein Kopf allein mischt nur auf eine Weise.
    explanation: "**Mehrere Köpfe** schauen parallel auf verschiedene Muster. Forscher fanden etwa Köpfe, die Wiederholungen folgen oder Satzbezüge verbinden. Nicht jeder Kopf ist so leicht zu deuten."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Das kleine Netz in einer Schicht hat zwei Gewichtsmatrizen: d × 4d und 4d × d, mit d = 1024. Wie viele Millionen Gewichte sind das? Auf eine Stelle."
    answer:
      value: 8.4
      tolerance: 0.05
    hints:
      - "Eine Matrix: 1024 · 4096 ≈ 4,19 Millionen."
      - Zwei davon.
    explanation: 2 · 4 · d² = 8d² ≈ 8,4 Millionen. Dazu kommen 4d² für Attention. Der Großteil der **Parameter** steckt also in diesen kleinen Netzen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In jeder Schicht wird das Ergebnis zum Eingang **addiert**, statt ihn zu ersetzen. Wozu dienen diese »Residualverbindungen«?
    params:
      options:
        - label: Signale und Lernimpulse können ungehindert durch Hunderte Schichten fließen
          correct: true
        - label: Sie sparen Speicher
          feedback: Sie brauchen sogar etwas mehr.
        - label: Sie verhindern Halluzinationen
          feedback: Damit haben sie nichts zu tun.
    hints:
      - Jede Schicht muss nur eine kleine Korrektur lernen.
    explanation: Ohne sie verschwindet das Lernsignal in tiefen Netzen. Erst diese Idee machte wirklich tiefe Modelle trainierbar.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Attention hat vier Matrizen der Größe d × d: für Query, Key, Value und Ausgabe. Wie viele Millionen Gewichte sind das bei d = 1024? Auf eine Stelle."
    answer:
      value: 4.2
      tolerance: 0.05
    hints:
      - d² = 1 048 576.
      - 4 · d² = ?
    explanation: 4d² ≈ 4,2 Millionen. Mit dem kleinen Netz sind es etwa **12d²** pro Schicht. Ein Modell mit 96 Schichten und d = 12 288 kommt so auf rund 175 Milliarden Gewichte.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was in einer Schicht eines Transformers passiert.
    params:
      keywords:
        - - attention
          - aufmerksamkeit
        - - netz
          - mlp
          - feedforward
          - network
        - - addier
          - residual
          - behält
          - add
          - keep
      sample: Erst mischt Attention Informationen zwischen den Tokens. Dann verarbeitet ein kleines Netz jedes Token einzeln. Beide Ergebnisse werden zum Eingang addiert, sodass nichts verloren geht.
    difficulty: 3

srs:
  cards_from: [ablauf, parallel]
