id: stats.testing.multiple
type: concept
title: Wer oft genug sucht
summary: Viele Tests, falsche Funde.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Gummibärchen unter Verdacht
    body: "Forscher testen, ob Gummibärchen Pickel machen – Farbe für Farbe, 20 Farben. In Wahrheit wirkt keine. Jede Ziehung ist ein Test mit der 5-%-Grenze. Zieh 20-mal: Wie oft jubelt trotzdem jemand über einen **Fund**?"
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: signifikant
            weight: 1
          - label: nichts
            weight: 19
        sample:
          - 1
          - 20
          - 100

  - kind: problem
    id: zwanzig
    widget: numeric
    prompt: Forscher testen {{n}} wirkungslose Mittel, jeweils mit der 5-%-Grenze. Wie viele »signifikante« Funde erwartet man rein zufällig?
    params: { unit: Funde }
    answer: { value: "{{n / 20}}" }
    hints:
      - "5 % von {{n}}."
    explanation: "{{n}} · 0,05 = {{n / 20}} Zufallsfunde – obwohl keines wirkt."
    variants:
      params: { n: "choice[20,40,60,100]" }
      defaults: { n: 20 }

  - kind: explain
    id: s2
    body: |
      Wer viele Hypothesen testet und nur die Treffer berichtet, findet garantiert etwas. Das heißt **p-Hacking**. Darum muss man die Grenze bei vielen Tests verschärfen.

  - kind: problem
    id: gummibaerchen
    widget: choice
    body: Eine Studie testet 20 Farben von Gummibärchen auf Akne. Nur bei Grün ist p < 5 %. Die Schlagzeile lautet »Grüne Gummibärchen verursachen Akne!«
    prompt: Was ist das Problem?
    params:
      options:
        - { label: Bei 20 Tests ist ein Zufallstreffer zu erwarten., correct: true }
        - { label: Grün ist eine besondere Farbe., feedback: "Grün hatte einfach Glück im Würfelspiel des Zufalls." }
    hints:
      - Wie viele Zufallstreffer erwartet man bei 20 Tests?
    explanation: Genau einer – und der wurde zur Schlagzeile.

  - kind: problem
    id: grenze
    widget: numeric
    prompt: Eine einfache Korrektur teilt die 5-%-Grenze durch die Zahl der Tests. Welche Grenze gilt bei {{n}} Tests?
    params: { unit: "%" }
    answer: { value: "{{5 / n}}" }
    hints:
      - "5 : {{n}}."
    explanation: "5 : {{n}} = {{5 / n}} % – so bleibt die Gesamtquote der Fehlalarme bei 5 %."
    variants:
      params: { n: "choice[2,4,5,10]" }
      defaults: { n: 10 }

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: Jeder von 20 Tests hat 5 % Chance auf einen Zufallstreffer. Es gilt 0,95²⁰ ≈ 0,36. Markiere ungefähr die Chance auf mindestens einen Zufallstreffer.
    params:
      min: 0
      max: 1
      ticks: 20
      labels: decimals
    answer:
      value: 0.65
      tolerance: 0.05
    hints:
      - 0,36 ist die Chance, dass kein einziger Test anschlägt.
      - "Mindestens einer: 1 − 0,36 = 0,64."
    explanation: Mit fast zwei Dritteln Chance »findet« man bei 20 Tests etwas – obwohl nichts wirkt. Darum verschärft man die Grenze.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In einer Studie werden 1000 Hypothesen getestet. 100 davon sind wirklich wahr. Die Power ist 80 %, die Grenze 5 %. Wie viele der »signifikanten« Ergebnisse sind Fehlalarme?
    params:
      options:
        - label: Etwa 45 von 125 – rund ein Drittel
          correct: true
        - label: Etwa 5 %
          feedback: "5 % gilt für die 900 falschen Hypothesen: Das sind 45 Fehlalarme neben 80 echten Treffern."
        - label: Keine
          feedback: Fehlalarme gibt es immer.
    hints:
      - "Echte Treffer: 80 % von 100. Fehlalarme: 5 % von 900."
    explanation: 80 echte und 45 falsche. Der Anteil falscher Funde hängt von der **Basisrate** wahrer Hypothesen ab – Bayes lässt grüßen.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Du testest 20 wirkungslose Mittel bei der 5-%-Schwelle. Wie wahrscheinlich ist mindestens ein falscher Treffer?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 64
      tolerance: 10
    explanation: Rund 64 %, denn 0,95²⁰ ≈ 0,36. Wer genug testet, findet fast sicher etwas.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Bonferroni: 20 Tests, jeder mit der Grenze 5 % : 20 = 0,25 %. Wie wahrscheinlich ist dann mindestens ein Fehlalarm, wenn nichts wirkt? In Prozent, auf eine Stelle. (0,9975²⁰ ≈ 0,951)"
    answer:
      value: 4.9
      tolerance: 0.1
    hints:
      - "Gegenteil: kein Fehlalarm, Chance 0,951."
      - 1 − 0,951 = ?
    explanation: Etwa 4,9 % – die **Familienfehlerrate** bleibt unter 5 %. Ohne Korrektur wären es 64 %.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Eine Forscherin testet nur **eine** Hypothese. Aber sie entscheidet erst nach dem Blick auf die Daten, welche Gruppen sie vergleicht und welche Ausreißer sie streicht. Ist ihr p-Wert in Ordnung?
    params:
      options:
        - label: Nein – sie hatte viele mögliche Wege und nahm den passenden
          correct: true
        - label: Ja, es war nur ein Test
          feedback: Die unsichtbaren Alternativen zählen mit.
        - label: Ja, wenn sie ehrlich ist
          feedback: Auch ehrliche Menschen werden von Daten verführt.
    hints:
      - Wie viele Auswertungen wären möglich gewesen?
      - Jede Wahl nach dem Datenblick ist ein versteckter Test.
    explanation: "Das nennt man den **Garten der Pfade**: Viele mögliche Entscheidungen wirken wie viele Tests – auch ohne böse Absicht."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Viele berühmte Studien ließen sich beim Wiederholen nicht bestätigen. Wie nennt man das?
    params:
      options:
        - label: Replikationskrise
          correct: true
        - label: Plagiatsskandal
          feedback: Es ging nicht um Abschreiben, sondern um unsichere Ergebnisse.
        - label: Placebo-Effekt
          feedback: Der betrifft Patienten, nicht Studien.
    hints:
      - Ein Ergebnis ist erst verlässlich, wenn andere es wiederfinden.
    explanation: "Ursachen: kleine Stichproben, p-Hacking und Zeitschriften, die nur »positive« Ergebnisse drucken."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Benjamini-Hochberg: Sortiere die p-Werte von 10 Tests aufsteigend. Der Test auf Rang k zählt, wenn p ≤ k · 5 % : 10. Welche Grenze gilt für Rang 3? In Prozent."
    answer:
      value: 1.5
    hints:
      - Setze k = 3 ein.
      - "3 · 5 % : 10."
    explanation: 1,5 %. Statt der Chance auf **einen** Fehlalarm begrenzt das Verfahren den Anteil falscher Funde (FDR). Es ist großzügiger als Bonferroni (0,5 %).
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Was schützt am besten gegen p-Hacking?
    params:
      options:
        - label: Hypothese und Auswertung vorher öffentlich festlegen
          correct: true
        - label: Mehr Hypothesen testen
          feedback: Das vergrößert das Problem.
        - label: Nur p-Werte unter 1 % berichten
          feedback: Auch dann kann man suchen, bis es klappt.
    hints:
      - Das Problem sind Entscheidungen **nach** dem Blick auf die Daten.
      - Was wäre, wenn diese Entscheidungen vorher fest wären?
    explanation: Eine **Vorregistrierung** macht den Plan prüfbar. Abweichungen sind erlaubt, müssen aber offen als »explorativ« gekennzeichnet werden.
    difficulty: 3

srs:
  cards_from: [zwanzig, gummibaerchen]
