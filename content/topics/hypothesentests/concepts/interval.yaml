id: stats.testing.interval
type: concept
title: "Konfidenzintervalle"
summary: "Wie genau ist eine gemessene Zahl? Der Bereich drumherum verrät es."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 13
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: "Eine Umfrage meldet: »Partei A liegt bei 30 %.« Was fehlt in dieser Angabe?"
    params:
      options:
        - label: Wie genau die Zahl ist
          correct: true
        - label: Nichts
          feedback: Befragt wurde nur ein kleiner Teil aller Menschen.
        - label: Das Wetter am Umfragetag
          feedback: Das spielt keine Rolle.
    hints:
      - Es wurden nicht alle gefragt.
    explanation: "Jede Zahl aus einer Stichprobe schwankt. Die Frage ist: wie stark?"

  - kind: explain
    id: c2
    body: "Ein **Konfidenzintervall** ist ein Bereich um den Messwert, der den wahren Wert wahrscheinlich enthält. Üblich sind 95 %: Von 100 solchen Bereichen treffen etwa 95 den wahren Wert."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Eine Umfrage misst 30 % mit einer Fehlerspanne von ± 3 Punkten. Wo liegt die obere Grenze des Bereichs?
    params:
      unit: "%"
    answer:
      value: 33
    hints:
      - 30 + 3.
    explanation: Der Bereich reicht von 27 bis 33 %.

  - kind: problem
    id: c4
    widget: choice
    prompt: Partei A hat 30 % ± 3, Partei B hat 32 % ± 3. Liegt B sicher vorn?
    params:
      options:
        - label: Nein – die Bereiche überlappen
          correct: true
        - label: Ja – 32 ist mehr als 30
          feedback: A könnte bei 33 liegen und B bei 29.
        - label: A liegt vorn
          feedback: Auch das lässt sich nicht sagen.
    hints:
      - Welche Werte sind für A und B möglich?
    explanation: Ein Vorsprung innerhalb der Spanne ist kein gesicherter Vorsprung.

  - kind: problem
    id: c5
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Mehr Befragte machen den Bereich schmaler.
          right: true
        - text: Ein 99-%-Bereich ist schmaler als ein 95-%-Bereich.
          right: false
          why: Wer sicherer sein will, braucht einen breiteren Bereich.
        - text: Ein schmaler Bereich steht für eine genaue Messung.
          right: true
        - text: Der Bereich hängt nicht davon ab, wie stark die Daten streuen.
          right: false
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Standardfehler ist die Streuung geteilt durch die Wurzel aus n. Die Streuung ist 20, gemessen wurde 100-mal. Wie groß ist der Standardfehler?
    answer:
      value: 2
    hints:
      - 20 geteilt durch 10.
    explanation: "20 : √100 = 2. So genau kennt man den Mittelwert."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Faustregel für 95 %: Mittelwert ± 2 Standardfehler. Der Mittelwert ist 50, der Standardfehler 1,5. Wo liegt die untere Grenze?"
    answer:
      value: 47
    hints:
      - 50 − 2 · 1,5.
    explanation: Der Bereich reicht von 47 bis 53.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Ein Medikament senkt den Blutdruck im Schnitt um 2 Punkte. Der 95-%-Bereich reicht von −1 bis 5. Ist die Wirkung gesichert?
    params:
      options:
        - label: Nein – die Null liegt im Bereich
          correct: true
        - label: Ja – 2 ist größer als 0
          feedback: Der wahre Wert könnte auch 0 oder negativ sein.
        - label: Ja – der Bereich ist breit
          feedback: Breite spricht für Unsicherheit.
    hints:
      - Kann »keine Wirkung« noch stimmen?
    explanation: Enthält der Bereich die Null, ist das Ergebnis nicht signifikant. Intervall und p-Wert sagen dasselbe.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Der Mittelwert ist 100, der Standardfehler 5. Prüf die Faustregel: Liegen wirklich etwa 95 % zwischen 90 und 110?"
    params:
      scene: normal
      interval:
        - 90
        - 110
    answer:
      mean: 100
      sd: 5
    explanation: "Ja: 95,4 %. Mittelwert plus und minus zwei Standardfehler."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Mittelwert {{m}}, Standardabweichung {{s}}, {{n}} Messungen. Wo liegt die untere Grenze des 95-%-Bereichs nach der Faustregel Mittelwert − 2 · s/√n?
    answer:
      value: "{{m - 2 * s / sqrt(n)}}"
    feedback:
      - when: numval(state.input) == m - 2 * s
        misconception: sd-not-se
        text: Du hast die Streuung einzelner Werte genommen. Für den Mittelwert teilt man durch √n.
    hints:
      - "Standardfehler: {{s}} : √{{n}} = {{s / sqrt(n)}}."
      - Rechne {{m}} − 2 · {{s / sqrt(n)}}.
    explanation: "{{m}} − {{2 * s / sqrt(n)}} = {{m - 2 * s / sqrt(n)}}. Der Bereich reicht bis {{m + 2 * s / sqrt(n)}}."
    difficulty: 2
    variants:
      params:
        m: choice[50,100,120]
        s: choice[10,20,30]
        n: choice[4,25,100]
      defaults:
        m: 100
        s: 20
        n: 25

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Statt 95 % willst du 99 % Sicherheit. Was passiert mit dem Intervall?
    params:
      options:
        - label: Es wird breiter – etwa ± 2,6 statt ± 2 Standardfehler
          correct: true
        - label: Es wird schmaler
          feedback: Mehr Sicherheit verlangt einen größeren Bereich.
        - label: Es bleibt gleich
          feedback: Die Breite hängt direkt am Sicherheitsniveau.
    hints:
      - Ein Netz, das öfter fangen soll, muss größer sein.
      - Für 99 % braucht man 2,58 σ.
    explanation: Sicherheit kostet Genauigkeit – oder mehr Daten. Ein 100-%-Intervall wäre unendlich breit und nutzlos.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was heißt »95 % Konfidenz« genau?
    params:
      options:
        - label: Das Verfahren trifft den wahren Wert in 95 % aller Fälle
          correct: true
        - label: Der wahre Wert springt zu 95 % in diesen Bereich
          feedback: Der wahre Wert ist fest. Zufällig ist der Bereich.
        - label: 95 % der Daten liegen im Bereich
          feedback: Es geht um den Mittelwert, nicht um einzelne Daten.
    hints:
      - Was ändert sich von Stichprobe zu Stichprobe?
    explanation: Die 95 % beschreiben das Verfahren, nicht den einen Bereich. Diese Feinheit übersehen selbst Fachleute.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Du willst den Bereich auf ein Drittel seiner Breite bringen. Wie viel mal so viele Messungen brauchst du?
    answer:
      value: 9
    hints:
      - Die Breite schrumpft mit der Wurzel aus n.
    explanation: √9 = 3. Dreifache Genauigkeit kostet neunfachen Aufwand.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum eine gemessene Zahl ohne Fehlerspanne wenig wert ist.
    params:
      keywords:
        - - genau
          - sicher
          - precise
          - exact
          - certain
        - - bereich
          - spanne
          - intervall
          - range
          - margin
          - interval
        - - zufall
          - stichprobe
          - chance
          - sample
          - random
      sample: Jede Messung aus einer Stichprobe schwankt durch Zufall. Erst die Spanne zeigt, wie genau die Zahl ist – und ob ein Unterschied echt sein kann.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Eine Umfrage mit 600 Befragten misst 40 %. Der Standardfehler ist √(0,4 · 0,6 : 600) = 0,02. Wie groß ist die 95-%-Fehlerspanne in Prozentpunkten (1,96 · SE)? Auf eine Stelle."
    answer:
      value: 3.9
      tolerance: 0.05
    hints:
      - 1,96 · 0,02 = 0,0392.
      - "Als Prozentpunkte: mal 100."
    explanation: ± 3,9 Punkte, also 36,1 % bis 43,9 %. Die Faustregel 100/√600 ≈ 4,1 liegt nahe dran.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Beim **Bootstrap** zieht man aus der eigenen Stichprobe tausendmal neue Stichproben – mit Zurücklegen. Wozu?
    params:
      options:
        - label: Um zu sehen, wie stark eine Kennzahl schwankt, auch ohne Formel
          correct: true
        - label: Um mehr echte Daten zu bekommen
          feedback: Neue Information entsteht dabei nicht.
        - label: Um Ausreißer zu entfernen
          feedback: Ausreißer bleiben in den Ziehungen enthalten.
    hints:
      - Die Stichprobe dient als Ersatz für die ganze Bevölkerung.
      - Die Streuung der tausend Ergebnisse schätzt den Standardfehler.
    explanation: Der Bootstrap (Efron, 1979) liefert Intervalle für Median, Korrelation und vieles mehr – überall dort, wo keine einfache Formel existiert.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "d2"]
