id: stats.testing.interval
type: concept
title: "Konfidenzintervalle"
summary: "Wie genau ist eine gemessene Zahl? Der Bereich drumherum verrät es."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: "Eine Umfrage meldet: »Partei A liegt bei 30 %.« Was fehlt in dieser Angabe?"
    params:
      options:
        - label: Wie genau die Zahl ist
          correct: true
        - label: Nichts
          feedback: Befragt wurde nur ein kleiner Teil aller Menschen.
        - label: Das Wetter am Umfragetag
          feedback: Das spielt keine Rolle.
    hints:
      - Es wurden nicht alle gefragt.
    explanation: "Jede Zahl aus einer Stichprobe schwankt. Die Frage ist: wie stark?"

  - kind: explain
    id: c2
    body: "Ein **Konfidenzintervall** ist ein Bereich um den Messwert, der den wahren Wert wahrscheinlich enthält. Üblich sind 95 %: Von 100 solchen Bereichen treffen etwa 95 den wahren Wert."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Eine Umfrage misst 30 % mit einer Fehlerspanne von ± 3 Punkten. Wo liegt die obere Grenze des Bereichs?
    params:
      unit: "%"
    answer:
      value: 33
    hints:
      - 30 + 3.
    explanation: Der Bereich reicht von 27 bis 33 %.

  - kind: problem
    id: c4
    widget: choice
    prompt: Partei A hat 30 % ± 3, Partei B hat 32 % ± 3. Liegt B sicher vorn?
    params:
      options:
        - label: Nein – die Bereiche überlappen
          correct: true
        - label: Ja – 32 ist mehr als 30
          feedback: A könnte bei 33 liegen und B bei 29.
        - label: A liegt vorn
          feedback: Auch das lässt sich nicht sagen.
    hints:
      - Welche Werte sind für A und B möglich?
    explanation: Ein Vorsprung innerhalb der Spanne ist kein gesicherter Vorsprung.

  - kind: problem
    id: c5
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Mehr Befragte machen den Bereich schmaler.
          right: true
        - text: Ein 99-%-Bereich ist schmaler als ein 95-%-Bereich.
          right: false
          why: Wer sicherer sein will, braucht einen breiteren Bereich.
        - text: Ein schmaler Bereich steht für eine genaue Messung.
          right: true
        - text: Der Bereich hängt nicht davon ab, wie stark die Daten streuen.
          right: false
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Standardfehler ist die Streuung geteilt durch die Wurzel aus n. Die Streuung ist 20, gemessen wurde 100-mal. Wie groß ist der Standardfehler?
    answer:
      value: 2
    hints:
      - 20 geteilt durch 10.
    explanation: "20 : √100 = 2. So genau kennt man den Mittelwert."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Faustregel für 95 %: Mittelwert ± 2 Standardfehler. Der Mittelwert ist 50, der Standardfehler 1,5. Wo liegt die untere Grenze?"
    answer:
      value: 47
    hints:
      - 50 − 2 · 1,5.
    explanation: Der Bereich reicht von 47 bis 53.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Ein Medikament senkt den Blutdruck im Schnitt um 2 Punkte. Der 95-%-Bereich reicht von −1 bis 5. Ist die Wirkung gesichert?
    params:
      options:
        - label: Nein – die Null liegt im Bereich
          correct: true
        - label: Ja – 2 ist größer als 0
          feedback: Der wahre Wert könnte auch 0 oder negativ sein.
        - label: Ja – der Bereich ist breit
          feedback: Breite spricht für Unsicherheit.
    hints:
      - Kann »keine Wirkung« noch stimmen?
    explanation: Enthält der Bereich die Null, ist das Ergebnis nicht signifikant. Intervall und p-Wert sagen dasselbe.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was heißt »95 % Konfidenz« genau?
    params:
      options:
        - label: Das Verfahren trifft den wahren Wert in 95 % aller Fälle
          correct: true
        - label: Der wahre Wert springt zu 95 % in diesen Bereich
          feedback: Der wahre Wert ist fest. Zufällig ist der Bereich.
        - label: 95 % der Daten liegen im Bereich
          feedback: Es geht um den Mittelwert, nicht um einzelne Daten.
    hints:
      - Was ändert sich von Stichprobe zu Stichprobe?
    explanation: Die 95 % beschreiben das Verfahren, nicht den einen Bereich. Diese Feinheit übersehen selbst Fachleute.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Du willst den Bereich auf ein Drittel seiner Breite bringen. Wie viel mal so viele Messungen brauchst du?
    answer:
      value: 9
    hints:
      - Die Breite schrumpft mit der Wurzel aus n.
    explanation: √9 = 3. Dreifache Genauigkeit kostet neunfachen Aufwand.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum eine gemessene Zahl ohne Fehlerspanne wenig wert ist.
    params:
      keywords:
        - - genau
          - sicher
          - precise
          - exact
          - certain
        - - bereich
          - spanne
          - intervall
          - range
          - margin
          - interval
        - - zufall
          - stichprobe
          - chance
          - sample
          - random
      sample: Jede Messung aus einer Stichprobe schwankt durch Zufall. Erst die Spanne zeigt, wie genau die Zahl ist – und ob ein Unterschied echt sein kann.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "d2"]
