id: stats.testing.errors
type: concept
title: Fehlalarm und Übersehen
summary: Die zwei Fehlerarten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Ein Test kann auf zwei Arten danebenliegen: einen Effekt melden, den es nicht gibt (**Fehler 1. Art**, Fehlalarm) – oder einen echten Effekt übersehen (**Fehler 2. Art**).

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Welcher Fehler ist das?
    params:
      buckets: [{ label: Fehlalarm }, { label: Übersehen }]
      items:
        - { label: Rauchmelder piept beim Toasten, bucket: Fehlalarm }
        - { label: Wirkloses Mittel gilt als wirksam, bucket: Fehlalarm }
        - { label: Test erkennt eine echte Krankheit nicht, bucket: Übersehen }
        - { label: Spamfilter lässt Spam durch, bucket: Übersehen }
    hints:
      - Wurde etwas gemeldet, das nicht da war – oder nicht gemeldet, was da war?
    explanation: Beide Fehler kosten etwas – welcher schlimmer ist, hängt vom Fall ab.

  - kind: problem
    id: grenze
    widget: choice
    prompt: Man senkt die Signifikanzgrenze von 5 % auf 1 %. Was passiert?
    params:
      options:
        - { label: "Weniger Fehlalarme, aber mehr übersehene Effekte", correct: true }
        - { label: Beide Fehler werden seltener, feedback: "Strenger heißt – man übersieht auch eher echte Effekte." }
    hints:
      - Ein strengerer Wachhund bellt seltener – auch bei echten Einbrechern.
    explanation: Die beiden Fehler sind ein Tauschhandel. Nur mehr Daten verbessern beide.

  - kind: problem
    id: daten
    widget: choice
    prompt: Wie senkt man beide Fehler gleichzeitig?
    params:
      options:
        - { label: Mit einer größeren Stichprobe, correct: true }
        - { label: Mit einer anderen Grenze, feedback: "Die Grenze verschiebt nur zwischen den Fehlern." }
    hints:
      - Was macht Ergebnisse weniger zufällig?
    explanation: Mehr Daten – schärferes Bild, weniger Irrtümer in beide Richtungen.

srs:
  cards_from: [sortieren, grenze]
