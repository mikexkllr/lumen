id: stats.testing.errors
type: concept
title: Fehlalarm und Übersehen
summary: Die zwei Fehlerarten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Piep oder kein Piep?
    body: "Am Flughafen piept der Metalldetektor – manchmal beim Gürtel, hoffentlich immer beim Messer. Zieh die **Alarmschwelle**: Alles rechts davon piept. Wo stellst du sie hin, damit nichts Gefährliches durchrutscht?"
    visual:
      widget: numberline
      interactive: true
      params:
        min: 0
        max: 10
        ticks: 1
        initial: 5
        markers:
          - value: 2
            label: Gürtel
          - value: 4
            label: Schlüssel
          - value: 7
            label: Messer
          - value: 9
            label: Pistole

  - kind: problem
    id: hook
    widget: choice
    prompt: Der Rauchmelder piept, obwohl nur Toast anbrennt. Was ist das?
    params:
      options:
        - label: Ein Fehlalarm
          correct: true
        - label: Ein übersehener Brand
          feedback: Es brennt ja gar nicht.
        - label: Ein richtiger Treffer
          feedback: Es gab keinen Brand.
    hints:
      - Gab es wirklich einen Brand?
    explanation: "Der andere Fehler wäre schlimmer: Es brennt, und er bleibt still."

  - kind: explain
    id: s1
    body: |
      Ein Test kann auf zwei Arten danebenliegen: einen Effekt melden, den es nicht gibt (**Fehler 1. Art**, Fehlalarm) – oder einen echten Effekt übersehen (**Fehler 2. Art**).

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Welcher Fehler ist das?
    params:
      buckets: [{ label: Fehlalarm }, { label: Übersehen }]
      items:
        - { label: Rauchmelder piept beim Toasten, bucket: Fehlalarm }
        - { label: Wirkloses Mittel gilt als wirksam, bucket: Fehlalarm }
        - { label: Test erkennt eine echte Krankheit nicht, bucket: Übersehen }
        - { label: Spamfilter lässt Spam durch, bucket: Übersehen }
    hints:
      - Wurde etwas gemeldet, das nicht da war – oder nicht gemeldet, was da war?
    explanation: Beide Fehler kosten etwas – welcher schlimmer ist, hängt vom Fall ab.

  - kind: problem
    id: grenze
    widget: choice
    prompt: Man senkt die Signifikanzgrenze von 5 % auf 1 %. Was passiert?
    params:
      options:
        - { label: "Weniger Fehlalarme, aber mehr übersehene Effekte", correct: true }
        - { label: Beide Fehler werden seltener, feedback: "Strenger heißt – man übersieht auch eher echte Effekte." }
    hints:
      - Ein strengerer Wachhund bellt seltener – auch bei echten Einbrechern.
    explanation: Die beiden Fehler sind ein Tauschhandel. Nur mehr Daten verbessern beide.

  - kind: problem
    id: daten
    widget: choice
    prompt: Wie senkt man beide Fehler gleichzeitig?
    params:
      options:
        - { label: Mit einer größeren Stichprobe, correct: true }
        - { label: Mit einer anderen Grenze, feedback: "Die Grenze verschiebt nur zwischen den Fehlern." }
    hints:
      - Was macht Ergebnisse weniger zufällig?
    explanation: Mehr Daten – schärferes Bild, weniger Irrtümer in beide Richtungen.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Welcher Fehler ist das?
    params:
      buckets:
        - id: b1
          label: Fehlalarm
        - id: b2
          label: Übersehen
      items:
        - label: Rauchmelder piept ohne Feuer
          bucket: b1
        - label: Test übersieht eine Krankheit
          bucket: b2
        - label: Spamfilter löscht eine echte Mail
          bucket: b1
        - label: Wächter verschläft den Einbruch
          bucket: b2
    hints:
      - Wurde etwas gemeldet, das nicht da war – oder etwas verpasst?
    explanation: Wer einen Fehler seltener macht, macht den anderen meist häufiger.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Rauchmelder kann Fehlalarm geben oder einen Brand übersehen. Welchen Fehler nimmt man eher in Kauf?
    params:
      options:
        - label: Den Fehlalarm – ein übersehener Brand ist viel schlimmer
          correct: true
        - label: Den übersehenen Brand
          feedback: Die Folgen wären katastrophal.
        - label: Beide sind gleich schlimm
          feedback: Die Kosten sind sehr verschieden.
    hints:
      - Was kostet jeder der beiden Fehler?
    explanation: Die richtige Grenze hängt von den **Kosten** der Fehler ab. Vor Gericht wiegt der Fehlalarm schwerer.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: Erhöht das die **Power** eines Tests oder senkt es sie?
    params:
      buckets:
        - id: b1
          label: Mehr Power
        - id: b2
          label: Weniger Power
      items:
        - label: Mehr Teilnehmer
          bucket: b1
        - label: Größerer echter Effekt
          bucket: b1
        - label: Genauere Messungen
          bucket: b1
        - label: "Strengere Grenze: 1 % statt 5 %"
          bucket: b2
        - label: Mehr Rauschen in den Daten
          bucket: b2
    hints:
      - Power ist die Chance, einen echten Effekt zu finden.
      - Was macht ein Signal leichter vom Rauschen unterscheidbar?
    explanation: Power wächst mit Stichprobe, Effektgröße und Messgenauigkeit. Eine strengere Grenze senkt Fehlalarme, aber auch die Power.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Die **Effektgröße** (Cohens d) ist der Unterschied der Mittelwerte geteilt durch die Standardabweichung. Gruppe A hat im Schnitt {{a}}, Gruppe B {{b}}, σ = {{s}}. Wie groß ist d?
    answer:
      value: "{{(a - b) / s}}"
    hints:
      - "Unterschied: {{a - b}}."
      - Teile durch {{s}}.
    explanation: "d = {{(a - b) / s}}. Faustregel: 0,2 klein, 0,5 mittel, 0,8 groß. Anders als p hängt d nicht von der Stichprobengröße ab."
    difficulty: 2
    variants:
      params:
        b: choice[50,100]
        s: choice[5,10,20]
        k: choice[1,2,4,8]
      derive:
        a: b + k * s / 4
      defaults:
        b: 100
        s: 10
        k: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die **Power** eines Tests ist die Wahrscheinlichkeit, einen echten Effekt zu finden. Eine Studie übersieht einen echten Effekt mit 20 %. Wie groß ist ihre Power in Prozent?
    params:
      unit: "%"
    answer:
      value: 80
    hints:
      - 100 % minus die Wahrscheinlichkeit des Fehlers 2. Art.
    explanation: 80 % gelten als Mindestmaß. Viele ältere Studien hatten unter 50 % – ihre Ergebnisse sind kaum verlässlich.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Für d = 0,5 und 80 % Power braucht man etwa 64 Personen pro Gruppe. Wie viele braucht man für d = 0,25?
    answer:
      value: 256
    feedback:
      - when: numval(state.input) == 128
        misconception: linear-n
        text: Die nötige Stichprobe wächst mit 1/d², nicht mit 1/d.
    hints:
      - Halber Effekt – wie viel mehr Daten?
      - Die Fehlerspanne schrumpft mit √n. Halbe Spanne braucht 4-mal so viele.
    explanation: 4 · 64 = 256 pro Gruppe. Kleine Effekte sicher nachzuweisen ist teuer – darum sind viele Studien zu klein.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Eine kleine Studie (20 pro Gruppe) findet einen signifikanten, riesigen Effekt. Was ist verdächtig?
    params:
      options:
        - label: Bei geringer Power schaffen es nur übertriebene Schätzungen über die Grenze
          correct: true
        - label: Nichts – signifikant ist signifikant
          feedback: Bei wenig Power ist der gefundene Effekt meist zu groß.
        - label: Die Studie ist zu groß
          feedback: 20 pro Gruppe ist eher wenig.
    hints:
      - Wie groß muss ein zufällig geschätzter Effekt sein, damit eine kleine Studie ihn signifikant findet?
      - Nur Glückstreffer mit großem Ausschlag kommen durch.
    explanation: "Das ist der **Fluch des Gewinners**: Bei schwacher Power überschätzen signifikante Ergebnisse den Effekt systematisch. Wiederholungen finden dann kleinere Werte."
    difficulty: 3

srs:
  cards_from: [sortieren, grenze]
