id: stats.testing.idea
type: concept
title: Zufall oder echt?
summary: Die Idee eines Tests.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: muenze
    widget: choice
    prompt: Eine Münze zeigt bei 10 Würfen 9-mal Kopf. Ist sie gezinkt?
    params:
      options:
        - { label: Verdächtig – bei einer fairen Münze wäre das sehr selten., correct: true }
        - { label: Sicher gezinkt, feedback: "Selten heißt nicht unmöglich – auch faire Münzen tun das manchmal." }
        - { label: Völlig normal, feedback: "9 von 10 passiert bei einer fairen Münze nur in etwa 1 % der Fälle." }
    hints:
      - Wie oft passiert so etwas mit einer fairen Münze?
    explanation: Man kann es nie sicher wissen – nur, wie überraschend das Ergebnis wäre.

  - kind: explain
    id: s2
    body: |
      Ein **Hypothesentest** fragt: Angenommen, es gibt keinen Effekt (die **Nullhypothese**) – wie wahrscheinlich ist dann ein so extremes Ergebnis? Ist es sehr unwahrscheinlich, zweifelt man an der Nullhypothese.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Bei 10 Würfen gibt es 1024 gleich wahrscheinliche Ergebnisse. 11 davon haben 9 oder 10 Kopf. Wie viel Prozent sind das ungefähr?
    params: { unit: "%" }
    answer: { value: 1.07, tolerance: 0.1 }
    hints:
      - 11 geteilt durch 1024.
    explanation: Etwa 1 % – sehr überraschend für eine faire Münze.

  - kind: problem
    id: nullhypothese
    widget: choice
    prompt: Ein neues Medikament wird getestet. Was ist die Nullhypothese?
    params:
      options:
        - { label: Das Medikament wirkt nicht., correct: true }
        - { label: Das Medikament wirkt., feedback: "Die Nullhypothese ist immer »kein Effekt« – sie soll widerlegt werden." }
    hints:
      - Null wie »nichts passiert«.
    explanation: Man versucht, »kein Effekt« mit Daten unglaubwürdig zu machen.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Die [[Nullhypothese]] sagt: Es gibt keinen Effekt. Ist das Ergebnis unter dieser Annahme sehr [[unwahrscheinlich]], [[verwirft]] man sie."
      distractors:
        - beweist
        - häufig

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Münze zeigt 8-mal Kopf bei 10 Würfen. Von den 1024 Ergebnissen haben 56 mindestens 8-mal Kopf. Wie groß ist dieser p-Wert in Prozent? Auf eine Stelle.
    params:
      unit: "%"
    answer:
      value: 5.5
      tolerance: 0.1
    hints:
      - 56 geteilt durch 1024.
    explanation: 5,5 % – knapp über der üblichen Grenze. 8 von 10 ist noch kein Beweis für eine gezinkte Münze.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Bei 10 Würfen haben 11 von 1024 Ergebnissen 9 oder 10 Köpfe. Genauso extrem wären 9 oder 10 **Zahlen**. Wie groß ist der zweiseitige p-Wert in Prozent? Auf zwei Stellen.
    answer:
      value: 2.15
      tolerance: 0.02
    feedback:
      - when: abs(numval(state.input) - 1.07) < 0.02
        misconception: one-sided
        text: Das ist der einseitige Wert. Eine gezinkte Münze könnte auch Zahl bevorzugen.
    hints:
      - "Zähle beide Seiten: 11 + 11 = 22 Ergebnisse."
      - "Rechne 22 : 1024."
    explanation: 22/1024 ≈ 2,15 %. **Zweiseitig** testet man, wenn Abweichungen in beide Richtungen zählen. Das muss man vor dem Blick auf die Daten festlegen.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Eine Dame will schmecken, ob Milch oder Tee zuerst in der Tasse war. Von 8 Tassen sind 4 »Milch zuerst«. Sie findet alle 4. Es gibt 70 Arten, 4 aus 8 zu wählen. p-Wert in Prozent, auf zwei Stellen?
    answer:
      value: 1.43
      tolerance: 0.02
    hints:
      - Rät sie nur, ist jede der 70 Auswahlen gleich wahrscheinlich.
      - "Nur eine davon ist ganz richtig: 1 : 70."
    explanation: "1/70 ≈ 1,43 %. Mit diesem Versuch erklärte Ronald Fisher 1935 die Idee des Tests: Man rechnet aus, wie oft reines Raten so gut abschneidet."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Test ergibt p = 40 %. Die Nullhypothese wird nicht verworfen. Ist damit **bewiesen**, dass es keinen Effekt gibt?
    params:
      options:
        - label: Nein – die Studie war vielleicht nur zu klein, um ihn zu finden
          correct: true
        - label: Ja – ein hoher p-Wert beweist die Nullhypothese
          feedback: Abwesenheit eines Beweises ist kein Beweis der Abwesenheit.
        - label: Ja, mit 40 % Sicherheit
          feedback: Der p-Wert ist keine Wahrscheinlichkeit der Hypothese.
    hints:
      - Was findet man mit nur 10 Versuchspersonen?
    explanation: Man kann die Nullhypothese nur verwerfen oder **nicht verwerfen** – nie bestätigen.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "Ein **Permutationstest**: Gruppe A hat im Schnitt 5 Punkte mehr als B. Wie prüft man ohne Formel, ob das Zufall sein kann?"
    params:
      options:
        - label: Die Gruppen-Etiketten tausendfach zufällig neu verteilen und zählen, wie oft 5 Punkte oder mehr herauskommen
          correct: true
        - label: Die Gruppen tauschen und neu messen
          feedback: Neue Messungen braucht man nicht – nur neues Mischen.
        - label: Die größten Werte weglassen
          feedback: Das verändert das Ergebnis künstlich.
    hints:
      - Gibt es keinen Effekt, sind die Etiketten A und B egal.
      - Der Anteil der Mischungen mit ≥ 5 Punkten ist der p-Wert.
    explanation: So erzeugt der Computer die Welt der **Nullhypothese** selbst. Der Test braucht keine Glockenkurve – nur Zufall und Rechenzeit.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Ein Test gleicht einem Beweis durch Widerspruch. Wo liegt der Unterschied?
    params:
      options:
        - label: Der Widerspruch ist nicht sicher, sondern nur unwahrscheinlich
          correct: true
        - label: Es gibt keinen Unterschied
          feedback: Ein Mathe-Beweis ist sicher, ein Test kann irren.
        - label: Beim Test nimmt man an, dass der Effekt existiert
          feedback: "Man nimmt das Gegenteil an: keinen Effekt."
    hints:
      - Was nimmt man am Anfang an?
      - Kann ein seltenes Ergebnis trotzdem passieren?
    explanation: Man nimmt H₀ an und zeigt, dass die Daten dann sehr unwahrscheinlich wären. Bei 5 % Grenze irrt man in 5 % der Fälle, in denen H₀ stimmt.
    difficulty: 3

srs:
  cards_from: [muenze, nullhypothese]
