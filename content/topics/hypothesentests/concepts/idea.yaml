id: stats.testing.idea
type: concept
title: Zufall oder echt?
summary: Die Idee eines Tests.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: muenze
    widget: choice
    prompt: Eine Münze zeigt bei 10 Würfen 9-mal Kopf. Ist sie gezinkt?
    params:
      options:
        - { label: Verdächtig – bei einer fairen Münze wäre das sehr selten., correct: true }
        - { label: Sicher gezinkt, feedback: "Selten heißt nicht unmöglich – auch faire Münzen tun das manchmal." }
        - { label: Völlig normal, feedback: "9 von 10 passiert bei einer fairen Münze nur in etwa 1 % der Fälle." }
    hints:
      - Wie oft passiert so etwas mit einer fairen Münze?
    explanation: Man kann es nie sicher wissen – nur, wie überraschend das Ergebnis wäre.

  - kind: explain
    body: |
      Ein **Hypothesentest** fragt: Angenommen, es gibt keinen Effekt (die **Nullhypothese**) – wie wahrscheinlich ist dann ein so extremes Ergebnis? Ist es sehr unwahrscheinlich, zweifelt man an der Nullhypothese.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Bei 10 Würfen gibt es 1024 gleich wahrscheinliche Ergebnisse. 11 davon haben 9 oder 10 Kopf. Wie viel Prozent sind das ungefähr?
    params: { unit: "%" }
    answer: { value: 1.07, tolerance: 0.1 }
    hints:
      - 11 geteilt durch 1024.
    explanation: Etwa 1 % – sehr überraschend für eine faire Münze.

  - kind: problem
    id: nullhypothese
    widget: choice
    prompt: Ein neues Medikament wird getestet. Was ist die Nullhypothese?
    params:
      options:
        - { label: Das Medikament wirkt nicht., correct: true }
        - { label: Das Medikament wirkt., feedback: "Die Nullhypothese ist immer »kein Effekt« – sie soll widerlegt werden." }
    hints:
      - Null wie »nichts passiert«.
    explanation: Man versucht, »kein Effekt« mit Daten unglaubwürdig zu machen.

srs:
  cards_from: [muenze, nullhypothese]
