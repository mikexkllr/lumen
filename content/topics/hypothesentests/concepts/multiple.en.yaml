id: stats.testing.multiple
type: concept
title: Look long enough
summary: Many tests, false findings.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: zwanzig
    widget: numeric
    prompt: Researchers test {{n}} useless drugs, each at the 5 % level. How many "significant" findings do you expect by chance alone?
    params: { unit: findings }
    answer: { value: "{{n / 20}}" }
    hints:
      - "5 % of {{n}}."
    explanation: "{{n}} · 0.05 = {{n / 20}} chance findings, even though none works."
    variants:
      params: { n: "choice[20,40,60,100]" }
      defaults: { n: 20 }

  - kind: explain
    id: s2
    body: |
      If you test many hypotheses and report only the hits, you will find something. This is called **p-hacking**. That is why you must tighten the threshold when you run many tests.

  - kind: problem
    id: gummibaerchen
    widget: choice
    body: A study tests 20 colors of gummy bears for acne. Only green has p < 5 %. The headline reads "Green gummy bears cause acne!"
    prompt: What is the problem?
    params:
      options:
        - { label: "With 20 tests, one chance hit is expected.", correct: true }
        - { label: Green is a special color., feedback: "Green simply got lucky in chance's game of dice." }
    hints:
      - How many chance hits do you expect in 20 tests?
    explanation: Exactly one, and it became the headline.

  - kind: problem
    id: grenze
    widget: numeric
    prompt: A simple correction divides the 5 % threshold by the number of tests. What threshold applies for {{n}} tests?
    params: { unit: "%" }
    answer: { value: "{{5 / n}}" }
    hints:
      - "5 ÷ {{n}}."
    explanation: "5 ÷ {{n}} = {{5 / n}} %. This keeps the overall false-alarm rate at 5 %."
    variants:
      params: { n: "choice[2,4,5,10]" }
      defaults: { n: 10 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A study tests 1000 hypotheses. 100 of them are really true. The power is 80%, the threshold 5%. How many of the “significant” results are false alarms?
    params:
      options:
        - label: About 45 of 125 – roughly a third
          correct: true
        - label: About 5%
          feedback: "5% applies to the 900 false hypotheses: that is 45 false alarms beside 80 true hits."
        - label: None
          feedback: False alarms always occur.
    hints:
      - "True hits: 80% of 100. False alarms: 5% of 900."
    explanation: 80 true and 45 false. The share of false findings depends on the **base rate** of true hypotheses – Bayes says hello.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: you test 20 useless remedies at the 5% threshold. How likely is at least one false hit?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 64
      tolerance: 10
    explanation: About 64%, since 0.95²⁰ ≈ 0.36. Whoever tests enough almost surely finds something.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Bonferroni: 20 tests, each at the threshold 5 % ÷ 20 = 0.25 %. How likely is at least one false alarm then, if nothing works? In percent, to one decimal. (0.9975²⁰ ≈ 0.951)"
    answer:
      value: 4.9
      tolerance: 0.1
    hints:
      - "Complement: no false alarm, probability 0.951."
      - 1 − 0.951 = ?
    explanation: About 4.9 % – the family-wise error rate stays below 5 %. Without correction it would be 64 %.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A researcher tests only one hypothesis. But she decides only after looking at the data which groups to compare and which outliers to drop. Is her p-value fine?
    params:
      options:
        - label: No – she had many possible paths and took the one that fit
          correct: true
        - label: The invisible alternatives count too.
          feedback: Die unsichtbaren Alternativen zählen mit.
        - label: Honest people get seduced by data too.
          feedback: Auch ehrliche Menschen werden von Daten verführt.
    hints:
      - How many analyses would have been possible?
      - Every choice after seeing the data is a hidden test.
    explanation: "This is called the garden of forking paths: many possible decisions act like many tests – even without bad intent."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Many famous studies could not be confirmed when repeated. What is this called?
    params:
      options:
        - label: Replication crisis
          correct: true
        - label: Plagiarism scandal
          feedback: It was not about copying but about shaky results.
        - label: Placebo effect
          feedback: That concerns patients, not studies.
    hints:
      - A result is only reliable when others find it again.
    explanation: "Causes: small samples, p-hacking and journals that only print “positive” results."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Benjamini–Hochberg: sort the p-values of 10 tests in ascending order. The test at rank k counts if p ≤ k · 5 % ÷ 10. Which threshold applies to rank 3? In percent."
    answer:
      value: 1.5
    hints:
      - Put in k = 3.
      - 3 · 5 % ÷ 10.
    explanation: 1.5 %. Instead of the chance of any false alarm it limits the share of false finds (FDR). It is more generous than Bonferroni (0.5 %).
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: What protects best against p-hacking?
    params:
      options:
        - label: Fix the hypothesis and analysis publicly in advance
          correct: true
        - label: That makes the problem worse.
          feedback: Das vergrößert das Problem.
        - label: You can still search until it works.
          feedback: Auch dann kann man suchen, bis es klappt.
    hints:
      - The problem is decisions made after seeing the data.
      - What if those decisions were fixed beforehand?
    explanation: Pre-registration makes the plan checkable. Deviations are allowed but must be openly labelled as exploratory.
    difficulty: 3

srs:
  cards_from: [zwanzig, gummibaerchen]
