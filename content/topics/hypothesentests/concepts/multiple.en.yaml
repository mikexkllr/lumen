id: stats.testing.multiple
type: concept
title: Look long enough
summary: Many tests, false findings.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zwanzig
    widget: numeric
    prompt: Researchers test {{n}} useless drugs, each at the 5 % level. How many "significant" findings do you expect by chance alone?
    params: { unit: findings }
    answer: { value: "{{n / 20}}" }
    hints:
      - "5 % of {{n}}."
    explanation: "{{n}} · 0.05 = {{n / 20}} chance findings, even though none works."
    variants:
      params: { n: "choice[20,40,60,100]" }
      defaults: { n: 20 }

  - kind: explain
    id: s2
    body: |
      If you test many hypotheses and report only the hits, you will find something. This is called **p-hacking**. That is why you must tighten the threshold when you run many tests.

  - kind: problem
    id: gummibaerchen
    widget: choice
    body: A study tests 20 colors of gummy bears for acne. Only green has p < 5 %. The headline reads "Green gummy bears cause acne!"
    prompt: What is the problem?
    params:
      options:
        - { label: "With 20 tests, one chance hit is expected.", correct: true }
        - { label: Green is a special color., feedback: "Green simply got lucky in chance's game of dice." }
    hints:
      - How many chance hits do you expect in 20 tests?
    explanation: Exactly one, and it became the headline.

  - kind: problem
    id: grenze
    widget: numeric
    prompt: A simple correction divides the 5 % threshold by the number of tests. What threshold applies for {{n}} tests?
    params: { unit: "%" }
    answer: { value: "{{5 / n}}" }
    hints:
      - "5 ÷ {{n}}."
    explanation: "5 ÷ {{n}} = {{5 / n}} %. This keeps the overall false-alarm rate at 5 %."
    variants:
      params: { n: "choice[2,4,5,10]" }
      defaults: { n: 10 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A study tests 1000 hypotheses. 100 of them are really true. The power is 80%, the threshold 5%. How many of the “significant” results are false alarms?
    params:
      options:
        - label: About 45 of 125 – roughly a third
          correct: true
        - label: About 5%
          feedback: "5% applies to the 900 false hypotheses: that is 45 false alarms beside 80 true hits."
        - label: None
          feedback: False alarms always occur.
    hints:
      - "True hits: 80% of 100. False alarms: 5% of 900."
    explanation: 80 true and 45 false. The share of false findings depends on the **base rate** of true hypotheses – Bayes says hello.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: you test 20 useless remedies at the 5% threshold. How likely is at least one false hit?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 64
      tolerance: 10
    explanation: About 64%, since 0.95²⁰ ≈ 0.36. Whoever tests enough almost surely finds something.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Many famous studies could not be confirmed when repeated. What is this called?
    params:
      options:
        - label: Replication crisis
          correct: true
        - label: Plagiarism scandal
          feedback: It was not about copying but about shaky results.
        - label: Placebo effect
          feedback: That concerns patients, not studies.
    hints:
      - A result is only reliable when others find it again.
    explanation: "Causes: small samples, p-hacking and journals that only print “positive” results."
    difficulty: 3

srs:
  cards_from: [zwanzig, gummibaerchen]
