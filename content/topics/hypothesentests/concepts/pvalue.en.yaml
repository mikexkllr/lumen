id: stats.testing.pvalue
type: concept
title: The p-value
summary: And what it does not mean.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Someone tosses a coin ten times and shows heads ten times. What do you think?
    params:
      options:
        - label: The coin is probably rigged
          correct: true
        - label: Pure chance
          feedback: With a fair coin that happens only once in 1024 cases.
        - label: Tails must come next
          feedback: The coin has no memory.
    hints:
      - How often does that happen with a fair coin?
    explanation: You just reasoned like a statistical test.

  - kind: explain
    id: s1
    body: |
      The **p-value** is the probability of seeing a result at least this extreme **if** the null hypothesis is true. A result under 5 % is often called **significant**.

  - kind: problem
    id: signifikant
    widget: choice
    prompt: Three studies, a threshold of 5 %. Which one is significant?
    params:
      options:
        - { label: "p = 3 %", correct: true }
        - { label: "p = 8 %", feedback: "8 % is above the threshold." }
        - { label: "p = 12 %", feedback: "12 % is well above the threshold." }
    hints:
      - Significant means below the threshold.
    explanation: Only 3 % is below 5 %.

  - kind: problem
    id: falle
    widget: choice
    prompt: "p = 3 %. What does that mean?"
    params:
      options:
        - { label: "If there were no effect, such a result would be rare.", correct: true }
        - { label: "There is a 3 % chance that there is no effect.", feedback: "The most common mistake. The p-value assumes the null hypothesis. It doesn't rate it." }
        - { label: "The effect is large.", feedback: "Even tiny effects become significant with lots of data." }
    hints:
      - "Read the definition closely: \"if the null hypothesis is true\"."
    explanation: The p-value says how surprising the data would be, not how true a hypothesis is.

  - kind: problem
    id: gross
    widget: choice
    prompt: A huge study finds that a drug significantly lowers blood pressure, by 0.1 mmHg. Is that important?
    params:
      options:
        - { label: Hardly. Significant does not mean meaningful., correct: true }
        - { label: "Yes, it is significant.", feedback: "With enough data, any tiny effect becomes significant." }
    hints:
      - Can a person feel 0.1 mmHg?
    explanation: Besides the p-value, the **effect size** always matters.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: "p = 3% means: with 97% there is a real effect."
          right: false
          why: The p-value says nothing about the probability of the hypothesis.
        - text: "A small p-value means: the data fit the null hypothesis poorly."
          right: true
        - text: Significant means important.
          right: false
          why: A tiny effect can be significant.
        - text: The 5% threshold is a convention, not a law of nature.
          right: true

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Is the result significant at the 5% threshold?
    params:
      buckets:
        - id: b1
          label: Significant
        - id: b2
          label: Not significant
      items:
        - label: p = 0.03
          bucket: b1
        - label: p = 0.20
          bucket: b2
        - label: p = 0.001
          bucket: b1
        - label: p = 0.07
          bucket: b2
    hints:
      - 5% is 0.05.
    explanation: "Significant means: p is below 0.05."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The p-value tells how likely the result would be [[if]] only chance were at work. Below [[5%]] it is called significant.
      distractors:
        - because
        - 50%

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Two studies test the same drug. Study A: p = 4%. Study B: p = 6%. How should that be read?"
    params:
      options:
        - label: Both show almost the same – the threshold at 5% is arbitrary
          correct: true
        - label: A proves the effect, B refutes it
          feedback: No statistics separate that sharply.
        - label: The studies contradict each other
          feedback: They actually agree well.
    hints:
      - Is the difference between 4% and 6% large?
    explanation: The difference between “significant” and “not significant” is itself often not significant.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "The null hypothesis says: mean 100, spread 10. Set the curve and read off how much lies between 80 and 120."
    params:
      scene: normal
      interval:
        - 80
        - 120
    answer:
      mean: 100
      sd: 10
    explanation: About 95%. Only about 5% lie further out. That is the usual threshold for “significant”.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Experts say: do not just report the p-value. What should you add?"
    params:
      options:
        - label: Effect size and confidence interval – how large is the effect, and how uncertain?
          correct: true
        - label: More decimal places for the p-value
          feedback: More precise does not make it more meaningful.
        - label: A stricter threshold of 0.1%
          feedback: Even then p says nothing about the size of the effect.
    hints:
      - "What does a patient want to know: whether it works – or how strongly?"
    explanation: An interval shows size **and** uncertainty at a glance.
    difficulty: 3

srs:
  cards_from: [falle, gross]
