id: stats.testing.interval
type: concept
title: "Confidence intervals"
summary: "How exact is a measured number? The range around it tells you."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: "A poll reports: “Party A is at 30%.” What is missing from this statement?"
    params:
      options:
        - label: How exact the number is
          correct: true
        - label: Nothing
          feedback: Only a small part of all people was asked.
        - label: The weather on polling day
          feedback: That does not matter.
    hints:
      - Not everyone was asked.
    explanation: "Every number from a sample varies. The question is: how much?"

  - kind: explain
    id: c2
    body: "A **confidence interval** is a range around the measured value that probably contains the true value. 95% is usual: out of 100 such ranges about 95 hit the true value."

  - kind: problem
    id: c3
    widget: numeric
    prompt: A poll measures 30% with a margin of error of ± 3 points. Where is the upper end of the range?
    params:
      unit: "%"
    answer:
      value: 33
    hints:
      - 30 + 3.
    explanation: The range runs from 27 to 33%.

  - kind: problem
    id: c4
    widget: choice
    prompt: Party A has 30% ± 3, party B has 32% ± 3. Is B surely ahead?
    params:
      options:
        - label: No – the ranges overlap
          correct: true
        - label: Yes – 32 is more than 30
          feedback: A might be at 33 and B at 29.
        - label: A is ahead
          feedback: That cannot be said either.
    hints:
      - Which values are possible for A and B?
    explanation: A lead inside the margin is no secure lead.

  - kind: problem
    id: c5
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: More respondents make the range narrower.
          right: true
        - text: A 99% range is narrower than a 95% range.
          right: false
          why: Whoever wants more certainty needs a wider range.
        - text: A narrow range stands for a precise measurement.
          right: true
        - text: The range does not depend on how much the data vary.
          right: false
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The standard error is the spread divided by the square root of n. The spread is 20, with 100 measurements. What is the standard error?
    answer:
      value: 2
    hints:
      - 20 divided by 10.
    explanation: 20 ÷ √100 = 2. That is how precisely the mean is known.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Rule of thumb for 95%: mean ± 2 standard errors. The mean is 50, the standard error 1.5. Where is the lower end?"
    answer:
      value: 47
    hints:
      - 50 − 2 · 1.5.
    explanation: The range runs from 47 to 53.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A drug lowers blood pressure by 2 points on average. The 95% range runs from −1 to 5. Is the effect secure?
    params:
      options:
        - label: No – zero lies in the range
          correct: true
        - label: Yes – 2 is greater than 0
          feedback: The true value might also be 0 or negative.
        - label: Yes – the range is wide
          feedback: Width indicates uncertainty.
    hints:
      - Can “no effect” still be true?
    explanation: If the range contains zero, the result is not significant. Interval and p-value say the same.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "The mean is 100, the standard error 5. Check the rule of thumb: do about 95% really lie between 90 and 110?"
    params:
      scene: normal
      interval:
        - 90
        - 110
    answer:
      mean: 100
      sd: 5
    explanation: "Yes: 95.4%. The mean plus and minus two standard errors."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What exactly does “95% confidence” mean?
    params:
      options:
        - label: The method hits the true value in 95% of all cases
          correct: true
        - label: The true value jumps into this range 95% of the time
          feedback: The true value is fixed. The range is random.
        - label: 95% of the data lie in the range
          feedback: It is about the mean, not single data points.
    hints:
      - What changes from sample to sample?
    explanation: The 95% describe the method, not the one range. Even experts overlook this subtlety.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: You want to shrink the range to a third of its width. How many times as many measurements do you need?
    answer:
      value: 9
    hints:
      - The width shrinks with the square root of n.
    explanation: √9 = 3. Three times the precision costs nine times the effort.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Tell Lux why a measured number without a margin of error is worth little.
    params:
      keywords:
        - - genau
          - sicher
          - precise
          - exact
          - certain
        - - bereich
          - spanne
          - intervall
          - range
          - margin
          - interval
        - - zufall
          - stichprobe
          - chance
          - sample
          - random
      sample: Every measurement from a sample varies by chance. Only the margin shows how precise the number is – and whether a difference can be real.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "d2"]
