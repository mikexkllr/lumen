id: stats.testing.idea
type: concept
title: Chance or real?
summary: The idea of a test.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: muenze
    widget: choice
    prompt: A coin shows heads 9 times in 10 flips. Is it rigged?
    params:
      options:
        - { label: Suspicious. For a fair coin this would be very rare., correct: true }
        - { label: Surely rigged, feedback: "Rare doesn't mean impossible. Fair coins do this sometimes too." }
        - { label: Completely normal, feedback: "With a fair coin, 9 of 10 happens in only about 1 % of cases." }
    hints:
      - How often does this happen with a fair coin?
    explanation: You can never know for sure. You only learn how surprising the result would be.

  - kind: explain
    id: s2
    body: |
      A **hypothesis test** asks: suppose there is no effect (the **null hypothesis**). How likely is a result this extreme? If it is very unlikely, you doubt the null hypothesis.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: With 10 flips there are 1024 equally likely outcomes. 11 of them have 9 or 10 heads. About what percent is that?
    params: { unit: "%" }
    answer: { value: 1.07, tolerance: 0.1 }
    hints:
      - 11 divided by 1024.
    explanation: About 1 %. That is very surprising for a fair coin.

  - kind: problem
    id: nullhypothese
    widget: choice
    prompt: A new drug is being tested. What is the null hypothesis?
    params:
      options:
        - { label: The drug does not work., correct: true }
        - { label: The drug works., feedback: "The null hypothesis is always \"no effect\". It is the one you try to refute." }
    hints:
      - Null as in "nothing happens".
    explanation: You try to make "no effect" unbelievable with data.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "The [[null hypothesis]] says: there is no effect. If the result is very [[unlikely]] under this assumption, you [[reject]] it."
      distractors:
        - prove
        - frequent

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A coin shows heads 8 times in 10 tosses. Of the 1024 outcomes 56 have at least 8 heads. What is this p-value in percent? To one place.
    params:
      unit: "%"
    answer:
      value: 5.5
      tolerance: 0.1
    hints:
      - 56 divided by 1024.
    explanation: 5.5% – just above the usual threshold. 8 of 10 is not yet proof of a biased coin.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A test gives p = 40%. The null hypothesis is not rejected. Does that **prove** there is no effect?
    params:
      options:
        - label: No – the study may simply have been too small to find it
          correct: true
        - label: Yes – a high p-value proves the null hypothesis
          feedback: Absence of evidence is not evidence of absence.
        - label: Yes, with 40% certainty
          feedback: The p-value is not a probability of the hypothesis.
    hints:
      - What do you find with only 10 test subjects?
    explanation: You can only reject the null hypothesis or **fail to reject** it – never confirm it.
    difficulty: 3

srs:
  cards_from: [muenze, nullhypothese]
