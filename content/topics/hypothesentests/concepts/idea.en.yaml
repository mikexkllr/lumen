id: stats.testing.idea
type: concept
title: Chance or real?
summary: The idea of a test.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: muenze
    widget: choice
    prompt: A coin shows heads 9 times in 10 flips. Is it rigged?
    params:
      options:
        - { label: Suspicious. For a fair coin this would be very rare., correct: true }
        - { label: Surely rigged, feedback: "Rare doesn't mean impossible. Fair coins do this sometimes too." }
        - { label: Completely normal, feedback: "With a fair coin, 9 of 10 happens in only about 1 % of cases." }
    hints:
      - How often does this happen with a fair coin?
    explanation: You can never know for sure. You only learn how surprising the result would be.

  - kind: explain
    id: s2
    body: |
      A **hypothesis test** asks: suppose there is no effect (the **null hypothesis**). How likely is a result this extreme? If it is very unlikely, you doubt the null hypothesis.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: With 10 flips there are 1024 equally likely outcomes. 11 of them have 9 or 10 heads. About what percent is that?
    params: { unit: "%" }
    answer: { value: 1.07, tolerance: 0.1 }
    hints:
      - 11 divided by 1024.
    explanation: About 1 %. That is very surprising for a fair coin.

  - kind: problem
    id: nullhypothese
    widget: choice
    prompt: A new drug is being tested. What is the null hypothesis?
    params:
      options:
        - { label: The drug does not work., correct: true }
        - { label: The drug works., feedback: "The null hypothesis is always \"no effect\". It is the one you try to refute." }
    hints:
      - Null as in "nothing happens".
    explanation: You try to make "no effect" unbelievable with data.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "The [[null hypothesis]] says: there is no effect. If the result is very [[unlikely]] under this assumption, you [[reject]] it."
      distractors:
        - prove
        - frequent

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A coin shows heads 8 times in 10 tosses. Of the 1024 outcomes 56 have at least 8 heads. What is this p-value in percent? To one place.
    params:
      unit: "%"
    answer:
      value: 5.5
      tolerance: 0.1
    hints:
      - 56 divided by 1024.
    explanation: 5.5% – just above the usual threshold. 8 of 10 is not yet proof of a biased coin.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: With 10 flips, 11 of the 1024 outcomes have 9 or 10 heads. Equally extreme would be 9 or 10 tails. What is the two-sided p-value in percent? To two decimals.
    answer:
      value: 2.15
      tolerance: 0.02
    feedback:
      - when: abs(numval(state.input) - 1.07) < 0.02
        misconception: one-sided
        text: That is the one-sided value. A loaded coin could also favour tails.
    hints:
      - "Count both tails: 11 + 11 = 22 outcomes."
      - Compute 22 ÷ 1024.
    explanation: 22/1024 ≈ 2.15 %. You test two-sided when deviations in both directions count. That must be decided before looking at the data.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: A lady claims she can taste whether milk or tea went in first. Of 8 cups, 4 are »milk first«. She finds all 4. There are 70 ways to pick 4 of 8. P-value in percent, to two decimals?
    answer:
      value: 1.43
      tolerance: 0.02
    hints:
      - If she is guessing, each of the 70 selections is equally likely.
      - "Only one of them is fully correct: 1 ÷ 70."
    explanation: "1/70 ≈ 1.43 %. Ronald Fisher used this experiment in 1935 to explain the idea of a test: work out how often pure guessing does this well."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A test gives p = 40%. The null hypothesis is not rejected. Does that **prove** there is no effect?
    params:
      options:
        - label: No – the study may simply have been too small to find it
          correct: true
        - label: Yes – a high p-value proves the null hypothesis
          feedback: Absence of evidence is not evidence of absence.
        - label: Yes, with 40% certainty
          feedback: The p-value is not a probability of the hypothesis.
    hints:
      - What do you find with only 10 test subjects?
    explanation: You can only reject the null hypothesis or **fail to reject** it – never confirm it.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "A permutation test: group A scores 5 points more on average than B. How do you check without a formula whether that could be chance?"
    params:
      options:
        - label: Shuffle the group labels a thousand times and count how often 5 points or more come out
          correct: true
        - label: No new measurements are needed – only reshuffling.
          feedback: Neue Messungen braucht man nicht – nur neues Mischen.
        - label: That changes the result artificially.
          feedback: Das verändert das Ergebnis künstlich.
    hints:
      - If there is no effect, the labels A and B do not matter.
      - The share of shuffles with ≥ 5 points is the p-value.
    explanation: That way the computer creates the world of the null hypothesis itself. The test needs no bell curve – just chance and computing time.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A test resembles a proof by contradiction. Where is the difference?
    params:
      options:
        - label: The contradiction is not certain, only improbable
          correct: true
        - label: A maths proof is certain; a test can be wrong.
          feedback: Ein Mathe-Beweis ist sicher, ein Test kann irren.
        - label: "You assume the opposite: no effect."
          feedback: "Man nimmt das Gegenteil an: keinen Effekt."
    hints:
      - What do you assume at the start?
      - Can a rare result happen anyway?
    explanation: You assume H₀ and show that the data would then be very unlikely. With a 5 % threshold you err in 5 % of the cases where H₀ is true.
    difficulty: 3

srs:
  cards_from: [muenze, nullhypothese]
