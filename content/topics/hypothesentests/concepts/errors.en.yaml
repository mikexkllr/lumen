id: stats.testing.errors
type: concept
title: False alarms and misses
summary: The two kinds of error.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: The smoke alarm beeps although only toast is burning. What is that?
    params:
      options:
        - label: A false alarm
          correct: true
        - label: A missed fire
          feedback: There is no fire at all.
        - label: A correct hit
          feedback: There was no fire.
    hints:
      - Was there really a fire?
    explanation: "The other error would be worse: there is a fire and it stays silent."

  - kind: explain
    id: s1
    body: |
      A test can be wrong in two ways. It can report an effect that does not exist (**Type I error**, a false alarm). Or it can miss a real effect (**Type II error**).

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Which error is this?
    params:
      buckets: [{ label: false alarm }, { label: miss }]
      items:
        - { label: Smoke alarm beeps while you make toast, bucket: false alarm }
        - { label: A useless drug is considered effective, bucket: false alarm }
        - { label: A test fails to detect a real disease, bucket: miss }
        - { label: Spam filter lets spam through, bucket: miss }
    hints:
      - Was something reported that wasn't there, or not reported though it was there?
    explanation: Both errors have a cost. Which is worse depends on the case.

  - kind: problem
    id: grenze
    widget: choice
    prompt: You lower the significance level from 5 % to 1 %. What happens?
    params:
      options:
        - { label: "Fewer false alarms, but more missed effects", correct: true }
        - { label: Both errors become rarer, feedback: "Stricter also means you are more likely to miss real effects." }
    hints:
      - A stricter guard dog barks less often, even at real burglars.
    explanation: The two errors are a trade-off. Only more data improves both.

  - kind: problem
    id: daten
    widget: choice
    prompt: How do you reduce both errors at the same time?
    params:
      options:
        - { label: With a larger sample, correct: true }
        - { label: With a different threshold, feedback: "The threshold only shifts risk between the two errors." }
    hints:
      - What makes results less random?
    explanation: More data gives a sharper picture and fewer mistakes in both directions.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Which error is this?
    params:
      buckets:
        - id: b1
          label: False alarm
        - id: b2
          label: Miss
      items:
        - label: Smoke alarm beeps without fire
          bucket: b1
        - label: Test misses an illness
          bucket: b2
        - label: Spam filter deletes a real mail
          bucket: b1
        - label: Guard sleeps through the break-in
          bucket: b2
    hints:
      - Was something reported that was not there – or something missed?
    explanation: Whoever makes one error less often usually makes the other more often.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A smoke detector can give a false alarm or miss a fire. Which error is more acceptable?
    params:
      options:
        - label: The false alarm – a missed fire is far worse
          correct: true
        - label: The missed fire
          feedback: The consequences would be catastrophic.
        - label: Both are equally bad
          feedback: The costs are very different.
    hints:
      - What does each of the two errors cost?
    explanation: The right threshold depends on the **costs** of the errors. In court the false alarm weighs more.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: Does this raise or lower a test's power?
    params:
      buckets:
        - id: b1
          label: More power
        - id: b2
          label: Less power
      items:
        - label: More participants
          bucket: b1
        - label: Larger true effect
          bucket: b1
        - label: More precise measurements
          bucket: b1
        - label: "Stricter threshold: 1 % not 5 %"
          bucket: b2
        - label: More noise in the data
          bucket: b2
    hints:
      - Power is the chance of finding a real effect.
      - What makes a signal easier to tell from noise?
    explanation: Power grows with sample size, effect size and precision. A stricter threshold cuts false alarms, but power too.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: The effect size (Cohen's d) is the difference in means divided by the standard deviation. Group A averages {{a}}, group B {{b}}, σ = {{s}}. What is d?
    answer:
      value: "{{(a - b) / s}}"
    hints:
      - "Difference: {{a - b}}."
      - Divide by {{s}}.
    explanation: "d = {{(a - b) / s}}. Rule of thumb: 0.2 small, 0.5 medium, 0.8 large. Unlike p, d does not depend on sample size."
    difficulty: 2
    variants:
      params:
        b: choice[50,100]
        s: choice[5,10,20]
        k: choice[1,2,4,8]
      derive:
        a: b + k * s / 4
      defaults:
        b: 100
        s: 10
        k: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The **power** of a test is the probability of finding a real effect. A study misses a real effect with 20%. What is its power in percent?
    params:
      unit: "%"
    answer:
      value: 80
    hints:
      - 100% minus the probability of a type II error.
    explanation: 80% counts as the minimum. Many older studies had below 50% – their results are hardly reliable.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: For d = 0.5 and 80 % power you need about 64 people per group. How many do you need for d = 0.25?
    answer:
      value: 256
    feedback:
      - when: numval(state.input) == 128
        misconception: linear-n
        text: The required sample grows with 1/d², not with 1/d.
    hints:
      - Half the effect – how much more data?
      - The margin shrinks with √n. Half the margin needs 4 times as many.
    explanation: 4 · 64 = 256 per group. Proving small effects reliably is expensive – that is why many studies are too small.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A small study (20 per group) finds a significant, huge effect. What is suspicious?
    params:
      options:
        - label: With low power only exaggerated estimates make it past the threshold
          correct: true
        - label: With low power the effect found is usually too big.
          feedback: Bei wenig Power ist der gefundene Effekt meist zu groß.
        - label: 20 per group is rather few.
          feedback: 20 pro Gruppe ist eher wenig.
    hints:
      - How large must a randomly estimated effect be for a small study to find it significant?
      - Only lucky draws with a big swing get through.
    explanation: "That is the winner's curse: with low power, significant results systematically overstate the effect. Replications then find smaller values."
    difficulty: 3

srs:
  cards_from: [sortieren, grenze]
