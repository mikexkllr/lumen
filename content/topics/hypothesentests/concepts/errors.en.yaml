id: stats.testing.errors
type: concept
title: False alarms and misses
summary: The two kinds of error.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      A test can be wrong in two ways. It can report an effect that does not exist (**Type I error**, a false alarm). Or it can miss a real effect (**Type II error**).

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Which error is this?
    params:
      buckets: [{ label: false alarm }, { label: miss }]
      items:
        - { label: Smoke alarm beeps while you make toast, bucket: false alarm }
        - { label: A useless drug is considered effective, bucket: false alarm }
        - { label: A test fails to detect a real disease, bucket: miss }
        - { label: Spam filter lets spam through, bucket: miss }
    hints:
      - Was something reported that wasn't there, or not reported though it was there?
    explanation: Both errors have a cost. Which is worse depends on the case.

  - kind: problem
    id: grenze
    widget: choice
    prompt: You lower the significance level from 5 % to 1 %. What happens?
    params:
      options:
        - { label: "Fewer false alarms, but more missed effects", correct: true }
        - { label: Both errors become rarer, feedback: "Stricter also means you are more likely to miss real effects." }
    hints:
      - A stricter guard dog barks less often, even at real burglars.
    explanation: The two errors are a trade-off. Only more data improves both.

  - kind: problem
    id: daten
    widget: choice
    prompt: How do you reduce both errors at the same time?
    params:
      options:
        - { label: With a larger sample, correct: true }
        - { label: With a different threshold, feedback: "The threshold only shifts risk between the two errors." }
    hints:
      - What makes results less random?
    explanation: More data gives a sharper picture and fewer mistakes in both directions.

srs:
  cards_from: [sortieren, grenze]
