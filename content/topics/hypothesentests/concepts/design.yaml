id: stats.testing.design
type: concept
title: Gute Studien
summary: Wie man sich selbst nicht täuscht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Schritte einer sauberen Studie in die richtige Reihenfolge.
    params:
      items:
        - { label: Hypothese und Auswertung vorher festlegen }
        - { label: Teilnehmende zufällig auf Gruppen verteilen }
        - { label: Daten erheben }
        - { label: Wie geplant auswerten }
    hints:
      - Was muss feststehen, bevor man die Daten sieht?
    explanation: Wer vorher festlegt, was er testet, kann nicht hinterher passend suchen.

  - kind: explain
    id: s2
    body: |
      Der Goldstandard ist die **randomisierte, verblindete Studie**: Zufall verteilt die Gruppen, und niemand weiß, wer das echte Mittel bekommt. Placebo-Effekte und Erwartungen fallen so heraus.

  - kind: problem
    id: blind
    widget: choice
    prompt: Warum wissen in guten Studien auch die Ärztinnen nicht, wer das echte Mittel bekommt?
    params:
      options:
        - { label: Ihre Erwartungen könnten die Beurteilung färben., correct: true }
        - { label: Aus Datenschutzgründen, feedback: "Es geht um unbewusste Einflüsse auf das Ergebnis." }
    hints:
      - Wer bewertet die Symptome?
    explanation: Doppelt verblindet schützt vor Erwartungen auf beiden Seiten.

  - kind: problem
    id: gut
    widget: buckets
    prompt: Gute oder schlechte Praxis?
    params:
      buckets: [{ label: gut }, { label: schlecht }]
      items:
        - { label: Studie vorab registrieren, bucket: gut }
        - { label: Ergebnis wiederholen lassen, bucket: gut }
        - { label: Nur positive Ergebnisse veröffentlichen, bucket: schlecht }
        - { label: "Daten sammeln, bis p unter 5 % fällt", bucket: schlecht }
    hints:
      - Was macht Ergebnisse vertrauenswürdig?
    explanation: Wiederholbarkeit und Vorab-Festlegung sind die beste Medizin gegen Zufallsfunde.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zeitschriften drucken lieber Studien mit Effekt als solche ohne. Was folgt daraus für die veröffentlichte Forschung?
    params:
      options:
        - label: Effekte werden überschätzt – die erfolglosen Versuche bleiben in der Schublade
          correct: true
        - label: Die Forschung wird genauer
          feedback: Sie wird einseitiger.
        - label: Nichts
          feedback: Die veröffentlichte Auswahl ist verzerrt.
    hints:
      - Welche Studien fehlen in der Auswahl?
    explanation: Der **Publikationsbias** – die Falle der Überlebenden in der Wissenschaft.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: match
    prompt: Welche Maßnahme schützt vor welcher Verzerrung?
    params:
      pairs:
        - left: Auswahl der Gruppen
          right: Randomisierung
        - left: Erwartungen der Beteiligten
          right: Verblindung
        - left: Abbrecher fallen weg
          right: Alle wie zugeteilt auswerten
        - left: Nachträgliches Rosinenpicken
          right: Vorregistrierung
      leftTitle: Gefahr
      rightTitle: Schutz
    hints:
      - Randomisieren verteilt alle Störfaktoren gleich.
      - Wer nicht weiß, wer das Mittel bekommt, kann nicht unbewusst lenken.
    explanation: Jeder Baustein einer guten Studie schließt eine bestimmte Lücke. Fehlt einer, kann ein Scheineffekt hindurchschlüpfen.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "Man trägt viele Studien zu einem Mittel in ein Diagramm ein: Effekt gegen Studiengröße. Kleine Studien mit kleinem Effekt fehlen auffällig. Was deutet das an?"
    params:
      options:
        - label: Publikationsverzerrung – erfolglose kleine Studien blieben in der Schublade
          correct: true
        - label: Kleine Studien sind immer besser
          feedback: Kleine Studien streuen mehr, in beide Richtungen.
        - label: Das Mittel wirkt besonders gut
          feedback: Die Lücke spricht eher für verzerrte Veröffentlichung.
    hints:
      - Kleine Studien sollten nach links und rechts streuen.
      - Wenn eine Seite fehlt – wer hat sie nicht veröffentlicht?
    explanation: Der **Trichtergraph** sollte symmetrisch sein. Ein schiefer Trichter verrät, dass Ergebnisse ohne Effekt fehlen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein p-Wert ist – und was er **nicht** ist.
    params:
      keywords:
        - - nullhypothese
          - kein effekt
          - keinen effekt
          - null hypothesis
          - no effect
          - zufall
          - chance
        - - wahrscheinlich
          - probab
          - likely
        - - daten
          - ergebnis
          - extrem
          - data
          - result
          - extreme
        - - nicht
          - not
          - hypothese
          - hypothesis
          - beweis
          - proof
          - wichtig
          - important
      min: 3
      sample: Der p-Wert sagt, wie wahrscheinlich ein so extremes Ergebnis wäre, wenn es keinen Effekt gäbe. Er ist nicht die Wahrscheinlichkeit, dass die Hypothese stimmt, und sagt nichts darüber, wie groß oder wichtig der Effekt ist.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: In einer Studie brechen viele Kranke aus der Medikamentengruppe ab, weil es ihnen schlecht geht. Wie wertet man fair aus?
    params:
      options:
        - label: Alle so auswerten, wie sie zugeteilt wurden – auch die Abbrecher
          correct: true
        - label: Nur die auswerten, die durchgehalten haben
          feedback: Dann bleiben vor allem die Gesünderen – das Mittel wirkt zu gut.
        - label: Die Abbrecher der Placebo-Gruppe zuschlagen
          feedback: Das zerstört die Randomisierung.
    hints:
      - Wer bricht ab – zufällige Leute oder bestimmte?
      - Die Zufallszuteilung schützt nur, wenn man sie beibehält.
    explanation: Das **Intention-to-treat**-Prinzip erhält die Vergleichbarkeit der Gruppen. Es misst die Wirkung der Entscheidung »wir behandeln«, samt Nebenwirkungen.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Bei **Registered Reports** prüft ein Fachblatt nur den Plan. Daten gibt es noch keine. Es sagt den Druck fest zu. Was ändert das?
    params:
      options:
        - label: Das Ergebnis entscheidet nicht mehr über die Veröffentlichung
          correct: true
        - label: Studien werden billiger
          feedback: Der Aufwand bleibt gleich.
        - label: Nur positive Studien erscheinen
          feedback: Genau das Gegenteil wird erreicht.
    hints:
      - Wann fällt die Entscheidung der Zeitschrift?
      - Vor den Daten kennt niemand das Ergebnis.
    explanation: Bei Registered Reports zeigen deutlich mehr Studien keinen Effekt als sonst – ein Hinweis darauf, wie stark die übliche Auswahl verzerrt.
    difficulty: 3

srs:
  cards_from: [ablauf, blind]
