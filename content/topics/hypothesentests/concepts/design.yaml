id: stats.testing.design
type: concept
title: Gute Studien
summary: Wie man sich selbst nicht täuscht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Schritte einer sauberen Studie in die richtige Reihenfolge.
    params:
      items:
        - { label: Hypothese und Auswertung vorher festlegen }
        - { label: Teilnehmende zufällig auf Gruppen verteilen }
        - { label: Daten erheben }
        - { label: Wie geplant auswerten }
    hints:
      - Was muss feststehen, bevor man die Daten sieht?
    explanation: Wer vorher festlegt, was er testet, kann nicht hinterher passend suchen.

  - kind: explain
    id: s2
    body: |
      Der Goldstandard ist die **randomisierte, verblindete Studie**: Zufall verteilt die Gruppen, und niemand weiß, wer das echte Mittel bekommt. Placebo-Effekte und Erwartungen fallen so heraus.

  - kind: problem
    id: blind
    widget: choice
    prompt: Warum wissen in guten Studien auch die Ärztinnen nicht, wer das echte Mittel bekommt?
    params:
      options:
        - { label: Ihre Erwartungen könnten die Beurteilung färben., correct: true }
        - { label: Aus Datenschutzgründen, feedback: "Es geht um unbewusste Einflüsse auf das Ergebnis." }
    hints:
      - Wer bewertet die Symptome?
    explanation: Doppelt verblindet schützt vor Erwartungen auf beiden Seiten.

  - kind: problem
    id: gut
    widget: buckets
    prompt: Gute oder schlechte Praxis?
    params:
      buckets: [{ label: gut }, { label: schlecht }]
      items:
        - { label: Studie vorab registrieren, bucket: gut }
        - { label: Ergebnis wiederholen lassen, bucket: gut }
        - { label: Nur positive Ergebnisse veröffentlichen, bucket: schlecht }
        - { label: "Daten sammeln, bis p unter 5 % fällt", bucket: schlecht }
    hints:
      - Was macht Ergebnisse vertrauenswürdig?
    explanation: Wiederholbarkeit und Vorab-Festlegung sind die beste Medizin gegen Zufallsfunde.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zeitschriften drucken lieber Studien mit Effekt als solche ohne. Was folgt daraus für die veröffentlichte Forschung?
    params:
      options:
        - label: Effekte werden überschätzt – die erfolglosen Versuche bleiben in der Schublade
          correct: true
        - label: Die Forschung wird genauer
          feedback: Sie wird einseitiger.
        - label: Nichts
          feedback: Die veröffentlichte Auswahl ist verzerrt.
    hints:
      - Welche Studien fehlen in der Auswahl?
    explanation: Der **Publikationsbias** – die Falle der Überlebenden in der Wissenschaft.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein p-Wert ist – und was er **nicht** ist.
    params:
      keywords:
        - - nullhypothese
          - kein effekt
          - keinen effekt
          - null hypothesis
          - no effect
          - zufall
          - chance
        - - wahrscheinlich
          - probab
          - likely
        - - daten
          - ergebnis
          - extrem
          - data
          - result
          - extreme
        - - nicht
          - not
          - hypothese
          - hypothesis
          - beweis
          - proof
          - wichtig
          - important
      min: 3
      sample: Der p-Wert sagt, wie wahrscheinlich ein so extremes Ergebnis wäre, wenn es keinen Effekt gäbe. Er ist nicht die Wahrscheinlichkeit, dass die Hypothese stimmt, und sagt nichts darüber, wie groß oder wichtig der Effekt ist.
    difficulty: 3

srs:
  cards_from: [ablauf, blind]
