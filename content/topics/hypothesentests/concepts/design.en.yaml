id: stats.testing.design
type: concept
title: Good studies
summary: How not to fool yourself.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the steps of a sound study in the right order.
    params:
      items:
        - { label: Set the hypothesis and analysis in advance }
        - { label: Assign participants to groups at random }
        - { label: Collect the data }
        - { label: Analyze as planned }
    hints:
      - What must be settled before you see the data?
    explanation: If you decide in advance what you test, you can't go looking for a fit afterward.

  - kind: explain
    id: s2
    body: |
      The gold standard is the **randomized, blinded study**. Chance assigns the groups, and nobody knows who gets the real treatment. This removes placebo effects and expectations.

  - kind: problem
    id: blind
    widget: choice
    prompt: Why don't the doctors in good studies know who gets the real treatment either?
    params:
      options:
        - { label: Their expectations could color the assessment., correct: true }
        - { label: For privacy reasons, feedback: "It is about unconscious influences on the result." }
    hints:
      - Who rates the symptoms?
    explanation: Double blinding protects against expectations on both sides.

  - kind: problem
    id: gut
    widget: buckets
    prompt: Good or bad practice?
    params:
      buckets: [{ label: good }, { label: bad }]
      items:
        - { label: Register the study in advance, bucket: good }
        - { label: Have the result replicated, bucket: good }
        - { label: Publish only positive results, bucket: bad }
        - { label: "Collect data until p falls below 5 %", bucket: bad }
    hints:
      - What makes results trustworthy?
    explanation: Replication and advance planning are the best cure for chance findings.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Journals prefer to print studies with an effect over those without. What follows for published research?
    params:
      options:
        - label: Effects are overestimated – the unsuccessful attempts stay in the drawer
          correct: true
        - label: Research becomes more precise
          feedback: It becomes more one-sided.
        - label: Nothing
          feedback: The published selection is biased.
    hints:
      - Which studies are missing from the selection?
    explanation: "**Publication bias** – survivorship bias in science."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: match
    prompt: Which measure protects against which bias?
    params:
      pairs:
        - left: Choice of groups
          right: Randomisation
        - left: Expectations of those involved
          right: Blinding
        - left: Drop-outs disappear
          right: Analyse all as assigned
        - left: Cherry-picking later
          right: Pre-registration
      leftTitle: Threat
      rightTitle: Protection
    hints:
      - Randomising spreads all confounders evenly.
      - Whoever does not know who gets the drug cannot steer unconsciously.
    explanation: Each building block of a good study closes a specific gap. If one is missing, a spurious effect can slip through.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "You plot many studies of a drug: effect against study size. Small studies with small effects are strikingly missing. What does that suggest?"
    params:
      options:
        - label: Publication bias – unsuccessful small studies stayed in the drawer
          correct: true
        - label: Small studies scatter more, in both directions.
          feedback: Kleine Studien streuen mehr, in beide Richtungen.
        - label: The gap rather points to biased publishing.
          feedback: Die Lücke spricht eher für verzerrte Veröffentlichung.
    hints:
      - Small studies should scatter both left and right.
      - If one side is missing – who did not publish it?
    explanation: The funnel plot should be symmetric. A lopsided funnel reveals that null results are missing.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux what a p-value is – and what it is **not**.
    params:
      keywords:
        - - nullhypothese
          - kein effekt
          - keinen effekt
          - null hypothesis
          - no effect
          - zufall
          - chance
        - - wahrscheinlich
          - probab
          - likely
        - - daten
          - ergebnis
          - extrem
          - data
          - result
          - extreme
        - - nicht
          - not
          - hypothese
          - hypothesis
          - beweis
          - proof
          - wichtig
          - important
      min: 3
      sample: The p-value says how likely such an extreme result would be if there were no effect. It is not the probability that the hypothesis is true, and it says nothing about how large or important the effect is.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: In a trial many patients in the drug group drop out because they feel bad. How do you analyse fairly?
    params:
      options:
        - label: Analyse everyone as assigned – including the drop-outs
          correct: true
        - label: Then mostly the healthier remain – the drug looks too good.
          feedback: Dann bleiben vor allem die Gesünderen – das Mittel wirkt zu gut.
        - label: That destroys the randomisation.
          feedback: Das zerstört die Randomisierung.
    hints:
      - Who drops out – random people or particular ones?
      - Random assignment only protects if you keep it.
    explanation: The intention-to-treat principle keeps the groups comparable. It measures the effect of the decision »we treat«, side effects included.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: In registered reports a journal judges the plan before there is any data, and promises to publish. What does this change?
    params:
      options:
        - label: The result no longer decides publication
          correct: true
        - label: The effort stays the same.
          feedback: Der Aufwand bleibt gleich.
        - label: It achieves exactly the opposite.
          feedback: Genau das Gegenteil wird erreicht.
    hints:
      - When does the journal decide?
      - Before the data, nobody knows the result.
    explanation: In registered reports far more studies show no effect than usual – a hint at how strongly ordinary selection distorts.
    difficulty: 3

srs:
  cards_from: [ablauf, blind]
