id: stats.testing.pvalue
type: concept
title: Der p-Wert
summary: Und was er nicht bedeutet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Jemand wirft eine Münze zehnmal und zeigt zehnmal Kopf. Was denkst du?
    params:
      options:
        - label: Die Münze ist wohl gezinkt
          correct: true
        - label: Reiner Zufall
          feedback: Bei einer fairen Münze passiert das nur einmal in 1024 Fällen.
        - label: Jetzt kommt sicher Zahl
          feedback: Die Münze hat kein Gedächtnis.
    hints:
      - Wie oft passiert so etwas mit einer fairen Münze?
    explanation: Du hast gerade wie ein Statistik-Test gedacht.


  - kind: explain
    id: s1
    body: |
      Der **p-Wert** ist die Wahrscheinlichkeit, ein mindestens so extremes Ergebnis zu sehen – **falls** die Nullhypothese stimmt. Unter 5 % nennt man ein Ergebnis oft **signifikant**.

  - kind: problem
    id: signifikant
    widget: choice
    prompt: Drei Studien, eine Grenze von 5 %. Welche ist signifikant?
    params:
      options:
        - { label: "p = 3 %", correct: true }
        - { label: "p = 8 %", feedback: "8 % liegt über der Grenze." }
        - { label: "p = 12 %", feedback: "12 % liegt deutlich über der Grenze." }
    hints:
      - Signifikant heißt – unter der Grenze.
    explanation: Nur 3 % liegt unter 5 %.

  - kind: problem
    id: falle
    widget: choice
    prompt: "p = 3 %. Was bedeutet das?"
    params:
      options:
        - { label: "Gäbe es keinen Effekt, wäre so ein Ergebnis selten.", correct: true }
        - { label: "Mit 3 % Wahrscheinlichkeit gibt es keinen Effekt.", feedback: "Der häufigste Irrtum – der p-Wert setzt die Nullhypothese voraus, er bewertet sie nicht." }
        - { label: "Der Effekt ist groß.", feedback: "Auch winzige Effekte werden mit vielen Daten signifikant." }
    hints:
      - Lies die Definition genau – »falls die Nullhypothese stimmt«.
    explanation: Der p-Wert sagt, wie überraschend die Daten wären – nicht, wie wahr eine Hypothese ist.

  - kind: problem
    id: gross
    widget: choice
    prompt: Eine riesige Studie findet, dass ein Mittel den Blutdruck signifikant senkt – um 0,1 mmHg. Ist das wichtig?
    params:
      options:
        - { label: Kaum – signifikant heißt nicht bedeutsam., correct: true }
        - { label: Ja – es ist ja signifikant., feedback: "Mit genug Daten wird jeder winzige Effekt signifikant." }
    hints:
      - Spürt ein Mensch 0,1 mmHg?
    explanation: Neben dem p-Wert zählt immer die **Effektgröße**.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: "p = 3 % heißt: Mit 97 % gibt es einen echten Effekt."
          right: false
          why: Der p-Wert sagt nichts über die Wahrscheinlichkeit der Hypothese.
        - text: "Ein kleiner p-Wert heißt: Die Daten passen schlecht zur Nullhypothese."
          right: true
        - text: Signifikant heißt wichtig.
          right: false
          why: Ein winziger Effekt kann signifikant sein.
        - text: Die 5-%-Grenze ist eine Konvention, kein Naturgesetz.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Zwei Studien testen dasselbe Mittel. Studie A: p = 4 %. Studie B: p = 6 %. Wie sollte man das lesen?"
    params:
      options:
        - label: Beide zeigen fast dasselbe – die Grenze bei 5 % ist willkürlich
          correct: true
        - label: A beweist die Wirkung, B widerlegt sie
          feedback: So scharf trennt keine Statistik.
        - label: Die Studien widersprechen sich
          feedback: Sie stimmen sogar gut überein.
    hints:
      - Ist der Unterschied zwischen 4 % und 6 % groß?
    explanation: Der Unterschied zwischen »signifikant« und »nicht signifikant« ist selbst oft nicht signifikant.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Statt nur p-Werte zu berichten, fordern Fachleute heute vor allem …?
    params:
      options:
        - label: Effektgröße und Konfidenzintervall – wie groß ist der Effekt, und wie unsicher?
          correct: true
        - label: Mehr Nachkommastellen beim p-Wert
          feedback: Genauer macht ihn nicht aussagekräftiger.
        - label: Eine strengere Grenze von 0,1 %
          feedback: Auch dann sagt p nichts über die Größe des Effekts.
    hints:
      - "Was will ein Patient wissen: ob es wirkt – oder wie stark?"
    explanation: Ein Intervall zeigt Größe **und** Unsicherheit auf einen Blick.
    difficulty: 3

srs:
  cards_from: [falle, gross]
