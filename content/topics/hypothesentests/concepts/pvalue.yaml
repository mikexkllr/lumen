id: stats.testing.pvalue
type: concept
title: Der p-Wert
summary: Und was er nicht bedeutet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Jemand wirft eine Münze zehnmal und zeigt zehnmal Kopf. Was denkst du?
    params:
      options:
        - label: Die Münze ist wohl gezinkt
          correct: true
        - label: Reiner Zufall
          feedback: Bei einer fairen Münze passiert das nur einmal in 1024 Fällen.
        - label: Jetzt kommt sicher Zahl
          feedback: Die Münze hat kein Gedächtnis.
    hints:
      - Wie oft passiert so etwas mit einer fairen Münze?
    explanation: Du hast gerade wie ein Statistik-Test gedacht.

  - kind: explain
    id: s1
    body: |
      Der **p-Wert** ist die Wahrscheinlichkeit, ein mindestens so extremes Ergebnis zu sehen – **falls** die Nullhypothese stimmt. Unter 5 % nennt man ein Ergebnis oft **signifikant**.

  - kind: problem
    id: signifikant
    widget: choice
    prompt: Drei Studien, eine Grenze von 5 %. Welche ist signifikant?
    params:
      options:
        - { label: "p = 3 %", correct: true }
        - { label: "p = 8 %", feedback: "8 % liegt über der Grenze." }
        - { label: "p = 12 %", feedback: "12 % liegt deutlich über der Grenze." }
    hints:
      - Signifikant heißt – unter der Grenze.
    explanation: Nur 3 % liegt unter 5 %.

  - kind: problem
    id: falle
    widget: choice
    prompt: "p = 3 %. Was bedeutet das?"
    params:
      options:
        - { label: "Gäbe es keinen Effekt, wäre so ein Ergebnis selten.", correct: true }
        - { label: "Mit 3 % Wahrscheinlichkeit gibt es keinen Effekt.", feedback: "Der häufigste Irrtum – der p-Wert setzt die Nullhypothese voraus, er bewertet sie nicht." }
        - { label: "Der Effekt ist groß.", feedback: "Auch winzige Effekte werden mit vielen Daten signifikant." }
    hints:
      - Lies die Definition genau – »falls die Nullhypothese stimmt«.
    explanation: Der p-Wert sagt, wie überraschend die Daten wären – nicht, wie wahr eine Hypothese ist.

  - kind: problem
    id: gross
    widget: choice
    prompt: Eine riesige Studie findet, dass ein Mittel den Blutdruck signifikant senkt – um 0,1 mmHg. Ist das wichtig?
    params:
      options:
        - { label: Kaum – signifikant heißt nicht bedeutsam., correct: true }
        - { label: Ja – es ist ja signifikant., feedback: "Mit genug Daten wird jeder winzige Effekt signifikant." }
    hints:
      - Spürt ein Mensch 0,1 mmHg?
    explanation: Neben dem p-Wert zählt immer die **Effektgröße**.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: "p = 3 % heißt: Mit 97 % gibt es einen echten Effekt."
          right: false
          why: Der p-Wert sagt nichts über die Wahrscheinlichkeit der Hypothese.
        - text: "Ein kleiner p-Wert heißt: Die Daten passen schlecht zur Nullhypothese."
          right: true
        - text: Signifikant heißt wichtig.
          right: false
          why: Ein winziger Effekt kann signifikant sein.
        - text: Die 5-%-Grenze ist eine Konvention, kein Naturgesetz.
          right: true

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Ist das Ergebnis bei der 5-%-Schwelle signifikant?
    params:
      buckets:
        - id: b1
          label: Signifikant
        - id: b2
          label: Nicht signifikant
      items:
        - label: p = 0,03
          bucket: b1
        - label: p = 0,20
          bucket: b2
        - label: p = 0,001
          bucket: b1
        - label: p = 0,07
          bucket: b2
    hints:
      - 5 % sind 0,05.
    explanation: "Signifikant heißt: p liegt unter 0,05."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der p-Wert sagt, wie wahrscheinlich das Ergebnis wäre, [[falls]] nur Zufall wirkt. Unter [[5 %]] nennt man es signifikant.
      distractors:
        - weil
        - 50 %

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Zwei Studien testen dasselbe Mittel. Studie A: p = 4 %. Studie B: p = 6 %. Wie sollte man das lesen?"
    params:
      options:
        - label: Beide zeigen fast dasselbe – die Grenze bei 5 % ist willkürlich
          correct: true
        - label: A beweist die Wirkung, B widerlegt sie
          feedback: So scharf trennt keine Statistik.
        - label: Die Studien widersprechen sich
          feedback: Sie stimmen sogar gut überein.
    hints:
      - Ist der Unterschied zwischen 4 % und 6 % groß?
    explanation: Der Unterschied zwischen »signifikant« und »nicht signifikant« ist selbst oft nicht signifikant.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Die Nullhypothese sagt: Mittelwert 100, Streuung 10. Stell die Kurve ein und lies ab, wie viel zwischen 80 und 120 liegt."
    params:
      scene: normal
      interval:
        - 80
        - 120
    answer:
      mean: 100
      sd: 10
    explanation: Rund 95 %. Nur etwa 5 % liegen weiter draußen. Das ist die übliche Schwelle für »signifikant«.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Ein Messwert liegt 2 Standardabweichungen vom Wert der Nullhypothese entfernt. Innerhalb von ± 2σ liegen 95,4 %. Wie groß ist der zweiseitige p-Wert in Prozent?
    answer:
      value: 4.6
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 2.3) < 0.1
        misconception: one-sided
        text: Das ist nur eine Seite. Zweiseitig zählen beide Ränder.
    hints:
      - Außerhalb von ± 2σ liegt der Rest.
      - 100 − 95,4.
    explanation: p ≈ 4,6 % – knapp unter 5 %. Ein z-Wert von 1,96 ergibt genau 5 %.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Eine Studie berichtet p = 1 %. Was folgt daraus?
    params:
      options:
        - label: Gäbe es keinen Effekt, wären so extreme Daten selten
          correct: true
        - label: Die Nullhypothese ist zu 1 % wahr
          feedback: p ist P(Daten | H₀), nicht P(H₀ | Daten).
        - label: Der Effekt ist groß
          feedback: Auch winzige Effekte werden mit vielen Daten signifikant.
        - label: Mit 99 % klappt die Wiederholung
          feedback: Die Chance auf eine erfolgreiche Wiederholung ist viel kleiner.
    hints:
      - In welcher Welt wird der p-Wert berechnet?
      - Er setzt H₀ voraus – er bewertet sie nicht.
    explanation: Der **p-Wert** ist eine Aussage über die Daten unter H₀. Wie wahrscheinlich H₀ selbst ist, sagt erst Bayes – mit einem Prior.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Statt nur p-Werte zu berichten, fordern Fachleute heute vor allem …?
    params:
      options:
        - label: Effektgröße und Konfidenzintervall – wie groß ist der Effekt, und wie unsicher?
          correct: true
        - label: Mehr Nachkommastellen beim p-Wert
          feedback: Genauer macht ihn nicht aussagekräftiger.
        - label: Eine strengere Grenze von 0,1 %
          feedback: Auch dann sagt p nichts über die Größe des Effekts.
    hints:
      - "Was will ein Patient wissen: ob es wirkt – oder wie stark?"
    explanation: Ein Intervall zeigt Größe **und** Unsicherheit auf einen Blick.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Von 1000 getesteten Ideen sind 500 wahr. Power 80 %, Grenze 5 %. Wie viel Prozent der signifikanten Ergebnisse sind falsch? Auf eine Stelle.
    answer:
      value: 5.9
      tolerance: 0.1
    hints:
      - "Echte Treffer: 80 % von 500 = 400. Fehlalarme: 5 % von 500 = 25."
      - "Rechne 25 : 425."
    explanation: 25/425 ≈ 5,9 %. Bei nur 10 % wahren Ideen wären es 36 %. Wie verlässlich »signifikant« ist, hängt vom Prior des Forschungsfelds ab.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Stimmt die Nullhypothese, ist der p-Wert **gleichverteilt** zwischen 0 und 1. Wie oft ist dann p < 0,2? In Prozent.
    answer:
      value: 20
    hints:
      - "Gleichverteilt heißt: Jedes gleich lange Stück ist gleich wahrscheinlich."
      - Das Stück von 0 bis 0,2 ist ein Fünftel.
    explanation: "20 %. Genau deshalb gilt: p < 0,05 passiert unter H₀ in 5 % der Fälle. Ein Haufen von p-Werten knapp unter 0,05 ist darum verdächtig."
    difficulty: 3

srs:
  cards_from: [falle, gross]
