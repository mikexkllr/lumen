id: stats.testing.pvalue
type: concept
title: Der p-Wert
summary: Und was er nicht bedeutet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Der **p-Wert** ist die Wahrscheinlichkeit, ein mindestens so extremes Ergebnis zu sehen – **falls** die Nullhypothese stimmt. Unter 5 % nennt man ein Ergebnis oft **signifikant**.

  - kind: problem
    id: signifikant
    widget: choice
    prompt: Drei Studien, eine Grenze von 5 %. Welche ist signifikant?
    params:
      options:
        - { label: "p = 3 %", correct: true }
        - { label: "p = 8 %", feedback: "8 % liegt über der Grenze." }
        - { label: "p = 12 %", feedback: "12 % liegt deutlich über der Grenze." }
    hints:
      - Signifikant heißt – unter der Grenze.
    explanation: Nur 3 % liegt unter 5 %.

  - kind: problem
    id: falle
    widget: choice
    prompt: "p = 3 %. Was bedeutet das?"
    params:
      options:
        - { label: "Gäbe es keinen Effekt, wäre so ein Ergebnis selten.", correct: true }
        - { label: "Mit 3 % Wahrscheinlichkeit gibt es keinen Effekt.", feedback: "Der häufigste Irrtum – der p-Wert setzt die Nullhypothese voraus, er bewertet sie nicht." }
        - { label: "Der Effekt ist groß.", feedback: "Auch winzige Effekte werden mit vielen Daten signifikant." }
    hints:
      - Lies die Definition genau – »falls die Nullhypothese stimmt«.
    explanation: Der p-Wert sagt, wie überraschend die Daten wären – nicht, wie wahr eine Hypothese ist.

  - kind: problem
    id: gross
    widget: choice
    prompt: Eine riesige Studie findet, dass ein Mittel den Blutdruck signifikant senkt – um 0,1 mmHg. Ist das wichtig?
    params:
      options:
        - { label: Kaum – signifikant heißt nicht bedeutsam., correct: true }
        - { label: Ja – es ist ja signifikant., feedback: "Mit genug Daten wird jeder winzige Effekt signifikant." }
    hints:
      - Spürt ein Mensch 0,1 mmHg?
    explanation: Neben dem p-Wert zählt immer die **Effektgröße**.

srs:
  cards_from: [falle, gross]
