id: math.negative.mult
type: concept
title: Mal und geteilt mit Vorzeichen
summary: Gleiche Vorzeichen ergeben plus, verschiedene minus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.mult]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Minus als Spiegel
    body: Mal eine negative Zahl wirkt wie ein Spiegel. Zieh den Regler von 2 über 0 bis −2. Die Gerade kippt auf die andere Seite und trifft den unteren Punkt. Ein Minus dreht das **Vorzeichen** um.
    visual:
      widget: slider
      interactive: true
      params:
        expr: a*x
        x:
          - -4
          - 4
        y:
          - -12
          - 12
        showCoordinates: false
        sliders:
          - id: a
            label: a
            min: -3
            max: 3
            step: 1
            initial: 2
        markers:
          - x: 3
            y: 6
            label: 2 · 3
          - x: 3
            y: -6
            label: (−2) · 3

  - kind: problem
    id: schulden
    widget: choice
    body: Du hast 3 Rechnungen über je 4 € offen.
    prompt: Was ist $(-3) \cdot 4$?
    params:
      layout: grid
      options:
        - { label: "−12", correct: true }
        - { label: "12", feedback: "3 Schulden zu je 4 € sind 12 € Schulden – also −12." }
        - { label: "−7", feedback: "Das wäre −3 − 4. Hier wird malgenommen." }
        - { label: "1", feedback: "Das wäre −3 + 4. Hier wird malgenommen." }
    hints:
      - Dreimal 4 € Schulden.
    explanation: (−3) · 4 = −12.

  - kind: explain
    id: s2
    body: |
      **Gleiche Vorzeichen** ergeben plus, **verschiedene** ergeben minus.
      $(-3) \cdot 4 = -12$, aber $(-3) \cdot (-4) = 12$.
      Für das Teilen gilt dieselbe Regel.

  - kind: problem
    id: mal-variante
    widget: numeric
    prompt: 'Rechne: $({{a}}) \cdot ({{b}})$'
    answer: { value: "{{a * b}}" }
    feedback:
      - when: "numval(state.input) == -(a * b)"
        misconception: sign-rule
        text: Prüfe das Vorzeichen – gleiche Vorzeichen ergeben plus, verschiedene minus.
    hints:
      - Rechne erst ohne Vorzeichen.
      - Dann das Vorzeichen bestimmen.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "nonzero[-9,9]", b: "nonzero[-9,9]" }
      constraints: ["a < 0 || b < 0"]
      defaults: { a: -6, b: -7 }

  - kind: problem
    id: geteilt
    widget: numeric
    prompt: 'Rechne: $(-24) : (-6)$'
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == -4"
        misconception: sign-rule
        text: Beide Zahlen sind negativ – gleiche Vorzeichen ergeben plus.
    hints:
      - Zwei Minus – also plus.
    explanation: "(−24) : (−6) = 4."

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sortiere die Ergebnisse von klein nach groß.
    params:
      items: [{ label: "(−2) · 5" }, { label: "3 · (−1)" }, { label: "(−1) · (−1)" }, { label: "(−2) · (−3)" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Rechne jedes Produkt aus.
    explanation: −10 < −3 < 1 < 6.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: (−4) · 6
          right: false
        - text: (−7) · (−3)
          right: true
        - text: "20 : (−5)"
          right: false
        - text: (−2) · (−2) · 5
          right: true
        - text: (−1) · (−1) · (−1)
          right: false
          why: "Drei Minuszeichen: ungerade Anzahl, also negativ."
      left: Negativ
      right: Positiv

  - kind: problem
    id: ma-c1
    widget: numberline
    prompt: "$(-3) \\cdot 4$ heißt: viermal 3 nach links springen. Wo landest du?"
    params:
      min: -15
      max: 5
      ticks: 1
      labels: integers
    answer:
      value: -12
    hints:
      - Ein Sprung bringt dich zu −3, zwei zu −6.
      - Noch zwei Sprünge.
    explanation: −3, −6, −9, −12. Also ist $(-3) \cdot 4 = -12$.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Die Gerade $y = a \cdot x$ soll durch den Punkt P (−2 | 8) gehen. Stell a passend ein.
    params:
      expr: a*x
      x:
        - -4
        - 4
      y:
        - -12
        - 12
      showCoordinates: false
      sliders:
        - id: a
          label: a
          min: -4
          max: 4
          step: 1
          initial: 2
      markers:
        - x: -2
          y: 8
          label: P
    answer:
      values:
        a: -4
    hints:
      - Gesucht ist a mit $a \cdot (-2) = 8$.
      - Das Ergebnis ist positiv, also muss a negativ sein. Welche Zahl mal 2 ergibt 8?
    explanation: $(-4) \cdot (-2) = 8$ – minus mal minus ergibt plus.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne: $(-2)^5$"
    answer:
      value: -32
    hints:
      - Fünf Faktoren −2. Ist die Anzahl der Minuszeichen gerade oder ungerade?
    explanation: 2⁵ = 32, und fünf Minuszeichen ergeben minus. Gerade Hochzahlen machen positiv, ungerade negativ.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Setz das Muster fort: $2 \\cdot (-2) = -4$, $1 \\cdot (-2) = -2$, $0 \\cdot (-2) = 0$, $(-1) \\cdot (-2) = \\;?$"
    reveal:
      body: "Plus 2! Jede Zeile wächst um 2. Das Muster lässt keine andere Wahl: Minus mal minus ergibt plus."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Rechne: $(-{{a}}) \\cdot (-{{b}}) \\cdot (-{{c}})$"
    answer:
      value: "{{-a * b * c}}"
    feedback:
      - when: numval(state.input) == a * b * c
        misconception: sign-count
        text: "Zähl die Minuszeichen: Es sind drei."
    hints:
      - "Erst die ersten beiden: minus mal minus."
      - $(+{{a * b}}) \cdot (-{{c}})$ – welches Vorzeichen?
    explanation: $(-{{a}}) \cdot (-{{b}}) = {{a * b}}$, dann mal $(-{{c}})$ ergibt {{-a * b * c}}.
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        b: int[2,5]
        c: int[2,4]
      defaults:
        a: 2
        b: 3
        c: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Positiv oder negativ? Rechne nicht aus – zähl die Minuszeichen.
    params:
      buckets:
        - id: b1
          label: positiv
        - id: b2
          label: negativ
      items:
        - label: (−2) · (−3) · (−4)
          bucket: b2
        - label: $(-1)^{10}$
          bucket: b1
        - label: $(-5)^3$
          bucket: b2
        - label: "(−6) : (−2)"
          bucket: b1
        - label: 7 · (−1) · (−1)
          bucket: b1
        - label: "(−8) : 2"
          bucket: b2
    hints:
      - Eine gerade Anzahl Minus ergibt plus.
      - Bei Potenzen zählt der Exponent die Minuszeichen.
    explanation: "Gerade viele negative Faktoren: positiv. Ungerade viele: negativ."
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Welche Zahl passt? $? \cdot (-6) = 42$
    answer:
      value: -7
    feedback:
      - when: numval(state.input) == 7
        misconception: sign
        text: $7 \cdot (-6) = -42$. Du brauchst ein anderes Vorzeichen.
    hints:
      - 42 ist positiv, −6 ist negativ.
      - "Teile: $42 : (-6)$."
    explanation: "$42 : (-6) = -7$. Probe: $(-7) \\cdot (-6) = 42$."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum muss $(-1) \cdot (-1) = 1$ sein?
    params:
      options:
        - label: "Sonst würde das Ausklammern nicht mehr gelten: $(-1)\\cdot(1 + (-1))$ muss 0 sein"
          correct: true
        - label: Weil es in der Schule so festgelegt wurde
          feedback: Es folgt aus den Rechengesetzen, niemand hat es frei gewählt.
        - label: Weil negative Zahlen eigentlich positiv sind
          feedback: Nein – es geht um das Verteilungsgesetz.
    hints:
      - Multipliziere $(-1) \cdot (1 + (-1))$ aus.
    explanation: $(-1)\cdot 1 + (-1)\cdot(-1) = 0$, also muss $(-1)\cdot(-1) = 1$ sein.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux die Vorzeichenregel beim Malnehmen.
    params:
      keywords:
        - - gleich
          - same
          - both
          - beide
        - - verschieden
          - unterschiedlich
          - different
          - opposite
          - ungleich
        - - plus
          - positiv
          - positive
        - - minus
          - negativ
          - negative
      min: 3
      sample: Haben beide Zahlen das gleiche Vorzeichen, ist das Ergebnis positiv. Sind die Vorzeichen verschieden, ist es negativ.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Rechne: $(-1)^{ {{n}} } \\cdot {{k}}$"
    answer:
      value: "{{(n % 2 == 0 ? 1 : -1) * k}}"
    hints:
      - Jedes Paar $(-1) \cdot (-1)$ ergibt 1.
      - Ist {{n}} gerade oder ungerade?
    explanation: "Bei geradem Exponenten kommt 1 heraus, bei ungeradem −1. Hier: {{(n % 2 == 0 ? 1 : -1) * k}}."
    difficulty: 3
    variants:
      params:
        n: int[11,40]
        k: int[2,9]
      defaults:
        n: 17
        k: 5

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Mal −1 ist eine **Drehung**: Die Zahl dreht sich um 180° um die Null auf die andere Seite. Zweimal drehen bringt sie zurück. Später wird »mal i« eine Vierteldrehung – die komplexen Zahlen."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Ein Produkt hat 7 Faktoren, keiner ist 0. Wann ist es negativ?
    params:
      options:
        - label: Wenn eine ungerade Anzahl Faktoren negativ ist
          correct: true
        - label: Wenn mindestens einer negativ ist
          feedback: Zwei negative Faktoren ergeben zusammen plus.
        - label: Wenn die meisten negativ sind
          feedback: Bei 4 von 7 ist es positiv.
    hints:
      - Fasse negative Faktoren paarweise zusammen.
      - Bleibt einer übrig?
    explanation: Je zwei Minus heben sich auf. Nur wenn eins ohne Partner bleibt, ist das Produkt negativ.
    difficulty: 3

srs:
  cards_from: ["mal-variante"]
