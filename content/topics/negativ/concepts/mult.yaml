id: math.negative.mult
type: concept
title: Mal und geteilt mit Vorzeichen
summary: Gleiche Vorzeichen ergeben plus, verschiedene minus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.mult]
estimated_minutes: 7
steps:
  - kind: problem
    id: schulden
    widget: choice
    body: Du hast 3 Rechnungen über je 4 € offen.
    prompt: Was ist $(-3) \cdot 4$?
    params:
      layout: grid
      options:
        - { label: "−12", correct: true }
        - { label: "12", feedback: "3 Schulden zu je 4 € sind 12 € Schulden – also −12." }
        - { label: "−7", feedback: "Das wäre −3 − 4. Hier wird malgenommen." }
        - { label: "1", feedback: "Das wäre −3 + 4. Hier wird malgenommen." }
    hints:
      - Dreimal 4 € Schulden.
    explanation: (−3) · 4 = −12.

  - kind: explain
    id: s2
    body: |
      **Gleiche Vorzeichen** ergeben plus, **verschiedene** ergeben minus.
      $(-3) \cdot 4 = -12$, aber $(-3) \cdot (-4) = 12$.
      Für das Teilen gilt dieselbe Regel.

  - kind: problem
    id: mal-variante
    widget: numeric
    prompt: 'Rechne: $({{a}}) \cdot ({{b}})$'
    answer: { value: "{{a * b}}" }
    feedback:
      - when: "numval(state.input) == -(a * b)"
        misconception: sign-rule
        text: Prüfe das Vorzeichen – gleiche Vorzeichen ergeben plus, verschiedene minus.
    hints:
      - Rechne erst ohne Vorzeichen.
      - Dann das Vorzeichen bestimmen.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "nonzero[-9,9]", b: "nonzero[-9,9]" }
      constraints: ["a < 0 || b < 0"]
      defaults: { a: -6, b: -7 }

  - kind: problem
    id: geteilt
    widget: numeric
    prompt: 'Rechne: $(-24) : (-6)$'
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == -4"
        misconception: sign-rule
        text: Beide Zahlen sind negativ – gleiche Vorzeichen ergeben plus.
    hints:
      - Zwei Minus – also plus.
    explanation: "(−24) : (−6) = 4."

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sortiere die Ergebnisse von klein nach groß.
    params:
      items: [{ label: "(−2) · 5" }, { label: "3 · (−1)" }, { label: "(−1) · (−1)" }, { label: "(−2) · (−3)" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Rechne jedes Produkt aus.
    explanation: −10 < −3 < 1 < 6.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: (−4) · 6
          right: false
        - text: (−7) · (−3)
          right: true
        - text: "20 : (−5)"
          right: false
        - text: (−2) · (−2) · 5
          right: true
        - text: (−1) · (−1) · (−1)
          right: false
          why: "Drei Minuszeichen: ungerade Anzahl, also negativ."
      left: Negativ
      right: Positiv

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne: $(-2)^5$"
    answer:
      value: -32
    hints:
      - Fünf Faktoren −2. Ist die Anzahl der Minuszeichen gerade oder ungerade?
    explanation: 2⁵ = 32, und fünf Minuszeichen ergeben minus. Gerade Hochzahlen machen positiv, ungerade negativ.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum muss $(-1) \cdot (-1) = 1$ sein?
    params:
      options:
        - label: "Sonst würde das Ausklammern nicht mehr gelten: $(-1)\\cdot(1 + (-1))$ muss 0 sein"
          correct: true
        - label: Weil es in der Schule so festgelegt wurde
          feedback: Es folgt aus den Rechengesetzen, niemand hat es frei gewählt.
        - label: Weil negative Zahlen eigentlich positiv sind
          feedback: Nein – es geht um das Verteilungsgesetz.
    hints:
      - Multipliziere $(-1) \cdot (1 + (-1))$ aus.
    explanation: $(-1)\cdot 1 + (-1)\cdot(-1) = 0$, also muss $(-1)\cdot(-1) = 1$ sein.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux die Vorzeichenregel beim Malnehmen.
    params:
      keywords:
        - - gleich
          - same
          - both
          - beide
        - - verschieden
          - unterschiedlich
          - different
          - opposite
          - ungleich
        - - plus
          - positiv
          - positive
        - - minus
          - negativ
          - negative
      min: 3
      sample: Haben beide Zahlen das gleiche Vorzeichen, ist das Ergebnis positiv. Sind die Vorzeichen verschieden, ist es negativ.
    difficulty: 3

srs:
  cards_from: ["mal-variante"]
