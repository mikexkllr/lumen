id: math.negative.add
type: concept
title: Plus and minus with signs
summary: Plus means right, minus means left – and minus minus flips the direction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.add]
estimated_minutes: 8
steps:
  - kind: problem
    id: einstieg
    widget: numeric
    prompt: "Calculate: −3 + 5"
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == -8"
        text: Plus 5 means 5 steps to the right – not to the left.
    hints:
      - Start at −3 and go 5 steps to the right.
    explanation: From −3, going 5 to the right lands you at 2.

  - kind: explain
    id: s2
    body: |
      On the **number line**, **+** means right and **−** means left.
      Minus a negative number flips the direction: $5 - (-2) = 5 + 2$.

  - kind: problem
    id: plus-variante
    widget: numeric
    prompt: 'Calculate: ${{a}} + ({{b}})$'
    answer: { value: "{{a + b}}" }
    hints:
      - Positive number – to the right. Negative number – to the left.
    explanation: "{{a}} + ({{b}}) = {{a + b}}."
    variants:
      params: { a: "nonzero[-9,9]", b: "nonzero[-9,9]" }
      constraints: ["a < 0 || b < 0"]
      defaults: { a: -6, b: 4 }

  - kind: problem
    id: minus-minus
    widget: numeric
    prompt: 'Calculate: $5 - (-2)$'
    answer: { value: 7 }
    feedback:
      - when: "numval(state.input) == 3"
        misconception: double-negative
        text: Minus a negative number is plus. Calculate 5 + 2.
    hints:
      - If someone takes your debts away, you have more.
    explanation: 5 − (−2) = 5 + 2 = 7.

  - kind: problem
    id: minus-variante
    widget: numeric
    prompt: 'Calculate: ${{a}} - ({{b}})$'
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: double-negative
        text: You didn't flip the direction. Minus a negative number is plus.
    hints:
      - "− ({{b}}) becomes + {{-b}}."
    explanation: "{{a}} − ({{b}}) = {{a}} + {{-b}} = {{a - b}}."
    difficulty: 2
    variants:
      params: { a: "int[-9,9]", b: "int[-9,-1]" }
      defaults: { a: 4, b: -3 }

  - kind: problem
    id: welche
    widget: choice
    prompt: Which calculation gives −2?
    params:
      layout: grid
      options:
        - { label: "3 − 5", correct: true }
        - { label: "−3 − 5", feedback: "−3 − 5 = −8." }
        - { label: "−3 + 5", feedback: "−3 + 5 = 2." }
        - { label: "3 + (−1)", feedback: "3 + (−1) = 2." }
    hints:
      - Work out each option on the number line.
    explanation: 3 − 5 = −2.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Adding a negative number moves [[left]]. Subtracting a negative number moves [[right]]. So 5 − (−2) equals [[7]].
      distractors:
        - "3"
        - up

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Compute: $-8 - (-3) + (-5)$"
    answer:
      value: -10
    feedback:
      - when: numval(state.input) == -16
        misconception: double-negative
        text: "Minus minus flips: − (−3) is + 3."
    hints:
      - "Write it without brackets: −8 + 3 − 5."
    explanation: −8 + 3 = −5 and −5 − 5 = −10.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is $a - (-b) = a + b$?
    params:
      options:
        - label: Subtracting undoes adding – and adding −b meant b to the left
          correct: true
        - label: Because two dashes make a plus
          feedback: That is a memory aid, not a reason.
        - label: It is only a convention
          feedback: It follows necessarily from minus being the inverse of plus.
    hints:
      - What must you do to undo a step to the left?
    explanation: Subtraction is the inverse of addition. A step left is undone by a step right.
    difficulty: 3

srs:
  cards_from: ["plus-variante", "minus-variante"]
