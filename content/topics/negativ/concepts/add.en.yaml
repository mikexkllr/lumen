id: math.negative.add
type: concept
title: Plus and minus with signs
summary: Plus means right, minus means left – and minus minus flips the direction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.add]
estimated_minutes: 14
steps:
  - kind: problem
    id: einstieg
    widget: numeric
    prompt: "Calculate: −3 + 5"
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == -8"
        text: Plus 5 means 5 steps to the right – not to the left.
    hints:
      - Start at −3 and go 5 steps to the right.
    explanation: From −3, going 5 to the right lands you at 2.

  - kind: explain
    id: s2
    body: |
      On the **number line**, **+** means right and **−** means left.
      Minus a negative number flips the direction: $5 - (-2) = 5 + 2$.

  - kind: problem
    id: plus-variante
    widget: numeric
    prompt: 'Calculate: ${{a}} + ({{b}})$'
    answer: { value: "{{a + b}}" }
    hints:
      - Positive number – to the right. Negative number – to the left.
    explanation: "{{a}} + ({{b}}) = {{a + b}}."
    variants:
      params: { a: "nonzero[-9,9]", b: "nonzero[-9,9]" }
      constraints: ["a < 0 || b < 0"]
      defaults: { a: -6, b: 4 }

  - kind: problem
    id: minus-minus
    widget: numeric
    prompt: 'Calculate: $5 - (-2)$'
    answer: { value: 7 }
    feedback:
      - when: "numval(state.input) == 3"
        misconception: double-negative
        text: Minus a negative number is plus. Calculate 5 + 2.
    hints:
      - If someone takes your debts away, you have more.
    explanation: 5 − (−2) = 5 + 2 = 7.

  - kind: problem
    id: minus-variante
    widget: numeric
    prompt: 'Calculate: ${{a}} - ({{b}})$'
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: double-negative
        text: You didn't flip the direction. Minus a negative number is plus.
    hints:
      - "− ({{b}}) becomes + {{-b}}."
    explanation: "{{a}} − ({{b}}) = {{a}} + {{-b}} = {{a - b}}."
    difficulty: 2
    variants:
      params: { a: "int[-9,9]", b: "int[-9,-1]" }
      defaults: { a: 4, b: -3 }

  - kind: problem
    id: welche
    widget: choice
    prompt: Which calculation gives −2?
    params:
      layout: grid
      options:
        - { label: "3 − 5", correct: true }
        - { label: "−3 − 5", feedback: "−3 − 5 = −8." }
        - { label: "−3 + 5", feedback: "−3 + 5 = 2." }
        - { label: "3 + (−1)", feedback: "3 + (−1) = 2." }
    hints:
      - Work out each option on the number line.
    explanation: 3 − 5 = −2.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Adding a negative number moves [[left]]. Subtracting a negative number moves [[right]]. So 5 − (−2) equals [[7]].
      distractors:
        - "3"
        - up

  - kind: problem
    id: ma-c1
    widget: numberline
    prompt: Start at 2 and jump 5 to the left. Where do you land? That is 2 − 5.
    params:
      min: -6
      max: 6
      ticks: 1
      labels: integers
    answer:
      value: -3
    hints:
      - Two steps take you to zero.
      - Three more steps to the left.
    explanation: 2 − 5 = −3. You simply keep going past zero.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Compute: $-8 - (-3) + (-5)$"
    answer:
      value: -10
    feedback:
      - when: numval(state.input) == -16
        misconception: double-negative
        text: "Minus minus flips: − (−3) is + 3."
    hints:
      - "Write it without brackets: −8 + 3 − 5."
    explanation: −8 + 3 = −5 and −5 − 5 = −10.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: The minus sign has two jobs. It can mean »subtract«. Or it is a **sign** saying the number is negative. 5 − (−2) has both.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Calculate: $-{{a}} - (-{{b}}) - {{c}}$"
    answer:
      value: "{{-a + b - c}}"
    feedback:
      - when: numval(state.input) == -a - b - c
        misconception: double-minus
        text: Minus minus {{b}} means plus {{b}}.
    hints:
      - First turn $-(-{{b}})$ into $+{{b}}$.
      - Work out $-{{a}} + {{b}} - {{c}}$ from left to right.
    explanation: $-{{a}} + {{b}} = {{b - a}}$, then $- {{c}}$ gives {{-a + b - c}}.
    difficulty: 2
    variants:
      params:
        a: int[2,9]
        b: int[2,9]
        c: int[1,9]
      defaults:
        a: 4
        b: 7
        c: 5

  - kind: problem
    id: ma-d3
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: −3 + (−4) = −7
          right: true
          why: "Two moves left: 3 and 4."
        - text: −3 − (−4) = −7
          right: false
          why: "Minus minus 4 is plus 4: −3 + 4 = 1."
        - text: Someone who takes away €5 of your debt makes you €5 richer.
          right: true
          why: Removing debt is − (−5) = + 5.
        - text: a − b is always less than a.
          right: false
          why: "Not if b is negative: 2 − (−3) = 5."
    hints:
      - Think of steps on the number line.
      - Minus a negative number reverses the direction.
    explanation: Subtracting a negative number moves you right. Debt disappears – the account grows.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: order
    prompt: Order the results from smallest to largest.
    params:
      items:
        - label: −2 − 3
        - label: −6 + 4
        - label: −2 − (−3)
        - label: 2 − (−3)
    hints:
      - Work out each one first.
      - The results are −5, −2, 1 and 5.
    explanation: −2 − 3 = −5, −6 + 4 = −2, −2 − (−3) = 1 and 2 − (−3) = 5.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is $a - (-b) = a + b$?
    params:
      options:
        - label: Subtracting undoes adding – and adding −b meant b to the left
          correct: true
        - label: Because two dashes make a plus
          feedback: That is a memory aid, not a reason.
        - label: It is only a convention
          feedback: It follows necessarily from minus being the inverse of plus.
    hints:
      - What must you do to undo a step to the left?
    explanation: Subtraction is the inverse of addition. A step left is undone by a step right.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Subtracting means adding the opposite. $a - b = a + (-b)$. In algebra −b is called the **inverse element** of b, because $b + (-b) = 0$.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Calculate: $-10 + (-9) + (-8) + \\ldots + 9 + 10 + 11$"
    answer:
      value: 11
    feedback:
      - when: numval(state.input) == 0
        misconception: missed-last
        text: Almost! Every number from −10 to 10 has a partner – but 11 does not.
    hints:
      - Look for pairs that add up to 0.
      - −10 and 10, −9 and 9 … what is left?
    explanation: All pairs from −10 to 10 make 0. Only 11 is left.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: For which numbers b is $a - b$ greater than a?
    params:
      options:
        - label: For negative b
          correct: true
        - label: Then you move left – the result gets smaller.
          feedback: Dann geht es nach links – das Ergebnis wird kleiner.
        - label: Then a stays the same.
          feedback: Dann bleibt a gleich.
        - label: Try $5 - (-1)$.
          feedback: Probiere $5 - (-1)$.
    hints:
      - Try b = −2.
      - $a - (-2) = a + 2$.
    explanation: $a - b = a + (-b)$. If b is negative, −b is positive – so the result grows.
    difficulty: 3

srs:
  cards_from: ["plus-variante", "minus-variante"]
