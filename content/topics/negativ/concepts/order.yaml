id: math.negative.order
type: concept
title: Ordnen und Betrag
summary: −10 ist kleiner als −2.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wie weit bis null?
    body: "Wer ist näher an der Null: −4 oder 3? Zieh den Punkt hin und her und zähl die Schritte bis zur Null. Dieser Abstand heißt **Betrag**. Er ist nie negativ – auch nicht links von der Null."
    visual:
      widget: numberline
      interactive: true
      params:
        min: -6
        max: 6
        ticks: 1
        labels: integers
        initial: -4

  - kind: problem
    id: sortieren
    widget: order
    prompt: Ordne von klein nach groß.
    params:
      direction: horizontal
      startLabel: klein
      endLabel: groß
      items: [{ label: "−10" }, { label: "−4" }, { label: "−1" }, { label: "0" }, { label: "3" }]
    hints:
      - Auf dem Zahlenstrahl steht die kleinste Zahl ganz links.
    explanation: Je weiter links, desto kleiner – −10 ist die kleinste.

  - kind: explain
    id: s2
    body: |
      Der **Betrag** |x| ist der Abstand zur Null. Er ist nie negativ.
      |−7| = 7 und |7| = 7.

  - kind: problem
    id: betrag
    widget: numeric
    prompt: Wie groß ist |{{a}}| + |{{b}}|?
    params: { placeholder: "Summe" }
    answer: { value: "{{abs(a) + abs(b)}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: no-abs
        text: Der Betrag macht jede Zahl positiv – erst dann addieren.
    hints:
      - "|{{a}}| = {{abs(a)}}."
    explanation: "{{abs(a)}} + {{abs(b)}} = {{abs(a) + abs(b)}}."
    variants:
      params: { a: "int[-9,-2]", b: "int[2,9]" }
      defaults: { a: -7, b: 4 }

  - kind: problem
    id: groesser
    widget: choice
    prompt: Welche Zahl ist größer – −8 oder −3?
    params:
      layout: grid
      options:
        - { label: "−3", correct: true }
        - { label: "−8", feedback: "8 ist mehr als 3 – aber −8 liegt weiter links." }
    hints:
      - Welche Temperatur ist wärmer?
    explanation: −3 °C ist wärmer als −8 °C. Also ist −3 größer.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der Betrag ist der [[Abstand]] zur Null. Er ist nie [[negativ]]. |−9| ist [[9]].
      distractors:
        - −9
        - positiv

  - kind: problem
    id: ma-c1
    widget: numberline
    prompt: Setze die Markierung auf die negative Zahl mit dem Betrag 4.
    params:
      min: -6
      max: 6
      ticks: 1
      labels: integers
    answer:
      value: -4
    hints:
      - Der Betrag ist der Abstand zur Null.
      - 4 Schritte von der Null – auf der linken Seite.
    explanation: "|−4| = 4. Die Zahl −4 liegt 4 Schritte links von der Null."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne: $|3 - 8| - |{-2}|$"
    answer:
      value: 3
    hints:
      - "Erst rechnen, was im Betrag steht: 3 − 8 = −5."
    explanation: "|−5| = 5 und |−2| = 2, also 5 − 2 = 3."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: choice
    prompt: Welche Zahlen haben den Betrag 6? Wähle alle.
    params:
      multiple: true
      options:
        - label: "6"
          correct: true
        - label: −6
          correct: true
        - label: −(−6)
          correct: true
        - label: 1/6
          feedback: Das ist der Kehrwert, nicht der Betrag.
        - label: "0"
          feedback: "|0| = 0."
    hints:
      - Der Betrag ist der Abstand zur Null.
      - −(−6) ist dasselbe wie 6.
    explanation: 6 und −6 liegen beide 6 von der Null entfernt. −(−6) ist einfach 6.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Der **Abstand** zweier Zahlen ist der Betrag ihrer Differenz: |a − b|. Von −7 bis 5 sind es |5 − (−7)| = 12 Schritte."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Wie weit liegen {{a}} und {{b}} auf dem Zahlenstrahl auseinander?
    answer:
      value: "{{b - a}}"
    feedback:
      - when: numval(state.input) == b + a
        misconception: abs-difference
        text: Du hast den Weg links der Null abgezogen. Beide Strecken zählen.
    hints:
      - Zähl erst bis zur Null, dann weiter.
      - "{{-a}} + {{b}} = ?"
    explanation: "|{{b}} − ({{a}})| = {{b - a}}."
    difficulty: 2
    variants:
      params:
        a: int[-9,-1]
        b: int[1,9]
      defaults:
        a: -7
        b: 5

  - kind: problem
    id: ma-d4
    depth: 2
    widget: order
    prompt: Ordne nach dem Betrag – vom kleinsten zum größten.
    params:
      items:
        - label: "0"
        - label: −1
        - label: "4"
        - label: −5
        - label: "7"
        - label: −9
    hints:
      - Vergiss das Vorzeichen.
      - Nur der Abstand zur Null zählt.
    explanation: Die Beträge sind 0, 1, 4, 5, 7 und 9.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie viele Zahlen x erfüllen $|x - 2| = 5$?
    params:
      options:
        - label: "Zwei: 7 und −3"
          correct: true
        - label: "Eine: 7"
          feedback: Auch −3 hat den Abstand 5 zur 2.
        - label: Keine
          feedback: Der Abstand 5 zur 2 lässt sich in beide Richtungen abtragen.
    hints:
      - "|x − 2| ist der Abstand von x zur 2."
    explanation: Der Betrag einer Differenz ist ein **Abstand**. Zwei Punkte liegen 5 von der 2 entfernt.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Wie viele ganze Zahlen x erfüllen $|x| \le 3$?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 3
        misconception: forgot-negatives
        text: Auch die negativen Zahlen −1, −2, −3 zählen.
      - when: numval(state.input) == 6
        misconception: forgot-zero
        text: "Die 0 zählt auch: |0| = 0 ≤ 3."
    hints:
      - Welche Zahlen liegen höchstens 3 von der Null weg?
      - Von −3 bis 3.
    explanation: −3, −2, −1, 0, 1, 2, 3 – das sind 7 Zahlen.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Gilt $|a + b| = |a| + |b|$ immer?
    params:
      options:
        - label: Ja, immer
          feedback: Probiere a = 3, b = −5.
        - label: Nein – bei verschiedenen Vorzeichen ist links weniger
          correct: true
        - label: Nie
          feedback: Bei a = 2, b = 3 stimmt es.
    hints:
      - Setze a = 3 und b = −5 ein.
      - "|3 + (−5)| = 2, aber |3| + |−5| = 8."
    explanation: Es gilt immer $|a + b| \le |a| + |b|$ – die Dreiecksungleichung. Gleichheit nur bei gleichen Vorzeichen oder einer Null.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was der Betrag einer Zahl ist und warum er nie negativ ist.
    params:
      keywords:
        - - abstand
          - entfernt
          - distance
          - away
          - far
        - - "null"
          - zero
        - - nie
          - kein
          - never
          - positiv
          - positive
      sample: Der Betrag ist der Abstand einer Zahl zur Null. Ein Abstand ist nie negativ. Deshalb haben 5 und −5 beide den Betrag 5.
    explanation: "Kernidee: Betrag = Abstand zur Null. Abstände haben kein Vorzeichen."
    difficulty: 3

srs:
  cards_from: [betrag, groesser]
