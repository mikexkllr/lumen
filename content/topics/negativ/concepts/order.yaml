id: math.negative.order
type: concept
title: Ordnen und Betrag
summary: −10 ist kleiner als −2.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sortieren
    widget: order
    prompt: Ordne von klein nach groß.
    params:
      direction: horizontal
      startLabel: klein
      endLabel: groß
      items: [{ label: "−10" }, { label: "−4" }, { label: "−1" }, { label: "0" }, { label: "3" }]
    hints:
      - Auf dem Zahlenstrahl steht die kleinste Zahl ganz links.
    explanation: Je weiter links, desto kleiner – −10 ist die kleinste.

  - kind: explain
    id: s2
    body: |
      Der **Betrag** |x| ist der Abstand zur Null. Er ist nie negativ.
      |−7| = 7 und |7| = 7.

  - kind: problem
    id: betrag
    widget: numeric
    prompt: Wie groß ist |{{a}}| + |{{b}}|?
    params: { placeholder: "Summe" }
    answer: { value: "{{abs(a) + abs(b)}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: no-abs
        text: Der Betrag macht jede Zahl positiv – erst dann addieren.
    hints:
      - "|{{a}}| = {{abs(a)}}."
    explanation: "{{abs(a)}} + {{abs(b)}} = {{abs(a) + abs(b)}}."
    variants:
      params: { a: "int[-9,-2]", b: "int[2,9]" }
      defaults: { a: -7, b: 4 }

  - kind: problem
    id: groesser
    widget: choice
    prompt: Welche Zahl ist größer – −8 oder −3?
    params:
      layout: grid
      options:
        - { label: "−3", correct: true }
        - { label: "−8", feedback: "8 ist mehr als 3 – aber −8 liegt weiter links." }
    hints:
      - Welche Temperatur ist wärmer?
    explanation: −3 °C ist wärmer als −8 °C. Also ist −3 größer.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der Betrag ist der [[Abstand]] zur Null. Er ist nie [[negativ]]. |−9| ist [[9]].
      distractors:
        - −9
        - positiv

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne: $|3 - 8| - |{-2}|$"
    answer:
      value: 3
    hints:
      - "Erst rechnen, was im Betrag steht: 3 − 8 = −5."
    explanation: "|−5| = 5 und |−2| = 2, also 5 − 2 = 3."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie viele Zahlen x erfüllen $|x - 2| = 5$?
    params:
      options:
        - label: "Zwei: 7 und −3"
          correct: true
        - label: "Eine: 7"
          feedback: Auch −3 hat den Abstand 5 zur 2.
        - label: Keine
          feedback: Der Abstand 5 zur 2 lässt sich in beide Richtungen abtragen.
    hints:
      - "|x − 2| ist der Abstand von x zur 2."
    explanation: Der Betrag einer Differenz ist ein **Abstand**. Zwei Punkte liegen 5 von der 2 entfernt.
    difficulty: 3

srs:
  cards_from: [betrag, groesser]
