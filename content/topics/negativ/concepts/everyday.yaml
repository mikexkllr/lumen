id: math.negative.everyday
type: concept
title: Temperaturen und Kontostand
summary: Unterschiede über die Null hinweg.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: ma-hook
    widget: estimate
    prompt: "Schätz mal: Wie tief ist die tiefste Stelle im Meer – in Metern unter dem Meeresspiegel?"
    params:
      min: -15000
      max: 0
      unit: m
    answer:
      value: -11000
      tolerance: 1500
    explanation: Der Marianengraben reicht bis etwa −11 000 m. Der Mount Everest würde darin komplett verschwinden.

  - kind: problem
    id: temperatur
    widget: numeric
    prompt: Nachts waren es {{a}} °C, mittags {{b}} °C. Um wie viel Grad ist es wärmer geworden?
    params: { unit: "°C" }
    answer: { value: "{{b - a}}" }
    feedback:
      - when: "numval(state.input) == b + a"
        misconception: ignore-sign
        text: Zähle über die Null hinweg – erst bis 0, dann weiter.
    hints:
      - "Von {{a}} bis 0 sind es {{-a}} Grad, dann noch {{b}}."
    explanation: "{{b}} − ({{a}}) = {{b - a}} Grad."
    variants:
      params: { a: "int[-12,-2]", b: "int[3,15]" }
      defaults: { a: -5, b: 7 }

  - kind: problem
    id: punkt
    widget: numberline
    prompt: Setze die Markierung auf −3,5.
    params: { min: -5, max: 2, ticks: 2, labels: integers }
    answer: { value: -3.5 }
    hints:
      - Genau in der Mitte zwischen −4 und −3.
    explanation: −3,5 liegt zwischen −4 und −3.

  - kind: explain
    id: s3
    body: |
      Auf dem **Konto** heißt Minus: Du schuldest der Bank Geld.
      Wer bei −200 € steht und 50 € abhebt, steht danach bei −250 €.

  - kind: problem
    id: konto
    widget: numeric
    prompt: Dein Konto steht bei {{k}} €. Dann kommen {{g}} € Gehalt. Wie ist der neue Stand?
    params: { unit: "€" }
    answer: { value: "{{k + g}}" }
    feedback:
      - when: "numval(state.input) == g - k"
        misconception: subtract-wrong
        text: Rechne {{k}} + {{g}}. Die Schulden werden kleiner.
    hints:
      - "Starte bei {{k}} und gehe {{g}} nach rechts."
    explanation: "{{k}} + {{g}} = {{k + g}} €."
    variants:
      params: { k: "step[-500,-100,50]", g: "step[200,1500,100]" }
      defaults: { k: -300, g: 1200 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Von −3 °C auf 4 °C sind es 7 Grad Unterschied.
          right: true
        - text: Wer bei −50 € steht und 20 € einzahlt, hat −70 €.
          right: false
          why: "Einzahlen geht nach rechts: −30 €."
        - text: Das Tote Meer liegt bei −430 m, also unter dem Meeresspiegel.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Taucher ist bei −18 m. Er steigt 5 m auf und sinkt dann 9 m. Wo ist er jetzt?
    params:
      unit: m
    answer:
      value: -22
    hints:
      - Aufsteigen ist plus, sinken ist minus.
    explanation: −18 + 5 − 9 = −22.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: Ein Gipfel liegt {{h}} m über dem Meer, ein Graben {{t}} m darunter. Wie groß ist der Höhenunterschied?
    params:
      unit: m
    answer:
      value: "{{h + t}}"
    feedback:
      - when: numval(state.input) == h - t
        misconception: subtract-across-zero
        text: Der Graben liegt unter null. Der Weg führt über die Null hinweg.
    hints:
      - Schreib den Graben als −{{t}} m.
      - "{{h}} − (−{{t}}) = ?"
    explanation: "{{h}} − (−{{t}}) = {{h}} + {{t}} = {{h + t}} m."
    difficulty: 2
    variants:
      params:
        h: step[500,4000,500]
        t: step[200,3000,200]
      defaults:
        h: 2000
        t: 600

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: In Berlin ist es 14 Uhr (UTC+1). New York hat die Zeitzone UTC−5. Wie viel Uhr ist es dort?
    params:
      unit: Uhr
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 10
        misconception: zone-gap
        text: Von +1 bis −5 sind es 6 Stunden, nicht 4.
    hints:
      - Wie weit liegen +1 und −5 auseinander?
      - Der Abstand ist 6 Stunden. New York ist zurück.
    explanation: Von UTC+1 zu UTC−5 sind es 6 Stunden. 14 − 6 = 8 Uhr morgens.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Dein Konto steht bei −120 €. Du zahlst jeden Monat 40 € ein. Nach wie vielen Monaten stehst du bei +40 €?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: stop-at-zero
        text: Nach 3 Monaten bist du erst bei 0 €.
    hints:
      - Wie weit ist es von −120 bis +40?
      - 160 € in Schritten zu 40 €.
    explanation: "Von −120 bis 40 sind es 160 €. 160 : 40 = 4 Monate."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Die Temperaturen einer Woche: −6, −2, 0, 3, 1, −4, −6 °C. Wie hoch ist der Durchschnitt?"
    params:
      unit: °C
    answer:
      value: -2
    hints:
      - Addiere erst die negativen und die positiven Werte getrennt.
    explanation: "−18 + 4 = −14, und −14 : 7 = −2."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Jemand wird am 1. Januar 20 v. Chr. geboren. Wie viele Jahre später ist der 1. Januar 20 n. Chr.? Ein Jahr 0 gibt es nicht.
    params:
      unit: Jahre
    answer:
      value: 39
    feedback:
      - when: numval(state.input) == 40
        misconception: year-zero
        text: Auf das Jahr 1 v. Chr. folgt direkt 1 n. Chr. – ein Jahr fehlt.
    hints:
      - Auf dem Zahlenstrahl wären es −20 bis 20.
      - Ohne Jahr 0 ist es ein Jahr weniger.
    explanation: 20 − (−20) = 40, aber das Jahr 0 fehlt. Also 39 Jahre. Historiker rechnen darum vorsichtig.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Die **Kelvin-Skala** beginnt beim absoluten Nullpunkt: 0 K = −273,15 °C. Kälter geht es nicht. Darum hat diese Skala keine negativen Werte."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Wie viel Kelvin sind −73,15 °C?
    params:
      unit: K
    answer:
      value: 200
    feedback:
      - when: numval(state.input) == -346.3
        misconception: wrong-direction
        text: Kelvin = Celsius plus 273,15 – nicht minus.
    hints:
      - K = °C + 273,15.
      - −73,15 + 273,15 = ?
    explanation: −73,15 + 273,15 = 200 K.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man den Unterschied zwischen −5 °C und 3 °C findet.
    params:
      keywords:
        - - abstand
          - unterschied
          - difference
          - distance
        - - "null"
          - zero
        - - minus
          - abzieh
          - subtrah
          - subtract
          - acht
          - eight
      sample: Von −5 bis zur Null sind es 5 Grad, von der Null bis 3 noch 3 Grad. Der Unterschied ist 8 Grad. Man rechnet 3 minus −5.
    explanation: "Kernidee: Ein Unterschied ist ein Abstand – über die Null hinweg werden beide Teile addiert."
    difficulty: 3

srs:
  cards_from: [temperatur, konto]
