id: math.negative.mult
type: concept
title: Times and divided by, with signs
summary: Same signs give plus, different signs give minus.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.mult]
estimated_minutes: 6
steps:
  - kind: problem
    id: schulden
    widget: choice
    body: You have 3 unpaid bills of 4 € each.
    prompt: What is $(-3) \cdot 4$?
    params:
      layout: grid
      options:
        - { label: "−12", correct: true }
        - { label: "12", feedback: "3 debts of 4 € each are 12 € of debt – so −12." }
        - { label: "−7", feedback: "That would be −3 − 4. Here you multiply." }
        - { label: "1", feedback: "That would be −3 + 4. Here you multiply." }
    hints:
      - Three times 4 € of debt.
    explanation: (−3) · 4 = −12.

  - kind: explain
    body: |
      **Same signs** give plus, **different signs** give minus.
      $(-3) \cdot 4 = -12$, but $(-3) \cdot (-4) = 12$.
      The same rule applies to division.

  - kind: problem
    id: mal-variante
    widget: numeric
    prompt: 'Calculate: $({{a}}) \cdot ({{b}})$'
    answer: { value: "{{a * b}}" }
    feedback:
      - when: "numval(state.input) == -(a * b)"
        misconception: sign-rule
        text: Check the sign – same signs give plus, different signs give minus.
    hints:
      - First calculate without signs.
      - Then work out the sign.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "nonzero[-9,9]", b: "nonzero[-9,9]" }
      constraints: ["a < 0 || b < 0"]
      defaults: { a: -6, b: -7 }

  - kind: problem
    id: geteilt
    widget: numeric
    prompt: 'Calculate: $(-24) \div (-6)$'
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == -4"
        misconception: sign-rule
        text: Both numbers are negative – same signs give plus.
    hints:
      - Two minuses – so plus.
    explanation: "(−24) ÷ (−6) = 4."

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort the results from smallest to largest.
    params:
      items: [{ label: "(−2) · 5" }, { label: "3 · (−1)" }, { label: "(−1) · (−1)" }, { label: "(−2) · (−3)" }]
      startLabel: small
      endLabel: large
    hints:
      - Work out each product.
    explanation: −10 < −3 < 1 < 6.
    difficulty: 2

srs:
  cards_from: ["steps[2]"]
