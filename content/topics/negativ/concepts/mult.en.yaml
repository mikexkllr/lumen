id: math.negative.mult
type: concept
title: Times and divided by, with signs
summary: Same signs give plus, different signs give minus.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.mult]
estimated_minutes: 7
steps:
  - kind: problem
    id: schulden
    widget: choice
    body: You have 3 unpaid bills of 4 € each.
    prompt: What is $(-3) \cdot 4$?
    params:
      layout: grid
      options:
        - { label: "−12", correct: true }
        - { label: "12", feedback: "3 debts of 4 € each are 12 € of debt – so −12." }
        - { label: "−7", feedback: "That would be −3 − 4. Here you multiply." }
        - { label: "1", feedback: "That would be −3 + 4. Here you multiply." }
    hints:
      - Three times 4 € of debt.
    explanation: (−3) · 4 = −12.

  - kind: explain
    id: s2
    body: |
      **Same signs** give plus, **different signs** give minus.
      $(-3) \cdot 4 = -12$, but $(-3) \cdot (-4) = 12$.
      The same rule applies to division.

  - kind: problem
    id: mal-variante
    widget: numeric
    prompt: 'Calculate: $({{a}}) \cdot ({{b}})$'
    answer: { value: "{{a * b}}" }
    feedback:
      - when: "numval(state.input) == -(a * b)"
        misconception: sign-rule
        text: Check the sign – same signs give plus, different signs give minus.
    hints:
      - First calculate without signs.
      - Then work out the sign.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "nonzero[-9,9]", b: "nonzero[-9,9]" }
      constraints: ["a < 0 || b < 0"]
      defaults: { a: -6, b: -7 }

  - kind: problem
    id: geteilt
    widget: numeric
    prompt: 'Calculate: $(-24) \div (-6)$'
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == -4"
        misconception: sign-rule
        text: Both numbers are negative – same signs give plus.
    hints:
      - Two minuses – so plus.
    explanation: "(−24) ÷ (−6) = 4."

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort the results from smallest to largest.
    params:
      items: [{ label: "(−2) · 5" }, { label: "3 · (−1)" }, { label: "(−1) · (−1)" }, { label: "(−2) · (−3)" }]
      startLabel: small
      endLabel: large
    hints:
      - Work out each product.
    explanation: −10 < −3 < 1 < 6.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: (−4) · 6
          right: false
        - text: (−7) · (−3)
          right: true
        - text: 20 ÷ (−5)
          right: false
        - text: (−2) · (−2) · 5
          right: true
        - text: (−1) · (−1) · (−1)
          right: false
          why: "Three minus signs: an odd count, so negative."
      left: Negative
      right: Positive

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Compute: $(-2)^5$"
    answer:
      value: -32
    hints:
      - Five factors of −2. Is the count of minus signs even or odd?
    explanation: 2⁵ = 32, and five minus signs give minus. Even exponents give positive, odd give negative.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why must $(-1) \cdot (-1) = 1$ hold?
    params:
      options:
        - label: "Otherwise distributing would fail: $(-1)\\cdot(1 + (-1))$ must be 0"
          correct: true
        - label: Because school defined it that way
          feedback: It follows from the laws of arithmetic; nobody chose it freely.
        - label: Because negatives are really positive
          feedback: No – it is about the distributive law.
    hints:
      - Expand $(-1) \cdot (1 + (-1))$.
    explanation: $(-1)\cdot 1 + (-1)\cdot(-1) = 0$, so $(-1)\cdot(-1)$ must be 1.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain the sign rule for multiplication to Lux.
    params:
      keywords:
        - - gleich
          - same
          - both
          - beide
        - - verschieden
          - unterschiedlich
          - different
          - opposite
          - ungleich
        - - plus
          - positiv
          - positive
        - - minus
          - negativ
          - negative
      min: 3
      sample: If both numbers have the same sign, the result is positive. If the signs are different, it is negative.
    difficulty: 3

srs:
  cards_from: ["mal-variante"]
