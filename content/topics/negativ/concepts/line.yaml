id: math.negative.line
type: concept
title: Zahlen unter Null
summary: Links von der Null wird es kleiner – auch wenn die Ziffer größer aussieht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.line]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie kalt ist der kälteste je gemessene Ort der Erde (in °C)?"
    params:
      min: -150
      max: 0
      unit: °C
    answer:
      value: -89
      tolerance: 12
    explanation: −89,2 °C, gemessen 1983 an der Station Wostok in der Antarktis.


  - kind: problem
    id: minus-drei
    widget: numberline
    prompt: Setze die Markierung auf −3.
    params: { min: -5, max: 5, ticks: 1 }
    answer: { value: -3 }
    feedback:
      - when: "state.value == 3"
        misconception: sign
        text: Das ist +3. Negative Zahlen liegen links von der Null.
    hints:
      - Negative Zahlen liegen links von der 0.
    explanation: −3 liegt drei Schritte links von der Null.

  - kind: explain
    id: s2
    body: |
      Links von der Null liegen die **negativen Zahlen**.
      Je weiter links, desto kleiner – −5 ist kleiner als −2.
    visual:
      widget: numberline
      params: { min: -5, max: 5, ticks: 1 }

  - kind: problem
    id: sortieren
    widget: order
    prompt: Sortiere von klein nach groß.
    params:
      direction: horizontal
      items: [{ label: "−7" }, { label: "−2" }, { label: "0" }, { label: "3" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Stell dir den Zahlenstrahl vor. Was liegt am weitesten links?
    explanation: −7 < −2 < 0 < 3.

  - kind: problem
    id: kleiner
    widget: choice
    prompt: Welche Zahl ist kleiner?
    params:
      layout: grid
      options:
        - { label: "−8", correct: true }
        - { label: "−3", feedback: "8 ist mehr als 3 – aber −8 liegt weiter links auf dem Zahlenstrahl." }
    hints:
      - Was ist kälter – −8 °C oder −3 °C?
    explanation: −8 liegt weiter links, ist also kleiner.

  - kind: problem
    id: temperatur
    widget: numeric
    prompt: Es ist −4 °C. Die Temperatur steigt um 6 Grad. Wie warm ist es dann?
    params: { unit: "°C" }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 10 || numval(state.input) == -10"
        text: Steigen heißt nach rechts. Von −4 sind es 4 Schritte bis 0, dann noch 2.
    hints:
      - Von −4 bis 0 sind es 4 Grad.
    explanation: −4 + 6 = 2.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: Du stehst bei {{a}} und gehst {{b}} Schritte nach links. Wo landest du?
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == b - a"
        misconception: sign
        text: Prüfe das Vorzeichen. Links von der Null ist alles negativ.
    hints:
      - Nach links heißt minus.
    explanation: "{{a}} − {{b}} = {{a - b}}."
    variants:
      params: { a: "int[-3,4]", b: "int[2,8]" }
      constraints: ["a - b < 0", "b - a != a - b"]
      defaults: { a: 2, b: 5 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: −7 ist kleiner als −2.
          right: true
        - text: −10 ist größer als −1, weil 10 größer als 1 ist.
          right: false
          why: "Weiter links heißt kleiner: −10 liegt links von −1."
        - text: Jede negative Zahl ist kleiner als 0.
          right: true
        - text: 0 ist eine negative Zahl.
          right: false
          why: Die Null ist weder positiv noch negativ.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Welche Zahl liegt genau in der Mitte zwischen −7 und 3?
    answer:
      value: -2
    hints:
      - Der Abstand ist 10. Geh von −7 fünf Schritte nach rechts.
    explanation: "Die Mitte ist der Durchschnitt: (−7 + 3) : 2 = −2."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gibt es eine kleinste negative Zahl?
    params:
      options:
        - label: Nein – man kann immer noch 1 abziehen
          correct: true
        - label: Ja, −1
          feedback: −2 ist schon kleiner.
        - label: Ja, minus unendlich
          feedback: Unendlich ist keine Zahl auf dem Zahlenstrahl, sondern eine Richtung.
    hints:
      - Nimm irgendeine negative Zahl. Findest du eine kleinere?
    explanation: Der Zahlenstrahl hat in beide Richtungen kein Ende.
    difficulty: 3

srs:
  cards_from: ["schritte"]
