id: math.negative.add
type: concept
title: Plus und Minus mit Vorzeichen
summary: Plus heißt nach rechts, minus nach links – und minus minus dreht um.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.add]
estimated_minutes: 14
steps:
  - kind: problem
    id: einstieg
    widget: numeric
    prompt: "Rechne: −3 + 5"
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == -8"
        text: Plus 5 heißt 5 Schritte nach rechts – nicht nach links.
    hints:
      - Starte bei −3 und gehe 5 Schritte nach rechts.
    explanation: Von −3 aus 5 nach rechts landest du bei 2.

  - kind: explain
    id: s2
    body: |
      Auf dem **Zahlenstrahl** heißt **+** nach rechts und **−** nach links.
      Minus eine negative Zahl dreht die Richtung um: $5 - (-2) = 5 + 2$.

  - kind: problem
    id: plus-variante
    widget: numeric
    prompt: 'Rechne: ${{a}} + ({{b}})$'
    answer: { value: "{{a + b}}" }
    hints:
      - Positive Zahl – nach rechts, negative Zahl – nach links.
    explanation: "{{a}} + ({{b}}) = {{a + b}}."
    variants:
      params: { a: "nonzero[-9,9]", b: "nonzero[-9,9]" }
      constraints: ["a < 0 || b < 0"]
      defaults: { a: -6, b: 4 }

  - kind: problem
    id: minus-minus
    widget: numeric
    prompt: 'Rechne: $5 - (-2)$'
    answer: { value: 7 }
    feedback:
      - when: "numval(state.input) == 3"
        misconception: double-negative
        text: Minus eine negative Zahl ist plus. Rechne 5 + 2.
    hints:
      - Wer Schulden abgenommen bekommt, hat mehr.
    explanation: 5 − (−2) = 5 + 2 = 7.

  - kind: problem
    id: minus-variante
    widget: numeric
    prompt: 'Rechne: ${{a}} - ({{b}})$'
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: double-negative
        text: Du hast die Richtung nicht umgedreht. Minus eine negative Zahl ist plus.
    hints:
      - "Aus − ({{b}}) wird + {{-b}}."
    explanation: "{{a}} − ({{b}}) = {{a}} + {{-b}} = {{a - b}}."
    difficulty: 2
    variants:
      params: { a: "int[-9,9]", b: "int[-9,-1]" }
      defaults: { a: 4, b: -3 }

  - kind: problem
    id: welche
    widget: choice
    prompt: Welche Rechnung ergibt −2?
    params:
      layout: grid
      options:
        - { label: "3 − 5", correct: true }
        - { label: "−3 − 5", feedback: "−3 − 5 = −8." }
        - { label: "−3 + 5", feedback: "−3 + 5 = 2." }
        - { label: "3 + (−1)", feedback: "3 + (−1) = 2." }
    hints:
      - Rechne jede Möglichkeit auf dem Zahlenstrahl.
    explanation: 3 − 5 = −2.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Plus eine negative Zahl geht nach [[links]]. Minus eine negative Zahl geht nach [[rechts]]. Darum ist 5 − (−2) gleich [[7]].
      distractors:
        - "3"
        - oben

  - kind: problem
    id: ma-c1
    widget: numberline
    prompt: Starte bei 2 und springe 5 nach links. Wo landest du? Das ist 2 − 5.
    params:
      min: -6
      max: 6
      ticks: 1
      labels: integers
    answer:
      value: -3
    hints:
      - Zwei Schritte bringen dich zur Null.
      - Noch drei Schritte weiter nach links.
    explanation: 2 − 5 = −3. Über die Null hinaus geht es einfach weiter.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne: $-8 - (-3) + (-5)$"
    answer:
      value: -10
    feedback:
      - when: numval(state.input) == -16
        misconception: double-negative
        text: "Minus minus dreht um: − (−3) ist + 3."
    hints:
      - "Schreib es ohne Klammern: −8 + 3 − 5."
    explanation: −8 + 3 = −5 und −5 − 5 = −10.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Das Minus hat zwei Rollen. Es kann »abziehen« heißen. Oder es ist ein **Vorzeichen** und sagt: Die Zahl ist negativ. In 5 − (−2) stecken beide."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Rechne: $-{{a}} - (-{{b}}) - {{c}}$"
    answer:
      value: "{{-a + b - c}}"
    feedback:
      - when: numval(state.input) == -a - b - c
        misconception: double-minus
        text: Minus minus {{b}} heißt plus {{b}}.
    hints:
      - Mach aus $-(-{{b}})$ erst $+{{b}}$.
      - Rechne $-{{a}} + {{b}} - {{c}}$ von links nach rechts.
    explanation: $-{{a}} + {{b}} = {{b - a}}$, dann $- {{c}}$ ergibt {{-a + b - c}}.
    difficulty: 2
    variants:
      params:
        a: int[2,9]
        b: int[2,9]
        c: int[1,9]
      defaults:
        a: 4
        b: 7
        c: 5

  - kind: problem
    id: ma-d3
    depth: 2
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: −3 + (−4) = −7
          right: true
          why: "Zwei Schritte nach links: 3 und 4."
        - text: −3 − (−4) = −7
          right: false
          why: "Minus minus 4 ist plus 4: −3 + 4 = 1."
        - text: Wer dir 5 € Schulden abnimmt, macht dich 5 € reicher.
          right: true
          why: Schulden wegnehmen ist − (−5) = + 5.
        - text: a − b ist immer kleiner als a.
          right: false
          why: "Nicht wenn b negativ ist: 2 − (−3) = 5."
    hints:
      - Denk an Schritte auf dem Zahlenstrahl.
      - Minus eine negative Zahl dreht die Richtung um.
    explanation: Zieht man eine negative Zahl ab, geht es nach rechts. Schulden verschwinden – das Konto wächst.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: order
    prompt: Ordne die Ergebnisse von klein nach groß.
    params:
      items:
        - label: −2 − 3
        - label: −6 + 4
        - label: −2 − (−3)
        - label: 2 − (−3)
    hints:
      - Rechne jede Aufgabe einzeln aus.
      - Die Ergebnisse sind −5, −2, 1 und 5.
    explanation: −2 − 3 = −5, −6 + 4 = −2, −2 − (−3) = 1 und 2 − (−3) = 5.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist $a - (-b) = a + b$?
    params:
      options:
        - label: Abziehen macht das Addieren rückgängig – und −b addieren hieß b nach links
          correct: true
        - label: Weil zwei Striche ein Plus ergeben
          feedback: Das ist eine Eselsbrücke, keine Begründung.
        - label: Das ist nur eine Abmachung
          feedback: Es folgt zwingend daraus, dass Minus die Umkehrung von Plus ist.
    hints:
      - Was musst du tun, um einen Schritt nach links rückgängig zu machen?
    explanation: Subtraktion ist die Umkehrung der Addition. Einen Schritt nach links macht man mit einem nach rechts rückgängig.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Abziehen heißt: die Gegenzahl addieren. $a - b = a + (-b)$. In der Algebra heißt −b das **inverse Element** von b, weil $b + (-b) = 0$ gilt."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Rechne: $-10 + (-9) + (-8) + \\ldots + 9 + 10 + 11$"
    answer:
      value: 11
    feedback:
      - when: numval(state.input) == 0
        misconception: missed-last
        text: Fast! Jede Zahl von −10 bis 10 hat einen Partner – die 11 aber nicht.
    hints:
      - Suche Paare, die zusammen 0 ergeben.
      - −10 und 10, −9 und 9 … Was bleibt übrig?
    explanation: Alle Paare von −10 bis 10 ergeben 0. Übrig bleibt nur die 11.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Für welche Zahlen b ist $a - b$ größer als a?
    params:
      options:
        - label: Für negative b
          correct: true
        - label: Für positive b
          feedback: Dann geht es nach links – das Ergebnis wird kleiner.
        - label: Für b = 0
          feedback: Dann bleibt a gleich.
        - label: Für keine
          feedback: Probiere $5 - (-1)$.
    hints:
      - Probiere b = −2.
      - $a - (-2) = a + 2$.
    explanation: $a - b = a + (-b)$. Ist b negativ, ist −b positiv – also wird es mehr.
    difficulty: 3

srs:
  cards_from: ["plus-variante", "minus-variante"]
