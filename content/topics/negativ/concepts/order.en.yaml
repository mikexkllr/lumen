id: math.negative.order
type: concept
title: Ordering and absolute value
summary: −10 is smaller than −2.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: How far to zero?
    body: "Which is closer to zero: −4 or 3? Drag the point back and forth and count the steps to zero. This distance is called the **absolute value**. It is never negative – not even left of zero."
    visual:
      widget: numberline
      interactive: true
      params:
        min: -6
        max: 6
        ticks: 1
        labels: integers
        initial: -4

  - kind: problem
    id: sortieren
    widget: order
    prompt: Order from smallest to largest.
    params:
      direction: horizontal
      startLabel: small
      endLabel: large
      items: [{ label: "−10" }, { label: "−4" }, { label: "−1" }, { label: "0" }, { label: "3" }]
    hints:
      - On the number line, the smallest number is furthest left.
    explanation: The further left, the smaller – −10 is the smallest.

  - kind: explain
    id: s2
    body: |
      The **absolute value** |x| is the distance from zero. It is never negative.
      |−7| = 7 and |7| = 7.

  - kind: problem
    id: betrag
    widget: numeric
    prompt: What is |{{a}}| + |{{b}}|?
    params: { placeholder: "Sum" }
    answer: { value: "{{abs(a) + abs(b)}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: no-abs
        text: The absolute value makes every number positive – only then add.
    hints:
      - "|{{a}}| = {{abs(a)}}."
    explanation: "{{abs(a)}} + {{abs(b)}} = {{abs(a) + abs(b)}}."
    variants:
      params: { a: "int[-9,-2]", b: "int[2,9]" }
      defaults: { a: -7, b: 4 }

  - kind: problem
    id: groesser
    widget: choice
    prompt: Which number is larger – −8 or −3?
    params:
      layout: grid
      options:
        - { label: "−3", correct: true }
        - { label: "−8", feedback: "8 is more than 3 – but −8 is further left." }
    hints:
      - Which temperature is warmer?
    explanation: −3 °C is warmer than −8 °C. So −3 is larger.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The absolute value is the [[distance]] to zero. It is never [[negative]]. |−9| is [[9]].
      distractors:
        - −9
        - positive

  - kind: problem
    id: ma-c1
    widget: numberline
    prompt: Put the marker on the negative number whose absolute value is 4.
    params:
      min: -6
      max: 6
      ticks: 1
      labels: integers
    answer:
      value: -4
    hints:
      - The absolute value is the distance from zero.
      - 4 steps from zero – on the left side.
    explanation: "|−4| = 4. The number −4 lies 4 steps left of zero."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Compute: $|3 - 8| - |{-2}|$"
    answer:
      value: 3
    hints:
      - "First compute what is inside: 3 − 8 = −5."
    explanation: "|−5| = 5 and |−2| = 2, so 5 − 2 = 3."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: choice
    prompt: Which numbers have absolute value 6? Choose all.
    params:
      multiple: true
      options:
        - label: "6"
          correct: true
        - label: −6
          correct: true
        - label: −(−6)
          correct: true
        - label: That is the reciprocal, not the absolute value.
          feedback: Das ist der Kehrwert, nicht der Betrag.
        - label: "|0| = 0."
          feedback: "|0| = 0."
    hints:
      - The absolute value is the distance from zero.
      - −(−6) is the same as 6.
    explanation: 6 and −6 are both 6 away from zero. −(−6) is just 6.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "The **distance** between two numbers is the absolute value of their difference: |a − b|. From −7 to 5 it is |5 − (−7)| = 12 steps."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: How far apart are {{a}} and {{b}} on the number line?
    answer:
      value: "{{b - a}}"
    feedback:
      - when: numval(state.input) == b + a
        misconception: abs-difference
        text: You subtracted the part left of zero. Both stretches count.
    hints:
      - Count to zero first, then on.
      - "{{-a}} + {{b}} = ?"
    explanation: "|{{b}} − ({{a}})| = {{b - a}}."
    difficulty: 2
    variants:
      params:
        a: int[-9,-1]
        b: int[1,9]
      defaults:
        a: -7
        b: 5

  - kind: problem
    id: ma-d4
    depth: 2
    widget: order
    prompt: Order by absolute value – smallest first.
    params:
      items:
        - label: "0"
        - label: −1
        - label: "4"
        - label: −5
        - label: "7"
        - label: −9
    hints:
      - Ignore the sign.
      - Only the distance from zero counts.
    explanation: The absolute values are 0, 1, 4, 5, 7 and 9.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How many numbers x satisfy $|x - 2| = 5$?
    params:
      options:
        - label: "Two: 7 and −3"
          correct: true
        - label: "One: 7"
          feedback: −3 also has distance 5 from 2.
        - label: None
          feedback: The distance 5 from 2 can be marked off in both directions.
    hints:
      - "|x − 2| is the distance from x to 2."
    explanation: The absolute value of a difference is a **distance**. Two points lie 5 away from 2.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: How many integers x satisfy $|x| \le 3$?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 3
        misconception: forgot-negatives
        text: The negatives −1, −2, −3 count too.
      - when: numval(state.input) == 6
        misconception: forgot-zero
        text: "0 counts too: |0| = 0 ≤ 3."
    hints:
      - Which numbers are at most 3 from zero?
      - From −3 to 3.
    explanation: −3, −2, −1, 0, 1, 2, 3 – that is 7 numbers.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Is $|a + b| = |a| + |b|$ always true?
    params:
      options:
        - label: Try a = 3, b = −5.
          feedback: Probiere a = 3, b = −5.
        - label: No – with different signs the left side is smaller
          correct: true
        - label: With a = 2, b = 3 it holds.
          feedback: Bei a = 2, b = 3 stimmt es.
    hints:
      - Plug in a = 3 and b = −5.
      - "|3 + (−5)| = 2, but |3| + |−5| = 8."
    explanation: $|a + b| \le |a| + |b|$ always holds – the triangle inequality. Equality only with equal signs or a zero.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what the absolute value of a number is and why it is never negative.
    params:
      keywords:
        - - abstand
          - entfernt
          - distance
          - away
          - far
        - - "null"
          - zero
        - - nie
          - kein
          - never
          - positiv
          - positive
      sample: The absolute value is a number’s distance from zero. A distance is never negative. So 5 and −5 both have absolute value 5.
    explanation: "Key idea: absolute value = distance from zero. Distances have no sign."
    difficulty: 3

srs:
  cards_from: [betrag, groesser]
