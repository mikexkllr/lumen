id: math.negative.line
type: concept
title: Numbers below zero
summary: Left of zero, numbers get smaller – even if the digit looks bigger.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.line]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Below freezing
    body: In winter, the thermometer slips below zero. Drag the point left from 3 degrees, past zero. The digits grow again – but is it getting warmer? Welcome to **negative numbers**.
    visual:
      widget: numberline
      interactive: true
      params:
        min: -6
        max: 6
        ticks: 1
        labels: integers
        initial: 3

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how cold is the coldest place ever measured on Earth (in °C)?"
    params:
      min: -150
      max: 0
      unit: °C
    answer:
      value: -89
      tolerance: 12
    explanation: −89.2 °C, measured in 1983 at Vostok Station in Antarctica.

  - kind: problem
    id: minus-drei
    widget: numberline
    prompt: Place the marker on −3.
    params: { min: -5, max: 5, ticks: 1 }
    answer: { value: -3 }
    feedback:
      - when: "state.value == 3"
        misconception: sign
        text: That is +3. Negative numbers are left of zero.
    hints:
      - Negative numbers are left of 0.
    explanation: −3 is three steps left of zero.

  - kind: explain
    id: s2
    body: |
      Left of zero are the **negative numbers**.
      The further left, the smaller – −5 is smaller than −2.
    visual:
      widget: numberline
      params: { min: -5, max: 5, ticks: 1 }

  - kind: problem
    id: sortieren
    widget: order
    prompt: Sort from smallest to largest.
    params:
      direction: horizontal
      items: [{ label: "−7" }, { label: "−2" }, { label: "0" }, { label: "3" }]
      startLabel: small
      endLabel: large
    hints:
      - Picture the number line. What is furthest left?
    explanation: −7 < −2 < 0 < 3.

  - kind: problem
    id: kleiner
    widget: choice
    prompt: Which number is smaller?
    params:
      layout: grid
      options:
        - { label: "−8", correct: true }
        - { label: "−3", feedback: "8 is more than 3 – but −8 is further left on the number line." }
    hints:
      - Which is colder – −8 °C or −3 °C?
    explanation: −8 is further left, so it is smaller.

  - kind: problem
    id: temperatur
    widget: numeric
    prompt: It is −4 °C. The temperature rises by 6 degrees. How warm is it then?
    params: { unit: "°C" }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 10 || numval(state.input) == -10"
        text: Rising means going right. From −4, it is 4 steps to 0, then 2 more.
    hints:
      - From −4 to 0 is 4 degrees.
    explanation: −4 + 6 = 2.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: You stand at {{a}} and take {{b}} steps to the left. Where do you land?
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == b - a"
        misconception: sign
        text: Check the sign. Everything left of zero is negative.
    hints:
      - Going left means minus.
    explanation: "{{a}} − {{b}} = {{a - b}}."
    variants:
      params: { a: "int[-3,4]", b: "int[2,8]" }
      constraints: ["a - b < 0", "b - a != a - b"]
      defaults: { a: 2, b: 5 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: −7 is less than −2.
          right: true
        - text: −10 is greater than −1 because 10 is greater than 1.
          right: false
          why: "Further left means smaller: −10 lies left of −1."
        - text: Every negative number is less than 0.
          right: true
        - text: 0 is a negative number.
          right: false
          why: Zero is neither positive nor negative.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Which number lies exactly halfway between −7 and 3?
    answer:
      value: -2
    hints:
      - The distance is 10. Go five steps right from −7.
    explanation: "The midpoint is the average: (−7 + 3) ÷ 2 = −2."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Every number has an **opposite**. It is just as far from zero, but on the other side. 3 and −3 are opposites. Together they make 0.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numberline
    prompt: Put the marker on the opposite of {{a}}.
    params:
      min: -10
      max: 10
      ticks: 1
      labels: integers
    answer:
      value: "{{-a}}"
    hints:
      - Same distance from zero – on the other side.
      - "{{a}} is {{a}} steps right of zero. Go {{a}} steps to the left."
    explanation: The opposite of {{a}} is {{-a}}, because {{a}} + ({{-a}}) = 0.
    variants:
      params:
        a: int[2,9]
      defaults:
        a: 6
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Greater or less than −5?
    params:
      buckets:
        - id: b1
          label: less than −5
        - id: b2
          label: greater than −5
      items:
        - label: −7
          bucket: b1
        - label: −3
          bucket: b2
        - label: "0"
          bucket: b2
        - label: −5.5
          bucket: b1
        - label: −4.9
          bucket: b2
        - label: −10
          bucket: b1
    hints:
      - Less means further left on the number line.
      - −5.5 is half a step left of −5.
    explanation: −7, −5.5 and −10 lie left of −5, so they are less. −3, 0 and −4.9 lie to its right.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: How many whole numbers lie between −4 and 3? Do not count the two ends.
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 7
        misconception: distance-vs-count
        text: That is the distance from −4 to 3. Count the numbers in between one by one.
      - when: numval(state.input) == 8
        misconception: count-ends
        text: Without the ends −4 and 3.
    hints:
      - "Count them: −3, −2, …"
      - 0 counts too.
    explanation: −3, −2, −1, 0, 1, 2 – that is 6 numbers.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is there a smallest negative number?
    params:
      options:
        - label: No – you can always subtract 1 more
          correct: true
        - label: Yes, −1
          feedback: −2 is already smaller.
        - label: Yes, minus infinity
          feedback: Infinity is not a number on the line but a direction.
    hints:
      - Take any negative number. Can you find a smaller one?
    explanation: The number line has no end in either direction.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: Is there a **largest** negative number?
    params:
      options:
        - label: Yes, −1
          feedback: True for whole numbers. But −0.5 is larger and negative too.
        - label: No – −0.1, −0.01, −0.001 … get ever closer to zero
          correct: true
        - label: Yes, 0
          feedback: 0 is neither positive nor negative.
    hints:
      - Think about decimals too.
      - Is −0.001 negative? Is −0.0001 larger?
    explanation: "Every negative number has a larger one: its half. You get as close to zero as you like but never reach it."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Why do we need negative numbers at all?
    reveal:
      body: So that every subtraction has an answer. 3 − 5 is impossible with 0, 1, 2, … alone. Adding the negatives gives the integers ℤ.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why −8 is less than −3, even though 8 is greater than 3.
    params:
      keywords:
        - - links
          - left
        - - "null"
          - zero
        - - weiter
          - abstand
          - entfernt
          - further
          - distance
          - away
      sample: On the number line −8 is further left than −3. The further left, the smaller. −8 is further from zero, but on the negative side.
    explanation: "Key idea: smaller means further left – not a smaller digit."
    difficulty: 3

srs:
  cards_from: ["schritte"]
