id: math.negative.line
type: concept
title: Numbers below zero
summary: Left of zero, numbers get smaller – even if the digit looks bigger.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [neg.line]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how cold is the coldest place ever measured on Earth (in °C)?"
    params:
      min: -150
      max: 0
      unit: °C
    answer:
      value: -89
      tolerance: 12
    explanation: −89.2 °C, measured in 1983 at Vostok Station in Antarctica.


  - kind: problem
    id: minus-drei
    widget: numberline
    prompt: Place the marker on −3.
    params: { min: -5, max: 5, ticks: 1 }
    answer: { value: -3 }
    feedback:
      - when: "state.value == 3"
        misconception: sign
        text: That is +3. Negative numbers are left of zero.
    hints:
      - Negative numbers are left of 0.
    explanation: −3 is three steps left of zero.

  - kind: explain
    id: s2
    body: |
      Left of zero are the **negative numbers**.
      The further left, the smaller – −5 is smaller than −2.
    visual:
      widget: numberline
      params: { min: -5, max: 5, ticks: 1 }

  - kind: problem
    id: sortieren
    widget: order
    prompt: Sort from smallest to largest.
    params:
      direction: horizontal
      items: [{ label: "−7" }, { label: "−2" }, { label: "0" }, { label: "3" }]
      startLabel: small
      endLabel: large
    hints:
      - Picture the number line. What is furthest left?
    explanation: −7 < −2 < 0 < 3.

  - kind: problem
    id: kleiner
    widget: choice
    prompt: Which number is smaller?
    params:
      layout: grid
      options:
        - { label: "−8", correct: true }
        - { label: "−3", feedback: "8 is more than 3 – but −8 is further left on the number line." }
    hints:
      - Which is colder – −8 °C or −3 °C?
    explanation: −8 is further left, so it is smaller.

  - kind: problem
    id: temperatur
    widget: numeric
    prompt: It is −4 °C. The temperature rises by 6 degrees. How warm is it then?
    params: { unit: "°C" }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 10 || numval(state.input) == -10"
        text: Rising means going right. From −4, it is 4 steps to 0, then 2 more.
    hints:
      - From −4 to 0 is 4 degrees.
    explanation: −4 + 6 = 2.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: You stand at {{a}} and take {{b}} steps to the left. Where do you land?
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == b - a"
        misconception: sign
        text: Check the sign. Everything left of zero is negative.
    hints:
      - Going left means minus.
    explanation: "{{a}} − {{b}} = {{a - b}}."
    variants:
      params: { a: "int[-3,4]", b: "int[2,8]" }
      constraints: ["a - b < 0", "b - a != a - b"]
      defaults: { a: 2, b: 5 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: −7 is less than −2.
          right: true
        - text: −10 is greater than −1 because 10 is greater than 1.
          right: false
          why: "Further left means smaller: −10 lies left of −1."
        - text: Every negative number is less than 0.
          right: true
        - text: 0 is a negative number.
          right: false
          why: Zero is neither positive nor negative.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Which number lies exactly halfway between −7 and 3?
    answer:
      value: -2
    hints:
      - The distance is 10. Go five steps right from −7.
    explanation: "The midpoint is the average: (−7 + 3) ÷ 2 = −2."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is there a smallest negative number?
    params:
      options:
        - label: No – you can always subtract 1 more
          correct: true
        - label: Yes, −1
          feedback: −2 is already smaller.
        - label: Yes, minus infinity
          feedback: Infinity is not a number on the line but a direction.
    hints:
      - Take any negative number. Can you find a smaller one?
    explanation: The number line has no end in either direction.
    difficulty: 3

srs:
  cards_from: ["schritte"]
