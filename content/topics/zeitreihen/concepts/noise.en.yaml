id: stats.timeseries.noise
type: concept
title: Signal or Noise?
summary: Separating chance from real change.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: einzeltag
    widget: choice
    prompt: A shop has 15% fewer customers today than yesterday. What do you conclude?
    params:
      options:
        - { label: Nothing yet – single days fluctuate a lot., correct: true }
        - { label: The shop is losing customers., feedback: "A single day is almost always noise." }
    hints:
      - How much do days normally fluctuate?
    explanation: Only several values in the same direction point to a real signal.

  - kind: explain
    id: s2
    body: |
      **Noise** is random fluctuation. **Signal** is the real change behind it. The stronger the noise, the more data you need to detect a signal reliably.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: More likely noise or signal?
    params:
      buckets: [{ label: Noise }, { label: Signal }]
      items:
        - { label: A cold day in July, bucket: Noise }
        - { label: One weak week, bucket: Noise }
        - { label: 10 years of rising temperature, bucket: Signal }
        - { label: 6 months of falling sales, bucket: Signal }
    hints:
      - How long does the change last?
    explanation: Weather is noise, and climate is the signal underneath.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A factory measures its defect rate daily. When should one intervene?
    params:
      options:
        - label: When a value lies clearly outside the usual range of fluctuation
          correct: true
        - label: At every deviation from the day before
          feedback: Then you chase chance and often make it worse.
        - label: Never
          feedback: Real problems must be recognised.
    hints:
      - How much does the value fluctuate on normal days?
    explanation: A **control chart** marks the usual limits. Only what exceeds them is a signal.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The noise of a measurement shrinks with 1/√n when averaging. How many measurements must be averaged to cut the noise to a tenth?
    answer:
      value: 100
    hints:
      - √n should be 10.
    explanation: 100 measurements. That is how astronomers pull faint signals out of noise – by exposing for hours.
    difficulty: 3

srs:
  cards_from: [einzeltag, einordnen]
