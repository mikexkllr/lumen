id: stats.timeseries.trend
type: concept
title: Der Trend
summary: Die große Richtung erkennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Eine Aktie fällt heute um 2 %. In den letzten zehn Jahren ist sie stark gestiegen. Was sagt mehr über die lange Entwicklung?
    params:
      options:
        - label: Die zehn Jahre
          correct: true
        - label: Der heutige Tag
          feedback: Ein Tag ist nur ein Zacken.
        - label: Beides gleich
          feedback: Ein Tag wiegt weniger als zehn Jahre.
    hints:
      - Schau auf die große Richtung, nicht auf den Zacken.
    explanation: Die große Richtung nennt man Trend.

  - kind: explain
    id: s1
    body: |
      Eine **Zeitreihe** sind Messwerte in zeitlicher Abfolge – Umsätze pro Monat, Temperaturen pro Tag. Der **Trend** ist die langfristige Richtung, wenn man die Schwankungen ausblendet.

  - kind: problem
    id: fortsetzen
    widget: chart
    prompt: Der Umsatz steigt gleichmäßig. Stell die Prognose für Monat 6 ein.
    params:
      labels: [M1, M2, M3, M4, M5, M6]
      values: [10, 12, 14, 16, 18, 0]
      editable: [5]
      min: 0
      max: 30
      unit: Tsd. €
    answer: { values: [10, 12, 14, 16, 18, 20] }
    hints:
      - Jeden Monat kommen 2 dazu.
    explanation: Plus 2 pro Monat – Monat 6 liegt bei 20.

  - kind: problem
    id: art
    widget: buckets
    prompt: Welcher Trend ist das?
    params:
      buckets: [{ label: steigend }, { label: fallend }, { label: ohne Trend }]
      items:
        - { label: Weltbevölkerung seit 1900, bucket: steigend }
        - { label: Preis pro Gigabyte Speicher, bucket: fallend }
        - { label: Augenzahl beim Würfeln, bucket: ohne Trend }
        - { label: CO₂ in der Luft, bucket: steigend }
    hints:
      - Würfelwürfe hängen nicht voneinander ab.
    explanation: Zufällige Werte schwanken nur – ein Trend ist eine anhaltende Richtung.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Die Weltbevölkerung seit 1900
          right: true
        - text: Die Augenzahl beim Würfeln
          right: false
        - text: Der CO₂-Gehalt der Luft
          right: true
        - text: Die Tagestemperatur über ein einzelnes Jahr
          right: false
          why: Das ist ein Saisonmuster – am Ende ist man wieder am Anfang.
      left: Kein Trend
      right: Trend

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Umsatz wächst jeden Monat um 5 %. Um wie viel Prozent wächst er in einem Jahr? Gerundet. (1,05¹² ≈ 1,796)
    params:
      unit: "%"
    answer:
      value: 80
      tolerance: 1
    hints:
      - Nicht 12 · 5 – die Zuwächse bauen aufeinander auf.
    explanation: 79,6 % statt 60 %. Ein **exponentieller** Trend sieht in einer normalen Grafik gekrümmt aus.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Ein Umsatz verdoppelt sich in 10 Jahren von 100 auf 200. Um wie viel Prozent wuchs er im Schnitt **pro Jahr**? Auf eine Stelle. (2^0,1 ≈ 1,0718)
    answer:
      value: 7.2
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 10
        misconception: linear-growth
        text: 10 % pro Jahr wären nach 10 Jahren das 2,59-Fache – Zinseszins!
    hints:
      - Gesucht ist der Faktor q mit q¹⁰ = 2.
      - q = 2^0,1 ≈ 1,0718.
    explanation: Etwa 7,2 % pro Jahr. Diese **mittlere Wachstumsrate** ist ein geometrisches Mittel, kein einfacher Durchschnitt.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Faustregel: Bei p % Wachstum pro Jahr verdoppelt sich ein Wert in etwa 70/p Jahren. Wie lange dauert es bei {{p}} %?"
    params:
      unit: Jahre
    answer:
      value: "{{70 / p}}"
    hints:
      - Teile 70 durch {{p}}.
      - "70 : {{p}} = ?"
    explanation: Etwa {{70 / p}} Jahre. Die 70 kommt von ln 2 ≈ 0,693.
    difficulty: 2
    variants:
      params:
        p: choice[2,5,7,10,14,35]
      defaults:
        p: 7

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Trend der letzten 10 Jahre wird als Gerade 50 Jahre in die Zukunft verlängert. Was ist das Risiko?
    params:
      options:
        - label: Nichts wächst ewig geradlinig – Sättigung oder Brüche werden übersehen
          correct: true
        - label: Geraden kann man nicht verlängern
          feedback: Rechnerisch geht das mühelos – darin liegt die Versuchung.
        - label: Es gibt keines
          feedback: Um 1900 hätte man so einen Pferdemist-Kollaps der Städte vorhergesagt.
    hints:
      - Gilt, was 10 Jahre galt, auch für 50?
    explanation: "**Extrapolation** setzt voraus, dass sich die Ursachen nicht ändern. Je weiter hinaus, desto gewagter."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Die Zahl der Smartphones und der Ausstoß einer Fabrik steigen seit Jahren. Ihre Korrelation ist r = 0,95. Was ist der wichtigste Einwand?
    params:
      options:
        - label: Zwei Reihen mit Trend korrelieren fast immer – man muss die Änderungen vergleichen
          correct: true
        - label: r = 0,95 ist zu klein
          feedback: r ist sogar sehr groß – genau das täuscht.
        - label: Kein Einwand, der Zusammenhang ist klar
          feedback: Fast alles, was wächst, korreliert.
    hints:
      - Wovon hängen beide Reihen gemeinsam ab?
      - Vergleiche, ob gute Jahre der einen auch gute Jahre der anderen sind.
    explanation: "Das ist eine **Scheinregression**. Statistiker bilden darum Differenzen: Jahr minus Vorjahr. Erst wenn auch die Änderungen korrelieren, wird es interessant."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Eine Reihe lautet 3, 5, 9, 15, 23. Die Differenzen sind 2, 4, 6, 8. Welcher Trend passt?
    params:
      options:
        - label: Quadratisch – die zweiten Differenzen sind konstant
          correct: true
        - label: Linear
          feedback: Bei linearem Trend wären schon die ersten Differenzen gleich.
        - label: Exponentiell
          feedback: Dann wüchsen die Quotienten gleich, nicht die zweiten Differenzen.
    hints:
      - "Bilde noch einmal Differenzen: 4 − 2, 6 − 4, 8 − 6."
      - Immer 2 – was bedeutet das?
    explanation: "Konstante zweite Differenzen bedeuten einen quadratischen Trend: hier n² − n + 3. Differenzen bilden ist ein Kernwerkzeug der Zeitreihen-Analyse."
    difficulty: 3

srs:
  cards_from: [fortsetzen, art]
