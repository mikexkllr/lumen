id: stats.timeseries.trend
type: concept
title: Der Trend
summary: Die große Richtung erkennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Eine **Zeitreihe** sind Messwerte in zeitlicher Abfolge – Umsätze pro Monat, Temperaturen pro Tag. Der **Trend** ist die langfristige Richtung, wenn man die Schwankungen ausblendet.

  - kind: problem
    id: fortsetzen
    widget: chart
    prompt: Der Umsatz steigt gleichmäßig. Stell die Prognose für Monat 6 ein.
    params:
      labels: [M1, M2, M3, M4, M5, M6]
      values: [10, 12, 14, 16, 18, 0]
      editable: [5]
      min: 0
      max: 30
      unit: Tsd. €
    answer: { values: [10, 12, 14, 16, 18, 20] }
    hints:
      - Jeden Monat kommen 2 dazu.
    explanation: Plus 2 pro Monat – Monat 6 liegt bei 20.

  - kind: problem
    id: art
    widget: buckets
    prompt: Welcher Trend ist das?
    params:
      buckets: [{ label: steigend }, { label: fallend }, { label: ohne Trend }]
      items:
        - { label: Weltbevölkerung seit 1900, bucket: steigend }
        - { label: Preis pro Gigabyte Speicher, bucket: fallend }
        - { label: Augenzahl beim Würfeln, bucket: ohne Trend }
        - { label: CO₂ in der Luft, bucket: steigend }
    hints:
      - Würfelwürfe hängen nicht voneinander ab.
    explanation: Zufällige Werte schwanken nur – ein Trend ist eine anhaltende Richtung.

srs:
  cards_from: [fortsetzen, art]
