id: stats.timeseries.average
type: concept
title: Gleitende Durchschnitte
summary: Zacken glätten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ruhe im Zickzack
    body: Wer jeden Tag auf neue Zahlen schaut, sieht vor allem Zacken. Deck die Karten auf, in beliebiger Reihenfolge. Jede zeigt einen **gleitenden Durchschnitt**, der dir im Alltag begegnet.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦠
            front: Die 7-Tage-Inzidenz
            back: Am Wochenende meldeten Ämter weniger Fälle. Der Blick auf 7 Tage auf einmal glättete diese Zacken weg.
          - icon: 📈
            front: Die 200-Tage-Linie
            back: Anleger schauen auf den Schnitt der letzten 200 Tage. Er zeigt den Trend hinter dem täglichen Zittern.
          - icon: 🌡️
            front: Das Klimamittel
            back: Klima ist der Schnitt des Wetters über 30 Jahre. Ein einzelner kalter Winter ändert daran wenig.

  - kind: problem
    id: hook
    widget: numeric
    prompt: Du läufst an drei Tagen 4, 6 und 8 km. Wie viele Kilometer sind das im Schnitt pro Tag?
    params:
      unit: km
    answer:
      value: 6
    hints:
      - Alles addieren und durch 3 teilen.
    explanation: Der Schnitt glättet einzelne Tage. Das nutzt man auch für lange Zeitreihen.

  - kind: explain
    id: s1
    body: |
      Ein **gleitender Durchschnitt** mittelt immer die letzten paar Werte. Er glättet zufällige Zacken und macht den Verlauf sichtbar – so werden etwa Infektionszahlen über 7 Tage gemittelt.

  - kind: problem
    id: drei
    widget: numeric
    prompt: Die letzten drei Tage hatten {{a}}, {{b}} und {{c}} Besucher. Wie groß ist der 3-Tage-Durchschnitt?
    params: { unit: Besucher }
    answer: { value: "{{(a + b + c) / 3}}" }
    hints:
      - Alle drei addieren, durch 3 teilen.
    explanation: "({{a}} + {{b}} + {{c}}) : 3 = {{(a + b + c) / 3}}."
    variants:
      params: { a: "int[10,40]", b: "int[10,40]", m: "int[0,2]" }
      derive: { c: "30 + m - ((a + b + 30 + m) % 3)" }
      constraints: ["(a + b + c) % 3 == 0"]
      defaults: { a: 20, b: 25, m: 0 }

  - kind: problem
    id: geglaettet
    widget: chart
    body: "Tageswerte: 4, 8, 6, 10, 8. Der 3-Tage-Durchschnitt ab Tag 3 ist 6, 8, 8."
    prompt: Stell die geglätteten Werte für die Tage 3 bis 5 ein.
    params:
      labels: [Tag 3, Tag 4, Tag 5]
      values: [0, 0, 0]
      editable: [0, 1, 2]
      min: 0
      max: 12
    answer: { values: [6, 8, 8] }
    hints:
      - Steht schon im Text – übertrage die Werte.
    explanation: Die geglättete Reihe schwankt viel weniger als die Rohwerte.

  - kind: problem
    id: verzoegerung
    widget: choice
    prompt: Was ist ein Nachteil gleitender Durchschnitte?
    params:
      options:
        - { label: Sie reagieren verzögert auf echte Veränderungen., correct: true }
        - { label: Sie verfälschen alle Werte zufällig., feedback: "Sie glätten nur – aber sie hinken hinterher." }
    hints:
      - Was passiert, wenn plötzlich alles hochschießt?
    explanation: Weil alte Werte mitzählen, zeigt sich eine Wende erst nach einigen Tagen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Werte: 4, 10, 4, 10, 4, 10. Wie groß ist jeder gleitende Durchschnitt über **zwei** Werte?"
    answer:
      value: 7
    hints:
      - "(4 + 10) : 2."
    explanation: Immer 7 – die Zacken verschwinden völlig. Die Fensterbreite sollte zur Periode des Musters passen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Beim exponentiellen Glätten gilt: neu = {{a}} · Messwert + {{1 - a}} · alt. Der alte geglättete Wert ist {{s}}, gemessen wird {{x}}. Wie groß ist der neue geglättete Wert?"
    answer:
      value: "{{a * x + (1 - a) * s}}"
    hints:
      - Rechne {{a}} · {{x}} und {{1 - a}} · {{s}}.
      - Addiere beides.
    explanation: "{{a * x}} + {{(1 - a) * s}} = {{a * x + (1 - a) * s}}. Der neue Wert rückt ein Stück in Richtung Messung."
    difficulty: 2
    variants:
      params:
        a: choice[0.2,0.5]
        s: step[10,50,10]
        x: step[20,80,10]
      constraints:
        - x != s
      defaults:
        a: 0.5
        s: 10
        x: 20

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Eine Kurve zeigt den Schnitt der **letzten** 7 Tage. Ab heute steigt eine Zahl plötzlich stark. Wann zeigt die Kurve den Sprung voll?
    params:
      options:
        - label: Erst nach 7 Tagen – sie hinkt im Mittel 3 Tage hinterher
          correct: true
        - label: Sofort
          feedback: Heute macht nur 1/7 des Schnitts aus.
        - label: Nie
          feedback: Nach einer Woche sind nur noch neue Werte im Fenster.
    hints:
      - Wie viele neue Werte stecken nach einem Tag im Fenster?
      - Das Fenster ist erst nach 7 Tagen ganz »neu«.
    explanation: Ein nachlaufender Durchschnitt glättet und **verzögert** zugleich. Ein zentrierter Schnitt (3 Tage davor, 3 danach) verzögert nicht – braucht aber Daten aus der Zukunft.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Beim **exponentiellen Glätten** zählt der neueste Wert am meisten, ältere immer weniger. Was ist der Vorteil gegenüber dem einfachen gleitenden Durchschnitt?
    params:
      options:
        - label: Es reagiert schneller auf echte Änderungen und braucht nur den letzten geglätteten Wert
          correct: true
        - label: Es glättet gar nicht
          feedback: Es glättet – nur mit abnehmenden Gewichten.
        - label: Es sagt die Zukunft exakt vorher
          feedback: Kein Verfahren kann das.
    hints:
      - Soll ein Wert von vor 30 Tagen so viel zählen wie der von gestern?
    explanation: Neuer Wert = α · Messung + (1 − α) · alter Wert. Dieselbe Formel steckt in vielen Sensoren und Lernverfahren.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Beim exponentiellen Glätten mit α = 0,5 bekommt der neueste Wert Gewicht 0,5, der davor 0,25 und so weiter: α · (1 − α)^k. Welches Gewicht hat der Wert von **vor 3 Schritten** (k = 3)?"
    answer:
      value: 0.0625
      tolerance: 0.0001
    hints:
      - Rechne 0,5 · 0,5³.
      - 0,5 · 0,125.
    explanation: 0,5 · 0,125 = 0,0625. Die Gewichte fallen **geometrisch** ab und summieren sich zu 1. Alte Werte verblassen, verschwinden aber nie ganz.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Monatsdaten mit starkem Saisonmuster. Über wie viele Monate muss ein gleitender Schnitt laufen, damit die Saison ganz verschwindet?
    params:
      options:
        - label: 12 – dann steckt jeder Monat genau einmal drin
          correct: true
        - label: "3"
          feedback: Drei Monate glätten nur kurze Zacken.
        - label: "7"
          feedback: Sieben passt zu Wochentagen, nicht zu Monaten.
    hints:
      - Wie lang ist eine Saison bei Monatsdaten?
      - Jedes Fenster sollte jeden Monat gleich oft enthalten.
    explanation: Ein 12-Monats-Schnitt enthält immer einen Sommer und einen Winter. Bei Tagesdaten mit Wochenrhythmus nimmt man darum 7 Tage.
    difficulty: 3

srs:
  cards_from: [drei, verzoegerung]
