id: stats.timeseries.noise
type: concept
title: Signal oder Rauschen?
summary: Zufall von echten Änderungen trennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zufall oder Absturz?
    body: Ein Laden hat im Schnitt 100 Kunden am Tag. Zieh am Regler, wie stark die Tage zufällig **schwanken**. Wie oft liegt ein Tag dann außerhalb von 90 bis 110?
    visual:
      widget: sim
      interactive: true
      params:
        scene: normal
        interval:
          - 90
          - 110
        controls:
          mean:
            value: 100
            fixed: true

  - kind: problem
    id: einzeltag
    widget: choice
    prompt: Ein Laden hat heute 15 % weniger Kunden als gestern. Was schließt du daraus?
    params:
      options:
        - { label: Noch nichts – einzelne Tage schwanken stark., correct: true }
        - { label: Der Laden verliert Kunden., feedback: "Ein einziger Tag ist fast immer Rauschen." }
    hints:
      - Wie stark schwanken Tage normalerweise?
    explanation: Erst mehrere Werte in dieselbe Richtung deuten auf ein echtes Signal.

  - kind: explain
    id: s2
    body: |
      **Rauschen** sind zufällige Schwankungen, **Signal** ist die echte Veränderung dahinter. Je stärker das Rauschen, desto mehr Daten braucht man, um ein Signal sicher zu erkennen.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Eher Rauschen oder eher Signal?
    params:
      buckets: [{ label: Rauschen }, { label: Signal }]
      items:
        - { label: Ein kalter Tag im Juli, bucket: Rauschen }
        - { label: Eine schwache Woche, bucket: Rauschen }
        - { label: 10 Jahre steigende Temperatur, bucket: Signal }
        - { label: 6 Monate sinkender Umsatz, bucket: Signal }
    hints:
      - Wie lange hält die Veränderung an?
    explanation: Wetter ist Rauschen, Klima ist das Signal darunter.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Fabrik misst täglich ihre Fehlerquote. Wann sollte man eingreifen?
    params:
      options:
        - label: Wenn ein Wert klar außerhalb der üblichen Schwankungsbreite liegt
          correct: true
        - label: Bei jeder Abweichung vom Vortag
          feedback: Dann jagt man dem Zufall hinterher und macht es oft schlimmer.
        - label: Nie
          feedback: Echte Probleme muss man erkennen.
    hints:
      - Wie stark schwankt der Wert an normalen Tagen?
    explanation: Eine **Regelkarte** zeichnet die üblichen Grenzen ein. Nur was sie überschreitet, ist ein Signal.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Ein Messwert schwankt mit σ = {{s}}. Du mittelst {{n}} Messungen. Wie stark schwankt der Mittelwert?
    answer:
      value: "{{s / sqrt(n)}}"
    feedback:
      - when: numval(state.input) == s / n
        misconception: divide-by-n
        text: Durch n zu teilen ist zu optimistisch. Rauschen sinkt mit √n.
    hints:
      - Das Rauschen schrumpft mit der Wurzel aus n.
      - "Rechne {{s}} : {{sqrt(n)}}."
    explanation: "{{s}} : {{sqrt(n)}} = {{s / sqrt(n)}}. Das ist der **Standardfehler** des Mittelwerts."
    difficulty: 2
    variants:
      params:
        s: choice[6,10,12,20]
        n: choice[4,16,25,100]
      defaults:
        s: 12
        n: 16

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Eine **Kontrollkarte** setzt Grenzen bei Mittelwert ± 3σ. Die Fehlerquote liegt im Schnitt bei 50 mit σ = 2. Wo liegt die obere Grenze?
    answer:
      value: 56
    hints:
      - 3σ = 6.
      - Rechne 50 + 6.
    explanation: 50 + 6 = 56. Liegt ein Tag darüber, lohnt sich ein Blick. Werte innerhalb der Grenzen sind normales Rauschen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Das Rauschen eines Messwerts schrumpft beim Mitteln mit 1/√n. Wie viele Messungen muss man mitteln, um das Rauschen auf ein Zehntel zu senken?
    answer:
      value: 100
    hints:
      - √n soll 10 sein.
    explanation: 100 Messungen. So holen Astronomen schwache Signale aus dem Rauschen – durch stundenlanges Belichten.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Bei reinem Rauschen liegt ein Wert mit 0,27 % Chance außerhalb von ± 3σ. Wie viele Fehlalarme erwartest du in 1000 Tagen? Gerundet.
    answer:
      value: 3
      tolerance: 0.5
    hints:
      - Rechne 1000 · 0,0027.
      - 2,7 – gerundet?
    explanation: Etwa 3 Fehlalarme. Darum ergänzt man Regeln wie »7 Werte hintereinander über dem Mittel« – sie finden Verschiebungen, die einzelne Ausreißer verpassen.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: "Du addierst jeden Tag einen zufälligen Münzwurf: +1 oder −1. Nach 100 Tagen sieht die Kurve aus wie ein klarer Trend. Was ist das?"
    params:
      options:
        - label: Eine Irrfahrt – Zufall, der sich aufsummiert, wirkt wie ein Trend
          correct: true
        - label: Ein echter Trend
          feedback: Jeder Schritt war ein fairer Münzwurf.
        - label: Ein Saisonmuster
          feedback: Nichts wiederholt sich regelmäßig.
    hints:
      - Jeder Tag startet dort, wo der letzte aufhörte.
      - Summen von Zufall wandern weg – typisch um √n.
    explanation: Eine **Irrfahrt** wandert nach 100 Schritten typisch etwa 10 weg. Aktienkurse ähneln ihr. Wer darin Trends sieht, sieht oft nur Zufall.
    difficulty: 3

srs:
  cards_from: [einzeltag, einordnen]
