id: stats.timeseries.noise
type: concept
title: Signal oder Rauschen?
summary: Zufall von echten Änderungen trennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: einzeltag
    widget: choice
    prompt: Ein Laden hat heute 15 % weniger Kunden als gestern. Was schließt du daraus?
    params:
      options:
        - { label: Noch nichts – einzelne Tage schwanken stark., correct: true }
        - { label: Der Laden verliert Kunden., feedback: "Ein einziger Tag ist fast immer Rauschen." }
    hints:
      - Wie stark schwanken Tage normalerweise?
    explanation: Erst mehrere Werte in dieselbe Richtung deuten auf ein echtes Signal.

  - kind: explain
    id: s2
    body: |
      **Rauschen** sind zufällige Schwankungen, **Signal** ist die echte Veränderung dahinter. Je stärker das Rauschen, desto mehr Daten braucht man, um ein Signal sicher zu erkennen.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Eher Rauschen oder eher Signal?
    params:
      buckets: [{ label: Rauschen }, { label: Signal }]
      items:
        - { label: Ein kalter Tag im Juli, bucket: Rauschen }
        - { label: Eine schwache Woche, bucket: Rauschen }
        - { label: 10 Jahre steigende Temperatur, bucket: Signal }
        - { label: 6 Monate sinkender Umsatz, bucket: Signal }
    hints:
      - Wie lange hält die Veränderung an?
    explanation: Wetter ist Rauschen, Klima ist das Signal darunter.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Fabrik misst täglich ihre Fehlerquote. Wann sollte man eingreifen?
    params:
      options:
        - label: Wenn ein Wert klar außerhalb der üblichen Schwankungsbreite liegt
          correct: true
        - label: Bei jeder Abweichung vom Vortag
          feedback: Dann jagt man dem Zufall hinterher und macht es oft schlimmer.
        - label: Nie
          feedback: Echte Probleme muss man erkennen.
    hints:
      - Wie stark schwankt der Wert an normalen Tagen?
    explanation: Eine **Regelkarte** zeichnet die üblichen Grenzen ein. Nur was sie überschreitet, ist ein Signal.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Das Rauschen eines Messwerts schrumpft beim Mitteln mit 1/√n. Wie viele Messungen muss man mitteln, um das Rauschen auf ein Zehntel zu senken?
    answer:
      value: 100
    hints:
      - √n soll 10 sein.
    explanation: 100 Messungen. So holen Astronomen schwache Signale aus dem Rauschen – durch stundenlanges Belichten.
    difficulty: 3

srs:
  cards_from: [einzeltag, einordnen]
