id: stats.timeseries.trend
type: concept
title: The Trend
summary: Spotting the big direction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Uphill in a zigzag
    body: Share prices and temperatures jiggle up and down all the time. Yet they often have a direction. Turn the line with the slider until it follows the zigzag. Its slope is the **trend**.
    visual:
      widget: slider
      interactive: true
      params:
        expr: m*x + 1.5
        x:
          - 0
          - 10
        y:
          - 0
          - 10
        showCoordinates: false
        sliders:
          - id: m
            label: Trend
            min: -1
            max: 1.5
            step: 0.25
            initial: 0
        markers:
          - x: 1
            y: 2
          - x: 2
            y: 3.5
          - x: 3
            y: 2.5
          - x: 4
            y: 4
          - x: 5
            y: 3.5
          - x: 6
            y: 5
          - x: 7
            y: 4.5
          - x: 8
            y: 6
          - x: 9
            y: 5.5

  - kind: problem
    id: hook
    widget: choice
    prompt: A share falls by 2% today. Over the last ten years it has risen strongly. Which says more about the long-run development?
    params:
      options:
        - label: The ten years
          correct: true
        - label: Today
          feedback: One day is just a spike.
        - label: Both equally
          feedback: One day weighs less than ten years.
    hints:
      - Look at the overall direction, not the spike.
    explanation: The overall direction is called the trend.

  - kind: explain
    id: s1
    body: |
      A **time series** is a set of measurements in time order – sales per month, temperatures per day. The **trend** is the long-term direction once you ignore the fluctuations.

  - kind: problem
    id: fortsetzen
    widget: chart
    prompt: Sales are rising steadily. Set the forecast for month 6.
    params:
      labels: [M1, M2, M3, M4, M5, M6]
      values: [10, 12, 14, 16, 18, 0]
      editable: [5]
      min: 0
      max: 30
      unit: €k
    answer: { values: [10, 12, 14, 16, 18, 20] }
    hints:
      - Each month adds 2.
    explanation: Plus 2 per month – month 6 is at 20.

  - kind: problem
    id: art
    widget: buckets
    prompt: Which trend is this?
    params:
      buckets: [{ label: rising }, { label: falling }, { label: no trend }]
      items:
        - { label: World population since 1900, bucket: rising }
        - { label: Price per gigabyte of storage, bucket: falling }
        - { label: Number rolled on a die, bucket: no trend }
        - { label: CO₂ in the air, bucket: rising }
    hints:
      - Dice rolls do not depend on each other.
    explanation: Random values only fluctuate – a trend is a lasting direction.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: World population since 1900
          right: true
        - text: The number rolled on a die
          right: false
        - text: The CO₂ content of the air
          right: true
        - text: Daily temperature over a single year
          right: false
          why: That is a seasonal pattern – in the end you are back at the start.
      left: No trend
      right: Trend

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Revenue grows by 5% every month. By what percent does it grow in a year? Rounded. (1.05¹² ≈ 1.796)
    params:
      unit: "%"
    answer:
      value: 80
      tolerance: 1
    hints:
      - Not 12 · 5 – the increases build on each other.
    explanation: 79.6% instead of 60%. An **exponential** trend looks curved on a normal chart.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Sales double in 10 years from 100 to 200. By what percent did they grow on average per year? To one decimal. (2^0.1 ≈ 1.0718)
    answer:
      value: 7.2
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 10
        misconception: linear-growth
        text: 10 % a year would give 2.59 times after 10 years – compound growth!
    hints:
      - You need the factor q with q¹⁰ = 2.
      - q = 2^0.1 ≈ 1.0718.
    explanation: About 7.2 % a year. This average growth rate is a geometric mean, not a simple average.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Rule of thumb: with p % growth per year a value doubles in about 70/p years. How long does it take at {{p}} %?"
    params:
      unit: years
    answer:
      value: "{{70 / p}}"
    hints:
      - Divide 70 by {{p}}.
      - 70 ÷ {{p}} = ?
    explanation: About {{70 / p}} years. The 70 comes from ln 2 ≈ 0.693.
    difficulty: 2
    variants:
      params:
        p: choice[2,5,7,10,14,35]
      defaults:
        p: 7

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The trend of the last 10 years is extended as a straight line 50 years into the future. What is the risk?
    params:
      options:
        - label: Nothing grows in a straight line forever – saturation or breaks are overlooked
          correct: true
        - label: Lines cannot be extended
          feedback: Mathematically it is effortless – that is the temptation.
        - label: There is none
          feedback: Around 1900 this would have predicted cities collapsing under horse manure.
    hints:
      - Does what held for 10 years also hold for 50?
    explanation: "**Extrapolation** assumes the causes do not change. The further out, the bolder."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: The number of smartphones and a factory's output have risen for years. Their correlation is r = 0.95. What is the most important objection?
    params:
      options:
        - label: Two trending series almost always correlate – compare the changes instead
          correct: true
        - label: r is very large – that is exactly what misleads.
          feedback: r ist sogar sehr groß – genau das täuscht.
        - label: Almost everything that grows correlates.
          feedback: Fast alles, was wächst, korreliert.
    hints:
      - What do both series share?
      - Check whether good years of one are also good years of the other.
    explanation: "That is a spurious regression. Statisticians therefore take differences: year minus previous year. Only if the changes correlate too does it get interesting."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A series reads 3, 5, 9, 15, 23. The differences are 2, 4, 6, 8. Which trend fits?
    params:
      options:
        - label: Quadratic – the second differences are constant
          correct: true
        - label: A linear trend would have equal first differences.
          feedback: Bei linearem Trend wären schon die ersten Differenzen gleich.
        - label: Then the ratios would be constant, not the second differences.
          feedback: Dann wüchsen die Quotienten gleich, nicht die zweiten Differenzen.
    hints:
      - "Take differences again: 4 − 2, 6 − 4, 8 − 6."
      - Always 2 – what does that mean?
    explanation: "Constant second differences mean a quadratic trend: here n² − n + 3. Taking differences is a core tool of time-series analysis."
    difficulty: 3

srs:
  cards_from: [fortsetzen, art]
