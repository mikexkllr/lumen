id: stats.timeseries.season
type: concept
title: Seasonal Patterns
summary: What comes back every year.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: An ice cream shop sells four times as much in July as in January. Is business bad in January?
    params:
      options:
        - label: Not necessarily – it is like that every year
          correct: true
        - label: Yes, it is going downhill
          feedback: Next July it rises again.
        - label: The shop will close soon
          feedback: The pattern is quite normal.
    hints:
      - Compare with January of the previous year.
    explanation: Such patterns repeat every year. You have to factor them out.

  - kind: explain
    id: s1
    body: |
      Many time series have a **seasonal pattern**: ice cream sells in summer, heating oil in winter. For a forecast, you combine the pattern with the trend.

  - kind: problem
    id: eis
    widget: chart
    body: Ice cream sales per quarter. Each quarter is 2 above the same quarter of the previous year.
    prompt: Set the 3rd quarter of the second year.
    params:
      labels: [Q1, Q2, Q3, Q4, Q1, Q2, Q3]
      values: [20, 60, 90, 30, 22, 62, 0]
      editable: [6]
      min: 0
      max: 100
      step: 4
    answer: { values: [20, 60, 90, 30, 22, 62, 92] }
    feedback:
      - when: "values[6] == 64"
        misconception: ignore-season
        text: That is just the trend from the last quarter. In summer, the pattern sits much higher.
    hints:
      - Last year's Q3 plus growth.
    explanation: 90 + 2 = 92 – season plus trend.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: A shop reports 30% lower sales in January than in December. Is that alarming?
    params:
      options:
        - { label: Not necessarily – compare with January of the previous year., correct: true }
        - { label: Yes – the shop is in crisis., feedback: "After Christmas, sales drop almost everywhere – that is the season." }
    hints:
      - What happens in December?
    explanation: With seasonal patterns, you compare with the same time of the previous year.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Trend or seasonal pattern?
    params:
      buckets:
        - id: b1
          label: Trend
        - id: b2
          label: Season
      items:
        - label: More online shopping every year
          bucket: b1
        - label: More gifts every December
          bucket: b2
        - label: The population grows steadily
          bucket: b1
        - label: More ice cream in summer
          bucket: b2
    hints:
      - Does it repeat every year – or does it move one way for good?
    explanation: The season returns. The trend stays.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An ice cream shop makes €40,000 in July. July is always 60% above the mean. What is the revenue with the season taken out?
    params:
      unit: €
    answer:
      value: 25000
    hints:
      - Divide by the seasonal factor 1.6.
    explanation: 40,000 ÷ 1.6 = €25,000. That makes months comparable – as with unemployment figures.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: In July a shop sells {{v}} €. July is seasonally {{k}} % above average. What are the seasonally adjusted sales?
    params:
      unit: €
    answer:
      value: "{{base}}"
    feedback:
      - when: numval(state.input) == v - v * k / 100
        misconception: wrong-base
        text: The {{k}} % refer to the average, not to July. Divide instead of subtracting.
    hints:
      - July = average · {{(100 + k) / 100}}.
      - Divide {{v}} by {{(100 + k) / 100}}.
    explanation: "{{v}} ÷ {{(100 + k) / 100}} = {{base}} €. That is how months compare fairly despite the season."
    difficulty: 2
    variants:
      params:
        base: choice[20000,30000,40000]
        k: choice[20,25,50,60]
      derive:
        v: base * (100 + k) / 100
      defaults:
        base: 25000
        k: 60

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A parcel service reports 40 % more parcels in December than in November. What is the best question to ask?
    params:
      options:
        - label: How big was the jump the year before?
          correct: true
        - label: Maybe it is like that every year – Christmas.
          feedback: Vielleicht ist es jedes Jahr so – Weihnachten.
        - label: That is a different question.
          feedback: Das ist eine andere Frage.
    hints:
      - What happens every December?
      - Only the comparison with last year shows whether it is more than season.
    explanation: If last year's jump was 35 %, the signal is only +5 points. The year-over-year comparison separates season from real growth.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How do you compare monthly figures most fairly when there is a strong season?
    params:
      options:
        - label: With the same month of the previous year
          correct: true
        - label: With the previous month
          feedback: December against January mainly compares the season.
        - label: With the best month ever
          feedback: Then almost everything looks bad.
    hints:
      - Which comparison switches off the season?
    explanation: The **year-on-year comparison** holds the season constant and shows the trend.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: One hotel has 200 more guests in summer than in winter – however big it is. Another has 50 % more in summer. What are the two seasonal models called?
    params:
      options:
        - label: Additive and multiplicative
          correct: true
        - label: That describes trends, not seasonal patterns.
          feedback: Das beschreibt Trends, nicht Saisonmuster.
        - label: Both are signal here.
          feedback: Beides ist hier Signal.
    hints:
      - Does the swing stay the same size or grow with the level?
      - Plus 200 versus times 1.5.
    explanation: "Additive: trend + season. Multiplicative: trend · season – the spikes grow along. Taking logs turns multiplicative into additive."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: In February (28 days) a shop sells 2800 €, in March (31 days) 3100 €. By what percent is March better per day?
    params:
      unit: "%"
    answer:
      value: 0
    feedback:
      - when: abs(numval(state.input) - 10.7) < 0.2
        misconception: calendar-effect
        text: That is the difference in monthly totals. But March has 3 more days.
    hints:
      - Divide each total by its number of days.
      - "February: 100 € per day. March?"
    explanation: Both months make 100 € per day – March is no better. Calendar effects such as month length or holidays easily fake growth.
    difficulty: 3

srs:
  cards_from: [eis, vergleich]
