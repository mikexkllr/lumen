id: stats.timeseries.season
type: concept
title: Seasonal Patterns
summary: What comes back every year.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: An ice cream shop sells four times as much in July as in January. Is business bad in January?
    params:
      options:
        - label: Not necessarily – it is like that every year
          correct: true
        - label: Yes, it is going downhill
          feedback: Next July it rises again.
        - label: The shop will close soon
          feedback: The pattern is quite normal.
    hints:
      - Compare with January of the previous year.
    explanation: Such patterns repeat every year. You have to factor them out.

  - kind: explain
    id: s1
    body: |
      Many time series have a **seasonal pattern**: ice cream sells in summer, heating oil in winter. For a forecast, you combine the pattern with the trend.

  - kind: problem
    id: eis
    widget: chart
    body: Ice cream sales per quarter. Each quarter is 2 above the same quarter of the previous year.
    prompt: Set the 3rd quarter of the second year.
    params:
      labels: [Q1, Q2, Q3, Q4, Q1, Q2, Q3]
      values: [20, 60, 90, 30, 22, 62, 0]
      editable: [6]
      min: 0
      max: 100
      step: 4
    answer: { values: [20, 60, 90, 30, 22, 62, 92] }
    feedback:
      - when: "values[6] == 64"
        misconception: ignore-season
        text: That is just the trend from the last quarter. In summer, the pattern sits much higher.
    hints:
      - Last year's Q3 plus growth.
    explanation: 90 + 2 = 92 – season plus trend.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: A shop reports 30% lower sales in January than in December. Is that alarming?
    params:
      options:
        - { label: Not necessarily – compare with January of the previous year., correct: true }
        - { label: Yes – the shop is in crisis., feedback: "After Christmas, sales drop almost everywhere – that is the season." }
    hints:
      - What happens in December?
    explanation: With seasonal patterns, you compare with the same time of the previous year.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Trend or seasonal pattern?
    params:
      buckets:
        - id: b1
          label: Trend
        - id: b2
          label: Season
      items:
        - label: More online shopping every year
          bucket: b1
        - label: More gifts every December
          bucket: b2
        - label: The population grows steadily
          bucket: b1
        - label: More ice cream in summer
          bucket: b2
    hints:
      - Does it repeat every year – or does it move one way for good?
    explanation: The season returns. The trend stays.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An ice cream shop makes €40,000 in July. July is always 60% above the mean. What is the revenue with the season taken out?
    params:
      unit: €
    answer:
      value: 25000
    hints:
      - Divide by the seasonal factor 1.6.
    explanation: 40,000 ÷ 1.6 = €25,000. That makes months comparable – as with unemployment figures.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How do you compare monthly figures most fairly when there is a strong season?
    params:
      options:
        - label: With the same month of the previous year
          correct: true
        - label: With the previous month
          feedback: December against January mainly compares the season.
        - label: With the best month ever
          feedback: Then almost everything looks bad.
    hints:
      - Which comparison switches off the season?
    explanation: The **year-on-year comparison** holds the season constant and shows the trend.
    difficulty: 3

srs:
  cards_from: [eis, vergleich]
