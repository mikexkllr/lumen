id: stats.timeseries.forecast
type: concept
title: Forecasting with Care
summary: What forecasts can and cannot do.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: schritte
    widget: order
    prompt: Put the steps of a good forecast in the right order.
    params:
      items:
        - { label: Look at and check the data }
        - { label: Identify trend and season }
        - { label: Test the model on old data }
        - { label: State the forecast with a range of uncertainty }
    hints:
      - First understand, then test, then predict.
    explanation: An honest forecast always says how uncertain it is.

  - kind: problem
    id: unsicher
    widget: choice
    prompt: Why are forecasts for the distant future less certain?
    params:
      options:
        - { label: Small errors grow with every step., correct: true }
        - { label: Computers calculate more slowly then., feedback: "It is about uncertainty, not computing time." }
    hints:
      - Think of the weather forecast for tomorrow and for three weeks from now.
    explanation: That is why weather reports are reliable for only a few days.

  - kind: problem
    id: bruch
    widget: choice
    prompt: What can any forecast based on past data miss?
    params:
      options:
        - { label: Completely new events such as a pandemic, correct: true }
        - { label: Seasonal patterns, feedback: "Seasonal patterns are exactly what past data reveals well." }
    hints:
      - What is not in the old data?
    explanation: Structural breaks do not announce themselves in the data.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The further a forecast reaches into the [[future]], the more [[uncertain]] it gets.
      distractors:
        - depth
        - exact

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A weather forecast says “70% rain”. When was it **good**?
    params:
      options:
        - label: When it really rains on about 70% of all days with this forecast
          correct: true
        - label: Only if it rained on that day
          feedback: A single day cannot test a probability.
        - label: If it never rains
          feedback: Then 70% would be far too high.
    hints:
      - A probability is tested over many cases.
    explanation: This is called **calibration**. Good forecasters are right in 70% of their 70% statements.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why should a good forecast always state an uncertainty?"
    params:
      keywords:
        - - unsicher
          - spanne
          - bereich
          - uncertain
          - range
          - interval
          - margin
        - - zukunft
          - future
          - vorhersag
          - predict
          - forecast
        - - entscheid
          - planen
          - risiko
          - decide
          - decision
          - plan
          - risk
      sample: Nobody can predict the future exactly. A range shows honestly how uncertain the forecast is – and only with it can you decide sensibly and plan for risks.
    difficulty: 3

srs:
  cards_from: [schritte, unsicher]
