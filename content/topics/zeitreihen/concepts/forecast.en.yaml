id: stats.timeseries.forecast
type: concept
title: Forecasting with Care
summary: What forecasts can and cannot do.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Small errors, big effects
    body: How many electric cars will there be in 30 years? Forecasts often assume steady growth. Change the growth rate by just 2 % and then push the years far ahead. How fast do the **forecasts** drift apart?
    visual:
      widget: sim
      interactive: true
      params:
        scene: growth

  - kind: problem
    id: schritte
    widget: order
    prompt: Put the steps of a good forecast in the right order.
    params:
      items:
        - { label: Look at and check the data }
        - { label: Identify trend and season }
        - { label: Test the model on old data }
        - { label: State the forecast with a range of uncertainty }
    hints:
      - First understand, then test, then predict.
    explanation: An honest forecast always says how uncertain it is.

  - kind: problem
    id: unsicher
    widget: choice
    prompt: Why are forecasts for the distant future less certain?
    params:
      options:
        - { label: Small errors grow with every step., correct: true }
        - { label: Computers calculate more slowly then., feedback: "It is about uncertainty, not computing time." }
    hints:
      - Think of the weather forecast for tomorrow and for three weeks from now.
    explanation: That is why weather reports are reliable for only a few days.

  - kind: problem
    id: bruch
    widget: choice
    prompt: What can any forecast based on past data miss?
    params:
      options:
        - { label: Completely new events such as a pandemic, correct: true }
        - { label: Seasonal patterns, feedback: "Seasonal patterns are exactly what past data reveals well." }
    hints:
      - What is not in the old data?
    explanation: Structural breaks do not announce themselves in the data.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The further a forecast reaches into the [[future]], the more [[uncertain]] it gets.
      distractors:
        - depth
        - exact

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: Sales grow by 10 % every year. Set that and move the years until they have only just doubled.
    params:
      scene: growth
    answer:
      rate: 10
      factor:
        - 2
        - 2.2
    hints:
      - First set the growth to 10 %.
      - Move the years until the factor just passes 2.
    explanation: "After 7 years the factor is 1.95, after 8 years 2.14. A rule of thumb: 72 ÷ 10 ≈ 7 years to double."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A weather forecast says “70% rain”. When was it **good**?
    params:
      options:
        - label: When it really rains on about 70% of all days with this forecast
          correct: true
        - label: Only if it rained on that day
          feedback: A single day cannot test a probability.
        - label: If it never rains
          feedback: Then 70% would be far too high.
    hints:
      - A probability is tested over many cases.
    explanation: This is called **calibration**. Good forecasters are right in 70% of their 70% statements.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "A forecast missed four times: +2, −1, +3 and −2. What is the mean absolute error?"
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0.5
        misconception: signed-error
        text: You kept the signs. The absolute error counts only the size.
    hints:
      - "Drop the signs: 2, 1, 3, 2."
      - Compute 8 ÷ 4.
    explanation: (2 + 1 + 3 + 2) ÷ 4 = 2. Without absolute values the errors would net out to 0.5 and flatter the forecast.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: An expensive forecasting model predicts tomorrow's sales. What should you compare it with first?
    params:
      options:
        - label: With »tomorrow like today« – the simplest forecast
          correct: true
        - label: First it must beat the simplest thing.
          feedback: Erst muss es das Einfachste schlagen.
        - label: Without a comparison you do not know if it is any good.
          feedback: Ohne Vergleich weiß man nicht, ob es etwas taugt.
    hints:
      - How good would a forecast be that needs no computing at all?
      - This simple forecast is called the naive forecast.
    explanation: The naive forecast is hard to beat. Many elaborate models barely do better – forecasting competitions show this again and again.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why should a good forecast always state an uncertainty?"
    params:
      keywords:
        - - unsicher
          - spanne
          - bereich
          - uncertain
          - range
          - interval
          - margin
        - - zukunft
          - future
          - vorhersag
          - predict
          - forecast
        - - entscheid
          - planen
          - risiko
          - decide
          - decision
          - plan
          - risk
      sample: Nobody can predict the future exactly. A range shows honestly how uncertain the forecast is – and only with it can you decide sensibly and plan for risks.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "A price behaves like a random walk: for one day the uncertainty is σ = 1. How big is it {{h}} days ahead?"
    answer:
      value: "{{sqrt(h)}}"
    feedback:
      - when: numval(state.input) == h
        misconception: linear-uncertainty
        text: Uncertainty does not grow linearly, but with √h.
    hints:
      - "Variances add up: after {{h}} days it is {{h}}."
      - σ is its square root.
    explanation: √{{h}} = {{sqrt(h)}}. The forecast funnel opens like a square-root curve – wide, but slower than linear.
    difficulty: 3
    variants:
      params:
        h: choice[4,9,16,25,100]
      defaults:
        h: 16

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "The Brier score measures probability forecasts: (forecast − outcome)². The app said 70 % rain, and it rained (outcome 1). What is the score?"
    answer:
      value: 0.09
      tolerance: 0.001
    hints:
      - Forecast 0.7, outcome 1.
      - (0.7 − 1)² = (−0.3)².
    explanation: "0.09. Smaller is better: 0 means perfect, and always saying 50 % scores 0.25. That is how forecasts are judged fairly over many days."
    difficulty: 3

srs:
  cards_from: [schritte, unsicher]
