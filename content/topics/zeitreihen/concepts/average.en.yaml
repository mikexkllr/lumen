id: stats.timeseries.average
type: concept
title: Moving Averages
summary: Smoothing out the spikes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Calm in the zigzag
    body: If you look at new numbers every day, you mostly see spikes. Uncover the cards in any order. Each shows a **moving average** you meet in everyday life.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦠
            front: The 7-day incidence
            back: Offices reported fewer cases at weekends. Looking at 7 days at once smoothed those dips away.
          - icon: 📈
            front: The 200-day line
            back: Investors watch the average of the last 200 days. It shows the trend behind the daily jitter.
          - icon: 🌡️
            front: The climate normal
            back: Climate is the average weather over 30 years. A single cold winter changes it very little.

  - kind: problem
    id: hook
    widget: numeric
    prompt: You run 4, 6 and 8 km on three days. How many kilometres is that on average per day?
    params:
      unit: km
    answer:
      value: 6
    hints:
      - Add everything and divide by 3.
    explanation: The average smooths out single days. That is used for long time series too.

  - kind: explain
    id: s1
    body: |
      A **moving average** always averages the last few values. It smooths random spikes and makes the course visible – this is how infection numbers are averaged over 7 days, for example.

  - kind: problem
    id: drei
    widget: numeric
    prompt: The last three days had {{a}}, {{b}}, and {{c}} visitors. What is the 3-day average?
    params: { unit: visitors }
    answer: { value: "{{(a + b + c) / 3}}" }
    hints:
      - Add all three, then divide by 3.
    explanation: "({{a}} + {{b}} + {{c}}) ÷ 3 = {{(a + b + c) / 3}}."
    variants:
      params: { a: "int[10,40]", b: "int[10,40]", m: "int[0,2]" }
      derive: { c: "30 + m - ((a + b + 30 + m) % 3)" }
      constraints: ["(a + b + c) % 3 == 0"]
      defaults: { a: 20, b: 25, m: 0 }

  - kind: problem
    id: geglaettet
    widget: chart
    body: "Daily values: 4, 8, 6, 10, 8. The 3-day average from day 3 is 6, 8, 8."
    prompt: Set the smoothed values for days 3 to 5.
    params:
      labels: [Day 3, Day 4, Day 5]
      values: [0, 0, 0]
      editable: [0, 1, 2]
      min: 0
      max: 12
    answer: { values: [6, 8, 8] }
    hints:
      - It is already in the text – copy the values.
    explanation: The smoothed series fluctuates far less than the raw values.

  - kind: problem
    id: verzoegerung
    widget: choice
    prompt: What is a drawback of moving averages?
    params:
      options:
        - { label: They react late to real changes., correct: true }
        - { label: They distort all values at random., feedback: "They only smooth – but they lag behind." }
    hints:
      - What happens when everything suddenly shoots up?
    explanation: Because old values count too, a turning point shows up only after a few days.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Values: 4, 10, 4, 10, 4, 10. What is every moving average over **two** values?"
    answer:
      value: 7
    hints:
      - (4 + 10) ÷ 2.
    explanation: Always 7 – the zigzags vanish completely. The window width should match the period of the pattern.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "In exponential smoothing: new = {{a}} · measurement + {{1 - a}} · old. The old smoothed value is {{s}}, the measurement is {{x}}. What is the new smoothed value?"
    answer:
      value: "{{a * x + (1 - a) * s}}"
    hints:
      - Compute {{a}} · {{x}} and {{1 - a}} · {{s}}.
      - Add both.
    explanation: "{{a * x}} + {{(1 - a) * s}} = {{a * x + (1 - a) * s}}. The new value moves part of the way towards the measurement."
    difficulty: 2
    variants:
      params:
        a: choice[0.2,0.5]
        s: step[10,50,10]
        x: step[20,80,10]
      constraints:
        - x != s
      defaults:
        a: 0.5
        s: 10
        x: 20

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A curve shows the average of the last 7 days. From today a number suddenly rises sharply. When does the curve show the full jump?
    params:
      options:
        - label: Only after 7 days – on average it lags 3 days behind
          correct: true
        - label: Today makes up only 1/7 of the average.
          feedback: Heute macht nur 1/7 des Schnitts aus.
        - label: After a week only new values are in the window.
          feedback: Nach einer Woche sind nur noch neue Werte im Fenster.
    hints:
      - How many new values are in the window after one day?
      - The window is fully »new« only after 7 days.
    explanation: A trailing average smooths and delays at the same time. A centred average (3 days before, 3 after) has no delay – but needs future data.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In **exponential smoothing** the newest value counts most, older ones less and less. What is the advantage over the simple moving average?
    params:
      options:
        - label: It reacts faster to real changes and needs only the last smoothed value
          correct: true
        - label: It does not smooth at all
          feedback: It smooths – just with decreasing weights.
        - label: It predicts the future exactly
          feedback: No method can do that.
    hints:
      - Should a value from 30 days ago count as much as yesterday’s?
    explanation: New value = α · measurement + (1 − α) · old value. The same formula is found in many sensors and learning methods.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "In exponential smoothing with α = 0.5 the newest value gets weight 0.5, the one before 0.25, and so on: α · (1 − α)^k. What weight does the value from 3 steps ago (k = 3) get?"
    answer:
      value: 0.0625
      tolerance: 0.0001
    hints:
      - Compute 0.5 · 0.5³.
      - 0.5 · 0.125.
    explanation: 0.5 · 0.125 = 0.0625. The weights fall off geometrically and add up to 1. Old values fade but never vanish completely.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Monthly data with a strong seasonal pattern. Over how many months must a moving average run so that the season disappears completely?
    params:
      options:
        - label: 12 – then each month is in it exactly once
          correct: true
        - label: Three months only smooth short spikes.
          feedback: Drei Monate glätten nur kurze Zacken.
        - label: Seven fits weekdays, not months.
          feedback: Sieben passt zu Wochentagen, nicht zu Monaten.
    hints:
      - How long is one season cycle in monthly data?
      - Every window should contain each month equally often.
    explanation: A 12-month average always holds one summer and one winter. For daily data with a weekly rhythm you take 7 days for the same reason.
    difficulty: 3

srs:
  cards_from: [drei, verzoegerung]
