id: stats.timeseries.season
type: concept
title: Saisonmuster
summary: Was jedes Jahr wiederkommt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Eisladen verkauft im Juli viermal so viel wie im Januar. Läuft das Geschäft im Januar schlecht?
    params:
      options:
        - label: Nicht unbedingt – das ist jedes Jahr so
          correct: true
        - label: Ja, es geht bergab
          feedback: Im nächsten Juli steigt es wieder.
        - label: Der Laden schließt bald
          feedback: Das Muster ist ganz normal.
    hints:
      - Vergleich mit dem Januar des Vorjahres.
    explanation: Solche Muster wiederholen sich jedes Jahr. Man muss sie herausrechnen.

  - kind: explain
    id: s1
    body: |
      Viele Zeitreihen haben ein **Saisonmuster**: Eis verkauft sich im Sommer, Heizöl im Winter. Für eine Prognose kombiniert man das Muster mit dem Trend.

  - kind: problem
    id: eis
    widget: chart
    body: Eisverkäufe pro Quartal. Jedes Quartal liegt 2 über dem gleichen Quartal im Vorjahr.
    prompt: Stell das 3. Quartal des zweiten Jahres ein.
    params:
      labels: [Q1, Q2, Q3, Q4, Q1, Q2, Q3]
      values: [20, 60, 90, 30, 22, 62, 0]
      editable: [6]
      min: 0
      max: 100
      step: 4
    answer: { values: [20, 60, 90, 30, 22, 62, 92] }
    feedback:
      - when: "values[6] == 64"
        misconception: ignore-season
        text: Das ist nur der Trend vom letzten Quartal. Im Sommer liegt das Muster viel höher.
    hints:
      - Vorjahres-Q3 plus Wachstum.
    explanation: 90 + 2 = 92 – Saison plus Trend.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Ein Laden meldet im Januar 30 % weniger Umsatz als im Dezember. Ist das alarmierend?
    params:
      options:
        - { label: Nicht unbedingt – man sollte mit dem Januar des Vorjahres vergleichen., correct: true }
        - { label: Ja – der Laden steckt in der Krise., feedback: "Nach Weihnachten fällt der Umsatz fast überall – das ist Saison." }
    hints:
      - Was passiert im Dezember?
    explanation: Bei Saisonmustern vergleicht man mit derselben Zeit im Vorjahr.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Trend oder Saisonmuster?
    params:
      buckets:
        - id: b1
          label: Trend
        - id: b2
          label: Saison
      items:
        - label: Jedes Jahr mehr Online-Käufe
          bucket: b1
        - label: Jeden Dezember mehr Geschenke
          bucket: b2
        - label: Die Bevölkerung wächst stetig
          bucket: b1
        - label: Im Sommer mehr Eis
          bucket: b2
    hints:
      - Wiederholt es sich jedes Jahr – oder geht es dauerhaft in eine Richtung?
    explanation: Die Saison kommt wieder. Der Trend bleibt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Eisladen macht im Juli 40 000 € Umsatz. Der Juli liegt saisonal 60 % über dem Durchschnitt. Wie hoch ist der **saisonbereinigte** Umsatz?
    params:
      unit: €
    answer:
      value: 25000
    hints:
      - Teile durch den Saisonfaktor 1,6.
    explanation: "40 000 : 1,6 = 25 000 €. So werden Monate vergleichbar – etwa bei Arbeitslosenzahlen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie vergleicht man Monatszahlen am fairsten, wenn es eine starke Saison gibt?
    params:
      options:
        - label: Mit dem gleichen Monat des Vorjahres
          correct: true
        - label: Mit dem Vormonat
          feedback: Dezember gegen Januar vergleicht vor allem die Saison.
        - label: Mit dem besten Monat aller Zeiten
          feedback: Dann wirkt fast alles schlecht.
    hints:
      - Welcher Vergleich schaltet die Saison aus?
    explanation: Der **Vorjahresvergleich** hält die Saison konstant und zeigt den Trend.
    difficulty: 3

srs:
  cards_from: [eis, vergleich]
