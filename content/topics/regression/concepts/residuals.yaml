id: stats.regression.residuals
type: concept
title: Abweichungen lesen
summary: Was die Reste verraten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Drüber oder drunter?
    body: Jedes Modell liegt mal drüber, mal drunter. Die Linie ist das Modell, die Punkte sind echte Messungen. Zieh Punkt P über und unter die Linie. Der senkrechte Abstand heißt **Residuum**.
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 8
        y:
          - 0
          - 6
        showCoordinates: false
        functions:
          - expr: 0.5x + 1
        points:
          - id: a
            x: 1
            y: 2
            draggable: false
            label: ""
          - id: b
            x: 3
            y: 2
            draggable: false
            label: ""
          - id: c
            x: 5
            y: 4
            draggable: false
            label: ""
          - id: d
            x: 7
            y: 4
            draggable: false
            label: ""
          - id: P
            x: 4
            y: 5
            label: P

  - kind: problem
    id: hook
    widget: numeric
    prompt: Die Wetter-App sagt 20 °C voraus. Es werden 23 °C. Um wie viel Grad lag sie daneben?
    params:
      unit: °C
    answer:
      value: 3
    hints:
      - Gemessen minus vorhergesagt.
    explanation: Dieser Abstand zwischen Vorhersage und Wirklichkeit hat einen Namen.

  - kind: explain
    id: s1
    body: |
      Das **Residuum** ist der Abstand eines Punktes zur Geraden: gemessener Wert minus vorhergesagter Wert. Positiv heißt – der Punkt liegt über der Geraden.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Die Gerade sagt {{p}} voraus, gemessen wurde {{p + r}}. Wie groß ist das Residuum?
    params: { placeholder: "Residuum" }
    answer: { value: "{{r}}" }
    feedback:
      - when: "numval(state.input) == -r"
        misconception: sign
        text: Gemessen minus vorhergesagt – nicht andersherum.
    hints:
      - Gemessen minus vorhergesagt.
    explanation: "{{p + r}} − {{p}} = {{r}}."
    variants:
      params: { p: "int[10,40]", r: "int[-6,6]" }
      constraints: ["r != 0"]
      defaults: { p: 20, r: 3 }

  - kind: problem
    id: muster
    widget: choice
    prompt: Die Residuen sind erst positiv, dann negativ, dann wieder positiv – wie ein Bogen. Was heißt das?
    params:
      options:
        - { label: Eine Gerade passt nicht – die Daten sind gekrümmt., correct: true }
        - { label: Alles in Ordnung., feedback: "Zufällige Reste haben kein Muster. Ein Bogen zeigt eine Krümmung." }
    hints:
      - Gute Residuen sehen aus wie zufälliges Rauschen.
    explanation: Ein Muster in den Resten zeigt, dass das Modell etwas Wichtiges übersieht.

  - kind: problem
    id: summe
    widget: choice
    prompt: Was ergibt die Summe aller Residuen bei der besten Geraden?
    params:
      options:
        - { label: Genau null, correct: true }
        - { label: Immer etwas Positives, feedback: "Die Gerade liegt so, dass sich die Reste genau ausgleichen." }
    hints:
      - Die Gerade läuft durch die Mitte der Punktwolke.
    explanation: Abweichungen nach oben und unten gleichen sich exakt aus.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Das [[Residuum]] ist gemessener Wert minus vorhergesagter Wert. Liegt der Punkt über der Geraden, ist es [[positiv]].
      distractors:
        - Mittel
        - negativ

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: Die Gerade sagt y = x + 1 voraus. Zieh den Punkt P an die Stelle x = 3, sodass sein Residuum +2 ist.
    params:
      x:
        - 0
        - 8
      y:
        - 0
        - 8
      showCoordinates: true
      functions:
        - expr: x + 1
      points:
        - id: P
          x: 6
          y: 2
          label: P
    answer:
      points:
        P:
          x: 3
          y: 6
    hints:
      - Bei x = 3 sagt die Gerade y = 4 voraus.
      - "Residuum +2 heißt: 2 über der Geraden – also y = 6."
    explanation: "Gemessen 6, vorhergesagt 4: Das **Residuum** ist 6 − 4 = +2. Der Punkt liegt über der Geraden."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Die Residuen werden mit wachsendem x immer größer – die Punkte fächern sich auf wie ein Trichter. Was bedeutet das?
    params:
      options:
        - label: Die Vorhersage wird für große x immer unsicherer
          correct: true
        - label: Die Gerade ist perfekt
          feedback: Dann wären alle Residuen null.
        - label: Die Steigung ist falsch berechnet
          feedback: Die Steigung kann stimmen – die Streuung ist ungleich.
    hints:
      - Bei kleinen x liegen die Punkte eng, bei großen weit.
    explanation: "Das heißt **Heteroskedastizität**. Bei Einkommen ist es typisch: Hohe Werte schwanken stärker."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Die Residuen dreier Punkte sind {{a}}, −{{b}} und {{b - a}}. Wie groß ist die Summe ihrer Quadrate?
    answer:
      value: "{{a * a + b * b + (b - a) * (b - a)}}"
    feedback:
      - when: numval(state.input) == 0
        misconception: no-square
        text: Die Residuen selbst summieren sich zu null – deshalb quadriert man sie.
    hints:
      - Quadriere jedes Residuum einzeln.
      - "{{a * a}} + {{b * b}} + {{(b - a) * (b - a)}}."
    explanation: Die Summe ist {{a * a + b * b + (b - a) * (b - a)}}. Genau diese Zahl macht die beste Gerade so klein wie möglich.
    difficulty: 2
    variants:
      params:
        a: int[1,4]
        b: int[1,5]
      constraints:
        - a != b
      defaults:
        a: 1
        b: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Bei Monatsdaten sind die Residuen erst monatelang positiv, dann monatelang negativ. Was verrät das?
    params:
      options:
        - label: Das Modell übersieht ein zeitliches Muster – die Fehler hängen zusammen
          correct: true
        - label: Alles in Ordnung, Fehler sind eben da
          feedback: Gute Residuen springen zufällig hin und her.
        - label: Die Gerade ist zu steil
          feedback: Eine falsche Steigung erzeugt einen Trend in den Residuen, keine Wellen.
    hints:
      - Wie sähen rein zufällige Fehler aus?
      - Lange Serien gleicher Vorzeichen sind kein Zufall.
    explanation: Zusammenhängende Fehler heißen **Autokorrelation**. Dann sind auch die Fehlerspannen des Modells zu optimistisch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Anscombes Quartett: vier Datensätze mit exakt gleicher Regressionsgerade, gleichem Mittelwert und gleichem R². Was zeigt es?"
    params:
      options:
        - label: Gezeichnet sehen sie völlig verschieden aus – Kennzahlen ersetzen den Blick auf die Daten nicht
          correct: true
        - label: Dass alle vier Datensätze gleich sind
          feedback: Einer ist eine Kurve, einer hat einen Ausreißer.
        - label: Dass Regression nutzlos ist
          feedback: Sie ist nützlich – aber nur zusammen mit einem Diagramm.
    hints:
      - Gleiche Zahlen, andere Bilder.
    explanation: Erst zeichnen, dann rechnen. Die Residuen zeigen, was die Gerade verschweigt.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Die Residuen sind 3, −1, −3 und 1. Der **RMSE** ist die Wurzel aus dem mittleren quadrierten Residuum. Wie groß ist er? Auf zwei Stellen.
    answer:
      value: 2.24
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 5
        misconception: mse-not-rmse
        text: Das ist der mittlere quadrierte Fehler. Zieh noch die Wurzel.
      - when: numval(state.input) == 2
        misconception: mae-not-rmse
        text: Das ist der mittlere absolute Fehler. Der RMSE gewichtet große Fehler stärker.
    hints:
      - "Quadrate: 9 + 1 + 9 + 1 = 20. Mittel: 5."
      - Zieh die Wurzel aus 5.
    explanation: √5 ≈ 2,24. Der RMSE ist die typische Größe eines Vorhersagefehlers – in der Einheit von y.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Ein Punkt liegt bei x weit außerhalb aller anderen – genau auf der Geraden der übrigen. Ein zweiter liegt mittendrin, aber weit über der Geraden. Welcher hat mehr **Hebelwirkung**?
    params:
      options:
        - label: Der weit außen in x – er kann die Gerade kippen
          correct: true
        - label: Der über der Geraden
          feedback: Er hat ein großes Residuum, aber in der Mitte wenig Hebel.
        - label: Beide gleich
          feedback: Hebel hängt nur vom Abstand in x ab.
    hints:
      - "Denk an eine Wippe: Wo wirkt ein Gewicht am stärksten?"
      - Großes Δx bedeutet großes Gewicht in der Steigungsformel.
    explanation: Hebel hängt vom Abstand in x ab. Ein Punkt mit großem Hebel **und** großem Residuum ist einflussreich – man prüft ihn mit Maßen wie der Cook-Distanz.
    difficulty: 3

srs:
  cards_from: [rechnen, muster]
