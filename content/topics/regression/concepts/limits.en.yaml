id: stats.regression.limits
type: concept
title: Limits of the line
summary: Outliers and extrapolation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The troublemaker
    body: A single measurement error can tip a whole line. First lay the line through all the blue dots. Then tilt it so it also takes in the orange **outlier**. How much does the line change?
    visual:
      widget: slider
      interactive: true
      params:
        expr: m*x + b
        x:
          - 0
          - 8
        y:
          - 0
          - 8
        showCoordinates: false
        sliders:
          - id: m
            label: Slope
            min: 0
            max: 2
            step: 0.25
            initial: 0.25
          - id: b
            label: Intercept
            min: -2
            max: 4
            step: 0.5
            initial: 3
        markers:
          - x: 1
            y: 1.5
            group: a
          - x: 2
            y: 2
            group: a
          - x: 3
            y: 2.5
            group: a
          - x: 4
            y: 3
            group: a
          - x: 5
            y: 3.5
            group: a
          - x: 6
            y: 4
            group: a
          - x: 7
            y: 8
            group: b

  - kind: problem
    id: kind
    widget: choice
    prompt: A child grows about 6 cm per year from age 2 to 10. By this line, how tall is the person at age 40?
    params:
      options:
        - { label: The line no longer applies there., correct: true }
        - { label: "About 2.7 meters", feedback: "Mathematically yes – but people stop growing." }
    hints:
      - Does the trend hold forever?
    explanation: Predicting outside the measured data is called **extrapolation** – often a mistake.

  - kind: explain
    id: s2
    body: |
      A single **outlier** can tilt the line sharply, because squared distances weight it heavily. So always look at the data first.

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: A salary table has a typo – 1,000,000 € instead of 100,000 €. What happens to the line?
    params:
      options:
        - { label: It gets badly distorted., correct: true }
        - { label: Hardly anything – it is just one point., feedback: "Because distances are squared, one giant pulls the line hard." }
    hints:
      - How big is the square of a huge distance?
    explanation: One point can shift everything – check the data before calculating.

  - kind: problem
    id: wann
    widget: buckets
    prompt: Is a line a good model here?
    params:
      buckets: [{ label: fits }, { label: does not fit }]
      items:
        - { label: Taxi fare and distance, bucket: fits }
        - { label: Electricity cost and usage, bucket: fits }
        - { label: Bacteria over time, bucket: does not fit }
        - { label: Braking distance and speed, bucket: does not fit }
    hints:
      - Does it grow steadily or ever faster?
    explanation: Exponential growth and squares curve – they need other models.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A single [[outlier]] can tilt the line a lot. That is why you first look at the data as a [[scatter plot]].
      distractors:
        - mean
        - table

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Do not let the orange outlier fool you. Lay the line exactly through the four blue dots.
    params:
      expr: m*x + b
      x:
        - 0
        - 8
      y:
        - 0
        - 8
      showCoordinates: false
      sliders:
        - id: m
          label: Slope
          min: -1
          max: 2
          step: 0.25
          initial: 0
        - id: b
          label: Intercept
          min: 0
          max: 4
          step: 0.5
          initial: 1
      markers:
        - x: 0
          y: 2
          group: a
        - x: 2
          y: 3
          group: a
        - x: 4
          y: 4
          group: a
        - x: 6
          y: 5
          group: a
        - x: 7
          y: 1
          group: b
    answer:
      values:
        m: 0.5
        b: 2
    hints:
      - At x = 0 the first blue dot sits at 2 – that is the intercept.
      - "For every 2 steps to the right the dots rise by 1: slope 0.5."
    explanation: y = 0.5x + 2 hits all the blue dots. Taking in the **outlier** would tip the line – check first, then calculate.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Francis Galton found in 1886: very tall fathers have sons who are on average shorter than themselves – but still above average. What did he call it?"
    params:
      options:
        - label: Regression to the mean – that is where the whole method gets its name
          correct: true
        - label: Inheritance error
          feedback: It is pure statistics, not an error.
        - label: Degeneration
          feedback: Very short fathers also have taller sons on average.
    hints:
      - Extreme values often contain luck too.
    explanation: Where the relationship is not perfect, predictions always lie closer to the mean than the starting values.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Three points lie perfectly on y = x: (1, 1), (2, 2), (3, 3). An outlier (4, 0) joins them. What slope does the best line through all four have?"
    answer:
      value: -0.2
    hints:
      - "Means: x = 2.5 and y = 1.5. Δx: −1.5, −0.5, 0.5, 1.5."
      - "Δy: −0.5, 0.5, 1.5, −1.5. Σ(Δx · Δy) = −1 and Σ(Δx²) = 5."
    explanation: −1 ÷ 5 = −0.2. A single point flips the slope from +1 to −0.2! It sits at the edge, so it has a lot of leverage.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Instead of squared distances you can also minimise the plain distances. What is the advantage?
    params:
      options:
        - label: Outliers pull the line less – the method is more robust
          correct: true
        - label: Without outliers least squares is usually better.
          feedback: Ohne Ausreißer sind kleinste Quadrate meist besser.
        - label: "On the contrary: there is no simple formula."
          feedback: "Im Gegenteil: Es gibt keine einfache Formel."
    hints:
      - A distance of 10 counts as 10 – or squared as 100.
      - What does that mean for an outlier?
    explanation: That is robust regression – the counterpart of the median. Squares make big deviations overpowering.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: what does a regression line do – and where are its limits?"
    params:
      keywords:
        - - gerade
          - linie
          - line
        - - punkte
          - daten
          - points
          - data
        - - vorhersag
          - schätz
          - predict
          - estimate
        - - grenze
          - außerhalb
          - ausreißer
          - ursache
          - limit
          - outside
          - outlier
          - cause
          - extrapol
      min: 3
      sample: It is the line that best fits a scatter of points and allows predictions from the data. But it only holds within the measured range, is sensitive to outliers and proves no cause.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: The predictor x is measured with a large error, e.g. calories from a questionnaire. What happens to the estimated slope?
    params:
      options:
        - label: It gets too flat – the effect is underestimated
          correct: true
        - label: That holds for errors in y, not in x.
          feedback: Das gilt für Messfehler in y, nicht in x.
        - label: Noise in x dilutes the relationship.
          feedback: Rauschen in x verdünnt den Zusammenhang.
    hints:
      - Errors in x spread the points horizontally.
      - The wider the cloud in x, the flatter the best line.
    explanation: The slope shrinks by the factor Var(x) ÷ (Var(x) + Var(error)). This attenuation makes real effects look smaller.
    difficulty: 3

srs:
  cards_from: [kind, wann]
