id: stats.regression.limits
type: concept
title: Limits of the line
summary: Outliers and extrapolation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: kind
    widget: choice
    prompt: A child grows about 6 cm per year from age 2 to 10. By this line, how tall is the person at age 40?
    params:
      options:
        - { label: The line no longer applies there., correct: true }
        - { label: "About 2.7 meters", feedback: "Mathematically yes – but people stop growing." }
    hints:
      - Does the trend hold forever?
    explanation: Predicting outside the measured data is called **extrapolation** – often a mistake.

  - kind: explain
    body: |
      A single **outlier** can tilt the line sharply, because squared distances weight it heavily. So always look at the data first.

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: A salary table has a typo – 1,000,000 € instead of 100,000 €. What happens to the line?
    params:
      options:
        - { label: It gets badly distorted., correct: true }
        - { label: Hardly anything – it is just one point., feedback: "Because distances are squared, one giant pulls the line hard." }
    hints:
      - How big is the square of a huge distance?
    explanation: One point can shift everything – check the data before calculating.

  - kind: problem
    id: wann
    widget: buckets
    prompt: Is a line a good model here?
    params:
      buckets: [{ label: fits }, { label: does not fit }]
      items:
        - { label: Taxi fare and distance, bucket: fits }
        - { label: Electricity cost and usage, bucket: fits }
        - { label: Bacteria over time, bucket: does not fit }
        - { label: Braking distance and speed, bucket: does not fit }
    hints:
      - Does it grow steadily or ever faster?
    explanation: Exponential growth and squares curve – they need other models.

srs:
  cards_from: [kind, wann]
