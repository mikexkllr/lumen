id: stats.regression.predict
type: concept
title: Vorhersagen machen
summary: Vom Modell zur Zahl.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: wohnung
    widget: numeric
    body: "Ein Modell sagt den Wohnungspreis voraus: Preis = 3000 € · Fläche + 50 000 €."
    prompt: Was sagt es für {{a}} m² voraus?
    params: { unit: "€" }
    answer: { value: "{{3000 * a + 50000}}" }
    hints:
      - "3000 · {{a}} + 50 000."
    explanation: "{{3000 * a}} + 50 000 = {{3000 * a + 50000}} €."
    variants:
      params: { a: "choice[40,60,80,100,120]" }
      defaults: { a: 80 }

  - kind: explain
    body: |
      Regressionen stecken in Preisschätzungen, Wettermodellen und Medizin. Sie sagen den **Durchschnitt** voraus – einzelne Fälle weichen davon ab.

  - kind: problem
    id: einzeln
    widget: choice
    prompt: Das Modell sagt für eine Wohnung 290 000 € voraus. Wie viel kostet sie tatsächlich?
    params:
      options:
        - { label: Man weiß es nicht genau – das Modell schätzt den Durchschnitt., correct: true }
        - { label: Genau 290 000 €, feedback: "Lage, Zustand und Zufall sorgen für Abweichungen." }
    hints:
      - Liegen alle Punkte genau auf der Geraden?
    explanation: Ein gutes Modell gibt auch an, wie stark einzelne Werte typischerweise streuen.

  - kind: problem
    id: mehrere
    widget: choice
    prompt: Wie kann man die Vorhersage verbessern?
    params:
      options:
        - { label: Weitere Einflüsse wie Lage und Baujahr einbeziehen, correct: true }
        - { label: Die Gerade steiler machen, feedback: "Die beste Steigung steht schon fest – es fehlen Informationen." }
    hints:
      - Hängt der Preis nur von der Fläche ab?
    explanation: Mit mehreren Einflüssen heißt das **multiple Regression** – der Anfang vieler KI-Modelle.

srs:
  cards_from: [wohnung, einzeln]
