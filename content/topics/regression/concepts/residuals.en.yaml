id: stats.regression.residuals
type: concept
title: Reading deviations
summary: What the leftovers reveal.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: The weather app predicts 20 °C. It turns out 23 °C. By how many degrees was it off?
    params:
      unit: °C
    answer:
      value: 3
    hints:
      - Measured minus predicted.
    explanation: This gap between forecast and reality has a name.

  - kind: explain
    id: s1
    body: |
      The **residual** is a point's distance from the line: measured value minus predicted value. Positive means the point lies above the line.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: The line predicts {{p}}, and {{p + r}} was measured. What is the residual?
    params: { placeholder: "Residual" }
    answer: { value: "{{r}}" }
    feedback:
      - when: "numval(state.input) == -r"
        misconception: sign
        text: Measured minus predicted – not the other way around.
    hints:
      - Measured minus predicted.
    explanation: "{{p + r}} − {{p}} = {{r}}."
    variants:
      params: { p: "int[10,40]", r: "int[-6,6]" }
      constraints: ["r != 0"]
      defaults: { p: 20, r: 3 }

  - kind: problem
    id: muster
    widget: choice
    prompt: The residuals are first positive, then negative, then positive again – like an arc. What does that mean?
    params:
      options:
        - { label: A line does not fit – the data is curved., correct: true }
        - { label: Everything is fine., feedback: "Random residuals have no pattern. An arc shows curvature." }
    hints:
      - Good residuals look like random noise.
    explanation: A pattern in the residuals shows that the model misses something important.

  - kind: problem
    id: summe
    widget: choice
    prompt: What is the sum of all residuals for the best line?
    params:
      options:
        - { label: Exactly zero, correct: true }
        - { label: Always something positive, feedback: "The line sits so that the residuals cancel out exactly." }
    hints:
      - The line runs through the middle of the point cloud.
    explanation: Deviations upward and downward cancel out exactly.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[residual]] is the measured value minus the predicted value. If the point lies above the line, it is [[positive]].
      distractors:
        - mean
        - negative

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The residuals grow larger with increasing x – the points fan out like a funnel. What does that mean?
    params:
      options:
        - label: The prediction gets ever more uncertain for large x
          correct: true
        - label: The line is perfect
          feedback: Then all residuals would be zero.
        - label: The slope is calculated wrongly
          feedback: The slope can be right – the spread is unequal.
    hints:
      - At small x the points are close, at large x far apart.
    explanation: "This is called **heteroscedasticity**. It is typical for incomes: high values fluctuate more."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: The residuals of three points are {{a}}, −{{b}} and {{b - a}}. What is the sum of their squares?
    answer:
      value: "{{a * a + b * b + (b - a) * (b - a)}}"
    feedback:
      - when: numval(state.input) == 0
        misconception: no-square
        text: The residuals themselves add to zero – that is why we square them.
    hints:
      - Square each residual separately.
      - "{{a * a}} + {{b * b}} + {{(b - a) * (b - a)}}."
    explanation: The sum is {{a * a + b * b + (b - a) * (b - a)}}. The best line makes exactly this number as small as possible.
    difficulty: 2
    variants:
      params:
        a: int[1,4]
        b: int[1,5]
      constraints:
        - a != b
      defaults:
        a: 1
        b: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: In monthly data the residuals are positive for months, then negative for months. What does that reveal?
    params:
      options:
        - label: The model misses a pattern in time – the errors are linked
          correct: true
        - label: Good residuals jump randomly up and down.
          feedback: Gute Residuen springen zufällig hin und her.
        - label: A wrong slope causes a trend in the residuals, not waves.
          feedback: Eine falsche Steigung erzeugt einen Trend in den Residuen, keine Wellen.
    hints:
      - What would purely random errors look like?
      - Long runs of the same sign are not chance.
    explanation: Linked errors are called autocorrelation. Then the model's margins of error are also too optimistic.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Anscombe’s quartet: four data sets with exactly the same regression line, the same mean and the same R². What does it show?"
    params:
      options:
        - label: Plotted they look completely different – summary numbers do not replace looking at the data
          correct: true
        - label: That all four data sets are the same
          feedback: One is a curve, one has an outlier.
        - label: That regression is useless
          feedback: It is useful – but only together with a plot.
    hints:
      - The same numbers, different pictures.
    explanation: Plot first, then calculate. The residuals show what the line conceals.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: The residuals are 3, −1, −3 and 1. The RMSE is the square root of the mean squared residual. What is it? To two decimals.
    answer:
      value: 2.24
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 5
        misconception: mse-not-rmse
        text: That is the mean squared error. Now take the root.
      - when: numval(state.input) == 2
        misconception: mae-not-rmse
        text: That is the mean absolute error. The RMSE weights large errors more.
    hints:
      - "Squares: 9 + 1 + 9 + 1 = 20. Mean: 5."
      - Take the square root of 5.
    explanation: √5 ≈ 2.24. The RMSE is the typical size of a prediction error – in the units of y.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: One point lies far outside all others in x – exactly on the line of the rest. A second lies in the middle, but far above the line. Which has more leverage?
    params:
      options:
        - label: The one far out in x – it can tilt the line
          correct: true
        - label: It has a big residual, but little leverage in the middle.
          feedback: Er hat ein großes Residuum, aber in der Mitte wenig Hebel.
        - label: Leverage depends only on the distance in x.
          feedback: Hebel hängt nur vom Abstand in x ab.
    hints:
      - "Think of a seesaw: where does a weight act most strongly?"
      - A large Δx means a large weight in the slope formula.
    explanation: Leverage depends on the distance in x. A point with high leverage and a big residual is influential – you check it with measures such as Cook's distance.
    difficulty: 3

srs:
  cards_from: [rechnen, muster]
