id: stats.regression.predict
type: concept
title: Making predictions
summary: From model to number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wohnung
    widget: numeric
    body: "A model predicts apartment prices: price = 3,000 € · area + 50,000 €."
    prompt: What does it predict for {{a}} m²?
    params: { unit: "€" }
    answer: { value: "{{3000 * a + 50000}}" }
    hints:
      - "3,000 · {{a}} + 50,000."
    explanation: "{{3000 * a}} + 50,000 = {{3000 * a + 50000}} €."
    variants:
      params: { a: "choice[40,60,80,100,120]" }
      defaults: { a: 80 }

  - kind: explain
    id: s2
    body: |
      Regressions are behind price estimates, weather models and medicine. They predict the **average** – single cases deviate from it.

  - kind: problem
    id: einzeln
    widget: choice
    prompt: The model predicts 290,000 € for an apartment. What does it actually cost?
    params:
      options:
        - { label: You do not know exactly – the model estimates the average., correct: true }
        - { label: "Exactly 290,000 €", feedback: "Location, condition and chance cause deviations." }
    hints:
      - Do all points lie exactly on the line?
    explanation: A good model also says how widely single values typically spread.

  - kind: problem
    id: mehrere
    widget: choice
    prompt: How can you improve the prediction?
    params:
      options:
        - { label: Include more factors such as location and year built, correct: true }
        - { label: Make the line steeper, feedback: "The best slope is already fixed – information is missing." }
    hints:
      - Does the price depend only on the area?
    explanation: With several factors, it is called **multiple regression** – the start of many AI models.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: The line was computed with heights from 150 to 190 cm. For which height is a prediction risky?
    params:
      buckets:
        - id: b1
          label: Reliable
        - id: b2
          label: Risky
      items:
        - label: 170 cm
          bucket: b1
        - label: 250 cm
          bucket: b2
        - label: 160 cm
          bucket: b1
        - label: 50 cm
          bucket: b2
    hints:
      - Does the value lie within the range of the data?
    explanation: Outside the data nobody knows whether the line still holds.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A model: weight in kg = 0.9 · height in cm − 90. Someone is 180 cm tall and weighs 80 kg. What is the residual?"
    params:
      unit: kg
    answer:
      value: 8
    hints:
      - "Prediction: 0.9 · 180 − 90."
    explanation: 80 − 72 = 8 kg above the prediction.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A model gets more and more input variables and fits the known data perfectly. On new data it fails. What happened?
    params:
      options:
        - label: Overfitting – it has memorised the randomness in the data too
          correct: true
        - label: It had too few variables
          feedback: Too many are the problem.
        - label: The new data are faulty
          feedback: The fault lies in the model.
    hints:
      - With enough knobs you hit every point – including the noise.
    explanation: That is why models are always tested on data they have never seen.
    difficulty: 3

srs:
  cards_from: [wohnung, einzeln]
