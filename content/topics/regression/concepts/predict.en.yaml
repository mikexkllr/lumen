id: stats.regression.predict
type: concept
title: Making predictions
summary: From model to number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: wohnung
    widget: numeric
    body: "A model predicts apartment prices: price = 3,000 € · area + 50,000 €."
    prompt: What does it predict for {{a}} m²?
    params: { unit: "€" }
    answer: { value: "{{3000 * a + 50000}}" }
    hints:
      - "3,000 · {{a}} + 50,000."
    explanation: "{{3000 * a}} + 50,000 = {{3000 * a + 50000}} €."
    variants:
      params: { a: "choice[40,60,80,100,120]" }
      defaults: { a: 80 }

  - kind: explain
    id: s2
    body: |
      Regressions are behind price estimates, weather models and medicine. They predict the **average** – single cases deviate from it.

  - kind: problem
    id: einzeln
    widget: choice
    prompt: The model predicts 290,000 € for an apartment. What does it actually cost?
    params:
      options:
        - { label: You do not know exactly – the model estimates the average., correct: true }
        - { label: "Exactly 290,000 €", feedback: "Location, condition and chance cause deviations." }
    hints:
      - Do all points lie exactly on the line?
    explanation: A good model also says how widely single values typically spread.

  - kind: problem
    id: mehrere
    widget: choice
    prompt: How can you improve the prediction?
    params:
      options:
        - { label: Include more factors such as location and year built, correct: true }
        - { label: Make the line steeper, feedback: "The best slope is already fixed – information is missing." }
    hints:
      - Does the price depend only on the area?
    explanation: With several factors, it is called **multiple regression** – the start of many AI models.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: The line was computed with heights from 150 to 190 cm. For which height is a prediction risky?
    params:
      buckets:
        - id: b1
          label: Reliable
        - id: b2
          label: Risky
      items:
        - label: 170 cm
          bucket: b1
        - label: 250 cm
          bucket: b2
        - label: 160 cm
          bucket: b1
        - label: 50 cm
          bucket: b2
    hints:
      - Does the value lie within the range of the data?
    explanation: Outside the data nobody knows whether the line still holds.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A model: weight in kg = 0.9 · height in cm − 90. Someone is 180 cm tall and weighs 80 kg. What is the residual?"
    params:
      unit: kg
    answer:
      value: 8
    hints:
      - "Prediction: 0.9 · 180 − 90."
    explanation: 80 − 72 = 8 kg above the prediction.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "A model predicts 290,000 €. Its typical error (RMSE) is 20,000 €. Rule of thumb for 95 %: prediction ± 2 · RMSE. Where is the lower limit?"
    params:
      unit: €
    answer:
      value: 250000
    hints:
      - 2 · 20,000 = 40,000.
      - Compute 290,000 − 40,000.
    explanation: Between 250,000 € and 330,000 €. An honest prediction interval is often much wider than people think.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A model has an error of 2 % on its training data and 15 % on new data. What is most likely?
    params:
      options:
        - label: It memorised the training data, noise included
          correct: true
        - label: New data are the honest test.
          feedback: Neue Daten sind der ehrliche Test.
        - label: What counts is the error on new data.
          feedback: Entscheidend ist der Fehler bei neuen Daten.
    hints:
      - Which of the two errors counts in practice?
      - A big gap between them is a warning sign.
    explanation: That is overfitting. That is why you always hold back test data the model has never seen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A model gets more and more input variables and fits the known data perfectly. On new data it fails. What happened?
    params:
      options:
        - label: Overfitting – it has memorised the randomness in the data too
          correct: true
        - label: It had too few variables
          feedback: Too many are the problem.
        - label: The new data are faulty
          feedback: The fault lies in the model.
    hints:
      - With enough knobs you hit every point – including the noise.
    explanation: That is why models are always tested on data they have never seen.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Through 10 points with different x-values there is always a polynomial that hits all of them exactly. At most what degree does it need?
    answer:
      value: 9
    feedback:
      - when: numval(state.input) == 10
        misconception: off-by-one
        text: A polynomial of degree n has n + 1 coefficients. For 10 points 10 coefficients are enough.
    hints:
      - A line (degree 1) always fits through 2 points.
      - Degree n fits through n + 1 points.
    explanation: Degree 9 with R² = 1 – and still useless for new values, because the curve swings wildly between the points. A perfect fit is no mark of quality.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "The adjusted R² penalises too many predictors: 1 − (1 − R²) · (n − 1) ÷ (n − k − 1). Here R² = 0.5, n = 21 points and k = 10 predictors. What is it?"
    answer:
      value: 0
    hints:
      - (n − 1) ÷ (n − k − 1) = 20 ÷ 10 = 2.
      - 1 − 0.5 · 2 = ?
    explanation: Zero! With 10 predictors and 21 points the model explains no more than chance would. Adjusted R² can even turn negative.
    difficulty: 3

  - kind: problem
    id: da-x3
    depth: 3
    widget: choice
    prompt: In cross-validation you split the data into 5 parts. What happens next?
    params:
      options:
        - label: "Five times: train on 4 parts, test on the fifth – then average the errors"
          correct: true
        - label: Then you test on data the model already knows.
          feedback: Dann testet man auf bekannten Daten.
        - label: That cherry-picks the result.
          feedback: Damit sucht man sich das Ergebnis aus.
    hints:
      - Every part should be test data once.
      - The model must never see its test data beforehand.
    explanation: That way every point is tested honestly exactly once. This error is used, for example, to choose how complex a model may be.
    difficulty: 3

srs:
  cards_from: [wohnung, einzeln]
