id: stats.regression.line
type: concept
title: The best line
summary: One line that sums up the data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The lost dwarf planet
    body: The method behind every regression once found a lost object in the sky. Uncover the story card by card. It shows how Gauss calculated with **least squares**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🪐
            front: Ceres disappears
            back: In 1801 a dwarf planet was discovered – and lost behind the Sun after a few weeks.
          - icon: 📏
            front: Gauss calculates
            back: The 24-year-old Gauss fitted an orbit to the few data points – with the smallest possible squared errors.
          - icon: 🔭
            front: Found!
            back: At the end of 1801, Ceres turned up almost exactly where Gauss had predicted.

  - kind: problem
    id: anpassen
    widget: slider
    prompt: Place the line through the points so that it is as close as possible to all of them.
    params:
      expr: "m*x + b"
      x: [0, 6]
      y: [0, 14]
      showCoordinates: false
      sliders:
        - { id: m, label: Slope, min: 0, max: 4, step: 0.25, initial: 0.5 }
        - { id: b, label: Height, min: -2, max: 4, step: 0.5, initial: 3 }
      markers:
        - { x: 1, y: 3, group: a }
        - { x: 2, y: 5, group: a }
        - { x: 3, y: 6, group: a }
        - { x: 4, y: 9, group: a }
        - { x: 5, y: 11, group: a }
    check: { predicate: "m >= 1.75 && m <= 2.25 && b >= 0 && b <= 1.5" }
    hints:
      - From x = 1 to x = 5, the points rise by about 8.
    explanation: The best fit is about y = 2x + 0.8.

  - kind: explain
    id: s2
    body: |
      The **regression line** makes the sum of squared distances to all points as small as possible. That is why the method is called **least squares**.

  - kind: problem
    id: vorhersage
    widget: numeric
    prompt: The line is y = 2x + 0.8. What does it predict for x = {{x}}?
    params: { placeholder: "y" }
    answer: { value: "{{2 * x + 0.8}}" }
    hints:
      - "2 · {{x}} + 0.8."
    explanation: "{{2 * x}} + 0.8 = {{2 * x + 0.8}}."
    variants:
      params: { x: "int[6,12]" }
      defaults: { x: 7 }

  - kind: problem
    id: quadrat
    widget: choice
    prompt: Why do you square the distances instead of just adding them?
    params:
      options:
        - { label: Otherwise upward and downward deviations cancel out., correct: true }
        - { label: Squaring makes the numbers smaller., feedback: "Usually it makes them larger – it is about the sign." }
    hints:
      - What do +3 and −3 add up to?
    explanation: Squares are never negative – and large outliers count especially strongly.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The regression line always passes through the point of the two means. The slope is 2, the mean of x is 5 and of y is 13. What is the intercept b?
    answer:
      value: 3
    hints:
      - 13 = 2 · 5 + b.
    explanation: b = 3. The line pivots about the centre of mass of the scatter.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "This is how a computer looks for the best line: downhill step by step. Set learning rate and steps so that the error drops below 0.1."
    params:
      scene: descent
    answer:
      loss:
        - 0
        - 0.1
    explanation: The error is like a bowl. The best line lies at the bottom.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Four points: (1, 1), (2, 3), (3, 2), (4, 6). Means: x = 2.5 and y = 3. The slope of the best line is Σ(Δx · Δy) ÷ Σ(Δx²). What is it?"
    answer:
      value: 1.4
    hints:
      - "Δx: −1.5, −0.5, 0.5, 1.5. Δy: −2, 0, −1, 3."
      - Σ(Δx · Δy) = 3 + 0 − 0.5 + 4.5 = 7 and Σ(Δx²) = 5.
    explanation: 7 ÷ 5 = 1.4. Points far from the mean (large Δx) carry the most weight.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: The line passes through the centre (2.5, 3) and has slope 1.4. Where does it cross the y-axis?
    answer:
      value: -0.5
    feedback:
      - when: numval(state.input) == 3
        misconception: intercept-at-mean
        text: That is the y-value at x = 2.5, not at x = 0.
    hints:
      - Go back from x = 2.5 to x = 0.
      - Compute 3 − 1.4 · 2.5.
    explanation: 3 − 3.5 = −0.5. The line is y = 1.4x − 0.5.
    difficulty: 2

  - kind: explain
    id: da-d3
    depth: 2
    body: "Where do these formulas come from? You differentiate the sum of squared errors with respect to slope and intercept and set both derivatives to zero. That gives two **normal equations**. One of them says: the residuals add up to zero."

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The coefficient of determination R² of a regression is 0.64. What does it mean?
    params:
      options:
        - label: 64% of the variation in y is explained by x
          correct: true
        - label: 64% of the points lie on the line
          feedback: Usually not a single point lies exactly on it.
        - label: The prediction is right in 64% of cases
          feedback: R² measures explained variation, not a hit rate.
    hints:
      - R² is the square of the correlation coefficient.
    explanation: Here r = 0.8. The remaining 36% comes from other influences or chance.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: The coefficient of determination is R² = 1 − (residual error ÷ total variation). The sum of squared residuals is {{r}}; the squared distances from the mean add to {{t}}. What is R²?
    answer:
      value: "{{1 - r / t}}"
    feedback:
      - when: numval(state.input) == r / t
        misconception: unexplained-share
        text: That is the share the line does not explain. Subtract it from 1.
    hints:
      - Compute {{r}} ÷ {{t}}.
      - Subtract the result from 1.
    explanation: 1 − {{r / t}} = {{1 - r / t}}. The line explains {{100 - 100 * r / t}} % of the variation in y.
    difficulty: 3
    variants:
      params:
        r: choice[2,4,5,10]
        t: choice[20,25,40,50]
      constraints:
        - r < t
        - isInt(100 * r / t)
      defaults:
        r: 4
        t: 20

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: For a line with a single predictor, R² = r². The correlation is r = −0.5. What is R²?
    answer:
      value: 0.25
    feedback:
      - when: numval(state.input) == -0.25
        misconception: negative-square
        text: A square is never negative.
    hints:
      - Square −0.5.
      - (−0.5)² = 0.25.
    explanation: "R² = 0.25: only a quarter of the variation is explained, although r = −0.5 sounds like a lot."
    difficulty: 3

srs:
  cards_from: [anpassen, quadrat]
