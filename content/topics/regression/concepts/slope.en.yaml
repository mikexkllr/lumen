id: stats.regression.slope
type: concept
title: What the slope tells you
summary: Relationships in numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Steep, flat, falling
    body: A few seconds faster per hour of training, six degrees colder per kilometre of height – those are **slopes**. Move the slider. When does the line rise, when does it fall, when does it stay flat?
    visual:
      widget: slider
      interactive: true
      params:
        expr: m*x + 3
        x:
          - 0
          - 6
        y:
          - 0
          - 6
        showCoordinates: false
        sliders:
          - id: m
            label: Slope
            min: -1
            max: 1
            step: 0.25
            initial: 0.5

  - kind: problem
    id: bedeutung
    widget: choice
    prompt: "For apartments, roughly: price = 3,000 € · area + 50,000 €. What does the 3,000 mean?"
    params:
      options:
        - { label: "Each extra square meter costs 3,000 € more on average.", correct: true }
        - { label: "An apartment costs 3,000 €.", feedback: "The 3,000 is the slope – the price per additional square meter." }
    hints:
      - The slope tells you how y changes when x grows by 1.
    explanation: The slope is the average change per unit.

  - kind: problem
    id: richtung
    widget: buckets
    prompt: Does the line probably rise or fall?
    params:
      buckets: [{ label: rises }, { label: falls }]
      items:
        - { label: Study time and test scores, bucket: rises }
        - { label: Height and weight, bucket: rises }
        - { label: Age of a car and its price, bucket: falls }
        - { label: Mountain height and temperature, bucket: falls }
    hints:
      - Does one go up when the other goes up?
    explanation: A negative slope means more of one, less of the other.

  - kind: problem
    id: einheiten
    widget: numeric
    prompt: "A line describes: temperature = −6.5 °C per km of altitude · altitude + 15 °C. How cold is it at {{h}} km altitude?"
    params: { unit: "°C" }
    answer: { value: "{{15 - 6.5 * h}}" }
    hints:
      - "15 − 6.5 · {{h}}."
    explanation: "15 − {{6.5 * h}} = {{15 - 6.5 * h}} °C."
    variants:
      params: { h: "int[1,4]" }
      defaults: { h: 2 }

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "The line reads: price = 2 · area + 50. By how much does the price rise if the area grows by 10?"
    answer:
      value: 20
    hints:
      - "The slope is 2: 2 more per unit of area."
    explanation: 2 · 10 = 20. The 50 does not change.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: "A plant is measured every second week: x in weeks, y in centimetres. Set the slope so that the line hits all the points."
    params:
      expr: m*x + 1
      x:
        - 0
        - 8
      y:
        - 0
        - 8
      showCoordinates: false
      sliders:
        - id: m
          label: Slope
          min: 0
          max: 2
          step: 0.25
          initial: 0.25
      markers:
        - x: 0
          y: 1
        - x: 2
          y: 2.5
        - x: 4
          y: 4
        - x: 6
          y: 5.5
        - x: 8
          y: 7
    answer:
      values:
        m: 0.75
    hints:
      - From week 0 to week 8 the plant grows from 1 to 7 cm.
      - 6 cm in 8 weeks is 0.75 cm per week.
    explanation: "The **slope** 0.75 means: the plant grows 0.75 cm per week on average."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "In a regression: each hour of TV per day goes with 2 points less on the test. What may be concluded?"
    params:
      options:
        - label: Only an association – whether TV is the cause remains open
          correct: true
        - label: Whoever watches an hour less surely gets 2 points more
          feedback: That would be a claim about causes.
        - label: TV makes you stupid
          feedback: Perhaps children with little support simply have more TV time.
    hints:
      - A slope describes data – not causes.
    explanation: Regression describes how quantities **vary together**. Causes require an experiment.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Height and weight correlate with r = {{r}}. The standard deviations are {{sy}} kg and {{sx}} cm. How many kg more does the line predict per cm? To two decimals.
    answer:
      value: "{{r * sy / sx}}"
      tolerance: 0.006
    hints:
      - Slope = r · s_y ÷ s_x.
      - Compute {{r}} · {{sy}} ÷ {{sx}}.
    explanation: "{{r}} · {{sy}} ÷ {{sx}} ≈ {{round(100 * r * sy / sx) / 100}} kg per cm. The slope always has the unit »y per x«."
    difficulty: 2
    variants:
      params:
        r: choice[0.4,0.5,0.6,0.8]
        sy: choice[10,12,15]
        sx: choice[5,6,10]
      defaults:
        r: 0.5
        sy: 12
        sx: 6

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "A rent model: rent = 300 € + 11 € · area in m². You measure area in dm² instead of m² (1 m² = 100 dm²). What happens to the slope?"
    params:
      options:
        - label: "It becomes 100 times smaller: 0.11 € per dm²"
          correct: true
        - label: Then each dm² would cost 11 € – far too much.
          feedback: Dann würde jeder dm² 11 € kosten – viel zu viel.
        - label: A dm² is smaller than a m², so it costs less.
          feedback: Ein dm² ist kleiner als ein m², also kostet er weniger.
    hints:
      - How much does one extra m² cost? How many dm² is that?
      - 11 € spread over 100 dm².
    explanation: The slope depends on units; r does not. Whoever compares slopes must check the units.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In the model “salary = a + b · years of experience + c · degree”, b = 1500. What exactly does that mean?
    params:
      options:
        - label: With the same degree each year of experience brings €1500 more on average
          correct: true
        - label: Each year brings €1500 – whatever else holds
          feedback: The value only applies with the other variables held fixed.
        - label: A degree is worth €1500
          feedback: That would be c, not b.
    hints:
      - “All else equal” is the decisive addition.
    explanation: "**Multiple regression** separates influences by holding the others constant mathematically."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: A model reads ln(price) = 9 + 0.05 · years-newer. What does the 0.05 mean?
    params:
      options:
        - label: Each year newer brings about 5 % higher price
          correct: true
        - label: In logs, coefficients act as factors.
          feedback: Im Logarithmus wirken Koeffizienten als Faktoren.
        - label: It is percent, not euros.
          feedback: Gemeint sind Prozente, nicht Euro.
    hints:
      - ln(price) rises by 0.05. What does that mean for the price itself?
      - e^0.05 ≈ 1.051.
    explanation: e^0.05 ≈ 1.051, so about +5.1 % per year. Log models describe relative effects – typical for prices and incomes.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A model »pay from height« gives +200 € per 10 cm. Adding gender shrinks the effect to +40 €. Why?
    params:
      options:
        - label: Height partly stood in for gender – an omitted variable biased the slope
          correct: true
        - label: "On the contrary: it now separates two influences."
          feedback: "Im Gegenteil: Es trennt jetzt zwei Einflüsse."
        - label: "The effect is systematic: men are taller on average."
          feedback: "Der Effekt ist systematisch: Männer sind im Schnitt größer."
    hints:
      - Are height and gender related?
      - Without gender in the model, height takes over its effect.
    explanation: That is omitted-variable bias. A slope always means »holding constant the other variables in the model«.
    difficulty: 3

srs:
  cards_from: [bedeutung, richtung]
