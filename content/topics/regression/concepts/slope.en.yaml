id: stats.regression.slope
type: concept
title: What the slope tells you
summary: Relationships in numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: bedeutung
    widget: choice
    prompt: "For apartments, roughly: price = 3,000 € · area + 50,000 €. What does the 3,000 mean?"
    params:
      options:
        - { label: "Each extra square meter costs 3,000 € more on average.", correct: true }
        - { label: "An apartment costs 3,000 €.", feedback: "The 3,000 is the slope – the price per additional square meter." }
    hints:
      - The slope tells you how y changes when x grows by 1.
    explanation: The slope is the average change per unit.

  - kind: problem
    id: richtung
    widget: buckets
    prompt: Does the line probably rise or fall?
    params:
      buckets: [{ label: rises }, { label: falls }]
      items:
        - { label: Study time and test scores, bucket: rises }
        - { label: Height and weight, bucket: rises }
        - { label: Age of a car and its price, bucket: falls }
        - { label: Mountain height and temperature, bucket: falls }
    hints:
      - Does one go up when the other goes up?
    explanation: A negative slope means more of one, less of the other.

  - kind: problem
    id: einheiten
    widget: numeric
    prompt: "A line describes: temperature = −6.5 °C per km of altitude · altitude + 15 °C. How cold is it at {{h}} km altitude?"
    params: { unit: "°C" }
    answer: { value: "{{15 - 6.5 * h}}" }
    hints:
      - "15 − 6.5 · {{h}}."
    explanation: "15 − {{6.5 * h}} = {{15 - 6.5 * h}} °C."
    variants:
      params: { h: "int[1,4]" }
      defaults: { h: 2 }

srs:
  cards_from: [bedeutung, richtung]
