id: stats.regression.line
type: concept
title: Die beste Gerade
summary: Eine Linie, die Daten zusammenfasst.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: anpassen
    widget: slider
    prompt: Lege die Gerade so durch die Punkte, dass sie möglichst nah an allen liegt.
    params:
      expr: "m*x + b"
      x: [0, 6]
      y: [0, 14]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: 0, max: 4, step: 0.25, initial: 0.5 }
        - { id: b, label: Höhe, min: -2, max: 4, step: 0.5, initial: 3 }
      markers:
        - { x: 1, y: 3, group: a }
        - { x: 2, y: 5, group: a }
        - { x: 3, y: 6, group: a }
        - { x: 4, y: 9, group: a }
        - { x: 5, y: 11, group: a }
    check: { predicate: "m >= 1.75 && m <= 2.25 && b >= 0 && b <= 1.5" }
    hints:
      - Von x = 1 bis x = 5 steigen die Punkte um etwa 8.
    explanation: Am besten passt etwa y = 2x + 0,8.

  - kind: explain
    id: s2
    body: |
      Die **Regressionsgerade** macht die Summe der quadrierten Abstände zu allen Punkten so klein wie möglich. Darum heißt das Verfahren **Methode der kleinsten Quadrate**.

  - kind: problem
    id: vorhersage
    widget: numeric
    prompt: Die Gerade lautet y = 2x + 0,8. Was sagt sie für x = {{x}} voraus?
    params: { placeholder: "y" }
    answer: { value: "{{2 * x + 0.8}}" }
    hints:
      - "2 · {{x}} + 0,8."
    explanation: "{{2 * x}} + 0,8 = {{2 * x + 0.8}}."
    variants:
      params: { x: "int[6,12]" }
      defaults: { x: 7 }

  - kind: problem
    id: quadrat
    widget: choice
    prompt: Warum quadriert man die Abstände, statt sie einfach zu addieren?
    params:
      options:
        - { label: Sonst heben sich Abweichungen nach oben und unten auf., correct: true }
        - { label: Quadrieren macht die Zahlen kleiner., feedback: "Meist macht es sie größer – es geht ums Vorzeichen." }
    hints:
      - Was ergibt +3 und −3 zusammen?
    explanation: Quadrate sind nie negativ – und große Ausreißer zählen besonders stark.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Regressionsgerade geht immer durch den Punkt der beiden Mittelwerte. Die Steigung ist 2, der Mittelwert von x ist 5 und von y ist 13. Wie groß ist der Achsenabschnitt b?
    answer:
      value: 3
    hints:
      - 13 = 2 · 5 + b.
    explanation: b = 3. Die Gerade dreht sich um den Schwerpunkt der Punktwolke.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "So sucht ein Computer die beste Gerade: Schritt für Schritt bergab. Stell Lernrate und Schritte so ein, dass der Fehler unter 0,1 fällt."
    params:
      scene: descent
    answer:
      loss:
        - 0
        - 0.1
    explanation: Der Fehler ist wie eine Schüssel. Unten liegt die beste Gerade.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Vier Punkte: (1 | 1), (2 | 3), (3 | 2), (4 | 6). Mittelwerte: x = 2,5 und y = 3. Die Steigung der besten Geraden ist Σ(Δx · Δy) : Σ(Δx²). Wie groß ist sie?"
    answer:
      value: 1.4
    hints:
      - "Δx: −1,5; −0,5; 0,5; 1,5. Δy: −2; 0; −1; 3."
      - Σ(Δx · Δy) = 3 + 0 − 0,5 + 4,5 = 7 und Σ(Δx²) = 5.
    explanation: "7 : 5 = 1,4. Punkte weit weg vom Mittel (großes Δx) haben das meiste Gewicht."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Die Gerade geht durch den Schwerpunkt (2,5 | 3) und hat die Steigung 1,4. Wo schneidet sie die y-Achse?
    answer:
      value: -0.5
    feedback:
      - when: numval(state.input) == 3
        misconception: intercept-at-mean
        text: Das ist der y-Wert bei x = 2,5, nicht bei x = 0.
    hints:
      - Geh von x = 2,5 nach x = 0 zurück.
      - Rechne 3 − 1,4 · 2,5.
    explanation: 3 − 3,5 = −0,5. Die Gerade lautet y = 1,4x − 0,5.
    difficulty: 2

  - kind: explain
    id: da-d3
    depth: 2
    body: "Woher kommen diese Formeln? Man leitet die Summe der quadrierten Fehler nach Steigung und Achsenabschnitt ab und setzt beide Ableitungen null. Das ergibt zwei **Normalgleichungen**. Eine davon sagt: Die Residuen summieren sich zu null."

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das Bestimmtheitsmaß R² einer Regression ist 0,64. Was bedeutet das?
    params:
      options:
        - label: 64 % der Streuung von y werden durch x erklärt
          correct: true
        - label: 64 % der Punkte liegen auf der Geraden
          feedback: Meist liegt kein einziger Punkt exakt darauf.
        - label: Die Vorhersage stimmt in 64 % der Fälle
          feedback: R² misst erklärte Streuung, keine Trefferquote.
    hints:
      - R² ist das Quadrat des Korrelationskoeffizienten.
    explanation: Hier ist r = 0,8. Die übrigen 36 % stammen aus anderen Einflüssen oder Zufall.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Das **Bestimmtheitsmaß** ist R² = 1 − (Restfehler : Gesamtstreuung). Die Summe der quadrierten Residuen ist {{r}}, die quadrierten Abstände zum Mittel ergeben {{t}}. Wie groß ist R²?"
    answer:
      value: "{{1 - r / t}}"
    feedback:
      - when: numval(state.input) == r / t
        misconception: unexplained-share
        text: Das ist der Anteil, den die Gerade **nicht** erklärt. Zieh ihn von 1 ab.
    hints:
      - "Rechne {{r}} : {{t}}."
      - Zieh das Ergebnis von 1 ab.
    explanation: 1 − {{r / t}} = {{1 - r / t}}. Die Gerade erklärt {{100 - 100 * r / t}} % der Streuung von y.
    difficulty: 3
    variants:
      params:
        r: choice[2,4,5,10]
        t: choice[20,25,40,50]
      constraints:
        - r < t
        - isInt(100 * r / t)
      defaults:
        r: 4
        t: 20

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Bei einer Geraden mit nur einer Einflussgröße gilt R² = r². Die Korrelation ist r = −0,5. Wie groß ist R²?
    answer:
      value: 0.25
    feedback:
      - when: numval(state.input) == -0.25
        misconception: negative-square
        text: Ein Quadrat ist nie negativ.
    hints:
      - Quadriere −0,5.
      - (−0,5)² = 0,25.
    explanation: "R² = 0,25: Nur ein Viertel der Streuung wird erklärt, obwohl r = −0,5 nach viel klingt."
    difficulty: 3

srs:
  cards_from: [anpassen, quadrat]
