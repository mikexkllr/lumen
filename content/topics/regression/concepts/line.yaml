id: stats.regression.line
type: concept
title: Die beste Gerade
summary: Eine Linie, die Daten zusammenfasst.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: anpassen
    widget: slider
    prompt: Lege die Gerade so durch die Punkte, dass sie möglichst nah an allen liegt.
    params:
      expr: "m*x + b"
      x: [0, 6]
      y: [0, 14]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: 0, max: 4, step: 0.25, initial: 0.5 }
        - { id: b, label: Höhe, min: -2, max: 4, step: 0.5, initial: 3 }
      markers:
        - { x: 1, y: 3, group: a }
        - { x: 2, y: 5, group: a }
        - { x: 3, y: 6, group: a }
        - { x: 4, y: 9, group: a }
        - { x: 5, y: 11, group: a }
    check: { predicate: "m >= 1.75 && m <= 2.25 && b >= 0 && b <= 1.5" }
    hints:
      - Von x = 1 bis x = 5 steigen die Punkte um etwa 8.
    explanation: Am besten passt etwa y = 2x + 0,8.

  - kind: explain
    body: |
      Die **Regressionsgerade** macht die Summe der quadrierten Abstände zu allen Punkten so klein wie möglich. Darum heißt das Verfahren **Methode der kleinsten Quadrate**.

  - kind: problem
    id: vorhersage
    widget: numeric
    prompt: Die Gerade lautet y = 2x + 0,8. Was sagt sie für x = {{x}} voraus?
    params: { placeholder: "y" }
    answer: { value: "{{2 * x + 0.8}}" }
    hints:
      - "2 · {{x}} + 0,8."
    explanation: "{{2 * x}} + 0,8 = {{2 * x + 0.8}}."
    variants:
      params: { x: "int[6,12]" }
      defaults: { x: 7 }

  - kind: problem
    id: quadrat
    widget: choice
    prompt: Warum quadriert man die Abstände, statt sie einfach zu addieren?
    params:
      options:
        - { label: Sonst heben sich Abweichungen nach oben und unten auf., correct: true }
        - { label: Quadrieren macht die Zahlen kleiner., feedback: "Meist macht es sie größer – es geht ums Vorzeichen." }
    hints:
      - Was ergibt +3 und −3 zusammen?
    explanation: Quadrate sind nie negativ – und große Ausreißer zählen besonders stark.

srs:
  cards_from: [anpassen, quadrat]
