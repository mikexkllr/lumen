id: stats.regression.slope
type: concept
title: Was die Steigung sagt
summary: Zusammenhänge in Zahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: bedeutung
    widget: choice
    prompt: "Für Wohnungen gilt etwa: Preis = 3000 € · Fläche + 50 000 €. Was bedeutet die 3000?"
    params:
      options:
        - { label: Jeder Quadratmeter mehr kostet im Schnitt 3000 € mehr., correct: true }
        - { label: Eine Wohnung kostet 3000 €., feedback: "Die 3000 ist die Steigung – der Preis pro zusätzlichem Quadratmeter." }
    hints:
      - Die Steigung sagt, wie sich y ändert, wenn x um 1 wächst.
    explanation: Die Steigung ist die durchschnittliche Änderung pro Einheit.

  - kind: problem
    id: richtung
    widget: buckets
    prompt: Steigt oder fällt die Gerade wahrscheinlich?
    params:
      buckets: [{ label: steigt }, { label: fällt }]
      items:
        - { label: Lernzeit und Testpunkte, bucket: steigt }
        - { label: Größe und Gewicht, bucket: steigt }
        - { label: Alter eines Autos und sein Preis, bucket: fällt }
        - { label: Höhe und Temperatur in den Bergen, bucket: fällt }
    hints:
      - Wird das eine mehr, wenn das andere mehr wird?
    explanation: Eine negative Steigung heißt – mehr vom einen, weniger vom anderen.

  - kind: problem
    id: einheiten
    widget: numeric
    prompt: "Eine Gerade beschreibt: Temperatur = −6,5 °C pro km Höhe · Höhe + 15 °C. Wie kalt ist es auf {{h}} km Höhe?"
    params: { unit: "°C" }
    answer: { value: "{{15 - 6.5 * h}}" }
    hints:
      - "15 − 6,5 · {{h}}."
    explanation: "15 − {{6.5 * h}} = {{15 - 6.5 * h}} °C."
    variants:
      params: { h: "int[1,4]" }
      defaults: { h: 2 }

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Die Gerade lautet: Preis = 2 · Fläche + 50. Um wie viel steigt der Preis, wenn die Fläche um 10 wächst?"
    answer:
      value: 20
    hints:
      - "Die Steigung ist 2: pro Einheit Fläche 2 mehr."
    explanation: 2 · 10 = 20. Die 50 ändert sich dabei nicht.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "In einer Regression gilt: Jede Stunde Fernsehen pro Tag geht mit 2 Punkten weniger im Test einher. Was darf man daraus schließen?"
    params:
      options:
        - label: Nur einen Zusammenhang – ob Fernsehen die Ursache ist, bleibt offen
          correct: true
        - label: Wer eine Stunde weniger schaut, bekommt sicher 2 Punkte mehr
          feedback: Das wäre eine Aussage über Ursachen.
        - label: Fernsehen macht dumm
          feedback: Vielleicht haben Kinder mit wenig Unterstützung einfach mehr Fernsehzeit.
    hints:
      - Eine Steigung beschreibt Daten – nicht Ursachen.
    explanation: Regression beschreibt, wie Größen **zusammen variieren**. Für Ursachen braucht es ein Experiment.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Größe und Gewicht korrelieren mit r = {{r}}. Die Standardabweichungen sind {{sy}} kg und {{sx}} cm. Wie viele kg mehr sagt die Gerade pro cm voraus? Auf zwei Stellen.
    answer:
      value: "{{r * sy / sx}}"
      tolerance: 0.006
    hints:
      - "Steigung = r · sᵧ : sₓ."
      - "Rechne {{r}} · {{sy}} : {{sx}}."
    explanation: "{{r}} · {{sy}} : {{sx}} ≈ {{round(100 * r * sy / sx) / 100}} kg pro cm. Die Steigung hat immer die Einheit »y pro x«."
    difficulty: 2
    variants:
      params:
        r: choice[0.4,0.5,0.6,0.8]
        sy: choice[10,12,15]
        sx: choice[5,6,10]
      defaults:
        r: 0.5
        sy: 12
        sx: 6

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "Ein Modell für Mieten: Miete = 300 € + 11 € · Fläche in m². Du rechnest die Fläche in dm² statt m² (1 m² = 100 dm²). Was passiert mit der Steigung?"
    params:
      options:
        - label: "Sie wird 100-mal kleiner: 0,11 € pro dm²"
          correct: true
        - label: Sie bleibt 11
          feedback: Dann würde jeder dm² 11 € kosten – viel zu viel.
        - label: Sie wird 100-mal größer
          feedback: Ein dm² ist kleiner als ein m², also kostet er weniger.
    hints:
      - Wie viel kostet ein m² mehr? Wie viele dm² sind das?
      - 11 € verteilen sich auf 100 dm².
    explanation: Die Steigung hängt an den Einheiten, r nicht. Wer Steigungen vergleicht, muss die Einheiten prüfen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Im Modell »Gehalt = a + b · Berufsjahre + c · Abschluss« ist b = 1500. Was bedeutet das genau?
    params:
      options:
        - label: Bei gleichem Abschluss bringt jedes Berufsjahr im Schnitt 1500 € mehr
          correct: true
        - label: Jedes Berufsjahr bringt 1500 € – egal, was sonst gilt
          feedback: Der Wert gilt nur, wenn die anderen Größen festgehalten werden.
        - label: Ein Abschluss ist 1500 € wert
          feedback: Das wäre c, nicht b.
    hints:
      - »Alles andere gleich« ist der entscheidende Zusatz.
    explanation: Die **multiple Regression** trennt Einflüsse, indem sie die anderen rechnerisch konstant hält.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Ein Modell lautet ln(Preis) = 9 + 0,05 · Baujahre-jünger. Was bedeutet die 0,05?
    params:
      options:
        - label: Jedes Jahr jünger bringt etwa 5 % höheren Preis
          correct: true
        - label: Jedes Jahr bringt 0,05 € mehr
          feedback: Im Logarithmus wirken Koeffizienten als Faktoren.
        - label: Der Preis steigt um 5 €
          feedback: Gemeint sind Prozente, nicht Euro.
    hints:
      - ln(Preis) steigt um 0,05. Was heißt das für den Preis selbst?
      - e^0,05 ≈ 1,051.
    explanation: e^0,05 ≈ 1,051, also etwa +5,1 % pro Jahr. Log-Modelle beschreiben **relative** Effekte – typisch für Preise und Einkommen.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Ein Modell »Lohn aus Körpergröße« ergibt +200 € pro 10 cm. Nimmt man das Geschlecht dazu, schrumpft der Effekt auf +40 €. Warum?
    params:
      options:
        - label: Größe stand teils für das Geschlecht – eine ausgelassene Größe verzerrte die Steigung
          correct: true
        - label: Das Modell ist jetzt falsch
          feedback: "Im Gegenteil: Es trennt jetzt zwei Einflüsse."
        - label: Zufall
          feedback: "Der Effekt ist systematisch: Männer sind im Schnitt größer."
    hints:
      - Hängen Größe und Geschlecht zusammen?
      - Ohne Geschlecht im Modell übernimmt die Größe dessen Wirkung.
    explanation: Das ist die **Verzerrung durch ausgelassene Variablen**. Eine Steigung gilt immer »bei Konstanthalten der übrigen Größen im Modell«.
    difficulty: 3

srs:
  cards_from: [bedeutung, richtung]
