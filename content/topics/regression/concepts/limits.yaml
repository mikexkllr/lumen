id: stats.regression.limits
type: concept
title: Grenzen der Geraden
summary: Ausreißer und Extrapolation.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: kind
    widget: choice
    prompt: Ein Kind wächst von 2 bis 10 Jahren etwa 6 cm pro Jahr. Wie groß ist es nach dieser Geraden mit 40 Jahren?
    params:
      options:
        - { label: Die Gerade gilt dort nicht mehr., correct: true }
        - { label: "Etwa 2,7 Meter", feedback: "Rechnerisch ja – aber Menschen hören auf zu wachsen." }
    hints:
      - Gilt der Trend für immer?
    explanation: Außerhalb der gemessenen Daten vorherzusagen heißt **Extrapolation** – oft ein Fehler.

  - kind: explain
    id: s2
    body: |
      Ein einziger **Ausreißer** kann die Gerade stark kippen, weil die quadrierten Abstände ihn hoch gewichten. Darum sieht man sich die Daten immer erst an.

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: In einer Gehaltsstatistik steht ein Tippfehler – 1 000 000 € statt 100 000 €. Was passiert mit der Geraden?
    params:
      options:
        - { label: Sie wird stark verzerrt., correct: true }
        - { label: Kaum etwas – es ist nur ein Punkt., feedback: "Weil Abstände quadriert werden, zieht ein einzelner Riese die Gerade stark." }
    hints:
      - Wie groß ist das Quadrat eines riesigen Abstands?
    explanation: Ein Punkt kann alles verschieben – Datenprüfung kommt vor dem Rechnen.

  - kind: problem
    id: wann
    widget: buckets
    prompt: Ist eine Gerade hier ein gutes Modell?
    params:
      buckets: [{ label: passt }, { label: passt nicht }]
      items:
        - { label: Taxipreis und Strecke, bucket: passt }
        - { label: Stromkosten und Verbrauch, bucket: passt }
        - { label: Bakterien über die Zeit, bucket: passt nicht }
        - { label: Bremsweg und Tempo, bucket: passt nicht }
    hints:
      - Wächst es gleichmäßig oder immer schneller?
    explanation: Exponentielles Wachstum und Quadrate krümmen sich – dort braucht es andere Modelle.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein einziger [[Ausreißer]] kann die Gerade stark kippen. Darum sieht man sich die Daten erst als [[Punktwolke]] an.
      distractors:
        - Mittelwert
        - Tabelle

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Francis Galton fand 1886: Sehr große Väter haben im Schnitt Söhne, die kleiner sind als sie selbst – aber immer noch überdurchschnittlich. Wie nannte er das?"
    params:
      options:
        - label: Regression zur Mitte – daher hat das ganze Verfahren seinen Namen
          correct: true
        - label: Vererbungsfehler
          feedback: Es ist reine Statistik, kein Fehler.
        - label: Degeneration
          feedback: Auch sehr kleine Väter haben im Schnitt größere Söhne.
    hints:
      - Extreme Werte enthalten oft auch Glück.
    explanation: Wo der Zusammenhang nicht perfekt ist, liegen Vorhersagen immer näher am Mittelwert als die Ausgangswerte.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Drei Punkte liegen perfekt auf y = x: (1 | 1), (2 | 2), (3 | 3). Dazu kommt ein Ausreißer (4 | 0). Welche Steigung hat die beste Gerade durch alle vier?"
    answer:
      value: -0.2
    hints:
      - "Mittelwerte: x = 2,5 und y = 1,5. Δx: −1,5; −0,5; 0,5; 1,5."
      - "Δy: −0,5; 0,5; 1,5; −1,5. Σ(Δx · Δy) = −1 und Σ(Δx²) = 5."
    explanation: "−1 : 5 = −0,2. Ein einziger Punkt dreht die Steigung von +1 auf −0,2! Er liegt am Rand, darum hat er so viel Hebel."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Statt quadrierter Abstände kann man auch die **einfachen** Abstände klein machen. Was ist der Vorteil?
    params:
      options:
        - label: Ausreißer ziehen die Gerade weniger stark – die Methode ist robuster
          correct: true
        - label: Sie ist immer genauer
          feedback: Ohne Ausreißer sind kleinste Quadrate meist besser.
        - label: Sie ist leichter zu rechnen
          feedback: "Im Gegenteil: Es gibt keine einfache Formel."
    hints:
      - Ein Abstand von 10 zählt als 10 – oder quadriert als 100.
      - Was bedeutet das für einen Ausreißer?
    explanation: Das ist die **robuste Regression** – das Gegenstück zum Median. Quadrate machen große Abweichungen übermächtig.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was macht eine Regressionsgerade – und wo sind ihre Grenzen?"
    params:
      keywords:
        - - gerade
          - linie
          - line
        - - punkte
          - daten
          - points
          - data
        - - vorhersag
          - schätz
          - predict
          - estimate
        - - grenze
          - außerhalb
          - ausreißer
          - ursache
          - limit
          - outside
          - outlier
          - cause
          - extrapol
      min: 3
      sample: Sie ist die Gerade, die am besten durch eine Punktwolke passt, und erlaubt Vorhersagen aus den Daten. Sie gilt aber nur im gemessenen Bereich, reagiert empfindlich auf Ausreißer und beweist keine Ursache.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Die Einflussgröße x wird mit großem Messfehler erfasst, etwa Kalorien per Fragebogen. Was passiert mit der gemessenen Steigung?
    params:
      options:
        - label: Sie wird zu flach – der Effekt wird unterschätzt
          correct: true
        - label: Sie bleibt im Schnitt richtig
          feedback: Das gilt für Messfehler in y, nicht in x.
        - label: Sie wird zu steil
          feedback: Rauschen in x verdünnt den Zusammenhang.
    hints:
      - Fehler in x verteilen die Punkte waagrecht.
      - Je breiter die Wolke in x, desto flacher die beste Gerade.
    explanation: "Die Steigung schrumpft um den Faktor Var(x) : (Var(x) + Var(Fehler)). Diese **Abschwächung** lässt echte Effekte kleiner erscheinen."
    difficulty: 3

srs:
  cards_from: [kind, wann]
