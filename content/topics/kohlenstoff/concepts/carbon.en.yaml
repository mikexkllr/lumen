id: chem.organic.carbon
type: concept
title: Carbon, the all-rounder
summary: Chains, rings, millions of molecules.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One element, a thousand shapes
    body: "Diamond, pencil lead, plastic and you yourself: **carbon** is in all of them. No other element builds so many shapes. Uncover the cards and marvel at what one element can do."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💎
            front: Diamond and pencil
            back: Both are pure carbon. Only the arrangement of the atoms differs.
          - icon: ⚽
            front: The football
            back: The C₆₀ molecule is made of 60 carbon atoms and looks like a football.
          - icon: 🕸️
            front: Graphene
            back: A single layer of carbon atoms – yet stronger than steel.

  - kind: problem
    id: vielfalt
    widget: choice
    prompt: No element forms as many molecules as carbon. Why?
    params:
      options:
        - { label: It forms four bonds and long chains., correct: true }
        - { label: It is the most common element., feedback: "Hydrogen is far more common." }
        - { label: It is especially heavy., feedback: "Carbon is actually quite light." }
    hints:
      - How many bonds does a C atom form?
    explanation: Four bonds allow chains, branches and rings – almost without limit.

  - kind: explain
    id: s2
    body: |
      **Alkanes** are chains of carbon, surrounded by hydrogen. Their formula is $C_nH_{2n+2}$ – each C carries two H, and the two ends carry one more each.

  - kind: problem
    id: formel
    widget: numeric
    prompt: An alkane has {{n}} C atoms. How many H atoms does it have?
    params: { unit: H atoms }
    answer: { value: "{{2 * n + 2}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: forgot-ends
        text: The two chain ends carry one more H each.
    hints:
      - "2 · {{n}} + 2."
    explanation: "C{{n}}H{{2 * n + 2}}."
    variants:
      params: { n: "int[3,10]" }
      defaults: { n: 4 }

  - kind: problem
    id: ring
    widget: choice
    prompt: What forms when the ends of a carbon chain join?
    params:
      options:
        - { label: A ring, correct: true }
        - { label: A metal, feedback: "It stays a molecule made of carbon – just in a new shape." }
    hints:
      - Think of a chain whose ends meet.
    explanation: Rings like those in benzene or sugar are especially stable.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Carbon forms four bonds.
          right: true
        - text: Organic substances occur only in living things.
          right: false
          why: "Plastics and petrol are organic – “organic” just means: carbon chemistry."
        - text: Methane CH₄ is the simplest alkane.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An alkene has one double bond and the formula $C_nH_{2n}$. How many H atoms does propene with 3 C atoms have?
    answer:
      value: 6
    hints:
      - 2 · 3.
    explanation: C₃H₆ – two H fewer than propane. The double bond takes up two bonding places.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Alkane, alkene or alkyne? Look at the hydrogens.
    params:
      buckets:
        - id: b1
          label: Alkane (single bonds only)
        - id: b2
          label: Alkene (one C=C)
        - id: b3
          label: Alkyne (one C≡C)
      items:
        - label: Ethane C₂H₆
          bucket: b1
        - label: Propane C₃H₈
          bucket: b1
        - label: Ethene C₂H₄
          bucket: b2
        - label: Propene C₃H₆
          bucket: b2
        - label: Ethyne C₂H₂
          bucket: b3
    hints:
      - "Alkanes: CₙH₂ₙ₊₂, alkenes: CₙH₂ₙ, alkynes: CₙH₂ₙ₋₂."
      - Each extra bond between C atoms costs two H.
    explanation: Ethyne is also called acetylene – it burns at over 3000 °C in welding.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: A chain-shaped alkyne has one triple bond and {{n}} C atoms. How many H atoms does it have?
    answer:
      value: "{{2 * n - 2}}"
    feedback:
      - when: numval(state.input) == 2 * n + 2
        misconception: saturated
        text: That would be the alkane. The triple bond costs four H.
    hints:
      - "Alkynes: CₙH₂ₙ₋₂."
      - Work out 2 · {{n}} − 2.
    explanation: 2 · {{n}} − 2 = {{2 * n - 2}} H atoms.
    difficulty: 2
    variants:
      params:
        n: int[2,10]
      defaults:
        n: 4

  - kind: explain
    id: ch-d3
    depth: 2
    body: A C atom with four single bonds points to the four corners of a **tetrahedron**. So an alkane chain is not a straight line but a zigzag – and free to rotate.

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Butane C₄H₁₀ exists as a straight chain and as a branched form. How many different isomers does pentane C₅H₁₂ have?
    answer:
      value: 3
    hints:
      - Straight chain, one branch, two branches on the same C.
    explanation: Three. For C₁₀ there are already 75, for C₂₀ over 366,000 – that is why there are so many organic substances.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Same formula, different connections: these are **isomers**. Their number shoots up with every C atom – decane C₁₀H₂₂ already has 75 isomers."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: How many different chain isomers does hexane C₆H₁₄ have?
    answer:
      value: 5
    hints:
      - Straight chain, then one methyl group at position 2 or 3.
      - "Then two methyl groups: 2,2 and 2,3."
    explanation: Hexane, 2-methylpentane, 3-methylpentane, 2,2-dimethylbutane and 2,3-dimethylbutane. All C₆H₁₄, each with its own boiling point.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Every ring and every double bond costs two H. The number of "degrees of unsaturation" is (2C + 2 − H) ÷ 2. What is it for benzene C₆H₆?
    answer:
      value: 4
    hints:
      - Put in C = 6 and H = 6.
      - (12 + 2 − 6) ÷ 2.
    explanation: 4 = one ring and three double bonds. This is how you guess a molecule's structure from its formula.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: choice
    prompt: But-2-ene CH₃–CH=CH–CH₃ exists in a cis and a trans form. Butane does not. Why?
    params:
      options:
        - label: Nothing can rotate around the double bond – the position of the groups is frozen
          correct: true
        - label: Butane has too few C atoms
          feedback: Both have four C atoms.
        - label: The double bond is longer
          feedback: It is actually shorter – what matters is its rigidity.
    hints:
      - Single bonds can rotate freely.
      - In cis, both CH₃ are on the same side.
    explanation: Such cis/trans pairs have different properties. Trans fats in hardened oils are a well-known, unhealthy example.
    difficulty: 3

srs:
  cards_from: [vielfalt, formel]
