id: chem.organic.carbon
type: concept
title: Carbon, the all-rounder
summary: Chains, rings, millions of molecules.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vielfalt
    widget: choice
    prompt: No element forms as many molecules as carbon. Why?
    params:
      options:
        - { label: It forms four bonds and long chains., correct: true }
        - { label: It is the most common element., feedback: "Hydrogen is far more common." }
        - { label: It is especially heavy., feedback: "Carbon is actually quite light." }
    hints:
      - How many bonds does a C atom form?
    explanation: Four bonds allow chains, branches and rings – almost without limit.

  - kind: explain
    id: s2
    body: |
      **Alkanes** are chains of carbon, surrounded by hydrogen. Their formula is $C_nH_{2n+2}$ – each C carries two H, and the two ends carry one more each.

  - kind: problem
    id: formel
    widget: numeric
    prompt: An alkane has {{n}} C atoms. How many H atoms does it have?
    params: { unit: H atoms }
    answer: { value: "{{2 * n + 2}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: forgot-ends
        text: The two chain ends carry one more H each.
    hints:
      - "2 · {{n}} + 2."
    explanation: "C{{n}}H{{2 * n + 2}}."
    variants:
      params: { n: "int[3,10]" }
      defaults: { n: 4 }

  - kind: problem
    id: ring
    widget: choice
    prompt: What forms when the ends of a carbon chain join?
    params:
      options:
        - { label: A ring, correct: true }
        - { label: A metal, feedback: "It stays a molecule made of carbon – just in a new shape." }
    hints:
      - Think of a chain whose ends meet.
    explanation: Rings like those in benzene or sugar are especially stable.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Carbon forms four bonds.
          right: true
        - text: Organic substances occur only in living things.
          right: false
          why: "Plastics and petrol are organic – “organic” just means: carbon chemistry."
        - text: Methane CH₄ is the simplest alkane.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An alkene has one double bond and the formula $C_nH_{2n}$. How many H atoms does propene with 3 C atoms have?
    answer:
      value: 6
    hints:
      - 2 · 3.
    explanation: C₃H₆ – two H fewer than propane. The double bond takes up two bonding places.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Butane C₄H₁₀ exists as a straight chain and as a branched form. How many different isomers does pentane C₅H₁₂ have?
    answer:
      value: 3
    hints:
      - Straight chain, one branch, two branches on the same C.
    explanation: Three. For C₁₀ there are already 75, for C₂₀ over 366,000 – that is why there are so many organic substances.
    difficulty: 3

srs:
  cards_from: [vielfalt, formel]
