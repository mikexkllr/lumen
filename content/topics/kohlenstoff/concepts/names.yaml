id: chem.organic.names
type: concept
title: Methan, Ethan, Propan
summary: Die Namen verraten die Länge.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Je länger, desto …
    body: "Die Balken zeigen, bei welcher Temperatur Ketten aus Kohlenstoff sieden – von 1 bis 7 C-Atomen. Zieh den letzten Balken: Wo siedet wohl die Kette mit 8 C-Atomen? Erkennst du das **Muster**?"
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - 1 C
          - 2 C
          - 3 C
          - 4 C
          - 5 C
          - 6 C
          - 7 C
          - 8 C
        values:
          - -160
          - -90
          - -40
          - 0
          - 40
          - 70
          - 100
          - -100
        editable:
          - 7
        min: -200
        max: 300
        step: 25
        unit: °C

  - kind: problem
    id: laenge
    widget: match
    prompt: Wie viele Kohlenstoffatome hat die Kette?
    params:
      pairs:
        - { left: Methan, right: "1" }
        - { left: Ethan, right: "2" }
        - { left: Propan, right: "3" }
        - { left: Butan, right: "4" }
    hints:
      - Butan steckt in Feuerzeugen, Methan im Erdgas.
    explanation: Ab fünf zählen griechische Zahlwörter – Pentan, Hexan, Heptan, Octan.

  - kind: problem
    id: octan
    widget: numeric
    prompt: Octan hat 8 C-Atome. Wie viele H-Atome hat es?
    params: { unit: H-Atome }
    answer: { value: 18 }
    hints:
      - "Formel C_nH_{2n+2}."
    explanation: 2 · 8 + 2 = 18 – C₈H₁₈ steckt im Benzin.

  - kind: explain
    id: s3
    body: |
      Kurze **Alkane** sind Gase, mittlere Flüssigkeiten wie Benzin, lange werden fest wie Kerzenwachs. Je länger die Kette, desto stärker haften die Moleküle aneinander.

  - kind: problem
    id: zustand
    widget: order
    prompt: Ordne von gasförmig nach fest.
    params:
      items:
        - { label: Methan im Erdgas }
        - { label: Octan im Benzin }
        - { label: Paraffin im Kerzenwachs }
    hints:
      - Längere Ketten halten fester zusammen.
    explanation: 1 C, 8 C, über 20 C – mit der Kettenlänge steigt der Siedepunkt.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Welches Alkan steckt im Feuerzeug – flüssig unter leichtem Druck, gasförmig beim Öffnen?
    params:
      options:
        - label: Butan (4 C)
          correct: true
        - label: Methan (1 C)
          feedback: Methan lässt sich bei Raumtemperatur nicht verflüssigen.
        - label: Octan (8 C)
          feedback: Octan ist flüssig und verdampft zu langsam.
    hints:
      - Der Siedepunkt muss knapp unter der Raumtemperatur liegen.
    explanation: Butan siedet bei −0,5 °C. Ein wenig Druck hält es flüssig.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: order
    prompt: Alle drei haben die Formel C₅H₁₂. Ordne nach dem Siedepunkt, den höchsten zuerst.
    params:
      items:
        - label: Pentan, gerade Kette (36 °C)
        - label: 2-Methylbutan, einmal verzweigt (28 °C)
        - label: 2,2-Dimethylpropan, kugelig (10 °C)
    hints:
      - Lange Ketten liegen eng aneinander.
      - Je kugeliger, desto weniger Kontaktfläche.
    explanation: "Gleiche Masse, andere Form: Gestreckte Moleküle haben mehr Kontakt und stärkere London-Kräfte."
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Was verrät die Endung »-en« in Propen?
    params:
      options:
        - label: Das Molekül hat eine C=C-Doppelbindung
          correct: true
        - label: Es hat drei C-Atome
          feedback: Das sagt die Vorsilbe »Prop-«.
        - label: Es ist ein Alkohol
          feedback: Alkohole enden auf »-ol«.
    hints:
      - "Vorsilbe: Kettenlänge. Endung: Stoffklasse."
      - "-an, -en, -in: Einfach-, Doppel-, Dreifachbindung."
    explanation: "Propan, Propen, Propin: drei C, aber verschiedene Bindungen. Die Namen sind ein Baukasten."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: 2,2,4-Trimethylpentan heißt auch Isooctan. Es ist das Maß für Oktanzahl 100. Wie viele C-Atome hat es?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 5
        misconception: branches-ignored
        text: Die drei Methylgruppen bringen je ein C mit.
      - when: numval(state.input) == 3
        misconception: chain-ignored
        text: Pentan ist die Hauptkette mit fünf C.
    hints:
      - "Pentan: 5 C. Trimethyl: drei CH₃."
      - 5 + 3.
    explanation: 5 + 3 = 8 C – darum »Iso-Octan«. Seine verzweigte Form zündet kaum von selbst.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Benzin hat eine Oktanzahl. Was misst sie?
    params:
      options:
        - label: Wie gut der Kraftstoff ungewolltem Selbstentzünden (Klopfen) widersteht
          correct: true
        - label: Wie viel Energie im Liter steckt
          feedback: Der Energiegehalt ist fast gleich.
        - label: Wie viele Octan-Moleküle enthalten sind
          feedback: Es ist eine Vergleichsskala, kein Gehalt.
    hints:
      - Verzweigte Ketten brennen kontrollierter als gerade.
    explanation: Das verzweigte Isooctan setzt die 100, das gerade Heptan die 0. Struktur bestimmt das Verhalten.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "So benennt man verzweigte Alkane: Suche die **längste Kette**. Nummeriere sie so, dass die Seitenketten kleine Zahlen bekommen. Dann stelle die Seitenketten mit Platznummer davor."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Jemand nennt einen Stoff »1-Methylbutan«. Was ist falsch?
    params:
      options:
        - label: Die Methylgruppe am Ende verlängert die Kette – es ist einfach Pentan
          correct: true
        - label: Die Nummer muss 4 heißen
          feedback: Auch 4-Methylbutan wäre nur Pentan.
        - label: Nichts – der Name ist korrekt
          feedback: Die längste Kette hat fünf C-Atome.
    hints:
      - Zeichne die Kette auf.
      - Ein CH₃ an C1 ist einfach C5.
    explanation: Seitenketten können nie an Platz 1 sitzen – sonst gehören sie zur Hauptkette.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Wie viele H-Atome hat 2,2,4-Trimethylpentan C₈H₁₈? Prüfe mit der Alkan-Formel.
    answer:
      value: 18
    hints:
      - Verzweigte Alkane folgen auch CₙH₂ₙ₊₂.
      - 2 · 8 + 2.
    explanation: 18 H – genau wie gerades Octan. Isomere haben dieselbe Formel, nur eine andere Form.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was die Teile des Namens »2-Methylbutan« bedeuten.
    params:
      keywords:
        - - but
          - vier
          - four
        - - methyl
          - ch₃
          - ch3
          - seitenkette
          - side chain
          - branch
        - - zwei
          - two
          - platz
          - position
          - second
          - zweite
      sample: Butan ist die Hauptkette mit vier C-Atomen. Methyl ist eine Seitenkette CH₃. Die 2 sagt, dass sie am zweiten C-Atom der Kette hängt.
    explanation: Platz, Seitenkette, Hauptkette – in dieser Reihenfolge.
    difficulty: 3

srs:
  cards_from: [laenge, zustand]
