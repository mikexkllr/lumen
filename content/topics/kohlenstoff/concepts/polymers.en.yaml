id: chem.organic.polymers
type: concept
title: Plastics
summary: Giant chains from small building blocks.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many years does a plastic bottle take to break down in the sea?"
    params:
      min: 1
      max: 2000
    answer:
      value: 450
      tolerance: 150
    explanation: About 450 years. The long chains are very stable.

  - kind: explain
    id: s1
    body: |
      Plastics are **polymers**: thousands of small building blocks, the **monomers**, link into long chains. Ethene becomes polyethylene – the bag from the supermarket.

  - kind: problem
    id: kette
    widget: numeric
    prompt: A polyethylene chain consists of {{n}} ethene units with 2 carbon atoms each. How many C atoms does it have?
    params: { unit: C atoms }
    answer: { value: "{{2 * n}}" }
    hints:
      - Each unit brings two.
    explanation: "{{n}} · 2 = {{2 * n}} carbon atoms in one chain."
    variants:
      params: { n: "choice[500,1000,2500,5000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: verrotten
    widget: choice
    prompt: Why does plastic in the sea hardly rot?
    params:
      options:
        - { label: Hardly any organism can break down the long chains., correct: true }
        - { label: It is too heavy., feedback: "A lot of plastic even floats – the problem is the chemistry." }
    hints:
      - What breaks down wood and leaves?
    explanation: Bacteria and fungi have no tools for these young molecular chains.

  - kind: problem
    id: natur
    widget: buckets
    prompt: Natural or synthetic polymer?
    params:
      buckets: [{ label: natural }, { label: synthetic }]
      items:
        - { label: Starch, bucket: natural }
        - { label: Silk, bucket: natural }
        - { label: Nylon, bucket: synthetic }
        - { label: PET bottle, bucket: synthetic }
    hints:
      - What does nature make by itself?
    explanation: Starch and silk are long chains too – nature built polymers first.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Why does a PET bottle soften when heated while a car tyre does not?
    params:
      options:
        - label: In the tyre the chains are firmly cross-linked
          correct: true
        - label: The tyre is thicker
          feedback: Even a thin piece of rubber does not melt.
        - label: PET is not a polymer
          feedback: Both are polymers.
    hints:
      - Loose chains can slide past each other. Linked ones cannot.
    explanation: "**Thermoplastics** can be melted down and recycled. Cross-linked **elastomers** and **thermosets** cannot."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Polypropylene is built from propene C₃H₆ (42 g/mol). A chain has {{42 * n}} g/mol. How many building blocks does it have?
    answer:
      value: "{{n}}"
    hints:
      - Divide the chain mass by the mass of one building block.
      - Work out {{42 * n}} ÷ 42.
    explanation: "{{42 * n}} ÷ 42 = {{n}} building blocks. This is called the degree of polymerisation."
    difficulty: 2
    variants:
      params:
        n: step[1000,9000,1000]
      defaults:
        n: 2000

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: How is the plastic made? In polymerisation, double bonds open up. In condensation, water is split off.
    params:
      buckets:
        - id: b1
          label: Polymerisation
        - id: b2
          label: Condensation
      items:
        - label: Polyethylene (PE)
          bucket: b1
        - label: Polypropylene (PP)
          bucket: b1
        - label: PVC
          bucket: b1
        - label: Polystyrene (PS)
          bucket: b1
        - label: PET bottle
          bucket: b2
        - label: Nylon
          bucket: b2
    hints:
      - Building blocks with C=C can simply be strung together.
      - PET is a polyester, nylon a polyamide.
    explanation: "Polyesters and polyamides form like esters: acid plus alcohol or amine, with water given off. Proteins are polyamides too."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: LDPE films are soft, HDPE canisters are stiff. Both are polyethylene. What makes the difference?
    params:
      options:
        - label: LDPE chains are heavily branched and pack more loosely
          correct: true
        - label: HDPE contains metal
          feedback: Both are made of only C and H.
        - label: LDPE is a different element
          feedback: It is the same polymer.
    hints:
      - L stands for low density, H for high density.
      - Straight chains lie close and orderly.
    explanation: Unbranched chains form ordered, crystalline regions – which makes HDPE denser and stiffer.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A polyethylene chain has a molar mass of 280,000 g/mol. One ethene unit C₂H₄ weighs 28 g/mol. How many units make up the chain?
    answer:
      value: 10000
    hints:
      - 280,000 ÷ 28.
    explanation: 10,000 units – stretched out the chain would still be only 2.5 micrometres long.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Polyethylene forms through a **chain reaction**: a radical with an unpaired electron opens the double bond of an ethene. The chain end becomes a radical itself and attacks the next ethene."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: order
    prompt: Order the steps of radical polymerisation.
    params:
      items:
        - label: An initiator breaks into radicals
        - label: A radical opens a C=C bond
        - label: The chain grows block by block
        - label: Two radicals meet and the chain stops
    hints:
      - Start, growth, termination.
      - Only when two unpaired electrons pair up does it end.
    explanation: A single starting radical can link thousands of building blocks this way – in a fraction of a second.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Polyethylene is made of CH₂ units (14 g/mol). How many kilograms of CO₂ (44 g/mol) form when 1 kg of PE burns? Give two decimal places.
    answer:
      value: 3.14
      tolerance: 0.01
    hints:
      - Each CH₂ unit gives one CO₂.
      - Work out 44 ÷ 14.
    explanation: About 3.14 kg of CO₂ per kg of plastic. Burning recovers energy but releases fossil carbon.
    difficulty: 3

srs:
  cards_from: [kette, verrotten]
