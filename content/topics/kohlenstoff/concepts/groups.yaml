id: chem.organic.groups
type: concept
title: Funktionelle Gruppen
summary: Kleine Anhängsel, großer Charakter.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ethan ist ein brennbares Gas. Hängt man ein O und ein H an, wird daraus eine bekannte Flüssigkeit. Welche?
    params:
      options:
        - label: Alkohol
          correct: true
        - label: Wasser
          feedback: Wasser enthält keinen Kohlenstoff.
        - label: Speiseöl
          feedback: Öl-Moleküle sind viel größer.
    hints:
      - Sie steckt in Wein und Bier.
    explanation: Eine kleine Gruppe ändert das ganze Verhalten.

  - kind: explain
    id: s1
    body: |
      Eine **funktionelle Gruppe** ist ein kleines Atom-Ensemble an der Kette, das ihr Verhalten bestimmt. Eine OH-Gruppe macht aus Ethan den Alkohol **Ethanol**.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Welche Gruppe steckt im Stoff?
    params:
      pairs:
        - { left: "–OH", right: Ethanol }
        - { left: "–COOH", right: Essigsäure }
        - { left: "–NH₂", right: Aminosäuren }
    hints:
      - COOH macht Stoffe sauer.
    explanation: Die Säuregruppe COOH gibt leicht ein H⁺ ab – darum ist Essig sauer.

  - kind: problem
    id: loeslich
    widget: choice
    prompt: Ethanol mischt sich mit Wasser, Ethan nicht. Warum?
    params:
      options:
        - { label: Die OH-Gruppe ist polar wie Wasser., correct: true }
        - { label: Ethanol ist schwerer., feedback: "Es liegt nicht am Gewicht, sondern an der Polarität." }
    hints:
      - Erinnere dich – gleiches löst sich in gleichem.
    explanation: Die OH-Gruppe bildet Wasserstoffbrücken zum Wasser.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Alkohol oder Säure?
    params:
      buckets: [{ label: Alkohol }, { label: Säure }]
      items:
        - { label: Ethanol, bucket: Alkohol }
        - { label: Glycerin, bucket: Alkohol }
        - { label: Essigsäure, bucket: Säure }
        - { label: Zitronensäure, bucket: Säure }
    hints:
      - Namen mit »-säure« verraten es.
    explanation: Alkohole tragen OH-Gruppen, organische Säuren COOH-Gruppen.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Eine [[funktionelle Gruppe]] bestimmt das Verhalten eines Moleküls. Die OH-Gruppe macht aus Ethan den Alkohol [[Ethanol]].
      distractors:
        - lange Kette
        - Methan

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Alkohol und eine Säure reagieren zu einem Stoff, der nach Früchten duftet. Wie heißt diese Stoffklasse?
    params:
      options:
        - label: Ester
          correct: true
        - label: Alkane
          feedback: Die riechen nach Benzin, nicht nach Banane.
        - label: Salze
          feedback: Salze entstehen aus Säure und Base.
    hints:
      - Bananen-, Ananas- und Birnenaroma gehören dazu.
    explanation: Bei der **Veresterung** wird Wasser abgespalten. Auch Fette sind Ester.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Zu welcher Stoffklasse gehört der Stoff?
    params:
      buckets:
        - id: b1
          label: Alkohol (–OH)
        - id: b2
          label: Carbonsäure (–COOH)
        - id: b3
          label: Ester (–COO–)
        - id: b4
          label: Keton (C=O mittig)
      items:
        - label: Ethanol
          bucket: b1
        - label: Glycerin
          bucket: b1
        - label: Essigsäure
          bucket: b2
        - label: Zitronensäure
          bucket: b2
        - label: Ethylacetat (Nagellack-Entferner)
          bucket: b3
        - label: Aceton
          bucket: b4
    hints:
      - Die Endung -säure verrät die Carbonsäure.
      - Ester heißen oft »…acetat«.
    explanation: Aceton ist das einfachste Keton. Viele Nagellack-Entferner enthalten Aceton oder den Ester Ethylacetat.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: order
    prompt: Wein wird an der Luft zu Essig. Ordne die Stoffe, wie sie nacheinander entstehen.
    params:
      items:
        - label: Ethanol (Alkohol)
        - label: Ethanal (Aldehyd)
        - label: Essigsäure (Carbonsäure)
    hints:
      - Jeder Schritt ist eine Oxidation.
      - Der Aldehyd liegt in der Mitte.
    explanation: Bakterien oxidieren den Alkohol über den Aldehyd zur Säure. Die Oxidationszahl des C steigt von −1 über +1 auf +3.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: tiles
    prompt: Essigsäure und Ethanol bilden einen Ester und Wasser. Lege die Gleichung.
    params:
      tiles:
        - CH₃COOH
        - C₂H₅OH
        - +
        - +
        - ⇌
        - CH₃COOC₂H₅
        - H₂O
        - CO₂
    answer:
      anyOf:
        - - CH₃COOH
          - +
          - C₂H₅OH
          - ⇌
          - CH₃COOC₂H₅
          - +
          - H₂O
        - - C₂H₅OH
          - +
          - CH₃COOH
          - ⇌
          - CH₃COOC₂H₅
          - +
          - H₂O
        - - CH₃COOH
          - +
          - C₂H₅OH
          - ⇌
          - H₂O
          - +
          - CH₃COOC₂H₅
        - - C₂H₅OH
          - +
          - CH₃COOH
          - ⇌
          - H₂O
          - +
          - CH₃COOC₂H₅
    hints:
      - Säure plus Alkohol ergibt Ester plus Wasser.
      - "Der Ester enthält beide Reste: CH₃COO und C₂H₅."
    explanation: "Das ist eine Kondensation: Es wird Wasser abgespalten. Der Doppelpfeil zeigt, dass ein Gleichgewicht entsteht."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die linke und die rechte Hand sind Spiegelbilder, aber nicht deckungsgleich. Warum ist das für Medikamente wichtig?
    params:
      options:
        - label: Auch Moleküle gibt es in zwei Spiegelformen – der Körper unterscheidet sie
          correct: true
        - label: Tabletten müssen symmetrisch sein
          feedback: Es geht um die Form der Moleküle, nicht der Tablette.
        - label: Es ist nicht wichtig
          feedback: Eine Spiegelform kann heilen, die andere schaden.
    hints:
      - Ein Handschuh passt nur auf eine Hand.
    explanation: "**Chiralität**: Enzyme sind selbst »händig«. Bei Contergan wirkte eine Form beruhigend, die andere schädigte Embryonen."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Viele Reaktionen folgen einem Muster: Ein elektronenreiches Teilchen, das **Nucleophil**, greift ein C-Atom mit δ+ an. Dafür verlässt eine andere Gruppe das Molekül. Das ist eine Substitution."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: order
    prompt: Brommethan reagiert mit OH⁻ zu Methanol. Ordne den Ablauf dieser SN2-Reaktion.
    params:
      items:
        - label: OH⁻ nähert sich dem C von hinten
        - label: Kurz hat das C fünf Partner halb gebunden
        - label: Br⁻ löst sich ab
        - label: Methanol ist da, die Form ist umgeklappt
    hints:
      - Das C trägt δ+, weil Br stärker zieht.
      - Angriff und Ablösung passieren in einem einzigen Schritt.
    explanation: Bindung bilden und lösen geschehen gleichzeitig. Das Molekül klappt dabei um wie ein Regenschirm im Wind.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: In Butan-2-ol CH₃–CH(OH)–CH₂–CH₃ ist ein C-Atom ein Stereozentrum mit zwei Spiegelformen. Welches?
    params:
      options:
        - label: C2, das die OH-Gruppe trägt
          correct: true
        - label: C1
          feedback: Das trägt drei gleiche H-Atome.
        - label: C3
          feedback: Das trägt zwei gleiche H-Atome.
    hints:
      - Ein Stereozentrum braucht vier verschiedene Partner.
      - C2 trägt H, OH, CH₃ und C₂H₅.
    explanation: Vier verschiedene Partner – dann gibt es Bild und Spiegelbild, die nicht deckungsgleich sind. Wie linke und rechte Hand.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was eine funktionelle Gruppe ist und warum sie so wichtig ist.
    params:
      keywords:
        - - gruppe
          - group
          - oh
          - cooh
        - - eigenschaft
          - verhalten
          - reaktion
          - property
          - behav
          - react
        - - kette
          - chain
          - molekül
          - molecule
          - rest
      sample: Eine funktionelle Gruppe ist ein kleiner Teil eines Moleküls, etwa OH oder COOH. Sie bestimmt Eigenschaften und Reaktionen, egal wie lang die Kette dahinter ist.
    explanation: Die Kette ist das Gerüst, die Gruppe der Charakter.
    difficulty: 3

srs:
  cards_from: [zuordnen, loeslich]
