id: chem.organic.names
type: concept
title: Methane, ethane, propane
summary: The names reveal the length.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: laenge
    widget: match
    prompt: How many carbon atoms does the chain have?
    params:
      pairs:
        - { left: Methane, right: "1" }
        - { left: Ethane, right: "2" }
        - { left: Propane, right: "3" }
        - { left: Butane, right: "4" }
    hints:
      - Butane is in lighters, methane in natural gas.
    explanation: From five on, Greek number words count – pentane, hexane, heptane, octane.

  - kind: problem
    id: octan
    widget: numeric
    prompt: Octane has 8 C atoms. How many H atoms does it have?
    params: { unit: H atoms }
    answer: { value: 18 }
    hints:
      - "Formula C_nH_{2n+2}."
    explanation: 2 · 8 + 2 = 18 – C₈H₁₈ is in gasoline.

  - kind: explain
    id: s3
    body: |
      Short **alkanes** are gases, medium ones are liquids like gasoline, and long ones turn solid like candle wax. The longer the chain, the more strongly the molecules stick together.

  - kind: problem
    id: zustand
    widget: order
    prompt: Sort from gas to solid.
    params:
      items:
        - { label: Methane in natural gas }
        - { label: Octane in gasoline }
        - { label: Paraffin in candle wax }
    hints:
      - Longer chains hold together more firmly.
    explanation: 1 C, 8 C, over 20 C – the boiling point rises with chain length.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which alkane is in a lighter – liquid under slight pressure, gaseous when released?
    params:
      options:
        - label: Butane (4 C)
          correct: true
        - label: Methane (1 C)
          feedback: Methane cannot be liquefied at room temperature.
        - label: Octane (8 C)
          feedback: Octane is liquid and evaporates too slowly.
    hints:
      - The boiling point must lie just below room temperature.
    explanation: Butane boils at −0.5 °C. A little pressure keeps it liquid.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: order
    prompt: All three have the formula C₅H₁₂. Order by boiling point, highest first.
    params:
      items:
        - label: Pentane, straight chain (36 °C)
        - label: 2-Methylbutane, branched once (28 °C)
        - label: 2,2-Dimethylpropane, ball-shaped (10 °C)
    hints:
      - Long chains lie close together.
      - The more ball-shaped, the less contact area.
    explanation: "Same mass, different shape: stretched-out molecules have more contact and stronger London forces."
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: What does the ending "-ene" in propene tell you?
    params:
      options:
        - label: The molecule has a C=C double bond
          correct: true
        - label: It has three C atoms
          feedback: That is what the prefix "prop-" says.
        - label: It is an alcohol
          feedback: Alcohols end in "-ol".
    hints:
      - "Prefix: chain length. Ending: class of compound."
      - "-ane, -ene, -yne: single, double, triple bond."
    explanation: "Propane, propene, propyne: three C each, but different bonds. The names are a construction kit."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: 2,2,4-Trimethylpentane is also called isooctane. It defines octane rating 100. How many C atoms does it have?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 5
        misconception: branches-ignored
        text: The three methyl groups each bring one C.
      - when: numval(state.input) == 3
        misconception: chain-ignored
        text: Pentane is the main chain with five C.
    hints:
      - "Pentane: 5 C. Trimethyl: three CH₃."
      - 5 + 3.
    explanation: 5 + 3 = 8 C – hence "iso-octane". Its branched shape hardly ignites on its own.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Petrol has an octane rating. What does it measure?
    params:
      options:
        - label: How well the fuel resists unwanted self-ignition (knocking)
          correct: true
        - label: How much energy a litre contains
          feedback: The energy content is almost the same.
        - label: How many octane molecules it contains
          feedback: It is a comparison scale, not a content.
    hints:
      - Branched chains burn in a more controlled way than straight ones.
    explanation: Branched isooctane sets 100, straight heptane 0. Structure determines behaviour.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "How to name branched alkanes: find the **longest chain**. Number it so the side chains get low numbers. Then put the side chains, with their positions, in front."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Someone calls a compound "1-methylbutane". What is wrong?
    params:
      options:
        - label: A methyl group at the end lengthens the chain – it is simply pentane
          correct: true
        - label: The number should be 4
          feedback: 4-methylbutane would also just be pentane.
        - label: Nothing – the name is correct
          feedback: The longest chain has five C atoms.
    hints:
      - Draw out the chain.
      - A CH₃ on C1 is simply C5.
    explanation: Side chains can never sit at position 1 – otherwise they belong to the main chain.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: How many H atoms does 2,2,4-trimethylpentane have? Check it with the alkane formula.
    answer:
      value: 18
    hints:
      - Branched alkanes also follow CₙH₂ₙ₊₂.
      - 2 · 8 + 2.
    explanation: 18 H – just like straight octane. Isomers share a formula, only the shape differs.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what the parts of the name "2-methylbutane" mean.
    params:
      keywords:
        - - but
          - vier
          - four
        - - methyl
          - ch₃
          - ch3
          - seitenkette
          - side chain
          - branch
        - - zwei
          - two
          - platz
          - position
          - second
          - zweite
      sample: Butane is the main chain with four C atoms. Methyl is a CH₃ side chain. The 2 says it hangs on the second C atom of the chain.
    explanation: Position, side chain, main chain – in that order.
    difficulty: 3

srs:
  cards_from: [laenge, zustand]
