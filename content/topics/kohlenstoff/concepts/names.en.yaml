id: chem.organic.names
type: concept
title: Methane, ethane, propane
summary: The names reveal the length.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: laenge
    widget: match
    prompt: How many carbon atoms does the chain have?
    params:
      pairs:
        - { left: Methane, right: "1" }
        - { left: Ethane, right: "2" }
        - { left: Propane, right: "3" }
        - { left: Butane, right: "4" }
    hints:
      - Butane is in lighters, methane in natural gas.
    explanation: From five on, Greek number words count – pentane, hexane, heptane, octane.

  - kind: problem
    id: octan
    widget: numeric
    prompt: Octane has 8 C atoms. How many H atoms does it have?
    params: { unit: H atoms }
    answer: { value: 18 }
    hints:
      - "Formula C_nH_{2n+2}."
    explanation: 2 · 8 + 2 = 18 – C₈H₁₈ is in gasoline.

  - kind: explain
    id: s3
    body: |
      Short alkanes are gases, medium ones are liquids like gasoline, and long ones turn solid like candle wax. The longer the chain, the more strongly the molecules stick together.

  - kind: problem
    id: zustand
    widget: order
    prompt: Sort from gas to solid.
    params:
      items:
        - { label: Methane in natural gas }
        - { label: Octane in gasoline }
        - { label: Paraffin in candle wax }
    hints:
      - Longer chains hold together more firmly.
    explanation: 1 C, 8 C, over 20 C – the boiling point rises with chain length.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which alkane is in a lighter – liquid under slight pressure, gaseous when released?
    params:
      options:
        - label: Butane (4 C)
          correct: true
        - label: Methane (1 C)
          feedback: Methane cannot be liquefied at room temperature.
        - label: Octane (8 C)
          feedback: Octane is liquid and evaporates too slowly.
    hints:
      - The boiling point must lie just below room temperature.
    explanation: Butane boils at −0.5 °C. A little pressure keeps it liquid.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Petrol has an octane rating. What does it measure?
    params:
      options:
        - label: How well the fuel resists unwanted self-ignition (knocking)
          correct: true
        - label: How much energy a litre contains
          feedback: The energy content is almost the same.
        - label: How many octane molecules it contains
          feedback: It is a comparison scale, not a content.
    hints:
      - Branched chains burn in a more controlled way than straight ones.
    explanation: Branched isooctane sets 100, straight heptane 0. Structure determines behaviour.
    difficulty: 3

srs:
  cards_from: [laenge, zustand]
