id: chem.organic.carbon
type: concept
title: Der Alleskönner Kohlenstoff
summary: Ketten, Ringe, Millionen Moleküle.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Element, tausend Formen
    body: "Diamant, Bleistiftmine, Plastik und du selbst: Überall steckt **Kohlenstoff**. Kein anderes Element baut so viele Formen. Deck die Karten auf und staune, was ein einziges Element kann."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💎
            front: Diamant und Bleistift
            back: Beide sind reiner Kohlenstoff. Nur die Anordnung der Atome unterscheidet sie.
          - icon: ⚽
            front: Der Fußball
            back: Das Molekül C₆₀ besteht aus 60 Kohlenstoffatomen und sieht aus wie ein Fußball.
          - icon: 🕸️
            front: Graphen
            back: Eine einzige Lage Kohlenstoffatome – und doch stärker als Stahl.

  - kind: problem
    id: vielfalt
    widget: choice
    prompt: Kein Element bildet so viele Moleküle wie Kohlenstoff. Warum?
    params:
      options:
        - { label: Er bildet vier Bindungen und lange Ketten., correct: true }
        - { label: Er ist das häufigste Element., feedback: "Wasserstoff ist viel häufiger." }
        - { label: Er ist besonders schwer., feedback: "Kohlenstoff ist sogar recht leicht." }
    hints:
      - Wie viele Bindungen bildet ein C-Atom?
    explanation: Vier Bindungen erlauben Ketten, Äste und Ringe – fast ohne Grenze.

  - kind: explain
    id: s2
    body: |
      **Alkane** sind Ketten aus Kohlenstoff, rundherum mit Wasserstoff besetzt. Ihre Formel ist $C_nH_{2n+2}$ – jedes C trägt zwei H, die beiden Enden je eins mehr.

  - kind: problem
    id: formel
    widget: numeric
    prompt: Ein Alkan hat {{n}} C-Atome. Wie viele H-Atome hat es?
    params: { unit: H-Atome }
    answer: { value: "{{2 * n + 2}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: forgot-ends
        text: Die beiden Kettenenden tragen je ein H mehr.
    hints:
      - "2 · {{n}} + 2."
    explanation: "C{{n}}H{{2 * n + 2}}."
    variants:
      params: { n: "int[3,10]" }
      defaults: { n: 4 }

  - kind: problem
    id: ring
    widget: choice
    prompt: Was entsteht, wenn sich die Enden einer Kohlenstoffkette verbinden?
    params:
      options:
        - { label: Ein Ring, correct: true }
        - { label: Ein Metall, feedback: "Es bleibt ein Molekül aus Kohlenstoff – nur in neuer Form." }
    hints:
      - Denk an eine Kette, deren Enden sich treffen.
    explanation: Ringe wie im Benzol oder im Zucker sind besonders stabil.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Kohlenstoff bildet vier Bindungen.
          right: true
        - text: Organische Stoffe kommen nur in Lebewesen vor.
          right: false
          why: "Kunststoffe und Benzin sind organisch – »organisch« heißt nur: Kohlenstoffchemie."
        - text: Methan CH₄ ist das einfachste Alkan.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Alken hat eine Doppelbindung und die Formel $C_nH_{2n}$. Wie viele H-Atome hat Propen mit 3 C-Atomen?
    answer:
      value: 6
    hints:
      - 2 · 3.
    explanation: C₃H₆ – zwei H weniger als Propan. Die Doppelbindung besetzt zwei Bindungsplätze.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Alkan, Alken oder Alkin? Achte auf die Wasserstoffe.
    params:
      buckets:
        - id: b1
          label: Alkan (nur Einfachbindungen)
        - id: b2
          label: Alken (eine C=C)
        - id: b3
          label: Alkin (eine C≡C)
      items:
        - label: Ethan C₂H₆
          bucket: b1
        - label: Propan C₃H₈
          bucket: b1
        - label: Ethen C₂H₄
          bucket: b2
        - label: Propen C₃H₆
          bucket: b2
        - label: Ethin C₂H₂
          bucket: b3
    hints:
      - "Alkane: CₙH₂ₙ₊₂, Alkene: CₙH₂ₙ, Alkine: CₙH₂ₙ₋₂."
      - Jede weitere Bindung zwischen C-Atomen kostet zwei H.
    explanation: Ethin heißt auch Acetylen – es brennt beim Schweißen über 3000 °C heiß.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein kettenförmiges Alkin hat eine Dreifachbindung und {{n}} C-Atome. Wie viele H-Atome hat es?
    answer:
      value: "{{2 * n - 2}}"
    feedback:
      - when: numval(state.input) == 2 * n + 2
        misconception: saturated
        text: Das wäre das Alkan. Die Dreifachbindung kostet vier H.
    hints:
      - "Alkine: CₙH₂ₙ₋₂."
      - Rechne 2 · {{n}} − 2.
    explanation: 2 · {{n}} − 2 = {{2 * n - 2}} H-Atome.
    difficulty: 2
    variants:
      params:
        n: int[2,10]
      defaults:
        n: 4

  - kind: explain
    id: ch-d3
    depth: 2
    body: Ein C-Atom mit vier Einfachbindungen zeigt in die vier Ecken eines **Tetraeders**. Darum ist eine Alkankette keine gerade Linie, sondern ein Zickzack – und frei drehbar.

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Butan C₄H₁₀ gibt es als gerade Kette und als verzweigte Form. Wie viele verschiedene Isomere hat Pentan C₅H₁₂?
    answer:
      value: 3
    hints:
      - Gerade Kette, eine Verzweigung, zwei Verzweigungen am selben C.
    explanation: Drei. Bei C₁₀ sind es schon 75, bei C₂₀ über 366 000 – darum gibt es so viele organische Stoffe.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Gleiche Formel, andere Verknüpfung: Das sind **Isomere**. Mit jedem C-Atom wächst ihre Zahl rasant – Decan C₁₀H₂₂ hat schon 75 Isomere."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: Wie viele verschiedene Ketten-Isomere hat Hexan C₆H₁₄?
    answer:
      value: 5
    hints:
      - Gerade Kette, dann eine Methylgruppe an Platz 2 oder 3.
      - "Dann zwei Methylgruppen: 2,2 und 2,3."
    explanation: Hexan, 2-Methylpentan, 3-Methylpentan, 2,2-Dimethylbutan und 2,3-Dimethylbutan. Alle C₆H₁₄, alle mit eigenem Siedepunkt.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: "Jeder Ring und jede Doppelbindung kostet zwei H. Die Zahl der »Ungesättigtheiten« ist (2C + 2 − H) : 2. Wie groß ist sie für Benzol C₆H₆?"
    answer:
      value: 4
    hints:
      - Setze C = 6 und H = 6 ein.
      - "(12 + 2 − 6) : 2."
    explanation: 4 = ein Ring und drei Doppelbindungen. So rät man aus einer Summenformel, wie ein Molekül gebaut sein kann.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: choice
    prompt: Von But-2-en CH₃–CH=CH–CH₃ gibt es eine cis- und eine trans-Form. Beim Butan gibt es das nicht. Warum?
    params:
      options:
        - label: Um die Doppelbindung kann sich nichts drehen – die Lage der Gruppen ist eingefroren
          correct: true
        - label: Butan hat zu wenige C-Atome
          feedback: Beide haben vier C-Atome.
        - label: Die Doppelbindung ist länger
          feedback: Sie ist sogar kürzer – entscheidend ist die Starrheit.
    hints:
      - Einfachbindungen sind frei drehbar.
      - Bei cis stehen beide CH₃ auf derselben Seite.
    explanation: Solche cis/trans-Paare haben verschiedene Eigenschaften. Trans-Fette in gehärteten Ölen sind ein bekanntes, ungesundes Beispiel.
    difficulty: 3

srs:
  cards_from: [vielfalt, formel]
