id: chem.organic.carbon
type: concept
title: Der Alleskönner Kohlenstoff
summary: Ketten, Ringe, Millionen Moleküle.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vielfalt
    widget: choice
    prompt: Kein Element bildet so viele Moleküle wie Kohlenstoff. Warum?
    params:
      options:
        - { label: Er bildet vier Bindungen und lange Ketten., correct: true }
        - { label: Er ist das häufigste Element., feedback: "Wasserstoff ist viel häufiger." }
        - { label: Er ist besonders schwer., feedback: "Kohlenstoff ist sogar recht leicht." }
    hints:
      - Wie viele Bindungen bildet ein C-Atom?
    explanation: Vier Bindungen erlauben Ketten, Äste und Ringe – fast ohne Grenze.

  - kind: explain
    id: s2
    body: |
      **Alkane** sind Ketten aus Kohlenstoff, rundherum mit Wasserstoff besetzt. Ihre Formel ist $C_nH_{2n+2}$ – jedes C trägt zwei H, die beiden Enden je eins mehr.

  - kind: problem
    id: formel
    widget: numeric
    prompt: Ein Alkan hat {{n}} C-Atome. Wie viele H-Atome hat es?
    params: { unit: H-Atome }
    answer: { value: "{{2 * n + 2}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: forgot-ends
        text: Die beiden Kettenenden tragen je ein H mehr.
    hints:
      - "2 · {{n}} + 2."
    explanation: "C{{n}}H{{2 * n + 2}}."
    variants:
      params: { n: "int[3,10]" }
      defaults: { n: 4 }

  - kind: problem
    id: ring
    widget: choice
    prompt: Was entsteht, wenn sich die Enden einer Kohlenstoffkette verbinden?
    params:
      options:
        - { label: Ein Ring, correct: true }
        - { label: Ein Metall, feedback: "Es bleibt ein Molekül aus Kohlenstoff – nur in neuer Form." }
    hints:
      - Denk an eine Kette, deren Enden sich treffen.
    explanation: Ringe wie im Benzol oder im Zucker sind besonders stabil.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Kohlenstoff bildet vier Bindungen.
          right: true
        - text: Organische Stoffe kommen nur in Lebewesen vor.
          right: false
          why: "Kunststoffe und Benzin sind organisch – »organisch« heißt nur: Kohlenstoffchemie."
        - text: Methan CH₄ ist das einfachste Alkan.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Alken hat eine Doppelbindung und die Formel $C_nH_{2n}$. Wie viele H-Atome hat Propen mit 3 C-Atomen?
    answer:
      value: 6
    hints:
      - 2 · 3.
    explanation: C₃H₆ – zwei H weniger als Propan. Die Doppelbindung besetzt zwei Bindungsplätze.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Butan C₄H₁₀ gibt es als gerade Kette und als verzweigte Form. Wie viele verschiedene Isomere hat Pentan C₅H₁₂?
    answer:
      value: 3
    hints:
      - Gerade Kette, eine Verzweigung, zwei Verzweigungen am selben C.
    explanation: Drei. Bei C₁₀ sind es schon 75, bei C₂₀ über 366 000 – darum gibt es so viele organische Stoffe.
    difficulty: 3

srs:
  cards_from: [vielfalt, formel]
