id: chem.organic.polymers
type: concept
title: Kunststoffe
summary: Riesenketten aus kleinen Bausteinen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Vom Öl zur Tüte
    body: Eine Plastiktüte hat eine lange Geschichte – sie beginnt tief in der Erde. Deck die Stationen der Reihe nach auf und verfolge, wie aus kleinen Bausteinen ein **Polymer** wird.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🛢️
            front: Erdöl
            back: Am Anfang steht ein dunkles Gemisch aus Resten, die Millionen Jahre alt sind.
          - icon: 🔥
            front: Cracken
            back: Hitze zerbricht lange Moleküle. Dabei entsteht das kleine Gas Ethen.
          - icon: 🔗
            front: Ketten knüpfen
            back: Tausende Ethen-Moleküle hängen sich aneinander – eine Riesenkette entsteht.
          - icon: 🛍️
            front: Die Tüte
            back: Aus den Ketten wird Folie geblasen. Benutzt wird die Tüte im Schnitt nur rund 25 Minuten.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Jahre braucht eine Plastikflasche, bis sie im Meer zerfallen ist?"
    params:
      min: 1
      max: 2000
    answer:
      value: 450
      tolerance: 150
    explanation: Rund 450 Jahre. Die langen Ketten sind sehr stabil.

  - kind: explain
    id: s1
    body: |
      Kunststoffe sind **Polymere**: Tausende kleine Bausteine, die **Monomere**, hängen zu langen Ketten zusammen. Aus Ethen wird so Polyethylen – die Tüte aus dem Supermarkt.

  - kind: problem
    id: kette
    widget: numeric
    prompt: Eine Polyethylen-Kette besteht aus {{n}} Ethen-Bausteinen mit je 2 Kohlenstoffatomen. Wie viele C-Atome hat sie?
    params: { unit: C-Atome }
    answer: { value: "{{2 * n}}" }
    hints:
      - Jeder Baustein bringt zwei mit.
    explanation: "{{n}} · 2 = {{2 * n}} Kohlenstoffatome in einer Kette."
    variants:
      params: { n: "choice[500,1000,2500,5000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: verrotten
    widget: choice
    prompt: Warum verrottet Plastik im Meer kaum?
    params:
      options:
        - { label: Kaum ein Lebewesen kann die langen Ketten zerlegen., correct: true }
        - { label: Es ist zu schwer., feedback: "Viel Plastik schwimmt sogar – das Problem ist die Chemie." }
    hints:
      - Wer zersetzt Holz und Laub?
    explanation: Bakterien und Pilze haben keine Werkzeuge für diese jungen Molekülketten.

  - kind: problem
    id: natur
    widget: buckets
    prompt: Natürliches oder künstliches Polymer?
    params:
      buckets: [{ label: natürlich }, { label: künstlich }]
      items:
        - { label: Stärke, bucket: natürlich }
        - { label: Seide, bucket: natürlich }
        - { label: Nylon, bucket: künstlich }
        - { label: PET-Flasche, bucket: künstlich }
    hints:
      - Was stellt die Natur selbst her?
    explanation: Auch Stärke und Seide sind lange Ketten – die Natur baute Polymere zuerst.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Warum wird eine PET-Flasche beim Erwärmen weich, ein Autoreifen aber nicht?
    params:
      options:
        - label: Im Reifen sind die Ketten fest miteinander vernetzt
          correct: true
        - label: Der Reifen ist dicker
          feedback: Auch ein dünnes Stück Gummi schmilzt nicht.
        - label: PET ist kein Polymer
          feedback: Beides sind Polymere.
    hints:
      - Lose Ketten können aneinander vorbeigleiten. Verknüpfte nicht.
    explanation: "**Thermoplaste** lassen sich einschmelzen und recyceln. Vernetzte **Elastomere** und **Duroplaste** nicht."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Polypropylen wird aus Propen C₃H₆ (42 g/mol) aufgebaut. Eine Kette hat {{42 * n}} g/mol. Aus wie vielen Bausteinen besteht sie?
    answer:
      value: "{{n}}"
    hints:
      - Teile die Kettenmasse durch die Masse eines Bausteins.
      - "Rechne {{42 * n}} : 42."
    explanation: "{{42 * n}} : 42 = {{n}} Bausteine. Das nennt man den Polymerisationsgrad."
    difficulty: 2
    variants:
      params:
        n: step[1000,9000,1000]
      defaults:
        n: 2000

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Wie entsteht der Kunststoff? Bei der Polymerisation öffnen sich Doppelbindungen. Bei der Kondensation wird Wasser abgespalten.
    params:
      buckets:
        - id: b1
          label: Polymerisation
        - id: b2
          label: Kondensation
      items:
        - label: Polyethylen (PE)
          bucket: b1
        - label: Polypropylen (PP)
          bucket: b1
        - label: PVC
          bucket: b1
        - label: Polystyrol (PS)
          bucket: b1
        - label: PET-Flasche
          bucket: b2
        - label: Nylon
          bucket: b2
    hints:
      - Bausteine mit C=C lassen sich einfach aneinanderhängen.
      - PET ist ein Polyester, Nylon ein Polyamid.
    explanation: "Polyester und Polyamide entstehen wie Ester: Säure plus Alkohol oder Amin, Wasser geht. Auch Eiweiße sind Polyamide."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Folien aus LDPE sind weich, Kanister aus HDPE fest. Beide sind Polyethylen. Woran liegt der Unterschied?
    params:
      options:
        - label: LDPE-Ketten sind stark verzweigt und packen sich lockerer
          correct: true
        - label: HDPE enthält Metall
          feedback: Beide bestehen nur aus C und H.
        - label: LDPE ist ein anderes Element
          feedback: Es ist dasselbe Polymer.
    hints:
      - L steht für »low density«, H für »high density«.
      - Gerade Ketten liegen dicht und geordnet.
    explanation: Unverzweigte Ketten bilden geordnete, kristalline Bereiche – das macht HDPE dichter und steifer.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Eine Polyethylen-Kette hat die molare Masse 280 000 g/mol. Ein Ethen-Baustein C₂H₄ wiegt 28 g/mol. Aus wie vielen Bausteinen besteht die Kette?
    answer:
      value: 10000
    hints:
      - "280 000 : 28."
    explanation: 10 000 Bausteine – ausgestreckt wäre die Kette trotzdem nur 2,5 Mikrometer lang.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Polyethylen entsteht über eine **Kettenreaktion**: Ein Radikal mit einem ungepaarten Elektron öffnet die Doppelbindung eines Ethens. Dabei wird das Kettenende selbst zum Radikal und greift das nächste Ethen an."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: order
    prompt: Ordne die Schritte der radikalischen Polymerisation.
    params:
      items:
        - label: Ein Starter zerfällt in Radikale
        - label: Ein Radikal öffnet eine C=C-Bindung
        - label: Die Kette wächst Baustein für Baustein
        - label: Zwei Radikale treffen sich, die Kette endet
    hints:
      - Start, Wachstum, Abbruch.
      - Erst wenn zwei ungepaarte Elektronen sich paaren, ist Schluss.
    explanation: Ein einziges Startradikal kann so Tausende Bausteine verknüpfen – in Sekundenbruchteilen.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Polyethylen besteht aus CH₂-Einheiten (14 g/mol). Wie viel Kilogramm CO₂ (44 g/mol) entstehen beim Verbrennen von 1 kg PE? Auf zwei Nachkommastellen.
    answer:
      value: 3.14
      tolerance: 0.01
    hints:
      - Jede CH₂-Einheit liefert ein CO₂.
      - "Rechne 44 : 14."
    explanation: Etwa 3,14 kg CO₂ pro kg Plastik. Verbrennen gewinnt Energie zurück, setzt aber fossilen Kohlenstoff frei.
    difficulty: 3

srs:
  cards_from: [kette, verrotten]
