id: chem.organic.life
type: concept
title: Moleküle des Lebens
summary: Zucker, Fette, Eiweiße, DNA.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Griff in deinen Körper
    body: Greif ein zufälliges Atom aus deinem Körper. Welches wird es wohl sein? Zieh zuerst eins, dann hundert. Jedes achte Atom in dir ist **Kohlenstoff** – das Gerüst aller Moleküle des Lebens.
    visual:
      widget: distribution
      interactive: true
      params:
        mode: chance
        items:
          - label: Wasserstoff
            weight: 62
          - label: Sauerstoff
            weight: 24
          - label: Kohlenstoff
            weight: 12
          - label: Stickstoff
            weight: 1
          - label: Andere
            weight: 1
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: aufgaben
    widget: match
    prompt: Welche Aufgabe hat das Molekül im Körper?
    params:
      pairs:
        - { left: Kohlenhydrate, right: Schnelle Energie }
        - { left: Fette, right: Energiespeicher }
        - { left: Proteine, right: Bauen und Arbeiten }
        - { left: DNA, right: Bauplan speichern }
    hints:
      - Enzyme und Muskeln bestehen aus Proteinen.
    explanation: Alle vier sind Kohlenstoffverbindungen – Leben ist organische Chemie.

  - kind: explain
    id: s2
    body: |
      Pflanzen bauen Zucker aus Luft und Wasser – mit Licht als Energie: $6\,CO_2 + 6\,H_2O \to C_6H_{12}O_6 + 6\,O_2$. Das ist die **Photosynthese**.

  - kind: problem
    id: sauerstoff
    widget: numeric
    prompt: Wie viele Sauerstoffatome stehen auf der linken Seite der Gleichung?
    params: { unit: O-Atome }
    answer: { value: 18 }
    hints:
      - 6 CO₂ haben 12 O, 6 H₂O haben 6 O.
    explanation: 12 + 6 = 18. Rechts – 6 im Zucker und 12 in 6 O₂ – ebenfalls 18.

  - kind: problem
    id: woher
    widget: choice
    prompt: Woher stammt der Großteil der Masse eines Baumes?
    params:
      options:
        - { label: Aus dem CO₂ der Luft, correct: true }
        - { label: Aus der Erde, feedback: "Der Boden liefert nur wenige Mineralien – der Kohlenstoff kommt aus der Luft." }
        - { label: Aus dem Sonnenlicht, feedback: "Licht liefert die Energie, aber keine Atome." }
    hints:
      - Woraus besteht Holz vor allem – und woher kommt dieses Element?
    explanation: Bäume bauen sich buchstäblich aus Luft – Kohlenstoff aus CO₂, verknüpft mit Sonnenenergie.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Stärke und Zellulose bestehen beide aus Traubenzucker. Warum können wir Brot verdauen, aber kein Holz?
    params:
      options:
        - label: Die Bausteine sind verschieden verknüpft – unsere Enzyme passen nur zur Stärke
          correct: true
        - label: Holz enthält keinen Zucker
          feedback: Zellulose ist reiner Traubenzucker in Kettenform.
        - label: Holz ist zu hart zum Kauen
          feedback: Auch fein gemahlen bleibt es unverdaulich.
    hints:
      - Enzyme arbeiten wie Schlüssel und Schloss.
    explanation: Eine einzige gedrehte Bindung macht den Unterschied. Kühe nutzen Bakterien, die das passende Enzym haben.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: "Zellatmung: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O. Wie viel Gramm CO₂ (44 g/mol) entstehen aus 180 g Traubenzucker (1 mol)?"
    params:
      unit: g
    answer:
      value: 264
    feedback:
      - when: numval(state.input) == 44
        misconception: coefficient-ignored
        text: Aus einem Zucker entstehen sechs CO₂.
    hints:
      - 1 mol Zucker gibt 6 mol CO₂.
      - Rechne 6 · 44 g.
    explanation: 264 g CO₂ – das atmest du aus. Fett verlässt den Körper beim Abnehmen zum größten Teil als CO₂ über die Lunge.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Enthält der Stoff Stickstoff?
    params:
      buckets:
        - id: b1
          label: enthält N
        - id: b2
          label: kein N
      items:
        - label: Eiweiß
          bucket: b1
        - label: DNA
          bucket: b1
        - label: Aminosäure
          bucket: b1
        - label: Speisefett
          bucket: b2
        - label: Stärke
          bucket: b2
        - label: Zellulose
          bucket: b2
    hints:
      - "Amino heißt: eine NH₂-Gruppe."
      - Zucker und Fette bestehen nur aus C, H und O.
    explanation: "Darum brauchen Pflanzen Stickstoffdünger: Ohne N keine Eiweiße und keine DNA."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Bei der Fotosynthese wird Lichtenergie aufgenommen. Wo steckt sie danach?
    params:
      options:
        - label: In den Bindungen von Traubenzucker und Sauerstoff – die Zellatmung holt sie zurück
          correct: true
        - label: Sie ist verloren gegangen
          feedback: Energie geht nicht verloren, sie wird gespeichert.
        - label: Im Wasser der Pflanze
          feedback: Wasser ist energiearm – es ist ein Ausgangsstoff.
    hints:
      - Die Fotosynthese ist stark endotherm.
      - Atmung ist die Umkehrung der Fotosynthese.
    explanation: Zucker und O₂ sind zusammen energiereich, CO₂ und H₂O energiearm. Alles Leben läuft auf diesem Gefälle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist Kohlenstoff das Element des Lebens?"
    params:
      keywords:
        - - vier
          - four
          - "4 "
        - - bindung
          - bond
        - - kette
          - ring
          - chain
          - lang
          - long
        - - viele
          - vielfalt
          - million
          - many
          - variety
          - verschieden
          - different
      min: 3
      sample: Kohlenstoff kann vier Bindungen eingehen und sich mit sich selbst zu langen Ketten und Ringen verbinden. So entstehen Millionen verschiedener Moleküle – genug Vielfalt für das Leben.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Beim Veratmen von 1 mol Traubenzucker (180 g) werden etwa 2800 kJ frei. Wie viele kJ liefert 1 g Zucker? Auf eine Nachkommastelle.
    answer:
      value: 15.6
      tolerance: 0.06
    hints:
      - Teile die Energie durch die Masse.
      - "Rechne 2800 : 180."
    explanation: Etwa 15,6 kJ pro Gramm, rund 3,7 kcal. Fett liefert mehr als das Doppelte, weil sein C kaum oxidiert ist.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Silicium steht direkt unter Kohlenstoff und bildet auch vier Bindungen. Warum gibt es trotzdem kein Leben auf Silicium-Basis?
    params:
      options:
        - label: Si–Si-Ketten sind schwach und SiO₂ ist ein fester Stein statt eines Gases wie CO₂
          correct: true
        - label: Silicium ist zu selten
          feedback: In der Erdkruste ist Si über hundertmal häufiger als C.
        - label: Silicium ist radioaktiv
          feedback: Natürliches Silicium ist stabil.
    hints:
      - Vergleiche, was beim Atmen herauskommt.
      - Si hält an O viel stärker als an Si.
    explanation: Kohlenstoff bildet stabile Ketten, Doppelbindungen und ein gasförmiges Oxid. Diese Mischung macht ihn einzigartig.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Fast alle Aminosäuren in Lebewesen haben dieselbe Spiegelform (L). Was folgt daraus für Enzyme?
    params:
      options:
        - label: Enzyme sind selbst chiral und unterscheiden Bild und Spiegelbild ihrer Partner
          correct: true
        - label: Nichts, Spiegelformen verhalten sich immer gleich
          feedback: Nur gegenüber nicht-chiralen Partnern.
        - label: Enzyme bauen nur D-Formen ab
          feedback: Sie passen gerade zu den L-Formen.
    hints:
      - Ein linker Handschuh passt nicht auf die rechte Hand.
      - Enzyme bestehen aus L-Aminosäuren.
    explanation: "Darum riecht eine Form von Carvon nach Minze, die andere nach Kümmel: Unsere Riechzellen sind chiral."
    difficulty: 3

srs:
  cards_from: [aufgaben, woher]
