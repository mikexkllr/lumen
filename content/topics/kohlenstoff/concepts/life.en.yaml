id: chem.organic.life
type: concept
title: Molecules of life
summary: Sugars, fats, proteins, DNA.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A dip into your body
    body: Pick a random atom from your body. Which one will it be? Draw one first, then a hundred. One atom in eight inside you is **carbon** – the backbone of every molecule of life.
    visual:
      widget: distribution
      interactive: true
      params:
        mode: chance
        items:
          - label: Hydrogen
            weight: 62
          - label: Oxygen
            weight: 24
          - label: Carbon
            weight: 12
          - label: Nitrogen
            weight: 1
          - label: Others
            weight: 1
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: aufgaben
    widget: match
    prompt: What is the molecule's job in the body?
    params:
      pairs:
        - { left: Carbohydrates, right: Quick energy }
        - { left: Fats, right: Energy storage }
        - { left: Proteins, right: Building and working }
        - { left: DNA, right: Storing the blueprint }
    hints:
      - Enzymes and muscles are made of proteins.
    explanation: All four are carbon compounds – life is organic chemistry.

  - kind: explain
    id: s2
    body: |
      Plants build sugar from air and water – with light as energy: $6\,CO_2 + 6\,H_2O \to C_6H_{12}O_6 + 6\,O_2$. This is **photosynthesis**.

  - kind: problem
    id: sauerstoff
    widget: numeric
    prompt: How many oxygen atoms are on the left side of the equation?
    params: { unit: O atoms }
    answer: { value: 18 }
    hints:
      - 6 CO₂ have 12 O, 6 H₂O have 6 O.
    explanation: 12 + 6 = 18. On the right – 6 in the sugar and 12 in 6 O₂ – also 18.

  - kind: problem
    id: woher
    widget: choice
    prompt: Where does most of a tree's mass come from?
    params:
      options:
        - { label: From the CO₂ in the air, correct: true }
        - { label: From the soil, feedback: "The soil supplies only a few minerals – the carbon comes from the air." }
        - { label: From sunlight, feedback: "Light supplies the energy, but no atoms." }
    hints:
      - What is wood mostly made of – and where does that element come from?
    explanation: Trees are literally built from air – carbon from CO₂, linked using solar energy.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Starch and cellulose both consist of glucose. Why can we digest bread but not wood?
    params:
      options:
        - label: The units are linked differently – our enzymes fit only starch
          correct: true
        - label: Wood contains no sugar
          feedback: Cellulose is pure glucose in chain form.
        - label: Wood is too hard to chew
          feedback: Even finely ground it stays indigestible.
    hints:
      - Enzymes work like lock and key.
    explanation: A single flipped bond makes the difference. Cows use bacteria that have the matching enzyme.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: "Cellular respiration: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O. How many grams of CO₂ (44 g/mol) form from 180 g of glucose (1 mol)?"
    params:
      unit: g
    answer:
      value: 264
    feedback:
      - when: numval(state.input) == 44
        misconception: coefficient-ignored
        text: One sugar gives six CO₂.
    hints:
      - 1 mol of sugar gives 6 mol of CO₂.
      - Work out 6 · 44 g.
    explanation: 264 g of CO₂ – that is what you breathe out. When you lose weight, most of the fat leaves your body as CO₂ through the lungs.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Does the substance contain nitrogen?
    params:
      buckets:
        - id: b1
          label: contains N
        - id: b2
          label: no N
      items:
        - label: Protein
          bucket: b1
        - label: DNA
          bucket: b1
        - label: Amino acid
          bucket: b1
        - label: Cooking fat
          bucket: b2
        - label: Starch
          bucket: b2
        - label: Cellulose
          bucket: b2
    hints:
      - "Amino means: an NH₂ group."
      - Sugars and fats are made only of C, H and O.
    explanation: "That is why plants need nitrogen fertiliser: no N, no proteins and no DNA."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Plants take in light energy to make sugar. Where does that energy go?
    params:
      options:
        - label: In the bonds of glucose and oxygen – respiration gets it back
          correct: true
        - label: It has been lost
          feedback: Energy is not lost, it is stored.
        - label: In the plant's water
          feedback: Water is low in energy – it is a starting material.
    hints:
      - Photosynthesis is strongly endothermic.
      - Respiration is the reverse of photosynthesis.
    explanation: Sugar and O₂ together are rich in energy, CO₂ and H₂O are poor in it. All life runs on this gradient.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is carbon the element of life?"
    params:
      keywords:
        - - vier
          - four
          - "4 "
        - - bindung
          - bond
        - - kette
          - ring
          - chain
          - lang
          - long
        - - viele
          - vielfalt
          - million
          - many
          - variety
          - verschieden
          - different
      min: 3
      sample: Carbon can form four bonds and link with itself into long chains and rings. That creates millions of different molecules – enough variety for life.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Respiring 1 mol of glucose (180 g) releases about 2800 kJ. How many kJ does 1 g of sugar supply? Give one decimal place.
    answer:
      value: 15.6
      tolerance: 0.06
    hints:
      - Divide the energy by the mass.
      - Work out 2800 ÷ 180.
    explanation: About 15.6 kJ per gram, roughly 3.7 kcal. Fat supplies more than twice as much because its carbon is barely oxidised.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Silicon sits right below carbon and also forms four bonds. So why is there no silicon-based life?
    params:
      options:
        - label: Si–Si chains are weak, and SiO₂ is solid rock instead of a gas like CO₂
          correct: true
        - label: Silicon is too rare
          feedback: In Earth's crust Si is over a hundred times more common than C.
        - label: Silicon is radioactive
          feedback: Natural silicon is stable.
    hints:
      - Compare what comes out when breathing.
      - Si holds onto O much more tightly than onto Si.
    explanation: Carbon forms stable chains, double bonds and a gaseous oxide. This combination makes it unique.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Almost all amino acids in living things share the same mirror form (L). What follows for enzymes?
    params:
      options:
        - label: Enzymes are chiral themselves and tell an image from the mirror image of their partners
          correct: true
        - label: Nothing, mirror forms always behave the same
          feedback: Only towards non-chiral partners.
        - label: Enzymes only break down D forms
          feedback: They fit precisely the L forms.
    hints:
      - A left glove does not fit the right hand.
      - Enzymes are built from L amino acids.
    explanation: "That is why one form of carvone smells of mint and the other of caraway: our smell receptors are chiral."
    difficulty: 3

srs:
  cards_from: [aufgaben, woher]
