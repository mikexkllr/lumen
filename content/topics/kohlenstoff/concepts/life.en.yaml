id: chem.organic.life
type: concept
title: Molecules of life
summary: Sugars, fats, proteins, DNA.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: aufgaben
    widget: match
    prompt: What is the molecule's job in the body?
    params:
      pairs:
        - { left: Carbohydrates, right: Quick energy }
        - { left: Fats, right: Energy storage }
        - { left: Proteins, right: Building and working }
        - { left: DNA, right: Storing the blueprint }
    hints:
      - Enzymes and muscles are made of proteins.
    explanation: All four are carbon compounds – life is organic chemistry.

  - kind: explain
    body: |
      Plants build sugar from air and water – with light as energy: $6\,CO_2 + 6\,H_2O \to C_6H_{12}O_6 + 6\,O_2$. This is **photosynthesis**.

  - kind: problem
    id: sauerstoff
    widget: numeric
    prompt: How many oxygen atoms are on the left side of the equation?
    params: { unit: O atoms }
    answer: { value: 18 }
    hints:
      - 6 CO₂ have 12 O, 6 H₂O have 6 O.
    explanation: 12 + 6 = 18. On the right – 6 in the sugar and 12 in 6 O₂ – also 18.

  - kind: problem
    id: woher
    widget: choice
    prompt: Where does most of a tree's mass come from?
    params:
      options:
        - { label: From the CO₂ in the air, correct: true }
        - { label: From the soil, feedback: "The soil supplies only a few minerals – the carbon comes from the air." }
        - { label: From sunlight, feedback: "Light supplies the energy, but no atoms." }
    hints:
      - What is wood mostly made of – and where does that element come from?
    explanation: Trees are literally built from air – carbon from CO₂, linked using solar energy.

srs:
  cards_from: [aufgaben, woher]
