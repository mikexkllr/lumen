id: chem.organic.groups
type: concept
title: Functional groups
summary: Small add-ons, big character.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ethane is a flammable gas. Attach an O and an H and it becomes a familiar liquid. Which?
    params:
      options:
        - label: Alcohol
          correct: true
        - label: Water
          feedback: Water contains no carbon.
        - label: Cooking oil
          feedback: Oil molecules are far bigger.
    hints:
      - It is in wine and beer.
    explanation: One small group changes the whole behaviour.


  - kind: explain
    id: s1
    body: |
      A **functional group** is a small cluster of atoms on the chain that determines its behavior. An OH group turns ethane into the alcohol **ethanol**.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Which group is in the substance?
    params:
      pairs:
        - { left: "–OH", right: Ethanol }
        - { left: "–COOH", right: Acetic acid }
        - { left: "–NH₂", right: Amino acids }
    hints:
      - COOH makes substances acidic.
    explanation: The acid group COOH easily gives off an H⁺ – that is why vinegar is sour.

  - kind: problem
    id: loeslich
    widget: choice
    prompt: Ethanol mixes with water, ethane does not. Why?
    params:
      options:
        - { label: The OH group is polar like water., correct: true }
        - { label: Ethanol is heavier., feedback: "It is not about weight, but about polarity." }
    hints:
      - Remember – like dissolves like.
    explanation: The OH group forms hydrogen bonds with water.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Alcohol or acid?
    params:
      buckets: [{ label: Alcohol }, { label: Acid }]
      items:
        - { label: Ethanol, bucket: Alcohol }
        - { label: Glycerol, bucket: Alcohol }
        - { label: Acetic acid, bucket: Acid }
        - { label: Citric acid, bucket: Acid }
    hints:
      - Names ending in "acid" give it away.
    explanation: Alcohols carry OH groups, organic acids carry COOH groups.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: An alcohol and an acid react to a substance that smells of fruit. What is this class of substances called?
    params:
      options:
        - label: Esters
          correct: true
        - label: Alkanes
          feedback: They smell of petrol, not of banana.
        - label: Salts
          feedback: Salts form from acid and base.
    hints:
      - Banana, pineapple and pear flavours belong to it.
    explanation: In **esterification** water is split off. Fats are esters too.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The left and the right hand are mirror images but not superimposable. Why does that matter for medicines?
    params:
      options:
        - label: Molecules too exist in two mirror forms – the body tells them apart
          correct: true
        - label: Tablets must be symmetric
          feedback: It is about the shape of the molecules, not the tablet.
        - label: It does not matter
          feedback: One mirror form can heal, the other harm.
    hints:
      - A glove fits only one hand.
    explanation: "**Chirality**: enzymes are themselves “handed”. With thalidomide one form was calming, the other harmed embryos."
    difficulty: 3

srs:
  cards_from: [zuordnen, loeslich]
