id: chem.organic.groups
type: concept
title: Functional groups
summary: Small add-ons, big character.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ethane is a flammable gas. Attach an O and an H and it becomes a familiar liquid. Which?
    params:
      options:
        - label: Alcohol
          correct: true
        - label: Water
          feedback: Water contains no carbon.
        - label: Cooking oil
          feedback: Oil molecules are far bigger.
    hints:
      - It is in wine and beer.
    explanation: One small group changes the whole behaviour.

  - kind: explain
    id: s1
    body: |
      A **functional group** is a small cluster of atoms on the chain that determines its behavior. An OH group turns ethane into the alcohol **ethanol**.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Which group is in the substance?
    params:
      pairs:
        - { left: "–OH", right: Ethanol }
        - { left: "–COOH", right: Acetic acid }
        - { left: "–NH₂", right: Amino acids }
    hints:
      - COOH makes substances acidic.
    explanation: The acid group COOH easily gives off an H⁺ – that is why vinegar is sour.

  - kind: problem
    id: loeslich
    widget: choice
    prompt: Ethanol mixes with water, ethane does not. Why?
    params:
      options:
        - { label: The OH group is polar like water., correct: true }
        - { label: Ethanol is heavier., feedback: "It is not about weight, but about polarity." }
    hints:
      - Remember – like dissolves like.
    explanation: The OH group forms hydrogen bonds with water.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Alcohol or acid?
    params:
      buckets: [{ label: Alcohol }, { label: Acid }]
      items:
        - { label: Ethanol, bucket: Alcohol }
        - { label: Glycerol, bucket: Alcohol }
        - { label: Acetic acid, bucket: Acid }
        - { label: Citric acid, bucket: Acid }
    hints:
      - Names ending in "acid" give it away.
    explanation: Alcohols carry OH groups, organic acids carry COOH groups.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A [[functional group]] determines how a molecule behaves. The OH group turns ethane into the alcohol [[ethanol]].
      distractors:
        - long chain
        - methane

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: An alcohol and an acid react to a substance that smells of fruit. What is this class of substances called?
    params:
      options:
        - label: Esters
          correct: true
        - label: Alkanes
          feedback: They smell of petrol, not of banana.
        - label: Salts
          feedback: Salts form from acid and base.
    hints:
      - Banana, pineapple and pear flavours belong to it.
    explanation: In **esterification** water is split off. Fats are esters too.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Which class of compound does it belong to?
    params:
      buckets:
        - id: b1
          label: Alcohol (–OH)
        - id: b2
          label: Carboxylic acid (–COOH)
        - id: b3
          label: Ester (–COO–)
        - id: b4
          label: Ketone (C=O in the middle)
      items:
        - label: Ethanol
          bucket: b1
        - label: Glycerol
          bucket: b1
        - label: Acetic acid
          bucket: b2
        - label: Citric acid
          bucket: b2
        - label: Ethyl acetate (nail polish remover)
          bucket: b3
        - label: Acetone
          bucket: b4
    hints:
      - The word "acid" gives away the carboxylic acid.
      - Esters are often called "…acetate".
    explanation: Acetone is the simplest ketone. Many nail polish removers contain acetone or the ester ethyl acetate.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: order
    prompt: Wine turns into vinegar in air. Order the substances as they form one after another.
    params:
      items:
        - label: Ethanol (alcohol)
        - label: Ethanal (aldehyde)
        - label: Acetic acid (carboxylic acid)
    hints:
      - Each step is an oxidation.
      - The aldehyde is in the middle.
    explanation: Bacteria oxidise the alcohol via the aldehyde to the acid. The carbon's oxidation number rises from −1 via +1 to +3.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: tiles
    prompt: Acetic acid and ethanol form an ester and water. Build the equation.
    params:
      tiles:
        - CH₃COOH
        - C₂H₅OH
        - +
        - +
        - ⇌
        - CH₃COOC₂H₅
        - H₂O
        - CO₂
    answer:
      anyOf:
        - - CH₃COOH
          - +
          - C₂H₅OH
          - ⇌
          - CH₃COOC₂H₅
          - +
          - H₂O
        - - C₂H₅OH
          - +
          - CH₃COOH
          - ⇌
          - CH₃COOC₂H₅
          - +
          - H₂O
        - - CH₃COOH
          - +
          - C₂H₅OH
          - ⇌
          - H₂O
          - +
          - CH₃COOC₂H₅
        - - C₂H₅OH
          - +
          - CH₃COOH
          - ⇌
          - H₂O
          - +
          - CH₃COOC₂H₅
    hints:
      - Acid plus alcohol gives ester plus water.
      - "The ester contains both parts: CH₃COO and C₂H₅."
    explanation: "This is a condensation: water is split off. The double arrow shows an equilibrium forms."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The left and the right hand are mirror images but not superimposable. Why does that matter for medicines?
    params:
      options:
        - label: Molecules too exist in two mirror forms – the body tells them apart
          correct: true
        - label: Tablets must be symmetric
          feedback: It is about the shape of the molecules, not the tablet.
        - label: It does not matter
          feedback: One mirror form can heal, the other harm.
    hints:
      - A glove fits only one hand.
    explanation: "**Chirality**: enzymes are themselves “handed”. With thalidomide one form was calming, the other harmed embryos."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Many reactions follow a pattern: an electron-rich particle, the **nucleophile**, attacks a C atom carrying δ+. In return another group leaves the molecule. This is a substitution."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: order
    prompt: Bromomethane reacts with OH⁻ to give methanol. Order the steps of this SN2 reaction.
    params:
      items:
        - label: OH⁻ approaches the C from behind
        - label: For a moment the C is half-bonded to five partners
        - label: Br⁻ breaks away
        - label: Methanol has formed, its shape flipped over
    hints:
      - The C carries δ+ because Br pulls harder.
      - Attack and departure happen in one single step.
    explanation: Bond forming and breaking happen at the same time. The molecule flips over like an umbrella in the wind.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: In butan-2-ol CH₃–CH(OH)–CH₂–CH₃ one C atom is a stereocentre with two mirror forms. Which one?
    params:
      options:
        - label: C2, which carries the OH group
          correct: true
        - label: C1
          feedback: It carries three identical H atoms.
        - label: C3
          feedback: It carries two identical H atoms.
    hints:
      - A stereocentre needs four different partners.
      - C2 carries H, OH, CH₃ and C₂H₅.
    explanation: Four different partners – then there is an image and a mirror image that cannot be superimposed. Like left and right hands.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what a functional group is and why it matters so much.
    params:
      keywords:
        - - gruppe
          - group
          - oh
          - cooh
        - - eigenschaft
          - verhalten
          - reaktion
          - property
          - behav
          - react
        - - kette
          - chain
          - molekül
          - molecule
          - rest
      sample: A functional group is a small part of a molecule, such as OH or COOH. It decides the properties and reactions, however long the chain behind it.
    explanation: The chain is the frame, the group is the character.
    difficulty: 3

srs:
  cards_from: [zuordnen, loeslich]
