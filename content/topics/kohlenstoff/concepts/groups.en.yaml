id: chem.organic.groups
type: concept
title: Functional groups
summary: Small add-ons, big character.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      A **functional group** is a small cluster of atoms on the chain that determines its behavior. An OH group turns ethane into the alcohol **ethanol**.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Which group is in the substance?
    params:
      pairs:
        - { left: "–OH", right: Ethanol }
        - { left: "–COOH", right: Acetic acid }
        - { left: "–NH₂", right: Amino acids }
    hints:
      - COOH makes substances acidic.
    explanation: The acid group COOH easily gives off an H⁺ – that is why vinegar is sour.

  - kind: problem
    id: loeslich
    widget: choice
    prompt: Ethanol mixes with water, ethane does not. Why?
    params:
      options:
        - { label: The OH group is polar like water., correct: true }
        - { label: Ethanol is heavier., feedback: "It is not about weight, but about polarity." }
    hints:
      - Remember – like dissolves like.
    explanation: The OH group forms hydrogen bonds with water.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Alcohol or acid?
    params:
      buckets: [{ label: Alcohol }, { label: Acid }]
      items:
        - { label: Ethanol, bucket: Alcohol }
        - { label: Glycerol, bucket: Alcohol }
        - { label: Acetic acid, bucket: Acid }
        - { label: Citric acid, bucket: Acid }
    hints:
      - Names ending in "acid" give it away.
    explanation: Alcohols carry OH groups, organic acids carry COOH groups.

srs:
  cards_from: [zuordnen, loeslich]
