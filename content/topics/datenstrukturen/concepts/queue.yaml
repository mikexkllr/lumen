id: cs.datastructures.queue
type: concept
title: Die Warteschlange
summary: Wer zuerst kommt, ist zuerst dran.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Warten mit System
    body: "An der Kasse nerven Warteschlangen. Im Computer halten sie Ordnung. Deck die Karten auf: Wo warten Daten **in einer Schlange**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📺
            front: Der Videostream
            back: Dein Handy lädt die nächsten Sekunden vorab und hält sie in einer Schlange bereit.
          - icon: ⌨️
            front: Die Tastatur
            back: Tippst du schneller, als der Rechner reagiert, warten die Tasten in einer Schlange.
          - icon: 📨
            front: Nachrichten im Funkloch
            back: Schickst du ohne Netz drei Nachrichten, warten sie, bis du wieder Empfang hast.

  - kind: problem
    id: hook
    widget: choice
    prompt: "An der Kasse: Erst kommt Ana, dann Ben, dann Cem. Wer wird zuerst bedient?"
    params:
      options:
        - label: Ana
          correct: true
        - label: Cem
          feedback: Er kam zuletzt.
        - label: Ben
          feedback: Vor ihm steht noch jemand.
    hints:
      - Wer wartet am längsten?
    explanation: Zuerst da, zuerst dran.

  - kind: explain
    id: s1
    body: |
      Eine **Warteschlange** (Queue) ist fair: Wer zuerst kommt, ist zuerst dran. Neue stellen sich hinten an, bedient wird vorne.

  - kind: problem
    id: kasse
    widget: order
    prompt: An der Kasse stellen sich nacheinander Ana, Ben und Cem an. In welcher Reihenfolge werden sie bedient?
    params:
      items:
        - { label: Ana }
        - { label: Ben }
        - { label: Cem }
    hints:
      - Wer stand zuerst da?
    explanation: Genau in der Reihenfolge, in der sie kamen.

  - kind: problem
    id: welche
    widget: buckets
    prompt: Stapel oder Warteschlange?
    params:
      buckets: [{ label: Stapel }, { label: Warteschlange }]
      items:
        - { label: Rückgängig-Funktion, bucket: Stapel }
        - { label: Tellerstapel, bucket: Stapel }
        - { label: Druckaufträge, bucket: Warteschlange }
        - { label: Supermarktkasse, bucket: Warteschlange }
        - { label: Playlist »als Nächstes«, bucket: Warteschlange }
    hints:
      - Kommt das Neueste oder das Älteste zuerst dran?
    explanation: Stapel – das Neueste zuerst. Schlange – das Älteste zuerst.

  - kind: problem
    id: drucker
    widget: numeric
    prompt: In der Druckerschlange warten {{n}} Aufträge, jeder braucht {{t}} Sekunden. Wann ist der letzte fertig?
    params: { unit: s }
    answer: { value: "{{n * t}}" }
    hints:
      - Alle kommen nacheinander dran.
    explanation: "{{n}} · {{t}} = {{n * t}} Sekunden."
    variants:
      params: { n: "int[3,12]", t: "int[5,30]" }
      defaults: { n: 6, t: 20 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In einer Notaufnahme kommt nicht der Erste zuerst dran, sondern der dringendste Fall. Welche Datenstruktur passt?
    params:
      options:
        - label: Eine Prioritätswarteschlange
          correct: true
        - label: Ein Stapel
          feedback: Dann käme immer der zuletzt Eingetroffene dran.
        - label: Eine normale Warteschlange
          feedback: Die achtet nur auf die Reihenfolge der Ankunft.
    hints:
      - Jeder Eintrag trägt eine Dringlichkeit.
    explanation: Eine **Prioritätswarteschlange** gibt immer das wichtigste Element heraus. Navis nutzen sie für kürzeste Wege.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: choice
    prompt: enqueue A, enqueue B, dequeue, enqueue C, enqueue D, dequeue. Wer steht jetzt vorne?
    params:
      options:
        - label: C
          correct: true
        - label: D
          feedback: D kam zuletzt – es steht hinten.
        - label: B
          feedback: B wurde beim zweiten dequeue bedient.
    hints:
      - Schreib die Schlange nach jedem Befehl auf.
      - "[A, B] → [B] → [B, C] → [B, C, D] → …"
    explanation: Nach dem zweiten dequeue bleibt [C, D]. Vorne steht C.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: Ein **Ringpuffer** speichert eine Schlange in einem festen Feld. Die Zeiger für vorne und hinten laufen im Kreis – mit Modulo. So muss nie jemand aufrücken.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Ein Ringpuffer hat 8 Plätze (0 bis 7). Der Hinten-Zeiger steht bei {{p}}. Wo steht er nach {{k}} neuen Einträgen?
    answer:
      value: "{{mod(p + k, 8)}}"
    feedback:
      - when: numval(state.input) == p + k
        misconception: no-wrap
        text: Nach Platz 7 geht es wieder bei 0 weiter.
    hints:
      - "Zähle weiter: {{p}}, {{p + 1}}, …"
      - Rechne ({{p}} + {{k}}) mod 8.
    explanation: ({{p}} + {{k}}) mod 8 = {{mod(p + k, 8)}}.
    difficulty: 2
    variants:
      params:
        p: int[3,7]
        k: int[2,7]
      constraints:
        - p + k > 8
      defaults:
        p: 6
        k: 5

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: Welche Datenstruktur nutzt die Breitensuche, die in einem Netz erst alle Nachbarn, dann deren Nachbarn besucht?
    params:
      options:
        - label: Eine Warteschlange – wer zuerst entdeckt wird, wird zuerst untersucht
          correct: true
        - label: Ein Stapel
          feedback: Mit einem Stapel taucht die Suche erst tief hinab – das ist Tiefensuche.
        - label: Eine Hash-Tabelle
          feedback: Sie merkt sich, was schon besucht ist – die Reihenfolge regelt sie nicht.
    hints:
      - Erst die Nähe, dann die Ferne – fair der Reihe nach.
      - Neu entdeckte Knoten stellen sich hinten an.
    explanation: Die Schlange sorgt dafür, dass alle Knoten mit Abstand 1 vor denen mit Abstand 2 drankommen. So findet die Breitensuche kürzeste Wege in Schritten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An einer Kasse kommen pro Minute 2 Kunden an, bedient werden 3 pro Minute. Welcher Anteil der Zeit ist die Kasse beschäftigt? In Prozent, gerundet.
    params:
      unit: "%"
    answer:
      value: 67
      tolerance: 1
    hints:
      - Ankunftsrate geteilt durch Bedienrate.
    explanation: 2/3 ≈ 67 %. Steigt die Auslastung Richtung 100 %, explodieren die Wartezeiten – das zeigt die **Warteschlangentheorie**.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: In einen Laden kommen im Schnitt 3 Kunden pro Minute. Jeder bleibt 4 Minuten. Wie viele Kunden sind im Schnitt gleichzeitig drin?
    answer:
      value: 12
    hints:
      - Wie viele kommen herein, während einer drin ist?
      - Ankünfte pro Minute mal Verweildauer.
    explanation: "3 · 4 = 12. Das ist das Gesetz von Little: L = λ · W. Es gilt für fast jede stabile Warteschlange – vom Supermarkt bis zum Server."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Eine Kasse ist zu {{p}} % ausgelastet. Bei zufälligen Ankünften sind im Schnitt ρ / (1 − ρ) Kunden da, mit ρ = {{p / 100}}. Wie viele sind das?
    answer:
      value: "{{p / (100 - p)}}"
    hints:
      - "Setze ρ ein: {{p / 100}} / (1 − {{p / 100}})."
      - 1 − {{p / 100}} = {{(100 - p) / 100}}.
    explanation: "{{p / 100}} / {{(100 - p) / 100}} = {{p / (100 - p)}}. Nahe 100 % explodiert die Schlange: Bei 95 % sind es schon 19."
    difficulty: 3
    variants:
      params:
        p: choice[50,75,80,90,95]
      defaults:
        p: 75

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Was passiert, wenn dauerhaft mehr Kunden kommen, als bedient werden können?
    params:
      options:
        - label: Die Schlange wächst ohne Grenze
          correct: true
        - label: Sie pendelt sich bei einer festen Länge ein
          feedback: Das passiert nur, wenn weniger kommen, als bedient werden.
        - label: Die Wartezeit bleibt gleich
          feedback: Jeder neue Kunde wartet länger als der vorige.
    hints:
      - Pro Minute kommt mehr dazu, als weggeht.
      - Das ist wie bei einer Badewanne, deren Abfluss zu klein ist.
    explanation: Bei Auslastung über 100 % gibt es keinen Gleichgewichtszustand. Server lehnen dann Anfragen ab, statt sie ewig zu sammeln.
    difficulty: 3

srs:
  cards_from: [kasse, welche]
