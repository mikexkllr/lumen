id: cs.datastructures.trees
type: concept
title: Search Trees
summary: Smaller on the left, larger on the right.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Trees upside down
    body: "Computer scientists draw trees upside down: the **root** at the top, the leaves at the bottom. Flip the cards. Where do such trees grow in your everyday life?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📁
            front: Your folders
            back: "Folders inside folders inside folders: your storage is a tree."
          - icon: 🌐
            front: Every web page
            back: The browser turns every page into a tree of headings, paragraphs and images.
          - icon: ♟️
            front: The chess computer
            back: It searches a tree of all possible moves – millions of nodes per second.
          - icon: 🏆
            front: The tournament
            back: "A knockout tournament is a tree: the winner sits at the very top."

  - kind: problem
    id: hook
    widget: estimate
    prompt: I think of a number from 1 to 1000. After each guess I say “higher” or “lower”. How many tries do you need at most?
    params:
      min: 1
      max: 100
    answer:
      value: 10
      tolerance: 2
    explanation: Only 10. Each answer halves the possibilities.

  - kind: explain
    id: s1
    body: |
      In a **search tree**, everything smaller sits to the left of each node and everything larger to the right. Each decision halves the search, like binary search, but as a structure.

  - kind: problem
    id: weg
    widget: network
    prompt: Tap the path from the root 8 to the 10.
    params:
      start: n8
      end: n10
      aspect: 0.6
      nodes:
        - { id: n8, x: 50, y: 6, label: "8" }
        - { id: n4, x: 25, y: 50, label: "4" }
        - { id: n12, x: 75, y: 50, label: "12" }
        - { id: n2, x: 10, y: 94, label: "2" }
        - { id: n6, x: 38, y: 94, label: "6" }
        - { id: n10, x: 62, y: 94, label: "10" }
        - { id: n14, x: 90, y: 94, label: "14" }
      edges:
        - { a: n8, b: n4 }
        - { a: n8, b: n12 }
        - { a: n4, b: n2 }
        - { a: n4, b: n6 }
        - { a: n12, b: n10 }
        - { a: n12, b: n14 }
    hints:
      - 10 is larger than 8, so go right.
    explanation: 8 → 12 → 10. Two decisions instead of seven comparisons.

  - kind: problem
    id: einfuegen
    widget: choice
    prompt: Where does the 7 land in the tree above?
    params:
      options:
        - { label: Right under the 6, correct: true }
        - { label: Left under the 6, feedback: "7 is larger than 6, so it goes right." }
        - { label: Right under the 8, feedback: "7 is smaller than 8, so it goes left." }
    hints:
      - Compare with 8, then 4, then 6.
    explanation: 7 < 8 → left, 7 > 4 → right, 7 > 6 → right.

  - kind: problem
    id: ebenen
    widget: numeric
    prompt: A balanced search tree has about 1000 entries. Roughly how many levels deep is it?
    params: { unit: levels }
    answer: { value: 10 }
    hints:
      - Each level doubles the number of places. $2^{10}$ is about 1000.
    explanation: About 10 levels, so at most 10 comparisons for 1000 entries.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: In a search tree everything smaller lies to the left.
          right: true
        - text: A search tree is always balanced.
          right: false
          why: Inserting sorted numbers produces a long chain.
        - text: A balanced tree with a million entries is about 20 levels deep.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A complete binary tree has 5 levels. How many nodes does it have in total?
    answer:
      value: 31
    hints:
      - 1 + 2 + 4 + 8 + 16.
    explanation: 2⁵ − 1 = 31. Each level has twice as many nodes as the one above.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: network
    prompt: A bigger search tree. Where is 35? Tap the search path from the root 50.
    params:
      start: n50
      end: n35
      aspect: 0.7
      nodes:
        - id: n50
          x: 50
          y: 6
          label: "50"
        - id: n30
          x: 26
          y: 36
          label: "30"
        - id: n70
          x: 74
          y: 36
          label: "70"
        - id: n20
          x: 10
          y: 66
          label: "20"
        - id: n40
          x: 40
          y: 66
          label: "40"
        - id: n60
          x: 60
          y: 66
          label: "60"
        - id: n80
          x: 90
          y: 66
          label: "80"
        - id: n35
          x: 30
          y: 96
          label: "35"
      edges:
        - a: n50
          b: n30
        - a: n50
          b: n70
        - a: n30
          b: n20
        - a: n30
          b: n40
        - a: n70
          b: n60
        - a: n70
          b: n80
        - a: n40
          b: n35
    hints:
      - 35 is less than 50 – so left.
      - "At 30: bigger, so right. At 40: smaller, so left."
    explanation: 50 → 30 → 40 → 35. Three decisions, each ruling out a whole subtree.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: You insert 1, 2, 3, …, 1000 in order into a plain search tree. How many levels does it have afterwards?
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 10
        misconception: assume-balanced
        text: That would be a balanced tree. Here every new number hangs off the bottom right.
    hints:
      - Where does 2 go if 1 is the root? Where does 3 go?
      - Every number is bigger than all before it.
    explanation: "The tree becomes a long chain: 1000 levels. Searching then costs O(n), just like a list."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: You read a search tree in the order »left subtree – node – right subtree«. What comes out?
    params:
      options:
        - label: All values in sorted order
          correct: true
        - label: The values in insertion order
          feedback: The shape of the tree forgets the insertion order.
        - label: First all leaves, then the root
          feedback: That would be a different order.
    hints:
      - On the left everything is smaller, on the right everything bigger.
      - "Try it on the tree above: 20, 30, 35, 40 …"
    explanation: This in-order traversal yields sorted values. A search tree is a list that always stays sorted.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why are there so many different data structures?"
    params:
      keywords:
        - - schnell
          - fast
          - quick
          - langsam
          - slow
          - tempo
          - speed
        - - einfüg
          - such
          - zugriff
          - insert
          - search
          - access
          - find
        - - aufgabe
          - zweck
          - stärke
          - kompromiss
          - task
          - purpose
          - strength
          - trade
      sample: "Each structure is fast at something different: lists at access, stacks at undoing, hash tables at searching. You choose the best trade-off for the task."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: Balanced trees such as **AVL trees** rotate themselves into shape on every insert. So the height always stays around log₂ n – even when numbers arrive sorted.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Databases use B-trees with up to 100 children per node. How many levels are needed for 100 million entries?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 27
        misconception: binary
        text: That is what a binary tree would need. With 100 children per node it is much flatter.
    hints:
      - Each level multiplies the reachable entries by 100.
      - $100^4$ = $10^8$.
    explanation: $100^4$ = 100 million. Four levels means four disk reads – that is why B-trees are the heart of almost every database.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: "A heap stores a binary tree in an array: the children of slot i are at 2i + 1 and 2i + 2. Where is the left child of slot {{i}}?"
    answer:
      value: "{{2 * i + 1}}"
    feedback:
      - when: numval(state.input) == 2 * i + 2
        misconception: left-right
        text: That is the right child.
    hints:
      - Plug i = {{i}} into 2i + 1.
      - 2 · {{i}} + 1.
    explanation: 2 · {{i}} + 1 = {{2 * i + 1}}. No pointers at all – the shape of the tree lives in the arithmetic. Priority queues work this way.
    difficulty: 3
    variants:
      params:
        i: int[2,40]
      defaults:
        i: 6

  - kind: problem
    id: cs-x4
    depth: 3
    widget: choice
    prompt: How do you delete a node with two children from a search tree?
    params:
      options:
        - label: Replace it with the next larger value – the smallest element in the right subtree
          correct: true
        - label: Delete the whole subtree
          feedback: Then every other value in it would be lost.
        - label: Hang both children on the root
          feedback: Then the order smaller-left, bigger-right breaks.
    hints:
      - The replacement must be bigger than everything left and smaller than everything right.
      - The successor in sorted order fits exactly.
    explanation: The successor has at most one child and is easy to remove. The tree's order is preserved.
    difficulty: 3

srs:
  cards_from: [einfuegen, ebenen]
