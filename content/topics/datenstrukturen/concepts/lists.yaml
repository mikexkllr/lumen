id: cs.datastructures.lists
type: concept
title: Listen mit Nummern
summary: Springen statt suchen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Im Kino hast du Reihe 7, Platz 12. Wie findest du deinen Platz?
    params:
      options:
        - label: Direkt hingehen – die Nummer sagt, wo
          correct: true
        - label: Jeden Sitz einzeln prüfen
          feedback: Dafür gibt es ja die Nummern.
        - label: Jemanden fragen
          feedback: Die Nummer reicht völlig.
    hints:
      - Wozu sind die Plätze nummeriert?
    explanation: Mit einer Nummer springt man sofort an die richtige Stelle.

  - kind: explain
    id: s1
    body: |
      In einer **Liste** (Array) hat jedes Element eine Nummer. Mit der Nummer springt der Computer sofort hin – egal, wie lang die Liste ist.

  - kind: problem
    id: springen
    widget: choice
    prompt: Wie lange dauert der Zugriff auf Element Nr. 500 000 einer Liste?
    params:
      options:
        - { label: Genauso kurz wie auf Element Nr. 1, correct: true }
        - { label: "500 000-mal so lang", feedback: "Mit der Nummer rechnet der Computer die Speicherstelle direkt aus." }
    hints:
      - Muss der Computer die Liste dafür durchlaufen?
    explanation: Die Adresse ist Start plus Nummer mal Elementgröße – eine einzige Rechnung.

  - kind: problem
    id: suchen
    widget: numeric
    prompt: Eine unsortierte Liste hat {{n}} Namen. Wie viele musst du im schlimmsten Fall ansehen, um einen bestimmten zu finden?
    params: { unit: Namen }
    answer: { value: "{{n}}" }
    hints:
      - Der Name könnte ganz am Ende stehen.
    explanation: "Ohne Ordnung hilft nichts – im schlimmsten Fall alle {{n}}."
    variants:
      params: { n: "choice[100,1000,5000,20000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: vorne
    widget: choice
    prompt: Du fügst ganz vorne in eine Liste mit einer Million Elementen etwas ein. Warum ist das langsam?
    params:
      options:
        - { label: Alle anderen müssen eine Nummer weiterrücken., correct: true }
        - { label: Die Liste muss neu sortiert werden., feedback: "Sortiert wird nichts – aber jede Nummer ändert sich." }
    hints:
      - Welche Nummer hat das bisher erste Element danach?
    explanation: Eine Million Elemente verschieben – das kostet Zeit.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: Die Liste ist [7, 3, 9, 4]. Gezählt wird ab 0. Welche Zahl steht an Position 2?
    answer:
      value: 9
    hints:
      - Position 0 ist die 7, Position 1 die 3.
    explanation: Die 9. Fast alle Programmiersprachen zählen ab 0.

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Geht das in einer Liste schnell oder langsam?
    params:
      buckets:
        - id: b1
          label: Schnell
        - id: b2
          label: Langsam
      items:
        - label: Element Nummer 500 lesen
          bucket: b1
        - label: Am Ende etwas anhängen
          bucket: b1
        - label: Ganz vorn etwas einfügen
          bucket: b2
        - label: Unsortiert einen Wert suchen
          bucket: b2
    hints:
      - Wobei müssen viele Elemente angefasst werden?
    explanation: "Vorn einfügen heißt: alle anderen rücken. Suchen heißt: alle ansehen."

  - kind: problem
    id: mix-c3
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Mit der [[Nummer]] springt der Computer sofort zum Element. Fügt man vorn etwas ein, müssen alle anderen [[rücken]].
      distractors:
        - Farbe
        - warten

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In einer **verketteten Liste** kennt jedes Element nur seinen Nachfolger. Was geht damit schnell?
    params:
      options:
        - label: Vorne einfügen – niemand muss aufrücken
          correct: true
        - label: Auf Element Nr. 500 000 springen
          feedback: Man muss sich von vorn durchhangeln.
        - label: Binäre Suche
          feedback: Die braucht den direkten Sprung in die Mitte.
    hints:
      - Man hängt einfach einen neuen Anfang davor.
    explanation: "Array und verkettete Liste tauschen Stärken: schneller Zugriff gegen schnelles Einfügen."
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Warum ist der Zugriff so schnell? Die **Adresse** jedes Elements lässt sich ausrechnen: Anfang + Nummer · Größe. Eine Rechnung statt einer Suche – egal, wie lang die Liste ist."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Ein Array beginnt bei Adresse 1000, jedes Element ist 4 Byte groß. An welcher Adresse liegt Element Nr. {{i}}? Gezählt wird ab 0.
    answer:
      value: "{{1000 + 4 * i}}"
    feedback:
      - when: numval(state.input) == 1000 + 4 * (i - 1)
        misconception: off-by-one
        text: "Gezählt wird ab 0: Element 0 liegt bei 1000."
      - when: numval(state.input) == 1000 + i
        misconception: forgot-size
        text: Jedes Element belegt 4 Byte, nicht eins.
    hints:
      - Element 0 liegt bei 1000, Element 1 bei 1004.
      - 1000 + {{i}} · 4.
    explanation: "1000 + {{i}} · 4 = {{1000 + 4 * i}}. Darum zählen viele Sprachen ab 0: Die Nummer ist der Abstand vom Anfang."
    difficulty: 2
    variants:
      params:
        i: int[3,50]
      defaults:
        i: 10

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Du liest sehr oft das 1000. Element und fügst nur selten etwas ein. Welche Struktur passt?
    params:
      options:
        - label: Ein Array
          correct: true
        - label: Eine verkettete Liste
          feedback: Bis zum 1000. Element müsste man 999 Nachfolgern folgen.
        - label: Egal
          feedback: Der Unterschied ist O(1) gegen O(n).
    hints:
      - Was kann ein Array besonders schnell?
      - Was kann eine verkettete Liste besonders schnell?
    explanation: Arrays sind stark beim Zugriff, verkettete Listen beim Einfügen. Die passende Struktur hängt davon ab, was man oft tut.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Liste ist voll. Man legt eine neue an, **doppelt so groß**, und kopiert alles hinüber. Warum verdoppeln statt nur einen Platz anfügen?
    params:
      options:
        - label: Dann wird nur selten kopiert – im Schnitt bleibt Anhängen blitzschnell
          correct: true
        - label: Weil Computer nur Zweierpotenzen speichern können
          feedback: Sie können beliebige Größen speichern.
        - label: Damit die Liste sortiert bleibt
          feedback: Mit Sortierung hat das nichts zu tun.
    hints:
      - Wie oft müsste man kopieren, wenn man jedes Mal nur einen Platz anfügt?
    explanation: Bei einer Million Elementen wird nur 20-mal kopiert statt eine Million Mal. Das heißt **amortisierte** Laufzeit.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: "Ein Array verdoppelt seine Größe, sobald es voll ist: 1, 2, 4, 8 … Wie viele Elemente werden insgesamt umkopiert, bis es auf 1024 Plätze gewachsen ist?"
    answer:
      value: 1023
    hints:
      - Beim Wachsen von 1 auf 2 wird 1 Element kopiert, von 2 auf 4 zwei …
      - 1 + 2 + 4 + … + 512.
    explanation: 1 + 2 + … + 512 = 1023 – weniger als eine Kopie pro Element. Im Schnitt kostet Anfügen also O(1), obwohl einzelne Schritte teuer sind.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Arrays sind in der Praxis oft schneller als verkettete Listen – sogar beim einfachen Durchlaufen. Warum?
    params:
      options:
        - label: Die Elemente liegen nebeneinander, der Prozessor lädt sie blockweise in den Cache
          correct: true
        - label: Weil verkettete Listen mehr Elemente haben
          feedback: Beide speichern dieselben Elemente.
        - label: Weil Arrays sortiert sind
          feedback: Arrays sind nicht von selbst sortiert.
    hints:
      - Wo liegen die Glieder einer verketteten Liste im Speicher?
      - Verstreut – jeder Sprung kann den Cache verfehlen.
    explanation: Ein Cache-Fehlgriff kostet rund 100-mal so viel wie ein Treffer. Nebeneinander liegende Daten sind darum viel schneller, auch bei gleichem O.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Array und verketteter Liste.
    params:
      keywords:
        - - nummer
          - index
          - position
          - adresse
          - address
        - - nachfolger
          - zeiger
          - next
          - pointer
          - verweis
          - link
        - - einfüg
          - insert
          - aufrück
          - shift
      sample: "Im Array liegen alle Elemente nebeneinander. Über die Nummer berechnet man die Adresse und springt direkt hin, aber beim Einfügen vorne müssen alle aufrücken. In der verketteten Liste zeigt jedes Element auf seinen Nachfolger: Einfügen geht schnell, Springen nicht."
    difficulty: 3

srs:
  cards_from: [springen, vorne]
