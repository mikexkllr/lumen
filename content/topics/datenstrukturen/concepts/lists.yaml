id: cs.datastructures.lists
type: concept
title: Listen mit Nummern
summary: Springen statt suchen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Im Kino hast du Reihe 7, Platz 12. Wie findest du deinen Platz?
    params:
      options:
        - label: Direkt hingehen – die Nummer sagt, wo
          correct: true
        - label: Jeden Sitz einzeln prüfen
          feedback: Dafür gibt es ja die Nummern.
        - label: Jemanden fragen
          feedback: Die Nummer reicht völlig.
    hints:
      - Wozu sind die Plätze nummeriert?
    explanation: Mit einer Nummer springt man sofort an die richtige Stelle.


  - kind: explain
    id: s1
    body: |
      In einer **Liste** (Array) hat jedes Element eine Nummer. Mit der Nummer springt der Computer sofort hin – egal, wie lang die Liste ist.

  - kind: problem
    id: springen
    widget: choice
    prompt: Wie lange dauert der Zugriff auf Element Nr. 500 000 einer Liste?
    params:
      options:
        - { label: Genauso kurz wie auf Element Nr. 1, correct: true }
        - { label: "500 000-mal so lang", feedback: "Mit der Nummer rechnet der Computer die Speicherstelle direkt aus." }
    hints:
      - Muss der Computer die Liste dafür durchlaufen?
    explanation: Die Adresse ist Start plus Nummer mal Elementgröße – eine einzige Rechnung.

  - kind: problem
    id: suchen
    widget: numeric
    prompt: Eine unsortierte Liste hat {{n}} Namen. Wie viele musst du im schlimmsten Fall ansehen, um einen bestimmten zu finden?
    params: { unit: Namen }
    answer: { value: "{{n}}" }
    hints:
      - Der Name könnte ganz am Ende stehen.
    explanation: "Ohne Ordnung hilft nichts – im schlimmsten Fall alle {{n}}."
    variants:
      params: { n: "choice[100,1000,5000,20000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: vorne
    widget: choice
    prompt: Du fügst ganz vorne in eine Liste mit einer Million Elementen etwas ein. Warum ist das langsam?
    params:
      options:
        - { label: Alle anderen müssen eine Nummer weiterrücken., correct: true }
        - { label: Die Liste muss neu sortiert werden., feedback: "Sortiert wird nichts – aber jede Nummer ändert sich." }
    hints:
      - Welche Nummer hat das bisher erste Element danach?
    explanation: Eine Million Elemente verschieben – das kostet Zeit.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In einer **verketteten Liste** kennt jedes Element nur seinen Nachfolger. Was geht damit schnell?
    params:
      options:
        - label: Vorne einfügen – niemand muss aufrücken
          correct: true
        - label: Auf Element Nr. 500 000 springen
          feedback: Man muss sich von vorn durchhangeln.
        - label: Binäre Suche
          feedback: Die braucht den direkten Sprung in die Mitte.
    hints:
      - Man hängt einfach einen neuen Anfang davor.
    explanation: "Array und verkettete Liste tauschen Stärken: schneller Zugriff gegen schnelles Einfügen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Liste ist voll. Man legt eine neue an, **doppelt so groß**, und kopiert alles hinüber. Warum verdoppeln statt nur einen Platz anfügen?
    params:
      options:
        - label: Dann wird nur selten kopiert – im Schnitt bleibt Anhängen blitzschnell
          correct: true
        - label: Weil Computer nur Zweierpotenzen speichern können
          feedback: Sie können beliebige Größen speichern.
        - label: Damit die Liste sortiert bleibt
          feedback: Mit Sortierung hat das nichts zu tun.
    hints:
      - Wie oft müsste man kopieren, wenn man jedes Mal nur einen Platz anfügt?
    explanation: Bei einer Million Elementen wird nur 20-mal kopiert statt eine Million Mal. Das heißt **amortisierte** Laufzeit.
    difficulty: 3

srs:
  cards_from: [springen, vorne]
