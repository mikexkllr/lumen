id: cs.datastructures.trees
type: concept
title: Suchbäume
summary: Links kleiner, rechts größer.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: Ich denke mir eine Zahl von 1 bis 1000. Nach jedem Tipp sage ich »größer« oder »kleiner«. Wie viele Versuche brauchst du höchstens?
    params:
      min: 1
      max: 100
    answer:
      value: 10
      tolerance: 2
    explanation: Nur 10. Jede Antwort halbiert die Möglichkeiten.


  - kind: explain
    id: s1
    body: |
      Im **Suchbaum** liegt links von jedem Knoten alles Kleinere, rechts alles Größere. Jede Entscheidung halbiert die Suche – wie die binäre Suche, nur als Struktur.

  - kind: problem
    id: weg
    widget: network
    prompt: Tippe den Weg von der Wurzel 8 bis zur 10.
    params:
      start: n8
      end: n10
      aspect: 0.6
      nodes:
        - { id: n8, x: 50, y: 6, label: "8" }
        - { id: n4, x: 25, y: 50, label: "4" }
        - { id: n12, x: 75, y: 50, label: "12" }
        - { id: n2, x: 10, y: 94, label: "2" }
        - { id: n6, x: 38, y: 94, label: "6" }
        - { id: n10, x: 62, y: 94, label: "10" }
        - { id: n14, x: 90, y: 94, label: "14" }
      edges:
        - { a: n8, b: n4 }
        - { a: n8, b: n12 }
        - { a: n4, b: n2 }
        - { a: n4, b: n6 }
        - { a: n12, b: n10 }
        - { a: n12, b: n14 }
    hints:
      - 10 ist größer als 8 – also rechts.
    explanation: 8 → 12 → 10. Zwei Entscheidungen statt sieben Vergleiche.

  - kind: problem
    id: einfuegen
    widget: choice
    prompt: Wo landet die 7 im Baum oben?
    params:
      options:
        - { label: Rechts unter der 6, correct: true }
        - { label: Links unter der 6, feedback: "7 ist größer als 6 – also rechts." }
        - { label: Rechts unter der 8, feedback: "7 ist kleiner als 8 – es geht nach links." }
    hints:
      - Vergleiche mit 8, dann mit 4, dann mit 6.
    explanation: 7 < 8 → links, 7 > 4 → rechts, 7 > 6 → rechts.

  - kind: problem
    id: ebenen
    widget: numeric
    prompt: Ein ausgewogener Suchbaum hat etwa 1000 Einträge. Wie viele Ebenen tief ist er ungefähr?
    params: { unit: Ebenen }
    answer: { value: 10 }
    hints:
      - Jede Ebene verdoppelt die Zahl der Plätze – $2^{10}$ ist etwa 1000.
    explanation: Rund 10 Ebenen – höchstens 10 Vergleiche für 1000 Einträge.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: In einem Suchbaum liegt links alles Kleinere.
          right: true
        - text: Ein Suchbaum ist immer ausgewogen.
          right: false
          why: Fügt man sortierte Zahlen ein, entsteht eine lange Kette.
        - text: Ein ausgewogener Baum mit einer Million Einträgen ist etwa 20 Ebenen tief.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein vollständiger Binärbaum hat 5 Ebenen. Wie viele Knoten hat er insgesamt?
    answer:
      value: 31
    hints:
      - 1 + 2 + 4 + 8 + 16.
    explanation: 2⁵ − 1 = 31. Jede Ebene hat doppelt so viele Knoten wie die darüber.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum gibt es so viele verschiedene Datenstrukturen?"
    params:
      keywords:
        - - schnell
          - fast
          - quick
          - langsam
          - slow
          - tempo
          - speed
        - - einfüg
          - such
          - zugriff
          - insert
          - search
          - access
          - find
        - - aufgabe
          - zweck
          - stärke
          - kompromiss
          - task
          - purpose
          - strength
          - trade
      sample: "Jede Struktur ist bei etwas anderem schnell: Listen beim Zugriff, Stapel beim Rückgängigmachen, Hash-Tabellen beim Suchen. Man wählt je nach Aufgabe den besten Kompromiss."
    difficulty: 3

srs:
  cards_from: [einfuegen, ebenen]
