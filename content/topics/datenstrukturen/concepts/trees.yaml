id: cs.datastructures.trees
type: concept
title: Suchbäume
summary: Links kleiner, rechts größer.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Bäume stehen kopf
    body: "Informatiker zeichnen Bäume verkehrt herum: die **Wurzel** oben, die Blätter unten. Deck die Karten auf. Wo wachsen solche Bäume in deinem Alltag?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📁
            front: Deine Ordner
            back: "Ordner in Ordnern in Ordnern: Dein Speicher ist ein Baum."
          - icon: 🌐
            front: Jede Webseite
            back: Der Browser baut aus jeder Seite einen Baum aus Überschriften, Absätzen und Bildern.
          - icon: ♟️
            front: Der Schachcomputer
            back: Er durchsucht einen Baum aller möglichen Züge – Millionen Knoten pro Sekunde.
          - icon: 🏆
            front: Das Turnier
            back: "Ein K.-o.-Turnier ist ein Baum: Ganz oben steht der Sieger."

  - kind: problem
    id: hook
    widget: estimate
    prompt: Ich denke mir eine Zahl von 1 bis 1000. Nach jedem Tipp sage ich »größer« oder »kleiner«. Wie viele Versuche brauchst du höchstens?
    params:
      min: 1
      max: 100
    answer:
      value: 10
      tolerance: 2
    explanation: Nur 10. Jede Antwort halbiert die Möglichkeiten.

  - kind: explain
    id: s1
    body: |
      Im **Suchbaum** liegt links von jedem Knoten alles Kleinere, rechts alles Größere. Jede Entscheidung halbiert die Suche – wie die binäre Suche, nur als Struktur.

  - kind: problem
    id: weg
    widget: network
    prompt: Tippe den Weg von der Wurzel 8 bis zur 10.
    params:
      start: n8
      end: n10
      aspect: 0.6
      nodes:
        - { id: n8, x: 50, y: 6, label: "8" }
        - { id: n4, x: 25, y: 50, label: "4" }
        - { id: n12, x: 75, y: 50, label: "12" }
        - { id: n2, x: 10, y: 94, label: "2" }
        - { id: n6, x: 38, y: 94, label: "6" }
        - { id: n10, x: 62, y: 94, label: "10" }
        - { id: n14, x: 90, y: 94, label: "14" }
      edges:
        - { a: n8, b: n4 }
        - { a: n8, b: n12 }
        - { a: n4, b: n2 }
        - { a: n4, b: n6 }
        - { a: n12, b: n10 }
        - { a: n12, b: n14 }
    hints:
      - 10 ist größer als 8 – also rechts.
    explanation: 8 → 12 → 10. Zwei Entscheidungen statt sieben Vergleiche.

  - kind: problem
    id: einfuegen
    widget: choice
    prompt: Wo landet die 7 im Baum oben?
    params:
      options:
        - { label: Rechts unter der 6, correct: true }
        - { label: Links unter der 6, feedback: "7 ist größer als 6 – also rechts." }
        - { label: Rechts unter der 8, feedback: "7 ist kleiner als 8 – es geht nach links." }
    hints:
      - Vergleiche mit 8, dann mit 4, dann mit 6.
    explanation: 7 < 8 → links, 7 > 4 → rechts, 7 > 6 → rechts.

  - kind: problem
    id: ebenen
    widget: numeric
    prompt: Ein ausgewogener Suchbaum hat etwa 1000 Einträge. Wie viele Ebenen tief ist er ungefähr?
    params: { unit: Ebenen }
    answer: { value: 10 }
    hints:
      - Jede Ebene verdoppelt die Zahl der Plätze – $2^{10}$ ist etwa 1000.
    explanation: Rund 10 Ebenen – höchstens 10 Vergleiche für 1000 Einträge.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: In einem Suchbaum liegt links alles Kleinere.
          right: true
        - text: Ein Suchbaum ist immer ausgewogen.
          right: false
          why: Fügt man sortierte Zahlen ein, entsteht eine lange Kette.
        - text: Ein ausgewogener Baum mit einer Million Einträgen ist etwa 20 Ebenen tief.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein vollständiger Binärbaum hat 5 Ebenen. Wie viele Knoten hat er insgesamt?
    answer:
      value: 31
    hints:
      - 1 + 2 + 4 + 8 + 16.
    explanation: 2⁵ − 1 = 31. Jede Ebene hat doppelt so viele Knoten wie die darüber.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: network
    prompt: Ein größerer Suchbaum. Wo steckt die 35? Tippe den Suchweg von der Wurzel 50 an.
    params:
      start: n50
      end: n35
      aspect: 0.7
      nodes:
        - id: n50
          x: 50
          y: 6
          label: "50"
        - id: n30
          x: 26
          y: 36
          label: "30"
        - id: n70
          x: 74
          y: 36
          label: "70"
        - id: n20
          x: 10
          y: 66
          label: "20"
        - id: n40
          x: 40
          y: 66
          label: "40"
        - id: n60
          x: 60
          y: 66
          label: "60"
        - id: n80
          x: 90
          y: 66
          label: "80"
        - id: n35
          x: 30
          y: 96
          label: "35"
      edges:
        - a: n50
          b: n30
        - a: n50
          b: n70
        - a: n30
          b: n20
        - a: n30
          b: n40
        - a: n70
          b: n60
        - a: n70
          b: n80
        - a: n40
          b: n35
    hints:
      - 35 ist kleiner als 50 – also links.
      - "Bei 30: größer, also rechts. Bei 40: kleiner, also links."
    explanation: 50 → 30 → 40 → 35. Drei Entscheidungen, und jede schließt einen ganzen Teilbaum aus.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Du fügst 1, 2, 3, …, 1000 der Reihe nach in einen einfachen Suchbaum ein. Wie viele Ebenen hat er danach?
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 10
        misconception: assume-balanced
        text: So wäre es bei einem ausgewogenen Baum. Hier hängt jede neue Zahl rechts unten an.
    hints:
      - Wohin kommt die 2, wenn die 1 die Wurzel ist? Wohin die 3?
      - Jede Zahl ist größer als alle davor.
    explanation: "Der Baum wird zur langen Kette: 1000 Ebenen. Suchen kostet dann O(n) wie in einer Liste."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Du liest einen Suchbaum in der Reihenfolge »linker Teilbaum – Knoten – rechter Teilbaum«. Was kommt heraus?
    params:
      options:
        - label: Alle Werte sortiert
          correct: true
        - label: Die Werte in Einfügereihenfolge
          feedback: Die Form des Baums vergisst die Einfügereihenfolge.
        - label: Erst alle Blätter, dann die Wurzel
          feedback: Das wäre eine andere Reihenfolge.
    hints:
      - Links ist alles kleiner, rechts alles größer.
      - "Probier es am Baum oben: 20, 30, 35, 40 …"
    explanation: Diese In-Order-Reihenfolge liefert sortierte Werte. Ein Suchbaum ist also eine Liste, die immer sortiert bleibt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum gibt es so viele verschiedene Datenstrukturen?"
    params:
      keywords:
        - - schnell
          - fast
          - quick
          - langsam
          - slow
          - tempo
          - speed
        - - einfüg
          - such
          - zugriff
          - insert
          - search
          - access
          - find
        - - aufgabe
          - zweck
          - stärke
          - kompromiss
          - task
          - purpose
          - strength
          - trade
      sample: "Jede Struktur ist bei etwas anderem schnell: Listen beim Zugriff, Stapel beim Rückgängigmachen, Hash-Tabellen beim Suchen. Man wählt je nach Aufgabe den besten Kompromiss."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: Ausgewogene Bäume wie **AVL-Bäume** drehen sich beim Einfügen selbst zurecht. So bleibt die Höhe immer bei etwa log₂ n – auch wenn die Zahlen sortiert ankommen.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Datenbanken nutzen B-Bäume mit bis zu 100 Kindern pro Knoten. Wie viele Ebenen braucht man für 100 Millionen Einträge?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 27
        misconception: binary
        text: So viele bräuchte ein Binärbaum. Mit 100 Kindern pro Knoten geht es viel flacher.
    hints:
      - Jede Ebene verhundertfacht die Zahl der erreichbaren Einträge.
      - $100^4$ = $10^8$.
    explanation: $100^4$ = 100 Millionen. Vier Ebenen heißt vier Festplattenzugriffe – darum sind B-Bäume das Herz fast jeder Datenbank.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: "Ein Heap speichert einen Binärbaum in einem Array: Die Kinder von Platz i liegen bei 2i + 1 und 2i + 2. Wo liegt das linke Kind von Platz {{i}}?"
    answer:
      value: "{{2 * i + 1}}"
    feedback:
      - when: numval(state.input) == 2 * i + 2
        misconception: left-right
        text: Das ist das rechte Kind.
    hints:
      - Setze i = {{i}} in 2i + 1 ein.
      - 2 · {{i}} + 1.
    explanation: 2 · {{i}} + 1 = {{2 * i + 1}}. Ganz ohne Zeiger – die Form des Baums steckt in der Rechnung. So arbeiten Prioritätswarteschlangen.
    difficulty: 3
    variants:
      params:
        i: int[2,40]
      defaults:
        i: 6

  - kind: problem
    id: cs-x4
    depth: 3
    widget: choice
    prompt: Wie löscht man einen Knoten mit zwei Kindern aus einem Suchbaum?
    params:
      options:
        - label: Man ersetzt ihn durch den nächstgrößeren Wert – das kleinste Element im rechten Teilbaum
          correct: true
        - label: Man löscht den ganzen Teilbaum
          feedback: Dann gingen auch alle anderen Werte darin verloren.
        - label: Man hängt beide Kinder an die Wurzel
          feedback: Dann stimmt die Ordnung links kleiner, rechts größer nicht mehr.
    hints:
      - Der Ersatz muss größer als alles links und kleiner als alles rechts sein.
      - Der Nachfolger in der sortierten Reihenfolge passt genau.
    explanation: Der Nachfolger hat höchstens ein Kind und lässt sich leicht entfernen. Die Ordnung des Baums bleibt erhalten.
    difficulty: 3

srs:
  cards_from: [einfuegen, ebenen]
