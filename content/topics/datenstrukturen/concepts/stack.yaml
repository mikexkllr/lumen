id: cs.datastructures.stack
type: concept
title: Der Stapel
summary: Zuletzt rein, zuerst raus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Du stapelst drei Teller: erst Rot, dann Grün, dann Blau. Welchen nimmst du zuerst wieder herunter?"
    params:
      options:
        - label: Blau
          correct: true
        - label: Rot
          feedback: Der liegt ganz unten.
        - label: Grün
          feedback: Der liegt in der Mitte.
    hints:
      - Welcher liegt oben?
    explanation: Zuletzt drauf, zuerst runter.

  - kind: explain
    id: s1
    body: |
      Ein **Stapel** (Stack) funktioniert wie ein Tellerstapel: Was zuletzt oben drauf kommt, nimmt man zuerst wieder herunter.

  - kind: problem
    id: runter
    widget: order
    prompt: Du legst A, dann B, dann C auf einen Stapel. In welcher Reihenfolge nimmst du sie herunter?
    params:
      items:
        - { label: C }
        - { label: B }
        - { label: A }
    hints:
      - Was liegt ganz oben?
    explanation: C kam zuletzt, also liegt C oben und kommt zuerst.

  - kind: problem
    id: zurueck
    widget: choice
    prompt: Im Browser besuchst du Seite 1, dann 2, dann 3. Du drückst zweimal »Zurück«. Wo bist du?
    params:
      options:
        - { label: Auf Seite 1, correct: true }
        - { label: Auf Seite 2, feedback: "Einmal Zurück führt zu Seite 2, zweimal weiter." }
        - { label: Auf Seite 3, feedback: "Von dort bist du ja gestartet." }
    hints:
      - Der Verlauf ist ein Stapel – oben liegt Seite 3.
    explanation: Zwei Seiten werden vom Stapel genommen – übrig bleibt Seite 1 oben.

  - kind: problem
    id: wo
    widget: choice
    prompt: Welche Funktion arbeitet mit einem Stapel?
    params:
      options:
        - { label: Rückgängig machen, correct: true }
        - { label: Die Druckerwarteschlange, feedback: "Dort kommt dran, wer zuerst kam – das ist eine Schlange." }
        - { label: Alphabetisch sortieren, feedback: "Sortieren braucht keine feste Ein- und Ausgabe-Reihenfolge." }
    hints:
      - Was wird beim Rückgängigmachen zuerst zurückgenommen?
    explanation: Rückgängig nimmt immer die letzte Änderung zuerst zurück.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Rückgängig-Funktion im Editor
          right: true
        - text: Schlange an der Kasse
          right: false
        - text: Zurück-Knopf im Browser
          right: true
        - text: Tellerstapel in der Kantine
          right: true
      left: Kein Stapel
      right: Stapel

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Beim Stapel gilt: zuletzt [[hinein]], zuerst [[heraus]]. Die Rückgängig-Taste arbeitet genau so."
      distractors:
        - unten
        - sortiert

  - kind: problem
    id: mix-c2
    widget: numeric
    prompt: Du legst nacheinander 1, 2 und 3 auf den Stapel. Dann nimmst du zweimal etwas herunter. Welche Zahl liegt noch da?
    answer:
      value: 1
    hints:
      - Zuerst geht die 3, dann die 2.
    explanation: Die 1 kam zuerst und liegt ganz unten.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Ein Programm prüft, ob Klammern stimmen: ( [ ] ) ist richtig, ( [ ) ] nicht. Wie hilft ein Stapel?"
    params:
      options:
        - label: Jede öffnende Klammer kommt auf den Stapel – jede schließende muss zur obersten passen
          correct: true
        - label: Man zählt nur, ob es gleich viele auf und zu gibt
          feedback: ( [ ) ] hat gleich viele und ist trotzdem falsch.
        - label: Man sortiert die Klammern
          feedback: Die Reihenfolge ist gerade das Entscheidende.
    hints:
      - Die zuletzt geöffnete Klammer muss zuerst geschlossen werden.
    explanation: Zuletzt rein, zuerst raus – genau das Stapelprinzip. So prüft jeder Compiler deinen Code.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Funktion ruft sich immer wieder selbst auf, ohne aufzuhören. Die Fehlermeldung lautet »Stack Overflow«. Was ist passiert?
    params:
      options:
        - label: Jeder Aufruf legt seine Daten auf einen Stapel – und der ist voll
          correct: true
        - label: Die Festplatte ist voll
          feedback: Es geht um Arbeitsspeicher für Funktionsaufrufe.
        - label: Der Prozessor ist überhitzt
          feedback: Der Speicher ist das Problem, nicht die Temperatur.
    hints:
      - Wo merkt sich der Computer, wohin er nach einem Aufruf zurückkehren soll?
    explanation: "Der **Aufrufstapel**: Jeder Aufruf kommt obendrauf und wird erst beim Zurückkehren entfernt."
    difficulty: 3

srs:
  cards_from: [runter, zurueck]
