id: cs.datastructures.queue
type: concept
title: The Queue
summary: First come, first served.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Waiting with a system
    body: "Queues are annoying at the checkout. Inside a computer they keep order. Flip the cards: where does data wait **in a queue**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📺
            front: The video stream
            back: Your phone loads the next few seconds in advance and keeps them ready in a queue.
          - icon: ⌨️
            front: The keyboard
            back: If you type faster than the computer reacts, the keys wait in a queue.
          - icon: 📨
            front: Messages with no signal
            back: If you send three messages with no signal, they wait until you have reception again.

  - kind: problem
    id: hook
    widget: choice
    prompt: "At the checkout: first comes Ana, then Ben, then Cem. Who is served first?"
    params:
      options:
        - label: Ana
          correct: true
        - label: Cem
          feedback: He came last.
        - label: Ben
          feedback: Someone is still ahead of him.
    hints:
      - Who has waited longest?
    explanation: First come, first served.

  - kind: explain
    id: s1
    body: |
      A **queue** is fair: first come, first served. Newcomers join at the back, and service happens at the front.

  - kind: problem
    id: kasse
    widget: order
    prompt: Ana, Ben, and Cem line up at the checkout one after another. In what order are they served?
    params:
      items:
        - { label: Ana }
        - { label: Ben }
        - { label: Cem }
    hints:
      - Who was there first?
    explanation: In exactly the order they arrived.

  - kind: problem
    id: welche
    widget: buckets
    prompt: Stack or queue?
    params:
      buckets: [{ label: Stack }, { label: Queue }]
      items:
        - { label: Undo function, bucket: Stack }
        - { label: Stack of plates, bucket: Stack }
        - { label: Print jobs, bucket: Queue }
        - { label: Supermarket checkout, bucket: Queue }
        - { label: Playlist "play next", bucket: Queue }
    hints:
      - Does the newest or the oldest come first?
    explanation: Stack means newest first. Queue means oldest first.

  - kind: problem
    id: drucker
    widget: numeric
    prompt: "{{n}} jobs wait in the print queue, and each takes {{t}} seconds. When is the last one done?"
    params: { unit: s }
    answer: { value: "{{n * t}}" }
    hints:
      - They all go one after another.
    explanation: "{{n}} · {{t}} = {{n * t}} seconds."
    variants:
      params: { n: "int[3,12]", t: "int[5,30]" }
      defaults: { n: 6, t: 20 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In an emergency room it is not the first arrival who is seen first but the most urgent case. Which data structure fits?
    params:
      options:
        - label: A priority queue
          correct: true
        - label: A stack
          feedback: Then the latest arrival would always go first.
        - label: A normal queue
          feedback: It only considers the order of arrival.
    hints:
      - Every entry carries an urgency.
    explanation: A **priority queue** always hands out the most important element. Sat-navs use it for shortest paths.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: choice
    prompt: enqueue A, enqueue B, dequeue, enqueue C, enqueue D, dequeue. Who is at the front now?
    params:
      options:
        - label: C
          correct: true
        - label: D
          feedback: D came last – it is at the back.
        - label: B
          feedback: B was served at the second dequeue.
    hints:
      - Write down the queue after every command.
      - "[A, B] → [B] → [B, C] → [B, C, D] → …"
    explanation: After the second dequeue, [C, D] is left. C is at the front.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: A **ring buffer** stores a queue in a fixed array. The pointers for front and back run in a circle – using modulo. So nobody ever has to move up.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: A ring buffer has 8 slots (0 to 7). The back pointer is at {{p}}. Where is it after {{k}} new entries?
    answer:
      value: "{{mod(p + k, 8)}}"
    feedback:
      - when: numval(state.input) == p + k
        misconception: no-wrap
        text: After slot 7 it wraps round to 0.
    hints:
      - "Count on: {{p}}, {{p + 1}}, …"
      - Compute ({{p}} + {{k}}) mod 8.
    explanation: ({{p}} + {{k}}) mod 8 = {{mod(p + k, 8)}}.
    difficulty: 2
    variants:
      params:
        p: int[3,7]
        k: int[2,7]
      constraints:
        - p + k > 8
      defaults:
        p: 6
        k: 5

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: Which data structure does breadth-first search use, visiting all neighbours first, then theirs?
    params:
      options:
        - label: A queue – whoever is discovered first is explored first
          correct: true
        - label: A stack
          feedback: A stack makes the search dive deep first – that is depth-first search.
        - label: A hash table
          feedback: It remembers what was visited – it does not decide the order.
    hints:
      - First what is near, then what is far – fairly in turn.
      - Newly found nodes join at the back.
    explanation: The queue makes sure every node at distance 1 comes before those at distance 2. That is how breadth-first search finds paths with the fewest steps.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: At a checkout 2 customers arrive per minute and 3 are served per minute. What share of the time is the checkout busy? In percent, rounded.
    params:
      unit: "%"
    answer:
      value: 67
      tolerance: 1
    hints:
      - Arrival rate divided by service rate.
    explanation: 2/3 ≈ 67%. As utilisation approaches 100%, waiting times explode – as **queueing theory** shows.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: On average 3 customers per minute enter a shop. Each stays 4 minutes. How many customers are inside at the same time on average?
    answer:
      value: 12
    hints:
      - How many come in while one is inside?
      - Arrivals per minute times time spent.
    explanation: "3 · 4 = 12. This is Little's law: L = λ · W. It holds for almost any stable queue – from supermarkets to servers."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: A checkout is {{p}} % busy. With random arrivals there are on average ρ / (1 − ρ) customers, with ρ = {{p / 100}}. How many is that?
    answer:
      value: "{{p / (100 - p)}}"
    hints:
      - "Plug in ρ: {{p / 100}} / (1 − {{p / 100}})."
      - 1 − {{p / 100}} = {{(100 - p) / 100}}.
    explanation: "{{p / 100}} / {{(100 - p) / 100}} = {{p / (100 - p)}}. Near 100 % the queue explodes: at 95 % it is already 19."
    difficulty: 3
    variants:
      params:
        p: choice[50,75,80,90,95]
      defaults:
        p: 75

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: What happens if more customers keep arriving than can be served?
    params:
      options:
        - label: The queue grows without limit
          correct: true
        - label: It settles at a fixed length
          feedback: That only happens if fewer arrive than are served.
        - label: The waiting time stays the same
          feedback: Each new customer waits longer than the last.
    hints:
      - Each minute more is added than leaves.
      - It is like a bathtub whose drain is too small.
    explanation: With load above 100 % there is no steady state. Servers then reject requests instead of collecting them forever.
    difficulty: 3

srs:
  cards_from: [kasse, welche]
