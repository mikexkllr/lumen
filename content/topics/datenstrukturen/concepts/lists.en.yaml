id: cs.datastructures.lists
type: concept
title: Numbered Lists
summary: Jump instead of search.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      In a **list** (array), every element has a number. With the number, the computer jumps straight to it, no matter how long the list is.

  - kind: problem
    id: springen
    widget: choice
    prompt: How long does it take to access element no. 500,000 of a list?
    params:
      options:
        - { label: Just as short as element no. 1, correct: true }
        - { label: "500,000 times as long", feedback: "With the number, the computer calculates the memory location directly." }
    hints:
      - Does the computer have to walk through the list for this?
    explanation: The address is the start plus the number times the element size. That is a single calculation.

  - kind: problem
    id: suchen
    widget: numeric
    prompt: An unsorted list has {{n}} names. How many must you look at in the worst case to find a specific one?
    params: { unit: names }
    answer: { value: "{{n}}" }
    hints:
      - The name could be at the very end.
    explanation: "Without order, nothing helps. In the worst case, all {{n}}."
    variants:
      params: { n: "choice[100,1000,5000,20000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: vorne
    widget: choice
    prompt: You insert something at the very front of a list with a million elements. Why is that slow?
    params:
      options:
        - { label: Every other element must move up one number., correct: true }
        - { label: The list must be re-sorted., feedback: "Nothing gets sorted, but every number changes." }
    hints:
      - What number does the former first element have afterward?
    explanation: Moving a million elements takes time.

srs:
  cards_from: [springen, vorne]
