id: cs.datastructures.lists
type: concept
title: Numbered Lists
summary: Jump instead of search.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: At the cinema you have row 7, seat 12. How do you find your seat?
    params:
      options:
        - label: Go straight there – the number says where
          correct: true
        - label: Check every seat
          feedback: That is what the numbers are for.
        - label: Ask someone
          feedback: The number is all you need.
    hints:
      - Why are the seats numbered?
    explanation: With a number you jump straight to the right place.

  - kind: explain
    id: s1
    body: |
      In a **list** (array), every element has a number. With the number, the computer jumps straight to it, no matter how long the list is.

  - kind: problem
    id: springen
    widget: choice
    prompt: How long does it take to access element no. 500,000 of a list?
    params:
      options:
        - { label: Just as short as element no. 1, correct: true }
        - { label: "500,000 times as long", feedback: "With the number, the computer calculates the memory location directly." }
    hints:
      - Does the computer have to walk through the list for this?
    explanation: The address is the start plus the number times the element size. That is a single calculation.

  - kind: problem
    id: suchen
    widget: numeric
    prompt: An unsorted list has {{n}} names. How many must you look at in the worst case to find a specific one?
    params: { unit: names }
    answer: { value: "{{n}}" }
    hints:
      - The name could be at the very end.
    explanation: "Without order, nothing helps. In the worst case, all {{n}}."
    variants:
      params: { n: "choice[100,1000,5000,20000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: vorne
    widget: choice
    prompt: You insert something at the very front of a list with a million elements. Why is that slow?
    params:
      options:
        - { label: Every other element must move up one number., correct: true }
        - { label: The list must be re-sorted., feedback: "Nothing gets sorted, but every number changes." }
    hints:
      - What number does the former first element have afterward?
    explanation: Moving a million elements takes time.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: The list is [7, 3, 9, 4]. Counting starts at 0. Which number is at position 2?
    answer:
      value: 9
    hints:
      - Position 0 is the 7, position 1 the 3.
    explanation: The 9. Almost all programming languages count from 0.

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Is this fast or slow in a list?
    params:
      buckets:
        - id: b1
          label: Fast
        - id: b2
          label: Slow
      items:
        - label: Read element number 500
          bucket: b1
        - label: Append something at the end
          bucket: b1
        - label: Insert something at the very front
          bucket: b2
        - label: Search a value when unsorted
          bucket: b2
    hints:
      - Where do many elements have to be touched?
    explanation: "Inserting at the front means: all others move. Searching means: look at all."

  - kind: problem
    id: mix-c3
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: With the [[number]] the computer jumps straight to the element. If you insert at the front, all others must [[shift]].
      distractors:
        - colour
        - wait

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In a **linked list** each element only knows its successor. What is fast with it?
    params:
      options:
        - label: Inserting at the front – nobody has to shift
          correct: true
        - label: Jumping to element no. 500,000
          feedback: You have to walk through from the front.
        - label: Binary search
          feedback: It needs the direct jump to the middle.
    hints:
      - You simply attach a new head in front.
    explanation: "Array and linked list trade strengths: fast access versus fast insertion."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A list is full. A new one, **twice as large**, is created and everything is copied over. Why double instead of adding just one slot?
    params:
      options:
        - label: Then copying is rare – on average appending stays lightning fast
          correct: true
        - label: Because computers can only store powers of two
          feedback: They can store any size.
        - label: So that the list stays sorted
          feedback: It has nothing to do with sorting.
    hints:
      - How often would you copy if you added just one slot each time?
    explanation: For a million elements you copy only 20 times instead of a million. This is called **amortised** running time.
    difficulty: 3

srs:
  cards_from: [springen, vorne]
