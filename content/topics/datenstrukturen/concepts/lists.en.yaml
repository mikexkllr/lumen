id: cs.datastructures.lists
type: concept
title: Numbered Lists
summary: Jump instead of search.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Numbered compartments
    body: "Your photos, your chats, your playlist: apps keep them in **lists**. Every element has a number – counting starts at 0. Drag the bars to change the values."
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
        values:
          - 5
          - 8
          - 2
          - 6
          - 1
          - 4
        editable:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
        min: 0
        max: 10

  - kind: problem
    id: hook
    widget: choice
    prompt: At the cinema you have row 7, seat 12. How do you find your seat?
    params:
      options:
        - label: Go straight there – the number says where
          correct: true
        - label: Check every seat
          feedback: That is what the numbers are for.
        - label: Ask someone
          feedback: The number is all you need.
    hints:
      - Why are the seats numbered?
    explanation: With a number you jump straight to the right place.

  - kind: explain
    id: s1
    body: |
      In a **list** (array), every element has a number. With the number, the computer jumps straight to it, no matter how long the list is.

  - kind: problem
    id: springen
    widget: choice
    prompt: How long does it take to access element no. 500,000 of a list?
    params:
      options:
        - { label: Just as short as element no. 1, correct: true }
        - { label: "500,000 times as long", feedback: "With the number, the computer calculates the memory location directly." }
    hints:
      - Does the computer have to walk through the list for this?
    explanation: The address is the start plus the number times the element size. That is a single calculation.

  - kind: problem
    id: suchen
    widget: numeric
    prompt: An unsorted list has {{n}} names. How many must you look at in the worst case to find a specific one?
    params: { unit: names }
    answer: { value: "{{n}}" }
    hints:
      - The name could be at the very end.
    explanation: "Without order, nothing helps. In the worst case, all {{n}}."
    variants:
      params: { n: "choice[100,1000,5000,20000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: vorne
    widget: choice
    prompt: You insert something at the very front of a list with a million elements. Why is that slow?
    params:
      options:
        - { label: Every other element must move up one number., correct: true }
        - { label: The list must be re-sorted., feedback: "Nothing gets sorted, but every number changes." }
    hints:
      - What number does the former first element have afterward?
    explanation: Moving a million elements takes time.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: The list is [7, 3, 9, 4]. Counting starts at 0. Which number is at position 2?
    answer:
      value: 9
    hints:
      - Position 0 is the 7, position 1 the 3.
    explanation: The 9. Almost all programming languages count from 0.

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Is this fast or slow in a list?
    params:
      buckets:
        - id: b1
          label: Fast
        - id: b2
          label: Slow
      items:
        - label: Read element number 500
          bucket: b1
        - label: Append something at the end
          bucket: b1
        - label: Insert something at the very front
          bucket: b2
        - label: Search a value when unsorted
          bucket: b2
    hints:
      - Where do many elements have to be touched?
    explanation: "Inserting at the front means: all others move. Searching means: look at all."

  - kind: problem
    id: mix-c3
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: With the [[number]] the computer jumps straight to the element. If you insert at the front, all others must [[shift]].
      distractors:
        - colour
        - wait

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: The list is [5, 2, 7, 1, 4], counting from 0. Change the element at position 3 to 8.
    params:
      labels:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
      values:
        - 5
        - 2
        - 7
        - 1
        - 4
      editable:
        - 0
        - 1
        - 2
        - 3
        - 4
      min: 0
      max: 10
    answer:
      values:
        - 5
        - 2
        - 7
        - 8
        - 4
    hints:
      - Position 0 is the first bar.
      - So position 3 is the fourth bar – it holds the 1 right now.
    explanation: "With the index you jump straight there: list[3] = 8. The other values stay as they are."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In a **linked list** each element only knows its successor. What is fast with it?
    params:
      options:
        - label: Inserting at the front – nobody has to shift
          correct: true
        - label: Jumping to element no. 500,000
          feedback: You have to walk through from the front.
        - label: Binary search
          feedback: It needs the direct jump to the middle.
    hints:
      - You simply attach a new head in front.
    explanation: "Array and linked list trade strengths: fast access versus fast insertion."
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Why is access so fast? The **address** of every element can be computed: start + index · size. A calculation instead of a search – however long the list."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: An array starts at address 1000 and each element is 4 bytes. At what address is element no. {{i}}? Counting starts at 0.
    answer:
      value: "{{1000 + 4 * i}}"
    feedback:
      - when: numval(state.input) == 1000 + 4 * (i - 1)
        misconception: off-by-one
        text: "Counting starts at 0: element 0 is at 1000."
      - when: numval(state.input) == 1000 + i
        misconception: forgot-size
        text: Each element takes 4 bytes, not one.
    hints:
      - Element 0 is at 1000, element 1 at 1004.
      - 1000 + {{i}} · 4.
    explanation: "1000 + {{i}} · 4 = {{1000 + 4 * i}}. That is why many languages count from 0: the index is the offset from the start."
    difficulty: 2
    variants:
      params:
        i: int[3,50]
      defaults:
        i: 10

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: You read the 1000th element very often and rarely insert anything. Which structure fits?
    params:
      options:
        - label: An array
          correct: true
        - label: A linked list
          feedback: To reach the 1000th element you would follow 999 links.
        - label: It does not matter
          feedback: The difference is O(1) versus O(n).
    hints:
      - What can an array do especially fast?
      - What can a linked list do especially fast?
    explanation: Arrays are strong at access, linked lists at insertion. The right structure depends on what you do often.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A list is full. A new one, **twice as large**, is created and everything is copied over. Why double instead of adding just one slot?
    params:
      options:
        - label: Then copying is rare – on average appending stays lightning fast
          correct: true
        - label: Because computers can only store powers of two
          feedback: They can store any size.
        - label: So that the list stays sorted
          feedback: It has nothing to do with sorting.
    hints:
      - How often would you copy if you added just one slot each time?
    explanation: For a million elements you copy only 20 times instead of a million. This is called **amortised** running time.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: "An array doubles in size whenever it is full: 1, 2, 4, 8 … How many elements are copied in total until it has grown to 1024 slots?"
    answer:
      value: 1023
    hints:
      - Growing from 1 to 2 copies 1 element, from 2 to 4 two …
      - 1 + 2 + 4 + … + 512.
    explanation: 1 + 2 + … + 512 = 1023 – less than one copy per element. On average appending costs O(1), even though single steps are expensive.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: In practice arrays are often faster than linked lists – even for a simple pass through. Why?
    params:
      options:
        - label: The elements sit side by side, so the processor loads them into the cache in blocks
          correct: true
        - label: Because linked lists have more elements
          feedback: Both store the same elements.
        - label: Because arrays are sorted
          feedback: Arrays are not sorted by themselves.
    hints:
      - Where do the links of a linked list sit in memory?
      - Scattered – every jump can miss the cache.
    explanation: A cache miss costs about 100 times as much as a hit. Data lying side by side is therefore much faster, even with the same O.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between an array and a linked list.
    params:
      keywords:
        - - nummer
          - index
          - position
          - adresse
          - address
        - - nachfolger
          - zeiger
          - next
          - pointer
          - verweis
          - link
        - - einfüg
          - insert
          - aufrück
          - shift
      sample: "In an array all elements sit side by side. From the index you compute the address and jump straight there, but inserting at the front makes everyone shift. In a linked list each element points to its next one: inserting is quick, jumping is not."
    difficulty: 3

srs:
  cards_from: [springen, vorne]
