id: cs.datastructures.hashing
type: concept
title: Hash Tables
summary: Calculate the slot directly.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In the cloakroom your coat hangs on the hook with the number of your tag. How long does the search take?
    params:
      options:
        - label: Not at all – the number leads straight there
          correct: true
        - label: Every coat is checked
          feedback: Then no tags would be needed.
        - label: About half
          feedback: The tag names the exact hook.
    hints:
      - What is written on the tag?
    explanation: Compute the place from the key – that is the idea.

  - kind: explain
    id: s1
    body: |
      A **hash table** calculates from the key which slot an entry belongs in, for example the remainder when dividing by the number of slots. No searching needed.

  - kind: problem
    id: fach
    widget: numeric
    prompt: A name has the numeric value {{v}}. Which of the slots 0 to 9 does it go into, if the slot is the remainder when dividing by 10?
    params: { placeholder: "Slot" }
    answer: { value: "{{mod(v, 10)}}" }
    hints:
      - The remainder when dividing by 10 is the last digit.
    explanation: "{{v}} divided by 10 leaves a remainder of {{mod(v, 10)}}."
    variants:
      params: { v: "int[100,999]" }
      defaults: { v: 437 }

  - kind: problem
    id: kollision
    widget: choice
    prompt: Two names land in the same slot. What happens?
    params:
      options:
        - { label: "The slot holds a small list, and only that list is searched.", correct: true }
        - { label: The older name is deleted., feedback: "No data is lost this way." }
        - { label: The program crashes., feedback: "Collisions are normal and planned for." }
    hints:
      - How many entries fit in one slot?
    explanation: Such a **collision** costs little, as long as the slots don't overflow.

  - kind: problem
    id: warum
    widget: choice
    prompt: Why are hash tables in almost every app?
    params:
      options:
        - { label: Lookups take almost the same short time every time., correct: true }
        - { label: They keep the data sorted., feedback: "The order is exactly what gets lost." }
    hints:
      - How long does finding take with 10 or 10 million entries?
    explanation: Whether it is a password check or a dictionary, it takes one calculation instead of a long search.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A hash table has 100 buckets and 1000 entries, evenly distributed. How many entries are in a bucket on average?
    answer:
      value: 10
    hints:
      - 1000 ÷ 100.
    explanation: 10 per bucket – then searching gets slow. Good tables grow before it gets that full.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: The slot number is the remainder when dividing by 7. The key 23 is in slot 2. Which key between 10 and 20 lands in the same slot?
    answer:
      value: 16
    hints:
      - Subtract 7 from 23.
    explanation: 16 ÷ 7 also has remainder 2. That is called a collision.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: Buckets 0 to 6, bucket = key mod 7. If a bucket is taken, use the next free one. You insert 10, 17 and 24 in turn. In which bucket does 24 end up?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 3
        misconception: ignore-collision
        text: 24 mod 7 is indeed 3 – but 10 is already there.
    hints:
      - All three keys give the same 3 mod 7.
      - 10 takes bucket 3, 17 slides to 4 …
    explanation: 10 → 3, 17 → 4, 24 → 5. This sliding on is called linear probing. Collisions clump together this way.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: The **load factor** is the number of entries divided by the number of buckets. When it rises above about 0.75, many tables double their buckets and redistribute everything. That keeps lookups fast.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: A hash table has 365 buckets and keys spread at random. From how many entries on is a collision more likely than none?
    answer:
      value: 23
    feedback:
      - when: numval(state.input) >= 180
        misconception: birthday-intuition
        text: "Far fewer: every pair counts, and pairs add up fast."
    hints:
      - This is the birthday problem.
      - With n entries there are n · (n − 1) / 2 pairs.
    explanation: From 23 entries on the chance is above 50 %. Collisions are therefore normal – every hash table must handle them.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: A table uses only the first letter of the name as the bucket. What is the problem?
    params:
      options:
        - label: Many names start alike – some buckets overflow while others stay empty
          correct: true
        - label: There are too many buckets
          feedback: 26 buckets are, if anything, too few.
        - label: None at all
          feedback: Thousands would sit under S – searching there would be slow.
    hints:
      - How many names start with S, how many with X?
      - A good hash function spreads evenly.
    explanation: A good hash function mixes in every character so that similar keys land far apart.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Websites do not store passwords in plain text but as hashes. Why?
    params:
      options:
        - label: The password cannot be computed back from the hash – not even after a data theft
          correct: true
        - label: Hashes need less storage
          feedback: Often they are even longer than the password.
        - label: So that logging in is faster
          feedback: It is about security, not speed.
    hints:
      - A good hash function is a one-way street.
    explanation: At login the input is hashed and compared. The server never knows the password itself.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: An attacker sends a server lots of keys that all land in the same bucket. What happens?
    params:
      options:
        - label: Lookups become as slow as a list – O(n) instead of O(1)
          correct: true
        - label: The table shrinks
          feedback: The size stays the same; only one bucket grows huge.
        - label: Nothing, hash tables are always O(1)
          feedback: Only on average – and only with well-spread keys.
    hints:
      - What is inside a bucket with many entries?
      - A long list that has to be searched.
    explanation: That is why languages like Python randomise their hash function at every start. Without that seed nobody can craft collisions on purpose.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: "As many entries as buckets, spread at random. About what percentage of buckets stays empty? Hint: (1 − 1/n)ⁿ ≈ 1/e. Round to a whole percent."
    params:
      unit: "%"
    answer:
      value: 37
      tolerance: 1
    hints:
      - A given bucket is missed by each entry with probability 1 − 1/n.
      - 1/e ≈ 0.368.
    explanation: About 37 % stay empty, while some buckets get two or three entries. Randomness never spreads perfectly evenly.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a hash table finds things without searching.
    params:
      keywords:
        - - rechn
          - berechn
          - comput
          - calculat
          - funktion
          - function
        - - fach
          - bucket
          - platz
          - slot
        - - kollision
          - collision
          - gleiche fach
          - same bucket
      sample: "A hash function computes the bucket number straight from the key. You look there – without searching. If two keys land in the same bucket, that is a collision: the bucket then holds a short list."
    difficulty: 3

srs:
  cards_from: [fach, warum]
