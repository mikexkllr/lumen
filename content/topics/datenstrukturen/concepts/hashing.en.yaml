id: cs.datastructures.hashing
type: concept
title: Hash Tables
summary: Calculate the slot directly.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      A **hash table** calculates from the key which slot an entry belongs in, for example the remainder when dividing by the number of slots. No searching needed.

  - kind: problem
    id: fach
    widget: numeric
    prompt: A name has the numeric value {{v}}. Which of the slots 0 to 9 does it go into, if the slot is the remainder when dividing by 10?
    params: { placeholder: "Slot" }
    answer: { value: "{{mod(v, 10)}}" }
    hints:
      - The remainder when dividing by 10 is the last digit.
    explanation: "{{v}} divided by 10 leaves a remainder of {{mod(v, 10)}}."
    variants:
      params: { v: "int[100,999]" }
      defaults: { v: 437 }

  - kind: problem
    id: kollision
    widget: choice
    prompt: Two names land in the same slot. What happens?
    params:
      options:
        - { label: "The slot holds a small list, and only that list is searched.", correct: true }
        - { label: The older name is deleted., feedback: "No data is lost this way." }
        - { label: The program crashes., feedback: "Collisions are normal and planned for." }
    hints:
      - How many entries fit in one slot?
    explanation: Such a **collision** costs little, as long as the slots don't overflow.

  - kind: problem
    id: warum
    widget: choice
    prompt: Why are hash tables in almost every app?
    params:
      options:
        - { label: Lookups take almost the same short time every time., correct: true }
        - { label: They keep the data sorted., feedback: "The order is exactly what gets lost." }
    hints:
      - How long does finding take with 10 or 10 million entries?
    explanation: Whether it is a password check or a dictionary, it takes one calculation instead of a long search.

srs:
  cards_from: [fach, warum]
