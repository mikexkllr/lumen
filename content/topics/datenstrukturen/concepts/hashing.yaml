id: cs.datastructures.hashing
type: concept
title: Hash-Tabellen
summary: Das Fach direkt ausrechnen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In der Garderobe hängt deine Jacke am Haken mit der Nummer deiner Marke. Wie lange muss gesucht werden?
    params:
      options:
        - label: Gar nicht – die Nummer führt direkt hin
          correct: true
        - label: Jede Jacke wird angesehen
          feedback: Dann bräuchte man keine Marken.
        - label: Etwa die Hälfte
          feedback: Die Marke nennt den genauen Haken.
    hints:
      - Was steht auf der Marke?
    explanation: Aus dem Schlüssel den Platz ausrechnen – das ist die Idee.

  - kind: explain
    id: s1
    body: |
      Eine **Hash-Tabelle** rechnet aus dem Schlüssel direkt aus, in welches Fach ein Eintrag gehört – etwa den Rest beim Teilen durch die Zahl der Fächer. Suchen entfällt.

  - kind: problem
    id: fach
    widget: numeric
    prompt: Ein Name hat den Zahlenwert {{v}}. In welches der Fächer 0 bis 9 kommt er, wenn das Fach der Rest beim Teilen durch 10 ist?
    params: { placeholder: "Fach" }
    answer: { value: "{{mod(v, 10)}}" }
    hints:
      - Der Rest beim Teilen durch 10 ist die letzte Ziffer.
    explanation: "{{v}} geteilt durch 10 lässt Rest {{mod(v, 10)}}."
    variants:
      params: { v: "int[100,999]" }
      defaults: { v: 437 }

  - kind: problem
    id: kollision
    widget: choice
    prompt: Zwei Namen landen im selben Fach. Was passiert?
    params:
      options:
        - { label: Das Fach hält eine kleine Liste – gesucht wird nur dort., correct: true }
        - { label: Der ältere Name wird gelöscht., feedback: "Daten gehen dabei nicht verloren." }
        - { label: Das Programm stürzt ab., feedback: "Kollisionen sind normal und eingeplant." }
    hints:
      - Wie viele Einträge passen in ein Fach?
    explanation: So eine **Kollision** kostet wenig, solange die Fächer nicht überlaufen.

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum stecken Hash-Tabellen in fast jeder App?
    params:
      options:
        - { label: Nachschlagen dauert fast immer gleich kurz., correct: true }
        - { label: Sie halten die Daten sortiert., feedback: "Gerade die Reihenfolge geht verloren." }
    hints:
      - Wie lange dauert das Finden bei 10 oder 10 Millionen Einträgen?
    explanation: Ob Passwort-Check oder Wörterbuch – ein Schritt Rechnen statt langem Suchen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Hash-Tabelle hat 100 Fächer und 1000 Einträge, gleichmäßig verteilt. Wie viele Einträge liegen im Schnitt in einem Fach?
    answer:
      value: 10
    hints:
      - "1000 : 100."
    explanation: 10 pro Fach – dann wird das Suchen langsam. Gute Tabellen wachsen, bevor es so voll wird.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Die Fachnummer ist der Rest beim Teilen durch 7. Der Schlüssel 23 liegt in Fach 2. Welcher Schlüssel zwischen 10 und 20 landet im selben Fach?
    answer:
      value: 16
    hints:
      - Zieh 7 von 23 ab.
    explanation: "16 : 7 hat auch den Rest 2. Das nennt man eine Kollision."
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: Fächer 0 bis 6, Fach = Schlüssel mod 7. Ist ein Fach belegt, nimm das nächste freie. Du fügst nacheinander 10, 17 und 24 ein. In welchem Fach landet 24?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 3
        misconception: ignore-collision
        text: 24 mod 7 ist zwar 3 – aber dort liegt schon die 10.
    hints:
      - Alle drei Schlüssel ergeben mod 7 dieselbe 3.
      - 10 nimmt Fach 3, 17 rutscht auf 4 …
    explanation: 10 → 3, 17 → 4, 24 → 5. Dieses Weiterrutschen heißt lineares Sondieren. Kollisionen ballen sich dabei zu Klumpen.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: Der **Lastfaktor** ist die Zahl der Einträge geteilt durch die Zahl der Fächer. Steigt er über etwa 0,75, verdoppeln viele Tabellen ihre Fächer und verteilen alles neu. So bleibt Nachschlagen schnell.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Eine Hash-Tabelle hat 365 Fächer, die Schlüssel verteilen sich zufällig. Ab wie vielen Einträgen ist eine Kollision wahrscheinlicher als keine?
    answer:
      value: 23
    feedback:
      - when: numval(state.input) >= 180
        misconception: birthday-intuition
        text: "Viel weniger: Es zählen alle Paare, und davon gibt es schnell viele."
    hints:
      - Das ist das Geburtstagsproblem.
      - Bei n Einträgen gibt es n · (n − 1) / 2 Paare.
    explanation: Ab 23 Einträgen liegt die Chance über 50 %. Kollisionen sind darum der Normalfall – jede Hash-Tabelle muss mit ihnen umgehen.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: Eine Tabelle nimmt als Fach nur den ersten Buchstaben des Namens. Was ist das Problem?
    params:
      options:
        - label: Viele Namen beginnen gleich – manche Fächer quellen über, andere bleiben leer
          correct: true
        - label: Es gibt zu viele Fächer
          feedback: 26 Fächer sind eher zu wenig.
        - label: Gar keins
          feedback: Unter S stünden Tausende – die Suche dort wäre langsam.
    hints:
      - Wie viele Namen beginnen mit S, wie viele mit X?
      - Eine gute Hashfunktion verteilt gleichmäßig.
    explanation: Eine gute Hashfunktion mischt alle Zeichen ein, damit ähnliche Schlüssel weit auseinanderliegen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Webseiten speichern Passwörter nicht im Klartext, sondern als Hash. Warum?
    params:
      options:
        - label: Aus dem Hash lässt sich das Passwort nicht zurückrechnen – auch nicht nach einem Datendiebstahl
          correct: true
        - label: Hashes brauchen weniger Speicherplatz
          feedback: Oft sind sie sogar länger als das Passwort.
        - label: Damit das Einloggen schneller geht
          feedback: Es geht um Sicherheit, nicht um Tempo.
    hints:
      - Eine gute Hashfunktion ist eine Einbahnstraße.
    explanation: Beim Login wird die Eingabe gehasht und verglichen. Das Passwort selbst kennt der Server nie.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Ein Angreifer schickt einem Server lauter Schlüssel, die im selben Fach landen. Was passiert?
    params:
      options:
        - label: Nachschlagen wird langsam wie in einer Liste – O(n) statt O(1)
          correct: true
        - label: Die Tabelle wird kleiner
          feedback: Die Größe bleibt; nur ein Fach wird riesig.
        - label: Nichts, Hash-Tabellen sind immer O(1)
          feedback: Nur im Schnitt – und nur bei gut verteilten Schlüsseln.
    hints:
      - Was steckt in einem Fach mit vielen Einträgen?
      - Eine lange Liste, die man durchsuchen muss.
    explanation: Darum würfeln Sprachen wie Python ihre Hashfunktion bei jedem Start neu. Ohne den Startwert kann niemand gezielt Kollisionen bauen.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: "Gleich viele Einträge wie Fächer, zufällig verteilt. Wie viel Prozent der Fächer bleiben etwa leer? Tipp: (1 − 1/n)ⁿ ≈ 1/e. Runde auf ganze Prozent."
    params:
      unit: "%"
    answer:
      value: 37
      tolerance: 1
    hints:
      - Ein bestimmtes Fach wird bei jedem Eintrag mit Wahrscheinlichkeit 1 − 1/n verfehlt.
      - 1/e ≈ 0,368.
    explanation: Rund 37 % bleiben leer, dafür haben manche Fächer zwei oder drei Einträge. Zufall verteilt nie perfekt gleichmäßig.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Hash-Tabelle etwas findet, ohne zu suchen.
    params:
      keywords:
        - - rechn
          - berechn
          - comput
          - calculat
          - funktion
          - function
        - - fach
          - bucket
          - platz
          - slot
        - - kollision
          - collision
          - gleiche fach
          - same bucket
      sample: "Eine Hashfunktion berechnet aus dem Schlüssel direkt die Nummer des Fachs. Dort schaut man nach – ohne zu suchen. Landen zwei Schlüssel im gleichen Fach, ist das eine Kollision: Das Fach hält dann eine kleine Liste."
    difficulty: 3

srs:
  cards_from: [fach, warum]
