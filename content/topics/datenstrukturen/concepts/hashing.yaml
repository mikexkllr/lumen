id: cs.datastructures.hashing
type: concept
title: Hash-Tabellen
summary: Das Fach direkt ausrechnen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Eine **Hash-Tabelle** rechnet aus dem Schlüssel direkt aus, in welches Fach ein Eintrag gehört – etwa den Rest beim Teilen durch die Zahl der Fächer. Suchen entfällt.

  - kind: problem
    id: fach
    widget: numeric
    prompt: Ein Name hat den Zahlenwert {{v}}. In welches der Fächer 0 bis 9 kommt er, wenn das Fach der Rest beim Teilen durch 10 ist?
    params: { placeholder: "Fach" }
    answer: { value: "{{mod(v, 10)}}" }
    hints:
      - Der Rest beim Teilen durch 10 ist die letzte Ziffer.
    explanation: "{{v}} geteilt durch 10 lässt Rest {{mod(v, 10)}}."
    variants:
      params: { v: "int[100,999]" }
      defaults: { v: 437 }

  - kind: problem
    id: kollision
    widget: choice
    prompt: Zwei Namen landen im selben Fach. Was passiert?
    params:
      options:
        - { label: Das Fach hält eine kleine Liste – gesucht wird nur dort., correct: true }
        - { label: Der ältere Name wird gelöscht., feedback: "Daten gehen dabei nicht verloren." }
        - { label: Das Programm stürzt ab., feedback: "Kollisionen sind normal und eingeplant." }
    hints:
      - Wie viele Einträge passen in ein Fach?
    explanation: So eine **Kollision** kostet wenig, solange die Fächer nicht überlaufen.

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum stecken Hash-Tabellen in fast jeder App?
    params:
      options:
        - { label: Nachschlagen dauert fast immer gleich kurz., correct: true }
        - { label: Sie halten die Daten sortiert., feedback: "Gerade die Reihenfolge geht verloren." }
    hints:
      - Wie lange dauert das Finden bei 10 oder 10 Millionen Einträgen?
    explanation: Ob Passwort-Check oder Wörterbuch – ein Schritt Rechnen statt langem Suchen.

srs:
  cards_from: [fach, warum]
