id: cs.datastructures.stack
type: concept
title: The Stack
summary: Last in, first out.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      A **stack** works like a pile of plates: what you put on top last is what you take off first.

  - kind: problem
    id: runter
    widget: order
    prompt: You put A, then B, then C onto a stack. In what order do you take them off?
    params:
      items:
        - { label: C }
        - { label: B }
        - { label: A }
    hints:
      - What is on top?
    explanation: C came last, so C is on top and comes off first.

  - kind: problem
    id: zurueck
    widget: choice
    prompt: In a browser, you visit page 1, then 2, then 3. You press "Back" twice. Where are you?
    params:
      options:
        - { label: On page 1, correct: true }
        - { label: On page 2, feedback: "One Back leads to page 2. Two go further." }
        - { label: On page 3, feedback: "That is where you started." }
    hints:
      - The history is a stack, with page 3 on top.
    explanation: Two pages come off the stack, leaving page 1 on top.

  - kind: problem
    id: wo
    widget: choice
    prompt: Which feature uses a stack?
    params:
      options:
        - { label: Undo, correct: true }
        - { label: The print queue, feedback: "There, whoever came first goes first. That is a queue." }
        - { label: Alphabetical sorting, feedback: "Sorting needs no fixed input and output order." }
    hints:
      - What does undo take back first?
    explanation: Undo always reverses the latest change first.

srs:
  cards_from: [runter, zurueck]
