id: ee.ac.threephase
type: concept
title: "Drehstrom: 230 V und 400 V"
summary: "Drei Phasen, 120° versetzt – für Herd, Wallbox und jeden großen Motor."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Drei Phasen im Kreis
    body: "Fast jedes Kraftwerk der Welt liefert **Drehstrom**. Drei Leiter wechseln sich dabei ab wie Läufer in einer Staffel. Deck die Karten der Reihe nach auf: Was entsteht, wenn die Spitze immer weiterwandert?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: ①
            front: L1 am Gipfel
            back: Zuerst erreicht die Spannung im Leiter L1 ihr Maximum.
          - icon: ②
            front: Dann L2
            back: Eine Drittelperiode später ist L2 an der Reihe.
          - icon: ③
            front: Dann L3
            back: Noch ein Drittel später erreicht L3 die Spitze.
          - icon: 🔄
            front: Das Feld dreht sich
            back: Die Spitze wandert im Kreis. Ein Motor muss diesem Drehfeld nur folgen.

  - kind: problem
    id: hook
    widget: choice
    prompt: Der Anschluss für Herd oder Wallbox hat fünf Adern statt drei. Wofür?
    params:
      options:
        - label: Drei Außenleiter, ein Neutralleiter und ein Schutzleiter
          correct: true
        - label: Doppelte Sicherheit
          feedback: Die Adern führen drei verschiedene Phasen.
        - label: Für Daten zur Steuerung
          feedback: Daten laufen über eigene, dünne Leitungen.
    hints:
      - Eine normale Steckdose hat Außenleiter, Neutralleiter und Schutzleiter.
      - Hier gibt es drei Außenleiter.
    explanation: L1, L2, L3, N und PE. Dieser Anschluss heißt Drehstrom oder Dreiphasenwechselstrom.

  - kind: explain
    id: c1
    body: Beim **Drehstrom** liefern drei Leiter je eine Sinusspannung. Sie sind um 120° versetzt, also um ein Drittel einer Periode. Jede Phase hat 230 V gegen den Neutralleiter. Zwischen zwei Phasen misst man 400 V.

  - kind: problem
    id: c2
    widget: numeric
    prompt: Zwischen zwei Phasen liegt √3-mal die Phasenspannung. Wie viel sind 230 V · √3? Auf eine Nachkommastelle.
    params:
      unit: V
    answer:
      value: 398.4
      tolerance: 0.06
    feedback:
      - when: numval(state.input) == 460
        misconception: double
        text: "Nicht doppelt: Die Phasen sind nur 120° versetzt, nicht 180°."
    hints:
      - √3 ≈ 1,732.
      - 230 · 1,732.
    explanation: 230 · 1,732 ≈ 398,4 V. Man rundet das auf die genormten 400 V.

  - kind: problem
    id: c3
    widget: sim
    prompt: Die Phasen sind Zeiger bei 0°, 120° und 240°. L1 liegt bei 0°, L2 bei 120°. Stell den Zeiger von L3 ein.
    params:
      scene: unitcircle
    answer:
      angle: 240
    explanation: L3 liegt bei 240°. Die drei Zeiger teilen den Kreis in drei gleiche Teile.

  - kind: problem
    id: c4
    widget: choice
    prompt: Drei gleiche Heizstäbe hängen an L1, L2 und L3 und gemeinsam am Neutralleiter. Wie viel Strom fließt im Neutralleiter?
    params:
      options:
        - label: "Null"
          correct: true
        - label: Dreimal ein Phasenstrom
          feedback: Die drei Ströme sind versetzt und heben sich auf.
        - label: Genau ein Phasenstrom
          feedback: Bei gleicher Last heben sie sich vollständig auf.
    hints:
      - Die drei Ströme sind um 120° versetzt.
      - Drei gleich lange Zeiger bei 0°, 120° und 240° ergeben zusammen?
    explanation: Bei gleicher Last ist die Summe in jedem Moment null. Darum reicht ein dünner Neutralleiter, und Überlandleitungen haben gar keinen.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: L1 und L2 liegen fest. Stell den Phasenwinkel von L3 so ein, dass die Summe aller drei Spannungen in jedem Moment null ist.
    params:
      expr: sin(x) + sin(x - 2*pi/3) + sin(x - p*pi/180)
      x:
        - 0
        - 12.6
      y:
        - -3
        - 3
      showCoordinates: false
      sliders:
        - id: p
          label: Phase von L3 in Grad
          min: 0
          max: 345
          step: 15
          initial: 60
    answer:
      values:
        p: 240
    hints:
      - Die drei Phasen sind gleichmäßig über den Kreis verteilt.
      - L1 liegt bei 0°, L2 bei 120°. Noch einmal 120° weiter …
    explanation: Bei 240° heben sich die drei Spannungen in jedem Moment auf. Darum fließt bei gleicher Last kein Strom im Neutralleiter.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Wallbox lädt mit {{i}} A an Drehstrom. Ihre Leistung ist P = √3 · 400 V · I. Wie viele kW sind das? Auf eine Nachkommastelle.
    params:
      unit: kW
    answer:
      value: "{{1.7320508 * 400 * i / 1000}}"
      tolerance: 0.06
    feedback:
      - when: abs(numval(state.input) - 0.23 * i) < 0.06
        misconception: single-phase
        text: Das wäre eine einzelne Phase. Drehstrom hat drei.
    hints:
      - √3 · 400 ≈ 693.
      - 693 V · {{i}} A in kW.
    explanation: ≈ {{round(1.7320508 * 400 * i / 1000, 1)}} kW. Darum gibt es Wallboxen mit 11 kW (16 A) und 22 kW (32 A).
    difficulty: 2
    variants:
      params:
        i: choice[10,16,25,32]
      defaults:
        i: 16

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Warum laufen große Motoren am liebsten mit Drehstrom?
    params:
      options:
        - label: Die drei Spulen erzeugen ein Magnetfeld, das sich von selbst dreht
          correct: true
        - label: Weil 400 V gefährlicher ist
          feedback: Gefahr ist kein Vorteil.
        - label: Weil Drehstrom Gleichstrom ist
          feedback: Es sind drei Wechselspannungen.
    hints:
      - Drei versetzte Ströme in drei versetzten Spulen.
      - Der Name »Drehstrom« verrät es.
    explanation: Das Drehfeld zieht den Läufer mit. Ein solcher Asynchronmotor braucht keine Bürsten und läuft jahrzehntelang.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Beweis für den Neutralleiter: sin x + sin(x − 120°) + sin(x + 120°) = sin x + 2 sin x · cos 120°. Weil cos 120° = [[−½]] ist, ergibt das [[0]]."
      distractors:
        - ½
        - "1"
        - √3
    explanation: Das Additionstheorem sin(x ± y) = sin x cos y ± cos x sin y liefert den Zwischenschritt. Die cos-x-Terme heben sich auf.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Warum drei Phasen und nicht zwei oder sechs?
    params:
      options:
        - label: Drei ist die kleinste Zahl mit Drehfeld und gleichmäßiger Leistung bei wenig Kupfer
          correct: true
        - label: Weil drei Glück bringt
          feedback: Es gibt handfeste technische Gründe.
        - label: Weil sechs Phasen nicht gehen
          feedback: Sie gehen, brauchen aber mehr Leiter.
    hints:
      - Bei einer Phase pulsiert die Leistung mit 100 Hz.
      - Bei drei Phasen ist die Summe der Leistung konstant.
    explanation: "Mit drei Phasen ist die Gesamtleistung in jedem Moment gleich: Generatoren und Motoren laufen ruhig. Mehr Phasen bringen kaum Vorteile, kosten aber Leitungen."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, woher die 400 V beim Drehstrom kommen.
    params:
      keywords:
        - - drei
          - three
        - - "120"
          - versetzt
          - offset
          - phase
        - - zwischen
          - between
          - differenz
          - difference
        - - wurzel
          - root
          - √3
          - 1,73
          - "1.73"
      sample: "Es gibt drei Phasen mit je 230 V gegen den Neutralleiter, um 120° versetzt. Misst man zwischen zwei Phasen, zählt die Differenz der beiden Sinuswellen. Wegen des Winkels ist sie nicht doppelt so groß, sondern √3-mal: 230 · 1,73 ≈ 400 V."
    explanation: "Kern: Differenz zweier um 120° versetzter Zeiger. Geometrisch ist das ein gleichschenkliges Dreieck mit 120° an der Spitze."
    difficulty: 3

srs:
  cards_from: ["c2", "d1", "x2"]
