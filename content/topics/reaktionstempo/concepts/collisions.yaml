id: chem.kinetics.collisions
type: concept
title: "Die Stoßtheorie"
summary: "Reaktion braucht Treffer – mit Wucht und in der richtigen Richtung."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Streichholz liegt ruhig in der Schachtel. Erst beim Reiben flammt es auf. Warum?
    params:
      options:
        - label: Die Reibung liefert die Energie zum Start
          correct: true
        - label: Erst beim Reiben kommt Sauerstoff dazu
          feedback: Luft ist auch in der Schachtel.
        - label: Reiben erzeugt neue Stoffe
          feedback: Die Stoffe sind schon da – sie brauchen nur einen Anstoß.
    hints:
      - Die Reaktion liefert viel Energie – braucht aber erst ein wenig.
      - Denk an den Energieberg.
    explanation: Die **Aktivierungsenergie** ist der Anstoß, den Teilchen brauchen. Danach liefert die Reaktion selbst die Wärme für den nächsten Schritt.

  - kind: explain
    id: c1
    body: "Die **Stoßtheorie** sagt: Teilchen reagieren nur, wenn sie zusammenstoßen – mit genug Energie und in der passenden Ausrichtung. Alles, was mehr solche Treffer erzeugt, macht die Reaktion schneller."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Führt das zu mehr Zusammenstößen pro Sekunde?
    params:
      buckets:
        - id: b1
          label: mehr Stöße
        - id: b2
          label: weniger Stöße
      items:
        - label: höhere Konzentration
          bucket: b1
        - label: höherer Gasdruck
          bucket: b1
        - label: feineres Pulver
          bucket: b1
        - label: kräftig rühren
          bucket: b1
        - label: Lösung verdünnen
          bucket: b2
        - label: größere Stücke
          bucket: b2
    hints:
      - Mehr Teilchen auf engem Raum treffen sich öfter.
      - Bei Feststoffen reagiert nur die Oberfläche.
    explanation: Konzentration, Druck und Oberfläche erhöhen die Zahl der Begegnungen. Rühren bringt frische Teilchen heran.

  - kind: problem
    id: c3
    widget: numeric
    prompt: A und B reagieren beim Zusammenstoß. Du verdoppelst die Konzentration von A und auch die von B. Wievielmal häufiger stoßen A und B zusammen?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: additive
        text: Jedes A trifft doppelt so viele B – und es gibt doppelt so viele A.
    hints:
      - Die Stöße wachsen mit [A] und mit [B].
      - Rechne 2 · 2.
    explanation: 2 · 2 = 4. Darum steht im Geschwindigkeitsgesetz oft ein Produkt der Konzentrationen.

  - kind: problem
    id: c4
    widget: choice
    prompt: Zwei Teilchen stoßen mit genug Energie zusammen und reagieren trotzdem nicht. Woran kann das liegen?
    params:
      options:
        - label: Sie haben sich mit der falschen Seite getroffen
          correct: true
        - label: Sie waren zu langsam
          feedback: Die Energie reichte ja.
        - label: Das ist unmöglich
          feedback: Es passiert sogar sehr oft.
    hints:
      - Nur bestimmte Atome müssen sich berühren.
      - Wie ein Schlüssel, der nur richtig herum ins Schloss passt.
    explanation: Bei großen Molekülen passt oft nur ein winziger Teil der Stöße von der Richtung her. Das bremst viele Reaktionen.

  - kind: problem
    id: d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie oft stößt ein einziges Stickstoffmolekül in der Luft pro Sekunde mit anderen zusammen?"
    params:
      min: 1
      max: 1000000000000000
      scale: log
    answer:
      value: 7000000000
      tolerance: 4000000000
    explanation: Rund 7 Milliarden Mal pro Sekunde! Würde jeder Stoß reagieren, wäre alles sofort fertig.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: "Nicht alle Teilchen sind gleich schnell. Ihre Energien verteilen sich wie in einer schiefen Glocke mit langem Schwanz: die **Maxwell-Boltzmann-Verteilung**. Nur der Schwanz schafft den Energieberg."

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Die mittlere Geschwindigkeit von Gasteilchen wächst mit der Wurzel der Temperatur in Kelvin. Um wie viel Prozent sind sie bei 310 K schneller als bei 300 K? Auf eine Nachkommastelle.
    answer:
      value: 1.7
      tolerance: 0.06
    feedback:
      - when: abs(numval(state.input) - 3.3) < 0.1
        misconception: no-root
        text: Das wäre ohne Wurzel. Die Geschwindigkeit wächst nur mit √T.
    hints:
      - "Rechne √(310 : 300)."
      - √1,0333 ≈ 1,0165.
    explanation: Nur etwa 1,7 % schneller – und trotzdem verdoppelt sich oft das Reaktionstempo. Die Stoßzahl allein erklärt das nicht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Anteil der Stöße mit genug Energie ist etwa e hoch (−Eₐ/RT). Wie groß ist er für Eₐ = 50 kJ/mol bei 300 K?
    params:
      options:
        - label: Etwa 2 von einer Milliarde
          correct: true
        - label: Etwa die Hälfte
          feedback: Der Exponent ist −20 – das ist winzig.
        - label: Etwa 1 %
          feedback: e hoch −20 ist viel kleiner.
    hints:
      - "Eₐ/RT = 50 000 : (8,314 · 300) ≈ 20."
      - e hoch −20 ≈ 2 · 10⁻⁹.
    explanation: Bei 7 Milliarden Stößen pro Sekunde und Teilchen reicht selbst dieser winzige Anteil, damit Reaktionen ablaufen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux die drei Bedingungen der Stoßtheorie.
    params:
      keywords:
        - - stoß
          - stoßen
          - treff
          - collid
          - collision
          - hit
        - - energie
          - energy
          - aktivierung
          - activation
          - wucht
          - force
        - - richtung
          - ausricht
          - orient
          - direction
          - seite
          - side
      sample: Teilchen müssen zusammenstoßen. Der Stoß braucht genug Energie, mindestens die Aktivierungsenergie. Und sie müssen in der richtigen Ausrichtung treffen.
    explanation: Treffen, Wucht, Richtung – fehlt eins, passiert nichts.
    difficulty: 3

srs:
  cards_from: ["c3", "d3", "x1"]
