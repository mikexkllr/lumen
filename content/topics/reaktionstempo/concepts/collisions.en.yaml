id: chem.kinetics.collisions
type: concept
title: "Collision theory"
summary: "Reactions need hits – with force and in the right direction."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Not every collision counts
    body: Particles collide all the time, yet they rarely react. Let 100 collisions happen and count the hits. Then turn up the **temperature** and try again.
    visual:
      widget: distribution
      interactive: true
      params:
        mode: chance
        items:
          - label: Reaction
            logit: -3
          - label: Bounce
            logit: 0
        temperature:
          min: 0.5
          max: 3
          step: 0.5
          initial: 1
        sample:
          - 10
          - 100

  - kind: problem
    id: hook
    widget: choice
    prompt: A match sits quietly in its box. Only when struck does it flare up. Why?
    params:
      options:
        - label: The friction supplies the energy to get started
          correct: true
        - label: Only striking adds oxygen
          feedback: There is air in the box too.
        - label: Striking makes new substances
          feedback: The substances are already there – they just need a push.
    hints:
      - The reaction releases a lot of energy – but needs a little first.
      - Think of the energy hill.
    explanation: The **activation energy** is the push particles need. After that, the reaction itself supplies the heat for the next step.

  - kind: explain
    id: c1
    body: "**Collision theory** says: particles only react when they collide – with enough energy and the right orientation. Anything that creates more such hits makes the reaction faster."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Does this lead to more collisions per second?
    params:
      buckets:
        - id: b1
          label: more collisions
        - id: b2
          label: fewer collisions
      items:
        - label: higher concentration
          bucket: b1
        - label: higher gas pressure
          bucket: b1
        - label: finer powder
          bucket: b1
        - label: stirring hard
          bucket: b1
        - label: diluting the solution
          bucket: b2
        - label: bigger lumps
          bucket: b2
    hints:
      - More particles in a small space meet more often.
      - With solids only the surface reacts.
    explanation: Concentration, pressure and surface area raise the number of encounters. Stirring brings fresh particles in.

  - kind: problem
    id: c3
    widget: numeric
    prompt: A and B react when they collide. You double the concentration of A and also that of B. How many times more often do A and B collide?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: additive
        text: Each A meets twice as many B – and there are twice as many A.
    hints:
      - Collisions grow with [A] and with [B].
      - Work out 2 · 2.
    explanation: 2 · 2 = 4. That is why rate laws often contain a product of concentrations.

  - kind: problem
    id: c4
    widget: choice
    prompt: Two particles collide with enough energy and still do not react. Why might that be?
    params:
      options:
        - label: They met the wrong way round
          correct: true
        - label: They were too slow
          feedback: The energy was enough.
        - label: That is impossible
          feedback: It actually happens very often.
    hints:
      - Only certain atoms need to touch.
      - Like a key that only fits the lock the right way round.
    explanation: With big molecules only a tiny share of collisions is oriented correctly. That slows many reactions.

  - kind: problem
    id: intro-c1
    widget: distribution
    prompt: Set the temperature so that about one collision in five leads to a reaction.
    params:
      mode: chance
      items:
        - label: Reaction
          logit: -3
        - label: Bounce
          logit: 0
      temperature:
        min: 0.5
        max: 3
        step: 0.5
        initial: 1
      sample:
        - 10
        - 100
    check:
      predicate: prob(0) >= 0.15 && prob(0) <= 0.25
    hints:
      - "Watch the »Reaction« bar: one in five is 20 %."
      - Turn the temperature up to roughly double.
    explanation: At temperature 2, about 18 % of collisions react, at 1 just under 5 %. Heat gives far more particles enough energy to react.

  - kind: problem
    id: d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: how often does a single nitrogen molecule in air collide with others per second?"
    params:
      min: 1
      max: 1000000000000000
      scale: log
    answer:
      value: 7000000000
      tolerance: 4000000000
    explanation: About 7 billion times a second! If every collision led to a reaction, everything would be over at once.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: "Not all particles move equally fast. Their energies are spread like a lopsided bell with a long tail: the **Maxwell–Boltzmann distribution**. Only the tail gets over the energy hill."

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: The mean speed of gas particles grows with the square root of the temperature in kelvin. By what percentage are they faster at 310 K than at 300 K? Give one decimal place.
    answer:
      value: 1.7
      tolerance: 0.06
    feedback:
      - when: abs(numval(state.input) - 3.3) < 0.1
        misconception: no-root
        text: That would be without the root. The speed grows only with √T.
    hints:
      - Work out √(310 ÷ 300).
      - √1.0333 ≈ 1.0165.
    explanation: Only about 1.7% faster – yet the reaction rate often doubles. The number of collisions alone cannot explain that.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The share of collisions with enough energy is about e to the (−Eₐ/RT). How big is it for Eₐ = 50 kJ/mol at 300 K?
    params:
      options:
        - label: About 2 in a billion
          correct: true
        - label: About half
          feedback: The exponent is −20 – that is tiny.
        - label: About 1%
          feedback: e to the −20 is far smaller.
    hints:
      - Eₐ/RT = 50,000 ÷ (8.314 · 300) ≈ 20.
      - e to the −20 ≈ 2 · 10⁻⁹.
    explanation: With 7 billion collisions per particle per second, even this tiny share is enough for reactions to happen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain the three conditions of collision theory to Lux.
    params:
      keywords:
        - - stoß
          - stoßen
          - treff
          - collid
          - collision
          - hit
        - - energie
          - energy
          - aktivierung
          - activation
          - wucht
          - force
        - - richtung
          - ausricht
          - orient
          - direction
          - seite
          - side
      sample: Particles must collide. The collision needs enough energy, at least the activation energy. And they must hit with the right orientation.
    explanation: Hit, force, direction – if one is missing, nothing happens.
    difficulty: 3

srs:
  cards_from: ["c3", "d3", "x1"]
