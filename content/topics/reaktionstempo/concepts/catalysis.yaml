id: chem.kinetics.catalysis
type: concept
title: "Katalyse genauer"
summary: "Zwischenstufen, Wechselzahlen und Reaktionen, die sich selbst beschleunigen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Wasserstoffperoxid zerfällt im Fläschchen kaum. Mit einer Prise Braunstein (MnO₂) schäumt es sofort auf. Der Braunstein bleibt übrig. Was ist er?
    params:
      options:
        - label: Ein Katalysator
          correct: true
        - label: Ein Ausgangsstoff
          feedback: Er wird ja nicht verbraucht.
        - label: Ein Produkt
          feedback: Er war schon vorher da.
    hints:
      - Was am Ende unverändert übrig bleibt, wurde nicht verbraucht.
      - Trotzdem hat er das Tempo verändert.
    explanation: 2 H₂O₂ → 2 H₂O + O₂. Der Schaum ist Sauerstoff. Der Braunstein beschleunigt nur.

  - kind: problem
    id: c1
    widget: numeric
    prompt: 2 H₂O₂ → 2 H₂O + O₂. Wie viele O₂-Moleküle entstehen aus {{2 * k}} H₂O₂-Molekülen?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 * k
        misconception: ratio-ignored
        text: Zwei H₂O₂ geben nur ein O₂.
    hints:
      - "Lies das Verhältnis: 2 zu 1."
      - Teile {{2 * k}} durch 2.
    explanation: "{{2 * k}} : 2 = {{k}} O₂."
    variants:
      params:
        k: int[3,25]
      defaults:
        k: 5

  - kind: problem
    id: c2
    widget: order
    prompt: So arbeitet ein Katalysator an seiner Oberfläche. Ordne die Schritte.
    params:
      items:
        - label: Die Teilchen binden an die Oberfläche
        - label: Bindungen in ihnen werden geschwächt
        - label: Sie reagieren zu einer Zwischenstufe
        - label: Das Produkt löst sich ab
        - label: Die Oberfläche ist wieder frei
    hints:
      - Zuerst müssen die Teilchen andocken.
      - Am Ende ist der Katalysator wieder wie neu.
    explanation: Ein Katalysator öffnet einen anderen Weg mit kleineren Bergen. Er wird in einem Kreislauf immer wieder frei.

  - kind: problem
    id: c3
    widget: swipe
    prompt: Stimmt das über Katalysatoren?
    params:
      cards:
        - text: Sie senken die Aktivierungsenergie.
          right: true
          why: Genau das ist ihr Trick.
        - text: Sie ändern ΔH der Reaktion.
          right: false
          why: Start und Ziel bleiben gleich.
        - text: Sie werden verbraucht.
          right: false
          why: Sie gehen unverändert aus der Reaktion hervor.
        - text: Sie beschleunigen auch die Rückreaktion.
          right: true
          why: Der Weg ist in beide Richtungen kürzer.
        - text: Sie verschieben das Gleichgewicht.
          right: false
          why: K bleibt gleich – es stellt sich nur schneller ein.
    explanation: Katalysatoren ändern das Tempo, nie das Ziel.

  - kind: problem
    id: d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele H₂O₂-Moleküle zerlegt ein einziges Molekül des Enzyms Katalase pro Sekunde?"
    params:
      min: 1
      max: 10000000000
      scale: log
    answer:
      value: 40000000
      tolerance: 30000000
    explanation: Rund 40 Millionen pro Sekunde! Diese **Wechselzahl** ist eine der höchsten überhaupt. Katalase schützt Zellen vor dem giftigen Peroxid.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Beim Haber-Bosch-Verfahren ist das Spalten von N₂ der schwerste Schritt. Was tut der Eisen-Katalysator dabei?
    params:
      options:
        - label: N₂ bindet an die Eisenoberfläche, die Dreifachbindung wird geschwächt und bricht
          correct: true
        - label: Eisen liefert den Wasserstoff
          feedback: Der Wasserstoff kommt aus Erdgas oder Elektrolyse.
        - label: Eisen kühlt den Reaktor
          feedback: Der Katalysator ändert Wege, nicht Temperaturen.
    hints:
      - N≡N ist eine der stärksten Bindungen überhaupt.
      - An der Oberfläche teilen sich die N-Atome Elektronen mit dem Eisen.
    explanation: Die einzelnen N-Atome auf dem Eisen nehmen nacheinander H auf. Für die Erklärung bekam Gerhard Ertl 2007 den Nobelpreis.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Warum arbeitet der Katalysator eines Autos direkt nach dem Kaltstart kaum?
    params:
      options:
        - label: Auch der katalysierte Weg braucht noch etwas Aktivierung – erst ab etwa 250 °C läuft er richtig
          correct: true
        - label: Das Platin muss erst schmelzen
          feedback: Platin schmilzt erst bei 1768 °C.
        - label: Kalte Abgase enthalten keine Schadstoffe
          feedback: Gerade beim Kaltstart sind es besonders viele.
    hints:
      - Der Katalysator senkt den Berg – er beseitigt ihn nicht.
      - Ein kleinerer Berg braucht immer noch etwas Wärme.
    explanation: Darum entsteht ein großer Teil der Abgase in den ersten Minuten. Manche Autos heizen den Kat elektrisch vor.
    difficulty: 2

  - kind: problem
    id: arr-d1
    depth: 2
    widget: sim
    prompt: "Bei 25 °C und Eₐ = 50 kJ/mol: Um wie viel muss ein Katalysator die Hürde senken, damit die Reaktion **mindestens 1000-mal** so schnell läuft?"
    params:
      scene: arrhenius
      controls:
        temperature:
          fixed: true
        ea:
          fixed: true
        catalyst:
          fixed: false
    answer:
      factor:
        - 1000
        - 1000000000000
    hints:
      - Der Katalysator ändert nicht die Temperatur, nur die Höhe der Hürde.
      - Schon gut 15 kJ/mol weniger machen sehr viel aus.
    explanation: "Ab 20 kJ/mol weniger: dann läuft sie gut 3000-mal so schnell. Weil Eₐ im Exponenten steht, wirkt eine kleine Senkung riesig. Enzyme senken die Hürde oft noch viel stärker."
    difficulty: 2

  - kind: problem
    id: arr-d2
    depth: 2
    widget: numeric
    prompt: Ein Katalysator senkt Eₐ bei 25 °C um 10 kJ/mol. Um welchen Faktor steigt das Tempo? Rechne $e^{\Delta E_a / RT}$ mit RT = 2,48 kJ/mol und runde auf eine ganze Zahl.
    answer:
      value: 56
      tolerance: 1
    feedback:
      - when: numval(state.input) >= 3 && numval(state.input) <= 5
        misconception: forgot-exp
        text: Du hast nur 10 durch 2,48 geteilt. Das Ergebnis gehört noch in den Exponenten von e.
    hints:
      - "Zuerst 10 : 2,48 ausrechnen."
      - Dann e hoch diesen Wert, also e hoch etwa 4,03.
    explanation: "10 : 2,48 ≈ 4,03 und $e^{4{,}03} ≈ 56$. Zehn Kilojoule weniger heißen also gut fünfzigmal so schnell."
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Manche Reaktionen beschleunigen sich selbst: Ein Produkt wirkt als Katalysator. Das heißt **Autokatalyse**. Erst passiert kaum etwas, dann geht es plötzlich immer schneller."

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Wie sieht die Kurve »Produktmenge gegen Zeit« bei einer autokatalytischen Reaktion aus?
    params:
      options:
        - label: "S-förmig: langsamer Start, steiler Anstieg, dann flach"
          correct: true
        - label: Eine gerade Linie
          feedback: Das Tempo ändert sich hier stark.
        - label: Steil am Anfang, dann flacher
          feedback: So sieht eine normale Reaktion aus.
    hints:
      - Am Anfang fehlt noch der Katalysator.
      - Am Ende geht der Ausgangsstoff aus.
    explanation: Mehr Produkt, mehr Katalysator, mehr Tempo – bis der Nachschub fehlt. Ähnlich verlaufen Kettenreaktionen und Epidemien.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Ein Katalysator senkt Eₐ von 75 auf 50 kJ/mol. Um welchen Faktor steigt das Tempo bei 300 K etwa? (e hoch 10 ≈ 22 000)
    params:
      options:
        - label: Etwa 20 000-fach
          correct: true
        - label: Etwa 1,5-fach
          feedback: Eₐ wirkt im Exponenten, nicht als Faktor.
        - label: Etwa 25-fach
          feedback: Die 25 kJ/mol stehen im Exponenten.
    hints:
      - Faktor = e hoch (ΔEₐ/RT).
      - "25 000 : (8,314 · 300) ≈ 10."
    explanation: e¹⁰ ≈ 22 000. Was sonst sechs Stunden dauert, geht in einer Sekunde. Enzyme schaffen oft noch viel mehr.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Katalysator eine Reaktion beschleunigt, ohne verbraucht zu werden.
    params:
      keywords:
        - - weg
          - route
          - path
          - zwischen
          - intermediate
        - - aktivierung
          - activation
          - berg
          - barrier
          - hill
        - - frei
          - unverändert
          - kreislauf
          - unchanged
          - cycle
          - free
          - zurück
      sample: Der Katalysator bietet einen anderen Weg mit kleinerem Aktivierungsberg, zum Beispiel über eine Zwischenstufe an seiner Oberfläche. Am Ende wird er wieder frei und unverändert – ein Kreislauf.
    explanation: Umweg über einen kleineren Berg, Katalysator am Ende zurück.
    difficulty: 3

srs:
  cards_from: ["c1", "c3", "x3"]
