id: bio.evolution.trees
type: concept
title: "Stammbäume lesen"
summary: "Gemeinsame Vorfahren, homologe Organe und die molekulare Uhr."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Stammt der Mensch vom Schimpansen ab?
    params:
      options:
        - label: Nein. Beide stammen von einem gemeinsamen Vorfahren ab.
          correct: true
        - label: Ja, vor etwa 6 Millionen Jahren.
          feedback: Vor 6 bis 7 Millionen Jahren lebte der gemeinsame Vorfahre, kein Schimpanse.
        - label: Nein, wir sind gar nicht verwandt.
          feedback: Unser Erbgut stimmt zu rund 99 % überein.
    hints:
      - Schimpansen haben sich ebenfalls weiterentwickelt.
      - "Denk an Cousins: Sie haben gemeinsame Großeltern."
    explanation: "Menschen und Schimpansen sind wie Cousins: Beide Linien entwickelten sich von einem gemeinsamen Vorfahren aus weiter."

  - kind: explain
    id: c1
    body: Ein **Stammbaum** zeigt Verwandtschaft. Jede Verzweigung steht für einen gemeinsamen Vorfahren. Je näher die Gabelung an der Spitze, desto enger sind zwei Arten verwandt.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne nach Verwandtschaft mit dem Menschen, von nah nach fern.
    params:
      items:
        - label: Schimpanse
        - label: Gorilla
        - label: Orang-Utan
        - label: Maus
        - label: Huhn
        - label: Hefe
      startLabel: nah
      endLabel: fern
    hints:
      - Menschenaffen zuerst, dann andere Säugetiere.
      - Vögel sind weiter weg als Säugetiere, Pilze noch weiter.
    explanation: Die gemeinsamen Vorfahren liegen ungefähr 6, 9, 15, 90, 310 und über 1000 Millionen Jahre zurück.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Gleicher Ursprung oder nur gleiche Aufgabe? Sortiere die Paare.
    params:
      buckets:
        - id: b1
          label: homolog
        - id: b2
          label: analog
      items:
        - label: Arm und Fledermausflügel
          bucket: b1
        - label: Walflosse und Pferdebein
          bucket: b1
        - label: Vogel- und Insektenflügel
          bucket: b2
        - label: Hai- und Delfinform
          bucket: b2
    hints:
      - Haben die Organe dieselben Knochen im Inneren?
      - Insekten haben gar keine Knochen.
    explanation: Homologe Organe haben den gleichen Bauplan aus einem Vorfahren. Analoge sehen sich ähnlich, weil sie dieselbe Aufgabe lösen.

  - kind: explain
    id: d1
    depth: 2
    body: Auch Gene verraten Verwandtschaft. Mutationen sammeln sich mit der Zeit grob gleichmäßig an. Wer wenige Unterschiede hat, hat sich spät getrennt. Diese **molekulare Uhr** datiert Gabelungen im Stammbaum.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Zwei Arten unterscheiden sich in einem Gen an {{d}} Stellen. Pro Million Jahre kommen insgesamt 2 Unterschiede dazu. Vor wie vielen Millionen Jahren trennten sie sich?
    params:
      unit: Mio. Jahre
    answer:
      value: "{{d / 2}}"
    feedback:
      - when: numval(state.input) == d * 2
        misconception: multiply
        text: "Teile, statt zu multiplizieren: Unterschiede durch Rate."
    hints:
      - "Zeit = Unterschiede : Rate."
      - "{{d}} : 2"
    explanation: "{{d}} : 2 = {{d / 2}} Millionen Jahre. Echte Uhren muss man mit Fossilien eichen."
    difficulty: 2
    variants:
      params:
        d: choice[12,20,36,60]
      defaults:
        d: 20

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Wale atmen Luft und haben im Körper winzige Reste von Beckenknochen. Was sagt das?
    params:
      options:
        - label: Ihre Vorfahren lebten an Land und hatten Beine.
          correct: true
        - label: Wale werden bald Beine bekommen.
          feedback: Evolution plant nicht voraus. Die Reste stammen aus der Vergangenheit.
        - label: Die Knochen sind ein Zufall.
          feedback: Genau an der Stelle, an der Landtiere ein Becken haben? Das ist kein Zufall.
    hints:
      - Solche Reste heißen rudimentäre Organe.
      - Fossilien zeigen Urwale mit kleinen Hinterbeinen.
    explanation: Wale stammen von Paarhufern ab. Ihre nächsten lebenden Verwandten sind die Flusspferde.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Stammbaum zeigt Fische, Frösche, Echsen, Vögel und Säuger. Welche Aussage ist richtig?
    params:
      options:
        - label: Ein heutiger Fisch ist genauso lange evolviert wie ein Mensch.
          correct: true
        - label: Fische sind primitiver als Menschen.
          feedback: Alle heutigen Arten sind gleich alt. Keine ist eine Vorstufe.
        - label: Der Mensch ist das Ziel der Evolution.
          feedback: Ein Stammbaum ist ein Busch, keine Leiter mit Spitze.
    hints:
      - Wie lange liegt der gemeinsame Vorfahre für beide zurück?
      - Jede Linie hat seitdem dieselbe Zeit gehabt.
    explanation: Evolution ist keine Leiter. Jede heute lebende Art ist eine erfolgreiche Spitze ihres Astes.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Mensch und Schimpanse unterscheiden sich an rund 1,2 % ihrer 3,2 Milliarden DNA-Buchstaben. Wie viele Millionen Unterschiede sind das?
    params:
      unit: Millionen
    answer:
      value: 38.4
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 3.84
        misconception: decimal
        text: "Eine Kommastelle verrutscht: 1 % von 3200 Millionen sind 32 Millionen."
    hints:
      - 3,2 Milliarden sind 3200 Millionen.
      - 3200 · 0,012
    explanation: Rund 38 Millionen Unterschiede – wenig im Verhältnis, viel in absoluten Zahlen. Viele liegen in Abschnitten ohne Funktion.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man einen Stammbaum liest.
    params:
      keywords:
        - - vorfahr
          - ancestor
        - - verzweig
          - gabel
          - knoten
          - branch
          - fork
          - node
        - - verwandt
          - related
          - kinship
        - - gene
          - dna
          - mutation
          - unterschied
          - differen
      sample: Jede Gabelung im Stammbaum ist ein gemeinsamer Vorfahre. Je später sich zwei Äste trennen, desto enger sind die Arten verwandt. Man erkennt das an wenigen Unterschieden in der DNA.
    explanation: Gabelungen sind Vorfahren, und der Abstand zur Gabel misst die Verwandtschaft.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
