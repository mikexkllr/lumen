id: bio.evolution.trees
type: concept
title: "Reading family trees of life"
summary: "Common ancestors, homologous organs and the molecular clock."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Surprising relatives
    body: Who is related to whom? Sometimes looks are completely misleading. Uncover the cards and find out what the **phylogenetic tree** reveals about these animals.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐋
            front: The whale and the hippo
            back: Whales are more closely related to hippos than to any fish.
          - icon: 🐦
            front: The sparrow and T. rex
            back: Birds are living dinosaurs. A sparrow is closer to T. rex than any lizard is.
          - icon: 🐘
            front: Elephant and manatee
            back: The bulky manatees are among the closest relatives of elephants.

  - kind: problem
    id: hook
    widget: choice
    prompt: Did humans descend from chimpanzees?
    params:
      options:
        - label: No. Both descend from a common ancestor.
          correct: true
        - label: Yes, about 6 million years ago.
          feedback: The common ancestor lived 6 to 7 million years ago – it was not a chimpanzee.
        - label: No, we are not related at all.
          feedback: Our DNA matches by about 99 %.
    hints:
      - Chimpanzees have evolved too.
      - "Think of cousins: they share grandparents."
    explanation: "Humans and chimpanzees are like cousins: both lineages evolved on from a common ancestor."

  - kind: explain
    id: c1
    body: A **phylogenetic tree** shows kinship. Each branch point stands for a common ancestor. The closer the fork is to the tips, the more closely two species are related.

  - kind: problem
    id: c2
    widget: order
    prompt: Order by kinship with humans, from close to distant.
    params:
      items:
        - label: Chimpanzee
        - label: Gorilla
        - label: Orangutan
        - label: Mouse
        - label: Chicken
        - label: Yeast
      startLabel: close
      endLabel: distant
    hints:
      - Great apes first, then other mammals.
      - Birds are further than mammals, fungi further still.
    explanation: The common ancestors lived roughly 6, 9, 15, 90, 310 and over 1000 million years ago.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Same origin or just the same job? Sort the pairs.
    params:
      buckets:
        - id: b1
          label: homologous
        - id: b2
          label: analogous
      items:
        - label: Arm and bat wing
          bucket: b1
        - label: Whale flipper and horse leg
          bucket: b1
        - label: Bird and insect wing
          bucket: b2
        - label: Shark and dolphin shape
          bucket: b2
    hints:
      - Do the organs have the same bones inside?
      - Insects have no bones at all.
    explanation: Homologous organs share a blueprint from an ancestor. Analogous ones look alike because they solve the same task.

  - kind: explain
    id: d1
    depth: 2
    body: Genes also reveal kinship. Mutations accumulate roughly evenly over time. Few differences mean a late split. This **molecular clock** dates the forks in the tree.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Two species differ at {{d}} sites in a gene. Each million years adds 2 differences in total. How many million years ago did they split?
    params:
      unit: million years
    answer:
      value: "{{d / 2}}"
    feedback:
      - when: numval(state.input) == d * 2
        misconception: multiply
        text: "Divide instead of multiplying: differences divided by rate."
    hints:
      - Time = differences ÷ rate.
      - "{{d}} ÷ 2"
    explanation: "{{d}} ÷ 2 = {{d / 2}} million years. Real clocks must be calibrated with fossils."
    difficulty: 2
    variants:
      params:
        d: choice[12,20,36,60]
      defaults:
        d: 20

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Whales breathe air and have tiny remnants of hip bones in their bodies. What does that tell us?
    params:
      options:
        - label: Their ancestors lived on land and had legs.
          correct: true
        - label: Whales will soon grow legs.
          feedback: Evolution does not plan ahead. The remnants come from the past.
        - label: The bones are a coincidence.
          feedback: Exactly where land animals have a pelvis? That is no coincidence.
    hints:
      - Such remnants are called vestigial organs.
      - Fossils show early whales with small hind legs.
    explanation: Whales descend from even-toed hoofed mammals. Their closest living relatives are hippos.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A tree shows fish, frogs, lizards, birds and mammals. Which statement is correct?
    params:
      options:
        - label: A fish today has evolved for just as long as a human.
          correct: true
        - label: Fish are more primitive than humans.
          feedback: All living species are equally old. None is a precursor.
        - label: Humans are the goal of evolution.
          feedback: A tree of life is a bush, not a ladder with a top.
    hints:
      - How long ago was the common ancestor for both?
      - Each lineage has had the same time since.
    explanation: Evolution is not a ladder. Every living species is a successful tip of its branch.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Humans and chimpanzees differ at about 1.2 % of their 3.2 billion DNA letters. How many million differences is that?
    params:
      unit: million
    answer:
      value: 38.4
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 3.84
        misconception: decimal
        text: "A decimal slipped: 1 % of 3200 million is 32 million."
    hints:
      - 3.2 billion is 3200 million.
      - 3200 × 0.012
    explanation: About 38 million differences – few in proportion, many in absolute terms. Many lie in stretches without function.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how to read a tree of life.
    params:
      keywords:
        - - vorfahr
          - ancestor
        - - verzweig
          - gabel
          - knoten
          - branch
          - fork
          - node
        - - verwandt
          - related
          - kinship
        - - gene
          - dna
          - mutation
          - unterschied
          - differen
      sample: Each fork in the tree is a common ancestor. The later two branches split, the more closely the species are related. You can tell by few differences in the DNA.
    explanation: Forks are ancestors, and distance to the fork measures kinship.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
