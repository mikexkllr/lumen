id: bio.evolution.drift
type: concept
title: "Chance in evolution"
summary: "Genetic drift, bottlenecks and founder effects."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: distribution
    prompt: A tiny population has two alleles, equally common. Draw 10 offspring. Do you get exactly 5 to 5? Draw at least 30 times.
    params:
      items:
        - label: Allele A
          weight: 1
        - label: Allele a
          weight: 1
      sample:
        - 10
        - 100
    check:
      predicate: draws >= 30
    hints:
      - Draw in steps of ten.
      - Watch how much the groups of ten vary.
    explanation: "With few offspring the result often strays far from 50 : 50. That is genetic drift."

  - kind: explain
    id: c1
    body: Allele frequencies also change by pure chance. Whoever happens to have more young passes on more alleles. This is called **genetic drift**. It is especially strong in small populations.

  - kind: problem
    id: c2
    widget: choice
    prompt: In which population does drift change alleles fastest?
    params:
      options:
        - label: 20 animals on a small island
          correct: true
        - label: 20,000 animals on a continent
          feedback: With many animals chance evens out.
        - label: The same in both
          feedback: "Toss a coin ten or a thousand times: the share of heads varies very differently."
    hints:
      - Think of coin tosses.
      - Small samples fluctuate more.
    explanation: Chance acts strongly in small groups. An allele can quickly vanish or take over there.

  - kind: problem
    id: c3
    widget: swipe
    prompt: Selection or drift?
    params:
      cards:
        - text: Dark moths survive more often on sooty trees.
          right: true
          why: The trait brings an advantage.
        - text: A storm kills half of the birds at random.
          right: false
          why: Who survives does not depend on the trait.
        - text: A neutral allele disappears in a small village.
          right: false
          why: Neutral means no advantage, no disadvantage. Just chance.
        - text: Bacteria with resistance survive the antibiotic.
          right: true
          why: Resistance is a clear advantage.
      left: drift
      right: selection
    explanation: Selection depends on the trait, drift does not.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In [[genetic drift]] allele frequencies change by [[chance]]. It is especially strong in [[small]] populations.
      distractors:
        - selection
        - large
    explanation: Drift is chance without direction – and the smaller the group, the bigger the swings.

  - kind: explain
    id: d1
    depth: 2
    body: If a population shrinks sharply, much diversity is lost. This is called a **bottleneck**. Northern elephant seals were hunted down to a few dozen animals around 1890. Today there are over 100,000 again, but genetically very similar.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: An island is settled by only five birds. One carries a rare allele. What is likely?
    params:
      options:
        - label: The allele is much more common on the island than on the mainland.
          correct: true
        - label: The allele disappears at once.
          feedback: It may vanish – but it starts at 1 in 10 alleles, far more common than before.
        - label: The island birds match the mainland exactly.
          feedback: Five animals are not a good sample.
    hints:
      - Five birds have ten alleles for each gene.
      - The founders are a random sample.
    explanation: This is the founder effect. Among the Amish in Pennsylvania a rare inherited disease became very common this way.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A new neutral mutation arises in a population of {{n}} animals, each with two copies of the gene. How likely is it to take over by drift? Give 1 in how many.
    answer:
      value: "{{2 * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: haploid
        text: Each animal has two copies. So there are 2N alleles.
    hints:
      - In the end all copies descend from a single one. Each has the same chance.
      - How many copies are there?
    explanation: "Of {{2 * n}} copies one becomes the ancestor of all: chance 1/{{2 * n}}. In small populations neutral mutations take over more often."
    difficulty: 2
    variants:
      params:
        n: choice[10,50,100,500]
      defaults:
        n: 50

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why are small, endangered populations doubly at risk from drift?
    params:
      options:
        - label: They lose diversity, and harmful alleles can build up by chance.
          correct: true
        - label: Drift kills animals directly.
          feedback: Drift kills no one. It shifts allele frequencies.
        - label: Small populations mutate faster.
          feedback: The mutation rate per animal is the same.
    hints:
      - What happens to rare alleles in small groups?
      - In small groups selection acts more weakly than chance.
    explanation: Little diversity means little room to adapt. That is why zoos and conservation programmes deliberately swap animals.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between selection and genetic drift.
    params:
      keywords:
        - - zufall
          - zufällig
          - zufaellig
          - chance
          - random
        - - vorteil
          - merkmal
          - advantage
          - trait
        - - klein
          - small
        - - allel
          - häufigkeit
          - haeufigkeit
          - allele
          - frequenc
      sample: In selection, alleles become more common because their trait brings an advantage. In drift, frequencies change by pure chance. That matters most in small populations.
    explanation: Selection has a direction, drift does not.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
