id: bio.evolution.speciation
type: concept
title: "Wie neue Arten entstehen"
summary: "Trennung, Anpassung und Fortpflanzungsbarrieren."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Neue Arten, live
    body: Neue Arten entstehen nicht nur in grauer Vorzeit. Manche kann man fast beim Entstehen beobachten. Deck die Karten auf und entdecke, wo sich eine **Art** gerade teilt.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍎
            front: Fliegen auf Äpfeln
            back: In den USA zog eine Fliegenart vor 150 Jahren auf Äpfel um. Sie trennt sich gerade von ihren Verwandten.
          - icon: 🐦
            front: Grasmücken im Garten
            back: Manche überwintern neu in England statt in Spanien. Die zwei Gruppen paaren sich immer seltener miteinander.
          - icon: 🐻
            front: Grizzly plus Eisbär
            back: Wo sich ihre Reviere treffen, gibt es Mischlinge. Sind es noch zwei Arten?

  - kind: problem
    id: hook
    widget: choice
    prompt: Auf den Galápagos-Inseln leben viele Finkenarten. Ihre Schnäbel passen zu verschiedenem Futter. Wie entstanden sie wohl?
    params:
      options:
        - label: Aus wenigen Vorfahren vom Festland, die sich auf den Inseln getrennt anpassten
          correct: true
        - label: Jede Art kam einzeln vom Festland.
          feedback: "Das Erbgut zeigt: Sie stammen von einem gemeinsamen Vorfahren ab."
        - label: Die Finken änderten ihre Schnäbel durch Übung.
          feedback: Geübte Schnäbel werden nicht vererbt.
    hints:
      - Inseln trennen Gruppen voneinander.
      - Jede Insel bot anderes Futter.
    explanation: Aus einer Stammart wurden durch Trennung und Selektion viele Arten. Man nennt das adaptive Radiation.

  - kind: explain
    id: c1
    body: Neue Arten entstehen meist durch Trennung. Ein Fluss, ein Gebirge oder Meer teilt eine Population. Beide Teile entwickeln sich getrennt weiter. Irgendwann können sie sich nicht mehr kreuzen. Das ist **Artbildung**.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne die Schritte der Artbildung.
    params:
      items:
        - label: Eine Population lebt zusammen
        - label: Eine Barriere trennt sie
        - label: Mutationen und Selektion wirken getrennt
        - label: Die Gruppen werden immer verschiedener
        - label: Sie können sich nicht mehr kreuzen
    hints:
      - Zuerst die Trennung, dann die Veränderung.
      - Am Ende steht die Fortpflanzungsbarriere.
    explanation: Ohne Genfluss sammeln sich Unterschiede an. Erst die Barriere für Kreuzungen macht daraus zwei Arten.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Vor oder nach der Befruchtung? Wo liegt die Barriere?
    params:
      buckets:
        - id: b1
          label: vor der Befruchtung
        - id: b2
          label: nach der Befruchtung
      items:
        - label: Verschiedene Balzlieder
          bucket: b1
        - label: Blüte zu anderen Zeiten
          bucket: b1
        - label: Organe passen nicht
          bucket: b1
        - label: Mischling ist unfruchtbar
          bucket: b2
        - label: Embryo stirbt früh
          bucket: b2
    hints:
      - Kommt es überhaupt zu einer Paarung?
      - Das Maultier ist ein Beispiel für nach der Befruchtung.
    explanation: Barrieren vor der Befruchtung verhindern die Paarung, danach scheitert der Nachwuchs.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Eine [[Barriere]] trennt die Population. Ohne [[Genfluss]] werden die Gruppen immer verschiedener. Am Ende sind es zwei [[Arten]].
      distractors:
        - Mutation
        - Zellen
    explanation: Trennung stoppt den Genfluss, die Zeit erledigt den Rest.

  - kind: explain
    id: d1
    depth: 2
    body: Artbildung geht auch ohne Gebirge. Im Viktoriasee entstanden Hunderte Buntbarscharten in nur einigen zehntausend Jahren. Weibchen wählten Männchen nach Farbe. Das trennte Gruppen im selben See. Man spricht von **sympatrischer** Artbildung.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Pferd und Esel bekommen zusammen ein Maultier. Warum gelten sie trotzdem als zwei Arten?
    params:
      options:
        - label: Das Maultier ist fast immer unfruchtbar. Die Gene fließen nicht weiter.
          correct: true
        - label: Sie sehen verschieden aus.
          feedback: Aussehen allein reicht nicht – Hunderassen sehen viel verschiedener aus.
        - label: Sie leben auf verschiedenen Kontinenten.
          feedback: Pferd und Esel leben oft am selben Ort.
    hints:
      - Was zählt bei der Definition einer Art?
      - Kann das Maultier Junge bekommen?
    explanation: Pferde haben 64, Esel 62 Chromosomen. Das Maultier hat 63 – in der Meiose finden sie keine sauberen Partner.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Zwei getrennte Populationen sammeln je {{m}} neue Mutationen pro 1000 Jahre in einem Gen. Wie viele Unterschiede trennen sie nach {{t}} 000 Jahren?
    answer:
      value: "{{2 * m * t}}"
    feedback:
      - when: numval(state.input) == m * t
        misconception: one-lineage
        text: Beide Linien verändern sich. Der Abstand wächst doppelt so schnell.
    hints:
      - Jede Linie sammelt eigene Mutationen.
      - 2 · {{m}} · {{t}}
    explanation: "{{2 * m * t}} Unterschiede. Diese Idee heißt molekulare Uhr: Aus der Zahl der Unterschiede schätzt man die Zeit seit der Trennung."
    difficulty: 2
    variants:
      params:
        m: int[1,3]
        t: int[2,10]
      defaults:
        m: 2
        t: 5

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei manchen Pflanzen verdoppelt ein Fehler die Chromosomen. Der Nachwuchs kann sich nur noch mit Seinesgleichen kreuzen. Was bedeutet das?
    params:
      options:
        - label: Eine neue Art kann in einer einzigen Generation entstehen.
          correct: true
        - label: Die Pflanze stirbt sofort.
          feedback: Viele dieser Pflanzen sind kräftig – Weizen ist so entstanden.
        - label: Nichts, die Chromosomen halbieren sich wieder.
          feedback: Die Verdopplung bleibt erhalten und wird vererbt.
    hints:
      - Kann die neue Pflanze mit der alten fruchtbaren Nachwuchs haben?
      - Ein Mischling hätte einen ungeraden Chromosomensatz.
    explanation: Das heißt Polyploidie. Brotweizen hat sechs Chromosomensätze – er ging aus drei Wildgräsern hervor.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie aus einer Art zwei werden.
    params:
      keywords:
        - - trenn
          - barriere
          - isol
          - separat
          - barrier
        - - mutation
          - selektion
          - selection
          - anpass
          - adapt
        - - kreuz
          - fortpflanz
          - interbreed
          - breed
          - reproduc
        - - verschieden
          - unterschied
          - differ
      sample: Eine Barriere trennt eine Population. In beiden Teilen wirken Mutation und Selektion getrennt, und sie werden immer verschiedener. Irgendwann können sie sich nicht mehr kreuzen – dann sind es zwei Arten.
    explanation: Trennung plus Zeit plus Selektion ergibt neue Arten.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
