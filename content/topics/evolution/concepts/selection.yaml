id: bio.evolution.selection
type: concept
title: "Natürliche Selektion"
summary: "Variation, Vererbung und Auslese."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Um 1850 waren Birkenspanner in England fast alle hell. Nach 50 Jahren Kohlerauch waren in Städten die meisten dunkel. Warum?
    params:
      options:
        - label: Auf rußigen Bäumen sahen Vögel helle Falter leichter und fraßen sie.
          correct: true
        - label: Der Ruß färbte die Falter dunkel.
          feedback: Ruß färbt nicht das Erbgut. Die Kinder wären wieder hell.
        - label: Die Falter wollten sich tarnen.
          feedback: Lebewesen können ihre Gene nicht wählen.
    hints:
      - Wer frisst Falter, und wie findet er sie?
      - Dunkle Falter gab es schon vorher, nur selten.
    explanation: Die seltenen dunklen Falter überlebten öfter und hatten mehr Nachwuchs. Nach sauberer Luft wurden die hellen wieder häufiger.

  - kind: explain
    id: c1
    body: Die **natürliche Selektion** braucht drei Zutaten. Individuen unterscheiden sich. Die Unterschiede sind erblich. Und nicht alle überleben und vermehren sich gleich gut. Dann werden günstige Merkmale häufiger.

  - kind: problem
    id: c2
    widget: order
    prompt: Bring Darwins Gedankengang in die richtige Reihenfolge.
    params:
      items:
        - label: Es gibt mehr Nachwuchs, als überleben kann
        - label: Die Jungen unterscheiden sich
        - label: Manche Merkmale helfen beim Überleben
        - label: Ihre Träger haben mehr Nachwuchs
        - label: Das Merkmal wird häufiger
    hints:
      - Am Anfang steht der Überschuss an Nachwuchs.
      - Am Ende ändert sich die Population, nicht das einzelne Tier.
    explanation: "Überschuss, Variation, Auslese, Vererbung: So verändert sich eine Population über Generationen."

  - kind: problem
    id: c3
    widget: buckets
    prompt: Darwin oder Irrtum? Wie wurde der Hals der Giraffe lang?
    params:
      buckets:
        - id: b1
          label: passt zu Darwin
        - id: b2
          label: Irrtum
      items:
        - label: Langhalsige fanden mehr Futter
          bucket: b1
        - label: Sie bekamen mehr Junge
          bucket: b1
        - label: Gestreckt und vererbt
          bucket: b2
        - label: Sie wollten höher hinaus
          bucket: b2
    hints:
      - Wird ein Merkmal vererbt, das man im Leben erwirbt?
      - Ein Bodybuilder bekommt keine muskulösen Babys.
    explanation: Erworbene Merkmale werden nicht vererbt. Selektion wählt aus Unterschieden, die schon da sind.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Selektion braucht [[Variation]], [[Vererbung]] und unterschiedlichen [[Fortpflanzungserfolg]].
      distractors:
        - Übung
        - Absicht
    explanation: Fehlt eine Zutat, gibt es keine Anpassung durch Selektion.

  - kind: explain
    id: d1
    depth: 2
    body: In der Biologie heißt **Fitness** nicht Kraft. Sie misst, wie viele Nachkommen ein Lebewesen hinterlässt, die selbst wieder Junge bekommen. Ein starkes, aber kinderloses Tier hat die Fitness null.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Grüne und braune Käfer sind je 50. Vögel fressen {{g}} % der grünen und 10 % der braunen. Wie viel Prozent der Überlebenden sind braun? Runde auf ganze Prozent.
    params:
      unit: "%"
    answer:
      value: "{{round(100 * 45 / (45 + 50 * (100 - g) / 100))}}"
      tolerance: 1
    hints:
      - Zähle erst die Überlebenden jeder Farbe.
      - "Braun: 45. Grün: 50 · {{(100 - g) / 100}}."
    explanation: "45 braune und {{50 * (100 - g) / 100}} grüne überleben. Braun: {{round(100 * 45 / (45 + 50 * (100 - g) / 100))}} %. Nach einer Generation hat sich die Mischung schon verschoben."
    difficulty: 2
    variants:
      params:
        g: choice[40,50,60,80]
      defaults:
        g: 50

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Ein Pfau trägt einen riesigen, schweren Schwanz, der ihn langsam macht. Wie kann Selektion das fördern?
    params:
      options:
        - label: Weibchen wählen Männchen mit prächtigem Schwanz. Mehr Junge wiegen das Risiko auf.
          correct: true
        - label: Der Schwanz schützt vor Räubern.
          feedback: Er macht eher auffällig und langsam.
        - label: Gar nicht, es ist ein Fehler der Natur.
          feedback: Er hält sich seit Millionen Jahren – er muss sich lohnen.
    hints:
      - Fitness heißt Nachwuchs, nicht Überleben allein.
      - Wer wählt bei Pfauen den Partner?
    explanation: Das ist sexuelle Selektion. Ein teures Merkmal kann zeigen, wie gesund ein Männchen ist.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kann Selektion ein Merkmal hervorbringen, für das es in der Population keine genetische Variation gibt?
    params:
      options:
        - label: Nein. Selektion wählt nur aus, was Mutation und Rekombination liefern.
          correct: true
        - label: Ja, wenn der Druck stark genug ist.
          feedback: Starker Druck kann eine Art sogar aussterben lassen, statt Neues zu schaffen.
        - label: Ja, Lebewesen passen ihre Gene gezielt an.
          feedback: Mutationen entstehen zufällig, nicht nach Bedarf.
    hints:
      - Woher kommen neue Allele?
      - Selektion ist ein Sieb, kein Bildhauer.
    explanation: Mutation erzeugt Neues zufällig, Selektion siebt es nicht zufällig. Erst beides zusammen ergibt Anpassung.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie natürliche Selektion funktioniert.
    params:
      keywords:
        - - unterschied
          - variation
          - verschieden
          - differ
          - vary
        - - erblich
          - vererb
          - inherit
          - heredit
          - gene
        - - überleb
          - ueberleb
          - nachwuchs
          - junge
          - surviv
          - offspring
          - reproduc
        - - häufiger
          - haeufiger
          - mehr
          - common
          - more
      sample: Tiere einer Art unterscheiden sich, und viele Unterschiede sind erblich. Wer ein günstiges Merkmal hat, überlebt eher und hat mehr Nachwuchs. So wird das Merkmal über Generationen häufiger.
    explanation: Variation, Vererbung, unterschiedlicher Fortpflanzungserfolg – mehr braucht es nicht.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
