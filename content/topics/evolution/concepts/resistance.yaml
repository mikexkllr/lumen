id: bio.evolution.resistance
type: concept
title: "Evolution in Echtzeit"
summary: "Wie Bakterien gegen Antibiotika resistent werden."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: Ein Darmbakterium teilt sich unter guten Bedingungen alle 20 Minuten. Wie viele Generationen schafft es an einem Tag?
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 72
      within: 20
    explanation: 72 Generationen am Tag. Für so viele Menschengenerationen bräuchte es rund 2000 Jahre. Darum sehen wir bei Bakterien Evolution live.

  - kind: explain
    id: c1
    body: Ein Antibiotikum tötet die meisten Bakterien. Doch einzelne tragen zufällig eine Mutation, die sie schützt. Sie überleben und vermehren sich. Bald besteht die ganze Kolonie aus ihnen. Das ist **Resistenz**.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne, wie Resistenz entsteht.
    params:
      items:
        - label: Wenige Bakterien tragen zufällig eine Schutzmutation
        - label: Ein Antibiotikum wird gegeben
        - label: Empfindliche Bakterien sterben
        - label: Resistente vermehren sich ungestört
        - label: Das Antibiotikum wirkt nicht mehr
    hints:
      - Die Mutation ist schon da, bevor das Mittel kommt.
      - Das Antibiotikum ist der Selektionsdruck.
    explanation: Das Antibiotikum erzeugt keine Resistenz – es wählt sie aus. Selektion pur.

  - kind: problem
    id: c3
    widget: choice
    prompt: Welche Aussage ist richtig?
    params:
      options:
        - label: Die Bakterien werden resistent, nicht der Mensch.
          correct: true
        - label: Der Körper gewöhnt sich an das Antibiotikum.
          feedback: Es sind die Bakterien, die sich verändern.
        - label: Antibiotika helfen auch gegen Grippe.
          feedback: Grippe ist ein Virus. Antibiotika wirken nur gegen Bakterien.
    hints:
      - Wer evolviert hier?
      - Viren haben keine Zellwand und keinen eigenen Stoffwechsel.
    explanation: Jede unnötige Einnahme, etwa bei einer Erkältung, fördert resistente Bakterien im Körper.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Nach dem Antibiotikum lebt nur ein resistentes Bakterium. Es verdoppelt sich alle 30 Minuten. Nach wie vielen Stunden sind es über 1 Million? (2 hoch 20 ≈ 1 Million)
    params:
      unit: h
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 20
        misconception: doublings-hours
        text: Das sind 20 Verdopplungen. Jede dauert eine halbe Stunde.
    hints:
      - Wie viele Verdopplungen braucht es?
      - 20 Verdopplungen · 0,5 h
    explanation: 20 · 30 min = 10 Stunden. Über Nacht wächst aus einem Überlebenden eine neue Infektion.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: Bakterien müssen Resistenz nicht selbst erfinden. Sie tauschen Gene über **Plasmide** aus, sogar zwischen Arten. Ein Resistenzgen kann so von einem harmlosen Darmbakterium auf einen Krankheitserreger springen.

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Fördert das Resistenzen oder bremst es sie?
    params:
      buckets:
        - id: b1
          label: fördert
        - id: b2
          label: bremst
      items:
        - label: Antibiotika bei Erkältung
          bucket: b1
        - label: Antibiotika im Tierfutter
          bucket: b1
        - label: Tabletten genau nach Anweisung
          bucket: b2
        - label: Händewaschen in Kliniken
          bucket: b2
        - label: Impfungen gegen Bakterien
          bucket: b2
    hints:
      - Jeder Einsatz ist Selektionsdruck.
      - Weniger Infektionen brauchen weniger Antibiotika.
    explanation: Weniger unnötiger Einsatz und weniger Ansteckung bremsen die Evolution der Resistenz.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wird ein Antibiotikum jahrelang kaum benutzt, nehmen Resistenzen dagegen oft wieder ab. Warum?
    params:
      options:
        - label: Resistenz kostet Energie. Ohne das Mittel wachsen empfindliche Bakterien schneller.
          correct: true
        - label: Die Bakterien vergessen die Resistenz.
          feedback: Bakterien lernen und vergessen nicht. Es ist Selektion.
        - label: Resistente Bakterien sterben vor Langeweile.
          feedback: Sie verlieren nur den Wettbewerb.
    hints:
      - Was passiert ohne Selektionsdruck?
      - Pumpen und Ersatz-Enzyme kosten etwas.
    explanation: Das sind Fitnesskosten. Doch manche Bakterien gleichen sie durch weitere Mutationen aus – dann bleibt die Resistenz.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Eine Studie schätzt für 2019 weltweit 1,27 Millionen Tote direkt durch resistente Bakterien. Wie viele sind das ungefähr pro Tag? Runde auf Hunderter.
    answer:
      value: 3500
      tolerance: 100
    hints:
      - Teile durch 365.
      - "1 270 000 : 365"
    explanation: Rund 3500 Menschen am Tag. Resistenzen gehören zu den größten Gesundheitsgefahren der Welt.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Antibiotika-Resistenz ein Beispiel für Evolution ist.
    params:
      keywords:
        - - mutation
          - zufall
          - zufällig
          - zufaellig
          - random
        - - überleb
          - ueberleb
          - surviv
        - - vermehr
          - teil
          - multipl
          - divid
          - reproduc
        - - selektion
          - auswahl
          - selection
          - select
      sample: "Einige Bakterien tragen zufällig eine Mutation, die vor dem Antibiotikum schützt. Sie überleben, während die anderen sterben, und vermehren sich. Das ist Selektion: Die Population verändert sich in Stunden."
    explanation: Variation, Selektion und schnelle Vermehrung – Darwin im Zeitraffer.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
