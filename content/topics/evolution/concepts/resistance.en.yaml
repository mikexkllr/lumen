id: bio.evolution.resistance
type: concept
title: "Evolution in real time"
summary: "How bacteria become resistant to antibiotics."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: A gut bacterium divides every 20 minutes under good conditions. How many generations does it manage in a day?
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 72
      within: 20
    explanation: 72 generations a day. That many human generations would take about 2000 years. That is why we see evolution live in bacteria.

  - kind: explain
    id: c1
    body: An antibiotic kills most bacteria. But a few happen to carry a mutation that protects them. They survive and multiply. Soon the whole colony consists of them. That is **resistance**.

  - kind: problem
    id: c2
    widget: order
    prompt: Order how resistance arises.
    params:
      items:
        - label: A few bacteria happen to carry a protective mutation
        - label: An antibiotic is given
        - label: Sensitive bacteria die
        - label: Resistant ones multiply undisturbed
        - label: The antibiotic stops working
    hints:
      - The mutation is already there before the drug arrives.
      - The antibiotic is the selection pressure.
    explanation: The antibiotic does not create resistance – it selects it. Selection in its purest form.

  - kind: problem
    id: c3
    widget: choice
    prompt: Which statement is correct?
    params:
      options:
        - label: The bacteria become resistant, not the person.
          correct: true
        - label: The body gets used to the antibiotic.
          feedback: It is the bacteria that change.
        - label: Antibiotics help against flu too.
          feedback: Flu is a virus. Antibiotics work only against bacteria.
    hints:
      - Who is evolving here?
      - Viruses have no cell wall and no metabolism of their own.
    explanation: Every unnecessary dose, for a cold say, favours resistant bacteria in the body.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: After the antibiotic only one resistant bacterium survives. It doubles every 30 minutes. After how many hours are there over a million? (2 to the 20th ≈ 1 million)
    params:
      unit: h
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 20
        misconception: doublings-hours
        text: That is 20 doublings. Each takes half an hour.
    hints:
      - How many doublings are needed?
      - 20 doublings × 0.5 h
    explanation: 20 × 30 min = 10 hours. Overnight a single survivor can grow into a new infection.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: Bacteria need not invent resistance themselves. They swap genes via **plasmids**, even between species. A resistance gene can jump from a harmless gut bacterium to a pathogen this way.

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Does this promote resistance or slow it down?
    params:
      buckets:
        - id: b1
          label: promotes
        - id: b2
          label: slows
      items:
        - label: Antibiotics for a cold
          bucket: b1
        - label: Antibiotics in animal feed
          bucket: b1
        - label: Pills exactly as prescribed
          bucket: b2
        - label: Handwashing in hospitals
          bucket: b2
        - label: Vaccines against bacteria
          bucket: b2
    hints:
      - Every use is selection pressure.
      - Fewer infections need fewer antibiotics.
    explanation: Less unnecessary use and less infection slow the evolution of resistance.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: When an antibiotic is hardly used for years, resistance to it often declines again. Why?
    params:
      options:
        - label: Resistance costs energy. Without the drug, sensitive bacteria grow faster.
          correct: true
        - label: The bacteria forget the resistance.
          feedback: Bacteria do not learn or forget. It is selection.
        - label: Resistant bacteria die of boredom.
          feedback: They simply lose the competition.
    hints:
      - What happens without selection pressure?
      - Pumps and spare enzymes cost something.
    explanation: These are fitness costs. But some bacteria compensate with further mutations – then the resistance stays.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A study estimates 1.27 million deaths worldwide in 2019 caused directly by resistant bacteria. About how many is that per day? Round to the nearest hundred.
    answer:
      value: 3500
      tolerance: 100
    hints:
      - Divide by 365.
      - 1,270,000 ÷ 365
    explanation: About 3500 people a day. Resistance is one of the world’s biggest health threats.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why resistant germs show evolution at work.
    params:
      keywords:
        - - mutation
          - zufall
          - zufällig
          - zufaellig
          - random
        - - überleb
          - ueberleb
          - surviv
        - - vermehr
          - teil
          - multipl
          - divid
          - reproduc
        - - selektion
          - auswahl
          - selection
          - select
      sample: "Some bacteria happen to carry a mutation that protects them from the antibiotic. They survive while the others die, and they multiply. That is selection: the population changes within hours."
    explanation: Variation, selection and fast reproduction – Darwin in fast motion.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
