id: bio.evolution.selection
type: concept
title: "Natural selection"
summary: "Variation, heredity and selection."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Around 1850 peppered moths in England were almost all pale. After 50 years of coal smoke most were dark in cities. Why?
    params:
      options:
        - label: On sooty trees birds spotted pale moths more easily and ate them.
          correct: true
        - label: The soot dyed the moths dark.
          feedback: Soot does not change genes. Their offspring would be pale again.
        - label: The moths wanted to camouflage themselves.
          feedback: Organisms cannot choose their genes.
    hints:
      - Who eats moths, and how do they find them?
      - Dark moths existed before, just rarely.
    explanation: The rare dark moths survived more often and had more offspring. Once the air was cleaner, pale moths became common again.

  - kind: explain
    id: c1
    body: "**Natural selection** needs three things. Animals differ. The differences are passed on. And not all of them survive and breed equally well. Then useful traits become more common."

  - kind: problem
    id: c2
    widget: order
    prompt: Put Darwin’s line of reasoning in the right order.
    params:
      items:
        - label: More offspring are born than can survive
        - label: The young differ from each other
        - label: Some traits help survival
        - label: Their carriers have more offspring
        - label: The trait becomes more common
    hints:
      - It starts with a surplus of offspring.
      - In the end the population changes, not the single animal.
    explanation: "Surplus, variation, selection, inheritance: that is how a population changes over generations."

  - kind: problem
    id: c3
    widget: buckets
    prompt: Darwin or mistake? How did the giraffe’s neck get long?
    params:
      buckets:
        - id: b1
          label: fits Darwin
        - id: b2
          label: mistake
      items:
        - label: Long necks found more food
          bucket: b1
        - label: They had more young
          bucket: b1
        - label: Stretched, then passed on
          bucket: b2
        - label: They wanted to reach higher
          bucket: b2
    hints:
      - Is a trait acquired during life inherited?
      - A bodybuilder does not have muscular babies.
    explanation: Acquired traits are not inherited. Selection chooses among differences that already exist.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Selection needs [[variation]], [[inheritance]] and differences in [[reproductive success]].
      distractors:
        - practice
        - intention
    explanation: If one ingredient is missing, there is no adaptation by selection.

  - kind: explain
    id: d1
    depth: 2
    body: In biology **fitness** does not mean strength. It measures how many offspring an organism leaves that go on to have young themselves. A strong but childless animal has zero fitness.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: There are 50 green and 50 brown beetles. Birds eat {{g}} % of the green and 10 % of the brown ones. What percentage of the survivors are brown? Round to whole percent.
    params:
      unit: "%"
    answer:
      value: "{{round(100 * 45 / (45 + 50 * (100 - g) / 100))}}"
      tolerance: 1
    hints:
      - First count the survivors of each colour.
      - "Brown: 45. Green: 50 × {{(100 - g) / 100}}."
    explanation: "45 brown and {{50 * (100 - g) / 100}} green survive. Brown: {{round(100 * 45 / (45 + 50 * (100 - g) / 100))}} %. After one generation the mix has already shifted."
    difficulty: 2
    variants:
      params:
        g: choice[40,50,60,80]
      defaults:
        g: 50

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A peacock carries a huge, heavy tail that slows him down. How can selection favour that?
    params:
      options:
        - label: Females choose males with splendid tails. More young outweigh the risk.
          correct: true
        - label: The tail protects against predators.
          feedback: It rather makes him conspicuous and slow.
        - label: It cannot, it is a mistake of nature.
          feedback: It has lasted for millions of years – it must pay off.
    hints:
      - Fitness means offspring, not survival alone.
      - Who chooses the partner in peafowl?
    explanation: This is sexual selection. A costly trait can show how healthy a male is.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Can selection produce a trait for which there is no genetic variation in the population?
    params:
      options:
        - label: No. Selection only chooses from what mutation and recombination supply.
          correct: true
        - label: Yes, if the pressure is strong enough.
          feedback: Strong pressure can even drive a species extinct rather than create something new.
        - label: Yes, organisms adjust their genes on purpose.
          feedback: Mutations arise at random, not on demand.
    hints:
      - Where do new alleles come from?
      - Selection is a sieve, not a sculptor.
    explanation: Mutation creates novelty at random, selection sieves it non-randomly. Only together do they produce adaptation.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how natural selection works.
    params:
      keywords:
        - - unterschied
          - variation
          - verschieden
          - differ
          - vary
        - - erblich
          - vererb
          - inherit
          - heredit
          - gene
        - - überleb
          - ueberleb
          - nachwuchs
          - junge
          - surviv
          - offspring
          - reproduc
        - - häufiger
          - haeufiger
          - mehr
          - common
          - more
      sample: Animals of a species differ, and many differences are inherited. Those with a helpful trait survive more often and have more offspring. So the trait becomes more common over generations.
    explanation: Variation, inheritance, different reproductive success – that is all it takes.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
