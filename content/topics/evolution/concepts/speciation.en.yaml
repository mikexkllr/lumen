id: bio.evolution.speciation
type: concept
title: "How new species arise"
summary: "Separation, adaptation and reproductive barriers."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: New species, live
    body: New species do not only arise in the distant past. Some you can almost watch forming. Uncover the cards and discover where a **species** is splitting right now.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍎
            front: Flies on apples
            back: In the USA, a fly moved onto apples 150 years ago. It is now splitting from its relatives.
          - icon: 🐦
            front: Blackcaps in gardens
            back: Some now winter in Britain instead of Spain. The two groups mate with each other less and less.
          - icon: 🐻
            front: Grizzly plus polar bear
            back: Where their ranges meet, hybrids appear. Are they still two species?

  - kind: problem
    id: hook
    widget: choice
    prompt: The Galápagos Islands are home to many finch species. Their beaks suit different foods. How did they probably arise?
    params:
      options:
        - label: From a few ancestors from the mainland that adapted separately on the islands
          correct: true
        - label: Each species came separately from the mainland.
          feedback: Their genes show a single common ancestor.
        - label: The finches changed their beaks by practice.
          feedback: Practised beaks are not inherited.
    hints:
      - Islands separate groups from each other.
      - Each island offered different food.
    explanation: Separation and selection turned one ancestral species into many. This is called adaptive radiation.

  - kind: explain
    id: c1
    body: New species usually arise through separation. A river, a mountain range or the sea splits a population. The two parts evolve separately. Eventually they can no longer interbreed. That is **speciation**.

  - kind: problem
    id: c2
    widget: order
    prompt: Order the steps of speciation.
    params:
      items:
        - label: A population lives together
        - label: A barrier splits it
        - label: Mutation and selection act separately
        - label: The groups grow more and more different
        - label: They can no longer interbreed
    hints:
      - First the separation, then the change.
      - At the end comes the reproductive barrier.
    explanation: Without gene flow differences pile up. Only a barrier to interbreeding makes them two species.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Before or after fertilisation? Where is the barrier?
    params:
      buckets:
        - id: b1
          label: before fertilisation
        - id: b2
          label: after fertilisation
      items:
        - label: Different courtship songs
          bucket: b1
        - label: Flowering at different times
          bucket: b1
        - label: Organs do not fit
          bucket: b1
        - label: Hybrid is infertile
          bucket: b2
        - label: Embryo dies early
          bucket: b2
    hints:
      - Does mating even happen?
      - The mule is an example of after fertilisation.
    explanation: Barriers before fertilisation prevent mating; after it, the offspring fail.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A [[barrier]] splits the population. Without [[gene flow]] the groups grow ever more different. In the end they are two [[species]].
      distractors:
        - mutation
        - cells
    explanation: Separation stops gene flow, time does the rest.

  - kind: explain
    id: d1
    depth: 2
    body: Speciation can happen without mountains. In Lake Victoria hundreds of cichlid species arose in only a few tens of thousands of years. Females chose males by colour. That split groups within the same lake. This is called **sympatric** speciation.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A horse and a donkey together produce a mule. Why are they still two species?
    params:
      options:
        - label: The mule is almost always infertile. The genes go no further.
          correct: true
        - label: They look different.
          feedback: Looks alone are not enough – dog breeds look far more different.
        - label: They live on different continents.
          feedback: Horses and donkeys often live in the same place.
    hints:
      - What counts in the definition of a species?
      - Can the mule have young?
    explanation: Horses have 64 chromosomes, donkeys 62. The mule has 63 – in meiosis they cannot pair up properly.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Two separated populations each collect {{m}} new mutations per 1000 years in a gene. How many differences separate them after {{t}},000 years?
    answer:
      value: "{{2 * m * t}}"
    feedback:
      - when: numval(state.input) == m * t
        misconception: one-lineage
        text: Both lineages change. The gap grows twice as fast.
    hints:
      - Each lineage collects its own mutations.
      - 2 × {{m}} × {{t}}
    explanation: "{{2 * m * t}} differences. This idea is called the molecular clock: from the number of differences we estimate the time since the split."
    difficulty: 2
    variants:
      params:
        m: int[1,3]
        t: int[2,10]
      defaults:
        m: 2
        t: 5

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In some plants an error doubles the chromosomes. The offspring can then only breed with their own kind. What does that mean?
    params:
      options:
        - label: A new species can arise in a single generation.
          correct: true
        - label: The plant dies at once.
          feedback: Many such plants are vigorous – wheat arose this way.
        - label: Nothing, the chromosomes halve again.
          feedback: The doubling stays and is inherited.
    hints:
      - Can the new plant have fertile offspring with the old one?
      - A hybrid would have an odd chromosome set.
    explanation: This is called polyploidy. Bread wheat has six chromosome sets – it arose from three wild grasses.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how one species becomes two.
    params:
      keywords:
        - - trenn
          - barriere
          - isol
          - separat
          - barrier
        - - mutation
          - selektion
          - selection
          - anpass
          - adapt
        - - kreuz
          - fortpflanz
          - interbreed
          - breed
          - reproduc
        - - verschieden
          - unterschied
          - differ
      sample: A barrier separates a population. Mutation and selection act separately in each part, and they become more and more different. Eventually they can no longer interbreed – then they are two species.
    explanation: Separation plus time plus selection gives new species.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
