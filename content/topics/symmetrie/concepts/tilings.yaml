id: geo.symmetry.tilings
type: concept
title: Parkette
summary: Welche Fliesen lückenlos passen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: fliesen
    widget: buckets
    prompt: Mit welchen regelmäßigen Formen allein kann man einen Boden lückenlos fliesen?
    params:
      buckets: [{ label: passt lückenlos }, { label: lässt Lücken }]
      items:
        - { label: Dreieck, bucket: passt lückenlos }
        - { label: Quadrat, bucket: passt lückenlos }
        - { label: Sechseck, bucket: passt lückenlos }
        - { label: Fünfeck, bucket: lässt Lücken }
        - { label: Achteck, bucket: lässt Lücken }
    hints:
      - An jeder Ecke müssen die Winkel zusammen genau 360° ergeben.
    explanation: Nur 60°, 90° und 120° teilen 360° glatt – also Dreieck, Quadrat und Sechseck.

  - kind: explain
    body: |
      An jeder Ecke eines Parketts treffen Winkel zusammen, die **360°** ergeben müssen.
      Das Fünfeck hat 108° – 360 geteilt durch 108 geht nicht auf.

  - kind: problem
    id: ecke
    widget: numeric
    prompt: Wie viele regelmäßige Sechsecke (je 120°) treffen sich an einer Ecke?
    params: { unit: Sechsecke }
    answer: { value: 3 }
    hints:
      - 360 geteilt durch 120.
    explanation: 3 · 120° = 360°. Bienen nutzen genau dieses Muster.

  - kind: explain
    body: Warum bauen Bienen Sechsecke statt Quadrate?
    reveal:
      body: Sechsecke umschließen bei gleichem Wachs die größte Fläche. Bienen sparen so Baumaterial.

srs:
  cards_from: [fliesen, ecke]
