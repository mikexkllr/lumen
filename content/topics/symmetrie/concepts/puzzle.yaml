id: geo.symmetry.puzzle
type: concept
title: Doppelt gespiegelt
summary: Zwei Achsen, vier Viertel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vier-viertel
    widget: pixels
    prompt: Oben links ist ein Viertel vorgegeben. Ergänze den Rest, sodass das Bild an beiden roten Achsen symmetrisch ist.
    params:
      mirror: both
      cells: ["#.....", ".#....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["#....#", ".#..#.", "..##..", "..##..", ".#..#.", "#....#"] }
    hints:
      - Spiegle erst nach rechts, dann alles nach unten.
    explanation: Ein Viertel bestimmt bei zwei Achsen das ganze Bild.

  - kind: explain
    id: s2
    body: Mit zwei Spiegelachsen entsteht aus einem Viertel das ganze Bild. Viele Logos und Schneeflocken sind so gebaut.

  - kind: problem
    id: rahmen
    widget: pixels
    prompt: Noch eins – ergänze das Muster symmetrisch zu beiden Achsen.
    params:
      mirror: both
      cells: ["##....", "#.....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["##..##", "#....#", "..##..", "..##..", "#....#", "##..##"] }
    hints:
      - Jedes Feld hat drei Partner – rechts, unten und schräg gegenüber.
    explanation: Jedes gefärbte Feld kommt viermal vor – je eins pro Viertel.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: Ein Viertel enthält {{n}} gefärbte Felder, keins auf einer Achse. Wie viele sind es im ganzen Bild?
    params: { unit: Felder }
    answer: { value: "{{4 * n}}" }
    hints:
      - Jedes Feld taucht in jedem Viertel einmal auf.
    explanation: "4 · {{n}} = {{4 * n}}."
    variants:
      params: { n: "int[3,9]" }
      defaults: { n: 5 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Bild hat zwei Spiegelachsen. Ein Viertel enthält 5 gefärbte Felder, davon liegen 2 genau auf einer Achse. Wie viele gefärbte Felder hat das ganze Bild?
    answer:
      value: 16
    hints:
      - Felder auf einer Achse werden nur verdoppelt, die anderen vervierfacht.
    explanation: 3 · 4 + 2 · 2 = 16. Was auf der Achse liegt, ist sein eigenes Spiegelbild.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Schneeflocke hat sechs Spiegelachsen. Wie groß ist das kleinste Stück, aus dem sich die ganze Flocke durch Spiegeln ergibt?
    params:
      options:
        - label: Ein Zwölftel
          correct: true
        - label: Ein Sechstel
          feedback: Jedes Sechstel hat selbst noch eine Achse in der Mitte.
        - label: Ein Drittel
          feedback: Sechs Achsen teilen den Kreis in viel feinere Stücke.
    hints:
      - Sechs Achsen sind zwölf Halbstrahlen vom Mittelpunkt aus.
    explanation: Sechs Achsen teilen in 12 Keile von 30°. Dieses Stück heißt **Fundamentalbereich**.
    difficulty: 3

srs:
  cards_from: [wie-viele, vier-viertel]
