id: geo.symmetry.puzzle
type: concept
title: Doppelt gespiegelt
summary: Zwei Achsen, vier Viertel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vier-viertel
    widget: pixels
    prompt: Oben links ist ein Viertel vorgegeben. Ergänze den Rest, sodass das Bild an beiden roten Achsen symmetrisch ist.
    params:
      mirror: both
      cells: ["#.....", ".#....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["#....#", ".#..#.", "..##..", "..##..", ".#..#.", "#....#"] }
    hints:
      - Spiegle erst nach rechts, dann alles nach unten.
    explanation: Ein Viertel bestimmt bei zwei Achsen das ganze Bild.

  - kind: explain
    body: Mit zwei Spiegelachsen entsteht aus einem Viertel das ganze Bild. Viele Logos und Schneeflocken sind so gebaut.

  - kind: problem
    id: rahmen
    widget: pixels
    prompt: Noch eins – ergänze das Muster symmetrisch zu beiden Achsen.
    params:
      mirror: both
      cells: ["##....", "#.....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["##..##", "#....#", "..##..", "..##..", "#....#", "##..##"] }
    hints:
      - Jedes Feld hat drei Partner – rechts, unten und schräg gegenüber.
    explanation: Jedes gefärbte Feld kommt viermal vor – je eins pro Viertel.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: Ein Viertel enthält {{n}} gefärbte Felder, keins auf einer Achse. Wie viele sind es im ganzen Bild?
    params: { unit: Felder }
    answer: { value: "{{4 * n}}" }
    hints:
      - Jedes Feld taucht in jedem Viertel einmal auf.
    explanation: "4 · {{n}} = {{4 * n}}."
    variants:
      params: { n: "int[3,9]" }
      defaults: { n: 5 }

srs:
  cards_from: [wie-viele, vier-viertel]
