id: geo.symmetry.rotation
type: concept
title: Drehen
summary: Wann sieht es wieder gleich aus?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Karte auf dem Kopf
    body: "Spielkarten haben einen Trick: Man kann sie von beiden Enden lesen. Deck auf, was bei jeder Vierteldrehung passiert. Wann sieht die Karte wieder genauso aus? Das ist **Drehsymmetrie**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🃏
            front: "Start: 0°"
            back: Die Dame steht aufrecht, ihr Kopf ist oben.
          - icon: ↪️
            front: "Vierteldrehung: 90°"
            back: Die Karte liegt quer – so sieht sie ganz anders aus.
          - icon: 🔄
            front: "Halbe Drehung: 180°"
            back: Wieder ist ein Kopf oben – die Karte sieht aus wie am Start!
          - icon: 🔁
            front: "Volle Drehung: 360°"
            back: Zurück am Anfang – nach 360° passt jede Figur, spannend ist nur, was früher passt.

  - kind: problem
    id: windrad
    widget: choice
    prompt: Ein Windrad hat drei gleiche Flügel. Nach wie viel Grad Drehung sieht es wieder gleich aus?
    params:
      layout: grid
      options:
        - { label: "120°", correct: true }
        - { label: "90°", feedback: "Das passt zu vier Flügeln." }
        - { label: "180°", feedback: "Das passt zu zwei Flügeln." }
        - { label: "360°", feedback: "Das stimmt auch – aber es klappt schon früher." }
    hints:
      - Teile die volle Drehung gerecht auf drei Flügel auf.
    explanation: 360° geteilt durch 3 Flügel ergibt 120°.

  - kind: explain
    id: s2
    body: |
      **Drehsymmetrie** – eine Figur sieht nach einer Drehung unter 360° wieder gleich aus.
      Ein gleichseitiges Dreieck schafft das nach 120°.

  - kind: problem
    id: n-eck
    widget: numeric
    prompt: Ein regelmäßiges {{n}}-Eck wird gedreht. Nach wie viel Grad sieht es zum ersten Mal wieder gleich aus?
    params: { unit: "°" }
    answer: { value: "{{360 / n}}" }
    feedback:
      - when: "numval(state.input) == 360"
        misconception: full-turn
        text: Das klappt immer. Gesucht ist die kleinste Drehung.
    hints:
      - Teile 360° durch die Zahl der Ecken.
    explanation: "360° : {{n}} = {{360 / n}}°."
    variants:
      params: { n: "choice[4,5,6,8,10,12]" }
      defaults: { n: 6 }

  - kind: problem
    id: punkt
    widget: choice
    prompt: Welcher Buchstabe sieht nach einer halben Drehung (180°) gleich aus?
    params:
      layout: grid
      options:
        - { label: S, correct: true }
        - { label: A, feedback: "Auf dem Kopf steht die Spitze unten." }
        - { label: E, feedback: "Gedreht zeigen die Striche nach links." }
        - { label: T, feedback: "Gedreht ist der Balken unten." }
    hints:
      - Dreh dein Handy einmal auf den Kopf.
    explanation: S, N und Z sind **punktsymmetrisch**. Sie sehen nach 180° gleich aus.

  - kind: explain
    id: s5
    body: Wo steckt Symmetrie in der Natur?
    reveal:
      body: Ein Seestern hat fünf gleiche Arme, eine Schneeflocke sechs. Dreht man sie ein Stück, sehen sie gleich aus. Unser Gesicht ist nur fast gleich.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Ein Quadrat sieht nach [[90°]] wieder gleich aus, ein regelmäßiges Sechseck nach [[60°]]. Die Regel: 360° geteilt durch die Zahl der [[Ecken]]."
      distractors:
        - 45°
        - Achsen

  - kind: problem
    id: ma-c1
    widget: angle
    prompt: Stelle den kleinsten Drehwinkel ein, nach dem ein Quadrat wieder genauso aussieht.
    params:
      initial: 0
      snap: 5
    answer:
      value: 90
    hints:
      - Ein Quadrat hat 4 gleiche Ecken.
      - 360° geteilt durch 4.
    explanation: Nach 90° liegt jede Ecke dort, wo vorher die nächste war.

  - kind: problem
    id: d1
    depth: 2
    widget: buckets
    prompt: Welche Symmetrie hat die Figur?
    params:
      buckets:
        - id: b1
          label: Nur Achsen
        - id: b2
          label: Nur Drehung
        - id: b3
          label: Beides
      items:
        - label: Buchstabe A
          bucket: b1
        - label: Buchstabe S
          bucket: b2
        - label: Buchstabe H
          bucket: b3
        - label: Windrad
          bucket: b2
        - label: Quadrat
          bucket: b3
        - label: Herz
          bucket: b1
    hints:
      - Dreh die Figur in Gedanken um 180°. Und falte sie in der Mitte.
    explanation: S und das Windrad lassen sich drehen, aber nicht spiegeln. A und das Herz nur spiegeln.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Die **Ordnung** einer Drehsymmetrie zählt, wie oft eine Figur bei einer vollen Umdrehung gleich aussieht. Ein Windrad mit drei Flügeln hat die Ordnung 3.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Ein Stern hat {{n}} gleiche Zacken. Er sieht nach Drehungen um {{360 / n}}°, {{720 / n}}° … wieder gleich aus. Welche Ordnung hat seine Drehsymmetrie?
    answer:
      value: "{{n}}"
    feedback:
      - when: numval(state.input) == 360 / n
        misconception: angle-vs-order
        text: Das ist der kleinste Drehwinkel. Gefragt ist, wie oft es passt.
    hints:
      - Wie oft passt {{360 / n}}° in 360°?
      - "360 : {{360 / n}} = ?"
    explanation: "360° : {{360 / n}}° = {{n}}. Die Ordnung ist {{n}} – so viele Zacken."
    difficulty: 2
    variants:
      params:
        n: choice[4,5,6,8,9,10,12]
      defaults:
        n: 5

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Sieht der Großbuchstabe nach einer halben Drehung (180°) gleich aus?
    params:
      buckets:
        - id: b1
          label: ja
        - id: b2
          label: nein
      items:
        - label: N
          bucket: b1
        - label: Z
          bucket: b1
        - label: H
          bucket: b1
        - label: A
          bucket: b2
        - label: E
          bucket: b2
        - label: T
          bucket: b2
    hints:
      - Stell dir vor, du stellst das Blatt auf den Kopf.
      - Ein auf dem Kopf stehendes A zeigt mit der Spitze nach unten.
    explanation: N, Z und H sind punktsymmetrisch. A, E und T stehen nach der Drehung falsch herum.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Quadrat hat 4 Drehungen und 4 Spiegelungen, die es auf sich selbst abbilden. Wie viele solche Symmetrien hat ein regelmäßiges Fünfeck?
    answer:
      value: 10
    hints:
      - Zähle die Drehungen (auch die um 0°) und die Achsen.
    explanation: 5 Drehungen und 5 Spiegelungen. Diese 2n Symmetrien bilden die **Diedergruppe** – der Einstieg in die Gruppentheorie.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: Du drehst ein Quadrat erst um 90° und dann um 270°. Welche einzelne Drehung macht dasselbe?
    params:
      options:
        - label: 0° – es liegt wieder wie am Anfang
          correct: true
        - label: 180°
          feedback: 90° + 270° = 360°, nicht 180°.
        - label: 360° gibt es nicht
          feedback: 360° ist dasselbe wie 0°.
    hints:
      - Addiere die beiden Winkel.
      - 360° ist eine volle Umdrehung.
    explanation: 90° + 270° = 360° – eine volle Umdrehung, also wie 0°. Symmetrien hintereinander ergeben wieder eine Symmetrie.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Alle Symmetrien einer Figur bilden eine **Gruppe**: Zwei hintereinander ergeben wieder eine Symmetrie. Nichtstun gehört dazu. Und jede lässt sich rückgängig machen. Gruppen sind ein Grundbegriff der Algebra."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Wie viele Drehungen bilden einen Würfel auf sich ab? Die Drehung um 0° zählt mit.
    answer:
      value: 24
    feedback:
      - when: numval(state.input) == 6
        misconception: faces-only
        text: Das sind nur die Flächen, die oben liegen können. Jede lässt sich noch viermal drehen.
      - when: numval(state.input) == 48
        misconception: with-reflections
        text: Das wären auch die Spiegelungen. Gefragt sind nur Drehungen.
    hints:
      - Wähle erst, welche Fläche oben liegt.
      - 6 Flächen oben, jeweils 4 Stellungen.
    explanation: 6 · 4 = 24. Diese Drehgruppe des Würfels taucht in der Chemie und bei Kristallen wieder auf.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, nach welchem Winkel ein regelmäßiges Sechseck wieder gleich aussieht – und warum.
    params:
      keywords:
        - - "360"
        - - sechs
          - six
          - ecken
          - corners
        - - "60"
          - geteilt
          - divid
          - teilen
      sample: Eine volle Drehung hat 360 Grad. Das Sechseck hat sechs gleiche Ecken. Nach 360 geteilt durch 6, also 60 Grad, liegt jede Ecke auf dem Platz der nächsten.
    explanation: "Kernidee: kleinster Drehwinkel = 360° geteilt durch die Ordnung."
    difficulty: 3

srs:
  cards_from: [n-eck, windrad]
