id: geo.symmetry.moves
type: concept
title: Verschieben und Spiegeln im Koordinatensystem
summary: Abbildungen als Rechenregeln.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Punkte auf Reisen
    body: In jedem Videospiel wandern Figuren über ein Raster. Zieh den Punkt P kreuz und quer und beobachte seine **Koordinaten**. Welche Zahl ändert sich nach rechts, welche nach oben?
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -4
          - 4
        y:
          - -3
          - 3
        points:
          - id: P
            x: -2
            y: -1
            label: P

  - kind: problem
    id: verschieben
    widget: graph
    prompt: Verschiebe P um 3 nach rechts und 2 nach oben. Ziehe P′ an die richtige Stelle.
    params:
      x: [-4, 4]
      y: [-3, 3]
      points:
        - { id: P, x: -2, y: -1, draggable: false }
        - { id: Q, x: 0, y: 0, label: "P′" }
    answer: { points: { Q: { x: 1, y: 1 } } }
    hints:
      - Starte bei P und zähle die Kästchen ab.
    explanation: (−2 | −1) wird zu (−2 + 3 | −1 + 2) = (1 | 1).

  - kind: explain
    id: s2
    body: |
      Eine **Verschiebung** addiert zu jedem Punkt dasselbe.
      Aus (x | y) wird (x + a | y + b).

  - kind: problem
    id: spiegeln-y
    widget: graph
    prompt: Spiegle P an der y-Achse. Ziehe P′ an die richtige Stelle.
    params:
      x: [-4, 4]
      y: [-3, 3]
      points:
        - { id: P, x: 3, y: 2, draggable: false }
        - { id: Q, x: 0, y: -2, label: "P′" }
    answer: { points: { Q: { x: -3, y: 2 } } }
    feedback:
      - when: "state.points.Q.x == 3 && state.points.Q.y == -2"
        misconception: wrong-axis
        text: Das ist die Spiegelung an der x-Achse. Die y-Achse ist die senkrechte.
    hints:
      - Die y-Achse steht senkrecht. Der Punkt springt nach links.
    explanation: x wechselt das Vorzeichen, y bleibt. Aus (3 | 2) wird (−3 | 2).

  - kind: problem
    id: x-achse
    widget: numeric
    prompt: Der Punkt ({{a}} | {{b}}) wird an der x-Achse gespiegelt. Welche y-Koordinate hat das Bild?
    params: { placeholder: "y" }
    answer: { value: "{{-b}}" }
    feedback:
      - when: "numval(state.input) == b"
        misconception: no-change
        text: Beim Spiegeln an der x-Achse ändert sich gerade die y-Koordinate.
    hints:
      - Die x-Achse liegt waagerecht. Der Punkt springt nach oben oder unten.
    explanation: "Aus ({{a}} | {{b}}) wird ({{a}} | {{-b}})."
    variants:
      params: { a: "nonzero[-5,5]", b: "nonzero[-5,5]" }
      defaults: { a: 4, b: -1 }

  - kind: problem
    id: regel
    widget: choice
    prompt: Was ändert eine Spiegelung an der y-Achse?
    params:
      options:
        - { label: Das Vorzeichen von x, correct: true }
        - { label: Das Vorzeichen von y, feedback: "Das macht die Spiegelung an der x-Achse." }
        - { label: Beide Vorzeichen, feedback: "Das wäre eine halbe Drehung um den Ursprung." }
    hints:
      - Denk an P(3 | 2) von eben.
    explanation: Links und rechts tauschen. Nur x wechselt das Vorzeichen.

  - kind: problem
    id: c1
    widget: match
    prompt: Welche Regel gehört zu welcher Abbildung?
    params:
      pairs:
        - left: (x | y) → (x + 3 | y)
          right: Verschiebung nach rechts
        - left: (x | y) → (−x | y)
          right: Spiegelung an der y-Achse
        - left: (x | y) → (x | −y)
          right: Spiegelung an der x-Achse
        - left: (x | y) → (−x | −y)
          right: Drehung um 180°
    hints:
      - Setz den Punkt (2 | 1) ein und schau, wo er landet.
    explanation: Jede Abbildung ist eine Rechenregel für die Koordinaten.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Punkt (4 | 1) wird um 90° gegen den Uhrzeigersinn um den Ursprung gedreht. Welche x-Koordinate hat das Bild?
    answer:
      value: -1
    hints:
      - Die Regel lautet (x | y) → (−y | x).
    explanation: Aus (4 | 1) wird (−1 | 4). Die Koordinaten tauschen, eine wechselt das Vorzeichen.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: graph
    prompt: Drehe P um 90° gegen den Uhrzeigersinn um den Ursprung. Ziehe P′ an die richtige Stelle.
    params:
      x:
        - -4
        - 4
      y:
        - -4
        - 4
      points:
        - id: P
          x: 3
          y: 1
          draggable: false
        - id: Q
          x: 0
          y: -2
          label: P′
    answer:
      points:
        Q:
          x: -1
          y: 3
    hints:
      - Stell dir einen Zeiger vom Ursprung zu P vor. Dreh ihn nach links.
      - "Die Regel: (x | y) wird zu (−y | x)."
    explanation: (3 | 1) wird zu (−1 | 3). Der Abstand zum Ursprung bleibt gleich.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: Verschieben, Spiegeln und Drehen heißen **Kongruenzabbildungen**. Längen und Winkel bleiben gleich. Die Figur ändert nur ihre Lage, nicht ihre Form.

  - kind: problem
    id: ma-d3
    depth: 2
    widget: graph
    prompt: "Jetzt wird gestreckt: Ziehe P′ doppelt so weit vom Ursprung weg wie P, in dieselbe Richtung."
    params:
      x:
        - -1
        - 5
      y:
        - -1
        - 5
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
          label: O
        - id: P
          x: 1
          y: 2
          draggable: false
        - id: Q
          x: 4
          y: 0
          label: P′
    answer:
      points:
        Q:
          x: 2
          y: 4
    hints:
      - Beide Koordinaten werden verdoppelt.
      - (1 | 2) mal 2.
    explanation: (1 | 2) wird zu (2 | 4). Das ist eine zentrische Streckung mit Faktor 2. Längen verdoppeln sich – sie ist keine Kongruenzabbildung.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: choice
    prompt: Welche Abbildung ändert die Größe einer Figur?
    params:
      options:
        - label: Verschiebung
          feedback: Alles rückt nur weiter.
        - label: Spiegelung
          feedback: Das Spiegelbild ist gleich groß.
        - label: Drehung
          feedback: Beim Drehen bleiben Längen gleich.
        - label: Streckung
          correct: true
    hints:
      - Welche Abbildung rechnet »mal«?
      - Die anderen drei sind Kongruenzabbildungen.
    explanation: Nur die Streckung multipliziert alle Abstände mit einem Faktor.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du spiegelst erst an der x-Achse, dann an der y-Achse. Welche einzelne Abbildung macht dasselbe?
    params:
      options:
        - label: Drehung um 180° um den Ursprung
          correct: true
        - label: Spiegelung an der Geraden y = x
          feedback: Die tauscht x und y. Hier wechseln nur beide Vorzeichen.
        - label: Gar keine – der Punkt ist wieder am Start
          feedback: Dafür müsstest du zweimal an derselben Achse spiegeln.
    hints:
      - Was wird aus (x | y) nach beiden Schritten?
    explanation: Aus (x | y) wird (−x | −y). Abbildungen lassen sich **verketten** – wie Funktionen.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Die Drehung um 90° macht aus (x | y) den Punkt (−y | x). Wende sie zweimal auf (2 | 5) an. Welche y-Koordinate hat das Ergebnis?
    answer:
      value: -5
    feedback:
      - when: numval(state.input) == 2
        misconception: one-step
        text: "Das ist das Ergebnis nach einer Drehung: (−5 | 2). Noch einmal!"
    hints:
      - "Nach einer Drehung: (−5 | 2)."
      - "Noch einmal: (−2 | −5)."
    explanation: "Zweimal 90° sind 180°: (2 | 5) wird zu (−2 | −5). Beide Vorzeichen kippen."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Erst an der y-Achse spiegeln, dann um 2 nach rechts schieben. Ist das dasselbe wie erst schieben, dann spiegeln?
    params:
      options:
        - label: Ja, die Reihenfolge ist egal
          feedback: Probiere den Punkt (0 | 0) beide Wege.
        - label: Nein – (0 | 0) landet einmal bei (2 | 0), einmal bei (−2 | 0)
          correct: true
    hints:
      - Probiere es mit dem Ursprung.
      - "Schieben, dann spiegeln: (0 | 0) → (2 | 0) → (−2 | 0)."
    explanation: "Bei Abbildungen kommt es auf die Reihenfolge an. Mathematiker sagen: Sie sind nicht kommutativ."
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: "Jede dieser Abbildungen lässt sich als **Matrix** schreiben. Zwei Abbildungen hintereinander heißt dann: Matrizen malnehmen. Damit rechnen Computerspiele jede Drehung."

srs:
  cards_from: [x-achse, regel]
