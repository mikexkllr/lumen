id: geo.symmetry.moves
type: concept
title: Verschieben und Spiegeln im Koordinatensystem
summary: Abbildungen als Rechenregeln.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: verschieben
    widget: graph
    prompt: Verschiebe P um 3 nach rechts und 2 nach oben. Ziehe P′ an die richtige Stelle.
    params:
      x: [-4, 4]
      y: [-3, 3]
      points:
        - { id: P, x: -2, y: -1, draggable: false }
        - { id: Q, x: 0, y: 0, label: "P′" }
    answer: { points: { Q: { x: 1, y: 1 } } }
    hints:
      - Starte bei P und zähle die Kästchen ab.
    explanation: (−2 | −1) wird zu (−2 + 3 | −1 + 2) = (1 | 1).

  - kind: explain
    id: s2
    body: |
      Eine **Verschiebung** addiert zu jedem Punkt dasselbe.
      Aus (x | y) wird (x + a | y + b).

  - kind: problem
    id: spiegeln-y
    widget: graph
    prompt: Spiegle P an der y-Achse. Ziehe P′ an die richtige Stelle.
    params:
      x: [-4, 4]
      y: [-3, 3]
      points:
        - { id: P, x: 3, y: 2, draggable: false }
        - { id: Q, x: 0, y: -2, label: "P′" }
    answer: { points: { Q: { x: -3, y: 2 } } }
    feedback:
      - when: "state.points.Q.x == 3 && state.points.Q.y == -2"
        misconception: wrong-axis
        text: Das ist die Spiegelung an der x-Achse. Die y-Achse ist die senkrechte.
    hints:
      - Die y-Achse steht senkrecht. Der Punkt springt nach links.
    explanation: x wechselt das Vorzeichen, y bleibt. Aus (3 | 2) wird (−3 | 2).

  - kind: problem
    id: x-achse
    widget: numeric
    prompt: Der Punkt ({{a}} | {{b}}) wird an der x-Achse gespiegelt. Welche y-Koordinate hat das Bild?
    params: { placeholder: "y" }
    answer: { value: "{{-b}}" }
    feedback:
      - when: "numval(state.input) == b"
        misconception: no-change
        text: Beim Spiegeln an der x-Achse ändert sich gerade die y-Koordinate.
    hints:
      - Die x-Achse liegt waagerecht. Der Punkt springt nach oben oder unten.
    explanation: "Aus ({{a}} | {{b}}) wird ({{a}} | {{-b}})."
    variants:
      params: { a: "nonzero[-5,5]", b: "nonzero[-5,5]" }
      defaults: { a: 4, b: -1 }

  - kind: problem
    id: regel
    widget: choice
    prompt: Was ändert eine Spiegelung an der y-Achse?
    params:
      options:
        - { label: Das Vorzeichen von x, correct: true }
        - { label: Das Vorzeichen von y, feedback: "Das macht die Spiegelung an der x-Achse." }
        - { label: Beide Vorzeichen, feedback: "Das wäre eine halbe Drehung um den Ursprung." }
    hints:
      - Denk an P(3 | 2) von eben.
    explanation: Links und rechts tauschen. Nur x wechselt das Vorzeichen.

  - kind: problem
    id: c1
    widget: match
    prompt: Welche Regel gehört zu welcher Abbildung?
    params:
      pairs:
        - left: (x | y) → (x + 3 | y)
          right: Verschiebung nach rechts
        - left: (x | y) → (−x | y)
          right: Spiegelung an der y-Achse
        - left: (x | y) → (x | −y)
          right: Spiegelung an der x-Achse
        - left: (x | y) → (−x | −y)
          right: Drehung um 180°
    hints:
      - Setz den Punkt (2 | 1) ein und schau, wo er landet.
    explanation: Jede Abbildung ist eine Rechenregel für die Koordinaten.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Punkt (4 | 1) wird um 90° gegen den Uhrzeigersinn um den Ursprung gedreht. Welche x-Koordinate hat das Bild?
    answer:
      value: -1
    hints:
      - Die Regel lautet (x | y) → (−y | x).
    explanation: Aus (4 | 1) wird (−1 | 4). Die Koordinaten tauschen, eine wechselt das Vorzeichen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du spiegelst erst an der x-Achse, dann an der y-Achse. Welche einzelne Abbildung macht dasselbe?
    params:
      options:
        - label: Drehung um 180° um den Ursprung
          correct: true
        - label: Spiegelung an der Geraden y = x
          feedback: Die tauscht x und y. Hier wechseln nur beide Vorzeichen.
        - label: Gar keine – der Punkt ist wieder am Start
          feedback: Dafür müsstest du zweimal an derselben Achse spiegeln.
    hints:
      - Was wird aus (x | y) nach beiden Schritten?
    explanation: Aus (x | y) wird (−x | −y). Abbildungen lassen sich **verketten** – wie Funktionen.
    difficulty: 3

srs:
  cards_from: [x-achse, regel]
