id: geo.symmetry.mirror
type: concept
title: Reflecting
summary: Equally far from the axis.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bild
    widget: pixels
    prompt: Complete the picture as a mirror image across the red axis.
    params:
      mirror: vertical
      cells: ["..#...", ".##...", "###...", "..#...", ".#....", "#....."]
      locked: ["xxx...", "xxx...", "xxx...", "xxx...", "xxx...", "xxx..."]
    answer: { pattern: ["..##..", ".####.", "######", "..##..", ".#..#.", "#....#"] }
    hints:
      - Every cell on the left has a partner, equally far from the axis.
      - Start with the bottom row.
    explanation: Each row on the right is the row on the left read backward.

  - kind: explain
    id: s2
    body: With **line symmetry**, every point is as far from the axis as its mirror point, just on the other side.

  - kind: problem
    id: quadrat-achsen
    widget: choice
    prompt: How many lines of symmetry does a square have?
    params:
      layout: grid
      options:
        - { label: "4", correct: true }
        - { label: "2", feedback: "The diagonals are axes too." }
        - { label: "1", feedback: "There are more: horizontal, vertical and diagonal." }
        - { label: "8", feedback: "Too many. Count vertical, horizontal and the two diagonals." }
    hints:
      - Think of the diagonals.
    explanation: Vertical, horizontal and two diagonals make four axes.

  - kind: problem
    id: unten
    widget: pixels
    prompt: Now the axis is horizontal. Complete the lower half.
    params:
      mirror: horizontal
      cells: ["##....", ".#.#..", "..###.", "......", "......", "......"]
      locked: ["xxxxxx", "xxxxxx", "xxxxxx", "......", "......", "......"]
    answer: { pattern: ["##....", ".#.#..", "..###.", "..###.", ".#.#..", "##...."] }
    hints:
      - The row directly below the axis is a copy of the row directly above it.
    explanation: The rows appear in reverse order.

  - kind: problem
    id: buchstaben
    widget: buckets
    prompt: Which capital letters have a vertical line of symmetry?
    params:
      buckets: [{ label: vertical axis }, { label: none }]
      items:
        - { label: A, bucket: vertical axis }
        - { label: M, bucket: vertical axis }
        - { label: T, bucket: vertical axis }
        - { label: B, bucket: none }
        - { label: E, bucket: none }
        - { label: R, bucket: none }
    hints:
      - Imagine a mirror running through the middle of the letter, top to bottom.
    explanation: A, M and T are the same on the left and right. B and E are the same on top and bottom, which is a horizontal axis.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A circle has infinitely many lines of symmetry.
          right: true
        - text: A rectangle has four lines of symmetry.
          right: false
          why: Only two – the diagonals do not map a rectangle onto itself.
        - text: A point and its mirror image are equally far from the axis.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many lines of symmetry does a regular hexagon have?
    answer:
      value: 6
    hints:
      - Three pass through opposite corners. And through the midpoints of the sides?
    explanation: 3 through corners and 3 through side midpoints. A regular n-gon always has n axes.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You mirror a shape in one axis and then in a parallel axis. What is the overall result?
    params:
      options:
        - label: A translation
          correct: true
        - label: A reflection
          feedback: Two reflections undo the flipping.
        - label: A rotation
          feedback: That happens when the axes intersect.
    hints:
      - Is the shape still flipped at the end?
    explanation: The shape moves by twice the distance between the axes. If the axes intersect, you get a rotation.
    difficulty: 3

srs:
  cards_from: [quadrat-achsen, buchstaben]
