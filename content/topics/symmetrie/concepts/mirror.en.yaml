id: geo.symmetry.mirror
type: concept
title: Reflecting
summary: Equally far from the axis.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bild
    widget: pixels
    prompt: Complete the picture as a mirror image across the red axis.
    params:
      mirror: vertical
      cells: ["..#...", ".##...", "###...", "..#...", ".#....", "#....."]
      locked: ["xxx...", "xxx...", "xxx...", "xxx...", "xxx...", "xxx..."]
    answer: { pattern: ["..##..", ".####.", "######", "..##..", ".#..#.", "#....#"] }
    hints:
      - Every cell on the left has a partner, equally far from the axis.
      - Start with the bottom row.
    explanation: Each row on the right is the row on the left read backward.

  - kind: explain
    body: With **line symmetry**, every point is as far from the axis as its mirror point, just on the other side.

  - kind: problem
    id: quadrat-achsen
    widget: choice
    prompt: How many lines of symmetry does a square have?
    params:
      layout: grid
      options:
        - { label: "4", correct: true }
        - { label: "2", feedback: "The diagonals are axes too." }
        - { label: "1", feedback: "There are more: horizontal, vertical and diagonal." }
        - { label: "8", feedback: "Too many. Count vertical, horizontal and the two diagonals." }
    hints:
      - Think of the diagonals.
    explanation: Vertical, horizontal and two diagonals make four axes.

  - kind: problem
    id: unten
    widget: pixels
    prompt: Now the axis is horizontal. Complete the lower half.
    params:
      mirror: horizontal
      cells: ["##....", ".#.#..", "..###.", "......", "......", "......"]
      locked: ["xxxxxx", "xxxxxx", "xxxxxx", "......", "......", "......"]
    answer: { pattern: ["##....", ".#.#..", "..###.", "..###.", ".#.#..", "##...."] }
    hints:
      - The row directly below the axis is a copy of the row directly above it.
    explanation: The rows appear in reverse order.

  - kind: problem
    id: buchstaben
    widget: buckets
    prompt: Which capital letters have a vertical line of symmetry?
    params:
      buckets: [{ label: vertical axis }, { label: none }]
      items:
        - { label: A, bucket: vertical axis }
        - { label: M, bucket: vertical axis }
        - { label: T, bucket: vertical axis }
        - { label: B, bucket: none }
        - { label: E, bucket: none }
        - { label: R, bucket: none }
    hints:
      - Imagine a mirror running through the middle of the letter, top to bottom.
    explanation: A, M and T are the same on the left and right. B and E are the same on top and bottom, which is a horizontal axis.

srs:
  cards_from: [quadrat-achsen, buchstaben]
