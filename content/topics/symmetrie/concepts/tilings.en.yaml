id: geo.symmetry.tilings
type: concept
title: Tilings
summary: Which tiles fit without gaps.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Without a single gap
    body: "Tiles, paving, honeycombs: good patterns have no gaps. This triangle is covered with small triangles **without gaps**. Tap pieces to colour a pattern. Then split it more finely – there is still no gap."
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 4
        shape: triangle
        shaded:
          - 0
        partOptions:
          - 4
          - 9
          - 16

  - kind: problem
    id: fliesen
    widget: buckets
    prompt: Which regular shapes can tile a floor on their own, without gaps?
    params:
      buckets: [{ label: fits without gaps }, { label: leaves gaps }]
      items:
        - { label: Triangle, bucket: fits without gaps }
        - { label: Square, bucket: fits without gaps }
        - { label: Hexagon, bucket: fits without gaps }
        - { label: Pentagon, bucket: leaves gaps }
        - { label: Octagon, bucket: leaves gaps }
    hints:
      - At every corner, the angles must add up to exactly 360°.
    explanation: Only 60°, 90° and 120° divide 360° evenly. That means triangle, square and hexagon.

  - kind: explain
    id: s2
    body: |
      At every corner of a **tiling**, angles meet that must add up to **360°**.
      The pentagon has 108°, and 360 divided by 108 doesn't come out even.

  - kind: problem
    id: ecke
    widget: numeric
    prompt: How many regular hexagons (120° each) meet at one corner?
    params: { unit: hexagons }
    answer: { value: 3 }
    hints:
      - 360 divided by 120.
    explanation: 3 · 120° = 360°. Bees use exactly this pattern.

  - kind: explain
    id: s4
    body: Why do bees build hexagons instead of squares?
    reveal:
      body: For the same amount of wax, hexagons enclose the largest area. Bees save building material this way.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Equilateral triangles tile without gaps.
          right: true
        - text: So do regular pentagons.
          right: false
          why: 108° does not fit a whole number of times into 360°.
        - text: At every corner the angles must add up to 360°.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How large is an interior angle of a regular octagon?
    params:
      unit: °
    answer:
      value: 135
    hints:
      - The angle sum of an n-gon is (n − 2) · 180°.
    explanation: 6 · 180° = 1080°, divided by 8 is 135°.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "The angles of an n-gon add up to $(n - 2) \\cdot 180°$. So each **interior angle** of a regular n-gon is $(n - 2) \\cdot 180° : n$."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: How big is an interior angle of a regular {{n}}-gon?
    params:
      unit: °
    answer:
      value: "{{(n - 2) * 180 / n}}"
    feedback:
      - when: numval(state.input) == (n - 2) * 180
        misconception: sum-not-single
        text: That is the sum of all angles. Divide by {{n}}.
    hints:
      - "First the angle sum: ({{n}} − 2) · 180°."
      - "{{(n - 2) * 180}}° : {{n}} = ?"
    explanation: ({{n}} − 2) · 180° = {{(n - 2) * 180}}°, divided by {{n}} gives {{(n - 2) * 180 / n}}°.
    difficulty: 2
    variants:
      params:
        n: choice[5,6,8,9,10,12]
      defaults:
        n: 10

  - kind: problem
    id: ma-d3
    depth: 2
    widget: angle
    prompt: Set the interior angle of a regular hexagon.
    params:
      initial: 30
      snap: 5
      max: 180
    answer:
      value: 120
    hints:
      - Three hexagons fill a corner.
      - "360° : 3 = ?"
    explanation: "(6 − 2) · 180° : 6 = 120°. Three of them make exactly 360°."
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: choice
    prompt: Why do only the triangle, square and hexagon tile on their own among regular polygons?
    params:
      options:
        - label: At least 3 meet at each corner. So the angle is at most 120° – and it must divide 360° evenly.
          correct: true
        - label: The triangle has 3 corners.
          feedback: Das Dreieck hat 3 Ecken.
        - label: Size does not matter, only the angle.
          feedback: Die Größe spielt keine Rolle, nur der Winkel.
    hints:
      - Which angles are possible?
      - 60°, 90° and 120° divide 360°. 108° does not.
    explanation: From 7 corners on the angle exceeds 120° – three no longer fit at a corner. Among the rest, only 60°, 90° and 120° divide 360° evenly.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Octagons alone do not tile. Which shape fills the gaps where two octagons meet at a corner?
    params:
      options:
        - label: A square (90°)
          correct: true
        - label: An equilateral triangle (60°)
          feedback: 135 + 135 + 60 = 330 – 30° are missing.
        - label: A hexagon (120°)
          feedback: 135 + 135 + 120 = 390 – that is too much.
    hints:
      - How much is missing from 135° + 135° to 360°?
    explanation: 360 − 270 = 90. Such mixtures are called **semi-regular tilings** – there are exactly eight.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: At one corner a hexagon, two squares and one more regular polygon meet. What is its interior angle?
    params:
      unit: °
    answer:
      value: 60
    hints:
      - Together they must make 360°.
      - 360° − 120° − 90° − 90° = ?
    explanation: 60° – an equilateral triangle. Tilings made of several shapes like this are called semi-regular.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Some tilings never repeat. They are called **aperiodic**. Famous ones are the Penrose tilings made of two rhombs. In 2023 a single tile, »the hat«, was found that only tiles this way.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why regular pentagons cannot tile without gaps.
    params:
      keywords:
        - - "108"
        - - "360"
        - - lücke
          - rest
          - geht nicht
          - teilbar
          - gap
          - left over
          - divide
          - does not
      sample: A pentagon has interior angles of 108 degrees. At a corner the angles must add up to 360. Three pentagons give 324, four already 432. 360 does not divide by 108, so a gap is left over.
    explanation: "Key idea: the interior angle must divide 360° evenly."
    difficulty: 3

srs:
  cards_from: [fliesen, ecke]
