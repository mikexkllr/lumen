id: geo.symmetry.mirror
type: concept
title: Spiegeln
summary: Gleich weit von der Achse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bild
    widget: pixels
    prompt: Vervollständige das Bild spiegelbildlich zur roten Achse.
    params:
      mirror: vertical
      cells: ["..#...", ".##...", "###...", "..#...", ".#....", "#....."]
      locked: ["xxx...", "xxx...", "xxx...", "xxx...", "xxx...", "xxx..."]
    answer: { pattern: ["..##..", ".####.", "######", "..##..", ".#..#.", "#....#"] }
    hints:
      - Jedes Feld links hat einen Partner – gleich weit von der Achse entfernt.
      - Fang mit der untersten Reihe an.
    explanation: Jede Reihe rechts ist die Reihe links rückwärts gelesen.

  - kind: explain
    body: Bei **Achsensymmetrie** liegt jeder Punkt gleich weit von der Achse entfernt wie sein Spiegelpunkt – nur auf der anderen Seite.

  - kind: problem
    id: quadrat-achsen
    widget: choice
    prompt: Wie viele Symmetrieachsen hat ein Quadrat?
    params:
      layout: grid
      options:
        - { label: "4", correct: true }
        - { label: "2", feedback: "Die Diagonalen sind auch Achsen." }
        - { label: "1", feedback: "Es gibt mehr – waagerecht, senkrecht und diagonal." }
        - { label: "8", feedback: "Zu viele. Zähl senkrecht, waagerecht und die zwei Diagonalen." }
    hints:
      - Denk an die Diagonalen.
    explanation: Senkrecht, waagerecht und zwei Diagonalen – vier Achsen.

  - kind: problem
    id: unten
    widget: pixels
    prompt: Jetzt liegt die Achse waagerecht. Ergänze die untere Hälfte.
    params:
      mirror: horizontal
      cells: ["##....", ".#.#..", "..###.", "......", "......", "......"]
      locked: ["xxxxxx", "xxxxxx", "xxxxxx", "......", "......", "......"]
    answer: { pattern: ["##....", ".#.#..", "..###.", "..###.", ".#.#..", "##...."] }
    hints:
      - Die Reihe direkt unter der Achse ist eine Kopie der Reihe direkt darüber.
    explanation: Die Reihen erscheinen in umgekehrter Reihenfolge.

  - kind: problem
    id: buchstaben
    widget: buckets
    prompt: Welche Großbuchstaben haben eine senkrechte Symmetrieachse?
    params:
      buckets: [{ label: senkrechte Achse }, { label: keine }]
      items:
        - { label: A, bucket: senkrechte Achse }
        - { label: M, bucket: senkrechte Achse }
        - { label: T, bucket: senkrechte Achse }
        - { label: B, bucket: keine }
        - { label: E, bucket: keine }
        - { label: R, bucket: keine }
    hints:
      - Stell dir einen Spiegel mitten durch den Buchstaben vor – von oben nach unten.
    explanation: A, M und T sind links und rechts gleich. B und E sind oben und unten gleich – das ist eine waagerechte Achse.

srs:
  cards_from: [quadrat-achsen, buchstaben]
