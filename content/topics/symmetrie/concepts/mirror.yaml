id: geo.symmetry.mirror
type: concept
title: Spiegeln
summary: Gleich weit von der Achse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bild
    widget: pixels
    prompt: Vervollständige das Bild spiegelbildlich zur roten Achse.
    params:
      mirror: vertical
      cells: ["..#...", ".##...", "###...", "..#...", ".#....", "#....."]
      locked: ["xxx...", "xxx...", "xxx...", "xxx...", "xxx...", "xxx..."]
    answer: { pattern: ["..##..", ".####.", "######", "..##..", ".#..#.", "#....#"] }
    hints:
      - Jedes Feld links hat einen Partner – gleich weit von der Achse entfernt.
      - Fang mit der untersten Reihe an.
    explanation: Jede Reihe rechts ist die Reihe links rückwärts gelesen.

  - kind: explain
    id: s2
    body: Bei **Achsensymmetrie** liegt jeder Punkt gleich weit von der Achse entfernt wie sein Spiegelpunkt – nur auf der anderen Seite.

  - kind: problem
    id: quadrat-achsen
    widget: choice
    prompt: Wie viele Symmetrieachsen hat ein Quadrat?
    params:
      layout: grid
      options:
        - { label: "4", correct: true }
        - { label: "2", feedback: "Die Diagonalen sind auch Achsen." }
        - { label: "1", feedback: "Es gibt mehr – waagerecht, senkrecht und diagonal." }
        - { label: "8", feedback: "Zu viele. Zähl senkrecht, waagerecht und die zwei Diagonalen." }
    hints:
      - Denk an die Diagonalen.
    explanation: Senkrecht, waagerecht und zwei Diagonalen – vier Achsen.

  - kind: problem
    id: unten
    widget: pixels
    prompt: Jetzt liegt die Achse waagerecht. Ergänze die untere Hälfte.
    params:
      mirror: horizontal
      cells: ["##....", ".#.#..", "..###.", "......", "......", "......"]
      locked: ["xxxxxx", "xxxxxx", "xxxxxx", "......", "......", "......"]
    answer: { pattern: ["##....", ".#.#..", "..###.", "..###.", ".#.#..", "##...."] }
    hints:
      - Die Reihe direkt unter der Achse ist eine Kopie der Reihe direkt darüber.
    explanation: Die Reihen erscheinen in umgekehrter Reihenfolge.

  - kind: problem
    id: buchstaben
    widget: buckets
    prompt: Welche Großbuchstaben haben eine senkrechte Symmetrieachse?
    params:
      buckets: [{ label: senkrechte Achse }, { label: keine }]
      items:
        - { label: A, bucket: senkrechte Achse }
        - { label: M, bucket: senkrechte Achse }
        - { label: T, bucket: senkrechte Achse }
        - { label: B, bucket: keine }
        - { label: E, bucket: keine }
        - { label: R, bucket: keine }
    hints:
      - Stell dir einen Spiegel mitten durch den Buchstaben vor – von oben nach unten.
    explanation: A, M und T sind links und rechts gleich. B und E sind oben und unten gleich – das ist eine waagerechte Achse.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Kreis hat unendlich viele Symmetrieachsen.
          right: true
        - text: Ein Rechteck hat vier Symmetrieachsen.
          right: false
          why: Nur zwei – die Diagonalen spiegeln ein Rechteck nicht auf sich.
        - text: Punkt und Spiegelpunkt sind gleich weit von der Achse entfernt.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Symmetrieachsen hat ein regelmäßiges Sechseck?
    answer:
      value: 6
    hints:
      - Drei gehen durch gegenüberliegende Ecken. Und durch die Seitenmitten?
    explanation: 3 durch Ecken und 3 durch Seitenmitten. Ein regelmäßiges n-Eck hat immer n Achsen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du spiegelst eine Figur erst an einer Achse und dann an einer dazu parallelen Achse. Was ist das Ergebnis insgesamt?
    params:
      options:
        - label: Eine Verschiebung
          correct: true
        - label: Eine Spiegelung
          feedback: Zwei Spiegelungen heben das Umklappen wieder auf.
        - label: Eine Drehung
          feedback: Das passiert, wenn sich die Achsen schneiden.
    hints:
      - Ist die Figur am Ende noch »umgeklappt«?
    explanation: Die Figur wandert um den doppelten Abstand der Achsen. Schneiden sich die Achsen, entsteht eine Drehung.
    difficulty: 3

srs:
  cards_from: [quadrat-achsen, buchstaben]
