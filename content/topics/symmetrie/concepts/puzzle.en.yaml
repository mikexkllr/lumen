id: geo.symmetry.puzzle
type: concept
title: Reflected twice
summary: Two axes, four quarters.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vier-viertel
    widget: pixels
    prompt: One quarter is given at the top left. Complete the rest so the picture is symmetric across both red axes.
    params:
      mirror: both
      cells: ["#.....", ".#....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["#....#", ".#..#.", "..##..", "..##..", ".#..#.", "#....#"] }
    hints:
      - First reflect to the right, then reflect everything downward.
    explanation: With two axes, one quarter determines the whole picture.

  - kind: explain
    body: With two mirror axes, one quarter makes the whole picture. Many logos and snowflakes are built this way.

  - kind: problem
    id: rahmen
    widget: pixels
    prompt: One more. Complete the pattern symmetrically across both axes.
    params:
      mirror: both
      cells: ["##....", "#.....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["##..##", "#....#", "..##..", "..##..", "#....#", "##..##"] }
    hints:
      - "Every cell has three partners: right, below and diagonally opposite."
    explanation: Every colored cell appears four times, once in each quarter.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: One quarter has {{n}} colored cells, none on an axis. How many are in the whole picture?
    params: { unit: cells }
    answer: { value: "{{4 * n}}" }
    hints:
      - Every cell shows up once in each quarter.
    explanation: "4 · {{n}} = {{4 * n}}."
    variants:
      params: { n: "int[3,9]" }
      defaults: { n: 5 }

srs:
  cards_from: [wie-viele, vier-viertel]
