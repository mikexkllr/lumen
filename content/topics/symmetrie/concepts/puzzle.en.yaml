id: geo.symmetry.puzzle
type: concept
title: Reflected twice
summary: Two axes, four quarters.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vier-viertel
    widget: pixels
    prompt: One quarter is given at the top left. Complete the rest so the picture is symmetric across both red axes.
    params:
      mirror: both
      cells: ["#.....", ".#....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["#....#", ".#..#.", "..##..", "..##..", ".#..#.", "#....#"] }
    hints:
      - First reflect to the right, then reflect everything downward.
    explanation: With two axes, one quarter determines the whole picture.

  - kind: explain
    id: s2
    body: With two **mirror** axes, one quarter makes the whole picture. Many logos and snowflakes are built this way.

  - kind: problem
    id: rahmen
    widget: pixels
    prompt: One more. Complete the pattern symmetrically across both axes.
    params:
      mirror: both
      cells: ["##....", "#.....", "..#...", "......", "......", "......"]
      locked: ["xxx...", "xxx...", "xxx...", "......", "......", "......"]
    answer: { pattern: ["##..##", "#....#", "..##..", "..##..", "#....#", "##..##"] }
    hints:
      - "Every cell has three partners: right, below and diagonally opposite."
    explanation: Every colored cell appears four times, once in each quarter.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: One quarter has {{n}} colored cells, none on an axis. How many are in the whole picture?
    params: { unit: cells }
    answer: { value: "{{4 * n}}" }
    hints:
      - Every cell shows up once in each quarter.
    explanation: "4 · {{n}} = {{4 * n}}."
    variants:
      params: { n: "int[3,9]" }
      defaults: { n: 5 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A picture has two mirror axes. One quarter holds 5 shaded cells, 2 of them exactly on an axis. How many shaded cells does the whole picture have?
    answer:
      value: 16
    hints:
      - Cells on an axis are only doubled, the others quadrupled.
    explanation: 3 · 4 + 2 · 2 = 16. What lies on the axis is its own mirror image.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A snowflake has six mirror axes. How large is the smallest piece from which the whole flake follows by mirroring?
    params:
      options:
        - label: One twelfth
          correct: true
        - label: One sixth
          feedback: Each sixth still has an axis down its middle.
        - label: One third
          feedback: Six axes cut the circle into much finer pieces.
    hints:
      - Six axes are twelve half-lines from the centre.
    explanation: Six axes cut 12 wedges of 30°. This piece is called the **fundamental domain**.
    difficulty: 3

srs:
  cards_from: [wie-viele, vier-viertel]
