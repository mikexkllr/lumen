id: geo.symmetry.moves
type: concept
title: Translating and reflecting on the grid
summary: Transformations as rules for calculating.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: verschieben
    widget: graph
    prompt: Translate P by 3 to the right and 2 up. Drag P′ to the right spot.
    params:
      x: [-4, 4]
      y: [-3, 3]
      points:
        - { id: P, x: -2, y: -1, draggable: false }
        - { id: Q, x: 0, y: 0, label: "P′" }
    answer: { points: { Q: { x: 1, y: 1 } } }
    hints:
      - Start at P and count the grid squares.
    explanation: (−2 | −1) becomes (−2 + 3 | −1 + 2) = (1 | 1).

  - kind: explain
    id: s2
    body: |
      A **translation** adds the same amount to every point.
      (x | y) becomes (x + a | y + b).

  - kind: problem
    id: spiegeln-y
    widget: graph
    prompt: Reflect P across the y-axis. Drag P′ to the right spot.
    params:
      x: [-4, 4]
      y: [-3, 3]
      points:
        - { id: P, x: 3, y: 2, draggable: false }
        - { id: Q, x: 0, y: -2, label: "P′" }
    answer: { points: { Q: { x: -3, y: 2 } } }
    feedback:
      - when: "state.points.Q.x == 3 && state.points.Q.y == -2"
        misconception: wrong-axis
        text: That is the reflection across the x-axis. The y-axis is the vertical one.
    hints:
      - The y-axis is vertical. The point jumps to the left.
    explanation: x changes sign, y stays. (3 | 2) becomes (−3 | 2).

  - kind: problem
    id: x-achse
    widget: numeric
    prompt: The point ({{a}} | {{b}}) is reflected across the x-axis. What is the y-coordinate of the image?
    params: { placeholder: "y" }
    answer: { value: "{{-b}}" }
    feedback:
      - when: "numval(state.input) == b"
        misconception: no-change
        text: When you reflect across the x-axis, the y-coordinate is the one that changes.
    hints:
      - The x-axis is horizontal. The point jumps up or down.
    explanation: "({{a}} | {{b}}) becomes ({{a}} | {{-b}})."
    variants:
      params: { a: "nonzero[-5,5]", b: "nonzero[-5,5]" }
      defaults: { a: 4, b: -1 }

  - kind: problem
    id: regel
    widget: choice
    prompt: What does a reflection across the y-axis change?
    params:
      options:
        - { label: The sign of x, correct: true }
        - { label: The sign of y, feedback: "That is what the reflection across the x-axis does." }
        - { label: Both signs, feedback: "That would be a half turn about the origin." }
    hints:
      - Think of P(3 | 2) from before.
    explanation: Left and right swap. Only x changes sign.

  - kind: problem
    id: c1
    widget: match
    prompt: Which rule belongs to which transformation?
    params:
      pairs:
        - left: (x, y) → (x + 3, y)
          right: Shift to the right
        - left: (x, y) → (−x, y)
          right: Reflection in the y-axis
        - left: (x, y) → (x, −y)
          right: Reflection in the x-axis
        - left: (x, y) → (−x, −y)
          right: Rotation by 180°
    hints:
      - Plug in the point (2, 1) and see where it lands.
    explanation: Every transformation is a rule for the coordinates.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The point (4, 1) is rotated 90° anticlockwise about the origin. What is the x-coordinate of the image?
    answer:
      value: -1
    hints:
      - The rule is (x, y) → (−y, x).
    explanation: (4, 1) becomes (−1, 4). The coordinates swap and one changes sign.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: graph
    prompt: Rotate P by 90° counterclockwise about the origin. Drag P′ to the right place.
    params:
      x:
        - -4
        - 4
      y:
        - -4
        - 4
      points:
        - id: P
          x: 3
          y: 1
          draggable: false
        - id: Q
          x: 0
          y: -2
          label: P′
    answer:
      points:
        Q:
          x: -1
          y: 3
    hints:
      - Imagine a hand from the origin to P. Turn it to the left.
      - "The rule: (x | y) becomes (−y | x)."
    explanation: (3 | 1) becomes (−1 | 3). The distance from the origin stays the same.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: Translations, reflections and rotations are called **isometries**. Lengths and angles stay the same. The figure only changes position, not shape.

  - kind: problem
    id: ma-d3
    depth: 2
    widget: graph
    prompt: "Now we stretch: drag P′ twice as far from the origin as P, in the same direction."
    params:
      x:
        - -1
        - 5
      y:
        - -1
        - 5
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
          label: O
        - id: P
          x: 1
          y: 2
          draggable: false
        - id: Q
          x: 4
          y: 0
          label: P′
    answer:
      points:
        Q:
          x: 2
          y: 4
    hints:
      - Both coordinates are doubled.
      - (1 | 2) times 2.
    explanation: (1 | 2) becomes (2 | 4). That is a dilation with factor 2. Lengths double – it is not an isometry.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: choice
    prompt: Which map changes the size of a figure?
    params:
      options:
        - label: Everything just moves along.
          feedback: Alles rückt nur weiter.
        - label: The mirror image is the same size.
          feedback: Das Spiegelbild ist gleich groß.
        - label: Turning keeps lengths.
          feedback: Beim Drehen bleiben Längen gleich.
        - label: Dilation
          correct: true
    hints:
      - Which map multiplies?
      - The other three are isometries.
    explanation: Only the dilation multiplies all distances by a factor.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You reflect in the x-axis, then in the y-axis. Which single transformation does the same?
    params:
      options:
        - label: Rotation by 180° about the origin
          correct: true
        - label: Reflection in the line y = x
          feedback: That swaps x and y. Here only both signs change.
        - label: None – the point is back at the start
          feedback: For that you would need to reflect in the same axis twice.
    hints:
      - What does (x, y) become after both steps?
    explanation: (x, y) becomes (−x, −y). Transformations can be **composed** – like functions.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: The 90° rotation turns (x | y) into (−y | x). Apply it twice to (2 | 5). What is the y-coordinate of the result?
    answer:
      value: -5
    feedback:
      - when: numval(state.input) == 2
        misconception: one-step
        text: "That is after one turn: (−5 | 2). Once more!"
    hints:
      - "After one turn: (−5 | 2)."
      - "Once more: (−2 | −5)."
    explanation: "Two 90° turns make 180°: (2 | 5) becomes (−2 | −5). Both signs flip."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: First reflect in the y-axis, then shift 2 to the right. Is that the same as shifting first, then reflecting?
    params:
      options:
        - label: Try the point (0 | 0) both ways.
          feedback: Probiere den Punkt (0 | 0) beide Wege.
        - label: No – (0 | 0) ends up at (2 | 0) one way, at (−2 | 0) the other
          correct: true
    hints:
      - Try it with the origin.
      - "Shift, then reflect: (0 | 0) → (2 | 0) → (−2 | 0)."
    explanation: "With maps, the order matters. Mathematicians say: they are not commutative."
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: Each of these maps can be written as a **matrix**. Two maps in a row then means multiplying matrices. That is how video games compute every rotation.

srs:
  cards_from: [x-achse, regel]
