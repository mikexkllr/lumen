id: sci.motion.curves
type: concept
title: Kurven und Kreise
summary: Warum zu schnell in der Kurve gefährlich ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Wer im Kreis fährt, braucht eine Kraft zur **Mitte**. Ohne sie fährt man geradeaus weiter. Beim Auto liefern sie die Reifen.

  - kind: problem
    id: wer
    widget: match
    prompt: Welche Kraft hält es auf der Kreisbahn?
    params:
      pairs:
        - { left: Auto in der Kurve, right: Reibung der Reifen }
        - { left: Mond um die Erde, right: Schwerkraft }
        - { left: Kettenkarussell, right: Zug der Ketten }
    hints:
      - Was zieht oder drückt jeweils zur Mitte?
    explanation: Immer zieht etwas nach innen – sonst ginge es geradeaus weiter.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: Die nötige Kraft wächst mit dem Quadrat des Tempos. Du fährst {{k}}-mal so schnell in die Kurve. Wievielmal mehr Kraft brauchst du?
    params: { unit: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Das Tempo zählt im Quadrat.
    hints:
      - "{{k}} · {{k}}."
    explanation: "{{k}}² = {{k * k}}. Darum sind schon kleine Tempoüberschreitungen in Kurven gefährlich."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: radius
    widget: choice
    prompt: Gleiches Tempo, aber eine Kurve mit doppelt so großem Radius. Wie viel Kraft brauchst du?
    params:
      options:
        - { label: Halb so viel, correct: true }
        - { label: Doppelt so viel, feedback: "Eine weite Kurve ist sanfter, nicht schärfer." }
        - { label: Gleich viel, feedback: "Der Radius spielt eine Rolle." }
    hints:
      - Ist eine weite Kurve leichter oder schwerer zu fahren?
    explanation: Die Kraft ist umgekehrt proportional zum Radius. Darum haben Autobahnen weite Kurven.

srs:
  cards_from: [quadrat, radius]
