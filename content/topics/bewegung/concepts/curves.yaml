id: sci.motion.curves
type: concept
title: Kurven und Kreise
summary: Warum zu schnell in der Kurve gefährlich ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du schleuderst einen Ball an einer Schnur im Kreis und lässt los. Wohin fliegt er?
    params:
      options:
        - label: Geradeaus weiter
          correct: true
        - label: Weiter im Kreis
          feedback: Ohne Schnur hält ihn nichts auf der Kreisbahn.
        - label: Direkt vom Mittelpunkt weg
          feedback: Er fliegt in die Richtung, in die er gerade unterwegs war.
    hints:
      - Was hat ihn bisher auf der Kreisbahn gehalten?
    explanation: Ohne Kraft zur Mitte geht es geradeaus weiter.

  - kind: explain
    id: s1
    body: |
      Wer im Kreis fährt, braucht eine Kraft zur **Mitte**. Ohne sie fährt man geradeaus weiter. Beim Auto liefern sie die Reifen.

  - kind: problem
    id: wer
    widget: match
    prompt: Welche Kraft hält es auf der Kreisbahn?
    params:
      pairs:
        - { left: Auto in der Kurve, right: Reibung der Reifen }
        - { left: Mond um die Erde, right: Schwerkraft }
        - { left: Kettenkarussell, right: Zug der Ketten }
    hints:
      - Was zieht oder drückt jeweils zur Mitte?
    explanation: Immer zieht etwas nach innen – sonst ginge es geradeaus weiter.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: Die nötige Kraft wächst mit dem Quadrat des Tempos. Du fährst {{k}}-mal so schnell in die Kurve. Wievielmal mehr Kraft brauchst du?
    params: { unit: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Das Tempo zählt im Quadrat.
    hints:
      - "{{k}} · {{k}}."
    explanation: "{{k}}² = {{k * k}}. Darum sind schon kleine Tempoüberschreitungen in Kurven gefährlich."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: radius
    widget: choice
    prompt: Gleiches Tempo, aber eine Kurve mit doppelt so großem Radius. Wie viel Kraft brauchst du?
    params:
      options:
        - { label: Halb so viel, correct: true }
        - { label: Doppelt so viel, feedback: "Eine weite Kurve ist sanfter, nicht schärfer." }
        - { label: Gleich viel, feedback: "Der Radius spielt eine Rolle." }
    hints:
      - Ist eine weite Kurve leichter oder schwerer zu fahren?
    explanation: Die Kraft ist umgekehrt proportional zum Radius. Darum haben Autobahnen weite Kurven.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Zentripetalkraft ist $F = \frac{m v^2}{r}$. Ein 1000-kg-Auto fährt mit 20 m/s durch eine Kurve mit 100 m Radius. Wie groß ist die Kraft?
    params:
      unit: N
    answer:
      value: 4000
    hints:
      - "1000 · 400 : 100."
    explanation: 4000 N – so viel müssen die Reifen seitlich halten.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Ein Satellit kreist im Abstand von 4 Erdradien. Finde das Tempo für eine runde Kreisbahn.
    params:
      scene: orbit
      controls:
        radius:
          value: 4
          fixed: true
        speed:
          value: 2
    answer:
      ecc:
        - 0
        - 0.03
    explanation: Etwa 4 km/s. Weiter draußen zieht die Erde schwächer, die Kreisbahn ist langsamer.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Die Reifen halten höchstens 8 m/s² zur Seite. Wie schnell darf ein Auto durch eine Kurve mit 50 m Radius fahren – in m/s?
    params:
      unit: m/s
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 400
        misconception: forgot-root
        text: Das ist v². Zieh noch die Wurzel.
    hints:
      - "Es gilt a = v² : r. Stell nach v um."
      - v = √(a · r) = √(8 · 50).
    explanation: √400 = 20 m/s, also 72 km/h. Auf nasser Straße halten die Reifen weniger – dann ist schon bei viel kleinerem Tempo Schluss.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: In einer schnellen Kurve fühlst du dich nach außen gedrückt. Was passiert wirklich?
    params:
      options:
        - label: Dein Körper will geradeaus weiter – Sitz und Tür drücken dich nach innen.
          correct: true
        - label: Eine Kraft zieht dich nach außen.
          feedback: Von außen zieht nichts. Nur im mitfahrenden Blick scheint es so.
        - label: Die Kurve stößt dich ab.
          feedback: Die Straße drückt die Reifen nach innen, nicht dich nach außen.
    hints:
      - Was macht ein Körper ohne Kraft?
      - Was würde passieren, wenn die Tür plötzlich weg wäre?
    explanation: Die »Fliehkraft« ist eine Scheinkraft im mitdrehenden Blick. Von außen gesehen gibt es nur die Kraft zur Mitte. Ohne sie fliegst du geradeaus.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum schweben Astronauten in der Raumstation?
    params:
      options:
        - label: Sie fallen ständig um die Erde herum – zusammen mit der Station
          correct: true
        - label: Weil dort keine Schwerkraft wirkt
          feedback: In 400 km Höhe ist sie noch 90 % so stark wie am Boden.
        - label: Weil die Fliehkraft sie nach außen drückt
          feedback: Es gibt nur die Schwerkraft – sie liefert genau die nötige Zentripetalkraft.
    hints:
      - Was spürst du in einem frei fallenden Aufzug?
    explanation: Freier Fall fühlt sich schwerelos an. Die Station ist so schnell, dass sie die Erde ständig »verfehlt«.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum braucht ein Auto in der Kurve eine Kraft zur Mitte?"
    params:
      keywords:
        - - gerade
          - geradeaus
          - straight
        - - richtung
          - direction
          - ablenk
          - turn
          - change
        - - reifen
          - reibung
          - tyre
          - tire
          - friction
          - kraft
          - force
      sample: Ohne Kraft würde das Auto geradeaus weiterfahren. Um die Richtung zu ändern, muss eine Kraft zur Kurvenmitte wirken – die Reibung der Reifen.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "In der Zeit Δt dreht sich der Geschwindigkeitspfeil um den Winkel v · Δt : r. Er ändert sich also um v · v · Δt : r. Pro Zeit ergibt das die **Zentripetalbeschleunigung** a = v² : r."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Ein Looping hat 10 m Radius. Wie schnell muss der Wagen ganz oben mindestens sein, damit er nicht herunterfällt? g = 10 m/s². In m/s.
    params:
      unit: m/s
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 0
        misconception: zero-top-speed
        text: Mit Tempo null würde er einfach herunterfallen. Oben muss die Schwerkraft gerade als Kraft zur Mitte reichen.
    hints:
      - Oben zeigt die Mitte nach unten. Die Schwerkraft liefert die nötige Kraft.
      - "g = v² : r, also v = √(g · r)."
    explanation: v = √(10 · 10) = 10 m/s. Langsamer, und die Schwerkraft ist größer als nötig – der Wagen fällt aus der Bahn.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Wie schnell trägt dich die Erddrehung in Deutschland (50° Nord) durch den Raum – in km/h?"
    params:
      min: 0
      max: 3000
    answer:
      value: 1070
      tolerance: 200
    explanation: "Der Breitenkreis ist 40 000 km · cos 50° ≈ 25 700 km lang. Pro Tag einmal herum: rund 1070 km/h. Du merkst nichts, weil sich das Tempo nicht ändert."
    difficulty: 3

srs:
  cards_from: [quadrat, radius]
