id: sci.motion.curves
type: concept
title: Kurven und Kreise
summary: Warum zu schnell in der Kurve gefährlich ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du schleuderst einen Ball an einer Schnur im Kreis und lässt los. Wohin fliegt er?
    params:
      options:
        - label: Geradeaus weiter
          correct: true
        - label: Weiter im Kreis
          feedback: Ohne Schnur hält ihn nichts auf der Kreisbahn.
        - label: Direkt vom Mittelpunkt weg
          feedback: Er fliegt in die Richtung, in die er gerade unterwegs war.
    hints:
      - Was hat ihn bisher auf der Kreisbahn gehalten?
    explanation: Ohne Kraft zur Mitte geht es geradeaus weiter.


  - kind: explain
    id: s1
    body: |
      Wer im Kreis fährt, braucht eine Kraft zur **Mitte**. Ohne sie fährt man geradeaus weiter. Beim Auto liefern sie die Reifen.

  - kind: problem
    id: wer
    widget: match
    prompt: Welche Kraft hält es auf der Kreisbahn?
    params:
      pairs:
        - { left: Auto in der Kurve, right: Reibung der Reifen }
        - { left: Mond um die Erde, right: Schwerkraft }
        - { left: Kettenkarussell, right: Zug der Ketten }
    hints:
      - Was zieht oder drückt jeweils zur Mitte?
    explanation: Immer zieht etwas nach innen – sonst ginge es geradeaus weiter.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: Die nötige Kraft wächst mit dem Quadrat des Tempos. Du fährst {{k}}-mal so schnell in die Kurve. Wievielmal mehr Kraft brauchst du?
    params: { unit: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Das Tempo zählt im Quadrat.
    hints:
      - "{{k}} · {{k}}."
    explanation: "{{k}}² = {{k * k}}. Darum sind schon kleine Tempoüberschreitungen in Kurven gefährlich."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: radius
    widget: choice
    prompt: Gleiches Tempo, aber eine Kurve mit doppelt so großem Radius. Wie viel Kraft brauchst du?
    params:
      options:
        - { label: Halb so viel, correct: true }
        - { label: Doppelt so viel, feedback: "Eine weite Kurve ist sanfter, nicht schärfer." }
        - { label: Gleich viel, feedback: "Der Radius spielt eine Rolle." }
    hints:
      - Ist eine weite Kurve leichter oder schwerer zu fahren?
    explanation: Die Kraft ist umgekehrt proportional zum Radius. Darum haben Autobahnen weite Kurven.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Zentripetalkraft ist $F = \frac{m v^2}{r}$. Ein 1000-kg-Auto fährt mit 20 m/s durch eine Kurve mit 100 m Radius. Wie groß ist die Kraft?
    params:
      unit: N
    answer:
      value: 4000
    hints:
      - "1000 · 400 : 100."
    explanation: 4000 N – so viel müssen die Reifen seitlich halten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum schweben Astronauten in der Raumstation?
    params:
      options:
        - label: Sie fallen ständig um die Erde herum – zusammen mit der Station
          correct: true
        - label: Weil dort keine Schwerkraft wirkt
          feedback: In 400 km Höhe ist sie noch 90 % so stark wie am Boden.
        - label: Weil die Fliehkraft sie nach außen drückt
          feedback: Es gibt nur die Schwerkraft – sie liefert genau die nötige Zentripetalkraft.
    hints:
      - Was spürst du in einem frei fallenden Aufzug?
    explanation: Freier Fall fühlt sich schwerelos an. Die Station ist so schnell, dass sie die Erde ständig »verfehlt«.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum braucht ein Auto in der Kurve eine Kraft zur Mitte?"
    params:
      keywords:
        - - gerade
          - geradeaus
          - straight
        - - richtung
          - direction
          - ablenk
          - turn
          - change
        - - reifen
          - reibung
          - tyre
          - tire
          - friction
          - kraft
          - force
      sample: Ohne Kraft würde das Auto geradeaus weiterfahren. Um die Richtung zu ändern, muss eine Kraft zur Kurvenmitte wirken – die Reibung der Reifen.
    difficulty: 3

srs:
  cards_from: [quadrat, radius]
