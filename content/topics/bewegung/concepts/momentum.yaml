id: sci.motion.momentum
type: concept
title: "Impuls und Stöße"
summary: "Warum Schweres schwer zu stoppen ist – und was bei jedem Stoß gleich bleibt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: Ein Tischtennisball und eine Bowlingkugel rollen gleich schnell auf dich zu. Was ist schwerer zu stoppen?
    params:
      options:
        - label: Die Bowlingkugel
          correct: true
        - label: Der Tischtennisball
          feedback: Er hat viel weniger Masse.
        - label: Beide gleich
          feedback: Das Tempo ist gleich, die Masse nicht.
    hints:
      - Welche würdest du lieber mit der Hand fangen?
    explanation: Tempo allein sagt nicht alles. Es kommt auch auf die Masse an.

  - kind: explain
    id: c2
    body: "Der **Impuls** ist Masse mal Geschwindigkeit: p = m · v. Er misst, wie viel Wucht in einer Bewegung steckt. Und er hat eine Richtung."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Läufer mit 60 kg rennt mit 5 m/s. Wie groß ist sein Impuls?
    params:
      unit: kg·m/s
    answer:
      value: 300
    hints:
      - Masse mal Tempo.
    explanation: 60 · 5 = 300 kg·m/s.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Ein Auto mit 1200 kg rollt mit 2 m/s. Wie schnell müsste eine Radfahrerin mit 80 kg fahren, um denselben Impuls zu haben?
    params:
      unit: m/s
    answer:
      value: 30
    hints:
      - "Impuls des Autos: 2400. Teil durch 80."
    explanation: "2400 : 80 = 30 m/s – das sind 108 km/h."

  - kind: explain
    id: c5
    body: Bei jedem Stoß bleibt der **gesamte Impuls gleich**. Was der eine verliert, gewinnt der andere. Das gilt beim Billard, bei Autos und bei Sternen.

  - kind: problem
    id: c6
    widget: numeric
    prompt: Ein Wagen mit 2 kg fährt mit 3 m/s auf einen ruhenden Wagen mit 1 kg. Sie kuppeln zusammen. Wie schnell fahren sie danach?
    params:
      unit: m/s
    answer:
      value: 2
    hints:
      - "Impuls vorher: 2 · 3 = 6. Masse nachher: 3 kg."
    explanation: "6 : 3 = 2 m/s. Der Impuls verteilt sich auf mehr Masse."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Skaterin mit 50 kg steht still und wirft einen Ball mit 5 kg mit 4 m/s nach vorn. Mit welchem Tempo rollt sie rückwärts?
    params:
      unit: m/s
    answer:
      value: 0.4
    hints:
      - Vorher war der Impuls null. Also muss er nachher auch null sein.
    explanation: "5 · 4 = 20 nach vorn, also 20 : 50 = 0,4 m/s nach hinten. Das ist der Rückstoß."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Warum hat ein Auto eine Knautschzone?
    params:
      options:
        - label: Sie verlängert die Zeit des Stoßes – so wird die Kraft kleiner
          correct: true
        - label: Sie macht das Auto leichter
          feedback: Es geht um die Zeit, nicht um das Gewicht.
        - label: Sie verringert den Impuls vor dem Stoß
          feedback: Der hängt nur von Masse und Tempo ab.
    hints:
      - Kraft mal Zeit ist die Impulsänderung.
    explanation: Dieselbe Impulsänderung in zehnmal so langer Zeit braucht nur ein Zehntel der Kraft. Airbags tun dasselbe.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Fuß trifft einen Ball mit 0,4 kg. Nach 0,01 s fliegt der Ball mit 25 m/s. Wie groß war die mittlere Kraft in Newton?
    params:
      unit: N
    answer:
      value: 1000
    hints:
      - "Impulsänderung: 0,4 · 25 = 10. Teil durch die Zeit."
    explanation: "10 : 0,01 = 1000 N – so viel wie das Gewicht von 100 kg, nur sehr kurz."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Zwei gleiche Wagen prallen mit gleichem Tempo frontal zusammen und bleiben kleben. Der Gesamtimpuls war null. Wo ist die Bewegungsenergie hin?
    params:
      options:
        - label: In Verformung und Wärme
          correct: true
        - label: Sie ist verschwunden
          feedback: Energie verschwindet nie.
        - label: Sie steckt noch im Impuls
          feedback: Der Impuls war die ganze Zeit null.
    hints:
      - Schau dir ein Auto nach einem Unfall an.
    explanation: Impuls bleibt bei jedem Stoß erhalten. Bewegungsenergie nur beim perfekt elastischen.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Im leeren Raum gibt es nichts zum Abstoßen. Wie beschleunigt eine Rakete trotzdem?
    params:
      options:
        - label: Sie stößt Gas nach hinten aus und bekommt dafür Impuls nach vorn
          correct: true
        - label: Sie stößt sich am Vakuum ab
          feedback: Im Vakuum ist nichts.
        - label: Gar nicht
          feedback: Raketen beschleunigen im All sehr gut.
    hints:
      - Denk an die Skaterin mit dem Ball.
    explanation: Rückstoß. Je schneller das Gas hinten austritt, desto mehr Schub.
    difficulty: 3

srs:
  cards_from: ["c3", "c6", "d1"]
