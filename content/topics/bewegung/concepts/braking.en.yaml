id: sci.motion.braking
type: concept
title: Braking and accelerating
summary: Double the speed, four times the braking distance.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One second too late
    body: "On the road every second counts. Before your foot hits the brake, your **reaction time** passes – and the car keeps rolling. Flip the cards: what happens in so little time?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚗
            front: 50 km/h
            back: In one second you travel 14 m – three car lengths.
          - icon: 📱
            front: A glance at your phone
            back: Two seconds away – at 100 km/h you drive 55 m blind.
          - icon: ⚽
            front: A ball rolls into the road
            back: A child often runs right after it. If you drive slowly, you stop in time.
          - icon: 🌧️
            front: Wet road
            back: The tyres grip less. The distance until you stop gets longer.

  - kind: problem
    id: doppelt
    widget: choice
    prompt: A car drives twice as fast. How does its braking distance change?
    params:
      options:
        - { label: It becomes about 4 times as long., correct: true }
        - { label: It becomes twice as long., feedback: "That would be nice. But braking distance grows with the square." }
        - { label: It stays the same., feedback: "More speed means more kinetic energy that has to be removed." }
    hints:
      - Kinetic energy grows with the square of the speed.
    explanation: Double the speed means four times the kinetic energy – and about four times the braking distance.

  - kind: explain
    id: s2
    body: |
      **Acceleration** is the change in speed per second.
      Braking distance grows with the **square** of the speed.

  - kind: problem
    id: faustformel
    widget: numeric
    prompt: Rule of thumb – braking distance in meters = (speed in km/h divided by 10)². How long is the braking distance at {{v}} km/h?
    params: { unit: m }
    answer: { value: "{{(v / 10) ** 2}}" }
    feedback:
      - when: "numval(state.input) == v / 10 * 2"
        misconception: times-two
        text: Squared means times itself, not times 2.
    hints:
      - "{{v}} ÷ 10 = {{v / 10}}. Now multiply it by itself."
    explanation: "({{v / 10}})² = {{(v / 10) ** 2}} m."
    variants:
      params: { v: "choice[30,50,80,100,130]" }
      defaults: { v: 50 }

  - kind: problem
    id: anfahren
    widget: numeric
    prompt: A car accelerates from 0 to 100 km/h in {{t}} seconds. By how many km/h does it get faster each second?
    params: { unit: km/h per s }
    answer: { value: "{{100 / t}}" }
    hints:
      - Divide the change by the time.
    explanation: "100 km/h : {{t}} s = {{100 / t}} km/h per second."
    variants:
      params: { t: "choice[4,5,8,10]" }
      defaults: { t: 10 }

  - kind: explain
    id: s5
    body: Why is a 30 km/h limit in front of schools so important?
    reveal:
      body: By the rule of thumb, a car at 30 km/h stops in 9 m. At 50 km/h it needs 25 m. Where the slow car has already stopped, the fast one has barely slowed down.

  - kind: problem
    id: reaktion
    widget: numeric
    prompt: Reaction distance in meters ≈ (speed divided by 10) · 3. How long is it at {{v}} km/h?
    params: { unit: m }
    answer: { value: "{{v / 10 * 3}}" }
    hints:
      - "{{v}} ÷ 10 · 3."
    explanation: "{{v / 10}} · 3 = {{v / 10 * 3}} m – that is how far you travel before you even start braking."
    variants:
      params: { v: "choice[30,50,70,100]" }
      defaults: { v: 50 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: At double the speed the braking distance is four times as long.
          right: true
        - text: At double the speed the reaction distance is four times as long.
          right: false
          why: It only doubles – during the reaction time you keep driving steadily.
        - text: Stopping distance = reaction distance + braking distance.
          right: true

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: "Rule of thumb: braking distance in m = (speed divided by 10)². Set the braking distances for 30, 60 and 90 km/h."
    params:
      labels:
        - 30 km/h
        - 60 km/h
        - 90 km/h
      values:
        - 0
        - 0
        - 0
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 90
      step: 3
      unit: m
    answer:
      values:
        - 9
        - 36
        - 81
    hints:
      - Divide each speed by 10 and multiply the result by itself.
      - "At 30 km/h: 3 · 3 = 9 m. Work out the others the same way."
    explanation: "Three times the speed means nine times the braking distance: 9 m, 36 m and 81 m. The bars grow faster and faster."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How long is the total stopping distance at 100 km/h? Use both rules of thumb.
    params:
      unit: m
    answer:
      value: 130
    hints:
      - Reaction distance 10 · 3, braking distance 10².
    explanation: 30 m + 100 m = 130 m – longer than a football pitch.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Why does **braking distance** grow with the square of speed? At double speed braking takes twice as long. And you are travelling twice as fast on average while doing it. Two times two makes four.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: On a wet road a car brakes only half as hard – the deceleration halves. How many times longer does the braking distance get?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 4
        misconception: square-wrong-variable
        text: "The square belongs to the speed. The deceleration is simply in the denominator: s = v² ÷ (2a)."
    hints:
      - Look at the formula s = v² ÷ (2a).
      - What happens to s when a is halved?
    explanation: s = v² ÷ (2a). Half the deceleration means double the braking distance. On ice it can be ten times as far.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: estimate
    prompt: At 30 km/h a car stops just in front of a child running into the road. At what speed does a car doing 50 km/h reach the same spot? Estimate in km/h.
    params:
      min: 0
      max: 50
    answer:
      value: 47
      tolerance: 5
    explanation: "At 30 km/h: 9 m reaction plus 9 m braking = 18 m. At 50 km/h the reaction distance is 15 m, leaving just 3 m of braking – still almost 47 km/h."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "A car brakes at 8 m/s² from 20 m/s. How long is the braking distance? Formula: $s = \\frac{v^2}{2a}$"
    params:
      unit: m
    answer:
      value: 25
    hints:
      - 400 divided by 16.
    explanation: 25 m. The v² in the formula explains why double the speed quadruples the distance.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A car travels at 30 m/s. The driver reacts after 1 s and then brakes at 8 m/s². How long is the total stopping distance in metres?
    params:
      unit: m
    answer:
      value: 86.25
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 56.25) < 0.5
        misconception: forgot-reaction
        text: That is only the braking distance. During the reaction time the car still travels 30 m at full speed.
    hints:
      - "Reaction distance: 30 m/s · 1 s."
      - "Braking distance: v² ÷ (2a) = 900 ÷ 16."
    explanation: 30 m + 56.25 m = 86.25 m. At 108 km/h that is almost a football pitch.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Why do cars have ABS, which stops the wheels from locking?
    params:
      options:
        - label: A rolling wheel grips better than a sliding one – and you can still steer.
          correct: true
        - label: Locked wheels brake better; ABS just saves the tyres.
          feedback: Sliding means sliding friction, and that is smaller than static friction.
        - label: ABS makes the brakes stronger.
          feedback: The braking force stays. ABS only keeps it just below the grip limit.
    hints:
      - "Which is larger: static or sliding friction?"
      - A sliding wheel cannot steer either.
    explanation: Static friction is larger than sliding friction. ABS briefly releases the brake whenever a wheel starts to slide. It stays at the grip limit and steerable.
    difficulty: 3

srs:
  cards_from: [faustformel, reaktion]
