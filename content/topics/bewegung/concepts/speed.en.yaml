id: sci.motion.speed
type: concept
title: Speed
summary: Distance divided by time.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Race against the clock
    body: "Train or bike: every trip is distance against time. Drag the speed and watch how steep the line gets. Do you reach the goal after 3 hours? That pace is your **speed**."
    visual:
      widget: slider
      interactive: true
      params:
        expr: v*x
        x:
          - 0
          - 5
        y:
          - 0
          - 400
        showCoordinates: false
        sliders:
          - id: v
            label: Speed (km/h)
            min: 20
            max: 160
            step: 10
            initial: 50
        markers:
          - x: 3
            y: 300
            label: Goal

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how fast does the Earth move around the Sun – in km per **second**?"
    params:
      min: 0
      max: 100
      unit: km/s
    answer:
      value: 30
      tolerance: 6
    explanation: About 30 km/s, over 100,000 km/h. We notice nothing because the speed does not change.

  - kind: problem
    id: zug
    widget: numeric
    prompt: A train travels {{d}} km in {{t}} hours. What is its average speed?
    params: { unit: km/h }
    answer: { value: "{{d / t}}" }
    feedback:
      - when: "numval(state.input) == d * t"
        misconception: multiply
        text: Speed is distance divided by time.
    hints:
      - How many kilometers does it cover in one hour?
    explanation: "{{d}} km : {{t}} h = {{d / t}} km/h."
    variants:
      params: { t: "choice[2,3,4]", v: "choice[80,90,120,150]" }
      derive: { d: "t * v" }
      defaults: { t: 2, v: 120 }

  - kind: explain
    id: s2
    body: |
      **Speed = distance : time.** You measure it in km/h or m/s.
      To **convert**, use 3.6 – 1 m/s is 3.6 km/h.

  - kind: problem
    id: sprint
    widget: numeric
    prompt: A sprinter runs 100 m in 10 seconds. How many km/h is that?
    params: { unit: km/h }
    answer: { value: 36 }
    feedback:
      - when: "numval(state.input) == 10"
        misconception: no-conversion
        text: 10 m/s is correct. Now convert to km/h – times 3.6.
    hints:
      - First m/s, then times 3.6.
    explanation: "100 m : 10 s = 10 m/s. Times 3.6 gives 36 km/h."

  - kind: problem
    id: diagramm
    widget: slider
    prompt: A cyclist is 4 meters along after 2 seconds. Set the speed in the distance-time graph.
    params:
      expr: "v*x"
      x: [0, 6]
      y: [0, 6]
      sliders: [{ id: v, label: "v in m/s", min: 0, max: 3, step: 0.5, initial: 0.5 }]
      markers: [{ x: 2, y: 4, label: "2 s, 4 m" }]
      showCoordinates: false
    answer: { values: { v: 2 } }
    hints:
      - Every second, they must cover 2 meters.
    explanation: 4 m in 2 s – that is 2 m/s.

  - kind: explain
    id: s5
    body: |
      In a **distance-time graph**, the slope is the speed.
      Steeper means faster. Flat means nothing is moving.

  - kind: problem
    id: waagerecht
    widget: choice
    prompt: What does a horizontal line in a distance-time graph show?
    params:
      options:
        - { label: Standing still, correct: true }
        - { label: Steady motion, feedback: "In steady motion, the line rises steadily." }
        - { label: Very high speed, feedback: "Then the line would be very steep." }
    hints:
      - Does the distance change as time passes?
    explanation: Time keeps running, but the distance stays the same.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You drive 30 minutes at 60 km/h and then 30 minutes at 100 km/h. What is the average speed?
    params:
      unit: km/h
    answer:
      value: 80
    hints:
      - "Total distance over total time: 30 km + 50 km in 1 hour."
    explanation: 80 km in 1 h. With equal **times** you may simply average.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: You cycle there at 30 km/h and back along the same route at 60 km/h. What is your average speed?
    params:
      options:
        - label: 40 km/h
          correct: true
        - label: 45 km/h
          feedback: That would be right if you had ridden for equal **times**. But you spent longer at the slow speed.
        - label: 50 km/h
          feedback: There is no reason for that. Try a distance of 60 km.
    hints:
      - Suppose the route is 60 km. How long does each direction take?
      - Total distance ÷ total time.
    explanation: "There 2 h, back 1 h: 120 km in 3 h gives 40 km/h. Averaging the speeds only works for equal times."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "A car accelerates steadily from 0 to 20 m/s in 10 s. How many metres does it cover? Tip: the distance is the area under the line in the speed–time graph."
    params:
      unit: m
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 200
        misconception: triangle-area
        text: That would be a rectangle – as if it had gone 20 m/s the whole time. The area is a triangle.
    hints:
      - The line rises from 0 to 20. What shape is the area underneath?
      - "Triangle: ½ · 10 s · 20 m/s."
    explanation: ½ · 10 · 20 = 100 m. The same as 10 s at the average speed of 10 m/s.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: You drive at 120 km/h, a lorry ahead of you at 80 km/h. You are 200 m behind it. After how many seconds are you level?
    params:
      unit: s
    answer:
      value: 18
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 6) < 0.3
        misconception: relative-speed
        text: "Only the **difference** in speed counts: 40 km/h."
    hints:
      - How fast are you catching up?
      - 40 km/h is about 11.1 m/s.
    explanation: You close in at 40 km/h ≈ 11.1 m/s. 200 m ÷ 11.1 m/s ≈ 18 s. That is why overtaking on country roads takes so long.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Two trains travel towards each other, 300 km apart, at 80 and 120 km/h. After how many hours do they meet?
    params:
      unit: h
    answer:
      value: 1.5
    hints:
      - The gap shrinks at 80 + 120 km/h.
    explanation: 300 ÷ 200 = 1.5 h. This is the **relative speed**.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "**Instantaneous speed** is the slope of the distance–time curve at a single point. Mathematically it is the derivative $v = \\frac{ds}{dt}$. A speedometer shows exactly this number."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A stone falls according to s = 5t². How fast is it after {{t}} seconds – in m/s? Take the derivative.
    params:
      unit: m/s
    answer:
      value: "{{10 * t}}"
    feedback:
      - when: numval(state.input) == 5 * t * t
        misconception: position-not-velocity
        text: That is the **distance** after {{t}} s, not the speed.
      - when: numval(state.input) == 5 * t
        misconception: derivative-factor
        text: Differentiating t² brings down a factor of 2.
    hints:
      - The derivative of t² is 2t.
      - v = 5 · 2t = 10t.
    explanation: v = 10t = {{10 * t}} m/s. The speed grows by 10 m/s every second – that is g.
    difficulty: 3
    variants:
      params:
        t: int[3,6]
      defaults:
        t: 3

srs:
  cards_from: [zug, sprint]
