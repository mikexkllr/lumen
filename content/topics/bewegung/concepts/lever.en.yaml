id: sci.motion.lever
type: concept
title: "Levers and torque"
summary: "Moving a lot with little force – and what you pay for it."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: A heavy door is stuck. Where do you push so that it opens most easily?
    params:
      options:
        - label: Far from the hinge
          correct: true
        - label: Right at the hinge
          feedback: There you need enormous force.
        - label: Anywhere
          feedback: Try it on a door.
    hints:
      - Where is the door handle?
    explanation: The further from the pivot, the stronger your force acts.

  - kind: explain
    id: c2
    body: "**Torque** is force times distance from the pivot. A long lever turns a small force into a big effect. In balance both torques are equal."

  - kind: problem
    id: c3
    widget: sim
    prompt: On the left are 4 kg at a distance of 2 m. On the right you only have 2 kg. Slide them out until the seesaw balances.
    params:
      scene: lever
      controls:
        m1:
          fixed: true
        d1:
          fixed: true
        m2:
          fixed: true
    answer:
      tilt: 0
    explanation: "At 4 m: 2 · 4 = 4 · 2. Half the mass needs double the distance."

  - kind: problem
    id: c4
    widget: numeric
    prompt: A 30 kg child sits 2 m from the pivot of the seesaw. How far from the pivot must a 60 kg adult sit?
    params:
      unit: m
    answer:
      value: 1
    hints:
      - 30 · 2 = 60 · ?
    explanation: 60 ÷ 60 = 1 m. Double the mass, half the distance.

  - kind: problem
    id: c5
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A longer spanner loosens tight nuts more easily.
          right: true
        - text: A lever saves work.
          right: false
          why: You save force – and pay with a longer path.
        - text: Scissors cut most powerfully close to the joint.
          right: true
        - text: The door handle is far from the hinge only by chance.
          right: false
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "On the right hang 6 kg at a distance of 2 m. On the left the distance is fixed: 3 m. Which mass keeps the balance level?"
    params:
      scene: lever
      controls:
        m1:
          value: 1
        d1:
          value: 3
          fixed: true
        m2:
          value: 6
          fixed: true
        d2:
          value: 2
          fixed: true
    answer:
      tilt: 0
    explanation: 6 · 2 = 12, so 12 ÷ 3 = 4 kg.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: With a crowbar you lift a 200 kg stone. The stone is 0.2 m from the pivot, you push 2 m away. How many kilograms must you “push”?
    params:
      unit: kg
    answer:
      value: 20
    hints:
      - 200 · 0.2 = ? · 2.
    explanation: 40 ÷ 2 = 20 kg. The lever multiplies your force by ten.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: sim
    prompt: On the left hang 3 kg at a distance of 4 m. On the right you choose mass and distance yourself – but at most 2 m. Balance the seesaw.
    params:
      scene: lever
      controls:
        m1:
          value: 3
          fixed: true
        d1:
          value: 4
          fixed: true
    answer:
      tilt: 0
      d2:
        - 0.5
        - 2
    explanation: Left 3 · 4 = 12. On the right for example 6 kg at 2 m or 8 kg at 1.5 m. Half the distance needs double the mass.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: buckets
    prompt: Does this lever save force – or does it turn a small movement into a large one?
    params:
      buckets:
        - id: b1
          label: saves force
        - id: b2
          label: increases distance
      items:
        - label: Nutcracker
          bucket: b1
        - label: Wheelbarrow
          bucket: b1
        - label: Crowbar
          bucket: b1
        - label: Tweezers
          bucket: b2
        - label: Fishing rod
          bucket: b2
        - label: Forearm
          bucket: b2
    hints:
      - Where does the force act – close to the pivot or far away?
      - If your hand acts closer to the pivot than the load, you gain distance.
    explanation: Nutcracker, wheelbarrow and crowbar have a long effort arm. With tweezers, rod and arm the force acts near the pivot – the tip moves far and fast.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The golden rule: what you save in force you pay in distance. You lift the stone by 5 cm. How far must you push your end down?"
    params:
      unit: cm
    answer:
      value: 50
    hints:
      - Your lever arm is ten times as long.
    explanation: Ten times as far. The work – force times distance – stays the same.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Your forearm is a lever. The biceps attaches 4 cm from the elbow, the hand is 32 cm away. You hold 5 kg. How many kilograms must the muscle hold?
    params:
      unit: kg
    answer:
      value: 40
    hints:
      - 5 · 32 = ? · 4.
    explanation: 160 ÷ 4 = 40 kg – eight times as much. Here the lever works against you.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Why is the arm built so “badly”?
    params:
      options:
        - label: A small muscle movement becomes a large, fast hand movement
          correct: true
        - label: A mistake of nature
          feedback: The design has a clear advantage.
        - label: So that muscles get strong
          feedback: It is about reach and speed.
    hints:
      - What you pay in force you gain in distance.
    explanation: The arm trades force for speed. That is why you can throw.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A pulley system has 4 supporting rope sections. It lifts 200 kg. With what force must you pull? g = 10 m/s².
    params:
      unit: N
    answer:
      value: 500
    feedback:
      - when: numval(state.input) == 2000
        misconception: no-sharing
        text: That is the whole weight. It is shared by 4 rope sections.
      - when: numval(state.input) == 50
        misconception: kg-vs-newton
        text: "Convert to newtons first: 200 kg weigh 2000 N."
    hints:
      - "Weight: 200 kg · 10 m/s²."
      - Each rope section carries a quarter.
    explanation: 2000 N ÷ 4 = 500 N. In return you must pull 4 m of rope to raise the load 1 m. Force times distance stays the same.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: teach
    prompt: "Explain to Lux: a lever saves force – why does it not save work?"
    params:
      keywords:
        - - kraft
          - force
        - - weg
          - distance
          - länger
          - longer
          - weiter
          - farther
        - - arbeit
          - work
          - gleich
          - same
          - energie
          - energy
      sample: On the long arm I need little force. But I must move my end much farther than the load moves. Force times distance is the same on both sides – the work stays the same.
    difficulty: 3

srs:
  cards_from: ["c4", "d2"]
