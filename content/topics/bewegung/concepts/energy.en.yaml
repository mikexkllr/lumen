id: sci.motion.energy
type: concept
title: "Energy of motion"
summary: "Height becomes speed, speed becomes height – and nothing is lost."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 13
steps:
  - kind: problem
    id: c1
    widget: estimate
    prompt: "Take a guess: from what height would a car have to fall to hit the ground at 100 km/h (in metres)?"
    params:
      min: 1
      max: 200
      unit: m
    answer:
      value: 39
      tolerance: 8
    explanation: About 39 m – a building with 13 floors. That is how much energy 100 km/h holds.

  - kind: explain
    id: c2
    body: "**Potential energy** sits in height: E = m · g · h. **Kinetic energy** sits in speed: E = ½ · m · v². In a fall one turns into the other."

  - kind: problem
    id: c3
    widget: numeric
    prompt: A 2 kg brick lies 5 m up. How much potential energy does it have? Use g = 10 m/s².
    params:
      unit: J
    answer:
      value: 100
    hints:
      - Mass times g times height.
    explanation: 2 · 10 · 5 = 100 joules.

  - kind: problem
    id: c4
    widget: numeric
    prompt: A 2 kg ball flies at 10 m/s. How much kinetic energy does it have?
    params:
      unit: J
    answer:
      value: 100
    hints:
      - Half of mass times speed squared.
    explanation: ½ · 2 · 100 = 100 joules.

  - kind: problem
    id: c5
    widget: choice
    prompt: The brick falls the 5 m. How much kinetic energy does it have at the bottom? Without air drag.
    params:
      options:
        - label: 100 J – all of the potential energy
          correct: true
        - label: 50 J
          feedback: Nothing is lost.
        - label: 0 J
          feedback: At the bottom it is fastest.
    hints:
      - Where else should the potential energy go?
    explanation: Energy is conserved. It only changes from height to speed.

  - kind: problem
    id: c6
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Energy is never [[lost]]. It only changes its [[form]].
      distractors:
        - broken
        - colour

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A roller coaster starts from rest at a height of 20 m. How fast is the car at the bottom? In m/s, with g = 10 and no friction.
    params:
      unit: m/s
    answer:
      value: 20
    hints:
      - "m · g · h = ½ · m · v². The mass cancels: v² = 2 · g · h."
    explanation: v² = 400, so 20 m/s or 72 km/h. The mass does not matter.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A pendulum swings back and forth. Where is its kinetic energy greatest?
    params:
      options:
        - label: At the bottom – there it is fastest
          correct: true
        - label: At the turning points
          feedback: There it stops for a moment.
        - label: The same everywhere
          feedback: The speed changes all the time.
    hints:
      - Where is the height smallest?
    explanation: At the bottom all potential energy has become kinetic energy – and back again at the top.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: You throw at 20 m/s. Set the angle so that the ball rises at least 19.5 m.
    params:
      scene: projectile
      controls:
        speed:
          value: 20
          fixed: true
    answer:
      height:
        - 19.5
        - 21
    explanation: "Almost straight up. Then nearly all kinetic energy becomes height: v² ÷ (2 · g) ≈ 20 m."
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Where does ½ m v² come from? A force F accelerates a mass over a distance s. It does the **work** W = F · s. With F = m · a and s = v² ÷ (2a) we get W = ½ m v².

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: From what height must a ball fall without air resistance to reach {{v}} m/s? g = 10 m/s².
    params:
      unit: m
    answer:
      value: "{{v * v / 20}}"
    feedback:
      - when: numval(state.input) == v / 2
        misconception: not-squared
        text: "Speed enters squared: m g h = ½ m v²."
    hints:
      - "Set potential energy equal to kinetic energy: g h = ½ v²."
      - h = v² ÷ (2g) = {{v * v}} ÷ 20.
    explanation: h = {{v * v}} ÷ 20 = {{v * v / 20}} m. The mass cancels – just as in free fall.
    difficulty: 2
    variants:
      params:
        v: choice[20,30,40]
      defaults:
        v: 20

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A 1000 kg car brakes from 20 m/s to a stop. The braking force is 8000 N. How long is the braking distance in metres?
    params:
      unit: m
    answer:
      value: 25
    hints:
      - Energy = ½ · 1000 · 20². Work = force times distance.
    explanation: 200,000 J ÷ 8000 N = 25 m. At double the speed it would be 100 m.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Where does the kinetic energy go when braking?
    params:
      options:
        - label: Into heat – the brake discs get hot
          correct: true
        - label: It disappears
          feedback: Energy never disappears.
        - label: Back into the tank
          feedback: Only electric cars win part of it back.
    hints:
      - Touch a bicycle rim after a long descent.
    explanation: "Electric cars use the motor as a generator and charge the battery when braking: **regeneration**."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Tell Lux what happens to the energy of a ball when it falls.
    params:
      keywords:
        - - lage
          - höhe
          - potenzi
          - potential
          - height
        - - bewegung
          - kineti
          - tempo
          - motion
          - speed
        - - wandelt
          - wird zu
          - umgewandelt
          - turn
          - convert
          - becomes
          - chang
        - - gleich
          - erhalten
          - same
          - conserved
          - constant
      min: 3
      sample: At the top the ball has potential energy because of its height. As it falls this turns into energy of motion – it gets faster. The sum stays the same.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: A roller-coaster car must get round a loop of radius r without friction. How high must the start be at least?
    params:
      options:
        - label: 2.5 r
          correct: true
        - label: 2 r
          feedback: Then it would arrive at the top with zero speed and fall. At the top it still needs v² = g r.
        - label: 3 r
          feedback: That works, but it is more than needed.
    hints:
      - "At the top gravity must just supply the centripetal force: v² = g r."
      - "Energy: g h = g · 2r + ½ g r."
    explanation: At the top the car needs ½ m v² = ½ m g r on top of the height 2r. Together that is h = 2.5 r. Real rides start higher because of friction.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Fermi question: a chocolate bar provides 2200 kJ. How many floors (3 m each) would you, weighing 70 kg, have to climb to store that energy as potential energy?"
    params:
      min: 1
      max: 10000
      scale: log
    answer:
      value: 1050
      within: 40
    explanation: "Per floor: 70 · 10 · 3 = 2100 J. 2,200,000 ÷ 2100 ≈ 1050 floors. Muscles are only about 25 % efficient – so in reality it is about 260."
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d1"]
