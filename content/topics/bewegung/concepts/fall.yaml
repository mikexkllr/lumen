id: sci.motion.fall
type: concept
title: Fallen und Werfen
summary: Alles fällt gleich schnell – auf einer Parabel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der perfekte Bogen
    body: "Ob Basketball oder Wasserstrahl: Was fliegt, zieht einen Bogen. Dreh an Winkel und Tempo und schau dir die **Wurfbahn** an. Wie hoch steigt der Ball, wie weit fliegt er?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: projectile

  - kind: problem
    id: gleich
    widget: choice
    prompt: Eine Bowlingkugel und ein Tennisball fallen ohne Luft gleichzeitig los. Welche ist zuerst unten?
    params:
      options:
        - { label: Beide kommen gleichzeitig an., correct: true }
        - { label: Die Bowlingkugel, feedback: "Schwerer fühlt sich schneller an. Ohne Luft fallen aber alle gleich." }
        - { label: Der Tennisball, feedback: "Leichter heißt nicht schneller." }
    hints:
      - Auf dem Mond fielen ein Hammer und eine Feder gleich schnell.
    explanation: Ohne Luftwiderstand fallen alle Körper gleich schnell.

  - kind: explain
    id: s2
    body: |
      Ohne **Luft** fallen alle Körper gleich schnell.
      Nach t Sekunden ist ein Stein etwa **5 · t²** Meter tief gefallen.

  - kind: problem
    id: tiefe
    widget: numeric
    prompt: Ein Stein fällt {{t}} Sekunden lang. Wie tief fällt er etwa? Rechne mit 5 · t².
    params: { unit: m }
    answer: { value: "{{5 * t * t}}" }
    feedback:
      - when: "numval(state.input) == 5 * t"
        misconception: linear-fall
        text: Die Zeit steht im Quadrat. Rechne erst {{t}} · {{t}}.
    hints:
      - "{{t}} · {{t}} = {{t * t}}. Dann mal 5."
    explanation: "5 · {{t}}² = {{5 * t * t}} m."
    variants:
      params: { t: "int[2,6]" }
      defaults: { t: 3 }

  - kind: problem
    id: wurf
    widget: slider
    prompt: Stelle die Wurfkraft so ein, dass der Ball genau im Korb landet.
    params:
      expr: "k*x*(8 - x)/8"
      x: [0, 10]
      y: [0, 6]
      sliders: [{ id: k, label: Kraft, min: 0.5, max: 3, step: 0.25, initial: 1 }]
      markers: [{ x: 6, y: 3, label: Korb }]
      showCoordinates: false
    answer: { values: { k: 2 } }
    hints:
      - Bei x = 6 muss die Bahn auf Höhe 3 sein.
    explanation: Mit Kraft 2 trifft die Parabel den Korb.

  - kind: explain
    id: s5
    body: Warum fliegt ein geworfener Ball auf einer Parabel?
    reveal:
      body: Waagerecht fliegt er gleichmäßig weiter. Senkrecht zieht ihn die Schwerkraft immer stärker nach unten. Zusammen ergibt das eine Parabel.

  - kind: problem
    id: c1
    widget: sim
    prompt: Schieß den Ball genau ins Ziel bei 30 m.
    params:
      scene: projectile
      target:
        range: 30
      show:
        - range
        - time
    answer:
      range:
        - 28.5
        - 31.5
    explanation: Winkel und Tempo zusammen bestimmen die Weite.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Gleiche Weite, andere Bahn: Triff die 30 m mit einem Winkel von **mindestens 60°**."
    params:
      scene: projectile
      target:
        range: 30
      show:
        - range
        - height
        - time
    answer:
      range:
        - 28.5
        - 31.5
      angle:
        - 60
        - 85
    explanation: "Steile und flache Würfe können gleich weit fliegen: α und 90° − α ergeben dieselbe Weite."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Stein fällt 3 Sekunden. Wie schnell ist er dann? Die Geschwindigkeit wächst um 10 m/s pro Sekunde.
    params:
      unit: m/s
    answer:
      value: 30
    hints:
      - 3 · 10.
    explanation: 30 m/s – das sind 108 km/h.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Du lässt einen Stein in einen Brunnen fallen. Nach 2 Sekunden hörst du ihn aufschlagen. Wie tief ist der Brunnen ungefähr? Rechne mit 5 · t² und vernachlässige den Schall.
    params:
      unit: m
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 10
        misconception: not-squared
        text: Das wäre 5 · t. Die Zeit wird quadriert.
    hints:
      - Setze t = 2 in 5 · t² ein.
      - 5 · 2 · 2 = ?
    explanation: 5 · 2² = 20 m. Der Schall braucht für 20 m nur 0,06 s – das darf man hier weglassen.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Eine Kugel wird waagerecht abgeschossen. Im selben Moment fällt eine zweite aus derselben Höhe einfach herunter. Welche ist zuerst am Boden?
    params:
      options:
        - label: Beide gleichzeitig.
          correct: true
        - label: Die fallengelassene.
          feedback: Das waagerechte Tempo ändert nichts am Fallen nach unten.
        - label: Die abgeschossene.
          feedback: Sie ist schneller, aber nur zur Seite. Nach unten fällt sie genauso.
    hints:
      - Waagerecht und senkrecht laufen unabhängig voneinander.
      - Nach unten zieht bei beiden dieselbe Schwerkraft.
    explanation: Beide fallen senkrecht genau gleich. Die eine fliegt dabei nur weiter zur Seite. Darum ist die Wurfbahn eine Parabel.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: sim
    prompt: Du wirfst immer mit 20 m/s. Finde den Winkel, bei dem der Ball am weitesten fliegt.
    params:
      scene: projectile
      controls:
        speed:
          value: 20
          fixed: true
    answer:
      angle: 45
    explanation: Bei 45° fliegt er 40,8 m weit. 30° und 60° ergeben dieselbe, kleinere Weite – die Winkel ergänzen sich zu 90°.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: Auf dem Mond ist die Schwerkraft nur 1,6 m/s². Stell sie ein und triff eine Fahne in 80 m.
    params:
      scene: projectile
      target:
        range: 80
      controls:
        g:
          fixed: false
          value: 9.8
          min: 1.6
          max: 9.8
          step: 0.1
        speed:
          max: 20
      show:
        - range
        - time
    answer:
      range:
        - 77
        - 83
      g: 1.6
    explanation: Bei einem Sechstel der Schwerkraft fliegt derselbe Wurf sechsmal so weit.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Die Flugzeit ist $t = \frac{2 v \sin\alpha}{g}$. Waagerecht fliegt der Ball mit $v\cos\alpha$. Also ist die **Wurfweite** $x = \frac{v^2 \sin 2\alpha}{g}$. Sie ist am größten, wenn $2\alpha = 90°$ ist.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Jetzt mit Luftwiderstand. Liegt der beste Wurfwinkel dann über oder unter 45°?
    params:
      options:
        - label: Darunter – im langen, hohen Flug bremst die Luft mehr.
          correct: true
        - label: Darüber – höher heißt weiter.
          feedback: Hohe Würfe sind länger in der Luft und verlieren mehr Tempo.
        - label: Genau 45° – Luft ändert nichts.
          feedback: Die Luft bremst stark. Ein Fußball fliegt nur einen Bruchteil der berechneten Weite.
    hints:
      - Welcher Wurf ist länger in der Luft?
      - Je länger der Flug, desto mehr bremst die Luft.
    explanation: Die Luft frisst vor allem bei langen Flügen Tempo. Flachere Würfe verlieren weniger. Speerwerfer und Golfer nutzen deutlich kleinere Winkel als 45°.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: numeric
    prompt: Ein Fallschirmspringer wird nicht schneller als etwa 200 km/h (55,6 m/s) – die Luft bremst so stark, wie er zieht. Nach wie vielen Sekunden wäre er ohne Luft so schnell? g = 10 m/s².
    params:
      unit: s
    answer:
      value: 5.56
      tolerance: 0.1
    hints:
      - Ohne Luft wächst das Tempo um 10 m/s pro Sekunde.
      - "55,6 : 10 = ?"
    explanation: "Nach gut 5,5 s. Mit Luft dauert es länger, denn die Bremskraft wächst mit dem Tempo. Am Ende heben sich beide Kräfte auf: die **Endgeschwindigkeit**."
    difficulty: 3

srs:
  cards_from: [tiefe, gleich]
