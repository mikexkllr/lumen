id: sci.motion.energy
type: concept
title: "Energie der Bewegung"
summary: "Höhe wird Tempo, Tempo wird Höhe – und nichts geht verloren."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: estimate
    prompt: "Schätz mal: Aus welcher Höhe müsste ein Auto fallen, um mit 100 km/h aufzuschlagen (in Metern)?"
    params:
      min: 1
      max: 200
      unit: m
    answer:
      value: 39
      tolerance: 8
    explanation: Rund 39 m – ein Haus mit 13 Stockwerken. So viel Energie steckt in Tempo 100.

  - kind: explain
    id: c2
    body: "**Lageenergie** steckt in der Höhe: E = m · g · h. **Bewegungsenergie** steckt im Tempo: E = ½ · m · v². Beim Fallen wird die eine zur anderen."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Ziegel mit 2 kg liegt 5 m hoch. Wie viel Lageenergie hat er? Rechne mit g = 10 m/s².
    params:
      unit: J
    answer:
      value: 100
    hints:
      - Masse mal g mal Höhe.
    explanation: 2 · 10 · 5 = 100 Joule.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Ein Ball mit 2 kg fliegt mit 10 m/s. Wie viel Bewegungsenergie hat er?
    params:
      unit: J
    answer:
      value: 100
    hints:
      - Die Hälfte von Masse mal Tempo zum Quadrat.
    explanation: ½ · 2 · 100 = 100 Joule.

  - kind: problem
    id: c5
    widget: choice
    prompt: Der Ziegel fällt die 5 m herunter. Wie viel Bewegungsenergie hat er ganz unten? Ohne Luftwiderstand.
    params:
      options:
        - label: 100 J – die ganze Lageenergie
          correct: true
        - label: 50 J
          feedback: Es geht nichts verloren.
        - label: 0 J
          feedback: Unten ist er am schnellsten.
    hints:
      - Wohin soll die Lageenergie sonst gehen?
    explanation: Die Energie bleibt erhalten. Sie wechselt nur von Höhe zu Tempo.

  - kind: problem
    id: c6
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Energie geht nie [[verloren]]. Sie wechselt nur ihre [[Form]].
      distractors:
        - kaputt
        - Farbe

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Achterbahn startet in 20 m Höhe aus dem Stand. Wie schnell ist der Wagen ganz unten? In m/s, mit g = 10 und ohne Reibung.
    params:
      unit: m/s
    answer:
      value: 20
    hints:
      - "m · g · h = ½ · m · v². Die Masse kürzt sich: v² = 2 · g · h."
    explanation: v² = 400, also 20 m/s oder 72 km/h. Die Masse spielt keine Rolle.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Ein Pendel schwingt hin und her. Wo ist seine Bewegungsenergie am größten?
    params:
      options:
        - label: Ganz unten – dort ist es am schnellsten
          correct: true
        - label: An den Umkehrpunkten
          feedback: Dort steht es kurz still.
        - label: Überall gleich
          feedback: Das Tempo ändert sich ständig.
    hints:
      - Wo ist die Höhe am kleinsten?
    explanation: Unten ist alle Lageenergie zu Bewegungsenergie geworden – und oben wieder zurück.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Auto mit 1000 kg bremst von 20 m/s bis zum Stand. Die Bremskraft ist 8000 N. Wie lang ist der Bremsweg in Metern?
    params:
      unit: m
    answer:
      value: 25
    hints:
      - Energie = ½ · 1000 · 20². Arbeit = Kraft mal Weg.
    explanation: "200 000 J : 8000 N = 25 m. Bei doppeltem Tempo wären es 100 m."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Wohin geht die Bewegungsenergie beim Bremsen?
    params:
      options:
        - label: In Wärme – die Bremsscheiben werden heiß
          correct: true
        - label: Sie verschwindet
          feedback: Energie verschwindet nie.
        - label: Zurück in den Tank
          feedback: Nur E-Autos gewinnen einen Teil zurück.
    hints:
      - Fass nach einer Abfahrt mal eine Fahrradfelge an.
    explanation: "E-Autos nutzen den Motor als Generator und laden beim Bremsen den Akku: **Rekuperation**."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was mit der Energie eines Balls passiert, wenn er fällt.
    params:
      keywords:
        - - lage
          - höhe
          - potenzi
          - potential
          - height
        - - bewegung
          - kineti
          - tempo
          - motion
          - speed
        - - wandelt
          - wird zu
          - umgewandelt
          - turn
          - convert
          - becomes
          - chang
        - - gleich
          - erhalten
          - same
          - conserved
          - constant
      min: 3
      sample: Oben hat der Ball Lageenergie wegen seiner Höhe. Beim Fallen wandelt sie sich in Bewegungsenergie um – er wird schneller. Die Summe bleibt dabei gleich.
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d1"]
