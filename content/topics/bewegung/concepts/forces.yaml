id: sci.motion.forces
type: concept
title: Kraft und Masse
summary: Warum schwere Dinge träge sind.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bus
    widget: choice
    prompt: Ein Bus bremst scharf. Warum kippst du nach vorn?
    params:
      options:
        - { label: Dein Körper will sich weiterbewegen., correct: true }
        - { label: Eine Kraft schiebt dich nach vorn., feedback: "Niemand schiebt dich – der Bus wird langsamer, du nicht." }
    hints:
      - Was macht ein Körper, auf den keine Kraft wirkt?
    explanation: Das ist **Trägheit**. Darum gibt es Sicherheitsgurte.

  - kind: explain
    body: |
      **Kraft = Masse · Beschleunigung.** Wer etwas Schweres schnell beschleunigen will, braucht viel Kraft. Die Einheit ist das **Newton** (N).

  - kind: problem
    id: tempo
    widget: slider
    prompt: Ein Auto steht und beschleunigt gleichmäßig. Nach 5 Sekunden fährt es 20 m/s. Passe die Gerade an.
    params:
      expr: "a*x"
      x: [0, 6]
      y: [0, 30]
      sliders: [{ id: a, label: "Beschleunigung (m/s²)", min: 1, max: 6, step: 1, initial: 1 }]
      target: { expr: "4*x" }
    answer: { matchTarget: true }
    hints:
      - Jede Sekunde kommt gleich viel Tempo dazu. 20 geteilt durch 5.
    explanation: 4 m/s² – jede Sekunde 4 m/s schneller.

  - kind: problem
    id: newton
    widget: numeric
    prompt: Ein Auto mit {{m}} kg beschleunigt mit {{a}} m/s². Welche Kraft braucht es?
    params: { unit: N }
    answer: { value: "{{m * a}}" }
    hints:
      - Masse mal Beschleunigung.
    explanation: "{{m}} · {{a}} = {{m * a}} N."
    variants:
      params: { m: "choice[800,1000,1200,1500]", a: "int[2,4]" }
      defaults: { m: 1000, a: 3 }

srs:
  cards_from: [bus, newton]
