id: sci.motion.forces
type: concept
title: Kraft und Masse
summary: Warum schwere Dinge träge sind.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Schwer in Gang
    body: "Ein leerer Einkaufswagen saust los, ein voller kaum. Nach rechts wächst die Kraft, nach oben die Beschleunigung. Zieh die **Masse** hoch: Wie flach wird die Linie?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: x/m
        x:
          - 0
          - 100
        y:
          - 0
          - 10
        sliders:
          - id: m
            label: Masse (kg)
            min: 10
            max: 100
            step: 10
            initial: 10

  - kind: problem
    id: bus
    widget: choice
    prompt: Ein Bus bremst scharf. Warum kippst du nach vorn?
    params:
      options:
        - { label: Dein Körper will sich weiterbewegen., correct: true }
        - { label: Eine Kraft schiebt dich nach vorn., feedback: "Niemand schiebt dich – der Bus wird langsamer, du nicht." }
    hints:
      - Was macht ein Körper, auf den keine Kraft wirkt?
    explanation: Das ist **Trägheit**. Darum gibt es Sicherheitsgurte.

  - kind: explain
    id: s2
    body: |
      **Kraft = Masse · Beschleunigung.** Wer etwas Schweres schnell beschleunigen will, braucht viel Kraft. Die Einheit ist das **Newton** (N).

  - kind: problem
    id: tempo
    widget: slider
    prompt: Ein Auto steht und beschleunigt gleichmäßig. Nach 5 Sekunden fährt es 20 m/s. Passe die Gerade an.
    params:
      expr: "a*x"
      x: [0, 6]
      y: [0, 30]
      sliders: [{ id: a, label: "Beschleunigung (m/s²)", min: 1, max: 6, step: 1, initial: 1 }]
      target: { expr: "4*x" }
    answer: { matchTarget: true }
    hints:
      - Jede Sekunde kommt gleich viel Tempo dazu. 20 geteilt durch 5.
    explanation: 4 m/s² – jede Sekunde 4 m/s schneller.

  - kind: problem
    id: newton
    widget: numeric
    prompt: Ein Auto mit {{m}} kg beschleunigt mit {{a}} m/s². Welche Kraft braucht es?
    params: { unit: N }
    answer: { value: "{{m * a}}" }
    hints:
      - Masse mal Beschleunigung.
    explanation: "{{m}} · {{a}} = {{m * a}} N."
    variants:
      params: { m: "choice[800,1000,1200,1500]", a: "int[2,4]" }
      defaults: { m: 1000, a: 3 }

  - kind: problem
    id: c1
    widget: match
    prompt: Welches von Newtons Gesetzen ist das?
    params:
      pairs:
        - left: Ohne Kraft keine Änderung
          right: Trägheit
        - left: F = m · a
          right: Grundgesetz
        - left: Kraft und Gegenkraft
          right: Wechselwirkung
    hints:
      - Denk an den bremsenden Bus, das schwere Auto und den Rückstoß.
    explanation: Diese drei Sätze erklären fast alle Bewegungen des Alltags.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Kraft von 600 N wirkt auf einen 1200-kg-Wagen. Wie schnell ist er nach 10 Sekunden aus dem Stand?
    params:
      unit: m/s
    answer:
      value: 5
    hints:
      - "Erst a = F : m, dann v = a · t."
    explanation: 0,5 m/s² · 10 s = 5 m/s.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Ein Auto fährt mit gleichbleibend 100 km/h geradeaus. Wie groß ist die Summe aller Kräfte auf das Auto?
    params:
      options:
        - label: "Null"
          correct: true
        - label: Eine große Kraft nach vorn
          feedback: Der Motor schiebt – aber Luft und Reibung bremsen genauso stark.
        - label: Eine Kraft nach hinten
          feedback: Dann würde das Auto langsamer.
    hints:
      - Ändert sich die Geschwindigkeit?
      - Ohne Beschleunigung ist F = m · a gleich null.
    explanation: Gleichförmige Bewegung braucht keine Gesamtkraft. Der Motor gleicht nur die Bremskräfte aus. Das ist Newtons erstes Gesetz – und es widerspricht dem Bauchgefühl.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: "**Reibung** bremst Bewegungen. Ihre Kraft ist $F_R = \\mu \\cdot F_N$. Dabei ist $F_N$ die Kraft, mit der ein Körper auf den Boden drückt. Die Reibungszahl μ hängt von den Stoffen ab."

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: Ein Auto mit 1000 kg zieht mit {{f}} N. Luft und Reibung bremsen mit 500 N. Wie groß ist seine Beschleunigung in m/s²?
    params:
      unit: m/s²
    answer:
      value: "{{(f - 500) / 1000}}"
    feedback:
      - when: abs(numval(state.input) - f / 1000) < 0.01
        misconception: net-force
        text: Du hast die Bremskraft vergessen. Es zählt die Summe aller Kräfte.
    hints:
      - Gesamtkraft = Zugkraft − Bremskraft.
      - "a = Gesamtkraft : Masse."
    explanation: "({{f}} − 500) : 1000 = {{(f - 500) / 1000}} m/s². Nur die übrige Kraft beschleunigt."
    difficulty: 2
    variants:
      params:
        f: choice[1500,2500,3500,4500]
      defaults:
        f: 2500

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Pferd zieht einen Wagen. Der Wagen zieht genauso stark zurück. Warum bewegt sich trotzdem etwas?
    params:
      options:
        - label: Die beiden Kräfte greifen an **verschiedenen** Körpern an und heben sich nicht auf
          correct: true
        - label: Das Pferd zieht ein wenig stärker
          feedback: Die Kräfte sind immer exakt gleich groß.
        - label: Die Gegenkraft wirkt erst später
          feedback: Sie wirkt im selben Moment.
    hints:
      - "Schau nur auf den Wagen: Welche Kräfte wirken auf ihn?"
    explanation: Auf den Wagen wirkt nur der Zug nach vorn (und etwas Reibung). Das Pferd stößt sich am Boden ab.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Du (60 kg) stehst im Aufzug auf einer Waage. Er fährt an und beschleunigt mit 2 m/s² nach oben. Was zeigt die Waage in kg? g = 10 m/s².
    params:
      unit: kg
    answer:
      value: 72
    feedback:
      - when: numval(state.input) == 48
        misconception: sign-elevator
        text: Nach **oben** beschleunigt drückst du stärker. Der Boden muss dich zusätzlich anschieben.
      - when: numval(state.input) == 60
        misconception: ignore-acceleration
        text: In Ruhe stimmt das. Beim Anfahren braucht es aber zusätzlich Kraft.
    hints:
      - "Der Boden muss g und a liefern: F = m · (g + a)."
      - 60 · 12 = 720 N. Die Waage teilt durch 10.
    explanation: F = 60 · (10 + 2) = 720 N. Die Waage rechnet das als 72 kg. Beim Bremsen nach oben zeigt sie weniger.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Im Gedankenexperiment reißt das Seil des Aufzugs, und alles fällt frei. Was zeigt die Waage unter deinen Füßen?
    params:
      options:
        - label: 0 kg
          correct: true
        - label: 60 kg
          feedback: Waage und du fallen gleich schnell. Du drückst gar nicht mehr auf sie.
        - label: Mehr als 60 kg
          feedback: Mehr zeigt sie nur, wenn der Aufzug nach oben beschleunigt.
    hints:
      - Fällt die Waage schneller oder langsamer als du?
      - Ohne Druck keine Anzeige.
    explanation: Alles fällt mit g. Du drückst nicht mehr auf die Waage – du bist schwerelos. Genau so geht es Astronauten in der Raumstation.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux Newtons erstes Gesetz am Beispiel einer Vollbremsung im Bus.
    params:
      keywords:
        - - träg
          - inertia
          - beharr
          - weiter
          - keeps
          - continue
        - - kraft
          - force
          - ohne
          - without
        - - bus
          - brems
          - brake
          - stop
          - halt
      sample: Ein Körper bleibt in Bewegung, solange keine Kraft ihn bremst – er ist träge. Der Bus bremst, aber auf meinen Körper wirkt erst mal keine Kraft. Darum bewege ich mich weiter nach vorn.
    difficulty: 3

srs:
  cards_from: [bus, newton]
