id: sci.motion.braking
type: concept
title: Bremsen und Beschleunigen
summary: Doppeltes Tempo, vierfacher Bremsweg.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: doppelt
    widget: choice
    prompt: Ein Auto fährt doppelt so schnell. Wie verändert sich sein Bremsweg?
    params:
      options:
        - { label: Er wird etwa 4-mal so lang., correct: true }
        - { label: Er wird doppelt so lang., feedback: "Das wäre schön. Der Bremsweg wächst aber mit dem Quadrat." }
        - { label: Er bleibt gleich., feedback: "Schneller heißt mehr Bewegungsenergie, die abgebaut werden muss." }
    hints:
      - Die Bewegungsenergie wächst mit dem Quadrat der Geschwindigkeit.
    explanation: Doppeltes Tempo heißt vierfache Bewegungsenergie – und etwa vierfacher Bremsweg.

  - kind: explain
    id: s2
    body: |
      **Beschleunigung** ist die Änderung der Geschwindigkeit pro Sekunde.
      Der Bremsweg wächst mit dem **Quadrat** der Geschwindigkeit.

  - kind: problem
    id: faustformel
    widget: numeric
    prompt: Faustformel – Bremsweg in Metern = (Tempo in km/h durch 10)². Wie lang ist der Bremsweg bei {{v}} km/h?
    params: { unit: m }
    answer: { value: "{{(v / 10) ** 2}}" }
    feedback:
      - when: "numval(state.input) == v / 10 * 2"
        misconception: times-two
        text: Hoch 2 heißt mal sich selbst, nicht mal 2.
    hints:
      - "{{v}} : 10 = {{v / 10}}. Jetzt mal sich selbst."
    explanation: "({{v / 10}})² = {{(v / 10) ** 2}} m."
    variants:
      params: { v: "choice[30,50,80,100,130]" }
      defaults: { v: 50 }

  - kind: problem
    id: anfahren
    widget: numeric
    prompt: Ein Auto beschleunigt in {{t}} Sekunden von 0 auf 100 km/h. Um wie viel km/h wird es pro Sekunde schneller?
    params: { unit: km/h pro s }
    answer: { value: "{{100 / t}}" }
    hints:
      - Teile die Änderung durch die Zeit.
    explanation: "100 km/h : {{t}} s = {{100 / t}} km/h pro Sekunde."
    variants:
      params: { t: "choice[4,5,8,10]" }
      defaults: { t: 10 }

  - kind: explain
    id: s5
    body: Warum ist Tempo 30 vor Schulen so wichtig?
    reveal:
      body: Nach der Faustformel bremst ein Auto bei 30 km/h in 9 m, bei 50 km/h braucht es 25 m. Wo das langsame schon steht, ist das schnelle noch kaum gebremst.

  - kind: problem
    id: reaktion
    widget: numeric
    prompt: Reaktionsweg in Metern ≈ (Tempo durch 10) · 3. Wie lang ist er bei {{v}} km/h?
    params: { unit: m }
    answer: { value: "{{v / 10 * 3}}" }
    hints:
      - "{{v}} : 10 · 3."
    explanation: "{{v / 10}} · 3 = {{v / 10 * 3}} m – so weit fährt man, bevor man überhaupt bremst."
    variants:
      params: { v: "choice[30,50,70,100]" }
      defaults: { v: 50 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Bei doppeltem Tempo ist der Bremsweg viermal so lang.
          right: true
        - text: Bei doppeltem Tempo ist der Reaktionsweg viermal so lang.
          right: false
          why: Er verdoppelt sich nur – in der Schrecksekunde fährt man gleichmäßig weiter.
        - text: Anhalteweg = Reaktionsweg + Bremsweg.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie lang ist der gesamte Anhalteweg bei 100 km/h? Nutze beide Faustformeln.
    params:
      unit: m
    answer:
      value: 130
    hints:
      - Reaktionsweg 10 · 3, Bremsweg 10².
    explanation: 30 m + 100 m = 130 m – länger als ein Fußballfeld.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Warum wächst der **Bremsweg** mit dem Quadrat des Tempos? Bei doppeltem Tempo dauert das Bremsen doppelt so lange. Und man fährt dabei im Mittel doppelt so schnell. Zweimal zwei macht vier.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Auf nasser Straße bremst ein Auto nur halb so stark – die Bremsverzögerung halbiert sich. Wievielmal länger wird der Bremsweg?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 4
        misconception: square-wrong-variable
        text: "Das Quadrat gehört zum Tempo. Die Verzögerung steht einfach im Nenner: s = v² : (2a)."
    hints:
      - "Schau auf die Formel s = v² : (2a)."
      - Was passiert mit s, wenn a halb so groß wird?
    explanation: "s = v² : (2a). Halbe Verzögerung heißt doppelter Bremsweg. Auf Eis kann es zehnmal so weit werden."
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: estimate
    prompt: Bei 30 km/h hält ein Auto genau vor einem Kind, das auf die Straße läuft. Mit welchem Tempo erreicht ein Auto mit 50 km/h dieselbe Stelle? Schätz in km/h.
    params:
      min: 0
      max: 50
    answer:
      value: 47
      tolerance: 5
    explanation: "Bei 30 km/h: 9 m Reaktion plus 9 m Bremsen = 18 m. Mit 50 km/h ist man nach dem Reaktionsweg von 15 m erst 3 m gebremst – und noch fast 47 km/h schnell."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Ein Auto bremst mit 8 m/s² aus 20 m/s. Wie lang ist der Bremsweg? Formel: $s = \\frac{v^2}{2a}$"
    params:
      unit: m
    answer:
      value: 25
    hints:
      - 400 geteilt durch 16.
    explanation: 25 m. Das v² in der Formel erklärt, warum doppeltes Tempo den Weg vervierfacht.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Auto fährt 30 m/s. Die Fahrerin reagiert nach 1 s und bremst dann mit 8 m/s². Wie lang ist der gesamte Anhalteweg in Metern?
    params:
      unit: m
    answer:
      value: 86.25
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 56.25) < 0.5
        misconception: forgot-reaction
        text: Das ist nur der Bremsweg. Während der Reaktionszeit fährt das Auto noch ungebremst 30 m.
    hints:
      - "Reaktionsweg: 30 m/s · 1 s."
      - "Bremsweg: v² : (2a) = 900 : 16."
    explanation: 30 m + 56,25 m = 86,25 m. Bei 108 km/h ist das fast ein Fußballfeld.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Warum haben Autos ABS, das ein Blockieren der Räder verhindert?
    params:
      options:
        - label: Ein rollendes Rad haftet besser als ein rutschendes – und man kann noch lenken.
          correct: true
        - label: Blockierte Räder bremsen besser, ABS schont nur die Reifen.
          feedback: Rutschen gibt Gleitreibung, und die ist kleiner als Haftreibung.
        - label: ABS macht die Bremsen stärker.
          feedback: Die Bremskraft bleibt. ABS regelt sie nur knapp unter die Haftgrenze.
    hints:
      - "Was ist größer: Haftreibung oder Gleitreibung?"
      - Ein rutschendes Rad lässt sich auch nicht lenken.
    explanation: Die Haftreibung ist größer als die Gleitreibung. ABS löst die Bremse kurz, sobald ein Rad rutschen will. So bleibt es an der Haftgrenze und lenkbar.
    difficulty: 3

srs:
  cards_from: [faustformel, reaktion]
