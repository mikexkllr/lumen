id: sci.motion.speed
type: concept
title: Geschwindigkeit
summary: Weg geteilt durch Zeit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wettlauf gegen die Uhr
    body: "Ob Zug oder Rad: Jede Fahrt ist Weg gegen Zeit. Zieh am Tempo und schau, wie steil die Linie wird. Erreichst du das Ziel nach 3 Stunden? Das Tempo heißt **Geschwindigkeit**."
    visual:
      widget: slider
      interactive: true
      params:
        expr: v*x
        x:
          - 0
          - 5
        y:
          - 0
          - 400
        showCoordinates: false
        sliders:
          - id: v
            label: Tempo (km/h)
            min: 20
            max: 160
            step: 10
            initial: 50
        markers:
          - x: 3
            y: 300
            label: Ziel

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie schnell bewegt sich die Erde um die Sonne – in km pro **Sekunde**?"
    params:
      min: 0
      max: 100
      unit: km/s
    answer:
      value: 30
      tolerance: 6
    explanation: Rund 30 km/s, über 100 000 km/h. Wir merken nichts, weil sich das Tempo nicht ändert.

  - kind: problem
    id: zug
    widget: numeric
    prompt: Ein Zug fährt {{d}} km in {{t}} Stunden. Wie schnell ist er im Schnitt?
    params: { unit: km/h }
    answer: { value: "{{d / t}}" }
    feedback:
      - when: "numval(state.input) == d * t"
        misconception: multiply
        text: Geschwindigkeit ist Weg geteilt durch Zeit.
    hints:
      - Wie viele Kilometer schafft er in einer Stunde?
    explanation: "{{d}} km : {{t}} h = {{d / t}} km/h."
    variants:
      params: { t: "choice[2,3,4]", v: "choice[80,90,120,150]" }
      derive: { d: "t * v" }
      defaults: { t: 2, v: 120 }

  - kind: explain
    id: s2
    body: |
      **Geschwindigkeit = Weg : Zeit.** Man misst sie in km/h oder m/s.
      **Umrechnen** geht mit 3,6 – 1 m/s sind 3,6 km/h.

  - kind: problem
    id: sprint
    widget: numeric
    prompt: Eine Sprinterin läuft 100 m in 10 Sekunden. Wie viel km/h sind das?
    params: { unit: km/h }
    answer: { value: 36 }
    feedback:
      - when: "numval(state.input) == 10"
        misconception: no-conversion
        text: 10 m/s stimmt. Rechne noch in km/h um – mal 3,6.
    hints:
      - Erst m/s, dann mal 3,6.
    explanation: "100 m : 10 s = 10 m/s. Mal 3,6 ergibt 36 km/h."

  - kind: problem
    id: diagramm
    widget: slider
    prompt: Ein Radfahrer ist nach 2 Sekunden 4 Meter weit. Stelle seine Geschwindigkeit im Weg-Zeit-Diagramm ein.
    params:
      expr: "v*x"
      x: [0, 6]
      y: [0, 6]
      sliders: [{ id: v, label: "v in m/s", min: 0, max: 3, step: 0.5, initial: 0.5 }]
      markers: [{ x: 2, y: 4, label: "2 s, 4 m" }]
      showCoordinates: false
    answer: { values: { v: 2 } }
    hints:
      - Pro Sekunde muss er 2 Meter schaffen.
    explanation: 4 m in 2 s – das sind 2 m/s.

  - kind: explain
    id: s5
    body: |
      Im **Weg-Zeit-Diagramm** ist die Steigung die Geschwindigkeit.
      Steiler heißt schneller. Waagerecht heißt – es bewegt sich nichts.

  - kind: problem
    id: waagerecht
    widget: choice
    prompt: Was zeigt eine waagerechte Linie im Weg-Zeit-Diagramm?
    params:
      options:
        - { label: Stillstand, correct: true }
        - { label: Gleichmäßige Fahrt, feedback: "Bei gleichmäßiger Fahrt steigt die Linie gleichmäßig an." }
        - { label: Sehr hohe Geschwindigkeit, feedback: "Dann wäre die Linie sehr steil." }
    hints:
      - Ändert sich der Weg, wenn die Zeit vergeht?
    explanation: Die Zeit läuft, aber der Weg bleibt gleich.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du fährst 30 Minuten mit 60 km/h und dann 30 Minuten mit 100 km/h. Wie hoch ist das Durchschnittstempo?
    params:
      unit: km/h
    answer:
      value: 80
    hints:
      - "Gesamtstrecke durch Gesamtzeit: 30 km + 50 km in 1 Stunde."
    explanation: 80 km in 1 h. Bei gleichen **Zeiten** darf man einfach mitteln.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Du radelst hin mit 30 km/h und auf demselben Weg zurück mit 60 km/h. Wie hoch ist dein Durchschnittstempo?
    params:
      options:
        - label: 40 km/h
          correct: true
        - label: 45 km/h
          feedback: Das wäre richtig, wenn du gleich **lange** gefahren wärst. Langsam warst du aber länger unterwegs.
        - label: 50 km/h
          feedback: Dafür gibt es keinen Grund. Rechne mit einer Strecke von 60 km.
    hints:
      - Nimm an, der Weg ist 60 km lang. Wie lange dauert jede Richtung?
      - "Gesamtweg : Gesamtzeit."
    explanation: "Hin 2 h, zurück 1 h: 120 km in 3 h ergibt 40 km/h. Das Mittel der Tempos stimmt nur bei gleichen Zeiten."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "Ein Auto beschleunigt gleichmäßig in 10 s von 0 auf 20 m/s. Wie viele Meter fährt es dabei? Tipp: Der Weg ist die Fläche unter der Linie im Geschwindigkeit-Zeit-Diagramm."
    params:
      unit: m
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 200
        misconception: triangle-area
        text: Das wäre ein Rechteck – als wäre es die ganze Zeit 20 m/s gefahren. Die Fläche ist ein Dreieck.
    hints:
      - Die Linie steigt von 0 auf 20. Welche Form hat die Fläche darunter?
      - "Dreieck: ½ · 10 s · 20 m/s."
    explanation: ½ · 10 · 20 = 100 m. Genauso viel wie 10 s lang mit dem Mittelwert 10 m/s.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: Du fährst 120 km/h, ein LKW vor dir 80 km/h. Dein Auto ist 200 m hinter ihm. Nach wie vielen Sekunden bist du gleichauf?
    params:
      unit: s
    answer:
      value: 18
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 6) < 0.3
        misconception: relative-speed
        text: "Es zählt nur der **Unterschied** der Tempos: 40 km/h."
    hints:
      - Wie schnell holst du auf?
      - 40 km/h sind etwa 11,1 m/s.
    explanation: "Du holst mit 40 km/h ≈ 11,1 m/s auf. 200 m : 11,1 m/s ≈ 18 s. Darum dauert Überholen auf der Landstraße so lange."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Zwei Züge fahren aufeinander zu, 300 km voneinander entfernt, mit 80 und 120 km/h. Nach wie vielen Stunden treffen sie sich?
    params:
      unit: h
    answer:
      value: 1.5
    hints:
      - Der Abstand schrumpft mit 80 + 120 km/h.
    explanation: "300 : 200 = 1,5 h. Das ist die **Relativgeschwindigkeit**."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Die **Momentangeschwindigkeit** ist die Steigung der Weg-Zeit-Kurve in einem einzigen Punkt. Mathematisch ist das die Ableitung $v = \frac{ds}{dt}$. Ein Tacho zeigt genau diese Zahl.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Ein Stein fällt nach dem Gesetz s = 5t². Wie schnell ist er nach {{t}} Sekunden – in m/s? Leite ab.
    params:
      unit: m/s
    answer:
      value: "{{10 * t}}"
    feedback:
      - when: numval(state.input) == 5 * t * t
        misconception: position-not-velocity
        text: Das ist der **Weg** nach {{t}} s, nicht das Tempo.
      - when: numval(state.input) == 5 * t
        misconception: derivative-factor
        text: Beim Ableiten von t² kommt der Faktor 2 nach vorn.
    hints:
      - Die Ableitung von t² ist 2t.
      - v = 5 · 2t = 10t.
    explanation: v = 10t = {{10 * t}} m/s. Das Tempo wächst jede Sekunde um 10 m/s – das ist g.
    difficulty: 3
    variants:
      params:
        t: int[3,6]
      defaults:
        t: 3

srs:
  cards_from: [zug, sprint]
