id: sci.motion.momentum
type: concept
title: "Momentum and collisions"
summary: "Why heavy things are hard to stop – and what stays the same in every collision."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: A table tennis ball and a bowling ball roll towards you at the same speed. Which is harder to stop?
    params:
      options:
        - label: The bowling ball
          correct: true
        - label: The table tennis ball
          feedback: It has far less mass.
        - label: Both the same
          feedback: The speed is equal, the mass is not.
    hints:
      - Which would you rather catch by hand?
    explanation: Speed alone does not tell everything. Mass matters too.

  - kind: explain
    id: c2
    body: "**Momentum** is mass times velocity: p = m · v. It measures how much punch a motion carries. And it has a direction."

  - kind: problem
    id: c3
    widget: numeric
    prompt: A 60 kg runner runs at 5 m/s. What is their momentum?
    params:
      unit: kg·m/s
    answer:
      value: 300
    hints:
      - Mass times speed.
    explanation: 60 · 5 = 300 kg·m/s.

  - kind: problem
    id: c4
    widget: numeric
    prompt: A 1200 kg car rolls at 2 m/s. How fast would an 80 kg cyclist have to ride to have the same momentum?
    params:
      unit: m/s
    answer:
      value: 30
    hints:
      - "Momentum of the car: 2400. Divide by 80."
    explanation: 2400 ÷ 80 = 30 m/s – that is 108 km/h.

  - kind: explain
    id: c5
    body: In every collision the **total momentum** stays the same. What one loses the other gains. That holds for billiards, cars and stars.

  - kind: problem
    id: c6
    widget: numeric
    prompt: A 2 kg cart runs at 3 m/s into a resting 1 kg cart. They couple. How fast do they move afterwards?
    params:
      unit: m/s
    answer:
      value: 2
    hints:
      - "Momentum before: 2 · 3 = 6. Mass afterwards: 3 kg."
    explanation: 6 ÷ 3 = 2 m/s. The momentum is shared by more mass.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A 50 kg skater stands still and throws a 5 kg ball forwards at 4 m/s. At what speed does she roll backwards?
    params:
      unit: m/s
    answer:
      value: 0.4
    hints:
      - Before, the momentum was zero. So it must be zero afterwards too.
    explanation: 5 · 4 = 20 forwards, so 20 ÷ 50 = 0.4 m/s backwards. That is recoil.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Why does a car have a crumple zone?
    params:
      options:
        - label: It lengthens the time of the impact – so the force gets smaller
          correct: true
        - label: It makes the car lighter
          feedback: It is about time, not weight.
        - label: It reduces the momentum before the impact
          feedback: That depends only on mass and speed.
    hints:
      - Force times time is the change of momentum.
    explanation: The same change of momentum over ten times the time needs only a tenth of the force. Airbags do the same.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A foot hits a 0.4 kg ball. After 0.01 s the ball flies at 25 m/s. What was the mean force in newtons?
    params:
      unit: N
    answer:
      value: 1000
    hints:
      - "Change of momentum: 0.4 · 25 = 10. Divide by the time."
    explanation: 10 ÷ 0.01 = 1000 N – as much as the weight of 100 kg, but very briefly.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Two equal carts collide head-on at the same speed and stick together. The total momentum was zero. Where did the kinetic energy go?
    params:
      options:
        - label: Into deformation and heat
          correct: true
        - label: It has vanished
          feedback: Energy never vanishes.
        - label: It is still in the momentum
          feedback: The momentum was zero all along.
    hints:
      - Look at a car after a crash.
    explanation: Momentum is conserved in every collision. Kinetic energy only in a perfectly elastic one.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: In empty space there is nothing to push against. How does a rocket speed up anyway?
    params:
      options:
        - label: It throws gas backwards and gets forward momentum in return
          correct: true
        - label: It pushes against the vacuum
          feedback: There is nothing in a vacuum.
        - label: It does not
          feedback: Rockets speed up very well in space.
    hints:
      - Think of the skater with the ball.
    explanation: Recoil. The faster the gas leaves at the back, the more thrust.
    difficulty: 3

srs:
  cards_from: ["c3", "c6", "d1"]
