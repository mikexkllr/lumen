id: sci.motion.lever
type: concept
title: "Hebel und Drehmoment"
summary: "Mit wenig Kraft viel bewegen – und was man dafür zahlt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: Eine schwere Tür klemmt. Wo drückst du, damit sie am leichtesten aufgeht?
    params:
      options:
        - label: Weit weg vom Scharnier
          correct: true
        - label: Direkt am Scharnier
          feedback: Dort brauchst du enorm viel Kraft.
        - label: Egal wo
          feedback: Probier es an einer Tür aus.
    hints:
      - Wo sitzt der Türgriff?
    explanation: Je weiter vom Drehpunkt, desto stärker wirkt deine Kraft.

  - kind: explain
    id: c2
    body: Das **Drehmoment** ist Kraft mal Abstand vom Drehpunkt. Ein langer Hebel macht aus kleiner Kraft eine große Wirkung. Im Gleichgewicht sind beide Drehmomente gleich.

  - kind: problem
    id: c3
    widget: sim
    prompt: Links liegen 4 kg im Abstand 2 m. Rechts hast du nur 2 kg. Schieb sie so weit hinaus, dass die Wippe im Gleichgewicht ist.
    params:
      scene: lever
      controls:
        m1:
          fixed: true
        d1:
          fixed: true
        m2:
          fixed: true
    answer:
      tilt: 0
    explanation: "Bei 4 m: 2 · 4 = 4 · 2. Halbe Masse braucht doppelten Abstand."

  - kind: problem
    id: c4
    widget: numeric
    prompt: Ein Kind mit 30 kg sitzt 2 m vom Drehpunkt der Wippe. Wie weit vom Drehpunkt muss ein Erwachsener mit 60 kg sitzen?
    params:
      unit: m
    answer:
      value: 1
    hints:
      - 30 · 2 = 60 · ?
    explanation: "60 : 60 = 1 m. Doppelte Masse, halber Abstand."

  - kind: problem
    id: c5
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein längerer Schraubenschlüssel löst feste Muttern leichter.
          right: true
        - text: Mit einem Hebel spart man Arbeit.
          right: false
          why: Man spart Kraft – und zahlt mit einem längeren Weg.
        - text: Eine Schere schneidet nah am Gelenk am kräftigsten.
          right: true
        - text: Der Türgriff sitzt nur zufällig weit weg vom Scharnier.
          right: false
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Rechts hängen 6 kg im Abstand 2 m. Links ist der Abstand fest: 3 m. Welche Masse hält die Waage im Gleichgewicht?"
    params:
      scene: lever
      controls:
        m1:
          value: 1
        d1:
          value: 3
          fixed: true
        m2:
          value: 6
          fixed: true
        d2:
          value: 2
          fixed: true
    answer:
      tilt: 0
    explanation: "6 · 2 = 12, also 12 : 3 = 4 kg."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Mit einer Brechstange hebst du einen Stein von 200 kg. Der Stein liegt 0,2 m vom Drehpunkt, du drückst 2 m entfernt. Wie viel Kilogramm musst du »drücken«?
    params:
      unit: kg
    answer:
      value: 20
    hints:
      - 200 · 0,2 = ? · 2.
    explanation: "40 : 2 = 20 kg. Der Hebel verzehnfacht deine Kraft."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Die goldene Regel: Was man an Kraft spart, zahlt man an Weg. Du hebst den Stein um 5 cm an. Wie weit musst du dein Ende herunterdrücken?"
    params:
      unit: cm
    answer:
      value: 50
    hints:
      - Dein Hebelarm ist zehnmal so lang.
    explanation: Zehnmal so weit. Die Arbeit – Kraft mal Weg – bleibt gleich.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Dein Unterarm ist ein Hebel. Der Bizeps setzt 4 cm vom Ellbogen an, die Hand ist 32 cm entfernt. Du hältst 5 kg. Wie viel Kilogramm muss der Muskel halten?
    params:
      unit: kg
    answer:
      value: 40
    hints:
      - 5 · 32 = ? · 4.
    explanation: "160 : 4 = 40 kg – das Achtfache. Hier arbeitet der Hebel gegen dich."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Warum ist der Arm so »ungünstig« gebaut?
    params:
      options:
        - label: Eine kleine Muskelbewegung wird zu einer großen, schnellen Handbewegung
          correct: true
        - label: Ein Fehler der Natur
          feedback: Der Bau hat einen klaren Vorteil.
        - label: Damit Muskeln stark werden
          feedback: Es geht um Reichweite und Tempo.
    hints:
      - Was man an Kraft zahlt, gewinnt man an Weg.
    explanation: Der Arm tauscht Kraft gegen Tempo. Darum kannst du werfen.
    difficulty: 3

srs:
  cards_from: ["c4", "d2"]
