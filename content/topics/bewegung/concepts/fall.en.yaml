id: sci.motion.fall
type: concept
title: Falling and throwing
summary: Everything falls at the same rate – along a parabola.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The perfect arc
    body: "Basketball or a jet of water: anything that flies draws an arc. Turn the angle and speed and look at the **trajectory**. How high does the ball climb, how far does it fly?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: projectile

  - kind: problem
    id: gleich
    widget: choice
    prompt: A bowling ball and a tennis ball are dropped together without air. Which lands first?
    params:
      options:
        - { label: They land at the same time., correct: true }
        - { label: The bowling ball, feedback: "Heavier feels faster. But without air, everything falls the same." }
        - { label: The tennis ball, feedback: "Lighter does not mean faster." }
    hints:
      - On the Moon, a hammer and a feather fell at the same rate.
    explanation: Without air resistance, all objects fall at the same rate.

  - kind: explain
    id: s2
    body: |
      Without **air**, all objects fall at the same rate.
      After t seconds, a stone has fallen about **5 · t²** meters.

  - kind: problem
    id: tiefe
    widget: numeric
    prompt: A stone falls for {{t}} seconds. About how far does it fall? Use 5 · t².
    params: { unit: m }
    answer: { value: "{{5 * t * t}}" }
    feedback:
      - when: "numval(state.input) == 5 * t"
        misconception: linear-fall
        text: The time is squared. First calculate {{t}} · {{t}}.
    hints:
      - "{{t}} · {{t}} = {{t * t}}. Then times 5."
    explanation: "5 · {{t}}² = {{5 * t * t}} m."
    variants:
      params: { t: "int[2,6]" }
      defaults: { t: 3 }

  - kind: problem
    id: wurf
    widget: slider
    prompt: Set the throwing force so the ball lands exactly in the basket.
    params:
      expr: "k*x*(8 - x)/8"
      x: [0, 10]
      y: [0, 6]
      sliders: [{ id: k, label: Force, min: 0.5, max: 3, step: 0.25, initial: 1 }]
      markers: [{ x: 6, y: 3, label: Basket }]
      showCoordinates: false
    answer: { values: { k: 2 } }
    hints:
      - At x = 6, the path must be at height 3.
    explanation: With force 2, the parabola hits the basket.

  - kind: explain
    id: s5
    body: Why does a thrown ball fly along a parabola?
    reveal:
      body: Sideways, it keeps a steady speed. Gravity pulls it down faster and faster. Together, the path is a parabola.

  - kind: problem
    id: c1
    widget: sim
    prompt: Shoot the ball exactly at the target at 30 m.
    params:
      scene: projectile
      target:
        range: 30
      show:
        - range
        - time
    answer:
      range:
        - 28.5
        - 31.5
    explanation: Angle and speed together determine the range.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Same range, different path: hit 30 m with an angle of **at least 60°**."
    params:
      scene: projectile
      target:
        range: 30
      show:
        - range
        - height
        - time
    answer:
      range:
        - 28.5
        - 31.5
      angle:
        - 60
        - 85
    explanation: "Steep and flat throws can fly equally far: α and 90° − α give the same range."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A stone falls for 3 seconds. How fast is it then? The speed grows by 10 m/s every second.
    params:
      unit: m/s
    answer:
      value: 30
    hints:
      - 3 · 10.
    explanation: 30 m/s – that is 108 km/h.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: You drop a stone into a well. After 2 seconds you hear it hit the bottom. Roughly how deep is the well? Use 5 · t² and ignore the sound delay.
    params:
      unit: m
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 10
        misconception: not-squared
        text: That would be 5 · t. The time is squared.
    hints:
      - Put t = 2 into 5 · t².
      - 5 · 2 · 2 = ?
    explanation: 5 · 2² = 20 m. Sound needs only 0.06 s for 20 m – fine to ignore here.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: A ball is fired horizontally. At the same moment a second one is dropped from the same height. Which reaches the ground first?
    params:
      options:
        - label: Both at the same time.
          correct: true
        - label: The dropped one.
          feedback: The sideways speed does not change the downward fall.
        - label: The fired one.
          feedback: It is faster, but only sideways. Downwards it falls just the same.
    hints:
      - Horizontal and vertical motion are independent.
      - The same gravity pulls both downwards.
    explanation: Both fall vertically in exactly the same way. One just moves farther sideways meanwhile. That is why the path is a parabola.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: sim
    prompt: You always throw at 20 m/s. Find the angle at which the ball flies farthest.
    params:
      scene: projectile
      controls:
        speed:
          value: 20
          fixed: true
    answer:
      angle: 45
    explanation: At 45° it flies 40.8 m. 30° and 60° give the same, shorter range – the angles add up to 90°.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: On the Moon gravity is only 1.6 m/s². Set it and hit a flag at 80 m.
    params:
      scene: projectile
      target:
        range: 80
      controls:
        g:
          fixed: false
          value: 9.8
          min: 1.6
          max: 9.8
          step: 0.1
        speed:
          max: 20
      show:
        - range
        - time
    answer:
      range:
        - 77
        - 83
      g: 1.6
    explanation: With one sixth of the gravity the same throw flies six times as far.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: The flight time is $t = \frac{2 v \sin\alpha}{g}$. Horizontally the ball moves at $v\cos\alpha$. So the **range** is $x = \frac{v^2 \sin 2\alpha}{g}$. It is largest when $2\alpha = 90°$.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Now with air resistance. Is the best throwing angle then above or below 45°?
    params:
      options:
        - label: Below – the air brakes more on a long, high flight.
          correct: true
        - label: Above – higher means farther.
          feedback: High throws stay in the air longer and lose more speed.
        - label: Exactly 45° – air changes nothing.
          feedback: Air brakes a lot. A football only reaches a fraction of the calculated range.
    hints:
      - Which throw stays in the air longer?
      - The longer the flight, the more the air slows it.
    explanation: Air eats speed mainly on long flights. Flatter throws lose less. Javelin throwers and golfers use angles well below 45°.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: numeric
    prompt: A skydiver gets no faster than about 200 km/h (55.6 m/s) – air drag balances his weight. After how many seconds would he reach that without air? g = 10 m/s².
    params:
      unit: s
    answer:
      value: 5.56
      tolerance: 0.1
    hints:
      - Without air the speed grows by 10 m/s every second.
      - 55.6 ÷ 10 = ?
    explanation: "After just over 5.5 s. With air it takes longer, because drag grows with speed. In the end both forces cancel: the **terminal velocity**."
    difficulty: 3

srs:
  cards_from: [tiefe, gleich]
