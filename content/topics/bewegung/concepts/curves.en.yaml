id: sci.motion.curves
type: concept
title: Curves and circles
summary: Why going too fast in a curve is dangerous.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A push for the satellite
    body: "A satellite keeps falling around the Earth. Turn the orbit radius and **speed**: too slow and it crashes, too fast and it flies away. What happens in between?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: orbit

  - kind: problem
    id: hook
    widget: choice
    prompt: You whirl a ball on a string in a circle and let go. Where does it fly?
    params:
      options:
        - label: Straight on
          correct: true
        - label: On in the circle
          feedback: Without the string nothing keeps it on the circle.
        - label: Directly away from the centre
          feedback: It flies in the direction it was just moving.
    hints:
      - What kept it on the circle so far?
    explanation: Without a force towards the centre it goes straight on.

  - kind: explain
    id: s1
    body: |
      Moving in a circle takes a force toward the **center**. Without it, you keep going straight. In a car, the tires provide it.

  - kind: problem
    id: wer
    widget: match
    prompt: Which force keeps it on its circular path?
    params:
      pairs:
        - { left: Car in a curve, right: Friction of the tires }
        - { left: Moon around the Earth, right: Gravity }
        - { left: Chain swing ride, right: Pull of the chains }
    hints:
      - What pulls or pushes toward the center in each case?
    explanation: Something always pulls inward – otherwise the object would go straight on.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: The required force grows with the square of the speed. You enter the curve {{k}} times as fast. How many times more force do you need?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: The speed counts squared.
    hints:
      - "{{k}} · {{k}}."
    explanation: "{{k}}² = {{k * k}}. That is why even small speeding in curves is dangerous."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: radius
    widget: choice
    prompt: Same speed, but a curve with twice the radius. How much force do you need?
    params:
      options:
        - { label: Half as much, correct: true }
        - { label: Twice as much, feedback: "A wide curve is gentler, not sharper." }
        - { label: The same, feedback: "The radius matters." }
    hints:
      - Is a wide curve easier or harder to drive?
    explanation: The force is inversely proportional to the radius. That is why highways have wide curves.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The centripetal force is $F = \frac{m v^2}{r}$. A 1000 kg car takes a bend of radius 100 m at 20 m/s. How large is the force?
    params:
      unit: N
    answer:
      value: 4000
    hints:
      - 1000 · 400 ÷ 100.
    explanation: 4000 N – that is how much the tyres must hold sideways.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: A satellite orbits at a distance of 4 Earth radii. Find the speed for a round circular orbit.
    params:
      scene: orbit
      controls:
        radius:
          value: 4
          fixed: true
        speed:
          value: 2
    answer:
      ecc:
        - 0
        - 0.03
    explanation: About 4 km/s. Further out the Earth pulls less, so the circular orbit is slower.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: The tyres hold at most 8 m/s² sideways. How fast may a car go round a bend with a 50 m radius – in m/s?
    params:
      unit: m/s
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 400
        misconception: forgot-root
        text: That is v². Take the square root.
    hints:
      - We have a = v² ÷ r. Solve for v.
      - v = √(a · r) = √(8 · 50).
    explanation: √400 = 20 m/s, that is 72 km/h. On a wet road the tyres hold less – then the limit is a much lower speed.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: In a fast bend you feel pushed outwards. What is really happening?
    params:
      options:
        - label: Your body wants to carry straight on – seat and door push you inwards.
          correct: true
        - label: A force pulls you outwards.
          feedback: Nothing pulls from outside. It only seems so from inside the car.
        - label: The bend repels you.
          feedback: The road pushes the tyres inwards, not you outwards.
    hints:
      - What does a body do without a force?
      - What would happen if the door suddenly vanished?
    explanation: The »centrifugal force« is a fictitious force seen from the rotating car. Seen from outside there is only the force towards the centre. Without it you fly straight on.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do astronauts float in the space station?
    params:
      options:
        - label: They are constantly falling around the Earth – together with the station
          correct: true
        - label: Because there is no gravity there
          feedback: At 400 km altitude it is still 90% as strong as on the ground.
        - label: Because centrifugal force pushes them outward
          feedback: There is only gravity – it supplies exactly the needed centripetal force.
    hints:
      - What do you feel in a freely falling lift?
    explanation: Free fall feels weightless. The station is so fast that it keeps “missing” the Earth.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a car in a bend need a force towards the centre?"
    params:
      keywords:
        - - gerade
          - geradeaus
          - straight
        - - richtung
          - direction
          - ablenk
          - turn
          - change
        - - reifen
          - reibung
          - tyre
          - tire
          - friction
          - kraft
          - force
      sample: Without a force the car would keep going straight. To change direction a force towards the centre must act – the friction of the tyres.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: In the time Δt the velocity arrow turns through the angle v · Δt ÷ r. So it changes by v · v · Δt ÷ r. Per unit time that gives the **centripetal acceleration** a = v² ÷ r.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A loop has a 10 m radius. How fast must the car be at least at the very top so it does not fall? g = 10 m/s². In m/s.
    params:
      unit: m/s
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 0
        misconception: zero-top-speed
        text: At zero speed it would simply fall. At the top gravity must just be enough as the centripetal force.
    hints:
      - At the top the centre is below. Gravity supplies the needed force.
      - g = v² ÷ r, so v = √(g · r).
    explanation: v = √(10 · 10) = 10 m/s. Any slower and gravity is more than needed – the car falls out of the loop.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: estimate
    prompt: "Take a guess: how fast does Earth's rotation carry you through space in Germany (50° north) – in km/h?"
    params:
      min: 0
      max: 3000
    answer:
      value: 1070
      tolerance: 200
    explanation: "The circle of latitude is 40,000 km · cos 50° ≈ 25,700 km long. Once around per day: about 1070 km/h. You feel nothing because the speed does not change."
    difficulty: 3

srs:
  cards_from: [quadrat, radius]
