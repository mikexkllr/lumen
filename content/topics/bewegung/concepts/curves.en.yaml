id: sci.motion.curves
type: concept
title: Curves and circles
summary: Why going too fast in a curve is dangerous.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You whirl a ball on a string in a circle and let go. Where does it fly?
    params:
      options:
        - label: Straight on
          correct: true
        - label: On in the circle
          feedback: Without the string nothing keeps it on the circle.
        - label: Directly away from the centre
          feedback: It flies in the direction it was just moving.
    hints:
      - What kept it on the circle so far?
    explanation: Without a force towards the centre it goes straight on.


  - kind: explain
    id: s1
    body: |
      Moving in a circle takes a force toward the **center**. Without it, you keep going straight. In a car, the tires provide it.

  - kind: problem
    id: wer
    widget: match
    prompt: Which force keeps it on its circular path?
    params:
      pairs:
        - { left: Car in a curve, right: Friction of the tires }
        - { left: Moon around the Earth, right: Gravity }
        - { left: Chain swing ride, right: Pull of the chains }
    hints:
      - What pulls or pushes toward the center in each case?
    explanation: Something always pulls inward – otherwise the object would go straight on.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: The required force grows with the square of the speed. You enter the curve {{k}} times as fast. How many times more force do you need?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: The speed counts squared.
    hints:
      - "{{k}} · {{k}}."
    explanation: "{{k}}² = {{k * k}}. That is why even small speeding in curves is dangerous."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: radius
    widget: choice
    prompt: Same speed, but a curve with twice the radius. How much force do you need?
    params:
      options:
        - { label: Half as much, correct: true }
        - { label: Twice as much, feedback: "A wide curve is gentler, not sharper." }
        - { label: The same, feedback: "The radius matters." }
    hints:
      - Is a wide curve easier or harder to drive?
    explanation: The force is inversely proportional to the radius. That is why highways have wide curves.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The centripetal force is $F = \frac{m v^2}{r}$. A 1000 kg car takes a bend of radius 100 m at 20 m/s. How large is the force?
    params:
      unit: N
    answer:
      value: 4000
    hints:
      - 1000 · 400 ÷ 100.
    explanation: 4000 N – that is how much the tyres must hold sideways.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do astronauts float in the space station?
    params:
      options:
        - label: They are constantly falling around the Earth – together with the station
          correct: true
        - label: Because there is no gravity there
          feedback: At 400 km altitude it is still 90% as strong as on the ground.
        - label: Because centrifugal force pushes them outward
          feedback: There is only gravity – it supplies exactly the needed centripetal force.
    hints:
      - What do you feel in a freely falling lift?
    explanation: Free fall feels weightless. The station is so fast that it keeps “missing” the Earth.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a car in a bend need a force towards the centre?"
    params:
      keywords:
        - - gerade
          - geradeaus
          - straight
        - - richtung
          - direction
          - ablenk
          - turn
          - change
        - - reifen
          - reibung
          - tyre
          - tire
          - friction
          - kraft
          - force
      sample: Without a force the car would keep going straight. To change direction a force towards the centre must act – the friction of the tyres.
    difficulty: 3

srs:
  cards_from: [quadrat, radius]
