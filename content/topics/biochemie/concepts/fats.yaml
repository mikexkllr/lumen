id: chem.biochem.fats
type: concept
title: "Fette und Öle"
summary: "Ester aus Glycerin und Fettsäuren – fest, flüssig, ranzig."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Butter ist bei Raumtemperatur fest, Olivenöl flüssig. Beides sind Fette. Woran liegt der Unterschied?
    params:
      options:
        - label: Öl hat mehr Doppelbindungen – die Ketten knicken ab und packen sich lockerer
          correct: true
        - label: Öl enthält Wasser
          feedback: Reines Öl ist wasserfrei.
        - label: Butter ist schwerer
          feedback: Beide haben ähnliche Massen.
    hints:
      - Gerade Ketten liegen eng wie Spaghetti in der Packung.
      - Eine cis-Doppelbindung macht einen Knick.
    explanation: Geknickte Ketten haften schlechter aneinander – das Fett schmilzt früher. Pflanzenöle sind meist reich an Doppelbindungen.

  - kind: explain
    id: c1
    body: "Ein Fettmolekül ist ein **Triglycerid**: Ein Glycerin mit drei OH-Gruppen bildet mit drei Fettsäuren drei Esterbindungen. Fettsäuren sind lange Ketten mit einer COOH-Gruppe am Ende."

  - kind: problem
    id: c2
    widget: numeric
    prompt: Ein Glycerin verbindet sich mit drei Fettsäuren zu einem Fett. Wie viele Wassermoleküle werden dabei frei?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 1
        misconception: one-bond
        text: Jede der drei Esterbindungen gibt ein Wasser ab.
    hints:
      - Bei jeder Esterbildung entsteht Wasser.
      - Es gibt drei Esterbindungen.
    explanation: Drei Wasser. Glycerin + 3 Fettsäuren → Triglycerid + 3 H₂O.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Gesättigt oder ungesättigt?
    params:
      buckets:
        - id: b1
          label: gesättigt (keine C=C)
        - id: b2
          label: ungesättigt (mit C=C)
      items:
        - label: Stearinsäure (Rindertalg)
          bucket: b1
        - label: Palmitinsäure (Palmfett)
          bucket: b1
        - label: Ölsäure (Olivenöl)
          bucket: b2
        - label: Linolsäure (Sonnenblumenöl)
          bucket: b2
    hints:
      - "Gesättigt heißt: so viel H wie möglich."
      - Feste tierische Fette sind meist gesättigt.
    explanation: Ölsäure hat eine, Linolsäure zwei Doppelbindungen. Linolsäure muss der Körper mit der Nahrung bekommen.

  - kind: problem
    id: c4
    widget: choice
    prompt: Ein Fettfleck geht mit Wasser allein nicht raus. Warum?
    params:
      options:
        - label: Fett besteht fast nur aus unpolaren Kohlenwasserstoff-Ketten
          correct: true
        - label: Fett ist schwerer als Wasser
          feedback: Fett schwimmt sogar auf Wasser.
        - label: Wasser ist zu kalt
          feedback: Auch heißes Wasser allein löst Fett kaum.
    hints:
      - Gleiches löst Gleiches.
      - Die drei Esterbindungen sind winzig neben den langen Ketten.
    explanation: Erst Seife oder Spülmittel verbinden Fett und Wasser.

  - kind: explain
    id: d1
    depth: 2
    body: "Kocht man Fett mit Natronlauge, werden die Esterbindungen gespalten. Es entstehen Glycerin und die Natriumsalze der Fettsäuren: Seife. Das ist die **Verseifung**."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Fett liefert etwa 37 kJ pro Gramm. Wie viel Energie stecken in {{m}} g Fett?
    params:
      unit: kJ
    answer:
      value: "{{37 * m}}"
    hints:
      - Energie = Masse · 37 kJ/g.
      - Rechne {{m}} · 37.
    explanation: "{{m}} · 37 = {{37 * m}} kJ. Für dieselbe Energie bräuchte man gut doppelt so viel Zucker."
    difficulty: 2
    variants:
      params:
        m: step[5,50,5]
      defaults:
        m: 20

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Fett liefert pro Gramm mehr als doppelt so viel Energie wie Zucker. Was ist der chemische Grund?
    params:
      options:
        - label: Fettketten bestehen fast nur aus CH₂ – ihr Kohlenstoff ist kaum oxidiert
          correct: true
        - label: Fett ist wärmer
          feedback: Die Temperatur spielt keine Rolle.
        - label: Fett enthält mehr Sauerstoff
          feedback: Es enthält viel weniger.
    hints:
      - Im Zucker hängt an jedem C schon ein O.
      - Je weniger oxidiert, desto mehr Energie bei der Verbrennung.
    explanation: Zucker ist »halb verbrannt«, Fett fast gar nicht. Darum speichert der Körper Vorräte als Fett.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: Linolsäure hat zwei C=C-Doppelbindungen. Wie viele Br₂-Moleküle lagert ein Molekül Linolsäure an?
    answer:
      value: 2
    hints:
      - Brom addiert an jede Doppelbindung.
      - Ein Br₂ pro C=C.
    explanation: "Zwei Br₂. So misst man im Labor, wie ungesättigt ein Fett ist: Braunes Brom wird farblos."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei der Fetthärtung lagert man mit Nickel als Katalysator Wasserstoff an Pflanzenöl an. Was ist dabei das Problem, wenn man nur teilweise härtet?
    params:
      options:
        - label: Es entstehen trans-Fettsäuren, die dem Herzen schaden
          correct: true
        - label: Das Fett wird radioaktiv
          feedback: Nickel als Katalysator macht nichts radioaktiv.
        - label: Es entsteht Benzin
          feedback: Die Ketten bleiben Fettsäuren.
    hints:
      - Am Katalysator können Doppelbindungen kurz aufgehen und anders wieder zugehen.
      - cis wird dabei teilweise zu trans.
    explanation: Trans-Fette sind gerade wie gesättigte Fette und erhöhen das schlechte Cholesterin. In der EU sind sie seit 2021 streng begrenzt.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Öl wird mit der Zeit ranzig und riecht unangenehm. Was passiert chemisch?
    params:
      options:
        - label: Sauerstoff greift die Doppelbindungen über Radikale an, die Ketten zerfallen in riechende Bruchstücke
          correct: true
        - label: Das Öl verdunstet
          feedback: Die Menge bleibt fast gleich.
        - label: Es wird zu Zucker
          feedback: Zucker entsteht dabei nicht.
    hints:
      - Licht und Wärme beschleunigen es.
      - Vitamin E schützt als Antioxidans.
    explanation: Antioxidantien fangen die Radikale ab und stoppen die Kettenreaktion. Darum steht Öl am besten dunkel und kühl.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: Tristearin, das Fett aus drei Stearinsäuren, hat die Formel C₅₇H₁₁₀O₆. Welche molare Masse hat es? (C = 12, H = 1, O = 16)
    params:
      unit: g/mol
    answer:
      value: 890
    hints:
      - 57 · 12 + 110 · 1 + 6 · 16.
      - 684 + 110 + 96.
    explanation: 890 g/mol. Nur 6 von 173 Atomen sind Sauerstoff – darum ist Fett so energiereich und so unpolar.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Fettmolekül aufgebaut ist und warum manche Fette flüssig sind.
    params:
      keywords:
        - - glycerin
          - glycerol
        - - fettsäure
          - fatty acid
        - - ester
        - - doppelbind
          - double bond
          - knick
          - kink
          - ungesättigt
          - unsaturated
      sample: Ein Fett ist ein Ester aus Glycerin und drei Fettsäuren. Haben die Fettsäuren Doppelbindungen, sind sie ungesättigt und geknickt. Dann liegen die Ketten locker, und das Fett ist bei Raumtemperatur ein flüssiges Öl.
    explanation: "Aufbau: Glycerin plus drei Fettsäuren. Zustand: Knicke durch Doppelbindungen."
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x3"]
