id: chem.biochem.carbs
type: concept
title: "Carbohydrates"
summary: "From glucose to starch and cellulose."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many grams of sugar are in one litre of cola?"
    params:
      min: 0
      max: 300
      unit: g
    answer:
      value: 106
      tolerance: 20
    explanation: About 106 g – roughly 35 sugar cubes. The phosphoric acid makes it so sour that it does not taste sickly sweet.

  - kind: explain
    id: c1
    body: Glucose C₆H₁₂O₆ is a **monosaccharide**, a simple sugar. It carries five OH groups. Simple sugars are the building blocks of all larger carbohydrates.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Simple, double or many-unit sugar?
    params:
      buckets:
        - id: b1
          label: Monosaccharide
        - id: b2
          label: Disaccharide
        - id: b3
          label: Polysaccharide
      items:
        - label: Grape sugar (glucose)
          bucket: b1
        - label: Fruit sugar (fructose)
          bucket: b1
        - label: Table sugar (sucrose)
          bucket: b2
        - label: Milk sugar (lactose)
          bucket: b2
        - label: Starch
          bucket: b3
        - label: Cellulose
          bucket: b3
    hints:
      - Table sugar is made of glucose and fructose.
      - Starch and cellulose are long chains of glucose.
    explanation: "Mono-, di-, poly-: one, two, many units. Polysaccharides do not taste sweet."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Two simple sugars C₆H₁₂O₆ join to form sucrose. One water molecule is released. How many H atoms does sucrose have?
    answer:
      value: 22
    feedback:
      - when: numval(state.input) == 24
        misconception: condensation-ignored
        text: The water takes two H with it.
    hints:
      - Two sugars together have 24 H.
      - H₂O contains 2 H.
    explanation: "C₁₂H₂₂O₁₁: 24 − 2 = 22 H and 12 − 1 = 11 O. A link like this, releasing water, is called a condensation."

  - kind: problem
    id: c4
    widget: choice
    prompt: Why does sugar dissolve so well in water but candle wax does not?
    params:
      options:
        - label: Its many OH groups form hydrogen bonds with water
          correct: true
        - label: Sugar is a salt
          feedback: Sugar does not split into ions.
        - label: Sugar is lighter
          feedback: This has nothing to do with mass.
    hints:
      - Like dissolves like.
      - OH groups are polar like water.
    explanation: Wax is made of non-polar CH chains; sugar is covered in OH. That is why 200 g of sugar dissolves in 100 g of water.

  - kind: explain
    id: d1
    depth: 2
    body: Sugars link up via an O atom, releasing water. This is the **glycosidic bond**. Whether it points down (α) or up (β) turns glucose into starch or cellulose.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: One glucose unit in starch weighs 162 g/mol. A starch molecule has {{162 * n}} g/mol. How many units does it have?
    answer:
      value: "{{n}}"
    feedback:
      - when: abs(numval(state.input) - 162 * n / 180) < 1
        misconception: monomer-mass
        text: "In the chain each unit has lost a water: 180 − 18 = 162."
    hints:
      - Divide the molecule's mass by the mass of one unit.
      - Work out {{162 * n}} ÷ 162.
    explanation: "{{n}} units. Free glucose weighs 180 g/mol – in the chain each unit has given up one water."
    difficulty: 2
    variants:
      params:
        n: step[500,5000,500]
      defaults:
        n: 1000

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Put iodine solution on a potato slice and it turns blue-black. What does that show?
    params:
      options:
        - label: Starch – iodine slips into its helical chains
          correct: true
        - label: Sugar
          feedback: Simple sugars do not colour with iodine.
        - label: Fat
          feedback: Fat is spotted by a greasy mark on paper.
    hints:
      - The starch chain is twisted into a spiral.
      - Iodine fits exactly into that spiral.
    explanation: The iodine–starch test is a classic. Chew bread and the colour disappears – saliva splits the starch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Sucrose (342 g/mol) is split with water into glucose and fructose. How many grams of simple sugar form from 342 g of sucrose?
    params:
      unit: g
    answer:
      value: 360
    feedback:
      - when: numval(state.input) == 342
        misconception: hydrolysis-mass
        text: The water is built in – the mass grows.
    hints:
      - "Splitting with water is hydrolysis: one H₂O is added."
      - 342 + 18.
    explanation: 342 + 18 = 360 g, which is 2 · 180 g. This is how invert sugar for honey substitutes and fondant is made.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Cows digest grass, we do not. Both involve cellulose made of glucose. What makes the difference?
    params:
      options:
        - label: We have no enzyme for the β bond – cows have microbes in their rumen that split it
          correct: true
        - label: Cellulose contains no sugar
          feedback: It is made only of glucose.
        - label: Cows chew longer
          feedback: Chewing alone splits no bonds.
    hints:
      - Starch has α bonds, cellulose β bonds.
      - Enzymes recognise exactly one shape.
    explanation: The β bond lays the chains out straight side by side – as strong as fibres. That is why cellulose is the most common natural substance on Earth.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: In Fehling's test, glucose turns the blue solution brick red, sucrose does not. Why?
    params:
      options:
        - label: Glucose has a free aldehyde group that reduces copper ions – in sucrose it is tied up
          correct: true
        - label: Sucrose is not sweet
          feedback: It is actually sweeter than glucose.
        - label: Glucose is a metal
          feedback: The red is precipitated copper oxide.
    hints:
      - Aldehydes are easily oxidised.
      - Blue is Cu²⁺ ions, red is Cu₂O.
    explanation: The aldehyde group is oxidised to an acid and gives electrons to Cu²⁺. That is why glucose is called a "reducing sugar".
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why starch and cellulose are so different even though both are made of glucose.
    params:
      keywords:
        - - glucose
          - traubenzucker
        - - bindung
          - verknüpf
          - bond
          - link
        - - alpha
          - beta
          - form
          - shape
          - richtung
          - spirale
          - spiral
          - faser
          - fibre
          - fiber
      sample: "Both are chains of glucose. The difference is the bond: starch has α bonds and coils into a spiral, cellulose has β bonds and forms straight, strong fibres. Our enzymes only split the α form."
    explanation: Same building blocks, different links – completely different properties.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x1"]
