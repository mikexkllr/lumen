id: chem.biochem.fats
type: concept
title: "Fats and oils"
summary: "Esters of glycerol and fatty acids – solid, liquid, rancid."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Butter is solid at room temperature, olive oil liquid. Both are fats. What makes the difference?
    params:
      options:
        - label: Oil has more double bonds – the chains kink and pack more loosely
          correct: true
        - label: Oil contains water
          feedback: Pure oil is water-free.
        - label: Butter is heavier
          feedback: Both have similar masses.
    hints:
      - Straight chains lie close like spaghetti in a packet.
      - A cis double bond makes a kink.
    explanation: Kinked chains stick together less well – the fat melts sooner. Plant oils are usually rich in double bonds.

  - kind: explain
    id: c1
    body: "A fat molecule is a **triglyceride**: one glycerol with three OH groups forms three ester bonds with three fatty acids. Fatty acids are long chains with a COOH group at the end."

  - kind: problem
    id: c2
    widget: numeric
    prompt: One glycerol joins three fatty acids to make a fat. How many water molecules are released?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 1
        misconception: one-bond
        text: Each of the three ester bonds gives off one water.
    hints:
      - Each ester formation releases water.
      - There are three ester bonds.
    explanation: Three water. Glycerol + 3 fatty acids → triglyceride + 3 H₂O.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Saturated or unsaturated?
    params:
      buckets:
        - id: b1
          label: saturated (no C=C)
        - id: b2
          label: unsaturated (with C=C)
      items:
        - label: Stearic acid (beef fat)
          bucket: b1
        - label: Palmitic acid (palm fat)
          bucket: b1
        - label: Oleic acid (olive oil)
          bucket: b2
        - label: Linoleic acid (sunflower oil)
          bucket: b2
    hints:
      - "Saturated means: as much H as possible."
      - Solid animal fats are mostly saturated.
    explanation: Oleic acid has one double bond, linoleic acid two. The body has to get linoleic acid from food.

  - kind: problem
    id: c4
    widget: choice
    prompt: A grease stain does not come out with water alone. Why?
    params:
      options:
        - label: Fat consists almost entirely of non-polar hydrocarbon chains
          correct: true
        - label: Fat is heavier than water
          feedback: Fat actually floats on water.
        - label: The water is too cold
          feedback: Even hot water alone barely dissolves fat.
    hints:
      - Like dissolves like.
      - The three ester bonds are tiny next to the long chains.
    explanation: Only soap or washing-up liquid bridges fat and water.

  - kind: explain
    id: d1
    depth: 2
    body: "Boil fat with caustic soda and the ester bonds are split. Glycerol forms, along with the sodium salts of the fatty acids: soap. This is **saponification**."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Fat supplies about 37 kJ per gram. How much energy is in {{m}} g of fat?
    params:
      unit: kJ
    answer:
      value: "{{37 * m}}"
    hints:
      - Energy = mass · 37 kJ/g.
      - Work out {{m}} · 37.
    explanation: "{{m}} · 37 = {{37 * m}} kJ. For the same energy you would need more than twice as much sugar."
    difficulty: 2
    variants:
      params:
        m: step[5,50,5]
      defaults:
        m: 20

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Fat supplies more than twice as much energy per gram as sugar. What is the chemical reason?
    params:
      options:
        - label: Fat chains are almost pure CH₂ – their carbon is barely oxidised
          correct: true
        - label: Fat is warmer
          feedback: Temperature plays no part.
        - label: Fat contains more oxygen
          feedback: It contains far less.
    hints:
      - In sugar every C already carries an O.
      - The less oxidised, the more energy when burnt.
    explanation: Sugar is "half burnt", fat hardly at all. That is why the body stores reserves as fat.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: Linoleic acid has two C=C double bonds. How many Br₂ molecules does one molecule of linoleic acid add on?
    answer:
      value: 2
    hints:
      - Bromine adds across each double bond.
      - One Br₂ per C=C.
    explanation: "Two Br₂. This is how labs measure how unsaturated a fat is: brown bromine turns colourless."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In fat hardening, hydrogen is added to plant oil using nickel as a catalyst. What is the problem with only partial hardening?
    params:
      options:
        - label: Trans fatty acids form, which harm the heart
          correct: true
        - label: The fat becomes radioactive
          feedback: A nickel catalyst makes nothing radioactive.
        - label: Petrol forms
          feedback: The chains remain fatty acids.
    hints:
      - On the catalyst, double bonds can briefly open and close the other way.
      - Some cis turns into trans.
    explanation: Trans fats are straight like saturated fats and raise bad cholesterol. In the EU they have been strictly limited since 2021.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Oil goes rancid over time and smells bad. What happens chemically?
    params:
      options:
        - label: Oxygen attacks the double bonds via radicals, and the chains break into smelly fragments
          correct: true
        - label: The oil evaporates
          feedback: The amount stays almost the same.
        - label: It turns into sugar
          feedback: No sugar forms.
    hints:
      - Light and heat speed it up.
      - Vitamin E protects as an antioxidant.
    explanation: Antioxidants catch the radicals and stop the chain reaction. So oil is best kept dark and cool.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: Tristearin, the fat made of three stearic acids, has the formula C₅₇H₁₁₀O₆. What is its molar mass? (C = 12, H = 1, O = 16)
    params:
      unit: g/mol
    answer:
      value: 890
    hints:
      - 57 · 12 + 110 · 1 + 6 · 16.
      - 684 + 110 + 96.
    explanation: 890 g/mol. Only 6 of 173 atoms are oxygen – which is why fat is so rich in energy and so non-polar.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how a fat molecule is built and why some fats are liquid.
    params:
      keywords:
        - - glycerin
          - glycerol
        - - fettsäure
          - fatty acid
        - - ester
        - - doppelbind
          - double bond
          - knick
          - kink
          - ungesättigt
          - unsaturated
      sample: A fat is an ester of glycerol and three fatty acids. If the fatty acids have double bonds, they are unsaturated and kinked. Then the chains lie loosely and the fat is a liquid oil at room temperature.
    explanation: "Structure: glycerol plus three fatty acids. State: kinks from double bonds."
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x3"]
