id: chem.biochem.proteins
type: concept
title: "Amino acids and proteins"
summary: "Twenty building blocks, endless shapes."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: from how many different amino acids do almost all living things build their proteins?"
    params:
      min: 1
      max: 100
    answer:
      value: 20
      tolerance: 2
    explanation: From 20 – the same ones from bacteria to elephants. This alphabet builds hair, muscles, enzymes and antibodies.

  - kind: explain
    id: c1
    body: An **amino acid** carries, on a central C atom, an amino group NH₂, an acid group COOH, an H and a side chain R. Only the side chain differs between the 20 amino acids.

  - kind: problem
    id: c2
    widget: numeric
    prompt: A protein consists of {{n}} amino acids in a chain. How many peptide bonds does it have?
    answer:
      value: "{{n - 1}}"
    feedback:
      - when: numval(state.input) == n
        misconception: fencepost
        text: Between {{n}} beads on a string there are only {{n - 1}} links.
    hints:
      - Two amino acids have one bond, three have two.
      - Work out {{n}} − 1.
    explanation: "{{n - 1}} peptide bonds – and {{n - 1}} water molecules were released."
    variants:
      params:
        n: int[20,300]
      defaults:
        n: 51

  - kind: problem
    id: c3
    widget: choice
    prompt: Two amino acids join with a peptide bond. Which small molecule is released?
    params:
      options:
        - label: Water
          correct: true
        - label: Carbon dioxide
          feedback: The COOH group stays on as C=O.
        - label: Ammonia
          feedback: The nitrogen stays in the chain.
    hints:
      - –COOH meets –NH₂.
      - An OH and an H leave together.
    explanation: The peptide bond –CO–NH– is an amide bond. Digestion splits it again with water.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Is the side chain polar or non-polar?
    params:
      buckets:
        - id: b1
          label: non-polar
        - id: b2
          label: polar or charged
      items:
        - label: Alanine (–CH₃)
          bucket: b1
        - label: Leucine (branched CH chain)
          bucket: b1
        - label: Phenylalanine (benzene ring)
          bucket: b1
        - label: Serine (–CH₂OH)
          bucket: b2
        - label: Lysine (–NH₂ at the end)
          bucket: b2
        - label: Aspartic acid (–COOH)
          bucket: b2
    hints:
      - "Only C and H: non-polar."
      - OH, NH₂ or COOH make it polar.
    explanation: Non-polar side chains hide inside when the protein folds; polar ones face outwards into the water.

  - kind: explain
    id: d1
    depth: 2
    body: The sequence of amino acids is called the **primary structure**. It decides how the chain folds into a fixed shape through hydrogen bonds and side chains.

  - kind: problem
    id: d2
    depth: 2
    widget: order
    prompt: Order the structural levels of a protein from simple to complex.
    params:
      items:
        - label: "Primary: order of the building blocks"
        - label: "Secondary: helix and sheet"
        - label: "Tertiary: the whole chain folded"
        - label: "Quaternary: several chains together"
    hints:
      - First the chain, then its coils.
      - Haemoglobin is made of four chains.
    explanation: Helix and sheet are held by hydrogen bonds between C=O and N–H. The overall shape is set by the side chains.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: How many different chains of {{n}} amino acids can be built from the 20 amino acids?
    answer:
      value: "{{20 ** n}}"
    feedback:
      - when: numval(state.input) == 20 * n
        misconception: add-not-multiply
        text: Each position has 20 options – multiply, do not add.
    hints:
      - There are 20 options for each position.
      - Work out 20 to the {{n}}.
    explanation: 20 to the {{n}} = {{20 ** n}}. For a protein of 300 units the number is greater than the number of atoms in the universe.
    difficulty: 2
    variants:
      params:
        n: int[2,4]
      defaults:
        n: 3

  - kind: problem
    id: d4
    depth: 2
    widget: choice
    prompt: When frying, egg white turns white and solid. What happens to the proteins?
    params:
      options:
        - label: The folding breaks open and the chains clump – the sequence stays intact
          correct: true
        - label: The peptide bonds fall apart
          feedback: The chain itself holds.
        - label: Protein evaporates
          feedback: Only some water evaporates.
    hints:
      - Heat breaks hydrogen bonds.
      - This is called denaturation.
    explanation: The chains unfold and tangle with each other. That is why a boiled egg never turns raw again.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In water at pH 7, an amino acid is hardly ever found as NH₂–CHR–COOH. How then?
    params:
      options:
        - label: "As a zwitterion: NH₃⁺–CHR–COO⁻"
          correct: true
        - label: As a gas
          feedback: Amino acids are solids.
        - label: As NH₂–CHR–COOH as drawn
          feedback: The acid group hands its H⁺ to the amino group.
    hints:
      - COOH is an acid, NH₂ is a base.
      - An H⁺ moves within the same molecule.
    explanation: The zwitterion carries plus and minus at once. That is why amino acids only melt above 200 °C – like salts.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Insulin consists of 51 amino acids. A unit in the chain weighs 110 g/mol on average. Roughly what is its molar mass?
    params:
      unit: g/mol
    answer:
      value: 5610
      tolerance: 10
    hints:
      - Mass ≈ number of units · average mass.
      - 51 · 110.
    explanation: About 5600 g/mol – the measured value is 5808. Small proteins weigh thousands, large ones millions of g/mol.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: "In sickle cell disease, only one amino acid in haemoglobin is swapped: glutamic acid (charged) becomes valine (non-polar). Why does this matter so much?"
    params:
      options:
        - label: The non-polar spot on the surface makes haemoglobin molecules stick together into long fibres
          correct: true
        - label: The haemoglobin loses its iron
          feedback: The iron stays bound.
        - label: Valine is poisonous
          feedback: Valine is a perfectly normal amino acid.
    hints:
      - Non-polar patches avoid water and seek each other out.
      - Many stuck-together molecules deform the cell.
    explanation: One small group of atoms changes polarity – and with it the shape of whole blood cells. Chemistry decides about health.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how a chain of amino acids becomes a protein with a fixed shape.
    params:
      keywords:
        - - peptid
          - kette
          - chain
        - - falt
          - fold
        - - wasserstoffbrück
          - hydrogen bond
          - seitenkette
          - side chain
          - polar
      sample: "Amino acids join through peptide bonds into a chain. It folds through hydrogen bonds into helices and sheets. The side chains decide the final shape: non-polar ones inside, polar ones outside."
    explanation: The sequence already contains the instructions for the shape.
    difficulty: 3

srs:
  cards_from: ["c2", "d3", "x2"]
