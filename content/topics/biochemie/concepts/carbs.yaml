id: chem.biochem.carbs
type: concept
title: "Kohlenhydrate"
summary: "Vom Traubenzucker zu Stärke und Zellulose."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Gramm Zucker stecken in einem Liter Cola?"
    params:
      min: 0
      max: 300
      unit: g
    answer:
      value: 106
      tolerance: 20
    explanation: Rund 106 g – etwa 35 Würfelzucker. Die Phosphorsäure macht es so sauer, dass es trotzdem nicht klebrig süß schmeckt.

  - kind: explain
    id: c1
    body: Traubenzucker C₆H₁₂O₆ ist ein **Monosaccharid**, ein Einfachzucker. Er trägt fünf OH-Gruppen. Einfachzucker sind die Bausteine aller größeren Kohlenhydrate.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Einfach-, Zweifach- oder Vielfachzucker?
    params:
      buckets:
        - id: b1
          label: Monosaccharid
        - id: b2
          label: Disaccharid
        - id: b3
          label: Polysaccharid
      items:
        - label: Traubenzucker (Glucose)
          bucket: b1
        - label: Fruchtzucker (Fructose)
          bucket: b1
        - label: Haushaltszucker (Saccharose)
          bucket: b2
        - label: Milchzucker (Lactose)
          bucket: b2
        - label: Stärke
          bucket: b3
        - label: Zellulose
          bucket: b3
    hints:
      - Haushaltszucker besteht aus Glucose und Fructose.
      - Stärke und Zellulose sind lange Ketten aus Glucose.
    explanation: "Mono-, Di-, Poly-: einer, zwei, viele Bausteine. Vielfachzucker schmecken nicht süß."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Zwei Einfachzucker C₆H₁₂O₆ verbinden sich zu Saccharose. Dabei wird ein Wassermolekül frei. Wie viele H-Atome hat Saccharose?
    answer:
      value: 22
    feedback:
      - when: numval(state.input) == 24
        misconception: condensation-ignored
        text: Das Wasser nimmt zwei H mit.
    hints:
      - Zwei Zucker haben zusammen 24 H.
      - H₂O enthält 2 H.
    explanation: "C₁₂H₂₂O₁₁: 24 − 2 = 22 H und 12 − 1 = 11 O. Eine solche Verknüpfung unter Wasserabgabe heißt Kondensation."

  - kind: problem
    id: c4
    widget: choice
    prompt: Warum löst sich Zucker so gut in Wasser, Kerzenwachs aber nicht?
    params:
      options:
        - label: Seine vielen OH-Gruppen bilden Wasserstoffbrücken mit Wasser
          correct: true
        - label: Zucker ist ein Salz
          feedback: Zucker zerfällt nicht in Ionen.
        - label: Zucker ist leichter
          feedback: Mit der Masse hat das nichts zu tun.
    hints:
      - Gleiches löst Gleiches.
      - OH-Gruppen sind polar wie Wasser.
    explanation: Wachs besteht aus unpolaren CH-Ketten, Zucker ist rundum mit OH besetzt. Darum löst sich Zucker zu 200 g in 100 g Wasser.

  - kind: explain
    id: d1
    depth: 2
    body: Zucker verknüpfen sich unter Wasserabgabe über ein O-Atom. Das ist die **glycosidische Bindung**. Ob sie nach unten (α) oder nach oben (β) zeigt, macht aus Glucose Stärke oder Zellulose.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Glucose-Baustein in Stärke wiegt 162 g/mol. Ein Stärkemolekül hat {{162 * n}} g/mol. Aus wie vielen Bausteinen besteht es?
    answer:
      value: "{{n}}"
    feedback:
      - when: abs(numval(state.input) - 162 * n / 180) < 1
        misconception: monomer-mass
        text: "In der Kette fehlt jedem Baustein ein Wasser: 180 − 18 = 162."
    hints:
      - Teile die Molekülmasse durch die Masse eines Bausteins.
      - "Rechne {{162 * n}} : 162."
    explanation: "{{n}} Bausteine. Freie Glucose wiegt 180 g/mol – in der Kette ist pro Baustein ein Wasser abgespalten."
    difficulty: 2
    variants:
      params:
        n: step[500,5000,500]
      defaults:
        n: 1000

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Gibt man Iodlösung auf eine Kartoffelscheibe, färbt sie sich blauschwarz. Was zeigt das?
    params:
      options:
        - label: Stärke – Iod lagert sich in ihre Schraubenketten ein
          correct: true
        - label: Zucker
          feedback: Einfachzucker färben sich mit Iod nicht.
        - label: Fett
          feedback: Fett erkennt man am Fettfleck auf Papier.
    hints:
      - Die Stärke-Kette ist zu einer Spirale gedreht.
      - Iod passt genau in diese Spirale.
    explanation: Die Iod-Stärke-Probe ist ein klassischer Nachweis. Beim Kauen von Brot verschwindet die Farbe – Speichel spaltet die Stärke.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Saccharose (342 g/mol) wird mit Wasser in Glucose und Fructose gespalten. Wie viel Gramm Einfachzucker entstehen aus 342 g Saccharose?
    params:
      unit: g
    answer:
      value: 360
    feedback:
      - when: numval(state.input) == 342
        misconception: hydrolysis-mass
        text: Das Wasser wird eingebaut – die Masse wächst.
    hints:
      - "Spalten mit Wasser heißt Hydrolyse: Ein H₂O kommt dazu."
      - 342 + 18.
    explanation: 342 + 18 = 360 g, also 2 · 180 g. So entsteht Invertzucker für Honig-Ersatz und Fondant.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Kühe verdauen Gras, wir nicht. Beide Male geht es um Zellulose aus Glucose. Woran liegt der Unterschied?
    params:
      options:
        - label: Wir haben kein Enzym für die β-Bindung – Kühe haben Mikroben im Pansen, die sie spalten
          correct: true
        - label: Zellulose enthält keinen Zucker
          feedback: Sie besteht nur aus Glucose.
        - label: Kühe kauen länger
          feedback: Kauen allein spaltet keine Bindung.
    hints:
      - Stärke hat α-, Zellulose β-Bindungen.
      - Enzyme erkennen genau eine Form.
    explanation: Die β-Bindung legt die Ketten gestreckt nebeneinander – stabil wie Fasern. Darum ist Zellulose der häufigste Naturstoff der Erde.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Mit der Fehling-Probe färbt Glucose die blaue Lösung ziegelrot, Saccharose nicht. Warum?
    params:
      options:
        - label: Glucose hat eine freie Aldehydgruppe, die Kupfer-Ionen reduziert – in Saccharose ist sie gebunden
          correct: true
        - label: Saccharose ist nicht süß
          feedback: Sie ist sogar süßer als Glucose.
        - label: Glucose ist ein Metall
          feedback: Rot ist ausgefälltes Kupferoxid.
    hints:
      - Aldehyde lassen sich leicht oxidieren.
      - Blau sind Cu²⁺-Ionen, rot ist Cu₂O.
    explanation: Die Aldehydgruppe wird zur Säure oxidiert und gibt Elektronen an Cu²⁺. Darum heißt Glucose ein »reduzierender Zucker«.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Stärke und Zellulose so verschieden sind, obwohl beide aus Glucose bestehen.
    params:
      keywords:
        - - glucose
          - traubenzucker
        - - bindung
          - verknüpf
          - bond
          - link
        - - alpha
          - beta
          - form
          - shape
          - richtung
          - spirale
          - spiral
          - faser
          - fibre
          - fiber
      sample: "Beide sind Ketten aus Glucose. Der Unterschied liegt in der Bindung: Stärke hat α-Bindungen und dreht sich zur Spirale, Zellulose hat β-Bindungen und bildet gestreckte, feste Fasern. Unsere Enzyme spalten nur die α-Form."
    explanation: Gleiche Bausteine, andere Verknüpfung – ganz andere Eigenschaften.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x1"]
