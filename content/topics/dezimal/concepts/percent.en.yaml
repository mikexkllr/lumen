id: math.decimals.percent
type: concept
title: Understanding percent
summary: Percent means "out of a hundred".
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [pct.basics]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of the Earth’s surface is covered by water?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 71
      tolerance: 7
    explanation: About 71%. Percent makes shares comparable – however large the whole is.


  - kind: problem
    id: dreissig
    widget: fraction
    prompt: The strip is divided into 10 equal parts. Shade 30%.
    params: { parts: 10 }
    answer: { fraction: "3/10" }
    hints:
      - One tenth is 10%.
    explanation: 30% = 30/100 = 3/10.

  - kind: explain
    id: s2
    body: |
      **Percent** means "out of a hundred". 30% is $\frac{30}{100} = \frac{3}{10} = 0.3$.
      100% is the whole.

  - kind: problem
    id: viertel
    widget: numeric
    prompt: What percent is 1/4?
    params: { unit: "%" }
    answer: { value: 25 }
    feedback:
      - when: "numval(state.input) == 4 || numval(state.input) == 14"
        text: 1/4 means one quarter of the whole. The whole is 100%.
    hints:
      - What is a quarter of 100?
    explanation: "100 ÷ 4 = 25, so 25%."

  - kind: problem
    id: prozentwert
    widget: numeric
    prompt: What is {{p}}% of {{g}}?
    answer: { value: "{{p * g / 100}}" }
    hints:
      - "1% of {{g}} is {{g / 100}}."
      - "Then multiply by {{p}}."
    explanation: "{{g}} · {{p}} ÷ 100 = {{p * g / 100}}."
    variants:
      params: { p: "choice[10,20,25,50,75]", g: "choice[40,80,120,200,360]" }
      constraints: ["isInt(p * g / 100)"]
      defaults: { p: 25, g: 80 }

  - kind: problem
    id: trick
    widget: choice
    prompt: Which is more, 50% of 30 or 30% of 50?
    params:
      options:
        - { label: Both are equal, correct: true }
        - { label: "50% of 30", feedback: "Check: 50% of 30 is 15, and so is 30% of 50." }
        - { label: "30% of 50", feedback: "Check: both give 15." }
    hints:
      - Work out both.
    explanation: 0.5 · 30 = 15 and 0.3 · 50 = 15. Multiplication is commutative.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: 12 of 48 students play an instrument. What percent is that?
    params: { unit: "%" }
    answer: { value: 25 }
    hints:
      - "Simplify 12/48."
      - "12/48 = 1/4."
    explanation: 12/48 = 1/4 = 25%.

  - kind: problem
    id: c1
    widget: match
    prompt: What belongs together?
    params:
      pairs:
        - left: 1/2
          right: 50 %
        - left: 1/5
          right: 20 %
        - left: 3/4
          right: 75 %
        - left: 1/8
          right: 12.5%
        - left: 1/20
          right: 5 %
    hints:
      - Expand the fraction to the denominator 100.
    explanation: Percent is a fraction with denominator 100.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 18 is 45% of a number. What is the number?
    answer:
      value: 40
    hints:
      - If 45% equals 18 – how much is 5%?
    explanation: 5% is 2, so 100% is exactly 40.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Approval rises from 20% to 25%. How large is the increase?
    params:
      options:
        - label: 5 percentage points – which is 25 percent
          correct: true
        - label: 5 percent
          feedback: 5% of 20% would only be a rise to 21%.
        - label: 25 percentage points
          feedback: The difference 25 − 20 is 5 points.
    hints:
      - How large is the difference – and how large relative to the old value?
    explanation: "**Percentage points** measure the difference, **percent** the ratio: 5 out of 20 is a quarter."
    difficulty: 3

srs:
  cards_from: ["prozentwert"]
