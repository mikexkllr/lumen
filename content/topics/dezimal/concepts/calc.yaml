id: math.decimals.calc
type: concept
title: Rechnen mit Dezimalzahlen
summary: Komma unter Komma – und beim Malnehmen Stellen zählen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [dec.calc]
estimated_minutes: 7
steps:
  - kind: problem
    id: plus
    widget: numeric
    prompt: "Rechne: 0,7 + 0,5"
    answer: { value: 1.2 }
    feedback:
      - when: "numval(state.input) == 0.12"
        misconception: decimal-concat
        text: 7 Zehntel plus 5 Zehntel sind 12 Zehntel. Und 12 Zehntel sind 1,2.
    hints:
      - Rechne in Zehnteln – 7 + 5.
    explanation: 0,7 + 0,5 = 1,2.

  - kind: explain
    id: s2
    body: |
      Beim Addieren und Subtrahieren steht **Komma unter Komma**.
      Dann rechnest du wie mit ganzen Zahlen.

  - kind: problem
    id: plus-variante
    widget: numeric
    prompt: "Rechne: {{x}} + {{y}}"
    answer: { value: "{{x + y}}" }
    hints:
      - Schreibe Komma unter Komma.
      - Erst die Zehntel, dann die Einer.
    explanation: "{{x}} + {{y}} = {{x + y}}."
    variants:
      params: { a: "int[11,59]", b: "int[11,59]" }
      derive: { x: "a / 10", y: "b / 10" }
      constraints: ["a % 10 != 0", "b % 10 != 0"]
      defaults: { a: 23, b: 48 }

  - kind: problem
    id: mal-ganz
    widget: numeric
    prompt: "Rechne: 2,5 · 4"
    answer: { value: 10 }
    hints:
      - 2,5 · 2 = 5.
    explanation: 2,5 · 4 = 10.

  - kind: problem
    id: mal-komma
    widget: numeric
    prompt: "Rechne: 1,2 · 0,5"
    answer: { value: 0.6 }
    feedback:
      - when: "numval(state.input) == 6"
        misconception: decimal-places
        text: Zähle die Stellen nach dem Komma. 1,2 hat eine, 0,5 hat eine – das Ergebnis braucht zwei – 0,60.
    hints:
      - Rechne zuerst 12 · 5 ohne Komma.
      - Dann setzt du das Komma – zwei Stellen von rechts.
    explanation: 12 · 5 = 60, mit zwei Stellen nach dem Komma ist das 0,60 = 0,6.
    difficulty: 2

  - kind: problem
    id: viertel
    widget: choice
    prompt: Welche Rechnungen ergeben 0,25? Wähle alle passenden.
    params:
      multiple: true
      options:
        - { label: "1 : 4", correct: true }
        - { label: "0,5 · 0,5", correct: true }
        - { label: "2 : 5", feedback: "2 : 5 = 0,4." }
        - { label: "0,2 + 0,5", feedback: "0,2 + 0,5 = 0,7." }
    hints:
      - Rechne jede Möglichkeit kurz aus.
    explanation: "1 : 4 = 0,25 und 0,5 · 0,5 = 0,25."

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Bei 0,3 · 0,2 rechnest du 3 · 2 = 6 und zählst die Nachkommastellen: zusammen [[zwei]]. Das Ergebnis ist [[0,06]]."
      distractors:
        - "0"
        - "6"
        - eine

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne: 3,6 : 0,4"
    answer:
      value: 9
    hints:
      - "Verschiebe bei beiden Zahlen das Komma: 36 : 4."
    explanation: "36 : 4 = 9. Erweitern mit 10 ändert den Quotienten nicht."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du teilst eine positive Zahl durch 0,25. Was passiert?
    params:
      options:
        - label: Sie wird viermal so groß
          correct: true
        - label: Sie wird ein Viertel so groß
          feedback: Das wäre Malnehmen mit 0,25.
        - label: Sie bleibt gleich
          feedback: Nur Teilen durch 1 lässt die Zahl gleich.
    hints:
      - Wie oft passt ein Viertel in ein Ganzes?
    explanation: Teilen durch 1/4 ist Malnehmen mit 4. Teilen durch eine Zahl unter 1 vergrößert.
    difficulty: 3

srs:
  cards_from: ["plus-variante"]
