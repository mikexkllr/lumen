id: math.decimals.rounding
type: concept
title: Runden
summary: Zur nächsten Zahl – und warum Preise auf 99 enden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: strahl
    widget: numberline
    prompt: Setze die Markierung auf 2,7.
    params: { min: 2, max: 3, ticks: 10, labels: decimals }
    answer: { value: 2.7 }
    hints:
      - Zwischen 2 und 3 liegen zehn Schritte.
    explanation: 2,7 liegt näher an 3 als an 2 – gerundet also 3.

  - kind: explain
    id: s2
    body: |
      **Runden** heißt – zur nächstgelegenen Zahl springen. Ist die erste weggelassene Ziffer 5 oder größer, rundet man auf, sonst ab.

  - kind: problem
    id: eine-stelle
    widget: numeric
    prompt: Runde {{a / 100}} auf eine Stelle nach dem Komma.
    params: { placeholder: "Zahl" }
    answer: { value: "{{round(a / 100, 1)}}" }
    hints:
      - "Schau auf die zweite Stelle nach dem Komma: {{mod(a, 10)}}."
    explanation: "{{a / 100}} ≈ {{round(a / 100, 1)}}."
    variants:
      params: { a: "int[101,999]" }
      constraints: ["mod(a, 10) != 0", "mod(a, 10) != 5"]
      defaults: { a: 347 }

  - kind: problem
    id: neunundneunzig
    widget: choice
    prompt: Warum enden so viele Preise auf ,99?
    params:
      options:
        - { label: "Sie wirken günstiger, als sie sind.", correct: true }
        - { label: Das ist gesetzlich vorgeschrieben., feedback: "Kein Gesetz verlangt das." }
        - { label: Es ist für die Kasse einfacher., feedback: "Glatte Beträge wären einfacher." }
    hints:
      - Wie liest man 9,99 € auf den ersten Blick?
    explanation: Wir lesen von links – 9,99 € fühlt sich nach »9 Euro« an, ist aber fast 10.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 2,45 auf eine Stelle gerundet ist 2,5.
          right: true
        - text: 3,96 auf eine Stelle gerundet ist 3,9.
          right: false
          why: "Die 6 rundet auf: 4,0."
        - text: 7,449 auf ganze Zahlen gerundet ist 8.
          right: false
          why: "Nur die erste weggelassene Ziffer zählt: 4 rundet ab."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Länge ist auf Zentimeter gerundet 12 cm. Wie lang ist sie mindestens (in cm)?
    params:
      unit: cm
    answer:
      value: 11.5
    hints:
      - Ab welcher Zahl rundet man auf 12 auf?
    explanation: Alles von 11,5 bis knapp unter 12,5 wird zu 12. Jede gerundete Zahl ist ein **Intervall**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du rundest 2,449 erst auf zwei Stellen und dann auf eine. Was passiert?
    params:
      options:
        - label: Du erhältst 2,5 – direkt gerundet wäre es 2,4
          correct: true
        - label: Beide Wege ergeben 2,4
          feedback: Erst 2,45, und daraus wird 2,5.
        - label: Beide Wege ergeben 2,5
          feedback: Direkt gerundet zählt nur die 4 an zweiter Stelle.
    hints:
      - Führ beide Wege wirklich durch.
    explanation: Mehrfaches Runden verfälscht. Runde immer **einmal** vom Originalwert.
    difficulty: 3

srs:
  cards_from: [eine-stelle, neunundneunzig]
