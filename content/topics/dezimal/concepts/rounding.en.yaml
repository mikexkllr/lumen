id: math.decimals.rounding
type: concept
title: Rounding
summary: To the nearest number, and why prices end in 99.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: strahl
    widget: numberline
    prompt: Place the marker at 2.7.
    params: { min: 2, max: 3, ticks: 10, labels: decimals }
    answer: { value: 2.7 }
    hints:
      - There are ten steps between 2 and 3.
    explanation: 2.7 is closer to 3 than to 2, so it rounds to 3.

  - kind: explain
    id: s2
    body: |
      **Rounding** means jumping to the nearest number. If the first dropped digit is 5 or more, round up. Otherwise round down.

  - kind: problem
    id: eine-stelle
    widget: numeric
    prompt: Round {{a / 100}} to one place after the decimal point.
    params: { placeholder: "Number" }
    answer: { value: "{{round(a / 100, 1)}}" }
    hints:
      - "Look at the second place after the decimal point: {{mod(a, 10)}}."
    explanation: "{{a / 100}} ≈ {{round(a / 100, 1)}}."
    variants:
      params: { a: "int[101,999]" }
      constraints: ["mod(a, 10) != 0", "mod(a, 10) != 5"]
      defaults: { a: 347 }

  - kind: problem
    id: neunundneunzig
    widget: choice
    prompt: Why do so many prices end in .99?
    params:
      options:
        - { label: "They look cheaper than they are.", correct: true }
        - { label: It is required by law., feedback: "No law requires it." }
        - { label: It is easier for the register., feedback: "Round amounts would be easier." }
    hints:
      - How do you read 9.99 € at first glance?
    explanation: We read from the left. 9.99 € feels like "9 euros", but it is almost 10.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 2.45 rounded to one decimal place is 2.5.
          right: true
        - text: 3.96 rounded to one decimal place is 3.9.
          right: false
          why: "The 6 rounds up: 4.0."
        - text: 7.449 rounded to a whole number is 8.
          right: false
          why: "Only the first dropped digit counts: 4 rounds down."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A length rounded to centimetres is 12 cm. How long is it at least (in cm)?
    params:
      unit: cm
    answer:
      value: 11.5
    hints:
      - From which number do you round up to 12?
    explanation: Everything from 11.5 to just under 12.5 becomes 12. Every rounded number is an **interval**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You round 2.449 first to two places and then to one. What happens?
    params:
      options:
        - label: You get 2.5 – rounding directly gives 2.4
          correct: true
        - label: Both ways give 2.4
          feedback: First 2.45, and that becomes 2.5.
        - label: Both ways give 2.5
          feedback: Rounding directly only the 4 in second place counts.
    hints:
      - Actually carry out both ways.
    explanation: Rounding repeatedly distorts. Always round **once** from the original value.
    difficulty: 3

srs:
  cards_from: [eine-stelle, neunundneunzig]
