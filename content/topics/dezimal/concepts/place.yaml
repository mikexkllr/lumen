id: math.decimals.place
type: concept
title: Stellen nach dem Komma
summary: Zehntel, Hundertstel – und warum 0,5 größer ist als 0,45.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [dec.place]
estimated_minutes: 7
steps:
  - kind: problem
    id: null-vier
    widget: numberline
    prompt: Setze die Markierung auf 0,4.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: 0.4 }
    hints:
      - Der Strahl von 0 bis 1 ist in 10 Teile geteilt.
    explanation: 0,4 sind 4 Zehntel – der vierte Teilstrich.

  - kind: explain
    id: s2
    body: |
      Die erste Stelle nach dem Komma zählt **Zehntel**, die zweite **Hundertstel**.
      0,4 sind 4 Zehntel, also $\frac{4}{10}$. 0,04 sind 4 Hundertstel.

  - kind: problem
    id: groesser
    widget: choice
    prompt: Welche Zahl ist größer?
    params:
      layout: grid
      options:
        - { label: "0,5", correct: true }
        - { label: "0,45", feedback: "Mehr Ziffern heißt nicht größer. Vergleiche Stelle für Stelle: 5 Zehntel sind mehr als 4 Zehntel." }
        - { label: Beide gleich, feedback: "0,5 = 0,50. Und 50 Hundertstel sind mehr als 45 Hundertstel." }
    hints:
      - Schreibe beide mit zwei Stellen nach dem Komma.
    explanation: 0,5 = 0,50 > 0,45.

  - kind: problem
    id: sortieren
    widget: order
    prompt: Sortiere von klein nach groß.
    params:
      direction: horizontal
      items: [{ label: "0,09" }, { label: "0,1" }, { label: "0,25" }, { label: "0,3" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Hänge Nullen an, bis alle gleich viele Stellen haben.
    explanation: 0,09 < 0,10 < 0,25 < 0,30.

  - kind: problem
    id: zehntel
    widget: numeric
    prompt: Schreibe {{a}}/10 als Dezimalzahl.
    params: { placeholder: "z. B. 0,5" }
    answer: { value: "{{a / 10}}", form: decimal }
    hints:
      - Zehntel stehen an der ersten Stelle nach dem Komma.
    explanation: "{{a}}/10 = {{a / 10}}."
    variants:
      params: { a: "int[1,9]" }
      defaults: { a: 7 }

  - kind: problem
    id: hundertstel
    widget: numeric
    prompt: Schreibe 3/100 als Dezimalzahl.
    params: { placeholder: "z. B. 0,5" }
    answer: { value: 0.03, form: decimal }
    feedback:
      - when: "numval(state.input) == 0.3"
        misconception: place-value
        text: 0,3 sind 3 Zehntel. Hundertstel stehen an der zweiten Stelle nach dem Komma.
    hints:
      - Hundertstel stehen an der zweiten Stelle.
    explanation: 3/100 = 0,03.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 0,5 ist größer als 0,45.
          right: true
        - text: 0,125 ist größer als 0,2, weil 125 größer als 2 ist.
          right: false
          why: "Vergleiche Stelle für Stelle: 1 Zehntel gegen 2 Zehntel."
        - text: 0,30 und 0,3 sind gleich.
          right: true
        - text: Die zweite Stelle nach dem Komma zählt Tausendstel.
          right: false
          why: Sie zählt Hundertstel.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Schreibe 7/8 als Dezimalzahl.
    answer:
      value: 0.875
      form: decimal
    hints:
      - 1/8 ist die Hälfte von 1/4 = 0,25.
    explanation: 1/8 = 0,125 und 7 · 0,125 = 0,875.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welcher Bruch hat eine Dezimalzahl, die **nie endet**?
    params:
      options:
        - label: 1/6
          correct: true
        - label: 3/8
          feedback: 3/8 = 0,375 – das endet.
        - label: 7/20
          feedback: 7/20 = 0,35 – das endet.
    hints:
      - Zerlege die Nenner in Primfaktoren. Welche passen in eine Zehnerpotenz?
    explanation: Ein gekürzter Bruch endet nur, wenn der Nenner allein aus 2ern und 5ern besteht. 6 enthält die 3.
    difficulty: 3

srs:
  cards_from: ["zehntel", "hundertstel"]
