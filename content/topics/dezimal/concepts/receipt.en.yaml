id: math.decimals.receipt
type: concept
title: The receipt
summary: Estimating protects you from mistakes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Is 20 euros enough?
    body: At the till you want to know if your money is enough – without a calculator. Uncover the shopping card by card. Each price gets roughly rounded. That is how an **estimate** works.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🍞
            front: "Bread: 2.95 €"
            back: Roughly 3 € – that keeps it simple.
          - icon: 🧀
            front: "Cheese: 4.10 €"
            back: Roughly 4 € – together you are at 7 €.
          - icon: 🍓
            front: "Strawberries: 3.89 €"
            back: Roughly 4 € – now it is about 11 €.
          - icon: 💶
            front: Is 20 € enough?
            back: "Easily: the estimate says 11 €, the exact total is 10.94 €."

  - kind: problem
    id: summe
    widget: numeric
    prompt: Bread 2.49 €, cheese 3.79 €, milk 1.19 €. What is the total?
    params: { unit: "€" }
    answer: { value: 7.47 }
    hints:
      - Add the euros first, then the cents.
    explanation: 2.49 + 3.79 + 1.19 = 7.47 €.

  - kind: explain
    id: s2
    body: |
      **Estimating:** Round each amount roughly and add in your head. The result is not exact, but big mistakes show up right away.

  - kind: problem
    id: ueberschlag
    widget: numeric
    prompt: Estimate. About how much is {{a / 100}} € + {{b / 100}} € + {{c / 100}} €?
    params: { unit: "€" }
    answer: { value: "{{round(a / 100) + round(b / 100) + round(c / 100)}}", tolerance: 1.5 }
    hints:
      - Round each amount to whole euros.
    explanation: "About {{round(a / 100) + round(b / 100) + round(c / 100)}} €. The exact total is {{(a + b + c) / 100}} €."
    variants:
      params: { a: "int[105,995]", b: "int[105,995]", c: "int[105,995]" }
      defaults: { a: 389, b: 512, c: 149 }

  - kind: problem
    id: rest
    widget: numberline
    prompt: You pay 7.50 € with a 10 € bill. Mark your change.
    params: { min: 0, max: 5, ticks: 2, labels: decimals }
    answer: { value: 2.5 }
    hints:
      - From 7.50 up to 10.
    explanation: 10 − 7.50 = 2.50 €.

  - kind: problem
    id: stimmt
    widget: choice
    prompt: Four items cost about 3 € each. The register shows 21.47 €. Is that right?
    params:
      options:
        - { label: "No, about 12 € would be right.", correct: true }
        - { label: Yes, feedback: "4 · 3 € is 12 €. 21.47 € is far too much." }
    hints:
      - 4 · 3.
    explanation: The estimate shows right away that something was charged twice.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Three items at €3.98 each and two at €1.49 each. What does it all cost exactly?
    params:
      unit: €
    answer:
      value: 14.92
    hints:
      - Calculate with €4 and €1.50 and subtract the missing cents.
    explanation: "12 + 3 = €15, minus 3 · 2 ct and 2 · 1 ct: €14.92."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: You pay €{{a / 100}} with a €50 note. How much change do you get?
    params:
      unit: €
    answer:
      value: "{{(5000 - a) / 100}}"
    hints:
      - Count up to the next whole euro.
      - Then on to €50.
    explanation: €50 − €{{a / 100}} = €{{(5000 - a) / 100}}. Counting up is often easier than subtracting.
    difficulty: 2
    variants:
      params:
        a: int[1012,4988]
      constraints:
        - a % 100 != 0
      defaults:
        a: 2347

  - kind: problem
    id: ma-d2
    depth: 2
    widget: order
    prompt: This is how a cashier works out €50 − €23.47 by counting up. Put the steps in order.
    params:
      items:
        - label: €23.47 + €0.03 = €23.50
        - label: €23.50 + €0.50 = €24
        - label: €24 + €6 = €30
        - label: €30 + €20 = €50
        - label: "Change: 0.03 + 0.50 + 6 + 20 = €26.53"
    hints:
      - First up to the next round amount.
      - Cents, then euros, then tens.
    explanation: "Each step lands on a rounder number. At the end you add the jumps: €26.53."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: estimate
    prompt: "Quick guess: what do these cost in all? €4.95 + €7.10 + €2.99 + €9.89 + €1.05"
    params:
      min: 0
      max: 50
      unit: €
    answer:
      value: 25.98
      tolerance: 1.5
    explanation: "Rounded: 5 + 7 + 3 + 10 + 1 = €26. Exactly it is €25.98."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: 500 g cost €2.79, the 750 g pack €3.99. Which is cheaper per kilo?
    params:
      options:
        - label: "The large one: €5.32 instead of €5.58 per kilo"
          correct: true
        - label: The small one
          feedback: €2.79 times 2 is €5.58 per kilo – more than the large one.
        - label: Both equal
          feedback: Convert both to 1 kg.
    hints:
      - Convert both prices to 1 kg.
    explanation: €3.99 ÷ 0.75 = €5.32. The **unit price** makes packs comparable.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "»3 for 2«: you take three yoghurts and pay for two. What discount is that in percent? To one decimal."
    params:
      unit: "%"
    answer:
      value: 33.3
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 50
        misconception: wrong-base
        text: You save one of three yoghurts, not one of two.
    hints:
      - How many of three yoghurts are free?
      - 1/3 as a percentage.
    explanation: "One of three is free: 1/3 ≈ 33.3 % off."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Barcodes contain a **check digit**. In an EAN code the digits are multiplied by 1 and 3 in turn. The total, including the check digit, must be divisible by 10.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: The weighted sum of a barcode without its check digit is 87. Which check digit (counted times 1) makes the total divisible by 10?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 7
        misconception: last-digit
        text: With 7 it would be 94. You need the next multiple of ten.
    hints:
      - Which multiple of ten comes after 87?
      - 90 − 87 = ?
    explanation: 87 + 3 = 90. If the till misreads a digit, the total usually breaks – and the error is caught.
    difficulty: 3

srs:
  cards_from: [ueberschlag, stimmt]
