id: math.decimals.receipt
type: concept
title: Der Kassenbon
summary: Überschlagen schützt vor Fehlern.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: summe
    widget: numeric
    prompt: Brot 2,49 €, Käse 3,79 €, Milch 1,19 €. Was kostet alles zusammen?
    params: { unit: "€" }
    answer: { value: 7.47 }
    hints:
      - Erst die Euro, dann die Cent addieren.
    explanation: 2,49 + 3,79 + 1,19 = 7,47 €.

  - kind: explain
    id: s2
    body: |
      **Überschlagen:** Runde jeden Betrag grob und addiere im Kopf. Das Ergebnis ist nicht exakt, aber große Fehler fallen sofort auf.

  - kind: problem
    id: ueberschlag
    widget: numeric
    prompt: Überschlage – {{a / 100}} € + {{b / 100}} € + {{c / 100}} € sind ungefähr wie viel?
    params: { unit: "€" }
    answer: { value: "{{round(a / 100) + round(b / 100) + round(c / 100)}}", tolerance: 1.5 }
    hints:
      - Runde jeden Betrag auf ganze Euro.
    explanation: "Etwa {{round(a / 100) + round(b / 100) + round(c / 100)}} € – genau sind es {{(a + b + c) / 100}} €."
    variants:
      params: { a: "int[105,995]", b: "int[105,995]", c: "int[105,995]" }
      defaults: { a: 389, b: 512, c: 149 }

  - kind: problem
    id: rest
    widget: numberline
    prompt: Du zahlst 7,50 € mit einem 10-€-Schein. Markiere dein Rückgeld.
    params: { min: 0, max: 5, ticks: 2, labels: decimals }
    answer: { value: 2.5 }
    hints:
      - Von 7,50 bis 10.
    explanation: 10 − 7,50 = 2,50 €.

  - kind: problem
    id: stimmt
    widget: choice
    prompt: Vier Artikel kosten je etwa 3 €. Die Kasse zeigt 21,47 €. Stimmt das?
    params:
      options:
        - { label: Nein – etwa 12 € wären richtig., correct: true }
        - { label: Ja, feedback: "4 · 3 € sind 12 €. 21,47 € ist viel zu viel." }
    hints:
      - 4 · 3.
    explanation: Der Überschlag zeigt sofort – da wurde etwas doppelt gebucht.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Drei Artikel zu je 3,98 € und zwei zu je 1,49 €. Was kostet alles genau?
    params:
      unit: €
    answer:
      value: 14.92
    hints:
      - Rechne mit 4 € und 1,50 € und zieh die fehlenden Cent ab.
    explanation: "12 + 3 = 15 €, minus 3 · 2 ct und 2 · 1 ct: 14,92 €."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: Du zahlst {{a / 100}} € mit einem 50-€-Schein. Wie viel Rückgeld bekommst du?
    params:
      unit: €
    answer:
      value: "{{(5000 - a) / 100}}"
    hints:
      - Zähle hoch bis zum nächsten vollen Euro.
      - Dann weiter bis 50 €.
    explanation: 50 € − {{a / 100}} € = {{(5000 - a) / 100}} €. Hochzählen ist oft leichter als Abziehen.
    difficulty: 2
    variants:
      params:
        a: int[1012,4988]
      constraints:
        - a % 100 != 0
      defaults:
        a: 2347

  - kind: problem
    id: ma-d2
    depth: 2
    widget: order
    prompt: So rechnet die Kassiererin 50 € − 23,47 € durch Hochzählen. Ordne die Schritte.
    params:
      items:
        - label: 23,47 € + 0,03 € = 23,50 €
        - label: 23,50 € + 0,50 € = 24 €
        - label: 24 € + 6 € = 30 €
        - label: 30 € + 20 € = 50 €
        - label: "Rückgeld: 0,03 + 0,50 + 6 + 20 = 26,53 €"
    hints:
      - Erst bis zum nächsten runden Betrag.
      - Cent, dann Euro, dann Zehner.
    explanation: "Jeder Schritt landet auf einer runderen Zahl. Am Ende addiert man die Sprünge: 26,53 €."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: estimate
    prompt: "Schätz die Summe: 4,95 € + 7,10 € + 2,99 € + 9,89 € + 1,05 €"
    params:
      min: 0
      max: 50
      unit: €
    answer:
      value: 25.98
      tolerance: 1.5
    explanation: Gerundet 5 + 7 + 3 + 10 + 1 = 26 €. Genau sind es 25,98 €.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: 500 g kosten 2,79 €, die 750-g-Packung 3,99 €. Welche ist pro Kilo günstiger?
    params:
      options:
        - label: "Die große: 5,32 € statt 5,58 € pro Kilo"
          correct: true
        - label: Die kleine
          feedback: 2,79 € mal 2 sind 5,58 € pro Kilo – mehr als bei der großen.
        - label: Beide gleich
          feedback: Rechne beide auf 1 kg um.
    hints:
      - Rechne beide Preise auf 1 kg um.
    explanation: "3,99 € : 0,75 = 5,32 €. Der **Grundpreis** macht Packungen vergleichbar."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "»3 für 2«: Du nimmst drei Joghurts und zahlst nur zwei. Wie viel Prozent Rabatt sind das? Auf eine Stelle."
    params:
      unit: "%"
    answer:
      value: 33.3
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 50
        misconception: wrong-base
        text: Du sparst einen von drei Joghurts, nicht einen von zwei.
    hints:
      - Wie viele von drei Joghurts sind gratis?
      - 1/3 in Prozent.
    explanation: "Einer von drei ist gratis: 1/3 ≈ 33,3 % Rabatt."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Strichcodes enthalten eine **Prüfziffer**. Beim EAN-Code nimmt man die Ziffern abwechselnd mal 1 und mal 3. Die Summe aller Ziffern samt Prüfziffer muss durch 10 teilbar sein.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Die gewichtete Summe eines Strichcodes ohne Prüfziffer ist 87. Welche Prüfziffer (mal 1 gerechnet) macht die Summe durch 10 teilbar?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 7
        misconception: last-digit
        text: Mit 7 wären es 94. Gesucht ist die nächste Zehnerzahl.
    hints:
      - Welche Zehnerzahl kommt nach 87?
      - 90 − 87 = ?
    explanation: 87 + 3 = 90. Tippt die Kasse eine Ziffer falsch ab, stimmt die Summe meist nicht mehr – der Fehler fällt auf.
    difficulty: 3

srs:
  cards_from: [ueberschlag, stimmt]
