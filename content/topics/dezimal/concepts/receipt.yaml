id: math.decimals.receipt
type: concept
title: Der Kassenbon
summary: Überschlagen schützt vor Fehlern.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: summe
    widget: numeric
    prompt: Brot 2,49 €, Käse 3,79 €, Milch 1,19 €. Was kostet alles zusammen?
    params: { unit: "€" }
    answer: { value: 7.47 }
    hints:
      - Erst die Euro, dann die Cent addieren.
    explanation: 2,49 + 3,79 + 1,19 = 7,47 €.

  - kind: explain
    id: s2
    body: |
      **Überschlagen:** Runde jeden Betrag grob und addiere im Kopf. Das Ergebnis ist nicht exakt, aber große Fehler fallen sofort auf.

  - kind: problem
    id: ueberschlag
    widget: numeric
    prompt: Überschlage – {{a / 100}} € + {{b / 100}} € + {{c / 100}} € sind ungefähr wie viel?
    params: { unit: "€" }
    answer: { value: "{{round(a / 100) + round(b / 100) + round(c / 100)}}", tolerance: 1.5 }
    hints:
      - Runde jeden Betrag auf ganze Euro.
    explanation: "Etwa {{round(a / 100) + round(b / 100) + round(c / 100)}} € – genau sind es {{(a + b + c) / 100}} €."
    variants:
      params: { a: "int[105,995]", b: "int[105,995]", c: "int[105,995]" }
      defaults: { a: 389, b: 512, c: 149 }

  - kind: problem
    id: rest
    widget: numberline
    prompt: Du zahlst 7,50 € mit einem 10-€-Schein. Markiere dein Rückgeld.
    params: { min: 0, max: 5, ticks: 2, labels: decimals }
    answer: { value: 2.5 }
    hints:
      - Von 7,50 bis 10.
    explanation: 10 − 7,50 = 2,50 €.

  - kind: problem
    id: stimmt
    widget: choice
    prompt: Vier Artikel kosten je etwa 3 €. Die Kasse zeigt 21,47 €. Stimmt das?
    params:
      options:
        - { label: Nein – etwa 12 € wären richtig., correct: true }
        - { label: Ja, feedback: "4 · 3 € sind 12 €. 21,47 € ist viel zu viel." }
    hints:
      - 4 · 3.
    explanation: Der Überschlag zeigt sofort – da wurde etwas doppelt gebucht.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Drei Artikel zu je 3,98 € und zwei zu je 1,49 €. Was kostet alles genau?
    params:
      unit: €
    answer:
      value: 14.92
    hints:
      - Rechne mit 4 € und 1,50 € und zieh die fehlenden Cent ab.
    explanation: "12 + 3 = 15 €, minus 3 · 2 ct und 2 · 1 ct: 14,92 €."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: 500 g kosten 2,79 €, die 750-g-Packung 3,99 €. Welche ist pro Kilo günstiger?
    params:
      options:
        - label: "Die große: 5,32 € statt 5,58 € pro Kilo"
          correct: true
        - label: Die kleine
          feedback: 2,79 € mal 2 sind 5,58 € pro Kilo – mehr als bei der großen.
        - label: Beide gleich
          feedback: Rechne beide auf 1 kg um.
    hints:
      - Rechne beide Preise auf 1 kg um.
    explanation: "3,99 € : 0,75 = 5,32 €. Der **Grundpreis** macht Packungen vergleichbar."
    difficulty: 3

srs:
  cards_from: [ueberschlag, stimmt]
