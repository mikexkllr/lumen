id: math.decimals.place
type: concept
title: Places after the decimal point
summary: Tenths, hundredths, and why 0.5 is greater than 0.45.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [dec.place]
estimated_minutes: 14
steps:
  - kind: problem
    id: null-vier
    widget: numberline
    prompt: Place the marker at 0.4.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: 0.4 }
    hints:
      - The line from 0 to 1 is divided into 10 parts.
    explanation: 0.4 is 4 tenths, the fourth tick mark.

  - kind: explain
    id: s2
    body: |
      The first place after the decimal point counts **tenths**, the second counts **hundredths**.
      0.4 is 4 tenths, so $\frac{4}{10}$. 0.04 is 4 hundredths.

  - kind: problem
    id: groesser
    widget: choice
    prompt: Which number is greater?
    params:
      layout: grid
      options:
        - { label: "0.5", correct: true }
        - { label: "0.45", feedback: "More digits does not mean greater. Compare place by place: 5 tenths is more than 4 tenths." }
        - { label: Both are equal, feedback: "0.5 = 0.50. And 50 hundredths is more than 45 hundredths." }
    hints:
      - Write both with two places after the decimal point.
    explanation: 0.5 = 0.50 > 0.45.

  - kind: problem
    id: sortieren
    widget: order
    prompt: Sort from small to large.
    params:
      direction: horizontal
      items: [{ label: "0.09" }, { label: "0.1" }, { label: "0.25" }, { label: "0.3" }]
      startLabel: small
      endLabel: large
    hints:
      - Add zeros until all numbers have the same number of places.
    explanation: 0.09 < 0.10 < 0.25 < 0.30.

  - kind: problem
    id: zehntel
    widget: numeric
    prompt: Write {{a}}/10 as a decimal.
    params: { placeholder: "e.g. 0.5" }
    answer: { value: "{{a / 10}}", form: decimal }
    hints:
      - Tenths go in the first place after the decimal point.
    explanation: "{{a}}/10 = {{a / 10}}."
    variants:
      params: { a: "int[1,9]" }
      defaults: { a: 7 }

  - kind: problem
    id: hundertstel
    widget: numeric
    prompt: Write 3/100 as a decimal.
    params: { placeholder: "e.g. 0.5" }
    answer: { value: 0.03, form: decimal }
    feedback:
      - when: "numval(state.input) == 0.3"
        misconception: place-value
        text: 0.3 is 3 tenths. Hundredths go in the second place after the decimal point.
    hints:
      - Hundredths go in the second place.
    explanation: 3/100 = 0.03.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 0.5 is greater than 0.45.
          right: true
        - text: 0.125 is greater than 0.2 because 125 is greater than 2.
          right: false
          why: "Compare place by place: 1 tenth against 2 tenths."
        - text: 0.30 and 0.3 are equal.
          right: true
        - text: The second place after the point counts thousandths.
          right: false
          why: It counts hundredths.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Write 7/8 as a decimal.
    answer:
      value: 0.875
      form: decimal
    hints:
      - 1/8 is half of 1/4 = 0.25.
    explanation: 1/8 = 0.125 and 7 · 0.125 = 0.875.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Each place is worth ten times the one to its right. That is **place value**. So times 10 shifts every digit one place left: 0.47 · 10 = 4.7."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Calculate: {{a / 1000}} · 100"
    answer:
      value: "{{a / 10}}"
    feedback:
      - when: numval(state.input) == a / 100
        misconception: one-shift
        text: That was only times 10. Times 100 means two places.
    hints:
      - Times 100 shifts every digit two places left.
      - Thousandths become tenths.
    explanation: "{{a / 1000}} · 100 = {{a / 10}}. The digits stay, only the decimal point moves."
    difficulty: 2
    variants:
      params:
        a: int[12,98]
      constraints:
        - a % 10 != 0
      defaults:
        a: 47

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numberline
    prompt: Put the marker on 0.35.
    params:
      min: 0
      max: 1
      ticks: 20
      labels: decimals
    answer:
      value: 0.35
    hints:
      - Each tick is 0.05 further.
      - 0.35 is exactly between 0.3 and 0.4.
    explanation: 0.35 is 3 tenths and 5 hundredths – halfway between 0.3 and 0.4.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: order
    prompt: Order from smallest to largest.
    params:
      items:
        - label: "0.03"
        - label: "0.033"
        - label: "0.3"
        - label: "0.303"
        - label: "0.33"
    hints:
      - Compare place by place from the left.
      - "Add zeros until all have three places: 0.030 – 0.033 – …"
    explanation: 0.030 < 0.033 < 0.300 < 0.303 < 0.330.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which fraction has a decimal that **never ends**?
    params:
      options:
        - label: 1/6
          correct: true
        - label: 3/8
          feedback: 3/8 = 0.375 – that ends.
        - label: 7/20
          feedback: 7/20 = 0.35 – that ends.
    hints:
      - Factor the denominators into primes. Which fit into a power of ten?
    explanation: A simplified fraction ends only if its denominator consists of 2s and 5s alone. 6 contains a 3.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: A simplified fraction terminates as a decimal exactly when its denominator has only the **prime factors** 2 and 5. Because 10 = 2 · 5. That is why 1/8 terminates but 1/6 does not.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: buckets
    prompt: Does the decimal terminate or repeat?
    params:
      buckets:
        - id: b1
          label: terminates
        - id: b2
          label: repeats
      items:
        - label: 3/8
          bucket: b1
        - label: 7/20
          bucket: b1
        - label: 9/40
          bucket: b1
        - label: 2/3
          bucket: b2
        - label: 5/12
          bucket: b2
        - label: 1/7
          bucket: b2
    hints:
      - Break the denominator into prime factors.
      - 12 = 2 · 2 · 3 – the 3 is the problem.
    explanation: 8, 20 and 40 are made only of 2s and 5s. 3, 12 and 7 contain other primes.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Is 0.999… (nines forever) less than 1?
    params:
      options:
        - label: Then which number would lie in between? There is none.
          feedback: Welche Zahl läge dann dazwischen? Es gibt keine.
        - label: No – 0.999… is exactly 1
          correct: true
        - label: Yes we can – it can be proven.
          feedback: Doch, man kann es beweisen.
    hints:
      - 1/3 = 0.333… What is 3 · 1/3?
      - 3 · 0.333… = 0.999…
    explanation: 3 · 1/3 = 1 and 3 · 0.333… = 0.999…. So 0.999… = 1. A number can have two decimal forms.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: numeric
    prompt: Write 0.121212… as a simplified fraction.
    answer:
      value: 4/33
      form: simplified
    hints:
      - Call the number x. What is 100 · x − x?
      - 99x = 12.
    explanation: 100x = 12.1212…, minus x gives 99x = 12. So x = 12/99 = 4/33.
    difficulty: 3

srs:
  cards_from: ["zehntel", "hundertstel"]
