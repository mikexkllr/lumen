id: math.decimals.percent
type: concept
title: Prozent verstehen
summary: Prozent heißt »von Hundert«.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [pct.basics]
estimated_minutes: 7
steps:
  - kind: problem
    id: dreissig
    widget: fraction
    prompt: Der Streifen ist in 10 gleiche Teile geteilt. Färbe 30 %.
    params: { parts: 10 }
    answer: { fraction: "3/10" }
    hints:
      - Ein Zehntel sind 10 %.
    explanation: 30 % = 30/100 = 3/10.

  - kind: explain
    body: |
      **Prozent** heißt »von Hundert«. 30 % sind $\frac{30}{100} = \frac{3}{10} = 0{,}3$.
      100 % sind das Ganze.

  - kind: problem
    id: viertel
    widget: numeric
    prompt: Wie viel Prozent sind 1/4?
    params: { unit: "%" }
    answer: { value: 25 }
    feedback:
      - when: "numval(state.input) == 4 || numval(state.input) == 14"
        text: 1/4 heißt ein Viertel des Ganzen. Das Ganze sind 100 %.
    hints:
      - Wie viel ist ein Viertel von 100?
    explanation: "100 : 4 = 25, also 25 %."

  - kind: problem
    id: prozentwert
    widget: numeric
    prompt: Wie viel sind {{p}} % von {{g}}?
    answer: { value: "{{p * g / 100}}" }
    hints:
      - "1 % von {{g}} ist {{g / 100}}."
      - "Dann mal {{p}}."
    explanation: "{{g}} · {{p}} : 100 = {{p * g / 100}}."
    variants:
      params: { p: "choice[10,20,25,50,75]", g: "choice[40,80,120,200,360]" }
      constraints: ["isInt(p * g / 100)"]
      defaults: { p: 25, g: 80 }

  - kind: problem
    id: trick
    widget: choice
    prompt: Was ist mehr – 50 % von 30 oder 30 % von 50?
    params:
      options:
        - { label: Beides gleich viel, correct: true }
        - { label: "50 % von 30", feedback: "Rechne nach: 50 % von 30 sind 15, 30 % von 50 auch." }
        - { label: "30 % von 50", feedback: "Rechne nach: beides ergibt 15." }
    hints:
      - Rechne beide aus.
    explanation: 0,5 · 30 = 15 und 0,3 · 50 = 15. Malnehmen ist vertauschbar.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: 12 von 48 Schülern spielen ein Instrument. Wie viel Prozent sind das?
    params: { unit: "%" }
    answer: { value: 25 }
    hints:
      - "Kürze 12/48."
      - "12/48 = 1/4."
    explanation: 12/48 = 1/4 = 25 %.

srs:
  cards_from: ["steps[3]"]
