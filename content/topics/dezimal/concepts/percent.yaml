id: math.decimals.percent
type: concept
title: Prozent verstehen
summary: Prozent heißt »von Hundert«.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [pct.basics]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der Erdoberfläche sind von Wasser bedeckt?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 71
      tolerance: 7
    explanation: Rund 71 %. Prozent macht Anteile vergleichbar – egal wie groß das Ganze ist.


  - kind: problem
    id: dreissig
    widget: fraction
    prompt: Der Streifen ist in 10 gleiche Teile geteilt. Färbe 30 %.
    params: { parts: 10 }
    answer: { fraction: "3/10" }
    hints:
      - Ein Zehntel sind 10 %.
    explanation: 30 % = 30/100 = 3/10.

  - kind: explain
    id: s2
    body: |
      **Prozent** heißt »von Hundert«. 30 % sind $\frac{30}{100} = \frac{3}{10} = 0{,}3$.
      100 % sind das Ganze.

  - kind: problem
    id: viertel
    widget: numeric
    prompt: Wie viel Prozent sind 1/4?
    params: { unit: "%" }
    answer: { value: 25 }
    feedback:
      - when: "numval(state.input) == 4 || numval(state.input) == 14"
        text: 1/4 heißt ein Viertel des Ganzen. Das Ganze sind 100 %.
    hints:
      - Wie viel ist ein Viertel von 100?
    explanation: "100 : 4 = 25, also 25 %."

  - kind: problem
    id: prozentwert
    widget: numeric
    prompt: Wie viel sind {{p}} % von {{g}}?
    answer: { value: "{{p * g / 100}}" }
    hints:
      - "1 % von {{g}} ist {{g / 100}}."
      - "Dann mal {{p}}."
    explanation: "{{g}} · {{p}} : 100 = {{p * g / 100}}."
    variants:
      params: { p: "choice[10,20,25,50,75]", g: "choice[40,80,120,200,360]" }
      constraints: ["isInt(p * g / 100)"]
      defaults: { p: 25, g: 80 }

  - kind: problem
    id: trick
    widget: choice
    prompt: Was ist mehr – 50 % von 30 oder 30 % von 50?
    params:
      options:
        - { label: Beides gleich viel, correct: true }
        - { label: "50 % von 30", feedback: "Rechne nach: 50 % von 30 sind 15, 30 % von 50 auch." }
        - { label: "30 % von 50", feedback: "Rechne nach: beides ergibt 15." }
    hints:
      - Rechne beide aus.
    explanation: 0,5 · 30 = 15 und 0,3 · 50 = 15. Malnehmen ist vertauschbar.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: 12 von 48 Schülern spielen ein Instrument. Wie viel Prozent sind das?
    params: { unit: "%" }
    answer: { value: 25 }
    hints:
      - "Kürze 12/48."
      - "12/48 = 1/4."
    explanation: 12/48 = 1/4 = 25 %.

  - kind: problem
    id: c1
    widget: match
    prompt: Was gehört zusammen?
    params:
      pairs:
        - left: 1/2
          right: 50 %
        - left: 1/5
          right: 20 %
        - left: 3/4
          right: 75 %
        - left: 1/8
          right: 12,5 %
        - left: 1/20
          right: 5 %
    hints:
      - Erweitere den Bruch auf den Nenner 100.
    explanation: Prozent ist ein Bruch mit dem Nenner 100.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 18 sind 45 % einer Zahl. Wie heißt die Zahl?
    answer:
      value: 40
    hints:
      - Wenn 45 % gleich 18 sind – wie viel ist dann 5 %?
    explanation: 5 % sind 2, also sind 100 % genau 40.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Zustimmung steigt von 20 % auf 25 %. Wie stark ist der Anstieg?
    params:
      options:
        - label: 5 Prozentpunkte – das sind 25 Prozent
          correct: true
        - label: 5 Prozent
          feedback: 5 % von 20 % wäre nur ein Anstieg auf 21 %.
        - label: 25 Prozentpunkte
          feedback: Die Differenz 25 − 20 ist 5 Punkte.
    hints:
      - Wie groß ist die Differenz – und wie groß im Verhältnis zum alten Wert?
    explanation: "**Prozentpunkte** messen die Differenz, **Prozent** das Verhältnis: 5 von 20 ist ein Viertel."
    difficulty: 3

srs:
  cards_from: ["prozentwert"]
