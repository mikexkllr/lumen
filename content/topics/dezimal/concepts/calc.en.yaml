id: math.decimals.calc
type: concept
title: Calculating with decimals
summary: Line up the decimal points, and count places when you multiply.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [dec.calc]
estimated_minutes: 7
steps:
  - kind: problem
    id: plus
    widget: numeric
    prompt: "Calculate: 0.7 + 0.5"
    answer: { value: 1.2 }
    feedback:
      - when: "numval(state.input) == 0.12"
        misconception: decimal-concat
        text: 7 tenths plus 5 tenths is 12 tenths. And 12 tenths is 1.2.
    hints:
      - Work in tenths. 7 + 5.
    explanation: 0.7 + 0.5 = 1.2.

  - kind: explain
    id: s2
    body: |
      When you add or subtract, put the **decimal points** in a line.
      Then calculate as you would with whole numbers.

  - kind: problem
    id: plus-variante
    widget: numeric
    prompt: "Calculate: {{x}} + {{y}}"
    answer: { value: "{{x + y}}" }
    hints:
      - Write the decimal points in a line.
      - First the tenths, then the ones.
    explanation: "{{x}} + {{y}} = {{x + y}}."
    variants:
      params: { a: "int[11,59]", b: "int[11,59]" }
      derive: { x: "a / 10", y: "b / 10" }
      constraints: ["a % 10 != 0", "b % 10 != 0"]
      defaults: { a: 23, b: 48 }

  - kind: problem
    id: mal-ganz
    widget: numeric
    prompt: "Calculate: 2.5 · 4"
    answer: { value: 10 }
    hints:
      - 2.5 · 2 = 5.
    explanation: 2.5 · 4 = 10.

  - kind: problem
    id: mal-komma
    widget: numeric
    prompt: "Calculate: 1.2 · 0.5"
    answer: { value: 0.6 }
    feedback:
      - when: "numval(state.input) == 6"
        misconception: decimal-places
        text: Count the places after the decimal point. 1.2 has one, 0.5 has one. The result needs two, so 0.60.
    hints:
      - First calculate 12 · 5 without the decimal points.
      - Then place the decimal point two places from the right.
    explanation: 12 · 5 = 60. With two places after the decimal point, that is 0.60 = 0.6.
    difficulty: 2

  - kind: problem
    id: viertel
    widget: choice
    prompt: Which calculations give 0.25? Choose all that apply.
    params:
      multiple: true
      options:
        - { label: "1 ÷ 4", correct: true }
        - { label: "0.5 · 0.5", correct: true }
        - { label: "2 ÷ 5", feedback: "2 ÷ 5 = 0.4." }
        - { label: "0.2 + 0.5", feedback: "0.2 + 0.5 = 0.7." }
    hints:
      - Work out each option quickly.
    explanation: "1 ÷ 4 = 0.25 and 0.5 · 0.5 = 0.25."

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "For 0.3 · 0.2 you compute 3 · 2 = 6 and count the decimal places: [[two]] in total. The result is [[0.06]]."
      distractors:
        - "0.6"
        - one
        - "0.6"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Compute: 3.6 ÷ 0.4"
    answer:
      value: 9
    hints:
      - "Shift the point in both numbers: 36 ÷ 4."
    explanation: 36 ÷ 4 = 9. Scaling both by 10 does not change the quotient.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You divide a positive number by 0.25. What happens?
    params:
      options:
        - label: It becomes four times as large
          correct: true
        - label: It becomes a quarter as large
          feedback: That would be multiplying by 0.25.
        - label: It stays the same
          feedback: Only dividing by 1 keeps the number.
    hints:
      - How often does a quarter fit into one whole?
    explanation: Dividing by 1/4 is multiplying by 4. Dividing by a number below 1 enlarges.
    difficulty: 3

srs:
  cards_from: ["plus-variante"]
