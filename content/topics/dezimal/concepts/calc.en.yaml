id: math.decimals.calc
type: concept
title: Calculating with decimals
summary: Line up the decimal points, and count places when you multiply.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [dec.calc]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Multiplying as area
    body: Why is 0.3 · 0.4 smaller than both numbers? The whole square is 1 by 1. The shaded block is 0.3 wide and 0.4 tall. Count its little squares, then tap on another column. Each one is a **hundredth**.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 100
        shape: square
        shaded:
          - 0
          - 1
          - 2
          - 10
          - 11
          - 12
          - 20
          - 21
          - 22
          - 30
          - 31
          - 32

  - kind: problem
    id: plus
    widget: numeric
    prompt: "Calculate: 0.7 + 0.5"
    answer: { value: 1.2 }
    feedback:
      - when: "numval(state.input) == 0.12"
        misconception: decimal-concat
        text: 7 tenths plus 5 tenths is 12 tenths. And 12 tenths is 1.2.
    hints:
      - Work in tenths. 7 + 5.
    explanation: 0.7 + 0.5 = 1.2.

  - kind: explain
    id: s2
    body: |
      When you add or subtract, put the **decimal points** in a line.
      Then calculate as you would with whole numbers.

  - kind: problem
    id: plus-variante
    widget: numeric
    prompt: "Calculate: {{x}} + {{y}}"
    answer: { value: "{{x + y}}" }
    hints:
      - Write the decimal points in a line.
      - First the tenths, then the ones.
    explanation: "{{x}} + {{y}} = {{x + y}}."
    variants:
      params: { a: "int[11,59]", b: "int[11,59]" }
      derive: { x: "a / 10", y: "b / 10" }
      constraints: ["a % 10 != 0", "b % 10 != 0"]
      defaults: { a: 23, b: 48 }

  - kind: problem
    id: mal-ganz
    widget: numeric
    prompt: "Calculate: 2.5 · 4"
    answer: { value: 10 }
    hints:
      - 2.5 · 2 = 5.
    explanation: 2.5 · 4 = 10.

  - kind: problem
    id: mal-komma
    widget: numeric
    prompt: "Calculate: 1.2 · 0.5"
    answer: { value: 0.6 }
    feedback:
      - when: "numval(state.input) == 6"
        misconception: decimal-places
        text: Count the places after the decimal point. 1.2 has one, 0.5 has one. The result needs two, so 0.60.
    hints:
      - First calculate 12 · 5 without the decimal points.
      - Then place the decimal point two places from the right.
    explanation: 12 · 5 = 60. With two places after the decimal point, that is 0.60 = 0.6.
    difficulty: 2

  - kind: problem
    id: viertel
    widget: choice
    prompt: Which calculations give 0.25? Choose all that apply.
    params:
      multiple: true
      options:
        - { label: "1 ÷ 4", correct: true }
        - { label: "0.5 · 0.5", correct: true }
        - { label: "2 ÷ 5", feedback: "2 ÷ 5 = 0.4." }
        - { label: "0.2 + 0.5", feedback: "0.2 + 0.5 = 0.7." }
    hints:
      - Work out each option quickly.
    explanation: "1 ÷ 4 = 0.25 and 0.5 · 0.5 = 0.25."

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "For 0.3 · 0.2 you compute 3 · 2 = 6 and count the decimal places: [[two]] in total. The result is [[0.06]]."
      distractors:
        - "0.6"
        - one
        - "0.6"

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Work out $0.2 \cdot 0.3$ as an area. Shade a block that is 0.2 wide and 0.3 tall.
    params:
      parts: 100
      shape: square
    answer:
      fraction: 6/100
      equivalent: false
    hints:
      - 0.2 wide means 2 columns, 0.3 tall means 3 rows.
      - The block has 2 · 3 = 6 little squares. Shade them.
    explanation: "6 hundredths: $0.2 \\cdot 0.3 = 0.06$. Decimals below 1 make the result smaller."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Compute: 3.6 ÷ 0.4"
    answer:
      value: 9
    hints:
      - "Shift the point in both numbers: 36 ÷ 4."
    explanation: 36 ÷ 4 = 9. Scaling both by 10 does not change the quotient.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "When **multiplying**, add up the decimal places. 1.2 · 0.5: work out 12 · 5 = 60 and give it 2 places. Result 0.60."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Calculate: {{a / 10}} · {{b / 10}}"
    answer:
      value: "{{a * b / 100}}"
    feedback:
      - when: numval(state.input) == a * b / 10
        misconception: decimal-places
        text: Two factors with one place each – the result needs two.
    hints:
      - "First without decimals: {{a}} · {{b}}."
      - "{{a * b}} – now two decimal places."
    explanation: "{{a}} · {{b}} = {{a * b}}, with two places: {{a * b / 100}}."
    difficulty: 2
    variants:
      params:
        a: int[11,49]
        b: int[2,9]
      constraints:
        - a % 10 != 0
      defaults:
        a: 23
        b: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Calculate: 4.5 : 0.09"
    answer:
      value: 50
    feedback:
      - when: numval(state.input) == 5
        misconception: shift-once
        text: "That would be 4.5 : 0.9. The decimal point must move two places."
    hints:
      - "Make the divisor whole: multiply both by 100."
      - "450 : 9 = ?"
    explanation: "4.5 : 0.09 = 450 : 9 = 50. Shifting both numbers equally keeps the quotient."
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 0.3 · 0.2 = 0.06
          right: true
          why: "Two places: 3 · 2 = 6 → 0.06."
        - text: 0.1 · 0.1 = 0.1
          right: false
          why: "A tenth of a tenth is a hundredth: 0.01."
        - text: "2 : 0.5 = 1"
          right: false
          why: "Four halves fit into 2: 4."
        - text: 0.2 + 0.03 = 0.5
          right: false
          why: "Line up the points: 0.23."
        - text: 1.5 · 2 = 3
          right: true
          why: Twice one and a half is three.
    hints:
      - Check with a rough estimate.
      - Times a number below 1 makes smaller, dividing makes bigger.
    explanation: "With decimals it almost always helps to ask: is the result a plausible size?"
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You divide a positive number by 0.25. What happens?
    params:
      options:
        - label: It becomes four times as large
          correct: true
        - label: It becomes a quarter as large
          feedback: That would be multiplying by 0.25.
        - label: It stays the same
          feedback: Only dividing by 1 keeps the number.
    hints:
      - How often does a quarter fit into one whole?
    explanation: Dividing by 1/4 is multiplying by 4. Dividing by a number below 1 enlarges.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Why does the places rule work? 1.2 = $\frac{12}{10}$ and 0.5 = $\frac{5}{10}$. The product is $\frac{60}{100}$. The **powers of ten** in the denominators multiply – their zeros add up.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Calculate: 0.25 · 0.25"
    answer:
      value: 0.0625
    feedback:
      - when: numval(state.input) == 0.625
        misconception: decimal-places
        text: Two plus two places – the result needs four.
    hints:
      - 25 · 25 = 625.
      - How many decimal places in total?
    explanation: "625 with four places: 0.0625. Check: a quarter of a quarter is one sixteenth."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Many programs compute 0.1 + 0.2 = 0.30000000000000004. Why?
    params:
      options:
        - label: Computers store numbers in binary – there 0.1 never ends, like 1/3 for us
          correct: true
        - label: It happens on every computer.
          feedback: Das passiert auf jedem Rechner.
        - label: It rounds correctly – 0.1 just does not exist exactly in binary.
          feedback: Er rundet korrekt – nur gibt es 0,1 binär nicht genau.
    hints:
      - Computers use powers of two instead of powers of ten.
      - Does 10 = 2 · 5 cause trouble with the 5 in binary?
    explanation: 1/10 has the prime factor 5 in the denominator. In base two it repeats and has to be rounded.
    difficulty: 3

srs:
  cards_from: ["plus-variante"]
