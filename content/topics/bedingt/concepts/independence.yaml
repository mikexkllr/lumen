id: stats.conditional.independence
type: concept
title: Unabhängig oder nicht?
summary: Wenn das eine nichts über das andere verrät.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Hat die Münze Einfluss?
    body: "Bringt ein Glücksbringer wirklich Glück? Hier fallen eine Münze und ein Würfel zusammen. Wirf 100-mal und vergleiche: Kommt die Sechs mit Kopf öfter als mit Zahl? Wenn nicht, sind beide **unabhängig**."
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: Kopf + 6
            weight: 1
          - label: Kopf + 1–5
            weight: 5
          - label: Zahl + 6
            weight: 1
          - label: Zahl + 1–5
            weight: 5
        sample:
          - 10
          - 100

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Unabhängig oder abhängig?
    params:
      buckets: [{ label: unabhängig }, { label: abhängig }]
      items:
        - { label: Zwei Münzwürfe nacheinander, bucket: unabhängig }
        - { label: Würfel und Wetter, bucket: unabhängig }
        - { label: Regen und nasse Straße, bucket: abhängig }
        - { label: Zwei Karten ohne Zurücklegen, bucket: abhängig }
        - { label: Größe und Gewicht, bucket: abhängig }
    hints:
      - Ändert das Wissen über das eine die Chance des anderen?
    explanation: Unabhängig heißt – das eine verrät nichts über das andere.

  - kind: explain
    id: s2
    body: |
      Bei **unabhängigen** Ereignissen gilt P(A und B) = P(A) · P(B).
      Sind sie abhängig, stimmt diese einfache Regel nicht mehr.

  - kind: problem
    id: beide
    widget: numeric
    prompt: "Es regnet mit 20 %. Unabhängig davon klingelt dein Wecker zu {{p}} % zu spät. Wie wahrscheinlich ist beides?"
    params: { unit: "%" }
    answer: { value: "{{20 * p / 100}}" }
    hints:
      - "0,2 · {{p / 100}}."
    explanation: "0,2 · {{p / 100}} = {{20 * p / 10000}} – also {{20 * p / 100}} %."
    variants:
      params: { p: "choice[10,25,50]" }
      defaults: { p: 10 }

  - kind: problem
    id: falle
    widget: choice
    prompt: 1 % der Häuser hatten einen Brand, 1 % einen defekten Rauchmelder. Ist »beides zugleich« dann 1 % · 1 % = 0,01 %?
    params:
      options:
        - { label: Nur wenn beides unabhängig ist, correct: true }
        - { label: "Ja, immer", feedback: "Hängen die Dinge zusammen, ist das Produkt falsch." }
    hints:
      - Könnte ein Defekt mit Bränden zusammenhängen?
    explanation: Malnehmen darf man nur bei Unabhängigkeit. Das wird in Gutachten oft vergessen.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Beeinflusst das eine das andere?
    params:
      buckets:
        - id: b1
          label: Unabhängig
        - id: b2
          label: Abhängig
      items:
        - label: Zwei Münzwürfe
          bucket: b1
        - label: Ein Würfel und eine Münze
          bucket: b1
        - label: Regen heute und Regen morgen
          bucket: b2
        - label: Zwei Karten ohne Zurücklegen
          bucket: b2
        - label: Körpergröße und Schuhgröße
          bucket: b2
    hints:
      - Ändert das erste Ergebnis die Chancen für das zweite?
    explanation: Nur bei unabhängigen Ereignissen darf man die Chancen einfach malnehmen.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: An 20 % der Tage regnet es. Unabhängig davon klingelt dein Wecker an jedem zweiten Tag zu spät. Das Raster zeigt 100 Tage. Färbe die Tage, an denen beides passiert.
    params:
      parts: 100
      shape: square
    answer:
      fraction: 1/10
    hints:
      - An 20 der 100 Tage regnet es.
      - "An der Hälfte davon klingelt der Wecker zu spät: 10 Tage."
    explanation: $0{,}2 \cdot 0{,}5 = 0{,}1$ – also 10 von 100 Tagen. Bei **unabhängigen** Ereignissen darf man so multiplizieren.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zwei Ereignisse schließen sich gegenseitig aus – etwa »Würfel zeigt 1« und »Würfel zeigt 6«. Sind sie unabhängig?
    params:
      options:
        - label: Nein – weiß man, dass das eine eintrat, ist das andere unmöglich
          correct: true
        - label: Ja – sie haben nichts miteinander zu tun
          feedback: "Im Gegenteil: Sie hängen maximal zusammen."
        - label: Das hängt vom Würfel ab
          feedback: Es gilt für jeden Würfel.
    hints:
      - Verrät das eine etwas über das andere?
    explanation: »Unvereinbar« und »unabhängig« werden oft verwechselt – sie sind fast Gegenteile.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: choice
    prompt: Von 100 Menschen tragen 40 eine Brille, 50 sind Frauen, und 20 sind Frauen mit Brille. Sind »Brille« und »Frau« unabhängig?
    params:
      options:
        - label: Ja – 0,4 · 0,5 = 0,2
          correct: true
        - label: Nein, Frauen tragen öfter Brille
          feedback: Unter Frauen sind es 20 von 50 = 40 % – genau wie bei allen.
        - label: Das kann man ohne Experiment nicht sagen
          feedback: Die Tabelle reicht zum Prüfen.
    hints:
      - Rechne P(Brille) · P(Frau).
      - Vergleiche mit P(Brille und Frau) = 0,2.
    explanation: "Das Produkt stimmt mit dem gemeinsamen Anteil überein. Gleichwertig: P(Brille | Frau) = P(Brille). Das ist **Unabhängigkeit**."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Von 200 Menschen trinken 80 Kaffee, 50 schlafen schlecht. Wären beide unabhängig, wie viele Kaffeetrinker würden schlecht schlafen?
    answer:
      value: 20
    hints:
      - P(Kaffee) = 0,4 und P(schlecht) = 0,25.
      - 0,4 · 0,25 · 200.
    explanation: 0,1 · 200 = 20. Zählt man deutlich mehr, hängen Kaffee und Schlaf zusammen. Genau so arbeitet der Chi-Quadrat-Test.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Sally Clark wurde 1999 verurteilt, weil zwei ihrer Babys starben. Der Gutachter rechnete: 1/8500 · 1/8500 = 1 zu 73 Millionen. Wo lag der Fehler?"
    params:
      options:
        - label: Die Fälle sind nicht unabhängig – gemeinsame Gene und Umwelt erhöhen das Risiko beim zweiten Kind
          correct: true
        - label: Er hat sich verrechnet
          feedback: Die Multiplikation stimmt – sie durfte nur nicht angewendet werden.
        - label: Die Zahl 8500 war erfunden
          feedback: Sie stammte aus einer Studie.
    hints:
      - Multiplizieren darf man nur bei Unabhängigkeit.
    explanation: Sie wurde 2003 freigesprochen. Der Fall gilt als Lehrstück für Statistik vor Gericht.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Zwei Münzen. A = »erste zeigt Kopf«, B = »zweite zeigt Kopf«, C = »beide zeigen dasselbe«. Je zwei davon sind unabhängig. Sind alle drei zusammen unabhängig?
    params:
      options:
        - label: Nein – aus A und B folgt C sicher
          correct: true
        - label: Ja, wenn je zwei unabhängig sind, gilt es für alle
          feedback: Paarweise reicht nicht.
        - label: Nein, schon A und C hängen ab
          feedback: P(A und C) = 1/4 = P(A) · P(C) – die beiden sind unabhängig.
    hints:
      - Wie groß ist P(A und B und C)?
      - Vergleiche mit P(A) · P(B) · P(C) = 1/8.
    explanation: P(A und B und C) = 1/4, nicht 1/8. **Paarweise** Unabhängigkeit ist schwächer als echte Unabhängigkeit aller drei.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wann man Wahrscheinlichkeiten einfach multiplizieren darf – und was im Fall Sally Clark schiefging.
    params:
      keywords:
        - - unabhängig
          - independent
        - - multipl
          - mal
          - produkt
          - times
          - product
        - - gemeinsam
          - ursache
          - gene
          - familie
          - common
          - cause
          - family
      sample: Multiplizieren darf man nur, wenn die Ereignisse unabhängig sind. Zwei Kindstode in einer Familie können eine gemeinsame Ursache haben, etwa Gene. Dann ist das Produkt viel zu klein.
    explanation: Die Rechnung 1/8500 · 1/8500 setzte Unabhängigkeit voraus. Sie fehlte – und ein Gericht verurteilte eine Unschuldige.
    difficulty: 3

srs:
  cards_from: [einordnen, beide]
