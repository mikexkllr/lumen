id: stats.conditional.given
type: concept
title: Given That
summary: P(B | A) is not P(A | B).
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wet does not mean rain
    body: '"When it rains, the road is wet." Does it work the other way round? Shade all 30 days with a wet road. Look only at those cases – **given that** the road is wet. How often did it rain?'
    visual:
      widget: venn
      interactive: true
      params:
        sets:
          - rain
          - wet road
        outside: true
        counts:
          A: 0
          AB: 20
          B: 10
          O: 70
        universe: 100 days

  - kind: problem
    id: sport-musik
    widget: numeric
    visual: { widget: venn, params: { sets: [Sports, Music], outside: true, counts: { A: 20, B: 30, AB: 10, O: 40 } } }
    prompt: 100 people were surveyed. What share of the athletes also play music?
    params: { placeholder: "Fraction" }
    answer: { value: "1/3" }
    feedback:
      - when: "approx(numval(state.input), 1/10)"
        misconception: joint-not-conditional
        text: 10 out of 100 do both. But the question is only about the athletes.
    hints:
      - How many do sports? How many of them also play music?
    explanation: 30 do sports, and 10 of them also play music. 10/30 = 1/3.

  - kind: explain
    id: s2
    body: |
      **P(B | A)** means the **probability** of B when A is already known.
      You look only at the cases with A.

  - kind: problem
    id: musik-sport
    widget: numeric
    visual: { widget: venn, params: { sets: [Sports, Music], outside: true, counts: { A: 20, B: 30, AB: 10, O: 40 } } }
    prompt: Now the other way around. What share of the musicians also do sports?
    params: { placeholder: "Fraction" }
    answer: { value: "1/4" }
    feedback:
      - when: "approx(numval(state.input), 1/3)"
        misconception: swap-condition
        text: Now music is the condition. How many play music?
    hints:
      - 40 play music.
    explanation: 10 of 40 musicians do sports, which is 1/4. That differs from before.

  - kind: explain
    id: s4
    body: Are P(A | B) and P(B | A) equal?
    reveal:
      body: Usually not. Almost all pro basketball players are tall. But very few tall people play pro basketball.

  - kind: problem
    id: papst
    widget: choice
    prompt: Which is more likely?
    params:
      options:
        - { label: "Being Catholic, given that you are the pope", correct: true }
        - { label: "Being the pope, given that you are Catholic", feedback: "Among over a billion Catholics, there is exactly one pope." }
        - { label: Both are equal, feedback: "The condition makes the difference." }
    hints:
      - How many popes are there, and how many Catholics?
    explanation: The pope is always Catholic. The reverse is nearly impossible.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: P(A | B) and P(B | A) are always equal.
          right: false
          why: Almost all popes are Catholic, but almost no Catholic is pope.
        - text: P(A | B) considers only the cases in which B occurred.
          right: true
        - text: If A and B are independent, P(A | B) = P(A).
          right: true

  - kind: problem
    id: intro-c1
    widget: venn
    prompt: For P(sports | music) only certain cases count. Shade exactly the regions you then look at.
    params:
      sets:
        - Sports
        - Music
      outside: true
      counts:
        A: 20
        B: 30
        AB: 10
        O: 40
    answer:
      regions:
        - B
        - AB
    hints:
      - "The condition comes after the bar: music."
      - Shade everyone who does music – with and without sports.
    explanation: "Given music, only the 40 musicians count. 10 of them do sports: P(sports | music) = 10/40 = 1/4."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Of 200 guests 80 are vegetarians. 60 of the vegetarians and 30 of the others take salad. What share of the salad eaters is vegetarian? As a fraction.
    answer:
      value: 2/3
    hints:
      - 90 take salad in total.
    explanation: 60 of 90 = 2/3. The denominator is only the salad eaters.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "{{b}} % of all students play an instrument. {{c}} % play an instrument and sing in the choir. What percent of the instrument players sing in the choir?"
    answer:
      value: "{{100 * c / b}}"
    feedback:
      - when: numval(state.input) == c
        misconception: joint-vs-conditional
        text: That is the share of all students. The question asks for the share among instrument players.
    hints:
      - Look only at the {{b}} %.
      - Compute {{c}} ÷ {{b}}.
    explanation: P(choir | instrument) = {{c}} ÷ {{b}} = {{100 * c / b}} %. In general P(A | B) = P(A and B) ÷ P(B).
    difficulty: 2
    variants:
      params:
        b: choice[20,25,40,50]
        c: choice[5,10,15,20]
      constraints:
        - c < b
        - isInt(100 * c / b)
      defaults:
        b: 40
        c: 10

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: It rains with 30 %. When it rains, the bus is late with 50 %. How likely is »rain and late bus«?
    params:
      options:
        - label: 15 %
          correct: true
        - label: Conditional probabilities are multiplied, not added.
          feedback: Bedingte Wahrscheinlichkeiten werden multipliziert, nicht addiert.
        - label: That holds only on rainy days.
          feedback: Das gilt nur an Regentagen.
    hints:
      - P(A and B) = P(A) · P(B | A).
      - 0.3 · 0.5.
    explanation: 0.3 · 0.5 = 0.15. This multiplication rule always holds – even for dependent events.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "In court: “The chance that an innocent person has this DNA trace is 1 in a million – so the defendant is 99.9999% guilty.” What is the error?"
    params:
      options:
        - label: P(trace | innocent) is confused with P(innocent | trace)
          correct: true
        - label: DNA tests are unreliable
          feedback: The argument would be wrong even with a perfect test.
        - label: There is no error
          feedback: In a city of 5 million people about 5 others match.
    hints:
      - How many people in a city of millions would have the same trace?
    explanation: The **prosecutor’s fallacy**. It has demonstrably led to wrongful convictions.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: A family has two children. You learn that at least one is a girl. How likely are both girls? As a fraction.
    answer:
      value: 1/3
    feedback:
      - when: numval(state.input) == 1 / 2
        misconception: which-child
        text: That would be right if you knew the older child is a girl.
    hints:
      - "The four equally likely cases: BB, BG, GB, GG."
      - »At least one girl« removes only BB.
    explanation: JM, MJ, MM remain – only one is GG, so 1/3. The condition cuts down the set of cases.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: "Another family with two children: you see that the older one is a girl. How likely are both girls?"
    params:
      options:
        - label: 1/2
          correct: true
        - label: Now only GB and GG remain – two cases.
          feedback: Jetzt bleiben nur MJ und MM – zwei Fälle.
        - label: That would be without any information.
          feedback: Das wäre ohne jede Information.
    hints:
      - Which of the four cases fit »the older one is a girl«?
      - Only GB and GG.
    explanation: The answer depends on how you get the information. That is why even experts argue about such puzzles.
    difficulty: 3

srs:
  cards_from: [sport-musik, musik-sport]
