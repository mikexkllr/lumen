id: stats.conditional.retest
type: concept
title: Der zweite Test
summary: Zwei positive Tests sagen viel mehr.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Test war positiv. Du machst ihn noch einmal – wieder positiv. Bist du jetzt sicherer?
    params:
      options:
        - label: Ja – zwei Treffer sind viel stärker als einer
          correct: true
        - label: Nein, das ändert nichts
          feedback: Jeder Test bringt neue Information.
        - label: Ich bin jetzt weniger sicher
          feedback: Ein zweiter Treffer bestätigt den ersten.
    hints:
      - Wie wahrscheinlich ist zweimal Fehlalarm hintereinander?
    explanation: Wie viel sicherer genau, rechnen wir jetzt aus.

  - kind: explain
    id: s1
    body: |
      Erinnerung: Bei 1000 Menschen sind 10 krank. 9 davon testen positiv, dazu 89 **Gesunde**. Von 98 Positiven sind nur 9 krank.

  - kind: problem
    id: zweiter
    widget: numeric
    body: Alle 98 Positiven machen einen zweiten, unabhängigen Test. Er erkennt wieder 90 % der Kranken und schlägt bei 9 % der Gesunden an.
    prompt: Wie viele der 89 Gesunden testen erneut positiv? Runde.
    params: { unit: Menschen }
    answer: { value: 8, tolerance: 1 }
    hints:
      - 9 % von 89.
    explanation: Rund 8 Gesunde. Von den 9 Kranken sind wieder etwa 8 positiv.

  - kind: problem
    id: anteil
    widget: choice
    prompt: Nach zwei positiven Tests – wie wahrscheinlich ist man krank?
    params:
      options:
        - { label: Etwa 50 %, correct: true }
        - { label: Etwa 9 %, feedback: "So war es nach einem Test. Der zweite ändert viel." }
        - { label: Fast 100 %, feedback: "Noch nicht ganz – es gibt immer noch 8 Fehlalarme." }
    hints:
      - Etwa 8 Kranke und 8 Gesunde sind zweimal positiv.
    explanation: Etwa 8 zu 8 – also rund 50 %. Jeder Test verschiebt die Chancen.

  - kind: explain
    id: s4
    body: Was lernt man daraus?
    reveal:
      body: Ein einzelner Befund bei einer seltenen Krankheit ist oft ein Fehlalarm. Ärzte bestätigen darum mit einem zweiten, unabhängigen Test.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Jeder weitere unabhängige Test macht das Ergebnis [[sicherer]]. Der erste Befund wird zum neuen [[Vorwissen]].
      distractors:
        - teurer
        - Zufall

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Nach einem positiven Test liegt die Chance bei etwa 9 %. Von 1000 solchen Menschen sind also 90 krank. Der Test erkennt 90 % der Kranken. Wie viele der 90 testen erneut positiv?
    answer:
      value: 81
    hints:
      - 90 % von 90.
    explanation: 81 Kranke und rund 82 der 910 Gesunden – etwa 50 %. Jeder Test **aktualisiert** die Wahrscheinlichkeit.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Der Test erkennt 90 % der Kranken und schlägt bei 9 % der Gesunden an. Das **Likelihood-Verhältnis** ist 90 % : 9 %. Wie groß ist es?"
    answer:
      value: 10
    hints:
      - Teile die Trefferquote durch die Fehlalarmquote.
      - "90 : 9."
    explanation: Ein positiver Test ist 10-mal wahrscheinlicher bei Kranken als bei Gesunden. Jedes Positiv verzehnfacht die Chance.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Die Chance steht anfangs 1 : 99. Jeder positive Test multipliziert sie mit 10. Wie wahrscheinlich ist man nach **drei** positiven, unabhängigen Tests krank? In Prozent, gerundet."
    answer:
      value: 91
      tolerance: 1
    hints:
      - "Nach drei Tests: 1000 : 99."
      - "Wahrscheinlichkeit = 1000 : (1000 + 99)."
    explanation: 1000/1099 ≈ 91 %. Nach einem Test 9 %, nach zwei 50 %, nach drei 91 %. In Chancen ist Bayes nur Multiplizieren.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der zweite Test nutzt dasselbe Messprinzip und reagiert auf denselben Störstoff im Blut. Was bedeutet das?
    params:
      options:
        - label: Die Tests sind nicht unabhängig – ein zweites positives Ergebnis sagt viel weniger aus
          correct: true
        - label: Der zweite Test ist doppelt so zuverlässig
          feedback: Er wiederholt nur denselben Fehler.
        - label: Das ändert nichts
          feedback: Die Rechnung setzt Unabhängigkeit voraus.
    hints:
      - Wer beim ersten Test falsch-positiv war, ist es beim zweiten vermutlich wieder.
    explanation: Bestätigungstests sollten auf einem **anderen** Prinzip beruhen.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "Nach einem positiven Test (Chance 10 : 99) kommt ein **negativer** Test. Das Likelihood-Verhältnis für »negativ« ist 10 % : 91 % ≈ 0,11. Was gilt jetzt?"
    params:
      options:
        - label: "Die Chance sinkt auf etwa 1,1 : 99 – fast wie am Anfang"
          correct: true
        - label: Positiv und negativ heben sich genau auf
          feedback: Fast – aber 10 · 0,11 = 1,1, nicht genau 1.
        - label: Man ist sicher gesund
          feedback: Die Chance bleibt bei etwa 1 %.
    hints:
      - Multipliziere 10 mit 0,11.
      - "Vergleiche mit der Startchance 1 : 99."
    explanation: "Neue Chance ≈ 1,1 : 99, also etwa 1,1 %. Jeder Befund verschiebt die Chance um sein eigenes Likelihood-Verhältnis."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum zwei positive Tests so viel mehr sagen als einer – und wann nicht.
    params:
      keywords:
        - - fehlalarm
          - falsch
          - "false"
          - alarm
        - - unabhängig
          - independent
        - - zweit
          - beide
          - wieder
          - second
          - both
          - again
      sample: Ein Fehlalarm beim ersten Test wiederholt sich beim zweiten selten, wenn die Tests unabhängig sind. Darum bleiben nach zwei Positiven nur noch wenige Gesunde übrig. Misst der zweite Test dasselbe, hilft er kaum.
    explanation: Der zweite Test filtert die Fehlalarme des ersten – aber nur, wenn er unabhängig von ihm irrt.
    difficulty: 3

srs:
  cards_from: [anteil, zweiter]
