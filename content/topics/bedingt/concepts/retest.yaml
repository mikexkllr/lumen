id: stats.conditional.retest
type: concept
title: Der zweite Test
summary: Zwei positive Tests sagen viel mehr.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Erinnerung: Bei 1000 Menschen sind 10 krank. 9 davon testen positiv, dazu 89 Gesunde. Von 98 Positiven sind nur 9 krank.

  - kind: problem
    id: zweiter
    widget: numeric
    body: Alle 98 Positiven machen einen zweiten, unabhängigen Test. Er erkennt wieder 90 % der Kranken und schlägt bei 9 % der Gesunden an.
    prompt: Wie viele der 89 Gesunden testen erneut positiv? Runde.
    params: { unit: Menschen }
    answer: { value: 8, tolerance: 1 }
    hints:
      - 9 % von 89.
    explanation: Rund 8 Gesunde. Von den 9 Kranken sind wieder etwa 8 positiv.

  - kind: problem
    id: anteil
    widget: choice
    prompt: Nach zwei positiven Tests – wie wahrscheinlich ist man krank?
    params:
      options:
        - { label: Etwa 50 %, correct: true }
        - { label: Etwa 9 %, feedback: "So war es nach einem Test. Der zweite ändert viel." }
        - { label: Fast 100 %, feedback: "Noch nicht ganz – es gibt immer noch 8 Fehlalarme." }
    hints:
      - Etwa 8 Kranke und 8 Gesunde sind zweimal positiv.
    explanation: Etwa 8 zu 8 – also rund 50 %. Jeder Test verschiebt die Chancen.

  - kind: explain
    body: Was lernt man daraus?
    reveal:
      body: Ein einzelner Befund bei einer seltenen Krankheit ist oft ein Fehlalarm. Ärzte bestätigen darum mit einem zweiten, unabhängigen Test.

srs:
  cards_from: [anteil, zweiter]
