id: stats.conditional.retest
type: concept
title: The Second Test
summary: Two positive tests say much more.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Recap: among 1000 people, 10 are sick. 9 of them test positive, plus 89 healthy people. Of 98 positives, only 9 are sick.

  - kind: problem
    id: zweiter
    widget: numeric
    body: All 98 positives take a second, independent test. It again detects 90 % of the sick and flags 9 % of the healthy.
    prompt: How many of the 89 healthy people test positive again? Round.
    params: { unit: people }
    answer: { value: 8, tolerance: 1 }
    hints:
      - 9 % of 89.
    explanation: About 8 healthy people. Of the 9 sick, about 8 are positive again.

  - kind: problem
    id: anteil
    widget: choice
    prompt: After two positive tests, how likely are you to be sick?
    params:
      options:
        - { label: About 50 %, correct: true }
        - { label: About 9 %, feedback: "That was the value after one test. The second changes a lot." }
        - { label: Almost 100 %, feedback: "Not quite yet. There are still 8 false alarms." }
    hints:
      - About 8 sick and 8 healthy people are positive twice.
    explanation: About 8 to 8, so roughly 50 %. Each test shifts the odds.

  - kind: explain
    body: What can you learn from this?
    reveal:
      body: A single positive result for a rare disease is often a false alarm. That is why doctors confirm it with a second, independent test.

srs:
  cards_from: [anteil, zweiter]
