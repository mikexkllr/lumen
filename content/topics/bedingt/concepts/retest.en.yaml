id: stats.conditional.retest
type: concept
title: The Second Test
summary: Two positive tests say much more.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The second look
    body: With rare diseases, doctors almost never rely on a single result. Uncover the cards in any order. What is behind the **second test**?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🩸
            front: The HIV test
            back: A positive screening test is always confirmed by a second, different test. Only then is there a diagnosis.
          - icon: 🧪
            front: Rapid test, then lab
            back: After a positive rapid Covid test, a PCR test in the lab often followed.
          - icon: 🩻
            front: A suspicious image
            back: A suspicious mammogram leads to more images or a tissue sample. Most of the time it is harmless.

  - kind: problem
    id: hook
    widget: choice
    prompt: A test was positive. You take it again – positive again. Are you more certain now?
    params:
      options:
        - label: Yes – two hits are far stronger than one
          correct: true
        - label: No, that changes nothing
          feedback: Each test brings new information.
        - label: I am less certain now
          feedback: A second hit confirms the first.
    hints:
      - How likely are two false alarms in a row?
    explanation: How much more certain exactly, we will now work out.

  - kind: explain
    id: s1
    body: |
      Recap: among 1000 people, 10 are sick. 9 of them test positive, plus 89 **healthy** people. Of 98 positives, only 9 are sick.

  - kind: problem
    id: zweiter
    widget: numeric
    body: All 98 positives take a second, independent test. It again detects 90 % of the sick and flags 9 % of the healthy.
    prompt: How many of the 89 healthy people test positive again? Round.
    params: { unit: people }
    answer: { value: 8, tolerance: 1 }
    hints:
      - 9 % of 89.
    explanation: About 8 healthy people. Of the 9 sick, about 8 are positive again.

  - kind: problem
    id: anteil
    widget: choice
    prompt: After two positive tests, how likely are you to be sick?
    params:
      options:
        - { label: About 50 %, correct: true }
        - { label: About 9 %, feedback: "That was the value after one test. The second changes a lot." }
        - { label: Almost 100 %, feedback: "Not quite yet. There are still 8 false alarms." }
    hints:
      - About 8 sick and 8 healthy people are positive twice.
    explanation: About 8 to 8, so roughly 50 %. Each test shifts the odds.

  - kind: explain
    id: s4
    body: What can you learn from this?
    reveal:
      body: A single positive result for a rare disease is often a false alarm. That is why doctors confirm it with a second, independent test.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Every further independent test makes the result [[safer]]. The first finding becomes the new [[prior]].
      distractors:
        - costlier
        - chance

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: After one positive test the chance is about 9%. So of 1000 such people 90 are sick. The test detects 90% of the sick. How many of the 90 test positive again?
    answer:
      value: 81
    hints:
      - 90% of 90.
    explanation: 81 sick and about 82 of the 910 healthy – about 50%. Every test **updates** the probability.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: The test detects 90 % of the ill and fires for 9 % of the healthy. The likelihood ratio is 90 % ÷ 9 %. What is it?
    answer:
      value: 10
    hints:
      - Divide the hit rate by the false-alarm rate.
      - 90 ÷ 9.
    explanation: A positive test is 10 times more likely in the ill than in the healthy. Each positive multiplies the odds by ten.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "The odds start at 1 : 99. Each positive test multiplies them by 10. How likely are you ill after three positive, independent tests? In percent, rounded."
    answer:
      value: 91
      tolerance: 1
    hints:
      - "After three tests: 1000 : 99."
      - Probability = 1000 ÷ (1000 + 99).
    explanation: 1000/1099 ≈ 91 %. After one test 9 %, after two 50 %, after three 91 %. In odds form, Bayes is just multiplication.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The second test uses the same measuring principle and reacts to the same interfering substance in the blood. What does that mean?
    params:
      options:
        - label: The tests are not independent – a second positive result says far less
          correct: true
        - label: The second test is twice as reliable
          feedback: It merely repeats the same error.
        - label: That changes nothing
          feedback: The calculation presupposes independence.
    hints:
      - Whoever was false positive on the first test probably is again on the second.
    explanation: Confirmation tests should rest on a **different** principle.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "After a positive test (odds 10 : 99) comes a negative test. The likelihood ratio for »negative« is 10 % ÷ 91 % ≈ 0.11. What holds now?"
    params:
      options:
        - label: "The odds drop to about 1.1 : 99 – almost back to the start"
          correct: true
        - label: Almost – but 10 · 0.11 = 1.1, not exactly 1.
          feedback: Fast – aber 10 · 0,11 = 1,1, nicht genau 1.
        - label: The odds stay at about 1 %.
          feedback: Die Chance bleibt bei etwa 1 %.
    hints:
      - Multiply 10 by 0.11.
      - "Compare with the starting odds 1 : 99."
    explanation: "New odds ≈ 1.1 : 99, so about 1.1 %. Each result shifts the odds by its own likelihood ratio."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why two positive tests say so much more than one – and when they do not.
    params:
      keywords:
        - - fehlalarm
          - falsch
          - "false"
          - alarm
        - - unabhängig
          - independent
        - - zweit
          - beide
          - wieder
          - second
          - both
          - again
      sample: A false alarm on the first test rarely repeats on the second if the tests are independent. So after two positives only a few healthy people remain. If the second test measures the same thing, it barely helps.
    explanation: The second test filters out the false alarms of the first – but only if its errors are independent of the first.
    difficulty: 3

srs:
  cards_from: [anteil, zweiter]
