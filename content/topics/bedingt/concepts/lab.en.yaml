id: stats.conditional.lab
type: concept
title: Test Lab
summary: Shade and set frequencies.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: beides
    widget: venn
    prompt: Shade everyone who is sick AND tested positive.
    params: { sets: [sick, positive] }
    answer: { regions: [AB] }
    hints:
      - Both at once is the overlap.
    explanation: The true hits lie in the intersection.

  - kind: problem
    id: positiv
    widget: venn
    prompt: Now shade everyone who tested positive, sick or not.
    params: { sets: [sick, positive] }
    answer: { regions: [B, AB] }
    hints:
      - The whole "positive" circle.
    explanation: The positives are the true hits and the false alarms.

  - kind: problem
    id: haeufigkeiten
    widget: chart
    body: Of 100 people, 20 are sick. The test detects 90 % of the sick, but also flags 10 % of the healthy.
    prompt: Set how many sick and how many healthy people test positive.
    params:
      labels: [sick +, healthy +]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 20
    answer: { values: [18, 8] }
    hints:
      - 90 % of 20 and 10 % of 80.
    explanation: 18 true hits, 8 false alarms.

  - kind: problem
    id: anteil
    widget: numberline
    prompt: What share of the positives is truly sick? Mark it roughly.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: 0.7 }
    hints:
      - 18 out of 26.
    explanation: "18 ÷ 26 ≈ 0.69, so about 70 %, not 90 %."

srs:
  cards_from: [haeufigkeiten, anteil]
