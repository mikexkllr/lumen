id: stats.conditional.independence
type: concept
title: Independent or Not?
summary: When one thing tells you nothing about the other.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Does the coin matter?
    body: "Does a lucky charm really bring luck? Here a coin and a die are thrown together. Throw 100 times and compare: does the six come more often with heads than with tails? If not, the two are **independent**."
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: heads + 6
            weight: 1
          - label: heads + 1–5
            weight: 5
          - label: tails + 6
            weight: 1
          - label: tails + 1–5
            weight: 5
        sample:
          - 10
          - 100

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Independent or dependent?
    params:
      buckets: [{ label: independent }, { label: dependent }]
      items:
        - { label: Two coin flips in a row, bucket: independent }
        - { label: A die roll and the weather, bucket: independent }
        - { label: Rain and a wet street, bucket: dependent }
        - { label: Two cards drawn without replacement, bucket: dependent }
        - { label: Height and weight, bucket: dependent }
    hints:
      - Does knowing one change the chance of the other?
    explanation: Independent means one tells you nothing about the other.

  - kind: explain
    id: s2
    body: |
      For **independent** events, P(A and B) = P(A) · P(B).
      If they are dependent, this simple rule no longer holds.

  - kind: problem
    id: beide
    widget: numeric
    prompt: "It rains with 20 % probability. Independently, your alarm clock rings too late with {{p}} % probability. How likely is both?"
    params: { unit: "%" }
    answer: { value: "{{20 * p / 100}}" }
    hints:
      - "0.2 · {{p / 100}}."
    explanation: "0.2 · {{p / 100}} = {{20 * p / 10000}}, so {{20 * p / 100}} %."
    variants:
      params: { p: "choice[10,25,50]" }
      defaults: { p: 10 }

  - kind: problem
    id: falle
    widget: choice
    prompt: 1 % of houses had a fire, and 1 % had a faulty smoke detector. Is "both at once" then 1 % · 1 % = 0.01 %?
    params:
      options:
        - { label: Only if the two are independent, correct: true }
        - { label: "Yes, always", feedback: "If the events are linked, the product is wrong." }
    hints:
      - Could a defect be linked to fires?
    explanation: You may only multiply for independent events. Expert reports often forget this.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does one affect the other?
    params:
      buckets:
        - id: b1
          label: Independent
        - id: b2
          label: Dependent
      items:
        - label: Two coin tosses
          bucket: b1
        - label: A die and a coin
          bucket: b1
        - label: Rain today and rain tomorrow
          bucket: b2
        - label: Two cards without replacement
          bucket: b2
        - label: Height and shoe size
          bucket: b2
    hints:
      - Does the first result change the odds of the second?
    explanation: Only for independent events may you simply multiply the odds.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: It rains on 20 % of days. Independently, your alarm rings late every second day. The grid shows 100 days. Shade the days on which both happen.
    params:
      parts: 100
      shape: square
    answer:
      fraction: 1/10
    hints:
      - It rains on 20 of the 100 days.
      - "On half of those the alarm rings late: 10 days."
    explanation: $0.2 \cdot 0.5 = 0.1$ – that is 10 of 100 days. For **independent** events you may multiply like this.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Two events exclude each other – such as “die shows 1” and “die shows 6”. Are they independent?
    params:
      options:
        - label: No – if you know one occurred, the other is impossible
          correct: true
        - label: Yes – they have nothing to do with each other
          feedback: "On the contrary: they are maximally linked."
        - label: That depends on the die
          feedback: It holds for every die.
    hints:
      - Does one tell you something about the other?
    explanation: “Mutually exclusive” and “independent” are often confused – they are almost opposites.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: choice
    prompt: Of 100 people, 40 wear glasses, 50 are women and 20 are women with glasses. Are »glasses« and »woman« independent?
    params:
      options:
        - label: Yes – 0.4 · 0.5 = 0.2
          correct: true
        - label: Among women it is 20 of 50 = 40 % – just like everyone.
          feedback: Unter Frauen sind es 20 von 50 = 40 % – genau wie bei allen.
        - label: The table is enough to check.
          feedback: Die Tabelle reicht zum Prüfen.
    hints:
      - Compute P(glasses) · P(woman).
      - Compare with P(glasses and woman) = 0.2.
    explanation: "The product matches the joint share. Equivalently: P(glasses | woman) = P(glasses). That is independence."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Of 200 people, 80 drink coffee and 50 sleep badly. If both were independent, how many coffee drinkers would sleep badly?
    answer:
      value: 20
    hints:
      - P(coffee) = 0.4 and P(bad sleep) = 0.25.
      - 0.4 · 0.25 · 200.
    explanation: 0.1 · 200 = 20. If you count clearly more, coffee and sleep are linked. This is exactly how the chi-squared test works.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Sally Clark was convicted in 1999 because two of her babies died. The expert calculated: 1/8500 · 1/8500 = 1 in 73 million. Where was the error?"
    params:
      options:
        - label: The cases are not independent – shared genes and environment raise the risk for the second child
          correct: true
        - label: He miscalculated
          feedback: The multiplication is right – it just should not have been applied.
        - label: The number 8500 was invented
          feedback: It came from a study.
    hints:
      - You may only multiply under independence.
    explanation: She was acquitted in 2003. The case is regarded as a lesson on statistics in court.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Two coins. A = »first shows heads«, B = »second shows heads«, C = »both show the same«. Any two of them are independent. Are all three independent together?
    params:
      options:
        - label: No – A and B together force C
          correct: true
        - label: Pairwise is not enough.
          feedback: Paarweise reicht nicht.
        - label: P(A and C) = 1/4 = P(A) · P(C) – these two are independent.
          feedback: P(A und C) = 1/4 = P(A) · P(C) – die beiden sind unabhängig.
    hints:
      - What is P(A and B and C)?
      - Compare with P(A) · P(B) · P(C) = 1/8.
    explanation: P(A and B and C) = 1/4, not 1/8. Pairwise independence is weaker than true independence of all three.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux when you may simply multiply probabilities – and what went wrong in the Sally Clark case.
    params:
      keywords:
        - - unabhängig
          - independent
        - - multipl
          - mal
          - produkt
          - times
          - product
        - - gemeinsam
          - ursache
          - gene
          - familie
          - common
          - cause
          - family
      sample: You may only multiply when the events are independent. Two cot deaths in one family can have a common cause, such as genes. Then the product is far too small.
    explanation: The calculation 1/8500 · 1/8500 assumed independence. It was missing – and a court convicted an innocent woman.
    difficulty: 3

srs:
  cards_from: [einordnen, beide]
