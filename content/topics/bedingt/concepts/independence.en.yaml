id: stats.conditional.independence
type: concept
title: Independent or Not?
summary: When one thing tells you nothing about the other.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Independent or dependent?
    params:
      buckets: [{ label: independent }, { label: dependent }]
      items:
        - { label: Two coin flips in a row, bucket: independent }
        - { label: A die roll and the weather, bucket: independent }
        - { label: Rain and a wet street, bucket: dependent }
        - { label: Two cards drawn without replacement, bucket: dependent }
        - { label: Height and weight, bucket: dependent }
    hints:
      - Does knowing one change the chance of the other?
    explanation: Independent means one tells you nothing about the other.

  - kind: explain
    id: s2
    body: |
      For **independent** events, P(A and B) = P(A) · P(B).
      If they are dependent, this simple rule no longer holds.

  - kind: problem
    id: beide
    widget: numeric
    prompt: "It rains with 20 % probability. Independently, your alarm clock rings too late with {{p}} % probability. How likely is both?"
    params: { unit: "%" }
    answer: { value: "{{20 * p / 100}}" }
    hints:
      - "0.2 · {{p / 100}}."
    explanation: "0.2 · {{p / 100}} = {{20 * p / 10000}}, so {{20 * p / 100}} %."
    variants:
      params: { p: "choice[10,25,50]" }
      defaults: { p: 10 }

  - kind: problem
    id: falle
    widget: choice
    prompt: 1 % of houses had a fire, and 1 % had a faulty smoke detector. Is "both at once" then 1 % · 1 % = 0.01 %?
    params:
      options:
        - { label: Only if the two are independent, correct: true }
        - { label: "Yes, always", feedback: "If the events are linked, the product is wrong." }
    hints:
      - Could a defect be linked to fires?
    explanation: You may only multiply for independent events. Expert reports often forget this.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Two events exclude each other – such as “die shows 1” and “die shows 6”. Are they independent?
    params:
      options:
        - label: No – if you know one occurred, the other is impossible
          correct: true
        - label: Yes – they have nothing to do with each other
          feedback: "On the contrary: they are maximally linked."
        - label: That depends on the die
          feedback: It holds for every die.
    hints:
      - Does one tell you something about the other?
    explanation: “Mutually exclusive” and “independent” are often confused – they are almost opposites.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Sally Clark was convicted in 1999 because two of her babies died. The expert calculated: 1/8500 · 1/8500 = 1 in 73 million. Where was the error?"
    params:
      options:
        - label: The cases are not independent – shared genes and environment raise the risk for the second child
          correct: true
        - label: He miscalculated
          feedback: The multiplication is right – it just should not have been applied.
        - label: The number 8500 was invented
          feedback: It came from a study.
    hints:
      - You may only multiply under independence.
    explanation: She was acquitted in 2003. The case is regarded as a lesson on statistics in court.
    difficulty: 3

srs:
  cards_from: [einordnen, beide]
