id: stats.conditional.lab
type: concept
title: Test-Labor
summary: Häufigkeiten färben und einstellen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: beides
    widget: venn
    prompt: Färbe alle, die krank sind UND positiv getestet wurden.
    params: { sets: [krank, positiv] }
    answer: { regions: [AB] }
    hints:
      - Beides zugleich – die Überschneidung.
    explanation: Die echten Treffer liegen in der Schnittmenge.

  - kind: problem
    id: positiv
    widget: venn
    prompt: Färbe jetzt alle positiv Getesteten – egal ob krank oder nicht.
    params: { sets: [krank, positiv] }
    answer: { regions: [B, AB] }
    hints:
      - Der ganze Kreis »positiv«.
    explanation: Positiv sind die echten Treffer und die Fehlalarme.

  - kind: problem
    id: haeufigkeiten
    widget: chart
    body: Von 100 Menschen sind 20 krank. Der Test erkennt 90 % der Kranken, schlägt aber auch bei 10 % der Gesunden an.
    prompt: Stell ein, wie viele Kranke und wie viele Gesunde positiv getestet werden.
    params:
      labels: [krank +, gesund +]
      values: [0, 0]
      editable: [0, 1]
      min: 0
      max: 20
    answer: { values: [18, 8] }
    hints:
      - 90 % von 20 und 10 % von 80.
    explanation: 18 echte Treffer, 8 Fehlalarme.

  - kind: problem
    id: anteil
    widget: numberline
    prompt: Welcher Anteil der Positiven ist wirklich krank? Markiere ungefähr.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: 0.7 }
    hints:
      - 18 von 26.
    explanation: "18 : 26 ≈ 0,69 – also rund 70 %, nicht 90 %."

srs:
  cards_from: [haeufigkeiten, anteil]
