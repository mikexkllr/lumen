id: stats.conditional.tree
type: concept
title: Tree Diagrams
summary: Multiply along, add across.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Paths in the tree
    body: Much in life happens in stages – like two draws from a bag with two red balls and one blue. Play it 100 times, putting the ball back. Each bar is a **path** in the tree. Which one wins?
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: red, red
            weight: 4
          - label: red, blue
            weight: 2
          - label: blue, red
            weight: 2
          - label: blue, blue
            weight: 1
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: zwei-rot
    widget: numeric
    prompt: A bag holds one red and one blue marble. You draw, put it back, and draw again. How likely is red twice?
    params: { placeholder: "Fraction, e.g. 1/3" }
    answer: { value: "1/4" }
    feedback:
      - when: "approx(numval(state.input), 1/2)"
        misconception: single-stage
        text: That holds for one draw. But red must come up twice.
    hints:
      - List all possibilities, RR, RB, BR, BB.
    explanation: One of four equally likely outcomes fits, so 1/4.

  - kind: explain
    id: s2
    body: |
      **Path rule:** Along a path in the tree, probabilities are **multiplied**.
      So red twice is 1/2 · 1/2 = 1/4.

  - kind: problem
    id: muenzen
    widget: numeric
    prompt: A coin is flipped {{n}} times. How likely is it that every flip lands heads?
    params: { placeholder: "Fraction" }
    answer: { value: "1/{{2 ** n}}" }
    feedback:
      - when: "approx(numval(state.input), 1 / (2 * n))"
        misconception: add-instead-multiply
        text: Along the path you multiply, not add.
    hints:
      - "The factor 1/2, {{n}} times."
    explanation: "(1/2) to the power of {{n}} = 1/{{2 ** n}}."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 3 }

  - kind: explain
    id: s4
    body: |
      **Sum rule:** If several paths lead to the same outcome, you combine their chances. You **add** them.

  - kind: problem
    id: genau-einmal
    widget: numeric
    prompt: Two coin flips. How likely is exactly one head?
    params: { placeholder: "Fraction" }
    answer: { value: "1/2" }
    feedback:
      - when: "approx(numval(state.input), 1/4)"
        misconception: one-path
        text: Heads can come on the first or the second flip. That makes two paths.
    hints:
      - HT and TH both lead to the goal.
    explanation: 1/4 + 1/4 = 1/2.

  - kind: problem
    id: ohne-zuruecklegen
    widget: numeric
    prompt: A bag has {{r}} red and {{b}} blue marbles. You draw two without putting any back. How likely are both red?
    params: { placeholder: "Fraction" }
    answer: { value: "{{r * (r - 1)}}/{{(r + b) * (r + b - 1)}}" }
    feedback:
      - when: "approx(numval(state.input), (r / (r + b)) ** 2)"
        misconception: with-replacement
        text: That would be with replacement. After the first draw, one red marble is gone.
    hints:
      - "First draw {{r}}/{{r + b}}. Then {{r - 1}} red out of {{r + b - 1}} remain."
    explanation: "{{r}}/{{r + b}} · {{r - 1}}/{{r + b - 1}} = {{r * (r - 1)}}/{{(r + b) * (r + b - 1)}}."
    variants:
      params: { r: "int[2,5]", b: "int[2,4]" }
      defaults: { r: 3, b: 2 }

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: The bag holds 3 red balls and 1 blue. You draw twice, putting the ball back. The 4 × 4 grid shows all pairs. Shade the pairs with exactly one blue ball.
    params:
      parts: 16
      shape: square
    answer:
      fraction: 3/8
    hints:
      - "Blue then red: 1 · 3 squares. Red then blue: 3 · 1 squares."
      - Together 3 + 3 = 6 of the 16 squares.
    explanation: 'Two paths lead to "exactly one blue": $\frac{3}{16} + \frac{3}{16} = \frac{6}{16} = \frac{3}{8}$. Multiply along, add across.'

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A basketball player makes each free throw with 80%. He shoots twice. How likely is he to score **exactly once**? In percent.
    params:
      unit: "%"
    answer:
      value: 32
    hints:
      - "Two paths: hit–miss and miss–hit."
    explanation: 0.8 · 0.2 + 0.2 · 0.8 = 0.32. Multiply along, add across the paths.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: A player makes each shot with {{p}} %. She shoots twice. How likely does she score exactly once? In percent.
    answer:
      value: "{{2 * p * (100 - p) / 100}}"
    feedback:
      - when: numval(state.input) == p * (100 - p) / 100
        misconception: one-path
        text: That is just one path, e.g. »hit, then miss«. There are two.
    hints:
      - "Two paths: hit–miss and miss–hit."
      - Each path has {{p}} % · {{100 - p}} %. Add both.
    explanation: 2 · {{p / 100}} · {{(100 - p) / 100}} = {{2 * p * (100 - p) / 10000}}, so {{2 * p * (100 - p) / 100}} %. Multiply along, then add across.
    difficulty: 2
    variants:
      params:
        p: choice[10,20,30,40,60,70,90]
      defaults:
        p: 70

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: A bag has 3 red and 2 blue balls. You draw two without replacement. How likely do you get one red and one blue? As a fraction.
    answer:
      value: 3/5
    feedback:
      - when: numval(state.input) == 3 / 10
        misconception: one-path
        text: That is only the path »red first, then blue«.
    hints:
      - "Path red–blue: 3/5 · 2/4. Path blue–red: 2/5 · 3/4."
      - 6/20 + 6/20.
    explanation: "12/20 = 3/5. Without replacement the denominator changes in the second step: 4 instead of 5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A test consists of 10 yes/no questions. You guess everything. How likely are you to get **exactly 5** right? In percent, to one place. (252 ways out of 1024)
    params:
      unit: "%"
    answer:
      value: 24.6
      tolerance: 0.1
    hints:
      - 252 divided by 1024.
    explanation: "24.6%. This is the **binomial distribution**: number of paths times the probability of one path."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: You roll a die five times. How likely do exactly two sixes come up? In percent, to one decimal. (There are 10 paths, each with (1/6)² · (5/6)³ ≈ 0.01608.)
    answer:
      value: 16.1
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 1.6) < 0.1
        misconception: one-path
        text: That is a single path. But there are 10 such paths.
    hints:
      - How many paths contain exactly two sixes? 5 choose 2 = 10.
      - 10 · 0.01608.
    explanation: "10 · 0.01608 ≈ 16.1 %. The tree grows so big that you count the paths instead of drawing them: the binomial formula."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A factory has two machines. A makes 60 % of the parts with 2 % rejects, B makes 40 % with 5 % rejects. What is the overall reject rate?
    params:
      options:
        - label: 3.2 %
          correct: true
        - label: That is the plain average. But A makes more parts.
          feedback: Das ist der einfache Schnitt. A macht aber mehr Teile.
        - label: The rates are not simply added.
          feedback: Die Quoten werden nicht einfach addiert.
    hints:
      - Weight each rate by the machine's share.
      - 0.6 · 2 % + 0.4 · 5 %.
    explanation: "1.2 % + 2 % = 3.2 %. That is the law of total probability: you sum over all routes."
    difficulty: 3

srs:
  cards_from: [muenzen, ohne-zuruecklegen]
