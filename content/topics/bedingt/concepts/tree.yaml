id: stats.conditional.tree
type: concept
title: Baumdiagramme
summary: Entlang multiplizieren, quer addieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pfade im Baum
    body: Vieles im Leben passiert in Stufen – wie zwei Züge aus einer Tüte mit zwei roten Kugeln und einer blauen. Spiel es 100-mal durch, mit Zurücklegen. Jeder Balken ist ein **Pfad** im Baum. Welcher gewinnt?
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: rot, rot
            weight: 4
          - label: rot, blau
            weight: 2
          - label: blau, rot
            weight: 2
          - label: blau, blau
            weight: 1
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: zwei-rot
    widget: numeric
    prompt: In einer Tüte liegen eine rote und eine blaue Kugel. Du ziehst, legst zurück und ziehst noch einmal. Wie wahrscheinlich ist zweimal Rot?
    params: { placeholder: "Bruch, z. B. 1/3" }
    answer: { value: "1/4" }
    feedback:
      - when: "approx(numval(state.input), 1/2)"
        misconception: single-stage
        text: Das gilt für einen Zug. Rot muss aber zweimal kommen.
    hints:
      - Schreib alle Möglichkeiten auf – RR, RB, BR, BB.
    explanation: Von vier gleich wahrscheinlichen Ausgängen passt einer – 1/4.

  - kind: explain
    id: s2
    body: |
      **Pfadregel:** Entlang eines Pfades im Baum werden Wahrscheinlichkeiten **multipliziert**.
      Zweimal Rot ist also 1/2 · 1/2 = 1/4.

  - kind: problem
    id: muenzen
    widget: numeric
    prompt: Eine Münze wird {{n}}-mal geworfen. Wie wahrscheinlich ist es, dass jedes Mal Kopf kommt?
    params: { placeholder: "Bruch" }
    answer: { value: "1/{{2 ** n}}" }
    feedback:
      - when: "approx(numval(state.input), 1 / (2 * n))"
        misconception: add-instead-multiply
        text: Entlang des Pfades wird multipliziert, nicht addiert.
    hints:
      - "{{n}}-mal den Faktor 1/2."
    explanation: "(1/2) hoch {{n}} = 1/{{2 ** n}}."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 3 }

  - kind: explain
    id: s4
    body: |
      **Summenregel:** Führen mehrere Pfade zum selben Ziel, zählt man ihre Chancen zusammen. Man **addiert** sie.

  - kind: problem
    id: genau-einmal
    widget: numeric
    prompt: Zwei Münzwürfe. Wie wahrscheinlich ist genau einmal Kopf?
    params: { placeholder: "Bruch" }
    answer: { value: "1/2" }
    feedback:
      - when: "approx(numval(state.input), 1/4)"
        misconception: one-path
        text: Kopf kann beim ersten oder beim zweiten Wurf kommen. Das sind zwei Pfade.
    hints:
      - KZ und ZK führen beide zum Ziel.
    explanation: 1/4 + 1/4 = 1/2.

  - kind: problem
    id: ohne-zuruecklegen
    widget: numeric
    prompt: In einer Tüte sind {{r}} rote und {{b}} blaue Kugeln. Du ziehst zwei, ohne zurückzulegen. Wie wahrscheinlich sind beide rot?
    params: { placeholder: "Bruch" }
    answer: { value: "{{r * (r - 1)}}/{{(r + b) * (r + b - 1)}}" }
    feedback:
      - when: "approx(numval(state.input), (r / (r + b)) ** 2)"
        misconception: with-replacement
        text: Das wäre mit Zurücklegen. Nach dem ersten Zug fehlt eine rote Kugel.
    hints:
      - "Erster Zug {{r}}/{{r + b}}. Danach sind noch {{r - 1}} rote von {{r + b - 1}} übrig."
    explanation: "{{r}}/{{r + b}} · {{r - 1}}/{{r + b - 1}} = {{r * (r - 1)}}/{{(r + b) * (r + b - 1)}}."
    variants:
      params: { r: "int[2,5]", b: "int[2,4]" }
      defaults: { r: 3, b: 2 }

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: In der Tüte liegen 3 rote Kugeln und 1 blaue. Du ziehst zweimal mit Zurücklegen. Das 4 × 4-Raster zeigt alle Paare. Färbe die Paare mit genau einer blauen Kugel.
    params:
      parts: 16
      shape: square
    answer:
      fraction: 3/8
    hints:
      - "Erst blau, dann rot: 1 · 3 Felder. Erst rot, dann blau: 3 · 1 Felder."
      - Zusammen 3 + 3 = 6 von 16 Feldern.
    explanation: "Zwei Pfade führen zu »genau eine blaue«: $\\frac{3}{16} + \\frac{3}{16} = \\frac{6}{16} = \\frac{3}{8}$. Entlang multiplizieren, quer addieren."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Basketballer trifft jeden Freiwurf mit 80 %. Er wirft zweimal. Wie wahrscheinlich trifft er **genau einmal**? In Prozent.
    params:
      unit: "%"
    answer:
      value: 32
    hints:
      - "Zwei Pfade: Treffer–Fehlwurf und Fehlwurf–Treffer."
    explanation: 0,8 · 0,2 + 0,2 · 0,8 = 0,32. Entlang multiplizieren, über die Pfade addieren.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Eine Spielerin trifft jeden Wurf mit {{p}} %. Sie wirft zweimal. Wie wahrscheinlich trifft sie **genau einmal**? In Prozent.
    answer:
      value: "{{2 * p * (100 - p) / 100}}"
    feedback:
      - when: numval(state.input) == p * (100 - p) / 100
        misconception: one-path
        text: Das ist nur ein Pfad, etwa »Treffer, dann daneben«. Es gibt zwei.
    hints:
      - "Zwei Pfade: Treffer–daneben und daneben–Treffer."
      - Jeder Pfad hat {{p}} % · {{100 - p}} %. Addiere beide.
    explanation: 2 · {{p / 100}} · {{(100 - p) / 100}} = {{2 * p * (100 - p) / 10000}}, also {{2 * p * (100 - p) / 100}} %. Erst entlang multiplizieren, dann quer addieren.
    difficulty: 2
    variants:
      params:
        p: choice[10,20,30,40,60,70,90]
      defaults:
        p: 70

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: In einer Tüte sind 3 rote und 2 blaue Kugeln. Du ziehst zwei ohne Zurücklegen. Wie wahrscheinlich bekommst du eine rote **und** eine blaue? Als Bruch.
    answer:
      value: 3/5
    feedback:
      - when: numval(state.input) == 3 / 10
        misconception: one-path
        text: Das ist nur der Pfad »erst rot, dann blau«.
    hints:
      - "Pfad rot–blau: 3/5 · 2/4. Pfad blau–rot: 2/5 · 3/4."
      - 6/20 + 6/20.
    explanation: "12/20 = 3/5. Ohne Zurücklegen ändert sich der Nenner im zweiten Schritt: 4 statt 5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Test besteht aus 10 Ja/Nein-Fragen. Du rätst alles. Wie wahrscheinlich hast du **genau 5** richtig? In Prozent, auf eine Stelle. (252 Wege von 1024)
    params:
      unit: "%"
    answer:
      value: 24.6
      tolerance: 0.1
    hints:
      - 252 geteilt durch 1024.
    explanation: "24,6 %. Das ist die **Binomialverteilung**: Anzahl der Wege mal Wahrscheinlichkeit eines Wegs."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Du würfelst fünfmal. Wie wahrscheinlich kommt **genau zweimal** eine 6? In Prozent, auf eine Stelle. (Es gibt 10 Pfade mit je (1/6)² · (5/6)³ ≈ 0,01608.)
    answer:
      value: 16.1
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 1.6) < 0.1
        misconception: one-path
        text: Das ist ein einzelner Pfad. Es gibt aber 10 solche Pfade.
    hints:
      - Wie viele Pfade enthalten genau zwei Sechsen? 5 über 2 = 10.
      - 10 · 0,01608.
    explanation: "10 · 0,01608 ≈ 16,1 %. Der Baum wird so groß, dass man die Pfade zählt statt sie zu zeichnen: die **Binomialformel**."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Eine Fabrik hat zwei Maschinen. A macht 60 % der Teile mit 2 % Ausschuss, B macht 40 % mit 5 % Ausschuss. Wie viel Ausschuss gibt es insgesamt?
    params:
      options:
        - label: 3,2 %
          correct: true
        - label: 3,5 %
          feedback: Das ist der einfache Schnitt. A macht aber mehr Teile.
        - label: 7 %
          feedback: Die Quoten werden nicht einfach addiert.
    hints:
      - Gewichte jede Quote mit dem Anteil der Maschine.
      - 0,6 · 2 % + 0,4 · 5 %.
    explanation: "1,2 % + 2 % = 3,2 %. Das ist der **Satz der totalen Wahrscheinlichkeit**: Man summiert über alle Wege."
    difficulty: 3

srs:
  cards_from: [muenzen, ohne-zuruecklegen]
