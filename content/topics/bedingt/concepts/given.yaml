id: stats.conditional.given
type: concept
title: Unter der Bedingung
summary: P(B | A) ist nicht P(A | B).
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Nass heißt nicht Regen
    body: »Wenn es regnet, ist die Straße nass.« Gilt das auch andersherum? Färbe alle 30 Tage mit nasser Straße. Schau nur auf diese Fälle – **unter der Bedingung** nass. Wie oft hat es da geregnet?
    visual:
      widget: venn
      interactive: true
      params:
        sets:
          - Regen
          - nasse Straße
        outside: true
        counts:
          A: 0
          AB: 20
          B: 10
          O: 70
        universe: 100 Tage

  - kind: problem
    id: sport-musik
    widget: numeric
    visual: { widget: venn, params: { sets: [Sport, Musik], outside: true, counts: { A: 20, B: 30, AB: 10, O: 40 } } }
    prompt: 100 Leute wurden befragt. Welcher Anteil der Sportler macht auch Musik?
    params: { placeholder: "Bruch" }
    answer: { value: "1/3" }
    feedback:
      - when: "approx(numval(state.input), 1/10)"
        misconception: joint-not-conditional
        text: 10 von 100 machen beides. Gefragt ist aber nur unter den Sportlern.
    hints:
      - Wie viele machen Sport? Wie viele davon auch Musik?
    explanation: 30 machen Sport, 10 davon auch Musik – 10/30 = 1/3.

  - kind: explain
    id: s2
    body: |
      **P(B | A)** heißt: **Wahrscheinlichkeit** für B, wenn A schon feststeht.
      Man schaut nur noch auf die Fälle mit A.

  - kind: problem
    id: musik-sport
    widget: numeric
    visual: { widget: venn, params: { sets: [Sport, Musik], outside: true, counts: { A: 20, B: 30, AB: 10, O: 40 } } }
    prompt: Und andersherum – welcher Anteil der Musiker macht auch Sport?
    params: { placeholder: "Bruch" }
    answer: { value: "1/4" }
    feedback:
      - when: "approx(numval(state.input), 1/3)"
        misconception: swap-condition
        text: Jetzt ist Musik die Bedingung. Wie viele machen Musik?
    hints:
      - 40 machen Musik.
    explanation: 10 von 40 Musikern machen Sport – 1/4. Das ist etwas anderes als eben.

  - kind: explain
    id: s4
    body: Sind P(A | B) und P(B | A) gleich?
    reveal:
      body: Meist nicht. Fast alle Profi-Basketballer sind groß. Aber nur sehr wenige große Menschen spielen Profi-Basketball.

  - kind: problem
    id: papst
    widget: choice
    prompt: Was ist wahrscheinlicher?
    params:
      options:
        - { label: "Katholisch zu sein, wenn man Papst ist", correct: true }
        - { label: "Papst zu sein, wenn man katholisch ist", feedback: "Unter über einer Milliarde Katholiken gibt es genau einen Papst." }
        - { label: Beides gleich, feedback: "Die Bedingung macht den Unterschied." }
    hints:
      - Wie viele Päpste gibt es – und wie viele Katholiken?
    explanation: Der Papst ist immer katholisch. Umgekehrt ist es fast unmöglich.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: P(A | B) und P(B | A) sind immer gleich.
          right: false
          why: Fast alle Päpste sind katholisch, aber fast kein Katholik ist Papst.
        - text: P(A | B) betrachtet nur die Fälle, in denen B eingetreten ist.
          right: true
        - text: Wenn A und B unabhängig sind, ist P(A | B) = P(A).
          right: true

  - kind: problem
    id: intro-c1
    widget: venn
    prompt: Für P(Sport | Musik) zählen nur bestimmte Fälle. Färbe genau die Bereiche, auf die du dann schaust.
    params:
      sets:
        - Sport
        - Musik
      outside: true
      counts:
        A: 20
        B: 30
        AB: 10
        O: 40
    answer:
      regions:
        - B
        - AB
    hints:
      - "Die Bedingung steht hinter dem Strich: Musik."
      - Färbe alle, die Musik machen – mit und ohne Sport.
    explanation: "Unter der Bedingung Musik zählen nur die 40 Musiker. 10 davon machen Sport: P(Sport | Musik) = 10/40 = 1/4."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Von 200 Gästen sind 80 Vegetarier. 60 der Vegetarier und 30 der anderen nehmen Salat. Welcher Anteil der Salat-Esser ist vegetarisch? Als Bruch.
    answer:
      value: 2/3
    hints:
      - Insgesamt nehmen 90 Salat.
    explanation: 60 von 90 = 2/3. Der Nenner sind nur die Salat-Esser.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "{{b}} % aller Schüler spielen ein Instrument. {{c}} % spielen ein Instrument **und** singen im Chor. Wie viel Prozent der Instrumentalisten singen im Chor?"
    answer:
      value: "{{100 * c / b}}"
    feedback:
      - when: numval(state.input) == c
        misconception: joint-vs-conditional
        text: Das ist der Anteil an **allen** Schülern. Gefragt ist der Anteil unter den Instrumentalisten.
    hints:
      - Schau nur noch auf die {{b}} %.
      - "Rechne {{c}} : {{b}}."
    explanation: "P(Chor | Instrument) = {{c}} : {{b}} = {{100 * c / b}} %. Allgemein gilt P(A | B) = P(A und B) : P(B)."
    difficulty: 2
    variants:
      params:
        b: choice[20,25,40,50]
        c: choice[5,10,15,20]
      constraints:
        - c < b
        - isInt(100 * c / b)
      defaults:
        b: 40
        c: 10

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Es regnet mit 30 %. Wenn es regnet, ist der Bus mit 50 % zu spät. Wie wahrscheinlich ist »Regen und Bus zu spät«?
    params:
      options:
        - label: 15 %
          correct: true
        - label: 80 %
          feedback: Bedingte Wahrscheinlichkeiten werden multipliziert, nicht addiert.
        - label: 50 %
          feedback: Das gilt nur an Regentagen.
    hints:
      - P(A und B) = P(A) · P(B | A).
      - 0,3 · 0,5.
    explanation: 0,3 · 0,5 = 0,15. Diese **Multiplikationsregel** gilt immer – auch bei abhängigen Ereignissen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Vor Gericht: »Die Chance, dass ein Unschuldiger diese DNA-Spur hat, ist 1 zu einer Million – also ist der Angeklagte mit 99,9999 % schuldig.« Was ist der Fehler?"
    params:
      options:
        - label: P(Spur | unschuldig) wird mit P(unschuldig | Spur) verwechselt
          correct: true
        - label: DNA-Tests sind unzuverlässig
          feedback: Das Argument wäre auch bei perfektem Test falsch.
        - label: Es gibt keinen Fehler
          feedback: In einer Stadt mit 5 Millionen Menschen passen etwa 5 weitere.
    hints:
      - Wie viele Menschen in einer Millionenstadt hätten dieselbe Spur?
    explanation: Der **Fehlschluss des Anklägers**. Er hat nachweislich zu Fehlurteilen geführt.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Eine Familie hat zwei Kinder. Du erfährst: Mindestens eines ist ein Mädchen. Wie wahrscheinlich sind beide Mädchen? Als Bruch."
    answer:
      value: 1/3
    feedback:
      - when: numval(state.input) == 1 / 2
        misconception: which-child
        text: Das wäre richtig, wenn du wüsstest, dass das **ältere** Kind ein Mädchen ist.
    hints:
      - "Die vier gleich wahrscheinlichen Fälle: JJ, JM, MJ, MM."
      - »Mindestens ein Mädchen« streicht nur JJ.
    explanation: Übrig bleiben JM, MJ, MM – nur einer davon ist MM, also 1/3. Die Bedingung schneidet die Fallmenge zu.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: "Andere Familie, zwei Kinder: Du siehst, dass das **ältere** ein Mädchen ist. Wie wahrscheinlich sind beide Mädchen?"
    params:
      options:
        - label: 1/2
          correct: true
        - label: 1/3, wie eben
          feedback: Jetzt bleiben nur MJ und MM – zwei Fälle.
        - label: 1/4
          feedback: Das wäre ohne jede Information.
    hints:
      - Welche der vier Fälle passen zu »das ältere ist ein Mädchen«?
      - Nur MJ und MM.
    explanation: Die Antwort hängt davon ab, **wie** man die Information bekommt. Darum streiten sich sogar Fachleute bei solchen Rätseln.
    difficulty: 3

srs:
  cards_from: [sport-musik, musik-sport]
