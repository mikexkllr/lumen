id: stats.conditional.bayes
type: concept
title: The Test Fallacy
summary: When false alarms outnumber true hits.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A hundred people, one case
    body: A test is almost always right – so does "positive" mean almost surely ill? The grid shows 100 people. Shade as many as are ill with a disease that affects 1 %. How **rare** is that?
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 100
        shape: square

  - kind: problem
    id: bauchgefuehl
    widget: choice
    body: 1 in 100 people has a disease. A test detects 90 % of the sick. It wrongly flags 9 % of the healthy.
    prompt: Your test is positive. How likely are you to be sick?
    params:
      options:
        - { label: About 9 %, correct: true }
        - { label: About 90 %, feedback: "That is the hit rate among the sick. But there are far more healthy people." }
        - { label: About 50 %, feedback: "Closer, but still too high." }
        - { label: About 99 %, feedback: "Much too high. Think of all the healthy people with a false alarm." }
    hints:
      - Picture 1000 people.
    explanation: The few true hits get lost among many false alarms.

  - kind: explain
    id: s2
    body: |
      Think in **frequencies**. Of 1000 people, 10 are sick, and 9 of them test positive.
      Of the 990 healthy people, about 89 still test positive.

  - kind: problem
    id: positive
    widget: numeric
    prompt: How many of the 1000 people test positive in total?
    params: { unit: people }
    answer: { value: 98, tolerance: 1 }
    hints:
      - Add the true hits and the false alarms.
    explanation: 9 true plus 89 false, so about 98 positive tests.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: What share of the people who test positive is truly sick? In percent, rounded.
    params: { unit: "%" }
    answer: { value: 9, tolerance: 1 }
    feedback:
      - when: "numval(state.input) == 90"
        misconception: base-rate-neglect
        text: 90 % is the hit rate among the sick. This question is about all positives.
    hints:
      - Calculate 9 divided by 98.
    explanation: 9 out of 98, about 9 %. The disease is rare, so false alarms dominate.

  - kind: explain
    id: s5
    body: What helps against this fallacy?
    reveal:
      body: A second, independent test. And knowing the **base rate**. The rarer something is, the more false alarms you get in proportion.

  - kind: problem
    id: haeufiger
    widget: choice
    prompt: The disease becomes more common, 1 in 10 instead of 1 in 100. What happens to the share of true hits among the positives?
    params:
      options:
        - { label: It rises sharply., correct: true }
        - { label: It falls., feedback: "More sick people means more true hits, with the same number of false alarms." }
        - { label: It stays the same., feedback: "The test stays the same, but the base rate changes everything." }
    hints:
      - Picture 1000 people again, but now 100 are sick.
    explanation: 90 true hits against about 81 false alarms. Now a good half of the positives are sick.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: "Of 100 people tested, 10 are positive: 2 of them ill, 8 healthy. Each piece is one positive. Shade the ones who are really ill."
    params:
      parts: 10
      shape: bar
    answer:
      fraction: 1/5
    hints:
      - Look only at the 10 positives.
      - 2 of 10 are ill – shade 2 pieces.
    explanation: Among the positives only $\frac{2}{10} = \frac{1}{5}$ are ill. The many healthy people produce most of the positive results.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A spam filter: 20% of all mail is spam. The word “prize” appears in 50% of spam and in 5% of normal mail. A mail contains “prize”. How likely is it spam? In percent, rounded."
    params:
      unit: "%"
    answer:
      value: 71
      tolerance: 1
    hints:
      - "Of 1000 mails: 200 spam, 100 of them with the word. 800 normal, 40 of them with the word."
    explanation: 100 of 140 ≈ 71%. That is how Bayesian spam filters work – word by word.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Of 10,000 people, {{s}} are ill. A test detects 90 % of the ill and gives a false alarm for 5 % of the healthy. What percent of the positives are ill? Rounded.
    answer:
      value: "{{100 * 0.9 * s / (0.9 * s + 0.05 * (10000 - s))}}"
      tolerance: 0.6
    hints:
      - "True positives: {{0.9 * s}}. False positives: 5 % of {{10000 - s}} = {{0.05 * (10000 - s)}}."
      - Divide the true positives by all positives.
    explanation: "{{0.9 * s}} ÷ ({{0.9 * s}} + {{0.05 * (10000 - s)}}) ≈ {{round(100 * 0.9 * s / (0.9 * s + 0.05 * (10000 - s)))}} %. The rarer the disease, the more false alarms among the positives."
    difficulty: 2
    variants:
      params:
        s: choice[100,500,1000,2000]
      defaults:
        s: 100

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A test for a very rare disease (1 in 10,000) is 99% accurate. Should the whole population be tested?
    params:
      options:
        - label: Rather not – for every true case there would be about 100 false alarms
          correct: true
        - label: Yes – 99% is very accurate
          feedback: For such rare diseases false alarms massively dominate.
        - label: No – the test finds nobody
          feedback: It finds almost all the sick, but also very many healthy people.
    hints:
      - "Of 10,000 people: 1 sick, but 100 false-positive healthy ones."
    explanation: "That is why risk groups are tested specifically: there the base rate is higher and the test meaningful."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: The same test (1000 people, 10 ill, 9 detected, 89 false alarms). Someone tests negative. How sure is it that they are healthy?
    params:
      options:
        - label: Very sure – above 99.8 %
          correct: true
        - label: 91 % is the share of healthy people who test negative. The question asks the reverse.
          feedback: 91 % ist der Anteil der Gesunden, die negativ testen. Gefragt ist der umgekehrte Anteil.
        - label: Negative results are very reliable here.
          feedback: Negative Ergebnisse sind hier sehr verlässlich.
    hints:
      - How many test negative? 1 ill and 901 healthy.
      - Compute 901 ÷ 902.
    explanation: 901/902 ≈ 99.9 %. For rare diseases a negative test says far more than a positive one.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Using 1000 people, explain to Lux why a positive test for a rare disease is often a false alarm.
    params:
      keywords:
        - - "1000"
          - tausend
          - thousand
        - - gesund
          - fehlalarm
          - falsch
          - healthy
          - "false"
        - - selten
          - basisrate
          - wenige
          - rare
          - base rate
          - few
      sample: Of 1000 people only 10 are ill; the disease is rare. 9 of them test positive. But of the 990 healthy, 89 also test false positive. So only 9 of 98 positives are ill.
    explanation: The many healthy people create more false alarms than there are ill people at all. Natural frequencies make this visible.
    difficulty: 3

srs:
  cards_from: [bauchgefuehl, anteil]
