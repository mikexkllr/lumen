id: math.start.times
type: concept
title: "Multiplying"
summary: "Counting equal groups and rows – and the first times tables for 2, 5 and 10."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Rows instead of counting
    body: "Egg boxes, windows, chocolate: many things come in equal rows. Drag the dot and build a rectangle with 3 rows of 4 squares each. Count them: there are 12. That is **multiplying**."
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 6
        maxH: 5
        w: 2
        h: 2
        show: []
        unit: cm

  - kind: problem
    id: schuhe
    widget: numeric
    prompt: 3 children, each has 2 shoes. How many shoes is that altogether?
    body: 👟👟   👟👟   👟👟
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 5
        misconception: added-factors
        text: You worked out 3 + 2. But each of the 3 children has 2 shoes.
      - when: numval(state.input) == 3
        misconception: counted-groups
        text: Those are the children. The question is how many shoes there are.
    hints:
      - Count all the shoes.
      - Work out 2 + 2 + 2.
    explanation: "2 + 2 + 2 = 6. In short you say: 3 times 2 is 6."

  - kind: problem
    id: reihen-bauen
    widget: rect
    prompt: Build a rectangle with 2 rows of 5 squares each.
    params:
      maxW: 6
      maxH: 5
      w: 1
      h: 1
      show: []
      unit: cm
    check:
      predicate: w == 5 && h == 2
    feedback:
      - when: w == 2 && h == 5
        misconception: rows-columns-swapped
        text: Those are 5 rows of 2 squares each. You need 2 rows of 5.
    hints:
      - The number on the right counts the rows. The number at the top counts the squares in one row.
      - Drag the dot until there is a 5 at the top and a 2 on the right.
    explanation: 2 rows of 5 squares each make 10 squares altogether.

  - kind: problem
    id: rechteck-zaehlen
    widget: numeric
    prompt: The rectangle has 3 rows of 4 squares each. How many squares is that altogether?
    visual:
      widget: rect
      params:
        maxW: 6
        maxH: 4
        w: 4
        h: 3
        show: []
        unit: cm
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 7
        misconception: added-factors
        text: You worked out 3 + 4. But there are 3 rows with 4 squares each.
      - when: numval(state.input) == 11 || numval(state.input) == 13
        misconception: miscount
        text: "Very close. Count row by row: 4, 8 and one more row."
    hints:
      - Count row by row. Each row has 4 squares.
      - Work out 4 + 4 + 4.
    explanation: "4 + 4 + 4 = 12. Written more briefly: 3 · 4 = 12."

  - kind: explain
    id: mal-idee
    body: "Instead of 4 + 4 + 4 you write 3 · 4 for short. You read the dot as “times”. So **multiplying** is adding the same number again and again: 3 · 4 means three fours."

  - kind: problem
    id: plus-zu-mal
    widget: choice
    prompt: Which times problem matches 5 + 5 + 5?
    params:
      layout: grid
      options:
        - label: 3 · 5
          correct: true
        - label: 5 · 5
          feedback: The 5 is only there three times, not five times.
        - label: 3 + 5
          feedback: That is a plus problem with a different result. Count how often the 5 appears.
        - label: 15 · 5
          feedback: 15 is already the result. You need how often the 5 appears.
    hints:
      - How many times is the 5 there?
      - Three fives – so 3 times 5.
    explanation: "The 5 appears three times: 5 + 5 + 5 = 3 · 5 = 15."

  - kind: problem
    id: mal-zwei
    widget: numeric
    prompt: Work out {{a}} · 2.
    answer:
      value: "{{2 * a}}"
    feedback:
      - when: numval(state.input) == a + 2
        misconception: added-factors
        text: "That would be {{a}} + 2. Times 2 means: take the {{a}} twice."
    hints:
      - Picture {{a}} pairs of shoes. How many shoes is that?
      - Work out {{a}} + {{a}}.
    explanation: "{{a}} · 2 = {{a}} + {{a}} = {{2 * a}}."
    variants:
      params:
        a: int[3,9]
      defaults:
        a: 6

  - kind: problem
    id: fuenfer-zehner
    widget: numeric
    prompt: Work out {{a}} · {{b}}.
    answer:
      value: "{{a * b}}"
    feedback:
      - when: numval(state.input) == a + b
        misconception: added-factors
        text: That would be {{a}} + {{b}}. You need {{a}} lots of {{b}}.
      - when: numval(state.input) == a * b - b || numval(state.input) == a * b + b
        misconception: one-step-off
        text: You landed one step off. Count exactly {{a}} steps.
    hints:
      - "Count in steps of {{b}}: {{b}}, {{2 * b}} and so on."
      - You need exactly {{a}} steps. Use your fingers.
    explanation: "{{a}} steps of {{b}} land on {{a * b}}."
    variants:
      params:
        a: int[2,9]
        b: choice[5,10]
      defaults:
        a: 4
        b: 5

  - kind: problem
    id: blitz
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 2 · 5 = 10
          right: true
        - text: 3 · 10 = 13
          right: false
          why: That would be 3 + 10. Three tens are 30.
        - text: 4 · 2 gives the same as 2 · 4.
          right: true
          why: "Turn the rectangle: the number of squares stays the same."
        - text: 5 · 5 = 10
          right: false
          why: 5 + 5 is 10. But five fives are 25.

  - kind: explain
    id: tauschen
    depth: 2
    body: "3 · 4 and 4 · 3 both make 12. Turn the rectangle in your mind: the squares stay the same. A turned pair like this is called a **turn-around fact**."
    visual:
      widget: rect
      params:
        maxW: 6
        maxH: 4
        w: 3
        h: 4
        show: []
        unit: cm

  - kind: problem
    id: paare
    depth: 2
    widget: match
    prompt: Match each problem with its result.
    params:
      pairs:
        - left: 3 · 3
          right: "9"
        - left: 4 · 5
          right: "20"
        - left: 6 · 2
          right: "12"
        - left: 7 · 10
          right: "70"
    hints:
      - Start with the problem you know for sure.
      - 7 · 10 has the biggest result, 3 · 3 the smallest.
    explanation: 3 · 3 = 9, 4 · 5 = 20, 6 · 2 = 12 and 7 · 10 = 70.
    difficulty: 2

  - kind: problem
    id: dreier-vierer
    depth: 2
    widget: numeric
    prompt: Work out {{a}} · {{b}}.
    answer:
      value: "{{a * b}}"
    feedback:
      - when: numval(state.input) == a + b
        misconception: added-factors
        text: That would be {{a}} + {{b}}. You need {{a}} lots of {{b}}.
      - when: numval(state.input) == a * b - b || numval(state.input) == a * b + b
        misconception: one-step-off
        text: You are one row off. There are exactly {{a}} rows of {{b}}.
    hints:
      - Picture {{a}} rows of {{b}} squares each.
      - Count in steps of {{b}} and take exactly {{a}} steps.
    explanation: "{{a}} rows of {{b}} make {{a * b}} altogether."
    difficulty: 2
    variants:
      params:
        a: int[3,6]
        b: choice[3,4]
      defaults:
        a: 6
        b: 3

  - kind: problem
    id: eierkarton
    depth: 2
    widget: numeric
    prompt: One box holds 2 rows of 5 eggs each. How many eggs are in 3 boxes?
    answer:
      value: 30
    feedback:
      - when: numval(state.input) == 10
        misconception: one-group
        text: That is how many eggs one box has. The question is about 3 boxes.
      - when: numval(state.input) == 13
        misconception: added-factors
        text: You worked out 10 + 3. But there are three lots of 10 eggs.
    hints:
      - One box has 2 · 5 = 10 eggs.
      - "Three boxes have three times as many: 3 · 10."
    explanation: One box has 10 eggs. Three boxes have 3 · 10 = 30 eggs.
    difficulty: 2

  - kind: problem
    id: rechteck-24
    depth: 3
    widget: rect
    prompt: Build a rectangle with 4 rows and exactly 24 squares.
    params:
      maxW: 8
      maxH: 6
      w: 2
      h: 2
      show: []
      unit: cm
    check:
      predicate: h == 4 && w == 6
    feedback:
      - when: h == 4 && w != 6
        misconception: wrong-width
        text: 4 rows are right. Check whether there are exactly 24 squares.
      - when: w == 4 && h == 6
        misconception: rows-columns-swapped
        text: That is 24 squares, but in 6 rows. You need 4 rows.
    hints:
      - Set 4 rows first. How many squares does each row need then?
      - 4 · 5 = 20 is too few. Try 6 squares in each row.
    explanation: 4 · 6 = 24. Each of the 4 rows has 6 squares.
    difficulty: 3

  - kind: problem
    id: mal-null
    depth: 3
    widget: choice
    prompt: What is 7 · 0?
    params:
      layout: grid
      options:
        - label: "0"
          correct: true
        - label: "7"
          feedback: That would be 7 · 1. Seven lots of nothing is still nothing.
        - label: "70"
          feedback: That would be 7 · 10.
        - label: "1"
          feedback: Work out 0 + 0 + 0 + 0 + 0 + 0 + 0.
    hints:
      - "7 · 0 means: add up seven zeros."
      - Picture seven empty plates. How many biscuits are on them?
    explanation: "Seven lots of nothing is nothing: 7 · 0 = 0."
    difficulty: 3

  - kind: problem
    id: sieben-acht
    depth: 3
    widget: numeric
    prompt: "Work out 7 · 8. Tip: split it into 5 · 8 and 2 · 8."
    answer:
      value: 56
    feedback:
      - when: numval(state.input) == 15
        misconception: added-factors
        text: That would be 7 + 8. You need seven eights.
      - when: numval(state.input) == 40
        misconception: partial-product
        text: That is only 5 · 8. 2 · 8 = 16 is still missing.
    hints:
      - 5 · 8 = 40.
      - 2 · 8 = 16. Add 40 and 16.
    explanation: 5 · 8 = 40 and 2 · 8 = 16. Together that is 56.
    difficulty: 3

  - kind: problem
    id: erklaeren
    depth: 3
    widget: teach
    prompt: Explain to Lux why 3 · 4 gives the same as 4 · 3.
    params:
      keywords:
        - - reihe
          - rechteck
          - spalte
          - row
          - rectangle
          - column
        - - dreh
          - tausch
          - kipp
          - turn
          - swap
          - rotate
          - flip
        - - gleich
          - dieselbe
          - "12"
          - zwölf
          - same
          - twelve
      sample: "I picture a rectangle with 3 rows of 4 squares each. When I turn it, there are 4 rows of 3. The number of squares stays the same: 12."
    explanation: "Key idea: a turned rectangle has the same squares – only rows and columns swap roles."
    difficulty: 3

srs:
  cards_from: ["mal-zwei", "fuenfer-zehner"]
