id: stats.experiments.placebo
type: concept
title: "Placebo and blinding"
summary: "Expectation works – so nobody may know who gets what."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Two pills without any active ingredient: one supposedly costs 2.50 €, the other 10 cents. Which relieves pain more often in experiments?"
    params:
      options:
        - label: The supposedly expensive one
          correct: true
        - label: Expectation counts – and »expensive« raises more of it.
          feedback: Erwartung zählt – und »teuer« weckt mehr davon.
        - label: Precisely without an active ingredient, expectation works.
          feedback: Gerade ohne Wirkstoff wirkt die Erwartung.
    hints:
      - What do you expect from an expensive drug?
      - Expectation alone can change symptoms.
    explanation: In a 2008 experiment more people reported relief with the »expensive« pill. Expectation works too – that is the placebo effect.

  - kind: explain
    id: c1
    body: A **placebo** looks like the real drug but has no active ingredient. If the control group gets a placebo, expectation works equally in both groups.

  - kind: problem
    id: c2
    widget: choice
    prompt: Why does the control group get a placebo rather than nothing at all?
    params:
      options:
        - label: So the groups differ only in the active ingredient
          correct: true
        - label: It is not about feelings but about a fair comparison.
          feedback: Es geht nicht um Gefühle, sondern um einen fairen Vergleich.
        - label: It is allowed, just less informative.
          feedback: Es ist erlaubt, aber weniger aussagekräftig.
    hints:
      - What else differs between the groups if one gets nothing?
      - Swallowing a pill, seeing a doctor, hope …
    explanation: "Everything except the active ingredient should be the same: pill, ritual, hope. Then the difference measures exactly the ingredient."

  - kind: explain
    id: c3
    body: "With **blinding**, participants do not know whether they get drug or placebo. Double-blind means: the doctors do not know either."

  - kind: problem
    id: c4
    widget: match
    prompt: What does each term mean?
    params:
      pairs:
        - left: Placebo
          right: Dummy with no active ingredient
        - left: Nocebo
          right: Expectation causes complaints
        - left: Single-blind
          right: Patient does not know
        - left: Double-blind
          right: Patient and doctor do not know
      leftTitle: Term
      rightTitle: Meaning
    hints:
      - »Nocebo« is the counterpart of »placebo«.
      - "Double-blind: two sides know nothing."
    explanation: Placebo and nocebo show how strong expectation is. Blinding removes expectation as a difference.

  - kind: problem
    id: c5
    widget: order
    prompt: Put the steps of a double-blind study in order.
    params:
      items:
        - label: Fix the plan and the outcome
        - label: Assign participants to drug or placebo by lot
        - label: Hand out pills with codes, not names
        - label: Measure the outcome without knowing the code
        - label: Break the code and compare the groups
    hints:
      - The code is broken only at the very end.
      - Before the lottery it must be clear what is measured.
    explanation: Only once everything is measured may anyone know who got what. Otherwise knowledge colours the measurement.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Three groups: drug 50 % improved, placebo 35 %, nothing 25 %. How many percentage points does the active ingredient add beyond the placebo?"
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 25
        misconception: vs-nothing
        text: That is drug versus nothing. It includes the placebo effect.
      - when: numval(state.input) == 10
        misconception: placebo-effect
        text: That is the placebo effect itself.
    hints:
      - Compare drug with placebo, not with nothing.
      - Compute 50 − 35.
    explanation: 50 − 35 = 15 points for the ingredient. Another 10 points (35 − 25) come from expectation, and 25 % improve on their own.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: In the placebo group 20 % complain of headaches as a »side effect«. How can that be?
    params:
      options:
        - label: Expected side effects and everyday complaints – the nocebo effect
          correct: true
        - label: That would be an error – but it happens in every trial.
          feedback: Das wäre ein Fehler – aber so etwas kommt in jeder Studie vor.
        - label: Not with so little sugar.
          feedback: Bei so wenig Zucker nicht.
    hints:
      - What did participants read about side effects?
      - Headaches happen often without any pill at all.
    explanation: That is why side effects only count as the difference to the placebo group – just like the effect.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A doctor knows who gets the real drug. He measures those patients' blood pressure a little more kindly. What is this called?
    params:
      options:
        - label: Observer bias – hence double-blind
          correct: true
        - label: Here the person measuring is fooled, not the patient.
          feedback: Hier täuscht sich der Messende, nicht der Patient.
        - label: The deviation has a direction – that is not chance.
          feedback: Die Abweichung hat eine Richtung – das ist kein Zufall.
    hints:
      - Who changes the result here – patient or doctor?
      - Knowledge colours the reading.
    explanation: Even honest experts unconsciously read what they expect. Double-blind protects against both expectations at once.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The real drug causes a dry mouth, the placebo does not. What threatens the blinding?
    params:
      options:
        - label: Many guess their group – expectation acts unequally again
          correct: true
        - label: Noticeable side effects give the group away.
          feedback: Spürbare Nebenwirkungen verraten die Gruppe.
        - label: The effect stays; only the measurement gets biased.
          feedback: Die Wirkung bleibt, nur die Messung wird verzerrt.
    hints:
      - How could a participant tell what he gets?
      - Some trials use an »active placebo« with a similar side effect.
    explanation: Good trials ask at the end who suspects which group. If many guess right, the blinding is broken.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: An effective drug already exists for a disease. May a new drug then be tested against placebo?
    params:
      options:
        - label: Usually not – it is compared with the best existing treatment
          correct: true
        - label: Withholding effective help from patients is ethically tricky.
          feedback: Kranken eine wirksame Hilfe vorzuenthalten, ist ethisch heikel.
        - label: You still need one – just with a different comparison.
          feedback: Man braucht sie – nur mit anderem Vergleich.
    hints:
      - What would patients in the placebo group miss out on?
      - The Declaration of Helsinki covers this.
    explanation: "Then you test »new versus standard«. The question becomes: is the new one better – or at least not worse?"
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why good trials are double-blind.
    params:
      keywords:
        - - erwart
          - glaub
          - expect
          - belief
        - - patient
          - teilnehm
          - participant
        - - arzt
          - ärzt
          - forsch
          - doctor
          - research
          - mess
          - measur
      sample: "Expectation works: whoever believes they get the drug feels better. So the patient does not know what they get. The doctor does not know either, so he does not steer the measurement unconsciously."
    explanation: Two expectations – the patient's and the measurer's – are switched off at the same time.
    difficulty: 3

srs:
  cards_from: ["c2", "d1", "x1"]
