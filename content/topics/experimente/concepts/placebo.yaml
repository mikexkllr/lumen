id: stats.experiments.placebo
type: concept
title: "Placebo und Verblindung"
summary: "Erwartung wirkt – darum darf niemand wissen, wer was bekommt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Zwei Pillen ohne jeden Wirkstoff: Eine kostet angeblich 2,50 €, die andere 10 Cent. Welche lindert in Versuchen eher Schmerz?"
    params:
      options:
        - label: Die angeblich teure
          correct: true
        - label: Die billige
          feedback: Erwartung zählt – und »teuer« weckt mehr davon.
        - label: Keine, beide sind ohne Wirkstoff
          feedback: Gerade ohne Wirkstoff wirkt die Erwartung.
    hints:
      - Was erwartet man von einem teuren Mittel?
      - Erwartung allein kann Beschwerden verändern.
    explanation: In einem Versuch von 2008 berichteten mit der »teuren« Pille mehr Menschen Linderung. Die Erwartung wirkt mit – das ist der **Placebo-Effekt**.

  - kind: explain
    id: c1
    body: Ein **Placebo** sieht aus wie das echte Mittel, enthält aber keinen Wirkstoff. Bekommt die Kontrollgruppe ein Placebo, wirkt die Erwartung in beiden Gruppen gleich.

  - kind: problem
    id: c2
    widget: choice
    prompt: Warum bekommt die Kontrollgruppe ein Placebo statt gar nichts?
    params:
      options:
        - label: Damit sich beide Gruppen nur im Wirkstoff unterscheiden
          correct: true
        - label: Damit sie nicht enttäuscht ist
          feedback: Es geht nicht um Gefühle, sondern um einen fairen Vergleich.
        - label: Weil »nichts« verboten ist
          feedback: Es ist erlaubt, aber weniger aussagekräftig.
    hints:
      - Was unterscheidet die Gruppen sonst noch, wenn eine nichts bekommt?
      - Pille schlucken, Arztbesuch, Hoffnung …
    explanation: "Alles außer dem Wirkstoff soll gleich sein: Pille, Ritual, Hoffnung. Dann misst der Unterschied genau den Wirkstoff."

  - kind: explain
    id: c3
    body: "Bei der **Verblindung** wissen die Teilnehmer nicht, ob sie Mittel oder Placebo bekommen. Doppelblind heißt: Auch die Ärzte wissen es nicht."

  - kind: problem
    id: c4
    widget: match
    prompt: Was bedeutet welcher Begriff?
    params:
      pairs:
        - left: Placebo
          right: Scheinmittel ohne Wirkstoff
        - left: Nocebo
          right: Erwartung macht Beschwerden
        - left: Einfach blind
          right: Patient weiß es nicht
        - left: Doppelblind
          right: Patient und Arzt wissen es nicht
      leftTitle: Begriff
      rightTitle: Bedeutung
    hints:
      - »Nocebo« ist das Gegenstück zu »Placebo«.
      - "Doppelt blind: zwei Seiten wissen nichts."
    explanation: Placebo und Nocebo zeigen, wie stark Erwartung wirkt. Verblindung schaltet diese Erwartung als Unterschied aus.

  - kind: problem
    id: c5
    widget: order
    prompt: Bring die Schritte einer doppelblinden Studie in die richtige Reihenfolge.
    params:
      items:
        - label: Plan und Messgröße festlegen
        - label: Teilnehmer per Los auf Mittel und Placebo verteilen
        - label: Pillen mit Codes statt Namen ausgeben
        - label: Ergebnis messen, ohne den Code zu kennen
        - label: Code öffnen und Gruppen vergleichen
    hints:
      - Der Code wird erst ganz am Ende geöffnet.
      - Vor dem Los muss klar sein, was gemessen wird.
    explanation: Erst wenn alles gemessen ist, darf jemand wissen, wer was bekam. Sonst färbt das Wissen die Messung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Drei Gruppen: Mittel 50 % besser, Placebo 35 %, gar nichts 25 %. Wie viele Prozentpunkte bringt der **Wirkstoff** über das Placebo hinaus?"
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 25
        misconception: vs-nothing
        text: Das ist Mittel gegen »gar nichts«. Darin steckt auch der Placebo-Effekt.
      - when: numval(state.input) == 10
        misconception: placebo-effect
        text: Das ist der Placebo-Effekt selbst.
    hints:
      - Vergleiche Mittel mit Placebo, nicht mit nichts.
      - Rechne 50 − 35.
    explanation: 50 − 35 = 15 Punkte für den Wirkstoff. Weitere 10 Punkte (35 − 25) bringt die Erwartung, 25 % werden von allein besser.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: In der Placebo-Gruppe klagen 20 % über Kopfschmerz als »Nebenwirkung«. Wie kann das sein?
    params:
      options:
        - label: Erwartete Nebenwirkungen und Alltagsbeschwerden – der Nocebo-Effekt
          correct: true
        - label: Die Pillen waren verwechselt
          feedback: Das wäre ein Fehler – aber so etwas kommt in jeder Studie vor.
        - label: Zucker verursacht Kopfschmerz
          feedback: Bei so wenig Zucker nicht.
    hints:
      - Was haben die Teilnehmer über Nebenwirkungen gelesen?
      - Kopfschmerz kommt auch ohne jede Pille oft vor.
    explanation: Darum zählt man Nebenwirkungen nur als Unterschied zur Placebo-Gruppe – genau wie die Wirkung.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Ein Arzt weiß, wer das echte Mittel bekommt. Er misst den Blutdruck dieser Patienten etwas wohlwollender. Wie heißt das?
    params:
      options:
        - label: Beobachter-Verzerrung – darum doppelblind
          correct: true
        - label: Placebo-Effekt
          feedback: Hier täuscht sich der Messende, nicht der Patient.
        - label: Zufall
          feedback: Die Abweichung hat eine Richtung – das ist kein Zufall.
    hints:
      - Wer verändert hier das Ergebnis – Patient oder Arzt?
      - Wissen färbt das Ablesen.
    explanation: Auch ehrliche Fachleute lesen unbewusst, was sie erwarten. **Doppelblind** schützt vor beiden Erwartungen zugleich.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das echte Mittel macht einen trockenen Mund, das Placebo nicht. Was droht der Verblindung?
    params:
      options:
        - label: Viele erraten ihre Gruppe – Erwartung wirkt wieder ungleich
          correct: true
        - label: Nichts, Nebenwirkungen sind egal
          feedback: Spürbare Nebenwirkungen verraten die Gruppe.
        - label: Das Mittel wirkt dann schwächer
          feedback: Die Wirkung bleibt, nur die Messung wird verzerrt.
    hints:
      - Woran könnte ein Teilnehmer merken, was er bekommt?
      - Manche Studien geben ein »aktives Placebo« mit ähnlicher Nebenwirkung.
    explanation: Gute Studien fragen am Ende, wer welche Gruppe vermutet. Liegen viele richtig, ist die Verblindung **gebrochen**.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Für eine Krankheit gibt es schon ein wirksames Mittel. Darf ein neues Mittel dann gegen Placebo getestet werden?
    params:
      options:
        - label: Meist nicht – man vergleicht mit der besten bisherigen Behandlung
          correct: true
        - label: Ja, Placebo ist immer der Goldstandard
          feedback: Kranken eine wirksame Hilfe vorzuenthalten, ist ethisch heikel.
        - label: Nein, dann braucht man gar keine Studie
          feedback: Man braucht sie – nur mit anderem Vergleich.
    hints:
      - Was würde den Patienten der Placebo-Gruppe entgehen?
      - Die Deklaration von Helsinki regelt das.
    explanation: "Dann testet man »neu gegen Standard«. Die Frage wird: Ist das Neue besser – oder wenigstens nicht schlechter?"
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum gute Studien doppelblind sind.
    params:
      keywords:
        - - erwart
          - glaub
          - expect
          - belief
        - - patient
          - teilnehm
          - participant
        - - arzt
          - ärzt
          - forsch
          - doctor
          - research
          - mess
          - measur
      sample: "Die Erwartung wirkt: Wer glaubt, das Mittel zu bekommen, fühlt sich besser. Darum weiß der Patient nicht, was er bekommt. Auch der Arzt weiß es nicht, damit er beim Messen nicht unbewusst lenkt."
    explanation: Zwei Erwartungen – die des Patienten und die des Messenden – werden gleichzeitig ausgeschaltet.
    difficulty: 3

srs:
  cards_from: ["c2", "d1", "x1"]
