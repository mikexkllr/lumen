id: chem.mole.count
type: concept
title: The mole
summary: A dozen for atoms.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Counting in packs
    body: Nobody counts rice grains one by one. You pack them up or weigh them. Chemists do the same with atoms – their pack is called a **mole**. Uncover the cards.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🥚
            front: A dozen
            back: Twelve items at once. Eggs have been counted this way for centuries.
          - icon: 📄
            front: A ream of paper
            back: Paper comes in packs of 500 sheets. Nobody counts them again.
          - icon: 🌾
            front: A sack of rice
            back: Traders weigh rice instead of counting grains – the weight reveals the number.
          - icon: ⚗️
            front: A mole
            back: The chemist's pack. You will soon estimate for yourself how many particles it holds.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many water molecules are in a sip of water (18 g)? Enter the number of digits."
    params:
      min: 5
      max: 50
    answer:
      value: 24
      tolerance: 3
    explanation: 6 · 10²³ – a number with 24 digits. More than there are stars in the visible universe.

  - kind: problem
    id: dutzend
    widget: numeric
    prompt: A dozen is 12 items. How many eggs are {{n}} dozen?
    params: { unit: eggs }
    answer: { value: "{{12 * n}}" }
    hints:
      - "{{n}} · 12."
    explanation: "{{12 * n}} eggs. A mole is exactly this kind of counting unit – just huge."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: explain
    id: s2
    body: |
      A **mole** is $6.022 \cdot 10^{23}$ particles. Atoms are so tiny that you need this huge number to get handy amounts – a mole of water is a sip of 18 ml.

  - kind: problem
    id: atome
    widget: numeric
    prompt: How many moles of hydrogen atoms are in {{n}} mol of water, H₂O?
    params: { unit: mol }
    answer: { value: "{{2 * n}}" }
    feedback:
      - when: "numval(state.input) == n"
        misconception: count-molecules
        text: Each water molecule has two hydrogen atoms.
    hints:
      - Two H per molecule.
    explanation: "{{n}} · 2 = {{2 * n}} mol of H atoms."
    variants:
      params: { n: "int[2,8]" }
      defaults: { n: 3 }

  - kind: problem
    id: warum
    widget: choice
    prompt: Why do chemists count in moles instead of single atoms?
    params:
      options:
        - { label: Single atoms are far too tiny and numerous., correct: true }
        - { label: Atoms cannot be counted., feedback: "They can – by weighing, and that is exactly what the mole is for." }
    hints:
      - How many atoms are in one gram?
    explanation: With the mole, you calculate with handy numbers instead of quadrillions.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many moles of atoms in total are in 2 mol of methane CH₄?
    params:
      unit: mol
    answer:
      value: 10
    hints:
      - One molecule has 5 atoms.
    explanation: 2 · 5 = 10 mol of atoms.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: How many particles are {{n}} mol? Give the number in front of "· 10²³".
    answer:
      value: "{{6.022 * n}}"
      tolerance: 0.01
    hints:
      - 1 mol is 6.022 · 10²³ particles.
      - Work out {{n}} · 6.022.
    explanation: "{{n}} · 6.022 = {{6.022 * n}}, so {{6.022 * n}} · 10²³ particles."
    difficulty: 2
    variants:
      params:
        n: step[0.5,5,0.5]
      defaults:
        n: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: How many moles are 3.011 · 10²³ carbon atoms?
    answer:
      value: 0.5
    feedback:
      - when: numval(state.input) == 2
        misconception: inverted-ratio
        text: "The other way round: divide the number of particles by 6.022 · 10²³."
    hints:
      - 3.011 is exactly half of 6.022.
      - n = particles ÷ 6.022 · 10²³.
    explanation: Half a mole – exactly 6 g of carbon.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: you count one mole of rice grains, one per second, without a break. How many years does it take?"
    params:
      min: 1
      max: 100000000000000000000
      scale: log
      unit: years
    answer:
      value: 19000000000000000
      tolerance: 12000000000000000
    explanation: About 1.9 · 10¹⁶ years – over a million times the age of the universe. Atoms are unimaginably small.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Where does the odd number 6.022 · 10²³ come from?
    params:
      options:
        - label: It is chosen so that 1 mol of carbon-12 weighs almost exactly 12 grams
          correct: true
        - label: It was fixed at random
          feedback: It links the atomic mass in u with the gram.
        - label: That is how many atoms the universe has
          feedback: The universe has about 10⁸⁰.
    hints:
      - The mass number in u and the molar mass in grams are the same number.
    explanation: The **Avogadro constant** is the bridge between the world of atoms and the balance.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Since 2019 the **Avogadro constant** has been fixed exactly: $N_A = 6.022\\,140\\,76 \\cdot 10^{23}$ per mole. A mole is now simply a fixed count – like a dozen."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: 1 mol of water weighs 18 g. How much does a single water molecule weigh? Give the number in front of "· 10⁻²³ g", to one decimal place.
    answer:
      value: 3
      tolerance: 0.05
    hints:
      - Divide 18 g by 6.022 · 10²³.
      - 18 ÷ 6 = 3, and the exponent turns negative.
    explanation: About 3.0 · 10⁻²³ g. A scale would have to resolve 23 zeros after the decimal point.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: "Which is bigger: the number of molecules in a glass of water (250 ml) – or the number of glasses of water in all the oceans?"
    params:
      options:
        - label: The molecules in the glass – over a thousand times more
          correct: true
        - label: The glasses in the ocean
          feedback: The ocean holds about 5 · 10²¹ glasses, the glass almost 10²⁵ molecules.
        - label: Both are about equal
          feedback: More than three powers of ten lie between them.
    hints:
      - 250 g of water is almost 14 mol.
      - 14 · 6 · 10²³ ≈ 8 · 10²⁴.
    explanation: About 8 · 10²⁴ molecules versus about 5 · 10²¹ glasses. So, statistically, every glass holds a molecule that once passed through Cleopatra.
    difficulty: 3

srs:
  cards_from: [atome, warum]
