id: chem.mole.stoich
type: concept
title: Calculating reactions
summary: How much comes out?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      The numbers in a reaction equation are ratios of amounts in moles. In $2\,\mathrm{H_2} + \mathrm{O_2} \to 2\,\mathrm{H_2O}$, 1 mol of oxygen yields 2 mol of water.

  - kind: problem
    id: verhaeltnis
    widget: numeric
    prompt: "2 H₂ + O₂ → 2 H₂O. How many moles of water form from {{n}} mol of oxygen?"
    params: { unit: mol }
    answer: { value: "{{2 * n}}" }
    hints:
      - Each O₂ gives two H₂O.
    explanation: "{{n}} · 2 = {{2 * n}} mol of water."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: problem
    id: gramm
    widget: numeric
    prompt: From 4 g of hydrogen, H₂ (2 g per mole), how many grams of water form at most?
    params: { unit: g }
    answer: { value: 36 }
    hints:
      - 4 g of H₂ is 2 mol. That gives 2 mol of water.
    explanation: 2 mol · 18 g = 36 g of water.

  - kind: problem
    id: rest
    widget: choice
    prompt: You have 4 mol of H₂, but only 1 mol of O₂. What limits the reaction?
    params:
      options:
        - { label: The oxygen, correct: true }
        - { label: The hydrogen, feedback: "4 mol of H₂ would need 2 mol of O₂ – only 1 mol is there." }
    hints:
      - How much O₂ would 4 mol of H₂ need?
    explanation: 1 mol of O₂ is enough for only 2 mol of H₂ – 2 mol of H₂ are left over.

srs:
  cards_from: [verhaeltnis, rest]
