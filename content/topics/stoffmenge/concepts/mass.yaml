id: chem.mole.mass
type: concept
title: Atome wiegen
summary: Die molare Masse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was wiegt mehr: ein Dutzend Tischtennisbälle oder ein Dutzend Bowlingkugeln?"
    params:
      options:
        - label: Die Bowlingkugeln
          correct: true
        - label: Die Tischtennisbälle
          feedback: Die sind federleicht.
        - label: Beide gleich – es sind ja je zwölf
          feedback: Gleiche Anzahl heißt nicht gleiches Gewicht.
    hints:
      - Gleiche Anzahl, verschiedene Kugeln.
    explanation: "Genauso bei Atomen: Ein Mol Eisen wiegt mehr als ein Mol Wasserstoff."

  - kind: explain
    id: s1
    body: |
      Jedes Element hat eine **molare Masse**: so viel Gramm wiegt ein Mol davon. Wasserstoff etwa 1 g, Kohlenstoff 12 g, Sauerstoff 16 g. Für ein Molekül addiert man einfach.

  - kind: problem
    id: wasser
    widget: numeric
    prompt: Wie viel wiegt ein Mol Wasser H₂O?
    params: { unit: g }
    answer: { value: 18 }
    feedback:
      - when: "numval(state.input) == 17"
        misconception: one-hydrogen
        text: H₂O hat zwei Wasserstoffatome.
    hints:
      - 2 · 1 + 16.
    explanation: 2 + 16 = 18 g pro Mol.

  - kind: problem
    id: co2
    widget: numeric
    prompt: Wie viel wiegt ein Mol Kohlendioxid CO₂?
    params: { unit: g }
    answer: { value: 44 }
    hints:
      - 12 + 2 · 16.
    explanation: 12 + 32 = 44 g pro Mol.

  - kind: problem
    id: gramm
    widget: numeric
    prompt: Wie viele Gramm sind {{n}} mol Wasser?
    params: { unit: g }
    answer: { value: "{{18 * n}}" }
    hints:
      - Ein Mol wiegt 18 g.
    explanation: "{{n}} · 18 = {{18 * n}} g."
    variants:
      params: { n: "int[2,10]" }
      defaults: { n: 5 }

  - kind: problem
    id: c1
    widget: match
    prompt: Welche molare Masse passt? (H = 1, C = 12, N = 14, O = 16)
    params:
      pairs:
        - left: H₂
          right: 2 g/mol
        - left: CH₄
          right: 16 g/mol
        - left: NH₃
          right: 17 g/mol
        - left: O₂
          right: 32 g/mol
        - left: CO₂
          right: 44 g/mol
    hints:
      - Addiere die Atommassen aller Atome im Molekül.
    explanation: Die molare Masse ist die Summe der Atommassen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viel Mol sind 90 g Traubenzucker C₆H₁₂O₆?
    params:
      unit: mol
    answer:
      value: 0.5
    hints:
      - "Molare Masse: 6 · 12 + 12 · 1 + 6 · 16."
    explanation: "180 g/mol, also 90 : 180 = 0,5 mol."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Kalk CaCO₃ hat die molare Masse 100 g/mol. Wie viel Mol sind {{m}} g Kalk?
    params:
      unit: mol
    answer:
      value: "{{m / 100}}"
    feedback:
      - when: numval(state.input) == 100 * m
        misconception: inverted-formula
        text: "Teilen, nicht malnehmen: n = m : M."
    hints:
      - "n = m : M."
      - "Rechne {{m}} : 100."
    explanation: "{{m}} g : 100 g/mol = {{m / 100}} mol."
    difficulty: 2
    variants:
      params:
        m: step[25,500,25]
      defaults:
        m: 250

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Welche molare Masse hat Schwefelsäure H₂SO₄? (H = 1, S = 32, O = 16)
    params:
      unit: g/mol
    answer:
      value: 98
    feedback:
      - when: numval(state.input) == 49
        misconception: subscript-ignored
        text: "Zähle alle Atome: zwei H, ein S, vier O."
    hints:
      - 2 · 1 + 32 + 4 · 16.
      - 2 + 32 + 64.
    explanation: 2 + 32 + 64 = 98 g/mol.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Ammoniumnitrat NH₄NO₃ (80 g/mol) ist ein Dünger. Wie viel Prozent seiner Masse ist Stickstoff (N = 14)?
    answer:
      value: 35
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 17.5) < 0.5
        misconception: atom-count
        text: In der Formel stehen zwei N-Atome.
    hints:
      - "Zähle die N-Atome: eins in NH₄, eins in NO₃."
      - "28 : 80 · 100."
    explanation: 28 von 80 sind 35 %. Darum ist Ammoniumnitrat ein besonders kräftiger Stickstoffdünger.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viel Prozent der Masse von Wasser H₂O ist Wasserstoff? Auf ganze Prozent.
    params:
      unit: "%"
    answer:
      value: 11
      tolerance: 0.5
    hints:
      - 2 g von 18 g.
    explanation: "2 : 18 ≈ 11 %. Zwei Drittel der Atome sind Wasserstoff – aber nur ein Neuntel der Masse."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Ein Stoff besteht zu 75 % aus C und zu 25 % aus H (Massenanteile). Wie viele H-Atome kommen auf ein C-Atom?
    answer:
      value: 4
    feedback:
      - when: abs(numval(state.input) - 1/3) < 0.01
        misconception: mass-not-moles
        text: "Rechne in Mol um: 75 g C sind 6,25 mol, 25 g H sind 25 mol."
    hints:
      - "Nimm 100 g an: 75 g C und 25 g H."
      - "75 : 12 = 6,25 mol C, 25 : 1 = 25 mol H."
    explanation: "25 : 6,25 = 4. Die Verhältnisformel ist CH₄ – Methan. So bestimmt man Formeln aus Messdaten."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Chlor hat die mittlere Atommasse 35,45 u – keine ganze Zahl. Woher kommt das?
    params:
      options:
        - label: Es ist ein Gemisch aus rund 76 % Cl-35 und 24 % Cl-37
          correct: true
        - label: Ein Chloratom hat 35,45 Neutronen
          feedback: Teilchen gibt es nur ganz.
        - label: Die Elektronen wiegen 0,45 u
          feedback: 17 Elektronen wiegen nur etwa 0,01 u.
    hints:
      - Chlor hat zwei stabile Isotope.
      - 0,76 · 35 + 0,24 · 37 ≈ ?
    explanation: 0,76 · 35 + 0,24 · 37 ≈ 35,5. Die Atommassen im Periodensystem sind gewichtete Mittelwerte der Isotope.
    difficulty: 3

srs:
  cards_from: [co2, gramm]
