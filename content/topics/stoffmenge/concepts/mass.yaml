id: chem.mole.mass
type: concept
title: Atome wiegen
summary: Die molare Masse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was wiegt mehr: ein Dutzend Tischtennisbälle oder ein Dutzend Bowlingkugeln?"
    params:
      options:
        - label: Die Bowlingkugeln
          correct: true
        - label: Die Tischtennisbälle
          feedback: Die sind federleicht.
        - label: Beide gleich – es sind ja je zwölf
          feedback: Gleiche Anzahl heißt nicht gleiches Gewicht.
    hints:
      - Gleiche Anzahl, verschiedene Kugeln.
    explanation: "Genauso bei Atomen: Ein Mol Eisen wiegt mehr als ein Mol Wasserstoff."

  - kind: explain
    id: s1
    body: |
      Jedes Element hat eine **molare Masse**: so viel Gramm wiegt ein Mol davon. Wasserstoff etwa 1 g, Kohlenstoff 12 g, Sauerstoff 16 g. Für ein Molekül addiert man einfach.

  - kind: problem
    id: wasser
    widget: numeric
    prompt: Wie viel wiegt ein Mol Wasser H₂O?
    params: { unit: g }
    answer: { value: 18 }
    feedback:
      - when: "numval(state.input) == 17"
        misconception: one-hydrogen
        text: H₂O hat zwei Wasserstoffatome.
    hints:
      - 2 · 1 + 16.
    explanation: 2 + 16 = 18 g pro Mol.

  - kind: problem
    id: co2
    widget: numeric
    prompt: Wie viel wiegt ein Mol Kohlendioxid CO₂?
    params: { unit: g }
    answer: { value: 44 }
    hints:
      - 12 + 2 · 16.
    explanation: 12 + 32 = 44 g pro Mol.

  - kind: problem
    id: gramm
    widget: numeric
    prompt: Wie viele Gramm sind {{n}} mol Wasser?
    params: { unit: g }
    answer: { value: "{{18 * n}}" }
    hints:
      - Ein Mol wiegt 18 g.
    explanation: "{{n}} · 18 = {{18 * n}} g."
    variants:
      params: { n: "int[2,10]" }
      defaults: { n: 5 }

  - kind: problem
    id: c1
    widget: match
    prompt: Welche molare Masse passt? (H = 1, C = 12, N = 14, O = 16)
    params:
      pairs:
        - left: H₂
          right: 2 g/mol
        - left: CH₄
          right: 16 g/mol
        - left: NH₃
          right: 17 g/mol
        - left: O₂
          right: 32 g/mol
        - left: CO₂
          right: 44 g/mol
    hints:
      - Addiere die Atommassen aller Atome im Molekül.
    explanation: Die molare Masse ist die Summe der Atommassen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viel Mol sind 90 g Traubenzucker C₆H₁₂O₆?
    params:
      unit: mol
    answer:
      value: 0.5
    hints:
      - "Molare Masse: 6 · 12 + 12 · 1 + 6 · 16."
    explanation: "180 g/mol, also 90 : 180 = 0,5 mol."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viel Prozent der Masse von Wasser H₂O ist Wasserstoff? Auf ganze Prozent.
    params:
      unit: "%"
    answer:
      value: 11
      tolerance: 0.5
    hints:
      - 2 g von 18 g.
    explanation: "2 : 18 ≈ 11 %. Zwei Drittel der Atome sind Wasserstoff – aber nur ein Neuntel der Masse."
    difficulty: 3

srs:
  cards_from: [co2, gramm]
