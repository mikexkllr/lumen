id: chem.mole.mass
type: concept
title: Atome wiegen
summary: Die molare Masse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Jedes Element hat eine **molare Masse**: so viel Gramm wiegt ein Mol davon. Wasserstoff etwa 1 g, Kohlenstoff 12 g, Sauerstoff 16 g. Für ein Molekül addiert man einfach.

  - kind: problem
    id: wasser
    widget: numeric
    prompt: Wie viel wiegt ein Mol Wasser H₂O?
    params: { unit: g }
    answer: { value: 18 }
    feedback:
      - when: "numval(state.input) == 17"
        misconception: one-hydrogen
        text: H₂O hat zwei Wasserstoffatome.
    hints:
      - 2 · 1 + 16.
    explanation: 2 + 16 = 18 g pro Mol.

  - kind: problem
    id: co2
    widget: numeric
    prompt: Wie viel wiegt ein Mol Kohlendioxid CO₂?
    params: { unit: g }
    answer: { value: 44 }
    hints:
      - 12 + 2 · 16.
    explanation: 12 + 32 = 44 g pro Mol.

  - kind: problem
    id: gramm
    widget: numeric
    prompt: Wie viele Gramm sind {{n}} mol Wasser?
    params: { unit: g }
    answer: { value: "{{18 * n}}" }
    hints:
      - Ein Mol wiegt 18 g.
    explanation: "{{n}} · 18 = {{18 * n}} g."
    variants:
      params: { n: "int[2,10]" }
      defaults: { n: 5 }

srs:
  cards_from: [co2, gramm]
