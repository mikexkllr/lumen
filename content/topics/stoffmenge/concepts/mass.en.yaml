id: chem.mole.mass
type: concept
title: Weighing atoms
summary: The molar mass.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Every element has a **molar mass**: the number of grams one mole of it weighs. Hydrogen is about 1 g, carbon 12 g, oxygen 16 g. For a molecule, you simply add.

  - kind: problem
    id: wasser
    widget: numeric
    prompt: How much does one mole of water, H₂O, weigh?
    params: { unit: g }
    answer: { value: 18 }
    feedback:
      - when: "numval(state.input) == 17"
        misconception: one-hydrogen
        text: H₂O has two hydrogen atoms.
    hints:
      - 2 · 1 + 16.
    explanation: 2 + 16 = 18 g per mole.

  - kind: problem
    id: co2
    widget: numeric
    prompt: How much does one mole of carbon dioxide, CO₂, weigh?
    params: { unit: g }
    answer: { value: 44 }
    hints:
      - 12 + 2 · 16.
    explanation: 12 + 32 = 44 g per mole.

  - kind: problem
    id: gramm
    widget: numeric
    prompt: How many grams are {{n}} mol of water?
    params: { unit: g }
    answer: { value: "{{18 * n}}" }
    hints:
      - One mole weighs 18 g.
    explanation: "{{n}} · 18 = {{18 * n}} g."
    variants:
      params: { n: "int[2,10]" }
      defaults: { n: 5 }

srs:
  cards_from: [co2, gramm]
