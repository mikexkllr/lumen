id: chem.mole.mass
type: concept
title: Weighing atoms
summary: The molar mass.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Atoms on the scales
    body: "You cannot weigh single atoms, but you can compare them. Left: a methane molecule – box x is a C atom, plus four H atoms. Right: 16 H atoms. How many H atoms does one **C atom** weigh?"
    visual:
      widget: balance
      interactive: true
      params:
        left:
          x: 1
          units: 4
        right:
          x: 0
          units: 16
        allow:
          - remove_unit
          - remove_x
          - divide

  - kind: problem
    id: hook
    widget: choice
    prompt: "Which weighs more: a dozen table tennis balls or a dozen bowling balls?"
    params:
      options:
        - label: The bowling balls
          correct: true
        - label: The table tennis balls
          feedback: Those are light as a feather.
        - label: Both the same – it is twelve each
          feedback: Equal number does not mean equal weight.
    hints:
      - Same number, different balls.
    explanation: "The same with atoms: a mole of iron weighs more than a mole of hydrogen."

  - kind: explain
    id: s1
    body: |
      Every element has a **molar mass**: the number of grams one mole of it weighs. Hydrogen is about 1 g, carbon 12 g, oxygen 16 g. For a molecule, you simply add.

  - kind: problem
    id: wasser
    widget: numeric
    prompt: How much does one mole of water, H₂O, weigh?
    params: { unit: g }
    answer: { value: 18 }
    feedback:
      - when: "numval(state.input) == 17"
        misconception: one-hydrogen
        text: H₂O has two hydrogen atoms.
    hints:
      - 2 · 1 + 16.
    explanation: 2 + 16 = 18 g per mole.

  - kind: problem
    id: co2
    widget: numeric
    prompt: How much does one mole of carbon dioxide, CO₂, weigh?
    params: { unit: g }
    answer: { value: 44 }
    hints:
      - 12 + 2 · 16.
    explanation: 12 + 32 = 44 g per mole.

  - kind: problem
    id: gramm
    widget: numeric
    prompt: How many grams are {{n}} mol of water?
    params: { unit: g }
    answer: { value: "{{18 * n}}" }
    hints:
      - One mole weighs 18 g.
    explanation: "{{n}} · 18 = {{18 * n}} g."
    variants:
      params: { n: "int[2,10]" }
      defaults: { n: 5 }

  - kind: problem
    id: c1
    widget: match
    prompt: Which molar mass fits? (H = 1, C = 12, N = 14, O = 16)
    params:
      pairs:
        - left: H₂
          right: 2 g/mol
        - left: CH₄
          right: 16 g/mol
        - left: NH₃
          right: 17 g/mol
        - left: O₂
          right: 32 g/mol
        - left: CO₂
          right: 44 g/mol
    hints:
      - Add up the atomic masses of all atoms in the molecule.
    explanation: The molar mass is the sum of the atomic masses.

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: "On the left is an ammonia molecule NH₃: the box is the N atom, plus three H atoms. On the right are 17 H atoms. Get the box alone on one side."
    params:
      left:
        x: 1
        units: 3
      right:
        x: 0
        units: 17
      allow:
        - remove_unit
        - remove_x
        - divide
    hints:
      - Take the same number of H atoms off both sides so the scale stays level.
      - Remove 3 on each side – then the box is alone.
    explanation: "x = 14: one N atom weighs as much as 14 H atoms. That is why nitrogen has a molar mass of 14 g/mol."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many moles are 90 g of glucose C₆H₁₂O₆?
    params:
      unit: mol
    answer:
      value: 0.5
    hints:
      - "Molar mass: 6 · 12 + 12 · 1 + 6 · 16."
    explanation: 180 g/mol, so 90 ÷ 180 = 0.5 mol.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Limestone CaCO₃ has a molar mass of 100 g/mol. How many moles are {{m}} g of limestone?
    params:
      unit: mol
    answer:
      value: "{{m / 100}}"
    feedback:
      - when: numval(state.input) == 100 * m
        misconception: inverted-formula
        text: "Divide, do not multiply: n = m ÷ M."
    hints:
      - n = m ÷ M.
      - Work out {{m}} ÷ 100.
    explanation: "{{m}} g ÷ 100 g/mol = {{m / 100}} mol."
    difficulty: 2
    variants:
      params:
        m: step[25,500,25]
      defaults:
        m: 250

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: What is the molar mass of sulfuric acid H₂SO₄? (H = 1, S = 32, O = 16)
    params:
      unit: g/mol
    answer:
      value: 98
    feedback:
      - when: numval(state.input) == 49
        misconception: subscript-ignored
        text: "Count every atom: two H, one S, four O."
    hints:
      - 2 · 1 + 32 + 4 · 16.
      - 2 + 32 + 64.
    explanation: 2 + 32 + 64 = 98 g/mol.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Ammonium nitrate NH₄NO₃ (80 g/mol) is a fertiliser. What percentage of its mass is nitrogen (N = 14)?
    answer:
      value: 35
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 17.5) < 0.5
        misconception: atom-count
        text: The formula contains two N atoms.
    hints:
      - "Count the N atoms: one in NH₄, one in NO₃."
      - 28 ÷ 80 · 100.
    explanation: 28 out of 80 is 35%. That makes ammonium nitrate a particularly strong nitrogen fertiliser.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What percent of the mass of water H₂O is hydrogen? To whole percent.
    params:
      unit: "%"
    answer:
      value: 11
      tolerance: 0.5
    hints:
      - 2 g out of 18 g.
    explanation: 2 ÷ 18 ≈ 11%. Two thirds of the atoms are hydrogen – but only a ninth of the mass.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: A substance is 75% C and 25% H by mass. How many H atoms are there per C atom?
    answer:
      value: 4
    feedback:
      - when: abs(numval(state.input) - 1/3) < 0.01
        misconception: mass-not-moles
        text: "Convert to moles: 75 g of C is 6.25 mol, 25 g of H is 25 mol."
    hints:
      - "Assume 100 g: 75 g of C and 25 g of H."
      - 75 ÷ 12 = 6.25 mol C, 25 ÷ 1 = 25 mol H.
    explanation: 25 ÷ 6.25 = 4. The empirical formula is CH₄ – methane. That is how formulas are found from measurements.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Chlorine has an average atomic mass of 35.45 u – not a whole number. Where does that come from?
    params:
      options:
        - label: It is a mix of about 76% Cl-35 and 24% Cl-37
          correct: true
        - label: A chlorine atom has 35.45 neutrons
          feedback: Particles only come in whole numbers.
        - label: The electrons weigh 0.45 u
          feedback: 17 electrons weigh only about 0.01 u.
    hints:
      - Chlorine has two stable isotopes.
      - 0.76 · 35 + 0.24 · 37 ≈ ?
    explanation: 0.76 · 35 + 0.24 · 37 ≈ 35.5. The atomic masses in the periodic table are weighted averages of the isotopes.
    difficulty: 3

srs:
  cards_from: [co2, gramm]
