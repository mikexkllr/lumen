id: chem.mole.gas
type: concept
title: Gase in Zahlen
summary: Ein Mol Gas, rund 24 Liter.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Bei Raumtemperatur nimmt ein Mol **jedes** Gases rund **24 Liter** ein – egal ob Helium oder Kohlendioxid. Die Teilchen sind winzig, entscheidend sind die Abstände zwischen ihnen.

  - kind: problem
    id: liter
    widget: numeric
    prompt: Wie viel Platz nehmen {{n}} mol eines Gases bei Raumtemperatur ein?
    params: { unit: L }
    answer: { value: "{{24 * n}}" }
    hints:
      - Ein Mol, 24 Liter.
    explanation: "{{n}} · 24 = {{24 * n}} Liter."
    variants:
      params: { n: "int[2,10]" }
      defaults: { n: 3 }

  - kind: problem
    id: gleich
    widget: choice
    prompt: Warum nimmt ein Mol jedes Gases fast denselben Raum ein?
    params:
      options:
        - { label: Die Teilchen sind winzig gegenüber ihren Abständen., correct: true }
        - { label: Alle Gasteilchen sind gleich groß., feedback: "CO₂-Moleküle sind viel größer als Heliumatome." }
    hints:
      - Wie viel des Gasvolumens ist eigentlich Teilchen?
    explanation: Ein Gas ist fast nur leerer Raum – die Teilchengröße spielt kaum eine Rolle.

  - kind: problem
    id: ballon
    widget: numeric
    prompt: Ein Ballon enthält 48 Liter Helium bei Raumtemperatur. Wie viel Mol sind das?
    params: { unit: mol }
    answer: { value: 2 }
    hints:
      - 48 geteilt durch 24.
    explanation: 2 mol Helium – das wiegt nur 8 g.

srs:
  cards_from: [liter, gleich]
