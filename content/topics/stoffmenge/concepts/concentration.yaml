id: chem.mole.concentration
type: concept
title: Konzentration
summary: Wie viel steckt in einem Liter?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Ein Löffel Sirup in einem kleinen Glas oder in einem großen Krug Wasser: Wo schmeckt es süßer?"
    params:
      options:
        - label: Im kleinen Glas
          correct: true
        - label: Im großen Krug
          feedback: Dort ist der Sirup stark verdünnt.
        - label: Gleich
          feedback: Es kommt auf die Wassermenge an.
    hints:
      - Dieselbe Menge Sirup in weniger Wasser.
    explanation: Nicht die Menge allein zählt, sondern Menge pro Liter.

  - kind: explain
    id: s1
    body: |
      Die **Konzentration** sagt, wie viel Stoff in einem Liter Lösung steckt: $c = \frac{n}{V}$ – Stoffmenge geteilt durch Volumen, in mol pro Liter.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: "{{n}} mol Salz werden in {{v}} Litern Wasser gelöst. Wie groß ist die Konzentration?"
    params: { unit: mol/L }
    answer: { value: "{{c}}" }
    hints:
      - Stoffmenge geteilt durch Volumen.
    explanation: "{{n}} : {{v}} = {{c}} mol/L."
    variants:
      params: { v: "choice[2,4,5]", c: "choice[0.5,1,2,3]" }
      derive: { n: "c * v" }
      defaults: { v: 4, c: 0.5 }

  - kind: problem
    id: verduennen
    widget: choice
    prompt: Du verdünnst eine Lösung auf das doppelte Volumen. Was passiert mit der Konzentration?
    params:
      options:
        - { label: Sie halbiert sich., correct: true }
        - { label: Sie verdoppelt sich., feedback: "Gleich viel Stoff in mehr Wasser – es wird dünner." }
        - { label: Sie bleibt gleich., feedback: "Die Stoffmenge bleibt gleich, das Volumen nicht." }
    hints:
      - Gleiche Menge Stoff, doppeltes Volumen.
    explanation: Gleiche Stoffmenge auf doppeltes Volumen – halbe Konzentration.

  - kind: problem
    id: menge
    widget: numeric
    prompt: Eine Lösung hat 2 mol/L. Wie viel Mol stecken in {{v}} Litern?
    params: { unit: mol }
    answer: { value: "{{2 * v}}" }
    hints:
      - Konzentration mal Volumen.
    explanation: "2 · {{v}} = {{2 * v}} mol."
    variants:
      params: { v: "int[2,9]" }
      defaults: { v: 3 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viel Gramm Kochsalz NaCl (58,5 g/mol) braucht man für 2 Liter Lösung mit 0,5 mol/L?
    params:
      unit: g
    answer:
      value: 58.5
    hints:
      - "Erst die Stoffmenge: 0,5 mol/L · 2 L."
    explanation: 1 mol, also 58,5 g.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Du brauchst 500 ml einer Lösung mit 0,2 mol/L und hast eine Vorratslösung mit 2 mol/L. Wie viele Milliliter davon nimmst du?
    params:
      unit: ml
    answer:
      value: 50
    hints:
      - c₁ · V₁ = c₂ · V₂.
    explanation: "0,2 · 500 : 2 = 50 ml, aufgefüllt auf 500 ml. Die Stoffmenge bleibt beim Verdünnen gleich."
    difficulty: 3

srs:
  cards_from: [rechnen, verduennen]
