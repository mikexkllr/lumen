id: chem.mole.stoich
type: concept
title: Reaktionen berechnen
summary: Wie viel kommt heraus?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Chemie nach Rezept
    body: "Ein Koch weiß, wie viel Mehl er für jedes Ei braucht. Chemiker wissen das auch – für Atome. Deck die Karten auf: Wo muss das **Mengenverhältnis** genau stimmen?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚀
            front: Die Rakete
            back: Ingenieure rechnen genau aus, wie viel Sauerstoff zum Wasserstoff passt – jedes Kilo zu viel ist Ballast.
          - icon: 🎈
            front: Der Airbag
            back: 130 Gramm Pulver werden in Millisekunden zu rund 70 Litern Gas.
          - icon: 🧁
            front: Backpulver
            back: Säure und Natron sind darin genau abgewogen. Zu viel Natron schmeckt seifig.
          - icon: 🔥
            front: Der Gasherd
            back: Bekommt die Flamme zu wenig Luft, entsteht giftiges Kohlenmonoxid.

  - kind: problem
    id: hook
    widget: numeric
    prompt: Für ein Fahrrad braucht man 2 Räder und 1 Rahmen. Du hast 10 Räder und genug Rahmen. Wie viele Fahrräder kannst du bauen?
    answer:
      value: 5
    hints:
      - 10 geteilt durch 2.
    explanation: Feste Verhältnisse – genau so rechnet man auch bei chemischen Reaktionen.

  - kind: explain
    id: s1
    body: |
      Die Zahlen in einer **Reaktionsgleichung** sind Mengenverhältnisse in Mol. Bei $2\,\mathrm{H_2} + \mathrm{O_2} \to 2\,\mathrm{H_2O}$ entstehen aus 1 mol Sauerstoff 2 mol Wasser.

  - kind: problem
    id: verhaeltnis
    widget: numeric
    prompt: "2 H₂ + O₂ → 2 H₂O. Wie viel Mol Wasser entstehen aus {{n}} mol Sauerstoff?"
    params: { unit: mol }
    answer: { value: "{{2 * n}}" }
    hints:
      - Pro O₂ entstehen zwei H₂O.
    explanation: "{{n}} · 2 = {{2 * n}} mol Wasser."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: problem
    id: gramm
    widget: numeric
    prompt: Aus 4 g Wasserstoff H₂ (2 g pro Mol) – wie viel Gramm Wasser entstehen höchstens?
    params: { unit: g }
    answer: { value: 36 }
    hints:
      - 4 g H₂ sind 2 mol. Daraus werden 2 mol Wasser.
    explanation: 2 mol · 18 g = 36 g Wasser.

  - kind: problem
    id: rest
    widget: choice
    prompt: Du hast 4 mol H₂, aber nur 1 mol O₂. Was begrenzt die Reaktion?
    params:
      options:
        - { label: Der Sauerstoff, correct: true }
        - { label: Der Wasserstoff, feedback: "Für 4 mol H₂ bräuchte man 2 mol O₂ – es ist nur 1 mol da." }
    hints:
      - Wie viel O₂ bräuchten 4 mol H₂?
    explanation: 1 mol O₂ reicht nur für 2 mol H₂ – 2 mol H₂ bleiben übrig.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: CH₄ + 2 O₂ → CO₂ + 2 H₂O. Wie viel Gramm CO₂ (44 g/mol) entstehen aus 32 g Methan (16 g/mol)?
    params:
      unit: g
    answer:
      value: 88
    hints:
      - 32 g Methan sind 2 mol. Aus 1 mol Methan wird 1 mol CO₂.
    explanation: "2 mol · 44 g/mol = 88 g. Immer über das Mol rechnen: Gramm → Mol → Mol → Gramm."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: order
    prompt: Ordne die Schritte, mit denen man ausrechnet, wie viel Produkt entsteht.
    params:
      items:
        - label: Gleichung aufstellen und ausgleichen
        - label: Gegebene Masse in Mol umrechnen
        - label: Mit dem Verhältnis aus der Gleichung umrechnen
        - label: Mol des Produkts in Gramm umrechnen
    hints:
      - Rechnen kann man nur mit einer ausgeglichenen Gleichung.
      - Die Gleichung spricht in Mol, die Waage in Gramm.
    explanation: Gramm → Mol → Mol → Gramm. Dieser Weg funktioniert für jede Reaktion.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: 2 H₂ + O₂ → 2 H₂O. Du hast {{a}} mol H₂ und {{b}} mol O₂. Wie viel Mol Wasser entstehen höchstens?
    params:
      unit: mol
    answer:
      value: "{{min(a, 2 * b)}}"
    feedback:
      - when: numval(state.input) == max(a, 2 * b)
        misconception: limiting-reagent
        text: Der Stoff, der zuerst aufgebraucht ist, begrenzt die Reaktion.
    hints:
      - "{{a}} mol H₂ reichen für {{a}} mol Wasser, {{b}} mol O₂ für {{2 * b}} mol."
      - Der kleinere Wert zählt.
    explanation: Höchstens {{min(a, 2 * b)}} mol Wasser. Vom anderen Stoff bleibt ein Rest übrig.
    difficulty: 2
    variants:
      params:
        a: int[2,10]
        b: int[1,6]
      constraints:
        - a != 2 * b
      defaults:
        a: 6
        b: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: 2 H₂ + O₂ → 2 H₂O. Wie viel Gramm Wasser entstehen aus {{m}} g Wasserstoff?
    params:
      unit: g
    answer:
      value: "{{9 * m}}"
    feedback:
      - when: numval(state.input) == m
        misconception: mass-ignored
        text: Der Sauerstoff kommt mit seiner Masse dazu.
    hints:
      - "{{m}} g H₂ sind {{m / 2}} mol, daraus werden {{m / 2}} mol H₂O."
      - Ein Mol Wasser wiegt 18 g.
    explanation: "{{m / 2}} mol · 18 g/mol = {{9 * m}} g. Wasser wiegt neunmal so viel wie der Wasserstoff darin."
    difficulty: 2
    variants:
      params:
        m: int[1,10]
      defaults:
        m: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: N₂ + 3 H₂ → 2 NH₃. Du hast 2 mol N₂ und 3 mol H₂. Wie viel Mol NH₃ können höchstens entstehen?
    params:
      unit: mol
    answer:
      value: 2
    hints:
      - 3 mol H₂ reichen nur für 1 mol N₂.
    explanation: Der Wasserstoff ist der **begrenzende Reaktant**. 1 mol N₂ bleibt übrig.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Theoretisch könnten {{t}} g Produkt entstehen, du erhältst {{e}} g. Wie viel Prozent beträgt die Ausbeute?
    params:
      unit: "%"
    answer:
      value: "{{p}}"
      tolerance: 0.01
    hints:
      - "Ausbeute = erhalten : möglich · 100."
      - "Rechne {{e}} : {{t}} · 100."
    explanation: "{{e}} : {{t}} = {{p / 100}}, also {{p}} %. Verluste entstehen durch Nebenreaktionen, Gleichgewichte und beim Reinigen."
    difficulty: 3
    variants:
      params:
        t: choice[40,80,200]
        p: step[50,95,5]
      derive:
        e: t * p / 100
      defaults:
        t: 80
        p: 75

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: N₂ + 3 H₂ → 2 NH₃. Wie viel Kilogramm Ammoniak (17 g/mol) entstehen höchstens aus 28 kg Stickstoff (28 g/mol)?
    params:
      unit: kg
    answer:
      value: 34
    feedback:
      - when: numval(state.input) == 17
        misconception: coefficient-ignored
        text: Aus einem N₂ entstehen zwei NH₃.
    hints:
      - 28 kg N₂ sind 1 kmol.
      - Daraus werden 2 kmol NH₃.
    explanation: 2 kmol · 17 kg/kmol = 34 kg. Der Wasserstoff liefert die restlichen 6 kg.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: 2 Mg + O₂ → 2 MgO. Du verbrennst {{m}} g Magnesium (24 g/mol). Wie viel wiegt das Magnesiumoxid (40 g/mol)?
    params:
      unit: g
    answer:
      value: "{{20 * k}}"
    feedback:
      - when: numval(state.input) == m
        misconception: mass-ignored
        text: Die Asche wiegt mehr – der Sauerstoff ist jetzt eingebaut.
    hints:
      - "{{m}} g Mg sind {{m / 24}} mol."
      - Gleich viel Mol MgO, je 40 g.
    explanation: "{{m / 24}} mol · 40 g/mol = {{20 * k}} g. Verbranntes Metall wird schwerer – das brachte Lavoisier auf den Sauerstoff."
    difficulty: 3
    variants:
      params:
        k: int[1,6]
      derive:
        m: 12 * k
      defaults:
        k: 2

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man aus einer Reaktionsgleichung ausrechnet, wie viel Produkt entsteht.
    params:
      keywords:
        - - mol
          - stoffmenge
          - amount
        - - verhältnis
          - faktor
          - koeffizient
          - ratio
          - coefficient
        - - masse
          - gramm
          - mass
          - gram
          - molare
          - molar
      sample: Man rechnet die Masse des Ausgangsstoffs mit der molaren Masse in Mol um. Die Zahlen in der Gleichung geben das Verhältnis der Stoffmengen. Mit der molaren Masse des Produkts rechnet man zurück in Gramm.
    explanation: Die Gleichung zählt Teilchen in Mol – Gramm braucht man nur am Anfang und am Ende.
    difficulty: 3

srs:
  cards_from: [verhaeltnis, rest]
