id: chem.mole.gas
type: concept
title: Gases in numbers
summary: One mole of gas, about 24 liters.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      At room temperature, one mole of **any** gas takes up about **24 liters** – whether helium or carbon dioxide. The particles are tiny, and the distances between them are what count.

  - kind: problem
    id: liter
    widget: numeric
    prompt: How much space do {{n}} mol of a gas take up at room temperature?
    params: { unit: L }
    answer: { value: "{{24 * n}}" }
    hints:
      - One mole, 24 liters.
    explanation: "{{n}} · 24 = {{24 * n}} liters."
    variants:
      params: { n: "int[2,10]" }
      defaults: { n: 3 }

  - kind: problem
    id: gleich
    widget: choice
    prompt: Why does one mole of any gas take up almost the same space?
    params:
      options:
        - { label: The particles are tiny compared with their distances., correct: true }
        - { label: All gas particles are the same size., feedback: "CO₂ molecules are much larger than helium atoms." }
    hints:
      - How much of a gas's volume is actually particles?
    explanation: A gas is almost all empty space – particle size hardly matters.

  - kind: problem
    id: ballon
    widget: numeric
    prompt: A balloon holds 48 liters of helium at room temperature. How many moles is that?
    params: { unit: mol }
    answer: { value: 2 }
    hints:
      - 48 divided by 24.
    explanation: 2 mol of helium – that weighs only 8 g.

srs:
  cards_from: [liter, gleich]
