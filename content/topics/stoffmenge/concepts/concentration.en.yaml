id: chem.mole.concentration
type: concept
title: Concentration
summary: How much is in one liter?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "A spoon of syrup in a small glass or in a big jug of water: where does it taste sweeter?"
    params:
      options:
        - label: In the small glass
          correct: true
        - label: In the big jug
          feedback: There the syrup is heavily diluted.
        - label: The same
          feedback: It depends on the amount of water.
    hints:
      - The same amount of syrup in less water.
    explanation: It is not the amount alone that counts but the amount per litre.

  - kind: explain
    id: s1
    body: |
      The **concentration** tells you how much substance is in one liter of solution: $c = \frac{n}{V}$ – amount of substance divided by volume, in moles per liter.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: "{{n}} mol of salt is dissolved in {{v}} liters of water. What is the concentration?"
    params: { unit: mol/L }
    answer: { value: "{{c}}" }
    hints:
      - Amount of substance divided by volume.
    explanation: "{{n}} ÷ {{v}} = {{c}} mol/L."
    variants:
      params: { v: "choice[2,4,5]", c: "choice[0.5,1,2,3]" }
      derive: { n: "c * v" }
      defaults: { v: 4, c: 0.5 }

  - kind: problem
    id: verduennen
    widget: choice
    prompt: You dilute a solution to double the volume. What happens to the concentration?
    params:
      options:
        - { label: It halves., correct: true }
        - { label: It doubles., feedback: "The same amount of substance in more water – it gets thinner." }
        - { label: It stays the same., feedback: "The amount of substance stays the same, the volume does not." }
    hints:
      - Same amount of substance, double the volume.
    explanation: The same amount of substance in double the volume – half the concentration.

  - kind: problem
    id: menge
    widget: numeric
    prompt: A solution has 2 mol/L. How many moles are in {{v}} liters?
    params: { unit: mol }
    answer: { value: "{{2 * v}}" }
    hints:
      - Concentration times volume.
    explanation: "2 · {{v}} = {{2 * v}} mol."
    variants:
      params: { v: "int[2,9]" }
      defaults: { v: 3 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many grams of table salt NaCl (58.5 g/mol) are needed for 2 litres of solution at 0.5 mol/L?
    params:
      unit: g
    answer:
      value: 58.5
    hints:
      - "First the amount: 0.5 mol/L · 2 L."
    explanation: 1 mol, so 58.5 g.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: You need 500 ml of a 0.2 mol/L solution and have a stock solution of 2 mol/L. How many millilitres of it do you take?
    params:
      unit: ml
    answer:
      value: 50
    hints:
      - c₁ · V₁ = c₂ · V₂.
    explanation: 0.2 · 500 ÷ 2 = 50 ml, topped up to 500 ml. The amount of substance stays the same when diluting.
    difficulty: 3

srs:
  cards_from: [rechnen, verduennen]
