id: chem.mole.concentration
type: concept
title: Concentration
summary: How much is in one liter?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "A spoon of syrup in a small glass or in a big jug of water: where does it taste sweeter?"
    params:
      options:
        - label: In the small glass
          correct: true
        - label: In the big jug
          feedback: There the syrup is heavily diluted.
        - label: The same
          feedback: It depends on the amount of water.
    hints:
      - The same amount of syrup in less water.
    explanation: It is not the amount alone that counts but the amount per litre.

  - kind: explain
    id: s1
    body: |
      The **concentration** tells you how much substance is in one liter of solution: $c = \frac{n}{V}$ – amount of substance divided by volume, in moles per liter.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: "{{n}} mol of salt is dissolved in {{v}} liters of water. What is the concentration?"
    params: { unit: mol/L }
    answer: { value: "{{c}}" }
    hints:
      - Amount of substance divided by volume.
    explanation: "{{n}} ÷ {{v}} = {{c}} mol/L."
    variants:
      params: { v: "choice[2,4,5]", c: "choice[0.5,1,2,3]" }
      derive: { n: "c * v" }
      defaults: { v: 4, c: 0.5 }

  - kind: problem
    id: verduennen
    widget: choice
    prompt: You dilute a solution to double the volume. What happens to the concentration?
    params:
      options:
        - { label: It halves., correct: true }
        - { label: It doubles., feedback: "The same amount of substance in more water – it gets thinner." }
        - { label: It stays the same., feedback: "The amount of substance stays the same, the volume does not." }
    hints:
      - Same amount of substance, double the volume.
    explanation: The same amount of substance in double the volume – half the concentration.

  - kind: problem
    id: menge
    widget: numeric
    prompt: A solution has 2 mol/L. How many moles are in {{v}} liters?
    params: { unit: mol }
    answer: { value: "{{2 * v}}" }
    hints:
      - Concentration times volume.
    explanation: "2 · {{v}} = {{2 * v}} mol."
    variants:
      params: { v: "int[2,9]" }
      defaults: { v: 3 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many grams of table salt NaCl (58.5 g/mol) are needed for 2 litres of solution at 0.5 mol/L?
    params:
      unit: g
    answer:
      value: 58.5
    hints:
      - "First the amount: 0.5 mol/L · 2 L."
    explanation: 1 mol, so 58.5 g.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: You dilute {{v1}} ml of a {{c1}} mol/L solution to {{v2}} ml. What is its concentration afterwards?
    params:
      unit: mol/L
    answer:
      value: "{{c1 / f}}"
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - c1 * f) < 0.001
        misconception: dilution-direction
        text: Diluting makes the solution weaker, not stronger.
    hints:
      - "The amount stays the same: c₁ · V₁ = c₂ · V₂."
      - The volume becomes {{f}} times as large.
    explanation: "{{c1}} · {{v1}} = c₂ · {{v2}}, so c₂ = {{c1 / f}} mol/L."
    difficulty: 2
    variants:
      params:
        v1: choice[10,20,50]
        c1: choice[1,2,5]
        f: choice[2,4,5,10]
      derive:
        v2: v1 * f
      defaults:
        v1: 20
        c1: 2
        f: 5

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: IV drips contain 9 g of table salt NaCl (58.5 g/mol) per litre. What is that in mol/L? Give three decimal places.
    answer:
      value: 0.154
      tolerance: 0.001
    hints:
      - "First work out the amount: 9 g ÷ 58.5 g/mol."
      - That is in exactly one litre.
    explanation: 9 ÷ 58.5 ≈ 0.154 mol/L. This "physiological saline" has about the same salt content as blood.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: You mix 1 litre of a 1 mol/L solution with 1 litre of a 3 mol/L solution of the same substance. What is the concentration of the mixture?
    params:
      options:
        - label: 2 mol/L
          correct: true
        - label: 4 mol/L
          feedback: The amounts add up – but so do the volumes.
        - label: 3 mol/L
          feedback: The weaker solution dilutes the stronger one.
    hints:
      - Together that is 4 mol in 2 litres.
      - c = n ÷ V.
    explanation: 4 mol ÷ 2 L = 2 mol/L. With equal volumes it is the average.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: You need 500 ml of a 0.2 mol/L solution and have a stock solution of 2 mol/L. How many millilitres of it do you take?
    params:
      unit: ml
    answer:
      value: 50
    hints:
      - c₁ · V₁ = c₂ · V₂.
    explanation: 0.2 · 500 ÷ 2 = 50 ml, topped up to 500 ml. The amount of substance stays the same when diluting.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Drinking water may contain up to 50 mg of nitrate NO₃⁻ (62 g/mol) per litre. How many millimoles per litre is that? Give two decimal places.
    params:
      unit: mmol/L
    answer:
      value: 0.81
      tolerance: 0.01
    hints:
      - mg divided by g/mol gives mmol.
      - Work out 50 ÷ 62.
    explanation: 50 ÷ 62 ≈ 0.81 mmol/L. Too much nitrate often comes from manure and fertiliser.
    difficulty: 3

  - kind: explain
    id: ch-x2
    depth: 3
    body: "For many effects what counts is not the amount of substance but the number of dissolved particles. Salts split into ions: NaCl into two, CaCl₂ into three. This is the **particle concentration**."

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: How many moles of dissolved particles per litre does a {{c}} mol/L calcium chloride CaCl₂ solution contain?
    params:
      unit: mol/L
    answer:
      value: "{{3 * c}}"
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - c) < 0.001
        misconception: no-dissociation
        text: CaCl₂ splits into Ca²⁺ and two Cl⁻ – three particles.
    hints:
      - CaCl₂ → Ca²⁺ + 2 Cl⁻.
      - Work out {{c}} · 3.
    explanation: "{{c}} · 3 = {{3 * c}} mol/L of particles. That is why CaCl₂ melts ice even better than NaCl."
    difficulty: 3
    variants:
      params:
        c: step[0.1,1,0.1]
      defaults:
        c: 0.5

srs:
  cards_from: [rechnen, verduennen]
