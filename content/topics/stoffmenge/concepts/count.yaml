id: chem.mole.count
type: concept
title: Das Mol
summary: Ein Dutzend für Atome.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zählen in Packungen
    body: Niemand zählt Reiskörner einzeln. Man packt sie ab oder wiegt sie. Chemiker machen es mit Atomen genauso – ihre Packung heißt **Mol**. Deck die Karten auf.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🥚
            front: Ein Dutzend
            back: Zwölf Stück auf einmal. So zählt man Eier schon seit Jahrhunderten.
          - icon: 📄
            front: Ein Paket Papier
            back: Papier kauft man in Paketen zu 500 Blatt. Niemand zählt die Blätter nach.
          - icon: 🌾
            front: Ein Sack Reis
            back: Händler wiegen Reis, statt Körner zu zählen – das Gewicht verrät die Zahl.
          - icon: ⚗️
            front: Ein Mol
            back: Die Packung der Chemiker. Wie viele Teilchen hineinpassen, schätzt du gleich selbst.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Wassermoleküle sind in einem Schluck Wasser (18 g)? Gib die Zahl der Stellen an."
    params:
      min: 5
      max: 50
    answer:
      value: 24
      tolerance: 3
    explanation: 6 · 10²³ – eine Zahl mit 24 Stellen. Mehr als es Sterne im sichtbaren Universum gibt.

  - kind: problem
    id: dutzend
    widget: numeric
    prompt: Ein Dutzend sind 12 Stück. Wie viele Eier sind {{n}} Dutzend?
    params: { unit: Eier }
    answer: { value: "{{12 * n}}" }
    hints:
      - "{{n}} · 12."
    explanation: "{{12 * n}} Eier. Ein Mol ist genau so eine Zählgröße – nur riesig."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: explain
    id: s2
    body: |
      Ein **Mol** sind $6{,}022 \cdot 10^{23}$ Teilchen. Atome sind so winzig, dass man diese gewaltige Zahl braucht, um auf handliche Mengen zu kommen – ein Mol Wasser ist ein Schluck von 18 ml.

  - kind: problem
    id: atome
    widget: numeric
    prompt: Wie viele Mol Wasserstoffatome stecken in {{n}} mol Wasser H₂O?
    params: { unit: mol }
    answer: { value: "{{2 * n}}" }
    feedback:
      - when: "numval(state.input) == n"
        misconception: count-molecules
        text: Jedes Wassermolekül hat zwei Wasserstoffatome.
    hints:
      - Pro Molekül zwei H.
    explanation: "{{n}} · 2 = {{2 * n}} mol H-Atome."
    variants:
      params: { n: "int[2,8]" }
      defaults: { n: 3 }

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum zählen Chemiker in Mol statt in einzelnen Atomen?
    params:
      options:
        - { label: Einzelne Atome sind viel zu winzig und zahlreich., correct: true }
        - { label: Atome lassen sich nicht zählen., feedback: "Zählen geht – über das Wiegen, genau dafür ist das Mol da." }
    hints:
      - Wie viele Atome sind in einem Gramm?
    explanation: Mit dem Mol rechnet man in handlichen Zahlen statt in Quadrillionen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Mol Atome insgesamt stecken in 2 mol Methan CH₄?
    params:
      unit: mol
    answer:
      value: 10
    hints:
      - Ein Molekül hat 5 Atome.
    explanation: 2 · 5 = 10 mol Atome.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Wie viele Teilchen sind {{n}} mol? Gib die Zahl vor »· 10²³« an.
    answer:
      value: "{{6.022 * n}}"
      tolerance: 0.01
    hints:
      - 1 mol sind 6,022 · 10²³ Teilchen.
      - Rechne {{n}} · 6,022.
    explanation: "{{n}} · 6,022 = {{6.022 * n}}, also {{6.022 * n}} · 10²³ Teilchen."
    difficulty: 2
    variants:
      params:
        n: step[0.5,5,0.5]
      defaults:
        n: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Wie viel Mol sind 3,011 · 10²³ Kohlenstoffatome?
    answer:
      value: 0.5
    feedback:
      - when: numval(state.input) == 2
        misconception: inverted-ratio
        text: "Umgekehrt: Teile die Teilchenzahl durch 6,022 · 10²³."
    hints:
      - 3,011 ist genau die Hälfte von 6,022.
      - "n = Teilchenzahl : 6,022 · 10²³."
    explanation: Ein halbes Mol – das sind genau 6 g Kohlenstoff.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Du zählst ein Mol Reiskörner, eins pro Sekunde, ohne Pause. Wie viele Jahre dauert das?"
    params:
      min: 1
      max: 100000000000000000000
      scale: log
      unit: Jahre
    answer:
      value: 19000000000000000
      tolerance: 12000000000000000
    explanation: Rund 1,9 · 10¹⁶ Jahre – über eine Million Mal so lang, wie das Universum alt ist. Atome sind unvorstellbar klein.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Woher kommt die krumme Zahl 6,022 · 10²³?
    params:
      options:
        - label: Sie ist so gewählt, dass 1 mol Kohlenstoff-12 fast genau 12 Gramm wiegt
          correct: true
        - label: Sie wurde zufällig festgelegt
          feedback: Sie verbindet die Atommasse in u mit dem Gramm.
        - label: So viele Atome hat das Universum
          feedback: Das Universum hat rund 10⁸⁰.
    hints:
      - Die Massenzahl in u und die Molmasse in Gramm sind dieselbe Zahl.
    explanation: Die **Avogadro-Konstante** ist die Brücke zwischen der Welt der Atome und der Waage.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Seit 2019 ist die **Avogadro-Konstante** exakt festgelegt: $N_A = 6{,}022\\,140\\,76 \\cdot 10^{23}$ pro Mol. Ein Mol ist damit einfach eine feste Stückzahl – wie ein Dutzend."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: 1 mol Wasser wiegt 18 g. Wie viel wiegt ein einziges Wassermolekül? Gib die Zahl vor »· 10⁻²³ g« an, auf eine Nachkommastelle.
    answer:
      value: 3
      tolerance: 0.05
    hints:
      - Teile 18 g durch 6,022 · 10²³.
      - "18 : 6 = 3, die Hochzahl wird negativ."
    explanation: Etwa 3,0 · 10⁻²³ g. Eine Waage müsste 23 Nullen hinter dem Komma auflösen.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: "Was ist größer: die Zahl der Moleküle in einem Glas Wasser (250 ml) – oder die Zahl der Gläser Wasser in allen Ozeanen?"
    params:
      options:
        - label: Die Moleküle im Glas – über tausendmal mehr
          correct: true
        - label: Die Gläser im Ozean
          feedback: Der Ozean hat etwa 5 · 10²¹ Gläser, das Glas fast 10²⁵ Moleküle.
        - label: Beide sind etwa gleich
          feedback: Dazwischen liegen über drei Zehnerpotenzen.
    hints:
      - 250 g Wasser sind fast 14 mol.
      - 14 · 6 · 10²³ ≈ 8 · 10²⁴.
    explanation: Etwa 8 · 10²⁴ Moleküle gegen rund 5 · 10²¹ Gläser. Darum steckt in jedem Glas statistisch ein Molekül, das schon durch Cleopatra floss.
    difficulty: 3

srs:
  cards_from: [atome, warum]
