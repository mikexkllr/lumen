id: chem.mole.count
type: concept
title: Das Mol
summary: Ein Dutzend für Atome.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Wassermoleküle sind in einem Schluck Wasser (18 g)? Gib die Zahl der Stellen an."
    params:
      min: 5
      max: 50
    answer:
      value: 24
      tolerance: 3
    explanation: 6 · 10²³ – eine Zahl mit 24 Stellen. Mehr als es Sterne im sichtbaren Universum gibt.


  - kind: problem
    id: dutzend
    widget: numeric
    prompt: Ein Dutzend sind 12 Stück. Wie viele Eier sind {{n}} Dutzend?
    params: { unit: Eier }
    answer: { value: "{{12 * n}}" }
    hints:
      - "{{n}} · 12."
    explanation: "{{12 * n}} Eier. Ein Mol ist genau so eine Zählgröße – nur riesig."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: explain
    id: s2
    body: |
      Ein **Mol** sind $6{,}022 \cdot 10^{23}$ Teilchen. Atome sind so winzig, dass man diese gewaltige Zahl braucht, um auf handliche Mengen zu kommen – ein Mol Wasser ist ein Schluck von 18 ml.

  - kind: problem
    id: atome
    widget: numeric
    prompt: Wie viele Mol Wasserstoffatome stecken in {{n}} mol Wasser H₂O?
    params: { unit: mol }
    answer: { value: "{{2 * n}}" }
    feedback:
      - when: "numval(state.input) == n"
        misconception: count-molecules
        text: Jedes Wassermolekül hat zwei Wasserstoffatome.
    hints:
      - Pro Molekül zwei H.
    explanation: "{{n}} · 2 = {{2 * n}} mol H-Atome."
    variants:
      params: { n: "int[2,8]" }
      defaults: { n: 3 }

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum zählen Chemiker in Mol statt in einzelnen Atomen?
    params:
      options:
        - { label: Einzelne Atome sind viel zu winzig und zahlreich., correct: true }
        - { label: Atome lassen sich nicht zählen., feedback: "Zählen geht – über das Wiegen, genau dafür ist das Mol da." }
    hints:
      - Wie viele Atome sind in einem Gramm?
    explanation: Mit dem Mol rechnet man in handlichen Zahlen statt in Quadrillionen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Mol Atome insgesamt stecken in 2 mol Methan CH₄?
    params:
      unit: mol
    answer:
      value: 10
    hints:
      - Ein Molekül hat 5 Atome.
    explanation: 2 · 5 = 10 mol Atome.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Woher kommt die krumme Zahl 6,022 · 10²³?
    params:
      options:
        - label: Sie ist so gewählt, dass 1 mol Kohlenstoff-12 fast genau 12 Gramm wiegt
          correct: true
        - label: Sie wurde zufällig festgelegt
          feedback: Sie verbindet die Atommasse in u mit dem Gramm.
        - label: So viele Atome hat das Universum
          feedback: Das Universum hat rund 10⁸⁰.
    hints:
      - Die Massenzahl in u und die Molmasse in Gramm sind dieselbe Zahl.
    explanation: Die **Avogadro-Konstante** ist die Brücke zwischen der Welt der Atome und der Waage.
    difficulty: 3

srs:
  cards_from: [atome, warum]
