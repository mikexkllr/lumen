id: ai.vision.classify
type: concept
title: Recognizing, and getting it wrong
summary: Wolves, snow and good training images.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: woelfe
    widget: choice
    prompt: A network recognizes wolves very well. Later it turns out that all wolf photos had snow. What did it really learn?
    params:
      options:
        - { label: To recognize snow, correct: true }
        - { label: To recognize wolves, feedback: "Maybe a little. But snow was the easier feature." }
        - { label: Nothing at all, feedback: "It learned something, just not the right thing." }
    hints:
      - What did all the wolf images have in common?
    explanation: Networks pick up any pattern that helps, even a wrong one.

  - kind: explain
    id: s2
    body: |
      Networks learn any pattern that helps, even random ones like snow or watermarks.
      That is why you need **varied** training images.

  - kind: problem
    id: treffer
    widget: numeric
    body: The network takes 45 of 50 cat photos for cats. Of 50 dog photos, it takes 10 for cats.
    prompt: What percent of the “cat” answers are correct? Round to whole percent.
    params: { unit: "%" }
    answer: { value: 82, tolerance: 1 }
    feedback:
      - when: "numval(state.input) == 90"
        misconception: recall-not-precision
        text: 90% of the cats are recognized. But the question is how often “cat” is right.
    hints:
      - In total, it says “cat” 45 + 10 = 55 times.
    explanation: 45 of 55 answers are correct, about 82%.

  - kind: problem
    id: bilder
    widget: buckets
    prompt: Does this help the network, or mislead it?
    params:
      buckets: [{ label: helps }, { label: misleads }]
      items:
        - { label: Photos from many countries, bucket: helps }
        - { label: Images by day and night, bucket: helps }
        - { label: Different cameras, bucket: helps }
        - { label: Only studio photos, bucket: misleads }
        - { label: Always the same background, bucket: misleads }
        - { label: Mislabeled images, bucket: misleads }
    hints:
      - Should the network later understand unusual photos too?
    explanation: Variety helps. Uniform backgrounds and wrong labels teach wrong patterns.

  - kind: explain
    id: s5
    body: Can tiny disturbances fool a network?
    reveal:
      body: Yes. A few subtle pixels can make a network see a monkey instead of a panda. These are called **adversarial examples**.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A model checks 1000 photos: 100 show cats. It reports “cat” 120 times, 90 of which are right. What percent of the real cats did it find?"
    params:
      unit: "%"
    answer:
      value: 90
    hints:
      - 90 of 100 real cats.
    explanation: 90% **recall** – but only 75% of its reports are right. Two different questions.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: A model only knows "cat" and "dog". You show it a toaster. What happens?
    params:
      options:
        - label: It still says cat or dog – possibly even very "confidently".
          correct: true
        - label: It reports "I do not know".
          feedback: For that it would need its own answer "none of these". It never learned one.
        - label: It recognises the toaster.
          feedback: It only knows the two classes from training.
    hints:
      - The output is a distribution over exactly two classes.
      - The values always add up to 100 %.
    explanation: Softmax always spreads 100 % over the known classes. A high number is therefore not real certainty. Good systems also detect when an image is unlike the training data.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A skin cancer detector was excellent in tests. Then it was noticed: many cancer photos included a ruler. What did it learn?"
    params:
      options:
        - label: To recognise rulers – doctors had measured suspicious spots
          correct: true
        - label: To recognise cancer
          feedback: Without the ruler performance dropped markedly.
        - label: Nothing
          feedback: It learnt something – just the wrong thing.
    hints:
      - When does a doctor place a ruler next to a spot?
    explanation: "**Shortcut learning**: networks take the simplest pattern that works. You must check **what** a model looks at."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A cat detector has precision 0.75 (share of alarms that are right) and recall 0.9 (share of cats it finds). The F1 score is 2 · P · R / (P + R). What is it? To two decimals.
    answer:
      value: 0.82
      tolerance: 0.01
    hints:
      - "Numerator: 2 · 0.75 · 0.9 = 1.35."
      - "Denominator: 0.75 + 0.9 = 1.65."
    explanation: 1.35 / 1.65 ≈ 0.82. The F1 score is only high when both values are high. A model that always says "cat" has recall 1 – but terrible precision.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: How could one have noticed early that the wolf detector looks at snow?
    params:
      options:
        - label: Test with pictures of wolves without snow and dogs in snow.
          correct: true
        - label: With even more wolf pictures in snow.
          feedback: They only confirm the mistake.
        - label: From the overall accuracy.
          feedback: That was high – the mistake hides inside it.
    hints:
      - Separate the two features that always came together in training.
      - What does the model say when only one of them is present?
    explanation: Targeted counter-tests expose shortcuts. Heatmaps that show which pixels drive the decision help too. If the snow lights up there, the case is clear.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why high test accuracy does not mean an image model learned the right thing.
    params:
      keywords:
        - - muster
          - abkürzung
          - schnee
          - pattern
          - shortcut
          - snow
        - - test
          - prüf
          - check
        - - neu
          - ander
          - unbekannt
          - new
          - different
          - unseen
      sample: The model may have learned an accidental pattern, such as snow instead of wolf. If the test has the same bias, nobody notices. Only new, different pictures reveal the mistake.
    difficulty: 3

srs:
  cards_from: [treffer, woelfe]
