id: ai.vision.fooled
type: concept
title: Getäuschte Augen
summary: Kleine Änderungen, große Irrtümer.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Pixel zu viel
    body: Für dich ist das eine Sieben. Ein Bildnetz sieht nur Zahlen – und manchmal verwirrt es schon eine **winzige Änderung**. Tippe ein einziges Feld an. Ist es für dich noch eine Sieben?
    visual:
      widget: pixels
      interactive: true
      params:
        cells:
          - "#####"
          - ....#
          - ...#.
          - ..#..
          - .#...
          - .#...
          - .#...

  - kind: problem
    id: zahlen
    widget: numeric
    prompt: Ein Bild hat {{s}} × {{s}} Pixel mit je drei Farbwerten. Wie viele Zahlen sieht das Modell?
    params: { placeholder: "Zahl" }
    answer: { value: "{{s * s * 3}}" }
    hints:
      - Pixel zählen, dann mal 3.
    explanation: "{{s}} · {{s}} · 3 = {{s * s * 3}}. Für das Modell ist ein Foto nur eine lange Zahlenliste."
    variants:
      params: { s: "choice[32,64,100,128]" }
      defaults: { s: 64 }

  - kind: problem
    id: sticker
    widget: choice
    prompt: Ein paar Sticker auf einem Stoppschild – und ein Modell sieht ein Tempolimit. Warum?
    params:
      options:
        - { label: "Es achtet auf Muster, die Menschen egal sind.", correct: true }
        - { label: Das Schild war wirklich unleserlich., feedback: "Menschen erkannten es problemlos." }
    hints:
      - Versteht das Modell, was ein Schild bedeutet?
    explanation: Das Modell rechnet mit Pixelmustern. Gezielte Störungen können es kippen.

  - kind: explain
    id: s3
    body: |
      Solche gezielten Störungen heißen **Adversarial Examples**. Oft sind sie für Menschen unsichtbar – und trotzdem ändert sich die Antwort der KI komplett.

  - kind: problem
    id: wer
    widget: buckets
    prompt: Wen täuscht das?
    params:
      buckets: [{ label: auch Menschen }, { label: nur die KI }]
      items:
        - { label: Gleich lange Linien mit Pfeilspitzen, bucket: auch Menschen }
        - { label: "Wolken, die wie Gesichter aussehen", bucket: auch Menschen }
        - { label: Unsichtbares Pixelrauschen, bucket: nur die KI }
        - { label: Sticker auf einem Stoppschild, bucket: nur die KI }
    hints:
      - Würdest du selbst darauf hereinfallen?
    explanation: Menschen und Maschinen haben verschiedene blinde Flecken.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Kann das ein Bildmodell in die Irre führen?
    params:
      buckets:
        - id: b1
          label: Kann täuschen
        - id: b2
          label: Täuscht kaum
      items:
        - label: Gezieltes, unsichtbares Rauschen
          bucket: b1
        - label: Aufkleber auf dem Stoppschild
          bucket: b1
        - label: Dasselbe Foto noch einmal
          bucket: b2
        - label: Sehr ungewohnter Blickwinkel
          bucket: b1
    hints:
      - Was weicht von den Trainingsbildern ab?
    explanation: Modelle sehen Muster, keine Dinge. Kleine Änderungen können das Muster kippen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Forscher druckten eine Schildkröte in 3D, die ein Bildmodell aus fast jedem Winkel für ein Gewehr hielt. Was zeigt das?
    params:
      options:
        - label: Täuschungen funktionieren auch in der echten Welt, nicht nur in manipulierten Bilddateien
          correct: true
        - label: Schildkröten sehen aus wie Gewehre
          feedback: Für Menschen überhaupt nicht.
        - label: Das Modell war untrainiert
          feedback: Es war ein sehr gutes Standardmodell.
    hints:
      - Die Oberfläche trug ein gezielt berechnetes Muster.
    explanation: Das ist ein Sicherheitsproblem – etwa für selbstfahrende Autos.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Angriff ändert jedes Pixel um höchstens 2 von 255 Helligkeitsstufen. Wie viel Prozent der Skala sind das? Auf zwei Stellen.
    answer:
      value: 0.78
      tolerance: 0.01
    hints:
      - Rechne 2 / 255.
      - Mal 100 für Prozent.
    explanation: Unter 1 % pro Pixel – für uns **unsichtbar**. Weil sich aber zehntausende Pixel alle in die »richtige« Richtung bewegen, summiert sich die Wirkung im Netz.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Was hilft am besten gegen solche Täuschungen?
    params:
      options:
        - label: Das Netz mit Angriffsbildern trainieren – das macht es robuster, aber nicht unverwundbar.
          correct: true
        - label: Ein größeres Netz – das lässt sich nicht täuschen.
          feedback: Auch sehr große Netze sind angreifbar.
        - label: Nichts, das Problem ist gelöst.
          feedback: Es ist ein offenes Forschungsfeld.
    hints:
      - Wie lernt man, mit einer Gefahr umzugehen? Indem man sie übt.
      - Gibt es eine Garantie?
    explanation: "**Adversarial Training** baut Angriffsbilder ins Training ein. Das erhöht die Robustheit deutlich, kostet aber oft etwas Genauigkeit – und neue Angriffe finden neue Lücken."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum sehen Modelle die Welt so anders als wir, obwohl sie Katzen ähnlich gut erkennen?
    params:
      options:
        - label: Sie achten stark auf feine Texturen, wir vor allem auf Formen
          correct: true
        - label: Sie sehen nur Schwarz-Weiß
          feedback: Sie verarbeiten Farbe.
        - label: Es gibt keinen Unterschied
          feedback: Eine Katze mit Elefantenhaut-Muster ist für viele Modelle ein Elefant.
    hints:
      - Was ist eine Katze mit Elefantenhaut für dich – und was für ein Netz?
    explanation: Gleiche Trefferquote heißt nicht gleiche Strategie. Das erklärt, warum winzige Störungen Modelle umwerfen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Wie findet ein Angreifer die winzige Änderung, die das Netz täuscht?
    params:
      options:
        - label: Er berechnet, wie der Fehler auf jedes Pixel reagiert, und schiebt alle Pixel ein Stück in die schädliche Richtung.
          correct: true
        - label: Er probiert zufällige Rauschbilder durch.
          feedback: Zufälliges Rauschen wirkt kaum – der Trick ist die gezielte Richtung.
        - label: Er ändert ein einziges Pixel stark.
          feedback: Das geht manchmal, aber typisch sind viele winzige Änderungen.
    hints:
      - Beim Training schiebt man **Gewichte** gegen den Gradienten. Was könnte man mit den Pixeln tun?
      - Der Angreifer will den Fehler vergrößern, nicht verkleinern.
    explanation: Das ist Gradientenabstieg in umgekehrter Richtung – auf den Pixeln statt auf den Gewichten. Dieselbe Mathematik, die das Netz trainiert, macht es also auch **angreifbar**.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein Adversarial Example ist.
    params:
      keywords:
        - - klein
          - winzig
          - unsichtbar
          - small
          - tiny
          - invisible
        - - änder
          - stör
          - change
          - perturb
        - - falsch
          - täusch
          - irr
          - wrong
          - fool
      sample: Ein Adversarial Example ist ein Bild mit einer winzigen, gezielten Änderung. Für Menschen sieht es gleich aus, aber die KI erkennt es plötzlich falsch.
    difficulty: 3

srs:
  cards_from: [sticker, wer]
