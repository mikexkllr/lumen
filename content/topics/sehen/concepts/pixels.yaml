id: ai.vision.pixels
type: concept
title: Bilder sind Zahlen
summary: Raster, Graustufen und Megapixel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Gesicht aus Zahlen
    body: Für einen Computer ist jedes Foto nur eine **Tabelle aus Zahlen**. Hier steckt hinter jedem Feld eine Zahl von 0 bis 3. Tippe Felder an, um ihren Farbton zu ändern. Kannst du das Gesicht staunen lassen?
    visual:
      widget: pixels
      interactive: true
      params:
        shades: 4
        cells:
          - ..1111..
          - .133331.
          - "13133131"
          - "13333331"
          - "13133131"
          - "13311331"
          - .133331.
          - ..1111..

  - kind: problem
    id: plus
    widget: pixels
    prompt: Zeichne ein Pluszeichen in das Raster. Tippe oder wische über die Felder.
    params: { rows: 5, cols: 5 }
    answer: { pattern: ["..#..", "..#..", "#####", "..#..", "..#.."] }
    hints:
      - Eine senkrechte und eine waagerechte Linie durch die Mitte.
    explanation: Für den Computer ist dein Plus nur eine Tabelle aus 0 und 1.

  - kind: explain
    id: s2
    body: |
      Ein Bild ist ein **Raster aus Zahlen**. Schwarz-Weiß – 0 oder 1. Graustufen – 0 bis 255.
      Farbe – drei Zahlen pro Pixel, für Rot, Grün und Blau.

  - kind: problem
    id: megapixel
    widget: numeric
    prompt: Ein Foto hat {{w}} × {{h}} Pixel. Wie viele Millionen Pixel sind das?
    params: { unit: Megapixel }
    answer: { value: "{{w * h / 1000000}}" }
    hints:
      - "Rechne {{w}} · {{h}} und teile durch eine Million."
    explanation: "{{w}} · {{h}} = {{w * h}} Pixel – also {{w * h / 1000000}} Megapixel."
    variants:
      params: { w: "choice[2000,3000,4000]", h: "choice[1500,2000,3000]" }
      defaults: { w: 4000, h: 3000 }

  - kind: problem
    id: groesse
    widget: numeric
    prompt: Jedes Pixel braucht 3 Bytes. Wie viele Megabyte hat ein Foto mit 12 Megapixeln ohne Kompression?
    params: { unit: MB }
    answer: { value: 36 }
    feedback:
      - when: "numval(state.input) == 12"
        misconception: one-byte
        text: Pro Pixel sind es drei Bytes – für Rot, Grün und Blau.
    hints:
      - 12 Millionen Pixel · 3 Bytes.
    explanation: 12 · 3 = 36 MB.

  - kind: explain
    id: s5
    body: Warum ist ein JPG-Foto trotzdem nur 3 bis 5 MB groß?
    reveal:
      body: Benachbarte Pixel sind sich oft ähnlich. Man speichert Muster statt jedes Pixel einzeln – und lässt Details weg, die das Auge kaum sieht.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Video in Full HD hat 1920 × 1080 Pixel, 3 Bytes pro Pixel und 30 Bilder pro Sekunde. Wie viele Megabyte sind das pro Sekunde – unkomprimiert? Gerundet.
    params:
      unit: MB
    answer:
      value: 187
      tolerance: 2
    hints:
      - 1920 · 1080 · 3 ≈ 6,2 MB pro Bild.
    explanation: Rund 187 MB pro Sekunde. Kompression drückt das auf weniger als ein Hundertstel.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Jeder Farbkanal (Rot, Grün, Blau) hat 8 Bit, also 256 Stufen. Wie viele Millionen Farben gibt es damit? Auf eine Stelle gerundet.
    answer:
      value: 16.8
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 768
        misconception: added
        text: "Die Kanäle werden kombiniert, nicht addiert: 256 · 256 · 256."
    hints:
      - Jede Rot-Stufe passt zu jeder Grün- und jeder Blau-Stufe.
      - 256³ = 2²⁴ ≈ 16 777 216.
    explanation: 256³ ≈ 16,8 Millionen Farben – mehr, als ein Mensch unterscheiden kann. Für ein Netz ist jedes Pixel einfach ein **Zahlentripel**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum mischen Bildschirme Rot, Grün und Blau – und nicht die Malfarben Rot, Gelb und Blau?
    params:
      options:
        - label: Licht addiert sich, und unsere Augen haben genau drei Zapfenarten für etwa diese Farben
          correct: true
        - label: Aus Tradition
          feedback: Es folgt aus der Biologie des Auges.
        - label: Grün ist billiger herzustellen
          feedback: Der Grund liegt im Sehen, nicht im Preis.
    hints:
      - Farbe mischen (Licht wird geschluckt) ist das Gegenteil von Licht mischen.
    explanation: "**Additive** Farbmischung: Rot + Grün ergibt Gelb, alle drei Weiß. Farbe ist letztlich eine Eigenschaft unseres Sehsystems."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein KI-Programm vergrößert ein unscharfes Foto auf das Vierfache und es wirkt scharf. Was ist passiert?
    params:
      options:
        - label: Es hat plausible Details erfunden – die echten Details waren nie gespeichert.
          correct: true
        - label: Es hat die versteckten Originaldetails wiederhergestellt.
          feedback: Was beim Fotografieren nicht erfasst wurde, steckt nicht in den Pixeln.
        - label: Es hat nur die Pixel größer gemacht.
          feedback: Dann sähe das Bild klotzig aus, nicht scharf.
    hints:
      - Wie viele Zahlen hat das kleine Bild, wie viele das große?
      - Woher kommen die zusätzlichen Zahlen?
    explanation: Das Programm füllt die Lücken mit dem, was in ähnlichen Trainingsbildern typisch war. Das sieht echt aus, ist aber eine **Schätzung**. Als Beweismittel taugt so ein Bild nicht.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Computer ein Farbfoto speichert.
    params:
      keywords:
        - - pixel
          - raster
          - grid
        - - zahl
          - wert
          - number
          - value
        - - rot
          - grün
          - blau
          - red
          - green
          - blue
          - rgb
      sample: Ein Foto ist ein Raster aus Pixeln. Jedes Pixel besteht aus drei Zahlen für Rot, Grün und Blau, meist von 0 bis 255.
    difficulty: 3

srs:
  cards_from: [megapixel, groesse]
