id: ai.vision.data
type: concept
title: Gelernt ist, was gezeigt wurde
summary: Lücken in den Daten werden Lücken im Modell.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: kuh
    widget: choice
    prompt: Ein Modell hat Kühe nur auf grünen Wiesen gesehen. Nun steht eine Kuh am Strand. Was passiert?
    params:
      options:
        - { label: Es erkennt die Kuh eher nicht., correct: true }
        - { label: Es erkennt sie sicher., feedback: "Es hat womöglich »grüner Hintergrund« statt »Kuh« gelernt." }
    hints:
      - Was war auf allen Kuhbildern gleich?
    explanation: Das Modell lernte vielleicht das Gras mit. Solche Abkürzungen fallen erst bei neuen Situationen auf.

  - kind: problem
    id: nacht
    widget: numeric
    prompt: Von {{n}} Trainingsfotos sind nur {{p}} % nachts aufgenommen. Wie viele Nachtfotos sind das?
    params: { unit: Fotos }
    answer: { value: "{{n * p / 100}}" }
    hints:
      - "{{p}} % von {{n}}."
    explanation: "Nur {{n * p / 100}} Nachtfotos. Nachts wird das Modell also schlechter sein."
    variants:
      params: { n: "choice[1000,2000,5000,10000]", p: "int[2,9]" }
      defaults: { n: 5000, p: 4 }

  - kind: explain
    id: s3
    body: |
      Ein Modell ist nur so gut wie seine Daten. Fehlen Situationen, Orte oder Menschengruppen, macht es dort mehr Fehler. Darum prüft man Fehlerraten **für jede Gruppe einzeln**.

  - kind: problem
    id: pruefen
    widget: choice
    prompt: Ein Modell trifft insgesamt 95 %. Was solltest du noch prüfen?
    params:
      options:
        - { label: Wie gut es in jeder Untergruppe ist, correct: true }
        - { label: Nichts – 95 % ist gut, feedback: "Ein Durchschnitt kann schwache Gruppen verstecken." }
    hints:
      - Kann ein Durchschnitt etwas verbergen?
    explanation: 99 % bei Tag und 60 % bei Nacht ergeben im Mittel auch einen guten Wert.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Gesichtserkenner macht bei Gruppe A 1 % Fehler und bei Gruppe B 20 %. Der Datensatz besteht zu 90 % aus Gruppe A. Wie hoch ist die Fehlerrate insgesamt in Prozent?
    params:
      unit: "%"
    answer:
      value: 2.9
      tolerance: 0.05
    hints:
      - 0,9 · 1 + 0,1 · 20.
    explanation: 2,9 % – klingt gut und verbirgt, dass jede fünfte Person aus Gruppe B falsch erkannt wird.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum kann eine Bild-KI etwas Falsches lernen, obwohl sie im Test gut abschneidet?"
    params:
      keywords:
        - - muster
          - merkmal
          - pattern
          - feature
          - hintergrund
          - background
          - abkürzung
          - shortcut
        - - daten
          - trainingsbilder
          - data
          - training
        - - zufall
          - zusammen
          - gleichzeitig
          - coincid
          - correlat
          - immer
          - always
          - vielfalt
          - divers
      sample: Sie lernt jedes Muster, das in den Trainingsdaten zufällig mit der Antwort zusammen auftritt, etwa Schnee im Hintergrund von Wolfsfotos. Enthält der Test dieselbe Abkürzung, fällt der Fehler nicht auf.
    difficulty: 3

srs:
  cards_from: [kuh, pruefen]
