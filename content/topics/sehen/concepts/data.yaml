id: ai.vision.data
type: concept
title: Gelernt ist, was gezeigt wurde
summary: Lücken in den Daten werden Lücken im Modell.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Selten geübt
    body: "Ein Auto soll Fußgänger erkennen. Hier ziehst du zufällige Fotos aus seinen **Trainingsdaten**. Zieh 10, dann 100: Wie oft bekommt das Modell überhaupt Nachtfotos zu sehen?"
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: Tag
            weight: 17
          - label: Regen
            weight: 2
          - label: Nacht
            weight: 1
        sample:
          - 10
          - 100

  - kind: problem
    id: kuh
    widget: choice
    prompt: Ein Modell hat Kühe nur auf grünen Wiesen gesehen. Nun steht eine Kuh am Strand. Was passiert?
    params:
      options:
        - { label: Es erkennt die Kuh eher nicht., correct: true }
        - { label: Es erkennt sie sicher., feedback: "Es hat womöglich »grüner Hintergrund« statt »Kuh« gelernt." }
    hints:
      - Was war auf allen Kuhbildern gleich?
    explanation: Das Modell lernte vielleicht das Gras mit. Solche Abkürzungen fallen erst bei neuen Situationen auf.

  - kind: problem
    id: nacht
    widget: numeric
    prompt: Von {{n}} Trainingsfotos sind nur {{p}} % nachts aufgenommen. Wie viele Nachtfotos sind das?
    params: { unit: Fotos }
    answer: { value: "{{n * p / 100}}" }
    hints:
      - "{{p}} % von {{n}}."
    explanation: "Nur {{n * p / 100}} Nachtfotos. Nachts wird das Modell also schlechter sein."
    variants:
      params: { n: "choice[1000,2000,5000,10000]", p: "int[2,9]" }
      defaults: { n: 5000, p: 4 }

  - kind: explain
    id: s3
    body: |
      Ein Modell ist nur so gut wie seine Daten. Fehlen Situationen, Orte oder Menschengruppen, macht es dort mehr Fehler. Darum prüft man Fehlerraten **für jede Gruppe einzeln**.

  - kind: problem
    id: pruefen
    widget: choice
    prompt: Ein Modell trifft insgesamt 95 %. Was solltest du noch prüfen?
    params:
      options:
        - { label: Wie gut es in jeder Untergruppe ist, correct: true }
        - { label: Nichts – 95 % ist gut, feedback: "Ein Durchschnitt kann schwache Gruppen verstecken." }
    hints:
      - Kann ein Durchschnitt etwas verbergen?
    explanation: 99 % bei Tag und 60 % bei Nacht ergeben im Mittel auch einen guten Wert.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Du stellst neue Trainingsfotos zusammen. Verteile 100 % so, dass **jede** Lage mindestens 20 % bekommt.
    params:
      labels:
        - Tag
        - Nacht
        - Regen
        - Schnee
      values:
        - 70
        - 10
        - 15
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 100
      step: 5
      unit: "%"
    check:
      predicate: values[0] + values[1] + values[2] + values[3] == 100 && values[0] >= 20 && values[1] >= 20 && values[2] >= 20 && values[3] >= 20
    solution:
      state:
        values:
          - 25
          - 25
          - 25
          - 25
    hints:
      - Alle Säulen zusammen müssen genau 100 % ergeben.
      - Nimm beim Tag etwas weg und gib es Nacht, Regen und Schnee – zum Beispiel je 25 %.
    explanation: Zum Beispiel 25 % für jede Lage. Sieht ein Modell jede Lage oft genug, macht es dort weniger Fehler.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Gesichtserkenner macht bei Gruppe A 1 % Fehler und bei Gruppe B 20 %. Der Datensatz besteht zu 90 % aus Gruppe A. Wie hoch ist die Fehlerrate insgesamt in Prozent?
    params:
      unit: "%"
    answer:
      value: 2.9
      tolerance: 0.05
    hints:
      - 0,9 · 1 + 0,1 · 20.
    explanation: 2,9 % – klingt gut und verbirgt, dass jede fünfte Person aus Gruppe B falsch erkannt wird.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Modell macht bei Gruppe A {{a}} % Fehler, bei Gruppe B {{b}} %. Gruppe A ist {{s}} % der Daten. Wie hoch ist die Fehlerrate insgesamt in Prozent?
    answer:
      value: "{{(s * a + (100 - s) * b) / 100}}"
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == (a + b) / 2
        misconception: unweighted
        text: Der einfache Mittelwert vergisst, dass Gruppe A viel größer ist.
    hints:
      - Gewichte jede Fehlerrate mit dem Anteil ihrer Gruppe.
      - "{{s / 100}} · {{a}} + {{(100 - s) / 100}} · {{b}}."
    explanation: Insgesamt {{(s * a + (100 - s) * b) / 100}} % – das klingt gut und verdeckt die {{b}} % bei Gruppe B. Ein **Gesamtwert** versteckt kleine Gruppen.
    difficulty: 2
    variants:
      params:
        a: int[1,4]
        b: step[10,30,5]
        s: step[70,95,5]
      defaults:
        a: 2
        b: 20
        s: 90

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum kann eine Bild-KI etwas Falsches lernen, obwohl sie im Test gut abschneidet?"
    params:
      keywords:
        - - muster
          - merkmal
          - pattern
          - feature
          - hintergrund
          - background
          - abkürzung
          - shortcut
        - - daten
          - trainingsbilder
          - data
          - training
        - - zufall
          - zusammen
          - gleichzeitig
          - coincid
          - correlat
          - immer
          - always
          - vielfalt
          - divers
      sample: Sie lernt jedes Muster, das in den Trainingsdaten zufällig mit der Antwort zusammen auftritt, etwa Schnee im Hintergrund von Wolfsfotos. Enthält der Test dieselbe Abkürzung, fällt der Fehler nicht auf.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein Röntgen-Modell glänzt in Klinik A. In Klinik B mit anderen Geräten macht es viel mehr Fehler. Wie heißt das?
    params:
      options:
        - label: Verteilungsverschiebung – die neuen Bilder sehen anders aus als die Trainingsbilder.
          correct: true
        - label: Überanpassung an die Patienten.
          feedback: Es sind dieselben Krankheiten – anders sind die Geräte und damit die Bilder.
        - label: Ein Programmierfehler.
          feedback: Der Code ist derselbe. Die Daten haben sich verändert.
    hints:
      - Was unterscheidet die Bilder der beiden Kliniken?
      - Ein Modell lernt auch Helligkeit, Rauschen und Beschriftungen des Geräts.
    explanation: Modelle gelten nur für Daten, die den Trainingsdaten ähneln. Darum prüft man sie **vor Ort** neu – und beobachtet sie im Betrieb weiter.
    difficulty: 3

srs:
  cards_from: [kuh, pruefen]
