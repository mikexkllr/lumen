id: ai.vision.filters
type: concept
title: Finding edges
summary: A small window computes across the image.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Where is the edge?
    body: "Where does a face end and the sky begin? Each bar is one pixel in a row of an image, its height the brightness. Drag the bars: where the height jumps, there is an **edge**."
    visual:
      widget: chart
      interactive: true
      params:
        title: Brightness along one row
        labels:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        values:
          - 1
          - 1
          - 1
          - 8
          - 8
          - 8
        editable:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
        min: 0
        max: 9
        step: 1

  - kind: problem
    id: differenz
    widget: numeric
    body: A simple edge filter computes, for each pixel, the right neighbor minus the left neighbor.
    prompt: The left value is {{l}} and the right is {{r}}. What does the filter output?
    params: { placeholder: "Value" }
    answer: { value: "{{r - l}}" }
    feedback:
      - when: "numval(state.input) == l - r"
        misconception: order
        text: Right minus left, not the other way around.
    hints:
      - "Calculate {{r}} − {{l}}."
    explanation: "{{r}} − {{l}} = {{r - l}}. A large value means there is an edge here."
    variants:
      params: { l: "choice[0,10,20]", r: "choice[180,200,255]" }
      defaults: { l: 10, r: 200 }

  - kind: explain
    id: s2
    body: |
      A **filter** slides a small window across the image and computes with the numbers in it.
      This is how a network finds edges, corners and patterns.

  - kind: problem
    id: kante
    widget: pixels
    prompt: The numbers show brightness. In each row, mark the first bright cell after the edge.
    params:
      labels:
        - [0, 0, 0, 9, 9, 9]
        - [0, 0, 9, 9, 9, 9]
        - [0, 0, 0, 0, 9, 9]
        - [0, 0, 0, 9, 9, 9]
    answer: { pattern: ["...#..", "..#...", "....#.", "...#.."] }
    hints:
      - In each row, find the jump from 0 to 9.
    explanation: That is exactly where the difference from the neighbor is large, and the filter responds.

  - kind: explain
    id: s4
    body: Who decides which filters a network uses?
    reveal:
      body: Nobody. A network **learns** its own filters. Early layers find edges, later ones whole eyes or wheels.

  - kind: problem
    id: schichten
    widget: order
    prompt: What do the layers of an image network recognize, one after another?
    params:
      startLabel: first layer
      endLabel: last layer
      items:
        - { label: Light and dark spots }
        - { label: Edges }
        - { label: Shapes like circles and corners }
        - { label: Parts like eyes or wheels }
        - { label: Whole things like cats or cars }
    hints:
      - From simple to complex.
    explanation: Each layer builds larger patterns from the patterns of the previous one.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: "An edge filter computes: right minus left. Set the row so that it fires only between pixel 3 and 4 – with the value 6."
    params:
      title: Brightness along one row
      labels:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      values:
        - 4
        - 4
        - 4
        - 4
        - 4
        - 4
      editable:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
      min: 0
      max: 9
      step: 1
    check:
      predicate: values[1] == values[0] && values[2] == values[1] && values[3] - values[2] == 6 && values[4] == values[3] && values[5] == values[4]
    solution:
      state:
        values:
          - 2
          - 2
          - 2
          - 8
          - 8
          - 8
    hints:
      - Left of the edge all pixels are equally bright, and so are those to the right.
      - Make the first three bars the same height and the last three exactly 6 higher – say 2 and 8.
    explanation: "For example 2, 2, 2, 8, 8, 8: everywhere the difference is 0, only at the edge it is 8 − 2 = 6. That is exactly where the filter reports an edge."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A 3 × 3 filter slides over a 5 × 5 image without going beyond the edge. How many output values result?
    answer:
      value: 9
    hints:
      - In each direction the filter fits at 3 positions.
    explanation: 3 · 3 = 9. The result shrinks by the filter width minus one.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: pixels
    prompt: A filter computes "cell below minus cell above". Mark the row where it fires strongly – the lower cell each time.
    params:
      labels:
        - - 20
          - 20
          - 20
          - 20
          - 20
        - - 20
          - 20
          - 20
          - 20
          - 20
        - - 200
          - 200
          - 200
          - 200
          - 200
        - - 200
          - 200
          - 200
          - 200
          - 200
    answer:
      pattern:
        - .....
        - .....
        - "#####"
        - .....
    hints:
      - Where does the brightness jump from top to bottom?
      - "Between rows 2 and 3: 200 − 20 = 180."
    explanation: Only at the step from 20 to 200 is the difference large. A filter turned upright like this finds horizontal edges.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: A 3 × 3 blur filter outputs the mean of all 9 cells. In the window only the centre is 9, all other cells are 0. What does it output?
    answer:
      value: 1
    hints:
      - The sum of all cells divided by 9.
      - 9 / 9 = ?
    explanation: "The bright dot is spread over its surroundings – the image gets softer. Edge filters and blur filters are the same computation with different weights: a convolution."
    difficulty: 2

  - kind: problem
    id: la-d3
    depth: 2
    widget: numeric
    prompt: A {{k}} × {{k}} filter slides over an {{n}} × {{n}} image without sticking out over the edge. How many output values are produced?
    answer:
      value: "{{(n - k + 1) * (n - k + 1)}}"
    feedback:
      - when: numval(state.input) == n * n
        misconception: same-size
        text: At the edge the window does not fit on the image – the result shrinks.
    hints:
      - In one row the filter fits at {{n}} − {{k}} + 1 positions.
      - The same holds for columns. Multiply.
    explanation: ({{n}} − {{k}} + 1)² = {{(n - k + 1) * (n - k + 1)}}. To keep the size, you fill the border with zeros (padding).
    difficulty: 2
    variants:
      params:
        n: int[6,12]
        k: choice[3,5]
      defaults:
        n: 8
        k: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A convolutional network uses the **same** small filter at every position of the image. What is the great advantage?
    params:
      options:
        - label: It needs far fewer weights and recognises a pattern wherever it lies in the image
          correct: true
        - label: The image gets sharper
          feedback: It is about recognising, not enhancing.
        - label: There is none
          feedback: Without this idea image networks would hardly be trainable.
    hints:
      - A cat at the top left is the same cat as at the bottom right.
    explanation: "**Weight sharing**: nine numbers instead of millions. The idea comes from the structure of the visual cortex."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A convolution layer has 64 filters of size 3 × 3. The input image has 3 colour channels. How many weights does the layer have – without bias?
    answer:
      value: 1728
    feedback:
      - when: numval(state.input) == 576
        misconception: forgot-channels
        text: Each filter sees all 3 colour channels – it has 3 · 3 · 3 weights.
    hints:
      - "One filter: 3 · 3 cells in each of the 3 channels."
      - 27 · 64 = ?
    explanation: 27 · 64 = 1728 – however large the image. A fully connected layer for a 224 × 224 image would need over 150,000 per neuron. Sharing weights makes convolutional nets lean.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a filter finds edges in an image.
    params:
      keywords:
        - - fenster
          - filter
          - window
        - - unterschied
          - differenz
          - minus
          - difference
        - - nachbar
          - benachbart
          - neighbour
          - next
      sample: A small window slides over the image and computes with the numbers inside, such as right minus left. Where neighbouring pixels differ a lot, a big number comes out – that is an edge.
    difficulty: 3

srs:
  cards_from: [differenz, schichten]
