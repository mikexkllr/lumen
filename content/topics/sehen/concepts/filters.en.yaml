id: ai.vision.filters
type: concept
title: Finding edges
summary: A small window computes across the image.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: differenz
    widget: numeric
    body: A simple edge filter computes, for each pixel, the right neighbor minus the left neighbor.
    prompt: The left value is {{l}} and the right is {{r}}. What does the filter output?
    params: { placeholder: "Value" }
    answer: { value: "{{r - l}}" }
    feedback:
      - when: "numval(state.input) == l - r"
        misconception: order
        text: Right minus left, not the other way around.
    hints:
      - "Calculate {{r}} − {{l}}."
    explanation: "{{r}} − {{l}} = {{r - l}}. A large value means there is an edge here."
    variants:
      params: { l: "choice[0,10,20]", r: "choice[180,200,255]" }
      defaults: { l: 10, r: 200 }

  - kind: explain
    id: s2
    body: |
      A **filter** slides a small window across the image and computes with the numbers in it.
      This is how a network finds edges, corners and patterns.

  - kind: problem
    id: kante
    widget: pixels
    prompt: The numbers show brightness. In each row, mark the first bright cell after the edge.
    params:
      labels:
        - [0, 0, 0, 9, 9, 9]
        - [0, 0, 9, 9, 9, 9]
        - [0, 0, 0, 0, 9, 9]
        - [0, 0, 0, 9, 9, 9]
    answer: { pattern: ["...#..", "..#...", "....#.", "...#.."] }
    hints:
      - In each row, find the jump from 0 to 9.
    explanation: That is exactly where the difference from the neighbor is large, and the filter responds.

  - kind: explain
    id: s4
    body: Who decides which filters a network uses?
    reveal:
      body: Nobody. A network **learns** its own filters. Early layers find edges, later ones whole eyes or wheels.

  - kind: problem
    id: schichten
    widget: order
    prompt: What do the layers of an image network recognize, one after another?
    params:
      startLabel: first layer
      endLabel: last layer
      items:
        - { label: Light and dark spots }
        - { label: Edges }
        - { label: Shapes like circles and corners }
        - { label: Parts like eyes or wheels }
        - { label: Whole things like cats or cars }
    hints:
      - From simple to complex.
    explanation: Each layer builds larger patterns from the patterns of the previous one.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A 3 × 3 filter slides over a 5 × 5 image without going beyond the edge. How many output values result?
    answer:
      value: 9
    hints:
      - In each direction the filter fits at 3 positions.
    explanation: 3 · 3 = 9. The result shrinks by the filter width minus one.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A convolutional network uses the **same** small filter at every position of the image. What is the great advantage?
    params:
      options:
        - label: It needs far fewer weights and recognises a pattern wherever it lies in the image
          correct: true
        - label: The image gets sharper
          feedback: It is about recognising, not enhancing.
        - label: There is none
          feedback: Without this idea image networks would hardly be trainable.
    hints:
      - A cat at the top left is the same cat as at the bottom right.
    explanation: "**Weight sharing**: nine numbers instead of millions. The idea comes from the structure of the visual cortex."
    difficulty: 3

srs:
  cards_from: [differenz, schichten]
