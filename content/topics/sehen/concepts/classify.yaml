id: ai.vision.classify
type: concept
title: Erkennen – und sich irren
summary: Wölfe, Schnee und gute Trainingsbilder.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: woelfe
    widget: choice
    prompt: Ein Netz erkennt Wölfe sehr gut. Später zeigt sich – auf allen Wolf-Fotos lag Schnee. Was hat es wirklich gelernt?
    params:
      options:
        - { label: Schnee zu erkennen, correct: true }
        - { label: Wölfe zu erkennen, feedback: "Vielleicht ein bisschen. Aber der Schnee war das einfachere Merkmal." }
        - { label: Gar nichts, feedback: "Es hat etwas gelernt – nur nicht das Richtige." }
    hints:
      - Was hatten alle Wolf-Bilder gemeinsam?
    explanation: Netze nehmen jedes Muster, das hilft – auch ein falsches.

  - kind: explain
    id: s2
    body: |
      Netze lernen jedes Muster, das hilft – auch zufällige wie Schnee oder Wasserzeichen.
      Darum braucht man **vielfältige** Trainingsbilder.

  - kind: problem
    id: treffer
    widget: numeric
    body: Das Netz hält 45 von 50 Katzenfotos für Katzen. Von 50 Hundefotos hält es 10 für Katzen.
    prompt: Wie viel Prozent der »Katze«-Antworten stimmen? Runde auf ganze Prozent.
    params: { unit: "%" }
    answer: { value: 82, tolerance: 1 }
    feedback:
      - when: "numval(state.input) == 90"
        misconception: recall-not-precision
        text: 90 % der Katzen werden erkannt. Gefragt ist aber, wie oft »Katze« stimmt.
    hints:
      - Insgesamt sagt es 45 + 10 = 55-mal »Katze«.
    explanation: 45 von 55 Antworten stimmen – etwa 82 %.

  - kind: problem
    id: bilder
    widget: buckets
    prompt: Hilft das dem Netz – oder führt es in die Irre?
    params:
      buckets: [{ label: hilft }, { label: führt in die Irre }]
      items:
        - { label: Fotos aus vielen Ländern, bucket: hilft }
        - { label: Bilder bei Tag und Nacht, bucket: hilft }
        - { label: Verschiedene Kameras, bucket: hilft }
        - { label: Nur Studiofotos, bucket: führt in die Irre }
        - { label: Immer derselbe Hintergrund, bucket: führt in die Irre }
        - { label: Falsch beschriftete Bilder, bucket: führt in die Irre }
    hints:
      - Sollte das Netz später auch ungewöhnliche Fotos verstehen?
    explanation: Vielfalt hilft. Einheitliche Hintergründe und falsche Beschriftungen lehren falsche Muster.

  - kind: explain
    id: s5
    body: Können winzige Störungen ein Netz täuschen?
    reveal:
      body: Ja. Ein paar unauffällige Pixel können für ein Netz aus einem Panda einen Affen machen. Das nennt man **adversarial examples**.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Modell prüft 1000 Fotos: 100 zeigen Katzen. Es meldet 120-mal »Katze«, davon sind 90 richtig. Wie viel Prozent der echten Katzen hat es gefunden?"
    params:
      unit: "%"
    answer:
      value: 90
    hints:
      - 90 von 100 echten Katzen.
    explanation: 90 % **Trefferrate** – aber nur 75 % seiner Meldungen stimmen. Zwei verschiedene Fragen.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Ein Modell kennt nur »Katze« und »Hund«. Du zeigst ihm einen Toaster. Was passiert?
    params:
      options:
        - label: Es sagt trotzdem Katze oder Hund – womöglich sogar sehr »sicher«.
          correct: true
        - label: Es meldet »weiß ich nicht«.
          feedback: Dafür bräuchte es eine eigene Antwort »nichts davon«. Die hat es nicht gelernt.
        - label: Es erkennt den Toaster.
          feedback: Es kennt nur die zwei Klassen aus dem Training.
    hints:
      - Die Ausgabe ist eine Verteilung über genau zwei Klassen.
      - Die Werte ergeben immer zusammen 100 %.
    explanation: Softmax verteilt immer 100 % auf die bekannten Klassen. Eine hohe Zahl ist darum keine echte **Sicherheit**. Gute Systeme erkennen zusätzlich, wenn ein Bild ganz anders ist als die Trainingsdaten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Hautkrebs-Erkenner war in Tests exzellent. Dann fiel auf: Auf vielen Krebsfotos lag ein Lineal. Was hat er gelernt?"
    params:
      options:
        - label: Lineale zu erkennen – Ärzte hatten verdächtige Stellen vermessen
          correct: true
        - label: Krebs zu erkennen
          feedback: Ohne Lineal sank die Leistung deutlich.
        - label: Nichts
          feedback: Es lernte etwas – nur das Falsche.
    hints:
      - Wann legt ein Arzt ein Lineal neben einen Fleck?
    explanation: "**Abkürzungslernen**: Netze nehmen das einfachste Muster, das funktioniert. Man muss prüfen, **worauf** ein Modell schaut."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein Katzen-Erkenner hat Genauigkeit 0,75 (so viele Alarme stimmen) und Trefferrate 0,9 (so viele Katzen findet er). Der F1-Wert ist 2 · G · T / (G + T). Wie groß ist er? Auf zwei Stellen.
    answer:
      value: 0.82
      tolerance: 0.01
    hints:
      - "Zähler: 2 · 0,75 · 0,9 = 1,35."
      - "Nenner: 0,75 + 0,9 = 1,65."
    explanation: 1,35 / 1,65 ≈ 0,82. Der **F1-Wert** ist nur hoch, wenn beide Werte hoch sind. Ein Modell, das immer »Katze« sagt, hat Trefferrate 1 – aber eine miese Genauigkeit.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Wie hätte man beim Wolf-Erkenner früh bemerkt, dass er auf Schnee achtet?
    params:
      options:
        - label: Mit Bildern testen, auf denen Wölfe ohne Schnee und Hunde im Schnee sind.
          correct: true
        - label: Mit noch mehr Wolf-Bildern im Schnee.
          feedback: Die bestätigen nur den Fehler.
        - label: Am Gesamtwert der Trefferquote.
          feedback: Die war ja hoch – der Fehler versteckt sich darin.
    hints:
      - Trenne die zwei Merkmale, die im Training immer zusammen kamen.
      - Was sagt das Modell, wenn nur eins davon da ist?
    explanation: Gezielte **Gegenproben** decken Abkürzungen auf. Dazu kommen Wärmebilder, die zeigen, welche Pixel die Entscheidung tragen. Leuchtet dort der Schnee, ist der Fall klar.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum eine hohe Trefferquote im Test nicht heißt, dass ein Bildmodell das Richtige gelernt hat.
    params:
      keywords:
        - - muster
          - abkürzung
          - schnee
          - pattern
          - shortcut
          - snow
        - - test
          - prüf
          - check
        - - neu
          - ander
          - unbekannt
          - new
          - different
          - unseen
      sample: Das Modell kann ein zufälliges Muster gelernt haben, etwa Schnee statt Wolf. Hat der Test dieselbe Verzerrung, fällt das nicht auf. Erst neue, andere Bilder zeigen den Fehler.
    difficulty: 3

srs:
  cards_from: [treffer, woelfe]
