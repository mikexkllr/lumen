id: ai.vision.fooled
type: concept
title: Fooled eyes
summary: Small changes, big mistakes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One pixel too many
    body: To you, this is a seven. An image network sees only numbers – and sometimes a **tiny change** is enough to confuse it. Tap a single square. Is it still a seven to you?
    visual:
      widget: pixels
      interactive: true
      params:
        cells:
          - "#####"
          - ....#
          - ...#.
          - ..#..
          - .#...
          - .#...
          - .#...

  - kind: problem
    id: zahlen
    widget: numeric
    prompt: An image has {{s}} × {{s}} pixels with three color values each. How many numbers does the model see?
    params: { placeholder: "Number" }
    answer: { value: "{{s * s * 3}}" }
    hints:
      - Count the pixels, then times 3.
    explanation: "{{s}} · {{s}} · 3 = {{s * s * 3}}. To the model, a photo is just a long list of numbers."
    variants:
      params: { s: "choice[32,64,100,128]" }
      defaults: { s: 64 }

  - kind: problem
    id: sticker
    widget: choice
    prompt: A few stickers on a stop sign, and a model sees a speed limit. Why?
    params:
      options:
        - { label: "It looks at patterns that humans do not care about.", correct: true }
        - { label: The sign was really unreadable., feedback: "People recognized it without trouble." }
    hints:
      - Does the model understand what a sign means?
    explanation: The model computes with pixel patterns. Targeted disturbances can tip it over.

  - kind: explain
    id: s3
    body: |
      These tricks are called **adversarial examples**. You often cannot see them. Yet the AI changes its answer.

  - kind: problem
    id: wer
    widget: buckets
    prompt: Who gets fooled?
    params:
      buckets: [{ label: people too }, { label: only the AI }]
      items:
        - { label: Lines with arrowheads, bucket: people too }
        - { label: Faces in clouds, bucket: people too }
        - { label: Pixel noise, bucket: only the AI }
        - { label: Stop sign stickers, bucket: only the AI }
    hints:
      - Would you fall for it?
    explanation: People and AI have different blind spots.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Can this mislead an image model?
    params:
      buckets:
        - id: b1
          label: Can mislead
        - id: b2
          label: Hardly misleads
      items:
        - label: Targeted invisible noise
          bucket: b1
        - label: Sticker on the stop sign
          bucket: b1
        - label: The same photo once more
          bucket: b2
        - label: Very unusual viewing angle
          bucket: b1
    hints:
      - What differs from the training images?
    explanation: Models see patterns, not things. Small changes can tip the pattern.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Researchers 3D-printed a turtle that an image model took for a rifle from almost every angle. What does that show?
    params:
      options:
        - label: Deceptions also work in the real world, not only in manipulated image files
          correct: true
        - label: Turtles look like rifles
          feedback: Not at all to humans.
        - label: The model was untrained
          feedback: It was a very good standard model.
    hints:
      - The surface carried a deliberately computed pattern.
    explanation: That is a security problem – for self-driving cars, for example.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: An attack changes each pixel by at most 2 of 255 brightness levels. What percentage of the scale is that? To two decimals.
    answer:
      value: 0.78
      tolerance: 0.01
    hints:
      - Compute 2 / 255.
      - Times 100 for percent.
    explanation: Under 1 % per pixel – invisible to us. But because tens of thousands of pixels all move in the "right" direction, the effect adds up inside the network.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: What helps best against such tricks?
    params:
      options:
        - label: Train the network on attack images – that makes it more robust, but not invulnerable.
          correct: true
        - label: A bigger network – it cannot be fooled.
          feedback: Even very large networks can be attacked.
        - label: Nothing – the problem is solved.
          feedback: It is an open research field.
    hints:
      - How do you learn to handle a danger? By practising it.
      - Is there a guarantee?
    explanation: Adversarial training adds attack images to training. That clearly raises robustness but often costs some accuracy – and new attacks find new gaps.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do models see the world so differently from us although they recognise cats about equally well?
    params:
      options:
        - label: They rely heavily on fine textures, we mainly on shapes
          correct: true
        - label: They see only black and white
          feedback: They process colour.
        - label: There is no difference
          feedback: A cat with elephant-skin texture is an elephant to many models.
    hints:
      - What is a cat with elephant skin to you – and what to a network?
    explanation: The same accuracy does not mean the same strategy. That explains why tiny perturbations throw models off.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: How does an attacker find the tiny change that fools the network?
    params:
      options:
        - label: He computes how the error responds to each pixel and nudges all pixels a little in the harmful direction.
          correct: true
        - label: He tries random noise images.
          feedback: Random noise barely works – the trick is the targeted direction.
        - label: He changes one single pixel a lot.
          feedback: That sometimes works, but many tiny changes are typical.
    hints:
      - In training you push the weights against the gradient. What could you do with the pixels?
      - The attacker wants to increase the error, not decrease it.
    explanation: It is gradient descent in reverse – on the pixels instead of the weights. The same maths that trains the network also makes it vulnerable.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what an adversarial example is.
    params:
      keywords:
        - - klein
          - winzig
          - unsichtbar
          - small
          - tiny
          - invisible
        - - änder
          - stör
          - change
          - perturb
        - - falsch
          - täusch
          - irr
          - wrong
          - fool
      sample: An adversarial example is an image with a tiny, targeted change. To people it looks the same, but the AI suddenly classifies it wrongly.
    difficulty: 3

srs:
  cards_from: [sticker, wer]
