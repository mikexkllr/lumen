id: ai.vision.data
type: concept
title: What you learn is what you were shown
summary: Gaps in the data become gaps in the model.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Rarely practised
    body: "A car is meant to spot pedestrians. Here you draw random photos from its **training data**. Draw 10, then 100: how often does the model even get to see night photos?"
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: Day
            weight: 17
          - label: Rain
            weight: 2
          - label: Night
            weight: 1
        sample:
          - 10
          - 100

  - kind: problem
    id: kuh
    widget: choice
    prompt: A model has only seen cows on green meadows. Now a cow stands on a beach. What happens?
    params:
      options:
        - { label: It probably will not recognize the cow., correct: true }
        - { label: It will surely recognize it., feedback: "It may have learned “green background” instead of “cow”." }
    hints:
      - What was the same in all cow images?
    explanation: The model may have learned the grass too. Such shortcuts only show up in new situations.

  - kind: problem
    id: nacht
    widget: numeric
    prompt: Of {{n}} training photos, only {{p}}% were taken at night. How many night photos is that?
    params: { unit: photos }
    answer: { value: "{{n * p / 100}}" }
    hints:
      - "{{p}}% of {{n}}."
    explanation: "Only {{n * p / 100}} night photos. So the model will do worse at night."
    variants:
      params: { n: "choice[1000,2000,5000,10000]", p: "int[2,9]" }
      defaults: { n: 5000, p: 4 }

  - kind: explain
    id: s3
    body: |
      A model is only as good as its data. If situations, places or groups of people are missing, it makes more mistakes there. That is why you check error rates **for each group separately**.

  - kind: problem
    id: pruefen
    widget: choice
    prompt: A model is right 95% of the time overall. What else should you check?
    params:
      options:
        - { label: How well it does in each subgroup, correct: true }
        - { label: "Nothing, 95% is good", feedback: "An average can hide weak groups." }
    hints:
      - Can an average hide something?
    explanation: 99% by day and 60% by night also average out to a good-looking value.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: You are putting together new training photos. Share out 100 % so that **every** condition gets at least 20 %.
    params:
      labels:
        - Day
        - Night
        - Rain
        - Snow
      values:
        - 70
        - 10
        - 15
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 100
      step: 5
      unit: "%"
    check:
      predicate: values[0] + values[1] + values[2] + values[3] == 100 && values[0] >= 20 && values[1] >= 20 && values[2] >= 20 && values[3] >= 20
    solution:
      state:
        values:
          - 25
          - 25
          - 25
          - 25
    hints:
      - All bars together must add up to exactly 100 %.
      - Take some away from day and give it to night, rain and snow – for example 25 % each.
    explanation: For example 25 % for each condition. If a model sees every condition often enough, it makes fewer mistakes there.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A face recogniser makes 1% errors for group A and 20% for group B. The data set consists of 90% group A. What is the overall error rate in percent?
    params:
      unit: "%"
    answer:
      value: 2.9
      tolerance: 0.05
    hints:
      - 0.9 · 1 + 0.1 · 20.
    explanation: 2.9% – sounds good and hides that every fifth person from group B is misrecognised.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A model makes {{a}} % errors on group A and {{b}} % on group B. Group A is {{s}} % of the data. What is the overall error rate in percent?
    answer:
      value: "{{(s * a + (100 - s) * b) / 100}}"
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == (a + b) / 2
        misconception: unweighted
        text: The plain mean forgets that group A is much bigger.
    hints:
      - Weight each error rate by its group's share.
      - "{{s / 100}} · {{a}} + {{(100 - s) / 100}} · {{b}}."
    explanation: Overall {{(s * a + (100 - s) * b) / 100}} % – that sounds fine and hides the {{b}} % for group B. An overall number hides small groups.
    difficulty: 2
    variants:
      params:
        a: int[1,4]
        b: step[10,30,5]
        s: step[70,95,5]
      defaults:
        a: 2
        b: 20
        s: 90

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why can an image AI learn something wrong although it scores well in the test?"
    params:
      keywords:
        - - muster
          - merkmal
          - pattern
          - feature
          - hintergrund
          - background
          - abkürzung
          - shortcut
        - - daten
          - trainingsbilder
          - data
          - training
        - - zufall
          - zusammen
          - gleichzeitig
          - coincid
          - correlat
          - immer
          - always
          - vielfalt
          - divers
      sample: It learns any pattern that happens to coincide with the answer in the training data, such as snow in the background of wolf photos. If the test contains the same shortcut, the error goes unnoticed.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: An X-ray model shines in hospital A. In hospital B, with different machines, it makes many more mistakes. What is this called?
    params:
      options:
        - label: Distribution shift – the new images look different from the training images.
          correct: true
        - label: Overfitting to the patients.
          feedback: The diseases are the same – the machines, and so the images, differ.
        - label: A programming bug.
          feedback: The code is the same. The data has changed.
    hints:
      - What differs between the two hospitals' images?
      - A model also learns the machine's brightness, noise and labels.
    explanation: Models are only valid for data similar to their training data. That is why they are re-tested on site – and monitored during use.
    difficulty: 3

srs:
  cards_from: [kuh, pruefen]
