id: ai.vision.filters
type: concept
title: Kanten finden
summary: Ein kleines Fenster rechnet über das Bild.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wo ist die Kante?
    body: "Wo endet ein Gesicht, wo beginnt der Himmel? Jede Säule ist ein Pixel einer Bildzeile, ihre Höhe die Helligkeit. Zieh die Säulen: Wo die Höhe springt, liegt eine **Kante**."
    visual:
      widget: chart
      interactive: true
      params:
        title: Helligkeit einer Bildzeile
        labels:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        values:
          - 1
          - 1
          - 1
          - 8
          - 8
          - 8
        editable:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
        min: 0
        max: 9
        step: 1

  - kind: problem
    id: differenz
    widget: numeric
    body: Ein einfacher Kantenfilter rechnet für jedes Pixel – rechter Nachbar minus linker Nachbar.
    prompt: Links steht der Wert {{l}}, rechts {{r}}. Was gibt der Filter aus?
    params: { placeholder: "Wert" }
    answer: { value: "{{r - l}}" }
    feedback:
      - when: "numval(state.input) == l - r"
        misconception: order
        text: Rechts minus links – nicht umgekehrt.
    hints:
      - "Rechne {{r}} − {{l}}."
    explanation: "{{r}} − {{l}} = {{r - l}}. Ein großer Wert heißt – hier ist eine Kante."
    variants:
      params: { l: "choice[0,10,20]", r: "choice[180,200,255]" }
      defaults: { l: 10, r: 200 }

  - kind: explain
    id: s2
    body: |
      Ein **Filter** schiebt ein kleines Fenster über das Bild und rechnet mit den Zahlen darin.
      So findet ein Netz Kanten, Ecken und Muster.

  - kind: problem
    id: kante
    widget: pixels
    prompt: Die Zahlen zeigen die Helligkeit. Markiere in jeder Zeile das erste helle Feld nach der Kante.
    params:
      labels:
        - [0, 0, 0, 9, 9, 9]
        - [0, 0, 9, 9, 9, 9]
        - [0, 0, 0, 0, 9, 9]
        - [0, 0, 0, 9, 9, 9]
    answer: { pattern: ["...#..", "..#...", "....#.", "...#.."] }
    hints:
      - Suche in jeder Zeile den Sprung von 0 auf 9.
    explanation: Genau dort ist der Unterschied zum Nachbarn groß – der Filter schlägt aus.

  - kind: explain
    id: s4
    body: Wer legt fest, welche Filter ein Netz benutzt?
    reveal:
      body: Niemand. Ein Netz **lernt** seine Filter selbst. Frühe Schichten finden Kanten, spätere ganze Augen oder Räder.

  - kind: problem
    id: schichten
    widget: order
    prompt: Was erkennen die Schichten eines Bilder-Netzes nacheinander?
    params:
      startLabel: erste Schicht
      endLabel: letzte Schicht
      items:
        - { label: Helle und dunkle Punkte }
        - { label: Kanten }
        - { label: Formen wie Kreise und Ecken }
        - { label: Teile wie Augen oder Räder }
        - { label: Ganze Dinge wie Katzen oder Autos }
    hints:
      - Vom Einfachen zum Komplexen.
    explanation: Jede Schicht baut aus den Mustern der vorigen größere Muster.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: "Ein Kantenfilter rechnet: rechts minus links. Stell die Bildzeile so ein, dass er nur zwischen Pixel 3 und 4 anschlägt – mit dem Wert 6."
    params:
      title: Helligkeit einer Bildzeile
      labels:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      values:
        - 4
        - 4
        - 4
        - 4
        - 4
        - 4
      editable:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
      min: 0
      max: 9
      step: 1
    check:
      predicate: values[1] == values[0] && values[2] == values[1] && values[3] - values[2] == 6 && values[4] == values[3] && values[5] == values[4]
    solution:
      state:
        values:
          - 2
          - 2
          - 2
          - 8
          - 8
          - 8
    hints:
      - Links von der Kante sind alle Pixel gleich hell, rechts davon auch.
      - Mach die ersten drei Säulen gleich hoch und die letzten drei genau 6 höher – etwa 2 und 8.
    explanation: "Zum Beispiel 2, 2, 2, 8, 8, 8: Überall ist der Unterschied 0, nur an der Kante 8 − 2 = 6. Genau dort meldet der Filter eine Kante."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein 3 × 3-Filter gleitet über ein 5 × 5-Bild, ohne über den Rand zu ragen. Wie viele Ausgabewerte entstehen?
    answer:
      value: 9
    hints:
      - In jeder Richtung passt der Filter an 3 Positionen.
    explanation: 3 · 3 = 9. Das Ergebnis schrumpft um die Filterbreite minus eins.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: pixels
    prompt: Ein Filter rechnet »Feld unten minus Feld oben«. Markiere die Zeile, in der er stark anschlägt – jeweils das untere Feld.
    params:
      labels:
        - - 20
          - 20
          - 20
          - 20
          - 20
        - - 20
          - 20
          - 20
          - 20
          - 20
        - - 200
          - 200
          - 200
          - 200
          - 200
        - - 200
          - 200
          - 200
          - 200
          - 200
    answer:
      pattern:
        - .....
        - .....
        - "#####"
        - .....
    hints:
      - Wo springt die Helligkeit von oben nach unten?
      - "Zwischen Zeile 2 und 3: 200 − 20 = 180."
    explanation: Nur beim Übergang von 20 auf 200 ist der Unterschied groß. Ein senkrecht gedrehter Filter findet so **waagrechte** Kanten.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Ein 3 × 3-Weichzeichner gibt den Mittelwert aller 9 Felder aus. Im Fenster ist nur die Mitte 9, alle anderen Felder sind 0. Was gibt er aus?
    answer:
      value: 1
    hints:
      - Summe aller Felder geteilt durch 9.
      - 9 / 9 = ?
    explanation: "Der helle Punkt wird auf seine Umgebung **verteilt** – das Bild wird weicher. Kantenfilter und Weichzeichner sind dieselbe Rechnung, nur mit anderen Gewichten: eine Faltung."
    difficulty: 2

  - kind: problem
    id: la-d3
    depth: 2
    widget: numeric
    prompt: Ein {{k}} × {{k}}-Filter gleitet über ein {{n}} × {{n}}-Bild, ohne über den Rand zu ragen. Wie viele Ausgabewerte entstehen?
    answer:
      value: "{{(n - k + 1) * (n - k + 1)}}"
    feedback:
      - when: numval(state.input) == n * n
        misconception: same-size
        text: Am Rand passt das Fenster nicht ganz aufs Bild – das Ergebnis wird kleiner.
    hints:
      - In einer Zeile passt der Filter an {{n}} − {{k}} + 1 Stellen.
      - Dasselbe gilt für die Spalten. Multipliziere.
    explanation: ({{n}} − {{k}} + 1)² = {{(n - k + 1) * (n - k + 1)}}. Will man die Größe behalten, füllt man den Rand mit Nullen auf (**Padding**).
    difficulty: 2
    variants:
      params:
        n: int[6,12]
        k: choice[3,5]
      defaults:
        n: 8
        k: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Faltungsnetz nutzt **denselben** kleinen Filter an jeder Stelle des Bildes. Was ist der große Vorteil?
    params:
      options:
        - label: Es braucht viel weniger Gewichte und erkennt ein Muster, egal wo es im Bild liegt
          correct: true
        - label: Das Bild wird schärfer
          feedback: Es geht ums Erkennen, nicht ums Verbessern.
        - label: Es gibt keinen
          feedback: Ohne diese Idee wären Bildnetze kaum trainierbar.
    hints:
      - Eine Katze links oben ist dieselbe Katze wie rechts unten.
    explanation: "**Gewichtsteilung**: Neun Zahlen statt Millionen. Die Idee stammt aus dem Aufbau der Sehrinde im Gehirn."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Eine Faltungsschicht hat 64 Filter der Größe 3 × 3. Das Eingabebild hat 3 Farbkanäle. Wie viele Gewichte hat die Schicht – ohne Bias?
    answer:
      value: 1728
    feedback:
      - when: numval(state.input) == 576
        misconception: forgot-channels
        text: Jeder Filter sieht alle 3 Farbkanäle – er hat 3 · 3 · 3 Gewichte.
    hints:
      - "Ein Filter: 3 · 3 Felder in jedem der 3 Kanäle."
      - 27 · 64 = ?
    explanation: 27 · 64 = 1728 – egal, wie groß das Bild ist. Eine voll verbundene Schicht für ein 224 × 224-Bild bräuchte pro Neuron über 150 000. **Gewichte teilen** macht Faltungsnetze sparsam.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Filter in einem Bild Kanten findet.
    params:
      keywords:
        - - fenster
          - filter
          - window
        - - unterschied
          - differenz
          - minus
          - difference
        - - nachbar
          - benachbart
          - neighbour
          - next
      sample: Ein kleines Fenster gleitet über das Bild und rechnet mit den Zahlen darin, etwa rechts minus links. Wo sich Nachbarpixel stark unterscheiden, kommt eine große Zahl heraus – dort ist eine Kante.
    difficulty: 3

srs:
  cards_from: [differenz, schichten]
