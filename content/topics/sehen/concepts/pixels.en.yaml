id: ai.vision.pixels
type: concept
title: Images are numbers
summary: Grids, grayscale and megapixels.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: plus
    widget: pixels
    prompt: Draw a plus sign in the grid. Tap or swipe across the cells.
    params: { rows: 5, cols: 5 }
    answer: { pattern: ["..#..", "..#..", "#####", "..#..", "..#.."] }
    hints:
      - One vertical and one horizontal line through the middle.
    explanation: To the computer, your plus is just a table of 0s and 1s.

  - kind: explain
    body: |
      An image is a **grid of numbers**. Black and white: 0 or 1. Grayscale: 0 to 255.
      Color: three numbers per pixel, for red, green and blue.

  - kind: problem
    id: megapixel
    widget: numeric
    prompt: A photo has {{w}} × {{h}} pixels. How many million pixels is that?
    params: { unit: megapixels }
    answer: { value: "{{w * h / 1000000}}" }
    hints:
      - "Calculate {{w}} · {{h}} and divide by a million."
    explanation: "{{w}} · {{h}} = {{w * h}} pixels, so {{w * h / 1000000}} megapixels."
    variants:
      params: { w: "choice[2000,3000,4000]", h: "choice[1500,2000,3000]" }
      defaults: { w: 4000, h: 3000 }

  - kind: problem
    id: groesse
    widget: numeric
    prompt: Each pixel needs 3 bytes. How many megabytes does a 12-megapixel photo have without compression?
    params: { unit: MB }
    answer: { value: 36 }
    feedback:
      - when: "numval(state.input) == 12"
        misconception: one-byte
        text: There are three bytes per pixel, for red, green and blue.
    hints:
      - 12 million pixels · 3 bytes.
    explanation: 12 · 3 = 36 MB.

  - kind: explain
    body: Why is a JPG photo still only 3 to 5 MB?
    reveal:
      body: Neighboring pixels are often similar. You store patterns instead of each pixel, and drop details the eye hardly sees.

srs:
  cards_from: [megapixel, groesse]
