id: ai.vision.pixels
type: concept
title: Images are numbers
summary: Grids, grayscale and megapixels.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A face made of numbers
    body: To a computer, every photo is just a **table of numbers**. Here, each square hides a number from 0 to 3. Tap squares to change their shade. Can you make the face look surprised?
    visual:
      widget: pixels
      interactive: true
      params:
        shades: 4
        cells:
          - ..1111..
          - .133331.
          - "13133131"
          - "13333331"
          - "13133131"
          - "13311331"
          - .133331.
          - ..1111..

  - kind: problem
    id: plus
    widget: pixels
    prompt: Draw a plus sign in the grid. Tap or swipe across the cells.
    params: { rows: 5, cols: 5 }
    answer: { pattern: ["..#..", "..#..", "#####", "..#..", "..#.."] }
    hints:
      - One vertical and one horizontal line through the middle.
    explanation: To the computer, your plus is just a table of 0s and 1s.

  - kind: explain
    id: s2
    body: |
      An image is a **grid of numbers**. Black and white: 0 or 1. Grayscale: 0 to 255.
      Color: three numbers per pixel, for red, green and blue.

  - kind: problem
    id: megapixel
    widget: numeric
    prompt: A photo has {{w}} × {{h}} pixels. How many million pixels is that?
    params: { unit: megapixels }
    answer: { value: "{{w * h / 1000000}}" }
    hints:
      - "Calculate {{w}} · {{h}} and divide by a million."
    explanation: "{{w}} · {{h}} = {{w * h}} pixels, so {{w * h / 1000000}} megapixels."
    variants:
      params: { w: "choice[2000,3000,4000]", h: "choice[1500,2000,3000]" }
      defaults: { w: 4000, h: 3000 }

  - kind: problem
    id: groesse
    widget: numeric
    prompt: Each pixel needs 3 bytes. How many megabytes does a 12-megapixel photo have without compression?
    params: { unit: MB }
    answer: { value: 36 }
    feedback:
      - when: "numval(state.input) == 12"
        misconception: one-byte
        text: There are three bytes per pixel, for red, green and blue.
    hints:
      - 12 million pixels · 3 bytes.
    explanation: 12 · 3 = 36 MB.

  - kind: explain
    id: s5
    body: Why is a JPG photo still only 3 to 5 MB?
    reveal:
      body: Neighboring pixels are often similar. You store patterns instead of each pixel, and drop details the eye hardly sees.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A Full HD video has 1920 × 1080 pixels, 3 bytes per pixel and 30 frames per second. How many megabytes is that per second – uncompressed? Rounded.
    params:
      unit: MB
    answer:
      value: 187
      tolerance: 2
    hints:
      - 1920 · 1080 · 3 ≈ 6.2 MB per frame.
    explanation: About 187 MB per second. Compression pushes that below one hundredth.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Each colour channel (red, green, blue) has 8 bits, so 256 levels. How many million colours does that give? Rounded to one decimal.
    answer:
      value: 16.8
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 768
        misconception: added
        text: "The channels combine, they do not add: 256 · 256 · 256."
    hints:
      - Every red level goes with every green and every blue level.
      - 256³ = 2²⁴ ≈ 16,777,216.
    explanation: 256³ ≈ 16.8 million colours – more than a human can tell apart. To a network each pixel is simply a triple of numbers.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do screens mix red, green and blue – and not the paint colours red, yellow and blue?
    params:
      options:
        - label: Light adds up, and our eyes have exactly three kinds of cones for roughly these colours
          correct: true
        - label: Out of tradition
          feedback: It follows from the biology of the eye.
        - label: Green is cheaper to produce
          feedback: The reason lies in vision, not price.
    hints:
      - Mixing paint (light is absorbed) is the opposite of mixing light.
    explanation: "**Additive** colour mixing: red + green gives yellow, all three white. Colour is ultimately a property of our visual system."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: An AI program enlarges a blurry photo fourfold and it looks sharp. What has happened?
    params:
      options:
        - label: It invented plausible details – the real details were never stored.
          correct: true
        - label: It recovered the hidden original details.
          feedback: What was not captured when the photo was taken is not in the pixels.
        - label: It only made the pixels bigger.
          feedback: Then the picture would look blocky, not sharp.
    hints:
      - How many numbers does the small image have, and the large one?
      - Where do the extra numbers come from?
    explanation: The program fills the gaps with what was typical in similar training images. It looks real but is an estimate. Such an image is no good as evidence.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a computer stores a colour photo.
    params:
      keywords:
        - - pixel
          - raster
          - grid
        - - zahl
          - wert
          - number
          - value
        - - rot
          - grün
          - blau
          - red
          - green
          - blue
          - rgb
      sample: A photo is a grid of pixels. Each pixel consists of three numbers for red, green and blue, usually from 0 to 255.
    difficulty: 3

srs:
  cards_from: [megapixel, groesse]
