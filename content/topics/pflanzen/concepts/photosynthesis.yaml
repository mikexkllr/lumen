id: bio.plants.photosynthesis
type: concept
title: "Photosynthese"
summary: "Aus Licht, Wasser und CO₂ wird Zucker."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Grüne Kraftwerke
    body: Fast alles, was du isst, beginnt mit einem Blatt in der Sonne. Pflanzen machen aus Licht Nahrung. Deck die Karten auf und staune, was die **Photosynthese** alles leistet.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌊
            front: Jeder zweite Atemzug
            back: Etwa die Hälfte des Sauerstoffs auf der Erde stammt von winzigen Algen im Meer.
          - icon: 🧀
            front: Dein Frühstück
            back: "Brot, Müsli, sogar Käse: Am Anfang jeder Nahrungskette steht eine Pflanze."
          - icon: ⛽
            front: Sonne von gestern
            back: Kohle und Erdöl sind Reste von Pflanzen und Algen – Sonnenlicht, gespeichert über Jahrmillionen.

  - kind: problem
    id: hook
    widget: choice
    prompt: Eine Eiche wiegt viele Tonnen. Woher stammt der größte Teil ihres Holzes?
    params:
      options:
        - label: Aus der Luft – aus Kohlendioxid
          correct: true
        - label: Aus der Erde
          feedback: "Schon im 17. Jahrhundert zeigte ein Versuch: Die Erde im Topf nimmt kaum ab."
        - label: Aus dem Wasser allein
          feedback: Wasser liefert Wasserstoff und Sauerstoff. Der Kohlenstoff fehlt dann noch.
    hints:
      - Holz besteht vor allem aus Kohlenstoff.
      - Wo gibt es Kohlenstoff, den ein Blatt erreicht?
    explanation: Der Kohlenstoff im Holz stammt aus dem CO₂ der Luft. Bäume sind im Grunde verfestigte Luft.

  - kind: explain
    id: c1
    body: Bei der **Photosynthese** bauen Pflanzen aus Kohlendioxid und Wasser Traubenzucker. Die Energie dafür liefert Licht. Als Abfall entsteht Sauerstoff. Das passiert in den grünen Chloroplasten.

  - kind: problem
    id: c2
    widget: tiles
    prompt: Baue die Gleichung der Photosynthese.
    params:
      tiles:
        - C₆H₁₂O₆
        - 6 O₂
        - +
        - 6 CO₂
        - →
        - 6 H₂O
        - +
    answer:
      anyOf:
        - - 6 CO₂
          - +
          - 6 H₂O
          - →
          - C₆H₁₂O₆
          - +
          - 6 O₂
        - - 6 H₂O
          - +
          - 6 CO₂
          - →
          - C₆H₁₂O₆
          - +
          - 6 O₂
        - - 6 CO₂
          - +
          - 6 H₂O
          - →
          - 6 O₂
          - +
          - C₆H₁₂O₆
        - - 6 H₂O
          - +
          - 6 CO₂
          - →
          - 6 O₂
          - +
          - C₆H₁₂O₆
    hints:
      - Links stehen die Ausgangsstoffe aus Luft und Boden.
      - Rechts stehen Zucker und Sauerstoff.
    explanation: 6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂, angetrieben von Licht.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Eine Pflanze baut {{n}} Moleküle Traubenzucker. Wie viele Moleküle CO₂ braucht sie dafür?
    answer:
      value: "{{6 * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: one-to-one
        text: Ein Zucker hat 6 Kohlenstoffatome. Jedes kommt aus einem CO₂.
    hints:
      - Wie viele C-Atome hat C₆H₁₂O₆?
      - Pro Zucker 6 CO₂.
    explanation: "6 CO₂ pro Zucker: {{n}} · 6 = {{6 * n}}. Dabei werden auch {{6 * n}} O₂ frei."
    variants:
      params:
        n: int[2,12]
      defaults:
        n: 5

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Pflanzen nehmen [[Kohlendioxid]] aus der Luft und Wasser aus dem Boden. Mit Energie aus [[Licht]] bauen sie [[Traubenzucker]]. Dabei geben sie [[Sauerstoff]] ab.
      distractors:
        - Stickstoff
        - Wärme
        - Eiweiß
    explanation: Zwei Stoffe rein, Licht als Antrieb, Zucker und Sauerstoff raus.

  - kind: explain
    id: d1
    depth: 2
    body: Der grüne Farbstoff **Chlorophyll** schluckt vor allem blaues und rotes Licht. Grünes Licht wirft er zurück. Darum sehen Blätter grün aus.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Du stellst eine Pflanze nur unter grünes Licht. Was passiert?
    params:
      options:
        - label: Sie wächst schlecht, weil sie grünes Licht kaum nutzt.
          correct: true
        - label: Sie wächst besonders gut, weil sie grün ist.
          feedback: Grün ist gerade das Licht, das sie zurückwirft.
        - label: Sie wird blau.
          feedback: Die Farbe des Blatts bleibt gleich. Es fehlt Energie.
    hints:
      - Welches Licht schluckt Chlorophyll?
      - Was zurückgeworfen wird, nützt nichts.
    explanation: Etwas grünes Licht nutzen Pflanzen trotzdem, aber viel weniger. Gewächshäuser leuchten darum oft rot und blau.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Forscher gaben Pflanzen Wasser mit markiertem Sauerstoff. Wo tauchte die Markierung auf?
    params:
      options:
        - label: Im freigesetzten Sauerstoffgas
          correct: true
        - label: Im Traubenzucker
          feedback: Der Sauerstoff im Zucker stammt aus dem CO₂.
        - label: Nirgends, er verschwand
          feedback: Atome verschwinden nicht.
    hints:
      - Die Pflanze spaltet Wasser mit Lichtenergie.
      - Woher kommt also das O₂, das wir atmen?
    explanation: Der Sauerstoff, den wir atmen, stammt aus gespaltenem Wasser. Das zeigten Ruben und Kamen 1941.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Für einen Traubenzucker (180 g/mol) braucht die Pflanze 6 CO₂ (je 44 g/mol). Wie viel Gramm CO₂ bindet sie für 180 g Zucker?
    params:
      unit: g
    answer:
      value: 264
    feedback:
      - when: numval(state.input) == 44
        misconception: one-co2
        text: Das ist ein CO₂. Es sind sechs pro Zucker.
    hints:
      - 1 mol Zucker braucht 6 mol CO₂.
      - 6 · 44 g
    explanation: 6 · 44 g = 264 g CO₂. Der Zucker wiegt weniger, weil Sauerstoff als O₂ abgegeben wird.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Nur etwa 1 bis 2 % des Sonnenlichts auf einem Feld landen im Zucker. Was ist ein Hauptgrund?
    params:
      options:
        - label: Viel Licht hat die falsche Farbe, und das Enzym Rubisco arbeitet langsam und ungenau.
          correct: true
        - label: Pflanzen wollen nicht schneller wachsen.
          feedback: Es gibt keinen Willen. Die Grenzen sind physikalisch und chemisch.
        - label: Das Licht ist zu schwach.
          feedback: Im Sommer haben Blätter oft sogar zu viel Licht.
    hints:
      - Welche Farben nutzt Chlorophyll gar nicht?
      - Rubisco verwechselt manchmal CO₂ mit O₂.
    explanation: Rubisco ist wohl das häufigste Eiweiß der Erde – weil es so langsam ist, braucht die Pflanze riesige Mengen.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was bei der Photosynthese passiert.
    params:
      keywords:
        - - licht
          - light
          - sonne
          - sun
        - - kohlendioxid
          - co2
          - co₂
          - carbon dioxide
        - - wasser
          - water
          - h2o
          - h₂o
        - - zucker
          - glucose
          - sugar
        - - sauerstoff
          - oxygen
          - o2
          - o₂
      sample: Mit Energie aus Licht baut die Pflanze aus Kohlendioxid und Wasser Traubenzucker. Dabei wird Sauerstoff frei. Das passiert in den Chloroplasten.
    explanation: Licht als Energie, CO₂ und Wasser als Rohstoffe, Zucker und O₂ als Produkte.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
