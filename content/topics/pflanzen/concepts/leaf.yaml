id: bio.plants.leaf
type: concept
title: "Das Blatt"
summary: "Ein Solarkraftwerk mit Toren für Gas."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Blätter sind flach und dünn. Was bringt das der Pflanze?
    params:
      options:
        - label: Viel Fläche für Licht, und Gase haben kurze Wege.
          correct: true
        - label: Sie sind leichter zu fressen.
          feedback: Das wäre ein Nachteil, kein Vorteil.
        - label: Sie fallen im Herbst besser ab.
          feedback: Abfallen ist nicht der Zweck der Form.
    hints:
      - Was braucht die Photosynthese?
      - Licht trifft Flächen, Gase diffundieren kurze Strecken schnell.
    explanation: Ein Blatt ist ein Kompromiss aus großer Fläche und kurzen Wegen – wie ein Solarmodul mit Lüftung.

  - kind: explain
    id: c1
    body: An der Blattunterseite sitzen winzige Poren, die **Spaltöffnungen**. Zwei Schließzellen öffnen und schließen sie. Durch sie strömt CO₂ hinein und Wasserdampf hinaus.

  - kind: problem
    id: c2
    widget: order
    prompt: "Schichten eines Blatts: Ordne von oben nach unten."
    params:
      items:
        - label: Wachsschicht
        - label: Obere Haut
        - label: Palisadengewebe
        - label: Schwammgewebe
        - label: Untere Haut mit Spaltöffnungen
      startLabel: oben
      endLabel: unten
    hints:
      - Ganz oben schützt eine Wachsschicht vor Austrocknen.
      - Die Zellen voller Chloroplasten liegen dicht unter der Haut, im Licht.
    explanation: Oben Schutz und Licht, in der Mitte die Kraftwerke, unten Lufträume und Poren.

  - kind: problem
    id: c3
    widget: choice
    prompt: An einem heißen, trockenen Mittag schließt die Pflanze ihre Spaltöffnungen. Was ist der Preis?
    params:
      options:
        - label: Es kommt kaum CO₂ hinein, die Photosynthese stockt.
          correct: true
        - label: Sie bekommt keinen Sauerstoff mehr und stirbt.
          feedback: Kurz geschlossen ist harmlos. Es fehlt vor allem CO₂.
        - label: Es gibt keinen Preis.
          feedback: Jede Pore ist ein Tor in beide Richtungen.
    hints:
      - Durch dieselbe Pore geht Wasser hinaus und CO₂ hinein.
      - "Zu heißt: kein Verlust, aber auch kein Nachschub."
    explanation: "Die Pflanze muss ständig abwägen: Wasser sparen oder Zucker bauen."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die meisten [[Chloroplasten]] liegen im Palisadengewebe. Gase wandern durch die [[Spaltöffnungen]], die von zwei [[Schließzellen]] gesteuert werden.
      distractors:
        - Mitochondrien
        - Wurzeln
        - Blüten
    explanation: Licht wird oben eingefangen, Gas unten ein- und ausgelassen.

  - kind: explain
    id: d1
    depth: 2
    body: Wasser verdunstet durch die Spaltöffnungen. Das heißt **Transpiration**. Eine große Eiche verliert so an einem Sommertag mehrere Hundert Liter Wasser. Sie kühlt sich damit auch.

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: Öffnen sich die Spaltöffnungen eher?
    params:
      cards:
        - text: Morgens mit Licht und feuchtem Boden
          right: true
          why: "Gute Bedingungen: Photosynthese lohnt sich."
        - text: Bei Dürre und heißem Wind
          right: false
          why: Wasser sparen hat Vorrang.
        - text: Mitten in der Nacht
          right: false
          why: Ohne Licht bringt CO₂ nichts. Die meisten Pflanzen schließen.
        - text: Bei wenig CO₂ im Blatt und viel Licht
          right: true
          why: Dann braucht die Pflanze Nachschub.
      left: eher zu
      right: eher offen
    explanation: Licht und Wasser öffnen, Trockenheit und Dunkelheit schließen.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Welches Blatt passt zu einem trockenen Standort?
    params:
      buckets:
        - id: b1
          label: trocken und sonnig
        - id: b2
          label: feucht und schattig
      items:
        - label: Dicke Wachsschicht
          bucket: b1
        - label: Poren in Gruben versenkt
          bucket: b1
        - label: Blätter zu Dornen umgebaut
          bucket: b1
        - label: Große, dünne Blattfläche
          bucket: b2
        - label: Viele offene Poren
          bucket: b2
    hints:
      - Was hilft gegen Wasserverlust?
      - Im Schatten zählt jedes bisschen Licht.
    explanation: Trockenpflanzen sparen Wasser, Schattenpflanzen fangen Licht. Die Form folgt dem Standort.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: Ein Blatt hat 200 Spaltöffnungen pro mm². Wie viele sind es auf {{a}} cm² Blattfläche?
    answer:
      value: "{{200 * 100 * a}}"
    feedback:
      - when: numval(state.input) == 200 * 10 * a
        misconception: area-units
        text: Ein cm² sind 10 · 10 = 100 mm², nicht 10.
    hints:
      - Wie viele mm² passen in 1 cm²?
      - 1 cm² = 100 mm². Rechne 200 · 100 · {{a}}.
    explanation: "{{a}} cm² = {{100 * a}} mm², mal 200 sind {{200 * 100 * a}} Poren."
    difficulty: 2
    variants:
      params:
        a: int[2,30]
      defaults:
        a: 10

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kakteen öffnen ihre Spaltöffnungen nachts und speichern das CO₂ als Säure. Warum dieser Umweg?
    params:
      options:
        - label: Nachts ist es kühl und feucht, so verlieren sie viel weniger Wasser.
          correct: true
        - label: Kakteen machen nachts Photosynthese.
          feedback: Photosynthese braucht Licht. Tagsüber wird die Säure wieder zu CO₂.
        - label: Tagsüber gibt es kein CO₂.
          feedback: CO₂ ist immer in der Luft. Das Problem ist die Hitze.
    hints:
      - Was ist in der Wüste das knappste Gut?
      - Tagsüber bleiben die Poren zu. Das CO₂ kommt aus dem Säurespeicher.
    explanation: Das heißt CAM-Photosynthese. Aufnahme nachts, Zuckerbau am Tag – zeitlich getrennt.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Blatt gebaut ist und wozu es Spaltöffnungen hat.
    params:
      keywords:
        - - chloroplast
          - palisad
        - - spaltöffnung
          - spaltoeffnung
          - pore
          - stoma
        - - co2
          - co₂
          - kohlendioxid
          - carbon dioxide
        - - wasser
          - verdunst
          - water
          - evapor
          - transpir
      sample: Oben im Blatt liegt das Palisadengewebe voller Chloroplasten, die Licht fangen. Unten sind Spaltöffnungen. Durch sie kommt CO₂ hinein, und Wasser verdunstet hinaus.
    explanation: Das Blatt ist für Licht und Gasaustausch gebaut – und muss dabei Wasser sparen.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
