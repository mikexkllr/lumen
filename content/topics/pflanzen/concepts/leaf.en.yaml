id: bio.plants.leaf
type: concept
title: "The leaf"
summary: "A solar power plant with gates for gas."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Gates in the leaf
    body: "A single leaf has thousands of tiny gates. They decide whether gas may come in and water go out. Switch light and drought on and off: when does a **stoma** open?"
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: L
            label: Light
          - id: T
            label: Drought
        gates:
          - id: n
            type: NOT
            in:
              - T
          - id: g
            type: AND
            in:
              - L
              - n
        outputs:
          - id: S
            from: g
            label: open

  - kind: problem
    id: hook
    widget: choice
    prompt: Leaves are flat and thin. What does that do for the plant?
    params:
      options:
        - label: Lots of area for light, and gases have short paths.
          correct: true
        - label: They are easier to eat.
          feedback: That would be a drawback, not an advantage.
        - label: They fall off better in autumn.
          feedback: Falling is not the purpose of the shape.
    hints:
      - What does photosynthesis need?
      - Light hits surfaces, gases diffuse quickly over short distances.
    explanation: A leaf is a trade-off between a large surface and short paths – like a solar panel with vents.

  - kind: explain
    id: c1
    body: "Tiny pores sit on the underside of the leaf: the **stomata**. Two guard cells open and close them. CO₂ flows in through them and water vapour flows out."

  - kind: problem
    id: c2
    widget: order
    prompt: "Layers of a leaf: order from top to bottom."
    params:
      items:
        - label: Waxy cuticle
        - label: Upper epidermis
        - label: Palisade layer
        - label: Spongy layer
        - label: Lower epidermis with stomata
      startLabel: top
      endLabel: bottom
    hints:
      - At the very top a waxy layer protects against drying out.
      - The cells packed with chloroplasts lie just under the skin, in the light.
    explanation: Protection and light on top, power plants in the middle, air spaces and pores at the bottom.

  - kind: problem
    id: c3
    widget: choice
    prompt: On a hot, dry noon the plant closes its stomata. What is the price?
    params:
      options:
        - label: Hardly any CO₂ gets in, so photosynthesis stalls.
          correct: true
        - label: It gets no oxygen and dies.
          feedback: Closing briefly is harmless. Mainly CO₂ is missing.
        - label: There is no price.
          feedback: Each pore is a gate in both directions.
    hints:
      - Water goes out and CO₂ comes in through the same pore.
      - Closed means no loss, but no supply either.
    explanation: "The plant constantly has to choose: save water or build sugar."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Most [[chloroplasts]] lie in the palisade layer. Gases pass through the [[stomata]], which are controlled by two [[guard cells]].
      distractors:
        - mitochondria
        - roots
        - flowers
    explanation: Light is captured at the top, gas is let in and out at the bottom.

  - kind: explain
    id: d1
    depth: 2
    body: Water evaporates through the stomata. This is called **transpiration**. A large oak loses several hundred litres of water this way on a summer day. It also cools itself.

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: Are the stomata more likely to open?
    params:
      cards:
        - text: In the morning, with light and moist soil
          right: true
          why: "Good conditions: photosynthesis pays off."
        - text: In drought and hot wind
          right: false
          why: Saving water comes first.
        - text: In the middle of the night
          right: false
          why: Without light CO₂ is useless. Most plants close.
        - text: With little CO₂ inside the leaf and plenty of light
          right: true
          why: Then the plant needs supply.
      left: rather closed
      right: rather open
    explanation: Light and water open them, drought and darkness close them.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Which leaf suits a dry habitat?
    params:
      buckets:
        - id: b1
          label: dry and sunny
        - id: b2
          label: moist and shady
      items:
        - label: Thick waxy layer
          bucket: b1
        - label: Pores sunk in pits
          bucket: b1
        - label: Leaves turned into spines
          bucket: b1
        - label: Large, thin leaf blade
          bucket: b2
        - label: Many open pores
          bucket: b2
    hints:
      - What helps against water loss?
      - In the shade every bit of light counts.
    explanation: Dry-habitat plants save water, shade plants catch light. Form follows habitat.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: A leaf has 200 stomata per mm². How many are there on {{a}} cm² of leaf?
    answer:
      value: "{{200 * 100 * a}}"
    feedback:
      - when: numval(state.input) == 200 * 10 * a
        misconception: area-units
        text: One cm² is 10 × 10 = 100 mm², not 10.
    hints:
      - How many mm² fit into 1 cm²?
      - 1 cm² = 100 mm². Compute 200 × 100 × {{a}}.
    explanation: "{{a}} cm² = {{100 * a}} mm², times 200 is {{200 * 100 * a}} pores."
    difficulty: 2
    variants:
      params:
        a: int[2,30]
      defaults:
        a: 10

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Cacti open their stomata at night and store the CO₂ as an acid. Why this detour?
    params:
      options:
        - label: At night it is cool and humid, so they lose much less water.
          correct: true
        - label: Cacti photosynthesise at night.
          feedback: Photosynthesis needs light. By day the acid turns back into CO₂.
        - label: There is no CO₂ by day.
          feedback: CO₂ is always in the air. The problem is the heat.
    hints:
      - What is scarcest in the desert?
      - By day the pores stay shut. The CO₂ comes from the acid store.
    explanation: This is called CAM photosynthesis. Uptake at night, sugar building by day – separated in time.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a leaf is built and what its stomata are for.
    params:
      keywords:
        - - chloroplast
          - palisad
        - - spaltöffnung
          - spaltoeffnung
          - pore
          - stoma
        - - co2
          - co₂
          - kohlendioxid
          - carbon dioxide
        - - wasser
          - verdunst
          - water
          - evapor
          - transpir
      sample: At the top of the leaf lies the palisade layer full of chloroplasts that catch light. Underneath are the stomata. CO₂ enters through them and water evaporates out.
    explanation: The leaf is built for light and gas exchange – while saving water.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
