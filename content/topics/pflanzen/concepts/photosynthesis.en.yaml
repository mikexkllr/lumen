id: bio.plants.photosynthesis
type: concept
title: "Photosynthesis"
summary: "Light, water and CO₂ become sugar."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Green power plants
    body: Almost everything you eat starts with a leaf in the sun. Plants turn light into food. Uncover the cards and see everything **photosynthesis** achieves.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌊
            front: Every second breath
            back: About half of the oxygen on Earth comes from tiny algae in the sea.
          - icon: 🧀
            front: Your breakfast
            back: "Bread, cereal, even cheese: every food chain begins with a plant."
          - icon: ⛽
            front: Yesterday's sunshine
            back: Coal and oil are remains of plants and algae – sunlight stored over millions of years.

  - kind: problem
    id: hook
    widget: choice
    prompt: An oak weighs many tonnes. Where does most of its wood come from?
    params:
      options:
        - label: From the air – from carbon dioxide
          correct: true
        - label: From the soil
          feedback: "An experiment in the 17th century showed: the soil in the pot barely decreases."
        - label: From water alone
          feedback: Water supplies hydrogen and oxygen. The carbon is still missing.
    hints:
      - Wood is mostly carbon.
      - Where is there carbon a leaf can reach?
    explanation: The carbon in wood comes from CO₂ in the air. Trees are basically solidified air.

  - kind: explain
    id: c1
    body: In **photosynthesis** plants build glucose from carbon dioxide and water. Light supplies the energy. Oxygen is released as waste. This happens in the green chloroplasts.

  - kind: problem
    id: c2
    widget: tiles
    prompt: Build the equation for photosynthesis.
    params:
      tiles:
        - C₆H₁₂O₆
        - 6 O₂
        - +
        - 6 CO₂
        - →
        - 6 H₂O
        - +
    answer:
      anyOf:
        - - 6 CO₂
          - +
          - 6 H₂O
          - →
          - C₆H₁₂O₆
          - +
          - 6 O₂
        - - 6 H₂O
          - +
          - 6 CO₂
          - →
          - C₆H₁₂O₆
          - +
          - 6 O₂
        - - 6 CO₂
          - +
          - 6 H₂O
          - →
          - 6 O₂
          - +
          - C₆H₁₂O₆
        - - 6 H₂O
          - +
          - 6 CO₂
          - →
          - 6 O₂
          - +
          - C₆H₁₂O₆
    hints:
      - On the left are the starting materials from air and soil.
      - On the right are sugar and oxygen.
    explanation: 6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂, powered by light.

  - kind: problem
    id: c3
    widget: numeric
    prompt: A plant builds {{n}} glucose molecules. How many CO₂ molecules does it need?
    answer:
      value: "{{6 * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: one-to-one
        text: One sugar has 6 carbon atoms. Each comes from one CO₂.
    hints:
      - How many C atoms does C₆H₁₂O₆ have?
      - 6 CO₂ per sugar.
    explanation: "6 CO₂ per sugar: {{n}} × 6 = {{6 * n}}. This also releases {{6 * n}} O₂."
    variants:
      params:
        n: int[2,12]
      defaults:
        n: 5

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Plants take [[carbon dioxide]] from the air and water from the soil. With energy from [[light]] they build [[glucose]]. They release [[oxygen]] in the process.
      distractors:
        - nitrogen
        - heat
        - protein
    explanation: Two substances in, light as the drive, sugar and oxygen out.

  - kind: explain
    id: d1
    depth: 2
    body: The green pigment **chlorophyll** absorbs mainly blue and red light. It reflects green light. That is why leaves look green.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: You keep a plant under green light only. What happens?
    params:
      options:
        - label: It grows poorly because it hardly uses green light.
          correct: true
        - label: It grows especially well because it is green.
          feedback: Green is exactly the light it reflects.
        - label: It turns blue.
          feedback: The leaf colour stays the same. Energy is missing.
    hints:
      - Which light does chlorophyll absorb?
      - What is reflected is of no use.
    explanation: Plants still use some green light, but much less. That is why greenhouses often glow red and blue.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Researchers gave plants water with labelled oxygen. Where did the label turn up?
    params:
      options:
        - label: In the released oxygen gas
          correct: true
        - label: In the glucose
          feedback: The oxygen in the sugar comes from CO₂.
        - label: Nowhere, it vanished
          feedback: Atoms do not vanish.
    hints:
      - The plant splits water using light energy.
      - So where does the O₂ we breathe come from?
    explanation: The oxygen we breathe comes from split water. Ruben and Kamen showed this in 1941.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: For one glucose (180 g/mol) the plant needs 6 CO₂ (44 g/mol each). How many grams of CO₂ does it bind for 180 g of sugar?
    params:
      unit: g
    answer:
      value: 264
    feedback:
      - when: numval(state.input) == 44
        misconception: one-co2
        text: That is one CO₂. There are six per sugar.
    hints:
      - 1 mol of sugar needs 6 mol of CO₂.
      - 6 × 44 g
    explanation: 6 × 44 g = 264 g of CO₂. The sugar weighs less because oxygen is released as O₂.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Only about 1 to 2 % of the sunlight on a field ends up in sugar. What is a main reason?
    params:
      options:
        - label: Much light has the wrong colour, and the enzyme Rubisco works slowly and sloppily.
          correct: true
        - label: Plants do not want to grow faster.
          feedback: There is no will. The limits are physical and chemical.
        - label: The light is too weak.
          feedback: In summer leaves often have too much light.
    hints:
      - Which colours does chlorophyll not use at all?
      - Rubisco sometimes confuses CO₂ with O₂.
    explanation: Rubisco is probably the most abundant protein on Earth – because it is so slow, plants need huge amounts of it.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what happens in photosynthesis.
    params:
      keywords:
        - - licht
          - light
          - sonne
          - sun
        - - kohlendioxid
          - co2
          - co₂
          - carbon dioxide
        - - wasser
          - water
          - h2o
          - h₂o
        - - zucker
          - glucose
          - sugar
        - - sauerstoff
          - oxygen
          - o2
          - o₂
      sample: Using energy from light, the plant builds glucose from carbon dioxide and water. Oxygen is released. This happens in the chloroplasts.
    explanation: Light as energy, CO₂ and water as raw materials, sugar and O₂ as products.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
