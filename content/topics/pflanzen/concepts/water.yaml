id: bio.plants.water
type: concept
title: "Wasser bis in die Krone"
summary: "Wie Bäume Wasser über 100 m hoch ziehen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: Wie hoch ist der höchste lebende Baum der Erde?
    params:
      min: 10
      max: 300
      unit: m
    answer:
      value: 116
      tolerance: 15
    explanation: Der Küstenmammutbaum »Hyperion« in Kalifornien misst rund 116 m – höher als ein Fußballfeld lang ist.

  - kind: explain
    id: c1
    body: Wasser steigt in feinen Röhren nach oben, dem **Holzteil**, auch Xylem genannt. Oben verdunstet Wasser aus den Blättern. Die Wasserteilchen hängen aneinander. So zieht die Verdunstung die ganze Wassersäule hoch.

  - kind: problem
    id: c2
    widget: choice
    prompt: Was treibt das Wasser vor allem nach oben?
    params:
      options:
        - label: Der Sog durch Verdunstung an den Blättern
          correct: true
        - label: Eine Pumpe im Stamm
          feedback: Bäume haben keine Pumpe. Die Zellen im Holz sind sogar tot.
        - label: Der Druck aus der Wurzel allein
          feedback: Wurzeldruck schafft nur wenige Meter.
    hints:
      - Wo verlässt das Wasser den Baum?
      - Denk an einen Strohhalm, an dem oben jemand saugt.
    explanation: Die Verdunstung zieht, und die Wassersäule reißt nicht ab, weil Wasser zusammenhält.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Holzteil oder Siebteil?
    params:
      buckets:
        - id: b1
          label: Holzteil (Xylem)
        - id: b2
          label: Siebteil (Phloem)
      items:
        - label: Wasser nach oben
          bucket: b1
        - label: Mineralsalze aus dem Boden
          bucket: b1
        - label: Tote, hohle Zellen
          bucket: b1
        - label: Zucker aus den Blättern
          bucket: b2
        - label: Fließt auch nach unten
          bucket: b2
        - label: Lebende Zellen
          bucket: b2
    hints:
      - Das eine bringt Wasser, das andere Nahrung.
      - Zucker muss auch in die Wurzeln, also nach unten.
    explanation: "Xylem: Wasser und Salze aufwärts durch tote Röhren. Phloem: Zucker in alle Richtungen durch lebende Zellen."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die [[Wurzeln]] nehmen Wasser auf. Es steigt im [[Xylem]] nach oben und [[verdunstet]] aus den Blättern.
      distractors:
        - Blüten
        - Phloem
        - gefriert
    explanation: Aufnahme unten, Transport im Holz, Verdunstung oben – ein Wasserstrom durch die ganze Pflanze.

  - kind: explain
    id: d1
    depth: 2
    body: Um Wasser 10 m hoch zu heben, braucht man etwa 1 bar Druck. Bäume ziehen es mit **Unterdruck** nach oben. In hohen Bäumen herrscht im Holz also ein starker Zug.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Baum ist {{h}} m hoch. Wie viel bar Unterdruck braucht er mindestens, um Wasser bis oben zu ziehen? (1 bar pro 10 m)
    params:
      unit: bar
    answer:
      value: "{{h / 10}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == h
        misconception: per-metre
        text: "Teile durch 10: Je 10 m kommt ein bar dazu."
    hints:
      - 1 bar schafft 10 m.
      - "{{h}} : 10"
    explanation: "{{h}} m brauchen etwa {{h / 10}} bar – dazu kommt noch Reibung in den feinen Röhren."
    difficulty: 2
    variants:
      params:
        h: choice[20,30,50,80,100]
      defaults:
        h: 50

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Eine Pumpe am Boden kann Wasser nur etwa 10 m hoch saugen. Warum schafft der Baum mehr?
    params:
      options:
        - label: Er zieht von oben. In dünnen Röhren hält Wasser sehr großen Zug aus.
          correct: true
        - label: Bäume haben stärkere Pumpen.
          feedback: Es gibt keine Pumpe. Der Trick ist der Zug von oben.
        - label: Im Baum ist das Wasser leichter.
          feedback: Wasser wiegt überall gleich viel.
    hints:
      - Bei der Saugpumpe drückt die Luft von unten – mehr als 1 bar geht nicht.
      - Im Baum zieht die Verdunstung von oben an einer zusammenhängenden Säule.
    explanation: "Das ist die Kohäsions-Theorie: Wasser hält zusammen wie ein Seil. In engen Röhren reißt es kaum."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei Dürre hört man in manchen Bäumen leises Knacken. Was passiert da?
    params:
      options:
        - label: Wassersäulen reißen, und Luftblasen verstopfen Röhren.
          correct: true
        - label: Der Baum wächst besonders schnell.
          feedback: Wachstum ist leise. Das Knacken ist ein Schaden.
        - label: Insekten fressen das Holz.
          feedback: Das kann es geben, aber Dürre-Knacken ist Physik.
    hints:
      - Bei Trockenheit wird der Zug im Holz sehr stark.
      - Irgendwann gibt die Wassersäule nach.
    explanation: Das nennt man Kavitation. Viele Bäume sterben bei Dürre, weil zu viele Röhren mit Luft verstopfen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Eine Blattlaus sticht ins Siebteil. Trennt man ihren Körper ab, tropft der Zuckersaft weiter aus dem Rüssel. Was zeigt das?
    params:
      options:
        - label: Im Siebteil herrscht Überdruck, der den Saft schiebt.
          correct: true
        - label: Im Siebteil herrscht Unterdruck wie im Holz.
          feedback: Dann würde der Saft eingesogen, nicht herausgedrückt.
        - label: Die Laus pumpt noch nach dem Tod.
          feedback: Der Körper ist ja weg. Der Druck kommt aus der Pflanze.
    hints:
      - Herausdrücken oder Einsaugen?
      - Wo viel Zucker ist, zieht er Wasser an – Osmose baut Druck auf.
    explanation: Im Blatt zieht viel Zucker Wasser ins Siebteil, der Druck steigt und schiebt den Saft zu Wurzeln und Früchten. Forscher nutzen Blattläuse sogar, um reinen Siebsaft zu sammeln.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Wasser in einem Baum nach oben kommt.
    params:
      keywords:
        - - verdunst
          - transpir
          - evapor
        - - zusammen
          - kohäs
          - kohaes
          - aneinander
          - cohes
          - cling
          - together
        - - xylem
          - holzteil
          - röhre
          - roehre
          - tube
        - - zug
          - sog
          - unterdruck
          - pull
          - suction
          - tension
          - negative
      sample: Oben verdunstet Wasser aus den Blättern. Das erzeugt einen Sog in den feinen Röhren im Holz, dem Xylem. Weil Wasserteilchen zusammenhalten, wird die ganze Säule nach oben gezogen.
    explanation: Verdunstung zieht, Zusammenhalt überträgt, das Xylem leitet.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
