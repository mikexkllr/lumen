id: bio.plants.respiration
type: concept
title: "Plants breathe too"
summary: "Photosynthesis and respiration are opposites."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A cycle for two
    body: "You and a plant are a well-practised team. What one gives off, the other needs. Uncover the cycle: two processes that exactly **reverse** each other."
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: ☀️
            front: The leaf in the light
            back: From CO₂ and water it builds sugar. Oxygen escapes.
          - icon: 🫁
            front: You breathe in
            back: Your cells burn sugar with that oxygen.
          - icon: 💨
            front: You breathe out
            back: What remains is CO₂ and water – and energy for you.
          - icon: 🔁
            front: Back to the leaf
            back: The CO₂ becomes the raw material for new sugar.

  - kind: problem
    id: hook
    widget: swipe
    prompt: True or false?
    params:
      cards:
        - text: Plants only breathe at night.
          right: false
          why: They breathe all the time. During the day photosynthesis just masks it.
        - text: Plants need oxygen.
          right: true
          why: Their mitochondria burn sugar with oxygen.
        - text: Plants never take up CO₂, only release it.
          right: false
          why: In light they take up more CO₂ than they release.
        - text: Roots need air in the soil.
          right: true
          why: In waterlogged, airless soil roots suffocate.
    explanation: Plants photosynthesise in light and breathe day and night.

  - kind: explain
    id: c1
    body: In **cellular respiration**, cells burn sugar with oxygen. Out come carbon dioxide, water and energy the cell can use. It runs the other way round from photosynthesis.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Photosynthesis or respiration?
    params:
      buckets:
        - id: b1
          label: Photosynthesis
        - id: b2
          label: Respiration
      items:
        - label: Needs light
          bucket: b1
        - label: Takes up CO₂
          bucket: b1
        - label: Runs in chloroplasts
          bucket: b1
        - label: Releases CO₂
          bucket: b2
        - label: Runs in mitochondria
          bucket: b2
        - label: Also in animals
          bucket: b2
    hints:
      - One builds sugar, the other breaks it down.
      - Animals have no chloroplasts.
    explanation: Photosynthesis stores energy in sugar, respiration releases it.

  - kind: problem
    id: c3
    widget: choice
    prompt: A plant stands in a dark cupboard. What does it release into the air?
    params:
      options:
        - label: Carbon dioxide
          correct: true
        - label: Oxygen
          feedback: Without light there is no photosynthesis, so no fresh O₂.
        - label: Nothing
          feedback: It keeps breathing.
    hints:
      - Which process continues in the dark?
      - Respiration turns sugar into CO₂.
    explanation: In the dark only respiration runs. The plant uses oxygen and releases CO₂ – just like you.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Respiration: glucose + 6 [[O₂]] → 6 [[CO₂]] + 6 [[H₂O]] + energy"
      distractors:
        - N₂
        - H₂
    explanation: Exactly photosynthesis backwards – only now the energy is released instead of stored.

  - kind: explain
    id: d1
    depth: 2
    body: In dim light both processes balance. The plant then takes up as much CO₂ as it releases. This is the **compensation point**. Only with more light does it grow.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: In light a leaf takes up {{p}} units of CO₂ per hour. At the same time it respires {{r}} units. How much CO₂ does it bind net per hour?
    answer:
      value: "{{p - r}}"
    feedback:
      - when: numval(state.input) == p + r
        misconception: add-respiration
        text: Respiration releases CO₂. Subtract it.
    hints:
      - Photosynthesis binds, respiration releases.
      - "{{p}} − {{r}}"
    explanation: "Net: {{p}} − {{r}} = {{p - r}} units. Only this surplus becomes growth."
    difficulty: 2
    variants:
      params:
        p: int[8,20]
        r: int[1,5]
      defaults:
        p: 12
        r: 3

  - kind: problem
    id: d3
    depth: 2
    widget: order
    prompt: Order from "releases the most CO₂" to "takes up the most CO₂".
    params:
      items:
        - label: Plant in the dark
        - label: Plant in dim light
        - label: Plant at the compensation point
        - label: Plant in sunshine
    hints:
      - In the dark only respiration runs.
      - More light means more photosynthesis.
    explanation: As light increases the balance tips from release to uptake.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The CO₂ level of the air rises and falls every year like a saw. It drops in the northern summer. Why?
    params:
      options:
        - label: The northern hemisphere has more land and forests, which bind a lot of CO₂ in summer.
          correct: true
        - label: People burn less in summer.
          feedback: That effect is far too small. It is the plants breathing.
        - label: The sea freezes in summer.
          feedback: It is the other way round, and that is not the cause.
    hints:
      - Which hemisphere has most of the land?
      - Forests grow in summer and rest in winter.
    explanation: The zigzag of the Keeling curve is the northern forests breathing in and out. Beneath it, the trend rises from fossil fuels.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A plant binds 10 units of CO₂ per hour for 12 hours. But it respires 2 units per hour for 24 hours. How much CO₂ does it bind net per day?
    answer:
      value: 72
    feedback:
      - when: numval(state.input) == 96
        misconception: day-only
        text: Respiration runs at night too – 24 hours, not 12.
      - when: numval(state.input) == 120
        misconception: no-respiration
        text: Respiration is still missing. Subtract it.
    hints:
      - Photosynthesis only in light, respiration around the clock.
      - 12 × 10 − 24 × 2
    explanation: 120 − 48 = 72 units. The plant uses up over a third of its gain itself.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how plants both make and burn sugar.
    params:
      keywords:
        - - photosynth
        - - atmung
          - respir
        - - umkehr
          - gegen
          - reverse
          - opposite
        - - zucker
          - sugar
          - glucose
        - - kohlendioxid
          - co2
          - co₂
          - carbon dioxide
      sample: "Photosynthesis builds sugar from CO₂ and water and releases oxygen. Respiration is the reverse: it burns the sugar with oxygen into CO₂ and water and releases energy."
    explanation: "Two halves of a cycle: storing energy and releasing it again."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
