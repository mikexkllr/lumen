id: bio.plants.water
type: concept
title: "Water to the treetop"
summary: "How trees pull water more than 100 m up."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: How tall is the tallest living tree on Earth?
    params:
      min: 10
      max: 300
      unit: m
    answer:
      value: 116
      tolerance: 15
    explanation: The coast redwood "Hyperion" in California is about 116 m tall – taller than a football pitch is long.

  - kind: explain
    id: c1
    body: Water rises in fine tubes called the **xylem**. At the top, water evaporates from the leaves. The water molecules cling to each other. So evaporation pulls the whole column of water up.

  - kind: problem
    id: c2
    widget: choice
    prompt: What mainly drives water upward?
    params:
      options:
        - label: The pull from evaporation at the leaves
          correct: true
        - label: A pump in the trunk
          feedback: Trees have no pump. The cells in the wood are even dead.
        - label: Root pressure alone
          feedback: Root pressure only manages a few metres.
    hints:
      - Where does water leave the tree?
      - Think of a straw with someone sucking at the top.
    explanation: Evaporation pulls, and the column does not break because water holds together.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Xylem or phloem?
    params:
      buckets:
        - id: b1
          label: Xylem
        - id: b2
          label: Phloem
      items:
        - label: Water upward
          bucket: b1
        - label: Minerals from the soil
          bucket: b1
        - label: Dead, hollow cells
          bucket: b1
        - label: Sugar from the leaves
          bucket: b2
        - label: Also flows downward
          bucket: b2
        - label: Living cells
          bucket: b2
    hints:
      - One carries water, the other food.
      - Sugar must also reach the roots, so downward.
    explanation: "Xylem: water and minerals upward through dead tubes. Phloem: sugar in all directions through living cells."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[roots]] take up water. It rises in the [[xylem]] and [[evaporates]] from the leaves.
      distractors:
        - flowers
        - phloem
        - freezes
    explanation: Uptake below, transport in the wood, evaporation above – a stream of water through the whole plant.

  - kind: explain
    id: d1
    depth: 2
    body: Lifting water 10 m takes about 1 bar of pressure. Trees pull it up with **negative pressure**. So in tall trees the wood is under strong tension.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A tree is {{h}} m tall. At least how many bar of suction does it need to pull water to the top? (1 bar per 10 m)
    params:
      unit: bar
    answer:
      value: "{{h / 10}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == h
        misconception: per-metre
        text: "Divide by 10: each 10 m adds one bar."
    hints:
      - 1 bar lifts 10 m.
      - "{{h}} ÷ 10"
    explanation: "{{h}} m needs about {{h / 10}} bar – plus friction in the fine tubes."
    difficulty: 2
    variants:
      params:
        h: choice[20,30,50,80,100]
      defaults:
        h: 50

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A pump at the bottom can only suck water about 10 m up. Why does a tree manage more?
    params:
      options:
        - label: It pulls from the top. In thin tubes water withstands very strong tension.
          correct: true
        - label: Trees have stronger pumps.
          feedback: There is no pump. The trick is the pull from above.
        - label: Water is lighter inside the tree.
          feedback: Water weighs the same everywhere.
    hints:
      - With a suction pump, air pushes from below – it cannot exceed 1 bar.
      - In a tree, evaporation pulls from the top on a connected column.
    explanation: "This is the cohesion–tension theory: water holds together like a rope. In narrow tubes it rarely breaks."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: During drought some trees make faint clicking sounds. What is happening?
    params:
      options:
        - label: Water columns snap and air bubbles block tubes.
          correct: true
        - label: The tree is growing especially fast.
          feedback: Growth is silent. The clicking is damage.
        - label: Insects are eating the wood.
          feedback: That can happen, but drought clicking is physics.
    hints:
      - In drought the tension in the wood becomes very strong.
      - At some point the water column gives way.
    explanation: This is called cavitation. Many trees die in drought because too many tubes get blocked with air.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: An aphid taps into the phloem. If its body is cut away, sugary sap keeps dripping from its mouthpart. What does that show?
    params:
      options:
        - label: The phloem is under positive pressure that pushes the sap.
          correct: true
        - label: The phloem is under suction like the xylem.
          feedback: Then the sap would be sucked in, not pushed out.
        - label: The aphid keeps pumping after death.
          feedback: The body is gone. The pressure comes from the plant.
    hints:
      - Pushing out or sucking in?
      - Where there is a lot of sugar it draws water – osmosis builds pressure.
    explanation: In the leaf, lots of sugar draws water into the phloem, pressure rises and pushes the sap to roots and fruits. Researchers even use aphids to collect pure phloem sap.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how water gets to the top of a tree.
    params:
      keywords:
        - - verdunst
          - transpir
          - evapor
        - - zusammen
          - kohäs
          - kohaes
          - aneinander
          - cohes
          - cling
          - together
        - - xylem
          - holzteil
          - röhre
          - roehre
          - tube
        - - zug
          - sog
          - unterdruck
          - pull
          - suction
          - tension
          - negative
      sample: At the top, water evaporates from the leaves. That creates suction in the fine tubes of the xylem. Because water molecules hold together, the whole column is pulled up.
    explanation: Evaporation pulls, cohesion transmits, the xylem conducts.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
