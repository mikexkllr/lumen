id: bio.plants.respiration
type: concept
title: "Auch Pflanzen atmen"
summary: "Photosynthese und Zellatmung sind Gegenspieler."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Kreislauf für zwei
    body: "Du und eine Pflanze seid ein eingespieltes Team. Was der eine abgibt, braucht der andere. Deck den Kreislauf auf: zwei Vorgänge, die sich genau **umkehren**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: ☀️
            front: Das Blatt im Licht
            back: Aus CO₂ und Wasser baut es Zucker. Sauerstoff entweicht.
          - icon: 🫁
            front: Du atmest ein
            back: Deine Zellen verbrennen Zucker mit diesem Sauerstoff.
          - icon: 💨
            front: Du atmest aus
            back: Übrig bleiben CO₂ und Wasser – und Energie für dich.
          - icon: 🔁
            front: Zurück zum Blatt
            back: Das CO₂ wird zum Rohstoff für neuen Zucker.

  - kind: problem
    id: hook
    widget: swipe
    prompt: Stimmt das?
    params:
      cards:
        - text: Pflanzen atmen nur nachts.
          right: false
          why: Sie atmen immer. Tagsüber überdeckt die Photosynthese das nur.
        - text: Pflanzen brauchen Sauerstoff.
          right: true
          why: Ihre Mitochondrien verbrennen Zucker mit Sauerstoff.
        - text: Pflanzen nehmen nie CO₂ ab, nur zu.
          right: false
          why: Bei Licht nehmen sie mehr CO₂ auf, als sie abgeben.
        - text: Wurzeln brauchen Luft im Boden.
          right: true
          why: In nassem, luftleerem Boden ersticken Wurzeln.
    explanation: Pflanzen machen Photosynthese bei Licht und atmen Tag und Nacht.

  - kind: explain
    id: c1
    body: Bei der **Zellatmung** verbrennen Zellen Zucker mit Sauerstoff. Dabei entstehen Kohlendioxid, Wasser und nutzbare Energie. Das ist genau die Umkehrung der Photosynthese.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Photosynthese oder Zellatmung?
    params:
      buckets:
        - id: b1
          label: Photosynthese
        - id: b2
          label: Zellatmung
      items:
        - label: Braucht Licht
          bucket: b1
        - label: Nimmt CO₂ auf
          bucket: b1
        - label: Läuft in Chloroplasten
          bucket: b1
        - label: Gibt CO₂ ab
          bucket: b2
        - label: Läuft in Mitochondrien
          bucket: b2
        - label: Auch bei Tieren
          bucket: b2
    hints:
      - Die eine baut Zucker, die andere baut ihn ab.
      - Tiere haben keine Chloroplasten.
    explanation: Photosynthese speichert Energie im Zucker, Zellatmung setzt sie frei.

  - kind: problem
    id: c3
    widget: choice
    prompt: Eine Pflanze steht in einem dunklen Schrank. Was gibt sie an die Luft ab?
    params:
      options:
        - label: Kohlendioxid
          correct: true
        - label: Sauerstoff
          feedback: Ohne Licht gibt es keine Photosynthese, also kein frisches O₂.
        - label: Nichts
          feedback: Sie atmet weiter.
    hints:
      - Welcher Vorgang läuft im Dunkeln weiter?
      - Zellatmung macht aus Zucker CO₂.
    explanation: Im Dunkeln läuft nur die Zellatmung. Die Pflanze verbraucht Sauerstoff und gibt CO₂ ab – wie du.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Zellatmung: Traubenzucker + 6 [[O₂]] → 6 [[CO₂]] + 6 [[H₂O]] + Energie"
      distractors:
        - N₂
        - H₂
    explanation: Genau die Photosynthese rückwärts – nur wird die Energie jetzt frei statt gespeichert.

  - kind: explain
    id: d1
    depth: 2
    body: Bei schwachem Licht hält sich beides die Waage. Die Pflanze nimmt dann so viel CO₂ auf, wie sie abgibt. Das ist der **Kompensationspunkt**. Erst bei mehr Licht wächst sie.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Blatt nimmt bei Licht {{p}} Einheiten CO₂ pro Stunde auf. Gleichzeitig atmet es {{r}} Einheiten ab. Wie viel CO₂ bindet es netto pro Stunde?
    answer:
      value: "{{p - r}}"
    feedback:
      - when: numval(state.input) == p + r
        misconception: add-respiration
        text: Die Atmung gibt CO₂ ab. Ziehe sie ab.
    hints:
      - Photosynthese bindet, Atmung setzt frei.
      - "{{p}} − {{r}}"
    explanation: "Netto: {{p}} − {{r}} = {{p - r}} Einheiten. Nur dieser Überschuss wird zu Wachstum."
    difficulty: 2
    variants:
      params:
        p: int[8,20]
        r: int[1,5]
      defaults:
        p: 12
        r: 3

  - kind: problem
    id: d3
    depth: 2
    widget: order
    prompt: Ordne von »gibt am meisten CO₂ ab« bis »nimmt am meisten CO₂ auf«.
    params:
      items:
        - label: Pflanze im Dunkeln
        - label: Pflanze im Dämmerlicht
        - label: Pflanze am Kompensationspunkt
        - label: Pflanze in der Sonne
    hints:
      - Im Dunkeln läuft nur die Atmung.
      - Mehr Licht heißt mehr Photosynthese.
    explanation: Mit wachsendem Licht kippt die Bilanz von Abgabe zu Aufnahme.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der CO₂-Gehalt der Luft schwankt jedes Jahr wie eine Säge. Im Nordsommer sinkt er. Warum?
    params:
      options:
        - label: Auf der Nordhalbkugel gibt es mehr Land und Wälder, die im Sommer viel CO₂ binden.
          correct: true
        - label: Im Sommer verbrennen Menschen weniger.
          feedback: Der Effekt ist viel zu klein. Es ist ein Atemzug der Pflanzen.
        - label: Das Meer friert im Sommer.
          feedback: Es ist umgekehrt, und daran liegt es nicht.
    hints:
      - Auf welcher Halbkugel liegt das meiste Land?
      - Wälder wachsen im Sommer und ruhen im Winter.
    explanation: Die Zacken der Keeling-Kurve sind das Ein- und Ausatmen der Wälder im Norden. Darunter steigt der Trend durch fossile Brennstoffe.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Eine Pflanze bindet 12 Stunden lang je 10 Einheiten CO₂ pro Stunde. Sie atmet aber 24 Stunden lang je 2 Einheiten ab. Wie viel CO₂ bindet sie netto am Tag?
    answer:
      value: 72
    feedback:
      - when: numval(state.input) == 96
        misconception: day-only
        text: Die Atmung läuft auch nachts – 24 Stunden, nicht 12.
      - when: numval(state.input) == 120
        misconception: no-respiration
        text: Die Atmung fehlt noch. Ziehe sie ab.
    hints:
      - Photosynthese nur bei Licht, Atmung rund um die Uhr.
      - 12 · 10 − 24 · 2
    explanation: 120 − 48 = 72 Einheiten. Gut ein Drittel des Gewinns verbraucht die Pflanze selbst.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Photosynthese und Zellatmung zusammenhängen.
    params:
      keywords:
        - - photosynth
        - - atmung
          - respir
        - - umkehr
          - gegen
          - reverse
          - opposite
        - - zucker
          - sugar
          - glucose
        - - kohlendioxid
          - co2
          - co₂
          - carbon dioxide
      sample: "Photosynthese baut aus CO₂ und Wasser Zucker und gibt Sauerstoff ab. Zellatmung ist die Umkehrung: Sie verbrennt den Zucker mit Sauerstoff zu CO₂ und Wasser und setzt Energie frei."
    explanation: "Zwei Hälften eines Kreislaufs: Energie speichern und wieder freisetzen."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
