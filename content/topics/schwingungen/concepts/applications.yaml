id: sci.oscillations.applications
type: concept
title: "Schwingungen in Technik und Natur"
summary: "Quarzuhren, schwankende Hochhäuser, Erdbeben und Atomuhren."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Uhr im Pendel
    body: Bevor es Quarzuhren gab, zählten Pendel die Zeit. Ändere Länge und Masse und schau auf die **Periode**. Was bestimmt den Takt – und was nicht?
    visual:
      widget: sim
      interactive: true
      params:
        scene: pendulum

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie oft pro Sekunde schwingt der kleine Quarzkristall in einer Armbanduhr?"
    params:
      min: 1
      max: 1000000
      scale: log
    answer:
      value: 32768
      within: 30
    explanation: Genau 32 768-mal – das ist 2 hoch 15. Ein Zählchip halbiert die Frequenz 15-mal und erhält so genau 1 Hz für den Sekundenzeiger.

  - kind: explain
    id: c1
    body: Jeder Körper hat eine **Eigenfrequenz** – Gläser, Brücken, Hochhäuser, sogar dein Brustkorb. Ingenieure bauen entweder so, dass sie weit weg von störenden Takten liegt, oder sie nutzen sie gezielt, wie in Uhren.

  - kind: problem
    id: c2
    widget: match
    prompt: Welche Schwingung steckt dahinter?
    params:
      pairs:
        - left: Quarzuhr
          right: Kristall, 32 768 Hz
        - left: Pendeluhr
          right: Pendel, 1 Hz
        - left: Stimmgabel
          right: Zinken, 440 Hz
        - left: Hochhaus
          right: Schwanken, 0,2 Hz
    hints:
      - Welche Schwingung ist sehr schnell, welche sehr langsam?
      - Große Dinge schwingen langsam.
    explanation: Vom Kristall mit Zehntausenden Hertz bis zum Hochhaus mit einem Bruchteil von 1 Hz – dieselbe Physik über sechs Zehnerstufen.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Quarz schwingt 32 768-mal pro Sekunde. Wie oft muss eine Zählschaltung halbieren, bis 1 Hz übrig ist?
    answer:
      value: 15
    hints:
      - "Zähl: 32 768 → 16 384 → 8192 → …"
      - 32 768 = 2 hoch wie viel?
    explanation: 2¹⁵ = 32 768, also 15 Halbierungen. Zweierpotenzen lassen sich mit einfachen Schaltungen besonders leicht teilen.

  - kind: problem
    id: c4
    widget: choice
    prompt: Im Hochhaus Taipei 101 hängt oben eine 660 Tonnen schwere Stahlkugel an Seilen. Wozu?
    params:
      options:
        - label: Sie schwingt gegen das Gebäude und bremst sein Schwanken im Wind – ein Schwingungstilger.
          correct: true
        - label: Sie ist ein Kunstwerk ohne Funktion.
          feedback: Sie ist sehenswert, hat aber eine wichtige Aufgabe.
        - label: Sie macht das Haus schwerer und damit fest.
          feedback: Schwerer allein hilft kaum. Die Kugel muss sich bewegen können.
    hints:
      - Die Kugel ist auf die Eigenfrequenz des Turms abgestimmt.
      - Sie schwingt gegenläufig.
    explanation: Der Tilger nimmt die Schwingungsenergie auf und gibt sie an Dämpfer ab. So schwankt der Turm deutlich weniger.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: Ein Metronom soll genau einmal pro Sekunde hin und zurück schwingen, also mit 1 Hz. Stell die Pendellänge ein.
    params:
      scene: pendulum
      controls:
        length:
          min: 0.05
          max: 1
          step: 0.05
          value: 0.5
    answer:
      frequency:
        - 0.98
        - 1.02
    hints:
      - Ein kürzeres Pendel schwingt schneller.
      - Für 1 Hz muss eine Schwingung 1 s dauern. Verkürze das Pendel, bis die Periode 1 s zeigt.
    explanation: Bei 25 cm dauert eine Schwingung 1 s. Für den doppelten Takt braucht ein Pendel nur ein Viertel der Länge.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Faustregel: Ein Hochhaus schwankt mit einer Periode von etwa 0,1 s pro Stockwerk. Wie lang ist die Periode bei {{n}} Stockwerken?"
    params:
      unit: s
    answer:
      value: "{{n / 10}}"
    hints:
      - 0,1 s mal die Zahl der Stockwerke.
      - "{{n}} · 0,1 = ?"
    explanation: Etwa {{n / 10}} s. Höhere Gebäude schwingen langsamer – wie längere Pendel.
    difficulty: 2
    variants:
      params:
        n: choice[10,30,50,100]
      defaults:
        n: 50

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Bei manchen Erdbeben stürzen vor allem mittelhohe Häuser ein, niedrige und sehr hohe weniger. Warum?
    params:
      options:
        - label: Ihre Eigenperiode passt zur Periode der Bodenschwingung – sie schaukeln sich auf.
          correct: true
        - label: Mittelhohe Häuser sind schlechter gebaut.
          feedback: Es liegt an der Physik, nicht an der Bauqualität.
        - label: Hohe Häuser sind leichter.
          feedback: Hohe Häuser sind schwerer. Entscheidend ist ihre Eigenfrequenz.
    hints:
      - Der Boden schwingt oft mit Perioden von etwa 0,5 bis 2 Sekunden.
      - "Nutze die Faustregel: 0,1 s pro Stockwerk."
    explanation: Häuser mit 5 bis 20 Stockwerken haben Perioden von 0,5 bis 2 s – genau im Bereich des Bodens. Erdbebensichere Bauten verschieben ihre Eigenfrequenz oder dämpfen stark.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: sim
    prompt: Ein Schwingungstilger mit 2 kg soll mit 0,5 Hz schwingen. Finde die passende Federhärte.
    params:
      scene: spring
      controls:
        mass:
          value: 2
          fixed: true
    answer:
      frequency:
        - 0.49
        - 0.51
    explanation: D = m · (2πf)² = 2 · π² ≈ 20 N/m. Ein Tilger funktioniert nur, wenn er auf die Eigenfrequenz des Bauwerks abgestimmt ist.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Atomuhren zählen Mikrowellen, die genau zu einem Übergang im Cäsiumatom passen: 9 192 631 770 Schwingungen. So lange dauert per Definition eine **Sekunde**. Solche Uhren gehen in Millionen Jahren um weniger als eine Sekunde falsch."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Eine Quarzuhr geht 1 Sekunde pro Tag falsch. Wie groß ist die relative Abweichung in ppm (Millionstel)? Ein Tag hat 86 400 s. Auf eine Stelle.
    params:
      unit: ppm
    answer:
      value: 11.6
      tolerance: 0.2
    hints:
      - "1 : 86 400 ≈ 0,0000116."
      - Mal eine Million.
    explanation: Etwa 11,6 ppm. Gute Quarzuhren schaffen unter 1 ppm. Eine Atomuhr liegt bei etwa 10⁻¹⁰ ppm.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Im MRT strahlt man Radiowellen genau mit der Eigenfrequenz der Wasserstoffkerne im Magnetfeld ein. Warum genau mit dieser?
    params:
      options:
        - label: Nur in Resonanz nehmen die Kerne Energie auf und senden danach ein Signal zurück.
          correct: true
        - label: Andere Frequenzen wären gefährlich.
          feedback: Andere Radiofrequenzen gehen einfach durch, ohne zu wirken.
        - label: Damit das Gerät leiser ist.
          feedback: Das Klopfen kommt von den Spulen. Die Frequenzwahl folgt der Resonanz.
    hints:
      - "Wie bei der Schaukel: Wann kommt Energie an?"
      - Die Eigenfrequenz der Kerne hängt von der Magnetfeldstärke ab.
    explanation: Nur im richtigen Takt wird Energie übertragen. Weil die Frequenz vom Feld abhängt und das Feld über den Körper variiert, weiß man, woher jedes Signal kommt.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man ein Hochhaus davor schützt, sich im Wind aufzuschaukeln.
    params:
      keywords:
        - - eigenfrequenz
          - natural frequency
          - takt
          - frequency
          - resonanz
          - resonance
        - - dämpf
          - damp
          - tilger
          - damper
          - bremst
          - brake
        - - gegen
          - opposite
          - energie
          - energy
          - masse
          - mass
      sample: Das Hochhaus hat eine Eigenfrequenz, und Windwirbel können es in diesem Takt anstoßen. Ein Tilger – eine große Masse auf derselben Frequenz – schwingt gegen das Gebäude, nimmt die Energie auf und dämpft sie weg.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "x2"]
