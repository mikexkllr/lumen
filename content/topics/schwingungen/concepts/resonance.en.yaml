id: sci.oscillations.resonance
type: concept
title: "Resonance"
summary: "Small pushes at the right rhythm – from swings to radios to dancing bridges."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You push a swing only very gently. When does it still go higher and higher?
    params:
      options:
        - label: When you always push in step with its own swing.
          correct: true
        - label: When you push as fast as possible.
          feedback: Pushes that are too fast often hit the swing as it comes towards you – and brake it.
        - label: Any way, as long as it is often.
          feedback: The rhythm is everything. Badly timed pushes cancel out.
    hints:
      - When does a push give the swing energy?
      - When you push in the direction she is moving.
    explanation: At the right rhythm every little push adds on top. That is resonance.

  - kind: explain
    id: c1
    body: Everything that can oscillate has a **natural frequency**. If it is pushed at exactly that rhythm, energy builds up push by push. The oscillation grows until damping or breakage stops it.

  - kind: problem
    id: c2
    widget: sim
    prompt: A playground swing should oscillate at 0.35 Hz. Set a suitable rope length.
    params:
      scene: pendulum
    answer:
      frequency:
        - 0.34
        - 0.36
    explanation: About 2 m. That is how often – a little more than once every three seconds – you have to push. Longer ropes, slower rhythm.

  - kind: problem
    id: c3
    widget: choice
    prompt: Why should soldiers not march in step across a small bridge?
    params:
      options:
        - label: Their stepping rhythm could hit the bridge's natural frequency and build up the swaying.
          correct: true
        - label: Because together they are too heavy.
          feedback: The same weight walking out of step is no problem. It is about the rhythm.
        - label: Because the noise weakens the bridge.
          feedback: Not the sound but the rhythmic impacts of the feet are the problem.
    hints:
      - Many pushes, all at the same rhythm …
      - … just like on a swing.
    explanation: Hundreds of feet in step act like a huge driver. If it hits the natural frequency, the swaying grows. In 1831 the Broughton bridge in England collapsed this way.

  - kind: problem
    id: c4
    widget: numeric
    prompt: A swing takes 3 seconds to go there and back once. How many times a minute do you have to push it?
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 180
        misconception: multiply
        text: "Divide, do not multiply: 60 seconds by 3 seconds."
    hints:
      - Push once per swing.
      - 60 ÷ 3 = ?
    explanation: 20 times a minute. Pushing in rhythm takes very little force.

  - kind: explain
    id: d1
    depth: 2
    body: "Plotting the amplitude against the driving frequency gives the **resonance curve**: a peak at the natural frequency. The weaker the damping, the higher and narrower it is."

  - kind: problem
    id: d2
    depth: 2
    widget: sim
    prompt: A radio picks up a station when its tuned circuit is in resonance. Set coil and capacitor to about 1000 Hz.
    params:
      scene: resonance
    answer:
      f0:
        - 950
        - 1050
    explanation: "For example L = 5 mH and C = 5 µF. The product L · C sets the rhythm: f₀ = 1 ÷ (2π√(LC)). Tuning to another station changes C."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: In 2000 London's Millennium Bridge swayed sideways at about 1 Hz. People take about 2 steps per second when walking. How does that fit?
    params:
      options:
        - label: Sideways the body sways only once per pair of steps – at 1 Hz. And people fell into step with the wobble.
          correct: true
        - label: It does not; it was the wind.
          feedback: The effect only appeared with many pedestrians.
        - label: The bridge swayed twice as fast as the steps.
          feedback: "The other way round: it swayed at half the step frequency."
    hints:
      - Left, right – when is your body back on the far left?
      - Walking on a swaying floor, people compensate without noticing.
    explanation: Sideways force alternates at half the step frequency. As the bridge swayed, people walked wide-legged in time with it – and made it worse. Dampers fixed the problem.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: The coil is fixed at 10 mH. Find the capacitance for which the circuit oscillates at about 500 Hz.
    params:
      scene: resonance
      controls:
        inductance:
          value: 10
          fixed: true
        capacitance:
          value: 40
    answer:
      f0:
        - 490
        - 515
    explanation: C = 1 ÷ (4π² f² L) ≈ 10 µF. Half the frequency needs four times the capacitance – again there is a square root in the formula.
    difficulty: 3

  - kind: explain
    id: x2
    depth: 3
    body: Below resonance a system moves in step with the driver, far above it moves opposite. Exactly at resonance it lags by a quarter period. At this **phase shift** of 90° the driver transfers the most energy.

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: "In 1940 the Tacoma Narrows Bridge in the USA collapsed. People often say: »resonance with gusts of wind«. What happened more precisely?"
    params:
      options:
        - label: Steady wind fed a twisting oscillation through the bridge's own motion – flutter.
          correct: true
        - label: The gusts happened to come exactly at the bridge's rhythm.
          feedback: The wind was fairly steady. The bridge made its own rhythm.
        - label: An earthquake set it swinging.
          feedback: There was no earthquake that day, only wind of about 65 km/h.
    hints:
      - Was there a driver with a fixed rhythm?
      - The twisting changed how the wind hit the deck.
    explanation: Each twist redirected the wind so that it reinforced the next twist – a self-excited oscillation. Since then bridge builders test every deck profile in a wind tunnel.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why small pushes can get a heavy swing going high.
    params:
      keywords:
        - - takt
          - rhythm
          - time
          - eigenfrequenz
          - natural frequency
          - frequenz
          - frequency
        - - energie
          - energy
          - sammel
          - build
          - add
          - dazu
        - - resonanz
          - resonance
          - aufschaukel
          - grow
          - höher
          - higher
      sample: Each small push gives the swing a little energy. If I push exactly at the rhythm of its natural frequency, the energy builds up push by push. The swing goes higher and higher – that is resonance.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "x1"]
