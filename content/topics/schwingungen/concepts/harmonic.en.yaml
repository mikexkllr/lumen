id: sci.oscillations.harmonic
type: concept
title: "The sine oscillation"
summary: "Amplitude, frequency and phase – and why circles and springs draw the same curve."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A ball moves steadily around a circle. You look exactly from the side. How does its shadow on the wall move?
    params:
      options:
        - label: Back and forth – fast in the middle, slow at the ends.
          correct: true
        - label: Back and forth at constant speed.
          feedback: At the ends the shadow turns round and almost stops.
        - label: It stands still.
          feedback: Seen from the side the ball moves up and down.
    hints:
      - Where does the ball move almost straight towards you?
      - There the shadow barely changes position.
    explanation: The shadow makes exactly the same motion as a mass on a spring. Both follow a sine curve.

  - kind: explain
    id: c1
    body: A **sine oscillation** is $x(t) = A \sin(\omega t)$. A is the amplitude, the largest displacement. ω = 2π · f is the angular frequency. In one period ωt grows by a full turn, 2π.

  - kind: problem
    id: c2
    widget: slider
    prompt: Set the amplitude so your oscillation matches the dashed one.
    params:
      expr: a*sin(3*x)
      x:
        - 0
        - 6
      y:
        - -3
        - 3
      sliders:
        - id: a
          label: Amplitude A
          min: 0.5
          max: 3
          step: 0.5
          initial: 1
      target:
        expr: 2*sin(3*x)
    answer:
      matchTarget: true
    hints:
      - Compare how high the crests reach.
      - The dashed curve reaches 2.
    explanation: A = 2. The amplitude only sets the height, not the rhythm.

  - kind: problem
    id: c3
    widget: slider
    prompt: "Now the rhythm: set ω so your oscillation matches the dashed one."
    params:
      expr: 2*sin(w*x)
      x:
        - 0
        - 6
      y:
        - -3
        - 3
      sliders:
        - id: w
          label: Angular frequency ω
          min: 1
          max: 4
          step: 0.5
          initial: 1
      target:
        expr: 2*sin(2.5*x)
    answer:
      matchTarget: true
    hints:
      - Count the crests in the picture.
      - Larger ω, crests closer together.
    explanation: ω = 2.5. Double ω means twice as many oscillations in the same time.

  - kind: problem
    id: c4
    widget: numeric
    prompt: An oscillation has a frequency of {{f}} Hz. What is its angular frequency ω = 2π · f? To two decimals.
    params:
      unit: 1/s
    answer:
      value: "{{6.2832 * f}}"
      tolerance: 0.02
    feedback:
      - when: abs(numval(state.input) - 3.1416 * f) < 0.02
        misconception: half-turn
        text: A full turn is 2π, not π.
    hints:
      - 2π ≈ 6.283.
      - 6.283 · {{f}} = ?
    explanation: ω = 2π · {{f}} ≈ {{6.2832 * f}} per second. Per oscillation the circle shadow goes round once completely.
    variants:
      params:
        f: choice[0.5,1,2,5]
      defaults:
        f: 2

  - kind: explain
    id: d1
    depth: 2
    body: Whenever the restoring force is proportional to the displacement, $F = -k x$, a sine oscillation results. Such oscillations are called **harmonic**. Their rhythm then does not depend on the amplitude.

  - kind: problem
    id: d2
    depth: 2
    widget: buckets
    prompt: Is this motion (almost) harmonic?
    params:
      buckets:
        - id: b1
          label: harmonic
        - id: b2
          label: not harmonic
      items:
        - label: Mass on a spring
          bucket: b1
        - label: Pendulum with a small swing
          bucket: b1
        - label: Tuning fork
          bucket: b1
        - label: Bouncing ball
          bucket: b2
        - label: Pendulum swinging out 90°
          bucket: b2
        - label: Heartbeat
          bucket: b2
    hints:
      - "Harmonic means: restoring force proportional to displacement."
      - A bouncing ball feels the same force the whole time – wherever it is.
    explanation: Spring, small pendulum and tuning fork follow F = −kx. The ball falls under a constant force, the big pendulum leaves the approximation, and the heartbeat has a shape of its own.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Two identical pendulums swing. The second starts a quarter period later. By how many degrees is it out of phase?
    params:
      unit: °
    answer:
      value: 90
    feedback:
      - when: numval(state.input) == 25
        misconception: percent
        text: One period corresponds to 360°, not 100.
    hints:
      - "One whole period is a full turn: 360°."
      - A quarter of that?
    explanation: 360° ÷ 4 = 90°. When one pendulum is at its far end, the other is just passing the middle.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Newton gives the equation $m \ddot{x} = -k x$. Its solution is $x = A\sin(\omega t + \varphi)$ with $\omega = \sqrt{k/m}$. Differentiated twice, the sine returns itself with a minus – which is why it works as the **solution**.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A spring with k = 100 N/m carries 1 kg. How long does one oscillation take? T = 2π ÷ ω with ω = √(k/m). To two decimals.
    params:
      unit: s
    answer:
      value: 0.63
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 10) < 0.01
        misconception: omega-vs-period
        text: That is ω. The period is 2π ÷ ω.
    hints:
      - ω = √100 = 10 per second.
      - T = 6.28 ÷ 10.
    explanation: T ≈ 0.63 s. The lab in the previous lesson calculates exactly like this.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Atoms, bridges and molecules all swing like this. Why is it found almost everywhere?
    params:
      options:
        - label: Near any stable equilibrium the restoring force is, to a first approximation, proportional to the displacement.
          correct: true
        - label: Because everything is made of springs.
          feedback: There are no tiny springs. It is a mathematical property of small displacements.
        - label: Because sine curves are the prettiest.
          feedback: Nature does not choose by beauty. It follows from the shape of the force near equilibrium.
    hints:
      - Draw an energy valley. What does its bottom look like close up?
      - Every smooth valley looks like a parabola at the bottom.
    explanation: Near the bottom of any smooth energy valley a parabola fits, and parabolic energy means F = −kx. So for small disturbances almost everything oscillates harmonically.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what circular motion has to do with an oscillating spring.
    params:
      keywords:
        - - kreis
          - circle
          - rund
          - round
        - - schatten
          - shadow
          - seite
          - side
          - projekt
        - - sinus
          - sine
          - gleich
          - same
          - hin
          - back
      sample: If you look from the side at a point moving steadily round a circle, its shadow moves back and forth. That motion is a sine curve – exactly like a mass on a spring.
    difficulty: 3

srs:
  cards_from: ["c4", "d3", "x2"]
