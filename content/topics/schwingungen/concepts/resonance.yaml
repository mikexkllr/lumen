id: sci.oscillations.resonance
type: concept
title: "Resonanz"
summary: "Kleine Stöße im richtigen Takt – vom Schaukeln über das Radio bis zu tanzenden Brücken."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du schubst eine Schaukel nur ganz leicht. Wann geht sie trotzdem immer höher?
    params:
      options:
        - label: Wenn du immer im Takt ihrer eigenen Schwingung schubst.
          correct: true
        - label: Wenn du möglichst schnell hintereinander schubst.
          feedback: Zu schnelle Stöße treffen die Schaukel oft, wenn sie dir entgegenkommt – und bremsen.
        - label: Egal wie, Hauptsache oft.
          feedback: Der Takt ist alles. Falsch getimte Stöße heben sich auf.
    hints:
      - Wann bringt ein Stoß der Schaukel Energie?
      - Wenn du in ihre Bewegungsrichtung drückst.
    explanation: Im richtigen Takt kommt jeder kleine Stoß obendrauf. Das ist **Resonanz**.

  - kind: explain
    id: c1
    body: Jedes schwingfähige Ding hat eine **Eigenfrequenz**. Wird es genau in diesem Takt angestoßen, sammelt sich die Energie Stoß für Stoß. Die Schwingung schaukelt sich auf, bis Dämpfung oder Bruch sie stoppen.

  - kind: problem
    id: c2
    widget: sim
    prompt: Eine Spielplatzschaukel soll mit 0,35 Hz schwingen. Stell die Seillänge passend ein.
    params:
      scene: pendulum
    answer:
      frequency:
        - 0.34
        - 0.36
    explanation: Etwa 2 m. Genau so oft – gut einmal alle drei Sekunden – musst du schubsen. Längere Seile, langsamerer Takt.

  - kind: problem
    id: c3
    widget: choice
    prompt: Warum sollen Soldaten nicht im Gleichschritt über eine kleine Brücke marschieren?
    params:
      options:
        - label: Ihr Schritttakt könnte die Eigenfrequenz der Brücke treffen und sie aufschaukeln.
          correct: true
        - label: Weil sie zusammen zu schwer sind.
          feedback: Dasselbe Gewicht im ungeordneten Schritt ist kein Problem. Es geht um den Takt.
        - label: Weil der Lärm die Brücke schwächt.
          feedback: Nicht der Schall, sondern die rhythmischen Stöße der Füße sind das Problem.
    hints:
      - Viele Stöße, alle im selben Takt …
      - … wie beim Schaukeln.
    explanation: Hunderte Füße im Gleichtakt wirken wie ein riesiger Antrieb. Trifft er die Eigenfrequenz, wächst die Schwingung. 1831 brach so die Broughton-Brücke in England ein.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Eine Schaukel braucht 3 Sekunden für einmal hin und zurück. Wie oft pro Minute musst du sie anschubsen?
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 180
        misconception: multiply
        text: "Teilen, nicht malnehmen: 60 Sekunden durch 3 Sekunden."
    hints:
      - Einmal pro Schwingung schubsen.
      - "60 : 3 = ?"
    explanation: 20-mal pro Minute. Wer im Takt schubst, braucht nur wenig Kraft.

  - kind: explain
    id: d1
    depth: 2
    body: "Zeichnet man den Ausschlag über der Antriebsfrequenz, entsteht die **Resonanzkurve**: ein Berg bei der Eigenfrequenz. Je schwächer die Dämpfung, desto höher und schmaler ist er."

  - kind: problem
    id: d2
    depth: 2
    widget: sim
    prompt: Ein Radio empfängt einen Sender, wenn sein Schwingkreis in Resonanz ist. Stell Spule und Kondensator auf etwa 1000 Hz ein.
    params:
      scene: resonance
    answer:
      f0:
        - 950
        - 1050
    explanation: "Zum Beispiel L = 5 mH und C = 5 µF. Das Produkt L · C bestimmt den Takt: f₀ = 1 : (2π√(LC)). Beim Senderwechsel dreht man an C."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Die Millennium Bridge in London wackelte 2000 seitlich mit etwa 1 Hz. Menschen machen beim Gehen etwa 2 Schritte pro Sekunde. Wie passt das zusammen?
    params:
      options:
        - label: Seitlich schwankt der Körper nur einmal pro Schrittpaar – mit 1 Hz. Und die Leute passten sich dem Wackeln an.
          correct: true
        - label: Gar nicht, es war der Wind.
          feedback: Der Effekt trat nur mit vielen Fußgängern auf.
        - label: Die Brücke schwang doppelt so schnell wie die Schritte.
          feedback: "Umgekehrt: Sie schwang halb so schnell wie die Schrittfrequenz."
    hints:
      - Links, rechts – wann ist dein Körper wieder ganz links?
      - Wer auf schwankendem Boden geht, gleicht unbewusst aus.
    explanation: Der seitliche Druck wechselt mit halber Schrittfrequenz. Als die Brücke wackelte, gingen die Menschen breitbeinig im Takt – und verstärkten es. Dämpfer lösten das Problem.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: Die Spule ist fest bei 10 mH. Finde die Kapazität, mit der der Kreis bei etwa 500 Hz schwingt.
    params:
      scene: resonance
      controls:
        inductance:
          value: 10
          fixed: true
        capacitance:
          value: 40
    answer:
      f0:
        - 490
        - 515
    explanation: "C = 1 : (4π² f² L) ≈ 10 µF. Halbe Frequenz braucht die vierfache Kapazität – wieder steckt eine Wurzel in der Formel."
    difficulty: 3

  - kind: explain
    id: x2
    depth: 3
    body: Unterhalb der Resonanz schwingt ein System im Takt des Antriebs mit, weit darüber gegenläufig. Genau in Resonanz hinkt es um eine Viertelperiode hinterher. Bei dieser **Phasenverschiebung** von 90° überträgt der Antrieb am meisten Energie.

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: "1940 stürzte die Tacoma-Narrows-Brücke in den USA ein. Oft heißt es: »Resonanz mit Windböen«. Was geschah genauer?"
    params:
      options:
        - label: Gleichmäßiger Wind fachte über die Bewegung der Brücke selbst eine Drehschwingung an – Flattern.
          correct: true
        - label: Die Böen kamen zufällig genau im Takt der Brücke.
          feedback: Der Wind war ziemlich gleichmäßig. Die Brücke erzeugte ihren Takt selbst.
        - label: Ein Erdbeben brachte sie zum Schwingen.
          feedback: An dem Tag gab es kein Erdbeben, nur Wind um 65 km/h.
    hints:
      - Gab es einen Antrieb mit festem Takt?
      - Die Verdrehung änderte, wie der Wind auf die Fahrbahn traf.
    explanation: Jede Drehung lenkte den Wind so um, dass er die nächste Drehung verstärkte – eine selbsterregte Schwingung. Brückenbauer prüfen seitdem jedes Profil im Windkanal.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man eine schwere Schaukel mit ganz kleinen Stößen hoch bekommt.
    params:
      keywords:
        - - takt
          - rhythm
          - time
          - eigenfrequenz
          - natural frequency
          - frequenz
          - frequency
        - - energie
          - energy
          - sammel
          - build
          - add
          - dazu
        - - resonanz
          - resonance
          - aufschaukel
          - grow
          - höher
          - higher
      sample: Jeder kleine Stoß gibt der Schaukel ein bisschen Energie. Wenn ich genau im Takt ihrer Eigenfrequenz schubse, sammelt sich die Energie Stoß für Stoß an. Die Schaukel geht immer höher – das ist Resonanz.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "x1"]
