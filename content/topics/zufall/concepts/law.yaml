id: stats.prob.law
type: concept
title: Viele Versuche
summary: Auf lange Sicht pendelt sich der Zufall ein.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [prob.law]
estimated_minutes: 10
steps:
  - kind: explain
    id: s1
    body: |
      Wirf die Münze erst ein paarmal, dann 100-mal.
      Vergleiche den Strich (deine Häufigkeit) mit dem Balken (der Wahrscheinlichkeit).
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Kopf }, { label: Zahl }]

  - kind: problem
    id: annaeherung
    widget: choice
    prompt: Was passiert mit dem Anteil »Kopf«, wenn man sehr oft wirft?
    params:
      options:
        - { label: Er nähert sich 50 % an, correct: true }
        - { label: Er ist immer genau 50 %, feedback: "Nach 10 Würfen sind 7-mal Kopf ganz normal. Erst bei vielen Würfen kommt man nah an 50 %." }
        - { label: Er wird immer unvorhersehbarer, feedback: "Einzelwürfe bleiben zufällig – der Anteil wird aber stabiler." }
    hints:
      - Probiere es oben mit 100 Würfen aus.
    explanation: Bei vielen Versuchen liegt der Anteil nahe an der Wahrscheinlichkeit.

  - kind: explain
    id: s3
    body: |
      Das **Gesetz der großen Zahlen** – bei vielen Versuchen pendelt sich die relative Häufigkeit bei der Wahrscheinlichkeit ein.
      Bei wenigen Versuchen schwankt sie stark.

  - kind: problem
    id: gezinkt
    widget: distribution
    prompt: Dieser Würfel ist gezinkt. Wirf ihn mindestens 100-mal, um herauszufinden, welche Zahl bevorzugt ist.
    params:
      items: [{ label: "1", weight: 1 }, { label: "2", weight: 1 }, { label: "3", weight: 1 }, { label: "4", weight: 1 }, { label: "5", weight: 1 }, { label: "6", weight: 5 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Nutze »100× ziehen«.
    explanation: Bei vielen Würfen sieht man es deutlich – die 6 kommt etwa jedes zweite Mal.

  - kind: problem
    id: erwartung
    widget: numeric
    prompt: Ein fairer Würfel wird 600-mal geworfen. Wie oft erwartest du ungefähr eine 6?
    answer: { value: 100 }
    hints:
      - Die Chance ist 1/6.
    explanation: 600 · 1/6 = 100.

  - kind: problem
    id: gluecksrad
    widget: numeric
    prompt: Ein Glücksrad hat {{n}} gleich große Felder, {{k}} davon gewinnen. Wie oft gewinnst du ungefähr bei {{w}} Drehungen?
    answer: { value: "{{w * k / n}}" }
    hints:
      - "Die Gewinnchance ist {{k}}/{{n}}."
    explanation: "{{w}} · {{k}}/{{n}} = {{w * k / n}}."
    variants:
      params: { n: "choice[4,5,8,10]", k: "int[1,3]", w: "choice[40,80,100,200]" }
      constraints: ["isInt(w * k / n)", "k < n"]
      defaults: { n: 8, k: 2, w: 80 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Beim Roulette kam zehnmal hintereinander Rot. Was gilt für den elften Wurf?
    params:
      options:
        - label: Rot und Schwarz sind genauso wahrscheinlich wie immer
          correct: true
        - label: Schwarz ist jetzt »fällig«
          feedback: Die Kugel hat kein Gedächtnis.
        - label: Rot hat einen Lauf und kommt eher wieder
          feedback: Auch das ist ein Irrtum.
    hints:
      - Woher soll die Kugel wissen, was vorher war?
    explanation: Der **Spielerfehlschluss**. Das Gesetz der großen Zahlen gleicht nicht aus – es verdünnt nur.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: distribution
    prompt: Wirf die Münze in großen Schritten, bis du 1000 Würfe hast. Beobachte, wie nah der Anteil an 50 % rückt.
    params:
      items:
        - label: Kopf
        - label: Zahl
      sample:
        - 10
        - 100
        - 1000
    check:
      predicate: draws >= 1000
    hints:
      - Nutze den Knopf für 1000 Würfe.
      - Vergleiche Strich und Balken nach 10, 100 und 1000 Würfen.
    explanation: Nach 1000 Würfen weicht der Anteil meist nur ein bis drei Prozentpunkte von 50 % ab. Nach 10 Würfen sind 30 % oder 70 % normal.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "Nach vielen Würfen: Was wird kleiner?"
    params:
      options:
        - label: Die Abweichung des Anteils von 50 %
          correct: true
        - label: Der Abstand »Zahl der Köpfe minus Zahl der Zahlen«
          feedback: Dieser Abstand wächst typisch sogar – wie √n. Nur geteilt durch n wird er klein.
        - label: Die Chance auf Kopf beim nächsten Wurf
          feedback: Die bleibt immer 1/2.
    hints:
      - "Bei 100 Würfen sind 55 : 45 normal, bei 10 000 Würfen 5050 : 4950."
      - Vergleiche Abstand (10 bzw. 100) und Anteil (55 % bzw. 50,5 %).
    explanation: Der Abstand wächst wie √n, der Anteil schwankt wie 1/√n. Das **Gesetz der großen Zahlen** gleicht nicht aus – es verdünnt.
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: numeric
    prompt: "Faustregel: Der Kopf-Anteil schwankt typisch um 50/√n Prozentpunkte. Wie groß ist diese Schwankung bei {{n}} Würfen?"
    answer:
      value: "{{50 / sqrt(n)}}"
    hints:
      - Zieh die Wurzel aus {{n}}.
      - Teile 50 durch {{sqrt(n)}}.
    explanation: "50 : {{sqrt(n)}} = {{50 / sqrt(n)}} Prozentpunkte. Für viermal so viele Würfe halbiert sich die Schwankung."
    difficulty: 2
    variants:
      params:
        n: choice[25,100,400,625,2500,10000]
      defaults:
        n: 400

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die Schwankung des Anteils schrumpft mit 1/√n. Bei 100 Würfen schwankt der Kopf-Anteil um etwa ± 5 Prozentpunkte. Wie viele Würfe braucht man für ± 0,5 Prozentpunkte?
    answer:
      value: 10000
    hints:
      - Zehnmal genauer braucht 10² so viele Würfe.
    explanation: "100 · 100 = 10 000. Genauigkeit ist teuer: Sie wächst nur mit der Wurzel."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Die **Tschebyschow-Ungleichung** gilt für jede Verteilung: Weiter als k Standardabweichungen vom Mittelwert liegt höchstens der Anteil 1/k². Wie viel Prozent sind es höchstens bei k = 2?"
    answer:
      value: 25
    hints:
      - Rechne 1/k² für k = 2.
      - 1/4 sind wie viel Prozent?
    explanation: "Höchstens 25 %. Bei der Glockenkurve sind es nur 5 % – Tschebyschow ist grob, aber gilt immer. Daraus folgt das Gesetz der großen Zahlen: Die Streuung des Mittels σ/√n geht gegen null."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum das Gesetz der großen Zahlen nicht heißt, dass sich Glück und Pech ausgleichen.
    params:
      keywords:
        - - anteil
          - relativ
          - share
          - proportion
          - fraction
        - - gedächtnis
          - unabhängig
          - memory
          - independent
        - - verdünn
          - viele
          - dilut
          - many
          - wächst
          - grow
      sample: Die Münze hat kein Gedächtnis, jeder Wurf ist unabhängig. Ein Vorsprung von Kopf bleibt im Schnitt bestehen. Aber bei vielen Würfen wird er im Anteil verdünnt, darum geht der Anteil gegen 50 %.
    explanation: Nichts wird zurückgezahlt. Ein alter Überschuss wird nur von immer mehr neuen Würfen verdünnt.
    difficulty: 3

srs:
  cards_from: ["gluecksrad"]
