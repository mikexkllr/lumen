id: stats.prob.chance
type: concept
title: Chances as a fraction
summary: Favorable over possible outcomes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [prob.chance]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Chances you can touch
    body: Dice, raffles, weather apps – chances are everywhere. Each piece is one face of a die. Tap the faces you want to win with. The fraction below is your **chance**.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 6
        shape: hexagon

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many people must be in a room so that two of them share a birthday with more than a 50% chance?"
    params:
      min: 2
      max: 366
    answer:
      value: 23
      tolerance: 6
    explanation: Only 23. Our gut feeling for probabilities is often off – that is why calculating pays off.

  - kind: problem
    id: sechs-oder-eins
    widget: choice
    prompt: When rolling a die, which is more likely, a 6 or a 1?
    params:
      options:
        - { label: Equally likely, correct: true }
        - { label: The 6, feedback: "The 6 feels rarer because you often wait for it. But every side has the same chance." }
        - { label: The 1, feedback: "A fair die favors no side." }
    hints:
      - Does a fair die have a favorite side?
    explanation: Each side of a fair die has a chance of 1/6.

  - kind: explain
    id: s2
    body: |
      Try it out. Roll the die 10 or 100 times.
      The counts vary, but every number has the chance $\frac{1}{6}$.
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: "1" }, { label: "2" }, { label: "3" }, { label: "4" }, { label: "5" }, { label: "6" }]

  - kind: problem
    id: gerade
    widget: numeric
    prompt: What is the probability of rolling an even number?
    params: { placeholder: "e.g. 1/3" }
    answer: { value: "1/2" }
    hints:
      - Which numbers on the die are even?
      - 2, 4 and 6, three out of six.
    explanation: 3 of 6 outcomes are even. 3/6 = 1/2.

  - kind: explain
    id: s4
    body: |
      **Laplace rule:** if all outcomes are equally likely,
      $P = \frac{\text{favorable outcomes}}{\text{possible outcomes}}$.

  - kind: problem
    id: kugeln
    widget: numeric
    prompt: A bag holds {{r}} red and {{b}} blue balls. What is the probability of drawing a red one blindly?
    params: { placeholder: "e.g. 2/5" }
    answer: { value: "{{r}}/{{r + b}}" }
    feedback:
      - when: "approx(numval(state.input), r / b) && r != b"
        misconception: part-to-part
        text: You compared red with blue. Divide by all the balls.
    hints:
      - "There are {{r + b}} balls in total."
    explanation: "{{r}} favorable out of {{r + b}} possible, so {{r}}/{{r + b}}."
    variants:
      params: { r: "int[1,6]", b: "int[1,6]" }
      constraints: ["r != b"]
      defaults: { r: 3, b: 5 }

  - kind: problem
    id: muenze
    widget: choice
    body: A fair coin showed heads five times in a row.
    prompt: What is more likely on the sixth toss?
    params:
      options:
        - { label: Both equally, correct: true }
        - { label: "Tails, it is due now", feedback: "The coin has no memory. Every toss starts fresh." }
        - { label: "Heads, the streak continues", feedback: "A fair coin has no streaks in its mood. It stays 1/2." }
    hints:
      - Does the coin know what happened before?
    explanation: Every toss is independent. Heads and tails each have 1/2.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Each piece is one face of the die. Shade the chance of rolling more than 4.
    params:
      parts: 6
      shape: hexagon
    answer:
      fraction: 1/3
    hints:
      - Which numbers are greater than 4?
      - The 5 and the 6 – shade 2 of the 6 pieces.
    explanation: "Two favourable faces out of six: $\\frac{2}{6} = \\frac{1}{3}$."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You draw one card from a deck of 52. What is the probability of an ace **or** a heart? As a fraction.
    answer:
      value: 16/52
    feedback:
      - when: approx(numval(state.input), 17 / 52)
        misconception: double-count
        text: You counted the ace of hearts twice.
    hints:
      - 4 aces plus 13 hearts – but count the ace of hearts only once.
    explanation: 4 + 13 − 1 = 16. What satisfies both conditions must not be counted twice.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numberline
    prompt: Mark the probability of rolling a total of 7 with two dice.
    params:
      min: 0
      max: 1
      ticks: 12
      labels: fractions
    answer:
      value: 1/6
    hints:
      - There are 6 · 6 = 36 equally likely pairs.
      - "Count: 1+6, 2+5, 3+4, 4+3, 5+2, 6+1."
    explanation: 6 of the 36 pairs give 7 – that is 1/6 or 2/12.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Two dice give totals from 2 to 12 – 11 possible outcomes. Is P(total 12) = 1/11?
    params:
      options:
        - label: No – the totals are not equally likely; P(12) = 1/36
          correct: true
        - label: Laplace only works when all outcomes are equally likely.
          feedback: Laplace gilt nur, wenn alle Ergebnisse gleich wahrscheinlich sind.
        - label: A 12 only comes from 6 + 6.
          feedback: Die 12 entsteht nur aus 6 + 6.
    hints:
      - In how many ways can you get a 12, and in how many a 7?
      - Count the 36 pairs instead of the 11 totals.
    explanation: The Laplace rule needs equally likely outcomes. The 36 pairs are, the 11 totals are not. Only 6 + 6 gives 12, so 1/36.
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: numeric
    prompt: "Two dice: how likely is a total of {{s}}? As a fraction."
    answer:
      value: "{{6 - abs(s - 7)}}/36"
    hints:
      - Count all pairs (first die, second die) that add to {{s}}.
      - There are {{6 - abs(s - 7)}} pairs out of 36.
    explanation: "The number of pairs climbs up to 7 and falls after: {{6 - abs(s - 7)}} out of 36."
    difficulty: 2
    variants:
      params:
        s: int[2,12]
      constraints:
        - s != 7
      defaults:
        s: 9

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What does “probability 30%” actually mean? There are two main interpretations. Which fits a weather forecast?
    params:
      options:
        - label: On 30 of 100 days with exactly this weather situation it rains
          correct: true
        - label: It rains over 30% of the area
          feedback: A common misunderstanding.
        - label: It rains for 30% of the day
          feedback: That is not what is meant either.
    hints:
      - Imagine many days with the same starting conditions.
    explanation: "The **frequentist interpretation**. Besides it there is the Bayesian one: probability as degree of belief."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: P(A) = 0.5, P(B) = 0.4 and P(A and B) = 0.2. What is P(A or B)?
    answer:
      value: 0.7
    feedback:
      - when: numval(state.input) == 0.9
        misconception: double-count
        text: You counted the part »A and B« twice.
    hints:
      - Whatever lies in both is in P(A) and in P(B).
      - Compute 0.5 + 0.4 − 0.2.
    explanation: P(A or B) = P(A) + P(B) − P(A and B) = 0.7. The overlap is subtracted once.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: In modern mathematics probability is fixed by three axioms (Kolmogorov, 1933). Which rule is NOT one of them?
    params:
      options:
        - label: All outcomes are equally likely
          correct: true
        - label: That is the first axiom.
          feedback: Das ist das erste Axiom.
        - label: That is the second axiom.
          feedback: Das ist das zweite Axiom.
        - label: That is the third axiom.
          feedback: Das ist das dritte Axiom.
    hints:
      - A loaded die is still a random experiment.
      - Which rule would be wrong for a loaded die?
    explanation: Equally likely is only a special case (Laplace). The axioms also cover loaded dice, weather and stocks.
    difficulty: 3

srs:
  cards_from: ["kugeln"]
