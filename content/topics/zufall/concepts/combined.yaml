id: stats.prob.combined
type: concept
title: Zwei Ereignisse
summary: Unabhängige Wahrscheinlichkeiten werden multipliziert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [prob.combined]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Sechs mal sechs
    body: Beim Brettspiel ergeben zwei Würfel 36 mögliche **Paare** – jedes Feld ist eins. Die Zeile ist der erste Wurf, die Spalte der zweite. Tippe das Feld für eine Doppel-Sechs an. Wie klein ist dieses Stück?
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 36
        shape: square

  - kind: problem
    id: zweimal-kopf
    widget: numeric
    prompt: Du wirfst zwei Münzen. Wie groß ist die Wahrscheinlichkeit für zweimal Kopf?
    params: { placeholder: "z. B. 1/3" }
    answer: { value: "1/4" }
    feedback:
      - when: "approx(numval(state.input), 1 / 2)"
        misconception: single-event
        text: Für zweimal Kopf müssen beide Würfe klappen – die Hälfte von der Hälfte.
    hints:
      - Schreib alle Möglichkeiten auf – KK, KZ, ZK, ZZ.
    explanation: 1 von 4 gleich wahrscheinlichen Ergebnissen.

  - kind: explain
    id: s2
    body: |
      Hängen zwei **Würfe** nicht voneinander ab, nimmst du die Chancen **mal**:
      $P(\text{Kopf, Kopf}) = \frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}$.

  - kind: problem
    id: pasch
    widget: numeric
    prompt: Zwei Würfel – wie groß ist die Wahrscheinlichkeit für einen Pasch, also zwei gleiche Zahlen?
    params: { placeholder: "z. B. 1/3" }
    answer: { value: "1/6" }
    feedback:
      - when: "approx(numval(state.input), 1 / 36)"
        text: 1/36 ist die Chance für einen bestimmten Pasch, etwa zwei Sechsen. Es gibt aber sechs verschiedene.
    hints:
      - Es gibt 36 Kombinationen.
      - Sechs davon sind Paschs.
    explanation: 6 von 36 = 1/6.
    difficulty: 2

  - kind: problem
    id: augensumme
    widget: choice
    prompt: Welche Augensumme ist mit zwei Würfeln am wahrscheinlichsten?
    params:
      layout: grid
      options:
        - { label: "7", correct: true }
        - { label: "12", feedback: "12 geht nur mit 6 + 6 – eine einzige Kombination." }
        - { label: "2", feedback: "2 geht nur mit 1 + 1." }
        - { label: Alle gleich, feedback: "Zähle die Kombinationen – für 7 gibt es sechs, für 12 nur eine." }
    hints:
      - Für welche Summe gibt es die meisten Kombinationen?
    explanation: 7 entsteht auf sechs Arten (1+6, 2+5, … 6+1).

  - kind: problem
    id: urne
    widget: numeric
    prompt: Eine Urne enthält {{r}} rote und {{b}} blaue Kugeln. Du ziehst zweimal mit Zurücklegen. Wie groß ist P(zweimal rot)?
    params: { placeholder: "z. B. 4/25" }
    answer: { value: "{{r * r}}/{{(r + b) * (r + b)}}" }
    feedback:
      - when: "approx(numval(state.input), 2 * r / (r + b))"
        misconception: add-instead-of-multiply
        text: Für »und« wird multipliziert, nicht addiert.
    hints:
      - "P(rot) = {{r}}/{{r + b}}."
      - Zweimal hintereinander – malnehmen.
    explanation: "{{r}}/{{r + b}} · {{r}}/{{r + b}} = {{r * r}}/{{(r + b) * (r + b)}}."
    difficulty: 2
    variants:
      params: { r: "int[1,4]", b: "int[1,4]" }
      defaults: { r: 2, b: 3 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Zwei Würfe mit demselben Würfel
          right: true
        - text: Zwei Karten ziehen ohne Zurücklegen
          right: false
        - text: Münzwurf heute und Münzwurf morgen
          right: true
        - text: Regen heute und Regen morgen
          right: false
          why: Wetter hängt von Tag zu Tag zusammen.
      left: Abhängig
      right: Unabhängig

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Das Raster zeigt alle 36 Paare zweier Würfel. Färbe so viele Felder, wie es Paare mit der Augensumme 4 gibt.
    params:
      parts: 36
      shape: square
    answer:
      fraction: 1/12
    hints:
      - Welche Paare ergeben 4? Erster und zweiter Würfel zählen getrennt.
      - 1 + 3, 2 + 2 und 3 + 1 – das sind 3 Felder.
    explanation: "Drei von 36 Paaren: $\\frac{3}{36} = \\frac{1}{12}$. Dass 1 + 3 und 3 + 1 verschieden sind, vergisst man leicht."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einer Urne sind 3 rote und 2 blaue Kugeln. Du ziehst zweimal **ohne** Zurücklegen. Wie groß ist P(beide rot)? Als Bruch.
    answer:
      value: 3/10
    hints:
      - Erst 3/5, dann sind noch 2 von 4 rot.
    explanation: 3/5 · 2/4 = 6/20 = 3/10. Der zweite Zug hängt vom ersten ab.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Du würfelst dreimal. Wie wahrscheinlich ist es, dass **keine** 6 kommt? Als Bruch.
    answer:
      value: 125/216
    hints:
      - Pro Wurf ist »keine 6« zu 5/6 wahrscheinlich.
      - "Multipliziere: 5/6 · 5/6 · 5/6."
    explanation: (5/6)³ = 125/216 ≈ 58 %. Die Würfe sind unabhängig, also wird multipliziert.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Ein Würfel wird einmal geworfen. A = »gerade Zahl«, B = »Zahl kleiner als 3«. Wie groß ist P(A und B)?
    params:
      options:
        - label: 1/6 – nur die 2 erfüllt beides
          correct: true
        - label: 1/2
          feedback: Das ist nur P(A) – die Zahlen 2, 4 und 6.
        - label: 2/3
          feedback: Das ist P(A oder B) – die Zahlen 1, 2, 4 und 6.
    hints:
      - Welche Zahlen sind gerade **und** kleiner als 3?
      - Nur eine Zahl passt.
    explanation: Nur die 2 – also 1/6. Zählen geht immer; die Mal-Regel gilt nur bei Unabhängigkeit.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein System hat 3 Bauteile, jedes fällt mit 10 % Wahrscheinlichkeit aus – unabhängig voneinander. Das System läuft nur, wenn **alle** funktionieren. Wie groß ist die Ausfallwahrscheinlichkeit in Prozent?
    params:
      unit: "%"
    answer:
      value: 27.1
      tolerance: 0.1
    hints:
      - "Alle funktionieren: 0,9³."
    explanation: 1 − 0,729 = 27,1 %. Je mehr Teile in Reihe, desto fragiler – darum baut man Redundanz ein.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Du wirfst eine Münze viermal. Wie wahrscheinlich ist **genau** zweimal Kopf? Als Bruch.
    answer:
      value: 3/8
    feedback:
      - when: numval(state.input) == 1 / 16
        misconception: one-order
        text: Das ist eine bestimmte Reihenfolge, etwa KKZZ. Es gibt aber mehrere.
    hints:
      - Jede Reihenfolge wie KKZZ hat die Chance 1/16.
      - "Zähle die Reihenfolgen: 4 über 2 = 6."
    explanation: "6 Reihenfolgen · 1/16 = 6/16 = 3/8. Das ist die **Binomialverteilung**: (n über k) · pᵏ · (1 − p)ⁿ⁻ᵏ."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "Der Chevalier de Méré wettete 1654: Mit 24 Würfen zweier Würfel kommt mindestens ein Doppel-Sechs. Wie wahrscheinlich ist das? In Prozent, auf eine Stelle. ((35/36)²⁴ ≈ 0,5086)"
    answer:
      value: 49.1
      tolerance: 0.15
    hints:
      - "Rechne über das Gegenteil: keine Doppel-Sechs in 24 Würfen."
      - 1 − 0,5086 = ?
    explanation: 1 − 0,5086 ≈ 49,1 %. Knapp unter 50 % – de Méré verlor auf Dauer. Pascal und Fermat lösten das Rätsel in Briefen. Das war ein Anfang der Wahrscheinlichkeitsrechnung.
    difficulty: 3

srs:
  cards_from: ["urne"]
