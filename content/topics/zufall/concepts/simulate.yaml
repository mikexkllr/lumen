id: stats.prob.simulate
type: concept
title: Simulieren statt rechnen
summary: Wenn Rechnen schwer ist, probier es aus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    id: s1
    body: |
      Manche Chancen sind schwer zu rechnen. Dann **simuliert** man – man spielt das Experiment tausendmal am Computer.
      Probier es mit einer gezinkten Münze, die zu 70 % Kopf zeigt.
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Kopf, weight: 7 }, { label: Zahl, weight: 3 }]
        sample: [10, 100, 1000]

  - kind: problem
    id: viel
    widget: choice
    prompt: Warum braucht eine Simulation viele Durchläufe?
    params:
      options:
        - { label: Bei wenigen Würfen schwankt das Ergebnis stark., correct: true }
        - { label: Der Computer wird sonst nicht warm., feedback: "Es geht um das Gesetz der großen Zahlen." }
        - { label: Bei vielen Würfen ändert sich die Chance., feedback: "Die Chance bleibt gleich – nur die Messung wird genauer." }
    hints:
      - Denk an zehn Münzwürfe.
    explanation: Erst viele Durchläufe pendeln sich nahe der wahren Chance ein.

  - kind: problem
    id: schaetzen
    widget: numeric
    prompt: Eine Simulation zeigt in {{n}} Durchläufen {{k}} Treffer. Wie hoch ist die geschätzte Chance in Prozent?
    params: { unit: "%" }
    answer: { value: "{{100 * k / n}}" }
    hints:
      - "Treffer durch Durchläufe."
    explanation: "{{k}} : {{n}} = {{100 * k / n}} %."
    variants:
      params: { n: "choice[200,500,1000]", p: "choice[12,25,40,64]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 500, p: 40 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Man wirft zufällig Punkte in ein Quadrat mit eingezeichnetem Viertelkreis. 785 von 1000 landen im Kreis. Was schätzt man damit?
    params:
      options:
        - label: π – denn der Anteil ist π/4
          correct: true
        - label: Die Wurzel aus 2
          feedback: Die Diagonale spielt hier keine Rolle.
        - label: Nichts – das ist nur Zufall
          feedback: Der Anteil nähert sich einem festen Wert.
    hints:
      - Fläche des Viertelkreises geteilt durch Fläche des Quadrats.
    explanation: 4 · 0,785 = 3,14. Die **Monte-Carlo-Methode** berechnet mit Zufall, was sonst schwer zu rechnen ist.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux das Gesetz der großen Zahlen – und einen typischen Irrtum dazu.
    params:
      keywords:
        - - viele
          - oft
          - large
          - many
          - often
        - - häufigkeit
          - anteil
          - frequency
          - share
          - proportion
          - durchschnitt
          - average
        - - nähert
          - pendelt
          - approach
          - converge
          - settle
        - - gedächtnis
          - ausgleich
          - fällig
          - memory
          - due
          - compensat
          - unabhängig
          - independent
      min: 3
      sample: "Bei sehr vielen Versuchen nähert sich die relative Häufigkeit der Wahrscheinlichkeit. Der Irrtum: Der Zufall hat kein Gedächtnis, er gleicht frühere Würfe nicht aus – jeder Wurf bleibt unabhängig."
    difficulty: 3

srs:
  cards_from: [viel, schaetzen]
