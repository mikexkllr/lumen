id: stats.prob.law
type: concept
title: Many trials
summary: In the long run, chance settles down.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [prob.law]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: In the long run
    body: A single throw is pure luck. Yet casinos and insurers firmly count on chance. Uncover the cards in any order. What do they know about **many trials**?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎰
            front: The casino
            back: One player can win tonight. But over millions of bets, the casino earns almost exactly its share.
          - icon: 🚗
            front: The insurer
            back: Nobody knows who will crash tomorrow. The insurer knows quite well how many crashes there will be next year.
          - icon: 🌦️
            front: The weather app
            back: '"30 % rain" means: on many days with exactly this forecast, it rains on about 3 in 10.'

  - kind: explain
    id: s1
    body: |
      Toss the coin a few times first, then 100 times.
      Compare the line (your frequency) with the bar (the probability).
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Heads }, { label: Tails }]

  - kind: problem
    id: annaeherung
    widget: choice
    prompt: What happens to the share of “heads” when you toss very often?
    params:
      options:
        - { label: It approaches 50%, correct: true }
        - { label: It is always exactly 50%, feedback: "After 10 tosses, 7 heads is quite normal. Only with many tosses do you get close to 50%." }
        - { label: It becomes more and more unpredictable, feedback: "Single tosses stay random, but the share becomes more stable." }
    hints:
      - Try it above with 100 tosses.
    explanation: With many trials, the share is close to the probability.

  - kind: explain
    id: s3
    body: |
      The **law of large numbers**: with many trials, the relative frequency settles near the probability.
      With few trials, it swings widely.

  - kind: problem
    id: gezinkt
    widget: distribution
    prompt: This die is loaded. Roll it at least 100 times to find out which number is favored.
    params:
      items: [{ label: "1", weight: 1 }, { label: "2", weight: 1 }, { label: "3", weight: 1 }, { label: "4", weight: 1 }, { label: "5", weight: 1 }, { label: "6", weight: 5 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Use the »Draw 100×« button.
    explanation: With many rolls it is clear. The 6 comes up about every other time.

  - kind: problem
    id: erwartung
    widget: numeric
    prompt: A fair die is rolled 600 times. About how often do you expect a 6?
    answer: { value: 100 }
    hints:
      - The chance is 1/6.
    explanation: 600 · 1/6 = 100.

  - kind: problem
    id: gluecksrad
    widget: numeric
    prompt: A spinner has {{n}} equal sections, and {{k}} of them win. About how often do you win in {{w}} spins?
    answer: { value: "{{w * k / n}}" }
    hints:
      - "The chance of winning is {{k}}/{{n}}."
    explanation: "{{w}} · {{k}}/{{n}} = {{w * k / n}}."
    variants:
      params: { n: "choice[4,5,8,10]", k: "int[1,3]", w: "choice[40,80,100,200]" }
      constraints: ["isInt(w * k / n)", "k < n"]
      defaults: { n: 8, k: 2, w: 80 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: At roulette red came ten times in a row. What holds for the eleventh spin?
    params:
      options:
        - label: Red and black are exactly as likely as always
          correct: true
        - label: Black is now “due”
          feedback: The ball has no memory.
        - label: Red is on a run and more likely to come again
          feedback: That is a fallacy too.
    hints:
      - How should the ball know what came before?
    explanation: The **gambler’s fallacy**. The law of large numbers does not compensate – it only dilutes.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: distribution
    prompt: Flip the coin in big batches until you reach 1000 flips. Watch how close the share gets to 50 %.
    params:
      items:
        - label: Heads
        - label: Tails
      sample:
        - 10
        - 100
        - 1000
    check:
      predicate: draws >= 1000
    hints:
      - Use the button for 1000 flips.
      - Compare the line and the bar after 10, 100 and 1000 flips.
    explanation: After 1000 flips the share is usually only one to three points off 50 %. After 10 flips 30 % or 70 % are normal.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "After many flips: what gets smaller?"
    params:
      options:
        - label: How far the share is from 50 %
          correct: true
        - label: This gap typically even grows – like √n. Only divided by n does it shrink.
          feedback: Dieser Abstand wächst typisch sogar – wie √n. Nur geteilt durch n wird er klein.
        - label: That always stays 1/2.
          feedback: Die bleibt immer 1/2.
    hints:
      - "At 100 flips 55 : 45 is normal, at 10,000 flips 5050 : 4950."
      - Compare the gap (10 vs 100) and the share (55 % vs 50.5 %).
    explanation: The gap grows like √n, the share wobbles like 1/√n. The law of large numbers does not even out – it dilutes.
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: numeric
    prompt: "Rule of thumb: the share of heads typically wobbles by 50/√n percentage points. How big is this wobble for {{n}} flips?"
    answer:
      value: "{{50 / sqrt(n)}}"
    hints:
      - Take the square root of {{n}}.
      - Divide 50 by {{sqrt(n)}}.
    explanation: 50 ÷ {{sqrt(n)}} = {{50 / sqrt(n)}} percentage points. Four times as many flips halve the wobble.
    difficulty: 2
    variants:
      params:
        n: choice[25,100,400,625,2500,10000]
      defaults:
        n: 400

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The fluctuation of the share shrinks with 1/√n. With 100 tosses the share of heads fluctuates by about ± 5 percentage points. How many tosses are needed for ± 0.5 percentage points?
    answer:
      value: 10000
    hints:
      - Ten times more precise needs 10² as many tosses.
    explanation: "100 · 100 = 10,000. Precision is expensive: it grows only with the square root."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Chebyshev's inequality holds for every distribution: at most the share 1/k² lies further than k standard deviations from the mean. At most what percent is that for k = 2?"
    answer:
      value: 25
    hints:
      - Compute 1/k² for k = 2.
      - 1/4 is what percent?
    explanation: "At most 25 %. For the bell curve it is only 5 % – Chebyshev is crude but always true. The law of large numbers follows from it: the spread of the mean, σ/√n, goes to zero."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why the law of large numbers does not mean that good and bad luck even out.
    params:
      keywords:
        - - anteil
          - relativ
          - share
          - proportion
          - fraction
        - - gedächtnis
          - unabhängig
          - memory
          - independent
        - - verdünn
          - viele
          - dilut
          - many
          - wächst
          - grow
      sample: The coin has no memory; every flip is independent. A lead of heads stays on average. But over many flips it gets diluted in the share, so the share tends to 50 %.
    explanation: Nothing gets paid back. An old surplus just gets diluted by ever more new flips.
    difficulty: 3

srs:
  cards_from: ["gluecksrad"]
