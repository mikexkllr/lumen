id: stats.prob.law
type: concept
title: Many trials
summary: In the long run, chance settles down.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [prob.law]
estimated_minutes: 7
steps:
  - kind: explain
    body: |
      Toss the coin a few times first, then 100 times.
      Compare the line (your frequency) with the bar (the probability).
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Heads }, { label: Tails }]

  - kind: problem
    id: annaeherung
    widget: choice
    prompt: What happens to the share of “heads” when you toss very often?
    params:
      options:
        - { label: It approaches 50%, correct: true }
        - { label: It is always exactly 50%, feedback: "After 10 tosses, 7 heads is quite normal. Only with many tosses do you get close to 50%." }
        - { label: It becomes more and more unpredictable, feedback: "Single tosses stay random, but the share becomes more stable." }
    hints:
      - Try it above with 100 tosses.
    explanation: With many trials, the share is close to the probability.

  - kind: explain
    body: |
      The **law of large numbers**: with many trials, the relative frequency settles near the probability.
      With few trials, it swings widely.

  - kind: problem
    id: gezinkt
    widget: distribution
    prompt: This die is loaded. Roll it at least 100 times to find out which number is favored.
    params:
      items: [{ label: "1", weight: 1 }, { label: "2", weight: 1 }, { label: "3", weight: 1 }, { label: "4", weight: 1 }, { label: "5", weight: 1 }, { label: "6", weight: 5 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Use the »Draw 100×« button.
    explanation: With many rolls it is clear. The 6 comes up about every other time.

  - kind: problem
    id: erwartung
    widget: numeric
    prompt: A fair die is rolled 600 times. About how often do you expect a 6?
    answer: { value: 100 }
    hints:
      - The chance is 1/6.
    explanation: 600 · 1/6 = 100.

  - kind: problem
    id: gluecksrad
    widget: numeric
    prompt: A spinner has {{n}} equal sections, and {{k}} of them win. About how often do you win in {{w}} spins?
    answer: { value: "{{w * k / n}}" }
    hints:
      - "The chance of winning is {{k}}/{{n}}."
    explanation: "{{w}} · {{k}}/{{n}} = {{w * k / n}}."
    variants:
      params: { n: "choice[4,5,8,10]", k: "int[1,3]", w: "choice[40,80,100,200]" }
      constraints: ["isInt(w * k / n)", "k < n"]
      defaults: { n: 8, k: 2, w: 80 }

srs:
  cards_from: ["steps[5]"]
