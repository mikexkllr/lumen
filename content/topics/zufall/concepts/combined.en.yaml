id: stats.prob.combined
type: concept
title: Two events
summary: Independent probabilities are multiplied.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [prob.combined]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Six times six
    body: In board games, two dice give 36 possible **pairs** – each square is one. The row is the first throw, the column the second. Tap the square for a double six. How small is that piece?
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 36
        shape: square

  - kind: problem
    id: zweimal-kopf
    widget: numeric
    prompt: You toss two coins. What is the probability of two heads?
    params: { placeholder: "e.g. 1/3" }
    answer: { value: "1/4" }
    feedback:
      - when: "approx(numval(state.input), 1 / 2)"
        misconception: single-event
        text: For two heads, both tosses must work out. That is half of a half.
    hints:
      - Write down all possibilities, HH, HT, TH, TT.
    explanation: 1 of 4 equally likely outcomes.

  - kind: explain
    id: s2
    body: |
      If two **tosses** do not depend on each other, you **multiply** the chances:
      $P(\text{heads, heads}) = \frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}$.

  - kind: problem
    id: pasch
    widget: numeric
    prompt: Two dice. What is the probability of doubles, two equal numbers?
    params: { placeholder: "e.g. 1/3" }
    answer: { value: "1/6" }
    feedback:
      - when: "approx(numval(state.input), 1 / 36)"
        text: 1/36 is the chance of one specific double, such as two sixes. But there are six different ones.
    hints:
      - There are 36 combinations.
      - Six of them are doubles.
    explanation: 6 of 36 = 1/6.
    difficulty: 2

  - kind: problem
    id: augensumme
    widget: choice
    prompt: Which sum is most likely with two dice?
    params:
      layout: grid
      options:
        - { label: "7", correct: true }
        - { label: "12", feedback: "12 only works with 6 + 6, a single combination." }
        - { label: "2", feedback: "2 only works with 1 + 1." }
        - { label: All equal, feedback: "Count the combinations. There are six for 7 but only one for 12." }
    hints:
      - Which sum has the most combinations?
    explanation: 7 can be made in six ways (1+6, 2+5, … 6+1).

  - kind: problem
    id: urne
    widget: numeric
    prompt: An urn holds {{r}} red and {{b}} blue balls. You draw twice with replacement. What is P(red twice)?
    params: { placeholder: "e.g. 4/25" }
    answer: { value: "{{r * r}}/{{(r + b) * (r + b)}}" }
    feedback:
      - when: "approx(numval(state.input), 2 * r / (r + b))"
        misconception: add-instead-of-multiply
        text: For “and”, you multiply. You do not add.
    hints:
      - "P(red) = {{r}}/{{r + b}}."
      - Twice in a row means multiply.
    explanation: "{{r}}/{{r + b}} · {{r}}/{{r + b}} = {{r * r}}/{{(r + b) * (r + b)}}."
    difficulty: 2
    variants:
      params: { r: "int[1,4]", b: "int[1,4]" }
      defaults: { r: 2, b: 3 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Two throws of the same die
          right: true
        - text: Drawing two cards without replacement
          right: false
        - text: A coin toss today and one tomorrow
          right: true
        - text: Rain today and rain tomorrow
          right: false
          why: Weather is linked from day to day.
      left: Dependent
      right: Independent

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: The grid shows all 36 pairs of two dice. Shade as many squares as there are pairs that add up to 4.
    params:
      parts: 36
      shape: square
    answer:
      fraction: 1/12
    hints:
      - Which pairs add up to 4? The first and second die count separately.
      - 1 + 3, 2 + 2 and 3 + 1 – that makes 3 squares.
    explanation: "Three of 36 pairs: $\\frac{3}{36} = \\frac{1}{12}$. It is easy to forget that 1 + 3 and 3 + 1 are different."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An urn holds 3 red and 2 blue balls. You draw twice **without** replacement. What is P(both red)? As a fraction.
    answer:
      value: 3/10
    hints:
      - First 3/5, then 2 of 4 are still red.
    explanation: 3/5 · 2/4 = 6/20 = 3/10. The second draw depends on the first.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: You roll a die three times. How likely is it that no 6 comes up? As a fraction.
    answer:
      value: 125/216
    hints:
      - Each roll is »no 6« with probability 5/6.
      - "Multiply: 5/6 · 5/6 · 5/6."
    explanation: (5/6)³ = 125/216 ≈ 58 %. The rolls are independent, so we multiply.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A die is rolled once. A = »even number«, B = »number below 3«. What is P(A and B)?
    params:
      options:
        - label: 1/6 – only the 2 fits both
          correct: true
        - label: That is just P(A) – the numbers 2, 4 and 6.
          feedback: Das ist nur P(A) – die Zahlen 2, 4 und 6.
        - label: That is P(A or B) – the numbers 1, 2, 4 and 6.
          feedback: Das ist P(A oder B) – die Zahlen 1, 2, 4 und 6.
    hints:
      - Which numbers are even and below 3?
      - Only one number fits.
    explanation: Only the 2 – so 1/6. Counting always works; the multiplication rule only holds under independence.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A system has 3 components, each failing with 10% probability – independently. The system runs only if **all** work. What is the failure probability in percent?
    params:
      unit: "%"
    answer:
      value: 27.1
      tolerance: 0.1
    hints:
      - "All work: 0.9³."
    explanation: 1 − 0.729 = 27.1%. The more parts in series, the more fragile – that is why redundancy is built in.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: You flip a coin four times. How likely is exactly two heads? As a fraction.
    answer:
      value: 3/8
    feedback:
      - when: numval(state.input) == 1 / 16
        misconception: one-order
        text: That is one particular order, like HHTT. But there are several.
    hints:
      - Each order such as HHTT has probability 1/16.
      - "Count the orders: 4 choose 2 = 6."
    explanation: "6 orders · 1/16 = 6/16 = 3/8. That is the binomial distribution: (n choose k) · pᵏ · (1 − p)ⁿ⁻ᵏ."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "The Chevalier de Méré bet in 1654: in 24 rolls of two dice at least one double six appears. How likely is that? In percent, to one decimal. ((35/36)²⁴ ≈ 0.5086)"
    answer:
      value: 49.1
      tolerance: 0.15
    hints:
      - "Use the complement: no double six in 24 rolls."
      - 1 − 0.5086 = ?
    explanation: 1 − 0.5086 ≈ 49.1 %. Just under 50 % – de Méré lost in the long run. Pascal and Fermat solved it in letters, one of the starts of probability theory.
    difficulty: 3

srs:
  cards_from: ["urne"]
