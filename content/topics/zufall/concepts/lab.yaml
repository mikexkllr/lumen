id: stats.prob.lab
type: concept
title: Würfel-Labor
summary: Würfeln, färben, einordnen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wuerfeln
    widget: distribution
    prompt: Wirf den Würfel mindestens 60-mal und beobachte, wie sich die Häufigkeiten angleichen.
    params:
      items: [{ label: "1", weight: 1 }, { label: "2", weight: 1 }, { label: "3", weight: 1 }, { label: "4", weight: 1 }, { label: "5", weight: 1 }, { label: "6", weight: 1 }]
    check: { predicate: "draws >= 60" }
    hints:
      - Nutze die Schaltfläche für viele Würfe auf einmal.
    explanation: Je mehr Würfe, desto näher liegen alle Säulen bei einem Sechstel.

  - kind: problem
    id: sechs
    widget: numberline
    prompt: Markiere die Wahrscheinlichkeit für eine Sechs.
    params: { min: 0, max: 1, ticks: 6, labels: fractions }
    answer: { value: "1/6" }
    hints:
      - Eine von sechs Seiten.
    explanation: 1/6 – etwa 17 %.

  - kind: problem
    id: gerade
    widget: fraction
    prompt: Färbe die Wahrscheinlichkeit, eine gerade Zahl zu würfeln.
    params: { parts: 6 }
    answer: { fraction: "3/6" }
    hints:
      - 2, 4 und 6.
    explanation: 3/6 = 1/2 – genau die Hälfte.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Unmöglich, möglich oder sicher?
    params:
      buckets: [{ label: unmöglich }, { label: möglich }, { label: sicher }]
      items:
        - { label: Der Würfel zeigt eine 7, bucket: unmöglich }
        - { label: Der Würfel zeigt eine 6, bucket: möglich }
        - { label: Die Münze zeigt Kopf, bucket: möglich }
        - { label: Der Würfel zeigt höchstens 6, bucket: sicher }
    hints:
      - Wahrscheinlichkeit 0, dazwischen oder 1?
    explanation: Unmöglich ist 0, sicher ist 1 – alles andere liegt dazwischen.

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Zwei Würfel: Wie groß ist die Wahrscheinlichkeit, dass ihr **Produkt** gerade ist? Als Bruch."
    answer:
      value: 3/4
    hints:
      - Das Produkt ist nur ungerade, wenn beide ungerade sind.
    explanation: 1 − 1/2 · 1/2 = 3/4. Über das Gegenteil geht es am schnellsten.
    difficulty: 3

srs:
  cards_from: [sechs, gerade]
