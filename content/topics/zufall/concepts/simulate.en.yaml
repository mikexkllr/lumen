id: stats.prob.simulate
type: concept
title: Simulate instead of calculate
summary: If the math is hard, try it out.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Some chances are hard to calculate. Then you **simulate**: you play the experiment a thousand times on a computer.
      Try it with a loaded coin that shows heads 70% of the time.
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Heads, weight: 7 }, { label: Tails, weight: 3 }]
        sample: [10, 100, 1000]

  - kind: problem
    id: viel
    widget: choice
    prompt: Why does a simulation need many runs?
    params:
      options:
        - { label: "With few tosses, the result swings widely.", correct: true }
        - { label: The computer would not warm up otherwise., feedback: "It is about the law of large numbers." }
        - { label: "With many tosses, the chance changes.", feedback: "The chance stays the same. Only the measurement gets more accurate." }
    hints:
      - Think of ten coin tosses.
    explanation: Only many runs settle near the true chance.

  - kind: problem
    id: schaetzen
    widget: numeric
    prompt: A simulation shows {{k}} hits in {{n}} runs. What is the estimated chance in percent?
    params: { unit: "%" }
    answer: { value: "{{100 * k / n}}" }
    hints:
      - "Hits divided by runs."
    explanation: "{{k}} ÷ {{n}} = {{100 * k / n}}%."
    variants:
      params: { n: "choice[200,500,1000]", p: "choice[12,25,40,64]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 500, p: 40 }

srs:
  cards_from: [viel, schaetzen]
