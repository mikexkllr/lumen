id: stats.prob.simulate
type: concept
title: Simulate instead of calculate
summary: If the math is hard, try it out.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: explain
    id: s1
    body: |
      Some chances are hard to calculate. Then you **simulate**: you play the experiment a thousand times on a computer.
      Try it with a loaded coin that shows heads 70% of the time.
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Heads, weight: 7 }, { label: Tails, weight: 3 }]
        sample: [10, 100, 1000]

  - kind: problem
    id: viel
    widget: choice
    prompt: Why does a simulation need many runs?
    params:
      options:
        - { label: "With few tosses, the result swings widely.", correct: true }
        - { label: The computer would not warm up otherwise., feedback: "It is about the law of large numbers." }
        - { label: "With many tosses, the chance changes.", feedback: "The chance stays the same. Only the measurement gets more accurate." }
    hints:
      - Think of ten coin tosses.
    explanation: Only many runs settle near the true chance.

  - kind: problem
    id: schaetzen
    widget: numeric
    prompt: A simulation shows {{k}} hits in {{n}} runs. What is the estimated chance in percent?
    params: { unit: "%" }
    answer: { value: "{{100 * k / n}}" }
    hints:
      - "Hits divided by runs."
    explanation: "{{k}} ÷ {{n}} = {{100 * k / n}}%."
    variants:
      params: { n: "choice[200,500,1000]", p: "choice[12,25,40,64]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 500, p: 40 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Points are thrown at random into a square with a quarter circle drawn in it. 785 of 1000 land in the circle. What does that estimate?
    params:
      options:
        - label: π – because the share is π/4
          correct: true
        - label: The square root of 2
          feedback: The diagonal plays no role here.
        - label: Nothing – that is just chance
          feedback: The share approaches a fixed value.
    hints:
      - Area of the quarter circle divided by area of the square.
    explanation: 4 · 0.785 = 3.14. The **Monte Carlo method** uses chance to compute what is otherwise hard to calculate.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Rule of thumb: a simulation with n runs pins down a chance to about ± 1/√n (95 %). To how many percentage points is it accurate with 10,000 runs?"
    answer:
      value: 1
    hints:
      - √10,000 = 100.
      - 1/100 is how many percentage points?
    explanation: ± 1/100 = ± 1 percentage point. For 0.1 points you already need a million runs.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: order
    prompt: This is how you build a Monte Carlo simulation. Put the steps in order.
    params:
      items:
        - label: Describe the random experiment precisely
        - label: Play one run with random numbers
        - label: Repeat it very often
        - label: Count the hits and divide by the runs
        - label: Estimate the accuracy with 1/√n
    hints:
      - First it must be clear what counts as a hit.
      - You can only count after many runs.
    explanation: Named after the casino of Monte Carlo. Physicists used the method in the 1940s when formulas failed.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain the law of large numbers to Lux – and a typical mistake about it.
    params:
      keywords:
        - - viele
          - oft
          - large
          - many
          - often
        - - häufigkeit
          - anteil
          - frequency
          - share
          - proportion
          - durchschnitt
          - average
        - - nähert
          - pendelt
          - approach
          - converge
          - settle
        - - gedächtnis
          - ausgleich
          - fällig
          - memory
          - due
          - compensat
          - unabhängig
          - independent
      min: 3
      sample: "With very many trials the relative frequency approaches the probability. The mistake: chance has no memory, it does not compensate for earlier throws – each throw stays independent."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Random points in a square: 785 of 1000 land inside the quarter circle. The share estimates π/4. What value for π does that give?"
    answer:
      value: 3.14
      tolerance: 0.005
    hints:
      - The share is 0.785.
      - Multiply by 4.
    explanation: 4 · 0.785 = 3.14. With 1000 points, though, the estimate is only good to about ± 0.1 – luck helped here.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: "Computers roll dice with pseudo-randomness: a fixed formula produces numbers that look random. What follows?"
    params:
      options:
        - label: With the same seed you get exactly the same sequence – handy for checking
          correct: true
        - label: Good generators pass very strict statistical tests.
          feedback: Gute Generatoren bestehen sehr strenge statistische Tests.
        - label: That needs unpredictable numbers. Ordinary pseudo-random numbers are predictable.
          feedback: Dafür braucht man unvorhersagbare Zahlen. Normale Pseudozufallszahlen sind vorhersagbar.
    hints:
      - What does a fixed formula do when started twice the same way?
      - For research, reproducibility is an advantage.
    explanation: The seed makes simulations reproducible. Lumen stores it too, so every series of rolls can be checked.
    difficulty: 3

srs:
  cards_from: [viel, schaetzen]
