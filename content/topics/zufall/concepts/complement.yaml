id: stats.prob.complement
type: concept
title: Das Gegenereignis
summary: Mindestens einmal? Rechne rückwärts.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gegenteil
    widget: numeric
    prompt: Die Chance auf Regen ist 30 %. Wie groß ist die Chance, dass es nicht regnet?
    params: { unit: "%" }
    answer: { value: 70 }
    hints:
      - Regen oder kein Regen – zusammen 100 %.
    explanation: 100 % − 30 % = 70 %.

  - kind: explain
    id: s2
    body: |
      »Mindestens einmal« ist schwer direkt zu zählen. Leichter: Rechne die Chance auf »kein einziges Mal« und zieh sie von 1 ab.

  - kind: problem
    id: sechs
    widget: choice
    prompt: Du würfelst viermal. Wie wahrscheinlich ist mindestens eine 6?
    params:
      options:
        - { label: Etwa 52 %, correct: true }
        - { label: Genau 4/6 ≈ 67 %, feedback: "Addieren klappt nicht – mehrere Sechsen würden doppelt zählen." }
        - { label: Etwa 17 %, feedback: "Das ist die Chance für einen einzigen Wurf." }
    hints:
      - Keine 6 in vier Würfen – das ist (5/6)⁴.
    explanation: 1 − (5/6)⁴ ≈ 1 − 0,48 = 0,52.

  - kind: problem
    id: muenzen
    widget: numeric
    prompt: Du wirfst {{n}} Münzen. Wie wahrscheinlich ist mindestens einmal Kopf? Als Bruch.
    params: { placeholder: "Bruch" }
    answer: { value: "{{2 ** n - 1}}/{{2 ** n}}" }
    feedback:
      - when: "approx(numval(state.input), 1 / 2 ** n)"
        misconception: no-complement
        text: Das ist »nie Kopf«. Gesucht ist das Gegenteil.
    hints:
      - "Nie Kopf hat die Chance 1/{{2 ** n}}."
    explanation: "1 − 1/{{2 ** n}} = {{2 ** n - 1}}/{{2 ** n}}."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Chance, im Lotto bei einem Tipp irgendetwas zu gewinnen, liegt bei etwa 3 %. Du spielst 20 Wochen. Wie groß ist die Chance, **mindestens einmal** zu gewinnen? In Prozent, gerundet. (0,97²⁰ ≈ 0,544)
    params:
      unit: "%"
    answer:
      value: 46
      tolerance: 1
    hints:
      - 1 minus die Chance, 20-mal nichts zu gewinnen.
    explanation: 1 − 0,544 ≈ 46 % – nicht 60 %. Wahrscheinlichkeiten addiert man nicht einfach.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Ereignis hat pro Jahr die Wahrscheinlichkeit 1 %. Wie wahrscheinlich tritt es in 100 Jahren **mindestens einmal** ein? In Prozent. (0,99¹⁰⁰ ≈ 0,366)
    params:
      unit: "%"
    answer:
      value: 63
      tolerance: 1
    hints:
      - 1 − 0,366.
    explanation: Rund 63 % – also 1 − 1/e. Ein »Jahrhunderthochwasser« ist in 100 Jahren keineswegs sicher.
    difficulty: 3

srs:
  cards_from: [sechs, muenzen]
