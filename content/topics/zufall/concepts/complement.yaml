id: stats.prob.complement
type: concept
title: Das Gegenereignis
summary: Mindestens einmal? Rechne rückwärts.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: gegenteil
    widget: numeric
    prompt: Die Chance auf Regen ist 30 %. Wie groß ist die Chance, dass es nicht regnet?
    params: { unit: "%" }
    answer: { value: 70 }
    hints:
      - Regen oder kein Regen – zusammen 100 %.
    explanation: 100 % − 30 % = 70 %.

  - kind: explain
    id: s2
    body: |
      »**Mindestens einmal**« ist schwer direkt zu zählen. Leichter: Rechne die Chance auf »kein einziges Mal« und zieh sie von 1 ab.

  - kind: problem
    id: sechs
    widget: choice
    prompt: Du würfelst viermal. Wie wahrscheinlich ist mindestens eine 6?
    params:
      options:
        - { label: Etwa 52 %, correct: true }
        - { label: Genau 4/6 ≈ 67 %, feedback: "Addieren klappt nicht – mehrere Sechsen würden doppelt zählen." }
        - { label: Etwa 17 %, feedback: "Das ist die Chance für einen einzigen Wurf." }
    hints:
      - Keine 6 in vier Würfen – das ist (5/6)⁴.
    explanation: 1 − (5/6)⁴ ≈ 1 − 0,48 = 0,52.

  - kind: problem
    id: muenzen
    widget: numeric
    prompt: Du wirfst {{n}} Münzen. Wie wahrscheinlich ist mindestens einmal Kopf? Als Bruch.
    params: { placeholder: "Bruch" }
    answer: { value: "{{2 ** n - 1}}/{{2 ** n}}" }
    feedback:
      - when: "approx(numval(state.input), 1 / 2 ** n)"
        misconception: no-complement
        text: Das ist »nie Kopf«. Gesucht ist das Gegenteil.
    hints:
      - "Nie Kopf hat die Chance 1/{{2 ** n}}."
    explanation: "1 − 1/{{2 ** n}} = {{2 ** n - 1}}/{{2 ** n}}."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Chance, im Lotto bei einem Tipp irgendetwas zu gewinnen, liegt bei etwa 3 %. Du spielst 20 Wochen. Wie groß ist die Chance, **mindestens einmal** zu gewinnen? In Prozent, gerundet. (0,97²⁰ ≈ 0,544)
    params:
      unit: "%"
    answer:
      value: 46
      tolerance: 1
    hints:
      - 1 minus die Chance, 20-mal nichts zu gewinnen.
    explanation: 1 − 0,544 ≈ 46 % – nicht 60 %. Wahrscheinlichkeiten addiert man nicht einfach.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Du würfelst {{n}}-mal. Wie wahrscheinlich ist mindestens eine 6? In Prozent, auf eine Stelle.
    answer:
      value: "{{100 * (1 - (5 / 6) ** n)}}"
      tolerance: 0.15
    feedback:
      - when: abs(numval(state.input) - 100 * n / 6) < 0.2
        misconception: add-chances
        text: Chancen einfach zu addieren klappt nicht – bei 7 Würfen kämen über 100 % heraus.
    hints:
      - "Rechne zuerst die Chance auf **keine** 6: (5/6) hoch {{n}}."
      - Zieh das Ergebnis von 1 ab.
    explanation: 1 − (5/6)^{{n}} ≈ {{round(1000 * (1 - (5 / 6) ** n)) / 10}} %. Das Gegenteil von »mindestens eine 6« ist »keine einzige 6«.
    difficulty: 2
    variants:
      params:
        n: int[2,8]
      defaults:
        n: 3

  - kind: problem
    id: da-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie oft musst du würfeln, damit mit über 90 % mindestens eine 6 dabei ist?"
    params:
      min: 1
      max: 40
    answer:
      value: 13
      tolerance: 2
    explanation: (5/6)¹² ≈ 11 %, (5/6)¹³ ≈ 9,3 %. Erst ab 13 Würfen liegt »mindestens eine 6« über 90 %.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Ereignis hat pro Jahr die Wahrscheinlichkeit 1 %. Wie wahrscheinlich tritt es in 100 Jahren **mindestens einmal** ein? In Prozent. (0,99¹⁰⁰ ≈ 0,366)
    params:
      unit: "%"
    answer:
      value: 63
      tolerance: 1
    hints:
      - 1 − 0,366.
    explanation: Rund 63 % – also 1 − 1/e. Ein »Jahrhunderthochwasser« ist in 100 Jahren keineswegs sicher.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Drei Würfel. Wie wahrscheinlich zeigen mindestens zwei dieselbe Zahl? Als Bruch.
    answer:
      value: 4/9
    hints:
      - "Gegenteil: alle drei verschieden. Das sind 6 · 5 · 4 von 216 Fällen."
      - 120/216 = 5/9. Zieh das von 1 ab.
    explanation: 1 − 5/9 = 4/9. Das ist das Geburtstagsparadox im Kleinen – mit 6 statt 365 Tagen.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "Bei 300 Patienten trat eine Nebenwirkung **nie** auf. Die **Dreierregel** sagt: Mit 95 % Sicherheit liegt ihre Rate unter 3/n. Wo liegt diese Grenze in Prozent?"
    answer:
      value: 1
    hints:
      - "Rechne 3 : 300."
      - 0,01 sind wie viel Prozent?
    explanation: "3/300 = 1 %. Grund: (1 − p)ⁿ = 5 % ergibt p ≈ 3/n, weil ln 0,05 ≈ −3. »Nie gesehen« heißt also nicht »gibt es nicht«."
    difficulty: 3

srs:
  cards_from: [sechs, muenzen]
