id: stats.prob.chance
type: concept
title: Chancen als Anteil
summary: Günstige durch mögliche Ergebnisse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [prob.chance]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Chancen zum Anfassen
    body: Ob Würfel, Los oder Wetter-App – überall stecken Chancen. Jedes Stück ist eine Seite eines Würfels. Tippe die Seiten an, mit denen du gewinnen willst. Der Bruch unten ist deine **Chance**.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 6
        shape: hexagon

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Menschen müssen in einem Raum sein, damit zwei davon mit über 50 % Chance am selben Tag Geburtstag haben?"
    params:
      min: 2
      max: 366
    answer:
      value: 23
      tolerance: 6
    explanation: Nur 23. Unser Gefühl für Wahrscheinlichkeiten liegt oft daneben – darum lohnt es sich zu rechnen.

  - kind: problem
    id: sechs-oder-eins
    widget: choice
    prompt: Was ist beim Würfeln wahrscheinlicher – eine 6 oder eine 1?
    params:
      options:
        - { label: Gleich wahrscheinlich, correct: true }
        - { label: Die 6, feedback: "Die 6 fühlt sich seltener an, weil man oft auf sie wartet. Jede Seite hat aber dieselbe Chance." }
        - { label: Die 1, feedback: "Ein fairer Würfel bevorzugt keine Seite." }
    hints:
      - Hat ein fairer Würfel eine Lieblingsseite?
    explanation: Jede Seite eines fairen Würfels hat die Chance 1/6.

  - kind: explain
    id: s2
    body: |
      Probier es aus – wirf den Würfel 10- oder 100-mal.
      Die Häufigkeiten schwanken, aber jede Zahl hat die Chance $\frac{1}{6}$.
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: "1" }, { label: "2" }, { label: "3" }, { label: "4" }, { label: "5" }, { label: "6" }]

  - kind: problem
    id: gerade
    widget: numeric
    prompt: Wie groß ist die Wahrscheinlichkeit, eine gerade Zahl zu würfeln?
    params: { placeholder: "z. B. 1/3" }
    answer: { value: "1/2" }
    hints:
      - Welche Augenzahlen sind gerade?
      - 2, 4 und 6 – drei von sechs.
    explanation: 3 von 6 Ergebnissen sind gerade – 3/6 = 1/2.

  - kind: explain
    id: s4
    body: |
      **Laplace-Regel** – sind alle Ergebnisse gleich wahrscheinlich, gilt
      $P = \frac{\text{günstige Ergebnisse}}{\text{mögliche Ergebnisse}}$.

  - kind: problem
    id: kugeln
    widget: numeric
    prompt: In einer Tüte sind {{r}} rote und {{b}} blaue Kugeln. Wie groß ist die Wahrscheinlichkeit, blind eine rote zu ziehen?
    params: { placeholder: "z. B. 2/5" }
    answer: { value: "{{r}}/{{r + b}}" }
    feedback:
      - when: "approx(numval(state.input), r / b) && r != b"
        misconception: part-to-part
        text: Du hast Rot mit Blau verglichen. Teile durch alle Kugeln.
    hints:
      - "Insgesamt sind es {{r + b}} Kugeln."
    explanation: "{{r}} günstige von {{r + b}} möglichen – {{r}}/{{r + b}}."
    variants:
      params: { r: "int[1,6]", b: "int[1,6]" }
      constraints: ["r != b"]
      defaults: { r: 3, b: 5 }

  - kind: problem
    id: muenze
    widget: choice
    body: Eine faire Münze zeigte fünfmal hintereinander Kopf.
    prompt: Was ist beim sechsten Wurf wahrscheinlicher?
    params:
      options:
        - { label: Beides gleich, correct: true }
        - { label: "Zahl – die ist jetzt dran", feedback: "Die Münze hat kein Gedächtnis. Jeder Wurf beginnt neu." }
        - { label: "Kopf – die Serie läuft", feedback: "Eine faire Münze hat keine Serien-Laune. Es bleibt 1/2." }
    hints:
      - Weiß die Münze, was vorher passiert ist?
    explanation: Jeder Wurf ist unabhängig – Kopf und Zahl haben je 1/2.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Jedes Stück ist eine Seite des Würfels. Färbe die Chance, mehr als 4 zu würfeln.
    params:
      parts: 6
      shape: hexagon
    answer:
      fraction: 1/3
    hints:
      - Welche Augenzahlen sind größer als 4?
      - Die 5 und die 6 – färbe 2 von 6 Stücken.
    explanation: "Zwei günstige von sechs möglichen Seiten: $\\frac{2}{6} = \\frac{1}{3}$."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Aus einem Kartenspiel mit 52 Karten ziehst du eine Karte. Wie groß ist die Wahrscheinlichkeit für ein Ass **oder** eine Herzkarte? Als Bruch.
    answer:
      value: 16/52
    feedback:
      - when: approx(numval(state.input), 17 / 52)
        misconception: double-count
        text: Du hast das Herz-Ass doppelt gezählt.
    hints:
      - 4 Asse plus 13 Herzkarten – aber das Herz-Ass nur einmal zählen.
    explanation: 4 + 13 − 1 = 16. Was beide Bedingungen erfüllt, darf nicht doppelt zählen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numberline
    prompt: Markiere die Wahrscheinlichkeit, mit zwei Würfeln die Augensumme 7 zu werfen.
    params:
      min: 0
      max: 1
      ticks: 12
      labels: fractions
    answer:
      value: 1/6
    hints:
      - Es gibt 6 · 6 = 36 gleich wahrscheinliche Paare.
      - "Zähle: 1+6, 2+5, 3+4, 4+3, 5+2, 6+1."
    explanation: 6 von 36 Paaren ergeben 7 – das ist 1/6 oder 2/12.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Zwei Würfel haben die Summen 2 bis 12 – also 11 mögliche Ergebnisse. Ist P(Summe 12) = 1/11?
    params:
      options:
        - label: Nein – die Summen sind nicht gleich wahrscheinlich, P(12) = 1/36
          correct: true
        - label: Ja – 1 günstiges von 11 möglichen
          feedback: Laplace gilt nur, wenn alle Ergebnisse gleich wahrscheinlich sind.
        - label: Nein, es ist 1/12
          feedback: Die 12 entsteht nur aus 6 + 6.
    hints:
      - Auf wie viele Arten entsteht eine 12, auf wie viele eine 7?
      - Zähle die 36 Paare statt der 11 Summen.
    explanation: Die **Laplace-Regel** braucht gleich wahrscheinliche Ergebnisse. Die 36 Paare sind es, die 11 Summen nicht. Nur 6 + 6 ergibt 12, also 1/36.
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: numeric
    prompt: "Zwei Würfel: Wie wahrscheinlich ist eine Augensumme von {{s}}? Als Bruch."
    answer:
      value: "{{6 - abs(s - 7)}}/36"
    hints:
      - Zähle alle Paare (erster Würfel, zweiter Würfel) mit Summe {{s}}.
      - Es sind {{6 - abs(s - 7)}} Paare von 36.
    explanation: "Die Zahl der Paare steigt bis zur 7 und fällt danach: {{6 - abs(s - 7)}} von 36."
    difficulty: 2
    variants:
      params:
        s: int[2,12]
      constraints:
        - s != 7
      defaults:
        s: 9

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was bedeutet »Wahrscheinlichkeit 30 %« eigentlich? Es gibt zwei große Deutungen. Welche passt zu einer Wettervorhersage?
    params:
      options:
        - label: An 30 von 100 Tagen mit genau dieser Wetterlage regnet es
          correct: true
        - label: Es regnet auf 30 % der Fläche
          feedback: Ein verbreitetes Missverständnis.
        - label: Es regnet 30 % des Tages
          feedback: Auch das ist nicht gemeint.
    hints:
      - Stell dir viele Tage mit gleicher Ausgangslage vor.
    explanation: "Die **Häufigkeitsdeutung**. Daneben gibt es die bayessche: Wahrscheinlichkeit als Grad der Überzeugung."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: P(A) = 0,5, P(B) = 0,4 und P(A und B) = 0,2. Wie groß ist P(A oder B)?
    answer:
      value: 0.7
    feedback:
      - when: numval(state.input) == 0.9
        misconception: double-count
        text: Den Teil »A und B« hast du doppelt gezählt.
    hints:
      - Wer in beiden liegt, steckt in P(A) und in P(B).
      - Rechne 0,5 + 0,4 − 0,2.
    explanation: P(A oder B) = P(A) + P(B) − P(A und B) = 0,7. Die Überlappung wird einmal abgezogen.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: In der modernen Mathematik ist Wahrscheinlichkeit durch drei **Axiome** festgelegt (Kolmogorow, 1933). Welche Regel gehört NICHT dazu?
    params:
      options:
        - label: Alle Ergebnisse sind gleich wahrscheinlich
          correct: true
        - label: Keine Wahrscheinlichkeit ist negativ
          feedback: Das ist das erste Axiom.
        - label: Das sichere Ereignis hat Wahrscheinlichkeit 1
          feedback: Das ist das zweite Axiom.
        - label: Bei unvereinbaren Ereignissen addieren sich die Wahrscheinlichkeiten
          feedback: Das ist das dritte Axiom.
    hints:
      - Ein gezinkter Würfel ist trotzdem ein Zufallsexperiment.
      - Welche Regel wäre beim gezinkten Würfel falsch?
    explanation: Gleich wahrscheinlich ist nur ein Sonderfall (Laplace). Die Axiome gelten auch für gezinkte Würfel, Wetter und Aktien.
    difficulty: 3

srs:
  cards_from: ["kugeln"]
