id: stats.prob.lab
type: concept
title: Dice lab
summary: Roll, shade, classify.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wuerfeln
    widget: distribution
    prompt: Roll the die at least 60 times and watch the counts even out.
    params:
      items: [{ label: "1", weight: 1 }, { label: "2", weight: 1 }, { label: "3", weight: 1 }, { label: "4", weight: 1 }, { label: "5", weight: 1 }, { label: "6", weight: 1 }]
    check: { predicate: "draws >= 60" }
    hints:
      - Use the button for many rolls at once.
    explanation: The more rolls, the closer all bars get to one sixth.

  - kind: problem
    id: sechs
    widget: numberline
    prompt: Mark the probability of rolling a six.
    params: { min: 0, max: 1, ticks: 6, labels: fractions }
    answer: { value: "1/6" }
    hints:
      - One of six sides.
    explanation: 1/6, about 17%.

  - kind: problem
    id: gerade
    widget: fraction
    prompt: Shade the probability of rolling an even number.
    params: { parts: 6 }
    answer: { fraction: "3/6" }
    hints:
      - 2, 4 and 6.
    explanation: 3/6 = 1/2, exactly half.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Impossible, possible or certain?
    params:
      buckets: [{ label: impossible }, { label: possible }, { label: certain }]
      items:
        - { label: The die shows a 7, bucket: impossible }
        - { label: The die shows a 6, bucket: possible }
        - { label: The coin shows heads, bucket: possible }
        - { label: The die shows at most 6, bucket: certain }
    hints:
      - Probability 0, in between, or 1?
    explanation: Impossible is 0, certain is 1. Everything else lies in between.

  - kind: problem
    id: da-d1
    depth: 2
    widget: distribution
    prompt: Three coins are flipped. The bars count how often 0, 1, 2 or 3 heads come up. Flip at least 100 times.
    params:
      items:
        - label: "0"
          weight: 1
        - label: "1"
          weight: 3
        - label: "2"
          weight: 3
        - label: "3"
          weight: 1
    check:
      predicate: draws >= 100
    hints:
      - Use the button for 100 throws.
      - "Watch the shape: the middle is three times as high as the edges."
    explanation: "0, 1, 2 and 3 heads come in the ratio 1 : 3 : 3 : 1 – a row of Pascal's triangle."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: match
    prompt: How many orders are there for each number of heads with three coins?
    params:
      pairs:
        - left: 0 heads
          right: 1 way (TTT)
        - left: 1 head
          right: 3 ways
        - left: 3 heads
          right: 1 way (HHH)
        - left: all outcomes
          right: 8 ways
      leftTitle: Result
      rightTitle: Orders
    hints:
      - Write out all 8 sequences from HHH to TTT.
      - "One head: HTT, THT, TTH."
    explanation: 1 + 3 + 3 + 1 = 8 = 2³. Each single sequence has probability 1/8.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Two dice: what is the probability that their **product** is even? As a fraction."
    answer:
      value: 3/4
    hints:
      - The product is only odd if both are odd.
    explanation: 1 − 1/2 · 1/2 = 3/4. Going via the opposite is quickest.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numberline
    prompt: Mark the probability of exactly 2 heads with three coins.
    params:
      min: 0
      max: 1
      ticks: 8
      labels: fractions
    answer:
      value: 3/8
    hints:
      - How many of the 8 sequences have exactly two H?
      - HHT, HTH, THH.
    explanation: 3 of 8 sequences – so 3/8 = 37.5 %.
    difficulty: 3

srs:
  cards_from: [sechs, gerade]
