id: stats.prob.complement
type: concept
title: The complement
summary: At least once? Calculate backward.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: At least one six
    body: You need a six to start – and may roll three dice. How often does it work? Roll 10 times, then 100 times. Both bars add up to 100 % – the second one is the **complement**.
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: at least one 6
            weight: 91
          - label: no 6
            weight: 125
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: gegenteil
    widget: numeric
    prompt: The chance of rain is 30%. What is the chance that it does not rain?
    params: { unit: "%" }
    answer: { value: 70 }
    hints:
      - Rain or no rain add up to 100%.
    explanation: 100% − 30% = 70%.

  - kind: explain
    id: s2
    body: |
      “**At least once**” is hard to count directly. It is easier to work out the chance of “not a single time” and subtract it from 1.

  - kind: problem
    id: sechs
    widget: choice
    prompt: You roll a die four times. How likely is at least one 6?
    params:
      options:
        - { label: About 52%, correct: true }
        - { label: Exactly 4/6 ≈ 67%, feedback: "Adding does not work. Several sixes would be counted twice." }
        - { label: About 17%, feedback: "That is the chance for a single roll." }
    hints:
      - No 6 in four rolls is (5/6)⁴.
    explanation: 1 − (5/6)⁴ ≈ 1 − 0.48 = 0.52.

  - kind: problem
    id: muenzen
    widget: numeric
    prompt: You toss {{n}} coins. How likely is at least one head? Give a fraction.
    params: { placeholder: "Fraction" }
    answer: { value: "{{2 ** n - 1}}/{{2 ** n}}" }
    feedback:
      - when: "approx(numval(state.input), 1 / 2 ** n)"
        misconception: no-complement
        text: That is “never heads”. You want the opposite.
    hints:
      - "Never heads has the chance 1/{{2 ** n}}."
    explanation: "1 − 1/{{2 ** n}} = {{2 ** n - 1}}/{{2 ** n}}."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: Mark the chance of rolling **no** six with one die.
    params:
      min: 0
      max: 1
      ticks: 6
      labels: fractions
    answer:
      value: 5/6
    hints:
      - What is the chance of a six?
      - "Use the complement: $1 - \\frac{1}{6}$."
    explanation: $1 - \frac{1}{6} = \frac{5}{6}$. A chance and its complement always add up to 1.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The chance of winning anything in the lottery with one ticket is about 3%. You play 20 weeks. What is the chance of winning **at least once**? In percent, rounded. (0.97²⁰ ≈ 0.544)
    params:
      unit: "%"
    answer:
      value: 46
      tolerance: 1
    hints:
      - 1 minus the chance of winning nothing 20 times.
    explanation: 1 − 0.544 ≈ 46% – not 60%. Probabilities are not simply added.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: You roll a die {{n}} times. How likely is at least one 6? In percent, to one decimal.
    answer:
      value: "{{100 * (1 - (5 / 6) ** n)}}"
      tolerance: 0.15
    feedback:
      - when: abs(numval(state.input) - 100 * n / 6) < 0.2
        misconception: add-chances
        text: Simply adding chances fails – with 7 rolls you would get over 100 %.
    hints:
      - "First compute the chance of no 6: (5/6) to the power {{n}}."
      - Subtract the result from 1.
    explanation: 1 − (5/6)^{{n}} ≈ {{round(1000 * (1 - (5 / 6) ** n)) / 10}} %. The opposite of »at least one 6« is »not a single 6«.
    difficulty: 2
    variants:
      params:
        n: int[2,8]
      defaults:
        n: 3

  - kind: problem
    id: da-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many rolls do you need for at least one 6 with more than 90 % chance?"
    params:
      min: 1
      max: 40
    answer:
      value: 13
      tolerance: 2
    explanation: (5/6)¹² ≈ 11 %, (5/6)¹³ ≈ 9.3 %. Only from 13 rolls on is »at least one 6« above 90 %.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An event has a probability of 1% per year. How likely is it to occur **at least once** in 100 years? In percent. (0.99¹⁰⁰ ≈ 0.366)
    params:
      unit: "%"
    answer:
      value: 63
      tolerance: 1
    hints:
      - 1 − 0.366.
    explanation: About 63% – that is 1 − 1/e. A “hundred-year flood” is by no means certain within 100 years.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Three dice. How likely do at least two show the same number? As a fraction.
    answer:
      value: 4/9
    hints:
      - "Complement: all three different. That is 6 · 5 · 4 out of 216."
      - 120/216 = 5/9. Subtract that from 1.
    explanation: 1 − 5/9 = 4/9. That is the birthday paradox in miniature – with 6 instead of 365 days.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "Among 300 patients a side effect never occurred. The rule of three says: with 95 % confidence its rate is below 3/n. Where is this limit, in percent?"
    answer:
      value: 1
    hints:
      - Compute 3 ÷ 300.
      - 0.01 is what percent?
    explanation: "3/300 = 1 %. Reason: (1 − p)ⁿ = 5 % gives p ≈ 3/n, since ln 0.05 ≈ −3. »Never seen« does not mean »does not exist«."
    difficulty: 3

srs:
  cards_from: [sechs, muenzen]
