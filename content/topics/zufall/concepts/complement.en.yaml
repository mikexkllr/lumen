id: stats.prob.complement
type: concept
title: The complement
summary: At least once? Calculate backward.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gegenteil
    widget: numeric
    prompt: The chance of rain is 30%. What is the chance that it does not rain?
    params: { unit: "%" }
    answer: { value: 70 }
    hints:
      - Rain or no rain add up to 100%.
    explanation: 100% − 30% = 70%.

  - kind: explain
    id: s2
    body: |
      “At least once” is hard to count directly. It is easier to work out the chance of “not a single time” and subtract it from 1.

  - kind: problem
    id: sechs
    widget: choice
    prompt: You roll a die four times. How likely is at least one 6?
    params:
      options:
        - { label: About 52%, correct: true }
        - { label: Exactly 4/6 ≈ 67%, feedback: "Adding does not work. Several sixes would be counted twice." }
        - { label: About 17%, feedback: "That is the chance for a single roll." }
    hints:
      - No 6 in four rolls is (5/6)⁴.
    explanation: 1 − (5/6)⁴ ≈ 1 − 0.48 = 0.52.

  - kind: problem
    id: muenzen
    widget: numeric
    prompt: You toss {{n}} coins. How likely is at least one head? Give a fraction.
    params: { placeholder: "Fraction" }
    answer: { value: "{{2 ** n - 1}}/{{2 ** n}}" }
    feedback:
      - when: "approx(numval(state.input), 1 / 2 ** n)"
        misconception: no-complement
        text: That is “never heads”. You want the opposite.
    hints:
      - "Never heads has the chance 1/{{2 ** n}}."
    explanation: "1 − 1/{{2 ** n}} = {{2 ** n - 1}}/{{2 ** n}}."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The chance of winning anything in the lottery with one ticket is about 3%. You play 20 weeks. What is the chance of winning **at least once**? In percent, rounded. (0.97²⁰ ≈ 0.544)
    params:
      unit: "%"
    answer:
      value: 46
      tolerance: 1
    hints:
      - 1 minus the chance of winning nothing 20 times.
    explanation: 1 − 0.544 ≈ 46% – not 60%. Probabilities are not simply added.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An event has a probability of 1% per year. How likely is it to occur **at least once** in 100 years? In percent. (0.99¹⁰⁰ ≈ 0.366)
    params:
      unit: "%"
    answer:
      value: 63
      tolerance: 1
    hints:
      - 1 − 0.366.
    explanation: About 63% – that is 1 − 1/e. A “hundred-year flood” is by no means certain within 100 years.
    difficulty: 3

srs:
  cards_from: [sechs, muenzen]
