id: chem.bonds.covalent
type: concept
title: Sharing electrons
summary: The covalent bond.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Two children want the same toy. Neither gives it up. What is the peaceful solution?
    params:
      options:
        - label: They share it
          correct: true
        - label: One takes it away
          feedback: Neither is strong enough for that.
        - label: Both go without
          feedback: Then neither would gain anything.
    hints:
      - Both want it – neither can have it alone.
    explanation: That is what two non-metal atoms do with their electrons.


  - kind: explain
    id: s1
    body: |
      Two nonmetals are reluctant to give up electrons. They prefer to **share** them: a shared pair of electrons counts for both atoms. This is the **covalent bond**.

  - kind: problem
    id: kohlenstoff
    widget: numeric
    prompt: Carbon has 4 outer electrons. How many bonds does it form to reach 8?
    params: { unit: bonds }
    answer: { value: 4 }
    hints:
      - Each bond adds one shared electron.
    explanation: 4 + 4 = 8, so carbon forms four bonds, as in methane CH₄.

  - kind: problem
    id: wieviele
    widget: match
    prompt: How many bonds does the atom usually form?
    params:
      pairs:
        - { left: Hydrogen, right: "1" }
        - { left: Oxygen, right: "2" }
        - { left: Nitrogen, right: "3" }
        - { left: Carbon, right: "4" }
    hints:
      - Count the electrons missing from a full shell. For hydrogen, a full shell is already 2.
    explanation: H₂O, NH₃, CH₄. The formulas follow directly from this.

  - kind: problem
    id: wasser
    widget: choice
    prompt: Which bond holds a water molecule H₂O together?
    params:
      options:
        - { label: Covalent bonds, correct: true }
        - { label: Ionic bonds, feedback: "Oxygen and hydrogen are nonmetals, so they share." }
    hints:
      - Are any metals involved?
    explanation: Oxygen shares one electron pair with each of two hydrogen atoms.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Water H₂O
          right: true
        - text: Table salt NaCl
          right: false
        - text: Methane CH₄
          right: true
        - text: Magnesium oxide MgO
          right: false
        - text: Oxygen O₂
          right: true
      left: Ionic bond
      right: Covalent bond

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Nitrogen N₂ is extremely stable. Each N atom has 5 outer electrons. How many electron pairs do the two atoms share?
    answer:
      value: 3
    hints:
      - Each atom lacks 3 electrons to reach eight.
    explanation: A **triple bond**. Breaking it costs so much energy that plants cannot use atmospheric nitrogen directly.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Diamond and graphite both consist only of carbon. Why is one the hardest material while the other smears?
    params:
      options:
        - label: In diamond every atom is bonded in all directions, in graphite only within layers
          correct: true
        - label: Diamond contains a harder isotope
          feedback: The isotopes are the same.
        - label: Graphite is impure
          feedback: Even the purest graphite is soft.
    hints:
      - Four bonds into space – or three in a plane.
    explanation: "The same atoms, different structure: **allotropes**. Graphite’s layers slide off – that is how a pencil writes."
    difficulty: 3

srs:
  cards_from: [kohlenstoff, wieviele]
