id: chem.bonds.covalent
type: concept
title: Sharing electrons
summary: The covalent bond.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Strong friendships
    body: Two non-metals will not give up electrons. Still they hold together – in sugar, plastic and diamond. Uncover the cards. How do atoms build such strong **molecules**?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💎
            front: A giant molecule
            back: A diamond is one single molecule of countless tightly linked carbon atoms.
          - icon: 🛍️
            front: The plastic bag
            back: Its chains are made of thousands of carbon atoms, one after another.
          - icon: 🌬️
            front: Nitrogen
            back: Two N atoms hold on so tightly that plants cannot split them.
          - icon: 🍬
            front: Sugar
            back: One sugar molecule holds 45 atoms together – just C, H and O, no metal at all.

  - kind: problem
    id: hook
    widget: choice
    prompt: Two children want the same toy. Neither gives it up. What is the peaceful solution?
    params:
      options:
        - label: They share it
          correct: true
        - label: One takes it away
          feedback: Neither is strong enough for that.
        - label: Both go without
          feedback: Then neither would gain anything.
    hints:
      - Both want it – neither can have it alone.
    explanation: That is what two non-metal atoms do with their electrons.

  - kind: explain
    id: s1
    body: |
      Two nonmetals are reluctant to give up electrons. They prefer to **share** them: a shared pair of electrons counts for both atoms. This is the **covalent bond**.

  - kind: problem
    id: kohlenstoff
    widget: numeric
    prompt: Carbon has 4 outer electrons. How many bonds does it form to reach 8?
    params: { unit: bonds }
    answer: { value: 4 }
    hints:
      - Each bond adds one shared electron.
    explanation: 4 + 4 = 8, so carbon forms four bonds, as in methane CH₄.

  - kind: problem
    id: wieviele
    widget: match
    prompt: How many bonds does the atom usually form?
    params:
      pairs:
        - { left: Hydrogen, right: "1" }
        - { left: Oxygen, right: "2" }
        - { left: Nitrogen, right: "3" }
        - { left: Carbon, right: "4" }
    hints:
      - Count the electrons missing from a full shell. For hydrogen, a full shell is already 2.
    explanation: H₂O, NH₃, CH₄. The formulas follow directly from this.

  - kind: problem
    id: wasser
    widget: choice
    prompt: Which bond holds a water molecule H₂O together?
    params:
      options:
        - { label: Covalent bonds, correct: true }
        - { label: Ionic bonds, feedback: "Oxygen and hydrogen are nonmetals, so they share." }
    hints:
      - Are any metals involved?
    explanation: Oxygen shares one electron pair with each of two hydrogen atoms.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Water H₂O
          right: true
        - text: Table salt NaCl
          right: false
        - text: Methane CH₄
          right: true
        - text: Magnesium oxide MgO
          right: false
        - text: Oxygen O₂
          right: true
      left: Ionic bond
      right: Covalent bond

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Nitrogen N₂ is extremely stable. Each N atom has 5 outer electrons. How many electron pairs do the two atoms share?
    answer:
      value: 3
    hints:
      - Each atom lacks 3 electrons to reach eight.
    explanation: A **triple bond**. Breaking it costs so much energy that plants cannot use atmospheric nitrogen directly.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: Electron pairs repel each other. Around an atom they spread as far apart as possible. That decides the shape of a molecule. This is the **electron-pair repulsion model**, VSEPR for short.

  - kind: problem
    id: ch-d2
    depth: 2
    widget: match
    prompt: What shape does the molecule have?
    params:
      pairs:
        - left: CO₂ (2 partners, no lone pairs)
          right: linear, 180°
        - left: BF₃ (3 partners)
          right: flat triangle, 120°
        - left: CH₄ (4 partners)
          right: tetrahedron, 109.5°
        - left: NH₃ (3 partners, 1 lone pair)
          right: pyramid, 107°
        - left: H₂O (2 partners, 2 lone pairs)
          right: bent, 104.5°
    hints:
      - Count all electron pairs around the central atom – lone pairs too.
      - Four pairs always make a tetrahedron. You just do not see the lone pairs.
    explanation: CH₄, NH₃ and H₂O all have four pairs. The shape, though, only counts the atoms.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: In NH₃ the N carries three bonds. How many electron pairs surround the N atom in total – bonding and lone?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: lone-pair-ignored
        text: The lone pair counts too.
    hints:
      - N has 5 outer electrons. 3 are in bonds.
      - The remaining 2 form a lone pair.
    explanation: 3 bonding + 1 lone pair = 4. That is why NH₃ is a pyramid, not a flat triangle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Diamond and graphite both consist only of carbon. Why is one the hardest material while the other smears?
    params:
      options:
        - label: In diamond every atom is bonded in all directions, in graphite only within layers
          correct: true
        - label: Diamond contains a harder isotope
          feedback: The isotopes are the same.
        - label: Graphite is impure
          feedback: Even the purest graphite is soft.
    hints:
      - Four bonds into space – or three in a plane.
    explanation: "The same atoms, different structure: **allotropes**. Graphite’s layers slide off – that is how a pencil writes."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: Methane has angles of 109.5°, water only 104.5°. Both have four electron pairs. Why is water tighter?
    params:
      options:
        - label: Lone pairs take up more room and squeeze the bonds together
          correct: true
        - label: Hydrogen is bigger than carbon
          feedback: It is not about H – both molecules contain H atoms.
        - label: Water has fewer electrons
          feedback: Both central atoms have four pairs.
    hints:
      - A lone pair belongs to one atom only and sits close to its nucleus.
      - "CH₄: 0 lone pairs, NH₃: 1, H₂O: 2."
    explanation: "109.5° → 107° → 104.5°: each extra lone pair squeezes the angles further."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: A C–C single bond holds 348 kJ/mol, a C≡C triple bond 839 kJ/mol. What follows from this?
    params:
      options:
        - label: The second and third bonds are weaker than the first
          correct: true
        - label: The triple bond is exactly three times as strong
          feedback: 3 · 348 would be 1044 kJ/mol.
        - label: Multiple bonds are weaker than single bonds
          feedback: 839 is more than 348.
    hints:
      - Work out 839 ÷ 348.
      - That is only about 2.4 times.
    explanation: The extra bonds lie off to the side and overlap less well. That is why alkenes and alkynes react readily at their multiple bond.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why water is bent but CO₂ is straight.
    params:
      keywords:
        - - paar
          - pair
        - - frei
          - lone
        - - abstoß
          - repel
          - auseinander
          - apart
        - - doppel
          - double
          - zwei
          - two
      sample: Electron pairs repel. In water, the O has four pairs, two of them lone pairs – that makes a bend. In CO₂, the C has no lone pairs, only two double bonds. They point straight apart.
    explanation: Lone pairs shape the molecule even though you cannot see them.
    difficulty: 3

srs:
  cards_from: [kohlenstoff, wieviele]
