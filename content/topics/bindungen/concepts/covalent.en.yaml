id: chem.bonds.covalent
type: concept
title: Sharing electrons
summary: The covalent bond.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Two nonmetals are reluctant to give up electrons. They prefer to **share** them: a shared pair of electrons counts for both atoms. This is the **covalent bond**.

  - kind: problem
    id: kohlenstoff
    widget: numeric
    prompt: Carbon has 4 outer electrons. How many bonds does it form to reach 8?
    params: { unit: bonds }
    answer: { value: 4 }
    hints:
      - Each bond adds one shared electron.
    explanation: 4 + 4 = 8, so carbon forms four bonds, as in methane CH₄.

  - kind: problem
    id: wieviele
    widget: match
    prompt: How many bonds does the atom usually form?
    params:
      pairs:
        - { left: Hydrogen, right: "1" }
        - { left: Oxygen, right: "2" }
        - { left: Nitrogen, right: "3" }
        - { left: Carbon, right: "4" }
    hints:
      - Count the electrons missing from a full shell. For hydrogen, a full shell is already 2.
    explanation: H₂O, NH₃, CH₄. The formulas follow directly from this.

  - kind: problem
    id: wasser
    widget: choice
    prompt: Which bond holds a water molecule H₂O together?
    params:
      options:
        - { label: Covalent bonds, correct: true }
        - { label: Ionic bonds, feedback: "Oxygen and hydrogen are nonmetals, so they share." }
    hints:
      - Are any metals involved?
    explanation: Oxygen shares one electron pair with each of two hydrogen atoms.

srs:
  cards_from: [kohlenstoff, wieviele]
