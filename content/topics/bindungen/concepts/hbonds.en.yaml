id: chem.bonds.hbonds
type: concept
title: Hydrogen bonds
summary: Small forces, big effects.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: siedepunkt
    widget: choice
    prompt: Water is a tiny molecule, yet it only boils at 100 °C. Why so high?
    params:
      options:
        - { label: The molecules cling together through hydrogen bonds., correct: true }
        - { label: Water molecules are very heavy., feedback: "H₂O is lighter than oxygen gas, and that boils at −183 °C." }
    hints:
      - What has to be overcome when a liquid boils?
    explanation: The positive H of one molecule attracts the negative O of the next. Breaking these bonds takes energy.

  - kind: explain
    id: s2
    body: |
      A **hydrogen bond** is an attraction between molecules. It is much weaker than a bond within a molecule, but powerful in large numbers. It also holds the two strands of DNA together.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: A water molecule has two H atoms and two lone pairs on the O. How many hydrogen bonds can it form at most?
    params: { unit: bonds }
    answer: { value: 4 }
    hints:
      - Each H and each lone pair can form one bond.
    explanation: 2 + 2 = 4. That is why ice forms an open, airy lattice.

  - kind: problem
    id: eis
    widget: choice
    prompt: Why does ice float on water?
    params:
      options:
        - { label: "In the ice lattice, the molecules sit farther apart.", correct: true }
        - { label: Ice contains air bubbles., feedback: "Even bubble-free ice floats." }
    hints:
      - How do the hydrogen bonds arrange the molecules in the crystal?
    explanation: The lattice of bonds needs more room than liquid water. Ice is less dense.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order by strength – from weak to strong.
    params:
      items:
        - label: Attraction between methane molecules
        - label: Hydrogen bond between water molecules
        - label: Bond inside the water molecule itself
    hints:
      - A hydrogen bond is stronger than ordinary attraction but weaker than a bond.
    explanation: That is why water boils only at 100 °C, methane already at −162 °C.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Methane CH₄ (16 u) boils at −162 °C, water H₂O (18 u) at +100 °C. Where does the huge difference come from?
    params:
      options:
        - label: Water forms hydrogen bonds, methane does not
          correct: true
        - label: Water is much heavier
          feedback: Both weigh almost the same.
        - label: Methane is unstable
          feedback: Methane is stable – its molecules just hardly hold onto one another.
    hints:
      - The masses are almost equal. What distinguishes the molecules?
    explanation: Without hydrogen bonds water would be a gas on Earth – and there would be no life.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: at what temperature in Celsius would water boil if there were no hydrogen bonds?"
    params:
      min: -150
      max: 150
      unit: °C
    answer:
      value: -80
      tolerance: 25
    explanation: Extending the series H₂Te, H₂Se, H₂S lands at about −80 °C. Without these bonds there would be no liquid water on Earth.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Can these molecules form hydrogen bonds with each other?
    params:
      buckets:
        - id: b1
          label: yes
        - id: b2
          label: no
      items:
        - label: Water H₂O
          bucket: b1
        - label: Ammonia NH₃
          bucket: b1
        - label: Hydrogen fluoride HF
          bucket: b1
        - label: Ethanol C₂H₅OH
          bucket: b1
        - label: Methane CH₄
          bucket: b2
        - label: Hydrogen H₂
          bucket: b2
        - label: Carbon dioxide CO₂
          bucket: b2
    hints:
      - You need an H on a strongly electronegative N, O or F.
      - In CH₄ the H is on a C – that is not enough.
    explanation: Hydrogen bonds need a strongly positive H (on N, O or F) and a lone pair on the neighbour. CO₂ has no H at all.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: order
    prompt: Order by boiling point – the highest first.
    params:
      items:
        - label: Water H₂O (+100 °C)
        - label: Hydrogen fluoride HF (+20 °C)
        - label: Ammonia NH₃ (−33 °C)
        - label: Methane CH₄ (−162 °C)
    hints:
      - The temperatures are given.
      - Water can form the most bonds per molecule.
    explanation: Water forms up to four bonds per molecule, HF and NH₃ fewer on average. Methane has none – and boils far below.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: salt holds together differently from water. What is the difference?"
    params:
      keywords:
        - - abgeb
          - übertrag
          - transfer
          - give
          - donat
          - aufnehm
        - - teil
          - gemeinsam
          - share
        - - ion
          - ladung
          - charge
          - plus
          - minus
          - anzieh
          - attract
      sample: In an ionic bond an electron is transferred – charged ions form that attract each other. In a covalent bond two atoms share an electron pair.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: A piece of DNA has {{at}} A–T base pairs (2 bonds each) and {{gc}} G–C pairs (3 bonds each). How many hydrogen bonds hold the strands together?
    answer:
      value: "{{2 * at + 3 * gc}}"
    feedback:
      - when: numval(state.input) == 3 * at + 2 * gc
        misconception: pair-swap
        text: "Swapped: A–T has 2, G–C has 3 bonds."
    hints:
      - Work out each kind separately.
      - "{{at}} · 2 + {{gc}} · 3."
    explanation: "{{2 * at}} + {{3 * gc}} = {{2 * at + 3 * gc}}. DNA rich in G–C only separates at higher temperatures."
    difficulty: 3
    variants:
      params:
        at: int[4,12]
        gc: int[3,12]
      constraints:
        - at != gc
      defaults:
        at: 10
        gc: 5

  - kind: explain
    id: ch-x2
    depth: 3
    body: Even non-polar molecules attract each other. Their electron clouds keep fluctuating and form brief mini-dipoles that tug on their neighbours. These are **London forces**. The bigger the molecule, the stronger they are.

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: A gecko runs up a smooth pane of glass – without glue or suction cups. What holds it?
    params:
      options:
        - label: Billions of tiny hairs that cling to the glass through London forces
          correct: true
        - label: Hydrogen bonds
          feedback: The grip even works on water-repellent surfaces.
        - label: Ionic bonds
          feedback: Neither foot nor glass gives away electrons here.
    hints:
      - Each single attraction is tiny.
      - Many contacts at the smallest distance add up.
    explanation: Weak forces become strong if there are enough of them. Researchers copy this to make tape with no glue.
    difficulty: 3

srs:
  cards_from: [siedepunkt, eis]
