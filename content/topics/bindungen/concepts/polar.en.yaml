id: chem.bonds.polar
type: concept
title: Polar molecules
summary: Why oil and water don't mix.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A rubbed balloon bends a thin stream of water. Why?
    params:
      options:
        - label: Water molecules have a positive and a negative side
          correct: true
        - label: Water is magnetic
          feedback: A magnet does not bend water.
        - label: The balloon blows air
          feedback: It is tied shut.
    hints:
      - The balloon is electrically charged.
    explanation: The charged side of the molecules is attracted.


  - kind: explain
    id: s1
    body: |
      Oxygen pulls the shared electrons more strongly than hydrogen does. So the water molecule has a slightly negative side and a slightly positive side. It is **polar**.

  - kind: problem
    id: oel
    widget: choice
    prompt: Why don't oil and water mix?
    params:
      options:
        - { label: "Water is polar, oil is not.", correct: true }
        - { label: Oil is heavier than water., feedback: "Oil is lighter and floats on top. It still would not mix." }
        - { label: Oil is too warm., feedback: "Even cold oil does not mix." }
    hints:
      - Water molecules prefer to stick to each other rather than to oil.
    explanation: Water molecules attract each other and push the nonpolar oil out.

  - kind: problem
    id: loesen
    widget: buckets
    prompt: Does it dissolve in water?
    params:
      buckets: [{ label: dissolves }, { label: does not dissolve }]
      items:
        - { label: Table salt, bucket: dissolves }
        - { label: Sugar, bucket: dissolves }
        - { label: Cooking oil, bucket: does not dissolve }
        - { label: Candle wax, bucket: does not dissolve }
    hints:
      - Like dissolves like.
    explanation: Polar substances and ions dissolve in water. Nonpolar ones do not.

  - kind: problem
    id: seife
    widget: choice
    prompt: How does soap remove grease from your hands?
    params:
      options:
        - { label: It has a polar end and a nonpolar end., correct: true }
        - { label: It burns the grease., feedback: "Nothing burns. Soap acts as a go-between." }
    hints:
      - Soap has to get along with both grease and water.
    explanation: One end holds the grease, the other holds the water. The water then rinses the grease away.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: CO₂ has two polar bonds but is **not** polar overall. Why?
    params:
      options:
        - label: The molecule is straight – the two pulls cancel exactly
          correct: true
        - label: Carbon and oxygen pull equally hard
          feedback: Oxygen pulls clearly harder.
        - label: CO₂ is a gas, and gases are never polar
          feedback: Water vapour is a gas and polar.
    hints:
      - O=C=O is linear. Water, in contrast, is bent.
    explanation: Polarity depends on **shape**. In bent water the pulls add up.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The rule of thumb is “like dissolves like”. So what removes an oil stain best?
    params:
      options:
        - label: With a non-polar solvent such as petrol – or with soap as a go-between
          correct: true
        - label: With lots of cold water
          feedback: Water is polar and beads off the oil.
        - label: With salt water
          feedback: Ions make water even more polar.
    hints:
      - Oil is non-polar.
    explanation: "Soap molecules form **micelles**: fat inside, the polar heads outside towards the water."
    difficulty: 3

srs:
  cards_from: [oel, seife]
