id: chem.bonds.polar
type: concept
title: Polar molecules
summary: Why oil and water don't mix.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Oxygen pulls the shared electrons more strongly than hydrogen does. So the water molecule has a slightly negative side and a slightly positive side. It is **polar**.

  - kind: problem
    id: oel
    widget: choice
    prompt: Why don't oil and water mix?
    params:
      options:
        - { label: "Water is polar, oil is not.", correct: true }
        - { label: Oil is heavier than water., feedback: "Oil is lighter and floats on top. It still would not mix." }
        - { label: Oil is too warm., feedback: "Even cold oil does not mix." }
    hints:
      - Water molecules prefer to stick to each other rather than to oil.
    explanation: Water molecules attract each other and push the nonpolar oil out.

  - kind: problem
    id: loesen
    widget: buckets
    prompt: Does it dissolve in water?
    params:
      buckets: [{ label: dissolves }, { label: does not dissolve }]
      items:
        - { label: Table salt, bucket: dissolves }
        - { label: Sugar, bucket: dissolves }
        - { label: Cooking oil, bucket: does not dissolve }
        - { label: Candle wax, bucket: does not dissolve }
    hints:
      - Like dissolves like.
    explanation: Polar substances and ions dissolve in water. Nonpolar ones do not.

  - kind: problem
    id: seife
    widget: choice
    prompt: How does soap remove grease from your hands?
    params:
      options:
        - { label: It has a polar end and a nonpolar end., correct: true }
        - { label: It burns the grease., feedback: "Nothing burns. Soap acts as a go-between." }
    hints:
      - Soap has to get along with both grease and water.
    explanation: One end holds the grease, the other holds the water. The water then rinses the grease away.

srs:
  cards_from: [oel, seife]
