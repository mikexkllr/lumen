id: chem.bonds.polar
type: concept
title: Polar molecules
summary: Why oil and water don't mix.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The water puzzle
    body: "Water beads off ducks but climbs up a kitchen towel. The reason is a tiny **imbalance** inside the molecule. Uncover the cards and collect clues: what makes water so special?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦆
            front: The duck
            back: Its feathers are oiled. Water simply rolls off.
          - icon: 🍳
            front: The non-stick pan
            back: Water beads up on Teflon too – the coating has no charged sides.
          - icon: 🧻
            front: The kitchen towel
            back: "Dip in one corner: the water climbs up all by itself."
          - icon: 💧
            front: The great solvent
            back: Water dissolves more substances than almost any other liquid.

  - kind: problem
    id: hook
    widget: choice
    prompt: A rubbed balloon bends a thin stream of water. Why?
    params:
      options:
        - label: Water molecules have a positive and a negative side
          correct: true
        - label: Water is magnetic
          feedback: A magnet does not bend water.
        - label: The balloon blows air
          feedback: It is tied shut.
    hints:
      - The balloon is electrically charged.
    explanation: The charged side of the molecules is attracted.

  - kind: explain
    id: s1
    body: |
      Oxygen pulls the shared electrons more strongly than hydrogen does. So the water molecule has a slightly negative side and a slightly positive side. It is **polar**.

  - kind: problem
    id: oel
    widget: choice
    prompt: Why don't oil and water mix?
    params:
      options:
        - { label: "Water is polar, oil is not.", correct: true }
        - { label: Oil is heavier than water., feedback: "Oil is lighter and floats on top. It still would not mix." }
        - { label: Oil is too warm., feedback: "Even cold oil does not mix." }
    hints:
      - Water molecules prefer to stick to each other rather than to oil.
    explanation: Water molecules attract each other and push the nonpolar oil out.

  - kind: problem
    id: loesen
    widget: buckets
    prompt: Does it dissolve in water?
    params:
      buckets: [{ label: dissolves }, { label: does not dissolve }]
      items:
        - { label: Table salt, bucket: dissolves }
        - { label: Sugar, bucket: dissolves }
        - { label: Cooking oil, bucket: does not dissolve }
        - { label: Candle wax, bucket: does not dissolve }
    hints:
      - Like dissolves like.
    explanation: Polar substances and ions dissolve in water. Nonpolar ones do not.

  - kind: problem
    id: seife
    widget: choice
    prompt: How does soap remove grease from your hands?
    params:
      options:
        - { label: It has a polar end and a nonpolar end., correct: true }
        - { label: It burns the grease., feedback: "Nothing burns. Soap acts as a go-between." }
    hints:
      - Soap has to get along with both grease and water.
    explanation: One end holds the grease, the other holds the water. The water then rinses the grease away.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Polar or non-polar?
    params:
      buckets:
        - id: b1
          label: Polar
        - id: b2
          label: Non-polar
      items:
        - label: Water (H₂O)
          bucket: b1
        - label: Methane (CH₄)
          bucket: b2
        - label: Ammonia (NH₃)
          bucket: b1
        - label: Oxygen (O₂)
          bucket: b2
        - label: Hydrogen chloride (HCl)
          bucket: b1
    hints:
      - Does one atom pull the electrons more strongly?
    explanation: Two equal atoms pull equally. Then there is no charged side.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Like dissolves [[like]]: water dissolves sugar but not [[oil]]."
      distractors:
        - others
        - salt

  - kind: problem
    id: mix-c3
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Water is a polar molecule.
          right: true
        - text: Oil and water mix well.
          right: false
          why: Oil is non-polar, water polar.
        - text: Soap has a polar and a non-polar end.
          right: true
        - text: In a polar molecule the electrons are spread evenly.
          right: false
          why: They sit closer to one of the atoms.
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: CO₂ has two polar bonds but is **not** polar overall. Why?
    params:
      options:
        - label: The molecule is straight – the two pulls cancel exactly
          correct: true
        - label: Carbon and oxygen pull equally hard
          feedback: Oxygen pulls clearly harder.
        - label: CO₂ is a gas, and gases are never polar
          feedback: Water vapour is a gas and polar.
    hints:
      - O=C=O is linear. Water, in contrast, is bent.
    explanation: Polarity depends on **shape**. In bent water the pulls add up.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: "Electronegativity: H 2.2 · C 2.6 · Cl 3.2 · O 3.4 · F 4.0. What is the difference ΔEN in the H–{{el}} bond?"
    answer:
      value: "{{en - 2.2}}"
      tolerance: 0.01
    hints:
      - Subtract the smaller value from the larger one.
      - Work out {{en}} − 2.2.
    explanation: ΔEN = {{en}} − 2.2 = {{en - 2.2}}. The bigger the gap, the more strongly {{el}} pulls the electrons over.
    difficulty: 2
    variants:
      params:
        i: int[0,3]
      derive:
        el: '["C", "Cl", "O", "F"][i]'
        en: "[2.6, 3.2, 3.4, 4.0][i]"
      defaults:
        i: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: "In the H–Cl bond: which atom carries the partial negative charge δ−?"
    params:
      options:
        - label: The chlorine atom
          correct: true
        - label: The hydrogen atom
          feedback: H pulls more weakly – the electrons move away from it.
        - label: Neither, both are equal
          feedback: Cl is clearly more electronegative.
    hints:
      - The electrons shift towards the atom that pulls harder.
      - Cl has 3.2, H only 2.2.
    explanation: "H–Cl is polar: δ+ on H, δ− on Cl. In water, HCl therefore readily gives up an H⁺ – it becomes hydrochloric acid."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Why does a microwave heat water but hardly a dry china plate?
    params:
      options:
        - label: The polar water molecules twist back and forth in the changing field and rub against each other
          correct: true
        - label: China reflects everything
          feedback: Microwaves mostly pass through it.
        - label: Water is lighter
          feedback: This has nothing to do with mass.
    hints:
      - A polar molecule has a plus end and a minus end.
      - The field flips billions of times per second.
    explanation: Microwaves oscillate 2.45 billion times per second. The dipoles turn along – motion becomes heat.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The rule of thumb is “like dissolves like”. So what removes an oil stain best?
    params:
      options:
        - label: With a non-polar solvent such as petrol – or with soap as a go-between
          correct: true
        - label: With lots of cold water
          feedback: Water is polar and beads off the oil.
        - label: With salt water
          feedback: Ions make water even more polar.
    hints:
      - Oil is non-polar.
    explanation: "Soap molecules form **micelles**: fat inside, the polar heads outside towards the water."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Every polar bond is a small arrow from δ+ to δ−. The arrows add up like forces. If they cancel, the molecule is non-polar. The sum is called the **dipole moment**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: buckets
    prompt: Each of these molecules has polar bonds. Which are polar overall?
    params:
      buckets:
        - id: b1
          label: polar
        - id: b2
          label: non-polar
      items:
        - label: H₂O (bent)
          bucket: b1
        - label: NH₃ (pyramid)
          bucket: b1
        - label: CH₂Cl₂
          bucket: b1
        - label: CO₂ (linear)
          bucket: b2
        - label: CCl₄ (tetrahedron)
          bucket: b2
        - label: BF₃ (flat triangle)
          bucket: b2
    hints:
      - Symmetrical shapes cancel all the arrows.
      - In CH₂Cl₂, two corners pull hard and two barely.
    explanation: CCl₄ is perfectly symmetrical, CH₂Cl₂ is not. Same bonds, different arrangement – different behaviour.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux when a molecule is polar.
    params:
      keywords:
        - - elektronegativ
          - electronegativ
          - zieht
          - pull
        - - bindung
          - bond
        - - symmetr
          - form
          - shape
          - aufheb
          - cancel
      sample: If one atom pulls the electrons harder because it is more electronegative, the bond becomes polar. But the molecule is only polar if its shape stops the bonds from cancelling – as in bent water, not in symmetrical CO₂.
    explanation: "Two conditions: polar bonds and an unsymmetrical shape."
    difficulty: 3

srs:
  cards_from: [oel, seife]
