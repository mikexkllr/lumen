id: chem.bonds.hbonds
type: concept
title: Wasserstoffbrücken
summary: Kleine Kräfte, große Wirkung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: siedepunkt
    widget: choice
    prompt: Wasser ist ein winziges Molekül, siedet aber erst bei 100 °C. Warum so spät?
    params:
      options:
        - { label: Die Moleküle halten über Wasserstoffbrücken zusammen., correct: true }
        - { label: Wassermoleküle sind sehr schwer., feedback: "H₂O ist leichter als Sauerstoffgas – und das siedet bei −183 °C." }
    hints:
      - Was muss beim Sieden überwunden werden?
    explanation: Das positive H eines Moleküls zieht das negative O des nächsten an – diese Brücken kosten Energie zum Lösen.

  - kind: explain
    id: s2
    body: |
      Eine **Wasserstoffbrücke** ist eine Anziehung zwischen Molekülen – viel schwächer als eine Bindung, aber in großer Zahl mächtig. Sie hält auch die beiden Stränge der DNA zusammen.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Ein Wassermolekül hat zwei H-Atome und zwei freie Elektronenpaare am O. Wie viele Wasserstoffbrücken kann es höchstens bilden?
    params: { unit: Brücken }
    answer: { value: 4 }
    hints:
      - Jedes H und jedes freie Elektronenpaar kann eine Brücke bilden.
    explanation: 2 + 2 = 4 – darum bildet Eis ein offenes, luftiges Gitter.

  - kind: problem
    id: eis
    widget: choice
    prompt: Warum schwimmt Eis auf Wasser?
    params:
      options:
        - { label: Im Eisgitter stehen die Moleküle weiter auseinander., correct: true }
        - { label: Eis enthält Luftblasen., feedback: "Auch blasenfreies Eis schwimmt." }
    hints:
      - Wie ordnen die Brücken die Moleküle im Kristall?
    explanation: Das Brücken-Gitter braucht mehr Platz als flüssiges Wasser – Eis ist weniger dicht.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Stärke – von schwach nach stark.
    params:
      items:
        - label: Anziehung zwischen Methan-Molekülen
        - label: Wasserstoffbrücke zwischen Wasser-Molekülen
        - label: Bindung im Wasser-Molekül selbst
    hints:
      - Eine Brücke ist stärker als gewöhnliche Anziehung, aber schwächer als eine Bindung.
    explanation: Darum siedet Wasser erst bei 100 °C, Methan schon bei −162 °C.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Methan CH₄ (16 u) siedet bei −162 °C, Wasser H₂O (18 u) bei +100 °C. Woher kommt der riesige Unterschied?
    params:
      options:
        - label: Wasser bildet Wasserstoffbrücken, Methan nicht
          correct: true
        - label: Wasser ist viel schwerer
          feedback: Beide wiegen fast gleich viel.
        - label: Methan ist instabil
          feedback: Methan ist stabil – nur halten seine Moleküle kaum aneinander.
    hints:
      - Die Massen sind fast gleich. Was unterscheidet die Moleküle?
    explanation: Ohne Wasserstoffbrücken wäre Wasser auf der Erde ein Gas – und es gäbe kein Leben.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Salz hält anders zusammen als Wasser. Was ist der Unterschied?"
    params:
      keywords:
        - - abgeb
          - übertrag
          - transfer
          - give
          - donat
          - aufnehm
        - - teil
          - gemeinsam
          - share
        - - ion
          - ladung
          - charge
          - plus
          - minus
          - anzieh
          - attract
      sample: Bei der Ionenbindung wird ein Elektron übertragen – es entstehen geladene Ionen, die sich anziehen. Bei der Elektronenpaarbindung teilen sich zwei Atome ein Elektronenpaar.
    difficulty: 3

srs:
  cards_from: [siedepunkt, eis]
