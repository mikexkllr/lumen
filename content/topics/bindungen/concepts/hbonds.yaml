id: chem.bonds.hbonds
type: concept
title: Wasserstoffbrücken
summary: Kleine Kräfte, große Wirkung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: siedepunkt
    widget: choice
    prompt: Wasser ist ein winziges Molekül, siedet aber erst bei 100 °C. Warum so spät?
    params:
      options:
        - { label: Die Moleküle halten über Wasserstoffbrücken zusammen., correct: true }
        - { label: Wassermoleküle sind sehr schwer., feedback: "H₂O ist leichter als Sauerstoffgas – und das siedet bei −183 °C." }
    hints:
      - Was muss beim Sieden überwunden werden?
    explanation: Das positive H eines Moleküls zieht das negative O des nächsten an – diese Brücken kosten Energie zum Lösen.

  - kind: explain
    id: s2
    body: |
      Eine **Wasserstoffbrücke** ist eine Anziehung zwischen Molekülen – viel schwächer als eine Bindung, aber in großer Zahl mächtig. Sie hält auch die beiden Stränge der DNA zusammen.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Ein Wassermolekül hat zwei H-Atome und zwei freie Elektronenpaare am O. Wie viele Wasserstoffbrücken kann es höchstens bilden?
    params: { unit: Brücken }
    answer: { value: 4 }
    hints:
      - Jedes H und jedes freie Elektronenpaar kann eine Brücke bilden.
    explanation: 2 + 2 = 4 – darum bildet Eis ein offenes, luftiges Gitter.

  - kind: problem
    id: eis
    widget: choice
    prompt: Warum schwimmt Eis auf Wasser?
    params:
      options:
        - { label: Im Eisgitter stehen die Moleküle weiter auseinander., correct: true }
        - { label: Eis enthält Luftblasen., feedback: "Auch blasenfreies Eis schwimmt." }
    hints:
      - Wie ordnen die Brücken die Moleküle im Kristall?
    explanation: Das Brücken-Gitter braucht mehr Platz als flüssiges Wasser – Eis ist weniger dicht.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Stärke – von schwach nach stark.
    params:
      items:
        - label: Anziehung zwischen Methan-Molekülen
        - label: Wasserstoffbrücke zwischen Wasser-Molekülen
        - label: Bindung im Wasser-Molekül selbst
    hints:
      - Eine Brücke ist stärker als gewöhnliche Anziehung, aber schwächer als eine Bindung.
    explanation: Darum siedet Wasser erst bei 100 °C, Methan schon bei −162 °C.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Methan CH₄ (16 u) siedet bei −162 °C, Wasser H₂O (18 u) bei +100 °C. Woher kommt der riesige Unterschied?
    params:
      options:
        - label: Wasser bildet Wasserstoffbrücken, Methan nicht
          correct: true
        - label: Wasser ist viel schwerer
          feedback: Beide wiegen fast gleich viel.
        - label: Methan ist instabil
          feedback: Methan ist stabil – nur halten seine Moleküle kaum aneinander.
    hints:
      - Die Massen sind fast gleich. Was unterscheidet die Moleküle?
    explanation: Ohne Wasserstoffbrücken wäre Wasser auf der Erde ein Gas – und es gäbe kein Leben.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Bei wie viel Grad Celsius würde Wasser sieden, wenn es keine Wasserstoffbrücken gäbe?"
    params:
      min: -150
      max: 150
      unit: °C
    answer:
      value: -80
      tolerance: 25
    explanation: Verlängert man die Reihe H₂Te, H₂Se, H₂S, landet man bei etwa −80 °C. Ohne Brücken gäbe es auf der Erde kein flüssiges Wasser.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Können die Moleküle untereinander Wasserstoffbrücken bilden?
    params:
      buckets:
        - id: b1
          label: ja
        - id: b2
          label: nein
      items:
        - label: Wasser H₂O
          bucket: b1
        - label: Ammoniak NH₃
          bucket: b1
        - label: Fluorwasserstoff HF
          bucket: b1
        - label: Ethanol C₂H₅OH
          bucket: b1
        - label: Methan CH₄
          bucket: b2
        - label: Wasserstoff H₂
          bucket: b2
        - label: Kohlendioxid CO₂
          bucket: b2
    hints:
      - Nötig ist ein H am stark elektronegativen N, O oder F.
      - Im CH₄ hängt das H am C – das reicht nicht.
    explanation: Wasserstoffbrücken brauchen ein stark positives H (an N, O oder F) und ein freies Paar am Nachbarn. CO₂ hat gar kein H.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: order
    prompt: Ordne nach dem Siedepunkt – den höchsten zuerst.
    params:
      items:
        - label: Wasser H₂O (+100 °C)
        - label: Fluorwasserstoff HF (+20 °C)
        - label: Ammoniak NH₃ (−33 °C)
        - label: Methan CH₄ (−162 °C)
    hints:
      - Die Temperaturen stehen dabei.
      - Wasser kann pro Molekül die meisten Brücken bilden.
    explanation: Wasser bildet bis zu vier Brücken pro Molekül, HF und NH₃ im Mittel weniger. Methan hat gar keine – und siedet weit unten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Salz hält anders zusammen als Wasser. Was ist der Unterschied?"
    params:
      keywords:
        - - abgeb
          - übertrag
          - transfer
          - give
          - donat
          - aufnehm
        - - teil
          - gemeinsam
          - share
        - - ion
          - ladung
          - charge
          - plus
          - minus
          - anzieh
          - attract
      sample: Bei der Ionenbindung wird ein Elektron übertragen – es entstehen geladene Ionen, die sich anziehen. Bei der Elektronenpaarbindung teilen sich zwei Atome ein Elektronenpaar.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Ein DNA-Stück hat {{at}} Basenpaare A–T (je 2 Brücken) und {{gc}} Paare G–C (je 3 Brücken). Wie viele Wasserstoffbrücken halten die Stränge?
    answer:
      value: "{{2 * at + 3 * gc}}"
    feedback:
      - when: numval(state.input) == 3 * at + 2 * gc
        misconception: pair-swap
        text: "Vertauscht: A–T hat 2, G–C hat 3 Brücken."
    hints:
      - Rechne beide Sorten einzeln.
      - "{{at}} · 2 + {{gc}} · 3."
    explanation: "{{2 * at}} + {{3 * gc}} = {{2 * at + 3 * gc}}. DNA mit viel G–C trennt sich erst bei höherer Temperatur."
    difficulty: 3
    variants:
      params:
        at: int[4,12]
        gc: int[3,12]
      constraints:
        - at != gc
      defaults:
        at: 10
        gc: 5

  - kind: explain
    id: ch-x2
    depth: 3
    body: Auch unpolare Moleküle ziehen sich an. Ihre Elektronenwolken schwanken ständig und bilden kurze Mini-Dipole, die Nachbarn mitziehen. Das sind die **London-Kräfte**. Je größer das Molekül, desto stärker wirken sie.

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Ein Gecko läuft an einer glatten Glasscheibe hoch – ohne Kleber und ohne Saugnäpfe. Was hält ihn?
    params:
      options:
        - label: Milliarden feinster Härchen, die über London-Kräfte am Glas haften
          correct: true
        - label: Wasserstoffbrücken
          feedback: Die Haftung klappt sogar auf wasserabweisenden Flächen.
        - label: Ionenbindungen
          feedback: Weder Fuß noch Glas geben dabei Elektronen ab.
    hints:
      - Jede einzelne Anziehung ist winzig.
      - Viele Kontakte auf kleinster Distanz summieren sich.
    explanation: Schwache Kräfte werden stark, wenn es genug von ihnen gibt. Forscher bauen danach Klebebänder ohne Klebstoff.
    difficulty: 3

srs:
  cards_from: [siedepunkt, eis]
