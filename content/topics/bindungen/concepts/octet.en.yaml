id: chem.bonds.octet
type: concept
title: The octet rule
summary: Atoms want a full shell.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Many atoms want eight electrons in their outer shell, like the noble gases. This is the **octet rule**. That is why atoms give up electrons, take some in, or share them.

  - kind: problem
    id: fehlen
    widget: numeric
    prompt: Chlorine has 7 outer electrons. How many are missing to reach eight?
    params: { unit: electrons }
    answer: { value: 1 }
    hints:
      - 8 − 7.
    explanation: Just one. Chlorine readily grabs one.

  - kind: problem
    id: natrium
    widget: choice
    prompt: Sodium has one outer electron. What is easier for sodium?
    params:
      options:
        - { label: Give up the one electron, correct: true }
        - { label: Take in seven electrons, feedback: "Seven extra charges would take far too much effort." }
    hints:
      - "Which costs less: losing one or gaining seven?"
    explanation: Without its outer electron, the shell below is full, as in neon.

  - kind: problem
    id: wer
    widget: buckets
    prompt: Does the atom tend to give up electrons or take them in?
    params:
      buckets: [{ label: gives up }, { label: takes in }]
      items:
        - { label: "Sodium (1 outer)", bucket: gives up }
        - { label: "Magnesium (2 outer)", bucket: gives up }
        - { label: "Oxygen (6 outer)", bucket: takes in }
        - { label: "Chlorine (7 outer)", bucket: takes in }
    hints:
      - Which is closer to 0, which closer to 8?
    explanation: Atoms with few outer electrons give them up. Atoms with nearly full shells fill them up.

srs:
  cards_from: [fehlen, wer]
