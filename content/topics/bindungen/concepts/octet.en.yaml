id: chem.bonds.octet
type: concept
title: The octet rule
summary: Atoms want a full shell.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alone or in pairs?
    body: "Most atoms do not like to stay alone. They give away **electrons**, take some in or share them. Uncover the cards: who looks for partners – and who stays a loner?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧂
            front: Table salt
            back: A metal that explodes in water plus a poisonous gas – together they season your food.
          - icon: 🎈
            front: Helium
            back: It always stays alone. Not even two helium atoms stick together.
          - icon: 🌬️
            front: Oxygen
            back: "In air it never floats alone, always as a pair: O₂."
          - icon: 💎
            front: Diamond
            back: Every carbon atom grips four neighbours – that is why it is so hard.

  - kind: problem
    id: hook
    widget: choice
    prompt: Noble gases like helium and neon almost never react. Why might that be?
    params:
      options:
        - label: Their outer shell is already full
          correct: true
        - label: They are too heavy
          feedback: Helium is very light.
        - label: They are too cold
          feedback: They do not react when warm either.
    hints:
      - Whoever has everything needs nothing more.
    explanation: All other atoms want to reach this state too.

  - kind: explain
    id: s1
    body: |
      Many atoms want eight electrons in their outer shell, like the noble gases. This is the **octet rule**. That is why atoms give up electrons, take some in, or share them.

  - kind: problem
    id: fehlen
    widget: numeric
    prompt: Chlorine has 7 outer electrons. How many are missing to reach eight?
    params: { unit: electrons }
    answer: { value: 1 }
    hints:
      - 8 − 7.
    explanation: Just one. Chlorine readily grabs one.

  - kind: problem
    id: natrium
    widget: choice
    prompt: Sodium has one outer electron. What is easier for sodium?
    params:
      options:
        - { label: Give up the one electron, correct: true }
        - { label: Take in seven electrons, feedback: "Seven extra charges would take far too much effort." }
    hints:
      - "Which costs less: losing one or gaining seven?"
    explanation: Without its outer electron, the shell below is full, as in neon.

  - kind: problem
    id: wer
    widget: buckets
    prompt: Does the atom tend to give up electrons or take them in?
    params:
      buckets: [{ label: gives up }, { label: takes in }]
      items:
        - { label: "Sodium (1 outer)", bucket: gives up }
        - { label: "Magnesium (2 outer)", bucket: gives up }
        - { label: "Oxygen (6 outer)", bucket: takes in }
        - { label: "Chlorine (7 outer)", bucket: takes in }
    hints:
      - Which is closer to 0, which closer to 8?
    explanation: Atoms with few outer electrons give them up. Atoms with nearly full shells fill them up.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Atoms strive for [[eight]] outer electrons – like the [[noble gases]]. To get there metals [[give away]] electrons.
      distractors:
        - six
        - halogens

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Aluminium has 3 outer electrons. What charge does its ion have? Enter the number with sign.
    answer:
      value: 3
    hints:
      - Three negative charges leave. What remains?
    explanation: Al³⁺. Giving away three electrons is easier than taking up five.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Ions reach the electron count of a noble gas. Which one?
    params:
      buckets:
        - id: b1
          label: like neon (10 electrons)
        - id: b2
          label: like argon (18 electrons)
      items:
        - label: Na⁺
          bucket: b1
        - label: Mg²⁺
          bucket: b1
        - label: O²⁻
          bucket: b1
        - label: F⁻
          bucket: b1
        - label: Cl⁻
          bucket: b2
        - label: K⁺
          bucket: b2
        - label: S²⁻
          bucket: b2
    hints:
      - "Count the electrons: atomic number minus charge."
      - "Na has 11 and gives one away: 10. Cl has 17 and takes one: 18."
    explanation: Metals drop back to the noble gas before them, non-metals move up to the noble gas after them.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: An oxygen atom (8 electrons) takes two electrons. How many electrons does the oxide ion O²⁻ have?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 6
        misconception: ion-sign
        text: Minus means electrons were added.
    hints:
      - A negative charge means extra electrons.
      - Work out 8 + 2.
    explanation: 8 + 2 = 10 electrons – just like neon.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: How many lone pairs does the oxygen atom have in a water molecule, H₂O?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 3
        misconception: lone-pair-count
        text: O has 6 outer electrons. Two of them are in the bonds.
    hints:
      - O has 6 outer electrons and forms 2 bonds.
      - O puts one electron into each bond. 6 − 2 = 4 electrons are left.
    explanation: The 4 leftover electrons form 2 lone pairs. With the 2 bonds, O again has 8 around it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Hydrogen strives for only **two** electrons, not eight. Why?
    params:
      options:
        - label: Its only shell is the first – and that is full with two
          correct: true
        - label: Hydrogen is not a real element
          feedback: It is the most common element of all.
        - label: The octet rule is wrong
          feedback: It is a rule of thumb for the second and third shell.
    hints:
      - How many electrons fit in the first shell?
    explanation: "Really the rule is: **full outer shell**. For helium and hydrogen that is two."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Add up all the outer electrons in a CO₂ molecule (C has 4, O has 6). How many are there?
    answer:
      value: 16
    feedback:
      - when: numval(state.input) == 10
        misconception: subscript-ignored
        text: There are two O atoms.
    hints:
      - 4 + 6 + 6.
      - These 16 electrons arrange into 8 pairs.
    explanation: "16 electrons, so 8 pairs: 4 in two double bonds O=C=O, and 4 as lone pairs on the O atoms. That gives every atom an octet."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: In BF₃, boron has only 6 outer electrons; in SF₆, sulfur even has 12. What does this show?
    params:
      options:
        - label: The octet rule is a rule of thumb – with exceptions
          correct: true
        - label: The formulas are wrong
          feedback: Both substances exist exactly like this.
        - label: Boron and sulfur are noble gases
          feedback: They are in groups 13 and 16.
    hints:
      - Boron has only 3 outer electrons to share.
      - From period 3 on, there is more room around the atom.
    explanation: So BF₃ eagerly grabs another electron pair. Large atoms like S or P can hold more than four partners.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why sodium gives an electron away while chlorine takes one.
    params:
      keywords:
        - - acht
          - oktett
          - octet
          - voll
          - full
          - eight
        - - abgeb
          - gibt
          - give
          - lose
        - - sieben
          - seven
          - fehlt
          - missing
          - nimmt
          - take
      sample: Sodium has only one outer electron. If it gives that one away, the shell below is full with eight. Chlorine has seven and is missing just one for an octet – so it takes one.
    explanation: Both take the shortest route to a full shell of eight.
    difficulty: 3

srs:
  cards_from: [fehlen, wer]
