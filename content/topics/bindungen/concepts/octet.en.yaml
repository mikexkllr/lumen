id: chem.bonds.octet
type: concept
title: The octet rule
summary: Atoms want a full shell.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Noble gases like helium and neon almost never react. Why might that be?
    params:
      options:
        - label: Their outer shell is already full
          correct: true
        - label: They are too heavy
          feedback: Helium is very light.
        - label: They are too cold
          feedback: They do not react when warm either.
    hints:
      - Whoever has everything needs nothing more.
    explanation: All other atoms want to reach this state too.

  - kind: explain
    id: s1
    body: |
      Many atoms want eight electrons in their outer shell, like the noble gases. This is the **octet rule**. That is why atoms give up electrons, take some in, or share them.

  - kind: problem
    id: fehlen
    widget: numeric
    prompt: Chlorine has 7 outer electrons. How many are missing to reach eight?
    params: { unit: electrons }
    answer: { value: 1 }
    hints:
      - 8 − 7.
    explanation: Just one. Chlorine readily grabs one.

  - kind: problem
    id: natrium
    widget: choice
    prompt: Sodium has one outer electron. What is easier for sodium?
    params:
      options:
        - { label: Give up the one electron, correct: true }
        - { label: Take in seven electrons, feedback: "Seven extra charges would take far too much effort." }
    hints:
      - "Which costs less: losing one or gaining seven?"
    explanation: Without its outer electron, the shell below is full, as in neon.

  - kind: problem
    id: wer
    widget: buckets
    prompt: Does the atom tend to give up electrons or take them in?
    params:
      buckets: [{ label: gives up }, { label: takes in }]
      items:
        - { label: "Sodium (1 outer)", bucket: gives up }
        - { label: "Magnesium (2 outer)", bucket: gives up }
        - { label: "Oxygen (6 outer)", bucket: takes in }
        - { label: "Chlorine (7 outer)", bucket: takes in }
    hints:
      - Which is closer to 0, which closer to 8?
    explanation: Atoms with few outer electrons give them up. Atoms with nearly full shells fill them up.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Atoms strive for [[eight]] outer electrons – like the [[noble gases]]. To get there metals [[give away]] electrons.
      distractors:
        - six
        - halogens

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Aluminium has 3 outer electrons. What charge does its ion have? Enter the number with sign.
    answer:
      value: 3
    hints:
      - Three negative charges leave. What remains?
    explanation: Al³⁺. Giving away three electrons is easier than taking up five.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Hydrogen strives for only **two** electrons, not eight. Why?
    params:
      options:
        - label: Its only shell is the first – and that is full with two
          correct: true
        - label: Hydrogen is not a real element
          feedback: It is the most common element of all.
        - label: The octet rule is wrong
          feedback: It is a rule of thumb for the second and third shell.
    hints:
      - How many electrons fit in the first shell?
    explanation: "Really the rule is: **full outer shell**. For helium and hydrogen that is two."
    difficulty: 3

srs:
  cards_from: [fehlen, wer]
