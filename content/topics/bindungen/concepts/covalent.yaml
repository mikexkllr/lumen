id: chem.bonds.covalent
type: concept
title: Elektronen teilen
summary: Die Elektronenpaarbindung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Feste Freundschaften
    body: Zwei Nichtmetalle geben keine Elektronen her. Trotzdem halten sie zusammen – in Zucker, Plastik und Diamant. Deck die Karten auf. Wie schaffen Atome so feste **Moleküle**?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💎
            front: Ein Riesenmolekül
            back: Ein Diamant ist ein einziges Molekül aus unzähligen fest verbundenen Kohlenstoffatomen.
          - icon: 🛍️
            front: Die Plastiktüte
            back: Ihre Ketten bestehen aus Tausenden Kohlenstoffatomen, eins am anderen.
          - icon: 🌬️
            front: Stickstoff
            back: Zwei N-Atome halten sich so fest, dass Pflanzen sie nicht trennen können.
          - icon: 🍬
            front: Zucker
            back: Ein Zuckermolekül hält 45 Atome zusammen – nur C, H und O, ganz ohne Metall.

  - kind: problem
    id: hook
    widget: choice
    prompt: Zwei Kinder wollen dasselbe Spielzeug. Keins gibt es her. Was ist die friedliche Lösung?
    params:
      options:
        - label: Sie teilen es
          correct: true
        - label: Eins nimmt es weg
          feedback: Keins ist stark genug dafür.
        - label: Beide gehen leer aus
          feedback: Dann hätte keins etwas davon.
    hints:
      - Beide wollen es – keins kann es allein haben.
    explanation: So machen es zwei Nichtmetall-Atome mit ihren Elektronen.

  - kind: explain
    id: s1
    body: |
      Zwei Nichtmetalle geben ungern Elektronen ab. Sie **teilen** sie lieber: Ein gemeinsames Elektronenpaar zählt für beide Atome. Das ist die **Elektronenpaarbindung**.

  - kind: problem
    id: kohlenstoff
    widget: numeric
    prompt: Kohlenstoff hat 4 Außenelektronen. Wie viele Bindungen bildet er, um auf 8 zu kommen?
    params: { unit: Bindungen }
    answer: { value: 4 }
    hints:
      - Jede Bindung bringt ein geteiltes Elektron dazu.
    explanation: 4 + 4 = 8 – darum bildet Kohlenstoff vier Bindungen, wie im Methan CH₄.

  - kind: problem
    id: wieviele
    widget: match
    prompt: Wie viele Bindungen bildet das Atom üblicherweise?
    params:
      pairs:
        - { left: Wasserstoff, right: "1" }
        - { left: Sauerstoff, right: "2" }
        - { left: Stickstoff, right: "3" }
        - { left: Kohlenstoff, right: "4" }
    hints:
      - Fehlende Elektronen bis zur vollen Schale – bei Wasserstoff ist voll schon bei 2.
    explanation: H₂O, NH₃, CH₄ – die Formeln folgen direkt daraus.

  - kind: problem
    id: wasser
    widget: choice
    prompt: Welche Bindung hält ein Wassermolekül H₂O zusammen?
    params:
      options:
        - { label: Elektronenpaarbindungen, correct: true }
        - { label: Ionenbindungen, feedback: "Sauerstoff und Wasserstoff sind Nichtmetalle – sie teilen." }
    hints:
      - Sind Metalle beteiligt?
    explanation: Sauerstoff teilt je ein Elektronenpaar mit zwei Wasserstoffatomen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Wasser H₂O
          right: true
        - text: Kochsalz NaCl
          right: false
        - text: Methan CH₄
          right: true
        - text: Magnesiumoxid MgO
          right: false
        - text: Sauerstoff O₂
          right: true
      left: Ionenbindung
      right: Elektronenpaarbindung

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Stickstoff N₂ ist extrem stabil. Jedes N-Atom hat 5 Außenelektronen. Wie viele Elektronenpaare teilen sich die beiden Atome?
    answer:
      value: 3
    hints:
      - Jedem Atom fehlen 3 Elektronen bis zur Acht.
    explanation: Eine **Dreifachbindung**. Sie zu brechen kostet so viel Energie, dass Pflanzen Luftstickstoff nicht direkt nutzen können.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: Elektronenpaare stoßen sich ab. Sie gehen um ein Atom so weit wie möglich auseinander. Daraus folgt die Form eines Moleküls. Das ist das **Elektronenpaar-Abstoßungsmodell**, kurz VSEPR.

  - kind: problem
    id: ch-d2
    depth: 2
    widget: match
    prompt: Welche Form hat das Molekül?
    params:
      pairs:
        - left: CO₂ (2 Partner, keine freien Paare)
          right: linear, 180°
        - left: BF₃ (3 Partner)
          right: flaches Dreieck, 120°
        - left: CH₄ (4 Partner)
          right: Tetraeder, 109,5°
        - left: NH₃ (3 Partner, 1 freies Paar)
          right: Pyramide, 107°
        - left: H₂O (2 Partner, 2 freie Paare)
          right: gewinkelt, 104,5°
    hints:
      - Zähle alle Elektronenpaare um das Zentralatom – auch die freien.
      - Vier Paare ergeben immer ein Tetraeder. Freie Paare sieht man nur nicht.
    explanation: CH₄, NH₃ und H₂O haben alle vier Paare. Nur zählt man bei der Form bloß die Atome.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: In NH₃ trägt das N drei Bindungen. Wie viele Elektronenpaare umgeben das N-Atom insgesamt – bindende und freie?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: lone-pair-ignored
        text: Das freie Elektronenpaar zählt mit.
    hints:
      - N hat 5 Außenelektronen. 3 stecken in Bindungen.
      - Die übrigen 2 bilden ein freies Paar.
    explanation: 3 bindende + 1 freies Paar = 4. Darum ist NH₃ eine Pyramide, kein flaches Dreieck.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Diamant und Graphit bestehen beide nur aus Kohlenstoff. Warum ist das eine das härteste Material und das andere schmiert?
    params:
      options:
        - label: Im Diamant ist jedes Atom in alle Raumrichtungen gebunden, im Graphit nur in Schichten
          correct: true
        - label: Diamant enthält ein härteres Isotop
          feedback: Die Isotope sind dieselben.
        - label: Graphit ist verunreinigt
          feedback: Auch reinster Graphit ist weich.
    hints:
      - Vier Bindungen in den Raum – oder drei in einer Ebene.
    explanation: "Dieselben Atome, andere Struktur: **Modifikationen**. Die Schichten des Graphits gleiten ab – so schreibt ein Bleistift."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: Methan hat Winkel von 109,5°, Wasser nur 104,5°. Beide haben vier Elektronenpaare. Warum ist Wasser enger?
    params:
      options:
        - label: Freie Paare brauchen mehr Platz und drücken die Bindungen zusammen
          correct: true
        - label: Wasserstoff ist größer als Kohlenstoff
          feedback: Am H liegt es nicht – in beiden Molekülen sind H-Atome.
        - label: Wasser hat weniger Elektronen
          feedback: Beide Zentralatome haben vier Paare.
    hints:
      - Ein freies Paar gehört nur einem Atom und sitzt nah am Kern.
      - "CH₄: 0 freie Paare, NH₃: 1, H₂O: 2."
    explanation: "109,5° → 107° → 104,5°: Jedes freie Paar drückt die Winkel weiter zusammen."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Eine C–C-Einfachbindung hält 348 kJ/mol, eine C≡C-Dreifachbindung 839 kJ/mol. Was folgt daraus?
    params:
      options:
        - label: Die zweite und dritte Bindung sind schwächer als die erste
          correct: true
        - label: Die Dreifachbindung ist genau dreimal so stark
          feedback: 3 · 348 wären 1044 kJ/mol.
        - label: Mehrfachbindungen sind schwächer als Einfachbindungen
          feedback: 839 ist mehr als 348.
    hints:
      - "Rechne 839 : 348."
      - Das sind nur etwa das 2,4-Fache.
    explanation: Die weiteren Bindungen liegen seitlich und überlappen schlechter. Darum reagieren Alkene und Alkine leicht an ihrer Mehrfachbindung.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Wasser gewinkelt ist, CO₂ aber gerade.
    params:
      keywords:
        - - paar
          - pair
        - - frei
          - lone
        - - abstoß
          - repel
          - auseinander
          - apart
        - - doppel
          - double
          - zwei
          - two
      sample: Elektronenpaare stoßen sich ab. Im Wasser hat das O vier Paare, davon zwei freie – das ergibt einen Knick. Im CO₂ hat das C keine freien Paare, nur zwei Doppelbindungen. Die zeigen genau auseinander.
    explanation: Freie Paare zählen für die Form mit, auch wenn man sie nicht sieht.
    difficulty: 3

srs:
  cards_from: [kohlenstoff, wieviele]
