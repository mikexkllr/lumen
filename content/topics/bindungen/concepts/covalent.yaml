id: chem.bonds.covalent
type: concept
title: Elektronen teilen
summary: Die Elektronenpaarbindung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Zwei Kinder wollen dasselbe Spielzeug. Keins gibt es her. Was ist die friedliche Lösung?
    params:
      options:
        - label: Sie teilen es
          correct: true
        - label: Eins nimmt es weg
          feedback: Keins ist stark genug dafür.
        - label: Beide gehen leer aus
          feedback: Dann hätte keins etwas davon.
    hints:
      - Beide wollen es – keins kann es allein haben.
    explanation: So machen es zwei Nichtmetall-Atome mit ihren Elektronen.


  - kind: explain
    id: s1
    body: |
      Zwei Nichtmetalle geben ungern Elektronen ab. Sie **teilen** sie lieber: Ein gemeinsames Elektronenpaar zählt für beide Atome. Das ist die **Elektronenpaarbindung**.

  - kind: problem
    id: kohlenstoff
    widget: numeric
    prompt: Kohlenstoff hat 4 Außenelektronen. Wie viele Bindungen bildet er, um auf 8 zu kommen?
    params: { unit: Bindungen }
    answer: { value: 4 }
    hints:
      - Jede Bindung bringt ein geteiltes Elektron dazu.
    explanation: 4 + 4 = 8 – darum bildet Kohlenstoff vier Bindungen, wie im Methan CH₄.

  - kind: problem
    id: wieviele
    widget: match
    prompt: Wie viele Bindungen bildet das Atom üblicherweise?
    params:
      pairs:
        - { left: Wasserstoff, right: "1" }
        - { left: Sauerstoff, right: "2" }
        - { left: Stickstoff, right: "3" }
        - { left: Kohlenstoff, right: "4" }
    hints:
      - Fehlende Elektronen bis zur vollen Schale – bei Wasserstoff ist voll schon bei 2.
    explanation: H₂O, NH₃, CH₄ – die Formeln folgen direkt daraus.

  - kind: problem
    id: wasser
    widget: choice
    prompt: Welche Bindung hält ein Wassermolekül H₂O zusammen?
    params:
      options:
        - { label: Elektronenpaarbindungen, correct: true }
        - { label: Ionenbindungen, feedback: "Sauerstoff und Wasserstoff sind Nichtmetalle – sie teilen." }
    hints:
      - Sind Metalle beteiligt?
    explanation: Sauerstoff teilt je ein Elektronenpaar mit zwei Wasserstoffatomen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Wasser H₂O
          right: true
        - text: Kochsalz NaCl
          right: false
        - text: Methan CH₄
          right: true
        - text: Magnesiumoxid MgO
          right: false
        - text: Sauerstoff O₂
          right: true
      left: Ionenbindung
      right: Elektronenpaarbindung

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Stickstoff N₂ ist extrem stabil. Jedes N-Atom hat 5 Außenelektronen. Wie viele Elektronenpaare teilen sich die beiden Atome?
    answer:
      value: 3
    hints:
      - Jedem Atom fehlen 3 Elektronen bis zur Acht.
    explanation: Eine **Dreifachbindung**. Sie zu brechen kostet so viel Energie, dass Pflanzen Luftstickstoff nicht direkt nutzen können.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Diamant und Graphit bestehen beide nur aus Kohlenstoff. Warum ist das eine das härteste Material und das andere schmiert?
    params:
      options:
        - label: Im Diamant ist jedes Atom in alle Raumrichtungen gebunden, im Graphit nur in Schichten
          correct: true
        - label: Diamant enthält ein härteres Isotop
          feedback: Die Isotope sind dieselben.
        - label: Graphit ist verunreinigt
          feedback: Auch reinster Graphit ist weich.
    hints:
      - Vier Bindungen in den Raum – oder drei in einer Ebene.
    explanation: "Dieselben Atome, andere Struktur: **Modifikationen**. Die Schichten des Graphits gleiten ab – so schreibt ein Bleistift."
    difficulty: 3

srs:
  cards_from: [kohlenstoff, wieviele]
