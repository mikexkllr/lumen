id: chem.bonds.ionic
type: concept
title: Ionic bonds
summary: Plus and minus stick together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The salt lattice
    body: A grain of salt is a lattice of two kinds of particles that attract each other. One tap colours a cell dark, two taps light. Build a **lattice** where two equal cells never sit side by side.
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 4
        cols: 4
        shades: 3

  - kind: problem
    id: ladung
    widget: choice
    prompt: Sodium gives one electron to chlorine. What charges do the two have afterward?
    params:
      options:
        - { label: "Na⁺ and Cl⁻", correct: true }
        - { label: "Na⁻ and Cl⁺", feedback: "An atom that loses a negative electron becomes positive." }
        - { label: Both neutral, feedback: "One electron has moved, and so has the charge." }
    hints:
      - An electron is negatively charged.
    explanation: Charged atoms are called **ions**. Plus and minus attract each other. That is table salt.

  - kind: explain
    id: s2
    body: |
      In an **ionic bond**, positive and negative ions hold together by attraction. They form a solid lattice, so salts are hard and melt only at high temperatures.

  - kind: problem
    id: mgcl
    widget: numeric
    prompt: Magnesium gives up two electrons and becomes Mg²⁺. How many Cl⁻ ions does it need for a neutral compound?
    params: { unit: ions }
    answer: { value: 2 }
    hints:
      - Two pluses need two minuses.
    explanation: MgCl₂ – one magnesium, two chlorine.

  - kind: problem
    id: salz
    widget: choice
    prompt: Salt as a crystal does not conduct electricity, but dissolved in water it does. Why?
    params:
      options:
        - { label: "In water, the ions can move freely.", correct: true }
        - { label: Water itself conducts very well., feedback: "Pure water hardly conducts. The dissolved ions do." }
    hints:
      - What must be able to move for a current to flow?
    explanation: In the crystal the ions are fixed. Dissolved, they move and carry current.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Do ions hold this together?
    params:
      buckets:
        - id: b1
          label: Ionic bond
        - id: b2
          label: No ionic bond
      items:
        - label: Table salt (NaCl)
          bucket: b1
        - label: Water (H₂O)
          bucket: b2
        - label: Magnesium oxide (MgO)
          bucket: b1
        - label: Methane (CH₄)
          bucket: b2
        - label: Potassium chloride (KCl)
          bucket: b1
    hints:
      - Ionic bonds form between a metal and a non-metal.
    explanation: Sodium, magnesium and potassium are metals. They give up electrons.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Aluminium oxide consists of Al³⁺ and O²⁻. In what ratio do they combine? Give how many O²⁻ go with **two** Al³⁺.
    answer:
      value: 3
    hints:
      - Two Al³⁺ carry +6. How many −2 balance that?
    explanation: "Al₂O₃: +6 and −6. The charges must cancel."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: match
    prompt: Which formula belongs to which salt?
    params:
      pairs:
        - left: Sodium chloride (Na⁺, Cl⁻)
          right: NaCl
        - left: Magnesium oxide (Mg²⁺, O²⁻)
          right: MgO
        - left: Calcium chloride (Ca²⁺, Cl⁻)
          right: CaCl₂
        - left: Aluminium oxide (Al³⁺, O²⁻)
          right: Al₂O₃
    hints:
      - The positive and negative charges must cancel out.
      - Ca²⁺ needs two Cl⁻.
    explanation: "Al₂O₃: 2 · (+3) = +6 and 3 · (−2) = −6. The formula shows the smallest neutral ratio."
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ions with charges {{a}}+ and {{b}}− form a neutral salt. How many ions are in the smallest neutral formula unit?
    answer:
      value: "{{n}}"
    feedback:
      - when: numval(state.input) == a + b && a + b != n
        misconception: not-reduced
        text: The ratio can still be reduced.
    hints:
      - "Find the lowest common multiple of the charges: {{lcm(a, b)}}."
      - "{{lcm(a, b) / a}} cations and {{lcm(a, b) / b}} anions."
    explanation: "{{lcm(a, b) / a}} + {{lcm(a, b) / b}} = {{n}} ions. Then {{lcm(a, b)}} positive and {{lcm(a, b)}} negative charges cancel."
    difficulty: 2
    variants:
      params:
        a: int[1,3]
        b: int[1,3]
      derive:
        n: lcm(a, b) / a + lcm(a, b) / b
      defaults:
        a: 3
        b: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Table salt NaCl melts at 801 °C, magnesium oxide MgO only at 2852 °C. Why the huge difference?
    params:
      options:
        - label: The ions in MgO carry double charges and are smaller – they attract each other far more strongly
          correct: true
        - label: MgO is heavier
          feedback: Mass hardly matters here.
        - label: MgO is not a salt
          feedback: MgO is a typical ionic lattice.
    hints:
      - "Compare the charges: +1/−1 versus +2/−2."
      - The stronger the attraction, the more heat melting needs.
    explanation: "That is why furnaces are lined with MgO: it withstands temperatures at which steel is long since liquid."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does a salt crystal shatter when hit with a hammer while metal bends?
    params:
      options:
        - label: Shifting the layers puts like charges side by side and they repel
          correct: true
        - label: Salt is softer than metal
          feedback: Salt crystals are hard – but brittle.
        - label: Salt contains air bubbles
          feedback: A crystal is densely packed.
    hints:
      - In the lattice plus and minus alternate. What happens if you shift by one place?
    explanation: In a metal the layers slide in a “sea” of free electrons – that is why it is malleable.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "The attraction between two ions grows with the product of their charges and falls with distance: $F \\sim \\frac{q_1 \\cdot q_2}{r^2}$. This is **Coulomb's law**."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: Compare Mg²⁺/O²⁻ with Na⁺/Cl⁻ at the same distance. By what factor is the attraction stronger?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: product-not-sum
        text: Both charges double – so the product quadruples.
    hints:
      - "Multiply the charges: 2 · 2 versus 1 · 1."
      - The ratio of the products is the factor.
    explanation: "4 : 1. Since the ions in MgO are also smaller, the attraction is stronger still."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: buckets
    prompt: "Rule of thumb by electronegativity difference ΔEN: above 1.7 ionic, 0.5 to 1.7 polar, below that non-polar. Sort them."
    params:
      buckets:
        - id: b1
          label: ionic
        - id: b2
          label: polar
        - id: b3
          label: non-polar
      items:
        - label: KF (ΔEN 3.2)
          bucket: b1
        - label: NaCl (ΔEN 2.2)
          bucket: b1
        - label: O–H (ΔEN 1.2)
          bucket: b2
        - label: H–Cl (ΔEN 1.0)
          bucket: b2
        - label: C–H (ΔEN 0.4)
          bucket: b3
        - label: Cl–Cl (ΔEN 0)
          bucket: b3
    hints:
      - Two identical atoms pull equally hard.
      - A large gap means one atom snatches the electrons completely.
    explanation: "The boundaries are fuzzy: ionic and covalent bonds are two ends of one scale. C–H at 0.35 counts as practically non-polar."
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why a salt crystal is hard yet shatters instead of bending.
    params:
      keywords:
        - - ion
          - ladung
          - charge
          - plus
          - minus
        - - anzieh
          - attract
          - zusammen
          - hold
        - - verschieb
          - schicht
          - shift
          - layer
          - abstoß
          - repel
      sample: In the crystal, plus and minus ions attract strongly, so it is hard. If a blow shifts a layer, like charges end up side by side and repel – the crystal breaks.
    explanation: Strong attraction makes it hard, the rigid order makes it brittle.
    difficulty: 3

srs:
  cards_from: [ladung, mgcl]
