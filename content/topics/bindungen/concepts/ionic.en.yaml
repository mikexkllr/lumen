id: chem.bonds.ionic
type: concept
title: Ionic bonds
summary: Plus and minus stick together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: ladung
    widget: choice
    prompt: Sodium gives one electron to chlorine. What charges do the two have afterward?
    params:
      options:
        - { label: "Na⁺ and Cl⁻", correct: true }
        - { label: "Na⁻ and Cl⁺", feedback: "An atom that loses a negative electron becomes positive." }
        - { label: Both neutral, feedback: "One electron has moved, and so has the charge." }
    hints:
      - An electron is negatively charged.
    explanation: Charged atoms are called **ions**. Plus and minus attract each other. That is table salt.

  - kind: explain
    id: s2
    body: |
      In an **ionic bond**, positive and negative ions hold together by attraction. They form a solid lattice, so salts are hard and melt only at high temperatures.

  - kind: problem
    id: mgcl
    widget: numeric
    prompt: Magnesium gives up two electrons and becomes Mg²⁺. How many Cl⁻ ions does it need for a neutral compound?
    params: { unit: ions }
    answer: { value: 2 }
    hints:
      - Two pluses need two minuses.
    explanation: MgCl₂ – one magnesium, two chlorine.

  - kind: problem
    id: salz
    widget: choice
    prompt: Salt as a crystal does not conduct electricity, but dissolved in water it does. Why?
    params:
      options:
        - { label: "In water, the ions can move freely.", correct: true }
        - { label: Water itself conducts very well., feedback: "Pure water hardly conducts. The dissolved ions do." }
    hints:
      - What must be able to move for a current to flow?
    explanation: In the crystal the ions are fixed. Dissolved, they move and carry current.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Aluminium oxide consists of Al³⁺ and O²⁻. In what ratio do they combine? Give how many O²⁻ go with **two** Al³⁺.
    answer:
      value: 3
    hints:
      - Two Al³⁺ carry +6. How many −2 balance that?
    explanation: "Al₂O₃: +6 and −6. The charges must cancel."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does a salt crystal shatter when hit with a hammer while metal bends?
    params:
      options:
        - label: Shifting the layers puts like charges side by side and they repel
          correct: true
        - label: Salt is softer than metal
          feedback: Salt crystals are hard – but brittle.
        - label: Salt contains air bubbles
          feedback: A crystal is densely packed.
    hints:
      - In the lattice plus and minus alternate. What happens if you shift by one place?
    explanation: In a metal the layers slide in a “sea” of free electrons – that is why it is malleable.
    difficulty: 3

srs:
  cards_from: [ladung, mgcl]
