id: chem.bonds.polar
type: concept
title: Polare Moleküle
summary: Warum Öl und Wasser sich nicht mischen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Sauerstoff zieht die geteilten Elektronen stärker an als Wasserstoff. Das Wassermolekül hat dadurch eine leicht negative und eine leicht positive Seite – es ist **polar**.

  - kind: problem
    id: oel
    widget: choice
    prompt: Warum mischen sich Öl und Wasser nicht?
    params:
      options:
        - { label: "Wasser ist polar, Öl nicht.", correct: true }
        - { label: Öl ist schwerer als Wasser., feedback: "Öl ist leichter – es schwimmt oben. Mischen würde es trotzdem nicht." }
        - { label: Öl ist zu warm., feedback: "Auch kaltes Öl mischt sich nicht." }
    hints:
      - Wassermoleküle halten lieber aneinander fest als an Öl.
    explanation: Wassermoleküle ziehen sich gegenseitig an und drängen das unpolare Öl heraus.

  - kind: problem
    id: loesen
    widget: buckets
    prompt: Löst sich das in Wasser?
    params:
      buckets: [{ label: löst sich }, { label: löst sich nicht }]
      items:
        - { label: Kochsalz, bucket: löst sich }
        - { label: Zucker, bucket: löst sich }
        - { label: Speiseöl, bucket: löst sich nicht }
        - { label: Kerzenwachs, bucket: löst sich nicht }
    hints:
      - Gleiches löst sich in Gleichem.
    explanation: Polare Stoffe und Ionen lösen sich in Wasser, unpolare nicht.

  - kind: problem
    id: seife
    widget: choice
    prompt: Wie bekommt Seife Fett von den Händen?
    params:
      options:
        - { label: Sie hat ein polares und ein unpolares Ende., correct: true }
        - { label: Sie verbrennt das Fett., feedback: "Es passiert keine Verbrennung – Seife vermittelt." }
    hints:
      - Seife muss sich mit Fett und mit Wasser vertragen.
    explanation: Ein Ende hält das Fett, das andere das Wasser – so spült das Wasser das Fett weg.

srs:
  cards_from: [oel, seife]
