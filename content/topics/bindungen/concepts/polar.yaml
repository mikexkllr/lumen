id: chem.bonds.polar
type: concept
title: Polare Moleküle
summary: Warum Öl und Wasser sich nicht mischen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein geriebener Luftballon lenkt einen dünnen Wasserstrahl ab. Warum?
    params:
      options:
        - label: Wassermoleküle haben eine positive und eine negative Seite
          correct: true
        - label: Wasser ist magnetisch
          feedback: Ein Magnet lenkt Wasser nicht ab.
        - label: Der Ballon bläst Luft
          feedback: Er ist zugeknotet.
    hints:
      - Der Ballon ist elektrisch geladen.
    explanation: Die geladene Seite der Moleküle wird angezogen.

  - kind: explain
    id: s1
    body: |
      Sauerstoff zieht die geteilten Elektronen stärker an als Wasserstoff. Das Wassermolekül hat dadurch eine leicht negative und eine leicht positive Seite – es ist **polar**.

  - kind: problem
    id: oel
    widget: choice
    prompt: Warum mischen sich Öl und Wasser nicht?
    params:
      options:
        - { label: "Wasser ist polar, Öl nicht.", correct: true }
        - { label: Öl ist schwerer als Wasser., feedback: "Öl ist leichter – es schwimmt oben. Mischen würde es trotzdem nicht." }
        - { label: Öl ist zu warm., feedback: "Auch kaltes Öl mischt sich nicht." }
    hints:
      - Wassermoleküle halten lieber aneinander fest als an Öl.
    explanation: Wassermoleküle ziehen sich gegenseitig an und drängen das unpolare Öl heraus.

  - kind: problem
    id: loesen
    widget: buckets
    prompt: Löst sich das in Wasser?
    params:
      buckets: [{ label: löst sich }, { label: löst sich nicht }]
      items:
        - { label: Kochsalz, bucket: löst sich }
        - { label: Zucker, bucket: löst sich }
        - { label: Speiseöl, bucket: löst sich nicht }
        - { label: Kerzenwachs, bucket: löst sich nicht }
    hints:
      - Gleiches löst sich in Gleichem.
    explanation: Polare Stoffe und Ionen lösen sich in Wasser, unpolare nicht.

  - kind: problem
    id: seife
    widget: choice
    prompt: Wie bekommt Seife Fett von den Händen?
    params:
      options:
        - { label: Sie hat ein polares und ein unpolares Ende., correct: true }
        - { label: Sie verbrennt das Fett., feedback: "Es passiert keine Verbrennung – Seife vermittelt." }
    hints:
      - Seife muss sich mit Fett und mit Wasser vertragen.
    explanation: Ein Ende hält das Fett, das andere das Wasser – so spült das Wasser das Fett weg.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Polar oder unpolar?
    params:
      buckets:
        - id: b1
          label: Polar
        - id: b2
          label: Unpolar
      items:
        - label: Wasser (H₂O)
          bucket: b1
        - label: Methan (CH₄)
          bucket: b2
        - label: Ammoniak (NH₃)
          bucket: b1
        - label: Sauerstoff (O₂)
          bucket: b2
        - label: Chlorwasserstoff (HCl)
          bucket: b1
    hints:
      - Zieht ein Atom die Elektronen stärker zu sich?
    explanation: Zwei gleiche Atome ziehen gleich stark. Dann gibt es keine geladene Seite.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Gleiches löst sich in [[Gleichem]]: Wasser löst Zucker, aber kein [[Öl]]."
      distractors:
        - Fremdem
        - Salz

  - kind: problem
    id: mix-c3
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Wasser ist ein polares Molekül.
          right: true
        - text: Öl und Wasser mischen sich gut.
          right: false
          why: Öl ist unpolar, Wasser polar.
        - text: Seife hat ein polares und ein unpolares Ende.
          right: true
        - text: In einem polaren Molekül sind die Elektronen gleich verteilt.
          right: false
          why: Sie sitzen näher bei einem der Atome.
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: CO₂ hat zwei polare Bindungen, ist aber insgesamt **nicht** polar. Warum?
    params:
      options:
        - label: Das Molekül ist gerade – die beiden Züge heben sich genau auf
          correct: true
        - label: Kohlenstoff und Sauerstoff ziehen gleich stark
          feedback: Sauerstoff zieht deutlich stärker.
        - label: CO₂ ist ein Gas, und Gase sind nie polar
          feedback: Wasserdampf ist ein Gas und polar.
    hints:
      - O=C=O ist linear. Wasser dagegen ist gewinkelt.
    explanation: Polarität hängt von der **Form** ab. Im gewinkelten Wasser addieren sich die Züge.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: "Elektronegativität: H 2,2 · C 2,6 · Cl 3,2 · O 3,4 · F 4,0. Wie groß ist der Unterschied ΔEN in der Bindung H–{{el}}?"
    answer:
      value: "{{en - 2.2}}"
      tolerance: 0.01
    hints:
      - Ziehe den kleineren Wert vom größeren ab.
      - Rechne {{en}} − 2,2.
    explanation: ΔEN = {{en}} − 2,2 = {{en - 2.2}}. Je größer der Unterschied, desto stärker zieht {{el}} die Elektronen zu sich.
    difficulty: 2
    variants:
      params:
        i: int[0,3]
      derive:
        el: '["C", "Cl", "O", "F"][i]'
        en: "[2.6, 3.2, 3.4, 4.0][i]"
      defaults:
        i: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: "In der Bindung H–Cl: Welches Atom trägt die negative Teilladung δ−?"
    params:
      options:
        - label: Das Chloratom
          correct: true
        - label: Das Wasserstoffatom
          feedback: H zieht schwächer – die Elektronen rücken von ihm weg.
        - label: Keines, beide sind gleich
          feedback: Cl ist deutlich elektronegativer.
    hints:
      - Die Elektronen rücken zum stärker ziehenden Atom.
      - Cl hat 3,2, H nur 2,2.
    explanation: "H–Cl ist polar: δ+ am H, δ− am Cl. In Wasser gibt HCl darum leicht ein H⁺ ab – es wird zu Salzsäure."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Warum macht die Mikrowelle Wasser heiß, aber kaum einen leeren Teller aus Porzellan?
    params:
      options:
        - label: Die polaren Wassermoleküle drehen sich im wechselnden Feld hin und her und reiben
          correct: true
        - label: Porzellan reflektiert alles
          feedback: Mikrowellen gehen weitgehend hindurch.
        - label: Wasser ist leichter
          feedback: Mit der Masse hat das nichts zu tun.
    hints:
      - Ein polares Molekül hat ein Plus- und ein Minus-Ende.
      - Das Feld kippt Milliarden Mal pro Sekunde.
    explanation: Mikrowellen schwingen 2,45 Milliarden Mal pro Sekunde. Die Dipole drehen mit – Bewegung wird Wärme.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Faustregel heißt »Gleiches löst Gleiches«. Womit entfernt man also einen Ölfleck am besten?
    params:
      options:
        - label: Mit einem unpolaren Lösungsmittel wie Benzin – oder mit Seife als Vermittler
          correct: true
        - label: Mit viel kaltem Wasser
          feedback: Wasser ist polar und perlt am Öl ab.
        - label: Mit Salzwasser
          feedback: Ionen machen Wasser noch polarer.
    hints:
      - Öl ist unpolar.
    explanation: "Seifenmoleküle bilden **Mizellen**: Fett innen, die polaren Köpfe außen zum Wasser."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Jede polare Bindung ist ein kleiner Pfeil vom δ+ zum δ−. Die Pfeile addieren sich wie Kräfte. Heben sie sich auf, ist das Molekül unpolar. Die Summe heißt **Dipolmoment**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: buckets
    prompt: Polare Bindungen hat jedes dieser Moleküle. Welche sind insgesamt polar?
    params:
      buckets:
        - id: b1
          label: polar
        - id: b2
          label: unpolar
      items:
        - label: H₂O (gewinkelt)
          bucket: b1
        - label: NH₃ (Pyramide)
          bucket: b1
        - label: CH₂Cl₂
          bucket: b1
        - label: CO₂ (linear)
          bucket: b2
        - label: CCl₄ (Tetraeder)
          bucket: b2
        - label: BF₃ (flaches Dreieck)
          bucket: b2
    hints:
      - Symmetrische Formen heben alle Pfeile auf.
      - In CH₂Cl₂ ziehen zwei Ecken stark, zwei kaum.
    explanation: CCl₄ ist vollkommen symmetrisch, CH₂Cl₂ nicht. Gleiche Bindungen, andere Verteilung – anderes Verhalten.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wann ein Molekül polar ist.
    params:
      keywords:
        - - elektronegativ
          - electronegativ
          - zieht
          - pull
        - - bindung
          - bond
        - - symmetr
          - form
          - shape
          - aufheb
          - cancel
      sample: Zieht ein Atom die Elektronen stärker an, weil es elektronegativer ist, wird die Bindung polar. Das Molekül ist aber nur polar, wenn sich die Bindungen wegen seiner Form nicht aufheben – wie bei gewinkeltem Wasser, nicht beim symmetrischen CO₂.
    explanation: "Zwei Bedingungen: polare Bindungen und eine unsymmetrische Form."
    difficulty: 3

srs:
  cards_from: [oel, seife]
