id: chem.bonds.octet
type: concept
title: Die Achter-Regel
summary: Atome wollen eine volle Schale.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Edelgase wie Helium und Neon reagieren fast nie. Warum wohl?
    params:
      options:
        - label: Ihre äußere Schale ist schon voll
          correct: true
        - label: Sie sind zu schwer
          feedback: Helium ist sehr leicht.
        - label: Sie sind zu kalt
          feedback: Auch warm reagieren sie nicht.
    hints:
      - Wer schon alles hat, braucht nichts mehr.
    explanation: Alle anderen Atome wollen diesen Zustand auch erreichen.

  - kind: explain
    id: s1
    body: |
      Viele Atome wollen acht Elektronen außen – so wie die Edelgase. Das ist die **Oktettregel**. Darum geben Atome Elektronen ab, nehmen welche auf oder teilen sie.

  - kind: problem
    id: fehlen
    widget: numeric
    prompt: Chlor hat 7 Außenelektronen. Wie viele fehlen bis zur Acht?
    params: { unit: Elektronen }
    answer: { value: 1 }
    hints:
      - 8 − 7.
    explanation: Ein einziges – Chlor schnappt sich gern eins.

  - kind: problem
    id: natrium
    widget: choice
    prompt: Natrium hat ein Außenelektron. Was ist für Natrium einfacher?
    params:
      options:
        - { label: Das eine Elektron abgeben, correct: true }
        - { label: Sieben Elektronen aufnehmen, feedback: "Sieben zusätzliche Ladungen wären viel zu aufwendig." }
    hints:
      - Was kostet weniger – eins weg oder sieben dazu?
    explanation: Ohne das Außenelektron ist die Schale darunter voll – wie bei Neon.

  - kind: problem
    id: wer
    widget: buckets
    prompt: Gibt das Atom eher Elektronen ab oder nimmt es welche auf?
    params:
      buckets: [{ label: gibt ab }, { label: nimmt auf }]
      items:
        - { label: "Natrium (1 außen)", bucket: gibt ab }
        - { label: "Magnesium (2 außen)", bucket: gibt ab }
        - { label: "Sauerstoff (6 außen)", bucket: nimmt auf }
        - { label: "Chlor (7 außen)", bucket: nimmt auf }
    hints:
      - Wer ist näher an 0, wer näher an 8?
    explanation: Wenige Außenelektronen gibt man ab, fast volle Schalen füllt man auf.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Atome streben [[acht]] Außenelektronen an – wie die [[Edelgase]]. Metalle geben dafür Elektronen [[ab]].
      distractors:
        - sechs
        - Halogene

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Aluminium hat 3 Außenelektronen. Welche Ladung hat sein Ion? Gib die Zahl mit Vorzeichen an.
    answer:
      value: 3
    hints:
      - Drei negative Ladungen gehen weg. Was bleibt übrig?
    explanation: Al³⁺. Drei Elektronen abgeben ist leichter als fünf aufnehmen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wasserstoff strebt nur **zwei** Elektronen an, nicht acht. Warum?
    params:
      options:
        - label: Seine einzige Schale ist die erste – und die ist mit zwei voll
          correct: true
        - label: Wasserstoff ist kein richtiges Element
          feedback: Es ist das häufigste Element überhaupt.
        - label: Die Oktettregel ist falsch
          feedback: Sie ist eine Faustregel für die zweite und dritte Schale.
    hints:
      - Wie viele Elektronen passen in die erste Schale?
    explanation: "Eigentlich heißt die Regel: **volle Außenschale**. Bei Helium und Wasserstoff sind das zwei."
    difficulty: 3

srs:
  cards_from: [fehlen, wer]
