id: chem.bonds.octet
type: concept
title: Die Achter-Regel
summary: Atome wollen eine volle Schale.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Allein oder zu zweit?
    body: "Die meisten Atome bleiben nicht gern allein. Sie geben **Elektronen** ab, nehmen welche auf oder teilen sie. Deck die Karten auf: Wer sucht sich Partner – und wer bleibt Einzelgänger?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧂
            front: Kochsalz
            back: Ein Metall, das in Wasser explodiert, plus ein giftiges Gas – zusammen würzt es dein Essen.
          - icon: 🎈
            front: Helium
            back: Es bleibt immer allein. Nicht einmal zwei Heliumatome halten zusammen.
          - icon: 🌬️
            front: Sauerstoff
            back: "In der Luft schwebt er nie einzeln, sondern immer als Paar: O₂."
          - icon: 💎
            front: Diamant
            back: Jedes Kohlenstoffatom hält vier Nachbarn fest – darum ist er so hart.

  - kind: problem
    id: hook
    widget: choice
    prompt: Edelgase wie Helium und Neon reagieren fast nie. Warum wohl?
    params:
      options:
        - label: Ihre äußere Schale ist schon voll
          correct: true
        - label: Sie sind zu schwer
          feedback: Helium ist sehr leicht.
        - label: Sie sind zu kalt
          feedback: Auch warm reagieren sie nicht.
    hints:
      - Wer schon alles hat, braucht nichts mehr.
    explanation: Alle anderen Atome wollen diesen Zustand auch erreichen.

  - kind: explain
    id: s1
    body: |
      Viele Atome wollen acht Elektronen außen – so wie die Edelgase. Das ist die **Oktettregel**. Darum geben Atome Elektronen ab, nehmen welche auf oder teilen sie.

  - kind: problem
    id: fehlen
    widget: numeric
    prompt: Chlor hat 7 Außenelektronen. Wie viele fehlen bis zur Acht?
    params: { unit: Elektronen }
    answer: { value: 1 }
    hints:
      - 8 − 7.
    explanation: Ein einziges – Chlor schnappt sich gern eins.

  - kind: problem
    id: natrium
    widget: choice
    prompt: Natrium hat ein Außenelektron. Was ist für Natrium einfacher?
    params:
      options:
        - { label: Das eine Elektron abgeben, correct: true }
        - { label: Sieben Elektronen aufnehmen, feedback: "Sieben zusätzliche Ladungen wären viel zu aufwendig." }
    hints:
      - Was kostet weniger – eins weg oder sieben dazu?
    explanation: Ohne das Außenelektron ist die Schale darunter voll – wie bei Neon.

  - kind: problem
    id: wer
    widget: buckets
    prompt: Gibt das Atom eher Elektronen ab oder nimmt es welche auf?
    params:
      buckets: [{ label: gibt ab }, { label: nimmt auf }]
      items:
        - { label: "Natrium (1 außen)", bucket: gibt ab }
        - { label: "Magnesium (2 außen)", bucket: gibt ab }
        - { label: "Sauerstoff (6 außen)", bucket: nimmt auf }
        - { label: "Chlor (7 außen)", bucket: nimmt auf }
    hints:
      - Wer ist näher an 0, wer näher an 8?
    explanation: Wenige Außenelektronen gibt man ab, fast volle Schalen füllt man auf.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Atome streben [[acht]] Außenelektronen an – wie die [[Edelgase]]. Metalle geben dafür Elektronen [[ab]].
      distractors:
        - sechs
        - Halogene

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Aluminium hat 3 Außenelektronen. Welche Ladung hat sein Ion? Gib die Zahl mit Vorzeichen an.
    answer:
      value: 3
    hints:
      - Drei negative Ladungen gehen weg. Was bleibt übrig?
    explanation: Al³⁺. Drei Elektronen abgeben ist leichter als fünf aufnehmen.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Ionen erreichen die Elektronenzahl eines Edelgases. Welches?
    params:
      buckets:
        - id: b1
          label: wie Neon (10 Elektronen)
        - id: b2
          label: wie Argon (18 Elektronen)
      items:
        - label: Na⁺
          bucket: b1
        - label: Mg²⁺
          bucket: b1
        - label: O²⁻
          bucket: b1
        - label: F⁻
          bucket: b1
        - label: Cl⁻
          bucket: b2
        - label: K⁺
          bucket: b2
        - label: S²⁻
          bucket: b2
    hints:
      - "Zähle die Elektronen: Ordnungszahl minus Ladung."
      - "Na hat 11, gibt eins ab: 10. Cl hat 17, nimmt eins auf: 18."
    explanation: Metalle springen zurück zum Edelgas davor, Nichtmetalle vor zum Edelgas danach.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Sauerstoffatom (8 Elektronen) nimmt zwei Elektronen auf. Wie viele Elektronen hat das Oxid-Ion O²⁻?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 6
        misconception: ion-sign
        text: "Minus heißt: Elektronen kamen dazu."
    hints:
      - Eine negative Ladung bedeutet Elektronen-Überschuss.
      - Rechne 8 + 2.
    explanation: 8 + 2 = 10 Elektronen – genau wie Neon.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Wie viele freie Paare von Elektronen hat das O-Atom im Wasser H₂O?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 3
        misconception: lone-pair-count
        text: O hat 6 Außenelektronen. Zwei davon stecken in den Bindungen.
    hints:
      - O hat 6 Außenelektronen und bildet 2 Bindungen.
      - Je Bindung steuert O ein Elektron bei. 6 − 2 = 4 Elektronen bleiben.
    explanation: 4 übrige Elektronen bilden 2 freie Paare. Mit den 2 Bindungen hat O wieder 8 außen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wasserstoff strebt nur **zwei** Elektronen an, nicht acht. Warum?
    params:
      options:
        - label: Seine einzige Schale ist die erste – und die ist mit zwei voll
          correct: true
        - label: Wasserstoff ist kein richtiges Element
          feedback: Es ist das häufigste Element überhaupt.
        - label: Die Oktettregel ist falsch
          feedback: Sie ist eine Faustregel für die zweite und dritte Schale.
    hints:
      - Wie viele Elektronen passen in die erste Schale?
    explanation: "Eigentlich heißt die Regel: **volle Außenschale**. Bei Helium und Wasserstoff sind das zwei."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Zähle alle Außenelektronen im CO₂-Molekül zusammen (C hat 4, O hat 6). Wie viele sind es?
    answer:
      value: 16
    feedback:
      - when: numval(state.input) == 10
        misconception: subscript-ignored
        text: Es gibt zwei O-Atome.
    hints:
      - 4 + 6 + 6.
      - Diese 16 Elektronen verteilen sich zu 8 Paaren.
    explanation: "16 Elektronen, also 8 Paare: 4 in zwei Doppelbindungen O=C=O, 4 als freie Paare an den O. Jedes Atom hat so ein Oktett."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: In BF₃ hat Bor nur 6 Außenelektronen, in SF₆ hat Schwefel sogar 12. Was zeigt das?
    params:
      options:
        - label: Die Oktettregel ist eine Faustregel – mit Ausnahmen
          correct: true
        - label: Die Formeln sind falsch
          feedback: Beide Stoffe gibt es genau so.
        - label: Bor und Schwefel sind Edelgase
          feedback: Sie stehen in Gruppe 13 und 16.
    hints:
      - Bor hat nur 3 Außenelektronen zum Teilen.
      - Ab der 3. Periode ist um das Atom mehr Platz.
    explanation: BF₃ sucht darum gierig ein weiteres Elektronenpaar. Große Atome wie S oder P können mehr als vier Partner tragen.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Natrium ein Elektron abgibt, Chlor aber eins aufnimmt.
    params:
      keywords:
        - - acht
          - oktett
          - octet
          - voll
          - full
          - eight
        - - abgeb
          - gibt
          - give
          - lose
        - - sieben
          - seven
          - fehlt
          - missing
          - nimmt
          - take
      sample: Natrium hat außen nur ein Elektron. Gibt es dieses eine ab, ist die Schale darunter voll mit acht. Chlor hat sieben, ihm fehlt nur eins zum Oktett – darum nimmt es eins auf.
    explanation: Beide nehmen den kürzesten Weg zur vollen Achterschale.
    difficulty: 3

srs:
  cards_from: [fehlen, wer]
