id: cs.code.sequence
type: concept
title: Schritt für Schritt
summary: Ein Programm ist eine Folge von Befehlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.sequence]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der wörtliche Roboter
    body: Jede App auf deinem Handy ist eine lange Liste von Befehlen. Setz unten Blöcke zusammen und drück »Ausführen«. Der Roboter macht **genau, was du sagst** – auch wenn es falsch ist.
    visual:
      widget: robot
      interactive: true
      params:
        grid:
          - S..#
          - .#..
          - ...G
        blocks:
          - forward
          - left
          - right
        maxBlocks: 10

  - kind: problem
    id: geradeaus
    widget: robot
    prompt: Bring den Roboter zur Flagge. Baue das Programm und drück »Ausführen«.
    params: { grid: ["S...G"], blocks: [forward, left, right], maxBlocks: 6 }
    hints:
      - Wie viele Felder sind es bis zur Flagge?
    explanation: Viermal vorwärts.

  - kind: problem
    id: c1
    widget: order
    prompt: Ein Programm für Tee. Bring die Befehle in eine Reihenfolge, die funktioniert.
    params:
      items:
        - label: Wasser in den Kocher füllen
        - label: Kocher einschalten
        - label: Warten, bis es kocht
        - label: Wasser über den Teebeutel gießen
    hints:
      - Ein Computer führt jeden Befehl aus, auch wenn die Reihenfolge Unsinn ist.
    explanation: Dieselben Befehle in anderer Reihenfolge ergeben ein anderes Programm.

  - kind: explain
    id: s2
    body: |
      Ein **Programm** ist eine Folge von Befehlen.
      Der Roboter führt sie genau der Reihe nach aus – nicht mehr und nicht weniger.

  - kind: problem
    id: start-ecke
    widget: robot
    prompt: Die Flagge liegt um die Ecke. Der Roboter schaut nach rechts. Bring ihn hin.
    params:
      grid:
        - S.
        - "#G"
      blocks:
        - forward
        - left
        - right
      maxBlocks: 5
    hints:
      - Fahr erst ein Feld vor. Wohin muss der Roboter dann schauen?
      - vorwärts, rechts drehen, vorwärts.
    explanation: vorwärts, rechts drehen, vorwärts. Drehen bewegt den Roboter nicht – er schaut danach nur woanders hin.

  - kind: problem
    id: start-drehung
    widget: choice
    prompt: Der Roboter schaut nach rechts und dreht sich einmal nach rechts. Wohin schaut er jetzt?
    params:
      layout: grid
      options:
        - label: nach unten
          correct: true
        - label: nach oben
          feedback: Das wäre eine Linksdrehung.
        - label: nach links
          feedback: Dafür müsste er sich zweimal drehen.
        - label: nach rechts
          feedback: Dann hätte er sich gar nicht gedreht.
    hints:
      - "Rechts drehen heißt: im Uhrzeigersinn, wie der Zeiger einer Uhr."
      - Stell dir vor, du stehst selbst auf dem Feld und drehst dich nach rechts.
    explanation: rechts → unten. Eine Rechtsdrehung ist eine Vierteldrehung im Uhrzeigersinn.

  - kind: problem
    id: blickrichtung
    widget: choice
    prompt: Der Roboter schaut nach rechts und dreht sich zweimal nach links. Wohin schaut er jetzt?
    params:
      layout: grid
      options:
        - { label: nach links, correct: true }
        - { label: nach oben, feedback: "Nach einer Drehung schaut er nach oben – es sind aber zwei." }
        - { label: nach unten, feedback: "Links drehen dreht gegen den Uhrzeigersinn." }
        - { label: nach rechts, feedback: "Erst nach vier Drehungen wäre er wieder bei rechts." }
    hints:
      - Eine Linksdrehung – von rechts nach oben.
    explanation: rechts → oben → links.

  - kind: problem
    id: um-die-ecke
    widget: robot
    prompt: Jetzt geht es um zwei Ecken. Achte darauf, wohin der Roboter schaut.
    params: { grid: ["S.#", "#.#", "#.G"], blocks: [forward, left, right], maxBlocks: 8 }
    hints:
      - Nach dem ersten Schritt musst du nach unten.
      - Rechts drehen heißt – aus Sicht des Roboters.
    explanation: vorwärts, rechts drehen, 2× vorwärts, links drehen, vorwärts.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Roboter soll »ein Brot schmieren«. Warum scheitert er an dieser Anweisung?
    params:
      options:
        - label: Sie ist zu ungenau – er braucht jeden einzelnen Schritt
          correct: true
        - label: Roboter können keine Brote halten
          feedback: "Es geht ums Prinzip: Computer raten nicht, was gemeint ist."
        - label: Der Befehl ist zu lang
          feedback: Er ist zu kurz – es fehlen die Einzelschritte.
    hints:
      - Wo ist das Messer? Wie öffnet man die Butter?
    explanation: Ein **Algorithmus** muss eindeutig sein. Programmieren heißt, eine Aufgabe in Schritte zu zerlegen, die keinen Spielraum lassen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: robot
    prompt: Ein Labyrinth. Finde den Weg zur Flagge – mit höchstens 10 Blöcken.
    params:
      grid:
        - S.#.G
        - "#...#"
        - ..#..
      blocks:
        - forward
        - left
        - right
      maxBlocks: 10
    hints:
      - Rechts von dir geht es nur ein Feld weit. Wohin dann?
      - "Unten herum: vorwärts, rechts, vorwärts, links – dann weiter nach rechts und hoch."
    explanation: vorwärts, rechts, vorwärts, links, vorwärts, vorwärts, links, vorwärts, rechts, vorwärts.
    difficulty: 2

  - kind: problem
    id: kristalle
    depth: 2
    widget: robot
    prompt: Sammle beide Kristalle ein und ende auf der Flagge.
    params: { grid: ["S.*", "#.#", "*.G"], blocks: [forward, left, right], maxBlocks: 16, goal: collect }
    hints:
      - Hol zuerst den Kristall oben rechts.
      - Dreh dich zweimal, um umzukehren.
    explanation: Zum oberen Kristall, umkehren, nach unten, links zum zweiten Kristall, umkehren und zur Flagge.
    difficulty: 3

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Der Roboter schaut nach Norden. Er dreht sich rechts, rechts, links. Wohin schaut er jetzt?
    params:
      options:
        - label: Nach Osten
          correct: true
        - label: Nach Westen
          feedback: Zweimal rechts ist Süden, dann einmal links.
        - label: Nach Süden
          feedback: Nach zweimal rechts – aber dann kommt noch links.
    hints:
      - Geh die Drehungen einzeln durch.
      - Norden, rechts → Osten, rechts → Süden, links → ?
    explanation: "Norden → Osten → Süden → Osten. Rechts und links heben sich auf: Netto bleibt eine Rechtsdrehung."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Der Roboter dreht sich {{k}}-mal nach rechts. Mit wie wenigen Rechtsdrehungen schaut er genauso?
    answer:
      value: "{{mod(k, 4)}}"
    feedback:
      - when: numval(state.input) == k
        misconception: full-turns
        text: Das sind alle Drehungen. Volle Runden aus vier Drehungen kannst du weglassen.
    hints:
      - Vier Rechtsdrehungen sind eine volle Runde.
      - Zieh so oft 4 ab, wie es geht.
    explanation: "{{k}} mod 4 = {{mod(k, 4)}}. Volle Runden ändern die Blickrichtung nicht – das ist Modulo-Rechnen."
    difficulty: 2
    variants:
      params:
        k: int[5,15]
      constraints:
        - mod(k, 4) != 0
      defaults:
        k: 7

  - kind: explain
    id: cs-d4
    depth: 2
    body: "Ein **Algorithmus** ist ein Rezept, das immer funktioniert: endlich viele, eindeutige Schritte, die bei jeder passenden Eingabe zum Ziel führen. Ein Programm schreibt ihn für einen Computer auf."

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Ein Roboter kennt 3 Befehle: vorwärts, links, rechts. Wie viele verschiedene Programme mit genau 4 Befehlen gibt es?"
    answer:
      value: 81
    hints:
      - An jeder der 4 Stellen stehen 3 Befehle zur Wahl.
    explanation: 3⁴ = 81. Mit 20 Befehlen wären es schon 3,5 Milliarden – darum kann man Programme nicht einfach durchprobieren.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Der Roboter kennt 3 Befehle. Wie viele verschiedene Programme gibt es mit 1 bis 4 Befehlen?
    answer:
      value: 120
    feedback:
      - when: numval(state.input) == 81
        misconception: only-longest
        text: Das sind nur die Programme mit genau 4 Befehlen. Dazu kommen die kürzeren.
    hints:
      - "Zähle jede Länge einzeln: 3, dann 3 · 3 …"
      - 3 + 9 + 27 + 81.
    explanation: 3 + 9 + 27 + 81 = 120. Mit jedem Befehl mehr verdreifacht sich die Zahl – die längsten Programme stellen die Mehrheit.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Zwei verschiedene Programme bringen den Roboter zur selben Flagge. Was stimmt?
    params:
      options:
        - label: Beide können richtig sein – meist gibt es viele Lösungen
          correct: true
        - label: Eines muss falsch sein
          feedback: Ein Ziel, viele Wege – das ist normal.
        - label: Das kürzere ist immer besser
          feedback: Kürzer ist oft schöner, aber lesbarer Code zählt auch.
    hints:
      - Denk an Wege durch eine Stadt.
      - Gibt es nur einen Weg zum Bahnhof?
    explanation: Zu einer Aufgabe gibt es viele korrekte Programme. Man vergleicht sie nach Länge, Tempo und Lesbarkeit.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Computer so genaue Befehle braucht.
    params:
      keywords:
        - - genau
          - eindeutig
          - exact
          - precise
          - unambiguous
          - klar
          - clear
        - - reihenfolge
          - nacheinander
          - order
          - sequence
          - one after
        - - versteh
          - raten
          - mitdenken
          - guess
          - understand
          - think
      sample: Ein Computer denkt nicht mit und kann nicht raten. Er führt jeden Befehl genau so aus, wie er dasteht – nacheinander, in fester Reihenfolge. Ist ein Befehl ungenau oder fehlt einer, landet er woanders.
    difficulty: 3
