id: cs.code.loops
type: concept
title: Loops
summary: Repeat instead of copying.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.loops]
estimated_minutes: 13
steps:
  - kind: problem
    id: lange-strecke
    widget: robot
    prompt: Get the robot to the goal – with at most 3 blocks.
    params: { grid: ["S.......G"], blocks: [forward, repeat, end], repeatCounts: [2, 4, 8], maxBlocks: 3 }
    hints:
      - Eight forward blocks would be too many.
      - Repeat 8× – forward – end.
    explanation: One loop – repeat 8× forward.

  - kind: explain
    id: s2
    body: |
      A **loop** repeats commands.
      "Repeat 8× forward, end" is shorter than writing "forward" eight times – and easier to change.

  - kind: problem
    id: treppe
    widget: robot
    prompt: The staircase has a pattern. Can you do it with at most 6 blocks?
    params: { grid: ["S.##", "#..#", "##..", "###G"], blocks: [forward, left, right, repeat, end], repeatCounts: [2, 3, 4], maxBlocks: 6 }
    solution: { state: { program: [{ op: repeat, n: 3 }, { op: forward }, { op: right }, { op: forward }, { op: left }, { op: end }] } }
    hints:
      - Which four commands repeat on every step?
      - forward, right, forward, left – three times.
    explanation: repeat 3× (forward, turn right, forward, turn left).
    difficulty: 3

  - kind: problem
    id: quadrat
    widget: choice
    prompt: What does "repeat 4× – forward, turn right – end" do on an open field?
    params:
      options:
        - { label: The robot drives a square and ends up back at the start, correct: true }
        - { label: It drives 4 squares straight ahead, feedback: "After each step it turns." }
        - { label: It only turns on the spot, feedback: "Before each turn it moves one square." }
    hints:
      - Four right turns make a full circle.
    explanation: Four sides, four right turns – a square back to the start.

  - kind: problem
    id: verschachtelt
    widget: numeric
    prompt: How many times does the robot move forward in "repeat 3× ( repeat 4× forward end ) end"?
    answer: { value: 12 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: nested-loops-add
        text: The inner loop runs completely on every round of the outer loop – so multiply, don't add.
    hints:
      - The inner loop runs three times.
    explanation: 3 · 4 = 12.
    difficulty: 2

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A loop [[repeats]] commands. If a loop sits inside a loop, the iterations are [[multiplied]].
      distractors:
        - added
        - skips

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many stars does this program print? “repeat 5× ( repeat 3× print * end, print * ) end”
    answer:
      value: 20
    hints:
      - "Per outer pass: 3 stars inside plus 1 after."
    explanation: 5 · (3 + 1) = 20.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "x = {{s}}. Repeat {{n}}×: x = x · 2. What is x afterwards?"
    answer:
      value: "{{s * 2 ** n}}"
    feedback:
      - when: numval(state.input) == s + 2 * n
        misconception: add-vs-multiply
        text: The loop doubles, it does not add 2.
    hints:
      - Write down x after every pass.
      - "{{s}}, {{s * 2}}, {{s * 4}}, …"
    explanation: "Doubling {{n}} times means times $2^{ {{n}} }$: {{s}} · {{2 ** n}} = {{s * 2 ** n}}."
    difficulty: 2
    variants:
      params:
        s: int[1,5]
        n: int[3,7]
      defaults:
        s: 3
        n: 4

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: "sum = 0. For i from 1 to {{n}}: sum = sum + i. What is sum at the end?"
    answer:
      value: "{{n * (n + 1) / 2}}"
    feedback:
      - when: numval(state.input) == n
        misconception: last-value
        text: That is the last value of i. The loop adds up all the i.
    hints:
      - The loop computes 1 + 2 + … + {{n}}.
      - "Make pairs: 1 + {{n}}, 2 + {{n - 1}} …"
    explanation: 1 + 2 + … + {{n}} = {{n}} · {{n + 1}} / 2 = {{n * (n + 1) / 2}}.
    difficulty: 2
    variants:
      params:
        n: int[5,20]
      defaults:
        n: 10

  - kind: problem
    id: cs-d3
    depth: 2
    widget: order
    prompt: "»For i from 1 to 4: if i is even, print i, else print i · 10.« Put the outputs in the order they appear."
    params:
      items:
        - label: "10"
        - label: "2"
        - label: "30"
        - label: "4"
      direction: horizontal
    hints:
      - Go through i = 1, 2, 3, 4 one at a time.
      - i = 1 is odd – so 1 · 10.
    explanation: 1 → 10, 2 → 2, 3 → 30, 4 → 4. Running code by hand like this is called tracing.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A loop reads: “While x is not 0: subtract 2 from x.” x starts at 7. What happens?"
    params:
      options:
        - label: It never ends – x jumps from 1 to −1 and misses 0
          correct: true
        - label: It ends after 4 passes
          feedback: After 4 passes x = −1, not 0.
        - label: It ends after 3 passes
          feedback: Then x = 1 – the condition still holds.
    hints:
      - "Write down the values: 7, 5, 3, 1, …"
    explanation: An **infinite loop**. The condition “while x is greater than 0” is safer.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: A **loop invariant** is a statement that holds before and after every pass. In the sum loop it is always true that sum = 1 + 2 + … + i. When the loop ends, the correct result follows.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: "x = 0, y = 10. While y > 0: x = x + 1, y = y − 1. What holds before and after every pass?"
    params:
      options:
        - label: x + y = 10
          correct: true
        - label: x = y
          feedback: That holds only at one moment, when x = y = 5.
        - label: x < y
          feedback: At the end x = 10 and y = 0.
    hints:
      - What happens to the sum x + y in one pass?
      - One added, one taken away.
    explanation: Each pass gives x one and takes one from y – the sum stays 10. At the end y = 0, so x = 10.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: "While n > 1: n = n / 2, rounded down. n starts at {{n}}. How many passes does the loop make?"
    answer:
      value: "{{k}}"
    hints:
      - Keep halving {{n}} and count.
      - How often does the factor 2 fit before 1 is left?
    explanation: "It takes {{k}} passes – that is how often {{n}} can be halved. Halving is logarithmic: $2^{ {{k}} }$ ≤ {{n}} < $2^{ {{k + 1}} }$."
    difficulty: 3
    variants:
      params:
        k: int[4,9]
        r: int[0,400]
      derive:
        n: 2 ** k + mod(r, 2 ** k)
      defaults:
        k: 6
        r: 36

  - kind: problem
    id: cs-x4
    depth: 3
    widget: choice
    prompt: How can you be sure that a loop will end?
    params:
      options:
        - label: A whole number drops on every pass and cannot go below 0
          correct: true
        - label: It is written briefly
          feedback: Even one line can run forever.
        - label: It finished quickly in testing
          feedback: Other inputs might hang.
    hints:
      - In the endless loop x jumped past 0.
      - Look for a quantity that keeps shrinking – but not forever.
    explanation: Such a quantity is called a variant or termination function. A natural number can only decrease finitely often.
    difficulty: 3

  - kind: problem
    id: cs-x5
    depth: 3
    widget: teach
    prompt: Explain to Lux how you check that a loop does the right thing and also ends.
    params:
      keywords:
        - - invariant
          - immer gilt
          - always true
          - always holds
        - - kleiner
          - sinkt
          - abnehm
          - decreas
          - smaller
          - shrink
        - - endet
          - ende
          - stop
          - terminat
          - halt
      sample: I look for an invariant that holds before and after every pass – the result follows from it at the end. And I look for a number that gets smaller on every pass but cannot drop below 0. Then the loop is sure to stop.
    difficulty: 3
