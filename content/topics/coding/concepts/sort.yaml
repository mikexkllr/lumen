id: cs.code.sort
type: concept
title: Sortieren
summary: Benachbarte Paare tauschen, bis alles stimmt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.sort]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Chaos in der Playlist
    body: Deine Musik-App sortiert Tausende Songs in einem Wimpernschlag. Tippe zwei benachbarte Balken an, um sie zu tauschen. Wie wenige **Tausche** brauchst du, bis alles passt?
    visual:
      widget: swap
      interactive: true
      params:
        values:
          - 3
          - 5
          - 1
          - 4
          - 2

  - kind: problem
    id: tauschen
    widget: order
    prompt: Sortiere aufsteigend. Du darfst nur benachbarte Karten tauschen.
    params:
      direction: horizontal
      items: [{ label: "3" }, { label: "8" }, { label: "12" }, { label: "17" }, { label: "25" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Vergleiche immer zwei Nachbarn.
    explanation: 3, 8, 12, 17, 25.

  - kind: explain
    id: s2
    body: |
      **Bubblesort** – gehe die Liste durch und tausche benachbarte Paare, die falsch herum stehen.
      Wiederhole das, bis nichts mehr zu tauschen ist.

  - kind: problem
    id: selbst-sortieren
    widget: swap
    prompt: Sortiere selbst – tausche Nachbarn, bis alles von klein nach groß steht.
    params: { values: [4, 2, 5, 1, 3] }
    hints:
      - Lass die größte Zahl Schritt für Schritt nach rechts wandern.
    explanation: So arbeitet **Bubble-Sort** – große Zahlen steigen wie Blasen nach oben.

  - kind: problem
    id: vergleiche
    widget: numeric
    prompt: Wie viele Vergleiche braucht ein Durchgang bei 6 Elementen?
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 6"
        text: Es gibt nur 5 Nachbarpaare bei 6 Elementen.
    hints:
      - Zähle die Nachbarpaare.
    explanation: 6 Elemente haben 5 Nachbarpaare.

  - kind: problem
    id: durchgang
    widget: choice
    prompt: Die Liste lautet 4, 2, 3. Was steht nach dem ersten Durchgang von Bubblesort da?
    params:
      layout: grid
      options:
        - { label: "2, 3, 4", correct: true }
        - { label: "2, 4, 3", feedback: "Das ist erst nach dem ersten Vergleich. Danach wird noch 4 mit 3 verglichen." }
        - { label: "3, 2, 4", feedback: "Zuerst werden 4 und 2 verglichen." }
        - { label: "4, 3, 2", feedback: "Das wäre absteigend sortiert." }
    hints:
      - Vergleiche erst 4 und 2, dann die neuen Nachbarn.
    explanation: 4,2 tauschen → 2,4,3. Dann 4,3 tauschen → 2,3,4.
    difficulty: 2

  - kind: problem
    id: wozu
    widget: choice
    prompt: Warum halten Datenbanken ihre Daten oft sortiert?
    params:
      options:
        - { label: Damit sie schnell suchen können, correct: true }
        - { label: Weil es schöner aussieht, feedback: "Ein Computer sieht die Daten nicht an." }
        - { label: Damit weniger Speicher nötig ist, feedback: "Sortieren ändert die Datenmenge nicht." }
    hints:
      - Erinnere dich an die binäre Suche.
    explanation: In sortierten Daten findet die binäre Suche alles in wenigen Schritten.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bubblesort mit 5 Elementen im schlimmsten Fall: Wie viele Vergleiche braucht er insgesamt (4 + 3 + 2 + 1)?"
    answer:
      value: 10
    hints:
      - Addiere die vier Durchgänge.
    explanation: 10 = 5 · 4 / 2. Allgemein n(n − 1)/2 – bei 1000 Elementen fast eine halbe Million.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: swap
    prompt: Sortiere mit höchstens 6 Nachbar-Tauschen – genau so viele, wie Paare falsch herum stehen.
    params:
      values:
        - 5
        - 1
        - 4
        - 2
        - 3
      adjacent: true
      maxSwaps: 6
    hints:
      - Jeder Tausch sollte ein falsches Paar richten.
      - Tausche nie zwei Nachbarn, die schon richtig stehen.
    explanation: 5 steht vor 1, 4, 2, 3 und 4 vor 2, 3 – sechs falsche Paare. Jeder Nachbar-Tausch richtet genau eins.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: order
    prompt: Bubblesort macht einen Durchgang über 3, 1, 4, 2. Wie sieht die Liste danach aus?
    params:
      items:
        - label: "1"
        - label: "3"
        - label: "2"
        - label: "4"
      direction: horizontal
    hints:
      - Vergleiche 3 und 1, dann 3 und 4, dann 4 und 2.
      - Nach einem Durchgang steht nur das Größte sicher richtig.
    explanation: 3,1 → 1,3. 3,4 bleibt. 4,2 → 2,4. Ergebnis 1, 3, 2, 4 – noch nicht sortiert, aber die 4 steht schon am Ende.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: "Bubblesort, schlimmster Fall, {{n}} Elemente: Wie viele Vergleiche braucht er insgesamt?"
    answer:
      value: "{{n * (n - 1) / 2}}"
    feedback:
      - when: numval(state.input) == n * n
        misconception: n-squared
        text: Jedes Paar wird nur einmal verglichen, und ein Element nie mit sich selbst.
      - when: numval(state.input) == n - 1
        misconception: one-pass
        text: Das ist nur der erste Durchgang.
    hints:
      - Der erste Durchgang braucht {{n - 1}} Vergleiche, der nächste einen weniger.
      - "{{n - 1}} + {{n - 2}} + … + 1."
    explanation: "{{n - 1}} + … + 1 = {{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}}. Das wächst wie n² – quadratisch."
    difficulty: 2
    variants:
      params:
        n: int[6,20]
      defaults:
        n: 8

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kein Verfahren kann beliebig schnell sortieren. Wie viele Vergleiche braucht man mindestens – grob?
    params:
      options:
        - label: Etwa n · log₂ n – schneller geht es beweisbar nicht
          correct: true
        - label: Etwa n – einmal durchgehen reicht
          feedback: Ein Durchgang kann nicht alle n! Reihenfolgen unterscheiden.
        - label: Es gibt keine untere Grenze
          feedback: Jeder Vergleich liefert nur ein Bit Information.
    hints:
      - Es gibt n! mögliche Reihenfolgen, und jeder Vergleich halbiert höchstens.
    explanation: Man braucht log₂(n!) ≈ n · log₂ n Vergleiche. Mergesort erreicht diese Grenze.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist die binäre Suche so viel schneller, als alles durchzugehen?"
    params:
      keywords:
        - - halb
          - hälfte
          - half
          - halv
        - - sortiert
          - sorted
          - ordnung
          - order
        - - mitte
          - middle
          - midpoint
      sample: In einer sortierten Liste schaue ich in die Mitte und weiß sofort, in welcher Hälfte das Gesuchte liegt. Jeder Schritt halbiert die Möglichkeiten, statt nur eine auszuschließen.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Jeder Vergleich hat zwei Ausgänge. 4 Karten können in 4! = 24 Reihenfolgen liegen. Wie viele Vergleiche braucht man mindestens, um sie sicher zu sortieren?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: too-few
        text: Mit 4 Vergleichen unterscheidest du nur $2^4$ = 16 Fälle – zu wenig für 24.
    hints:
      - k Vergleiche unterscheiden höchstens $2^k$ Fälle.
      - Die kleinste Zweierpotenz, die mindestens 24 ist?
    explanation: $2^4$ = 16 < 24 ≤ 32 = $2^5$. Also mindestens 5 Vergleiche – und 5 reichen auch. Allgemein braucht man mindestens log₂(n!) ≈ n · log₂ n.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Wievielmal schneller ist ein Verfahren mit n · log₂ n Schritten als eines mit n² – bei einer Million Zahlen?"
    params:
      min: 10
      max: 10000000
      scale: log
    answer:
      value: 50000
      within: 40
    explanation: n² / (n · log₂ n) = n / log₂ n = 1 000 000 / 20 = 50 000. Was mit Mergesort eine Sekunde dauert, braucht Bubblesort fast 14 Stunden.
    difficulty: 3
