id: cs.code.sort
type: concept
title: Sortieren
summary: Benachbarte Paare tauschen, bis alles stimmt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.sort]
estimated_minutes: 7
steps:
  - kind: problem
    id: tauschen
    widget: order
    prompt: Sortiere aufsteigend. Du darfst nur benachbarte Karten tauschen.
    params:
      direction: horizontal
      items: [{ label: "3" }, { label: "8" }, { label: "12" }, { label: "17" }, { label: "25" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Vergleiche immer zwei Nachbarn.
    explanation: 3, 8, 12, 17, 25.

  - kind: explain
    id: s2
    body: |
      **Bubblesort** – gehe die Liste durch und tausche benachbarte Paare, die falsch herum stehen.
      Wiederhole das, bis nichts mehr zu tauschen ist.

  - kind: problem
    id: durchgang
    widget: choice
    prompt: Die Liste lautet 4, 2, 3. Was steht nach dem ersten Durchgang von Bubblesort da?
    params:
      layout: grid
      options:
        - { label: "2, 3, 4", correct: true }
        - { label: "2, 4, 3", feedback: "Das ist erst nach dem ersten Vergleich. Danach wird noch 4 mit 3 verglichen." }
        - { label: "3, 2, 4", feedback: "Zuerst werden 4 und 2 verglichen." }
        - { label: "4, 3, 2", feedback: "Das wäre absteigend sortiert." }
    hints:
      - Vergleiche erst 4 und 2, dann die neuen Nachbarn.
    explanation: 4,2 tauschen → 2,4,3. Dann 4,3 tauschen → 2,3,4.
    difficulty: 2

  - kind: problem
    id: vergleiche
    widget: numeric
    prompt: Wie viele Vergleiche braucht ein Durchgang bei 6 Elementen?
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 6"
        text: Es gibt nur 5 Nachbarpaare bei 6 Elementen.
    hints:
      - Zähle die Nachbarpaare.
    explanation: 6 Elemente haben 5 Nachbarpaare.

  - kind: problem
    id: wozu
    widget: choice
    prompt: Warum halten Datenbanken ihre Daten oft sortiert?
    params:
      options:
        - { label: Damit sie schnell suchen können, correct: true }
        - { label: Weil es schöner aussieht, feedback: "Ein Computer sieht die Daten nicht an." }
        - { label: Damit weniger Speicher nötig ist, feedback: "Sortieren ändert die Datenmenge nicht." }
    hints:
      - Erinnere dich an die binäre Suche.
    explanation: In sortierten Daten findet die binäre Suche alles in wenigen Schritten.

  - kind: problem
    id: selbst-sortieren
    widget: swap
    prompt: Sortiere selbst – tausche Nachbarn, bis alles von klein nach groß steht.
    params: { values: [4, 2, 5, 1, 3] }
    hints:
      - Lass die größte Zahl Schritt für Schritt nach rechts wandern.
    explanation: So arbeitet **Bubble-Sort** – große Zahlen steigen wie Blasen nach oben.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bubblesort mit 5 Elementen im schlimmsten Fall: Wie viele Vergleiche braucht er insgesamt (4 + 3 + 2 + 1)?"
    answer:
      value: 10
    hints:
      - Addiere die vier Durchgänge.
    explanation: 10 = 5 · 4 / 2. Allgemein n(n − 1)/2 – bei 1000 Elementen fast eine halbe Million.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kein Verfahren kann beliebig schnell sortieren. Wie viele Vergleiche braucht man mindestens – grob?
    params:
      options:
        - label: Etwa n · log₂ n – schneller geht es beweisbar nicht
          correct: true
        - label: Etwa n – einmal durchgehen reicht
          feedback: Ein Durchgang kann nicht alle n! Reihenfolgen unterscheiden.
        - label: Es gibt keine untere Grenze
          feedback: Jeder Vergleich liefert nur ein Bit Information.
    hints:
      - Es gibt n! mögliche Reihenfolgen, und jeder Vergleich halbiert höchstens.
    explanation: Man braucht log₂(n!) ≈ n · log₂ n Vergleiche. Mergesort erreicht diese Grenze.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist die binäre Suche so viel schneller, als alles durchzugehen?"
    params:
      keywords:
        - - halb
          - hälfte
          - half
          - halv
        - - sortiert
          - sorted
          - ordnung
          - order
        - - mitte
          - middle
          - midpoint
      sample: In einer sortierten Liste schaue ich in die Mitte und weiß sofort, in welcher Hälfte das Gesuchte liegt. Jeder Schritt halbiert die Möglichkeiten, statt nur eine auszuschließen.
    difficulty: 3
