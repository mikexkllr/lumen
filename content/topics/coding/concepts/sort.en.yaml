id: cs.code.sort
type: concept
title: Sorting
summary: Swap neighboring pairs until everything is in place.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.sort]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Chaos in the playlist
    body: Your music app sorts thousands of songs in the blink of an eye. Tap two neighbouring bars to swap them. How few **swaps** do you need until everything is in order?
    visual:
      widget: swap
      interactive: true
      params:
        values:
          - 3
          - 5
          - 1
          - 4
          - 2

  - kind: problem
    id: tauschen
    widget: order
    prompt: Sort in ascending order. You may only swap neighboring cards.
    params:
      direction: horizontal
      items: [{ label: "3" }, { label: "8" }, { label: "12" }, { label: "17" }, { label: "25" }]
      startLabel: small
      endLabel: large
    hints:
      - Always compare two neighbors.
    explanation: 3, 8, 12, 17, 25.

  - kind: explain
    id: s2
    body: |
      **Bubble sort** – go through the list and swap neighboring pairs that are the wrong way around.
      Repeat until there is nothing left to swap.

  - kind: problem
    id: selbst-sortieren
    widget: swap
    prompt: Sort it yourself – swap neighbors until everything runs from small to large.
    params: { values: [4, 2, 5, 1, 3] }
    hints:
      - Let the largest number move to the right step by step.
    explanation: This is how **bubble sort** works – large numbers rise like bubbles.

  - kind: problem
    id: vergleiche
    widget: numeric
    prompt: How many comparisons does one pass take with 6 elements?
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 6"
        text: Six elements have only 5 neighboring pairs.
    hints:
      - Count the neighboring pairs.
    explanation: 6 elements have 5 neighboring pairs.

  - kind: problem
    id: durchgang
    widget: choice
    prompt: The list is 4, 2, 3. What does it look like after the first pass of bubble sort?
    params:
      layout: grid
      options:
        - { label: "2, 3, 4", correct: true }
        - { label: "2, 4, 3", feedback: "That is only after the first comparison. Then 4 is compared with 3." }
        - { label: "3, 2, 4", feedback: "First, 4 and 2 are compared." }
        - { label: "4, 3, 2", feedback: "That would be sorted in descending order." }
    hints:
      - Compare 4 and 2 first, then the new neighbors.
    explanation: Swap 4,2 → 2,4,3. Then swap 4,3 → 2,3,4.
    difficulty: 2

  - kind: problem
    id: wozu
    widget: choice
    prompt: Why do databases often keep their data sorted?
    params:
      options:
        - { label: So they can search quickly, correct: true }
        - { label: Because it looks nicer, feedback: "A computer does not look at the data." }
        - { label: So they need less memory, feedback: "Sorting does not change the amount of data." }
    hints:
      - Remember binary search.
    explanation: In sorted data, binary search finds anything in just a few steps.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bubble sort with 5 elements in the worst case: how many comparisons does it need in total (4 + 3 + 2 + 1)?"
    answer:
      value: 10
    hints:
      - Add up the four passes.
    explanation: 10 = 5 · 4 / 2. In general n(n − 1)/2 – for 1000 elements almost half a million.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: swap
    prompt: Sort with at most 6 neighbour swaps – exactly as many as there are pairs in the wrong order.
    params:
      values:
        - 5
        - 1
        - 4
        - 2
        - 3
      adjacent: true
      maxSwaps: 6
    hints:
      - Every swap should fix one wrong pair.
      - Never swap two neighbours that are already in order.
    explanation: 5 is before 1, 4, 2, 3 and 4 before 2, 3 – six wrong pairs. Each neighbour swap fixes exactly one.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: order
    prompt: Bubble sort makes one pass over 3, 1, 4, 2. What does the list look like afterwards?
    params:
      items:
        - label: "1"
        - label: "3"
        - label: "2"
        - label: "4"
      direction: horizontal
    hints:
      - Compare 3 and 1, then 3 and 4, then 4 and 2.
      - After one pass only the largest is surely in place.
    explanation: 3,1 → 1,3. 3,4 stays. 4,2 → 2,4. Result 1, 3, 2, 4 – not sorted yet, but the 4 is already at the end.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: "Bubble sort, worst case, {{n}} elements: how many comparisons does it need in total?"
    answer:
      value: "{{n * (n - 1) / 2}}"
    feedback:
      - when: numval(state.input) == n * n
        misconception: n-squared
        text: Each pair is compared only once, and no element with itself.
      - when: numval(state.input) == n - 1
        misconception: one-pass
        text: That is only the first pass.
    hints:
      - The first pass takes {{n - 1}} comparisons, the next one fewer.
      - "{{n - 1}} + {{n - 2}} + … + 1."
    explanation: "{{n - 1}} + … + 1 = {{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}}. That grows like n² – quadratically."
    difficulty: 2
    variants:
      params:
        n: int[6,20]
      defaults:
        n: 8

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: No method can sort as fast as you like. Roughly how many comparisons are needed at least?
    params:
      options:
        - label: About n · log₂ n – it provably cannot be faster
          correct: true
        - label: About n – one pass suffices
          feedback: One pass cannot distinguish all n! orderings.
        - label: There is no lower bound
          feedback: Each comparison yields only one bit of information.
    hints:
      - There are n! possible orderings, and each comparison halves at most.
    explanation: You need log₂(n!) ≈ n · log₂ n comparisons. Merge sort reaches this bound.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is binary search so much faster than going through everything?"
    params:
      keywords:
        - - halb
          - hälfte
          - half
          - halv
        - - sortiert
          - sorted
          - ordnung
          - order
        - - mitte
          - middle
          - midpoint
      sample: In a sorted list I look at the middle and know at once which half holds the target. Each step halves the possibilities instead of ruling out just one.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Every comparison has two outcomes. 4 cards can lie in 4! = 24 orders. How many comparisons are needed at least to sort them for sure?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: too-few
        text: 4 comparisons only tell $2^4$ = 16 cases apart – too few for 24.
    hints:
      - k comparisons can tell at most $2^k$ cases apart.
      - The smallest power of two that is at least 24?
    explanation: $2^4$ = 16 < 24 ≤ 32 = $2^5$. So at least 5 comparisons – and 5 are enough. In general you need at least log₂(n!) ≈ n · log₂ n.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: estimate
    prompt: "Take a guess: how many times faster is an n · log₂ n method than an n² one – for a million numbers?"
    params:
      min: 10
      max: 10000000
      scale: log
    answer:
      value: 50000
      within: 40
    explanation: n² / (n · log₂ n) = n / log₂ n = 1,000,000 / 20 = 50,000. What takes merge sort one second takes bubble sort almost 14 hours.
    difficulty: 3
