id: cs.code.sort
type: concept
title: Sorting
summary: Swap neighboring pairs until everything is in place.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.sort]
estimated_minutes: 6
steps:
  - kind: problem
    id: tauschen
    widget: order
    prompt: Sort in ascending order. You may only swap neighboring cards.
    params:
      direction: horizontal
      items: [{ label: "3" }, { label: "8" }, { label: "12" }, { label: "17" }, { label: "25" }]
      startLabel: small
      endLabel: large
    hints:
      - Always compare two neighbors.
    explanation: 3, 8, 12, 17, 25.

  - kind: explain
    body: |
      **Bubble sort** – go through the list and swap neighboring pairs that are the wrong way around.
      Repeat until there is nothing left to swap.

  - kind: problem
    id: durchgang
    widget: choice
    prompt: The list is 4, 2, 3. What does it look like after the first pass of bubble sort?
    params:
      layout: grid
      options:
        - { label: "2, 3, 4", correct: true }
        - { label: "2, 4, 3", feedback: "That is only after the first comparison. Then 4 is compared with 3." }
        - { label: "3, 2, 4", feedback: "First, 4 and 2 are compared." }
        - { label: "4, 3, 2", feedback: "That would be sorted in descending order." }
    hints:
      - Compare 4 and 2 first, then the new neighbors.
    explanation: Swap 4,2 → 2,4,3. Then swap 4,3 → 2,3,4.
    difficulty: 2

  - kind: problem
    id: vergleiche
    widget: numeric
    prompt: How many comparisons does one pass take with 6 elements?
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 6"
        text: Six elements have only 5 neighboring pairs.
    hints:
      - Count the neighboring pairs.
    explanation: 6 elements have 5 neighboring pairs.

  - kind: problem
    id: wozu
    widget: choice
    prompt: Why do databases often keep their data sorted?
    params:
      options:
        - { label: So they can search quickly, correct: true }
        - { label: Because it looks nicer, feedback: "A computer does not look at the data." }
        - { label: So they need less memory, feedback: "Sorting does not change the amount of data." }
    hints:
      - Remember binary search.
    explanation: In sorted data, binary search finds anything in just a few steps.

  - kind: problem
    id: selbst-sortieren
    widget: swap
    prompt: Sort it yourself – swap neighbors until everything runs from small to large.
    params: { values: [4, 2, 5, 1, 3] }
    hints:
      - Let the largest number move to the right step by step.
    explanation: This is how **bubble sort** works – large numbers rise like bubbles.
