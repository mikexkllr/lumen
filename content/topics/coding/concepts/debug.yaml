id: cs.code.debug
type: concept
title: Fehler finden
summary: Debuggen heißt – vergleichen, was passieren soll und was passiert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.debug]
estimated_minutes: 7
steps:
  - kind: problem
    id: bug-eins
    widget: robot
    prompt: Dieses Programm hat einen Fehler. Führe es aus, finde den Fehler und repariere es.
    params: { grid: ["S..", "..G"], blocks: [forward, left, right], maxBlocks: 6, program: [{ op: forward }, { op: right }, { op: forward }, { op: forward }] }
    hints:
      - Wo fährt der Roboter gegen die Wand?
      - Er dreht sich zu früh. Tippe Blöcke an, um sie zu entfernen.
    explanation: Richtig ist – vorwärts, vorwärts, rechts drehen, vorwärts.

  - kind: explain
    id: s2
    body: |
      Fehler im Programm heißen **Bugs**. Beim **Debuggen** gehst du Schritt für Schritt durch.
      Du vergleichst – was sollte passieren, was passiert wirklich?

  - kind: problem
    id: fehlt
    widget: choice
    prompt: Ein Roboter soll 3 Felder vorwärts fahren. Das Programm lautet vorwärts, vorwärts. Was ist der Fehler?
    params:
      options:
        - { label: Ein Befehl fehlt, correct: true }
        - { label: Ein Befehl ist zu viel, feedback: "Zähle nach – es sind nur zwei Befehle." }
        - { label: Die Reihenfolge ist falsch, feedback: "Bei zwei gleichen Befehlen spielt die Reihenfolge keine Rolle." }
    hints:
      - Zähle die Befehle.
    explanation: Für drei Felder braucht er drei Vorwärts-Befehle.

  - kind: problem
    id: bug-zwei
    widget: robot
    prompt: Auch hier steckt ein Bug drin. Repariere das Programm.
    params: { grid: ["S.#", "#..", "##G"], blocks: [forward, left, right], maxBlocks: 8, program: [{ op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }] }
    hints:
      - Lass es laufen und beobachte, wo es schiefgeht.
      - Die zweite Drehung muss nach links gehen.
    explanation: vorwärts, rechts, vorwärts, links, vorwärts, rechts, vorwärts.
    difficulty: 2

  - kind: problem
    id: kleine-schritte
    widget: choice
    prompt: Warum ist es klug, ein Programm in kleinen Stücken zu testen?
    params:
      options:
        - { label: Fehler lassen sich leichter eingrenzen, correct: true }
        - { label: Das Programm wird dadurch schneller, feedback: "Testen ändert nichts an der Geschwindigkeit." }
        - { label: Kleine Programme haben nie Fehler, feedback: "Auch kurze Programme können Bugs haben." }
    hints:
      - Wo suchst du leichter – in 3 oder in 30 Zeilen?
    explanation: Wer oft testet, weiß – der Fehler steckt im zuletzt geänderten Stück.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Programm kann laufen und trotzdem das Falsche tun.
          right: true
        - text: Wenn kein Fehler angezeigt wird, ist das Programm richtig.
          right: false
          why: Logikfehler meldet der Computer nicht – er tut genau, was dasteht.
        - text: Tests zeigen, dass Fehler da sind – nie, dass keine da sind.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Programm soll die Zahlen 1 bis 10 zusammenzählen, zählt aber nur bis 9. Wie heißt dieser klassische Fehler?
    params:
      options:
        - label: Off-by-one – um eins daneben
          correct: true
        - label: Endlosschleife
          feedback: Die Schleife endet ja – nur zu früh.
        - label: Tippfehler
          feedback: Das Programm läuft ohne Meldung, die Grenze ist falsch gewählt.
    hints:
      - Es fehlt genau ein Durchlauf.
    explanation: "Grenzen sind die häufigste Fehlerquelle: »kleiner als 10« oder »kleiner gleich 10«?"
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du hast 1000 Zeilen Code, und irgendwo steckt ein Fehler. Welche Strategie findet ihn am schnellsten?
    params:
      options:
        - label: In der Mitte prüfen, ob bis dahin alles stimmt – und die fehlerhafte Hälfte weiter halbieren
          correct: true
        - label: Jede Zeile von oben nach unten lesen
          feedback: Das können bis zu 1000 Schritte sein.
        - label: Alles neu schreiben
          feedback: Dann macht man neue Fehler.
    hints:
      - Dieselbe Idee wie bei der Zahlenraten-Suche.
    explanation: "Binäre Suche fürs Debuggen: höchstens 10 Prüfungen statt 1000. Werkzeuge wie »git bisect« machen genau das."
    difficulty: 3
