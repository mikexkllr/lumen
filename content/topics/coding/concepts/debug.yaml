id: cs.code.debug
type: concept
title: Fehler finden
summary: Debuggen heißt – vergleichen, was passieren soll und was passiert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.debug]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Motte im Rechner
    body: Selbst Raketen sind schon an winzigen Fehlern gescheitert. Deck die Karten auf und sieh, was **ein einziger Bug** anrichten kann. Welcher überrascht dich am meisten?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐛
            front: Die echte Motte (1947)
            back: Im Rechner Mark II klemmte eine Motte im Relais. Das Team klebte sie ins Logbuch.
          - icon: 🚀
            front: Ariane 5 (1996)
            back: Eine Zahl war zu groß für 16 Bit. Nach 37 Sekunden sprengte sich die Rakete selbst.
          - icon: 🛰️
            front: Mars Climate Orbiter (1999)
            back: Ein Team rechnete in Pfund, das andere metrisch. Die Sonde verglühte am Mars.
          - icon: 📅
            front: Das Jahr 2000
            back: Viele Programme speicherten das Jahr nur mit zwei Ziffern. Aus 2000 wäre 1900 geworden.

  - kind: problem
    id: bug-eins
    widget: robot
    prompt: Dieses Programm hat einen Fehler. Führe es aus, finde den Fehler und repariere es.
    params: { grid: ["S..", "..G"], blocks: [forward, left, right], maxBlocks: 6, program: [{ op: forward }, { op: right }, { op: forward }, { op: forward }] }
    hints:
      - Wo fährt der Roboter gegen die Wand?
      - Er dreht sich zu früh. Tippe Blöcke an, um sie zu entfernen.
    explanation: Richtig ist – vorwärts, vorwärts, rechts drehen, vorwärts.

  - kind: explain
    id: s2
    body: |
      Fehler im Programm heißen **Bugs**. Beim **Debuggen** gehst du Schritt für Schritt durch.
      Du vergleichst – was sollte passieren, was passiert wirklich?

  - kind: problem
    id: fehlt
    widget: choice
    prompt: Ein Roboter soll 3 Felder vorwärts fahren. Das Programm lautet vorwärts, vorwärts. Was ist der Fehler?
    params:
      options:
        - { label: Ein Befehl fehlt, correct: true }
        - { label: Ein Befehl ist zu viel, feedback: "Zähle nach – es sind nur zwei Befehle." }
        - { label: Die Reihenfolge ist falsch, feedback: "Bei zwei gleichen Befehlen spielt die Reihenfolge keine Rolle." }
    hints:
      - Zähle die Befehle.
    explanation: Für drei Felder braucht er drei Vorwärts-Befehle.

  - kind: problem
    id: bug-zwei
    widget: robot
    prompt: Auch hier steckt ein Bug drin. Repariere das Programm.
    params: { grid: ["S.#", "#..", "##G"], blocks: [forward, left, right], maxBlocks: 8, program: [{ op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }] }
    hints:
      - Lass es laufen und beobachte, wo es schiefgeht.
      - Die zweite Drehung muss nach links gehen.
    explanation: vorwärts, rechts, vorwärts, links, vorwärts, rechts, vorwärts.
    difficulty: 2

  - kind: problem
    id: kleine-schritte
    widget: choice
    prompt: Warum ist es klug, ein Programm in kleinen Stücken zu testen?
    params:
      options:
        - { label: Fehler lassen sich leichter eingrenzen, correct: true }
        - { label: Das Programm wird dadurch schneller, feedback: "Testen ändert nichts an der Geschwindigkeit." }
        - { label: Kleine Programme haben nie Fehler, feedback: "Auch kurze Programme können Bugs haben." }
    hints:
      - Wo suchst du leichter – in 3 oder in 30 Zeilen?
    explanation: Wer oft testet, weiß – der Fehler steckt im zuletzt geänderten Stück.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Programm kann laufen und trotzdem das Falsche tun.
          right: true
        - text: Wenn kein Fehler angezeigt wird, ist das Programm richtig.
          right: false
          why: Logikfehler meldet der Computer nicht – er tut genau, was dasteht.
        - text: Tests zeigen, dass Fehler da sind – nie, dass keine da sind.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Programm soll die Zahlen 1 bis 10 zusammenzählen, zählt aber nur bis 9. Wie heißt dieser klassische Fehler?
    params:
      options:
        - label: Off-by-one – um eins daneben
          correct: true
        - label: Endlosschleife
          feedback: Die Schleife endet ja – nur zu früh.
        - label: Tippfehler
          feedback: Das Programm läuft ohne Meldung, die Grenze ist falsch gewählt.
    hints:
      - Es fehlt genau ein Durchlauf.
    explanation: "Grenzen sind die häufigste Fehlerquelle: »kleiner als 10« oder »kleiner gleich 10«?"
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: robot
    prompt: Das Programm soll den Roboter zur Flagge bringen, bleibt aber ein Feld davor stehen. Repariere es – höchstens 3 Blöcke.
    params:
      grid:
        - S.....G
      blocks:
        - forward
        - repeat
        - end
      repeatCounts:
        - 4
        - 5
        - 6
        - 7
      maxBlocks: 3
      program:
        - op: repeat
          n: 5
        - op: forward
        - op: end
    solution:
      state:
        program:
          - op: repeat
            n: 6
          - op: forward
          - op: end
    hints:
      - Zähle die Felder bis zur Flagge.
      - Die Schleife läuft einmal zu wenig. Tausche »Wiederhole 5×« gegen 6×.
    explanation: "Ein Off-by-one-Fehler: 6 Felder, aber nur 5 Durchläufe."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: "Ein Programm soll von 1 bis 5 zählen: »x = 1. Solange x < 5: drucke x, dann x = x + 1.« Wie viele Zahlen druckt es?"
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 5
        misconception: off-by-one
        text: "Prüf genau: Bei x = 5 gilt »x < 5« nicht mehr."
    hints:
      - "Schreib die Werte von x auf: 1, 2, …"
      - Was passiert, wenn x = 5 ist?
    explanation: Es druckt 1, 2, 3, 4 – die 5 fehlt. Richtig wäre »x ≤ 5«. Ein klassischer Off-by-one-Fehler.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: order
    prompt: Bring die Schritte beim Debuggen in eine sinnvolle Reihenfolge.
    params:
      items:
        - label: Fehler zuverlässig nachstellen
        - label: Eine Vermutung aufstellen
        - label: Gezielt prüfen, etwa Werte ausgeben
        - label: Den Fehler beheben
        - label: Noch einmal alles testen
    hints:
      - Was musst du können, bevor du suchst?
      - Erst verstehen, dann ändern, dann kontrollieren.
    explanation: Wer den Fehler nicht nachstellen kann, weiß nie, ob er weg ist. Und der letzte Test zeigt, dass die Reparatur nichts anderes kaputt gemacht hat.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du hast 1000 Zeilen Code, und irgendwo steckt ein Fehler. Welche Strategie findet ihn am schnellsten?
    params:
      options:
        - label: In der Mitte prüfen, ob bis dahin alles stimmt – und die fehlerhafte Hälfte weiter halbieren
          correct: true
        - label: Jede Zeile von oben nach unten lesen
          feedback: Das können bis zu 1000 Schritte sein.
        - label: Alles neu schreiben
          feedback: Dann macht man neue Fehler.
    hints:
      - Dieselbe Idee wie bei der Zahlenraten-Suche.
    explanation: "Binäre Suche fürs Debuggen: höchstens 10 Prüfungen statt 1000. Werkzeuge wie »git bisect« machen genau das."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Ein Fehler steckt in einer von 1000 Programmversionen – irgendwo kam er dazu. Wie viele Versionen musst du höchstens testen, wenn du immer halbierst?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 500
        misconception: linear-search
        text: Das wäre im Schnitt, wenn du der Reihe nach testest. Halbieren geht viel schneller.
    hints:
      - Jeder Test halbiert die verdächtigen Versionen.
      - $2^{10}$ = 1024.
    explanation: 10 Tests reichen, denn $2^{10}$ > 1000. Das Werkzeug git bisect macht genau das.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Ein Programm besteht 100 Tests. Was weißt du jetzt sicher?
    params:
      options:
        - label: Dass es für diese 100 Eingaben stimmt – mehr nicht
          correct: true
        - label: Dass es fehlerfrei ist
          feedback: Tests zeigen Fehler, aber nie, dass keine da sind.
        - label: Dass es zu 99 % fehlerfrei ist
          feedback: Ein Prozentwert lässt sich daraus nicht ablesen.
    hints:
      - Gibt es Eingaben, die nie getestet wurden?
      - Für Sicherheit bräuchte man einen Beweis.
    explanation: "Edsger Dijkstra: Testen kann die Anwesenheit von Fehlern zeigen, nie ihre Abwesenheit. Für Gewissheit braucht man Beweise."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Warum hilft es, einer Gummiente den Code Zeile für Zeile zu erklären?
    params:
      options:
        - label: Beim Erklären prüfst du jeden Schritt und stolperst über falsche Annahmen
          correct: true
        - label: Die Ente kennt die Lösung
          feedback: Die Ente schweigt – das Erklären selbst hilft.
        - label: Es hilft gar nicht
          feedback: Viele Profis schwören darauf.
    hints:
      - Wer erklärt, muss langsam denken.
      - Wo sagst du »und hier passiert dann irgendwie …«?
    explanation: Im Kopf überspringt man Schritte. Laut erklärt fällt auf, wo man nur glaubt, was der Code tut.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie du einen Fehler in einem langen Programm findest.
    params:
      keywords:
        - - halbier
          - mitte
          - half
          - middle
          - bisect
          - eingrenz
          - narrow
        - - erwart
          - soll
          - vergleich
          - expected
          - compare
          - should
        - - schritt
          - step
          - stück
          - piece
          - teil
          - part
      sample: "Ich vergleiche, was passieren soll, mit dem, was passiert. Dann grenze ich ein: Ich prüfe in der Mitte, ob bis dahin alles stimmt, und halbiere so den verdächtigen Teil – Schritt für Schritt, bis der Fehler übrig bleibt."
    difficulty: 3
