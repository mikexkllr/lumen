id: cs.code.debug
type: concept
title: Finding bugs
summary: Debugging means comparing what should happen with what does happen.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.debug]
estimated_minutes: 7
steps:
  - kind: problem
    id: bug-eins
    widget: robot
    prompt: This program has a bug. Run it, find the bug and fix it.
    params: { grid: ["S..", "..G"], blocks: [forward, left, right], maxBlocks: 6, program: [{ op: forward }, { op: right }, { op: forward }, { op: forward }] }
    hints:
      - Where does the robot hit the wall?
      - It turns too early. Tap blocks to remove them.
    explanation: The right program is forward, forward, turn right, forward.

  - kind: explain
    body: |
      Errors in a program are called **bugs**. When you **debug**, you go step by step.
      You compare what should happen with what really happens.

  - kind: problem
    id: fehlt
    widget: choice
    prompt: A robot should move forward 3 squares. The program is forward, forward. What is the bug?
    params:
      options:
        - { label: A command is missing, correct: true }
        - { label: There is one command too many, feedback: "Count again – there are only two commands." }
        - { label: The order is wrong, feedback: "With two identical commands, the order does not matter." }
    hints:
      - Count the commands.
    explanation: Three squares need three forward commands.

  - kind: problem
    id: bug-zwei
    widget: robot
    prompt: There is a bug here too. Fix the program.
    params: { grid: ["S.#", "#..", "##G"], blocks: [forward, left, right], maxBlocks: 8, program: [{ op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }] }
    hints:
      - Run it and watch where it goes wrong.
      - The second turn must go left.
    explanation: forward, right, forward, left, forward, right, forward.
    difficulty: 2

  - kind: problem
    id: kleine-schritte
    widget: choice
    prompt: Why is it smart to test a program in small pieces?
    params:
      options:
        - { label: Bugs are easier to narrow down, correct: true }
        - { label: It makes the program faster, feedback: "Testing does not change the speed." }
        - { label: Small programs never have bugs, feedback: "Even short programs can have bugs." }
    hints:
      - Where is it easier to search – in 3 lines or in 30?
    explanation: If you test often, you know the bug is in the piece you changed last.
