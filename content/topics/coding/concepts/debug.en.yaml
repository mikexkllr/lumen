id: cs.code.debug
type: concept
title: Finding bugs
summary: Debugging means comparing what should happen with what does happen.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.debug]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The moth in the machine
    body: Even rockets have failed because of tiny mistakes. Flip the cards and see what **a single bug** can do. Which one surprises you most?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐛
            front: The real moth (1947)
            back: A moth got stuck in a relay of the Mark II computer. The team taped it into the logbook.
          - icon: 🚀
            front: Ariane 5 (1996)
            back: A number was too big for 16 bits. After 37 seconds the rocket blew itself up.
          - icon: 🛰️
            front: Mars Climate Orbiter (1999)
            back: One team worked in pounds, the other in metric units. The probe burned up at Mars.
          - icon: 📅
            front: The year 2000
            back: Many programs stored the year with just two digits. 2000 would have become 1900.

  - kind: problem
    id: fehlt
    widget: choice
    prompt: A robot should move forward 3 squares. The program is forward, forward. What is the bug?
    params:
      options:
        - { label: A command is missing, correct: true }
        - { label: There is one command too many, feedback: "Count again – there are only two commands." }
        - { label: The order is wrong, feedback: "With two identical commands, the order does not matter." }
    hints:
      - Count the commands.
    explanation: Three squares need three forward commands.

  - kind: problem
    id: start-reparieren
    widget: robot
    prompt: The robot should reach the flag but stops one square short. Run the program and fix it.
    params:
      grid:
        - S..G
      blocks:
        - forward
        - left
        - right
      maxBlocks: 5
      program:
        - op: forward
        - op: forward
    hints:
      - Count the squares to the flag and the commands in the program.
      - One "forward" is missing. Add it at the end.
    explanation: Three squares need "forward" three times. The program only had two.

  - kind: problem
    id: bug-eins
    widget: robot
    prompt: This program has a bug. Run it, find the bug and fix it.
    params: { grid: ["S..", "..G"], blocks: [forward, left, right], maxBlocks: 6, program: [{ op: forward }, { op: right }, { op: forward }, { op: forward }] }
    hints:
      - Where does the robot hit the wall?
      - It turns too early. Tap blocks to remove them.
    explanation: The right program is forward, forward, turn right, forward.

  - kind: explain
    id: s2
    body: |
      Errors in a program are called **bugs**. When you **debug**, you go step by step.
      You compare what should happen with what really happens.

  - kind: problem
    id: kleine-schritte
    widget: choice
    prompt: Why is it smart to test a program in small pieces?
    params:
      options:
        - { label: Bugs are easier to narrow down, correct: true }
        - { label: It makes the program faster, feedback: "Testing does not change the speed." }
        - { label: Small programs never have bugs, feedback: "Even short programs can have bugs." }
    hints:
      - Where is it easier to search – in 3 lines or in 30?
    explanation: If you test often, you know the bug is in the piece you changed last.

  - kind: problem
    id: bug-zwei
    widget: robot
    prompt: There is a bug here too. Fix the program.
    params: { grid: ["S.#", "#..", "##G"], blocks: [forward, left, right], maxBlocks: 8, program: [{ op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }] }
    hints:
      - Run it and watch where it goes wrong.
      - The second turn must go left.
    explanation: forward, right, forward, left, forward, right, forward.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A program can run and still do the wrong thing.
          right: true
        - text: If no error is shown, the program is correct.
          right: false
          why: The computer does not report logic errors – it does exactly what is written.
        - text: Tests show that bugs exist – never that none exist.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A program should add the numbers 1 to 10 but only counts to 9. What is this classic bug called?
    params:
      options:
        - label: Off-by-one
          correct: true
        - label: Infinite loop
          feedback: The loop does end – just too early.
        - label: Typo
          feedback: The program runs without a message; the boundary is chosen wrongly.
    hints:
      - Exactly one iteration is missing.
    explanation: "Boundaries are the most common source of bugs: “less than 10” or “less than or equal to 10”?"
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: robot
    prompt: This program should reach the flag but stops one square short. Fix it – at most 3 blocks.
    params:
      grid:
        - S.....G
      blocks:
        - forward
        - repeat
        - end
      repeatCounts:
        - 4
        - 5
        - 6
        - 7
      maxBlocks: 3
      program:
        - op: repeat
          n: 5
        - op: forward
        - op: end
    solution:
      state:
        program:
          - op: repeat
            n: 6
          - op: forward
          - op: end
    hints:
      - Count the squares to the flag.
      - The loop runs once too few. Swap »repeat 5×« for 6×.
    explanation: "An off-by-one bug: 6 squares, but only 5 iterations."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: "A program should count from 1 to 5: »x = 1. While x < 5: print x, then x = x + 1.« How many numbers does it print?"
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 5
        misconception: off-by-one
        text: "Check carefully: at x = 5, »x < 5« is no longer true."
    hints:
      - "Write down the values of x: 1, 2, …"
      - What happens when x = 5?
    explanation: It prints 1, 2, 3, 4 – the 5 is missing. Correct would be »x ≤ 5«. A classic off-by-one bug.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: order
    prompt: Put the steps of debugging in a sensible order.
    params:
      items:
        - label: Reproduce the bug reliably
        - label: Form a hypothesis
        - label: Test it, e.g. print values
        - label: Fix the bug
        - label: Test everything again
    hints:
      - What must you be able to do before searching?
      - First understand, then change, then check.
    explanation: If you cannot reproduce the bug, you never know if it is gone. And the final test shows the fix did not break anything else.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You have 1000 lines of code and a bug somewhere. Which strategy finds it fastest?
    params:
      options:
        - label: Check in the middle whether all is right so far – and keep halving the faulty half
          correct: true
        - label: Read every line from top to bottom
          feedback: That can be up to 1000 steps.
        - label: Rewrite everything
          feedback: Then you make new bugs.
    hints:
      - The same idea as in the number-guessing search.
    explanation: "Binary search for debugging: at most 10 checks instead of 1000. Tools like “git bisect” do exactly that."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: A bug crept in somewhere among 1000 program versions. How many versions do you need to test at most if you always halve?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 500
        misconception: linear-search
        text: That is the average when testing one by one. Halving is much faster.
    hints:
      - Each test halves the suspicious versions.
      - $2^{10}$ = 1024.
    explanation: 10 tests suffice because $2^{10}$ > 1000. The tool git bisect does exactly this.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: A program passes 100 tests. What do you now know for sure?
    params:
      options:
        - label: That it works for these 100 inputs – nothing more
          correct: true
        - label: That it is bug-free
          feedback: Tests show bugs, never their absence.
        - label: That it is 99 % bug-free
          feedback: No percentage follows from that.
    hints:
      - Are there inputs that were never tested?
      - Certainty would need a proof.
    explanation: "Edsger Dijkstra: testing can show the presence of bugs, never their absence. Certainty needs proofs."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Why does it help to explain your code to a rubber duck line by line?
    params:
      options:
        - label: Explaining makes you check every step, and you trip over wrong assumptions
          correct: true
        - label: The duck knows the answer
          feedback: The duck is silent – the explaining itself helps.
        - label: It does not help
          feedback: Many professionals swear by it.
    hints:
      - Explaining forces you to think slowly.
      - Where do you say »and then somehow …«?
    explanation: In your head you skip steps. Said out loud, you notice where you only believe what the code does.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how you find a bug in a long program.
    params:
      keywords:
        - - halbier
          - mitte
          - half
          - middle
          - bisect
          - eingrenz
          - narrow
        - - erwart
          - soll
          - vergleich
          - expected
          - compare
          - should
        - - schritt
          - step
          - stück
          - piece
          - teil
          - part
      sample: "I compare what should happen with what does happen. Then I narrow it down: I check in the middle whether everything is right so far and halve the suspicious part – step by step until only the bug is left."
    difficulty: 3
