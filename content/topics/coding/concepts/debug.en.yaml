id: cs.code.debug
type: concept
title: Finding bugs
summary: Debugging means comparing what should happen with what does happen.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.debug]
estimated_minutes: 7
steps:
  - kind: problem
    id: bug-eins
    widget: robot
    prompt: This program has a bug. Run it, find the bug and fix it.
    params: { grid: ["S..", "..G"], blocks: [forward, left, right], maxBlocks: 6, program: [{ op: forward }, { op: right }, { op: forward }, { op: forward }] }
    hints:
      - Where does the robot hit the wall?
      - It turns too early. Tap blocks to remove them.
    explanation: The right program is forward, forward, turn right, forward.

  - kind: explain
    id: s2
    body: |
      Errors in a program are called **bugs**. When you **debug**, you go step by step.
      You compare what should happen with what really happens.

  - kind: problem
    id: fehlt
    widget: choice
    prompt: A robot should move forward 3 squares. The program is forward, forward. What is the bug?
    params:
      options:
        - { label: A command is missing, correct: true }
        - { label: There is one command too many, feedback: "Count again – there are only two commands." }
        - { label: The order is wrong, feedback: "With two identical commands, the order does not matter." }
    hints:
      - Count the commands.
    explanation: Three squares need three forward commands.

  - kind: problem
    id: bug-zwei
    widget: robot
    prompt: There is a bug here too. Fix the program.
    params: { grid: ["S.#", "#..", "##G"], blocks: [forward, left, right], maxBlocks: 8, program: [{ op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }, { op: right }, { op: forward }] }
    hints:
      - Run it and watch where it goes wrong.
      - The second turn must go left.
    explanation: forward, right, forward, left, forward, right, forward.
    difficulty: 2

  - kind: problem
    id: kleine-schritte
    widget: choice
    prompt: Why is it smart to test a program in small pieces?
    params:
      options:
        - { label: Bugs are easier to narrow down, correct: true }
        - { label: It makes the program faster, feedback: "Testing does not change the speed." }
        - { label: Small programs never have bugs, feedback: "Even short programs can have bugs." }
    hints:
      - Where is it easier to search – in 3 lines or in 30?
    explanation: If you test often, you know the bug is in the piece you changed last.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A program can run and still do the wrong thing.
          right: true
        - text: If no error is shown, the program is correct.
          right: false
          why: The computer does not report logic errors – it does exactly what is written.
        - text: Tests show that bugs exist – never that none exist.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A program should add the numbers 1 to 10 but only counts to 9. What is this classic bug called?
    params:
      options:
        - label: Off-by-one
          correct: true
        - label: Infinite loop
          feedback: The loop does end – just too early.
        - label: Typo
          feedback: The program runs without a message; the boundary is chosen wrongly.
    hints:
      - Exactly one iteration is missing.
    explanation: "Boundaries are the most common source of bugs: “less than 10” or “less than or equal to 10”?"
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You have 1000 lines of code and a bug somewhere. Which strategy finds it fastest?
    params:
      options:
        - label: Check in the middle whether all is right so far – and keep halving the faulty half
          correct: true
        - label: Read every line from top to bottom
          feedback: That can be up to 1000 steps.
        - label: Rewrite everything
          feedback: Then you make new bugs.
    hints:
      - The same idea as in the number-guessing search.
    explanation: "Binary search for debugging: at most 10 checks instead of 1000. Tools like “git bisect” do exactly that."
    difficulty: 3
