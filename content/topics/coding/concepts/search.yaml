id: cs.code.search
type: concept
title: Binäre Suche
summary: Jede Frage halbiert die Möglichkeiten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.search]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Hälfte fliegt raus
    body: "Wie findet dein Handy unter Tausenden Kontakten sofort den richtigen? Der Trick heißt: **halbieren statt durchsuchen**. Deck die Karten auf. Wo steckt er noch?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📖
            front: Das Wörterbuch
            back: "Du schlägst irgendwo auf und weißt sofort: Das Wort steht davor oder dahinter."
          - icon: 🎯
            front: Zahlenraten
            back: Wer klug fragt, streicht mit jeder Antwort die Hälfte aller Zahlen.
          - icon: 🐞
            front: Fehlersuche im Code
            back: Programmierer testen die Version in der Mitte. So finden sie den Fehler unter Tausenden Änderungen.
          - icon: 🔌
            front: Der Kabelbruch
            back: Miss in der Mitte der Leitung. Dann weißt du, in welcher Hälfte der Bruch liegt.

  - kind: problem
    id: start-woerterbuch
    widget: choice
    prompt: Du suchst das Wort »Zebra« in einem dicken Wörterbuch. Wo schlägst du auf?
    params:
      options:
        - label: Weit hinten
          correct: true
        - label: Auf der ersten Seite
          feedback: Dann müsstest du fast das ganze Buch durchblättern.
        - label: Irgendwo, das ist egal
          feedback: Das Wörterbuch ist sortiert. Das kannst du nutzen.
    hints:
      - Wo im Alphabet steht das Z?
      - Ein Wörterbuch ist von A bis Z sortiert.
    explanation: Weil das Buch sortiert ist, kannst du den größten Teil sofort überspringen. Genau das nutzt die binäre Suche.

  - kind: problem
    id: raten
    widget: numeric
    body: Ich denke mir eine Zahl von 1 bis 100. Du rätst – ich sage nur »größer« oder »kleiner«.
    prompt: Welche Zahl rätst du am besten zuerst?
    answer: { value: 50, tolerance: 1 }
    hints:
      - Welche Zahl schließt in jedem Fall möglichst viele aus?
    explanation: Mit 50 bleibt nach der Antwort höchstens die Hälfte übrig.

  - kind: problem
    id: start-halb
    widget: numeric
    prompt: "Du rätst 50. Die Antwort lautet: »Meine Zahl ist größer.« Wie viele Zahlen bleiben übrig?"
    body: Ich denke mir eine Zahl von 1 bis 100.
    params:
      unit: Zahlen
    answer:
      value: 50
    feedback:
      - when: numval(state.input) == 49
        misconception: off-by-one
        text: "Zähl genau: Von 51 bis 100 sind es 50 Zahlen."
      - when: numval(state.input) == 100
        misconception: nothing-excluded
        text: Alles bis 50 ist jetzt ausgeschlossen.
    hints:
      - Welche Zahlen sind größer als 50?
      - Es bleiben 51 bis 100. Das ist genau die Hälfte.
    explanation: Übrig sind 51 bis 100 – das sind 50 Zahlen. Eine einzige Frage hat die Hälfte gestrichen.

  - kind: explain
    id: s2
    body: |
      **Binäre Suche** – jede Frage halbiert die Möglichkeiten.
      Aus 100 werden 50, 25, 13, 7, 4, 2, 1. Nach höchstens 7 Fragen kennst du die Zahl.

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: Gesucht ist eine Zahl von 1 bis 16. »Größer als 8?« – Ja. »Größer als 12?« – Nein. Markiere alle Zahlen, die noch in Frage kommen.
    params:
      rows: 2
      cols: 8
      numbers:
        start: 1
      counter: true
    answer:
      pattern:
        - ........
        - "####...."
    hints:
      - Das erste Ja streicht 1 bis 8.
      - Das Nein streicht dann noch 13 bis 16.
    explanation: Übrig sind 9, 10, 11 und 12. Zwei Fragen haben 16 Zahlen auf 4 geschrumpft – noch zwei Fragen, dann steht sie fest.

  - kind: problem
    id: start-acht
    widget: numeric
    prompt: "Mit jeder Frage werden aus 8 Zahlen halb so viele: 8, 4, 2, 1. Wie viele Fragen brauchst du also höchstens?"
    params:
      unit: Fragen
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 4
        misconception: counted-values
        text: "Zähl die Schritte, nicht die Zahlen: 8 → 4 → 2 → 1 sind drei Pfeile."
      - when: numval(state.input) == 8
        misconception: linear-search
        text: So viele wären es beim Durchprobieren. Halbieren geht viel schneller.
    hints:
      - "Jede Frage halbiert: Aus 8 werden 4, dann 2, dann 1."
      - Zähl, wie oft du halbieren musst.
    explanation: "8 → 4 → 2 → 1: dreimal halbieren, also 3 Fragen."

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Schritte der binären Suche in die richtige Reihenfolge.
    params:
      items:
        - { label: Mitte der sortierten Liste ansehen }
        - { label: Vergleichen – größer oder kleiner? }
        - { label: Die unpassende Hälfte weglassen }
        - { label: Wiederholen bis gefunden }
    hints:
      - Womit fängt jede Runde an?
    explanation: Mitte ansehen, vergleichen, halbieren, wiederholen.

  - kind: problem
    id: voraussetzung
    widget: choice
    prompt: Binäre Suche funktioniert nur, wenn die Liste …
    params:
      options:
        - { label: sortiert ist, correct: true }
        - { label: kurz ist, feedback: "Gerade bei langen Listen spart sie viel Zeit." }
        - { label: nur Zahlen enthält, feedback: "Auch ein Wörterbuch lässt sich so durchsuchen." }
    hints:
      - Woher weißt du sonst, in welcher Hälfte du weitersuchst?
    explanation: Nur in einer sortierten Liste sagt »größer« oder »kleiner«, wo du weitersuchen musst.

  - kind: problem
    id: tausend
    widget: numeric
    prompt: Wie viele Fragen brauchst du höchstens bei einer Zahl von 1 bis 1000?
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) >= 100"
        text: Durchprobieren wäre langsam. Wie oft kannst du 1000 halbieren, bis 1 übrig bleibt?
    hints:
      - "2 · 2 · 2 … – wie viele Zweien ergeben über 1000?"
    explanation: 2¹⁰ = 1024 ≥ 1000, also reichen 10 Fragen.
    difficulty: 2

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Ja/Nein-Fragen brauchst du höchstens, um eine von einer Milliarde Zahlen zu finden?"
    params:
      min: 5
      max: 1000
    answer:
      value: 30
      tolerance: 6
    explanation: Nur 30. Jede Frage halbiert – und 2³⁰ ist gut eine Milliarde.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einer **unsortierten** Liste mit 1000 Namen suchst du einen bestimmten. Wie viele Namen musst du im schlimmsten Fall ansehen?
    answer:
      value: 1000
    hints:
      - Ohne Ordnung hilft Halbieren nicht.
    explanation: Alle 1000 – das ist die **lineare Suche**. Sortiert wären es höchstens 10.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: Gesucht ist die 70 zwischen 1 und 100. Du fragst immer die Mitte, abgerundet. Bring deine Tipps in die richtige Reihenfolge.
    params:
      items:
        - label: "50"
        - label: "75"
        - label: "62"
        - label: "68"
        - label: "71"
        - label: "69"
        - label: "70"
      direction: horizontal
    hints:
      - Mitte von 1 und 100 ist 50. Danach bleibt 51 bis 100.
      - Mitte von 51 und 100 ist 75 – zu groß. Weiter mit 51 bis 74.
    explanation: 50 → 75 → 62 → 68 → 71 → 69 → 70. Sieben Fragen – genau die Höchstzahl für 100 Möglichkeiten.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Wie viele Fragen braucht die binäre Suche höchstens, wenn es {{n}} Möglichkeiten gibt?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == k - 1
        misconception: one-short
        text: "Knapp: Mit {{k - 1}} Fragen unterscheidet man nur {{2 ** (k - 1)}} Möglichkeiten."
    hints:
      - Mit k Fragen kannst du $2^k$ Möglichkeiten unterscheiden.
      - Finde die kleinste Zweierpotenz, die mindestens {{n}} ist.
    explanation: $2^{ {{k - 1}} }$ = {{2 ** (k - 1)}} reicht nicht, $2^{ {{k}} }$ = {{2 ** k}} schon. Also {{k}} Fragen.
    difficulty: 2
    variants:
      params:
        k: int[5,12]
        r: int[1,900]
      derive:
        n: 2 ** (k - 1) + 1 + mod(r, 2 ** (k - 1))
      defaults:
        k: 10
        r: 487

  - kind: problem
    id: cs-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Ja/Nein-Fragen braucht man höchstens, um einen von 8 Milliarden Menschen zu finden?"
    params:
      min: 1
      max: 100
    answer:
      value: 33
      tolerance: 4
    explanation: $2^{32}$ sind 4,3 Milliarden, $2^{33}$ sind 8,6 Milliarden. 33 Fragen für die ganze Menschheit.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Liste verdoppelt sich von 1 Million auf 2 Millionen Einträge. Wie viele Schritte braucht die binäre Suche zusätzlich?
    params:
      options:
        - label: Einen
          correct: true
        - label: Doppelt so viele
          feedback: Das gilt für die lineare Suche.
        - label: Eine Million
          feedback: Eine Halbierung macht die Verdopplung wett.
    hints:
      - Der erste Schritt halbiert 2 Millionen auf 1 Million.
    explanation: "Der Aufwand wächst **logarithmisch**: log₂(n). Das macht Suchmaschinen und Datenbanken möglich."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Die binäre Suche hält eine **Invariante**: Wenn die Zahl überhaupt da ist, liegt sie zwischen links und rechts. Jede Frage macht diesen Bereich kleiner, aber nie falsch. Ist er leer, fehlt die Zahl sicher."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Ein Programm setzt nach »größer« links = mitte statt links = mitte + 1. Was kann passieren?
    params:
      options:
        - label: Bei zwei übrigen Zahlen hängt es ewig fest
          correct: true
        - label: Nichts – es dauert nur einen Schritt länger
          feedback: Prüf den Fall links = 69, rechts = 70, gesucht 70.
        - label: Es findet eine falsche Zahl
          feedback: Falsch wird nichts – aber es kommt nicht voran.
    hints:
      - "Spiel es durch: links = 69, rechts = 70, gesucht ist 70."
      - Die Mitte ist 69. Danach ist links wieder 69 …
    explanation: "Der Bereich schrumpft nicht mehr: eine Endlosschleife. Die Invariante allein reicht nicht – der Bereich muss auch echt kleiner werden."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Wie viele Möglichkeiten kann man mit 20 Ja/Nein-Fragen höchstens auseinanderhalten?
    answer:
      value: 1048576
    feedback:
      - when: numval(state.input) == 40
        misconception: add-vs-multiply
        text: Jede Frage verdoppelt – sie zählt nicht 2 dazu.
    hints:
      - Jede Frage verdoppelt die Zahl der unterscheidbaren Fälle.
      - $2^{20}$.
    explanation: $2^{20}$ = 1 048 576 – gut eine Million. Darum klappt das Spiel »20 Fragen« so oft.
    difficulty: 3
