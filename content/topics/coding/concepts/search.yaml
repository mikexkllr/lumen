id: cs.code.search
type: concept
title: Binäre Suche
summary: Jede Frage halbiert die Möglichkeiten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.search]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Ja/Nein-Fragen brauchst du höchstens, um eine von einer Milliarde Zahlen zu finden?"
    params:
      min: 5
      max: 1000
    answer:
      value: 30
      tolerance: 6
    explanation: Nur 30. Jede Frage halbiert – und 2³⁰ ist gut eine Milliarde.


  - kind: problem
    id: raten
    widget: numeric
    body: Ich denke mir eine Zahl von 1 bis 100. Du rätst – ich sage nur »größer« oder »kleiner«.
    prompt: Welche Zahl rätst du am besten zuerst?
    answer: { value: 50, tolerance: 1 }
    hints:
      - Welche Zahl schließt in jedem Fall möglichst viele aus?
    explanation: Mit 50 bleibt nach der Antwort höchstens die Hälfte übrig.

  - kind: explain
    id: s2
    body: |
      **Binäre Suche** – jede Frage halbiert die Möglichkeiten.
      Aus 100 werden 50, 25, 13, 7, 4, 2, 1. Nach höchstens 7 Fragen kennst du die Zahl.

  - kind: problem
    id: tausend
    widget: numeric
    prompt: Wie viele Fragen brauchst du höchstens bei einer Zahl von 1 bis 1000?
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) >= 100"
        text: Durchprobieren wäre langsam. Wie oft kannst du 1000 halbieren, bis 1 übrig bleibt?
    hints:
      - "2 · 2 · 2 … – wie viele Zweien ergeben über 1000?"
    explanation: 2¹⁰ = 1024 ≥ 1000, also reichen 10 Fragen.
    difficulty: 2

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Schritte der binären Suche in die richtige Reihenfolge.
    params:
      items:
        - { label: Mitte der sortierten Liste ansehen }
        - { label: Vergleichen – größer oder kleiner? }
        - { label: Die unpassende Hälfte weglassen }
        - { label: Wiederholen bis gefunden }
    hints:
      - Womit fängt jede Runde an?
    explanation: Mitte ansehen, vergleichen, halbieren, wiederholen.

  - kind: problem
    id: voraussetzung
    widget: choice
    prompt: Binäre Suche funktioniert nur, wenn die Liste …
    params:
      options:
        - { label: sortiert ist, correct: true }
        - { label: kurz ist, feedback: "Gerade bei langen Listen spart sie viel Zeit." }
        - { label: nur Zahlen enthält, feedback: "Auch ein Wörterbuch lässt sich so durchsuchen." }
    hints:
      - Woher weißt du sonst, in welcher Hälfte du weitersuchst?
    explanation: Nur in einer sortierten Liste sagt »größer« oder »kleiner«, wo du weitersuchen musst.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einer **unsortierten** Liste mit 1000 Namen suchst du einen bestimmten. Wie viele Namen musst du im schlimmsten Fall ansehen?
    answer:
      value: 1000
    hints:
      - Ohne Ordnung hilft Halbieren nicht.
    explanation: Alle 1000 – das ist die **lineare Suche**. Sortiert wären es höchstens 10.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Liste verdoppelt sich von 1 Million auf 2 Millionen Einträge. Wie viele Schritte braucht die binäre Suche zusätzlich?
    params:
      options:
        - label: Einen
          correct: true
        - label: Doppelt so viele
          feedback: Das gilt für die lineare Suche.
        - label: Eine Million
          feedback: Eine Halbierung macht die Verdopplung wett.
    hints:
      - Der erste Schritt halbiert 2 Millionen auf 1 Million.
    explanation: "Der Aufwand wächst **logarithmisch**: log₂(n). Das macht Suchmaschinen und Datenbanken möglich."
    difficulty: 3
