id: cs.code.search
type: concept
title: Binary search
summary: Every question halves the possibilities.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.search]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Half gets thrown out
    body: "How does your phone find the right contact among thousands in an instant? The trick is: **halve instead of scanning**. Flip the cards. Where else is it hiding?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📖
            front: The dictionary
            back: "You open it anywhere and know at once: the word is before or after."
          - icon: 🎯
            front: Guess the number
            back: Ask cleverly and every answer rules out half of all the numbers.
          - icon: 🐞
            front: Hunting bugs in code
            back: Programmers test the version in the middle. That way they find the bug among thousands of changes.
          - icon: 🔌
            front: The broken cable
            back: Measure in the middle of the cable. Then you know which half the break is in.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many yes/no questions do you need at most to find one of a billion numbers?"
    params:
      min: 5
      max: 1000
    answer:
      value: 30
      tolerance: 6
    explanation: Only 30. Each question halves – and 2³⁰ is just over a billion.

  - kind: problem
    id: raten
    widget: numeric
    body: I am thinking of a number from 1 to 100. You guess – I only say "higher" or "lower".
    prompt: Which number is the best first guess?
    answer: { value: 50, tolerance: 1 }
    hints:
      - Which number rules out as many numbers as possible in any case?
    explanation: With 50, at most half is left after the answer.

  - kind: explain
    id: s2
    body: |
      **Binary search** – every question halves the possibilities.
      100 becomes 50, 25, 13, 7, 4, 2, 1. After at most 7 questions, you know the number.

  - kind: problem
    id: tausend
    widget: numeric
    prompt: At most how many questions do you need for a number from 1 to 1000?
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) >= 100"
        text: Trying every number would be slow. How often can you halve 1000 until 1 is left?
    hints:
      - "2 · 2 · 2 … – how many twos give more than 1000?"
    explanation: 2¹⁰ = 1024 ≥ 1000, so 10 questions are enough.
    difficulty: 2

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the steps of binary search in the right order.
    params:
      items:
        - { label: Look at the middle of the sorted list }
        - { label: Compare – higher or lower? }
        - { label: Discard the wrong half }
        - { label: Repeat until found }
    hints:
      - How does every round start?
    explanation: Look at the middle, compare, halve, repeat.

  - kind: problem
    id: voraussetzung
    widget: choice
    prompt: Binary search only works if the list is …
    params:
      options:
        - { label: sorted, correct: true }
        - { label: short, feedback: "It saves the most time on long lists." }
        - { label: only numbers, feedback: "You can search a dictionary this way too." }
    hints:
      - How else would you know which half to keep searching?
    explanation: Only in a sorted list does "higher" or "lower" tell you where to keep searching.

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: The number is between 1 and 16. "Bigger than 8?" – Yes. "Bigger than 12?" – No. Mark every number that is still possible.
    params:
      rows: 2
      cols: 8
      numbers:
        start: 1
      counter: true
    answer:
      pattern:
        - ........
        - "####...."
    hints:
      - The first yes rules out 1 to 8.
      - The no then rules out 13 to 16 as well.
    explanation: 9, 10, 11 and 12 are left. Two questions shrank 16 numbers to 4 – two more questions and it is certain.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In an **unsorted** list of 1000 names you look for a specific one. How many names must you look at in the worst case?
    answer:
      value: 1000
    hints:
      - Without order halving does not help.
    explanation: All 1000 – that is **linear search**. Sorted it would be at most 10.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: The secret number is 70, between 1 and 100. You always guess the middle, rounded down. Put your guesses in order.
    params:
      items:
        - label: "50"
        - label: "75"
        - label: "62"
        - label: "68"
        - label: "71"
        - label: "69"
        - label: "70"
      direction: horizontal
    hints:
      - The middle of 1 and 100 is 50. Then 51 to 100 is left.
      - The middle of 51 and 100 is 75 – too big. Continue with 51 to 74.
    explanation: 50 → 75 → 62 → 68 → 71 → 69 → 70. Seven questions – exactly the maximum for 100 options.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: How many questions does binary search need at most with {{n}} possibilities?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == k - 1
        misconception: one-short
        text: "Close: {{k - 1}} questions only tell {{2 ** (k - 1)}} options apart."
    hints:
      - With k questions you can tell $2^k$ options apart.
      - Find the smallest power of two that is at least {{n}}.
    explanation: $2^{ {{k - 1}} }$ = {{2 ** (k - 1)}} is not enough, $2^{ {{k}} }$ = {{2 ** k}} is. So {{k}} questions.
    difficulty: 2
    variants:
      params:
        k: int[5,12]
        r: int[1,900]
      derive:
        n: 2 ** (k - 1) + 1 + mod(r, 2 ** (k - 1))
      defaults:
        k: 10
        r: 487

  - kind: problem
    id: cs-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many yes/no questions does it take at most to find one of 8 billion people?"
    params:
      min: 1
      max: 100
    answer:
      value: 33
      tolerance: 4
    explanation: $2^{32}$ is 4.3 billion, $2^{33}$ is 8.6 billion. 33 questions for all of humanity.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The list doubles from 1 million to 2 million entries. How many extra steps does binary search need?
    params:
      options:
        - label: One
          correct: true
        - label: Twice as many
          feedback: That is true for linear search.
        - label: A million
          feedback: One halving cancels the doubling.
    hints:
      - The first step halves 2 million to 1 million.
    explanation: "The effort grows **logarithmically**: log₂(n). That makes search engines and databases possible."
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Binary search keeps an **invariant**: if the number is there at all, it lies between left and right. Every question shrinks this range but never makes it wrong. Once it is empty, the number is surely missing."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: After »bigger« a program sets left = middle instead of left = middle + 1. What can happen?
    params:
      options:
        - label: With two numbers left it can get stuck forever
          correct: true
        - label: Nothing – it just takes one step longer
          feedback: Check left = 69, right = 70, target 70.
        - label: It finds a wrong number
          feedback: Nothing goes wrong – it just stops making progress.
    hints:
      - "Play it through: left = 69, right = 70, target is 70."
      - The middle is 69. Afterwards left is 69 again …
    explanation: "The range no longer shrinks: an endless loop. The invariant alone is not enough – the range must actually get smaller."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: How many possibilities can 20 yes/no questions tell apart at most?
    answer:
      value: 1048576
    feedback:
      - when: numval(state.input) == 40
        misconception: add-vs-multiply
        text: Each question doubles – it does not add 2.
    hints:
      - Each question doubles the number of distinguishable cases.
      - $2^{20}$.
    explanation: $2^{20}$ = 1,048,576 – just over a million. That is why the game »20 questions« works so often.
    difficulty: 3
