id: cs.code.search
type: concept
title: Binary search
summary: Every question halves the possibilities.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [cs.search]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many yes/no questions do you need at most to find one of a billion numbers?"
    params:
      min: 5
      max: 1000
    answer:
      value: 30
      tolerance: 6
    explanation: Only 30. Each question halves – and 2³⁰ is just over a billion.


  - kind: problem
    id: raten
    widget: numeric
    body: I am thinking of a number from 1 to 100. You guess – I only say "higher" or "lower".
    prompt: Which number is the best first guess?
    answer: { value: 50, tolerance: 1 }
    hints:
      - Which number rules out as many numbers as possible in any case?
    explanation: With 50, at most half is left after the answer.

  - kind: explain
    id: s2
    body: |
      **Binary search** – every question halves the possibilities.
      100 becomes 50, 25, 13, 7, 4, 2, 1. After at most 7 questions, you know the number.

  - kind: problem
    id: tausend
    widget: numeric
    prompt: At most how many questions do you need for a number from 1 to 1000?
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) >= 100"
        text: Trying every number would be slow. How often can you halve 1000 until 1 is left?
    hints:
      - "2 · 2 · 2 … – how many twos give more than 1000?"
    explanation: 2¹⁰ = 1024 ≥ 1000, so 10 questions are enough.
    difficulty: 2

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the steps of binary search in the right order.
    params:
      items:
        - { label: Look at the middle of the sorted list }
        - { label: Compare – higher or lower? }
        - { label: Discard the wrong half }
        - { label: Repeat until found }
    hints:
      - How does every round start?
    explanation: Look at the middle, compare, halve, repeat.

  - kind: problem
    id: voraussetzung
    widget: choice
    prompt: Binary search only works if the list is …
    params:
      options:
        - { label: sorted, correct: true }
        - { label: short, feedback: "It saves the most time on long lists." }
        - { label: only numbers, feedback: "You can search a dictionary this way too." }
    hints:
      - How else would you know which half to keep searching?
    explanation: Only in a sorted list does "higher" or "lower" tell you where to keep searching.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In an **unsorted** list of 1000 names you look for a specific one. How many names must you look at in the worst case?
    answer:
      value: 1000
    hints:
      - Without order halving does not help.
    explanation: All 1000 – that is **linear search**. Sorted it would be at most 10.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The list doubles from 1 million to 2 million entries. How many extra steps does binary search need?
    params:
      options:
        - label: One
          correct: true
        - label: Twice as many
          feedback: That is true for linear search.
        - label: A million
          feedback: One halving cancels the doubling.
    hints:
      - The first step halves 2 million to 1 million.
    explanation: "The effort grows **logarithmically**: log₂(n). That makes search engines and databases possible."
    difficulty: 3
