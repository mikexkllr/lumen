id: logic.strategy.invariants
type: concept
title: Was sich nie ändert
summary: Invarianten beweisen das Unmögliche.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: schachbrett
    widget: choice
    prompt: Einem Schachbrett fehlen zwei gegenüberliegende Eckfelder. Kann man es mit Dominosteinen lückenlos belegen? Jeder Stein deckt zwei Nachbarfelder.
    params:
      options:
        - { label: Nein, correct: true }
        - { label: Ja, feedback: "62 Felder klingen passend. Achte aber auf die Farben der Ecken." }
    hints:
      - Welche Farbe haben die beiden fehlenden Ecken?
    explanation: Beide Ecken haben dieselbe Farbe. Jeder Dominostein deckt aber ein helles und ein dunkles Feld.

  - kind: explain
    id: s2
    body: |
      Jeder Dominostein deckt **ein helles und ein dunkles** Feld. Hier fehlen zwei Felder derselben Farbe – das geht nie auf.
      So etwas heißt **Invariante**: eine Größe, die sich nie ändert.

  - kind: problem
    id: tafel
    widget: choice
    body: An der Tafel stehen die Zahlen 1 bis 10. Du wischst zwei weg und schreibst ihre Differenz hin. Das wiederholst du, bis eine Zahl übrig ist.
    prompt: Kann am Ende 0 stehen?
    params:
      options:
        - { label: "Nein – das Ergebnis ist immer ungerade.", correct: true }
        - { label: "Ja, mit der richtigen Reihenfolge.", feedback: "Probier es – die Summe bleibt immer ungerade." }
    hints:
      - Schau, ob die Summe aller Zahlen gerade oder ungerade ist – und ob sich das ändert.
    explanation: Die Summe ist anfangs 55, also ungerade. Jeder Schritt ändert sie um eine gerade Zahl.

  - kind: problem
    id: schokolade
    widget: numeric
    prompt: Eine Tafel Schokolade hat {{a}} × {{b}} Stücke. Wie oft musst du brechen, bis alle Stücke einzeln sind?
    params: { unit: Brüche }
    answer: { value: "{{a * b - 1}}" }
    feedback:
      - when: "numval(state.input) == a * b"
        misconception: off-by-one
        text: Fast. Am Anfang hast du schon ein Stück.
    hints:
      - Jeder Bruch macht aus einem Stück zwei.
    explanation: "Von 1 auf {{a * b}} Stücke braucht man {{a * b - 1}} Brüche – egal wie."
    variants:
      params: { a: "int[3,6]", b: "int[4,8]" }
      defaults: { a: 4, b: 6 }

  - kind: problem
    id: turnier
    widget: numeric
    prompt: In einem K.-o.-Turnier spielen {{n}} Teams. Wie viele Spiele braucht es bis zum Sieger?
    params: { unit: Spiele }
    answer: { value: "{{n - 1}}" }
    hints:
      - Jedes Spiel scheidet genau ein Team aus.
    explanation: "Bis auf den Sieger scheiden alle {{n - 1}} anderen aus – ein Spiel pro Team."
    variants:
      params: { n: "choice[8,16,20,32,64]" }
      defaults: { n: 16 }

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Eine [[Invariante]] ist etwas, das sich bei keinem Zug [[ändert]]. Mit ihr zeigt man, dass etwas unmöglich ist.
      distractors:
        - Strategie
        - wiederholt

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Auf einem Tisch stehen 7 Gläser, alle verkehrt herum. In jedem Zug drehst du genau **zwei** um. Kannst du alle richtig herum stellen?
    params:
      options:
        - label: Nein – die Zahl der verkehrten Gläser bleibt immer ungerade
          correct: true
        - label: Ja, mit genug Zügen
          feedback: Jeder Zug ändert die Zahl um 2, 0 oder −2.
        - label: Nur mit einer geraden Zahl von Zügen
          feedback: Die Zahl der Züge ändert nichts an der Parität.
    hints:
      - Um wie viel ändert sich die Zahl der verkehrten Gläser pro Zug?
    explanation: 7 ist ungerade, 0 ist gerade – und jeder Zug erhält die **Parität**. Unmöglich.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: An der Tafel stehen die Zahlen 1 bis {{n}}. Immer wischst du zwei weg und schreibst ihre Summe hin. Am Ende bleibt eine Zahl. Welche?
    answer:
      value: "{{n * (n + 1) / 2}}"
    hints:
      - Was ändert sich an der Summe aller Zahlen, wenn du zwei durch ihre Summe ersetzt?
      - Die Summe bleibt gleich. Rechne 1 + 2 + … + {{n}} = {{n}} · {{n + 1}} / 2.
    explanation: Die Gesamtsumme ist eine **Invariante**. Also bleibt am Ende {{n * (n + 1) / 2}} – egal, in welcher Reihenfolge man wischt.
    difficulty: 2
    variants:
      params:
        n: int[6,20]
      defaults:
        n: 10

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Springer steht auf einem hellen Schachfeld. Kann er nach genau 7 Zügen wieder auf genau diesem Feld stehen?
    params:
      options:
        - label: Nein – nach einer ungeraden Zahl von Zügen steht er auf einem dunklen Feld.
          correct: true
        - label: Ja, er muss nur geschickt hin und her springen.
          feedback: Hin und zurück sind zwei Züge – das ergibt immer eine gerade Zahl.
        - label: Nur am Rand des Bretts.
          feedback: Die Farbregel gilt überall auf dem Brett.
    hints:
      - Welche Farbe hat das Zielfeld eines Springerzugs im Vergleich zum Startfeld?
      - Jeder Zug wechselt die Farbe. Wo steht er nach 1, 2, 3 … Zügen?
    explanation: Ein Springerzug wechselt immer die Feldfarbe. Nach 7 Zügen ist die Farbe gewechselt – das Startfeld hat aber die alte. Die **Parität** der Zugzahl entscheidet.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Das 15er-Schiebepuzzle: Lassen sich nur die Steine 14 und 15 vertauschen, alles andere bleibt?"
    params:
      options:
        - label: Nein – jede erreichbare Stellung braucht eine gerade Zahl von Vertauschungen
          correct: true
        - label: Ja, mit sehr vielen Zügen
          feedback: Genau die Hälfte aller Stellungen ist unerreichbar.
        - label: Das weiß niemand
          feedback: Es wurde 1879 bewiesen.
    hints:
      - Eine einzelne Vertauschung ist »ungerade«.
    explanation: Sam Loyd bot 1000 Dollar für die Lösung – wohl wissend, dass es keine gibt. Eine Invariante schützte sein Geld.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: In einer Klasse wechseln Kinder die Plätze, und jeder Tausch senkt die Zahl der Streitpaare um mindestens 1. Warum muss das Tauschen irgendwann enden?
    params:
      options:
        - label: Eine ganze Zahl ab 0 kann nicht unendlich oft sinken.
          correct: true
        - label: Weil die Kinder müde werden.
          feedback: Gesucht ist ein mathematischer Grund, der für jede Klasse gilt.
        - label: Weil die Zahl der Streitpaare gleich bleibt.
          feedback: Sie bleibt nicht gleich – sie sinkt bei jedem Tausch.
    hints:
      - Wie viele Streitpaare gibt es höchstens am Anfang?
      - Kann eine natürliche Zahl unendlich oft um 1 kleiner werden?
    explanation: Eine Größe, die sich nur in eine Richtung ändert, heißt **Monovariante**. Weil es keine unendlich absteigende Folge natürlicher Zahlen gibt, ist nach endlich vielen Tauschen Schluss.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man mit einer Invariante beweist, dass etwas unmöglich ist.
    params:
      keywords:
        - - gleich
          - ändert sich nicht
          - unverändert
          - stays
          - unchanged
          - same
        - - jeder zug
          - jedem zug
          - jeder schritt
          - every move
          - each move
          - every step
        - - ziel
          - unmöglich
          - nie
          - goal
          - impossible
          - never
      sample: Man sucht eine Größe, die bei jedem Zug gleich bleibt, etwa eine Summe oder eine Farbe. Hat das Ziel einen anderen Wert dieser Größe, ist es unmöglich zu erreichen.
    difficulty: 3

srs:
  cards_from: [schokolade, turnier]
