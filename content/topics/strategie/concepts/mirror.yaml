id: logic.strategy.mirror
type: concept
title: Die Kraft der Symmetrie
summary: Wer spiegelt, gewinnt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Spiegeln gewinnt
    body: Ein Schachspieler kann gegen zwei Profis antreten und nie beide Partien verlieren – er kopiert einfach ihre Züge. Spiegeln ist eine starke **Strategie**. Ergänze die rechte Hälfte genau spiegelbildlich zur roten Achse.
    visual:
      widget: pixels
      interactive: true
      params:
        mirror: vertical
        cells:
          - .#....
          - "###..."
          - .##...
          - ..#...
        locked:
          - xxx...
          - xxx...
          - xxx...
          - xxx...

  - kind: problem
    id: tisch
    widget: choice
    body: Zwei Spieler legen abwechselnd Münzen auf einen runden Tisch. Keine darf überlappen. Wer keinen Platz mehr findet, verliert.
    prompt: Wie gewinnt der erste Spieler sicher?
    params:
      options:
        - { label: Erste Münze genau in die Mitte – dann jeden Zug spiegeln, correct: true }
        - { label: Immer an den Rand legen, feedback: "Das hilft nicht dauerhaft. Es braucht eine Antwort auf jeden Zug." }
        - { label: Gar nicht – es ist Glück, feedback: "Es gibt eine sichere Strategie." }
    hints:
      - Welcher Punkt hat keinen Spiegelpartner?
    explanation: Nach der Mitte hat jeder freie Platz ein Spiegelbild. Der erste Spieler findet immer eins.

  - kind: explain
    id: s2
    body: |
      Viele Spiele gewinnt man mit **Symmetrie**: Erst eine symmetrische Lage herstellen, dann jeden Zug spiegeln.
      Der Gegner zieht – und du hast immer eine Antwort.

  - kind: problem
    id: schoko
    widget: choice
    prompt: Eine Schokoladentafel hat 4 × 4 Stücke. Abwechselnd bricht man ein Stück ab. Wer zuletzt bricht, gewinnt. Wer gewinnt?
    params:
      options:
        - { label: "Der Erste – es gibt genau 15 Brüche", correct: true }
        - { label: Der Zweite, feedback: "Zähle die Brüche – 16 Stücke brauchen 15 Brüche." }
        - { label: Wer klüger bricht, feedback: "Die Strategie ist egal – die Zahl der Brüche steht fest." }
    hints:
      - Denk an die Invariante – jeder Bruch macht ein Stück mehr.
    explanation: 15 Brüche, ungerade – der Erste macht den letzten. Strategie spielt keine Rolle.

  - kind: problem
    id: gerade
    widget: numeric
    prompt: Eine Tafel hat {{a}} × {{b}} Stücke. Wie viele Brüche gibt es insgesamt?
    params: { unit: Brüche }
    answer: { value: "{{a * b - 1}}" }
    hints:
      - Von einem Stück bis zu {{a * b}} Stücken.
    explanation: "{{a * b}} − 1 = {{a * b - 1}}."
    variants:
      params: { a: "int[2,6]", b: "int[3,8]" }
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: mix-c1
    widget: order
    prompt: So gewinnst du mit Symmetrie. Ordne.
    params:
      items:
        - label: Eine symmetrische Lage herstellen
        - label: Den Zug des Gegners abwarten
        - label: Seinen Zug genau spiegeln
        - label: Wiederholen, bis er nicht mehr ziehen kann
    hints:
      - Erst die Symmetrie, dann immer nur antworten.
    explanation: Solange der Gegner ziehen kann, hast du die gespiegelte Antwort.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zwei Spieler legen abwechselnd Münzen auf einen runden Tisch, ohne Überlappung. Wer nicht mehr legen kann, verliert. Warum muss die erste Münze in die **Mitte**?
    params:
      options:
        - label: Die Mitte ist der einzige Punkt ohne Spiegelpartner – danach hat jeder Zug des Gegners ein freies Gegenüber
          correct: true
        - label: Weil dort am meisten Platz ist
          feedback: Es geht um Symmetrie, nicht um Platz.
        - label: Das ist egal
          feedback: Ohne die Mitte kann der Gegner selbst spiegeln.
    hints:
      - Welchen Punkt kann der Gegner dir nie »wegspiegeln«?
    explanation: Wer die Symmetrie herstellt, hat immer eine Antwort.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: nim
    prompt: Zwei Reihen mit je 6 Steinen, und der Computer fängt an. Nimm beliebig viele aus einer Reihe. Gewinne mit Spiegeln!
    params:
      piles:
        - 6
        - 6
      first: computer
    hints:
      - Der Computer muss die Gleichheit zerstören.
      - Mach beide Reihen wieder gleich lang – nach jedem seiner Züge.
    explanation: Wer bei zwei gleichen Reihen am Zug ist, verliert. Du stellst nach jedem Zug die Symmetrie wieder her und nimmst den letzten Stein.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: 10 Münzen liegen im Kreis. Abwechselnd nimmt man eine Münze oder zwei, die direkt nebeneinander liegen. Wer die letzte nimmt, gewinnt. Wer kann sicher gewinnen?
    params:
      options:
        - label: Der Zweite – er teilt den Rest in zwei gleiche Reihen und spiegelt.
          correct: true
        - label: Der Erste – er hat einen Zug Vorsprung.
          feedback: Nach dem ersten Zug ist der Kreis eine Reihe. Jetzt kann der Zweite eine Symmetrie bauen.
        - label: Das hängt vom Glück ab.
          feedback: Hier gibt es keinen Zufall – einer hat eine sichere Strategie.
    hints:
      - Nach dem ersten Zug liegen 8 oder 9 Münzen in einer offenen Reihe.
      - Nimm aus der Mitte so, dass links und rechts gleich viele bleiben.
    explanation: Bei 9 Münzen nimmt der Zweite die mittlere, bei 8 die zwei mittleren. Dann liegen zwei gleiche Reihen da, und er spiegelt jeden Zug.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie »rückwärts denken« bei Spielen funktioniert.
    params:
      keywords:
        - - ende
          - end
          - letzt
          - last
          - ziel
          - goal
        - - verlier
          - verlust
          - gewinn
          - lose
          - losing
          - win
        - - zurück
          - rückwärts
          - back
          - davor
          - before
          - vorher
      sample: "Man beginnt am Ende und fragt: Bei welcher Lage verliert, wer am Zug ist? Von dort geht man Schritt für Schritt rückwärts und markiert alle Lagen, aus denen man den Gegner in eine solche Verlustlage bringen kann."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Bei »Chomp« beißt man abwechselnd ein Rechteck aus einer Schokoladentafel; das Stück unten links ist giftig. Warum weiß man, dass der Erste gewinnen kann – ohne seine Strategie zu kennen?
    params:
      options:
        - label: Hätte der Zweite eine Gewinnstrategie, könnte der Erste sie »stehlen«.
          correct: true
        - label: Weil der Erste mehr Schokolade bekommt.
          feedback: Die Menge zählt nicht – nur, wer das giftige Stück nehmen muss.
        - label: Weil man alle Partien ausprobiert hat.
          feedback: Für große Tafeln wurde das nie ausgerechnet – der Beweis kommt ohne Rechnung aus.
    hints:
      - Der Erste beißt nur das Stück oben rechts ab. Angenommen, der Zweite hat darauf eine gute Antwort.
      - Diese Antwort hätte der Erste auch gleich als ersten Zug spielen können.
    explanation: Das ist das **Strategieklau-Argument**. Jede Antwort des Zweiten auf »oben rechts« schließt dieses Stück mit ein. Der Erste hätte sie also selbst als ersten Zug machen können. Das beweist die Existenz einer Strategie, ohne sie zu nennen.
    difficulty: 3

srs:
  cards_from: [tisch, gerade]
