id: logic.strategy.invariants
type: concept
title: What Never Changes
summary: Invariants prove the impossible.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The invisible rule
    body: "Some things are impossible, however clever you are. Sort the bars: tap two to swap them. One swap is enough. Can you also do it with exactly two swaps? Something here always stays the **same**."
    visual:
      widget: swap
      interactive: true
      params:
        values:
          - 2
          - 1
          - 3
        adjacent: false

  - kind: problem
    id: schachbrett
    widget: choice
    prompt: A chessboard is missing two opposite corner squares. Can you cover it completely with dominoes? Each domino covers two adjacent squares.
    params:
      options:
        - { label: No, correct: true }
        - { label: Yes, feedback: "62 squares sounds like a fit. But look at the colors of the corners." }
    hints:
      - What color are the two missing corners?
    explanation: Both corners have the same color. But each domino covers one light and one dark square.

  - kind: explain
    id: s2
    body: |
      Each domino covers **one light and one dark** square. Here, two squares of the same color are missing, so it never works out.
      This is called an **invariant**: a quantity that never changes.

  - kind: problem
    id: tafel
    widget: choice
    body: The numbers 1 to 10 are on a board. You erase two and write their difference. You repeat this until one number is left.
    prompt: Can the final number be 0?
    params:
      options:
        - { label: "No, the result is always odd.", correct: true }
        - { label: "Yes, with the right order.", feedback: "Try it. The sum always stays odd." }
    hints:
      - Check whether the sum of all numbers is even or odd, and whether that changes.
    explanation: The sum starts at 55, which is odd. Each step changes it by an even number.

  - kind: problem
    id: schokolade
    widget: numeric
    prompt: A chocolate bar has {{a}} × {{b}} pieces. How many breaks do you need until all pieces are separate?
    params: { unit: breaks }
    answer: { value: "{{a * b - 1}}" }
    feedback:
      - when: "numval(state.input) == a * b"
        misconception: off-by-one
        text: Almost. At the start, you already have one piece.
    hints:
      - Each break turns one piece into two.
    explanation: "Going from 1 to {{a * b}} pieces takes {{a * b - 1}} breaks, no matter how."
    variants:
      params: { a: "int[3,6]", b: "int[4,8]" }
      defaults: { a: 4, b: 6 }

  - kind: problem
    id: turnier
    widget: numeric
    prompt: In a knockout tournament, {{n}} teams play. How many games are needed to find the winner?
    params: { unit: games }
    answer: { value: "{{n - 1}}" }
    hints:
      - Each game eliminates exactly one team.
    explanation: "All {{n - 1}} other teams are eliminated, one game per team."
    variants:
      params: { n: "choice[8,16,20,32,64]" }
      defaults: { n: 16 }

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An [[invariant]] is something that no move [[changes]]. With it you show that something is impossible.
      distractors:
        - strategy
        - repeats

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: 7 glasses stand on a table, all upside down. In each move you turn exactly **two** over. Can you get them all upright?
    params:
      options:
        - label: No – the number of upside-down glasses always stays odd
          correct: true
        - label: Yes, with enough moves
          feedback: Each move changes the count by 2, 0 or −2.
        - label: Only with an even number of moves
          feedback: The number of moves does not change the parity.
    hints:
      - By how much does the number of upside-down glasses change per move?
    explanation: 7 is odd, 0 is even – and every move preserves the **parity**. Impossible.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: The numbers 1 to {{n}} are on the board. Each time you erase two and write their sum. In the end one number is left. Which one?
    answer:
      value: "{{n * (n + 1) / 2}}"
    hints:
      - What happens to the total of all numbers when you replace two by their sum?
      - The total stays the same. Compute 1 + 2 + … + {{n}} = {{n}} · {{n + 1}} / 2.
    explanation: The total is an invariant. So {{n * (n + 1) / 2}} is left at the end – whatever order you erase in.
    difficulty: 2
    variants:
      params:
        n: int[6,20]
      defaults:
        n: 10

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: A knight stands on a light square. Can it be back on exactly this square after exactly 7 moves?
    params:
      options:
        - label: No – after an odd number of moves it stands on a dark square.
          correct: true
        - label: Yes, it just has to jump back and forth cleverly.
          feedback: There and back is two moves – that always gives an even number.
        - label: Only at the edge of the board.
          feedback: The colour rule holds everywhere on the board.
    hints:
      - What colour is the square a knight lands on compared with where it started?
      - Every move changes the colour. Where is it after 1, 2, 3 … moves?
    explanation: A knight move always changes colour. After 7 moves the colour has changed – but the starting square has the old one. The parity of the number of moves decides.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The 15 puzzle: can only tiles 14 and 15 be swapped while everything else stays?"
    params:
      options:
        - label: No – every reachable position needs an even number of swaps
          correct: true
        - label: Yes, with very many moves
          feedback: Exactly half of all positions are unreachable.
        - label: Nobody knows
          feedback: It was proved in 1879.
    hints:
      - A single swap is “odd”.
    explanation: Sam Loyd offered 1000 dollars for the solution – knowing full well there is none. An invariant protected his money.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Children in a class swap seats, and every swap lowers the number of quarrelling pairs by at least 1. Why must the swapping end at some point?
    params:
      options:
        - label: A whole number starting from 0 upwards cannot go down forever.
          correct: true
        - label: Because the children get tired.
          feedback: We want a mathematical reason that works for every class.
        - label: Because the number of quarrelling pairs stays the same.
          feedback: It does not stay the same – it drops with every swap.
    hints:
      - How many quarrelling pairs can there be at the start at most?
      - Can a natural number get smaller by 1 infinitely often?
    explanation: A quantity that only ever moves in one direction is called a monovariant. Since there is no infinite descending sequence of natural numbers, the swapping stops after finitely many steps.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how an invariant proves that something is impossible.
    params:
      keywords:
        - - gleich
          - ändert sich nicht
          - unverändert
          - stays
          - unchanged
          - same
        - - jeder zug
          - jedem zug
          - jeder schritt
          - every move
          - each move
          - every step
        - - ziel
          - unmöglich
          - nie
          - goal
          - impossible
          - never
      sample: You look for a quantity that stays the same with every move, such as a sum or a colour. If the goal has a different value, it is impossible to reach.
    difficulty: 3

srs:
  cards_from: [schokolade, turnier]
