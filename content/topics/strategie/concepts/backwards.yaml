id: logic.strategy.backwards
type: concept
title: Rückwärts denken
summary: Das Steine-Spiel und seine Gewinnformel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Spiel vom Ende her
    body: Gegen diesen Computer gewinnt nur, wer vom **Ende her** denkt. Ihr nehmt abwechselnd 1 oder 2 Steine. Wer den letzten nimmt, gewinnt. Spiel ein paar Runden – wann sitzt der Computer in der Falle?
    visual:
      widget: nim
      interactive: true
      params:
        piles:
          - 7
        maxTake: 2

  - kind: problem
    id: fuenf
    widget: numeric
    body: Spiel – abwechselnd nimmt jeder 1, 2 oder 3 Steine. Wer den letzten nimmt, gewinnt.
    prompt: Es liegen 5 Steine da und du bist dran. Wie viele nimmst du?
    params: { unit: Steine }
    answer: { value: 1 }
    feedback:
      - when: "numval(state.input) == 2 || numval(state.input) == 3"
        misconception: greedy
        text: Dann bleiben 3 oder 2 übrig – und dein Gegner nimmt sie alle.
    hints:
      - Wie viele Steine soll dein Gegner vor sich haben?
    explanation: Bleiben 4 übrig, kannst du immer auf 4 ergänzen und den letzten nehmen.

  - kind: explain
    id: s2
    body: |
      **Rückwärts denken:** Wer vor 4 Steinen steht, verliert. Was er auch nimmt, du nimmst den Rest.
      Lass deinem Gegner also immer ein Vielfaches von 4 übrig.

  - kind: problem
    id: n-steine
    widget: numeric
    prompt: Jetzt liegen {{n}} Steine da. Wie viele nimmst du, um sicher zu gewinnen?
    params: { unit: Steine }
    answer: { value: "{{mod(n, 4)}}" }
    hints:
      - Welches Vielfache von 4 liegt knapp unter {{n}}?
    explanation: "Du nimmst {{mod(n, 4)}}. Dann bleiben {{n - mod(n, 4)}} – ein Vielfaches von 4."
    variants:
      params: { n: "int[6,23]" }
      constraints: ["mod(n, 4) != 0"]
      defaults: { n: 10 }

  - kind: problem
    id: anfangen
    widget: choice
    prompt: Bei welcher Startzahl lässt du lieber den anderen anfangen?
    params:
      layout: grid
      options:
        - { label: "12", correct: true }
        - { label: "10", feedback: "Bei 10 nimmst du 2 und gewinnst selbst." }
        - { label: "13", feedback: "Bei 13 nimmst du 1 und gewinnst." }
        - { label: "15", feedback: "Bei 15 nimmst du 3 und gewinnst." }
    hints:
      - Wann gibt es keinen guten ersten Zug?
    explanation: Bei Vielfachen von 4 verliert, wer anfängt – wenn der andere richtig spielt.

  - kind: explain
    id: s5
    body: Was ändert sich, wenn man 1 bis 5 Steine nehmen darf?
    reveal:
      body: Dann verlieren die Vielfachen von 6. Allgemein – größter erlaubter Zug plus 1.

  - kind: problem
    id: bis-fuenf
    widget: numeric
    prompt: Man darf 1 bis 5 Steine nehmen. Es liegen 20 da. Wie viele nimmst du?
    params: { unit: Steine }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: old-rule
        text: Das war die alte Regel mit 4. Jetzt zählen Vielfache von 6.
    hints:
      - Das nächste Vielfache von 6 unter 20 ist 18.
    explanation: 20 − 2 = 18, ein Vielfaches von 6.

  - kind: problem
    id: gegen-computer
    widget: nim
    prompt: Jetzt im Ernst – du spielst gegen einen Computer, der keine Fehler macht. 10 Steine, nimm 1 bis 3.
    params: { piles: [10], maxTake: 3 }
    hints:
      - Lass dem Computer immer ein Vielfaches von 4 übrig.
    explanation: Erst 2 nehmen, dann bleiben 8. Danach ergänzt du jeden Zug auf 4.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Man darf 1 bis 4 Steine nehmen. Wer den letzten nimmt, gewinnt. Es liegen 23 da und du bist dran. Wie viele nimmst du?
    answer:
      value: 3
    hints:
      - Lass dem Gegner ein Vielfaches von 5.
    explanation: 23 − 3 = 20. Danach ergänzt du jeden Zug des Gegners auf 5.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: nim
    prompt: Ein Haufen mit 13 Steinen. Jeder nimmt 1 bis 4. Wer den letzten nimmt, gewinnt. Schlag den Computer!
    params:
      piles:
        - 13
      maxTake: 4
    hints:
      - Welche Zahlen sind jetzt die Verliererstellungen? Größter Zug plus 1 …
      - Lass immer ein Vielfaches von 5 liegen – also nimm zuerst 3.
    explanation: 13 = 2 · 5 + 3. Nimm 3, dann ergänzt du jeden Zug des Computers zu 5.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Man darf 1 bis {{m}} Steine nehmen, wer den letzten nimmt, gewinnt. Es liegen {{n}} da, du bist dran. Wie viele nimmst du?
    answer:
      value: "{{mod(n, m + 1)}}"
    feedback:
      - when: numval(state.input) == mod(n, m)
        misconception: cycle-m
        text: "Der Takt ist nicht {{m}}, sondern {{m + 1}}: dein Zug plus der des Gegners."
    hints:
      - Welche Stellungen verliert man? Die Vielfachen von {{m + 1}}.
      - Teile {{n}} durch {{m + 1}} und schau auf den Rest.
    explanation: "{{n}} geteilt durch {{m + 1}} lässt den Rest {{mod(n, m + 1)}}. Nimm ihn weg, dann bleibt ein Vielfaches von {{m + 1}} – und du ergänzt jeden Zug zu {{m + 1}}."
    difficulty: 2
    variants:
      params:
        m: int[2,6]
        n: int[15,40]
      constraints:
        - mod(n, m + 1) != 0
        - mod(n, m) != mod(n, m + 1)
      defaults:
        m: 3
        n: 22

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Die Regel ändert sich: Wer den letzten Stein nimmt, **verliert**. Man darf 1 bis 3 nehmen. Welche Zahl musst du dem Gegner jetzt übrig lassen?"
    params:
      options:
        - label: 1, 5, 9, 13 … – immer ein Vielfaches von 4 plus 1
          correct: true
        - label: 4, 8, 12 … wie vorher
          feedback: Bei 4 nimmt der Gegner 3 und lässt dir den letzten.
        - label: 2, 6, 10 …
          feedback: Bei 2 nimmt der Gegner einen und du musst den letzten nehmen.
    hints:
      - Wer vor genau 1 Stein steht, verliert. Rechne von dort rückwärts.
    explanation: "Die Methode bleibt gleich: vom Ende her denken. Nur die Verlustpositionen verschieben sich um 1."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Neue Regel: Man darf 1, 3 oder 4 Steine nehmen – aber nie 2. Wer den letzten nimmt, gewinnt. Welche Zahl zwischen 5 und 8 ist eine Verliererstellung für den, der am Zug ist?"
    answer:
      value: 7
    hints:
      - "Rechne von unten: 0 verliert. 1, 3, 4 gewinnen, denn man kann auf 0 ziehen. Was ist mit 2?"
      - Eine Stellung verliert, wenn **jeder** Zug in eine Gewinnstellung führt. Prüfe 5, 6, 7, 8.
    explanation: Verlierer sind 0, 2, 7, 9, 14, 16 … Von 7 kommt man nur nach 6, 4 oder 3 – lauter Gewinnstellungen für den Gegner. Ohne Formel hilft nur systematisches **Rückwärtsrechnen**.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Ein Spiel ist endlich, ohne Zufall, ohne Geheimnisse und ohne Unentschieden. Was gilt dann immer?
    params:
      options:
        - label: Einer der beiden Spieler hat eine sichere Gewinnstrategie.
          correct: true
        - label: Wer anfängt, gewinnt.
          feedback: Bei 12 Steinen und 1 bis 3 pro Zug gewinnt der Zweite.
        - label: Wer gewinnt, hängt vom Glück ab.
          feedback: Ohne Zufall entscheidet allein, wer klug spielt.
    hints:
      - "Denk an das Rückwärtsrechnen: Jede Endstellung ist gewonnen oder verloren."
      - Dann ist jede Stellung davor ebenso eindeutig bestimmt – bis zum Start.
    explanation: "Das ist der **Satz von Zermelo**. Man rechnet vom Ende her jede Stellung als gewonnen oder verloren aus. Für Schach mit Remis heißt das: Weiß gewinnt, Schwarz gewinnt oder beide erzwingen ein Remis. Welcher Fall gilt, weiß niemand – der Baum ist zu groß."
    difficulty: 3

srs:
  cards_from: [n-steine, bis-fuenf]
