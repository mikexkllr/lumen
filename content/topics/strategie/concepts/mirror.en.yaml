id: logic.strategy.mirror
type: concept
title: The Power of Symmetry
summary: Whoever mirrors, wins.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: tisch
    widget: choice
    body: Two players take turns placing coins on a round table. No coin may overlap another. Whoever can't find room loses.
    prompt: How does the first player win for sure?
    params:
      options:
        - { label: "First coin exactly in the center, then mirror every move", correct: true }
        - { label: Always place at the edge, feedback: "That doesn't help in the long run. You need an answer to every move." }
        - { label: "Not at all, it is luck", feedback: "There is a sure strategy." }
    hints:
      - Which point has no mirror partner?
    explanation: After the center, every free spot has a mirror image. The first player always finds one.

  - kind: explain
    body: |
      Many games are won with **symmetry**: First create a symmetric position, then mirror every move.
      Your opponent moves, and you always have an answer.

  - kind: problem
    id: schoko
    widget: choice
    prompt: A chocolate bar has 4 × 4 pieces. Players take turns breaking off one piece. Whoever breaks last wins. Who wins?
    params:
      options:
        - { label: "The first player, since there are exactly 15 breaks", correct: true }
        - { label: The second player, feedback: "Count the breaks. 16 pieces need 15 breaks." }
        - { label: Whoever breaks more cleverly, feedback: "Strategy doesn't matter. The number of breaks is fixed." }
    hints:
      - Think of the invariant. Each break adds one piece.
    explanation: 15 breaks, an odd number, so the first player makes the last one. Strategy plays no role.

  - kind: problem
    id: gerade
    widget: numeric
    prompt: A bar has {{a}} × {{b}} pieces. How many breaks are there in total?
    params: { unit: breaks }
    answer: { value: "{{a * b - 1}}" }
    hints:
      - From one piece up to {{a * b}} pieces.
    explanation: "{{a * b}} − 1 = {{a * b - 1}}."
    variants:
      params: { a: "int[2,6]", b: "int[3,8]" }
      defaults: { a: 3, b: 5 }

srs:
  cards_from: [tisch, gerade]
