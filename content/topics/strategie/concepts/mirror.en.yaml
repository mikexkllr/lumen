id: logic.strategy.mirror
type: concept
title: The Power of Symmetry
summary: Whoever mirrors, wins.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: tisch
    widget: choice
    body: Two players take turns placing coins on a round table. No coin may overlap another. Whoever can't find room loses.
    prompt: How does the first player win for sure?
    params:
      options:
        - { label: "First coin exactly in the center, then mirror every move", correct: true }
        - { label: Always place at the edge, feedback: "That doesn't help in the long run. You need an answer to every move." }
        - { label: "Not at all, it is luck", feedback: "There is a sure strategy." }
    hints:
      - Which point has no mirror partner?
    explanation: After the center, every free spot has a mirror image. The first player always finds one.

  - kind: explain
    id: s2
    body: |
      Many games are won with **symmetry**: First create a symmetric position, then mirror every move.
      Your opponent moves, and you always have an answer.

  - kind: problem
    id: schoko
    widget: choice
    prompt: A chocolate bar has 4 × 4 pieces. Players take turns breaking off one piece. Whoever breaks last wins. Who wins?
    params:
      options:
        - { label: "The first player, since there are exactly 15 breaks", correct: true }
        - { label: The second player, feedback: "Count the breaks. 16 pieces need 15 breaks." }
        - { label: Whoever breaks more cleverly, feedback: "Strategy doesn't matter. The number of breaks is fixed." }
    hints:
      - Think of the invariant. Each break adds one piece.
    explanation: 15 breaks, an odd number, so the first player makes the last one. Strategy plays no role.

  - kind: problem
    id: gerade
    widget: numeric
    prompt: A bar has {{a}} × {{b}} pieces. How many breaks are there in total?
    params: { unit: breaks }
    answer: { value: "{{a * b - 1}}" }
    hints:
      - From one piece up to {{a * b}} pieces.
    explanation: "{{a * b}} − 1 = {{a * b - 1}}."
    variants:
      params: { a: "int[2,6]", b: "int[3,8]" }
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: mix-c1
    widget: order
    prompt: This is how you win with symmetry. Order.
    params:
      items:
        - label: Create a symmetric position
        - label: Wait for the opponent’s move
        - label: Mirror their move exactly
        - label: Repeat until they cannot move
    hints:
      - First the symmetry, then only ever respond.
    explanation: As long as the opponent can move, you have the mirrored reply.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Two players alternately place coins on a round table without overlap. Whoever cannot place one loses. Why must the first coin go in the **centre**?
    params:
      options:
        - label: The centre is the only point without a mirror partner – after that every opponent move has a free counterpart
          correct: true
        - label: Because there is the most room there
          feedback: It is about symmetry, not room.
        - label: It does not matter
          feedback: Without the centre the opponent can mirror themselves.
    hints:
      - Which point can the opponent never “mirror away” from you?
    explanation: Whoever establishes the symmetry always has a reply.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: nim
    prompt: Two rows of 6 stones each, and the computer starts. Take any number from one row. Win by mirroring!
    params:
      piles:
        - 6
        - 6
      first: computer
    hints:
      - The computer has to break the equality.
      - Make both rows equal again – after every one of its moves.
    explanation: Whoever moves when the rows are equal loses. You restore the symmetry after every move and take the last stone.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: 10 coins lie in a circle. Players alternately take one coin or two neighbouring coins. Whoever takes the last coin wins. Who can win for sure?
    params:
      options:
        - label: The second player – he splits the rest into two equal rows and mirrors.
          correct: true
        - label: The first player – he is one move ahead.
          feedback: After the first move the circle is a row, and now the second player can build a symmetry.
        - label: It depends on luck.
          feedback: There is no chance here – one player has a sure strategy.
    hints:
      - After the first move 8 or 9 coins lie in an open row.
      - Take from the middle so that equal numbers remain left and right.
    explanation: With 9 coins the second player takes the middle one, with 8 the two middle ones. Then there are two equal rows and he mirrors every move.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux how “thinking backwards” works in games.
    params:
      keywords:
        - - ende
          - end
          - letzt
          - last
          - ziel
          - goal
        - - verlier
          - verlust
          - gewinn
          - lose
          - losing
          - win
        - - zurück
          - rückwärts
          - back
          - davor
          - before
          - vorher
      sample: "You start at the end and ask: in which position does the player to move lose? From there you go backwards step by step and mark all positions from which you can put the opponent into such a losing position."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: In "Chomp" players take turns biting a rectangle off a chocolate bar; the bottom-left piece is poisoned. Why do we know the first player can win – without knowing the strategy?
    params:
      options:
        - label: If the second player had a winning strategy, the first could "steal" it.
          correct: true
        - label: Because the first player gets more chocolate.
          feedback: The amount does not matter – only who must take the poisoned piece.
        - label: Because all games have been tried.
          feedback: For large bars this was never computed – the proof needs no computation.
    hints:
      - The first player bites off only the top-right piece. Suppose the second has a good reply to that.
      - The first player could have played that reply as his very first move.
    explanation: This is the strategy-stealing argument. Any reply by the second player to "top right" removes that piece too, so the first player could have played it himself. It proves a strategy exists without naming it.
    difficulty: 3

srs:
  cards_from: [tisch, gerade]
