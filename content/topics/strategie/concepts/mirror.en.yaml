id: logic.strategy.mirror
type: concept
title: The Power of Symmetry
summary: Whoever mirrors, wins.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: tisch
    widget: choice
    body: Two players take turns placing coins on a round table. No coin may overlap another. Whoever can't find room loses.
    prompt: How does the first player win for sure?
    params:
      options:
        - { label: "First coin exactly in the center, then mirror every move", correct: true }
        - { label: Always place at the edge, feedback: "That doesn't help in the long run. You need an answer to every move." }
        - { label: "Not at all, it is luck", feedback: "There is a sure strategy." }
    hints:
      - Which point has no mirror partner?
    explanation: After the center, every free spot has a mirror image. The first player always finds one.

  - kind: explain
    id: s2
    body: |
      Many games are won with **symmetry**: First create a symmetric position, then mirror every move.
      Your opponent moves, and you always have an answer.

  - kind: problem
    id: schoko
    widget: choice
    prompt: A chocolate bar has 4 × 4 pieces. Players take turns breaking off one piece. Whoever breaks last wins. Who wins?
    params:
      options:
        - { label: "The first player, since there are exactly 15 breaks", correct: true }
        - { label: The second player, feedback: "Count the breaks. 16 pieces need 15 breaks." }
        - { label: Whoever breaks more cleverly, feedback: "Strategy doesn't matter. The number of breaks is fixed." }
    hints:
      - Think of the invariant. Each break adds one piece.
    explanation: 15 breaks, an odd number, so the first player makes the last one. Strategy plays no role.

  - kind: problem
    id: gerade
    widget: numeric
    prompt: A bar has {{a}} × {{b}} pieces. How many breaks are there in total?
    params: { unit: breaks }
    answer: { value: "{{a * b - 1}}" }
    hints:
      - From one piece up to {{a * b}} pieces.
    explanation: "{{a * b}} − 1 = {{a * b - 1}}."
    variants:
      params: { a: "int[2,6]", b: "int[3,8]" }
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: mix-c1
    widget: order
    prompt: This is how you win with symmetry. Order.
    params:
      items:
        - label: Create a symmetric position
        - label: Wait for the opponent’s move
        - label: Mirror their move exactly
        - label: Repeat until they cannot move
    hints:
      - First the symmetry, then only ever respond.
    explanation: As long as the opponent can move, you have the mirrored reply.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Two players alternately place coins on a round table without overlap. Whoever cannot place one loses. Why must the first coin go in the **centre**?
    params:
      options:
        - label: The centre is the only point without a mirror partner – after that every opponent move has a free counterpart
          correct: true
        - label: Because there is the most room there
          feedback: It is about symmetry, not room.
        - label: It does not matter
          feedback: Without the centre the opponent can mirror themselves.
    hints:
      - Which point can the opponent never “mirror away” from you?
    explanation: Whoever establishes the symmetry always has a reply.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux how “thinking backwards” works in games.
    params:
      keywords:
        - - ende
          - end
          - letzt
          - last
          - ziel
          - goal
        - - verlier
          - verlust
          - gewinn
          - lose
          - losing
          - win
        - - zurück
          - rückwärts
          - back
          - davor
          - before
          - vorher
      sample: "You start at the end and ask: in which position does the player to move lose? From there you go backwards step by step and mark all positions from which you can put the opponent into such a losing position."
    difficulty: 3

srs:
  cards_from: [tisch, gerade]
