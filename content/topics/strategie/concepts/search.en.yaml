id: logic.strategy.search
type: concept
title: Weighing and Guessing
summary: Three outcomes beat two.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Every answer is a bit
    body: "In a guessing game, the clever questioner wins. Every yes-no answer is a **bit**: on or off. Flip the four lamps. Can you see how many numbers just four answers can tell apart?"
    visual:
      widget: bits
      interactive: true
      params:
        bits: 4

  - kind: problem
    id: neun
    widget: numeric
    prompt: One of 9 coins is lighter. What is the fewest weighings on a balance scale that find it for sure?
    params: { unit: weighings }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 3 || numval(state.input) == 4"
        misconception: halving
        text: Halving works, but it isn't the best. Try three groups.
    hints:
      - One weighing has three possible outcomes.
    explanation: 3 groups of 3. One weighing finds the group, a second finds the coin.

  - kind: explain
    id: s2
    body: |
      Each **weighing** has **three** outcomes: left heavier, right heavier, equal.
      So always split into **three** groups.

  - kind: problem
    id: schritte
    widget: order
    prompt: Put the steps in the right order.
    params:
      items:
        - { label: Split the 9 coins into three groups of 3. }
        - { label: Put two groups on the scale. }
        - { label: "Take the lighter group, or the third." }
        - { label: Put two coins from it on the scale. }
        - { label: "The lighter one is it, or the third." }
    hints:
      - First form groups, then weigh.
    explanation: Split into thirds twice, so 9, 3, 1.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: How many coins can you check at most with {{w}} weighings, if exactly one is lighter?
    params: { unit: coins }
    answer: { value: "{{3 ** w}}" }
    feedback:
      - when: "numval(state.input) == 2 ** w"
        misconception: binary
        text: That would be with two outcomes. The scale has three.
    hints:
      - Each weighing triples the possibilities.
    explanation: "3 to the power of {{w}} = {{3 ** w}} coins."
    variants:
      params: { w: "int[3,5]" }
      defaults: { w: 3 }

  - kind: problem
    id: raten
    widget: choice
    prompt: Someone thinks of a number from 1 to 100. You may only ask "higher or lower?" How many questions are enough for sure?
    params:
      layout: grid
      options:
        - { label: "7", correct: true }
        - { label: "10", feedback: "That is enough, but you can do it with fewer." }
        - { label: "50", feedback: "Far too many. Halve the range each time." }
        - { label: "5", feedback: "5 questions only cover 32 numbers." }
    hints:
      - Each question halves the range. How often do you halve 100 down to 1?
    explanation: $2^7 = 128$ is enough for 100 numbers, but $2^6 = 64$ is not.

  - kind: explain
    id: s6
    body: What do the scale and number guessing have in common?
    reveal:
      body: Both make the most of every answer. Two outcomes halve, three outcomes split into thirds. This is the core idea of **information theory**.

  - kind: problem
    id: intro-c1
    widget: bits
    prompt: 'Someone thinks of a number from 0 to 15. You ask: "Is the 8 lamp on?", then about the 4, the 2 and the 1. The answers: yes, yes, no, yes. Set the number.'
    params:
      bits: 4
    answer:
      value: 13
    hints:
      - Yes means on, no means off. The first answer belongs to the 8.
      - Switch on 8, 4 and 1. The 2 stays off.
    explanation: 8 + 4 + 1 = 13. Four yes-no questions cover 16 numbers, because each question halves the possibilities.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Of 27 coins one is lighter. How many weighings are needed at least?
    answer:
      value: 3
    hints:
      - 3 groups of 9, then of 3, then single.
    explanation: 3³ = 27. Each weighing cuts the suspects to a third.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: One of 10 coins is lighter. How many weighings do you need at least to find it **for sure**?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 2
        misconception: ceil-missing
        text: Two weighings have 3 · 3 = 9 outcomes – too few for 10 coins.
    hints:
      - With w weighings you can check at most 3^w coins.
      - Which power of 3 is at least 10?
    explanation: 3² = 9 is not enough, 3³ = 27 is. So 3 weighings. The number needed always rounds up.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Someone thinks of a number from 1 to {{2 ** k}}. You only ask "higher or lower?". How many questions are always enough?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 ** k / 2
        misconception: linear-not-log
        text: Halving does not mean asking about half the numbers. Each question halves what is left.
    hints:
      - Each question halves the candidates.
      - How often can you halve {{2 ** k}} until 1 is left?
    explanation: "{{2 ** k}} = 2^{{k}}, so {{k}} questions. This is binary search. Even a million numbers need only 20 questions."
    difficulty: 2
    variants:
      params:
        k: int[4,12]
      defaults:
        k: 10

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Of 12 coins one is fake – but you do not know whether heavier or lighter. Why do exactly 3 weighings just suffice?
    params:
      options:
        - label: There are 24 possible cases, and 3 weighings distinguish up to 27
          correct: true
        - label: Because 12 is divisible by 3
          feedback: The reason is the number of cases.
        - label: Even 2 suffice
          feedback: 2 weighings distinguish only 9 cases.
    hints:
      - 12 coins times 2 possibilities (heavier, lighter).
    explanation: 24 ≤ 27. The number of distinguishable outcomes sets a hard limit – an argument from **information theory**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: In "20 questions" you may ask 20 yes–no questions. From how many things can you find the right one for sure at most?
    answer:
      value: 1048576
    feedback:
      - when: numval(state.input) == 40
        misconception: additive
        text: Every question doubles the count instead of adding 2.
    hints:
      - One question tells 2 things apart, two questions 4 …
      - Compute 2^20.
    explanation: 2^20 = 1,048,576. Each answer gives at most one bit of information, so N things need at least log₂ N questions.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why you split coins into three groups for weighing, not two.
    params:
      keywords:
        - - drei
          - three
        - - ausgäng
          - ausgang
          - ergebnis
          - möglich
          - outcome
          - result
        - - links
          - rechts
          - gleich
          - left
          - right
          - equal
          - balance
      sample: "A weighing has three outcomes: left heavier, right heavier or equal. With three groups each outcome tells you which group holds the odd coin, so every weighing is fully used."
    difficulty: 3

srs:
  cards_from: [neun, wie-viele]
