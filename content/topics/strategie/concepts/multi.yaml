id: logic.strategy.multi
type: concept
title: Mehrere Haufen
summary: Spiegeln und ausgleichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: zwei-gleich
    widget: nim
    prompt: Zwei Reihen mit 4 und 6 Steinen. Nimm beliebig viele aus einer Reihe. Schlag den Computer!
    params: { piles: [4, 6] }
    hints:
      - Mach beide Reihen gleich lang.
      - Danach kopierst du jeden Zug des Computers in der anderen Reihe.
    explanation: Nimm 2 aus der langen Reihe. Dann spiegelst du jeden Zug – und nimmst den letzten Stein.

  - kind: explain
    body: |
      **Spiegelstrategie:** Sind zwei Reihen gleich, macht man jeden Zug des Gegners in der anderen Reihe nach. So bleibt der letzte Zug immer bei dir.

  - kind: problem
    id: drei
    widget: nim
    prompt: Drei Reihen – 2, 5 und 6. Finde einen Weg zum Sieg.
    params: { piles: [2, 5, 6] }
    hints:
      - Nimm 1 aus der Fünferreihe – dann bleiben 2, 4 und 6.
    explanation: 2, 4, 6 ist eine Verliererstellung für den, der am Zug ist. Danach hältst du die Balance.

  - kind: problem
    id: verloren
    widget: choice
    prompt: Bei welcher Stellung verliert der Spieler am Zug – wenn der andere perfekt spielt?
    params:
      options:
        - { label: "3 und 3", correct: true }
        - { label: "3 und 5", feedback: "Hier kann man ausgleichen – also gewinnen." }
        - { label: "1 und 4", feedback: "Nimm 3 aus der 4 – dann stehen 1 und 1." }
    hints:
      - Wann kann der Gegner spiegeln?
    explanation: Bei 3 und 3 spiegelt der Gegner jeden Zug.

srs:
  cards_from: [verloren, zwei-gleich]
