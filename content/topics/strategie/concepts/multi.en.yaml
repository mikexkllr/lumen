id: logic.strategy.multi
type: concept
title: Multiple Piles
summary: Mirror and balance.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: zwei-gleich
    widget: nim
    prompt: Two rows with 4 and 6 stones. Take any number from one row. Beat the computer!
    params: { piles: [4, 6] }
    hints:
      - Make both rows equal in length.
      - Then copy each of the computer's moves in the other row.
    explanation: Take 2 from the long row. Then you mirror every move and take the last stone.

  - kind: explain
    body: |
      **Mirror strategy:** If two rows are equal, copy each of your opponent's moves in the other row. That way, the last move always stays with you.

  - kind: problem
    id: drei
    widget: nim
    prompt: Three rows with 2, 5, and 6. Find a way to win.
    params: { piles: [2, 5, 6] }
    hints:
      - Take 1 from the row of five, which leaves 2, 4, and 6.
    explanation: 2, 4, 6 is a losing position for whoever is to move. After that, you keep the balance.

  - kind: problem
    id: verloren
    widget: choice
    prompt: In which position does the player to move lose, if the other plays perfectly?
    params:
      options:
        - { label: "3 and 3", correct: true }
        - { label: "3 and 5", feedback: "Here you can even things out, so you win." }
        - { label: "1 and 4", feedback: "Take 3 from the 4, leaving 1 and 1." }
    hints:
      - When can the opponent mirror?
    explanation: At 3 and 3, the opponent mirrors every move.

srs:
  cards_from: [verloren, zwei-gleich]
