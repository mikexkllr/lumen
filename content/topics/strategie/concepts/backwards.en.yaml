id: logic.strategy.backwards
type: concept
title: Thinking Backward
summary: The stones game and its winning formula.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: fuenf
    widget: numeric
    body: Game - players take turns taking 1, 2, or 3 stones. Whoever takes the last stone wins.
    prompt: There are 5 stones and it is your turn. How many do you take?
    params: { unit: stones }
    answer: { value: 1 }
    feedback:
      - when: "numval(state.input) == 2 || numval(state.input) == 3"
        misconception: greedy
        text: Then 3 or 2 are left, and your opponent takes them all.
    hints:
      - How many stones should your opponent face?
    explanation: If 4 are left, you can always top up to 4 and take the last one.

  - kind: explain
    id: s2
    body: |
      **Thinking backward:** Whoever faces 4 stones loses. Whatever they take, you take the rest.
      So always leave your opponent a multiple of 4.

  - kind: problem
    id: n-steine
    widget: numeric
    prompt: Now there are {{n}} stones. How many do you take to win for sure?
    params: { unit: stones }
    answer: { value: "{{mod(n, 4)}}" }
    hints:
      - Which multiple of 4 lies just below {{n}}?
    explanation: "You take {{mod(n, 4)}}. That leaves {{n - mod(n, 4)}}, a multiple of 4."
    variants:
      params: { n: "int[6,23]" }
      constraints: ["mod(n, 4) != 0"]
      defaults: { n: 10 }

  - kind: problem
    id: anfangen
    widget: choice
    prompt: With which starting number would you rather let the other player begin?
    params:
      layout: grid
      options:
        - { label: "12", correct: true }
        - { label: "10", feedback: "With 10, you take 2 and win yourself." }
        - { label: "13", feedback: "With 13, you take 1 and win." }
        - { label: "15", feedback: "With 15, you take 3 and win." }
    hints:
      - When is there no good first move?
    explanation: With multiples of 4, whoever starts loses, if the other plays correctly.

  - kind: explain
    id: s5
    body: What changes if you may take 1 to 5 stones?
    reveal:
      body: Then multiples of 6 lose. In general, the largest allowed move plus 1.

  - kind: problem
    id: bis-fuenf
    widget: numeric
    prompt: You may take 1 to 5 stones. There are 20. How many do you take?
    params: { unit: stones }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: old-rule
        text: That was the old rule with 4. Now multiples of 6 count.
    hints:
      - The next multiple of 6 below 20 is 18.
    explanation: 20 − 2 = 18, a multiple of 6.

  - kind: problem
    id: gegen-computer
    widget: nim
    prompt: Now for real. You play against a computer that makes no mistakes. 10 stones, take 1 to 3.
    params: { piles: [10], maxTake: 3 }
    hints:
      - Always leave the computer a multiple of 4.
    explanation: First take 2, leaving 8. After that, top up each move to 4.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You may take 1 to 4 stones. Whoever takes the last wins. There are 23 and it is your turn. How many do you take?
    answer:
      value: 3
    hints:
      - Leave the opponent a multiple of 5.
    explanation: 23 − 3 = 20. After that you complete each of the opponent’s moves to 5.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: nim
    prompt: One pile of 13 stones. Each player takes 1 to 4. Whoever takes the last stone wins. Beat the computer!
    params:
      piles:
        - 13
      maxTake: 4
    hints:
      - Which numbers are the losing positions now? Largest move plus 1 …
      - Always leave a multiple of 5 – so take 3 first.
    explanation: 13 = 2 · 5 + 3. Take 3, then answer every computer move so that the two together make 5.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: You may take 1 to {{m}} stones; whoever takes the last wins. There are {{n}} stones and it is your turn. How many do you take?
    answer:
      value: "{{mod(n, m + 1)}}"
    feedback:
      - when: numval(state.input) == mod(n, m)
        misconception: cycle-m
        text: "The cycle is not {{m}} but {{m + 1}}: your move plus your opponent's."
    hints:
      - Which positions lose? The multiples of {{m + 1}}.
      - Divide {{n}} by {{m + 1}} and look at the remainder.
    explanation: "{{n}} divided by {{m + 1}} leaves remainder {{mod(n, m + 1)}}. Take that, a multiple of {{m + 1}} remains, and you complete every move to {{m + 1}}."
    difficulty: 2
    variants:
      params:
        m: int[2,6]
        n: int[15,40]
      constraints:
        - mod(n, m + 1) != 0
        - mod(n, m) != mod(n, m + 1)
      defaults:
        m: 3
        n: 22

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The rule changes: whoever takes the last stone **loses**. You may take 1 to 3. Which number must you now leave the opponent?"
    params:
      options:
        - label: 1, 5, 9, 13 … – always a multiple of 4 plus 1
          correct: true
        - label: 4, 8, 12 … as before
          feedback: At 4 the opponent takes 3 and leaves you the last.
        - label: 2, 6, 10 …
          feedback: At 2 the opponent takes one and you must take the last.
    hints:
      - Whoever faces exactly 1 stone loses. Work backwards from there.
    explanation: "The method stays the same: think from the end. Only the losing positions shift by 1."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "New rule: you may take 1, 3 or 4 stones – but never 2. Whoever takes the last wins. Which number from 5 to 8 is a losing position for the player to move?"
    answer:
      value: 7
    hints:
      - "Work up from the bottom: 0 loses. 1, 3, 4 win because you can move to 0. What about 2?"
      - A position loses if **every** move leads to a winning position. Check 5, 6, 7, 8.
    explanation: The losing positions are 0, 2, 7, 9, 14, 16 … From 7 you can only reach 6, 4 or 3 – all winning positions for your opponent. Without a formula, only systematic backward analysis helps.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: A game is finite, without chance, without hidden information and without draws. What always holds?
    params:
      options:
        - label: One of the two players has a sure winning strategy.
          correct: true
        - label: The first player wins.
          feedback: With 12 stones and 1 to 3 per move, the second player wins.
        - label: It depends on luck.
          feedback: Without chance, only clever play decides.
    hints:
      - "Think of backward analysis: every final position is won or lost."
      - Then every position before it is just as clearly decided – all the way to the start.
    explanation: "This is Zermelo's theorem. Working back from the end, every position is labelled won or lost. For chess, which has draws, it means: White wins, Black wins, or both can force a draw. Nobody knows which – the tree is too big."
    difficulty: 3

srs:
  cards_from: [n-steine, bis-fuenf]
