id: logic.strategy.search
type: concept
title: Wiegen und Raten
summary: Drei Ausgänge schlagen zwei.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: neun
    widget: numeric
    prompt: Von 9 Münzen ist eine leichter. Wie oft musst du mit einer Balkenwaage mindestens wiegen, um sie sicher zu finden?
    params: { unit: Wägungen }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 3 || numval(state.input) == 4"
        misconception: halving
        text: Halbieren klappt, ist aber nicht das Beste. Probier es mit drei Gruppen.
    hints:
      - Eine Wägung hat drei mögliche Ausgänge.
    explanation: 3 Gruppen zu je 3. Eine Wägung findet die Gruppe, eine zweite die Münze.

  - kind: explain
    id: s2
    body: |
      Jede Wägung hat **drei** Ausgänge – links schwerer, rechts schwerer, gleich.
      Teile deshalb immer in **drei** Gruppen.

  - kind: problem
    id: schritte
    widget: order
    prompt: Bring die Schritte in die richtige Reihenfolge.
    params:
      items:
        - { label: Teile die 9 Münzen in drei Gruppen zu je 3. }
        - { label: Lege zwei Gruppen auf die Waage. }
        - { label: Nimm die leichtere Gruppe – oder die dritte. }
        - { label: Lege zwei Münzen daraus auf die Waage. }
        - { label: Die leichtere ist es – oder die dritte. }
    hints:
      - Erst Gruppen bilden, dann wiegen.
    explanation: Zweimal dritteln – 9, 3, 1.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: Wie viele Münzen kannst du mit {{w}} Wägungen höchstens prüfen, wenn genau eine leichter ist?
    params: { unit: Münzen }
    answer: { value: "{{3 ** w}}" }
    feedback:
      - when: "numval(state.input) == 2 ** w"
        misconception: binary
        text: Das wäre mit zwei Ausgängen. Die Waage hat drei.
    hints:
      - Jede Wägung verdreifacht die Möglichkeiten.
    explanation: "3 hoch {{w}} = {{3 ** w}} Münzen."
    variants:
      params: { w: "int[3,5]" }
      defaults: { w: 3 }

  - kind: problem
    id: raten
    widget: choice
    prompt: Jemand denkt an eine Zahl von 1 bis 100. Du fragst nur »größer oder kleiner?«. Wie viele Fragen reichen sicher?
    params:
      layout: grid
      options:
        - { label: "7", correct: true }
        - { label: "10", feedback: "Das reicht, aber es geht mit weniger." }
        - { label: "50", feedback: "Viel zu viele. Halbiere jedes Mal den Bereich." }
        - { label: "5", feedback: "5 Fragen schaffen nur 32 Zahlen." }
    hints:
      - Jede Frage halbiert den Bereich. Wie oft halbiert man 100 bis auf 1?
    explanation: $2^7 = 128$ reicht für 100 Zahlen, $2^6 = 64$ nicht.

  - kind: explain
    id: s6
    body: Was haben die Waage und das Zahlenraten gemeinsam?
    reveal:
      body: Beide nutzen jede Antwort maximal aus. Zwei Ausgänge halbieren, drei dritteln. Das ist die Grundidee der **Informationstheorie**.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Von 27 Münzen ist eine leichter. Wie viele Wägungen braucht man mindestens?
    answer:
      value: 3
    hints:
      - 3 Gruppen zu je 9, dann zu je 3, dann einzeln.
    explanation: 3³ = 27. Jede Wägung drittelt die Verdächtigen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Von 12 Münzen ist eine falsch – aber du weißt nicht, ob schwerer oder leichter. Warum reichen genau 3 Wägungen gerade so?
    params:
      options:
        - label: Es gibt 24 mögliche Fälle, und 3 Wägungen unterscheiden bis zu 27
          correct: true
        - label: Weil 12 durch 3 teilbar ist
          feedback: Der Grund ist die Zahl der Fälle.
        - label: Es reichen sogar 2
          feedback: 2 Wägungen unterscheiden nur 9 Fälle.
    hints:
      - 12 Münzen mal 2 Möglichkeiten (schwerer, leichter).
    explanation: 24 ≤ 27. Die Zahl der unterscheidbaren Ausgänge setzt eine harte Grenze – ein Argument aus der **Informationstheorie**.
    difficulty: 3

srs:
  cards_from: [neun, wie-viele]
