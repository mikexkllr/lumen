id: logic.quantifiers.math
type: concept
title: Quantifiers in Mathematics
summary: For all and there exists.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: “For every pot there is a lid” and “There is one lid for every pot” – is that the same?
    params:
      options:
        - label: No – in the second sentence one single lid fits all
          correct: true
        - label: Yes
          feedback: The order changes the meaning.
        - label: Both are false
          feedback: It is about meaning, not pots.
    hints:
      - How many lids do you need in each case?
    explanation: Mathematics has symbols for this that leave no doubt.

  - kind: explain
    id: s1
    body: |
      In **mathematics**, $\forall$ means “for all” and $\exists$ means “there exists.” $\forall n\; \exists m: m > n$ says – for every number n there is a larger number m.

  - kind: problem
    id: wahr
    widget: buckets
    prompt: True or false for natural numbers?
    params:
      buckets: [{ label: "true" }, { label: "false" }]
      items:
        - { label: There is an even prime number., bucket: "true" }
        - { label: Every number has a successor., bucket: "true" }
        - { label: All prime numbers are odd., bucket: "false" }
        - { label: There is a largest number., bucket: "false" }
    hints:
      - Think of the number 2.
    explanation: The number 2 makes “there is an even prime” true and “all are odd” false.

  - kind: problem
    id: gegen
    widget: numeric
    prompt: "“All numbers n² + 1 are odd.” Name the smallest n from 1 that contradicts this."
    params: { placeholder: "n" }
    answer: { value: 1 }
    hints:
      - Try n = 1.
    explanation: 1² + 1 = 2 is even – the very first example refutes the statement.

  - kind: problem
    id: beweis
    widget: choice
    prompt: How do you prove a statement of the form “for all n”?
    params:
      options:
        - { label: "With an argument that works for an arbitrary n", correct: true }
        - { label: With many examples, feedback: "Examples only show that it often works – not always." }
    hints:
      - Remember the direct proof.
    explanation: “Let n be arbitrary …” is the start of almost every proof for all numbers.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "“For all real numbers x: x² ≥ x.” Is that true?"
    params:
      options:
        - label: No – for x = 0.5, x² = 0.25
          correct: true
        - label: Yes – squaring makes larger
          feedback: Not between 0 and 1.
        - label: Only not for negative numbers
          feedback: For negatives it even holds.
    hints:
      - Try a number between 0 and 1.
    explanation: One counterexample suffices. For natural numbers the statement would be true – the **domain** decides.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: '"For all n ≥ 1, n² − n + 11 is a prime." What is the smallest n for which this fails?'
    answer:
      value: 11
    hints:
      - "Compute some values: 11, 13, 17, 23, 31 … all primes."
      - For which n is every part divisible by 11?
    explanation: For n = 11 you get 121 − 11 + 11 = 121 = 11 · 11. Ten examples prove nothing; a single counterexample refutes everything.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: buckets
    prompt: What do you need for this?
    params:
      buckets:
        - id: b1
          label: one example is enough
        - id: b2
          label: a general argument
      items:
        - label: "Prove: there is an even prime."
          bucket: b1
        - label: "Refute: every prime is odd."
          bucket: b1
        - label: "Prove: every square is ≥ 0."
          bucket: b2
        - label: "Refute: there is a largest number."
          bucket: b2
    hints:
      - You prove "there is" with an example. You refute "for all" with a counterexample.
      - Refuting a "there is" means showing it fails for all.
    explanation: Proving ∃ and refuting ∀ take one case. Proving ∀ and refuting ∃ need an argument for every case.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a single counterexample suffice to refute a “for all” statement – but no single example to prove it?"
    params:
      keywords:
        - - alle
          - jede
          - all
          - every
        - - ausnahme
          - gegenbeispiel
          - exception
          - counterexample
        - - unendlich
          - viele
          - prüfen
          - infinite
          - many
          - check
          - restliche
          - übrigen
          - remaining
      sample: The statement claims something about all cases. A single exception already shows that this is not so. A fitting example, in contrast, says nothing about the many remaining cases.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: '"Every even number greater than 2 is the sum of two primes." Computers have checked this for enormous numbers. Why is the conjecture still not considered proven?'
    params:
      options:
        - label: There are infinitely many even numbers – every check covers only finitely many.
          correct: true
        - label: Because computers might miscalculate.
          feedback: Even flawless computation would only show finitely many cases.
        - label: It is considered proven.
          feedback: This Goldbach conjecture has been open since 1742.
    hints:
      - How many cases does a "for all" over whole numbers cover?
      - Can you try infinitely many cases one by one?
    explanation: A "for all" statement over infinitely many numbers needs an argument that covers every number. Evidence makes the Goldbach conjecture believable, but not certain.
    difficulty: 3

srs:
  cards_from: [wahr, beweis]
