id: logic.quantifiers.syllogisms
type: concept
title: Classic Inferences
summary: What follows from two statements.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: folgt
    widget: choice
    body: "“All roses are flowers. Some flowers wilt quickly.”"
    prompt: Does it follow that some roses wilt quickly?
    params:
      options:
        - { label: No – the quickly wilting flowers could all be non-roses., correct: true }
        - { label: "Yes", feedback: "Draw it: the wilting flowers can lie outside the roses." }
    hints:
      - Where could the quickly wilting flowers be?
    explanation: Venn diagrams quickly show whether an inference is forced.

  - kind: explain
    id: s2
    body: |
      An inference is valid only if it holds in **every** possible situation where the premises hold. One counter-picture in a **Venn diagram** is enough to knock it down.

  - kind: problem
    id: gueltig
    widget: choice
    prompt: Which inference is valid?
    params:
      options:
        - { label: "All A are B, all B are C – so all A are also C", correct: true }
        - { label: "All A are B – so all B are also A", feedback: "All dogs are animals, but not all animals are dogs." }
        - { label: "Some A are B, some B are C – so some A are also C", feedback: "Two “some” statements almost never imply anything." }
    hints:
      - Try to draw a counterexample for each inference.
    explanation: Only the chain “all – all” withstands every counterexample.

  - kind: problem
    id: venn
    widget: venn
    prompt: "“No fish is a mammal.” Color the region that this forces to be empty."
    params: { sets: [Fish, Mammals] }
    answer: { regions: [AB] }
    hints:
      - What must not exist?
    explanation: The intersection is empty – whales are mammals, not fish.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An inference is valid if it holds in [[every]] situation. A single [[counterexample]] refutes it.
      distractors:
        - one
        - example

  - kind: problem
    id: mix-c2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: All dogs are animals. All animals breathe. So all dogs breathe.
          right: true
        - text: All dogs are animals. Some animals fly. So some dogs fly.
          right: false
        - text: No fish is a bird. All salmon are fish. So no salmon is a bird.
          right: true
        - text: All roses are flowers. Some flowers wilt fast. So some roses wilt fast.
          right: false
          why: They might be quite different flowers.
      left: Invalid
      right: Valid

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: All A are B. Some B are C. Does it follow that some A are C?
    params:
      options:
        - label: No – the B that are C might lie entirely outside A
          correct: true
        - label: Yes, certainly
          feedback: "Draw it: A lies inside B, and C touches B elsewhere."
        - label: Yes, even all A are C
          feedback: There is no reason for that.
    hints:
      - Draw a Venn diagram in which it does not hold.
    explanation: "A single counter-picture shows: the inference is invalid."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: venn
    prompt: '"All cats are animals." "No animal is a plant." Shade every region that must therefore be **empty**.'
    params:
      sets:
        - Cats
        - Animals
        - Plants
    answer:
      regions:
        - A
        - AC
        - BC
        - ABC
    hints:
      - "Sentence 1: everything in the cat circle outside the animal circle is empty."
      - "Sentence 2: the whole overlap of animals and plants is empty – the centre too."
    explanation: 'After that no cat lies in the plant circle: "no cat is a plant" follows validly. This is how Venn diagrams test syllogisms.'
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: '"No reptile has fur. All snakes are reptiles." What follows?'
    params:
      options:
        - label: No snake has fur.
          correct: true
        - label: Some reptiles are not snakes.
          feedback: That may be true but does not follow – maybe all reptiles are snakes.
        - label: All animals without fur are reptiles.
          feedback: That reverses the statement. Fish have no fur either.
    hints:
      - Snakes lie entirely inside the reptile circle.
      - And the reptile circle does not touch the fur circle.
    explanation: Whatever lies entirely inside a set that shares nothing with another set shares nothing with it either. This pattern has been known since Aristotle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: “All politicians lie. He lies. So he is a politician.” Which error is in it?
    params:
      options:
        - label: From “all A are B” it does not follow that “all B are A”
          correct: true
        - label: The first premise is false
          feedback: Perhaps – but even if it were true the inference would be invalid.
        - label: There is no error
          feedback: Other people lie too.
    hints:
      - Do only politicians lie?
    explanation: An illicit **conversion** – the same trap as with “if, then”.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: '"All unicorns are white. All unicorns are horses." Does it follow that "some horses are white"?'
    params:
      options:
        - label: No – there might be no unicorns at all.
          correct: true
        - label: Yes – the unicorns are white horses.
          feedback: Only if unicorns exist. "All unicorns …" is also true if there are none.
        - label: Yes, that is a classic syllogism.
          feedback: Aristotle would have agreed – modern logic does not.
    hints:
      - Is "all unicorns are white" true if there are no unicorns?
      - '"Some", in contrast, demands a real example.'
    explanation: Modern logic reads "all A are B" without assuming that any A exist. Aristotle took for granted that every set mentioned has members. This existential assumption is what decides here.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a Venn diagram tests whether an argument is valid.
    params:
      keywords:
        - - leer
          - färb
          - schraffier
          - empty
          - shade
        - - voraussetzung
          - prämisse
          - sätze
          - premise
          - sentence
        - - ablesen
          - folgt
          - sehen
          - read off
          - follows
          - see
      sample: I enter the premises and shade the regions that must be empty. Then I check whether the conclusion can be read off directly. If so, it follows validly.
    difficulty: 3

srs:
  cards_from: [folgt, gueltig]
