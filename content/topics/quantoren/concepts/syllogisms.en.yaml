id: logic.quantifiers.syllogisms
type: concept
title: Classic Inferences
summary: What follows from two statements.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: folgt
    widget: choice
    body: "“All roses are flowers. Some flowers wilt quickly.”"
    prompt: Does it follow that some roses wilt quickly?
    params:
      options:
        - { label: No – the quickly wilting flowers could all be non-roses., correct: true }
        - { label: "Yes", feedback: "Draw it: the wilting flowers can lie outside the roses." }
    hints:
      - Where could the quickly wilting flowers be?
    explanation: Venn diagrams quickly show whether an inference is forced.

  - kind: explain
    body: |
      An inference is valid only if it holds in **every** possible situation where the premises hold. One counter-picture in a Venn diagram is enough to knock it down.

  - kind: problem
    id: gueltig
    widget: choice
    prompt: Which inference is valid?
    params:
      options:
        - { label: "All A are B, all B are C – so all A are also C", correct: true }
        - { label: "All A are B – so all B are also A", feedback: "All dogs are animals, but not all animals are dogs." }
        - { label: "Some A are B, some B are C – so some A are also C", feedback: "Two “some” statements almost never imply anything." }
    hints:
      - Try to draw a counterexample for each inference.
    explanation: Only the chain “all – all” withstands every counterexample.

  - kind: problem
    id: venn
    widget: venn
    prompt: "“No fish is a mammal.” Color the region that this forces to be empty."
    params: { sets: [Fish, Mammals] }
    answer: { regions: [AB] }
    hints:
      - What must not exist?
    explanation: The intersection is empty – whales are mammals, not fish.

srs:
  cards_from: [folgt, gueltig]
