id: logic.quantifiers.order
type: concept
title: Die Reihenfolge zählt
summary: »Jeder hat einen« gegen »einer für alle«.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Jeder seinen Song?
    body: »Jeder hat einen Lieblingssong« – aber denselben? Tippe Linien an und verbinde jede Person mit einem Song. Schaffst du es mit drei verschiedenen Songs? Mit einem einzigen für alle? Die **Reihenfolge** der Wörter entscheidet.
    visual:
      widget: network
      interactive: true
      params:
        mode: select
        nodes:
          - id: ida
            x: 15
            y: 10
            label: Ida
          - id: jo
            x: 50
            y: 10
            label: Jo
          - id: kai
            x: 85
            y: 10
            label: Kai
          - id: s1
            x: 15
            y: 90
            label: Song A
          - id: s2
            x: 50
            y: 90
            label: Song B
          - id: s3
            x: 85
            y: 90
            label: Song C
        edges:
          - a: ida
            b: s1
          - a: ida
            b: s2
          - a: ida
            b: s3
          - a: jo
            b: s1
          - a: jo
            b: s2
          - a: jo
            b: s3
          - a: kai
            b: s1
          - a: kai
            b: s2
          - a: kai
            b: s3

  - kind: problem
    id: mutter
    widget: choice
    prompt: Was bedeutet »Jeder Mensch hat eine Mutter«?
    params:
      options:
        - { label: Jeder hat seine eigene Mutter., correct: true }
        - { label: Es gibt eine Mutter aller Menschen., feedback: "Das wäre »Es gibt eine Mutter für alle« – eine ganz andere Aussage." }
    hints:
      - Kommt zuerst »jeder« oder zuerst »es gibt«?
    explanation: Erst »für jeden«, dann »gibt es eine« – die Mutter darf für jeden eine andere sein.

  - kind: explain
    id: s2
    body: |
      »Für jedes x gibt es ein y« ist viel schwächer als »Es gibt ein y für alle x«. Diese **Reihenfolge** zu verwechseln ist ein häufiger Denkfehler – auch in Verträgen und Gesetzen.

  - kind: problem
    id: schluessel
    widget: choice
    prompt: Was ist eine stärkere Aussage?
    params:
      options:
        - { label: "Es gibt einen Schlüssel, der jede Tür öffnet.", correct: true }
        - { label: "Jede Tür hat einen Schlüssel, der sie öffnet.", feedback: "Das gilt für jedes normale Haus – ein Generalschlüssel ist viel mehr." }
    hints:
      - Welche Aussage beschreibt einen Generalschlüssel?
    explanation: Ein Schlüssel für alle ist seltener als für jede Tür irgendeiner.

  - kind: problem
    id: zahlen
    widget: choice
    prompt: Welche Aussage über natürliche Zahlen ist wahr?
    params:
      options:
        - { label: Zu jeder Zahl gibt es eine größere., correct: true }
        - { label: "Es gibt eine Zahl, die größer ist als alle.", feedback: "Diese Zahl plus eins wäre noch größer." }
    hints:
      - Probier n + 1.
    explanation: Gleiche Zutaten, andere Reihenfolge – einmal wahr, einmal falsch.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Für jeden ein eigenes – oder eines für alle?
    params:
      buckets:
        - id: b1
          label: Für jeden ein eigenes
        - id: b2
          label: Eines für alle
      items:
        - label: Jeder Mensch hat eine Mutter
          bucket: b1
        - label: Eine Sonne scheint für alle
          bucket: b2
        - label: Jede Tür hat ein Schloss
          bucket: b1
        - label: Ein Generalschlüssel für alle Türen
          bucket: b2
    hints:
      - Ist es jedes Mal dasselbe Ding?
    explanation: "Zuerst »für alle«, dann »es gibt«: Jeder darf ein anderes haben. Umgekehrt nicht."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: »Für jedes x gibt es ein y« ist viel [[schwächer]] als »Es gibt ein y für alle x«. Die [[Reihenfolge]] entscheidet.
      distractors:
        - stärker
        - Länge

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: »Es gibt eine Zahl, die größer ist als jede andere Zahl.« Ist das für natürliche Zahlen wahr?
    params:
      options:
        - label: Nein – zu jeder Zahl gibt es eine größere
          correct: true
        - label: Ja – unendlich
          feedback: Unendlich ist keine natürliche Zahl.
        - label: Ja – man kennt sie nur nicht
          feedback: Man kann beweisen, dass es keine gibt.
    hints:
      - Nimm die angeblich größte Zahl und addiere 1.
    explanation: ∃∀ ist hier falsch, ∀∃ wahr. Dieselben Wörter, andere Reihenfolge – gegenteilige Wahrheit.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: »Jeder der 30 Schüler hat einen Lieblingslehrer.« Wie viele verschiedene Lieblingslehrer kann es höchstens geben?
    answer:
      value: 30
    hints:
      - Jeder darf einen anderen nennen.
    explanation: Bis zu 30. Der Satz verlangt nicht, dass es derselbe ist.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: numeric
    prompt: »Es gibt einen Lehrer, den alle 30 Schüler am liebsten mögen.« Wie viele Lieblingslehrer gibt es jetzt?
    answer:
      value: 1
    hints:
      - Der eine wird zuerst genannt – und gilt dann für alle.
    explanation: Genau einer. Dieselben Wörter, andere Reihenfolge, andere Welt.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Welche Aussage über die ganzen Zahlen ist wahr?
    params:
      options:
        - label: Zu jeder Zahl x gibt es eine Zahl y mit x + y = 0.
          correct: true
        - label: Es gibt eine Zahl y, sodass x + y = 0 für jedes x gilt.
          feedback: Dann müsste ein einziges y zu allen x passen – y = −x ändert sich aber mit x.
        - label: Beide sind wahr.
          feedback: Nur bei »für jedes x … ein y« darf y von x abhängen.
    hints:
      - Wähle x = 5. Welches y passt? Und bei x = 7?
      - Kann dasselbe y für beide passen?
    explanation: "Im ersten Satz darf y von x **abhängen**: y = −x. Im zweiten müsste ein festes y für alle x passen. Steht ∃ hinter ∀, ist die Aussage oft viel schwächer."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: 4 Kinder, und jedes hat mindestens ein Buch aus dem Regal gelesen. Wie viele **verschiedene** Bücher müssen dafür mindestens gelesen worden sein?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 4
        misconception: max-vs-min
        text: So viele können es höchstens sein. Mindestens reicht ein Buch, das alle gelesen haben.
    hints:
      - »Jedes Kind hat ein Buch« sagt nicht, dass die Bücher verschieden sind.
      - Was, wenn alle dasselbe Buch gelesen haben?
    explanation: Mindestens 1, höchstens 4. »Für jedes Kind gibt es ein Buch« erlaubt beides. Erst »Es gibt ein Buch für alle« legt fest, dass es eins ist.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Die Definition des Grenzwerts lautet: »Für jede noch so kleine Schranke gibt es eine Stelle, ab der alle Folgenglieder näher am Grenzwert liegen.« Wie viele Quantoren stecken darin?"
    params:
      options:
        - label: "Drei: für jede – gibt es – für alle"
          correct: true
        - label: Einen
          feedback: "Zähl: jede Schranke, eine Stelle, alle Glieder."
        - label: Keinen
          feedback: »Jede«, »gibt es« und »alle« sind Quantoren.
    hints:
      - Such nach »jede«, »gibt es« und »alle«.
    explanation: ∀ε ∃N ∀n. An dieser Verschachtelung scheitern viele – wer Quantoren beherrscht, versteht die Analysis.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Die Menge ist {1, 2, 3}. Welche Aussagen sind wahr? Wähle alle.
    params:
      multiple: true
      options:
        - label: Für jedes x gibt es ein y mit y ≥ x.
          correct: true
        - label: Es gibt ein y, sodass für alle x gilt y ≥ x.
          correct: true
        - label: Für jedes x gibt es ein y mit y > x.
          feedback: Für x = 3 gibt es kein größeres y in der Menge.
    hints:
      - Probiere y = 3 für die zweite Aussage.
      - Und für x = 3 bei der dritten?
    explanation: "In einer endlichen Menge gibt es ein **Maximum** – darum stimmt hier sogar »∃y ∀x: y ≥ x«. Bei den natürlichen Zahlen wäre das falsch. Der Bereich, über den man spricht, entscheidet mit."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen »Jeder hat einen Lieblingslehrer« und »Es gibt einen Lieblingslehrer aller«.
    params:
      keywords:
        - - eigen
          - verschieden
          - unterschiedlich
          - own
          - different
        - - derselbe
          - denselben
          - einen für alle
          - same
          - one for all
        - - reihenfolge
          - stärker
          - order
          - stronger
      sample: Im ersten Satz kann jeder einen eigenen, verschiedenen Lehrer haben. Im zweiten mögen alle denselben Lehrer. Der zweite Satz ist stärker – die Reihenfolge der Quantoren macht den Unterschied.
    difficulty: 3

srs:
  cards_from: [mutter, schluessel]
