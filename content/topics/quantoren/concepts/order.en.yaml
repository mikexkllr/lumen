id: logic.quantifiers.order
type: concept
title: Order Matters
summary: “Everyone has one” versus “one for everyone.”
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: mutter
    widget: choice
    prompt: What does “Every person has a mother” mean?
    params:
      options:
        - { label: Everyone has their own mother., correct: true }
        - { label: There is one mother of all people., feedback: "That would be “There is one mother for everyone” – a completely different statement." }
    hints:
      - Does “every” come first, or “there is”?
    explanation: First “for everyone,” then “there is one” – the mother can be different for each person.

  - kind: explain
    id: s2
    body: |
      “For every x there is a y” is much weaker than “There is a y for all x.” Mixing up this **order** is a common reasoning error – even in contracts and laws.

  - kind: problem
    id: schluessel
    widget: choice
    prompt: Which is the stronger statement?
    params:
      options:
        - { label: "There is a key that opens every door.", correct: true }
        - { label: "Every door has a key that opens it.", feedback: "That holds for any normal house – a master key is much more." }
    hints:
      - Which statement describes a master key?
    explanation: One key for all is rarer than some key for each door.

  - kind: problem
    id: zahlen
    widget: choice
    prompt: Which statement about natural numbers is true?
    params:
      options:
        - { label: For every number there is a larger one., correct: true }
        - { label: "There is a number that is larger than all of them.", feedback: "That number plus one would be even larger." }
    hints:
      - Try n + 1.
    explanation: Same ingredients, different order – once true, once false.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: One for each – or one for all?
    params:
      buckets:
        - id: b1
          label: One for each
        - id: b2
          label: One for all
      items:
        - label: Every person has a mother
          bucket: b1
        - label: One Sun shines for all
          bucket: b2
        - label: Every door has a lock
          bucket: b1
        - label: One master key for all doors
          bucket: b2
    hints:
      - Is it the same thing every time?
    explanation: "First “for all”, then “there is”: each may have a different one. Not the other way round."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: “For every x there is a y” is far [[weaker]] than “There is one y for all x”. The [[order]] decides.
      distractors:
        - stronger
        - length

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “There is a number that is larger than every other number.” Is that true for natural numbers?
    params:
      options:
        - label: No – for every number there is a larger one
          correct: true
        - label: Yes – infinity
          feedback: Infinity is not a natural number.
        - label: Yes – it is just not known
          feedback: It can be proved that there is none.
    hints:
      - Take the supposedly largest number and add 1.
    explanation: ∃∀ is false here, ∀∃ true. The same words, a different order – opposite truth.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: “Each of the 30 pupils has a favourite teacher.” How many different favourite teachers can there be at most?
    answer:
      value: 30
    hints:
      - Each may name a different one.
    explanation: Up to 30. The sentence does not require it to be the same one.
    difficulty: 2

  - kind: problem
    id: mix-d2
    depth: 2
    widget: numeric
    prompt: “There is one teacher whom all 30 pupils like best.” How many favourite teachers are there now?
    answer:
      value: 1
    hints:
      - The one is named first – and then holds for all.
    explanation: Exactly one. The same words, a different order, a different world.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Which statement about the integers is true?
    params:
      options:
        - label: For every number x there is a number y with x + y = 0.
          correct: true
        - label: There is a number y such that x + y = 0 for every x.
          feedback: Then one single y would have to fit every x – but y = −x changes with x.
        - label: Both are true.
          feedback: Only in "for every x … a y" may y depend on x.
    hints:
      - Pick x = 5. Which y fits? And for x = 7?
      - Can the same y fit both?
    explanation: "In the first sentence y may depend on x: y = −x. In the second one fixed y would have to fit every x. When ∃ comes after ∀, the statement is often much weaker."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: 4 children, and each has read at least one book from the shelf. At least how many **different** books must have been read?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 4
        misconception: max-vs-min
        text: That is the most there can be. At least, one book read by everyone is enough.
    hints:
      - '"Each child has a book" does not say the books are different.'
      - What if all read the same book?
    explanation: At least 1, at most 4. "For every child there is a book" allows both. Only "there is one book for all" pins it to one.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The definition of a limit reads: “For every bound however small there is a point from which all terms of the sequence lie closer to the limit.” How many quantifiers does it contain?"
    params:
      options:
        - label: "Three: for every – there is – for all"
          correct: true
        - label: One
          feedback: "Count: every bound, a point, all terms."
        - label: None
          feedback: “Every”, “there is” and “all” are quantifiers.
    hints:
      - Look for “every”, “there is” and “all”.
    explanation: ∀ε ∃N ∀n. Many stumble over this nesting – whoever masters quantifiers understands analysis.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: The set is {1, 2, 3}. Which statements are true? Choose all.
    params:
      multiple: true
      options:
        - label: For every x there is a y with y ≥ x.
          correct: true
        - label: There is a y such that y ≥ x for all x.
          correct: true
        - label: For every x there is a y with y > x.
          feedback: For x = 3 there is no larger y in the set.
    hints:
      - Try y = 3 for the second statement.
      - And x = 3 for the third?
    explanation: 'A finite set has a maximum – so here even "∃y ∀x: y ≥ x" holds. For the natural numbers it would be false. The domain you talk about matters too.'
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between "everyone has a favourite teacher" and "there is one teacher everyone likes best".
    params:
      keywords:
        - - eigen
          - verschieden
          - unterschiedlich
          - own
          - different
        - - derselbe
          - denselben
          - einen für alle
          - same
          - one for all
        - - reihenfolge
          - stärker
          - order
          - stronger
      sample: In the first sentence everyone can have their own, different teacher. In the second, all like the same teacher. The second is stronger – the order of the quantifiers makes the difference.
    difficulty: 3

srs:
  cards_from: [mutter, schluessel]
