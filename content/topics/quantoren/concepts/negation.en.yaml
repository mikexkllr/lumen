id: logic.quantifiers.negation
type: concept
title: Negating Correctly
summary: “All” becomes “not all.”
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: nicht-alle
    widget: choice
    prompt: What is the opposite of “All swans are white”?
    params:
      options:
        - { label: At least one swan is not white., correct: true }
        - { label: No swan is white., feedback: "That is much stronger – every swan would have to be another color." }
    hints:
      - What has to happen for “all” to be false?
    explanation: The negation of “all” is “there is one that is not.”

  - kind: explain
    id: s2
    body: |
      When you negate, the **quantifiers** swap: “for all, it holds that …” becomes “there is one for which it does not hold.” “There is one …” becomes “for none does it hold …”.

  - kind: problem
    id: paare
    widget: match
    prompt: Connect each statement to its negation.
    params:
      pairs:
        - { left: Everyone passes., right: Someone fails. }
        - { left: Someone lies., right: Nobody lies. }
        - { left: Nobody came., right: At least one person came. }
    hints:
      - “All” becomes “one not,” and “one” becomes “none.”
    explanation: Swap the quantifier, and negate the statement behind it.

  - kind: problem
    id: versprechen
    widget: choice
    prompt: A dealer promises “Every part is tested.” What shows that he is lying?
    params:
      options:
        - { label: A single untested part, correct: true }
        - { label: That no part is tested, feedback: "That would also disprove it – but one part is already enough." }
    hints:
      - How little does it take to refute “every”?
    explanation: A single exception is enough.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Is this negated correctly?
    params:
      buckets:
        - id: b1
          label: Correct
        - id: b2
          label: Wrong
      items:
        - label: “All come” – “One does not come”
          bucket: b1
        - label: “All come” – “Nobody comes”
          bucket: b2
        - label: “One is missing” – “None is missing”
          bucket: b1
        - label: “One is missing” – “All are missing”
          bucket: b2
    hints:
      - The negation is true exactly when the sentence is false.
    explanation: “All” and “one” swap roles when negating.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: “For all” becomes “there [[is]] one for which it fails”. “There is one” becomes “it holds for [[none]]”.
      distractors:
        - lacks
        - each

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What is the opposite of “In every class there is a child who solves all the tasks”?
    params:
      options:
        - label: There is a class in which every child fails at least one task
          correct: true
        - label: In no class does a child solve a task
          feedback: Far too strong.
        - label: In every class there is a child who solves no task
          feedback: All the quantifiers must flip.
    hints:
      - "Flip from outside in: every → some, a → every, all → at least one not."
    explanation: Three quantifiers, three flips. That is how even the hardest definitions in mathematics are negated.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: “Not all swans are white” and “All swans are not white” – is that the same?
    params:
      options:
        - label: No – the first means “at least one is not”, the second “none”
          correct: true
        - label: Yes – only the word order differs
          feedback: The position of “not” changes the meaning completely.
        - label: Both are meaningless
          feedback: Both are clear statements.
    hints:
      - How many non-white swans do you need in each case?
    explanation: Where the “not” stands is decisive. The formal notation ¬∀ versus ∀¬ makes it unambiguous.
    difficulty: 3

srs:
  cards_from: [nicht-alle, paare]
