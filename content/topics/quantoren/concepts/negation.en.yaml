id: logic.quantifiers.negation
type: concept
title: Negating Correctly
summary: “All” becomes “not all.”
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Who has a ticket?
    body: 'At the entrance, every ticket counts. Each switch shows whether someone has one. Flip them and watch both lamps: when does "all" light up, and when "not all"? That is how **negating** "all" works.'
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: A
            label: Ali
          - id: B
            label: Bea
          - id: C
            label: Cem
        gates:
          - id: g
            type: AND
            in:
              - A
              - B
              - C
          - id: n
            type: NOT
            in:
              - g
        outputs:
          - id: Q
            from: g
            label: all
          - id: R
            from: n
            label: not all

  - kind: problem
    id: nicht-alle
    widget: choice
    prompt: What is the opposite of “All swans are white”?
    params:
      options:
        - { label: At least one swan is not white., correct: true }
        - { label: No swan is white., feedback: "That is much stronger – every swan would have to be another color." }
    hints:
      - What has to happen for “all” to be false?
    explanation: The negation of “all” is “there is one that is not.”

  - kind: explain
    id: s2
    body: |
      When you negate, the **quantifiers** swap: “for all, it holds that …” becomes “there is one for which it does not hold.” “There is one …” becomes “for none does it hold …”.

  - kind: problem
    id: paare
    widget: match
    prompt: Connect each statement to its negation.
    params:
      pairs:
        - { left: Everyone passes., right: Someone fails. }
        - { left: Someone lies., right: Nobody lies. }
        - { left: Nobody came., right: At least one person came. }
    hints:
      - “All” becomes “one not,” and “one” becomes “none.”
    explanation: Swap the quantifier, and negate the statement behind it.

  - kind: problem
    id: versprechen
    widget: choice
    prompt: A dealer promises “Every part is tested.” What shows that he is lying?
    params:
      options:
        - { label: A single untested part, correct: true }
        - { label: That no part is tested, feedback: "That would also disprove it – but one part is already enough." }
    hints:
      - How little does it take to refute “every”?
    explanation: A single exception is enough.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Is this negated correctly?
    params:
      buckets:
        - id: b1
          label: Correct
        - id: b2
          label: Wrong
      items:
        - label: “All come” – “One does not come”
          bucket: b1
        - label: “All come” – “Nobody comes”
          bucket: b2
        - label: “One is missing” – “None is missing”
          bucket: b1
        - label: “One is missing” – “All are missing”
          bucket: b2
    hints:
      - The negation is true exactly when the sentence is false.
    explanation: “All” and “one” swap roles when negating.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: “For all” becomes “there [[is]] one for which it fails”. “There is one” becomes “it holds for [[none]]”.
      distractors:
        - lacks
        - each

  - kind: problem
    id: intro-c1
    widget: venn
    prompt: '"Not all swans are white." Shade the region where there must then be at least one swan.'
    params:
      sets:
        - swans
        - white
    answer:
      regions:
        - A
    hints:
      - You are looking for a swan that is not white.
      - That is the part of the swan circle outside "white".
    explanation: '"Not all are white" means: there is at least one swan that is not white. It lies in the swan circle but outside "white".'

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What is the opposite of “In every class there is a child who solves all the tasks”?
    params:
      options:
        - label: There is a class in which every child fails at least one task
          correct: true
        - label: In no class does a child solve a task
          feedback: Far too strong.
        - label: In every class there is a child who solves no task
          feedback: All the quantifiers must flip.
    hints:
      - "Flip from outside in: every → some, a → every, all → at least one not."
    explanation: Three quantifiers, three flips. That is how even the hardest definitions in mathematics are negated.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: What is the opposite of "There is a town where everyone has a bike"?
    params:
      options:
        - label: In every town there is someone without a bike.
          correct: true
        - label: In no town does anyone have a bike.
          feedback: Far too strong – one person without a bike per town is enough.
        - label: There is a town where nobody has a bike.
          feedback: The "there is" should have become "every".
    hints:
      - 'Negate from the outside in: "there is" becomes "for every".'
      - 'Then "everyone has one" turns into its opposite: "someone has none".'
    explanation: ¬∃s ∀p R(s, p) = ∀s ∃p ¬R(s, p). The negation moves inward, and every quantifier flips on the way.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: ¬∀x P(x) means the same as [[∃x ¬P(x)]]. And ¬∃x P(x) means the same as [[∀x ¬P(x)]].
      distractors:
        - ∃x P(x)
        - ∀x P(x)
    hints:
      - '"Not all" means "at least one not". "There is none" means "all not".'
    explanation: When negating, ∀ swaps with ∃ and the negation slides behind the quantifier. These are De Morgan's laws for quantifiers.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: “Not all swans are white” and “All swans are not white” – is that the same?
    params:
      options:
        - label: No – the first means “at least one is not”, the second “none”
          correct: true
        - label: Yes – only the word order differs
          feedback: The position of “not” changes the meaning completely.
        - label: Both are meaningless
          feedback: Both are clear statements.
    hints:
      - How many non-white swans do you need in each case?
    explanation: Where the “not” stands is decisive. The formal notation ¬∀ versus ∀¬ makes it unambiguous.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: 'A sequence tends to a if: for every ε > 0 there is an N such that for all n ≥ N, |aₙ − a| < ε. What does "does **not** tend to a" mean?'
    params:
      options:
        - label: There is an ε > 0 such that for every N there is an n ≥ N with |aₙ − a| ≥ ε.
          correct: true
        - label: For every ε there is no N.
          feedback: That only half negates – the inner "for all" must flip too.
        - label: For all n, |aₙ − a| ≥ ε.
          feedback: "Far too strong: it is enough that single terms keep landing far away."
    hints:
      - "Three quantifiers: for every – there is – for all. Each one flips."
      - At the end "< ε" becomes its opposite "≥ ε".
    explanation: "∀ε ∃N ∀n turns into ∃ε ∀N ∃n, and the inequality is reversed. In pictures: there is a distance that the sequence exceeds again and again."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how to negate a statement with "for all" and "there is" correctly.
    params:
      keywords:
        - - für alle
          - jede
          - for all
          - every
        - - es gibt
          - mindestens
          - there is
          - at least
        - - tausch
          - kipp
          - wird zu
          - swap
          - flip
          - becomes
      sample: When negating, for all becomes there is, and there is becomes for all. At the end you negate the inner statement. So every quantifier flips once.
    difficulty: 3

srs:
  cards_from: [nicht-alle, paare]
