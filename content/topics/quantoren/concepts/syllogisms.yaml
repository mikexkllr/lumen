id: logic.quantifiers.syllogisms
type: concept
title: Klassische Schlüsse
summary: Was aus zwei Sätzen folgt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: folgt
    widget: choice
    body: »Alle Rosen sind Blumen. Einige Blumen welken schnell.«
    prompt: Folgt daraus, dass einige Rosen schnell welken?
    params:
      options:
        - { label: Nein – die schnell welkenden könnten alle keine Rosen sein., correct: true }
        - { label: Ja, feedback: "Zeichne es: Die welkenden Blumen können außerhalb der Rosen liegen." }
    hints:
      - Wo könnten die schnell welkenden Blumen liegen?
    explanation: Venn-Diagramme zeigen schnell, ob ein Schluss zwingend ist.

  - kind: explain
    id: s2
    body: |
      Ein Schluss ist nur gültig, wenn er in **jeder** möglichen Situation stimmt, in der die Voraussetzungen stimmen. Ein einziges Gegenbild im **Venn-Diagramm** reicht, um ihn zu kippen.

  - kind: problem
    id: gueltig
    widget: choice
    prompt: Welcher Schluss ist gültig?
    params:
      options:
        - { label: "Alle A sind B, alle B sind C – also sind alle A auch C", correct: true }
        - { label: "Alle A sind B – also sind alle B auch A", feedback: "Alle Hunde sind Tiere, aber nicht alle Tiere sind Hunde." }
        - { label: "Einige A sind B, einige B sind C – also sind einige A auch C", feedback: "Aus zwei »einige« folgt fast nie etwas." }
    hints:
      - Versuche für jeden Schluss ein Gegenbeispiel zu zeichnen.
    explanation: Nur die Kette »alle – alle« hält jedem Gegenbeispiel stand.

  - kind: problem
    id: venn
    widget: venn
    prompt: »Kein Fisch ist ein Säugetier.« Färbe den Bereich, der dadurch leer sein muss.
    params: { sets: [Fische, Säugetiere] }
    answer: { regions: [AB] }
    hints:
      - Was darf es nicht geben?
    explanation: Die Schnittmenge ist leer – Wale sind Säugetiere, keine Fische.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Schluss ist gültig, wenn er in [[jeder]] Lage stimmt. Ein einziges [[Gegenbeispiel]] widerlegt ihn.
      distractors:
        - einer
        - Beispiel

  - kind: problem
    id: mix-c2
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Alle Hunde sind Tiere. Alle Tiere atmen. Also atmen alle Hunde.
          right: true
        - text: Alle Hunde sind Tiere. Einige Tiere fliegen. Also fliegen einige Hunde.
          right: false
        - text: Kein Fisch ist ein Vogel. Alle Lachse sind Fische. Also ist kein Lachs ein Vogel.
          right: true
        - text: Alle Rosen sind Blumen. Einige Blumen welken schnell. Also welken einige Rosen schnell.
          right: false
          why: Es könnten ganz andere Blumen sein.
      left: Ungültig
      right: Gültig

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Alle A sind B. Einige B sind C. Folgt daraus, dass einige A C sind?
    params:
      options:
        - label: Nein – die B, die C sind, könnten ganz außerhalb von A liegen
          correct: true
        - label: Ja, sicher
          feedback: "Zeichne es: A liegt in B, und C berührt B woanders."
        - label: Ja, sogar alle A sind C
          feedback: Dafür gibt es keinen Grund.
    hints:
      - Zeichne ein Venn-Diagramm, in dem es nicht stimmt.
    explanation: "Ein einziges Gegenbild zeigt: Der Schluss ist ungültig."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: venn
    prompt: »Alle Katzen sind Tiere.« »Kein Tier ist eine Pflanze.« Färbe alle Bereiche, die dadurch **leer** sein müssen.
    params:
      sets:
        - Katzen
        - Tiere
        - Pflanzen
    answer:
      regions:
        - A
        - AC
        - BC
        - ABC
    hints:
      - "Satz 1: Alles im Katzen-Kreis außerhalb des Tier-Kreises ist leer."
      - "Satz 2: Die ganze Überlappung von Tieren und Pflanzen ist leer – auch die Mitte."
    explanation: "Danach liegt keine Katze mehr im Pflanzen-Kreis: »Keine Katze ist eine Pflanze« folgt **gültig**. So prüft man Syllogismen mit dem Venn-Diagramm."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: »Kein Reptil hat Fell. Alle Schlangen sind Reptilien.« Was folgt?
    params:
      options:
        - label: Keine Schlange hat Fell.
          correct: true
        - label: Einige Reptilien sind keine Schlangen.
          feedback: Das kann stimmen, folgt aber nicht – vielleicht sind alle Reptilien Schlangen.
        - label: Alle Tiere ohne Fell sind Reptilien.
          feedback: Das dreht die Aussage um. Auch Fische haben kein Fell.
    hints:
      - Schlangen liegen ganz im Reptilien-Kreis.
      - Und der Reptilien-Kreis berührt den Fell-Kreis nicht.
    explanation: Was ganz in einer Menge liegt, die mit einer anderen nichts teilt, teilt auch nichts mit ihr. Dieses Schema ist seit **Aristoteles** bekannt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: »Alle Politiker lügen. Er lügt. Also ist er Politiker.« Welcher Fehler steckt darin?
    params:
      options:
        - label: Aus »alle A sind B« folgt nicht »alle B sind A«
          correct: true
        - label: Die erste Voraussetzung ist falsch
          feedback: Vielleicht – aber auch wenn sie stimmte, wäre der Schluss ungültig.
        - label: Es gibt keinen Fehler
          feedback: Auch andere Menschen lügen.
    hints:
      - Lügen nur Politiker?
    explanation: Eine unzulässige **Umkehrung** – dieselbe Falle wie bei »wenn, dann«.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "»Alle Einhörner sind weiß. Alle Einhörner sind Pferde.« Folgt: »Einige Pferde sind weiß«?"
    params:
      options:
        - label: Nein – es könnte gar keine Einhörner geben.
          correct: true
        - label: Ja – die Einhörner sind weiße Pferde.
          feedback: Nur wenn es Einhörner gibt. »Alle Einhörner …« ist auch wahr, wenn es keine gibt.
        - label: Ja, das ist ein klassischer Syllogismus.
          feedback: Aristoteles hätte zugestimmt – die moderne Logik nicht.
    hints:
      - Ist »Alle Einhörner sind weiß« wahr, wenn es keine Einhörner gibt?
      - »Einige« verlangt dagegen ein echtes Beispiel.
    explanation: Die moderne Logik liest »alle A sind B« ohne die Annahme, dass es A gibt. Aristoteles setzte voraus, dass jede genannte Menge Elemente hat. Diese **Existenzannahme** entscheidet hier.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man mit einem Venn-Diagramm prüft, ob ein Schluss gültig ist.
    params:
      keywords:
        - - leer
          - färb
          - schraffier
          - empty
          - shade
        - - voraussetzung
          - prämisse
          - sätze
          - premise
          - sentence
        - - ablesen
          - folgt
          - sehen
          - read off
          - follows
          - see
      sample: Ich trage die Voraussetzungen ein und färbe die Bereiche, die leer sein müssen. Dann schaue ich, ob man das Ergebnis direkt ablesen kann. Wenn ja, folgt es gültig.
    difficulty: 3

srs:
  cards_from: [folgt, gueltig]
