id: logic.quantifiers.syllogisms
type: concept
title: Klassische Schlüsse
summary: Was aus zwei Sätzen folgt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: folgt
    widget: choice
    body: »Alle Rosen sind Blumen. Einige Blumen welken schnell.«
    prompt: Folgt daraus, dass einige Rosen schnell welken?
    params:
      options:
        - { label: Nein – die schnell welkenden könnten alle keine Rosen sein., correct: true }
        - { label: Ja, feedback: "Zeichne es: Die welkenden Blumen können außerhalb der Rosen liegen." }
    hints:
      - Wo könnten die schnell welkenden Blumen liegen?
    explanation: Venn-Diagramme zeigen schnell, ob ein Schluss zwingend ist.

  - kind: explain
    id: s2
    body: |
      Ein Schluss ist nur gültig, wenn er in **jeder** möglichen Situation stimmt, in der die Voraussetzungen stimmen. Ein einziges Gegenbild im Venn-Diagramm reicht, um ihn zu kippen.

  - kind: problem
    id: gueltig
    widget: choice
    prompt: Welcher Schluss ist gültig?
    params:
      options:
        - { label: "Alle A sind B, alle B sind C – also sind alle A auch C", correct: true }
        - { label: "Alle A sind B – also sind alle B auch A", feedback: "Alle Hunde sind Tiere, aber nicht alle Tiere sind Hunde." }
        - { label: "Einige A sind B, einige B sind C – also sind einige A auch C", feedback: "Aus zwei »einige« folgt fast nie etwas." }
    hints:
      - Versuche für jeden Schluss ein Gegenbeispiel zu zeichnen.
    explanation: Nur die Kette »alle – alle« hält jedem Gegenbeispiel stand.

  - kind: problem
    id: venn
    widget: venn
    prompt: »Kein Fisch ist ein Säugetier.« Färbe den Bereich, der dadurch leer sein muss.
    params: { sets: [Fische, Säugetiere] }
    answer: { regions: [AB] }
    hints:
      - Was darf es nicht geben?
    explanation: Die Schnittmenge ist leer – Wale sind Säugetiere, keine Fische.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Alle A sind B. Einige B sind C. Folgt daraus, dass einige A C sind?
    params:
      options:
        - label: Nein – die B, die C sind, könnten ganz außerhalb von A liegen
          correct: true
        - label: Ja, sicher
          feedback: "Zeichne es: A liegt in B, und C berührt B woanders."
        - label: Ja, sogar alle A sind C
          feedback: Dafür gibt es keinen Grund.
    hints:
      - Zeichne ein Venn-Diagramm, in dem es nicht stimmt.
    explanation: "Ein einziges Gegenbild zeigt: Der Schluss ist ungültig."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: »Alle Politiker lügen. Er lügt. Also ist er Politiker.« Welcher Fehler steckt darin?
    params:
      options:
        - label: Aus »alle A sind B« folgt nicht »alle B sind A«
          correct: true
        - label: Die erste Voraussetzung ist falsch
          feedback: Vielleicht – aber auch wenn sie stimmte, wäre der Schluss ungültig.
        - label: Es gibt keinen Fehler
          feedback: Auch andere Menschen lügen.
    hints:
      - Lügen nur Politiker?
    explanation: Eine unzulässige **Umkehrung** – dieselbe Falle wie bei »wenn, dann«.
    difficulty: 3

srs:
  cards_from: [folgt, gueltig]
