id: logic.quantifiers.math
type: concept
title: Quantoren in der Mathematik
summary: Für alle und es gibt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Jagd auf das Gegenbeispiel
    body: »Jede ungerade Zahl ab 3 ist eine Primzahl.« Bei 3, 5 und 7 klappt das. Tippe alle Zahlen an, die widersprechen. In der Mathematik kippt ein einziges **Gegenbeispiel** jede Aussage über »alle«.
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 2
        cols: 10
        numbers:
          start: 1

  - kind: problem
    id: hook
    widget: choice
    prompt: »Für jeden Topf gibt es einen Deckel« und »Es gibt einen Deckel für jeden Topf« – ist das dasselbe?
    params:
      options:
        - label: Nein – im zweiten Satz passt ein einziger Deckel auf alle
          correct: true
        - label: Ja
          feedback: Die Reihenfolge ändert die Bedeutung.
        - label: Beide sind falsch
          feedback: Es geht um die Bedeutung, nicht um Töpfe.
    hints:
      - Wie viele Deckel braucht man jeweils?
    explanation: Die Mathematik hat dafür Zeichen, die keine Zweifel lassen.

  - kind: explain
    id: s1
    body: |
      In der **Mathematik** schreibt man $\forall$ für »für alle« und $\exists$ für »es gibt«. $\forall n\; \exists m: m > n$ heißt – zu jeder Zahl n gibt es eine größere Zahl m.

  - kind: problem
    id: wahr
    widget: buckets
    prompt: Wahr oder falsch für natürliche Zahlen?
    params:
      buckets: [{ label: wahr }, { label: falsch }]
      items:
        - { label: Es gibt eine gerade Primzahl., bucket: wahr }
        - { label: Jede Zahl hat einen Nachfolger., bucket: wahr }
        - { label: Alle Primzahlen sind ungerade., bucket: falsch }
        - { label: Es gibt eine größte Zahl., bucket: falsch }
    hints:
      - Denk an die 2.
    explanation: Die 2 macht »es gibt eine gerade Primzahl« wahr und »alle sind ungerade« falsch.

  - kind: problem
    id: gegen
    widget: numeric
    prompt: »Alle Zahlen n² + 1 sind ungerade.« Nenne das kleinste n ab 1, das widerspricht.
    params: { placeholder: "n" }
    answer: { value: 1 }
    hints:
      - Probier n = 1.
    explanation: 1² + 1 = 2 ist gerade – schon das erste Beispiel widerlegt die Aussage.

  - kind: problem
    id: beweis
    widget: choice
    prompt: Wie beweist man eine Aussage der Form »für alle n«?
    params:
      options:
        - { label: "Mit einem Argument, das für ein beliebiges n funktioniert", correct: true }
        - { label: Mit vielen Beispielen, feedback: "Beispiele zeigen nur, dass es oft klappt – nicht immer." }
    hints:
      - Erinnere dich an den direkten Beweis.
    explanation: »Sei n beliebig …« ist der Anfang fast jedes Beweises für alle Zahlen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "»Für alle reellen Zahlen x gilt: x² ≥ x.« Stimmt das?"
    params:
      options:
        - label: Nein – für x = 0,5 ist x² = 0,25
          correct: true
        - label: Ja – Quadrieren macht größer
          feedback: Nicht zwischen 0 und 1.
        - label: Nur für negative Zahlen nicht
          feedback: Für negative stimmt es sogar.
    hints:
      - Probier eine Zahl zwischen 0 und 1.
    explanation: Ein Gegenbeispiel genügt. Für natürliche Zahlen wäre die Aussage wahr – der **Grundbereich** entscheidet.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: »Für alle n ≥ 1 ist n² − n + 11 eine Primzahl.« Welches ist das kleinste n, für das das nicht stimmt?
    answer:
      value: 11
    hints:
      - "Rechne einige Werte aus: 11, 13, 17, 23, 31 … alles Primzahlen."
      - Bei welchem n ist jeder Teil durch 11 teilbar?
    explanation: Für n = 11 ergibt sich 121 − 11 + 11 = 121 = 11 · 11. Zehn Beispiele beweisen nichts, ein einziges **Gegenbeispiel** widerlegt alles.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: buckets
    prompt: Was braucht man dafür?
    params:
      buckets:
        - id: b1
          label: ein Beispiel genügt
        - id: b2
          label: ein allgemeines Argument
      items:
        - label: "Beweise: Es gibt eine gerade Primzahl."
          bucket: b1
        - label: "Widerlege: Jede Primzahl ist ungerade."
          bucket: b1
        - label: "Beweise: Jedes Quadrat ist ≥ 0."
          bucket: b2
        - label: "Widerlege: Es gibt eine größte Zahl."
          bucket: b2
    hints:
      - »Es gibt« beweist man mit einem Beispiel. »Für alle« widerlegt man mit einem Gegenbeispiel.
      - "Ein »es gibt« zu widerlegen heißt: zeigen, dass es für alle nicht gilt."
    explanation: Beweisen von ∃ und Widerlegen von ∀ geht mit **einem** Fall. Beweisen von ∀ und Widerlegen von ∃ braucht ein Argument für alle Fälle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum reicht ein einziges Gegenbeispiel, um eine »Für alle«-Aussage zu widerlegen – aber kein einzelnes Beispiel, um sie zu beweisen?"
    params:
      keywords:
        - - alle
          - jede
          - all
          - every
        - - ausnahme
          - gegenbeispiel
          - exception
          - counterexample
        - - unendlich
          - viele
          - prüfen
          - infinite
          - many
          - check
          - restliche
          - übrigen
          - remaining
      sample: Die Aussage behauptet etwas über alle Fälle. Schon eine einzige Ausnahme zeigt, dass das nicht stimmt. Ein passendes Beispiel sagt dagegen nichts über die vielen übrigen Fälle.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: »Jede gerade Zahl größer als 2 ist die Summe zweier Primzahlen.« Computer haben das für riesige Zahlen geprüft. Warum gilt die Vermutung trotzdem nicht als bewiesen?
    params:
      options:
        - label: Es gibt unendlich viele gerade Zahlen – jede Prüfung erfasst nur endlich viele.
          correct: true
        - label: Weil Computer sich verrechnen könnten.
          feedback: Selbst fehlerfreie Rechnungen würden nur endlich viele Fälle zeigen.
        - label: Sie gilt als bewiesen.
          feedback: Diese Goldbach-Vermutung ist seit 1742 offen.
    hints:
      - Wie viele Fälle umfasst ein »für alle« über ganze Zahlen?
      - Kann man unendlich viele Fälle einzeln ausprobieren?
    explanation: Ein **Für-alle**-Satz über unendlich viele Zahlen braucht ein Argument, das jede Zahl erfasst. Belege machen die Goldbach-Vermutung glaubhaft, aber nicht sicher.
    difficulty: 3

srs:
  cards_from: [wahr, beweis]
