id: logic.quantifiers.basics
type: concept
title: All and Some
summary: Statements about whole groups.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Three little words
    body: '"All", "some", "none" – three little words that matter in contracts and proofs. Shade some cells. When is "some cells are shaded" true? When is "all"? Try it out: these words are **quantifiers**.'
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 3
        cols: 6
        counter: true

  - kind: problem
    id: hook
    widget: numeric
    prompt: “All swans are white.” How many black swans does it take to refute that?
    answer:
      value: 1
    hints:
      - The sentence says “all”.
    explanation: A single one suffices. Words like “all” and “some” have great effect.

  - kind: explain
    id: s1
    body: |
      **Quantifiers** say how many things a statement covers: “**all**” (every element), “**some**” (at least one), and “**none**” (no element). In logic, “some” already means at least one.

  - kind: problem
    id: widerlegen
    widget: choice
    prompt: How do you refute “All cats are black”?
    params:
      options:
        - { label: With a single cat that is not black, correct: true }
        - { label: You have to check all the cats in the world, feedback: "One counterexample is enough to refute it." }
    hints:
      - What is enough to make “all” false?
    explanation: Statements about “all” are strict – one outlier is enough.

  - kind: problem
    id: belegen
    widget: choice
    prompt: How do you support “Some cats are black”?
    params:
      options:
        - { label: With a single black cat, correct: true }
        - { label: With many black cats, feedback: "One is enough – “some” means at least one." }
    hints:
      - How many does “at least one” need?
    explanation: Existence statements are supported by a single example.

  - kind: problem
    id: venn
    widget: venn
    prompt: "“Some athletes are musicians.” Color the region where someone must exist."
    params: { sets: [Athletes, Musicians] }
    answer: { regions: [AB] }
    hints:
      - Where are the athletes who are also musicians?
    explanation: The statement only guarantees that the intersection is not empty.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Some primes are even.
          right: true
          why: "One suffices: 2."
        - text: All primes are odd.
          right: false
          why: 2 is a counterexample.
        - text: No square of an integer is negative.
          right: true
        - text: All birds can fly.
          right: false
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “All unicorns in this room are pink.” There is no unicorn in the room. Is the statement logically true?
    params:
      options:
        - label: Yes – there is no counterexample
          correct: true
        - label: No – there are no unicorns, after all
          feedback: A universal statement is only false if there is an exception.
        - label: Neither
          feedback: In logic it is unambiguously true.
    hints:
      - How do you refute a universal statement?
    explanation: A “vacuous truth”. Over the empty set every universal statement is true.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: venn
    prompt: '"All dogs are mammals." Shade the region that must therefore be **empty**.'
    params:
      sets:
        - Dogs
        - Mammals
    answer:
      regions:
        - A
    feedback:
      - when: has('AB')
        misconception: all-shades-overlap
        text: The overlap holds the dogs – they exist. What is empty is the rest of the dog circle.
    hints:
      - Where would a dog be that is not a mammal?
      - Inside the dog circle but outside the mammal circle.
    explanation: '"All A are B" means: A without B is empty. That is why the A circle is often drawn entirely inside the B circle.'
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: swipe
    prompt: The set is {2, 4, 6, 8}. Is the statement true?
    params:
      cards:
        - text: All numbers are even.
          right: true
        - text: Some numbers are greater than 7.
          right: true
          why: The 8 is enough as an example.
        - text: No number is divisible by 3.
          right: false
          why: 6 is divisible by 3.
        - text: All numbers are less than 8.
          right: false
          why: 8 is not less than 8.
    explanation: With a finite set you check "all" element by element. For "some" one example is enough; against "none" one counterexample.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In logic “some A are B” only means “at least one”. Does that rule out that **all** A are B?
    params:
      options:
        - label: No – “some” is also true if it is all
          correct: true
        - label: Yes – otherwise one would have said “all”
          feedback: That is everyday logic, not formal logic.
        - label: That depends on the topic
          feedback: The meaning is fixed.
    hints:
      - If all are – is there then at least one?
    explanation: In everyday life we assume “some but not all”. Logic separates what is **said** from what is merely **suggested**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Which statement means the same as "No fish can fly"?
    params:
      options:
        - label: There is no fish that can fly.
          correct: true
        - label: Not all fish can fly.
          feedback: That still allows some flying fish – "no" allows not a single one.
        - label: Some fish cannot fly.
          feedback: "That is weaker: it says nothing about the other fish."
    hints:
      - '"No" means: the opposite holds for every element.'
      - What would be a counterexample to "no fish flies"?
    explanation: '"No A is B" = "for all A, not B" = "there is no A that is B". Both ∀ and ∃ are hidden here: ∀x ¬P(x) equals ¬∃x P(x).'
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux exactly what "all", "some" and "none" mean in logic.
    params:
      keywords:
        - - alle
          - jede
          - all
          - every
        - - mindestens ein
          - mindestens eins
          - at least one
        - - kein
          - keiner
          - none
          - no
        - - gegenbeispiel
          - beispiel
          - counterexample
          - example
      sample: All means for every element. Some means for at least one element. None means for no element. One counterexample refutes all, one example proves some.
    difficulty: 3

srs:
  cards_from: [widerlegen, belegen]
