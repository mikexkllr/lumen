id: logic.quantifiers.basics
type: concept
title: All and Some
summary: Statements about whole groups.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: “All swans are white.” How many black swans does it take to refute that?
    answer:
      value: 1
    hints:
      - The sentence says “all”.
    explanation: A single one suffices. Words like “all” and “some” have great effect.

  - kind: explain
    id: s1
    body: |
      **Quantifiers** say how many things a statement covers: “**all**” (every element), “**some**” (at least one), and “**none**” (no element). In logic, “some” already means at least one.

  - kind: problem
    id: widerlegen
    widget: choice
    prompt: How do you refute “All cats are black”?
    params:
      options:
        - { label: With a single cat that is not black, correct: true }
        - { label: You have to check all the cats in the world, feedback: "One counterexample is enough to refute it." }
    hints:
      - What is enough to make “all” false?
    explanation: Statements about “all” are strict – one outlier is enough.

  - kind: problem
    id: belegen
    widget: choice
    prompt: How do you support “Some cats are black”?
    params:
      options:
        - { label: With a single black cat, correct: true }
        - { label: With many black cats, feedback: "One is enough – “some” means at least one." }
    hints:
      - How many does “at least one” need?
    explanation: Existence statements are supported by a single example.

  - kind: problem
    id: venn
    widget: venn
    prompt: "“Some athletes are musicians.” Color the region where someone must exist."
    params: { sets: [Athletes, Musicians] }
    answer: { regions: [AB] }
    hints:
      - Where are the athletes who are also musicians?
    explanation: The statement only guarantees that the intersection is not empty.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Some primes are even.
          right: true
          why: "One suffices: 2."
        - text: All primes are odd.
          right: false
          why: 2 is a counterexample.
        - text: No square of an integer is negative.
          right: true
        - text: All birds can fly.
          right: false
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “All unicorns in this room are pink.” There is no unicorn in the room. Is the statement logically true?
    params:
      options:
        - label: Yes – there is no counterexample
          correct: true
        - label: No – there are no unicorns, after all
          feedback: A universal statement is only false if there is an exception.
        - label: Neither
          feedback: In logic it is unambiguously true.
    hints:
      - How do you refute a universal statement?
    explanation: A “vacuous truth”. Over the empty set every universal statement is true.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In logic “some A are B” only means “at least one”. Does that rule out that **all** A are B?
    params:
      options:
        - label: No – “some” is also true if it is all
          correct: true
        - label: Yes – otherwise one would have said “all”
          feedback: That is everyday logic, not formal logic.
        - label: That depends on the topic
          feedback: The meaning is fixed.
    hints:
      - If all are – is there then at least one?
    explanation: In everyday life we assume “some but not all”. Logic separates what is **said** from what is merely **suggested**.
    difficulty: 3

srs:
  cards_from: [widerlegen, belegen]
