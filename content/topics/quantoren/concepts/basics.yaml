id: logic.quantifiers.basics
type: concept
title: Alle und einige
summary: Aussagen über ganze Gruppen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Drei kleine Wörter
    body: "»Alle«, »einige«, »keiner« – drei kleine Wörter, auf die es in Verträgen und Beweisen ankommt. Färbe Felder ein. Wann stimmt »einige Felder sind gefärbt«? Wann »alle«? Probier es aus: Das sind **Quantoren**."
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 3
        cols: 6
        counter: true

  - kind: problem
    id: hook
    widget: numeric
    prompt: »Alle Schwäne sind weiß.« Wie viele schwarze Schwäne braucht es, um das zu widerlegen?
    answer:
      value: 1
    hints:
      - Der Satz sagt »alle«.
    explanation: Ein einziger genügt. Wörter wie »alle« und »einige« haben große Wirkung.

  - kind: explain
    id: s1
    body: |
      **Quantoren** sagen, für wie viele etwas gilt: »**alle**« (für jedes Element), »**einige**« (mindestens eines) und »**keiner**« (für kein Element). In der Logik heißt »einige« schon: mindestens eins.

  - kind: problem
    id: widerlegen
    widget: choice
    prompt: Wie widerlegt man »Alle Katzen sind schwarz«?
    params:
      options:
        - { label: Mit einer einzigen nicht schwarzen Katze, correct: true }
        - { label: Man muss alle Katzen der Welt prüfen, feedback: "Zum Widerlegen reicht ein Gegenbeispiel." }
    hints:
      - Was genügt, damit »alle« nicht mehr stimmt?
    explanation: Allaussagen sind streng – ein Ausreißer genügt.

  - kind: problem
    id: belegen
    widget: choice
    prompt: Wie belegt man »Einige Katzen sind schwarz«?
    params:
      options:
        - { label: Mit einer einzigen schwarzen Katze, correct: true }
        - { label: Mit vielen schwarzen Katzen, feedback: "Eine genügt – »einige« heißt mindestens eine." }
    hints:
      - Wie viele braucht »mindestens eins«?
    explanation: Existenzaussagen belegt man mit einem einzigen Beispiel.

  - kind: problem
    id: venn
    widget: venn
    prompt: »Einige Sportler sind Musiker.« Färbe den Bereich, in dem es sicher jemanden geben muss.
    params: { sets: [Sportler, Musiker] }
    answer: { regions: [AB] }
    hints:
      - Wo sind Sportler, die auch Musiker sind?
    explanation: Die Aussage garantiert nur, dass die Schnittmenge nicht leer ist.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Einige Primzahlen sind gerade.
          right: true
          why: "Eine genügt: die 2."
        - text: Alle Primzahlen sind ungerade.
          right: false
          why: Die 2 ist ein Gegenbeispiel.
        - text: Kein Quadrat einer ganzen Zahl ist negativ.
          right: true
        - text: Alle Vögel können fliegen.
          right: false
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: »Alle Einhörner in diesem Raum sind rosa.« Es gibt kein Einhorn im Raum. Ist die Aussage logisch wahr?
    params:
      options:
        - label: Ja – es gibt kein Gegenbeispiel
          correct: true
        - label: Nein – es gibt ja keine Einhörner
          feedback: Eine All-Aussage ist nur falsch, wenn es eine Ausnahme gibt.
        - label: Weder noch
          feedback: In der Logik ist sie eindeutig wahr.
    hints:
      - Wie widerlegt man eine All-Aussage?
    explanation: Eine »leere Wahrheit«. Über die leere Menge ist jede All-Aussage wahr.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: venn
    prompt: »Alle Hunde sind Säugetiere.« Färbe den Bereich, der dadurch **leer** sein muss.
    params:
      sets:
        - Hunde
        - Säugetiere
    answer:
      regions:
        - A
    feedback:
      - when: has('AB')
        misconception: all-shades-overlap
        text: In der Überlappung liegen die Hunde – die gibt es ja. Leer ist der Rest des Hunde-Kreises.
    hints:
      - Wo wäre ein Hund, der kein Säugetier ist?
      - Im Hunde-Kreis, aber außerhalb des Säugetier-Kreises.
    explanation: "»Alle A sind B« heißt: A ohne B ist leer. Darum zeichnet man den A-Kreis oft gleich ganz in den B-Kreis hinein."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: swipe
    prompt: Die Menge ist {2, 4, 6, 8}. Stimmt die Aussage?
    params:
      cards:
        - text: Alle Zahlen sind gerade.
          right: true
        - text: Einige Zahlen sind größer als 7.
          right: true
          why: Die 8 reicht als Beispiel.
        - text: Keine Zahl ist durch 3 teilbar.
          right: false
          why: Die 6 ist durch 3 teilbar.
        - text: Alle Zahlen sind kleiner als 8.
          right: false
          why: Die 8 ist nicht kleiner als 8.
    explanation: Bei einer endlichen Menge prüft man »alle« Element für Element. Für »einige« reicht ein Beispiel, gegen »keine« ein Gegenbeispiel.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In der Logik heißt »einige A sind B« nur »mindestens eines«. Schließt das aus, dass **alle** A B sind?
    params:
      options:
        - label: Nein – »einige« ist auch wahr, wenn es alle sind
          correct: true
        - label: Ja – sonst hätte man »alle« gesagt
          feedback: Das ist Alltagslogik, nicht formale Logik.
        - label: Das hängt vom Thema ab
          feedback: Die Bedeutung ist fest.
    hints:
      - Wenn alle es sind – gibt es dann mindestens einen?
    explanation: Im Alltag unterstellen wir »einige, aber nicht alle«. Die Logik trennt, was **gesagt** und was nur **nahegelegt** wird.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Welche Aussage bedeutet dasselbe wie »Kein Fisch kann fliegen«?
    params:
      options:
        - label: Es gibt keinen Fisch, der fliegen kann.
          correct: true
        - label: Nicht alle Fische können fliegen.
          feedback: Das erlaubt noch fliegende Fische – »kein« erlaubt keinen einzigen.
        - label: Einige Fische können nicht fliegen.
          feedback: "Das ist schwächer: Es sagt nichts über die übrigen Fische."
    hints:
      - "»Kein« heißt: Für jedes Element gilt das Gegenteil."
      - Was wäre ein Gegenbeispiel zu »kein Fisch fliegt«?
    explanation: "»Kein A ist B« = »Für alle A gilt nicht B« = »Es gibt kein A, das B ist«. Hier stecken ∀ und ∃ zugleich drin: ∀x ¬P(x) ist dasselbe wie ¬∃x P(x)."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was »alle«, »einige« und »keiner« in der Logik genau bedeuten.
    params:
      keywords:
        - - alle
          - jede
          - all
          - every
        - - mindestens ein
          - mindestens eins
          - at least one
        - - kein
          - keiner
          - none
          - no
        - - gegenbeispiel
          - beispiel
          - counterexample
          - example
      sample: "Alle heißt: für jedes Element. Einige heißt: für mindestens ein Element. Keiner heißt: für kein Element. Ein einziges Gegenbeispiel widerlegt alle, ein Beispiel belegt einige."
    difficulty: 3

srs:
  cards_from: [widerlegen, belegen]
