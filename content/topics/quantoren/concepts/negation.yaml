id: logic.quantifiers.negation
type: concept
title: Richtig verneinen
summary: Aus »alle« wird »nicht alle«.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: nicht-alle
    widget: choice
    prompt: Was ist das Gegenteil von »Alle Schwäne sind weiß«?
    params:
      options:
        - { label: Mindestens ein Schwan ist nicht weiß., correct: true }
        - { label: Alle Schwäne sind nicht weiß., feedback: "Das ist viel stärker – dafür müsste jeder Schwan andersfarbig sein." }
    hints:
      - Was muss passieren, damit »alle« falsch wird?
    explanation: Die Verneinung von »alle« ist »es gibt einen, der nicht«.

  - kind: explain
    id: s2
    body: |
      Beim Verneinen tauschen die **Quantoren**: Aus »für alle gilt …« wird »es gibt einen, für den nicht …«. Aus »es gibt einen …« wird »für keinen gilt …«.

  - kind: problem
    id: paare
    widget: match
    prompt: Verbinde jede Aussage mit ihrer Verneinung.
    params:
      pairs:
        - { left: Alle bestehen., right: Einer fällt durch. }
        - { left: Einer lügt., right: Keiner lügt. }
        - { left: Keiner kam., right: Mindestens einer kam. }
    hints:
      - Alle wird zu einer-nicht, einer wird zu keiner.
    explanation: Quantoren tauschen, die Aussage dahinter wird verneint.

  - kind: problem
    id: versprechen
    widget: choice
    prompt: Ein Händler verspricht »Jedes Teil ist geprüft«. Was zeigt, dass er lügt?
    params:
      options:
        - { label: Ein einziges ungeprüftes Teil, correct: true }
        - { label: Dass kein Teil geprüft ist, feedback: "Das wäre auch ein Gegenbeweis – aber schon ein Teil genügt." }
    hints:
      - Wie wenig reicht, um »jedes« zu widerlegen?
    explanation: Eine einzige Ausnahme genügt.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Ist das richtig verneint?
    params:
      buckets:
        - id: b1
          label: Richtig
        - id: b2
          label: Falsch
      items:
        - label: »Alle kommen« – »Einer kommt nicht«
          bucket: b1
        - label: »Alle kommen« – »Keiner kommt«
          bucket: b2
        - label: »Einer fehlt« – »Keiner fehlt«
          bucket: b1
        - label: »Einer fehlt« – »Alle fehlen«
          bucket: b2
    hints:
      - Die Verneinung ist genau dann wahr, wenn der Satz falsch ist.
    explanation: »Alle« und »einer« tauschen beim Verneinen die Rollen.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Aus »für alle gilt« wird »es [[gibt]] einen, für den es nicht gilt«. Aus »es gibt einen« wird »für [[keinen]] gilt«.
      distractors:
        - fehlt
        - jeden

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was ist das Gegenteil von »In jeder Klasse gibt es ein Kind, das alle Aufgaben löst«?
    params:
      options:
        - label: Es gibt eine Klasse, in der jedes Kind mindestens eine Aufgabe nicht löst
          correct: true
        - label: In keiner Klasse löst ein Kind eine Aufgabe
          feedback: Viel zu stark.
        - label: In jeder Klasse gibt es ein Kind, das keine Aufgabe löst
          feedback: Die Quantoren müssen alle kippen.
    hints:
      - "Kippe von außen nach innen: jede → eine, ein → jedes, alle → mindestens eine nicht."
    explanation: Drei Quantoren, drei Wechsel. So verneint man auch die schwierigsten Definitionen der Mathematik.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Was ist das Gegenteil von »Es gibt eine Stadt, in der jeder ein Fahrrad hat«?
    params:
      options:
        - label: In jeder Stadt gibt es jemanden ohne Fahrrad.
          correct: true
        - label: In keiner Stadt hat jemand ein Fahrrad.
          feedback: Viel zu stark – eine Person ohne Rad pro Stadt reicht.
        - label: Es gibt eine Stadt, in der niemand ein Fahrrad hat.
          feedback: Das »es gibt« hätte zu »jede« werden müssen.
    hints:
      - "Verneine von außen nach innen: Aus »es gibt« wird »für jede«."
      - "Dann wird aus »jeder hat eins« das Gegenteil: »einer hat keins«."
    explanation: ¬∃s ∀p R(s, p) = ∀s ∃p ¬R(s, p). Die Verneinung wandert nach innen, und jeder Quantor **kippt** unterwegs.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: ¬∀x P(x) ist dasselbe wie [[∃x ¬P(x)]]. Und ¬∃x P(x) ist dasselbe wie [[∀x ¬P(x)]].
      distractors:
        - ∃x P(x)
        - ∀x P(x)
    hints:
      - »Nicht alle« heißt »mindestens einer nicht«. »Es gibt keinen« heißt »alle nicht«.
    explanation: Beim Verneinen tauscht ∀ mit ∃, und die Verneinung rutscht hinter den Quantor. Das sind die De-Morgan-Regeln für Quantoren.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: »Nicht alle Schwäne sind weiß« und »Alle Schwäne sind nicht weiß« – ist das dasselbe?
    params:
      options:
        - label: Nein – das erste heißt »mindestens einer nicht«, das zweite »keiner«
          correct: true
        - label: Ja – nur die Wortstellung ist anders
          feedback: Die Position des »nicht« ändert die Bedeutung völlig.
        - label: Beide sind sinnlos
          feedback: Beide sind klare Aussagen.
    hints:
      - Wie viele nicht-weiße Schwäne braucht man jeweils?
    explanation: Wo das »nicht« steht, entscheidet. Die formale Schreibweise ¬∀ gegen ∀¬ macht es eindeutig.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Eine Folge strebt gegen a, wenn gilt: Für jedes ε > 0 gibt es ein N, sodass für alle n ≥ N gilt |aₙ − a| < ε. Was heißt »strebt **nicht** gegen a«?"
    params:
      options:
        - label: Es gibt ein ε > 0, sodass es für jedes N ein n ≥ N mit |aₙ − a| ≥ ε gibt.
          correct: true
        - label: Für jedes ε gibt es kein N.
          feedback: Das verneint nur halb – das innere »für alle« muss auch kippen.
        - label: Für alle n gilt |aₙ − a| ≥ ε.
          feedback: "Viel zu stark: Es reicht, wenn immer wieder einzelne Glieder weit weg liegen."
    hints:
      - "Drei Quantoren: für jedes – es gibt – für alle. Jeder kippt."
      - Am Ende wird aus »< ε« das Gegenteil »≥ ε«.
    explanation: "∀ε ∃N ∀n wird zu ∃ε ∀N ∃n, und die Ungleichung kehrt sich um. Anschaulich: Es gibt einen Abstand, den die Folge **immer wieder** überschreitet."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man eine Aussage mit »für alle« und »es gibt« richtig verneint.
    params:
      keywords:
        - - für alle
          - jede
          - for all
          - every
        - - es gibt
          - mindestens
          - there is
          - at least
        - - tausch
          - kipp
          - wird zu
          - swap
          - flip
          - becomes
      sample: Beim Verneinen wird aus für alle ein es gibt, und aus es gibt wird für alle. Am Ende verneint man die innere Aussage. Jeder Quantor kippt also einmal.
    difficulty: 3

srs:
  cards_from: [nicht-alle, paare]
