id: chem.periodic.everyday
type: concept
title: Elemente im Alltag
summary: Vom Akku bis zum Chip.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent deiner Körpermasse sind Sauerstoff?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 65
      tolerance: 10
    explanation: Rund 65 % – vor allem im Wasser. Dann folgen Kohlenstoff, Wasserstoff und Stickstoff.


  - kind: problem
    id: verwendung
    widget: match
    prompt: Wo steckt welches Element?
    params:
      pairs:
        - { left: Lithium, right: Akkus }
        - { left: Silicium, right: Computerchips }
        - { left: Helium, right: Ballons }
        - { left: Chlor, right: Schwimmbadwasser }
    hints:
      - Welches Gas ist leichter als Luft und brennt nicht?
    explanation: Lithium ist das leichteste Metall – ideal für Akkus.

  - kind: problem
    id: haeufig
    widget: choice
    prompt: Welches Element ist im ganzen Universum am häufigsten?
    params:
      options:
        - { label: Wasserstoff, correct: true }
        - { label: Sauerstoff, feedback: "Auf der Erde häufig – im All dominiert etwas anderes." }
        - { label: Eisen, feedback: "Eisen entsteht erst in großen Sternen." }
    hints:
      - Woraus bestehen Sterne vor allem?
    explanation: Rund drei Viertel aller normalen Materie ist Wasserstoff.

  - kind: explain
    id: s3
    body: |
      Ein **Element** besteht aus nur einer Atomsorte. Eine **Verbindung** aus mehreren, fest aneinander gebunden – mit ganz neuen Eigenschaften.

  - kind: problem
    id: element
    widget: buckets
    prompt: Element oder Verbindung?
    params:
      buckets: [{ label: Element }, { label: Verbindung }]
      items:
        - { label: Gold, bucket: Element }
        - { label: Kupfer, bucket: Element }
        - { label: "Sauerstoffgas O₂", bucket: Element }
        - { label: Wasser, bucket: Verbindung }
        - { label: Kochsalz, bucket: Verbindung }
    hints:
      - Wie viele verschiedene Atomsorten stecken drin?
    explanation: O₂ hat zwei Atome – aber nur eine Sorte. Darum ist es ein Element.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Woher stammen die schweren Elemente in deinem Körper – etwa das Eisen im Blut?
    params:
      options:
        - label: Sie entstanden in Sternen, lange bevor es die Sonne gab
          correct: true
        - label: Sie entstanden beim Urknall
          feedback: Der Urknall lieferte fast nur Wasserstoff und Helium.
        - label: Die Erde hat sie in ihrem Kern erzeugt
          feedback: Dafür ist es dort nicht annähernd heiß genug.
    hints:
      - Wo ist es heiß genug für Kernfusion?
    explanation: Wir bestehen aus Sternenstaub – ganz wörtlich.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum verhalten sich Elemente in derselben Spalte des Periodensystems ähnlich?"
    params:
      keywords:
        - - außenelektron
          - außen
          - outer
          - valence
          - valenz
        - - gleich
          - same
          - ebenso
          - equal
        - - reagier
          - verhalt
          - chemi
          - react
          - behav
      sample: Sie haben gleich viele Außenelektronen. Und weil die Außenelektronen bestimmen, wie ein Atom reagiert, verhalten sie sich chemisch ähnlich.
    difficulty: 3

srs:
  cards_from: [verwendung, element]
