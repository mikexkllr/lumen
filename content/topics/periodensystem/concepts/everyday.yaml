id: chem.periodic.everyday
type: concept
title: Elemente im Alltag
summary: Vom Akku bis zum Chip.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent deiner Körpermasse sind Sauerstoff?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 65
      tolerance: 10
    explanation: Rund 65 % – vor allem im Wasser. Dann folgen Kohlenstoff, Wasserstoff und Stickstoff.

  - kind: problem
    id: verwendung
    widget: match
    prompt: Wo steckt welches Element?
    params:
      pairs:
        - { left: Lithium, right: Akkus }
        - { left: Silicium, right: Computerchips }
        - { left: Helium, right: Ballons }
        - { left: Chlor, right: Schwimmbadwasser }
    hints:
      - Welches Gas ist leichter als Luft und brennt nicht?
    explanation: Lithium ist das leichteste Metall – ideal für Akkus.

  - kind: problem
    id: haeufig
    widget: choice
    prompt: Welches Element ist im ganzen Universum am häufigsten?
    params:
      options:
        - { label: Wasserstoff, correct: true }
        - { label: Sauerstoff, feedback: "Auf der Erde häufig – im All dominiert etwas anderes." }
        - { label: Eisen, feedback: "Eisen entsteht erst in großen Sternen." }
    hints:
      - Woraus bestehen Sterne vor allem?
    explanation: Rund drei Viertel aller normalen Materie ist Wasserstoff.

  - kind: explain
    id: s3
    body: |
      Ein **Element** besteht aus nur einer Atomsorte. Eine **Verbindung** aus mehreren, fest aneinander gebunden – mit ganz neuen Eigenschaften.

  - kind: problem
    id: element
    widget: buckets
    prompt: Element oder Verbindung?
    params:
      buckets: [{ label: Element }, { label: Verbindung }]
      items:
        - { label: Gold, bucket: Element }
        - { label: Kupfer, bucket: Element }
        - { label: "Sauerstoffgas O₂", bucket: Element }
        - { label: Wasser, bucket: Verbindung }
        - { label: Kochsalz, bucket: Verbindung }
    hints:
      - Wie viele verschiedene Atomsorten stecken drin?
    explanation: O₂ hat zwei Atome – aber nur eine Sorte. Darum ist es ein Element.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Woher stammen die schweren Elemente in deinem Körper – etwa das Eisen im Blut?
    params:
      options:
        - label: Sie entstanden in Sternen, lange bevor es die Sonne gab
          correct: true
        - label: Sie entstanden beim Urknall
          feedback: Der Urknall lieferte fast nur Wasserstoff und Helium.
        - label: Die Erde hat sie in ihrem Kern erzeugt
          feedback: Dafür ist es dort nicht annähernd heiß genug.
    hints:
      - Wo ist es heiß genug für Kernfusion?
    explanation: Wir bestehen aus Sternenstaub – ganz wörtlich.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der Masse der Erdkruste sind Sauerstoff?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 46
      tolerance: 6
    explanation: Rund 46 % – gebunden in Gestein wie Quarz SiO₂. Auf Platz 2 folgt Silicium mit etwa 28 %.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Mensch besteht zu rund 18 % seiner Masse aus Kohlenstoff. Wie viel Kilogramm Kohlenstoff stecken in einem Menschen mit {{m}} kg?
    params:
      unit: kg
    answer:
      value: "{{18 * m /100}}"
      tolerance: 0.01
    hints:
      - 18 % heißt 0,18-mal.
      - Rechne {{m}} · 0,18.
    explanation: "{{m}} · 0,18 = {{18 * m / 100}} kg. Nur Sauerstoff kommt im Körper auf mehr."
    difficulty: 2
    variants:
      params:
        m: step[40,100,10]
      defaults:
        m: 70

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Helium ist im Weltall das zweithäufigste Element. Warum ist es auf der Erde knapp?
    params:
      options:
        - label: Es ist so leicht, dass es aus der Atmosphäre ins All entweicht
          correct: true
        - label: Es reagiert und wird verbraucht
          feedback: Als Edelgas reagiert Helium praktisch nie.
        - label: Es gefriert an den Polen
          feedback: Helium wird erst knapp über dem absoluten Nullpunkt flüssig.
    hints:
      - Denk an einen Ballon, der losgelassen wird.
      - Leichte Teilchen sind bei gleicher Temperatur am schnellsten.
    explanation: Unser Helium stammt aus radioaktivem Zerfall im Gestein und sammelt sich im Erdgas. Einmal freigesetzt, ist es verloren.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum verhalten sich Elemente in derselben Spalte des Periodensystems ähnlich?"
    params:
      keywords:
        - - außenelektron
          - außen
          - outer
          - valence
          - valenz
        - - gleich
          - same
          - ebenso
          - equal
        - - reagier
          - verhalt
          - chemi
          - react
          - behav
      sample: Sie haben gleich viele Außenelektronen. Und weil die Außenelektronen bestimmen, wie ein Atom reagiert, verhalten sie sich chemisch ähnlich.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Sterne verschmelzen leichte Atomkerne zu schwereren – bis zum **Eisen**. Darüber kostet Fusion Energie. Gold, Platin und Uran entstehen erst bei Sternexplosionen und Kollisionen von Neutronensternen.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Die »Seltenen Erden« wie Neodym stecken in Windrädern und E-Motoren. Cer ist häufiger als Kupfer. Warum der Name?
    params:
      options:
        - label: Sie kommen selten angereichert vor und sind chemisch kaum voneinander zu trennen
          correct: true
        - label: Es gibt nur wenige Gramm davon
          feedback: Jährlich werden über 200 000 Tonnen gefördert.
        - label: Sie sind radioaktiv
          feedback: Fast alle Seltenen Erden sind stabil.
    hints:
      - Sie füllen alle dieselbe f-Unterschale.
      - Ihre Außenschalen sind fast gleich.
    explanation: Weil sich nur die inneren f-Elektronen unterscheiden, verhalten sie sich fast gleich. Das Trennen ist aufwendig und belastet die Umwelt.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: buckets
    prompt: Welche Elemente braucht dein Körper – und welche sind giftig?
    params:
      buckets:
        - id: b1
          label: lebenswichtig
        - id: b2
          label: giftig
      items:
        - label: Eisen
          bucket: b1
        - label: Calcium
          bucket: b1
        - label: Iod
          bucket: b1
        - label: Blei
          bucket: b2
        - label: Quecksilber
          bucket: b2
        - label: Cadmium
          bucket: b2
    hints:
      - Eisen trägt Sauerstoff, Calcium baut Knochen.
      - Schwermetalle wie Blei kann der Körper nicht gebrauchen.
    explanation: "Iod braucht die Schilddrüse. Blei, Quecksilber und Cadmium blockieren Enzyme – schon in kleinen Mengen. Bei allem gilt: Die Dosis macht das Gift."
    difficulty: 3

srs:
  cards_from: [verwendung, element]
