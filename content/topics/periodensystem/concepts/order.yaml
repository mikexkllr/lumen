id: chem.periodic.order
type: concept
title: Die Ordnungszahl
summary: Protonen bestimmen den Platz.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Tabelle aller Dinge
    body: Hier stehen die ersten 18 Elemente des **Periodensystems**. Tippe alle an, die dir im Alltag schon begegnet sind. Nach welcher Regel stehen sie wohl in dieser Reihenfolge?
    visual:
      widget: pixels
      interactive: true
      params:
        labels:
          - - H
            - ""
            - ""
            - ""
            - ""
            - ""
            - ""
            - He
          - - Li
            - Be
            - B
            - C
            - N
            - O
            - F
            - Ne
          - - Na
            - Mg
            - Al
            - Si
            - P
            - S
            - Cl
            - Ar
        locked:
          - .xxxxxx.
          - ........
          - ........

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele chemische Elemente kennt man heute?"
    params:
      min: 10
      max: 500
    answer:
      value: 118
      tolerance: 20
    explanation: 118. Alles um dich herum besteht aus diesen Bausteinen.

  - kind: explain
    id: s1
    body: |
      Im **Periodensystem** stehen die Elemente nach ihrer **Ordnungszahl** – der Zahl der Protonen im Kern. Wasserstoff hat 1, Helium 2, Lithium 3 und so weiter.

  - kind: problem
    id: protonen
    widget: numeric
    prompt: Sauerstoff hat die Ordnungszahl 8. Wie viele Protonen hat ein Sauerstoffatom?
    params: { unit: Protonen }
    answer: { value: 8 }
    hints:
      - Die Ordnungszahl zählt genau die Protonen.
    explanation: 8 Protonen – ein Proton mehr, und es wäre Fluor.

  - kind: problem
    id: reihe
    widget: order
    prompt: Ordne nach der Ordnungszahl, die kleinste zuerst.
    params:
      items:
        - { label: Wasserstoff }
        - { label: Helium }
        - { label: Kohlenstoff }
        - { label: Sauerstoff }
        - { label: Eisen }
    hints:
      - Wasserstoff ist das leichteste Element.
    explanation: H 1, He 2, C 6, O 8, Fe 26.

  - kind: problem
    id: spalten
    widget: choice
    prompt: Lithium, Natrium und Kalium stehen untereinander in einer Spalte. Warum?
    params:
      options:
        - { label: Sie verhalten sich chemisch sehr ähnlich., correct: true }
        - { label: Sie sind gleich schwer., feedback: "Kalium ist fast sechsmal so schwer wie Lithium." }
        - { label: Sie wurden gleichzeitig entdeckt., feedback: "Die Spalten folgen dem Verhalten, nicht der Geschichte." }
    hints:
      - Spalten heißen **Gruppen** – was haben Familienmitglieder gemeinsam?
    explanation: Alle drei reagieren heftig mit Wasser. Gleiche Spalte heißt ähnliche Chemie.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Gold hat das Symbol Au.
          right: true
        - text: Die Ordnungszahl zählt die Neutronen.
          right: false
          why: Sie zählt die Protonen.
        - text: Elemente in derselben Spalte verhalten sich ähnlich.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein neutrales Atom hat 17 Elektronen. Welche Ordnungszahl hat es?
    answer:
      value: 17
    hints:
      - "Neutral heißt: gleich viele Protonen wie Elektronen."
    explanation: 17 – das ist Chlor.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: Ein neutrales Atom hat {{z}} Elektronen. In welcher Zeile (Periode) des Periodensystems steht es?
    answer:
      value: "{{per}}"
    hints:
      - Zeile 1 hat 2 Plätze, Zeile 2 und 3 haben je 8.
      - Bis Element 2 Zeile 1, bis 10 Zeile 2, bis 18 Zeile 3.
    explanation: Element {{z}} steht in Periode {{per}}. Die Zeile zählt die besetzten Schalen.
    difficulty: 2
    variants:
      params:
        z: int[1,18]
      derive:
        per: "z <= 2 ? 1 : (z <= 10 ? 2 : 3)"
      defaults:
        z: 13

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Tellur ist schwerer als Iod – steht aber im Periodensystem vor ihm. Warum?
    params:
      options:
        - label: "Sortiert wird nach Protonenzahl: Tellur hat 52, Iod 53"
          correct: true
        - label: Das ist ein Druckfehler
          feedback: Nein, das steht in jeder Tabelle so.
        - label: Sortiert wird nach dem Alphabet
          feedback: Dann stünde Iod weit vorne.
    hints:
      - Die Masse hängt auch von den Neutronen ab.
      - Was zählt die Ordnungszahl?
    explanation: Tellur hat viele schwere Isotope mit mehr Neutronen. Für den Platz zählen nur die Protonen.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Periode 6 endet mit Element 86, Periode 7 mit Element 118. Wie viele Elemente stehen in Periode 7?
    answer:
      value: 32
    feedback:
      - when: numval(state.input) == 33
        misconception: fencepost
        text: Element 86 gehört noch zu Periode 6.
    hints:
      - Periode 7 beginnt mit Element 87.
      - Rechne 118 − 86.
    explanation: 118 − 86 = 32. Die Periodenlängen lauten 2, 8, 8, 18, 18, 32, 32.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Mendelejew ließ 1869 in seiner Tabelle Lücken. Was machte das so genial?
    params:
      options:
        - label: Er sagte die Eigenschaften noch unbekannter Elemente vorher – und sie wurden gefunden
          correct: true
        - label: Er wollte Platz für Notizen lassen
          feedback: Die Lücken waren begründete Vorhersagen.
        - label: Er kannte die Protonenzahl schon
          feedback: Protonen wurden erst 50 Jahre später entdeckt.
    hints:
      - Eine gute Theorie sagt etwas vorher, das man prüfen kann.
    explanation: Gallium und Germanium passten fast exakt zu seinen Vorhersagen.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Henry Moseley schoss 1913 Elektronen auf Metalle und maß deren Röntgenstrahlung. Ihre Frequenz stieg Schritt für Schritt mit der **Kernladung**. So wurde die Ordnungszahl messbar.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Kann man zwischen Wasserstoff (1) und Helium (2) noch ein unbekanntes Element entdecken?
    params:
      options:
        - label: Nein – es gibt keine 1,5 Protonen
          correct: true
        - label: Ja, mit besseren Geräten
          feedback: Die Ordnungszahl ist eine ganze Zahl. Dazwischen ist kein Platz.
        - label: Ja, ein Isotop
          feedback: Isotope haben dieselbe Ordnungszahl.
    hints:
      - Was müsste ein Element »1,5« im Kern haben?
      - Protonen kann man nur ganz zählen.
    explanation: "Seit Moseley weiß man: Die Lücken im System sind genau abzählbar. Neue Elemente gibt es nur jenseits von 118."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Ordnungszahl – und nicht die Masse – den Platz eines Elements bestimmt.
    params:
      keywords:
        - - proton
        - - neutron
          - isotop
          - masse schwank
          - mass var
        - - elektron
          - electron
          - chemie
          - chemistry
          - verhalten
          - behav
      sample: Die Ordnungszahl zählt die Protonen. Sie legt fest, wie viele Elektronen ein Atom hat, und damit sein chemisches Verhalten. Die Masse schwankt dagegen mit den Neutronen der Isotope.
    explanation: Protonen bestimmen das Element, Neutronen nur die Masse.
    difficulty: 3

srs:
  cards_from: [protonen, spalten]
