id: chem.periodic.order
type: concept
title: The atomic number
summary: Protons decide the place.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many chemical elements are known today?"
    params:
      min: 10
      max: 500
    answer:
      value: 118
      tolerance: 20
    explanation: 118. Everything around you is made of these building blocks.

  - kind: explain
    id: s1
    body: |
      In the **periodic table**, elements are arranged by their **atomic number**, the number of protons in the nucleus. Hydrogen has 1, helium 2, lithium 3, and so on.

  - kind: problem
    id: protonen
    widget: numeric
    prompt: Oxygen has atomic number 8. How many protons does an oxygen atom have?
    params: { unit: protons }
    answer: { value: 8 }
    hints:
      - The atomic number counts exactly the protons.
    explanation: 8 protons. One more, and it would be fluorine.

  - kind: problem
    id: reihe
    widget: order
    prompt: Sort by atomic number, smallest first.
    params:
      items:
        - { label: Hydrogen }
        - { label: Helium }
        - { label: Carbon }
        - { label: Oxygen }
        - { label: Iron }
    hints:
      - Hydrogen is the lightest element.
    explanation: H 1, He 2, C 6, O 8, Fe 26.

  - kind: problem
    id: spalten
    widget: choice
    prompt: Lithium, sodium and potassium sit in one column, one below the other. Why?
    params:
      options:
        - { label: They behave very similarly in chemistry., correct: true }
        - { label: They weigh the same., feedback: "Potassium is almost six times as heavy as lithium." }
        - { label: They were discovered at the same time., feedback: "The columns follow behavior, not history." }
    hints:
      - Columns are called **groups**. What do family members have in common?
    explanation: All three react violently with water. The same column means similar chemistry.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Gold has the symbol Au.
          right: true
        - text: The atomic number counts the neutrons.
          right: false
          why: It counts the protons.
        - text: Elements in the same column behave similarly.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A neutral atom has 17 electrons. What is its atomic number?
    answer:
      value: 17
    hints:
      - "Neutral means: as many protons as electrons."
    explanation: 17 – that is chlorine.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: A neutral atom has {{z}} electrons. In which row (period) of the periodic table is it?
    answer:
      value: "{{per}}"
    hints:
      - Row 1 has 2 places, rows 2 and 3 have 8 each.
      - Up to element 2 is row 1, up to 10 row 2, up to 18 row 3.
    explanation: Element {{z}} sits in period {{per}}. The row counts the occupied shells.
    difficulty: 2
    variants:
      params:
        z: int[1,18]
      derive:
        per: "z <= 2 ? 1 : (z <= 10 ? 2 : 3)"
      defaults:
        z: 13

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Tellurium is heavier than iodine – yet it comes before iodine in the periodic table. Why?
    params:
      options:
        - label: "The table is sorted by proton number: tellurium has 52, iodine 53"
          correct: true
        - label: That is a printing error
          feedback: No, every table shows it this way.
        - label: The table is sorted alphabetically
          feedback: Then iodine would be near the front.
    hints:
      - Mass also depends on the neutrons.
      - What does the atomic number count?
    explanation: Tellurium has many heavy isotopes with extra neutrons. For the position, only the protons count.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Period 6 ends with element 86, period 7 with element 118. How many elements are in period 7?
    answer:
      value: 32
    feedback:
      - when: numval(state.input) == 33
        misconception: fencepost
        text: Element 86 still belongs to period 6.
    hints:
      - Period 7 starts with element 87.
      - Work out 118 − 86.
    explanation: 118 − 86 = 32. The period lengths are 2, 8, 8, 18, 18, 32, 32.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In 1869 Mendeleev left gaps in his table. What made that so brilliant?
    params:
      options:
        - label: He predicted the properties of still unknown elements – and they were found
          correct: true
        - label: He wanted room for notes
          feedback: The gaps were reasoned predictions.
        - label: He already knew the proton numbers
          feedback: Protons were only discovered 50 years later.
    hints:
      - A good theory predicts something that can be tested.
    explanation: Gallium and germanium matched his predictions almost exactly.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: In 1913 Henry Moseley fired electrons at metals and measured their X-rays. The frequency rose step by step with the **nuclear charge**. This made the atomic number measurable.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Could an unknown element still be discovered between hydrogen (1) and helium (2)?
    params:
      options:
        - label: No – there is no such thing as 1.5 protons
          correct: true
        - label: Yes, with better instruments
          feedback: The atomic number is a whole number. There is no room in between.
        - label: Yes, an isotope
          feedback: Isotopes have the same atomic number.
    hints:
      - What would an element "1.5" need in its nucleus?
      - Protons can only be counted in whole numbers.
    explanation: Since Moseley we know the gaps can be counted exactly. New elements can only appear beyond 118.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why the atomic number – not the mass – decides where an element goes.
    params:
      keywords:
        - - proton
        - - neutron
          - isotop
          - masse schwank
          - mass var
        - - elektron
          - electron
          - chemie
          - chemistry
          - verhalten
          - behav
      sample: The atomic number counts the protons. It fixes how many electrons an atom has, and so its chemical behaviour. The mass, by contrast, varies with the neutrons of the isotopes.
    explanation: Protons decide the element, neutrons only the mass.
    difficulty: 3

srs:
  cards_from: [protonen, spalten]
