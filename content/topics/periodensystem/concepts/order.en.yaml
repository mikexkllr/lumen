id: chem.periodic.order
type: concept
title: The atomic number
summary: Protons decide the place.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      In the **periodic table**, elements are arranged by their **atomic number**, the number of protons in the nucleus. Hydrogen has 1, helium 2, lithium 3, and so on.

  - kind: problem
    id: protonen
    widget: numeric
    prompt: Oxygen has atomic number 8. How many protons does an oxygen atom have?
    params: { unit: protons }
    answer: { value: 8 }
    hints:
      - The atomic number counts exactly the protons.
    explanation: 8 protons. One more, and it would be fluorine.

  - kind: problem
    id: reihe
    widget: order
    prompt: Sort by atomic number, smallest first.
    params:
      items:
        - { label: Hydrogen }
        - { label: Helium }
        - { label: Carbon }
        - { label: Oxygen }
        - { label: Iron }
    hints:
      - Hydrogen is the lightest element.
    explanation: H 1, He 2, C 6, O 8, Fe 26.

  - kind: problem
    id: spalten
    widget: choice
    prompt: Lithium, sodium and potassium sit in one column, one below the other. Why?
    params:
      options:
        - { label: They behave very similarly in chemistry., correct: true }
        - { label: They weigh the same., feedback: "Potassium is almost six times as heavy as lithium." }
        - { label: They were discovered at the same time., feedback: "The columns follow behavior, not history." }
    hints:
      - Columns are called **groups**. What do family members have in common?
    explanation: All three react violently with water. The same column means similar chemistry.

srs:
  cards_from: [protonen, spalten]
