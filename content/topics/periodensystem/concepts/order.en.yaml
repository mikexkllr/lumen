id: chem.periodic.order
type: concept
title: The atomic number
summary: Protons decide the place.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many chemical elements are known today?"
    params:
      min: 10
      max: 500
    answer:
      value: 118
      tolerance: 20
    explanation: 118. Everything around you is made of these building blocks.


  - kind: explain
    id: s1
    body: |
      In the **periodic table**, elements are arranged by their **atomic number**, the number of protons in the nucleus. Hydrogen has 1, helium 2, lithium 3, and so on.

  - kind: problem
    id: protonen
    widget: numeric
    prompt: Oxygen has atomic number 8. How many protons does an oxygen atom have?
    params: { unit: protons }
    answer: { value: 8 }
    hints:
      - The atomic number counts exactly the protons.
    explanation: 8 protons. One more, and it would be fluorine.

  - kind: problem
    id: reihe
    widget: order
    prompt: Sort by atomic number, smallest first.
    params:
      items:
        - { label: Hydrogen }
        - { label: Helium }
        - { label: Carbon }
        - { label: Oxygen }
        - { label: Iron }
    hints:
      - Hydrogen is the lightest element.
    explanation: H 1, He 2, C 6, O 8, Fe 26.

  - kind: problem
    id: spalten
    widget: choice
    prompt: Lithium, sodium and potassium sit in one column, one below the other. Why?
    params:
      options:
        - { label: They behave very similarly in chemistry., correct: true }
        - { label: They weigh the same., feedback: "Potassium is almost six times as heavy as lithium." }
        - { label: They were discovered at the same time., feedback: "The columns follow behavior, not history." }
    hints:
      - Columns are called **groups**. What do family members have in common?
    explanation: All three react violently with water. The same column means similar chemistry.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Gold has the symbol Au.
          right: true
        - text: The atomic number counts the neutrons.
          right: false
          why: It counts the protons.
        - text: Elements in the same column behave similarly.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A neutral atom has 17 electrons. What is its atomic number?
    answer:
      value: 17
    hints:
      - "Neutral means: as many protons as electrons."
    explanation: 17 – that is chlorine.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In 1869 Mendeleev left gaps in his table. What made that so brilliant?
    params:
      options:
        - label: He predicted the properties of still unknown elements – and they were found
          correct: true
        - label: He wanted room for notes
          feedback: The gaps were reasoned predictions.
        - label: He already knew the proton numbers
          feedback: Protons were only discovered 50 years later.
    hints:
      - A good theory predicts something that can be tested.
    explanation: Gallium and germanium matched his predictions almost exactly.
    difficulty: 3

srs:
  cards_from: [protonen, spalten]
