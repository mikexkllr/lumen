id: chem.periodic.everyday
type: concept
title: Elements in everyday life
summary: From batteries to chips.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of your body mass is oxygen?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 65
      tolerance: 10
    explanation: About 65% – mostly in water. Then come carbon, hydrogen and nitrogen.


  - kind: problem
    id: verwendung
    widget: match
    prompt: Which element is found where?
    params:
      pairs:
        - { left: Lithium, right: Batteries }
        - { left: Silicon, right: Computer chips }
        - { left: Helium, right: Balloons }
        - { left: Chlorine, right: Pool water }
    hints:
      - Which gas is lighter than air and does not burn?
    explanation: Lithium is the lightest metal, which makes it ideal for batteries.

  - kind: problem
    id: haeufig
    widget: choice
    prompt: Which element is the most common in the whole universe?
    params:
      options:
        - { label: Hydrogen, correct: true }
        - { label: Oxygen, feedback: "Common on Earth, but something else dominates in space." }
        - { label: Iron, feedback: "Iron only forms in large stars." }
    hints:
      - What are stars mostly made of?
    explanation: About three quarters of all ordinary matter is hydrogen.

  - kind: explain
    id: s3
    body: |
      An **element** consists of only one kind of atom. A **compound** consists of several kinds, firmly bonded together, with entirely new properties.

  - kind: problem
    id: element
    widget: buckets
    prompt: Element or compound?
    params:
      buckets: [{ label: Element }, { label: Compound }]
      items:
        - { label: Gold, bucket: Element }
        - { label: Copper, bucket: Element }
        - { label: "Oxygen gas O₂", bucket: Element }
        - { label: Water, bucket: Compound }
        - { label: Table salt, bucket: Compound }
    hints:
      - How many different kinds of atoms does it contain?
    explanation: O₂ has two atoms, but only one kind. So it is an element.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Where do the heavy elements in your body come from – such as the iron in your blood?
    params:
      options:
        - label: They formed in stars long before the Sun existed
          correct: true
        - label: They formed in the Big Bang
          feedback: The Big Bang supplied almost only hydrogen and helium.
        - label: The Earth made them in its core
          feedback: It is nowhere near hot enough there.
    hints:
      - Where is it hot enough for nuclear fusion?
    explanation: We are made of stardust – quite literally.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do elements in the same column of the periodic table behave similarly?"
    params:
      keywords:
        - - außenelektron
          - außen
          - outer
          - valence
          - valenz
        - - gleich
          - same
          - ebenso
          - equal
        - - reagier
          - verhalt
          - chemi
          - react
          - behav
      sample: They have the same number of outer electrons. And because the outer electrons determine how an atom reacts, they behave chemically alike.
    difficulty: 3

srs:
  cards_from: [verwendung, element]
