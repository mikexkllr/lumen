id: chem.periodic.everyday
type: concept
title: Elements in everyday life
summary: From batteries to chips.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Elements up close
    body: About 90 elements occur in nature – and you carry some of them inside you. Uncover the cards. Which **element** hides where, and how much of it?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦴
            front: Calcium
            back: An adult carries over a kilogram of it – almost all in the bones.
          - icon: 🩸
            front: Iron
            back: Your blood holds about as much iron as a small nail.
          - icon: 🥇
            front: Gold
            back: All the gold ever mined fits in a cube 22 metres on each side.
          - icon: 📱
            front: Your phone
            back: It holds dozens of elements – many of them rare and costly.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of your body mass is oxygen?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 65
      tolerance: 10
    explanation: About 65% – mostly in water. Then come carbon, hydrogen and nitrogen.

  - kind: problem
    id: verwendung
    widget: match
    prompt: Which element is found where?
    params:
      pairs:
        - { left: Lithium, right: Batteries }
        - { left: Silicon, right: Computer chips }
        - { left: Helium, right: Balloons }
        - { left: Chlorine, right: Pool water }
    hints:
      - Which gas is lighter than air and does not burn?
    explanation: Lithium is the lightest metal, which makes it ideal for batteries.

  - kind: problem
    id: haeufig
    widget: choice
    prompt: Which element is the most common in the whole universe?
    params:
      options:
        - { label: Hydrogen, correct: true }
        - { label: Oxygen, feedback: "Common on Earth, but something else dominates in space." }
        - { label: Iron, feedback: "Iron only forms in large stars." }
    hints:
      - What are stars mostly made of?
    explanation: About three quarters of all ordinary matter is hydrogen.

  - kind: explain
    id: s3
    body: |
      An **element** consists of only one kind of atom. A **compound** consists of several kinds, firmly bonded together, with entirely new properties.

  - kind: problem
    id: element
    widget: buckets
    prompt: Element or compound?
    params:
      buckets: [{ label: Element }, { label: Compound }]
      items:
        - { label: Gold, bucket: Element }
        - { label: Copper, bucket: Element }
        - { label: "Oxygen gas O₂", bucket: Element }
        - { label: Water, bucket: Compound }
        - { label: Table salt, bucket: Compound }
    hints:
      - How many different kinds of atoms does it contain?
    explanation: O₂ has two atoms, but only one kind. So it is an element.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Where do the heavy elements in your body come from – such as the iron in your blood?
    params:
      options:
        - label: They formed in stars long before the Sun existed
          correct: true
        - label: They formed in the Big Bang
          feedback: The Big Bang supplied almost only hydrogen and helium.
        - label: The Earth made them in its core
          feedback: It is nowhere near hot enough there.
    hints:
      - Where is it hot enough for nuclear fusion?
    explanation: We are made of stardust – quite literally.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: what percentage of the mass of Earth's crust is oxygen?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 46
      tolerance: 6
    explanation: About 46% – bound in rocks such as quartz, SiO₂. Silicon comes second at about 28%.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: About 18% of a human body's mass is carbon. How many kilograms of carbon are in a person weighing {{m}} kg?
    params:
      unit: kg
    answer:
      value: "{{18 * m /100}}"
      tolerance: 0.01
    hints:
      - 18% means 0.18 times.
      - Work out {{m}} · 0.18.
    explanation: "{{m}} · 0.18 = {{18 * m / 100}} kg. Only oxygen makes up more of the body."
    difficulty: 2
    variants:
      params:
        m: step[40,100,10]
      defaults:
        m: 70

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Helium is the second most common element in the universe. Why is it scarce on Earth?
    params:
      options:
        - label: It is so light that it escapes from the atmosphere into space
          correct: true
        - label: It reacts and gets used up
          feedback: As a noble gas, helium practically never reacts.
        - label: It freezes at the poles
          feedback: Helium only turns liquid just above absolute zero.
    hints:
      - Think of a balloon that is let go.
      - At the same temperature, light particles are the fastest.
    explanation: Our helium comes from radioactive decay in rock and collects in natural gas. Once released, it is lost.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do elements in the same column of the periodic table behave similarly?"
    params:
      keywords:
        - - außenelektron
          - außen
          - outer
          - valence
          - valenz
        - - gleich
          - same
          - ebenso
          - equal
        - - reagier
          - verhalt
          - chemi
          - react
          - behav
      sample: They have the same number of outer electrons. And because the outer electrons determine how an atom reacts, they behave chemically alike.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Stars fuse light nuclei into heavier ones – up to **iron**. Beyond that, fusion costs energy. Gold, platinum and uranium only form in exploding stars and collisions of neutron stars.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: '"Rare earths" such as neodymium are found in wind turbines and electric motors. Cerium is more common than copper. Why the name?'
    params:
      options:
        - label: They are rarely found concentrated and are chemically very hard to tell apart
          correct: true
        - label: Only a few grams exist
          feedback: Over 200,000 tonnes are mined each year.
        - label: They are radioactive
          feedback: Almost all rare earths are stable.
    hints:
      - They all fill the same f subshell.
      - Their outer shells are almost the same.
    explanation: Because only their inner f electrons differ, they behave almost identically. Separating them is costly and hard on the environment.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: buckets
    prompt: Which elements does your body need – and which are poisonous?
    params:
      buckets:
        - id: b1
          label: essential
        - id: b2
          label: poisonous
      items:
        - label: Iron
          bucket: b1
        - label: Calcium
          bucket: b1
        - label: Iodine
          bucket: b1
        - label: Lead
          bucket: b2
        - label: Mercury
          bucket: b2
        - label: Cadmium
          bucket: b2
    hints:
      - Iron carries oxygen, calcium builds bones.
      - The body has no use for heavy metals like lead.
    explanation: The thyroid needs iodine. Lead, mercury and cadmium block enzymes – even in small amounts. For everything, the dose makes the poison.
    difficulty: 3

srs:
  cards_from: [verwendung, element]
