id: chem.periodic.groups
type: concept
title: Families in the table
summary: Alkali metals, halogens, noble gases.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Families with character
    body: "Elements in one column are like a family: they behave alike. Uncover the cards and meet three famous **families** – from fruit to neon signs."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍌
            front: Potassium
            back: A banana is very slightly radioactive – because of its potassium.
          - icon: 🦷
            front: Fluorine
            back: As a gas it even attacks glass. Tamed, it hardens your teeth.
          - icon: 💡
            front: Neon and friends
            back: Neon glows red, helium pink, argon violet – every glow gives its gas away.

  - kind: problem
    id: alkali
    widget: choice
    prompt: Alkali metals are in group 1. How many outer electrons do they have?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "2", feedback: "Group 2 has two." }
        - { label: "8", feedback: "The last group has eight." }
    hints:
      - The group number tells you.
    explanation: One, and they give it up very easily.

  - kind: problem
    id: familien
    widget: match
    prompt: Match each family with its behavior.
    params:
      pairs:
        - { left: Alkali metals, right: React violently with water }
        - { left: Halogens, right: Form salts with metals }
        - { left: Noble gases, right: Almost never react }
    hints:
      - Halogen means salt former.
    explanation: Same outer electrons, same temperament.

  - kind: explain
    id: s3
    body: |
      On the left of the periodic table are the **metals**. At the top right are the **nonmetals**. Metals conduct electricity and shine. Nonmetals often do not.

  - kind: problem
    id: metall
    widget: buckets
    prompt: Metal or nonmetal?
    params:
      buckets: [{ label: Metal }, { label: Nonmetal }]
      items:
        - { label: Iron, bucket: Metal }
        - { label: Copper, bucket: Metal }
        - { label: Sodium, bucket: Metal }
        - { label: Sulfur, bucket: Nonmetal }
        - { label: Chlorine, bucket: Nonmetal }
        - { label: Oxygen, bucket: Nonmetal }
    hints:
      - Does it conduct electricity?
    explanation: Sodium is a soft metal. You can cut it with a knife.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order from left to right in the periodic table.
    params:
      items:
        - label: Sodium (alkali metal)
        - label: Aluminium (metal)
        - label: Chlorine (halogen)
        - label: Argon (noble gas)
    hints:
      - Metals are on the left, noble gases on the far right.
    explanation: All four are in the same row – from very reactive to completely inert.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Sodium (a soft metal that explodes with water) and chlorine (a poisonous gas) together make table salt. What does that show?
    params:
      options:
        - label: A compound has completely different properties from its elements
          correct: true
        - label: Table salt is actually poisonous
          feedback: In normal amounts we need it to live.
        - label: The elements are only mixed in the salt
          feedback: They are chemically bound, as ions.
    hints:
      - Compare the elements with what is in the salt shaker.
    explanation: When combining the atoms give and take electrons – afterwards both are content and stable.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Which family does the element belong to?
    params:
      buckets:
        - id: b1
          label: Alkali metals
        - id: b2
          label: Halogens
        - id: b3
          label: Noble gases
      items:
        - label: Lithium
          bucket: b1
        - label: Potassium
          bucket: b1
        - label: Fluorine
          bucket: b2
        - label: Bromine
          bucket: b2
        - label: Neon
          bucket: b3
        - label: Argon
          bucket: b3
    hints:
      - "Alkali metals: group 1, far left."
      - Halogens sit just left of the noble gases.
    explanation: Group 1 has one outer electron, group 17 has seven, group 18 a full shell.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: An element of main group {{g}} forms an ion with a full outer shell. What is its charge? Give it with a sign, such as −2.
    answer:
      value: "{{q}}"
    feedback:
      - when: numval(state.input) == -q
        misconception: charge-sign
        text: "Check the sign: giving electrons away makes it positive, taking them makes it negative."
    hints:
      - Up to group 3 the atom gives electrons away, from group 5 it takes some.
      - "Group {{g}}: how many are missing to make 8 – or how many are too many?"
    explanation: Group {{g}} gives a charge of {{q}}. That is the shorter way to a full shell.
    difficulty: 2
    variants:
      params:
        g: choice[1,2,3,5,6,7]
      derive:
        q: "g <= 3 ? g : g - 8"
      defaults:
        g: 6

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: at what temperature in Celsius does the alkali metal caesium melt?"
    params:
      min: -50
      max: 200
      unit: °C
    answer:
      value: 28
      tolerance: 8
    explanation: At 28 °C – on a hot summer day it would be liquid. Going down the group, the alkali metals get ever softer.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Two rows sit at the very bottom, apart from the rest of the table. Why?
    params:
      options:
        - label: They belong inside the table – otherwise it would be far too wide
          correct: true
        - label: They are artificial and not real elements
          feedback: Many occur naturally, such as uranium.
        - label: They have no electrons
          feedback: Every atom has electrons.
    hints:
      - In them an inner shell with 14 places is being filled.
    explanation: The f orbitals hold 14 electrons. Inserted, the table would have 32 columns.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: In the alkali metals, reactivity rises going down. In the halogens it falls. Why the opposite trend?
    params:
      options:
        - label: Alkali metals give an electron away, halogens take one – and a distant nucleus holds and attracts weakly
          correct: true
        - label: Halogens get lighter going down
          feedback: They get heavier.
        - label: That is pure chance
          feedback: "Both trends have the same cause: the distance from the nucleus."
    hints:
      - What does an alkali metal want – and a halogen?
      - The further out, the weaker the nucleus grips.
    explanation: "A distant electron is easily lost: good for giving away. A foreign electron is only weakly pulled from afar: bad for taking one."
    difficulty: 3

  - kind: explain
    id: ch-x2
    depth: 3
    body: Between metals and non-metals sits a staircase of **metalloids** such as silicon. They conduct electricity only a little. That is just what makes them good for computer chips.

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Why are chlorine, bromine and iodine never found in nature as single atoms?
    params:
      options:
        - label: With seven outer electrons they react at once – at least with a partner, as in Cl₂
          correct: true
        - label: They are too heavy to float
          feedback: This has nothing to do with mass.
        - label: They decay radioactively
          feedback: The stable halogens do not decay.
    hints:
      - A halogen is missing exactly one electron.
      - Two halogen atoms can share a pair of electrons.
    explanation: In nature, halogens mostly sit in salts as halide ions, such as Cl⁻ in the sea. As elements they form two-atom molecules.
    difficulty: 3

srs:
  cards_from: [alkali, familien]
