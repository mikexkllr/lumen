id: chem.periodic.groups
type: concept
title: Familien im System
summary: Alkalimetalle, Halogene, Edelgase.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: alkali
    widget: choice
    prompt: Alkalimetalle stehen in Gruppe 1. Wie viele Elektronen haben sie außen?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "2", feedback: "Zwei hat Gruppe 2." }
        - { label: "8", feedback: "Acht hat die letzte Gruppe." }
    hints:
      - Die Gruppennummer verrät es.
    explanation: Eins – und das geben sie sehr leicht ab.

  - kind: problem
    id: familien
    widget: match
    prompt: Verbinde die Familie mit ihrem Verhalten.
    params:
      pairs:
        - { left: Alkalimetalle, right: Reagieren heftig mit Wasser }
        - { left: Halogene, right: Bilden mit Metallen Salze }
        - { left: Edelgase, right: Reagieren fast nie }
    hints:
      - Halogen heißt übersetzt Salzbildner.
    explanation: Gleiche Außenelektronen, gleiches Temperament.

  - kind: explain
    id: s3
    body: |
      Links im Periodensystem stehen die **Metalle**, rechts oben die **Nichtmetalle**. Metalle leiten Strom und glänzen, Nichtmetalle oft nicht.

  - kind: problem
    id: metall
    widget: buckets
    prompt: Metall oder Nichtmetall?
    params:
      buckets: [{ label: Metall }, { label: Nichtmetall }]
      items:
        - { label: Eisen, bucket: Metall }
        - { label: Kupfer, bucket: Metall }
        - { label: Natrium, bucket: Metall }
        - { label: Schwefel, bucket: Nichtmetall }
        - { label: Chlor, bucket: Nichtmetall }
        - { label: Sauerstoff, bucket: Nichtmetall }
    hints:
      - Leitet es Strom?
    explanation: Natrium ist ein weiches Metall – man kann es mit dem Messer schneiden.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne von links nach rechts im Periodensystem.
    params:
      items:
        - label: Natrium (Alkalimetall)
        - label: Aluminium (Metall)
        - label: Chlor (Halogen)
        - label: Argon (Edelgas)
    hints:
      - Links stehen die Metalle, ganz rechts die Edelgase.
    explanation: Alle vier stehen in derselben Zeile – von sehr reaktiv bis völlig träge.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Natrium (ein weiches Metall, das mit Wasser explodiert) und Chlor (ein giftiges Gas) ergeben zusammen Kochsalz. Was zeigt das?
    params:
      options:
        - label: Eine Verbindung hat völlig andere Eigenschaften als ihre Elemente
          correct: true
        - label: Kochsalz ist eigentlich giftig
          feedback: In normalen Mengen brauchen wir es zum Leben.
        - label: Die Elemente sind im Salz nur vermischt
          feedback: Sie sind chemisch gebunden, als Ionen.
    hints:
      - Vergleiche die Elemente mit dem, was im Salzstreuer ist.
    explanation: Beim Verbinden geben und nehmen die Atome Elektronen – danach sind beide zufrieden und stabil.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Zwei Reihen stehen ganz unten, getrennt vom Rest der Tabelle. Warum?
    params:
      options:
        - label: Sie gehören in die Tabelle hinein – sie würde sonst viel zu breit
          correct: true
        - label: Sie sind künstlich und keine echten Elemente
          feedback: Viele kommen natürlich vor, etwa Uran.
        - label: Sie haben keine Elektronen
          feedback: Jedes Atom hat Elektronen.
    hints:
      - Bei ihnen wird eine innere Schale mit 14 Plätzen aufgefüllt.
    explanation: Die f-Orbitale fassen 14 Elektronen. Eingefügt hätte die Tabelle 32 Spalten.
    difficulty: 3

srs:
  cards_from: [alkali, familien]
