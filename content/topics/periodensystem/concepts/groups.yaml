id: chem.periodic.groups
type: concept
title: Familien im System
summary: Alkalimetalle, Halogene, Edelgase.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: alkali
    widget: choice
    prompt: Alkalimetalle stehen in Gruppe 1. Wie viele Elektronen haben sie außen?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "2", feedback: "Zwei hat Gruppe 2." }
        - { label: "8", feedback: "Acht hat die letzte Gruppe." }
    hints:
      - Die Gruppennummer verrät es.
    explanation: Eins – und das geben sie sehr leicht ab.

  - kind: problem
    id: familien
    widget: match
    prompt: Verbinde die Familie mit ihrem Verhalten.
    params:
      pairs:
        - { left: Alkalimetalle, right: Reagieren heftig mit Wasser }
        - { left: Halogene, right: Bilden mit Metallen Salze }
        - { left: Edelgase, right: Reagieren fast nie }
    hints:
      - Halogen heißt übersetzt Salzbildner.
    explanation: Gleiche Außenelektronen, gleiches Temperament.

  - kind: explain
    id: s3
    body: |
      Links im Periodensystem stehen die **Metalle**, rechts oben die **Nichtmetalle**. Metalle leiten Strom und glänzen, Nichtmetalle oft nicht.

  - kind: problem
    id: metall
    widget: buckets
    prompt: Metall oder Nichtmetall?
    params:
      buckets: [{ label: Metall }, { label: Nichtmetall }]
      items:
        - { label: Eisen, bucket: Metall }
        - { label: Kupfer, bucket: Metall }
        - { label: Natrium, bucket: Metall }
        - { label: Schwefel, bucket: Nichtmetall }
        - { label: Chlor, bucket: Nichtmetall }
        - { label: Sauerstoff, bucket: Nichtmetall }
    hints:
      - Leitet es Strom?
    explanation: Natrium ist ein weiches Metall – man kann es mit dem Messer schneiden.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne von links nach rechts im Periodensystem.
    params:
      items:
        - label: Natrium (Alkalimetall)
        - label: Aluminium (Metall)
        - label: Chlor (Halogen)
        - label: Argon (Edelgas)
    hints:
      - Links stehen die Metalle, ganz rechts die Edelgase.
    explanation: Alle vier stehen in derselben Zeile – von sehr reaktiv bis völlig träge.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Natrium (ein weiches Metall, das mit Wasser explodiert) und Chlor (ein giftiges Gas) ergeben zusammen Kochsalz. Was zeigt das?
    params:
      options:
        - label: Eine Verbindung hat völlig andere Eigenschaften als ihre Elemente
          correct: true
        - label: Kochsalz ist eigentlich giftig
          feedback: In normalen Mengen brauchen wir es zum Leben.
        - label: Die Elemente sind im Salz nur vermischt
          feedback: Sie sind chemisch gebunden, als Ionen.
    hints:
      - Vergleiche die Elemente mit dem, was im Salzstreuer ist.
    explanation: Beim Verbinden geben und nehmen die Atome Elektronen – danach sind beide zufrieden und stabil.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Zu welcher Familie gehört das Element?
    params:
      buckets:
        - id: b1
          label: Alkalimetalle
        - id: b2
          label: Halogene
        - id: b3
          label: Edelgase
      items:
        - label: Lithium
          bucket: b1
        - label: Kalium
          bucket: b1
        - label: Fluor
          bucket: b2
        - label: Brom
          bucket: b2
        - label: Neon
          bucket: b3
        - label: Argon
          bucket: b3
    hints:
      - "Alkalimetalle: Gruppe 1, ganz links."
      - Halogene stehen direkt links neben den Edelgasen.
    explanation: Gruppe 1 hat ein Außenelektron, Gruppe 17 hat sieben, Gruppe 18 eine volle Schale.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Element der Hauptgruppe {{g}} bildet ein Ion mit voller Außenschale. Welche Ladung hat es? Gib sie mit Vorzeichen an, etwa −2.
    answer:
      value: "{{q}}"
    feedback:
      - when: numval(state.input) == -q
        misconception: charge-sign
        text: "Vorzeichen prüfen: Abgeben macht positiv, Aufnehmen negativ."
    hints:
      - Bis Gruppe 3 gibt das Atom Elektronen ab, ab Gruppe 5 nimmt es welche auf.
      - "Gruppe {{g}}: Wie viele fehlen bis 8 – oder wie viele sind zu viel?"
    explanation: Gruppe {{g}} ergibt die Ladung {{q}}. Das ist der kürzere Weg zur vollen Schale.
    difficulty: 2
    variants:
      params:
        g: choice[1,2,3,5,6,7]
      derive:
        q: "g <= 3 ? g : g - 8"
      defaults:
        g: 6

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Bei wie viel Grad Celsius schmilzt das Alkalimetall Cäsium?"
    params:
      min: -50
      max: 200
      unit: °C
    answer:
      value: 28
      tolerance: 8
    explanation: Bei 28 °C – an einem heißen Sommertag wäre es flüssig. Nach unten werden die Alkalimetalle immer weicher.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Zwei Reihen stehen ganz unten, getrennt vom Rest der Tabelle. Warum?
    params:
      options:
        - label: Sie gehören in die Tabelle hinein – sie würde sonst viel zu breit
          correct: true
        - label: Sie sind künstlich und keine echten Elemente
          feedback: Viele kommen natürlich vor, etwa Uran.
        - label: Sie haben keine Elektronen
          feedback: Jedes Atom hat Elektronen.
    hints:
      - Bei ihnen wird eine innere Schale mit 14 Plätzen aufgefüllt.
    explanation: Die f-Orbitale fassen 14 Elektronen. Eingefügt hätte die Tabelle 32 Spalten.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: Bei den Alkalimetallen steigt die Reaktionsfreude nach unten. Bei den Halogenen sinkt sie. Warum der Gegensatz?
    params:
      options:
        - label: Alkalimetalle geben ein Elektron ab, Halogene nehmen eins auf – und der ferne Kern hält ab und zieht an schwach
          correct: true
        - label: Halogene werden nach unten leichter
          feedback: Sie werden schwerer.
        - label: Das ist reiner Zufall
          feedback: "Beide Trends haben dieselbe Ursache: den Abstand zum Kern."
    hints:
      - Was will ein Alkalimetall – und was ein Halogen?
      - Je weiter außen, desto schwächer der Griff des Kerns.
    explanation: "Ein fernes Elektron geht leicht verloren: gut fürs Abgeben. Ein fremdes Elektron wird von fern nur schwach angezogen: schlecht fürs Aufnehmen."
    difficulty: 3

  - kind: explain
    id: ch-x2
    depth: 3
    body: Zwischen Metallen und Nichtmetallen liegt eine Treppe von **Halbmetallen** wie Silicium und Germanium. Sie leiten Strom nur ein wenig – und genau das macht sie zu Halbleitern für Computerchips.

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Warum kommen Chlor, Brom und Iod in der Natur nie als einzelne Atome vor?
    params:
      options:
        - label: Mit sieben Außenelektronen reagieren sie sofort – mindestens mit einem Partner wie in Cl₂
          correct: true
        - label: Sie sind zu schwer zum Schweben
          feedback: Mit der Masse hat das nichts zu tun.
        - label: Sie zerfallen radioaktiv
          feedback: Die stabilen Halogene zerfallen nicht.
    hints:
      - Einem Halogen fehlt genau ein Elektron.
      - Zwei Halogenatome können sich ein Elektronenpaar teilen.
    explanation: In der Natur stecken Halogene meist als Halogenid-Ionen in Salzen, etwa Cl⁻ im Meer. Als Element bilden sie Moleküle aus zwei Atomen.
    difficulty: 3

srs:
  cards_from: [alkali, familien]
