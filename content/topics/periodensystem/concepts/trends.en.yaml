id: chem.periodic.trends
type: concept
title: Patterns in the table
summary: Atom size and reactivity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Sodium and potassium sit right below each other in the periodic table. What do you expect?
    params:
      options:
        - label: They behave alike
          correct: true
        - label: They have nothing in common
          feedback: The layout has a meaning.
        - label: They are the same substance
          feedback: They are two elements.
    hints:
      - Elements of a column form a family.
    explanation: Both react violently with water. The table is full of patterns.

  - kind: explain
    id: s1
    body: |
      Going **down**, a shell is added, so atoms get bigger. Going **right**, more protons are added and pull the electrons in closer, so atoms get smaller.

  - kind: problem
    id: groesser
    widget: choice
    prompt: Sodium and chlorine are in the same row. Which atom is bigger?
    params:
      options:
        - { label: Sodium, correct: true }
        - { label: Chlorine, feedback: "Chlorine has more protons, which pull the electrons in tighter." }
        - { label: Both the same, feedback: "Same number of shells, but the pull differs in strength." }
    hints:
      - Which one is further left?
    explanation: Sodium is on the left. It has fewer protons and a looser shell.

  - kind: problem
    id: heftiger
    widget: choice
    prompt: Which reacts more violently with water, sodium or potassium below it?
    params:
      options:
        - { label: Potassium, correct: true }
        - { label: Sodium, feedback: "Further down, the outer electron sits farther away and is lost more easily." }
    hints:
      - Where does the outer electron sit farther from the nucleus?
    explanation: Potassium has one more shell. Its outer electron is held more loosely, so it reacts more wildly.

  - kind: problem
    id: sortieren
    widget: order
    prompt: Sort from large to small.
    params:
      items:
        - { label: Potassium }
        - { label: Sodium }
        - { label: Lithium }
    hints:
      - Going up, shells drop away.
    explanation: K has four shells, Na three, Li two.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Going [[down]] atoms get larger because a shell is added. Going [[right]] they get smaller.
      distractors:
        - up
        - left

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Larger or smaller than a sodium atom?
    params:
      buckets:
        - id: b1
          label: Larger
        - id: b2
          label: Smaller
      items:
        - label: Potassium (right below)
          bucket: b1
        - label: Lithium (right above)
          bucket: b2
        - label: Chlorine (further right)
          bucket: b2
        - label: Rubidium (two below)
          bucket: b1
    hints:
      - Larger going down, smaller going right.
    explanation: More shells make it large. More protons in the same shell pull it tighter.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Fluorine is the most reactive non-metal. Why?
    params:
      options:
        - label: It is small and lacks just one electron – its nucleus attracts foreign electrons especially strongly
          correct: true
        - label: It has the most protons
          feedback: Heavier elements have far more.
        - label: It is a gas
          feedback: The state does not decide – neon is a gas too and never reacts.
    hints:
      - Small atom, almost full shell.
    explanation: This pull is called **electronegativity**. Fluorine has the highest value of all elements.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Lithium has 2 shells, sodium below it has 3. How many shells does potassium have, which is right below sodium?
    answer:
      value: 4
    hints:
      - Each row down adds one shell.
    explanation: Four. The row number is the number of shells.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "The inner electrons shield the nucleus. So an outer electron feels only part of the nuclear charge. Roughly: protons minus inner electrons. This is the **effective nuclear charge**."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: An atom of period 2 or 3 has {{z}} protons. Roughly how big is the effective nuclear charge felt by its outer electrons?
    answer:
      value: "{{z - inner}}"
    feedback:
      - when: numval(state.input) == z
        misconception: no-shielding
        text: The inner electrons shield part of it. Subtract them.
    hints:
      - "Period 2: 2 inner electrons. Period 3: 10."
      - Work out {{z}} − {{inner}}.
    explanation: "{{z}} − {{inner}} = {{z - inner}}. It grows going right – which is why atoms shrink."
    difficulty: 2
    variants:
      params:
        z: int[3,18]
      derive:
        inner: "z <= 10 ? 2 : 10"
      defaults:
        z: 17

  - kind: explain
    id: ch-d3
    depth: 2
    body: "**Electronegativity** measures how strongly an atom pulls shared electrons towards itself. It rises going right and going up. Fluorine leads; caesium and francium come last."

  - kind: problem
    id: ch-d4
    depth: 2
    widget: order
    prompt: Order by electronegativity – the strongest first.
    params:
      items:
        - label: Fluorine (F)
        - label: Oxygen (O)
        - label: Nitrogen (N)
        - label: Carbon (C)
        - label: Sodium (Na)
    hints:
      - F, O, N and C share a period – further right is stronger.
      - Sodium sits far left, one row lower.
    explanation: "On the Pauling scale: F 4.0 · O 3.4 · N 3.0 · C 2.6 · Na 0.9. The bigger the gap between two partners, the more polar their bond."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The energy to remove an electron rises from lithium to neon – then drops sharply at sodium. Why?
    params:
      options:
        - label: Sodium’s outer electron sits alone on a new, more distant shell
          correct: true
        - label: Sodium has fewer protons than neon
          feedback: It has one more.
        - label: That is a measurement error
          feedback: The jump is the proof of the shells.
    hints:
      - Where does a new row of the periodic table begin?
    explanation: The **ionisation energy** makes the shell structure directly measurable.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: A Na⁺ ion is much smaller than a Na atom. Why?
    params:
      options:
        - label: Along with the electron it loses its whole outer shell
          correct: true
        - label: Positive charges are smaller
          feedback: Charge itself has no size.
        - label: It loses protons
          feedback: Ions form only through electrons.
    hints:
      - Sodium has 2, 8, 1. What is left after giving one away?
      - Now the second shell is the outer one.
    explanation: Na⁺ has 2, 8 – one shell fewer, and 11 protons now pull only 10 electrons. The radius almost halves.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: order
    prompt: O²⁻, F⁻, Na⁺ and Mg²⁺ all have 10 electrons. Order from large to small.
    params:
      items:
        - label: O²⁻ (8 protons)
        - label: F⁻ (9 protons)
        - label: Na⁺ (11 protons)
        - label: Mg²⁺ (12 protons)
    hints:
      - Same number of electrons – only the nucleus differs.
      - More protons pull the same 10 electrons closer.
    explanation: With equal numbers of electrons, the nuclear charge decides. O²⁻ is almost twice as large as Mg²⁺.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Removing lithium's first electron costs 520 kJ/mol, the second 7298 kJ/mol. How many times more energy does the second need? Round to a whole number.
    answer:
      value: 14
      tolerance: 0.5
    hints:
      - Divide 7298 by 520.
      - The second electron sits in the inner, full shell.
    explanation: About 14 times more. Jumps like this reveal where a shell ends – which is why lithium only forms Li⁺, never Li²⁺.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why atoms get smaller going right across the periodic table – even though they have more electrons.
    params:
      keywords:
        - - proton
          - kernladung
          - nuclear charge
          - kern
          - nucleus
        - - schale
          - shell
        - - zieh
          - anzieh
          - pull
          - attract
      sample: Going right, protons are added but no new shell. The nuclear charge grows and pulls the electrons in the same shell more strongly. So the atom shrinks.
    explanation: More nuclear charge with the same number of shells means smaller atoms.
    difficulty: 3

srs:
  cards_from: [groesser, heftiger]
