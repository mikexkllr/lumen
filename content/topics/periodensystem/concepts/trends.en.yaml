id: chem.periodic.trends
type: concept
title: Patterns in the table
summary: Atom size and reactivity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Sodium and potassium sit right below each other in the periodic table. What do you expect?
    params:
      options:
        - label: They behave alike
          correct: true
        - label: They have nothing in common
          feedback: The layout has a meaning.
        - label: They are the same substance
          feedback: They are two elements.
    hints:
      - Elements of a column form a family.
    explanation: Both react violently with water. The table is full of patterns.

  - kind: explain
    id: s1
    body: |
      Going **down**, a shell is added, so atoms get bigger. Going **right**, more protons are added and pull the electrons in closer, so atoms get smaller.

  - kind: problem
    id: groesser
    widget: choice
    prompt: Sodium and chlorine are in the same row. Which atom is bigger?
    params:
      options:
        - { label: Sodium, correct: true }
        - { label: Chlorine, feedback: "Chlorine has more protons, which pull the electrons in tighter." }
        - { label: Both the same, feedback: "Same number of shells, but the pull differs in strength." }
    hints:
      - Which one is further left?
    explanation: Sodium is on the left. It has fewer protons and a looser shell.

  - kind: problem
    id: heftiger
    widget: choice
    prompt: Which reacts more violently with water, sodium or potassium below it?
    params:
      options:
        - { label: Potassium, correct: true }
        - { label: Sodium, feedback: "Further down, the outer electron sits farther away and is lost more easily." }
    hints:
      - Where does the outer electron sit farther from the nucleus?
    explanation: Potassium has one more shell. Its outer electron is held more loosely, so it reacts more wildly.

  - kind: problem
    id: sortieren
    widget: order
    prompt: Sort from large to small.
    params:
      items:
        - { label: Potassium }
        - { label: Sodium }
        - { label: Lithium }
    hints:
      - Going up, shells drop away.
    explanation: K has four shells, Na three, Li two.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Fluorine is the most reactive non-metal. Why?
    params:
      options:
        - label: It is small and lacks just one electron – its nucleus attracts foreign electrons especially strongly
          correct: true
        - label: It has the most protons
          feedback: Heavier elements have far more.
        - label: It is a gas
          feedback: The state does not decide – neon is a gas too and never reacts.
    hints:
      - Small atom, almost full shell.
    explanation: This pull is called **electronegativity**. Fluorine has the highest value of all elements.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The energy to remove an electron rises from lithium to neon – then drops sharply at sodium. Why?
    params:
      options:
        - label: Sodium’s outer electron sits alone on a new, more distant shell
          correct: true
        - label: Sodium has fewer protons than neon
          feedback: It has one more.
        - label: That is a measurement error
          feedback: The jump is the proof of the shells.
    hints:
      - Where does a new row of the periodic table begin?
    explanation: The **ionisation energy** makes the shell structure directly measurable.
    difficulty: 3

srs:
  cards_from: [groesser, heftiger]
