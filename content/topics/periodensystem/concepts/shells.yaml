id: chem.periodic.shells
type: concept
title: Elektronenschalen
summary: Die äußeren Elektronen machen die Chemie.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Im Kino füllen sich die besten Reihen zuerst. Wo nehmen Elektronen im Atom zuerst Platz?
    params:
      options:
        - label: Ganz innen, nah am Kern
          correct: true
        - label: Ganz außen
          feedback: Außen ist die Energie höher.
        - label: Zufällig verteilt
          feedback: Es gibt eine feste Ordnung.
    hints:
      - Der Kern zieht die Elektronen an.
    explanation: Erst innen, dann außen – Schale für Schale.

  - kind: explain
    id: s1
    body: |
      Elektronen sitzen in **Schalen**. In die erste passen 2, in die zweite 8, in die dritte zunächst wieder 8. Jede **Zeile** des Periodensystems beginnt eine neue Schale.

  - kind: problem
    id: natrium
    widget: numeric
    prompt: Natrium hat 11 Elektronen. Wie viele sitzen auf der äußersten Schale?
    params: { unit: Elektronen }
    answer: { value: 1 }
    hints:
      - Erst 2, dann 8 – wie viele bleiben übrig?
    explanation: 2 + 8 + 1 – ein einsames Elektron außen.

  - kind: problem
    id: aussen
    widget: numeric
    prompt: Ein Atom hat {{z}} Elektronen. Wie viele davon sind Außenelektronen?
    params: { unit: Elektronen }
    answer: { value: "{{z - 2}}" }
    feedback:
      - when: "numval(state.input) == z"
        misconception: all-electrons
        text: Die ersten zwei sitzen innen auf der ersten Schale.
    hints:
      - Die erste Schale fasst 2.
    explanation: "{{z}} − 2 = {{z - 2}} Außenelektronen."
    variants:
      params: { z: "int[4,10]" }
      defaults: { z: 8 }

  - kind: problem
    id: edelgase
    widget: choice
    prompt: Helium, Neon und Argon reagieren fast nie. Warum?
    params:
      options:
        - { label: Ihre äußere Schale ist voll., correct: true }
        - { label: Sie sind sehr schwer., feedback: "Helium ist das zweitleichteste Element." }
        - { label: Sie sind sehr selten., feedback: "Argon macht fast 1 % der Luft aus." }
    hints:
      - Was wollen Atome mit ihrer äußeren Schale erreichen?
    explanation: Eine volle Außenschale ist besonders stabil – darum heißen sie **Edelgase**.

  - kind: problem
    id: c1
    widget: match
    prompt: Wie viele Außenelektronen hat das Atom?
    params:
      pairs:
        - left: Lithium (3)
          right: "1"
        - left: Kohlenstoff (6)
          right: "4"
        - left: Sauerstoff (8)
          right: "6"
        - left: Fluor (9)
          right: "7"
        - left: Neon (10)
          right: "8"
    hints:
      - Zieh die 2 Elektronen der ersten Schale ab.
    explanation: Die Außenelektronen bestimmen fast die ganze Chemie.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Chlor hat 17 Elektronen. Wie viele sitzen auf der **dritten** Schale?
    answer:
      value: 7
    hints:
      - 2 auf der ersten, 8 auf der zweiten.
    explanation: 17 − 10 = 7. Ein Elektron fehlt bis zur vollen Achterschale.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: tiles
    prompt: Schwefel hat 16 Elektronen. Lege die Besetzung der Schalen von innen nach außen.
    params:
      tiles:
        - "1"
        - "2"
        - "4"
        - "6"
        - "7"
        - "8"
        - "10"
      slots: 3
    answer:
      sequence:
        - "2"
        - "8"
        - "6"
    hints:
      - Die erste Schale fasst 2, die zweite 8.
      - "Was bleibt für die dritte: 16 − 2 − 8?"
    explanation: 2, 8, 6. Mit 6 Außenelektronen steht Schwefel in der 6. Hauptgruppe – unter Sauerstoff (2, 6).
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Element der 2. oder 3. Periode steht in Hauptgruppe {{g}}. Wie viele Außenelektronen hat es?
    answer:
      value: "{{g}}"
    hints:
      - Die Hauptgruppen-Nummer ist kein Zufall.
      - "Gruppe 1: ein Außenelektron, Gruppe 2: zwei …"
    explanation: Hauptgruppe {{g}} heißt {{g}} Außenelektronen. Darum ähneln sich Elemente einer Spalte.
    difficulty: 2
    variants:
      params:
        g: int[1,8]
      defaults:
        g: 5

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Wie viele Elektronen passen nach der Regel $2n^2$ in die 4. Schale?
    answer:
      value: 32
    feedback:
      - when: numval(state.input) == 16
        misconception: order-of-operations
        text: "Erst quadrieren, dann verdoppeln: 4² = 16, mal 2."
      - when: numval(state.input) == 64
        misconception: order-of-operations
        text: Nur n wird quadriert, nicht 2n.
    hints:
      - Setze n = 4 ein.
      - 2 · 4 · 4.
    explanation: 2 · 16 = 32. Die Schalen fassen 2, 8, 18, 32 – darum sind manche Perioden so lang.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Schalen fassen höchstens 2, 8, 18, 32 Elektronen. Welche Formel steckt dahinter?
    params:
      options:
        - label: $2n^2$
          correct: true
        - label: $8n$
          feedback: Das gäbe 8, 16, 24.
        - label: $2^n$
          feedback: Das gäbe 2, 4, 8, 16.
    hints:
      - Probier n = 1, 2, 3, 4.
    explanation: Die Quantenmechanik erlaubt n² Zustände pro Schale, je zweimal besetzbar (Spin).
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Jede Schale besteht aus **Unterschalen**: s fasst 2, p fasst 6, d fasst 10, f fasst 14 Elektronen. Die Unterschalen füllen sich nach ihrer Energie – nicht streng Schale für Schale."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Die dritte Schale fasst eigentlich 18 Elektronen. Trotzdem hat Kalium (19) die Besetzung 2, 8, 8, 1. Warum?
    params:
      options:
        - label: Die 4s-Unterschale liegt energetisch tiefer als 3d und füllt sich zuerst
          correct: true
        - label: Die dritte Schale ist kaputt
          feedback: Sie ist nur noch nicht dran.
        - label: Kalium hat nur 18 Elektronen
          feedback: Kalium hat 19 Protonen und neutral 19 Elektronen.
    hints:
      - Es kommt auf die Energie der Unterschalen an.
      - Erst nach Calcium (20) beginnt die 3d-Unterschale.
    explanation: Erst ab Scandium (21) füllt sich 3d. Diese zehn Plätze sind die zehn Spalten der Übergangsmetalle.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Die f-Unterschale fasst 14 Elektronen. Wie viele Elemente stehen darum in einer der beiden Reihen ganz unten im Periodensystem?
    answer:
      value: 14
    hints:
      - Jedes neue Element bringt ein Elektron mehr.
      - Ein Platz pro Elektron in der Unterschale.
    explanation: "Die Lanthanoide und Actinoide füllen je eine f-Unterschale: 14 Elemente. Darum sind die beiden Reihen so lang."
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: match
    prompt: Welcher Block des Periodensystems füllt welche Unterschale?
    params:
      pairs:
        - left: Gruppen 1 und 2
          right: s (2 Plätze)
        - left: Gruppen 13 bis 18
          right: p (6 Plätze)
        - left: Übergangsmetalle
          right: d (10 Plätze)
        - left: Lanthanoide, Actinoide
          right: f (14 Plätze)
    hints:
      - Zähle die Spalten jedes Blocks.
      - Rechts gibt es sechs Hauptgruppen-Spalten.
    explanation: Die Breite jedes Blocks ist die Zahl der Plätze seiner Unterschale. Die Form der Tabelle ist Quantenphysik zum Anfassen.
    difficulty: 3

srs:
  cards_from: [aussen, edelgase]
