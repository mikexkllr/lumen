id: chem.periodic.trends
type: concept
title: Muster im System
summary: Atomgröße und Reaktionsfreude.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Natrium und Kalium stehen im Periodensystem direkt untereinander. Was erwartest du?
    params:
      options:
        - label: Sie verhalten sich ähnlich
          correct: true
        - label: Sie haben nichts gemeinsam
          feedback: Die Anordnung hat einen Sinn.
        - label: Sie sind derselbe Stoff
          feedback: Es sind zwei Elemente.
    hints:
      - Elemente einer Spalte bilden eine Familie.
    explanation: Beide reagieren heftig mit Wasser. Das System steckt voller Muster.

  - kind: explain
    id: s1
    body: |
      Nach **unten** kommt eine Schale dazu – die Atome werden größer. Nach **rechts** kommen mehr Protonen dazu, die die Elektronen enger heranziehen – die Atome werden kleiner.

  - kind: problem
    id: groesser
    widget: choice
    prompt: Natrium und Chlor stehen in derselben Zeile. Welches Atom ist größer?
    params:
      options:
        - { label: Natrium, correct: true }
        - { label: Chlor, feedback: "Chlor hat mehr Protonen, die die Elektronen enger ziehen." }
        - { label: Beide gleich, feedback: "Gleiche Schalenzahl, aber unterschiedlich starke Anziehung." }
    hints:
      - Wer steht weiter links?
    explanation: Natrium steht links – weniger Protonen, lockere Hülle.

  - kind: problem
    id: heftiger
    widget: choice
    prompt: Wer reagiert heftiger mit Wasser – Natrium oder Kalium darunter?
    params:
      options:
        - { label: Kalium, correct: true }
        - { label: Natrium, feedback: "Weiter unten sitzt das Außenelektron weiter weg – es geht leichter verloren." }
    hints:
      - Wo sitzt das Außenelektron weiter vom Kern entfernt?
    explanation: Kalium hat eine Schale mehr. Sein Außenelektron hält schlechter – es reagiert wilder.

  - kind: problem
    id: sortieren
    widget: order
    prompt: Ordne von groß nach klein.
    params:
      items:
        - { label: Kalium }
        - { label: Natrium }
        - { label: Lithium }
    hints:
      - Nach oben fallen Schalen weg.
    explanation: K hat vier Schalen, Na drei, Li zwei.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Nach [[unten]] werden Atome größer, weil eine Schale dazukommt. Nach [[rechts]] werden sie kleiner.
      distractors:
        - oben
        - links

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Größer oder kleiner als ein Natrium-Atom?
    params:
      buckets:
        - id: b1
          label: Größer
        - id: b2
          label: Kleiner
      items:
        - label: Kalium (direkt darunter)
          bucket: b1
        - label: Lithium (direkt darüber)
          bucket: b2
        - label: Chlor (weiter rechts)
          bucket: b2
        - label: Rubidium (zwei darunter)
          bucket: b1
    hints:
      - Nach unten größer, nach rechts kleiner.
    explanation: Mehr Schalen machen groß. Mehr Protonen bei gleicher Schale ziehen enger zusammen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Fluor ist das reaktivste Nichtmetall. Warum?
    params:
      options:
        - label: Es ist klein und es fehlt ihm nur ein Elektron – der Kern zieht fremde Elektronen besonders stark an
          correct: true
        - label: Es hat die meisten Protonen
          feedback: Schwerere Elemente haben viel mehr.
        - label: Es ist ein Gas
          feedback: Der Zustand entscheidet nicht – auch Neon ist ein Gas und reagiert nie.
    hints:
      - Kleines Atom, fast volle Schale.
    explanation: Diese Anziehungskraft heißt **Elektronegativität**. Fluor hat den höchsten Wert aller Elemente.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Lithium hat 2 Schalen, Natrium darunter hat 3. Wie viele Schalen hat Kalium, das direkt unter Natrium steht?
    answer:
      value: 4
    hints:
      - Jede Zeile nach unten bringt eine Schale dazu.
    explanation: Vier. Die Zeilennummer ist die Zahl der Schalen.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "Die inneren Elektronen schirmen den Kern ab. Ein Außenelektron spürt darum nur einen Teil der Kernladung. Grob gilt: Protonen minus innere Elektronen. Das ist die **effektive Kernladung**."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Atom der 2. oder 3. Periode hat {{z}} Protonen. Wie groß ist grob die effektive Kernladung für seine Außenelektronen?
    answer:
      value: "{{z - inner}}"
    feedback:
      - when: numval(state.input) == z
        misconception: no-shielding
        text: Die inneren Elektronen schirmen einen Teil ab. Zieh sie ab.
    hints:
      - "Periode 2: 2 innere Elektronen. Periode 3: 10."
      - Rechne {{z}} − {{inner}}.
    explanation: "{{z}} − {{inner}} = {{z - inner}}. Nach rechts wächst dieser Wert – darum schrumpfen die Atome."
    difficulty: 2
    variants:
      params:
        z: int[3,18]
      derive:
        inner: "z <= 10 ? 2 : 10"
      defaults:
        z: 17

  - kind: explain
    id: ch-d3
    depth: 2
    body: Die **Elektronegativität** misst, wie stark ein Atom geteilte Elektronen zu sich zieht. Sie steigt nach rechts und nach oben. Spitzenreiter ist Fluor, Schlusslichter sind Cäsium und Francium.

  - kind: problem
    id: ch-d4
    depth: 2
    widget: order
    prompt: Ordne nach Elektronegativität – die stärkste zuerst.
    params:
      items:
        - label: Fluor (F)
        - label: Sauerstoff (O)
        - label: Stickstoff (N)
        - label: Kohlenstoff (C)
        - label: Natrium (Na)
    hints:
      - F, O, N und C stehen in derselben Periode – rechts ist stärker.
      - Natrium steht ganz links eine Zeile tiefer.
    explanation: "Nach Pauling: F 4,0 · O 3,4 · N 3,0 · C 2,6 · Na 0,9. Je größer der Unterschied zweier Partner, desto polarer ihre Bindung."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Energie, um ein Elektron zu entfernen, steigt von Lithium bis Neon – fällt dann bei Natrium plötzlich stark ab. Warum?
    params:
      options:
        - label: Natriums Außenelektron sitzt allein auf einer neuen, weiter entfernten Schale
          correct: true
        - label: Natrium hat weniger Protonen als Neon
          feedback: Es hat eins mehr.
        - label: Das ist ein Messfehler
          feedback: Der Sprung ist der Beweis für die Schalen.
    hints:
      - Wo beginnt eine neue Zeile im Periodensystem?
    explanation: Die **Ionisierungsenergie** macht die Schalenstruktur direkt messbar.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: choice
    prompt: Ein Na⁺-Ion ist viel kleiner als ein Na-Atom. Warum?
    params:
      options:
        - label: Mit dem Elektron verliert es die ganze äußere Schale
          correct: true
        - label: Plusladungen sind kleiner
          feedback: Ladung hat an sich keine Größe.
        - label: Es verliert Protonen
          feedback: Ionen entstehen nur durch Elektronen.
    hints:
      - Natrium hat 2, 8, 1. Was bleibt nach Abgabe?
      - Jetzt ist die zweite Schale außen.
    explanation: Na⁺ hat 2, 8 – eine Schale weniger, und 11 Protonen ziehen nur noch 10 Elektronen. Der Radius halbiert sich fast.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: order
    prompt: O²⁻, F⁻, Na⁺ und Mg²⁺ haben alle 10 Elektronen. Ordne von groß nach klein.
    params:
      items:
        - label: O²⁻ (8 Protonen)
        - label: F⁻ (9 Protonen)
        - label: Na⁺ (11 Protonen)
        - label: Mg²⁺ (12 Protonen)
    hints:
      - Gleiche Elektronenzahl – nur der Kern ist verschieden.
      - Mehr Protonen ziehen die gleichen 10 Elektronen enger heran.
    explanation: Bei gleich vielen Elektronen entscheidet die Kernladung. O²⁻ ist fast doppelt so groß wie Mg²⁺.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: Das erste Elektron von Lithium abzulösen kostet 520 kJ/mol, das zweite 7298 kJ/mol. Wievielmal mehr Energie braucht das zweite? Auf ganze Zahlen.
    answer:
      value: 14
      tolerance: 0.5
    hints:
      - Teile 7298 durch 520.
      - Das zweite Elektron sitzt in der inneren, vollen Schale.
    explanation: Etwa 14-mal mehr. Solche Sprünge verraten, wo eine Schale endet – darum bildet Lithium nur Li⁺, nie Li²⁺.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Atome nach rechts im Periodensystem kleiner werden – obwohl sie mehr Elektronen haben.
    params:
      keywords:
        - - proton
          - kernladung
          - nuclear charge
          - kern
          - nucleus
        - - schale
          - shell
        - - zieh
          - anzieh
          - pull
          - attract
      sample: Nach rechts kommen Protonen dazu, aber keine neue Schale. Die Kernladung wird größer und zieht die Elektronen auf derselben Schale stärker an. Darum schrumpft das Atom.
    explanation: Mehr Kernladung bei gleicher Schalenzahl heißt kleinere Atome.
    difficulty: 3

srs:
  cards_from: [groesser, heftiger]
