id: chem.periodic.trends
type: concept
title: Muster im System
summary: Atomgröße und Reaktionsfreude.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Nach **unten** kommt eine Schale dazu – die Atome werden größer. Nach **rechts** kommen mehr Protonen dazu, die die Elektronen enger heranziehen – die Atome werden kleiner.

  - kind: problem
    id: groesser
    widget: choice
    prompt: Natrium und Chlor stehen in derselben Zeile. Welches Atom ist größer?
    params:
      options:
        - { label: Natrium, correct: true }
        - { label: Chlor, feedback: "Chlor hat mehr Protonen, die die Elektronen enger ziehen." }
        - { label: Beide gleich, feedback: "Gleiche Schalenzahl, aber unterschiedlich starke Anziehung." }
    hints:
      - Wer steht weiter links?
    explanation: Natrium steht links – weniger Protonen, lockere Hülle.

  - kind: problem
    id: heftiger
    widget: choice
    prompt: Wer reagiert heftiger mit Wasser – Natrium oder Kalium darunter?
    params:
      options:
        - { label: Kalium, correct: true }
        - { label: Natrium, feedback: "Weiter unten sitzt das Außenelektron weiter weg – es geht leichter verloren." }
    hints:
      - Wo sitzt das Außenelektron weiter vom Kern entfernt?
    explanation: Kalium hat eine Schale mehr. Sein Außenelektron hält schlechter – es reagiert wilder.

  - kind: problem
    id: sortieren
    widget: order
    prompt: Ordne von groß nach klein.
    params:
      items:
        - { label: Kalium }
        - { label: Natrium }
        - { label: Lithium }
    hints:
      - Nach oben fallen Schalen weg.
    explanation: K hat vier Schalen, Na drei, Li zwei.

srs:
  cards_from: [groesser, heftiger]
