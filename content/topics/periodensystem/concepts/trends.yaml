id: chem.periodic.trends
type: concept
title: Muster im System
summary: Atomgröße und Reaktionsfreude.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Natrium und Kalium stehen im Periodensystem direkt untereinander. Was erwartest du?
    params:
      options:
        - label: Sie verhalten sich ähnlich
          correct: true
        - label: Sie haben nichts gemeinsam
          feedback: Die Anordnung hat einen Sinn.
        - label: Sie sind derselbe Stoff
          feedback: Es sind zwei Elemente.
    hints:
      - Elemente einer Spalte bilden eine Familie.
    explanation: Beide reagieren heftig mit Wasser. Das System steckt voller Muster.

  - kind: explain
    id: s1
    body: |
      Nach **unten** kommt eine Schale dazu – die Atome werden größer. Nach **rechts** kommen mehr Protonen dazu, die die Elektronen enger heranziehen – die Atome werden kleiner.

  - kind: problem
    id: groesser
    widget: choice
    prompt: Natrium und Chlor stehen in derselben Zeile. Welches Atom ist größer?
    params:
      options:
        - { label: Natrium, correct: true }
        - { label: Chlor, feedback: "Chlor hat mehr Protonen, die die Elektronen enger ziehen." }
        - { label: Beide gleich, feedback: "Gleiche Schalenzahl, aber unterschiedlich starke Anziehung." }
    hints:
      - Wer steht weiter links?
    explanation: Natrium steht links – weniger Protonen, lockere Hülle.

  - kind: problem
    id: heftiger
    widget: choice
    prompt: Wer reagiert heftiger mit Wasser – Natrium oder Kalium darunter?
    params:
      options:
        - { label: Kalium, correct: true }
        - { label: Natrium, feedback: "Weiter unten sitzt das Außenelektron weiter weg – es geht leichter verloren." }
    hints:
      - Wo sitzt das Außenelektron weiter vom Kern entfernt?
    explanation: Kalium hat eine Schale mehr. Sein Außenelektron hält schlechter – es reagiert wilder.

  - kind: problem
    id: sortieren
    widget: order
    prompt: Ordne von groß nach klein.
    params:
      items:
        - { label: Kalium }
        - { label: Natrium }
        - { label: Lithium }
    hints:
      - Nach oben fallen Schalen weg.
    explanation: K hat vier Schalen, Na drei, Li zwei.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Fluor ist das reaktivste Nichtmetall. Warum?
    params:
      options:
        - label: Es ist klein und es fehlt ihm nur ein Elektron – der Kern zieht fremde Elektronen besonders stark an
          correct: true
        - label: Es hat die meisten Protonen
          feedback: Schwerere Elemente haben viel mehr.
        - label: Es ist ein Gas
          feedback: Der Zustand entscheidet nicht – auch Neon ist ein Gas und reagiert nie.
    hints:
      - Kleines Atom, fast volle Schale.
    explanation: Diese Anziehungskraft heißt **Elektronegativität**. Fluor hat den höchsten Wert aller Elemente.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Energie, um ein Elektron zu entfernen, steigt von Lithium bis Neon – fällt dann bei Natrium plötzlich stark ab. Warum?
    params:
      options:
        - label: Natriums Außenelektron sitzt allein auf einer neuen, weiter entfernten Schale
          correct: true
        - label: Natrium hat weniger Protonen als Neon
          feedback: Es hat eins mehr.
        - label: Das ist ein Messfehler
          feedback: Der Sprung ist der Beweis für die Schalen.
    hints:
      - Wo beginnt eine neue Zeile im Periodensystem?
    explanation: Die **Ionisierungsenergie** macht die Schalenstruktur direkt messbar.
    difficulty: 3

srs:
  cards_from: [groesser, heftiger]
