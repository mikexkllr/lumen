id: chem.periodic.shells
type: concept
title: Electron shells
summary: The outer electrons make the chemistry.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In a cinema the best rows fill first. Where do electrons in an atom take their seats first?
    params:
      options:
        - label: Right inside, close to the nucleus
          correct: true
        - label: Right outside
          feedback: Outside the energy is higher.
        - label: Spread at random
          feedback: There is a fixed order.
    hints:
      - The nucleus attracts the electrons.
    explanation: First inside, then outside – shell by shell.

  - kind: explain
    id: s1
    body: |
      Electrons sit in **shells**. The first holds 2, the second 8, and the third at first 8 again. Each **row** of the periodic table starts a new shell.

  - kind: problem
    id: natrium
    widget: numeric
    prompt: Sodium has 11 electrons. How many sit in the outermost shell?
    params: { unit: electrons }
    answer: { value: 1 }
    hints:
      - First 2, then 8. How many are left over?
    explanation: 2 + 8 + 1. One lone electron on the outside.

  - kind: problem
    id: aussen
    widget: numeric
    prompt: An atom has {{z}} electrons. How many of them are outer electrons?
    params: { unit: electrons }
    answer: { value: "{{z - 2}}" }
    feedback:
      - when: "numval(state.input) == z"
        misconception: all-electrons
        text: The first two sit inside, in the first shell.
    hints:
      - The first shell holds 2.
    explanation: "{{z}} − 2 = {{z - 2}} outer electrons."
    variants:
      params: { z: "int[4,10]" }
      defaults: { z: 8 }

  - kind: problem
    id: edelgase
    widget: choice
    prompt: Helium, neon and argon almost never react. Why?
    params:
      options:
        - { label: Their outer shell is full., correct: true }
        - { label: They are very heavy., feedback: "Helium is the second-lightest element." }
        - { label: They are very rare., feedback: "Argon makes up almost 1 % of the air." }
    hints:
      - What do atoms want to achieve with their outer shell?
    explanation: A full outer shell is especially stable. That is why they are called **noble gases**.

  - kind: problem
    id: c1
    widget: match
    prompt: How many outer electrons does the atom have?
    params:
      pairs:
        - left: Lithium (3)
          right: "1"
        - left: Carbon (6)
          right: "4"
        - left: Oxygen (8)
          right: "6"
        - left: Fluorine (9)
          right: "7"
        - left: Neon (10)
          right: "8"
    hints:
      - Subtract the 2 electrons of the first shell.
    explanation: The outer electrons determine almost all of the chemistry.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Chlorine has 17 electrons. How many sit on the **third** shell?
    answer:
      value: 7
    hints:
      - 2 on the first, 8 on the second.
    explanation: 17 − 10 = 7. One electron is missing for a full shell of eight.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The shells hold at most 2, 8, 18, 32 electrons. Which formula is behind that?
    params:
      options:
        - label: $2n^2$
          correct: true
        - label: $8n$
          feedback: That would give 8, 16, 24.
        - label: $2^n$
          feedback: That would give 2, 4, 8, 16.
    hints:
      - Try n = 1, 2, 3, 4.
    explanation: Quantum mechanics allows n² states per shell, each occupiable twice (spin).
    difficulty: 3

srs:
  cards_from: [aussen, edelgase]
