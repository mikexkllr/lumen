id: sci.entropy.counting
type: concept
title: Unordnung zählen
summary: Warum sich Gase von selbst verteilen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: moeglichkeiten
    widget: numeric
    prompt: Vier Gasteilchen sind in einer Box, jedes zufällig links oder rechts. Wie viele mögliche Verteilungen gibt es?
    params: { unit: Möglichkeiten }
    answer: { value: 16 }
    hints:
      - Jedes Teilchen hat 2 Möglichkeiten.
    explanation: $2^4 = 16$ – nur eine davon hat alle Teilchen links.

  - kind: problem
    id: simulation
    widget: distribution
    prompt: Lass die Teilchen mindestens 100-mal zufällig verteilen. Wie oft sind alle links?
    params:
      items: [{ label: alle links, weight: 1 }, { label: gemischt, weight: 14 }, { label: alle rechts, weight: 1 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Viele Durchgänge auf einmal.
    explanation: Gemischt kommt viel häufiger vor – es gibt einfach viel mehr Möglichkeiten dafür.

  - kind: explain
    id: s3
    body: |
      **Entropie** misst, wie viele Mikro-Anordnungen zu einem Zustand passen. Gemischt hat unvorstellbar viele, geordnet sehr wenige. Darum wird Unordnung von allein größer – nicht durch eine Kraft, sondern durch Wahrscheinlichkeit.

  - kind: problem
    id: zehn
    widget: numeric
    prompt: Bei {{n}} Teilchen – in wie vielen von allen Verteilungen sind alle links? Gib den Nenner an, also »1 von …«.
    params: { placeholder: "Anzahl" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - "Jedes Teilchen halbiert die Chance."
    explanation: "1 von $2^{ {{n}} } = {{2 ** n}}$ – bei Milliarden Teilchen praktisch unmöglich."
    variants:
      params: { n: "int[6,12]" }
      defaults: { n: 10 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein gemischtes Kartenspiel hat mehr Entropie als ein sortiertes.
          right: true
        - text: Unordnung nimmt von allein nie zu.
          right: false
          why: Genau das tut sie – es gibt viel mehr ungeordnete als geordnete Zustände.
        - text: Dass sich alle Luft im Zimmer in einer Ecke sammelt, ist möglich, aber unvorstellbar unwahrscheinlich.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Vier Teilchen, jedes links oder rechts. Wie viele der 16 Verteilungen haben genau **zwei links und zwei rechts**?
    answer:
      value: 6
    hints:
      - Wähle 2 aus 4.
    explanation: 6 von 16. Die gleichmäßige Verteilung ist am wahrscheinlichsten – bei vielen Teilchen überwältigend.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Boltzmanns Formel: $S = k \\cdot \\ln W$ mit W = Zahl der Mikrozustände. Verdoppelt man die Teilchenzahl, wird aus W das Quadrat W². Wievielmal so groß wird die Entropie?"
    answer:
      value: 2
    hints:
      - ln(W²) = 2 · ln W.
    explanation: "Doppelt so groß. Der Logarithmus macht Entropie **additiv**: zwei Liter Gas haben doppelt so viel wie einer."
    difficulty: 3

srs:
  cards_from: [moeglichkeiten, zehn]
