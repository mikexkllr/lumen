id: sci.entropy.counting
type: concept
title: Unordnung zählen
summary: Warum sich Gase von selbst verteilen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: moeglichkeiten
    widget: numeric
    prompt: Vier Gasteilchen sind in einer Box, jedes zufällig links oder rechts. Wie viele mögliche Verteilungen gibt es?
    params: { unit: Möglichkeiten }
    answer: { value: 16 }
    hints:
      - Jedes Teilchen hat 2 Möglichkeiten.
    explanation: $2^4 = 16$ – nur eine davon hat alle Teilchen links.

  - kind: problem
    id: simulation
    widget: distribution
    prompt: Lass die Teilchen mindestens 100-mal zufällig verteilen. Wie oft sind alle links?
    params:
      items: [{ label: alle links, weight: 1 }, { label: gemischt, weight: 14 }, { label: alle rechts, weight: 1 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Viele Durchgänge auf einmal.
    explanation: Gemischt kommt viel häufiger vor – es gibt einfach viel mehr Möglichkeiten dafür.

  - kind: explain
    id: s3
    body: |
      **Entropie** misst, wie viele Mikro-Anordnungen zu einem Zustand passen. Gemischt hat unvorstellbar viele, geordnet sehr wenige. Darum wird Unordnung von allein größer – nicht durch eine Kraft, sondern durch Wahrscheinlichkeit.

  - kind: problem
    id: zehn
    widget: numeric
    prompt: Bei {{n}} Teilchen – in wie vielen von allen Verteilungen sind alle links? Gib den Nenner an, also »1 von …«.
    params: { placeholder: "Anzahl" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - "Jedes Teilchen halbiert die Chance."
    explanation: "1 von $2^{ {{n}} } = {{2 ** n}}$ – bei Milliarden Teilchen praktisch unmöglich."
    variants:
      params: { n: "int[6,12]" }
      defaults: { n: 10 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein gemischtes Kartenspiel hat mehr Entropie als ein sortiertes.
          right: true
        - text: Unordnung nimmt von allein nie zu.
          right: false
          why: Genau das tut sie – es gibt viel mehr ungeordnete als geordnete Zustände.
        - text: Dass sich alle Luft im Zimmer in einer Ecke sammelt, ist möglich, aber unvorstellbar unwahrscheinlich.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Vier Teilchen, jedes links oder rechts. Wie viele der 16 Verteilungen haben genau **zwei links und zwei rechts**?
    answer:
      value: 6
    hints:
      - Wähle 2 aus 4.
    explanation: 6 von 16. Die gleichmäßige Verteilung ist am wahrscheinlichsten – bei vielen Teilchen überwältigend.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "{{n}} Teilchen, jedes links oder rechts. In wie vielen Verteilungen sind genau die Hälfte links?"
    answer:
      value: "{{n == 4 ? 6 : (n == 6 ? 20 : 70)}}"
    feedback:
      - when: numval(state.input) == 2 ** n
        misconception: all-states
        text: Das sind **alle** Verteilungen. Gefragt sind nur die mit genau halb-halb.
    hints:
      - Wie viele Arten gibt es, {{n / 2}} von {{n}} Teilchen auszuwählen?
      - Das ist der Binomialkoeffizient »{{n}} über {{n / 2}}«.
    explanation: Halb-halb ist der häufigste Einzelfall. Mit wachsendem n wird er im Vergleich zu »alle links« (nur 1 Möglichkeit) immer übermächtiger.
    difficulty: 2
    variants:
      params:
        n: choice[4,6,8]
      defaults:
        n: 6

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Du wirfst 100 Münzen. Wie wahrscheinlich ist es, genau 50-mal Kopf zu bekommen – in Prozent?"
    params:
      min: 0
      max: 100
    answer:
      value: 8
      tolerance: 3
    explanation: "Nur etwa 8 %. Aber fast immer landet man nah bei 50: Zwischen 40 und 60 Köpfen liegen rund 96 % aller Würfe. Das Mittelfeld hat die meisten Mikrozustände."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Boltzmanns Formel: $S = k \\cdot \\ln W$ mit W = Zahl der Mikrozustände. Verdoppelt man die Teilchenzahl, wird aus W das Quadrat W². Wievielmal so groß wird die Entropie?"
    answer:
      value: 2
    hints:
      - ln(W²) = 2 · ln W.
    explanation: "Doppelt so groß. Der Logarithmus macht Entropie **additiv**: zwei Liter Gas haben doppelt so viel wie einer."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Boltzmann verband Zählen und Wärme: $S = k \\ln W$. Der **Logarithmus** macht aus dem Malnehmen ein Addieren: Zwei Systeme haben zusammen $W_1 \\cdot W_2$ Zustände und die Entropie $S_1 + S_2$."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Ein Mol Teilchen (6 · 10²³), jedes mit zwei Möglichkeiten: W = 2 hoch 6 · 10²³. Wie groß ist S = k · ln W = N · k · ln 2 – in J/K? k = 1,38 · 10⁻²³ J/K. Auf eine Stelle."
    params:
      unit: J/K
    answer:
      value: 5.7
      tolerance: 0.1
    hints:
      - N · k = 6 · 10²³ · 1,38 · 10⁻²³ ≈ 8,3 J/K.
      - Mal ln 2 ≈ 0,693.
    explanation: S ≈ 5,7 J/K. Eine unvorstellbar große Zahl von Zuständen ergibt eine ganz handliche Entropie – genau dafür sorgt der Logarithmus.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Auf wie viele Arten kann man 52 Spielkarten anordnen?"
    params:
      min: 10000000000
      max: 1e+100
      scale: log
    answer:
      value: 8e+67
      within: 80
    explanation: 52! ≈ 8 · 10⁶⁷ – mehr als Atome in unserer Galaxie. Ein gut gemischtes Spiel ist darum mit großer Sicherheit einmalig in der Geschichte. Und »geordnet« ist eine einzige davon.
    difficulty: 3

srs:
  cards_from: [moeglichkeiten, zehn]
