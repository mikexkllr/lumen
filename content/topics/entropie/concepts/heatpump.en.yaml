id: sci.entropy.heatpump
type: concept
title: The heat pump
summary: More heat out than electricity in.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: mehr
    widget: choice
    prompt: A heat pump delivers 3 kWh of heat from 1 kWh of electricity. Does that break energy conservation?
    params:
      options:
        - { label: No – it takes 2 kWh of heat from the outside air., correct: true }
        - { label: "Yes", feedback: "It does not create the heat, it moves it from outside to inside." }
    hints:
      - Where does the extra heat come from?
    explanation: Like a refrigerator in reverse – heat is pumped from cold to warm.

  - kind: problem
    id: faktor
    widget: numeric
    prompt: A heat pump delivers {{w}} kWh of heat from {{s}} kWh of electricity. What is its coefficient of performance?
    params: { placeholder: "Factor" }
    answer: { value: "{{w / s}}" }
    hints:
      - Heat divided by electricity.
    explanation: "{{w}} ÷ {{s}} = {{w / s}}."
    variants:
      params: { s: "choice[2,4,5]", k: "int[2,5]" }
      derive: { w: "s * k" }
      defaults: { s: 4, k: 3 }

  - kind: problem
    id: kaelter
    widget: choice
    prompt: When does an air-source heat pump work most efficiently?
    params:
      options:
        - { label: When it is not too cold outside, correct: true }
        - { label: In severe frost, feedback: "The larger the temperature difference, the more work the pumping costs." }
    hints:
      - A large temperature difference is harder to overcome.
    explanation: Small temperature differences make pumping cheap – so underfloor heating pairs well with it.

  - kind: problem
    id: mix-c1
    widget: estimate
    prompt: "Take a guess: how many kilowatt-hours of heat does a good heat pump make from 1 kWh of electricity?"
    params:
      min: 0
      max: 12
      unit: kWh
    answer:
      value: 4
      tolerance: 1
    explanation: About 4. It does not create the heat – it brings it in from outside.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The best conceivable coefficient of performance of a heat pump is $\frac{T_{hot}}{T_{hot} - T_{cold}}$. What is it between 280 K outside and 315 K heating water?
    answer:
      value: 9
    hints:
      - 315 divided by 35.
    explanation: 9. Real devices reach about half. The smaller the temperature lift, the better.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A heat pump with a coefficient of performance of 4 delivers 12,000 kWh of heat per year. How many kWh of electricity does it need?
    params:
      unit: kWh
    answer:
      value: 3000
    feedback:
      - when: numval(state.input) == 48000
        misconception: cop-direction
        text: "The other way round: it delivers **more** heat than the electricity it uses. Divide by 4."
    hints:
      - COP = heat ÷ electricity.
      - 12,000 ÷ 4 = ?
    explanation: 3000 kWh of electricity; 9000 kWh come from the outside air or ground. A gas boiler would need the full 12,000 kWh as gas.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: The heating water is at 308 K (35 °C), outside it is {{tc}} K. What is the best possible COP T_warm ÷ (T_warm − T_cold)? To one decimal place.
    answer:
      value: "{{308 / (308 - tc)}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - tc / (308 - tc)) < 0.05
        misconception: cooling-formula
        text: That is the formula for cooling. For heating, T_warm goes in the numerator.
    hints:
      - "Temperature difference: 308 − {{tc}} = {{308 - tc}} K."
      - 308 ÷ {{308 - tc}} = ?
    explanation: At most {{308 / (308 - tc)}}. The colder it is outside, the lower it gets. Real devices reach about half of this ideal.
    difficulty: 2
    variants:
      params:
        tc: choice[266,273,280]
      defaults:
        tc: 273

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is underfloor heating ideal for heat pumps?
    params:
      options:
        - label: They work with water at 35 °C – the temperature lift is small
          correct: true
        - label: Because warm air rises
          feedback: True, but it does not explain the pump’s efficiency.
        - label: Because they need less water
          feedback: They actually need more.
    hints:
      - "Look at the formula: what is in the denominator?"
    explanation: Large heating surface, low temperature, small denominator – high performance.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A fridge keeps 278 K inside and gives off heat at 308 K at the back. What is the best COP for cooling, T_cold ÷ (T_warm − T_cold)? To two decimals.
    answer:
      value: 9.27
      tolerance: 0.05
    hints:
      - "Difference: 308 − 278 = 30 K."
      - 278 ÷ 30 = ?
    explanation: Up to 9.27 kJ of heat removed per kJ of electricity. Cooling and heating are the same machine – one counts the cold side, the other the warm side.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a heat pump moves heat from cold to warm without breaking the second law.
    params:
      keywords:
        - - arbeit
          - work
          - strom
          - electric
          - energie
          - energy
        - - entropie
          - entropy
          - insgesamt
          - total
          - gesamt
          - overall
        - - kalt
          - cold
          - warm
          - hot
          - umgebung
          - outside
      sample: On its own heat only flows from warm to cold. The heat pump needs work in the form of electricity. This work ends up as extra heat on the warm side, so total entropy does not fall.
    difficulty: 3

srs:
  cards_from: [mehr, faktor]
