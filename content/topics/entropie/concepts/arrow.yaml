id: sci.entropy.arrow
type: concept
title: Der Pfeil der Zeit
summary: Warum Dinge nicht rückwärts laufen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: eis
    widget: choice
    prompt: Ein Eiswürfel schmilzt in warmem Tee. Warum friert der Tee nie von selbst wieder zu Eis und heißem Tee?
    params:
      options:
        - { label: "Das wäre so unwahrscheinlich, dass es praktisch nie passiert.", correct: true }
        - { label: Ein Naturgesetz verbietet die Bewegung der Teilchen dafür., feedback: "Jede einzelne Bewegung wäre erlaubt – nur die Kombination ist extrem unwahrscheinlich." }
    hints:
      - Denk an die Teilchen in der Box.
    explanation: Der **zweite Hauptsatz** – in einem abgeschlossenen System nimmt die Entropie nicht ab.

  - kind: problem
    id: richtung
    widget: buckets
    prompt: Läuft das von selbst ab – oder nur mit Energie von außen?
    params:
      buckets: [{ label: von selbst }, { label: nur mit Energie }]
      items:
        - { label: Tinte verteilt sich im Wasser, bucket: von selbst }
        - { label: Heißer Kaffee kühlt ab, bucket: von selbst }
        - { label: Ein Kühlschrank kühlt, bucket: nur mit Energie }
        - { label: Ein Zimmer wird aufgeräumt, bucket: nur mit Energie }
    hints:
      - Wird die Unordnung größer oder kleiner?
    explanation: Ordnung schaffen kostet Energie – und erzeugt woanders mehr Unordnung.

  - kind: explain
    id: s3
    body: |
      Die Naturgesetze für einzelne Teilchen funktionieren vorwärts wie rückwärts. Erst die Statistik vieler Teilchen gibt der Zeit eine **Richtung**: von geordnet zu ungeordnet.

  - kind: problem
    id: leben
    widget: choice
    prompt: Lebewesen bauen hochgeordnete Strukturen auf. Verletzen sie den zweiten Hauptsatz?
    params:
      options:
        - { label: Nein – sie geben dabei viel Wärme und Unordnung an die Umgebung ab., correct: true }
        - { label: Ja, feedback: "Die Gesamtentropie inklusive Umgebung wächst trotzdem." }
    hints:
      - Was geben wir ständig an die Umgebung ab?
    explanation: Leben ist eine Insel der Ordnung, bezahlt mit Wärme und Abfall.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Läuft dieser Film vorwärts oder rückwärts?
    params:
      buckets:
        - id: b1
          label: Vorwärts
        - id: b2
          label: Rückwärts
      items:
        - label: Ein Glas zerspringt
          bucket: b1
        - label: Scherben fügen sich zum Glas
          bucket: b2
        - label: Milch verteilt sich im Kaffee
          bucket: b1
        - label: Rauch zieht zurück in die Kerze
          bucket: b2
    hints:
      - Was hast du noch nie gesehen?
    explanation: Du erkennst die Richtung sofort – an der wachsenden Unordnung.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Von allein wächst die [[Unordnung]]. Das gibt der Zeit ihre [[Richtung]].
      distractors:
        - Ordnung
        - Farbe

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Dein Kühlschrank macht sein Inneres kälter und geordneter. Was passiert mit der Entropie insgesamt?
    params:
      options:
        - label: Sie steigt – hinten gibt er mehr Wärme ab, als er innen entzieht
          correct: true
        - label: Sie sinkt
          feedback: Nur innen. Zählt man die Küche mit, steigt sie.
        - label: Sie bleibt gleich
          feedback: Reale Maschinen erzeugen immer zusätzliche Entropie.
    hints:
      - Fühl mal an der Rückseite eines Kühlschranks.
    explanation: Lokal darf Entropie sinken – wenn sie anderswo stärker steigt.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "Fließt Wärme Q bei der Temperatur T in einen Körper, wächst seine Entropie um $\\Delta S = Q / T$. Diese Formel von **Clausius** zeigt: Dieselbe Wärme bringt bei kalten Körpern mehr Entropie."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "334 J fließen aus Tee (333 K) in einen Eiswürfel (273 K). Um wie viel J/K steigt die Entropie insgesamt? Rechne Q : T für beide. Auf zwei Stellen."
    params:
      unit: J/K
    answer:
      value: 0.22
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 1.22) < 0.02
        misconception: one-side
        text: "Das ist nur der Gewinn des Eises. Der Tee verliert 334 : 333 ≈ 1,00 J/K."
    hints:
      - "Eis: +334 : 273 ≈ +1,22 J/K."
      - "Tee: −334 : 333 ≈ −1,00 J/K. Addiere beides."
    explanation: +1,22 − 1,00 ≈ +0,22 J/K. Fließt Wärme von warm nach kalt, steigt die Entropie immer – das Kalte gewinnt mehr, als das Warme verliert. Umgekehrt würde sie sinken.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der **Maxwellsche Dämon** sortiert schnelle und langsame Moleküle durch eine Klappe – scheinbar ohne Arbeit. Warum verletzt er den zweiten Hauptsatz nicht?
    params:
      options:
        - label: Er muss Information speichern – und sie zu löschen kostet Energie
          correct: true
        - label: Weil es keine Dämonen gibt
          feedback: Auch eine Maschine in dieser Rolle käme nicht darum herum.
        - label: Weil die Klappe zu schwer ist
          feedback: Das Argument gilt auch für eine reibungsfreie Klappe.
    hints:
      - Der Dämon muss sich merken, welches Molekül schnell war.
    explanation: "Das **Landauer-Prinzip**: Ein Bit zu löschen erzeugt mindestens k · T · ln 2 Wärme. Information ist physikalisch."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Vier Gasteilchen sind manchmal alle links – 10²³ Teilchen nie. Was folgt für den zweiten Hauptsatz?
    params:
      options:
        - label: Er gilt statistisch – für große Teilchenzahlen ist ein Verstoß nur unvorstellbar unwahrscheinlich.
          correct: true
        - label: Er gilt nur für vier Teilchen nicht, sonst streng.
          feedback: Es gibt keine scharfe Grenze. Die Wahrscheinlichkeit fällt nur extrem schnell.
        - label: Er ist falsch.
          feedback: Für makroskopische Dinge wurde nie ein Verstoß beobachtet.
    hints:
      - "Wie groß ist 1 : 2 hoch 10²³?"
      - Unmöglich und unvorstellbar unwahrscheinlich – ist das ein Unterschied?
    explanation: In winzigen Systemen misst man tatsächlich kurze »Rückwärts«-Schwankungen. Für Alltagsdinge müsste man länger warten als das Alter des Universums – milliardenfach.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Landauer: Ein Bit Information zu löschen kostet mindestens die Wärme k · T · ln 2. Wie viel ist das bei 300 K – in 10⁻²¹ J? Auf zwei Stellen."
    answer:
      value: 2.87
      tolerance: 0.05
    hints:
      - k · T = 1,38 · 10⁻²³ · 300 = 4,14 · 10⁻²¹ J.
      - Mal 0,693.
    explanation: "Etwa 2,9 · 10⁻²¹ J pro Bit. Genau diese Rechnung rettet den zweiten Hauptsatz vor Maxwells Dämon: Sein Gedächtnis zu löschen erzeugt mindestens so viel Entropie, wie er gewinnt."
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Zeit eine Richtung hat, obwohl die Gesetze für einzelne Teilchen auch rückwärts gelten.
    params:
      keywords:
        - - entropie
          - entropy
          - unordnung
          - disorder
        - - wahrscheinlich
          - likely
          - probab
          - zustände
          - states
          - möglichkeiten
          - ways
        - - viele
          - many
          - teilchen
          - particles
          - statistik
          - statistic
      sample: Für ein einzelnes Teilchen sieht vorwärts und rückwärts gleich aus. Bei vielen Teilchen gibt es aber viel mehr ungeordnete als geordnete Zustände. Darum wächst die Entropie fast sicher – das gibt der Zeit ihre Richtung.
    difficulty: 3

srs:
  cards_from: [eis, richtung]
