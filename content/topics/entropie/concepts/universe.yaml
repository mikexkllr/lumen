id: sci.entropy.universe
type: concept
title: Entropie und Universum
summary: Vom Urknall zum Wärmetod.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Heißer Kaffee steht in einem kalten Zimmer. Was passiert nie von allein?
    params:
      options:
        - label: Der Kaffee wird heißer und das Zimmer kälter
          correct: true
        - label: Der Kaffee kühlt ab
          feedback: Das passiert immer.
        - label: Das Zimmer wird ein wenig wärmer
          feedback: Auch das passiert.
    hints:
      - Wärme fließt nur in eine Richtung.
    explanation: Diese Einbahnstraße gilt für das ganze Universum.

  - kind: explain
    id: s1
    body: |
      Das Universum begann in einem Zustand sehr **niedriger Entropie**. Seitdem nimmt sie zu: Sterne brennen aus, Wärme verteilt sich. Diese Zunahme treibt alles an, was passiert – auch uns.

  - kind: problem
    id: ende
    widget: choice
    prompt: Was wäre der »Wärmetod« des Universums?
    params:
      options:
        - { label: Alles hat dieselbe Temperatur – nichts kann mehr Arbeit verrichten., correct: true }
        - { label: Das Universum wird unendlich heiß., feedback: "Es wird gleichmäßig – nicht heiß. Ohne Gefälle kann nichts mehr passieren." }
    hints:
      - Was braucht jede Maschine?
    explanation: Ohne Temperaturunterschiede gibt es keinen Antrieb mehr.

  - kind: problem
    id: sonne
    widget: order
    prompt: Bring die Energiekette in die richtige Reihenfolge.
    params:
      items:
        - { label: Kernfusion in der Sonne }
        - { label: Licht erreicht die Erde }
        - { label: Pflanzen bauen Zucker }
        - { label: Wir nutzen die Energie und geben Wärme ab }
    hints:
      - Am Anfang steht die Sonne.
    explanation: Wir leben vom Gefälle zwischen heißer Sonne und kaltem Weltall.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Die Wahrscheinlichkeit, dass sich {{n}} Münzen zufällig alle auf Kopf legen, ist 1 zu …?
    params: { placeholder: "Anzahl" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - Jede Münze halbiert die Chance.
    explanation: "1 zu {{2 ** n}} – Ordnung ist schon bei wenigen Teilchen selten."
    variants:
      params: { n: "int[8,14]" }
      defaults: { n: 10 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Die Sonne schickt der Erde Energie – und die Erde strahlt genauso viel wieder ab. Was haben wir dann überhaupt davon?
    params:
      options:
        - label: Wir bekommen wenige energiereiche Photonen und geben viele energiearme ab – das exportiert Entropie
          correct: true
        - label: Nichts – die Bilanz ist null
          feedback: Die Energiebilanz ja, die Entropiebilanz nicht.
        - label: Die Erde behält einen Teil der Energie
          feedback: Dann würde sie immer heißer.
    hints:
      - Für jedes Photon von der Sonne strahlt die Erde etwa 20 infrarote ab.
    explanation: "Leben nutzt nicht Energie, sondern den **Entropiestrom**: geordnetes Licht rein, ungeordnete Wärme raus."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Die Erde bekommt Sonnenlicht von einer 5800 K heißen Oberfläche und strahlt bei etwa 290 K genauso viel Energie wieder ab. Die mittlere Photonenenergie ist proportional zu T. Wievielmal mehr Photonen strahlt die Erde ab, als sie empfängt?
    answer:
      value: 20
      tolerance: 1
    hints:
      - Gleiche Energie, aber jedes abgestrahlte Photon ist kleiner.
      - "5800 : 290 = ?"
    explanation: Rund 20-mal so viele Photonen. Aus wenigen energiereichen werden viele energiearme – die Entropie steigt stark. Von diesem Gefälle leben Pflanzen, Wetter und wir.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum zerbricht eine Tasse von selbst, setzt sich aber nie von selbst wieder zusammen?"
    params:
      keywords:
        - - wahrscheinlich
          - likely
          - probab
          - unwahrscheinlich
        - - möglichkeit
          - zustände
          - anordnung
          - ways
          - states
          - arrangement
        - - unordnung
          - entropie
          - entropy
          - disorder
          - ordnung
          - order
      sample: Es gibt unvorstellbar viele Anordnungen für Scherben, aber nur eine für die heile Tasse. Von selbst geht alles zu den wahrscheinlicheren Zuständen – die Unordnung, also die Entropie, wächst.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Kurz nach dem Urknall war das Universum heiß und fast völlig gleichmäßig. Warum gilt das trotzdem als Zustand niedriger Entropie?
    params:
      options:
        - label: Mit Schwerkraft ist Gleichverteilung geordnet – Klumpen wie Sterne und Schwarze Löcher haben viel mehr Entropie.
          correct: true
        - label: Weil es damals noch keine Teilchen gab.
          feedback: Teilchen gab es reichlich. Entscheidend ist, wie die Schwerkraft Zustände zählt.
        - label: Weil es sehr klein war.
          feedback: Größe allein erklärt es nicht. Es geht um die Verteilung der Materie.
    hints:
      - Bei einem Gas in der Box ist gleichmäßig wahrscheinlich. Gilt das auch mit Schwerkraft?
      - Schwerkraft lässt Materie von selbst verklumpen.
    explanation: "Ohne Schwerkraft wäre Gleichmäßigkeit maximale Unordnung. Mit ihr ist es umgekehrt: Materie ballt sich von selbst, und die Entropie steigt. Schwarze Löcher haben die größte Entropie überhaupt."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Schätz mal: In wie vielen Jahren verlöschen die letzten Sterne, wenn kein neues Gas für Sternentstehung mehr da ist?"
    params:
      min: 1000000000
      max: 100000000000000000000
      scale: log
    answer:
      value: 100000000000000
      within: 90
    explanation: Grob in 100 Billionen Jahren (10¹⁴). Kleine rote Zwerge brennen extrem sparsam. Danach bleiben nur kalte Reste – das Universum nähert sich dem Wärmetod.
    difficulty: 3

srs:
  cards_from: [ende, sonne]
