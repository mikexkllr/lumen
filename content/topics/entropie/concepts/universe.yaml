id: sci.entropy.universe
type: concept
title: Entropie und Universum
summary: Vom Urknall zum Wärmetod.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Das Universum begann in einem Zustand sehr **niedriger Entropie**. Seitdem nimmt sie zu: Sterne brennen aus, Wärme verteilt sich. Diese Zunahme treibt alles an, was passiert – auch uns.

  - kind: problem
    id: ende
    widget: choice
    prompt: Was wäre der »Wärmetod« des Universums?
    params:
      options:
        - { label: Alles hat dieselbe Temperatur – nichts kann mehr Arbeit verrichten., correct: true }
        - { label: Das Universum wird unendlich heiß., feedback: "Es wird gleichmäßig – nicht heiß. Ohne Gefälle kann nichts mehr passieren." }
    hints:
      - Was braucht jede Maschine?
    explanation: Ohne Temperaturunterschiede gibt es keinen Antrieb mehr.

  - kind: problem
    id: sonne
    widget: order
    prompt: Bring die Energiekette in die richtige Reihenfolge.
    params:
      items:
        - { label: Kernfusion in der Sonne }
        - { label: Licht erreicht die Erde }
        - { label: Pflanzen bauen Zucker }
        - { label: Wir nutzen die Energie und geben Wärme ab }
    hints:
      - Am Anfang steht die Sonne.
    explanation: Wir leben vom Gefälle zwischen heißer Sonne und kaltem Weltall.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Die Wahrscheinlichkeit, dass sich {{n}} Münzen zufällig alle auf Kopf legen, ist 1 zu …?
    params: { placeholder: "Anzahl" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - Jede Münze halbiert die Chance.
    explanation: "1 zu {{2 ** n}} – Ordnung ist schon bei wenigen Teilchen selten."
    variants:
      params: { n: "int[8,14]" }
      defaults: { n: 10 }

srs:
  cards_from: [ende, sonne]
