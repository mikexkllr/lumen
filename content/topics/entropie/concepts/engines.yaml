id: sci.entropy.engines
type: concept
title: Wärmekraftmaschinen
summary: Warum nie alles in Arbeit fließt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der Energie im Benzin werden im Auto zu Bewegung?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 30
      tolerance: 10
    explanation: Nur etwa 30 %. Der Rest geht als Wärme verloren – und das hat einen tiefen Grund.

  - kind: explain
    id: s1
    body: |
      Motoren und Kraftwerke wandeln Wärme in Arbeit um. Sie brauchen dafür ein **Temperaturgefälle** – und müssen immer einen Teil der Wärme an die kalte Seite abgeben. Der beste mögliche Wirkungsgrad ist $1 - \frac{T_{kalt}}{T_{heiß}}$, mit Temperaturen in Kelvin.

  - kind: problem
    id: carnot
    widget: numeric
    prompt: Ein Kraftwerk arbeitet zwischen {{th}} K und {{tc}} K. Wie hoch ist der höchstmögliche Wirkungsgrad?
    params: { unit: "%" }
    answer: { value: "{{100 - 100 * tc / th}}" }
    hints:
      - "1 − {{tc}} : {{th}}."
    explanation: "1 − {{tc}}/{{th}} = {{100 - 100 * tc / th}} %."
    variants:
      params: { th: "choice[600,800,1000]", tc: "choice[300,400]" }
      defaults: { th: 600, tc: 300 }

  - kind: problem
    id: kelvin
    widget: choice
    prompt: Warum muss man hier in Kelvin rechnen?
    params:
      options:
        - { label: Nur Kelvin beginnt beim absoluten Nullpunkt., correct: true }
        - { label: Weil Celsius ungenau ist., feedback: "Celsius ist genau – aber sein Nullpunkt ist willkürlich." }
    hints:
      - Was wäre mit 0 °C im Nenner?
    explanation: Verhältnisse von Temperaturen ergeben nur ab dem echten Nullpunkt Sinn.

  - kind: problem
    id: abwaerme
    widget: order
    prompt: Ordne nach typischem Wirkungsgrad, den niedrigsten zuerst.
    params:
      items:
        - { label: Glühbirne als Lichtquelle }
        - { label: Benzinmotor }
        - { label: Gaskraftwerk }
        - { label: Elektromotor }
    hints:
      - Elektromotoren wandeln fast alles in Bewegung um.
    explanation: Etwa 5 %, 30 %, 60 % und über 90 %.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Motor arbeitet zwischen 900 K und 300 K. Er nimmt 600 J Wärme auf. Wie viel Arbeit kann er **höchstens** leisten?
    params:
      unit: J
    answer:
      value: 400
    hints:
      - "Carnot-Wirkungsgrad: 1 − 300/900."
    explanation: Zwei Drittel von 600 J sind 400 J. Mindestens 200 J müssen als Abwärme weg.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Im Motor erhitzt die Verbrennung das Gas im Zylinder. Halte das Volumen fest und heize, bis der Druck etwa 200 kPa erreicht.
    params:
      scene: gas
      controls:
        volume:
          fixed: true
    answer:
      pressure:
        - 195
        - 205
    explanation: "Bei 600 K: doppelte Temperatur, doppelter Druck. Dieser Druck schiebt den Kolben."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: order
    prompt: Bring die vier Takte eines Benzinmotors in die richtige Reihenfolge.
    params:
      items:
        - label: "Ansaugen: Kolben saugt Gemisch an"
        - label: "Verdichten: Kolben presst es zusammen"
        - label: "Arbeiten: Zündung, heißes Gas drückt"
        - label: "Ausstoßen: Abgas strömt hinaus"
    hints:
      - Erst muss Brennstoff in den Zylinder.
      - Gezündet wird, wenn das Gas am stärksten verdichtet ist.
    explanation: Ansaugen, Verdichten, Arbeiten, Ausstoßen. Nur im dritten Takt leistet das heiße Gas Arbeit. Das Abgas trägt die Wärme weg, die keine Maschine nutzen kann.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Ein Kraftwerk mit 40 % Wirkungsgrad liefert 1000 MW Strom. Wie viele MW Abwärme gibt es an Fluss und Kühlturm ab?
    params:
      unit: MW
    answer:
      value: 1500
    feedback:
      - when: numval(state.input) == 600
        misconception: output-as-input
        text: "Die 1000 MW sind der **Nutzen**, nicht der Einsatz. Der Einsatz ist 1000 : 0,4."
    hints:
      - "Eingesetzte Wärme: 1000 MW : 0,4."
      - Abwärme = Einsatz − Nutzen.
    explanation: 2500 MW gehen hinein, 1000 MW als Strom heraus, 1500 MW als Abwärme. Darum stehen Kraftwerke an Flüssen. Mit Fernwärme nutzt man einen Teil davon.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum kann selbst eine perfekte Maschine Wärme nicht vollständig in Arbeit umwandeln?
    params:
      options:
        - label: Die Entropie der aufgenommenen Wärme muss irgendwohin – sie geht mit der Abwärme
          correct: true
        - label: Wegen der Reibung
          feedback: Auch ohne jede Reibung gilt die Grenze.
        - label: Weil Energie verloren geht
          feedback: Energie bleibt immer erhalten – es geht um ihre Qualität.
    hints:
      - Arbeit trägt keine Entropie, Wärme schon.
    explanation: Wärme bei hoher Temperatur ist »wertvoll«, bei niedriger nicht. Der Carnot-Wirkungsgrad folgt direkt aus dem zweiten Hauptsatz.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Eine Maschine nimmt Wärme $Q_w$ bei $T_w$ auf und gibt $Q_k$ bei $T_k$ ab. Die Entropie darf dabei nicht sinken: $\\frac{Q_k}{T_k} \\geq \\frac{Q_w}{T_w}$. Daraus folgt der **Carnot-Wirkungsgrad** $\\eta \\leq 1 - \\frac{T_k}{T_w}$."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Eine Maschine nimmt 1000 J Wärme bei 600 K auf. Die Umgebung hat 300 K. Wie viele Joule Wärme muss sie mindestens wieder abgeben?
    params:
      unit: J
    answer:
      value: 500
    feedback:
      - when: numval(state.input) == 0
        misconception: no-waste
        text: "Ohne Abwärme würde die Entropie sinken: Die aufgenommene Entropie muss irgendwohin."
    hints:
      - "Aufgenommene Entropie: 1000 J : 600 K."
      - "Dieselbe Entropie bei 300 K abgeben: Q = 300 K · 1000/600 J/K."
    explanation: Mindestens 500 J. Höchstens 500 J werden Arbeit – 50 %, genau der Carnot-Wert 1 − 300/600.
    difficulty: 3

srs:
  cards_from: [carnot, kelvin]
