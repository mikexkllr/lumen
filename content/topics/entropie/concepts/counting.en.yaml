id: sci.entropy.counting
type: concept
title: Counting disorder
summary: Why gases spread out on their own.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: moeglichkeiten
    widget: numeric
    prompt: Four gas particles are in a box, each randomly left or right. How many possible arrangements are there?
    params: { unit: arrangements }
    answer: { value: 16 }
    hints:
      - Each particle has 2 options.
    explanation: $2^4 = 16$ – only one of them has all particles on the left.

  - kind: problem
    id: simulation
    widget: distribution
    prompt: Let the particles spread out at random at least 100 times. How often are all of them on the left?
    params:
      items: [{ label: all left, weight: 1 }, { label: mixed, weight: 14 }, { label: all right, weight: 1 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Run many rounds at once.
    explanation: Mixed happens far more often – there are simply many more ways for it.

  - kind: explain
    id: s3
    body: |
      **Entropy** measures how many micro-arrangements fit one state. Mixed has unimaginably many, ordered has very few. So disorder grows on its own – not through a force, but through probability.

  - kind: problem
    id: zehn
    widget: numeric
    prompt: With {{n}} particles – in how many of all arrangements are all of them on the left? Give the denominator, so "1 in …".
    params: { placeholder: "Number" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - "Each particle halves the chance."
    explanation: "1 in $2^{ {{n}} } = {{2 ** n}}$ – practically impossible with billions of particles."
    variants:
      params: { n: "int[6,12]" }
      defaults: { n: 10 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A shuffled deck has more entropy than a sorted one.
          right: true
        - text: Disorder never increases by itself.
          right: false
          why: That is exactly what it does – there are far more disordered than ordered states.
        - text: All the air in a room gathering in one corner is possible but unimaginably unlikely.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Four particles, each left or right. How many of the 16 arrangements have exactly **two left and two right**?
    answer:
      value: 6
    hints:
      - Choose 2 out of 4.
    explanation: 6 of 16. The even distribution is the most likely – overwhelmingly so with many particles.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Boltzmann’s formula: $S = k \\cdot \\ln W$ with W = number of microstates. Doubling the number of particles turns W into its square W². How many times as large does the entropy become?"
    answer:
      value: 2
    hints:
      - ln(W²) = 2 · ln W.
    explanation: "Twice as large. The logarithm makes entropy **additive**: two litres of gas have twice as much as one."
    difficulty: 3

srs:
  cards_from: [moeglichkeiten, zehn]
