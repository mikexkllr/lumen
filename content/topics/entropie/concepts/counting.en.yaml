id: sci.entropy.counting
type: concept
title: Counting disorder
summary: Why gases spread out on their own.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Order is rare
    body: Throw six coins at once – again and again. How often do all six land heads up? And how often mixed? This is the idea behind **entropy**.
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: 0 heads
            weight: 1
          - label: 1 head
            weight: 6
          - label: 2 heads
            weight: 15
          - label: 3 heads
            weight: 20
          - label: 4 heads
            weight: 15
          - label: 5 heads
            weight: 6
          - label: 6 heads
            weight: 1

  - kind: problem
    id: moeglichkeiten
    widget: numeric
    prompt: Four gas particles are in a box, each randomly left or right. How many possible arrangements are there?
    params: { unit: arrangements }
    answer: { value: 16 }
    hints:
      - Each particle has 2 options.
    explanation: $2^4 = 16$ – only one of them has all particles on the left.

  - kind: problem
    id: simulation
    widget: distribution
    prompt: Let the particles spread out at random at least 100 times. How often are all of them on the left?
    params:
      items: [{ label: all left, weight: 1 }, { label: mixed, weight: 14 }, { label: all right, weight: 1 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Run many rounds at once.
    explanation: Mixed happens far more often – there are simply many more ways for it.

  - kind: explain
    id: s3
    body: |
      **Entropy** measures how many micro-arrangements fit one state. Mixed has unimaginably many, ordered has very few. So disorder grows on its own – not through a force, but through probability.

  - kind: problem
    id: zehn
    widget: numeric
    prompt: With {{n}} particles – in how many of all arrangements are all of them on the left? Give the denominator, so "1 in …".
    params: { placeholder: "Number" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - "Each particle halves the chance."
    explanation: "1 in $2^{ {{n}} } = {{2 ** n}}$ – practically impossible with billions of particles."
    variants:
      params: { n: "int[6,12]" }
      defaults: { n: 10 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A shuffled deck has more entropy than a sorted one.
          right: true
        - text: Disorder never increases by itself.
          right: false
          why: That is exactly what it does – there are far more disordered than ordered states.
        - text: All the air in a room gathering in one corner is possible but unimaginably unlikely.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Four particles, each left or right. How many of the 16 arrangements have exactly **two left and two right**?
    answer:
      value: 6
    hints:
      - Choose 2 out of 4.
    explanation: 6 of 16. The even distribution is the most likely – overwhelmingly so with many particles.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "{{n}} particles, each left or right. In how many arrangements are exactly half of them on the left?"
    answer:
      value: "{{n == 4 ? 6 : (n == 6 ? 20 : 70)}}"
    feedback:
      - when: numval(state.input) == 2 ** n
        misconception: all-states
        text: That is **all** arrangements. Only those with exactly half and half are asked for.
    hints:
      - How many ways are there to choose {{n / 2}} of {{n}} particles?
      - That is the binomial coefficient »{{n}} choose {{n / 2}}«.
    explanation: Half and half is the most common single case. As n grows it overwhelms »all on the left« (just 1 way) more and more.
    difficulty: 2
    variants:
      params:
        n: choice[4,6,8]
      defaults:
        n: 6

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: you toss 100 coins. How likely is it to get exactly 50 heads – in percent?"
    params:
      min: 0
      max: 100
    answer:
      value: 8
      tolerance: 3
    explanation: "Only about 8 %. But you almost always land close to 50: between 40 and 60 heads lie about 96 % of all tosses. The middle has the most microstates."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Boltzmann’s formula: $S = k \\cdot \\ln W$ with W = number of microstates. Doubling the number of particles turns W into its square W². How many times as large does the entropy become?"
    answer:
      value: 2
    hints:
      - ln(W²) = 2 · ln W.
    explanation: "Twice as large. The logarithm makes entropy **additive**: two litres of gas have twice as much as one."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Boltzmann linked counting with heat: $S = k \\ln W$. The **logarithm** turns multiplying into adding: two systems together have $W_1 \\cdot W_2$ states and the entropy $S_1 + S_2$."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "One mole of particles (6 · 10²³), each with two options: W = 2 to the 6 · 10²³. What is S = k · ln W = N · k · ln 2 – in J/K? k = 1.38 · 10⁻²³ J/K. To one decimal place."
    params:
      unit: J/K
    answer:
      value: 5.7
      tolerance: 0.1
    hints:
      - N · k = 6 · 10²³ · 1.38 · 10⁻²³ ≈ 8.3 J/K.
      - Times ln 2 ≈ 0.693.
    explanation: S ≈ 5.7 J/K. An unimaginably large number of states gives a perfectly handy entropy – that is exactly what the logarithm does.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: estimate
    prompt: "Take a guess: in how many ways can 52 playing cards be arranged?"
    params:
      min: 10000000000
      max: 1e+100
      scale: log
    answer:
      value: 8e+67
      within: 80
    explanation: 52! ≈ 8 · 10⁶⁷ – more than the atoms in our galaxy. A well-shuffled deck is almost certainly unique in history. And »sorted« is just one of them.
    difficulty: 3

srs:
  cards_from: [moeglichkeiten, zehn]
