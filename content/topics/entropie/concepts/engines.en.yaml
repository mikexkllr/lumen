id: sci.entropy.engines
type: concept
title: Heat engines
summary: Why not all heat can become work.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Heat becomes work
    body: In every car engine, hot gas pushes a piston outwards. Heat the gas and let the piston move. When is the **pressure** high enough for a strong push?
    visual:
      widget: sim
      interactive: true
      params:
        scene: gas

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percentage of the energy in petrol becomes motion in a car?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 30
      tolerance: 10
    explanation: Only about 30%. The rest is lost as heat – and there is a deep reason for that.

  - kind: explain
    id: s1
    body: |
      Engines and power plants turn heat into work. They need a **temperature difference** – and must always release part of the heat to the cold side. The best possible efficiency is $1 - \frac{T_{cold}}{T_{hot}}$, with temperatures in kelvin.

  - kind: problem
    id: carnot
    widget: numeric
    prompt: A power plant works between {{th}} K and {{tc}} K. What is the highest possible efficiency?
    params: { unit: "%" }
    answer: { value: "{{100 - 100 * tc / th}}" }
    hints:
      - "1 − {{tc}} ÷ {{th}}."
    explanation: "1 − {{tc}}/{{th}} = {{100 - 100 * tc / th}} %."
    variants:
      params: { th: "choice[600,800,1000]", tc: "choice[300,400]" }
      defaults: { th: 600, tc: 300 }

  - kind: problem
    id: kelvin
    widget: choice
    prompt: Why do you have to use kelvin here?
    params:
      options:
        - { label: Only kelvin starts at absolute zero., correct: true }
        - { label: Because Celsius is inaccurate., feedback: "Celsius is accurate – but its zero point is arbitrary." }
    hints:
      - What would 0 °C in the denominator do?
    explanation: Ratios of temperatures only make sense from the true zero point.

  - kind: problem
    id: abwaerme
    widget: order
    prompt: Sort by typical efficiency, lowest first.
    params:
      items:
        - { label: Light bulb as a light source }
        - { label: Gasoline engine }
        - { label: Gas power plant }
        - { label: Electric motor }
    hints:
      - Electric motors turn almost everything into motion.
    explanation: About 5%, 30%, 60% and over 90%.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An engine works between 900 K and 300 K. It takes in 600 J of heat. How much work can it do **at most**?
    params:
      unit: J
    answer:
      value: 400
    hints:
      - "Carnot efficiency: 1 − 300/900."
    explanation: Two thirds of 600 J is 400 J. At least 200 J must go as waste heat.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: In an engine combustion heats the gas in the cylinder. Keep the volume fixed and heat until the pressure reaches about 200 kPa.
    params:
      scene: gas
      controls:
        volume:
          fixed: true
    answer:
      pressure:
        - 195
        - 205
    explanation: "At 600 K: double the temperature, double the pressure. This pressure pushes the piston."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: order
    prompt: Put the four strokes of a petrol engine in the right order.
    params:
      items:
        - label: "Intake: the piston draws in the mixture"
        - label: "Compression: the piston squeezes it"
        - label: "Power: ignition, hot gas pushes"
        - label: "Exhaust: the burnt gas flows out"
    hints:
      - First the fuel has to get into the cylinder.
      - Ignition comes when the gas is most compressed.
    explanation: Intake, compression, power, exhaust. Only in the third stroke does the hot gas do work. The exhaust carries away the heat no engine can use.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: A power plant with 40 % efficiency delivers 1000 MW of electricity. How many MW of waste heat does it release to river and cooling tower?
    params:
      unit: MW
    answer:
      value: 1500
    feedback:
      - when: numval(state.input) == 600
        misconception: output-as-input
        text: The 1000 MW are the **output**, not the input. The input is 1000 ÷ 0.4.
    hints:
      - "Heat input: 1000 MW ÷ 0.4."
      - Waste heat = input − output.
    explanation: 2500 MW go in, 1000 MW come out as electricity, 1500 MW as waste heat. That is why power plants stand by rivers. District heating uses part of it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why can even a perfect machine not convert heat completely into work?
    params:
      options:
        - label: The entropy of the heat taken in must go somewhere – it leaves with the waste heat
          correct: true
        - label: Because of friction
          feedback: The limit holds even without any friction.
        - label: Because energy is lost
          feedback: Energy is always conserved – it is about its quality.
    hints:
      - Work carries no entropy; heat does.
    explanation: Heat at high temperature is “valuable”, at low temperature not. The Carnot efficiency follows directly from the second law.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "An engine takes heat $Q_w$ at $T_w$ and gives off $Q_k$ at $T_k$. Entropy must not fall: $\\frac{Q_k}{T_k} \\geq \\frac{Q_w}{T_w}$. This gives the **Carnot efficiency** $\\eta \\leq 1 - \\frac{T_k}{T_w}$."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: An engine takes in 1000 J of heat at 600 K. The surroundings are at 300 K. At least how many joules of heat must it give off again?
    params:
      unit: J
    answer:
      value: 500
    feedback:
      - when: numval(state.input) == 0
        misconception: no-waste
        text: "Without waste heat entropy would fall: the entropy taken in has to go somewhere."
    hints:
      - "Entropy taken in: 1000 J ÷ 600 K."
      - "Give off the same entropy at 300 K: Q = 300 K · 1000/600 J/K."
    explanation: At least 500 J. At most 500 J become work – 50 %, exactly the Carnot value 1 − 300/600.
    difficulty: 3

srs:
  cards_from: [carnot, kelvin]
