id: sci.entropy.arrow
type: concept
title: The arrow of time
summary: Why things do not run backward.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: eis
    widget: choice
    prompt: An ice cube melts in warm tea. Why does the tea never turn back into ice and hot tea on its own?
    params:
      options:
        - { label: "It would be so unlikely that it practically never happens.", correct: true }
        - { label: A law of nature forbids the particle motion needed for it., feedback: "Each single motion would be allowed – only the combination is extremely unlikely." }
    hints:
      - Think of the particles in the box.
    explanation: The **second law** – in an isolated system, entropy does not decrease.

  - kind: problem
    id: richtung
    widget: buckets
    prompt: Does this happen on its own – or only with energy from outside?
    params:
      buckets: [{ label: on its own }, { label: only with energy }]
      items:
        - { label: Ink spreads in water, bucket: on its own }
        - { label: Hot coffee cools down, bucket: on its own }
        - { label: A refrigerator cools, bucket: only with energy }
        - { label: A room gets tidied up, bucket: only with energy }
    hints:
      - Does the disorder grow or shrink?
    explanation: Creating order costs energy – and creates more disorder somewhere else.

  - kind: explain
    id: s3
    body: |
      The laws of nature for single particles work forward and backward. Only the statistics of many particles gives time a **direction**: from ordered to disordered.

  - kind: problem
    id: leben
    widget: choice
    prompt: Living things build highly ordered structures. Do they break the second law?
    params:
      options:
        - { label: "No – they give off a lot of heat and disorder to their surroundings.", correct: true }
        - { label: "Yes", feedback: "Total entropy, including the surroundings, still grows." }
    hints:
      - What do we constantly give off to our surroundings?
    explanation: Life is an island of order, paid for with heat and waste.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does this film run forwards or backwards?
    params:
      buckets:
        - id: b1
          label: Forwards
        - id: b2
          label: Backwards
      items:
        - label: A glass shatters
          bucket: b1
        - label: Shards join into a glass
          bucket: b2
        - label: Milk spreads in the coffee
          bucket: b1
        - label: Smoke moves back into the candle
          bucket: b2
    hints:
      - What have you never seen?
    explanation: You spot the direction at once – by the growing disorder.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: By itself [[disorder]] grows. That gives time its [[direction]].
      distractors:
        - order
        - colour

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Your fridge makes its inside colder and more ordered. What happens to the entropy overall?
    params:
      options:
        - label: It rises – at the back it gives off more heat than it removes inside
          correct: true
        - label: It falls
          feedback: Only inside. Counting the kitchen, it rises.
        - label: It stays the same
          feedback: Real machines always produce extra entropy.
    hints:
      - Feel the back of a fridge.
    explanation: Entropy may fall locally – if it rises more elsewhere.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "When heat Q flows into a body at temperature T, its entropy grows by $\\Delta S = Q / T$. This formula of **Clausius** shows: the same heat brings more entropy to cold bodies."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: 334 J flow from tea (333 K) into an ice cube (273 K). By how many J/K does the total entropy rise? Calculate Q ÷ T for both. To two decimals.
    params:
      unit: J/K
    answer:
      value: 0.22
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 1.22) < 0.02
        misconception: one-side
        text: That is only the gain of the ice. The tea loses 334 ÷ 333 ≈ 1.00 J/K.
    hints:
      - "Ice: +334 ÷ 273 ≈ +1.22 J/K."
      - "Tea: −334 ÷ 333 ≈ −1.00 J/K. Add both."
    explanation: +1.22 − 1.00 ≈ +0.22 J/K. Whenever heat flows from hot to cold, entropy rises – the cold side gains more than the hot side loses. The reverse would make it fall.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "**Maxwell’s demon** sorts fast and slow molecules through a trapdoor – seemingly without work. Why does it not violate the second law?"
    params:
      options:
        - label: It must store information – and erasing it costs energy
          correct: true
        - label: Because demons do not exist
          feedback: A machine in this role could not get around it either.
        - label: Because the trapdoor is too heavy
          feedback: The argument also holds for a frictionless trapdoor.
    hints:
      - The demon must remember which molecule was fast.
    explanation: "**Landauer’s principle**: erasing one bit produces at least k · T · ln 2 of heat. Information is physical."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Four gas particles are sometimes all on the left – 10²³ particles never. What follows for the second law?
    params:
      options:
        - label: It holds statistically – for large numbers a violation is just unimaginably unlikely.
          correct: true
        - label: It fails only for four particles; otherwise it is strict.
          feedback: There is no sharp boundary. The probability just drops extremely fast.
        - label: It is wrong.
          feedback: No violation has ever been observed for macroscopic things.
    hints:
      - How large is 1 ÷ 2 to the 10²³?
      - Impossible and unimaginably unlikely – is there a difference?
    explanation: In tiny systems brief »backward« fluctuations are actually measured. For everyday things you would have to wait far longer than the age of the universe – billions of times over.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Landauer: erasing one bit of information costs at least the heat k · T · ln 2. How much is that at 300 K – in 10⁻²¹ J? To two decimals."
    answer:
      value: 2.87
      tolerance: 0.05
    hints:
      - k · T = 1.38 · 10⁻²³ · 300 = 4.14 · 10⁻²¹ J.
      - Times 0.693.
    explanation: "About 2.9 · 10⁻²¹ J per bit. Exactly this calculation saves the second law from Maxwell's demon: erasing his memory creates at least as much entropy as he gains."
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why time has a direction although the laws for single particles also work backwards.
    params:
      keywords:
        - - entropie
          - entropy
          - unordnung
          - disorder
        - - wahrscheinlich
          - likely
          - probab
          - zustände
          - states
          - möglichkeiten
          - ways
        - - viele
          - many
          - teilchen
          - particles
          - statistik
          - statistic
      sample: For a single particle forwards and backwards look the same. With many particles there are far more disordered than ordered states. So entropy almost surely grows – that gives time its direction.
    difficulty: 3

srs:
  cards_from: [eis, richtung]
