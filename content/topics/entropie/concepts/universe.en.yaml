id: sci.entropy.universe
type: concept
title: Entropy and the universe
summary: From the Big Bang to heat death.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The story of the universe
    body: "Since the Big Bang the universe has run like a clock that never goes back. Uncover the story step by step: where does growing **entropy** lead?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 💥
            front: Big Bang
            back: Everything starts hot, dense and amazingly smooth.
          - icon: ⭐
            front: Stars ignite
            back: Gravity clumps gas into stars. They shine for billions of years.
          - icon: 🕳️
            front: Black holes
            back: In the end mostly they are left – and even they evaporate very slowly.
          - icon: ❄️
            front: Far future
            back: Everything cools down. Will anything still happen then?

  - kind: problem
    id: hook
    widget: choice
    prompt: Hot coffee stands in a cold room. What never happens by itself?
    params:
      options:
        - label: The coffee gets hotter and the room colder
          correct: true
        - label: The coffee cools down
          feedback: That always happens.
        - label: The room gets a little warmer
          feedback: That happens too.
    hints:
      - Heat flows in one direction only.
    explanation: This one-way street holds for the whole universe.

  - kind: explain
    id: s1
    body: |
      The universe began in a state of very **low entropy**. Since then it has been rising: stars burn out, heat spreads. This increase drives everything that happens – including us.

  - kind: problem
    id: ende
    widget: choice
    prompt: What would the "heat death" of the universe be?
    params:
      options:
        - { label: Everything has the same temperature – nothing can do work anymore., correct: true }
        - { label: The universe becomes infinitely hot., feedback: "It becomes uniform – not hot. Without a gradient, nothing can happen." }
    hints:
      - What does every machine need?
    explanation: Without temperature differences, there is no drive left.

  - kind: problem
    id: sonne
    widget: order
    prompt: Put the energy chain in the right order.
    params:
      items:
        - { label: Nuclear fusion in the Sun }
        - { label: Light reaches Earth }
        - { label: Plants build sugar }
        - { label: We use the energy and give off heat }
    hints:
      - It starts with the Sun.
    explanation: We live off the gradient between the hot Sun and cold space.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: The probability that {{n}} coins all land on heads at random is 1 in …?
    params: { placeholder: "Number" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - Each coin halves the chance.
    explanation: "1 in {{2 ** n}} – order is rare even with just a few particles."
    variants:
      params: { n: "int[8,14]" }
      defaults: { n: 10 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The Sun sends energy to the Earth – and the Earth radiates just as much back. So what do we gain at all?
    params:
      options:
        - label: We receive few high-energy photons and emit many low-energy ones – that exports entropy
          correct: true
        - label: Nothing – the balance is zero
          feedback: The energy balance is, the entropy balance is not.
        - label: The Earth keeps part of the energy
          feedback: Then it would keep getting hotter.
    hints:
      - For every photon from the Sun the Earth emits about 20 infrared ones.
    explanation: "Life does not use energy but the **entropy flow**: ordered light in, disordered heat out."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Earth receives sunlight from a 5800 K surface and radiates the same energy back at about 290 K. The average photon energy is proportional to T. How many times more photons does Earth emit than it receives?
    answer:
      value: 20
      tolerance: 1
    hints:
      - Same energy, but each emitted photon is smaller.
      - 5800 ÷ 290 = ?
    explanation: About 20 times as many photons. Few high-energy photons become many low-energy ones – entropy rises sharply. Plants, weather and we all live off this gradient.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a cup break by itself but never reassemble by itself?"
    params:
      keywords:
        - - wahrscheinlich
          - likely
          - probab
          - unwahrscheinlich
        - - möglichkeit
          - zustände
          - anordnung
          - ways
          - states
          - arrangement
        - - unordnung
          - entropie
          - entropy
          - disorder
          - ordnung
          - order
      sample: There are unimaginably many arrangements for shards but only one for the whole cup. By itself everything moves to the more likely states – disorder, i.e. entropy, grows.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Shortly after the Big Bang the universe was hot and almost perfectly even. Why is that still considered a low-entropy state?
    params:
      options:
        - label: With gravity an even spread is ordered – clumps like stars and black holes have far more entropy.
          correct: true
        - label: Because there were no particles yet.
          feedback: There were plenty of particles. What matters is how gravity counts states.
        - label: Because it was very small.
          feedback: Size alone does not explain it. It is about how matter was distributed.
    hints:
      - For a gas in a box, even is likely. Is that true with gravity too?
      - Gravity makes matter clump on its own.
    explanation: "Without gravity evenness would be maximal disorder. With it, the opposite: matter clumps on its own and entropy rises. Black holes have the largest entropy of all."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Take a guess: in how many years will the last stars burn out, once there is no gas left to form new ones?"
    params:
      min: 1000000000
      max: 100000000000000000000
      scale: log
    answer:
      value: 100000000000000
      within: 90
    explanation: Roughly in 100 trillion years (10¹⁴). Small red dwarfs burn extremely slowly. After that only cold remnants remain – the universe approaches heat death.
    difficulty: 3

srs:
  cards_from: [ende, sonne]
