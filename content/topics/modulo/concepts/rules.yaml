id: math.modular.rules
type: concept
title: Teilbarkeitsregeln
summary: Teilbarkeit ohne Division.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ist 111 durch 3 teilbar? Rate, ohne zu rechnen.
    params:
      options:
        - label: Ja
          correct: true
        - label: Nein
          feedback: 3 · 37 = 111.
        - label: Das sieht man einer Zahl nicht an
          feedback: Doch – mit einem Trick.
    hints:
      - "Addiere die Ziffern: 1 + 1 + 1."
    explanation: Die Ziffern verraten es. Warum das klappt, siehst du gleich.

  - kind: explain
    id: s1
    body: |
      Eine Zahl ist durch 3 teilbar, wenn ihre **Quersumme** durch 3 teilbar ist – weil 10 beim Teilen durch 3 den Rest 1 lässt. Für 9 gilt dasselbe.

  - kind: problem
    id: quersumme
    widget: numeric
    prompt: Wie groß ist die Quersumme von {{n}}?
    params: { placeholder: "Quersumme" }
    answer: { value: "{{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}" }
    hints:
      - Addiere alle Ziffern.
    explanation: "Die Quersumme von {{n}} ist {{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}."
    variants:
      params: { n: "int[1000,9999]" }
      defaults: { n: 4725 }

  - kind: problem
    id: teilbar
    widget: buckets
    prompt: Durch 3 teilbar oder nicht?
    params:
      buckets: [{ label: teilbar }, { label: nicht teilbar }]
      items:
        - { label: "4725", bucket: teilbar }
        - { label: "1011", bucket: teilbar }
        - { label: "2024", bucket: nicht teilbar }
        - { label: "7777", bucket: nicht teilbar }
    hints:
      - "4 + 7 + 2 + 5 = 18."
    explanation: Quersummen 18 und 3 sind durch 3 teilbar, 8 und 28 nicht.

  - kind: problem
    id: regeln
    widget: match
    prompt: Welche Regel gilt für welchen Teiler?
    params:
      pairs:
        - { left: durch 2, right: letzte Ziffer gerade }
        - { left: durch 5, right: endet auf 0 oder 5 }
        - { left: durch 9, right: Quersumme durch 9 }
        - { left: durch 4, right: letzte zwei Ziffern durch 4 }
    hints:
      - 100 ist durch 4 teilbar – also zählen nur die letzten zwei Ziffern.
    explanation: Jede Regel nutzt, welchen Rest Zehnerpotenzen lassen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 123 456 ist durch 3 teilbar.
          right: true
        - text: 123 456 ist durch 9 teilbar.
          right: false
          why: Quersumme 21 – durch 3, aber nicht durch 9.
        - text: Eine Zahl ist durch 6 teilbar, wenn sie durch 2 und durch 3 teilbar ist.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Für die 11 bildet man die **Wechselsumme**: Ziffern abwechselnd plus und minus. Wie groß ist sie bei 9185 (9 − 1 + 8 − 5)?"
    answer:
      value: 11
    hints:
      - 9 − 1 = 8, 8 + 8 = 16, 16 − 5.
    explanation: 11 ist durch 11 teilbar – also auch 9185 = 11 · 835.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum funktioniert die Quersummenregel für die 9?
    params:
      options:
        - label: Weil 10, 100, 1000 … alle den Rest 1 beim Teilen durch 9 lassen
          correct: true
        - label: Weil 9 die größte Ziffer ist
          feedback: Entscheidend ist 10 = 9 + 1.
        - label: Weil 9 = 3 · 3 ist
          feedback: "Für die 3 gilt die Regel aus demselben Grund: 10 lässt Rest 1."
    hints:
      - Schreib 347 als 3 · 100 + 4 · 10 + 7.
    explanation: 3 · 100 + 4 · 10 + 7 hat denselben Rest wie 3 + 4 + 7. In einem anderen Zahlensystem gälte die Regel für eine andere Zahl.
    difficulty: 3

srs:
  cards_from: [teilbar, regeln]
