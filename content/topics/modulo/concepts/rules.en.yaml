id: math.modular.rules
type: concept
title: Divisibility Rules
summary: Divisibility without division.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      A number is divisible by 3 if its **digit sum** is divisible by 3 – because 10 leaves remainder 1 when divided by 3. The same holds for 9.

  - kind: problem
    id: quersumme
    widget: numeric
    prompt: What is the digit sum of {{n}}?
    params: { placeholder: "Digit sum" }
    answer: { value: "{{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}" }
    hints:
      - Add all the digits.
    explanation: "The digit sum of {{n}} is {{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}."
    variants:
      params: { n: "int[1000,9999]" }
      defaults: { n: 4725 }

  - kind: problem
    id: teilbar
    widget: buckets
    prompt: Divisible by 3 or not?
    params:
      buckets: [{ label: divisible }, { label: not divisible }]
      items:
        - { label: "4725", bucket: divisible }
        - { label: "1011", bucket: divisible }
        - { label: "2024", bucket: not divisible }
        - { label: "7777", bucket: not divisible }
    hints:
      - "4 + 7 + 2 + 5 = 18."
    explanation: The digit sums 18 and 3 are divisible by 3. 8 and 28 are not.

  - kind: problem
    id: regeln
    widget: match
    prompt: Which rule applies to which divisor?
    params:
      pairs:
        - { left: by 2, right: last digit even }
        - { left: by 5, right: ends in 0 or 5 }
        - { left: by 9, right: digit sum divisible by 9 }
        - { left: by 4, right: last two digits divisible by 4 }
    hints:
      - 100 is divisible by 4 – so only the last two digits count.
    explanation: Each rule uses the remainders that powers of ten leave.

srs:
  cards_from: [teilbar, regeln]
