id: math.modular.rules
type: concept
title: Divisibility Rules
summary: Divisibility without division.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A magic trick with 9
    body: Magicians love this trick, and it always works. Turn over the cards in order and calculate along. Then try a two-digit number of your own. The result is always divisible by 9 – the **digit sum** gives it away.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔢
            front: Think of 72
            back: Any two-digit number – here 72.
          - icon: 🔀
            front: Reverse it
            back: 72 becomes 27.
          - icon: ➖
            front: Subtract
            back: 72 − 27 = 45.
          - icon: 🎩
            front: Digit sum
            back: 4 + 5 = 9. The result is divisible by 9 – for every number!

  - kind: problem
    id: hook
    widget: choice
    prompt: Is 111 divisible by 3? Guess without calculating.
    params:
      options:
        - label: Yes
          correct: true
        - label: No
          feedback: 3 · 37 = 111.
        - label: You cannot tell from a number
          feedback: You can – with a trick.
    hints:
      - "Add the digits: 1 + 1 + 1."
    explanation: The digits give it away. You will see why in a moment.

  - kind: explain
    id: s1
    body: |
      A number is divisible by 3 if its **digit sum** is divisible by 3 – because 10 leaves remainder 1 when divided by 3. The same holds for 9.

  - kind: problem
    id: quersumme
    widget: numeric
    prompt: What is the digit sum of {{n}}?
    params: { placeholder: "Digit sum" }
    answer: { value: "{{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}" }
    hints:
      - Add all the digits.
    explanation: "The digit sum of {{n}} is {{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}."
    variants:
      params: { n: "int[1000,9999]" }
      defaults: { n: 4725 }

  - kind: problem
    id: teilbar
    widget: buckets
    prompt: Divisible by 3 or not?
    params:
      buckets: [{ label: divisible }, { label: not divisible }]
      items:
        - { label: "4725", bucket: divisible }
        - { label: "1011", bucket: divisible }
        - { label: "2024", bucket: not divisible }
        - { label: "7777", bucket: not divisible }
    hints:
      - "4 + 7 + 2 + 5 = 18."
    explanation: The digit sums 18 and 3 are divisible by 3. 8 and 28 are not.

  - kind: problem
    id: regeln
    widget: match
    prompt: Which rule applies to which divisor?
    params:
      pairs:
        - { left: by 2, right: last digit even }
        - { left: by 5, right: ends in 0 or 5 }
        - { left: by 9, right: digit sum divisible by 9 }
        - { left: by 4, right: last two digits divisible by 4 }
    hints:
      - 100 is divisible by 4 – so only the last two digits count.
    explanation: Each rule uses the remainders that powers of ten leave.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 123,456 is divisible by 3.
          right: true
        - text: 123,456 is divisible by 9.
          right: false
          why: Digit sum 21 – divisible by 3 but not by 9.
        - text: A number is divisible by 6 if it is divisible by 2 and by 3.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "For 11 you form the **alternating sum**: digits alternately plus and minus. What is it for 9185 (9 − 1 + 8 − 5)?"
    answer:
      value: 11
    hints:
      - 9 − 1 = 8, 8 + 8 = 16, 16 − 5.
    explanation: 11 is divisible by 11 – so 9185 = 11 · 835 is too.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: For 4 only the **last two digits** decide, because 100 is divisible by 4. For 8 the last three decide, because 1000 = 8 · 125.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: buckets
    prompt: Divisible by 4 or not?
    params:
      buckets:
        - id: b1
          label: Divisible by 4
        - id: b2
          label: Not divisible by 4
      items:
        - label: "1316"
          bucket: b1
        - label: "7500"
          bucket: b1
        - label: "9988"
          bucket: b1
        - label: "2022"
          bucket: b2
        - label: "1234"
          bucket: b2
        - label: "3030"
          bucket: b2
    hints:
      - Look only at the last two digits.
      - 16, 00 and 88 are multiples of 4.
    explanation: 16, 00 and 88 are divisible by 4; 22, 34 and 30 are not. The rest of the number is a multiple of 100.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: "Form the alternating sum of 918,082, starting from the right: 2 − 8 + 0 − … What do you get?"
    answer:
      value: -22
    feedback:
      - when: numval(state.input) == 22
        misconception: sign-order
        text: From the right it starts with + 2. Check the signs.
    hints:
      - "Digits from the right: 2, 8, 0, 8, 1, 9."
      - 2 − 8 + 0 − 8 + 1 − 9.
    explanation: "−22 is divisible by 11, so 918,082 is too. The reason: 10 ≡ −1 (mod 11), so the signs alternate."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does the digit-sum rule for 9 work?
    params:
      options:
        - label: Because 10, 100, 1000 … all leave remainder 1 when divided by 9
          correct: true
        - label: Because 9 is the largest digit
          feedback: What matters is 10 = 9 + 1.
        - label: Because 9 = 3 · 3
          feedback: "For 3 the rule holds for the same reason: 10 leaves remainder 1."
    hints:
      - Write 347 as 3 · 100 + 4 · 10 + 7.
    explanation: 3 · 100 + 4 · 10 + 7 has the same remainder as 3 + 4 + 7. In another number system the rule would hold for a different number.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: We have 1001 = 7 · 11 · 13 and 1000 ≡ −1 modulo 1001. Split a number into **blocks of three** from the right and take their alternating sum. It tells the remainder for 7, 11 and 13 at once.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "What remainder does 1,234,567 leave when divided by 7? Use the blocks of three: 567 − 234 + 1."
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 334
        misconception: not-reduced
        text: That is the block sum. Now divide it by 7.
    hints:
      - 567 − 234 + 1 = 334.
      - 334 = 7 · 47 + 5.
    explanation: "334 ≡ 5 (mod 7), so 1,234,567 is too. Check: 7 · 176,366 = 1,234,562."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Every six-digit number of the form abcabc is divisible by 7, 11 and 13. Compute 123,123 / 1001.
    answer:
      value: 123
    hints:
      - 123,123 = 123 · 1000 + 123.
      - Factor out 123.
    explanation: 123,123 = 123 · 1001 = 123 · 7 · 11 · 13. This works for every abc.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Tell Lux why the digit-sum rule for 3 works.
    params:
      keywords:
        - - zehn
          - "10"
          - ten
          - hundert
          - hundred
        - - rest 1
          - rest eins
          - remainder 1
          - remainder one
          - ≡ 1
        - - quersumme
          - ziffern
          - digit sum
          - digits
      sample: 10 leaves remainder 1 when divided by 3, and so do 100, 1000 and every power of ten. So modulo 3 each digit only counts its face value. The number has the same remainder as its digit sum.
    explanation: $10^k \equiv 1 \pmod 3$. Hence $\sum a_k 10^k \equiv \sum a_k$ – the number behaves like its digit sum.
    difficulty: 3

srs:
  cards_from: [teilbar, regeln]
