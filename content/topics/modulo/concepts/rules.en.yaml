id: math.modular.rules
type: concept
title: Divisibility Rules
summary: Divisibility without division.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Is 111 divisible by 3? Guess without calculating.
    params:
      options:
        - label: Yes
          correct: true
        - label: No
          feedback: 3 · 37 = 111.
        - label: You cannot tell from a number
          feedback: You can – with a trick.
    hints:
      - "Add the digits: 1 + 1 + 1."
    explanation: The digits give it away. You will see why in a moment.

  - kind: explain
    id: s1
    body: |
      A number is divisible by 3 if its **digit sum** is divisible by 3 – because 10 leaves remainder 1 when divided by 3. The same holds for 9.

  - kind: problem
    id: quersumme
    widget: numeric
    prompt: What is the digit sum of {{n}}?
    params: { placeholder: "Digit sum" }
    answer: { value: "{{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}" }
    hints:
      - Add all the digits.
    explanation: "The digit sum of {{n}} is {{floor(n / 1000) + mod(floor(n / 100), 10) + mod(floor(n / 10), 10) + mod(n, 10)}}."
    variants:
      params: { n: "int[1000,9999]" }
      defaults: { n: 4725 }

  - kind: problem
    id: teilbar
    widget: buckets
    prompt: Divisible by 3 or not?
    params:
      buckets: [{ label: divisible }, { label: not divisible }]
      items:
        - { label: "4725", bucket: divisible }
        - { label: "1011", bucket: divisible }
        - { label: "2024", bucket: not divisible }
        - { label: "7777", bucket: not divisible }
    hints:
      - "4 + 7 + 2 + 5 = 18."
    explanation: The digit sums 18 and 3 are divisible by 3. 8 and 28 are not.

  - kind: problem
    id: regeln
    widget: match
    prompt: Which rule applies to which divisor?
    params:
      pairs:
        - { left: by 2, right: last digit even }
        - { left: by 5, right: ends in 0 or 5 }
        - { left: by 9, right: digit sum divisible by 9 }
        - { left: by 4, right: last two digits divisible by 4 }
    hints:
      - 100 is divisible by 4 – so only the last two digits count.
    explanation: Each rule uses the remainders that powers of ten leave.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 123,456 is divisible by 3.
          right: true
        - text: 123,456 is divisible by 9.
          right: false
          why: Digit sum 21 – divisible by 3 but not by 9.
        - text: A number is divisible by 6 if it is divisible by 2 and by 3.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "For 11 you form the **alternating sum**: digits alternately plus and minus. What is it for 9185 (9 − 1 + 8 − 5)?"
    answer:
      value: 11
    hints:
      - 9 − 1 = 8, 8 + 8 = 16, 16 − 5.
    explanation: 11 is divisible by 11 – so 9185 = 11 · 835 is too.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does the digit-sum rule for 9 work?
    params:
      options:
        - label: Because 10, 100, 1000 … all leave remainder 1 when divided by 9
          correct: true
        - label: Because 9 is the largest digit
          feedback: What matters is 10 = 9 + 1.
        - label: Because 9 = 3 · 3
          feedback: "For 3 the rule holds for the same reason: 10 leaves remainder 1."
    hints:
      - Write 347 as 3 · 100 + 4 · 10 + 7.
    explanation: 3 · 100 + 4 · 10 + 7 has the same remainder as 3 + 4 + 7. In another number system the rule would hold for a different number.
    difficulty: 3

srs:
  cards_from: [teilbar, regeln]
