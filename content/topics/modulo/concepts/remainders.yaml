id: math.modular.remainders
type: concept
title: Muster der Reste
summary: Vielfache sichtbar machen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vielfache
    widget: pixels
    prompt: Schalte alle Zahlen mit Rest 0 beim Teilen durch 3 ein.
    params: { rows: 3, cols: 10, numbers: { start: 1 }, counter: true }
    answer:
      pattern:
        - "..#..#..#."
        - ".#..#..#.."
        - "#..#..#..#"
    hints:
      - Jede dritte Zahl.
    explanation: 3, 6, 9, … 30 – zehn Vielfache. Das Muster rutscht jede Zeile weiter.

  - kind: explain
    body: |
      Reste verhalten sich beim Rechnen gutmütig: Der Rest einer Summe ist der Rest der Summe der Reste. So kann man riesige Zahlen untersuchen, ohne sie auszurechnen.

  - kind: problem
    id: summe
    widget: numeric
    prompt: 1234 lässt beim Teilen durch 5 den Rest 4, 5678 den Rest 3. Welchen Rest lässt die Summe?
    params: { placeholder: "Rest" }
    answer: { value: 2 }
    hints:
      - 4 + 3 = 7 – und davon wieder der Rest bei 5.
    explanation: 7 mod 5 = 2. Probe – 6912 endet auf 2.

  - kind: problem
    id: gerade
    widget: buckets
    prompt: Welchen Rest lässt das Ergebnis beim Teilen durch 2?
    params:
      buckets: [{ label: Rest 0 }, { label: Rest 1 }]
      items:
        - { label: gerade + gerade, bucket: Rest 0 }
        - { label: ungerade + ungerade, bucket: Rest 0 }
        - { label: gerade + ungerade, bucket: Rest 1 }
        - { label: ungerade · ungerade, bucket: Rest 1 }
    hints:
      - Rechne mit den Resten 0 und 1.
    explanation: 1 + 1 = 2 hat Rest 0, 1 · 1 = 1 hat Rest 1.

srs:
  cards_from: [summe, gerade]
