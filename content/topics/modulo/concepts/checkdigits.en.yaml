id: math.modular.checkdigits
type: concept
title: Weighted Check Digits
summary: How barcodes catch typos.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One bit gives it away
    body: "When data travels by radio, a bit sometimes flips. A simple guard: the number of ones must be even. Flip a bit and count again. Does the error show? That is a **check digit** in miniature."
    visual:
      widget: bits
      interactive: true
      params:
        bits: 8
        initial: "10110100"
        placeValues: false
        showValue: false

  - kind: problem
    id: hook
    widget: choice
    prompt: The till beeps when it has misread a barcode. How does it know?
    params:
      options:
        - label: The last digit must fit the others
          correct: true
        - label: It knows every barcode in the world
          feedback: That would be far too many.
        - label: It guesses
          feedback: Then it would often be wrong.
    hints:
      - One digit carries no information about the product.
    explanation: The check digit is computed from the others.

  - kind: explain
    id: s1
    body: |
      In barcodes, the digits are weighted alternately by 1 and 3, then added. The **check digit** tops the sum up to the next multiple of 10. Because of the weights, swapped neighboring digits show up too.

  - kind: problem
    id: ergaenzen
    widget: numeric
    prompt: The weighted sum is {{s}}. Which check digit tops it up to the next multiple of 10?
    params: { placeholder: "Digit" }
    answer: { value: "{{mod(10 - mod(s, 10), 10)}}" }
    hints:
      - How much is missing to the next multiple of ten?
    explanation: "{{s}} + {{mod(10 - mod(s, 10), 10)}} is a multiple of 10."
    variants:
      params: { s: "int[40,99]" }
      defaults: { s: 47 }

  - kind: problem
    id: dreher
    widget: choice
    prompt: Someone swaps two neighboring digits, 2 and 4. Does the weighted check catch it?
    params:
      options:
        - { label: "Yes – the weights 1 and 3 change the sum.", correct: true }
        - { label: "No – the sum stays the same.", feedback: "Without weights it would. With the weights 1 and 3, the sum changes." }
    hints:
      - Compare 2 · 1 + 4 · 3 with 4 · 1 + 2 · 3.
    explanation: 14 versus 10 – the sum changes by 4, so the error shows.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Does it contain a check digit?
    params:
      buckets: [{ label: "yes" }, { label: "no" }]
      items:
        - { label: Supermarket barcode, bucket: "yes" }
        - { label: IBAN, bucket: "yes" }
        - { label: ISBN of a book, bucket: "yes" }
        - { label: House number, bucket: "no" }
    hints:
      - Where would a typo be costly?
    explanation: Everywhere numbers are typed in and errors cost money.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An ISBN starts 978-3-16-14841. The weighted sum (alternately ·1 and ·3) of these 12 digits is 100. What is the check digit?
    answer:
      value: 0
    hints:
      - Which digit completes 100 to the next multiple of 10?
    explanation: 100 is already a multiple of 10 – the check digit is 0.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Credit cards use the **Luhn algorithm**: from the right, every second digit is doubled. If the result is above 9, subtract 9. The sum of all digits must be divisible by 10."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: A Luhn check digit is appended to 1234. The 4 and the 2 are doubled. Which check digit makes the sum a multiple of 10?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 0
        misconception: no-doubling
        text: Without doubling the sum would be 10. Double the 4 and the 2.
    hints:
      - "Doubled: 4 → 8 and 2 → 4. Add 3 and 1."
      - 8 + 3 + 4 + 1 = 16. What is missing up to 20?
    explanation: 16 + 4 = 20. The full number is 12344. Luhn catches every single-digit typo and almost every swap.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which error does the check with weights 1 and 3 **not** detect?
    params:
      options:
        - label: Swapping two neighbouring digits that differ by 5
          correct: true
        - label: A single wrong digit
          feedback: That always shows – 1 and 3 are coprime to 10.
        - label: Swapping 3 and 4
          feedback: That changes the sum by 2 and is detected.
    hints:
      - Swapping a and b changes the sum by 2 · (a − b).
    explanation: 2 · 5 = 10 – the sum changes by a multiple of 10 and goes unnoticed.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: The old ISBN-10 works **modulo 11**, a prime. A wrong digit changes the sum by weight times error. Both are less than 11, and 11 is prime. So every such error is caught.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: The ISBN-10 3-16-148410-? has weights 10, 9, …, 2 for the first nine digits. Their weighted sum is 177. Which check value c makes 177 + c divisible by 11?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 1
        misconception: remainder-not-complement
        text: That is the remainder of 177. You need what is missing up to the next multiple.
    hints:
      - 177 = 16 · 11 + 1.
      - How many are missing up to 187 = 17 · 11?
    explanation: "c = 10. Since that is not a digit, it is written as X: ISBN 3-16-148410-X."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: how does a check digit notice that you made a typo?"
    params:
      keywords:
        - - summe
          - rechnet
          - sum
          - computes
        - - passt nicht
          - stimmt nicht
          - falsch
          - no longer fits
          - mismatch
          - wrong
        - - rest
          - vielfach
          - teilbar
          - remainder
          - multiple
          - divisible
      sample: The check digit is chosen so that a weighted sum of all digits is divisible by 10. If a typo changes a digit, the sum changes and the remainder no longer fits.
    explanation: A check digit is a calculation modulo n that works out for the correct number. Errors break that.
    difficulty: 3

srs:
  cards_from: [ergaenzen, dreher]
