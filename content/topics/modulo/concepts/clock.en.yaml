id: math.modular.clock
type: concept
title: Calculating Like a Clock
summary: After 24, it starts again at 0.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The clock starts over
    body: Clocks, calendars and weekdays count in circles. Turn over the cards in order and calculate along. What does the clock show when the sum jumps past 24? Only the **remainder** counts.
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🕘
            front: 9 o'clock
            back: You start a long day at 9 o'clock.
          - icon: ⏩
            front: Plus 8 hours
            back: 9 + 8 = 17. It is 17:00 – still normal.
          - icon: 🌙
            front: Plus 9 hours
            back: 17 + 9 = 26? The clock shows 2 a.m.!
          - icon: 🔁
            front: Only the remainder
            back: 26 divided by 24 leaves the remainder 2. Then the circle carries on.

  - kind: problem
    id: uhrzeit
    widget: numeric
    prompt: It is {{h}}:00 now. What time will it be in {{d}} hours? Give the hour.
    params: { unit: "h" }
    answer: { value: "{{mod(h + d, 24)}}" }
    feedback:
      - when: "numval(state.input) == h + d"
        misconception: no-wrap
        text: After 24:00, the next day starts again at 0.
    hints:
      - "{{h}} + {{d}} – and subtract anything over 24."
    explanation: "{{h + d}} − 24 = {{mod(h + d, 24)}}:00."
    variants:
      params: { h: "int[14,23]", d: "int[5,20]" }
      constraints: ["h + d >= 24"]
      defaults: { h: 20, d: 7 }

  - kind: explain
    id: s2
    body: |
      In **arithmetic modulo n**, only the remainder after dividing by n counts. Clocks work modulo 24 (or 12), weekdays modulo 7. You write $27 \bmod 24 = 3$.

  - kind: problem
    id: wochentag
    widget: choice
    prompt: Today is Monday. What day of the week will it be in 100 days?
    params:
      options:
        - { label: Wednesday, correct: true }
        - { label: Monday, feedback: "100 is not a multiple of 7 – there is a remainder." }
        - { label: Friday, feedback: "Work out the remainder of 100 divided by 7." }
    hints:
      - 100 = 14 · 7 + 2.
    explanation: After 14 full weeks, 2 days remain – Wednesday.

  - kind: problem
    id: tage
    widget: numeric
    prompt: What remainder is left when you divide {{n}} by 7?
    params: { placeholder: "Remainder" }
    answer: { value: "{{mod(n, 7)}}" }
    hints:
      - How many full weeks fit in?
    explanation: "{{n}} = {{floor(n / 7)}} · 7 + {{mod(n, 7)}}."
    variants:
      params: { n: "int[30,365]" }
      defaults: { n: 100 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 17 mod 5 = 2
          right: true
        - text: 20 mod 6 = 3
          right: false
          why: 20 = 3 · 6 + 2, so the remainder is 2.
        - text: In 48 hours it is the same time of day again.
          right: true
        - text: In 70 days it is the same weekday again.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: It is 22:00. What time is it in 1000 hours?
    answer:
      value: 14
    hints:
      - 1000 = 41 · 24 + 16.
    explanation: 22 + 16 = 38, and 38 mod 24 = 14.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Two numbers are **congruent** modulo n if they leave the same remainder when divided by n. We write $27 \\equiv 3 \\pmod{24}$. Equivalently: n divides the difference 27 − 3 = 24."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: choice
    prompt: 1 January 2025 was a Wednesday. Which weekday was 1 January 2026?
    params:
      options:
        - label: Thursday
          correct: true
        - label: A year is not exactly 52 weeks. 365 leaves a remainder when divided by 7.
          feedback: Ein Jahr sind nicht genau 52 Wochen. 365 lässt beim Teilen durch 7 einen Rest.
        - label: That would follow a leap year with 366 days. 2025 has 365.
          feedback: Das wäre nach einem Schaltjahr mit 366 Tagen. 2025 hat 365.
    hints:
      - How many days does 2025 have?
      - 365 = 52 · 7 + 1.
    explanation: "365 ≡ 1 (mod 7): every normal year the weekday moves on by one, after a leap year by two."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: What remainder does {{a}} · {{b}} leave when divided by 7? Work with the remainders, not the product.
    answer:
      value: "{{mod(a * b, 7)}}"
    hints:
      - "{{a}} ≡ {{mod(a, 7)}} and {{b}} ≡ {{mod(b, 7)}} (mod 7)."
      - Multiply the remainders and divide by 7 again.
    explanation: "{{mod(a, 7)}} · {{mod(b, 7)}} = {{mod(a, 7) * mod(b, 7)}} ≡ {{mod(a * b, 7)}} (mod 7)."
    difficulty: 2
    variants:
      params:
        a: int[20,99]
        b: int[20,99]
      constraints:
        - mod(a, 7) != 0
        - mod(b, 7) != 0
      defaults:
        a: 30
        b: 45

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is (−7) mod 5? The remainder always lies between 0 and 4.
    answer:
      value: 3
    hints:
      - Keep adding 5 until you land in the range 0 to 4.
    explanation: −7 + 10 = 3. Many programming languages return −2 here – a classic source of bugs.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "A number leaves remainder 2 when divided by 3 and 3 when divided by 5. Which is it? The **Chinese remainder theorem** says: if the divisors are coprime, there is exactly one solution modulo 3 · 5 = 15 – here 8."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "A puzzle from ancient China: a number leaves remainder 2 when divided by 3, remainder 3 by 5 and remainder 2 by 7. What is the smallest positive one?"
    answer:
      value: 23
    feedback:
      - when: numval(state.input) == 8
        misconception: partial
        text: 8 works for 3 and 5 but leaves remainder 1 for 7.
    hints:
      - "Remainder 2 for both 3 and 7 means remainder 2 for 21. Candidates: 2, 23, 44, …"
      - Which candidate leaves remainder 3 for 5?
    explanation: 23 = 7 · 3 + 2 = 4 · 5 + 3 = 3 · 7 + 2. All solutions are 23 + 105k. Computers use the theorem to compute with huge numbers in parallel.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do weekdays work modulo 7?"
    params:
      keywords:
        - - sieben
          - seven
          - woche
          - week
        - - rest
          - remainder
          - übrig
          - left
        - - wiederhol
          - kreis
          - zyklus
          - repeat
          - cycle
          - circle
      sample: After seven days the same weekday returns. Whole weeks change nothing; only the remainder after dividing by 7 counts. The days run in a circle.
    explanation: Whatever repeats after n steps is computed modulo n. Clocks use 12 or 24, angles 360.
    difficulty: 3

srs:
  cards_from: [uhrzeit, wochentag]
