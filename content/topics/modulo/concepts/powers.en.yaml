id: math.modular.powers
type: concept
title: Powers in a Circle
summary: Remainders repeat.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: zyklus
    widget: order
    prompt: The remainders of 2, 4, 8, 16, 32 when divided by 5. Put them in the right order.
    params:
      items:
        - { label: "2" }
        - { label: "4" }
        - { label: "3" }
        - { label: "1" }
    hints:
      - "8 mod 5 = 3, 16 mod 5 = 1."
    explanation: 2, 4, 3, 1 – after that, everything repeats.

  - kind: problem
    id: gross
    widget: numeric
    prompt: The remainders of powers of two modulo 5 repeat every 4 steps (2, 4, 3, 1). What remainder does 2 to the power of {{k}} leave?
    params: { placeholder: "Remainder" }
    answer: { value: "{{mod(2 ** k, 5)}}" }
    hints:
      - "What remainder is left when {{k}} is divided by 4?"
    explanation: "The cycle 2, 4, 3, 1 at position {{mod(k - 1, 4) + 1}} – so {{mod(2 ** k, 5)}}."
    variants:
      params: { k: "int[5,20]" }
      defaults: { k: 10 }

  - kind: explain
    id: s3
    body: |
      Powers modulo n are easy to compute but hard to reverse. **RSA**, one of the most important encryption methods, is built on exactly this. It raises huge numbers to powers modulo a number with hundreds of digits.

  - kind: problem
    id: rsa
    widget: choice
    prompt: Why is reversing it hard?
    params:
      options:
        - { label: The remainders jump around seemingly at random., correct: true }
        - { label: Because computers cannot divide., feedback: "Dividing is easy – there is just no shortcut back to the exponent." }
    hints:
      - Can you tell from a remainder which exponent produced it?
    explanation: Without the secret key, trial and error is practically the only way – hopeless with huge numbers.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What remainder does $3^{20}$ leave when divided by 7? The remainders of 3, 9, 27, … repeat every 6 steps.
    answer:
      value: 2
    hints:
      - 20 = 3 · 6 + 2, so as with 3².
    explanation: 3² = 9 leaves remainder 2.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "$3^{16}$ does not need 15 multiplications. Square four times: $3 \\to 3^2 \\to 3^4 \\to 3^8 \\to 3^{16}$. This lets RSA work with huge exponents in a flash. The trick is called **square-and-multiply**."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: How many squarings do you need to get from x to $x^{ {{2 ** k}} }$?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 ** k - 1
        misconception: naive
        text: That many multiplications you would need without the trick.
    hints:
      - Each squaring doubles the exponent.
      - $2^{ {{k}} } = {{2 ** k}}$.
    explanation: "{{k}} squarings instead of {{2 ** k - 1}} multiplications. The effort grows only with the number of digits of the exponent."
    difficulty: 2
    variants:
      params:
        k: int[3,10]
      defaults:
        k: 6

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: What remainder does $5^{100}$ leave when divided by 7? The remainders of 5, 25, 125, … repeat every 6 steps.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 1
        misconception: ignore-leftover
        text: 100 is not a multiple of 6. 4 steps are left over.
    hints:
      - 100 = 6 · 16 + 4.
      - $5^4 = 625$. Remainder for 7?
    explanation: $5^{100} \equiv 5^4 = 625 = 89 \cdot 7 + 2$. Remainder 2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Fermat’s little theorem: for a prime p and a not divisible by p we have …"
    params:
      options:
        - label: $a^{p-1}$ leaves remainder 1 when divided by p
          correct: true
        - label: $a^p$ leaves remainder 0
          feedback: Then a would be divisible by p.
        - label: $a^2$ leaves remainder 1
          feedback: 2² = 4 leaves remainder 4 for 7.
    hints:
      - Earlier the remainders modulo 7 repeated every 6 steps.
    explanation: For p = 7, p − 1 = 6. This theorem is the heart of RSA and of fast primality tests.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Why does Fermat hold? Multiply 1, 2, …, p − 1 by a. Modulo p you get the same numbers, just shuffled. So $a^{p-1} \cdot (p-1)! \equiv (p-1)!$, and cancelling gives $a^{p-1} \equiv 1$. This is **Fermat's little theorem**.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: 101 is a prime. What remainder does $3^{100}$ leave when divided by 101?
    answer:
      value: 1
    hints:
      - Here p = 101, so p − 1 = 100.
      - "Fermat: $a^{p-1} \\equiv 1 \\pmod p$."
    explanation: $3^{100} \equiv 1 \pmod{101}$ – without a single multiplication.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: It holds that $2^{340} \equiv 1 \pmod{341}$. So is 341 a prime?
    params:
      options:
        - label: No – 341 = 11 · 31 fools the test.
          correct: true
        - label: "Fermat only works one way: prime ⇒ remainder 1. Not the other way."
          feedback: "Fermat gilt nur in eine Richtung: Prim ⇒ Rest 1. Umgekehrt nicht."
        - label: Try small divisors like 11.
          feedback: Probiere kleine Teiler wie 11.
    hints:
      - "Fermat says: if p is prime, then … Does it work backwards?"
      - Try 341 / 11.
    explanation: 341 is the smallest Fermat pseudoprime to base 2. Real primality tests such as Miller–Rabin therefore check more than Fermat.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: numeric
    prompt: "Mini RSA with n = 33 = 3 · 11 and public exponent 3. Encrypt the message 4: what remainder does $4^3$ leave for 33?"
    answer:
      value: 31
    feedback:
      - when: numval(state.input) == 64
        misconception: not-reduced
        text: 64 is bigger than 33. Take the remainder.
    hints:
      - $4^3 = 64$.
      - 64 − 33 = 31.
    explanation: Ciphertext 31. Decryption uses d = 7, since 3 · 7 = 21 ≡ 1 (mod 20), and $31^7 \equiv 4 \pmod{33}$. To compute d you must factor 33 into 3 · 11.
    difficulty: 3

  - kind: problem
    id: mb-x5
    depth: 3
    widget: teach
    prompt: Tell Lux why $a^{p-1}$ always leaves remainder 1 modulo a prime p.
    params:
      keywords:
        - - vertauscht
          - gemischt
          - dieselben
          - shuffled
          - same
          - permut
        - - produkt
          - multipliz
          - product
          - multiply
        - - kürzen
          - teilen
          - cancel
          - divide
      sample: Multiplying all numbers 1 to p − 1 by a gives the same numbers modulo p, just shuffled. So the products are equal, except the left side has an extra a to the p − 1. Cancelling gives a to the p − 1 ≡ 1.
    explanation: Multiplying by a only shuffles the remainders. So the product is unchanged, and $a^{p-1}$ must be 1.
    difficulty: 3

srs:
  cards_from: [gross, rsa]
