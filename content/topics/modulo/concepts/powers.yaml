id: math.modular.powers
type: concept
title: Potenzen im Kreis
summary: Reste wiederholen sich.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Muster am Ende
    body: "Auf solchen Mustern baut Verschlüsselung auf. Verdopple immer weiter: 2, 4, 8, 16 … Die Zahlen werden riesig, doch ihre letzten Ziffern drehen sich im Kreis. Tippe alle an, die auf 6 enden. Siehst du den **Rhythmus**?"
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 2
        cols: 6
        labels:
          - - 2
            - 4
            - 8
            - 16
            - 32
            - 64
          - - 128
            - 256
            - 512
            - 1024
            - 2048
            - 4096

  - kind: problem
    id: zyklus
    widget: order
    prompt: Die Reste von 2, 4, 8, 16, 32 beim Teilen durch 5. Bring sie in die richtige Reihenfolge.
    params:
      items:
        - { label: "2" }
        - { label: "4" }
        - { label: "3" }
        - { label: "1" }
    hints:
      - "8 mod 5 = 3, 16 mod 5 = 1."
    explanation: 2, 4, 3, 1 – danach wiederholt sich alles.

  - kind: problem
    id: gross
    widget: numeric
    prompt: Die Reste von Zweierpotenzen modulo 5 wiederholen sich alle 4 Schritte (2, 4, 3, 1). Welchen Rest lässt 2 hoch {{k}}?
    params: { placeholder: "Rest" }
    answer: { value: "{{mod(2 ** k, 5)}}" }
    hints:
      - "Welcher Rest bleibt von {{k}} beim Teilen durch 4?"
    explanation: "Der Zyklus 2, 4, 3, 1 an Stelle {{mod(k - 1, 4) + 1}} – also {{mod(2 ** k, 5)}}."
    variants:
      params: { k: "int[5,20]" }
      defaults: { k: 10 }

  - kind: explain
    id: s3
    body: |
      Potenzen modulo n sind leicht zu berechnen, aber schwer umzukehren. Genau darauf baut **RSA**, eine der wichtigsten Verschlüsselungen: Es potenziert riesige Zahlen modulo einer Zahl mit Hunderten Stellen.

  - kind: problem
    id: rsa
    widget: choice
    prompt: Warum ist das Umkehren schwer?
    params:
      options:
        - { label: Die Reste springen scheinbar zufällig herum., correct: true }
        - { label: Weil Computer nicht dividieren können., feedback: "Dividieren ist leicht – es fehlt eine Abkürzung zurück zum Exponenten." }
    hints:
      - Sieht man einem Rest an, welcher Exponent ihn erzeugt hat?
    explanation: Ohne geheimen Schlüssel bleibt praktisch nur Ausprobieren – bei riesigen Zahlen aussichtslos.

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: Hier stehen die Zweierpotenzen von 2 bis 4096. Schalte alle ein, die beim Teilen durch 5 den Rest 1 lassen.
    params:
      rows: 2
      cols: 6
      counter: true
      labels:
        - - 2
          - 4
          - 8
          - 16
          - 32
          - 64
        - - 128
          - 256
          - 512
          - 1024
          - 2048
          - 4096
    answer:
      pattern:
        - ...#..
        - .#...#
    hints:
      - "Beim Teilen durch 5 zählt nur die letzte Ziffer: Rest 1 heißt, sie endet auf 1 oder 6."
      - Die Reste laufen im Kreis 2, 4, 3, 1 – jede vierte Potenz lässt den Rest 1.
    explanation: 16, 256 und 4096 lassen den Rest 1 – das sind $2^4$, $2^8$ und $2^{12}$. Die Reste wiederholen sich alle 4 Schritte.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Welchen Rest lässt $3^{20}$ beim Teilen durch 7? Die Reste von 3, 9, 27, … wiederholen sich alle 6 Schritte.
    answer:
      value: 2
    hints:
      - 20 = 3 · 6 + 2, also wie bei 3².
    explanation: 3² = 9 lässt Rest 2.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Für $3^{16}$ braucht man keine 15 Malaufgaben. Quadriere viermal: $3 \\to 3^2 \\to 3^4 \\to 3^8 \\to 3^{16}$. So rechnet RSA blitzschnell mit riesigen Hochzahlen. Der Trick heißt **Square-and-Multiply**."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie viele Quadrierungen brauchst du, um von x zu $x^{ {{2 ** k}} }$ zu kommen?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 ** k - 1
        misconception: naive
        text: So viele Multiplikationen bräuchte man ohne Trick.
    hints:
      - Jede Quadrierung verdoppelt den Exponenten.
      - $2^{ {{k}} } = {{2 ** k}}$.
    explanation: "{{k}} Quadrierungen statt {{2 ** k - 1}} Multiplikationen. Der Aufwand wächst nur mit der Stellenzahl des Exponenten."
    difficulty: 2
    variants:
      params:
        k: int[3,10]
      defaults:
        k: 6

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Welchen Rest lässt $5^{100}$ beim Teilen durch 7? Die Reste von 5, 25, 125, … wiederholen sich alle 6 Schritte.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 1
        misconception: ignore-leftover
        text: 100 ist kein Vielfaches von 6. Es bleiben 4 Schritte übrig.
    hints:
      - 100 = 6 · 16 + 4.
      - $5^4 = 625$. Rest bei 7?
    explanation: $5^{100} \equiv 5^4 = 625 = 89 \cdot 7 + 2$. Rest 2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Der kleine Satz von Fermat: Für eine Primzahl p und a nicht durch p teilbar gilt …"
    params:
      options:
        - label: $a^{p-1}$ lässt beim Teilen durch p den Rest 1
          correct: true
        - label: $a^p$ lässt den Rest 0
          feedback: Dann wäre a durch p teilbar.
        - label: $a^2$ lässt den Rest 1
          feedback: 2² = 4 lässt bei 7 den Rest 4.
    hints:
      - Vorhin wiederholten sich die Reste modulo 7 alle 6 Schritte.
    explanation: Für p = 7 ist p − 1 = 6. Dieser Satz ist das Herz von RSA und von schnellen Primzahltests.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Warum gilt Fermat? Multipliziere 1, 2, …, p − 1 mit a. Modulo p kommen dieselben Zahlen heraus, nur vertauscht. Also ist $a^{p-1} \cdot (p-1)! \equiv (p-1)!$, und Kürzen ergibt $a^{p-1} \equiv 1$. Das ist der **kleine Satz von Fermat**.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: 101 ist eine Primzahl. Welchen Rest lässt $3^{100}$ beim Teilen durch 101?
    answer:
      value: 1
    hints:
      - Hier ist p = 101, also p − 1 = 100.
      - "Fermat: $a^{p-1} \\equiv 1 \\pmod p$."
    explanation: $3^{100} \equiv 1 \pmod{101}$ – ohne eine einzige Multiplikation.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Es gilt $2^{340} \equiv 1 \pmod{341}$. Ist 341 also eine Primzahl?
    params:
      options:
        - label: Nein – 341 = 11 · 31 täuscht den Test.
          correct: true
        - label: Ja – Fermat beweist es.
          feedback: "Fermat gilt nur in eine Richtung: Prim ⇒ Rest 1. Umgekehrt nicht."
        - label: Das kann man nicht wissen.
          feedback: Probiere kleine Teiler wie 11.
    hints:
      - "Fermat sagt: Wenn p prim ist, dann … Gilt das auch rückwärts?"
      - "Teste 341 : 11."
    explanation: 341 ist die kleinste Fermat-Pseudoprimzahl zur Basis 2. Echte Primtests wie Miller-Rabin prüfen darum mehr als nur Fermat.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: numeric
    prompt: "Mini-RSA mit n = 33 = 3 · 11 und dem öffentlichen Exponenten 3. Verschlüssle die Nachricht 4: Welchen Rest lässt $4^3$ bei 33?"
    answer:
      value: 31
    feedback:
      - when: numval(state.input) == 64
        misconception: not-reduced
        text: 64 ist größer als 33. Nimm den Rest.
    hints:
      - $4^3 = 64$.
      - 64 − 33 = 31.
    explanation: Geheimtext 31. Entschlüsseln geht mit d = 7, denn 3 · 7 = 21 ≡ 1 (mod 20), und $31^7 \equiv 4 \pmod{33}$. Wer d berechnen will, muss 33 in 3 · 11 zerlegen.
    difficulty: 3

  - kind: problem
    id: mb-x5
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum $a^{p-1}$ modulo einer Primzahl p immer den Rest 1 lässt.
    params:
      keywords:
        - - vertauscht
          - gemischt
          - dieselben
          - shuffled
          - same
          - permut
        - - produkt
          - multipliz
          - product
          - multiply
        - - kürzen
          - teilen
          - cancel
          - divide
      sample: Multipliziere ich alle Zahlen 1 bis p − 1 mit a, erhalte ich modulo p dieselben Zahlen, nur vertauscht. Die Produkte sind also gleich, nur steht links noch a hoch p − 1. Kürzen ergibt a hoch p − 1 ≡ 1.
    explanation: Mal a vertauscht die Reste nur. Darum ist das Produkt gleich, und $a^{p-1}$ muss 1 sein.
    difficulty: 3

srs:
  cards_from: [gross, rsa]
