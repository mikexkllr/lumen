id: math.modular.clock
type: concept
title: Rechnen wie eine Uhr
summary: Nach 24 geht es wieder bei 0 los.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: uhrzeit
    widget: numeric
    prompt: Es ist {{h}} Uhr. Wie spät ist es in {{d}} Stunden?
    params: { unit: Uhr }
    answer: { value: "{{mod(h + d, 24)}}" }
    feedback:
      - when: "numval(state.input) == h + d"
        misconception: no-wrap
        text: Nach 24 Uhr beginnt der nächste Tag wieder bei 0.
    hints:
      - "{{h}} + {{d}} – und alles über 24 abziehen."
    explanation: "{{h + d}} − 24 = {{mod(h + d, 24)}} Uhr."
    variants:
      params: { h: "int[14,23]", d: "int[5,20]" }
      constraints: ["h + d >= 24"]
      defaults: { h: 20, d: 7 }

  - kind: explain
    id: s2
    body: |
      Beim **Rechnen modulo n** zählt nur der Rest beim Teilen durch n. Uhren rechnen modulo 24 (oder 12), Wochentage modulo 7. Man schreibt $27 \bmod 24 = 3$.

  - kind: problem
    id: wochentag
    widget: choice
    prompt: Heute ist Montag. Welcher Wochentag ist in 100 Tagen?
    params:
      options:
        - { label: Mittwoch, correct: true }
        - { label: Montag, feedback: "100 ist kein Vielfaches von 7 – es bleibt ein Rest." }
        - { label: Freitag, feedback: "Rechne den Rest von 100 geteilt durch 7." }
    hints:
      - 100 = 14 · 7 + 2.
    explanation: Nach 14 vollen Wochen sind es noch 2 Tage – Mittwoch.

  - kind: problem
    id: tage
    widget: numeric
    prompt: Welcher Rest bleibt, wenn man {{n}} durch 7 teilt?
    params: { placeholder: "Rest" }
    answer: { value: "{{mod(n, 7)}}" }
    hints:
      - Wie viele volle Wochen passen hinein?
    explanation: "{{n}} = {{floor(n / 7)}} · 7 + {{mod(n, 7)}}."
    variants:
      params: { n: "int[30,365]" }
      defaults: { n: 100 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 17 mod 5 = 2
          right: true
        - text: 20 mod 6 = 3
          right: false
          why: 20 = 3 · 6 + 2, also Rest 2.
        - text: In 48 Stunden ist es wieder dieselbe Uhrzeit.
          right: true
        - text: In 70 Tagen ist wieder derselbe Wochentag.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Es ist 22 Uhr. Wie spät ist es in 1000 Stunden?
    answer:
      value: 14
    hints:
      - 1000 = 41 · 24 + 16.
    explanation: 22 + 16 = 38, und 38 mod 24 = 14.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Zwei Zahlen sind **kongruent** modulo n, wenn sie beim Teilen durch n denselben Rest lassen. Man schreibt $27 \\equiv 3 \\pmod{24}$. Gleichwertig: n teilt die Differenz 27 − 3 = 24."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: choice
    prompt: Der 1. Januar 2025 war ein Mittwoch. Welcher Wochentag war der 1. Januar 2026?
    params:
      options:
        - label: Donnerstag
          correct: true
        - label: Mittwoch
          feedback: Ein Jahr sind nicht genau 52 Wochen. 365 lässt beim Teilen durch 7 einen Rest.
        - label: Freitag
          feedback: Das wäre nach einem Schaltjahr mit 366 Tagen. 2025 hat 365.
    hints:
      - Wie viele Tage hat 2025?
      - 365 = 52 · 7 + 1.
    explanation: "365 ≡ 1 (mod 7): Jedes normale Jahr rückt der Wochentag um einen Tag weiter, nach einem Schaltjahr um zwei."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Welchen Rest lässt {{a}} · {{b}} beim Teilen durch 7? Rechne mit den Resten, nicht mit dem Produkt.
    answer:
      value: "{{mod(a * b, 7)}}"
    hints:
      - "{{a}} ≡ {{mod(a, 7)}} und {{b}} ≡ {{mod(b, 7)}} (mod 7)."
      - Nimm die Reste mal und teile noch einmal durch 7.
    explanation: "{{mod(a, 7)}} · {{mod(b, 7)}} = {{mod(a, 7) * mod(b, 7)}} ≡ {{mod(a * b, 7)}} (mod 7)."
    difficulty: 2
    variants:
      params:
        a: int[20,99]
        b: int[20,99]
      constraints:
        - mod(a, 7) != 0
        - mod(b, 7) != 0
      defaults:
        a: 30
        b: 45

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Was ist (−7) mod 5? Der Rest liegt immer zwischen 0 und 4.
    answer:
      value: 3
    hints:
      - Addiere so lange 5, bis du im Bereich 0 bis 4 landest.
    explanation: −7 + 10 = 3. Viele Programmiersprachen liefern hier −2 – eine klassische Fehlerquelle.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Eine Zahl lässt bei 3 den Rest 2 und bei 5 den Rest 3. Welche ist es? Der **chinesische Restsatz** sagt: Sind die Teiler teilerfremd, gibt es modulo 3 · 5 = 15 genau eine Lösung – hier 8."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "Ein Rätsel aus dem alten China: Eine Zahl lässt bei 3 den Rest 2, bei 5 den Rest 3 und bei 7 den Rest 2. Wie heißt die kleinste positive?"
    answer:
      value: 23
    feedback:
      - when: numval(state.input) == 8
        misconception: partial
        text: 8 passt zu 3 und 5, lässt bei 7 aber den Rest 1.
    hints:
      - "Rest 2 bei 3 und bei 7 heißt: Rest 2 bei 21. Kandidaten: 2, 23, 44, …"
      - Welcher Kandidat lässt bei 5 den Rest 3?
    explanation: 23 = 7 · 3 + 2 = 4 · 5 + 3 = 3 · 7 + 2. Alle Lösungen sind 23 + 105k. Computer nutzen den Satz, um mit riesigen Zahlen parallel zu rechnen.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum rechnet man mit Wochentagen modulo 7?"
    params:
      keywords:
        - - sieben
          - seven
          - woche
          - week
        - - rest
          - remainder
          - übrig
          - left
        - - wiederhol
          - kreis
          - zyklus
          - repeat
          - cycle
          - circle
      sample: Nach sieben Tagen kommt derselbe Wochentag wieder. Ganze Wochen ändern also nichts, nur der Rest beim Teilen durch 7 zählt. Die Tage laufen im Kreis.
    explanation: Was sich nach n Schritten wiederholt, rechnet man modulo n. Uhren mit 12 oder 24, Winkel mit 360.
    difficulty: 3

srs:
  cards_from: [uhrzeit, wochentag]
