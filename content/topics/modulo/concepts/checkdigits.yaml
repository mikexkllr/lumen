id: math.modular.checkdigits
type: concept
title: Prüfziffern mit Gewicht
summary: Wie Barcodes Tippfehler finden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Bit verrät den Fehler
    body: "Beim Funken kippt manchmal ein Bit. Ein einfacher Schutz: Die Zahl der Einsen muss gerade sein. Schalte ein Bit um und zähl die Einsen nach. Fällt der Fehler auf? So arbeitet im Kleinen jede **Prüfziffer**."
    visual:
      widget: bits
      interactive: true
      params:
        bits: 8
        initial: "10110100"
        placeValues: false
        showValue: false

  - kind: problem
    id: hook
    widget: choice
    prompt: Die Kasse piept, wenn sie einen Barcode falsch gelesen hat. Woher weiß sie das?
    params:
      options:
        - label: Die letzte Ziffer muss zu den anderen passen
          correct: true
        - label: Sie kennt alle Barcodes der Welt
          feedback: Das wären viel zu viele.
        - label: Sie rät
          feedback: Dann würde sie oft falsch liegen.
    hints:
      - Eine Ziffer trägt keine Information über das Produkt.
    explanation: Die Prüfziffer wird aus den anderen berechnet.

  - kind: explain
    id: s1
    body: |
      Bei Barcodes werden die Ziffern abwechselnd mit 1 und 3 gewichtet und addiert. Die **Prüfziffer** ergänzt die Summe zum nächsten Vielfachen von 10. Durch das Gewicht fallen auch vertauschte Nachbarziffern auf.

  - kind: problem
    id: ergaenzen
    widget: numeric
    prompt: Die gewichtete Summe ist {{s}}. Welche Prüfziffer ergänzt sie zum nächsten Vielfachen von 10?
    params: { placeholder: "Ziffer" }
    answer: { value: "{{mod(10 - mod(s, 10), 10)}}" }
    hints:
      - Wie viel fehlt bis zur nächsten Zehnerzahl?
    explanation: "{{s}} + {{mod(10 - mod(s, 10), 10)}} ist ein Vielfaches von 10."
    variants:
      params: { s: "int[40,99]" }
      defaults: { s: 47 }

  - kind: problem
    id: dreher
    widget: choice
    prompt: Jemand vertauscht zwei Nachbarziffern 2 und 4. Erkennt die gewichtete Prüfung das?
    params:
      options:
        - { label: Ja – die Gewichte 1 und 3 ändern die Summe., correct: true }
        - { label: Nein – die Summe bleibt gleich., feedback: "Ohne Gewicht wäre das so – mit den Gewichten 1 und 3 ändert sich die Summe." }
    hints:
      - Vergleiche 2 · 1 + 4 · 3 mit 4 · 1 + 2 · 3.
    explanation: 14 gegen 10 – die Summe ändert sich um 4, der Fehler fällt auf.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Steckt eine Prüfziffer drin?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Barcode im Supermarkt, bucket: ja }
        - { label: IBAN, bucket: ja }
        - { label: ISBN eines Buches, bucket: ja }
        - { label: Hausnummer, bucket: nein }
    hints:
      - Wo würde ein Tippfehler teuer?
    explanation: Überall, wo Zahlen abgetippt werden und Fehler Geld kosten.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine ISBN beginnt 978-3-16-14841. Die gewichtete Summe (abwechselnd ·1 und ·3) dieser 12 Ziffern ist 100. Wie lautet die Prüfziffer?
    answer:
      value: 0
    hints:
      - Welche Ziffer ergänzt 100 zum nächsten Vielfachen von 10?
    explanation: 100 ist schon ein Vielfaches von 10 – die Prüfziffer ist 0.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Kreditkarten nutzen den **Luhn-Algorithmus**: Von rechts wird jede zweite Ziffer verdoppelt. Ist das Ergebnis über 9, zieht man 9 ab. Die Summe aller Ziffern muss durch 10 teilbar sein."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: An 1234 wird nach Luhn eine Prüfziffer angehängt. Verdoppelt werden 4 und 2. Welche Prüfziffer ergänzt die Summe zum Vielfachen von 10?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 0
        misconception: no-doubling
        text: Ohne Verdoppeln wäre die Summe 10. Verdopple 4 und 2.
    hints:
      - "Verdoppelt: 4 → 8 und 2 → 4. Dazu 3 und 1."
      - 8 + 3 + 4 + 1 = 16. Was fehlt bis 20?
    explanation: 16 + 4 = 20. Die vollständige Nummer ist 12344. Luhn erkennt jeden einzelnen Tippfehler und fast jeden Dreher.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welchen Fehler erkennt die Prüfung mit den Gewichten 1 und 3 **nicht**?
    params:
      options:
        - label: Das Vertauschen zweier Nachbarziffern, die sich um 5 unterscheiden
          correct: true
        - label: Eine einzelne falsche Ziffer
          feedback: Die fällt immer auf – 1 und 3 sind teilerfremd zu 10.
        - label: Das Vertauschen von 3 und 4
          feedback: Das ändert die Summe um 2 und fällt auf.
    hints:
      - Beim Vertauschen von a und b ändert sich die Summe um 2 · (a − b).
    explanation: 2 · 5 = 10 – die Summe ändert sich um ein Vielfaches von 10 und bleibt unauffällig.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Das alte ISBN-10 rechnet **modulo 11**, einer Primzahl. Eine falsche Ziffer ändert die Summe um Gewicht mal Fehler. Beide sind kleiner als 11, und 11 ist prim. Also fällt jeder solche Fehler auf.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Die ISBN-10 3-16-148410-? hat die Gewichte 10, 9, …, 2 für die ersten neun Ziffern. Ihre gewichtete Summe ist 177. Welcher Prüfwert c macht 177 + c durch 11 teilbar?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 1
        misconception: remainder-not-complement
        text: Das ist der Rest von 177. Gesucht ist, was bis zum nächsten Vielfachen fehlt.
    hints:
      - 177 = 16 · 11 + 1.
      - Bis 187 = 17 · 11 fehlen wie viele?
    explanation: "c = 10. Weil das keine Ziffer ist, schreibt man X: ISBN 3-16-148410-X."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie merkt eine Prüfziffer, dass du dich vertippt hast?"
    params:
      keywords:
        - - summe
          - rechnet
          - sum
          - computes
        - - passt nicht
          - stimmt nicht
          - falsch
          - no longer fits
          - mismatch
          - wrong
        - - rest
          - vielfach
          - teilbar
          - remainder
          - multiple
          - divisible
      sample: Die Prüfziffer ist so gewählt, dass eine gewichtete Summe aller Ziffern durch 10 teilbar ist. Ändert ein Tippfehler eine Ziffer, ändert sich die Summe, und der Rest passt nicht mehr.
    explanation: Eine Prüfziffer ist eine Rechnung modulo n, die zur richtigen Nummer aufgeht. Fehler zerstören das Aufgehen.
    difficulty: 3

srs:
  cards_from: [ergaenzen, dreher]
