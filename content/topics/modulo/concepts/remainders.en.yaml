id: math.modular.remainders
type: concept
title: Patterns of Remainders
summary: Making multiples visible.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vielfache
    widget: pixels
    prompt: Switch on all numbers that leave remainder 0 when divided by 3.
    params: { rows: 3, cols: 10, numbers: { start: 1 }, counter: true }
    answer:
      pattern:
        - "..#..#..#."
        - ".#..#..#.."
        - "#..#..#..#"
    hints:
      - Every third number.
    explanation: 3, 6, 9, … 30 – ten multiples. The pattern shifts further each row.

  - kind: explain
    body: |
      Remainders behave nicely in calculations: the remainder of a sum is the remainder of the sum of the remainders. That lets you study huge numbers without working them out.

  - kind: problem
    id: summe
    widget: numeric
    prompt: 1234 leaves remainder 4 when divided by 5, and 5678 leaves remainder 3. What remainder does the sum leave?
    params: { placeholder: "Remainder" }
    answer: { value: 2 }
    hints:
      - 4 + 3 = 7 – and take the remainder of that mod 5 again.
    explanation: 7 mod 5 = 2. Check – 6912 ends in 2.

  - kind: problem
    id: gerade
    widget: buckets
    prompt: What remainder does the result leave when divided by 2?
    params:
      buckets: [{ label: Remainder 0 }, { label: Remainder 1 }]
      items:
        - { label: even + even, bucket: Remainder 0 }
        - { label: odd + odd, bucket: Remainder 0 }
        - { label: even + odd, bucket: Remainder 1 }
        - { label: odd · odd, bucket: Remainder 1 }
    hints:
      - Calculate with the remainders 0 and 1.
    explanation: 1 + 1 = 2 has remainder 0, and 1 · 1 = 1 has remainder 1.

srs:
  cards_from: [summe, gerade]
