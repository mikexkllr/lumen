id: math.modular.remainders
type: concept
title: Patterns of Remainders
summary: Making multiples visible.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The calendar trick
    body: A monthly calendar is a worksheet for remainders. Tap the days in one column, say 3, 10, 17 and 24. What do they have in common when divided by 7? Each column collects one **remainder**.
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 4
        cols: 7
        numbers:
          start: 1

  - kind: problem
    id: vielfache
    widget: pixels
    prompt: Switch on all numbers that leave remainder 0 when divided by 3.
    params: { rows: 3, cols: 10, numbers: { start: 1 }, counter: true }
    answer:
      pattern:
        - "..#..#..#."
        - ".#..#..#.."
        - "#..#..#..#"
    hints:
      - Every third number.
    explanation: 3, 6, 9, … 30 – ten multiples. The pattern shifts further each row.

  - kind: explain
    id: s2
    body: |
      **Remainders** behave nicely in calculations: the remainder of a sum is the remainder of the sum of the remainders. That lets you study huge numbers without working them out.

  - kind: problem
    id: summe
    widget: numeric
    prompt: 1234 leaves remainder 4 when divided by 5, and 5678 leaves remainder 3. What remainder does the sum leave?
    params: { placeholder: "Remainder" }
    answer: { value: 2 }
    hints:
      - 4 + 3 = 7 – and take the remainder of that mod 5 again.
    explanation: 7 mod 5 = 2. Check – 6912 ends in 2.

  - kind: problem
    id: gerade
    widget: buckets
    prompt: What remainder does the result leave when divided by 2?
    params:
      buckets: [{ label: Remainder 0 }, { label: Remainder 1 }]
      items:
        - { label: even + even, bucket: Remainder 0 }
        - { label: odd + odd, bucket: Remainder 0 }
        - { label: even + odd, bucket: Remainder 1 }
        - { label: odd · odd, bucket: Remainder 1 }
    hints:
      - Calculate with the remainders 0 and 1.
    explanation: 1 + 1 = 2 has remainder 0, and 1 · 1 = 1 has remainder 1.

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: Switch on all numbers that leave the remainder 1 when divided by 4.
    params:
      rows: 3
      cols: 8
      numbers:
        start: 1
      counter: true
    answer:
      pattern:
        - "#...#..."
        - "#...#..."
        - "#...#..."
    hints:
      - 1 leaves the remainder 1. From there, go on in steps of 4.
      - 1, 5, 9, 13 … – they line up in two columns.
    explanation: 1, 5, 9, 13, 17 and 21 leave the remainder 1. With 8 columns the pattern repeats every 4 squares.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What remainder does 123 · 457 leave when divided by 10?
    answer:
      value: 1
    hints:
      - "Only the last digits count: 3 · 7."
    explanation: 3 · 7 = 21, so the remainder is 1. You may take remainders before calculating.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: What is the last digit of $3^{ {{k}} }$?
    answer:
      value: "{{c}}"
    hints:
      - "The last digits of 3, 9, 27, 81, 243 … repeat: 3, 9, 7, 1."
      - What remainder does {{k}} leave when divided by 4?
    explanation: "{{k}} ≡ {{mod(k, 4)}} (mod 4), so $3^{ {{k}} }$ ends in {{c}}."
    difficulty: 2
    variants:
      params:
        k: int[5,60]
      derive:
        c: "mod(k, 4) == 0 ? 1 : mod(k, 4) == 1 ? 3 : mod(k, 4) == 2 ? 9 : 7"
      defaults:
        k: 23

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: What remainder does $2^{100}$ leave when divided by 7?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 1
        misconception: ignore-leftover
        text: 2³ ≡ 1, but 100 is not a multiple of 3. A factor 2 is left over.
    hints:
      - 2³ = 8 ≡ 1 (mod 7).
      - 100 = 3 · 33 + 1, so $2^{100} = (2^3)^{33} \cdot 2$.
    explanation: $(2^3)^{33} \cdot 2 \equiv 1^{33} \cdot 2 = 2$. A 31-digit number – and its remainder in one line.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is the last digit of $7^{100}$?
    answer:
      value: 1
    hints:
      - "The last digits of 7, 49, 343, 2401 repeat: 7, 9, 3, 1."
    explanation: "The cycle has length 4, and 100 is divisible by 4. So as with 7⁴: last digit 1."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Modulo 7, 3 · 5 = 15 ≡ 1. So 5 plays the role of »1/3«. This is the **modular inverse**. It exists exactly when a and n are coprime.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Which number x between 1 and 8 satisfies 4 · x ≡ 1 (mod 9)?
    answer:
      value: 7
    hints:
      - Try 4 · 1, 4 · 2, … and divide each by 9.
      - You want a multiple of 4 that is one more than a multiple of 9.
    explanation: 4 · 7 = 28 = 3 · 9 + 1. For big numbers the extended Euclidean algorithm finds the inverse in a few steps.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Why does 2 have no inverse modulo 6?
    params:
      options:
        - label: 2 · x is always even – and never leaves remainder 1 for 6.
          correct: true
        - label: 5 · 5 = 25 ≡ 1 (mod 6) – 5 has one.
          feedback: 5 · 5 = 25 ≡ 1 (mod 6) – 5 hat eine.
        - label: 6 ≡ 0, not 1.
          feedback: 6 ≡ 0, nicht 1.
    hints:
      - Write out 2 · 1, 2 · 2, …, 2 · 5 modulo 6.
      - Only 0, 2 and 4 appear.
    explanation: A common divisor of a and n survives in every multiple. That is why you need gcd(a, n) = 1. Modulo a prime every number except 0 has an inverse.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Tell Lux: why may you take the remainders first when finding the remainder of a sum?"
    params:
      keywords:
        - - vielfache
          - vielfaches
          - multiple
          - multiples
        - - rest
          - remainder
        - - wegfallen
          - ändert nichts
          - zählt nicht
          - vanish
          - change nothing
          - irrelevant
      sample: Every number is a multiple of n plus its remainder. When I add two numbers, the multiples add up to another multiple of n and change nothing. Only the sum of the remainders counts.
    explanation: "a = qn + r: the part qn is invisible modulo n. The same goes for multiplying."
    difficulty: 3

srs:
  cards_from: [summe, gerade]
