id: sci.nuclear.radiation
type: concept
title: Drei Arten von Strahlung
summary: Alpha, Beta, Gamma.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Instabile Kerne zerfallen und senden Strahlung aus. **Alpha** sind Heliumkerne. **Beta** sind schnelle Elektronen. **Gamma** ist Licht mit sehr viel Energie. Jede Art dringt anders tief ein.

  - kind: problem
    id: abschirmen
    widget: match
    prompt: Was hält die Strahlung auf?
    params:
      pairs:
        - { left: Alpha, right: Ein Blatt Papier }
        - { left: Beta, right: Ein Alublech }
        - { left: Gamma, right: Dickes Blei }
    hints:
      - Schwere Teilchen bleiben früh stecken.
    explanation: Alpha ist schwer und bleibt sofort hängen – Gamma durchdringt fast alles.

  - kind: problem
    id: rest
    widget: numeric
    prompt: Wie viel Prozent eines radioaktiven Stoffes sind nach {{n}} Halbwertszeiten noch übrig?
    params: { unit: "%" }
    answer: { value: "{{100 / 2 ** n}}" }
    hints:
      - Jedes Mal halbieren.
    explanation: "100 : $2^{ {{n}} }$ = {{100 / 2 ** n}} %."
    variants:
      params: { n: "int[1,4]" }
      defaults: { n: 3 }

  - kind: problem
    id: innen
    widget: choice
    prompt: Alpha-Strahlung stoppt schon ein Blatt Papier. Wann ist sie trotzdem gefährlich?
    params:
      options:
        - { label: Wenn man den Stoff einatmet oder verschluckt., correct: true }
        - { label: Nie, feedback: "Im Körper trifft sie lebendes Gewebe direkt – ohne Schutzschicht." }
    hints:
      - Was schützt dich von außen, aber nicht von innen?
    explanation: Von außen hält die Haut Alpha auf – im Körper richtet sie großen Schaden an.

srs:
  cards_from: [abschirmen, innen]
