id: sci.nuclear.radiation
type: concept
title: Drei Arten von Strahlung
summary: Alpha, Beta, Gamma.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zerfall nach Fahrplan
    body: Radioaktive Stoffe werden mit der Zeit weniger – nach einer festen Regel. Lass die Zeit laufen und ändere die **Halbwertszeit**. Wie schnell schrumpft der Rest?
    visual:
      widget: sim
      interactive: true
      params:
        scene: decay

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Atomkerne zerfallen pro Sekunde in deinem eigenen Körper?"
    params:
      min: 1
      max: 1000000
      scale: log
    answer:
      value: 8000
      within: 70
    explanation: Rund 8000 – vor allem Kalium und Kohlenstoff. Völlig normal und harmlos.

  - kind: explain
    id: s1
    body: |
      Instabile Kerne zerfallen und senden Strahlung aus. **Alpha** sind Heliumkerne. **Beta** sind schnelle Elektronen. **Gamma** ist Licht mit sehr viel Energie. Jede Art dringt anders tief ein.

  - kind: problem
    id: abschirmen
    widget: match
    prompt: Was hält die Strahlung auf?
    params:
      pairs:
        - { left: Alpha, right: Ein Blatt Papier }
        - { left: Beta, right: Ein Alublech }
        - { left: Gamma, right: Dickes Blei }
    hints:
      - Schwere Teilchen bleiben früh stecken.
    explanation: Alpha ist schwer und bleibt sofort hängen – Gamma durchdringt fast alles.

  - kind: problem
    id: rest
    widget: numeric
    prompt: Wie viel Prozent eines radioaktiven Stoffes sind nach {{n}} Halbwertszeiten noch übrig?
    params: { unit: "%" }
    answer: { value: "{{100 / 2 ** n}}" }
    hints:
      - Jedes Mal halbieren.
    explanation: "100 : $2^{ {{n}} }$ = {{100 / 2 ** n}} %."
    variants:
      params: { n: "int[1,4]" }
      defaults: { n: 3 }

  - kind: problem
    id: innen
    widget: choice
    prompt: Alpha-Strahlung stoppt schon ein Blatt Papier. Wann ist sie trotzdem gefährlich?
    params:
      options:
        - { label: Wenn man den Stoff einatmet oder verschluckt., correct: true }
        - { label: Nie, feedback: "Im Körper trifft sie lebendes Gewebe direkt – ohne Schutzschicht." }
    hints:
      - Was schützt dich von außen, aber nicht von innen?
    explanation: Von außen hält die Haut Alpha auf – im Körper richtet sie großen Schaden an.

  - kind: problem
    id: c1
    widget: sim
    prompt: Ein Präparat hat 3 Stunden Halbwertszeit. Lass die Zeit laufen, bis nur noch **ein Viertel** übrig ist.
    params:
      scene: decay
      controls:
        halflife:
          value: 3
          fixed: true
    answer:
      left: 25
    explanation: Nach 6 Stunden – zwei Halbwertszeiten. Welches Atom wann zerfällt, ist reiner Zufall; die Statistik ist trotzdem exakt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Beim Alpha-Zerfall verliert ein Kern 2 Protonen und 2 Neutronen. Uran-238 (92 Protonen) zerfällt. Welche Massenzahl hat der neue Kern?
    answer:
      value: 234
    hints:
      - Ein Heliumkern hat die Massenzahl 4.
    explanation: "238 − 4 = 234, mit 90 Protonen: Thorium-234."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: "Kohlenstoff-14 (6 Protonen) zerfällt durch Beta-Minus: Ein Neutron wird zum Proton. Was entsteht?"
    params:
      options:
        - label: Stickstoff-14
          correct: true
        - label: Kohlenstoff-13
          feedback: Die Massenzahl bleibt gleich – es verschwindet kein Teilchen aus dem Kern.
        - label: Bor-14
          feedback: Bor hat 5 Protonen. Hier kommt ein Proton **dazu**.
    hints:
      - Wie viele Protonen hat der Kern danach?
      - Das Element mit 7 Protonen ist Stickstoff.
    explanation: "6 + 1 = 7 Protonen: Stickstoff. Die Massenzahl 14 bleibt, denn ein Neutron wurde nur umgewandelt. Das Elektron und ein Antineutrino fliegen davon."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: sim
    prompt: Ein Präparat hat 5 h Halbwertszeit. Finde den frühesten vollen Stundenwert, ab dem weniger als 10 % übrig sind.
    params:
      scene: decay
      controls:
        halflife:
          value: 5
          fixed: true
    answer:
      time: 17
    explanation: Nach 16 h sind noch 10,9 % da, nach 17 h 9,5 %. Gut drei Halbwertszeiten – pro Halbwertszeit bleibt die Hälfte.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Beim Beta-Zerfall verlässt ein Elektron den **Kern**. Dort gibt es doch gar keine Elektronen – woher kommt es?
    params:
      options:
        - label: Ein Neutron wandelt sich in ein Proton um – dabei entsteht das Elektron
          correct: true
        - label: Es stammt aus der Elektronenhülle
          feedback: Dann wäre es kein Kernzerfall, und das Element bliebe gleich.
        - label: Es war im Neutron versteckt
          feedback: Ein Neutron enthält kein Elektron – es wird neu erzeugt.
    hints:
      - Nach dem Zerfall hat der Kern ein Proton mehr.
    explanation: Die **schwache Wechselwirkung** wandelt Teilchen ineinander um. So wird aus Kohlenstoff-14 Stickstoff-14.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Jeder Kern zerfällt zufällig, aber mit fester Wahrscheinlichkeit λ pro Sekunde. Daraus folgt das **Zerfallsgesetz** $N(t) = N_0 \cdot e^{-\lambda t}$. Die Halbwertszeit ist $T_{1/2} = \frac{\ln 2}{\lambda}$.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Eine Probe hat 10²⁰ Kerne mit 1 Jahr Halbwertszeit (3,15 · 10⁷ s). Wie viele zerfallen pro Sekunde? Es gilt A = λ · N mit λ = ln 2 : T. In 10¹² Becquerel."
    answer:
      value: 2.2
      tolerance: 0.05
    hints:
      - "λ = 0,693 : 3,15 · 10⁷ s ≈ 2,2 · 10⁻⁸ pro s."
      - Mal 10²⁰ Kerne.
    explanation: A ≈ 2,2 · 10¹² Bq. Kurze Halbwertszeit heißt bei gleicher Kernzahl hohe Aktivität – der Stoff strahlt heftig, ist aber schnell verbraucht.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Kann man vorhersagen, wann ein bestimmter Urankern zerfallen wird?
    params:
      options:
        - label: Nein – nur die Wahrscheinlichkeit ist bekannt, der Zeitpunkt ist echter Zufall.
          correct: true
        - label: Ja, wenn man sein Alter kennt.
          feedback: Kerne altern nicht. Ein alter Kern zerfällt genauso wahrscheinlich wie ein neuer.
        - label: Ja, mit genug Rechenleistung.
          feedback: Der Zerfall ist ein Quantenprozess. Auch der beste Computer kennt den Moment nicht.
    hints:
      - Hat ein Kern ein Gedächtnis?
      - Die Halbwertszeit gilt für viele Kerne, nicht für einen.
    explanation: Radioaktiver Zerfall ist einer der wenigen echten Zufallsprozesse der Natur. Für viele Kerne ergibt sich trotzdem eine glatte Kurve – Statistik macht ihn berechenbar.
    difficulty: 3

srs:
  cards_from: [abschirmen, innen]
