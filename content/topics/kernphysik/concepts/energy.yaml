id: sci.nuclear.energy
type: concept
title: Spaltung und Fusion
summary: Energie aus dem Kern.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Lawine aus Neutronen
    body: "Ein gespaltener Urankern setzt Neutronen frei, die neue Kerne spalten. Zieh am Regler: Wie viele neue Spaltungen löst jede aus? Die Kurve zeigt die **Kettenreaktion** über zehn Schritte."
    visual:
      widget: slider
      interactive: true
      params:
        expr: k^x
        x:
          - 0
          - 10
        y:
          - 0
          - 1000
        sliders:
          - id: k
            label: Neue Spaltungen pro Spaltung
            min: 0.5
            max: 3
            step: 0.5
            initial: 1

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Tonnen Kohle liefern so viel Energie wie die Spaltung von 1 kg Uran-235?"
    params:
      min: 1
      max: 100000
      scale: log
      unit: t
    answer:
      value: 2700
      within: 70
    explanation: Rund 2700 Tonnen. Kernkräfte sind millionenfach stärker als chemische Bindungen.

  - kind: problem
    id: art
    widget: buckets
    prompt: Kernspaltung oder Kernfusion?
    params:
      buckets: [{ label: Spaltung }, { label: Fusion }]
      items:
        - { label: Heutige Kernkraftwerke, bucket: Spaltung }
        - { label: Schwere Urankerne zerbrechen, bucket: Spaltung }
        - { label: Die Sonne, bucket: Fusion }
        - { label: Leichte Kerne verschmelzen, bucket: Fusion }
    hints:
      - Spalten heißt teilen, Fusion heißt verschmelzen.
    explanation: Beides setzt Energie frei, weil die Produkte etwas weniger Masse haben – $E = mc^2$.

  - kind: explain
    id: s2
    body: |
      Bei der Spaltung setzt ein Urankern Neutronen frei, die weitere Kerne spalten – eine **Kettenreaktion**. Im Reaktor wird sie gezielt gebremst, damit genau ein Neutron pro Spaltung weitermacht.

  - kind: problem
    id: kette
    widget: numeric
    prompt: Jede Spaltung löst {{k}} neue aus. Wie viele Spaltungen gibt es in Generation {{g}}, wenn alles mit einer beginnt?
    params: { unit: Spaltungen }
    answer: { value: "{{k ** (g - 1)}}" }
    hints:
      - "Generation 1: 1, Generation 2: {{k}}, Generation 3: {{k * k}} …"
    explanation: "{{k}} hoch {{g - 1}} = {{k ** (g - 1)}} – ungebremst explodiert die Zahl."
    variants:
      params: { k: "int[2,3]", g: "int[4,6]" }
      defaults: { k: 2, g: 5 }

  - kind: problem
    id: fusion
    widget: choice
    prompt: Warum ist Kernfusion auf der Erde so schwer zu bauen?
    params:
      options:
        - { label: "Die Kerne stoßen sich ab und brauchen Millionen Grad, um zu verschmelzen.", correct: true }
        - { label: Es gibt keinen Brennstoff., feedback: "Wasserstoff-Isotope gibt es reichlich – das Problem ist die Hitze." }
    hints:
      - Positive Kerne stoßen sich ab.
    explanation: Man muss ein über 100 Millionen Grad heißes Plasma einschließen – ohne dass es eine Wand berührt.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Jede Spaltung löst gleich viele neue aus. Nach 10 Schritten sollen erstmals über 1000 Spaltungen laufen. Stelle den kleinsten Wert ein, der das schafft.
    params:
      expr: k^x
      x:
        - 0
        - 10
      y:
        - 0
        - 1200
      showCoordinates: false
      sliders:
        - id: k
          label: Neue Spaltungen pro Spaltung
          min: 0.5
          max: 3
          step: 0.5
          initial: 1
      markers:
        - x: 10
          y: 1000
          label: "1000"
    answer:
      values:
        k: 2
    hints:
      - Bei 1 bleibt die Zahl gleich, darüber wächst sie mit jedem Schritt.
      - Probier 1,5 und 2 und lies den Wert bei 10 Schritten ab.
    explanation: Mit 2 neuen Spaltungen pro Spaltung sind es nach 10 Schritten $2^{10} = 1024$. Mit 1,5 wären es erst 58.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einer Kettenreaktion löst jede Spaltung 2 neue aus. Nach wie vielen Generationen sind es über eine Million Spaltungen pro Generation?
    answer:
      value: 20
    hints:
      - 2 hoch 10 ist etwa 1000.
    explanation: 2²⁰ ≈ 1 Million. Bei einer Bombe dauern 80 Generationen weniger als eine Millionstel Sekunde.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Jede Spaltung eines U-235-Kerns liefert etwa 3,2 · 10⁻¹¹ J. Ein Reaktor gibt 3000 MW Wärme ab. Wie viele Spaltungen pro Sekunde sind das – in 10²⁰?
    answer:
      value: 0.94
      tolerance: 0.02
    hints:
      - 3000 MW = 3 · 10⁹ J pro Sekunde.
      - "3 · 10⁹ : 3,2 · 10⁻¹¹ = ?"
    explanation: Rund 10²⁰ Spaltungen pro Sekunde. Das klingt nach viel, sind aber nur etwa 37 mg Uran pro Sekunde.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Ein Reaktor läuft gleichmäßig. Wie viele neue Spaltungen löst jede Spaltung im Mittel aus?
    params:
      options:
        - label: Genau eine
          correct: true
        - label: Zwei bis drei
          feedback: So viele Neutronen werden frei. Der Rest wird absichtlich eingefangen.
        - label: Keine
          feedback: Dann würde die Kettenreaktion sofort erlöschen.
    hints:
      - Mehr als eins – die Leistung wächst. Weniger – sie sinkt.
      - Steuerstäbe fangen die überzähligen Neutronen ab.
    explanation: Bei genau 1 ist die Kette »kritisch« und die Leistung bleibt konstant. Steuerstäbe aus Bor oder Cadmium halten den Faktor dort. Bei einer Bombe liegt er deutlich über 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum setzen sowohl die **Spaltung** schwerer als auch die **Fusion** leichter Kerne Energie frei?
    params:
      options:
        - label: Mittelschwere Kerne wie Eisen sind am festesten gebunden – beide Wege führen dorthin
          correct: true
        - label: Weil jede Kernreaktion Energie freisetzt
          feedback: Eisen zu spalten oder zu fusionieren **kostet** Energie.
        - label: Das ist ein Widerspruch – nur eines stimmt
          feedback: "Beides ist real: Reaktoren spalten, Sterne fusionieren."
    hints:
      - Die Bindungsenergie pro Kernteilchen hat ein Maximum bei Eisen.
    explanation: Darum endet die Fusion in Sternen bei Eisen. Schwerere Elemente entstehen in Supernovae und Neutronenstern-Kollisionen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Kernspaltung und Kernfusion.
    params:
      keywords:
        - - spalt
          - teil
          - zerfäll
          - split
          - fission
          - break
        - - verschmelz
          - fusion
          - vereinig
          - fuse
          - merge
          - combine
        - - schwer
          - heavy
          - uran
          - uranium
        - - leicht
          - light
          - wasserstoff
          - hydrogen
          - sonne
          - sun
      min: 3
      sample: Bei der Spaltung zerfällt ein schwerer Kern wie Uran in zwei kleinere. Bei der Fusion verschmelzen leichte Kerne wie Wasserstoff zu einem größeren – so leuchtet die Sonne.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Bei der Spaltung von 1 kg U-235 verschwinden etwa 0,9 g Masse. Wie viel Energie ist das nach E = mc² – in 10¹³ J? (c = 3 · 10⁸ m/s)
    answer:
      value: 8.1
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 8100) < 10
        misconception: grams
        text: "Rechne in Kilogramm: 0,9 g = 0,0009 kg."
    hints:
      - m = 9 · 10⁻⁴ kg, c² = 9 · 10¹⁶ m²/s².
      - 9 · 10⁻⁴ · 9 · 10¹⁶ = ?
    explanation: 8,1 · 10¹³ J. Kohle liefert 3 · 10⁷ J pro kg – man bräuchte 2700 Tonnen. Das ist genau die Zahl vom Anfang der Lektion.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Fusion: Deuterium + Tritium (5 Nukleonen) liefert 17,6 MeV. Spaltung von U-235 (236 Nukleonen mit dem Neutron) liefert 200 MeV. Wievielmal mehr Energie pro Nukleon bringt die Fusion? Auf eine Stelle."
    answer:
      value: 4.2
      tolerance: 0.2
    hints:
      - "Fusion: 17,6 : 5 ≈ 3,5 MeV pro Nukleon."
      - "Spaltung: 200 : 236 ≈ 0,85 MeV pro Nukleon."
    explanation: "3,52 : 0,85 ≈ 4,2. Pro Kilogramm Brennstoff liefert Fusion also etwa viermal so viel Energie – und Deuterium steckt in jedem Wassertropfen."
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Warum braucht ein Uranreaktor einen Moderator wie Wasser oder Graphit?
    params:
      options:
        - label: Er bremst die schnellen Neutronen – langsame spalten U-235 viel leichter.
          correct: true
        - label: Er kühlt den Reaktor.
          feedback: Wasser kann zusätzlich kühlen. Der Moderator selbst bremst Neutronen.
        - label: Er schluckt alle Neutronen.
          feedback: Dann käme die Kette zum Erliegen. Das tun Steuerstäbe – teilweise.
    hints:
      - Neutronen kommen sehr schnell aus der Spaltung.
      - Ein langsames Neutron bleibt länger in der Nähe des Kerns.
    explanation: Bei Stößen mit leichten Kernen verlieren Neutronen viel Tempo – wie eine Billardkugel an einer gleich schweren. Langsame Neutronen werden von U-235 hundertfach leichter eingefangen.
    difficulty: 3

srs:
  cards_from: [art, fusion]
