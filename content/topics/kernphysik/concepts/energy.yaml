id: sci.nuclear.energy
type: concept
title: Spaltung und Fusion
summary: Energie aus dem Kern.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Tonnen Kohle liefern so viel Energie wie die Spaltung von 1 kg Uran-235?"
    params:
      min: 1
      max: 100000
      scale: log
      unit: t
    answer:
      value: 2700
      within: 70
    explanation: Rund 2700 Tonnen. Kernkräfte sind millionenfach stärker als chemische Bindungen.

  - kind: problem
    id: art
    widget: buckets
    prompt: Kernspaltung oder Kernfusion?
    params:
      buckets: [{ label: Spaltung }, { label: Fusion }]
      items:
        - { label: Heutige Kernkraftwerke, bucket: Spaltung }
        - { label: Schwere Urankerne zerbrechen, bucket: Spaltung }
        - { label: Die Sonne, bucket: Fusion }
        - { label: Leichte Kerne verschmelzen, bucket: Fusion }
    hints:
      - Spalten heißt teilen, Fusion heißt verschmelzen.
    explanation: Beides setzt Energie frei, weil die Produkte etwas weniger Masse haben – $E = mc^2$.

  - kind: explain
    id: s2
    body: |
      Bei der Spaltung setzt ein Urankern Neutronen frei, die weitere Kerne spalten – eine **Kettenreaktion**. Im Reaktor wird sie gezielt gebremst, damit genau ein Neutron pro Spaltung weitermacht.

  - kind: problem
    id: kette
    widget: numeric
    prompt: Jede Spaltung löst {{k}} neue aus. Wie viele Spaltungen gibt es in Generation {{g}}, wenn alles mit einer beginnt?
    params: { unit: Spaltungen }
    answer: { value: "{{k ** (g - 1)}}" }
    hints:
      - "Generation 1: 1, Generation 2: {{k}}, Generation 3: {{k * k}} …"
    explanation: "{{k}} hoch {{g - 1}} = {{k ** (g - 1)}} – ungebremst explodiert die Zahl."
    variants:
      params: { k: "int[2,3]", g: "int[4,6]" }
      defaults: { k: 2, g: 5 }

  - kind: problem
    id: fusion
    widget: choice
    prompt: Warum ist Kernfusion auf der Erde so schwer zu bauen?
    params:
      options:
        - { label: "Die Kerne stoßen sich ab und brauchen Millionen Grad, um zu verschmelzen.", correct: true }
        - { label: Es gibt keinen Brennstoff., feedback: "Wasserstoff-Isotope gibt es reichlich – das Problem ist die Hitze." }
    hints:
      - Positive Kerne stoßen sich ab.
    explanation: Man muss ein über 100 Millionen Grad heißes Plasma einschließen – ohne dass es eine Wand berührt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einer Kettenreaktion löst jede Spaltung 2 neue aus. Nach wie vielen Generationen sind es über eine Million Spaltungen pro Generation?
    answer:
      value: 20
    hints:
      - 2 hoch 10 ist etwa 1000.
    explanation: 2²⁰ ≈ 1 Million. Bei einer Bombe dauern 80 Generationen weniger als eine Millionstel Sekunde.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum setzen sowohl die **Spaltung** schwerer als auch die **Fusion** leichter Kerne Energie frei?
    params:
      options:
        - label: Mittelschwere Kerne wie Eisen sind am festesten gebunden – beide Wege führen dorthin
          correct: true
        - label: Weil jede Kernreaktion Energie freisetzt
          feedback: Eisen zu spalten oder zu fusionieren **kostet** Energie.
        - label: Das ist ein Widerspruch – nur eines stimmt
          feedback: "Beides ist real: Reaktoren spalten, Sterne fusionieren."
    hints:
      - Die Bindungsenergie pro Kernteilchen hat ein Maximum bei Eisen.
    explanation: Darum endet die Fusion in Sternen bei Eisen. Schwerere Elemente entstehen in Supernovae und Neutronenstern-Kollisionen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Kernspaltung und Kernfusion.
    params:
      keywords:
        - - spalt
          - teil
          - zerfäll
          - split
          - fission
          - break
        - - verschmelz
          - fusion
          - vereinig
          - fuse
          - merge
          - combine
        - - schwer
          - heavy
          - uran
          - uranium
        - - leicht
          - light
          - wasserstoff
          - hydrogen
          - sonne
          - sun
      min: 3
      sample: Bei der Spaltung zerfällt ein schwerer Kern wie Uran in zwei kleinere. Bei der Fusion verschmelzen leichte Kerne wie Wasserstoff zu einem größeren – so leuchtet die Sonne.
    difficulty: 3

srs:
  cards_from: [art, fusion]
