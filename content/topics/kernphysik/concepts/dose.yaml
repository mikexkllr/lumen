id: sci.nuclear.dose
type: concept
title: Strahlung im Alltag
summary: Dosen vergleichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Wir sind ständig Strahlung ausgesetzt – aus Gestein, dem All und sogar unserer Nahrung. Die Wirkung auf den Körper misst man in **Millisievert** (mSv). In Deutschland sind es im Schnitt etwa 2 mSv natürliche Strahlung pro Jahr.

  - kind: problem
    id: jahre
    widget: numeric
    prompt: Wie viel natürliche Strahlung kommt in {{y}} Jahren bei 2 mSv pro Jahr zusammen?
    params: { unit: mSv }
    answer: { value: "{{2 * y}}" }
    hints:
      - "2 · {{y}}."
    explanation: "{{2 * y}} mSv – ganz ohne Kraftwerk oder Arzt."
    variants:
      params: { y: "int[5,40]" }
      defaults: { y: 10 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne nach der Strahlendosis, die kleinste zuerst.
    params:
      items:
        - { label: Eine Banane essen }
        - { label: Zahnröntgen }
        - { label: Flug nach New York }
        - { label: CT-Aufnahme des Bauchs }
    hints:
      - Ein CT ist eine ganze Serie von Röntgenbildern.
    explanation: Banane etwa 0,0001, Zahnröntgen 0,005, Flug 0,05, CT rund 10 mSv.

  - kind: problem
    id: flug
    widget: choice
    prompt: Warum bekommt man beim Fliegen mehr Strahlung ab?
    params:
      options:
        - { label: Oben schirmt weniger Luft die kosmische Strahlung ab., correct: true }
        - { label: Das Flugzeug strahlt., feedback: "Die Strahlung kommt aus dem All – die Luft schützt am Boden." }
    hints:
      - Was liegt am Boden über dir, im Flugzeug nicht?
    explanation: Die Atmosphäre wirkt wie ein dicker Schutzschild.

srs:
  cards_from: [ordnen, flug]
