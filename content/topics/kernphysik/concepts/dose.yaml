id: sci.nuclear.dose
type: concept
title: Strahlung im Alltag
summary: Dosen vergleichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was strahlt stärker: eine Banane oder ein Apfel?"
    params:
      options:
        - label: Die Banane
          correct: true
        - label: Der Apfel
          feedback: Er enthält weniger Kalium.
        - label: Keins von beiden strahlt
          feedback: Fast alles strahlt ein wenig.
    hints:
      - Bananen enthalten viel Kalium.
    explanation: Ein winziger Teil des Kaliums ist radioaktiv. Gefährlich ist das nicht.

  - kind: explain
    id: s1
    body: |
      Wir sind ständig Strahlung ausgesetzt – aus Gestein, dem All und sogar unserer Nahrung. Die Wirkung auf den Körper misst man in **Millisievert** (mSv). In Deutschland sind es im Schnitt etwa 2 mSv natürliche Strahlung pro Jahr.

  - kind: problem
    id: jahre
    widget: numeric
    prompt: Wie viel natürliche Strahlung kommt in {{y}} Jahren bei 2 mSv pro Jahr zusammen?
    params: { unit: mSv }
    answer: { value: "{{2 * y}}" }
    hints:
      - "2 · {{y}}."
    explanation: "{{2 * y}} mSv – ganz ohne Kraftwerk oder Arzt."
    variants:
      params: { y: "int[5,40]" }
      defaults: { y: 10 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne nach der Strahlendosis, die kleinste zuerst.
    params:
      items:
        - { label: Eine Banane essen }
        - { label: Zahnröntgen }
        - { label: Flug nach New York }
        - { label: CT-Aufnahme des Bauchs }
    hints:
      - Ein CT ist eine ganze Serie von Röntgenbildern.
    explanation: Banane etwa 0,0001, Zahnröntgen 0,005, Flug 0,05, CT rund 10 mSv.

  - kind: problem
    id: flug
    widget: choice
    prompt: Warum bekommt man beim Fliegen mehr Strahlung ab?
    params:
      options:
        - { label: Oben schirmt weniger Luft die kosmische Strahlung ab., correct: true }
        - { label: Das Flugzeug strahlt., feedback: "Die Strahlung kommt aus dem All – die Luft schützt am Boden." }
    hints:
      - Was liegt am Boden über dir, im Flugzeug nicht?
    explanation: Die Atmosphäre wirkt wie ein dicker Schutzschild.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Bananen sind leicht radioaktiv.
          right: true
        - text: Bestrahlte Lebensmittel werden selbst radioaktiv.
          right: false
          why: Bestrahlung tötet Keime, macht das Essen aber nicht zur Quelle.
        - text: Ein Flug über den Atlantik bringt mehr Strahlung als ein Zahnröntgenbild.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein CT des Bauches bringt etwa 10 mSv. Wie vielen Jahren natürlicher Strahlung (2 mSv pro Jahr) entspricht das?
    params:
      unit: Jahre
    answer:
      value: 5
    hints:
      - "10 : 2."
    explanation: 5 Jahre. Medizinisch meist gut begründet – aber kein Grund für unnötige Aufnahmen.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Eine Banane bringt etwa 0,1 µSv. Ein Flug Frankfurt–New York etwa 50 µSv. Wie vielen Bananen entspricht der Flug?"
    params:
      min: 1
      max: 100000
      scale: log
    answer:
      value: 500
      within: 50
    explanation: "50 : 0,1 = 500 Bananen. Beides ist harmlos – ein Jahr natürliche Strahlung sind rund 20 000 Bananen."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Die Energiedosis 1 Gray heißt 1 Joule pro kg Körper. Ein Mensch mit 70 kg nimmt 0,001 Gy auf. Wie viel Energie in Joule ist das?
    params:
      unit: J
    answer:
      value: 0.07
    hints:
      - Energie = Dosis · Masse.
      - 0,001 · 70 = ?
    explanation: Nur 0,07 J – so viel Wärme bekommt man in einem Bruchteil einer Sekunde von einer Kerze. Strahlung schadet nicht durch Wärme, sondern weil einzelne Treffer Moleküle wie die DNA zerreißen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist dieselbe Energiedosis von Alpha-Strahlung im Körper etwa 20-mal schädlicher als von Gamma-Strahlung?
    params:
      options:
        - label: Alpha-Teilchen geben ihre Energie auf sehr kurzer Strecke ab und treffen einzelne Zellen geballt
          correct: true
        - label: Alpha-Teilchen sind schneller
          feedback: Sie sind langsamer – aber schwer und doppelt geladen.
        - label: Gamma-Strahlung ist harmlos
          feedback: Sie schadet auch – nur verteilt sich die Energie auf viel mehr Gewebe.
    hints:
      - Dieselbe Energie – auf einer Zelle oder auf einer Million Zellen verteilt?
    explanation: "Darum gibt es das **Sievert**: Es gewichtet die Energie mit der biologischen Wirkung."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Die **Äquivalentdosis** in Sievert ist die Energiedosis in Gray mal einem Wichtungsfaktor. Er ist 1 für Gamma und Beta, aber 20 für Alpha. So zählt, wie dicht die Teilchen ihre Energie abladen.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Radon im Keller gibt der Lunge 0,5 mGy Alpha-Strahlung. Wie groß ist die Äquivalentdosis – in mSv?
    params:
      unit: mSv
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 0.5
        misconception: forgot-weighting
        text: Bei Alpha zählt jedes Gray zwanzigfach.
    hints:
      - "Wichtungsfaktor für Alpha: 20."
      - 0,5 · 20 = ?
    explanation: 0,5 mGy · 20 = 10 mSv. Darum ist Radon in Deutschland die größte Quelle natürlicher Strahlung – und Lüften so wirksam.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Ab welcher kurzzeitigen Ganzkörperdosis stirbt etwa die Hälfte der Menschen ohne Behandlung?
    params:
      options:
        - label: Etwa 4 bis 5 Sievert
          correct: true
        - label: Etwa 5 Millisievert
          feedback: Das ist nur etwas mehr als die natürliche Jahresdosis – völlig ungefährlich.
        - label: Etwa 50 Millisievert
          feedback: So viel bringen einige CTs. Akute Strahlenkrankheit beginnt erst ab etwa 1 Sv.
    hints:
      - Ein CT bringt etwa 10 mSv – und ist erlaubt.
      - Lebensgefahr beginnt bei Dosen, die tausendmal größer sind als die Jahresdosis.
    explanation: Bei 4 bis 5 Sv – dem Zweitausendfachen der natürlichen Jahresdosis – wird das Knochenmark zerstört. Bei Strahlung macht die Dosis das Gift.
    difficulty: 3

srs:
  cards_from: [ordnen, flug]
