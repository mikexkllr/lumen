id: sci.nuclear.protection
type: concept
title: Radiation protection
summary: Distance, shielding, time.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: It gets too hot for you at the campfire. What helps fastest?
    params:
      options:
        - label: Take a few steps back
          correct: true
        - label: Close your eyes
          feedback: The heat stays.
        - label: Stay seated longer
          feedback: Then it gets even hotter.
    hints:
      - Where is it hottest?
    explanation: Distance helps. The same rules apply to radiation.


  - kind: explain
    id: s1
    body: |
      Three rules protect you: keep your **distance**, use **shielding** and keep the **time** short. Distance works especially well, because radiation spreads over an ever larger spherical surface.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: You move {{k}} times as far from a source. How many times less radiation reaches you?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: The radiation spreads over a spherical surface – and that grows with the square.
    hints:
      - The spherical surface grows with the square of the distance.
    explanation: "{{k}}² = {{k * k}} times less."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 3 }

  - kind: problem
    id: radon
    widget: choice
    prompt: In some basements, the radioactive gas radon collects from the ground. What helps most?
    params:
      options:
        - { label: Ventilate regularly, correct: true }
        - { label: Turn up the heating, feedback: "Heat does not change the radiation – fresh air dilutes the gas." }
    hints:
      - How do you get rid of a gas?
    explanation: After smoking, radon is a common cause of lung cancer – ventilation helps.

  - kind: problem
    id: roentgen
    widget: choice
    prompt: Why does the staff leave the room during an X-ray?
    params:
      options:
        - { label: Otherwise they would collect many small doses every day., correct: true }
        - { label: Patients should not feel embarrassed., feedback: "It is about radiation protection through distance and time." }
    hints:
      - For patients it happens once, for staff every day.
    explanation: Small doses add up over a working life.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: One lead plate halves the gamma radiation. How many equal plates are needed to bring it below 1%?
    answer:
      value: 7
    hints:
      - How often must you halve to get below 1/100?
    explanation: 2⁷ = 128, so 0.8%. Shielding works exponentially – like half-life, but in space.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Iodine-131 (half-life 8 days) and caesium-137 (30 years) are released in an accident. Which radiates more strongly at first – for the same number of atoms?
    params:
      options:
        - label: Iodine-131 – a short half-life means many decays per second
          correct: true
        - label: Caesium-137 – it lasts longer
          feedback: Radiating long means radiating weakly.
        - label: Both the same
          feedback: Activity is inversely proportional to half-life.
    hints:
      - The same number of atoms decays – in 8 days or in 30 years.
    explanation: Iodine is over 1000 times more active at first but practically gone after three months. Caesium remains the long-term problem.
    difficulty: 3

srs:
  cards_from: [abstand, radon]
