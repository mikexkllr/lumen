id: sci.nuclear.protection
type: concept
title: Radiation protection
summary: Distance, shielding, time.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Three rules protect you: keep your **distance**, use **shielding** and keep the **time** short. Distance works especially well, because radiation spreads over an ever larger spherical surface.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: You move {{k}} times as far from a source. How many times less radiation reaches you?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: The radiation spreads over a spherical surface – and that grows with the square.
    hints:
      - The spherical surface grows with the square of the distance.
    explanation: "{{k}}² = {{k * k}} times less."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 3 }

  - kind: problem
    id: radon
    widget: choice
    prompt: In some basements, the radioactive gas radon collects from the ground. What helps most?
    params:
      options:
        - { label: Ventilate regularly, correct: true }
        - { label: Turn up the heating, feedback: "Heat does not change the radiation – fresh air dilutes the gas." }
    hints:
      - How do you get rid of a gas?
    explanation: After smoking, radon is a common cause of lung cancer – ventilation helps.

  - kind: problem
    id: roentgen
    widget: choice
    prompt: Why does the staff leave the room during an X-ray?
    params:
      options:
        - { label: Otherwise they would collect many small doses every day., correct: true }
        - { label: Patients should not feel embarrassed., feedback: "It is about radiation protection through distance and time." }
    hints:
      - For patients it happens once, for staff every day.
    explanation: Small doses add up over a working life.

srs:
  cards_from: [abstand, radon]
