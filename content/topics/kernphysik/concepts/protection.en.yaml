id: sci.nuclear.protection
type: concept
title: Radiation protection
summary: Distance, shielding, time.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Layer by layer
    body: "A thick wall of lead or concrete helps against gamma rays. Each layer swallows a share. Drag the **half-value thickness**: how much radiation gets through a 10 cm wall?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: 100*0.5^(x/d)
        x:
          - 0
          - 10
        y:
          - 0
          - 100
        sliders:
          - id: d
            label: Half-value thickness (cm)
            min: 0.5
            max: 5
            step: 0.5
            initial: 2

  - kind: problem
    id: hook
    widget: choice
    prompt: It gets too hot for you at the campfire. What helps fastest?
    params:
      options:
        - label: Take a few steps back
          correct: true
        - label: Close your eyes
          feedback: The heat stays.
        - label: Stay seated longer
          feedback: Then it gets even hotter.
    hints:
      - Where is it hottest?
    explanation: Distance helps. The same rules apply to radiation.

  - kind: explain
    id: s1
    body: |
      Three rules protect you: keep your **distance**, use **shielding** and keep the **time** short. Distance works especially well, because radiation spreads over an ever larger spherical surface.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: You move {{k}} times as far from a source. How many times less radiation reaches you?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: The radiation spreads over a spherical surface – and that grows with the square.
    hints:
      - The spherical surface grows with the square of the distance.
    explanation: "{{k}}² = {{k * k}} times less."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 3 }

  - kind: problem
    id: radon
    widget: choice
    prompt: In some basements, the radioactive gas radon collects from the ground. What helps most?
    params:
      options:
        - { label: Ventilate regularly, correct: true }
        - { label: Turn up the heating, feedback: "Heat does not change the radiation – fresh air dilutes the gas." }
    hints:
      - How do you get rid of a gas?
    explanation: After smoking, radon is a common cause of lung cancer – ventilation helps.

  - kind: problem
    id: roentgen
    widget: choice
    prompt: Why does the staff leave the room during an X-ray?
    params:
      options:
        - { label: Otherwise they would collect many small doses every day., correct: true }
        - { label: Patients should not feel embarrassed., feedback: "It is about radiation protection through distance and time." }
    hints:
      - For patients it happens once, for staff every day.
    explanation: Small doses add up over a working life.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Three rules protect: keep your [[distance]], shield, and keep the [[time]] short."
      distractors:
        - heat
        - air

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: A wall of 3 cm of lead lets only one eighth of the gamma rays through. Set the half-value thickness so that the curve hits the point.
    params:
      expr: 100*0.5^(x/d)
      x:
        - 0
        - 10
      y:
        - 0
        - 100
      showCoordinates: false
      sliders:
        - id: d
          label: Half-value thickness (cm)
          min: 0.5
          max: 5
          step: 0.5
          initial: 2
      markers:
        - x: 3
          y: 12.5
          label: 3 cm
    answer:
      values:
        d: 1
    hints:
      - One eighth is ½ · ½ · ½ – that is three halvings.
      - "Three halvings in 3 cm: how thick is one layer?"
    explanation: "Each centimetre of lead halves the radiation: 100% → 50% → 25% → 12.5%."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: One lead plate halves the gamma radiation. How many equal plates are needed to bring it below 1%?
    answer:
      value: 7
    hints:
      - How often must you halve to get below 1/100?
    explanation: 2⁷ = 128, so 0.8%. Shielding works exponentially – like half-life, but in space.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: At 1 m from a source you measure {{d}} µSv per hour. How much do you measure at {{k}} m?
    params:
      unit: µSv/h
    answer:
      value: "{{d / (k * k)}}"
    feedback:
      - when: numval(state.input) == d / k
        misconception: linear-distance
        text: The radiation spreads over a sphere. Its area grows with the **square** of the distance.
    hints:
      - "{{k}} times the distance means {{k * k}} times the area."
      - "{{d}} ÷ {{k * k}} = ?"
    explanation: "{{d}} ÷ {{k * k}} = {{d / (k * k)}} µSv/h. A few steps back work better than almost any shielding."
    difficulty: 2
    variants:
      params:
        d: choice[40,80,160]
        k: choice[2,4]
      defaults:
        d: 80
        k: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Beta radiation is better shielded with acrylic than with lead. Why?
    params:
      options:
        - label: In lead the braked electrons produce X-rays.
          correct: true
        - label: Acrylic is denser than lead.
          feedback: Lead is much denser. That is exactly the problem here.
        - label: Lead lets beta radiation through.
          feedback: Lead stops electrons at once – but too abruptly.
    hints:
      - What happens when fast electrons are braked abruptly?
      - That is also how an X-ray tube works.
    explanation: Strongly braked electrons emit bremsstrahlung – X-rays that penetrate deeply. In light acrylic they slow gently. Lead can then follow behind it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Iodine-131 (half-life 8 days) and caesium-137 (30 years) are released in an accident. Which radiates more strongly at first – for the same number of atoms?
    params:
      options:
        - label: Iodine-131 – a short half-life means many decays per second
          correct: true
        - label: Caesium-137 – it lasts longer
          feedback: Radiating long means radiating weakly.
        - label: Both the same
          feedback: Activity is inversely proportional to half-life.
    hints:
      - The same number of atoms decays – in 8 days or in 30 years.
    explanation: Iodine is over 1000 times more active at first but practically gone after three months. Caesium remains the long-term problem.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: You may take at most 1 mSv extra. At the workplace you measure 20 µSv per hour. How many hours may you work there?
    params:
      unit: h
    answer:
      value: 50
    feedback:
      - when: abs(numval(state.input) - 0.05) < 0.001
        misconception: milli-micro
        text: "Convert first: 1 mSv = 1000 µSv."
    hints:
      - 1 mSv = 1000 µSv.
      - 1000 ÷ 20 = ?
    explanation: "1000 µSv ÷ 20 µSv/h = 50 h. Time is the third protection rule: the dose grows exactly with the time spent."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: After a reactor accident people nearby should take iodine tablets quickly. What do they do?
    params:
      options:
        - label: They fill the thyroid with normal iodine so it no longer takes up radioactive iodine-131.
          correct: true
        - label: They make radiation harmless.
          feedback: Tablets cannot block radiation. They act on one organ only.
        - label: They cure radiation damage.
          feedback: They only prevent uptake of iodine-131 – taken beforehand.
    hints:
      - Which organ collects iodine?
      - A full store takes nothing more.
    explanation: The thyroid stores iodine. Once saturated with stable iodine, iodine-131 is excreted again. After a few half-lives of 8 days the danger is over.
    difficulty: 3

srs:
  cards_from: [abstand, radon]
