id: sci.nuclear.isotopes
type: concept
title: Isotopes
summary: Same element, different nucleus.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: if an atom were as large as a football stadium (200 m), how large would its nucleus be – in millimetres?"
    params:
      min: 0
      max: 100
      unit: mm
    answer:
      value: 2
      tolerance: 3
    explanation: About 2 mm – a grain of rice. The nucleus is 100,000 times smaller than the atom yet holds almost all its mass.

  - kind: explain
    id: s1
    body: |
      The atomic nucleus consists of protons and neutrons. The number in the name – as in carbon-14 – is the **mass number**: protons plus neutrons. Atoms of one element with different numbers of neutrons are called **isotopes**.

  - kind: problem
    id: c14
    widget: numeric
    prompt: Carbon has 6 protons. How many neutrons does carbon-14 have?
    params: { unit: neutrons }
    answer: { value: 8 }
    hints:
      - 14 − 6.
    explanation: 8 neutrons – two more than in common carbon-12.

  - kind: problem
    id: uran
    widget: numeric
    prompt: Uranium has 92 protons. How many neutrons does uranium-235 have?
    params: { unit: neutrons }
    answer: { value: 143 }
    hints:
      - 235 − 92.
    explanation: 143 neutrons – this isotope can be split.

  - kind: problem
    id: chemie
    widget: choice
    prompt: Does carbon-14 react differently from carbon-12?
    params:
      options:
        - { label: No – the electrons are the same., correct: true }
        - { label: "Yes, very differently.", feedback: "The electrons decide chemistry. Neutrons only change the nucleus." }
    hints:
      - What determines chemical behavior?
    explanation: That is why a plant takes up C-14 just like C-12 – the basis of radiocarbon dating.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The number of [[protons]] determines the element. Isotopes differ in the number of [[neutrons]]. The mass number is the [[sum]] of both.
      distractors:
        - electrons
        - difference

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Chlorine is 75% chlorine-35 and 25% chlorine-37. What average atomic mass does that give?
    answer:
      value: 35.5
    hints:
      - 0.75 · 35 + 0.25 · 37.
    explanation: 26.25 + 9.25 = 35.5. That is why the periodic table often shows odd masses.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Iodine-131 has a half-life of 8 days. After how many days is only a quarter left?
    params:
      scene: decay
    answer:
      halflife: 8
      left: 25
    explanation: "After 16 days: two half-lives, so half of the half."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The protons in the nucleus repel each other violently. Why does the nucleus not fly apart?
    params:
      options:
        - label: The strong nuclear force holds them together – it acts only over tiny distances
          correct: true
        - label: Gravity holds them together
          feedback: It is many orders of magnitude too weak for that.
        - label: The electrons press from outside
          feedback: The electrons are 100,000 times farther away.
    hints:
      - It takes a force stronger than the electric repulsion.
    explanation: The **strong interaction** is about 100 times stronger but reaches only about one proton diameter. Neutrons supply glue without repulsion.
    difficulty: 3

srs:
  cards_from: [c14, chemie]
