id: sci.nuclear.isotopes
type: concept
title: Isotopes
summary: Same element, different nucleus.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: if an atom were as large as a football stadium (200 m), how large would its nucleus be – in millimetres?"
    params:
      min: 0
      max: 100
      unit: mm
    answer:
      value: 2
      tolerance: 3
    explanation: About 2 mm – a grain of rice. The nucleus is 100,000 times smaller than the atom yet holds almost all its mass.

  - kind: explain
    id: s1
    body: |
      The atomic nucleus consists of protons and neutrons. The number in the name – as in carbon-14 – is the **mass number**: protons plus neutrons. Atoms of one element with different numbers of neutrons are called **isotopes**.

  - kind: problem
    id: c14
    widget: numeric
    prompt: Carbon has 6 protons. How many neutrons does carbon-14 have?
    params: { unit: neutrons }
    answer: { value: 8 }
    hints:
      - 14 − 6.
    explanation: 8 neutrons – two more than in common carbon-12.

  - kind: problem
    id: uran
    widget: numeric
    prompt: Uranium has 92 protons. How many neutrons does uranium-235 have?
    params: { unit: neutrons }
    answer: { value: 143 }
    hints:
      - 235 − 92.
    explanation: 143 neutrons – this isotope can be split.

  - kind: problem
    id: chemie
    widget: choice
    prompt: Does carbon-14 react differently from carbon-12?
    params:
      options:
        - { label: No – the electrons are the same., correct: true }
        - { label: "Yes, very differently.", feedback: "The electrons decide chemistry. Neutrons only change the nucleus." }
    hints:
      - What determines chemical behavior?
    explanation: That is why a plant takes up C-14 just like C-12 – the basis of radiocarbon dating.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The number of [[protons]] determines the element. Isotopes differ in the number of [[neutrons]]. The mass number is the [[sum]] of both.
      distractors:
        - electrons
        - difference

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Chlorine is 75% chlorine-35 and 25% chlorine-37. What average atomic mass does that give?
    answer:
      value: 35.5
    hints:
      - 0.75 · 35 + 0.25 · 37.
    explanation: 26.25 + 9.25 = 35.5. That is why the periodic table often shows odd masses.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Iodine-131 has a half-life of 8 days. After how many days is only a quarter left?
    params:
      scene: decay
    answer:
      halflife: 8
      left: 25
    explanation: "After 16 days: two half-lives, so half of the half."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: buckets
    prompt: Stable or radioactive?
    params:
      buckets:
        - id: b1
          label: stable
        - id: b2
          label: radioactive
      items:
        - label: Carbon-12
          bucket: b1
        - label: Oxygen-16
          bucket: b1
        - label: Hydrogen-1
          bucket: b1
        - label: Carbon-14
          bucket: b2
        - label: Tritium (hydrogen-3)
          bucket: b2
        - label: Uranium-238
          bucket: b2
    hints:
      - Light nuclei with roughly equal protons and neutrons are usually stable.
      - Too many neutrons or a very heavy nucleus make it unstable.
    explanation: C-14 and tritium have too many neutrons. All nuclei heavier than lead are radioactive, uranium too. C-12, O-16 and H-1 are stable.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: "A helium nucleus weighs less than its two protons and two neutrons separately. The missing mass was released as **binding energy** when the nucleus formed: $E = \\Delta m \\cdot c^2$."

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: The helium nucleus lacks 0.0304 u of mass. 1 u corresponds to 931.5 MeV. How much binding energy is that – in MeV?
    params:
      unit: MeV
    answer:
      value: 28.3
      tolerance: 0.2
    hints:
      - Multiply the mass loss by 931.5 MeV per u.
      - 0.0304 · 931.5 = ?
    explanation: 0.0304 · 931.5 ≈ 28.3 MeV. A chemical bond gives only a few eV – nuclear binding is millions of times stronger.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The protons in the nucleus repel each other violently. Why does the nucleus not fly apart?
    params:
      options:
        - label: The strong nuclear force holds them together – it acts only over tiny distances
          correct: true
        - label: Gravity holds them together
          feedback: It is many orders of magnitude too weak for that.
        - label: The electrons press from outside
          feedback: The electrons are 100,000 times farther away.
    hints:
      - It takes a force stronger than the electric repulsion.
    explanation: The **strong interaction** is about 100 times stronger but reaches only about one proton diameter. Neutrons supply glue without repulsion.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A bone contains only 25 % of its original carbon-14. The half-life is 5730 years. How old is it?
    params:
      unit: years
    answer:
      value: 11460
      tolerance: 10
    feedback:
      - when: abs(numval(state.input) - 22920) < 10
        misconception: halvings
        text: A quarter is halved **twice**, not four times.
    hints:
      - How many halvings to reach 25 %?
      - 2 · 5730 = ?
    explanation: "Two half-lives: 11,460 years. Living things take up C-14 from the air – from death on, this clock ticks."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Heavy nuclei have more neutrons than protons – uranium-238 has 146 to 92. Why?
    params:
      options:
        - label: Neutrons help hold the nucleus together via the nuclear force but do not repel electrically.
          correct: true
        - label: Neutrons are lighter than protons.
          feedback: They are actually slightly heavier. What matters is charge.
        - label: Protons decay into neutrons over time.
          feedback: Free protons are stable. It is about the repulsion in the nucleus.
    hints:
      - What grows especially fast with the number of protons?
      - Every proton repels all other protons.
    explanation: Electric repulsion acts between all pairs of protons, the nuclear force only between neighbours. Extra neutrons dilute the repulsion. Beyond lead even that is not enough.
    difficulty: 3

srs:
  cards_from: [c14, chemie]
