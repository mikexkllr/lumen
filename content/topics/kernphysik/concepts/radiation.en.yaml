id: sci.nuclear.radiation
type: concept
title: Three types of radiation
summary: Alpha, beta, gamma.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many atomic nuclei decay per second in your own body?"
    params:
      min: 1
      max: 1000000
      scale: log
    answer:
      value: 8000
      within: 70
    explanation: About 8000 – mostly potassium and carbon. Completely normal and harmless.

  - kind: explain
    id: s1
    body: |
      Unstable nuclei decay and emit radiation. **Alpha** particles are helium nuclei. **Beta** particles are fast electrons. **Gamma** is light with very high energy. Each type penetrates to a different depth.

  - kind: problem
    id: abschirmen
    widget: match
    prompt: What stops the radiation?
    params:
      pairs:
        - { left: Alpha, right: A sheet of paper }
        - { left: Beta, right: An aluminum sheet }
        - { left: Gamma, right: Thick lead }
    hints:
      - Heavy particles get stuck early.
    explanation: Alpha is heavy and gets stuck right away – gamma passes through almost everything.

  - kind: problem
    id: rest
    widget: numeric
    prompt: What percentage of a radioactive substance is left after {{n}} half-lives?
    params: { unit: "%" }
    answer: { value: "{{100 / 2 ** n}}" }
    hints:
      - Halve it each time.
    explanation: "100 : $2^{ {{n}} }$ = {{100 / 2 ** n}} %."
    variants:
      params: { n: "int[1,4]" }
      defaults: { n: 3 }

  - kind: problem
    id: innen
    widget: choice
    prompt: A sheet of paper already stops alpha radiation. When is it still dangerous?
    params:
      options:
        - { label: When you breathe in or swallow the substance., correct: true }
        - { label: Never, feedback: "Inside the body, it hits living tissue directly – with no protective layer." }
    hints:
      - What protects you from the outside, but not from the inside?
    explanation: From outside, skin stops alpha – inside the body, it does great harm.

  - kind: problem
    id: c1
    widget: sim
    prompt: A sample has a half-life of 3 hours. Let time run until only **a quarter** is left.
    params:
      scene: decay
      controls:
        halflife:
          value: 3
          fixed: true
    answer:
      left: 25
    explanation: After 6 hours – two half-lives. Which atom decays when is pure chance; the statistics are exact nonetheless.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In alpha decay a nucleus loses 2 protons and 2 neutrons. Uranium-238 (92 protons) decays. What is the mass number of the new nucleus?
    answer:
      value: 234
    hints:
      - A helium nucleus has mass number 4.
    explanation: "238 − 4 = 234, with 90 protons: thorium-234."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: "Carbon-14 (6 protons) undergoes beta-minus decay: a neutron turns into a proton. What is produced?"
    params:
      options:
        - label: Nitrogen-14
          correct: true
        - label: Carbon-13
          feedback: The mass number stays the same – no particle leaves the nucleus.
        - label: Boron-14
          feedback: Boron has 5 protons. Here a proton is **added**.
    hints:
      - How many protons does the nucleus have afterwards?
      - The element with 7 protons is nitrogen.
    explanation: "6 + 1 = 7 protons: nitrogen. The mass number 14 stays because a neutron was merely converted. The electron and an antineutrino fly away."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: sim
    prompt: A sample has a half-life of 5 h. Find the earliest whole hour from which less than 10 % is left.
    params:
      scene: decay
      controls:
        halflife:
          value: 5
          fixed: true
    answer:
      time: 17
    explanation: After 16 h there is still 10.9 %, after 17 h 9.5 %. Just over three half-lives – each one leaves half.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In beta decay an electron leaves the **nucleus**. But there are no electrons there – where does it come from?
    params:
      options:
        - label: A neutron turns into a proton – the electron is created in the process
          correct: true
        - label: It comes from the electron shell
          feedback: Then it would not be nuclear decay, and the element would stay the same.
        - label: It was hidden in the neutron
          feedback: A neutron contains no electron – it is newly created.
    hints:
      - After the decay the nucleus has one more proton.
    explanation: The **weak interaction** turns particles into one another. That is how carbon-14 becomes nitrogen-14.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Every nucleus decays at random, but with a fixed probability λ per second. This gives the **decay law** $N(t) = N_0 \cdot e^{-\lambda t}$. The half-life is $T_{1/2} = \frac{\ln 2}{\lambda}$.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A sample has 10²⁰ nuclei with a half-life of 1 year (3.15 · 10⁷ s). How many decay per second? A = λ · N with λ = ln 2 ÷ T. In 10¹² becquerel.
    answer:
      value: 2.2
      tolerance: 0.05
    hints:
      - λ = 0.693 ÷ 3.15 · 10⁷ s ≈ 2.2 · 10⁻⁸ per s.
      - Times 10²⁰ nuclei.
    explanation: A ≈ 2.2 · 10¹² Bq. For the same number of nuclei a short half-life means high activity – the substance radiates fiercely but is used up quickly.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Can you predict when a particular uranium nucleus will decay?
    params:
      options:
        - label: No – only the probability is known; the moment is genuinely random.
          correct: true
        - label: Yes, if you know its age.
          feedback: Nuclei do not age. An old nucleus is just as likely to decay as a new one.
        - label: Yes, with enough computing power.
          feedback: Decay is a quantum process. Even the best computer cannot know the moment.
    hints:
      - Does a nucleus have a memory?
      - The half-life applies to many nuclei, not one.
    explanation: Radioactive decay is one of the few truly random processes in nature. For many nuclei it still yields a smooth curve – statistics makes it predictable.
    difficulty: 3

srs:
  cards_from: [abschirmen, innen]
