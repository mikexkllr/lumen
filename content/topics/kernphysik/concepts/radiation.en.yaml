id: sci.nuclear.radiation
type: concept
title: Three types of radiation
summary: Alpha, beta, gamma.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Unstable nuclei decay and emit radiation. **Alpha** particles are helium nuclei. **Beta** particles are fast electrons. **Gamma** is light with very high energy. Each type penetrates to a different depth.

  - kind: problem
    id: abschirmen
    widget: match
    prompt: What stops the radiation?
    params:
      pairs:
        - { left: Alpha, right: A sheet of paper }
        - { left: Beta, right: An aluminum sheet }
        - { left: Gamma, right: Thick lead }
    hints:
      - Heavy particles get stuck early.
    explanation: Alpha is heavy and gets stuck right away – gamma passes through almost everything.

  - kind: problem
    id: rest
    widget: numeric
    prompt: What percentage of a radioactive substance is left after {{n}} half-lives?
    params: { unit: "%" }
    answer: { value: "{{100 / 2 ** n}}" }
    hints:
      - Halve it each time.
    explanation: "100 : $2^{ {{n}} }$ = {{100 / 2 ** n}} %."
    variants:
      params: { n: "int[1,4]" }
      defaults: { n: 3 }

  - kind: problem
    id: innen
    widget: choice
    prompt: A sheet of paper already stops alpha radiation. When is it still dangerous?
    params:
      options:
        - { label: When you breathe in or swallow the substance., correct: true }
        - { label: Never, feedback: "Inside the body, it hits living tissue directly – with no protective layer." }
    hints:
      - What protects you from the outside, but not from the inside?
    explanation: From outside, skin stops alpha – inside the body, it does great harm.

srs:
  cards_from: [abschirmen, innen]
