id: sci.nuclear.isotopes
type: concept
title: Isotope
summary: Gleiches Element, anderer Kern.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Eine Uhr im Knochen
    body: "Kohlenstoff-14 ist eine seltene Sorte Kohlenstoff. Deck seine Reise Schritt für Schritt auf: Wie wird dieses **Isotop** zur Uhr für Knochen und Holz?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🌌
            front: Hoch in der Luft
            back: Teilchen aus dem All verwandeln dort Stickstoff in Kohlenstoff-14.
          - icon: 🌱
            front: Pflanzen
            back: Sie nehmen es mit dem Kohlendioxid aus der Luft auf.
          - icon: 🐄
            front: Tiere und Menschen
            back: Wer Pflanzen isst, baut das C-14 in Knochen und Haut ein.
          - icon: ⏳
            front: Nach dem Tod
            back: Nichts kommt mehr nach – das C-14 zerfällt langsam. Daran liest man das Alter ab.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wäre ein Atom so groß wie ein Fußballstadion (200 m), wie groß wäre sein Kern – in Millimetern?"
    params:
      min: 0
      max: 100
      unit: mm
    answer:
      value: 2
      tolerance: 3
    explanation: Etwa 2 mm – ein Reiskorn. Der Kern ist 100 000-mal kleiner als das Atom, enthält aber fast die ganze Masse.

  - kind: explain
    id: s1
    body: |
      Der Atomkern besteht aus Protonen und Neutronen. Die Zahl im Namen – wie bei Kohlenstoff-14 – ist die **Massenzahl**: Protonen plus Neutronen. Atome eines Elements mit verschiedener Neutronenzahl heißen **Isotope**.

  - kind: problem
    id: c14
    widget: numeric
    prompt: Kohlenstoff hat 6 Protonen. Wie viele Neutronen hat Kohlenstoff-14?
    params: { unit: Neutronen }
    answer: { value: 8 }
    hints:
      - 14 − 6.
    explanation: 8 Neutronen – zwei mehr als im häufigen Kohlenstoff-12.

  - kind: problem
    id: uran
    widget: numeric
    prompt: Uran hat 92 Protonen. Wie viele Neutronen hat Uran-235?
    params: { unit: Neutronen }
    answer: { value: 143 }
    hints:
      - 235 − 92.
    explanation: 143 Neutronen – dieses Isotop lässt sich spalten.

  - kind: problem
    id: chemie
    widget: choice
    prompt: Reagiert Kohlenstoff-14 chemisch anders als Kohlenstoff-12?
    params:
      options:
        - { label: Nein – die Elektronen sind gleich., correct: true }
        - { label: Ja – völlig anders., feedback: "Chemie macht die Hülle. Die Neutronen ändern nur den Kern." }
    hints:
      - Was bestimmt das chemische Verhalten?
    explanation: Darum baut eine Pflanze C-14 genauso ein wie C-12 – die Grundlage der Altersbestimmung.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die Zahl der [[Protonen]] bestimmt das Element. Isotope unterscheiden sich in der Zahl der [[Neutronen]]. Die Massenzahl ist die [[Summe]] aus beiden.
      distractors:
        - Elektronen
        - Differenz

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Chlor besteht zu 75 % aus Chlor-35 und zu 25 % aus Chlor-37. Welche mittlere Atommasse ergibt das?
    answer:
      value: 35.5
    hints:
      - 0,75 · 35 + 0,25 · 37.
    explanation: 26,25 + 9,25 = 35,5. Darum stehen im Periodensystem oft krumme Massen.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Jod-131 hat eine Halbwertszeit von 8 Tagen. Nach wie vielen Tagen ist nur noch ein Viertel übrig?
    params:
      scene: decay
    answer:
      halflife: 8
      left: 25
    explanation: "Nach 16 Tagen: zwei Halbwertszeiten, also die Hälfte der Hälfte."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: buckets
    prompt: Stabil oder radioaktiv?
    params:
      buckets:
        - id: b1
          label: stabil
        - id: b2
          label: radioaktiv
      items:
        - label: Kohlenstoff-12
          bucket: b1
        - label: Sauerstoff-16
          bucket: b1
        - label: Wasserstoff-1
          bucket: b1
        - label: Kohlenstoff-14
          bucket: b2
        - label: Tritium (Wasserstoff-3)
          bucket: b2
        - label: Uran-238
          bucket: b2
    hints:
      - Leichte Kerne mit etwa gleich vielen Protonen und Neutronen sind meist stabil.
      - Zu viele Neutronen oder ein sehr schwerer Kern machen instabil.
    explanation: C-14 und Tritium haben zu viele Neutronen. Alle Kerne schwerer als Blei sind radioaktiv, auch Uran. C-12, O-16 und H-1 sind stabil.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: "Ein Heliumkern wiegt weniger als seine zwei Protonen und zwei Neutronen einzeln. Die fehlende Masse ist beim Bilden des Kerns als **Bindungsenergie** abgegeben worden: $E = \\Delta m \\cdot c^2$."

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: Beim Heliumkern fehlen 0,0304 u Masse. 1 u entspricht 931,5 MeV. Wie viel Bindungsenergie ist das – in MeV?
    params:
      unit: MeV
    answer:
      value: 28.3
      tolerance: 0.2
    hints:
      - Multipliziere den Massenverlust mit 931,5 MeV pro u.
      - 0,0304 · 931,5 = ?
    explanation: 0,0304 · 931,5 ≈ 28,3 MeV. Eine chemische Bindung bringt nur wenige eV – Kernbindung ist millionenfach stärker.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Protonen im Kern stoßen sich elektrisch heftig ab. Warum fliegt der Kern nicht auseinander?
    params:
      options:
        - label: Die starke Kernkraft hält sie zusammen – sie wirkt nur auf winzige Abstände
          correct: true
        - label: Die Schwerkraft hält sie zusammen
          feedback: Sie ist dafür um viele Größenordnungen zu schwach.
        - label: Die Elektronen drücken von außen
          feedback: Die Elektronen sind 100 000-mal weiter weg.
    hints:
      - Es braucht eine Kraft, die stärker ist als die elektrische Abstoßung.
    explanation: Die **starke Wechselwirkung** ist rund 100-mal stärker, reicht aber nur etwa einen Protonendurchmesser weit. Neutronen liefern Klebstoff ohne Abstoßung.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Knochen enthält nur noch 25 % des ursprünglichen Kohlenstoff-14. Die Halbwertszeit ist 5730 Jahre. Wie alt ist er?
    params:
      unit: Jahre
    answer:
      value: 11460
      tolerance: 10
    feedback:
      - when: abs(numval(state.input) - 22920) < 10
        misconception: halvings
        text: Ein Viertel ist **zweimal** halbiert, nicht viermal.
    hints:
      - Wie oft muss man halbieren, um auf 25 % zu kommen?
      - 2 · 5730 = ?
    explanation: "Zwei Halbwertszeiten: 11 460 Jahre. Lebewesen nehmen C-14 aus der Luft auf – ab dem Tod tickt diese Uhr."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Schwere Kerne haben mehr Neutronen als Protonen – Uran-238 hat 146 zu 92. Warum?
    params:
      options:
        - label: Neutronen halten über die Kernkraft mit zusammen, stoßen sich aber nicht elektrisch ab.
          correct: true
        - label: Neutronen sind leichter als Protonen.
          feedback: Sie sind sogar etwas schwerer. Entscheidend ist die Ladung.
        - label: Protonen zerfallen mit der Zeit zu Neutronen.
          feedback: Freie Protonen sind stabil. Es geht um die Abstoßung im Kern.
    hints:
      - Was wächst mit der Zahl der Protonen besonders schnell?
      - Jedes Proton stößt alle anderen Protonen ab.
    explanation: Die elektrische Abstoßung wirkt zwischen allen Protonenpaaren, die Kernkraft nur zwischen Nachbarn. Zusätzliche Neutronen verdünnen die Abstoßung. Ab Blei reicht auch das nicht mehr.
    difficulty: 3

srs:
  cards_from: [c14, chemie]
