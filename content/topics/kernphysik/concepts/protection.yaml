id: sci.nuclear.protection
type: concept
title: Strahlenschutz
summary: Abstand, Abschirmung, Zeit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Am Lagerfeuer wird es dir zu heiß. Was hilft am schnellsten?
    params:
      options:
        - label: Ein paar Schritte zurückgehen
          correct: true
        - label: Die Augen schließen
          feedback: Die Hitze bleibt.
        - label: Länger sitzen bleiben
          feedback: Dann wird es noch heißer.
    hints:
      - Wo ist es am heißesten?
    explanation: Abstand hilft. Bei Strahlung gelten dieselben Regeln.

  - kind: explain
    id: s1
    body: |
      Drei Regeln schützen: **Abstand** halten, **abschirmen** und die **Zeit** kurz halten. Abstand wirkt besonders stark, denn die Strahlung verteilt sich auf eine immer größere Kugelfläche.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: Du gehst {{k}}-mal so weit von einer Quelle weg. Wievielmal weniger Strahlung trifft dich?
    params: { unit: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Die Strahlung verteilt sich auf eine Kugelfläche – die wächst mit dem Quadrat.
    hints:
      - Die Kugelfläche wächst mit dem Quadrat des Abstands.
    explanation: "{{k}}² = {{k * k}}-mal weniger."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 3 }

  - kind: problem
    id: radon
    widget: choice
    prompt: In manchen Kellern sammelt sich das radioaktive Gas Radon aus dem Boden. Was hilft am meisten?
    params:
      options:
        - { label: Regelmäßig lüften, correct: true }
        - { label: Die Heizung aufdrehen, feedback: "Wärme verändert die Strahlung nicht – Frischluft verdünnt das Gas." }
    hints:
      - Wie wird man ein Gas los?
    explanation: Radon ist nach dem Rauchen eine häufige Ursache für Lungenkrebs – Lüften hilft.

  - kind: problem
    id: roentgen
    widget: choice
    prompt: Warum verlässt das Personal beim Röntgen den Raum?
    params:
      options:
        - { label: Es würde sonst täglich viele kleine Dosen sammeln., correct: true }
        - { label: Die Patienten sollen sich nicht schämen., feedback: "Es geht um Strahlenschutz durch Abstand und Zeit." }
    hints:
      - Für Patienten ist es einmal, für das Personal jeden Tag.
    explanation: Kleine Dosen summieren sich über ein Berufsleben.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Drei Regeln schützen: [[Abstand]] halten, abschirmen und die [[Zeit]] kurz halten."
      distractors:
        - Wärme
        - Luft

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Bleiplatte halbiert die Gamma-Strahlung. Wie viele gleiche Platten braucht man, um sie auf unter 1 % zu senken?
    answer:
      value: 7
    hints:
      - Wie oft muss man halbieren, bis man unter 1/100 liegt?
    explanation: 2⁷ = 128, also 0,8 %. Abschirmung wirkt exponentiell – wie die Halbwertszeit, nur im Raum.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: In 1 m Abstand von einer Quelle misst du {{d}} µSv pro Stunde. Wie viel misst du in {{k}} m Abstand?
    params:
      unit: µSv/h
    answer:
      value: "{{d / (k * k)}}"
    feedback:
      - when: numval(state.input) == d / k
        misconception: linear-distance
        text: Die Strahlung verteilt sich auf eine Kugelfläche. Die wächst mit dem **Quadrat** des Abstands.
    hints:
      - "{{k}}-facher Abstand heißt {{k * k}}-fache Fläche."
      - "{{d}} : {{k * k}} = ?"
    explanation: "{{d}} : {{k * k}} = {{d / (k * k)}} µSv/h. Ein paar Schritte zurück wirken stärker als fast jede Abschirmung."
    difficulty: 2
    variants:
      params:
        d: choice[40,80,160]
        k: choice[2,4]
      defaults:
        d: 80
        k: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Beta-Strahlung schirmt man lieber mit Plexiglas ab als mit Blei. Warum?
    params:
      options:
        - label: In Blei erzeugen die abgebremsten Elektronen Röntgenstrahlung.
          correct: true
        - label: Plexiglas ist dichter als Blei.
          feedback: Blei ist viel dichter. Gerade das ist hier das Problem.
        - label: Blei lässt Beta-Strahlung durch.
          feedback: Blei stoppt Elektronen sofort – aber zu heftig.
    hints:
      - Was passiert, wenn schnelle Elektronen abrupt gebremst werden?
      - So funktioniert auch eine Röntgenröhre.
    explanation: Stark gebremste Elektronen senden Bremsstrahlung aus – Röntgenlicht, das tief eindringt. In leichtem Plexiglas bremsen sie sanft. Dahinter kann noch Blei folgen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Jod-131 (Halbwertszeit 8 Tage) und Cäsium-137 (30 Jahre) werden bei einem Unfall freigesetzt. Welches strahlt anfangs stärker – bei gleicher Zahl von Atomen?
    params:
      options:
        - label: Jod-131 – kurze Halbwertszeit heißt viele Zerfälle pro Sekunde
          correct: true
        - label: Cäsium-137 – es hält länger
          feedback: Lang strahlen heißt schwach strahlen.
        - label: Beide gleich
          feedback: Die Aktivität ist umgekehrt proportional zur Halbwertszeit.
    hints:
      - Dieselbe Zahl Atome zerfällt – in 8 Tagen oder in 30 Jahren.
    explanation: Jod ist anfangs über 1000-mal aktiver, aber nach drei Monaten praktisch weg. Cäsium bleibt das Langzeitproblem.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Du darfst höchstens 1 mSv zusätzlich aufnehmen. Am Arbeitsplatz misst du 20 µSv pro Stunde. Wie viele Stunden darfst du dort arbeiten?
    params:
      unit: h
    answer:
      value: 50
    feedback:
      - when: abs(numval(state.input) - 0.05) < 0.001
        misconception: milli-micro
        text: "Erst umrechnen: 1 mSv = 1000 µSv."
    hints:
      - 1 mSv = 1000 µSv.
      - "1000 : 20 = ?"
    explanation: "1000 µSv : 20 µSv/h = 50 h. Zeit ist die dritte Schutzregel: Die Dosis wächst genau mit der Aufenthaltsdauer."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Nach einem Reaktorunfall sollen Menschen in der Nähe schnell Jodtabletten nehmen. Was bewirken sie?
    params:
      options:
        - label: Sie füllen die Schilddrüse mit normalem Jod, sodass sie kein radioaktives Jod-131 mehr aufnimmt.
          correct: true
        - label: Sie machen Strahlung unschädlich.
          feedback: Tabletten können keine Strahlung abschirmen. Sie wirken nur auf ein Organ.
        - label: Sie heilen Strahlenschäden.
          feedback: Sie verhindern nur das Einlagern von Jod-131 – vorher genommen.
    hints:
      - Welches Organ sammelt Jod?
      - Ein volles Lager nimmt nichts mehr auf.
    explanation: Die Schilddrüse speichert Jod. Ist sie mit stabilem Jod gesättigt, wird Jod-131 wieder ausgeschieden. Nach einigen Halbwertszeiten von 8 Tagen ist die Gefahr vorbei.
    difficulty: 3

srs:
  cards_from: [abstand, radon]
