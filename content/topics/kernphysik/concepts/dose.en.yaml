id: sci.nuclear.dose
type: concept
title: Radiation in everyday life
summary: Comparing doses.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      We are exposed to radiation all the time – from rock, from space and even from our food. Its effect on the body is measured in **millisieverts** (mSv). In Germany, natural radiation averages about 2 mSv per year.

  - kind: problem
    id: jahre
    widget: numeric
    prompt: How much natural radiation adds up over {{y}} years at 2 mSv per year?
    params: { unit: mSv }
    answer: { value: "{{2 * y}}" }
    hints:
      - "2 · {{y}}."
    explanation: "{{2 * y}} mSv – with no power plant or doctor involved."
    variants:
      params: { y: "int[5,40]" }
      defaults: { y: 10 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort by radiation dose, smallest first.
    params:
      items:
        - { label: Eating a banana }
        - { label: Dental X-ray }
        - { label: Flight to New York }
        - { label: CT scan of the abdomen }
    hints:
      - A CT scan is a whole series of X-ray images.
    explanation: Banana about 0.0001, dental X-ray 0.005, flight 0.05, CT around 10 mSv.

  - kind: problem
    id: flug
    widget: choice
    prompt: Why do you get more radiation when flying?
    params:
      options:
        - { label: "Up high, less air shields you from cosmic radiation.", correct: true }
        - { label: The airplane gives off radiation., feedback: "The radiation comes from space – on the ground, the air protects you." }
    hints:
      - What is above you on the ground, but not in a plane?
    explanation: The atmosphere acts like a thick shield.

srs:
  cards_from: [ordnen, flug]
