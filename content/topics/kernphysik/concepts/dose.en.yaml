id: sci.nuclear.dose
type: concept
title: Radiation in everyday life
summary: Comparing doses.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Radiation all around
    body: "Radiation comes from the ground, from rocks and from space. Flip the cards: where do you get a surprisingly high **dose**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🛰️
            front: Half a year on the ISS
            back: That brings as much radiation as several decades on the ground.
          - icon: 🚬
            front: Smoking
            back: Tobacco contains radioactive polonium. Smokers get an extra dose in their lungs.
          - icon: 🪨
            front: Granite
            back: Some granite rocks give off measurably more radiation than a sandy beach.
          - icon: 🏘️
            front: Ramsar in Iran
            back: In some homes there, natural radiation is up to a hundred times stronger than here.

  - kind: problem
    id: hook
    widget: choice
    prompt: "Which is more radioactive: a banana or an apple?"
    params:
      options:
        - label: The banana
          correct: true
        - label: The apple
          feedback: It contains less potassium.
        - label: Neither is radioactive
          feedback: Almost everything is slightly radioactive.
    hints:
      - Bananas contain a lot of potassium.
    explanation: A tiny part of the potassium is radioactive. It is not dangerous.

  - kind: explain
    id: s1
    body: |
      We are exposed to radiation all the time – from rock, from space and even from our food. Its effect on the body is measured in **millisieverts** (mSv). In Germany, natural radiation averages about 2 mSv per year.

  - kind: problem
    id: jahre
    widget: numeric
    prompt: How much natural radiation adds up over {{y}} years at 2 mSv per year?
    params: { unit: mSv }
    answer: { value: "{{2 * y}}" }
    hints:
      - "2 · {{y}}."
    explanation: "{{2 * y}} mSv – with no power plant or doctor involved."
    variants:
      params: { y: "int[5,40]" }
      defaults: { y: 10 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort by radiation dose, smallest first.
    params:
      items:
        - { label: Eating a banana }
        - { label: Dental X-ray }
        - { label: Flight to New York }
        - { label: CT scan of the abdomen }
    hints:
      - A CT scan is a whole series of X-ray images.
    explanation: Banana about 0.0001, dental X-ray 0.005, flight 0.05, CT around 10 mSv.

  - kind: problem
    id: flug
    widget: choice
    prompt: Why do you get more radiation when flying?
    params:
      options:
        - { label: "Up high, less air shields you from cosmic radiation.", correct: true }
        - { label: The airplane gives off radiation., feedback: "The radiation comes from space – on the ground, the air protects you." }
    hints:
      - What is above you on the ground, but not in a plane?
    explanation: The atmosphere acts like a thick shield.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Bananas are slightly radioactive.
          right: true
        - text: Irradiated food becomes radioactive itself.
          right: false
          why: Irradiation kills germs but does not turn food into a source.
        - text: A flight across the Atlantic gives more radiation than a dental X-ray.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A CT scan of the abdomen gives about 10 mSv. How many years of natural radiation (2 mSv a year) does that equal?
    params:
      unit: years
    answer:
      value: 5
    hints:
      - 10 ÷ 2.
    explanation: 5 years. Usually well justified medically – but no reason for unnecessary scans.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: a banana gives about 0.1 µSv. A flight from Frankfurt to New York about 50 µSv. How many bananas is the flight worth?"
    params:
      min: 1
      max: 100000
      scale: log
    answer:
      value: 500
      within: 50
    explanation: 50 ÷ 0.1 = 500 bananas. Both are harmless – a year of natural radiation is about 20,000 bananas.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: An absorbed dose of 1 gray means 1 joule per kg of body. A 70 kg person absorbs 0.001 Gy. How much energy in joules is that?
    params:
      unit: J
    answer:
      value: 0.07
    hints:
      - Energy = dose · mass.
      - 0.001 · 70 = ?
    explanation: Only 0.07 J – the heat you get from a candle in a fraction of a second. Radiation does harm not by heat but because single hits rip apart molecules like DNA.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is the same energy dose of alpha radiation in the body about 20 times more harmful than gamma radiation?
    params:
      options:
        - label: Alpha particles deposit their energy over a very short path and hit single cells hard
          correct: true
        - label: Alpha particles are faster
          feedback: They are slower – but heavy and doubly charged.
        - label: Gamma radiation is harmless
          feedback: It harms too – only the energy is spread over far more tissue.
    hints:
      - The same energy – on one cell or spread over a million cells?
    explanation: "That is why the **sievert** exists: it weights the energy by its biological effect."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: The **equivalent dose** in sievert is the absorbed dose in gray times a weighting factor. It is 1 for gamma and beta but 20 for alpha. It accounts for how densely particles dump their energy.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Radon in a cellar gives the lungs 0.5 mGy of alpha radiation. What is the equivalent dose – in mSv?
    params:
      unit: mSv
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 0.5
        misconception: forgot-weighting
        text: For alpha each gray counts twenty times.
    hints:
      - "Weighting factor for alpha: 20."
      - 0.5 · 20 = ?
    explanation: 0.5 mGy · 20 = 10 mSv. That is why radon is the largest source of natural radiation in Germany – and why airing helps so much.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: From roughly what short-term whole-body dose do about half of people die without treatment?
    params:
      options:
        - label: About 4 to 5 sievert
          correct: true
        - label: About 5 millisievert
          feedback: That is only a little above the natural annual dose – entirely safe.
        - label: About 50 millisievert
          feedback: Several CT scans give that much. Acute radiation sickness only begins at about 1 Sv.
    hints:
      - A CT scan gives about 10 mSv – and is permitted.
      - Danger to life starts at doses a thousand times the annual dose.
    explanation: At 4 to 5 Sv – two thousand times the natural annual dose – the bone marrow is destroyed. With radiation the dose makes the poison.
    difficulty: 3

srs:
  cards_from: [ordnen, flug]
