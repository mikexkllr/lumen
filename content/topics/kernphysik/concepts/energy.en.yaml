id: sci.nuclear.energy
type: concept
title: Fission and fusion
summary: Energy from the nucleus.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: art
    widget: buckets
    prompt: Nuclear fission or nuclear fusion?
    params:
      buckets: [{ label: Fission }, { label: Fusion }]
      items:
        - { label: Today's nuclear power plants, bucket: Fission }
        - { label: Heavy uranium nuclei break apart, bucket: Fission }
        - { label: The Sun, bucket: Fusion }
        - { label: Light nuclei merge, bucket: Fusion }
    hints:
      - Fission means splitting, fusion means merging.
    explanation: Both release energy because the products have slightly less mass – $E = mc^2$.

  - kind: explain
    body: |
      In fission, a uranium nucleus releases neutrons that split more nuclei – a **chain reaction**. In a reactor, it is deliberately slowed so that exactly one neutron per fission carries on.

  - kind: problem
    id: kette
    widget: numeric
    prompt: Each fission triggers {{k}} new ones. How many fissions occur in generation {{g}}, if it all starts with one?
    params: { unit: fissions }
    answer: { value: "{{k ** (g - 1)}}" }
    hints:
      - "Generation 1: 1, generation 2: {{k}}, generation 3: {{k * k}} …"
    explanation: "{{k}} to the power of {{g - 1}} = {{k ** (g - 1)}} – unchecked, the number explodes."
    variants:
      params: { k: "int[2,3]", g: "int[4,6]" }
      defaults: { k: 2, g: 5 }

  - kind: problem
    id: fusion
    widget: choice
    prompt: Why is nuclear fusion so hard to build on Earth?
    params:
      options:
        - { label: "The nuclei repel each other and need millions of degrees to merge.", correct: true }
        - { label: There is no fuel., feedback: "Hydrogen isotopes are plentiful – the problem is the heat." }
    hints:
      - Positive nuclei repel each other.
    explanation: You have to confine a plasma hotter than 100 million degrees – without it touching a wall.

srs:
  cards_from: [art, fusion]
