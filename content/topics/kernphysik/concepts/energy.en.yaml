id: sci.nuclear.energy
type: concept
title: Fission and fusion
summary: Energy from the nucleus.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many tonnes of coal deliver as much energy as the fission of 1 kg of uranium-235?"
    params:
      min: 1
      max: 100000
      scale: log
      unit: t
    answer:
      value: 2700
      within: 70
    explanation: About 2700 tonnes. Nuclear forces are millions of times stronger than chemical bonds.

  - kind: problem
    id: art
    widget: buckets
    prompt: Nuclear fission or nuclear fusion?
    params:
      buckets: [{ label: Fission }, { label: Fusion }]
      items:
        - { label: Today's nuclear power plants, bucket: Fission }
        - { label: Heavy uranium nuclei break apart, bucket: Fission }
        - { label: The Sun, bucket: Fusion }
        - { label: Light nuclei merge, bucket: Fusion }
    hints:
      - Fission means splitting, fusion means merging.
    explanation: Both release energy because the products have slightly less mass – $E = mc^2$.

  - kind: explain
    id: s2
    body: |
      In fission, a uranium nucleus releases neutrons that split more nuclei – a **chain reaction**. In a reactor, it is deliberately slowed so that exactly one neutron per fission carries on.

  - kind: problem
    id: kette
    widget: numeric
    prompt: Each fission triggers {{k}} new ones. How many fissions occur in generation {{g}}, if it all starts with one?
    params: { unit: fissions }
    answer: { value: "{{k ** (g - 1)}}" }
    hints:
      - "Generation 1: 1, generation 2: {{k}}, generation 3: {{k * k}} …"
    explanation: "{{k}} to the power of {{g - 1}} = {{k ** (g - 1)}} – unchecked, the number explodes."
    variants:
      params: { k: "int[2,3]", g: "int[4,6]" }
      defaults: { k: 2, g: 5 }

  - kind: problem
    id: fusion
    widget: choice
    prompt: Why is nuclear fusion so hard to build on Earth?
    params:
      options:
        - { label: "The nuclei repel each other and need millions of degrees to merge.", correct: true }
        - { label: There is no fuel., feedback: "Hydrogen isotopes are plentiful – the problem is the heat." }
    hints:
      - Positive nuclei repel each other.
    explanation: You have to confine a plasma hotter than 100 million degrees – without it touching a wall.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In a chain reaction each fission triggers 2 new ones. After how many generations are there over a million fissions per generation?
    answer:
      value: 20
    hints:
      - 2 to the 10th is about 1000.
    explanation: 2²⁰ ≈ 1 million. In a bomb 80 generations take less than a millionth of a second.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do both the **fission** of heavy and the **fusion** of light nuclei release energy?
    params:
      options:
        - label: Medium-heavy nuclei such as iron are bound most tightly – both routes lead there
          correct: true
        - label: Because every nuclear reaction releases energy
          feedback: Splitting or fusing iron **costs** energy.
        - label: That is a contradiction – only one is true
          feedback: "Both are real: reactors split, stars fuse."
    hints:
      - The binding energy per nucleon has a maximum at iron.
    explanation: That is why fusion in stars ends at iron. Heavier elements form in supernovae and neutron star collisions.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between nuclear fission and nuclear fusion.
    params:
      keywords:
        - - spalt
          - teil
          - zerfäll
          - split
          - fission
          - break
        - - verschmelz
          - fusion
          - vereinig
          - fuse
          - merge
          - combine
        - - schwer
          - heavy
          - uran
          - uranium
        - - leicht
          - light
          - wasserstoff
          - hydrogen
          - sonne
          - sun
      min: 3
      sample: In fission a heavy nucleus such as uranium splits into two smaller ones. In fusion light nuclei such as hydrogen fuse into a larger one – that is how the Sun shines.
    difficulty: 3

srs:
  cards_from: [art, fusion]
