id: sci.nuclear.energy
type: concept
title: Fission and fusion
summary: Energy from the nucleus.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many tonnes of coal deliver as much energy as the fission of 1 kg of uranium-235?"
    params:
      min: 1
      max: 100000
      scale: log
      unit: t
    answer:
      value: 2700
      within: 70
    explanation: About 2700 tonnes. Nuclear forces are millions of times stronger than chemical bonds.

  - kind: problem
    id: art
    widget: buckets
    prompt: Nuclear fission or nuclear fusion?
    params:
      buckets: [{ label: Fission }, { label: Fusion }]
      items:
        - { label: Today's nuclear power plants, bucket: Fission }
        - { label: Heavy uranium nuclei break apart, bucket: Fission }
        - { label: The Sun, bucket: Fusion }
        - { label: Light nuclei merge, bucket: Fusion }
    hints:
      - Fission means splitting, fusion means merging.
    explanation: Both release energy because the products have slightly less mass – $E = mc^2$.

  - kind: explain
    id: s2
    body: |
      In fission, a uranium nucleus releases neutrons that split more nuclei – a **chain reaction**. In a reactor, it is deliberately slowed so that exactly one neutron per fission carries on.

  - kind: problem
    id: kette
    widget: numeric
    prompt: Each fission triggers {{k}} new ones. How many fissions occur in generation {{g}}, if it all starts with one?
    params: { unit: fissions }
    answer: { value: "{{k ** (g - 1)}}" }
    hints:
      - "Generation 1: 1, generation 2: {{k}}, generation 3: {{k * k}} …"
    explanation: "{{k}} to the power of {{g - 1}} = {{k ** (g - 1)}} – unchecked, the number explodes."
    variants:
      params: { k: "int[2,3]", g: "int[4,6]" }
      defaults: { k: 2, g: 5 }

  - kind: problem
    id: fusion
    widget: choice
    prompt: Why is nuclear fusion so hard to build on Earth?
    params:
      options:
        - { label: "The nuclei repel each other and need millions of degrees to merge.", correct: true }
        - { label: There is no fuel., feedback: "Hydrogen isotopes are plentiful – the problem is the heat." }
    hints:
      - Positive nuclei repel each other.
    explanation: You have to confine a plasma hotter than 100 million degrees – without it touching a wall.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In a chain reaction each fission triggers 2 new ones. After how many generations are there over a million fissions per generation?
    answer:
      value: 20
    hints:
      - 2 to the 10th is about 1000.
    explanation: 2²⁰ ≈ 1 million. In a bomb 80 generations take less than a millionth of a second.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Each fission of a U-235 nucleus releases about 3.2 · 10⁻¹¹ J. A reactor gives off 3000 MW of heat. How many fissions per second is that – in 10²⁰?
    answer:
      value: 0.94
      tolerance: 0.02
    hints:
      - 3000 MW = 3 · 10⁹ J per second.
      - 3 · 10⁹ ÷ 3.2 · 10⁻¹¹ = ?
    explanation: About 10²⁰ fissions per second. That sounds like a lot but is only about 37 mg of uranium per second.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: A reactor runs steadily. On average, how many new fissions does each fission trigger?
    params:
      options:
        - label: Exactly one
          correct: true
        - label: Two to three
          feedback: That many neutrons are released. The rest are deliberately absorbed.
        - label: None
          feedback: Then the chain reaction would die out at once.
    hints:
      - More than one – the power grows. Less – it falls.
      - Control rods absorb the surplus neutrons.
    explanation: At exactly 1 the chain is »critical« and the power stays constant. Control rods of boron or cadmium keep the factor there. In a bomb it is well above 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do both the **fission** of heavy and the **fusion** of light nuclei release energy?
    params:
      options:
        - label: Medium-heavy nuclei such as iron are bound most tightly – both routes lead there
          correct: true
        - label: Because every nuclear reaction releases energy
          feedback: Splitting or fusing iron **costs** energy.
        - label: That is a contradiction – only one is true
          feedback: "Both are real: reactors split, stars fuse."
    hints:
      - The binding energy per nucleon has a maximum at iron.
    explanation: That is why fusion in stars ends at iron. Heavier elements form in supernovae and neutron star collisions.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between nuclear fission and nuclear fusion.
    params:
      keywords:
        - - spalt
          - teil
          - zerfäll
          - split
          - fission
          - break
        - - verschmelz
          - fusion
          - vereinig
          - fuse
          - merge
          - combine
        - - schwer
          - heavy
          - uran
          - uranium
        - - leicht
          - light
          - wasserstoff
          - hydrogen
          - sonne
          - sun
      min: 3
      sample: In fission a heavy nucleus such as uranium splits into two smaller ones. In fusion light nuclei such as hydrogen fuse into a larger one – that is how the Sun shines.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Fissioning 1 kg of U-235 makes about 0.9 g of mass vanish. How much energy is that by E = mc² – in 10¹³ J? (c = 3 · 10⁸ m/s)
    answer:
      value: 8.1
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 8100) < 10
        misconception: grams
        text: "Work in kilograms: 0.9 g = 0.0009 kg."
    hints:
      - m = 9 · 10⁻⁴ kg, c² = 9 · 10¹⁶ m²/s².
      - 9 · 10⁻⁴ · 9 · 10¹⁶ = ?
    explanation: 8.1 · 10¹³ J. Coal yields 3 · 10⁷ J per kg – you would need 2700 tonnes. That is exactly the number from the start of the lesson.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Fusion: deuterium + tritium (5 nucleons) releases 17.6 MeV. Fission of U-235 (236 nucleons including the neutron) releases 200 MeV. How many times more energy per nucleon does fusion give? To one decimal place."
    answer:
      value: 4.2
      tolerance: 0.2
    hints:
      - "Fusion: 17.6 ÷ 5 ≈ 3.5 MeV per nucleon."
      - "Fission: 200 ÷ 236 ≈ 0.85 MeV per nucleon."
    explanation: 3.52 ÷ 0.85 ≈ 4.2. Per kilogram of fuel fusion yields about four times as much energy – and deuterium is in every drop of water.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Why does a uranium reactor need a moderator such as water or graphite?
    params:
      options:
        - label: It slows the fast neutrons – slow ones split U-235 much more easily.
          correct: true
        - label: It cools the reactor.
          feedback: Water can also cool. The moderator itself slows neutrons.
        - label: It absorbs all neutrons.
          feedback: Then the chain would stop. Control rods do that – partly.
    hints:
      - Neutrons emerge from fission very fast.
      - A slow neutron stays near the nucleus longer.
    explanation: In collisions with light nuclei neutrons lose a lot of speed – like a billiard ball hitting one of equal mass. Slow neutrons are captured by U-235 hundreds of times more easily.
    difficulty: 3

srs:
  cards_from: [art, fusion]
