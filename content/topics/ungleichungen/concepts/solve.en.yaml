id: alg.inequalities.solve
type: concept
title: Rearranging, With a Trap
summary: With negative factors, the sign flips.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The mirror trap
    body: You rearrange inequalities almost like equations – with one trap. Turn over the cards in order and watch the sign. What does a **negative number** do to it?
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: ➕
            front: Add 4 to both sides
            back: 5 > 3 becomes 9 > 7. The sign stays as it is.
          - icon: ✖️
            front: Times 2 on both sides
            back: 5 > 3 becomes 10 > 6. Still fine.
          - icon: 🪞
            front: Times −1 on both sides
            back: 5 and 3 turn into −5 and −3. Now −3 is bigger! So −5 < −3.

  - kind: problem
    id: plus
    widget: numeric
    prompt: Solve x + {{a}} > {{b}}. From which number on does it hold? x > …
    params: { prefix: "x >" }
    answer: { value: "{{b - a}}" }
    feedback:
      - when: "numval(state.input) == b + a"
        misconception: wrong-inverse
        text: Subtract {{a}} from both sides instead of adding.
    hints:
      - Like an equation, subtract {{a}} from both sides.
    explanation: "x > {{b}} − {{a}} = {{b - a}}."
    variants:
      params: { a: "int[2,9]", b: "int[5,20]" }
      defaults: { a: 4, b: 11 }

  - kind: explain
    id: s2
    body: |
      You rearrange inequalities almost like equations.
      **But:** If you multiply or divide by a **negative** number, you must flip the sign.

  - kind: problem
    id: umdrehen
    widget: choice
    prompt: From −2x > 6 it follows that …
    params:
      options:
        - { label: x < −3, correct: true }
        - { label: x > −3, feedback: "Divided by −2, the sign must flip." }
        - { label: x > 3, feedback: "The sign of the 3 changes too." }
    hints:
      - Divide by −2 and remember the rule.
    explanation: Divided by −2, > flips to <. So x < −3.

  - kind: explain
    id: s4
    body: Why does the sign flip?
    reveal:
      body: 3 < 5 is true. Times −1 gives −3 and −5. Now −3 is the larger number, so the order reverses.

  - kind: problem
    id: negativ
    widget: numeric
    prompt: Solve −{{a}}x ≥ {{c}}. Then x ≤ …
    params: { prefix: "x ≤" }
    answer: { value: "{{-k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: lost-sign
        text: Divide by −{{a}}. The result is negative.
    hints:
      - "Divide both sides by −{{a}} and flip the sign."
    explanation: "x ≤ {{c}} ÷ (−{{a}}) = {{-k}}."
    variants:
      params: { a: "int[2,5]", k: "int[1,6]" }
      derive: { c: "a * k" }
      defaults: { a: 3, k: 4 }

  - kind: problem
    id: nicht-drehen
    widget: choice
    prompt: Which step does NOT flip the sign?
    params:
      options:
        - { label: Subtracting 5 from both sides, correct: true }
        - { label: Multiplying by −1, feedback: "Multiplying by a negative always flips it." }
        - { label: Dividing by −4, feedback: "Dividing by a negative number flips it." }
    hints:
      - Only multiplying and dividing by negative numbers are risky.
    explanation: Adding and subtracting never change the order.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Add 7 on both sides
          right: false
        - text: Multiply both sides by −2
          right: true
        - text: Divide both sides by 5
          right: false
        - text: Divide both sides by −1
          right: true
        - text: Add −3 on both sides
          right: false
          why: Adding only shifts – even with negative numbers.
      left: Sign stays
      right: Sign flips

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Solve $7 - 3x \le 19$. Then x ≥ …
    answer:
      value: -4
    hints:
      - −3x ≤ 12. Now divide by −3 – and flip the sign.
    explanation: "x ≥ −4. Check with x = 0: 7 ≤ 19 is true."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numberline
    prompt: Solve $-3x \ge 6$. Put the marker on the largest allowed number.
    params:
      min: -5
      max: 5
      ticks: 1
      labels: integers
    answer:
      value: -2
    feedback:
      - when: state.value == 2
        misconception: sign
        text: Dividing by −3 flips the sign – of the inequality and of the number.
    hints:
      - Divide by −3 – the sign flips.
      - $x \le -2$.
    explanation: "$x \\le -2$. Check: −3 · (−2) = 6 ≥ 6 works, −3 · (−1) = 3 does not."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Solve ${{c + b * s}} - {{b}}x < {{c}}$. Then x > …
    answer:
      value: "{{s}}"
    hints:
      - "Subtract {{c + b * s}}: $-{{b}}x < {{0 - b * s}}$."
      - Divide by −{{b}} – and flip the sign.
    explanation: $-{{b}}x < {{0 - b * s}}$ becomes $x > {{s}}$.
    difficulty: 2
    variants:
      params:
        s: int[-3,4]
        b: int[2,5]
        c: int[1,9]
      defaults:
        s: 2
        b: 3
        c: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: order
    prompt: Solve $-2x + 3 > 11$. Put the steps in order.
    params:
      items:
        - label: $-2x + 3 > 11$
        - label: "Minus 3: $-2x > 8$"
        - label: Divide by −2, sign flips
        - label: $x < -4$
    hints:
      - First remove the number without x.
      - Dividing by a negative number comes last.
    explanation: "Check with x = −5: 10 + 3 = 13 > 11 holds."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: May you simply multiply $\frac{1}{x} < 2$ by x?
    params:
      options:
        - label: No – you do not know whether x is positive or negative
          correct: true
        - label: Yes, as with equations
          feedback: For negative x the sign would have to flip.
        - label: Yes, if you always flip the sign
          feedback: For positive x it stays.
    hints:
      - What happens to the sign if x is negative?
    explanation: "You need a **case distinction**: treat x > 0 and x < 0 separately."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "A product is negative when the **signs** of its factors differ. That is how you solve $(x - 2)(x + 3) < 0$: one factor must be positive, the other negative."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: How many integers satisfy $(x - 2)(x + 3) < 0$?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 6
        misconception: boundary
        text: At x = −3 and x = 2 the product is 0 – not less than 0.
    hints:
      - The zeros are −3 and 2.
      - "In between the product is negative: −3 < x < 2."
    explanation: −2, −1, 0 and 1 – four numbers.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Can you always conclude $a^2 > b^2$ from $a > b$?
    params:
      options:
        - label: −3 > −5, but 9 < 25.
          feedback: −3 > −5, aber 9 < 25.
        - label: Only if neither side is negative
          correct: true
        - label: 5 > 3 and 25 > 9 – that works.
          feedback: 5 > 3 und 25 > 9 – das klappt.
    hints:
      - Try −3 > −5.
      - Squaring makes negative numbers positive.
    explanation: For numbers from 0 upwards squaring is monotonic. With negatives the order can reverse.
    difficulty: 3

srs:
  cards_from: [umdrehen, negativ]
