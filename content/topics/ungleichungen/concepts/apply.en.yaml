id: alg.inequalities.apply
type: concept
title: Comparing Plans
summary: When does the base fee pay off?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: When does the deal flip?
    body: "Phones, gyms, car sharing: everywhere two plans compete. The lines show the costs. Drag P onto the point where they cross. From there on, the other plan is **cheaper**."
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 10
        y:
          - 0
          - 12
        functions:
          - expr: 4 + x
            label: A
          - expr: 2*x
            label: B
        points:
          - id: P
            x: 1
            y: 1
        showCoordinates: true

  - kind: problem
    id: telefon
    widget: numeric
    prompt: Plan A costs a €10 base fee plus €0.10 per minute. Plan B costs €0.30 per minute. From how many minutes on is A cheaper?
    params: { prefix: "more than", unit: minutes }
    answer: { value: 50 }
    feedback:
      - when: "numval(state.input) == 100"
        misconception: base-fee
        text: Compare the extra cost per minute, €0.30 − €0.10 = €0.20.
    hints:
      - Set up 10 + 0.1 · m < 0.3 · m.
    explanation: 10 < 0.2 · m, so m > 50.

  - kind: explain
    id: s2
    body: |
      Questions like this are **inequalities**, cost A < cost B.
      Solve for the quantity. The limit shows where a plan tips over.

  - kind: problem
    id: studio
    widget: numeric
    prompt: Gym A charges a €{{g}} sign-up fee and €{{a}} per month. Gym B has no sign-up fee but charges €{{b}} per month. From which month on is A cheaper?
    params: { unit: month }
    answer: { value: "{{floor(g / (b - a)) + 1}}" }
    hints:
      - "Each month, A saves €{{b - a}}. When do you earn back the €{{g}}?"
    explanation: "{{g}} ÷ {{b - a}} ≈ {{round(g / (b - a), 1)}}. From month {{floor(g / (b - a)) + 1}} on, A is cheaper."
    variants:
      params: { g: "choice[50,60,100]", a: "choice[20,25]", b: "choice[30,35]" }
      defaults: { g: 60, a: 20, b: 30 }

  - kind: problem
    id: taxi
    widget: choice
    prompt: A taxi costs €4 plus €2 per kilometer. You have €20. What is the farthest you can go?
    params:
      layout: grid
      options:
        - { label: 8 km, correct: true }
        - { label: 10 km, feedback: "You must subtract the €4 base fare first." }
        - { label: 12 km, feedback: "Too far. Solve 4 + 2 · k ≤ 20." }
    hints:
      - 4 + 2 · k ≤ 20.
    explanation: 2 · k ≤ 16, so k ≤ 8.

  - kind: explain
    id: s5
    body: Why use an inequality to compare contracts?
    reveal:
      body: It shows where a plan tips over. Stay below that point, and the plan with a base fee costs you more.

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: Plan A costs a €6 base fee plus €1 per hour, plan B €3 per hour. Put P exactly on the point where both cost the same.
    params:
      x:
        - 0
        - 8
      y:
        - 0
        - 12
      functions:
        - expr: 6 + x
        - expr: 3*x
      points:
        - id: P
          x: 0
          y: 0
      showCoordinates: true
    answer:
      points:
        P:
          x: 3
          y: 9
    hints:
      - "Equally expensive means: $6 + x = 3x$."
      - "Subtract x on both sides: $6 = 2x$. Where is the point then?"
    explanation: At 3 hours both cost €9. Below that B is cheaper, above it A.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A copy shop charges €5 base price plus €0.04 per page. You have €12. How many pages at most?
    answer:
      value: 175
    hints:
      - 5 + 0.04 · n ≤ 12.
    explanation: 0.04 n ≤ 7, so n ≤ 175.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: match
    prompt: Which sign goes with which phrase?
    params:
      pairs:
        - left: at most
          right: ≤
        - left: at least
          right: ≥
        - left: more than
          right: ">"
        - left: less than
          right: <
    hints:
      - »At most 5« – may it be exactly 5?
      - With »more than« the boundary is excluded.
    explanation: At most and at least include the boundary, more than and less than do not.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: A ticket costs €{{t}}. You have €{{g}}. How many tickets can you buy at most?
    answer:
      value: "{{floor(g / t)}}"
    feedback:
      - when: numval(state.input) == ceil(g / t)
        misconception: round-up
        text: There is not enough money for the last ticket – round down!
    hints:
      - $ {{t}} \cdot n \le {{g}}$.
      - "{{g}} : {{t}} ≈ {{round(g / t * 10) / 10}}."
    explanation: "{{floor(g / t)}} tickets cost €{{floor(g / t) * t}}. One more would be too expensive."
    difficulty: 2
    variants:
      params:
        t: choice[3,4,6,7]
        g: int[20,60]
      constraints:
        - g % t != 0
      defaults:
        t: 7
        g: 50

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: A lift carries at most 630 kg. A man weighs 90 kg and has boxes of 30 kg each. How many boxes can he take at most?
    answer:
      value: 18
    feedback:
      - when: numval(state.input) == 21
        misconception: forgot-person
        text: The man counts too!
    hints:
      - $90 + 30k \le 630$.
      - $30k \le 540$.
    explanation: "540 : 30 = 18 boxes."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A car costs €30,000 and €0.10 per km. An electric car costs €36,000 and €0.04 per km. From how many kilometres is the electric car cheaper overall?
    params:
      unit: km
    answer:
      value: 100000
    hints:
      - 36,000 + 0.04 k < 30,000 + 0.10 k.
    explanation: 6000 < 0.06 k, so k > 100,000. This is the **break-even point**.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Grades from 1 (best) to 6: you have 2, 3 and 4. The average of four tests must not be worse than 3.0. What is the worst grade you may get in the fourth?"
    answer:
      value: 3
    hints:
      - "$(2 + 3 + 4 + x) : 4 \\le 3$."
      - $9 + x \le 12$.
    explanation: $x \le 3$. A 3 keeps the average at exactly 3.0.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: When several inequalities hold at once, they describe what is allowed. Within that you look for the best solution – this is **linear programming**. Companies plan production, timetables and stock this way.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: You have 10 eggs. A cake needs 3 eggs, a tray of waffles 2 eggs. You bake 2 cakes. How many trays of waffles can you still make at most?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 5
        misconception: forgot-cakes
        text: The cakes already use 6 eggs.
    hints:
      - $2 \cdot 3 + 2w \le 10$.
      - $2w \le 4$.
    explanation: w ≤ 2. Exactly 10 eggs are used.
    difficulty: 3

srs:
  cards_from: [studio, taxi]
