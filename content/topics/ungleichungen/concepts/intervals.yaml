id: alg.inequalities.intervals
type: concept
title: Von … bis
summary: Doppelte Ungleichungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Von hier bis da
    body: Viele Regeln im Alltag gelten nur in einem Bereich – nicht zu kalt, nicht zu alt. Deck die Karten auf. Wo liegt jeweils die untere und wo die obere Grenze? Mathe nennt solche Bereiche **Intervalle**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧊
            front: Kühlschrank
            back: Zwischen 2 und 7 °C bleibt Essen frisch. Kälter friert es, wärmer verdirbt es.
          - icon: 🎢
            front: Achterbahn
            back: Mitfahren darf oft nur, wer mindestens 1,20 m groß ist – und höchstens 1,95 m.
          - icon: 🌡️
            front: Körpertemperatur
            back: Normal sind etwa 36,5 bis 37,5 °C. Ab 38 °C spricht man von Fieber.
          - icon: 🎫
            front: Jugendticket
            back: Es gilt oft von 14 bis unter 26 Jahren. Am 26. Geburtstag ist Schluss.

  - kind: problem
    id: bereich
    widget: numberline
    prompt: Setze die Markierung auf eine Zahl mit 2 < x < 4.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "state.value > 2 && state.value < 4" }
    solution: { state: { value: 3 } }
    hints:
      - Zwischen 2 und 4, aber nicht genau auf 2 oder 4.
    explanation: Alles zwischen 2 und 4 passt – 2,5, 3 und 3,5.

  - kind: explain
    id: s2
    body: |
      **2 < x < 4** heißt: x ist größer als 2 **und** kleiner als 4.
      Solche Bereiche heißen **Intervalle**. Ein Thermostat hält die Temperatur zum Beispiel zwischen 19 und 22 Grad.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Liegt die Zahl in 18 ≤ x < 65?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: "18", bucket: ja }
        - { label: "40", bucket: ja }
        - { label: "64,9", bucket: ja }
        - { label: "65", bucket: nein }
        - { label: "17", bucket: nein }
    hints:
      - Das ≤ schließt die 18 ein, das < schließt die 65 aus.
    explanation: 18 gehört dazu, 65 nicht.

  - kind: problem
    id: ganze
    widget: numeric
    prompt: Wie viele ganze Zahlen x erfüllen {{a}} < x < {{b}}?
    params: { unit: Zahlen }
    answer: { value: "{{b - a - 1}}" }
    feedback:
      - when: "numval(state.input) == b - a + 1"
        misconception: inclusive
        text: Die Ränder gehören nicht dazu.
    hints:
      - "Zähle von {{a + 1}} bis {{b - 1}}."
    explanation: "{{a + 1}} bis {{b - 1}} – das sind {{b - a - 1}} Zahlen."
    variants:
      params: { a: "int[-5,3]", b: "int[6,12]" }
      defaults: { a: 2, b: 9 }

  - kind: problem
    id: c1
    widget: match
    prompt: Welche Schreibweise passt?
    params:
      pairs:
        - left: $2 < x < 5$
          right: (2, 5)
        - left: $2 \le x \le 5$
          right: "[2, 5]"
        - left: $2 \le x < 5$
          right: "[2, 5)"
        - left: $x \ge 5$
          right: "[5, ∞)"
    hints:
      - "Eckige Klammer heißt: die Grenze gehört dazu."
    explanation: Die Intervallschreibweise ist die Kurzform für doppelte Ungleichungen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele ganze Zahlen erfüllen $-3 \le 2x + 1 < 9$?
    answer:
      value: 6
    hints:
      - "Zieh überall 1 ab und teile durch 2: −2 ≤ x < 4."
    explanation: −2, −1, 0, 1, 2, 3 – sechs Zahlen.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Intervalle schreibt man kurz mit Klammern. [2; 5] heißt 2 ≤ x ≤ 5. Zeigt eine **eckige Klammer** nach außen, wie bei ]2; 5], gehört die 2 nicht dazu.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numberline
    prompt: Setze die Markierung auf eine negative Zahl im Intervall $-1 \le x < 2$.
    params:
      min: -3
      max: 3
      ticks: 2
      labels: integers
    check:
      predicate: state.value >= -1 && state.value < 0
    hints:
      - Die −1 gehört dazu.
      - Negativ heißt links von 0.
    explanation: −1 oder −0,5 passen. 0 ist nicht negativ.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Wie viele ganze Zahlen liegen in $-3 \le x \le 4$?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 7
        misconception: off-by-one
        text: Beide Grenzen gehören dazu – und auch die 0.
    hints:
      - Zähle von −3 bis 4.
      - 4 − (−3) + 1.
    explanation: −3, −2, −1, 0, 1, 2, 3, 4 – acht Zahlen.
    difficulty: 2

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: Welche Zahlen liegen in beiden Bereichen $1 \le x \le 4$ und $3 \le x \le 7$?
    params:
      options:
        - label: $3 \le x \le 4$
          correct: true
        - label: $1 \le x \le 7$
          feedback: Das ist die Vereinigung – Zahlen in mindestens einem Bereich.
        - label: $4 \le x \le 3$
          feedback: Diesen Bereich gibt es nicht.
    hints:
      - Wo überlappen sich die beiden Strecken?
      - Ab 3 und bis 4.
    explanation: "Die Schnittmenge ist die Überlappung: von 3 bis 4."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Wie viele gerade Zahlen erfüllen $x > 1$ und $x \le 12$?
    answer:
      value: 6
    hints:
      - Beginne bei 2.
      - 2, 4, 6, … bis 12.
    explanation: 2, 4, 6, 8, 10, 12 – sechs Zahlen.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: "Georg Cantor zeigte: Das Intervall zwischen 0 und 1 enthält genauso viele Zahlen wie der ganze Zahlenstrahl. Beide sind **überabzählbar** – es gibt mehr davon als natürliche Zahlen."

srs:
  cards_from: [einordnen, ganze]
