id: alg.inequalities.intervals
type: concept
title: Von … bis
summary: Doppelte Ungleichungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: bereich
    widget: numberline
    prompt: Setze die Markierung auf eine Zahl mit 2 < x < 4.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "state.value > 2 && state.value < 4" }
    solution: { state: { value: 3 } }
    hints:
      - Zwischen 2 und 4, aber nicht genau auf 2 oder 4.
    explanation: Alles zwischen 2 und 4 passt – 2,5, 3 und 3,5.

  - kind: explain
    body: |
      **2 < x < 4** heißt: x ist größer als 2 **und** kleiner als 4.
      Solche Bereiche heißen **Intervalle**. Ein Thermostat hält die Temperatur zum Beispiel zwischen 19 und 22 Grad.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Liegt die Zahl in 18 ≤ x < 65?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: "18", bucket: ja }
        - { label: "40", bucket: ja }
        - { label: "64,9", bucket: ja }
        - { label: "65", bucket: nein }
        - { label: "17", bucket: nein }
    hints:
      - Das ≤ schließt die 18 ein, das < schließt die 65 aus.
    explanation: 18 gehört dazu, 65 nicht.

  - kind: problem
    id: ganze
    widget: numeric
    prompt: Wie viele ganze Zahlen x erfüllen {{a}} < x < {{b}}?
    params: { unit: Zahlen }
    answer: { value: "{{b - a - 1}}" }
    feedback:
      - when: "numval(state.input) == b - a + 1"
        misconception: inclusive
        text: Die Ränder gehören nicht dazu.
    hints:
      - "Zähle von {{a + 1}} bis {{b - 1}}."
    explanation: "{{a + 1}} bis {{b - 1}} – das sind {{b - a - 1}} Zahlen."
    variants:
      params: { a: "int[-5,3]", b: "int[6,12]" }
      defaults: { a: 2, b: 9 }

srs:
  cards_from: [einordnen, ganze]
