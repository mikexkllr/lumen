id: alg.inequalities.distance
type: concept
title: Tolerances
summary: At most this far from the target.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: schraube
    widget: choice
    prompt: A screw should be 50 mm long, with a tolerance of ± 0.5 mm. Which length is still acceptable?
    params:
      options:
        - { label: "49.6 mm", correct: true }
        - { label: "49.4 mm", feedback: "That is 0.6 mm too short." }
        - { label: 51 mm, feedback: "That is 1 mm too long." }
    hints:
      - Allowed is 49.5 to 50.5 mm.
    explanation: 49.6 mm is off by only 0.4 mm.

  - kind: explain
    id: s2
    body: |
      "At most 2 away from 5" is written |x − 5| ≤ 2. That means 3 ≤ x ≤ 7.
      The absolute value measures the **distance**.

  - kind: problem
    id: abstand
    widget: numberline
    prompt: Place the marker on a number with |x − 3| ≤ 1.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "abs(state.value - 3) <= 1" }
    solution: { state: { value: 3 } }
    hints:
      - At most 1 away from 3.
    explanation: Everything between 2 and 4 works.

  - kind: problem
    id: grenzen
    widget: numeric
    prompt: "|x − {{m}}| ≤ {{d}}. What is the largest allowed number?"
    params: { placeholder: "x" }
    answer: { value: "{{m + d}}" }
    hints:
      - "Go {{d}} to the right from {{m}}."
    explanation: "{{m}} + {{d}} = {{m + d}}."
    variants:
      params: { m: "int[-5,10]", d: "int[1,6]" }
      defaults: { m: 5, d: 2 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "$|x - 5| \\le 2$ means: x is at most [[2]] away from [[5]]. So x lies between [[3]] and 7."
      distractors:
        - −2
        - "10"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: For which numbers does $|2x - 6| < 4$ hold? Give the upper bound.
    answer:
      value: 5
    hints:
      - −4 < 2x − 6 < 4.
    explanation: 2 < 2x < 10, so 1 < x < 5.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numberline
    prompt: Put the marker on a number with $|x + 2| \le 1$.
    params:
      min: -5
      max: 2
      ticks: 2
      labels: integers
    check:
      predicate: abs(state.value + 2) <= 1
    hints:
      - $|x + 2| = |x - (-2)|$ – the distance from −2.
      - "At most 1 away from −2: from −3 to −1."
    explanation: "All numbers from −3 to −1 work. Plus 2 inside means: distance from −2."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: How many integers satisfy $|x - {{m}}| \le {{d}}$?
    answer:
      value: "{{2 * d + 1}}"
    feedback:
      - when: numval(state.input) == 2 * d
        misconception: forgot-centre
        text: The centre {{m}} itself counts too.
    hints:
      - From {{m - d}} to {{m + d}}.
      - "{{d}} left, {{d}} right and the centre."
    explanation: "{{d}} + {{d}} + 1 = {{2 * d + 1}} numbers."
    difficulty: 2
    variants:
      params:
        m: int[-5,9]
        d: int[1,6]
      defaults:
        m: 4
        d: 3

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: How do you write »x is at most 0.5 away from 10«?
    params:
      options:
        - label: $|x - 10| \le 0.5$
          correct: true
        - label: $|x - 0.5| \le 10$
          feedback: Centre and distance are swapped.
        - label: $|x| \le 10.5$
          feedback: That would be the distance from 0.
    hints:
      - The absolute value measures the distance from the centre.
      - Centre 10, distance at most 0.5.
    explanation: $|x - 10| \le 0.5$ means 9.5 ≤ x ≤ 10.5 – a tolerance.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The triangle inequality says $|a + b| \le |a| + |b|$. When does **equality** hold?
    params:
      options:
        - label: When a and b have the same sign (or one is zero)
          correct: true
        - label: Always
          feedback: For a = 3 and b = −3 the left is 0 and the right is 6.
        - label: Only if a = b
          feedback: For 2 and 5 we also get 7 = 7.
    hints:
      - Try a = 3, b = −3 and a = 2, b = 5.
    explanation: With different signs parts cancel. The inequality is a basic tool of analysis.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: For which x is $|x - 1| = |x - 5|$?
    answer:
      value: 3
    hints:
      - x is equally far from 1 and from 5.
      - The midpoint between 1 and 5.
    explanation: x = 3 – 2 away from each. In the plane this becomes the perpendicular bisector.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Absolute values define **limits**. A sequence goes to a if the gap $|a_n - a|$ gets smaller than any small number ε you pick. That is the language of calculus.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: From which n is $\frac{1}{n}$ less than 0.01 away from 0? Give the smallest n.
    answer:
      value: 101
    feedback:
      - when: numval(state.input) == 100
        misconception: boundary
        text: At n = 100 the distance is exactly 0.01 – not less.
    hints:
      - $\frac{1}{n} < 0.01$ means $n > 100$.
      - The first integer above 100.
    explanation: n = 101. For any tolerance you can find such an n – that is why the limit of 1/n is 0.
    difficulty: 3

srs:
  cards_from: [abstand, grenzen]
