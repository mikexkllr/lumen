id: alg.inequalities.basics
type: concept
title: Infinitely Many Solutions
summary: Inequalities describe ranges.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: markieren
    widget: numberline
    prompt: Place the marker on a number for which x > 3 holds.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "state.value > 3" }
    solution: { state: { value: 4 } }
    hints:
      - Anything to the right of 3, but not 3 itself.
    explanation: Any number to the right of 3 works, such as 3.5, 4, 5, and so on.

  - kind: explain
    id: s2
    body: |
      An **inequality** usually has infinitely many solutions.
      x > 3 holds for 3.1, for 4, and for 1000, but not for 3 itself.

  - kind: problem
    id: welche
    widget: choice
    prompt: Which numbers satisfy 2x + 1 < 9? Choose all.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "0", correct: true }
        - { label: "3", correct: true }
        - { label: "4", feedback: "2 · 4 + 1 = 9. You need strictly less than 9." }
        - { label: "−2", correct: true }
        - { label: "5" }
    hints:
      - Plug in each number.
    explanation: 0, 3, and −2 give 1, 7, and −3, all less than 9.

  - kind: problem
    id: kleiner-gleich
    widget: buckets
    prompt: Does the number satisfy x ≤ 5?
    params:
      buckets: [{ label: yes }, { label: no }]
      items:
        - { label: "5", bucket: yes }
        - { label: "−10", bucket: yes }
        - { label: "4.99", bucket: yes }
        - { label: "5.5", bucket: no }
        - { label: "6", bucket: no }
        - { label: "100", bucket: no }
    hints:
      - The ≤ includes the 5.
    explanation: Everything up to and including 5 works.

  - kind: problem
    id: groesste
    widget: numeric
    prompt: What is the largest integer x with 3x < {{c}}?
    params: { placeholder: "x" }
    answer: { value: "{{floor(c / 3)}}" }
    hints:
      - "Divide {{c}} by 3 and round down."
    explanation: "x < {{c}}/3 ≈ {{round(c / 3, 2)}}, so at most {{floor(c / 3)}}."
    variants:
      params: { c: "int[10,40]" }
      constraints: ["mod(c, 3) != 0"]
      defaults: { c: 20 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: x > 3 holds for 3.01.
          right: true
        - text: x > 3 holds for 3.
          right: false
          why: Greater means strictly greater. With ≥ the 3 would be included.
        - text: x ≤ −2 holds for −5.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many natural numbers (from 1) satisfy $3x + 2 < 20$?
    answer:
      value: 5
    hints:
      - 3x < 18, so x < 6.
    explanation: 1, 2, 3, 4 and 5. Not 6 itself.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: On the number line the solution is drawn as a **ray**. An open circle means the boundary is not included, as in x > 3. A filled circle means it is included, as in x ≥ 3.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numberline
    prompt: Put the marker on the smallest integer with $2x - 1 \ge 7$.
    params:
      min: 0
      max: 10
      ticks: 1
      labels: integers
    answer:
      value: 4
    hints:
      - "Add 1 to both sides: $2x \\ge 8$."
      - "Divide by 2: $x \\ge 4$. Is 4 included?"
    explanation: $x \ge 4$ – 4 itself is included, because 2 · 4 − 1 = 7.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: What is the smallest integer x with ${{a}}x > {{c}}$?
    answer:
      value: "{{floor(c / a) + 1}}"
    feedback:
      - when: c % a == 0 && numval(state.input) == c / a
        misconception: boundary
        text: "With > the boundary is excluded: {{a}} · {{c / a}} is exactly {{c}}, not more."
    hints:
      - "Divide by {{a}}: $x > {{c / a}}$."
      - Which integer comes first after that?
    explanation: $x > {{c / a}}$, so {{floor(c / a) + 1}} is the smallest integer solution.
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        c: int[5,30]
      defaults:
        a: 3
        c: 12

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: For which x does $x^2 < 9$ hold?
    params:
      options:
        - label: −3 < x < 3
          correct: true
        - label: x < 3
          feedback: −5 is less than 3, but (−5)² = 25.
        - label: x < −3 or x > 3
          feedback: That is the solution of x² > 9.
    hints:
      - Try x = −5.
    explanation: Squaring makes negatives positive. The solution is an interval around zero.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: For which numbers does $x^2 > x$ hold?
    params:
      options:
        - label: "Try x = 0.5: 0.25 is smaller."
          feedback: "Probiere x = 0,5: 0,25 ist kleiner."
        - label: Between 0 and 1 the square gets smaller.
          feedback: Zwischen 0 und 1 wird das Quadrat kleiner.
        - label: For x < 0 or x > 1
          correct: true
        - label: "Try x = 2: 4 > 2."
          feedback: "Probiere x = 2: 4 > 2."
    hints:
      - Try x = −1, 0.5 and 2.
      - At 0 and 1 they are equal.
    explanation: "$x^2 - x = x(x - 1) > 0$ when both factors have the same sign: x < 0 or x > 1."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Real numbers are **ordered**. Take any two of them, a and b. Then a < b, a = b or a > b – just one of the three. With complex numbers this breaks down. There is no »bigger« there.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why there is no end to the numbers that make $x > 3$ true.
    params:
      keywords:
        - - jede
          - alle
          - every
          - any
          - all
        - - größer
          - greater
          - larger
          - bigger
          - rechts
          - right
        - - unendlich
          - kein ende
          - infinite
          - no end
          - endlos
          - endless
      sample: "Every number greater than 3 satisfies the inequality: 3.1, 4, 100 and so on. There is no end upwards, so infinitely many solutions."
    explanation: "Key idea: an inequality describes a whole region, not a single point."
    difficulty: 3

srs:
  cards_from: [welche, groesste]
