id: alg.inequalities.basics
type: concept
title: Infinitely Many Solutions
summary: Inequalities describe ranges.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: markieren
    widget: numberline
    prompt: Place the marker on a number for which x > 3 holds.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "state.value > 3" }
    solution: { state: { value: 4 } }
    hints:
      - Anything to the right of 3, but not 3 itself.
    explanation: Any number to the right of 3 works, such as 3.5, 4, 5, and so on.

  - kind: explain
    body: |
      An **inequality** usually has infinitely many solutions.
      x > 3 holds for 3.1, for 4, and for 1000, but not for 3 itself.

  - kind: problem
    id: welche
    widget: choice
    prompt: Which numbers satisfy 2x + 1 < 9? Choose all.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "0", correct: true }
        - { label: "3", correct: true }
        - { label: "4", feedback: "2 · 4 + 1 = 9. You need strictly less than 9." }
        - { label: "−2", correct: true }
        - { label: "5" }
    hints:
      - Plug in each number.
    explanation: 0, 3, and −2 give 1, 7, and −3, all less than 9.

  - kind: problem
    id: kleiner-gleich
    widget: buckets
    prompt: Does the number satisfy x ≤ 5?
    params:
      buckets: [{ label: yes }, { label: no }]
      items:
        - { label: "5", bucket: yes }
        - { label: "−10", bucket: yes }
        - { label: "4.99", bucket: yes }
        - { label: "5.5", bucket: no }
        - { label: "6", bucket: no }
        - { label: "100", bucket: no }
    hints:
      - The ≤ includes the 5.
    explanation: Everything up to and including 5 works.

  - kind: problem
    id: groesste
    widget: numeric
    prompt: What is the largest integer x with 3x < {{c}}?
    params: { placeholder: "x" }
    answer: { value: "{{floor(c / 3)}}" }
    hints:
      - "Divide {{c}} by 3 and round down."
    explanation: "x < {{c}}/3 ≈ {{round(c / 3, 2)}}, so at most {{floor(c / 3)}}."
    variants:
      params: { c: "int[10,40]" }
      constraints: ["mod(c, 3) != 0"]
      defaults: { c: 20 }

srs:
  cards_from: [welche, groesste]
