id: alg.inequalities.basics
type: concept
title: Infinitely Many Solutions
summary: Inequalities describe ranges.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: markieren
    widget: numberline
    prompt: Place the marker on a number for which x > 3 holds.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "state.value > 3" }
    solution: { state: { value: 4 } }
    hints:
      - Anything to the right of 3, but not 3 itself.
    explanation: Any number to the right of 3 works, such as 3.5, 4, 5, and so on.

  - kind: explain
    id: s2
    body: |
      An **inequality** usually has infinitely many solutions.
      x > 3 holds for 3.1, for 4, and for 1000, but not for 3 itself.

  - kind: problem
    id: welche
    widget: choice
    prompt: Which numbers satisfy 2x + 1 < 9? Choose all.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "0", correct: true }
        - { label: "3", correct: true }
        - { label: "4", feedback: "2 · 4 + 1 = 9. You need strictly less than 9." }
        - { label: "−2", correct: true }
        - { label: "5" }
    hints:
      - Plug in each number.
    explanation: 0, 3, and −2 give 1, 7, and −3, all less than 9.

  - kind: problem
    id: kleiner-gleich
    widget: buckets
    prompt: Does the number satisfy x ≤ 5?
    params:
      buckets: [{ label: yes }, { label: no }]
      items:
        - { label: "5", bucket: yes }
        - { label: "−10", bucket: yes }
        - { label: "4.99", bucket: yes }
        - { label: "5.5", bucket: no }
        - { label: "6", bucket: no }
        - { label: "100", bucket: no }
    hints:
      - The ≤ includes the 5.
    explanation: Everything up to and including 5 works.

  - kind: problem
    id: groesste
    widget: numeric
    prompt: What is the largest integer x with 3x < {{c}}?
    params: { placeholder: "x" }
    answer: { value: "{{floor(c / 3)}}" }
    hints:
      - "Divide {{c}} by 3 and round down."
    explanation: "x < {{c}}/3 ≈ {{round(c / 3, 2)}}, so at most {{floor(c / 3)}}."
    variants:
      params: { c: "int[10,40]" }
      constraints: ["mod(c, 3) != 0"]
      defaults: { c: 20 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: x > 3 holds for 3.01.
          right: true
        - text: x > 3 holds for 3.
          right: false
          why: Greater means strictly greater. With ≥ the 3 would be included.
        - text: x ≤ −2 holds for −5.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many natural numbers (from 1) satisfy $3x + 2 < 20$?
    answer:
      value: 5
    hints:
      - 3x < 18, so x < 6.
    explanation: 1, 2, 3, 4 and 5. Not 6 itself.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: For which x does $x^2 < 9$ hold?
    params:
      options:
        - label: −3 < x < 3
          correct: true
        - label: x < 3
          feedback: −5 is less than 3, but (−5)² = 25.
        - label: x < −3 or x > 3
          feedback: That is the solution of x² > 9.
    hints:
      - Try x = −5.
    explanation: Squaring makes negatives positive. The solution is an interval around zero.
    difficulty: 3

srs:
  cards_from: [welche, groesste]
