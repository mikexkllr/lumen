id: alg.inequalities.basics
type: concept
title: Unendlich viele Lösungen
summary: Ungleichungen beschreiben Bereiche.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: markieren
    widget: numberline
    prompt: Setze die Markierung auf eine Zahl, für die x > 3 gilt.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "state.value > 3" }
    solution: { state: { value: 4 } }
    hints:
      - Alles rechts von der 3 – aber nicht die 3 selbst.
    explanation: Jede Zahl rechts der 3 passt – 3,5, 4, 5 und so weiter.

  - kind: explain
    id: s2
    body: |
      Eine **Ungleichung** hat meist unendlich viele Lösungen.
      x > 3 gilt für 3,1, für 4 und für 1000 – aber nicht für 3 selbst.

  - kind: problem
    id: welche
    widget: choice
    prompt: Welche Zahlen erfüllen 2x + 1 < 9? Wähle alle.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "0", correct: true }
        - { label: "3", correct: true }
        - { label: "4", feedback: "2 · 4 + 1 = 9. Gesucht ist echt kleiner als 9." }
        - { label: "−2", correct: true }
        - { label: "5" }
    hints:
      - Setze jede Zahl ein.
    explanation: 0, 3 und −2 ergeben 1, 7 und −3 – alle kleiner als 9.

  - kind: problem
    id: kleiner-gleich
    widget: buckets
    prompt: Erfüllt die Zahl x ≤ 5?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: "5", bucket: ja }
        - { label: "−10", bucket: ja }
        - { label: "4,99", bucket: ja }
        - { label: "5,5", bucket: nein }
        - { label: "6", bucket: nein }
        - { label: "100", bucket: nein }
    hints:
      - Das ≤ schließt die 5 mit ein.
    explanation: Alles bis einschließlich 5 passt.

  - kind: problem
    id: groesste
    widget: numeric
    prompt: Was ist die größte ganze Zahl x mit 3x < {{c}}?
    params: { placeholder: "x" }
    answer: { value: "{{floor(c / 3)}}" }
    hints:
      - "Teile {{c}} durch 3 und runde ab."
    explanation: "x < {{c}}/3 ≈ {{round(c / 3, 2)}} – also höchstens {{floor(c / 3)}}."
    variants:
      params: { c: "int[10,40]" }
      constraints: ["mod(c, 3) != 0"]
      defaults: { c: 20 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: x > 3 gilt für 3,01.
          right: true
        - text: x > 3 gilt für 3.
          right: false
          why: Größer heißt echt größer. Bei ≥ wäre die 3 dabei.
        - text: x ≤ −2 gilt für −5.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele natürliche Zahlen (ab 1) erfüllen $3x + 2 < 20$?
    answer:
      value: 5
    hints:
      - 3x < 18, also x < 6.
    explanation: 1, 2, 3, 4 und 5. Die 6 selbst nicht.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Auf dem Zahlenstrahl zeichnet man die Lösung als **Strahl**. Ein offener Kreis heißt: Die Grenze gehört nicht dazu, wie bei x > 3. Ein voller Kreis heißt: Sie gehört dazu, wie bei x ≥ 3."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numberline
    prompt: Setze die Markierung auf die kleinste ganze Zahl mit $2x - 1 \ge 7$.
    params:
      min: 0
      max: 10
      ticks: 1
      labels: integers
    answer:
      value: 4
    hints:
      - "Plus 1 auf beiden Seiten: $2x \\ge 8$."
      - "Durch 2: $x \\ge 4$. Gehört die 4 dazu?"
    explanation: $x \ge 4$ – die 4 selbst gehört dazu, denn 2 · 4 − 1 = 7.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Welches ist die kleinste ganze Zahl x mit ${{a}}x > {{c}}$?
    answer:
      value: "{{floor(c / a) + 1}}"
    feedback:
      - when: c % a == 0 && numval(state.input) == c / a
        misconception: boundary
        text: "Bei > gehört die Grenze nicht dazu: {{a}} · {{c / a}} ist genau {{c}}, nicht mehr."
    hints:
      - "Teile durch {{a}}: $x > {{c / a}}$."
      - Welche ganze Zahl kommt als Erste danach?
    explanation: $x > {{c / a}}$, also ist {{floor(c / a) + 1}} die kleinste ganze Lösung.
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        c: int[5,30]
      defaults:
        a: 3
        c: 12

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Für welche x gilt $x^2 < 9$?
    params:
      options:
        - label: −3 < x < 3
          correct: true
        - label: x < 3
          feedback: −5 ist kleiner als 3, aber (−5)² = 25.
        - label: x < −3 oder x > 3
          feedback: Das ist die Lösung von x² > 9.
    hints:
      - Probier x = −5 aus.
    explanation: Quadrieren macht negative Zahlen positiv. Die Lösung ist ein Intervall um die Null.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: Für welche Zahlen gilt $x^2 > x$?
    params:
      options:
        - label: Für alle x
          feedback: "Probiere x = 0,5: 0,25 ist kleiner."
        - label: Für x > 0
          feedback: Zwischen 0 und 1 wird das Quadrat kleiner.
        - label: Für x < 0 oder x > 1
          correct: true
        - label: Für keine
          feedback: "Probiere x = 2: 4 > 2."
    hints:
      - Probiere x = −1, 0,5 und 2.
      - Bei 0 und 1 gilt Gleichheit.
    explanation: "$x^2 - x = x(x - 1) > 0$, wenn beide Faktoren dasselbe Vorzeichen haben: x < 0 oder x > 1."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Reelle Zahlen sind **angeordnet**: Für zwei Zahlen gilt immer genau eins von a < b, a = b oder a > b. Bei den komplexen Zahlen klappt das nicht mehr – dort gibt es kein »größer«."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum $x > 3$ unendlich viele Lösungen hat.
    params:
      keywords:
        - - jede
          - alle
          - every
          - any
          - all
        - - größer
          - greater
          - larger
          - bigger
          - rechts
          - right
        - - unendlich
          - kein ende
          - infinite
          - no end
          - endlos
          - endless
      sample: "Jede Zahl, die größer als 3 ist, erfüllt die Ungleichung: 3,1, 4, 100 und so weiter. Es gibt kein Ende nach oben, also unendlich viele Lösungen."
    explanation: "Kernidee: Eine Ungleichung beschreibt einen ganzen Bereich, nicht einen Punkt."
    difficulty: 3

srs:
  cards_from: [welche, groesste]
