id: alg.inequalities.solve
type: concept
title: Umformen – mit einer Falle
summary: Bei negativen Faktoren kippt das Zeichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: plus
    widget: numeric
    prompt: Löse x + {{a}} > {{b}}. Ab welcher Zahl gilt es? x > …
    params: { prefix: "x >" }
    answer: { value: "{{b - a}}" }
    feedback:
      - when: "numval(state.input) == b + a"
        misconception: wrong-inverse
        text: Zieh {{a}} auf beiden Seiten ab, statt zu addieren.
    hints:
      - Wie bei einer Gleichung – {{a}} auf beiden Seiten abziehen.
    explanation: "x > {{b}} − {{a}} = {{b - a}}."
    variants:
      params: { a: "int[2,9]", b: "int[5,20]" }
      defaults: { a: 4, b: 11 }

  - kind: explain
    id: s2
    body: |
      Ungleichungen formt man fast wie Gleichungen um.
      **Aber:** Wer mit einer **negativen** Zahl malnimmt oder teilt, muss das Zeichen umdrehen.

  - kind: problem
    id: umdrehen
    widget: choice
    prompt: Aus −2x > 6 folgt …
    params:
      options:
        - { label: x < −3, correct: true }
        - { label: x > −3, feedback: "Geteilt durch −2 – das Zeichen muss sich umdrehen." }
        - { label: x > 3, feedback: "Auch das Vorzeichen der 3 ändert sich." }
    hints:
      - Teile durch −2 und denk an die Regel.
    explanation: Geteilt durch −2 kippt > zu <. Also x < −3.

  - kind: explain
    id: s4
    body: Warum dreht sich das Zeichen um?
    reveal:
      body: 3 < 5 stimmt. Mal −1 ergibt −3 und −5. Jetzt ist −3 die größere Zahl – die Reihenfolge kehrt sich um.

  - kind: problem
    id: negativ
    widget: numeric
    prompt: Löse −{{a}}x ≥ {{c}}. Dann gilt x ≤ …
    params: { prefix: "x ≤" }
    answer: { value: "{{-k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: lost-sign
        text: Teile durch −{{a}}. Das Ergebnis wird negativ.
    hints:
      - "Teile beide Seiten durch −{{a}} und dreh das Zeichen um."
    explanation: "x ≤ {{c}} : (−{{a}}) = {{-k}}."
    variants:
      params: { a: "int[2,5]", k: "int[1,6]" }
      derive: { c: "a * k" }
      defaults: { a: 3, k: 4 }

  - kind: problem
    id: nicht-drehen
    widget: choice
    prompt: Welche Umformung dreht das Zeichen NICHT um?
    params:
      options:
        - { label: Auf beiden Seiten 5 abziehen, correct: true }
        - { label: Mal −1 nehmen, feedback: "Negativ malnehmen dreht immer um." }
        - { label: Durch −4 teilen, feedback: "Durch eine negative Zahl teilen dreht um." }
    hints:
      - Nur Malnehmen und Teilen mit negativen Zahlen sind gefährlich.
    explanation: Addieren und Subtrahieren ändern die Reihenfolge nie.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Auf beiden Seiten 7 addieren
          right: false
        - text: Beide Seiten mit −2 malnehmen
          right: true
        - text: Beide Seiten durch 5 teilen
          right: false
        - text: Beide Seiten durch −1 teilen
          right: true
        - text: Auf beiden Seiten −3 addieren
          right: false
          why: Addieren verschiebt nur – auch mit negativen Zahlen.
      left: Zeichen bleibt
      right: Zeichen dreht

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Löse $7 - 3x \le 19$. Dann gilt x ≥ …
    answer:
      value: -4
    hints:
      - −3x ≤ 12. Jetzt durch −3 teilen – und das Zeichen umdrehen.
    explanation: "x ≥ −4. Probe mit x = 0: 7 ≤ 19 stimmt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Darf man $\frac{1}{x} < 2$ einfach mit x malnehmen?
    params:
      options:
        - label: Nein – man weiß nicht, ob x positiv oder negativ ist
          correct: true
        - label: Ja, wie bei Gleichungen
          feedback: Bei negativem x müsste das Zeichen kippen.
        - label: Ja, wenn man das Zeichen immer umdreht
          feedback: Bei positivem x bleibt es stehen.
    hints:
      - Was passiert mit dem Zeichen, wenn x negativ ist?
    explanation: "Man braucht eine **Fallunterscheidung**: x > 0 und x < 0 getrennt behandeln."
    difficulty: 3

srs:
  cards_from: [umdrehen, negativ]
