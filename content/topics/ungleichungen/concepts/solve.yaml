id: alg.inequalities.solve
type: concept
title: Umformen – mit einer Falle
summary: Bei negativen Faktoren kippt das Zeichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: plus
    widget: numeric
    prompt: Löse x + {{a}} > {{b}}. Ab welcher Zahl gilt es? x > …
    params: { prefix: "x >" }
    answer: { value: "{{b - a}}" }
    feedback:
      - when: "numval(state.input) == b + a"
        misconception: wrong-inverse
        text: Zieh {{a}} auf beiden Seiten ab, statt zu addieren.
    hints:
      - Wie bei einer Gleichung – {{a}} auf beiden Seiten abziehen.
    explanation: "x > {{b}} − {{a}} = {{b - a}}."
    variants:
      params: { a: "int[2,9]", b: "int[5,20]" }
      defaults: { a: 4, b: 11 }

  - kind: explain
    id: s2
    body: |
      Ungleichungen formt man fast wie Gleichungen um.
      **Aber:** Wer mit einer **negativen** Zahl malnimmt oder teilt, muss das Zeichen umdrehen.

  - kind: problem
    id: umdrehen
    widget: choice
    prompt: Aus −2x > 6 folgt …
    params:
      options:
        - { label: x < −3, correct: true }
        - { label: x > −3, feedback: "Geteilt durch −2 – das Zeichen muss sich umdrehen." }
        - { label: x > 3, feedback: "Auch das Vorzeichen der 3 ändert sich." }
    hints:
      - Teile durch −2 und denk an die Regel.
    explanation: Geteilt durch −2 kippt > zu <. Also x < −3.

  - kind: explain
    id: s4
    body: Warum dreht sich das Zeichen um?
    reveal:
      body: 3 < 5 stimmt. Mal −1 ergibt −3 und −5. Jetzt ist −3 die größere Zahl – die Reihenfolge kehrt sich um.

  - kind: problem
    id: negativ
    widget: numeric
    prompt: Löse −{{a}}x ≥ {{c}}. Dann gilt x ≤ …
    params: { prefix: "x ≤" }
    answer: { value: "{{-k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: lost-sign
        text: Teile durch −{{a}}. Das Ergebnis wird negativ.
    hints:
      - "Teile beide Seiten durch −{{a}} und dreh das Zeichen um."
    explanation: "x ≤ {{c}} : (−{{a}}) = {{-k}}."
    variants:
      params: { a: "int[2,5]", k: "int[1,6]" }
      derive: { c: "a * k" }
      defaults: { a: 3, k: 4 }

  - kind: problem
    id: nicht-drehen
    widget: choice
    prompt: Welche Umformung dreht das Zeichen NICHT um?
    params:
      options:
        - { label: Auf beiden Seiten 5 abziehen, correct: true }
        - { label: Mal −1 nehmen, feedback: "Negativ malnehmen dreht immer um." }
        - { label: Durch −4 teilen, feedback: "Durch eine negative Zahl teilen dreht um." }
    hints:
      - Nur Malnehmen und Teilen mit negativen Zahlen sind gefährlich.
    explanation: Addieren und Subtrahieren ändern die Reihenfolge nie.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Auf beiden Seiten 7 addieren
          right: false
        - text: Beide Seiten mit −2 malnehmen
          right: true
        - text: Beide Seiten durch 5 teilen
          right: false
        - text: Beide Seiten durch −1 teilen
          right: true
        - text: Auf beiden Seiten −3 addieren
          right: false
          why: Addieren verschiebt nur – auch mit negativen Zahlen.
      left: Zeichen bleibt
      right: Zeichen dreht

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Löse $7 - 3x \le 19$. Dann gilt x ≥ …
    answer:
      value: -4
    hints:
      - −3x ≤ 12. Jetzt durch −3 teilen – und das Zeichen umdrehen.
    explanation: "x ≥ −4. Probe mit x = 0: 7 ≤ 19 stimmt."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numberline
    prompt: Löse $-3x \ge 6$. Setze die Markierung auf die größte erlaubte Zahl.
    params:
      min: -5
      max: 5
      ticks: 1
      labels: integers
    answer:
      value: -2
    feedback:
      - when: state.value == 2
        misconception: sign
        text: Durch −3 teilen dreht das Zeichen um – und das Vorzeichen der Zahl.
    hints:
      - Teile durch −3 – das Zeichen kippt.
      - $x \le -2$.
    explanation: "$x \\le -2$. Probe: −3 · (−2) = 6 ≥ 6 passt, −3 · (−1) = 3 nicht."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Löse ${{c + b * s}} - {{b}}x < {{c}}$. Dann gilt x > …
    answer:
      value: "{{s}}"
    hints:
      - "Zieh {{c + b * s}} ab: $-{{b}}x < {{0 - b * s}}$."
      - Durch −{{b}} teilen – und das Zeichen umdrehen.
    explanation: $-{{b}}x < {{0 - b * s}}$ wird zu $x > {{s}}$.
    difficulty: 2
    variants:
      params:
        s: int[-3,4]
        b: int[2,5]
        c: int[1,9]
      defaults:
        s: 2
        b: 3
        c: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: order
    prompt: Löse $-2x + 3 > 11$. Ordne die Schritte.
    params:
      items:
        - label: $-2x + 3 > 11$
        - label: "Minus 3: $-2x > 8$"
        - label: Durch −2 teilen, Zeichen kippt
        - label: $x < -4$
    hints:
      - Erst die Zahl ohne x wegschaffen.
      - Das Teilen durch eine negative Zahl kommt zuletzt.
    explanation: "Probe mit x = −5: 10 + 3 = 13 > 11 stimmt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Darf man $\frac{1}{x} < 2$ einfach mit x malnehmen?
    params:
      options:
        - label: Nein – man weiß nicht, ob x positiv oder negativ ist
          correct: true
        - label: Ja, wie bei Gleichungen
          feedback: Bei negativem x müsste das Zeichen kippen.
        - label: Ja, wenn man das Zeichen immer umdreht
          feedback: Bei positivem x bleibt es stehen.
    hints:
      - Was passiert mit dem Zeichen, wenn x negativ ist?
    explanation: "Man braucht eine **Fallunterscheidung**: x > 0 und x < 0 getrennt behandeln."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Ein Produkt ist negativ, wenn die **Vorzeichen** seiner Faktoren verschieden sind. So löst man $(x - 2)(x + 3) < 0$: Ein Faktor muss positiv, der andere negativ sein."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Wie viele ganze Zahlen erfüllen $(x - 2)(x + 3) < 0$?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 6
        misconception: boundary
        text: Bei x = −3 und x = 2 ist das Produkt 0 – nicht kleiner als 0.
    hints:
      - Die Nullstellen sind −3 und 2.
      - "Dazwischen ist das Produkt negativ: −3 < x < 2."
    explanation: −2, −1, 0 und 1 – vier Zahlen.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Darf man aus $a > b$ immer $a^2 > b^2$ folgern?
    params:
      options:
        - label: Ja, immer
          feedback: −3 > −5, aber 9 < 25.
        - label: Nur wenn beide Seiten nicht negativ sind
          correct: true
        - label: Nie
          feedback: 5 > 3 und 25 > 9 – das klappt.
    hints:
      - Probiere −3 > −5.
      - Quadrieren macht negative Zahlen positiv.
    explanation: Für Zahlen ab 0 ist Quadrieren monoton. Bei negativen Zahlen kann sich die Reihenfolge umkehren.
    difficulty: 3

srs:
  cards_from: [umdrehen, negativ]
