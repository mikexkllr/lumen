id: alg.inequalities.distance
type: concept
title: Toleranzen
summary: Höchstens so weit vom Ziel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Nah genug dran
    body: Beim Dart zählt nur, wie nah du am Ziel bist – nicht, auf welcher Seite. Die Kurve zeigt für jede Zahl x ihren **Abstand** zum Ziel a. Schieb a hin und her. Warum sieht sie aus wie ein V?
    visual:
      widget: slider
      interactive: true
      params:
        expr: abs(x - a)
        x:
          - -5
          - 5
        y:
          - -1
          - 6
        showCoordinates: false
        sliders:
          - id: a
            label: Ziel a
            min: -4
            max: 4
            step: 1
            initial: 0

  - kind: problem
    id: schraube
    widget: choice
    prompt: Eine Schraube soll 50 mm lang sein, Toleranz ± 0,5 mm. Welche Länge ist noch in Ordnung?
    params:
      options:
        - { label: "49,6 mm", correct: true }
        - { label: "49,4 mm", feedback: "Das sind 0,6 mm zu wenig." }
        - { label: 51 mm, feedback: "Das ist 1 mm zu viel." }
    hints:
      - Erlaubt ist 49,5 bis 50,5 mm.
    explanation: 49,6 mm liegt nur 0,4 mm daneben.

  - kind: explain
    id: s2
    body: |
      »Höchstens 2 von 5 entfernt« schreibt man |x − 5| ≤ 2. Das heißt 3 ≤ x ≤ 7.
      Der Betrag misst den **Abstand**.

  - kind: problem
    id: abstand
    widget: numberline
    prompt: Setze die Markierung auf eine Zahl mit |x − 3| ≤ 1.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "abs(state.value - 3) <= 1" }
    solution: { state: { value: 3 } }
    hints:
      - Höchstens 1 von der 3 entfernt.
    explanation: Alles zwischen 2 und 4 passt.

  - kind: problem
    id: grenzen
    widget: numeric
    prompt: "|x − {{m}}| ≤ {{d}}. Was ist die größte erlaubte Zahl?"
    params: { placeholder: "x" }
    answer: { value: "{{m + d}}" }
    hints:
      - "Gehe von {{m}} aus {{d}} nach rechts."
    explanation: "{{m}} + {{d}} = {{m + d}}."
    variants:
      params: { m: "int[-5,10]", d: "int[1,6]" }
      defaults: { m: 5, d: 2 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "$|x - 5| \\le 2$ heißt: x ist höchstens [[2]] von [[5]] entfernt. Also liegt x zwischen [[3]] und 7."
      distractors:
        - −2
        - "10"

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Die Kurve zeigt $|x - a|$. Stelle das Ziel a so ein, dass genau die Zahlen von 2 bis 4 höchstens 1 entfernt sind.
    params:
      expr: abs(x - a)
      x:
        - -2
        - 6
      y:
        - -1
        - 5
      showCoordinates: false
      sliders:
        - id: a
          label: a
          min: -2
          max: 6
          step: 1
          initial: 0
      markers:
        - x: 2
          y: 1
        - x: 4
          y: 1
    answer:
      values:
        a: 3
    hints:
      - Die Kurve muss bei x = 2 und x = 4 genau die Höhe 1 haben – siehe die Punkte.
      - Das Ziel liegt genau in der Mitte zwischen 2 und 4.
    explanation: "$|x - 3| \\le 1$ heißt $2 \\le x \\le 4$: höchstens 1 von der Mitte 3 entfernt."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Für welche Zahlen gilt $|2x - 6| < 4$? Gib die obere Grenze an.
    answer:
      value: 5
    hints:
      - −4 < 2x − 6 < 4.
    explanation: 2 < 2x < 10, also 1 < x < 5.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numberline
    prompt: Setze die Markierung auf eine Zahl mit $|x + 2| \le 1$.
    params:
      min: -5
      max: 2
      ticks: 2
      labels: integers
    check:
      predicate: abs(state.value + 2) <= 1
    hints:
      - $|x + 2| = |x - (-2)|$ – der Abstand zu −2.
      - "Höchstens 1 von −2 entfernt: von −3 bis −1."
    explanation: "Alle Zahlen von −3 bis −1 passen. Plus 2 im Betrag heißt: Abstand zu −2."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Wie viele ganze Zahlen erfüllen $|x - {{m}}| \le {{d}}$?
    answer:
      value: "{{2 * d + 1}}"
    feedback:
      - when: numval(state.input) == 2 * d
        misconception: forgot-centre
        text: Die Mitte {{m}} selbst zählt auch.
    hints:
      - Von {{m - d}} bis {{m + d}}.
      - "{{d}} links, {{d}} rechts und die Mitte."
    explanation: "{{d}} + {{d}} + 1 = {{2 * d + 1}} Zahlen."
    difficulty: 2
    variants:
      params:
        m: int[-5,9]
        d: int[1,6]
      defaults:
        m: 4
        d: 3

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: Wie schreibt man »x liegt höchstens 0,5 von 10 entfernt«?
    params:
      options:
        - label: $|x - 10| \le 0{,}5$
          correct: true
        - label: $|x - 0{,}5| \le 10$
          feedback: Mitte und Abstand sind vertauscht.
        - label: $|x| \le 10{,}5$
          feedback: Das wäre der Abstand zu 0.
    hints:
      - Der Betrag misst den Abstand zur Mitte.
      - Mitte 10, Abstand höchstens 0,5.
    explanation: $|x - 10| \le 0{,}5$ heißt 9,5 ≤ x ≤ 10,5 – eine Toleranz.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Dreiecksungleichung sagt $|a + b| \le |a| + |b|$. Wann gilt **Gleichheit**?
    params:
      options:
        - label: Wenn a und b dasselbe Vorzeichen haben (oder eines null ist)
          correct: true
        - label: Immer
          feedback: Für a = 3 und b = −3 steht links 0 und rechts 6.
        - label: Nur wenn a = b
          feedback: Auch für 2 und 5 gilt 7 = 7.
    hints:
      - Probier a = 3, b = −3 und a = 2, b = 5.
    explanation: Bei verschiedenen Vorzeichen heben sich Teile auf. Die Ungleichung ist ein Grundwerkzeug der Analysis.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Für welches x gilt $|x - 1| = |x - 5|$?
    answer:
      value: 3
    hints:
      - x ist von 1 und von 5 gleich weit weg.
      - Die Mitte zwischen 1 und 5.
    explanation: x = 3 – jeweils 2 entfernt. In der Ebene wird daraus die Mittelsenkrechte.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Mit Beträgen definiert man **Grenzwerte**. Eine Folge nähert sich a, wenn der Abstand $|a_n - a|$ irgendwann kleiner als jede Toleranz ε wird. Das ist die Sprache der Analysis.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Ab welchem n ist $\frac{1}{n}$ weniger als 0,01 von 0 entfernt? Gib das kleinste n an.
    answer:
      value: 101
    feedback:
      - when: numval(state.input) == 100
        misconception: boundary
        text: Bei n = 100 ist der Abstand genau 0,01 – nicht kleiner.
    hints:
      - $\frac{1}{n} < 0{,}01$ heißt $n > 100$.
      - Die erste ganze Zahl über 100.
    explanation: n = 101. Für jede Toleranz findet man so ein n – darum ist der Grenzwert von 1/n gleich 0.
    difficulty: 3

srs:
  cards_from: [abstand, grenzen]
