id: alg.inequalities.intervals
type: concept
title: From … To
summary: Double inequalities.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: From here to there
    body: Many everyday rules only apply within a range – not too cold, not too old. Turn over the cards. Where is the lower limit each time, and where the upper one? Such ranges are called **intervals**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧊
            front: Fridge
            back: Between 2 and 7 °C food stays fresh. Colder freezes it, warmer spoils it.
          - icon: 🎢
            front: Roller coaster
            back: Often you may only ride if you are at least 1.20 m tall – and at most 1.95 m.
          - icon: 🌡️
            front: Body temperature
            back: About 36.5 to 37.5 °C is normal. From 38 °C on, it counts as a fever.
          - icon: 🎫
            front: Youth ticket
            back: It is often valid from 14 to under 26. It ends on your 26th birthday.

  - kind: problem
    id: bereich
    widget: numberline
    prompt: Place the marker on a number with 2 < x < 4.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    check: { predicate: "state.value > 2 && state.value < 4" }
    solution: { state: { value: 3 } }
    hints:
      - Between 2 and 4, but not exactly 2 or 4.
    explanation: Everything between 2 and 4 works, such as 2.5, 3, and 3.5.

  - kind: explain
    id: s2
    body: |
      **2 < x < 4** means: x is greater than 2 **and** less than 4.
      Such ranges are called **intervals**. A thermostat, for example, keeps the temperature between 19 and 22 degrees.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Is the number in 18 ≤ x < 65?
    params:
      buckets: [{ label: yes }, { label: no }]
      items:
        - { label: "18", bucket: yes }
        - { label: "40", bucket: yes }
        - { label: "64.9", bucket: yes }
        - { label: "65", bucket: no }
        - { label: "17", bucket: no }
    hints:
      - The ≤ includes 18, and the < excludes 65.
    explanation: 18 belongs, 65 does not.

  - kind: problem
    id: ganze
    widget: numeric
    prompt: How many integers x satisfy {{a}} < x < {{b}}?
    params: { unit: numbers }
    answer: { value: "{{b - a - 1}}" }
    feedback:
      - when: "numval(state.input) == b - a + 1"
        misconception: inclusive
        text: The endpoints are not included.
    hints:
      - "Count from {{a + 1}} to {{b - 1}}."
    explanation: "{{a + 1}} to {{b - 1}} makes {{b - a - 1}} numbers."
    variants:
      params: { a: "int[-5,3]", b: "int[6,12]" }
      defaults: { a: 2, b: 9 }

  - kind: problem
    id: c1
    widget: match
    prompt: Which notation fits?
    params:
      pairs:
        - left: $2 < x < 5$
          right: (2, 5)
        - left: $2 \le x \le 5$
          right: "[2, 5]"
        - left: $2 \le x < 5$
          right: "[2, 5)"
        - left: $x \ge 5$
          right: "[5, ∞)"
    hints:
      - "A square bracket means: the endpoint belongs."
    explanation: Interval notation is shorthand for double inequalities.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many integers satisfy $-3 \le 2x + 1 < 9$?
    answer:
      value: 6
    hints:
      - "Subtract 1 everywhere and divide by 2: −2 ≤ x < 4."
    explanation: −2, −1, 0, 1, 2, 3 – six numbers.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Intervals are written briefly with brackets. [2, 5] means 2 ≤ x ≤ 5. A **round bracket**, as in (2, 5], leaves the 2 out.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numberline
    prompt: Put the marker on a negative number in the interval $-1 \le x < 2$.
    params:
      min: -3
      max: 3
      ticks: 2
      labels: integers
    check:
      predicate: state.value >= -1 && state.value < 0
    hints:
      - −1 is included.
      - Negative means left of 0.
    explanation: −1 or −0.5 work. 0 is not negative.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: How many integers lie in $-3 \le x \le 4$?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 7
        misconception: off-by-one
        text: Both ends are included – and 0 too.
    hints:
      - Count from −3 to 4.
      - 4 − (−3) + 1.
    explanation: −3, −2, −1, 0, 1, 2, 3, 4 – eight numbers.
    difficulty: 2

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: Which numbers lie in both ranges $1 \le x \le 4$ and $3 \le x \le 7$?
    params:
      options:
        - label: $3 \le x \le 4$
          correct: true
        - label: That is the union – numbers in at least one range.
          feedback: Das ist die Vereinigung – Zahlen in mindestens einem Bereich.
        - label: That range does not exist.
          feedback: Diesen Bereich gibt es nicht.
    hints:
      - Where do the two stretches overlap?
      - From 3 and up to 4.
    explanation: "The intersection is the overlap: from 3 to 4."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: How many even numbers satisfy $x > 1$ and $x \le 12$?
    answer:
      value: 6
    hints:
      - Start at 2.
      - 2, 4, 6, … up to 12.
    explanation: 2, 4, 6, 8, 10, 12 – six numbers.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: Georg Cantor showed that the interval between 0 and 1 contains as many numbers as the whole number line. Both are **uncountable** – there are more of them than natural numbers.

srs:
  cards_from: [einordnen, ganze]
