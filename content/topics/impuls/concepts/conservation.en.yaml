id: sci.momentum.conservation
type: concept
title: "Conservation of momentum"
summary: "What one body gains in momentum, the other loses – with direction and sign."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: What one side loses
    body: "In every collision, motion passes from one body to another. Flip the cards: where is **momentum** kept – from the pool table to outer space?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎱
            front: Pool
            back: The white ball slows down, the one it hits rolls off. Together the momentum stays the same.
          - icon: 🚗
            front: Rear-end crash
            back: The car behind slows down, the one in front speeds up.
          - icon: ☄️
            front: Asteroid hit
            back: In 2022 the DART probe rammed a small asteroid and changed its orbit measurably.

  - kind: problem
    id: hook
    widget: choice
    prompt: You stand on inline skates and throw a heavy medicine ball hard forwards. What happens to you?
    params:
      options:
        - label: You roll backwards.
          correct: true
        - label: Nothing, you are standing firm.
          feedback: On wheels nothing holds you. The ball pushes back on you as you throw.
        - label: You roll after the ball.
          feedback: You push the ball forwards – it pushes you backwards.
    hints:
      - Before, nothing moves. Total momentum zero.
      - After the throw the sum must still be zero.
    explanation: The ball gets momentum forwards, you get just as much backwards. Together it stays zero.

  - kind: explain
    id: c1
    body: Momentum p = m · v has a direction. To the right it counts plus, to the left minus. Without outside forces the sum of all momenta stays the same – that is **conservation of momentum**.

  - kind: problem
    id: c2
    widget: numeric
    prompt: Two carts stand still with a compressed spring between them. It is released. Cart A (2 kg) rolls left at {{v}} m/s. How fast does cart B (4 kg) roll to the right?
    params:
      unit: m/s
    answer:
      value: "{{v / 2}}"
    feedback:
      - when: numval(state.input) == v
        misconception: same-speed
        text: The same speed would give B double the momentum. The momenta must be equal in size.
    hints:
      - "Momentum of A: 2 · {{v}} kg·m/s."
      - B needs the same momentum with 4 kg.
    explanation: 2 · {{v}} = 4 · v_B, so v_B = {{v / 2}} m/s. The heavier cart is slower.
    variants:
      params:
        v: choice[2,3,4,6]
      defaults:
        v: 4

  - kind: problem
    id: c3
    widget: numeric
    prompt: Two ice skaters (60 kg and 40 kg) stand and push off each other. The lighter one glides away at 3 m/s. How fast does the heavier one glide?
    params:
      unit: m/s
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 4.5
        misconception: inverse
        text: "The other way round: the heavier one is **slower**."
    hints:
      - "Momentum of the light one: 40 · 3 = 120 kg·m/s."
      - 120 ÷ 60 = ?
    explanation: 120 ÷ 60 = 2 m/s, in the opposite direction. Both feel the same force for the same time – only their masses differ.

  - kind: problem
    id: c4
    widget: choice
    prompt: A ball (1 kg) hits a wall at 5 m/s and bounces back at 5 m/s. How large is the change in its momentum?
    params:
      options:
        - label: 10 kg·m/s
          correct: true
        - label: 0 – the speed is the same.
          feedback: "The direction has reversed: from +5 to −5."
        - label: 5 kg·m/s
          feedback: That is just what stopping takes. Flying back costs the same again.
    hints:
      - Before +5, after −5 kg·m/s.
      - "Difference: −5 − (+5)."
    explanation: Δp = −5 − 5 = −10 kg·m/s. Bouncing hurts more than stopping – the wall has to transfer twice the momentum.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A rifle (4 kg) fires a bullet (10 g) at 800 m/s. At what speed does it recoil?
    params:
      unit: m/s
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 2000
        misconception: grams
        text: "Work in kilograms: 10 g = 0.01 kg."
    hints:
      - "Momentum of the bullet: 0.01 kg · 800 m/s."
      - 8 kg·m/s ÷ 4 kg = ?
    explanation: "8 ÷ 4 = 2 m/s. That is why you press a rifle firmly to your shoulder: then your whole body has to recoil."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A lorry (10 t, 20 m/s) and a car (1 t, 20 m/s the other way) collide head-on and lock together. How fast does the wreck move afterwards – in m/s? To one decimal place.
    params:
      unit: m/s
    answer:
      value: 16.4
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 0
        misconception: equal-momenta
        text: "The momenta are not equal: the lorry has ten times as much."
    hints:
      - "Total momentum: 10,000 · 20 − 1000 · 20."
      - Divide by the total mass of 11,000 kg.
    explanation: 180,000 ÷ 11,000 ≈ 16.4 m/s in the lorry's direction. The car's speed changes by 36 m/s, the lorry's by only 3.6 m/s.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: In this crash, which feels the larger force – lorry or car?
    params:
      options:
        - label: Both exactly the same – but the car is slowed far more.
          correct: true
        - label: The car.
          feedback: By Newton's third law the forces are equal. What differs is the effect on the mass.
        - label: The lorry, because it is heavier.
          feedback: Heavier does not mean more force. The forces are equal.
    hints:
      - Action equals reaction.
      - Equal force, but ten times smaller mass means …?
    explanation: Equal force, equal time, equal momentum transfer. For the light car that means ten times the change in speed – and the dangerous acceleration for its occupants.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Why is momentum conserved? During the collision A feels the force F and B the **reaction force** −F, for the same time. The momenta change by F · Δt and −F · Δt. So the sum stays the same.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A billiard ball hits an identical ball at rest. Afterwards one rolls north at 3 m/s, the other east at 4 m/s. How fast was the striking ball before?
    params:
      unit: m/s
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 7
        misconception: scalar-sum
        text: Momenta are arrows. Arrows at right angles add by Pythagoras.
    hints:
      - The two momentum arrows are perpendicular.
      - √(3² + 4²) = ?
    explanation: "√(9 + 16) = 5 m/s. And 9 + 16 = 25: the kinetic energy matches too – an elastic collision."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: With equal masses, after a glancing elastic collision both balls always fly apart at right angles. Why?
    params:
      options:
        - label: Momentum and energy are both conserved – that only works if the arrows form a right triangle.
          correct: true
        - label: Because billiard tables are rectangular.
          feedback: The table plays no part. It follows from the conservation laws.
        - label: That is pure chance.
          feedback: It happens in every such collision. Pythagoras is behind it.
    hints:
      - "Momentum: v = v₁ + v₂ as arrows. Energy: v² = v₁² + v₂²."
      - When does Pythagoras hold for three arrows in a triangle?
    explanation: The arrow sum demands a triangle, energy demands Pythagoras. Together they force the right angle. Billiard players use this all the time.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why you roll backwards when you throw a ball forwards on inline skates.
    params:
      keywords:
        - - impuls
          - momentum
        - - "null"
          - zero
          - summe
          - sum
          - gleich
          - same
          - erhalt
          - conserv
        - - gegen
          - opposite
          - rückwärts
          - backward
          - zurück
          - back
      sample: Before, the total momentum is zero. The ball gets momentum forwards. For the sum to stay zero, I get the same amount backwards – I roll back, but slower because I am heavier.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
