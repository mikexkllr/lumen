id: sci.momentum.collisions
type: concept
title: "Elastisch oder unelastisch"
summary: "Impuls bleibt immer erhalten – Bewegungsenergie nur manchmal."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Abprallen oder kleben?
    body: "Manche Stöße federn zurück, andere enden in einem Knautsch. Deck die Karten auf: Wo bleibt die **Bewegungsenergie** erhalten, und wo wird sie zu Wärme?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚃
            front: Puffer am Waggon
            back: Federn in den Puffern fangen den Stoß auf und schieben die Waggons wieder auseinander.
          - icon: 💥
            front: Meteorit
            back: Beim Einschlag wird seine Bewegungsenergie zu Hitze und einem Krater.
          - icon: 🪖
            front: Fahrradhelm
            back: Sein Schaum wird beim Sturz zerdrückt und schluckt so die Energie.
          - icon: 🎾
            front: Tennisball
            back: Er springt zurück, aber nicht ganz so hoch. Ein Teil der Energie wird Wärme.

  - kind: problem
    id: hook
    widget: choice
    prompt: Beim Kugelstoßpendel hängen fünf Stahlkugeln in einer Reihe. Du lässt links eine Kugel auftreffen. Was passiert?
    params:
      options:
        - label: Rechts fliegt genau eine Kugel weg.
          correct: true
        - label: Alle vier anderen bewegen sich langsam mit.
          feedback: Das erhielte den Impuls, aber nicht die Energie.
        - label: Rechts fliegen zwei Kugeln mit halbem Tempo weg.
          feedback: Auch das passt zum Impuls, aber nicht zur Energie.
    hints:
      - Impuls und Bewegungsenergie sollen beide erhalten bleiben.
      - Zwei Kugeln mit halbem Tempo hätten nur halb so viel Energie.
    explanation: Nur eine Kugel mit vollem Tempo erhält Impuls **und** Energie. Darum funktioniert das Spielzeug so verblüffend.

  - kind: explain
    id: c1
    body: Bei einem **elastischen Stoß** bleibt die Bewegungsenergie erhalten, die Körper prallen ab. Beim unelastischen Stoß wird ein Teil zu Wärme und Verformung. Der Impuls bleibt in beiden Fällen erhalten.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Eher elastisch oder unelastisch?
    params:
      buckets:
        - id: b1
          label: eher elastisch
        - id: b2
          label: unelastisch
      items:
        - label: Billardkugeln
          bucket: b1
        - label: Flummi auf Stein
          bucket: b1
        - label: Gasteilchen untereinander
          bucket: b1
        - label: Autounfall
          bucket: b2
        - label: Knete fällt zu Boden
          bucket: b2
        - label: Pfeil in der Zielscheibe
          bucket: b2
    hints:
      - Springt es mit fast gleichem Tempo zurück?
      - Bleibt etwas zusammen oder wird verformt, ist es unelastisch.
    explanation: Harte, federnde Körper stoßen fast elastisch. Was zusammenklebt oder sich verbeult, ist unelastisch – die fehlende Energie steckt in Wärme und Verformung.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Wagen (3 kg, 4 m/s) fährt auf einen ruhenden Wagen (1 kg). Sie kuppeln zusammen. Wie schnell fahren sie weiter?
    params:
      unit: m/s
    answer:
      value: 3
    hints:
      - "Impuls vorher: 3 · 4 = 12 kg·m/s."
      - Danach bewegen sich 4 kg gemeinsam.
    explanation: "12 : 4 = 3 m/s. Der Impuls verteilt sich auf mehr Masse."

  - kind: problem
    id: c4
    widget: numeric
    prompt: Wie viele Joule Bewegungsenergie gingen bei diesem Ankuppeln verloren? Vorher 3 kg mit 4 m/s, nachher 4 kg mit 3 m/s.
    params:
      unit: J
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 0
        misconception: energy-conserved
        text: Der Impuls bleibt gleich, die Energie nicht. Rechne beide Energien aus.
    hints:
      - "Vorher: ½ · 3 · 4² = 24 J."
      - "Nachher: ½ · 4 · 3² = 18 J."
    explanation: 24 J − 18 J = 6 J wurden zu Wärme und Geräusch in der Kupplung.

  - kind: explain
    id: d1
    depth: 2
    body: Stoßen zwei gleich schwere Kugeln zentral und elastisch, **tauschen** sie ihre Geschwindigkeiten. Die stoßende Kugel bleibt stehen, die getroffene rollt mit dem vollen Tempo weiter.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Ein Ball (1 kg, 6 m/s) stößt elastisch und zentral auf einen ruhenden Ball (2 kg). Dieser fliegt mit v = 2 · m₁ : (m₁ + m₂) · 6 m/s davon. Wie schnell?"
    params:
      unit: m/s
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: inelastic
        text: Das wäre der unelastische Stoß, bei dem beide zusammen weiterrollen.
    hints:
      - "2 · 1 : 3 = 2/3."
      - 2/3 · 6 = ?
    explanation: "4 m/s. Der leichte Ball prallt mit 2 m/s zurück. Prüfe: Impuls 6 = 8 − 2 und Energie 18 J = 16 J + 2 J."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Eine Bowlingkugel trifft elastisch einen ruhenden Tischtennisball. Wie schnell fliegt der Ball etwa davon?
    params:
      options:
        - label: Fast doppelt so schnell wie die Kugel.
          correct: true
        - label: Genauso schnell wie die Kugel.
          feedback: Das gilt nur für gleich schwere Partner.
        - label: Etwas langsamer als die Kugel.
          feedback: Aus Sicht der Kugel prallt der Ball mit vollem Tempo zurück – dazu kommt ihr eigenes.
    hints:
      - "Setze in die Formel m₁ ≫ m₂ ein: 2 · m₁ : (m₁ + m₂) ≈ ?"
      - Denk an einen Ball, der von einer heranfahrenden Wand abprallt.
    explanation: "Der Faktor 2 · m₁ : (m₁ + m₂) geht gegen 2. Die schwere Kugel wirkt wie eine bewegte Wand. Raumsonden holen sich so Schwung an Planeten."
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Im **Schwerpunktsystem** ruht der gemeinsame Schwerpunkt, der Gesamtimpuls ist null. Bei einem elastischen Stoß kehren beide Körper dort einfach ihre Geschwindigkeit um. Viele Stoßaufgaben werden so viel leichter.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: "Ballistisches Pendel: Eine Kugel (10 g) bleibt in einem hängenden Holzklotz (2 kg) stecken. Der Klotz schwingt 5 cm hoch. Wie schnell war die Kugel? g = 10 m/s²."
    params:
      unit: m/s
    answer:
      value: 201
      tolerance: 2
    feedback:
      - when: abs(numval(state.input) - 1) < 0.05
        misconception: block-speed
        text: Das ist das Tempo des Klotzes nach dem Stoß. Zurück zur Kugel geht es mit dem Impuls.
    hints:
      - "Energie nach dem Stoß: v = √(2 · g · h) = 1 m/s."
      - "Impuls im Stoß: 0,01 · v_K = 2,01 · 1."
    explanation: "v = 2,01 : 0,01 · 1 m/s ≈ 201 m/s. Im Stoß gilt nur der Impuls, danach nur die Energie – man muss beide Schritte trennen."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Du lässt einen Basketball mit einem Tennisball obendrauf fallen. Der Tennisball springt viel höher als seine Starthöhe. Warum?
    params:
      options:
        - label: Der zurückprallende Basketball trifft den noch fallenden Tennisball – der fliegt mit bis zu dreifachem Tempo nach oben.
          correct: true
        - label: Der Tennisball ist besonders elastisch.
          feedback: Allein springt er nicht höher als seine Starthöhe.
        - label: Die Luft zwischen den Bällen drückt ihn hoch.
          feedback: Die Luft spielt kaum eine Rolle. Es ist ein Stoß mit einer bewegten Wand.
    hints:
      - Der Basketball kommt mit v nach oben, der Tennisball mit v nach unten.
      - Relativ zum Basketball hat der Tennisball 2v – und prallt mit 2v zurück.
    explanation: Relativ 2v zurück plus v des Basketballs ergibt 3v nach oben – also bis zur neunfachen Höhe. In Wirklichkeit etwas weniger, weil die Stöße nicht ganz elastisch sind.
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
