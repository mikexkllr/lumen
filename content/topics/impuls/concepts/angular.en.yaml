id: sci.momentum.angular
type: concept
title: "Angular momentum and the pirouette"
summary: "What is conserved in rotation – from the figure skater to the pulsar."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: What keeps spin steady
    body: "A spinning top does not fall over while it turns. Behind this is **angular momentum**. Flip the cards: where does spin keep things on course?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏈
            front: Football with spin
            back: A throw with spin flies as steadily as an arrow, without wobbling.
          - icon: 🔭
            front: Space telescope
            back: Hubble turns in any direction using fast flywheels – without any thrusters.
          - icon: 🌍
            front: Earth's axis
            back: For centuries it has pointed almost exactly at the Pole Star.

  - kind: problem
    id: hook
    widget: choice
    prompt: A figure skater spins with her arms stretched out. Now she pulls her arms in tight. What happens?
    params:
      options:
        - label: She spins much faster.
          correct: true
        - label: She slows down.
          feedback: Just the opposite. Spreading out brakes, pulling in speeds up.
        - label: Nothing changes.
          feedback: The arms are closer to the axis. That clearly changes the spin.
    hints:
      - No torque from outside – something is conserved.
      - The moment of inertia gets smaller.
    explanation: With a smaller moment of inertia she has to spin faster. You can try it yourself on an office chair.

  - kind: explain
    id: c1
    body: "**Angular momentum** is $L = J \\cdot \\omega$. Without torque from outside it stays the same. If the moment of inertia gets smaller, the angular velocity has to grow."

  - kind: problem
    id: c2
    widget: numeric
    prompt: A gymnast spins at 2 turns per second with a moment of inertia of {{j}} kg·m². He tucks in to 1 kg·m². How many turns per second does he make now?
    answer:
      value: "{{2 * j}}"
    feedback:
      - when: abs(numval(state.input) - 2 / j) < 0.01
        misconception: inverse
        text: A smaller moment of inertia means **faster**, not slower.
    hints:
      - "L = J · ω stays the same: {{j}} · 2 = 1 · ω."
      - ω = {{2 * j}}.
    explanation: "{{j}} · 2 = 1 · ω gives {{2 * j}} turns per second. That is how divers manage several somersaults in a second."
    variants:
      params:
        j: choice[3,4,6]
      defaults:
        j: 4

  - kind: problem
    id: c3
    widget: choice
    prompt: Why does an ordinary helicopter have a small tail rotor?
    params:
      options:
        - label: Without it the body would spin the opposite way to the main rotor.
          correct: true
        - label: It provides forward thrust.
          feedback: Forwards you tilt the main rotor. The tail rotor pushes sideways.
        - label: It cools the engine.
          feedback: It is a propeller with an important job for rotation.
    hints:
      - The engine turns the rotor – and pushes back on the body to do so.
      - Total angular momentum zero must stay zero.
    explanation: The engine gives the rotor angular momentum, the body gets the opposite. The tail rotor produces a counter-torque. Helicopters with two counter-rotating rotors need none.

  - kind: explain
    id: d1
    depth: 2
    body: "A planet on its orbit has angular momentum $L = m \\cdot v \\cdot r$. Since no force pulls sideways, L stays the same: near the Sun it is faster, far away slower. That is Kepler's second law, the **law of equal areas**."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A comet is 10 times closer to the Sun at its nearest point than at its farthest. How many times faster is it there?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 100
        misconception: squared
        text: "In angular momentum r counts once, not squared: m · v · r stays the same."
    hints:
      - m · v · r is the same at both points.
      - Ten times smaller r means …?
    explanation: Ten times faster. That is why comets race round the Sun in a few weeks and then crawl through the cold for decades.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A top stands tilted and still does not fall over. Instead its axis slowly circles round. Why?
    params:
      options:
        - label: The torque of gravity changes the direction of the angular momentum, not its size.
          correct: true
        - label: The top is too fast to fall.
          feedback: It feels gravity fully too. It just acts differently.
        - label: The air holds it up.
          feedback: It works just the same in a vacuum.
    hints:
      - The torque is perpendicular to the angular momentum.
      - A force across the motion only steers – as in circular motion.
    explanation: "ΔL points horizontally, across L. So the arrow L turns in a circle: precession. Earth's axis precesses for the same reason, once in 26,000 years."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A star of radius 700,000 km turns once in 30 days. Its core collapses into a 10 km neutron star. J scales with r². How long is one turn now, in ms? Two decimals.
    params:
      unit: ms
    answer:
      value: 0.53
      tolerance: 0.03
    hints:
      - The period shrinks by (10 ÷ 700,000)² ≈ 2 · 10⁻¹⁰.
      - 30 days = 2.6 · 10⁶ s. Times 2 · 10⁻¹⁰.
    explanation: "About 0.5 ms – almost 2000 turns per second. Real pulsars spin up to a little over 700 times per second, because stars lose angular momentum. The idea stands: a cosmic pirouette."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: A cat falls upside down and still lands on its feet. Does it break conservation of angular momentum?
    params:
      options:
        - label: No – it twists its front and back halves against each other; overall L stays 0.
          correct: true
        - label: Yes, cats are the exception.
          feedback: The same laws hold for cats. Their trick is cleverer.
        - label: It pushes off the air.
          feedback: It would work in a vacuum too. It is pure body mechanics.
    hints:
      - A body made of two parts can change shape.
      - First tuck the legs and turn the front, then the other way round.
    explanation: It turns the half with the small moment of inertia a lot and the other a little back – alternately. In the end it has rotated without ever having angular momentum. Astronauts use the same trick.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why a pirouette speeds up when you pull your arms in.
    params:
      keywords:
        - - drehimpuls
          - angular momentum
          - erhalt
          - conserv
        - - trägheitsmoment
          - moment of inertia
          - innen
          - inward
          - näher
          - closer
          - achse
          - axis
        - - schneller
          - faster
          - winkelgeschwindigkeit
          - angular velocity
      sample: "Without outside torque angular momentum stays the same: moment of inertia times angular velocity. When I pull my arms in, the mass is closer to the axis. The moment of inertia gets smaller, so I spin faster."
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x1"]
