id: sci.momentum.collisions
type: concept
title: "Elastic or inelastic"
summary: "Momentum is always conserved – kinetic energy only sometimes."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In Newton's cradle five steel balls hang in a row. You let one ball strike from the left. What happens?
    params:
      options:
        - label: Exactly one ball flies off on the right.
          correct: true
        - label: All four others move slowly along.
          feedback: That would conserve momentum but not energy.
        - label: Two balls fly off on the right at half speed.
          feedback: That also fits momentum, but not energy.
    hints:
      - Momentum and kinetic energy should both be conserved.
      - Two balls at half speed would have only half the energy.
    explanation: Only one ball at full speed conserves momentum and energy. That is why the toy works so strikingly.

  - kind: explain
    id: c1
    body: In an **elastic collision** kinetic energy is conserved and the bodies bounce off. In an inelastic collision part of it turns into heat and deformation. Momentum is conserved in both cases.

  - kind: problem
    id: c2
    widget: buckets
    prompt: More elastic or inelastic?
    params:
      buckets:
        - id: b1
          label: mostly elastic
        - id: b2
          label: inelastic
      items:
        - label: Billiard balls
          bucket: b1
        - label: Bouncy ball on stone
          bucket: b1
        - label: Gas molecules colliding
          bucket: b1
        - label: Car crash
          bucket: b2
        - label: Modelling clay hits the floor
          bucket: b2
        - label: Arrow in the target
          bucket: b2
    hints:
      - Does it bounce back at almost the same speed?
      - If things stick or deform, it is inelastic.
    explanation: Hard, springy bodies collide almost elastically. Whatever sticks together or dents is inelastic – the missing energy is in heat and deformation.

  - kind: problem
    id: c3
    widget: numeric
    prompt: A cart (3 kg, 4 m/s) runs into a cart at rest (1 kg). They couple together. How fast do they move on?
    params:
      unit: m/s
    answer:
      value: 3
    hints:
      - "Momentum before: 3 · 4 = 12 kg·m/s."
      - Afterwards 4 kg move together.
    explanation: 12 ÷ 4 = 3 m/s. The momentum is spread over more mass.

  - kind: problem
    id: c4
    widget: numeric
    prompt: How many joules of kinetic energy were lost when coupling? Before 3 kg at 4 m/s, afterwards 4 kg at 3 m/s.
    params:
      unit: J
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 0
        misconception: energy-conserved
        text: Momentum stays the same, energy does not. Work out both energies.
    hints:
      - "Before: ½ · 3 · 4² = 24 J."
      - "After: ½ · 4 · 3² = 18 J."
    explanation: 24 J − 18 J = 6 J turned into heat and noise in the coupling.

  - kind: explain
    id: d1
    depth: 2
    body: When two equal balls collide head-on and elastically, they **swap** their velocities. The striking ball stops, the struck one rolls on at full speed.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A ball (1 kg, 6 m/s) hits a ball at rest (2 kg) head-on and elastically. The latter flies off at v = 2 · m₁ ÷ (m₁ + m₂) · 6 m/s. How fast?
    params:
      unit: m/s
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: inelastic
        text: That would be the inelastic collision where both roll on together.
    hints:
      - 2 · 1 ÷ 3 = 2/3.
      - 2/3 · 6 = ?
    explanation: "4 m/s. The light ball bounces back at 2 m/s. Check: momentum 6 = 8 − 2 and energy 18 J = 16 J + 2 J."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A bowling ball hits a ping-pong ball at rest elastically. Roughly how fast does the ball fly off?
    params:
      options:
        - label: Almost twice as fast as the bowling ball.
          correct: true
        - label: Exactly as fast as the bowling ball.
          feedback: That only holds for equal partners.
        - label: A little slower than the bowling ball.
          feedback: From the bowling ball's view, the ball bounces back at full speed – plus its own speed.
    hints:
      - "Put m₁ ≫ m₂ into the formula: 2 · m₁ ÷ (m₁ + m₂) ≈ ?"
      - Think of a ball bouncing off an approaching wall.
    explanation: The factor 2 · m₁ ÷ (m₁ + m₂) approaches 2. The heavy ball acts like a moving wall. Space probes gain speed from planets this way.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: In the **centre-of-mass frame** the common centre of mass is at rest and total momentum is zero. In an elastic collision both bodies simply reverse their velocities there. Many collision problems become much easier this way.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: "Ballistic pendulum: a bullet (10 g) lodges in a hanging wooden block (2 kg). The block swings up 5 cm. How fast was the bullet? g = 10 m/s²."
    params:
      unit: m/s
    answer:
      value: 201
      tolerance: 2
    feedback:
      - when: abs(numval(state.input) - 1) < 0.05
        misconception: block-speed
        text: That is the block's speed after the hit. Get back to the bullet using momentum.
    hints:
      - "Energy after the hit: v = √(2 · g · h) = 1 m/s."
      - "Momentum in the hit: 0.01 · v_b = 2.01 · 1."
    explanation: v = 2.01 ÷ 0.01 · 1 m/s ≈ 201 m/s. In the hit only momentum holds, afterwards only energy – the two steps must be kept apart.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: You drop a basketball with a tennis ball on top. The tennis ball bounces much higher than where it started. Why?
    params:
      options:
        - label: The rebounding basketball hits the still-falling tennis ball – which flies up at up to three times its speed.
          correct: true
        - label: The tennis ball is especially springy.
          feedback: On its own it never bounces higher than its start.
        - label: The air between the balls pushes it up.
          feedback: Air hardly matters. It is a collision with a moving wall.
    hints:
      - The basketball comes up at v, the tennis ball down at v.
      - Relative to the basketball the tennis ball has 2v – and bounces back at 2v.
    explanation: 2v back relative, plus the basketball's v, gives 3v upwards – up to nine times the height. In reality a bit less, because the collisions are not perfectly elastic.
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
