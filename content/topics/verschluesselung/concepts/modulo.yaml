id: cs.crypto.modulo
type: concept
title: Uhrenrechnen
summary: Modulo – rechnen im Kreis.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: uhr
    widget: numeric
    prompt: Es ist {{h}} Uhr. Wie spät ist es in {{d}} Stunden?
    params: { unit: Uhr }
    answer: { value: "{{mod(h + d, 24)}}" }
    feedback:
      - when: "numval(state.input) == h + d"
        misconception: no-wrap
        text: Eine Uhr hat nur 24 Stunden. Nach 24 geht es bei 0 weiter.
    hints:
      - Was passiert um Mitternacht?
    explanation: "{{h}} + {{d}} = {{h + d}}, minus 24 ergibt {{mod(h + d, 24)}} Uhr."
    variants:
      params: { h: "int[18,23]", d: "int[3,9]" }
      constraints: ["h + d >= 24"]
      defaults: { h: 22, d: 5 }

  - kind: explain
    id: s2
    body: |
      **Modulo** rechnet im Kreis – man behält nur den Rest.
      27 mod 24 = 3. Caesar rechnet modulo 26.

  - kind: problem
    id: rest
    widget: numeric
    prompt: Was ist {{a}} mod {{m}}?
    params: { placeholder: "Rest" }
    answer: { value: "{{mod(a, m)}}" }
    feedback:
      - when: "numval(state.input) == floor(a / m)"
        misconception: quotient
        text: Das ist, wie oft {{m}} hineinpasst. Gesucht ist der Rest.
    hints:
      - Wie oft passt {{m}} in {{a}}, und was bleibt übrig?
    explanation: "{{a}} = {{floor(a / m)}} · {{m}} + {{mod(a, m)}}."
    variants:
      params: { a: "int[20,99]", m: "choice[5,7,12,26]" }
      constraints: ["mod(a, m) != floor(a / m)"]
      defaults: { a: 30, m: 7 }

  - kind: problem
    id: buchstabe
    widget: numeric
    prompt: Buchstaben als Zahlen – A = 0, B = 1 … Z = 25. Verschiebe {{l}} um {{k}}. Welche Zahl kommt heraus?
    params: { placeholder: "0 bis 25" }
    answer: { value: "{{mod(i + k, 26)}}" }
    feedback:
      - when: "numval(state.input) == i + k"
        misconception: no-wrap
        text: Über 25 hinaus geht es wieder bei 0 los.
    hints:
      - "{{l}} ist die {{i}}. Rechne {{i}} + {{k}} modulo 26."
    explanation: "({{i}} + {{k}}) mod 26 = {{mod(i + k, 26)}} – das ist {{chr(i + k)}}."
    variants:
      params: { i: "int[18,25]", k: "int[3,12]" }
      derive: { l: "chr(i)" }
      constraints: ["i + k >= 26"]
      defaults: { i: 23, k: 5 }

  - kind: problem
    id: wochentag
    widget: choice
    prompt: Heute ist Mittwoch. Welcher Wochentag ist in 100 Tagen?
    params:
      layout: grid
      options:
        - { label: Freitag, correct: true }
        - { label: Mittwoch, feedback: "100 ist kein Vielfaches von 7." }
        - { label: Donnerstag, feedback: "100 mod 7 ist 2, nicht 1." }
        - { label: Samstag, feedback: "Einen Tag zu weit." }
    hints:
      - Eine Woche hat 7 Tage. Rechne 100 mod 7.
    explanation: 100 = 14 · 7 + 2. Zwei Tage nach Mittwoch ist Freitag.

  - kind: explain
    id: s6
    body: Wo steckt Modulo im Alltag?
    reveal:
      body: In Uhren und Kalendern, in Prüfziffern von IBAN und ISBN – und in fast jeder modernen Verschlüsselung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Verschlüsseln: (Buchstabe + 10) mod 26. Wie lautet die Zahl zum Entschlüsseln, die man stattdessen **addieren** kann?"
    answer:
      value: 16
    hints:
      - 10 + ? muss ein Vielfaches von 26 ergeben.
    explanation: 10 + 16 = 26 ≡ 0. Im Kreis ist Abziehen dasselbe wie das Passende dazuzählen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: Was ist {{a}} · {{b}} mod {{m}}?
    answer:
      value: "{{mod(a * b, m)}}"
    feedback:
      - when: numval(state.input) == a * b
        misconception: no-mod
        text: Das ist das Produkt. Gefragt ist der Rest beim Teilen durch {{m}}.
    hints:
      - Rechne erst {{a}} · {{b}} = {{a * b}}.
      - Zieh so oft {{m}} ab, wie es geht.
    explanation: "{{a * b}} = {{floor(a * b / m)}} · {{m}} + {{mod(a * b, m)}}."
    difficulty: 2
    variants:
      params:
        a: int[4,15]
        b: int[4,15]
        m: choice[7,11,13]
      defaults:
        a: 9
        b: 8
        m: 11

  - kind: explain
    id: cs-d2
    depth: 2
    body: "Beim Modulo-Rechnen darf man **zwischendurch reduzieren**: (a · b) mod m = ((a mod m) · (b mod m)) mod m. So bleiben die Zahlen klein – selbst bei riesigen Potenzen."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Was ist $2^{ {{e}} }$ mod 7?
    answer:
      value: "{{mod(2 ** e, 7)}}"
    hints:
      - Die Reste von 2, 4, 8, 16 … mod 7 wiederholen sich.
      - 2, 4, 1, 2, 4, 1 … – Länge 3.
    explanation: $2^3$ = 8 ≡ 1 (mod 7). Also kommt es nur auf {{e}} mod 3 = {{mod(e, 3)}} an. Ergebnis {{mod(2 ** e, 7)}}.
    difficulty: 2
    variants:
      params:
        e: int[5,30]
      defaults:
        e: 10

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: Welche Endziffer hat $7^{100}$?
    answer:
      value: 1
    hints:
      - Die Endziffern von 7, 49, 343, 2401 … wiederholen sich.
      - 7, 9, 3, 1 – dann von vorn. 100 mod 4 = ?
    explanation: Die Endziffer ist der Rest mod 10. Der Zyklus hat Länge 4, und 100 ist durch 4 teilbar – also 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Welche Zahl x erfüllt 3 · x ≡ 1 (mod 7)? Sie heißt das **Inverse** von 3.
    answer:
      value: 5
    hints:
      - Probier x = 1, 2, 3, … und nimm jeweils den Rest.
    explanation: 3 · 5 = 15 = 2 · 7 + 1. Mit solchen Inversen »teilt« man im Modulo-Rechnen – die Grundlage von RSA.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Nach dem kleinen Satz von Fermat gilt $a^6$ mod 7 = 1 für a = 1 bis 6. Was ist $3^{100}$ mod 7?
    answer:
      value: 4
    hints:
      - 100 = 6 · 16 + 4.
      - Bleibt $3^4$ = 81 mod 7.
    explanation: $3^{96}$ ≡ 1, also $3^{100}$ ≡ $3^4$ = 81 ≡ 4 (mod 7). Dieser Satz steckt hinter RSA.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Welches x zwischen 1 und 10 erfüllt {{a}} · x ≡ 1 (mod 11)?
    answer:
      value: "{{mod(a ** 9, 11)}}"
    hints:
      - Probier x = 1, 2, 3 … und rechne {{a}} · x mod 11.
      - Gesucht ist ein Vielfaches von {{a}}, das um 1 über einem Vielfachen von 11 liegt.
    explanation: "{{a}} · {{mod(a ** 9, 11)}} = {{a * mod(a ** 9, 11)}} ≡ 1 (mod 11). Weil 11 eine Primzahl ist, hat jede Zahl von 1 bis 10 ein Inverses."
    difficulty: 3
    variants:
      params:
        a: int[2,10]
      defaults:
        a: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Hat 4 ein Inverses modulo 8 – also ein x mit 4 · x ≡ 1 (mod 8)?
    params:
      options:
        - label: Nein – 4 und 8 haben den gemeinsamen Teiler 4
          correct: true
        - label: Ja, x = 2
          feedback: 4 · 2 = 8 ≡ 0, nicht 1.
        - label: Ja, jede Zahl hat eines
          feedback: Nur Zahlen ohne gemeinsamen Teiler mit dem Modul.
    hints:
      - Welche Reste ergibt 4 · x mod 8 überhaupt?
      - Nur 0 und 4.
    explanation: a hat genau dann ein Inverses mod m, wenn ggT(a, m) = 1. Darum wählt man in der Kryptografie oft Primzahlen als Modul.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was Modulo ist und wo es im Alltag steckt.
    params:
      keywords:
        - - rest
          - remainder
        - - kreis
          - uhr
          - clock
          - circle
          - von vorn
          - wrap
        - - teil
          - divid
      sample: "Modulo ist der Rest beim Teilen. 27 mod 24 ist 3, weil 24 einmal hineinpasst und 3 übrig bleiben. Eine Uhr rechnet so im Kreis: Nach 24 Uhr geht es von vorn los."
    difficulty: 3

srs:
  cards_from: [rest, buchstabe]
