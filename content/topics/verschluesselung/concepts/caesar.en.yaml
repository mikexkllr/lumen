id: cs.crypto.caesar
type: concept
title: The Caesar shift
summary: Every letter moves along.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Secret mail from Rome
    body: "Julius Caesar sent orders to his generals – in code. Guess what each card says first, then flip it. The trick: **every letter moves along.**"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏛️
            front: URPD
            back: "ROMA: every letter has moved on by three places."
          - icon: 📜
            front: WDAL
            back: "TAXI: X becomes A, because after Z it starts again at the front."
          - icon: 🗝️
            front: SLCCD
            back: "PIZZA: here too, behind every letter is the one three places before it."
          - icon: ✍️
            front: And your name?
            back: Shift every letter by three. Your secret code is ready.

  - kind: problem
    id: hallo
    widget: choice
    prompt: Caesar shifted every letter by 3 – A becomes D, B becomes E. What does KHOOR say?
    params:
      layout: grid
      options:
        - { label: HELLO, correct: true }
        - { label: NKRRU, feedback: "You shifted by 3 again. To decrypt, you go back." }
        - { label: KELLO, feedback: "You have to shift the K too." }
        - { label: HALLO, feedback: "Look at the second letter – H becomes E." }
    hints:
      - Go back 3 steps in the alphabet for each letter.
    explanation: K → H, H → E, O → L, O → L, R → O.

  - kind: explain
    id: s2
    body: |
      In a **Caesar shift**, every letter moves k places along.
      After Z, it starts again at A.

  - kind: problem
    id: schluessel
    widget: numeric
    prompt: The letter {{p}} becomes {{c}}. By how many places was it shifted?
    params: { unit: places }
    answer: { value: "{{k}}" }
    hints:
      - Count in the alphabet from {{p}} to {{c}}.
    explanation: "{{p}} + {{k}} places = {{c}}."
    variants:
      params: { i: "int[0,14]", k: "int[2,9]" }
      derive: { p: "chr(i)", c: "chr(i + k)" }
      defaults: { i: 7, k: 3 }

  - kind: problem
    id: paare
    widget: match
    prompt: Shift by 1. Match plaintext and ciphertext.
    params:
      leftTitle: Plaintext
      rightTitle: Ciphertext
      pairs:
        - { left: HAL, right: IBM }
        - { left: CAT, right: DBU }
        - { left: ZEBRA, right: AFCSB }
        - { left: YOU, right: ZPV }
    hints:
      - Watch out for the Z – after it comes A again.
    explanation: Every letter moves one along. HAL becomes IBM.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: How many different Caesar keys are there, if a shift of 0 does not count?
    params: { unit: keys }
    answer: { value: 25 }
    feedback:
      - when: "numval(state.input) == 26"
        misconception: count-zero
        text: After 26 places, you are back at the start. That is the same as a shift of 0.
    hints:
      - The alphabet has 26 letters.
    explanation: The shifts 1 to 25 are different. After that, it repeats.

  - kind: explain
    id: s6
    body: How do you crack Caesar without the key?
    reveal:
      body: Try all 25 options. Or count – in English, E is the most common letter. The most common secret letter reveals the shift.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A text was encrypted with Caesar. The most frequent letter in the ciphertext is H. In German E is the most frequent. By how many places was it shifted?
    answer:
      value: 3
    hints:
      - "From E to H: F, G, H."
    explanation: 3. This **frequency analysis** cracks every simple letter substitution.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "**Vigenère** encryption uses a keyword. Each of its letters sets its own shift: with KEY you shift by 10, 4 and 24, then start over."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Vigenère with the key »BC« – shift 1, then 2. What does »AAAA« become?
    params:
      options:
        - label: BCBC
          correct: true
        - label: BBBB
          feedback: That would be Caesar with shift 1.
        - label: CCCC
          feedback: The shift changes with every letter.
    hints:
      - A shifted by 1 is B, A shifted by 2 is C.
      - "The key repeats: B, C, B, C."
    explanation: Equal plaintext letters get encrypted differently. That makes simple frequency counting useless.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: How many different 5-letter keywords are there (A to Z)?
    answer:
      value: 11881376
    feedback:
      - when: numval(state.input) == 130
        misconception: add-vs-multiply
        text: The options multiply, they do not add.
    hints:
      - Each of the 5 places has 26 options.
      - $26^5$.
    explanation: $26^5$ = 11,881,376 – almost 12 million. A lot for humans, little for computers.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Instead of shifting, each letter is replaced by an arbitrary other one. There are 26! ≈ 4 · 10²⁶ keys. Is that secure?
    params:
      options:
        - label: No – the letter frequencies survive and reveal the key
          correct: true
        - label: Yes – nobody can try that many keys
          feedback: You need not try; you count letters.
        - label: Yes, if the text is long
          feedback: The longer the text, the easier the analysis.
    hints:
      - The most frequent symbol is probably E.
    explanation: Many keys alone do not make it secure. Good ciphers blur every statistical pattern.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: How do you break Vigenère anyway?
    params:
      options:
        - label: Find the key length, then break every k-th letter like Caesar by frequency
          correct: true
        - label: Not at all – it is unbreakable
          feedback: It was once called that, until Kasiski published a method in 1863.
        - label: Try every dictionary
          feedback: The key need not be a word.
    hints:
      - If the key length is 3 – what holds for every third letter?
      - Every third letter was shifted the same.
    explanation: Repeated patterns in the ciphertext reveal the key length. After that Vigenère falls apart into several Caesar puzzles.
    difficulty: 3

  - kind: explain
    id: cs-x2
    depth: 3
    body: "**Kerckhoffs's principle**: a method must stay secure even if the opponent knows everything except the key. A secret algorithm is no security – sooner or later it gets out."

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why Caesar is so easy to break.
    params:
      keywords:
        - - "25"
          - wenige
          - few
          - "26"
        - - probier
          - alle
          - try
          - brute
        - - häufig
          - frequen
          - zählen
          - count
      sample: "There are only 25 keys – you can simply try them all. Also the frequencies stay the same: the most common letter is usually a shifted E."
    difficulty: 3

srs:
  cards_from: [schluessel, anzahl]
