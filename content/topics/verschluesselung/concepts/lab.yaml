id: cs.crypto.lab
type: concept
title: Krypto-Labor
summary: XOR, Caesar und Schlüsseltausch.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: s1
    body: |
      **XOR** vergleicht Bits: gleich ergibt 0, verschieden ergibt 1. Verknüpft man eine Nachricht per XOR mit einem zufälligen Schlüssel, ist sie verschlüsselt – und derselbe Schlüssel entschlüsselt sie wieder.

  - kind: problem
    id: verschluesseln
    widget: bits
    prompt: Verschlüssele 0110 mit dem Schlüssel 0011 per XOR.
    params: { bits: 4, showValue: false }
    answer: { value: 5 }
    hints:
      - Stelle für Stelle – gleich gibt 0, verschieden gibt 1.
    explanation: 0110 XOR 0011 = 0101.

  - kind: problem
    id: entschluesseln
    widget: bits
    prompt: Entschlüssele 1010 mit dem Schlüssel 0110.
    params: { bits: 4, showValue: false }
    answer: { value: 12 }
    hints:
      - Entschlüsseln geht genauso wie Verschlüsseln.
    explanation: 1010 XOR 0110 = 1100. Zweimal derselbe Schlüssel hebt sich auf.

  - kind: problem
    id: caesar
    widget: match
    prompt: Caesar mit Verschiebung 3. Verbinde Klartext und Geheimtext.
    params:
      pairs:
        - { left: A, right: D }
        - { left: B, right: E }
        - { left: X, right: A }
        - { left: Z, right: C }
    hints:
      - Am Ende des Alphabets geht es vorne weiter.
    explanation: Nach Z kommt wieder A – das ist Rechnen modulo 26.

  - kind: problem
    id: farben
    widget: order
    prompt: Bring den Schlüsseltausch mit Farben in die richtige Reihenfolge.
    params:
      items:
        - { label: Öffentlich auf eine Grundfarbe einigen }
        - { label: Jeder mischt heimlich seine Geheimfarbe hinein }
        - { label: Die Mischungen offen austauschen }
        - { label: Jeder mischt nochmal seine Geheimfarbe dazu }
    hints:
      - Am Ende haben beide dieselbe Farbe – ohne sie je gesendet zu haben.
    explanation: Wer nur die Mischungen sieht, kann die Geheimfarben nicht herausrechnen.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das **One-Time-Pad** – XOR mit einem zufälligen Schlüssel, so lang wie die Nachricht – ist beweisbar unknackbar. Warum nutzt man es kaum?
    params:
      options:
        - label: Der Schlüssel muss so lang sein wie alle Nachrichten zusammen – und vorher sicher übergeben werden
          correct: true
        - label: XOR ist zu langsam
          feedback: XOR ist die schnellste Operation überhaupt.
        - label: Es wurde inzwischen geknackt
          feedback: Es ist mathematisch bewiesen sicher.
    hints:
      - Wie bringt man einen Gigabyte-Schlüssel sicher zum Empfänger?
    explanation: Verwendet man den Schlüssel zweimal, bricht die Sicherheit zusammen. Praktische Verfahren tauschen perfekte gegen ausreichende Sicherheit.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux das Prinzip mit öffentlichem und privatem Schlüssel.
    params:
      keywords:
        - - öffentlich
          - public
        - - privat
          - geheim
          - private
          - secret
        - - verschlüssel
          - verschließ
          - encrypt
          - lock
          - schloss
        - - entschlüssel
          - öffn
          - decrypt
          - open
          - unlock
      min: 3
      sample: Den öffentlichen Schlüssel darf jeder kennen – damit verschlüsselt man eine Nachricht. Entschlüsseln kann sie nur, wer den privaten Schlüssel hat, und der bleibt geheim.
    difficulty: 3

srs:
  cards_from: [verschluesseln, farben]
