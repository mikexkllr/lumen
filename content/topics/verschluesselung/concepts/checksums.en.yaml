id: cs.crypto.checksums
type: concept
title: Check digits and hashes
summary: Spot errors, protect passwords.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One bit has flipped
    body: "Memory chips and radio links repair small errors by themselves. The trick: every row and column has **an even number** of cells switched on. Here one cell has flipped. Can you find it?"
    visual:
      widget: pixels
      interactive: true
      params:
        cells:
          - "#.###"
          - .##..
          - "#...."
          - ..#.#
          - ..##.
        counter: true

  - kind: problem
    id: quersumme
    widget: numeric
    body: A simple check digit – add all the digits and take the last digit of the sum.
    prompt: What is the check digit of {{a}}{{b}}{{c}}{{d}}?
    params: { placeholder: "Digit" }
    answer: { value: "{{mod(a + b + c + d, 10)}}" }
    hints:
      - "{{a}} + {{b}} + {{c}} + {{d}} = {{a + b + c + d}}."
    explanation: "The sum is {{a + b + c + d}} – the last digit is {{mod(a + b + c + d, 10)}}."
    variants:
      params: { a: "int[1,9]", b: "int[0,9]", c: "int[0,9]", d: "int[0,9]" }
      defaults: { a: 4, b: 7, c: 3, d: 8 }

  - kind: problem
    id: dreher
    widget: choice
    prompt: Someone types 4738 instead of 4378. Does the digit-sum check notice the error?
    params:
      options:
        - { label: No – the sum stays the same, correct: true }
        - { label: "Yes", feedback: "Swapped digits give the same sum." }
    hints:
      - Calculate both sums.
    explanation: That is why real check digits, like in IBANs or ISBNs, weight each position differently.

  - kind: explain
    id: s3
    body: |
      A **hash** is a kind of super check digit. Any data becomes a short fingerprint. If one character changes, the whole hash changes – and you cannot work backward.

  - kind: problem
    id: passwort
    widget: buckets
    prompt: What should a service store about your password?
    params:
      buckets: [{ label: good }, { label: bad }]
      items:
        - { label: A salted hash, bucket: good }
        - { label: The password in plain text, bucket: bad }
        - { label: The password shifted with Caesar, bucket: bad }
        - { label: A slow password hash, bucket: good }
    hints:
      - What happens if the database is stolen?
    explanation: A salted, slow hash is almost impossible to reverse. Plain text and Caesar are cracked instantly.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: The same text always gives the same hash.
          right: true
        - text: From a hash you can compute the text back.
          right: false
          why: A hash is a one-way street.
        - text: Change a single character and the hash looks completely different.
          right: true

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: Every row and every column must have an even number of cells on. The last row and column are check bits. One cell has flipped – maybe even a check bit. Find it and switch it back.
    params:
      cells:
        - .##..
        - "###.#"
        - ..##.
        - "#...#"
        - ..#..
    answer:
      pattern:
        - .##..
        - "###.#"
        - ..##.
        - "#...#"
        - ..##.
    hints:
      - Count how many cells are on in every row and every column.
      - Only the last row and the fourth column are odd.
    explanation: "This time a check bit itself had flipped. The rule finds that too: the error sits where the odd row and the odd column cross."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: You download a program. Its hash is shown on the website. What for?
    params:
      options:
        - label: You can check whether the file was changed or swapped on the way
          correct: true
        - label: To unpack the file
          feedback: The hash does not contain the file.
        - label: As a password for installation
          feedback: It is only for comparison.
    hints:
      - "Same hash means practically certainly: same file."
    explanation: If the hash you compute matches, the file is unchanged.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "ISBN-13: digits are weighted alternately 1 and 3, and the sum must be divisible by 10. For 978-3-16-148410-? the first twelve give exactly 100. Which check digit is missing?"
    answer:
      value: 0
    hints:
      - What is missing up to the next multiple of 10?
      - 100 is already divisible by 10.
    explanation: 100 + 0 = 100. The ISBN is 978-3-16-148410-0.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Why does the ISBN weight digits alternately by 1 and 3 instead of just adding them?
    params:
      options:
        - label: That way swapped neighbouring digits are usually caught
          correct: true
        - label: To make the sum bigger
          feedback: The size does not matter, only the remainder.
        - label: Out of tradition
          feedback: The weights have a clear purpose.
    hints:
      - What happens to the plain sum with 4738 instead of 4378?
      - With weights each digit counts differently depending on its place.
    explanation: Swapping a and b changes the sum by 2 · (a − b). That is divisible by 10 only for a gap of 5 – almost every swap is caught.
    difficulty: 2

  - kind: explain
    id: cs-d3
    depth: 2
    body: "Good hash functions show the **avalanche effect**: if a single input bit changes, about half of all hash bits flip. Similar texts get completely different fingerprints."

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: A SHA-256 hash has 256 bits. How many hex digits does a web page show for it?
    answer:
      value: 64
    hints:
      - One hex digit is 4 bits.
      - 256 / 4.
    explanation: 256 / 4 = 64 digits. Comparing just the start and end already helps – forging both is defeated by the avalanche effect.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A hash has 256 bits. By the birthday paradox two texts with the **same** hash are found after about 2 to the what power tries?
    answer:
      value: 128
    hints:
      - "The square root of the number of possibilities: half the exponent."
    explanation: 2¹²⁸ – still out of reach. That is why a hash needs twice as many bits as the desired security.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: You look for a text that hits one specific 64-bit hash. About how many attempts do you need? Give the exponent to base 2.
    answer:
      value: 64
    feedback:
      - when: numval(state.input) == 32
        misconception: birthday-vs-preimage
        text: That holds for any collision between two texts. A fixed target hash is much harder.
    hints:
      - Each attempt hits with probability $1/2^{64}$.
      - The birthday paradox does not help here – the target is fixed.
    explanation: "Preimage: about $2^{64}$ attempts. Collision: only $2^{32}$, because any pair counts. That is why collision resistance needs hashes twice as long."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: MD5 is considered broken. What does that mean?
    params:
      options:
        - label: You can deliberately craft two different files with the same hash
          correct: true
        - label: You can compute the file back from the hash
          feedback: That is still not practical today.
        - label: The hash changes on every call
          feedback: A hash is always the same for the same data.
    hints:
      - Which property of a hash is easiest to attack?
      - Collisions are found faster than preimages.
    explanation: MD5 collisions take seconds on a laptop. In 2012 the Flame malware used this to forge signatures.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: How do you check that a message is not just intact but also from the right sender?
    params:
      options:
        - label: With a secret key in the hash (HMAC) or a digital signature
          correct: true
        - label: With a longer hash
          feedback: Anyone can recompute a long hash as well.
        - label: With two hashes
          feedback: A forger can simply recompute two hashes too.
    hints:
      - Anyone can recompute a normal hash.
      - It needs something only the sender knows.
    explanation: An HMAC mixes in a shared key. A signature uses the sender's private key. A forger can reproduce neither.
    difficulty: 3

srs:
  cards_from: [dreher, passwort]
