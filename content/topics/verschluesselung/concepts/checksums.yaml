id: cs.crypto.checksums
type: concept
title: Prüfziffern und Hashes
summary: Fehler erkennen, Passwörter schützen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Bit ist gekippt
    body: "Speicherchips und Funkverbindungen reparieren kleine Fehler selbst. Der Trick: In jeder Zeile und Spalte sind **gerade viele** Felder an. Hier ist ein Feld gekippt. Findest du es?"
    visual:
      widget: pixels
      interactive: true
      params:
        cells:
          - "#.###"
          - .##..
          - "#...."
          - ..#.#
          - ..##.
        counter: true

  - kind: problem
    id: quersumme
    widget: numeric
    body: Eine einfache Prüfziffer – addiere alle Ziffern und nimm die letzte Stelle der Summe.
    prompt: Welche Prüfziffer hat {{a}}{{b}}{{c}}{{d}}?
    params: { placeholder: "Ziffer" }
    answer: { value: "{{mod(a + b + c + d, 10)}}" }
    hints:
      - "{{a}} + {{b}} + {{c}} + {{d}} = {{a + b + c + d}}."
    explanation: "Summe {{a + b + c + d}} – die letzte Stelle ist {{mod(a + b + c + d, 10)}}."
    variants:
      params: { a: "int[1,9]", b: "int[0,9]", c: "int[0,9]", d: "int[0,9]" }
      defaults: { a: 4, b: 7, c: 3, d: 8 }

  - kind: problem
    id: dreher
    widget: choice
    prompt: Jemand tippt 4738 statt 4378. Merkt die Quersummen-Prüfung den Fehler?
    params:
      options:
        - { label: Nein – die Summe bleibt gleich, correct: true }
        - { label: Ja, feedback: "Vertauschte Ziffern ergeben dieselbe Summe." }
    hints:
      - Rechne beide Summen.
    explanation: Darum gewichten echte Prüfziffern wie bei IBAN oder ISBN jede Stelle anders.

  - kind: explain
    id: s3
    body: |
      Ein **Hash** ist eine Art Super-Prüfziffer. Aus beliebigen Daten wird ein kurzer Fingerabdruck. Ändert sich ein Zeichen, ändert sich der ganze Hash – und zurückrechnen geht nicht.

  - kind: problem
    id: passwort
    widget: buckets
    prompt: Was sollte ein Dienst über dein Passwort speichern?
    params:
      buckets: [{ label: gut }, { label: schlecht }]
      items:
        - { label: Einen Hash mit Salz, bucket: gut }
        - { label: Das Passwort im Klartext, bucket: schlecht }
        - { label: Das Passwort mit Caesar verschoben, bucket: schlecht }
        - { label: Einen langsamen Passwort-Hash, bucket: gut }
    hints:
      - Was passiert, wenn die Datenbank gestohlen wird?
    explanation: Ein gesalzener, langsamer Hash lässt sich kaum zurückrechnen. Klartext und Caesar sind sofort geknackt.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Derselbe Text ergibt immer denselben Hash.
          right: true
        - text: Aus einem Hash kann man den Text zurückrechnen.
          right: false
          why: Ein Hash ist eine Einbahnstraße.
        - text: Ändert man ein einziges Zeichen, sieht der Hash völlig anders aus.
          right: true

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: In jeder Zeile und jeder Spalte müssen gerade viele Felder an sein. Die letzte Zeile und Spalte sind Prüfbits. Ein Feld ist gekippt – vielleicht sogar ein Prüfbit. Finde es und schalte es zurück.
    params:
      cells:
        - .##..
        - "###.#"
        - ..##.
        - "#...#"
        - ..#..
    answer:
      pattern:
        - .##..
        - "###.#"
        - ..##.
        - "#...#"
        - ..##.
    hints:
      - Zähle in jeder Zeile und jeder Spalte, wie viele Felder an sind.
      - Ungerade sind nur die letzte Zeile und die vierte Spalte.
    explanation: "Diesmal war ein Prüfbit selbst gekippt. Die Regel findet auch das: Der Fehler sitzt dort, wo sich die ungerade Zeile und die ungerade Spalte kreuzen."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du lädst ein Programm herunter. Auf der Webseite steht sein Hash. Wozu?
    params:
      options:
        - label: Du kannst prüfen, ob die Datei unterwegs verändert oder ausgetauscht wurde
          correct: true
        - label: Um die Datei zu entpacken
          feedback: Der Hash enthält die Datei nicht.
        - label: Als Passwort für die Installation
          feedback: Er dient nur dem Vergleich.
    hints:
      - "Gleicher Hash heißt praktisch sicher: gleiche Datei."
    explanation: Stimmt der selbst berechnete Hash überein, ist die Datei unverändert.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "ISBN-13: Die Ziffern werden abwechselnd mit 1 und 3 gewichtet, die Summe muss durch 10 teilbar sein. Bei 978-3-16-148410-? ergeben die ersten zwölf genau 100. Welche Prüfziffer fehlt?"
    answer:
      value: 0
    hints:
      - Welche Zahl fehlt bis zum nächsten Vielfachen von 10?
      - 100 ist schon durch 10 teilbar.
    explanation: 100 + 0 = 100. Die ISBN lautet 978-3-16-148410-0.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Warum gewichtet die ISBN die Ziffern abwechselnd mit 1 und 3, statt sie einfach zu addieren?
    params:
      options:
        - label: So fallen auch vertauschte Nachbarziffern meist auf
          correct: true
        - label: Damit die Summe größer wird
          feedback: Die Größe spielt keine Rolle, nur der Rest.
        - label: Aus Tradition
          feedback: Die Gewichte haben einen klaren Zweck.
    hints:
      - Was passiert bei 4738 statt 4378 mit der einfachen Summe?
      - Mit Gewichten zählt jede Ziffer je nach Platz anders.
    explanation: Vertauscht man a und b, ändert sich die Summe um 2 · (a − b). Das ist nur bei einem Abstand von 5 durch 10 teilbar – fast alle Dreher fallen auf.
    difficulty: 2

  - kind: explain
    id: cs-d3
    depth: 2
    body: "Gute Hashfunktionen zeigen den **Lawineneffekt**: Ändert sich ein einziges Bit der Eingabe, kippt etwa die Hälfte aller Bits des Hashs. Ähnliche Texte haben völlig verschiedene Fingerabdrücke."

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: Ein SHA-256-Hash hat 256 Bit. Wie viele Hex-Ziffern zeigt eine Webseite dafür an?
    answer:
      value: 64
    hints:
      - Eine Hex-Ziffer sind 4 Bit.
      - 256 / 4.
    explanation: 256 / 4 = 64 Ziffern. Vergleiche ruhig nur Anfang und Ende – wer beides passend fälschen will, scheitert am Lawineneffekt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Hash hat 256 Bit. Nach dem Geburtstagsparadox findet man zwei Texte mit **gleichem** Hash nach etwa 2 hoch wie vielen Versuchen?
    answer:
      value: 128
    hints:
      - "Die Wurzel aus der Zahl der Möglichkeiten: halber Exponent."
    explanation: 2¹²⁸ – immer noch unerreichbar. Darum braucht ein Hash doppelt so viele Bits wie die gewünschte Sicherheit.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Du suchst einen Text, der einen ganz bestimmten 64-Bit-Hash trifft. Wie viele Versuche brauchst du etwa? Gib den Exponenten zur Basis 2 an.
    answer:
      value: 64
    feedback:
      - when: numval(state.input) == 32
        misconception: birthday-vs-preimage
        text: Das gilt für irgendeine Kollision zweier Texte. Ein fester Zielhash ist viel schwerer.
    hints:
      - Jeder Versuch trifft mit Wahrscheinlichkeit $1/2^{64}$.
      - Das Geburtstagsparadox hilft hier nicht – das Ziel steht fest.
    explanation: "Urbild: etwa $2^{64}$ Versuche. Kollision: nur $2^{32}$, weil dort jedes Paar zählt. Darum braucht man für Kollisionssicherheit doppelt so lange Hashes."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: MD5 gilt als gebrochen. Was heißt das?
    params:
      options:
        - label: Man kann gezielt zwei verschiedene Dateien mit gleichem Hash bauen
          correct: true
        - label: Man kann aus dem Hash die Datei zurückrechnen
          feedback: Das ist bis heute nicht praktikabel.
        - label: Der Hash ändert sich bei jedem Aufruf
          feedback: Ein Hash ist immer gleich für gleiche Daten.
    hints:
      - Welche Eigenschaft eines Hashs ist am leichtesten anzugreifen?
      - Kollisionen findet man schneller als Urbilder.
    explanation: MD5-Kollisionen dauern auf einem Laptop Sekunden. 2012 nutzte die Schadsoftware Flame das, um falsche Signaturen zu fälschen.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Wie prüft man, dass eine Nachricht nicht nur heil ist, sondern auch vom richtigen Absender stammt?
    params:
      options:
        - label: Mit einem geheimen Schlüssel im Hash (HMAC) oder einer digitalen Signatur
          correct: true
        - label: Mit einem längeren Hash
          feedback: Jeder kann auch einen langen Hash neu berechnen.
        - label: Mit zwei Hashes
          feedback: Auch zwei Hashes kann ein Fälscher einfach neu berechnen.
    hints:
      - Ein normaler Hash lässt sich von jedem neu berechnen.
      - Es braucht etwas, das nur der Absender kennt.
    explanation: Ein HMAC mischt einen gemeinsamen Schlüssel ein. Eine Signatur nutzt den privaten Schlüssel des Absenders. Beides kann ein Fälscher nicht nachbauen.
    difficulty: 3

srs:
  cards_from: [dreher, passwort]
