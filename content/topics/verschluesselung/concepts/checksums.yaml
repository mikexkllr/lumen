id: cs.crypto.checksums
type: concept
title: Prüfziffern und Hashes
summary: Fehler erkennen, Passwörter schützen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: quersumme
    widget: numeric
    body: Eine einfache Prüfziffer – addiere alle Ziffern und nimm die letzte Stelle der Summe.
    prompt: Welche Prüfziffer hat {{a}}{{b}}{{c}}{{d}}?
    params: { placeholder: "Ziffer" }
    answer: { value: "{{mod(a + b + c + d, 10)}}" }
    hints:
      - "{{a}} + {{b}} + {{c}} + {{d}} = {{a + b + c + d}}."
    explanation: "Summe {{a + b + c + d}} – die letzte Stelle ist {{mod(a + b + c + d, 10)}}."
    variants:
      params: { a: "int[1,9]", b: "int[0,9]", c: "int[0,9]", d: "int[0,9]" }
      defaults: { a: 4, b: 7, c: 3, d: 8 }

  - kind: problem
    id: dreher
    widget: choice
    prompt: Jemand tippt 4738 statt 4378. Merkt die Quersummen-Prüfung den Fehler?
    params:
      options:
        - { label: Nein – die Summe bleibt gleich, correct: true }
        - { label: Ja, feedback: "Vertauschte Ziffern ergeben dieselbe Summe." }
    hints:
      - Rechne beide Summen.
    explanation: Darum gewichten echte Prüfziffern wie bei IBAN oder ISBN jede Stelle anders.

  - kind: explain
    id: s3
    body: |
      Ein **Hash** ist eine Art Super-Prüfziffer. Aus beliebigen Daten wird ein kurzer Fingerabdruck. Ändert sich ein Zeichen, ändert sich der ganze Hash – und zurückrechnen geht nicht.

  - kind: problem
    id: passwort
    widget: buckets
    prompt: Was sollte ein Dienst über dein Passwort speichern?
    params:
      buckets: [{ label: gut }, { label: schlecht }]
      items:
        - { label: Einen Hash mit Salz, bucket: gut }
        - { label: Das Passwort im Klartext, bucket: schlecht }
        - { label: Das Passwort mit Caesar verschoben, bucket: schlecht }
        - { label: Einen langsamen Passwort-Hash, bucket: gut }
    hints:
      - Was passiert, wenn die Datenbank gestohlen wird?
    explanation: Ein gesalzener, langsamer Hash lässt sich kaum zurückrechnen. Klartext und Caesar sind sofort geknackt.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Derselbe Text ergibt immer denselben Hash.
          right: true
        - text: Aus einem Hash kann man den Text zurückrechnen.
          right: false
          why: Ein Hash ist eine Einbahnstraße.
        - text: Ändert man ein einziges Zeichen, sieht der Hash völlig anders aus.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du lädst ein Programm herunter. Auf der Webseite steht sein Hash. Wozu?
    params:
      options:
        - label: Du kannst prüfen, ob die Datei unterwegs verändert oder ausgetauscht wurde
          correct: true
        - label: Um die Datei zu entpacken
          feedback: Der Hash enthält die Datei nicht.
        - label: Als Passwort für die Installation
          feedback: Er dient nur dem Vergleich.
    hints:
      - "Gleicher Hash heißt praktisch sicher: gleiche Datei."
    explanation: Stimmt der selbst berechnete Hash überein, ist die Datei unverändert.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Hash hat 256 Bit. Nach dem Geburtstagsparadox findet man zwei Texte mit **gleichem** Hash nach etwa 2 hoch wie vielen Versuchen?
    answer:
      value: 128
    hints:
      - "Die Wurzel aus der Zahl der Möglichkeiten: halber Exponent."
    explanation: 2¹²⁸ – immer noch unerreichbar. Darum braucht ein Hash doppelt so viele Bits wie die gewünschte Sicherheit.
    difficulty: 3

srs:
  cards_from: [dreher, passwort]
