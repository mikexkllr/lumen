id: cs.crypto.lab
type: concept
title: Crypto lab
summary: XOR, Caesar and key exchange.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: s1
    body: |
      **XOR** compares bits: equal gives 0, different gives 1. If you combine a message with a random key using XOR, it is encrypted – and the same key decrypts it again.

  - kind: problem
    id: verschluesseln
    widget: bits
    prompt: Encrypt 0110 with the key 0011 using XOR.
    params: { bits: 4, showValue: false }
    answer: { value: 5 }
    hints:
      - Position by position – equal gives 0, different gives 1.
    explanation: 0110 XOR 0011 = 0101.

  - kind: problem
    id: entschluesseln
    widget: bits
    prompt: Decrypt 1010 with the key 0110.
    params: { bits: 4, showValue: false }
    answer: { value: 12 }
    hints:
      - Decrypting works the same way as encrypting.
    explanation: 1010 XOR 0110 = 1100. The same key twice cancels out.

  - kind: problem
    id: caesar
    widget: match
    prompt: Caesar with a shift of 3. Match plaintext and ciphertext.
    params:
      pairs:
        - { left: A, right: D }
        - { left: B, right: E }
        - { left: X, right: A }
        - { left: Z, right: C }
    hints:
      - At the end of the alphabet, it continues at the front.
    explanation: After Z comes A again – that is arithmetic modulo 26.

  - kind: problem
    id: farben
    widget: order
    prompt: Put the key exchange with colors in the right order.
    params:
      items:
        - { label: Publicly agree on a common color }
        - { label: Each person secretly mixes in their secret color }
        - { label: Exchange the mixtures openly }
        - { label: Each person mixes in their secret color again }
    hints:
      - In the end, both have the same color – without ever sending it.
    explanation: Anyone who sees only the mixtures cannot work out the secret colors.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The **one-time pad** – XOR with a random key as long as the message – is provably unbreakable. Why is it hardly used?
    params:
      options:
        - label: The key must be as long as all messages together – and be handed over securely beforehand
          correct: true
        - label: XOR is too slow
          feedback: XOR is the fastest operation of all.
        - label: It has since been broken
          feedback: It is mathematically proven secure.
    hints:
      - How do you get a gigabyte key securely to the recipient?
    explanation: If the key is used twice, security collapses. Practical ciphers trade perfect for sufficient security.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain the principle of public and private keys to Lux.
    params:
      keywords:
        - - öffentlich
          - public
        - - privat
          - geheim
          - private
          - secret
        - - verschlüssel
          - verschließ
          - encrypt
          - lock
          - schloss
        - - entschlüssel
          - öffn
          - decrypt
          - open
          - unlock
      min: 3
      sample: Anyone may know the public key – it is used to encrypt a message. Only the holder of the private key can decrypt it, and that key stays secret.
    difficulty: 3

srs:
  cards_from: [verschluesseln, farben]
