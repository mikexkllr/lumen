id: cs.crypto.caesar
type: concept
title: Die Caesar-Verschiebung
summary: Jeder Buchstabe rückt weiter.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hallo
    widget: choice
    prompt: Caesar verschob jeden Buchstaben um 3 – aus A wird D, aus B wird E. Was heißt KDOOR?
    params:
      layout: grid
      options:
        - { label: HALLO, correct: true }
        - { label: NGRRU, feedback: "Du hast noch einmal um 3 verschoben. Zum Entschlüsseln geht es zurück." }
        - { label: KALLO, feedback: "Das K musst du auch verschieben." }
        - { label: HELLO, feedback: "Schau dir den zweiten Buchstaben an – D wird zu A." }
    hints:
      - Geh bei jedem Buchstaben 3 Schritte im Alphabet zurück.
    explanation: K → H, D → A, O → L, O → L, R → O.

  - kind: explain
    id: s2
    body: |
      Bei der **Caesar-Verschiebung** rückt jeder Buchstabe um k Stellen weiter.
      Nach Z geht es wieder mit A los.

  - kind: problem
    id: schluessel
    widget: numeric
    prompt: Aus dem Buchstaben {{p}} wird {{c}}. Um wie viele Stellen wurde verschoben?
    params: { unit: Stellen }
    answer: { value: "{{k}}" }
    hints:
      - Zähle im Alphabet von {{p}} bis {{c}}.
    explanation: "{{p}} + {{k}} Stellen = {{c}}."
    variants:
      params: { i: "int[0,14]", k: "int[2,9]" }
      derive: { p: "chr(i)", c: "chr(i + k)" }
      defaults: { i: 7, k: 3 }

  - kind: problem
    id: paare
    widget: match
    prompt: Verschiebung um 1. Verbinde Klartext und Geheimtext.
    params:
      leftTitle: Klartext
      rightTitle: Geheimtext
      pairs:
        - { left: HAL, right: IBM }
        - { left: KATZE, right: LBUAF }
        - { left: ZEBRA, right: AFCSB }
        - { left: ICH, right: JDI }
    hints:
      - Achte auf das Z – danach kommt wieder A.
    explanation: Jeder Buchstabe rückt einen weiter. Aus HAL wird IBM.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Wie viele verschiedene Caesar-Schlüssel gibt es, wenn Verschiebung 0 nicht zählt?
    params: { unit: Schlüssel }
    answer: { value: 25 }
    feedback:
      - when: "numval(state.input) == 26"
        misconception: count-zero
        text: Bei 26 Stellen ist man wieder am Anfang. Das ist wie Verschiebung 0.
    hints:
      - Das Alphabet hat 26 Buchstaben.
    explanation: Die Verschiebungen 1 bis 25 sind verschieden. Danach wiederholt es sich.

  - kind: explain
    id: s6
    body: Wie knackt man Caesar ohne den Schlüssel?
    reveal:
      body: Alle 25 Möglichkeiten probieren. Oder zählen – im Deutschen ist E der häufigste Buchstabe. Der häufigste Geheimbuchstabe verrät die Verschiebung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Text wurde mit Caesar verschlüsselt. Der häufigste Buchstabe im Geheimtext ist H. Im Deutschen ist E am häufigsten. Um wie viele Stellen wurde verschoben?
    answer:
      value: 3
    hints:
      - "Von E nach H: F, G, H."
    explanation: 3. Diese **Häufigkeitsanalyse** knackt jede einfache Buchstabenersetzung.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Die **Vigenère**-Verschlüsselung nutzt ein Schlüsselwort. Jeder Buchstabe darin gibt eine eigene Verschiebung vor: Bei KEY wird um 10, 4 und 24 verschoben, dann wieder von vorn."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: choice
    prompt: Vigenère mit dem Schlüssel »BC« – also Verschiebung 1, dann 2. Was wird aus »AAAA«?
    params:
      options:
        - label: BCBC
          correct: true
        - label: BBBB
          feedback: Das wäre Caesar mit Verschiebung 1.
        - label: CCCC
          feedback: Die Verschiebung wechselt mit jedem Buchstaben.
    hints:
      - A um 1 ist B, A um 2 ist C.
      - "Der Schlüssel wiederholt sich: B, C, B, C."
    explanation: Gleiche Klartext-Buchstaben werden verschieden verschlüsselt. Das macht einfaches Zählen von Häufigkeiten nutzlos.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Wie viele verschiedene Schlüsselwörter mit 5 Buchstaben gibt es (A bis Z)?
    answer:
      value: 11881376
    feedback:
      - when: numval(state.input) == 130
        misconception: add-vs-multiply
        text: Die Möglichkeiten werden multipliziert, nicht addiert.
    hints:
      - Jede der 5 Stellen hat 26 Möglichkeiten.
      - $26^5$.
    explanation: $26^5$ = 11 881 376 – fast 12 Millionen. Für Menschen viel, für Computer wenig.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Statt zu verschieben, ersetzt man jeden Buchstaben durch einen beliebigen anderen. Es gibt 26! ≈ 4 · 10²⁶ Schlüssel. Ist das sicher?
    params:
      options:
        - label: Nein – die Buchstabenhäufigkeiten bleiben erhalten und verraten den Schlüssel
          correct: true
        - label: Ja – so viele Schlüssel kann niemand durchprobieren
          feedback: Man muss nicht probieren, man zählt Buchstaben.
        - label: Ja, wenn der Text lang ist
          feedback: Je länger der Text, desto leichter die Analyse.
    hints:
      - Das häufigste Zeichen ist vermutlich das E.
    explanation: Viele Schlüssel allein machen nicht sicher. Gute Verfahren verwischen jedes statistische Muster.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Wie knackt man Vigenère trotzdem?
    params:
      options:
        - label: Die Schlüssellänge finden, dann jede k-te Stelle wie Caesar per Häufigkeit knacken
          correct: true
        - label: Gar nicht – es ist unknackbar
          feedback: So nannte man es früher, bis Kasiski 1863 eine Methode veröffentlichte.
        - label: Alle Wörterbücher durchprobieren
          feedback: Der Schlüssel muss kein Wort sein.
    hints:
      - Wenn die Schlüssellänge 3 ist – was gilt für jede dritte Stelle?
      - Jede dritte Stelle wurde gleich verschoben.
    explanation: Wiederholte Muster im Geheimtext verraten die Schlüssellänge. Danach zerfällt Vigenère in mehrere Caesar-Rätsel.
    difficulty: 3

  - kind: explain
    id: cs-x2
    depth: 3
    body: "Das **Kerckhoffs-Prinzip**: Ein Verfahren muss sicher bleiben, auch wenn der Gegner alles kennt außer dem Schlüssel. Ein geheimer Algorithmus ist keine Sicherheit – er wird früher oder später bekannt."

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Caesar so leicht zu knacken ist.
    params:
      keywords:
        - - "25"
          - wenige
          - few
          - "26"
        - - probier
          - alle
          - try
          - brute
        - - häufig
          - frequen
          - zählen
          - count
      sample: "Es gibt nur 25 Schlüssel – man kann einfach alle probieren. Außerdem bleiben die Häufigkeiten gleich: Der häufigste Buchstabe ist meist ein verschobenes E."
    difficulty: 3

srs:
  cards_from: [schluessel, anzahl]
