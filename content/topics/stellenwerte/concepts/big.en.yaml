id: math.placevalue.big
type: concept
title: "Big numbers"
summary: "Thousand, million, billion – and why worlds lie between them."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many days do a million seconds last?"
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 11.6
      within: 30
    explanation: "Only about 11 days: 1,000,000 ÷ 86,400 ≈ 11.6."

  - kind: explain
    id: c1
    body: "Every three places form a **group of three**: a thousand has three zeros, a million six, a billion nine. A small gap or comma after each group makes big numbers readable."

  - kind: problem
    id: c2
    widget: match
    prompt: Match each number with its name.
    params:
      pairs:
        - left: "100"
          right: hundred
        - left: 1,000
          right: thousand
        - left: 1,000,000
          right: million
        - left: 1,000,000,000
          right: billion
    hints:
      - Count the groups of three zeros.
      - "One group: thousand. Two: million. Three: …"
    explanation: Every new group of three makes the number a thousand times larger.

  - kind: problem
    id: c3
    widget: choice
    prompt: How many zeros does a million have?
    params:
      options:
        - label: "6"
          correct: true
        - label: "3"
          feedback: That is a thousand.
        - label: "9"
          feedback: That is a billion.
        - label: "7"
          feedback: "Count carefully: 1,000,000 – two groups of three."
    hints:
      - A million is a thousand thousands.
      - 3 zeros + 3 zeros.
    explanation: 1,000 · 1,000 = 1,000,000 – six zeros.

  - kind: problem
    id: c4
    widget: numeric
    prompt: How many thousands are {{m}} million?
    answer:
      value: "{{m * 1000}}"
    feedback:
      - when: numval(state.input) == m * 1000000
        misconception: whole-number
        text: That is the number itself. The question is how many thousands fit into it.
    hints:
      - A million is 1,000 thousands.
      - Work out {{m}} · 1,000.
    explanation: "{{m}} million = {{m}} · 1,000 thousands = {{m * 1000}} thousands."
    variants:
      params:
        m: int[2,9]
      defaults:
        m: 3

  - kind: problem
    id: c5
    widget: estimate
    prompt: Set 370,000 on the line from 0 to 1 million.
    params:
      min: 0
      max: 1000000
      step: 10000
    answer:
      value: 370000
      tolerance: 0
    explanation: 370,000 is a little over a third of the way.

  - kind: explain
    id: d1
    depth: 2
    body: A million seconds is about 11 days. A **billion** seconds is almost 32 years. Between them lies a factor of 1000 – you only feel it in comparisons like this.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: About 8 billion people live on Earth. How many million is that?
    answer:
      value: 8000
    feedback:
      - when: numval(state.input) == 8
        misconception: unit-step
        text: A billion is 1,000 million.
    hints:
      - A billion is how many million?
      - 8 · 1,000.
    explanation: 8 billion = 8 · 1,000 million = 8,000 million.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: order
    prompt: Order from fewest to most.
    params:
      items:
        - label: People in Berlin (around 3.8 million)
        - label: People in Germany (around 84 million)
        - label: People in the EU (around 450 million)
        - label: People on Earth (around 8 billion)
    hints:
      - "Compare the unit first: million or billion?"
      - With the same unit, the number in front decides.
    explanation: 3.8 < 84 < 450 million, and 8 billion is 8,000 million.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: A year has about 31.5 million seconds. How many years do a billion seconds last? Round to whole years.
    answer:
      value: 32
      tolerance: 0.5
    hints:
      - Work out 1,000 million ÷ 31.5 million.
      - "The millions cancel: 1,000 ÷ 31.5."
    explanation: 1,000 ÷ 31.5 ≈ 31.7, so almost 32 years.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Careful when translating: the English **billion** is 10⁹ – in German that is a »Milliarde«. The German »Billion« is a million million, 10¹² – an English trillion."

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: "A German newspaper writes: »Das Projekt kostete 2 Billionen Euro.« How much is that in English?"
    params:
      options:
        - label: 2 trillion euros
          correct: true
        - label: 2 billion euros
          feedback: "False friend: a German »Billion« is a million million."
        - label: 2 million euros
          feedback: Far too little – a million has only six zeros.
    hints:
      - How many zeros does the German »Billion« have?
      - Twelve zeros are called a trillion in English.
    explanation: German »Billion« = 10¹² = English trillion. German »Milliarde« = 10⁹ = English billion.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: How many digits does 10¹² have, a one followed by 12 zeros?
    answer:
      value: 13
    feedback:
      - when: numval(state.input) == 12
        misconception: forgot-one
        text: The one in front is a digit too.
    hints:
      - Count the zeros and the one.
      - 12 zeros + 1.
    explanation: "12 zeros and the leading one: 13 digits."
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why big numbers are written in groups of three.
    params:
      keywords:
        - - drei
          - three
          - gruppe
          - group
        - - tausend
          - thousand
          - million
          - milliarde
          - billion
        - - lesen
          - lesbar
          - read
          - überblick
          - overview
      sample: "Each group of three stands for a new name: thousand, million, billion. With gaps or commas you can count the groups and read the number quickly."
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "c5", "d2"]
