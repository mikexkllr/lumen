id: math.placevalue.big
type: concept
title: "Große Zahlen"
summary: "Tausend, Million, Milliarde – und warum zwischen ihnen Welten liegen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Papierturm
    body: Ein Blatt Papier ist nur 0,1 mm dick. Was passiert, wenn du immer weiter stapelst? Deck die Karten nacheinander auf. Jeder Schritt ist **mal tausend** – und bald reicht der Stapel ins All.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 📄
            front: Tausend Blatt
            back: Der Stapel ist 10 cm hoch – etwa so hoch wie eine Tasse.
          - icon: ⛪
            front: Eine Million Blatt
            back: Schon 100 m – höher als fast jeder Kirchturm.
          - icon: 🚀
            front: Eine Milliarde Blatt
            back: 100 km – der Stapel ragt bis an den Rand des Weltalls.

  - kind: problem
    id: einstieg-tausend
    widget: numeric
    prompt: Auf dem Tisch liegen zehn Hundert-Euro-Scheine. Wie viel Euro sind das zusammen?
    params:
      unit: €
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 110
        misconception: added-factors
        text: Du hast 10 + 100 gerechnet. Es sind aber zehnmal 100.
      - when: numval(state.input) == 100
        misconception: one-group
        text: Das ist ein einzelner Schein. Auf dem Tisch liegen zehn davon.
    hints:
      - "Zähl in Hunderterschritten: 100, 200, 300 und so weiter."
      - Nach neun Scheinen bist du bei 900. Dann kommt noch einer dazu.
    explanation: 10 · 100 = 1 000. Zehn Hunderter sind ein Tausender.

  - kind: problem
    id: einstieg-vergleich
    widget: choice
    prompt: Welche Zahl ist größer?
    params:
      layout: grid
      options:
        - label: 10 000
          correct: true
        - label: 9 999
          feedback: Die vielen Neunen täuschen. 10 000 hat eine Stelle mehr und ist um 1 größer.
    hints:
      - Zähl die Ziffern beider Zahlen.
      - Die Zahl mit mehr Stellen ist größer.
    explanation: 9 999 + 1 = 10 000. Mehr Stellen schlagen große Ziffern.

  - kind: explain
    id: c1
    body: "Je drei Stellen bilden eine **Dreiergruppe**: Tausend hat drei Nullen, eine Million sechs, eine Milliarde neun. Eine kleine Lücke nach jeder Gruppe macht große Zahlen lesbar."

  - kind: problem
    id: c2
    widget: match
    prompt: Verbinde jede Zahl mit ihrem Namen.
    params:
      pairs:
        - left: "100"
          right: Hundert
        - left: 1 000
          right: Tausend
        - left: 1 000 000
          right: Million
        - left: 1 000 000 000
          right: Milliarde
    hints:
      - Zähl die Dreiergruppen aus Nullen.
      - "Eine Gruppe: Tausend. Zwei: Million. Drei: …"
    explanation: Jede neue Dreiergruppe macht die Zahl tausendmal größer.

  - kind: problem
    id: c3
    widget: choice
    prompt: Wie viele Nullen hat eine Million?
    params:
      options:
        - label: "6"
          correct: true
        - label: "3"
          feedback: Das ist Tausend.
        - label: "9"
          feedback: Das ist eine Milliarde.
        - label: "7"
          feedback: "Zähl genau: 1 000 000 – zwei Dreiergruppen."
    hints:
      - Eine Million sind tausend Tausender.
      - 3 Nullen + 3 Nullen.
    explanation: 1 000 · 1 000 = 1 000 000 – sechs Nullen.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Wie viele Tausender sind {{m}} Millionen?
    answer:
      value: "{{m * 1000}}"
    feedback:
      - when: numval(state.input) == m * 1000000
        misconception: whole-number
        text: Das ist die Zahl selbst. Gefragt ist, wie viele Tausender hineinpassen.
    hints:
      - Eine Million sind 1 000 Tausender.
      - Rechne {{m}} · 1 000.
    explanation: "{{m}} Millionen = {{m}} · 1 000 Tausender = {{m * 1000}} Tausender."
    variants:
      params:
        m: int[2,9]
      defaults:
        m: 3

  - kind: problem
    id: c5
    widget: estimate
    prompt: Stell 370 000 auf dem Strahl von 0 bis 1 Million ein.
    params:
      min: 0
      max: 1000000
      step: 10000
    answer:
      value: 370000
      tolerance: 0
    explanation: 370 000 liegt etwas über einem Drittel des Weges.

  - kind: problem
    id: hook
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Tage dauern eine Million Sekunden?"
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 11.6
      within: 30
    explanation: "Nur gut 11 Tage: 1 000 000 : 86 400 ≈ 11,6."

  - kind: explain
    id: d1
    depth: 2
    body: Eine Million Sekunden sind gut 11 Tage. Eine **Milliarde** Sekunden sind fast 32 Jahre. Zwischen beiden liegt der Faktor 1000 – das spürt man erst an solchen Vergleichen.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Auf der Erde leben etwa 8 Milliarden Menschen. Wie viele Millionen sind das?
    answer:
      value: 8000
    feedback:
      - when: numval(state.input) == 8
        misconception: unit-step
        text: Eine Milliarde sind 1 000 Millionen.
    hints:
      - Eine Milliarde sind wie viele Millionen?
      - 8 · 1 000.
    explanation: 8 Milliarden = 8 · 1 000 Millionen = 8 000 Millionen.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: order
    prompt: Ordne von wenig nach viel.
    params:
      items:
        - label: Menschen in Berlin (rund 3,8 Millionen)
        - label: Menschen in Deutschland (rund 84 Millionen)
        - label: Menschen in der EU (rund 450 Millionen)
        - label: Menschen auf der Erde (rund 8 Milliarden)
    hints:
      - "Vergleiche erst die Einheit: Millionen oder Milliarden?"
      - Bei gleicher Einheit entscheidet die Zahl davor.
    explanation: 3,8 < 84 < 450 Millionen, und 8 Milliarden sind 8 000 Millionen.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: Ein Jahr hat rund 31,5 Millionen Sekunden. Wie viele Jahre dauern eine Milliarde Sekunden? Runde auf ganze Jahre.
    answer:
      value: 32
      tolerance: 0.5
    hints:
      - "Rechne 1 000 Millionen : 31,5 Millionen."
      - "Die Millionen kürzen sich: 1 000 : 31,5."
    explanation: "1 000 : 31,5 ≈ 31,7, also fast 32 Jahre."
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Vorsicht beim Übersetzen: Die deutsche **Billion** ist eine Million Millionen, also 10¹². Das englische »billion« ist nur 10⁹ – auf Deutsch eine Milliarde."

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: "In einer US-Zeitung steht: »The project cost 2 billion dollars.« Wie viel ist das auf Deutsch?"
    params:
      options:
        - label: 2 Milliarden Dollar
          correct: true
        - label: 2 Billionen Dollar
          feedback: "Falscher Freund: »billion« ist eine Milliarde."
        - label: 2 Millionen Dollar
          feedback: Viel zu wenig – eine Million hat nur sechs Nullen.
    hints:
      - Wie viele Nullen hat »billion« im Englischen?
      - Neun Nullen heißen auf Deutsch Milliarde.
    explanation: Englisch »billion« = 10⁹ = deutsche Milliarde. Englisch »trillion« = 10¹² = deutsche Billion.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: Wie viele Ziffern hat 10¹², also eine Eins mit 12 Nullen?
    answer:
      value: 13
    feedback:
      - when: numval(state.input) == 12
        misconception: forgot-one
        text: Die Eins vorn ist auch eine Ziffer.
    hints:
      - Zähl die Nullen und die Eins.
      - 12 Nullen + 1.
    explanation: "12 Nullen und die führende Eins: 13 Ziffern."
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man große Zahlen in Dreiergruppen schreibt.
    params:
      keywords:
        - - drei
          - three
          - gruppe
          - group
        - - tausend
          - thousand
          - million
          - milliarde
          - billion
        - - lesen
          - lesbar
          - read
          - überblick
          - overview
      sample: "Jede Dreiergruppe steht für einen neuen Namen: Tausend, Million, Milliarde. Mit Lücken kann man die Gruppen zählen und die Zahl schnell lesen."
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "c5", "d2"]
