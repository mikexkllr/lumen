# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.numberline
type: concept
title: Brüche auf dem Zahlenstrahl
summary: Jeder Bruch hat einen festen Platz zwischen den ganzen Zahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.numberline]
estimated_minutes: 6
steps:
  - kind: problem
    id: haelfte
    widget: numberline
    prompt: Wo liegt 1/2? Setze die Markierung.
    params: { min: 0, max: 1, ticks: 4 }
    answer: { value: "1/2" }
    hints:
      - 1/2 liegt genau in der Mitte zwischen 0 und 1.
    explanation: Die Hälfte liegt genau in der Mitte.

  - kind: explain
    body: |
      Auf dem Zahlenstrahl ist der Weg von 0 bis 1 das Ganze.
      Teilst du ihn in 4 gleiche Stücke, ist jeder Schritt 1/4 lang.
    visual:
      widget: numberline
      params: { min: 0, max: 1, ticks: 4, labels: fractions }

  - kind: problem
    id: drei-viertel
    widget: numberline
    prompt: Setze die Markierung auf 3/4.
    params: { min: 0, max: 1, ticks: 4 }
    answer: { value: "3/4" }
    hints:
      - Jeder Teilstrich ist 1/4 weiter.
      - Gehe von 0 aus 3 Teilstriche nach rechts.
    explanation: 3 Schritte zu je 1/4.

  - kind: problem
    id: ueber-eins
    widget: numberline
    prompt: Setze die Markierung auf 4/3.
    params: { min: 0, max: 2, ticks: 3 }
    answer: { value: "4/3" }
    hints:
      - 3/3 sind genau 1. Ist 4/3 mehr oder weniger als 1?
      - Gehe von der 1 noch einen Drittel-Schritt weiter.
    explanation: 4/3 = 3/3 + 1/3 = 1 + 1/3.

  - kind: problem
    id: platz-variante
    widget: numberline
    prompt: Setze die Markierung auf {{k}}/{{n}}.
    params: { min: 0, max: 1, ticks: "{{n}}" }
    answer: { value: "{{k}}/{{n}}" }
    hints:
      - Das Ganze ist in {{n}} Schritte geteilt.
      - Gehe {{k}} Schritte von der 0 aus.
    explanation: "{{k}} Schritte zu je 1/{{n}}."
    variants:
      params: { n: "choice[3,4,5,6,8]", k: "int[1,7]" }
      constraints: ["k < n"]
      defaults: { n: 5, k: 3 }

  - kind: problem
    id: mitte
    widget: choice
    prompt: Welche Zahl liegt genau in der Mitte zwischen 0 und 1/2?
    params:
      layout: grid
      options:
        - label: "1/4"
          correct: true
        - label: "1/3"
          feedback: 1/3 liegt zwischen 0 und 1/2, aber nicht genau in der Mitte.
        - label: "2/4"
          feedback: 2/4 ist dasselbe wie 1/2 – das ist das Ende der Strecke.
        - label: "1/1"
          feedback: 1/1 ist ein Ganzes. Das liegt rechts von 1/2.
    hints:
      - Was ist die Hälfte von einer Hälfte?
    explanation: Die Hälfte von 1/2 ist 1/4.

  - kind: problem
    id: zehntel
    widget: numberline
    prompt: Setze die Markierung auf 7/10.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: "7/10" }
    hints:
      - Zehntel schreibt man auch als Dezimalzahl.
      - 7/10 = 0,7
    explanation: 7/10 ist dasselbe wie 0,7.

srs:
  cards_from: ["steps[4]"]
