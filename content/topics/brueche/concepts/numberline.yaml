# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.numberline
type: concept
title: Brüche auf dem Zahlenstrahl
summary: Jeder Bruch hat einen festen Platz zwischen den ganzen Zahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.numberline]
estimated_minutes: 13
steps:
  - kind: problem
    id: haelfte
    widget: numberline
    prompt: Wo liegt 1/2? Setze die Markierung.
    params: { min: 0, max: 1, ticks: 4 }
    answer: { value: "1/2" }
    hints:
      - 1/2 liegt genau in der Mitte zwischen 0 und 1.
    explanation: Die Hälfte liegt genau in der Mitte.

  - kind: explain
    id: s2
    body: |
      Auf dem **Zahlenstrahl** ist der Weg von 0 bis 1 das Ganze.
      Teilst du ihn in 4 gleiche Stücke, ist jeder Schritt 1/4 lang.
    visual:
      widget: numberline
      params: { min: 0, max: 1, ticks: 4, labels: fractions }

  - kind: problem
    id: drei-viertel
    widget: numberline
    prompt: Setze die Markierung auf 3/4.
    params: { min: 0, max: 1, ticks: 4 }
    answer: { value: "3/4" }
    hints:
      - Jeder Teilstrich ist 1/4 weiter.
      - Gehe von 0 aus 3 Teilstriche nach rechts.
    explanation: 3 Schritte zu je 1/4.

  - kind: problem
    id: ueber-eins
    widget: numberline
    prompt: Setze die Markierung auf 4/3.
    params: { min: 0, max: 2, ticks: 3 }
    answer: { value: "4/3" }
    hints:
      - 3/3 sind genau 1. Ist 4/3 mehr oder weniger als 1?
      - Gehe von der 1 noch einen Drittel-Schritt weiter.
    explanation: 4/3 = 3/3 + 1/3 = 1 + 1/3.

  - kind: problem
    id: platz-variante
    widget: numberline
    prompt: Setze die Markierung auf {{k}}/{{n}}.
    params: { min: 0, max: 1, ticks: "{{n}}" }
    answer: { value: "{{k}}/{{n}}" }
    hints:
      - Das Ganze ist in {{n}} Schritte geteilt.
      - Gehe {{k}} Schritte von der 0 aus.
    explanation: "{{k}} Schritte zu je 1/{{n}}."
    variants:
      params: { n: "choice[3,4,5,6,8]", k: "int[1,7]" }
      constraints: ["k < n"]
      defaults: { n: 5, k: 3 }

  - kind: problem
    id: mitte
    widget: choice
    prompt: Welche Zahl liegt genau in der Mitte zwischen 0 und 1/2?
    params:
      layout: grid
      options:
        - label: "1/4"
          correct: true
        - label: "1/3"
          feedback: 1/3 liegt zwischen 0 und 1/2, aber nicht genau in der Mitte.
        - label: "2/4"
          feedback: 2/4 ist dasselbe wie 1/2 – das ist das Ende der Strecke.
        - label: "1/1"
          feedback: 1/1 ist ein Ganzes. Das liegt rechts von 1/2.
    hints:
      - Was ist die Hälfte von einer Hälfte?
    explanation: Die Hälfte von 1/2 ist 1/4.

  - kind: problem
    id: zehntel
    widget: numberline
    prompt: Setze die Markierung auf 7/10.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: "7/10" }
    hints:
      - Zehntel schreibt man auch als Dezimalzahl.
      - 7/10 = 0,7
    explanation: 7/10 ist dasselbe wie 0,7.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Auf dem Zahlenstrahl liegt 1/4 [[links]] von 1/2. Ein Bruch mit Zähler größer als Nenner liegt [[rechts]] von der 1.
      distractors:
        - oben
        - genau auf

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Welcher Bruch liegt genau in der Mitte zwischen 1/2 und 1?
    answer:
      value: 3/4
    hints:
      - "Schreib beide als Viertel: 2/4 und 4/4."
    explanation: Zwischen 2/4 und 4/4 liegt 3/4.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numberline
    prompt: Setze die Markierung auf $\frac{5}{3}$.
    params:
      min: 0
      max: 2
      ticks: 3
      labels: fractions
    answer:
      value: 5/3
    hints:
      - Drei Drittel ergeben 1.
      - Von der 1 aus noch zwei Drittel weiter.
    explanation: $\frac{5}{3} = 1\frac{2}{3}$ – zwischen 1 und 2, näher an der 2.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numberline
    prompt: Auch Brüche können negativ sein. Setze die Markierung auf $-\frac{3}{4}$.
    params:
      min: -1
      max: 1
      ticks: 4
      labels: fractions
    answer:
      value: -3/4
    feedback:
      - when: state.value == 0.75
        misconception: sign
        text: Das ist +3/4. Negative Zahlen liegen links der Null.
    hints:
      - Links von der Null.
      - Drei Viertel-Schritte nach links.
    explanation: $-\frac{3}{4}$ ist das Spiegelbild von $\frac{3}{4}$ an der Null.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Welcher Bruch mit dem Nenner 8 liegt zwischen $\frac{1}{4}$ und $\frac{1}{2}$?
    answer:
      value: 3/8
      form: fraction
    hints:
      - Schreib beide in Achteln.
      - $\frac{1}{4} = \frac{2}{8}$ und $\frac{1}{2} = \frac{4}{8}$.
    explanation: Zwischen 2/8 und 4/8 liegt 3/8.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie viele Brüche liegen zwischen 1/4 und 1/2?
    params:
      options:
        - label: Unendlich viele
          correct: true
        - label: Keiner
          feedback: 3/8 liegt zum Beispiel dazwischen.
        - label: Genau einer
          feedback: 3/8 liegt dazwischen – aber auch 5/16 und 7/16.
    hints:
      - Nimm die Mitte von zwei Brüchen. Geht das immer wieder?
    explanation: Zwischen zwei Brüchen liegt immer ein weiterer, etwa ihre Mitte. Die Brüche liegen **dicht**.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Zwischen zwei Brüchen liegt immer ein weiterer, zum Beispiel ihr Mittelwert. Die Brüche liegen **dicht** auf dem Zahlenstrahl. Lücken haben sie trotzdem: √2 ist kein Bruch."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Welcher Bruch liegt genau in der Mitte zwischen $\frac{1}{3}$ und $\frac{1}{2}$?
    answer:
      value: 5/12
    feedback:
      - when: numval(state.input) == 2/5
        misconception: mediant
        text: Zähler plus Zähler, Nenner plus Nenner liegt zwar dazwischen – aber nicht in der Mitte.
    hints:
      - "Mache die Nenner gleich: Sechstel."
      - $\frac{2}{6}$ und $\frac{3}{6}$ – rechne in Zwölfteln.
    explanation: $\frac{4}{12}$ und $\frac{6}{12}$ – die Mitte ist $\frac{5}{12}$.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: "Halbiere immer den Rest bis zur 1: $\\frac{1}{2}, \\frac{3}{4}, \\frac{7}{8}, \\frac{15}{16}, \\ldots$ Welcher Bruch kommt als Nächstes?"
    answer:
      value: 31/32
      form: fraction
    hints:
      - Der Nenner verdoppelt sich.
      - Der Zähler ist immer eins weniger als der Nenner.
    explanation: $\frac{31}{32}$. Die Folge kommt der 1 beliebig nah, erreicht sie aber nie – ein erster Blick auf Grenzwerte.
    difficulty: 3

srs:
  cards_from: ["platz-variante"]
