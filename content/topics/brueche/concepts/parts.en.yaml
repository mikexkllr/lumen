# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.parts
type: concept
title: What a fraction tells you
summary: The denominator divides, the numerator counts.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.part-whole]
estimated_minutes: 15
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of a pizza are 3 of 8 slices?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 37.5
      tolerance: 6
    explanation: 3/8 = 37.5%. A fraction is just another way to write a share.

  - kind: problem
    id: drei-viertel
    widget: fraction
    prompt: Shade 3/4 of the strip. Tap the parts to do so.
    params: { parts: 4 }
    answer: { fraction: "3/4" }
    hints:
      - The strip has 4 equal parts.
      - Shade 3 of them.
    explanation: 3/4 means 3 of 4 equal parts.

  - kind: explain
    id: s2
    body: |
      The **denominator** (bottom) tells you how many equal parts the whole is divided into.
      The **numerator** (top) tells you how many parts you take.
    visual:
      widget: fraction
      params: { parts: 4, shaded: [0, 1, 2] }

  - kind: problem
    id: faerben-variante
    widget: fraction
    prompt: Shade {{k}}/{{n}} of the strip.
    params: { parts: "{{n}}" }
    answer: { fraction: "{{k}}/{{n}}" }
    feedback:
      - when: "shadedCount == n - k && k != n - k"
        misconception: complement
        text: You shaded the parts that should stay empty. You need to shade {{k}} parts.
    hints:
      - The denominator {{n}} tells you how many parts there are.
      - The numerator {{k}} tells you how many to shade.
    explanation: "Shade {{k}} of {{n}} parts."
    variants:
      params: { n: "choice[3,4,5,6,8]", k: "int[1,7]" }
      constraints: ["k < n"]
      defaults: { n: 5, k: 2 }

  - kind: problem
    id: pizza
    widget: fraction
    prompt: Shade 5/8 of the pizza.
    params: { parts: 8, shape: circle }
    answer: { fraction: "5/8" }
    hints:
      - The pizza is cut into 8 equal slices.
    explanation: 5 of 8 slices.

  - kind: problem
    id: ablesen
    widget: choice
    visual:
      widget: fraction
      params: { parts: 6, shaded: [0, 1] }
    prompt: Which fraction is shaded?
    params:
      layout: grid
      options:
        - label: "2/6"
          correct: true
        - label: "2/4"
          feedback: You compared shaded with unshaded parts. The denominator counts all parts.
        - label: "6/2"
          feedback: Numerator and denominator are swapped. The denominator is the number of all parts.
        - label: "4/6"
          feedback: That is the part that is not shaded.
    hints:
      - How many parts does the strip have in total?
    explanation: 2 of 6 parts are shaded, so 2/6.

  - kind: problem
    id: neu-teilen
    widget: fraction
    prompt: It doesn't work with 4 parts. Divide the strip again and shade 1/3.
    params: { parts: 4, partOptions: [2, 3, 4, 6] }
    answer: { fraction: "1/3" }
    hints:
      - 1/3 means dividing the whole into 3 equal parts.
      - At the top, choose "3 parts" and shade one.
    explanation: Divide into 3 parts and shade one. With 6 parts and 2 shaded, it works too.

  - kind: problem
    id: kuchen-rest
    widget: numeric
    prompt: A cake has {{n}} equal pieces. {{k}} pieces have been eaten. What fraction is left?
    params: { placeholder: "e.g. 3/4" }
    answer: { value: "{{n - k}}/{{n}}" }
    feedback:
      - when: "approx(numval(state.input), k / n)"
        misconception: complement
        text: That is the part that was eaten. The question is what is left.
    hints:
      - How many pieces are still there?
      - "{{n}} − {{k}} pieces of {{n}} are left."
    explanation: "{{n - k}} of {{n}} pieces are left: {{n - k}}/{{n}}."
    difficulty: 2
    variants:
      params: { n: "choice[4,5,6,8,10,12]", k: "int[1,3]" }
      constraints: ["k < n", "n != 2 * k"]
      defaults: { n: 8, k: 3 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: In 3/8 the whole is cut into 8 equal parts.
          right: true
        - text: The bigger the denominator, the bigger each piece.
          right: false
          why: More parts means smaller pieces.
        - text: 5/5 is exactly one whole.
          right: true
        - text: The numerator is at the bottom.
          right: false
          why: The numerator is on top and counts the parts.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Three pizzas have 4 slices each. 7 slices are eaten. How many pizzas is that as a fraction?
    params:
      placeholder: e.g. 5/4
    answer:
      value: 7/4
    hints:
      - Each slice is 1/4 of a pizza.
    explanation: 7 slices of 1/4 each make 7/4 – more than one whole. Such fractions are called improper.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "A fraction is also a **division**: $\\frac{3}{4}$ means 3 divided by 4. Share 3 pizzas fairly among 4 children – each gets $\\frac{3}{4}$ of a pizza."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "{{a}} pizzas are shared fairly among {{b}} children. How much pizza does each child get? Give a fraction."
    answer:
      value: "{{a}}/{{b}}"
    feedback:
      - when: numval(state.input) == b / a
        misconception: flipped
        text: "The other way round: the pizzas are being shared, so they go on top."
    hints:
      - Pizzas divided by children.
      - "Write {{a}} : {{b}} as a fraction."
    explanation: "{{a}} : {{b}} = {{a}}/{{b}}. Each child gets one {{b}}th of every pizza – {{a}} pieces of size 1/{{b}}."
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        b: int[3,8]
      constraints:
        - a < b
      defaults:
        a: 3
        b: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numberline
    prompt: "More than a whole: put the marker on $\\frac{5}{4}$."
    params:
      min: 0
      max: 2
      ticks: 4
      labels: fractions
    answer:
      value: 5/4
    hints:
      - 4 quarters make a whole.
      - One quarter past 1.
    explanation: $\frac{5}{4} = 1 + \frac{1}{4}$. Fractions with a numerator bigger than the denominator lie past 1.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Write $2\frac{1}{3}$ as a single fraction.
    answer:
      value: 7/3
      form: fraction
    feedback:
      - when: numval(state.input) == 2/3
        misconception: mixed-as-product
        text: $2\frac{1}{3}$ means 2 plus 1/3, not 2 times 1/3.
      - when: numval(state.input) == 3/3
        misconception: wholes-as-units
        text: Two wholes are 6 thirds, not 2.
    hints:
      - How many thirds are 2 wholes?
      - 6 thirds plus 1 third.
    explanation: $2 = \frac{6}{3}$, so $2\frac{1}{3} = \frac{6}{3} + \frac{1}{3} = \frac{7}{3}$.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A strip is cut into 2 **unequal** parts. The smaller one is shaded. Is that 1/2?
    params:
      options:
        - label: No – the parts must be equal in size
          correct: true
        - label: Yes – it is 1 of 2 parts
          feedback: Counting alone is not enough. A fraction requires equal parts.
        - label: You can never know
          feedback: "You can: the smaller part is surely less than half."
    hints:
      - What does the denominator demand of the parts?
    explanation: The denominator counts equal parts. The smaller piece is less than 1/2.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux in a sentence or two: what do numerator and denominator say?"
    params:
      keywords:
        - - nenner
          - denominator
        - - zähler
          - numerator
        - - teil
          - stück
          - part
          - piece
          - slice
      sample: The denominator says into how many equal parts the whole is cut. The numerator says how many of those parts are meant.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Every number that can be written as a fraction of integers is called **rational**. That includes $5 = \frac{5}{1}$, $-\frac{2}{3}$ and $0.75 = \frac{3}{4}$.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: swipe
    prompt: Rational or not?
    params:
      cards:
        - text: "0.75"
          right: true
          why: 0.75 = 3/4.
        - text: −4
          right: true
          why: −4 = −4/1.
        - text: 0,333…
          right: true
          why: That is exactly 1/3.
        - text: √2
          right: false
          why: No fraction hits √2 exactly – that is proven.
        - text: π
          right: false
          why: π is not rational.
      left: not rational
      right: rational
    hints:
      - Can you write the number as a/b?
      - Whole numbers have denominator 1.
    explanation: Terminating and repeating decimals are rational. √2 and π are not – they are irrational.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: $\frac{6}{0} = x$ would mean $x \cdot 0 = 6$. What follows?
    params:
      options:
        - label: $0 \cdot 0 = 0$, not 6.
          feedback: $0 \cdot 0 = 0$, nicht 6.
        - label: $6 \cdot 0 = 0$, not 6.
          feedback: $6 \cdot 0 = 0$, nicht 6.
        - label: No x works – so 6/0 is undefined
          correct: true
        - label: ∞ is not a number you can calculate with like this.
          feedback: ∞ ist keine Zahl, mit der man so rechnen kann.
    hints:
      - What does any number times 0 give?
      - Can that ever be 6?
    explanation: Any number times 0 is 0. No x satisfies $x \cdot 0 = 6$. So a denominator can never be 0.
    difficulty: 3

srs:
  cards_from: ["faerben-variante", "kuchen-rest"]
