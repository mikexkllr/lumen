id: math.fractions.add
type: concept
title: Brüche addieren
summary: Gleiche Nenner zählen, ungleiche erst gleich machen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.add]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Halb plus Viertel
    body: Ein halbes Brot plus ein Viertel – wie viel ist das? Das Quadrat ist in Hälften geteilt. Ein Viertel passt da nicht hinein. Teile es in 4 Teile und färbe beides. Erst **gleich große Stücke** lassen sich zählen.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 2
        shape: square
        shaded:
          - 0
        partOptions:
          - 2
          - 4
          - 8

  - kind: problem
    id: viertel-plus
    widget: fraction
    prompt: Färbe 1/4 und dann noch 2/4. Wie viel ist das zusammen?
    params: { parts: 4 }
    answer: { fraction: "3/4" }
    hints:
      - Erst ein Viertel, dann zwei weitere Viertel färben.
    explanation: 1 Viertel plus 2 Viertel sind 3 Viertel.

  - kind: explain
    id: s2
    body: |
      Gleiche Nenner? Dann zählst du nur die **Zähler** zusammen: $\frac{1}{4} + \frac{2}{4} = \frac{3}{4}$.
      Der Nenner bleibt, denn die Stücke werden nicht kleiner.

  - kind: problem
    id: gleichnamig
    widget: numeric
    prompt: 'Rechne: $\frac{ {{a}} }{ {{n}} } + \frac{ {{b}} }{ {{n}} }$'
    params: { placeholder: "z. B. 3/4" }
    answer: { value: "{{a + b}}/{{n}}" }
    feedback:
      - when: "approx(numval(state.input), (a + b) / (2 * n))"
        misconception: add-denominators
        text: Du hast auch die Nenner addiert. Die Stückgröße bleibt gleich – nur die Anzahl der Stücke ändert sich.
    hints:
      - Die Nenner sind gleich. Was passiert mit den Zählern?
      - "{{a}} + {{b}} Stücke von je 1/{{n}}."
    explanation: "{{a}}/{{n}} + {{b}}/{{n}} = {{a + b}}/{{n}}."
    variants:
      params: { n: "choice[5,7,8,9,11]", a: "int[1,4]", b: "int[1,4]" }
      constraints: ["a + b < n"]
      defaults: { n: 7, a: 2, b: 3 }

  - kind: problem
    id: halb-drittel
    widget: choice
    prompt: Was ergibt 1/2 + 1/3?
    params:
      layout: grid
      options:
        - { label: "5/6", correct: true }
        - { label: "2/5", feedback: "Zähler plus Zähler und Nenner plus Nenner – so geht es nicht. 2/5 ist sogar kleiner als 1/2!" }
        - { label: "2/6", feedback: "2/6 ist ein Drittel – weniger als 1/2 allein." }
        - { label: "1/5", feedback: "Das Ergebnis muss größer als 1/2 sein." }
    hints:
      - Mach die Nenner gleich. 6 passt für 2 und 3.
    explanation: 1/2 = 3/6 und 1/3 = 2/6. Zusammen 5/6.

  - kind: explain
    id: s5
    body: |
      Verschiedene Nenner? Erst **gleichnamig** machen, dann addieren:
      $\frac{1}{2} + \frac{1}{3} = \frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.

  - kind: problem
    id: stammbrueche-plus
    widget: numeric
    prompt: 'Rechne: $\frac{1}{ {{a}} } + \frac{1}{ {{b}} }$'
    params: { placeholder: "z. B. 3/4" }
    answer: { value: "{{a + b}}/{{a * b}}" }
    feedback:
      - when: "approx(numval(state.input), 2 / (a + b))"
        misconception: add-denominators
        text: Zähler plus Zähler und Nenner plus Nenner geht nicht. Mach die Nenner erst gleich – {{a * b}} passt.
    hints:
      - "Gemeinsamer Nenner: {{a}} · {{b}} = {{a * b}}."
      - "1/{{a}} = {{b}}/{{a * b}} und 1/{{b}} = {{a}}/{{a * b}}."
    explanation: "{{b}}/{{a * b}} + {{a}}/{{a * b}} = {{a + b}}/{{a * b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3,4]", b: "choice[3,5,7]" }
      constraints: ["a != b", "gcd(a, b) == 1"]
      defaults: { a: 2, b: 5 }

  - kind: problem
    id: minus
    widget: numeric
    prompt: 'Rechne: $\frac{3}{4} - \frac{1}{8}$'
    params: { placeholder: "z. B. 1/2" }
    answer: { value: "5/8" }
    feedback:
      - when: "approx(numval(state.input), 2 / 4)"
        misconception: subtract-denominators
        text: Du hast Zähler und Nenner getrennt abgezogen. Mach die Nenner erst gleich – Achtel passen.
    hints:
      - 3/4 sind wie viele Achtel?
      - 3/4 = 6/8.
    explanation: 6/8 − 1/8 = 5/8.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 1/2 + 1/3 = 2/5
          right: false
          why: Nenner nie addieren. Richtig ist 5/6.
        - text: 2/7 + 3/7 = 5/7
          right: true
        - text: Vor dem Addieren müssen die Nenner gleich sein.
          right: true
        - text: 3/4 − 1/4 = 2/0
          right: false
          why: "Der Nenner bleibt: 2/4, also 1/2."

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: "Rechne mit dem Sechseck: Färbe $\\frac{1}{2} + \\frac{1}{6}$."
    params:
      parts: 6
      shape: hexagon
    answer:
      fraction: 2/3
    hints:
      - Die Hälfte des Sechsecks sind 3 der 6 Teile.
      - Ein Sechstel ist 1 Teil. Färbe also $3 + 1 = 4$ Teile.
    explanation: $\frac{3}{6} + \frac{1}{6} = \frac{4}{6} = \frac{2}{3}$.

  - kind: problem
    id: intro-c2
    widget: fraction
    prompt: Färbe $\frac{1}{3} + \frac{1}{6}$ des Dreiecks. Teile es vorher passend.
    params:
      parts: 3
      shape: triangle
      partOptions:
        - 3
        - 6
    answer:
      fraction: 1/2
    hints:
      - Sechstel passen nicht in Drittel. Teile das Dreieck in 6 Teile.
      - $\frac{1}{3}$ sind 2 Sechstel. Färbe $2 + 1 = 3$ Teile.
    explanation: $\frac{2}{6} + \frac{1}{6} = \frac{3}{6} = \frac{1}{2}$ – die Hälfte des Dreiecks.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne und kürze: $\\frac{5}{6} + \\frac{3}{4}$"
    answer:
      value: 19/12
    feedback:
      - when: approx(numval(state.input), 8 / 10)
        misconception: add-denominators
        text: Du hast Zähler und Nenner getrennt addiert. Mach erst die Nenner gleich.
    hints:
      - Der kleinste gemeinsame Nenner von 6 und 4 ist 12.
      - 5/6 = 10/12 und 3/4 = 9/12.
    explanation: 10/12 + 9/12 = 19/12. Das kleinste gemeinsame Vielfache spart Kürzen.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numberline
    prompt: "Springe auf dem Zahlenstrahl: erst $\\frac{2}{3}$, dann noch $\\frac{1}{2}$. Wo landest du?"
    params:
      min: 0
      max: 2
      ticks: 6
      labels: fractions
    answer:
      value: 7/6
    hints:
      - Die Striche sind Sechstel.
      - $\frac{2}{3} = \frac{4}{6}$ und $\frac{1}{2} = \frac{3}{6}$.
    explanation: $\frac{4}{6} + \frac{3}{6} = \frac{7}{6}$ – etwas mehr als 1.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Rechne: $\\frac{1}{ {{a}} } - \\frac{1}{ {{b}} }$"
    answer:
      value: "{{b - a}}/{{a * b}}"
    feedback:
      - when: numval(state.input) == 0
        misconception: numerators-only
        text: Gleiche Zähler heißt nicht gleich groß. 1/{{a}} ist größer.
    hints:
      - "Gemeinsamer Nenner: {{a * b}}."
      - $\frac{ {{b}} }{ {{a * b}} } - \frac{ {{a}} }{ {{a * b}} }$
    explanation: $\frac{ {{b}} }{ {{a * b}} } - \frac{ {{a}} }{ {{a * b}} } = \frac{ {{b - a}} }{ {{a * b}} }$.
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        b: int[3,9]
      constraints:
        - a < b
      defaults:
        a: 3
        b: 5

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: Lena rechnet $\frac{1}{2} + \frac{1}{3} = \frac{2}{5}$. Woran siehst du sofort, dass das falsch ist?
    params:
      options:
        - label: 2/5 ist kleiner als 1/2 – die Summe muss größer sein
          correct: true
        - label: 2/5 lässt sich nicht kürzen
          feedback: Das sagt nichts über richtig oder falsch.
        - label: Der Nenner 5 ist ungerade
          feedback: Ungerade Nenner sind erlaubt.
    hints:
      - "Schätze: Ist 2/5 mehr oder weniger als eine Hälfte?"
      - Wenn man etwas dazutut, wird es mehr.
    explanation: 1/2 + 1/3 muss mehr als 1/2 sein. 2/5 = 0,4 ist aber weniger. Richtig ist 5/6.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Die alten Ägypter schrieben Brüche als Summe von Stammbrüchen: $\\frac{3}{4} = \\frac{1}{2} + \\frac{1}{?}$"
    answer:
      value: 4
    hints:
      - Was fehlt von 1/2 bis 3/4?
    explanation: 3/4 − 1/2 = 1/4. Jeder Bruch lässt sich so als Summe verschiedener Stammbrüche schreiben.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum darf man bei 1/2 + 1/3 nicht einfach die Nenner addieren?"
    params:
      keywords:
        - - nenner
          - denominator
        - - gleich
          - same
          - equal
          - common
        - - stück
          - teil
          - größe
          - piece
          - part
          - size
      sample: Der Nenner sagt, wie groß die Stücke sind. Halbe und Drittel sind verschieden groß, also muss man sie erst in gleich große Stücke umrechnen, zum Beispiel Sechstel.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Der kleinste gemeinsame Nenner ist das **kgV** der Nenner. Bei $\frac{1}{6} + \frac{1}{8}$ reicht 24 statt 48. Kleinere Zahlen, weniger Kürzen.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Rechne mit dem kleinsten Nenner: $\\frac{1}{6} + \\frac{1}{8}$"
    answer:
      value: 7/24
      form: simplified
    feedback:
      - when: numval(state.input) == 2/14
        misconception: add-denominators
        text: Nenner werden nicht addiert.
    hints:
      - kgV(6, 8) = 24.
      - $\frac{4}{24} + \frac{3}{24}$
    explanation: $\frac{4}{24} + \frac{3}{24} = \frac{7}{24}$.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: "Ein Trick: $\\frac{1}{n(n+1)} = \\frac{1}{n} - \\frac{1}{n+1}$. Rechne $\\frac{1}{1 \\cdot 2} + \\frac{1}{2 \\cdot 3} + \\frac{1}{3 \\cdot 4} + \\frac{1}{4 \\cdot 5}$."
    answer:
      value: 4/5
    hints:
      - Schreib jeden Summanden als Differenz.
      - $(1 - \frac{1}{2}) + (\frac{1}{2} - \frac{1}{3}) + \ldots$ – fast alles hebt sich weg.
    explanation: Übrig bleibt $1 - \frac{1}{5} = \frac{4}{5}$. Solche »Teleskopsummen« tauchen später bei Reihen wieder auf.
    difficulty: 3

srs:
  cards_from: ["gleichnamig", "stammbrueche-plus"]
