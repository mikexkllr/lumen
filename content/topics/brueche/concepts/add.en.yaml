id: math.fractions.add
type: concept
title: Adding fractions
summary: Count equal denominators. Make unequal ones equal first.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.add]
estimated_minutes: 8
steps:
  - kind: problem
    id: viertel-plus
    widget: fraction
    prompt: Shade 1/4 and then another 2/4. How much is that together?
    params: { parts: 4 }
    answer: { fraction: "3/4" }
    hints:
      - First shade one fourth, then two more fourths.
    explanation: 1 fourth plus 2 fourths is 3 fourths.

  - kind: explain
    body: |
      Same denominators? Then you just add the **numerators**: $\frac{1}{4} + \frac{2}{4} = \frac{3}{4}$.
      The denominator stays, because the pieces don't get smaller.

  - kind: problem
    id: gleichnamig
    widget: numeric
    prompt: 'Calculate: $\frac{ {{a}} }{ {{n}} } + \frac{ {{b}} }{ {{n}} }$'
    params: { placeholder: "e.g. 3/4" }
    answer: { value: "{{a + b}}/{{n}}" }
    feedback:
      - when: "approx(numval(state.input), (a + b) / (2 * n))"
        misconception: add-denominators
        text: You added the denominators too. The piece size stays the same. Only the number of pieces changes.
    hints:
      - The denominators are equal. What happens to the numerators?
      - "{{a}} + {{b}} pieces of 1/{{n}} each."
    explanation: "{{a}}/{{n}} + {{b}}/{{n}} = {{a + b}}/{{n}}."
    variants:
      params: { n: "choice[5,7,8,9,11]", a: "int[1,4]", b: "int[1,4]" }
      constraints: ["a + b < n"]
      defaults: { n: 7, a: 2, b: 3 }

  - kind: problem
    id: halb-drittel
    widget: choice
    prompt: What is 1/2 + 1/3?
    params:
      layout: grid
      options:
        - { label: "5/6", correct: true }
        - { label: "2/5", feedback: "Numerator plus numerator and denominator plus denominator doesn't work. 2/5 is even smaller than 1/2!" }
        - { label: "2/6", feedback: "2/6 is one third – less than 1/2 alone." }
        - { label: "1/5", feedback: "The result must be larger than 1/2." }
    hints:
      - Make the denominators equal. 6 works for 2 and 3.
    explanation: 1/2 = 3/6 and 1/3 = 2/6. Together that is 5/6.

  - kind: explain
    body: |
      Unequal denominators? Make them equal first. Then add:
      $\frac{1}{2} + \frac{1}{3} = \frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.

  - kind: problem
    id: stammbrueche-plus
    widget: numeric
    prompt: 'Calculate: $\frac{1}{ {{a}} } + \frac{1}{ {{b}} }$'
    params: { placeholder: "e.g. 3/4" }
    answer: { value: "{{a + b}}/{{a * b}}" }
    feedback:
      - when: "approx(numval(state.input), 2 / (a + b))"
        misconception: add-denominators
        text: You can't add the denominators. Make them equal first. {{a * b}} works.
    hints:
      - "Shared denominator: {{a}} · {{b}} = {{a * b}}."
      - "1/{{a}} = {{b}}/{{a * b}} and 1/{{b}} = {{a}}/{{a * b}}."
    explanation: "{{b}}/{{a * b}} + {{a}}/{{a * b}} = {{a + b}}/{{a * b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3,4]", b: "choice[3,5,7]" }
      constraints: ["a != b", "gcd(a, b) == 1"]
      defaults: { a: 2, b: 5 }

  - kind: problem
    id: minus
    widget: numeric
    prompt: 'Calculate: $\frac{3}{4} - \frac{1}{8}$'
    params: { placeholder: "e.g. 1/2" }
    answer: { value: "5/8" }
    feedback:
      - when: "approx(numval(state.input), 2 / 4)"
        misconception: subtract-denominators
        text: You subtracted numerators and denominators separately. Make the denominators equal first. Eighths work.
    hints:
      - How many eighths is 3/4?
      - 3/4 = 6/8.
    explanation: 6/8 − 1/8 = 5/8.
    difficulty: 2

srs:
  cards_from: ["steps[2]", "steps[5]"]
