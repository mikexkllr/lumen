id: math.fractions.add
type: concept
title: Adding fractions
summary: Count equal denominators. Make unequal ones equal first.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.add]
estimated_minutes: 14
steps:
  - kind: problem
    id: viertel-plus
    widget: fraction
    prompt: Shade 1/4 and then another 2/4. How much is that together?
    params: { parts: 4 }
    answer: { fraction: "3/4" }
    hints:
      - First shade one fourth, then two more fourths.
    explanation: 1 fourth plus 2 fourths is 3 fourths.

  - kind: explain
    id: s2
    body: |
      Same denominators? Then you just add the **numerators**: $\frac{1}{4} + \frac{2}{4} = \frac{3}{4}$.
      The denominator stays, because the pieces don't get smaller.

  - kind: problem
    id: gleichnamig
    widget: numeric
    prompt: 'Calculate: $\frac{ {{a}} }{ {{n}} } + \frac{ {{b}} }{ {{n}} }$'
    params: { placeholder: "e.g. 3/4" }
    answer: { value: "{{a + b}}/{{n}}" }
    feedback:
      - when: "approx(numval(state.input), (a + b) / (2 * n))"
        misconception: add-denominators
        text: You added the denominators too. The piece size stays the same. Only the number of pieces changes.
    hints:
      - The denominators are equal. What happens to the numerators?
      - "{{a}} + {{b}} pieces of 1/{{n}} each."
    explanation: "{{a}}/{{n}} + {{b}}/{{n}} = {{a + b}}/{{n}}."
    variants:
      params: { n: "choice[5,7,8,9,11]", a: "int[1,4]", b: "int[1,4]" }
      constraints: ["a + b < n"]
      defaults: { n: 7, a: 2, b: 3 }

  - kind: problem
    id: halb-drittel
    widget: choice
    prompt: What is 1/2 + 1/3?
    params:
      layout: grid
      options:
        - { label: "5/6", correct: true }
        - { label: "2/5", feedback: "Numerator plus numerator and denominator plus denominator doesn't work. 2/5 is even smaller than 1/2!" }
        - { label: "2/6", feedback: "2/6 is one third – less than 1/2 alone." }
        - { label: "1/5", feedback: "The result must be larger than 1/2." }
    hints:
      - Make the denominators equal. 6 works for 2 and 3.
    explanation: 1/2 = 3/6 and 1/3 = 2/6. Together that is 5/6.

  - kind: explain
    id: s5
    body: |
      Unequal **denominators**? Make them equal first. Then add:
      $\frac{1}{2} + \frac{1}{3} = \frac{3}{6} + \frac{2}{6} = \frac{5}{6}$.

  - kind: problem
    id: stammbrueche-plus
    widget: numeric
    prompt: 'Calculate: $\frac{1}{ {{a}} } + \frac{1}{ {{b}} }$'
    params: { placeholder: "e.g. 3/4" }
    answer: { value: "{{a + b}}/{{a * b}}" }
    feedback:
      - when: "approx(numval(state.input), 2 / (a + b))"
        misconception: add-denominators
        text: You can't add the denominators. Make them equal first. {{a * b}} works.
    hints:
      - "Shared denominator: {{a}} · {{b}} = {{a * b}}."
      - "1/{{a}} = {{b}}/{{a * b}} and 1/{{b}} = {{a}}/{{a * b}}."
    explanation: "{{b}}/{{a * b}} + {{a}}/{{a * b}} = {{a + b}}/{{a * b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3,4]", b: "choice[3,5,7]" }
      constraints: ["a != b", "gcd(a, b) == 1"]
      defaults: { a: 2, b: 5 }

  - kind: problem
    id: minus
    widget: numeric
    prompt: 'Calculate: $\frac{3}{4} - \frac{1}{8}$'
    params: { placeholder: "e.g. 1/2" }
    answer: { value: "5/8" }
    feedback:
      - when: "approx(numval(state.input), 2 / 4)"
        misconception: subtract-denominators
        text: You subtracted numerators and denominators separately. Make the denominators equal first. Eighths work.
    hints:
      - How many eighths is 3/4?
      - 3/4 = 6/8.
    explanation: 6/8 − 1/8 = 5/8.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 1/2 + 1/3 = 2/5
          right: false
          why: Never add denominators. The answer is 5/6.
        - text: 2/7 + 3/7 = 5/7
          right: true
        - text: Before adding, the denominators must match.
          right: true
        - text: 3/4 − 1/4 = 2/0
          right: false
          why: "The denominator stays: 2/4, which is 1/2."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Compute and simplify: $\\frac{5}{6} + \\frac{3}{4}$"
    answer:
      value: 19/12
    feedback:
      - when: approx(numval(state.input), 8 / 10)
        misconception: add-denominators
        text: You added numerators and denominators separately. Make the denominators equal first.
    hints:
      - The least common denominator of 6 and 4 is 12.
      - 5/6 = 10/12 and 3/4 = 9/12.
    explanation: 10/12 + 9/12 = 19/12. The least common multiple saves simplifying.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numberline
    prompt: "Jump along the number line: first $\\frac{2}{3}$, then another $\\frac{1}{2}$. Where do you land?"
    params:
      min: 0
      max: 2
      ticks: 6
      labels: fractions
    answer:
      value: 7/6
    hints:
      - The ticks are sixths.
      - $\frac{2}{3} = \frac{4}{6}$ and $\frac{1}{2} = \frac{3}{6}$.
    explanation: $\frac{4}{6} + \frac{3}{6} = \frac{7}{6}$ – a bit more than 1.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Calculate: $\\frac{1}{ {{a}} } - \\frac{1}{ {{b}} }$"
    answer:
      value: "{{b - a}}/{{a * b}}"
    feedback:
      - when: numval(state.input) == 0
        misconception: numerators-only
        text: Equal numerators do not mean equal size. 1/{{a}} is bigger.
    hints:
      - "Common denominator: {{a * b}}."
      - $\frac{ {{b}} }{ {{a * b}} } - \frac{ {{a}} }{ {{a * b}} }$
    explanation: $\frac{ {{b}} }{ {{a * b}} } - \frac{ {{a}} }{ {{a * b}} } = \frac{ {{b - a}} }{ {{a * b}} }$.
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        b: int[3,9]
      constraints:
        - a < b
      defaults:
        a: 3
        b: 5

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: Lena computes $\frac{1}{2} + \frac{1}{3} = \frac{2}{5}$. How can you tell at once that it is wrong?
    params:
      options:
        - label: 2/5 is less than 1/2 – the sum must be bigger
          correct: true
        - label: That says nothing about right or wrong.
          feedback: Das sagt nichts über richtig oder falsch.
        - label: Odd denominators are allowed.
          feedback: Ungerade Nenner sind erlaubt.
    hints:
      - "Estimate: is 2/5 more or less than one half?"
      - If you add something, it gets bigger.
    explanation: 1/2 + 1/3 must be more than 1/2. But 2/5 = 0.4 is less. The right answer is 5/6.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The ancient Egyptians wrote fractions as sums of unit fractions: $\\frac{3}{4} = \\frac{1}{2} + \\frac{1}{?}$"
    answer:
      value: 4
    hints:
      - What is missing from 1/2 to 3/4?
    explanation: 3/4 − 1/2 = 1/4. Every fraction can be written as a sum of distinct unit fractions.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why can you not simply add the denominators in 1/2 + 1/3?"
    params:
      keywords:
        - - nenner
          - denominator
        - - gleich
          - same
          - equal
          - common
        - - stück
          - teil
          - größe
          - piece
          - part
          - size
      sample: The denominator tells the size of the pieces. Halves and thirds differ in size, so you first convert them into equal pieces, for example sixths.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: The least common denominator is the **lcm** of the denominators. For $\frac{1}{6} + \frac{1}{8}$, 24 is enough instead of 48. Smaller numbers, less simplifying.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Use the smallest denominator: $\\frac{1}{6} + \\frac{1}{8}$"
    answer:
      value: 7/24
      form: simplified
    feedback:
      - when: numval(state.input) == 2/14
        misconception: add-denominators
        text: Denominators are not added.
    hints:
      - lcm(6, 8) = 24.
      - $\frac{4}{24} + \frac{3}{24}$
    explanation: $\frac{4}{24} + \frac{3}{24} = \frac{7}{24}$.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: "A trick: $\\frac{1}{n(n+1)} = \\frac{1}{n} - \\frac{1}{n+1}$. Work out $\\frac{1}{1 \\cdot 2} + \\frac{1}{2 \\cdot 3} + \\frac{1}{3 \\cdot 4} + \\frac{1}{4 \\cdot 5}$."
    answer:
      value: 4/5
    hints:
      - Write each term as a difference.
      - $(1 - \frac{1}{2}) + (\frac{1}{2} - \frac{1}{3}) + \ldots$ – almost everything cancels.
    explanation: What remains is $1 - \frac{1}{5} = \frac{4}{5}$. Such »telescoping sums« come back later with series.
    difficulty: 3

srs:
  cards_from: ["gleichnamig", "stammbrueche-plus"]
