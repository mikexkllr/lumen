# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.compare
type: concept
title: Comparing fractions
summary: Bigger numbers don't automatically make a bigger fraction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.compare]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: More pieces, more cake?
    body: Tom gets 5 of 12 pieces, Ana gets half. Who has more? Look at the five twelfths. Then split the hexagon into 2 parts and shade one half. **Big numbers** can fool you.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 12
        shape: hexagon
        shaded:
          - 0
          - 1
          - 2
          - 3
          - 4
        partOptions:
          - 2
          - 3
          - 12

  - kind: problem
    id: pizza-vergleich
    widget: choice
    prompt: Which is more – 1/3 or 1/4 of a pizza?
    params:
      options:
        - label: "1/3"
          correct: true
        - label: "1/4"
          feedback: 4 is bigger than 3. But cut into 4 parts, the pieces are smaller.
        - label: Both are equal
          feedback: Try it. Cut one pizza into 3 pieces and one into 4. The pieces are different sizes.
    hints:
      - Imagine the pizza is shared among 3 people or among 4.
    explanation: The more parts, the smaller each part. 1/3 is more than 1/4.

  - kind: explain
    id: s2
    body: |
      Same top? Then the **smaller** bottom wins. Its parts are big.
      Same bottom? Then the larger top wins.
      (Top = numerator, bottom = denominator.)

  - kind: problem
    id: stammbrueche
    widget: order
    prompt: Sort from smallest to largest.
    params:
      direction: horizontal
      items: [{ label: "1/8" }, { label: "1/4" }, { label: "1/3" }, { label: "1/2" }]
      startLabel: small
      endLabel: large
    hints:
      - The numerator is 1 each time. Which denominator gives the smallest pieces?
    explanation: The larger the denominator, the smaller the piece.

  - kind: problem
    id: gleicher-nenner
    widget: order
    prompt: Sort from smallest to largest.
    params:
      direction: horizontal
      items: [{ label: "2/7" }, { label: "3/7" }, { label: "5/7" }, { label: "6/7" }]
      startLabel: small
      endLabel: large
    hints:
      - All pieces are the same size. Count how many there are in each.
    explanation: Same denominator – the numerator decides.

  - kind: explain
    id: s5
    body: |
      Different numerators and **denominators**? Make the denominators equal.
      $\frac{2}{3}$ and $\frac{3}{4}$ become $\frac{8}{12}$ and $\frac{9}{12}$. Now you can see that 3/4 is larger.

  - kind: problem
    id: drei-fuenftel
    widget: choice
    prompt: Which fraction is larger – 3/5 or 2/3?
    params:
      options:
        - label: "2/3"
          correct: true
        - label: "3/5"
          feedback: Bigger numbers don't make a bigger fraction. Convert both to fifteenths – 9/15 and 10/15.
        - label: Both are equal
          feedback: Convert to fifteenths. Then you see 9/15 and 10/15.
    hints:
      - Find a common denominator. 15 works for 5 and 3.
      - "3/5 = 9/15 and 2/3 = 10/15."
    explanation: 10/15 is more than 9/15, so 2/3 is larger.
    difficulty: 2

  - kind: problem
    id: groesserer-markieren
    widget: numberline
    prompt: Put the marker on the larger of the two fractions, 5/6 and 3/4.
    params: { min: 0, max: 1, ticks: 12, labels: none, markers: [{ value: 0, label: "0" }, { value: 1, label: "1" }] }
    answer: { value: "5/6" }
    hints:
      - "The line is divided into twelfths. 5/6 = ?/12 and 3/4 = ?/12."
      - "5/6 = 10/12 and 3/4 = 9/12."
    explanation: 5/6 = 10/12 is larger than 3/4 = 9/12.
    difficulty: 2

  - kind: problem
    id: vergleich-variante
    widget: choice
    prompt: Which fraction is larger?
    params:
      shuffle: true
      options:
        - label: "{{a}}/{{b}}"
          correct: "{{a * d > c * b}}"
        - label: "{{c}}/{{d}}"
          correct: "{{c * b > a * d}}"
        - label: Both are equal
          correct: false
    hints:
      - Make the denominators equal. {{b * d}} works for {{b}} and {{d}}.
      - "{{a}}/{{b}} = {{a * d}}/{{b * d}} and {{c}}/{{d}} = {{c * b}}/{{b * d}}."
    explanation: "Rewritten with denominator {{b * d}}: {{a * d}}/{{b * d}} and {{c * b}}/{{b * d}}."
    variants:
      params: { a: "int[1,5]", b: "int[2,9]", c: "int[1,5]", d: "int[2,9]" }
      constraints: ["a < b", "c < d", "a * d != c * b", "b != d"]
      defaults: { a: 3, b: 5, c: 2, d: 3 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: With equal numerators the fraction with the [[smaller]] denominator is bigger. With equal denominators the [[larger]] numerator wins.
      distractors:
        - even

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Which is more – $\frac{2}{3}$ or $\frac{5}{9}$ of the triangle? Shade the larger fraction.
    params:
      parts: 9
      shape: triangle
      partOptions:
        - 3
        - 9
    answer:
      fraction: 2/3
    hints:
      - "Make the denominators equal: how many ninths is $\\frac{2}{3}$?"
      - $\frac{2}{3} = \frac{6}{9}$, and 6 ninths are more than 5. Shade 6 parts.
    explanation: $\frac{2}{3} = \frac{6}{9}$ is larger than $\frac{5}{9}$. With the same denominator, the bigger numerator wins.

  - kind: problem
    id: intro-c2
    widget: fraction
    prompt: Shade more than half, but less than $\frac{2}{3}$ of the square.
    params:
      parts: 12
      shape: square
    answer:
      fraction: 7/12
    hints:
      - How many twelfths are a half? And how many are $\frac{2}{3}$?
      - $\frac{1}{2} = \frac{6}{12}$ and $\frac{2}{3} = \frac{8}{12}$. Only 7 twelfths fit in between.
    explanation: $\frac{7}{12}$ lies between $\frac{6}{12}$ and $\frac{8}{12}$, so between $\frac{1}{2}$ and $\frac{2}{3}$.

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: Sort from smallest to largest – no calculator.
    params:
      items:
        - label: 3/8
        - label: 5/12
        - label: 1/2
        - label: 7/12
        - label: 2/3
      startLabel: small
      endLabel: large
    hints:
      - Compare each with 1/2 – or use the denominator 24.
    explanation: "In twenty-fourths: 9, 10, 12, 14 and 16."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "Which fraction is closer to 1: $\\frac{7}{8}$ or $\\frac{9}{10}$? Enter it."
    answer:
      value: 9/10
    feedback:
      - when: numval(state.input) == 7/8
        misconception: bigger-denominator
        text: 7/8 is one eighth short of 1. 9/10 is only one tenth short.
    hints:
      - What is missing to a whole in each case?
      - Is 1/8 or 1/10 smaller?
    explanation: The gap 1/10 is smaller than 1/8. So 9/10 is closer to 1 and larger.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "The **gap to one** helps you compare: $\\frac{7}{8}$ is $\\frac{1}{8}$ short of a whole, $\\frac{9}{10}$ only $\\frac{1}{10}$. Smaller gap, bigger fraction."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Less or more than $\frac{1}{2}$?
    params:
      buckets:
        - id: b1
          label: less than 1/2
        - id: b2
          label: more than 1/2
      items:
        - label: 3/7
          bucket: b1
        - label: 5/9
          bucket: b2
        - label: 6/13
          bucket: b1
        - label: 7/12
          bucket: b2
        - label: 11/20
          bucket: b2
        - label: 2/5
          bucket: b1
    hints:
      - What would be exactly half the denominator?
      - For sevenths, half would be 3.5.
    explanation: "Compare the numerator with half the denominator: 3 < 3.5, 5 > 4.5, 6 < 6.5, 7 > 6, 11 > 10, 2 < 2.5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which trick compares $\frac{a}{b}$ and $\frac{c}{d}$ fastest?
    params:
      options:
        - label: "Cross-multiply: compare a · d with c · b"
          correct: true
        - label: Compare numerators
          feedback: 1/2 is bigger than 2/9 although 1 is less than 2.
        - label: Compare denominators
          feedback: 5/6 is bigger than 1/2 although 6 is bigger than 2.
    hints:
      - What happens when you bring both fractions to the denominator b · d?
    explanation: With denominator b · d the numerators become a · d and c · b. Only those need comparing.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Compare $\frac{13}{17}$ and $\frac{16}{21}$ by cross-multiplying. Work out $13 \cdot 21 - 16 \cdot 17$.
    answer:
      value: 1
    hints:
      - 13 · 21 = 273.
      - 16 · 17 = 272.
    explanation: 273 − 272 = 1 > 0. So $\frac{13}{17}$ is a tiny bit larger – the difference is only $\frac{1}{357}$.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: We know $\frac{1}{3} < \frac{1}{2}$. Where is $\frac{1 + 1}{3 + 2} = \frac{2}{5}$?
    params:
      options:
        - label: 2/5 = 0.4 is larger than 0.33.
          feedback: 2/5 = 0,4 ist größer als 0,33.
        - label: Between 1/3 and 1/2
          correct: true
        - label: 2/5 = 0.4 is smaller than 0.5.
          feedback: 2/5 = 0,4 ist kleiner als 0,5.
    hints:
      - Write all three as decimals.
      - 0.33 … 0.4 … 0.5
    explanation: The »mediant« always lies between two fractions. It is not addition – but a neat trick to find fractions in between.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why $\frac{1}{3}$ is more than $\frac{1}{4}$, even though 4 is bigger than 3.
    params:
      keywords:
        - - stück
          - teil
          - piece
          - part
          - slice
        - - groß
          - größer
          - klein
          - bigger
          - larger
          - smaller
        - - nenner
          - geteilt
          - denominator
          - divided
          - split
          - teilt
      sample: The denominator says how many parts you split into. Splitting into 4 instead of 3 makes the pieces smaller. So one third is a bigger piece than one quarter.
    explanation: "Key idea: a bigger denominator means more, but smaller, pieces."
    difficulty: 3

srs:
  cards_from: ["vergleich-variante", "stammbrueche"]
