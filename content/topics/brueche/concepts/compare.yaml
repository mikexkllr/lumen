# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.compare
type: concept
title: Brüche vergleichen
summary: Größere Zahlen machen einen Bruch nicht automatisch größer.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.compare]
estimated_minutes: 14
steps:
  - kind: problem
    id: pizza-vergleich
    widget: choice
    prompt: Was ist mehr – 1/3 oder 1/4 einer Pizza?
    params:
      options:
        - label: "1/3"
          correct: true
        - label: "1/4"
          feedback: 4 ist zwar größer als 3. Aber in 4 Teile geschnitten sind die Stücke kleiner.
        - label: Beides gleich viel
          feedback: Probiere es aus. Teile eine Pizza in 3 und eine in 4 Stücke – die Stücke sind verschieden groß.
    hints:
      - Stell dir vor, die Pizza wird unter 3 oder unter 4 Leuten geteilt.
    explanation: Je mehr Teile, desto kleiner jedes Teil. 1/3 ist mehr als 1/4.

  - kind: explain
    id: s2
    body: |
      Gleicher Zähler: Der Bruch mit dem **kleineren** Nenner ist größer – seine Stücke sind größer.
      Gleicher Nenner: Der größere Zähler gewinnt.

  - kind: problem
    id: stammbrueche
    widget: order
    prompt: Sortiere von klein nach groß.
    params:
      direction: horizontal
      items: [{ label: "1/8" }, { label: "1/4" }, { label: "1/3" }, { label: "1/2" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Alle haben den Zähler 1. Welcher Nenner macht die kleinsten Stücke?
    explanation: Je größer der Nenner, desto kleiner das Stück.

  - kind: problem
    id: gleicher-nenner
    widget: order
    prompt: Sortiere von klein nach groß.
    params:
      direction: horizontal
      items: [{ label: "2/7" }, { label: "3/7" }, { label: "5/7" }, { label: "6/7" }]
      startLabel: klein
      endLabel: groß
    hints:
      - Alle Stücke sind gleich groß. Zähle, wie viele es jeweils sind.
    explanation: Gleicher Nenner – der Zähler entscheidet.

  - kind: explain
    id: s5
    body: |
      Verschiedene Zähler und **Nenner**? Mach die Nenner gleich.
      $\frac{2}{3}$ und $\frac{3}{4}$ werden zu $\frac{8}{12}$ und $\frac{9}{12}$. Jetzt sieht man: 3/4 ist größer.

  - kind: problem
    id: drei-fuenftel
    widget: choice
    prompt: Welcher Bruch ist größer – 3/5 oder 2/3?
    params:
      options:
        - label: "2/3"
          correct: true
        - label: "3/5"
          feedback: Größere Zahlen machen einen Bruch nicht größer. Erweitere beide auf Fünfzehntel – 9/15 und 10/15.
        - label: Beide sind gleich groß
          feedback: Erweitere auf Fünfzehntel. Dann siehst du 9/15 und 10/15.
    hints:
      - Finde einen gemeinsamen Nenner. 15 passt für 5 und 3.
      - "3/5 = 9/15 und 2/3 = 10/15."
    explanation: 10/15 ist mehr als 9/15, also ist 2/3 größer.
    difficulty: 2

  - kind: problem
    id: groesserer-markieren
    widget: numberline
    prompt: Setze die Markierung auf den größeren der beiden Brüche 5/6 und 3/4.
    params: { min: 0, max: 1, ticks: 12, labels: none, markers: [{ value: 0, label: "0" }, { value: 1, label: "1" }] }
    answer: { value: "5/6" }
    hints:
      - "Der Strahl ist in Zwölftel geteilt. 5/6 = ?/12 und 3/4 = ?/12."
      - "5/6 = 10/12 und 3/4 = 9/12."
    explanation: 5/6 = 10/12 ist größer als 3/4 = 9/12.
    difficulty: 2

  - kind: problem
    id: vergleich-variante
    widget: choice
    prompt: Welcher Bruch ist größer?
    params:
      shuffle: true
      options:
        - label: "{{a}}/{{b}}"
          correct: "{{a * d > c * b}}"
        - label: "{{c}}/{{d}}"
          correct: "{{c * b > a * d}}"
        - label: Beide sind gleich groß
          correct: false
    hints:
      - Mach die Nenner gleich. {{b * d}} passt für {{b}} und {{d}}.
      - "{{a}}/{{b}} = {{a * d}}/{{b * d}} und {{c}}/{{d}} = {{c * b}}/{{b * d}}."
    explanation: "Auf {{b * d}}tel erweitert: {{a * d}}/{{b * d}} und {{c * b}}/{{b * d}}."
    variants:
      params: { a: "int[1,5]", b: "int[2,9]", c: "int[1,5]", d: "int[2,9]" }
      constraints: ["a < b", "c < d", "a * d != c * b", "b != d"]
      defaults: { a: 3, b: 5, c: 2, d: 3 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Bei gleichem Zähler ist der Bruch mit dem [[kleineren]] Nenner größer. Bei gleichem Nenner gewinnt der [[größere]] Zähler.
      distractors:
        - geraden

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: Sortiere von klein nach groß – ohne Taschenrechner.
    params:
      items:
        - label: 3/8
        - label: 5/12
        - label: 1/2
        - label: 7/12
        - label: 2/3
      startLabel: klein
      endLabel: groß
    hints:
      - Vergleiche alle mit 1/2 – oder nimm den Nenner 24.
    explanation: "Als Vierundzwanzigstel: 9, 10, 12, 14 und 16."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "Welcher Bruch ist näher an 1: $\\frac{7}{8}$ oder $\\frac{9}{10}$? Gib ihn an."
    answer:
      value: 9/10
    feedback:
      - when: numval(state.input) == 7/8
        misconception: bigger-denominator
        text: 7/8 fehlt ein Achtel bis zur 1. 9/10 fehlt nur ein Zehntel.
    hints:
      - Was fehlt jeweils bis zum Ganzen?
      - Ist 1/8 oder 1/10 kleiner?
    explanation: Der Rest 1/10 ist kleiner als 1/8. Also ist 9/10 näher an 1 und größer.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Der **Restbruch** hilft beim Vergleichen: $\\frac{7}{8}$ fehlt $\\frac{1}{8}$ bis zum Ganzen, $\\frac{9}{10}$ fehlt nur $\\frac{1}{10}$. Kleinerer Rest, größerer Bruch."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Kleiner oder größer als $\frac{1}{2}$?
    params:
      buckets:
        - id: b1
          label: kleiner als 1/2
        - id: b2
          label: größer als 1/2
      items:
        - label: 3/7
          bucket: b1
        - label: 5/9
          bucket: b2
        - label: 6/13
          bucket: b1
        - label: 7/12
          bucket: b2
        - label: 11/20
          bucket: b2
        - label: 2/5
          bucket: b1
    hints:
      - Was wäre genau die Hälfte des Nenners?
      - Bei 7tel wäre die Hälfte 3,5.
    explanation: "Vergleiche den Zähler mit der Hälfte des Nenners: 3 < 3,5, 5 > 4,5, 6 < 6,5, 7 > 6, 11 > 10, 2 < 2,5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welcher Trick vergleicht $\frac{a}{b}$ und $\frac{c}{d}$ am schnellsten?
    params:
      options:
        - label: "Über Kreuz malnehmen: a · d mit c · b vergleichen"
          correct: true
        - label: Zähler vergleichen
          feedback: 1/2 ist größer als 2/9, obwohl 1 kleiner als 2 ist.
        - label: Nenner vergleichen
          feedback: 5/6 ist größer als 1/2, obwohl 6 größer als 2 ist.
    hints:
      - Was passiert, wenn du beide Brüche auf den Nenner b · d bringst?
    explanation: Mit dem Nenner b · d werden die Zähler zu a · d und c · b. Nur die muss man vergleichen.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Vergleiche $\frac{13}{17}$ und $\frac{16}{21}$ über Kreuz. Berechne $13 \cdot 21 - 16 \cdot 17$.
    answer:
      value: 1
    hints:
      - 13 · 21 = 273.
      - 16 · 17 = 272.
    explanation: 273 − 272 = 1 > 0. Also ist $\frac{13}{17}$ ein kleines bisschen größer – der Unterschied ist nur $\frac{1}{357}$.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Es gilt $\frac{1}{3} < \frac{1}{2}$. Wo liegt $\frac{1 + 1}{3 + 2} = \frac{2}{5}$?
    params:
      options:
        - label: Unter 1/3
          feedback: 2/5 = 0,4 ist größer als 0,33.
        - label: Zwischen 1/3 und 1/2
          correct: true
        - label: Über 1/2
          feedback: 2/5 = 0,4 ist kleiner als 0,5.
    hints:
      - Schreib alle drei als Dezimalzahl.
      - 0,33 … 0,4 … 0,5
    explanation: Die »Mediante« liegt immer zwischen zwei Brüchen. Das ist keine Addition – aber ein guter Trick, Brüche dazwischen zu finden.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum $\frac{1}{3}$ mehr ist als $\frac{1}{4}$, obwohl 4 größer ist als 3.
    params:
      keywords:
        - - stück
          - teil
          - piece
          - part
          - slice
        - - groß
          - größer
          - klein
          - bigger
          - larger
          - smaller
        - - nenner
          - geteilt
          - denominator
          - divided
          - split
          - teilt
      sample: Der Nenner sagt, in wie viele Teile man teilt. Teilt man in 4 statt 3, werden die Stücke kleiner. Ein Drittel ist also ein größeres Stück als ein Viertel.
    explanation: "Kernidee: Größerer Nenner heißt mehr, aber kleinere Stücke."
    difficulty: 3

srs:
  cards_from: ["vergleich-variante", "stammbrueche"]
