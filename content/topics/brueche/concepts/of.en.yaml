id: math.fractions.of
type: concept
title: Fractions of amounts
summary: Divide first, then multiply.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.of]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A third of the bar
    body: A bar of chocolate has 24 pieces. You may eat a third. Tap pieces until a third is shaded. How many pieces is that? A **fraction of an amount** is a real number of things.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 24
        shape: square

  - kind: problem
    id: euro
    widget: numeric
    prompt: How much is 3/4 of 20 €?
    params: { unit: "€" }
    answer: { value: 15 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: unit-fraction-only
        text: 5 € is one fourth. You need three fourths.
    hints:
      - How much is one fourth of 20 €?
      - One fourth is 5 €. And three fourths?
    explanation: "20 ÷ 4 = 5, and 3 · 5 = 15."

  - kind: explain
    id: s2
    body: |
      For a fraction of an amount, first divide by the **denominator**, then multiply by the **numerator**.
      $\frac{3}{4}$ of 20: 20 ÷ 4 = 5 and 3 · 5 = 15.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: How much is {{k}}/{{n}} of {{n * m}}?
    answer: { value: "{{k * m}}" }
    feedback:
      - when: "numval(state.input) == m && k != 1"
        misconception: unit-fraction-only
        text: "{{m}} is only 1/{{n}}. Take it {{k}} times."
    hints:
      - "Divide first: {{n * m}} ÷ {{n}}."
      - "Then times {{k}}."
    explanation: "{{n * m}} ÷ {{n}} = {{m}}, and {{m}} · {{k}} = {{k * m}}."
    variants:
      params: { n: "choice[3,4,5,6,8,10]", m: "int[2,9]", k: "int[1,7]" }
      constraints: ["k < n"]
      defaults: { n: 5, m: 7, k: 2 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Which is more?
    params:
      options:
        - { label: "2/3 of 30", correct: true }
        - { label: "3/4 of 24", feedback: "3/4 of 24 is 18. And 2/3 of 30?" }
        - { label: Both are equal, feedback: "Calculate both: 20 and 18." }
    hints:
      - Calculate both amounts.
    explanation: 2/3 of 30 = 20, 3/4 of 24 = 18.

  - kind: problem
    id: klasse
    widget: numeric
    prompt: A class has 28 children. 3/7 of them come by bike. How many is that?
    answer: { value: 12 }
    hints:
      - One seventh of 28 is 4 children.
    explanation: "28 ÷ 7 = 4, and 3 · 4 = 12."

  - kind: problem
    id: murmeln
    widget: fraction
    prompt: Of 12 marbles, 8 are red. Shade the share of red marbles.
    params: { parts: 12 }
    answer: { fraction: "8/12" }
    hints:
      - Each square is one marble.
    explanation: 8 of 12 – simplified, that is 2/3.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: For 3/5 of 40 you first divide by [[5]] and then multiply by [[3]]. The result is [[24]].
      distractors:
        - "8"
        - "40"

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: A cake has 12 slices. $\frac{2}{3}$ of them are sold. Shade the sold slices.
    params:
      parts: 12
      shape: hexagon
    answer:
      fraction: 2/3
    hints:
      - "Divide first: 12 ÷ 3 = 4. One third is 4 slices."
      - "Then multiply: 2 · 4 = 8. Shade 8 slices."
    explanation: "$\\frac{2}{3}$ of 12 is 8: divide by the denominator, then multiply by the numerator."

  - kind: problem
    id: intro-c2
    widget: fraction
    prompt: A bus has 20 seats. $\frac{3}{5}$ of them are taken. Shade the taken seats.
    params:
      parts: 20
      shape: square
    answer:
      fraction: 3/5
    hints:
      - One fifth of 20 is 20 ÷ 5 = 4 seats.
      - Three fifths are 3 · 4 = 12. Shade 12 seats.
    explanation: $\frac{3}{5}$ of 20 is 12 seats, that is $\frac{12}{20}$.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 2/3 of a number is 18. What is the number?
    answer:
      value: 27
    feedback:
      - when: numval(state.input) == 12
        misconception: forward-instead-of-inverse
        text: You computed 2/3 of 18. But the whole is asked for.
    hints:
      - If 2 thirds are 18 – how much is 1 third?
    explanation: 1/3 is 9, so the whole is 3 · 9 = 27. Going backwards you divide by the numerator first.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "{{k}}/{{n}} of a number is {{k * m}}. What is the number?"
    answer:
      value: "{{n * m}}"
    feedback:
      - when: numval(state.input) == k * m * k / n
        misconception: forward-instead-of-back
        text: You took {{k}}/{{n}} of it. Work backwards.
    hints:
      - "{{k}} parts are {{k * m}}. How much is one part?"
      - One part is {{m}}. The whole has {{n}} parts.
    explanation: "{{k * m}} : {{k}} = {{m}}, and {{m}} · {{n}} = {{n * m}}."
    difficulty: 2
    variants:
      params:
        k: int[2,4]
        n: int[5,9]
        m: int[2,9]
      defaults:
        k: 3
        n: 5
        m: 4

  - kind: problem
    id: ma-d2
    depth: 2
    widget: fraction
    prompt: 18 of 24 children play football. Shade that share – the bar has 4 parts.
    params:
      parts: 4
    answer:
      fraction: 3/4
      parts: 4
    hints:
      - Simplify 18/24.
      - Divide top and bottom by 6.
    explanation: $\frac{18}{24} = \frac{3}{4}$. Three of four parts.
    difficulty: 2

  - kind: explain
    id: ma-d3
    depth: 2
    body: "»Of« means **multiplication**: $\\frac{3}{4}$ of 20 is $\\frac{3}{4} \\cdot 20$. So $\\frac{2}{3}$ of $\\frac{3}{4}$ is the same as $\\frac{2}{3} \\cdot \\frac{3}{4}$."

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: What is $\frac{3}{4}$ of $\frac{2}{5}$?
    answer:
      value: 3/10
    feedback:
      - when: numval(state.input) == 5/9
        misconception: add-instead
        text: "Multiplying fractions: top times top, bottom times bottom."
    hints:
      - »Of« means times.
      - $\frac{3 \cdot 2}{4 \cdot 5}$
    explanation: $\frac{3 \cdot 2}{4 \cdot 5} = \frac{6}{20} = \frac{3}{10}$.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: How much is $\frac{2}{3}$ of $\frac{3}{4}$?
    answer:
      value: 1/2
    hints:
      - "“Of” means multiply: numerator times numerator, denominator times denominator."
    explanation: (2 · 3) / (3 · 4) = 6/12 = 1/2. A fraction of a fraction is a product.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "An inheritance is split: Anna gets half, Ben a third. Cleo gets the rest, which is €600. How big was the inheritance?"
    params:
      unit: €
    answer:
      value: 3600
    feedback:
      - when: numval(state.input) == 1200
        misconception: wrong-rest
        text: "Check Cleo’s share: 1 − 1/2 − 1/3."
    hints:
      - "Cleo’s share: $1 - \\frac{1}{2} - \\frac{1}{3}$."
      - One sixth is €600.
    explanation: Cleo gets $\frac{1}{6}$. $600 \cdot 6 = 3600$ €.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Does multiplying always make a number bigger?
    params:
      options:
        - label: $\frac{1}{2} \cdot 10 = 5$ is less than 10.
          feedback: $\frac{1}{2} \cdot 10 = 5$ ist kleiner als 10.
        - label: No – times a fraction below 1 makes it smaller
          correct: true
        - label: $\frac{1}{2} \cdot 10$ is smaller too.
          feedback: Auch $\frac{1}{2} \cdot 10$ ist kleiner.
    hints:
      - What is half of 10?
      - »Half of« is »times 1/2«.
    explanation: Times a number between 0 and 1 takes only a part – the result shrinks.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how to work out $\frac{3}{4}$ of 20 – and why it works.
    params:
      keywords:
        - - teil
          - durch
          - geteilt
          - divid
          - split
        - - vier
          - four
          - nenner
          - denominator
          - viertel
          - quarter
        - - drei
          - three
          - zähler
          - numerator
          - mal
          - times
      sample: "You divide 20 by 4, because the denominator asks for four equal parts. One quarter is 5. Then you take three of those parts: 3 times 5 is 15."
    explanation: "Key idea: divide by the denominator first (one part), then multiply by the numerator (that many parts)."
    difficulty: 3

srs:
  cards_from: ["anteil"]
