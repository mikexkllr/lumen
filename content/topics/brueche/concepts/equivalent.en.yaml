# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.equivalent
type: concept
title: Equivalent fractions
summary: Cutting finer or coarser doesn't change the amount.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.equivalent]
estimated_minutes: 14
steps:
  - kind: problem
    id: genauso-viel
    widget: fraction
    prompt: Above, you see 1/2. Shade the same amount below.
    params: { parts: 4, reference: ["1/2"] }
    answer: { fraction: "1/2" }
    hints:
      - Compare the length, not the number of parts.
    explanation: 2 of 4 parts is the same amount as 1 of 2.

  - kind: explain
    id: s2
    body: |
      1/2 and 2/4 are the same amount – just cut finer.
      If you split each piece in 2, numerator and denominator double.
      This is called **expanding**.

  - kind: problem
    id: sechstel
    widget: fraction
    prompt: Divide the strip into 6 parts and shade as much as 2/3.
    params: { parts: 3, partOptions: [3, 6, 9], reference: ["2/3"] }
    answer: { fraction: "4/6", equivalent: false }
    hints:
      - At the top, choose "6 parts".
      - Each third becomes 2 sixths.
    explanation: 2/3 = 4/6, because numerator and denominator were multiplied by 2.
    difficulty: 2

  - kind: problem
    id: erweitern
    widget: numeric
    prompt: "Fill in the numerator: $\\frac{ {{a}} }{ {{b}} } = \\frac{?}{ {{b * k}} }$"
    answer: { value: "{{a * k}}" }
    feedback:
      - when: "numval(state.input) == a + b * k - b"
        misconception: additive-equivalence
        text: "You added the same amount to the numerator as to the denominator. It only stays equivalent if you multiply: denominator · {{k}}, so numerator · {{k}}."
    hints:
      - What was the denominator multiplied by?
      - "{{b}} · {{k}} = {{b * k}}. Multiply the numerator by {{k}} too."
    explanation: "{{a}} · {{k}} = {{a * k}}, so {{a}}/{{b}} = {{a * k}}/{{b * k}}."
    variants:
      params: { a: "int[1,4]", b: "int[2,6]", k: "choice[2,3,4]" }
      constraints: ["a < b"]
      defaults: { a: 3, b: 4, k: 2 }

  - kind: explain
    id: s5
    body: |
      It works the other way too. If you divide numerator and denominator by the same number, it is called **simplifying**.
      $\frac{6}{8} = \frac{3}{4}$, because 6 ÷ 2 = 3 and 8 ÷ 2 = 4.

  - kind: problem
    id: kuerzen
    widget: numeric
    prompt: "Simplify as far as possible: $\\frac{12}{18}$"
    params: { placeholder: "e.g. 1/2" }
    answer: { value: "2/3", form: simplified }
    hints:
      - Which number divides both 12 and 18?
      - The greatest common divisor is 6.
    explanation: "12 ÷ 6 = 2 and 18 ÷ 6 = 3, so 2/3."

  - kind: problem
    id: kuerzen-variante
    widget: numeric
    prompt: "Simplify as far as possible: $\\frac{ {{a * k}} }{ {{b * k}} }$"
    params: { placeholder: "e.g. 1/2" }
    answer: { value: "{{a}}/{{b}}", form: simplified }
    hints:
      - Look for a number that divides both numerator and denominator.
      - "Both are divisible by {{k}}."
    explanation: "Divide by {{k}}: {{a}}/{{b}}."
    difficulty: 2
    variants:
      params: { a: "int[1,5]", b: "int[2,9]", k: "choice[2,3,4,5]" }
      constraints: ["a < b", "gcd(a, b) == 1"]
      defaults: { a: 3, b: 5, k: 4 }

  - kind: problem
    id: nicht-gleichwertig
    widget: choice
    prompt: Which fraction is **not** equivalent to 3/5?
    params:
      layout: grid
      options:
        - label: "6/10"
          feedback: Numerator and denominator times 2 – that is equivalent.
        - label: "9/15"
          feedback: Numerator and denominator times 3 – that is equivalent.
        - label: "5/7"
          correct: true
        - label: "30/50"
          feedback: Numerator and denominator times 10 – that is equivalent.
    hints:
      - Check whether numerator and denominator were multiplied by the same number.
    explanation: For 5/7, 2 was added to numerator and denominator. Adding changes the value.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 2/3 and 4/6 are the same amount.
          right: true
        - text: Expanding makes the fraction bigger.
          right: false
          why: Only the notation changes, the value stays.
        - text: 3/5 = 4/6 because 1 is added on top and bottom.
          right: false
          why: Adding changes the value. Only multiplying or dividing by the same number is allowed.
        - text: 10/15 simplifies to 2/3.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Simplify fully: $\\frac{84}{126}$"
    answer:
      value: 2/3
      form: simplified
    hints:
      - Both numbers are divisible by 2, 3 and 7.
      - The greatest common divisor is 42.
    explanation: 84 ÷ 42 = 2 and 126 ÷ 42 = 3. The greatest common divisor simplifies in one step.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: fraction
    prompt: The pizza shows $\frac{1}{3}$. Cut it into 12 slices and shade the same amount.
    params:
      parts: 3
      shape: circle
      shaded:
        - 0
      partOptions:
        - 3
        - 6
        - 12
    answer:
      fraction: 4/12
      equivalent: false
    hints:
      - Each third is cut into 4 slices.
      - Shade 4 of the 12 slices.
    explanation: $\frac{1}{3} = \frac{4}{12}$ – numerator and denominator times 4.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: Why does expanding change nothing? $\frac{2}{3} = \frac{2 \cdot 4}{3 \cdot 4}$ means times $\frac{4}{4}$. And $\frac{4}{4}$ is a whole **one**. Times 1 changes nothing.

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Equal to $\frac{2}{3}$ or not?
    params:
      buckets:
        - id: b1
          label: equal to 2/3
        - id: b2
          label: not equal
      items:
        - label: 4/6
          bucket: b1
        - label: 10/15
          bucket: b1
        - label: 12/18
          bucket: b1
        - label: 3/4
          bucket: b2
        - label: 5/6
          bucket: b2
        - label: 9/12
          bucket: b2
    hints:
      - Simplify each fraction.
      - 9/12 = 3/4 and 5/6 stays 5/6.
    explanation: 4/6, 10/15 and 12/18 simplify to 2/3. 3/4, 5/6 and 9/12 do not.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: When is a fraction fully simplified?
    params:
      options:
        - label: When numerator and denominator share only the divisor 1
          correct: true
        - label: When the numerator is prime
          feedback: 3/9 has numerator 3 and still simplifies.
        - label: When both numbers are odd
          feedback: 9/15 is odd over odd and simplifies by 3.
    hints:
      - Think of 9/15.
    explanation: "Such numbers are called **coprime**: their greatest common divisor is 1."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Simplify fully: $\\frac{91}{143}$"
    answer:
      value: 7/11
      form: simplified
    hints:
      - Neither 2, 3 nor 5 divide. Try 7, 11, 13.
      - 91 = 7 · 13 and 143 = 11 · 13.
    explanation: The gcd is 13. $\frac{91}{143} = \frac{7}{11}$. For big numbers the Euclidean algorithm helps.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: How many fractions are equivalent to $\frac{1}{2}$?
    params:
      options:
        - label: 2/4 equals 1/2 too.
          feedback: 2/4 ist auch gleich 1/2.
        - label: Why stop? 100/200 works too.
          feedback: Warum aufhören? 100/200 geht auch.
        - label: Infinitely many
          correct: true
    hints:
      - 1/2, 2/4, 3/6 …
      - Can you keep expanding forever?
    explanation: n/2n for every n. A rational number is really this whole family. The simplified fraction is its representative.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why $\frac{2}{4}$ and $\frac{1}{2}$ are the same amount.
    params:
      keywords:
        - - teil
          - stück
          - piece
          - part
          - slice
        - - doppelt
          - halb
          - zwei
          - double
          - half
          - twice
          - two
        - - gleich
          - same
          - equal
      sample: In 2/4 the pieces are half as big, but you take twice as many. The amount stays the same.
    explanation: "Key idea: cutting finer does not change the amount – numerator and denominator grow together."
    difficulty: 3

srs:
  cards_from: ["erweitern", "kuerzen-variante"]
