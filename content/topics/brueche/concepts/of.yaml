id: math.fractions.of
type: concept
title: Bruchteile von Mengen
summary: Erst teilen, dann malnehmen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.of]
estimated_minutes: 13
steps:
  - kind: problem
    id: euro
    widget: numeric
    prompt: Wie viel sind 3/4 von 20 €?
    params: { unit: "€" }
    answer: { value: 15 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: unit-fraction-only
        text: 5 € ist ein Viertel. Gesucht sind drei Viertel.
    hints:
      - Wie viel ist ein Viertel von 20 €?
      - Ein Viertel sind 5 €. Und drei Viertel?
    explanation: "20 : 4 = 5, und 3 · 5 = 15."

  - kind: explain
    id: s2
    body: |
      Ein Bruchteil von einer Menge: erst durch den **Nenner** teilen, dann mit dem **Zähler** malnehmen.
      $\frac{3}{4}$ von 20: 20 : 4 = 5 und 3 · 5 = 15.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: Wie viel sind {{k}}/{{n}} von {{n * m}}?
    answer: { value: "{{k * m}}" }
    feedback:
      - when: "numval(state.input) == m && k != 1"
        misconception: unit-fraction-only
        text: "{{m}} ist erst 1/{{n}}. Nimm es noch {{k}}-mal."
    hints:
      - "Teile zuerst: {{n * m}} : {{n}}."
      - "Dann mal {{k}}."
    explanation: "{{n * m}} : {{n}} = {{m}}, und {{m}} · {{k}} = {{k * m}}."
    variants:
      params: { n: "choice[3,4,5,6,8,10]", m: "int[2,9]", k: "int[1,7]" }
      constraints: ["k < n"]
      defaults: { n: 5, m: 7, k: 2 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Was ist mehr?
    params:
      options:
        - { label: "2/3 von 30", correct: true }
        - { label: "3/4 von 24", feedback: "3/4 von 24 sind 18. Und 2/3 von 30?" }
        - { label: Beides gleich viel, feedback: "Rechne beide aus: 20 und 18." }
    hints:
      - Rechne beide Mengen aus.
    explanation: 2/3 von 30 = 20, 3/4 von 24 = 18.

  - kind: problem
    id: klasse
    widget: numeric
    prompt: In einer Klasse sind 28 Kinder. 3/7 kommen mit dem Rad. Wie viele sind das?
    answer: { value: 12 }
    hints:
      - Ein Siebtel von 28 sind 4 Kinder.
    explanation: "28 : 7 = 4, und 3 · 4 = 12."

  - kind: problem
    id: murmeln
    widget: fraction
    prompt: Von 12 Murmeln sind 8 rot. Färbe den Anteil der roten Murmeln.
    params: { parts: 12 }
    answer: { fraction: "8/12" }
    hints:
      - Jedes Feld ist eine Murmel.
    explanation: 8 von 12 – das ist gekürzt 2/3.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Für 3/5 von 40 teilst du erst durch [[5]] und nimmst dann mal [[3]]. Das Ergebnis ist [[24]].
      distractors:
        - "8"
        - "40"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 2/3 einer Zahl sind 18. Wie heißt die Zahl?
    answer:
      value: 27
    feedback:
      - when: numval(state.input) == 12
        misconception: forward-instead-of-inverse
        text: Du hast 2/3 von 18 gerechnet. Gesucht ist aber das Ganze.
    hints:
      - Wenn 2 Drittel 18 sind – wie viel ist dann 1 Drittel?
    explanation: 1/3 ist 9, also ist das Ganze 3 · 9 = 27. Rückwärts rechnet man erst durch den Zähler.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "{{k}}/{{n}} einer Zahl sind {{k * m}}. Wie heißt die Zahl?"
    answer:
      value: "{{n * m}}"
    feedback:
      - when: numval(state.input) == k * m * k / n
        misconception: forward-instead-of-back
        text: Du hast {{k}}/{{n}} davon genommen. Rechne rückwärts.
    hints:
      - "{{k}} Teile sind {{k * m}}. Wie viel ist ein Teil?"
      - Ein Teil ist {{m}}. Das Ganze hat {{n}} Teile.
    explanation: "{{k * m}} : {{k}} = {{m}}, und {{m}} · {{n}} = {{n * m}}."
    difficulty: 2
    variants:
      params:
        k: int[2,4]
        n: int[5,9]
        m: int[2,9]
      defaults:
        k: 3
        n: 5
        m: 4

  - kind: problem
    id: ma-d2
    depth: 2
    widget: fraction
    prompt: Von 24 Kindern spielen 18 Fußball. Färbe den Anteil – der Streifen hat 4 Teile.
    params:
      parts: 4
    answer:
      fraction: 3/4
      parts: 4
    hints:
      - Kürze 18/24.
      - Teile oben und unten durch 6.
    explanation: $\frac{18}{24} = \frac{3}{4}$. Drei von vier Teilen.
    difficulty: 2

  - kind: explain
    id: ma-d3
    depth: 2
    body: "»Von« heißt **Multiplikation**: $\\frac{3}{4}$ von 20 ist $\\frac{3}{4} \\cdot 20$. Darum ist $\\frac{2}{3}$ von $\\frac{3}{4}$ dasselbe wie $\\frac{2}{3} \\cdot \\frac{3}{4}$."

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Wie viel ist $\frac{3}{4}$ von $\frac{2}{5}$?
    answer:
      value: 3/10
    feedback:
      - when: numval(state.input) == 5/9
        misconception: add-instead
        text: "Brüche malnehmen: Zähler mal Zähler, Nenner mal Nenner."
    hints:
      - »Von« heißt mal.
      - $\frac{3 \cdot 2}{4 \cdot 5}$
    explanation: $\frac{3 \cdot 2}{4 \cdot 5} = \frac{6}{20} = \frac{3}{10}$.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viel ist $\frac{2}{3}$ von $\frac{3}{4}$?
    answer:
      value: 1/2
    hints:
      - "»Von« heißt malnehmen: Zähler mal Zähler, Nenner mal Nenner."
    explanation: (2 · 3) / (3 · 4) = 6/12 = 1/2. Ein Bruchteil von einem Bruch ist ein Produkt.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Ein Erbe wird geteilt: Anna bekommt die Hälfte, Ben ein Drittel. Cleo erhält den Rest, und das sind 600 €. Wie groß war das Erbe?"
    params:
      unit: €
    answer:
      value: 3600
    feedback:
      - when: numval(state.input) == 1200
        misconception: wrong-rest
        text: "Prüfe den Anteil von Cleo: 1 − 1/2 − 1/3."
    hints:
      - "Cleos Anteil: $1 - \\frac{1}{2} - \\frac{1}{3}$."
      - Ein Sechstel sind 600 €.
    explanation: Cleo bekommt $\frac{1}{6}$. $600 \cdot 6 = 3600$ €.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Macht Malnehmen eine Zahl immer größer?
    params:
      options:
        - label: Ja, immer
          feedback: $\frac{1}{2} \cdot 10 = 5$ ist kleiner als 10.
        - label: Nein – mal einen Bruch unter 1 wird es kleiner
          correct: true
        - label: Nur bei negativen Zahlen nicht
          feedback: Auch $\frac{1}{2} \cdot 10$ ist kleiner.
    hints:
      - Was ist die Hälfte von 10?
      - »Die Hälfte von« ist »mal 1/2«.
    explanation: Mal eine Zahl zwischen 0 und 1 nimmt nur einen Teil – das Ergebnis schrumpft.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man $\frac{3}{4}$ von 20 ausrechnet – und warum das klappt.
    params:
      keywords:
        - - teil
          - durch
          - geteilt
          - divid
          - split
        - - vier
          - four
          - nenner
          - denominator
          - viertel
          - quarter
        - - drei
          - three
          - zähler
          - numerator
          - mal
          - times
      sample: "Man teilt 20 durch 4, weil der Nenner vier gleiche Teile verlangt. Ein Viertel sind 5. Dann nimmt man drei solche Teile: 3 mal 5 sind 15."
    explanation: "Kernidee: erst durch den Nenner teilen (ein Teil), dann mit dem Zähler malnehmen (so viele Teile)."
    difficulty: 3

srs:
  cards_from: ["anteil"]
