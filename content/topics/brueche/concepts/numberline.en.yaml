# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.numberline
type: concept
title: Fractions on the number line
summary: Every fraction has a fixed place between the whole numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.numberline]
estimated_minutes: 8
steps:
  - kind: problem
    id: haelfte
    widget: numberline
    prompt: Where is 1/2? Place the marker.
    params: { min: 0, max: 1, ticks: 4 }
    answer: { value: "1/2" }
    hints:
      - 1/2 is exactly halfway between 0 and 1.
    explanation: One half is exactly in the middle.

  - kind: explain
    id: s2
    body: |
      On the number line, the way from 0 to 1 is the whole.
      If you divide it into 4 equal pieces, each step is 1/4 long.
    visual:
      widget: numberline
      params: { min: 0, max: 1, ticks: 4, labels: fractions }

  - kind: problem
    id: drei-viertel
    widget: numberline
    prompt: Place the marker on 3/4.
    params: { min: 0, max: 1, ticks: 4 }
    answer: { value: "3/4" }
    hints:
      - Each tick mark is another 1/4.
      - Starting at 0, go 3 tick marks to the right.
    explanation: 3 steps of 1/4 each.

  - kind: problem
    id: ueber-eins
    widget: numberline
    prompt: Place the marker on 4/3.
    params: { min: 0, max: 2, ticks: 3 }
    answer: { value: "4/3" }
    hints:
      - 3/3 is exactly 1. Is 4/3 more or less than 1?
      - From 1, go one more third.
    explanation: 4/3 = 3/3 + 1/3 = 1 + 1/3.

  - kind: problem
    id: platz-variante
    widget: numberline
    prompt: Place the marker on {{k}}/{{n}}.
    params: { min: 0, max: 1, ticks: "{{n}}" }
    answer: { value: "{{k}}/{{n}}" }
    hints:
      - The whole is divided into {{n}} steps.
      - Go {{k}} steps from 0.
    explanation: "{{k}} steps of 1/{{n}} each."
    variants:
      params: { n: "choice[3,4,5,6,8]", k: "int[1,7]" }
      constraints: ["k < n"]
      defaults: { n: 5, k: 3 }

  - kind: problem
    id: mitte
    widget: choice
    prompt: Which number is exactly halfway between 0 and 1/2?
    params:
      layout: grid
      options:
        - label: "1/4"
          correct: true
        - label: "1/3"
          feedback: 1/3 is between 0 and 1/2, but not exactly in the middle.
        - label: "2/4"
          feedback: 2/4 is the same as 1/2 – that is the end of the segment.
        - label: "1/1"
          feedback: 1/1 is one whole. That is to the right of 1/2.
    hints:
      - What is half of a half?
    explanation: Half of 1/2 is 1/4.

  - kind: problem
    id: zehntel
    widget: numberline
    prompt: Place the marker on 7/10.
    params: { min: 0, max: 1, ticks: 10, labels: decimals }
    answer: { value: "7/10" }
    hints:
      - You can also write tenths as decimals.
      - 7/10 = 0.7
    explanation: 7/10 is the same as 0.7.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: On the number line 1/4 lies to the [[left]] of 1/2. A fraction whose numerator exceeds its denominator lies to the [[right]] of 1.
      distractors:
        - above
        - exactly on

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Which fraction lies exactly halfway between 1/2 and 1?
    answer:
      value: 3/4
    hints:
      - "Write both in quarters: 2/4 and 4/4."
    explanation: Between 2/4 and 4/4 lies 3/4.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How many fractions lie between 1/4 and 1/2?
    params:
      options:
        - label: Infinitely many
          correct: true
        - label: None
          feedback: 3/8 lies between them, for example.
        - label: Exactly one
          feedback: 3/8 is between them – but so are 5/16 and 7/16.
    hints:
      - Take the midpoint of two fractions. Can you repeat that forever?
    explanation: Between two fractions there is always another, such as their midpoint. Fractions are **dense**.
    difficulty: 3

srs:
  cards_from: ["platz-variante"]
