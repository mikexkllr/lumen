# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.parts
type: concept
title: Was ein Bruch erzählt
summary: Der Nenner teilt, der Zähler zählt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.part-whole]
estimated_minutes: 18
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Teile vom Ganzen
    body: Pizza, Torte, Schokolade – beim Teilen rechnest du ständig mit Brüchen. Tippe auf die Stücke des Sechsecks und färbe sie. Unten siehst du sofort, welcher Bruch entsteht. Ein Bruch ist ein **Teil vom Ganzen**.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 6
        shape: hexagon
        shaded:
          - 0

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent einer Pizza sind 3 von 8 Stücken?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 37.5
      tolerance: 6
    explanation: 3/8 = 37,5 %. Ein Bruch ist nur eine andere Schreibweise für einen Anteil.

  - kind: problem
    id: drei-viertel
    widget: fraction
    prompt: Färbe 3/4 des Streifens. Tippe dazu auf die Teile.
    params: { parts: 4 }
    answer: { fraction: "3/4" }
    hints:
      - Der Streifen hat 4 gleich große Teile.
      - Färbe 3 davon.
    explanation: 3/4 heißt 3 von 4 gleich großen Teilen.

  - kind: explain
    id: s2
    body: |
      Der **Nenner** (unten) sagt, in wie viele gleich große Teile das Ganze geteilt ist.
      Der **Zähler** (oben) sagt, wie viele Teile du nimmst.
    visual:
      widget: fraction
      params: { parts: 4, shaded: [0, 1, 2] }

  - kind: problem
    id: faerben-variante
    widget: fraction
    prompt: Färbe {{k}}/{{n}} des Streifens.
    params: { parts: "{{n}}" }
    answer: { fraction: "{{k}}/{{n}}" }
    feedback:
      - when: "shadedCount == n - k && k != n - k"
        misconception: complement
        text: Du hast die Teile gefärbt, die übrig bleiben sollen. Gefärbt werden {{k}} Teile.
    hints:
      - Der Nenner {{n}} sagt dir, wie viele Teile es gibt.
      - Der Zähler {{k}} sagt dir, wie viele du färbst.
    explanation: "{{k}} von {{n}} Teilen färben."
    variants:
      params: { n: "choice[3,4,5,6,8]", k: "int[1,7]" }
      constraints: ["k < n"]
      defaults: { n: 5, k: 2 }

  - kind: problem
    id: pizza
    widget: fraction
    prompt: Färbe 5/8 der Pizza.
    params: { parts: 8, shape: circle }
    answer: { fraction: "5/8" }
    hints:
      - Die Pizza ist in 8 gleiche Stücke geschnitten.
    explanation: 5 von 8 Stücken.

  - kind: problem
    id: ablesen
    widget: choice
    visual:
      widget: fraction
      params: { parts: 6, shaded: [0, 1] }
    prompt: Welcher Bruch ist gefärbt?
    params:
      layout: grid
      options:
        - label: "2/6"
          correct: true
        - label: "2/4"
          feedback: Du hast gefärbte mit ungefärbten Teilen verglichen. Der Nenner zählt alle Teile.
        - label: "6/2"
          feedback: Zähler und Nenner sind vertauscht. Unten steht die Zahl aller Teile.
        - label: "4/6"
          feedback: Das ist der Teil, der nicht gefärbt ist.
    hints:
      - Wie viele Teile hat der Streifen insgesamt?
    explanation: 2 von 6 Teilen sind gefärbt, also 2/6.

  - kind: problem
    id: neu-teilen
    widget: fraction
    prompt: Mit 4 Teilen klappt es nicht. Teile den Streifen neu und färbe 1/3.
    params: { parts: 4, partOptions: [2, 3, 4, 6] }
    answer: { fraction: "1/3" }
    hints:
      - 1/3 heißt, das Ganze in 3 gleiche Teile zu teilen.
      - Wähle oben »3 Teile« und färbe einen.
    explanation: In 3 Teile teilen und einen färben. Mit 6 Teilen und 2 gefärbten klappt es auch.

  - kind: problem
    id: kuchen-rest
    widget: numeric
    prompt: Ein Kuchen hat {{n}} gleiche Stücke. {{k}} Stücke sind gegessen. Welcher Bruch ist übrig?
    params: { placeholder: "z. B. 3/4" }
    answer: { value: "{{n - k}}/{{n}}" }
    feedback:
      - when: "approx(numval(state.input), k / n)"
        misconception: complement
        text: Das ist der gegessene Teil. Gefragt ist, was noch übrig ist.
    hints:
      - Wie viele Stücke sind noch da?
      - "Übrig sind {{n}} − {{k}} Stücke von {{n}}."
    explanation: "{{n - k}} von {{n}} Stücken sind übrig: {{n - k}}/{{n}}."
    difficulty: 2
    variants:
      params: { n: "choice[4,5,6,8,10,12]", k: "int[1,3]" }
      constraints: ["k < n", "n != 2 * k"]
      defaults: { n: 8, k: 3 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Bei 3/8 ist das Ganze in 8 gleiche Teile geteilt.
          right: true
        - text: Je größer der Nenner, desto größer jedes Stück.
          right: false
          why: Mehr Teile heißt kleinere Stücke.
        - text: 5/5 ist genau ein Ganzes.
          right: true
        - text: Der Zähler steht unten.
          right: false
          why: Der Zähler steht oben und zählt die Teile.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Färbe $\frac{2}{3}$ des Dreiecks.
    params:
      parts: 3
      shape: triangle
    answer:
      fraction: 2/3
    hints:
      - "Der Nenner 3 sagt: drei gleiche Teile."
      - Färbe 2 der 3 Teile.
    explanation: Zwei von drei gleich großen Teilen sind $\frac{2}{3}$.

  - kind: problem
    id: intro-c2
    widget: fraction
    prompt: Das Quadrat ist in 9 gleiche Felder geteilt. Färbe $\frac{4}{9}$.
    params:
      parts: 9
      shape: square
    answer:
      fraction: 4/9
    hints:
      - Der Nenner 9 zählt alle Felder.
      - "Der Zähler 4 sagt: Färbe 4 Felder."
    explanation: Vier von neun gleich großen Feldern sind $\frac{4}{9}$.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Drei Pizzen haben je 4 Stücke. 7 Stücke sind gegessen. Wie viele Pizzen sind das als Bruch?
    params:
      placeholder: z. B. 5/4
    answer:
      value: 7/4
    hints:
      - Jedes Stück ist 1/4 einer Pizza.
    explanation: 7 Stücke zu je 1/4 sind 7/4 – mehr als ein Ganzes. Solche Brüche heißen unecht.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Ein Bruch ist auch eine **Division**: $\\frac{3}{4}$ heißt 3 geteilt durch 4. Verteile 3 Pizzen gerecht auf 4 Kinder – jedes bekommt $\\frac{3}{4}$ Pizza."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "{{a}} Pizzen werden gerecht auf {{b}} Kinder verteilt. Wie viel Pizza bekommt jedes Kind? Gib einen Bruch an."
    answer:
      value: "{{a}}/{{b}}"
    feedback:
      - when: numval(state.input) == b / a
        misconception: flipped
        text: "Umgekehrt: Die Pizzen werden geteilt, also stehen sie oben."
    hints:
      - Pizzen geteilt durch Kinder.
      - "Schreib {{a}} : {{b}} als Bruch."
    explanation: "{{a}} : {{b}} = {{a}}/{{b}}. Jedes Kind bekommt von jeder Pizza ein {{b}}-tel – also {{a}} Stücke der Größe 1/{{b}}."
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        b: int[3,8]
      constraints:
        - a < b
      defaults:
        a: 3
        b: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numberline
    prompt: "Mehr als ein Ganzes: Setze die Markierung auf $\\frac{5}{4}$."
    params:
      min: 0
      max: 2
      ticks: 4
      labels: fractions
    answer:
      value: 5/4
    hints:
      - 4 Viertel sind ein Ganzes.
      - Ein Viertel hinter der 1.
    explanation: $\frac{5}{4} = 1 + \frac{1}{4}$. Brüche mit Zähler größer als Nenner liegen hinter der 1.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Schreibe $2\frac{1}{3}$ als einen Bruch.
    answer:
      value: 7/3
      form: fraction
    feedback:
      - when: numval(state.input) == 2/3
        misconception: mixed-as-product
        text: $2\frac{1}{3}$ heißt 2 plus 1/3, nicht 2 mal 1/3.
      - when: numval(state.input) == 3/3
        misconception: wholes-as-units
        text: Zwei Ganze sind 6 Drittel, nicht 2.
    hints:
      - Wie viele Drittel sind 2 Ganze?
      - 6 Drittel plus 1 Drittel.
    explanation: $2 = \frac{6}{3}$, also $2\frac{1}{3} = \frac{6}{3} + \frac{1}{3} = \frac{7}{3}$.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Streifen ist in 2 **ungleich** große Teile geschnitten. Das kleinere ist gefärbt. Ist das 1/2?
    params:
      options:
        - label: Nein – die Teile müssen gleich groß sein
          correct: true
        - label: Ja – es ist 1 von 2 Teilen
          feedback: Zählen allein reicht nicht. Ein Bruch setzt gleich große Teile voraus.
        - label: Das kann man nie wissen
          feedback: "Doch: Das kleinere Teil ist sicher weniger als die Hälfte."
    hints:
      - Was verlangt der Nenner von den Teilen?
    explanation: Der Nenner zählt gleich große Teile. Das kleinere Stück ist weniger als 1/2.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux in ein, zwei Sätzen: Was sagen Zähler und Nenner eines Bruchs?"
    params:
      keywords:
        - - nenner
          - denominator
        - - zähler
          - numerator
        - - teil
          - stück
          - part
          - piece
          - slice
      sample: Der Nenner sagt, in wie viele gleiche Teile das Ganze geteilt ist. Der Zähler sagt, wie viele Teile davon gemeint sind.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Jede Zahl, die sich als Bruch ganzer Zahlen schreiben lässt, heißt **rational**. Auch $5 = \frac{5}{1}$, $-\frac{2}{3}$ und $0{,}75 = \frac{3}{4}$ gehören dazu.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: swipe
    prompt: Rational oder nicht?
    params:
      cards:
        - text: 0,75
          right: true
          why: 0,75 = 3/4.
        - text: −4
          right: true
          why: −4 = −4/1.
        - text: 0,333…
          right: true
          why: Das ist genau 1/3.
        - text: √2
          right: false
          why: Kein Bruch trifft √2 genau – das ist bewiesen.
        - text: π
          right: false
          why: π ist nicht rational.
      left: nicht rational
      right: rational
    hints:
      - Kannst du die Zahl als a/b schreiben?
      - Ganze Zahlen haben den Nenner 1.
    explanation: Endliche und periodische Kommazahlen sind rational. √2 und π sind es nicht – sie sind irrational.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: "$\\frac{6}{0} = x$ hieße: $x \\cdot 0 = 6$. Was folgt daraus?"
    params:
      options:
        - label: $x = 0$
          feedback: $0 \cdot 0 = 0$, nicht 6.
        - label: $x = 6$
          feedback: $6 \cdot 0 = 0$, nicht 6.
        - label: Kein x passt – darum ist 6/0 nicht definiert
          correct: true
        - label: x ist unendlich
          feedback: ∞ ist keine Zahl, mit der man so rechnen kann.
    hints:
      - Was ergibt jede Zahl mal 0?
      - Kann dabei 6 herauskommen?
    explanation: Jede Zahl mal 0 ergibt 0. Kein x erfüllt $x \cdot 0 = 6$. Ein Nenner darf deshalb nie 0 sein.
    difficulty: 3

srs:
  cards_from: ["faerben-variante", "kuchen-rest"]
