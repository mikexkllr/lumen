# yaml-language-server: $schema=../../../lumen.schema.json
id: math.fractions.equivalent
type: concept
title: Gleichwertige Brüche
summary: Feiner oder gröber teilen ändert die Menge nicht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [frac.equivalent]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Feiner geschnitten
    body: Ein Drittel Kuchen bleibt ein Drittel, auch wenn du feiner schneidest. Ein Drittel des Dreiecks ist gefärbt. Teile es in 6 oder 9 Stücke und färbe wieder **gleich viel**. Wie viele Stücke brauchst du jetzt?
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 3
        shape: triangle
        shaded:
          - 0
        partOptions:
          - 3
          - 6
          - 9

  - kind: problem
    id: genauso-viel
    widget: fraction
    prompt: Oben siehst du 1/2. Färbe unten genauso viel.
    params: { parts: 4, reference: ["1/2"] }
    answer: { fraction: "1/2" }
    hints:
      - Vergleiche die Länge, nicht die Anzahl der Teile.
    explanation: 2 von 4 Teilen sind genauso viel wie 1 von 2.

  - kind: explain
    id: s2
    body: |
      1/2 und 2/4 sind gleich viel – nur feiner geteilt.
      Teilst du jedes Stück in 2, verdoppeln sich Zähler und Nenner.
      Das heißt **Erweitern**.

  - kind: problem
    id: sechstel
    widget: fraction
    prompt: Teile den Streifen in 6 Teile und färbe so viel wie 2/3.
    params: { parts: 3, partOptions: [3, 6, 9], reference: ["2/3"] }
    answer: { fraction: "4/6", equivalent: false }
    hints:
      - Wähle oben »6 Teile«.
      - Aus jedem Drittel werden 2 Sechstel.
    explanation: 2/3 = 4/6, denn Zähler und Nenner wurden mit 2 malgenommen.
    difficulty: 2

  - kind: problem
    id: erweitern
    widget: numeric
    prompt: "Ergänze den Zähler: $\\frac{ {{a}} }{ {{b}} } = \\frac{?}{ {{b * k}} }$"
    answer: { value: "{{a * k}}" }
    feedback:
      - when: "numval(state.input) == a + b * k - b"
        misconception: additive-equivalence
        text: "Du hast beim Zähler genauso viel addiert wie beim Nenner. Gleichwertig wird es nur durch Malnehmen: Nenner · {{k}}, also auch Zähler · {{k}}."
    hints:
      - Mit welcher Zahl wurde der Nenner malgenommen?
      - "{{b}} · {{k}} = {{b * k}}. Nimm auch den Zähler mal {{k}}."
    explanation: "{{a}} · {{k}} = {{a * k}}, also {{a}}/{{b}} = {{a * k}}/{{b * k}}."
    variants:
      params: { a: "int[1,4]", b: "int[2,6]", k: "choice[2,3,4]" }
      constraints: ["a < b"]
      defaults: { a: 3, b: 4, k: 2 }

  - kind: explain
    id: s5
    body: |
      Umgekehrt geht es auch: Teilst du Zähler und Nenner durch dieselbe Zahl, heißt das **Kürzen**.
      $\frac{6}{8} = \frac{3}{4}$, weil 6 : 2 = 3 und 8 : 2 = 4.

  - kind: problem
    id: kuerzen
    widget: numeric
    prompt: "Kürze so weit wie möglich: $\\frac{12}{18}$"
    params: { placeholder: "z. B. 1/2" }
    answer: { value: "2/3", form: simplified }
    hints:
      - Welche Zahl teilt 12 und 18?
      - Der größte gemeinsame Teiler ist 6.
    explanation: "12 : 6 = 2 und 18 : 6 = 3, also 2/3."

  - kind: problem
    id: kuerzen-variante
    widget: numeric
    prompt: "Kürze so weit wie möglich: $\\frac{ {{a * k}} }{ {{b * k}} }$"
    params: { placeholder: "z. B. 1/2" }
    answer: { value: "{{a}}/{{b}}", form: simplified }
    hints:
      - Suche eine Zahl, durch die Zähler und Nenner teilbar sind.
      - "Beide sind durch {{k}} teilbar."
    explanation: "Durch {{k}} teilen: {{a}}/{{b}}."
    difficulty: 2
    variants:
      params: { a: "int[1,5]", b: "int[2,9]", k: "choice[2,3,4,5]" }
      constraints: ["a < b", "gcd(a, b) == 1"]
      defaults: { a: 3, b: 5, k: 4 }

  - kind: problem
    id: nicht-gleichwertig
    widget: choice
    prompt: Welcher Bruch ist **nicht** gleichwertig zu 3/5?
    params:
      layout: grid
      options:
        - label: "6/10"
          feedback: Zähler und Nenner mal 2 – das ist gleichwertig.
        - label: "9/15"
          feedback: Zähler und Nenner mal 3 – das ist gleichwertig.
        - label: "5/7"
          correct: true
        - label: "30/50"
          feedback: Zähler und Nenner mal 10 – das ist gleichwertig.
    hints:
      - Prüfe, ob Zähler und Nenner mit derselben Zahl malgenommen wurden.
    explanation: Bei 5/7 wurde zu Zähler und Nenner 2 addiert. Addieren ändert den Wert.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 2/3 und 4/6 sind gleich viel.
          right: true
        - text: Beim Erweitern wird der Bruch größer.
          right: false
          why: Nur die Schreibweise ändert sich, der Wert bleibt.
        - text: 3/5 = 4/6, weil oben und unten je 1 dazukommt.
          right: false
          why: Addieren verändert den Wert. Nur Malnehmen oder Teilen mit derselben Zahl ist erlaubt.
        - text: 10/15 lässt sich zu 2/3 kürzen.
          right: true

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Teile das Quadrat in 8 Felder und färbe so viel wie $\frac{3}{4}$.
    params:
      parts: 4
      shape: square
      partOptions:
        - 4
        - 8
        - 16
    answer:
      fraction: 6/8
      equivalent: false
    hints:
      - Bei 8 Feldern ist jedes Viertel in 2 Felder geteilt.
      - Aus 3 Vierteln werden $3 \cdot 2 = 6$ Achtel. Färbe 6 Felder.
    explanation: "$\\frac{3}{4} = \\frac{6}{8}$: Zähler und Nenner wurden mit 2 erweitert."

  - kind: problem
    id: intro-c2
    widget: fraction
    prompt: Das Sechseck hat 12 gleiche Teile. Färbe so viel wie $\frac{3}{4}$.
    params:
      parts: 12
      shape: hexagon
    answer:
      fraction: 3/4
    hints:
      - Wie viele Zwölftel ergeben ein Viertel?
      - Ein Viertel sind 3 Zwölftel. Färbe also $3 \cdot 3 = 9$ Teile.
    explanation: $\frac{3}{4} = \frac{9}{12}$ – erweitert mit 3.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Kürze vollständig: $\\frac{84}{126}$"
    answer:
      value: 2/3
      form: simplified
    hints:
      - Beide Zahlen sind durch 2, 3 und 7 teilbar.
      - Der größte gemeinsame Teiler ist 42.
    explanation: "84 : 42 = 2 und 126 : 42 = 3. Mit dem größten gemeinsamen Teiler kürzt du in einem Schritt."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: fraction
    prompt: Die Pizza zeigt $\frac{1}{3}$. Schneide sie in 12 Stücke und färbe gleich viel.
    params:
      parts: 3
      shape: circle
      shaded:
        - 0
      partOptions:
        - 3
        - 6
        - 12
    answer:
      fraction: 4/12
      equivalent: false
    hints:
      - Jedes Drittel wird in 4 Stücke geschnitten.
      - Färbe 4 der 12 Stücke.
    explanation: $\frac{1}{3} = \frac{4}{12}$ – Zähler und Nenner mal 4.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Warum ändert Erweitern nichts? $\\frac{2}{3} = \\frac{2 \\cdot 4}{3 \\cdot 4}$ heißt: mal $\\frac{4}{4}$. Und $\\frac{4}{4}$ ist eine ganze **Eins**. Mal 1 bleibt alles gleich."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Gleich $\frac{2}{3}$ oder nicht?
    params:
      buckets:
        - id: b1
          label: gleich 2/3
        - id: b2
          label: nicht gleich
      items:
        - label: 4/6
          bucket: b1
        - label: 10/15
          bucket: b1
        - label: 12/18
          bucket: b1
        - label: 3/4
          bucket: b2
        - label: 5/6
          bucket: b2
        - label: 9/12
          bucket: b2
    hints:
      - Kürze jeden Bruch.
      - 9/12 = 3/4 und 5/6 bleibt 5/6.
    explanation: 4/6, 10/15 und 12/18 kürzen sich zu 2/3. 3/4, 5/6 und 9/12 nicht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wann ist ein Bruch vollständig gekürzt?
    params:
      options:
        - label: Wenn Zähler und Nenner nur noch den Teiler 1 gemeinsam haben
          correct: true
        - label: Wenn der Zähler eine Primzahl ist
          feedback: 3/9 hat den Zähler 3 und lässt sich trotzdem kürzen.
        - label: Wenn beide Zahlen ungerade sind
          feedback: 9/15 ist ungerade durch ungerade und lässt sich durch 3 kürzen.
    hints:
      - Denk an 9/15.
    explanation: "Solche Zahlen heißen **teilerfremd**: Ihr größter gemeinsamer Teiler ist 1."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Kürze vollständig: $\\frac{91}{143}$"
    answer:
      value: 7/11
      form: simplified
    hints:
      - Weder 2, 3 noch 5 teilen. Probiere 7, 11, 13.
      - 91 = 7 · 13 und 143 = 11 · 13.
    explanation: Der ggT ist 13. $\frac{91}{143} = \frac{7}{11}$. Bei großen Zahlen hilft der euklidische Algorithmus.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Wie viele Brüche sind gleichwertig zu $\frac{1}{2}$?
    params:
      options:
        - label: Einer
          feedback: 2/4 ist auch gleich 1/2.
        - label: Zehn
          feedback: Warum aufhören? 100/200 geht auch.
        - label: Unendlich viele
          correct: true
    hints:
      - 1/2, 2/4, 3/6 …
      - Kann man immer weiter erweitern?
    explanation: n/2n für jedes n. Eine rationale Zahl ist eigentlich diese ganze Familie. Der gekürzte Bruch ist ihr Vertreter.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum $\frac{2}{4}$ und $\frac{1}{2}$ gleich viel sind.
    params:
      keywords:
        - - teil
          - stück
          - piece
          - part
          - slice
        - - doppelt
          - halb
          - zwei
          - double
          - half
          - twice
          - two
        - - gleich
          - same
          - equal
      sample: Bei 2/4 sind die Stücke halb so groß, dafür nimmt man doppelt so viele. Die Menge bleibt gleich.
    explanation: "Kernidee: feiner schneiden ändert die Menge nicht – Zähler und Nenner wachsen gemeinsam."
    difficulty: 3

srs:
  cards_from: ["erweitern", "kuerzen-variante"]
