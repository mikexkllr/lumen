id: stats.paradoxes.monty
type: concept
title: The Monty Hall problem
summary: Switching doubles your chance.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The question that angered experts
    body: "This game-show question made even maths professors angry. Uncover the story card by card. Then you decide: **stay or switch**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🚪
            front: Three doors
            back: Behind one door is a car, behind two a goat. You pick a door.
          - icon: 🐐
            front: The host
            back: He knows where the car is. He opens another door – always with a goat. Then you may switch.
          - icon: ✉️
            front: Thousands of letters
            back: "In 1990 Marilyn vos Savant gave an answer in a magazine. Thousands of readers, professors too, wrote: wrong!"
          - icon: 🤯
            front: The maths star
            back: Even Paul Erdős, one of the greatest mathematicians, only believed the answer after a simulation.

  - kind: problem
    id: wechseln
    widget: choice
    body: Behind one of three doors is a car, behind the others are goats. You pick door 1. The host knows where everything is and opens door 3, a goat.
    prompt: Should you switch to door 2?
    params:
      options:
        - { label: "Yes, switching wins in 2 of 3 cases", correct: true }
        - { label: "Doesn't matter, it's 50-50 now", feedback: "Almost everyone thinks so. But the host never opens the car, and that is information." }
        - { label: "No, staying is safer", feedback: "Your first pick had only a 1/3 chance. Opening a door does not change that." }
    hints:
      - How likely was your first pick to be right?
    explanation: Your door has 1/3. The remaining 2/3 now sit entirely on the other closed door.

  - kind: explain
    id: s2
    body: Try it out. Let the game run 100 times. The bars show how often each strategy wins.
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Stay, weight: 1 }, { label: Switch, weight: 2 }]
        sample: [10, 100]

  - kind: explain
    id: s3
    body: Why does 50-50 feel so right?
    reveal:
      body: Because we only see the two doors. We overlook that the host does not open at random. He helps you, and you only have to switch.

  - kind: problem
    id: hundert
    widget: numeric
    prompt: Now 100 doors. You pick one. The host opens 98 goat doors. What is your chance of winning if you switch?
    params: { unit: "%" }
    answer: { value: 99 }
    feedback:
      - when: "numval(state.input) == 50"
        misconception: equal-chance
        text: Your first door had only 1%. The rest moves to the last door.
    hints:
      - How likely was your first pick to be right?
    explanation: Your door has 1%, the other has 99%. Here you can see the effect clearly.

  - kind: problem
    id: zufaellig
    widget: choice
    prompt: Suppose the host opens a door at random, and by chance it is a goat. Is switching worth it now?
    params:
      options:
        - { label: "Then it really is 50-50", correct: true }
        - { label: "Switching stays at 2/3", feedback: "The advantage comes only from the host knowing." }
    hints:
      - Where did the advantage come from?
    explanation: Without his knowledge, the goat reveals nothing special. Then both doors are equally good.

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: You stay with your first door. Mark your chance of winning.
    params:
      min: 0
      max: 1
      ticks: 3
      labels: fractions
    answer:
      value: 1/3
    hints:
      - What was the chance of hitting the car with your first pick?
      - "The host changes nothing about that: it stays 1 in 3."
    explanation: "If you stay, you only win when your first pick was right: $\\frac{1}{3}$. The rest, $\\frac{2}{3}$, belongs to switching."

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: Why does switching win in 2 of 3 cases? Order the reasoning.
    params:
      items:
        - label: Your first pick hits the car with 1/3.
        - label: With 2/3 the car is behind one of the other two doors.
        - label: Of those two the host always opens a goat.
        - label: The whole 2/3 now rests on the remaining door.
    hints:
      - Start with the chance of your first pick.
    explanation: "The host gives you information: he shows where the car is **not**."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: in the goat problem with 100 doors the host opens 98 goat doors. How likely do you win by switching?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 99
      tolerance: 2
    explanation: 99%. Your first pick is right in only 1 of 100 cases.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Now with four doors: you pick one. The host opens one of the other three – always a goat. You switch at random to one of the two remaining doors. What is your chance? As a fraction."
    answer:
      value: 3/8
    feedback:
      - when: numval(state.input) == 1 / 4
        misconception: stay-chance
        text: That is the chance if you stay. Switching is better.
      - when: numval(state.input) == 1 / 2
        misconception: fifty-fifty
        text: The two doors share 3/4 between them, not 1.
    hints:
      - With 3/4 the car is behind one of the three other doors.
      - After the opening two doors share those 3/4.
    explanation: 3/4 ÷ 2 = 3/8 – more than the 1/4 for staying. The host's knowledge pushes probability onto the closed doors.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: buckets
    prompt: What is the chance of winning by switching?
    params:
      buckets:
        - id: b1
          label: 1/2
        - id: b2
          label: 2/3
      items:
        - label: Host knows, shows a goat
          bucket: b2
        - label: Host trips, a goat shows up
          bucket: b1
        - label: "A guest opens blindly: goat"
          bucket: b1
        - label: Host must always show a goat
          bucket: b2
    hints:
      - What matters is whether the goat was shown on purpose.
      - Goats revealed by chance say nothing about your door.
    explanation: Only a host who knows and must always open a goat makes switching 2/3. If someone opens at random, it stays 1/2 to 1/2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Three prisoners, one will be pardoned. A asks the guard: “Name one of the other two who will be executed.” The guard says: “B.” What is A’s chance now?"
    params:
      options:
        - label: Still 1/3 – and C’s has risen to 2/3
          correct: true
        - label: 1/2 – only two are left, after all
          feedback: The guard could never name A. His answer says nothing about A.
        - label: 2/3
          feedback: The 2/3 belongs to C.
    hints:
      - It is the same problem as with the goats.
    explanation: The guard plays the host, A’s “door” is the first pick. The same structure in a different guise.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: You pick door 1. The host knows and **always** opens door 3 when he is allowed. Today he opens door 2. What is the chance if you switch to door 3?
    params:
      options:
        - label: 100 % – otherwise he would have opened door 3
          correct: true
        - label: The host's preference reveals more here.
          feedback: Die Vorliebe des Moderators verrät hier mehr.
        - label: Check when he would open door 2 at all.
          feedback: Prüfe, wann er Tür 2 überhaupt öffnet.
    hints:
      - When does he open door 2 although he prefers door 3?
      - Only if the car is behind door 3.
    explanation: He only falls back to door 2 when door 3 hides the car. The probability depends on how the information arises – that is Bayes.
    difficulty: 3

srs:
  cards_from: [wechseln, hundert]
