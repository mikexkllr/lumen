id: stats.paradoxes.simpson
type: concept
title: Das Simpson-Paradox
summary: Besser in jeder Gruppe, schlechter insgesamt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: kliniken
    widget: choice
    body: Klinik A rettet bei leichten Fällen 99 %, bei schweren 80 %. Klinik B rettet bei leichten 95 %, bei schweren 70 %.
    prompt: Welche Klinik ist besser?
    params:
      options:
        - { label: A – sie ist in beiden Gruppen besser, correct: true }
        - { label: B, feedback: "In jeder einzelnen Gruppe liegt A vorn." }
    hints:
      - Vergleiche Gruppe für Gruppe.
    explanation: A ist in beiden Gruppen besser. Trotzdem kann ihre Gesamtquote schlechter aussehen …

  - kind: problem
    id: gesamt
    widget: numeric
    body: Klinik A behandelt vor allem schwere Fälle – 100 leichte und 900 schwere. Mit 99 % und 80 % überleben 99 und 720.
    prompt: Wie viel Prozent überleben in Klinik A insgesamt? Runde auf ganze Prozent.
    params: { unit: "%" }
    answer: { value: 82, tolerance: 1 }
    hints:
      - (99 + 720) / 1000.
    explanation: 819 von 1000 – also rund 82 %.

  - kind: problem
    id: gesamt-b
    widget: numeric
    body: Klinik B behandelt fast nur leichte Fälle – 900 leichte und 100 schwere. Mit 95 % und 70 % überleben 855 und 70.
    prompt: Und wie viel Prozent überleben in Klinik B insgesamt?
    params: { unit: "%" }
    answer: { value: 93, tolerance: 1 }
    hints:
      - (855 + 70) / 1000.
    explanation: 925 von 1000 – rund 93 %. B sieht insgesamt besser aus, obwohl A in jeder Gruppe gewinnt.

  - kind: explain
    id: s4
    body: |
      Das ist das **Simpson-Paradox**. Eine versteckte Größe – hier die Schwere der Fälle – kehrt den Gesamtvergleich um.

  - kind: problem
    id: lehre
    widget: choice
    prompt: Was lernst du daraus für Statistiken in den Nachrichten?
    params:
      options:
        - { label: "Nach Untergruppen fragen, bevor man vergleicht", correct: true }
        - { label: Gesamtzahlen sind immer richtig, feedback: "Sie stimmen – führen aber in die Irre, wenn die Gruppen ungleich verteilt sind." }
        - { label: Prozente sind nutzlos, feedback: "Nicht nutzlos – man muss nur wissen, worauf sie sich beziehen." }
    hints:
      - Was hat den Vergleich eben umgedreht?
    explanation: Erst wenn man Gleiches mit Gleichem vergleicht, sieht man die Wahrheit.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Eine versteckte [[Größe]] kann den Gesamtvergleich [[umkehren]]. Darum vergleicht man nur Gleiches mit Gleichem.
      distractors:
        - Farbe
        - verdoppeln

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Uni nimmt 44 % der Männer und 35 % der Frauen an. In **jedem** einzelnen Fach ist die Quote der Frauen aber gleich hoch oder höher. Wie kommt das?
    params:
      options:
        - label: Frauen bewarben sich häufiger in Fächern mit sehr niedriger Annahmequote
          correct: true
        - label: Die Zahlen sind gefälscht
          feedback: So geschehen 1973 in Berkeley – die Zahlen stimmten.
        - label: Die Fächer benachteiligen Frauen heimlich
          feedback: Die Fachzahlen zeigen das Gegenteil.
    hints:
      - Wer bewirbt sich wo?
    explanation: Die versteckte Größe ist die Fächerwahl. Der Gesamtwert mischt Gruppen mit verschiedenen Ausgangslagen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Eine echte Studie zu Nierensteinen (1986): Methode A heilte 81 von 87 kleinen und 192 von 263 großen Steinen. Wie viel Prozent heilte A insgesamt?"
    answer:
      value: 78
      tolerance: 0.5
    hints:
      - "Insgesamt: (81 + 192) von (87 + 263)."
      - "273 : 350."
    explanation: 273/350 = 78 %. Bei kleinen Steinen 93 %, bei großen 73 %.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Methode B heilte 234 von 270 kleinen (87 %) und 55 von 80 großen Steinen (69 %). Wie viel Prozent heilte B insgesamt? Gerundet.
    answer:
      value: 83
      tolerance: 0.5
    hints:
      - "Insgesamt: (234 + 55) von 350."
      - "289 : 350."
    explanation: 289/350 ≈ 83 %. B ist insgesamt besser – aber in **beiden** Gruppen schlechter als A!
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: choice
    prompt: Wie kann A in jeder Gruppe gewinnen und insgesamt verlieren?
    params:
      options:
        - label: A bekam vor allem die schweren Fälle – große Steine
          correct: true
        - label: Die Zahlen sind falsch addiert
          feedback: "Prüfe nach: 273/350 und 289/350 stimmen."
        - label: B ist in Wahrheit besser
          feedback: In jeder einzelnen Gruppe heilt A mehr.
    hints:
      - Vergleiche, wie viele große Steine jede Methode behandelt hat.
      - "A: 263 große, B: nur 80."
    explanation: Die Steingröße ist der versteckte Faktor. Sie beeinflusst, welche Methode gewählt wird, **und** wie gut die Heilung gelingt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wann soll man der Gesamtzahl trauen und wann den Untergruppen?
    params:
      options:
        - label: Das entscheidet das Wissen über Ursachen – die Zahlen allein verraten es nicht
          correct: true
        - label: Immer den Untergruppen
          feedback: Wäre die Gruppe eine **Folge** der Behandlung, wäre die Gesamtzahl richtig.
        - label: Immer der Gesamtzahl
          feedback: In den Klinik- und Uni-Beispielen führt sie in die Irre.
    hints:
      - Ist die Gruppierung eine Ursache – oder eine Folge?
    explanation: Statistik braucht ein **kausales Modell**. Das ist die zentrale Einsicht von Judea Pearl.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Faire Rechnung: Wie viel Prozent hätte A geheilt, wenn es dieselbe Mischung wie B bekommen hätte (270 kleine, 80 große)? A heilt 93,1 % der kleinen und 73,0 % der großen. Auf eine Stelle."
    answer:
      value: 88.5
      tolerance: 0.3
    hints:
      - "Kleine: 0,931 · 270. Große: 0,730 · 80."
      - 251,4 + 58,4 = 309,8 von 350.
    explanation: Etwa 88,5 % – klar über B mit 82,6 %. Diese **Standardisierung** vergleicht beide Methoden an derselben Fallmischung.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux das Simpson-Paradox am Beispiel der Nierensteine.
    params:
      keywords:
        - - gruppe
          - klein
          - groß
          - group
          - small
          - large
        - - schwer
          - versteckt
          - mischung
          - hard
          - hidden
          - mix
        - - insgesamt
          - gesamt
          - overall
          - total
          - umkehr
          - revers
      sample: A ist bei kleinen und bei großen Steinen besser. Aber A bekam viel mehr schwere, große Steine. Diese versteckte Mischung zieht die Quote insgesamt nach unten und kehrt den Vergleich um.
    explanation: Wer nur Gesamtquoten vergleicht, vergleicht auch die Mischung der Fälle. Erst Untergruppen oder Standardisierung zeigen den fairen Vergleich.
    difficulty: 3

srs:
  cards_from: [kliniken, lehre]
