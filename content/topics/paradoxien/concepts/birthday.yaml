id: stats.paradoxes.birthday
type: concept
title: Das Geburtstagsparadox
summary: Schon 23 Leute reichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Planet mit 10 Tagen
    body: Auf einem fernen Planeten hat das Jahr nur 10 Tage. Zieh Geburtstage, einen nach dem anderen, und schau in die Liste. Nach wie vielen Gästen haben zwei am **selben Tag** Geburtstag? Setz zurück und probier es noch mal.
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: Tag 1
          - label: Tag 2
          - label: Tag 3
          - label: Tag 4
          - label: Tag 5
          - label: Tag 6
          - label: Tag 7
          - label: Tag 8
          - label: Tag 9
          - label: Tag 10
        sample:
          - 1

  - kind: problem
    id: schaetzen
    widget: choice
    prompt: Ab wie vielen Leuten in einem Raum haben mit über 50 % zwei am selben Tag Geburtstag?
    params:
      layout: grid
      options:
        - { label: "23", correct: true }
        - { label: "183", feedback: "Das wäre die Hälfte von 365. Es geht aber um irgendein Paar." }
        - { label: "60", feedback: "Bei 60 Leuten ist es schon fast sicher – über 99 %." }
        - { label: "100", feedback: "Viel zu viele." }
    hints:
      - Es muss nicht dein Geburtstag sein – irgendein Paar reicht.
    explanation: Schon 23 Leute genügen. Bei 50 Leuten sind es 97 %.

  - kind: explain
    id: s2
    body: |
      Der Trick: Es zählen **Paare**, nicht Personen. Bei 23 Leuten gibt es überraschend viele mögliche Paare.

  - kind: problem
    id: paare
    widget: numeric
    prompt: Wie viele verschiedene Paare gibt es bei {{n}} Leuten?
    params: { unit: Paare }
    answer: { value: "{{n * (n - 1) / 2}}" }
    feedback:
      - when: "numval(state.input) == n * (n - 1)"
        misconception: double-count
        text: Jedes Paar hast du doppelt gezählt.
    hints:
      - Jeder mit jedem, geteilt durch 2.
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}} Paare."
    variants:
      params: { n: "choice[10,23,30,50]" }
      defaults: { n: 23 }

  - kind: problem
    id: eigener
    widget: choice
    prompt: Wie viele Leute braucht es, damit mit über 50 % jemand an DEINEM Geburtstag Geburtstag hat?
    params:
      options:
        - { label: Rund 250, correct: true }
        - { label: "23", feedback: "Das gilt für irgendein Paar. Für dein Datum ist es viel schwerer." }
        - { label: "183", feedback: "Nahe dran, aber manche teilen ja untereinander Tage." }
    hints:
      - Jetzt zählt nur noch jede einzelne Person gegen dich.
    explanation: Rund 253 Leute. Hier gibt es keine Paar-Explosion.

  - kind: explain
    id: s5
    body: Wo nutzt man diesen Effekt?
    reveal:
      body: In der Kryptographie. Sogenannte Geburtstagsangriffe suchen zwei Dateien mit gleicher Prüfsumme – das geht viel schneller als gedacht.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Jedes Paar ist eine Chance auf einen gemeinsamen Geburtstag. Stell ein, wie viele Paare es bei 3, 4 und 5 Leuten gibt.
    params:
      labels:
        - 3 Leute
        - 4 Leute
        - 5 Leute
      values:
        - 0
        - 0
        - 0
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 12
      title: Paare
    answer:
      values:
        - 3
        - 6
        - 10
    hints:
      - Bei A, B und C gibt es die Paare AB, AC und BC.
      - "Jede neue Person bildet mit allen anderen ein Paar: 3 + 3 = 6, dann 6 + 4 = 10."
    explanation: Die **Paare** wachsen viel schneller als die Leute. Darum reichen schon wenige Gäste für einen gemeinsamen Geburtstag.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie groß ist die Wahrscheinlichkeit, dass **drei** zufällige Menschen alle an verschiedenen Tagen Geburtstag haben? In Prozent, auf eine Stelle. (364/365 · 363/365)
    params:
      unit: "%"
    answer:
      value: 99.2
      tolerance: 0.1
    hints:
      - Der zweite hat 364 freie Tage, der dritte 363.
    explanation: 99,2 %. Jede weitere Person multipliziert einen etwas kleineren Faktor dazu – bei 23 ist man unter 50 %.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Vier Menschen. Wie wahrscheinlich haben mindestens zwei am selben Tag Geburtstag? In Prozent, auf eine Stelle. (364/365 · 363/365 · 362/365 ≈ 0,9836)
    answer:
      value: 1.6
      tolerance: 0.05
    hints:
      - Das Produkt ist die Chance, dass alle verschieden sind.
      - Rechne 1 − 0,9836.
    explanation: 1 − 0,9836 ≈ 1,6 %. Bei 4 Menschen gibt es nur 6 Paare. Bei 23 sind es schon 253.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: In einer Gruppe sind 70 Menschen. Wie wahrscheinlich haben mindestens zwei am selben Tag Geburtstag? In Prozent."
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 99.9
      tolerance: 3
    explanation: Etwa 99,9 %. Bei 70 Menschen gibt es 2415 Paare – fast sicher passt eines.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Faustregel: Für eine 50-%-Chance auf eine Übereinstimmung braucht man etwa 1,2 · √N Versuche. Wie viele sind das bei N = 1 000 000 Möglichkeiten?"
    answer:
      value: 1200
    hints:
      - √1 000 000 = 1000.
    explanation: Nur 1200 statt einer halben Million. Darum sind kurze Zufalls-IDs schneller doppelt vergeben, als man denkt.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Eine Näherung: P(Treffer) ≈ 1 − e^(−Paare/365). Bei 23 Menschen gibt es 253 Paare, und 253/365 ≈ 0,693 ≈ ln 2. Welcher Wert in Prozent kommt heraus?"
    answer:
      value: 50
      tolerance: 0.5
    hints:
      - e^(−ln 2) = 1/2.
      - Rechne 1 − 1/2.
    explanation: Etwa 50 % – genau gerechnet sind es 50,7 %. Jedes Paar trifft mit 1/365, und seltene Treffer verhalten sich fast unabhängig.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Ein Prüfwert (Hash) hat 2⁶⁴ mögliche Werte. Ab etwa wie vielen Dateien findet man wahrscheinlich zwei mit gleichem Hash?
    params:
      options:
        - label: Etwa 2³² – rund 4 Milliarden
          correct: true
        - label: Etwa 2⁶³ – die Hälfte
          feedback: Das gilt für einen **bestimmten** Hash, nicht für irgendein Paar.
        - label: Erst nach 2⁶⁴ Dateien
          feedback: "Das Paradox sagt: viel früher."
    hints:
      - Die Faustregel lautet etwa √N.
      - √(2⁶⁴) = 2³².
    explanation: "Nach etwa √N Versuchen wird eine Kollision wahrscheinlich. Darum brauchen sichere Hashes 256 Bit: √(2²⁵⁶) = 2¹²⁸ ist unerreichbar."
    difficulty: 3

srs:
  cards_from: [schaetzen, paare]
