id: stats.paradoxes.gambler
type: concept
title: Wie Zufall wirklich aussieht
summary: Serien sind normal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: echt
    widget: choice
    prompt: Welche Folge von 20 Münzwürfen stammt eher von einer echten Münze?
    params:
      options:
        - { label: "KKZKKKKZZKZZZKZKKKZZ – mit langen Serien", correct: true }
        - { label: "KZKZZKZKKZKZZKZKZKZK – sauber abwechselnd", feedback: "Echter Zufall hat Klumpen. Zu gleichmäßige Folgen sind verdächtig." }
    hints:
      - Wie oft kommen bei echten Würfen 4 Gleiche in Folge?
    explanation: In 20 Würfen sind Serien von 4 oder mehr sehr wahrscheinlich. Menschen erfinden zu wenige.

  - kind: explain
    id: s2
    body: |
      Wir erwarten, dass Zufall **gleichmäßig** aussieht. Echter Zufall bildet aber Klumpen und Serien.
      Der Glaube, nach Rot müsse bald Schwarz kommen, heißt **Spielerfehlschluss**.

  - kind: problem
    id: serie
    widget: numeric
    prompt: Wie wahrscheinlich ist es, dass {{n}} Münzwürfe alle gleich ausfallen – alle Kopf oder alle Zahl? Als Bruch.
    params: { placeholder: "Bruch" }
    answer: { value: "2/{{2 ** n}}" }
    hints:
      - "Alle Kopf: 1/{{2 ** n}}. Alle Zahl genauso."
    explanation: "2/{{2 ** n}} = 1/{{2 ** (n - 1)}}."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 4 }

  - kind: problem
    id: casino
    widget: choice
    prompt: 1913 kam in Monte Carlo 26-mal Schwarz in Folge. Was taten viele Spieler?
    params:
      options:
        - { label: Sie setzten immer mehr auf Rot – und verloren., correct: true }
        - { label: Sie hörten auf zu spielen., feedback: "Leider nicht – sie hielten Rot für überfällig." }
    hints:
      - Spielerfehlschluss.
    explanation: Sie glaubten, Rot sei »dran«. Das Rad hatte kein Gedächtnis.

  - kind: problem
    id: mix-c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Nach fünfmal Rot ist Schwarz »fällig«.
          right: false
          why: Die Kugel hat kein Gedächtnis.
        - text: Echter Zufall bildet Serien und Klumpen.
          right: true
        - text: Zehn Münzwürfe zeigen immer etwa fünfmal Kopf.
          right: false
          why: Auch 8 oder 2 kommen öfter vor, als man denkt.
        - text: Bei sehr vielen Würfen pendelt sich der Anteil ein.
          right: true
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du wirfst 100-mal eine Münze. Wie lang ist die längste Serie gleicher Ergebnisse typischerweise? (Etwa log₂ 100)
    answer:
      value: 7
      tolerance: 1
    hints:
      - 2⁷ = 128.
    explanation: Etwa 7. Wer sich Münzwürfe »ausdenkt«, baut fast nie so lange Serien ein – daran erkennt man die Fälschung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Im Basketball glaubt man an die »heiße Hand«: Wer dreimal traf, trifft eher wieder. Was zeigt die Statistik?"
    params:
      options:
        - label: Der Effekt ist viel kleiner, als es sich anfühlt – das meiste sind gewöhnliche Zufallsserien
          correct: true
        - label: Er ist riesig
          feedback: Unser Gehirn sieht Muster, wo Zufall herrscht.
        - label: Nach Treffern trifft man schlechter
          feedback: Auch das zeigen die Daten nicht eindeutig.
    hints:
      - Serien entstehen auch bei reinem Zufall.
    explanation: Wir sind Mustersucher. Die **Clustering-Illusion** lässt Zufallsserien bedeutsam erscheinen.
    difficulty: 3

srs:
  cards_from: [echt, serie]
