id: stats.paradoxes.gambler
type: concept
title: Wie Zufall wirklich aussieht
summary: Serien sind normal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zufall selbst gemacht
    body: "Erfinde 20 Münzwürfe, ohne zu werfen: Ein gefärbtes Feld ist Zahl, ein leeres Kopf. Tippe dir eine Folge zusammen, die wirklich **zufällig** aussieht. Gleich siehst du, ob echte Münzen das auch so machen."
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 2
        cols: 10
        counter: true

  - kind: problem
    id: echt
    widget: choice
    prompt: Welche Folge von 20 Münzwürfen stammt eher von einer echten Münze?
    params:
      options:
        - { label: "KKZKKKKZZKZZZKZKKKZZ – mit langen Serien", correct: true }
        - { label: "KZKZZKZKKZKZZKZKZKZK – sauber abwechselnd", feedback: "Echter Zufall hat Klumpen. Zu gleichmäßige Folgen sind verdächtig." }
    hints:
      - Wie oft kommen bei echten Würfen 4 Gleiche in Folge?
    explanation: In 20 Würfen sind Serien von 4 oder mehr sehr wahrscheinlich. Menschen erfinden zu wenige.

  - kind: explain
    id: s2
    body: |
      Wir erwarten, dass Zufall **gleichmäßig** aussieht. Echter Zufall bildet aber Klumpen und Serien.
      Der Glaube, nach Rot müsse bald Schwarz kommen, heißt **Spielerfehlschluss**.

  - kind: problem
    id: serie
    widget: numeric
    prompt: Wie wahrscheinlich ist es, dass {{n}} Münzwürfe alle gleich ausfallen – alle Kopf oder alle Zahl? Als Bruch.
    params: { placeholder: "Bruch" }
    answer: { value: "2/{{2 ** n}}" }
    hints:
      - "Alle Kopf: 1/{{2 ** n}}. Alle Zahl genauso."
    explanation: "2/{{2 ** n}} = 1/{{2 ** (n - 1)}}."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 4 }

  - kind: problem
    id: casino
    widget: choice
    prompt: 1913 kam in Monte Carlo 26-mal Schwarz in Folge. Was taten viele Spieler?
    params:
      options:
        - { label: Sie setzten immer mehr auf Rot – und verloren., correct: true }
        - { label: Sie hörten auf zu spielen., feedback: "Leider nicht – sie hielten Rot für überfällig." }
    hints:
      - Spielerfehlschluss.
    explanation: Sie glaubten, Rot sei »dran«. Das Rad hatte kein Gedächtnis.

  - kind: problem
    id: mix-c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Nach fünfmal Rot ist Schwarz »fällig«.
          right: false
          why: Die Kugel hat kein Gedächtnis.
        - text: Echter Zufall bildet Serien und Klumpen.
          right: true
        - text: Zehn Münzwürfe zeigen immer etwa fünfmal Kopf.
          right: false
          why: Auch 8 oder 2 kommen öfter vor, als man denkt.
        - text: Bei sehr vielen Würfen pendelt sich der Anteil ein.
          right: true
      left: Falsch
      right: Wahr

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: Eine faire Münze zeigt fünfmal hintereinander Kopf. Markiere die Chance auf Kopf beim sechsten Wurf.
    params:
      min: 0
      max: 1
      ticks: 4
      labels: fractions
    answer:
      value: 1/2
    hints:
      - Hat die Münze ein Gedächtnis?
      - Jeder Wurf fängt neu an – wie beim ersten Mal.
    explanation: Immer noch $\frac{1}{2}$. Die Münze weiß nichts von der Serie. Wer jetzt auf Zahl setzt, weil sie »dran« sei, tappt in den **Spielerfehlschluss**.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du wirfst 100-mal eine Münze. Wie lang ist die längste Serie gleicher Ergebnisse typischerweise? (Etwa log₂ 100)
    answer:
      value: 7
      tolerance: 1
    hints:
      - 2⁷ = 128.
    explanation: Etwa 7. Wer sich Münzwürfe »ausdenkt«, baut fast nie so lange Serien ein – daran erkennt man die Fälschung.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie oft wechselt das Ergebnis (Kopf zu Zahl oder umgekehrt) bei 20 echten Münzwürfen im Schnitt?"
    params:
      min: 0
      max: 19
    answer:
      value: 9.5
      tolerance: 2
    explanation: "Zwischen 20 Würfen gibt es 19 Übergänge, jeder wechselt mit 50 %: im Schnitt 9,5. Erfundene Folgen wechseln meist viel öfter – daran erkennt man sie."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "Lotto: Ist 1-2-3-4-5-6 unwahrscheinlicher als 4-11-17-28-33-41?"
    params:
      options:
        - label: Nein, jede Reihe hat genau dieselbe Chance
          correct: true
        - label: Ja, Zufall bildet keine Muster
          feedback: Zufall bildet alle Muster gleich oft.
        - label: Ja, weil sie schon mal kam
          feedback: Die Kugeln haben kein Gedächtnis.
    hints:
      - Wie viele Reihen gibt es, und welche ist bevorzugt?
      - Jede Reihe ist eine von 13 983 816.
    explanation: Beide haben 1 zu 13 983 816. »Muster« ist nur unser Etikett. Unordentlich wirkende Reihen gibt es einfach viel mehr.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Im Basketball glaubt man an die »heiße Hand«: Wer dreimal traf, trifft eher wieder. Was zeigt die Statistik?"
    params:
      options:
        - label: Der Effekt ist viel kleiner, als es sich anfühlt – das meiste sind gewöhnliche Zufallsserien
          correct: true
        - label: Er ist riesig
          feedback: Unser Gehirn sieht Muster, wo Zufall herrscht.
        - label: Nach Treffern trifft man schlechter
          feedback: Auch das zeigen die Daten nicht eindeutig.
    hints:
      - Serien entstehen auch bei reinem Zufall.
    explanation: Wir sind Mustersucher. Die **Clustering-Illusion** lässt Zufallsserien bedeutsam erscheinen.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Ein **Lauf** ist eine Serie gleicher Ergebnisse. Bei n Würfen gibt es im Schnitt 1 + (n − 1)/2 Läufe. Wie viele sind es bei {{n}} Würfen?
    answer:
      value: "{{1 + (n - 1) / 2}}"
    hints:
      - Jeder Wechsel startet einen neuen Lauf.
      - "Der erste Lauf plus die erwarteten Wechsel: 1 + {{(n - 1) / 2}}."
    explanation: 1 + {{(n - 1) / 2}} = {{1 + (n - 1) / 2}}. Der **Runs-Test** vergleicht die gezählten Läufe damit – zu viele Läufe verraten erfundene Daten.
    difficulty: 3
    variants:
      params:
        n: choice[11,21,41,101]
      defaults:
        n: 21

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum echter Zufall Serien und Klumpen bildet.
    params:
      keywords:
        - - unabhängig
          - gedächtnis
          - independent
          - memory
        - - serie
          - lauf
          - klump
          - streak
          - run
          - clump
        - - gleichmäßig
          - wechsel
          - even
          - switch
          - alternat
      sample: Jeder Wurf ist unabhängig, die Münze hat kein Gedächtnis. Darum wechselt sie nur in der Hälfte der Fälle. So entstehen von allein Serien und Klumpen. Gleichmäßig wirkende Folgen sind eher erfunden.
    explanation: Wir erwarten zu viele Wechsel. Echter Zufall wechselt nur mit 50 % – und bildet darum Serien.
    difficulty: 3

srs:
  cards_from: [echt, serie]
