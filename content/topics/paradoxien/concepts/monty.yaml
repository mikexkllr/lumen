id: stats.paradoxes.monty
type: concept
title: Das Ziegenproblem
summary: Wechseln verdoppelt die Chance.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Frage, die Profis ärgerte
    body: "Diese Frage aus einer Spielshow hat sogar Mathe-Profis wütend gemacht. Deck die Geschichte Karte für Karte auf. Dann entscheidest du selbst: **bleiben oder wechseln**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🚪
            front: Drei Türen
            back: Hinter einer Tür steht ein Auto, hinter zwei eine Ziege. Du wählst eine Tür.
          - icon: 🐐
            front: Der Moderator
            back: Er weiß, wo das Auto steht. Er öffnet eine andere Tür – immer mit Ziege. Dann darfst du wechseln.
          - icon: ✉️
            front: Tausende Briefe
            back: "Marilyn vos Savant gab 1990 in einer Zeitschrift eine Antwort. Tausende Leser, auch Professoren, schrieben: falsch!"
          - icon: 🤯
            front: Der Mathe-Star
            back: Selbst Paul Erdős, einer der größten Mathematiker, glaubte die Lösung erst nach einer Simulation.

  - kind: problem
    id: wechseln
    widget: choice
    body: Hinter einer von drei Türen steht ein Auto, hinter den anderen Ziegen. Du wählst Tür 1. Der Moderator kennt alles und öffnet Tür 3 – eine Ziege.
    prompt: Solltest du zu Tür 2 wechseln?
    params:
      options:
        - { label: "Ja – Wechseln gewinnt in 2 von 3 Fällen", correct: true }
        - { label: "Egal – jetzt steht es 50 zu 50", feedback: "Das denken fast alle. Der Moderator öffnet aber nie das Auto – das ist eine Information." }
        - { label: "Nein – bleiben ist sicherer", feedback: "Deine erste Wahl hatte nur 1/3 Chance. Daran ändert das Öffnen nichts." }
    hints:
      - Wie wahrscheinlich war deine erste Wahl richtig?
    explanation: Deine Tür hat 1/3. Die restlichen 2/3 stecken jetzt allein in der anderen geschlossenen Tür.

  - kind: explain
    id: s2
    body: Probier es aus – lass das Spiel 100-mal laufen. Die Balken zeigen, welche Strategie wie oft gewinnt.
    visual:
      widget: distribution
      interactive: true
      params:
        items: [{ label: Bleiben, weight: 1 }, { label: Wechseln, weight: 2 }]
        sample: [10, 100]

  - kind: explain
    id: s3
    body: Warum fühlt sich 50 zu 50 so richtig an?
    reveal:
      body: Weil wir nur die zwei Türen sehen. Wir übersehen, dass der Moderator nicht zufällig öffnet. Er hilft dir – du musst nur wechseln.

  - kind: problem
    id: hundert
    widget: numeric
    prompt: Jetzt 100 Türen. Du wählst eine. Der Moderator öffnet 98 Ziegen-Türen. Wie groß ist deine Gewinnchance beim Wechseln?
    params: { unit: "%" }
    answer: { value: 99 }
    feedback:
      - when: "numval(state.input) == 50"
        misconception: equal-chance
        text: Deine erste Tür hatte nur 1 %. Der Rest wandert zur letzten Tür.
    hints:
      - Wie wahrscheinlich hast du beim ersten Mal richtig gewählt?
    explanation: Deine Tür hat 1 %, die andere 99 %. Hier sieht man den Effekt deutlich.

  - kind: problem
    id: zufaellig
    widget: choice
    prompt: Angenommen, der Moderator öffnet zufällig eine Tür – und zufällig ist es eine Ziege. Lohnt sich Wechseln jetzt?
    params:
      options:
        - { label: "Dann ist es wirklich 50 zu 50", correct: true }
        - { label: "Wechseln bleibt bei 2/3", feedback: "Der Vorteil kommt allein daher, dass der Moderator Bescheid weiß." }
    hints:
      - Woher kam eben der Vorteil?
    explanation: Ohne sein Wissen verrät die Ziege nichts Besonderes. Dann sind beide Türen gleich gut.

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: Du bleibst bei deiner ersten Tür. Markiere deine Gewinnchance.
    params:
      min: 0
      max: 1
      ticks: 3
      labels: fractions
    answer:
      value: 1/3
    hints:
      - Wie groß war die Chance, schon beim ersten Tipp das Auto zu treffen?
      - "Der Moderator ändert daran nichts: Es bleibt 1 von 3."
    explanation: "Beim Bleiben gewinnst du nur, wenn dein erster Tipp stimmte: $\\frac{1}{3}$. Der Rest, $\\frac{2}{3}$, gehört dem Wechseln."

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: Warum gewinnt Wechseln in 2 von 3 Fällen? Ordne die Überlegung.
    params:
      items:
        - label: Deine erste Wahl trifft das Auto mit 1/3.
        - label: Mit 2/3 steht das Auto hinter einer der beiden anderen Türen.
        - label: Der Moderator öffnet von diesen beiden immer eine Ziege.
        - label: Die ganzen 2/3 liegen jetzt auf der verbleibenden Tür.
    hints:
      - Beginne mit der Chance deiner ersten Wahl.
    explanation: "Der Moderator gibt dir Information: Er zeigt, wo das Auto **nicht** ist."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Beim Ziegenproblem mit 100 Türen öffnet der Moderator 98 Ziegentüren. Wie wahrscheinlich gewinnst du durch Wechseln?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 99
      tolerance: 2
    explanation: 99 %. Deine erste Wahl trifft nur in 1 von 100 Fällen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Jetzt mit vier Türen: Du wählst eine. Der Moderator öffnet eine der drei anderen – immer eine Ziege. Du wechselst zufällig auf eine der zwei übrigen. Wie groß ist deine Chance? Als Bruch."
    answer:
      value: 3/8
    feedback:
      - when: numval(state.input) == 1 / 4
        misconception: stay-chance
        text: Das ist die Chance beim Bleiben. Wechseln ist besser.
      - when: numval(state.input) == 1 / 2
        misconception: fifty-fifty
        text: Die zwei Türen teilen sich zusammen 3/4, nicht 1.
    hints:
      - Mit 3/4 steckt das Auto hinter einer der drei anderen Türen.
      - Nach dem Öffnen teilen sich zwei Türen diese 3/4.
    explanation: "3/4 : 2 = 3/8 – mehr als die 1/4 beim Bleiben. Das Wissen des Moderators schiebt Wahrscheinlichkeit auf die geschlossenen Türen."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: buckets
    prompt: Wie groß ist die Gewinnchance beim Wechseln?
    params:
      buckets:
        - id: b1
          label: 1/2
        - id: b2
          label: 2/3
      items:
        - label: Er weiß Bescheid, zeigt eine Ziege
          bucket: b2
        - label: Er stolpert, eine Ziege fällt raus
          bucket: b1
        - label: "Ein Gast öffnet blind: Ziege"
          bucket: b1
        - label: Er muss immer eine Ziege zeigen
          bucket: b2
    hints:
      - Entscheidend ist, ob die Ziege mit Absicht gezeigt wurde.
      - Zufällig gezeigte Ziegen verraten nichts über deine Tür.
    explanation: Nur ein Moderator, der Bescheid weiß und immer eine Ziege öffnen muss, macht Wechseln zu 2/3. Öffnet jemand zufällig, bleiben 1/2 zu 1/2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Drei Gefangene, einer wird begnadigt. A fragt den Wärter: »Nenn mir einen der beiden anderen, der hingerichtet wird.« Der Wärter sagt: »B.« Wie groß ist jetzt A’s Chance?"
    params:
      options:
        - label: Weiter 1/3 – und die von C ist auf 2/3 gestiegen
          correct: true
        - label: 1/2 – es sind ja nur noch zwei übrig
          feedback: Der Wärter konnte A nie nennen. Seine Antwort sagt nichts über A.
        - label: 2/3
          feedback: Die 2/3 gehören C.
    hints:
      - Es ist dasselbe Problem wie mit den Ziegen.
    explanation: Der Wärter spielt den Moderator, A’s »Tür« ist die erste Wahl. Dieselbe Struktur in anderem Gewand.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Du wählst Tür 1. Der Moderator weiß Bescheid und öffnet **immer** Tür 3, wenn er darf. Heute öffnet er Tür 2. Wie groß ist die Chance beim Wechseln auf Tür 3?
    params:
      options:
        - label: 100 % – sonst hätte er Tür 3 geöffnet
          correct: true
        - label: 2/3, wie immer
          feedback: Die Vorliebe des Moderators verrät hier mehr.
        - label: 1/2
          feedback: Prüfe, wann er Tür 2 überhaupt öffnet.
    hints:
      - Wann öffnet er Tür 2, obwohl er Tür 3 lieber mag?
      - Nur, wenn hinter Tür 3 das Auto steht.
    explanation: Er weicht nur auf Tür 2 aus, wenn Tür 3 das Auto verbirgt. Die Wahrscheinlichkeit hängt davon ab, **wie** die Information entsteht – das ist Bayes.
    difficulty: 3

srs:
  cards_from: [wechseln, hundert]
