id: stats.paradoxes.lab
type: concept
title: Paradox lab
summary: Simulate the Monty Hall problem.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: s1
    body: |
      In the **Monty Hall problem**, exactly one strategy wins in each game: switching or staying. The simulation plays many rounds and counts which strategy would have won.

  - kind: problem
    id: simulation
    widget: distribution
    prompt: Play at least 100 rounds. Each bar counts how often that strategy would have won.
    params:
      items: [{ label: Switch, weight: 2 }, { label: Stay, weight: 1 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Draw many rounds at once.
    explanation: Switching wins about twice as often as staying.

  - kind: problem
    id: anteil
    widget: numberline
    prompt: Mark the chance of winning if you switch.
    params: { min: 0, max: 1, ticks: 3, labels: fractions }
    answer: { value: "2/3" }
    feedback:
      - when: "state.value == 0.5"
        misconception: fifty-fifty
        text: Two doors are left, but they are not equally likely.
    hints:
      - When do you lose by switching?
    explanation: 2/3. You only lose if you picked the car by chance at the start.

  - kind: problem
    id: geburtstag
    widget: buckets
    prompt: Is the chance of two matching birthdays over or under 50%?
    params:
      buckets: [{ label: under 50% }, { label: over 50% }]
      items:
        - { label: 10 people, bucket: under 50% }
        - { label: 20 people, bucket: under 50% }
        - { label: 23 people, bucket: over 50% }
        - { label: 30 people, bucket: over 50% }
    hints:
      - It tips at 23 people.
    explanation: With 23 people it is already 51%, and with 30 it is 71%.

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: You simulate {{n}} rounds of the Monty Hall game and always switch. Roughly how often do you win?
    answer:
      value: "{{2 * n / 3}}"
    hints:
      - Switching wins with 2/3.
      - Compute {{n}} · 2/3.
    explanation: "{{n}} · 2/3 = {{2 * n / 3}}. Staying wins only about {{n / 3}} times."
    difficulty: 2
    variants:
      params:
        n: choice[30,60,90,150,300,600]
      defaults:
        n: 300

  - kind: problem
    id: da-d2
    depth: 2
    widget: numberline
    prompt: A class has 23 children. Roughly mark the chance that two share a birthday.
    params:
      min: 0
      max: 1
      ticks: 10
      labels: decimals
    answer:
      value: 0.5
      tolerance: 0.1
    hints:
      - 23 is the famous threshold.
      - From 23 children the chance is just over a half.
    explanation: About 0.51 – just over 50 %. Most people would have guessed under 10 %.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain the Monty Hall problem to Lux so that someone without maths gets it.
    params:
      keywords:
        - - wechsel
          - switch
          - tausch
          - change
        - - 2/3
          - zwei drittel
          - two thirds
          - doppelt
          - twice
          - double
        - - moderator
          - host
          - weiß
          - knows
          - öffnet
          - opens
          - ziege
          - goat
      sample: Your first door is right in only one of three cases. In two thirds of cases the car is behind one of the others – and the host, who knows, always opens the goat there. So switching wins twice as often.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "A Monty Hall simulation after 30 rounds: switching won 17 times, staying 13 times. Does that refute the theory (2/3)?"
    params:
      options:
        - label: No – with 30 rounds the result fluctuates strongly
          correct: true
        - label: The wobble at 30 rounds is about ± 9 points.
          feedback: Die Schwankung bei 30 Runden ist etwa ± 9 Punkte.
        - label: Short simulations are very imprecise.
          feedback: Kurze Simulationen sind sehr ungenau.
    hints:
      - The standard deviation of the share is √(p(1 − p)/n).
      - √(2/9 ÷ 30) ≈ 0.086.
    explanation: "Expected: 20 out of 30, spread about ± 2.6 wins. 17 is well within range. Only hundreds of rounds give a clear picture."
    difficulty: 3

srs:
  cards_from: [anteil, geburtstag]
