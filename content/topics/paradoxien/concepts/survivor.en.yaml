id: stats.paradoxes.survivor
type: concept
title: The survivor trap
summary: Who is missing from the data?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: flugzeuge
    widget: choice
    body: In World War II, returning planes showed many bullet holes in the wings and hardly any at the engine.
    prompt: Where should you reinforce the armor?
    params:
      options:
        - { label: At the engine, correct: true }
        - { label: On the wings, feedback: "Planes hit in the wings did come back." }
    hints:
      - Which planes are missing from the data?
    explanation: Planes hit in the engine did not return. You only saw the survivors.

  - kind: explain
    id: s2
    body: |
      **Survivorship bias:** We only see what is left over, and we draw false conclusions.
      Successful college dropouts make the news. The many others do not.

  - kind: problem
    id: beispiele
    widget: buckets
    prompt: Is the survivor trap at work here?
    params:
      buckets: [{ label: yes }, { label: no }]
      items:
        - { label: Old houses are so well built, bucket: yes }
        - { label: All millionaires got up early, bucket: yes }
        - { label: Music used to be better, bucket: yes }
        - { label: A random test with a control group, bucket: no }
    hints:
      - Were the failures counted too?
    explanation: Bad houses were torn down, and bad songs were forgotten. Only a fair comparison counts them all.

  - kind: explain
    id: s4
    body: How do you protect yourself from this?
    reveal:
      body: Always ask who is missing here. Only when the failures are counted too do you see the real picture.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “Things used to be built better – old houses have stood for 300 years!” What is fishy?
    params:
      options:
        - label: The badly built old houses collapsed long ago – we only see the best
          correct: true
        - label: Nothing – it is simply true
          feedback: The sample has been filtered by time.
        - label: Old houses are younger than you think
          feedback: The age is right – the selection is not.
    hints:
      - Which old houses can we no longer see today?
    explanation: "The same goes for “timeless” music: nobody plays the bad songs of 1970 any more."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A provider sends stock tips to 1024 people: half “up”, half “down”. Those who got the right tip receive the next. After 10 rounds …?"
    params:
      options:
        - label: … exactly one person has received ten correct tips in a row – and thinks he is a genius
          correct: true
        - label: … nobody has correct tips any more
          feedback: One person always remains.
        - label: … everyone has equally many correct
          feedback: The list halves every round.
    hints:
      - 1024 = 2¹⁰.
    explanation: Without any knowledge. Among thousands of funds there are always some with a brilliant past – by pure chance.
    difficulty: 3

srs:
  cards_from: [flugzeuge, beispiele]
