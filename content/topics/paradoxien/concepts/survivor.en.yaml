id: stats.paradoxes.survivor
type: concept
title: The survivor trap
summary: Who is missing from the data?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: flugzeuge
    widget: choice
    body: In World War II, returning planes showed many bullet holes in the wings and hardly any at the engine.
    prompt: Where should you reinforce the armor?
    params:
      options:
        - { label: At the engine, correct: true }
        - { label: On the wings, feedback: "Planes hit in the wings did come back." }
    hints:
      - Which planes are missing from the data?
    explanation: Planes hit in the engine did not return. You only saw the survivors.

  - kind: explain
    body: |
      **Survivorship bias:** We only see what is left over, and we draw false conclusions.
      Successful college dropouts make the news. The many others do not.

  - kind: problem
    id: beispiele
    widget: buckets
    prompt: Is the survivor trap at work here?
    params:
      buckets: [{ label: yes }, { label: no }]
      items:
        - { label: Old houses are so well built, bucket: yes }
        - { label: All millionaires got up early, bucket: yes }
        - { label: Music used to be better, bucket: yes }
        - { label: A random test with a control group, bucket: no }
    hints:
      - Were the failures counted too?
    explanation: Bad houses were torn down, and bad songs were forgotten. Only a fair comparison counts them all.

  - kind: explain
    body: How do you protect yourself from this?
    reveal:
      body: Always ask who is missing here. Only when the failures are counted too do you see the real picture.

srs:
  cards_from: [flugzeuge, beispiele]
