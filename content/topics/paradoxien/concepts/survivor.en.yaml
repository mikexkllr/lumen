id: stats.paradoxes.survivor
type: concept
title: The survivor trap
summary: Who is missing from the data?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: flugzeuge
    widget: choice
    body: In World War II, returning planes showed many bullet holes in the wings and hardly any at the engine.
    prompt: Where should you reinforce the armor?
    params:
      options:
        - { label: At the engine, correct: true }
        - { label: On the wings, feedback: "Planes hit in the wings did come back." }
    hints:
      - Which planes are missing from the data?
    explanation: Planes hit in the engine did not return. You only saw the survivors.

  - kind: explain
    id: s2
    body: |
      **Survivorship bias:** We only see what is left over, and we draw false conclusions.
      Successful college dropouts make the news. The many others do not.

  - kind: problem
    id: beispiele
    widget: buckets
    prompt: Is the survivor trap at work here?
    params:
      buckets: [{ label: yes }, { label: no }]
      items:
        - { label: Old houses are so well built, bucket: yes }
        - { label: All millionaires got up early, bucket: yes }
        - { label: Music used to be better, bucket: yes }
        - { label: A random test with a control group, bucket: no }
    hints:
      - Were the failures counted too?
    explanation: Bad houses were torn down, and bad songs were forgotten. Only a fair comparison counts them all.

  - kind: explain
    id: s4
    body: How do you protect yourself from this?
    reveal:
      body: Always ask who is missing here. Only when the failures are counted too do you see the real picture.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Whom do you see – and who is missing from the picture?
    params:
      buckets:
        - id: b1
          label: Visible
        - id: b2
          label: Invisible
      items:
        - label: Successful founders in the paper
          bucket: b1
        - label: Thousands of failed firms
          bucket: b2
        - label: Planes that returned
          bucket: b1
        - label: Planes that were shot down
          bucket: b2
    hints:
      - Who can still tell the story?
    explanation: The statistics show only the survivors. The others have to be kept in mind.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: We only see what is [[left]]. The [[failures]] are missing from the statistics.
      distractors:
        - new
        - winners

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “Things used to be built better – old houses have stood for 300 years!” What is fishy?
    params:
      options:
        - label: The badly built old houses collapsed long ago – we only see the best
          correct: true
        - label: Nothing – it is simply true
          feedback: The sample has been filtered by time.
        - label: Old houses are younger than you think
          feedback: The age is right – the selection is not.
    hints:
      - Which old houses can we no longer see today?
    explanation: "The same goes for “timeless” music: nobody plays the bad songs of 1970 any more."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: choice
    prompt: A brochure shows that the bank's funds beat the market over 10 years. Funds that were closed are missing from the list. What follows?
    params:
      options:
        - label: The record is flattering – the bad funds have vanished
          correct: true
        - label: Without the closed funds you cannot tell.
          feedback: Ohne die aufgelösten Fonds weiß man das nicht.
        - label: They are exactly what changes the average.
          feedback: Gerade sie verändern den Schnitt.
    hints:
      - Which funds typically get closed?
      - Who is missing from the list?
    explanation: Unsuccessful funds get closed or merged. Counting only survivors overstates the returns.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Of 100 funds, 50 were closed after averaging −10 %. The 50 survivors averaged +8 %. What was the average return of all 100? In percent.
    answer:
      value: -1
    feedback:
      - when: numval(state.input) == 8
        misconception: survivors-only
        text: That is only the survivors' average.
    hints:
      - Both groups are the same size.
      - Average −10 and +8.
    explanation: (−10 + 8) ÷ 2 = −1 %. The brochure's +8 % is 9 points too good.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A provider sends stock tips to 1024 people: half “up”, half “down”. Those who got the right tip receive the next. After 10 rounds …?"
    params:
      options:
        - label: … exactly one person has received ten correct tips in a row – and thinks he is a genius
          correct: true
        - label: … nobody has correct tips any more
          feedback: One person always remains.
        - label: … everyone has equally many correct
          feedback: The list halves every round.
    hints:
      - 1024 = 2¹⁰.
    explanation: Without any knowledge. Among thousands of funds there are always some with a brilliant past – by pure chance.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "A vet clinic found in 1987: cats that fell from above seven floors had fewer injuries than those from middle heights. Which explanation must be checked first?"
    params:
      options:
        - label: Dead cats never reached the clinic – they are missing from the data
          correct: true
        - label: Possible, but only credible after checking the data.
          feedback: Das ist möglich, aber erst nach der Datenprüfung glaubwürdig.
        - label: That confuses clinic data with all falls.
          feedback: Das verwechselt die Klinik-Daten mit allen Stürzen.
    hints:
      - Which cats are brought to the vet at all?
      - Whoever is missing from the data skews the average.
    explanation: The clinic only sees survivors. Whether cats really relax while falling can only be settled with data on all falls.
    difficulty: 3

srs:
  cards_from: [flugzeuge, beispiele]
