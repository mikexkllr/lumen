id: stats.paradoxes.lab
type: concept
title: Paradoxien-Labor
summary: Ziegenproblem simulieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: s1
    body: |
      Beim **Ziegenproblem** gewinnt in jedem Spiel genau eine Strategie: Wechseln oder Bleiben. Die Simulation spielt viele Runden – und zählt, welche Strategie gewonnen hätte.

  - kind: problem
    id: simulation
    widget: distribution
    prompt: Spiele mindestens 100 Runden. Jede Säule zählt, wie oft diese Strategie gewonnen hätte.
    params:
      items: [{ label: Wechseln, weight: 2 }, { label: Bleiben, weight: 1 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Viele Runden auf einmal ziehen.
    explanation: Wechseln gewinnt etwa doppelt so oft wie Bleiben.

  - kind: problem
    id: anteil
    widget: numberline
    prompt: Markiere die Gewinnchance beim Wechseln.
    params: { min: 0, max: 1, ticks: 3, labels: fractions }
    answer: { value: "2/3" }
    feedback:
      - when: "state.value == 0.5"
        misconception: fifty-fifty
        text: Es sind zwar zwei Türen übrig – aber nicht gleich wahrscheinlich.
    hints:
      - Wann verliert man beim Wechseln?
    explanation: 2/3 – man verliert nur, wenn man anfangs zufällig das Auto erwischt hatte.

  - kind: problem
    id: geburtstag
    widget: buckets
    prompt: Ist die Chance auf zwei gleiche Geburtstage über oder unter 50 %?
    params:
      buckets: [{ label: unter 50 % }, { label: über 50 % }]
      items:
        - { label: 10 Personen, bucket: unter 50 % }
        - { label: 20 Personen, bucket: unter 50 % }
        - { label: 23 Personen, bucket: über 50 % }
        - { label: 30 Personen, bucket: über 50 % }
    hints:
      - Ab 23 Personen kippt es.
    explanation: Bei 23 Personen sind es schon 51 %, bei 30 sogar 71 %.

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Du simulierst {{n}} Runden Ziegenproblem und wechselst immer. Wie oft gewinnst du ungefähr?
    answer:
      value: "{{2 * n / 3}}"
    hints:
      - Wechseln gewinnt mit 2/3.
      - Rechne {{n}} · 2/3.
    explanation: "{{n}} · 2/3 = {{2 * n / 3}}. Bleiben gewinnt nur etwa {{n / 3}}-mal."
    difficulty: 2
    variants:
      params:
        n: choice[30,60,90,150,300,600]
      defaults:
        n: 300

  - kind: problem
    id: da-d2
    depth: 2
    widget: numberline
    prompt: In einer Klasse sind 23 Kinder. Markiere ungefähr die Chance, dass zwei am selben Tag Geburtstag haben.
    params:
      min: 0
      max: 1
      ticks: 10
      labels: decimals
    answer:
      value: 0.5
      tolerance: 0.1
    hints:
      - 23 ist die berühmte Grenze.
      - Ab 23 Kindern liegt die Chance knapp über der Hälfte.
    explanation: Etwa 0,51 – knapp über 50 %. Gefühlt hätten die meisten auf unter 10 % getippt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux das Ziegenproblem so, dass es jemand ohne Mathe versteht.
    params:
      keywords:
        - - wechsel
          - switch
          - tausch
          - change
        - - 2/3
          - zwei drittel
          - two thirds
          - doppelt
          - twice
          - double
        - - moderator
          - host
          - weiß
          - knows
          - öffnet
          - opens
          - ziege
          - goat
      sample: Deine erste Tür ist nur in einem von drei Fällen richtig. In zwei Dritteln der Fälle steht das Auto hinter einer der anderen – und der Moderator, der es weiß, öffnet dort immer die Ziege. Wechseln gewinnt darum doppelt so oft.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "Eine Simulation zum Ziegenproblem ergibt nach 30 Runden: Wechseln 17-mal, Bleiben 13-mal. Ist die Theorie (2/3) damit widerlegt?"
    params:
      options:
        - label: Nein – bei 30 Runden schwankt das Ergebnis stark
          correct: true
        - label: Ja, 17 von 30 sind nur 57 %
          feedback: Die Schwankung bei 30 Runden ist etwa ± 9 Punkte.
        - label: Ja, Simulationen lügen nie
          feedback: Kurze Simulationen sind sehr ungenau.
    hints:
      - Die Standardabweichung des Anteils ist √(p(1 − p)/n).
      - "√(2/9 : 30) ≈ 0,086."
    explanation: "Erwartet: 20 von 30, Streuung etwa ± 2,6 Siege. 17 liegt gut im Rahmen. Erst Hunderte Runden geben ein klares Bild."
    difficulty: 3

srs:
  cards_from: [anteil, geburtstag]
