id: stats.paradoxes.simpson
type: concept
title: Simpson's paradox
summary: Better in every group, worse overall.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: kliniken
    widget: choice
    body: Clinic A saves 99% of mild cases and 80% of severe cases. Clinic B saves 95% of mild cases and 70% of severe cases.
    prompt: Which clinic is better?
    params:
      options:
        - { label: "A, because it is better in both groups", correct: true }
        - { label: B, feedback: "In every single group, A is ahead." }
    hints:
      - Compare group by group.
    explanation: A is better in both groups. Still, its overall rate can look worse …

  - kind: problem
    id: gesamt
    widget: numeric
    body: Clinic A treats mostly severe cases, 100 mild and 900 severe. With 99% and 80%, 99 and 720 survive.
    prompt: What percent survive in clinic A overall? Round to whole percent.
    params: { unit: "%" }
    answer: { value: 82, tolerance: 1 }
    hints:
      - (99 + 720) / 1000.
    explanation: 819 of 1000, so about 82%.

  - kind: problem
    id: gesamt-b
    widget: numeric
    body: Clinic B treats almost only mild cases, 900 mild and 100 severe. With 95% and 70%, 855 and 70 survive.
    prompt: And what percent survive in clinic B overall?
    params: { unit: "%" }
    answer: { value: 93, tolerance: 1 }
    hints:
      - (855 + 70) / 1000.
    explanation: 925 of 1000, about 93%. B looks better overall, even though A wins in every group.

  - kind: explain
    body: |
      This is **Simpson's paradox**. A hidden factor flips the overall result. Here, it is how severe the cases are.

  - kind: problem
    id: lehre
    widget: choice
    prompt: What does this teach you about statistics in the news?
    params:
      options:
        - { label: "Ask about subgroups before you compare", correct: true }
        - { label: Overall numbers are always right, feedback: "They are correct, but they mislead when the groups are unevenly distributed." }
        - { label: Percentages are useless, feedback: "Not useless. You just need to know what they refer to." }
    hints:
      - What just flipped the comparison?
    explanation: Only when you compare like with like do you see the truth.

srs:
  cards_from: [kliniken, lehre]
