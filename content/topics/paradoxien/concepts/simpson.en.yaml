id: stats.paradoxes.simpson
type: concept
title: Simpson's paradox
summary: Better in every group, worse overall.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: kliniken
    widget: choice
    body: Clinic A saves 99% of mild cases and 80% of severe cases. Clinic B saves 95% of mild cases and 70% of severe cases.
    prompt: Which clinic is better?
    params:
      options:
        - { label: "A, because it is better in both groups", correct: true }
        - { label: B, feedback: "In every single group, A is ahead." }
    hints:
      - Compare group by group.
    explanation: A is better in both groups. Still, its overall rate can look worse …

  - kind: problem
    id: gesamt
    widget: numeric
    body: Clinic A treats mostly severe cases, 100 mild and 900 severe. With 99% and 80%, 99 and 720 survive.
    prompt: What percent survive in clinic A overall? Round to whole percent.
    params: { unit: "%" }
    answer: { value: 82, tolerance: 1 }
    hints:
      - (99 + 720) / 1000.
    explanation: 819 of 1000, so about 82%.

  - kind: problem
    id: gesamt-b
    widget: numeric
    body: Clinic B treats almost only mild cases, 900 mild and 100 severe. With 95% and 70%, 855 and 70 survive.
    prompt: And what percent survive in clinic B overall?
    params: { unit: "%" }
    answer: { value: 93, tolerance: 1 }
    hints:
      - (855 + 70) / 1000.
    explanation: 925 of 1000, about 93%. B looks better overall, even though A wins in every group.

  - kind: explain
    id: s4
    body: |
      This is **Simpson's paradox**. A hidden factor flips the overall result. Here, it is how severe the cases are.

  - kind: problem
    id: lehre
    widget: choice
    prompt: What does this teach you about statistics in the news?
    params:
      options:
        - { label: "Ask about subgroups before you compare", correct: true }
        - { label: Overall numbers are always right, feedback: "They are correct, but they mislead when the groups are unevenly distributed." }
        - { label: Percentages are useless, feedback: "Not useless. You just need to know what they refer to." }
    hints:
      - What just flipped the comparison?
    explanation: Only when you compare like with like do you see the truth.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A hidden [[factor]] can [[reverse]] the overall comparison. That is why you only compare like with like.
      distractors:
        - colour
        - double

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A university admits 44% of men and 35% of women. Yet in **every** single department the women’s rate is equal or higher. How come?
    params:
      options:
        - label: Women applied more often to departments with very low admission rates
          correct: true
        - label: The numbers are faked
          feedback: This happened in Berkeley in 1973 – the numbers were right.
        - label: The departments secretly disadvantage women
          feedback: The department figures show the opposite.
    hints:
      - Who applies where?
    explanation: The hidden variable is the choice of department. The overall figure mixes groups with different starting points.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "A real study on kidney stones (1986): method A cured 81 of 87 small and 192 of 263 large stones. What percent did A cure overall?"
    answer:
      value: 78
      tolerance: 0.5
    hints:
      - "Overall: (81 + 192) out of (87 + 263)."
      - 273 ÷ 350.
    explanation: 273/350 = 78 %. For small stones 93 %, for large ones 73 %.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Method B cured 234 of 270 small (87 %) and 55 of 80 large stones (69 %). What percent did B cure overall? Rounded.
    answer:
      value: 83
      tolerance: 0.5
    hints:
      - "Overall: (234 + 55) out of 350."
      - 289 ÷ 350.
    explanation: 289/350 ≈ 83 %. B is better overall – but worse than A in both groups!
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: choice
    prompt: How can A win in each group and still lose overall?
    params:
      options:
        - label: A got mostly the hard cases – large stones
          correct: true
        - label: "Check: 273/350 and 289/350 are right."
          feedback: "Prüfe nach: 273/350 und 289/350 stimmen."
        - label: In each single group A cures more.
          feedback: In jeder einzelnen Gruppe heilt A mehr.
    hints:
      - Compare how many large stones each method treated.
      - "A: 263 large, B: only 80."
    explanation: Stone size is the hidden factor. It affects which method is chosen and how well the cure works.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: When should you trust the overall figure and when the subgroups?
    params:
      options:
        - label: Knowledge about causes decides – the numbers alone do not tell
          correct: true
        - label: Always the subgroups
          feedback: If the group were a **consequence** of the treatment, the overall figure would be right.
        - label: Always the overall figure
          feedback: In the clinic and university examples it misleads.
    hints:
      - Is the grouping a cause – or a consequence?
    explanation: Statistics needs a **causal model**. That is Judea Pearl’s central insight.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Fair comparison: what percent would A have cured with the same mix as B (270 small, 80 large)? A cures 93.1 % of small and 73.0 % of large stones. To one decimal."
    answer:
      value: 88.5
      tolerance: 0.3
    hints:
      - "Small: 0.931 · 270. Large: 0.730 · 80."
      - 251.4 + 58.4 = 309.8 out of 350.
    explanation: About 88.5 % – clearly above B's 82.6 %. This standardisation compares both methods on the same mix of cases.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Explain Simpson's paradox to Lux using the kidney stones.
    params:
      keywords:
        - - gruppe
          - klein
          - groß
          - group
          - small
          - large
        - - schwer
          - versteckt
          - mischung
          - hard
          - hidden
          - mix
        - - insgesamt
          - gesamt
          - overall
          - total
          - umkehr
          - revers
      sample: A is better for small and for large stones. But A got far more hard, large stones. This hidden mix drags the overall rate down and reverses the comparison.
    explanation: Comparing only overall rates also compares the mix of cases. Only subgroups or standardisation give the fair comparison.
    difficulty: 3

srs:
  cards_from: [kliniken, lehre]
