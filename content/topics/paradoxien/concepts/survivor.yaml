id: stats.paradoxes.survivor
type: concept
title: Die Falle der Überlebenden
summary: Wer fehlt in den Daten?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: flugzeuge
    widget: choice
    body: Im Zweiten Weltkrieg zeigten zurückgekehrte Flugzeuge viele Einschusslöcher an den Flügeln, kaum welche am Motor.
    prompt: Wo sollte man die Panzerung verstärken?
    params:
      options:
        - { label: Am Motor, correct: true }
        - { label: An den Flügeln, feedback: "Flugzeuge mit Treffern an den Flügeln sind ja zurückgekommen." }
    hints:
      - Welche Flugzeuge fehlen in den Daten?
    explanation: Flugzeuge mit Motortreffern kamen nicht zurück. Man sah nur die Überlebenden.

  - kind: explain
    id: s2
    body: |
      **Survivorship Bias:** Wir sehen nur, was übrig geblieben ist – und ziehen falsche Schlüsse.
      Erfolgreiche Studienabbrecher stehen in der Zeitung, die vielen anderen nicht.

  - kind: problem
    id: beispiele
    widget: buckets
    prompt: Steckt hier die Falle der Überlebenden?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Alte Häuser sind so gut gebaut, bucket: ja }
        - { label: Alle Millionäre standen früh auf, bucket: ja }
        - { label: Früher war die Musik besser, bucket: ja }
        - { label: Ein zufälliger Test mit Vergleichsgruppe, bucket: nein }
    hints:
      - Wurden die Misserfolge mitgezählt?
    explanation: Schlechte Häuser wurden abgerissen, schlechte Songs vergessen. Nur ein fairer Vergleich zählt alle mit.

  - kind: explain
    id: s4
    body: Wie schützt man sich davor?
    reveal:
      body: Frag immer – wer fehlt hier? Erst wenn auch die Gescheiterten mitgezählt werden, sieht man das echte Bild.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Wen sieht man – und wer fehlt im Bild?
    params:
      buckets:
        - id: b1
          label: Sichtbar
        - id: b2
          label: Unsichtbar
      items:
        - label: Erfolgreiche Gründer in der Zeitung
          bucket: b1
        - label: Tausende gescheiterte Firmen
          bucket: b2
        - label: Zurückgekehrte Flugzeuge
          bucket: b1
        - label: Abgeschossene Flugzeuge
          bucket: b2
    hints:
      - Wer kann noch erzählen?
    explanation: Die Statistik zeigt nur die Überlebenden. Die anderen muss man mitdenken.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Wir sehen nur, was [[übrig]] geblieben ist. Die [[Gescheiterten]] fehlen in der Statistik.
      distractors:
        - neu
        - Sieger

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: »Früher wurde besser gebaut – alte Häuser stehen seit 300 Jahren!« Was ist faul?
    params:
      options:
        - label: Die schlecht gebauten alten Häuser sind längst eingestürzt – wir sehen nur die besten
          correct: true
        - label: Nichts – das stimmt einfach
          feedback: Die Stichprobe ist durch die Zeit gefiltert.
        - label: Alte Häuser sind jünger, als man denkt
          feedback: Das Alter stimmt – die Auswahl nicht.
    hints:
      - Welche alten Häuser können wir heute nicht mehr sehen?
    explanation: "Dasselbe gilt für »zeitlose« Musik: Die schlechten Lieder von 1970 spielt niemand mehr."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Anbieter schickt 1024 Leuten Börsentipps: der Hälfte »steigt«, der Hälfte »fällt«. Wer den richtigen Tipp bekam, erhält den nächsten. Nach 10 Runden …?"
    params:
      options:
        - label: … hat genau eine Person zehn richtige Tipps in Folge bekommen – und hält ihn für ein Genie
          correct: true
        - label: … hat niemand mehr richtige Tipps
          feedback: Eine Person bleibt immer übrig.
        - label: … haben alle gleich viele richtige
          feedback: Die Liste halbiert sich jede Runde.
    hints:
      - 1024 = 2¹⁰.
    explanation: Ohne jedes Wissen. Bei Tausenden Fonds gibt es immer einige mit glänzender Vergangenheit – durch reinen Zufall.
    difficulty: 3

srs:
  cards_from: [flugzeuge, beispiele]
