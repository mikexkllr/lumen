id: stats.paradoxes.birthday
type: concept
title: The birthday paradox
summary: Just 23 people are enough.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A planet with 10 days
    body: On a distant planet, a year has only 10 days. Draw birthdays one by one and watch the list. After how many guests do two share the **same day**? Reset and try again.
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: day 1
          - label: day 2
          - label: day 3
          - label: day 4
          - label: day 5
          - label: day 6
          - label: day 7
          - label: day 8
          - label: day 9
          - label: day 10
        sample:
          - 1

  - kind: problem
    id: schaetzen
    widget: choice
    prompt: How many people must be in a room for a better than 50% chance that two share a birthday?
    params:
      layout: grid
      options:
        - { label: "23", correct: true }
        - { label: "183", feedback: "That would be half of 365. But any pair will do." }
        - { label: "60", feedback: "With 60 people it is already almost certain, over 99%." }
        - { label: "100", feedback: "Far too many." }
    hints:
      - It does not have to be your birthday. Any pair will do.
    explanation: Just 23 people are enough. With 50 people, the chance is 97%.

  - kind: explain
    id: s2
    body: |
      The trick: **pairs** count, not people. With 23 people, there are surprisingly many possible pairs.

  - kind: problem
    id: paare
    widget: numeric
    prompt: How many different pairs are there among {{n}} people?
    params: { unit: pairs }
    answer: { value: "{{n * (n - 1) / 2}}" }
    feedback:
      - when: "numval(state.input) == n * (n - 1)"
        misconception: double-count
        text: You counted each pair twice.
    hints:
      - Everyone with everyone, divided by 2.
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}} pairs."
    variants:
      params: { n: "choice[10,23,30,50]" }
      defaults: { n: 23 }

  - kind: problem
    id: eigener
    widget: choice
    prompt: How many people do you need for a better than 50% chance that someone shares YOUR birthday?
    params:
      options:
        - { label: About 250, correct: true }
        - { label: "23", feedback: "That holds for any pair. For your date, it is much harder." }
        - { label: "183", feedback: "Close, but some people share days among themselves." }
    hints:
      - Now each person only counts against you.
    explanation: About 253 people. Here there is no explosion of pairs.

  - kind: explain
    id: s5
    body: Where is this effect used?
    reveal:
      body: In cryptography. So-called birthday attacks look for two files with the same hash. That works much faster than you would think.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Every pair is a chance of a shared birthday. Set how many pairs there are with 3, 4 and 5 people.
    params:
      labels:
        - 3 people
        - 4 people
        - 5 people
      values:
        - 0
        - 0
        - 0
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 12
      title: Pairs
    answer:
      values:
        - 3
        - 6
        - 10
    hints:
      - With A, B and C there are the pairs AB, AC and BC.
      - "Each new person forms a pair with everyone else: 3 + 3 = 6, then 6 + 4 = 10."
    explanation: The **pairs** grow much faster than the people. That is why a few guests are enough for a shared birthday.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is the probability that **three** random people all have birthdays on different days? In percent, to one place. (364/365 · 363/365)
    params:
      unit: "%"
    answer:
      value: 99.2
      tolerance: 0.1
    hints:
      - The second has 364 free days, the third 363.
    explanation: 99.2%. Each further person multiplies in a slightly smaller factor – at 23 you are below 50%.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Four people. How likely do at least two share a birthday? In percent, to one decimal. (364/365 · 363/365 · 362/365 ≈ 0.9836)
    answer:
      value: 1.6
      tolerance: 0.05
    hints:
      - The product is the chance that all differ.
      - Compute 1 − 0.9836.
    explanation: 1 − 0.9836 ≈ 1.6 %. Four people form only 6 pairs. 23 people already form 253.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: a group has 70 people. How likely do at least two share a birthday? In percent."
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 99.9
      tolerance: 3
    explanation: About 99.9 %. 70 people form 2415 pairs – almost surely one matches.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Rule of thumb: for a 50% chance of a match you need about 1.2 · √N tries. How many is that for N = 1,000,000 possibilities?"
    answer:
      value: 1200
    hints:
      - √1,000,000 = 1000.
    explanation: Only 1200 instead of half a million. That is why short random IDs collide sooner than you think.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "An approximation: P(match) ≈ 1 − e^(−pairs/365). 23 people form 253 pairs, and 253/365 ≈ 0.693 ≈ ln 2. What value in percent comes out?"
    answer:
      value: 50
      tolerance: 0.5
    hints:
      - e^(−ln 2) = 1/2.
      - Compute 1 − 1/2.
    explanation: About 50 % – the exact value is 50.7 %. Each pair matches with 1/365, and rare matches behave almost independently.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A checksum (hash) has 2⁶⁴ possible values. From about how many files will two probably share a hash?
    params:
      options:
        - label: About 2³² – roughly 4 billion
          correct: true
        - label: That is for one specific hash, not any pair.
          feedback: Das gilt für einen **bestimmten** Hash, nicht für irgendein Paar.
        - label: "The paradox says: much sooner."
          feedback: "Das Paradox sagt: viel früher."
    hints:
      - The rule of thumb is roughly √N.
      - √(2⁶⁴) = 2³².
    explanation: "After about √N tries a collision becomes likely. That is why secure hashes need 256 bits: √(2²⁵⁶) = 2¹²⁸ is out of reach."
    difficulty: 3

srs:
  cards_from: [schaetzen, paare]
