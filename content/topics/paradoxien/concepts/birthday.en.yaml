id: stats.paradoxes.birthday
type: concept
title: The birthday paradox
summary: Just 23 people are enough.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: schaetzen
    widget: choice
    prompt: How many people must be in a room for a better than 50% chance that two share a birthday?
    params:
      layout: grid
      options:
        - { label: "23", correct: true }
        - { label: "183", feedback: "That would be half of 365. But any pair will do." }
        - { label: "60", feedback: "With 60 people it is already almost certain, over 99%." }
        - { label: "100", feedback: "Far too many." }
    hints:
      - It does not have to be your birthday. Any pair will do.
    explanation: Just 23 people are enough. With 50 people, the chance is 97%.

  - kind: explain
    id: s2
    body: |
      The trick: **pairs** count, not people. With 23 people, there are surprisingly many possible pairs.

  - kind: problem
    id: paare
    widget: numeric
    prompt: How many different pairs are there among {{n}} people?
    params: { unit: pairs }
    answer: { value: "{{n * (n - 1) / 2}}" }
    feedback:
      - when: "numval(state.input) == n * (n - 1)"
        misconception: double-count
        text: You counted each pair twice.
    hints:
      - Everyone with everyone, divided by 2.
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}} pairs."
    variants:
      params: { n: "choice[10,23,30,50]" }
      defaults: { n: 23 }

  - kind: problem
    id: eigener
    widget: choice
    prompt: How many people do you need for a better than 50% chance that someone shares YOUR birthday?
    params:
      options:
        - { label: About 250, correct: true }
        - { label: "23", feedback: "That holds for any pair. For your date, it is much harder." }
        - { label: "183", feedback: "Close, but some people share days among themselves." }
    hints:
      - Now each person only counts against you.
    explanation: About 253 people. Here there is no explosion of pairs.

  - kind: explain
    id: s5
    body: Where is this effect used?
    reveal:
      body: In cryptography. So-called birthday attacks look for two files with the same hash. That works much faster than you would think.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is the probability that **three** random people all have birthdays on different days? In percent, to one place. (364/365 · 363/365)
    params:
      unit: "%"
    answer:
      value: 99.2
      tolerance: 0.1
    hints:
      - The second has 364 free days, the third 363.
    explanation: 99.2%. Each further person multiplies in a slightly smaller factor – at 23 you are below 50%.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Rule of thumb: for a 50% chance of a match you need about 1.2 · √N tries. How many is that for N = 1,000,000 possibilities?"
    answer:
      value: 1200
    hints:
      - √1,000,000 = 1000.
    explanation: Only 1200 instead of half a million. That is why short random IDs collide sooner than you think.
    difficulty: 3

srs:
  cards_from: [schaetzen, paare]
