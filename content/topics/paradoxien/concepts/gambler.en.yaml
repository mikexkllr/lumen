id: stats.paradoxes.gambler
type: concept
title: What chance really looks like
summary: Streaks are normal.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: echt
    widget: choice
    prompt: Which sequence of 20 coin flips is more likely from a real coin?
    params:
      options:
        - { label: "HHTHHHHTTHTTTHTHHHTT – with long streaks", correct: true }
        - { label: "HTHTTHTHHTHTTHTHTHTH – neatly alternating", feedback: "True chance has clumps. Sequences that are too even look suspicious." }
    hints:
      - How often do real flips give 4 in a row?
    explanation: In 20 flips, streaks of 4 or more are very likely. People invent too few.

  - kind: explain
    body: |
      We expect chance to look **even**. But true chance forms clumps and streaks.
      The belief that black must come soon after red is called the **gambler's fallacy**.

  - kind: problem
    id: serie
    widget: numeric
    prompt: How likely is it that {{n}} coin flips all come out the same, all heads or all tails? Give a fraction.
    params: { placeholder: "Fraction" }
    answer: { value: "2/{{2 ** n}}" }
    hints:
      - "All heads: 1/{{2 ** n}}. All tails the same."
    explanation: "2/{{2 ** n}} = 1/{{2 ** (n - 1)}}."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 4 }

  - kind: problem
    id: casino
    widget: choice
    prompt: In 1913 in Monte Carlo, black came up 26 times in a row. What did many players do?
    params:
      options:
        - { label: They bet more and more on red and lost., correct: true }
        - { label: They stopped playing., feedback: "Sadly not. They thought red was overdue." }
    hints:
      - Gambler's fallacy.
    explanation: They believed red was "due". The wheel had no memory.

srs:
  cards_from: [echt, serie]
