id: stats.paradoxes.gambler
type: concept
title: What chance really looks like
summary: Streaks are normal.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: echt
    widget: choice
    prompt: Which sequence of 20 coin flips is more likely from a real coin?
    params:
      options:
        - { label: "HHTHHHHTTHTTTHTHHHTT – with long streaks", correct: true }
        - { label: "HTHTTHTHHTHTTHTHTHTH – neatly alternating", feedback: "True chance has clumps. Sequences that are too even look suspicious." }
    hints:
      - How often do real flips give 4 in a row?
    explanation: In 20 flips, streaks of 4 or more are very likely. People invent too few.

  - kind: explain
    id: s2
    body: |
      We expect chance to look **even**. But true chance forms clumps and streaks.
      The belief that black must come soon after red is called the **gambler's fallacy**.

  - kind: problem
    id: serie
    widget: numeric
    prompt: How likely is it that {{n}} coin flips all come out the same, all heads or all tails? Give a fraction.
    params: { placeholder: "Fraction" }
    answer: { value: "2/{{2 ** n}}" }
    hints:
      - "All heads: 1/{{2 ** n}}. All tails the same."
    explanation: "2/{{2 ** n}} = 1/{{2 ** (n - 1)}}."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 4 }

  - kind: problem
    id: casino
    widget: choice
    prompt: In 1913 in Monte Carlo, black came up 26 times in a row. What did many players do?
    params:
      options:
        - { label: They bet more and more on red and lost., correct: true }
        - { label: They stopped playing., feedback: "Sadly not. They thought red was overdue." }
    hints:
      - Gambler's fallacy.
    explanation: They believed red was "due". The wheel had no memory.

  - kind: problem
    id: mix-c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: After five reds black is “due”.
          right: false
          why: The ball has no memory.
        - text: Real chance forms streaks and clumps.
          right: true
        - text: Ten coin tosses always show about five heads.
          right: false
          why: 8 or 2 also happen more often than you think.
        - text: With very many tosses the share settles down.
          right: true
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You toss a coin 100 times. How long is the longest run of equal results typically? (About log₂ 100)
    answer:
      value: 7
      tolerance: 1
    hints:
      - 2⁷ = 128.
    explanation: About 7. Someone “inventing” coin tosses almost never includes runs that long – that is how fakes are spotted.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: how often does the result switch (heads to tails or back) in 20 real coin flips, on average?"
    params:
      min: 0
      max: 19
    answer:
      value: 9.5
      tolerance: 2
    explanation: "Between 20 flips there are 19 transitions, each switching with 50 %: 9.5 on average. Made-up sequences usually switch far more often – that is how they are spotted."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: "Lottery: is 1-2-3-4-5-6 less likely than 4-11-17-28-33-41?"
    params:
      options:
        - label: No, every combination has exactly the same chance
          correct: true
        - label: Chance produces all patterns equally often.
          feedback: Zufall bildet alle Muster gleich oft.
        - label: The balls have no memory.
          feedback: Die Kugeln haben kein Gedächtnis.
    hints:
      - How many combinations exist, and is any preferred?
      - Each one is one of 13,983,816.
    explanation: Both are 1 in 13,983,816. »Pattern« is just our label. There are simply far more messy-looking combinations.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "In basketball people believe in the “hot hand”: whoever scored three times is more likely to score again. What do the statistics show?"
    params:
      options:
        - label: The effect is far smaller than it feels – most of it is ordinary random streaks
          correct: true
        - label: It is huge
          feedback: Our brain sees patterns where chance reigns.
        - label: After hits you score worse
          feedback: The data do not clearly show that either.
    hints:
      - Streaks arise from pure chance too.
    explanation: We are pattern seekers. The **clustering illusion** makes random streaks seem meaningful.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: A run is a streak of equal results. With n flips there are on average 1 + (n − 1)/2 runs. How many are there with {{n}} flips?
    answer:
      value: "{{1 + (n - 1) / 2}}"
    hints:
      - Every switch starts a new run.
      - "The first run plus the expected switches: 1 + {{(n - 1) / 2}}."
    explanation: 1 + {{(n - 1) / 2}} = {{1 + (n - 1) / 2}}. The runs test compares the counted runs to this – too many runs give away invented data.
    difficulty: 3
    variants:
      params:
        n: choice[11,21,41,101]
      defaults:
        n: 21

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why real randomness forms streaks and clumps.
    params:
      keywords:
        - - unabhängig
          - gedächtnis
          - independent
          - memory
        - - serie
          - lauf
          - klump
          - streak
          - run
          - clump
        - - gleichmäßig
          - wechsel
          - even
          - switch
          - alternat
      sample: Every flip is independent; the coin has no memory. So it only switches half the time. That creates streaks and clumps by itself. Even-looking sequences are more likely invented.
    explanation: We expect too many switches. Real chance switches only half the time – and so it forms streaks.
    difficulty: 3

srs:
  cards_from: [echt, serie]
