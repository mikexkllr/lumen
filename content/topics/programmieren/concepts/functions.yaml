id: cs.programming.functions
type: concept
title: Funktionen
summary: Einmal schreiben, oft nutzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: Eine Maschine verdoppelt jede Zahl. Du wirfst die 7 hinein. Was kommt heraus?
    answer:
      value: 14
    hints:
      - 7 · 2.
    explanation: Etwas hinein, etwas heraus. So eine Maschine heißt Funktion.

  - kind: explain
    id: s1
    body: |
      Eine **Funktion** ist ein benannter Baustein: Man gibt Werte hinein und bekommt ein Ergebnis zurück. `doppelt(x)` gibt `2 · x` zurück – überall, wo man sie aufruft.

  - kind: problem
    id: aufruf
    widget: numeric
    body: "f(x) = 2 · x + 1"
    prompt: Was ergibt f(f({{a}}))?
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{2 * (2 * a + 1) + 1}}" }
    hints:
      - "Erst innen: f({{a}}) = {{2 * a + 1}}."
    explanation: "f({{a}}) = {{2 * a + 1}}, dann f({{2 * a + 1}}) = {{2 * (2 * a + 1) + 1}}."
    variants:
      params: { a: "int[1,9]" }
      defaults: { a: 3 }

  - kind: problem
    id: namen
    widget: match
    prompt: Welcher Name passt zu welcher Funktion?
    params:
      pairs:
        - { left: "die größere Zahl", right: maximum }
        - { left: "Celsius in Fahrenheit", right: celsius_zu_f }
        - { left: "Ist die Zahl gerade?", right: ist_gerade }
    hints:
      - Gute Namen sagen, was die Funktion tut.
    explanation: Klare Namen machen Programme lesbar – auch für dein zukünftiges Ich.

  - kind: problem
    id: warum
    widget: buckets
    prompt: Spricht das für eine Funktion?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Derselbe Code steht fünfmal da, bucket: ja }
        - { label: Ein Teil soll einzeln testbar sein, bucket: ja }
        - { label: Ein Befehl wird genau einmal gebraucht, bucket: nein }
    hints:
      - Wann lohnt sich ein eigener Baustein?
    explanation: Funktionen lohnen sich bei Wiederholung und für sauberes Testen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: f(x) gibt 3 · x zurück, g(x) gibt x + 2 zurück. Was ergibt g(f(4))?
    answer:
      value: 14
    hints:
      - "Erst innen: f(4) = 12."
    explanation: g(12) = 14. Umgekehrt wäre f(g(4)) = 18.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Funktion heißt **rein**, wenn sie für gleiche Eingaben immer dasselbe liefert und sonst nichts verändert. Warum ist das so wertvoll?
    params:
      options:
        - label: Man kann sie einzeln testen und verstehen – ohne den Rest des Programms zu kennen
          correct: true
        - label: Sie läuft schneller
          feedback: Nicht unbedingt – es geht um Verlässlichkeit.
        - label: Sie braucht keinen Speicher
          feedback: Jede Funktion braucht Speicher.
    hints:
      - Was musst du alles wissen, um ihr Ergebnis vorherzusagen?
    explanation: Nur die Eingaben. Große Programme bleiben beherrschbar, wenn Bausteine keine versteckten Nebenwirkungen haben.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wozu sind Funktionen beim Programmieren gut?"
    params:
      keywords:
        - - wiederverwend
          - mehrfach
          - reuse
          - again
          - oft
          - often
        - - name
          - baustein
          - block
          - building
        - - einmal
          - once
          - schreib
          - write
          - änder
          - change
      sample: Eine Funktion ist ein Baustein mit einem Namen. Man schreibt den Code nur einmal und kann ihn überall wiederverwenden – und muss Fehler nur an einer Stelle ändern.
    difficulty: 3

srs:
  cards_from: [aufruf, warum]
