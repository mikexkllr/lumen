id: cs.programming.functions
type: concept
title: Funktionen
summary: Einmal schreiben, oft nutzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: Eine Maschine verdoppelt jede Zahl. Du wirfst die 7 hinein. Was kommt heraus?
    answer:
      value: 14
    hints:
      - 7 · 2.
    explanation: Etwas hinein, etwas heraus. So eine Maschine heißt Funktion.

  - kind: explain
    id: s1
    body: |
      Eine **Funktion** ist ein benannter Baustein: Man gibt Werte hinein und bekommt ein Ergebnis zurück. `doppelt(x)` gibt `2 · x` zurück – überall, wo man sie aufruft.

  - kind: problem
    id: aufruf
    widget: numeric
    body: "f(x) = 2 · x + 1"
    prompt: Was ergibt f(f({{a}}))?
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{2 * (2 * a + 1) + 1}}" }
    hints:
      - "Erst innen: f({{a}}) = {{2 * a + 1}}."
    explanation: "f({{a}}) = {{2 * a + 1}}, dann f({{2 * a + 1}}) = {{2 * (2 * a + 1) + 1}}."
    variants:
      params: { a: "int[1,9]" }
      defaults: { a: 3 }

  - kind: problem
    id: namen
    widget: match
    prompt: Welcher Name passt zu welcher Funktion?
    params:
      pairs:
        - { left: "die größere Zahl", right: maximum }
        - { left: "Celsius in Fahrenheit", right: celsius_zu_f }
        - { left: "Ist die Zahl gerade?", right: ist_gerade }
    hints:
      - Gute Namen sagen, was die Funktion tut.
    explanation: Klare Namen machen Programme lesbar – auch für dein zukünftiges Ich.

  - kind: problem
    id: warum
    widget: buckets
    prompt: Spricht das für eine Funktion?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Derselbe Code steht fünfmal da, bucket: ja }
        - { label: Ein Teil soll einzeln testbar sein, bucket: ja }
        - { label: Ein Befehl wird genau einmal gebraucht, bucket: nein }
    hints:
      - Wann lohnt sich ein eigener Baustein?
    explanation: Funktionen lohnen sich bei Wiederholung und für sauberes Testen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: f(x) gibt 3 · x zurück, g(x) gibt x + 2 zurück. Was ergibt g(f(4))?
    answer:
      value: 14
    hints:
      - "Erst innen: f(4) = 12."
    explanation: g(12) = 14. Umgekehrt wäre f(g(4)) = 18.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: f(x) gibt x + 1 zurück. g(x) gibt 2 · f(x) zurück. Was ergibt g(f({{a}}))?
    answer:
      value: "{{2 * (a + 2)}}"
    feedback:
      - when: numval(state.input) == 2 * (a + 1)
        misconception: missed-inner-call
        text: g ruft selbst noch einmal f auf – es kommt zweimal 1 dazu.
    hints:
      - "Rechne von innen nach außen: Erst f({{a}})."
      - f({{a}}) = {{a + 1}}. Dann g({{a + 1}}) = 2 · f({{a + 1}}).
    explanation: f({{a}}) = {{a + 1}}, f({{a + 1}}) = {{a + 2}}, mal 2 ergibt {{2 * (a + 2)}}.
    difficulty: 2
    variants:
      params:
        a: int[2,9]
      defaults:
        a: 4

  - kind: explain
    id: cs-d2
    depth: 2
    body: Ein **Parameter** ist der Platzhalter in der Funktion, das Argument der Wert beim Aufruf. In `doppelt(x)` ist x der Parameter, in `doppelt(7)` ist 7 das Argument.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: order
    prompt: Was passiert bei drucke(doppelt(plus1(3)))? Bring die Schritte in die richtige Reihenfolge.
    params:
      items:
        - label: plus1(3) liefert 4
        - label: doppelt(4) liefert 8
        - label: drucke(8) zeigt 8 an
    hints:
      - Ein Aufruf braucht erst den Wert seines Arguments.
      - Von innen nach außen.
    explanation: Erst werden die Argumente ausgerechnet, dann die Funktion aufgerufen. Darum läuft die innerste zuerst.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: x = 5. Die Funktion setze() macht in sich x = 9. Danach druckst du x außerhalb. Was erscheint, wenn das x in der Funktion lokal ist?
    params:
      options:
        - label: 5 – das innere x ist eine eigene Variable
          correct: true
        - label: "9"
          feedback: Das wäre so, wenn die Funktion das äußere x ändern dürfte.
        - label: Ein Fehler
          feedback: Zwei Variablen mit gleichem Namen in verschiedenen Bereichen sind erlaubt.
    hints:
      - "Lokal heißt: nur innerhalb der Funktion sichtbar."
      - Das äußere x wird nie angefasst.
    explanation: Jede Funktion hat ihren eigenen Gültigkeitsbereich. So stören sich Funktionen nicht gegenseitig.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Funktion heißt **rein**, wenn sie für gleiche Eingaben immer dasselbe liefert und sonst nichts verändert. Warum ist das so wertvoll?
    params:
      options:
        - label: Man kann sie einzeln testen und verstehen – ohne den Rest des Programms zu kennen
          correct: true
        - label: Sie läuft schneller
          feedback: Nicht unbedingt – es geht um Verlässlichkeit.
        - label: Sie braucht keinen Speicher
          feedback: Jede Funktion braucht Speicher.
    hints:
      - Was musst du alles wissen, um ihr Ergebnis vorherzusagen?
    explanation: Nur die Eingaben. Große Programme bleiben beherrschbar, wenn Bausteine keine versteckten Nebenwirkungen haben.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wozu sind Funktionen beim Programmieren gut?"
    params:
      keywords:
        - - wiederverwend
          - mehrfach
          - reuse
          - again
          - oft
          - often
        - - name
          - baustein
          - block
          - building
        - - einmal
          - once
          - schreib
          - write
          - änder
          - change
      sample: Eine Funktion ist ein Baustein mit einem Namen. Man schreibt den Code nur einmal und kann ihn überall wiederverwenden – und muss Fehler nur an einer Stelle ändern.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: zweimal(f, x) gibt f(f(x)) zurück. Was ergibt zweimal(doppelt, {{a}})?
    answer:
      value: "{{4 * a}}"
    feedback:
      - when: numval(state.input) == 2 * a
        misconception: once
        text: doppelt wird zweimal angewendet, nicht einmal.
    hints:
      - zweimal bekommt eine Funktion als Argument.
      - doppelt(doppelt({{a}})).
    explanation: doppelt({{a}}) = {{2 * a}}, doppelt({{2 * a}}) = {{4 * a}}. Funktionen, die Funktionen bekommen, heißen höherer Ordnung.
    difficulty: 3
    variants:
      params:
        a: int[3,12]
      defaults:
        a: 5

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Was ergibt map(quadrat, [1, 2, 3])?
    params:
      options:
        - label: "[1, 4, 9]"
          correct: true
        - label: "14"
          feedback: Das wäre die Summe der Quadrate. map gibt eine Liste zurück.
        - label: "[1, 2, 3, 1, 2, 3]"
          feedback: map wendet die Funktion auf jedes Element an.
    hints:
      - map wendet eine Funktion auf jedes Element an.
      - quadrat(2) = 4.
    explanation: map baut eine neue Liste aus f(x) für jedes x. Das ersetzt viele Schleifen – kürzer und schwerer falsch zu machen.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Eine Funktion zählt bei jedem Aufruf einen globalen Zähler hoch und gibt ihn zurück. Warum macht das Tests schwer?
    params:
      options:
        - label: Das Ergebnis hängt davon ab, wie oft sie vorher lief
          correct: true
        - label: Weil Zähler langsam sind
          feedback: Ein Zähler kostet kaum Zeit.
        - label: Weil globale Variablen verboten sind
          feedback: Erlaubt sind sie – sie machen das Verhalten nur unberechenbar.
    hints:
      - Rufe sie zweimal mit gleicher Eingabe auf.
      - Eine reine Funktion gibt bei gleicher Eingabe immer dasselbe.
    explanation: Solche Seiteneffekte koppeln Teile eines Programms unsichtbar aneinander. Reine Funktionen lassen sich einzeln prüfen.
    difficulty: 3

srs:
  cards_from: [aufruf, warum]
