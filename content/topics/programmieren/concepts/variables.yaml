id: cs.programming.variables
type: concept
title: Variablen
summary: Werte merken und verändern.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Schachteln mit Namen
    body: "Jede App muss sich Dinge merken: deinen Punktestand, den Akku, den Warenkorb. Dafür gibt es **Variablen**. Deck die Karten auf. Welcher Wert ändert sich am häufigsten?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎮
            front: Der Punktestand
            back: Jeder Treffer nimmt den alten Wert, zählt etwas dazu und legt das Ergebnis zurück.
          - icon: 🔋
            front: Der Akku
            back: Dein Handy prüft den Ladestand ständig und überschreibt den alten Wert.
          - icon: 🛒
            front: Der Warenkorb
            back: Jedes neue Produkt ändert die Summe. Den alten Betrag braucht danach niemand mehr.
          - icon: ⏱️
            front: Die Stoppuhr
            back: Sie zählt ihre Variable hundertmal pro Sekunde um eins hoch.

  - kind: problem
    id: hook
    widget: numeric
    prompt: Auf einem Zettel steht 3. Du streichst die Zahl durch und schreibst eine hin, die um 2 größer ist. Was steht jetzt da?
    answer:
      value: 5
    hints:
      - 3 + 2.
    explanation: "Der Zettel ist eine Variable: ein Platz mit einem Wert, den man ändern kann."

  - kind: explain
    id: s1
    body: |
      Eine **Variable** ist ein beschrifteter Speicherplatz. `x = 3` legt 3 hinein. `x = x + 2` nimmt den alten Wert, rechnet und legt das Ergebnis wieder hinein.

  - kind: problem
    id: verfolgen
    widget: numeric
    body: "x = {{a}}, dann x = x + {{b}}, dann x = x · 2"
    prompt: Welchen Wert hat x am Ende?
    params: { placeholder: "x" }
    answer: { value: "{{(a + b) * 2}}" }
    feedback:
      - when: "numval(state.input) == a + b * 2"
        misconception: order
        text: Jede Zeile arbeitet mit dem Ergebnis der vorigen – erst plus, dann mal.
    hints:
      - Geh Zeile für Zeile durch und notiere x.
    explanation: "{{a}} → {{a + b}} → {{(a + b) * 2}}."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: tausch
    widget: order
    prompt: Die Werte von a und b sollen getauscht werden. Bring die Zeilen in die richtige Reihenfolge.
    params:
      items:
        - { label: "hilf = a" }
        - { label: "a = b" }
        - { label: "b = hilf" }
    hints:
      - Wenn du a sofort überschreibst, ist der alte Wert weg.
    explanation: Eine Hilfsvariable rettet den alten Wert – ein Klassiker.

  - kind: problem
    id: zaehler
    widget: numeric
    body: "zähler = 0, dann 5-mal: zähler = zähler + 3"
    prompt: Welchen Wert hat der Zähler danach?
    params: { placeholder: "Wert" }
    answer: { value: 15 }
    hints:
      - Fünfmal 3 dazu.
    explanation: 0, 3, 6, 9, 12, 15 – Schleife und Variable zusammen zählen mit.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Eine Variable ist ein benannter [[Speicherplatz]]. Der Befehl x = x + 1 [[erhöht]] den Wert um eins. Das Zeichen = bedeutet hier [[Zuweisung]], nicht Gleichheit.
      distractors:
        - Vergleich
        - halbiert

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Am Anfang ist x = 4 und y = 7. Dann laufen die Zeilen »x = y« und »y = x«. Stell beide Säulen auf ihre Werte danach.
    params:
      labels:
        - x
        - y
      values:
        - 4
        - 7
      editable:
        - 0
        - 1
      min: 0
      max: 10
    answer:
      values:
        - 7
        - 7
    hints:
      - Nach der ersten Zeile ist x schon 7 – die 4 ist weg.
      - Die zweite Zeile kopiert diese 7 nach y.
    explanation: "Beide sind 7: Die alte 4 wurde überschrieben, bevor y sie bekam. Darum braucht man zum Tauschen eine Hilfsvariable."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "x = 5, y = 3. Dann: x = x + y, y = x − y, x = x − y. Welchen Wert hat x am Ende?"
    answer:
      value: 3
    hints:
      - "Schritt für Schritt: x wird 8, y wird 5, x wird 3."
    explanation: Die Werte sind getauscht – ganz ohne dritte Variable.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "a = 4, b = 7. Dann: a = b, danach b = a. Welchen Wert hat b am Ende?"
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 4
        misconception: simultaneous-swap
        text: Nach der ersten Zeile ist a schon 7 – die 4 ist weg.
    hints:
      - Geh Zeile für Zeile. Was steht nach a = b in a?
      - Die alte 4 wurde überschrieben.
    explanation: a = b macht a zu 7. b = a schreibt dann 7 nach b. Beide sind 7 – zum Tauschen braucht man eine Hilfsvariable.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: x = {{a}}. Dann x = x · 2, danach x = x − {{b}}, zuletzt x = x · x. Welchen Wert hat x?
    answer:
      value: "{{(2 * a - b) ** 2}}"
    hints:
      - Schreib nach jeder Zeile den neuen Wert auf.
      - "{{a}} → {{2 * a}} → {{2 * a - b}} → ?"
    explanation: "{{a}} → {{2 * a}} → {{2 * a - b}} → {{(2 * a - b) ** 2}}."
    difficulty: 2
    variants:
      params:
        a: int[3,9]
        b: int[1,5]
      defaults:
        a: 5
        b: 3

  - kind: explain
    id: cs-d3
    depth: 2
    body: Jede Variable hat einen **Datentyp**. 3 + 4 ergibt 7. Aber "3" + "4" ergibt in vielen Sprachen "34" – Text wird einfach aneinandergehängt.

  - kind: problem
    id: cs-d4
    depth: 2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: In `x = x + 1` heißt das Zeichen = nicht »ist gleich«, sondern [[bekommt]]. Zuerst wird rechts [[gerechnet]], dann wird links [[gespeichert]].
      distractors:
        - vergleicht
        - geraten
    hints:
      - Mathematisch wäre x = x + 1 unmöglich.
      - Lies es als Befehl, nicht als Behauptung.
    explanation: "Die Zuweisung ist ein Befehl: neuen Wert ausrechnen, alten überschreiben. Manche Sprachen schreiben darum x := x + 1."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Zwei Programme lesen gleichzeitig Kontostand = 100, addieren je 50 und schreiben das Ergebnis zurück. Was steht am Ende da?
    params:
      options:
        - label: Möglicherweise 150 statt 200 – eine Einzahlung geht verloren
          correct: true
        - label: Sicher 200
          feedback: Beide haben die alte 100 gelesen und schreiben 150.
        - label: Das Programm stürzt ab
          feedback: Es läuft durch – nur das Ergebnis stimmt nicht.
    hints:
      - Beide lesen 100, **bevor** der andere geschrieben hat.
    explanation: Eine **Race Condition**. Solche Fehler treten nur manchmal auf und sind berüchtigt schwer zu finden.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Eine 32-Bit-Variable ohne Vorzeichen steht bei 4 294 967 295. Du zählst 1 dazu. Welcher Wert steht danach drin?
    answer:
      value: 0
    feedback:
      - when: numval(state.input) == 4294967296
        misconception: no-overflow
        text: Diese Zahl bräuchte 33 Bit. Das oberste Bit fällt heraus.
    hints:
      - 4 294 967 295 ist $2^{32}$ − 1 – alle 32 Bits sind 1.
      - Wie bei einem Kilometerzähler, der von 999999 umspringt.
    explanation: "Alle Bits kippen auf 0, der Übertrag passt nicht mehr hinein: 0. Solche Überläufe stecken hinter vielen Fehlern, etwa dem Jahr-2038-Problem."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Zwei Programme ändern denselben Kontostand gleichzeitig. Wie verhindert man, dass eine Einzahlung verloren geht?
    params:
      options:
        - label: Lesen, Rechnen und Schreiben als unteilbaren Schritt sperren
          correct: true
        - label: Schneller rechnen
          feedback: Auch ein schneller Rechner kann im falschen Moment unterbrochen werden.
        - label: Zweimal speichern
          feedback: Doppeltes Speichern ändert nichts am falsch gelesenen Wert.
    hints:
      - Das Problem entsteht zwischen Lesen und Schreiben.
      - Während einer rechnet, muss der andere warten.
    explanation: Eine Sperre (Lock) oder eine Transaktion macht die drei Schritte unteilbar. Das andere Programm wartet, bis der Kontostand fertig geschrieben ist.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was bei `x = x + 1` genau passiert.
    params:
      keywords:
        - - alt
          - old
          - vorher
          - before
          - aktuell
          - current
        - - rechn
          - plus
          - add
          - comput
          - calculat
        - - speicher
          - ablegen
          - store
          - save
          - überschreib
          - overwrite
      sample: Der Computer liest den alten Wert von x, rechnet plus 1 und speichert das Ergebnis wieder in x. Der alte Wert wird dabei überschrieben.
    difficulty: 3

srs:
  cards_from: [verfolgen, tausch]
