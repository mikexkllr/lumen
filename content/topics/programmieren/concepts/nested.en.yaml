id: cs.programming.nested
type: concept
title: Patterns in patterns
summary: Loops with several commands.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: "A robot should drive a square: “forward, then turn right”. How often must it repeat that?"
    answer:
      value: 4
    hints:
      - How many sides does a square have?
    explanation: Four times the same. Whoever sees the pattern writes short programs.

  - kind: explain
    id: s1
    body: |
      A loop can hold several commands. "Repeat 4× – forward, forward, right" drives a square. Look for the **pattern** that repeats.

  - kind: problem
    id: quadrat
    widget: robot
    prompt: Collect all the gems along the edge – with at most 5 blocks.
    params: { grid: ["S**", "*.*", "***"], blocks: [forward, left, right, repeat, end], repeatCounts: [2, 3, 4], maxBlocks: 5, goal: collect }
    solution: { state: { program: [{ op: repeat, n: 4 }, { op: forward }, { op: forward }, { op: right }, { op: end }] } }
    hints:
      - Every side of the square is the same – two steps, then turn.
    explanation: Repeat 4× (forward, forward, right) – one pattern, four times.

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: How many single commands does the robot run for "Repeat 4× (forward, forward, right)"?
    params: { unit: commands }
    answer: { value: 12 }
    hints:
      - 4 passes of 3 commands each.
    explanation: 4 · 3 = 12 – only 5 blocks are written.

  - kind: problem
    id: muster
    widget: choice
    prompt: A program reads "forward, left, forward, left, forward, left". How do you shorten it?
    params:
      options:
        - { label: "Repeat 3× (forward, left)", correct: true }
        - { label: "Repeat 6× (forward)", feedback: "Then the turns are missing." }
        - { label: "Repeat 2× (forward, left, forward)", feedback: "That would give forward, left, forward, forward, left, forward – a different order." }
    hints:
      - Which pair repeats?
    explanation: The pair "forward, left" occurs three times.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many steps does the robot drive in total? “Repeat 3× ( repeat 4× ( forward, forward ), right )” – count only the “forward”.
    answer:
      value: 24
    hints:
      - "Inside: 4 · 2. Outside: times 3."
    explanation: 3 · 4 · 2 = 24.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A program draws a square with “repeat 4× (forward, right 90°)”. How do you draw a regular hexagon?
    params:
      options:
        - label: Repeat 6× (forward, right 60°)
          correct: true
        - label: Repeat 6× (forward, right 120°)
          feedback: 120° is the interior angle. You turn by the exterior angle.
        - label: Repeat 6× (forward, right 90°)
          feedback: 6 · 90° is 540° – that does not close.
    hints:
      - "At the end the robot has turned once all the way: 360°."
    explanation: 360° ÷ 6 = 60°. For an n-gon you always turn by 360°/n.
    difficulty: 3

srs:
  cards_from: [zaehlen, muster]
