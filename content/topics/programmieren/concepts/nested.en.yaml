id: cs.programming.nested
type: concept
title: Patterns in patterns
summary: Loops with several commands.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: explain
    body: |
      A loop can hold several commands. "Repeat 4× – forward, forward, right" drives a square. Look for the **pattern** that repeats.

  - kind: problem
    id: quadrat
    widget: robot
    prompt: Collect all the gems along the edge – with at most 5 blocks.
    params: { grid: ["S**", "*.*", "***"], blocks: [forward, left, right, repeat, end], repeatCounts: [2, 3, 4], maxBlocks: 5, goal: collect }
    solution: { state: { program: [{ op: repeat, n: 4 }, { op: forward }, { op: forward }, { op: right }, { op: end }] } }
    hints:
      - Every side of the square is the same – two steps, then turn.
    explanation: Repeat 4× (forward, forward, right) – one pattern, four times.

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: How many single commands does the robot run for "Repeat 4× (forward, forward, right)"?
    params: { unit: commands }
    answer: { value: 12 }
    hints:
      - 4 passes of 3 commands each.
    explanation: 4 · 3 = 12 – only 5 blocks are written.

  - kind: problem
    id: muster
    widget: choice
    prompt: A program reads "forward, left, forward, left, forward, left". How do you shorten it?
    params:
      options:
        - { label: "Repeat 3× (forward, left)", correct: true }
        - { label: "Repeat 6× (forward)", feedback: "Then the turns are missing." }
        - { label: "Repeat 2× (forward, left, forward)", feedback: "That would give forward, left, forward, forward, left, forward – a different order." }
    hints:
      - Which pair repeats?
    explanation: The pair "forward, left" occurs three times.

srs:
  cards_from: [zaehlen, muster]
