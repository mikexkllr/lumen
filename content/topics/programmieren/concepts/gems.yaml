id: cs.programming.gems
type: concept
title: Edelsteine sammeln
summary: Programme, die mehr tun als ankommen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: reihe
    widget: robot
    prompt: Sammle alle Edelsteine ein – mit höchstens 3 Blöcken.
    params: { grid: ["S*.*.*."], blocks: [forward, repeat, end], repeatCounts: [2, 3, 6], maxBlocks: 3, goal: collect }
    solution: { state: { program: [{ op: repeat, n: 6 }, { op: forward }, { op: end }] } }
    hints:
      - Sechsmal vorwärts – aber du hast nur drei Blöcke.
    explanation: Wiederhole 6× vorwärts – eine Schleife spart drei Viertel der Blöcke.

  - kind: explain
    id: s2
    body: |
      Ein Programm kann mehr als ein Ziel haben. Hier muss der Roboter **alle Edelsteine** einsammeln. Plane zuerst den Weg – dann schreibe die Befehle.

  - kind: problem
    id: ecke
    widget: robot
    prompt: Sammle die drei Edelsteine ein und ende auf dem Ziel.
    params: { grid: ["S*.", "#*.", "G*."], blocks: [forward, left, right], maxBlocks: 8, goal: collect }
    hints:
      - Erst nach rechts, dann nach unten, zuletzt nach links.
    explanation: vorwärts, rechts, vorwärts, vorwärts, rechts, vorwärts.

  - kind: problem
    id: plan
    widget: choice
    prompt: Was ist meist der klügste erste Schritt beim Programmieren?
    params:
      options:
        - { label: Den Weg im Kopf oder auf Papier planen, correct: true }
        - { label: Sofort möglichst viele Blöcke legen, feedback: "Ohne Plan entstehen schnell lange, fehlerhafte Programme." }
    hints:
      - Was spart später das Debuggen?
    explanation: Erst denken, dann tippen – Profis skizzieren ihre Lösung zuerst.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Erst planen, dann programmieren spart meistens Zeit.
          right: true
        - text: Das kürzeste Programm ist immer das beste.
          right: false
          why: Es muss vor allem richtig und verständlich sein.
        - text: Dasselbe Ziel lässt sich oft mit verschiedenen Programmen erreichen.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Roboter soll Edelsteine auf einem 3 × 3-Feld einsammeln. Welcher Plan ist am besten zu programmieren?
    params:
      options:
        - label: In Schlangenlinien Zeile für Zeile – das ergibt ein wiederholbares Muster
          correct: true
        - label: Immer zum nächstgelegenen Stein
          feedback: Das ergibt kein festes Muster für eine Schleife.
        - label: Zufällig herumfahren
          feedback: Das kann sehr lange dauern.
    hints:
      - Schleifen brauchen ein Muster, das sich wiederholt.
    explanation: Gute Programme nutzen **Regelmäßigkeit**. Wer das Muster sieht, schreibt weniger Code.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Staubsaugerroboter fährt ein Zimmer von 4 m × 5 m in Bahnen von 25 cm Breite ab. Wie viele Meter fährt er mindestens?
    params:
      unit: m
    answer:
      value: 80
    hints:
      - "Fläche geteilt durch Bahnbreite: 20 m² : 0,25 m."
    explanation: 80 Meter. Jede Überlappung und jeder Umweg kommt obendrauf – darum lohnt sich gute Planung.
    difficulty: 3

srs:
  cards_from: [reihe, plan]
