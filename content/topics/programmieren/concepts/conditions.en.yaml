id: cs.programming.conditions
type: concept
title: If, then, else
summary: Programs that decide.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The smart garden light
    body: 'A garden light decides all by itself whether to switch on. Switch "dark" and "motion" on and off. Find the rule: **if** … **then** …'
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: D
            label: dark
          - id: M
            label: motion
        gates:
          - id: g
            type: AND
            in:
              - D
              - M
        outputs:
          - id: L
            from: g
            label: Light

  - kind: problem
    id: hook
    widget: choice
    prompt: “If it rains, take the umbrella, otherwise the sunglasses.” It is not raining. What do you take?
    params:
      options:
        - label: The sunglasses
          correct: true
        - label: The umbrella
          feedback: Only when it rains.
        - label: Both
          feedback: The rule always names exactly one.
    hints:
      - Which part of the rule applies without rain?
    explanation: That is how a program decides too.

  - kind: explain
    id: s1
    body: |
      With **if … then … else**, a **program** decides based on the situation: "If the number is even, halve it. Otherwise, multiply it by 3 and add 1."

  - kind: problem
    id: collatz
    widget: order
    prompt: Apply the rule to 6 again and again. Put the numbers in the right order.
    params:
      items:
        - { label: "6" }
        - { label: "3" }
        - { label: "10" }
        - { label: "5" }
        - { label: "16" }
    hints:
      - 6 is even – halve it. 3 is odd – times 3 plus 1.
    explanation: 6, 3, 10, 5, 16, 8, 4, 2, 1 – for every number tested, this sequence ends in 1. To this day, nobody has proved it.

  - kind: problem
    id: zweig
    widget: numeric
    body: "If temperature > 25: fan = 3, else if temperature > 18: fan = 1, else fan = 0."
    prompt: Which level runs at {{t}} °C?
    params: { placeholder: "Level" }
    answer: { value: "{{t > 25 ? 3 : t > 18 ? 1 : 0}}" }
    hints:
      - Check the conditions from top to bottom.
    explanation: The first matching condition wins.
    variants:
      params: { t: "choice[12,20,24,28,31]" }
      defaults: { t: 20 }

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: 'What happens with "if age ≥ 18, then entry, else no entry"?'
    params:
      buckets: [{ label: Entry }, { label: No entry }]
      items:
        - { label: Age 18, bucket: Entry }
        - { label: Age 40, bucket: Entry }
        - { label: Age 16, bucket: No entry }
        - { label: Age 17, bucket: No entry }
    hints:
      - Greater than or equal – 18 counts.
    explanation: Edge cases like exactly 18 are the most common source of errors in conditions.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 5 > 3 AND 2 < 4
          right: true
        - text: 5 > 3 AND 2 > 4
          right: false
        - text: 5 < 3 OR 2 < 4
          right: true
        - text: NOT (5 < 3)
          right: true
      left: "False"
      right: "True"

  - kind: problem
    id: intro-c1
    widget: gates
    prompt: You may enter the concert if you are an adult or come with one. Choose the gate for the entrance.
    params:
      inputs:
        - id: V
          label: adult
        - id: B
          label: accompanied
      gates:
        - id: g
          type: "?"
          in:
            - V
            - B
          options:
            - AND
            - OR
      outputs:
        - id: E
          from: g
          label: Entry
    check:
      predicate: table('E') == [0, 1, 1, 1]
    hints:
      - Must both be true, or is one of them enough?
      - One is enough – that is an OR.
    explanation: '"If adult or accompanied, then entry." Every condition in a program is a value like this: true or false.'

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "The Collatz rule: even → halve, odd → times 3 plus 1. How many steps does 7 need to arrive at 1?"
    answer:
      value: 16
    hints:
      - 7, 22, 11, 34, 17, 52, 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1.
    explanation: 16 steps. Whether **every** number ends at 1 is unproven to this day.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "Rule: if x > 10, then x = x − 10, else x = x · 3. Apply the rule twice to {{x}}. What do you get?"
    answer:
      value: "{{z}}"
    hints:
      - Apply the rule once and write down the result.
      - After the first time x = {{y}}. Is that greater than 10?
    explanation: "{{x}} → {{y}} → {{z}}."
    difficulty: 2
    variants:
      params:
        x: int[2,25]
      derive:
        y: "x > 10 ? x - 10 : 3 * x"
        z: "y > 10 ? y - 10 : 3 * y"
      defaults:
        x: 7

  - kind: problem
    id: cs-d2
    depth: 2
    widget: buckets
    prompt: For which numbers is »x > 3 AND x < 8« true?
    params:
      buckets:
        - id: b1
          label: "true"
        - id: b2
          label: "false"
      items:
        - label: "2"
          bucket: b2
        - label: "3"
          bucket: b2
        - label: "4"
          bucket: b1
        - label: "7"
          bucket: b1
        - label: "8"
          bucket: b2
        - label: "10"
          bucket: b2
    hints:
      - Both parts must hold.
      - 3 > 3 is false, and so is 8 < 8.
    explanation: True only for 4, 5, 6 and 7. The edges 3 and 8 are excluded – exactly where many bugs happen.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: "»If score ≥ 50: »passed«. Else if score ≥ 90: »excellent«.« What appears for a score of 95?"
    params:
      options:
        - label: »passed« – the second condition is never reached
          correct: true
        - label: »excellent«
          feedback: 95 ≥ 50 is already true, so the check stops there.
        - label: both
          feedback: With »else if« at most one branch runs.
    hints:
      - Conditions are checked from top to bottom.
      - Which number ≥ 90 is not also ≥ 50?
    explanation: "The more specific case must come first: ≥ 90 before ≥ 50. Otherwise the second branch is dead code."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A leap year: divisible by 4 but not by 100 – unless it is divisible by 400. Which year is **not** a leap year?"
    params:
      options:
        - label: "1900"
          correct: true
        - label: "2000"
          feedback: Divisible by 400 – a leap year.
        - label: "2024"
          feedback: Divisible by 4, not by 100 – a leap year.
    hints:
      - Check the conditions in the right order.
    explanation: 1900 is divisible by 100 but not by 400. Nested conditions are a common source of bugs.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Many languages evaluate with **short-circuiting**: in »A AND B«, B is not even checked if A is already false. So »n ≠ 0 AND 10 / n > 2« is safe – it never divides by 0."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Which condition is the same as NOT (x > 5 AND x < 10)?
    params:
      options:
        - label: x ≤ 5 OR x ≥ 10
          correct: true
        - label: x ≤ 5 AND x ≥ 10
          feedback: That can never hold at once.
        - label: x < 5 OR x > 10
          feedback: Then 5 and 10 themselves are missing.
    hints:
      - "De Morgan: NOT (A AND B) = (NOT A) OR (NOT B)."
      - The opposite of x > 5 is x ≤ 5.
    explanation: AND turns into OR and each condition flips. The edges 5 and 10 are now included.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: A program has 3 if-then-else checks in a row. How many different paths through the code are there?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 6
        misconception: add-paths
        text: "The paths multiply: each check doubles them."
    hints:
      - Each check has 2 outcomes.
      - 2 · 2 · 2.
    explanation: $2^3$ = 8 paths. With 30 checks it would be over a billion – testing every path quickly becomes impossible.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how a program decides with »if … then … else«.
    params:
      keywords:
        - - bedingung
          - condition
          - prüf
          - check
          - test
        - - wahr
          - "true"
          - erfüllt
          - stimmt
          - holds
        - - sonst
          - else
          - andernfalls
          - otherwise
      sample: The program checks a condition. If it is true, the then-part runs. Otherwise the else-part runs. That way it reacts differently depending on the input.
    difficulty: 3

srs:
  cards_from: [zweig, sortieren]
