id: cs.programming.conditions
type: concept
title: If, then, else
summary: Programs that decide.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      With **if … then … else**, a program decides based on the situation: "If the number is even, halve it. Otherwise, multiply it by 3 and add 1."

  - kind: problem
    id: collatz
    widget: order
    prompt: Apply the rule to 6 again and again. Put the numbers in the right order.
    params:
      items:
        - { label: "6" }
        - { label: "3" }
        - { label: "10" }
        - { label: "5" }
        - { label: "16" }
    hints:
      - 6 is even – halve it. 3 is odd – times 3 plus 1.
    explanation: 6, 3, 10, 5, 16, 8, 4, 2, 1 – for every number tested, this sequence ends in 1. To this day, nobody has proved it.

  - kind: problem
    id: zweig
    widget: numeric
    body: "If temperature > 25: fan = 3, else if temperature > 18: fan = 1, else fan = 0."
    prompt: Which level runs at {{t}} °C?
    params: { placeholder: "Level" }
    answer: { value: "{{t > 25 ? 3 : t > 18 ? 1 : 0}}" }
    hints:
      - Check the conditions from top to bottom.
    explanation: The first matching condition wins.
    variants:
      params: { t: "choice[12,20,24,28,31]" }
      defaults: { t: 20 }

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: 'What happens with "if age ≥ 18, then entry, else no entry"?'
    params:
      buckets: [{ label: Entry }, { label: No entry }]
      items:
        - { label: Age 18, bucket: Entry }
        - { label: Age 40, bucket: Entry }
        - { label: Age 16, bucket: No entry }
        - { label: Age 17, bucket: No entry }
    hints:
      - Greater than or equal – 18 counts.
    explanation: Edge cases like exactly 18 are the most common source of errors in conditions.

srs:
  cards_from: [zweig, sortieren]
