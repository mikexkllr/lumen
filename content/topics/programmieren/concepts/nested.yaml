id: cs.programming.nested
type: concept
title: Muster in Mustern
summary: Schleifen mit mehreren Befehlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: explain
    body: |
      In eine Schleife passen mehrere Befehle. »Wiederhole 4× – vorwärts, vorwärts, rechts« fährt ein Quadrat. Suche das **Muster**, das sich wiederholt.

  - kind: problem
    id: quadrat
    widget: robot
    prompt: Sammle alle Edelsteine am Rand ein – mit höchstens 5 Blöcken.
    params: { grid: ["S**", "*.*", "***"], blocks: [forward, left, right, repeat, end], repeatCounts: [2, 3, 4], maxBlocks: 5, goal: collect }
    solution: { state: { program: [{ op: repeat, n: 4 }, { op: forward }, { op: forward }, { op: right }, { op: end }] } }
    hints:
      - Jede Seite des Quadrats ist gleich – zwei Schritte, dann drehen.
    explanation: Wiederhole 4× (vorwärts, vorwärts, rechts) – ein Muster, viermal.

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: Wie viele einzelne Befehle führt der Roboter bei »Wiederhole 4× (vorwärts, vorwärts, rechts)« aus?
    params: { unit: Befehle }
    answer: { value: 12 }
    hints:
      - 4 Durchläufe zu je 3 Befehlen.
    explanation: 4 · 3 = 12 – geschrieben sind nur 5 Blöcke.

  - kind: problem
    id: muster
    widget: choice
    prompt: Ein Programm lautet »vorwärts, links, vorwärts, links, vorwärts, links«. Wie kürzt man es?
    params:
      options:
        - { label: "Wiederhole 3× (vorwärts, links)", correct: true }
        - { label: "Wiederhole 6× (vorwärts)", feedback: "Dann fehlen die Drehungen." }
        - { label: "Wiederhole 2× (vorwärts, links, vorwärts)", feedback: "Das ergäbe vorwärts, links, vorwärts, vorwärts, links, vorwärts – eine andere Reihenfolge." }
    hints:
      - Welches Paar wiederholt sich?
    explanation: Das Paar »vorwärts, links« kommt dreimal vor.

srs:
  cards_from: [zaehlen, muster]
