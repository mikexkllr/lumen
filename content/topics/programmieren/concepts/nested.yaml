id: cs.programming.nested
type: concept
title: Muster in Mustern
summary: Schleifen mit mehreren Befehlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: "Ein Roboter soll ein Quadrat fahren: »vorwärts, dann rechts drehen«. Wie oft muss er das wiederholen?"
    answer:
      value: 4
    hints:
      - Wie viele Seiten hat ein Quadrat?
    explanation: Viermal dasselbe. Wer das Muster sieht, schreibt kurze Programme.

  - kind: explain
    id: s1
    body: |
      In eine Schleife passen mehrere Befehle. »Wiederhole 4× – vorwärts, vorwärts, rechts« fährt ein Quadrat. Suche das **Muster**, das sich wiederholt.

  - kind: problem
    id: quadrat
    widget: robot
    prompt: Sammle alle Edelsteine am Rand ein – mit höchstens 5 Blöcken.
    params: { grid: ["S**", "*.*", "***"], blocks: [forward, left, right, repeat, end], repeatCounts: [2, 3, 4], maxBlocks: 5, goal: collect }
    solution: { state: { program: [{ op: repeat, n: 4 }, { op: forward }, { op: forward }, { op: right }, { op: end }] } }
    hints:
      - Jede Seite des Quadrats ist gleich – zwei Schritte, dann drehen.
    explanation: Wiederhole 4× (vorwärts, vorwärts, rechts) – ein Muster, viermal.

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: Wie viele einzelne Befehle führt der Roboter bei »Wiederhole 4× (vorwärts, vorwärts, rechts)« aus?
    params: { unit: Befehle }
    answer: { value: 12 }
    hints:
      - 4 Durchläufe zu je 3 Befehlen.
    explanation: 4 · 3 = 12 – geschrieben sind nur 5 Blöcke.

  - kind: problem
    id: muster
    widget: choice
    prompt: Ein Programm lautet »vorwärts, links, vorwärts, links, vorwärts, links«. Wie kürzt man es?
    params:
      options:
        - { label: "Wiederhole 3× (vorwärts, links)", correct: true }
        - { label: "Wiederhole 6× (vorwärts)", feedback: "Dann fehlen die Drehungen." }
        - { label: "Wiederhole 2× (vorwärts, links, vorwärts)", feedback: "Das ergäbe vorwärts, links, vorwärts, vorwärts, links, vorwärts – eine andere Reihenfolge." }
    hints:
      - Welches Paar wiederholt sich?
    explanation: Das Paar »vorwärts, links« kommt dreimal vor.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Schritte fährt der Roboter insgesamt? »Wiederhole 3× ( Wiederhole 4× ( vorwärts, vorwärts ) , rechts )« – zähle nur die »vorwärts«.
    answer:
      value: 24
    hints:
      - "Innen: 4 · 2. Außen: mal 3."
    explanation: 3 · 4 · 2 = 24.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Programm zeichnet ein Quadrat mit »Wiederhole 4× (vorwärts, rechts 90°)«. Wie zeichnet man ein regelmäßiges Sechseck?
    params:
      options:
        - label: Wiederhole 6× (vorwärts, rechts 60°)
          correct: true
        - label: Wiederhole 6× (vorwärts, rechts 120°)
          feedback: 120° ist der Innenwinkel. Gedreht wird um den Außenwinkel.
        - label: Wiederhole 6× (vorwärts, rechts 90°)
          feedback: 6 · 90° sind 540° – das schließt sich nicht.
    hints:
      - "Am Ende hat sich der Roboter einmal ganz gedreht: 360°."
    explanation: "360° : 6 = 60°. Für ein n-Eck dreht man immer um 360°/n."
    difficulty: 3

srs:
  cards_from: [zaehlen, muster]
