id: cs.programming.nested
type: concept
title: Muster in Mustern
summary: Schleifen mit mehreren Befehlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Burgmauer
    body: "Burgmauern, Zäune, Strickmuster: Überall wiederholt sich **ein Muster aus mehreren Schritten**. Sammle die Edelsteine auf den Zinnen ein. Findest du das Stück, das sich wiederholt?"
    visual:
      widget: robot
      interactive: true
      params:
        grid:
          - "**#**##"
          - S.....G
        blocks:
          - forward
          - left
          - right
          - repeat
          - end
        repeatCounts:
          - 2
          - 3
          - 4
        maxBlocks: 20
        goal: collect

  - kind: problem
    id: hook
    widget: numeric
    prompt: "Ein Roboter soll ein Quadrat fahren: »vorwärts, dann rechts drehen«. Wie oft muss er das wiederholen?"
    answer:
      value: 4
    hints:
      - Wie viele Seiten hat ein Quadrat?
    explanation: Viermal dasselbe. Wer das Muster sieht, schreibt kurze Programme.

  - kind: explain
    id: s1
    body: |
      In eine Schleife passen mehrere Befehle. »Wiederhole 4× – vorwärts, vorwärts, rechts« fährt ein Quadrat. Suche das **Muster**, das sich wiederholt.

  - kind: problem
    id: quadrat
    widget: robot
    prompt: Sammle alle Edelsteine am Rand ein – mit höchstens 5 Blöcken.
    params: { grid: ["S**", "*.*", "***"], blocks: [forward, left, right, repeat, end], repeatCounts: [2, 3, 4], maxBlocks: 5, goal: collect }
    solution: { state: { program: [{ op: repeat, n: 4 }, { op: forward }, { op: forward }, { op: right }, { op: end }] } }
    hints:
      - Jede Seite des Quadrats ist gleich – zwei Schritte, dann drehen.
    explanation: Wiederhole 4× (vorwärts, vorwärts, rechts) – ein Muster, viermal.

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: Wie viele einzelne Befehle führt der Roboter bei »Wiederhole 4× (vorwärts, vorwärts, rechts)« aus?
    params: { unit: Befehle }
    answer: { value: 12 }
    hints:
      - 4 Durchläufe zu je 3 Befehlen.
    explanation: 4 · 3 = 12 – geschrieben sind nur 5 Blöcke.

  - kind: problem
    id: muster
    widget: choice
    prompt: Ein Programm lautet »vorwärts, links, vorwärts, links, vorwärts, links«. Wie kürzt man es?
    params:
      options:
        - { label: "Wiederhole 3× (vorwärts, links)", correct: true }
        - { label: "Wiederhole 6× (vorwärts)", feedback: "Dann fehlen die Drehungen." }
        - { label: "Wiederhole 2× (vorwärts, links, vorwärts)", feedback: "Das ergäbe vorwärts, links, vorwärts, vorwärts, links, vorwärts – eine andere Reihenfolge." }
    hints:
      - Welches Paar wiederholt sich?
    explanation: Das Paar »vorwärts, links« kommt dreimal vor.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Schritte fährt der Roboter insgesamt? »Wiederhole 3× ( Wiederhole 4× ( vorwärts, vorwärts ) , rechts )« – zähle nur die »vorwärts«.
    answer:
      value: 24
    hints:
      - "Innen: 4 · 2. Außen: mal 3."
    explanation: 3 · 4 · 2 = 24.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: Wie viele einzelne Befehle führt der Roboter aus? »Wiederhole {{a}}× ( Wiederhole {{b}}× vorwärts, dann rechts )«
    answer:
      value: "{{a * (b + 1)}}"
    feedback:
      - when: numval(state.input) == a * b
        misconception: forgot-outer
        text: Das sind nur die »vorwärts«. Das »rechts« kommt in jeder äußeren Runde dazu.
      - when: numval(state.input) == a + b + 1
        misconception: add-loops
        text: Verschachtelte Schleifen multiplizieren – sie addieren nicht.
    hints:
      - Was passiert in einer einzigen äußeren Runde?
      - "{{b}}-mal vorwärts plus einmal rechts – und das {{a}}-mal."
    explanation: "{{a}} · ({{b}} + 1) = {{a * (b + 1)}} Befehle."
    difficulty: 2
    variants:
      params:
        a: int[2,6]
        b: int[2,6]
      defaults:
        a: 4
        b: 3

  - kind: problem
    id: cs-d2
    depth: 2
    widget: order
    prompt: "»Für i von 1 bis 3: Für j von 1 bis 2: drucke i-j.« In welcher Reihenfolge erscheinen die Ausgaben?"
    params:
      items:
        - label: 1-1
        - label: 1-2
        - label: 2-1
        - label: 2-2
        - label: 3-1
        - label: 3-2
      direction: horizontal
    hints:
      - Die innere Schleife läuft ganz durch, bevor i weiterzählt.
      - Bei i = 1 kommen erst j = 1 und j = 2.
    explanation: "Wie bei einer Uhr: Der innere Zähler j dreht schnell, der äußere i langsam. 3 · 2 = 6 Ausgaben."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Was zeichnet »Wiederhole 5× (vorwärts, rechts 144°)«?
    params:
      options:
        - label: Einen fünfzackigen Stern
          correct: true
        - label: Ein Fünfeck
          feedback: Dafür wären es 72° pro Ecke.
        - label: Nichts Geschlossenes
          feedback: 5 · 144° = 720° – zwei volle Runden, die Figur schließt sich.
    hints:
      - Wie viel dreht er sich insgesamt?
      - 720° sind zwei Runden. Beim Fünfeck ist es eine.
    explanation: "5 · 144° = 720°: Der Roboter umrundet die Mitte zweimal und zeichnet dabei einen Stern."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Programm zeichnet ein Quadrat mit »Wiederhole 4× (vorwärts, rechts 90°)«. Wie zeichnet man ein regelmäßiges Sechseck?
    params:
      options:
        - label: Wiederhole 6× (vorwärts, rechts 60°)
          correct: true
        - label: Wiederhole 6× (vorwärts, rechts 120°)
          feedback: 120° ist der Innenwinkel. Gedreht wird um den Außenwinkel.
        - label: Wiederhole 6× (vorwärts, rechts 90°)
          feedback: 6 · 90° sind 540° – das schließt sich nicht.
    hints:
      - "Am Ende hat sich der Roboter einmal ganz gedreht: 360°."
    explanation: "360° : 6 = 60°. Für ein n-Eck dreht man immer um 360°/n."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Drei verschachtelte Schleifen mit je 10 Durchläufen. Wie oft läuft die innerste Zeile?
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 30
        misconception: add-loops
        text: Verschachtelte Schleifen multiplizieren.
    hints:
      - Zwei Schleifen ergäben 10 · 10.
      - Noch einmal mal 10.
    explanation: 10 · 10 · 10 = 1000. Jede weitere Ebene vervielfacht – daher kommt O(n³).
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Der Roboter zeichnet ein regelmäßiges {{n}}-Eck. Um wie viel Grad muss er sich an jeder Ecke drehen?
    params:
      unit: °
    answer:
      value: "{{360 / n}}"
    feedback:
      - when: numval(state.input) == 180 - 360 / n
        misconception: interior-angle
        text: Das ist der Innenwinkel. Der Roboter dreht um den Außenwinkel.
    hints:
      - Nach allen Ecken hat er sich einmal ganz gedreht.
      - 360° verteilt auf {{n}} Ecken.
    explanation: 360° / {{n}} = {{360 / n}}°. Insgesamt dreht er sich genau einmal um sich selbst.
    difficulty: 3
    variants:
      params:
        n: choice[3,5,6,8,9,10,12]
      defaults:
        n: 6

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum sich die Durchläufe innerer Schleifen multiplizieren.
    params:
      keywords:
        - - jede
          - jeden
          - each
          - every
        - - mal
          - multipl
          - times
        - - innen
          - innere
          - inner
      sample: Die innere Schleife läuft in jeder Runde der äußeren komplett durch. Läuft die äußere 3-mal und die innere 4-mal, sind das 3 mal 4 = 12 Durchläufe.
    difficulty: 3

srs:
  cards_from: [zaehlen, muster]
