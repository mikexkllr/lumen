id: cs.programming.functions
type: concept
title: Functions
summary: Write once, use often.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      A **function** is a named building block: you feed values in and get a result back. `double(x)` returns `2 · x` – everywhere you call it.

  - kind: problem
    id: aufruf
    widget: numeric
    body: "f(x) = 2 · x + 1"
    prompt: What is f(f({{a}}))?
    params: { placeholder: "Result" }
    answer: { value: "{{2 * (2 * a + 1) + 1}}" }
    hints:
      - "Inside first: f({{a}}) = {{2 * a + 1}}."
    explanation: "f({{a}}) = {{2 * a + 1}}, then f({{2 * a + 1}}) = {{2 * (2 * a + 1) + 1}}."
    variants:
      params: { a: "int[1,9]" }
      defaults: { a: 3 }

  - kind: problem
    id: namen
    widget: match
    prompt: Which name fits which function?
    params:
      pairs:
        - { left: "the larger number", right: maximum }
        - { left: "Celsius to Fahrenheit", right: celsius_to_f }
        - { left: "Is the number even?", right: is_even }
    hints:
      - Good names say what the function does.
    explanation: Clear names make programs readable – even for your future self.

  - kind: problem
    id: warum
    widget: buckets
    prompt: Is this a reason for a function?
    params:
      buckets: [{ label: "yes" }, { label: "no" }]
      items:
        - { label: The same code appears five times, bucket: "yes" }
        - { label: One part should be testable on its own, bucket: "yes" }
        - { label: A command is needed exactly once, bucket: "no" }
    hints:
      - When is a separate building block worth it?
    explanation: Functions pay off for repetition and for clean testing.

srs:
  cards_from: [aufruf, warum]
