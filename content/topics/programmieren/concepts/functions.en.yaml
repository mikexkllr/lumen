id: cs.programming.functions
type: concept
title: Functions
summary: Write once, use often.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: A machine doubles every number. You drop in a 7. What comes out?
    answer:
      value: 14
    hints:
      - 7 · 2.
    explanation: Something in, something out. Such a machine is called a function.

  - kind: explain
    id: s1
    body: |
      A **function** is a named building block: you feed values in and get a result back. `double(x)` returns `2 · x` – everywhere you call it.

  - kind: problem
    id: aufruf
    widget: numeric
    body: "f(x) = 2 · x + 1"
    prompt: What is f(f({{a}}))?
    params: { placeholder: "Result" }
    answer: { value: "{{2 * (2 * a + 1) + 1}}" }
    hints:
      - "Inside first: f({{a}}) = {{2 * a + 1}}."
    explanation: "f({{a}}) = {{2 * a + 1}}, then f({{2 * a + 1}}) = {{2 * (2 * a + 1) + 1}}."
    variants:
      params: { a: "int[1,9]" }
      defaults: { a: 3 }

  - kind: problem
    id: namen
    widget: match
    prompt: Which name fits which function?
    params:
      pairs:
        - { left: "the larger number", right: maximum }
        - { left: "Celsius to Fahrenheit", right: celsius_to_f }
        - { left: "Is the number even?", right: is_even }
    hints:
      - Good names say what the function does.
    explanation: Clear names make programs readable – even for your future self.

  - kind: problem
    id: warum
    widget: buckets
    prompt: Is this a reason for a function?
    params:
      buckets: [{ label: "yes" }, { label: "no" }]
      items:
        - { label: The same code appears five times, bucket: "yes" }
        - { label: One part should be testable on its own, bucket: "yes" }
        - { label: A command is needed exactly once, bucket: "no" }
    hints:
      - When is a separate building block worth it?
    explanation: Functions pay off for repetition and for clean testing.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: f(x) returns 3 · x, g(x) returns x + 2. What is g(f(4))?
    answer:
      value: 14
    hints:
      - "Inside first: f(4) = 12."
    explanation: g(12) = 14. The other way round, f(g(4)) = 18.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: f(x) returns x + 1. g(x) returns 2 · f(x). What is g(f({{a}}))?
    answer:
      value: "{{2 * (a + 2)}}"
    feedback:
      - when: numval(state.input) == 2 * (a + 1)
        misconception: missed-inner-call
        text: g calls f once more itself – 1 is added twice.
    hints:
      - "Work from the inside out: first f({{a}})."
      - f({{a}}) = {{a + 1}}. Then g({{a + 1}}) = 2 · f({{a + 1}}).
    explanation: f({{a}}) = {{a + 1}}, f({{a + 1}}) = {{a + 2}}, times 2 gives {{2 * (a + 2)}}.
    difficulty: 2
    variants:
      params:
        a: int[2,9]
      defaults:
        a: 4

  - kind: explain
    id: cs-d2
    depth: 2
    body: A **parameter** is the placeholder inside the function, the argument is the value in the call. In `double(x)`, x is the parameter; in `double(7)`, 7 is the argument.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: order
    prompt: What happens in print(double(plus1(3)))? Put the steps in the right order.
    params:
      items:
        - label: plus1(3) returns 4
        - label: double(4) returns 8
        - label: print(8) shows 8
    hints:
      - A call first needs the value of its argument.
      - From the inside out.
    explanation: First the arguments are evaluated, then the function is called. That is why the innermost runs first.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: x = 5. The function set() does x = 9 inside. Afterwards you print x outside. What appears if the x inside the function is local?
    params:
      options:
        - label: 5 – the inner x is a separate variable
          correct: true
        - label: "9"
          feedback: That would happen if the function could change the outer x.
        - label: An error
          feedback: Two variables with the same name in different scopes are allowed.
    hints:
      - "Local means: visible only inside the function."
      - The outer x is never touched.
    explanation: Every function has its own scope. That way functions do not interfere with each other.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A function is called **pure** if it always returns the same for the same inputs and changes nothing else. Why is that so valuable?
    params:
      options:
        - label: You can test and understand it on its own – without knowing the rest of the program
          correct: true
        - label: It runs faster
          feedback: Not necessarily – it is about reliability.
        - label: It needs no memory
          feedback: Every function needs memory.
    hints:
      - What do you need to know to predict its result?
    explanation: Only the inputs. Large programs stay manageable when building blocks have no hidden side effects.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what are functions good for in programming?"
    params:
      keywords:
        - - wiederverwend
          - mehrfach
          - reuse
          - again
          - oft
          - often
        - - name
          - baustein
          - block
          - building
        - - einmal
          - once
          - schreib
          - write
          - änder
          - change
      sample: A function is a building block with a name. You write the code only once and can reuse it everywhere – and need to change bugs in just one place.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: twice(f, x) returns f(f(x)). What is twice(double, {{a}})?
    answer:
      value: "{{4 * a}}"
    feedback:
      - when: numval(state.input) == 2 * a
        misconception: once
        text: double is applied twice, not once.
    hints:
      - twice receives a function as its argument.
      - double(double({{a}})).
    explanation: double({{a}}) = {{2 * a}}, double({{2 * a}}) = {{4 * a}}. Functions that take functions are called higher-order.
    difficulty: 3
    variants:
      params:
        a: int[3,12]
      defaults:
        a: 5

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: What does map(square, [1, 2, 3]) give?
    params:
      options:
        - label: "[1, 4, 9]"
          correct: true
        - label: "14"
          feedback: That would be the sum of squares. map returns a list.
        - label: "[1, 2, 3, 1, 2, 3]"
          feedback: map applies the function to each element.
    hints:
      - map applies a function to every element.
      - square(2) = 4.
    explanation: map builds a new list of f(x) for every x. That replaces many loops – shorter and harder to get wrong.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: A function bumps a global counter on every call and returns it. Why does that make testing hard?
    params:
      options:
        - label: The result depends on how often it ran before
          correct: true
        - label: Because counters are slow
          feedback: A counter costs hardly any time.
        - label: Because global variables are forbidden
          feedback: They are allowed – they just make behaviour unpredictable.
    hints:
      - Call it twice with the same input.
      - A pure function always gives the same output for the same input.
    explanation: Such side effects invisibly tie parts of a program together. Pure functions can be checked on their own.
    difficulty: 3

srs:
  cards_from: [aufruf, warum]
