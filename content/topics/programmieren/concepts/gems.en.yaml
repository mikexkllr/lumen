id: cs.programming.gems
type: concept
title: Collecting gems
summary: Programs that do more than arrive.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: reihe
    widget: robot
    prompt: Collect all the gems – with at most 3 blocks.
    params: { grid: ["S*.*.*."], blocks: [forward, repeat, end], repeatCounts: [2, 3, 6], maxBlocks: 3, goal: collect }
    solution: { state: { program: [{ op: repeat, n: 6 }, { op: forward }, { op: end }] } }
    hints:
      - Six times forward – but you only have three blocks.
    explanation: Repeat forward 6 times. A loop saves three quarters of the blocks.

  - kind: explain
    id: s2
    body: |
      A program can have more than one goal. Here, the **robot** must collect **all the gems**. Plan the path first – then write the commands.

  - kind: problem
    id: ecke
    widget: robot
    prompt: Collect the three gems and finish on the goal.
    params: { grid: ["S*.", "#*.", "G*."], blocks: [forward, left, right], maxBlocks: 8, goal: collect }
    hints:
      - First right, then down, finally left.
    explanation: forward, right, forward, forward, right, forward.

  - kind: problem
    id: plan
    widget: choice
    prompt: What is usually the smartest first step in programming?
    params:
      options:
        - { label: Plan the path in your head or on paper, correct: true }
        - { label: Place as many blocks as possible right away, feedback: "Without a plan, you quickly end up with long, faulty programs." }
    hints:
      - What saves debugging later?
    explanation: Think first, then type – pros sketch their solution first.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Planning first, then programming usually saves time.
          right: true
        - text: The shortest program is always the best.
          right: false
          why: Above all it must be correct and understandable.
        - text: The same goal can often be reached with different programs.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A robot should collect gems on a 3 × 3 field. Which plan is best to program?
    params:
      options:
        - label: In serpentine lines row by row – that gives a repeatable pattern
          correct: true
        - label: Always to the nearest gem
          feedback: That gives no fixed pattern for a loop.
        - label: Drive around at random
          feedback: That can take very long.
    hints:
      - Loops need a pattern that repeats.
    explanation: Good programs exploit **regularity**. Whoever sees the pattern writes less code.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A robot vacuum covers a room of 4 m × 5 m in lanes 25 cm wide. How many metres does it travel at least?
    params:
      unit: m
    answer:
      value: 80
    hints:
      - "Area divided by lane width: 20 m² ÷ 0.25 m."
    explanation: 80 metres. Every overlap and detour adds to that – that is why good planning pays off.
    difficulty: 3

srs:
  cards_from: [reihe, plan]
