id: cs.programming.conditions
type: concept
title: Wenn, dann, sonst
summary: Programme, die entscheiden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Mit **wenn … dann … sonst** entscheidet ein Programm je nach Lage: »Wenn die Zahl gerade ist, halbiere sie, sonst nimm sie mal 3 und zähle 1 dazu.«

  - kind: problem
    id: collatz
    widget: order
    prompt: Wende die Regel immer wieder auf 6 an. Bring die Zahlen in die richtige Reihenfolge.
    params:
      items:
        - { label: "6" }
        - { label: "3" }
        - { label: "10" }
        - { label: "5" }
        - { label: "16" }
    hints:
      - 6 ist gerade – halbieren. 3 ist ungerade – mal 3 plus 1.
    explanation: 6, 3, 10, 5, 16, 8, 4, 2, 1 – diese Folge endet bei jeder getesteten Zahl in der 1. Bewiesen ist es bis heute nicht.

  - kind: problem
    id: zweig
    widget: numeric
    body: "Wenn Temperatur > 25: Ventilator = 3, sonst wenn Temperatur > 18: Ventilator = 1, sonst Ventilator = 0."
    prompt: Welche Stufe läuft bei {{t}} °C?
    params: { placeholder: "Stufe" }
    answer: { value: "{{t > 25 ? 3 : t > 18 ? 1 : 0}}" }
    hints:
      - Prüfe die Bedingungen von oben nach unten.
    explanation: Die erste passende Bedingung gewinnt.
    variants:
      params: { t: "choice[12,20,24,28,31]" }
      defaults: { t: 20 }

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Was passiert bei Alter = 16 mit »wenn Alter ≥ 18, dann Zutritt, sonst kein Zutritt«?
    params:
      buckets: [{ label: Zutritt }, { label: kein Zutritt }]
      items:
        - { label: Alter 18, bucket: Zutritt }
        - { label: Alter 40, bucket: Zutritt }
        - { label: Alter 16, bucket: kein Zutritt }
        - { label: Alter 17, bucket: kein Zutritt }
    hints:
      - Größer oder gleich – 18 zählt mit.
    explanation: Grenzfälle wie genau 18 sind die häufigste Fehlerquelle bei Bedingungen.

srs:
  cards_from: [zweig, sortieren]
