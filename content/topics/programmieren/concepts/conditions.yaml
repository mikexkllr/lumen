id: cs.programming.conditions
type: concept
title: Wenn, dann, sonst
summary: Programme, die entscheiden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: »Wenn es regnet, nimm den Schirm, sonst die Sonnenbrille.« Es regnet nicht. Was nimmst du?
    params:
      options:
        - label: Die Sonnenbrille
          correct: true
        - label: Den Schirm
          feedback: Nur bei Regen.
        - label: Beides
          feedback: Die Regel nennt immer genau eines.
    hints:
      - Welcher Teil der Regel gilt ohne Regen?
    explanation: So entscheidet auch ein Programm.

  - kind: explain
    id: s1
    body: |
      Mit **wenn … dann … sonst** entscheidet ein **Programm** je nach Lage: »Wenn die Zahl gerade ist, halbiere sie, sonst nimm sie mal 3 und zähle 1 dazu.«

  - kind: problem
    id: collatz
    widget: order
    prompt: Wende die Regel immer wieder auf 6 an. Bring die Zahlen in die richtige Reihenfolge.
    params:
      items:
        - { label: "6" }
        - { label: "3" }
        - { label: "10" }
        - { label: "5" }
        - { label: "16" }
    hints:
      - 6 ist gerade – halbieren. 3 ist ungerade – mal 3 plus 1.
    explanation: 6, 3, 10, 5, 16, 8, 4, 2, 1 – diese Folge endet bei jeder getesteten Zahl in der 1. Bewiesen ist es bis heute nicht.

  - kind: problem
    id: zweig
    widget: numeric
    body: "Wenn Temperatur > 25: Ventilator = 3, sonst wenn Temperatur > 18: Ventilator = 1, sonst Ventilator = 0."
    prompt: Welche Stufe läuft bei {{t}} °C?
    params: { placeholder: "Stufe" }
    answer: { value: "{{t > 25 ? 3 : t > 18 ? 1 : 0}}" }
    hints:
      - Prüfe die Bedingungen von oben nach unten.
    explanation: Die erste passende Bedingung gewinnt.
    variants:
      params: { t: "choice[12,20,24,28,31]" }
      defaults: { t: 20 }

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Was passiert bei Alter = 16 mit »wenn Alter ≥ 18, dann Zutritt, sonst kein Zutritt«?
    params:
      buckets: [{ label: Zutritt }, { label: kein Zutritt }]
      items:
        - { label: Alter 18, bucket: Zutritt }
        - { label: Alter 40, bucket: Zutritt }
        - { label: Alter 16, bucket: kein Zutritt }
        - { label: Alter 17, bucket: kein Zutritt }
    hints:
      - Größer oder gleich – 18 zählt mit.
    explanation: Grenzfälle wie genau 18 sind die häufigste Fehlerquelle bei Bedingungen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 5 > 3 UND 2 < 4
          right: true
        - text: 5 > 3 UND 2 > 4
          right: false
        - text: 5 < 3 ODER 2 < 4
          right: true
        - text: NICHT (5 < 3)
          right: true
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Die Collatz-Regel: gerade → halbieren, ungerade → mal 3 plus 1. Wie viele Schritte braucht die 7, bis sie bei 1 ankommt?"
    answer:
      value: 16
    hints:
      - 7, 22, 11, 34, 17, 52, 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1.
    explanation: 16 Schritte. Ob **jede** Zahl bei 1 landet, ist bis heute unbewiesen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Schaltjahr gilt: durch 4 teilbar, aber nicht durch 100 – außer es ist durch 400 teilbar. Welches Jahr ist **kein** Schaltjahr?"
    params:
      options:
        - label: "1900"
          correct: true
        - label: "2000"
          feedback: Durch 400 teilbar – ein Schaltjahr.
        - label: "2024"
          feedback: Durch 4 teilbar, nicht durch 100 – ein Schaltjahr.
    hints:
      - Prüfe die Bedingungen in der richtigen Reihenfolge.
    explanation: 1900 ist durch 100, aber nicht durch 400 teilbar. Verschachtelte Bedingungen sind eine häufige Fehlerquelle.
    difficulty: 3

srs:
  cards_from: [zweig, sortieren]
