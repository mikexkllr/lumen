id: cs.programming.conditions
type: concept
title: Wenn, dann, sonst
summary: Programme, die entscheiden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das kluge Gartenlicht
    body: "Ein Gartenlicht entscheidet ganz allein, ob es angeht. Schalte »dunkel« und »Bewegung« an und aus. Finde die Regel: **Wenn** … **dann** …"
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: D
            label: dunkel
          - id: M
            label: Bewegung
        gates:
          - id: g
            type: AND
            in:
              - D
              - M
        outputs:
          - id: L
            from: g
            label: Licht

  - kind: problem
    id: hook
    widget: choice
    prompt: »Wenn es regnet, nimm den Schirm, sonst die Sonnenbrille.« Es regnet nicht. Was nimmst du?
    params:
      options:
        - label: Die Sonnenbrille
          correct: true
        - label: Den Schirm
          feedback: Nur bei Regen.
        - label: Beides
          feedback: Die Regel nennt immer genau eines.
    hints:
      - Welcher Teil der Regel gilt ohne Regen?
    explanation: So entscheidet auch ein Programm.

  - kind: explain
    id: s1
    body: |
      Mit **wenn … dann … sonst** entscheidet ein **Programm** je nach Lage: »Wenn die Zahl gerade ist, halbiere sie, sonst nimm sie mal 3 und zähle 1 dazu.«

  - kind: problem
    id: collatz
    widget: order
    prompt: Wende die Regel immer wieder auf 6 an. Bring die Zahlen in die richtige Reihenfolge.
    params:
      items:
        - { label: "6" }
        - { label: "3" }
        - { label: "10" }
        - { label: "5" }
        - { label: "16" }
    hints:
      - 6 ist gerade – halbieren. 3 ist ungerade – mal 3 plus 1.
    explanation: 6, 3, 10, 5, 16, 8, 4, 2, 1 – diese Folge endet bei jeder getesteten Zahl in der 1. Bewiesen ist es bis heute nicht.

  - kind: problem
    id: zweig
    widget: numeric
    body: "Wenn Temperatur > 25: Ventilator = 3, sonst wenn Temperatur > 18: Ventilator = 1, sonst Ventilator = 0."
    prompt: Welche Stufe läuft bei {{t}} °C?
    params: { placeholder: "Stufe" }
    answer: { value: "{{t > 25 ? 3 : t > 18 ? 1 : 0}}" }
    hints:
      - Prüfe die Bedingungen von oben nach unten.
    explanation: Die erste passende Bedingung gewinnt.
    variants:
      params: { t: "choice[12,20,24,28,31]" }
      defaults: { t: 20 }

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Was passiert bei Alter = 16 mit »wenn Alter ≥ 18, dann Zutritt, sonst kein Zutritt«?
    params:
      buckets: [{ label: Zutritt }, { label: kein Zutritt }]
      items:
        - { label: Alter 18, bucket: Zutritt }
        - { label: Alter 40, bucket: Zutritt }
        - { label: Alter 16, bucket: kein Zutritt }
        - { label: Alter 17, bucket: kein Zutritt }
    hints:
      - Größer oder gleich – 18 zählt mit.
    explanation: Grenzfälle wie genau 18 sind die häufigste Fehlerquelle bei Bedingungen.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 5 > 3 UND 2 < 4
          right: true
        - text: 5 > 3 UND 2 > 4
          right: false
        - text: 5 < 3 ODER 2 < 4
          right: true
        - text: NICHT (5 < 3)
          right: true
      left: Falsch
      right: Wahr

  - kind: problem
    id: intro-c1
    widget: gates
    prompt: Ins Konzert darf, wer volljährig ist oder mit einem Erwachsenen kommt. Wähle das Gatter für den Einlass.
    params:
      inputs:
        - id: V
          label: volljährig
        - id: B
          label: begleitet
      gates:
        - id: g
          type: "?"
          in:
            - V
            - B
          options:
            - AND
            - OR
      outputs:
        - id: E
          from: g
          label: Einlass
    check:
      predicate: table('E') == [0, 1, 1, 1]
    hints:
      - Muss beides gelten, oder reicht eins davon?
      - Eins reicht – das ist ein ODER.
    explanation: "»Wenn volljährig oder begleitet, dann Einlass.« Jede Bedingung in einem Programm ist so ein Wert: wahr oder falsch."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Die Collatz-Regel: gerade → halbieren, ungerade → mal 3 plus 1. Wie viele Schritte braucht die 7, bis sie bei 1 ankommt?"
    answer:
      value: 16
    hints:
      - 7, 22, 11, 34, 17, 52, 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1.
    explanation: 16 Schritte. Ob **jede** Zahl bei 1 landet, ist bis heute unbewiesen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "Regel: Wenn x > 10, dann x = x − 10, sonst x = x · 3. Wende die Regel zweimal auf {{x}} an. Was kommt heraus?"
    answer:
      value: "{{z}}"
    hints:
      - Wende die Regel erst einmal an und schreib das Ergebnis auf.
      - Nach dem ersten Mal ist x = {{y}}. Ist das größer als 10?
    explanation: "{{x}} → {{y}} → {{z}}."
    difficulty: 2
    variants:
      params:
        x: int[2,25]
      derive:
        y: "x > 10 ? x - 10 : 3 * x"
        z: "y > 10 ? y - 10 : 3 * y"
      defaults:
        x: 7

  - kind: problem
    id: cs-d2
    depth: 2
    widget: buckets
    prompt: Für welche Zahlen ist »x > 3 UND x < 8« wahr?
    params:
      buckets:
        - id: b1
          label: wahr
        - id: b2
          label: falsch
      items:
        - label: "2"
          bucket: b2
        - label: "3"
          bucket: b2
        - label: "4"
          bucket: b1
        - label: "7"
          bucket: b1
        - label: "8"
          bucket: b2
        - label: "10"
          bucket: b2
    hints:
      - Beide Teile müssen stimmen.
      - 3 > 3 ist falsch, 8 < 8 auch.
    explanation: Wahr nur für 4, 5, 6 und 7. Die Grenzen 3 und 8 gehören nicht dazu – genau dort passieren viele Fehler.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: "»Wenn Note ≥ 50: »bestanden«. Sonst wenn Note ≥ 90: »sehr gut«.« Was erscheint bei Note 95?"
    params:
      options:
        - label: »bestanden« – die zweite Bedingung wird nie erreicht
          correct: true
        - label: »sehr gut«
          feedback: 95 ≥ 50 ist schon wahr, also endet die Prüfung dort.
        - label: beides
          feedback: Bei »sonst wenn« läuft höchstens ein Zweig.
    hints:
      - Bedingungen werden von oben nach unten geprüft.
      - Welche Zahl ≥ 90 ist nicht auch ≥ 50?
    explanation: "Der speziellere Fall muss zuerst kommen: erst ≥ 90, dann ≥ 50. Sonst ist der zweite Zweig toter Code."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Schaltjahr gilt: durch 4 teilbar, aber nicht durch 100 – außer es ist durch 400 teilbar. Welches Jahr ist **kein** Schaltjahr?"
    params:
      options:
        - label: "1900"
          correct: true
        - label: "2000"
          feedback: Durch 400 teilbar – ein Schaltjahr.
        - label: "2024"
          feedback: Durch 4 teilbar, nicht durch 100 – ein Schaltjahr.
    hints:
      - Prüfe die Bedingungen in der richtigen Reihenfolge.
    explanation: 1900 ist durch 100, aber nicht durch 400 teilbar. Verschachtelte Bedingungen sind eine häufige Fehlerquelle.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Viele Sprachen werten mit **Kurzschluss** aus: Bei »A UND B« wird B gar nicht erst geprüft, wenn A schon falsch ist. So ist »n ≠ 0 UND 10 / n > 2« sicher – durch 0 wird nie geteilt."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Welche Bedingung ist dasselbe wie NICHT (x > 5 UND x < 10)?
    params:
      options:
        - label: x ≤ 5 ODER x ≥ 10
          correct: true
        - label: x ≤ 5 UND x ≥ 10
          feedback: Das kann nie gleichzeitig gelten.
        - label: x < 5 ODER x > 10
          feedback: Dann fehlen 5 und 10 selbst.
    hints:
      - "De Morgan: NICHT (A UND B) = (NICHT A) ODER (NICHT B)."
      - Das Gegenteil von x > 5 ist x ≤ 5.
    explanation: UND wird zu ODER, jede Bedingung kippt. Die Grenzen 5 und 10 gehören jetzt dazu.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Ein Programm hat 3 Wenn-dann-sonst-Abfragen hintereinander. Wie viele verschiedene Wege gibt es durch den Code?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 6
        misconception: add-paths
        text: "Die Wege multiplizieren sich: jede Abfrage verdoppelt."
    hints:
      - Jede Abfrage hat 2 Ausgänge.
      - 2 · 2 · 2.
    explanation: $2^3$ = 8 Wege. Bei 30 Abfragen wären es über eine Milliarde – alle Wege zu testen wird schnell unmöglich.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Programm mit »wenn … dann … sonst« entscheidet.
    params:
      keywords:
        - - bedingung
          - condition
          - prüf
          - check
          - test
        - - wahr
          - "true"
          - erfüllt
          - stimmt
          - holds
        - - sonst
          - else
          - andernfalls
          - otherwise
      sample: Das Programm prüft eine Bedingung. Ist sie wahr, läuft der Dann-Teil. Sonst läuft der Sonst-Teil. So reagiert es je nach Eingabe anders.
    difficulty: 3

srs:
  cards_from: [zweig, sortieren]
