id: math.powers.prefixes
type: concept
title: Kilo, mega, nano
summary: Prefixes are powers of ten.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: From nano to giga
    body: "Phone storage, viruses, power stations: very big and very small things get prefixes. Turn over the cards. Behind each one hides a **power of ten**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦠
            front: Nano
            back: One billionth. A flu virus is about 100 nanometres across.
          - icon: 🩸
            front: Micro
            back: One millionth. A red blood cell is about 8 micrometres wide.
          - icon: ⚡
            front: Mega
            back: One million. A big wind turbine delivers about 3 megawatts.
          - icon: 💾
            front: Giga
            back: One billion. An HD film needs about 4 gigabytes.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many nanometres thick is a human hair?"
    params:
      min: 100
      max: 10000000
      scale: log
      unit: nm
    answer:
      value: 80000
      within: 60
    explanation: About 80,000 nm, that is 0.08 mm. A virus measures around 100 nm.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Which prefix stands for which power of ten?
    params:
      pairs:
        - { left: Kilo, right: "$10^3$" }
        - { left: Mega, right: "$10^6$" }
        - { left: Milli, right: "$10^{-3}$" }
        - { left: Nano, right: "$10^{-9}$" }
    hints:
      - A kilometer has 1000 meters, and a millimeter is a thousandth of a meter.
    explanation: Kilo and mega make things big. Milli and nano make them small.

  - kind: explain
    id: s2
    body: |
      Every prefix is a power of ten. A **nanometer** is a billionth of a meter.
      A hair is about 80,000 nanometers thick.

  - kind: problem
    id: umrechnen
    widget: numeric
    prompt: How many millimeters are {{k}} kilometers?
    params: { unit: mm }
    answer: { value: "{{k * 1000000}}" }
    hints:
      - From kilo to milli is 6 steps of ten.
    explanation: "{{k}} km = {{k * 1000}} m = {{k * 1000000}} mm."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 3 }

  - kind: problem
    id: speicher
    widget: choice
    prompt: How many kilobytes are in a gigabyte, counting in steps of a thousand?
    params:
      options:
        - { label: One million, correct: true }
        - { label: One thousand, feedback: "That would be megabytes. Giga is one step more." }
        - { label: One billion, feedback: "That would be bytes, not kilobytes." }
    hints:
      - Giga is $10^9$, and kilo is $10^3$.
    explanation: "$10^9 \\div 10^3 = 10^6$, which is one million."

  - kind: problem
    id: ma-c1
    widget: buckets
    prompt: Longer or shorter than a metre?
    params:
      buckets:
        - id: b1
          label: longer
        - id: b2
          label: shorter
      items:
        - label: 1 kilometre
          bucket: b1
        - label: 1 megametre
          bucket: b1
        - label: 1 hectometre
          bucket: b1
        - label: 1 millimetre
          bucket: b2
        - label: 1 micrometre
          bucket: b2
        - label: 1 nanometre
          bucket: b2
    hints:
      - Kilo means thousand.
      - Milli means one thousandth.
    explanation: Kilo, mega, hecto make bigger. Milli, micro, nano make smaller.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Light travels $3 \cdot 10^8$ m per second. How many metres is that in one nanosecond ($10^{-9}$ s)?
    params:
      unit: m
    answer:
      value: 0.3
    hints:
      - "Add the exponents: 8 + (−9)."
    explanation: $3 \cdot 10^{-1}$ m = 30 cm. That is why computer chips must be so small.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: How many micrometres are {{k}} mm?
    params:
      unit: µm
    answer:
      value: "{{k * 1000}}"
    feedback:
      - when: numval(state.input) == k * 100
        misconception: factor-100
        text: From milli to micro is a step of a thousand.
    hints:
      - Milli = $10^{-3}$, micro = $10^{-6}$.
      - 1 mm = 1000 µm.
    explanation: "{{k}} · 1000 = {{k * 1000}} µm."
    difficulty: 2
    variants:
      params:
        k: int[2,9]
      defaults:
        k: 3

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: A hard drive holds 2 TB (terabytes). How many GB is that?
    params:
      unit: GB
    answer:
      value: 2000
    hints:
      - Tera = $10^{12}$, giga = $10^9$.
      - One TB is 1000 GB.
    explanation: 2 · 1000 = 2000 GB. Manufacturers count in thousands – the computer often shows a bit less.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: A kibibyte (KiB) has 1024 bytes instead of 1000. Why 1024?
    params:
      options:
        - label: 1024 = $2^{10}$ – computers count in powers of two
          correct: true
        - label: It is deliberate, not a mistake.
          feedback: Es ist Absicht, keine Panne.
        - label: "1024 : 10 = 102.4."
          feedback: "1024 : 10 = 102,4."
    hints:
      - Computers work in binary.
      - "Double ten times: 2, 4, 8, …"
    explanation: $2^{10} = 1024$ is close to 1000. That is how the binary prefixes kibi, mebi, gibi came about.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Compute in scientific notation: $(4 \\cdot 10^5) \\cdot (5 \\cdot 10^{-2}) = 2 \\cdot 10^?$"
    answer:
      value: 4
    hints:
      - 4 · 5 = 20 = 2 · 10. The ten joins the exponent.
    explanation: 20 · 10³ = 2 · 10⁴.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "The big prefixes go in **steps of a thousand**: kilo, mega, giga, tera, peta, exa. In 2022 even ronna ($10^{27}$) and quetta ($10^{30}$) were added."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: An atom is about 0.1 nm wide. How many atoms fit side by side along 1 micrometre?
    answer:
      value: 10000
    feedback:
      - when: numval(state.input) == 10
        misconception: wrong-unit
        text: That is the atoms in 1 nanometre. A micrometre is 1000 times longer.
    hints:
      - 1 µm = 1000 nm.
      - "1000 nm : 0.1 nm = ?"
    explanation: "1000 : 0.1 = 10,000 atoms. Modern chips have structures of only a few nanometres."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: The Sun is about 150 Gm (gigametres) away. How many kilometres is that?
    params:
      unit: km
    answer:
      value: 150000000
    feedback:
      - when: numval(state.input) == 150000000000
        misconception: metres-not-km
        text: Those are metres. For kilometres, divide by 1000.
    hints:
      - Giga = $10^9$. 150 Gm = $1.5 \cdot 10^{11}$ m.
      - Divide by 1000 for km.
    explanation: $1.5 \cdot 10^8$ km = 150 million km.
    difficulty: 3

srs:
  cards_from: [umrechnen, speicher]
