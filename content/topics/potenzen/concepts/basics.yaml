id: math.powers.basics
type: concept
title: Hoch, nicht mal
summary: Was der Exponent wirklich bedeutet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Hoch schlägt mal
    body: Ein Gerücht, das jeder an zwei Leute weitererzählt, ist schnell überall. Die gestrichelte Linie zeigt 2 · x, deine Kurve die **Potenz** $b^x$. Schieb b auf 2 und vergleiche. Wer hängt wen ab?
    visual:
      widget: slider
      interactive: true
      params:
        expr: b^x
        x:
          - 0
          - 5
        y:
          - 0
          - 8
        showCoordinates: false
        sliders:
          - id: b
            label: Basis b
            min: 1
            max: 3
            step: 0.5
            initial: 1
        target:
          expr: 2*x

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Auf das erste Schachfeld kommt 1 Reiskorn, auf jedes weitere doppelt so viele. Wie viele Stellen hat die Zahl auf Feld 64?"
    params:
      min: 1
      max: 60
    answer:
      value: 19
      tolerance: 3
    explanation: $2^{63}$ ≈ 9 Trillionen – eine Zahl mit 19 Stellen. Mehr Reis, als die Erde je geerntet hat.

  - kind: problem
    id: quadrat
    widget: numeric
    visual: { widget: pixels, params: { cells: ["####.", "####.", "####.", "####.", "....."] } }
    prompt: Wie viele Felder hat das Quadrat? Man schreibt das als $4^2$.
    params: { unit: Felder }
    answer: { value: 16 }
    feedback:
      - when: "numval(state.input) == 8"
        misconception: power-as-product
        text: 4 · 2 wäre 8. Das Quadrat hat aber 4 Reihen mit je 4 Feldern.
    hints:
      - Zähle eine Reihe und nimm sie mal die Zahl der Reihen.
    explanation: 4 · 4 = 16. Darum heißt $4^2$ auch »4 zum Quadrat«.

  - kind: explain
    id: s2
    body: |
      $4^2$ heißt 4 · 4 – nicht 4 · 2.
      Der **Exponent** oben sagt, wie oft die **Basis** mit sich selbst malgenommen wird.

  - kind: problem
    id: berechnen
    widget: numeric
    prompt: Berechne ${{a}}^{{n}}$.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{a ** n}}" }
    feedback:
      - when: "numval(state.input) == a * n"
        misconception: power-as-product
        text: Du hast {{a}} · {{n}} gerechnet. Hoch heißt, {{a}} so oft mit sich selbst malnehmen.
    hints:
      - Schreib es als Produkt aus {{n}} gleichen Zahlen.
    explanation: "{{a}} hoch {{n}} = {{a ** n}}."
    variants:
      params: { a: "int[2,5]", n: "int[2,4]" }
      constraints: ["a * n != a ** n"]
      defaults: { a: 3, n: 4 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Was ist größer – $2^{10}$ oder $10^2$?
    params:
      options:
        - { label: "$2^{10}$", correct: true }
        - { label: "$10^2$", feedback: "$10^2$ ist 100. $2^{10}$ ist 1024." }
        - { label: Beide gleich, feedback: "Basis und Exponent zu tauschen ändert fast immer das Ergebnis." }
    hints:
      - Rechne beide aus. Verdopple 10-mal.
    explanation: $2^{10} = 1024$, $10^2 = 100$.

  - kind: explain
    id: s5
    body: Du faltest ein Blatt Papier 42-mal. Wie dick wäre es?
    reveal:
      body: Jedes Falten verdoppelt die Lagen. $2^{42}$ Lagen zu je 0,1 mm reichen bis zum Mond.

  - kind: problem
    id: falten
    widget: numeric
    prompt: Wie viele Lagen hat das Blatt nach {{n}}-mal Falten?
    params: { unit: Lagen }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear-growth
        text: Jedes Falten verdoppelt – es kommt nicht nur 2 dazu.
    hints:
      - 1-mal falten ergibt 2 Lagen, 2-mal ergibt 4 Lagen …
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ Lagen."
    variants:
      params: { n: "int[5,10]" }
      defaults: { n: 10 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: $3^2 = 6$
          right: false
          why: 3² = 3 · 3 = 9.
        - text: $2^5 = 32$
          right: true
        - text: $10^3$ hat drei Nullen.
          right: true
        - text: $1^{100} = 100$
          right: false
          why: 1 mal 1 bleibt immer 1.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Was ist größer: $3^4$ oder $4^3$? Gib die größere Zahl an."
    answer:
      value: 81
    hints:
      - 3 · 3 · 3 · 3 gegen 4 · 4 · 4.
    explanation: 81 gegen 64. Der Exponent wiegt meist schwerer als die Basis.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Beim **exponentiellen Wachstum** wird bei jedem Schritt mit derselben Zahl malgenommen. Beim linearen Wachstum kommt immer dasselbe dazu. Am Anfang sehen beide ähnlich aus – dann zieht das exponentielle davon.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: Linear oder exponentiell?
    params:
      buckets:
        - id: b1
          label: linear
        - id: b2
          label: exponentiell
      items:
        - label: Jeden Tag 5 € mehr
          bucket: b1
        - label: Jede Stunde 2 cm Schnee
          bucket: b1
        - label: Jede Woche 10 Seiten lesen
          bucket: b1
        - label: Bakterien verdoppeln sich täglich
          bucket: b2
        - label: Jedes Jahr 3 % mehr
          bucket: b2
        - label: Jeder erzählt es zwei Neuen
          bucket: b2
    hints:
      - Wird etwas dazugezählt oder malgenommen?
      - Prozente und Verdoppeln sind Malnehmen.
    explanation: "Fester Betrag dazu: linear. Fester Faktor: exponentiell."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Seerosen verdoppeln sich jeden Tag. Nach 30 Tagen ist der Teich voll. An welchem Tag war er halb voll?
    answer:
      value: 29
    feedback:
      - when: numval(state.input) == 15
        misconception: linear-thinking
        text: "Halbe Zeit heißt nicht halbe Menge. Denk rückwärts: einmal halbieren."
    hints:
      - Was passiert vom halb vollen Teich zum vollen?
      - Eine Verdopplung – ein Tag.
    explanation: Am Tag 29 ist er halb voll, am Tag 30 voll. Exponentielles Wachstum fühlt sich lange harmlos an – und dann geht alles schnell.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welche Zahl ist am größten?
    params:
      options:
        - label: $2^{100}$
          correct: true
        - label: $100^{10}$
          feedback: Das ist $10^{20}$. Aber $2^{100} = (2^{10})^{10} ≈ 10^{30}$.
        - label: $10^{25}$
          feedback: $2^{10}$ ≈ 1000, also ist $2^{100}$ ≈ $10^{30}$.
    hints:
      - "Merke: $2^{10}$ = 1024 ≈ $10^3$."
    explanation: Mit $2^{10} ≈ 10^3$ rechnet man Zweierpotenzen in Zehnerpotenzen um.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Welche Ziffer steht am Ende von $7^{100}$?
    answer:
      value: 1
    hints:
      - "Die Endziffern von $7^1, 7^2, 7^3, 7^4$: 7, 9, 3, 1."
      - "Das Muster wiederholt sich alle 4 Schritte. 100 : 4 = 25."
    explanation: 100 ist durch 4 teilbar, also endet $7^{100}$ wie $7^4 = 2401$ auf 1. Rechnen mit Endziffern ist Rechnen modulo 10.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Auf Dauer schlägt $2^n$ jede feste Potenz wie $n^{10}$. Lange führt $n^{10}$ weit, doch ab n = 59 ist $2^n$ größer – für immer. Darum gelten **exponentielle** Algorithmen als zu langsam.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum $2^{10}$ nicht 20 ist.
    params:
      keywords:
        - - mal
          - times
          - multipl
        - - zehnmal
          - zehn
          - ten
          - "10"
        - - "1024"
          - verdoppel
          - doubl
          - nicht plus
          - not plus
      sample: Der Exponent 10 sagt, dass man die 2 zehnmal mit sich selbst malnimmt, also immer wieder verdoppelt. Das ergibt 1024. 20 wäre 2 mal 10.
    explanation: "Kernidee: Der Exponent zählt Faktoren, nicht einen Faktor."
    difficulty: 3

srs:
  cards_from: [berechnen, falten]
