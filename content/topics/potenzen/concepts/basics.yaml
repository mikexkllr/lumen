id: math.powers.basics
type: concept
title: Hoch, nicht mal
summary: Was der Exponent wirklich bedeutet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: quadrat
    widget: numeric
    visual: { widget: pixels, params: { cells: ["####.", "####.", "####.", "####.", "....."] } }
    prompt: Wie viele Felder hat das Quadrat? Man schreibt das als $4^2$.
    params: { unit: Felder }
    answer: { value: 16 }
    feedback:
      - when: "numval(state.input) == 8"
        misconception: power-as-product
        text: 4 · 2 wäre 8. Das Quadrat hat aber 4 Reihen mit je 4 Feldern.
    hints:
      - Zähle eine Reihe und nimm sie mal die Zahl der Reihen.
    explanation: 4 · 4 = 16. Darum heißt $4^2$ auch »4 zum Quadrat«.

  - kind: explain
    body: |
      $4^2$ heißt 4 · 4 – nicht 4 · 2.
      Der **Exponent** oben sagt, wie oft die **Basis** mit sich selbst malgenommen wird.

  - kind: problem
    id: berechnen
    widget: numeric
    prompt: Berechne ${{a}}^{{n}}$.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{a ** n}}" }
    feedback:
      - when: "numval(state.input) == a * n"
        misconception: power-as-product
        text: Du hast {{a}} · {{n}} gerechnet. Hoch heißt, {{a}} so oft mit sich selbst malnehmen.
    hints:
      - Schreib es als Produkt aus {{n}} gleichen Zahlen.
    explanation: "{{a}} hoch {{n}} = {{a ** n}}."
    variants:
      params: { a: "int[2,5]", n: "int[2,4]" }
      constraints: ["a * n != a ** n"]
      defaults: { a: 3, n: 4 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Was ist größer – $2^{10}$ oder $10^2$?
    params:
      options:
        - { label: "$2^{10}$", correct: true }
        - { label: "$10^2$", feedback: "$10^2$ ist 100. $2^{10}$ ist 1024." }
        - { label: Beide gleich, feedback: "Basis und Exponent zu tauschen ändert fast immer das Ergebnis." }
    hints:
      - Rechne beide aus. Verdopple 10-mal.
    explanation: $2^{10} = 1024$, $10^2 = 100$.

  - kind: explain
    body: Du faltest ein Blatt Papier 42-mal. Wie dick wäre es?
    reveal:
      body: Jedes Falten verdoppelt die Lagen. $2^{42}$ Lagen zu je 0,1 mm reichen bis zum Mond.

  - kind: problem
    id: falten
    widget: numeric
    prompt: Wie viele Lagen hat das Blatt nach {{n}}-mal Falten?
    params: { unit: Lagen }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear-growth
        text: Jedes Falten verdoppelt – es kommt nicht nur 2 dazu.
    hints:
      - 1-mal falten ergibt 2 Lagen, 2-mal ergibt 4 Lagen …
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ Lagen."
    variants:
      params: { n: "int[5,10]" }
      defaults: { n: 10 }

srs:
  cards_from: [berechnen, falten]
