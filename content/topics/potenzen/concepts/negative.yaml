id: math.powers.negative
type: concept
title: Negative Exponenten
summary: Hoch minus heißt geteilt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: muster
    widget: numeric
    body: $10^3 = 1000$, $10^2 = 100$, $10^1 = 10$, $10^0 = 1$.
    prompt: Setze das Muster fort. Was ist $10^{-1}$?
    params: { placeholder: "Zahl" }
    answer: { value: 0.1 }
    feedback:
      - when: "numval(state.input) == -10"
        misconception: negative-result
        text: Das Ergebnis wird nicht negativ. Jeder Schritt teilt durch 10.
    hints:
      - Jeder Schritt nach unten teilt durch 10.
    explanation: "1 : 10 = 0,1."

  - kind: explain
    id: s2
    body: |
      **Negativer Exponent** heißt Kehrwert: $2^{-3} = \frac{1}{2^3} = \frac{1}{8}$.
      Das Ergebnis ist klein, aber nie negativ.

  - kind: problem
    id: kehrwert
    widget: numeric
    prompt: Berechne ${{b}}^{-{{n}}}$ als Bruch.
    params: { placeholder: "z. B. 1/8" }
    answer: { value: "1/{{b ** n}}" }
    feedback:
      - when: "numval(state.input) == -(b ** n)"
        misconception: negative-result
        text: Minus im Exponenten heißt Kehrwert, nicht Minus vor der Zahl.
    hints:
      - "Rechne erst ${{b}}^{{n}}$, dann 1 durch das Ergebnis."
    explanation: "1/{{b ** n}}."
    variants:
      params: { b: "int[2,5]", n: "int[2,3]" }
      defaults: { b: 2, n: 3 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Welche Zahl ist am kleinsten?
    params:
      options:
        - { label: "$10^{-3}$", correct: true }
        - { label: "$10^{-1}$", feedback: "Das ist 0,1 – größer als 0,001." }
        - { label: "$10^{0}$", feedback: "Das ist 1." }
    hints:
      - Schreibe alle als Dezimalzahl.
    explanation: $10^{-3}$ = 0,001.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Ein negativer Exponent bildet den [[Kehrwert]]: $10^{-2}$ ist [[0,01]]. Das Ergebnis ist klein, aber nie [[negativ]]."
      distractors:
        - −100
        - Betrag

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Berechne $\left(\frac{2}{3}\right)^{-2}$ als Bruch.
    answer:
      value: 9/4
    hints:
      - Erst den Kehrwert bilden, dann quadrieren.
    explanation: (3/2)² = 9/4.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Halbieren ist mal 2⁻¹. Nach wie vielen Halbwertszeiten ist weniger als 1 % übrig?
    params:
      scene: decay
      controls:
        halflife:
          value: 1
          fixed: true
    answer:
      left:
        - 0
        - 1
    explanation: "Nach 7 Halbierungen: 2⁻⁷ = 1/128 ≈ 0,8 %."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Setz das Muster fort: $10^3 = 1000$, $10^2 = 100$, $10^1 = 10$, $10^0 = \\;?$, $10^{-1} = \\;?$"
    reveal:
      body: 1 und 0,1. Jeder Schritt nach rechts teilt durch 10 – auch unter null.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Ergänze den Exponenten: {{10 ** (0 - n)}} = $10^{?}$"
    answer:
      value: "{{0 - n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: sign
        text: Die Zahl ist kleiner als 1. Der Exponent muss negativ sein.
    hints:
      - Zähle die Stellen nach dem Komma bis zur 1.
      - Es sind {{n}} Stellen – also minus {{n}}.
    explanation: "{{10 ** (0 - n)}} = $10^{ {{0 - n}} }$: die 1 steht an der {{n}}. Stelle nach dem Komma."
    difficulty: 2
    variants:
      params:
        n: int[1,6]
      defaults:
        n: 3

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Ein Bakterium ist 0,000002 m lang. Das sind $2 \cdot 10^{?}$ m.
    answer:
      value: -6
    feedback:
      - when: numval(state.input) == -5
        misconception: off-by-one
        text: "Zähle bis einschließlich der 2: Sie steht an der 6. Stelle."
    hints:
      - Wie viele Stellen nach dem Komma bis zur 2?
      - Sechs.
    explanation: $2 \cdot 10^{-6}$ m = 2 Mikrometer.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Was ist $8^{2/3}$?
    answer:
      value: 4
    hints:
      - Der Nenner 3 heißt dritte Wurzel, der Zähler 2 heißt quadrieren.
    explanation: ∛8 = 2 und 2² = 4. Bruch-Exponenten sind Wurzeln – so bleiben alle Potenzregeln gültig.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Brüche im Exponenten sind **Wurzeln**: $a^{1/2} = \\sqrt{a}$, denn $a^{1/2} \\cdot a^{1/2} = a^1$. Ebenso ist $a^{1/3}$ die dritte Wurzel."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Berechne $27^{1/3}$.
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 9
        misconception: divide-instead
        text: "$27^{1/3}$ heißt dritte Wurzel, nicht 27 : 3."
    hints:
      - Welche Zahl hoch 3 ergibt 27?
      - $3 \cdot 3 \cdot 3$.
    explanation: $3^3 = 27$, also $27^{1/3} = 3$.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Berechne $16^{-1/2}$ als Bruch.
    answer:
      value: 1/4
    feedback:
      - when: numval(state.input) == -4
        misconception: negative-result
        text: Minus im Exponenten heißt Kehrwert, nicht negativ.
    hints:
      - $16^{1/2} = 4$.
      - Das Minus macht den Kehrwert.
    explanation: $16^{-1/2} = \frac{1}{\sqrt{16}} = \frac{1}{4}$.
    difficulty: 3

srs:
  cards_from: [kehrwert, vergleich]
