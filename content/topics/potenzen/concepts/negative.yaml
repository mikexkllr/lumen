id: math.powers.negative
type: concept
title: Negative Exponenten
summary: Hoch minus heißt geteilt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: muster
    widget: numeric
    body: $10^3 = 1000$, $10^2 = 100$, $10^1 = 10$, $10^0 = 1$.
    prompt: Setze das Muster fort. Was ist $10^{-1}$?
    params: { placeholder: "Zahl" }
    answer: { value: 0.1 }
    feedback:
      - when: "numval(state.input) == -10"
        misconception: negative-result
        text: Das Ergebnis wird nicht negativ. Jeder Schritt teilt durch 10.
    hints:
      - Jeder Schritt nach unten teilt durch 10.
    explanation: "1 : 10 = 0,1."

  - kind: explain
    id: s2
    body: |
      **Negativer Exponent** heißt Kehrwert: $2^{-3} = \frac{1}{2^3} = \frac{1}{8}$.
      Das Ergebnis ist klein, aber nie negativ.

  - kind: problem
    id: kehrwert
    widget: numeric
    prompt: Berechne ${{b}}^{-{{n}}}$ als Bruch.
    params: { placeholder: "z. B. 1/8" }
    answer: { value: "1/{{b ** n}}" }
    feedback:
      - when: "numval(state.input) == -(b ** n)"
        misconception: negative-result
        text: Minus im Exponenten heißt Kehrwert, nicht Minus vor der Zahl.
    hints:
      - "Rechne erst ${{b}}^{{n}}$, dann 1 durch das Ergebnis."
    explanation: "1/{{b ** n}}."
    variants:
      params: { b: "int[2,5]", n: "int[2,3]" }
      defaults: { b: 2, n: 3 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Welche Zahl ist am kleinsten?
    params:
      options:
        - { label: "$10^{-3}$", correct: true }
        - { label: "$10^{-1}$", feedback: "Das ist 0,1 – größer als 0,001." }
        - { label: "$10^{0}$", feedback: "Das ist 1." }
    hints:
      - Schreibe alle als Dezimalzahl.
    explanation: $10^{-3}$ = 0,001.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Ein negativer Exponent bildet den [[Kehrwert]]: $10^{-2}$ ist [[0,01]]. Das Ergebnis ist klein, aber nie [[negativ]]."
      distractors:
        - −100
        - Betrag

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Berechne $\left(\frac{2}{3}\right)^{-2}$ als Bruch.
    answer:
      value: 9/4
    hints:
      - Erst den Kehrwert bilden, dann quadrieren.
    explanation: (3/2)² = 9/4.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Halbieren ist mal 2⁻¹. Nach wie vielen Halbwertszeiten ist weniger als 1 % übrig?
    params:
      scene: decay
      controls:
        halflife:
          value: 1
          fixed: true
    answer:
      left:
        - 0
        - 1
    explanation: "Nach 7 Halbierungen: 2⁻⁷ = 1/128 ≈ 0,8 %."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Was ist $8^{2/3}$?
    answer:
      value: 4
    hints:
      - Der Nenner 3 heißt dritte Wurzel, der Zähler 2 heißt quadrieren.
    explanation: ∛8 = 2 und 2² = 4. Bruch-Exponenten sind Wurzeln – so bleiben alle Potenzregeln gültig.
    difficulty: 3

srs:
  cards_from: [kehrwert, vergleich]
