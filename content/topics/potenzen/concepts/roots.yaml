id: math.powers.roots
type: concept
title: Wurzeln und Zehnerpotenzen
summary: Rückwärts rechnen und riesige Zahlen bändigen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Von der Fläche zur Seite
    body: "Ein quadratischer Garten hat 64 m². Wie lang ist dann ein Zaun an einer Seite? Zieh das Rechteck zu Quadraten und lies die Fläche ab. Die **Wurzel** geht den Weg rückwärts: von der Fläche zur Seite."
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 10
        maxH: 8
        w: 3
        h: 2
        show:
          - area

  - kind: problem
    id: rueckwaerts
    widget: numeric
    prompt: Welche Zahl ergibt mit sich selbst malgenommen {{n * n}}?
    params: { placeholder: "Zahl" }
    answer: { value: "{{n}}" }
    feedback:
      - when: "numval(state.input) == n * n / 2"
        misconception: half
        text: Halbieren ist nicht das Gegenteil von Quadrieren.
    hints:
      - Probiere Zahlen aus, die mal sich selbst nahe dran sind.
    explanation: "{{n}} · {{n}} = {{n * n}}. Also ist $\\sqrt{ {{n * n}} } = {{n}}$."
    variants:
      params: { n: "int[4,15]" }
      defaults: { n: 7 }

  - kind: explain
    id: s2
    body: |
      Die **Wurzel** $\sqrt{49}$ fragt: Welche Zahl mal sich selbst ergibt 49?
      Antwort: 7. Wurzeln machen das Quadrieren rückgängig.

  - kind: problem
    id: schaetzen
    widget: numberline
    prompt: Wo liegt $\sqrt{20}$ ungefähr? Setze die Markierung.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    answer: { value: 4.5, tolerance: 0.01 }
    hints:
      - 4 · 4 = 16 und 5 · 5 = 25. Wo liegt 20 dazwischen?
    explanation: $\sqrt{20} \approx 4{,}47$ – knapp unter 4,5.

  - kind: explain
    id: s4
    body: |
      Große Zahlen schreibt man mit **Zehnerpotenzen**: 3 000 000 = $3 \cdot 10^6$.
      Die Sonne ist etwa $1{,}5 \cdot 10^8$ km von der Erde entfernt.

  - kind: problem
    id: zehner
    widget: numeric
    prompt: "Schreibe {{t}} als 4 · 10 hoch … Gib den Exponenten an."
    params: { prefix: "4 · 10^" }
    answer: { value: "{{n}}" }
    feedback:
      - when: "numval(state.input) == n + 1"
        misconception: count-digits
        text: Du hast alle Stellen gezählt. Zähle nur die Nullen hinter der 4.
    hints:
      - Zähle die Nullen.
    explanation: "{{t}} hat {{n}} Nullen hinter der 4."
    variants:
      params: { n: "int[3,7]" }
      derive: { t: "4 * 10 ** n" }
      defaults: { n: 4 }

  - kind: problem
    id: groesser
    widget: choice
    prompt: Welche Zahl ist größer?
    params:
      options:
        - { label: "$3 \\cdot 10^5$", correct: true }
        - { label: "$9 \\cdot 10^4$", feedback: "9 ist größer als 3 – aber der Exponent zählt mehr. $9 \\cdot 10^4$ = 90 000." }
    hints:
      - Schreibe beide Zahlen aus.
    explanation: 300 000 ist mehr als 90 000.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: $\sqrt{81} = 9$
          right: true
        - text: $\sqrt{9 + 16} = 3 + 4$
          right: false
          why: √25 = 5, nicht 7. Wurzeln aus Summen darf man nicht aufteilen.
        - text: $\sqrt{4 \cdot 9} = 2 \cdot 3$
          right: true
        - text: $5 \cdot 10^3$ ist 5000.
          right: true

  - kind: problem
    id: intro-c1
    widget: rect
    prompt: Zieh ein Quadrat aus genau 49 Kästchen. Seine Seite ist $\sqrt{49}$.
    params:
      maxW: 10
      maxH: 8
      w: 2
      h: 2
      show:
        - area
    check:
      predicate: area == 49 && square
    hints:
      - "Ein Quadrat hat gleich lange Seiten: Seite mal Seite soll 49 ergeben."
      - Welche Zahl mal sich selbst ergibt 49?
    explanation: 7 · 7 = 49, also ist $\sqrt{49} = 7$. Die Wurzel ist die Seite des Quadrats.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Zwischen welchen ganzen Zahlen liegt $\sqrt{150}$? Gib die kleinere an.
    answer:
      value: 12
    hints:
      - Welche Quadratzahlen liegen um 150 herum?
    explanation: 12² = 144 und 13² = 169.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: rect
    prompt: Zieh ein Quadrat aus 36 Kästchen. Seine Seite ist $\sqrt{36}$.
    params:
      maxW: 8
      maxH: 8
      w: 2
      h: 3
      show:
        - area
    check:
      predicate: area == 36 && square
    hints:
      - Breite und Höhe müssen gleich sein.
      - Welche Zahl mal sich selbst ergibt 36?
    explanation: 6 × 6 = 36, also $\sqrt{36} = 6$. Eine Wurzel ist die Seite eines Quadrats mit bekannter Fläche.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie groß ist $\\sqrt{50}$?"
    params:
      min: 0
      max: 10
    answer:
      value: 7.07
      tolerance: 0.15
    explanation: $7^2 = 49$ – also liegt $\sqrt{50}$ knapp über 7, bei etwa 7,07.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Berechne $\sqrt{0{,}25}$.
    answer:
      value: 0.5
    feedback:
      - when: numval(state.input) == 0.05
        misconception: decimal-places
        text: $0{,}05^2 = 0{,}0025$. Zu klein!
    hints:
      - Welche Zahl mal sich selbst ergibt 0,25?
      - 0,25 ist ein Viertel.
    explanation: $0{,}5 \cdot 0{,}5 = 0{,}25$. Bei Zahlen unter 1 ist die Wurzel größer als die Zahl!
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Welche Zahl hoch 3 ergibt 64? Das ist die dritte Wurzel.
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 8
        misconception: square-root
        text: $8^2 = 64$, aber $8^3 = 512$.
    hints:
      - Probiere 3, 4, 5.
      - $4 \cdot 4 \cdot 4 = ?$
    explanation: $4^3 = 64$. Ein Würfel mit 64 cm³ hat 4 cm lange Kanten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Warum ist √2 kein Bruch? Ordne den Beweis.
    params:
      items:
        - label: Angenommen √2 = p/q, vollständig gekürzt.
        - label: Dann ist p² = 2q², also ist p gerade.
        - label: Mit p = 2k wird q² = 2k², also ist auch q gerade.
        - label: Dann ließe sich p/q durch 2 kürzen – Widerspruch.
    hints:
      - Der Beweis beginnt mit einer Annahme und endet im Widerspruch.
    explanation: √2 ist **irrational**. Die Entdeckung soll die Pythagoreer tief erschüttert haben.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Das **Heron-Verfahren** findet Wurzeln: Rate x für √2. Nimm dann den Mittelwert von x und 2 : x. Mit x = 1 ergibt das 1,5, dann 1,4167. Jeder Schritt verdoppelt etwa die richtigen Stellen."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Ein Heron-Schritt für $\\sqrt{10}$ mit Startwert 3: Berechne $(3 + 10 : 3) : 2$ auf drei Stellen."
    answer:
      value: 3.167
      tolerance: 0.001
    hints:
      - "10 : 3 ≈ 3,333."
      - "(3 + 3,333) : 2."
    explanation: ≈ 3,167. Der wahre Wert ist 3,1623 – schon nach einem Schritt sehr nah.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Was ist $\sqrt{-4}$?
    params:
      options:
        - label: −2
          feedback: $(-2)^2 = +4$, nicht −4.
        - label: "2"
          feedback: $2^2 = 4$, nicht −4.
        - label: Keine reelle Zahl – dafür erfindet man die komplexen Zahlen
          correct: true
    hints:
      - Kann ein Quadrat negativ sein?
      - Plus mal plus und minus mal minus ergeben beide plus.
    explanation: Kein reelles Quadrat ist negativ. Mit der neuen Zahl i, wobei $i^2 = -1$, wird $\sqrt{-4} = 2i$.
    difficulty: 3

srs:
  cards_from: [rueckwaerts, zehner]
