id: math.powers.prefixes
type: concept
title: Kilo, Mega, Nano
summary: Vorsilben sind Zehnerpotenzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Von Nano bis Giga
    body: "Handy-Speicher, Viren, Kraftwerke: Für sehr große und sehr kleine Dinge gibt es Vorsilben. Deck die Karten auf. Hinter jeder steckt eine **Zehnerpotenz**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦠
            front: Nano
            back: Ein Milliardstel. Ein Grippevirus ist etwa 100 Nanometer groß.
          - icon: 🩸
            front: Mikro
            back: Ein Millionstel. Ein rotes Blutkörperchen misst etwa 8 Mikrometer.
          - icon: ⚡
            front: Mega
            back: Eine Million. Ein großes Windrad leistet etwa 3 Megawatt.
          - icon: 💾
            front: Giga
            back: Eine Milliarde. Ein Film in HD braucht etwa 4 Gigabyte.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Nanometer dick ist ein menschliches Haar?"
    params:
      min: 100
      max: 10000000
      scale: log
      unit: nm
    answer:
      value: 80000
      within: 60
    explanation: Etwa 80 000 nm, also 0,08 mm. Ein Virus misst rund 100 nm.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Welche Vorsilbe steht für welche Zehnerpotenz?
    params:
      pairs:
        - { left: Kilo, right: "$10^3$" }
        - { left: Mega, right: "$10^6$" }
        - { left: Milli, right: "$10^{-3}$" }
        - { left: Nano, right: "$10^{-9}$" }
    hints:
      - Ein Kilometer hat 1000 Meter, ein Millimeter ist ein Tausendstel Meter.
    explanation: Kilo und Mega machen groß, Milli und Nano machen klein.

  - kind: explain
    id: s2
    body: |
      Jede Vorsilbe ist eine Zehnerpotenz. Ein **Nanometer** ist ein Milliardstel Meter.
      Ein Haar ist etwa 80 000 Nanometer dick.

  - kind: problem
    id: umrechnen
    widget: numeric
    prompt: Wie viele Millimeter sind {{k}} Kilometer?
    params: { unit: mm }
    answer: { value: "{{k * 1000000}}" }
    hints:
      - Von Kilo zu Milli sind es 6 Zehnerschritte.
    explanation: "{{k}} km = {{k * 1000}} m = {{k * 1000000}} mm."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 3 }

  - kind: problem
    id: speicher
    widget: choice
    prompt: Wie viele Kilobyte sind ein Gigabyte – mit Tausender-Schritten gerechnet?
    params:
      options:
        - { label: Eine Million, correct: true }
        - { label: Tausend, feedback: "Das wären Megabyte. Giga ist noch eine Stufe mehr." }
        - { label: Eine Milliarde, feedback: "Das wären Byte, nicht Kilobyte." }
    hints:
      - Giga ist $10^9$, Kilo ist $10^3$.
    explanation: "$10^9 : 10^3 = 10^6$ – eine Million."

  - kind: problem
    id: ma-c1
    widget: buckets
    prompt: Länger oder kürzer als ein Meter?
    params:
      buckets:
        - id: b1
          label: länger
        - id: b2
          label: kürzer
      items:
        - label: 1 Kilometer
          bucket: b1
        - label: 1 Megameter
          bucket: b1
        - label: 1 Hektometer
          bucket: b1
        - label: 1 Millimeter
          bucket: b2
        - label: 1 Mikrometer
          bucket: b2
        - label: 1 Nanometer
          bucket: b2
    hints:
      - Kilo heißt tausend.
      - Milli heißt ein Tausendstel.
    explanation: Kilo, Mega, Hekto vergrößern. Milli, Mikro, Nano verkleinern.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Licht legt $3 \cdot 10^8$ m pro Sekunde zurück. Wie viele Meter sind das in einer Nanosekunde ($10^{-9}$ s)?
    params:
      unit: m
    answer:
      value: 0.3
    hints:
      - "Addiere die Exponenten: 8 + (−9)."
    explanation: $3 \cdot 10^{-1}$ m = 30 cm. Darum müssen Computerchips so klein sein.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: Wie viele Mikrometer sind {{k}} mm?
    params:
      unit: µm
    answer:
      value: "{{k * 1000}}"
    feedback:
      - when: numval(state.input) == k * 100
        misconception: factor-100
        text: Von Milli zu Mikro ist es ein Tausender-Schritt.
    hints:
      - Milli = $10^{-3}$, Mikro = $10^{-6}$.
      - 1 mm = 1000 µm.
    explanation: "{{k}} · 1000 = {{k * 1000}} µm."
    difficulty: 2
    variants:
      params:
        k: int[2,9]
      defaults:
        k: 3

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Eine Festplatte hat 2 TB (Terabyte). Wie viele GB sind das?
    params:
      unit: GB
    answer:
      value: 2000
    hints:
      - Tera = $10^{12}$, Giga = $10^9$.
      - Ein TB sind 1000 GB.
    explanation: 2 · 1000 = 2000 GB. Hersteller rechnen in Tausendern – der Computer zeigt oft etwas weniger an.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: Ein Kibibyte (KiB) hat 1024 Byte statt 1000. Warum gerade 1024?
    params:
      options:
        - label: 1024 = $2^{10}$ – Computer zählen in Zweierpotenzen
          correct: true
        - label: Wegen eines alten Rechenfehlers
          feedback: Es ist Absicht, keine Panne.
        - label: Weil 1024 durch 10 teilbar ist
          feedback: "1024 : 10 = 102,4."
    hints:
      - Computer rechnen binär.
      - "Verdopple zehnmal: 2, 4, 8, …"
    explanation: $2^{10} = 1024$ liegt nah an 1000. Darum entstanden die Binär-Vorsilben Kibi, Mebi, Gibi.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Rechne in wissenschaftlicher Schreibweise: $(4 \\cdot 10^5) \\cdot (5 \\cdot 10^{-2}) = 2 \\cdot 10^?$"
    answer:
      value: 4
    hints:
      - 4 · 5 = 20 = 2 · 10. Der Zehner kommt zum Exponenten dazu.
    explanation: 20 · 10³ = 2 · 10⁴.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Die großen Vorsilben gehen in **Tausenderschritten**: Kilo, Mega, Giga, Tera, Peta, Exa. 2022 kamen sogar Ronna ($10^{27}$) und Quetta ($10^{30}$) dazu."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Ein Atom ist etwa 0,1 nm breit. Wie viele Atome passen nebeneinander auf 1 Mikrometer?
    answer:
      value: 10000
    feedback:
      - when: numval(state.input) == 10
        misconception: wrong-unit
        text: Das sind die Atome auf 1 Nanometer. Ein Mikrometer ist 1000-mal länger.
    hints:
      - 1 µm = 1000 nm.
      - "1000 nm : 0,1 nm = ?"
    explanation: "1000 : 0,1 = 10 000 Atome. Moderne Chips haben Strukturen von nur wenigen Nanometern."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Die Sonne ist etwa 150 Gm (Gigameter) entfernt. Wie viele Kilometer sind das?
    params:
      unit: km
    answer:
      value: 150000000
    feedback:
      - when: numval(state.input) == 150000000000
        misconception: metres-not-km
        text: Das sind Meter. Für Kilometer noch durch 1000.
    hints:
      - Giga = $10^9$. 150 Gm = $1{,}5 \cdot 10^{11}$ m.
      - Durch 1000 für km.
    explanation: $1{,}5 \cdot 10^8$ km = 150 Millionen km.
    difficulty: 3

srs:
  cards_from: [umrechnen, speicher]
