id: math.powers.prefixes
type: concept
title: Kilo, Mega, Nano
summary: Vorsilben sind Zehnerpotenzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Nanometer dick ist ein menschliches Haar?"
    params:
      min: 100
      max: 10000000
      scale: log
      unit: nm
    answer:
      value: 80000
      within: 60
    explanation: Etwa 80 000 nm, also 0,08 mm. Ein Virus misst rund 100 nm.


  - kind: problem
    id: zuordnen
    widget: match
    prompt: Welche Vorsilbe steht für welche Zehnerpotenz?
    params:
      pairs:
        - { left: Kilo, right: "$10^3$" }
        - { left: Mega, right: "$10^6$" }
        - { left: Milli, right: "$10^{-3}$" }
        - { left: Nano, right: "$10^{-9}$" }
    hints:
      - Ein Kilometer hat 1000 Meter, ein Millimeter ist ein Tausendstel Meter.
    explanation: Kilo und Mega machen groß, Milli und Nano machen klein.

  - kind: explain
    id: s2
    body: |
      Jede Vorsilbe ist eine Zehnerpotenz. Ein **Nanometer** ist ein Milliardstel Meter.
      Ein Haar ist etwa 80 000 Nanometer dick.

  - kind: problem
    id: umrechnen
    widget: numeric
    prompt: Wie viele Millimeter sind {{k}} Kilometer?
    params: { unit: mm }
    answer: { value: "{{k * 1000000}}" }
    hints:
      - Von Kilo zu Milli sind es 6 Zehnerschritte.
    explanation: "{{k}} km = {{k * 1000}} m = {{k * 1000000}} mm."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 3 }

  - kind: problem
    id: speicher
    widget: choice
    prompt: Wie viele Kilobyte sind ein Gigabyte – mit Tausender-Schritten gerechnet?
    params:
      options:
        - { label: Eine Million, correct: true }
        - { label: Tausend, feedback: "Das wären Megabyte. Giga ist noch eine Stufe mehr." }
        - { label: Eine Milliarde, feedback: "Das wären Byte, nicht Kilobyte." }
    hints:
      - Giga ist $10^9$, Kilo ist $10^3$.
    explanation: "$10^9 : 10^3 = 10^6$ – eine Million."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Licht legt $3 \cdot 10^8$ m pro Sekunde zurück. Wie viele Meter sind das in einer Nanosekunde ($10^{-9}$ s)?
    params:
      unit: m
    answer:
      value: 0.3
    hints:
      - "Addiere die Exponenten: 8 + (−9)."
    explanation: $3 \cdot 10^{-1}$ m = 30 cm. Darum müssen Computerchips so klein sein.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Rechne in wissenschaftlicher Schreibweise: $(4 \\cdot 10^5) \\cdot (5 \\cdot 10^{-2}) = 2 \\cdot 10^?$"
    answer:
      value: 4
    hints:
      - 4 · 5 = 20 = 2 · 10. Der Zehner kommt zum Exponenten dazu.
    explanation: 20 · 10³ = 2 · 10⁴.
    difficulty: 3

srs:
  cards_from: [umrechnen, speicher]
