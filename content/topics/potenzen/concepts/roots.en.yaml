id: math.powers.roots
type: concept
title: Roots and powers of ten
summary: Working backward and taming huge numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: From area to side
    body: "A square garden has 64 m². How long is the fence along one side? Drag the rectangle into squares and read off the area. The **square root** goes the other way: from area to side."
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 10
        maxH: 8
        w: 3
        h: 2
        show:
          - area

  - kind: problem
    id: rueckwaerts
    widget: numeric
    prompt: Which number multiplied by itself gives {{n * n}}?
    params: { placeholder: "Number" }
    answer: { value: "{{n}}" }
    feedback:
      - when: "numval(state.input) == n * n / 2"
        misconception: half
        text: Halving is not the opposite of squaring.
    hints:
      - Try numbers whose square is close.
    explanation: "{{n}} · {{n}} = {{n * n}}. So $\\sqrt{ {{n * n}} } = {{n}}$."
    variants:
      params: { n: "int[4,15]" }
      defaults: { n: 7 }

  - kind: explain
    id: s2
    body: |
      The **root** $\sqrt{49}$ asks: which number times itself gives 49?
      Answer: 7. Roots undo squaring.

  - kind: problem
    id: schaetzen
    widget: numberline
    prompt: Roughly where is $\sqrt{20}$? Place the marker.
    params: { min: 0, max: 6, ticks: 2, labels: integers }
    answer: { value: 4.5, tolerance: 0.01 }
    hints:
      - 4 · 4 = 16 and 5 · 5 = 25. Where does 20 fall in between?
    explanation: $\sqrt{20} \approx 4.47$, just under 4.5.

  - kind: explain
    id: s4
    body: |
      Large numbers are written with **powers of ten**: 3,000,000 = $3 \cdot 10^6$.
      The Sun is about $1.5 \cdot 10^8$ km from Earth.

  - kind: problem
    id: zehner
    widget: numeric
    prompt: "Write {{t}} as 4 · 10 to the power … Give the exponent."
    params: { prefix: "4 · 10^" }
    answer: { value: "{{n}}" }
    feedback:
      - when: "numval(state.input) == n + 1"
        misconception: count-digits
        text: You counted all the digits. Count only the zeros after the 4.
    hints:
      - Count the zeros.
    explanation: "{{t}} has {{n}} zeros after the 4."
    variants:
      params: { n: "int[3,7]" }
      derive: { t: "4 * 10 ** n" }
      defaults: { n: 4 }

  - kind: problem
    id: groesser
    widget: choice
    prompt: Which number is larger?
    params:
      options:
        - { label: "$3 \\cdot 10^5$", correct: true }
        - { label: "$9 \\cdot 10^4$", feedback: "9 is larger than 3, but the exponent counts more. $9 \\cdot 10^4$ = 90,000." }
    hints:
      - Write out both numbers.
    explanation: 300,000 is more than 90,000.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: $\sqrt{81} = 9$
          right: true
        - text: $\sqrt{9 + 16} = 3 + 4$
          right: false
          why: √25 = 5, not 7. You cannot split roots of sums.
        - text: $\sqrt{4 \cdot 9} = 2 \cdot 3$
          right: true
        - text: $5 \cdot 10^3$ is 5000.
          right: true

  - kind: problem
    id: intro-c1
    widget: rect
    prompt: Drag a square made of exactly 49 squares. Its side is $\sqrt{49}$.
    params:
      maxW: 10
      maxH: 8
      w: 2
      h: 2
      show:
        - area
    check:
      predicate: area == 49 && square
    hints:
      - "A square has equal sides: side times side should make 49."
      - Which number times itself makes 49?
    explanation: 7 · 7 = 49, so $\sqrt{49} = 7$. The root is the side of the square.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Between which whole numbers does $\sqrt{150}$ lie? Enter the smaller one.
    answer:
      value: 12
    hints:
      - Which square numbers lie around 150?
    explanation: 12² = 144 and 13² = 169.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: rect
    prompt: Drag a square made of 36 squares. Its side is $\sqrt{36}$.
    params:
      maxW: 8
      maxH: 8
      w: 2
      h: 3
      show:
        - area
    check:
      predicate: area == 36 && square
    hints:
      - Width and height must be equal.
      - Which number times itself gives 36?
    explanation: 6 × 6 = 36, so $\sqrt{36} = 6$. A square root is the side of a square with a known area.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: how big is $\\sqrt{50}$?"
    params:
      min: 0
      max: 10
    answer:
      value: 7.07
      tolerance: 0.15
    explanation: $7^2 = 49$ – so $\sqrt{50}$ is just above 7, about 7.07.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Work out $\sqrt{0.25}$.
    answer:
      value: 0.5
    feedback:
      - when: numval(state.input) == 0.05
        misconception: decimal-places
        text: $0.05^2 = 0.0025$. Too small!
    hints:
      - Which number times itself gives 0.25?
      - 0.25 is a quarter.
    explanation: $0.5 \cdot 0.5 = 0.25$. For numbers below 1 the root is bigger than the number!
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Which number cubed gives 64? That is the cube root.
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 8
        misconception: square-root
        text: $8^2 = 64$, but $8^3 = 512$.
    hints:
      - Try 3, 4, 5.
      - $4 \cdot 4 \cdot 4 = ?$
    explanation: $4^3 = 64$. A cube of 64 cm³ has 4 cm edges.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Why is √2 not a fraction? Order the proof.
    params:
      items:
        - label: Suppose √2 = p/q, fully simplified.
        - label: Then p² = 2q², so p is even.
        - label: With p = 2k we get q² = 2k², so q is even too.
        - label: Then p/q could be simplified by 2 – contradiction.
    hints:
      - The proof starts with an assumption and ends in a contradiction.
    explanation: √2 is **irrational**. The discovery is said to have shaken the Pythagoreans deeply.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "**Heron’s method** finds roots: guess x for √2. Then take the average of x and 2 : x. Starting at x = 1 gives 1.5, then 1.4167. Each step roughly doubles the correct digits."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "One Heron step for $\\sqrt{10}$ starting at 3: work out $(3 + 10 : 3) : 2$ to three decimals."
    answer:
      value: 3.167
      tolerance: 0.001
    hints:
      - "10 : 3 ≈ 3.333."
      - "(3 + 3.333) : 2."
    explanation: ≈ 3.167. The true value is 3.1623 – very close after just one step.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: What is $\sqrt{-4}$?
    params:
      options:
        - label: $(-2)^2 = +4$, not −4.
          feedback: $(-2)^2 = +4$, nicht −4.
        - label: $2^2 = 4$, not −4.
          feedback: $2^2 = 4$, nicht −4.
        - label: No real number – that is why complex numbers were invented
          correct: true
    hints:
      - Can a square be negative?
      - Plus times plus and minus times minus both give plus.
    explanation: No real square is negative. With the new number i, where $i^2 = -1$, $\sqrt{-4} = 2i$.
    difficulty: 3

srs:
  cards_from: [rueckwaerts, zehner]
