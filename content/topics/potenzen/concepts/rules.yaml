id: math.powers.rules
type: concept
title: Potenzregeln
summary: Addieren, multiplizieren, abziehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: mal
    widget: numeric
    prompt: Ergänze den Exponenten. ${{b}}^{{m}} \cdot {{b}}^{{n}} = {{b}}^{?}$
    params: { placeholder: "?" }
    answer: { value: "{{m + n}}" }
    feedback:
      - when: "numval(state.input) == m * n"
        misconception: multiply-exponents
        text: Zähle die Faktoren. Es sind {{m}} plus {{n}} gleiche Zahlen.
    hints:
      - Schreib beide Potenzen als Produkte aus.
    explanation: "{{m}} + {{n}} = {{m + n}} Faktoren."
    variants:
      params: { b: "choice[2,3,5,10]", m: "int[2,6]", n: "int[2,6]" }
      constraints: ["m * n != m + n"]
      defaults: { b: 2, m: 3, n: 4 }

  - kind: explain
    id: s2
    body: |
      **Gleiche Basis malnehmen:** Exponenten addieren. $2^3 \cdot 2^4 = 2^7$ – das sind 3 + 4 Zweien.
      **Potenz hoch nehmen:** Exponenten malnehmen. $(2^3)^2 = 2^6$.

  - kind: problem
    id: hoch
    widget: numeric
    prompt: Ergänze den Exponenten. $({{b}}^{{m}})^{{n}} = {{b}}^{?}$
    params: { placeholder: "?" }
    answer: { value: "{{m * n}}" }
    feedback:
      - when: "numval(state.input) == m + n"
        misconception: add-exponents
        text: Hier wird die ganze Potenz {{n}}-mal genommen. Also malnehmen.
    hints:
      - "Schreib es aus: {{n}} Klammern, in jeder {{m}} Faktoren."
    explanation: "{{n}} · {{m}} = {{m * n}}."
    variants:
      params: { b: "choice[2,3,7]", m: "int[2,4]", n: "int[2,4]" }
      constraints: ["m * n != m + n"]
      defaults: { b: 3, m: 2, n: 3 }

  - kind: explain
    id: s4
    body: |
      **Teilen** zieht ab: $5^6 : 5^2 = 5^4$.
      Darum gilt auch $5^2 : 5^2 = 5^0 = 1$. Jede Zahl hoch 0 ist 1.

  - kind: problem
    id: hoch-null
    widget: choice
    prompt: Was ist $7^0$?
    params:
      layout: grid
      options:
        - { label: "1", correct: true }
        - { label: "0", feedback: "Hoch 0 heißt nicht »gar nichts«. Denk an $7^2 : 7^2$." }
        - { label: "7", feedback: "Das wäre $7^1$." }
    hints:
      - Was ergibt eine Zahl geteilt durch sich selbst?
    explanation: "$7^0 = 7^1 : 7^1 = 1$."

  - kind: problem
    id: teilen
    widget: numeric
    prompt: "Ergänze den Exponenten. $10^{{a}} : 10^{{b}} = 10^{?}$"
    params: { placeholder: "?" }
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: add-on-divide
        text: Beim Teilen wird abgezogen.
    hints:
      - Beim Teilen kürzen sich {{b}} Zehner weg.
    explanation: "{{a}} − {{b}} = {{a - b}}."
    variants:
      params: { a: "int[5,9]", b: "int[1,4]" }
      defaults: { a: 7, b: 3 }

  - kind: problem
    id: c1
    widget: match
    prompt: Was gehört zusammen?
    params:
      pairs:
        - left: $a^3 \cdot a^4$
          right: $a^7$
        - left: $(a^3)^4$
          right: $a^{12}$
        - left: "$a^6 : a^2$"
          right: $a^4$
        - left: $a^0$
          right: "1"
        - left: $a^3 \cdot b^3$
          right: $(ab)^3$
    hints:
      - Schreib die Potenzen als Produkte aus.
    explanation: Malnehmen addiert, Potenzieren multipliziert, Teilen subtrahiert die Exponenten.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Vereinfache und gib den Exponenten an: $\\frac{2^8 \\cdot 2^5}{(2^3)^3} = 2^?$"
    answer:
      value: 4
    hints:
      - Oben 8 + 5, unten 3 · 3.
    explanation: 13 − 9 = 4.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Ist der **Exponent** gleich, darf man die Basen malnehmen. Aus drei Zweien und drei Fünfen werden drei Zehnen: $2^3 \\cdot 5^3 = 10^3$. So gilt immer $a^n \\cdot b^n = (a \\cdot b)^n$."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Rechne geschickt: $2^5 \\cdot 5^5$"
    answer:
      value: 100000
    feedback:
      - when: numval(state.input) == 10000000000
        misconception: add-exponents
        text: "Die Basen werden malgenommen, die Exponenten bleiben: $10^5$, nicht $10^{10}$."
    hints:
      - Fasse 2 und 5 paarweise zusammen.
      - $(2 \cdot 5)^5 = 10^5$.
    explanation: $10^5 = 100\,000$.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Schreibe als Potenz von 2: $4^{ {{n}} } = 2^{?}$"
    answer:
      value: "{{2 * n}}"
    feedback:
      - when: numval(state.input) == n + 2 && n != 2
        misconception: add-instead
        text: "Potenz hoch Potenz: Exponenten malnehmen, nicht addieren."
    hints:
      - $4 = 2^2$.
      - $(2^2)^{ {{n}} }$ – Exponenten malnehmen.
    explanation: $(2^2)^{ {{n}} } = 2^{ {{2 * n}} }$.
    difficulty: 2
    variants:
      params:
        n: int[2,9]
      defaults:
        n: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was ist $2^3 + 2^3$?
    params:
      options:
        - label: $2^4$
          correct: true
        - label: $2^6$
          feedback: Exponenten addieren gilt nur beim **Malnehmen**.
        - label: $4^3$
          feedback: Das wären 64. Hier sind es 8 + 8 = 16.
    hints:
      - "Rechne es aus: 8 + 8."
    explanation: Zweimal dasselbe ist $2 \cdot 2^3 = 2^4$. Für Summen von Potenzen gibt es keine Regel.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Achtung, Klammern: Berechne $2^{(3^2)}$."
    answer:
      value: 512
    feedback:
      - when: numval(state.input) == 64
        misconception: wrong-grouping
        text: Das ist $(2^3)^2$. Hier steht der ganze Exponent $3^2 = 9$ oben.
    hints:
      - "Erst den Exponenten: $3^2 = 9$."
      - $2^9 = ?$
    explanation: $2^9 = 512$, aber $(2^3)^2 = 2^6 = 64$. Potenztürme rechnet man von oben nach unten.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Warum ist $a^0 = 1$? Teile $a^3$ durch $a^3$. Das ergibt 1. Nach der **Regel** ist es aber $a^{3-3} = a^0$. Damit beides stimmt, muss $a^0 = 1$ sein.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: "Was ist größer: $2^{30}$ oder $3^{20}$?"
    params:
      options:
        - label: $2^{30}$
          feedback: "Schreibe beide mit dem Exponenten 10: $8^{10}$ und $9^{10}$."
        - label: $3^{20}$
          correct: true
        - label: Beide gleich
          feedback: $8^{10}$ und $9^{10}$ sind verschieden.
    hints:
      - $2^{30} = (2^3)^{10}$ und $3^{20} = (3^2)^{10}$.
      - Vergleiche $8^{10}$ mit $9^{10}$.
    explanation: $9^{10} > 8^{10}$, also ist $3^{20}$ größer – ohne eine einzige große Rechnung.
    difficulty: 3

srs:
  cards_from: [mal, hoch]
