id: math.powers.lab
type: concept
title: Potenz-Labor
summary: Kurven, Säulen und Bits.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Turm der Mönche
    body: "Eine Legende sagt: Mönche versetzen einen Turm aus 64 Scheiben, und dann geht die Welt unter. Versetze du den Turm aus 3 Scheiben – nie eine große auf eine kleine. Jede Scheibe mehr **verdoppelt** die Züge fast."
    visual:
      widget: hanoi
      interactive: true
      params:
        disks: 3

  - kind: problem
    id: kurve
    widget: slider
    prompt: Stelle die Basis so ein, dass die Kurve die gestrichelte trifft.
    params:
      expr: "a^x"
      x: [0, 4]
      y: [0, 20]
      showCoordinates: false
      sliders: [{ id: a, label: Basis, min: 1, max: 4, step: 0.5, initial: 1 }]
      target: { expr: "2^x" }
    answer: { matchTarget: true }
    hints:
      - Bei x = 4 ist die gestrichelte Kurve bei 16.
    explanation: $2^x$ – bei jedem Schritt nach rechts verdoppelt sich der Wert.

  - kind: problem
    id: saeulen
    widget: chart
    prompt: Stell die nächsten beiden Zweierpotenzen ein.
    params:
      labels: ["2¹", "2²", "2³", "2⁴"]
      values: [2, 4, 0, 0]
      editable: [2, 3]
      min: 0
      max: 20
    answer: { values: [2, 4, 8, 16] }
    feedback:
      - when: "values[2] == 6"
        misconception: additive
        text: Potenzen verdoppeln – sie zählen nicht 2 dazu.
    hints:
      - Jedes Mal verdoppeln.
    explanation: 8 und 16 – jede Säule doppelt so hoch wie die vorige.

  - kind: problem
    id: wurzel
    widget: numberline
    prompt: Markiere ungefähr, wo √2 liegt.
    params: { min: 1, max: 2, ticks: 10, labels: decimals }
    answer: { value: 1.4 }
    hints:
      - 1,4 · 1,4 = 1,96.
    explanation: √2 = 1,414… – knapp über 1,4.

  - kind: problem
    id: bits
    widget: bits
    prompt: Stelle 2 hoch 5 ein.
    params: { bits: 6, showValue: false }
    answer: { value: 32 }
    hints:
      - Eine einzige Lampe reicht.
    explanation: Jede Stelle im Zweiersystem ist eine Zweierpotenz – 32 ist die Stelle ganz links.

  - kind: problem
    id: ma-d1
    depth: 2
    widget: sim
    prompt: Ein Stoff hat eine Halbwertszeit von 2 Stunden. Nach wie vielen Stunden sind nur noch 12,5 % übrig?
    params:
      scene: decay
    answer:
      halflife: 2
      time: 6
    hints:
      - Stell die Halbwertszeit auf 2.
      - "100 → 50 → 25 → 12,5: dreimal halbieren."
    explanation: $100 \cdot 2^{-3} = 12{,}5$. Drei Halbwertszeiten sind 6 Stunden.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: slider
    prompt: Stelle a so ein, dass die Kurve $y = a^x$ durch den Punkt (3 | 8) geht.
    params:
      expr: a^x
      x:
        - 0
        - 4
      y:
        - 0
        - 10
      showCoordinates: true
      sliders:
        - id: a
          label: a
          min: 1
          max: 3
          step: 0.5
          initial: 1.5
      markers:
        - x: 3
          y: 8
          label: P
    answer:
      values:
        a: 2
    hints:
      - Gesucht ist $a^3 = 8$.
      - Welche Zahl hoch 3 ergibt 8?
    explanation: $2^3 = 8$. Jede Kurve $a^x$ geht durch (0 | 1), denn $a^0 = 1$.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: sim
    prompt: Bei welchem Zuwachs pro Jahr verdoppelt sich ein Wert in genau 10 Jahren (Faktor 1,95 bis 2,05)?
    params:
      scene: growth
    answer:
      years: 10
      factor:
        - 1.95
        - 2.05
    hints:
      - Stell 10 Jahre ein und probiere verschiedene Raten.
      - "Die 72er-Regel: 72 : 10 ≈ 7."
    explanation: Bei 7 % ist der Faktor nach 10 Jahren 1,97.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Blatt (0,1 mm) wird 50-mal gefaltet. Wie dick wäre der Stapel?
    params:
      options:
        - label: Etwa bis zur Sonne – rund 110 Millionen km
          correct: true
        - label: Etwa 5 Meter
          feedback: Das wäre 50 mal 0,1 mm mal 1000 – aber Falten **verdoppelt**.
        - label: Etwa so hoch wie ein Hochhaus
          feedback: $2^{50}$ ist rund eine Billiarde.
    hints:
      - $2^{10}$ ≈ 1000, also $2^{50}$ ≈ $10^{15}$.
    explanation: $10^{15}$ · 0,1 mm = $10^{11}$ m = 100 Millionen km.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Wie oft muss man 1 verdoppeln, um 1024 zu erreichen? Also $2^{?} = 1024$.
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 512
        misconception: value-not-exponent
        text: Gesucht ist der Exponent, nicht die Zahl davor.
    hints:
      - 2, 4, 8, 16, … zähl mit.
      - $2^{10} = 1024$.
    explanation: "Zehnmal verdoppeln. Diese Rückwärtsfrage beantwortet der Logarithmus: $\\log_2 1024 = 10$."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Die Umkehrung der Potenz heißt **Logarithmus**. $\log_2 1024 = 10$, weil $2^{10} = 1024$. Er zählt, wie oft man verdoppeln muss.

srs:
  cards_from: [saeulen, wurzel]
