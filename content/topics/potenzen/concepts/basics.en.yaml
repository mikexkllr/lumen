id: math.powers.basics
type: concept
title: Power, not times
summary: What the exponent really means.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Powers beat times
    body: A rumour that everyone passes on to two people is soon everywhere. The dashed line shows 2 · x, your curve the **power** $b^x$. Slide b to 2 and compare. Who leaves whom behind?
    visual:
      widget: slider
      interactive: true
      params:
        expr: b^x
        x:
          - 0
          - 5
        y:
          - 0
          - 8
        showCoordinates: false
        sliders:
          - id: b
            label: base b
            min: 1
            max: 3
            step: 0.5
            initial: 1
        target:
          expr: 2*x

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: 1 grain of rice on the first chess square, double on each next one. How many digits does the number on square 64 have?"
    params:
      min: 1
      max: 60
    answer:
      value: 19
      tolerance: 3
    explanation: $2^{63}$ ≈ 9 quintillion – a number with 19 digits. More rice than the Earth has ever harvested.

  - kind: problem
    id: quadrat
    widget: numeric
    visual: { widget: pixels, params: { cells: ["####.", "####.", "####.", "####.", "....."] } }
    prompt: How many cells does the square have? You write this as $4^2$.
    params: { unit: cells }
    answer: { value: 16 }
    feedback:
      - when: "numval(state.input) == 8"
        misconception: power-as-product
        text: 4 · 2 would be 8. But the square has 4 rows of 4 cells each.
    hints:
      - Count one row and multiply it by the number of rows.
    explanation: 4 · 4 = 16. That is why $4^2$ is also read "4 squared".

  - kind: explain
    id: s2
    body: |
      $4^2$ means 4 · 4, not 4 · 2.
      The **exponent** on top says how many times the **base** is multiplied by itself.

  - kind: problem
    id: berechnen
    widget: numeric
    prompt: Calculate ${{a}}^{{n}}$.
    params: { placeholder: "Result" }
    answer: { value: "{{a ** n}}" }
    feedback:
      - when: "numval(state.input) == a * n"
        misconception: power-as-product
        text: You calculated {{a}} · {{n}}. A power means multiplying {{a}} by itself that many times.
    hints:
      - Write it as a product of {{n}} equal numbers.
    explanation: "{{a}} to the power {{n}} = {{a ** n}}."
    variants:
      params: { a: "int[2,5]", n: "int[2,4]" }
      constraints: ["a * n != a ** n"]
      defaults: { a: 3, n: 4 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Which is bigger, $2^{10}$ or $10^2$?
    params:
      options:
        - { label: "$2^{10}$", correct: true }
        - { label: "$10^2$", feedback: "$10^2$ is 100. $2^{10}$ is 1024." }
        - { label: Both the same, feedback: "Swapping base and exponent almost always changes the result." }
    hints:
      - Work out both. Double 10 times.
    explanation: $2^{10} = 1024$, $10^2 = 100$.

  - kind: explain
    id: s5
    body: You fold a sheet of paper 42 times. How thick would it be?
    reveal:
      body: Each fold doubles the layers. $2^{42}$ layers of 0.1 mm each would reach the Moon.

  - kind: problem
    id: falten
    widget: numeric
    prompt: How many layers does the sheet have after {{n}} folds?
    params: { unit: layers }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear-growth
        text: Each fold doubles the layers. It doesn't just add 2.
    hints:
      - 1 fold gives 2 layers, 2 folds give 4 layers …
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ layers."
    variants:
      params: { n: "int[5,10]" }
      defaults: { n: 10 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: $3^2 = 6$
          right: false
          why: 3² = 3 · 3 = 9.
        - text: $2^5 = 32$
          right: true
        - text: $10^3$ has three zeros.
          right: true
        - text: $1^{100} = 100$
          right: false
          why: 1 times 1 always stays 1.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Which is larger: $3^4$ or $4^3$? Enter the larger number."
    answer:
      value: 81
    hints:
      - 3 · 3 · 3 · 3 against 4 · 4 · 4.
    explanation: 81 against 64. The exponent usually weighs more than the base.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: In **exponential growth** you multiply by the same number at every step. In linear growth the same amount is added. At first both look similar – then exponential races ahead.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: Linear or exponential?
    params:
      buckets:
        - id: b1
          label: linear
        - id: b2
          label: exponential
      items:
        - label: €5 more every day
          bucket: b1
        - label: 2 cm of snow every hour
          bucket: b1
        - label: Read 10 pages every week
          bucket: b1
        - label: Bacteria double daily
          bucket: b2
        - label: 3 % more every year
          bucket: b2
        - label: Everyone tells two new people
          bucket: b2
    hints:
      - Is something added or multiplied?
      - Percentages and doubling are multiplying.
    explanation: "Fixed amount added: linear. Fixed factor: exponential."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Water lilies double every day. After 30 days the pond is full. On which day was it half full?
    answer:
      value: 29
    feedback:
      - when: numval(state.input) == 15
        misconception: linear-thinking
        text: "Half the time is not half the amount. Think backwards: halve once."
    hints:
      - What happens from half full to full?
      - One doubling – one day.
    explanation: On day 29 it is half full, on day 30 full. Exponential growth feels harmless for a long time – then everything happens fast.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which number is the largest?
    params:
      options:
        - label: $2^{100}$
          correct: true
        - label: $100^{10}$
          feedback: That is $10^{20}$. But $2^{100} = (2^{10})^{10} ≈ 10^{30}$.
        - label: $10^{25}$
          feedback: $2^{10}$ ≈ 1000, so $2^{100}$ ≈ $10^{30}$.
    hints:
      - "Remember: $2^{10}$ = 1024 ≈ $10^3$."
    explanation: With $2^{10} ≈ 10^3$ you convert powers of two into powers of ten.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: What is the last digit of $7^{100}$?
    answer:
      value: 1
    hints:
      - "The last digits of $7^1, 7^2, 7^3, 7^4$: 7, 9, 3, 1."
      - "The pattern repeats every 4 steps. 100 : 4 = 25."
    explanation: 100 is divisible by 4, so $7^{100}$ ends like $7^4 = 2401$, in 1. Working with last digits is arithmetic modulo 10.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: In the long run $2^n$ beats any fixed power like $n^{10}$. For a long time $n^{10}$ is far ahead, but from n = 59 on, $2^n$ is bigger – forever. That is why **exponential** algorithms count as too slow.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why $2^{10}$ is not 20.
    params:
      keywords:
        - - mal
          - times
          - multipl
        - - zehnmal
          - zehn
          - ten
          - "10"
        - - "1024"
          - verdoppel
          - doubl
          - nicht plus
          - not plus
      sample: The exponent 10 says to multiply 2 by itself ten times, doubling again and again. That gives 1024. 20 would be 2 times 10.
    explanation: "Key idea: the exponent counts factors, it is not a factor."
    difficulty: 3

srs:
  cards_from: [berechnen, falten]
