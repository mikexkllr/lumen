id: math.powers.lab
type: concept
title: Powers lab
summary: Curves, bars and bits.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: kurve
    widget: slider
    prompt: Set the base so that the curve hits the dashed one.
    params:
      expr: "a^x"
      x: [0, 4]
      y: [0, 20]
      showCoordinates: false
      sliders: [{ id: a, label: Base, min: 1, max: 4, step: 0.5, initial: 1 }]
      target: { expr: "2^x" }
    answer: { matchTarget: true }
    hints:
      - At x = 4, the dashed curve is at 16.
    explanation: $2^x$. With each step to the right, the value doubles.

  - kind: problem
    id: saeulen
    widget: chart
    prompt: Set the next two powers of two.
    params:
      labels: ["2¹", "2²", "2³", "2⁴"]
      values: [2, 4, 0, 0]
      editable: [2, 3]
      min: 0
      max: 20
    answer: { values: [2, 4, 8, 16] }
    feedback:
      - when: "values[2] == 6"
        misconception: additive
        text: Powers double. They don't add 2.
    hints:
      - Double each time.
    explanation: 8 and 16. Each bar is twice as high as the one before.

  - kind: problem
    id: wurzel
    widget: numberline
    prompt: Mark roughly where √2 lies.
    params: { min: 1, max: 2, ticks: 10, labels: decimals }
    answer: { value: 1.4 }
    hints:
      - 1.4 · 1.4 = 1.96.
    explanation: √2 = 1.414…, just above 1.4.

  - kind: problem
    id: bits
    widget: bits
    prompt: Set 2 to the power of 5.
    params: { bits: 6, showValue: false }
    answer: { value: 32 }
    hints:
      - A single lamp is enough.
    explanation: Each place in the binary system is a power of two. 32 is the leftmost place.

  - kind: problem
    id: ma-d1
    depth: 2
    widget: sim
    prompt: A substance has a half-life of 2 hours. After how many hours is only 12.5 % left?
    params:
      scene: decay
    answer:
      halflife: 2
      time: 6
    hints:
      - Set the half-life to 2.
      - "100 → 50 → 25 → 12.5: halve three times."
    explanation: $100 \cdot 2^{-3} = 12.5$. Three half-lives are 6 hours.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: slider
    prompt: Set a so that the curve $y = a^x$ passes through the point (3 | 8).
    params:
      expr: a^x
      x:
        - 0
        - 4
      y:
        - 0
        - 10
      showCoordinates: true
      sliders:
        - id: a
          label: a
          min: 1
          max: 3
          step: 0.5
          initial: 1.5
      markers:
        - x: 3
          y: 8
          label: P
    answer:
      values:
        a: 2
    hints:
      - You need $a^3 = 8$.
      - Which number cubed gives 8?
    explanation: $2^3 = 8$. Every curve $a^x$ passes through (0 | 1), because $a^0 = 1$.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: sim
    prompt: At what growth per year does a value double in exactly 10 years (factor 1.95 to 2.05)?
    params:
      scene: growth
    answer:
      years: 10
      factor:
        - 1.95
        - 2.05
    hints:
      - Set 10 years and try different rates.
      - "The rule of 72: 72 : 10 ≈ 7."
    explanation: At 7 % the factor after 10 years is 1.97.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A sheet (0.1 mm) is folded 50 times. How thick would the stack be?
    params:
      options:
        - label: Roughly to the Sun – about 110 million km
          correct: true
        - label: About 5 metres
          feedback: That would be adding – but folding **doubles**.
        - label: About as tall as a skyscraper
          feedback: $2^{50}$ is about a quadrillion.
    hints:
      - $2^{10}$ ≈ 1000, so $2^{50}$ ≈ $10^{15}$.
    explanation: $10^{15}$ · 0.1 mm = $10^{11}$ m = 100 million km.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: How many times must you double 1 to reach 1024? So $2^{?} = 1024$.
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 512
        misconception: value-not-exponent
        text: We want the exponent, not the number before it.
    hints:
      - 2, 4, 8, 16, … count along.
      - $2^{10} = 1024$.
    explanation: "Ten doublings. The logarithm answers this backward question: $\\log_2 1024 = 10$."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: The inverse of a power is the **logarithm**. $\log_2 1024 = 10$, because $2^{10} = 1024$. It counts how many doublings you need.

srs:
  cards_from: [saeulen, wurzel]
