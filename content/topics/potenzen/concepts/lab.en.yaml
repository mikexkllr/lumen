id: math.powers.lab
type: concept
title: Powers lab
summary: Curves, bars and bits.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: kurve
    widget: slider
    prompt: Set the base so that the curve hits the dashed one.
    params:
      expr: "a^x"
      x: [0, 4]
      y: [0, 20]
      showCoordinates: false
      sliders: [{ id: a, label: Base, min: 1, max: 4, step: 0.5, initial: 1 }]
      target: { expr: "2^x" }
    answer: { matchTarget: true }
    hints:
      - At x = 4, the dashed curve is at 16.
    explanation: $2^x$. With each step to the right, the value doubles.

  - kind: problem
    id: saeulen
    widget: chart
    prompt: Set the next two powers of two.
    params:
      labels: ["2¹", "2²", "2³", "2⁴"]
      values: [2, 4, 0, 0]
      editable: [2, 3]
      min: 0
      max: 20
    answer: { values: [2, 4, 8, 16] }
    feedback:
      - when: "values[2] == 6"
        misconception: additive
        text: Powers double. They don't add 2.
    hints:
      - Double each time.
    explanation: 8 and 16. Each bar is twice as high as the one before.

  - kind: problem
    id: wurzel
    widget: numberline
    prompt: Mark roughly where √2 lies.
    params: { min: 1, max: 2, ticks: 10, labels: decimals }
    answer: { value: 1.4 }
    hints:
      - 1.4 · 1.4 = 1.96.
    explanation: √2 = 1.414…, just above 1.4.

  - kind: problem
    id: bits
    widget: bits
    prompt: Set 2 to the power of 5.
    params: { bits: 6, showValue: false }
    answer: { value: 32 }
    hints:
      - A single lamp is enough.
    explanation: Each place in the binary system is a power of two. 32 is the leftmost place.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A sheet (0.1 mm) is folded 50 times. How thick would the stack be?
    params:
      options:
        - label: Roughly to the Sun – about 110 million km
          correct: true
        - label: About 5 metres
          feedback: That would be adding – but folding **doubles**.
        - label: About as tall as a skyscraper
          feedback: $2^{50}$ is about a quadrillion.
    hints:
      - $2^{10}$ ≈ 1000, so $2^{50}$ ≈ $10^{15}$.
    explanation: $10^{15}$ · 0.1 mm = $10^{11}$ m = 100 million km.
    difficulty: 3

srs:
  cards_from: [saeulen, wurzel]
