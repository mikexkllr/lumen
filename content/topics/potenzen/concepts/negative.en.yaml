id: math.powers.negative
type: concept
title: Negative exponents
summary: A minus in the exponent means divide.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Keep on halving
    body: "Keep halving and the piece gets tiny – but never negative. Split the bar into 2, 4, 8 or 16 pieces and shade one. This is what a **negative exponent** looks like: it counts how often you divided."
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 2
        shape: bar
        shaded:
          - 0
        partOptions:
          - 2
          - 4
          - 8
          - 16

  - kind: problem
    id: muster
    widget: numeric
    body: $10^3 = 1000$, $10^2 = 100$, $10^1 = 10$, $10^0 = 1$.
    prompt: Continue the pattern. What is $10^{-1}$?
    params: { placeholder: "Number" }
    answer: { value: 0.1 }
    feedback:
      - when: "numval(state.input) == -10"
        misconception: negative-result
        text: The result does not turn negative. Each step divides by 10.
    hints:
      - Each step down divides by 10.
    explanation: "1 ÷ 10 = 0.1."

  - kind: explain
    id: s2
    body: |
      A **negative exponent** means the reciprocal: $2^{-3} = \frac{1}{2^3} = \frac{1}{8}$.
      The result is small, but never negative.

  - kind: problem
    id: kehrwert
    widget: numeric
    prompt: Calculate ${{b}}^{-{{n}}}$ as a fraction.
    params: { placeholder: "e.g. 1/8" }
    answer: { value: "1/{{b ** n}}" }
    feedback:
      - when: "numval(state.input) == -(b ** n)"
        misconception: negative-result
        text: A minus in the exponent means the reciprocal, not a minus in front of the number.
    hints:
      - "First calculate ${{b}}^{{n}}$, then divide 1 by the result."
    explanation: "1/{{b ** n}}."
    variants:
      params: { b: "int[2,5]", n: "int[2,3]" }
      defaults: { b: 2, n: 3 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Which number is the smallest?
    params:
      options:
        - { label: "$10^{-3}$", correct: true }
        - { label: "$10^{-1}$", feedback: "That is 0.1, which is larger than 0.001." }
        - { label: "$10^{0}$", feedback: "That is 1." }
    hints:
      - Write them all as decimals.
    explanation: $10^{-3}$ = 0.001.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "A negative exponent forms the [[reciprocal]]: $10^{-2}$ is [[0.01]]. The result is small but never [[negative]]."
      distractors:
        - −100
        - absolute value

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Shade $2^{-2}$ of the bar. You can split it differently.
    params:
      parts: 2
      shape: bar
      partOptions:
        - 2
        - 4
        - 8
    answer:
      fraction: 1/4
    hints:
      - $2^{-2}$ means $\frac{1}{2^2}$.
      - "That is one quarter: split into 4 pieces and shade one."
    explanation: $2^{-2} = \frac{1}{4}$. Two of 8 pieces are right as well.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Compute $\left(\frac{2}{3}\right)^{-2}$ as a fraction.
    answer:
      value: 9/4
    hints:
      - First take the reciprocal, then square.
    explanation: (3/2)² = 9/4.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Halving is times 2⁻¹. After how many half-lives is less than 1% left?
    params:
      scene: decay
      controls:
        halflife:
          value: 1
          fixed: true
    answer:
      left:
        - 0
        - 1
    explanation: "After 7 halvings: 2⁻⁷ = 1/128 ≈ 0.8%."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Keep the pattern going. What comes next? $10^3 = 1000$, $10^2 = 100$, $10^1 = 10$, $10^0 = \;?$, $10^{-1} = \;?$
    reveal:
      body: 1 and 0.1. Every step to the right divides by 10 – even below zero.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Fill in the exponent: {{10 ** (0 - n)}} = $10^{?}$"
    answer:
      value: "{{0 - n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: sign
        text: The number is less than 1. The exponent must be negative.
    hints:
      - Count the decimal places up to the 1.
      - There are {{n}} places – so minus {{n}}.
    explanation: "{{10 ** (0 - n)}} = $10^{ {{0 - n}} }$: the 1 is in decimal place {{n}}."
    difficulty: 2
    variants:
      params:
        n: int[1,6]
      defaults:
        n: 3

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: A bacterium is 0.000002 m long. That is $2 \cdot 10^{?}$ m.
    answer:
      value: -6
    feedback:
      - when: numval(state.input) == -5
        misconception: off-by-one
        text: "Count up to and including the 2: it is in the 6th place."
    hints:
      - How many decimal places up to the 2?
      - Six.
    explanation: $2 \cdot 10^{-6}$ m = 2 micrometres.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is $8^{2/3}$?
    answer:
      value: 4
    hints:
      - The denominator 3 means cube root, the numerator 2 means square.
    explanation: ∛8 = 2 and 2² = 4. Fractional exponents are roots – that keeps all power rules valid.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Fractions in the exponent are **roots**: $a^{1/2} = \\sqrt{a}$, because $a^{1/2} \\cdot a^{1/2} = a^1$. Likewise $a^{1/3}$ is the cube root."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Work out $27^{1/3}$.
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 9
        misconception: divide-instead
        text: "$27^{1/3}$ means cube root, not 27 : 3."
    hints:
      - Which number cubed gives 27?
      - $3 \cdot 3 \cdot 3$.
    explanation: $3^3 = 27$, so $27^{1/3} = 3$.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Work out $16^{-1/2}$ as a fraction.
    answer:
      value: 1/4
    feedback:
      - when: numval(state.input) == -4
        misconception: negative-result
        text: A minus in the exponent means reciprocal, not negative.
    hints:
      - $16^{1/2} = 4$.
      - The minus gives the reciprocal.
    explanation: $16^{-1/2} = \frac{1}{\sqrt{16}} = \frac{1}{4}$.
    difficulty: 3

srs:
  cards_from: [kehrwert, vergleich]
