id: math.powers.rules
type: concept
title: Power rules
summary: Adding, multiplying, subtracting.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: mal
    widget: numeric
    prompt: Fill in the exponent. ${{b}}^{{m}} \cdot {{b}}^{{n}} = {{b}}^{?}$
    params: { placeholder: "?" }
    answer: { value: "{{m + n}}" }
    feedback:
      - when: "numval(state.input) == m * n"
        misconception: multiply-exponents
        text: Count the factors. There are {{m}} plus {{n}} equal numbers.
    hints:
      - Write both powers as products.
    explanation: "{{m}} + {{n}} = {{m + n}} factors."
    variants:
      params: { b: "choice[2,3,5,10]", m: "int[2,6]", n: "int[2,6]" }
      constraints: ["m * n != m + n"]
      defaults: { b: 2, m: 3, n: 4 }

  - kind: explain
    id: s2
    body: |
      **Multiplying with the same base:** add the **exponents**. $2^3 \cdot 2^4 = 2^7$, which is 3 + 4 twos.
      **Raising a power to a power:** multiply the exponents. $(2^3)^2 = 2^6$.

  - kind: problem
    id: hoch
    widget: numeric
    prompt: Fill in the exponent. $({{b}}^{{m}})^{{n}} = {{b}}^{?}$
    params: { placeholder: "?" }
    answer: { value: "{{m * n}}" }
    feedback:
      - when: "numval(state.input) == m + n"
        misconception: add-exponents
        text: Here the whole power is taken {{n}} times. So multiply.
    hints:
      - "Write it out: {{n}} parentheses, with {{m}} factors in each."
    explanation: "{{n}} · {{m}} = {{m * n}}."
    variants:
      params: { b: "choice[2,3,7]", m: "int[2,4]", n: "int[2,4]" }
      constraints: ["m * n != m + n"]
      defaults: { b: 3, m: 2, n: 3 }

  - kind: explain
    id: s4
    body: |
      **Dividing** subtracts: $5^6 \div 5^2 = 5^4$.
      That is why $5^2 \div 5^2 = 5^0 = 1$. Any number to the power 0 is 1.

  - kind: problem
    id: hoch-null
    widget: choice
    prompt: What is $7^0$?
    params:
      layout: grid
      options:
        - { label: "1", correct: true }
        - { label: "0", feedback: "To the power 0 doesn't mean \"nothing at all\". Think of $7^2 \\div 7^2$." }
        - { label: "7", feedback: "That would be $7^1$." }
    hints:
      - What does a number divided by itself give?
    explanation: "$7^0 = 7^1 \\div 7^1 = 1$."

  - kind: problem
    id: teilen
    widget: numeric
    prompt: "Fill in the exponent. $10^{{a}} : 10^{{b}} = 10^{?}$"
    params: { placeholder: "?" }
    answer: { value: "{{a - b}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: add-on-divide
        text: When dividing, you subtract.
    hints:
      - When dividing, {{b}} tens cancel out.
    explanation: "{{a}} − {{b}} = {{a - b}}."
    variants:
      params: { a: "int[5,9]", b: "int[1,4]" }
      defaults: { a: 7, b: 3 }

  - kind: problem
    id: c1
    widget: match
    prompt: What belongs together?
    params:
      pairs:
        - left: $a^3 \cdot a^4$
          right: $a^7$
        - left: $(a^3)^4$
          right: $a^{12}$
        - left: "$a^6 : a^2$"
          right: $a^4$
        - left: $a^0$
          right: "1"
        - left: $a^3 \cdot b^3$
          right: $(ab)^3$
    hints:
      - Write the powers out as products.
    explanation: Multiplying adds, raising to a power multiplies, dividing subtracts the exponents.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Simplify and give the exponent: $\\frac{2^8 \\cdot 2^5}{(2^3)^3} = 2^?$"
    answer:
      value: 4
    hints:
      - On top 8 + 5, below 3 · 3.
    explanation: 13 − 9 = 4.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "If the **exponent** is the same, you can multiply the bases. Three twos and three fives make three tens: $2^3 \\cdot 5^3 = 10^3$. So it is always true that $a^n \\cdot b^n = (a \\cdot b)^n$."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Calculate cleverly: $2^5 \\cdot 5^5$"
    answer:
      value: 100000
    feedback:
      - when: numval(state.input) == 10000000000
        misconception: add-exponents
        text: "The bases are multiplied, the exponent stays: $10^5$, not $10^{10}$."
    hints:
      - Pair up the 2s and 5s.
      - $(2 \cdot 5)^5 = 10^5$.
    explanation: $10^5 = 100,000$.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Write as a power of 2: $4^{ {{n}} } = 2^{?}$"
    answer:
      value: "{{2 * n}}"
    feedback:
      - when: numval(state.input) == n + 2 && n != 2
        misconception: add-instead
        text: "Power of a power: multiply exponents, do not add."
    hints:
      - $4 = 2^2$.
      - $(2^2)^{ {{n}} }$ – multiply the exponents.
    explanation: $(2^2)^{ {{n}} } = 2^{ {{2 * n}} }$.
    difficulty: 2
    variants:
      params:
        n: int[2,9]
      defaults:
        n: 3

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What is $2^3 + 2^3$?
    params:
      options:
        - label: $2^4$
          correct: true
        - label: $2^6$
          feedback: Adding exponents only works when **multiplying**.
        - label: $4^3$
          feedback: That would be 64. Here it is 8 + 8 = 16.
    hints:
      - "Work it out: 8 + 8."
    explanation: Twice the same is $2 \cdot 2^3 = 2^4$. There is no rule for sums of powers.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Watch the brackets: work out $2^{(3^2)}$."
    answer:
      value: 512
    feedback:
      - when: numval(state.input) == 64
        misconception: wrong-grouping
        text: That is $(2^3)^2$. Here the whole exponent $3^2 = 9$ is on top.
    hints:
      - "First the exponent: $3^2 = 9$."
      - $2^9 = ?$
    explanation: $2^9 = 512$, but $(2^3)^2 = 2^6 = 64$. Power towers are evaluated from the top down.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Why is $a^0 = 1$? Divide $a^3$ by $a^3$. That gives 1. But by the **rule** it is $a^{3-3} = a^0$. For both to agree, $a^0$ must be 1.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: "Which is larger: $2^{30}$ or $3^{20}$?"
    params:
      options:
        - label: "Write both with exponent 10: $8^{10}$ and $9^{10}$."
          feedback: "Schreibe beide mit dem Exponenten 10: $8^{10}$ und $9^{10}$."
        - label: $3^{20}$
          correct: true
        - label: $8^{10}$ and $9^{10}$ differ.
          feedback: $8^{10}$ und $9^{10}$ sind verschieden.
    hints:
      - $2^{30} = (2^3)^{10}$ and $3^{20} = (3^2)^{10}$.
      - Compare $8^{10}$ with $9^{10}$.
    explanation: $9^{10} > 8^{10}$, so $3^{20}$ is larger – without a single big calculation.
    difficulty: 3

srs:
  cards_from: [mal, hoch]
