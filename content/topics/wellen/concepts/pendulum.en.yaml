id: sci.waves.pendulum
type: concept
title: "Oscillations"
summary: "Back and forth in a steady beat – the pendulum as the original wave."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: c1
    widget: estimate
    prompt: "Take a guess: how long must a pendulum be to take exactly 2 seconds for one swing back and forth (in cm)?"
    params:
      min: 10
      max: 400
      unit: cm
    answer:
      value: 100
      tolerance: 20
    explanation: Almost exactly 1 metre. The metre was nearly defined that way.

  - kind: explain
    id: c2
    body: "An **oscillation** repeats in a steady beat. The **period** T is the time for one swing back and forth. The **frequency** is its reciprocal: swings per second."

  - kind: problem
    id: c3
    widget: sim
    prompt: Set the pendulum so that one swing takes 2 seconds.
    params:
      scene: pendulum
    answer:
      period:
        - 1.95
        - 2.05
    explanation: "At a length of 1 m. The formula: $T = 2\\pi\\sqrt{L/g}$."

  - kind: problem
    id: c4
    widget: choice
    prompt: You make the bob five times as heavy. What happens to the period?
    params:
      options:
        - label: Nothing – it stays the same
          correct: true
        - label: It gets longer
          feedback: "Try it in the lab: the mass changes nothing."
        - label: It gets shorter
          feedback: Heavy and light bodies fall equally fast – on a pendulum too.
    hints:
      - "Think of free fall: does heavy fall faster?"
    explanation: The mass cancels out. Galileo is said to have noticed this on a chandelier in Pisa cathedral.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: The period should double from 2 s to **4 s**. What length do you need?
    params:
      scene: pendulum
      controls:
        length:
          value: 1
    answer:
      period:
        - 3.95
        - 4.05
    explanation: Four times the length for double the period – because of the square root in the formula.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A pendulum swings 30 times in a minute. What is its frequency in hertz?
    params:
      unit: Hz
    answer:
      value: 0.5
    hints:
      - Swings per **second**.
    explanation: 30 ÷ 60 = 0.5 Hz. The period is 2 s.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A pendulum should take {{k}} times as long per swing. How many times as long must it be?
    answer:
      value: "{{k * k}}"
    feedback:
      - when: numval(state.input) == k
        misconception: root-ignored
        text: The length sits under a square root. For {{k}} times the period you need more than {{k}} times the length.
    hints:
      - T grows with the square root of the length.
      - To multiply the root by {{k}}, the number under it must grow by {{k}}².
    explanation: √({{k * k}}) = {{k}}. So it takes {{k * k}} times the length.
    difficulty: 2
    variants:
      params:
        k: choice[2,3,4]
      defaults:
        k: 3

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: the Foucault pendulum in the Paris Panthéon takes 16.4 s per swing. How long is its wire – in metres?"
    params:
      min: 1
      max: 200
    answer:
      value: 67
      tolerance: 12
    explanation: L = g · (T ÷ 2π)² ≈ 9.8 · 6.8 ≈ 67 m. In 1851 Foucault used it to show that the plane of swing slowly turns – because Earth rotates beneath it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: On the Moon g = 1.6 m/s². Set the gravity and find the length for a period of about 5 seconds.
    params:
      scene: pendulum
      controls:
        g:
          fixed: false
          value: 9.8
          min: 1.6
          max: 9.8
          step: 0.1
        mass:
          fixed: true
    answer:
      g: 1.6
      period:
        - 4.85
        - 5.1
    explanation: "At a length of 1 m: T = 2π√(1/1.6) ≈ 5 s. The same pendulum swings 2.5 times as slowly on the Moon."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: A swing goes higher and higher if you push in the right rhythm. What is this called?
    params:
      options:
        - label: Resonance
          correct: true
        - label: Damping
          feedback: Damping slows the oscillation – here it is amplified.
        - label: Interference
          feedback: That is the superposition of two waves.
    hints:
      - The rhythm of the pushes matches the natural frequency.
    explanation: When the drive hits the **natural frequency**, the oscillation builds up. That is how glasses sing – and how bridges can collapse.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: For small swings gravity pulls the pendulum back with $F = -\frac{mg}{L} x$ – proportional to the displacement x. This gives a **harmonic oscillation** with $\omega = \sqrt{g/L}$, so $T = 2\pi\sqrt{L/g}$.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Does T = 2π√(L/g) still hold when the pendulum swings out 90°?
    params:
      options:
        - label: No – at large amplitudes a swing takes longer.
          correct: true
        - label: Yes, the period never depends on the amplitude.
          feedback: That only holds for small angles. At 90° T is about 18 % longer.
        - label: No – then it gets shorter.
          feedback: The restoring force grows more slowly than the displacement. That slows it down rather than speeding it up.
    hints:
      - The formula uses sin(α) ≈ α. Is that true at 90°?
      - At large angles gravity pulls back relatively less.
    explanation: The approximation sin α ≈ α only holds up to about 15°. At 90° the period is about 18 % longer. That is why pendulum clocks swing only a little.
    difficulty: 3

srs:
  cards_from: ["c4", "d2"]
