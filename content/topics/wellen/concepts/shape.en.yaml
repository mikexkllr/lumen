id: sci.waves.shape
type: concept
title: Loudness and pitch
summary: Tall wave loud, dense wave high.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Loud, soft, high, low
    body: "Every sound is a wave in the air. Drag both sliders and watch the **wave** change: sometimes it gets taller, sometimes tighter."
    visual:
      widget: slider
      interactive: true
      params:
        expr: a*sin(f*x)
        x:
          - 0
          - 6
        y:
          - -3
          - 3
        sliders:
          - id: a
            label: Amplitude
            min: 0.5
            max: 3
            step: 0.5
            initial: 1
          - id: f
            label: Frequency
            min: 1
            max: 5
            step: 1
            initial: 2

  - kind: problem
    id: lauter
    widget: slider
    prompt: A sound gets louder. Set the wave so that it matches the dashed one.
    params:
      expr: "a*sin(2*x)"
      x: [0, 6]
      y: [-3, 3]
      sliders: [{ id: a, label: Amplitude, min: 0.5, max: 3, step: 0.5, initial: 1 }]
      target: { expr: "2.5*sin(2*x)" }
    answer: { matchTarget: true }
    hints:
      - The dashed wave swings higher.
    explanation: The **amplitude** – the height of the wave – determines the loudness.

  - kind: problem
    id: hoeher
    widget: slider
    prompt: Now the pitch rises. Adjust the wave.
    params:
      expr: "1.5*sin(f*x)"
      x: [0, 6]
      y: [-3, 3]
      sliders: [{ id: f, label: Frequency, min: 1, max: 5, step: 1, initial: 1 }]
      target: { expr: "1.5*sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - The dashed wave swings back and forth more often.
    explanation: The **frequency** – how often the wave oscillates – determines the pitch.

  - kind: explain
    id: s3
    body: |
      **Amplitude** means loud or quiet. **Frequency** means high or low.
      You measure frequency in hertz – oscillations per second.

  - kind: problem
    id: kammerton
    widget: choice
    prompt: Concert pitch A is 440 Hz. A note one octave higher has …
    params:
      options:
        - { label: 880 Hz, correct: true }
        - { label: 450 Hz, feedback: "An octave is a big jump – the frequency doubles." }
        - { label: 220 Hz, feedback: "That is one octave lower." }
    hints:
      - One octave higher means double the frequency.
    explanation: An octave doubles the frequency.

  - kind: problem
    id: hoeren
    widget: buckets
    prompt: Can humans hear this? We hear about 20 to 20,000 Hz.
    params:
      buckets: [{ label: audible }, { label: inaudible }]
      items:
        - { label: "440 Hz", bucket: audible }
        - { label: "50 Hz", bucket: audible }
        - { label: "15,000 Hz", bucket: audible }
        - { label: "40,000 Hz", bucket: inaudible }
        - { label: "5 Hz", bucket: inaudible }
    hints:
      - Compare with 20 to 20,000.
    explanation: Below 20 Hz is infrasound, above 20,000 Hz is ultrasound. Bats use ultrasound.

  - kind: problem
    id: c1
    widget: sim
    prompt: Build a wave with a wavelength of 2 m that travels at 6 m/s.
    params:
      scene: wave
    answer:
      wavelength: 2
      speed: 6
    explanation: "At 3 Hz: speed = wavelength · frequency."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The highest piano key has 4186 Hz, the lowest 27.5 Hz. Roughly how many octaves (doublings) lie between them?
    answer:
      value: 7
      tolerance: 0.3
    hints:
      - 4186 ÷ 27.5 ≈ 152. How often must you double?
    explanation: 2⁷ = 128 and 2⁷·²⁵ ≈ 152 – just over seven octaves.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: slider
    prompt: "Noise cancelling: a second speaker adds a · sin(2x) to the wave sin(2x). Set a so that there is silence."
    params:
      expr: sin(2*x) + a*sin(2*x)
      x:
        - 0
        - 6
      y:
        - -3
        - 3
      sliders:
        - id: a
          label: Speaker 2
          min: -2
          max: 2
          step: 0.5
          initial: 1
      target:
        expr: "0"
    answer:
      matchTarget: true
    hints:
      - The second wave must put crest on trough.
      - Same size, opposite sign.
    explanation: "At a = −1 the waves cancel. That is how noise-cancelling headphones work: they measure the noise and play it back inverted."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "Two tuning forks sound together: 440 Hz and 444 Hz. How many times per second does the sound swell and fade?"
    params:
      unit: Hz
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 442
        misconception: mean-not-beat
        text: That is the pitch you hear. The question is about the throbbing.
    hints:
      - The waves go in step and then out of step.
      - How many times per second does the faster one lap the slower?
    explanation: "444 − 440 = 4 beats per second. Musicians tune this way: they adjust until the throbbing disappears."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Two equal waves meet exactly **out of phase**: crest on trough. What happens?"
    params:
      options:
        - label: They cancel out
          correct: true
        - label: The wave becomes twice as tall
          feedback: That happens when crest meets crest.
        - label: Nothing – waves do not disturb each other
          feedback: "They superpose: the displacements add."
    hints:
      - Add +1 and −1.
    explanation: "**Destructive interference**. Noise-cancelling headphones generate exactly this anti-sound."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Every sound is a sum of sine waves: a fundamental plus **overtones** at double, triple, quadruple the frequency. Their mix is what separates a violin from a flute."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A guitar string is 65 cm long. Waves travel along it at 143 m/s. For the fundamental, half a wavelength fits on the string. What is its frequency?
    params:
      unit: Hz
    answer:
      value: 110
    feedback:
      - when: numval(state.input) == 220
        misconception: half-wave
        text: The wavelength is **twice** the string length, not equal to it.
    hints:
      - Wavelength = 2 · 0.65 m = 1.3 m.
      - f = speed ÷ wavelength.
    explanation: 143 ÷ 1.3 = 110 Hz – the low A. Pressing the string at its middle halves the length, and the note jumps an octave higher.
    difficulty: 3

srs:
  cards_from: [kammerton, hoeren]
