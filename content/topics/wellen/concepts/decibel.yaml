id: sci.waves.decibel
type: concept
title: Dezibel
summary: Zehn mehr heißt zehnmal so viel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: zehn
    widget: choice
    prompt: Ein Geräusch wird um 10 dB lauter. Was bedeutet das für die Schallenergie?
    params:
      options:
        - { label: Sie ist zehnmal so groß., correct: true }
        - { label: Sie ist 10 % größer., feedback: "Dezibel sind keine Prozente. Jede 10 dB multiplizieren mit 10." }
        - { label: Sie ist doppelt so groß., feedback: "Das wären etwa 3 dB." }
    hints:
      - Dezibel ist eine logarithmische Skala.
    explanation: Plus 10 dB heißt zehnmal so viel Energie. Unser Ohr empfindet das als etwa doppelt so laut.

  - kind: explain
    id: s2
    body: |
      Die **Dezibel-Skala** zählt Zehnerpotenzen. 20 dB mehr heißt hundertmal so viel Energie, 30 dB tausendmal.
      So passen leises Flüstern und ein Düsenjet auf eine Skala.

  - kind: problem
    id: faktor
    widget: numeric
    prompt: Ein Geräusch ist {{d}} dB lauter als ein anderes. Wie viel Mal so viel Schallenergie hat es?
    params: { placeholder: "-mal" }
    answer: { value: "{{10 ** (d / 10)}}" }
    feedback:
      - when: "numval(state.input) == d"
        misconception: linear
        text: Jede 10 dB bedeuten einen Faktor 10. Bei {{d}} dB also {{d / 10}}-mal den Faktor 10.
    hints:
      - "{{d / 10}}-mal mit 10 malnehmen."
    explanation: "$10^{ {{d / 10}} } = {{10 ** (d / 10)}}$."
    variants:
      params: { d: "choice[20,30,40,60]" }
      defaults: { d: 20 }

  - kind: problem
    id: laut
    widget: match
    prompt: Ordne die Geräusche ihrer Lautstärke zu.
    params:
      pairs:
        - { left: Flüstern, right: 30 dB }
        - { left: Gespräch, right: 60 dB }
        - { left: Presslufthammer, right: 100 dB }
        - { left: Düsenjet beim Start, right: 130 dB }
    hints:
      - Ab etwa 85 dB kann längeres Hören dem Gehör schaden.
    explanation: Von 30 bis 130 dB ist die Energie hundert Milliarden Mal größer.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Presslufthammer hat 100 dB, ein Gespräch 60 dB. Wievielmal mehr Schallenergie liefert der Hammer?
    answer:
      value: 10000
    hints:
      - 40 dB Unterschied sind vier Zehnerschritte.
    explanation: 10⁴ = 10 000-mal.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Eine Maschine macht 80 dB. Eine zweite, gleich laute, läuft daneben. Um wie viel dB steigt der Pegel?
    params:
      unit: dB
    answer:
      value: 3
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 80
        misconception: add-decibels
        text: Dezibel addiert man nicht einfach. Doppelte Energie ergibt nur 3 dB mehr.
    hints:
      - Zwei Maschinen liefern doppelte Schallenergie.
      - 10 · log₁₀(2) ≈ ?
    explanation: 10 · log 2 ≈ 3 dB. Aus 80 dB werden 83 dB, nicht 160.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Ein Gerät macht 85 dB. Wie viele gleiche Geräte braucht man zusammen für 95 dB?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 2
        misconception: linear-db
        text: Zwei Geräte bringen nur 3 dB mehr. Für 10 dB braucht es zehnfache Energie.
    hints:
      - 10 dB mehr heißt wievielmal so viel Energie?
      - Jedes Gerät liefert gleich viel.
    explanation: 10 dB mehr heißt zehnfache Energie, also zehn Geräte. Unser Ohr empfindet das etwa als doppelt so laut.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du gehst doppelt so weit von einem Lautsprecher weg. Wie ändert sich der Pegel?
    params:
      options:
        - label: Er sinkt um etwa 6 dB
          correct: true
        - label: Er halbiert sich
          feedback: Dezibel sind logarithmisch – aus 80 dB werden nicht 40.
        - label: Er sinkt um 20 dB
          feedback: Das wäre bei zehnfachem Abstand so.
    hints:
      - Die Energie verteilt sich auf die vierfache Fläche. Ein Viertel sind zweimal −3 dB.
    explanation: Viertel der Energie = −6 dB. Das **Abstandsgesetz** gilt für jede Punktquelle.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Der **Schallpegel** ist $L = 10 \\cdot \\log_{10}(I / I_0)$ dB. Dabei ist $I_0 = 10^{-12}$ W/m² die Hörschwelle. 0 dB heißt also nicht Stille, sondern: gerade noch hörbar."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Ein Gespräch hat 60 dB. Welche Intensität in W/m² ist das? Gib den Exponenten an: 10 hoch …"
    answer:
      value: -6
    feedback:
      - when: numval(state.input) == 6
        misconception: forgot-reference
        text: Starte bei der Hörschwelle 10⁻¹² W/m². 60 dB sind 6 Zehnerstufen darüber.
      - when: numval(state.input) == 60
        misconception: db-as-exponent
        text: Dezibel sind keine Exponenten. Teile durch 10.
    hints:
      - 60 dB sind 10⁶-mal die Hörschwelle.
      - 10⁻¹² · 10⁶ = ?
    explanation: 10⁻¹² · 10⁶ = 10⁻⁶ W/m², ein Millionstel Watt pro m². Unser Ohr ist ein extrem empfindliches Messgerät.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum 20 dB mehr nicht »doppelt so laut«, sondern hundertmal so viel Schallenergie bedeutet.
    params:
      keywords:
        - - zehn
          - ten
          - potenz
          - power
          - log
        - - faktor
          - factor
          - mal
          - times
          - multipli
        - - energie
          - energy
          - intensität
          - intensity
          - leistung
      sample: Die Dezibel-Skala zählt Zehnerpotenzen. Jede 10 dB bedeuten den Faktor zehn bei der Energie. 20 dB sind also zehn mal zehn, das ist hundertmal so viel Intensität.
    difficulty: 3

srs:
  cards_from: [zehn, faktor]
