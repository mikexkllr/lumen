id: sci.waves.doppler
type: concept
title: Der Doppler-Effekt
summary: Warum die Sirene ihren Ton ändert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: sirene
    widget: choice
    prompt: Ein Krankenwagen fährt mit Sirene an dir vorbei. Was hörst du?
    params:
      options:
        - { label: "Erst einen höheren, dann einen tieferen Ton", correct: true }
        - { label: Immer denselben Ton, feedback: "Achte beim nächsten Mal auf den Moment des Vorbeifahrens." }
        - { label: "Erst tiefer, dann höher", feedback: "Andersherum – beim Näherkommen klingt es höher." }
    hints:
      - Beim Näherkommen werden die Wellen zusammengeschoben.
    explanation: Das ist der **Doppler-Effekt**.

  - kind: explain
    body: |
      Kommt eine Quelle näher, werden ihre Wellen **gestaucht** – der Ton wird höher. Entfernt sie sich, werden sie **gedehnt** – der Ton wird tiefer. Bei Licht verschiebt sich die Farbe.

  - kind: problem
    id: galaxien
    widget: choice
    prompt: Das Licht ferner Galaxien ist ins Rote verschoben. Was heißt das?
    params:
      options:
        - { label: Sie entfernen sich von uns., correct: true }
        - { label: Sie kommen auf uns zu., feedback: "Dann würde das Licht blauer." }
        - { label: Sie sind besonders heiß., feedback: "Es geht um Bewegung, nicht Temperatur." }
    hints:
      - Rot heißt längere Wellen.
    explanation: Gedehnte Wellen – die Galaxien fliegen weg. So entdeckte man, dass sich das Universum ausdehnt.

  - kind: problem
    id: nutzen
    widget: match
    prompt: Wo misst man mit dem Doppler-Effekt?
    params:
      pairs:
        - { left: Radarfalle, right: Tempo von Autos }
        - { left: Ultraschall beim Arzt, right: Blutfluss }
        - { left: Wetterradar, right: Wind in Wolken }
    hints:
      - Überall, wo sich etwas bewegt und Wellen zurückwirft.
    explanation: Aus der Frequenzänderung des Echos berechnet man das Tempo.

srs:
  cards_from: [sirene, galaxien]
