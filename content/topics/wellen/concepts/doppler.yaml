id: sci.waves.doppler
type: concept
title: Der Doppler-Effekt
summary: Warum die Sirene ihren Ton ändert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Musik im fahrenden Zug
    body: "Im Jahr 1845 machte ein Forscher einen schrägen Versuch mit Musikern und einer Lokomotive. Deck die Geschichte auf: Wie kam der **Doppler-Effekt** auf die Schiene?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 💡
            front: "1842: Die Idee"
            back: "Christian Doppler sagt voraus: Bewegt sich eine Quelle, kommen ihre Wellen anders bei dir an."
          - icon: 🚂
            front: "1845: Der Zug"
            back: In Holland fahren Trompeter auf einem Zug und blasen einen festen Ton.
          - icon: 👂
            front: Die Zuhörer
            back: Musiker mit feinem Gehör stehen am Gleis und schreiben auf, was sie hören.
          - icon: ✅
            front: Das Urteil
            back: Doppler hatte recht – und die Musiker hörten etwas, das du von jeder Sirene kennst.

  - kind: problem
    id: sirene
    widget: choice
    prompt: Ein Krankenwagen fährt mit Sirene an dir vorbei. Was hörst du?
    params:
      options:
        - { label: "Erst einen höheren, dann einen tieferen Ton", correct: true }
        - { label: Immer denselben Ton, feedback: "Achte beim nächsten Mal auf den Moment des Vorbeifahrens." }
        - { label: "Erst tiefer, dann höher", feedback: "Andersherum – beim Näherkommen klingt es höher." }
    hints:
      - Beim Näherkommen werden die Wellen zusammengeschoben.
    explanation: Das ist der **Doppler-Effekt**.

  - kind: explain
    id: s2
    body: |
      Kommt eine Quelle näher, werden ihre Wellen **gestaucht** – der Ton wird höher. Entfernt sie sich, werden sie **gedehnt** – der Ton wird tiefer. Bei Licht verschiebt sich die Farbe.

  - kind: problem
    id: galaxien
    widget: choice
    prompt: Das Licht ferner Galaxien ist ins Rote verschoben. Was heißt das?
    params:
      options:
        - { label: Sie entfernen sich von uns., correct: true }
        - { label: Sie kommen auf uns zu., feedback: "Dann würde das Licht blauer." }
        - { label: Sie sind besonders heiß., feedback: "Es geht um Bewegung, nicht Temperatur." }
    hints:
      - Rot heißt längere Wellen.
    explanation: Gedehnte Wellen – die Galaxien fliegen weg. So entdeckte man, dass sich das Universum ausdehnt.

  - kind: problem
    id: nutzen
    widget: match
    prompt: Wo misst man mit dem Doppler-Effekt?
    params:
      pairs:
        - { left: Radarfalle, right: Tempo von Autos }
        - { left: Ultraschall beim Arzt, right: Blutfluss }
        - { left: Wetterradar, right: Wind in Wolken }
    hints:
      - Überall, wo sich etwas bewegt und Wellen zurückwirft.
    explanation: Aus der Frequenzänderung des Echos berechnet man das Tempo.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Wird der Ton höher oder tiefer?
    params:
      buckets:
        - id: b1
          label: Höher
        - id: b2
          label: Tiefer
      items:
        - label: Der Krankenwagen kommt näher
          bucket: b1
        - label: Der Krankenwagen fährt weg
          bucket: b2
        - label: Du fährst auf die Hupe zu
          bucket: b1
        - label: Der Zug entfernt sich
          bucket: b2
    hints:
      - Näherkommen staucht die Wellen.
    explanation: Es zählt nur, ob der Abstand schrumpft oder wächst.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Flugzeug fliegt schneller als der Schall. Was hört jemand am Boden?
    params:
      options:
        - label: Erst nichts, dann einen Knall, wenn die Schallfront vorbeizieht
          correct: true
        - label: Einen immer höheren Ton
          feedback: Das Flugzeug überholt seinen eigenen Schall.
        - label: Gar nichts
          feedback: Die aufgestauten Wellen kommen als Schockfront an.
    hints:
      - Die Wellen können dem Flugzeug nicht vorauslaufen – sie stauen sich.
    explanation: "Der **Überschallknall**: Alle Wellenfronten überlagern sich in einem Kegel."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Eine Sirene mit 700 Hz kommt mit 34 m/s auf dich zu. Schall läuft mit 340 m/s. Du hörst f = 700 · 340 : (340 − 34). Welche Frequenz ist das? Auf ganze Hertz."
    params:
      unit: Hz
    answer:
      value: 778
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 770) < 1
        misconception: approx
        text: "Fast: 10 % mehr ist nur eine Näherung. Rechne genau mit 340 : 306."
    hints:
      - "Die Wellen werden gestaucht: Teile durch (340 − 34)."
      - "700 · 340 : 306 = ?"
    explanation: "700 · 340 : 306 ≈ 778 Hz. Fährt sie weg, teilt man durch 374 und hört 636 Hz. Der Sprung beim Vorbeifahren ist also über 140 Hz."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Eine Galaxie entfernt sich mit 3000 km/s. Um wie viel Prozent ist ihr Licht zu längeren Wellen verschoben? (Lichtgeschwindigkeit 300 000 km/s)
    params:
      unit: "%"
    answer:
      value: 1
    hints:
      - "Verschiebung ≈ v : c."
    explanation: 1 %. Aus solchen **Rotverschiebungen** schloss Hubble, dass sich das Universum ausdehnt.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Eine Radarfalle sendet 24 GHz. Am Auto (30 m/s) reflektiert, kommt die Welle mit Δf = 2 · v · f : c verschoben zurück, c = 3 · 10⁸ m/s. Wie viele Hertz ist Δf?"
    params:
      unit: Hz
    answer:
      value: 4800
    feedback:
      - when: numval(state.input) == 2400
        misconception: forgot-two
        text: "Der Faktor 2 fehlt: Das Auto empfängt eine verschobene Welle und sendet sie verschoben zurück."
    hints:
      - 2 · 30 · 24 · 10⁹ = 1,44 · 10¹².
      - Durch 3 · 10⁸ teilen.
    explanation: "1,44 · 10¹² : 3 · 10⁸ = 4800 Hz. Winzig gegen 24 GHz – aber gut messbar. Die Doppelung kommt vom Hin- und Rückweg."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Ein Jet fliegt mit doppelter Schallgeschwindigkeit. Für den halben Öffnungswinkel θ seines Machkegels gilt sin θ = 1 : 2. Wie groß ist θ in Grad?"
    params:
      unit: °
    answer:
      value: 30
    hints:
      - Bei welchem Winkel ist der Sinus genau 0,5?
      - Denk an das halbe gleichseitige Dreieck.
    explanation: sin 30° = 0,5. Je schneller der Jet, desto spitzer der Kegel. Wo der Kegel den Boden streift, hört man den Überschallknall.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum eine vorbeifahrende Sirene erst höher und dann tiefer klingt.
    params:
      keywords:
        - - welle
          - wave
          - wellenberg
          - crest
        - - gestaucht
          - squeez
          - compress
          - dichter
          - closer
          - kürzer
          - shorter
        - - gedehnt
          - stretch
          - länger
          - longer
          - weg
          - away
      sample: Die Sirene sendet Wellen im festen Takt. Fährt sie auf mich zu, liegen die Wellenberge dichter, sie werden gestaucht – der Ton ist höher. Fährt sie weg, werden sie gedehnt und der Ton klingt tiefer.
    difficulty: 3

srs:
  cards_from: [sirene, galaxien]
