id: sci.waves.shape
type: concept
title: Lautstärke und Tonhöhe
summary: Hohe Welle laut, dichte Welle hoch.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: lauter
    widget: slider
    prompt: Ein Ton wird lauter. Stelle die Welle so ein, dass sie zur gestrichelten passt.
    params:
      expr: "a*sin(2*x)"
      x: [0, 6]
      y: [-3, 3]
      sliders: [{ id: a, label: Amplitude, min: 0.5, max: 3, step: 0.5, initial: 1 }]
      target: { expr: "2.5*sin(2*x)" }
    answer: { matchTarget: true }
    hints:
      - Die gestrichelte Welle schwingt höher aus.
    explanation: Die **Amplitude** – die Höhe der Welle – bestimmt die Lautstärke.

  - kind: problem
    id: hoeher
    widget: slider
    prompt: Jetzt wird der Ton höher. Passe die Welle an.
    params:
      expr: "1.5*sin(f*x)"
      x: [0, 6]
      y: [-3, 3]
      sliders: [{ id: f, label: Frequenz, min: 1, max: 5, step: 1, initial: 1 }]
      target: { expr: "1.5*sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - Die gestrichelte Welle schwingt öfter hin und her.
    explanation: Die **Frequenz** – wie oft die Welle schwingt – bestimmt die Tonhöhe.

  - kind: explain
    id: s3
    body: |
      **Amplitude** heißt laut oder leise. **Frequenz** heißt hoch oder tief.
      Frequenz misst man in Hertz – Schwingungen pro Sekunde.

  - kind: problem
    id: kammerton
    widget: choice
    prompt: Der Kammerton a hat 440 Hz. Ein Ton eine Oktave höher hat …
    params:
      options:
        - { label: 880 Hz, correct: true }
        - { label: 450 Hz, feedback: "Eine Oktave ist ein großer Sprung – die Frequenz verdoppelt sich." }
        - { label: 220 Hz, feedback: "Das ist eine Oktave tiefer." }
    hints:
      - Eine Oktave höher heißt doppelte Frequenz.
    explanation: Eine Oktave verdoppelt die Frequenz.

  - kind: problem
    id: hoeren
    widget: buckets
    prompt: Können Menschen das hören? Wir hören etwa 20 bis 20 000 Hz.
    params:
      buckets: [{ label: hörbar }, { label: nicht hörbar }]
      items:
        - { label: "440 Hz", bucket: hörbar }
        - { label: "50 Hz", bucket: hörbar }
        - { label: "15 000 Hz", bucket: hörbar }
        - { label: "40 000 Hz", bucket: nicht hörbar }
        - { label: "5 Hz", bucket: nicht hörbar }
    hints:
      - Vergleiche mit 20 bis 20 000.
    explanation: Unter 20 Hz ist Infraschall, über 20 000 Hz Ultraschall. Fledermäuse nutzen Ultraschall.

  - kind: problem
    id: c1
    widget: sim
    prompt: Bau eine Welle mit 2 m Wellenlänge, die sich mit 6 m/s ausbreitet.
    params:
      scene: wave
    answer:
      wavelength: 2
      speed: 6
    explanation: "Bei 3 Hz: Tempo = Wellenlänge · Frequenz."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die höchste Klaviertaste hat 4186 Hz, die tiefste 27,5 Hz. Wie viele Oktaven (Verdopplungen) liegen ungefähr dazwischen?
    answer:
      value: 7
      tolerance: 0.3
    hints:
      - "4186 : 27,5 ≈ 152. Wie oft musst du verdoppeln?"
    explanation: 2⁷ = 128 und 2⁷·²⁵ ≈ 152 – gut sieben Oktaven.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: slider
    prompt: "Antischall: Ein zweiter Lautsprecher spielt a · sin(2x) zur Welle sin(2x) dazu. Stelle a so ein, dass Stille entsteht."
    params:
      expr: sin(2*x) + a*sin(2*x)
      x:
        - 0
        - 6
      y:
        - -3
        - 3
      sliders:
        - id: a
          label: Lautsprecher 2
          min: -2
          max: 2
          step: 0.5
          initial: 1
      target:
        expr: "0"
    answer:
      matchTarget: true
    hints:
      - Die zweite Welle muss Berg auf Tal legen.
      - Gleich groß, aber umgekehrtes Vorzeichen.
    explanation: "Bei a = −1 löschen sich die Wellen aus. So arbeiten Kopfhörer mit Geräuschunterdrückung: Sie messen den Lärm und spielen ihn umgekehrt ab."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "Zwei Stimmgabeln klingen zusammen: 440 Hz und 444 Hz. Wie oft pro Sekunde schwillt der Ton an und wieder ab?"
    params:
      unit: Hz
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 442
        misconception: mean-not-beat
        text: Das ist die Tonhöhe, die du hörst. Gefragt ist das Wummern.
    hints:
      - Die Wellen laufen mal im Takt, mal gegeneinander.
      - Wie oft pro Sekunde holt die schnellere die langsamere ein?
    explanation: "444 − 440 = 4 Schwebungen pro Sekunde. Musiker stimmen so: Sie drehen, bis das Wummern verschwindet."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Zwei gleiche Wellen treffen genau **gegenphasig** aufeinander: Berg auf Tal. Was passiert?"
    params:
      options:
        - label: Sie löschen sich aus
          correct: true
        - label: Die Welle wird doppelt so hoch
          feedback: Das passiert, wenn Berg auf Berg trifft.
        - label: Nichts – Wellen stören sich nicht
          feedback: "Sie überlagern sich: Die Auslenkungen addieren sich."
    hints:
      - Addiere +1 und −1.
    explanation: "**Destruktive Interferenz**. Kopfhörer mit Geräuschunterdrückung erzeugen genau diesen Gegenschall."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Jeder Klang ist eine Summe von Sinuswellen: ein Grundton plus **Obertöne** mit doppelter, dreifacher, vierfacher Frequenz. Ihr Mischungsverhältnis macht den Unterschied zwischen Geige und Flöte."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Eine Gitarrensaite ist 65 cm lang. Wellen laufen auf ihr mit 143 m/s. Beim Grundton passt eine halbe Welle auf die Saite. Welche Frequenz hat er?
    params:
      unit: Hz
    answer:
      value: 110
    feedback:
      - when: numval(state.input) == 220
        misconception: half-wave
        text: Die Wellenlänge ist **doppelt** so lang wie die Saite, nicht gleich lang.
    hints:
      - Wellenlänge = 2 · 0,65 m = 1,3 m.
      - "f = Tempo : Wellenlänge."
    explanation: "143 : 1,3 = 110 Hz – das tiefe A. Greifst du die Saite in der Mitte, halbiert sich die Länge, und der Ton springt eine Oktave höher."
    difficulty: 3

srs:
  cards_from: [kammerton, hoeren]
