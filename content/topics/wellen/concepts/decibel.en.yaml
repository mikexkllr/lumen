id: sci.waves.decibel
type: concept
title: Decibels
summary: Ten more means ten times as much.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: zehn
    widget: choice
    prompt: A sound gets 10 dB louder. What does that mean for the sound energy?
    params:
      options:
        - { label: It is ten times as large., correct: true }
        - { label: It is 10% larger., feedback: "Decibels are not percentages. Every 10 dB multiplies by 10." }
        - { label: It is twice as large., feedback: "That would be about 3 dB." }
    hints:
      - Decibels are a logarithmic scale.
    explanation: Plus 10 dB means ten times the energy. Our ear perceives that as about twice as loud.

  - kind: explain
    id: s2
    body: |
      The **decibel scale** counts powers of ten. 20 dB more means a hundred times the energy, 30 dB a thousand times.
      That way, a quiet whisper and a jet fit on one scale.

  - kind: problem
    id: faktor
    widget: numeric
    prompt: A sound is {{d}} dB louder than another. How many times as much sound energy does it have?
    params: { placeholder: "times" }
    answer: { value: "{{10 ** (d / 10)}}" }
    feedback:
      - when: "numval(state.input) == d"
        misconception: linear
        text: Every 10 dB is a factor of 10. So at {{d}} dB, multiply by 10 a total of {{d / 10}} times.
    hints:
      - "Multiply by 10 a total of {{d / 10}} times."
    explanation: "$10^{ {{d / 10}} } = {{10 ** (d / 10)}}$."
    variants:
      params: { d: "choice[20,30,40,60]" }
      defaults: { d: 20 }

  - kind: problem
    id: laut
    widget: match
    prompt: Match each sound to its loudness.
    params:
      pairs:
        - { left: Whisper, right: 30 dB }
        - { left: Conversation, right: 60 dB }
        - { left: Jackhammer, right: 100 dB }
        - { left: Jet at takeoff, right: 130 dB }
    hints:
      - From about 85 dB, long exposure can damage your hearing.
    explanation: From 30 to 130 dB, the energy is a hundred billion times larger.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A jackhammer has 100 dB, a conversation 60 dB. How many times more sound energy does the hammer deliver?
    answer:
      value: 10000
    hints:
      - A 40 dB difference is four steps of ten.
    explanation: 10⁴ = 10,000 times.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A machine makes 80 dB. A second, equally loud one runs next to it. By how many dB does the level rise?
    params:
      unit: dB
    answer:
      value: 3
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 80
        misconception: add-decibels
        text: Decibels do not simply add. Double the energy gives only 3 dB more.
    hints:
      - Two machines deliver double the sound energy.
      - 10 · log₁₀(2) ≈ ?
    explanation: 10 · log 2 ≈ 3 dB. 80 dB becomes 83 dB, not 160.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: A device makes 85 dB. How many identical devices together make 95 dB?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 2
        misconception: linear-db
        text: Two devices add only 3 dB. 10 dB needs ten times the energy.
    hints:
      - 10 dB more means how many times the energy?
      - Each device delivers the same amount.
    explanation: 10 dB more means ten times the energy, so ten devices. Our ears perceive that as roughly twice as loud.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You move twice as far from a loudspeaker. How does the level change?
    params:
      options:
        - label: It drops by about 6 dB
          correct: true
        - label: It halves
          feedback: Decibels are logarithmic – 80 dB does not become 40.
        - label: It drops by 20 dB
          feedback: That would be for ten times the distance.
    hints:
      - The energy spreads over four times the area. A quarter is twice −3 dB.
    explanation: A quarter of the energy = −6 dB. The **inverse-square law** holds for every point source.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "The **sound level** is $L = 10 \\cdot \\log_{10}(I / I_0)$ dB. Here $I_0 = 10^{-12}$ W/m² is the threshold of hearing. So 0 dB does not mean silence but: just audible."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "A conversation is 60 dB. What intensity in W/m² is that? Give the exponent: 10 to the …"
    answer:
      value: -6
    feedback:
      - when: numval(state.input) == 6
        misconception: forgot-reference
        text: Start at the threshold of 10⁻¹² W/m². 60 dB is 6 powers of ten above it.
      - when: numval(state.input) == 60
        misconception: db-as-exponent
        text: Decibels are not exponents. Divide by 10.
    hints:
      - 60 dB is 10⁶ times the threshold.
      - 10⁻¹² · 10⁶ = ?
    explanation: 10⁻¹² · 10⁶ = 10⁻⁶ W/m², a millionth of a watt per m². Our ear is an extremely sensitive instrument.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why 20 dB more does not mean »twice as loud« but a hundred times the sound energy.
    params:
      keywords:
        - - zehn
          - ten
          - potenz
          - power
          - log
        - - faktor
          - factor
          - mal
          - times
          - multipli
        - - energie
          - energy
          - intensität
          - intensity
          - leistung
      sample: The decibel scale counts powers of ten. Every 10 dB means a factor of ten in energy. So 20 dB is ten times ten, a hundred times the intensity.
    difficulty: 3

srs:
  cards_from: [zehn, faktor]
