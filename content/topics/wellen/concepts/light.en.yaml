id: sci.waves.light
type: concept
title: Colors are waves
summary: Wavelength and color.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Which colour is on the very outside of a rainbow?
    params:
      options:
        - label: Red
          correct: true
        - label: Violet
          feedback: That is on the very inside.
        - label: Green
          feedback: That is in the middle.
    hints:
      - The colours always come in the same order.
    explanation: "The order has a reason: each colour is a different wave."

  - kind: explain
    id: s1
    body: |
      Light is a wave too. The **wavelength** determines the color – red has long waves, violet short ones.

  - kind: problem
    id: blau
    widget: slider
    prompt: The wave is red. Turn it into blue light – match it to the dashed one.
    params:
      expr: "sin(f*x)"
      x: [0, 6]
      y: [-2, 2]
      sliders: [{ id: f, label: Frequency, min: 1, max: 6, step: 1, initial: 2 }]
      target: { expr: "sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - Blue has shorter waves – so more oscillations.
    explanation: Shorter wavelength, higher frequency – the light turns bluer.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Sort the colors from long to short wavelength.
    params:
      items:
        - { label: Red }
        - { label: Yellow }
        - { label: Green }
        - { label: Blue }
        - { label: Violet }
    hints:
      - Like in a rainbow – red on the outside.
    explanation: Red is about 700 nm, violet about 400 nm.

  - kind: problem
    id: himmel
    widget: choice
    prompt: Why is the sky blue?
    params:
      options:
        - { label: Blue light is scattered more strongly in the air., correct: true }
        - { label: It reflects the sea., feedback: "The sky is blue over the desert too." }
    hints:
      - Short waves bounce off air particles more easily.
    explanation: Short-wave light is scattered much more strongly and reaches us from everywhere in the sky.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Red light has a wavelength of 700 nm, violet 400 nm. Which has the higher frequency – and by what factor? Give the factor.
    answer:
      value: 1.75
    hints:
      - Frequency = speed ÷ wavelength. Short wave, high frequency.
    explanation: 700 ÷ 400 = 1.75. Violet oscillates faster and carries more energy per particle of light.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Light always has the same speed in a vacuum. Here the speed is 4 m/s. Halve the wavelength to 2 m and keep the speed.
    params:
      scene: wave
    answer:
      wavelength: 2
      speed: 4
    explanation: The frequency doubles. Blue light has shorter waves and oscillates faster than red.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Green light has a wavelength of 500 nm and travels at 3 · 10⁸ m/s. What is its frequency – in 10¹⁴ Hz?
    answer:
      value: 6
    hints:
      - f = c ÷ λ, with λ = 5 · 10⁻⁷ m.
      - 3 · 10⁸ ÷ 5 · 10⁻⁷ = 0.6 · 10¹⁵.
    explanation: 6 · 10¹⁴ Hz – 600 trillion oscillations per second. No instrument can count that fast, so wavelength is measured instead.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many waves of green light (500 nm) fit into one millimetre?"
    params:
      min: 10
      max: 100000
      scale: log
    answer:
      value: 2000
      within: 30
    explanation: 1 mm ÷ 500 nm = 2000. That is why you cannot see light waves – but thin layers a few wavelengths thick create colours.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is the sunset red when the sky is blue?
    params:
      options:
        - label: In the evening light passes through much more air – the blue is scattered out, red remains
          correct: true
        - label: The Sun gets cooler in the evening
          feedback: The Sun does not change – only the path of its light.
        - label: Red light is scattered more in the evening
          feedback: Blue is always scattered more. That is exactly why it is missing in the direct light.
    hints:
      - The same effect that makes the sky blue removes blue from the direct beam.
    explanation: "**Rayleigh scattering** grows with 1/λ⁴: blue is scattered about five times more than red."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Why do soap bubbles and oil films shimmer in colour?
    params:
      options:
        - label: Light reflects off the front and back of the thin film and the two overlap.
          correct: true
        - label: The soap contains dye.
          feedback: Clear soapy water has no colour. Only the thin film makes it.
        - label: The film bends the light like a prism.
          feedback: A prism needs thick glass. Here the layer is only a few wavelengths thick.
    hints:
      - The film is as thin as a few light waves.
      - Two partial waves – sometimes crest on crest, sometimes crest on trough.
    explanation: Depending on thickness one colour is reinforced and another cancelled. That is interference. Where the film gets thicker or thinner, the colour changes.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Some sunglasses block the bright glare on a lake. The rest they leave almost bright. How does that work?
    params:
      options:
        - label: Light is a transverse wave – reflected light vibrates mostly horizontally.
          correct: true
        - label: Reflections are brighter than normal light.
          feedback: Tinted glass would dim everything. These glasses sort by direction of vibration.
        - label: Reflected light is redder.
          feedback: The colour hardly changes. It is about the direction of vibration.
    hints:
      - Sound vibrates along its direction, light across it.
      - The glasses let only one direction of vibration through.
    explanation: Light reflected from water vibrates mostly horizontally. The glasses let only vertically vibrating light through. This would not work with sound – it is a longitudinal wave.
    difficulty: 3

srs:
  cards_from: [spektrum, himmel]
