id: sci.waves.doppler
type: concept
title: The Doppler effect
summary: Why a siren changes its pitch.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Music on a moving train
    body: "In 1845 a scientist ran an odd test with musicians and a steam train. Uncover the story: how did the **Doppler effect** get onto the rails?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 💡
            front: "1842: The idea"
            back: "Christian Doppler predicts: if a source moves, its waves reach you differently."
          - icon: 🚂
            front: "1845: The train"
            back: In the Netherlands, trumpeters ride on a train and play one steady note.
          - icon: 👂
            front: The listeners
            back: Musicians with a fine ear stand by the track and write down what they hear.
          - icon: ✅
            front: The verdict
            back: Doppler was right – and the musicians heard something you know from every siren.

  - kind: problem
    id: sirene
    widget: choice
    prompt: An ambulance with its siren on drives past you. What do you hear?
    params:
      options:
        - { label: "First a higher pitch, then a lower one", correct: true }
        - { label: Always the same pitch, feedback: "Next time, listen for the moment it passes." }
        - { label: "First lower, then higher", feedback: "The other way around – it sounds higher as it approaches." }
    hints:
      - As it approaches, the waves are pushed together.
    explanation: This is the **Doppler effect**.

  - kind: explain
    id: s2
    body: |
      When a source approaches, its waves are **compressed** – the pitch rises. When it moves away, they are **stretched** – the pitch drops. With light, the color shifts.

  - kind: problem
    id: galaxien
    widget: choice
    prompt: The light of distant galaxies is shifted toward red. What does that mean?
    params:
      options:
        - { label: They are moving away from us., correct: true }
        - { label: They are coming toward us., feedback: "Then the light would turn bluer." }
        - { label: They are especially hot., feedback: "It is about motion, not temperature." }
    hints:
      - Red means longer waves.
    explanation: Stretched waves – the galaxies are flying away. This is how we found out that the universe is expanding.

  - kind: problem
    id: nutzen
    widget: match
    prompt: Where is the Doppler effect used for measuring?
    params:
      pairs:
        - { left: Speed camera, right: Speed of cars }
        - { left: Ultrasound at the doctor, right: Blood flow }
        - { left: Weather radar, right: Wind in clouds }
    hints:
      - Anywhere something moves and reflects waves.
    explanation: From the frequency change of the echo, you calculate the speed.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does the pitch get higher or lower?
    params:
      buckets:
        - id: b1
          label: Higher
        - id: b2
          label: Lower
      items:
        - label: The ambulance comes closer
          bucket: b1
        - label: The ambulance drives away
          bucket: b2
        - label: You drive towards the horn
          bucket: b1
        - label: The train moves away
          bucket: b2
    hints:
      - Approaching squeezes the waves.
    explanation: All that counts is whether the distance shrinks or grows.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A plane flies faster than sound. What does someone on the ground hear?
    params:
      options:
        - label: First nothing, then a bang as the sound front passes
          correct: true
        - label: An ever higher tone
          feedback: The plane overtakes its own sound.
        - label: Nothing at all
          feedback: The piled-up waves arrive as a shock front.
    hints:
      - The waves cannot run ahead of the plane – they pile up.
    explanation: "The **sonic boom**: all wave fronts superpose in a cone."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A 700 Hz siren approaches you at 34 m/s. Sound travels at 340 m/s. You hear f = 700 · 340 ÷ (340 − 34). What frequency is that? To whole hertz.
    params:
      unit: Hz
    answer:
      value: 778
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 770) < 1
        misconception: approx
        text: "Close: 10 % more is just an approximation. Calculate exactly with 340 ÷ 306."
    hints:
      - "The waves get squeezed: divide by (340 − 34)."
      - 700 · 340 ÷ 306 = ?
    explanation: 700 · 340 ÷ 306 ≈ 778 Hz. Moving away, you divide by 374 and hear 636 Hz. The jump as it passes is over 140 Hz.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A galaxy recedes at 3000 km/s. By what percent is its light shifted to longer wavelengths? (Speed of light 300,000 km/s)
    params:
      unit: "%"
    answer:
      value: 1
    hints:
      - Shift ≈ v ÷ c.
    explanation: 1%. From such **redshifts** Hubble concluded that the universe is expanding.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A speed camera sends 24 GHz. Reflected by a car (30 m/s), the wave returns shifted by Δf = 2 · v · f ÷ c, with c = 3 · 10⁸ m/s. How many hertz is Δf?
    params:
      unit: Hz
    answer:
      value: 4800
    feedback:
      - when: numval(state.input) == 2400
        misconception: forgot-two
        text: "The factor 2 is missing: the car receives a shifted wave and sends it back shifted again."
    hints:
      - 2 · 30 · 24 · 10⁹ = 1.44 · 10¹².
      - Divide by 3 · 10⁸.
    explanation: 1.44 · 10¹² ÷ 3 · 10⁸ = 4800 Hz. Tiny compared with 24 GHz – but easy to measure. The doubling comes from the trip there and back.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A jet flies at twice the speed of sound. The half-angle θ of its Mach cone satisfies sin θ = 1 ÷ 2. How large is θ in degrees?
    params:
      unit: °
    answer:
      value: 30
    hints:
      - At what angle is the sine exactly 0.5?
      - Think of half an equilateral triangle.
    explanation: sin 30° = 0.5. The faster the jet, the narrower the cone. Where the cone sweeps the ground, people hear the sonic boom.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why a passing siren first sounds higher and then lower.
    params:
      keywords:
        - - welle
          - wave
          - wellenberg
          - crest
        - - gestaucht
          - squeez
          - compress
          - dichter
          - closer
          - kürzer
          - shorter
        - - gedehnt
          - stretch
          - länger
          - longer
          - weg
          - away
      sample: The siren sends waves at a fixed rate. Coming towards me, the crests are closer together, squeezed – the pitch is higher. Moving away they are stretched and the pitch sounds lower.
    difficulty: 3

srs:
  cards_from: [sirene, galaxien]
