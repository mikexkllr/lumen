id: sci.waves.pendulum
type: concept
title: "Schwingungen"
summary: "Hin und her im festen Takt – das Pendel als Ur-Welle."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 6
steps:
  - kind: problem
    id: c1
    widget: estimate
    prompt: "Schätz mal: Wie lang muss ein Pendel sein, damit es genau 2 Sekunden für einmal Hin und Her braucht (in cm)?"
    params:
      min: 10
      max: 400
      unit: cm
    answer:
      value: 100
      tolerance: 20
    explanation: Fast genau 1 Meter. Beinahe wäre der Meter so definiert worden.

  - kind: explain
    id: c2
    body: "Eine **Schwingung** wiederholt sich im festen Takt. Die **Periode** T ist die Zeit für einmal Hin und Her. Die **Frequenz** ist ihr Kehrwert: Schwingungen pro Sekunde."

  - kind: problem
    id: c3
    widget: sim
    prompt: Stell das Pendel so ein, dass eine Schwingung 2 Sekunden dauert.
    params:
      scene: pendulum
    answer:
      period:
        - 1.95
        - 2.05
    explanation: "Bei 1 m Länge. Die Formel: $T = 2\\pi\\sqrt{L/g}$."

  - kind: problem
    id: c4
    widget: choice
    prompt: Du machst das Pendelgewicht fünfmal so schwer. Was passiert mit der Periode?
    params:
      options:
        - label: Nichts – sie bleibt gleich
          correct: true
        - label: Sie wird länger
          feedback: "Probier es im Labor: Die Masse ändert nichts."
        - label: Sie wird kürzer
          feedback: Schwere und leichte Körper fallen gleich schnell – auch am Pendel.
    hints:
      - "Denk an den freien Fall: Fällt Schweres schneller?"
    explanation: Die Masse kürzt sich heraus. Galilei soll das an einem Kronleuchter im Dom von Pisa bemerkt haben.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Die Periode soll sich von 2 s auf **4 s** verdoppeln. Welche Länge brauchst du?
    params:
      scene: pendulum
      controls:
        length:
          value: 1
    answer:
      period:
        - 3.95
        - 4.05
    explanation: Vierfache Länge für doppelte Periode – wegen der Wurzel in der Formel.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Pendel schwingt 30-mal in einer Minute. Wie groß ist seine Frequenz in Hertz?
    params:
      unit: Hz
    answer:
      value: 0.5
    hints:
      - Schwingungen pro **Sekunde**.
    explanation: "30 : 60 = 0,5 Hz. Die Periode ist 2 s."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: Auf dem Mond ist g = 1,6 m/s². Stell die Schwerkraft ein und finde die Länge für eine Periode von etwa 5 Sekunden.
    params:
      scene: pendulum
      controls:
        g:
          fixed: false
          value: 9.8
          min: 1.6
          max: 9.8
          step: 0.1
        mass:
          fixed: true
    answer:
      g: 1.6
      period:
        - 4.85
        - 5.1
    explanation: "Bei 1 m Länge: T = 2π√(1/1,6) ≈ 5 s. Dasselbe Pendel schwingt auf dem Mond 2,5-mal so langsam."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Eine Schaukel schwingt immer höher, wenn du im richtigen Takt anschubst. Wie heißt das?
    params:
      options:
        - label: Resonanz
          correct: true
        - label: Dämpfung
          feedback: Dämpfung bremst die Schwingung – hier wird sie verstärkt.
        - label: Interferenz
          feedback: Das ist die Überlagerung zweier Wellen.
    hints:
      - Der Takt des Anschubsens trifft die Eigenfrequenz.
    explanation: Trifft der Antrieb die **Eigenfrequenz**, schaukelt sich die Schwingung auf. So singen Gläser – und so können Brücken einstürzen.
    difficulty: 3

srs:
  cards_from: ["c4", "d2"]
