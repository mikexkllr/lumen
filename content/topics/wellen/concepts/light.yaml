id: sci.waves.light
type: concept
title: Farben sind Wellen
summary: Wellenlänge und Farbe.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Auch Licht ist eine Welle. Die **Wellenlänge** bestimmt die Farbe – Rot hat lange Wellen, Violett kurze.

  - kind: problem
    id: blau
    widget: slider
    prompt: Die Welle ist rot. Mach daraus blaues Licht – passe sie an die gestrichelte an.
    params:
      expr: "sin(f*x)"
      x: [0, 6]
      y: [-2, 2]
      sliders: [{ id: f, label: Frequenz, min: 1, max: 6, step: 1, initial: 2 }]
      target: { expr: "sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - Blau hat kürzere Wellen – also mehr Schwingungen.
    explanation: Kürzere Wellenlänge, höhere Frequenz – das Licht wird blauer.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Ordne die Farben von langer zu kurzer Wellenlänge.
    params:
      items:
        - { label: Rot }
        - { label: Gelb }
        - { label: Grün }
        - { label: Blau }
        - { label: Violett }
    hints:
      - Wie im Regenbogen – außen Rot.
    explanation: Rot etwa 700 nm, Violett etwa 400 nm.

  - kind: problem
    id: himmel
    widget: choice
    prompt: Warum ist der Himmel blau?
    params:
      options:
        - { label: Blaues Licht wird in der Luft stärker gestreut., correct: true }
        - { label: Er spiegelt das Meer., feedback: "Auch über der Wüste ist der Himmel blau." }
    hints:
      - Kurze Wellen prallen leichter an Luftteilchen ab.
    explanation: Kurzwelliges Licht wird viel stärker gestreut und kommt von überall am Himmel.

srs:
  cards_from: [spektrum, himmel]
