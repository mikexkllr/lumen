id: sci.waves.light
type: concept
title: Farben sind Wellen
summary: Wellenlänge und Farbe.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Farben, die du nicht siehst
    body: "Dein Auge sieht nur einen schmalen Teil des Lichts. Andere Wesen sehen mehr. Deck die Karten auf: Wer sieht welche **Farben**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐝
            front: Biene
            back: Sie sieht ultraviolettes Licht. Viele Blüten tragen für sie ein Muster, das wir nicht sehen.
          - icon: 🦐
            front: Fangschreckenkrebs
            back: Er hat bis zu 16 Sorten Farbsensoren – du hast nur drei.
          - icon: 📱
            front: Handykamera
            back: Sie sieht das unsichtbare Infrarot einer Fernbedienung. Probier es aus!
          - icon: 🐍
            front: Klapperschlange
            back: Sie spürt die Wärmestrahlung ihrer Beute – sogar im Dunkeln.

  - kind: problem
    id: hook
    widget: choice
    prompt: Welche Farbe liegt im Regenbogen ganz außen?
    params:
      options:
        - label: Rot
          correct: true
        - label: Violett
          feedback: Das liegt ganz innen.
        - label: Grün
          feedback: Das liegt in der Mitte.
    hints:
      - Die Farben stehen immer in derselben Reihenfolge.
    explanation: "Die Reihenfolge hat einen Grund: Jede Farbe ist eine andere Welle."

  - kind: explain
    id: s1
    body: |
      Auch Licht ist eine Welle. Die **Wellenlänge** bestimmt die Farbe – Rot hat lange Wellen, Violett kurze.

  - kind: problem
    id: blau
    widget: slider
    prompt: Die Welle ist rot. Mach daraus blaues Licht – passe sie an die gestrichelte an.
    params:
      expr: "sin(f*x)"
      x: [0, 6]
      y: [-2, 2]
      sliders: [{ id: f, label: Frequenz, min: 1, max: 6, step: 1, initial: 2 }]
      target: { expr: "sin(4*x)" }
    answer: { matchTarget: true }
    hints:
      - Blau hat kürzere Wellen – also mehr Schwingungen.
    explanation: Kürzere Wellenlänge, höhere Frequenz – das Licht wird blauer.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Ordne die Farben von langer zu kurzer Wellenlänge.
    params:
      items:
        - { label: Rot }
        - { label: Gelb }
        - { label: Grün }
        - { label: Blau }
        - { label: Violett }
    hints:
      - Wie im Regenbogen – außen Rot.
    explanation: Rot etwa 700 nm, Violett etwa 400 nm.

  - kind: problem
    id: himmel
    widget: choice
    prompt: Warum ist der Himmel blau?
    params:
      options:
        - { label: Blaues Licht wird in der Luft stärker gestreut., correct: true }
        - { label: Er spiegelt das Meer., feedback: "Auch über der Wüste ist der Himmel blau." }
    hints:
      - Kurze Wellen prallen leichter an Luftteilchen ab.
    explanation: Kurzwelliges Licht wird viel stärker gestreut und kommt von überall am Himmel.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Rotes Licht hat 700 nm Wellenlänge, violettes 400 nm. Welches hat die höhere Frequenz – und wievielmal? Gib den Faktor an.
    answer:
      value: 1.75
    hints:
      - "Frequenz = Tempo : Wellenlänge. Kurze Welle, hohe Frequenz."
    explanation: "700 : 400 = 1,75. Violett schwingt schneller und trägt mehr Energie pro Lichtteilchen."
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Licht ist im Vakuum immer gleich schnell. Hier ist das Tempo 4 m/s. Halbiere die Wellenlänge auf 2 m und halte das Tempo.
    params:
      scene: wave
    answer:
      wavelength: 2
      speed: 4
    explanation: Die Frequenz verdoppelt sich. Blaues Licht hat kürzere Wellen und schwingt schneller als rotes.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Grünes Licht hat 500 nm Wellenlänge und läuft mit 3 · 10⁸ m/s. Wie groß ist seine Frequenz – in 10¹⁴ Hz?
    answer:
      value: 6
    hints:
      - "f = c : λ, mit λ = 5 · 10⁻⁷ m."
      - "3 · 10⁸ : 5 · 10⁻⁷ = 0,6 · 10¹⁵."
    explanation: 6 · 10¹⁴ Hz – 600 Billionen Schwingungen pro Sekunde. Kein Messgerät kann so schnell mitzählen. Man misst darum die Wellenlänge.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Wellen grünen Lichts (500 nm) passen auf einen Millimeter?"
    params:
      min: 10
      max: 100000
      scale: log
    answer:
      value: 2000
      within: 30
    explanation: "1 mm : 500 nm = 2000. Darum sieht man Lichtwellen nicht – aber dünne Schichten aus wenigen Wellenlängen erzeugen Farben."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist der Sonnenuntergang rot, wenn der Himmel doch blau ist?
    params:
      options:
        - label: Abends läuft das Licht durch viel mehr Luft – das Blau wird herausgestreut, Rot bleibt übrig
          correct: true
        - label: Die Sonne wird abends kühler
          feedback: Die Sonne ändert sich nicht – nur der Weg ihres Lichts.
        - label: Rotes Licht wird abends stärker gestreut
          feedback: Blau wird immer stärker gestreut. Genau darum fehlt es im direkten Licht.
    hints:
      - Derselbe Effekt, der den Himmel blau macht, nimmt dem direkten Strahl das Blau.
    explanation: "**Rayleigh-Streuung** wächst mit 1/λ⁴: Blau wird etwa fünfmal stärker gestreut als Rot."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Warum schillern Seifenblasen und Ölfilme bunt?
    params:
      options:
        - label: Licht wird an Vorder- und Rückseite der dünnen Haut reflektiert und überlagert sich.
          correct: true
        - label: Die Seife enthält Farbstoff.
          feedback: Klares Seifenwasser hat keine Farbe. Erst die dünne Haut macht sie.
        - label: Die Haut bricht das Licht wie ein Prisma.
          feedback: Ein Prisma braucht dickes Glas. Hier ist die Schicht nur wenige Wellenlängen dick.
    hints:
      - Die Haut ist so dünn wie ein paar Lichtwellen.
      - Zwei Teilwellen – mal Berg auf Berg, mal Berg auf Tal.
    explanation: Je nach Dicke verstärkt sich eine Farbe, eine andere löscht sich aus. Das ist **Interferenz**. Wo die Haut dicker oder dünner ist, wechselt die Farbe.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Manche Sonnenbrillen schlucken das grelle Glitzern auf einem See. Den Rest lassen sie fast hell. Wie geht das?
    params:
      options:
        - label: Licht ist eine Querwelle – gespiegeltes Licht schwingt vor allem waagerecht.
          correct: true
        - label: Spiegelungen sind heller als normales Licht.
          feedback: Ein dunkles Glas würde alles dämpfen. Diese Brille sortiert nach Schwingungsrichtung.
        - label: Gespiegeltes Licht ist röter.
          feedback: Die Farbe ändert sich kaum. Es geht um die Schwingungsrichtung.
    hints:
      - Schall schwingt in Laufrichtung, Licht quer dazu.
      - Die Brille lässt nur eine Schwingungsrichtung durch.
    explanation: Wird Licht an Wasser gespiegelt, schwingt es überwiegend waagerecht. Die Brille lässt nur senkrecht schwingendes Licht durch. Mit Schall ginge das nicht – er ist eine Längswelle.
    difficulty: 3

srs:
  cards_from: [spektrum, himmel]
