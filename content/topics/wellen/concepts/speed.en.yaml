id: sci.waves.speed
type: concept
title: How fast is sound?
summary: Lightning, thunder and wavelength.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how fast is sound in air – in km/h?"
    params:
      min: 100
      max: 5000
      unit: km/h
    answer:
      value: 1224
      tolerance: 250
    explanation: About 1200 km/h, i.e. 340 m/s. A jet can be faster – then there is a bang.

  - kind: problem
    id: gewitter
    widget: numeric
    body: Sound travels about 340 m per second. Light arrives practically instantly.
    prompt: "{{t}} seconds pass between lightning and thunder. How far away is the storm?"
    params: { unit: m }
    answer: { value: "{{340 * t}}", tolerance: 30 }
    feedback:
      - when: "numval(state.input) == 340 / t"
        misconception: divide
        text: Distance = speed · time. Multiply.
    hints:
      - "{{t}} · 340 m."
    explanation: "{{t}} · 340 m ≈ {{340 * t}} m. Rule of thumb – seconds divided by 3 gives kilometers."
    variants:
      params: { t: "int[2,12]" }
      defaults: { t: 3 }

  - kind: explain
    id: s2
    body: |
      For every **wave**: **speed = frequency · wavelength**.
      A low note has long waves, a high one has short waves.

  - kind: problem
    id: wellenlaenge
    widget: numeric
    prompt: A note has {{f}} Hz. How long is one wave at 340 m/s?
    params: { unit: m }
    answer: { value: "{{340 / f}}", tolerance: 0.01 }
    feedback:
      - when: "numval(state.input) == 340 * f"
        misconception: multiply
        text: "Wavelength = speed : frequency."
    hints:
      - "340 divided by {{f}}."
    explanation: "340 ÷ {{f}} = {{340 / f}} m."
    variants:
      params: { f: "choice[34,85,170,340,680]" }
      defaults: { f: 340 }

  - kind: problem
    id: medium
    widget: choice
    prompt: Where is sound fastest?
    params:
      options:
        - { label: In steel, correct: true }
        - { label: In air, feedback: "Air is the slowest of the three – about 340 m/s." }
        - { label: In space, feedback: "In a vacuum there is no sound at all – nothing can vibrate." }
    hints:
      - Sound needs particles that push on each other.
    explanation: In steel, it is around 5,000 m/s. That is why you hear a train earlier through the rails.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You shout at a cliff and hear the echo after 3 seconds. How far away is the cliff?
    params:
      unit: m
    answer:
      value: 510
      tolerance: 10
    feedback:
      - when: approx(numval(state.input), 1020, 20)
        misconception: round-trip
        text: That is the way there and back. The cliff is half as far.
    hints:
      - The sound travels there **and** back.
    explanation: 340 · 3 = 1020 m for both ways, so 510 m.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: A water wave travels at 3 m/s. Build it with a wavelength of 1.5 m.
    params:
      scene: wave
    answer:
      wavelength: 1.5
      speed: 3
    explanation: "At 2 Hz: 1.5 m · 2 Hz = 3 m/s."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A sonar sends a ping downwards. The echo from the seabed returns after 0.4 s. Sound travels at 1500 m/s in water. How deep is the sea here?
    params:
      unit: m
    answer:
      value: 300
    feedback:
      - when: numval(state.input) == 600
        misconception: echo-twice
        text: The sound travels there **and** back. Halve the distance.
    hints:
      - Distance = speed · time.
      - The way to the bottom is only half of that.
    explanation: 1500 · 0.4 = 600 m there and back, so 300 m deep. Bats and dolphins locate things the same way.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: A 500 Hz tone passes from air into water, where sound is four times as fast. What changes?
    params:
      options:
        - label: The wavelength becomes four times longer; the frequency stays.
          correct: true
        - label: The frequency becomes four times higher.
          feedback: The boundary vibrates at the same rate. The frequency cannot change.
        - label: Both stay the same.
          feedback: Then the speed would be the same too. We have c = f · λ.
    hints:
      - The water surface is pushed at the rate of the air wave.
      - "Same frequency, more speed: c = f · λ."
    explanation: The source sets the frequency. At four times the speed each wave is four times as long. Light entering glass behaves the same way.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Radio waves travel at 300,000 km/s. What wavelength in metres does a station at 100 MHz have?
    params:
      unit: m
    answer:
      value: 3
    hints:
      - 300,000,000 m/s divided by 100,000,000 Hz.
    explanation: 3 metres. That is why FM antennas are about 75 cm long – a quarter of the wavelength.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "The **speed of sound** in a gas grows with the square root of temperature: $c \\propto \\sqrt{T}$. Faster particles pass the push on more quickly. In light helium sound is almost three times as fast as in air."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: At 0 °C (273 K) sound travels at 331 m/s. How fast is it at 30 °C (303 K)? In m/s, to whole numbers.
    params:
      unit: m/s
    answer:
      value: 349
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 367) < 2
        misconception: linear-not-root
        text: The speed grows only with the **square root** of temperature.
    hints:
      - Work out √(303 ÷ 273).
      - 331 · 1.054 = ?
    explanation: √(303/273) ≈ 1.054, so about 349 m/s. Per degree sound gets about 0.6 m/s faster.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Breathing in helium makes you sound like a cartoon character. Why?
    params:
      options:
        - label: Sound is faster in helium – the resonances in mouth and throat shift higher.
          correct: true
        - label: The vocal cords vibrate faster.
          feedback: They vibrate almost the same. The fundamental barely changes.
        - label: Helium squeezes the voice.
          feedback: Helium is lighter than air, not more compressed.
    hints:
      - The mouth acts like a flute. What sets its notes?
      - At equal length and higher speed the frequency rises.
    explanation: The throat amplifies certain frequencies. In helium they lie almost three times higher. So the voice sounds bright although its fundamental stays the same.
    difficulty: 3

srs:
  cards_from: [gewitter, wellenlaenge]
