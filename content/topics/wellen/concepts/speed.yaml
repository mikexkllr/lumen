id: sci.waves.speed
type: concept
title: Wie schnell ist Schall?
summary: Blitz, Donner und Wellenlänge.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Tempo der Welle
    body: "Ob Wasser, Schall oder Licht: Jede Welle läuft mit einem eigenen Tempo. Dreh an Frequenz und Wellenlänge und beobachte das **Tempo**. Findest du zwei Wellen, die gleich schnell sind?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: wave
        controls:
          amplitude:
            fixed: true

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie schnell ist Schall in Luft – in km/h?"
    params:
      min: 100
      max: 5000
      unit: km/h
    answer:
      value: 1224
      tolerance: 250
    explanation: Rund 1200 km/h, also 340 m/s. Ein Düsenjet kann schneller sein – dann knallt es.

  - kind: problem
    id: gewitter
    widget: numeric
    body: Schall legt etwa 340 m pro Sekunde zurück. Licht ist praktisch sofort da.
    prompt: Zwischen Blitz und Donner vergehen {{t}} Sekunden. Wie weit ist das Gewitter entfernt?
    params: { unit: m }
    answer: { value: "{{340 * t}}", tolerance: 30 }
    feedback:
      - when: "numval(state.input) == 340 / t"
        misconception: divide
        text: Weg = Geschwindigkeit · Zeit. Nimm mal.
    hints:
      - "{{t}} · 340 m."
    explanation: "{{t}} · 340 m ≈ {{340 * t}} m. Faustregel – Sekunden durch 3 ergibt Kilometer."
    variants:
      params: { t: "int[2,12]" }
      defaults: { t: 3 }

  - kind: explain
    id: s2
    body: |
      Für jede **Welle** gilt: **Geschwindigkeit = Frequenz · Wellenlänge**.
      Ein tiefer Ton hat lange Wellen, ein hoher kurze.

  - kind: problem
    id: wellenlaenge
    widget: numeric
    prompt: Ein Ton hat {{f}} Hz. Wie lang ist eine Welle bei 340 m/s?
    params: { unit: m }
    answer: { value: "{{340 / f}}", tolerance: 0.01 }
    feedback:
      - when: "numval(state.input) == 340 * f"
        misconception: multiply
        text: "Wellenlänge = Geschwindigkeit : Frequenz."
    hints:
      - "340 geteilt durch {{f}}."
    explanation: "340 : {{f}} = {{340 / f}} m."
    variants:
      params: { f: "choice[34,85,170,340,680]" }
      defaults: { f: 340 }

  - kind: problem
    id: medium
    widget: choice
    prompt: Wo ist Schall am schnellsten?
    params:
      options:
        - { label: In Stahl, correct: true }
        - { label: In Luft, feedback: "Luft ist am langsamsten der drei – etwa 340 m/s." }
        - { label: Im Weltraum, feedback: "Im Vakuum gibt es gar keinen Schall – nichts kann schwingen." }
    hints:
      - Schall braucht Teilchen, die sich gegenseitig anstoßen.
    explanation: In Stahl sind es rund 5000 m/s. Darum hört man einen Zug früher in den Schienen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du rufst gegen eine Felswand und hörst das Echo nach 3 Sekunden. Wie weit ist die Wand entfernt?
    params:
      unit: m
    answer:
      value: 510
      tolerance: 10
    feedback:
      - when: approx(numval(state.input), 1020, 20)
        misconception: round-trip
        text: Das ist der Weg hin und zurück. Die Wand ist halb so weit weg.
    hints:
      - Der Schall läuft hin **und** zurück.
    explanation: 340 · 3 = 1020 m für beide Wege, also 510 m.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Eine Wasserwelle läuft mit 3 m/s. Bau sie mit einer Wellenlänge von 1,5 m.
    params:
      scene: wave
    answer:
      wavelength: 1.5
      speed: 3
    explanation: "Bei 2 Hz: 1,5 m · 2 Hz = 3 m/s."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Ein Echolot sendet einen Ton nach unten. Das Echo vom Meeresgrund kommt nach 0,4 s zurück. Schall läuft in Wasser 1500 m/s. Wie tief ist das Meer hier?
    params:
      unit: m
    answer:
      value: 300
    feedback:
      - when: numval(state.input) == 600
        misconception: echo-twice
        text: Der Schall läuft hin **und** zurück. Halbiere den Weg.
    hints:
      - Weg = Tempo · Zeit.
      - Der Weg zum Grund ist nur die Hälfte davon.
    explanation: 1500 · 0,4 = 600 m für Hin und Zurück, also 300 m Tiefe. Fledermäuse und Delfine orten genauso.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Ein Ton von 500 Hz geht aus der Luft ins Wasser, wo Schall viermal so schnell ist. Was ändert sich?
    params:
      options:
        - label: Die Wellenlänge wird viermal so lang, die Frequenz bleibt.
          correct: true
        - label: Die Frequenz wird viermal so hoch.
          feedback: Die Grenzfläche schwingt im selben Takt mit. Die Frequenz kann sich nicht ändern.
        - label: Beides bleibt gleich.
          feedback: Dann wäre das Tempo auch gleich. Es gilt c = f · λ.
    hints:
      - Die Wasseroberfläche wird im Takt der Luftwelle angestoßen.
      - "Gleiche Frequenz, mehr Tempo: c = f · λ."
    explanation: Die Frequenz gibt die Quelle vor. Bei viermal so großem Tempo wird jede Welle viermal so lang. Bei Licht in Glas ist es genauso.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Radiowellen laufen mit 300 000 km/s. Welche Wellenlänge in Metern hat ein Sender mit 100 MHz?
    params:
      unit: m
    answer:
      value: 3
    hints:
      - 300 000 000 m/s geteilt durch 100 000 000 Hz.
    explanation: 3 Meter. Darum sind UKW-Antennen etwa 75 cm lang – ein Viertel der Wellenlänge.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Die **Schallgeschwindigkeit** in einem Gas wächst mit der Wurzel der Temperatur: $c \\propto \\sqrt{T}$. Schnellere Teilchen geben den Stoß schneller weiter. In leichtem Helium ist Schall fast dreimal so schnell wie in Luft."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Bei 0 °C (273 K) läuft Schall mit 331 m/s. Wie schnell ist er bei 30 °C (303 K)? In m/s, auf ganze Zahlen.
    params:
      unit: m/s
    answer:
      value: 349
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 367) < 2
        misconception: linear-not-root
        text: Das Tempo wächst nur mit der **Wurzel** der Temperatur.
    hints:
      - "Rechne √(303 : 273)."
      - 331 · 1,054 = ?
    explanation: √(303/273) ≈ 1,054, also etwa 349 m/s. Pro Grad wird Schall rund 0,6 m/s schneller.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Wer Helium einatmet, klingt wie eine Comicfigur. Warum?
    params:
      options:
        - label: Schall ist in Helium schneller – die Resonanzen im Mund- und Rachenraum liegen höher.
          correct: true
        - label: Die Stimmbänder schwingen schneller.
          feedback: Sie schwingen fast gleich. Der Grundton ändert sich kaum.
        - label: Helium drückt die Stimme zusammen.
          feedback: Helium ist leichter als Luft, nicht stärker gepresst.
    hints:
      - Der Mundraum wirkt wie eine Flöte. Was bestimmt ihre Töne?
      - Bei gleicher Länge und höherem Tempo steigt die Frequenz.
    explanation: Der Rachen verstärkt bestimmte Frequenzen. In Helium liegen sie fast dreimal so hoch. Darum klingt die Stimme hell, obwohl ihr Grundton gleich bleibt.
    difficulty: 3

srs:
  cards_from: [gewitter, wellenlaenge]
