id: cs.internet.dns
type: concept
title: The phone book of the network
summary: From names to addresses – and fake addresses.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You want to call grandma. What do you tap on your phone?
    params:
      options:
        - label: Her name – the phone knows the number
          correct: true
        - label: Her number from memory
          feedback: Hardly anyone still knows it by heart.
        - label: Her address
          feedback: The phone cannot dial with that.
    hints:
      - "What do you remember more easily: names or numbers?"
    explanation: The internet has such an address book too.

  - kind: explain
    id: s1
    body: |
      Computers find each other by numbers like 93.184.216.34. People remember names. **DNS** translates – like a phone book.

  - kind: problem
    id: ablauf
    widget: order
    prompt: You type in an address. Put the steps in the right order.
    params:
      items:
        - { label: You type the name }
        - { label: DNS returns the IP address }
        - { label: The browser connects to the IP }
        - { label: The server sends the page }
    hints:
      - Without a number, the browser can't reach anyone.
    explanation: First translate, then connect, then load.

  - kind: problem
    id: echt
    widget: choice
    prompt: Which address really leads to bank.de?
    params:
      options:
        - { label: "bank.de/login", correct: true }
        - { label: "bank.de.konto-check.com", feedback: "The real domain is the part before the first slash, at the far right – here konto-check.com." }
        - { label: "bank-de.login.net", feedback: "That belongs to login.net." }
    hints:
      - Read the part before the first slash from the right.
    explanation: What counts is the end of the name before the slash. Scammers put the real name at the front.

  - kind: problem
    id: schloss
    widget: choice
    prompt: A site shows the lock symbol. What does that mean?
    params:
      options:
        - { label: The connection is encrypted., correct: true }
        - { label: The site is trustworthy., feedback: "Scam sites can encrypt too." }
    hints:
      - Who could apply for a certificate?
    explanation: The lock protects the path, not you from the destination. Always check the address too.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[DNS]] translates names into [[numbers]] – like a phone book.
      distractors:
        - Wi-Fi
        - colours

  - kind: problem
    id: mix-c2
    widget: match
    prompt: What is what?
    params:
      pairs:
        - left: www.example.com
          right: Name for people
        - left: 93.184.216.34
          right: Address for computers
        - left: DNS server
          right: The translator
        - left: Cache
          right: Remembers answers
    hints:
      - People remember names, computers work with numbers.
    explanation: This translation runs in the background on every page visit.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which of these addresses does **not** belong to paypal.com?
    params:
      options:
        - label: paypal.com.secure-login.net
          correct: true
        - label: www.paypal.com/signin
          feedback: The part after the / is just a path on the same site.
        - label: checkout.paypal.com
          feedback: What stands **before** paypal.com is a subdomain of the same owner.
    hints:
      - What matters is what stands directly before the first single /.
    explanation: "You read the domain from the **right**: here everything belongs to secure-login.net. That is how phishing sites work."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Your computer remembers a DNS answer for 300 seconds. How many minutes is that?
    params:
      unit: min
    answer:
      value: 5
    hints:
      - 300 divided by 60.
    explanation: 5 minutes. For that long nobody has to ask again.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: Your computer does not know bank.de yet. Put the DNS resolver's questions in the right order.
    params:
      items:
        - label: The resolver asks a root server
        - label: The root names the server for .de
        - label: The .de server names the server of bank.de
        - label: That one gives the IP address
        - label: The resolver caches the answer
    hints:
      - DNS reads names from right to left.
      - At the top is the root, then the ending .de.
    explanation: "DNS is a tree: root, then .de, then bank.de. Each level only refers to the next."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: A name is looked up 1000 times an hour. The answer stays valid for 300 seconds. How many queries reach bank.de's server per hour at most?
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 1000
        misconception: no-cache
        text: The resolver caches the answer. Only when it expires does it ask again.
    hints:
      - How often does the answer expire in an hour?
      - 3600 s / 300 s.
    explanation: 3600 / 300 = 12. The cache turns 1000 queries into just 12.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: login.bank.de.evil.com belongs to evil.com.
          right: true
          why: What counts are the last two parts before the first slash.
        - text: bank-de.com surely belongs to the bank.
          right: false
          why: Anyone can buy such a name.
        - text: With shop.bank.de, bank.de decides where it leads.
          right: true
          why: shop is a subdomain of bank.de.
        - text: A name can look like »bank« and still be a different one.
          right: true
          why: For example with a Cyrillic »а«.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does your computer remember DNS answers for some time?
    params:
      options:
        - label: It saves the lookup on every further visit – pages load faster
          correct: true
        - label: So the page also works offline
          feedback: Only the address is stored, not the page.
        - label: For security reasons
          feedback: It serves speed – and can even be a risk.
    hints:
      - A DNS query takes time. Must it be made every time?
    explanation: "**Caching** is everywhere on the net: keep results instead of fetching them again. The downside: stale data."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: An attacker slips your resolver a fake address for bank.de. What still protects you?
    params:
      options:
        - label: HTTPS – the fraudster has no valid certificate for bank.de
          correct: true
        - label: Nothing, DNS is the only lock
          feedback: DNS just provides the address. The check comes after.
        - label: A long password
          feedback: The password does not help if you give it to the wrong site.
    hints:
      - What does the browser check after it has an address?
      - The fake server would have to prove it is bank.de.
    explanation: The browser warns loudly if the certificate does not match. DNSSEC additionally protects DNS answers themselves with signatures.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: A company moves its website to a new server. Why does it shorten the lifetime of its DNS answers beforehand?
    params:
      options:
        - label: So that old answers disappear quickly from all caches
          correct: true
        - label: So that the site loads faster
          feedback: A shorter lifetime means more queries, if anything.
        - label: So that attackers cannot find it
          feedback: The address stays public.
    hints:
      - What happens to cached answers after the move?
      - Caches still point to the old server – until they expire.
    explanation: "Caching saves work but makes changes slow. That is a basic problem of every cache: when is stored data out of date?"
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what DNS does and why computers remember answers.
    params:
      keywords:
        - - name
          - namen
        - - adresse
          - address
          - nummer
          - number
        - - merk
          - cache
          - speicher
          - store
          - remember
      sample: DNS translates names like bank.de into IP addresses, the numbers routers understand. Because asking takes time, the computer remembers the answer for a while in a cache.
    difficulty: 3

srs:
  cards_from: [echt, schloss]
