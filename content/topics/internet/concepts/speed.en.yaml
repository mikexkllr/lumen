id: cs.internet.speed
type: concept
title: How fast is fast?
summary: Bits, bytes and ping.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pigeon vs. fibre
    body: Is a download fast when the line is wide – or when the path is short? Flip the cards. This is about **bandwidth** and about waiting time.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🕊️
            front: Pigeon vs. cable
            back: In 2009 a pigeon in South Africa carried 4 GB over 80 km – faster than the line.
          - icon: 🌍
            front: Once around the Earth
            back: Light in a glass fibre would need only about 0.2 seconds for that.
          - icon: 🛰️
            front: Internet by satellite
            back: A signal up to a satellite 36,000 km high and back takes almost a quarter of a second.
          - icon: 🚚
            front: A truck full of hard drives
            back: For huge amounts of data, companies sometimes send real trucks full of hard drives.

  - kind: problem
    id: mbyte
    widget: numeric
    prompt: A line manages {{r}} megabits per second. How many megabytes per second is that?
    params: { unit: MB/s }
    answer: { value: "{{r / 8}}" }
    feedback:
      - when: "numval(state.input) == r"
        misconception: bit-byte
        text: A bit and a byte are not the same – a byte has 8 bits.
    hints:
      - 8 bits = 1 byte.
    explanation: "{{r}} ÷ 8 = {{r / 8}} MB/s."
    variants:
      params: { r: "choice[16,40,80,160,400]" }
      defaults: { r: 80 }

  - kind: problem
    id: download
    widget: numeric
    prompt: How many seconds does a download of {{g}} GB take at 100 Mbit/s?
    params: { unit: s }
    answer: { value: "{{g * 80}}" }
    hints:
      - 1 GB = 1,000 MB = 8,000 megabits.
    explanation: "{{g}} · 8000 ÷ 100 = {{g * 80}} seconds."
    variants:
      params: { g: "int[1,9]" }
      defaults: { g: 3 }

  - kind: explain
    id: s3
    body: |
      **Bandwidth** tells you how much gets through per second. **Ping** tells you how long a single packet takes there and back. For some things one counts, for others the other.

  - kind: problem
    id: was-zaehlt
    widget: buckets
    prompt: What matters more here?
    params:
      buckets: [{ label: Bandwidth }, { label: Ping }]
      items:
        - { label: Streaming a 4K movie, bucket: Bandwidth }
        - { label: Downloading a big update, bucket: Bandwidth }
        - { label: Online game, bucket: Ping }
        - { label: Video call, bucket: Ping }
    hints:
      - Is it about a lot of data or a fast reaction?
    explanation: Large amounts of data need bandwidth. Reactions need a short ping.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A 4K film needs 25 Mbit/s. How many gigabytes is that in 2 hours?
    params:
      unit: GB
    answer:
      value: 22.5
    hints:
      - 25 Mbit/s is 3.125 MB/s. Times 7200 seconds.
    explanation: 22,500 MB = 22.5 GB.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: A web page loads 20 files one after another. Each needs a 50 ms ping before it arrives. How many ms do you wait for pings alone?
    params:
      unit: ms
    answer:
      value: 1000
    hints:
      - One after another means the waits add up.
      - 20 · 50 ms.
    explanation: 20 · 50 ms = 1 s – however fast the line is. That is why browsers load many things at once.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: "**Latency** has a hard limit: light covers about 200,000 km per second in fibre. More bandwidth does not make a single packet faster – it only makes the pipe wider."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: 100 TB must go from Berlin to Munich. A 1 Gbit/s line – how many hours does it take? (A car full of drives takes 6 hours.)"
    params:
      min: 1
      max: 10000
      scale: log
      unit: h
    answer:
      value: 222
      within: 25
    explanation: 100 TB = 800,000 Gbit, so 800,000 s ≈ 222 hours. The car clearly wins. Cloud providers really do ship disks for this.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: what happens when you type a web address and press Enter?"
    params:
      keywords:
        - - dns
          - name
          - adresse
          - address
        - - ip
        - - paket
          - packet
          - anfrage
          - request
        - - server
          - antwort
          - response
          - reply
      min: 3
      sample: The browser asks DNS for the IP address of the name. Then it sends a request in packets to the server, and the server sends the page back as its response.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: A line carries 100 Mbit/s, a ping takes 40 ms. How many megabits are in flight at once when the line is fully used?
    params:
      unit: Mbit
    answer:
      value: 4
    hints:
      - Bandwidth times time gives an amount.
      - 100 Mbit/s · 0.04 s.
    explanation: 100 · 0.04 = 4 Mbit. The sender must have this bandwidth-delay product in flight before the first acknowledgement returns.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: A 10 MB download over 100 Mbit/s. Add a 0.05 s ping to get started. About how many seconds does it take in total?
    params:
      unit: s
    answer:
      value: 0.85
      tolerance: 0.02
    feedback:
      - when: abs(numval(state.input) - 0.15) < 0.01
        misconception: bits-bytes
        text: Mixed up MB and Mbit? 10 MB are 80 Mbit.
    hints:
      - Convert megabytes to megabits.
      - 80 Mbit / 100 Mbit/s plus 0.05 s.
    explanation: 80 / 100 = 0.8 s, plus 0.05 s = 0.85 s. For big files bandwidth counts, for small ones the ping.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Video streaming runs smoothly, but an online game on the same line lags. Why?
    params:
      options:
        - label: Streaming buffers ahead, in a game every millisecond of ping counts
          correct: true
        - label: Games need more bandwidth than video
          feedback: Usually the reverse – games send few, small packets.
        - label: Games do not use the internet
          feedback: Online games send packets all the time.
    hints:
      - Can a video load in advance? Can a game?
      - Your input must reach the server right away.
    explanation: A video loads a few seconds ahead and smooths over hiccups. A game cannot load the future in advance – latency is what counts.
    difficulty: 3

srs:
  cards_from: [mbyte, was-zaehlt]
