id: cs.internet.packets
type: concept
title: Datenpakete
summary: Alles wird in kleine Stücke zerlegt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Über wie viele Zwischenstationen (Router) läuft ein Datenpaket typischerweise bis zu einer Webseite?"
    params:
      min: 1
      max: 200
    answer:
      value: 15
      tolerance: 8
    explanation: Meist 10 bis 20 – und das in wenigen Hundertstelsekunden.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: Ein Foto mit 3 MB wird in Pakete zu je 1500 Byte zerlegt. Wie viele Pakete sind das?
    body: Rechne mit 1 MB = 1 000 000 Byte.
    params: { unit: Pakete }
    answer: { value: 2000 }
    hints:
      - 3 000 000 geteilt durch 1500.
    explanation: 3 000 000 / 1500 = 2000 Pakete.

  - kind: explain
    id: s2
    body: |
      Im Internet reist nichts am Stück. Alles wird in **Pakete** zerlegt. Jedes trägt Absender, Ziel und eine Nummer.
      Am Ziel werden sie wieder zusammengesetzt.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring den Weg einer Nachricht in die richtige Reihenfolge.
    params:
      items:
        - { label: Die Nachricht wird in Pakete zerlegt. }
        - { label: Jedes Paket bekommt Ziel und Nummer. }
        - { label: Router leiten die Pakete weiter. }
        - { label: Die Pakete kommen durcheinander an. }
        - { label: Der Empfänger sortiert sie nach Nummer. }
    hints:
      - Zuerst zerlegen, zuletzt zusammensetzen.
    explanation: Pakete können verschiedene Wege nehmen. Die Nummern stellen die Ordnung wieder her.

  - kind: problem
    id: verloren
    widget: choice
    prompt: Ein Paket geht unterwegs verloren. Was passiert meistens?
    params:
      options:
        - { label: Der Empfänger merkt es und fordert es neu an., correct: true }
        - { label: Die ganze Datei ist kaputt., feedback: "Dafür gibt es die Nummern – es fehlt genau eins, und das wird nachgeschickt." }
        - { label: Niemand bemerkt es., feedback: "Die Lücke in der Nummernfolge fällt auf." }
    hints:
      - Wozu dienen die Nummern?
    explanation: Fehlt eine Nummer, wird genau dieses Paket noch einmal geschickt.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Die Pakete einer Nachricht kommen in falscher Reihenfolge an. Was nun?
    params:
      options:
        - label: Der Empfänger sortiert sie anhand ihrer Nummern
          correct: true
        - label: Die Nachricht ist verloren
          feedback: Genau dafür trägt jedes Paket eine Nummer.
        - label: Die Router sortieren sie unterwegs
          feedback: Router leiten nur weiter – sortiert wird am Ziel.
    hints:
      - Was steht außer Absender und Ziel noch auf jedem Paket?
    explanation: Das Protokoll **TCP** nummeriert, bestätigt und fordert Verlorenes neu an.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: Ein Paket ist 1500 Byte groß. 40 Byte davon sind der Kopf mit Adressen und Nummer. Wie viel Prozent sind das? Runde auf eine Stelle.
    params:
      unit: "%"
    answer:
      value: 2.7
      tolerance: 0.05
    hints:
      - Teile 40 durch 1500.
      - Mal 100 ergibt Prozent.
    explanation: 40 / 1500 ≈ 0,027 = 2,7 %. Fast alles im Paket sind Nutzdaten – nur ein kleiner Teil ist Verwaltung.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: "Ein **Protokoll** ist eine feste Abmachung. Im Netz stapeln sich mehrere: IP bringt Pakete zur richtigen Adresse. TCP sorgt dafür, dass alles vollständig und in Reihenfolge ankommt. HTTP sagt, was drinsteht."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: match
    prompt: Welche Schicht kümmert sich um was?
    params:
      pairs:
        - left: HTTP
          right: Welche Webseite will ich?
        - left: TCP
          right: Vollständig und in Reihenfolge
        - left: IP
          right: Adresse und Weg durchs Netz
        - left: WLAN
          right: Bis zum nächsten Gerät
    hints:
      - "Von oben nach unten: vom Inhalt bis zur Funkwelle."
      - TCP nummeriert und bestätigt Pakete.
    explanation: Jede Schicht nutzt die darunter, ohne ihre Details zu kennen. Darum läuft HTTP über WLAN genauso wie über Glasfaser.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: order
    prompt: Bevor TCP Daten schickt, verabreden sich beide Seiten. Bring diesen Handschlag in die richtige Reihenfolge.
    params:
      items:
        - label: SYN – »Ich will reden«
        - label: SYN-ACK – »Verstanden, ich auch«
        - label: ACK – »Verstanden«
        - label: Daten fließen
    hints:
      - Wer fängt an?
      - Jede Seite bestätigt die andere einmal.
    explanation: Der Drei-Wege-Handschlag. Danach kennen beide die Startnummern der Pakete.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Videoanrufe nutzen oft UDP statt TCP – ohne Bestätigung und ohne Neusenden. Warum?
    params:
      options:
        - label: Ein verspätetes Paket ist nutzlos – lieber ein kurzer Aussetzer als eine Verzögerung
          correct: true
        - label: UDP ist sicherer
          feedback: Es ist sogar weniger zuverlässig.
        - label: TCP kann keine Videos übertragen
          feedback: Streaming-Dienste nutzen TCP – dort darf gepuffert werden.
    hints:
      - Was bringt dir ein Wort, das zwei Sekunden zu spät ankommt?
    explanation: Zuverlässig oder schnell – jedes Protokoll ist ein Kompromiss für seinen Zweck.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: TCP schickt höchstens 64 KB und wartet dann auf eine Bestätigung. Ein Ping dauert 100 ms. Wie viele KB pro Sekunde schafft die Verbindung höchstens?
    params:
      unit: KB/s
    answer:
      value: 640
    feedback:
      - when: numval(state.input) == 6.4
        misconception: divide-wrong
        text: Pro Sekunde passen 10 Pings, nicht ein Zehntel davon.
    hints:
      - Wie viele Runden aus Senden und Warten passen in eine Sekunde?
      - 1 s / 0,1 s = 10 Runden zu je 64 KB.
    explanation: 10 · 64 KB = 640 KB/s – egal, wie dick die Leitung ist. Darum dürfen moderne Verbindungen viel mehr Daten »in der Luft« haben.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Warum zerlegt man Daten überhaupt in Pakete, statt sie am Stück zu schicken?
    params:
      options:
        - label: Viele können sich die Leitungen teilen, und bei einem Fehler wird nur ein kleines Stück neu gesendet
          correct: true
        - label: Kleine Pakete sind schneller als Licht
          feedback: Auch Pakete reisen höchstens mit Lichtgeschwindigkeit.
        - label: Weil Router nur kleine Dateien kennen
          feedback: Router kennen gar keine Dateien – nur Pakete.
    hints:
      - Denk an eine Autobahn mit vielen kleinen Autos.
      - Was passiert, wenn ein riesiger Block unterwegs beschädigt wird?
    explanation: Paketvermittlung teilt die Leitungen fair auf und macht Fehler billig. Das alte Telefonnetz reservierte dagegen eine ganze Leitung pro Gespräch.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: TCP schickt verlorene Pakete neu.
          right: true
          why: Fehlt eine Bestätigung, sendet TCP noch einmal.
        - text: UDP garantiert die Reihenfolge.
          right: false
          why: UDP schickt einfach los – ohne Nummern-Kontrolle und Neusenden.
        - text: Für Live-Video ist UDP oft besser.
          right: true
          why: Ein verspätetes Bild ist wertlos – lieber das nächste.
        - text: Jedes Paket nimmt denselben Weg.
          right: false
          why: Router entscheiden pro Paket. Wege können sich unterwegs ändern.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Datei vollständig ankommt, obwohl unterwegs Pakete verloren gehen.
    params:
      keywords:
        - - nummer
          - number
          - reihenfolge
          - order
          - sequence
        - - bestätig
          - ack
          - quittung
          - confirm
        - - neu
          - erneut
          - resend
          - again
          - wieder
      sample: Jedes Paket bekommt eine Nummer. Der Empfänger bestätigt, was angekommen ist, und sortiert nach Nummer. Fehlt eine Bestätigung, schickt der Absender das Paket erneut.
    difficulty: 3

srs:
  cards_from: [wie-viele, verloren]
