id: cs.internet.dns
type: concept
title: Das Telefonbuch des Netzes
summary: Von Namen zu Adressen – und falschen Adressen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du willst Oma anrufen. Was tippst du im Handy an?
    params:
      options:
        - label: Ihren Namen – das Handy kennt die Nummer
          correct: true
        - label: Ihre Nummer aus dem Kopf
          feedback: Die wenigsten wissen sie noch auswendig.
        - label: Ihre Adresse
          feedback: Damit kann das Handy nicht wählen.
    hints:
      - "Was merkst du dir leichter: Namen oder Nummern?"
    explanation: Das Internet hat auch so ein Adressbuch.


  - kind: explain
    id: s1
    body: |
      Computer finden sich über Nummern wie 93.184.216.34. Menschen merken sich Namen. Das **DNS** übersetzt – wie ein Telefonbuch.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Du tippst eine Adresse ein. Bring die Schritte in die richtige Reihenfolge.
    params:
      items:
        - { label: Du tippst den Namen ein }
        - { label: DNS liefert die IP-Adresse }
        - { label: Der Browser verbindet sich mit der IP }
        - { label: Der Server schickt die Seite }
    hints:
      - Ohne Nummer kann der Browser niemanden erreichen.
    explanation: Erst übersetzen, dann verbinden, dann laden.

  - kind: problem
    id: echt
    widget: choice
    prompt: Welche Adresse führt wirklich zu bank.de?
    params:
      options:
        - { label: "bank.de/login", correct: true }
        - { label: "bank.de.konto-check.com", feedback: "Die echte Domain steht vor dem ersten Schrägstrich ganz rechts – hier konto-check.com." }
        - { label: "bank-de.login.net", feedback: "Das gehört zu login.net." }
    hints:
      - Lies den Teil vor dem ersten Schrägstrich von rechts.
    explanation: Entscheidend ist das Ende des Namens vor dem Schrägstrich. Betrüger bauen den echten Namen vorne ein.

  - kind: problem
    id: schloss
    widget: choice
    prompt: Eine Seite zeigt das Schloss-Symbol. Was heißt das?
    params:
      options:
        - { label: Die Verbindung ist verschlüsselt., correct: true }
        - { label: Die Seite ist vertrauenswürdig., feedback: "Auch Betrugsseiten können verschlüsseln." }
    hints:
      - Wer könnte ein Zertifikat beantragen?
    explanation: Das Schloss schützt den Weg, nicht vor dem Ziel. Prüf immer auch die Adresse.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Welche dieser Adressen gehört **nicht** zu paypal.com?
    params:
      options:
        - label: paypal.com.sicher-login.net
          correct: true
        - label: www.paypal.com/signin
          feedback: Der Teil nach dem / ist nur ein Pfad auf derselben Seite.
        - label: checkout.paypal.com
          feedback: Was **vor** paypal.com steht, ist eine Unterseite desselben Besitzers.
    hints:
      - Entscheidend ist, was direkt vor dem ersten einzelnen / steht.
    explanation: "Die Domain liest man von **rechts**: Hier gehört alles zu sicher-login.net. So arbeiten Phishing-Seiten."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum merkt sich dein Computer DNS-Antworten für einige Zeit?
    params:
      options:
        - label: Das spart bei jedem weiteren Aufruf die Nachfrage – Seiten laden schneller
          correct: true
        - label: Damit die Seite auch offline funktioniert
          feedback: Gespeichert wird nur die Adresse, nicht die Seite.
        - label: Aus Sicherheitsgründen
          feedback: Es dient dem Tempo – und kann sogar ein Risiko sein.
    hints:
      - Eine DNS-Anfrage kostet Zeit. Muss man sie jedes Mal stellen?
    explanation: "**Caching** steckt überall im Netz: Ergebnisse aufheben, statt sie neu zu holen. Die Kehrseite: veraltete Daten."
    difficulty: 3

srs:
  cards_from: [echt, schloss]
