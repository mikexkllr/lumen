id: cs.internet.dns
type: concept
title: Das Telefonbuch des Netzes
summary: Von Namen zu Adressen – und falschen Adressen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Namen statt Nummern
    body: "Ohne DNS wäre das Netz für Menschen kaum zu benutzen. Deck die Karten auf: Hier arbeitet **ein riesiges Verzeichnis** – rund um die Uhr."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌳
            front: Die Wurzel
            back: Ganz oben stehen 13 Namen von Root-Servern. Dahinter arbeiten weltweit über 1000 Rechner.
          - icon: 🇩🇪
            front: Die Endung .de
            back: Unter .de sind über 17 Millionen Namen eingetragen – mehr als in fast jedem anderen Land.
          - icon: ⚡
            front: Blitzschnell
            back: Eine DNS-Antwort kommt oft nach wenigen Millisekunden – schneller als ein Wimpernschlag.
          - icon: 🎣
            front: Falsche Namen
            back: Betrüger melden Namen an, die fast wie echte aussehen – etwa mit einer Eins statt einem kleinen L.

  - kind: problem
    id: hook
    widget: choice
    prompt: Du willst Oma anrufen. Was tippst du im Handy an?
    params:
      options:
        - label: Ihren Namen – das Handy kennt die Nummer
          correct: true
        - label: Ihre Nummer aus dem Kopf
          feedback: Die wenigsten wissen sie noch auswendig.
        - label: Ihre Adresse
          feedback: Damit kann das Handy nicht wählen.
    hints:
      - "Was merkst du dir leichter: Namen oder Nummern?"
    explanation: Das Internet hat auch so ein Adressbuch.

  - kind: explain
    id: s1
    body: |
      Computer finden sich über Nummern wie 93.184.216.34. Menschen merken sich Namen. Das **DNS** übersetzt – wie ein Telefonbuch.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Du tippst eine Adresse ein. Bring die Schritte in die richtige Reihenfolge.
    params:
      items:
        - { label: Du tippst den Namen ein }
        - { label: DNS liefert die IP-Adresse }
        - { label: Der Browser verbindet sich mit der IP }
        - { label: Der Server schickt die Seite }
    hints:
      - Ohne Nummer kann der Browser niemanden erreichen.
    explanation: Erst übersetzen, dann verbinden, dann laden.

  - kind: problem
    id: echt
    widget: choice
    prompt: Welche Adresse führt wirklich zu bank.de?
    params:
      options:
        - { label: "bank.de/login", correct: true }
        - { label: "bank.de.konto-check.com", feedback: "Die echte Domain steht vor dem ersten Schrägstrich ganz rechts – hier konto-check.com." }
        - { label: "bank-de.login.net", feedback: "Das gehört zu login.net." }
    hints:
      - Lies den Teil vor dem ersten Schrägstrich von rechts.
    explanation: Entscheidend ist das Ende des Namens vor dem Schrägstrich. Betrüger bauen den echten Namen vorne ein.

  - kind: problem
    id: schloss
    widget: choice
    prompt: Eine Seite zeigt das Schloss-Symbol. Was heißt das?
    params:
      options:
        - { label: Die Verbindung ist verschlüsselt., correct: true }
        - { label: Die Seite ist vertrauenswürdig., feedback: "Auch Betrugsseiten können verschlüsseln." }
    hints:
      - Wer könnte ein Zertifikat beantragen?
    explanation: Das Schloss schützt den Weg, nicht vor dem Ziel. Prüf immer auch die Adresse.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Das [[DNS]] übersetzt Namen in [[Nummern]] – wie ein Telefonbuch.
      distractors:
        - WLAN
        - Farben

  - kind: problem
    id: mix-c2
    widget: match
    prompt: Was ist was?
    params:
      pairs:
        - left: www.beispiel.de
          right: Name für Menschen
        - left: 93.184.216.34
          right: Adresse für Computer
        - left: DNS-Server
          right: Der Übersetzer
        - left: Zwischenspeicher
          right: Merkt sich Antworten
    hints:
      - Menschen merken sich Namen, Computer rechnen mit Nummern.
    explanation: Bei jedem Seitenaufruf läuft diese Übersetzung im Hintergrund.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Welche dieser Adressen gehört **nicht** zu paypal.com?
    params:
      options:
        - label: paypal.com.sicher-login.net
          correct: true
        - label: www.paypal.com/signin
          feedback: Der Teil nach dem / ist nur ein Pfad auf derselben Seite.
        - label: checkout.paypal.com
          feedback: Was **vor** paypal.com steht, ist eine Unterseite desselben Besitzers.
    hints:
      - Entscheidend ist, was direkt vor dem ersten einzelnen / steht.
    explanation: "Die Domain liest man von **rechts**: Hier gehört alles zu sicher-login.net. So arbeiten Phishing-Seiten."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Dein Rechner merkt sich eine DNS-Antwort 300 Sekunden lang. Wie viele Minuten sind das?
    params:
      unit: min
    answer:
      value: 5
    hints:
      - 300 geteilt durch 60.
    explanation: 5 Minuten. So lange muss niemand erneut fragen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: Dein Rechner kennt bank.de noch nicht. Bring die Fragen des DNS-Resolvers in die richtige Reihenfolge.
    params:
      items:
        - label: Resolver fragt einen Root-Server
        - label: Root nennt den Server für .de
        - label: Der .de-Server nennt den Server von bank.de
        - label: Dieser nennt die IP-Adresse
        - label: Resolver merkt sich die Antwort
    hints:
      - DNS liest Namen von rechts nach links.
      - Ganz oben steht die Wurzel, dann die Endung .de.
    explanation: "DNS ist ein Baum: Wurzel, dann .de, dann bank.de. Jede Ebene verweist nur auf die nächste."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Ein Name wird 1000-mal pro Stunde aufgerufen. Die Antwort gilt 300 Sekunden lang. Wie viele Anfragen gehen pro Stunde höchstens an den Server von bank.de?
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 1000
        misconception: no-cache
        text: Der Resolver merkt sich die Antwort. Nur wenn sie abgelaufen ist, fragt er neu.
    hints:
      - Wie oft läuft die Antwort in einer Stunde ab?
      - 3600 s / 300 s.
    explanation: 3600 / 300 = 12. Der Cache macht aus 1000 Anfragen nur 12.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: login.bank.de.evil.com gehört zu evil.com.
          right: true
          why: Entscheidend sind die letzten beiden Teile vor dem ersten Schrägstrich.
        - text: bank-de.com gehört bestimmt der Bank.
          right: false
          why: Jeder kann sich so einen Namen kaufen.
        - text: Bei shop.bank.de bestimmt bank.de, wohin es geht.
          right: true
          why: shop ist eine Unterdomain von bank.de.
        - text: Ein Name kann wie »bank« aussehen und doch ein anderer sein.
          right: true
          why: Etwa mit einem kyrillischen »а«.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum merkt sich dein Computer DNS-Antworten für einige Zeit?
    params:
      options:
        - label: Das spart bei jedem weiteren Aufruf die Nachfrage – Seiten laden schneller
          correct: true
        - label: Damit die Seite auch offline funktioniert
          feedback: Gespeichert wird nur die Adresse, nicht die Seite.
        - label: Aus Sicherheitsgründen
          feedback: Es dient dem Tempo – und kann sogar ein Risiko sein.
    hints:
      - Eine DNS-Anfrage kostet Zeit. Muss man sie jedes Mal stellen?
    explanation: "**Caching** steckt überall im Netz: Ergebnisse aufheben, statt sie neu zu holen. Die Kehrseite: veraltete Daten."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Ein Angreifer schiebt deinem Resolver eine falsche Adresse für bank.de unter. Was schützt dich trotzdem?
    params:
      options:
        - label: HTTPS – der Betrüger hat kein gültiges Zertifikat für bank.de
          correct: true
        - label: Nichts, DNS ist das einzige Schloss
          feedback: DNS liefert nur die Adresse. Geprüft wird danach.
        - label: Ein langes Passwort
          feedback: Das Passwort hilft nicht, wenn du es der falschen Seite gibst.
    hints:
      - Was prüft der Browser, nachdem er eine Adresse hat?
      - Der falsche Server müsste beweisen, dass er bank.de ist.
    explanation: Der Browser warnt laut, wenn das Zertifikat nicht passt. DNSSEC sichert zusätzlich die DNS-Antworten selbst mit Signaturen ab.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Eine Firma zieht ihre Webseite auf einen neuen Server um. Warum verkürzt sie vorher die Gültigkeit ihrer DNS-Antworten?
    params:
      options:
        - label: Damit alte Antworten schnell aus allen Caches verschwinden
          correct: true
        - label: Damit die Seite schneller lädt
          feedback: Kürzere Gültigkeit heißt eher mehr Anfragen.
        - label: Damit Angreifer sie nicht finden
          feedback: Die Adresse bleibt öffentlich.
    hints:
      - Was passiert mit gemerkten Antworten nach dem Umzug?
      - Caches zeigen noch auf den alten Server – bis sie ablaufen.
    explanation: "Caching spart Arbeit, macht Änderungen aber träge. Das ist ein Grundproblem jedes Caches: Wann sind gemerkte Daten veraltet?"
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was DNS tut und warum Rechner sich Antworten merken.
    params:
      keywords:
        - - name
          - namen
        - - adresse
          - address
          - nummer
          - number
        - - merk
          - cache
          - speicher
          - store
          - remember
      sample: DNS übersetzt Namen wie bank.de in IP-Adressen, also Nummern, die Router verstehen. Weil das Nachfragen dauert, merkt sich der Rechner die Antwort eine Weile im Cache.
    difficulty: 3

srs:
  cards_from: [echt, schloss]
