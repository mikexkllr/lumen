id: cs.internet.addresses
type: concept
title: IP, DNS and HTTPS
summary: Addresses, phone book and sealed envelopes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: begriffe
    widget: match
    prompt: Match each term with its comparison.
    params:
      pairs:
        - { left: IP address, right: House number of a device }
        - { left: DNS, right: Phone book for names }
        - { left: Router, right: Switch in the network }
        - { left: HTTPS, right: Sealed envelope }
    hints:
      - DNS translates names like lumen.app into numbers.
    explanation: DNS looks up the address, routers carry the data, HTTPS seals the content.

  - kind: explain
    body: |
      Each device has an **IP address**. Here is one: 93.184.216.34.
      Who can remember that? So **DNS** turns names into numbers.

  - kind: problem
    id: ipv4
    widget: choice
    prompt: An old IP address (IPv4) has 32 bits. How many addresses exist?
    params:
      options:
        - { label: "About 4.3 billion", correct: true }
        - { label: "About 32,000", feedback: "32 bits give $2^{32}$ possibilities – far more." }
        - { label: Infinitely many, feedback: "32 bits are a fixed number of possibilities." }
    hints:
      - $2^{32}$.
    explanation: $2^{32}$ ≈ 4.3 billion. That is too few for all devices, so IPv6 uses 128 bits.

  - kind: problem
    id: schloss
    widget: choice
    prompt: What does the lock symbol (HTTPS) in the browser protect?
    params:
      options:
        - { label: "That nobody can read along on the way", correct: true }
        - { label: That the site is trustworthy, feedback: "Scam sites can use HTTPS too. It only protects the transport." }
        - { label: Against viruses on your device, feedback: "HTTPS is not responsible for that." }
    hints:
      - What do you think of with a sealed envelope?
    explanation: HTTPS encrypts the connection. It doesn't tell you whether the sender is trustworthy.

  - kind: explain
    body: How does your browser find a site it has never visited?
    reveal:
      body: It asks a DNS server for the address. That server asks further if needed – until one knows the answer. This usually takes only milliseconds.

srs:
  cards_from: [begriffe, schloss]
