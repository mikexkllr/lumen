id: cs.internet.addresses
type: concept
title: IP, DNS and HTTPS
summary: Addresses, phone book and sealed envelopes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Your house number online
    body: "Every device on the net has an address made of four numbers, like 192.168.0.12. Each number is one **byte**: eight lamps. Switch them on and off. How big can a number get?"
    visual:
      widget: bits
      interactive: true
      params:
        bits: 8
        initial: "11000000"

  - kind: problem
    id: begriffe
    widget: match
    prompt: Match each term with its comparison.
    params:
      pairs:
        - { left: IP address, right: House number of a device }
        - { left: DNS, right: Phone book for names }
        - { left: Router, right: Switch in the network }
        - { left: HTTPS, right: Sealed envelope }
    hints:
      - DNS translates names like lumen.app into numbers.
    explanation: DNS looks up the address, routers carry the data, HTTPS seals the content.

  - kind: explain
    id: s2
    body: |
      Each device has an **IP address**. Here is one: 93.184.216.34.
      Who can remember that? So **DNS** turns names into numbers.

  - kind: problem
    id: ipv4
    widget: choice
    prompt: An old IP address (IPv4) has 32 bits. How many addresses exist?
    params:
      options:
        - { label: "About 4.3 billion", correct: true }
        - { label: "About 32,000", feedback: "32 bits give $2^{32}$ possibilities – far more." }
        - { label: Infinitely many, feedback: "32 bits are a fixed number of possibilities." }
    hints:
      - $2^{32}$.
    explanation: $2^{32}$ ≈ 4.3 billion. That is too few for all devices, so IPv6 uses 128 bits.

  - kind: problem
    id: schloss
    widget: choice
    prompt: What does the lock symbol (HTTPS) in the browser protect?
    params:
      options:
        - { label: "That nobody can read along on the way", correct: true }
        - { label: That the site is trustworthy, feedback: "Scam sites can use HTTPS too. It only protects the transport." }
        - { label: Against viruses on your device, feedback: "HTTPS is not responsible for that." }
    hints:
      - What do you think of with a sealed envelope?
    explanation: HTTPS encrypts the connection. It doesn't tell you whether the sender is trustworthy.

  - kind: explain
    id: s5
    body: How does your browser find a site it has never visited?
    reveal:
      body: It asks a DNS server for the address. That server asks further if needed – until one knows the answer. This usually takes only milliseconds.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: DNS translates names into IP addresses.
          right: true
        - text: HTTPS means a site is trustworthy.
          right: false
          why: "It only means: the connection is encrypted. Scammers use HTTPS too."
        - text: An IPv6 address has 128 bits.
          right: true

  - kind: problem
    id: intro-c1
    widget: bits
    prompt: Your phone has the address 192.168.0.42 on the Wi-Fi. Set the last byte, the 42, in bits.
    params:
      bits: 8
      showValue: false
    answer:
      value: 42
    hints:
      - The lamps count 128, 64, 32, 16, 8, 4, 2 and 1.
      - Take 32 and 8 – then 2 is still missing.
    explanation: 42 = 32 + 8 + 2, so 00101010. Each of the four numbers in an IP address is a byte like this – 32 bits in all.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: IPv4 addresses (32 bits) have run out. IPv6 has 128 bits. How many bits were added?
    answer:
      value: 96
    hints:
      - 128 − 32.
    explanation: 96 extra bits – 2⁹⁶ times as many addresses. Enough for every grain of sand on Earth.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "A **subnet** such as 192.168.1.0/24 means: the first 24 bits of the address are the same for every device in it. The remaining 8 bits tell the devices apart."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: A network ends in /{{p}}. How many addresses does it cover?
    answer:
      value: "{{2 ** (32 - p)}}"
    feedback:
      - when: numval(state.input) == 2 ** p
        misconception: fixed-vs-free
        text: The {{p}} bits are fixed. The remaining {{32 - p}} are free.
    hints:
      - IPv4 addresses have 32 bits. How many of them are free?
      - With {{32 - p}} free bits there are 2 to the {{32 - p}} addresses.
    explanation: "32 − {{p}} = {{32 - p}} free bits, so {{2 ** (32 - p)}} addresses. Two are reserved: the network address and the broadcast address."
    difficulty: 2
    variants:
      params:
        p: int[20,30]
      defaults:
        p: 24

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: You open bank.de/account/history over HTTPS. What can someone on the same Wi-Fi still see?
    params:
      options:
        - label: That you are connected to bank.de – but not the page or content
          correct: true
        - label: Everything, including your password
          feedback: HTTPS encrypts all the content.
        - label: Nothing at all
          feedback: The destination must stay visible, or no packet finds its way.
    hints:
      - Routers must know where a packet is going.
      - The path /account/history is in the encrypted part.
    explanation: The IP address and usually the server name remain visible. Path, forms and content are encrypted.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: At home ten devices share **one** public IP address. How does the reply reach the right device?
    params:
      options:
        - label: The router remembers which device asked for what and translates the addresses
          correct: true
        - label: The reply goes to all devices
          feedback: Then everyone could read everything.
        - label: Each device does have its own public address
          feedback: In the home network they only have private addresses.
    hints:
      - The router keeps a table of ongoing connections.
    explanation: "**NAT** has delayed the exhaustion of IPv4 addresses by decades."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: IPv6 has $2^{128}$ addresses, about 3.4 · 10 to the what? Give the exponent.
    answer:
      value: 38
    hints:
      - $2^{10}$ is about $10^3$.
      - 128 bits are 12.8 times 10 bits – so about 10 to the 38.
    explanation: $2^{128}$ ≈ 3.4 · $10^{38}$. That is billions of addresses for every grain of sand on Earth.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: How does your browser know it is really talking to bank.de and not to a fraudster?
    params:
      options:
        - label: bank.de shows a certificate signed by a trusted authority
          correct: true
        - label: From the green logo on the page
          feedback: Anyone can copy a logo.
        - label: From the padlock alone
          feedback: The padlock shows encryption – the check happens via the certificate.
    hints:
      - Who vouches that a key belongs to bank.de?
      - The browser knows a list of trusted certificate authorities.
    explanation: "A certificate authority signs: »This key belongs to bank.de.« The browser checks the signature. A fraudster cannot get such a certificate."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: order
    prompt: This is how an HTTPS connection starts. Put the steps in the right order.
    params:
      items:
        - label: The browser greets the server
        - label: The server sends its certificate
        - label: The browser checks the signature
        - label: Both agree on a shared key
        - label: Encrypted data flows
    hints:
      - First check who is there – then exchange secrets.
      - Without a shared key there is no encrypted data.
    explanation: That is the TLS handshake in short. The shared key comes from a key exchange such as Diffie–Hellman.
    difficulty: 3

srs:
  cards_from: [begriffe, schloss]
