id: cs.internet.speed
type: concept
title: Wie schnell ist schnell?
summary: Bits, Bytes und Ping.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: mbyte
    widget: numeric
    prompt: Eine Leitung schafft {{r}} Megabit pro Sekunde. Wie viele Megabyte sind das pro Sekunde?
    params: { unit: MB/s }
    answer: { value: "{{r / 8}}" }
    feedback:
      - when: "numval(state.input) == r"
        misconception: bit-byte
        text: Bit und Byte sind nicht dasselbe – ein Byte hat 8 Bit.
    hints:
      - 8 Bit = 1 Byte.
    explanation: "{{r}} : 8 = {{r / 8}} MB/s."
    variants:
      params: { r: "choice[16,40,80,160,400]" }
      defaults: { r: 80 }

  - kind: problem
    id: download
    widget: numeric
    prompt: Wie viele Sekunden dauert ein Download von {{g}} GB bei 100 Mbit/s?
    params: { unit: s }
    answer: { value: "{{g * 80}}" }
    hints:
      - 1 GB = 1000 MB = 8000 Megabit.
    explanation: "{{g}} · 8000 : 100 = {{g * 80}} Sekunden."
    variants:
      params: { g: "int[1,9]" }
      defaults: { g: 3 }

  - kind: explain
    id: s3
    body: |
      **Bandbreite** sagt, wie viel pro Sekunde durchpasst. **Ping** sagt, wie lange ein einzelnes Paket hin und zurück braucht. Für manches zählt das eine, für manches das andere.

  - kind: problem
    id: was-zaehlt
    widget: buckets
    prompt: Was ist hier wichtiger?
    params:
      buckets: [{ label: Bandbreite }, { label: Ping }]
      items:
        - { label: 4K-Film streamen, bucket: Bandbreite }
        - { label: Großes Update laden, bucket: Bandbreite }
        - { label: Online-Spiel, bucket: Ping }
        - { label: Videocall, bucket: Ping }
    hints:
      - Geht es um viele Daten oder um schnelle Reaktion?
    explanation: Große Datenmengen brauchen Bandbreite, Reaktionen brauchen kurzen Ping.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Film in 4K braucht 25 Mbit/s. Wie viele Gigabyte sind das in 2 Stunden?
    params:
      unit: GB
    answer:
      value: 22.5
    hints:
      - 25 Mbit/s sind 3,125 MB/s. Mal 7200 Sekunden.
    explanation: 22 500 MB = 22,5 GB.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was passiert, wenn du eine Webadresse eintippst und Enter drückst?"
    params:
      keywords:
        - - dns
          - name
          - adresse
          - address
        - - ip
        - - paket
          - packet
          - anfrage
          - request
        - - server
          - antwort
          - response
          - reply
      min: 3
      sample: Der Browser fragt per DNS nach der IP-Adresse zum Namen. Dann schickt er eine Anfrage in Paketen an den Server, und der Server schickt die Seite als Antwort zurück.
    difficulty: 3

srs:
  cards_from: [mbyte, was-zaehlt]
