id: cs.internet.packets
type: concept
title: Data packets
summary: Everything is cut into small pieces.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Mail in pieces
    body: Your message does not travel in one piece but in **numbered packets**. On the way they often get mixed up. Swap the bars until the numbers are in order. What does it say then?
    visual:
      widget: swap
      interactive: true
      params:
        values:
          - 3
          - 1
          - 5
          - 2
          - 4
        labels:
          - L
          - H
          - O
          - E
          - L
        adjacent: false

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: via how many intermediate stops (routers) does a data packet typically travel to a website?"
    params:
      min: 1
      max: 200
    answer:
      value: 15
      tolerance: 8
    explanation: Usually 10 to 20 – and that within a few hundredths of a second.

  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: A 3 MB photo is cut into packets of 1,500 bytes each. How many packets is that?
    body: Use 1 MB = 1,000,000 bytes.
    params: { unit: packets }
    answer: { value: 2000 }
    hints:
      - 3,000,000 divided by 1,500.
    explanation: 3,000,000 / 1,500 = 2,000 packets.

  - kind: explain
    id: s2
    body: |
      Nothing travels in one piece on the internet. Everything is cut into **packets**. Each one carries a sender, a destination and a number.
      At the destination, they are put back together.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the journey of a message in the right order.
    params:
      items:
        - { label: The message is cut into packets. }
        - { label: Each packet gets a destination and a number. }
        - { label: Routers forward the packets. }
        - { label: The packets arrive mixed up. }
        - { label: The recipient sorts them by number. }
    hints:
      - Cut first, reassemble last.
    explanation: Packets can take different paths. The numbers restore the order.

  - kind: problem
    id: verloren
    widget: choice
    prompt: A packet gets lost on the way. What usually happens?
    params:
      options:
        - { label: The recipient notices and requests it again., correct: true }
        - { label: The whole file is broken., feedback: "That is what the numbers are for – exactly one is missing, and it gets sent again." }
        - { label: Nobody notices., feedback: "The gap in the number sequence stands out." }
    hints:
      - What are the numbers for?
    explanation: If a number is missing, exactly that packet is sent again.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The packets of a message arrive in the wrong order. What now?
    params:
      options:
        - label: The receiver sorts them by their numbers
          correct: true
        - label: The message is lost
          feedback: That is exactly why every packet carries a number.
        - label: The routers sort them on the way
          feedback: Routers only forward – sorting happens at the destination.
    hints:
      - What else is on every packet besides sender and destination?
    explanation: The **TCP** protocol numbers, acknowledges and re-requests what was lost.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: A packet is 1500 bytes. 40 bytes of it are the header with addresses and number. What percentage is that? Round to one decimal.
    params:
      unit: "%"
    answer:
      value: 2.7
      tolerance: 0.05
    hints:
      - Divide 40 by 1500.
      - Times 100 gives a percentage.
    explanation: 40 / 1500 ≈ 0.027 = 2.7 %. Almost the whole packet is payload – only a small part is overhead.
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: "A **protocol** is a fixed agreement. On the net several are stacked: IP takes packets to the right address. TCP makes sure everything arrives complete and in order. HTTP says what is inside."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: match
    prompt: Which layer takes care of what?
    params:
      pairs:
        - left: HTTP
          right: Which web page do I want?
        - left: TCP
          right: Complete and in order
        - left: IP
          right: Address and route through the net
        - left: Wi-Fi
          right: To the next device
    hints:
      - "From top to bottom: from content to radio wave."
      - TCP numbers and acknowledges packets.
    explanation: Each layer uses the one below without knowing its details. That is why HTTP works over Wi-Fi just as over fibre.
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: order
    prompt: Before TCP sends data, both sides make an agreement. Put this handshake in the right order.
    params:
      items:
        - label: SYN – »I want to talk«
        - label: SYN-ACK – »Got it, me too«
        - label: ACK – »Got it«
        - label: Data flows
    hints:
      - Who starts?
      - Each side acknowledges the other once.
    explanation: The three-way handshake. Afterwards both know the starting numbers of the packets.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Video calls often use UDP instead of TCP – without acknowledgement and without resending. Why?
    params:
      options:
        - label: A late packet is useless – better a short glitch than a delay
          correct: true
        - label: UDP is more secure
          feedback: It is actually less reliable.
        - label: TCP cannot carry video
          feedback: Streaming services use TCP – buffering is fine there.
    hints:
      - What use is a word that arrives two seconds late?
    explanation: Reliable or fast – every protocol is a trade-off for its purpose.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: TCP sends at most 64 KB and then waits for an acknowledgement. A ping takes 100 ms. How many KB per second can the connection manage at most?
    params:
      unit: KB/s
    answer:
      value: 640
    feedback:
      - when: numval(state.input) == 6.4
        misconception: divide-wrong
        text: Ten pings fit into one second, not a tenth of one.
    hints:
      - How many rounds of sending and waiting fit into one second?
      - 1 s / 0.1 s = 10 rounds of 64 KB each.
    explanation: 10 · 64 KB = 640 KB/s – no matter how fat the line. That is why modern connections may have much more data »in flight«.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Why split data into packets at all instead of sending it in one piece?
    params:
      options:
        - label: Many users can share the lines, and after an error only a small piece is resent
          correct: true
        - label: Small packets travel faster than light
          feedback: Packets also travel at most at light speed.
        - label: Because routers only know small files
          feedback: Routers do not know files at all – only packets.
    hints:
      - Think of a motorway with many small cars.
      - What happens if one huge block gets damaged on the way?
    explanation: Packet switching shares lines fairly and makes errors cheap. The old phone network reserved a whole line per call.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: TCP resends lost packets.
          right: true
          why: If an acknowledgement is missing, TCP sends again.
        - text: UDP guarantees the order.
          right: false
          why: UDP just sends – without order checks or resending.
        - text: For live video UDP is often better.
          right: true
          why: A late frame is worthless – better show the next one.
        - text: Every packet takes the same route.
          right: false
          why: Routers decide per packet. Routes may change on the way.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how a file arrives complete even though packets get lost on the way.
    params:
      keywords:
        - - nummer
          - number
          - reihenfolge
          - order
          - sequence
        - - bestätig
          - ack
          - quittung
          - confirm
        - - neu
          - erneut
          - resend
          - again
          - wieder
      sample: Every packet gets a number. The receiver confirms what has arrived and sorts by number. If a confirmation is missing, the sender sends that packet again.
    difficulty: 3

srs:
  cards_from: [wie-viele, verloren]
