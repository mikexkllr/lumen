id: cs.internet.packets
type: concept
title: Data packets
summary: Everything is cut into small pieces.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: via how many intermediate stops (routers) does a data packet typically travel to a website?"
    params:
      min: 1
      max: 200
    answer:
      value: 15
      tolerance: 8
    explanation: Usually 10 to 20 – and that within a few hundredths of a second.


  - kind: problem
    id: wie-viele
    widget: numeric
    prompt: A 3 MB photo is cut into packets of 1,500 bytes each. How many packets is that?
    body: Use 1 MB = 1,000,000 bytes.
    params: { unit: packets }
    answer: { value: 2000 }
    hints:
      - 3,000,000 divided by 1,500.
    explanation: 3,000,000 / 1,500 = 2,000 packets.

  - kind: explain
    id: s2
    body: |
      Nothing travels in one piece on the internet. Everything is cut into **packets**. Each one carries a sender, a destination and a number.
      At the destination, they are put back together.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the journey of a message in the right order.
    params:
      items:
        - { label: The message is cut into packets. }
        - { label: Each packet gets a destination and a number. }
        - { label: Routers forward the packets. }
        - { label: The packets arrive mixed up. }
        - { label: The recipient sorts them by number. }
    hints:
      - Cut first, reassemble last.
    explanation: Packets can take different paths. The numbers restore the order.

  - kind: problem
    id: verloren
    widget: choice
    prompt: A packet gets lost on the way. What usually happens?
    params:
      options:
        - { label: The recipient notices and requests it again., correct: true }
        - { label: The whole file is broken., feedback: "That is what the numbers are for – exactly one is missing, and it gets sent again." }
        - { label: Nobody notices., feedback: "The gap in the number sequence stands out." }
    hints:
      - What are the numbers for?
    explanation: If a number is missing, exactly that packet is sent again.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The packets of a message arrive in the wrong order. What now?
    params:
      options:
        - label: The receiver sorts them by their numbers
          correct: true
        - label: The message is lost
          feedback: That is exactly why every packet carries a number.
        - label: The routers sort them on the way
          feedback: Routers only forward – sorting happens at the destination.
    hints:
      - What else is on every packet besides sender and destination?
    explanation: The **TCP** protocol numbers, acknowledges and re-requests what was lost.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Video calls often use UDP instead of TCP – without acknowledgement and without resending. Why?
    params:
      options:
        - label: A late packet is useless – better a short glitch than a delay
          correct: true
        - label: UDP is more secure
          feedback: It is actually less reliable.
        - label: TCP cannot carry video
          feedback: Streaming services use TCP – buffering is fine there.
    hints:
      - What use is a word that arrives two seconds late?
    explanation: Reliable or fast – every protocol is a trade-off for its purpose.
    difficulty: 3

srs:
  cards_from: [wie-viele, verloren]
