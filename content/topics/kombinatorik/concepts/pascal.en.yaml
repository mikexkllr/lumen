id: math.combinatorics.pascal
type: concept
title: Pascal's Triangle
summary: Each number is the sum of the two above it.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: naechste
    widget: numeric
    body: "Row 0: 1. Row 1: 1 1. Row 2: 1 2 1. Row 3: 1 3 3 1."
    prompt: Which number is in the middle of row 4?
    params: { placeholder: "Number" }
    answer: { value: 6 }
    hints:
      - Each number is the sum of the two above it.
    explanation: 3 + 3 = 6. Row 4 reads 1 4 6 4 1.

  - kind: explain
    id: s2
    body: |
      In **Pascal's triangle**, each number is the sum of the two above it.
      The numbers count selections: row 4 shows how many ways there are to choose k out of 4.

  - kind: problem
    id: wege
    widget: numeric
    prompt: On a grid, you may only go right or down. How many paths lead 2 steps right and 2 steps down?
    params: { unit: paths }
    answer: { value: 6 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: count-moves
        text: There are 4 steps – but the question is in which order.
    hints:
      - Which 2 of the 4 steps go right?
    explanation: 4 choose 2 = 6 – exactly the middle of row 4.

  - kind: problem
    id: summe
    widget: numeric
    prompt: What is the sum of all numbers in row {{n}}?
    params: { placeholder: "Sum" }
    answer: { value: "{{2 ** n}}" }
    hints:
      - Row 2 gives 4, row 3 gives 8.
    explanation: "Each row doubles the sum – $2^{ {{n}} } = {{2 ** n}}$."
    variants:
      params: { n: "int[4,10]" }
      defaults: { n: 5 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The coefficient of $x^2$ in $(1 + x)^5$ is in Pascal’s triangle. What is it?
    answer:
      value: 10
    hints:
      - Row 5 reads 1, 5, 10, 10, 5, 1.
    explanation: "This is the **binomial theorem**: the rows give the coefficients of (a + b)ⁿ."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Colouring all odd numbers in Pascal’s triangle produces …?
    params:
      options:
        - label: the Sierpinski triangle – a fractal
          correct: true
        - label: a chessboard pattern
          feedback: The gaps keep growing, shaped the same at every level.
        - label: no pattern
          feedback: A triangle of triangles appears – at every scale.
    hints:
      - Rows 2, 4, 8 … consist only of even numbers inside.
    explanation: A simple counting pattern creates a fractal – self-similarity at every scale.
    difficulty: 3

srs:
  cards_from: [wege, summe]
