id: math.combinatorics.lab
type: concept
title: Wege-Labor
summary: Kürzeste Wege zählen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: weg
    widget: network
    prompt: Tippe einen kürzesten Weg von A nach B durch das Straßengitter.
    params:
      start: p00
      end: p22
      aspect: 0.8
      nodes:
        - { id: p00, x: 8, y: 92, label: A }
        - { id: p10, x: 50, y: 92 }
        - { id: p20, x: 92, y: 92 }
        - { id: p01, x: 8, y: 50 }
        - { id: p11, x: 50, y: 50 }
        - { id: p21, x: 92, y: 50 }
        - { id: p02, x: 8, y: 8 }
        - { id: p12, x: 50, y: 8 }
        - { id: p22, x: 92, y: 8, label: B }
      edges:
        - { a: p00, b: p10 }
        - { a: p10, b: p20 }
        - { a: p01, b: p11 }
        - { a: p11, b: p21 }
        - { a: p02, b: p12 }
        - { a: p12, b: p22 }
        - { a: p00, b: p01 }
        - { a: p01, b: p02 }
        - { a: p10, b: p11 }
        - { a: p11, b: p12 }
        - { a: p20, b: p21 }
        - { a: p21, b: p22 }
    hints:
      - Nur nach rechts und nach oben – vier Schritte.
    explanation: Jeder kürzeste Weg besteht aus 2-mal rechts und 2-mal oben – in irgendeiner Reihenfolge.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: Wie viele verschiedene kürzeste Wege gibt es von A nach B?
    params: { unit: Wege }
    answer: { value: 6 }
    hints:
      - Wähle, an welchen 2 der 4 Schritte du nach oben gehst.
    explanation: Aus 4 Schritten 2 für »oben« wählen – 6 Möglichkeiten.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Wie viele Möglichkeiten gibt es?
    params:
      pairs:
        - { left: 3 Bücher anordnen, right: "6" }
        - { left: 2 aus 5 Freunden einladen, right: "10" }
        - { left: PIN mit 2 Ziffern, right: "100" }
    hints:
      - Reihenfolge wichtig? Mit Wiederholung?
    explanation: "3! = 6, 5 · 4 : 2 = 10, 10 · 10 = 100."

  - kind: problem
    id: groesse
    widget: order
    prompt: Ordne von klein nach groß.
    params:
      items:
        - { label: "4! = 4 · 3 · 2 · 1" }
        - { label: "2 hoch 5" }
        - { label: "5!" }
        - { label: "10 hoch 3" }
    hints:
      - Rechne jede Zahl kurz aus.
    explanation: 24, 32, 120, 1000 – Fakultäten wachsen schnell, Zehnerpotenzen noch schneller.

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In einem Gitter gehst du 4 Schritte nach rechts und 3 nach oben. Wie viele kürzeste Wege gibt es?
    answer:
      value: 35
    hints:
      - Wähle aus 7 Schritten die 3 aus, die nach oben gehen.
    explanation: "7 · 6 · 5 : 6 = 35. Wege zählen ist Auswählen."
    difficulty: 3

srs:
  cards_from: [anzahl, zuordnen]
