id: math.combinatorics.choose
type: concept
title: Auswählen ohne Reihenfolge
summary: Handschläge, Teams und Lotto.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zwei Beläge, bitte!
    body: "Die Pizzeria bietet fünf Beläge, du darfst zwei wählen. Tippe zwei an und merk dir das Paar. Wie viele verschiedene Paare gibt es? Achtung: Bei der Auswahl ist die **Reihenfolge egal**."
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 1
        cols: 5
        labels:
          - - 🧀
            - 🍄
            - 🌶️
            - 🫒
            - 🍍
        counter: true

  - kind: problem
    id: haende
    widget: numeric
    prompt: "{{n}} Leute geben sich alle einmal die Hand. Wie viele Handschläge sind das?"
    params: { unit: Handschläge }
    answer: { value: "{{n * (n - 1) / 2}}" }
    feedback:
      - when: "numval(state.input) == n * (n - 1)"
        misconception: double-count
        text: So zählst du jeden Handschlag doppelt – A mit B ist B mit A.
    hints:
      - Jeder gibt {{n - 1}} anderen die Hand. Aber jeder Handschlag hat zwei Beteiligte.
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}}."
    variants:
      params: { n: "int[4,12]" }
      defaults: { n: 6 }

  - kind: explain
    id: s2
    body: |
      Ist die **Reihenfolge egal**, teilt man durch die Zahl der Reihenfolgen.
      2 aus 5 auswählen: 5 · 4 = 20 geordnet, geteilt durch 2! = 10.

  - kind: problem
    id: wichtig
    widget: buckets
    prompt: Zählt hier die Reihenfolge?
    params:
      buckets: [{ label: Reihenfolge zählt }, { label: egal }]
      items:
        - { label: PIN-Code, bucket: Reihenfolge zählt }
        - { label: Siegerpodest, bucket: Reihenfolge zählt }
        - { label: Wörter aus Buchstaben, bucket: Reihenfolge zählt }
        - { label: Lottozahlen, bucket: egal }
        - { label: Pizzabeläge, bucket: egal }
        - { label: Ein Team aus 3 Leuten, bucket: egal }
    hints:
      - Ändert sich etwas, wenn man die Auswahl umsortiert?
    explanation: Bei PIN und Podest ändert Umsortieren alles, bei Pizza und Teams nichts.

  - kind: problem
    id: team
    widget: numeric
    prompt: Aus 6 Leuten wird ein Team aus 3 gebildet. Wie viele Teams sind möglich?
    params: { unit: Teams }
    answer: { value: 20 }
    feedback:
      - when: "numval(state.input) == 120"
        misconception: ordered
        text: Das sind geordnete Auswahlen. Teile noch durch 3! = 6.
    hints:
      - 6 · 5 · 4 geordnet, dann durch 3 · 2 · 1.
    explanation: 120 / 6 = 20 Teams.

  - kind: problem
    id: lotto
    widget: choice
    prompt: Wie groß ist die Chance auf 6 Richtige im Lotto 6 aus 49?
    params:
      options:
        - { label: Etwa 1 zu 14 Millionen, correct: true }
        - { label: Etwa 1 zu 49, feedback: "Das wäre für eine einzige Zahl." }
        - { label: Etwa 1 zu 300 000, feedback: "Noch viel kleiner." }
    hints:
      - Es gibt »49 über 6« Möglichkeiten.
    explanation: 49 über 6 = 13 983 816. Ein Tipp trifft genau einen davon.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Lottozahlen ziehen
          right: false
        - text: Ein Zahlenschloss öffnen
          right: true
        - text: Ein Team aus der Klasse wählen
          right: false
        - text: Gold, Silber, Bronze vergeben
          right: true
      left: Reihenfolge egal
      right: Reihenfolge zählt

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Berechne $\binom{8}{3}$ – 3 aus 8 auswählen.
    answer:
      value: 56
    hints:
      - 8 · 7 · 6 geteilt durch 3 · 2 · 1.
    explanation: "336 : 6 = 56."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "k aus n auswählen: erst geordnet n · (n − 1) · … ziehen, dann durch k! teilen. Kurz: der **Binomialkoeffizient** $\\binom{n}{k} = \\frac{n!}{k!\\,(n-k)!}$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Aus {{n}} Leuten wird ein Team aus 3 gewählt. Wie viele Teams sind möglich?
    answer:
      value: "{{n * (n - 1) * (n - 2) / 6}}"
    feedback:
      - when: numval(state.input) == n * (n - 1) * (n - 2)
        misconception: ordered-count
        text: Das zählt jedes Team 6-mal – einmal pro Reihenfolge. Teile durch 3! = 6.
    hints:
      - "Geordnet: {{n}} · {{n - 1}} · {{n - 2}}."
      - Jedes Team kommt in 3! = 6 Reihenfolgen vor.
    explanation: "{{n}} · {{n - 1}} · {{n - 2}} : 6 = {{n * (n - 1) * (n - 2) / 6}}."
    difficulty: 2
    variants:
      params:
        n: int[5,12]
      defaults:
        n: 7

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Ein Verein mit 10 Mitgliedern wählt einen Vorsitz und zwei gleichberechtigte Beisitzer. Wie viele Möglichkeiten gibt es?
    answer:
      value: 360
    feedback:
      - when: numval(state.input) == 720
        misconception: ordered-deputies
        text: Die zwei Beisitzer sind gleichberechtigt – ihre Reihenfolge zählt nicht.
      - when: numval(state.input) == 120
        misconception: all-unordered
        text: Der Vorsitz ist ein besonderes Amt. Wer es hat, macht einen Unterschied.
    hints:
      - "Erst den Vorsitz: 10 Möglichkeiten."
      - Dann 2 aus den übrigen 9 ohne Reihenfolge.
    explanation: 10 · $\binom{9}{2}$ = 10 · 36 = 360. Geordnete und ungeordnete Teile darf man mischen – die Produktregel hält alles zusammen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist $\binom{10}{3} = \binom{10}{7}$?
    params:
      options:
        - label: Wer 3 auswählt, lässt zugleich 7 übrig
          correct: true
        - label: Weil 3 + 7 = 10 eine runde Zahl ist
          feedback: Es gilt für jedes n und k, nicht nur für 10.
        - label: Das ist Zufall
          feedback: Jede Auswahl bestimmt eindeutig ihren Rest.
    hints:
      - Denk an die Leute, die **nicht** gewählt werden.
    explanation: Jede 3er-Auswahl gehört zu genau einem 7er-Rest. Solche Paarungen heißen **Bijektion**.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Wie viele Zahlen bis 100 sind durch 2 **oder** 3 teilbar? 50 plus 33 zählt die Sechser doppelt. Also zieht man sie einmal ab. Das ist **Inklusion-Exklusion**: |A ∪ B| = |A| + |B| − |A ∩ B|."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wie viele Zahlen von 1 bis {{N}} sind durch 2 oder durch 3 teilbar?
    answer:
      value: "{{N / 2 + N / 3 - N / 6}}"
    feedback:
      - when: numval(state.input) == N / 2 + N / 3
        misconception: double-count
        text: Die Vielfachen von 6 hast du doppelt gezählt.
    hints:
      - "Durch 2: {{N / 2}}, durch 3: {{N / 3}}."
      - Beides – also durch 6 – zieh einmal ab.
    explanation: "{{N / 2}} + {{N / 3}} − {{N / 6}} = {{N / 2 + N / 3 - N / 6}}."
    difficulty: 3
    variants:
      params:
        N: step[60,600,60]
      defaults:
        N: 120

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Wie viele Zahlen von 1 bis 1000 sind durch 2, 3 oder 5 teilbar?
    answer:
      value: 734
    feedback:
      - when: numval(state.input) == 1033
        misconception: no-exclusion
        text: Du hast nur addiert. Die Überschneidungen sind mehrfach gezählt.
      - when: numval(state.input) == 701
        misconception: forgot-triple
        text: Die Zahlen, die durch 30 teilbar sind, hast du ganz herausgeworfen. Füge sie einmal wieder dazu.
    hints:
      - 500 + 333 + 200, dann die Paare 6, 10, 15 abziehen.
      - "Die Vielfachen von 30 kommen am Ende wieder dazu: + 33."
    explanation: 500 + 333 + 200 − 166 − 100 − 66 + 33 = 734. Plus, minus, plus – so wird jede Zahl genau einmal gezählt.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum zieht man bei »A oder B« die Schnittmenge ab?"
    params:
      keywords:
        - - doppelt
          - zweimal
          - twice
          - double
        - - beide
          - schnitt
          - both
          - overlap
          - intersection
        - - einmal
          - once
          - genau
          - exactly
      sample: Wer in A und B zugleich ist, wird beim Addieren von A und B doppelt gezählt. Zieht man die Schnittmenge einmal ab, zählt jeder genau einmal.
    explanation: Addieren zählt die Überschneidung doppelt, Abziehen korrigiert das. Bei drei Mengen muss man die Dreifach-Überschneidung wieder addieren.
    difficulty: 3

srs:
  cards_from: [haende, team]
