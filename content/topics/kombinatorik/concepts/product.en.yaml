id: math.combinatorics.product
type: concept
title: The Product Rule
summary: Possibilities get multiplied.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many different 4-digit PINs are there?"
    params:
      min: 10
      max: 1000000
      scale: log
    answer:
      value: 10000
      within: 30
    explanation: 10 · 10 · 10 · 10 = 10,000. Each digit multiplies the options.


  - kind: problem
    id: outfits
    widget: numeric
    prompt: You have {{h}} pairs of pants and {{s}} shirts. How many different outfits can you wear?
    params: { unit: outfits }
    answer: { value: "{{h * s}}" }
    feedback:
      - when: "numval(state.input) == h + s"
        misconception: add-not-multiply
        text: Every shirt goes with every pair of pants. So multiply.
    hints:
      - How many shirts go with a single pair of pants?
    explanation: "{{h}} · {{s}} = {{h * s}} outfits."
    variants:
      params: { h: "int[2,5]", s: "int[3,7]" }
      defaults: { h: 3, s: 4 }

  - kind: explain
    id: s2
    body: |
      **Product rule:** If there are a options for the first step and b for the second, there are a · b combinations.

  - kind: problem
    id: menue
    widget: numeric
    prompt: A menu has 3 starters, 4 main courses, and 2 desserts. How many menus are there?
    params: { unit: menus }
    answer: { value: 24 }
    feedback:
      - when: "numval(state.input) == 9"
        misconception: add-not-multiply
        text: Every starter goes with every main course and every dessert. Multiply.
    hints:
      - 3 · 4 · 2.
    explanation: 3 · 4 · 2 = 24.

  - kind: problem
    id: kennzeichen
    widget: choice
    prompt: A code has two letters (A–Z) followed by three digits. How many codes are there?
    params:
      options:
        - { label: "676,000", correct: true }
        - { label: "26,000", feedback: "There are two letters – so 26 · 26." }
        - { label: "1,026", feedback: "Do not add. Each position multiplies." }
    hints:
      - 26 · 26 · 10 · 10 · 10.
    explanation: 26 · 26 · 1000 = 676,000.

  - kind: explain
    id: s5
    body: Why does it get so big so fast?
    reveal:
      body: Each new choice multiplies everything that was already possible. That is why combinations explode – a blessing for passwords, a curse for planning.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many three-digit numbers have all **different** digits?
    answer:
      value: 648
    hints:
      - 9 options in front (no 0), then 9, then 8.
    explanation: 9 · 9 · 8 = 648.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A password has 8 characters from 26 lower-case letters. How many digits does the number of possibilities have?
    answer:
      value: 12
    hints:
      - 26⁸ ≈ 2 · 10¹¹.
    explanation: About 209 billion – 12 digits. Every extra character makes it 26 times harder.
    difficulty: 3

srs:
  cards_from: [outfits, menue]
