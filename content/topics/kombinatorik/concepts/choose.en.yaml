id: math.combinatorics.choose
type: concept
title: Choosing Without Order
summary: Handshakes, teams, and the lottery.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: haende
    widget: numeric
    prompt: "{{n}} people each shake hands with everyone else once. How many handshakes is that?"
    params: { unit: handshakes }
    answer: { value: "{{n * (n - 1) / 2}}" }
    feedback:
      - when: "numval(state.input) == n * (n - 1)"
        misconception: double-count
        text: That counts every handshake twice – A with B is B with A.
    hints:
      - Everyone shakes hands with {{n - 1}} others. But each handshake has two people.
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}}."
    variants:
      params: { n: "int[4,12]" }
      defaults: { n: 6 }

  - kind: explain
    id: s2
    body: |
      If the **order does not matter**, divide by the number of orderings.
      Choosing 2 out of 5: 5 · 4 = 20 ordered, divided by 2! = 10.

  - kind: problem
    id: wichtig
    widget: buckets
    prompt: Does order matter here?
    params:
      buckets: [{ label: order matters }, { label: order does not matter }]
      items:
        - { label: PIN code, bucket: order matters }
        - { label: Winners' podium, bucket: order matters }
        - { label: Words from letters, bucket: order matters }
        - { label: Lottery numbers, bucket: order does not matter }
        - { label: Pizza toppings, bucket: order does not matter }
        - { label: A team of 3 people, bucket: order does not matter }
    hints:
      - Does anything change if you rearrange the selection?
    explanation: With a PIN or podium, rearranging changes everything. With pizza or teams, it changes nothing.

  - kind: problem
    id: team
    widget: numeric
    prompt: A team of 3 is formed from 6 people. How many teams are possible?
    params: { unit: teams }
    answer: { value: 20 }
    feedback:
      - when: "numval(state.input) == 120"
        misconception: ordered
        text: Those are ordered choices. Also divide by 3! = 6.
    hints:
      - 6 · 5 · 4 ordered, then divide by 3 · 2 · 1.
    explanation: 120 / 6 = 20 teams.

  - kind: problem
    id: lotto
    widget: choice
    prompt: What is the chance of getting all 6 right in a 6-from-49 lottery?
    params:
      options:
        - { label: About 1 in 14 million, correct: true }
        - { label: About 1 in 49, feedback: "That would be for a single number." }
        - { label: "About 1 in 300,000", feedback: "Much smaller still." }
    hints:
      - There are “49 choose 6” possibilities.
    explanation: 49 choose 6 = 13,983,816. One ticket hits exactly one of them.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Drawing lottery numbers
          right: false
        - text: Opening a combination lock
          right: true
        - text: Picking a team from the class
          right: false
        - text: Awarding gold, silver, bronze
          right: true
      left: Order irrelevant
      right: Order matters

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Compute $\binom{8}{3}$ – choosing 3 out of 8.
    answer:
      value: 56
    hints:
      - 8 · 7 · 6 divided by 3 · 2 · 1.
    explanation: 336 ÷ 6 = 56.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Choosing k out of n: first draw in order n · (n − 1) · …, then divide by k!. In short: the **binomial coefficient** $\\binom{n}{k} = \\frac{n!}{k!\\,(n-k)!}$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: A team of 3 is picked from {{n}} people. How many teams are possible?
    answer:
      value: "{{n * (n - 1) * (n - 2) / 6}}"
    feedback:
      - when: numval(state.input) == n * (n - 1) * (n - 2)
        misconception: ordered-count
        text: That counts each team 6 times – once per order. Divide by 3! = 6.
    hints:
      - "In order: {{n}} · {{n - 1}} · {{n - 2}}."
      - Each team appears in 3! = 6 orders.
    explanation: "{{n}} · {{n - 1}} · {{n - 2}} / 6 = {{n * (n - 1) * (n - 2) / 6}}."
    difficulty: 2
    variants:
      params:
        n: int[5,12]
      defaults:
        n: 7

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A club with 10 members elects a chair and two equal deputies. How many ways are there?
    answer:
      value: 360
    feedback:
      - when: numval(state.input) == 720
        misconception: ordered-deputies
        text: The two deputies are equal – their order does not matter.
      - when: numval(state.input) == 120
        misconception: all-unordered
        text: The chair is a special post. Who holds it makes a difference.
    hints:
      - "First the chair: 10 options."
      - Then 2 of the remaining 9, order irrelevant.
    explanation: 10 · $\binom{9}{2}$ = 10 · 36 = 360. Ordered and unordered parts can be mixed – the product rule holds it all together.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is $\binom{10}{3} = \binom{10}{7}$?
    params:
      options:
        - label: Choosing 3 leaves 7 behind at the same time
          correct: true
        - label: Because 3 + 7 = 10 is a round number
          feedback: It holds for every n and k, not just 10.
        - label: That is coincidence
          feedback: Every selection uniquely determines its remainder.
    hints:
      - Think of the people who are **not** chosen.
    explanation: Every choice of 3 matches exactly one remainder of 7. Such pairings are called a **bijection**.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "How many numbers up to 100 are divisible by 2 **or** 3? 50 plus 33 counts the multiples of 6 twice. So you subtract them once. That is **inclusion–exclusion**: |A ∪ B| = |A| + |B| − |A ∩ B|."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: How many numbers from 1 to {{N}} are divisible by 2 or by 3?
    answer:
      value: "{{N / 2 + N / 3 - N / 6}}"
    feedback:
      - when: numval(state.input) == N / 2 + N / 3
        misconception: double-count
        text: You counted the multiples of 6 twice.
    hints:
      - "Divisible by 2: {{N / 2}}, by 3: {{N / 3}}."
      - Both – i.e. by 6 – subtract once.
    explanation: "{{N / 2}} + {{N / 3}} − {{N / 6}} = {{N / 2 + N / 3 - N / 6}}."
    difficulty: 3
    variants:
      params:
        N: step[60,600,60]
      defaults:
        N: 120

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: How many numbers from 1 to 1000 are divisible by 2, 3 or 5?
    answer:
      value: 734
    feedback:
      - when: numval(state.input) == 1033
        misconception: no-exclusion
        text: You only added. The overlaps are counted several times.
      - when: numval(state.input) == 701
        misconception: forgot-triple
        text: You removed the multiples of 30 completely. Add them back once.
    hints:
      - 500 + 333 + 200, then subtract the pairs 6, 10, 15.
      - "The multiples of 30 come back at the end: + 33."
    explanation: 500 + 333 + 200 − 166 − 100 − 66 + 33 = 734. Plus, minus, plus – this way every number is counted exactly once.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do you subtract the overlap when counting »A or B«?"
    params:
      keywords:
        - - doppelt
          - zweimal
          - twice
          - double
        - - beide
          - schnitt
          - both
          - overlap
          - intersection
        - - einmal
          - once
          - genau
          - exactly
      sample: Anyone in both A and B is counted twice when adding A and B. Subtracting the overlap once makes everyone count exactly once.
    explanation: Adding counts the overlap twice, subtracting fixes that. With three sets you must add the triple overlap back.
    difficulty: 3

srs:
  cards_from: [haende, team]
