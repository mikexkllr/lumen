id: math.combinatorics.lab
type: concept
title: Path Lab
summary: Counting shortest paths.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: weg
    widget: network
    prompt: Tap a shortest path from A to B through the street grid.
    params:
      start: p00
      end: p22
      aspect: 0.8
      nodes:
        - { id: p00, x: 8, y: 92, label: A }
        - { id: p10, x: 50, y: 92 }
        - { id: p20, x: 92, y: 92 }
        - { id: p01, x: 8, y: 50 }
        - { id: p11, x: 50, y: 50 }
        - { id: p21, x: 92, y: 50 }
        - { id: p02, x: 8, y: 8 }
        - { id: p12, x: 50, y: 8 }
        - { id: p22, x: 92, y: 8, label: B }
      edges:
        - { a: p00, b: p10 }
        - { a: p10, b: p20 }
        - { a: p01, b: p11 }
        - { a: p11, b: p21 }
        - { a: p02, b: p12 }
        - { a: p12, b: p22 }
        - { a: p00, b: p01 }
        - { a: p01, b: p02 }
        - { a: p10, b: p11 }
        - { a: p11, b: p12 }
        - { a: p20, b: p21 }
        - { a: p21, b: p22 }
    hints:
      - Only right and up – four steps.
    explanation: Every shortest path consists of 2 steps right and 2 steps up – in some order.

  - kind: problem
    id: anzahl
    widget: numeric
    prompt: How many different shortest paths are there from A to B?
    params: { unit: paths }
    answer: { value: 6 }
    hints:
      - Choose which 2 of the 4 steps go up.
    explanation: Choosing 2 of 4 steps for “up” – 6 possibilities.

  - kind: problem
    id: zuordnen
    widget: match
    prompt: How many possibilities are there?
    params:
      pairs:
        - { left: Arranging 3 books, right: "6" }
        - { left: Inviting 2 of 5 friends, right: "10" }
        - { left: PIN with 2 digits, right: "100" }
    hints:
      - Does order matter? Is repetition allowed?
    explanation: "3! = 6, 5 · 4 ÷ 2 = 10, 10 · 10 = 100."

  - kind: problem
    id: groesse
    widget: order
    prompt: Sort from small to large.
    params:
      items:
        - { label: "4! = 4 · 3 · 2 · 1" }
        - { label: "2 to the power of 5" }
        - { label: "5!" }
        - { label: "10 to the power of 3" }
    hints:
      - Work out each number quickly.
    explanation: 24, 32, 120, 1000 – factorials grow fast, powers of ten even faster.

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: On a grid you go {{r}} steps right and 2 steps up. How many shortest paths are there?
    answer:
      value: "{{(r + 2) * (r + 1) / 2}}"
    feedback:
      - when: numval(state.input) == r * 2
        misconception: multiply-steps
        text: "Do not multiply: you choose which 2 of the {{r + 2}} steps go up."
    hints:
      - Every path has {{r + 2}} steps, 2 of them up.
      - $\binom{r+2}{2}$.
    explanation: $\binom{ {{r + 2}} }{2}$ = {{r + 2}} · {{r + 1}} / 2 = {{(r + 2) * (r + 1) / 2}}.
    difficulty: 2
    variants:
      params:
        r: int[2,9]
      defaults:
        r: 4

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: You go 3 right and 3 up, but may never rise above the diagonal – never more up-steps than right-steps so far. How many paths remain?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 20
        misconception: all-paths
        text: Those are all paths. Many of them rise above the diagonal.
    hints:
      - Write paths as strings of R and U, e.g. RRURUU.
      - Every prefix needs at least as many R as U.
    explanation: "Exactly 5: RRRUUU, RRURUU, RRUURU, RURRUU, RURURU. Without the rule there would be $\\binom{6}{3} = 20$."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In a grid you take 4 steps right and 3 up. How many shortest paths are there?
    answer:
      value: 35
    hints:
      - From 7 steps choose the 3 that go up.
    explanation: 7 · 6 · 5 ÷ 6 = 35. Counting paths is choosing.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "1, 2, 5, 14, 42 … are the **Catalan numbers**. They count paths below the diagonal, correct bracketings and ways to cut a polygon into triangles. Formula: $C_n = \\frac{1}{n+1}\\binom{2n}{n}$."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: How many correct bracket sequences of 4 opening and 4 closing brackets are there, like (()())()?
    answer:
      value: 14
    feedback:
      - when: numval(state.input) == 70
        misconception: no-restriction
        text: 70 is $\binom{8}{4}$ – all strings, including wrong ones like ))((.
    hints:
      - Open = step right, close = step up.
      - $C_4 = \frac{1}{5}\binom{8}{4}$.
    explanation: $\frac{1}{5} \cdot 70 = 14$. Bracket strings are the same paths as on the grid – just written differently.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why are there exactly $\\binom{7}{3} = 35$ shortest paths for 4 right and 3 up?"
    params:
      keywords:
        - - sieben
          - seven
          - schritte
          - steps
        - - wählen
          - auswählen
          - choose
          - pick
          - welche
          - which
        - - oben
          - up
          - rechts
          - right
      sample: Every shortest path has 7 steps, 3 of them up. A path is fixed once I choose which 3 of the 7 steps go up. There are 7 choose 3 = 35 ways.
    explanation: "A path is a choice: which steps go up. That is why $\\binom{7}{3}$ counts the paths."
    difficulty: 3

srs:
  cards_from: [anzahl, zuordnen]
