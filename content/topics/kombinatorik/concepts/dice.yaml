id: math.combinatorics.dice
type: concept
title: Zählen für Chancen
summary: Günstige durch mögliche – richtig gezählt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sieben
    widget: numeric
    prompt: Zwei Würfel. Wie viele der 36 Ausgänge ergeben die Summe 7?
    params: { unit: Ausgänge }
    answer: { value: 6 }
    hints:
      - 1 + 6, 2 + 5, … und umgekehrt.
    explanation: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) – sechs Stück.

  - kind: explain
    body: |
      Bei zwei Würfeln ist 7 die häufigste Summe – sie hat die meisten Kombinationen.
      2 und 12 sind am seltensten, mit nur je einer.

  - kind: problem
    id: summe
    widget: numeric
    prompt: Wie wahrscheinlich ist die Summe {{s}} mit zwei Würfeln? Als Bruch.
    params: { placeholder: "z. B. 1/6" }
    answer: { value: "{{6 - abs(7 - s)}}/36" }
    hints:
      - "Zähle die Paare mit Summe {{s}}."
    explanation: "{{6 - abs(7 - s)}} von 36 Ausgängen."
    variants:
      params: { s: "int[2,12]" }
      constraints: ["s != 7"]
      defaults: { s: 9 }

  - kind: problem
    id: pasch
    widget: choice
    prompt: Wie wahrscheinlich ist ein Pasch – zwei gleiche Augenzahlen?
    params:
      layout: grid
      options:
        - { label: "1/6", correct: true }
        - { label: "1/36", feedback: "Das wäre ein bestimmter Pasch, etwa zwei Sechsen." }
        - { label: "1/2", feedback: "Zu hoch. Es gibt 6 Paschs von 36 Ausgängen." }
    hints:
      - Es gibt 6 Paschs.
    explanation: 6 von 36 = 1/6.

srs:
  cards_from: [summe, pasch]
