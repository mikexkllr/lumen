id: math.combinatorics.dice
type: concept
title: Zählen für Chancen
summary: Günstige durch mögliche – richtig gezählt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sieben
    widget: numeric
    prompt: Zwei Würfel. Wie viele der 36 Ausgänge ergeben die Summe 7?
    params: { unit: Ausgänge }
    answer: { value: 6 }
    hints:
      - 1 + 6, 2 + 5, … und umgekehrt.
    explanation: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) – sechs Stück.

  - kind: explain
    id: s2
    body: |
      Bei zwei Würfeln ist 7 die häufigste Summe – sie hat die meisten Kombinationen.
      2 und 12 sind am seltensten, mit nur je einer.

  - kind: problem
    id: summe
    widget: numeric
    prompt: Wie wahrscheinlich ist die Summe {{s}} mit zwei Würfeln? Als Bruch.
    params: { placeholder: "z. B. 1/6" }
    answer: { value: "{{6 - abs(7 - s)}}/36" }
    hints:
      - "Zähle die Paare mit Summe {{s}}."
    explanation: "{{6 - abs(7 - s)}} von 36 Ausgängen."
    variants:
      params: { s: "int[2,12]" }
      constraints: ["s != 7"]
      defaults: { s: 9 }

  - kind: problem
    id: pasch
    widget: choice
    prompt: Wie wahrscheinlich ist ein Pasch – zwei gleiche Augenzahlen?
    params:
      layout: grid
      options:
        - { label: "1/6", correct: true }
        - { label: "1/36", feedback: "Das wäre ein bestimmter Pasch, etwa zwei Sechsen." }
        - { label: "1/2", feedback: "Zu hoch. Es gibt 6 Paschs von 36 Ausgängen." }
    hints:
      - Es gibt 6 Paschs.
    explanation: 6 von 36 = 1/6.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie wahrscheinlich ist es, mit zwei Würfeln mindestens eine 6 zu werfen? Als Bruch.
    answer:
      value: 11/36
    feedback:
      - when: approx(numval(state.input), 12 / 36)
        misconception: double-count
        text: Du hast 1/6 + 1/6 gerechnet. Dabei zählst du den Sechserpasch doppelt.
    hints:
      - "Rechne über das Gegenteil: keine 6 bei beiden."
    explanation: 1 − (5/6)² = 11/36. Nicht 12/36 – der Sechserpasch würde doppelt gezählt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Das Geburtstagsproblem: Ab wie vielen Personen ist es wahrscheinlicher als nicht, dass zwei am selben Tag Geburtstag haben?"
    params:
      options:
        - label: "23"
          correct: true
        - label: "183"
          feedback: Es geht nicht um **deinen** Geburtstag, sondern um irgendein Paar.
        - label: "366"
          feedback: Dann wäre es sicher. Gefragt ist nur »über 50 %«.
    hints:
      - Bei 23 Personen gibt es 253 Paare.
    explanation: Die Zahl der Paare wächst quadratisch. Bei 23 Leuten liegt die Chance schon bei 50,7 %.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist die Augensumme 7 bei zwei Würfeln häufiger als die 12?"
    params:
      keywords:
        - - kombination
          - möglichkeit
          - weg
          - combination
          - way
          - outcome
        - - sechs
          - "6 "
          - six
        - - eine
          - einzig
          - nur
          - one
          - single
          - only
      sample: Für die 7 gibt es sechs Kombinationen, von 1 + 6 bis 6 + 1. Die 12 entsteht nur auf eine einzige Art, nämlich 6 + 6.
    difficulty: 3

srs:
  cards_from: [summe, pasch]
