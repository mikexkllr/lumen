id: math.combinatorics.dice
type: concept
title: Zählen für Chancen
summary: Günstige durch mögliche – richtig gezählt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: 36 Würfe auf einen Blick
    body: Würfelspiele sind voller Überraschungen. Jedes Feld hier ist ein Wurf mit zwei Würfeln, darin steht die **Augensumme**. Tippe alle Felder mit der Summe 4 an. Wie oft kommt sie vor – und welche Summe kommt am häufigsten?
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 6
        cols: 6
        counter: true
        labels:
          - - 2
            - 3
            - 4
            - 5
            - 6
            - 7
          - - 3
            - 4
            - 5
            - 6
            - 7
            - 8
          - - 4
            - 5
            - 6
            - 7
            - 8
            - 9
          - - 5
            - 6
            - 7
            - 8
            - 9
            - 10
          - - 6
            - 7
            - 8
            - 9
            - 10
            - 11
          - - 7
            - 8
            - 9
            - 10
            - 11
            - 12

  - kind: problem
    id: sieben
    widget: numeric
    prompt: Zwei Würfel. Wie viele der 36 Ausgänge ergeben die Summe 7?
    params: { unit: Ausgänge }
    answer: { value: 6 }
    hints:
      - 1 + 6, 2 + 5, … und umgekehrt.
    explanation: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) – sechs Stück.

  - kind: explain
    id: s2
    body: |
      Bei zwei Würfeln ist 7 die häufigste Summe – sie hat die meisten **Kombinationen**.
      2 und 12 sind am seltensten, mit nur je einer.

  - kind: problem
    id: summe
    widget: numeric
    prompt: Wie wahrscheinlich ist die Summe {{s}} mit zwei Würfeln? Als Bruch.
    params: { placeholder: "z. B. 1/6" }
    answer: { value: "{{6 - abs(7 - s)}}/36" }
    hints:
      - "Zähle die Paare mit Summe {{s}}."
    explanation: "{{6 - abs(7 - s)}} von 36 Ausgängen."
    variants:
      params: { s: "int[2,12]" }
      constraints: ["s != 7"]
      defaults: { s: 9 }

  - kind: problem
    id: pasch
    widget: choice
    prompt: Wie wahrscheinlich ist ein Pasch – zwei gleiche Augenzahlen?
    params:
      layout: grid
      options:
        - { label: "1/6", correct: true }
        - { label: "1/36", feedback: "Das wäre ein bestimmter Pasch, etwa zwei Sechsen." }
        - { label: "1/2", feedback: "Zu hoch. Es gibt 6 Paschs von 36 Ausgängen." }
    hints:
      - Es gibt 6 Paschs.
    explanation: 6 von 36 = 1/6.

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: Jedes Feld ist ein Wurf mit zwei Würfeln. Schalte alle Würfe mit der Augensumme 10 ein.
    params:
      rows: 6
      cols: 6
      counter: true
      labels:
        - - 2
          - 3
          - 4
          - 5
          - 6
          - 7
        - - 3
          - 4
          - 5
          - 6
          - 7
          - 8
        - - 4
          - 5
          - 6
          - 7
          - 8
          - 9
        - - 5
          - 6
          - 7
          - 8
          - 9
          - 10
        - - 6
          - 7
          - 8
          - 9
          - 10
          - 11
        - - 7
          - 8
          - 9
          - 10
          - 11
          - 12
    answer:
      pattern:
        - ......
        - ......
        - ......
        - .....#
        - ....#.
        - ...#..
    hints:
      - Such die Felder, in denen 10 steht – sie liegen auf einer schrägen Linie.
      - Es sind 4 + 6, 5 + 5 und 6 + 4.
    explanation: 3 von 36 Würfen ergeben 10. Die Chance ist also $\frac{3}{36} = \frac{1}{12}$.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie wahrscheinlich ist es, mit zwei Würfeln mindestens eine 6 zu werfen? Als Bruch.
    answer:
      value: 11/36
    feedback:
      - when: approx(numval(state.input), 12 / 36)
        misconception: double-count
        text: Du hast 1/6 + 1/6 gerechnet. Dabei zählst du den Sechserpasch doppelt.
    hints:
      - "Rechne über das Gegenteil: keine 6 bei beiden."
    explanation: 1 − (5/6)² = 11/36. Nicht 12/36 – der Sechserpasch würde doppelt gezählt.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "»Mindestens eins« ist mühsam zu zählen. Leichter ist das **Gegenereignis** »keins«: P(mindestens eine 6) = 1 − P(keine 6)."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: "Der Chevalier de Méré wettete im 17. Jahrhundert: In 4 Würfen fällt mindestens eine 6. Wie groß ist seine Chance in Prozent? Auf eine Stelle."
    params:
      unit: "%"
    answer:
      value: 51.8
      tolerance: 0.15
    feedback:
      - when: abs(numval(state.input) - 66.7) < 0.2
        misconception: add-probabilities
        text: 4 · ⅙ wäre richtig, wenn sich die Fälle nicht überschnitten. Rechne lieber mit »keine 6«.
    hints:
      - "Keine 6 in einem Wurf: 5/6. In vier Würfen: (5/6)⁴."
      - 1 − 625/1296.
    explanation: 1 − (5/6)⁴ = 1 − 625/1296 ≈ 0,518. Gut 51,8 % – die Wette lohnte sich auf Dauer.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: "Seine zweite Wette: In 24 Würfen mit zwei Würfeln fällt mindestens ein Sechserpasch. Wie groß ist die Chance in Prozent? Auf eine Stelle."
    params:
      unit: "%"
    answer:
      value: 49.1
      tolerance: 0.15
    hints:
      - "Kein Sechserpasch in einem Wurf: 35/36."
      - 1 − (35/36)²⁴.
    explanation: 1 − (35/36)²⁴ ≈ 0,491 – knapp unter 50 %. De Méré verlor und fragte Pascal. Aus dem Briefwechsel mit Fermat entstand 1654 die Wahrscheinlichkeitsrechnung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Das Geburtstagsproblem: Ab wie vielen Personen ist es wahrscheinlicher als nicht, dass zwei am selben Tag Geburtstag haben?"
    params:
      options:
        - label: "23"
          correct: true
        - label: "183"
          feedback: Es geht nicht um **deinen** Geburtstag, sondern um irgendein Paar.
        - label: "366"
          feedback: Dann wäre es sicher. Gefragt ist nur »über 50 %«.
    hints:
      - Bei 23 Personen gibt es 253 Paare.
    explanation: Die Zahl der Paare wächst quadratisch. Bei 23 Leuten liegt die Chance schon bei 50,7 %.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist die Augensumme 7 bei zwei Würfeln häufiger als die 12?"
    params:
      keywords:
        - - kombination
          - möglichkeit
          - weg
          - combination
          - way
          - outcome
        - - sechs
          - "6 "
          - six
        - - eine
          - einzig
          - nur
          - one
          - single
          - only
      sample: Für die 7 gibt es sechs Kombinationen, von 1 + 6 bis 6 + 1. Die 12 entsteht nur auf eine einzige Art, nämlich 6 + 6.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: "Warum geht das Geburtstagsproblem schon bei 23 Leuten auf? Zähle die Paare: Wie viele Paare bilden {{n}} Leute?"
    answer:
      value: "{{n * (n - 1) / 2}}"
    feedback:
      - when: numval(state.input) == n * (n - 1)
        misconception: ordered-pairs
        text: So zählst du jedes Paar zweimal – A mit B und B mit A.
    hints:
      - Wie bei den Handschlägen.
      - "n · (n − 1) : 2."
    explanation: "{{n}} · {{n - 1}} : 2 = {{n * (n - 1) / 2}} Paare. Bei 23 Leuten sind es 253 Paare – jedes hat eine Chance von 1/365. Darum ist ein Treffer so wahrscheinlich."
    difficulty: 3
    variants:
      params:
        n: int[10,40]
      defaults:
        n: 23

  - kind: explain
    id: mb-x2
    depth: 3
    body: "Genau gerechnet: Alle verschieden ist $\\frac{365}{365} \\cdot \\frac{364}{365} \\cdots \\frac{343}{365} \\approx 0{,}493$. Mit $1 - x \\approx e^{-x}$ wird das $e^{-n^2/730}$ – eine **Näherung**, die in der Kryptografie die Geburtstagsattacke beschreibt."

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Ein Fingerabdruck einer Datei hat 64 Bit, also $2^{64}$ Werte. Ab etwa wie vielen Dateien wird ein doppelter Abdruck wahrscheinlich?
    params:
      options:
        - label: Etwa $2^{32}$, rund 4 Milliarden
          correct: true
        - label: Etwa $2^{63}$
          feedback: Das wäre richtig ohne Paar-Effekt. Paare wachsen aber quadratisch.
        - label: Etwa 64
          feedback: Viel zu wenig – $2^{64}$ ist riesig.
    hints:
      - "Beim Geburtstag: 365 Werte, Treffer ab etwa √365 ≈ 19 bis 23."
      - Die Wurzel aus $2^{64}$ ist $2^{32}$.
    explanation: Kollisionen werden ab etwa der Wurzel der Wertezahl wahrscheinlich. Darum braucht sichere Kryptografie Abdrücke mit 256 Bit.
    difficulty: 3

srs:
  cards_from: [summe, pasch]
