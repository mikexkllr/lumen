id: math.combinatorics.product
type: concept
title: Die Produktregel
summary: Möglichkeiten werden malgenommen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Jeder Schalter verdoppelt
    body: "Schlösser, PINs und Outfits: Die Möglichkeiten vervielfachen sich. Jeder der drei Schalter kann an oder aus sein. Schalte alle Muster durch und zähl mit. Wie viele verschiedene findest du? Dahinter steckt die **Produktregel**."
    visual:
      widget: bits
      interactive: true
      params:
        bits: 3
        placeValues: false
        showValue: false

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele verschiedene 4-stellige PINs gibt es?"
    params:
      min: 10
      max: 1000000
      scale: log
    answer:
      value: 10000
      within: 30
    explanation: 10 · 10 · 10 · 10 = 10 000. Jede Stelle vervielfacht die Möglichkeiten.

  - kind: problem
    id: outfits
    widget: numeric
    prompt: Du hast {{h}} Hosen und {{s}} Shirts. Wie viele verschiedene Outfits kannst du anziehen?
    params: { unit: Outfits }
    answer: { value: "{{h * s}}" }
    feedback:
      - when: "numval(state.input) == h + s"
        misconception: add-not-multiply
        text: Zu jeder Hose passt jedes Shirt. Also malnehmen.
    hints:
      - Wie viele Shirts passen zu einer einzigen Hose?
    explanation: "{{h}} · {{s}} = {{h * s}} Outfits."
    variants:
      params: { h: "int[2,5]", s: "int[3,7]" }
      defaults: { h: 3, s: 4 }

  - kind: explain
    id: s2
    body: |
      **Produktregel:** Gibt es für den ersten Schritt a Möglichkeiten und für den zweiten b, dann gibt es a · b Kombinationen.

  - kind: problem
    id: menue
    widget: numeric
    prompt: Ein Menü hat 3 Vorspeisen, 4 Hauptgerichte und 2 Desserts. Wie viele Menüs gibt es?
    params: { unit: Menüs }
    answer: { value: 24 }
    feedback:
      - when: "numval(state.input) == 9"
        misconception: add-not-multiply
        text: Jede Vorspeise passt zu jedem Hauptgericht und jedem Dessert. Nimm mal.
    hints:
      - 3 · 4 · 2.
    explanation: 3 · 4 · 2 = 24.

  - kind: problem
    id: kennzeichen
    widget: choice
    prompt: Ein Code hat zwei Buchstaben (A–Z) und danach drei Ziffern. Wie viele Codes gibt es?
    params:
      options:
        - { label: "676 000", correct: true }
        - { label: "26 000", feedback: "Es sind zwei Buchstaben – also 26 · 26." }
        - { label: "1 026", feedback: "Nicht addieren. Jede Stelle multipliziert." }
    hints:
      - 26 · 26 · 10 · 10 · 10.
    explanation: 26 · 26 · 1000 = 676 000.

  - kind: explain
    id: s5
    body: Warum wird so schnell so viel daraus?
    reveal:
      body: Jede neue Wahl multipliziert alles, was vorher schon möglich war. Darum explodieren Kombinationen – bei Passwörtern ein Segen, beim Planen ein Fluch.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Zahl hat drei Stellen. Alle Ziffern sind **verschieden**. Wie viele solche Zahlen gibt es?
    answer:
      value: 648
    hints:
      - Vorn 9 Möglichkeiten (keine 0), dann 9, dann 8.
    explanation: 9 · 9 · 8 = 648.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Ein **Baumdiagramm** zeigt, warum man malnimmt: Jeder Ast der ersten Wahl spaltet sich in gleich viele Äste der zweiten. 3 Äste mit je 4 Zweigen sind 3 · 4 = 12 Enden."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Für eine Pizza gibt es {{n}} Beläge. Jeder Belag kommt drauf oder nicht. Wie viele verschiedene Pizzen gibt es – die leere mitgezählt?
    answer:
      value: "{{2 ** n}}"
    feedback:
      - when: numval(state.input) == 2 * n
        misconception: add-not-multiply
        text: "Nicht plus: Jeder Belag verdoppelt alle bisherigen Möglichkeiten."
      - when: numval(state.input) == 2 ** n - 1
        misconception: forgot-empty
        text: Die leere Pizza zählt mit.
    hints:
      - Für jeden Belag gibt es 2 Möglichkeiten.
      - Nimm {{n}}-mal 2 mal.
    explanation: 2 · 2 · … · 2 = 2^{{n}} = {{2 ** n}}. Eine Menge mit {{n}} Elementen hat {{2 ** n}} Teilmengen.
    difficulty: 2
    variants:
      params:
        n: int[3,10]
      defaults:
        n: 5

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Ein Kennzeichen hat 2 Buchstaben (A–Z) und dann 1 bis 4 Ziffern, wobei die erste Ziffer keine 0 ist. Wie viele Ziffernteile gibt es?
    answer:
      value: 9999
    feedback:
      - when: numval(state.input) == 10000
        misconception: with-zero
        text: "Fast: Die Null allein gibt es nicht – die erste Ziffer ist nie 0."
      - when: numval(state.input) == 9000
        misconception: only-four
        text: Das sind nur die vierstelligen. Addiere die kürzeren.
    hints:
      - "Zähle getrennt: 1, 2, 3 und 4 Ziffern."
      - 9 + 90 + 900 + 9000.
    explanation: 9 + 90 + 900 + 9000 = 9999 – genau die Zahlen 1 bis 9999. Getrennt zählen und addieren heißt **Summenregel**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Passwort hat 8 Zeichen aus 26 Kleinbuchstaben. Wie viele Stellen hat die Zahl der Möglichkeiten?
    answer:
      value: 12
    hints:
      - 26⁸ ≈ 2 · 10¹¹.
    explanation: Rund 209 Milliarden – 12 Stellen. Jedes weitere Zeichen macht es 26-mal schwerer.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Steckst du 13 Briefe in 12 Fächer, liegen irgendwo mindestens zwei zusammen. Das **Schubfachprinzip** klingt banal, beweist aber Überraschendes – ohne ein einziges Fach anzusehen.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Eine Stadt hat 1 000 000 Einwohner. Niemand hat mehr als 99 999 Haare auf dem Kopf. Mindestens wie viele Menschen haben garantiert genau gleich viele Haare?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 2
        misconception: too-weak
        text: Zwei stimmt sicher – aber es geht noch mehr. Wie voll muss das vollste Fach mindestens sein?
    hints:
      - Die Fächer sind die Haarzahlen 0 bis 99 999 – also 100 000 Fächer.
      - Verteile 1 000 000 Menschen so gleichmäßig wie möglich.
    explanation: "1 000 000 : 100 000 = 10. Wären in jedem Fach höchstens 9, gäbe es nur 900 000 Menschen. Also teilen mindestens 10 dieselbe Haarzahl."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Wähle 5 Punkte in einem Quadrat mit Seite 2. Was folgt sicher?
    params:
      options:
        - label: Zwei liegen höchstens √2 auseinander.
          correct: true
        - label: Zwei liegen genau 1 auseinander.
          feedback: Ein genauer Abstand folgt nicht – nur eine obere Grenze.
        - label: Nichts – die Punkte sind beliebig.
          feedback: Teile das Quadrat in vier kleine Quadrate.
    hints:
      - Teile das Quadrat in 4 Quadrate mit Seite 1.
      - "5 Punkte, 4 Fächer: Zwei landen im selben kleinen Quadrat."
    explanation: Im selben Quadrat mit Seite 1 sind zwei Punkte höchstens so weit wie die Diagonale √2 voneinander entfernt.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum hat eine Menge mit n Elementen genau 2ⁿ Teilmengen?"
    params:
      keywords:
        - - drin
          - nicht
          - ja
          - nein
          - in
          - out
          - yes
          - no
        - - jedes
          - element
          - each
          - every
        - - mal
          - multipl
          - verdopp
          - doubl
          - times
          - produkt
          - product
      sample: "Für jedes Element entscheidet man: drin oder nicht drin. Das sind 2 Möglichkeiten pro Element, und nach der Produktregel wird malgenommen: 2 · 2 · … · 2 = 2ⁿ."
    explanation: Jedes Element ist eine Ja-Nein-Frage. n Fragen mit je 2 Antworten ergeben 2ⁿ Teilmengen.
    difficulty: 3

srs:
  cards_from: [outfits, menue]
