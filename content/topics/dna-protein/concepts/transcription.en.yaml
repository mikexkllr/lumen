id: bio.molecular.transcription
type: concept
title: "Transcription"
summary: "From a gene to messenger RNA."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Genes in action
    body: Each of your roughly 20,000 genes is a recipe. But a recipe alone cooks nothing. Uncover the cards and discover what happens when a cell uses a **gene**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍄
            front: A deadly mushroom
            back: The death cap's poison blocks the enzyme that reads genes. The liver dies.
          - icon: 🎚️
            front: Loud and quiet
            back: Some genes are read all the time, others only in a single type of cell.
          - icon: 💊
            front: An antibiotic
            back: Rifampicin stops bacteria from reading their genes – but not you.

  - kind: problem
    id: hook
    widget: choice
    prompt: DNA stays in the nucleus. But proteins are built outside, at the ribosomes. How do the instructions get there?
    params:
      options:
        - label: A copy of the gene travels out.
          correct: true
        - label: The DNA briefly leaves the nucleus.
          feedback: The precious DNA stays protected in the nucleus.
        - label: The ribosomes come into the nucleus.
          feedback: Ribosomes work in the cytoplasm.
    hints:
      - Libraries do not lend out precious originals.
      - You make a copy and take it along.
    explanation: This copy is called messenger RNA, mRNA for short. The original stays safe.

  - kind: explain
    id: c1
    body: In **transcription** an enzyme copies a gene into RNA. RNA is single-stranded and uses uracil (U) instead of thymine. So an A in the DNA is matched by a U.

  - kind: problem
    id: c2
    widget: tiles
    prompt: The DNA template reads T A C G G A. Build the matching mRNA.
    params:
      tiles:
        - A
        - U
        - G
        - C
        - C
        - U
        - T
        - A
      slots: 6
    answer:
      sequence:
        - A
        - U
        - G
        - C
        - C
        - U
    hints:
      - T → A, A → U, G → C, C → G.
      - There is no T in RNA.
    explanation: TACGGA becomes AUGCCU. AUG, by the way, is the start signal for proteins.

  - kind: problem
    id: c3
    widget: buckets
    prompt: DNA or RNA?
    params:
      buckets:
        - id: b1
          label: DNA
        - id: b2
          label: RNA
      items:
        - label: Double strand
          bucket: b1
        - label: Contains thymine
          bucket: b1
        - label: Stays in the nucleus
          bucket: b1
        - label: Single strand
          bucket: b2
        - label: Contains uracil
          bucket: b2
        - label: Soon broken down
          bucket: b2
    hints:
      - The original is permanent, the copy short-lived.
      - U instead of T.
    explanation: DNA is the archive, RNA the worksheet.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Transcription produces [[mRNA]]. It contains [[uracil]] instead of thymine and travels to the [[ribosomes]].
      distractors:
        - protein
        - mitochondria
    explanation: mRNA is the mobile copy of a gene.

  - kind: explain
    id: d1
    depth: 2
    body: Genes consist of sections that end up in the protein and inserts in between. The inserts are called introns. They are cut out of the RNA. This **splicing** leaves only the exons.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A gene is {{g}} bases long. Introns make up {{i}} % of it. How many bases remain after splicing?
    answer:
      value: "{{g * (100 - i) / 100}}"
    feedback:
      - when: numval(state.input) == g * i / 100
        misconception: swapped
        text: That is the part that is cut out.
    hints:
      - "The exons remain: {{100 - i}} %."
      - "{{g}} × {{(100 - i) / 100}}"
    explanation: "{{g * (100 - i) / 100}} bases. In many human genes most of the length is intron."
    difficulty: 2
    variants:
      params:
        g: choice[10000,20000,50000]
        i: choice[80,90,95]
      defaults:
        g: 20000
        i: 90

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Humans have only about 20,000 protein-coding genes, but many more different proteins. How?
    params:
      options:
        - label: The exons of one gene can be combined in different ways.
          correct: true
        - label: Every protein has its own gene.
          feedback: Then far more genes would be needed.
        - label: Proteins arise without genes.
          feedback: Every protein needs instructions.
    hints:
      - Exons can be left out during splicing.
      - One gene, several versions.
    explanation: Alternative splicing turns one gene into several proteins. That creates variety without more genes.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Only about 1 to 2 % of the human genome codes for proteins. What about the rest?
    params:
      options:
        - label: Introns, switches for genes, RNA genes, old virus remnants and much whose role is unclear
          correct: true
        - label: All useless junk
          feedback: Many sections control when genes switch on and off.
        - label: Spare copies of every gene
          feedback: True copies are rare.
    hints:
      - Genes need switches.
      - About 8 % of our genome comes from ancient retroviruses.
    explanation: "How much of it really has a function is still being studied. What is clear: regulation matters as much as the blueprint."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what happens in transcription.
    params:
      keywords:
        - - mrna
          - rna
          - boten
          - messenger
        - - gen
          - gene
          - dna
        - - uracil
          - u statt t
          - u instead of t
        - - kern
          - nucleus
          - ribosom
      sample: In transcription a gene of the DNA is copied into mRNA. The RNA has U instead of T. The mRNA leaves the nucleus and takes the instructions to the ribosomes.
    explanation: Copying protects the original and allows many copies of a gene.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
