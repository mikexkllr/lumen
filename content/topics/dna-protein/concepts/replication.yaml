id: bio.molecular.replication
type: concept
title: "DNA kopieren"
summary: "Replikation: halb alt, halb neu."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die perfekte Kopiermaschine
    body: Bevor sich eine Zelle teilt, muss sie Milliarden DNA-Buchstaben kopieren – fast ohne Fehler. Deck die Karten auf und staune, wie schnell und genau die **Replikation** arbeitet.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚀
            front: Zehntausende Startpunkte
            back: Deine DNA wird an Zehntausenden Stellen zugleich kopiert.
          - icon: ⏱️
            front: Etwa acht Stunden
            back: So lange braucht eine menschliche Zelle, um ihr ganzes Erbgut zu kopieren.
          - icon: 🧷
            front: Die Enden schrumpfen
            back: Bei jeder Kopie wird das Ende jedes Chromosoms ein Stückchen kürzer.

  - kind: problem
    id: hook
    widget: choice
    prompt: Vor jeder Zellteilung muss die DNA kopiert werden. Wie geht das am einfachsten, wenn A immer mit T und G mit C paart?
    params:
      options:
        - label: Stränge trennen und zu jedem den passenden Gegenstrang bauen
          correct: true
        - label: Die ganze Helix abfotografieren
          feedback: Zellen haben keine Kamera. Die Basenpaare sind die Vorlage.
        - label: Eine neue DNA ganz zufällig bauen
          feedback: Dann ginge die Information verloren.
    hints:
      - Jeder Strang verrät seinen Partner.
      - Aus einem Doppelstrang werden zwei.
    explanation: Jeder alte Strang dient als Vorlage. So entstehen zwei identische Doppelstränge.

  - kind: explain
    id: c1
    body: Bei der **Replikation** öffnet ein Enzym die Doppelhelix wie einen Reißverschluss. Die DNA-Polymerase baut an jeden alten Strang einen neuen. Jede Kopie besteht aus einem alten und einem neuen Strang.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne die Schritte der Replikation.
    params:
      items:
        - label: Helikase öffnet die Doppelhelix
        - label: Die Basen liegen frei
        - label: Polymerase setzt passende Bausteine an
        - label: Zwei Doppelstränge sind fertig
    hints:
      - Erst öffnen, dann bauen.
      - Die Polymerase braucht freie Basen als Vorlage.
    explanation: Öffnen, ablesen, ergänzen – und das an Tausenden Stellen gleichzeitig.

  - kind: problem
    id: c3
    widget: choice
    prompt: "Nach einer Replikation: Was steckt in jedem der beiden neuen DNA-Moleküle?"
    params:
      options:
        - label: Ein alter und ein neuer Strang
          correct: true
        - label: Zwei alte Stränge in einem, zwei neue im anderen
          feedback: Das wäre konservativ. Meselson und Stahl widerlegten das 1958.
        - label: Bunt gemischte Stücke
          feedback: Die Stränge bleiben am Stück.
    hints:
      - Jeder alte Strang ist eine Vorlage.
      - Halb erhalten heißt semikonservativ.
    explanation: "Die Replikation ist semikonservativ: Jede Tochter-DNA behält eine Hälfte des Originals."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Enzym öffnet die [[Doppelhelix]]. Die [[Polymerase]] baut an jeden alten Strang einen neuen. Diese Kopie heißt [[semikonservativ]].
      distractors:
        - Ribosom
        - konservativ
    explanation: Öffnen, ergänzen, halb behalten – so bleibt die Information erhalten.

  - kind: explain
    id: d1
    depth: 2
    body: Die Polymerase irrt sich selten, etwa einmal pro 100 000 Basen. Sie liest aber Korrektur, und Reparatur-Enzyme helfen nach. Am Ende bleibt etwa ein **Fehler** pro Milliarde Basen.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Eine Körperzelle hat 6,4 Milliarden Basenpaare. Pro Milliarde bleibt ein Fehler. Wie viele neue Fehler entstehen pro Teilung?
    answer:
      value: 6.4
      tolerance: 0.05
    hints:
      - Teile die Basen durch eine Milliarde.
      - "6,4 Milliarden : 1 Milliarde"
    explanation: Nur etwa 6 Fehler bei 6,4 Milliarden Bausteinen – eine Genauigkeit, die kein Kopierer schafft.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Warum ist diese winzige Fehlerquote trotzdem wichtig für das Leben?
    params:
      options:
        - label: Fehler sind Mutationen – Rohstoff der Evolution, aber manchmal auch Ursache von Krebs.
          correct: true
        - label: Sie ist egal, weil Fehler immer repariert werden.
          feedback: Ein Rest bleibt immer – und summiert sich über Milliarden Teilungen.
        - label: Fehler machen die DNA stabiler.
          feedback: Fehler ändern die Information, nicht die Stabilität.
    hints:
      - Was ist eine Mutation?
      - Dein Körper hat Billionen Zellteilungen hinter sich.
    explanation: Ohne Fehler keine Vielfalt, mit zu vielen kein Überleben. Die Fehlerquote ist ein Kompromiss der Evolution.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Eine menschliche Polymerase baut etwa 50 Basen pro Sekunde. Wie viele Jahre bräuchte eine einzige Polymerase für 6,4 Milliarden Basen? Runde auf eine Stelle.
    params:
      unit: Jahre
    answer:
      value: 4.1
      tolerance: 0.1
    hints:
      - "Zeit = 6,4 Milliarden : 50 Sekunden."
      - Ein Jahr hat rund 31,5 Millionen Sekunden.
    explanation: 128 Millionen Sekunden ≈ 4,1 Jahre. Die Zelle schafft es in etwa 8 Stunden, weil Zehntausende Polymerasen gleichzeitig an vielen Startpunkten arbeiten.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Zelle ihre DNA kopiert.
    params:
      keywords:
        - - öffn
          - oeffn
          - trenn
          - reißverschluss
          - reissverschluss
          - open
          - separat
          - unzip
        - - vorlage
          - template
          - ablesen
          - read
        - - polymerase
        - - alt und neu
          - alten und einen neuen
          - alter und ein neuer
          - old and new
          - one old
          - semikonserv
          - semi-conserv
      sample: Die Doppelhelix wird geöffnet. Jeder Strang dient als Vorlage, und die Polymerase baut passende Basen an. Jede neue DNA hat einen alten und einen neuen Strang.
    explanation: Basenpaarung macht das Kopieren einfach und genau.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
