id: bio.molecular.mutation
type: concept
title: "Mutations"
summary: "What happens when a letter changes."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The letter lottery
    body: "With every cell division, a few typos creep into DNA. Tap to draw: what happens when a random base in a gene swaps? This is how a **point mutation** affects the protein."
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: same protein
            weight: 134
          - label: new amino acid
            weight: 392
          - label: early stop
            weight: 23
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: hook
    widget: choice
    prompt: "The sentence reads THE FAT CAT ATE THE RAT. One letter drops out: THE FAT ATA TET HER AT. What happened?"
    params:
      options:
        - label: All groups of three after it are shifted and make nonsense.
          correct: true
        - label: Only one word is broken.
          feedback: Because it is read in threes, the whole rest slips.
        - label: Nothing important.
          feedback: The meaning is completely lost.
    hints:
      - Read in groups of three again.
      - After the missing letter no word fits any more.
    explanation: "That is exactly how a frameshift mutation acts in a gene: the whole protein after it is changed."

  - kind: explain
    id: c1
    body: A **mutation** is a change in the DNA sequence. In a point mutation one base is swapped for another. Depending on where, the protein stays the same, gets a different amino acid or stops short.

  - kind: problem
    id: c2
    widget: buckets
    prompt: What kind of point mutation is this?
    params:
      buckets:
        - id: b1
          label: silent
        - id: b2
          label: different amino acid
        - id: b3
          label: early stop
      items:
        - label: GCU → GCC (Ala → Ala)
          bucket: b1
        - label: GAG → GUG (Glu → Val)
          bucket: b2
        - label: UGG → UAG (Trp → stop)
          bucket: b3
        - label: AAA → AAG (Lys → Lys)
          bucket: b1
    hints:
      - Compare the amino acids before and after.
      - UAG is a stop codon.
    explanation: "Silent: same amino acid. Missense: different amino acid. Nonsense: early stop."

  - kind: problem
    id: c3
    widget: choice
    prompt: In sickle cell disease GAG becomes GUG in haemoglobin. Valine replaces glutamic acid. What kind of mutation is this?
    params:
      options:
        - label: A point mutation causing a different amino acid
          correct: true
        - label: A frameshift mutation
          feedback: No base is lost or added – one is swapped.
        - label: A silent mutation
          feedback: The amino acid changes, with big consequences.
    hints:
      - How many bases change?
      - Does the amino acid change?
    explanation: A single base! The altered haemoglobin clumps and the blood cells become sickle-shaped.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A silent mutation does not change the [[amino acid]]. If a base drops out, the [[reading frame]] shifts.
      distractors:
        - cell wall
        - chromosome
    explanation: Swapping a base acts locally, losing a base affects everything after it.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 4 bases are inserted into a gene. How many more bases would need to be added, at least, for the reading frame behind it to be correct again?
    answer:
      value: 2
    hints:
      - The frame is right when the number of insertions is divisible by 3.
      - How many are missing to reach the next multiple of three above 4?
    explanation: 4 + 2 = 6 is divisible by 3. Then exactly two codons have been added, and everything after reads as before.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: True or false?
    params:
      cards:
        - text: Mutations are always harmful.
          right: false
          why: Most are neutral, some useful.
        - text: UV light can cause mutations.
          right: true
          why: That is why sunscreen protects against skin cancer.
        - text: Mutations in egg and sperm cells are inherited.
          right: true
          why: Mutations in skin cells are not.
        - text: Organisms mutate on purpose when they need to.
          right: false
          why: Mutations are random. Selection sieves afterwards.
    explanation: Mutations are random, mostly neutral, and heritable only in germ cells.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: The most common cystic fibrosis mutation deletes 3 bases. Why is the protein still almost complete?
    params:
      options:
        - label: Three bases are exactly one codon. Only one amino acid is missing, the frame stays.
          correct: true
        - label: Because the cell repairs the error at once
          feedback: The error stays. It just does not shift the frame.
        - label: Because deletions never change anything
          feedback: One or two deleted bases would wreck everything after them.
    hints:
      - How many bases does a codon have?
      - The reading frame only slips for numbers not divisible by 3.
    explanation: Only phenylalanine at position 508 is missing. Yet even that makes the protein misfold and get destroyed.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The sickle cell allele is common in parts of Africa, although it causes disease. Why?
    params:
      options:
        - label: Carriers with one copy are better protected against severe malaria.
          correct: true
        - label: It became common by chance.
          feedback: Its distribution matches malaria regions exactly – that is selection.
        - label: It makes carriers stronger.
          feedback: The advantage is only against malaria, not strength.
    hints:
      - Where is the allele common?
      - Two copies harm, one copy helps.
    explanation: "This is heterozygote advantage: selection maintains an allele that harms in double dose."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why a single changed base can have such an effect.
    params:
      keywords:
        - - codon
          - drei
          - triplett
          - three
          - triplet
        - - aminosäure
          - aminosaeure
          - amino acid
        - - protein
          - eiweiß
          - eiweiss
          - falt
          - fold
        - - raster
          - verschieb
          - frame
          - shift
          - stopp
          - stop
      sample: A base is part of a codon. If it changes, a different amino acid may be built in or a stop may come. If a base is missing, the frame shifts. Then the protein folds wrongly.
    explanation: The code is read in threes – so every base counts.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
