id: bio.molecular.transcription
type: concept
title: "Transkription"
summary: "Vom Gen zur Boten-RNA."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Die DNA bleibt im Zellkern. Eiweiße werden aber draußen an den Ribosomen gebaut. Wie kommt die Bauanleitung dorthin?
    params:
      options:
        - label: Eine Abschrift des Gens wandert hinaus.
          correct: true
        - label: Die DNA verlässt kurz den Kern.
          feedback: Die wertvolle DNA bleibt geschützt im Kern.
        - label: Die Ribosomen kommen in den Kern.
          feedback: Ribosomen arbeiten im Zellplasma.
    hints:
      - Bibliotheken verleihen wertvolle Originale nicht.
      - Man macht eine Kopie und nimmt sie mit.
    explanation: Diese Abschrift heißt Boten-RNA, kurz mRNA. Das Original bleibt sicher.

  - kind: explain
    id: c1
    body: Bei der **Transkription** schreibt ein Enzym ein Gen in RNA ab. RNA ist einsträngig und nutzt Uracil (U) statt Thymin. Dem A der DNA steht also ein U gegenüber.

  - kind: problem
    id: c2
    widget: tiles
    prompt: Die Vorlage der DNA lautet T A C G G A. Baue die passende mRNA.
    params:
      tiles:
        - A
        - U
        - G
        - C
        - C
        - U
        - T
        - A
      slots: 6
    answer:
      sequence:
        - A
        - U
        - G
        - C
        - C
        - U
    hints:
      - T → A, A → U, G → C, C → G.
      - In RNA gibt es kein T.
    explanation: TACGGA wird zu AUGCCU. AUG ist übrigens das Startsignal für Proteine.

  - kind: problem
    id: c3
    widget: buckets
    prompt: DNA oder RNA?
    params:
      buckets:
        - id: b1
          label: DNA
        - id: b2
          label: RNA
      items:
        - label: Doppelstrang
          bucket: b1
        - label: Enthält Thymin
          bucket: b1
        - label: Bleibt im Zellkern
          bucket: b1
        - label: Einzelstrang
          bucket: b2
        - label: Enthält Uracil
          bucket: b2
        - label: Wird bald abgebaut
          bucket: b2
    hints:
      - Das Original ist dauerhaft, die Abschrift kurzlebig.
      - U statt T.
    explanation: DNA ist das Archiv, RNA der Arbeitszettel.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Bei der Transkription entsteht [[mRNA]]. Sie enthält [[Uracil]] statt Thymin und wandert zu den [[Ribosomen]].
      distractors:
        - Protein
        - Mitochondrien
    explanation: Die mRNA ist die mobile Abschrift eines Gens.

  - kind: explain
    id: d1
    depth: 2
    body: Gene bestehen aus Abschnitten, die zum Protein gehören, und Einschüben dazwischen. Die Einschübe heißen Introns. Sie werden aus der RNA herausgeschnitten. Dieses **Spleißen** lässt nur die Exons übrig.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Gen ist {{g}} Basen lang. Introns machen {{i}} % davon aus. Wie viele Basen bleiben nach dem Spleißen?
    answer:
      value: "{{g * (100 - i) / 100}}"
    feedback:
      - when: numval(state.input) == g * i / 100
        misconception: swapped
        text: Das ist der Teil, der herausgeschnitten wird.
    hints:
      - "Es bleiben die Exons: {{100 - i}} %."
      - "{{g}} · {{(100 - i) / 100}}"
    explanation: "{{g * (100 - i) / 100}} Basen. Bei vielen menschlichen Genen ist der größte Teil Intron."
    difficulty: 2
    variants:
      params:
        g: choice[10000,20000,50000]
        i: choice[80,90,95]
      defaults:
        g: 20000
        i: 90

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Menschen haben nur rund 20 000 Gene für Proteine, aber viel mehr verschiedene Proteine. Wie?
    params:
      options:
        - label: Die Exons eines Gens können verschieden kombiniert werden.
          correct: true
        - label: Jedes Protein hat ein eigenes Gen.
          feedback: Dann bräuchte man viel mehr Gene.
        - label: Proteine entstehen ohne Gene.
          feedback: Jedes Protein braucht eine Anleitung.
    hints:
      - Beim Spleißen kann man Exons weglassen.
      - Ein Gen, mehrere Varianten.
    explanation: Alternatives Spleißen macht aus einem Gen mehrere Proteine. So entsteht Vielfalt ohne mehr Gene.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Nur rund 1 bis 2 % des menschlichen Erbguts codieren für Proteine. Was ist mit dem Rest?
    params:
      options:
        - label: Introns, Schalter für Gene, RNA-Gene, alte Viren-Reste und vieles, dessen Rolle unklar ist
          correct: true
        - label: Alles nutzloser Müll
          feedback: Viele Abschnitte steuern, wann Gene an- und abgeschaltet werden.
        - label: Ersatzkopien aller Gene
          feedback: Wirkliche Kopien sind selten.
    hints:
      - Gene brauchen Schalter.
      - Etwa 8 % unseres Erbguts stammen von alten Retroviren.
    explanation: "Wie viel davon wirklich eine Funktion hat, wird noch erforscht. Sicher ist: Steuerung ist ebenso wichtig wie Bauplan."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was bei der Transkription passiert.
    params:
      keywords:
        - - mrna
          - rna
          - boten
          - messenger
        - - gen
          - gene
          - dna
        - - uracil
          - u statt t
          - u instead of t
        - - kern
          - nucleus
          - ribosom
      sample: Bei der Transkription wird ein Gen der DNA in mRNA abgeschrieben. Die RNA hat U statt T. Die mRNA verlässt den Zellkern und bringt die Anleitung zu den Ribosomen.
    explanation: Abschreiben schützt das Original und erlaubt viele Kopien eines Gens.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
