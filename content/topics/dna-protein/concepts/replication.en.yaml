id: bio.molecular.replication
type: concept
title: "Copying DNA"
summary: "Replication: half old, half new."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The perfect copy machine
    body: Before a cell divides, it has to copy billions of DNA letters – almost without mistakes. Uncover the cards and see how fast and accurate **replication** is.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚀
            front: Tens of thousands of starts
            back: Your DNA is copied at tens of thousands of places at once.
          - icon: ⏱️
            front: About eight hours
            back: That is roughly how long a human cell needs to copy its entire genome.
          - icon: 🧷
            front: The ends shrink
            back: With every copy, the end of each chromosome gets a little shorter.

  - kind: problem
    id: hook
    widget: choice
    prompt: Before each cell division the DNA must be copied. What is the simplest way, given that A always pairs with T and G with C?
    params:
      options:
        - label: Separate the strands and build the matching partner for each
          correct: true
        - label: Take a photo of the whole helix
          feedback: Cells have no camera. The base pairs are the template.
        - label: Build new DNA completely at random
          feedback: Then the information would be lost.
    hints:
      - Each strand reveals its partner.
      - One double strand becomes two.
    explanation: Each old strand serves as a template. That produces two identical double strands.

  - kind: explain
    id: c1
    body: In **replication** an enzyme opens the double helix like a zip. DNA polymerase builds a new strand onto each old one. Each copy consists of one old and one new strand.

  - kind: problem
    id: c2
    widget: order
    prompt: Order the steps of replication.
    params:
      items:
        - label: Helicase opens the double helix
        - label: The bases are exposed
        - label: Polymerase adds matching building blocks
        - label: Two double strands are finished
    hints:
      - First open, then build.
      - The polymerase needs exposed bases as a template.
    explanation: Open, read, complete – at thousands of places at the same time.

  - kind: problem
    id: c3
    widget: choice
    prompt: "After replication: what is in each of the two new DNA molecules?"
    params:
      options:
        - label: One old strand and one new strand
          correct: true
        - label: Two old strands in one, two new in the other
          feedback: That would be conservative. Meselson and Stahl disproved it in 1958.
        - label: Randomly mixed pieces
          feedback: The strands stay in one piece.
    hints:
      - Each old strand is a template.
      - Half kept is called semi-conservative.
    explanation: "Replication is semi-conservative: each daughter DNA keeps one half of the original."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An enzyme opens the [[double helix]]. The [[polymerase]] builds a new strand onto each old one. This kind of copy is called [[semi-conservative]].
      distractors:
        - ribosome
        - conservative
    explanation: Open, complete, keep half – that is how the information is preserved.

  - kind: explain
    id: d1
    depth: 2
    body: The polymerase rarely makes mistakes, about once per 100,000 bases. But it proofreads, and repair enzymes help out. In the end about one **error** per billion bases remains.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A body cell has 6.4 billion base pairs. One error remains per billion. How many new errors arise per division?
    answer:
      value: 6.4
      tolerance: 0.05
    hints:
      - Divide the bases by a billion.
      - 6.4 billion ÷ 1 billion
    explanation: Only about 6 errors in 6.4 billion building blocks – a precision no copier can match.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Why does this tiny error rate still matter for life?
    params:
      options:
        - label: Errors are mutations – raw material for evolution, but sometimes a cause of cancer.
          correct: true
        - label: It does not matter because errors are always repaired.
          feedback: Some always remain – and add up over billions of divisions.
        - label: Errors make DNA more stable.
          feedback: Errors change the information, not the stability.
    hints:
      - What is a mutation?
      - Your body has gone through trillions of cell divisions.
    explanation: Without errors no diversity, with too many no survival. The error rate is an evolutionary compromise.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A human polymerase adds about 50 bases per second. How many years would a single polymerase need for 6.4 billion bases? Round to one decimal place.
    params:
      unit: years
    answer:
      value: 4.1
      tolerance: 0.1
    hints:
      - Time = 6.4 billion ÷ 50 seconds.
      - A year has about 31.5 million seconds.
    explanation: 128 million seconds ≈ 4.1 years. The cell manages it in about 8 hours because tens of thousands of polymerases work at once from many starting points.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a cell copies its DNA.
    params:
      keywords:
        - - öffn
          - oeffn
          - trenn
          - reißverschluss
          - reissverschluss
          - open
          - separat
          - unzip
        - - vorlage
          - template
          - ablesen
          - read
        - - polymerase
        - - alt und neu
          - alten und einen neuen
          - alter und ein neuer
          - old and new
          - one old
          - semikonserv
          - semi-conserv
      sample: The double helix is opened. Each strand serves as a template, and the polymerase adds matching bases. Each new DNA has one old and one new strand.
    explanation: Base pairing makes copying simple and precise.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
