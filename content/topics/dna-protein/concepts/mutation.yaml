id: bio.molecular.mutation
type: concept
title: "Mutationen"
summary: "Was passiert, wenn ein Buchstabe sich ändert."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Der Satz lautet: DER OPA SAH DAS REH. Das P fällt weg: DER OAS AHD ASR EH. Was ist passiert?"
    params:
      options:
        - label: Alle Dreiergruppen dahinter sind verschoben und ergeben Unsinn.
          correct: true
        - label: Nur ein Wort ist kaputt.
          feedback: Weil in Dreiergruppen gelesen wird, verrutscht der ganze Rest.
        - label: Nichts Wichtiges.
          feedback: Der Sinn ist komplett verloren.
    hints:
      - Lies wieder in Dreiergruppen.
      - Ab dem fehlenden Buchstaben passt kein Wort mehr.
    explanation: "Genau so wirkt eine Rastermutation in einem Gen: Das ganze Protein dahinter ist verändert."

  - kind: explain
    id: c1
    body: Eine **Mutation** ist eine Änderung der DNA-Sequenz. Bei einer Punktmutation tauscht eine Base gegen eine andere. Je nachdem bleibt das Protein gleich, bekommt eine andere Aminosäure oder bricht ab.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Welche Art Punktmutation ist das?
    params:
      buckets:
        - id: b1
          label: stumm
        - id: b2
          label: andere Aminosäure
        - id: b3
          label: vorzeitiger Stopp
      items:
        - label: GCU → GCC (Ala → Ala)
          bucket: b1
        - label: GAG → GUG (Glu → Val)
          bucket: b2
        - label: UGG → UAG (Trp → Stopp)
          bucket: b3
        - label: AAA → AAG (Lys → Lys)
          bucket: b1
    hints:
      - Vergleiche die Aminosäuren vorher und nachher.
      - UAG ist ein Stopp-Codon.
    explanation: "Stumm: gleiche Aminosäure. Fehlsinn: andere Aminosäure. Unsinn: Abbruch."

  - kind: problem
    id: c3
    widget: choice
    prompt: Bei der Sichelzellkrankheit wird im Hämoglobin aus GAG ein GUG. Statt Glutaminsäure steht dort Valin. Was ist das für eine Mutation?
    params:
      options:
        - label: Eine Punktmutation mit anderer Aminosäure
          correct: true
        - label: Eine Rastermutation
          feedback: Keine Base fehlt oder kommt dazu – eine wird getauscht.
        - label: Eine stumme Mutation
          feedback: Die Aminosäure ändert sich, mit großen Folgen.
    hints:
      - Wie viele Basen ändern sich?
      - Ändert sich die Aminosäure?
    explanation: Eine einzige Base! Das veränderte Hämoglobin verklumpt, und die Blutzellen werden sichelförmig.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Eine stumme Mutation ändert die [[Aminosäure]] nicht. Fällt eine Base weg, verschiebt sich das [[Leseraster]].
      distractors:
        - Zellwand
        - Chromosom
    explanation: Tausch einer Base wirkt örtlich, Verlust einer Base wirkt auf alles danach.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 4 Basen werden in ein Gen eingefügt. Wie viele Basen müssten mindestens noch dazukommen, damit das Leseraster dahinter wieder stimmt?
    answer:
      value: 2
    hints:
      - Das Raster stimmt, wenn die Zahl der Einschübe durch 3 teilbar ist.
      - Zur nächsten Dreierzahl über 4 fehlen wie viele?
    explanation: 4 + 2 = 6 ist durch 3 teilbar. Dann sind genau zwei Codons dazugekommen, und dahinter liest sich alles wie vorher.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: swipe
    prompt: Stimmt das?
    params:
      cards:
        - text: Mutationen sind immer schädlich.
          right: false
          why: Die meisten sind neutral, manche nützlich.
        - text: UV-Licht kann Mutationen auslösen.
          right: true
          why: Darum schützt Sonnencreme vor Hautkrebs.
        - text: Mutationen in Eizellen und Spermien werden vererbt.
          right: true
          why: Mutationen in Hautzellen dagegen nicht.
        - text: Lebewesen mutieren gezielt, wenn sie es brauchen.
          right: false
          why: Mutationen sind zufällig. Selektion siebt danach.
    explanation: Mutationen sind zufällig, meist neutral und nur in Keimzellen erblich.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Eine Löschung von 3 Basen fehlt bei der häufigsten Mukoviszidose-Mutation. Warum ist das Protein trotzdem fast vollständig?
    params:
      options:
        - label: Drei Basen sind genau ein Codon. Nur eine Aminosäure fehlt, das Raster bleibt.
          correct: true
        - label: Weil die Zelle den Fehler sofort repariert
          feedback: Der Fehler bleibt. Er verschiebt nur das Raster nicht.
        - label: Weil Löschungen nie etwas ändern
          feedback: Eine oder zwei gelöschte Basen würden alles dahinter zerstören.
    hints:
      - Wie viele Basen hat ein Codon?
      - Das Leseraster rutscht nur bei Zahlen, die nicht durch 3 teilbar sind.
    explanation: Es fehlt nur Phenylalanin an Stelle 508. Doch selbst das reicht, damit das Protein falsch faltet und abgebaut wird.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das Sichelzell-Allel ist in Teilen Afrikas häufig, obwohl es krank macht. Warum?
    params:
      options:
        - label: Träger mit einer Kopie sind besser vor schwerer Malaria geschützt.
          correct: true
        - label: Es ist durch Zufall häufig geworden.
          feedback: Die Verteilung passt genau zu Malariagebieten – das ist Selektion.
        - label: Es macht Träger stärker.
          feedback: Der Vorteil betrifft nur Malaria, nicht die Kraft.
    hints:
      - Wo ist das Allel häufig?
      - Zwei Kopien schaden, eine Kopie hilft.
    explanation: "Das ist ein Heterozygotenvorteil: Selektion erhält ein Allel, das in doppelter Dosis schadet."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum eine einzige veränderte Base so viel bewirken kann.
    params:
      keywords:
        - - codon
          - drei
          - triplett
          - three
          - triplet
        - - aminosäure
          - aminosaeure
          - amino acid
        - - protein
          - eiweiß
          - eiweiss
          - falt
          - fold
        - - raster
          - verschieb
          - frame
          - shift
          - stopp
          - stop
      sample: Eine Base ist Teil eines Codons. Ändert sie sich, kann eine andere Aminosäure eingebaut werden oder ein Stopp kommen. Fehlt eine Base, verschiebt sich das Raster. Dann faltet das Protein falsch.
    explanation: Der Code wird in Dreiergruppen gelesen – darum hat jede Base Gewicht.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
