id: stats.sampling.bias
type: concept
title: Who Gets Asked?
summary: Randomness beats quantity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Millions got it wrong
    body: Before every election you see new polls. But who was actually asked? Uncover the story of 1936 step by step. It shows how much depends on the **selection**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 📰
            front: 2.4 million answers
            back: In 1936 a US magazine polled people mainly from phone books and car registers – mostly the well-off back then.
          - icon: ❌
            front: The forecast
            back: It forecast a clear win for Landon. Roosevelt won by a huge margin.
          - icon: 🎯
            front: Far fewer, but right
            back: George Gallup asked only about 50,000 people, chosen to match the population – and got it right.

  - kind: problem
    id: fanseite
    widget: choice
    prompt: An online poll on a soccer club's website asks whether soccer is the best sport. 90% say yes. What follows?
    params:
      options:
        - { label: Almost nothing – mostly fans respond., correct: true }
        - { label: 90% of all people love soccer., feedback: "The respondents are not a random selection. Fans visit this site." }
        - { label: With more answers it would be certain., feedback: "More fans do not change the bias." }
    hints:
      - Who visits this site?
    explanation: The sample is **biased**. Only certain people respond.

  - kind: explain
    id: s2
    body: |
      A good sample is **random**. Everyone should have the same chance of being asked.
      Then about 1000 people are enough for a whole country.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Rather fair or biased?
    params:
      buckets: [{ label: rather fair }, { label: biased }]
      items:
        - { label: Draw from the population register, bucket: rather fair }
        - { label: Random phone numbers, bucket: rather fair }
        - { label: Every tenth person on a list, bucket: rather fair }
        - { label: "Anyone who wants can join", bucket: biased }
        - { label: Only people outside the gym, bucket: biased }
        - { label: Poll in a fan group, bucket: biased }
    hints:
      - Does everyone have the same chance of being asked?
    explanation: Random selections are fair. Volunteers and special places skew the picture.

  - kind: explain
    id: s4
    body: Which is better – 1000 people chosen by lot or 100,000 who answer voluntarily?
    reveal:
      body: The 1000 random ones. Many answers do not help if the selection is skewed. In 1936, a poll with two million answers was far off.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Fair or biased sample?
    params:
      buckets:
        - id: b1
          label: Fair
        - id: b2
          label: Biased
      items:
        - label: 1000 people drawn by lot
          bucket: b1
        - label: Opt-in online poll
          bucket: b2
        - label: Calls in the morning only
          bucket: b2
        - label: Random addresses nationwide
          bucket: b1
    hints:
      - Does everyone have the same chance of being asked?
    explanation: Whoever volunteers or is at home in the morning is not typical.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: In a town, one person in five is under 18. The grid is a fair random sample of 25 people. Shade how many young people you expect.
    params:
      parts: 25
      shape: square
    answer:
      fraction: 1/5
    hints:
      - A fair sample mirrors the town on a small scale.
      - One fifth of 25 is 5 squares.
    explanation: 5 out of 25 – the same share as in the town. That is what a random choice delivers, give or take a little wobble.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In the Second World War bullet holes on returning bombers were counted. Where should the armour be reinforced?
    params:
      options:
        - label: Where there are **no** holes – hits there brought the planes down
          correct: true
        - label: Where the most holes are
          feedback: Those planes survived the hits, after all.
        - label: Equally everywhere
          feedback: The data show a clear pattern – you just have to read it correctly.
    hints:
      - Which planes are missing from the sample?
    explanation: "**Survivorship bias**: you only see the survivors. Abraham Wald recognised this in 1943."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many randomly chosen people are enough for a poll in a country of 80 million – accurate to about 3 points?"
    params:
      min: 10
      max: 1000000
      scale: log
    answer:
      value: 1000
      within: 60
    explanation: About 1000. What counts is the number asked, hardly the size of the country.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: match
    prompt: Which bias is behind it?
    params:
      pairs:
        - left: Only volunteers answer.
          right: Self-selection
        - left: No phone, not in the poll.
          right: Undercoverage
        - left: Many just hang up.
          right: Non-response
        - left: Only current customers asked.
          right: Survivorship bias
      leftTitle: Situation
      rightTitle: Bias
    hints:
      - "Ask each time: who is missing – and why?"
      - Self-selection means people decide for themselves whether to take part.
    explanation: "All four share one root: the respondents are not a random sample of the people in question."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: An institute draws 500 people at random from cities and 500 from the countryside, instead of 1000 from the whole country. What is this called?
    params:
      options:
        - label: Stratified sample
          correct: true
        - label: Here a lottery decides, not the people.
          feedback: Hier entscheidet das Los, nicht die Leute.
        - label: With clusters you draw whole groups, e.g. whole schools.
          feedback: Bei Klumpen zieht man ganze Gruppen, etwa ganze Schulen.
    hints:
      - The population is first split into groups.
      - Within each group chance decides.
    explanation: Strata guarantee that each group is represented. Afterwards you weight by the true shares.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In 1936 a magazine predicted the wrong US president from 2.4 million replies. Gallup was right with 50,000. Why?
    params:
      options:
        - label: The magazine polled car and telephone owners – at that time mostly the well-off
          correct: true
        - label: The magazine miscounted
          feedback: The count was right – the selection was skewed.
        - label: Gallup was lucky
          feedback: His sample was deliberately representative.
    hints:
      - Who owned a telephone in 1936?
    explanation: A large biased sample merely delivers a very precise wrong value.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Of 1000 people contacted, 200 answer and 150 of those are satisfied. The other 800 are unknown. At least what percent of all 1000 are satisfied?
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 75
        misconception: ignore-nonresponse
        text: 75 % only holds for those who answered.
    hints:
      - "Imagine the worst case: none of the 800 is satisfied."
      - Then it is 150 out of 1000.
    explanation: At least 15 %, at most 95 % (if all 800 were satisfied). Without assumptions about the silent ones only this wide range remains.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why a huge online poll can be worse than a small random sample.
    params:
      keywords:
        - - zufall
          - los
          - random
          - chance
        - - verzerr
          - schief
          - freiwillig
          - bias
          - skew
          - volunteer
          - selbst
        - - größe
          - menge
          - viele
          - mehr
          - size
          - many
          - more
      sample: In a random sample everyone has the same chance. In the online poll only certain people volunteer, so the selection is biased. More answers do not shrink that error.
    explanation: Randomness fights bias; size only fights noise. A skewed selection stays skewed, however large.
    difficulty: 3

srs:
  cards_from: [fanseite, einordnen]
