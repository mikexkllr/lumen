id: stats.sampling.bias
type: concept
title: Who Gets Asked?
summary: Randomness beats quantity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: fanseite
    widget: choice
    prompt: An online poll on a soccer club's website asks whether soccer is the best sport. 90% say yes. What follows?
    params:
      options:
        - { label: Almost nothing – mostly fans respond., correct: true }
        - { label: 90% of all people love soccer., feedback: "The respondents are not a random selection. Fans visit this site." }
        - { label: With more answers it would be certain., feedback: "More fans do not change the bias." }
    hints:
      - Who visits this site?
    explanation: The sample is **biased**. Only certain people respond.

  - kind: explain
    body: |
      A good sample is **random**. Everyone should have the same chance of being asked.
      Then about 1000 people are enough for a whole country.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Rather fair or biased?
    params:
      buckets: [{ label: rather fair }, { label: biased }]
      items:
        - { label: Draw from the population register, bucket: rather fair }
        - { label: Random phone numbers, bucket: rather fair }
        - { label: Every tenth person on a list, bucket: rather fair }
        - { label: "Anyone who wants can join", bucket: biased }
        - { label: Only people outside the gym, bucket: biased }
        - { label: Poll in a fan group, bucket: biased }
    hints:
      - Does everyone have the same chance of being asked?
    explanation: Random selections are fair. Volunteers and special places skew the picture.

  - kind: explain
    body: Which is better – 1000 people chosen by lot or 100,000 who answer voluntarily?
    reveal:
      body: The 1000 random ones. Many answers do not help if the selection is skewed. In 1936, a poll with two million answers was far off.

srs:
  cards_from: [fanseite, einordnen]
