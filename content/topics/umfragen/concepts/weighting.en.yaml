id: stats.sampling.weighting
type: concept
title: Weighting
summary: When one group was asked too often.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zu-viele
    widget: choice
    prompt: In a poll, 70% of respondents are over 60. In the population, it is 30%. What should you do?
    params:
      options:
        - { label: Weight the answers – older people count less., correct: true }
        - { label: Just publish the result as it is., feedback: "Then older people speak far too loudly." }
        - { label: Remove all the older people., feedback: "Then their opinion is missing entirely." }
    hints:
      - How does each group get its correct weight?
    explanation: You rescale each group to its true share.

  - kind: explain
    id: s2
    body: |
      With **weighting**, each group counts at its true share. If 40% of young people and 60% of older people say yes, and each is half of the country, the total is 50%.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: "{{a}}% of younger people and {{b}}% of older people are in favor. Younger people are 60% of the population. What percent are in favor overall?"
    params: { unit: "%" }
    answer: { value: "{{0.6 * a + 0.4 * b}}" }
    feedback:
      - when: "numval(state.input) == (a + b) / 2"
        misconception: unweighted
        text: That is the simple average. But younger people count at 60%.
    hints:
      - "0.6 · {{a}} + 0.4 · {{b}}."
    explanation: "{{0.6 * a}} + {{0.4 * b}} = {{0.6 * a + 0.4 * b}}%."
    variants:
      params: { a: "step[20,80,10]", b: "step[20,80,10]" }
      constraints: ["a != b"]
      defaults: { a: 40, b: 70 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In a poll 70% are older (60% approval) and 30% younger (20% approval). In the population the older are only 30%. What is the weighted approval in percent?
    params:
      unit: "%"
    answer:
      value: 32
    hints:
      - 0.3 · 60 + 0.7 · 20.
    explanation: 18 + 14 = 32%. Unweighted it would be 48% – a huge difference.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why are 1000 people picked by chance better than 100,000 who sign up?"
    params:
      keywords:
        - - zufall
          - zufällig
          - random
        - - verzerr
          - schief
          - bias
          - skew
          - einseitig
        - - repräsentativ
          - bevölkerung
          - alle
          - representative
          - population
          - everyone
          - gleiche chance
      sample: "With random selection everyone has the same chance of being asked – the sample is representative. Volunteers are one-sided: mostly people with strong opinions respond, which biases the result however many there are."
    difficulty: 3

srs:
  cards_from: [zu-viele, rechnen]
