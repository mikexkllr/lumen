id: stats.sampling.reading
type: concept
title: Prozent oder Prozentpunkte?
summary: Ein kleines Wort mit großer Wirkung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: punkte
    widget: numeric
    prompt: Eine Partei steigt von {{a}} % auf {{b}} %. Um wie viele Prozentpunkte ist sie gestiegen?
    params: { unit: Prozentpunkte }
    answer: { value: "{{b - a}}" }
    hints:
      - Prozentpunkte sind einfach die Differenz.
    explanation: "{{b}} − {{a}} = {{b - a}} Prozentpunkte."
    variants:
      params: { a: "choice[10,20,25,40]", d: "choice[2,5,10]" }
      derive: { b: "a + d" }
      defaults: { a: 20, d: 5 }

  - kind: problem
    id: prozent
    widget: numeric
    prompt: Und um wie viel Prozent ist sie gewachsen – von 20 % auf 25 %?
    params: { unit: "%" }
    answer: { value: 25 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: points-vs-percent
        text: 5 sind die Prozentpunkte. Gesucht ist das Wachstum relativ zu 20.
    hints:
      - 5 von 20 sind wie viel Prozent?
    explanation: 5 / 20 = 25 %. Gleiche Änderung, ganz andere Zahl.

  - kind: explain
    id: s3
    body: |
      **Prozentpunkte** sind die Differenz zweier Prozentwerte. **Prozent** beschreiben die relative Änderung.
      Schlagzeilen verwechseln das gern – meist nimmt man die größere Zahl.

  - kind: problem
    id: risiko
    widget: choice
    prompt: »Ein Mittel verdoppelt das Risiko!« Vorher lag es bei 1 von 10 000. Wie groß ist es jetzt?
    params:
      options:
        - { label: 2 von 10 000, correct: true }
        - { label: 50 %, feedback: "Verdoppeln bezieht sich auf das kleine Ausgangsrisiko." }
        - { label: 1 von 5000 – also riesig, feedback: "Das ist dasselbe wie 2 von 10 000 – und immer noch winzig." }
    hints:
      - Verdoppeln heißt mal 2.
    explanation: Das relative Risiko klingt dramatisch, das absolute bleibt winzig – 0,02 %.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Medikament senkt das Risiko von 2 % auf 1 %. Wie viele Menschen müssen es nehmen, damit **einer** davon profitiert?
    answer:
      value: 100
    hints:
      - Von 100 erkranken ohne Mittel 2, mit Mittel 1.
    explanation: 100 – die **Number Needed to Treat**. »Halbiert das Risiko« klingt viel eindrucksvoller.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Ein Wert steigt von {{a}} auf {{b}}. Um wie viel **Prozent** ist das?
    answer:
      value: "{{(b - a) * 100 / a}}"
    feedback:
      - when: numval(state.input) == b - a
        misconception: points-vs-percent
        text: Das ist die Differenz in Punkten. Teile noch durch den alten Wert.
    hints:
      - Die Änderung ist {{b - a}}.
      - Teile {{b - a}} durch den Startwert {{a}}, mal 100.
    explanation: "{{b - a}} : {{a}} = {{(b - a) * 100 / a}} %. Bezug ist immer der alte Wert."
    difficulty: 2
    variants:
      params:
        a: choice[4,5,8,10,20,25]
        b: int[5,40]
      constraints:
        - b > a
        - isInt((b - a) * 100 / a)
      defaults:
        a: 4
        b: 6

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Ein Mittel senkt das Risiko von 4 % auf 3 %. Um wie viel Prozent sinkt das Risiko **relativ**?
    answer:
      value: 25
    feedback:
      - when: numval(state.input) == 1
        misconception: absolute-vs-relative
        text: "Das ist die absolute Senkung: 1 Prozentpunkt. Relativ heißt: bezogen auf 4 %."
    hints:
      - Die Senkung ist 1 Punkt.
      - Wie viel Prozent ist 1 von 4?
    explanation: "Relativ −25 %, absolut −1 Punkt. Werbung nennt gern die 25 %. Ehrlich wäre: 1 von 100 profitiert."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Eine Schlagzeile: »Wurst erhöht das Darmkrebsrisiko um 18 %.« Das Grundrisiko liegt bei etwa 5 %. Was heißt das in absoluten Zahlen?"
    params:
      options:
        - label: Das Risiko steigt von etwa 5 % auf etwa 6 %
          correct: true
        - label: Es steigt auf 23 %
          feedback: 18 % sind relativ zu 5 % gemeint, nicht addiert.
        - label: 18 von 100 Wurstessern erkranken
          feedback: Das wäre ein absolutes Risiko von 18 %.
    hints:
      - 18 % von 5 % sind knapp ein Prozentpunkt.
    explanation: Immer nach dem **absoluten Risiko** fragen. Relative Zahlen ohne Ausgangswert sind fast wertlos.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Wettquoten sagen »1 zu 4«: einmal Erfolg auf vier Misserfolge. Welche Wahrscheinlichkeit ist das in Prozent?"
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 25
        misconception: odds-vs-prob
        text: 1 zu 4 heißt 1 von 5 Fällen, nicht 1 von 4.
    hints:
      - Wie viele Fälle sind es zusammen?
      - 1 Erfolg von 1 + 4 = 5 Fällen.
    explanation: "Die **Chance** (Odds) 1 : 4 entspricht 1/5 = 20 %. Medizinische Studien berichten oft Odds-Verhältnisse – leicht zu verwechseln."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Eine Aktie fällt um 50 % und steigt danach um 50 %. Sie startete bei 100 €. Wo steht sie jetzt?
    params:
      unit: €
    answer:
      value: 75
    feedback:
      - when: numval(state.input) == 100
        misconception: percent-base
        text: Die 50 % Anstieg beziehen sich auf den neuen, kleineren Wert.
    hints:
      - "Nach dem Fall: 50 €."
      - 50 % von 50 € sind 25 €.
    explanation: "100 → 50 → 75. Prozente multiplizieren sich: 0,5 · 1,5 = 0,75. Nach −50 % braucht man +100 %, um zurückzukommen."
    difficulty: 3

srs:
  cards_from: [punkte, risiko]
