id: stats.sampling.bias
type: concept
title: Wer wird gefragt?
summary: Zufall schlägt Masse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: fanseite
    widget: choice
    prompt: Eine Online-Umfrage auf der Seite eines Fußballvereins fragt, ob Fußball der beste Sport ist. 90 % sagen ja. Was folgt daraus?
    params:
      options:
        - { label: Fast nichts – es antworten vor allem Fans., correct: true }
        - { label: 90 % aller Menschen lieben Fußball., feedback: "Die Befragten sind keine Zufallsauswahl. Fans besuchen diese Seite." }
        - { label: Mit mehr Antworten wäre es sicher., feedback: "Mehr Fans ändern nichts an der Verzerrung." }
    hints:
      - Wer besucht diese Seite?
    explanation: Die Stichprobe ist **verzerrt**. Es antworten nur bestimmte Menschen.

  - kind: explain
    body: |
      Eine gute Stichprobe ist **zufällig**. Jeder soll die gleiche Chance haben, gefragt zu werden.
      Dann reichen schon rund 1000 Menschen für ein ganzes Land.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Eher fair oder verzerrt?
    params:
      buckets: [{ label: eher fair }, { label: verzerrt }]
      items:
        - { label: Los aus dem Melderegister, bucket: eher fair }
        - { label: Zufällige Telefonnummern, bucket: eher fair }
        - { label: Jede zehnte Person einer Liste, bucket: eher fair }
        - { label: "Wer will, macht mit", bucket: verzerrt }
        - { label: Nur Leute vor dem Fitnessstudio, bucket: verzerrt }
        - { label: Umfrage in einer Fan-Gruppe, bucket: verzerrt }
    hints:
      - Hat jeder die gleiche Chance, gefragt zu werden?
    explanation: Zufallsauswahlen sind fair. Freiwillige und besondere Orte verzerren das Bild.

  - kind: explain
    body: Was ist besser – 1000 Menschen per Los oder 100 000, die freiwillig antworten?
    reveal:
      body: Die 1000 zufälligen. Viele Antworten helfen nicht, wenn die Auswahl schief ist. 1936 lag eine Umfrage mit zwei Millionen Antworten weit daneben.

srs:
  cards_from: [fanseite, einordnen]
