id: stats.sampling.bias
type: concept
title: Wer wird gefragt?
summary: Zufall schlägt Masse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Millionen lagen falsch
    body: Vor jeder Wahl liest du neue Umfragen. Aber wer wurde da eigentlich gefragt? Deck die Geschichte von 1936 Schritt für Schritt auf. Sie zeigt, wie viel von der **Auswahl** abhängt.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 📰
            front: 2,4 Millionen Antworten
            back: Eine US-Zeitschrift fragte 1936 vor allem Menschen aus Telefonbüchern und Autolisten – damals eher Wohlhabende.
          - icon: ❌
            front: Die Vorhersage
            back: Sie sagte einen klaren Sieg für Landon voraus. Roosevelt gewann mit riesigem Vorsprung.
          - icon: 🎯
            front: Viel weniger, aber richtig
            back: George Gallup fragte nur rund 50 000 Menschen, passend zur Bevölkerung ausgewählt – und lag richtig.

  - kind: problem
    id: fanseite
    widget: choice
    prompt: Eine Online-Umfrage auf der Seite eines Fußballvereins fragt, ob Fußball der beste Sport ist. 90 % sagen ja. Was folgt daraus?
    params:
      options:
        - { label: Fast nichts – es antworten vor allem Fans., correct: true }
        - { label: 90 % aller Menschen lieben Fußball., feedback: "Die Befragten sind keine Zufallsauswahl. Fans besuchen diese Seite." }
        - { label: Mit mehr Antworten wäre es sicher., feedback: "Mehr Fans ändern nichts an der Verzerrung." }
    hints:
      - Wer besucht diese Seite?
    explanation: Die Stichprobe ist **verzerrt**. Es antworten nur bestimmte Menschen.

  - kind: explain
    id: s2
    body: |
      Eine gute Stichprobe ist **zufällig**. Jeder soll die gleiche Chance haben, gefragt zu werden.
      Dann reichen schon rund 1000 Menschen für ein ganzes Land.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Eher fair oder verzerrt?
    params:
      buckets: [{ label: eher fair }, { label: verzerrt }]
      items:
        - { label: Los aus dem Melderegister, bucket: eher fair }
        - { label: Zufällige Telefonnummern, bucket: eher fair }
        - { label: Jede zehnte Person einer Liste, bucket: eher fair }
        - { label: "Wer will, macht mit", bucket: verzerrt }
        - { label: Nur Leute vor dem Fitnessstudio, bucket: verzerrt }
        - { label: Umfrage in einer Fan-Gruppe, bucket: verzerrt }
    hints:
      - Hat jeder die gleiche Chance, gefragt zu werden?
    explanation: Zufallsauswahlen sind fair. Freiwillige und besondere Orte verzerren das Bild.

  - kind: explain
    id: s4
    body: Was ist besser – 1000 Menschen per Los oder 100 000, die freiwillig antworten?
    reveal:
      body: Die 1000 zufälligen. Viele Antworten helfen nicht, wenn die Auswahl schief ist. 1936 lag eine Umfrage mit zwei Millionen Antworten weit daneben.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Faire oder verzerrte Stichprobe?
    params:
      buckets:
        - id: b1
          label: Fair
        - id: b2
          label: Verzerrt
      items:
        - label: 1000 Menschen per Los gezogen
          bucket: b1
        - label: Online-Umfrage zum Mitmachen
          bucket: b2
        - label: Nur Anrufe am Vormittag
          bucket: b2
        - label: Zufällige Adressen im ganzen Land
          bucket: b1
    hints:
      - Hat jeder dieselbe Chance, gefragt zu werden?
    explanation: Wer sich selbst meldet oder vormittags zu Hause ist, ist nicht typisch.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: In einer Stadt ist jeder Fünfte unter 18. Das Raster ist eine faire Zufallsstichprobe von 25 Menschen. Färbe, wie viele Jugendliche du erwartest.
    params:
      parts: 25
      shape: square
    answer:
      fraction: 1/5
    hints:
      - Eine faire Stichprobe spiegelt die Stadt im Kleinen.
      - Ein Fünftel von 25 sind 5 Felder.
    explanation: 5 von 25 – derselbe Anteil wie in der Stadt. Genau das leistet eine zufällige Auswahl, wenn auch mit etwas Wackeln.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Im Zweiten Weltkrieg zählte man Einschusslöcher an zurückgekehrten Bombern. Wo sollte man die Panzerung verstärken?
    params:
      options:
        - label: Dort, wo **keine** Löcher sind – Treffer dort brachten die Flugzeuge zum Absturz
          correct: true
        - label: Dort, wo die meisten Löcher sind
          feedback: Diese Flugzeuge haben die Treffer ja überlebt.
        - label: Überall gleich
          feedback: Die Daten zeigen ein klares Muster – man muss es nur richtig lesen.
    hints:
      - Welche Flugzeuge fehlen in der Stichprobe?
    explanation: "**Survivorship Bias**: Man sieht nur die Überlebenden. Abraham Wald erkannte das 1943."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele zufällig gewählte Menschen genügen für eine Umfrage in einem Land mit 80 Millionen – auf etwa 3 Punkte genau?"
    params:
      min: 10
      max: 1000000
      scale: log
    answer:
      value: 1000
      within: 60
    explanation: Rund 1000. Es zählt die Zahl der Befragten, kaum die Größe des Landes.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: match
    prompt: Welche Verzerrung steckt dahinter?
    params:
      pairs:
        - left: Nur wer will, antwortet.
          right: Selbstauswahl
        - left: Wer kein Telefon hat, fehlt.
          right: Abdeckungsfehler
        - left: Viele legen einfach auf.
          right: Nichtantwort
        - left: Nur aktive Kunden werden gefragt.
          right: Überlebende-Fehler
      leftTitle: Situation
      rightTitle: Verzerrung
    hints:
      - "Frag jeweils: Wer fehlt – und warum?"
      - "Selbstauswahl heißt: Die Leute entscheiden selbst, ob sie mitmachen."
    explanation: "Alle vier Fehler haben dieselbe Wurzel: Die Befragten sind keine **Zufallsauswahl** der Menschen, um die es geht."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Ein Institut zieht per Los je 500 Menschen aus Stadt und Land, statt 1000 aus ganz Deutschland. Wie heißt das?
    params:
      options:
        - label: Geschichtete Stichprobe
          correct: true
        - label: Selbstauswahl
          feedback: Hier entscheidet das Los, nicht die Leute.
        - label: Klumpenstichprobe
          feedback: Bei Klumpen zieht man ganze Gruppen, etwa ganze Schulen.
    hints:
      - Die Bevölkerung wird erst in Gruppen geteilt.
      - In jeder Gruppe entscheidet dann der Zufall.
    explanation: Schichten garantieren, dass jede Gruppe vertreten ist. Danach gewichtet man nach den echten Anteilen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: 1936 sagte eine Zeitschrift mit 2,4 Millionen Antworten den falschen US-Präsidenten voraus. Gallup lag mit 50 000 richtig. Warum?
    params:
      options:
        - label: Die Zeitschrift befragte Auto- und Telefonbesitzer – damals vor allem Wohlhabende
          correct: true
        - label: Die Zeitschrift hatte sich verzählt
          feedback: Die Zählung stimmte – die Auswahl war schief.
        - label: Gallup hatte Glück
          feedback: Seine Stichprobe war gezielt repräsentativ.
    hints:
      - Wer besaß 1936 ein Telefon?
    explanation: Eine große, verzerrte Stichprobe liefert nur einen sehr präzisen falschen Wert.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Von 1000 Angeschriebenen antworten 200, davon sind 150 zufrieden. Die 800 anderen sind unbekannt. Wie viel Prozent aller 1000 sind **mindestens** zufrieden?
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 75
        misconception: ignore-nonresponse
        text: 75 % gilt nur für die, die geantwortet haben.
    hints:
      - "Stell dir den schlimmsten Fall vor: Keiner der 800 ist zufrieden."
      - Dann sind es 150 von 1000.
    explanation: Mindestens 15 %, höchstens 95 % (wenn alle 800 zufrieden wären). Ohne Annahmen über die Schweigenden bleibt nur diese weite Spanne.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum eine riesige Online-Umfrage schlechter sein kann als eine kleine Zufallsstichprobe.
    params:
      keywords:
        - - zufall
          - los
          - random
          - chance
        - - verzerr
          - schief
          - freiwillig
          - bias
          - skew
          - volunteer
          - selbst
        - - größe
          - menge
          - viele
          - mehr
          - size
          - many
          - more
      sample: Bei der Zufallsstichprobe hat jeder dieselbe Chance. In der Online-Umfrage antworten freiwillig nur bestimmte Leute, die Auswahl ist verzerrt. Mehr Antworten machen diesen Fehler nicht kleiner.
    explanation: Zufall bekämpft die Verzerrung, Masse nur das Rauschen. Eine schiefe Auswahl bleibt schief, egal wie groß.
    difficulty: 3

srs:
  cards_from: [fanseite, einordnen]
