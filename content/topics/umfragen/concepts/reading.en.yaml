id: stats.sampling.reading
type: concept
title: Percent or Percentage Points?
summary: A small word with a big effect.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One word, two numbers
    body: '"Party X surges!" is a common headline. Drag the right bar from 10 % to 15 %. Is that a rise of 5 % or of 50 %? A small phrase helps here: **percentage points**.'
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - "2020"
          - "2024"
        values:
          - 10
          - 10
        editable:
          - 1
        min: 0
        max: 30
        unit: "%"
        title: Poll for party X

  - kind: problem
    id: punkte
    widget: numeric
    prompt: A party rises from {{a}}% to {{b}}%. By how many percentage points did it rise?
    params: { unit: percentage points }
    answer: { value: "{{b - a}}" }
    hints:
      - Percentage points are simply the difference.
    explanation: "{{b}} − {{a}} = {{b - a}} percentage points."
    variants:
      params: { a: "choice[10,20,25,40]", d: "choice[2,5,10]" }
      derive: { b: "a + d" }
      defaults: { a: 20, d: 5 }

  - kind: problem
    id: prozent
    widget: numeric
    prompt: And by what percent did it grow – from 20% to 25%?
    params: { unit: "%" }
    answer: { value: 25 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: points-vs-percent
        text: 5 is the percentage points. The question is growth relative to 20.
    hints:
      - 5 out of 20 is what percent?
    explanation: 5 / 20 = 25%. The same change, a very different number.

  - kind: explain
    id: s3
    body: |
      **Percentage points** are the difference between two percentages. **Percent** describes the relative change.
      Headlines like to mix them up – usually they pick the bigger number.

  - kind: problem
    id: risiko
    widget: choice
    prompt: "“A drug doubles the risk!” Before, it was 1 in 10,000. How big is it now?"
    params:
      options:
        - { label: "2 in 10,000", correct: true }
        - { label: 50%, feedback: "Doubling applies to the small starting risk." }
        - { label: 1 in 5000 – so huge, feedback: "That is the same as 2 in 10,000 – and still tiny." }
    hints:
      - Doubling means times 2.
    explanation: The relative risk sounds dramatic, but the absolute risk stays tiny – 0.02%.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Party Y stood at 20 %. Now it has grown by 50 percent. Set the new value.
    params:
      labels:
        - before
        - after
      values:
        - 20
        - 20
      editable:
        - 1
      min: 0
      max: 40
      unit: "%"
    answer:
      values:
        - 20
        - 30
    hints:
      - What is 50 percent of 20?
      - 20 + 10 = 30 – that is 10 percentage points more.
    explanation: "50 % growth here means: from 20 % to 30 %. That is only 10 **percentage points**."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A drug lowers the risk from 2% to 1%. How many people must take it for **one** to benefit?
    answer:
      value: 100
    hints:
      - Of 100, 2 fall ill without the drug and 1 with it.
    explanation: 100 – the **number needed to treat**. “Halves the risk” sounds far more impressive.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: A value rises from {{a}} to {{b}}. By what percent is that?
    answer:
      value: "{{(b - a) * 100 / a}}"
    feedback:
      - when: numval(state.input) == b - a
        misconception: points-vs-percent
        text: That is the difference in points. Now divide by the old value.
    hints:
      - The change is {{b - a}}.
      - Divide {{b - a}} by the starting value {{a}}, times 100.
    explanation: "{{b - a}} ÷ {{a}} = {{(b - a) * 100 / a}} %. The reference is always the old value."
    difficulty: 2
    variants:
      params:
        a: choice[4,5,8,10,20,25]
        b: int[5,40]
      constraints:
        - b > a
        - isInt((b - a) * 100 / a)
      defaults:
        a: 4
        b: 6

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: A drug lowers the risk from 4 % to 3 %. By what percent does the risk fall in relative terms?
    answer:
      value: 25
    feedback:
      - when: numval(state.input) == 1
        misconception: absolute-vs-relative
        text: "That is the absolute reduction: 1 percentage point. Relative means: compared with 4 %."
    hints:
      - The reduction is 1 point.
      - What percent is 1 of 4?
    explanation: "Relative −25 %, absolute −1 point. Adverts like to quote the 25 %. The honest version: 1 in 100 benefits."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A headline: “Sausage raises bowel cancer risk by 18%.” The baseline risk is about 5%. What does that mean in absolute numbers?"
    params:
      options:
        - label: The risk rises from about 5% to about 6%
          correct: true
        - label: It rises to 23%
          feedback: 18% is meant relative to 5%, not added.
        - label: 18 of 100 sausage eaters fall ill
          feedback: That would be an absolute risk of 18%.
    hints:
      - 18% of 5% is just under one percentage point.
    explanation: Always ask for the **absolute risk**. Relative figures without a baseline are almost worthless.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Betting odds say »1 to 4«: one success for every four failures. What probability is that, in percent?"
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 25
        misconception: odds-vs-prob
        text: 1 to 4 means 1 in 5 cases, not 1 in 4.
    hints:
      - How many cases are there in total?
      - 1 success out of 1 + 4 = 5 cases.
    explanation: "Odds of 1 : 4 correspond to 1/5 = 20 %. Medical studies often report odds ratios – easy to confuse."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: A share falls by 50 % and then rises by 50 %. It started at 100 €. Where is it now?
    params:
      unit: €
    answer:
      value: 75
    feedback:
      - when: numval(state.input) == 100
        misconception: percent-base
        text: The 50 % rise refers to the new, smaller value.
    hints:
      - "After the fall: 50 €."
      - 50 % of 50 € is 25 €.
    explanation: "100 → 50 → 75. Percentages multiply: 0.5 · 1.5 = 0.75. After −50 % you need +100 % to get back."
    difficulty: 3

srs:
  cards_from: [punkte, risiko]
