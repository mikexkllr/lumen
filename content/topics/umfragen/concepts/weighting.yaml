id: stats.sampling.weighting
type: concept
title: Gewichten
summary: Wenn eine Gruppe zu oft gefragt wurde.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zu-viele
    widget: choice
    prompt: In einer Umfrage sind 70 % der Befragten über 60 Jahre alt. In der Bevölkerung sind es 30 %. Was tun?
    params:
      options:
        - { label: Die Antworten gewichten – Ältere zählen weniger., correct: true }
        - { label: Das Ergebnis einfach so veröffentlichen., feedback: "Dann sprechen Ältere viel zu laut." }
        - { label: Alle Älteren streichen., feedback: "Dann fehlt ihre Meinung ganz." }
    hints:
      - Wie bekommt jede Gruppe ihr richtiges Gewicht?
    explanation: Man rechnet jede Gruppe auf ihren echten Anteil um.

  - kind: explain
    id: s2
    body: |
      Beim **Gewichten** zählt jede Gruppe mit ihrem echten Anteil. Sagen 40 % der Jungen und 60 % der Älteren ja, und beide sind je die Hälfte des Landes, dann sind es 50 %.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: "{{a}} % der Jüngeren und {{b}} % der Älteren sind dafür. Jüngere sind 60 % der Bevölkerung. Wie viel Prozent sind insgesamt dafür?"
    params: { unit: "%" }
    answer: { value: "{{0.6 * a + 0.4 * b}}" }
    feedback:
      - when: "numval(state.input) == (a + b) / 2"
        misconception: unweighted
        text: Das ist der einfache Schnitt. Die Jüngeren zählen aber mit 60 %.
    hints:
      - "0,6 · {{a}} + 0,4 · {{b}}."
    explanation: "{{0.6 * a}} + {{0.4 * b}} = {{0.6 * a + 0.4 * b}} %."
    variants:
      params: { a: "step[20,80,10]", b: "step[20,80,10]" }
      constraints: ["a != b"]
      defaults: { a: 40, b: 70 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einer Umfrage sind 70 % Ältere (60 % Zustimmung) und 30 % Jüngere (20 % Zustimmung). In der Bevölkerung sind Ältere nur 30 %. Wie hoch ist die gewichtete Zustimmung in Prozent?
    params:
      unit: "%"
    answer:
      value: 32
    hints:
      - 0,3 · 60 + 0,7 · 20.
    explanation: 18 + 14 = 32 %. Ungewichtet kämen 48 % heraus – ein riesiger Unterschied.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: In der Stichprobe sind 70 % Ältere, in der Bevölkerung 30 %. Mit welchem Gewicht zählt eine ältere Person? Als Bruch.
    answer:
      value: 3/7
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 7 / 3
        misconception: inverted-weight
        text: "Umgekehrt: Ältere sind zu oft dabei, ihr Gewicht muss kleiner als 1 sein."
    hints:
      - "Gewicht = Anteil in der Bevölkerung : Anteil in der Stichprobe."
      - "Rechne 30 : 70."
    explanation: 30/70 = 3/7 ≈ 0,43. Jüngere bekommen 70/30 ≈ 2,33. So zählt jede Gruppe mit ihrem echten Anteil.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Ein Institut gewichtet nach Alter, Geschlecht und Wohnort. Welche Verzerrung bleibt trotzdem?
    params:
      options:
        - label: Wenn Antwortende sich in anderen Dingen von Schweigenden unterscheiden
          correct: true
        - label: Keine – Gewichten macht alles fair
          feedback: Gewichten korrigiert nur Merkmale, die man kennt.
        - label: Das Geschlecht
          feedback: Danach wurde ja gewichtet.
    hints:
      - Welche Merkmale kennt das Institut über die ganze Bevölkerung?
      - Interesse an Politik kennt man nicht aus der Statistik.
    explanation: Politisch Interessierte antworten öfter – auch innerhalb jeder Altersgruppe. Das korrigiert kein Gewicht nach Alter.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum sind 1000 zufällig Befragte besser als 100 000 Freiwillige?"
    params:
      keywords:
        - - zufall
          - zufällig
          - random
        - - verzerr
          - schief
          - bias
          - skew
          - einseitig
        - - repräsentativ
          - bevölkerung
          - alle
          - representative
          - population
          - everyone
          - gleiche chance
      sample: "Bei einer zufälligen Auswahl hat jeder die gleiche Chance, gefragt zu werden – die Stichprobe ist repräsentativ. Freiwillige sind einseitig: Es melden sich vor allem Leute mit starker Meinung, das verzerrt das Ergebnis, egal wie viele es sind."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Gewichte kosten Genauigkeit. Die **effektive Stichprobe** ist (Summe der Gewichte)² : (Summe der Quadrate). 500 Befragte haben Gewicht 1, 500 haben Gewicht 3. Wie groß ist sie?"
    answer:
      value: 800
    hints:
      - "Summe der Gewichte: 500 + 1500 = 2000. Summe der Quadrate: 500 + 4500."
      - "Rechne 2000² : 5000."
    explanation: "4 000 000 : 5000 = 800. Die 1000 Befragten sind nach dem Gewichten nur so genau wie 800 ungewichtete."
    difficulty: 3

srs:
  cards_from: [zu-viele, rechnen]
