id: stats.sampling.questions
type: concept
title: Wie man fragt
summary: Die Frage formt die Antwort.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Wort kippt alles
    body: Umfragen sollen messen, was Menschen denken. Doch schon ein Wort kann das Ergebnis kippen. Deck die Karten auf, in beliebiger Reihenfolge. Jede zeigt, wie die **Frage** die Antwort formt.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚫
            front: Verbieten oder nicht erlauben?
            back: "Gleiche Frage, andere Worte: 46 % wollten Reden »verbieten«, aber 62 % wollten sie »nicht erlauben«."
          - icon: 🤝
            front: Sozialhilfe oder Hilfe für Arme?
            back: In den USA finden viele, man gibt zu viel für »Sozialhilfe« aus – aber zu wenig für »Hilfe für Arme«.
          - icon: 🥇
            front: Wer zuerst steht …
            back: Auf Papier wählen Menschen öfter die erste Antwort, am Telefon eher die letzte.
          - icon: 🙂
            front: Das bequeme Ja
            back: Fragt man »Stimmen Sie zu …?«, sagen viele einfach Ja – fast egal, worum es geht.

  - kind: problem
    id: suggestiv
    widget: choice
    prompt: Welche Frage ist neutral?
    params:
      options:
        - { label: Wie bewerten Sie den neuen Radweg?, correct: true }
        - { label: Finden Sie den teuren Radweg nicht auch überflüssig?, feedback: "Diese Frage legt die Antwort schon nahe." }
        - { label: Sind Sie für mehr Sicherheit durch den Radweg?, feedback: "Wer ist schon gegen Sicherheit? Die Frage lenkt." }
    hints:
      - Welche Frage verrät keine Meinung?
    explanation: Neutrale Fragen enthalten keine Wertung und keine versteckte Begründung.

  - kind: explain
    id: s2
    body: |
      **Suggestivfragen** lenken die Antwort. Auch die Reihenfolge der Antworten und die Wortwahl wirken.
      »Steuer« und »Beitrag« können für dasselbe ganz andere Zustimmung bekommen.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Neutral oder lenkend?
    params:
      buckets: [{ label: neutral }, { label: lenkend }]
      items:
        - { label: Wie oft fahren Sie Bus?, bucket: neutral }
        - { label: Wie zufrieden sind Sie – Skala 1 bis 5?, bucket: neutral }
        - { label: Sind Sie auch gegen die Gebühr?, bucket: lenkend }
        - { label: Sollte man Gewalt nicht stoppen?, bucket: lenkend }
    hints:
      - Steckt eine Meinung in der Frage?
    explanation: Fragen mit »auch«, »nicht« oder Wertungen schieben in eine Richtung.

  - kind: problem
    id: skala
    widget: choice
    prompt: Eine Umfrage bietet nur »sehr gut«, »gut« und »eher gut« an. Was ist das Problem?
    params:
      options:
        - { label: Es gibt keine negative Antwort., correct: true }
        - { label: Es sind zu wenige Antworten., feedback: "Drei sind genug – wenn sie ausgewogen sind." }
    hints:
      - Kann man hier Kritik äußern?
    explanation: Ohne negative Antworten muss das Ergebnis positiv aussehen.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Neutral gefragt oder suggestiv?
    params:
      buckets:
        - id: b1
          label: Neutral
        - id: b2
          label: Suggestiv
      items:
        - label: »Wie zufrieden sind Sie mit dem Bus?«
          bucket: b1
        - label: »Finden Sie nicht auch, dass …?«
          bucket: b2
        - label: »Sind Sie für oder gegen das Gesetz?«
          bucket: b1
        - label: »Sind Sie gegen diese unfaire Steuer?«
          bucket: b2
    hints:
      - Steckt die gewünschte Antwort schon in der Frage?
    explanation: Wertende Wörter und »nicht auch« schieben in eine Richtung.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "[[Suggestivfragen]] lenken die Antwort. Auch die [[Wortwahl]] wirkt."
      distractors:
        - Zufallsfragen
        - Uhrzeit

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Bei der Frage »Haben Sie schon einmal Steuern hinterzogen?« antworten viele nicht ehrlich. Wie heißt dieser Effekt?
    params:
      options:
        - label: Soziale Erwünschtheit
          correct: true
        - label: Stichprobenfehler
          feedback: Der entsteht durch Zufall, nicht durch Unehrlichkeit.
        - label: Placebo-Effekt
          feedback: Der gehört zur Medizin.
    hints:
      - Menschen wollen gut dastehen.
    explanation: Heikle Themen werden systematisch falsch berichtet. Anonyme Verfahren mildern das.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Randomized Response: Bei Kopf sagt man »ja«, bei Zahl die Wahrheit. Dann gilt: Anteil »ja« = 50 % + die Hälfte des wahren Anteils. {{y}} % sagen »ja«. Wie groß ist der wahre Anteil?"
    params:
      unit: "%"
    answer:
      value: "{{2 * y - 100}}"
    hints:
      - "Zieh die 50 % der Münz-Jas ab: {{y - 50}} %."
      - Das ist nur die Hälfte der Wahrheits-Sager. Verdopple.
    explanation: ({{y}} − 50) · 2 = {{2 * y - 100}} %. Kein Einzelner verrät sich – und trotzdem kennt man den Anteil.
    difficulty: 2
    variants:
      params:
        y: step[55,90,5]
      defaults:
        y: 60

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Bei Ja/Nein-Fragen stimmen manche Menschen fast allem zu – egal was gefragt wird. Wie verhindert man, dass das die Ergebnisse verzerrt?
    params:
      options:
        - label: Die Hälfte der Fragen umgekehrt formulieren
          correct: true
        - label: Nur Ja/Nein-Fragen stellen
          feedback: Das verstärkt die Ja-Sage-Tendenz noch.
        - label: Die Antworten der Ja-Sager löschen
          feedback: Damit verliert man eine ganze Gruppe.
    hints:
      - Wenn jemand bei allem »ja« sagt, widerspricht er sich bei umgedrehten Fragen.
      - So heben sich die Ja-Antworten teilweise auf.
    explanation: Die **Ja-Sage-Tendenz** heißt Akquieszenz. Gemischte Polung macht sie sichtbar und gleicht sie aus.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Die **Randomized-Response-Technik**: Jeder wirft heimlich eine Münze. Bei Kopf sagt er »ja«, bei Zahl die Wahrheit. 60 % sagen »ja«. Wie viele haben es wirklich getan?"
    params:
      options:
        - label: 20 %
          correct: true
        - label: 60 %
          feedback: Die Hälfte aller Antworten sind erzwungene »Ja«.
        - label: 10 %
          feedback: Unter den ehrlichen 50 % sagen 10 von 50 »ja« – das sind 20 %.
    hints:
      - 50 % sagen wegen der Münze »ja«. Die restlichen 10 % stammen von der ehrlichen Hälfte.
    explanation: 10 von 50 = 20 %. Niemand muss sich offenbaren – und trotzdem kennt man den Anteil.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Ärzte bekamen dieselbe Operation einmal als »90 % überleben den ersten Monat«, einmal als »10 % sterben im ersten Monat« beschrieben. Was zeigen Studien dazu?
    params:
      options:
        - label: Bei »überleben« wird die Operation deutlich öfter empfohlen
          correct: true
        - label: Fachleute lassen sich davon nicht beeinflussen
          feedback: Auch Ärzte reagieren auf den Rahmen.
        - label: Bei »sterben« wird sie öfter gewählt, weil es ehrlicher klingt
          feedback: Der Effekt geht in die andere Richtung.
    hints:
      - 90 % und 10 % beschreiben exakt dasselbe.
      - Welche Formulierung fühlt sich besser an?
    explanation: "Das ist der **Framing-Effekt**: Der Rahmen ändert die Entscheidung, nicht die Fakten. Gute Umfragen und Aufklärung nennen beide Seiten."
    difficulty: 3

srs:
  cards_from: [suggestiv, einordnen]
