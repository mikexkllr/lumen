id: stats.sampling.questions
type: concept
title: Wie man fragt
summary: Die Frage formt die Antwort.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: suggestiv
    widget: choice
    prompt: Welche Frage ist neutral?
    params:
      options:
        - { label: Wie bewerten Sie den neuen Radweg?, correct: true }
        - { label: Finden Sie den teuren Radweg nicht auch überflüssig?, feedback: "Diese Frage legt die Antwort schon nahe." }
        - { label: Sind Sie für mehr Sicherheit durch den Radweg?, feedback: "Wer ist schon gegen Sicherheit? Die Frage lenkt." }
    hints:
      - Welche Frage verrät keine Meinung?
    explanation: Neutrale Fragen enthalten keine Wertung und keine versteckte Begründung.

  - kind: explain
    body: |
      **Suggestivfragen** lenken die Antwort. Auch die Reihenfolge der Antworten und die Wortwahl wirken.
      »Steuer« und »Beitrag« können für dasselbe ganz andere Zustimmung bekommen.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Neutral oder lenkend?
    params:
      buckets: [{ label: neutral }, { label: lenkend }]
      items:
        - { label: Wie oft fahren Sie Bus?, bucket: neutral }
        - { label: Wie zufrieden sind Sie – Skala 1 bis 5?, bucket: neutral }
        - { label: Sind Sie auch gegen die Gebühr?, bucket: lenkend }
        - { label: Sollte man Gewalt nicht stoppen?, bucket: lenkend }
    hints:
      - Steckt eine Meinung in der Frage?
    explanation: Fragen mit »auch«, »nicht« oder Wertungen schieben in eine Richtung.

  - kind: problem
    id: skala
    widget: choice
    prompt: Eine Umfrage bietet nur »sehr gut«, »gut« und »eher gut« an. Was ist das Problem?
    params:
      options:
        - { label: Es gibt keine negative Antwort., correct: true }
        - { label: Es sind zu wenige Antworten., feedback: "Drei sind genug – wenn sie ausgewogen sind." }
    hints:
      - Kann man hier Kritik äußern?
    explanation: Ohne negative Antworten muss das Ergebnis positiv aussehen.

srs:
  cards_from: [suggestiv, einordnen]
