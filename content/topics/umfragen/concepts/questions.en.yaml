id: stats.sampling.questions
type: concept
title: How to Ask
summary: The question shapes the answer.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: suggestiv
    widget: choice
    prompt: Which question is neutral?
    params:
      options:
        - { label: How do you rate the new bike lane?, correct: true }
        - { label: Don't you also find the expensive bike lane unnecessary?, feedback: "This question already suggests the answer." }
        - { label: Are you in favor of more safety through the bike lane?, feedback: "Who is against safety? The question steers." }
    hints:
      - Which question gives away no opinion?
    explanation: Neutral questions contain no judgment and no hidden justification.

  - kind: explain
    id: s2
    body: |
      **Leading questions** steer the answer. The order of answer options and the choice of words matter too.
      “Tax” and “fee” can get very different approval for the same thing.

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Neutral or leading?
    params:
      buckets: [{ label: neutral }, { label: leading }]
      items:
        - { label: How often do you take the bus?, bucket: neutral }
        - { label: How satisfied are you – scale 1 to 5?, bucket: neutral }
        - { label: Are you also against the fee?, bucket: leading }
        - { label: Shouldn't violence be stopped?, bucket: leading }
    hints:
      - Is there an opinion inside the question?
    explanation: Questions with “also,” “not,” or value judgments push in one direction.

  - kind: problem
    id: skala
    widget: choice
    prompt: A poll offers only “very good,” “good,” and “rather good.” What is the problem?
    params:
      options:
        - { label: There is no negative answer., correct: true }
        - { label: There are too few answers., feedback: "Three are enough – if they are balanced." }
    hints:
      - Can anyone voice criticism here?
    explanation: Without negative answers, the result has to look positive.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Asked neutrally or leading?
    params:
      buckets:
        - id: b1
          label: Neutral
        - id: b2
          label: Leading
      items:
        - label: “How happy are you with the bus?”
          bucket: b1
        - label: “Do you not also think that …?”
          bucket: b2
        - label: “Are you for or against the law?”
          bucket: b1
        - label: “Are you against this unfair tax?”
          bucket: b2
    hints:
      - Is the wanted answer already in the question?
    explanation: Loaded words and “not also” push in one direction.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "[[Leading questions]] steer the answer. The [[wording]] has an effect too."
      distractors:
        - Random questions
        - time

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Asked “Have you ever evaded taxes?” many do not answer honestly. What is this effect called?
    params:
      options:
        - label: Social desirability
          correct: true
        - label: Sampling error
          feedback: That arises from chance, not from dishonesty.
        - label: Placebo effect
          feedback: That belongs to medicine.
    hints:
      - People want to look good.
    explanation: Sensitive topics are systematically misreported. Anonymous methods mitigate this.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The **randomised response technique**: everyone secretly tosses a coin. On heads they say “yes”, on tails the truth. 60% say “yes”. How many really did it?"
    params:
      options:
        - label: 20%
          correct: true
        - label: 60%
          feedback: Half of all answers are forced “yes”.
        - label: 10%
          feedback: Among the honest 50%, 10 of 50 say “yes” – that is 20%.
    hints:
      - 50% say “yes” because of the coin. The remaining 10% come from the honest half.
    explanation: 10 of 50 = 20%. Nobody has to reveal themselves – and yet the share is known.
    difficulty: 3

srs:
  cards_from: [suggestiv, einordnen]
