id: logic.propositional.negation
type: concept
title: Richtig verneinen
summary: Aus »alle« wird »mindestens einer nicht«.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Gegenteil von »und«
    body: Verneinen klingt leicht – bis »und« ins Spiel kommt. Nimm den Satz »Ich bin müde und hungrig«. Färbe alle Bereiche, die zu seinem **Gegenteil** passen. Sind es mehr, als du dachtest?
    visual:
      widget: venn
      interactive: true
      params:
        sets:
          - müde
          - hungrig
        outside: true

  - kind: problem
    id: schwaene
    widget: choice
    prompt: Was ist das logische Gegenteil von »Alle Schwäne sind weiß«?
    params:
      options:
        - { label: Mindestens ein Schwan ist nicht weiß., correct: true }
        - { label: Alle Schwäne sind schwarz., feedback: "Das ist ein Extrem, kein Gegenteil. Ein einziger dunkler Schwan reicht." }
        - { label: Kein Schwan ist weiß., feedback: "Zu stark. Es reicht, wenn einer nicht weiß ist." }
    hints:
      - Was müsste man finden, um die Aussage zu widerlegen?
    explanation: Ein einziger nicht weißer Schwan widerlegt »alle«.

  - kind: explain
    id: s2
    body: |
      **Alle** verneint man mit **mindestens einer nicht**.
      **Es gibt** verneint man mit **keiner**.

  - kind: problem
    id: kuchen
    widget: choice
    prompt: Was ist das Gegenteil von »Jemand hat den Kuchen gegessen«?
    params:
      options:
        - { label: Niemand hat den Kuchen gegessen., correct: true }
        - { label: Jemand hat den Kuchen nicht gegessen., feedback: "Das kann gleichzeitig mit der Aussage stimmen." }
        - { label: Alle haben den Kuchen gegessen., feedback: "Das passt sogar zur Aussage." }
    hints:
      - Wann wäre »jemand hat …« falsch?
    explanation: »Es gibt jemanden« ist nur falsch, wenn es keinen gibt.

  - kind: explain
    id: s4
    body: |
      **De Morgan:** ¬(A ∧ B) ist ¬A ∨ ¬B. Und ¬(A ∨ B) ist ¬A ∧ ¬B.
      Beim Verneinen tauschen *und* und *oder* die Plätze.

  - kind: problem
    id: und-verneinen
    widget: choice
    prompt: Was ist das Gegenteil von »Es regnet und es ist kalt«?
    params:
      options:
        - { label: Es regnet nicht oder es ist nicht kalt., correct: true }
        - { label: Es regnet nicht und es ist nicht kalt., feedback: "Zu streng. Schon warmer Regen macht die Aussage falsch." }
        - { label: Es regnet oder es ist kalt., feedback: "Hier fehlt das Verneinen." }
    hints:
      - Die Aussage ist falsch, sobald ein Teil nicht stimmt.
    explanation: Nach De Morgan wird aus »und« ein »oder«, und beide Teile werden verneint.

  - kind: problem
    id: weder-noch
    widget: gates
    prompt: Die Lampe soll nur leuchten, wenn beide Schalter aus sind. Wähle das erste Gatter.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: g, type: "?", in: [A, B], options: [AND, OR] }
        - { id: n, type: NOT, in: [g] }
      outputs: [{ id: Q, from: n, label: Lampe }]
    check: { predicate: "table('Q') == [1, 0, 0, 0]" }
    hints:
      - Weder A noch B heißt – nicht (A oder B).
    explanation: Nicht (A oder B) ist dasselbe wie »nicht A und nicht B«.

  - kind: problem
    id: mix-c1
    widget: match
    prompt: Verbinde jede Aussage mit ihrer Verneinung.
    params:
      pairs:
        - left: Alle sind da
          right: Mindestens einer fehlt
        - left: Es gibt einen Fehler
          right: Es gibt keinen Fehler
        - left: A und B
          right: nicht A oder nicht B
        - left: A oder B
          right: nicht A und nicht B
    hints:
      - Aus »alle« wird »mindestens einer nicht«. Und und oder tauschen.
    explanation: Verneinen dreht die Aussage genau um – nicht mehr und nicht weniger.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Beim Verneinen tauschen »und« und »[[oder]]« die Plätze. Aus »alle« wird »mindestens [[einer]] nicht«.
      distractors:
        - aber
        - keiner

  - kind: problem
    id: mix-c3
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: »Alle Schwäne sind weiß.« – »Mindestens ein Schwan ist nicht weiß.«
          right: true
        - text: »Alle Schwäne sind weiß.« – »Kein Schwan ist weiß.«
          right: false
          why: "Zu stark: Ein einziger genügt."
        - text: »Es gibt ein Einhorn.« – »Es gibt kein Einhorn.«
          right: true
        - text: »Es regnet und stürmt.« – »Es regnet nicht und stürmt nicht.«
          right: false
          why: Es reicht, wenn eines von beiden nicht stimmt.
      left: Falsch verneint
      right: Richtig verneint

  - kind: problem
    id: intro-c1
    widget: venn
    prompt: Färbe alle Bereiche, in denen »Es ist laut oder hell« **nicht** gilt.
    params:
      sets:
        - laut
        - hell
      outside: true
    answer:
      regions:
        - O
    hints:
      - »Laut oder hell« gilt in allen drei Bereichen innerhalb der Kreise.
      - Für das Gegenteil bleibt nur der Bereich außerhalb beider Kreise.
    explanation: "¬(A ∨ B) ist ¬A ∧ ¬B: weder laut noch hell. Das ist nur der Bereich außerhalb."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was ist das Gegenteil von »Jeder Schüler hat mindestens ein Buch gelesen«?
    params:
      options:
        - label: Mindestens ein Schüler hat kein einziges Buch gelesen
          correct: true
        - label: Kein Schüler hat ein Buch gelesen
          feedback: Das ist viel zu stark – einer genügt als Gegenbeispiel.
        - label: Jeder Schüler hat kein Buch gelesen
          feedback: Auch das ist nicht das logische Gegenteil.
    hints:
      - Aus »jeder« wird »mindestens einer nicht« – und aus »mindestens ein« wird »kein«.
    explanation: Beim Verneinen kippt jedes »alle« zu »es gibt« und umgekehrt.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: gates
    prompt: Baue »nicht (A und B)« aus zwei NICHT-Gattern und einem Gatter deiner Wahl.
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: na
          type: NOT
          in:
            - A
        - id: nb
          type: NOT
          in:
            - B
        - id: g
          type: "?"
          in:
            - na
            - nb
          options:
            - AND
            - OR
      outputs:
        - id: Q
          from: g
          label: nicht (A und B)
    check:
      predicate: table('Q') == [1, 1, 1, 0]
    feedback:
      - when: table('Q') == [1, 0, 0, 0]
        misconception: demorgan-keep-and
        text: Das ist »weder A noch B«. Beim Verneinen wird aus UND ein ODER.
    hints:
      - »Nicht beide« ist schon wahr, wenn einer fehlt.
      - Nicht A ODER nicht B.
    explanation: ¬(A ∧ B) = ¬A ∨ ¬B – De Morgan als Schaltung.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Was ist das Gegenteil von »Alle Türen sind zu und das Licht ist aus«?
    params:
      options:
        - label: Mindestens eine Tür ist offen oder das Licht ist an.
          correct: true
        - label: Alle Türen sind offen und das Licht ist an.
          feedback: Das ist viel zu stark. Eine offene Tür reicht schon.
        - label: Mindestens eine Tür ist offen und das Licht ist an.
          feedback: Das UND muss beim Verneinen zum ODER werden.
    hints:
      - "Zwei Regeln auf einmal: »alle« wird zu »mindestens eine nicht«, »und« wird zu »oder«."
      - Verneine beide Teile und tausche die Verknüpfung.
    explanation: ¬(∀ zu ∧ aus) = (∃ offen) ∨ an. Quantoren und Verknüpfungen werden beim Verneinen **beide** umgedreht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was ist das Gegenteil von »Wenn es regnet, bleibe ich zu Hause«?
    params:
      options:
        - label: Es regnet, und ich bleibe nicht zu Hause
          correct: true
        - label: Wenn es regnet, bleibe ich nicht zu Hause
          feedback: Das ist eine andere Regel, nicht die Verneinung.
        - label: Wenn es nicht regnet, bleibe ich zu Hause
          feedback: Auch das widerspricht der ersten Aussage nicht.
    hints:
      - Wann ist das Versprechen gebrochen?
    explanation: "Die Verneinung einer Implikation ist ein **und**: A gilt, aber B nicht."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Für ganze Zahlen x von 0 bis 10 gilt die Aussage »x > 3 und x < 7«. Für wie viele dieser Zahlen gilt ihre **Verneinung**?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 3
        misconception: not-negated
        text: "Das sind die Zahlen, für die die Aussage selbst gilt: 4, 5, 6."
    hints:
      - "Verneinung: x ≤ 3 **oder** x ≥ 7."
      - Zähle 0 bis 3 und 7 bis 10.
    explanation: "Die Aussage gilt für 4, 5, 6 – also 3 der 11 Zahlen. Die Verneinung gilt für die übrigen 8. Verneinen heißt immer: genau der Rest."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux die Regeln von De Morgan mit einem Beispiel aus dem Alltag.
    params:
      keywords:
        - - und
          - and
        - - oder
          - or
        - - nicht
          - not
        - - tausch
          - wird zu
          - umgedreht
          - swap
          - becomes
          - flip
      sample: "Nicht (Regen und kalt) heißt: nicht Regen oder nicht kalt. Beim Verneinen wird aus und ein oder, und aus oder wird und. Man verneint jeden Teil und tauscht die Verknüpfung."
    difficulty: 3

srs:
  cards_from: [schwaene, und-verneinen]
