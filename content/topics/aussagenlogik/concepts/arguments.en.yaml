id: logic.propositional.arguments
type: concept
title: Checking arguments
summary: Valid does not mean true.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gueltig
    widget: choice
    body: All birds can fly. Penguins are birds. So penguins can fly.
    prompt: Is this conclusion logically valid?
    params:
      options:
        - { label: "Yes – but one premise is false", correct: true }
        - { label: No, feedback: "The form is fine. The problem is the first statement." }
    hints:
      - Does the conclusion follow from the premises, whether or not they are true?
    explanation: Valid means that if the premises are true, the conclusion is true. Here, "all birds fly" is false.

  - kind: explain
    id: s2
    body: |
      An argument is **valid** if the conclusion follows from the premises. It is **sound** only if the premises are also true.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Valid form or fallacy?
    params:
      buckets: [{ label: valid }, { label: fallacy }]
      items:
        - { label: "All A are B. X is A. So X is B.", bucket: valid }
        - { label: "If A, then B. Not B. So not A.", bucket: valid }
        - { label: "All A are B. X is B. So X is A.", bucket: fallacy }
        - { label: "If A, then B. Not A. So not B.", bucket: fallacy }
    hints:
      - Try an example – dogs are animals, cats are animals …
    explanation: From "X is an animal" it does not follow that "X is a dog".

  - kind: problem
    id: strohmann
    widget: choice
    body: A says we should eat less meat. B replies, "So you want to ban food for everyone?"
    prompt: What is B doing?
    params:
      options:
        - { label: B twists the statement – a straw man., correct: true }
        - { label: B argues soundly., feedback: "A did not call for a ban." }
    hints:
      - Did A call for a ban?
    explanation: A **straw man** attacks an exaggerated version of the argument instead of the real one.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “All birds can fly. Penguins are birds. So penguins can fly.” What is true?
    params:
      options:
        - label: The inference is valid but not sound – the first premise is false
          correct: true
        - label: The inference is invalid
          feedback: The form is impeccable.
        - label: The inference is sound
          feedback: For that all premises would have to be true.
    hints:
      - Check the form first, then the premises.
    explanation: "Logic only guarantees: **if** the premises hold, the conclusion holds."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between a valid and a true argument.
    params:
      keywords:
        - - form
          - struktur
          - folgt
          - form
          - structure
          - follows
        - - voraussetzung
          - prämisse
          - annahme
          - premise
          - assumption
        - - wahr
          - stimmt
          - "true"
          - correct
          - falsch
          - "false"
      sample: Valid only means that the conclusion follows from the premises – that is a matter of form. Whether the argument also shows something true depends on whether the premises are correct.
    difficulty: 3

srs:
  cards_from: [sortieren, gueltig]
