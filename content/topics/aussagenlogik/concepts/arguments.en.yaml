id: logic.propositional.arguments
type: concept
title: Checking arguments
summary: Valid does not mean true.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: gueltig
    widget: choice
    body: All birds can fly. Penguins are birds. So penguins can fly.
    prompt: Is this conclusion logically valid?
    params:
      options:
        - { label: "Yes – but one premise is false", correct: true }
        - { label: No, feedback: "The form is fine. The problem is the first statement." }
    hints:
      - Does the conclusion follow from the premises, whether or not they are true?
    explanation: Valid means that if the premises are true, the conclusion is true. Here, "all birds fly" is false.

  - kind: explain
    id: s2
    body: |
      An argument is **valid** if the conclusion follows from the premises. It is **sound** only if the premises are also true.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Valid form or fallacy?
    params:
      buckets: [{ label: valid }, { label: fallacy }]
      items:
        - { label: "All A are B. X is A. So X is B.", bucket: valid }
        - { label: "If A, then B. Not B. So not A.", bucket: valid }
        - { label: "All A are B. X is B. So X is A.", bucket: fallacy }
        - { label: "If A, then B. Not A. So not B.", bucket: fallacy }
    hints:
      - Try an example – dogs are animals, cats are animals …
    explanation: From "X is an animal" it does not follow that "X is a dog".

  - kind: problem
    id: strohmann
    widget: choice
    body: A says we should eat less meat. B replies, "So you want to ban food for everyone?"
    prompt: What is B doing?
    params:
      options:
        - { label: B twists the statement – a straw man., correct: true }
        - { label: B argues soundly., feedback: "A did not call for a ban." }
    hints:
      - Did A call for a ban?
    explanation: A **straw man** attacks an exaggerated version of the argument instead of the real one.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Is the form of inference valid?
    params:
      buckets:
        - id: b1
          label: Valid
        - id: b2
          label: Invalid
      items:
        - label: All A are B. x is A. So x is B.
          bucket: b1
        - label: If A, then B. B. So A.
          bucket: b2
        - label: If A, then B. Not B. So not A.
          bucket: b1
        - label: Some A are B. x is A. So x is B.
          bucket: b2
    hints:
      - Look for a counterexample. If you find one, the form is invalid.
    explanation: "Valid means: if the premises are true, the conclusion must be true."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “All birds can fly. Penguins are birds. So penguins can fly.” What is true?
    params:
      options:
        - label: The inference is valid but not sound – the first premise is false
          correct: true
        - label: The inference is invalid
          feedback: The form is impeccable.
        - label: The inference is sound
          feedback: For that all premises would have to be true.
    hints:
      - Check the form first, then the premises.
    explanation: "Logic only guarantees: **if** the premises hold, the conclusion holds."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: You know "A or B" and "not A or C". What follows for sure?
    params:
      options:
        - label: B or C
          correct: true
        - label: B and C
          feedback: If A is true, only C follows. If A is false, only B. Both together are not certain.
        - label: A
          feedback: We know nothing about A – it can be true or false.
    hints:
      - "Case 1: A is true. What does the second statement demand?"
      - "Case 2: A is false. What does the first demand?"
    explanation: "This is resolution: A and ¬A cancel, leaving B ∨ C. With this one rule computers prove logical consequences."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: order
    prompt: Use resolution to show that C follows from ¬A ∨ B, ¬B ∨ C and A. Put the steps in order.
    params:
      items:
        - label: "Add the negation of the goal: ¬C"
        - label: A and ¬A ∨ B give B
        - label: B and ¬B ∨ C give C
        - label: C and ¬C give a contradiction
        - label: So C follows from the premises
    hints:
      - "Resolution proves by contradiction: you assume the opposite."
      - Then you resolve pairs like A and ¬A step by step.
    explanation: Deriving a contradiction from the premises plus ¬C proves C. Many automatic provers work exactly like this.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between a valid and a true argument.
    params:
      keywords:
        - - form
          - struktur
          - folgt
          - form
          - structure
          - follows
        - - voraussetzung
          - prämisse
          - annahme
          - premise
          - assumption
        - - wahr
          - stimmt
          - "true"
          - correct
          - falsch
          - "false"
      sample: Valid only means that the conclusion follows from the premises – that is a matter of form. Whether the argument also shows something true depends on whether the premises are correct.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Check the argument "A → B, B, therefore A" with a truth table. In how many rows are both premises true but the conclusion false?
    answer:
      value: 1
    hints:
      - The conclusion A is false – so A is false. When are A → B and B then true?
      - "A false, B true: both premises hold."
    explanation: A single counterexample row (A false, B true) makes the argument invalid. An argument is valid exactly when no such row exists.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: When is an argument from premises P to conclusion S valid?
    params:
      options:
        - label: When "P and not S" cannot be true in any row.
          correct: true
        - label: When S is true.
          feedback: A true conclusion can be right by luck – the form is what counts.
        - label: When P is true.
          feedback: Validity does not ask whether P holds, but whether S follows from P.
    hints:
      - What would a counterexample to the argument look like?
      - Premises true, conclusion false – is there such a row?
    explanation: Valid means "P → S" is a tautology – equivalently, "P ∧ ¬S" is unsatisfiable. That is exactly what resolution shows when it finds a contradiction.
    difficulty: 3

srs:
  cards_from: [sortieren, gueltig]
