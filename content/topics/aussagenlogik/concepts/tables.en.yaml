id: logic.propositional.tables
type: concept
title: Truth tables
summary: All cases at a glance.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: Two lamps can each be on or off. How many combinations are there?
    answer:
      value: 4
    hints:
      - "Count: off-off, off-on …"
    explanation: Four cases. A truth table for two statements has exactly that many rows.

  - kind: explain
    id: s1
    body: |
      A **truth table** lists all cases. With two statements A and B, there are four: false-false, false-true, true-false, true-true.

  - kind: problem
    id: zeilen
    widget: numeric
    prompt: How many rows does a truth table with {{n}} statements have?
    params: { unit: rows }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear
        text: Each new statement doubles the cases.
    hints:
      - Each statement is true or false.
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ rows."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: wenn-dann
    widget: gates
    prompt: Build "if A, then B". It is false only if A is true and B is false. Choose the gate.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NOT, in: [A] }
        - { id: g, type: "?", in: [n, B], options: [AND, OR] }
      outputs: [{ id: Q, from: g, label: "true" }]
    check: { predicate: "table('Q') == [1, 1, 0, 1]" }
    hints:
      - '"If A, then B" is the same as "not A or B".'
    explanation: Not A OR B – that is the implication.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Which statement has the same truth table as "not (A and B)"?
    params:
      options:
        - { label: not A or not B, correct: true }
        - { label: not A and not B, feedback: "That is \"neither A nor B\" – too strict." }
        - { label: A or B, feedback: "That is almost the opposite." }
    hints:
      - De Morgan.
    explanation: By De Morgan, "and" becomes "or".

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many different truth tables are there for a connective of **two** statements?
    answer:
      value: 16
    hints:
      - Four rows, each holding true or false.
    explanation: 2⁴ = 16. “And”, “or”, “if–then” are just three of them.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: In how many of the 8 rows is (A → B) ∧ (B → C) true?
    answer:
      value: 4
    hints:
      - It becomes false when A is true and B false – or B true and C false.
      - 'The true rows are "staircases": once one is true, all later ones are true.'
    explanation: "True are FFF, FFT, FTT and TTT: 4 rows. A chain of implications allows only such staircases."
    difficulty: 2

  - kind: explain
    id: la-d2
    depth: 2
    body: Every truth table gives you a formula. Each true row becomes an and-block, such as A ∧ ¬B. All blocks are joined with or. That is the disjunctive normal form.

  - kind: problem
    id: la-d3
    depth: 2
    widget: choice
    prompt: XOR is true only in the rows "A true, B false" and "A false, B true". What is its disjunctive normal form?
    params:
      options:
        - label: (A ∧ ¬B) ∨ (¬A ∧ B)
          correct: true
        - label: (A ∨ B) ∧ (¬A ∨ ¬B)
          feedback: "That is correct too – but it is the conjunctive form: or-blocks joined by and."
        - label: (A ∧ B) ∨ (¬A ∧ ¬B)
          feedback: Those are exactly the other two rows – "if and only if".
    hints:
      - Write one and-block for each true row.
      - "Row 1: A ∧ ¬B. Row 2: ¬A ∧ B. Then join them with or."
    explanation: Each true row gives one block, and the or collects them. That is why every truth table can be written as a formula with ∧, ∨ and ¬.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A statement that is true in **every** row of its truth table is called a tautology. Which one is?
    params:
      options:
        - label: A or not A
          correct: true
        - label: A and not A
          feedback: That is always false – a contradiction.
        - label: A or B
          feedback: If both are false, it is false.
    hints:
      - It rains – or it does not rain.
    explanation: "The “law of the excluded middle”. Logical laws are tautologies: true by their form alone."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Which assignment satisfies (A ∨ B) ∧ (¬A ∨ B) ∧ (¬B ∨ C)?
    params:
      options:
        - label: B and C true – A does not matter.
          correct: true
        - label: A true, B false, C true
          feedback: Then ¬A ∨ B is false.
        - label: None – the formula is unsatisfiable.
          feedback: "Try B = true: the first two clauses are then satisfied."
    hints:
      - The first two clauses together force something about B.
      - B must be true. What does the third clause then demand?
    explanation: From (A ∨ B) and (¬A ∨ B) follows B. Then (¬B ∨ C) demands that C is true. SAT solvers check formulas in this conjunctive normal form – programs used to verify chips and schedules.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: A formula has 60 variables. Why not simply check it with a truth table?
    params:
      options:
        - label: It would have 2⁶⁰ – over a quintillion – rows.
          correct: true
        - label: Truth tables only work up to three variables.
          feedback: They always work – they just get huge fast.
        - label: Because you would not know which row is true.
          feedback: Each row is easy to compute. The problem is how many there are.
    hints:
      - Every new variable doubles the rows.
      - 2¹⁰ ≈ 1000. So what is 2⁶⁰?
    explanation: 2⁶⁰ ≈ 10¹⁸. Whether satisfiability (SAT) has fast methods in general is the open question P versus NP. Good solvers still often handle millions of variables.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a truth table shows whether two formulas are equivalent.
    params:
      keywords:
        - - zeile
          - fall
          - fälle
          - row
          - case
        - - jede
          - alle
          - every
          - all
        - - gleich
          - dasselbe
          - überein
          - same
          - agree
          - equal
      sample: I write out all rows, every assignment of the variables. For each row I compute both formulas. If they are the same in every row, the formulas are equivalent.
    difficulty: 3

srs:
  cards_from: [zeilen, gleich]
