id: logic.propositional.implication
type: concept
title: If, then – and what does not follow
summary: The most common thinking error with "if".
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The tricky "if"
    body: '"If – then" sounds harmless. Yet this is exactly where the most common **fallacy** in logic happens. Uncover the cards and see where you meet it in daily life.'
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🃏
            front: The card test
            back: In 1966, Peter Wason invented an "if – then" task. Most people get it wrong.
          - icon: 🍦
            front: The ice-cream promise
            back: '"If you finish your plate, you get ice cream." Can you get some without finishing? In logic: yes.'
          - icon: ⚖️
            front: In court
            back: '"If he did it, he was at the scene." Being at the scene does not make someone the culprit.'
          - icon: 🧭
            front: One way only
            back: An if-then sentence is a one-way street. Read backwards, it says something quite different.

  - kind: problem
    id: karten
    widget: choice
    body: Rule – if the front shows a vowel, the back shows an even number.
    prompt: You see the cards A, K, 4 and 7. Which must you flip to check the rule?
    params:
      multiple: true
      layout: grid
      options:
        - { label: A, correct: true }
        - { label: K, feedback: "The rule says nothing about K. The back can show anything." }
        - { label: "4", feedback: "The rule does not forbid an even number behind a consonant." }
        - { label: "7", correct: true }
    hints:
      - Which card could break the rule?
      - A vowel with an odd number would be a violation.
    explanation: A could have an odd number on the back. The 7 could have a vowel on the front. The other two don't matter.

  - kind: explain
    id: s2
    body: |
      "If A, then B" is only **false** if A is true and B is not.
      So you must check A – and everything where B is missing.

  - kind: problem
    id: kontra
    widget: choice
    prompt: It holds that if it rains, the street is wet. What definitely follows?
    params:
      options:
        - { label: "If the street is dry, it is not raining.", correct: true }
        - { label: "If the street is wet, it is raining.", feedback: "The street can also be wet because someone is watering flowers." }
        - { label: "If it is not raining, the street is dry.", feedback: "The street can be wet even without rain." }
    hints:
      - Turn the rule around and negate both parts.
    explanation: This is the **contrapositive**. From "if A, then B" follows "if not B, then not A".

  - kind: problem
    id: schluesse
    widget: buckets
    body: Rule – if I am sick, I stay home.
    prompt: Valid conclusion or fallacy?
    params:
      buckets: [{ label: valid }, { label: fallacy }]
      items:
        - { label: "I am sick – so I am home.", bucket: valid }
        - { label: "I am not home – so I am healthy.", bucket: valid }
        - { label: "I am home – so I am sick.", bucket: fallacy }
        - { label: "I am healthy – so I am not home.", bucket: fallacy }
    hints:
      - You can also be home for other reasons.
    explanation: The rule itself and its contrapositive are valid. The converses are fallacies.

  - kind: explain
    id: s5
    body: Why do so many people fall for this fallacy?
    reveal:
      body: In everyday speech, we often mean "if and only if". In logic, "if" works in only one direction.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: “If it rains, the road is wet.” What follows for sure?
    params:
      buckets:
        - id: b1
          label: Follows for sure
        - id: b2
          label: Does not follow
      items:
        - label: It rains. So road wet.
          bucket: b1
        - label: Road dry. So no rain.
          bucket: b1
        - label: Road wet. So it rains.
          bucket: b2
        - label: No rain. So road dry.
          bucket: b2
    hints:
      - Can the road be wet without rain?
    explanation: Only the forward step and the reverse step with “not” are safe.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: “If A, then B” is only false when A is [[true]] and B is [[false]].
      distractors:
        - possible

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “If the moon is made of cheese, then 2 + 2 = 5.” Is this statement logically true or false?
    params:
      options:
        - label: True – an implication with a false premise is always true
          correct: true
        - label: False – both are nonsense
          feedback: “If, then” is only false when the premise holds and the consequence does not.
        - label: Neither
          feedback: In propositional logic every statement has a truth value.
    hints:
      - When exactly is “if A, then B” false?
    explanation: A promise “if it rains, I will come” is not broken if it does not rain at all.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: From "A → B" and "A" follows [[B]]. That is modus ponens. From "A → B" and "¬B" follows [[¬A]]. That is modus tollens.
      distractors:
        - A
        - ¬B
    hints:
      - "Forwards: the condition is met. Backwards: the consequence is missing."
    explanation: Only these two inferences are valid. B tells you nothing about A, and ¬A nothing about B.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: '"A ↔ B" means "A if and only if B". In how many of the 4 rows is it true?'
    params:
      options:
        - label: In 2 – when both are true or both are false.
          correct: true
        - label: In 3 – like "if … then".
          feedback: With ↔ the case "A false, B true" is false too.
        - label: In 1 – only when both are true.
          feedback: That would be "and". When both are false, they also agree.
    hints:
      - A ↔ B is the same as (A → B) ∧ (B → A).
      - When do A and B have the same truth value?
    explanation: "The biconditional is true when A and B agree: true–true and false–false. It is exactly the opposite of XOR."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which statement is logically **equivalent** to “if A, then B”?
    params:
      options:
        - label: Not A or B
          correct: true
        - label: If B, then A
          feedback: That is the converse – it does not follow.
        - label: A and B
          feedback: The implication is also true when A is false.
    hints:
      - When is the implication true? When A is false – or B true.
    explanation: A → B is the same as ¬A ∨ B and as ¬B → ¬A, the **contrapositive**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Is (A → B) → C the same as A → (B → C)?
    params:
      options:
        - label: No – with A and C false, the first is false and the second true.
          correct: true
        - label: Yes, the brackets do not matter, as with addition.
          feedback: Implication is not associative. Try A = C = false.
        - label: Only when B is true.
          feedback: Even with B true they differ when A and C are false.
    hints:
      - Set A = false and C = false. What is A → B?
      - A → B is then true, so (A → B) → C is false. And A → (B → C)?
    explanation: A → (B → C) is equivalent to (A ∧ B) → C. The other is a different formula. With "if … then" you must always write the brackets.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why "if A, then B" is true when A is false.
    params:
      keywords:
        - - versprech
          - nur
          - behauptet
          - promise
          - only
          - claims
        - - falsch
          - nicht erfüllt
          - "false"
          - not met
        - - gebrochen
          - verletzt
          - widerlegt
          - broken
          - violated
          - refuted
      sample: The rule only promises something for the case that A holds. If A is false, nothing was promised, so the rule cannot be broken. That is why it counts as true.
    difficulty: 3

srs:
  cards_from: [kontra, schluesse]
