id: logic.propositional.implication
type: concept
title: If, then – and what does not follow
summary: The most common thinking error with "if".
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: karten
    widget: choice
    body: Rule – if the front shows a vowel, the back shows an even number.
    prompt: You see the cards A, K, 4 and 7. Which must you flip to check the rule?
    params:
      multiple: true
      layout: grid
      options:
        - { label: A, correct: true }
        - { label: K, feedback: "The rule says nothing about K. The back can show anything." }
        - { label: "4", feedback: "The rule does not forbid an even number behind a consonant." }
        - { label: "7", correct: true }
    hints:
      - Which card could break the rule?
      - A vowel with an odd number would be a violation.
    explanation: A could have an odd number on the back. The 7 could have a vowel on the front. The other two don't matter.

  - kind: explain
    body: |
      "If A, then B" is only **false** if A is true and B is not.
      So you must check A – and everything where B is missing.

  - kind: problem
    id: kontra
    widget: choice
    prompt: It holds that if it rains, the street is wet. What definitely follows?
    params:
      options:
        - { label: "If the street is dry, it is not raining.", correct: true }
        - { label: "If the street is wet, it is raining.", feedback: "The street can also be wet because someone is watering flowers." }
        - { label: "If it is not raining, the street is dry.", feedback: "The street can be wet even without rain." }
    hints:
      - Turn the rule around and negate both parts.
    explanation: This is the **contrapositive**. From "if A, then B" follows "if not B, then not A".

  - kind: problem
    id: schluesse
    widget: buckets
    body: Rule – if I am sick, I stay home.
    prompt: Valid conclusion or fallacy?
    params:
      buckets: [{ label: valid }, { label: fallacy }]
      items:
        - { label: "I am sick – so I am home.", bucket: valid }
        - { label: "I am not home – so I am healthy.", bucket: valid }
        - { label: "I am home – so I am sick.", bucket: fallacy }
        - { label: "I am healthy – so I am not home.", bucket: fallacy }
    hints:
      - You can also be home for other reasons.
    explanation: The rule itself and its contrapositive are valid. The converses are fallacies.

  - kind: explain
    body: Why do so many people fall for this fallacy?
    reveal:
      body: In everyday speech, we often mean "if and only if". In logic, "if" works in only one direction.

srs:
  cards_from: [kontra, schluesse]
