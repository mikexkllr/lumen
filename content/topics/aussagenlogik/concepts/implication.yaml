id: logic.propositional.implication
type: concept
title: Wenn, dann – und was nicht folgt
summary: Der häufigste Denkfehler mit »wenn«.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das tückische »wenn«
    body: »Wenn – dann« klingt harmlos. Doch genau hier passiert der häufigste **Denkfehler** der Logik. Deck die Karten auf und sieh, wo er dir im Alltag begegnet.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🃏
            front: Der Karten-Test
            back: Peter Wason erfand 1966 eine Aufgabe zu »wenn – dann«. Die meisten lösen sie falsch.
          - icon: 🍦
            front: Das Eis-Versprechen
            back: "»Wenn du aufisst, gibt es Eis.« Darf es auch Eis geben, wenn du nicht aufisst? Logisch: ja."
          - icon: ⚖️
            front: Vor Gericht
            back: »Wenn er der Täter ist, war er am Tatort.« Wer am Tatort war, ist deshalb noch kein Täter.
          - icon: 🧭
            front: Nur in eine Richtung
            back: Ein Wenn-dann-Satz ist eine Einbahnstraße. Rückwärts gelesen sagt er etwas ganz anderes.

  - kind: problem
    id: karten
    widget: choice
    body: Regel – wenn vorn ein Vokal steht, steht hinten eine gerade Zahl.
    prompt: Vor dir liegen die Karten A, K, 4 und 7. Welche musst du umdrehen, um die Regel zu prüfen?
    params:
      multiple: true
      layout: grid
      options:
        - { label: A, correct: true }
        - { label: K, feedback: "Für K sagt die Regel nichts. Hinten darf alles stehen." }
        - { label: "4", feedback: "Die Regel verbietet keine gerade Zahl hinter einem Konsonanten." }
        - { label: "7", correct: true }
    hints:
      - Welche Karte könnte die Regel verletzen?
      - Ein Vokal mit ungerader Zahl wäre ein Verstoß.
    explanation: A könnte hinten ungerade sein. Die 7 könnte vorn einen Vokal haben. Die anderen beiden sind egal.

  - kind: explain
    id: s2
    body: |
      »Wenn A, dann B« ist nur **falsch**, wenn A stimmt und B nicht.
      Prüfen muss man also A – und alles, wo B fehlt.

  - kind: problem
    id: kontra
    widget: choice
    prompt: Es gilt – wenn es regnet, ist die Straße nass. Was folgt daraus sicher?
    params:
      options:
        - { label: "Ist die Straße trocken, regnet es nicht.", correct: true }
        - { label: "Ist die Straße nass, regnet es.", feedback: "Die Straße kann auch nass sein, weil jemand Blumen gießt." }
        - { label: "Regnet es nicht, ist die Straße trocken.", feedback: "Auch ohne Regen kann die Straße nass sein." }
    hints:
      - Drehe die Regel um und verneine beide Teile.
    explanation: Das ist die **Kontraposition**. Aus »wenn A, dann B« folgt »wenn nicht B, dann nicht A«.

  - kind: problem
    id: schluesse
    widget: buckets
    body: Regel – wenn ich krank bin, bleibe ich zu Hause.
    prompt: Gültiger Schluss oder Fehlschluss?
    params:
      buckets: [{ label: gültig }, { label: Fehlschluss }]
      items:
        - { label: "Ich bin krank – also zu Hause.", bucket: gültig }
        - { label: "Ich bin nicht zu Hause – also gesund.", bucket: gültig }
        - { label: "Ich bin zu Hause – also krank.", bucket: Fehlschluss }
        - { label: "Ich bin gesund – also nicht zu Hause.", bucket: Fehlschluss }
    hints:
      - Man kann auch aus anderen Gründen zu Hause sein.
    explanation: Gültig sind die Regel selbst und ihre Kontraposition. Die Umkehrungen sind Fehlschlüsse.

  - kind: explain
    id: s5
    body: Warum fallen so viele auf diesen Fehlschluss herein?
    reveal:
      body: Im Alltag meinen wir oft »genau dann, wenn«. Logisch heißt »wenn« aber nur – eine Richtung ist sicher.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: »Wenn es regnet, ist die Straße nass.« Was folgt sicher?
    params:
      buckets:
        - id: b1
          label: Folgt sicher
        - id: b2
          label: Folgt nicht
      items:
        - label: Es regnet. Also Straße nass.
          bucket: b1
        - label: Straße trocken. Also kein Regen.
          bucket: b1
        - label: Straße nass. Also regnet es.
          bucket: b2
        - label: Kein Regen. Also Straße trocken.
          bucket: b2
    hints:
      - Kann die Straße auch ohne Regen nass sein?
    explanation: Sicher sind nur der Schluss nach vorn und der Umkehrschluss mit »nicht«.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: »Wenn A, dann B« ist nur dann falsch, wenn A [[wahr]] ist und B [[falsch]].
      distractors:
        - möglich

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: »Wenn der Mond aus Käse ist, dann ist 2 + 2 = 5.« Ist diese Aussage logisch wahr oder falsch?
    params:
      options:
        - label: Wahr – eine Implikation mit falscher Voraussetzung ist immer wahr
          correct: true
        - label: Falsch – beides ist Unsinn
          feedback: Falsch ist »wenn, dann« nur, wenn die Voraussetzung stimmt und die Folge nicht.
        - label: Weder noch
          feedback: In der Aussagenlogik hat jede Aussage einen Wahrheitswert.
    hints:
      - Wann genau ist »wenn A, dann B« falsch?
    explanation: Ein Versprechen »wenn es regnet, komme ich« ist nicht gebrochen, wenn es gar nicht regnet.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Aus »A → B« und »A« folgt [[B]]. Das ist der Modus ponens. Aus »A → B« und »¬B« folgt [[¬A]]. Das ist der Modus tollens.
      distractors:
        - A
        - ¬B
    hints:
      - "Vorwärts: Die Bedingung ist erfüllt. Rückwärts: Die Folge fehlt."
    explanation: Nur diese zwei Schlüsse sind gültig. Aus B folgt nichts über A, und aus ¬A nichts über B.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: »A ↔ B« heißt »A genau dann, wenn B«. In wie vielen der 4 Zeilen ist das wahr?
    params:
      options:
        - label: In 2 – wenn beide wahr oder beide falsch sind.
          correct: true
        - label: In 3 – wie bei »wenn – dann«.
          feedback: Bei ↔ ist auch der Fall »A falsch, B wahr« falsch.
        - label: In 1 – nur wenn beide wahr sind.
          feedback: Das wäre »und«. Sind beide falsch, stimmen sie auch überein.
    hints:
      - A ↔ B ist dasselbe wie (A → B) ∧ (B → A).
      - Wann haben A und B denselben Wahrheitswert?
    explanation: "Die **Äquivalenz** ist wahr, wenn A und B übereinstimmen: wahr-wahr und falsch-falsch. Sie ist genau das Gegenteil von XOR."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welche Aussage ist logisch **gleichwertig** zu »Wenn A, dann B«?
    params:
      options:
        - label: Nicht A oder B
          correct: true
        - label: Wenn B, dann A
          feedback: Das ist die Umkehrung – sie folgt nicht.
        - label: A und B
          feedback: Die Implikation ist auch wahr, wenn A falsch ist.
    hints:
      - Wann ist die Implikation wahr? Wenn A falsch ist – oder B wahr.
    explanation: A → B ist dasselbe wie ¬A ∨ B und wie ¬B → ¬A, die **Kontraposition**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ist (A → B) → C dasselbe wie A → (B → C)?
    params:
      options:
        - label: Nein – bei A und C falsch ist das erste falsch, das zweite wahr.
          correct: true
        - label: Ja, die Klammern sind wie beim Addieren egal.
          feedback: Die Implikation ist nicht assoziativ. Probier A = C = falsch.
        - label: Nur wenn B wahr ist.
          feedback: Auch bei B wahr unterscheiden sie sich, wenn A und C falsch sind.
    hints:
      - Setze A = falsch und C = falsch. Was ist A → B?
      - A → B ist dann wahr, also ist (A → B) → C falsch. Und A → (B → C)?
    explanation: A → (B → C) ist gleichwertig mit (A ∧ B) → C. Das andere ist eine andere Formel. Bei »wenn – dann« muss man Klammern also immer setzen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum »Wenn A, dann B« wahr ist, wenn A falsch ist.
    params:
      keywords:
        - - versprech
          - nur
          - behauptet
          - promise
          - only
          - claims
        - - falsch
          - nicht erfüllt
          - "false"
          - not met
        - - gebrochen
          - verletzt
          - widerlegt
          - broken
          - violated
          - refuted
      sample: Die Regel verspricht nur etwas für den Fall, dass A gilt. Ist A falsch, wurde nichts versprochen, also kann die Regel nicht gebrochen sein. Darum gilt sie als wahr.
    difficulty: 3

srs:
  cards_from: [kontra, schluesse]
