id: logic.propositional.connectives
type: concept
title: And, or, not
summary: Logical "or" includes "both".
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The light on the stairs
    body: "On a staircase, two switches control the same lamp – one downstairs, one upstairs. Try both: when is the light on? Behind it is a **connective**: two statements combine into a new one."
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: A
            label: downstairs
          - id: B
            label: upstairs
        gates:
          - id: g
            type: XOR
            in:
              - A
              - B
        outputs:
          - id: Q
            from: g
            label: Light

  - kind: problem
    id: und
    widget: choice
    prompt: '"It is raining and it is cold." When is this statement true?'
    params:
      options:
        - { label: Only if both are true., correct: true }
        - { label: As soon as one of the two is true., feedback: "That would be \"or\". With \"and\", both must be true." }
        - { label: If neither is true., feedback: "Then it is definitely false." }
    hints:
      - Imagine it is raining, but it is warm.
    explanation: An "and" statement needs both parts.

  - kind: explain
    id: s2
    body: |
      Statements are **true** or **false**. With *and* (∧), *or* (∨) and *not* (¬), you build new ones.
      In logic, *or* **includes both**.

  - kind: problem
    id: oder
    widget: choice
    prompt: '"I''ll have cake or ice cream." You take both. Was the statement logically true?'
    params:
      options:
        - { label: "Yes – logical \"or\" allows both.", correct: true }
        - { label: "No – \"or\" means only one.", feedback: "In everyday speech we often mean \"either or\". Logical \"or\" is more generous." }
    hints:
      - Think of the OR gate. What does it output for 1 and 1?
    explanation: Logical "or" is false only if neither is true.

  - kind: problem
    id: schaltung
    widget: gates
    prompt: The lamp should light up for "A and not B". Choose the right gate.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NOT, in: [B] }
        - { id: g, type: "?", in: [A, n], options: [OR, AND] }
      outputs: [{ id: Q, from: g, label: Lamp }]
    check: { predicate: "table('Q') == [0, 0, 1, 0]" }
    hints:
      - Try both gates and flip through all four switch settings.
    explanation: AND, with A and the negated B. The lamp lights only for A = 1 and B = 0.

  - kind: problem
    id: symbole
    widget: match
    prompt: Match each symbol with its meaning.
    params:
      pairs:
        - { left: "A ∧ B", right: A and B }
        - { left: "A ∨ B", right: A or B or both }
        - { left: "¬A", right: not A }
        - { left: "A → B", right: "if A, then B" }
    hints:
      - The ∧ looks like an A without the crossbar – A for "and".
    explanation: ∧ is and, ∨ is or, ¬ is not, → is if–then.

  - kind: explain
    id: s6
    body: Is the sentence "This sentence is false" true or false?
    reveal:
      body: Neither. If it were true, it would be false – and the other way around. Paradoxes like this show the limits of simple logic.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 2 + 2 = 4 **or** 2 + 2 = 5
          right: true
        - text: 2 + 2 = 4 **and** 2 + 2 = 5
          right: false
        - text: "**Not** (2 + 2 = 5)"
          right: true
        - text: 2 + 2 = 4 **or** 3 + 3 = 6
          right: true
          why: The logical or is also true when both hold.
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The menu says “soup or salad”. Which “or” is meant?
    params:
      options:
        - label: The exclusive one – one of the two, not both (XOR)
          correct: true
        - label: The logical one – both are allowed too
          feedback: In a restaurant you do not get both.
        - label: None at all
          feedback: It is an or – just the exclusive one.
    hints:
      - Do you get both if you order both?
    explanation: "Everyday language is ambiguous. Logic separates cleanly: ∨ inclusive, XOR exclusive."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: gates
    prompt: The lamp should light up when **at least two** of the three switches are on. Choose the gates.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
      gates:
        - id: ab
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
        - id: ac
          type: "?"
          in:
            - A
            - C
          options:
            - AND
            - OR
        - id: bc
          type: "?"
          in:
            - B
            - C
          options:
            - AND
            - OR
        - id: g
          type: "?"
          in:
            - ab
            - ac
            - bc
          options:
            - AND
            - OR
      outputs:
        - id: Q
          from: g
          label: majority
    check:
      predicate: table('Q') == [0, 0, 0, 1, 0, 1, 1, 1]
    hints:
      - '"At least two on" means: A and B, or A and C, or B and C.'
      - Three AND gates inside, one OR outside.
    explanation: (A ∧ B) ∨ (A ∧ C) ∨ (B ∧ C) is the majority function. (A ∨ B) ∧ (A ∨ C) ∧ (B ∨ C) works too – the same function in another form.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: For how many of the 8 assignments of A, B, C is (A ∨ B) ∧ ¬C true?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: forgot-not-c
        text: That holds for A ∨ B alone. ¬C halves it once more.
    hints:
      - A ∨ B is false only when A and B are both false.
      - Of the 4 cases for A, B, 3 are true. On top of that C must be false.
    explanation: "3 of 4 cases for A ∨ B, each only with C false: 3 rows. You can often count truth tables instead of writing them out."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: With which **single** connective can “and”, “or” and “not” all be expressed?
    params:
      options:
        - label: With NAND – “not both”
          correct: true
        - label: With “and”
          feedback: Without negation “not” cannot be built.
        - label: With “or”
          feedback: Negation is missing here too.
    hints:
      - What does “A NAND A” give?
    explanation: A NAND A is ¬A. Everything else is built from that – which is why a single gate type suffices for chips.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: How do you build "not A" from NAND gates only?
    params:
      options:
        - label: A NAND A
          correct: true
        - label: A NAND 0
          feedback: NAND with 0 is always 1, whatever A is.
        - label: It cannot be done.
          feedback: NAND can do everything – including "not".
    hints:
      - NAND means "not both". What is "not (A and A)"?
      - A and A is just A.
    explanation: A NAND A = ¬(A ∧ A) = ¬A. From "not" and "not both" you then build AND and OR. That is why a processor is at heart made of many identical gates. NOR works just as well.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between the logical or and "either … or".
    params:
      keywords:
        - - beide
          - beides
          - both
        - - eins
          - einer
          - nur eins
          - one
          - only one
        - - wahr
          - "true"
          - gilt
          - holds
      sample: The logical or is true when both hold, too. "Either … or" is true only when exactly one holds, not both.
    difficulty: 3

srs:
  cards_from: [oder, symbole]
