id: logic.propositional.arguments
type: concept
title: Argumente prüfen
summary: Gültig heißt nicht wahr.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Folgt das wirklich?
    body: "Ob vor Gericht, im Streit oder in der Mathematik: Überall geht es darum, ob ein Schluss **gültig** ist. Deck die Karten auf und sieh, wo sauberes Folgern zählt."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ⚖️
            front: Vor Gericht
            back: Ein Urteil muss aus den Beweisen folgen. Klingt es nur plausibel, reicht das nicht.
          - icon: 🧮
            front: In der Mathematik
            back: Ein Beweis ist eine Kette sicherer Schlüsse. Ein einziger falscher Schritt, und alles fällt.
          - icon: 📣
            front: Im Streit
            back: Wer lauter ist, hat nicht recht. Es zählt, ob der Schluss aus den Gründen folgt.
          - icon: 🤖
            front: Im Computer
            back: Programme prüfen Schlüsse nach festen Regeln – in Sekunden und ohne Bauchgefühl.

  - kind: problem
    id: gueltig
    widget: choice
    body: Alle Vögel können fliegen. Pinguine sind Vögel. Also können Pinguine fliegen.
    prompt: Ist dieser Schluss logisch gültig?
    params:
      options:
        - { label: "Ja – aber eine Voraussetzung ist falsch", correct: true }
        - { label: Nein, feedback: "Die Form stimmt. Das Problem ist die erste Aussage." }
    hints:
      - Folgt der Schluss aus den Voraussetzungen – egal ob sie stimmen?
    explanation: Gültig heißt – wenn die Voraussetzungen stimmen, stimmt auch der Schluss. Hier ist »alle Vögel fliegen« falsch.

  - kind: explain
    id: s2
    body: |
      Ein Argument ist **gültig**, wenn der Schluss aus den Voraussetzungen folgt. **Schlüssig** ist es erst, wenn die Voraussetzungen auch wahr sind.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Gültige Form oder Fehlschluss?
    params:
      buckets: [{ label: gültig }, { label: Fehlschluss }]
      items:
        - { label: "Alle A sind B. X ist A. Also ist X B.", bucket: gültig }
        - { label: "Wenn A, dann B. Nicht B. Also nicht A.", bucket: gültig }
        - { label: "Alle A sind B. X ist B. Also ist X A.", bucket: Fehlschluss }
        - { label: "Wenn A, dann B. Nicht A. Also nicht B.", bucket: Fehlschluss }
    hints:
      - Probiere ein Beispiel – Hunde sind Tiere, Katzen sind Tiere …
    explanation: Aus »X ist ein Tier« folgt nicht »X ist ein Hund«.

  - kind: problem
    id: strohmann
    widget: choice
    body: A sagt – wir sollten weniger Fleisch essen. B antwortet – du willst also allen das Essen verbieten?
    prompt: Was macht B?
    params:
      options:
        - { label: B verdreht die Aussage – ein Strohmann., correct: true }
        - { label: B argumentiert sauber., feedback: "A hat kein Verbot gefordert." }
    hints:
      - Hat A ein Verbot gefordert?
    explanation: Ein **Strohmann** greift eine übertriebene Version des Arguments an statt das echte.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Ist die Schlussform gültig?
    params:
      buckets:
        - id: b1
          label: Gültig
        - id: b2
          label: Ungültig
      items:
        - label: Alle A sind B. x ist A. Also ist x B.
          bucket: b1
        - label: Wenn A, dann B. B. Also A.
          bucket: b2
        - label: Wenn A, dann B. Nicht B. Also nicht A.
          bucket: b1
        - label: Einige A sind B. x ist A. Also ist x B.
          bucket: b2
    hints:
      - Such ein Gegenbeispiel. Findest du eines, ist die Form ungültig.
    explanation: "Gültig heißt: Sind die Voraussetzungen wahr, muss der Schluss wahr sein."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: »Alle Vögel können fliegen. Pinguine sind Vögel. Also können Pinguine fliegen.« Was stimmt?
    params:
      options:
        - label: Der Schluss ist gültig, aber nicht schlüssig – die erste Voraussetzung ist falsch
          correct: true
        - label: Der Schluss ist ungültig
          feedback: Die Form ist einwandfrei.
        - label: Der Schluss ist schlüssig
          feedback: Dafür müssten alle Voraussetzungen wahr sein.
    hints:
      - Prüfe erst die Form, dann die Voraussetzungen.
    explanation: "Logik garantiert nur: **Wenn** die Voraussetzungen stimmen, stimmt der Schluss."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Es gilt »A oder B« und »nicht A oder C«. Was folgt sicher?
    params:
      options:
        - label: B oder C
          correct: true
        - label: B und C
          feedback: Ist A wahr, folgt nur C. Ist A falsch, folgt nur B. Beides zugleich ist nicht sicher.
        - label: A
          feedback: Über A wissen wir gar nichts – es kann wahr oder falsch sein.
    hints:
      - "Fall 1: A ist wahr. Was verlangt dann die zweite Aussage?"
      - "Fall 2: A ist falsch. Was verlangt die erste?"
    explanation: "Das ist die **Resolution**: A und ¬A heben sich auf, übrig bleibt B ∨ C. Mit dieser einen Regel beweisen Computer logische Folgerungen."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: order
    prompt: "Zeige per Resolution, dass C folgt aus: ¬A ∨ B, ¬B ∨ C und A. Ordne die Schritte."
    params:
      items:
        - label: "Nimm das Gegenteil des Ziels dazu: ¬C"
        - label: A und ¬A ∨ B ergeben B
        - label: B und ¬B ∨ C ergeben C
        - label: C und ¬C ergeben einen Widerspruch
        - label: Also folgt C aus den Voraussetzungen
    hints:
      - "Resolution beweist durch Widerspruch: Man nimmt das Gegenteil an."
      - Dann löst man Schritt für Schritt Paare wie A und ¬A auf.
    explanation: Wer aus den Voraussetzungen plus ¬C einen Widerspruch ableitet, hat C bewiesen. Genau so arbeiten viele automatische Beweiser.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen einem gültigen und einem wahren Argument.
    params:
      keywords:
        - - form
          - struktur
          - folgt
          - form
          - structure
          - follows
        - - voraussetzung
          - prämisse
          - annahme
          - premise
          - assumption
        - - wahr
          - stimmt
          - "true"
          - correct
          - falsch
          - "false"
      sample: Gültig heißt nur, dass der Schluss aus den Voraussetzungen folgt – das ist eine Frage der Form. Ob das Argument auch etwas Wahres zeigt, hängt davon ab, ob die Voraussetzungen stimmen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Prüfe den Schluss »A → B, B, also A« mit einer Wahrheitstafel. In wie vielen Zeilen sind beide Voraussetzungen wahr, der Schluss aber falsch?
    answer:
      value: 1
    hints:
      - Der Schluss A ist falsch – also A falsch. Wann sind dann A → B und B wahr?
      - "A falsch, B wahr: Beide Voraussetzungen stimmen."
    explanation: Eine einzige Gegenbeispiel-Zeile (A falsch, B wahr) macht den Schluss **ungültig**. Gültig ist ein Schluss genau dann, wenn es keine solche Zeile gibt.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Wann ist ein Schluss von den Voraussetzungen P auf das Ergebnis S gültig?
    params:
      options:
        - label: Wenn »P und nicht S« in keiner Zeile wahr sein kann.
          correct: true
        - label: Wenn S wahr ist.
          feedback: Ein wahres Ergebnis kann auch zufällig stimmen – die Form zählt.
        - label: Wenn P wahr ist.
          feedback: Gültigkeit fragt nicht, ob P stimmt, sondern ob S aus P folgt.
    hints:
      - Wie sähe ein Gegenbeispiel zum Schluss aus?
      - Voraussetzungen wahr, Ergebnis falsch – gibt es so eine Zeile?
    explanation: "Gültig heißt: »P → S« ist eine Tautologie – gleichwertig: »P ∧ ¬S« ist **unerfüllbar**. Genau das zeigt Resolution, wenn sie einen Widerspruch findet."
    difficulty: 3

srs:
  cards_from: [sortieren, gueltig]
