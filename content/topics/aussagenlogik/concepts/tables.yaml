id: logic.propositional.tables
type: concept
title: Wahrheitstafeln
summary: Alle Fälle auf einen Blick.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alle Fälle im Griff
    body: Eine Alarmanlage folgt einer strengen Regel. Schalte Tür, Fenster und Anlage an und aus. Wann heult der Alarm? Wer wirklich jeden Fall prüft, legt eine **Wahrheitstafel** an.
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: T
            label: Tür offen
          - id: F
            label: Fenster offen
          - id: S
            label: Anlage scharf
        gates:
          - id: o
            type: OR
            in:
              - T
              - F
          - id: g
            type: AND
            in:
              - o
              - S
        outputs:
          - id: Q
            from: g
            label: Alarm

  - kind: problem
    id: hook
    widget: numeric
    prompt: Zwei Lampen können jede an oder aus sein. Wie viele Kombinationen gibt es?
    answer:
      value: 4
    hints:
      - "Zähl: aus-aus, aus-an …"
    explanation: Vier Fälle. Genau so viele Zeilen hat eine Wahrheitstafel für zwei Aussagen.

  - kind: explain
    id: s1
    body: |
      Eine **Wahrheitstafel** listet alle Fälle auf. Bei zwei Aussagen A und B sind es vier: falsch-falsch, falsch-wahr, wahr-falsch, wahr-wahr.

  - kind: problem
    id: zeilen
    widget: numeric
    prompt: Wie viele Zeilen hat eine Wahrheitstafel mit {{n}} Aussagen?
    params: { unit: Zeilen }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear
        text: Jede neue Aussage verdoppelt die Fälle.
    hints:
      - Jede Aussage ist wahr oder falsch.
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ Zeilen."
    variants:
      params: { n: "int[3,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: wenn-dann
    widget: gates
    prompt: Baue »wenn A, dann B« nach. Sie ist nur falsch, wenn A wahr und B falsch ist. Wähle das Gatter.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NOT, in: [A] }
        - { id: g, type: "?", in: [n, B], options: [AND, OR] }
      outputs: [{ id: Q, from: g, label: wahr }]
    check: { predicate: "table('Q') == [1, 1, 0, 1]" }
    hints:
      - »Wenn A, dann B« ist dasselbe wie »nicht A oder B«.
    explanation: Nicht A ODER B – das ist die Implikation.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Welche Aussage hat dieselbe Wahrheitstafel wie »nicht (A und B)«?
    params:
      options:
        - { label: nicht A oder nicht B, correct: true }
        - { label: nicht A und nicht B, feedback: "Das ist »weder A noch B« – zu streng." }
        - { label: A oder B, feedback: "Das ist fast das Gegenteil." }
    hints:
      - De Morgan.
    explanation: Nach De Morgan wird aus »und« ein »oder«.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele verschiedene Wahrheitstafeln gibt es für eine Verknüpfung von **zwei** Aussagen?
    answer:
      value: 16
    hints:
      - Vier Zeilen, in jeder steht wahr oder falsch.
    explanation: 2⁴ = 16. »Und«, »oder«, »wenn–dann« sind nur drei davon.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: In wie vielen der 8 Zeilen ist (A → B) ∧ (B → C) wahr?
    answer:
      value: 4
    hints:
      - Falsch wird es, wenn A wahr und B falsch ist – oder B wahr und C falsch.
      - "Die wahren Zeilen sind »Treppen«: ist einer wahr, sind auch alle späteren wahr."
    explanation: "Wahr sind FFF, FFW, FWW und WWW: 4 Zeilen. Eine Kette von Implikationen erlaubt nur solche Treppen."
    difficulty: 2

  - kind: explain
    id: la-d2
    depth: 2
    body: Aus jeder Wahrheitstafel kann man eine Formel ablesen. Jede wahre Zeile wird ein Und-Block, etwa A ∧ ¬B. Alle Blöcke verbindet man mit Oder. Das ist die **disjunktive Normalform**.

  - kind: problem
    id: la-d3
    depth: 2
    widget: choice
    prompt: XOR ist nur in den Zeilen »A wahr, B falsch« und »A falsch, B wahr« wahr. Wie lautet seine disjunktive Normalform?
    params:
      options:
        - label: (A ∧ ¬B) ∨ (¬A ∧ B)
          correct: true
        - label: (A ∨ B) ∧ (¬A ∨ ¬B)
          feedback: "Das stimmt zwar auch – ist aber die konjunktive Form: Oder-Blöcke mit Und verbunden."
        - label: (A ∧ B) ∨ (¬A ∧ ¬B)
          feedback: Das sind genau die anderen beiden Zeilen – also »genau dann, wenn«.
    hints:
      - Schreibe für jede wahre Zeile einen Und-Block.
      - "Zeile 1: A ∧ ¬B. Zeile 2: ¬A ∧ B. Dann mit Oder verbinden."
    explanation: Jede wahre Zeile liefert einen Block, das Oder sammelt sie. Darum lässt sich **jede** Wahrheitstafel als Formel aus ∧, ∨ und ¬ schreiben.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Aussage, die in **jeder** Zeile ihrer Wahrheitstafel wahr ist, heißt Tautologie. Welche ist eine?
    params:
      options:
        - label: A oder nicht A
          correct: true
        - label: A und nicht A
          feedback: Das ist immer falsch – ein Widerspruch.
        - label: A oder B
          feedback: Sind beide falsch, ist es falsch.
    hints:
      - Es regnet – oder es regnet nicht.
    explanation: "Der »Satz vom ausgeschlossenen Dritten«. Logische Gesetze sind Tautologien: wahr allein durch ihre Form."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Welche Belegung erfüllt (A ∨ B) ∧ (¬A ∨ B) ∧ (¬B ∨ C)?
    params:
      options:
        - label: B und C wahr – A egal.
          correct: true
        - label: A wahr, B falsch, C wahr
          feedback: Dann ist ¬A ∨ B falsch.
        - label: Keine – die Formel ist unerfüllbar.
          feedback: "Probier B = wahr: Die ersten zwei Klauseln sind dann erfüllt."
    hints:
      - Die ersten beiden Klauseln zusammen erzwingen etwas über B.
      - B muss wahr sein. Was verlangt dann die dritte Klausel?
    explanation: Aus (A ∨ B) und (¬A ∨ B) folgt B. Dann verlangt (¬B ∨ C), dass C wahr ist. Formeln in dieser **konjunktiven Normalform** prüfen SAT-Löser – Programme, die Chips und Pläne testen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Eine Formel hat 60 Variablen. Warum prüft man sie nicht einfach mit einer Wahrheitstafel?
    params:
      options:
        - label: Sie hätte 2⁶⁰ – über eine Trillion – Zeilen.
          correct: true
        - label: Wahrheitstafeln gehen nur bis drei Variablen.
          feedback: Sie gehen immer – sie werden nur schnell riesig.
        - label: Weil man dann nicht weiß, welche Zeile wahr ist.
          feedback: Jede Zeile lässt sich leicht ausrechnen. Das Problem ist ihre Anzahl.
    hints:
      - Jede neue Variable verdoppelt die Zeilen.
      - 2¹⁰ ≈ 1000. Was ist dann 2⁶⁰?
    explanation: 2⁶⁰ ≈ 10¹⁸. Ob es für Erfüllbarkeit (SAT) grundsätzlich schnelle Verfahren gibt, ist die offene Frage **P gegen NP**. Gute Löser schaffen trotzdem oft Millionen Variablen.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man mit einer Wahrheitstafel prüft, ob zwei Formeln gleichwertig sind.
    params:
      keywords:
        - - zeile
          - fall
          - fälle
          - row
          - case
        - - jede
          - alle
          - every
          - all
        - - gleich
          - dasselbe
          - überein
          - same
          - agree
          - equal
      sample: Ich schreibe alle Zeilen auf, also jede Belegung der Variablen. Für jede Zeile rechne ich beide Formeln aus. Sind sie in jeder Zeile gleich, sind die Formeln gleichwertig.
    difficulty: 3

srs:
  cards_from: [zeilen, gleich]
