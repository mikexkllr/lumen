id: logic.propositional.negation
type: concept
title: Negating correctly
summary: '"All" becomes "at least one is not".'
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: schwaene
    widget: choice
    prompt: What is the logical opposite of "All swans are white"?
    params:
      options:
        - { label: At least one swan is not white., correct: true }
        - { label: All swans are black., feedback: "That is an extreme, not the opposite. A single dark swan is enough." }
        - { label: No swan is white., feedback: "Too strong. It is enough if one is not white." }
    hints:
      - What would you need to find to refute the statement?
    explanation: A single non-white swan refutes "all".

  - kind: explain
    id: s2
    body: |
      You negate **all** with **at least one not**.
      You negate **there is** with **none**.

  - kind: problem
    id: kuchen
    widget: choice
    prompt: What is the opposite of "Someone ate the cake"?
    params:
      options:
        - { label: Nobody ate the cake., correct: true }
        - { label: Someone did not eat the cake., feedback: "That can be true at the same time as the statement." }
        - { label: Everyone ate the cake., feedback: "That even fits the statement." }
    hints:
      - When would "someone ate …" be false?
    explanation: '"There is someone" is false only if there is no one.'

  - kind: explain
    id: s4
    body: |
      **De Morgan:** ¬(A ∧ B) is ¬A ∨ ¬B. And ¬(A ∨ B) is ¬A ∧ ¬B.
      When you negate, *and* and *or* swap places.

  - kind: problem
    id: und-verneinen
    widget: choice
    prompt: What is the opposite of "It is raining and it is cold"?
    params:
      options:
        - { label: It is not raining or it is not cold., correct: true }
        - { label: It is not raining and it is not cold., feedback: "Too strict. Even warm rain makes the statement false." }
        - { label: It is raining or it is cold., feedback: "The negation is missing here." }
    hints:
      - The statement is false as soon as one part is not true.
    explanation: By De Morgan, "and" becomes "or", and both parts are negated.

  - kind: problem
    id: weder-noch
    widget: gates
    prompt: The lamp should light only if both switches are off. Choose the first gate.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: g, type: "?", in: [A, B], options: [AND, OR] }
        - { id: n, type: NOT, in: [g] }
      outputs: [{ id: Q, from: n, label: Lamp }]
    check: { predicate: "table('Q') == [1, 0, 0, 0]" }
    hints:
      - Neither A nor B means not (A or B).
    explanation: Not (A or B) is the same as "not A and not B".

  - kind: problem
    id: mix-c1
    widget: match
    prompt: Match each statement with its negation.
    params:
      pairs:
        - left: Everyone is here
          right: At least one is missing
        - left: There is an error
          right: There is no error
        - left: A and B
          right: not A or not B
        - left: A or B
          right: not A and not B
    hints:
      - “All” becomes “at least one not”. And and or swap.
    explanation: Negating flips the statement exactly – no more and no less.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: When negating, “and” and “[[or]]” swap places. “All” becomes “at least [[one]] not”.
      distractors:
        - but
        - none

  - kind: problem
    id: mix-c3
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: “All swans are white.” – “At least one swan is not white.”
          right: true
        - text: “All swans are white.” – “No swan is white.”
          right: false
          why: "Too strong: a single one suffices."
        - text: “There is a unicorn.” – “There is no unicorn.”
          right: true
        - text: “It rains and storms.” – “It does not rain and does not storm.”
          right: false
          why: It is enough if one of the two is not true.
      left: Wrongly negated
      right: Rightly negated

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What is the opposite of “Every pupil has read at least one book”?
    params:
      options:
        - label: At least one pupil has read not a single book
          correct: true
        - label: No pupil has read a book
          feedback: That is far too strong – one counterexample suffices.
        - label: Every pupil has read no book
          feedback: That is not the logical opposite either.
    hints:
      - “Every” becomes “at least one not” – and “at least one” becomes “none”.
    explanation: When negating, every “all” flips to “there exists” and vice versa.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What is the opposite of “If it rains, I stay at home”?
    params:
      options:
        - label: It rains, and I do not stay at home
          correct: true
        - label: If it rains, I do not stay at home
          feedback: That is another rule, not the negation.
        - label: If it does not rain, I stay at home
          feedback: That does not contradict the first statement either.
    hints:
      - When is the promise broken?
    explanation: "The negation of an implication is an **and**: A holds but B does not."
    difficulty: 3

srs:
  cards_from: [schwaene, und-verneinen]
