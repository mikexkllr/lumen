id: logic.propositional.negation
type: concept
title: Negating correctly
summary: '"All" becomes "at least one is not".'
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The opposite of "and"
    body: Negating sounds easy – until "and" comes in. Take the sentence "I am tired and hungry". Shade all the regions that fit its **opposite**. Are there more than you thought?
    visual:
      widget: venn
      interactive: true
      params:
        sets:
          - tired
          - hungry
        outside: true

  - kind: problem
    id: schwaene
    widget: choice
    prompt: What is the logical opposite of "All swans are white"?
    params:
      options:
        - { label: At least one swan is not white., correct: true }
        - { label: All swans are black., feedback: "That is an extreme, not the opposite. A single dark swan is enough." }
        - { label: No swan is white., feedback: "Too strong. It is enough if one is not white." }
    hints:
      - What would you need to find to refute the statement?
    explanation: A single non-white swan refutes "all".

  - kind: explain
    id: s2
    body: |
      You negate **all** with **at least one not**.
      You negate **there is** with **none**.

  - kind: problem
    id: kuchen
    widget: choice
    prompt: What is the opposite of "Someone ate the cake"?
    params:
      options:
        - { label: Nobody ate the cake., correct: true }
        - { label: Someone did not eat the cake., feedback: "That can be true at the same time as the statement." }
        - { label: Everyone ate the cake., feedback: "That even fits the statement." }
    hints:
      - When would "someone ate …" be false?
    explanation: '"There is someone" is false only if there is no one.'

  - kind: explain
    id: s4
    body: |
      **De Morgan:** ¬(A ∧ B) is ¬A ∨ ¬B. And ¬(A ∨ B) is ¬A ∧ ¬B.
      When you negate, *and* and *or* swap places.

  - kind: problem
    id: und-verneinen
    widget: choice
    prompt: What is the opposite of "It is raining and it is cold"?
    params:
      options:
        - { label: It is not raining or it is not cold., correct: true }
        - { label: It is not raining and it is not cold., feedback: "Too strict. Even warm rain makes the statement false." }
        - { label: It is raining or it is cold., feedback: "The negation is missing here." }
    hints:
      - The statement is false as soon as one part is not true.
    explanation: By De Morgan, "and" becomes "or", and both parts are negated.

  - kind: problem
    id: weder-noch
    widget: gates
    prompt: The lamp should light only if both switches are off. Choose the first gate.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: g, type: "?", in: [A, B], options: [AND, OR] }
        - { id: n, type: NOT, in: [g] }
      outputs: [{ id: Q, from: n, label: Lamp }]
    check: { predicate: "table('Q') == [1, 0, 0, 0]" }
    hints:
      - Neither A nor B means not (A or B).
    explanation: Not (A or B) is the same as "not A and not B".

  - kind: problem
    id: mix-c1
    widget: match
    prompt: Match each statement with its negation.
    params:
      pairs:
        - left: Everyone is here
          right: At least one is missing
        - left: There is an error
          right: There is no error
        - left: A and B
          right: not A or not B
        - left: A or B
          right: not A and not B
    hints:
      - “All” becomes “at least one not”. And and or swap.
    explanation: Negating flips the statement exactly – no more and no less.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: When negating, “and” and “[[or]]” swap places. “All” becomes “at least [[one]] not”.
      distractors:
        - but
        - none

  - kind: problem
    id: mix-c3
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: “All swans are white.” – “At least one swan is not white.”
          right: true
        - text: “All swans are white.” – “No swan is white.”
          right: false
          why: "Too strong: a single one suffices."
        - text: “There is a unicorn.” – “There is no unicorn.”
          right: true
        - text: “It rains and storms.” – “It does not rain and does not storm.”
          right: false
          why: It is enough if one of the two is not true.
      left: Wrongly negated
      right: Rightly negated

  - kind: problem
    id: intro-c1
    widget: venn
    prompt: Shade all the regions where "It is loud or bright" does **not** hold.
    params:
      sets:
        - loud
        - bright
      outside: true
    answer:
      regions:
        - O
    hints:
      - '"Loud or bright" holds in all three regions inside the circles.'
      - Only the region outside both circles is left for the opposite.
    explanation: "¬(A ∨ B) is ¬A ∧ ¬B: neither loud nor bright. That is only the region outside."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What is the opposite of “Every pupil has read at least one book”?
    params:
      options:
        - label: At least one pupil has read not a single book
          correct: true
        - label: No pupil has read a book
          feedback: That is far too strong – one counterexample suffices.
        - label: Every pupil has read no book
          feedback: That is not the logical opposite either.
    hints:
      - “Every” becomes “at least one not” – and “at least one” becomes “none”.
    explanation: When negating, every “all” flips to “there exists” and vice versa.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: gates
    prompt: Build "not (A and B)" from two NOT gates and one gate of your choice.
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: na
          type: NOT
          in:
            - A
        - id: nb
          type: NOT
          in:
            - B
        - id: g
          type: "?"
          in:
            - na
            - nb
          options:
            - AND
            - OR
      outputs:
        - id: Q
          from: g
          label: not (A and B)
    check:
      predicate: table('Q') == [1, 1, 1, 0]
    feedback:
      - when: table('Q') == [1, 0, 0, 0]
        misconception: demorgan-keep-and
        text: That is "neither A nor B". Negating turns AND into OR.
    hints:
      - '"Not both" is already true when one is missing.'
      - Not A OR not B.
    explanation: ¬(A ∧ B) = ¬A ∨ ¬B – De Morgan as a circuit.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: What is the opposite of "All doors are shut and the light is off"?
    params:
      options:
        - label: At least one door is open or the light is on.
          correct: true
        - label: All doors are open and the light is on.
          feedback: That is far too strong. One open door is already enough.
        - label: At least one door is open and the light is on.
          feedback: The AND must become OR when negated.
    hints:
      - 'Two rules at once: "all" becomes "at least one not", "and" becomes "or".'
      - Negate both parts and swap the connective.
    explanation: ¬(∀ shut ∧ off) = (∃ open) ∨ on. Quantifiers and connectives are both flipped when negating.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What is the opposite of “If it rains, I stay at home”?
    params:
      options:
        - label: It rains, and I do not stay at home
          correct: true
        - label: If it rains, I do not stay at home
          feedback: That is another rule, not the negation.
        - label: If it does not rain, I stay at home
          feedback: That does not contradict the first statement either.
    hints:
      - When is the promise broken?
    explanation: "The negation of an implication is an **and**: A holds but B does not."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: For whole numbers x from 0 to 10, consider "x > 3 and x < 7". For how many of these numbers does its **negation** hold?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 3
        misconception: not-negated
        text: "Those are the numbers for which the statement itself holds: 4, 5, 6."
    hints:
      - "Negation: x ≤ 3 **or** x ≥ 7."
      - Count 0 to 3 and 7 to 10.
    explanation: "The statement holds for 4, 5, 6 – 3 of the 11 numbers. The negation holds for the other 8. Negating always means: exactly the rest."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain De Morgan's laws to Lux with an everyday example.
    params:
      keywords:
        - - und
          - and
        - - oder
          - or
        - - nicht
          - not
        - - tausch
          - wird zu
          - umgedreht
          - swap
          - becomes
          - flip
      sample: "Not (rain and cold) means: not rain or not cold. When negating, and becomes or, and or becomes and. You negate each part and swap the connective."
    difficulty: 3

srs:
  cards_from: [schwaene, und-verneinen]
