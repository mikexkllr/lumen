id: logic.propositional.connectives
type: concept
title: Und, oder, nicht
summary: Das logische Oder schließt »beides« ein.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Licht im Treppenhaus
    body: "Im Treppenhaus schalten zwei Schalter dieselbe Lampe – unten und oben. Probier beide aus: Wann brennt das Licht? Dahinter steckt eine **Verknüpfung**: Aus zwei Aussagen wird eine neue."
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: A
            label: unten
          - id: B
            label: oben
        gates:
          - id: g
            type: XOR
            in:
              - A
              - B
        outputs:
          - id: Q
            from: g
            label: Licht

  - kind: problem
    id: und
    widget: choice
    prompt: »Es regnet und es ist kalt.« Wann ist diese Aussage wahr?
    params:
      options:
        - { label: Nur wenn beides stimmt., correct: true }
        - { label: Sobald eins von beiden stimmt., feedback: "Das wäre »oder«. Bei »und« muss beides stimmen." }
        - { label: Wenn keins von beiden stimmt., feedback: "Dann ist sie sicher falsch." }
    hints:
      - Stell dir vor, es regnet, aber es ist warm.
    explanation: Eine Und-Aussage braucht beide Teile.

  - kind: explain
    id: s2
    body: |
      Aussagen sind **wahr** oder **falsch**. Mit *und* (∧), *oder* (∨) und *nicht* (¬) baut man neue.
      In der Logik schließt *oder* **beides** mit ein.

  - kind: problem
    id: oder
    widget: choice
    prompt: »Ich nehme Kuchen oder Eis.« Du nimmst beides. War die Aussage logisch wahr?
    params:
      options:
        - { label: "Ja – das logische Oder erlaubt beides.", correct: true }
        - { label: "Nein – oder heißt nur eins.", feedback: "Im Alltag meinen wir oft »entweder oder«. Das logische Oder ist großzügiger." }
    hints:
      - Denk an das ODER-Gatter. Was gibt es bei 1 und 1?
    explanation: Das logische Oder ist nur falsch, wenn keins von beiden stimmt.

  - kind: problem
    id: schaltung
    widget: gates
    prompt: Die Lampe soll für »A und nicht B« leuchten. Wähle das passende Gatter.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NOT, in: [B] }
        - { id: g, type: "?", in: [A, n], options: [OR, AND] }
      outputs: [{ id: Q, from: g, label: Lampe }]
    check: { predicate: "table('Q') == [0, 0, 1, 0]" }
    hints:
      - Probiere beide Gatter und schalte alle vier Stellungen durch.
    explanation: UND mit A und dem verneinten B. Die Lampe leuchtet nur bei A = 1 und B = 0.

  - kind: problem
    id: symbole
    widget: match
    prompt: Verbinde Zeichen und Bedeutung.
    params:
      pairs:
        - { left: "A ∧ B", right: A und B }
        - { left: "A ∨ B", right: A oder B oder beides }
        - { left: "¬A", right: nicht A }
        - { left: "A → B", right: "wenn A, dann B" }
    hints:
      - Das ∧ sieht aus wie ein A ohne Querstrich – A wie »and«.
    explanation: ∧ ist und, ∨ ist oder, ¬ ist nicht, → ist wenn–dann.

  - kind: explain
    id: s6
    body: Ist der Satz »Dieser Satz ist falsch« wahr oder falsch?
    reveal:
      body: Weder noch. Wäre er wahr, wäre er falsch – und umgekehrt. Solche Paradoxien zeigen die Grenzen einfacher Logik.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 2 + 2 = 4 **oder** 2 + 2 = 5
          right: true
        - text: 2 + 2 = 4 **und** 2 + 2 = 5
          right: false
        - text: "**Nicht** (2 + 2 = 5)"
          right: true
        - text: 2 + 2 = 4 **oder** 3 + 3 = 6
          right: true
          why: Das logische Oder ist auch wahr, wenn beides stimmt.
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Auf der Speisekarte steht »Suppe oder Salat«. Welches »oder« ist gemeint?
    params:
      options:
        - label: Das ausschließende – eins von beiden, nicht beides (XOR)
          correct: true
        - label: Das logische – auch beides ist erlaubt
          feedback: Im Restaurant bekommst du nicht beides.
        - label: Gar keins
          feedback: Es ist ein Oder – nur eben das ausschließende.
    hints:
      - Bekommst du beides, wenn du beides bestellst?
    explanation: "Die Alltagssprache ist mehrdeutig. Die Logik trennt sauber: ∨ einschließend, XOR ausschließend."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: gates
    prompt: Die Lampe soll leuchten, wenn **mindestens zwei** der drei Schalter an sind. Wähle die Gatter.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
      gates:
        - id: ab
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
        - id: ac
          type: "?"
          in:
            - A
            - C
          options:
            - AND
            - OR
        - id: bc
          type: "?"
          in:
            - B
            - C
          options:
            - AND
            - OR
        - id: g
          type: "?"
          in:
            - ab
            - ac
            - bc
          options:
            - AND
            - OR
      outputs:
        - id: Q
          from: g
          label: Mehrheit
    check:
      predicate: table('Q') == [0, 0, 0, 1, 0, 1, 1, 1]
    hints:
      - "»Mindestens zwei an« heißt: A und B, oder A und C, oder B und C."
      - Innen drei UND-Gatter, außen ein ODER.
    explanation: (A ∧ B) ∨ (A ∧ C) ∨ (B ∧ C) ist die **Mehrheitsfunktion**. Auch (A ∨ B) ∧ (A ∨ C) ∧ (B ∨ C) funktioniert – dieselbe Funktion, andere Form.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Für wie viele der 8 Belegungen von A, B, C ist (A ∨ B) ∧ ¬C wahr?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: forgot-not-c
        text: Das gilt für A ∨ B allein. ¬C halbiert das noch einmal.
    hints:
      - A ∨ B ist nur falsch, wenn A und B beide falsch sind.
      - Von den 4 Fällen für A, B sind 3 wahr. Dazu muss C falsch sein.
    explanation: "3 von 4 Fällen für A ∨ B, jeweils nur mit C falsch: 3 Zeilen. Man kann Wahrheitstafeln also oft **zählen**, statt sie aufzuschreiben."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Mit welchem **einzigen** Verknüpfungszeichen lassen sich »und«, »oder« und »nicht« alle ausdrücken?
    params:
      options:
        - label: Mit NAND – »nicht beide«
          correct: true
        - label: Mit »und«
          feedback: Ohne Verneinung lässt sich »nicht« nicht bauen.
        - label: Mit »oder«
          feedback: Auch hier fehlt die Verneinung.
    hints:
      - Was ergibt »A NAND A«?
    explanation: A NAND A ist ¬A. Daraus baut man alles andere – darum genügt Chips ein einziger Gattertyp.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Wie baut man »nicht A« nur aus NAND-Gattern?
    params:
      options:
        - label: A NAND A
          correct: true
        - label: A NAND 0
          feedback: NAND mit 0 ist immer 1 – egal, was A ist.
        - label: Das geht nicht.
          feedback: Mit NAND geht alles – auch »nicht«.
    hints:
      - NAND heißt »nicht beide«. Was ist »nicht (A und A)«?
      - A und A ist einfach A.
    explanation: A NAND A = ¬(A ∧ A) = ¬A. Mit »nicht« und »nicht beide« baut man dann UND und ODER. Darum besteht ein Prozessor im Kern aus vielen gleichen Gattern. NOR reicht übrigens genauso.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen dem logischen Oder und dem »entweder – oder«.
    params:
      keywords:
        - - beide
          - beides
          - both
        - - eins
          - einer
          - nur eins
          - one
          - only one
        - - wahr
          - "true"
          - gilt
          - holds
      sample: Das logische Oder ist auch wahr, wenn beides gilt. Das »entweder – oder« ist nur wahr, wenn genau eins gilt, nicht beide.
    difficulty: 3

srs:
  cards_from: [oder, symbole]
