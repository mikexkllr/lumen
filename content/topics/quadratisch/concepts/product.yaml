id: math.quadratic.product
type: concept
title: Das Nullprodukt
summary: Ein Faktor muss null sein.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Nullstellen-Jagd
    body: Viele schwere Gleichungen werden leicht, wenn man sie als Produkt schreibt. Die Kurve zeigt $(x - a) \cdot (x + 2)$. Schieb a und beobachte, wo sie die x-Achse schneidet. Erkennst du die **Nullstellen** in der Formel wieder?
    visual:
      widget: slider
      interactive: true
      params:
        expr: (x - a)*(x + 2)
        showCoordinates: false
        sliders:
          - id: a
            label: a
            min: -3
            max: 4
            step: 1
            initial: 1

  - kind: problem
    id: null-mal
    widget: choice
    prompt: a · b = 0. Was weißt du sicher?
    params:
      options:
        - { label: Mindestens einer der Faktoren ist 0., correct: true }
        - { label: Beide sind 0., feedback: "Einer reicht. 0 · 5 ist auch 0." }
        - { label: Nichts., feedback: "Ein Produkt wird nur null, wenn ein Faktor null ist." }
    hints:
      - Kann 3 · 7 null ergeben?
    explanation: Ein Produkt ist genau dann null, wenn ein Faktor null ist.

  - kind: explain
    id: s2
    body: |
      **Nullprodukt:** (x − 3)(x + 5) = 0 heißt x − 3 = 0 oder x + 5 = 0.
      Also x = 3 oder x = −5.

  - kind: problem
    id: loesungen
    widget: choice
    prompt: Welche Zahlen lösen (x − {{a}})(x + {{b}}) = 0? Wähle alle.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "x = {{a}}", correct: true }
        - { label: "x = {{-b}}", correct: true }
        - { label: "x = {{-a}}" }
        - { label: "x = {{b}}" }
    hints:
      - Wann wird die erste Klammer null, wann die zweite?
    explanation: "x − {{a}} = 0 gibt x = {{a}}, x + {{b}} = 0 gibt x = {{-b}}."
    variants:
      params: { a: "int[1,8]", b: "int[1,8]" }
      constraints: ["a != b"]
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: rechteck
    widget: rect
    prompt: Ein Rechteck ist 2 m länger als breit und hat 24 m² Fläche. Zieh es zurecht.
    params: { maxW: 10, maxH: 8, w: 3, h: 3, show: [area] }
    check: { predicate: "w - h == 2 && area == 24" }
    hints:
      - Probier Breiten aus – 3 · 5, 4 · 6 …
    explanation: 6 · 4 = 24 und 6 − 4 = 2. Als Gleichung – x · (x + 2) = 24 mit x = 4.

  - kind: problem
    id: zahl
    widget: numeric
    prompt: Eine positive Zahl mal (Zahl + 3) ergibt 40. Wie heißt die Zahl?
    params: { placeholder: "Zahl" }
    answer: { value: 5 }
    hints:
      - Probier Zahlen aus. 5 · 8?
    explanation: 5 · 8 = 40. Als Gleichung – x² + 3x − 40 = 0, also (x − 5)(x + 8) = 0.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Produkt ist genau dann null, wenn mindestens ein [[Faktor]] null ist. Aus (x − 2)(x + 7) = 0 folgt x = [[2]] oder x = [[−7]].
      distractors:
        - "7"
        - Summand

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Stelle a so ein, dass die Kurve $y = (x - a)(x + 2)$ die x-Achse bei x = 3 schneidet.
    params:
      expr: (x - a)*(x + 2)
      showCoordinates: true
      sliders:
        - id: a
          label: a
          min: -3
          max: 4
          step: 1
          initial: -1
      markers:
        - x: 3
          y: 0
    answer:
      values:
        a: 3
    hints:
      - Ein Produkt ist null, wenn ein Faktor null ist.
      - Bei x = 3 muss $x - a = 0$ sein.
    explanation: Mit a = 3 ist $(x - 3)(x + 2) = 0$ bei x = 3 und bei x = −2.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Löse $x^2 - 5x = 0$. Gib die Lösung an, die nicht null ist.
    answer:
      value: 5
    hints:
      - Klammere x aus.
    explanation: x(x − 5) = 0. Wer durch x teilt, verliert die Lösung 0!
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Hat $x^2 + px + q = 0$ die Lösungen $x_1$ und $x_2$, dann ist $x^2 + px + q = (x - x_1)(x - x_2)$. Ausmultiplizieren zeigt den **Satz von Vieta**: $x_1 + x_2 = -p$ und $x_1 \\cdot x_2 = q$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Die Gleichung $x^2 + px + q = 0$ hat die Lösungen {{r}} und −{{s}}. Wie groß ist q?
    answer:
      value: "{{-r * s}}"
    feedback:
      - when: numval(state.input) == r * s
        misconception: sign-error
        text: "Vorzeichen: Eine Lösung ist negativ, also auch das Produkt."
      - when: numval(state.input) == s - r
        misconception: sum-not-product
        text: Das ist p, die negative Summe. q ist das Produkt.
    hints:
      - q ist das Produkt der Lösungen.
      - "{{r}} · (−{{s}})."
    explanation: q = {{r}} · (−{{s}}) = {{-r * s}}, und p = −({{r}} − {{s}}) = {{s - r}}.
    difficulty: 2
    variants:
      params:
        r: int[2,9]
        s: int[2,9]
      constraints:
        - r != s
      defaults:
        r: 3
        s: 5

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Zerlege $x^2 + x - 12$ in zwei Klammern. Welche negative Zahl löst $x^2 + x - 12 = 0$?
    answer:
      value: -4
    feedback:
      - when: numval(state.input) == -3
        misconception: sign-swap
        text: Dann wäre die andere Lösung 4 und die Summe 1 – aber p = +1 verlangt die Summe −1.
    hints:
      - "Gesucht: zwei Zahlen mit Produkt −12 und Summe −1."
      - 3 und −4.
    explanation: (x − 3)(x + 4) = 0, also x = 3 oder x = −4.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Löse $x^2 + 2x - 15 = 0$ durch Zerlegen in Faktoren. Gib die negative Lösung an.
    answer:
      value: -5
    hints:
      - "Gesucht: zwei Zahlen mit Produkt −15 und Summe 2."
    explanation: (x + 5)(x − 3) = 0. Das ist der **Satz von Vieta**.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Das Nullprodukt funktioniert, weil reelle Zahlen keine **Nullteiler** haben: ab = 0 nur, wenn a = 0 oder b = 0. Modulo 6 ist das anders: 2 · 3 = 6 ≡ 0. Dort kann eine quadratische Gleichung mehr als zwei Lösungen haben."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wie viele x aus {0, 1, 2, 3, 4, 5} erfüllen $x(x - 1) \equiv 0 \pmod 6$?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: real-intuition
        text: 0 und 1 stimmen – aber teste auch 3 und 4.
    hints:
      - Rechne x · (x − 1) für jedes x aus und teile durch 6.
      - 3 · 2 = 6 und 4 · 3 = 12.
    explanation: "x = 0, 1, 3 und 4: vier Lösungen. Modulo einer Primzahl gibt es keine Nullteiler – dort bleibt es bei höchstens zwei."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum folgt aus (x − 3)(x + 5) = 0, dass x = 3 oder x = −5 ist?"
    params:
      keywords:
        - - faktor
          - klammer
          - factor
          - bracket
        - - "null"
          - zero
        - - mindestens einer
          - einer davon
          - at least one
          - one of
      sample: Ein Produkt ist nur dann null, wenn mindestens einer der Faktoren null ist. Also ist x − 3 = 0 oder x + 5 = 0. Das ergibt x = 3 oder x = −5.
    explanation: Zwei Zahlen ungleich null ergeben mal genommen nie null. Darum muss eine Klammer null sein.
    difficulty: 3

srs:
  cards_from: [loesungen, zahl]
