id: math.quadratic.product
type: concept
title: Das Nullprodukt
summary: Ein Faktor muss null sein.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: null-mal
    widget: choice
    prompt: a · b = 0. Was weißt du sicher?
    params:
      options:
        - { label: Mindestens einer der Faktoren ist 0., correct: true }
        - { label: Beide sind 0., feedback: "Einer reicht. 0 · 5 ist auch 0." }
        - { label: Nichts., feedback: "Ein Produkt wird nur null, wenn ein Faktor null ist." }
    hints:
      - Kann 3 · 7 null ergeben?
    explanation: Ein Produkt ist genau dann null, wenn ein Faktor null ist.

  - kind: explain
    id: s2
    body: |
      **Nullprodukt:** (x − 3)(x + 5) = 0 heißt x − 3 = 0 oder x + 5 = 0.
      Also x = 3 oder x = −5.

  - kind: problem
    id: loesungen
    widget: choice
    prompt: Welche Zahlen lösen (x − {{a}})(x + {{b}}) = 0? Wähle alle.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "x = {{a}}", correct: true }
        - { label: "x = {{-b}}", correct: true }
        - { label: "x = {{-a}}" }
        - { label: "x = {{b}}" }
    hints:
      - Wann wird die erste Klammer null, wann die zweite?
    explanation: "x − {{a}} = 0 gibt x = {{a}}, x + {{b}} = 0 gibt x = {{-b}}."
    variants:
      params: { a: "int[1,8]", b: "int[1,8]" }
      constraints: ["a != b"]
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: rechteck
    widget: rect
    prompt: Ein Rechteck ist 2 m länger als breit und hat 24 m² Fläche. Zieh es zurecht.
    params: { maxW: 10, maxH: 8, w: 3, h: 3, show: [area] }
    check: { predicate: "w - h == 2 && area == 24" }
    hints:
      - Probier Breiten aus – 3 · 5, 4 · 6 …
    explanation: 6 · 4 = 24 und 6 − 4 = 2. Als Gleichung – x · (x + 2) = 24 mit x = 4.

  - kind: problem
    id: zahl
    widget: numeric
    prompt: Eine positive Zahl mal (Zahl + 3) ergibt 40. Wie heißt die Zahl?
    params: { placeholder: "Zahl" }
    answer: { value: 5 }
    hints:
      - Probier Zahlen aus. 5 · 8?
    explanation: 5 · 8 = 40. Als Gleichung – x² + 3x − 40 = 0, also (x − 5)(x + 8) = 0.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Produkt ist genau dann null, wenn mindestens ein [[Faktor]] null ist. Aus (x − 2)(x + 7) = 0 folgt x = [[2]] oder x = [[−7]].
      distractors:
        - "7"
        - Summand

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Löse $x^2 - 5x = 0$. Gib die Lösung an, die nicht null ist.
    answer:
      value: 5
    hints:
      - Klammere x aus.
    explanation: x(x − 5) = 0. Wer durch x teilt, verliert die Lösung 0!
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Löse $x^2 + 2x - 15 = 0$ durch Zerlegen in Faktoren. Gib die negative Lösung an.
    answer:
      value: -5
    hints:
      - "Gesucht: zwei Zahlen mit Produkt −15 und Summe 2."
    explanation: (x + 5)(x − 3) = 0. Das ist der **Satz von Vieta**.
    difficulty: 3

srs:
  cards_from: [loesungen, zahl]
