id: math.quadratic.physics
type: concept
title: Throw and fall
summary: When does the ball hit the ground?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: sim
    prompt: Hit the flag at 40 m! Set angle and speed.
    params:
      scene: projectile
      target:
        range: 40
      show:
        - range
        - height
    answer:
      range:
        - 38.5
        - 41.5
    explanation: Several combinations hit. The flight path is a parabola – that is the topic now.


  - kind: problem
    id: fall
    widget: numeric
    body: A stone falls from a height of 45 m. After t seconds, its height is h = 45 − 5t² meters.
    prompt: After how many seconds does it land?
    params: { unit: s }
    answer: { value: 3 }
    feedback:
      - when: "numval(state.input) == 9"
        misconception: forget-root
        text: t² = 9. You still need the root.
    hints:
      - Set h = 0. Then 5t² = 45.
    explanation: t² = 9, so t = 3 seconds.

  - kind: explain
    id: s2
    body: |
      Throws and falling motion follow **quadratic** formulas. When you ask "when is it down?", you solve a quadratic equation.

  - kind: problem
    id: wurf
    widget: slider
    prompt: A ball flies along the path y = −0.5 · (x − 4)² + h. Set the peak height h so that it starts from the ground at x = 0.
    params:
      expr: "-0.5*(x - 4)^2 + h"
      x: [0, 8]
      y: [0, 10]
      sliders: [{ id: h, label: Peak, min: 2, max: 10, step: 1, initial: 5 }]
      markers: [{ x: 0, y: 0, label: Start }, { x: 8, y: 0, label: Target }]
      showCoordinates: false
    answer: { values: { h: 8 } }
    hints:
      - At x = 0, y must be 0. So −0.5 · 16 + h = 0.
    explanation: h = 8. Then the ball starts at 0 and lands at 8.

  - kind: problem
    id: zwei-loesungen
    widget: choice
    prompt: A ball flies up and falls back down. It is at a height of 5 m twice. What does that mean for the equation h(t) = 5?
    params:
      options:
        - { label: "It has two solutions, one rising and one falling", correct: true }
        - { label: It has no solution, feedback: "The ball really does reach 5 m." }
        - { label: It has infinitely many solutions, feedback: "It is exactly there at only two moments." }
    hints:
      - How often does the flight path cross a horizontal line?
    explanation: The parabola crosses the line twice, on the way up and on the way down.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A stone falls from 45 m: $h(t) = 45 - 5t^2$. After how many seconds does it hit the ground?"
    params:
      unit: s
    answer:
      value: 3
    hints:
      - Set h(t) = 0.
    explanation: 5t² = 45, so t² = 9 and t = 3. The negative solution has no meaning here.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: At which angle does the ball fly farthest? The speed is fixed. Find the largest range.
    params:
      scene: projectile
      controls:
        speed:
          value: 20
          fixed: true
        angle:
          value: 15
      show:
        - range
        - height
        - time
    answer:
      angle: 45
    explanation: At 45°. The range depends on sin(2α) – which is largest at 2α = 90°.
    difficulty: 3

srs:
  cards_from: [fall, zwei-loesungen]
