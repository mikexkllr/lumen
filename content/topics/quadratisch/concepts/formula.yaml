id: math.quadratic.formula
type: concept
title: Die Lösungsformel
summary: Für jede quadratische Gleichung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Wie viele Lösungen hat x² = 9?
    params:
      options:
        - label: "Zwei: 3 und −3"
          correct: true
        - label: "Eine: 3"
          feedback: Auch (−3) · (−3) ist 9.
        - label: Keine
          feedback: 3 · 3 = 9.
    hints:
      - Minus mal minus ergibt plus.
    explanation: Zwei Lösungen sind bei Quadraten normal. Eine Formel liefert beide auf einmal.

  - kind: explain
    id: s1
    body: |
      Für x² + px + q = 0 gilt die **pq-Formel**:
      $x = -\frac{p}{2} \pm \sqrt{\left(\frac{p}{2}\right)^2 - q}$

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: Löse x² − 6x + 8 = 0. Gib die größere Lösung an.
    params: { placeholder: "x" }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: smaller-root
        text: Das ist die kleinere Lösung. Gesucht ist die größere.
    hints:
      - p = −6, q = 8. Also 3 ± $\sqrt{9 - 8}$.
    explanation: 3 ± 1 – also x = 4 oder x = 2.

  - kind: problem
    id: variante
    widget: numeric
    prompt: "Löse x² − {{r + s}}x + {{r * s}} = 0. Gib die größere Lösung an."
    params: { placeholder: "x" }
    answer: { value: "{{max(r, s)}}" }
    hints:
      - "−p/2 = {{(r + s) / 2}}. Dann ± die Wurzel."
    explanation: "Die Lösungen sind {{r}} und {{s}}."
    variants:
      params: { r: "int[1,6]", s: "int[7,12]" }
      defaults: { r: 2, s: 9 }

  - kind: problem
    id: diskriminante
    widget: choice
    prompt: Unter der Wurzel steht eine negative Zahl. Wie viele Lösungen gibt es?
    params:
      options:
        - { label: Keine reelle Lösung, correct: true }
        - { label: Zwei, feedback: "Aus negativen Zahlen zieht man keine reelle Wurzel." }
        - { label: Eine, feedback: "Genau eine gibt es, wenn unter der Wurzel 0 steht." }
    hints:
      - Welche Zahl mal sich selbst ist negativ?
    explanation: Die Parabel berührt die x-Achse dann gar nicht.

  - kind: problem
    id: probe
    widget: choice
    prompt: Wie prüfst du schnell, ob x = 3 die Gleichung x² − 5x + 6 = 0 löst?
    params:
      options:
        - { label: Einsetzen – 9 − 15 + 6 = 0, correct: true }
        - { label: Die Formel noch einmal rechnen, feedback: "Geht auch – Einsetzen ist aber schneller." }
    hints:
      - Setze 3 für x ein.
    explanation: 9 − 15 + 6 = 0. Die Probe stimmt.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: x² − 4 = 0
          right: true
        - text: x² + 4 = 0
          right: false
        - text: x² − 2x + 1 = 0
          right: true
          why: "Genau eine: (x − 1)² = 0."
        - text: x² + x + 1 = 0
          right: false
          why: Unter der Wurzel steht 1/4 − 1 – negativ.
      left: Keine Lösung
      right: Hat Lösungen

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **Diskriminante** von $x^2 + 6x + 9 = 0$ ist $(p/2)^2 - q$. Wie groß ist sie?
    answer:
      value: 0
    hints:
      - (6/2)² − 9.
    explanation: "9 − 9 = 0: genau eine Lösung, x = −3. Positiv hieße zwei, negativ keine."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Woher kommt die pq-Formel? Ordne die Herleitung für $x^2 + px + q = 0$.
    params:
      items:
        - label: $x^2 + px = -q$
        - label: $x^2 + px + (p/2)^2 = (p/2)^2 - q$
        - label: $(x + p/2)^2 = (p/2)^2 - q$
        - label: $x + p/2 = \pm\sqrt{(p/2)^2 - q}$
    hints:
      - Erst q wegbringen, dann quadratisch ergänzen.
    explanation: Die Formel ist nur **quadratische Ergänzung**, einmal für alle Gleichungen durchgeführt.
    difficulty: 3

srs:
  cards_from: [variante, diskriminante]
