id: math.quadratic.formula
type: concept
title: Die Lösungsformel
summary: Für jede quadratische Gleichung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zwei, eine oder keine?
    body: "Eine Formel, die jede quadratische Gleichung löst, ist ein echter Schatz. Schieb p und q: Mal schneidet die Parabel die x-Achse zweimal, mal nur einmal, mal gar nicht. Jeder Schnittpunkt ist eine **Lösung**."
    visual:
      widget: slider
      interactive: true
      params:
        expr: x^2 + p*x + q
        showCoordinates: false
        sliders:
          - id: p
            label: p
            min: -4
            max: 4
            step: 1
            initial: 0
          - id: q
            label: q
            min: -4
            max: 4
            step: 1
            initial: -3

  - kind: problem
    id: hook
    widget: choice
    prompt: Wie viele Lösungen hat x² = 9?
    params:
      options:
        - label: "Zwei: 3 und −3"
          correct: true
        - label: "Eine: 3"
          feedback: Auch (−3) · (−3) ist 9.
        - label: Keine
          feedback: 3 · 3 = 9.
    hints:
      - Minus mal minus ergibt plus.
    explanation: Zwei Lösungen sind bei Quadraten normal. Eine Formel liefert beide auf einmal.

  - kind: explain
    id: s1
    body: |
      Für x² + px + q = 0 gilt die **pq-Formel**:
      $x = -\frac{p}{2} \pm \sqrt{\left(\frac{p}{2}\right)^2 - q}$

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: Löse x² − 6x + 8 = 0. Gib die größere Lösung an.
    params: { placeholder: "x" }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: smaller-root
        text: Das ist die kleinere Lösung. Gesucht ist die größere.
    hints:
      - p = −6, q = 8. Also 3 ± $\sqrt{9 - 8}$.
    explanation: 3 ± 1 – also x = 4 oder x = 2.

  - kind: problem
    id: variante
    widget: numeric
    prompt: "Löse x² − {{r + s}}x + {{r * s}} = 0. Gib die größere Lösung an."
    params: { placeholder: "x" }
    answer: { value: "{{max(r, s)}}" }
    hints:
      - "−p/2 = {{(r + s) / 2}}. Dann ± die Wurzel."
    explanation: "Die Lösungen sind {{r}} und {{s}}."
    variants:
      params: { r: "int[1,6]", s: "int[7,12]" }
      defaults: { r: 2, s: 9 }

  - kind: problem
    id: diskriminante
    widget: choice
    prompt: Unter der Wurzel steht eine negative Zahl. Wie viele Lösungen gibt es?
    params:
      options:
        - { label: Keine reelle Lösung, correct: true }
        - { label: Zwei, feedback: "Aus negativen Zahlen zieht man keine reelle Wurzel." }
        - { label: Eine, feedback: "Genau eine gibt es, wenn unter der Wurzel 0 steht." }
    hints:
      - Welche Zahl mal sich selbst ist negativ?
    explanation: Die Parabel berührt die x-Achse dann gar nicht.

  - kind: problem
    id: probe
    widget: choice
    prompt: Wie prüfst du schnell, ob x = 3 die Gleichung x² − 5x + 6 = 0 löst?
    params:
      options:
        - { label: Einsetzen – 9 − 15 + 6 = 0, correct: true }
        - { label: Die Formel noch einmal rechnen, feedback: "Geht auch – Einsetzen ist aber schneller." }
    hints:
      - Setze 3 für x ein.
    explanation: 9 − 15 + 6 = 0. Die Probe stimmt.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: x² − 4 = 0
          right: true
        - text: x² + 4 = 0
          right: false
        - text: x² − 2x + 1 = 0
          right: true
          why: "Genau eine: (x − 1)² = 0."
        - text: x² + x + 1 = 0
          right: false
          why: Unter der Wurzel steht 1/4 − 1 – negativ.
      left: Keine Lösung
      right: Hat Lösungen

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Stelle q so ein, dass die Parabel $y = x^2 - 4x + q$ die x-Achse genau einmal berührt.
    params:
      expr: x^2 - 4*x + q
      x:
        - -2
        - 6
      y:
        - -5
        - 5
      showCoordinates: false
      sliders:
        - id: q
          label: q
          min: -2
          max: 6
          step: 1
          initial: 0
    answer:
      values:
        q: 4
    hints:
      - "Genau eine Lösung heißt: Der Scheitel liegt genau auf der x-Achse."
      - Die Diskriminante $\left(\frac{p}{2}\right)^2 - q$ muss null sein. Hier ist p = −4.
    explanation: $(-2)^2 - q = 0$ ergibt q = 4. Dann ist $y = (x - 2)^2$, und der Scheitel (2 | 0) berührt die Achse.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **Diskriminante** von $x^2 + 6x + 9 = 0$ ist $(p/2)^2 - q$. Wie groß ist sie?
    answer:
      value: 0
    hints:
      - (6/2)² − 9.
    explanation: "9 − 9 = 0: genau eine Lösung, x = −3. Positiv hieße zwei, negativ keine."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Die **Diskriminante** $D = \left(\frac p2\right)^2 - q$ steht unter der Wurzel. Ist sie positiv, gibt es zwei Lösungen, ist sie null, eine, ist sie negativ, keine reelle.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: buckets
    prompt: Wie viele reelle Lösungen hat die Gleichung?
    params:
      buckets:
        - id: b1
          label: Keine
        - id: b2
          label: Eine
        - id: b3
          label: Zwei
      items:
        - label: x² + 4 = 0
          bucket: b1
        - label: x² + x + 1 = 0
          bucket: b1
        - label: x² − 4x + 4 = 0
          bucket: b2
        - label: x² + 6x + 9 = 0
          bucket: b2
        - label: x² − 5x + 6 = 0
          bucket: b3
        - label: 2x² − 8 = 0
          bucket: b3
    hints:
      - Berechne jeweils (p/2)² − q.
      - x² − 4x + 4 = (x − 2)², also D = 0.
    explanation: "D < 0: x² + 4 und x² + x + 1. D = 0: die zwei Binome. D > 0: x² − 5x + 6 (Lösungen 2, 3) und 2x² − 8 (±2)."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Löse $2x^2 - 3x - 2 = 0$. Teile erst durch 2 oder nutze $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$. Gib die größere Lösung an.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == -0.5
        misconception: smaller-root
        text: Das ist die kleinere Lösung.
      - when: numval(state.input) == 4
        misconception: no-denominator
        text: Den Nenner 2a = 4 nicht vergessen.
    hints:
      - b² − 4ac = 9 + 16 = 25.
      - "x = (3 ± 5) : 4."
    explanation: "x = 8 : 4 = 2 oder x = −2 : 4 = −0,5. Probe: 8 − 6 − 2 = 0."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Woher kommt die pq-Formel? Ordne die Herleitung für $x^2 + px + q = 0$.
    params:
      items:
        - label: $x^2 + px = -q$
        - label: $x^2 + px + (p/2)^2 = (p/2)^2 - q$
        - label: $(x + p/2)^2 = (p/2)^2 - q$
        - label: $x + p/2 = \pm\sqrt{(p/2)^2 - q}$
    hints:
      - Erst q wegbringen, dann quadratisch ergänzen.
    explanation: Die Formel ist nur **quadratische Ergänzung**, einmal für alle Gleichungen durchgeführt.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Löse $x^2 - 2x + 5 = 0$ mit komplexen Zahlen, wobei $i^2 = -1$. Die Lösungen sind a ± bi. Wie groß ist a?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 2
        misconception: imaginary-part
        text: Das ist b, der Teil vor dem i.
    hints:
      - "pq-Formel: x = 1 ± √(1 − 5) = 1 ± √(−4)."
      - √(−4) = 2i.
    explanation: x = 1 ± 2i. Mit komplexen Zahlen hat jede quadratische Gleichung genau zwei Lösungen, doppelte mitgezählt. Das ist ein Fall des Fundamentalsatzes der Algebra.
    difficulty: 3

  - kind: explain
    id: mb-x2
    depth: 3
    body: "Für Gleichungen dritten und vierten Grades fanden Cardano und Ferrari um 1545 ähnliche Formeln. Für Grad 5 bewies Abel 1824: Eine **allgemeine Formel** mit Wurzeln gibt es nicht. Galois erklärte später, warum – mit Gruppen."

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was verrät die Diskriminante, noch bevor man rechnet?"
    params:
      keywords:
        - - wurzel
          - unter der wurzel
          - square root
          - root
        - - anzahl
          - wie viele
          - number
          - how many
        - - negativ
          - positiv
          - "null"
          - negative
          - positive
          - zero
      sample: Die Diskriminante steht unter der Wurzel der Lösungsformel. Ist sie positiv, gibt es zwei Lösungen, bei null eine, ist sie negativ, keine reelle. Sie verrät also die Anzahl der Lösungen.
    explanation: "Im Bild: Die Diskriminante sagt, ob die Parabel die x-Achse zweimal schneidet, berührt oder verfehlt."
    difficulty: 3

srs:
  cards_from: [variante, diskriminante]
