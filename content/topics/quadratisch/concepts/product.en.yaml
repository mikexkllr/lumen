id: math.quadratic.product
type: concept
title: The zero-product rule
summary: One factor must be zero.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: null-mal
    widget: choice
    prompt: a · b = 0. What do you know for sure?
    params:
      options:
        - { label: At least one of the factors is 0., correct: true }
        - { label: Both are 0., feedback: "One is enough. 0 · 5 is also 0." }
        - { label: Nothing., feedback: "A product is only zero if a factor is zero." }
    hints:
      - Can 3 · 7 give zero?
    explanation: A product is zero exactly when a factor is zero.

  - kind: explain
    id: s2
    body: |
      **Zero-product rule:** (x − 3)(x + 5) = 0 means x − 3 = 0 or x + 5 = 0.
      So x = 3 or x = −5.

  - kind: problem
    id: loesungen
    widget: choice
    prompt: Which numbers solve (x − {{a}})(x + {{b}}) = 0? Choose all.
    params:
      multiple: true
      layout: grid
      options:
        - { label: "x = {{a}}", correct: true }
        - { label: "x = {{-b}}", correct: true }
        - { label: "x = {{-a}}" }
        - { label: "x = {{b}}" }
    hints:
      - When does the first bracket become zero, and when the second?
    explanation: "x − {{a}} = 0 gives x = {{a}}, x + {{b}} = 0 gives x = {{-b}}."
    variants:
      params: { a: "int[1,8]", b: "int[1,8]" }
      constraints: ["a != b"]
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: rechteck
    widget: rect
    prompt: A rectangle is 2 m longer than it is wide and has an area of 24 m². Drag it into shape.
    params: { maxW: 10, maxH: 8, w: 3, h: 3, show: [area] }
    check: { predicate: "w - h == 2 && area == 24" }
    hints:
      - Try widths. 3 · 5, 4 · 6 …
    explanation: 6 · 4 = 24 and 6 − 4 = 2. As an equation, x · (x + 2) = 24 with x = 4.

  - kind: problem
    id: zahl
    widget: numeric
    prompt: A positive number times (the number + 3) gives 40. What is the number?
    params: { placeholder: "Number" }
    answer: { value: 5 }
    hints:
      - Try numbers. 5 · 8?
    explanation: 5 · 8 = 40. As an equation, x² + 3x − 40 = 0, so (x − 5)(x + 8) = 0.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A product is zero exactly when at least one [[factor]] is zero. From (x − 2)(x + 7) = 0 follows x = [[2]] or x = [[−7]].
      distractors:
        - "7"
        - addend

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Solve $x^2 - 5x = 0$. Give the solution that is not zero.
    answer:
      value: 5
    hints:
      - Factor out x.
    explanation: x(x − 5) = 0. Dividing by x loses the solution 0!
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "If $x^2 + px + q = 0$ has solutions $x_1$ and $x_2$, then $x^2 + px + q = (x - x_1)(x - x_2)$. Expanding shows **Vieta's formulas**: $x_1 + x_2 = -p$ and $x_1 \\cdot x_2 = q$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: The equation $x^2 + px + q = 0$ has the solutions {{r}} and −{{s}}. What is q?
    answer:
      value: "{{-r * s}}"
    feedback:
      - when: numval(state.input) == r * s
        misconception: sign-error
        text: "Sign: one solution is negative, so the product is too."
      - when: numval(state.input) == s - r
        misconception: sum-not-product
        text: That is p, the negative sum. q is the product.
    hints:
      - q is the product of the solutions.
      - "{{r}} · (−{{s}})."
    explanation: q = {{r}} · (−{{s}}) = {{-r * s}}, and p = −({{r}} − {{s}}) = {{s - r}}.
    difficulty: 2
    variants:
      params:
        r: int[2,9]
        s: int[2,9]
      constraints:
        - r != s
      defaults:
        r: 3
        s: 5

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Factor $x^2 + x - 12$ into two brackets. Which negative number solves $x^2 + x - 12 = 0$?
    answer:
      value: -4
    feedback:
      - when: numval(state.input) == -3
        misconception: sign-swap
        text: Then the other root would be 4 and the sum 1 – but p = +1 needs the sum −1.
    hints:
      - "Wanted: two numbers with product −12 and sum −1."
      - 3 and −4.
    explanation: (x − 3)(x + 4) = 0, so x = 3 or x = −4.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Solve $x^2 + 2x - 15 = 0$ by factoring. Give the negative solution.
    answer:
      value: -5
    hints:
      - "Wanted: two numbers with product −15 and sum 2."
    explanation: (x + 5)(x − 3) = 0. This is **Vieta’s theorem**.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "The zero product works because real numbers have no **zero divisors**: ab = 0 only if a = 0 or b = 0. Modulo 6 it is different: 2 · 3 = 6 ≡ 0. There a quadratic equation can have more than two solutions."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: How many x in {0, 1, 2, 3, 4, 5} satisfy $x(x - 1) \equiv 0 \pmod 6$?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: real-intuition
        text: 0 and 1 work – but test 3 and 4 too.
    hints:
      - Compute x · (x − 1) for every x and divide by 6.
      - 3 · 2 = 6 and 4 · 3 = 12.
    explanation: "x = 0, 1, 3 and 4: four solutions. Modulo a prime there are no zero divisors – there it stays at most two."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does (x − 3)(x + 5) = 0 mean x = 3 or x = −5?"
    params:
      keywords:
        - - faktor
          - klammer
          - factor
          - bracket
        - - "null"
          - zero
        - - mindestens einer
          - einer davon
          - at least one
          - one of
      sample: A product is zero only if at least one factor is zero. So x − 3 = 0 or x + 5 = 0. That gives x = 3 or x = −5.
    explanation: Two nonzero numbers never multiply to zero. So one bracket must be zero.
    difficulty: 3

srs:
  cards_from: [loesungen, zahl]
