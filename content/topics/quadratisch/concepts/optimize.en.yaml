id: math.quadratic.optimize
type: concept
title: The biggest enclosure
summary: Parabolas have a peak.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: gehege
    widget: rect
    prompt: You have 16 m of fence for a rectangular enclosure. Drag it so the area is as large as possible.
    params: { maxW: 8, maxH: 8, w: 1, perimeter: 16 }
    check: { predicate: "area == 16" }
    hints:
      - Try different widths and watch the area.
    explanation: 4 × 4, a square, gives 16 m². Every longer rectangle has less.

  - kind: explain
    id: s2
    body: |
      With width x, the length is 8 − x. The area is x · (8 − x).
      This is a **parabola**. It rises, reaches a peak and falls again.

  - kind: problem
    id: gipfel
    widget: slider
    prompt: Slide the parabola y = −(x − s)² + 4 so its peak is at x = 2.
    params:
      expr: "-(x - s)^2 + 4"
      x: [-2, 6]
      y: [-3, 5]
      sliders: [{ id: s, min: -1, max: 5, step: 0.5, initial: 0 }]
      markers: [{ x: 2, y: 4, label: Peak }]
      showCoordinates: false
    answer: { values: { s: 2 } }
    hints:
      - The vertex is at x = s.
    explanation: With s = 2, the peak is exactly at (2 | 4).

  - kind: problem
    id: zaun
    widget: numeric
    prompt: With {{z}} m of fence, what is the area of the largest rectangular enclosure?
    params: { unit: m² }
    answer: { value: "{{(z / 4) ** 2}}" }
    feedback:
      - when: "numval(state.input) == z"
        misconception: perimeter-for-area
        text: That is the perimeter. Split it into four equal sides.
    hints:
      - "The largest is a square with side {{z}} ÷ 4."
    explanation: "Side {{z / 4}} m, area {{(z / 4) ** 2}} m²."
    variants:
      params: { z: "choice[12,20,24,40]" }
      defaults: { z: 20 }

  - kind: explain
    id: s5
    body: Where do you meet a peak like this in everyday life?
    reveal:
      body: In the price of a product. If it is too low, you earn little. If it is too high, nobody buys. In between lies the peak, often a parabola.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A pen lies against a wall; only three sides need fencing. You have 20 m. What is the largest area?
    params:
      unit: m²
    answer:
      value: 50
    hints:
      - With depth x the width is 20 − 2x. Try x = 4, 5, 6.
    explanation: "x(20 − 2x) is largest at x = 5: 5 · 10 = 50. No longer a square!"
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "The area of a pen is A(x) = 4x − x². Move the point to where the curve is level: there the area is largest."
    params:
      scene: tangent
      expr: 4*x - x^2
    answer:
      slope: 0
    explanation: At x = 2. At the top of a parabola the slope is zero.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: A parabola is **symmetric** about its vertex. The zeros of x · (8 − x) are 0 and 8, so the peak lies exactly in the middle at x = 4. No formula needed.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: A ball flies at $h(t) = 20t - 5t^2$ metres. How high does it get at most?
    params:
      unit: m
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 2
        misconception: time-not-height
        text: That is the time, not the height. Plug in t = 2.
    hints:
      - "Zeros: 5t(4 − t) = 0, so t = 0 and t = 4."
      - The peak is in the middle at t = 2.
    explanation: h(2) = 40 − 20 = 20 m.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Two numbers add up to {{S}}. How large can their product be at most?
    answer:
      value: "{{S * S / 4}}"
    feedback:
      - when: numval(state.input) == S * S / 2
        misconception: halving-error
        text: "Check with equal numbers: {{S / 2}} · {{S / 2}}."
    hints:
      - "Product: x · ({{S}} − x) – a parabola."
      - "The peak is in the middle: x = {{S / 2}}."
    explanation: "{{S / 2}} · {{S / 2}} = {{S * S / 4}}. Equal numbers give the largest product."
    difficulty: 2
    variants:
      params:
        S: step[10,40,2]
      defaults:
        S: 20

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: At €10 there are 100 guests. Every extra euro drives 5 guests away. Which price yields the highest revenue?
    params:
      unit: €
    answer:
      value: 15
    hints:
      - Revenue = (10 + x) · (100 − 5x). The zeros are x = −10 and x = 20.
    explanation: "The vertex lies midway between the zeros: x = 5, so €15."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "For a, b ≥ 0, $\\sqrt{ab} \\le \\frac{a + b}{2}$. Proof: expand $(\\sqrt a - \\sqrt b)^2 \\ge 0$. Equality only if a = b. This **AM–GM inequality** shows at once: for a fixed perimeter the square is the largest rectangle."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: With 60 m of fence you build a rectangle split into two pens by a middle fence. The middle fence is parallel to the width x. What is the largest possible area in m²?
    params:
      unit: m²
    answer:
      value: 150
    feedback:
      - when: numval(state.input) == 225
        misconception: no-divider
        text: That would be without the middle fence. It uses one more width.
    hints:
      - "Three widths and two lengths: 3x + 2y = 60, so y = 30 − 1.5x."
      - A(x) = x(30 − 1.5x) has zeros 0 and 20.
    explanation: "Peak at x = 10, then y = 15 and A = 150 m². In the end each direction gets the same: 30 m across, 30 m along."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is the square the rectangle with the largest area for a fixed perimeter?"
    params:
      keywords:
        - - gleich
          - gleich lang
          - equal
          - same
        - - parabel
          - gipfel
          - scheitel
          - parabola
          - peak
          - vertex
          - symmetr
        - - fläche
          - produkt
          - area
          - product
      sample: With a fixed perimeter the area is x times (half the perimeter minus x). That is a parabola with its peak exactly in the middle. There both sides are equal – a square.
    explanation: "Parabola symmetry or AM–GM: both say equal sides give the largest product."
    difficulty: 3

srs:
  cards_from: [zaun, gehege]
