id: math.quadratic.squares
type: concept
title: Zwei Lösungen
summary: Warum x² = 49 auch −7 hat.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zwei Stellen, eine Höhe
    body: Wie lang ist die Seite eines Quadrats mit 4 m²? Die Parabel zeigt x · x für jedes x. Zieh P dorthin, wo sie die Linie in Höhe 4 trifft. Dein x ist eine **Lösung** von x² = 4.
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -4
          - 4
        y:
          - -1
          - 7
        functions:
          - expr: x^2
          - expr: "4"
        points:
          - id: P
            x: 0
            y: 0
        showCoordinates: true

  - kind: problem
    id: wie-viele
    widget: choice
    prompt: Wie viele Zahlen x erfüllen x² = 49?
    params:
      layout: grid
      options:
        - { label: "2", correct: true }
        - { label: "1", feedback: "7 · 7 = 49 – aber auch (−7) · (−7)." }
        - { label: "0", feedback: "7 passt doch schon." }
    hints:
      - Minus mal minus ergibt plus.
    explanation: x = 7 und x = −7.

  - kind: explain
    id: s2
    body: |
      Bei x² = c mit c > 0 gibt es **zwei** **Lösungen**: $x = \sqrt{c}$ und $x = -\sqrt{c}$.
      Ist c negativ, gibt es keine reelle Lösung.

  - kind: problem
    id: positiv
    widget: numeric
    prompt: x² = {{n * n}}. Wie heißt die positive Lösung?
    params: { placeholder: "x" }
    answer: { value: "{{n}}" }
    hints:
      - Welche Zahl mal sich selbst ergibt {{n * n}}?
    explanation: "x = {{n}} oder x = −{{n}}."
    variants:
      params: { n: "int[3,15]" }
      defaults: { n: 9 }

  - kind: problem
    id: parabel
    widget: slider
    prompt: Verschiebe die Parabel y = x² + c so, dass sie die x-Achse bei −2 und 2 schneidet.
    params:
      expr: "x^2 + c"
      x: [-4, 4]
      y: [-5, 5]
      sliders: [{ id: c, min: -6, max: 3, step: 1, initial: 1 }]
      markers: [{ x: -2, y: 0 }, { x: 2, y: 0 }]
      showCoordinates: false
    answer: { values: { c: -4 } }
    hints:
      - "Bei x = 2 soll y = 0 sein. Also 4 + c = 0."
    explanation: Mit c = −4 gilt x² − 4 = 0 genau für x = ±2.

  - kind: problem
    id: negativ
    widget: choice
    prompt: Warum hat x² = −4 keine Lösung bei den reellen Zahlen?
    params:
      options:
        - { label: Ein Quadrat ist nie negativ., correct: true }
        - { label: "−4 ist keine Quadratzahl, aber −2 klappt.", feedback: "(−2)² = 4, nicht −4." }
        - { label: Es gibt eine – nämlich −2., feedback: "Minus mal minus ist plus." }
    hints:
      - Was kommt heraus, wenn man eine negative Zahl quadriert?
    explanation: Plus mal plus und minus mal minus geben beide etwas Positives.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: x² = 25 hat die Lösungen 5 und −5.
          right: true
        - text: x² = 0 hat zwei verschiedene Lösungen.
          right: false
          why: Nur x = 0.
        - text: x² = −9 hat die Lösung −3.
          right: false
          why: (−3)² = +9. Es gibt keine reelle Lösung.

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: Die Parabel zeigt $y = x^2$. Setze P auf den Punkt, an dem $x^2 = 9$ gilt und x negativ ist.
    params:
      x:
        - -4
        - 4
      y:
        - -1
        - 10
      functions:
        - expr: x^2
        - expr: "9"
      points:
        - id: P
          x: 0
          y: 0
      showCoordinates: true
    answer:
      points:
        P:
          x: -3
          y: 9
    hints:
      - Die waagerechte Linie liegt in Höhe 9. Wo trifft sie die Parabel?
      - Es gibt zwei Treffpunkte. Nimm den links von der y-Achse.
    explanation: $(-3)^2 = 9$, also ist x = −3 die negative Lösung. Die andere ist x = 3.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Löse $(x - 3)^2 = 16$. Gib die kleinere Lösung an.
    answer:
      value: -1
    hints:
      - x − 3 = 4 oder x − 3 = −4.
    explanation: x = 7 oder x = −1.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Die Wurzel ist nie negativ. Darum gilt $\sqrt{x^2} = |x|$, der **Betrag** von x. Aus $x^2 = 49$ folgt also |x| = 7 – und damit x = 7 oder x = −7.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Löse $(x - {{a}})^2 = {{b * b}}$. Gib die kleinere Lösung an.
    answer:
      value: "{{a - b}}"
    feedback:
      - when: numval(state.input) == a + b
        misconception: larger-root
        text: Das ist die größere Lösung. Die Klammer kann auch −{{b}} sein.
      - when: numval(state.input) == b - a
        misconception: sign-error
        text: "Vorzeichen prüfen: x − {{a}} = −{{b}} heißt x = {{a}} − {{b}}."
    hints:
      - Die Klammer ist {{b}} oder −{{b}}.
      - x − {{a}} = −{{b}}.
    explanation: x = {{a}} + {{b}} = {{a + b}} oder x = {{a}} − {{b}} = {{a - b}}.
    difficulty: 2
    variants:
      params:
        a: int[1,6]
        b: int[2,9]
      constraints:
        - a != b
      defaults:
        a: 2
        b: 5

  - kind: problem
    id: mb-d3
    depth: 2
    widget: choice
    prompt: Für welches c hat $x^2 + c = 0$ genau eine Lösung?
    params:
      options:
        - label: c = 0
          correct: true
        - label: c = 1
          feedback: x² = −1 hat keine reelle Lösung.
        - label: c = −1
          feedback: x² = 1 hat zwei Lösungen, 1 und −1.
    hints:
      - Wann fallen x und −x zusammen?
      - Nur bei x = 0.
    explanation: x² = 0 hat nur x = 0. Die Parabel berührt die x-Achse dann genau im Scheitel.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Löse $2x^2 - 50 = 0$. Gib die positive Lösung an.
    answer:
      value: 5
    hints:
      - Erst x² allein stellen.
    explanation: x² = 25, also x = ±5.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Ist √2 ein Bruch? Angenommen $\sqrt2 = \frac{p}{q}$, vollständig gekürzt. Dann ist $p^2 = 2q^2$, also p gerade. Dann ist auch q gerade – Widerspruch zum Kürzen. √2 ist **irrational**.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: order
    prompt: Bring den Beweis, dass √2 kein Bruch ist, in die richtige Reihenfolge.
    params:
      items:
        - label: "Annahme: √2 = p/q, gekürzt."
        - label: "Quadrieren: p² = 2q²."
        - label: "Also ist p² gerade und damit p gerade: p = 2k."
        - label: "Einsetzen: 4k² = 2q², also q² = 2k²."
        - label: Also ist auch q gerade – p/q war nicht gekürzt. Widerspruch!
    hints:
      - Ein Widerspruchsbeweis beginnt mit der Annahme des Gegenteils.
      - Der Widerspruch steht am Ende.
    explanation: Die Annahme führt zu einem Widerspruch, also ist sie falsch. Die Babylonier kannten √2 trotzdem auf sechs Stellen genau.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: "Das **Heron-Verfahren** nähert √2: Starte mit x = 1 und rechne immer $x \\to \\frac12 \\left(x + \\frac{2}{x}\\right)$. Was erhältst du nach zwei Schritten? Auf drei Stellen."
    answer:
      value: 1.417
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 1.5
        misconception: one-step
        text: Das ist nach einem Schritt. Setz 1,5 noch einmal ein.
    hints:
      - "Schritt 1: ½ · (1 + 2) = 1,5."
      - "Schritt 2: ½ · (1,5 + 2/1,5)."
    explanation: ½ · (1,5 + 1,333) ≈ 1,4167. Der wahre Wert ist 1,41421. Jeder Schritt verdoppelt etwa die Zahl der richtigen Stellen – das ist das Newton-Verfahren.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum hat x² = 49 zwei Lösungen, x² = 0 eine und x² = −4 keine?"
    params:
      keywords:
        - - minus
          - negativ
          - negative
          - −7
        - - quadrat
          - square
          - mal sich
          - times itself
        - - nie negativ
          - nicht negativ
          - never negative
          - positiv
          - positive
      sample: Ein Quadrat ist nie negativ, also hat x² = −4 keine Lösung. Bei 49 passen 7 und −7, weil minus mal minus plus ergibt. Bei 0 fallen beide zusammen.
    explanation: x und −x haben dasselbe Quadrat. Nur bei 0 sind sie gleich, und negative Quadrate gibt es bei reellen Zahlen nicht.
    difficulty: 3

srs:
  cards_from: [positiv, negativ]
