id: math.quadratic.squares
type: concept
title: Zwei Lösungen
summary: Warum x² = 49 auch −7 hat.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wie-viele
    widget: choice
    prompt: Wie viele Zahlen x erfüllen x² = 49?
    params:
      layout: grid
      options:
        - { label: "2", correct: true }
        - { label: "1", feedback: "7 · 7 = 49 – aber auch (−7) · (−7)." }
        - { label: "0", feedback: "7 passt doch schon." }
    hints:
      - Minus mal minus ergibt plus.
    explanation: x = 7 und x = −7.

  - kind: explain
    id: s2
    body: |
      Bei x² = c mit c > 0 gibt es **zwei** **Lösungen**: $x = \sqrt{c}$ und $x = -\sqrt{c}$.
      Ist c negativ, gibt es keine reelle Lösung.

  - kind: problem
    id: positiv
    widget: numeric
    prompt: x² = {{n * n}}. Wie heißt die positive Lösung?
    params: { placeholder: "x" }
    answer: { value: "{{n}}" }
    hints:
      - Welche Zahl mal sich selbst ergibt {{n * n}}?
    explanation: "x = {{n}} oder x = −{{n}}."
    variants:
      params: { n: "int[3,15]" }
      defaults: { n: 9 }

  - kind: problem
    id: parabel
    widget: slider
    prompt: Verschiebe die Parabel y = x² + c so, dass sie die x-Achse bei −2 und 2 schneidet.
    params:
      expr: "x^2 + c"
      x: [-4, 4]
      y: [-5, 5]
      sliders: [{ id: c, min: -6, max: 3, step: 1, initial: 1 }]
      markers: [{ x: -2, y: 0 }, { x: 2, y: 0 }]
      showCoordinates: false
    answer: { values: { c: -4 } }
    hints:
      - "Bei x = 2 soll y = 0 sein. Also 4 + c = 0."
    explanation: Mit c = −4 gilt x² − 4 = 0 genau für x = ±2.

  - kind: problem
    id: negativ
    widget: choice
    prompt: Warum hat x² = −4 keine Lösung bei den reellen Zahlen?
    params:
      options:
        - { label: Ein Quadrat ist nie negativ., correct: true }
        - { label: "−4 ist keine Quadratzahl, aber −2 klappt.", feedback: "(−2)² = 4, nicht −4." }
        - { label: Es gibt eine – nämlich −2., feedback: "Minus mal minus ist plus." }
    hints:
      - Was kommt heraus, wenn man eine negative Zahl quadriert?
    explanation: Plus mal plus und minus mal minus geben beide etwas Positives.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: x² = 25 hat die Lösungen 5 und −5.
          right: true
        - text: x² = 0 hat zwei verschiedene Lösungen.
          right: false
          why: Nur x = 0.
        - text: x² = −9 hat die Lösung −3.
          right: false
          why: (−3)² = +9. Es gibt keine reelle Lösung.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Löse $(x - 3)^2 = 16$. Gib die kleinere Lösung an.
    answer:
      value: -1
    hints:
      - x − 3 = 4 oder x − 3 = −4.
    explanation: x = 7 oder x = −1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Löse $2x^2 - 50 = 0$. Gib die positive Lösung an.
    answer:
      value: 5
    hints:
      - Erst x² allein stellen.
    explanation: x² = 25, also x = ±5.
    difficulty: 3

srs:
  cards_from: [positiv, negativ]
