id: math.quadratic.optimize
type: concept
title: Das größte Gehege
summary: Parabeln haben einen Gipfel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gehege
    widget: rect
    prompt: Du hast 16 m Zaun für ein rechteckiges Gehege. Zieh es so, dass die Fläche am größten ist.
    params: { maxW: 8, maxH: 8, w: 1, perimeter: 16 }
    check: { predicate: "area == 16" }
    hints:
      - Probier verschiedene Breiten aus und beobachte die Fläche.
    explanation: 4 × 4 – ein Quadrat – ergibt 16 m². Jedes längliche Rechteck hat weniger.

  - kind: explain
    body: |
      Bei Breite x ist die Länge 8 − x. Die Fläche ist x · (8 − x).
      Das ist eine **Parabel** – sie steigt, erreicht einen Gipfel und fällt wieder.

  - kind: problem
    id: gipfel
    widget: slider
    prompt: Schiebe den Punkt der Parabel y = −(x − s)² + 4 auf den Gipfel bei x = 2.
    params:
      expr: "-(x - s)^2 + 4"
      x: [-2, 6]
      y: [-3, 5]
      sliders: [{ id: s, min: -1, max: 5, step: 0.5, initial: 0 }]
      markers: [{ x: 2, y: 4, label: Gipfel }]
      showCoordinates: false
    answer: { values: { s: 2 } }
    hints:
      - Der Scheitel liegt bei x = s.
    explanation: Mit s = 2 liegt der Gipfel genau bei (2 | 4).

  - kind: problem
    id: zaun
    widget: numeric
    prompt: Mit {{z}} m Zaun – wie groß ist das größte rechteckige Gehege?
    params: { unit: m² }
    answer: { value: "{{(z / 4) ** 2}}" }
    feedback:
      - when: "numval(state.input) == z"
        misconception: perimeter-for-area
        text: Das ist der Umfang. Teile ihn auf vier gleiche Seiten auf.
    hints:
      - "Das größte ist ein Quadrat mit Seite {{z}} : 4."
    explanation: "Seite {{z / 4}} m, Fläche {{(z / 4) ** 2}} m²."
    variants:
      params: { z: "choice[12,20,24,40]" }
      defaults: { z: 20 }

  - kind: explain
    body: Wo begegnet dir so ein Gipfel im Alltag?
    reveal:
      body: Beim Preis eines Produkts. Ist er zu niedrig, verdient man wenig. Ist er zu hoch, kauft keiner. Dazwischen liegt der Gipfel – oft eine Parabel.

srs:
  cards_from: [zaun, gehege]
