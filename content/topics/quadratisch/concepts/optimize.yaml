id: math.quadratic.optimize
type: concept
title: Das größte Gehege
summary: Parabeln haben einen Gipfel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: gehege
    widget: rect
    prompt: Du hast 16 m Zaun für ein rechteckiges Gehege. Zieh es so, dass die Fläche am größten ist.
    params: { maxW: 8, maxH: 8, w: 1, perimeter: 16 }
    check: { predicate: "area == 16" }
    hints:
      - Probier verschiedene Breiten aus und beobachte die Fläche.
    explanation: 4 × 4 – ein Quadrat – ergibt 16 m². Jedes längliche Rechteck hat weniger.

  - kind: explain
    id: s2
    body: |
      Bei Breite x ist die Länge 8 − x. Die Fläche ist x · (8 − x).
      Das ist eine **Parabel** – sie steigt, erreicht einen Gipfel und fällt wieder.

  - kind: problem
    id: gipfel
    widget: slider
    prompt: Schiebe den Punkt der Parabel y = −(x − s)² + 4 auf den Gipfel bei x = 2.
    params:
      expr: "-(x - s)^2 + 4"
      x: [-2, 6]
      y: [-3, 5]
      sliders: [{ id: s, min: -1, max: 5, step: 0.5, initial: 0 }]
      markers: [{ x: 2, y: 4, label: Gipfel }]
      showCoordinates: false
    answer: { values: { s: 2 } }
    hints:
      - Der Scheitel liegt bei x = s.
    explanation: Mit s = 2 liegt der Gipfel genau bei (2 | 4).

  - kind: problem
    id: zaun
    widget: numeric
    prompt: Mit {{z}} m Zaun – wie groß ist das größte rechteckige Gehege?
    params: { unit: m² }
    answer: { value: "{{(z / 4) ** 2}}" }
    feedback:
      - when: "numval(state.input) == z"
        misconception: perimeter-for-area
        text: Das ist der Umfang. Teile ihn auf vier gleiche Seiten auf.
    hints:
      - "Das größte ist ein Quadrat mit Seite {{z}} : 4."
    explanation: "Seite {{z / 4}} m, Fläche {{(z / 4) ** 2}} m²."
    variants:
      params: { z: "choice[12,20,24,40]" }
      defaults: { z: 20 }

  - kind: explain
    id: s5
    body: Wo begegnet dir so ein Gipfel im Alltag?
    reveal:
      body: Beim Preis eines Produkts. Ist er zu niedrig, verdient man wenig. Ist er zu hoch, kauft keiner. Dazwischen liegt der Gipfel – oft eine Parabel.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Gehege liegt an einer Mauer, nur drei Seiten brauchen Zaun. Du hast 20 m. Wie groß ist die größte Fläche?
    params:
      unit: m²
    answer:
      value: 50
    hints:
      - Bei Tiefe x ist die Breite 20 − 2x. Probier x = 4, 5, 6.
    explanation: "x(20 − 2x) ist bei x = 5 am größten: 5 · 10 = 50. Kein Quadrat mehr!"
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Die Fläche eines Geheges ist A(x) = 4x − x². Schieb den Punkt dorthin, wo die Kurve waagerecht ist: Dort ist die Fläche am größten."
    params:
      scene: tangent
      expr: 4*x - x^2
    answer:
      slope: 0
    explanation: Bei x = 2. Am Gipfel einer Parabel ist die Steigung null.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Eine Parabel ist **symmetrisch** zu ihrem Scheitel. Die Nullstellen von x · (8 − x) sind 0 und 8, also liegt der Gipfel genau in der Mitte bei x = 4. Kein Formelwerk nötig.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Ein Ball fliegt nach $h(t) = 20t - 5t^2$ Metern. Wie hoch kommt er höchstens?
    params:
      unit: m
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 2
        misconception: time-not-height
        text: Das ist der Zeitpunkt, nicht die Höhe. Setz t = 2 ein.
    hints:
      - "Nullstellen: 5t(4 − t) = 0, also t = 0 und t = 4."
      - Der Gipfel liegt in der Mitte bei t = 2.
    explanation: h(2) = 40 − 20 = 20 m.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Zwei Zahlen haben die Summe {{S}}. Wie groß kann ihr Produkt höchstens werden?
    answer:
      value: "{{S * S / 4}}"
    feedback:
      - when: numval(state.input) == S * S / 2
        misconception: halving-error
        text: "Prüf mit gleichen Zahlen: {{S / 2}} · {{S / 2}}."
    hints:
      - "Produkt: x · ({{S}} − x) – eine Parabel."
      - "Der Gipfel liegt in der Mitte: x = {{S / 2}}."
    explanation: "{{S / 2}} · {{S / 2}} = {{S * S / 4}}. Gleich große Zahlen liefern das größte Produkt."
    difficulty: 2
    variants:
      params:
        S: step[10,40,2]
      defaults:
        S: 20

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Bei 10 € kommen 100 Gäste. Jeder Euro mehr vertreibt 5 Gäste. Welcher Preis bringt die höchste Einnahme?
    params:
      unit: €
    answer:
      value: 15
    hints:
      - Einnahme = (10 + x) · (100 − 5x). Die Nullstellen sind x = −10 und x = 20.
    explanation: "Der Scheitel liegt in der Mitte der Nullstellen: x = 5, also 15 €."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Für a, b ≥ 0 gilt $\\sqrt{ab} \\le \\frac{a + b}{2}$. Beweis: $(\\sqrt a - \\sqrt b)^2 \\ge 0$ ausmultiplizieren. Gleichheit nur bei a = b. Diese **AM-GM-Ungleichung** zeigt sofort: Bei festem Umfang ist das Quadrat das größte Rechteck."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Mit 60 m Zaun baust du ein Rechteck, das ein Zaun in der Mitte in zwei Gehege teilt. Der Mittelzaun ist parallel zur Breite x. Wie viele m² Fläche sind höchstens möglich?
    params:
      unit: m²
    answer:
      value: 150
    feedback:
      - when: numval(state.input) == 225
        misconception: no-divider
        text: Das wäre ohne Mittelzaun. Er verbraucht noch eine Breite.
    hints:
      - "Drei Breiten und zwei Längen: 3x + 2y = 60, also y = 30 − 1,5x."
      - A(x) = x(30 − 1,5x) hat Nullstellen 0 und 20.
    explanation: "Gipfel bei x = 10, dann y = 15 und A = 150 m². Jede Zaunrichtung bekommt am Ende gleich viel: 30 m quer, 30 m längs."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist bei festem Umfang das Quadrat das Rechteck mit der größten Fläche?"
    params:
      keywords:
        - - gleich
          - gleich lang
          - equal
          - same
        - - parabel
          - gipfel
          - scheitel
          - parabola
          - peak
          - vertex
          - symmetr
        - - fläche
          - produkt
          - area
          - product
      sample: Bei festem Umfang ist die Fläche x mal (halber Umfang minus x). Das ist eine Parabel mit dem Gipfel genau in der Mitte. Dort sind beide Seiten gleich lang – also ein Quadrat.
    explanation: "Symmetrie der Parabel oder AM-GM: Beide sagen, dass gleiche Seiten das größte Produkt liefern."
    difficulty: 3

srs:
  cards_from: [zaun, gehege]
