id: math.quadratic.optimize
type: concept
title: Das größte Gehege
summary: Parabeln haben einen Gipfel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: gehege
    widget: rect
    prompt: Du hast 16 m Zaun für ein rechteckiges Gehege. Zieh es so, dass die Fläche am größten ist.
    params: { maxW: 8, maxH: 8, w: 1, perimeter: 16 }
    check: { predicate: "area == 16" }
    hints:
      - Probier verschiedene Breiten aus und beobachte die Fläche.
    explanation: 4 × 4 – ein Quadrat – ergibt 16 m². Jedes längliche Rechteck hat weniger.

  - kind: explain
    id: s2
    body: |
      Bei Breite x ist die Länge 8 − x. Die Fläche ist x · (8 − x).
      Das ist eine **Parabel** – sie steigt, erreicht einen Gipfel und fällt wieder.

  - kind: problem
    id: gipfel
    widget: slider
    prompt: Schiebe den Punkt der Parabel y = −(x − s)² + 4 auf den Gipfel bei x = 2.
    params:
      expr: "-(x - s)^2 + 4"
      x: [-2, 6]
      y: [-3, 5]
      sliders: [{ id: s, min: -1, max: 5, step: 0.5, initial: 0 }]
      markers: [{ x: 2, y: 4, label: Gipfel }]
      showCoordinates: false
    answer: { values: { s: 2 } }
    hints:
      - Der Scheitel liegt bei x = s.
    explanation: Mit s = 2 liegt der Gipfel genau bei (2 | 4).

  - kind: problem
    id: zaun
    widget: numeric
    prompt: Mit {{z}} m Zaun – wie groß ist das größte rechteckige Gehege?
    params: { unit: m² }
    answer: { value: "{{(z / 4) ** 2}}" }
    feedback:
      - when: "numval(state.input) == z"
        misconception: perimeter-for-area
        text: Das ist der Umfang. Teile ihn auf vier gleiche Seiten auf.
    hints:
      - "Das größte ist ein Quadrat mit Seite {{z}} : 4."
    explanation: "Seite {{z / 4}} m, Fläche {{(z / 4) ** 2}} m²."
    variants:
      params: { z: "choice[12,20,24,40]" }
      defaults: { z: 20 }

  - kind: explain
    id: s5
    body: Wo begegnet dir so ein Gipfel im Alltag?
    reveal:
      body: Beim Preis eines Produkts. Ist er zu niedrig, verdient man wenig. Ist er zu hoch, kauft keiner. Dazwischen liegt der Gipfel – oft eine Parabel.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Gehege liegt an einer Mauer, nur drei Seiten brauchen Zaun. Du hast 20 m. Wie groß ist die größte Fläche?
    params:
      unit: m²
    answer:
      value: 50
    hints:
      - Bei Tiefe x ist die Breite 20 − 2x. Probier x = 4, 5, 6.
    explanation: "x(20 − 2x) ist bei x = 5 am größten: 5 · 10 = 50. Kein Quadrat mehr!"
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Die Fläche eines Geheges ist A(x) = 4x − x². Schieb den Punkt dorthin, wo die Kurve waagerecht ist: Dort ist die Fläche am größten."
    params:
      scene: tangent
      expr: 4*x - x^2
    answer:
      slope: 0
    explanation: Bei x = 2. Am Gipfel einer Parabel ist die Steigung null.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Bei 10 € kommen 100 Gäste. Jeder Euro mehr vertreibt 5 Gäste. Welcher Preis bringt die höchste Einnahme?
    params:
      unit: €
    answer:
      value: 15
    hints:
      - Einnahme = (10 + x) · (100 − 5x). Die Nullstellen sind x = −10 und x = 20.
    explanation: "Der Scheitel liegt in der Mitte der Nullstellen: x = 5, also 15 €."
    difficulty: 3

srs:
  cards_from: [zaun, gehege]
