id: math.quadratic.formula
type: concept
title: The solution formula
summary: For every quadratic equation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: How many solutions does x² = 9 have?
    params:
      options:
        - label: "Two: 3 and −3"
          correct: true
        - label: "One: 3"
          feedback: (−3) · (−3) is 9 as well.
        - label: None
          feedback: 3 · 3 = 9.
    hints:
      - Minus times minus gives plus.
    explanation: Two solutions are normal for squares. One formula gives both at once.

  - kind: explain
    id: s1
    body: |
      For x² + px + q = 0, the **pq-formula** applies:
      $x = -\frac{p}{2} \pm \sqrt{\left(\frac{p}{2}\right)^2 - q}$

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: Solve x² − 6x + 8 = 0. Enter the larger solution.
    params: { placeholder: "x" }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: smaller-root
        text: That is the smaller solution. You need the larger one.
    hints:
      - p = −6, q = 8. So 3 ± $\sqrt{9 - 8}$.
    explanation: 3 ± 1, so x = 4 or x = 2.

  - kind: problem
    id: variante
    widget: numeric
    prompt: "Solve x² − {{r + s}}x + {{r * s}} = 0. Enter the larger solution."
    params: { placeholder: "x" }
    answer: { value: "{{max(r, s)}}" }
    hints:
      - "−p/2 = {{(r + s) / 2}}. Then ± the root."
    explanation: "The solutions are {{r}} and {{s}}."
    variants:
      params: { r: "int[1,6]", s: "int[7,12]" }
      defaults: { r: 2, s: 9 }

  - kind: problem
    id: diskriminante
    widget: choice
    prompt: There is a negative number under the root. How many solutions are there?
    params:
      options:
        - { label: No real solution, correct: true }
        - { label: Two, feedback: "You cannot take a real root of a negative number." }
        - { label: One, feedback: "There is exactly one when the value under the root is 0." }
    hints:
      - Which number times itself is negative?
    explanation: The parabola then does not touch the x-axis at all.

  - kind: problem
    id: probe
    widget: choice
    prompt: How can you quickly check whether x = 3 solves x² − 5x + 6 = 0?
    params:
      options:
        - { label: "Plug it in, 9 − 15 + 6 = 0", correct: true }
        - { label: Work out the formula again, feedback: "That works too, but plugging in is faster." }
    hints:
      - Put 3 in place of x.
    explanation: 9 − 15 + 6 = 0. The check works out.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: x² − 4 = 0
          right: true
        - text: x² + 4 = 0
          right: false
        - text: x² − 2x + 1 = 0
          right: true
          why: "Exactly one: (x − 1)² = 0."
        - text: x² + x + 1 = 0
          right: false
          why: Under the root is 1/4 − 1 – negative.
      left: No solution
      right: Has solutions

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The **discriminant** of $x^2 + 6x + 9 = 0$ is $(p/2)^2 - q$. What is it?
    answer:
      value: 0
    hints:
      - (6/2)² − 9.
    explanation: "9 − 9 = 0: exactly one solution, x = −3. Positive would mean two, negative none."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: The **discriminant** $D = \left(\frac p2\right)^2 - q$ sits under the square root. If it is positive there are two solutions, if zero one, if negative no real one.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: buckets
    prompt: How many real solutions does the equation have?
    params:
      buckets:
        - id: b1
          label: None
        - id: b2
          label: One
        - id: b3
          label: Two
      items:
        - label: x² + 4 = 0
          bucket: b1
        - label: x² + x + 1 = 0
          bucket: b1
        - label: x² − 4x + 4 = 0
          bucket: b2
        - label: x² + 6x + 9 = 0
          bucket: b2
        - label: x² − 5x + 6 = 0
          bucket: b3
        - label: 2x² − 8 = 0
          bucket: b3
    hints:
      - Compute (p/2)² − q for each.
      - x² − 4x + 4 = (x − 2)², so D = 0.
    explanation: "D < 0: x² + 4 and x² + x + 1. D = 0: the two perfect squares. D > 0: x² − 5x + 6 (roots 2, 3) and 2x² − 8 (±2)."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Solve $2x^2 - 3x - 2 = 0$. Divide by 2 first or use $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$. Give the larger solution.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == -0.5
        misconception: smaller-root
        text: That is the smaller solution.
      - when: numval(state.input) == 4
        misconception: no-denominator
        text: Do not forget the denominator 2a = 4.
    hints:
      - b² − 4ac = 9 + 16 = 25.
      - x = (3 ± 5) / 4.
    explanation: "x = 8 / 4 = 2 or x = −2 / 4 = −0.5. Check: 8 − 6 − 2 = 0."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Where does the pq formula come from? Order the derivation for $x^2 + px + q = 0$.
    params:
      items:
        - label: $x^2 + px = -q$
        - label: $x^2 + px + (p/2)^2 = (p/2)^2 - q$
        - label: $(x + p/2)^2 = (p/2)^2 - q$
        - label: $x + p/2 = \pm\sqrt{(p/2)^2 - q}$
    hints:
      - First move q away, then complete the square.
    explanation: The formula is just **completing the square**, done once for all equations.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Solve $x^2 - 2x + 5 = 0$ with complex numbers, where $i^2 = -1$. The solutions are a ± bi. What is a?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 2
        misconception: imaginary-part
        text: That is b, the part in front of i.
    hints:
      - "Quadratic formula: x = 1 ± √(1 − 5) = 1 ± √(−4)."
      - √(−4) = 2i.
    explanation: x = 1 ± 2i. With complex numbers every quadratic has exactly two solutions, counting doubles. This is a case of the fundamental theorem of algebra.
    difficulty: 3

  - kind: explain
    id: mb-x2
    depth: 3
    body: "For equations of degree three and four, Cardano and Ferrari found similar formulas around 1545. For degree 5 Abel proved in 1824: there is no **general formula** using roots. Galois later explained why – with groups."

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: what does the discriminant tell you before you even solve?"
    params:
      keywords:
        - - wurzel
          - unter der wurzel
          - square root
          - root
        - - anzahl
          - wie viele
          - number
          - how many
        - - negativ
          - positiv
          - "null"
          - negative
          - positive
          - zero
      sample: The discriminant sits under the square root of the formula. If it is positive there are two solutions, if zero one, if negative no real one. So it tells you the number of solutions.
    explanation: "In the picture: the discriminant says whether the parabola crosses the x-axis twice, touches it or misses it."
    difficulty: 3

srs:
  cards_from: [variante, diskriminante]
