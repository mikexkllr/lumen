id: bio.nerves.signal
type: concept
title: "Aktionspotenzial und Synapse"
summary: "Wie Ionen Strom machen und Botenstoffe ihn übergeben."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Übergabe am Spalt
    body: Zwischen zwei Nervenzellen klafft ein winziger Spalt. Trotzdem springt das Signal in weniger als einer Millisekunde hinüber. Deck auf, wie die **Synapse** das schafft – und sich gleich wieder bereit macht.
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: ⚡
            front: Das Signal kommt an
            back: Ein elektrischer Puls erreicht das Ende der Nervenzelle.
          - icon: 🫧
            front: Bläschen platzen
            back: Winzige Bläschen schütten Botenstoffe in den Spalt.
          - icon: 🔑
            front: Andocken
            back: Die Botenstoffe passen an die nächste Zelle. Dort startet ein neues Signal.
          - icon: ♻️
            front: Aufräumen
            back: Die Botenstoffe werden abgebaut oder zurückgeholt. Der Spalt ist frei für das nächste Signal.

  - kind: problem
    id: hook
    widget: choice
    prompt: Ein leichter und ein starker Druck auf die Haut. Wie unterscheidet die Nervenzelle sie?
    params:
      options:
        - label: Bei starkem Druck feuert sie öfter pro Sekunde.
          correct: true
        - label: Bei starkem Druck sind die Signale größer.
          feedback: Jedes Signal ist gleich groß. Es zählt, wie oft.
        - label: Gar nicht.
          feedback: Du spürst den Unterschied – also muss er codiert sein.
    hints:
      - Nervensignale sind wie Morsezeichen.
      - Lauter heißt hier schneller hintereinander.
    explanation: Nervenimpulse folgen dem Alles-oder-nichts-Prinzip. Die Stärke steckt in der Frequenz.

  - kind: explain
    id: c1
    body: In Ruhe ist eine Nervenzelle innen negativ, etwa −70 mV. Kommt ein starker Reiz, öffnen sich Kanäle. Natrium-Ionen strömen hinein, innen wird es kurz positiv. Dieser Spannungsstoß heißt **Aktionspotenzial**.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne die Schritte eines Aktionspotenzials.
    params:
      items:
        - label: Ruhe bei −70 mV
        - label: Reiz erreicht die Schwelle
        - label: Na⁺-Kanäle öffnen, Na⁺ strömt ein
        - label: Innen wird es positiv
        - label: K⁺ strömt aus, Spannung sinkt
    hints:
      - Erst muss eine Schwelle erreicht werden.
      - Natrium rein macht positiv, Kalium raus macht wieder negativ.
    explanation: Das Ganze dauert etwa eine Millisekunde. Dann setzt die Pumpe die Ionen zurück.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Die Spannung springt von −70 mV auf +30 mV. Um wie viele Millivolt ändert sie sich?
    params:
      unit: mV
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 40
        misconception: sign-error
        text: "Vom Negativen ins Positive: Die Strecke über null zählt doppelt mit."
      - when: numval(state.input) == -40
        misconception: sign-error2
        text: "Rechne den Abstand: 30 − (−70)."
    hints:
      - Von −70 bis 0, dann von 0 bis 30.
      - 70 + 30
    explanation: 30 − (−70) = 100 mV in einer Millisekunde.

  - kind: explain
    id: c4
    body: An der **Synapse** berühren sich zwei Zellen nicht. Dazwischen liegt ein winziger Spalt. Das Signal schüttet Botenstoffe aus. Sie schwimmen hinüber und docken an der nächsten Zelle an.

  - kind: problem
    id: d1
    depth: 2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Am Ende des Axons setzt das Signal [[Botenstoffe]] frei. Sie wandern durch den [[Spalt]] und binden an [[Rezeptoren]] der nächsten Zelle.
      distractors:
        - Blut
        - Myelin
    explanation: Elektrisch in der Zelle, chemisch zwischen den Zellen.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: buckets
    prompt: Wie wirkt der Stoff an der Synapse?
    params:
      buckets:
        - id: b1
          label: blockiert Rezeptoren
        - id: b2
          label: verlängert die Wirkung
      items:
        - label: Pfeilgift Curare
          bucket: b1
        - label: Nervengift Sarin
          bucket: b2
        - label: Antidepressivum (SSRI)
          bucket: b2
    hints:
      - Curare lähmt, weil der Muskel kein Signal bekommt.
      - Sarin verhindert den Abbau des Botenstoffs, SSRI seine Wiederaufnahme.
    explanation: Wer den Rezeptor blockiert, stoppt das Signal. Wer Abbau oder Rückholung bremst, lässt den Botenstoff länger wirken.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Warum laufen Signale an einer Synapse nur in eine Richtung?
    params:
      options:
        - label: Nur die eine Seite schüttet Botenstoffe aus, nur die andere hat Rezeptoren.
          correct: true
        - label: Der Spalt hat ein Ventil.
          feedback: Es gibt kein Ventil, nur ungleich verteilte Werkzeuge.
        - label: Sie laufen in beide Richtungen.
          feedback: Dann gäbe es Durcheinander. Die Synapse ist eine Einbahnstraße.
    hints:
      - Wer sendet, wer empfängt?
      - Bläschen mit Botenstoffen gibt es nur vor dem Spalt.
    explanation: Die Synapse ist eine Einbahnstraße. Das gibt dem Nervensystem eine klare Signalrichtung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum bleibt ein schwacher Reiz unter der Schwelle ganz ohne Aktionspotenzial – statt ein kleines auszulösen?
    params:
      options:
        - label: Erst ab der Schwelle öffnen sich genug Na⁺-Kanäle, die sich dann gegenseitig aufschaukeln.
          correct: true
        - label: Die Zelle spart Energie, wenn sie will.
          feedback: Die Zelle entscheidet nicht. Es ist eine Rückkopplung.
        - label: Kleine Aktionspotenziale gibt es doch.
          feedback: Unter der Schwelle gibt es nur kleine Spannungen, die ausklingen.
    hints:
      - Na⁺-Kanäle öffnen sich, wenn die Spannung steigt.
      - Einströmendes Na⁺ hebt die Spannung weiter an.
    explanation: "Positive Rückkopplung: Mehr Spannung öffnet mehr Kanäle, die mehr Spannung machen. Über der Schwelle läuft das von selbst – alles oder nichts."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was bei einem Aktionspotenzial passiert.
    params:
      keywords:
        - - natrium
          - na+
          - na⁺
          - sodium
        - - kalium
          - k+
          - k⁺
          - potassium
        - - schwelle
          - threshold
        - - negativ
          - positiv
          - "-70"
          - −70
          - negative
          - positive
      sample: In Ruhe ist die Zelle innen negativ, etwa −70 mV. Erreicht ein Reiz die Schwelle, strömt Natrium ein, und innen wird es positiv. Dann strömt Kalium aus, und die Spannung kehrt zurück.
    explanation: Ionen rein, Ionen raus – ein elektrischer Puls aus Chemie.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
