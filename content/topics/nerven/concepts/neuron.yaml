id: bio.nerves.neuron
type: concept
title: "Die Nervenzelle"
summary: "Dendriten, Axon und schnelle Leitung."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: Wie viele Nervenzellen hat dein Gehirn? Schätz mal – in Milliarden.
    params:
      min: 1
      max: 10000
      scale: log
      unit: Milliarden
    answer:
      value: 86
      within: 40
    explanation: Rund 86 Milliarden – etwa zehnmal so viele, wie Menschen auf der Erde leben.

  - kind: explain
    id: c1
    body: Eine **Nervenzelle**, auch Neuron, leitet elektrische Signale. Mit ihren Dendriten empfängt sie Signale. Über einen langen Fortsatz, das Axon, schickt sie sie weiter. Am Ende liegen Synapsen zur nächsten Zelle.

  - kind: problem
    id: c2
    widget: match
    prompt: Welcher Teil hat welche Aufgabe?
    params:
      pairs:
        - left: Dendriten
          right: Signale empfangen
        - left: Zellkörper
          right: Signale sammeln
        - left: Axon
          right: Signal weiterleiten
        - left: Synapse
          right: Signal übergeben
    hints:
      - Dendriten sind verzweigt wie Antennen.
      - Das Axon ist ein langes Kabel.
    explanation: Empfangen, sammeln, leiten, übergeben – eine Nervenzelle arbeitet wie ein Staffellauf.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Signal läuft mit {{v}} m/s vom Zeh zum Rückenmark, 1 m weit. Wie viele Millisekunden dauert das?
    params:
      unit: ms
    answer:
      value: "{{1000 / v}}"
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 1 / v
        misconception: units
        text: Das sind Sekunden. Mal 1000 für Millisekunden.
    hints:
      - "Zeit = Weg : Tempo."
      - "1 m : {{v}} m/s, dann in ms umrechnen."
    explanation: "1 : {{v}} s = {{1000 / v}} ms. Schnell – aber nicht sofort."
    variants:
      params:
        v: choice[50,80,100,125]
      defaults:
        v: 100

  - kind: problem
    id: c4
    widget: choice
    prompt: Das längste Axon in deinem Körper reicht vom Rückenmark bis in den großen Zeh. Wie lang ist es etwa?
    params:
      options:
        - label: Rund 1 Meter
          correct: true
        - label: Rund 1 Millimeter
          feedback: Viele Axone sind kurz, aber dieses reicht durch das ganze Bein.
        - label: Rund 1 Zentimeter
          feedback: "Zu kurz: vom Rücken bis zum Fuß ist es viel weiter."
    hints:
      - Eine Zelle, ein Fortsatz, vom Rücken bis zum Fuß.
      - Miss dein Bein.
    explanation: Eine einzige Zelle kann einen Meter lang sein. Ihr Zellkörper sitzt im Rückenmark.

  - kind: explain
    id: d1
    depth: 2
    body: Viele Axone sind mit einer Fettschicht umwickelt, der **Myelinscheide**. Sie isoliert wie Plastik um ein Kabel. Das Signal springt von Lücke zu Lücke. So wird es bis zu 100-mal schneller.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ohne Myelin läuft ein Signal etwa 1 m/s, mit Myelin bis zu 100 m/s. Wie lange braucht ein Signal ohne Myelin für 1 m?
    params:
      unit: s
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 0.01
        misconception: swapped
        text: Das ist die Zeit mit Myelin.
    hints:
      - "Zeit = Weg : Tempo."
      - "1 m : 1 m/s"
    explanation: Eine ganze Sekunde statt 10 ms! Für schnelle Bewegungen wäre das viel zu langsam.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Mit oder ohne Myelin – was passt?
    params:
      buckets:
        - id: b1
          label: mit Myelin
        - id: b2
          label: ohne Myelin
      items:
        - label: Signal springt
          bucket: b1
        - label: Bis 100 m/s
          bucket: b1
        - label: Etwa 1 m/s
          bucket: b2
        - label: Signal kriecht
          bucket: b2
    hints:
      - Isolation macht schnell.
      - Ohne Isolation muss jedes Stück einzeln erregt werden.
    explanation: Myelin lässt das Signal von Lücke zu Lücke springen. Ohne Myelin wandert es Stück für Stück.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei Multipler Sklerose greift das Immunsystem die Myelinscheiden an. Was erwartest du?
    params:
      options:
        - label: "Signale werden langsamer oder fallen aus: Taubheit, Sehstörungen, Schwäche."
          correct: true
        - label: Die Nerven werden schneller.
          feedback: Ohne Isolation leiten sie schlechter.
        - label: Nur die Haut ist betroffen.
          feedback: Myelin gibt es im Gehirn, Rückenmark und vielen Nerven.
    hints:
      - Was macht Myelin?
      - Eine kaputte Isolierung stört das Kabel.
    explanation: Ohne Myelin springt das Signal nicht mehr. Je nach Ort der Schäden fallen andere Funktionen aus.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Im Kleinhirn sitzen rund 69 der 86 Milliarden Nervenzellen. Doch es ist viel kleiner als das Großhirn. Wie geht das?
    params:
      options:
        - label: Es besteht aus winzigen, dicht gepackten Körnerzellen.
          correct: true
        - label: Die Zahl ist falsch.
          feedback: "Zählungen bestätigen: Das Kleinhirn hat etwa 80 % aller Neuronen."
        - label: Seine Zellen haben keinen Zellkern.
          feedback: Neuronen haben immer einen Kern.
    hints:
      - Masse hängt auch von der Größe der Zellen ab.
      - Das Großhirn hat viel Myelin und Verbindungen.
    explanation: Das Großhirn besteht zu einem großen Teil aus Myelin-Kabeln. Das Kleinhirn ist dichter gepackt – Größe ist nicht gleich Zellzahl.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Nervenzelle ein Signal weitergibt.
    params:
      keywords:
        - - dendrit
        - - axon
        - - synapse
        - - elektr
          - signal
          - electric
        - - myelin
          - schnell
          - fast
      sample: Die Dendriten empfangen Signale. Das elektrische Signal läuft dann das Axon entlang, mit Myelin besonders schnell. An der Synapse wird es an die nächste Zelle übergeben.
    explanation: Empfangen, leiten, übergeben – und Myelin als Turbo.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
