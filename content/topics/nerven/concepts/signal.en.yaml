id: bio.nerves.signal
type: concept
title: "Action potential and synapse"
summary: "How ions make current and messengers pass it on."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A light press and a strong press on the skin. How does the nerve cell tell them apart?
    params:
      options:
        - label: With strong pressure it fires more often per second.
          correct: true
        - label: With strong pressure the signals are bigger.
          feedback: Every signal is the same size. What counts is how often.
        - label: It cannot.
          feedback: You feel the difference – so it must be coded.
    hints:
      - Nerve signals are like Morse code.
      - Louder here means faster in a row.
    explanation: Nerve impulses follow the all-or-nothing principle. Strength is coded in frequency.

  - kind: explain
    id: c1
    body: At rest a nerve cell is negative inside, about −70 mV. When a strong stimulus comes, channels open. Sodium ions rush in and the inside briefly turns positive. This voltage spike is called an **action potential**.

  - kind: problem
    id: c2
    widget: order
    prompt: Order the steps of an action potential.
    params:
      items:
        - label: Rest at −70 mV
        - label: Stimulus reaches threshold
        - label: Na⁺ channels open, Na⁺ flows in
        - label: Inside turns positive
        - label: K⁺ flows out, voltage falls
    hints:
      - First a threshold must be reached.
      - Sodium in makes it positive, potassium out makes it negative again.
    explanation: The whole thing takes about a millisecond. Then the pump resets the ions.

  - kind: problem
    id: c3
    widget: numeric
    prompt: The voltage jumps from −70 mV to +30 mV. By how many millivolts does it change?
    params:
      unit: mV
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 40
        misconception: sign-error
        text: "From negative to positive: count the distance on both sides of zero."
      - when: numval(state.input) == -40
        misconception: sign-error2
        text: "Work out the distance: 30 − (−70)."
    hints:
      - From −70 to 0, then from 0 to 30.
      - 70 + 30
    explanation: 30 − (−70) = 100 mV within a millisecond.

  - kind: explain
    id: c4
    body: At a **synapse** two cells do not touch. A tiny gap lies between them. The signal releases messenger chemicals. They drift across and dock onto the next cell.

  - kind: problem
    id: d1
    depth: 2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: At the end of the axon the signal releases [[neurotransmitters]]. They cross the [[gap]] and bind to [[receptors]] on the next cell.
      distractors:
        - blood
        - myelin
    explanation: Electrical inside the cell, chemical between cells.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: buckets
    prompt: How does the substance act at the synapse?
    params:
      buckets:
        - id: b1
          label: blocks receptors
        - id: b2
          label: prolongs the effect
      items:
        - label: Arrow poison curare
          bucket: b1
        - label: Nerve agent sarin
          bucket: b2
        - label: Antidepressant (SSRI)
          bucket: b2
    hints:
      - Curare paralyses because the muscle gets no signal.
      - Sarin stops the messenger from being broken down, SSRIs stop its reuptake.
    explanation: Blocking the receptor stops the signal. Slowing breakdown or reuptake lets the messenger act longer.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Why do signals cross a synapse in one direction only?
    params:
      options:
        - label: Only one side releases messengers, only the other has receptors.
          correct: true
        - label: The gap has a valve.
          feedback: There is no valve, only unevenly placed tools.
        - label: They run both ways.
          feedback: That would cause chaos. The synapse is a one-way street.
    hints:
      - Who sends, who receives?
      - Vesicles with messengers exist only before the gap.
    explanation: The synapse is a one-way street. That gives the nervous system a clear signal direction.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does a weak stimulus below threshold trigger no action potential at all – rather than a small one?
    params:
      options:
        - label: Only at threshold do enough Na⁺ channels open, and then they boost each other.
          correct: true
        - label: The cell saves energy when it wants to.
          feedback: The cell does not decide. It is a feedback loop.
        - label: Small action potentials do exist.
          feedback: Below threshold there are only small voltages that fade away.
    hints:
      - Na⁺ channels open when the voltage rises.
      - Inflowing Na⁺ raises the voltage further.
    explanation: "Positive feedback: more voltage opens more channels, which make more voltage. Above threshold it runs by itself – all or nothing."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what happens in an action potential.
    params:
      keywords:
        - - natrium
          - na+
          - na⁺
          - sodium
        - - kalium
          - k+
          - k⁺
          - potassium
        - - schwelle
          - threshold
        - - negativ
          - positiv
          - "-70"
          - −70
          - negative
          - positive
      sample: At rest the cell is negative inside, about −70 mV. When a stimulus reaches the threshold, sodium flows in and the inside turns positive. Then potassium flows out and the voltage returns.
    explanation: Ions in, ions out – an electrical pulse made of chemistry.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
