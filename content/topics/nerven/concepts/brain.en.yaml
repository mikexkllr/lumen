id: bio.nerves.brain
type: concept
title: "Brain and learning"
summary: "Brain regions, myths and plasticity."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: swipe
    prompt: "Brain myths: true or false?"
    params:
      cards:
        - text: We only use 10 % of our brain.
          right: false
          why: "Scans show: all regions are active over the day."
        - text: The brain changes through learning.
          right: true
          why: Synapses get stronger, weaker or newly formed.
        - text: The brain cannot feel, but it hurts when touched.
          right: false
          why: The brain itself has no pain receptors.
        - text: Sleep helps learning.
          right: true
          why: Memories are consolidated during sleep.
    explanation: The brain is fully in use and constantly rebuilding itself.

  - kind: explain
    id: c1
    body: The brain has regions with different jobs. The **cerebrum** handles thinking, language and deliberate movement. The cerebellum fine-tunes movement. The brainstem controls breathing and heartbeat.

  - kind: problem
    id: c2
    widget: match
    prompt: Which region does what?
    params:
      pairs:
        - left: Cerebrum
          right: Thinking and language
        - left: Cerebellum
          right: Balance
        - left: Brainstem
          right: Breathing
        - left: Hippocampus
          right: New memories
    hints:
      - What keeps running in sleep?
      - "Drunk people sway: the cerebellum is affected."
    explanation: Vital functions lie deep, thinking lies on the outside. But all regions work together as a network.

  - kind: problem
    id: c3
    widget: choice
    prompt: A person has a stroke in the left half of the cerebrum. Which side of the body is more likely paralysed?
    params:
      options:
        - label: The right
          correct: true
        - label: The left
          feedback: The nerve pathways cross sides on their way to the body.
        - label: Both equally
          feedback: Each half mainly controls the opposite side.
    hints:
      - The pathways cross in the brainstem.
      - Left controls right.
    explanation: The left hemisphere controls the right side of the body. Speech is often affected too, as it usually sits on the left.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[cerebrum]] thinks and speaks. The [[cerebellum]] keeps your balance. The [[brainstem]] controls breathing and heartbeat.
      distractors:
        - spinal cord
        - axon
    explanation: Three big parts, three jobs – from the conscious to the vital.

  - kind: explain
    id: d1
    depth: 2
    body: 'The brain rewires itself through experience. Synapses that are often active together grow stronger. In short: "Cells that fire together wire together." This ability is called **plasticity**.'

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: London taxi drivers spend years learning the street network. What did researchers find in their brains?
    params:
      options:
        - label: Part of the hippocampus was larger than in other people.
          correct: true
        - label: Nothing – adult brains do not change.
          feedback: Plasticity lasts a lifetime.
        - label: The whole brain was twice as big.
          feedback: The change was measurable, but small and local.
    hints:
      - Which region helps with navigation and memory?
      - Training shapes the region you use.
    explanation: The rear hippocampus was enlarged – the more so, the longer someone had driven.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: estimate
    prompt: About how many synapses does the human brain have?
    params:
      min: 1000000000
      max: 10000000000000000
      scale: log
    answer:
      value: 100000000000000
      within: 80
    explanation: Roughly 100 trillion – each nerve cell has thousands of connections on average.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A neuron fires at most about {{f}} times a second. A thought takes half a second. At most how many steps in a row fit into it?
    answer:
      value: "{{f / 2}}"
    feedback:
      - when: numval(state.input) == f * 2
        misconception: inverse
        text: Half a second is less than one. Divide by 2.
    hints:
      - Firing rate times time.
      - "{{f}} × 0.5"
    explanation: Only about {{f / 2}} steps! So the brain must work massively in parallel – billions of cells at once, not one after another.
    difficulty: 3
    variants:
      params:
        f: choice[100,200,400]
      defaults:
        f: 200

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how the brain changes when you learn.
    params:
      keywords:
        - - synapse
        - - stärker
          - staerker
          - verstärk
          - verstaerk
          - stronger
          - strengthen
        - - plastiz
          - plastic
          - umbau
          - rewir
        - - übung
          - uebung
          - wiederhol
          - oft
          - practice
          - repeat
          - often
      sample: When you learn, synapses that are often active together get stronger. Practice and repetition rewire the network. This plasticity lasts a lifetime.
    explanation: Learning is rebuilding connections.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
