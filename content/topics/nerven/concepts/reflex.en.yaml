id: bio.nerves.reflex
type: concept
title: "Reflexes and senses"
summary: "From stimulus to response, with and without the brain."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: More than five senses
    body: Sight, hearing, smell, taste, touch – that is far from all. Your senses constantly tell your body what is going on. Uncover the cards and discover amazing **sensory cells**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧭
            front: Which way is up?
            back: In your inner ear, tiny crystals report how your head is tilted.
          - icon: 👃
            front: Eyes shut, finger to nose
            back: "Works even blind: your body always senses where each limb is."
          - icon: ✨
            front: A single particle of light
            back: Some sensory cells in the eye respond to a single photon.
          - icon: 🤭
            front: Tickle yourself!
            back: "Hardly works: your brain predicts the touch and dampens it."

  - kind: problem
    id: hook
    widget: choice
    prompt: You touch a hot stove. Your hand jerks back before you feel the pain. How?
    params:
      options:
        - label: The spinal cord switches directly, without waiting for the brain.
          correct: true
        - label: The hand thinks for itself.
          feedback: Muscles do not think. The shortcut runs through the spinal cord.
        - label: The brain is faster than pain.
          feedback: The brain is informed only afterwards.
    hints:
      - The route to the brain is longer than the one to the spinal cord.
      - Protective reactions need a shortcut.
    explanation: A reflex is a shortcut. The brain only learns afterwards what happened.

  - kind: explain
    id: c1
    body: A **reflex** is a fast, automatic response. A sensory receptor reports the stimulus. The signal runs into the spinal cord and straight back out to a muscle. This route is called a reflex arc.

  - kind: problem
    id: c2
    widget: order
    prompt: Order the knee-jerk reflex.
    params:
      items:
        - label: Hammer hits the tendon
        - label: Stretch receptor in the muscle reports
        - label: Sensory neuron carries signal to the spinal cord
        - label: Motor neuron carries signal to the muscle
        - label: Thigh muscle contracts
    hints:
      - First stimulus, then report, then command.
      - Sensory means inward, motor means outward.
    explanation: "Just two nerve cells and one synapse: that is why this reflex is so fast."

  - kind: problem
    id: c3
    widget: numeric
    prompt: "Reaction test: a friend drops a ruler and you catch it after {{d}} cm. The fall time is t = √(2d/g) with g = 9.81 m/s². How many seconds did you take? Round to two decimals."
    params:
      unit: s
    answer:
      value: "{{round(100 * sqrt(2 * d / 100 / 9.81)) / 100}}"
      tolerance: 0.01
    hints:
      - "Convert d to metres: {{d / 100}} m."
      - √(2 × {{d / 100}} ÷ 9.81)
    explanation: t ≈ {{round(100 * sqrt(2 * d / 100 / 9.81)) / 100}} s. About 0.2 s is typical – much slower than a reflex.
    variants:
      params:
        d: choice[10,15,20,25]
      defaults:
        d: 20

  - kind: problem
    id: c4
    widget: buckets
    prompt: Reflex or conscious action?
    params:
      buckets:
        - id: b1
          label: Reflex
        - id: b2
          label: conscious
      items:
        - label: Blinking at a fly
          bucket: b1
        - label: Coughing at crumbs
          bucket: b1
        - label: Pupil shrinks in light
          bucket: b1
        - label: Catching a ball
          bucket: b2
        - label: Typing a text
          bucket: b2
    hints:
      - Do you have to think about it?
      - Reflexes are inborn and always the same.
    explanation: Reflexes protect and run without thinking. Conscious action needs the cerebrum.

  - kind: explain
    id: d1
    depth: 2
    body: Sensory cells translate stimuli into nerve signals. The eye has two kinds of **photoreceptors**. Rods see light and dark, even in dim light. Cones see colours – there are three types for red, green and blue.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: At night you hardly see colours, only shades of grey. Why?
    params:
      options:
        - label: In dim light almost only the rods work, and they do not see colour.
          correct: true
        - label: There are no colours at night.
          feedback: The colours are there – the cones just need more light.
        - label: The cones are asleep.
          feedback: Cones do not sleep. They are less sensitive to light.
    hints:
      - Which cells are more sensitive?
      - Rods only know light and dark.
    explanation: Rods are very light-sensitive but colour-blind. That is why all cats are grey at night.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: match
    prompt: Which receptor reports which stimulus?
    params:
      pairs:
        - left: Cones in the eye
          right: Colour
        - left: Hair cells in the ear
          right: Sound
        - left: Smell cells
          right: Odours
        - left: Skin heat receptor
          right: Temperature
    hints:
      - Each sensory cell specialises in one kind of stimulus.
      - Hair cells bend with vibrations.
    explanation: "In the end all senses speak the same language: action potentials. Only the brain turns them into colour or sound."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Each eye has a blind spot without receptors. Why don’t you see a hole in the picture?
    params:
      options:
        - label: The brain fills the gap from the surroundings and with the other eye.
          correct: true
        - label: The spot is too small to matter.
          feedback: It is bigger than the full moon in the sky.
        - label: The eye moves so fast.
          feedback: Even with a steady gaze you see no hole.
    hints:
      - Where does the optic nerve leave the eye?
      - Seeing is reconstruction in the brain.
    explanation: Perception is a model of the world that the brain builds. Optical illusions show where it guesses.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a reflex arc works and why it is so fast.
    params:
      keywords:
        - - rezeptor
          - receptor
          - sinnes
          - sensor
        - - rückenmark
          - rueckenmark
          - spinal
        - - muskel
          - muscle
        - - gehirn
          - brain
          - ohne nachdenk
          - without think
      sample: A receptor reports the stimulus via a neuron to the spinal cord. There the signal is switched straight onto a neuron to the muscle. Because the brain is not in between, it is very fast.
    explanation: Short route, few synapses, no thinking.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
