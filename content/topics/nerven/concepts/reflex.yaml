id: bio.nerves.reflex
type: concept
title: "Reflexe und Sinne"
summary: "Vom Reiz zur Reaktion, mit und ohne Gehirn."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du fasst auf eine heiße Herdplatte. Deine Hand zuckt zurück, bevor du den Schmerz spürst. Wie geht das?
    params:
      options:
        - label: Das Rückenmark schaltet direkt um, ohne auf das Gehirn zu warten.
          correct: true
        - label: Die Hand denkt selbst.
          feedback: Muskeln denken nicht. Die Abkürzung läuft übers Rückenmark.
        - label: Das Gehirn ist schneller als der Schmerz.
          feedback: Das Gehirn wird erst danach informiert.
    hints:
      - Der Weg zum Gehirn ist länger als der zum Rückenmark.
      - Schutzreaktionen brauchen eine Abkürzung.
    explanation: Ein Reflex ist eine Abkürzung. Das Gehirn erfährt erst danach, was passiert ist.

  - kind: explain
    id: c1
    body: Ein **Reflex** ist eine schnelle, automatische Reaktion. Ein Sinnesrezeptor meldet den Reiz. Das Signal läuft ins Rückenmark und dort direkt zu einem Muskel zurück. Dieser Weg heißt Reflexbogen.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne den Kniesehnenreflex.
    params:
      items:
        - label: Hammer trifft die Sehne
        - label: Dehnungsrezeptor im Muskel meldet
        - label: Sensorisches Neuron leitet ins Rückenmark
        - label: Motorisches Neuron leitet zum Muskel
        - label: Oberschenkelmuskel zieht sich zusammen
    hints:
      - Erst Reiz, dann Meldung, dann Befehl.
      - Sensorisch heißt hin, motorisch heißt zurück.
    explanation: "Nur zwei Nervenzellen und eine Synapse: Darum ist dieser Reflex so schnell."

  - kind: problem
    id: c3
    widget: numeric
    prompt: "Reaktionstest: Ein Freund lässt ein Lineal fallen, du fängst es nach {{d}} cm. Die Fallzeit ist t = √(2d/g) mit g = 9,81 m/s². Wie viele Sekunden hast du gebraucht? Runde auf zwei Stellen."
    params:
      unit: s
    answer:
      value: "{{round(100 * sqrt(2 * d / 100 / 9.81)) / 100}}"
      tolerance: 0.01
    hints:
      - "Rechne d in Meter um: {{d / 100}} m."
      - "√(2 · {{d / 100}} : 9,81)"
    explanation: t ≈ {{round(100 * sqrt(2 * d / 100 / 9.81)) / 100}} s. Typisch sind etwa 0,2 s – viel langsamer als ein Reflex.
    variants:
      params:
        d: choice[10,15,20,25]
      defaults:
        d: 20

  - kind: problem
    id: c4
    widget: buckets
    prompt: Reflex oder bewusste Handlung?
    params:
      buckets:
        - id: b1
          label: Reflex
        - id: b2
          label: bewusst
      items:
        - label: Lidschlag bei einer Fliege
          bucket: b1
        - label: Husten bei Krümeln
          bucket: b1
        - label: Pupille wird klein im Licht
          bucket: b1
        - label: Einen Ball fangen
          bucket: b2
        - label: Eine SMS tippen
          bucket: b2
    hints:
      - Musst du darüber nachdenken?
      - Reflexe sind angeboren und immer gleich.
    explanation: Reflexe schützen und laufen ohne Nachdenken ab. Bewusstes Handeln braucht das Großhirn.

  - kind: explain
    id: d1
    depth: 2
    body: Sinneszellen übersetzen Reize in Nervensignale. Im Auge gibt es zwei Sorten **Fotorezeptoren**. Stäbchen sehen hell und dunkel, auch bei wenig Licht. Zapfen sehen Farben – es gibt drei Typen für Rot, Grün und Blau.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Nachts siehst du kaum Farben, nur Grautöne. Warum?
    params:
      options:
        - label: Bei wenig Licht arbeiten fast nur die Stäbchen, und die sehen keine Farbe.
          correct: true
        - label: Nachts gibt es keine Farben.
          feedback: Die Farben sind da – nur die Zapfen brauchen mehr Licht.
        - label: Die Zapfen schlafen.
          feedback: Zapfen schlafen nicht. Sie sind weniger lichtempfindlich.
    hints:
      - Welche Zellen sind empfindlicher?
      - Stäbchen kennen nur hell und dunkel.
    explanation: Stäbchen sind sehr lichtempfindlich, aber farbenblind. Darum sind nachts alle Katzen grau.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: match
    prompt: Welcher Rezeptor meldet welchen Reiz?
    params:
      pairs:
        - left: Zapfen im Auge
          right: Farbe
        - left: Haarzellen im Ohr
          right: Schall
        - left: Riechzellen
          right: Duftstoffe
        - left: Wärmerezeptor der Haut
          right: Temperatur
    hints:
      - Jede Sinneszelle ist auf eine Reizart spezialisiert.
      - Haarzellen biegen sich bei Schwingungen.
    explanation: "Am Ende sprechen alle Sinne dieselbe Sprache: Aktionspotenziale. Erst das Gehirn macht daraus Farbe oder Ton."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Jedes Auge hat einen blinden Fleck ohne Rezeptoren. Warum siehst du kein Loch im Bild?
    params:
      options:
        - label: Das Gehirn füllt die Lücke aus der Umgebung und mit dem anderen Auge.
          correct: true
        - label: Der Fleck ist zu klein, um zu zählen.
          feedback: Er ist größer als der Vollmond am Himmel.
        - label: Das Auge bewegt sich so schnell.
          feedback: Auch mit festem Blick siehst du kein Loch.
    hints:
      - Wo verlässt der Sehnerv das Auge?
      - Sehen ist Rekonstruktion im Gehirn.
    explanation: Wahrnehmung ist ein Modell der Welt, das das Gehirn baut. Optische Täuschungen zeigen, wo es rät.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Reflexbogen funktioniert und warum er so schnell ist.
    params:
      keywords:
        - - rezeptor
          - receptor
          - sinnes
          - sensor
        - - rückenmark
          - rueckenmark
          - spinal
        - - muskel
          - muscle
        - - gehirn
          - brain
          - ohne nachdenk
          - without think
      sample: Ein Rezeptor meldet den Reiz über ein Neuron ans Rückenmark. Dort wird das Signal direkt auf ein Neuron zum Muskel umgeschaltet. Weil das Gehirn nicht dazwischen ist, geht es sehr schnell.
    explanation: Kurzer Weg, wenige Synapsen, kein Nachdenken.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
