id: bio.nerves.neuron
type: concept
title: "The nerve cell"
summary: "Dendrites, axon and fast conduction."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A neuron decides
    body: "A nerve cell collects signals from many others. Only when enough come together does it fire. An artificial **neuron** works in a similar way: turn the weights until it separates the orange dots from the blue ones."
    visual:
      widget: sim
      interactive: true
      params:
        scene: neuron

  - kind: problem
    id: hook
    widget: estimate
    prompt: How many nerve cells does your brain have? Take a guess – in billions.
    params:
      min: 1
      max: 10000
      scale: log
      unit: billion
    answer:
      value: 86
      within: 40
    explanation: About 86 billion – roughly ten times as many as there are people on Earth.

  - kind: explain
    id: c1
    body: A **nerve cell**, or neuron, carries electrical signals. It receives signals with its dendrites. It sends them on along a long extension, the axon. At its end are synapses to the next cell.

  - kind: problem
    id: c2
    widget: match
    prompt: Which part has which job?
    params:
      pairs:
        - left: Dendrites
          right: Receive signals
        - left: Cell body
          right: Collect signals
        - left: Axon
          right: Carry the signal on
        - left: Synapse
          right: Hand the signal over
    hints:
      - Dendrites branch like antennae.
      - The axon is a long cable.
    explanation: Receive, collect, conduct, hand over – a nerve cell works like a relay race.

  - kind: problem
    id: c3
    widget: numeric
    prompt: A signal runs at {{v}} m/s from the toe to the spinal cord, 1 m away. How many milliseconds does it take?
    params:
      unit: ms
    answer:
      value: "{{1000 / v}}"
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 1 / v
        misconception: units
        text: That is seconds. Times 1000 for milliseconds.
    hints:
      - Time = distance ÷ speed.
      - 1 m ÷ {{v}} m/s, then convert to ms.
    explanation: 1 ÷ {{v}} s = {{1000 / v}} ms. Fast – but not instant.
    variants:
      params:
        v: choice[50,80,100,125]
      defaults:
        v: 100

  - kind: problem
    id: c4
    widget: choice
    prompt: The longest axon in your body runs from the spinal cord to the big toe. About how long is it?
    params:
      options:
        - label: About 1 metre
          correct: true
        - label: About 1 millimetre
          feedback: Many axons are short, but this one runs the whole leg.
        - label: About 1 centimetre
          feedback: "Too short: from the back to the foot is much further."
    hints:
      - One cell, one extension, from the back to the foot.
      - Measure your leg.
    explanation: A single cell can be a metre long. Its cell body sits in the spinal cord.

  - kind: explain
    id: d1
    depth: 2
    body: Many axons are wrapped in a fatty layer, the **myelin sheath**. It insulates like plastic around a cable. The signal jumps from gap to gap. That makes it up to 100 times faster.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Without myelin a signal travels about 1 m/s, with myelin up to 100 m/s. How long does a signal without myelin take for 1 m?
    params:
      unit: s
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 0.01
        misconception: swapped
        text: That is the time with myelin.
    hints:
      - Time = distance ÷ speed.
      - 1 m ÷ 1 m/s
    explanation: A whole second instead of 10 ms! Far too slow for quick movements.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: With or without myelin – which fits?
    params:
      buckets:
        - id: b1
          label: with myelin
        - id: b2
          label: without myelin
      items:
        - label: Signal jumps
          bucket: b1
        - label: Up to 100 m/s
          bucket: b1
        - label: About 1 m/s
          bucket: b2
        - label: Signal crawls
          bucket: b2
    hints:
      - Insulation makes things fast.
      - Without insulation every bit must be excited one after another.
    explanation: Myelin lets the signal leap from gap to gap. Without it, it moves bit by bit.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In multiple sclerosis the immune system attacks the myelin sheaths. What would you expect?
    params:
      options:
        - label: "Signals slow down or fail: numbness, vision problems, weakness."
          correct: true
        - label: The nerves become faster.
          feedback: Without insulation they conduct worse.
        - label: Only the skin is affected.
          feedback: Myelin is found in the brain, spinal cord and many nerves.
    hints:
      - What does myelin do?
      - Damaged insulation disrupts the cable.
    explanation: Without myelin the signal no longer jumps. Which functions fail depends on where the damage is.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: About 69 of the 86 billion nerve cells sit in the cerebellum. Yet it is much smaller than the cerebrum. How?
    params:
      options:
        - label: It consists of tiny, densely packed granule cells.
          correct: true
        - label: The figure is wrong.
          feedback: "Counts confirm: the cerebellum holds about 80 % of all neurons."
        - label: Its cells have no nucleus.
          feedback: Neurons always have a nucleus.
    hints:
      - Mass also depends on cell size.
      - The cerebrum has lots of myelin and wiring.
    explanation: A large part of the cerebrum is myelinated wiring. The cerebellum is more densely packed – size is not cell count.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a nerve cell passes on a signal.
    params:
      keywords:
        - - dendrit
        - - axon
        - - synapse
        - - elektr
          - signal
          - electric
        - - myelin
          - schnell
          - fast
      sample: The dendrites receive signals. The electrical signal then runs along the axon, especially fast with myelin. At the synapse it is handed to the next cell.
    explanation: Receive, conduct, hand over – with myelin as a turbo.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
