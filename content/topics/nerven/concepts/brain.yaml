id: bio.nerves.brain
type: concept
title: "Gehirn und Lernen"
summary: "Hirnregionen, Mythen und Plastizität."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: swipe
    prompt: "Gehirn-Mythen: Stimmt das?"
    params:
      cards:
        - text: Wir nutzen nur 10 % unseres Gehirns.
          right: false
          why: "Scans zeigen: Über den Tag sind alle Bereiche aktiv."
        - text: Das Gehirn verändert sich durch Lernen.
          right: true
          why: Synapsen werden stärker, schwächer oder neu gebildet.
        - text: Mit dem Gehirn kann man nicht fühlen, aber es tut weh, wenn man es berührt.
          right: false
          why: Das Gehirn selbst hat keine Schmerzrezeptoren.
        - text: Schlaf hilft beim Lernen.
          right: true
          why: Im Schlaf werden Erinnerungen gefestigt.
    explanation: Das Gehirn ist ganz im Einsatz und baut sich ständig um.

  - kind: explain
    id: c1
    body: Das Gehirn hat Bereiche mit verschiedenen Aufgaben. Das **Großhirn** ist für Denken, Sprache und bewusste Bewegung zuständig. Das Kleinhirn stimmt Bewegungen ab. Der Hirnstamm steuert Atmung und Herzschlag.

  - kind: problem
    id: c2
    widget: match
    prompt: Welche Region macht was?
    params:
      pairs:
        - left: Großhirn
          right: Denken und Sprache
        - left: Kleinhirn
          right: Gleichgewicht
        - left: Hirnstamm
          right: Atmung
        - left: Hippocampus
          right: Neue Erinnerungen
    hints:
      - Was läuft auch im Schlaf weiter?
      - "Wer betrunken ist, schwankt: Das Kleinhirn ist betroffen."
    explanation: Lebenswichtiges liegt tief, Denken weit außen. Doch alle Regionen arbeiten im Netz zusammen.

  - kind: problem
    id: c3
    widget: choice
    prompt: Ein Mensch hat einen Schlaganfall in der linken Großhirnhälfte. Welche Körperseite ist eher gelähmt?
    params:
      options:
        - label: Die rechte
          correct: true
        - label: Die linke
          feedback: Die Nervenbahnen kreuzen auf dem Weg zum Körper die Seite.
        - label: Beide gleich
          feedback: Jede Hälfte steuert vor allem die Gegenseite.
    hints:
      - Die Bahnen kreuzen im Hirnstamm.
      - Links steuert rechts.
    explanation: Die linke Hirnhälfte steuert die rechte Körperseite. Oft ist links auch die Sprache betroffen.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Das [[Großhirn]] denkt und spricht. Das [[Kleinhirn]] hält das Gleichgewicht. Der [[Hirnstamm]] steuert Atmung und Herzschlag.
      distractors:
        - Rückenmark
        - Axon
    explanation: Drei große Teile, drei Aufgaben – vom Bewussten bis zum Lebenswichtigen.

  - kind: explain
    id: d1
    depth: 2
    body: "Das Gehirn baut sich durch Erfahrung um. Synapsen, die oft gemeinsam aktiv sind, werden stärker. Kurz gesagt: »Was zusammen feuert, verdrahtet sich.« Diese Fähigkeit heißt **Plastizität**."

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Londoner Taxifahrer lernen jahrelang das Straßennetz. Was fanden Forscher in ihren Gehirnen?
    params:
      options:
        - label: Ein Teil des Hippocampus war größer als bei anderen Menschen.
          correct: true
        - label: Nichts – Erwachsene Gehirne ändern sich nicht.
          feedback: Plastizität gibt es ein Leben lang.
        - label: Das ganze Gehirn war doppelt so groß.
          feedback: Die Veränderung war messbar, aber klein und örtlich.
    hints:
      - Welche Region hilft bei Orientierung und Gedächtnis?
      - Training formt die Region, die man nutzt.
    explanation: Der hintere Hippocampus war vergrößert – und umso mehr, je länger jemand fuhr.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: estimate
    prompt: Wie viele Synapsen hat das menschliche Gehirn ungefähr?
    params:
      min: 1000000000
      max: 10000000000000000
      scale: log
    answer:
      value: 100000000000000
      within: 80
    explanation: Grob 100 Billionen – jede Nervenzelle hat im Schnitt Tausende Verbindungen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Neuron feuert höchstens etwa {{f}}-mal pro Sekunde. Ein Gedanke dauert eine halbe Sekunde. Wie viele Schritte hintereinander passen höchstens hinein?
    answer:
      value: "{{f / 2}}"
    feedback:
      - when: numval(state.input) == f * 2
        misconception: inverse
        text: Eine halbe Sekunde ist weniger als eine. Teile durch 2.
    hints:
      - Feuerrate mal Zeit.
      - "{{f}} · 0,5"
    explanation: Nur rund {{f / 2}} Schritte! Das Gehirn muss also massiv parallel arbeiten – Milliarden Zellen gleichzeitig, nicht nacheinander.
    difficulty: 3
    variants:
      params:
        f: choice[100,200,400]
      defaults:
        f: 200

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie das Gehirn beim Lernen sich verändert.
    params:
      keywords:
        - - synapse
        - - stärker
          - staerker
          - verstärk
          - verstaerk
          - stronger
          - strengthen
        - - plastiz
          - plastic
          - umbau
          - rewir
        - - übung
          - uebung
          - wiederhol
          - oft
          - practice
          - repeat
          - often
      sample: Beim Lernen werden Synapsen, die oft zusammen aktiv sind, stärker. Durch Übung und Wiederholung baut sich das Netz um. Diese Plastizität bleibt ein Leben lang erhalten.
    explanation: Lernen ist Umbau von Verbindungen.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
