id: alg.functions.table
type: concept
title: Funktionen und Wertetabellen
summary: Jedem x genau ein y.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [fn.table]
estimated_minutes: 11
steps:
  - kind: problem
    id: taxi
    widget: numeric
    body: Ein Taxi kostet 3 € Grundgebühr und 1 € pro Kilometer.
    prompt: Was kostet eine Fahrt über 5 km?
    params: { unit: "€" }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 5"
        text: Die Grundgebühr von 3 € kommt immer dazu.
    hints:
      - Grundgebühr plus 5 Kilometer.
    explanation: 3 € + 5 · 1 € = 8 €.

  - kind: explain
    id: s2
    body: |
      Eine **Funktion** ordnet jedem x genau ein y zu.
      Beim Taxi ist $y = x + 3$ – x sind die Kilometer, y der Preis.
    visual:
      widget: graph
      params: { x: [0, 8], y: [0, 10], functions: [{ expr: "x + 3" }], points: [{ id: P, x: 5, y: 8, draggable: false }] }

  - kind: problem
    id: punkt
    widget: graph
    prompt: Trage den Punkt für eine Fahrt über 4 km ein.
    params: { x: [0, 8], y: [0, 10], points: [{ id: P, x: 0, y: 0 }] }
    answer: { points: { P: { x: 4, y: 7 } } }
    feedback:
      - when: "state.points.P.x == 7 && state.points.P.y == 4"
        misconception: swapped-coordinates
        text: Die Kilometer gehören auf die x-Achse, der Preis auf die y-Achse.
    hints:
      - x = 4 km. Was kostet das?
      - 3 € + 4 € = 7 €.
    explanation: Bei x = 4 ist y = 4 + 3 = 7.

  - kind: problem
    id: tabelle
    widget: choice
    body: |
      x = 0 → y = 1
      x = 1 → y = 3
      x = 2 → y = 5
      x = 3 → y = 7
    prompt: Welche Funktion passt zur Tabelle?
    params:
      options:
        - { label: "$y = 2x + 1$", correct: true }
        - { label: "$y = x + 1$", feedback: "Prüfe x = 2 – das ergibt 3, nicht 5." }
        - { label: "$y = 2x$", feedback: "Prüfe x = 0 – das ergibt 0, nicht 1." }
        - { label: "$y = x + 2$", feedback: "Prüfe x = 0 – das ergibt 2, nicht 1." }
    hints:
      - Um wie viel wächst y, wenn x um 1 wächst?
    explanation: y wächst pro Schritt um 2 und startet bei 1.

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: "Für $y = {{m}}x {{b < 0 ? '-' : '+'}} {{abs(b)}}$: Wie groß ist y bei x = {{x}}?"
    answer: { value: "{{m * x + b}}" }
    hints:
      - "Setze {{x}} für x ein."
    explanation: "{{m}} · {{x}} {{b < 0 ? '−' : '+'}} {{abs(b)}} = {{m * x + b}}."
    variants:
      params: { m: "int[2,5]", b: "nonzero[-3,5]", x: "int[1,6]" }
      defaults: { m: 3, b: -2, x: 4 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Jedem Tag wird seine Höchsttemperatur zugeordnet.
          right: true
        - text: Jeder Zahl werden ihre Teiler zugeordnet.
          right: false
          why: 12 hätte sechs Werte – erlaubt ist nur einer.
        - text: Jedem Kreis wird seine Fläche zugeordnet.
          right: true
        - text: Jedem Alter werden alle Menschen dieses Alters zugeordnet.
          right: false
      left: Keine Funktion
      right: Funktion

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Für $f(x) = 3x - 2$: Bei welchem x ist f(x) = 19?"
    answer:
      value: 7
    hints:
      - Löse 3x − 2 = 19.
    explanation: 3x = 21, also x = 7. Rückwärts durch eine Funktion gehen heißt eine Gleichung lösen.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: buckets
    prompt: Funktion oder nicht? Eine Funktion gibt jedem Eingang genau einen Ausgang.
    params:
      buckets:
        - id: b1
          label: Funktion
        - id: b2
          label: Keine Funktion
      items:
        - label: Mensch → sein Geburtstag
          bucket: b1
        - label: Zahl x → x²
          bucket: b1
        - label: Uhrzeit → Temperatur in Rom
          bucket: b1
        - label: Datum → wer an dem Tag Geburtstag hat
          bucket: b2
        - label: Zahl → ihre Teiler
          bucket: b2
        - label: x → y mit x² + y² = 25
          bucket: b2
    hints:
      - "Frag bei jedem Eingang: Kann es zwei Ausgänge geben?"
      - Zu x = 3 gehören bei x² + y² = 25 sowohl y = 4 als auch y = −4.
    explanation: Viele Menschen haben am selben Tag Geburtstag, 12 hat mehrere Teiler, ein Kreis hat zu x zwei y-Werte. Beim Rest gibt es genau ein Ergebnis.
    difficulty: 2

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Für $f(x) = {{m}}x + {{b}}$ gilt $f(x) = {{m * x + b}}$. Wie groß ist x?
    answer:
      value: "{{x}}"
    feedback:
      - when: numval(state.input) == m * (m * x + b) + b
        misconception: forward-not-back
        text: Du hast f noch einmal angewendet. Gesucht ist der Weg zurück.
    hints:
      - "Rückwärts: erst {{b}} abziehen, dann durch {{m}} teilen."
      - "({{m * x + b}} − {{b}}) : {{m}}."
    explanation: "({{m * x + b}} − {{b}}) : {{m}} = {{x}}. Das ist die Umkehrfunktion: $f^{-1}(y) = (y - {{b}}) : {{m}}$."
    difficulty: 2
    variants:
      params:
        m: int[2,6]
        b: int[1,9]
        x: int[2,9]
      defaults:
        m: 2
        b: 3
        x: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: $f(x) = 2x + 1$ und $g(x) = x^2$. Wie groß ist $g(f(3))$?
    answer:
      value: 49
    hints:
      - "Erst innen: f(3) = 7."
    explanation: g(7) = 49. Aber f(g(3)) = 19 – bei der **Verkettung** zählt die Reihenfolge.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Die **Umkehrfunktion** macht f rückgängig. Ihr Graph ist f, gespiegelt an der Geraden y = x. Es gibt sie nur, wenn kein y zweimal vorkommt. Darum kehrt man x² nur für x ≥ 0 um – das ergibt √x.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "Mit $f(x) = 2x + 1$ und $g(x) = x^2$: Wie groß ist $f(g(3))$?"
    answer:
      value: 19
    feedback:
      - when: numval(state.input) == 49
        misconception: order-of-composition
        text: Das ist g(f(3)). Bei f(g(3)) wird zuerst g gerechnet.
    hints:
      - "Innen zuerst: g(3) = 9."
      - Dann f(9).
    explanation: "g(3) = 9, f(9) = 19. Andersherum kommt 49 heraus: Verketten ist nicht vertauschbar."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Welche Funktion lässt sich auf allen reellen Zahlen umkehren?
    params:
      options:
        - label: $f(x) = x^3$
          correct: true
        - label: $f(x) = x^2$
          feedback: 2 und −2 haben dasselbe Quadrat. Zurück ginge es nicht eindeutig.
        - label: $f(x) = |x|$
          feedback: "|3| = |−3|. Zwei Eingänge, ein Ausgang."
        - label: $f(x) = \sin x$
          feedback: Der Sinus wiederholt sich – jeder Wert kommt unendlich oft vor.
    hints:
      - "Umkehrbar heißt: kein y-Wert kommt doppelt vor."
      - Eine Funktion, die überall steigt, trifft jeden Wert nur einmal.
    explanation: x³ steigt überall streng. Darum hat jedes y genau ein Urbild, die dritte Wurzel.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was macht eine Zuordnung zu einer Funktion?"
    params:
      keywords:
        - - jedem
          - jede
          - each
          - every
        - - genau
          - eindeutig
          - exactly
          - unique
          - nur
        - - eingang
          - x-wert
          - input
          - ausgang
          - output
          - y-wert
      sample: Eine Funktion ordnet jedem Eingang genau einen Ausgang zu. Zwei Eingänge dürfen dasselbe Ergebnis haben, aber ein Eingang nie zwei verschiedene.
    explanation: Entscheidend ist »genau einer« pro Eingang. Rückwärts darf es mehrdeutig sein.
    difficulty: 3

srs:
  cards_from: ["einsetzen"]
