id: alg.functions.everyday
type: concept
title: Tarife als Geraden
summary: Grundpreis plus Preis pro Einheit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Was kostet die Fahrt?
    body: "Leihräder, Taxis und Stromtarife rechnen gleich: ein fester Betrag plus ein Preis pro Einheit. Die Säulen zeigen die Kosten für 1, 2 und 3 Stunden. Stell die nächsten zwei ein. Erkennst du den **Grundpreis**?"
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - 1 h
          - 2 h
          - 3 h
          - 4 h
          - 5 h
        values:
          - 6
          - 8
          - 10
          - 0
          - 0
        editable:
          - 3
          - 4
        min: 0
        max: 16
        unit: €

  - kind: problem
    id: taxi
    widget: slider
    prompt: Ein Taxi kostet 3 € Grundpreis und 1 € pro km. Stelle die Gerade passend ein.
    params:
      expr: "m*x + b"
      x: [0, 6]
      y: [0, 8]
      showCoordinates: false
      sliders:
        - { id: m, label: "€ pro km", min: 0, max: 2, step: 0.5, initial: 2 }
        - { id: b, label: Grundpreis, min: 0, max: 5, step: 1, initial: 0 }
      markers: [{ x: 0, y: 3, label: Start }, { x: 4, y: 7, label: "4 km" }]
    answer: { values: { m: 1, b: 3 } }
    hints:
      - Der Grundpreis ist die Höhe bei 0 km.
    explanation: y = 1 · x + 3. Die Steigung ist der Preis pro km, der Startwert der Grundpreis.

  - kind: explain
    id: s2
    body: |
      Viele Tarife sind **lineare Funktionen**: y = m · x + b.
      m ist der Preis pro Einheit, b der feste Grundpreis.

  - kind: problem
    id: kosten
    widget: numeric
    prompt: Ein Handytarif kostet {{b}} € plus {{m}} € pro GB. Was kosten {{x}} GB?
    params: { unit: "€" }
    answer: { value: "{{b + m * x}}" }
    feedback:
      - when: "numval(state.input) == m * x"
        misconception: forget-base
        text: Der Grundpreis kommt noch dazu.
    hints:
      - "{{b}} + {{m}} · {{x}}."
    explanation: "{{b}} + {{m * x}} = {{b + m * x}} €."
    variants:
      params: { b: "choice[5,8,10]", m: "choice[2,3,4]", x: "int[2,8]" }
      defaults: { b: 5, m: 2, x: 4 }

  - kind: problem
    id: steigung
    widget: choice
    prompt: Zwei Tarife haben denselben Grundpreis. Welcher wird bei viel Nutzung teurer?
    params:
      options:
        - { label: Der mit der steileren Geraden, correct: true }
        - { label: Der mit der flacheren Geraden, feedback: "Flacher heißt: jede weitere Einheit kostet weniger." }
        - { label: Beide gleich, feedback: "Nur am Anfang – danach trennen sich die Geraden." }
    hints:
      - Was bedeutet die Steigung hier?
    explanation: Die Steigung ist der Preis pro Einheit. Steiler heißt teurer pro Einheit.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Ein Leihrad kostet 2 € zum Entsperren und 1 € pro Stunde. Stell die Kosten für 1 bis 4 Stunden ein.
    params:
      labels:
        - 1 h
        - 2 h
        - 3 h
        - 4 h
      values:
        - 0
        - 0
        - 0
        - 0
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      unit: €
    answer:
      values:
        - 3
        - 4
        - 5
        - 6
    hints:
      - "Für 1 Stunde zahlst du den Grundpreis und eine Stunde: 2 € + 1 €."
      - Jede weitere Stunde kostet 1 € mehr.
    explanation: "y = 1 · x + 2: Die Säulen wachsen gleichmäßig um 1 € – 3 €, 4 €, 5 €, 6 €."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Tarif A: 20 € plus 0,10 € pro Minute. Tarif B: 5 € plus 0,25 € pro Minute. Bei wie vielen Minuten kosten beide gleich viel?"
    answer:
      value: 100
    hints:
      - 20 + 0,10 x = 5 + 0,25 x.
    explanation: 15 = 0,15 x, also x = 100.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Manche Tarife ändern ihre Regel ab einer Grenze. So eine **abschnittsweise** Funktion hat mehrere Geraden-Stücke mit Knick. Beispiel: 10 € mit 100 Freiminuten, danach 0,20 € pro Minute."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Der Tarif kostet 10 € mit 100 Freiminuten, danach 0,20 € pro Minute. Was kosten {{m}} Minuten?
    params:
      unit: €
    answer:
      value: "{{10 + 0.2 * (m - 100)}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - (10 + 0.2 * m)) < 0.01
        misconception: no-free-minutes
        text: Die ersten 100 Minuten sind frei. Nur der Rest kostet.
    hints:
      - Wie viele Minuten liegen über 100?
      - 10 € + ({{m}} − 100) · 0,20 €.
    explanation: 10 + {{m - 100}} · 0,2 = {{10 + 0.2 * (m - 100)}} €.
    difficulty: 2
    variants:
      params:
        m: step[120,300,10]
      defaults:
        m: 180

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Eine Firma hat {{F}} € Fixkosten. Jedes Stück kostet {{c}} € in der Herstellung und bringt {{c + d}} €. Ab wie vielen Stück macht sie keinen Verlust mehr?
    answer:
      value: "{{F / d}}"
    feedback:
      - when: numval(state.input) == F / (c + d)
        misconception: price-not-margin
        text: Vom Preis musst du erst die Herstellkosten abziehen. Nur der Rest deckt die Fixkosten.
    hints:
      - Pro Stück bleiben {{d}} € übrig.
      - Wie oft passen {{d}} € in {{F}} €?
    explanation: "Kosten {{F}} + {{c}}x, Erlös {{c + d}}x. Gleichsetzen: {{d}}x = {{F}}, x = {{F / d}}. Das ist die Gewinnschwelle."
    difficulty: 2
    variants:
      params:
        F: step[1000,5000,500]
        c: int[2,6]
        d: choice[2,4,5,10]
      defaults:
        F: 2000
        c: 3
        d: 5

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Taxi kostet 3,50 € Grundpreis und 2 € pro **angefangenem** Kilometer. Wie sieht der Graph aus?
    params:
      options:
        - label: Wie eine Treppe
          correct: true
        - label: Wie eine Gerade
          feedback: Der Preis springt bei jedem neuen Kilometer – dazwischen bleibt er gleich.
        - label: Wie eine Parabel
          feedback: Es kommt immer gleich viel dazu, nur in Sprüngen.
    hints:
      - Was kostet eine Fahrt über 1,2 km – und eine über 1,9 km?
    explanation: "Eine **Treppenfunktion**: stückweise konstant, mit Sprungstellen. Porto und Parkgebühren sind auch so."
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Fixkosten 2000 €, 3 € pro Stück. Wie hoch sind die Kosten pro Stück im Schnitt, wenn 500 Stück hergestellt werden?
    params:
      unit: €
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 3
        misconception: ignore-fixed
        text: Die Fixkosten verteilen sich auch auf die Stücke.
    hints:
      - "Gesamtkosten: 2000 + 3 · 500."
      - Teile durch 500.
    explanation: "3500 € : 500 = 7 €. Die Stückkosten sind $\\frac{2000}{x} + 3$ – eine Hyperbel."
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: Was passiert mit den Stückkosten $\frac{2000}{x} + 3$, wenn x immer größer wird?
    params:
      options:
        - label: Sie nähern sich 3 €, erreichen es aber nie.
          correct: true
        - label: Sie fallen auf 0 €.
          feedback: Jedes Stück kostet immer mindestens 3 € Material.
        - label: Sie steigen wieder.
          feedback: Der Bruch 2000/x wird nur kleiner.
    hints:
      - Was macht 2000/x für x = 1 000 000?
      - Der Bruch geht gegen 0.
    explanation: Die Gerade y = 3 ist eine waagerechte **Asymptote**. Darum lohnt sich Massenproduktion – aber billiger als das Material wird nichts.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was m und b in einem Tarif y = m · x + b bedeuten.
    params:
      keywords:
        - - grundpreis
          - grundgebühr
          - fest
          - base
          - fixed
        - - einheit
          - pro
          - kilometer
          - minute
          - per
          - unit
        - - steigung
          - steil
          - slope
          - steep
      sample: b ist der feste Grundpreis, den man immer zahlt, auch bei null Nutzung. m ist der Preis pro Einheit, etwa pro Minute. Im Graphen ist b der Startpunkt auf der y-Achse und m die Steigung.
    explanation: b verschiebt die Gerade nach oben, m macht sie steiler. Wer viel nutzt, achtet auf m; wer wenig nutzt, auf b.
    difficulty: 3

srs:
  cards_from: [kosten, steigung]
