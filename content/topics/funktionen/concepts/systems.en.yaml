id: alg.functions.systems
type: concept
title: Two lines, one intersection
summary: The intersection satisfies both equations at once.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [fn.systems]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Where two paths cross
    body: "Two runners, two price plans, two lines: the exciting part is where they are equal. Turn your line with m and watch where it crosses the dashed one. Is there an m with no **intersection**?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: m*x + 1
        showCoordinates: false
        sliders:
          - id: m
            label: m
            min: -3
            max: 3
            step: 0.5
            initial: 0.5
        target:
          expr: 4 - x

  - kind: problem
    id: schnittpunkt
    widget: graph
    prompt: Place P exactly on the intersection of the two lines.
    params: { x: [-1, 6], y: [-1, 6], functions: [{ expr: "x + 1" }, { expr: "-x + 5" }], points: [{ id: P, x: 0, y: 0 }], showCoordinates: true }
    answer: { points: { P: { x: 2, y: 3 } } }
    hints:
      - Where do the two orange lines cross?
    explanation: The lines cross at (2 | 3).

  - kind: explain
    id: s2
    body: |
      The **intersection** lies on both lines.
      Its coordinates fit both equations: $3 = 2 + 1$ and $3 = -2 + 5$.

  - kind: problem
    id: gleichsetzen
    widget: numeric
    prompt: 'Solve by setting equal: $x + 1 = -x + 5$. What is x?'
    answer: { value: 2 }
    hints:
      - Add x to both sides.
      - 2x + 1 = 5.
    explanation: 2x + 1 = 5, so 2x = 4 and x = 2.

  - kind: problem
    id: tarife
    widget: choice
    body: Plan A costs a 10 € base fee and 2 € per hour. Plan B costs 4 € per hour.
    prompt: When is Plan A cheaper?
    params:
      options:
        - { label: From more than 5 hours, correct: true }
        - { label: From more than 2 hours, feedback: "At 3 hours, A costs 16 €, B only 12 €." }
        - { label: Never, feedback: "At 10 hours, A costs 30 €, but B costs 40 €." }
        - { label: Always, feedback: "At 1 hour, A costs 12 €, B only 4 €." }
    hints:
      - When do both cost the same? 10 + 2h = 4h.
    explanation: At 5 hours, both cost 20 €. After that, A is cheaper.
    difficulty: 2

  - kind: problem
    id: zweiter
    widget: numeric
    prompt: 'Where do $y = 2x$ and $y = x + 3$ intersect? Give x.'
    answer: { value: 3 }
    hints:
      - Set them equal – 2x = x + 3.
    explanation: 2x = x + 3, so x = 3 (and y = 6).

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Two lines with different slopes intersect exactly once.
          right: true
        - text: Parallel lines intersect far away.
          right: false
          why: They never intersect – the system has no solution.
        - text: The intersection satisfies both equations.
          right: true

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: The dashed line is $y = 4 - x$. Set m so that $y = mx + 1$ and the dashed line cross at x = 1.
    params:
      expr: m*x + 1
      showCoordinates: true
      sliders:
        - id: m
          label: m
          min: -3
          max: 3
          step: 0.5
          initial: -2
      target:
        expr: 4 - x
      markers:
        - x: 1
          y: 3
    answer:
      values:
        m: 2
    hints:
      - At x = 1 the dashed line is at y = 3 – see the dot.
      - "Your line must pass through (1, 3): $m \\cdot 1 + 1 = 3$."
    explanation: "m = 2: both lines pass through (1, 3), because $2 \\cdot 1 + 1 = 3$ and $4 - 1 = 3$."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Solve the system: x + y = 10 and x − y = 4. What is x?"
    answer:
      value: 7
    hints:
      - Add both equations – the y drops out.
    explanation: 2x = 14, so x = 7 and y = 3. This is the **elimination method**.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: With the **elimination method** you add the equations so that one unknown drops out. From 2x + 3y = 12 and 4x − 3y = 6 you get 6x = 18.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Solve 2x + 3y = 12 and 4x − 3y = 6. What is y?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 3
        misconception: gave-x
        text: That is x. Put it into one equation to find y.
    hints:
      - "Adding: 6x = 18, so x = 3."
      - "Substitute: 2 · 3 + 3y = 12."
    explanation: "x = 3 and 6 + 3y = 12, so y = 2. Check in the second equation: 12 − 6 = 6."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: choice
    prompt: How many solutions does the system y = 2x + 1 and 2y = 4x + 2 have?
    params:
      options:
        - label: Infinitely many
          correct: true
        - label: Divide the second equation by 2.
          feedback: Teile die zweite Gleichung durch 2.
        - label: None would mean parallel, different lines.
          feedback: Keine gäbe es bei parallelen, verschiedenen Geraden.
    hints:
      - Divide 2y = 4x + 2 by 2.
      - Compare with the first equation.
    explanation: Both equations describe the same line. Every point on it solves the system.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "A barn holds chickens and rabbits: 20 heads and 56 legs. How many rabbits are there?"
    answer:
      value: 8
    hints:
      - If all were chickens there would be 40 legs. Each rabbit adds 2 more.
    explanation: 16 legs too many, so 8 rabbits and 12 chickens.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: With three unknowns each equation is a **plane** in space. Three planes usually meet in exactly one point – sometimes in a line or not at all. Whether there is exactly one solution is told by the determinant.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "Solve: x + y + z = 6, x − y = −1 and y − z = −1. What is z?"
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 2
        misconception: gave-y
        text: That is y. z is 1 more.
    hints:
      - "Express everything with y: x = y − 1 and z = y + 1."
      - "Substitute: (y − 1) + y + (y + 1) = 6."
    explanation: "3y = 6, so y = 2, x = 1, z = 3. Check: 1 + 2 + 3 = 6."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: "**Cramer's rule**: for ax + by = e and cx + dy = f, $x = \\frac{ed - bf}{ad - bc}$. Use it on 3x + 2y = 7 and x − y = −1. What is x?"
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == -1
        misconception: sign-error
        text: "Check the signs: numerator and denominator are both negative."
    hints:
      - "Denominator: 3 · (−1) − 2 · 1 = −5."
      - "Numerator: 7 · (−1) − 2 · (−1) = −5."
    explanation: x = −5 / (−5) = 1, then y = 2. If the denominator ad − bc is zero there is no unique solution – the lines are parallel.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does a system of two parallel, distinct lines have no solution?"
    params:
      keywords:
        - - parallel
          - gleiche steigung
          - same slope
        - - schneiden
          - schnittpunkt
          - treffen
          - meet
          - cross
          - intersect
        - - nie
          - kein
          - keine
          - never
          - no
          - none
      sample: A solution is a point on both lines. Parallel lines have the same slope and never meet. So there is no common point.
    explanation: Solutions are intersection points. No intersection, no solution – algebraically you hit a contradiction like 0 = 2.
    difficulty: 3
