id: alg.functions.everyday
type: concept
title: Rates as lines
summary: Base price plus price per unit.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: What does the ride cost?
    body: "Hire bikes, taxis and power tariffs work alike: a fixed amount plus a price per unit. The bars show the cost for 1, 2 and 3 hours. Set the next two. Can you spot the **base price**?"
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - 1 h
          - 2 h
          - 3 h
          - 4 h
          - 5 h
        values:
          - 6
          - 8
          - 10
          - 0
          - 0
        editable:
          - 3
          - 4
        min: 0
        max: 16
        unit: €

  - kind: problem
    id: taxi
    widget: slider
    prompt: A taxi costs a 3 € base fare and 1 € per km. Set the line to match.
    params:
      expr: "m*x + b"
      x: [0, 6]
      y: [0, 8]
      showCoordinates: false
      sliders:
        - { id: m, label: "€ per km", min: 0, max: 2, step: 0.5, initial: 2 }
        - { id: b, label: Base fare, min: 0, max: 5, step: 1, initial: 0 }
      markers: [{ x: 0, y: 3, label: Start }, { x: 4, y: 7, label: "4 km" }]
    answer: { values: { m: 1, b: 3 } }
    hints:
      - The base fare is the height at 0 km.
    explanation: y = 1 · x + 3. The slope is the price per km, the starting value is the base fare.

  - kind: explain
    id: s2
    body: |
      Many rates are **linear functions**: y = m · x + b.
      m is the price per unit, b the fixed base price.

  - kind: problem
    id: kosten
    widget: numeric
    prompt: A phone plan costs {{b}} € plus {{m}} € per GB. What do {{x}} GB cost?
    params: { unit: "€" }
    answer: { value: "{{b + m * x}}" }
    feedback:
      - when: "numval(state.input) == m * x"
        misconception: forget-base
        text: The base price is still missing.
    hints:
      - "{{b}} + {{m}} · {{x}}."
    explanation: "{{b}} + {{m * x}} = {{b + m * x}} €."
    variants:
      params: { b: "choice[5,8,10]", m: "choice[2,3,4]", x: "int[2,8]" }
      defaults: { b: 5, m: 2, x: 4 }

  - kind: problem
    id: steigung
    widget: choice
    prompt: Two rates have the same base price. Which one gets more expensive with heavy use?
    params:
      options:
        - { label: The one with the steeper line, correct: true }
        - { label: The one with the flatter line, feedback: "Flatter means each extra unit costs less." }
        - { label: Both the same, feedback: "Only at the start – after that the lines separate." }
    hints:
      - What does the slope mean here?
    explanation: The slope is the price per unit. Steeper means more expensive per unit.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: A hire bike costs €2 to unlock and €1 per hour. Set the cost for 1 to 4 hours.
    params:
      labels:
        - 1 h
        - 2 h
        - 3 h
        - 4 h
      values:
        - 0
        - 0
        - 0
        - 0
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      unit: €
    answer:
      values:
        - 3
        - 4
        - 5
        - 6
    hints:
      - "For 1 hour you pay the base price plus one hour: €2 + €1."
      - Each further hour costs €1 more.
    explanation: "y = 1 · x + 2: the bars grow evenly by €1 – €3, €4, €5, €6."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Plan A: €20 plus €0.10 per minute. Plan B: €5 plus €0.25 per minute. At how many minutes do both cost the same?"
    answer:
      value: 100
    hints:
      - 20 + 0.10 x = 5 + 0.25 x.
    explanation: 15 = 0.15 x, so x = 100.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Some tariffs change their rule above a limit. Such a **piecewise** function is made of several straight pieces with a kink. Example: 10 € with 100 free minutes, then 0.20 € per minute."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: The plan costs 10 € with 100 free minutes, then 0.20 € per minute. What do {{m}} minutes cost?
    params:
      unit: €
    answer:
      value: "{{10 + 0.2 * (m - 100)}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - (10 + 0.2 * m)) < 0.01
        misconception: no-free-minutes
        text: The first 100 minutes are free. Only the rest costs extra.
    hints:
      - How many minutes are above 100?
      - 10 € + ({{m}} − 100) · 0.20 €.
    explanation: 10 + {{m - 100}} · 0.2 = {{10 + 0.2 * (m - 100)}} €.
    difficulty: 2
    variants:
      params:
        m: step[120,300,10]
      defaults:
        m: 180

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A company has fixed costs of {{F}} €. Each piece costs {{c}} € to make and sells for {{c + d}} €. From how many pieces does it stop making a loss?
    answer:
      value: "{{F / d}}"
    feedback:
      - when: numval(state.input) == F / (c + d)
        misconception: price-not-margin
        text: First subtract the production cost from the price. Only the rest covers the fixed costs.
    hints:
      - Each piece leaves {{d}} €.
      - How often do {{d}} € fit into {{F}} €?
    explanation: "Cost {{F}} + {{c}}x, revenue {{c + d}}x. Set equal: {{d}}x = {{F}}, x = {{F / d}}. That is the break-even point."
    difficulty: 2
    variants:
      params:
        F: step[1000,5000,500]
        c: int[2,6]
        d: choice[2,4,5,10]
      defaults:
        F: 2000
        c: 3
        d: 5

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A taxi costs €3.50 base fare and €2 per kilometre **started**. What does the graph look like?
    params:
      options:
        - label: Like a staircase
          correct: true
        - label: Like a straight line
          feedback: The price jumps at every new kilometre – in between it stays constant.
        - label: Like a parabola
          feedback: The same amount is added each time, just in jumps.
    hints:
      - What does a 1.2 km ride cost – and a 1.9 km one?
    explanation: "A **step function**: piecewise constant, with jumps. Postage and parking fees work the same way."
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Fixed costs 2000 €, 3 € per piece. What is the average cost per piece when 500 pieces are made?
    params:
      unit: €
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 3
        misconception: ignore-fixed
        text: The fixed costs are spread over the pieces too.
    hints:
      - "Total cost: 2000 + 3 · 500."
      - Divide by 500.
    explanation: 3500 € / 500 = 7 €. The cost per piece is $\frac{2000}{x} + 3$ – a hyperbola.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: What happens to the cost per piece $\frac{2000}{x} + 3$ as x grows without bound?
    params:
      options:
        - label: They approach 3 € but never reach it.
          correct: true
        - label: Every piece always costs at least 3 € in material.
          feedback: Jedes Stück kostet immer mindestens 3 € Material.
        - label: The fraction 2000/x only gets smaller.
          feedback: Der Bruch 2000/x wird nur kleiner.
    hints:
      - What does 2000/x do for x = 1,000,000?
      - The fraction tends to 0.
    explanation: The line y = 3 is a horizontal **asymptote**. That is why mass production pays – but nothing gets cheaper than the material.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux what m and b mean in a tariff y = m · x + b.
    params:
      keywords:
        - - grundpreis
          - grundgebühr
          - fest
          - base
          - fixed
        - - einheit
          - pro
          - kilometer
          - minute
          - per
          - unit
        - - steigung
          - steil
          - slope
          - steep
      sample: b is the fixed base price you always pay, even with zero use. m is the price per unit, say per minute. In the graph b is the start on the y-axis and m is the slope.
    explanation: b shifts the line up, m makes it steeper. Heavy users should watch m; light users b.
    difficulty: 3

srs:
  cards_from: [kosten, steigung]
