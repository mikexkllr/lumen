id: alg.functions.systems
type: concept
title: Zwei Geraden, ein Schnittpunkt
summary: Der Schnittpunkt erfüllt beide Gleichungen zugleich.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [fn.systems]
estimated_minutes: 12
steps:
  - kind: problem
    id: schnittpunkt
    widget: graph
    prompt: Setze P genau auf den Schnittpunkt der beiden Geraden.
    params: { x: [-1, 6], y: [-1, 6], functions: [{ expr: "x + 1" }, { expr: "-x + 5" }], points: [{ id: P, x: 0, y: 0 }], showCoordinates: true }
    answer: { points: { P: { x: 2, y: 3 } } }
    hints:
      - Wo kreuzen sich die beiden orangen Linien?
    explanation: Die Geraden kreuzen sich bei (2 | 3).

  - kind: explain
    id: s2
    body: |
      Der **Schnittpunkt** liegt auf beiden Geraden.
      Seine Koordinaten erfüllen beide Gleichungen – $3 = 2 + 1$ und $3 = -2 + 5$.

  - kind: problem
    id: gleichsetzen
    widget: numeric
    prompt: 'Löse durch Gleichsetzen: $x + 1 = -x + 5$. Wie groß ist x?'
    answer: { value: 2 }
    hints:
      - Addiere auf beiden Seiten x.
      - 2x + 1 = 5.
    explanation: 2x + 1 = 5, also 2x = 4 und x = 2.

  - kind: problem
    id: tarife
    widget: choice
    body: Tarif A kostet 10 € Grundgebühr und 2 € pro Stunde. Tarif B kostet 4 € pro Stunde.
    prompt: Wann ist Tarif A günstiger?
    params:
      options:
        - { label: Ab mehr als 5 Stunden, correct: true }
        - { label: Ab mehr als 2 Stunden, feedback: "Bei 3 Stunden kostet A 16 €, B nur 12 €." }
        - { label: Nie, feedback: "Bei 10 Stunden kostet A 30 €, B aber 40 €." }
        - { label: Immer, feedback: "Bei 1 Stunde kostet A 12 €, B nur 4 €." }
    hints:
      - Wann kosten beide gleich viel? 10 + 2h = 4h.
    explanation: Bei 5 Stunden kosten beide 20 €. Danach ist A günstiger.
    difficulty: 2

  - kind: problem
    id: zweiter
    widget: numeric
    prompt: 'Wo schneiden sich $y = 2x$ und $y = x + 3$? Gib x an.'
    answer: { value: 3 }
    hints:
      - Setze gleich – 2x = x + 3.
    explanation: 2x = x + 3, also x = 3 (und y = 6).

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Zwei Geraden mit verschiedener Steigung schneiden sich genau einmal.
          right: true
        - text: Parallele Geraden schneiden sich weit draußen.
          right: false
          why: Sie schneiden sich nie – das System hat keine Lösung.
        - text: Der Schnittpunkt erfüllt beide Gleichungen.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Löse das System: x + y = 10 und x − y = 4. Wie groß ist x?"
    answer:
      value: 7
    hints:
      - Addiere beide Gleichungen – das y fällt weg.
    explanation: 2x = 14, also x = 7 und y = 3. Das ist das **Additionsverfahren**.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Beim **Additionsverfahren** addiert man die Gleichungen so, dass eine Unbekannte wegfällt. Aus 2x + 3y = 12 und 4x − 3y = 6 wird 6x = 18.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Löse 2x + 3y = 12 und 4x − 3y = 6. Wie groß ist y?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 3
        misconception: gave-x
        text: Das ist x. Setz es in eine Gleichung ein, um y zu finden.
    hints:
      - "Addieren: 6x = 18, also x = 3."
      - "Einsetzen: 2 · 3 + 3y = 12."
    explanation: "x = 3 und 6 + 3y = 12, also y = 2. Probe in der zweiten Gleichung: 12 − 6 = 6."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: choice
    prompt: Wie viele Lösungen hat das System y = 2x + 1 und 2y = 4x + 2?
    params:
      options:
        - label: Unendlich viele
          correct: true
        - label: Genau eine
          feedback: Teile die zweite Gleichung durch 2.
        - label: Keine
          feedback: Keine gäbe es bei parallelen, verschiedenen Geraden.
    hints:
      - Teile 2y = 4x + 2 durch 2.
      - Vergleiche mit der ersten Gleichung.
    explanation: Beide Gleichungen beschreiben dieselbe Gerade. Jeder ihrer Punkte löst das System.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Im Stall sind Hühner und Kaninchen: 20 Köpfe und 56 Beine. Wie viele Kaninchen sind es?"
    answer:
      value: 8
    hints:
      - Wären alle Hühner, gäbe es 40 Beine. Jedes Kaninchen bringt 2 mehr.
    explanation: 16 Beine zu viel, also 8 Kaninchen und 12 Hühner.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Mit drei Unbekannten ist jede Gleichung eine **Ebene** im Raum. Drei Ebenen schneiden sich meist in genau einem Punkt – manchmal in einer Geraden oder gar nicht. Ob es genau eine Lösung gibt, verrät die Determinante.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "Löse: x + y + z = 6, x − y = −1 und y − z = −1. Wie groß ist z?"
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 2
        misconception: gave-y
        text: Das ist y. z ist um 1 größer.
    hints:
      - "Drück alles durch y aus: x = y − 1 und z = y + 1."
      - "Einsetzen: (y − 1) + y + (y + 1) = 6."
    explanation: "3y = 6, also y = 2, x = 1, z = 3. Probe: 1 + 2 + 3 = 6."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: "Die **Cramersche Regel**: Für ax + by = e und cx + dy = f ist $x = \\frac{ed - bf}{ad - bc}$. Löse so 3x + 2y = 7 und x − y = −1. Wie groß ist x?"
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == -1
        misconception: sign-error
        text: "Vorzeichen prüfen: Zähler und Nenner sind beide negativ."
    hints:
      - "Nenner: 3 · (−1) − 2 · 1 = −5."
      - "Zähler: 7 · (−1) − 2 · (−1) = −5."
    explanation: "x = −5 : (−5) = 1, dann y = 2. Ist der Nenner ad − bc null, gibt es keine eindeutige Lösung – die Geraden sind parallel."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum hat ein System aus zwei parallelen, verschiedenen Geraden keine Lösung?"
    params:
      keywords:
        - - parallel
          - gleiche steigung
          - same slope
        - - schneiden
          - schnittpunkt
          - treffen
          - meet
          - cross
          - intersect
        - - nie
          - kein
          - keine
          - never
          - no
          - none
      sample: Eine Lösung ist ein Punkt, der auf beiden Geraden liegt. Parallele Geraden haben dieselbe Steigung und schneiden sich nie. Also gibt es keinen gemeinsamen Punkt.
    explanation: Lösungen sind Schnittpunkte. Ohne Schnittpunkt keine Lösung – rechnerisch landet man bei einem Widerspruch wie 0 = 2.
    difficulty: 3
