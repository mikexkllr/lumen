id: alg.functions.systems
type: concept
title: Zwei Geraden, ein Schnittpunkt
summary: Der Schnittpunkt erfüllt beide Gleichungen zugleich.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [fn.systems]
estimated_minutes: 7
steps:
  - kind: problem
    id: schnittpunkt
    widget: graph
    prompt: Setze P genau auf den Schnittpunkt der beiden Geraden.
    params: { x: [-1, 6], y: [-1, 6], functions: [{ expr: "x + 1" }, { expr: "-x + 5" }], points: [{ id: P, x: 0, y: 0 }], showCoordinates: true }
    answer: { points: { P: { x: 2, y: 3 } } }
    hints:
      - Wo kreuzen sich die beiden orangen Linien?
    explanation: Die Geraden kreuzen sich bei (2 | 3).

  - kind: explain
    id: s2
    body: |
      Der **Schnittpunkt** liegt auf beiden Geraden.
      Seine Koordinaten erfüllen beide Gleichungen – $3 = 2 + 1$ und $3 = -2 + 5$.

  - kind: problem
    id: gleichsetzen
    widget: numeric
    prompt: 'Löse durch Gleichsetzen: $x + 1 = -x + 5$. Wie groß ist x?'
    answer: { value: 2 }
    hints:
      - Addiere auf beiden Seiten x.
      - 2x + 1 = 5.
    explanation: 2x + 1 = 5, also 2x = 4 und x = 2.

  - kind: problem
    id: tarife
    widget: choice
    body: Tarif A kostet 10 € Grundgebühr und 2 € pro Stunde. Tarif B kostet 4 € pro Stunde.
    prompt: Wann ist Tarif A günstiger?
    params:
      options:
        - { label: Ab mehr als 5 Stunden, correct: true }
        - { label: Ab mehr als 2 Stunden, feedback: "Bei 3 Stunden kostet A 16 €, B nur 12 €." }
        - { label: Nie, feedback: "Bei 10 Stunden kostet A 30 €, B aber 40 €." }
        - { label: Immer, feedback: "Bei 1 Stunde kostet A 12 €, B nur 4 €." }
    hints:
      - Wann kosten beide gleich viel? 10 + 2h = 4h.
    explanation: Bei 5 Stunden kosten beide 20 €. Danach ist A günstiger.
    difficulty: 2

  - kind: problem
    id: zweiter
    widget: numeric
    prompt: 'Wo schneiden sich $y = 2x$ und $y = x + 3$? Gib x an.'
    answer: { value: 3 }
    hints:
      - Setze gleich – 2x = x + 3.
    explanation: 2x = x + 3, also x = 3 (und y = 6).

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Zwei Geraden mit verschiedener Steigung schneiden sich genau einmal.
          right: true
        - text: Parallele Geraden schneiden sich weit draußen.
          right: false
          why: Sie schneiden sich nie – das System hat keine Lösung.
        - text: Der Schnittpunkt erfüllt beide Gleichungen.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Löse das System: x + y = 10 und x − y = 4. Wie groß ist x?"
    answer:
      value: 7
    hints:
      - Addiere beide Gleichungen – das y fällt weg.
    explanation: 2x = 14, also x = 7 und y = 3. Das ist das **Additionsverfahren**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Im Stall sind Hühner und Kaninchen: 20 Köpfe und 56 Beine. Wie viele Kaninchen sind es?"
    answer:
      value: 8
    hints:
      - Wären alle Hühner, gäbe es 40 Beine. Jedes Kaninchen bringt 2 mehr.
    explanation: 16 Beine zu viel, also 8 Kaninchen und 12 Hühner.
    difficulty: 3
