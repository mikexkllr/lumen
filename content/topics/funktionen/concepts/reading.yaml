id: alg.functions.reading
type: concept
title: Graphen lesen
summary: Hoch, tief, null – auf einen Blick.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: maximum
    widget: numeric
    visual:
      widget: graph
      params:
        x: [-1, 7]
        y: [-2, 5]
        functions: [{ expr: "-(x - 3)^2 + 4" }]
    prompt: Bei welchem x ist der Graph am höchsten?
    params: { placeholder: "x" }
    answer: { value: 3 }
    hints:
      - Suche den Gipfel.
    explanation: Der Gipfel liegt bei x = 3 mit y = 4.

  - kind: problem
    id: nullstellen
    widget: choice
    visual:
      widget: graph
      params:
        x: [-1, 7]
        y: [-2, 5]
        functions: [{ expr: "-(x - 3)^2 + 4" }]
    prompt: Wo schneidet der Graph die x-Achse?
    params:
      options:
        - { label: Bei x = 1 und x = 5, correct: true }
        - { label: Bei x = 3, feedback: "Dort ist der Gipfel, nicht die Nullstelle." }
        - { label: Bei y = 4, feedback: "Nullstellen liegen auf der x-Achse – dort ist y = 0." }
    hints:
      - Wo ist y = 0?
    explanation: Bei x = 1 und x = 5 ist y = 0.

  - kind: explain
    id: s3
    body: |
      Ein Graph erzählt eine Geschichte. **Steigt** er, wird die Größe mehr. Ein **Gipfel** ist ein Maximum.
      Wo er die x-Achse schneidet, ist der Wert null.

  - kind: problem
    id: geschichte
    widget: choice
    prompt: Ein Graph zeigt die Temperatur über einen Tag. Er steigt bis 15 Uhr und fällt dann. Was stimmt?
    params:
      options:
        - { label: Um 15 Uhr war es am wärmsten., correct: true }
        - { label: Um 15 Uhr war es am kältesten., feedback: "Bis dahin steigt die Kurve – danach fällt sie." }
        - { label: Es war den ganzen Tag gleich warm., feedback: "Dann wäre der Graph waagerecht." }
    hints:
      - Wo ist der höchste Punkt?
    explanation: Der höchste Punkt ist das Maximum – hier um 15 Uhr.

  - kind: problem
    id: mix-c1
    widget: match
    prompt: Was erzählt der Graph?
    params:
      pairs:
        - left: Der Graph steigt
          right: Die Größe nimmt zu
        - left: Der Graph fällt
          right: Die Größe nimmt ab
        - left: Ein Gipfel
          right: Der größte Wert
        - left: Schnitt mit der x-Achse
          right: Der Wert ist null
    hints:
      - Lies von links nach rechts wie einen Text.
    explanation: Mit diesen vier Mustern liest man fast jeden Graphen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Graph zeigt die Füllhöhe einer Vase beim gleichmäßigen Einfüllen. Unten ist die Vase breit, oben schmal. Wie verläuft er?
    params:
      options:
        - label: Erst flach, dann immer steiler
          correct: true
        - label: Erst steil, dann flacher
          feedback: Im breiten Teil steigt das Wasser langsam.
        - label: Als Gerade
          feedback: Das wäre nur bei einem Zylinder so.
    hints:
      - Wo steigt der Pegel schneller – im breiten oder im schmalen Teil?
    explanation: Die **Steigung** des Graphen ist die Geschwindigkeit, mit der der Pegel steigt.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: graph
    prompt: Setz P auf den höchsten Punkt des Graphen von $y = -(x - 2)^2 + 3$.
    params:
      x:
        - -2
        - 6
      y:
        - -4
        - 5
      functions:
        - expr: -(x-2)^2+3
      points:
        - id: P
          x: 0
          y: 0
    answer:
      points:
        P:
          x: 2
          y: 3
    hints:
      - Wann ist $-(x - 2)^2$ am größten?
      - Bei x = 2 ist der Abzug null.
    explanation: Das Maximum liegt bei (2 | 3). Links davon steigt der Graph, rechts fällt er.
    difficulty: 2

  - kind: explain
    id: mb-d2
    depth: 2
    body: Die Steigung der Geraden durch zwei Punkte des Graphen ist die **mittlere Änderungsrate**. Bei einem Weg-Zeit-Graphen ist das die Durchschnittsgeschwindigkeit zwischen zwei Zeitpunkten.

  - kind: problem
    id: mb-d3
    depth: 2
    widget: choice
    prompt: Ein Tempo-Zeit-Graph verläuft eine Weile waagerecht auf 50 km/h. Was heißt das?
    params:
      options:
        - label: Das Auto fährt in dieser Zeit gleichmäßig 50 km/h.
          correct: true
        - label: Das Auto steht.
          feedback: Stehen hieße Tempo 0 – die Linie läge auf der Achse.
        - label: Das Auto fährt bergauf.
          feedback: Der Graph zeigt das Tempo, nicht die Landschaft.
    hints:
      - Auf der y-Achse steht das Tempo.
      - "Waagerecht heißt: Der Wert ändert sich nicht."
    explanation: Waagerecht heißt konstant. Im Weg-Zeit-Graphen wäre dasselbe eine schräge Gerade mit Steigung 50.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Weg-Zeit-Graph steigt von (0 h | 0 km) auf (2 h | 150 km). Wie groß ist die Durchschnittsgeschwindigkeit?
    params:
      unit: km/h
    answer:
      value: 75
    hints:
      - Steigung = Höhenunterschied durch Breitenunterschied.
    explanation: "150 km : 2 h = 75 km/h. Die Steigung einer Kurve an einer Stelle ist die Momentangeschwindigkeit – die Ableitung."
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: match
    prompt: Was verrät die Ableitung f′ über den Graphen von f?
    params:
      pairs:
        - left: f′(x) > 0
          right: f steigt
        - left: f′(x) < 0
          right: f fällt
        - left: f′ wechselt von + zu −
          right: Hochpunkt
        - left: f′ wechselt von − zu +
          right: Tiefpunkt
      leftTitle: Ableitung
      rightTitle: Graph von f
    hints:
      - Die Ableitung ist die Steigung.
      - Am Gipfel kippt die Steigung von bergauf zu bergab.
    explanation: Das Vorzeichen von f′ sagt »bergauf« oder »bergab«. Ein Vorzeichenwechsel markiert einen Hoch- oder Tiefpunkt.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Ein Stein fällt. Sein Weg in Metern ist $s(t) = 5t^2$. Die Steigung des Graphen ist $10t$. Wie schnell ist er bei t = {{t}} s in m/s?
    params:
      unit: m/s
    answer:
      value: "{{10 * t}}"
    feedback:
      - when: numval(state.input) == 5 * t * t
        misconception: value-not-slope
        text: Das ist der Weg, nicht das Tempo.
      - when: numval(state.input) == 5 * t
        misconception: average-vs-instant
        text: Das ist das Durchschnittstempo seit dem Start. Gefragt ist das Tempo im Moment.
    hints:
      - Das Tempo ist die Steigung des Weg-Zeit-Graphen.
      - Setz t = {{t}} in 10t ein.
    explanation: "10 · {{t}} = {{10 * t}} m/s. Das Durchschnittstempo seit dem Start wäre nur halb so groß: {{5 * t}} m/s."
    difficulty: 3
    variants:
      params:
        t: int[3,8]
      defaults:
        t: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Woran siehst du in einem Graphen, wo die Größe am schnellsten wächst?"
    params:
      keywords:
        - - steil
          - steilste
          - steep
          - steepest
        - - steigung
          - anstieg
          - slope
          - gradient
        - - tangente
          - berühr
          - tangent
          - touch
      sample: Am schnellsten wächst sie dort, wo der Graph am steilsten bergauf geht. Die Steigung der Tangente an dieser Stelle ist am größten.
    explanation: Schnelles Wachstum heißt große Steigung. Die steilste Stelle einer S-Kurve ist ihr Wendepunkt.
    difficulty: 3

srs:
  cards_from: [maximum, geschichte]
