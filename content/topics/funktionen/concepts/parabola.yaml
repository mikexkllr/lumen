id: alg.functions.parabola
type: concept
title: Parabeln
summary: y = ax² – öffnen, stauchen, verschieben.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [fn.parabola]
estimated_minutes: 8
steps:
  - kind: problem
    id: a-finden
    widget: slider
    prompt: Stelle a so ein, dass die Parabel durch den Punkt (1 | −2) geht.
    params:
      expr: "a*x^2"
      sliders: [{ id: a, label: a, min: -3, max: 3, step: 0.5, initial: 1 }]
      markers: [{ x: 1, y: -2, label: Z }]
    answer: { values: { a: -2 } }
    hints:
      - Bei x = 1 ist x² = 1. Dann ist y = a.
    explanation: a · 1² = −2, also a = −2. Die Parabel öffnet sich nach unten.

  - kind: explain
    body: |
      $y = ax^2$ ist eine **Parabel**. Ist a positiv, öffnet sie sich nach oben – ist a negativ, nach unten.
      Je größer der Betrag von a, desto schmaler.
    visual:
      widget: slider
      interactive: true
      params:
        expr: "a*x^2"
        sliders: [{ id: a, label: a, min: -3, max: 3, step: 0.5, initial: 0.5 }]

  - kind: problem
    id: verschieben
    widget: slider
    prompt: Verschiebe deine Parabel genau auf die gestrichelte.
    params:
      expr: "(x - h)^2 + k"
      sliders:
        - { id: h, label: h, min: -3, max: 3, step: 1, initial: 0 }
        - { id: k, label: k, min: -3, max: 3, step: 1, initial: 0 }
      target: { expr: "(x - 2)^2 - 1" }
    answer: { matchTarget: true }
    feedback:
      - when: "h == -2"
        misconception: shift-direction
        text: (x − h) verschiebt nach rechts, wenn h positiv ist. Probiere h = +2.
    hints:
      - h schiebt nach links und rechts, k nach oben und unten.
    explanation: Der tiefste Punkt liegt bei (2 | −1), also h = 2 und k = −1.
    difficulty: 2

  - kind: problem
    id: scheitel
    widget: choice
    prompt: Wo liegt der tiefste Punkt (Scheitelpunkt) von $y = (x - 2)^2 - 1$?
    params:
      layout: grid
      options:
        - { label: "(2 | −1)", correct: true }
        - { label: "(−2 | −1)", feedback: "Bei (x − 2) verschiebt sich die Parabel um 2 nach rechts." }
        - { label: "(2 | 1)", feedback: "Das −1 am Ende verschiebt nach unten." }
        - { label: "(−2 | 1)", feedback: "Beide Richtungen sind vertauscht." }
    hints:
      - Für welches x wird (x − 2)² am kleinsten?
    explanation: (x − 2)² ist bei x = 2 gleich 0. Dann ist y = −1.

  - kind: problem
    id: nullstellen
    widget: numeric
    prompt: 'Wie oft schneidet $y = x^2 + 1$ die x-Achse?'
    answer: { value: 0 }
    hints:
      - Wie klein kann x² + 1 werden?
    explanation: x² ist nie negativ, also ist y immer mindestens 1. Die Parabel berührt die x-Achse nie.
    difficulty: 2
