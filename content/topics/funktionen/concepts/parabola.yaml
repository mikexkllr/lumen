id: alg.functions.parabola
type: concept
title: Parabeln
summary: y = ax² – öffnen, stauchen, verschieben.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [fn.parabola]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Bögen überall
    body: Parabeln sind die Bögen des Alltags – sie entstehen, wo etwas fliegt oder springt. Deck die Karten auf. Wo hast du heute schon eine **Parabel** gesehen?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ⛲
            front: Springbrunnen
            back: Jeder Wasserstrahl beschreibt einen Bogen – eine Parabel, die nach unten offen ist.
          - icon: 🏀
            front: Basketball
            back: Der Ball fliegt auf einer Parabel. Profis treffen den Bogen fast blind.
          - icon: 🌉
            front: Hängebrücke
            back: Die Tragseile einer Hängebrücke hängen fast genau wie eine Parabel.
          - icon: 🐬
            front: Delfinsprung
            back: Beim Sprung aus dem Wasser zeichnet der Delfin einen Bogen in die Luft.

  - kind: problem
    id: a-finden
    widget: slider
    prompt: Stelle a so ein, dass die Parabel durch den Punkt (1 | −2) geht.
    params:
      expr: "a*x^2"
      sliders: [{ id: a, label: a, min: -3, max: 3, step: 0.5, initial: 1 }]
      markers: [{ x: 1, y: -2, label: Z }]
    answer: { values: { a: -2 } }
    hints:
      - Bei x = 1 ist x² = 1. Dann ist y = a.
    explanation: a · 1² = −2, also a = −2. Die Parabel öffnet sich nach unten.

  - kind: explain
    id: s2
    body: |
      $y = ax^2$ ist eine **Parabel**. Ist a positiv, öffnet sie sich nach oben – ist a negativ, nach unten.
      Je größer der Betrag von a, desto schmaler.
    visual:
      widget: slider
      interactive: true
      params:
        expr: "a*x^2"
        sliders: [{ id: a, label: a, min: -3, max: 3, step: 0.5, initial: 0.5 }]

  - kind: problem
    id: verschieben
    widget: slider
    prompt: Verschiebe deine Parabel genau auf die gestrichelte.
    params:
      expr: "(x - h)^2 + k"
      sliders:
        - { id: h, label: h, min: -3, max: 3, step: 1, initial: 0 }
        - { id: k, label: k, min: -3, max: 3, step: 1, initial: 0 }
      target: { expr: "(x - 2)^2 - 1" }
    answer: { matchTarget: true }
    feedback:
      - when: "h == -2"
        misconception: shift-direction
        text: (x − h) verschiebt nach rechts, wenn h positiv ist. Probiere h = +2.
    hints:
      - h schiebt nach links und rechts, k nach oben und unten.
    explanation: Der tiefste Punkt liegt bei (2 | −1), also h = 2 und k = −1.
    difficulty: 2

  - kind: problem
    id: scheitel
    widget: choice
    prompt: Wo liegt der tiefste Punkt (Scheitelpunkt) von $y = (x - 2)^2 - 1$?
    params:
      layout: grid
      options:
        - { label: "(2 | −1)", correct: true }
        - { label: "(−2 | −1)", feedback: "Bei (x − 2) verschiebt sich die Parabel um 2 nach rechts." }
        - { label: "(2 | 1)", feedback: "Das −1 am Ende verschiebt nach unten." }
        - { label: "(−2 | 1)", feedback: "Beide Richtungen sind vertauscht." }
    hints:
      - Für welches x wird (x − 2)² am kleinsten?
    explanation: (x − 2)² ist bei x = 2 gleich 0. Dann ist y = −1.

  - kind: problem
    id: nullstellen
    widget: numeric
    prompt: 'Wie oft schneidet $y = x^2 + 1$ die x-Achse?'
    answer: { value: 0 }
    hints:
      - Wie klein kann x² + 1 werden?
    explanation: x² ist nie negativ, also ist y immer mindestens 1. Die Parabel berührt die x-Achse nie.
    difficulty: 2

  - kind: problem
    id: c1
    widget: match
    prompt: Was bewirkt die Änderung an $y = x^2$?
    params:
      pairs:
        - left: $y = x^2 + 3$
          right: nach oben verschoben
        - left: $y = (x - 3)^2$
          right: nach rechts verschoben
        - left: $y = -x^2$
          right: nach unten geöffnet
        - left: $y = 3x^2$
          right: schmaler
    hints:
      - Wo ist der tiefste Punkt? Setz x = 0 und x = 3 ein.
    explanation: "Achtung: (x − 3)² schiebt nach **rechts** – der Scheitel liegt dort, wo die Klammer null wird."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wo liegt der Scheitel von $y = x^2 - 6x + 5$? Gib die x-Koordinate an.
    answer:
      value: 3
    hints:
      - "Ergänze quadratisch: x² − 6x + 9 − 4."
    explanation: (x − 3)² − 4. Der Scheitel ist (3 | −4).
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Wo ist die Parabel y = x² − 2 am tiefsten? Finde die Stelle mit waagerechter Tangente.
    params:
      scene: tangent
      expr: x^2 - 2
      controls:
        x:
          value: 1.5
    answer:
      slope: 0
    explanation: Bei x = 0, im Scheitel. Links fällt die Kurve, rechts steigt sie.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Mit der **quadratischen Ergänzung** findet man den Scheitel: $x^2 - 6x + 5 = (x - 3)^2 - 9 + 5 = (x - 3)^2 - 4$. Der Scheitel ist also (3 | −4)."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie groß ist die y-Koordinate des Scheitels von $y = x^2 - {{2 * h}}x + {{h * h + k}}$?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == h
        misconception: gave-x
        text: Das ist die x-Koordinate. Setz sie ein, um y zu bekommen.
      - when: numval(state.input) == h * h + k
        misconception: intercept
        text: Das ist der y-Achsenabschnitt bei x = 0, nicht der Scheitel.
    hints:
      - Der Scheitel liegt bei x = {{h}}.
      - "Ergänze: $(x - {{h}})^2 - {{h * h}} + {{h * h + k}}$."
    explanation: $(x - {{h}})^2 + ({{k}})$, also Scheitel ({{h}} | {{k}}).
    difficulty: 2
    variants:
      params:
        h: int[1,5]
        k: int[-6,6]
      constraints:
        - h * h + k > 0
      defaults:
        h: 3
        k: -4

  - kind: problem
    id: mb-d3
    depth: 2
    widget: slider
    prompt: Stelle a, h und k so ein, dass $y = a(x - h)^2 + k$ genau auf der gestrichelten Parabel liegt.
    params:
      expr: a*(x - h)^2 + k
      sliders:
        - id: a
          label: a
          min: -2
          max: 2
          step: 0.5
          initial: 1
        - id: h
          label: h
          min: -3
          max: 3
          step: 1
          initial: 0
        - id: k
          label: k
          min: -4
          max: 4
          step: 1
          initial: 0
      target:
        expr: -0.5*(x - 1)^2 + 3
    answer:
      matchTarget: true
    hints:
      - "Erst den Scheitel treffen: Wo ist der höchste Punkt?"
      - "Dann a: Sie öffnet sich nach unten und ist breiter als die Normalparabel."
    explanation: "Scheitel (1 | 3), nach unten offen und gestaucht: a = −0,5, h = 1, k = 3."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum sind Satellitenschüsseln parabelförmig?
    params:
      options:
        - label: Eine Parabel wirft alle parallel einfallenden Strahlen in einen Punkt
          correct: true
        - label: Weil die Form am leichtesten zu bauen ist
          feedback: Eine Kugelschale wäre einfacher – sie bündelt aber unscharf.
        - label: Weil sie so dem Wind standhalten
          feedback: Es geht um die Bündelung der Signale.
    hints:
      - Der Empfänger sitzt an einem ganz bestimmten Punkt.
    explanation: Dieser Punkt heißt **Brennpunkt**. Autoscheinwerfer nutzen dasselbe rückwärts.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: choice
    prompt: Für $y = ax^2 + bx + c$ ist die Steigung $2ax + b$. Wo liegt also der Scheitel?
    params:
      options:
        - label: Bei $x = -\frac{b}{2a}$
          correct: true
        - label: Bei $x = \frac{b}{2a}$
          feedback: "Vorzeichen prüfen: 2ax + b = 0 heißt 2ax = −b."
        - label: Bei $x = -\frac{b}{a}$
          feedback: Der Faktor 2 aus der Ableitung fehlt.
    hints:
      - Im Scheitel ist die Steigung null.
      - Löse 2ax + b = 0 nach x.
    explanation: "2ax + b = 0 ergibt x = −b : (2a). Probe mit x² − 6x + 5: 6 : 2 = 3."
    difficulty: 3

  - kind: explain
    id: mb-x2
    depth: 3
    body: Jede Parabel $y = \frac{x^2}{4f}$ hat einen **Brennpunkt** bei (0 | f). Alle senkrecht einfallenden Strahlen werden genau dorthin gespiegelt. Darum sitzt der Empfänger einer Satellitenschüssel im Brennpunkt.

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Eine Schüssel hat das Profil $y = \frac{x^2}{ {{4 * f}} }$ (in dm). In welcher Höhe in dm muss der Empfänger sitzen?
    params:
      unit: dm
    answer:
      value: "{{f}}"
    feedback:
      - when: numval(state.input) == 4 * f
        misconception: forgot-four
        text: Der Nenner ist 4f, nicht f. Teile durch 4.
    hints:
      - Vergleiche mit $\frac{x^2}{4f}$.
      - 4f = {{4 * f}}.
    explanation: 4f = {{4 * f}}, also f = {{f}} dm.
    difficulty: 3
    variants:
      params:
        f: int[1,6]
      defaults:
        f: 2

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie findest du den Scheitel von y = x² − 6x + 5 ohne Zeichnung?"
    params:
      keywords:
        - - ergänzung
          - ergänzen
          - binom
          - complete
          - square
          - quadrat
        - - (x − 3)
          - drei
          - three
          - x = 3
        - - −4
          - minus 4
          - minus vier
          - minus four
      sample: "Ich ergänze quadratisch: x² − 6x + 5 = (x − 3)² − 9 + 5 = (x − 3)² − 4. Das Quadrat ist bei x = 3 am kleinsten, nämlich null. Also liegt der Scheitel bei (3 | −4), minus vier."
    explanation: "Die Scheitelform $(x - h)^2 + k$ zeigt den Scheitel direkt: (h | k)."
    difficulty: 3
