id: alg.functions.reading
type: concept
title: Reading graphs
summary: High, low, zero – at a glance.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: maximum
    widget: numeric
    visual:
      widget: graph
      params:
        x: [-1, 7]
        y: [-2, 5]
        functions: [{ expr: "-(x - 3)^2 + 4" }]
    prompt: At which x is the graph highest?
    params: { placeholder: "x" }
    answer: { value: 3 }
    hints:
      - Look for the peak.
    explanation: The peak is at x = 3 with y = 4.

  - kind: problem
    id: nullstellen
    widget: choice
    visual:
      widget: graph
      params:
        x: [-1, 7]
        y: [-2, 5]
        functions: [{ expr: "-(x - 3)^2 + 4" }]
    prompt: Where does the graph cross the x-axis?
    params:
      options:
        - { label: At x = 1 and x = 5, correct: true }
        - { label: At x = 3, feedback: "That is the peak, not a root." }
        - { label: At y = 4, feedback: "Roots lie on the x-axis – there y = 0." }
    hints:
      - Where is y = 0?
    explanation: At x = 1 and x = 5, y = 0.

  - kind: explain
    body: |
      A graph tells a story. When it **rises**, the quantity grows. A **peak** is a maximum.
      Where it crosses the x-axis, the value is zero.

  - kind: problem
    id: geschichte
    widget: choice
    prompt: A graph shows the temperature over a day. It rises until 3 p.m. and then falls. What is true?
    params:
      options:
        - { label: It was warmest at 3 p.m., correct: true }
        - { label: It was coldest at 3 p.m., feedback: "Until then the curve rises – after that it falls." }
        - { label: It was equally warm all day., feedback: "Then the graph would be horizontal." }
    hints:
      - Where is the highest point?
    explanation: The highest point is the maximum – here at 3 p.m.

srs:
  cards_from: [maximum, geschichte]
