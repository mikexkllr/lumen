id: alg.functions.reading
type: concept
title: Reading graphs
summary: High, low, zero – at a glance.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: maximum
    widget: numeric
    visual:
      widget: graph
      params:
        x: [-1, 7]
        y: [-2, 5]
        functions: [{ expr: "-(x - 3)^2 + 4" }]
    prompt: At which x is the graph highest?
    params: { placeholder: "x" }
    answer: { value: 3 }
    hints:
      - Look for the peak.
    explanation: The peak is at x = 3 with y = 4.

  - kind: problem
    id: nullstellen
    widget: choice
    visual:
      widget: graph
      params:
        x: [-1, 7]
        y: [-2, 5]
        functions: [{ expr: "-(x - 3)^2 + 4" }]
    prompt: Where does the graph cross the x-axis?
    params:
      options:
        - { label: At x = 1 and x = 5, correct: true }
        - { label: At x = 3, feedback: "That is the peak, not a root." }
        - { label: At y = 4, feedback: "Roots lie on the x-axis – there y = 0." }
    hints:
      - Where is y = 0?
    explanation: At x = 1 and x = 5, y = 0.

  - kind: explain
    id: s3
    body: |
      A graph tells a story. When it **rises**, the quantity grows. A **peak** is a maximum.
      Where it crosses the x-axis, the value is zero.

  - kind: problem
    id: geschichte
    widget: choice
    prompt: A graph shows the temperature over a day. It rises until 3 p.m. and then falls. What is true?
    params:
      options:
        - { label: It was warmest at 3 p.m., correct: true }
        - { label: It was coldest at 3 p.m., feedback: "Until then the curve rises – after that it falls." }
        - { label: It was equally warm all day., feedback: "Then the graph would be horizontal." }
    hints:
      - Where is the highest point?
    explanation: The highest point is the maximum – here at 3 p.m.

  - kind: problem
    id: mix-c1
    widget: match
    prompt: What does the graph tell?
    params:
      pairs:
        - left: The graph rises
          right: The quantity grows
        - left: The graph falls
          right: The quantity shrinks
        - left: A peak
          right: The largest value
        - left: Crossing the x-axis
          right: The value is zero
    hints:
      - Read from left to right like a text.
    explanation: With these four patterns you can read almost any graph.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A graph shows the water level in a vase filled at a steady rate. The vase is wide below and narrow on top. How does it run?
    params:
      options:
        - label: Flat at first, then steeper and steeper
          correct: true
        - label: Steep first, then flatter
          feedback: In the wide part the water rises slowly.
        - label: As a straight line
          feedback: That would only be so for a cylinder.
    hints:
      - Where does the level rise faster – in the wide or the narrow part?
    explanation: The **slope** of the graph is the speed at which the level rises.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: graph
    prompt: Put P on the highest point of the graph of $y = -(x - 2)^2 + 3$.
    params:
      x:
        - -2
        - 6
      y:
        - -4
        - 5
      functions:
        - expr: -(x-2)^2+3
      points:
        - id: P
          x: 0
          y: 0
    answer:
      points:
        P:
          x: 2
          y: 3
    hints:
      - When is $-(x - 2)^2$ largest?
      - At x = 2 nothing is subtracted.
    explanation: The maximum is at (2 | 3). To its left the graph rises, to its right it falls.
    difficulty: 2

  - kind: explain
    id: mb-d2
    depth: 2
    body: The slope of the line through two points of a graph is the **average rate of change**. For a distance–time graph it is the average speed between two moments.

  - kind: problem
    id: mb-d3
    depth: 2
    widget: choice
    prompt: A speed–time graph runs flat at 50 km/h for a while. What does that mean?
    params:
      options:
        - label: The car drives at a steady 50 km/h then.
          correct: true
        - label: Standing still means speed 0 – the line would lie on the axis.
          feedback: Stehen hieße Tempo 0 – die Linie läge auf der Achse.
        - label: The graph shows speed, not the landscape.
          feedback: Der Graph zeigt das Tempo, nicht die Landschaft.
    hints:
      - The y-axis shows the speed.
      - "Flat means: the value does not change."
    explanation: Flat means constant. In a distance–time graph the same would be a slanted line with slope 50.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A distance–time graph rises from (0 h, 0 km) to (2 h, 150 km). What is the average speed?
    params:
      unit: km/h
    answer:
      value: 75
    hints:
      - Slope = rise over run.
    explanation: 150 km ÷ 2 h = 75 km/h. The slope of a curve at a point is the instantaneous speed – the derivative.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: match
    prompt: What does the derivative f′ tell you about the graph of f?
    params:
      pairs:
        - left: f′(x) > 0
          right: f rises
        - left: f′(x) < 0
          right: f falls
        - left: f′ changes from + to −
          right: maximum
        - left: f′ changes from − to +
          right: minimum
      leftTitle: Derivative
      rightTitle: Graph of f
    hints:
      - The derivative is the slope.
      - At a peak the slope flips from uphill to downhill.
    explanation: The sign of f′ says »uphill« or »downhill«. A change of sign marks a maximum or minimum.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: A stone falls. Its distance in metres is $s(t) = 5t^2$. The slope of the graph is $10t$. How fast is it at t = {{t}} s, in m/s?
    params:
      unit: m/s
    answer:
      value: "{{10 * t}}"
    feedback:
      - when: numval(state.input) == 5 * t * t
        misconception: value-not-slope
        text: That is the distance, not the speed.
      - when: numval(state.input) == 5 * t
        misconception: average-vs-instant
        text: That is the average speed since the start. The question asks for the speed at that moment.
    hints:
      - Speed is the slope of the distance–time graph.
      - Put t = {{t}} into 10t.
    explanation: "10 · {{t}} = {{10 * t}} m/s. The average speed since the start is only half that: {{5 * t}} m/s."
    difficulty: 3
    variants:
      params:
        t: int[3,8]
      defaults:
        t: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: how do you see in a graph where the quantity grows fastest?"
    params:
      keywords:
        - - steil
          - steilste
          - steep
          - steepest
        - - steigung
          - anstieg
          - slope
          - gradient
        - - tangente
          - berühr
          - tangent
          - touch
      sample: It grows fastest where the graph climbs most steeply. The slope of the tangent at that point is largest.
    explanation: Fast growth means a large slope. The steepest point of an S-curve is its inflection point.
    difficulty: 3

srs:
  cards_from: [maximum, geschichte]
