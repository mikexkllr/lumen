id: alg.functions.table
type: concept
title: Functions and value tables
summary: Exactly one y for every x.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [fn.table]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The number machine
    body: A vending machine gives exactly one drink for each button – never two. A **function** works the same way. Turn over the cards in order and follow what the machine does with the number.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 📥
            front: "In: x = 4"
            back: The machine gets a number, here 4.
          - icon: ⚙️
            front: "Rule: times 3, minus 1"
            back: 4 · 3 − 1 = 11. The rule is always the same.
          - icon: 📤
            front: "Out: y = 11"
            back: Every x has exactly one y. That makes the machine a function.

  - kind: problem
    id: taxi
    widget: numeric
    body: A taxi costs a 3 € base fare and 1 € per kilometer.
    prompt: What does a 5 km ride cost?
    params: { unit: "€" }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 5"
        text: The 3 € base fare always applies.
    hints:
      - Base fare plus 5 kilometers.
    explanation: 3 € + 5 · 1 € = 8 €.

  - kind: explain
    id: s2
    body: |
      A **function** assigns exactly one y to every x.
      For the taxi, $y = x + 3$ – x is the kilometers, y the price.
    visual:
      widget: graph
      params: { x: [0, 8], y: [0, 10], functions: [{ expr: "x + 3" }], points: [{ id: P, x: 5, y: 8, draggable: false }] }

  - kind: problem
    id: punkt
    widget: graph
    prompt: Plot the point for a 4 km ride.
    params: { x: [0, 8], y: [0, 10], points: [{ id: P, x: 0, y: 0 }] }
    answer: { points: { P: { x: 4, y: 7 } } }
    feedback:
      - when: "state.points.P.x == 7 && state.points.P.y == 4"
        misconception: swapped-coordinates
        text: The kilometers go on the x-axis, the price on the y-axis.
    hints:
      - x = 4 km. What does that cost?
      - 3 € + 4 € = 7 €.
    explanation: At x = 4, y = 4 + 3 = 7.

  - kind: problem
    id: tabelle
    widget: choice
    body: |
      x = 0 → y = 1
      x = 1 → y = 3
      x = 2 → y = 5
      x = 3 → y = 7
    prompt: Which function fits the table?
    params:
      options:
        - { label: "$y = 2x + 1$", correct: true }
        - { label: "$y = x + 1$", feedback: "Check x = 2 – that gives 3, not 5." }
        - { label: "$y = 2x$", feedback: "Check x = 0 – that gives 0, not 1." }
        - { label: "$y = x + 2$", feedback: "Check x = 0 – that gives 2, not 1." }
    hints:
      - By how much does y grow when x grows by 1?
    explanation: y grows by 2 per step and starts at 1.

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: "For $y = {{m}}x {{b < 0 ? '-' : '+'}} {{abs(b)}}$: What is y at x = {{x}}?"
    answer: { value: "{{m * x + b}}" }
    hints:
      - "Plug in {{x}} for x."
    explanation: "{{m}} · {{x}} {{b < 0 ? '−' : '+'}} {{abs(b)}} = {{m * x + b}}."
    variants:
      params: { m: "int[2,5]", b: "nonzero[-3,5]", x: "int[1,6]" }
      defaults: { m: 3, b: -2, x: 4 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Each day is assigned its maximum temperature.
          right: true
        - text: Each number is assigned its divisors.
          right: false
          why: 12 would have six values – only one is allowed.
        - text: Each circle is assigned its area.
          right: true
        - text: Each age is assigned all people of that age.
          right: false
      left: Not a function
      right: Function

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "For $f(x) = 3x - 2$: for which x is f(x) = 19?"
    answer:
      value: 7
    hints:
      - Solve 3x − 2 = 19.
    explanation: 3x = 21, so x = 7. Going backwards through a function means solving an equation.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: buckets
    prompt: Function or not? A function gives every input exactly one output.
    params:
      buckets:
        - id: b1
          label: Function
        - id: b2
          label: Not a function
      items:
        - label: person → their birthday
          bucket: b1
        - label: number x → x²
          bucket: b1
        - label: time → temperature in Rome
          bucket: b1
        - label: date → who has a birthday that day
          bucket: b2
        - label: number → its divisors
          bucket: b2
        - label: x → y with x² + y² = 25
          bucket: b2
    hints:
      - "For each input ask: can there be two outputs?"
      - For x = 3 both y = 4 and y = −4 satisfy x² + y² = 25.
    explanation: Many people share a birthday, 12 has several divisors, a circle has two y-values for one x. The others give exactly one result.
    difficulty: 2

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: For $f(x) = {{m}}x + {{b}}$ we have $f(x) = {{m * x + b}}$. What is x?
    answer:
      value: "{{x}}"
    feedback:
      - when: numval(state.input) == m * (m * x + b) + b
        misconception: forward-not-back
        text: You applied f again. You need to go backwards.
    hints:
      - "Backwards: first subtract {{b}}, then divide by {{m}}."
      - ({{m * x + b}} − {{b}}) / {{m}}.
    explanation: "({{m * x + b}} − {{b}}) / {{m}} = {{x}}. That is the inverse function: $f^{-1}(y) = (y - {{b}}) / {{m}}$."
    difficulty: 2
    variants:
      params:
        m: int[2,6]
        b: int[1,9]
        x: int[2,9]
      defaults:
        m: 2
        b: 3
        x: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: $f(x) = 2x + 1$ and $g(x) = x^2$. What is $g(f(3))$?
    answer:
      value: 49
    hints:
      - "Inside first: f(3) = 7."
    explanation: g(7) = 49. But f(g(3)) = 19 – in **composition** the order matters.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: The **inverse function** undoes f. Its graph is f mirrored in the line y = x. It exists only if no y occurs twice. That is why x² is only inverted for x ≥ 0 – giving √x.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "With $f(x) = 2x + 1$ and $g(x) = x^2$: what is $f(g(3))$?"
    answer:
      value: 19
    feedback:
      - when: numval(state.input) == 49
        misconception: order-of-composition
        text: That is g(f(3)). In f(g(3)) you apply g first.
    hints:
      - "Inside first: g(3) = 9."
      - Then f(9).
    explanation: "g(3) = 9, f(9) = 19. The other way gives 49: composition is not commutative."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Which function can be inverted on all real numbers?
    params:
      options:
        - label: $f(x) = x^3$
          correct: true
        - label: 2 and −2 have the same square. Going back would be ambiguous.
          feedback: 2 und −2 haben dasselbe Quadrat. Zurück ginge es nicht eindeutig.
        - label: "|3| = |−3|. Two inputs, one output."
          feedback: "|3| = |−3|. Zwei Eingänge, ein Ausgang."
        - label: The sine repeats – each value occurs infinitely often.
          feedback: Der Sinus wiederholt sich – jeder Wert kommt unendlich oft vor.
    hints:
      - "Invertible means: no y-value occurs twice."
      - A function that rises everywhere hits each value only once.
    explanation: x³ is strictly increasing everywhere. So every y has exactly one preimage, the cube root.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Tell Lux: what makes a rule a function?"
    params:
      keywords:
        - - jedem
          - jede
          - each
          - every
        - - genau
          - eindeutig
          - exactly
          - unique
          - nur
        - - eingang
          - x-wert
          - input
          - ausgang
          - output
          - y-wert
      sample: A function assigns each input exactly one output. Two inputs may share a result, but one input may never have two different ones.
    explanation: The key is »exactly one« per input. Backwards it may be ambiguous.
    difficulty: 3

srs:
  cards_from: ["einsetzen"]
