id: logic.sets.three
type: concept
title: Three sets
summary: Eight regions, neatly sorted.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: alle-drei
    widget: venn
    prompt: Shade everyone who has all three hobbies.
    params: { sets: [Math, Music, Sports] }
    answer: { regions: [ABC] }
    hints:
      - Where do all three circles overlap?
    explanation: The small piece in the middle.

  - kind: problem
    id: zwei-ohne
    widget: venn
    prompt: Shade Math and Music, but not Sports.
    params: { sets: [Math, Music, Sports] }
    answer: { regions: [AB] }
    feedback:
      - when: "has('ABC')"
        misconception: includes-all
        text: The middle includes Sports too. That is not wanted.
    hints:
      - Find the overlap of Math and Music – without the Sports circle.
    explanation: The overlap of Math and Music, without the middle.

  - kind: explain
    id: s3
    body: With three sets, there are **eight** regions. Seven lie inside the circles, one outside. Each person belongs to exactly one of them.

  - kind: problem
    id: genau-zwei
    widget: venn
    prompt: Shade everyone with exactly two of the three hobbies.
    params: { sets: [Math, Music, Sports] }
    answer: { regions: [AB, AC, BC] }
    hints:
      - There are three such regions. The middle does not count.
    explanation: The three overlaps of two circles each – without the middle.

  - kind: problem
    id: sport-zaehlen
    widget: numeric
    visual: { widget: venn, params: { sets: [Math, Music, Sports], counts: { A: 5, B: 3, C: 4, AB: 2, AC: 1, BC: 2, ABC: 1 } } }
    prompt: How many people do sports?
    params: { unit: people }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: only-exclusive
        text: That is only "sports only". Count the overlaps in the Sports circle too.
    hints:
      - Add all the numbers in the Sports circle.
    explanation: 4 + 1 + 2 + 1 = 8.

  - kind: problem
    id: vereinigung-drei
    widget: venn
    prompt: Shade Math ∪ Sports.
    params: { sets: [Math, Music, Sports] }
    answer: { regions: [A, C, AB, AC, BC, ABC] }
    hints:
      - Everything in the Math circle or in the Sports circle.
    explanation: Two full circles – six of the eight regions.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Four sets can no longer be fully drawn with circles. How many regions would a diagram for **four** sets need?
    answer:
      value: 16
    hints:
      - For 2 sets there are 4, for 3 there are 8.
    explanation: 2⁴ = 16. Four circles only manage 14 – you need ellipses.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: venn
    prompt: "Shade: music, but neither maths nor sport."
    params:
      sets:
        - Maths
        - Music
        - Sport
    answer:
      regions:
        - B
    feedback:
      - when: has('AB') || has('BC')
        misconception: partial-exclusion
        text: That region includes maths or sport.
    hints:
      - Only the music circle – without any overlap.
      - It is exactly one region.
    explanation: Music ∖ (maths ∪ sport) is the part of the music circle that touches no other circle.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: venn
    prompt: Shade (maths ∪ music) ∩ sport.
    params:
      sets:
        - Maths
        - Music
        - Sport
    answer:
      regions:
        - AC
        - BC
        - ABC
    feedback:
      - when: has('C')
        misconception: union-first
        text: The "sport only" region is not in maths ∪ music.
    hints:
      - "Brackets first: maths or music. Then keep only what also lies in the sport circle."
      - Three regions lie in the sport circle and also in maths or music.
    explanation: Sport with maths, sport with music, and the centre. That equals (maths ∩ sport) ∪ (music ∩ sport).
    difficulty: 2

  - kind: problem
    id: la-d3
    depth: 2
    widget: numeric
    prompt: The numbers show how many people are in each region. How many have **exactly two** hobbies?
    visual:
      widget: venn
      params:
        sets:
          - Maths
          - Music
          - Sport
        counts:
          A: 5
          B: 4
          C: 6
          AB: 2
          AC: 3
          BC: 1
          ABC: 1
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 7
        misconception: includes-centre
        text: The centre does not count – there it is three hobbies.
    hints:
      - "Exactly two: the three overlaps without the centre."
      - Add 2 + 3 + 1.
    explanation: 2 + 3 + 1 = 6. The person in the centre has all three hobbies.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which statement is the same as “not (A or B)”?
    params:
      options:
        - label: Neither A nor B – that is, not A **and** not B
          correct: true
        - label: Not A **or** not B
          feedback: That would be the opposite of “A and B”.
        - label: A and B
          feedback: That is a small part of “A or B”.
    hints:
      - Shade everything outside both circles in the Venn diagram.
    explanation: "**De Morgan’s** rule: negation turns “or” into “and”."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Two circles meet in at most 2 points. Into how many regions can **four** circles divide the plane at most – counting the outside?
    answer:
      value: 14
    feedback:
      - when: numval(state.input) == 16
        misconception: assume-16
        text: A Venn diagram for four sets needs 16 regions. Circles only manage 14.
    hints:
      - "One circle: 2 regions. Each new circle is cut into arcs by the old ones, and every arc splits a region."
      - "The k-th circle meets the old ones in at most 2(k − 1) points and gains that many regions: 2, 4, 8, …"
    explanation: 2 + 2 + 4 + 6 = 14, in general n² − n + 2. Four sets need 16 regions, so they are drawn with ellipses or other shapes.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why a Venn diagram with three sets has exactly eight regions.
    params:
      keywords:
        - - drin
          - innen
          - nicht
          - in
          - out
          - inside
        - - jede
          - drei
          - each
          - three
        - - 2 · 2 · 2
          - 2³
          - zwei hoch drei
          - 2^3
          - acht
          - eight
      sample: "For each of the three sets there are two options: in or not in. That gives 2 · 2 · 2 = 8 combinations, so eight regions."
    difficulty: 3

srs:
  cards_from: [zwei-ohne, sport-zaehlen]
