id: logic.sets.infinity
type: concept
title: Hilbert's Hotel
summary: Infinity plus one is infinity.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A hotel without end
    body: Full is full – says common sense. With **infinity**, that gut feeling fails. Uncover the cards and discover how strange infinite sets are.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏨
            front: Hilbert's idea
            back: Around 1924, the mathematician David Hilbert invented a hotel with infinitely many rooms.
          - icon: 🧦
            front: Pairs instead of counting
            back: Two sets are the same size if every element has exactly one partner – no counting needed.
          - icon: 🤯
            front: Part equals whole?
            back: With infinite sets, a part can be just as big as the whole.
          - icon: ♾️
            front: The sign ∞
            back: The sideways eight for "infinity" was introduced by John Wallis in 1655.

  - kind: problem
    id: voll
    widget: choice
    body: A hotel has infinitely many rooms – 1, 2, 3, … All are occupied. A new guest arrives.
    prompt: Can the guest get a room?
    params:
      options:
        - { label: "Yes – everyone moves one room over, room 1 becomes free", correct: true }
        - { label: "No – everything is full", feedback: "With infinitely many rooms, there is no last one. Everyone can move one over." }
    hints:
      - The guest in room n moves to n + 1.
    explanation: Everyone moves one room over – room 1 is free. Infinity plus one is still infinity.

  - kind: explain
    id: s2
    body: |
      **Infinite sets** follow new rules. There are just as many even numbers as natural numbers – every number n pairs with exactly one even number 2n.

  - kind: problem
    id: bus
    widget: choice
    prompt: A bus with infinitely many guests arrives. How do you fit them all in?
    params:
      options:
        - { label: Each current guest moves to room 2n – the odd rooms become free., correct: true }
        - { label: It is not possible., feedback: "It is possible – with a trick." }
        - { label: Everyone moves one room over., feedback: "That frees up only one spot." }
    hints:
      - How many odd rooms are there?
    explanation: The current guests take only the even rooms. The infinitely many odd rooms are free.

  - kind: problem
    id: paar
    widget: numeric
    prompt: The natural number {{n}} is paired with the even number 2n. Which even number goes with {{n}}?
    params: { placeholder: "Number" }
    answer: { value: "{{2 * n}}" }
    hints:
      - Double it.
    explanation: "2 · {{n}} = {{2 * n}}. This way every number gets exactly one partner."
    variants:
      params: { n: "int[7,500]" }
      defaults: { n: 37 }

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: Hilbert’s hotel has infinitely many rooms and is full. A new guest arrives, so everyone moves one room on. Which room does the guest from room 7 move to?
    answer:
      value: 8
    hints:
      - Everyone moves from n to n + 1.
    explanation: Room 8. Room 1 becomes free – although the hotel was full.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Are there more fractions than natural numbers?
    params:
      options:
        - label: No – all fractions can be numbered in one list
          correct: true
        - label: Yes – infinitely many fractions lie between two numbers, after all
          feedback: Still they can be counted – zigzagging through a table.
        - label: That cannot be compared
          feedback: It can – by pairing.
    hints:
      - "Write all fractions in a table: numerators across, denominators down."
    explanation: Cantor’s zigzag path reaches every fraction. Both sets are **countably** infinite.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Hilbert's Hotel is full. A bus with {{k}} guests arrives. Every old guest moves {{k}} rooms along. Which room does the guest from room {{n}} move to?
    answer:
      value: "{{n + k}}"
    hints:
      - Room n becomes room n + {{k}}.
      - This frees rooms 1 to {{k}}.
    explanation: Room {{n}} + {{k}} = {{n + k}}. Rooms 1 to {{k}} are free for the bus. Finitely many newcomers always fit.
    difficulty: 2
    variants:
      params:
        k: int[3,9]
        n: int[10,99]
      defaults:
        k: 5
        n: 20

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Now infinitely many buses arrive, each with infinitely many guests. Do they all fit?
    params:
      options:
        - label: Yes – the old guests move to the even rooms, guest j from bus i to room 3^i · 5^j.
          correct: true
        - label: No, that is too many.
          feedback: Pairs (bus, seat) can be numbered – just like fractions.
        - label: Only if the hotel is empty first.
          feedback: The old guests move to the even rooms – then plenty is free.
    hints:
      - "Each guest is determined by two numbers: bus and seat."
      - Numbers like 3^i · 5^j are odd and always different for different pairs.
    explanation: Because prime factorisations are unique, each pair (i, j) gets its own room. Countable times countable is still countable.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Cantor proved: the real numbers can **not** be numbered. What is the key idea?"
    params:
      options:
        - label: For any list you build a number that differs from the n-th at the n-th digit
          correct: true
        - label: The list would be too long to write down
          feedback: That is true of any infinite list – including the natural numbers.
        - label: Real numbers have too many digits
          feedback: What matters is that one number is always missing.
    hints:
      - Go along the diagonal of the list and change every digit.
    explanation: "The **diagonal argument**: there are infinities of different sizes. The same idea proves the halting problem."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: how can a full hotel with infinitely many rooms still take one more guest?"
    params:
      keywords:
        - - weiter
          - nächste
          - next
          - move
          - rück
          - zieh
        - - zimmer
          - room
        - - frei
          - leer
          - free
          - empty
          - platz
        - - unendlich
          - infinit
          - ende
          - end
          - letzte
          - last
      min: 3
      sample: "Every guest moves one room along: from room n to n + 1. Because there are infinitely many rooms, everyone finds the next one – and room 1 becomes free."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Cantor showed that the set of all subsets of M is always bigger than M. What follows for infinite sets?
    params:
      options:
        - label: There is no largest infinity.
          correct: true
        - label: All infinite sets are the same size.
          feedback: Already the subsets of the natural numbers outnumber the numbers themselves.
        - label: That only holds for finite sets.
          feedback: The surprise is exactly that it holds for every set, infinite ones included.
    hints:
      - From M form its subsets, then the subsets of those, and so on.
      - Each step gives a strictly bigger set.
    explanation: ℕ, then the subsets of ℕ, then their subsets … each level is bigger. The proof is a diagonal argument, like the one for the real numbers.
    difficulty: 3

srs:
  cards_from: [voll, bus]
