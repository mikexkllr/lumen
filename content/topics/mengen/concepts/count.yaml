id: logic.sets.count
type: concept
title: Richtig zählen
summary: Wer doppelt zählt, liegt daneben.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: mindestens-eins
    widget: numeric
    prompt: "{{k}} Leute trinken Kaffee, {{t}} trinken Tee, {{b}} trinken beides. Wie viele trinken mindestens eins davon?"
    params: { unit: Leute }
    answer: { value: "{{k + t - b}}" }
    feedback:
      - when: "numval(state.input) == k + t"
        misconception: double-count
        text: Die {{b}}, die beides trinken, hast du doppelt gezählt.
    hints:
      - Wer beides trinkt, steckt in beiden Zahlen.
    explanation: "{{k}} + {{t}} − {{b}} = {{k + t - b}}."
    variants:
      params: { k: "int[8,16]", t: "int[6,12]", b: "int[2,5]" }
      defaults: { k: 12, t: 9, b: 4 }

  - kind: explain
    id: s2
    body: |
      Wer in beiden Mengen ist, wird beim Addieren **doppelt** gezählt.
      Deshalb gilt: |A ∪ B| = |A| + |B| − |A ∩ B|.
    visual: { widget: venn, params: { sets: ["Kaffee (12)", "Tee (9)"], counts: { A: 8, B: 5, AB: 4 } } }

  - kind: problem
    id: keins
    widget: numeric
    prompt: "In einem Haus wohnen {{n}} Leute. {{f}} haben ein Rad, {{a}} ein Auto, {{b}} beides. Wie viele haben keins von beiden?"
    params: { unit: Leute }
    answer: { value: "{{n - (f + a - b)}}" }
    feedback:
      - when: "numval(state.input) == f + a - b"
        misconception: complement
        text: Das sind die mit mindestens einem. Gesucht sind die übrigen.
    hints:
      - Rechne erst aus, wie viele mindestens eins haben.
    explanation: "{{f}} + {{a}} − {{b}} = {{f + a - b}} haben eins. Übrig bleiben {{n - (f + a - b)}}."
    variants:
      params: { n: "int[28,40]", f: "int[12,18]", a: "int[10,15]", b: "int[4,8]" }
      constraints: ["n - (f + a - b) > 0"]
      defaults: { n: 30, f: 18, a: 15, b: 7 }

  - kind: problem
    id: genau-eins
    widget: venn
    prompt: Färbe alle, die genau eins von beiden mögen.
    params: { sets: [Pizza, Pasta], counts: { A: 7, B: 5, AB: 3 } }
    answer: { regions: [A, B] }
    hints:
      - Genau eins – also nicht beides.
    explanation: Die beiden äußeren Teile, zusammen 12 Leute.

  - kind: explain
    id: s5
    body: Eine Umfrage meldet – 60 % mögen Pizza, 50 % mögen Pasta. Geht das überhaupt?
    reveal:
      body: Ja. Zusammen sind das 110 %. Also müssen **mindestens 10 %** beides mögen. Überlappende Gruppen addieren sich nicht zu 100.

  - kind: problem
    id: ueberlapp
    widget: numeric
    prompt: "{{p}} % mögen Pizza, {{q}} % mögen Pasta. Wie viel Prozent mögen mindestens beides?"
    params: { unit: "%" }
    answer: { value: "{{p + q - 100}}" }
    hints:
      - Mehr als 100 % kann es nicht geben. Wie viel ist zu viel?
    explanation: "{{p}} + {{q}} = {{p + q}}. Die {{p + q - 100}} % über 100 müssen doppelt dabei sein."
    variants:
      params: { p: "step[55,85,5]", q: "step[40,70,5]" }
      constraints: ["p + q > 100"]
      defaults: { p: 60, q: 50 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "30 Schüler: 18 spielen Fußball, 15 Basketball, 5 keins von beiden. Wie viele spielen beides?"
    answer:
      value: 8
    hints:
      - 25 spielen mindestens eins. 18 + 15 = 33.
    explanation: 33 − 25 = 8 wurden doppelt gezählt.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: In einer Klasse mögen {{a}} Kinder Mathe und {{b}} Kunst. {{u}} Kinder mögen mindestens eins davon. Wie viele mögen beides?
    answer:
      value: "{{a + b - u}}"
    feedback:
      - when: numval(state.input) == a + b
        misconception: no-subtract
        text: Das ist die Summe beider Gruppen. Davon ziehst du die {{u}} ab.
    hints:
      - Stelle die Formel |A ∪ B| = |A| + |B| − |A ∩ B| um.
      - "|A ∩ B| = |A| + |B| − |A ∪ B|."
    explanation: "{{a}} + {{b}} = {{a + b}} zählt alle, die beides mögen, doppelt. Der Überschuss über {{u}} ist genau die Schnittmenge: {{a + b - u}}."
    difficulty: 2
    variants:
      params:
        a: int[10,20]
        b: int[8,18]
        s: int[2,7]
      derive:
        u: a + b - s
      constraints:
        - u > a
        - u > b
      defaults:
        a: 12
        b: 9
        s: 4

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: In einer Gruppe von {{n}} Leuten haben {{k}} eine Katze und {{h}} einen Hund. Wie viele haben **mindestens** beides?
    answer:
      value: "{{k + h - n}}"
    feedback:
      - when: numval(state.input) == min(k, h)
        misconception: max-vs-min
        text: So viele haben höchstens beides. Gefragt ist das Minimum.
    hints:
      - Wie viele Plätze gibt es überhaupt in der Gruppe?
      - "{{k}} + {{h}} = {{k + h}} – das sind mehr als {{n}} Leute. Der Überschuss muss doppelt sein."
    explanation: Mindestens {{k + h - n}} haben beides, denn {{k + h}} Haustier-Halter passen nicht in {{n}} Personen. Höchstens sind es {{min(k, h)}}.
    difficulty: 2
    variants:
      params:
        n: int[20,40]
        k: int[12,30]
        h: int[12,30]
      constraints:
        - k < n
        - h < n
        - k + h > n
      defaults:
        n: 30
        k: 20
        h: 16

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Drei Mengen: |A| = 10, |B| = 12, |C| = 8. Je zwei haben 4 gemeinsam, alle drei 2. Wie viele Elemente gibt es insgesamt?"
    answer:
      value: 20
    hints:
      - Einzeln addieren, Paare abziehen, Dreifaches wieder dazu.
    explanation: "30 − 12 + 2 = 20. Das **Prinzip von Einschluss und Ausschluss**: abwechselnd plus und minus."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Wie viele Zahlen von 1 bis 100 sind durch 2, 3 **oder** 5 teilbar?
    answer:
      value: 74
    feedback:
      - when: numval(state.input) == 103
        misconception: no-overlap
        text: Du hast nur addiert. Zahlen wie 6 oder 10 hast du doppelt gezählt.
      - when: numval(state.input) == 71
        misconception: forgot-triple
        text: Fast! Die Vielfachen von 30 musst du am Ende wieder dazunehmen.
    hints:
      - "Einzeln: 50 + 33 + 20. Paare: durch 6, 10 und 15 teilbar – 16 + 10 + 6 abziehen."
      - Durch alle drei (also 30) teilbar sind 3 Zahlen – die kommen wieder dazu.
    explanation: "50 + 33 + 20 − 16 − 10 − 6 + 3 = 74. Das ist das **Ein- und Ausschlussprinzip**: abwechselnd addieren und abziehen."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man bei |A ∪ B| die Schnittmenge abziehen muss.
    params:
      keywords:
        - - doppelt
          - zweimal
          - twice
          - double
        - - schnitt
          - beides
          - beide
          - intersection
          - both
        - - abzieh
          - zieht
          - minus
          - subtrah
          - subtract
      sample: Wer in beiden Mengen ist, wird beim Addieren von |A| und |B| doppelt gezählt. Darum zieht man die Schnittmenge einmal ab.
    difficulty: 3

srs:
  cards_from: [mindestens-eins, keins]
