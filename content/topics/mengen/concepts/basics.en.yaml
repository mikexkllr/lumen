id: logic.sets.basics
type: concept
title: Intersection and union
summary: And, or, neither – as a picture.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: beides
    widget: venn
    prompt: Shade everyone who drinks coffee **and** tea.
    params: { sets: [Coffee, Tea] }
    answer: { regions: [AB] }
    hints:
      - Anyone who drinks both is in both circles at once.
    explanation: That is the area where the circles overlap.

  - kind: explain
    id: s2
    body: |
      The **intersection** A ∩ B contains everything that is in both.
      The **union** A ∪ B contains everything that is in at least one.
      Tap regions and compare.
    visual: { widget: venn, interactive: true, params: { sets: [A, B] } }

  - kind: problem
    id: vereinigung
    widget: venn
    prompt: Shade Coffee ∪ Tea – everyone who drinks at least one of the two.
    params: { sets: [Coffee, Tea] }
    answer: { regions: [A, B, AB] }
    feedback:
      - when: "has('AB') && !has('A') && !has('B')"
        misconception: union-as-intersection
        text: That is only the intersection. At least one means the outer parts too.
    hints:
      - At least one includes "both".
    explanation: The union covers both circles completely.

  - kind: problem
    id: nur-kaffee
    widget: venn
    prompt: Shade everyone who drinks coffee but not tea.
    params: { sets: [Coffee, Tea] }
    answer: { regions: [A] }
    hints:
      - Anyone who drinks both does not belong.
    explanation: Only the part of the coffee circle without the overlap.

  - kind: problem
    id: weder
    widget: venn
    prompt: Shade everyone who drinks **neither** coffee nor tea.
    params: { sets: [Coffee, Tea], outside: true }
    answer: { regions: [O] }
    hints:
      - These people are in neither circle.
    explanation: That is the area outside both circles.

  - kind: problem
    id: symbol
    widget: choice
    prompt: What does A ∩ B describe?
    params:
      options:
        - { label: "Everything that is in A and in B.", correct: true }
        - { label: "Everything that is in A or in B.", feedback: "That is the union A ∪ B." }
        - { label: "Everything that is in A but not in B.", feedback: "That is written A ∖ B." }
    hints:
      - The ∩ sign looks like an arch joining both circles.
    explanation: ∩ is the intersection – the shared piece.

  - kind: problem
    id: c1
    widget: match
    prompt: Which symbol fits?
    params:
      pairs:
        - left: in A **and** in B
          right: A ∩ B
        - left: in A **or** in B
          right: A ∪ B
        - left: in A but not in B
          right: A ∖ B
        - left: not in A
          right: complement of A
    hints:
      - "∩ looks like a gate: only what fits through both."
    explanation: Set symbols are shorthand for “and”, “or” and “not”.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A = {1, 2, 3, 4, 5} and B = {4, 5, 6, 7}. How many elements does A ∪ B have?
    answer:
      value: 7
    hints:
      - Count 4 and 5 only once.
    explanation: 5 + 4 − 2 = 7.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A set has 5 elements. How many **subsets** does it have – counting the empty set and itself?
    answer:
      value: 32
    hints:
      - Each element is in or out.
    explanation: 2⁵ = 32. The set of all subsets is called the **power set** – hence the name.
    difficulty: 3

srs:
  cards_from: [vereinigung, nur-kaffee]
