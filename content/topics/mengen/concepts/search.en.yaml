id: logic.sets.search
type: concept
title: Searching like a pro
summary: AND, OR, NOT in search engines.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: und
    widget: venn
    prompt: You search for "recipe AND vegan". Which pages do you get? Shade the area.
    params: { sets: [Recipe, vegan] }
    answer: { regions: [AB] }
    hints:
      - AND means both must appear.
    explanation: Only pages that contain both words – the intersection.

  - kind: problem
    id: oder
    widget: venn
    prompt: Now "cat OR dog". Shade all the hits.
    params: { sets: [Cat, Dog] }
    answer: { regions: [A, B, AB] }
    hints:
      - One of the two is enough.
    explanation: OR gives the union – many more hits.

  - kind: explain
    id: s3
    body: |
      Search engines and databases work with sets. **AND** shrinks the hits, **OR** grows them, **NOT** cuts something out.

  - kind: problem
    id: nicht
    widget: venn
    prompt: '"Jaguar NOT car" – you want the animal. Shade the hits.'
    params: { sets: [Jaguar, Car] }
    answer: { regions: [A] }
    hints:
      - Everything with Jaguar, but without car.
    explanation: Only the part of Jaguar outside Car.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which search returns the **fewest** hits?
    params:
      options:
        - label: dog AND cat AND bird
          correct: true
        - label: dog OR cat OR bird
          feedback: OR enlarges the result set.
        - label: dog
          feedback: Every additional AND condition narrows further.
    hints:
      - Every AND forms an intersection.
    explanation: The intersection is never larger than the smallest set involved.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is “A AND (B OR C)” the same as “(A AND B) OR C”?
    params:
      options:
        - label: No – in the second everything in C counts, even without A
          correct: true
        - label: Yes – brackets do not matter
          feedback: Take an element that lies only in C.
        - label: Only for empty sets
          feedback: In general they differ.
    hints:
      - "If an element lies only in C: is it in the first expression? In the second?"
    explanation: "Brackets decide. Correct is: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C) – the **distributive law**."
    difficulty: 3

srs:
  cards_from: [oder, nicht]
