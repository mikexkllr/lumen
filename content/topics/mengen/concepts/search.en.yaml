id: logic.sets.search
type: concept
title: Searching like a pro
summary: AND, OR, NOT in search engines.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: und
    widget: venn
    prompt: You search for "recipe AND vegan". Which pages do you get? Shade the area.
    params: { sets: [Recipe, vegan] }
    answer: { regions: [AB] }
    hints:
      - AND means both must appear.
    explanation: Only pages that contain both words – the intersection.

  - kind: problem
    id: oder
    widget: venn
    prompt: Now "cat OR dog". Shade all the hits.
    params: { sets: [Cat, Dog] }
    answer: { regions: [A, B, AB] }
    hints:
      - One of the two is enough.
    explanation: OR gives the union – many more hits.

  - kind: explain
    body: |
      Search engines and databases work with sets. **AND** shrinks the hits, **OR** grows them, **NOT** cuts something out.

  - kind: problem
    id: nicht
    widget: venn
    prompt: '"Jaguar NOT car" – you want the animal. Shade the hits.'
    params: { sets: [Jaguar, Car] }
    answer: { regions: [A] }
    hints:
      - Everything with Jaguar, but without car.
    explanation: Only the part of Jaguar outside Car.

srs:
  cards_from: [oder, nicht]
