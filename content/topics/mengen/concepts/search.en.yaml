id: logic.sets.search
type: concept
title: Searching like a pro
summary: AND, OR, NOT in search engines.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: How a search engine thinks
    body: Every web search is a little logic program. The switches say whether a page contains "cat" or "dog". Flip them and switch the gate between **AND** and OR. When does the page count as a hit?
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: K
            label: cat
          - id: H
            label: dog
        gates:
          - id: g
            type: "?"
            in:
              - K
              - H
            options:
              - AND
              - OR
        outputs:
          - id: Q
            from: g
            label: Hit

  - kind: problem
    id: und
    widget: venn
    prompt: You search for "recipe AND vegan". Which pages do you get? Shade the area.
    params: { sets: [Recipe, vegan] }
    answer: { regions: [AB] }
    hints:
      - AND means both must appear.
    explanation: Only pages that contain both words – the intersection.

  - kind: problem
    id: oder
    widget: venn
    prompt: Now "cat OR dog". Shade all the hits.
    params: { sets: [Cat, Dog] }
    answer: { regions: [A, B, AB] }
    hints:
      - One of the two is enough.
    explanation: OR gives the union – many more hits.

  - kind: explain
    id: s3
    body: |
      **Search engines** and databases work with sets. **AND** shrinks the hits, **OR** grows them, **NOT** cuts something out.

  - kind: problem
    id: nicht
    widget: venn
    prompt: '"Jaguar NOT car" – you want the animal. Shade the hits.'
    params: { sets: [Jaguar, Car] }
    answer: { regions: [A] }
    hints:
      - Everything with Jaguar, but without car.
    explanation: Only the part of Jaguar outside Car.

  - kind: problem
    id: intro-c1
    widget: gates
    prompt: The lamp should show the hits for "cat NOT dog". Choose the right gate.
    params:
      inputs:
        - id: K
          label: cat
        - id: H
          label: dog
      gates:
        - id: n
          type: NOT
          in:
            - H
        - id: g
          type: "?"
          in:
            - K
            - n
          options:
            - OR
            - AND
      outputs:
        - id: Q
          from: g
          label: Hit
    check:
      predicate: table('Q') == [0, 0, 1, 0]
    hints:
      - A page is only a hit if "cat" appears and "dog" is missing.
      - "Both must hold at once: choose AND."
    explanation: '"Cat NOT dog" means: cat AND not dog. The lamp is on only when K is on and H is off.'

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which search returns the **fewest** hits?
    params:
      options:
        - label: dog AND cat AND bird
          correct: true
        - label: dog OR cat OR bird
          feedback: OR enlarges the result set.
        - label: dog
          feedback: Every additional AND condition narrows further.
    hints:
      - Every AND forms an intersection.
    explanation: The intersection is never larger than the smallest set involved.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: venn
    prompt: You search for "recipe AND (vegan OR quick)". Shade all hits.
    params:
      sets:
        - Recipe
        - vegan
        - quick
    answer:
      regions:
        - AB
        - AC
        - ABC
    feedback:
      - when: has('B') || has('C') || has('BC')
        misconception: or-outside
        text: Every hit must be a recipe – stay inside the recipe circle.
    hints:
      - All hits lie inside the recipe circle.
      - Of those, only the regions that are also vegan or quick.
    explanation: "Three regions: vegan recipes, quick recipes and both. The brackets decide what is combined first."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: A search for "cat" finds 800 pages, "dog" finds 600. 200 pages contain both. How many hits does "cat NOT dog" give?
    answer:
      value: 600
    feedback:
      - when: numval(state.input) == 200
        misconception: kept-overlap
        text: Those are the pages with both – exactly the ones that are removed.
      - when: numval(state.input) == 1200
        misconception: or-instead
        text: That would be "cat OR dog".
    hints:
      - NOT cuts the dog circle out of the cat circle.
      - Compute 800 − 200.
    explanation: 800 − 200 = 600. "A NOT B" is the difference A ∖ B.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is “A AND (B OR C)” the same as “(A AND B) OR C”?
    params:
      options:
        - label: No – in the second everything in C counts, even without A
          correct: true
        - label: Yes – brackets do not matter
          feedback: Take an element that lies only in C.
        - label: Only for empty sets
          feedback: In general they differ.
    hints:
      - "If an element lies only in C: is it in the first expression? In the second?"
    explanation: "Brackets decide. Correct is: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C) – the **distributive law**."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Which search gives exactly the same hits as "NOT (cat OR dog)"?
    params:
      options:
        - label: NOT cat AND NOT dog
          correct: true
        - label: NOT cat OR NOT dog
          feedback: That would also find pages with only cats.
        - label: cat AND dog
          feedback: That is nearly the opposite.
    hints:
      - '"Not (A or B)" means: neither A nor B.'
      - When you negate, AND and OR swap places.
    explanation: "This is one of De Morgan's laws: ¬(A ∨ B) = ¬A ∧ ¬B. In the Venn diagram it is the region outside both circles."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how AND, OR and NOT change the number of search hits.
    params:
      keywords:
        - - und
          - and
        - - oder
          - or
        - - nicht
          - not
        - - weniger
          - mehr
          - kleiner
          - größer
          - fewer
          - more
          - smaller
          - larger
      sample: AND needs both, so there are fewer hits. OR needs only one, so there are more. NOT cuts a part out and also gives fewer hits.
    difficulty: 3

srs:
  cards_from: [oder, nicht]
