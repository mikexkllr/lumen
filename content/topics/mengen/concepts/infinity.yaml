id: logic.sets.infinity
type: concept
title: Hilberts Hotel
summary: Unendlich plus eins ist unendlich.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Hotel ohne Ende
    body: Was voll ist, ist voll – sagt der Verstand. Bei **Unendlichkeit** versagt dieses Bauchgefühl. Deck die Karten auf und entdecke, wie seltsam unendliche Mengen sind.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏨
            front: Hilberts Idee
            back: Der Mathematiker David Hilbert erfand um 1924 ein Hotel mit unendlich vielen Zimmern.
          - icon: 🧦
            front: Paare statt Zählen
            back: Zwei Mengen sind gleich groß, wenn jedes Element genau einen Partner hat – ganz ohne Zählen.
          - icon: 🤯
            front: Teil gleich Ganzes?
            back: Bei unendlichen Mengen kann ein Teil genauso groß sein wie das Ganze.
          - icon: ♾️
            front: Das Zeichen ∞
            back: Die liegende Acht für »unendlich« führte John Wallis im Jahr 1655 ein.

  - kind: problem
    id: voll
    widget: choice
    body: Ein Hotel hat unendlich viele Zimmer – 1, 2, 3, … Alle sind belegt. Ein neuer Gast kommt.
    prompt: Kann er ein Zimmer bekommen?
    params:
      options:
        - { label: "Ja – jeder zieht ein Zimmer weiter, Zimmer 1 wird frei", correct: true }
        - { label: "Nein – alles ist voll", feedback: "Bei unendlich vielen Zimmern gibt es kein letztes. Jeder kann eins weiter." }
    hints:
      - Gast aus Zimmer n zieht nach n + 1.
    explanation: Jeder rückt eins weiter – Zimmer 1 ist frei. Unendlich plus eins bleibt unendlich.

  - kind: explain
    id: s2
    body: |
      Bei **unendlichen Mengen** gelten neue Regeln. Es gibt genauso viele gerade Zahlen wie natürliche Zahlen – jede Zahl n passt zu genau einer geraden Zahl 2n.

  - kind: problem
    id: bus
    widget: choice
    prompt: Ein Bus mit unendlich vielen Gästen kommt. Wie bringt man alle unter?
    params:
      options:
        - { label: Jeder Alte zieht in Zimmer 2n – die ungeraden werden frei., correct: true }
        - { label: Es geht nicht., feedback: "Es geht – mit einem Trick." }
        - { label: Alle ziehen ein Zimmer weiter., feedback: "Das schafft nur einen freien Platz." }
    hints:
      - Wie viele ungerade Zimmer gibt es?
    explanation: Die alten Gäste belegen nur die geraden Zimmer. Die unendlich vielen ungeraden sind frei.

  - kind: problem
    id: paar
    widget: numeric
    prompt: Die natürliche Zahl {{n}} wird mit der geraden Zahl 2n gepaart. Welche gerade Zahl gehört zu {{n}}?
    params: { placeholder: "Zahl" }
    answer: { value: "{{2 * n}}" }
    hints:
      - Verdoppeln.
    explanation: "2 · {{n}} = {{2 * n}}. So bekommt jede Zahl genau einen Partner."
    variants:
      params: { n: "int[7,500]" }
      defaults: { n: 37 }

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: Hilberts Hotel hat unendlich viele Zimmer und ist voll. Ein neuer Gast kommt, also rückt jeder ein Zimmer weiter. In welches Zimmer zieht der Gast aus Zimmer 7?
    answer:
      value: 8
    hints:
      - Jeder zieht von n nach n + 1.
    explanation: Zimmer 8. Zimmer 1 wird frei – obwohl das Hotel voll war.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Gibt es mehr Brüche als natürliche Zahlen?
    params:
      options:
        - label: Nein – man kann alle Brüche in einer Liste durchnummerieren
          correct: true
        - label: Ja – zwischen zwei Zahlen liegen ja unendlich viele Brüche
          feedback: Trotzdem lassen sie sich abzählen – im Zickzack durch eine Tabelle.
        - label: Das lässt sich nicht vergleichen
          feedback: Doch – über Paarbildung.
    hints:
      - "Schreib alle Brüche in eine Tabelle: Zähler nach rechts, Nenner nach unten."
    explanation: Cantors Zickzack-Weg erreicht jeden Bruch. Beide Mengen sind **abzählbar** unendlich.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Hilberts Hotel ist voll. Ein Bus mit {{k}} Gästen kommt. Jeder alte Gast rückt {{k}} Zimmer weiter. In welches Zimmer zieht der Gast aus Zimmer {{n}}?
    answer:
      value: "{{n + k}}"
    hints:
      - Aus Zimmer n wird Zimmer n + {{k}}.
      - Die Zimmer 1 bis {{k}} werden so frei.
    explanation: Zimmer {{n}} + {{k}} = {{n + k}}. Die Zimmer 1 bis {{k}} sind frei für den Bus. Endlich viele Neue passen immer hinein.
    difficulty: 2
    variants:
      params:
        k: int[3,9]
        n: int[10,99]
      defaults:
        k: 5
        n: 20

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Jetzt kommen unendlich viele Busse mit je unendlich vielen Gästen. Passen alle hinein?
    params:
      options:
        - label: Ja – die Alten ziehen in die geraden Zimmer, Gast j aus Bus i in Zimmer 3^i · 5^j.
          correct: true
        - label: Nein, das sind zu viele.
          feedback: Paare (Bus, Platz) lassen sich durchnummerieren – wie die Brüche.
        - label: Nur, wenn das Hotel vorher leer ist.
          feedback: Die alten Gäste ziehen in die geraden Zimmer – dann ist viel frei.
    hints:
      - "Jeder Gast ist durch zwei Zahlen bestimmt: Bus und Sitzplatz."
      - Zahlen wie 3^i · 5^j sind ungerade und für verschiedene Paare immer verschieden.
    explanation: Wegen der eindeutigen Primfaktorzerlegung bekommt jedes Paar (i, j) ein eigenes Zimmer. Abzählbar mal abzählbar bleibt **abzählbar**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Cantor bewies: Die reellen Zahlen lassen sich **nicht** durchnummerieren. Was ist die Kernidee?"
    params:
      options:
        - label: Zu jeder Liste baut man eine Zahl, die sich von der n-ten an der n-ten Stelle unterscheidet
          correct: true
        - label: Die Liste wäre zu lang zum Aufschreiben
          feedback: Das gilt für jede unendliche Liste – auch für die natürlichen Zahlen.
        - label: Reelle Zahlen haben zu viele Stellen
          feedback: Entscheidend ist, dass immer eine Zahl fehlt.
    hints:
      - Geh die Diagonale der Liste entlang und ändere jede Ziffer.
    explanation: "Das **Diagonalargument**: Es gibt verschieden große Unendlichkeiten. Dieselbe Idee beweist das Halteproblem."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie kann ein volles Hotel mit unendlich vielen Zimmern noch einen Gast aufnehmen?"
    params:
      keywords:
        - - weiter
          - nächste
          - next
          - move
          - rück
          - zieh
        - - zimmer
          - room
        - - frei
          - leer
          - free
          - empty
          - platz
        - - unendlich
          - infinit
          - ende
          - end
          - letzte
          - last
      min: 3
      sample: "Jeder Gast zieht ein Zimmer weiter: von Zimmer n nach n + 1. Weil es unendlich viele Zimmer gibt, findet jeder das nächste – und Zimmer 1 wird frei."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Cantor zeigte: Die Menge aller Teilmengen von M ist immer größer als M. Was folgt für unendliche Mengen?"
    params:
      options:
        - label: Es gibt keine größte Unendlichkeit.
          correct: true
        - label: Alle unendlichen Mengen sind gleich groß.
          feedback: Schon die Teilmengen der natürlichen Zahlen sind mehr als die Zahlen selbst.
        - label: Das gilt nur für endliche Mengen.
          feedback: Gerade bei unendlichen Mengen ist das die Überraschung – es gilt für jede Menge.
    hints:
      - Bilde aus M die Teilmengen, daraus wieder die Teilmengen, und so weiter.
      - Jeder Schritt liefert eine echt größere Menge.
    explanation: ℕ, dann die Teilmengen von ℕ, dann deren Teilmengen … Jede Stufe ist größer. Der Beweis ist ein **Diagonalargument**, wie bei den reellen Zahlen.
    difficulty: 3

srs:
  cards_from: [voll, bus]
