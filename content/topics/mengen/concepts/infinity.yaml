id: logic.sets.infinity
type: concept
title: Hilberts Hotel
summary: Unendlich plus eins ist unendlich.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: voll
    widget: choice
    body: Ein Hotel hat unendlich viele Zimmer – 1, 2, 3, … Alle sind belegt. Ein neuer Gast kommt.
    prompt: Kann er ein Zimmer bekommen?
    params:
      options:
        - { label: "Ja – jeder zieht ein Zimmer weiter, Zimmer 1 wird frei", correct: true }
        - { label: "Nein – alles ist voll", feedback: "Bei unendlich vielen Zimmern gibt es kein letztes. Jeder kann eins weiter." }
    hints:
      - Gast aus Zimmer n zieht nach n + 1.
    explanation: Jeder rückt eins weiter – Zimmer 1 ist frei. Unendlich plus eins bleibt unendlich.

  - kind: explain
    body: |
      Bei unendlichen Mengen gelten neue Regeln. Es gibt genauso viele gerade Zahlen wie natürliche Zahlen – jede Zahl n passt zu genau einer geraden Zahl 2n.

  - kind: problem
    id: bus
    widget: choice
    prompt: Ein Bus mit unendlich vielen Gästen kommt. Wie bringt man alle unter?
    params:
      options:
        - { label: Jeder Alte zieht in Zimmer 2n – die ungeraden werden frei., correct: true }
        - { label: Es geht nicht., feedback: "Es geht – mit einem Trick." }
        - { label: Alle ziehen ein Zimmer weiter., feedback: "Das schafft nur einen freien Platz." }
    hints:
      - Wie viele ungerade Zimmer gibt es?
    explanation: Die alten Gäste belegen nur die geraden Zimmer. Die unendlich vielen ungeraden sind frei.

  - kind: problem
    id: paar
    widget: numeric
    prompt: Die natürliche Zahl {{n}} wird mit der geraden Zahl 2n gepaart. Welche gerade Zahl gehört zu {{n}}?
    params: { placeholder: "Zahl" }
    answer: { value: "{{2 * n}}" }
    hints:
      - Verdoppeln.
    explanation: "2 · {{n}} = {{2 * n}}. So bekommt jede Zahl genau einen Partner."
    variants:
      params: { n: "int[7,500]" }
      defaults: { n: 37 }

srs:
  cards_from: [voll, bus]
