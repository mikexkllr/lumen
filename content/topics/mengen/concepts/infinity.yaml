id: logic.sets.infinity
type: concept
title: Hilberts Hotel
summary: Unendlich plus eins ist unendlich.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: voll
    widget: choice
    body: Ein Hotel hat unendlich viele Zimmer – 1, 2, 3, … Alle sind belegt. Ein neuer Gast kommt.
    prompt: Kann er ein Zimmer bekommen?
    params:
      options:
        - { label: "Ja – jeder zieht ein Zimmer weiter, Zimmer 1 wird frei", correct: true }
        - { label: "Nein – alles ist voll", feedback: "Bei unendlich vielen Zimmern gibt es kein letztes. Jeder kann eins weiter." }
    hints:
      - Gast aus Zimmer n zieht nach n + 1.
    explanation: Jeder rückt eins weiter – Zimmer 1 ist frei. Unendlich plus eins bleibt unendlich.

  - kind: explain
    id: s2
    body: |
      Bei unendlichen Mengen gelten neue Regeln. Es gibt genauso viele gerade Zahlen wie natürliche Zahlen – jede Zahl n passt zu genau einer geraden Zahl 2n.

  - kind: problem
    id: bus
    widget: choice
    prompt: Ein Bus mit unendlich vielen Gästen kommt. Wie bringt man alle unter?
    params:
      options:
        - { label: Jeder Alte zieht in Zimmer 2n – die ungeraden werden frei., correct: true }
        - { label: Es geht nicht., feedback: "Es geht – mit einem Trick." }
        - { label: Alle ziehen ein Zimmer weiter., feedback: "Das schafft nur einen freien Platz." }
    hints:
      - Wie viele ungerade Zimmer gibt es?
    explanation: Die alten Gäste belegen nur die geraden Zimmer. Die unendlich vielen ungeraden sind frei.

  - kind: problem
    id: paar
    widget: numeric
    prompt: Die natürliche Zahl {{n}} wird mit der geraden Zahl 2n gepaart. Welche gerade Zahl gehört zu {{n}}?
    params: { placeholder: "Zahl" }
    answer: { value: "{{2 * n}}" }
    hints:
      - Verdoppeln.
    explanation: "2 · {{n}} = {{2 * n}}. So bekommt jede Zahl genau einen Partner."
    variants:
      params: { n: "int[7,500]" }
      defaults: { n: 37 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Gibt es mehr Brüche als natürliche Zahlen?
    params:
      options:
        - label: Nein – man kann alle Brüche in einer Liste durchnummerieren
          correct: true
        - label: Ja – zwischen zwei Zahlen liegen ja unendlich viele Brüche
          feedback: Trotzdem lassen sie sich abzählen – im Zickzack durch eine Tabelle.
        - label: Das lässt sich nicht vergleichen
          feedback: Doch – über Paarbildung.
    hints:
      - "Schreib alle Brüche in eine Tabelle: Zähler nach rechts, Nenner nach unten."
    explanation: Cantors Zickzack-Weg erreicht jeden Bruch. Beide Mengen sind **abzählbar** unendlich.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Cantor bewies: Die reellen Zahlen lassen sich **nicht** durchnummerieren. Was ist die Kernidee?"
    params:
      options:
        - label: Zu jeder Liste baut man eine Zahl, die sich von der n-ten an der n-ten Stelle unterscheidet
          correct: true
        - label: Die Liste wäre zu lang zum Aufschreiben
          feedback: Das gilt für jede unendliche Liste – auch für die natürlichen Zahlen.
        - label: Reelle Zahlen haben zu viele Stellen
          feedback: Entscheidend ist, dass immer eine Zahl fehlt.
    hints:
      - Geh die Diagonale der Liste entlang und ändere jede Ziffer.
    explanation: "Das **Diagonalargument**: Es gibt verschieden große Unendlichkeiten. Dieselbe Idee beweist das Halteproblem."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie kann ein volles Hotel mit unendlich vielen Zimmern noch einen Gast aufnehmen?"
    params:
      keywords:
        - - weiter
          - nächste
          - next
          - move
          - rück
          - zieh
        - - zimmer
          - room
        - - frei
          - leer
          - free
          - empty
          - platz
        - - unendlich
          - infinit
          - ende
          - end
          - letzte
          - last
      min: 3
      sample: "Jeder Gast zieht ein Zimmer weiter: von Zimmer n nach n + 1. Weil es unendlich viele Zimmer gibt, findet jeder das nächste – und Zimmer 1 wird frei."
    difficulty: 3

srs:
  cards_from: [voll, bus]
