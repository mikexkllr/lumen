id: logic.sets.three
type: concept
title: Drei Mengen
summary: Acht Bereiche, klar sortiert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: alle-drei
    widget: venn
    prompt: Färbe alle, die alle drei Hobbys haben.
    params: { sets: [Mathe, Musik, Sport] }
    answer: { regions: [ABC] }
    hints:
      - Wo liegen alle drei Kreise übereinander?
    explanation: Das kleine Stück in der Mitte.

  - kind: problem
    id: zwei-ohne
    widget: venn
    prompt: Färbe – Mathe und Musik, aber nicht Sport.
    params: { sets: [Mathe, Musik, Sport] }
    answer: { regions: [AB] }
    feedback:
      - when: "has('ABC')"
        misconception: includes-all
        text: In der Mitte ist auch Sport dabei. Das soll ja nicht sein.
    hints:
      - Suche die Überlappung von Mathe und Musik – ohne den Sport-Kreis.
    explanation: Die Überlappung von Mathe und Musik, ohne die Mitte.

  - kind: explain
    id: s3
    body: Bei drei Mengen gibt es **acht** Bereiche. Sieben liegen in den Kreisen, einer außerhalb. Jeder Mensch gehört zu genau einem davon.

  - kind: problem
    id: genau-zwei
    widget: venn
    prompt: Färbe alle mit genau zwei der drei Hobbys.
    params: { sets: [Mathe, Musik, Sport] }
    answer: { regions: [AB, AC, BC] }
    hints:
      - Es gibt drei solche Bereiche. Die Mitte gehört nicht dazu.
    explanation: Die drei Überlappungen von je zwei Kreisen – ohne die Mitte.

  - kind: problem
    id: sport-zaehlen
    widget: numeric
    visual: { widget: venn, params: { sets: [Mathe, Musik, Sport], counts: { A: 5, B: 3, C: 4, AB: 2, AC: 1, BC: 2, ABC: 1 } } }
    prompt: Wie viele Leute machen Sport?
    params: { unit: Leute }
    answer: { value: 8 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: only-exclusive
        text: Das ist nur »nur Sport«. Zähl auch die Überlappungen im Sport-Kreis.
    hints:
      - Addiere alle Zahlen im Sport-Kreis.
    explanation: 4 + 1 + 2 + 1 = 8.

  - kind: problem
    id: vereinigung-drei
    widget: venn
    prompt: Färbe Mathe ∪ Sport.
    params: { sets: [Mathe, Musik, Sport] }
    answer: { regions: [A, C, AB, AC, BC, ABC] }
    hints:
      - Alles, was im Mathe-Kreis oder im Sport-Kreis liegt.
    explanation: Zwei volle Kreise – sechs der acht Bereiche.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Vier Mengen lassen sich mit Kreisen nicht mehr vollständig darstellen. Wie viele Bereiche bräuchte ein Diagramm für **vier** Mengen?
    answer:
      value: 16
    hints:
      - Bei 2 Mengen sind es 4, bei 3 sind es 8.
    explanation: 2⁴ = 16. Vier Kreise schaffen nur 14 – man braucht Ellipsen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welche Aussage ist dasselbe wie »nicht (A oder B)«?
    params:
      options:
        - label: Weder A noch B – also nicht A **und** nicht B
          correct: true
        - label: Nicht A **oder** nicht B
          feedback: Das wäre das Gegenteil von »A und B«.
        - label: A und B
          feedback: Das ist ein kleiner Teil von »A oder B«.
    hints:
      - Färbe im Venn-Diagramm alles außerhalb beider Kreise.
    explanation: "Die Regel von **De Morgan**: Beim Verneinen wird aus »oder« ein »und«."
    difficulty: 3

srs:
  cards_from: [zwei-ohne, sport-zaehlen]
