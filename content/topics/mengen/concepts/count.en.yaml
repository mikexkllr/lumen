id: logic.sets.count
type: concept
title: Counting correctly
summary: If you count twice, you are off.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Don't count twice
    body: Surveys often count wrong – because some people get counted twice. C means coffee, T means tea. Shade everyone who drinks **at least one** of them. The counter counts each person only once.
    visual:
      widget: pixels
      interactive: true
      params:
        counter: true
        labels:
          - - C
            - CT
            - T
            - –
          - - T
            - C
            - CT
            - C
          - - CT
            - –
            - C
            - T

  - kind: problem
    id: mindestens-eins
    widget: numeric
    prompt: "{{k}} people drink coffee, {{t}} drink tea, {{b}} drink both. How many drink at least one of them?"
    params: { unit: people }
    answer: { value: "{{k + t - b}}" }
    feedback:
      - when: "numval(state.input) == k + t"
        misconception: double-count
        text: You counted the {{b}} who drink both twice.
    hints:
      - Anyone who drinks both is in both numbers.
    explanation: "{{k}} + {{t}} − {{b}} = {{k + t - b}}."
    variants:
      params: { k: "int[8,16]", t: "int[6,12]", b: "int[2,5]" }
      defaults: { k: 12, t: 9, b: 4 }

  - kind: explain
    id: s2
    body: |
      Anyone in both sets is counted **twice** when you add.
      So: |A ∪ B| = |A| + |B| − |A ∩ B|.
    visual: { widget: venn, params: { sets: ["Coffee (12)", "Tea (9)"], counts: { A: 8, B: 5, AB: 4 } } }

  - kind: problem
    id: keins
    widget: numeric
    prompt: "{{n}} people live in a building. {{f}} have a bike, {{a}} have a car, {{b}} have both. How many have neither?"
    params: { unit: people }
    answer: { value: "{{n - (f + a - b)}}" }
    feedback:
      - when: "numval(state.input) == f + a - b"
        misconception: complement
        text: That is those with at least one. You need the rest.
    hints:
      - First work out how many have at least one.
    explanation: "{{f}} + {{a}} − {{b}} = {{f + a - b}} have one. That leaves {{n - (f + a - b)}}."
    variants:
      params: { n: "int[28,40]", f: "int[12,18]", a: "int[10,15]", b: "int[4,8]" }
      constraints: ["n - (f + a - b) > 0"]
      defaults: { n: 30, f: 18, a: 15, b: 7 }

  - kind: problem
    id: genau-eins
    widget: venn
    prompt: Shade everyone who likes exactly one of the two.
    params: { sets: [Pizza, Pasta], counts: { A: 7, B: 5, AB: 3 } }
    answer: { regions: [A, B] }
    hints:
      - Exactly one – so not both.
    explanation: The two outer parts, 12 people together.

  - kind: explain
    id: s5
    body: A survey reports that 60% like pizza and 50% like pasta. Is that even possible?
    reveal:
      body: Yes. Together that is 110%. So **at least 10%** must like both. Overlapping groups do not add up to 100.

  - kind: problem
    id: ueberlapp
    widget: numeric
    prompt: "{{p}}% like pizza, {{q}}% like pasta. What percent like both, at the very least?"
    params: { unit: "%" }
    answer: { value: "{{p + q - 100}}" }
    hints:
      - There cannot be more than 100%. How much is too much?
    explanation: "{{p}} + {{q}} = {{p + q}}. The {{p + q - 100}}% above 100 must be counted twice."
    variants:
      params: { p: "step[55,85,5]", q: "step[40,70,5]" }
      constraints: ["p + q > 100"]
      defaults: { p: 60, q: 50 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "30 pupils: 18 play football, 15 basketball, 5 neither. How many play both?"
    answer:
      value: 8
    hints:
      - 25 play at least one. 18 + 15 = 33.
    explanation: 33 − 25 = 8 were counted twice.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: In a class, {{a}} children like maths and {{b}} like art. {{u}} children like at least one of them. How many like both?
    answer:
      value: "{{a + b - u}}"
    feedback:
      - when: numval(state.input) == a + b
        misconception: no-subtract
        text: That is the sum of both groups. Subtract the {{u}} from it.
    hints:
      - Rearrange the formula |A ∪ B| = |A| + |B| − |A ∩ B|.
      - "|A ∩ B| = |A| + |B| − |A ∪ B|."
    explanation: "{{a}} + {{b}} = {{a + b}} counts those who like both twice. The excess over {{u}} is exactly the intersection: {{a + b - u}}."
    difficulty: 2
    variants:
      params:
        a: int[10,20]
        b: int[8,18]
        s: int[2,7]
      derive:
        u: a + b - s
      constraints:
        - u > a
        - u > b
      defaults:
        a: 12
        b: 9
        s: 4

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: In a group of {{n}} people, {{k}} have a cat and {{h}} have a dog. How many have **at least** both?
    answer:
      value: "{{k + h - n}}"
    feedback:
      - when: numval(state.input) == min(k, h)
        misconception: max-vs-min
        text: That is the most who can have both. We want the minimum.
    hints:
      - How many places are there in the group at all?
      - "{{k}} + {{h}} = {{k + h}} – more than {{n}} people. The excess must be counted twice."
    explanation: At least {{k + h - n}} have both, because {{k + h}} pet owners do not fit into {{n}} people. At most it is {{min(k, h)}}.
    difficulty: 2
    variants:
      params:
        n: int[20,40]
        k: int[12,30]
        h: int[12,30]
      constraints:
        - k < n
        - h < n
        - k + h > n
      defaults:
        n: 30
        k: 20
        h: 16

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Three sets: |A| = 10, |B| = 12, |C| = 8. Each pair shares 4, all three share 2. How many elements are there in total?"
    answer:
      value: 20
    hints:
      - Add singles, subtract pairs, add the triple back.
    explanation: "30 − 12 + 2 = 20. The **inclusion–exclusion principle**: alternately plus and minus."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: How many numbers from 1 to 100 are divisible by 2, 3 **or** 5?
    answer:
      value: 74
    feedback:
      - when: numval(state.input) == 103
        misconception: no-overlap
        text: You only added. Numbers like 6 or 10 got counted twice.
      - when: numval(state.input) == 71
        misconception: forgot-triple
        text: Almost! Add the multiples of 30 back at the end.
    hints:
      - "Singly: 50 + 33 + 20. Pairs: divisible by 6, 10, 15 – subtract 16 + 10 + 6."
      - 3 numbers are divisible by all three (that is 30) – add them back.
    explanation: "50 + 33 + 20 − 16 − 10 − 6 + 3 = 74. This is the principle of inclusion–exclusion: alternately add and subtract."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why you subtract the intersection when computing |A ∪ B|.
    params:
      keywords:
        - - doppelt
          - zweimal
          - twice
          - double
        - - schnitt
          - beides
          - beide
          - intersection
          - both
        - - abzieh
          - zieht
          - minus
          - subtrah
          - subtract
      sample: Anyone in both sets is counted twice when you add |A| and |B|. So you subtract the intersection once.
    difficulty: 3

srs:
  cards_from: [mindestens-eins, keins]
