id: logic.sets.basics
type: concept
title: Schnitt und Vereinigung
summary: Und, oder, weder noch – als Bild.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: beides
    widget: venn
    prompt: Färbe alle, die Kaffee **und** Tee trinken.
    params: { sets: [Kaffee, Tee] }
    answer: { regions: [AB] }
    hints:
      - Wer beides trinkt, steht in beiden Kreisen zugleich.
    explanation: Das ist der Bereich, in dem sich die Kreise überlappen.

  - kind: explain
    id: s2
    body: |
      Die **Schnittmenge** A ∩ B enthält alles, was in beiden liegt.
      Die **Vereinigung** A ∪ B enthält alles, was in mindestens einer liegt.
      Tippe Bereiche an und vergleiche.
    visual: { widget: venn, interactive: true, params: { sets: [A, B] } }

  - kind: problem
    id: vereinigung
    widget: venn
    prompt: Färbe Kaffee ∪ Tee – alle, die mindestens eins von beiden trinken.
    params: { sets: [Kaffee, Tee] }
    answer: { regions: [A, B, AB] }
    feedback:
      - when: "has('AB') && !has('A') && !has('B')"
        misconception: union-as-intersection
        text: Das ist nur die Schnittmenge. Mindestens eins heißt – auch die äußeren Teile.
    hints:
      - Mindestens eins schließt »beides« mit ein.
    explanation: Die Vereinigung umfasst beide Kreise vollständig.

  - kind: problem
    id: nur-kaffee
    widget: venn
    prompt: Färbe alle, die Kaffee trinken, aber keinen Tee.
    params: { sets: [Kaffee, Tee] }
    answer: { regions: [A] }
    hints:
      - Wer beides trinkt, gehört nicht dazu.
    explanation: Nur der Teil des Kaffee-Kreises ohne Überlappung.

  - kind: problem
    id: weder
    widget: venn
    prompt: Färbe alle, die **weder** Kaffee noch Tee trinken.
    params: { sets: [Kaffee, Tee], outside: true }
    answer: { regions: [O] }
    hints:
      - Diese Menschen stehen in keinem der beiden Kreise.
    explanation: Das ist der Bereich außerhalb beider Kreise.

  - kind: problem
    id: symbol
    widget: choice
    prompt: Was beschreibt A ∩ B?
    params:
      options:
        - { label: "Alles, was in A und in B liegt.", correct: true }
        - { label: "Alles, was in A oder in B liegt.", feedback: "Das ist die Vereinigung A ∪ B." }
        - { label: "Alles, was in A liegt, aber nicht in B.", feedback: "Das schreibt man A ∖ B." }
    hints:
      - Das Zeichen ∩ sieht aus wie ein Bogen, der beide Kreise verbindet – oder wie ein kleines n für »und«.
    explanation: ∩ ist der Schnitt – das gemeinsame Stück.

  - kind: problem
    id: c1
    widget: match
    prompt: Welches Zeichen passt?
    params:
      pairs:
        - left: in A **und** in B
          right: A ∩ B
        - left: in A **oder** in B
          right: A ∪ B
        - left: in A, aber nicht in B
          right: A ∖ B
        - left: nicht in A
          right: Komplement von A
    hints:
      - "∩ sieht aus wie ein Tor: nur was durch beide passt."
    explanation: Mengenzeichen sind die Kurzschrift für »und«, »oder« und »nicht«.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A = {1, 2, 3, 4, 5} und B = {4, 5, 6, 7}. Wie viele Elemente hat A ∪ B?
    answer:
      value: 7
    hints:
      - 4 und 5 nur einmal zählen.
    explanation: 5 + 4 − 2 = 7.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Wie viele Zahlen von 1 bis {{n}} sind durch 2 **und** durch 3 teilbar?
    answer:
      value: "{{floor(n / 6)}}"
    feedback:
      - when: numval(state.input) == floor(n / 2) + floor(n / 3)
        misconception: union-vs-intersection
        text: Das zählt die Vereinigung – und dazu noch doppelt. Gesucht ist die Schnittmenge.
    hints:
      - Welche Zahlen sind durch 2 und durch 3 teilbar?
      - Genau die Vielfachen von 6. Wie viele gibt es bis {{n}}?
    explanation: Die Schnittmenge der Vielfachen von 2 und von 3 sind die Vielfachen von 6. Bis {{n}} gibt es {{floor(n / 6)}} davon.
    difficulty: 2
    variants:
      params:
        n: int[30,99]
      defaults:
        n: 50

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: "Jeder Hund ist ein Tier: Hunde ⊆ Tiere. Was ist dann Hunde ∪ Tiere?"
    params:
      options:
        - label: Die Menge der Tiere
          correct: true
        - label: Die Menge der Hunde
          feedback: Das ist die Schnittmenge. Die Vereinigung ist die größere Menge.
        - label: Die leere Menge
          feedback: Hunde sind doch Tiere – nichts fällt weg.
    hints:
      - Zeichne den Kreis der Hunde ganz innerhalb des Kreises der Tiere.
      - Was liegt in mindestens einem der beiden Kreise?
    explanation: Ist A eine **Teilmenge** von B, dann gilt A ∪ B = B und A ∩ B = A. Der kleine Kreis fügt nichts Neues hinzu.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Eine Menge hat 5 Elemente. Wie viele **Teilmengen** hat sie – die leere Menge und sie selbst mitgezählt?
    answer:
      value: 32
    hints:
      - Jedes Element ist dabei oder nicht.
    explanation: 2⁵ = 32. Die Menge aller Teilmengen heißt **Potenzmenge** – daher der Name.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Wie viele Teilmengen von {1, 2, …, {{n}}} enthalten die Zahl 1?
    answer:
      value: "{{2 ** (n - 1)}}"
    feedback:
      - when: numval(state.input) == 2 ** n
        misconception: all-subsets
        text: Das sind alle Teilmengen. Nur die Hälfte enthält die 1.
    hints:
      - "Bei jedem Element entscheidest du: rein oder raus. Die 1 ist fest drin."
      - Für die übrigen {{n - 1}} Elemente bleiben 2 · 2 · … Möglichkeiten.
    explanation: "Die 1 ist drin, die anderen {{n - 1}} sind frei: 2^{{n - 1}} = {{2 ** (n - 1)}}. Genau die Hälfte aller 2^{{n}} Teilmengen."
    difficulty: 3
    variants:
      params:
        n: int[3,8]
      defaults:
        n: 5

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Ist die leere Menge ∅ eine Teilmenge **jeder** Menge?
    params:
      options:
        - label: Ja – sie hat kein Element, das außerhalb liegen könnte.
          correct: true
        - label: Nein, sie enthält ja nichts.
          feedback: "Teilmenge heißt: Jedes Element liegt auch in der anderen Menge. Bei null Elementen gibt es kein Gegenbeispiel."
        - label: Nur Teilmenge von sich selbst.
          feedback: Sie ist Teilmenge von sich – aber auch von jeder anderen Menge.
    hints:
      - Wann ist A **keine** Teilmenge von B?
      - Dafür bräuchte man ein Element von A, das nicht in B liegt.
    explanation: A ⊆ B heißt »für alle x in A gilt x in B«. Bei ∅ gibt es kein x, also auch kein Gegenbeispiel. Die Aussage ist **leer wahr**.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Schnittmenge und Vereinigung – mit einem Beispiel.
    params:
      keywords:
        - - schnitt
          - intersection
        - - vereinigung
          - union
        - - beide
          - und
          - both
          - and
        - - mindestens
          - oder
          - at least
          - or
      sample: In der Schnittmenge liegt, was in beiden Mengen ist, also Kaffee und Tee. In der Vereinigung liegt alles, was in mindestens einer Menge ist, also Kaffee oder Tee.
    difficulty: 3

srs:
  cards_from: [vereinigung, nur-kaffee]
