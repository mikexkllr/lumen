id: logic.sets.search
type: concept
title: Suchen wie ein Profi
summary: UND, ODER, NICHT in Suchmaschinen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: So denkt die Suchmaschine
    body: Jede Suche im Netz ist ein kleines Logik-Programm. Die Schalter sagen, ob eine Seite »Katze« oder »Hund« enthält. Schalte sie um und wechsle das Gatter zwischen **UND** und ODER. Wann zählt die Seite als Treffer?
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: K
            label: Katze
          - id: H
            label: Hund
        gates:
          - id: g
            type: "?"
            in:
              - K
              - H
            options:
              - AND
              - OR
        outputs:
          - id: Q
            from: g
            label: Treffer

  - kind: problem
    id: und
    widget: venn
    prompt: Du suchst nach »Rezept UND vegan«. Welche Seiten bekommst du? Färbe den Bereich.
    params: { sets: [Rezept, vegan] }
    answer: { regions: [AB] }
    hints:
      - UND heißt – beides muss vorkommen.
    explanation: Nur Seiten, die beide Wörter enthalten – die Schnittmenge.

  - kind: problem
    id: oder
    widget: venn
    prompt: Jetzt »Katze ODER Hund«. Färbe alle Treffer.
    params: { sets: [Katze, Hund] }
    answer: { regions: [A, B, AB] }
    hints:
      - Eins von beiden reicht.
    explanation: ODER liefert die Vereinigung – deutlich mehr Treffer.

  - kind: explain
    id: s3
    body: |
      **Suchmaschinen** und Datenbanken arbeiten mit Mengen. **UND** verkleinert die Treffer, **ODER** vergrößert sie, **NICHT** schneidet etwas heraus.

  - kind: problem
    id: nicht
    widget: venn
    prompt: »Jaguar NICHT Auto« – du suchst das Tier. Färbe die Treffer.
    params: { sets: [Jaguar, Auto] }
    answer: { regions: [A] }
    hints:
      - Alles mit Jaguar, aber ohne Auto.
    explanation: Nur der Teil von Jaguar außerhalb von Auto.

  - kind: problem
    id: intro-c1
    widget: gates
    prompt: Die Lampe soll die Treffer für »Katze NICHT Hund« zeigen. Wähle das passende Gatter.
    params:
      inputs:
        - id: K
          label: Katze
        - id: H
          label: Hund
      gates:
        - id: n
          type: NOT
          in:
            - H
        - id: g
          type: "?"
          in:
            - K
            - n
          options:
            - OR
            - AND
      outputs:
        - id: Q
          from: g
          label: Treffer
    check:
      predicate: table('Q') == [0, 0, 1, 0]
    hints:
      - Eine Seite ist nur dann ein Treffer, wenn »Katze« vorkommt und »Hund« fehlt.
      - "Beides muss zugleich gelten: Nimm UND."
    explanation: "»Katze NICHT Hund« heißt: Katze UND nicht Hund. Die Lampe brennt nur, wenn K an und H aus ist."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Welche Suche liefert die **wenigsten** Treffer?
    params:
      options:
        - label: Hund UND Katze UND Vogel
          correct: true
        - label: Hund ODER Katze ODER Vogel
          feedback: ODER vergrößert die Treffermenge.
        - label: Hund
          feedback: Jede zusätzliche UND-Bedingung schränkt weiter ein.
    hints:
      - Jedes UND bildet eine Schnittmenge.
    explanation: Die Schnittmenge ist nie größer als die kleinste beteiligte Menge.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: venn
    prompt: Du suchst »Rezept UND (vegan ODER schnell)«. Färbe alle Treffer.
    params:
      sets:
        - Rezept
        - vegan
        - schnell
    answer:
      regions:
        - AB
        - AC
        - ABC
    feedback:
      - when: has('B') || has('C') || has('BC')
        misconception: or-outside
        text: Ein Treffer muss immer ein Rezept sein – bleib im Rezept-Kreis.
    hints:
      - Alle Treffer liegen im Rezept-Kreis.
      - Davon nur die Bereiche, die auch vegan oder schnell sind.
    explanation: "Drei Bereiche: vegane Rezepte, schnelle Rezepte und beides. Die Klammer entscheidet, was zuerst verknüpft wird."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Eine Suche nach »Katze« liefert 800 Seiten, nach »Hund« 600. 200 Seiten enthalten beides. Wie viele Treffer liefert »Katze NICHT Hund«?
    answer:
      value: 600
    feedback:
      - when: numval(state.input) == 200
        misconception: kept-overlap
        text: Das sind die Seiten mit beidem – genau die fliegen raus.
      - when: numval(state.input) == 1200
        misconception: or-instead
        text: Das wäre »Katze ODER Hund«.
    hints:
      - NICHT schneidet den Hund-Kreis aus dem Katze-Kreis heraus.
      - Rechne 800 − 200.
    explanation: 800 − 200 = 600. »A NICHT B« ist die **Differenz** A ∖ B.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ist »A UND (B ODER C)« dasselbe wie »(A UND B) ODER C«?
    params:
      options:
        - label: Nein – beim zweiten zählt alles aus C mit, auch ohne A
          correct: true
        - label: Ja – Klammern sind egal
          feedback: Nimm ein Element, das nur in C liegt.
        - label: Nur bei leeren Mengen
          feedback: Im Allgemeinen unterscheiden sie sich.
    hints:
      - "Liegt ein Element nur in C: Ist es im ersten Ausdruck? Im zweiten?"
    explanation: "Klammern entscheiden. Richtig ist: A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C) – das **Distributivgesetz**."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Welche Suche liefert genau dieselben Treffer wie »NICHT (Katze ODER Hund)«?
    params:
      options:
        - label: NICHT Katze UND NICHT Hund
          correct: true
        - label: NICHT Katze ODER NICHT Hund
          feedback: Das würde auch Seiten nur mit Katze finden.
        - label: Katze UND Hund
          feedback: Das ist fast das Gegenteil.
    hints:
      - "»Nicht (A oder B)« heißt: weder A noch B."
      - Beim Verneinen tauschen UND und ODER die Plätze.
    explanation: "Das ist eine der **De-Morgan-Regeln**: ¬(A ∨ B) = ¬A ∧ ¬B. Im Venn-Diagramm ist es der Bereich außerhalb beider Kreise."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie UND, ODER und NICHT die Zahl der Treffer einer Suche verändern.
    params:
      keywords:
        - - und
          - and
        - - oder
          - or
        - - nicht
          - not
        - - weniger
          - mehr
          - kleiner
          - größer
          - fewer
          - more
          - smaller
          - larger
      sample: UND verlangt beides, darum gibt es weniger Treffer. ODER reicht eins, darum gibt es mehr. NICHT schneidet einen Teil heraus und macht die Treffer auch weniger.
    difficulty: 3

srs:
  cards_from: [oder, nicht]
