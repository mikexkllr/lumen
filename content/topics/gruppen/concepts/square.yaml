id: math.groups.square
type: concept
title: "Die Symmetrien des Quadrats"
summary: "Acht Arten, ein Quadrat zurück in sein Loch zu legen – und wie man mit ihnen rechnet."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Symmetrie überall
    body: "Schmetterlinge, Spielkarten und Logos sehen nach einer Drehung oder Spiegelung oft genauso aus wie vorher. Deck die Karten auf: Welche Bewegungen lassen jede Figur **unverändert**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦋
            front: Schmetterling
            back: Eine Spiegelachse in der Mitte – drehen darfst du ihn nicht.
          - icon: 🃏
            front: Spielkarte
            back: "Der König steht auch auf dem Kopf richtig: Eine halbe Drehung passt."
          - icon: ♻️
            front: Recycling-Zeichen
            back: "Drehen um 120° oder 240° klappt, Spiegeln nicht: Die Pfeile laufen nur in eine Richtung."
          - icon: ⭕
            front: Kreis
            back: "Jede Drehung und jede Spiegelung durch die Mitte passt: unendlich viele Symmetrien."

  - kind: problem
    id: hook
    widget: numeric
    prompt: Ein Quadrat aus Pappe liegt in einem passenden Loch. Auf wie viele Arten kannst du es herausnehmen und wieder genau hineinlegen? Umdrehen ist erlaubt.
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 4
        misconception: no-flips
        text: Das sind die Drehungen. Du kannst es auch umdrehen – das gibt vier weitere.
    hints:
      - Wie viele Drehungen passen? 0°, 90°, …
      - Nach dem Umdrehen geht jede Drehung noch einmal.
    explanation: "4 Drehungen und 4 Spiegelungen: 8 Symmetrien. Auch »einfach zurücklegen« zählt mit."

  - kind: explain
    id: c1
    body: "Eine **Symmetrie** ist eine Bewegung, nach der eine Figur genau wie vorher aussieht. Beim Quadrat: Drehen um 0°, 90°, 180°, 270° und Spiegeln an vier Achsen – zwei durch die Seitenmitten, zwei durch die Ecken."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Drehung oder Spiegelung?
    params:
      buckets:
        - id: b1
          label: Drehung
        - id: b2
          label: Spiegelung
      items:
        - label: um 90° drehen
          bucket: b1
        - label: um 180° drehen
          bucket: b1
        - label: nichts tun (0°)
          bucket: b1
        - label: an der senkrechten Achse klappen
          bucket: b2
        - label: an der waagerechten Achse klappen
          bucket: b2
        - label: an einer Diagonale klappen
          bucket: b2
    hints:
      - Bei einer Spiegelung liegt danach die Rückseite oben.
      - Nichts tun ist eine Drehung um 0°.
    explanation: Drehungen lassen die Vorderseite oben, Spiegelungen drehen das Quadrat um. Das Nichtstun ist auch eine Symmetrie – die wichtigste.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Wie viele Symmetrien hat ein regelmäßiges {{n}}-Eck – Drehungen und Spiegelungen zusammen?
    answer:
      value: "{{2 * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: rotations-only
        text: Das sind nur die Drehungen. Es gibt genauso viele Spiegelachsen.
    hints:
      - "{{n}} Drehungen, auch die um 0°."
      - Dazu {{n}} Spiegelachsen.
    explanation: "{{n}} + {{n}} = {{2 * n}}."
    variants:
      params:
        n: int[3,12]
      defaults:
        n: 6

  - kind: problem
    id: c4
    widget: choice
    prompt: Du drehst das Quadrat zweimal hintereinander um 90°. Welche Symmetrie ist das insgesamt?
    params:
      options:
        - label: Die Drehung um 180°
          correct: true
        - label: Eine Spiegelung
          feedback: Zwei Drehungen lassen die Vorderseite oben.
        - label: Keine Symmetrie mehr
          feedback: Nacheinander ausgeführte Symmetrien sind wieder Symmetrien.
    hints:
      - 90° + 90°.
      - Drehwinkel addieren sich.
    explanation: Zwei Symmetrien nacheinander ergeben wieder eine Symmetrie. Man kann mit ihnen rechnen wie mit Zahlen.

  - kind: explain
    id: d1
    depth: 2
    body: Das Nacheinander-Ausführen heißt **Verknüpfung**. Zwei Spiegelungen ergeben immer eine Drehung – um den doppelten Winkel zwischen den Achsen. Eine Drehung und eine Spiegelung ergeben eine Spiegelung.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Erst klappst du an der senkrechten Achse, dann an einer Diagonale. Die Achsen bilden 45°. Was kommt heraus?
    params:
      options:
        - label: Eine Drehung um 90°
          correct: true
        - label: Eine Drehung um 45°
          feedback: "Der Winkel verdoppelt sich: 2 · 45°."
        - label: Eine Spiegelung
          feedback: Zweimal umdrehen – die Vorderseite liegt wieder oben.
    hints:
      - "Zwei Spiegelungen: Ist die Vorderseite danach oben?"
      - Drehwinkel = 2 · Winkel zwischen den Achsen.
    explanation: "2 · 45° = 90°. Das erklärt auch Kaleidoskope: Zwei Spiegel im Winkel erzeugen Drehsymmetrie."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Ist »erst um 90° drehen, dann senkrecht klappen« dasselbe wie »erst klappen, dann drehen«?
    params:
      options:
        - label: Nein – die Ecken landen an verschiedenen Stellen.
          correct: true
        - label: Ja, die Reihenfolge ist egal.
          feedback: Probier es mit einem beschrifteten Zettel aus.
        - label: Nur manchmal
          feedback: Hier ist es tatsächlich verschieden.
    hints:
      - Nummeriere die Ecken 1 bis 4 und probiere beides.
      - Das Ergebnis sind zwei verschiedene Spiegelungen.
    explanation: Die Reihenfolge zählt – wie bei Matrizen. Solche Gruppen heißen nicht kommutativ.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Die acht Symmetrien bilden die **Diedergruppe** D₄. Die vier Drehungen allein sind eine kleinere Gruppe darin, eine Untergruppe. Eine Tabelle mit allen 8 · 8 Verknüpfungen beschreibt D₄ vollständig.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Wie viele der 8 Symmetrien ergeben zweimal ausgeführt das Nichtstun – das Nichtstun selbst nicht mitgezählt?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: missed-rotation
        text: Die vier Spiegelungen stimmen – aber eine Drehung gehört auch dazu.
      - when: numval(state.input) == 6
        misconception: counted-identity
        text: Das Nichtstun soll nicht mitzählen.
    hints:
      - Jede Spiegelung zweimal ergibt das Original.
      - Welche Drehung zweimal ergibt 360°?
    explanation: "4 Spiegelungen und die Drehung um 180°: 5. Die 90°-Drehungen brauchen vier Runden."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: Wie viele Elemente hat die Untergruppe der Drehungen eines regelmäßigen {{n}}-Ecks?
    answer:
      value: "{{n}}"
    feedback:
      - when: numval(state.input) == 2 * n
        misconception: whole-group
        text: Das ist die ganze Gruppe mit den Spiegelungen.
    hints:
      - "Drehungen um Vielfache von 360° : {{n}}."
      - Mit der Drehung um 0°.
    explanation: "{{n}} Drehungen – genau die Hälfte der {{2 * n}} Symmetrien. Untergruppen teilen die Gruppe immer in gleich große Stücke."
    difficulty: 3
    variants:
      params:
        n: int[3,12]
      defaults:
        n: 8

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Du klappst das Quadrat zweimal um. Warum ist das am Ende eine Drehung?"
    params:
      keywords:
        - - umdrehen
          - rückseite
          - vorderseite
          - flip
          - back
          - front
        - - zweimal
          - beide
          - zwei
          - twice
          - both
          - two
        - - winkel
          - doppelt
          - angle
          - double
      sample: Jede Spiegelung dreht das Quadrat um, sodass die Rückseite oben liegt. Nach zwei Spiegelungen ist die Vorderseite wieder oben, also muss es eine Drehung sein. Ihr Winkel ist doppelt so groß wie der zwischen den Achsen.
    explanation: Spiegeln kehrt den Drehsinn um, zweimal Spiegeln stellt ihn wieder her. Was übrig bleibt, ist eine Drehung.
    difficulty: 3

srs:
  cards_from: ["c3", "x3"]
