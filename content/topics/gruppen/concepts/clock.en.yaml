id: math.groups.clock
type: concept
title: "Clocks as groups"
summary: "Arithmetic modulo n as a group – with generators, orders and Lagrange's theorem."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: It is 9 o'clock. What time is it 5 hours later on a 12-hour clock?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 14
        misconception: no-wrap
        text: A 12-hour clock has no 14.
    hints:
      - 9 + 5 = 14.
      - 14 − 12.
    explanation: "2 o'clock: you compute modulo 12. The hours 0 to 11 with this addition form a group."

  - kind: explain
    id: c1
    body: The numbers 0, 1, …, n − 1 with addition modulo n form the **cyclic group** ℤₙ. The neutral element is 0. You reach every number by adding 1 again and again – 1 generates the whole group.

  - kind: problem
    id: c2
    widget: numeric
    prompt: Which number is the inverse of {{k}} in ℤ₁₂ – i.e. k + x ≡ 0?
    answer:
      value: "{{12 - k}}"
    feedback:
      - when: numval(state.input) == -k
        misconception: negative
        text: ℤ₁₂ only has 0 to 11. −{{k}} is {{12 - k}} there.
    hints:
      - How many hours are missing to a full round?
      - 12 − {{k}}.
    explanation: "{{k}} + {{12 - k}} = 12 ≡ 0."
    variants:
      params:
        k: int[1,11]
      constraints:
        - k != 6
      defaults:
        k: 5

  - kind: problem
    id: c3
    widget: numeric
    prompt: How often must you add {{k}} in ℤ₁₂ until you are back at 0? This number is the **order** of {{k}}.
    answer:
      value: "{{12 / gcd(k, 12)}}"
    feedback:
      - when: numval(state.input) == 12 && gcd(k, 12) != 1
        misconception: always-twelve
        text: That holds only for numbers sharing no divisor with 12. Write out the multiples.
    hints:
      - Write out {{k}}, {{2 * k}}, {{3 * k}}, … modulo 12.
      - "In general: 12 / gcd({{k}}, 12)."
    explanation: 12 / gcd({{k}}, 12) = {{12 / gcd(k, 12)}}.
    variants:
      params:
        k: int[1,11]
      defaults:
        k: 4

  - kind: problem
    id: c4
    widget: choice
    prompt: Which numbers generate all of ℤ₁₂ – reaching every hour by repetition?
    params:
      multiple: true
      options:
        - label: "1"
          correct: true
        - label: "5"
          correct: true
        - label: "7"
          correct: true
        - label: "11"
          correct: true
        - label: 3 only reaches 0, 3, 6, 9.
          feedback: 3 erreicht nur 0, 3, 6, 9.
        - label: 8 only reaches 0, 8, 4.
          feedback: 8 erreicht nur 0, 8, 4.
    hints:
      - A number generates ℤ₁₂ if its order is 12.
      - That happens exactly when it shares no divisor with 12.
    explanation: 1, 5, 7 and 11 – coprime to 12. A clock jumping 5 hours at a time hits every hour.

  - kind: explain
    id: d1
    depth: 2
    body: "Modulo a prime p the numbers 1 to p − 1 under multiplication form a group: the **multiplicative group**. Every number has an inverse there because p is prime. It has p − 1 elements."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Which number from 1 to 6 is the inverse of 3 modulo 7, i.e. 3 · x ≡ 1?
    answer:
      value: 5
    hints:
      - Try 3 · 1, 3 · 2, … and divide by 7.
      - 3 · 5 = 15 = 2 · 7 + 1.
    explanation: 3 · 5 ≡ 1 (mod 7). So in this group 5 is »one third«.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: What is the order of 2 in the multiplicative group modulo 7? How often must you multiply by 2 until you get 1?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: group-order
        text: The group has 6 elements – but 2 comes back sooner.
    hints:
      - 2, 4, 8 ≡ …
      - 8 = 7 + 1.
    explanation: "2, 4, 1: order 3. The 2 generates only half the group."
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "**Lagrange's theorem**: the order of every element divides the number of elements of the group. Fermat's little theorem follows at once: the order of a divides p − 1, so $a^{p-1} \\equiv 1 \\pmod p$."

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Can a number modulo 7 have order 4?
    params:
      options:
        - label: No – 4 does not divide 6.
          correct: true
        - label: "4, 16 ≡ 2, 8 ≡ 1: order 3."
          feedback: "4, 16 ≡ 2, 8 ≡ 1: Ordnung 3."
        - label: Lagrange decides it without a single calculation.
          feedback: Lagrange entscheidet es ohne eine einzige Rechnung.
    hints:
      - The group has 6 elements.
      - Possible orders are the divisors of 6.
    explanation: Only 1, 2, 3 or 6 are possible. Lagrange narrows it down without computing.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: What is the order of 3 modulo 7?
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 3
        misconception: guess
        text: "3 does not return after three steps: 3³ = 27 ≡ 6."
    hints:
      - 3, 9 ≡ 2, 6, 18 ≡ 4, …
      - "Continue: 12 ≡ 5, 15 ≡ 1."
    explanation: "Order 6: 3 generates the whole group, it is a **primitive root**. The Diffie–Hellman key exchange needs such generators."
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Tell Lux why Fermat's little theorem follows from Lagrange's theorem.
    params:
      keywords:
        - - ordnung
          - order
        - - teilt
          - teiler
          - divides
          - divisor
        - - p − 1
          - p-1
          - gruppengröße
          - group size
          - sechs
          - elemente
          - elements
      sample: The numbers 1 to p − 1 form a group of p − 1 elements under multiplication. By Lagrange the order of a divides that number. So a to the p − 1 is a power of a to its order, which is 1.
    explanation: If $a^k = 1$ and k divides p − 1, then $a^{p-1} = (a^k)^{(p-1)/k} = 1$.
    difficulty: 3

srs:
  cards_from: ["c2", "c3"]
