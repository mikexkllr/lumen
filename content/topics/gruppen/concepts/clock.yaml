id: math.groups.clock
type: concept
title: "Uhren als Gruppen"
summary: "Rechnen modulo n als Gruppe – mit Erzeugern, Ordnungen und dem Satz von Lagrange."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: Es ist 9 Uhr. Wie spät ist es in 5 Stunden auf einer 12-Stunden-Uhr?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 14
        misconception: no-wrap
        text: Auf einer 12-Stunden-Uhr gibt es keine 14.
    hints:
      - 9 + 5 = 14.
      - 14 − 12.
    explanation: "2 Uhr: Man rechnet modulo 12. Die Stunden 0 bis 11 mit dieser Addition bilden eine Gruppe."

  - kind: explain
    id: c1
    body: Die Zahlen 0, 1, …, n − 1 mit Addition modulo n bilden die **zyklische Gruppe** ℤₙ. Neutral ist die 0. Jede Zahl erreicht man, indem man immer wieder 1 addiert – die 1 erzeugt die ganze Gruppe.

  - kind: problem
    id: c2
    widget: numeric
    prompt: Welche Zahl ist in ℤ₁₂ das Inverse von {{k}} – also k + x ≡ 0?
    answer:
      value: "{{12 - k}}"
    feedback:
      - when: numval(state.input) == -k
        misconception: negative
        text: In ℤ₁₂ gibt es nur 0 bis 11. −{{k}} ist dort {{12 - k}}.
    hints:
      - Wie viele Stunden fehlen bis zur vollen Runde?
      - 12 − {{k}}.
    explanation: "{{k}} + {{12 - k}} = 12 ≡ 0."
    variants:
      params:
        k: int[1,11]
      constraints:
        - k != 6
      defaults:
        k: 5

  - kind: problem
    id: c3
    widget: numeric
    prompt: Wie oft musst du {{k}} in ℤ₁₂ addieren, bis du wieder bei 0 bist? Diese Zahl heißt **Ordnung** von {{k}}.
    answer:
      value: "{{12 / gcd(k, 12)}}"
    feedback:
      - when: numval(state.input) == 12 && gcd(k, 12) != 1
        misconception: always-twelve
        text: Das gilt nur für Zahlen ohne gemeinsamen Teiler mit 12. Schreib die Vielfachen auf.
    hints:
      - Schreib {{k}}, {{2 * k}}, {{3 * k}}, … modulo 12 auf.
      - "Allgemein: 12 : ggT({{k}}, 12)."
    explanation: "12 : ggT({{k}}, 12) = {{12 / gcd(k, 12)}}."
    variants:
      params:
        k: int[1,11]
      defaults:
        k: 4

  - kind: problem
    id: c4
    widget: choice
    prompt: Welche Zahlen erzeugen ganz ℤ₁₂ – erreichen also durch Wiederholen jede Stunde?
    params:
      multiple: true
      options:
        - label: "1"
          correct: true
        - label: "5"
          correct: true
        - label: "7"
          correct: true
        - label: "11"
          correct: true
        - label: "3"
          feedback: 3 erreicht nur 0, 3, 6, 9.
        - label: "8"
          feedback: 8 erreicht nur 0, 8, 4.
    hints:
      - Eine Zahl erzeugt ℤ₁₂, wenn ihre Ordnung 12 ist.
      - Das passiert genau, wenn sie mit 12 keinen Teiler gemeinsam hat.
    explanation: 1, 5, 7 und 11 – teilerfremd zu 12. Eine Uhr mit 5-Stunden-Sprüngen trifft jede Stunde.

  - kind: explain
    id: d1
    depth: 2
    body: "Modulo einer Primzahl p bilden die Zahlen 1 bis p − 1 mit Malnehmen eine Gruppe: die **multiplikative Gruppe**. Jede Zahl hat dort ein Inverses, weil p prim ist. Sie hat p − 1 Elemente."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Welche Zahl aus 1 bis 6 ist modulo 7 das Inverse von 3, also 3 · x ≡ 1?
    answer:
      value: 5
    hints:
      - Probiere 3 · 1, 3 · 2, … und teile durch 7.
      - 3 · 5 = 15 = 2 · 7 + 1.
    explanation: 3 · 5 ≡ 1 (mod 7). In dieser Gruppe ist 5 also »ein Drittel«.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Welche Ordnung hat 2 in der multiplikativen Gruppe modulo 7? Wie oft musst du mit 2 malnehmen, bis 1 herauskommt?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: group-order
        text: Die Gruppe hat 6 Elemente – aber 2 kommt schon früher zurück.
    hints:
      - 2, 4, 8 ≡ …
      - 8 = 7 + 1.
    explanation: "2, 4, 1: Ordnung 3. Die 2 erzeugt nur die Hälfte der Gruppe."
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Der **Satz von Lagrange**: Die Ordnung jedes Elements teilt die Anzahl der Elemente der Gruppe. Daraus folgt sofort der kleine Fermat: Die Ordnung von a teilt p − 1, also ist $a^{p-1} \\equiv 1 \\pmod p$."

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Kann eine Zahl modulo 7 die Ordnung 4 haben?
    params:
      options:
        - label: Nein – 4 teilt nicht 6.
          correct: true
        - label: Ja, zum Beispiel 4.
          feedback: "4, 16 ≡ 2, 8 ≡ 1: Ordnung 3."
        - label: Das kann man nur durch Probieren wissen.
          feedback: Lagrange entscheidet es ohne eine einzige Rechnung.
    hints:
      - Die Gruppe hat 6 Elemente.
      - Mögliche Ordnungen sind die Teiler von 6.
    explanation: Nur 1, 2, 3 oder 6 sind möglich. Lagrange schränkt ein, ohne zu rechnen.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: Welche Ordnung hat 3 modulo 7?
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 3
        misconception: guess
        text: "Die 3 kommt nicht nach drei Schritten zurück: 3³ = 27 ≡ 6."
    hints:
      - 3, 9 ≡ 2, 6, 18 ≡ 4, …
      - "Weiter: 12 ≡ 5, 15 ≡ 1."
    explanation: "Ordnung 6: Die 3 erzeugt die ganze Gruppe, sie ist eine **Primitivwurzel**. Solche Erzeuger braucht der Diffie-Hellman-Schlüsseltausch."
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum aus dem Satz von Lagrange der kleine Satz von Fermat folgt.
    params:
      keywords:
        - - ordnung
          - order
        - - teilt
          - teiler
          - divides
          - divisor
        - - p − 1
          - p-1
          - gruppengröße
          - group size
          - sechs
          - elemente
          - elements
      sample: Die Zahlen 1 bis p − 1 bilden beim Malnehmen eine Gruppe mit p − 1 Elementen. Nach Lagrange teilt die Ordnung von a diese Zahl. Also ist a hoch p − 1 eine Potenz von a hoch Ordnung, und das ist 1.
    explanation: Ist $a^k = 1$ und k teilt p − 1, dann ist $a^{p-1} = (a^k)^{(p-1)/k} = 1$.
    difficulty: 3

srs:
  cards_from: ["c2", "c3"]
