id: logic.proofs.contradiction
type: concept
title: Beweis durch Widerspruch
summary: Unendlich viele Primzahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Unmögliche ausschließen
    body: "Detektive und Mathematiker teilen einen Trick: Sie nehmen das Gegenteil an und warten auf den Knall. Deck die Karten auf und sieh, wie stark der **Widerspruch** als Werkzeug ist."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🕵️
            front: Sherlock Holmes
            back: »Wenn man das Unmögliche ausgeschlossen hat, muss das Übrige die Wahrheit sein.«
          - icon: 🧩
            front: Das Alibi
            back: Wer zur Tatzeit in Paris war, kann nicht in Berlin gewesen sein. Jedes Alibi ist ein Widerspruchsbeweis.
          - icon: 🔢
            front: Die größte Zahl?
            back: Gäbe es eine größte Zahl N, wäre N + 1 noch größer. Widerspruch – also gibt es keine.
          - icon: 📐
            front: Seit der Antike
            back: Schon vor über 2000 Jahren bewiesen Griechen so, dass manche Längen kein Bruch sind.

  - kind: problem
    id: hook
    widget: choice
    prompt: "Ein Detektiv weiß: »War es der Gärtner, hätte der Hund gebellt.« Der Hund blieb still. Was folgt?"
    params:
      options:
        - label: Der Gärtner war es nicht
          correct: true
        - label: Der Gärtner war es
          feedback: Dann hätte der Hund gebellt.
        - label: Nichts
          feedback: Die Stille verrät etwas.
    hints:
      - Nimm an, er war es. Was müsste dann passiert sein?
    explanation: Annehmen, auf Unsinn stoßen, Annahme verwerfen. So geht ein Widerspruchsbeweis.

  - kind: explain
    id: s1
    body: |
      Beim **Widerspruchsbeweis** nimmt man das Gegenteil an und zeigt, dass daraus Unsinn folgt. Dann muss die ursprüngliche Aussage stimmen.

  - kind: problem
    id: plus-eins
    widget: numeric
    prompt: Multipliziere die Primzahlen 2, 3 und 5 und addiere 1. Was kommt heraus?
    params: { placeholder: "Zahl" }
    answer: { value: 31 }
    hints:
      - 2 · 3 · 5 = 30.
    explanation: 31 lässt bei 2, 3 und 5 jeweils Rest 1.

  - kind: problem
    id: euklid
    widget: order
    prompt: Euklids Beweis, dass es unendlich viele Primzahlen gibt. Bring ihn in Reihenfolge.
    params:
      items:
        - { label: "Angenommen, es gibt nur endlich viele Primzahlen" }
        - { label: Multipliziere alle und addiere 1 }
        - { label: Diese Zahl lässt bei jeder Primzahl der Liste Rest 1 }
        - { label: Ihr Primteiler fehlt also in der Liste – Widerspruch }
    hints:
      - Am Anfang steht die Annahme, am Ende der Widerspruch.
    explanation: Jede endliche Liste ist unvollständig – also gibt es unendlich viele Primzahlen.

  - kind: problem
    id: falle
    widget: choice
    body: "2 · 3 · 5 · 7 · 11 · 13 + 1 = 30031 = 59 · 509."
    prompt: Widerlegt das den Beweis, weil 30031 keine Primzahl ist?
    params:
      options:
        - { label: "Nein – 59 und 509 stehen nicht in der Liste", correct: true }
        - { label: "Ja – der Beweis ist falsch", feedback: "Der Beweis behauptet nicht, dass die Zahl selbst prim ist." }
    hints:
      - Was genau behauptet der Beweis über die neue Zahl?
    explanation: Die Zahl hat Primteiler außerhalb der Liste. Genau das reicht für den Widerspruch.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Man nimmt das [[Gegenteil]] an und zeigt, dass daraus ein [[Widerspruch]] folgt. Also war die Annahme falsch.
      distractors:
        - Beispiel
        - Beweis

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Beweise: Es gibt keine kleinste positive Bruchzahl. Wie beginnt der Widerspruchsbeweis?"
    params:
      options:
        - label: »Angenommen, es gäbe eine kleinste – nenn sie q.«
          correct: true
        - label: »Wir prüfen alle Brüche.«
          feedback: Es gibt unendlich viele.
        - label: »1/1000 ist sehr klein.«
          feedback: Ein Beispiel beweist nichts.
    hints:
      - Man nimmt das Gegenteil dessen an, was man zeigen will.
    explanation: Dann wäre q/2 positiv und noch kleiner – Widerspruch.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: Beweise, dass √2 kein Bruch ist. Ordne die Schritte.
    params:
      items:
        - label: Angenommen, √2 = p/q, vollständig gekürzt.
        - label: Quadrieren ergibt p² = 2q². Also ist p² gerade, also p gerade.
        - label: "Setze p = 2k ein: 4k² = 2q², also q² = 2k². Also ist auch q gerade."
        - label: Dann wäre p/q durch 2 kürzbar – Widerspruch!
        - label: Also ist √2 irrational.
    hints:
      - Ein Widerspruchsbeweis beginnt mit dem Gegenteil der Behauptung.
      - Erst wird p als gerade erkannt, dann q.
    explanation: "Die Annahme »gekürzt« und das Ergebnis »beide gerade« vertragen sich nicht. Also war die Annahme falsch: √2 ist **irrational**."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Im Beweis steht p² = 2q². Warum muss dann p gerade sein?
    params:
      options:
        - label: Wäre p ungerade, wäre auch p² ungerade.
          correct: true
        - label: Weil 2q² durch 4 teilbar ist.
          feedback: Das wissen wir noch nicht – q könnte ungerade sein.
        - label: Weil p kleiner als q ist.
          feedback: Es ist sogar größer, denn √2 > 1. Größe spielt hier keine Rolle.
    hints:
      - p² ist gerade, weil es 2 · q² ist.
      - Was ergibt eine ungerade Zahl zum Quadrat?
    explanation: Ungerade mal ungerade ist ungerade. Ist p² gerade, kann p also nicht ungerade sein. Das ist die Kontraposition aus dem letzten Kapitel.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Beweis zeigt nur: »Es muss eine Lösung geben.« Manchen reicht das nicht. Was stört sie?"
    params:
      options:
        - label: Der Beweis sagt nicht, wie man die Lösung findet
          correct: true
        - label: Solche Beweise sind falsch
          feedback: Sie sind logisch sauber.
        - label: Sie sind zu kurz
          feedback: Die Länge ist nicht der Punkt.
    hints:
      - »Es muss eine Lösung geben« – aber welche?
    explanation: Die **konstruktive Mathematik** will den Weg zur Lösung sehen. Für Computer ist das sehr wichtig.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Gibt es irrationale Zahlen a und b, sodass aᵇ rational ist? Ein Beweis betrachtet x = √2^√2. Wie geht er weiter?
    params:
      options:
        - label: "Ist x rational, fertig. Sonst nimm a = x, b = √2: Dann ist aᵇ = √2² = 2."
          correct: true
        - label: Man rechnet x auf viele Stellen aus.
          feedback: Stellen zeigen nie, ob eine Zahl rational ist.
        - label: Das geht nicht, irrational hoch irrational ist irrational.
          feedback: Genau das widerlegt der Beweis.
    hints:
      - "Es gibt nur zwei Fälle: x ist rational oder nicht."
      - (√2^√2)^√2 = √2^(√2 · √2).
    explanation: In beiden Fällen gibt es ein Paar – nur sagt der Beweis nicht, **welches**. Solche nicht-konstruktiven Beweise lehnen manche Mathematiker ab. (Tatsächlich ist x irrational, aber das ist viel schwerer zu zeigen.)
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Beweis durch Widerspruch funktioniert.
    params:
      keywords:
        - - gegenteil
          - annahme
          - angenommen
          - opposite
          - assume
          - suppose
        - - widerspruch
          - unsinn
          - unmöglich
          - contradiction
          - impossible
          - nonsense
        - - also
          - daher
          - muss
          - so
          - therefore
          - must
      sample: Man nimmt das Gegenteil der Behauptung an und rechnet damit weiter. Kommt ein Widerspruch heraus, war die Annahme falsch. Also muss die Behauptung stimmen.
    difficulty: 3

srs:
  cards_from: [euklid, falle]
