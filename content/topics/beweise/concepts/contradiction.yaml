id: logic.proofs.contradiction
type: concept
title: Beweis durch Widerspruch
summary: Unendlich viele Primzahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Ein Detektiv weiß: »War es der Gärtner, hätte der Hund gebellt.« Der Hund blieb still. Was folgt?"
    params:
      options:
        - label: Der Gärtner war es nicht
          correct: true
        - label: Der Gärtner war es
          feedback: Dann hätte der Hund gebellt.
        - label: Nichts
          feedback: Die Stille verrät etwas.
    hints:
      - Nimm an, er war es. Was müsste dann passiert sein?
    explanation: Annehmen, auf Unsinn stoßen, Annahme verwerfen. So geht ein Widerspruchsbeweis.

  - kind: explain
    id: s1
    body: |
      Beim **Widerspruchsbeweis** nimmt man das Gegenteil an und zeigt, dass daraus Unsinn folgt. Dann muss die ursprüngliche Aussage stimmen.

  - kind: problem
    id: plus-eins
    widget: numeric
    prompt: Multipliziere die Primzahlen 2, 3 und 5 und addiere 1. Was kommt heraus?
    params: { placeholder: "Zahl" }
    answer: { value: 31 }
    hints:
      - 2 · 3 · 5 = 30.
    explanation: 31 lässt bei 2, 3 und 5 jeweils Rest 1.

  - kind: problem
    id: euklid
    widget: order
    prompt: Euklids Beweis, dass es unendlich viele Primzahlen gibt. Bring ihn in Reihenfolge.
    params:
      items:
        - { label: "Angenommen, es gibt nur endlich viele Primzahlen" }
        - { label: Multipliziere alle und addiere 1 }
        - { label: Diese Zahl lässt bei jeder Primzahl der Liste Rest 1 }
        - { label: Ihr Primteiler fehlt also in der Liste – Widerspruch }
    hints:
      - Am Anfang steht die Annahme, am Ende der Widerspruch.
    explanation: Jede endliche Liste ist unvollständig – also gibt es unendlich viele Primzahlen.

  - kind: problem
    id: falle
    widget: choice
    body: "2 · 3 · 5 · 7 · 11 · 13 + 1 = 30031 = 59 · 509."
    prompt: Widerlegt das den Beweis, weil 30031 keine Primzahl ist?
    params:
      options:
        - { label: "Nein – 59 und 509 stehen nicht in der Liste", correct: true }
        - { label: "Ja – der Beweis ist falsch", feedback: "Der Beweis behauptet nicht, dass die Zahl selbst prim ist." }
    hints:
      - Was genau behauptet der Beweis über die neue Zahl?
    explanation: Die Zahl hat Primteiler außerhalb der Liste. Genau das reicht für den Widerspruch.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Man nimmt das [[Gegenteil]] an und zeigt, dass daraus ein [[Widerspruch]] folgt. Also war die Annahme falsch.
      distractors:
        - Beispiel
        - Beweis

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Beweise: Es gibt keine kleinste positive Bruchzahl. Wie beginnt der Widerspruchsbeweis?"
    params:
      options:
        - label: »Angenommen, es gäbe eine kleinste – nenn sie q.«
          correct: true
        - label: »Wir prüfen alle Brüche.«
          feedback: Es gibt unendlich viele.
        - label: »1/1000 ist sehr klein.«
          feedback: Ein Beispiel beweist nichts.
    hints:
      - Man nimmt das Gegenteil dessen an, was man zeigen will.
    explanation: Dann wäre q/2 positiv und noch kleiner – Widerspruch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Beweis zeigt nur: »Es muss eine Lösung geben.« Manchen reicht das nicht. Was stört sie?"
    params:
      options:
        - label: Der Beweis sagt nicht, wie man die Lösung findet
          correct: true
        - label: Solche Beweise sind falsch
          feedback: Sie sind logisch sauber.
        - label: Sie sind zu kurz
          feedback: Die Länge ist nicht der Punkt.
    hints:
      - »Es muss eine Lösung geben« – aber welche?
    explanation: Die **konstruktive Mathematik** will den Weg zur Lösung sehen. Für Computer ist das sehr wichtig.
    difficulty: 3

srs:
  cards_from: [euklid, falle]
