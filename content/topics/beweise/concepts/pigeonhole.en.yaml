id: logic.proofs.pigeonhole
type: concept
title: The pigeonhole principle
summary: More pigeons than holes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Four friends, three colours
    body: "Four friends should all wear different colours – but there are only three. Tap the dots to colour them: linked dots must not match. Does it work? Behind it is the **pigeonhole principle**."
    visual:
      widget: network
      interactive: true
      params:
        mode: color
        colors: 3
        nodes:
          - id: ana
            x: 50
            y: 8
            label: Ana
          - id: ben
            x: 12
            y: 92
            label: Ben
          - id: cem
            x: 88
            y: 92
            label: Cem
          - id: dora
            x: 50
            y: 62
            label: Dora
        edges:
          - a: ana
            b: ben
          - a: ana
            b: cem
          - a: ben
            b: cem
          - a: dora
            b: ana
          - a: dora
            b: ben
          - a: dora
            b: cem

  - kind: problem
    id: socken
    widget: numeric
    prompt: A drawer holds socks in {{k}} colors. How many must you pull out in the dark to be sure of a matching pair?
    params: { unit: socks }
    answer: { value: "{{k + 1}}" }
    feedback:
      - when: "numval(state.input) == 2 * k"
        misconception: worst-case-too-high
        text: One sock more than the number of colors is enough. Then a color must repeat.
    hints:
      - In the worst case, you first pull each color once.
    explanation: "After {{k}} socks, each color may appear once. Sock number {{k + 1}} must match one of them."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 3 }

  - kind: explain
    id: s2
    body: |
      **Pigeonhole principle:** if you put more items than drawers, at least one drawer gets two. It sounds trivial, but it proves surprising things.

  - kind: problem
    id: monate
    widget: choice
    prompt: A group has 13 people. What is guaranteed?
    params:
      options:
        - { label: Two have birthdays in the same month., correct: true }
        - { label: Two have birthdays on the same day., feedback: "That would take 367 people." }
        - { label: Nothing, feedback: "13 people, but only 12 months." }
    hints:
      - The 12 months are the drawers.
    explanation: 13 people into 12 months means two share a month.

  - kind: problem
    id: haare
    widget: choice
    body: People have at most about 150,000 hairs on their head. Berlin has around 3.8 million inhabitants.
    prompt: Are there two people in Berlin with exactly the same number of hairs?
    params:
      options:
        - { label: "Yes – guaranteed", correct: true }
        - { label: "Probably, but not certain", feedback: "It is not just likely. It is proven." }
        - { label: No, feedback: "There are far more people than possible hair counts." }
    hints:
      - The possible hair counts are the drawers.
    explanation: There are only about 150,001 drawers for 3.8 million people.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many people must be gathered at least so that three surely share a birth month?
    answer:
      value: 25
    hints:
      - "Two per month still works: 24 people."
    explanation: 2 · 12 + 1 = 25. The generalised pigeonhole principle.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: At least how many people do you need so that {{k}} of them surely share a birth month?
    answer:
      value: "{{12 * (k - 1) + 1}}"
    feedback:
      - when: numval(state.input) == 12 * k
        misconception: k-per-month
        text: With {{12 * k}} it could be exactly {{k}} each – but fewer already suffice.
      - when: numval(state.input) == 12 * (k - 1)
        misconception: off-by-one
        text: Then every month could still have exactly {{k - 1}}. One more!
    hints:
      - How many people fit without any month reaching {{k}}?
      - That is 12 · {{k - 1}}. The next one makes the difference.
    explanation: "12 · {{k - 1}} + 1 = {{12 * (k - 1) + 1}}. In general: with n boxes and more than n · (k − 1) items, some box has at least k."
    difficulty: 2
    variants:
      params:
        k: int[2,6]
      defaults:
        k: 4

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: In every group of at least two people, two of them know the same number of others in the group. Why?
    params:
      options:
        - label: With n people only n − 1 counts are possible – "0" and "everyone else" exclude each other.
          correct: true
        - label: Because acquaintance is always mutual.
          feedback: True, but it does not explain why two have the same count.
        - label: That only holds in large groups.
          feedback: It already holds for two people.
    hints:
      - Which counts are possible with n people? From 0 to n − 1.
      - Can someone know nobody while another knows everyone?
    explanation: There are n people but at most n − 1 different counts. By the pigeonhole principle two share a count.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Can a compression program make **every** file smaller?
    params:
      options:
        - label: No – there are fewer short files than long ones, so two different ones would have to map to the same
          correct: true
        - label: Yes, with a good algorithm
          feedback: No algorithm can get around the pigeonhole principle.
        - label: Yes, if applied repeatedly
          feedback: Otherwise any file could be shrunk to one bit.
    hints:
      - How many 10-bit files exist – and how many with fewer bits?
    explanation: 1024 files of 10 bits but only 1023 shorter ones. Compression wins on typical data and loses on randomness.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a proof by mathematical induction works.
    params:
      keywords:
        - - start
          - anfang
          - erste
          - base
          - first
          - begin
        - - schritt
          - nächste
          - step
          - next
          - n + 1
          - n+1
          - folgt
        - - alle
          - jede
          - all
          - every
        - - domino
          - kette
          - chain
          - reihe
          - row
      min: 3
      sample: "First you show that the statement holds for the start. Then you show the step: if it holds for one number, it holds for the next. As with dominoes, all of them then fall."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: You place points in a square of side 1. At least how many do you need so that two of them are surely at most 0.71 apart?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: corners
        text: Four points in the four corners are 1 apart.
    hints:
      - Split the square into four small squares of side ½.
      - The diagonal of a small square is √2 / 2 ≈ 0.71.
    explanation: "Five points, four small squares: two land in the same one and are at most √2/2 ≈ 0.71 apart. The boxes often have to be cleverly invented first."
    difficulty: 3

srs:
  cards_from: [socken, monate]
