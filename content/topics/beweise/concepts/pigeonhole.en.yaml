id: logic.proofs.pigeonhole
type: concept
title: The pigeonhole principle
summary: More pigeons than holes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: socken
    widget: numeric
    prompt: A drawer holds socks in {{k}} colors. How many must you pull out in the dark to be sure of a matching pair?
    params: { unit: socks }
    answer: { value: "{{k + 1}}" }
    feedback:
      - when: "numval(state.input) == 2 * k"
        misconception: worst-case-too-high
        text: One sock more than the number of colors is enough. Then a color must repeat.
    hints:
      - In the worst case, you first pull each color once.
    explanation: "After {{k}} socks, each color may appear once. Sock number {{k + 1}} must match one of them."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 3 }

  - kind: explain
    body: |
      **Pigeonhole principle:** if you put more items than drawers, at least one drawer gets two. It sounds trivial, but it proves surprising things.

  - kind: problem
    id: monate
    widget: choice
    prompt: A group has 13 people. What is guaranteed?
    params:
      options:
        - { label: Two have birthdays in the same month., correct: true }
        - { label: Two have birthdays on the same day., feedback: "That would take 367 people." }
        - { label: Nothing, feedback: "13 people, but only 12 months." }
    hints:
      - The 12 months are the drawers.
    explanation: 13 people into 12 months means two share a month.

  - kind: problem
    id: haare
    widget: choice
    body: People have at most about 150,000 hairs on their head. Berlin has around 3.8 million inhabitants.
    prompt: Are there two people in Berlin with exactly the same number of hairs?
    params:
      options:
        - { label: "Yes – guaranteed", correct: true }
        - { label: "Probably, but not certain", feedback: "It is not just likely. It is proven." }
        - { label: No, feedback: "There are far more people than possible hair counts." }
    hints:
      - The possible hair counts are the drawers.
    explanation: There are only about 150,001 drawers for 3.8 million people.

srs:
  cards_from: [socken, monate]
