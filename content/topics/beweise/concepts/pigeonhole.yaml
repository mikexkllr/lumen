id: logic.proofs.pigeonhole
type: concept
title: Das Schubfachprinzip
summary: Mehr Tauben als Schläge.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Vier Freunde, drei Farben
    body: "Vier Freunde sollen alle verschiedene Farben tragen – es gibt aber nur drei. Tippe die Punkte an, um sie zu färben: Verbundene Punkte dürfen nicht gleich sein. Klappt es? Dahinter steckt das **Schubfachprinzip**."
    visual:
      widget: network
      interactive: true
      params:
        mode: color
        colors: 3
        nodes:
          - id: ana
            x: 50
            y: 8
            label: Ana
          - id: ben
            x: 12
            y: 92
            label: Ben
          - id: cem
            x: 88
            y: 92
            label: Cem
          - id: dora
            x: 50
            y: 62
            label: Dora
        edges:
          - a: ana
            b: ben
          - a: ana
            b: cem
          - a: ben
            b: cem
          - a: dora
            b: ana
          - a: dora
            b: ben
          - a: dora
            b: cem

  - kind: problem
    id: socken
    widget: numeric
    prompt: In einer Schublade liegen Socken in {{k}} Farben. Wie viele musst du im Dunkeln ziehen, um sicher ein gleichfarbiges Paar zu haben?
    params: { unit: Socken }
    answer: { value: "{{k + 1}}" }
    feedback:
      - when: "numval(state.input) == 2 * k"
        misconception: worst-case-too-high
        text: Schon eine Socke mehr als Farben reicht – dann muss sich eine Farbe wiederholen.
    hints:
      - Im schlimmsten Fall ziehst du erst jede Farbe einmal.
    explanation: "Nach {{k}} Socken kann jede Farbe einmal dabei sein – die {{k + 1}}. passt sicher zu einer."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 3 }

  - kind: explain
    id: s2
    body: |
      **Schubfachprinzip:** Verteilt man mehr Dinge als Schubladen, landen in mindestens einer Schublade zwei. Klingt banal – beweist aber erstaunliche Dinge.

  - kind: problem
    id: monate
    widget: choice
    prompt: In einer Gruppe sind 13 Menschen. Was ist garantiert?
    params:
      options:
        - { label: Zwei haben im selben Monat Geburtstag., correct: true }
        - { label: Zwei haben am selben Tag Geburtstag., feedback: "Dafür bräuchte es 367 Menschen." }
        - { label: Nichts, feedback: "13 Menschen, aber nur 12 Monate." }
    hints:
      - 12 Monate sind die Schubladen.
    explanation: 13 Menschen auf 12 Monate – einer muss sich einen Monat teilen.

  - kind: problem
    id: haare
    widget: choice
    body: Menschen haben höchstens etwa 150 000 Kopfhaare. Berlin hat rund 3,8 Millionen Einwohner.
    prompt: Gibt es in Berlin zwei Menschen mit exakt gleich vielen Haaren?
    params:
      options:
        - { label: Ja – garantiert, correct: true }
        - { label: "Wahrscheinlich, aber nicht sicher", feedback: "Es ist nicht nur wahrscheinlich – es ist bewiesen." }
        - { label: Nein, feedback: "Es gibt viel mehr Menschen als mögliche Haarzahlen." }
    hints:
      - Die möglichen Haarzahlen sind die Schubladen.
    explanation: Es gibt nur etwa 150 001 Schubladen für 3,8 Millionen Menschen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Menschen muss man mindestens versammeln, damit sicher drei im selben Monat Geburtstag haben?
    answer:
      value: 25
    hints:
      - "Zwei pro Monat geht noch gut: 24 Menschen."
    explanation: 2 · 12 + 1 = 25. Das verallgemeinerte Schubfachprinzip.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Wie viele Menschen braucht man mindestens, damit sicher {{k}} im selben Monat Geburtstag haben?
    answer:
      value: "{{12 * (k - 1) + 1}}"
    feedback:
      - when: numval(state.input) == 12 * k
        misconception: k-per-month
        text: Mit {{12 * k}} könnten es noch je {{k}} sein – aber es geht schon mit weniger.
      - when: numval(state.input) == 12 * (k - 1)
        misconception: off-by-one
        text: Dann können noch alle Monate genau {{k - 1}} haben. Einer mehr!
    hints:
      - Wie viele Menschen passen hinein, ohne dass ein Monat {{k}} hat?
      - Das sind 12 · {{k - 1}}. Der Nächste macht den Unterschied.
    explanation: "12 · {{k - 1}} + 1 = {{12 * (k - 1) + 1}}. Allgemein: Bei n Fächern und mehr als n · (k − 1) Dingen hat ein Fach mindestens k."
    difficulty: 2
    variants:
      params:
        k: int[2,6]
      defaults:
        k: 4

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: In jeder Gruppe von mindestens zwei Menschen gibt es zwei, die gleich viele Bekannte in der Gruppe haben. Warum?
    params:
      options:
        - label: Bei n Menschen gibt es nur n − 1 mögliche Anzahlen – »0« und »alle anderen« schließen sich aus.
          correct: true
        - label: Weil Freundschaften immer gegenseitig sind.
          feedback: Das stimmt, erklärt aber nicht, warum zwei gleich viele haben.
        - label: Das gilt nur in großen Gruppen.
          feedback: Es gilt schon bei zwei Menschen.
    hints:
      - Welche Anzahlen sind bei n Menschen möglich? Von 0 bis n − 1.
      - Kann jemand niemanden kennen, während ein anderer alle kennt?
    explanation: Es gibt n Menschen, aber höchstens n − 1 verschiedene Anzahlen. Nach dem **Schubfachprinzip** teilen sich zwei eine Anzahl.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kann ein Kompressionsprogramm **jede** Datei kleiner machen?
    params:
      options:
        - label: Nein – es gibt weniger kurze Dateien als lange, also müssten zwei verschiedene auf dieselbe abgebildet werden
          correct: true
        - label: Ja, mit einem guten Algorithmus
          feedback: Kein Algorithmus kann das Schubfachprinzip umgehen.
        - label: Ja, wenn man es mehrfach anwendet
          feedback: Sonst könnte man jede Datei auf ein Bit schrumpfen.
    hints:
      - Wie viele Dateien mit 10 Bit gibt es – und wie viele mit weniger?
    explanation: 1024 Dateien mit 10 Bit, aber nur 1023 kürzere. Kompression gewinnt bei typischen Daten und verliert bei Zufall.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Beweis durch vollständige Induktion funktioniert.
    params:
      keywords:
        - - start
          - anfang
          - erste
          - base
          - first
          - begin
        - - schritt
          - nächste
          - step
          - next
          - n + 1
          - n+1
          - folgt
        - - alle
          - jede
          - all
          - every
        - - domino
          - kette
          - chain
          - reihe
          - row
      min: 3
      sample: "Man zeigt erst, dass die Aussage für den Anfang gilt. Dann zeigt man den Schritt: Gilt sie für eine Zahl, dann auch für die nächste. Wie bei Dominosteinen fallen damit alle."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Man legt Punkte in ein Quadrat mit Seitenlänge 1. Wie viele braucht man mindestens, damit sicher zwei höchstens 0,71 voneinander entfernt sind?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: corners
        text: Vier Punkte in die vier Ecken liegen 1 auseinander.
    hints:
      - Teile das Quadrat in vier kleine Quadrate mit Seite ½.
      - Die Diagonale eines kleinen Quadrats ist √2 / 2 ≈ 0,71.
    explanation: "Fünf Punkte, vier kleine Quadrate: Zwei landen im selben und sind höchstens √2/2 ≈ 0,71 entfernt. Die **Fächer** muss man oft erst geschickt erfinden."
    difficulty: 3

srs:
  cards_from: [socken, monate]
