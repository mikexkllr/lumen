id: logic.proofs.pigeonhole
type: concept
title: Das Schubfachprinzip
summary: Mehr Tauben als Schläge.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: socken
    widget: numeric
    prompt: In einer Schublade liegen Socken in {{k}} Farben. Wie viele musst du im Dunkeln ziehen, um sicher ein gleichfarbiges Paar zu haben?
    params: { unit: Socken }
    answer: { value: "{{k + 1}}" }
    feedback:
      - when: "numval(state.input) == 2 * k"
        misconception: worst-case-too-high
        text: Schon eine Socke mehr als Farben reicht – dann muss sich eine Farbe wiederholen.
    hints:
      - Im schlimmsten Fall ziehst du erst jede Farbe einmal.
    explanation: "Nach {{k}} Socken kann jede Farbe einmal dabei sein – die {{k + 1}}. passt sicher zu einer."
    variants:
      params: { k: "int[2,6]" }
      defaults: { k: 3 }

  - kind: explain
    id: s2
    body: |
      **Schubfachprinzip:** Verteilt man mehr Dinge als Schubladen, landen in mindestens einer Schublade zwei. Klingt banal – beweist aber erstaunliche Dinge.

  - kind: problem
    id: monate
    widget: choice
    prompt: In einer Gruppe sind 13 Menschen. Was ist garantiert?
    params:
      options:
        - { label: Zwei haben im selben Monat Geburtstag., correct: true }
        - { label: Zwei haben am selben Tag Geburtstag., feedback: "Dafür bräuchte es 367 Menschen." }
        - { label: Nichts, feedback: "13 Menschen, aber nur 12 Monate." }
    hints:
      - 12 Monate sind die Schubladen.
    explanation: 13 Menschen auf 12 Monate – einer muss sich einen Monat teilen.

  - kind: problem
    id: haare
    widget: choice
    body: Menschen haben höchstens etwa 150 000 Kopfhaare. Berlin hat rund 3,8 Millionen Einwohner.
    prompt: Gibt es in Berlin zwei Menschen mit exakt gleich vielen Haaren?
    params:
      options:
        - { label: Ja – garantiert, correct: true }
        - { label: "Wahrscheinlich, aber nicht sicher", feedback: "Es ist nicht nur wahrscheinlich – es ist bewiesen." }
        - { label: Nein, feedback: "Es gibt viel mehr Menschen als mögliche Haarzahlen." }
    hints:
      - Die möglichen Haarzahlen sind die Schubladen.
    explanation: Es gibt nur etwa 150 001 Schubladen für 3,8 Millionen Menschen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Menschen muss man mindestens versammeln, damit sicher drei im selben Monat Geburtstag haben?
    answer:
      value: 25
    hints:
      - "Zwei pro Monat geht noch gut: 24 Menschen."
    explanation: 2 · 12 + 1 = 25. Das verallgemeinerte Schubfachprinzip.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kann ein Kompressionsprogramm **jede** Datei kleiner machen?
    params:
      options:
        - label: Nein – es gibt weniger kurze Dateien als lange, also müssten zwei verschiedene auf dieselbe abgebildet werden
          correct: true
        - label: Ja, mit einem guten Algorithmus
          feedback: Kein Algorithmus kann das Schubfachprinzip umgehen.
        - label: Ja, wenn man es mehrfach anwendet
          feedback: Sonst könnte man jede Datei auf ein Bit schrumpfen.
    hints:
      - Wie viele Dateien mit 10 Bit gibt es – und wie viele mit weniger?
    explanation: 1024 Dateien mit 10 Bit, aber nur 1023 kürzere. Kompression gewinnt bei typischen Daten und verliert bei Zufall.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Beweis durch vollständige Induktion funktioniert.
    params:
      keywords:
        - - start
          - anfang
          - erste
          - base
          - first
          - begin
        - - schritt
          - nächste
          - step
          - next
          - n + 1
          - n+1
          - folgt
        - - alle
          - jede
          - all
          - every
        - - domino
          - kette
          - chain
          - reihe
          - row
      min: 3
      sample: "Man zeigt erst, dass die Aussage für den Anfang gilt. Dann zeigt man den Schritt: Gilt sie für eine Zahl, dann auch für die nächste. Wie bei Dominosteinen fallen damit alle."
    difficulty: 3

srs:
  cards_from: [socken, monate]
