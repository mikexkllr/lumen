id: logic.proofs.direct
type: concept
title: The direct proof
summary: For all numbers at once.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Numbers as double rows
    body: A proof shows something for all numbers at once – a picture often does it fastest. Even numbers fit into a **double row**. Switch cells on to build numbers. When is one cell left alone?
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 2
        cols: 8
        counter: true

  - kind: problem
    id: hook
    widget: choice
    prompt: Even number plus even number – is the result always even?
    params:
      options:
        - label: Yes, always
          correct: true
        - label: Only sometimes
          feedback: Try a few examples.
        - label: Never
          feedback: 2 + 4 = 6 is even.
    hints:
      - Try 2 + 4 or 10 + 6.
    explanation: Examples fit. But how do you show it for all numbers at once?

  - kind: explain
    id: s1
    body: |
      Write even numbers as $2a$ and **odd** numbers as $2a + 1$, for any integer a. This lets you talk about **all** numbers at once.

  - kind: problem
    id: dreier
    widget: choice
    prompt: How do you write any number that is divisible by 3?
    params:
      options:
        - { label: "3k", correct: true }
        - { label: "k + 3", feedback: "For k = 1 that would be 4, which is not divisible by 3." }
        - { label: "k³", feedback: "For k = 2 that would be 8." }
    hints:
      - Divisible by 3 means a multiple of 3.
    explanation: Every multiple of 3 has the form 3k.

  - kind: problem
    id: beweis
    widget: order
    prompt: "Prove: the sum of two odd numbers is even. Put the steps in order."
    params:
      items:
        - { label: Take two odd numbers 2a + 1 and 2b + 1 }
        - { label: "Add them: 2a + 2b + 2" }
        - { label: "Factor out: 2(a + b + 1)" }
        - { label: A multiple of 2 is even }
    hints:
      - First write it down, then calculate, then conclude.
    explanation: Since a and b are arbitrary, this holds for all odd numbers.

  - kind: problem
    id: mal
    widget: choice
    prompt: An even number times any integer. What do you get?
    params:
      options:
        - { label: Always an even number, correct: true }
        - { label: Sometimes an odd number, feedback: "Try 2a · b. Can you factor out the 2?" }
    hints:
      - Write the even number as 2a.
    explanation: 2a · b = 2(ab), always a multiple of 2.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Every even number has the form [[2a]], every odd one the form [[2a + 1]].
      distractors:
        - 3a
        - a + 1

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: "Prove: the square of an odd number is odd. Order the steps."
    params:
      items:
        - label: Let n be odd, so n = 2a + 1.
        - label: Then n² = 4a² + 4a + 1.
        - label: That is 2 · (2a² + 2a) + 1.
        - label: So n² has the form “even number plus 1” – odd.
    hints:
      - First write the number in general form, then calculate.
    explanation: "A direct proof: from the premise to the goal in safe steps."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: "Prove: the sum of three consecutive integers is divisible by 3. Put in order."
    params:
      items:
        - label: Call the numbers n, n + 1 and n + 2.
        - label: "Add: n + (n + 1) + (n + 2) = 3n + 3."
        - label: "Factor: 3n + 3 = 3 · (n + 1)."
        - label: So the sum is a multiple of 3.
    hints:
      - Start by naming the numbers in general.
      - After adding comes factoring.
    explanation: The proof uses an arbitrary number n – so it holds for all. As a bonus, 3 · (n + 1) shows that the sum is three times the middle number.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Why is n² + n even for every integer n?
    params:
      options:
        - label: n² + n = n · (n + 1), and one of two neighbouring numbers is even.
          correct: true
        - label: Because n² is always even.
          feedback: 3² = 9 is odd.
        - label: That only holds for even n.
          feedback: 3² + 3 = 12 is even too.
    hints:
      - Factor out n.
      - What do you know about n and n + 1?
    explanation: "Factoring shows the structure: a product with an even factor is even. Such rewritings are the tool of direct proofs."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is the product of **three consecutive** integers always divisible by 6?
    params:
      options:
        - label: Among three consecutive numbers one is always divisible by 3 and at least one by 2
          correct: true
        - label: Because 1 · 2 · 3 = 6
          feedback: One example is no proof for all.
        - label: That is not always true
          feedback: Try 4 · 5 · 6 = 120 or 7 · 8 · 9 = 504.
    hints:
      - Every third number is divisible by 3, every second by 2.
    explanation: An argument that holds for **every** triple – without any calculation.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: 'To prove: "If n² is even, then n is even." What is the smartest way?'
    params:
      options:
        - label: "Prove the contrapositive: if n is odd, then n² is odd."
          correct: true
        - label: "Prove the converse: if n is even, then n² is even."
          feedback: The converse is a different statement – it does not prove the original.
        - label: Check many even squares.
          feedback: Examples do not prove a "for all".
    hints:
      - '"If A then B" is equivalent to "if not B then not A".'
      - Compute (2k + 1)².
    explanation: (2k + 1)² = 4k² + 4k + 1 = 2(2k² + 2k) + 1 is odd. The contrapositive is logically equivalent – and much easier to show here.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a direct proof shows a statement for all numbers at once.
    params:
      keywords:
        - - beliebig
          - allgemein
          - buchstabe
          - variable
          - arbitrary
          - general
          - letter
        - - 2a
          - 2k
          - form
        - - umform
          - rechn
          - schritt
          - rewrite
          - compute
          - step
      sample: You take an arbitrary number and write it in general form, like 2k for even numbers. Then you rewrite step by step until the claim appears. Since k was arbitrary, it holds for all.
    difficulty: 3

srs:
  cards_from: [dreier, mal]
