id: logic.proofs.contradiction
type: concept
title: Proof by contradiction
summary: Infinitely many primes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Rule out the impossible
    body: "Detectives and mathematicians share a trick: they assume the opposite and wait for it to blow up. Uncover the cards and see how powerful **contradiction** is as a tool."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🕵️
            front: Sherlock Holmes
            back: '"When you have eliminated the impossible, whatever remains must be the truth."'
          - icon: 🧩
            front: The alibi
            back: Whoever was in Paris at the time cannot have been in Berlin. Every alibi is a proof by contradiction.
          - icon: 🔢
            front: The largest number?
            back: If there were a largest number N, then N + 1 would be even larger. Contradiction – so there is none.
          - icon: 📐
            front: Since ancient times
            back: Over 2,000 years ago, Greeks used this trick to prove that some lengths are not fractions.

  - kind: problem
    id: hook
    widget: choice
    prompt: "A detective knows: “If it was the gardener, the dog would have barked.” The dog stayed silent. What follows?"
    params:
      options:
        - label: It was not the gardener
          correct: true
        - label: It was the gardener
          feedback: Then the dog would have barked.
        - label: Nothing
          feedback: The silence reveals something.
    hints:
      - Suppose it was him. What should have happened then?
    explanation: Assume, hit nonsense, drop the assumption. That is a proof by contradiction.

  - kind: explain
    id: s1
    body: |
      In a **proof by contradiction**, you assume the opposite and show that it leads to nonsense. Then the original statement must be true.

  - kind: problem
    id: plus-eins
    widget: numeric
    prompt: Multiply the primes 2, 3 and 5, then add 1. What do you get?
    params: { placeholder: "Number" }
    answer: { value: 31 }
    hints:
      - 2 · 3 · 5 = 30.
    explanation: 31 leaves remainder 1 when divided by 2, 3 or 5.

  - kind: problem
    id: euklid
    widget: order
    prompt: Euclid's proof that there are infinitely many primes. Put it in order.
    params:
      items:
        - { label: "Suppose there are only finitely many primes" }
        - { label: Multiply them all and add 1 }
        - { label: This number leaves remainder 1 for every prime on the list }
        - { label: So its prime factor is missing from the list – contradiction }
    hints:
      - The assumption comes first, the contradiction last.
    explanation: Every finite list is incomplete, so there are infinitely many primes.

  - kind: problem
    id: falle
    widget: choice
    body: "2 · 3 · 5 · 7 · 11 · 13 + 1 = 30031 = 59 · 509."
    prompt: Does this disprove the proof, because 30031 is not prime?
    params:
      options:
        - { label: "No – 59 and 509 are not on the list", correct: true }
        - { label: "Yes – the proof is wrong", feedback: "The proof does not claim that the number itself is prime." }
    hints:
      - What exactly does the proof claim about the new number?
    explanation: The number has prime factors outside the list. That is enough for the contradiction.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: You assume the [[opposite]] and show that a [[contradiction]] follows. So the assumption was wrong.
      distractors:
        - example
        - proof

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Prove: there is no smallest positive fraction. How does the proof by contradiction begin?"
    params:
      options:
        - label: “Suppose there were a smallest one – call it q.”
          correct: true
        - label: “We check all fractions.”
          feedback: There are infinitely many.
        - label: “1/1000 is very small.”
          feedback: An example proves nothing.
    hints:
      - You assume the opposite of what you want to show.
    explanation: Then q/2 would be positive and even smaller – contradiction.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: Prove that √2 is not a fraction. Put the steps in order.
    params:
      items:
        - label: Suppose √2 = p/q, fully reduced.
        - label: Squaring gives p² = 2q². So p² is even, so p is even.
        - label: "Put p = 2k: 4k² = 2q², so q² = 2k². So q is even too."
        - label: Then p/q could be reduced by 2 – contradiction!
        - label: So √2 is irrational.
    hints:
      - A proof by contradiction starts with the opposite of the claim.
      - First p is shown to be even, then q.
    explanation: 'The assumption "reduced" and the result "both even" cannot both hold. So the assumption was false: √2 is irrational.'
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: The proof says p² = 2q². Why must p then be even?
    params:
      options:
        - label: If p were odd, p² would be odd too.
          correct: true
        - label: Because 2q² is divisible by 4.
          feedback: We do not know that yet – q could be odd.
        - label: Because p is smaller than q.
          feedback: It is actually larger, since √2 > 1. Size plays no part here.
    hints:
      - p² is even because it equals 2 · q².
      - What is an odd number squared?
    explanation: Odd times odd is odd. If p² is even, p cannot be odd. That is the contrapositive from the last chapter.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A proof only shows: “There must be a solution.” For some that is not enough. What bothers them?"
    params:
      options:
        - label: The proof does not say how to find the solution
          correct: true
        - label: Such proofs are wrong
          feedback: They are logically sound.
        - label: They are too short
          feedback: Length is not the point.
    hints:
      - “There must be a solution” – but which one?
    explanation: "**Constructive mathematics** wants to see the way to the solution. That matters a lot for computers."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Are there irrational a and b with aᵇ rational? A proof looks at x = √2^√2. How does it continue?
    params:
      options:
        - label: "If x is rational, done. Otherwise take a = x, b = √2: then aᵇ = √2² = 2."
          correct: true
        - label: You compute x to many digits.
          feedback: Digits never show whether a number is rational.
        - label: "It cannot work: irrational to an irrational power is irrational."
          feedback: That is exactly what the proof refutes.
    hints:
      - "There are only two cases: x is rational or it is not."
      - (√2^√2)^√2 = √2^(√2 · √2).
    explanation: In both cases a pair exists – but the proof does not say which. Some mathematicians reject such non-constructive proofs. (In fact x is irrational, but that is much harder to show.)
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a proof by contradiction works.
    params:
      keywords:
        - - gegenteil
          - annahme
          - angenommen
          - opposite
          - assume
          - suppose
        - - widerspruch
          - unsinn
          - unmöglich
          - contradiction
          - impossible
          - nonsense
        - - also
          - daher
          - muss
          - so
          - therefore
          - must
      sample: You assume the opposite of the claim and work with it. If a contradiction comes out, the assumption was false. So the claim must be true.
    difficulty: 3

srs:
  cards_from: [euklid, falle]
