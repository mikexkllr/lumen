id: logic.proofs.contradiction
type: concept
title: Proof by contradiction
summary: Infinitely many primes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "A detective knows: “If it was the gardener, the dog would have barked.” The dog stayed silent. What follows?"
    params:
      options:
        - label: It was not the gardener
          correct: true
        - label: It was the gardener
          feedback: Then the dog would have barked.
        - label: Nothing
          feedback: The silence reveals something.
    hints:
      - Suppose it was him. What should have happened then?
    explanation: Assume, hit nonsense, drop the assumption. That is a proof by contradiction.

  - kind: explain
    id: s1
    body: |
      In a **proof by contradiction**, you assume the opposite and show that it leads to nonsense. Then the original statement must be true.

  - kind: problem
    id: plus-eins
    widget: numeric
    prompt: Multiply the primes 2, 3 and 5, then add 1. What do you get?
    params: { placeholder: "Number" }
    answer: { value: 31 }
    hints:
      - 2 · 3 · 5 = 30.
    explanation: 31 leaves remainder 1 when divided by 2, 3 or 5.

  - kind: problem
    id: euklid
    widget: order
    prompt: Euclid's proof that there are infinitely many primes. Put it in order.
    params:
      items:
        - { label: "Suppose there are only finitely many primes" }
        - { label: Multiply them all and add 1 }
        - { label: This number leaves remainder 1 for every prime on the list }
        - { label: So its prime factor is missing from the list – contradiction }
    hints:
      - The assumption comes first, the contradiction last.
    explanation: Every finite list is incomplete, so there are infinitely many primes.

  - kind: problem
    id: falle
    widget: choice
    body: "2 · 3 · 5 · 7 · 11 · 13 + 1 = 30031 = 59 · 509."
    prompt: Does this disprove the proof, because 30031 is not prime?
    params:
      options:
        - { label: "No – 59 and 509 are not on the list", correct: true }
        - { label: "Yes – the proof is wrong", feedback: "The proof does not claim that the number itself is prime." }
    hints:
      - What exactly does the proof claim about the new number?
    explanation: The number has prime factors outside the list. That is enough for the contradiction.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: You assume the [[opposite]] and show that a [[contradiction]] follows. So the assumption was wrong.
      distractors:
        - example
        - proof

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Prove: there is no smallest positive fraction. How does the proof by contradiction begin?"
    params:
      options:
        - label: “Suppose there were a smallest one – call it q.”
          correct: true
        - label: “We check all fractions.”
          feedback: There are infinitely many.
        - label: “1/1000 is very small.”
          feedback: An example proves nothing.
    hints:
      - You assume the opposite of what you want to show.
    explanation: Then q/2 would be positive and even smaller – contradiction.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A proof only shows: “There must be a solution.” For some that is not enough. What bothers them?"
    params:
      options:
        - label: The proof does not say how to find the solution
          correct: true
        - label: Such proofs are wrong
          feedback: They are logically sound.
        - label: They are too short
          feedback: Length is not the point.
    hints:
      - “There must be a solution” – but which one?
    explanation: "**Constructive mathematics** wants to see the way to the solution. That matters a lot for computers."
    difficulty: 3

srs:
  cards_from: [euklid, falle]
