id: logic.proofs.contradiction
type: concept
title: Proof by contradiction
summary: Infinitely many primes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      In a **proof by contradiction**, you assume the opposite and show that it leads to nonsense. Then the original statement must be true.

  - kind: problem
    id: plus-eins
    widget: numeric
    prompt: Multiply the primes 2, 3 and 5, then add 1. What do you get?
    params: { placeholder: "Number" }
    answer: { value: 31 }
    hints:
      - 2 · 3 · 5 = 30.
    explanation: 31 leaves remainder 1 when divided by 2, 3 or 5.

  - kind: problem
    id: euklid
    widget: order
    prompt: Euclid's proof that there are infinitely many primes. Put it in order.
    params:
      items:
        - { label: "Suppose there are only finitely many primes" }
        - { label: Multiply them all and add 1 }
        - { label: This number leaves remainder 1 for every prime on the list }
        - { label: So its prime factor is missing from the list – contradiction }
    hints:
      - The assumption comes first, the contradiction last.
    explanation: Every finite list is incomplete, so there are infinitely many primes.

  - kind: problem
    id: falle
    widget: choice
    body: "2 · 3 · 5 · 7 · 11 · 13 + 1 = 30031 = 59 · 509."
    prompt: Does this disprove the proof, because 30031 is not prime?
    params:
      options:
        - { label: "No – 59 and 509 are not on the list", correct: true }
        - { label: "Yes – the proof is wrong", feedback: "The proof does not claim that the number itself is prime." }
    hints:
      - What exactly does the proof claim about the new number?
    explanation: The number has prime factors outside the list. That is enough for the contradiction.

srs:
  cards_from: [euklid, falle]
