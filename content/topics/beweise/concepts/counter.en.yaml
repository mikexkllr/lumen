id: logic.proofs.counter
type: concept
title: Examples prove nothing
summary: One counterexample is enough.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: tausend
    widget: choice
    prompt: Someone tests a claim on 1000 examples, and all of them fit. Is it proven?
    params:
      options:
        - { label: "No – example 1001 might fail", correct: true }
        - { label: "Yes – 1000 is enough", feedback: "Some claims only fail at huge numbers." }
    hints:
      - How many numbers are there in total?
    explanation: You cannot try out infinitely many cases.

  - kind: problem
    id: euler
    widget: numeric
    body: "The formula n² + n + 41 gives only primes for n = 0, 1, 2, 3, …: 41, 43, 47, 53, …"
    prompt: What does it give for n = 40?
    params: { placeholder: "Number" }
    answer: { value: 1681 }
    hints:
      - 1600 + 40 + 41.
    explanation: 1681 = 41 · 41 – not prime! After 40 hits, the formula fails.

  - kind: explain
    id: s3
    body: |
      A single **counterexample** disproves a statement about all numbers. A **proof**, on the other hand, needs an argument that holds for all cases at once.

  - kind: problem
    id: primzahl
    widget: choice
    prompt: "“Every prime is odd.” Which number shows that this is false?"
    params:
      options:
        - { label: "2", correct: true }
        - { label: "9", feedback: "9 = 3 · 3 is not prime." }
        - { label: "1", feedback: "1 does not count as a prime." }
    hints:
      - Which prime is even?
    explanation: 2 is prime and even. So the statement is false.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: The sum of two primes is always even.
          right: false
          why: 2 + 3 = 5.
        - text: The product of two odd numbers is always odd.
          right: true
        - text: Every number divisible by 3 is also divisible by 6.
          right: false
          why: 9 is divisible by 3 but not by 6.
        - text: Every number divisible by 6 is also divisible by 3.
          right: true
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The formula n² + n + 41 gives nothing but primes for n = 0 to 39. For which n is the result surely divisible by 41 – hence not prime? Give the smallest n above 0.
    answer:
      value: 40
    hints:
      - "For n = 40: 40² + 40 + 41 = 40 · 41 + 41."
    explanation: 41 · 41 = 1681. Forty hits in a row – and still false.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A conjecture of Euler was refuted in 1966 after almost 200 years by a single counterexample – found by a computer. What does that show?
    params:
      options:
        - label: Even long standing and great names do not replace a proof
          correct: true
        - label: Euler was a poor mathematician
          feedback: He was one of the greatest – and expressly called it a conjecture.
        - label: Computers prove better than humans
          feedback: The computer found a counterexample – that is searching, not proving.
    hints:
      - How many examples had fitted before?
    explanation: 27⁵ + 84⁵ + 110⁵ + 133⁵ = 144⁵. The publication was two sentences long.
    difficulty: 3

srs:
  cards_from: [tausend, primzahl]
