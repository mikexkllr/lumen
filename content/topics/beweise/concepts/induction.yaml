id: logic.proofs.induction
type: concept
title: Der Domino-Beweis
summary: Vollständige Induktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: ungerade
    widget: numeric
    prompt: Addiere die ersten {{n}} ungeraden Zahlen 1 + 3 + 5 + …
    params: { placeholder: "Summe" }
    answer: { value: "{{n * n}}" }
    hints:
      - "1 = 1, 1 + 3 = 4, 1 + 3 + 5 = 9 … fällt dir etwas auf?"
    explanation: "Das ergibt {{n * n}} = {{n}}² – immer eine Quadratzahl."
    variants:
      params: { n: "int[4,12]" }
      defaults: { n: 6 }

  - kind: explain
    id: s2
    body: |
      **Induktion** funktioniert wie Dominosteine: Fällt der erste Stein, und stößt jeder fallende Stein den nächsten um, dann fallen alle.

  - kind: problem
    id: schritte
    widget: order
    prompt: Bring die Schritte eines Induktionsbeweises in Reihenfolge.
    params:
      items:
        - { label: "Prüfe den Start: es gilt für n = 1" }
        - { label: "Nimm an, es gilt für ein n" }
        - { label: "Zeige, dass es dann auch für n + 1 gilt" }
        - { label: Also gilt es für alle n }
    hints:
      - Erst der erste Stein, dann der Mechanismus.
    explanation: Start plus Schritt – zusammen erfassen sie unendlich viele Fälle.

  - kind: problem
    id: ohne-start
    widget: choice
    prompt: Jemand zeigt nur, dass aus n immer n + 1 folgt – aber nicht den Start. Reicht das?
    params:
      options:
        - { label: "Nein – ohne den ersten Stein fällt keiner", correct: true }
        - { label: Ja, feedback: "»Wenn es für 5 gilt, gilt es für 6« sagt nichts, solange es für keine Zahl gilt." }
    hints:
      - Was passiert mit einer Reihe Dominos, die niemand anstößt?
    explanation: Beide Teile sind nötig – Start und Schritt.

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: "Beweise per Induktion: 1 + 2 + … + n = n(n + 1)/2. Ordne die Schritte."
    params:
      items:
        - label: "Start: Für n = 1 stimmt es, denn 1 = 1 · 2 / 2."
        - label: "Annahme: Für ein n gilt die Formel."
        - label: "Addiere n + 1: n(n + 1)/2 + (n + 1)."
        - label: Das ergibt (n + 1)(n + 2)/2 – die Formel für n + 1.
    hints:
      - Erst der erste Dominostein, dann der Schritt von n zu n + 1.
    explanation: Start und Schritt zusammen decken alle natürlichen Zahlen ab.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "»Beweis«, dass alle Pferde dieselbe Farbe haben: Für 1 Pferd klar. Sind je n Pferde gleichfarbig, dann auch je n + 1 – man nimmt zwei überlappende Gruppen von n. Wo steckt der Fehler?"
    params:
      options:
        - label: "Beim Schritt von 1 auf 2: Die beiden Gruppen überlappen dort gar nicht"
          correct: true
        - label: Der Start für 1 Pferd ist falsch
          feedback: Ein einzelnes Pferd hat nur eine Farbe.
        - label: Induktion funktioniert nicht bei Tieren
          feedback: Der Fehler ist rein logisch.
    hints:
      - Zwei Gruppen aus je einem Pferd – haben sie ein gemeinsames Pferd?
    explanation: Der Schritt muss für **jedes** n gelten. Ein einziger kaputter Dominostein stoppt die ganze Kette.
    difficulty: 3

srs:
  cards_from: [schritte, ohne-start]
