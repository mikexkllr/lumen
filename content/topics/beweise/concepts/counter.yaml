id: logic.proofs.counter
type: concept
title: Beispiele beweisen nichts
summary: Ein Gegenbeispiel reicht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: tausend
    widget: choice
    prompt: Jemand prüft eine Behauptung an 1000 Beispielen – alle passen. Ist sie damit bewiesen?
    params:
      options:
        - { label: "Nein – Beispiel 1001 könnte scheitern", correct: true }
        - { label: "Ja – 1000 sind genug", feedback: "Es gibt Behauptungen, die erst bei riesigen Zahlen scheitern." }
    hints:
      - Wie viele Zahlen gibt es insgesamt?
    explanation: Unendlich viele Fälle lassen sich nicht durchprobieren.

  - kind: problem
    id: euler
    widget: numeric
    body: "Die Formel n² + n + 41 liefert für n = 0, 1, 2, 3, … lauter Primzahlen: 41, 43, 47, 53, …"
    prompt: Was ergibt sie für n = 40?
    params: { placeholder: "Zahl" }
    answer: { value: 1681 }
    hints:
      - 1600 + 40 + 41.
    explanation: 1681 = 41 · 41 – keine Primzahl! Nach 40 Treffern scheitert die Formel.

  - kind: explain
    id: s3
    body: |
      Ein einziges **Gegenbeispiel** widerlegt eine Aussage über alle Zahlen. Ein **Beweis** dagegen braucht ein Argument, das für alle Fälle gleichzeitig gilt.

  - kind: problem
    id: primzahl
    widget: choice
    prompt: "»Jede Primzahl ist ungerade.« Welche Zahl zeigt, dass das falsch ist?"
    params:
      options:
        - { label: "2", correct: true }
        - { label: "9", feedback: "9 = 3 · 3 ist keine Primzahl." }
        - { label: "1", feedback: "1 zählt nicht als Primzahl." }
    hints:
      - Welche Primzahl ist gerade?
    explanation: 2 ist prim und gerade. Also stimmt der Satz nicht.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Die Summe zweier Primzahlen ist immer gerade.
          right: false
          why: 2 + 3 = 5.
        - text: Das Produkt zweier ungerader Zahlen ist immer ungerade.
          right: true
        - text: Jede Zahl, die durch 3 teilbar ist, ist auch durch 6 teilbar.
          right: false
          why: 9 ist durch 3, aber nicht durch 6 teilbar.
        - text: Jede Zahl, die durch 6 teilbar ist, ist auch durch 3 teilbar.
          right: true
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Formel n² + n + 41 liefert für n = 0 bis 39 lauter Primzahlen. Für welches n ist das Ergebnis sicher durch 41 teilbar – also keine Primzahl? Nenne das kleinste n über 0.
    answer:
      value: 40
    hints:
      - "Für n = 40: 40² + 40 + 41 = 40 · 41 + 41."
    explanation: 41 · 41 = 1681. Vierzig Treffer in Folge – und trotzdem falsch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Vermutung von Euler wurde 1966 nach fast 200 Jahren durch ein einziges Gegenbeispiel widerlegt – gefunden von einem Computer. Was zeigt das?
    params:
      options:
        - label: Auch lange Bewährung und große Namen ersetzen keinen Beweis
          correct: true
        - label: Euler war ein schlechter Mathematiker
          feedback: Er war einer der größten – und nannte es ausdrücklich eine Vermutung.
        - label: Computer beweisen besser als Menschen
          feedback: Der Computer fand ein Gegenbeispiel – das ist Suchen, nicht Beweisen.
    hints:
      - Wie viele Beispiele hatten vorher gepasst?
    explanation: 27⁵ + 84⁵ + 110⁵ + 133⁵ = 144⁵. Die Veröffentlichung war zwei Sätze lang.
    difficulty: 3

srs:
  cards_from: [tausend, primzahl]
