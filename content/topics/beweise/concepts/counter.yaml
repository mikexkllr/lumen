id: logic.proofs.counter
type: concept
title: Beispiele beweisen nichts
summary: Ein Gegenbeispiel reicht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: tausend
    widget: choice
    prompt: Jemand prüft eine Behauptung an 1000 Beispielen – alle passen. Ist sie damit bewiesen?
    params:
      options:
        - { label: "Nein – Beispiel 1001 könnte scheitern", correct: true }
        - { label: "Ja – 1000 sind genug", feedback: "Es gibt Behauptungen, die erst bei riesigen Zahlen scheitern." }
    hints:
      - Wie viele Zahlen gibt es insgesamt?
    explanation: Unendlich viele Fälle lassen sich nicht durchprobieren.

  - kind: problem
    id: euler
    widget: numeric
    body: "Die Formel n² + n + 41 liefert für n = 0, 1, 2, 3, … lauter Primzahlen: 41, 43, 47, 53, …"
    prompt: Was ergibt sie für n = 40?
    params: { placeholder: "Zahl" }
    answer: { value: 1681 }
    hints:
      - 1600 + 40 + 41.
    explanation: 1681 = 41 · 41 – keine Primzahl! Nach 40 Treffern scheitert die Formel.

  - kind: explain
    body: |
      Ein einziges **Gegenbeispiel** widerlegt eine Aussage über alle Zahlen. Ein **Beweis** dagegen braucht ein Argument, das für alle Fälle gleichzeitig gilt.

  - kind: problem
    id: primzahl
    widget: choice
    prompt: "»Jede Primzahl ist ungerade.« Welche Zahl zeigt, dass das falsch ist?"
    params:
      options:
        - { label: "2", correct: true }
        - { label: "9", feedback: "9 = 3 · 3 ist keine Primzahl." }
        - { label: "1", feedback: "1 zählt nicht als Primzahl." }
    hints:
      - Welche Primzahl ist gerade?
    explanation: 2 ist prim und gerade. Also stimmt der Satz nicht.

srs:
  cards_from: [tausend, primzahl]
