id: logic.proofs.counter
type: concept
title: Beispiele beweisen nichts
summary: Ein Gegenbeispiel reicht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Muster, das bricht
    body: "Ein **Muster**, das fünfmal stimmt, stimmt immer – oder? Deck die Karten der Reihe nach auf: Punkte auf einem Kreis werden verbunden, und die Stücke verdoppeln sich. Achte genau auf die letzte Karte."
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: ⚫
            front: 2 Punkte auf dem Kreis
            back: "Verbinde sie mit einer Linie: Der Kreis zerfällt in 2 Stücke."
          - icon: 🔺
            front: 3 Punkte
            back: "Verbinde alle miteinander: 4 Stücke."
          - icon: 🔷
            front: 4 Punkte
            back: "Verbinde alle miteinander: 8 Stücke. Es verdoppelt sich!"
          - icon: ⭐
            front: 5 Punkte
            back: "Verbinde alle miteinander: 16 Stücke. Das Muster ist klar … oder?"
          - icon: 😮
            front: 6 Punkte
            back: Höchstens 31 Stücke – nicht 32! Das Muster bricht genau hier.

  - kind: problem
    id: tausend
    widget: choice
    prompt: Jemand prüft eine Behauptung an 1000 Beispielen – alle passen. Ist sie damit bewiesen?
    params:
      options:
        - { label: "Nein – Beispiel 1001 könnte scheitern", correct: true }
        - { label: "Ja – 1000 sind genug", feedback: "Es gibt Behauptungen, die erst bei riesigen Zahlen scheitern." }
    hints:
      - Wie viele Zahlen gibt es insgesamt?
    explanation: Unendlich viele Fälle lassen sich nicht durchprobieren.

  - kind: problem
    id: euler
    widget: numeric
    body: "Die Formel n² + n + 41 liefert für n = 0, 1, 2, 3, … lauter Primzahlen: 41, 43, 47, 53, …"
    prompt: Was ergibt sie für n = 40?
    params: { placeholder: "Zahl" }
    answer: { value: 1681 }
    hints:
      - 1600 + 40 + 41.
    explanation: 1681 = 41 · 41 – keine Primzahl! Nach 40 Treffern scheitert die Formel.

  - kind: explain
    id: s3
    body: |
      Ein einziges **Gegenbeispiel** widerlegt eine Aussage über alle Zahlen. Ein **Beweis** dagegen braucht ein Argument, das für alle Fälle gleichzeitig gilt.

  - kind: problem
    id: primzahl
    widget: choice
    prompt: "»Jede Primzahl ist ungerade.« Welche Zahl zeigt, dass das falsch ist?"
    params:
      options:
        - { label: "2", correct: true }
        - { label: "9", feedback: "9 = 3 · 3 ist keine Primzahl." }
        - { label: "1", feedback: "1 zählt nicht als Primzahl." }
    hints:
      - Welche Primzahl ist gerade?
    explanation: 2 ist prim und gerade. Also stimmt der Satz nicht.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Die Summe zweier Primzahlen ist immer gerade.
          right: false
          why: 2 + 3 = 5.
        - text: Das Produkt zweier ungerader Zahlen ist immer ungerade.
          right: true
        - text: Jede Zahl, die durch 3 teilbar ist, ist auch durch 6 teilbar.
          right: false
          why: 9 ist durch 3, aber nicht durch 6 teilbar.
        - text: Jede Zahl, die durch 6 teilbar ist, ist auch durch 3 teilbar.
          right: true
      left: Falsch
      right: Wahr

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: »Jede Zahl, die auf 3 endet, ist eine Primzahl.« Bei 3, 13 und 23 stimmt das. Markiere alle Gegenbeispiele bis 40.
    params:
      rows: 4
      cols: 10
      numbers:
        start: 1
    answer:
      pattern:
        - ..........
        - ..........
        - ..........
        - ..#.......
    hints:
      - "Prüfe nur die Zahlen, die auf 3 enden: 3, 13, 23, 33."
      - Ist 33 durch 3 teilbar?
    explanation: 33 = 3 · 11 ist keine Primzahl. Ein einziges Gegenbeispiel genügt, und die Behauptung ist widerlegt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Formel n² + n + 41 liefert für n = 0 bis 39 lauter Primzahlen. Für welches n ist das Ergebnis sicher durch 41 teilbar – also keine Primzahl? Nenne das kleinste n über 0.
    answer:
      value: 40
    hints:
      - "Für n = 40: 40² + 40 + 41 = 40 · 41 + 41."
    explanation: 41 · 41 = 1681. Vierzig Treffer in Folge – und trotzdem falsch.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Behauptung: »Ist n eine Primzahl, dann ist auch 2ⁿ − 1 eine Primzahl.« Für n = 2, 3, 5, 7 stimmt das. Welche Primzahl n ist das kleinste Gegenbeispiel?"
    answer:
      value: 11
    hints:
      - Rechne 2ⁿ − 1 für die nächste Primzahl nach 7 aus.
      - 2¹¹ − 1 = 2047. Probiere, ob 23 teilt.
    explanation: 2047 = 23 · 89. Vier passende Beispiele, dann ein **Gegenbeispiel** – und die Behauptung ist erledigt. Primzahlen der Form 2ⁿ − 1 heißen Mersenne-Primzahlen.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: »Für alle positiven ganzen Zahlen n gilt n² ≥ 2n.« Für genau eine Zahl stimmt das nicht. Für welche?
    answer:
      value: 1
    hints:
      - "Probiere die kleinsten Zahlen: 1, 2, 3."
      - Bei n = 1 ist n² = 1 und 2n = 2.
    explanation: 1² = 1 < 2. Ab n = 2 gilt n² = n · n ≥ 2 · n. Ein Beweis muss solche Randfälle **ausdrücklich** behandeln.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Vermutung von Euler wurde 1966 nach fast 200 Jahren durch ein einziges Gegenbeispiel widerlegt – gefunden von einem Computer. Was zeigt das?
    params:
      options:
        - label: Auch lange Bewährung und große Namen ersetzen keinen Beweis
          correct: true
        - label: Euler war ein schlechter Mathematiker
          feedback: Er war einer der größten – und nannte es ausdrücklich eine Vermutung.
        - label: Computer beweisen besser als Menschen
          feedback: Der Computer fand ein Gegenbeispiel – das ist Suchen, nicht Beweisen.
    hints:
      - Wie viele Beispiele hatten vorher gepasst?
    explanation: 27⁵ + 84⁵ + 110⁵ + 133⁵ = 144⁵. Die Veröffentlichung war zwei Sätze lang.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Für einen Satz gibt es einen Beweis. Jetzt meldet ein Computer ein Gegenbeispiel. Was folgt logisch?
    params:
      options:
        - label: Beides kann nicht stimmen – der Beweis oder die Rechnung enthält einen Fehler.
          correct: true
        - label: Der Satz gilt meistens.
          feedback: Ein Für-alle-Satz mit Gegenbeispiel ist falsch – es gibt kein »meistens«.
        - label: Der Computer hat immer recht.
          feedback: Auch Programme haben Fehler. Man prüft beides.
    hints:
      - Kann ein Für-alle-Satz zugleich bewiesen und widerlegt sein?
      - "Wenn nicht: Wo muss der Fehler stecken?"
    explanation: In einem widerspruchsfreien System sind Beweis und Gegenbeispiel unvereinbar. Darum werden wichtige Beweise heute oft von Programmen **formal geprüft** – Schritt für Schritt.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum beweisen 1000 Beispiele nichts? Und warum reicht ein Fall, der nicht passt, um alles zu kippen?"
    params:
      keywords:
        - - alle
          - jede
          - unendlich
          - all
          - every
          - infinite
        - - gegenbeispiel
          - counterexample
        - - nächste
          - weitere
          - nicht geprüft
          - next
          - untested
          - unchecked
      sample: Eine Aussage über alle Zahlen betrifft unendlich viele Fälle. Beispiele prüfen nur einige, die nächste Zahl könnte scheitern. Ein einziges Gegenbeispiel zeigt aber sicher, dass nicht alle passen.
    difficulty: 3

srs:
  cards_from: [tausend, primzahl]
