id: logic.proofs.direct
type: concept
title: Der direkte Beweis
summary: Für alle Zahlen auf einmal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zahlen als Doppelreihe
    body: Ein Beweis zeigt etwas für alle Zahlen zugleich – mit einem Bild geht das oft am schnellsten. Gerade Zahlen passen in eine **Doppelreihe**. Schalte Felder ein und bau verschiedene Zahlen. Bei welchen bleibt ein Feld allein?
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 2
        cols: 8
        counter: true

  - kind: problem
    id: hook
    widget: choice
    prompt: Gerade Zahl plus gerade Zahl – ist das Ergebnis immer gerade?
    params:
      options:
        - label: Ja, immer
          correct: true
        - label: Nur manchmal
          feedback: Probier ein paar Beispiele.
        - label: Nie
          feedback: 2 + 4 = 6 ist gerade.
    hints:
      - Probier 2 + 4 oder 10 + 6.
    explanation: Beispiele passen. Aber wie zeigt man es für alle Zahlen auf einmal?

  - kind: explain
    id: s1
    body: |
      Gerade Zahlen schreibt man als $2a$, **ungerade** als $2a + 1$ – mit beliebiger ganzer Zahl a. So spricht man über **alle** Zahlen gleichzeitig.

  - kind: problem
    id: dreier
    widget: choice
    prompt: Wie schreibt man allgemein eine Zahl, die durch 3 teilbar ist?
    params:
      options:
        - { label: "3k", correct: true }
        - { label: "k + 3", feedback: "Für k = 1 wäre das 4 – nicht durch 3 teilbar." }
        - { label: "k³", feedback: "Für k = 2 wäre das 8." }
    hints:
      - Durch 3 teilbar heißt – ein Vielfaches von 3.
    explanation: Jedes Vielfache von 3 hat die Form 3k.

  - kind: problem
    id: beweis
    widget: order
    prompt: "Beweise: Zwei ungerade Zahlen ergeben zusammen eine gerade. Bring die Schritte in Reihenfolge."
    params:
      items:
        - { label: Nimm zwei ungerade Zahlen 2a + 1 und 2b + 1 }
        - { label: "Addiere: 2a + 2b + 2" }
        - { label: "Klammere aus: 2(a + b + 1)" }
        - { label: Ein Vielfaches von 2 ist gerade }
    hints:
      - Erst aufschreiben, dann rechnen, dann folgern.
    explanation: Weil a und b beliebig sind, gilt das für alle ungeraden Zahlen.

  - kind: problem
    id: mal
    widget: choice
    prompt: Eine gerade Zahl mal irgendeine ganze Zahl – was kommt heraus?
    params:
      options:
        - { label: Immer eine gerade Zahl, correct: true }
        - { label: Manchmal eine ungerade, feedback: "Probier 2a · b – lässt sich die 2 ausklammern?" }
    hints:
      - Schreib die gerade Zahl als 2a.
    explanation: 2a · b = 2(ab) – immer ein Vielfaches von 2.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Jede gerade Zahl hat die Form [[2a]], jede ungerade die Form [[2a + 1]].
      distractors:
        - 3a
        - a + 1

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: "Beweise: Das Quadrat einer ungeraden Zahl ist ungerade. Ordne die Schritte."
    params:
      items:
        - label: Sei n ungerade, also n = 2a + 1.
        - label: Dann ist n² = 4a² + 4a + 1.
        - label: Das ist 2 · (2a² + 2a) + 1.
        - label: Also hat n² die Form »gerade Zahl plus 1« – ungerade.
    hints:
      - Erst die Zahl allgemein aufschreiben, dann rechnen.
    explanation: "Ein direkter Beweis: von der Voraussetzung in sicheren Schritten zum Ziel."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: "Beweise: Die Summe von drei aufeinanderfolgenden ganzen Zahlen ist durch 3 teilbar. Ordne."
    params:
      items:
        - label: Nenne die Zahlen n, n + 1 und n + 2.
        - label: "Addiere: n + (n + 1) + (n + 2) = 3n + 3."
        - label: "Klammere aus: 3n + 3 = 3 · (n + 1)."
        - label: Also ist die Summe ein Vielfaches von 3.
    hints:
      - Beginne damit, die Zahlen allgemein zu benennen.
      - Nach dem Addieren kommt das Ausklammern.
    explanation: "Der Beweis nutzt eine **beliebige** Zahl n – also gilt er für alle. Nebenbei zeigt 3 · (n + 1): Die Summe ist dreimal die mittlere Zahl."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Warum ist n² + n für jede ganze Zahl n gerade?
    params:
      options:
        - label: n² + n = n · (n + 1), und von zwei Nachbarzahlen ist eine gerade.
          correct: true
        - label: Weil n² immer gerade ist.
          feedback: 3² = 9 ist ungerade.
        - label: Das stimmt nur für gerade n.
          feedback: Auch 3² + 3 = 12 ist gerade.
    hints:
      - Klammere n aus.
      - Was weißt du über n und n + 1?
    explanation: "Ausklammern macht die Struktur sichtbar: Ein Produkt mit einem geraden Faktor ist gerade. Solche **Umformungen** sind das Werkzeug direkter Beweise."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist das Produkt von **drei aufeinanderfolgenden** ganzen Zahlen immer durch 6 teilbar?
    params:
      options:
        - label: Unter drei aufeinanderfolgenden Zahlen ist immer eine durch 3 und mindestens eine durch 2 teilbar
          correct: true
        - label: Weil 1 · 2 · 3 = 6 ist
          feedback: Ein Beispiel ist kein Beweis für alle.
        - label: Das stimmt nicht immer
          feedback: Probier 4 · 5 · 6 = 120 oder 7 · 8 · 9 = 504.
    hints:
      - Jede dritte Zahl ist durch 3 teilbar, jede zweite durch 2.
    explanation: Ein Argument, das für **jedes** Tripel gilt – ganz ohne Rechnen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Zu beweisen: »Ist n² gerade, dann ist n gerade.« Was ist der geschickteste Weg?"
    params:
      options:
        - label: "Die Kontraposition zeigen: Ist n ungerade, dann ist n² ungerade."
          correct: true
        - label: "Die Umkehrung zeigen: Ist n gerade, dann ist n² gerade."
          feedback: Die Umkehrung ist eine andere Aussage – sie beweist die ursprüngliche nicht.
        - label: Viele gerade Quadrate prüfen.
          feedback: Beispiele beweisen kein »für alle«.
    hints:
      - »Wenn A, dann B« ist gleichwertig zu »Wenn nicht B, dann nicht A«.
      - Rechne (2k + 1)² aus.
    explanation: (2k + 1)² = 4k² + 4k + 1 = 2(2k² + 2k) + 1 ist ungerade. Die **Kontraposition** ist logisch gleichwertig – und hier viel leichter zu zeigen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein direkter Beweis eine Aussage für alle Zahlen auf einmal zeigt.
    params:
      keywords:
        - - beliebig
          - allgemein
          - buchstabe
          - variable
          - arbitrary
          - general
          - letter
        - - 2a
          - 2k
          - form
        - - umform
          - rechn
          - schritt
          - rewrite
          - compute
          - step
      sample: Man nimmt eine beliebige Zahl und schreibt sie allgemein, etwa als 2k für gerade Zahlen. Dann rechnet man Schritt für Schritt um, bis die Behauptung dasteht. Weil k beliebig war, gilt es für alle.
    difficulty: 3

srs:
  cards_from: [dreier, mal]
