id: logic.proofs.direct
type: concept
title: Der direkte Beweis
summary: Für alle Zahlen auf einmal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Gerade Zahlen schreibt man als $2a$, ungerade als $2a + 1$ – mit beliebiger ganzer Zahl a. So spricht man über **alle** Zahlen gleichzeitig.

  - kind: problem
    id: dreier
    widget: choice
    prompt: Wie schreibt man allgemein eine Zahl, die durch 3 teilbar ist?
    params:
      options:
        - { label: "3k", correct: true }
        - { label: "k + 3", feedback: "Für k = 1 wäre das 4 – nicht durch 3 teilbar." }
        - { label: "k³", feedback: "Für k = 2 wäre das 8." }
    hints:
      - Durch 3 teilbar heißt – ein Vielfaches von 3.
    explanation: Jedes Vielfache von 3 hat die Form 3k.

  - kind: problem
    id: beweis
    widget: order
    prompt: "Beweise: Zwei ungerade Zahlen ergeben zusammen eine gerade. Bring die Schritte in Reihenfolge."
    params:
      items:
        - { label: Nimm zwei ungerade Zahlen 2a + 1 und 2b + 1 }
        - { label: "Addiere: 2a + 2b + 2" }
        - { label: "Klammere aus: 2(a + b + 1)" }
        - { label: Ein Vielfaches von 2 ist gerade }
    hints:
      - Erst aufschreiben, dann rechnen, dann folgern.
    explanation: Weil a und b beliebig sind, gilt das für alle ungeraden Zahlen.

  - kind: problem
    id: mal
    widget: choice
    prompt: Eine gerade Zahl mal irgendeine ganze Zahl – was kommt heraus?
    params:
      options:
        - { label: Immer eine gerade Zahl, correct: true }
        - { label: Manchmal eine ungerade, feedback: "Probier 2a · b – lässt sich die 2 ausklammern?" }
    hints:
      - Schreib die gerade Zahl als 2a.
    explanation: 2a · b = 2(ab) – immer ein Vielfaches von 2.

srs:
  cards_from: [dreier, mal]
