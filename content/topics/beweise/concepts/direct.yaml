id: logic.proofs.direct
type: concept
title: Der direkte Beweis
summary: Für alle Zahlen auf einmal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Gerade Zahl plus gerade Zahl – ist das Ergebnis immer gerade?
    params:
      options:
        - label: Ja, immer
          correct: true
        - label: Nur manchmal
          feedback: Probier ein paar Beispiele.
        - label: Nie
          feedback: 2 + 4 = 6 ist gerade.
    hints:
      - Probier 2 + 4 oder 10 + 6.
    explanation: Beispiele passen. Aber wie zeigt man es für alle Zahlen auf einmal?


  - kind: explain
    id: s1
    body: |
      Gerade Zahlen schreibt man als $2a$, ungerade als $2a + 1$ – mit beliebiger ganzer Zahl a. So spricht man über **alle** Zahlen gleichzeitig.

  - kind: problem
    id: dreier
    widget: choice
    prompt: Wie schreibt man allgemein eine Zahl, die durch 3 teilbar ist?
    params:
      options:
        - { label: "3k", correct: true }
        - { label: "k + 3", feedback: "Für k = 1 wäre das 4 – nicht durch 3 teilbar." }
        - { label: "k³", feedback: "Für k = 2 wäre das 8." }
    hints:
      - Durch 3 teilbar heißt – ein Vielfaches von 3.
    explanation: Jedes Vielfache von 3 hat die Form 3k.

  - kind: problem
    id: beweis
    widget: order
    prompt: "Beweise: Zwei ungerade Zahlen ergeben zusammen eine gerade. Bring die Schritte in Reihenfolge."
    params:
      items:
        - { label: Nimm zwei ungerade Zahlen 2a + 1 und 2b + 1 }
        - { label: "Addiere: 2a + 2b + 2" }
        - { label: "Klammere aus: 2(a + b + 1)" }
        - { label: Ein Vielfaches von 2 ist gerade }
    hints:
      - Erst aufschreiben, dann rechnen, dann folgern.
    explanation: Weil a und b beliebig sind, gilt das für alle ungeraden Zahlen.

  - kind: problem
    id: mal
    widget: choice
    prompt: Eine gerade Zahl mal irgendeine ganze Zahl – was kommt heraus?
    params:
      options:
        - { label: Immer eine gerade Zahl, correct: true }
        - { label: Manchmal eine ungerade, feedback: "Probier 2a · b – lässt sich die 2 ausklammern?" }
    hints:
      - Schreib die gerade Zahl als 2a.
    explanation: 2a · b = 2(ab) – immer ein Vielfaches von 2.

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: "Beweise: Das Quadrat einer ungeraden Zahl ist ungerade. Ordne die Schritte."
    params:
      items:
        - label: Sei n ungerade, also n = 2a + 1.
        - label: Dann ist n² = 4a² + 4a + 1.
        - label: Das ist 2 · (2a² + 2a) + 1.
        - label: Also hat n² die Form »gerade Zahl plus 1« – ungerade.
    hints:
      - Erst die Zahl allgemein aufschreiben, dann rechnen.
    explanation: "Ein direkter Beweis: von der Voraussetzung in sicheren Schritten zum Ziel."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist das Produkt von **drei aufeinanderfolgenden** ganzen Zahlen immer durch 6 teilbar?
    params:
      options:
        - label: Unter drei aufeinanderfolgenden Zahlen ist immer eine durch 3 und mindestens eine durch 2 teilbar
          correct: true
        - label: Weil 1 · 2 · 3 = 6 ist
          feedback: Ein Beispiel ist kein Beweis für alle.
        - label: Das stimmt nicht immer
          feedback: Probier 4 · 5 · 6 = 120 oder 7 · 8 · 9 = 504.
    hints:
      - Jede dritte Zahl ist durch 3 teilbar, jede zweite durch 2.
    explanation: Ein Argument, das für **jedes** Tripel gilt – ganz ohne Rechnen.
    difficulty: 3

srs:
  cards_from: [dreier, mal]
