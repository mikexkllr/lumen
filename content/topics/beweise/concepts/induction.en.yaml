id: logic.proofs.induction
type: concept
title: The domino proof
summary: Mathematical induction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The domino chain
    body: How do you prove something for infinitely many numbers without checking them all? With an idea from the playroom. Uncover the cards in order and watch the **dominoes** fall.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 👉
            front: The first domino
            back: You push it – it falls. That is the start.
          - icon: ➡️
            front: Each one hits the next
            back: The dominoes stand so that each falling one knocks over its neighbour.
          - icon: 🔁
            front: Domino 2, 3, 4 …
            back: So the second falls, then because of it the third, then the fourth …
          - icon: ♾️
            front: They all fall
            back: Even domino number one million – without you ever touching it.

  - kind: problem
    id: ungerade
    widget: numeric
    prompt: Add the first {{n}} odd numbers 1 + 3 + 5 + …
    params: { placeholder: "Sum" }
    answer: { value: "{{n * n}}" }
    hints:
      - "1 = 1, 1 + 3 = 4, 1 + 3 + 5 = 9 … do you notice anything?"
    explanation: "That gives {{n * n}} = {{n}}², always a square number."
    variants:
      params: { n: "int[4,12]" }
      defaults: { n: 6 }

  - kind: explain
    id: s2
    body: |
      **Induction** works like dominoes. If the first one falls, and every falling domino knocks over the next, then all of them fall.

  - kind: problem
    id: schritte
    widget: order
    prompt: Put the steps of an induction proof in order.
    params:
      items:
        - { label: "Check the start: it holds for n = 1" }
        - { label: "Assume it holds for some n" }
        - { label: "Show that it then holds for n + 1 too" }
        - { label: So it holds for all n }
    hints:
      - First the first domino, then the mechanism.
    explanation: Start plus step together cover infinitely many cases.

  - kind: problem
    id: ohne-start
    widget: choice
    prompt: Someone shows only that n always implies n + 1, but not the start. Is that enough?
    params:
      options:
        - { label: "No – without the first domino, none fall", correct: true }
        - { label: Yes, feedback: "“If it holds for 5, it holds for 6” says nothing as long as it holds for no number." }
    hints:
      - What happens to a row of dominoes that nobody pushes?
    explanation: You need both parts, the start and the step.

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: "Prove by induction: 1 + 2 + … + n = n(n + 1)/2. Order the steps."
    params:
      items:
        - label: "Base: for n = 1 it holds, since 1 = 1 · 2 / 2."
        - label: "Assumption: the formula holds for some n."
        - label: "Add n + 1: n(n + 1)/2 + (n + 1)."
        - label: That gives (n + 1)(n + 2)/2 – the formula for n + 1.
    hints:
      - First the first domino, then the step from n to n + 1.
    explanation: Base and step together cover all natural numbers.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: For n = 1, 2ⁿ > n² holds. But not for n = 2, 3 and 4. From which n on does the inequality hold **forever**?
    answer:
      value: 5
    hints:
      - Compute 2⁵ and 5².
      - From there 2ⁿ doubles every step while n² grows more slowly.
    explanation: 32 > 25, and for n ≥ 5 the induction step gives 2ⁿ⁺¹ = 2 · 2ⁿ > 2n² ≥ (n + 1)². The base case may start at 5 – as long as it is true.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "“Proof” that all horses have the same colour: clear for 1 horse. If any n horses share a colour, so do any n + 1 – take two overlapping groups of n. Where is the error?"
    params:
      options:
        - label: "At the step from 1 to 2: the two groups do not overlap there at all"
          correct: true
        - label: The base for 1 horse is wrong
          feedback: A single horse has only one colour.
        - label: Induction does not work for animals
          feedback: The error is purely logical.
    hints:
      - Two groups of one horse each – do they share a horse?
    explanation: The step must hold for **every** n. A single broken domino stops the whole chain.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Is induction a real proof – or just a check of very many examples?
    params:
      options:
        - label: "A real proof: every number can be reached from the start in finitely many steps."
          correct: true
        - label: Just many examples.
          feedback: The step "n implies n + 1" is proven in general, not tested.
        - label: A proof only up to a fixed limit.
          feedback: There is no limit – the step holds for every n.
    hints:
      - How many steps does it take from the start to any number n?
      - If there were a smallest number where it fails – what about its predecessor?
    explanation: If there were a counterexample, there would be a smallest one. Its predecessor satisfies the statement – and the step carries it over. Contradiction. This well-ordering of the natural numbers is what powers induction.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why a proof by induction needs both a base case **and** a step.
    params:
      keywords:
        - - anfang
          - start
          - erste
          - base
          - first
        - - schritt
          - nächste
          - n + 1
          - n+1
          - step
          - next
        - - domino
          - alle
          - fallen
          - all
          - fall
      sample: The base case shows the first domino falls. The step shows each domino knocks over the next. Without either one, not all dominoes fall.
    difficulty: 3

srs:
  cards_from: [schritte, ohne-start]
