id: sci.energy.solar
type: concept
title: Strom vom Dach
summary: Was eine Solaranlage liefert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent des Sonnenlichts macht eine übliche Solarzelle zu Strom?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 21
      tolerance: 6
    explanation: Rund ein Fünftel. Der Rest wird vor allem Wärme.

  - kind: explain
    id: s1
    body: |
      Solaranlagen werden in **kWp** angegeben – Kilowatt Spitzenleistung. Faustregel für Deutschland: 1 kWp liefert etwa **1000 kWh** pro Jahr.

  - kind: problem
    id: ertrag
    widget: numeric
    prompt: Wie viele kWh liefert eine Anlage mit {{p}} kWp etwa im Jahr?
    params: { unit: kWh }
    answer: { value: "{{p * 1000}}" }
    hints:
      - 1000 kWh pro kWp.
    explanation: "{{p}} · 1000 = {{p * 1000}} kWh."
    variants:
      params: { p: "int[3,12]" }
      defaults: { p: 6 }

  - kind: problem
    id: bedarf
    widget: numeric
    prompt: Ein Haushalt braucht {{v}} kWh im Jahr. Wie viel kWp braucht er rechnerisch?
    params: { unit: kWp }
    answer: { value: "{{v / 1000}}" }
    hints:
      - Teile durch 1000.
    explanation: "{{v}} : 1000 = {{v / 1000}} kWp."
    variants:
      params: { v: "choice[2500,3500,4000,4500]" }
      defaults: { v: 3500 }

  - kind: problem
    id: speicher
    widget: choice
    prompt: Warum deckt so eine Anlage den Bedarf trotzdem nicht ganz?
    params:
      options:
        - { label: "Strom wird oft gebraucht, wenn keine Sonne scheint.", correct: true }
        - { label: Die Faustregel ist falsch., feedback: "Die Menge übers Jahr passt – das Problem ist der Zeitpunkt." }
    hints:
      - Wann kochst du, wann scheint die Sonne?
    explanation: Abends und im Winter fehlt Sonne. Speicher und Netz gleichen das aus.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Sonne liefert mittags etwa 1000 W pro m². Ein Modul wandelt 20 % um. Wie viel Watt liefern 10 m²?
    params:
      unit: W
    answer:
      value: 2000
    hints:
      - 1000 · 10 · 0,2.
    explanation: 2000 W – genug für einen Föhn.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele kWh Sonnenenergie treffen in Deutschland pro Jahr auf einen Quadratmeter?"
    params:
      min: 10
      max: 10000
      scale: log
    answer:
      value: 1050
      within: 30
    explanation: Rund 1000 bis 1100 kWh pro m² und Jahr. In der Sahara ist es etwa doppelt so viel.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Ein Modul wandelt 20 % des Lichts in Strom. Wie viele m² Modulfläche ergeben 1 kWp – also 1000 W bei 1000 W Sonne pro m²?
    params:
      unit: m²
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 0.2
        misconception: inverse
        text: "Umgekehrt: Jeder m² liefert 200 W. Wie viele m² für 1000 W?"
    hints:
      - Ein m² liefert 20 % von 1000 W.
      - "1000 W : 200 W pro m² = ?"
    explanation: "1000 : 200 = 5 m². Mit 1000 kWh Sonne pro m² und Jahr passt das zur Faustregel: 1 kWp liefert rund 1000 kWh."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Eine Anlage mit 8 kWp kostet 12 000 € und liefert 8000 kWh im Jahr, die sonst 30 Cent kosten würden. Nach wie vielen Jahren hat sie sich bezahlt gemacht?
    params:
      unit: Jahre
    answer:
      value: 5
    hints:
      - "Ersparnis pro Jahr: 8000 · 0,30 €."
    explanation: 2400 € pro Jahr, also 5 Jahre – wenn man allen Strom selbst nutzt. In der Praxis dauert es länger.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Watt und Kilowattstunde.
    params:
      keywords:
        - - leistung
          - power
          - schnell
          - rate
          - fast
        - - energie
          - energy
          - menge
          - amount
        - - zeit
          - stunde
          - time
          - hour
      sample: "Watt ist die Leistung – wie schnell Energie fließt. Die Kilowattstunde ist eine Energiemenge: Leistung mal Zeit, zum Beispiel 1000 Watt eine Stunde lang."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: estimate
    prompt: "Fermi-Frage: Deutschland braucht etwa 500 TWh Strom im Jahr. Welcher Anteil der Landesfläche (357 000 km²) müsste dafür mit Solarmodulen belegt sein – in Prozent? Rechne mit 200 kWh pro m² Modul."
    params:
      min: 0.01
      max: 100
      scale: log
    answer:
      value: 0.7
      within: 50
    explanation: "500 · 10⁹ kWh : 200 kWh/m² = 2,5 · 10⁹ m² = 2500 km². Das sind etwa 0,7 % der Fläche. Das Problem ist weniger der Platz als die Speicherung für Nacht und Winter."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: An einem kalten, klaren Wintertag liefert ein Modul pro Lichtmenge mehr Strom als an einem heißen Sommertag. Warum?
    params:
      options:
        - label: Solarzellen arbeiten kalt besser – ihre Spannung sinkt, wenn sie heiß werden.
          correct: true
        - label: Winterlicht ist energiereicher.
          feedback: Das Spektrum ist ähnlich. Es liegt an der Zelle selbst.
        - label: Schnee lädt die Zellen auf.
          feedback: Schnee kann Licht zurückwerfen, lädt aber nichts auf.
    hints:
      - Was passiert mit vielen Elektronikteilen, wenn sie heiß werden?
      - Pro Grad Erwärmung verliert eine Zelle etwa 0,4 % Leistung.
    explanation: In der Hitze steigen die Verluste im Halbleiter, die Spannung sinkt. Ein 60 °C heißes Modul liefert gut 10 % weniger als ein kühles.
    difficulty: 3

srs:
  cards_from: [ertrag, speicher]
