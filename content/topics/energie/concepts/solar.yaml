id: sci.energy.solar
type: concept
title: Strom vom Dach
summary: Was eine Solaranlage liefert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent des Sonnenlichts macht eine übliche Solarzelle zu Strom?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 21
      tolerance: 6
    explanation: Rund ein Fünftel. Der Rest wird vor allem Wärme.

  - kind: explain
    id: s1
    body: |
      Solaranlagen werden in **kWp** angegeben – Kilowatt Spitzenleistung. Faustregel für Deutschland: 1 kWp liefert etwa **1000 kWh** pro Jahr.

  - kind: problem
    id: ertrag
    widget: numeric
    prompt: Wie viele kWh liefert eine Anlage mit {{p}} kWp etwa im Jahr?
    params: { unit: kWh }
    answer: { value: "{{p * 1000}}" }
    hints:
      - 1000 kWh pro kWp.
    explanation: "{{p}} · 1000 = {{p * 1000}} kWh."
    variants:
      params: { p: "int[3,12]" }
      defaults: { p: 6 }

  - kind: problem
    id: bedarf
    widget: numeric
    prompt: Ein Haushalt braucht {{v}} kWh im Jahr. Wie viel kWp braucht er rechnerisch?
    params: { unit: kWp }
    answer: { value: "{{v / 1000}}" }
    hints:
      - Teile durch 1000.
    explanation: "{{v}} : 1000 = {{v / 1000}} kWp."
    variants:
      params: { v: "choice[2500,3500,4000,4500]" }
      defaults: { v: 3500 }

  - kind: problem
    id: speicher
    widget: choice
    prompt: Warum deckt so eine Anlage den Bedarf trotzdem nicht ganz?
    params:
      options:
        - { label: "Strom wird oft gebraucht, wenn keine Sonne scheint.", correct: true }
        - { label: Die Faustregel ist falsch., feedback: "Die Menge übers Jahr passt – das Problem ist der Zeitpunkt." }
    hints:
      - Wann kochst du, wann scheint die Sonne?
    explanation: Abends und im Winter fehlt Sonne. Speicher und Netz gleichen das aus.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Sonne liefert mittags etwa 1000 W pro m². Ein Modul wandelt 20 % um. Wie viel Watt liefern 10 m²?
    params:
      unit: W
    answer:
      value: 2000
    hints:
      - 1000 · 10 · 0,2.
    explanation: 2000 W – genug für einen Föhn.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Eine Anlage mit 8 kWp kostet 12 000 € und liefert 8000 kWh im Jahr, die sonst 30 Cent kosten würden. Nach wie vielen Jahren hat sie sich bezahlt gemacht?
    params:
      unit: Jahre
    answer:
      value: 5
    hints:
      - "Ersparnis pro Jahr: 8000 · 0,30 €."
    explanation: 2400 € pro Jahr, also 5 Jahre – wenn man allen Strom selbst nutzt. In der Praxis dauert es länger.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Watt und Kilowattstunde.
    params:
      keywords:
        - - leistung
          - power
          - schnell
          - rate
          - fast
        - - energie
          - energy
          - menge
          - amount
        - - zeit
          - stunde
          - time
          - hour
      sample: "Watt ist die Leistung – wie schnell Energie fließt. Die Kilowattstunde ist eine Energiemenge: Leistung mal Zeit, zum Beispiel 1000 Watt eine Stunde lang."
    difficulty: 3

srs:
  cards_from: [ertrag, speicher]
