id: sci.energy.solar
type: concept
title: Power from the roof
summary: What a solar system delivers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percentage of sunlight does a common solar cell turn into electricity?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 21
      tolerance: 6
    explanation: About a fifth. The rest mostly becomes heat.

  - kind: explain
    id: s1
    body: |
      Solar systems are rated in **kWp**, kilowatts of peak power. Rule of thumb for Germany: 1 kWp delivers about **1000 kWh** per year.

  - kind: problem
    id: ertrag
    widget: numeric
    prompt: About how many kWh per year does a {{p}} kWp system deliver?
    params: { unit: kWh }
    answer: { value: "{{p * 1000}}" }
    hints:
      - 1000 kWh per kWp.
    explanation: "{{p}} · 1000 = {{p * 1000}} kWh."
    variants:
      params: { p: "int[3,12]" }
      defaults: { p: 6 }

  - kind: problem
    id: bedarf
    widget: numeric
    prompt: A household uses {{v}} kWh per year. How many kWp does it need on paper?
    params: { unit: kWp }
    answer: { value: "{{v / 1000}}" }
    hints:
      - Divide by 1000.
    explanation: "{{v}} ÷ 1000 = {{v / 1000}} kWp."
    variants:
      params: { v: "choice[2500,3500,4000,4500]" }
      defaults: { v: 3500 }

  - kind: problem
    id: speicher
    widget: choice
    prompt: Why does such a system still not cover the full demand?
    params:
      options:
        - { label: "Power is often needed when the sun isn't shining.", correct: true }
        - { label: The rule of thumb is wrong., feedback: "The yearly amount fits. The problem is the timing." }
    hints:
      - When do you cook, and when does the sun shine?
    explanation: The sun is missing in the evening and in winter. Storage and the grid make up the difference.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: At noon the Sun delivers about 1000 W per m². A panel converts 20%. How many watts do 10 m² deliver?
    params:
      unit: W
    answer:
      value: 2000
    hints:
      - 1000 · 10 · 0.2.
    explanation: 2000 W – enough for a hair dryer.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many kWh of solar energy hit one square metre in Germany per year?"
    params:
      min: 10
      max: 10000
      scale: log
    answer:
      value: 1050
      within: 30
    explanation: About 1000 to 1100 kWh per m² per year. In the Sahara it is roughly twice as much.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: A module converts 20 % of light into electricity. How many m² of modules make 1 kWp – that is, 1000 W under 1000 W of sunlight per m²?
    params:
      unit: m²
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 0.2
        misconception: inverse
        text: "The other way round: each m² gives 200 W. How many m² for 1000 W?"
    hints:
      - One m² yields 20 % of 1000 W.
      - 1000 W ÷ 200 W per m² = ?
    explanation: "1000 ÷ 200 = 5 m². With 1000 kWh of sunlight per m² per year this fits the rule of thumb: 1 kWp yields about 1000 kWh."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An 8 kWp system costs €12,000 and delivers 8000 kWh a year that would otherwise cost 30 cents each. After how many years has it paid for itself?
    params:
      unit: years
    answer:
      value: 5
    hints:
      - "Savings per year: 8000 · €0.30."
    explanation: €2400 a year, so 5 years – if you use all the power yourself. In practice it takes longer.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between a watt and a kilowatt-hour.
    params:
      keywords:
        - - leistung
          - power
          - schnell
          - rate
          - fast
        - - energie
          - energy
          - menge
          - amount
        - - zeit
          - stunde
          - time
          - hour
      sample: "A watt is power – how fast energy flows. A kilowatt-hour is an amount of energy: power times time, for example 1000 watts for one hour."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: estimate
    prompt: "Fermi question: Germany uses about 500 TWh of electricity a year. What share of its land (357,000 km²) would need solar modules for that – in percent? Use 200 kWh per m² of module."
    params:
      min: 0.01
      max: 100
      scale: log
    answer:
      value: 0.7
      within: 50
    explanation: 500 · 10⁹ kWh ÷ 200 kWh/m² = 2.5 · 10⁹ m² = 2500 km². That is about 0.7 % of the land. The real problem is less space than storage for night and winter.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: On a cold, clear winter day a module delivers more electricity per amount of light than on a hot summer day. Why?
    params:
      options:
        - label: Solar cells work better cold – their voltage drops when they get hot.
          correct: true
        - label: Winter light is more energetic.
          feedback: The spectrum is similar. It is the cell itself.
        - label: Snow charges the cells.
          feedback: Snow can reflect light, but it charges nothing.
    hints:
      - What happens to many electronic parts when they get hot?
      - Per degree of warming a cell loses about 0.4 % of its power.
    explanation: In the heat losses in the semiconductor rise and the voltage drops. A module at 60 °C delivers over 10 % less than a cool one.
    difficulty: 3

srs:
  cards_from: [ertrag, speicher]
