id: sci.energy.efficiency
type: concept
title: Efficiency
summary: How much really arrives?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: gluehbirne
    widget: choice
    prompt: A 60 W incandescent bulb is as bright as an 8 W LED. Where does the rest of the energy go?
    params:
      options:
        - { label: Into heat, correct: true }
        - { label: "Into light you can't see", feedback: "A small part is infrared, but that is heat." }
        - { label: It is lost, feedback: "Energy is never lost. It only changes form." }
    hints:
      - Better not touch an old incandescent bulb.
    explanation: Most of the energy becomes heat. Only a small part becomes light.

  - kind: explain
    id: s2
    body: |
      **Efficiency** = useful energy ÷ energy input.
      An incandescent bulb turns only about 5% into light. An LED turns about 40%.

  - kind: problem
    id: motor
    widget: numeric
    prompt: A motor takes in {{e}} joules and delivers {{n}} joules of motion. What is its efficiency?
    params: { unit: "%" }
    answer: { value: "{{100 * n / e}}" }
    hints:
      - "{{n}} divided by {{e}}, times 100."
    explanation: "{{n}} ÷ {{e}} = {{n / e}}, so {{100 * n / e}}%."
    variants:
      params: { e: "choice[1000,2000,500]", p: "choice[25,40,80,90]" }
      derive: { n: "e * p / 100" }
      defaults: { e: 1000, p: 80 }

  - kind: problem
    id: sparen
    widget: numeric
    prompt: What percent of electricity does an 8 W LED save compared with a 60 W incandescent bulb? Round to whole percent.
    params: { unit: "%" }
    answer: { value: 87, tolerance: 1 }
    feedback:
      - when: "numval(state.input) == 52"
        misconception: watts-as-percent
        text: 52 W is the saving in watts. Divide it by 60.
    hints:
      - The saving is 52 W out of 60 W.
    explanation: "52 ÷ 60 ≈ 0.87, so about 87% less."

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: High or low efficiency?
    params:
      buckets: [{ label: high – over 80% }, { label: low – under 40% }]
      items:
        - { label: Electric motor, bucket: high – over 80% }
        - { label: Transformer, bucket: high – over 80% }
        - { label: Charging and discharging a battery, bucket: high – over 80% }
        - { label: Incandescent bulb, bucket: low – under 40% }
        - { label: Gasoline engine, bucket: low – under 40% }
        - { label: Cooking over an open fire, bucket: low – under 40% }
    hints:
      - Where is a lot of waste heat produced?
    explanation: Electrical machines are very efficient. Combustion loses a lot as heat.

  - kind: explain
    id: s6
    body: Can efficiency be above 100%?
    reveal:
      body: No. Energy does not come from nothing. A heat pump does deliver more heat than the electricity it uses. But it takes the rest from the surroundings.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: In every conversion part of the energy is lost as heat.
          right: true
        - text: An efficiency of 120% is possible with good technology.
          right: false
          why: That would be a perpetual motion machine – energy from nothing.
        - text: An electric motor is more efficient than a petrol engine.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A power plant is 40% efficient, the grid 95%, the motor 90%. What percent of the fuel energy arrives as motion?
    params:
      unit: "%"
    answer:
      value: 34.2
      tolerance: 0.3
    hints:
      - "Efficiencies multiply: 0.4 · 0.95 · 0.9."
    explanation: 34.2%. In a chain the weakest link matters a lot.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: An electric motor has 90 % efficiency. It must deliver 45 kW to the wheels. How many kW does it draw from the battery?
    params:
      unit: kW
    answer:
      value: 50
    feedback:
      - when: abs(numval(state.input) - 40.5) < 0.1
        misconception: efficiency-direction
        text: The motor needs **more** than it delivers. Divide by 0.9 instead of multiplying.
    hints:
      - Output = efficiency · input.
      - Input = 45 kW ÷ 0.9.
    explanation: 45 ÷ 0.9 = 50 kW. The 5 kW difference turns into heat in the motor and electronics.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: An electric fan heater turns almost 100 % of its electricity into heat. Does that make it the best heater?
    params:
      options:
        - label: No – a heat pump turns 1 kWh of electricity into 3 to 4 kWh of heat.
          correct: true
        - label: Yes, more than 100 % is impossible.
          feedback: The heat pump does not create the heat; it fetches it from outside.
        - label: Yes, it is also the cheapest.
          feedback: Heating directly with electricity is usually the most expensive.
    hints:
      - Does the heat have to come from the electricity itself?
      - A fridge pumps heat from inside to outside.
    explanation: "The fan heater converts electricity 1 : 1 into heat. The heat pump uses electricity to pump in heat from outside – it delivers several times as much."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A heat pump delivers 4 kWh of heat from 1 kWh of electricity. Does that violate conservation of energy?
    params:
      options:
        - label: No – it takes 3 kWh from the surroundings; the electricity only transports
          correct: true
        - label: Yes – so it does not really work
          feedback: It works, in millions of homes and in every fridge.
        - label: No – it creates the energy itself
          feedback: Energy cannot be created, only moved and converted.
    hints:
      - Where might the extra heat come from?
    explanation: It **pumps** heat from cold to warm. A fridge does the same – just used the other way round.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A coal power plant (40 %) sends electricity through a line (95 %) to a heat pump. It turns every kWh of electricity into 3 kWh of heat. What percentage of the coal energy arrives as heat?
    params:
      unit: "%"
    answer:
      value: 114
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 38) < 1
        misconception: forgot-cop
        text: That would be a fan heater. The heat pump triples the electricity on top.
    hints:
      - "Multiply all factors: 0.40 · 0.95 · …"
      - The coefficient of performance 3 is a factor too.
    explanation: 0.40 · 0.95 · 3 = 1.14. Even with coal power more heat arrives than burning the coal in a stove could give. With green power the advantage is even larger.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: teach
    prompt: "Explain to Lux: why can no efficiency exceed 100 % – and why is the heat pump still no miracle?"
    params:
      keywords:
        - - energie
          - energy
          - erhalt
          - conserv
          - nichts
          - nothing
        - - umgebung
          - environment
          - surround
          - außen
          - outside
          - luft
          - air
          - erde
          - ground
        - - pump
          - holt
          - fetch
          - transport
          - bewegt
          - moves
      sample: Energy does not come from nothing, so you never get out more than you put in. The heat pump does not create heat. It pumps heat from the surroundings into the house and only needs a little electricity for that.
    difficulty: 3

srs:
  cards_from: [motor, sparen]
