id: sci.energy.heating
type: concept
title: Heat costs money
summary: Water, heating and that one degree.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: wasser
    widget: numeric
    body: Warming 1 liter of water by 1 °C takes about 4.2 kJ.
    prompt: How much energy do you need to heat {{l}} liters from 20 to 100 °C?
    params: { unit: kJ }
    answer: { value: "{{l * 336}}" }
    hints:
      - "That is 80 degrees. Calculate {{l}} · 80 · 4.2."
    explanation: "{{l}} · 80 · 4.2 = {{l * 336}} kJ."
    variants:
      params: { l: "int[1,3]" }
      defaults: { l: 1 }

  - kind: problem
    id: deckel
    widget: choice
    prompt: What saves the most energy when you boil pasta water?
    params:
      options:
        - { label: Putting a lid on the pot, correct: true }
        - { label: Using more water, feedback: "More water needs more energy." }
        - { label: Adding salt right away, feedback: "That changes almost nothing." }
    hints:
      - Where does the heat escape?
    explanation: Without a lid, a lot of heat escapes with the steam.

  - kind: explain
    id: s3
    body: |
      **Heating** is usually the biggest energy cost in a home. Rule of thumb: **each degree lower** room temperature saves about 6% of heating energy.

  - kind: problem
    id: grad
    widget: numeric
    prompt: Your heating costs {{k}} € a year. How much do you save with 1 °C less?
    params: { unit: "€" }
    answer: { value: "{{k * 6 / 100}}" }
    hints:
      - "6% of {{k}} €."
    explanation: "{{k}} · 0.06 = {{k * 6 / 100}} € per year."
    variants:
      params: { k: "choice[600,900,1200,1500]" }
      defaults: { k: 1200 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Water needs 4.2 kJ to heat 1 litre by 1 °C. How many kJ does a full bath of 150 litres from 10 to 40 °C need?
    params:
      unit: kJ
    answer:
      value: 18900
    hints:
      - 150 · 30 · 4.2.
    explanation: 18,900 kJ, which is 5.25 kWh – as much as 50 hours of TV.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does water store so much heat?
    params:
      options:
        - label: Its molecules are held by hydrogen bonds that absorb much energy
          correct: true
        - label: Because it is liquid
          feedback: Oil is liquid too and stores only half as much.
        - label: Because it is transparent
          feedback: The colour has nothing to do with it.
    hints:
      - Water has one of the highest **heat capacities** of all.
    explanation: That is why oceans moderate the climate and heating systems use water.
    difficulty: 3

srs:
  cards_from: [wasser, grad]
