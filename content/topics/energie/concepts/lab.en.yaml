id: sci.energy.lab
type: concept
title: Energy lab
summary: Set usage and compare.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: tag
    widget: chart
    body: LED lamp 10 W for 5 hours, laptop 50 W for 4 hours, hair dryer 2000 W for a quarter of an hour.
    prompt: Set each device's daily usage in watt-hours.
    params:
      labels: [LED, Laptop, Hair dryer]
      values: [0, 0, 0]
      editable: [0, 1, 2]
      min: 0
      max: 600
      step: 50
      unit: Wh
    answer: { values: [50, 200, 500] }
    hints:
      - Power times time.
    explanation: 50, 200 and 500 Wh. The short hair dryer run uses the most.

  - kind: problem
    id: leistung
    widget: slider
    prompt: A device uses 6 kWh in 3 hours. Set its power.
    params:
      expr: "p*x"
      x: [0, 5]
      y: [0, 12]
      showCoordinates: false
      sliders: [{ id: p, label: "Power (kW)", min: 0.5, max: 4, step: 0.5, initial: 1 }]
      markers:
        - { x: 3, y: 6, group: a }
    check: { predicate: "p == 2" }
    hints:
      - Energy divided by time.
    explanation: "6 kWh : 3 h = 2 kW."

  - kind: problem
    id: jahr
    widget: order
    prompt: Order by yearly electricity use, smallest first.
    params:
      items:
        - { label: LED lamp }
        - { label: Laptop }
        - { label: Refrigerator }
        - { label: Electric car }
    hints:
      - The refrigerator runs around the clock.
    explanation: About 15, 60, 150 and 2500 kWh. The electric car is far ahead.

srs:
  cards_from: [tag, leistung]
