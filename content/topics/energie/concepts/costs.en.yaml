id: sci.energy.costs
type: concept
title: What does electricity cost?
summary: Small devices that never switch off.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The hidden power eater
    body: Many devices draw power even when they are off. Drag the slider for the watts on **standby**. The line shows what that costs over ten years – at 30 cents per kWh.
    visual:
      widget: slider
      interactive: true
      params:
        expr: w*8.76*0.3*x
        x:
          - 0
          - 10
        y:
          - 0
          - 300
        sliders:
          - id: w
            label: Standby (W)
            min: 1
            max: 10
            step: 1
            initial: 2

  - kind: problem
    id: wasserkocher
    widget: numeric
    prompt: One kWh costs 30 cents. A kettle uses 0.1 kWh per fill. What does one fill cost?
    params: { unit: cents }
    answer: { value: 3 }
    hints:
      - 0.1 · 30 cents.
    explanation: 0.1 kWh · 30 ct = 3 cents.

  - kind: explain
    id: s2
    body: |
      **Cost = kWh · price per kWh.**
      Anything that runs **around the clock** adds up. A year has 24 · 365 = 8760 hours.

  - kind: problem
    id: router
    widget: numeric
    prompt: A router draws 10 W all the time. How many kWh is that per year?
    params: { unit: kWh }
    answer: { value: 87.6, tolerance: 0.5 }
    feedback:
      - when: "abs(numval(state.input) - 87600) < 10"
        misconception: wh-not-kwh
        text: That is watt-hours. Divide by 1000.
    hints:
      - 10 W · 8760 h, then divide by 1000.
    explanation: 10 · 8760 = 87,600 Wh = 87.6 kWh.

  - kind: problem
    id: standby
    widget: numeric
    prompt: A device draws {{w}} W on standby all year. What does that cost at 30 cents per kWh? Give euros, rounded.
    params: { unit: "€" }
    answer: { value: "{{round(w * 8.76 * 0.3)}}", tolerance: 1 }
    hints:
      - "{{w}} W · 8760 h = {{w * 8.76}} kWh."
    explanation: "{{w * 8.76}} kWh · 0.30 € ≈ {{round(w * 8.76 * 0.3)}} €."
    variants:
      params: { w: "choice[5,10,15,20,30]" }
      defaults: { w: 10 }

  - kind: explain
    id: s5
    body: What uses the most electricity in a typical home?
    reveal:
      body: Anything that heats or cools, such as hot water, the dryer, the stove and the fridge. Small devices only stand out if they run all the time.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An electric car needs 18 kWh per 100 km. What does that cost at 30 cents per kWh? In euros.
    params:
      unit: €
    answer:
      value: 5.4
    hints:
      - 18 · €0.30.
    explanation: €5.40. A petrol car using 7 litres pays €12.60 at €1.80 a litre.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: what does a full phone charge (15 Wh) cost at 30 cents per kWh – in cents?"
    params:
      min: 0.01
      max: 100
      scale: log
    answer:
      value: 0.45
      within: 50
    explanation: 15 Wh is 0.015 kWh. Times 30 cents gives 0.45 cents. A whole year of daily charging costs less than 2 euros.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: A {{w}} W device runs {{h}} hours a day, all year. What does that cost at 30 cents per kWh – in euros?
    params:
      unit: €
    answer:
      value: "{{w * h * 365 * 0.3 / 1000}}"
      tolerance: 0.6
    feedback:
      - when: abs(numval(state.input) - w * h * 365 * 0.3) < 1
        misconception: wh-vs-kwh
        text: You calculated in watt-hours. Divide by 1000 to get kWh.
    hints:
      - "Watt-hours per day: {{w}} · {{h}}. Then times 365."
      - Divide by 1000 for kWh, then multiply by €0.30.
    explanation: "{{w}} · {{h}} · 365 ÷ 1000 = {{w * h * 365 / 1000}} kWh. Times €0.30 gives €{{w * h * 365 * 0.3 / 1000}}."
    difficulty: 2
    variants:
      params:
        w: choice[10,50,100,2000]
        h: choice[1,2,4]
      defaults:
        w: 100
        h: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An LED (8 W) replaces a bulb (60 W) and is on 3 hours a day. How many euros does that save per year at 30 cents per kWh? Rounded.
    params:
      unit: €
    answer:
      value: 17
      tolerance: 1
    hints:
      - 52 W less · 3 h · 365 days.
    explanation: ≈ 57 kWh, times €0.30 is about €17.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A household uses 2500 kWh a year. What average continuous power is that – in watts?
    params:
      unit: W
    answer:
      value: 285
      tolerance: 3
    hints:
      - A year has 8760 hours.
      - 2,500,000 Wh ÷ 8760 h = ?
    explanation: 2,500,000 Wh ÷ 8760 h ≈ 285 W. On average a few old light bulbs are always burning. Peaks while cooking are much higher.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Tariff B costs €60 more in standing charges per year, but every kWh is 5 cents cheaper. From how many kWh a year does tariff B pay off?
    params:
      unit: kWh
    answer:
      value: 1200
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 12) < 0.1
        misconception: cent-euro
        text: "Watch the units: 5 cents is €0.05."
    hints:
      - How many kWh does it take to recover €60 at 5 cents saved each?
      - €60 ÷ €0.05 per kWh = ?
    explanation: 60 ÷ 0.05 = 1200 kWh. Anyone using more saves with tariff B. Every standing-charge comparison works like this.
    difficulty: 3

srs:
  cards_from: [router, standby]
