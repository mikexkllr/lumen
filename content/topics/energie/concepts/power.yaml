id: sci.energy.power
type: concept
title: Watt und Kilowattstunden
summary: Leistung mal Zeit ist Energie.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Watt mal Stunden
    body: "Auf jedem Gerät steht, wie viel Watt es zieht. Zieh die Leistung hoch: Die Linie zeigt, wie viele **Kilowattstunden** in ein paar Stunden zusammenkommen. Danach richtet sich deine Stromrechnung."
    visual:
      widget: slider
      interactive: true
      params:
        expr: p*x
        x:
          - 0
          - 5
        y:
          - 0
          - 10
        sliders:
          - id: p
            label: Leistung (kW)
            min: 0.5
            max: 2
            step: 0.5
            initial: 0.5

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Watt leistet ein Mensch, der gemütlich Rad fährt?"
    params:
      min: 1
      max: 2000
      unit: W
    answer:
      value: 100
      tolerance: 40
    explanation: Etwa 100 W. Für einen Föhn bräuchte es 20 Radfahrer.

  - kind: problem
    id: foehn
    widget: choice
    prompt: Auf einem Föhn steht 2000 W. Was sagt diese Zahl?
    params:
      options:
        - { label: Wie schnell er Energie verbraucht, correct: true }
        - { label: Wie viel er insgesamt verbraucht, feedback: "Das hängt davon ab, wie lange er läuft." }
        - { label: Wie heiß er wird, feedback: "Watt misst Leistung, keine Temperatur." }
    hints:
      - Watt ist eine Leistung – Energie pro Zeit.
    explanation: Watt ist die **Leistung**. Erst mit der Zeit wird daraus verbrauchte Energie.

  - kind: explain
    id: s2
    body: |
      **Leistung** (Watt) sagt, wie schnell Energie fließt. **Energie** ist Leistung mal Zeit.
      1000 Watt eine Stunde lang ergibt 1 **Kilowattstunde** (kWh).

  - kind: problem
    id: viertelstunde
    widget: numeric
    prompt: Ein Föhn mit 2000 W läuft 15 Minuten. Wie viele kWh braucht er?
    params: { unit: kWh }
    answer: { value: 0.5 }
    feedback:
      - when: "numval(state.input) == 30000"
        misconception: watt-minutes
        text: Rechne in Kilowatt und Stunden – 2 kW und eine Viertelstunde.
    hints:
      - 2000 W sind 2 kW, 15 Minuten sind 0,25 Stunden.
    explanation: 2 kW · 0,25 h = 0,5 kWh.

  - kind: problem
    id: geraet
    widget: numeric
    prompt: Ein Gerät mit {{w}} W läuft {{h}} Stunden. Wie viele kWh braucht es?
    params: { unit: kWh }
    answer: { value: "{{w * h / 1000}}" }
    feedback:
      - when: "numval(state.input) == w * h"
        misconception: wh-not-kwh
        text: Das sind Wattstunden. Teile noch durch 1000.
    hints:
      - "{{w}} W · {{h}} h, dann durch 1000."
    explanation: "{{w}} · {{h}} = {{w * h}} Wh = {{w * h / 1000}} kWh."
    variants:
      params: { w: "choice[50,100,500,1500]", h: "choice[2,4,6]" }
      defaults: { w: 100, h: 4 }

  - kind: problem
    id: leistungen
    widget: match
    prompt: Welche Leistung passt ungefähr zu welchem Gerät?
    params:
      pairs:
        - { left: LED-Lampe, right: 8 W }
        - { left: Laptop, right: 50 W }
        - { left: Staubsauger, right: 700 W }
        - { left: Wasserkocher, right: 2000 W }
    hints:
      - Was heizt, braucht am meisten.
    explanation: Heizen und Kochen brauchen am meisten Leistung, Licht am wenigsten.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Leistung misst man in [[Watt]], Energie in [[Kilowattstunden]]. Energie ist Leistung mal [[Zeit]].
      distractors:
        - Volt
        - Strecke

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Ein Gerät an 24 V soll 48 W ziehen. Stell den passenden Widerstand ein.
    params:
      scene: circuit
    answer:
      voltage: 24
      power: 48
    explanation: Bei 12 Ω fließen 2 A. 24 V · 2 A = 48 W.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Ein Heizlüfter braucht in 2 Stunden 3 kWh. Stelle seine Leistung so ein, dass die Linie durch den Punkt geht.
    params:
      expr: p*x
      x:
        - 0
        - 5
      y:
        - 0
        - 10
      showCoordinates: false
      sliders:
        - id: p
          label: Leistung (kW)
          min: 0.5
          max: 3
          step: 0.5
          initial: 0.5
      markers:
        - x: 2
          y: 3
          label: 2 h, 3 kWh
    answer:
      values:
        p: 1.5
    hints:
      - Energie = Leistung · Zeit. Die Linie steigt in jeder Stunde um die Leistung.
      - Teile 3 kWh durch 2 h.
    explanation: 3 kWh in 2 Stunden heißt 1,5 kW – also 1500 W.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Akku speichert 0,5 kWh. Wie viele Stunden kann er ein 25-Watt-Gerät betreiben?
    params:
      unit: h
    answer:
      value: 20
    hints:
      - 0,5 kWh sind 500 Wattstunden.
    explanation: "500 Wh : 25 W = 20 h."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Du wiegst {{m}} kg und rennst in {{t}} Sekunden eine 3 m hohe Treppe hoch. Welche Leistung bringst du – in Watt? Rechne mit g = 10 m/s².
    params:
      unit: W
    answer:
      value: "{{m * 30 / t}}"
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - m * 30) < 1
        misconception: energy-vs-power
        text: Das ist die Energie in Joule. Leistung ist Energie **pro Sekunde**.
    hints:
      - "Erst die Energie: m · g · h."
      - Dann durch die Zeit teilen.
    explanation: "Energie: {{m}} · 10 · 3 = {{m * 30}} J. Durch {{t}} s ergibt {{m * 30 / t}} W. Kurz schafft ein Mensch mehrere hundert Watt, dauerhaft eher 100."
    difficulty: 2
    variants:
      params:
        m: choice[50,60,70,80]
        t: choice[3,4,5,6]
      defaults:
        m: 60
        t: 5

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Kilowattstunden Energie stecken in einem Liter Benzin?"
    params:
      min: 0.1
      max: 100
      scale: log
    answer:
      value: 9
      within: 30
    explanation: Rund 9 kWh. Ein Mensch auf dem Rad (100 W) bräuchte dafür 90 Stunden. Darum ist Benzin so »praktisch« – und so schwer zu ersetzen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viele Joule sind eine Kilowattstunde? In Millionen.
    answer:
      value: 3.6
    hints:
      - 1 Watt = 1 Joule pro Sekunde. Eine Stunde hat 3600 Sekunden.
    explanation: 1000 W · 3600 s = 3,6 Millionen Joule.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: "Auf einer Rechnung steht: »Verbrauch 3000 kW pro Jahr«. Was ist daran falsch?"
    params:
      options:
        - label: kW ist eine Leistung. Verbraucht werden kWh – Energie.
          correct: true
        - label: Nichts, das ist dasselbe.
          feedback: Leistung ist ein Tempo, Energie eine Menge. Wie km/h und km.
        - label: Es müsste kW pro Stunde heißen.
          feedback: kW pro Stunde wäre eine Änderung der Leistung. Gemeint ist kW **mal** Stunde.
    hints:
      - "Vergleiche: km/h und km."
      - Kilowattstunde heißt Kilowatt **mal** Stunde.
    explanation: "Leistung (kW) ist wie das Tempo, Energie (kWh) wie die Strecke. Die Rechnung zählt die Energie: 3000 kWh."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Fermi-Frage: Wie viele kWh Energie braucht Deutschland pro Kopf und Tag – Strom, Heizung, Verkehr und Industrie zusammen?"
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 100
      within: 40
    explanation: Rund 100 kWh am Tag, also etwa 4 kW rund um die Uhr. Das ist so viel, wie 40 Menschen dauerhaft auf dem Rad leisten könnten.
    difficulty: 3

srs:
  cards_from: [viertelstunde, geraet]
