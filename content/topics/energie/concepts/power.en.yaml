id: sci.energy.power
type: concept
title: Watts and kilowatt-hours
summary: Power times time is energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many watts does a person produce cycling at an easy pace?"
    params:
      min: 1
      max: 2000
      unit: W
    answer:
      value: 100
      tolerance: 40
    explanation: About 100 W. A hair dryer would need 20 cyclists.

  - kind: problem
    id: foehn
    widget: choice
    prompt: A hair dryer says 2000 W. What does that number tell you?
    params:
      options:
        - { label: How fast it uses energy, correct: true }
        - { label: How much it uses in total, feedback: "That depends on how long it runs." }
        - { label: How hot it gets, feedback: "Watts measure power, not temperature." }
    hints:
      - Watt is a unit of power, which is energy per time.
    explanation: Watt is the **power**. Only with time does it become energy used.

  - kind: explain
    id: s2
    body: |
      **Power** (watts) tells you how fast energy flows. **Energy** is power times time.
      1000 watts for one hour gives 1 **kilowatt-hour** (kWh).

  - kind: problem
    id: viertelstunde
    widget: numeric
    prompt: A 2000 W hair dryer runs for 15 minutes. How many kWh does it use?
    params: { unit: kWh }
    answer: { value: 0.5 }
    feedback:
      - when: "numval(state.input) == 30000"
        misconception: watt-minutes
        text: Work in kilowatts and hours. That is 2 kW and a quarter of an hour.
    hints:
      - 2000 W is 2 kW, and 15 minutes is 0.25 hours.
    explanation: 2 kW · 0.25 h = 0.5 kWh.

  - kind: problem
    id: geraet
    widget: numeric
    prompt: A {{w}} W device runs for {{h}} hours. How many kWh does it use?
    params: { unit: kWh }
    answer: { value: "{{w * h / 1000}}" }
    feedback:
      - when: "numval(state.input) == w * h"
        misconception: wh-not-kwh
        text: That is watt-hours. Divide by 1000 as well.
    hints:
      - "{{w}} W · {{h}} h, then divide by 1000."
    explanation: "{{w}} · {{h}} = {{w * h}} Wh = {{w * h / 1000}} kWh."
    variants:
      params: { w: "choice[50,100,500,1500]", h: "choice[2,4,6]" }
      defaults: { w: 100, h: 4 }

  - kind: problem
    id: leistungen
    widget: match
    prompt: Which power rating fits which device, roughly?
    params:
      pairs:
        - { left: LED lamp, right: 8 W }
        - { left: Laptop, right: 50 W }
        - { left: Vacuum cleaner, right: 700 W }
        - { left: Kettle, right: 2000 W }
    hints:
      - Whatever heats needs the most.
    explanation: Heating and cooking need the most power. Light needs the least.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Power is measured in [[watts]], energy in [[kilowatt-hours]]. Energy is power times [[time]].
      distractors:
        - volts
        - distance

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: A device at 24 V should draw 48 W. Set the matching resistance.
    params:
      scene: circuit
    answer:
      voltage: 24
      power: 48
    explanation: At 12 Ω, 2 A flow. 24 V · 2 A = 48 W.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A battery stores 0.5 kWh. For how many hours can it run a 25-watt device?
    params:
      unit: h
    answer:
      value: 20
    hints:
      - 0.5 kWh is 500 watt-hours.
    explanation: 500 Wh ÷ 25 W = 20 h.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: How many joules are one kilowatt-hour? In millions.
    answer:
      value: 3.6
    hints:
      - 1 watt = 1 joule per second. An hour has 3600 seconds.
    explanation: 1000 W · 3600 s = 3.6 million joules.
    difficulty: 3

srs:
  cards_from: [viertelstunde, geraet]
