id: sci.energy.power
type: concept
title: Watts and kilowatt-hours
summary: Power times time is energy.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Watts times hours
    body: "Every device says how many watts it draws. Drag the power up: the line shows how many **kilowatt-hours** add up in a few hours. That is what your power bill is based on."
    visual:
      widget: slider
      interactive: true
      params:
        expr: p*x
        x:
          - 0
          - 5
        y:
          - 0
          - 10
        sliders:
          - id: p
            label: Power (kW)
            min: 0.5
            max: 2
            step: 0.5
            initial: 0.5

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many watts does a person produce cycling at an easy pace?"
    params:
      min: 1
      max: 2000
      unit: W
    answer:
      value: 100
      tolerance: 40
    explanation: About 100 W. A hair dryer would need 20 cyclists.

  - kind: problem
    id: foehn
    widget: choice
    prompt: A hair dryer says 2000 W. What does that number tell you?
    params:
      options:
        - { label: How fast it uses energy, correct: true }
        - { label: How much it uses in total, feedback: "That depends on how long it runs." }
        - { label: How hot it gets, feedback: "Watts measure power, not temperature." }
    hints:
      - Watt is a unit of power, which is energy per time.
    explanation: Watt is the **power**. Only with time does it become energy used.

  - kind: explain
    id: s2
    body: |
      **Power** (watts) tells you how fast energy flows. **Energy** is power times time.
      1000 watts for one hour gives 1 **kilowatt-hour** (kWh).

  - kind: problem
    id: viertelstunde
    widget: numeric
    prompt: A 2000 W hair dryer runs for 15 minutes. How many kWh does it use?
    params: { unit: kWh }
    answer: { value: 0.5 }
    feedback:
      - when: "numval(state.input) == 30000"
        misconception: watt-minutes
        text: Work in kilowatts and hours. That is 2 kW and a quarter of an hour.
    hints:
      - 2000 W is 2 kW, and 15 minutes is 0.25 hours.
    explanation: 2 kW · 0.25 h = 0.5 kWh.

  - kind: problem
    id: geraet
    widget: numeric
    prompt: A {{w}} W device runs for {{h}} hours. How many kWh does it use?
    params: { unit: kWh }
    answer: { value: "{{w * h / 1000}}" }
    feedback:
      - when: "numval(state.input) == w * h"
        misconception: wh-not-kwh
        text: That is watt-hours. Divide by 1000 as well.
    hints:
      - "{{w}} W · {{h}} h, then divide by 1000."
    explanation: "{{w}} · {{h}} = {{w * h}} Wh = {{w * h / 1000}} kWh."
    variants:
      params: { w: "choice[50,100,500,1500]", h: "choice[2,4,6]" }
      defaults: { w: 100, h: 4 }

  - kind: problem
    id: leistungen
    widget: match
    prompt: Which power rating fits which device, roughly?
    params:
      pairs:
        - { left: LED lamp, right: 8 W }
        - { left: Laptop, right: 50 W }
        - { left: Vacuum cleaner, right: 700 W }
        - { left: Kettle, right: 2000 W }
    hints:
      - Whatever heats needs the most.
    explanation: Heating and cooking need the most power. Light needs the least.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Power is measured in [[watts]], energy in [[kilowatt-hours]]. Energy is power times [[time]].
      distractors:
        - volts
        - distance

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: A device at 24 V should draw 48 W. Set the matching resistance.
    params:
      scene: circuit
    answer:
      voltage: 24
      power: 48
    explanation: At 12 Ω, 2 A flow. 24 V · 2 A = 48 W.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: A fan heater uses 3 kWh in 2 hours. Set its power so that the line passes through the point.
    params:
      expr: p*x
      x:
        - 0
        - 5
      y:
        - 0
        - 10
      showCoordinates: false
      sliders:
        - id: p
          label: Power (kW)
          min: 0.5
          max: 3
          step: 0.5
          initial: 0.5
      markers:
        - x: 2
          y: 3
          label: 2 h, 3 kWh
    answer:
      values:
        p: 1.5
    hints:
      - Energy = power · time. The line rises by the power every hour.
      - Divide 3 kWh by 2 h.
    explanation: 3 kWh in 2 hours means 1.5 kW – that is 1500 W.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A battery stores 0.5 kWh. For how many hours can it run a 25-watt device?
    params:
      unit: h
    answer:
      value: 20
    hints:
      - 0.5 kWh is 500 watt-hours.
    explanation: 500 Wh ÷ 25 W = 20 h.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: You weigh {{m}} kg and run up 3 m of stairs in {{t}} seconds. What power do you deliver – in watts? Use g = 10 m/s².
    params:
      unit: W
    answer:
      value: "{{m * 30 / t}}"
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - m * 30) < 1
        misconception: energy-vs-power
        text: That is the energy in joules. Power is energy **per second**.
    hints:
      - "First the energy: m · g · h."
      - Then divide by the time.
    explanation: "Energy: {{m}} · 10 · 3 = {{m * 30}} J. Divided by {{t}} s that is {{m * 30 / t}} W. Briefly a person manages several hundred watts, for long periods about 100."
    difficulty: 2
    variants:
      params:
        m: choice[50,60,70,80]
        t: choice[3,4,5,6]
      defaults:
        m: 60
        t: 5

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many kilowatt-hours of energy are in one litre of petrol?"
    params:
      min: 0.1
      max: 100
      scale: log
    answer:
      value: 9
      within: 30
    explanation: About 9 kWh. A person on a bike (100 W) would need 90 hours for that. That is why petrol is so »handy« – and so hard to replace.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: How many joules are one kilowatt-hour? In millions.
    answer:
      value: 3.6
    hints:
      - 1 watt = 1 joule per second. An hour has 3600 seconds.
    explanation: 1000 W · 3600 s = 3.6 million joules.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: "A bill says: »Consumption 3000 kW per year«. What is wrong with that?"
    params:
      options:
        - label: kW is a power. What you use up is kWh – energy.
          correct: true
        - label: Nothing, it is the same.
          feedback: Power is a rate, energy an amount. Like km/h and km.
        - label: It should say kW per hour.
          feedback: kW per hour would be a change of power. What is meant is kW **times** hour.
    hints:
      - "Compare: km/h and km."
      - Kilowatt-hour means kilowatt **times** hour.
    explanation: "Power (kW) is like speed, energy (kWh) like distance. The bill counts energy: 3000 kWh."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: estimate
    prompt: "Fermi question: how many kWh of energy does Germany use per person each day? Count power, heat, cars and industry."
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 100
      within: 40
    explanation: About 100 kWh per day, roughly 4 kW around the clock. That is what 40 people could deliver cycling non-stop.
    difficulty: 3

srs:
  cards_from: [viertelstunde, geraet]
