id: sci.energy.efficiency
type: concept
title: Wirkungsgrad
summary: Wie viel kommt wirklich an?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Nur ein Teil kommt an
    body: "Keine Maschine macht aus Energie nur das, was du willst. Ein Teil landet immer dort, wo du ihn nicht brauchst. Deck die Karten auf und vergleiche: Wer hat den besten **Wirkungsgrad**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚴
            front: Dein Körper
            back: Beim Radfahren wird nur etwa ein Viertel der Nahrungsenergie zu Bewegung.
          - icon: 🏭
            front: Kohlekraftwerk
            back: Von 10 Teilen Energie in der Kohle kommen nur etwa 4 als Strom heraus.
          - icon: 🌱
            front: Ein Blatt
            back: Es speichert nur etwa 1 % des Sonnenlichts als Zucker.
          - icon: 🐛
            front: Glühwürmchen
            back: Sein Licht entsteht fast ganz ohne Wärme.

  - kind: problem
    id: gluehbirne
    widget: choice
    prompt: Eine Glühbirne mit 60 W ist so hell wie eine LED mit 8 W. Wohin geht der Rest der Energie?
    params:
      options:
        - { label: In Wärme, correct: true }
        - { label: "In Licht, das man nicht sieht", feedback: "Ein kleiner Teil ist Infrarot – aber das ist eben Wärme." }
        - { label: Sie geht verloren, feedback: "Energie geht nie verloren. Sie wird nur in eine andere Form umgewandelt." }
    hints:
      - Fass eine alte Glühbirne lieber nicht an.
    explanation: Die meiste Energie wird zu Wärme. Nur ein kleiner Teil wird Licht.

  - kind: explain
    id: s2
    body: |
      **Wirkungsgrad** = nutzbare Energie : eingesetzte Energie.
      Eine Glühbirne macht nur etwa 5 % zu Licht, eine LED rund 40 %.

  - kind: problem
    id: motor
    widget: numeric
    prompt: Ein Motor bekommt {{e}} Joule und liefert {{n}} Joule Bewegung. Wie groß ist sein Wirkungsgrad?
    params: { unit: "%" }
    answer: { value: "{{100 * n / e}}" }
    hints:
      - "{{n}} geteilt durch {{e}}, mal 100."
    explanation: "{{n}} : {{e}} = {{n / e}} – also {{100 * n / e}} %."
    variants:
      params: { e: "choice[1000,2000,500]", p: "choice[25,40,80,90]" }
      derive: { n: "e * p / 100" }
      defaults: { e: 1000, p: 80 }

  - kind: problem
    id: sparen
    widget: numeric
    prompt: Wie viel Prozent Strom spart eine 8-W-LED gegenüber einer 60-W-Glühbirne? Runde auf ganze Prozent.
    params: { unit: "%" }
    answer: { value: 87, tolerance: 1 }
    feedback:
      - when: "numval(state.input) == 52"
        misconception: watts-as-percent
        text: 52 W ist die Ersparnis in Watt. Teile sie durch 60.
    hints:
      - Die Ersparnis ist 52 W von 60 W.
    explanation: "52 : 60 ≈ 0,87 – also rund 87 % weniger."

  - kind: problem
    id: einordnen
    widget: buckets
    prompt: Hoher oder niedriger Wirkungsgrad?
    params:
      buckets: [{ label: hoch – über 80 % }, { label: niedrig – unter 40 % }]
      items:
        - { label: Elektromotor, bucket: hoch – über 80 % }
        - { label: Transformator, bucket: hoch – über 80 % }
        - { label: Akku laden und entladen, bucket: hoch – über 80 % }
        - { label: Glühbirne, bucket: niedrig – unter 40 % }
        - { label: Benzinmotor, bucket: niedrig – unter 40 % }
        - { label: Kochen über offenem Feuer, bucket: niedrig – unter 40 % }
    hints:
      - Wo entsteht viel Abwärme?
    explanation: Elektrische Maschinen sind sehr effizient. Verbrennung verliert viel als Wärme.

  - kind: explain
    id: s6
    body: Kann ein Wirkungsgrad über 100 % liegen?
    reveal:
      body: Nein – Energie entsteht nicht aus dem Nichts. Eine Wärmepumpe liefert zwar mehr Wärme als Strom. Den Rest holt sie aber aus der Umgebung.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Bei jeder Umwandlung geht ein Teil der Energie als Wärme verloren.
          right: true
        - text: Ein Wirkungsgrad von 120 % ist mit guter Technik möglich.
          right: false
          why: Das wäre ein Perpetuum mobile – Energie aus dem Nichts.
        - text: Ein Elektromotor ist effizienter als ein Benzinmotor.
          right: true

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Eine LED bekommt 100 J Strom. Ihr Wirkungsgrad ist 40 %. Stell ein, wie viel davon Licht wird und wie viel Wärme.
    params:
      labels:
        - Licht
        - Wärme
      values:
        - 0
        - 0
      editable:
        - 0
        - 1
      min: 0
      max: 100
      step: 5
      unit: J
    answer:
      values:
        - 40
        - 60
    hints:
      - "Wirkungsgrad = nutzbare Energie : eingesetzte Energie. Nutzbar ist hier das Licht."
      - Der Rest wird Wärme – zusammen müssen es 100 J sein.
    explanation: 40 % von 100 J sind 40 J Licht. Die übrigen 60 J werden Wärme – keine Energie geht verloren.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Kraftwerk hat 40 % Wirkungsgrad, die Leitung 95 %, der Motor 90 %. Wie viel Prozent der Brennstoffenergie kommen als Bewegung an?
    params:
      unit: "%"
    answer:
      value: 34.2
      tolerance: 0.3
    hints:
      - "Wirkungsgrade werden multipliziert: 0,4 · 0,95 · 0,9."
    explanation: 34,2 %. In einer Kette bestimmt das schwächste Glied viel.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Ein E-Motor hat 90 % Wirkungsgrad. Er soll 45 kW an die Räder geben. Wie viele kW zieht er aus der Batterie?
    params:
      unit: kW
    answer:
      value: 50
    feedback:
      - when: abs(numval(state.input) - 40.5) < 0.1
        misconception: efficiency-direction
        text: Der Motor braucht **mehr**, als er abgibt. Teile durch 0,9, statt mit 0,9 zu malen.
    hints:
      - Nutzen = Wirkungsgrad · Aufwand.
      - "Aufwand = 45 kW : 0,9."
    explanation: "45 : 0,9 = 50 kW. Die 5 kW Differenz werden zu Wärme in Motor und Elektronik."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Ein elektrischer Heizlüfter macht fast 100 % des Stroms zu Wärme. Ist er damit die beste Heizung?
    params:
      options:
        - label: Nein – eine Wärmepumpe macht aus 1 kWh Strom 3 bis 4 kWh Wärme.
          correct: true
        - label: Ja, mehr als 100 % geht nicht.
          feedback: Die Wärmepumpe erzeugt die Wärme nicht, sie holt sie von draußen.
        - label: Ja, er ist auch am billigsten.
          feedback: Mit Strom direkt zu heizen ist meist am teuersten.
    hints:
      - Muss die Wärme aus dem Strom selbst kommen?
      - Ein Kühlschrank pumpt Wärme von innen nach außen.
    explanation: "Der Heizlüfter wandelt Strom 1 : 1 in Wärme. Die Wärmepumpe nutzt den Strom, um Umweltwärme hereinzupumpen – sie liefert ein Vielfaches."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Wärmepumpe liefert aus 1 kWh Strom 4 kWh Wärme. Verletzt das den Energieerhaltungssatz?
    params:
      options:
        - label: Nein – 3 kWh holt sie aus der Umgebung, der Strom transportiert nur
          correct: true
        - label: Ja – darum funktioniert sie in Wahrheit nicht
          feedback: Sie funktioniert, in Millionen Häusern und in jedem Kühlschrank.
        - label: Nein – sie erzeugt die Energie selbst
          feedback: Energie kann nicht erzeugt werden, nur verschoben und umgewandelt.
    hints:
      - Woher könnte die zusätzliche Wärme stammen?
    explanation: Sie **pumpt** Wärme von kalt nach warm. Ein Kühlschrank macht dasselbe – nur andersherum genutzt.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Kohlekraftwerk (40 %) liefert Strom über eine Leitung (95 %) an eine Wärmepumpe. Sie macht aus jeder kWh Strom 3 kWh Wärme. Wie viel Prozent der Kohleenergie kommen als Wärme an?
    params:
      unit: "%"
    answer:
      value: 114
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 38) < 1
        misconception: forgot-cop
        text: Das wäre ein Heizlüfter. Die Wärmepumpe verdreifacht den Strom noch.
    hints:
      - "Multipliziere alle Faktoren: 0,40 · 0,95 · …"
      - Die Leistungszahl 3 ist auch ein Faktor.
    explanation: 0,40 · 0,95 · 3 = 1,14. Selbst mit Kohlestrom kommt mehr Wärme an, als die Kohle direkt im Ofen liefern könnte. Mit Ökostrom ist der Vorteil noch größer.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum kann kein Wirkungsgrad über 100 % liegen – und warum ist die Wärmepumpe trotzdem kein Wunder?"
    params:
      keywords:
        - - energie
          - energy
          - erhalt
          - conserv
          - nichts
          - nothing
        - - umgebung
          - environment
          - surround
          - außen
          - outside
          - luft
          - air
          - erde
          - ground
        - - pump
          - holt
          - fetch
          - transport
          - bewegt
          - moves
      sample: Energie entsteht nicht aus dem Nichts, darum kommt nie mehr heraus als hinein. Die Wärmepumpe erzeugt die Wärme nicht. Sie pumpt Wärme aus der Umgebung ins Haus und braucht dafür nur etwas Strom.
    difficulty: 3

srs:
  cards_from: [motor, sparen]
