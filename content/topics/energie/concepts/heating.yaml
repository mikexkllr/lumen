id: sci.energy.heating
type: concept
title: Wärme kostet
summary: Wasser, Heizung und das eine Grad.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wärme im Haushalt
    body: "Heizung und warmes Wasser schlucken mehr Energie als alle Geräte zusammen. Deck die Karten auf: Wo steckt im Alltag die meiste **Wärme**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏠
            front: Die Heizung
            back: Rund zwei Drittel der Energie im Haushalt gehen ins Heizen.
          - icon: 🚿
            front: Heiß duschen
            back: Fünf Minuten kosten so viel Energie wie über zehn Stunden fernsehen.
          - icon: 🧺
            front: Der Trockner
            back: Er muss das Wasser aus der Wäsche verdampfen. Das kostet viel mehr als das Waschen.
          - icon: 🌡️
            front: Das Thermostat
            back: "Es merkt jedes Grad: Weniger warm heißt sofort weniger Energie."

  - kind: problem
    id: wasser
    widget: numeric
    body: Um 1 Liter Wasser um 1 °C zu erwärmen, braucht man etwa 4,2 kJ.
    prompt: Wie viel Energie braucht man für {{l}} Liter von 20 auf 100 °C?
    params: { unit: kJ }
    answer: { value: "{{l * 336}}" }
    hints:
      - "Das sind 80 Grad. Rechne {{l}} · 80 · 4,2."
    explanation: "{{l}} · 80 · 4,2 = {{l * 336}} kJ."
    variants:
      params: { l: "int[1,3]" }
      defaults: { l: 1 }

  - kind: problem
    id: deckel
    widget: choice
    prompt: Was spart beim Nudelwasser am meisten Energie?
    params:
      options:
        - { label: Deckel auf den Topf, correct: true }
        - { label: Mehr Wasser nehmen, feedback: "Mehr Wasser braucht mehr Energie." }
        - { label: Salz sofort hinein, feedback: "Das ändert fast nichts." }
    hints:
      - Wo geht die Wärme verloren?
    explanation: Ohne Deckel entweicht viel Wärme mit dem Dampf.

  - kind: explain
    id: s3
    body: |
      **Heizen** ist meist der größte Energieposten im Haushalt. Faustregel – **jedes Grad weniger** Raumtemperatur spart etwa 6 % Heizenergie.

  - kind: problem
    id: grad
    widget: numeric
    prompt: Deine Heizkosten sind {{k}} € im Jahr. Wie viel sparst du mit 1 °C weniger?
    params: { unit: "€" }
    answer: { value: "{{k * 6 / 100}}" }
    hints:
      - "6 % von {{k}} €."
    explanation: "{{k}} · 0,06 = {{k * 6 / 100}} € pro Jahr."
    variants:
      params: { k: "choice[600,900,1200,1500]" }
      defaults: { k: 1200 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wasser braucht 4,2 kJ, um 1 Liter um 1 °C zu erwärmen. Wie viele kJ braucht ein Vollbad mit 150 Litern von 10 auf 40 °C?
    params:
      unit: kJ
    answer:
      value: 18900
    hints:
      - 150 · 30 · 4,2.
    explanation: 18 900 kJ, das sind 5,25 kWh – so viel wie 50 Stunden Fernsehen.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Sekunden braucht ein Wasserkocher mit 2000 W, um 1 Liter von 20 auf 100 °C zu bringen?"
    params:
      min: 10
      max: 1000
    answer:
      value: 168
      tolerance: 40
    explanation: "1 L um 80 °C braucht 336 kJ. 336 000 J : 2000 W = 168 s, knapp 3 Minuten. In echt dauert es etwas länger, weil Wärme verloren geht."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Ein Durchlauferhitzer erwärmt {{l}} Liter pro Minute um 30 °C. Ein Liter braucht 4,2 kJ pro Grad. Welche Leistung braucht das Gerät – in kW?
    params:
      unit: kW
    answer:
      value: "{{l * 2.1}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - l * 126) < 1
        misconception: per-minute
        text: Das sind kJ pro **Minute**. Für kW brauchst du kJ pro Sekunde.
    hints:
      - "Energie pro Minute: {{l}} · 4,2 · 30 kJ."
      - Durch 60 ergibt kJ pro Sekunde = kW.
    explanation: "{{l}} · 4,2 · 30 = {{l * 126}} kJ pro Minute, durch 60 sind das {{l * 2.1}} kW. Darum brauchen Durchlauferhitzer einen eigenen Starkstrom-Anschluss."
    difficulty: 2
    variants:
      params:
        l: choice[4,6,8,10]
      defaults:
        l: 8

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum speichert Wasser so viel Wärme?
    params:
      options:
        - label: Seine Moleküle halten über Wasserstoffbrücken zusammen, die viel Energie aufnehmen
          correct: true
        - label: Weil es flüssig ist
          feedback: Öl ist auch flüssig und speichert nur halb so viel.
        - label: Weil es durchsichtig ist
          feedback: Die Farbe hat damit nichts zu tun.
    hints:
      - Wasser hat eine der höchsten **Wärmekapazitäten** überhaupt.
    explanation: Darum mildern Meere das Klima, und Heizungen arbeiten mit Wasser.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Eine Dusche läuft 5 Minuten mit 8 Litern pro Minute. Das Wasser wird von 10 auf 38 °C erwärmt. Wie viele kWh kostet das? (1 kWh = 3600 kJ)
    params:
      unit: kWh
    answer:
      value: 1.31
      tolerance: 0.03
    hints:
      - "40 Liter, um 28 °C erwärmt: 40 · 4,2 · 28 kJ."
      - Dann durch 3600 teilen.
    explanation: 40 · 4,2 · 28 = 4704 kJ ≈ 1,31 kWh. So viel braucht ein Kühlschrank in drei Tagen. Warmwasser ist ein großer Posten.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Wie viel Energie braucht die Luft in einem Zimmer mit 50 m³, um 1 °C wärmer zu werden? Luft: 1,2 kg pro m³ und 1 kJ pro kg und Grad. In kJ."
    params:
      unit: kJ
    answer:
      value: 60
    hints:
      - "Masse der Luft: 50 · 1,2 kg."
      - Mal 1 kJ pro kg und Grad.
    explanation: 60 kg Luft brauchen nur 60 kJ – so viel wie ein Wasserkocher in 30 Sekunden. Die Wärme steckt in Wänden und Möbeln. Darum verliert kurzes Stoßlüften kaum Energie.
    difficulty: 3

srs:
  cards_from: [wasser, grad]
