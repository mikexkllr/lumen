id: stats.normal.skewed
type: concept
title: Wenn die Glocke kippt
summary: Schiefe Verteilungen und der Median.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: form
    widget: buckets
    prompt: Glockenförmig oder schief?
    params:
      buckets: [{ label: glockenförmig }, { label: schief }]
      items:
        - { label: Körpergröße, bucket: glockenförmig }
        - { label: Messfehler, bucket: glockenförmig }
        - { label: Einkommen, bucket: schief }
        - { label: Einwohner von Städten, bucket: schief }
        - { label: Follower in sozialen Netzen, bucket: schief }
    hints:
      - Gibt es einzelne riesige Ausreißer nach oben?
    explanation: Bei Geld, Städten und Followern gibt es wenige Riesen und viele Kleine.

  - kind: problem
    id: dorf
    widget: numeric
    prompt: In einem Dorf verdienen 9 Leute je 3000 € und eine Person 300 000 €. Wie hoch ist der Mittelwert?
    params: { unit: "€" }
    answer: { value: 32700 }
    hints:
      - Alles addieren und durch 10 teilen.
    explanation: "(9 · 3000 + 300 000) : 10 = 32 700 €."

  - kind: explain
    id: s3
    body: |
      Ein einziger Ausreißer zieht den **Mittelwert** weit nach oben. Der **Median** – der mittlere Wert der Reihe – bleibt bei 3000 €. Bei schiefen Verteilungen beschreibt er das Typische besser.

  - kind: problem
    id: typisch
    widget: choice
    prompt: Was beschreibt das typische Einkommen in diesem Dorf besser?
    params:
      options:
        - { label: Der Median, correct: true }
        - { label: Der Mittelwert, feedback: "32 700 € verdient hier niemand außer einer Person." }
    hints:
      - Was verdienen neun von zehn Menschen?
    explanation: Darum berichten Statistiken über Einkommen meist den Median.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Wartezeit, Lohn, Größe von Städten: Viele Daten haben einen langen Schwanz nach rechts. Warum?"
    params:
      options:
        - label: Nach unten gibt es eine Grenze bei null, nach oben keine
          correct: true
        - label: Weil falsch gemessen wird
          feedback: Die Schiefe ist echt.
        - label: Zufall
          feedback: Es hat einen klaren strukturellen Grund.
    hints:
      - Kann eine Wartezeit negativ sein? Kann sie sehr lang sein?
    explanation: Viele dieser Größen entstehen durch **Multiplikation** von Einflüssen. Ihr Logarithmus ist dann wieder normalverteilt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux die 68-95-99,7-Regel mit einem Beispiel.
    params:
      keywords:
        - - "68"
        - - "95"
        - - standardabweichung
          - sigma
          - standard deviation
        - - mittelwert
          - mean
          - durchschnitt
          - average
      min: 3
      sample: Bei einer Normalverteilung liegen etwa 68 % der Werte höchstens eine Standardabweichung vom Mittelwert entfernt und 95 % höchstens zwei. Beim IQ mit Mittelwert 100 und σ = 15 liegen also 95 % zwischen 70 und 130.
    difficulty: 3

srs:
  cards_from: [form, typisch]
