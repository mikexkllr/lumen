id: stats.normal.skewed
type: concept
title: Wenn die Glocke kippt
summary: Schiefe Verteilungen und der Median.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: form
    widget: buckets
    prompt: Glockenförmig oder schief?
    params:
      buckets: [{ label: glockenförmig }, { label: schief }]
      items:
        - { label: Körpergröße, bucket: glockenförmig }
        - { label: Messfehler, bucket: glockenförmig }
        - { label: Einkommen, bucket: schief }
        - { label: Einwohner von Städten, bucket: schief }
        - { label: Follower in sozialen Netzen, bucket: schief }
    hints:
      - Gibt es einzelne riesige Ausreißer nach oben?
    explanation: Bei Geld, Städten und Followern gibt es wenige Riesen und viele Kleine.

  - kind: problem
    id: dorf
    widget: numeric
    prompt: In einem Dorf verdienen 9 Leute je 3000 € und eine Person 300 000 €. Wie hoch ist der Mittelwert?
    params: { unit: "€" }
    answer: { value: 32700 }
    hints:
      - Alles addieren und durch 10 teilen.
    explanation: "(9 · 3000 + 300 000) : 10 = 32 700 €."

  - kind: explain
    id: s3
    body: |
      Ein einziger Ausreißer zieht den **Mittelwert** weit nach oben. Der **Median** – der mittlere Wert der Reihe – bleibt bei 3000 €. Bei schiefen Verteilungen beschreibt er das Typische besser.

  - kind: problem
    id: typisch
    widget: choice
    prompt: Was beschreibt das typische Einkommen in diesem Dorf besser?
    params:
      options:
        - { label: Der Median, correct: true }
        - { label: Der Mittelwert, feedback: "32 700 € verdient hier niemand außer einer Person." }
    hints:
      - Was verdienen neun von zehn Menschen?
    explanation: Darum berichten Statistiken über Einkommen meist den Median.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Wartezeit, Lohn, Größe von Städten: Viele Daten haben einen langen Schwanz nach rechts. Warum?"
    params:
      options:
        - label: Nach unten gibt es eine Grenze bei null, nach oben keine
          correct: true
        - label: Weil falsch gemessen wird
          feedback: Die Schiefe ist echt.
        - label: Zufall
          feedback: Es hat einen klaren strukturellen Grund.
    hints:
      - Kann eine Wartezeit negativ sein? Kann sie sehr lang sein?
    explanation: Viele dieser Größen entstehen durch **Multiplikation** von Einflüssen. Ihr Logarithmus ist dann wieder normalverteilt.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: Wie ist diese Größe meist verteilt?
    params:
      buckets:
        - id: b1
          label: Langer Schwanz rechts
        - id: b2
          label: Langer Schwanz links
        - id: b3
          label: Etwa symmetrisch
      items:
        - label: Einkommen
          bucket: b1
        - label: Wartezeit beim Arzt
          bucket: b1
        - label: Sterbealter in reichen Ländern
          bucket: b2
        - label: Punkte in einem sehr leichten Test
          bucket: b2
        - label: Körpergröße von Erwachsenen
          bucket: b3
        - label: Messfehler einer Waage
          bucket: b3
    hints:
      - Gibt es eine harte Grenze nach unten oder oben?
      - Bei einem leichten Test stoßen viele an die volle Punktzahl.
    explanation: "Grenzen erzeugen **Schiefe**: Einkommen können nicht unter null, Punkte nicht über das Maximum. Bei rechtsschiefen Daten liegt der Mittelwert über dem Median."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Werte: 10, 100, 1000. Das **geometrische Mittel** ist die dritte Wurzel aus dem Produkt. Wie groß ist es?"
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 370
        misconception: arithmetic-mean
        text: Das ist das arithmetische Mittel. Es wird von der 1000 nach oben gezogen.
    hints:
      - "Produkt: 10 · 100 · 1000 = 1 000 000."
      - Welche Zahl hoch drei ergibt eine Million?
    explanation: ∛1 000 000 = 100. Im Logarithmus liegen die Werte bei 1, 2, 3 – schön symmetrisch. Für schiefe, positive Daten ist das geometrische Mittel oft das bessere »typisch«.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux die 68-95-99,7-Regel mit einem Beispiel.
    params:
      keywords:
        - - "68"
        - - "95"
        - - standardabweichung
          - sigma
          - standard deviation
        - - mittelwert
          - mean
          - durchschnitt
          - average
      min: 3
      sample: Bei einer Normalverteilung liegen etwa 68 % der Werte höchstens eine Standardabweichung vom Mittelwert entfernt und 95 % höchstens zwei. Beim IQ mit Mittelwert 100 und σ = 15 liegen also 95 % zwischen 70 und 130.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Viele kleine Zufälle, die man **addiert**, ergeben eine Glocke. Was kommt heraus, wenn man viele kleine Zufallsfaktoren **malnimmt** – etwa Zinsen?
    params:
      options:
        - label: "Eine Log-Normalverteilung: rechtsschief, ihr Logarithmus ist glockenförmig"
          correct: true
        - label: Auch eine Glocke
          feedback: Produkte verhalten sich anders als Summen.
        - label: Eine Gleichverteilung
          feedback: Wiederholtes Multiplizieren erzeugt Schiefe, keine Gleichheit.
    hints:
      - Der Logarithmus macht aus einem Produkt eine Summe.
      - Und Summen vieler Zufälle werden zur Glocke.
    explanation: log(Produkt) = Summe der Logs → Glocke. Das Produkt selbst ist **log-normal** verteilt. Das passt zu Einkommen, Stadtgrößen und Aktienkursen.
    difficulty: 3

srs:
  cards_from: [form, typisch]
