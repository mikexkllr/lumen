id: stats.normal.bell
type: concept
title: Die Glocke
summary: Wenn viele kleine Zufälle zusammenkommen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: brett
    widget: choice
    prompt: Kugeln fallen durch ein Brett voller Nägel und springen an jedem zufällig nach links oder rechts. Wo landen die meisten?
    params:
      options:
        - { label: In der Mitte, correct: true }
        - { label: Gleichmäßig verteilt, feedback: "Zum Rand kommt man nur, wenn fast jeder Sprung in dieselbe Richtung geht." }
        - { label: Am Rand, feedback: "Dafür bräuchte es lauter gleiche Sprünge – das ist selten." }
    hints:
      - Wie viele Wege führen in die Mitte, wie viele ganz nach außen?
    explanation: Es gibt viel mehr Wege in die Mitte als an den Rand.

  - kind: explain
    body: |
      Wirken viele kleine Zufälle zusammen, entsteht eine **Glockenkurve** – die Normalverteilung. In der Mitte liegt der Mittelwert, die Standardabweichung σ bestimmt die Breite.

  - kind: problem
    id: groesse
    widget: choice
    prompt: Du misst die Körpergröße von 10 000 Erwachsenen. Wie sieht die Verteilung aus?
    params:
      options:
        - { label: "Ein Berg in der Mitte, flach zu den Rändern", correct: true }
        - { label: Überall gleich hoch, feedback: "Sehr kleine und sehr große Menschen sind selten." }
        - { label: Zwei Berge an den Rändern, feedback: "Die meisten sind mittelgroß." }
    hints:
      - Wie häufig sind Menschen über 2 Meter?
    explanation: Größe hängt von vielen kleinen Einflüssen ab – darum glockenförmig.

  - kind: problem
    id: bereich
    widget: numeric
    prompt: Die Größe hat den Mittelwert {{m}} cm und σ = {{s}} cm. Etwa 68 % liegen zwischen {{m - s}} cm und wie viel?
    params: { unit: cm }
    answer: { value: "{{m + s}}" }
    hints:
      - Eine Standardabweichung nach oben.
    explanation: "{{m}} + {{s}} = {{m + s}} cm. Etwa zwei Drittel liegen innerhalb von einem σ."
    variants:
      params: { m: "choice[165,170,175]", s: "choice[6,8,10]" }
      defaults: { m: 170, s: 10 }

srs:
  cards_from: [brett, bereich]
