id: stats.normal.bell
type: concept
title: Die Glocke
summary: Wenn viele kleine Zufälle zusammenkommen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: brett
    widget: choice
    prompt: Kugeln fallen durch ein Brett voller Nägel und springen an jedem zufällig nach links oder rechts. Wo landen die meisten?
    params:
      options:
        - { label: In der Mitte, correct: true }
        - { label: Gleichmäßig verteilt, feedback: "Zum Rand kommt man nur, wenn fast jeder Sprung in dieselbe Richtung geht." }
        - { label: Am Rand, feedback: "Dafür bräuchte es lauter gleiche Sprünge – das ist selten." }
    hints:
      - Wie viele Wege führen in die Mitte, wie viele ganz nach außen?
    explanation: Es gibt viel mehr Wege in die Mitte als an den Rand.

  - kind: explain
    id: s2
    body: |
      Wirken viele kleine Zufälle zusammen, entsteht eine **Glockenkurve** – die Normalverteilung. In der Mitte liegt der Mittelwert, die Standardabweichung σ bestimmt die Breite.

  - kind: problem
    id: groesse
    widget: choice
    prompt: Du misst die Körpergröße von 10 000 Erwachsenen. Wie sieht die Verteilung aus?
    params:
      options:
        - { label: "Ein Berg in der Mitte, flach zu den Rändern", correct: true }
        - { label: Überall gleich hoch, feedback: "Sehr kleine und sehr große Menschen sind selten." }
        - { label: Zwei Berge an den Rändern, feedback: "Die meisten sind mittelgroß." }
    hints:
      - Wie häufig sind Menschen über 2 Meter?
    explanation: Größe hängt von vielen kleinen Einflüssen ab – darum glockenförmig.

  - kind: problem
    id: bereich
    widget: numeric
    prompt: Die Größe hat den Mittelwert {{m}} cm und σ = {{s}} cm. Etwa 68 % liegen zwischen {{m - s}} cm und wie viel?
    params: { unit: cm }
    answer: { value: "{{m + s}}" }
    hints:
      - Eine Standardabweichung nach oben.
    explanation: "{{m}} + {{s}} = {{m + s}} cm. Etwa zwei Drittel liegen innerhalb von einem σ."
    variants:
      params: { m: "choice[165,170,175]", s: "choice[6,8,10]" }
      defaults: { m: 170, s: 10 }

  - kind: problem
    id: c1
    widget: sim
    prompt: Schieb die Glocke auf μ = 100 und mach sie so schmal, dass mindestens 95 % zwischen 85 und 115 liegen.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 95
        - 100
    explanation: "Ab σ ≈ 7,5 passt es: 15 ist dann zwei Standardabweichungen. Kleines σ heißt schmale, hohe Glocke."

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Wirken viele kleine [[Zufälle]] zusammen, entsteht eine [[Glockenkurve]].
      distractors:
        - Fehler
        - Gerade

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Würfelt man mit **einem** Würfel, sind alle Zahlen gleich häufig. Addiert man **zehn** Würfel, entsteht eine Glocke. Wie heißt der Satz dahinter?
    params:
      options:
        - label: Zentraler Grenzwertsatz
          correct: true
        - label: Gesetz der großen Zahlen
          feedback: Das sagt nur, dass sich der Mittelwert einpendelt – nicht, welche Form entsteht.
        - label: Satz des Pythagoras
          feedback: Der gehört zu Dreiecken.
    hints:
      - Summen vieler unabhängiger Zufälle sehen immer ähnlich aus.
    explanation: "Darum ist die Normalverteilung überall: Körpergröße, Messfehler, Testergebnisse sind Summen vieler kleiner Einflüsse."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: sim
    prompt: "Die Streuung ist fest: σ = 15. Verschiebe μ so, dass etwa 16 % der Werte über 115 liegen."
    params:
      scene: normal
      interval:
        - 115
        - 200
      controls:
        sd:
          value: 15
          fixed: true
    answer:
      share:
        - 15
        - 17
    explanation: "Bei μ = 100 liegt 115 genau 1 σ über dem Mittel. Darüber liegen (100 % − 68 %) : 2 ≈ 16 %."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Im Galtonbrett springt jede Kugel an 10 Nägeln zufällig nach links oder rechts. Welche Verteilung entsteht genau?
    params:
      options:
        - label: Eine Binomialverteilung, die der Glocke sehr nahe kommt
          correct: true
        - label: Eine Gleichverteilung
          feedback: Die Mitte erreichen viel mehr Wege als die Ränder.
        - label: Genau die Normalverteilung
          feedback: Genau genommen gibt es nur 11 Fächer – die Glocke ist der Grenzfall.
    hints:
      - Wie viele Wege führen in das Fach ganz links?
      - "Zähle »rechts«-Sprünge: 0 bis 10."
    explanation: Die Zahl der Rechts-Sprünge ist binomialverteilt mit n = 10, p = 1/2. Für große n nähert sie sich der **Normalverteilung** – der Satz von de Moivre und Laplace.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Aktienkurse stürzen viel öfter extrem ab, als eine Normalverteilung erlaubt. Was heißt das?
    params:
      options:
        - label: Die Verteilung hat »dicke Ränder« – Extreme sind viel häufiger, als die Glocke sagt
          correct: true
        - label: Die Daten sind falsch
          feedback: Die Abstürze sind real.
        - label: Die Normalverteilung gilt trotzdem
          feedback: Wer sie hier nutzt, unterschätzt Risiken dramatisch.
    hints:
      - Ein Kurssturz von 20 Standardabweichungen dürfte nach der Glocke nie vorkommen.
    explanation: Wo Einflüsse sich verstärken statt nur addieren, versagt die Glocke. Das kostete 2008 Milliarden.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Die Glocke hat die Formel $f(x) = \frac{1}{\sigma\sqrt{2\pi}} e^{-(x-\mu)^2/(2\sigma^2)}$. Wie hoch ist ihr Gipfel für σ = 1? Auf zwei Stellen. (√(2π) ≈ 2,507)
    answer:
      value: 0.4
      tolerance: 0.005
    hints:
      - Am Gipfel ist x = μ, also e⁰ = 1.
      - "Rechne 1 : 2,507."
    explanation: "1 : 2,507 ≈ 0,40. Doppelte Streuung, halbe Höhe: Die Fläche unter der Kurve bleibt immer genau 1."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Mittelwert und Varianz sind fest. Unter allen Kurven mit diesen zwei Werten hat die Glocke eine besondere Rolle. Welche?
    params:
      options:
        - label: Sie hat die größte Entropie – sie setzt am wenigsten zusätzlich voraus
          correct: true
        - label: Sie hat die kleinste Streuung
          feedback: Die Streuung ist ja fest vorgegeben.
        - label: Sie ist die einzige symmetrische
          feedback: Es gibt viele symmetrische Verteilungen.
    hints:
      - Entropie misst, wie »unbestimmt« eine Verteilung ist.
      - Wer nur Mittel und Varianz kennt, sollte nichts weiter erfinden.
    explanation: Die Glocke hat die maximale **Entropie** bei gegebener Varianz. Darum ist sie die ehrlichste Annahme, wenn man nur diese zwei Zahlen kennt.
    difficulty: 3

srs:
  cards_from: [brett, bereich]
