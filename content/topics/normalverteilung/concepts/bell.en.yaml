id: stats.normal.bell
type: concept
title: The bell
summary: When many small chances add up.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The bell in the bread
    body: The bell curve hides in bread, stars and tests. Uncover the cards in any order. Each shows where the **normal distribution** turns up – sometimes with a surprise.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍞
            front: Poincaré's baker
            back: Legend says Poincaré weighed his bread for a year. The bell peaked at 950 instead of 1000 g – the baker was cheating.
          - icon: 🔭
            front: Gauss and the stars
            back: Gauss saw that errors in star measurements form a bell. That is why it is also called the Gaussian curve.
          - icon: 🧠
            front: IQ made to measure
            back: IQ tests are built so that the results form a bell centred on 100.

  - kind: problem
    id: brett
    widget: choice
    prompt: Balls fall through a board full of pegs and bounce randomly left or right at each one. Where do most land?
    params:
      options:
        - { label: In the middle, correct: true }
        - { label: Evenly spread out, feedback: "You only reach the edge if almost every bounce goes the same way." }
        - { label: At the edge, feedback: "That would take nearly all bounces going the same way – which is rare." }
    hints:
      - How many paths lead to the middle, and how many all the way out?
    explanation: There are far more paths to the middle than to the edge.

  - kind: explain
    id: s2
    body: |
      When many small chances work together, a **bell curve** appears – the normal distribution. The mean sits in the middle, and the standard deviation σ sets the width.

  - kind: problem
    id: groesse
    widget: choice
    prompt: You measure the height of 10,000 adults. What does the distribution look like?
    params:
      options:
        - { label: "A hill in the middle, flat toward the edges", correct: true }
        - { label: Equally high everywhere, feedback: "Very short and very tall people are rare." }
        - { label: Two hills at the edges, feedback: "Most people are of medium height." }
    hints:
      - How common are people over 2 meters?
    explanation: Height depends on many small influences – so it is bell-shaped.

  - kind: problem
    id: bereich
    widget: numeric
    prompt: Height has a mean of {{m}} cm and σ = {{s}} cm. About 68% lie between {{m - s}} cm and how much?
    params: { unit: cm }
    answer: { value: "{{m + s}}" }
    hints:
      - One standard deviation upward.
    explanation: "{{m}} + {{s}} = {{m + s}} cm. About two thirds lie within one σ."
    variants:
      params: { m: "choice[165,170,175]", s: "choice[6,8,10]" }
      defaults: { m: 170, s: 10 }

  - kind: problem
    id: c1
    widget: sim
    prompt: Move the bell to μ = 100 and make it so narrow that at least 95% lie between 85 and 115.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 95
        - 100
    explanation: "From σ ≈ 7.5 it fits: 15 is then two standard deviations. Small σ means a narrow, tall bell."

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: When many small [[chances]] act together, a [[bell curve]] arises.
      distractors:
        - errors
        - straight line

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Rolling **one** die, all numbers are equally frequent. Adding **ten** dice gives a bell. What is the theorem behind it called?
    params:
      options:
        - label: Central limit theorem
          correct: true
        - label: Law of large numbers
          feedback: That only says the mean settles – not which shape arises.
        - label: Pythagorean theorem
          feedback: That belongs to triangles.
    hints:
      - Sums of many independent random effects always look alike.
    explanation: "That is why the normal distribution is everywhere: height, measurement errors, test scores are sums of many small influences."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: sim
    prompt: "The spread is fixed: σ = 15. Move μ so that about 16 % of the values lie above 115."
    params:
      scene: normal
      interval:
        - 115
        - 200
      controls:
        sd:
          value: 15
          fixed: true
    answer:
      share:
        - 15
        - 17
    explanation: At μ = 100, 115 is exactly 1 σ above the mean. Above it lie (100 % − 68 %) ÷ 2 ≈ 16 %.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: In a Galton board each ball bounces left or right at random at 10 pins. Which distribution arises exactly?
    params:
      options:
        - label: A binomial distribution that comes very close to the bell
          correct: true
        - label: Far more paths reach the middle than the edges.
          feedback: Die Mitte erreichen viel mehr Wege als die Ränder.
        - label: Strictly there are only 11 slots – the bell is the limit.
          feedback: Genau genommen gibt es nur 11 Fächer – die Glocke ist der Grenzfall.
    hints:
      - How many paths lead to the leftmost slot?
      - "Count »right« bounces: 0 to 10."
    explanation: The number of right bounces is binomial with n = 10, p = 1/2. For large n it approaches the normal distribution – the de Moivre–Laplace theorem.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Stock prices crash extremely far more often than a normal distribution allows. What does that mean?
    params:
      options:
        - label: The distribution has “fat tails” – extremes are far more frequent than the bell says
          correct: true
        - label: The data are wrong
          feedback: The crashes are real.
        - label: The normal distribution still holds
          feedback: Whoever uses it here underestimates risks dramatically.
    hints:
      - A crash of 20 standard deviations should never occur according to the bell.
    explanation: Where influences amplify rather than merely add, the bell fails. That cost billions in 2008.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: The bell has the formula $f(x) = \frac{1}{\sigma\sqrt{2\pi}} e^{-(x-\mu)^2/(2\sigma^2)}$. How high is its peak for σ = 1? To two decimals. (√(2π) ≈ 2.507)
    answer:
      value: 0.4
      tolerance: 0.005
    hints:
      - At the peak x = μ, so e⁰ = 1.
      - Compute 1 ÷ 2.507.
    explanation: "1 ÷ 2.507 ≈ 0.40. Double the spread, half the height: the area under the curve always stays exactly 1."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Among all distributions with a fixed mean and fixed variance, the normal distribution has a special property. Which one?
    params:
      options:
        - label: It has the largest entropy – it assumes the least beyond that
          correct: true
        - label: The spread is fixed by assumption.
          feedback: Die Streuung ist ja fest vorgegeben.
        - label: There are many symmetric distributions.
          feedback: Es gibt viele symmetrische Verteilungen.
    hints:
      - Entropy measures how »undetermined« a distribution is.
      - Whoever knows only mean and variance should invent nothing more.
    explanation: The bell has maximum entropy for a given variance. That makes it the most honest assumption when only these two numbers are known.
    difficulty: 3

srs:
  cards_from: [brett, bereich]
