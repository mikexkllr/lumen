id: stats.normal.zscore
type: concept
title: The z-score
summary: Comparing apples to oranges.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Who stands out more: someone 2.05 m tall or someone with shoe size 43?"
    params:
      options:
        - label: The person 2.05 m tall
          correct: true
        - label: Shoe size 43
          feedback: That is quite ordinary.
        - label: That cannot be compared
          feedback: It can – by the distance from the usual.
    hints:
      - Which is further from the usual?
    explanation: The distance from the usual can be measured as a number.

  - kind: explain
    id: s1
    body: |
      The **z-score** counts how many standard deviations a value is from the mean: $z = \frac{x - \mu}{\sigma}$. That lets you compare values from very different tests.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Mean {{m}}, σ = {{s}}. What is the z-score of {{m + k * s}}?
    params: { placeholder: "z" }
    answer: { value: "{{k}}" }
    hints:
      - "Distance from the mean divided by {{s}}."
    explanation: "({{m + k * s}} − {{m}}) ÷ {{s}} = {{k}}."
    variants:
      params: { m: "int[50,80]", s: "int[4,12]", k: "int[-2,3]" }
      constraints: ["k != 0"]
      defaults: { m: 60, s: 8, k: 2 }

  - kind: problem
    id: vergleich
    widget: choice
    body: "Anna scored 80 points in math – average 70, σ = 5. Ben scored 85 points in English – average 80, σ = 10."
    prompt: Who did better compared to their own class?
    params:
      options:
        - { label: Anna, correct: true }
        - { label: Ben, feedback: "Ben has more points – but so does his class. Work out the z-scores." }
        - { label: Both the same, feedback: "Both are above average, but by different amounts." }
    hints:
      - Anna is 10 points above average. How many σ is that?
    explanation: Anna has z = 2, Ben only z = 0.5.

  - kind: problem
    id: zurueck
    widget: numeric
    prompt: Mean 50, σ = 8. Which value has z = {{z}}?
    params: { placeholder: "Value" }
    answer: { value: "{{50 + 8 * z}}" }
    hints:
      - "Add {{z}} times σ to the mean."
    explanation: "50 + {{z}} · 8 = {{50 + 8 * z}}."
    variants:
      params: { z: "int[1,3]" }
      defaults: { z: 2 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Anna has 82 points in maths (mean 70, σ = 8) and 78 points in German (mean 72, σ = 3). In which subject is her z-score higher? Enter the higher z-score.
    answer:
      value: 2
    hints:
      - "Maths: 12 ÷ 8. German: 6 ÷ 3."
    explanation: "German: z = 2 against 1.5 in maths. Fewer points but further above the field."
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: How much lies between the mean and z = 1? Set μ = 100 and σ = 15 and read off the share from 100 to 115.
    params:
      scene: normal
      interval:
        - 100
        - 115
    answer:
      mean: 100
      sd: 15
    explanation: "About 34%. Add the half below the mean: at z = 1 you are ahead of 84% of all values."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A measurement has z = 5. What does that say?
    params:
      options:
        - label: For a normal distribution that would be about 1 in 3.5 million – probably an error or a discovery
          correct: true
        - label: The value is five times the mean
          feedback: z counts standard deviations, not multiples.
        - label: That is quite ordinary
          feedback: 99.7% already lie within 3 σ.
    hints:
      - How much lies outside 3 σ? And 5 σ is much further out.
    explanation: In particle physics only “5 sigma” counts as a discovery – as with the Higgs particle in 2012.
    difficulty: 3

srs:
  cards_from: [rechnen, vergleich]
