id: stats.normal.zscore
type: concept
title: The z-score
summary: Comparing apples to oranges.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Comparing apples and oranges
    body: "Is a sprinter with 11 seconds better than a thrower with 60 metres? The **z-score** makes both comparable. Drag the point along the scale: 0 is the average, each step one standard deviation."
    visual:
      widget: numberline
      interactive: true
      params:
        min: -3
        max: 3
        ticks: 2
        labels: decimals
        markers:
          - value: 0
            label: average

  - kind: problem
    id: hook
    widget: choice
    prompt: "Who stands out more: someone 2.05 m tall or someone with shoe size 43?"
    params:
      options:
        - label: The person 2.05 m tall
          correct: true
        - label: Shoe size 43
          feedback: That is quite ordinary.
        - label: That cannot be compared
          feedback: It can – by the distance from the usual.
    hints:
      - Which is further from the usual?
    explanation: The distance from the usual can be measured as a number.

  - kind: explain
    id: s1
    body: |
      The **z-score** counts how many standard deviations a value is from the mean: $z = \frac{x - \mu}{\sigma}$. That lets you compare values from very different tests.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Mean {{m}}, σ = {{s}}. What is the z-score of {{m + k * s}}?
    params: { placeholder: "z" }
    answer: { value: "{{k}}" }
    hints:
      - "Distance from the mean divided by {{s}}."
    explanation: "({{m + k * s}} − {{m}}) ÷ {{s}} = {{k}}."
    variants:
      params: { m: "int[50,80]", s: "int[4,12]", k: "int[-2,3]" }
      constraints: ["k != 0"]
      defaults: { m: 60, s: 8, k: 2 }

  - kind: problem
    id: vergleich
    widget: choice
    body: "Anna scored 80 points in math – average 70, σ = 5. Ben scored 85 points in English – average 80, σ = 10."
    prompt: Who did better compared to their own class?
    params:
      options:
        - { label: Anna, correct: true }
        - { label: Ben, feedback: "Ben has more points – but so does his class. Work out the z-scores." }
        - { label: Both the same, feedback: "Both are above average, but by different amounts." }
    hints:
      - Anna is 10 points above average. How many σ is that?
    explanation: Anna has z = 2, Ben only z = 0.5.

  - kind: problem
    id: zurueck
    widget: numeric
    prompt: Mean 50, σ = 8. Which value has z = {{z}}?
    params: { placeholder: "Value" }
    answer: { value: "{{50 + 8 * z}}" }
    hints:
      - "Add {{z}} times σ to the mean."
    explanation: "50 + {{z}} · 8 = {{50 + 8 * z}}."
    variants:
      params: { z: "int[1,3]" }
      defaults: { z: 2 }

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: In the test the average is 60 points and the standard deviation is 8. Anna has 72 points. Mark her z-score.
    params:
      min: -3
      max: 3
      ticks: 2
      labels: decimals
    answer:
      value: 1.5
    hints:
      - How far is Anna above the average?
      - 12 points are 12 ÷ 8 = 1.5 standard deviations.
    explanation: $z = \frac{72 - 60}{8} = 1.5$. Anna is one and a half standard deviations above the average.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Anna has 82 points in maths (mean 70, σ = 8) and 78 points in German (mean 72, σ = 3). In which subject is her z-score higher? Enter the higher z-score.
    answer:
      value: 2
    hints:
      - "Maths: 12 ÷ 8. German: 6 ÷ 3."
    explanation: "German: z = 2 against 1.5 in maths. Fewer points but further above the field."
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: How much lies between the mean and z = 1? Set μ = 100 and σ = 15 and read off the share from 100 to 115.
    params:
      scene: normal
      interval:
        - 100
        - 115
    answer:
      mean: 100
      sd: 15
    explanation: "About 34%. Add the half below the mean: at z = 1 you are ahead of 84% of all values."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "IQ scores: μ = 100, σ = 15. From which IQ do you belong to the top 2.5 %?"
    answer:
      value: 130
    hints:
      - Above μ + 2σ lie 2.5 %.
      - Compute 100 + 2 · 15.
    explanation: "100 + 30 = 130. From share to value: find the z-score first, then x = μ + z · σ."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: buckets
    prompt: How unusual is this z-score in a normal distribution?
    params:
      buckets:
        - id: b1
          label: Common (|z| < 2)
        - id: b2
          label: Notable (2 to 3)
        - id: b3
          label: Extreme (above 3)
      items:
        - label: z = 0.5
          bucket: b1
        - label: z = −1.2
          bucket: b1
        - label: z = 2.4
          bucket: b2
        - label: z = −2.7
          bucket: b2
        - label: z = 3.8
          bucket: b3
        - label: z = −4.5
          bucket: b3
    hints:
      - The sign only says above or below. For rarity the size counts.
      - "|−2.7| = 2.7 lies between 2 and 3."
    explanation: Beyond |z| = 2 lie 5 %, beyond |z| = 3 only 0.3 %. Values past 4 are almost impossible for a true bell – often a sign of errors or fat tails.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A measurement has z = 5. What does that say?
    params:
      options:
        - label: For a normal distribution that would be about 1 in 3.5 million – probably an error or a discovery
          correct: true
        - label: The value is five times the mean
          feedback: z counts standard deviations, not multiples.
        - label: That is quite ordinary
          feedback: 99.7% already lie within 3 σ.
    hints:
      - How much lies outside 3 σ? And 5 σ is much further out.
    explanation: In particle physics only “5 sigma” counts as a discovery – as with the Higgs particle in 2012.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: sim
    prompt: μ = 100 is fixed. Set σ so that 115 sits exactly at z = 1.5 – and read off how much lies below it.
    params:
      scene: normal
      interval:
        - 0
        - 115
      controls:
        mean:
          value: 100
          fixed: true
    answer:
      sd: 10
    explanation: 1.5 = 15 ÷ σ gives σ = 10. Below z = 1.5 lie about 93.3 %. That is where z-table values come from.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: You convert all test scores of a class into z-scores. What mean and standard deviation do the z-scores have?
    params:
      options:
        - label: Mean 0, standard deviation 1 – always
          correct: true
        - label: The z-scores are shifted and squeezed.
          feedback: Die z-Werte sind verschoben und gestaucht.
        - label: The conversion forces 0 and 1.
          feedback: Die Umrechnung erzwingt 0 und 1.
    hints:
      - What happens if you subtract μ from every value?
      - And if you then divide by σ?
    explanation: Minus μ sets the mean to 0, dividing by σ sets the spread to 1. This is called standardising – the shape of the distribution stays the same.
    difficulty: 3

srs:
  cards_from: [rechnen, vergleich]
