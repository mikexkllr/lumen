id: stats.normal.skewed
type: concept
title: When the bell tips over
summary: Skewed distributions and the median.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: form
    widget: buckets
    prompt: Bell-shaped or skewed?
    params:
      buckets: [{ label: bell-shaped }, { label: skewed }]
      items:
        - { label: Height, bucket: bell-shaped }
        - { label: Measurement errors, bucket: bell-shaped }
        - { label: Income, bucket: skewed }
        - { label: Populations of cities, bucket: skewed }
        - { label: Followers on social networks, bucket: skewed }
    hints:
      - Are there a few huge outliers on the high side?
    explanation: With money, cities and followers, there are a few giants and many small ones.

  - kind: problem
    id: dorf
    widget: numeric
    prompt: In a village, 9 people earn 3000 € each and one person earns 300,000 €. What is the mean?
    params: { unit: "€" }
    answer: { value: 32700 }
    hints:
      - Add everything up and divide by 10.
    explanation: "(9 · 3000 + 300,000) ÷ 10 = 32,700 €."

  - kind: explain
    body: |
      A single outlier pulls the **mean** far upward. The **median** – the middle value of the list – stays at 3000 €. For skewed distributions, it describes what is typical better.

  - kind: problem
    id: typisch
    widget: choice
    prompt: What describes the typical income in this village better?
    params:
      options:
        - { label: The median, correct: true }
        - { label: The mean, feedback: "Nobody here earns 32,700 € except one person." }
    hints:
      - What do nine out of ten people earn?
    explanation: That is why income statistics usually report the median.

srs:
  cards_from: [form, typisch]
