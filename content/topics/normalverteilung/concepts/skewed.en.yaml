id: stats.normal.skewed
type: concept
title: When the bell tips over
summary: Skewed distributions and the median.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: form
    widget: buckets
    prompt: Bell-shaped or skewed?
    params:
      buckets: [{ label: bell-shaped }, { label: skewed }]
      items:
        - { label: Height, bucket: bell-shaped }
        - { label: Measurement errors, bucket: bell-shaped }
        - { label: Income, bucket: skewed }
        - { label: Populations of cities, bucket: skewed }
        - { label: Followers on social networks, bucket: skewed }
    hints:
      - Are there a few huge outliers on the high side?
    explanation: With money, cities and followers, there are a few giants and many small ones.

  - kind: problem
    id: dorf
    widget: numeric
    prompt: In a village, 9 people earn 3000 € each and one person earns 300,000 €. What is the mean?
    params: { unit: "€" }
    answer: { value: 32700 }
    hints:
      - Add everything up and divide by 10.
    explanation: "(9 · 3000 + 300,000) ÷ 10 = 32,700 €."

  - kind: explain
    id: s3
    body: |
      A single outlier pulls the **mean** far upward. The **median** – the middle value of the list – stays at 3000 €. For skewed distributions, it describes what is typical better.

  - kind: problem
    id: typisch
    widget: choice
    prompt: What describes the typical income in this village better?
    params:
      options:
        - { label: The median, correct: true }
        - { label: The mean, feedback: "Nobody here earns 32,700 € except one person." }
    hints:
      - What do nine out of ten people earn?
    explanation: That is why income statistics usually report the median.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Waiting times, pay, city sizes: many data have a long tail to the right. Why?"
    params:
      options:
        - label: There is a limit at zero below but none above
          correct: true
        - label: Because of wrong measurement
          feedback: The skew is real.
        - label: Chance
          feedback: There is a clear structural reason.
    hints:
      - Can a waiting time be negative? Can it be very long?
    explanation: Many of these quantities arise from **multiplying** influences. Their logarithm is then normally distributed again.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: How is this quantity usually distributed?
    params:
      buckets:
        - id: b1
          label: Long tail to the right
        - id: b2
          label: Long tail to the left
        - id: b3
          label: Roughly symmetric
      items:
        - label: Income
          bucket: b1
        - label: Waiting time at the doctor
          bucket: b1
        - label: Age at death in rich countries
          bucket: b2
        - label: Scores on a very easy test
          bucket: b2
        - label: Adult height
          bucket: b3
        - label: Errors of a scale
          bucket: b3
    hints:
      - Is there a hard limit below or above?
      - In an easy test many hit the maximum score.
    explanation: "Limits create skew: income cannot go below zero, scores cannot exceed the maximum. With right-skewed data the mean lies above the median."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Values: 10, 100, 1000. The geometric mean is the cube root of the product. What is it?"
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 370
        misconception: arithmetic-mean
        text: That is the arithmetic mean. The 1000 drags it upwards.
    hints:
      - "Product: 10 · 100 · 1000 = 1,000,000."
      - Which number cubed gives a million?
    explanation: ∛1,000,000 = 100. In logs the values sit at 1, 2, 3 – nicely symmetric. For skewed positive data the geometric mean is often the better »typical« value.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain the 68-95-99.7 rule to Lux with an example.
    params:
      keywords:
        - - "68"
        - - "95"
        - - standardabweichung
          - sigma
          - standard deviation
        - - mittelwert
          - mean
          - durchschnitt
          - average
      min: 3
      sample: In a normal distribution about 68% of values lie at most one standard deviation from the mean and 95% at most two. For IQ with mean 100 and σ = 15, 95% thus lie between 70 and 130.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Many small random effects that add up form a bell. What arises when many small random factors multiply – like growth rates?
    params:
      options:
        - label: "A log-normal distribution: right-skewed, its logarithm is bell-shaped"
          correct: true
        - label: Products behave differently from sums.
          feedback: Produkte verhalten sich anders als Summen.
        - label: Repeated multiplying creates skew, not flatness.
          feedback: Wiederholtes Multiplizieren erzeugt Schiefe, keine Gleichheit.
    hints:
      - The logarithm turns a product into a sum.
      - And sums of many random effects become a bell.
    explanation: log(product) = sum of logs → bell. The product itself is log-normally distributed. That fits incomes, city sizes and share prices.
    difficulty: 3

srs:
  cards_from: [form, typisch]
