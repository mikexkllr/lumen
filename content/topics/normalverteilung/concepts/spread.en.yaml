id: stats.normal.spread
type: concept
title: Same average, different spread
summary: Why the mean does not tell you everything.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Steady or wild?
    body: Two archers score 8 points on average. One always hits the 8, the other sometimes 10, sometimes 5. Drag the arrows apart without changing the average. That is what the **standard deviation** measures.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - Arrow 1
          - Arrow 2
          - Arrow 3
          - Arrow 4
          - Arrow 5
        values:
          - 8
          - 8
          - 8
          - 8
          - 8
        editable:
          - 0
          - 1
          - 2
          - 3
          - 4
        min: 0
        max: 10
        show:
          - mean
        title: Points per arrow

  - kind: problem
    id: teams
    widget: choice
    body: "Two teams average 25 years old. Team A: 24, 25, 25, 26. Team B: 18, 22, 28, 32."
    prompt: Which team has more spread?
    params:
      options:
        - { label: Team B, correct: true }
        - { label: Team A, feedback: "In Team A, everyone is at most one year from the average." }
        - { label: Both the same, feedback: "The average is the same – the distances are not." }
    hints:
      - How far are the values from the average of 25?
    explanation: In Team B, ages are up to 7 years from the average.

  - kind: explain
    id: s2
    body: |
      The **spread** says how far values typically lie from the mean. The usual measure is called the **standard deviation**, or σ for short.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: "The values are {{m - d}}, {{m - d}}, {{m + d}} and {{m + d}}. How far is each value from the mean?"
    params: { placeholder: "Distance" }
    answer: { value: "{{d}}" }
    hints:
      - "The mean is {{m}}."
    explanation: "Each value is exactly {{d}} from {{m}} – here σ = {{d}} as well."
    variants:
      params: { m: "int[20,60]", d: "int[2,9]" }
      defaults: { m: 40, d: 5 }

  - kind: problem
    id: saeule
    widget: chart
    prompt: Adjust the last bar so that the mean is exactly 6.
    params:
      labels: [Mon, Tue, Wed, Thu]
      values: [4, 6, 8, 2]
      editable: [3]
      min: 0
      max: 10
      show: [mean]
    answer: { values: [4, 6, 8, 6] }
    hints:
      - All four together must add up to 24.
    explanation: 4 + 6 + 8 + 6 = 24, divided by 4 gives 6.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Two data series can have the same mean and completely different spread.
          right: true
        - text: The standard deviation can be negative.
          right: false
          why: It is a distance – always zero or positive.
        - text: If all values are equal, the standard deviation is zero.
          right: true

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Set the mean to 100. Make the curve so narrow that over 99% lie between 85 and 115.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 99
        - 100
    explanation: "With a spread of 5 or less. A small spread means: almost everyone is close to the mean."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Values: 2, 4, 6. The mean is 4. What is the **variance** – the mean of the squared distances? As a fraction."
    answer:
      value: 8/3
    hints:
      - "Distances −2, 0, +2. Squared: 4, 0, 4."
    explanation: "8 ÷ 3. The standard deviation is its square root: about 1.63."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Values: 4, 8, 6, 2. The mean is 5. What is the variance (mean of squared distances)?"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 20
        misconception: forgot-divide
        text: That is the sum of squares. Now divide by 4.
    hints:
      - "Distances: −1, 3, 1, −3."
      - "Squares: 1 + 9 + 1 + 9 = 20. Divide by 4."
    explanation: 20 ÷ 4 = 5, so σ = √5 ≈ 2.24.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "A sample: 1, 3, 5. The sample standard deviation divides by n − 1. What is it?"
    answer:
      value: 2
    feedback:
      - when: abs(numval(state.input) - 1.633) < 0.01
        misconception: divide-by-n
        text: You divided by n = 3. For samples divide by n − 1 = 2.
    hints:
      - Mean 3, squares 4 + 0 + 4 = 8.
      - 8 ÷ 2 = 4. Take the root.
    explanation: √(8/2) = 2. With n it would be √(8/3) ≈ 1.63 – too small, because the sample mean sits right in the middle of the data.
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: chart
    prompt: Set the four bars so that the mean is 5 and the variance is exactly 8.
    params:
      labels:
        - A
        - B
        - C
        - D
      values:
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      step: 1
      show:
        - mean
    check:
      predicate: avg == 5 && ((values[0] - 5) ** 2 + (values[1] - 5) ** 2 + (values[2] - 5) ** 2 + (values[3] - 5) ** 2) / 4 == 8
    solution:
      state:
        values:
          - 9
          - 5
          - 5
          - 1
    hints:
      - The sum of squares must be 4 · 8 = 32.
      - "Try it with just two bars: one 4 higher, one 4 lower."
    explanation: "For example 9, 5, 5, 1: squares 16 + 0 + 0 + 16 = 32, divided by 4 is 8. Other solutions are possible too."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: For a **sample** the sum of squares is divided by n − 1 instead of n. Why?
    params:
      options:
        - label: The sample mean lies closer to the data than the true one – without correction you underestimate the spread
          correct: true
        - label: Out of tradition
          feedback: There is a mathematical reason.
        - label: Because one value is always measured wrongly
          feedback: It is about the estimated mean, not measurement errors.
    hints:
      - The mean was estimated from the same data.
    explanation: "**Bessel’s correction**. One “degree of freedom” is already used up by the mean."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Temperatures vary with σ = 3 °C. What is σ in Fahrenheit? (°F = 1.8 · °C + 32)
    answer:
      value: 5.4
    feedback:
      - when: numval(state.input) == 37.4
        misconception: shift-changes-sd
        text: The + 32 only shifts all values – it does not touch the spread.
    hints:
      - What does the + 32 do to the distances?
      - Only the factor 1.8 matters.
    explanation: σ(aX + b) = |a| · σ(X) = 1.8 · 3 = 5.4 °F. The variance grows with a² = 3.24.
    difficulty: 3

srs:
  cards_from: [teams, abstand]
