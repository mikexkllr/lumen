id: stats.normal.spread
type: concept
title: Same average, different spread
summary: Why the mean does not tell you everything.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: teams
    widget: choice
    body: "Two teams average 25 years old. Team A: 24, 25, 25, 26. Team B: 18, 22, 28, 32."
    prompt: Which team has more spread?
    params:
      options:
        - { label: Team B, correct: true }
        - { label: Team A, feedback: "In Team A, everyone is at most one year from the average." }
        - { label: Both the same, feedback: "The average is the same – the distances are not." }
    hints:
      - How far are the values from the average of 25?
    explanation: In Team B, ages are up to 7 years from the average.

  - kind: explain
    id: s2
    body: |
      The **spread** says how far values typically lie from the mean. The usual measure is called the **standard deviation**, or σ for short.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: "The values are {{m - d}}, {{m - d}}, {{m + d}} and {{m + d}}. How far is each value from the mean?"
    params: { placeholder: "Distance" }
    answer: { value: "{{d}}" }
    hints:
      - "The mean is {{m}}."
    explanation: "Each value is exactly {{d}} from {{m}} – here σ = {{d}} as well."
    variants:
      params: { m: "int[20,60]", d: "int[2,9]" }
      defaults: { m: 40, d: 5 }

  - kind: problem
    id: saeule
    widget: chart
    prompt: Adjust the last bar so that the mean is exactly 6.
    params:
      labels: [Mon, Tue, Wed, Thu]
      values: [4, 6, 8, 2]
      editable: [3]
      min: 0
      max: 10
      show: [mean]
    answer: { values: [4, 6, 8, 6] }
    hints:
      - All four together must add up to 24.
    explanation: 4 + 6 + 8 + 6 = 24, divided by 4 gives 6.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Two data series can have the same mean and completely different spread.
          right: true
        - text: The standard deviation can be negative.
          right: false
          why: It is a distance – always zero or positive.
        - text: If all values are equal, the standard deviation is zero.
          right: true

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Set the mean to 100. Make the curve so narrow that over 99% lie between 85 and 115.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 99
        - 100
    explanation: "With a spread of 5 or less. A small spread means: almost everyone is close to the mean."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Values: 2, 4, 6. The mean is 4. What is the **variance** – the mean of the squared distances? As a fraction."
    answer:
      value: 8/3
    hints:
      - "Distances −2, 0, +2. Squared: 4, 0, 4."
    explanation: "8 ÷ 3. The standard deviation is its square root: about 1.63."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: For a **sample** the sum of squares is divided by n − 1 instead of n. Why?
    params:
      options:
        - label: The sample mean lies closer to the data than the true one – without correction you underestimate the spread
          correct: true
        - label: Out of tradition
          feedback: There is a mathematical reason.
        - label: Because one value is always measured wrongly
          feedback: It is about the estimated mean, not measurement errors.
    hints:
      - The mean was estimated from the same data.
    explanation: "**Bessel’s correction**. One “degree of freedom” is already used up by the mean."
    difficulty: 3

srs:
  cards_from: [teams, abstand]
