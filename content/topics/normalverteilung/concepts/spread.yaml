id: stats.normal.spread
type: concept
title: Gleicher Schnitt, andere Streuung
summary: Warum der Mittelwert nicht alles sagt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Treffsicher oder wild?
    body: Zwei Bogenschützen haben im Schnitt 8 Punkte. Der eine trifft immer die 8, der andere mal 10, mal 5. Zieh die Pfeile auseinander, ohne dass sich der Schnitt ändert. Das misst die **Standardabweichung**.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - Pfeil 1
          - Pfeil 2
          - Pfeil 3
          - Pfeil 4
          - Pfeil 5
        values:
          - 8
          - 8
          - 8
          - 8
          - 8
        editable:
          - 0
          - 1
          - 2
          - 3
          - 4
        min: 0
        max: 10
        show:
          - mean
        title: Punkte pro Pfeil

  - kind: problem
    id: teams
    widget: choice
    body: "Zwei Teams sind im Schnitt 25 Jahre alt. Team A: 24, 25, 25, 26. Team B: 18, 22, 28, 32."
    prompt: Welches Team streut stärker?
    params:
      options:
        - { label: Team B, correct: true }
        - { label: Team A, feedback: "In Team A liegen alle höchstens ein Jahr vom Schnitt weg." }
        - { label: Beide gleich, feedback: "Der Schnitt ist gleich – die Abstände nicht." }
    hints:
      - Wie weit liegen die Werte vom Schnitt 25 weg?
    explanation: In Team B liegen die Alter bis zu 7 Jahre vom Schnitt entfernt.

  - kind: explain
    id: s2
    body: |
      Die **Streuung** sagt, wie weit Werte typischerweise vom Mittelwert entfernt sind. Das übliche Maß heißt **Standardabweichung**, kurz σ.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: "Die Werte sind {{m - d}}, {{m - d}}, {{m + d}} und {{m + d}}. Wie weit liegt jeder Wert vom Mittelwert entfernt?"
    params: { placeholder: "Abstand" }
    answer: { value: "{{d}}" }
    hints:
      - "Der Mittelwert ist {{m}}."
    explanation: "Jeder Wert liegt genau {{d}} von {{m}} entfernt – hier ist auch σ = {{d}}."
    variants:
      params: { m: "int[20,60]", d: "int[2,9]" }
      defaults: { m: 40, d: 5 }

  - kind: problem
    id: saeule
    widget: chart
    prompt: Stell die letzte Säule so ein, dass der Mittelwert genau 6 ist.
    params:
      labels: [Mo, Di, Mi, Do]
      values: [4, 6, 8, 2]
      editable: [3]
      min: 0
      max: 10
      show: [mean]
    answer: { values: [4, 6, 8, 6] }
    hints:
      - Alle vier zusammen müssen 24 ergeben.
    explanation: 4 + 6 + 8 + 6 = 24, geteilt durch 4 ergibt 6.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Zwei Datenreihen können denselben Mittelwert und völlig verschiedene Streuung haben.
          right: true
        - text: Die Standardabweichung kann negativ sein.
          right: false
          why: Sie ist ein Abstand – immer null oder positiv.
        - text: Sind alle Werte gleich, ist die Standardabweichung null.
          right: true

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Stell den Mittelwert auf 100. Mach die Kurve so schmal, dass über 99 % zwischen 85 und 115 liegen.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 99
        - 100
    explanation: "Mit einer Streuung von 5 oder weniger. Kleine Streuung heißt: Fast alle liegen nah am Schnitt."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Werte: 2, 4, 6. Der Mittelwert ist 4. Wie groß ist die **Varianz** – der Mittelwert der quadrierten Abstände? Als Bruch."
    answer:
      value: 8/3
    hints:
      - "Abstände −2, 0, +2. Quadriert: 4, 0, 4."
    explanation: "8 : 3. Die Standardabweichung ist die Wurzel daraus: etwa 1,63."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Werte: 4, 8, 6, 2. Der Mittelwert ist 5. Wie groß ist die Varianz (Mittel der quadrierten Abstände)?"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 20
        misconception: forgot-divide
        text: Das ist die Summe der Quadrate. Teile noch durch 4.
    hints:
      - "Abstände: −1, 3, 1, −3."
      - "Quadrate: 1 + 9 + 1 + 9 = 20. Teile durch 4."
    explanation: "20 : 4 = 5, also σ = √5 ≈ 2,24."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: "Eine **Stichprobe**: 1, 3, 5. Die Stichproben-Standardabweichung teilt durch n − 1. Wie groß ist sie?"
    answer:
      value: 2
    feedback:
      - when: abs(numval(state.input) - 1.633) < 0.01
        misconception: divide-by-n
        text: Du hast durch n = 3 geteilt. Bei Stichproben teilt man durch n − 1 = 2.
    hints:
      - Mittelwert 3, Quadrate 4 + 0 + 4 = 8.
      - "8 : 2 = 4. Zieh die Wurzel."
    explanation: √(8/2) = 2. Mit n wären es √(8/3) ≈ 1,63 – zu klein, weil der Stichproben-Mittelwert genau in der Mitte der Daten liegt.
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: chart
    prompt: Stell die vier Säulen so ein, dass der Mittelwert 5 und die Varianz genau 8 ist.
    params:
      labels:
        - A
        - B
        - C
        - D
      values:
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      step: 1
      show:
        - mean
    check:
      predicate: avg == 5 && ((values[0] - 5) ** 2 + (values[1] - 5) ** 2 + (values[2] - 5) ** 2 + (values[3] - 5) ** 2) / 4 == 8
    solution:
      state:
        values:
          - 9
          - 5
          - 5
          - 1
    hints:
      - Die Summe der Quadrate muss 4 · 8 = 32 sein.
      - "Probier es mit nur zwei Säulen: eine 4 höher, eine 4 tiefer."
    explanation: "Zum Beispiel 9, 5, 5, 1: Quadrate 16 + 0 + 0 + 16 = 32, geteilt durch 4 ist 8. Auch andere Lösungen sind möglich."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei einer **Stichprobe** teilt man die Summe der Quadrate durch n − 1 statt durch n. Warum?
    params:
      options:
        - label: Der Stichproben-Mittelwert liegt den Daten näher als der wahre – ohne Korrektur unterschätzt man die Streuung
          correct: true
        - label: Aus Tradition
          feedback: Es hat einen mathematischen Grund.
        - label: Weil ein Wert immer falsch gemessen ist
          feedback: Es geht um den geschätzten Mittelwert, nicht um Messfehler.
    hints:
      - Der Mittelwert wurde aus denselben Daten geschätzt.
    explanation: Die **Bessel-Korrektur**. Ein »Freiheitsgrad« ist durch den Mittelwert schon verbraucht.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Temperaturen schwanken mit σ = 3 °C. Wie groß ist σ in Fahrenheit? (°F = 1,8 · °C + 32)
    answer:
      value: 5.4
    feedback:
      - when: numval(state.input) == 37.4
        misconception: shift-changes-sd
        text: Die + 32 verschiebt nur alle Werte – die Streuung bleibt davon unberührt.
    hints:
      - Was macht die + 32 mit den Abständen?
      - Nur der Faktor 1,8 zählt.
    explanation: σ(aX + b) = |a| · σ(X) = 1,8 · 3 = 5,4 °F. Die Varianz wächst dabei mit a² = 3,24.
    difficulty: 3

srs:
  cards_from: [teams, abstand]
