id: stats.normal.rule
type: concept
title: The 68-95-99.7 rule
summary: What is typical and what is rare.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One rule for everything
    body: IQ tests, shoe sizes, measurement errors – the same rule of thumb applies everywhere. The mean here is 100. Set the **spread** σ to 15 and read off how much lies between 85 and 115. Remember that number.
    visual:
      widget: sim
      interactive: true
      params:
        scene: normal
        controls:
          mean:
            value: 100
            fixed: true

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of adults are taller than two standard deviations above average?"
    params:
      min: 0
      max: 50
      unit: "%"
    answer:
      value: 2.5
      tolerance: 2
    explanation: Only about 2.5%. The tails of the bell are very thin.

  - kind: explain
    id: s1
    body: |
      For a **normal distribution**, this rule of thumb applies: **68%** lie within 1 σ of the mean, **95%** within 2 σ and **99.7%** within 3 σ.

  - kind: problem
    id: iq
    widget: numeric
    prompt: IQ scores have a mean of 100 and σ = 15. What percentage lie between 70 and 130?
    params: { unit: "%" }
    answer: { value: 95 }
    feedback:
      - when: "numval(state.input) == 68"
        misconception: one-sigma
        text: 70 and 130 are two σ from the mean, not one.
    hints:
      - How many σ is 30 points?
    explanation: 30 points is 2 σ – so about 95%.

  - kind: problem
    id: oben
    widget: numeric
    prompt: What percentage then have an IQ above 130?
    params: { unit: "%" }
    answer: { value: 2.5 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: both-tails
        text: 5% lie outside – but split between both sides.
    hints:
      - 5% lie outside, half below and half above.
    explanation: 100 − 95 = 5%, half of that above – 2.5%.

  - kind: problem
    id: selten
    widget: buckets
    prompt: Mean 100, σ = 15. Common or very rare?
    params:
      buckets: [{ label: common }, { label: very rare }]
      items:
        - { label: "110", bucket: common }
        - { label: "92", bucket: common }
        - { label: "149", bucket: very rare }
        - { label: "52", bucket: very rare }
    hints:
      - How many σ is the value from the mean?
    explanation: 149 and 52 are more than 3 σ away – that happens less than 3 times in 1000.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: The mean is 100. Set the spread σ so that about 95 % lie between 70 and 130.
    params:
      scene: normal
      interval:
        - 70
        - 130
      controls:
        mean:
          value: 100
          fixed: true
    answer:
      share:
        - 95
        - 96
    hints:
      - 95 % lie within two standard deviations.
      - From 100 to 130 is 30 – that should be 2 σ.
    explanation: With σ = 15, 95 % lie between 70 and 130 – two σ on each side.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: The bell sits at μ = 100. Find the spread at which fairly exactly **68%** lie between 85 and 115.
    params:
      scene: normal
      controls:
        mean:
          value: 100
          fixed: true
        sd:
          value: 28
    answer:
      share:
        - 67.5
        - 69
    explanation: At σ = 15. Then 85 and 115 are exactly one standard deviation from the mean.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Normal distribution: what percent of the values lie above μ + {{k}}σ? Use the 68-95-99.7 rule."
    answer:
      value: "{{k == 1 ? 16 : (k == 2 ? 2.5 : 0.15)}}"
      tolerance: 0.05
    hints:
      - "Within {{k}}σ lie {{k == 1 ? 68 : (k == 2 ? 95 : 99.7)}} %."
      - The rest splits evenly between both sides.
    explanation: "(100 − {{k == 1 ? 68 : (k == 2 ? 95 : 99.7)}}) ÷ 2 = {{k == 1 ? 16 : (k == 2 ? 2.5 : 0.15)}} %. The bell is symmetric."
    difficulty: 2
    variants:
      params:
        k: int[1,3]
      defaults:
        k: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: what percent of the values lie further than one standard deviation from the mean?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 32
      tolerance: 4
    explanation: 100 − 68 = 32 %. Almost one value in three lies outside ± 1σ – perfectly normal.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "A manufacturer works to “Six Sigma”: defects only lie beyond 6 standard deviations. At 3 σ there is still 0.3% scrap. How many defective parts per **million** is 0.3%?"
    answer:
      value: 3000
    hints:
      - 0.3% of 1,000,000.
    explanation: 3000 per million. At 6 σ it is only 3.4 – the tails fall off extremely fast.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Without a bell curve, Chebyshev helps: at least the share 1 − 1/k² lies within k σ. At least what percent is that for k = 3? To one decimal."
    answer:
      value: 88.9
      tolerance: 0.1
    hints:
      - 1/k² = 1/9.
      - 1 − 1/9 = 8/9.
    explanation: At least 88.9 % – for every distribution. For the bell it is 99.7 %. So the rule of thumb only holds when the data really are normal.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Statisticians often say »95 % lie within 1.96 σ« instead of »within 2 σ«. Why?
    params:
      options:
        - label: 2 σ actually covers 95.4 %; exactly 95 % needs 1.96 σ
          correct: true
        - label: The rule is just rounded, not wrong.
          feedback: Die Faustregel ist nur gerundet, nicht falsch.
        - label: That is a different correction.
          feedback: Das ist eine andere Korrektur.
    hints:
      - The 68-95-99.7 rule is rounded.
      - Where is the limit for exactly 95 %?
    explanation: "Exactly: ± 1 σ → 68.3 %, ± 1.96 σ → 95.0 %, ± 2 σ → 95.4 %, ± 3 σ → 99.7 %. Confidence intervals use 1.96."
    difficulty: 3

srs:
  cards_from: [iq, oben]
