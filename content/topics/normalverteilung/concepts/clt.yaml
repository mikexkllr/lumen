id: stats.normal.clt
type: concept
title: "Warum die Glocke überall ist"
summary: "Der zentrale Grenzwertsatz: Aus vielen kleinen Zufällen wird eine Glocke."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: numeric
    prompt: Bei einem Würfel ist jede Zahl gleich häufig. Du wirfst **zwei** Würfel und addierst. Welche Summe kommt am häufigsten?
    answer:
      value: 7
    hints:
      - "Zähl die Wege: 1 + 6, 2 + 5, 3 + 4 …"
    explanation: Sechs Wege führen zur 7, aber nur einer zur 2. Die Mitte gewinnt.

  - kind: explain
    id: c2
    body: "Ein Würfel ist flach verteilt. Die Summe von zweien bildet ein Dreieck. Bei vielen Würfeln wird daraus eine Glocke. Das ist der **zentrale Grenzwertsatz**: Summen vieler Zufälle sind fast normalverteilt."

  - kind: problem
    id: c3
    widget: order
    prompt: Ordne von »flach« bis »fast perfekte Glocke«.
    params:
      items:
        - label: Augenzahl eines Würfels
        - label: Summe von 2 Würfeln
        - label: Summe von 5 Würfeln
        - label: Summe von 30 Würfeln
    hints:
      - Je mehr Würfel, desto runder.
    explanation: Schon ab etwa 30 Summanden ist die Glocke kaum noch von der echten zu unterscheiden.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Entsteht der Wert als Summe vieler kleiner Zufälle?
    params:
      buckets:
        - id: b1
          label: Glocke zu erwarten
        - id: b2
          label: Keine Glocke
      items:
        - label: Körpergröße
          bucket: b1
        - label: Messfehler einer Waage
          bucket: b1
        - label: Einkommen
          bucket: b2
        - label: Ein einzelner Würfelwurf
          bucket: b2
        - label: Schnitt aus 50 Messungen
          bucket: b1
    hints:
      - Viele kleine, unabhängige Einflüsse – oder wenige große?
    explanation: Größe hängt an vielen Genen. Einkommen wächst eher durch Malnehmen – das ergibt eine schiefe Kurve.

  - kind: problem
    id: c5
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der Mittelwert vieler unabhängiger Zufallswerte ist annähernd [[normalverteilt]] – egal, wie die einzelnen Werte [[verteilt]] sind.
      distractors:
        - gleichverteilt
        - sortiert

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Streuung eines Mittelwerts schrumpft mit der Wurzel aus n. Eine Messung streut um 10. Wie stark streut der Mittelwert aus 100 Messungen?
    answer:
      value: 1
    hints:
      - 10 geteilt durch √100.
    explanation: "10 : 10 = 1. Hundert Messungen machen zehnmal so genau."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: sim
    prompt: "Ein einzelner IQ streut mit 15 um 100. Der Schnitt einer Klasse von 25 streut nur mit 15 : √25. Stell die Kurve für Klassen-Schnitte ein."
    params:
      scene: normal
    answer:
      mean: 100
      sd: 3
    explanation: Streuung 3 statt 15. Darum sind Schnitte von Gruppen viel stabiler als einzelne Werte.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Du willst die Streuung deines Mittelwerts **halbieren**. Wie viel mal so viele Messungen brauchst du?
    answer:
      value: 4
    hints:
      - Die Wurzel aus welcher Zahl ist 2?
    explanation: "Viermal so viele. Genauigkeit ist teuer: doppelt so genau kostet das Vierfache."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wann versagt der zentrale Grenzwertsatz?
    params:
      options:
        - label: Wenn einzelne Werte riesig sein können oder alle voneinander abhängen
          correct: true
        - label: Wenn man sehr viele Werte addiert
          feedback: Gerade dann wirkt er am besten.
        - label: Wenn die Einzelwerte nicht glockenförmig sind
          feedback: Das ist gerade der Clou – es darf jede Form sein.
    hints:
      - "Denk an Börsencrashs: selten, riesig, und alle Kurse fallen zugleich."
    explanation: Finanzmodelle mit Glockenkurven haben Crashs stark unterschätzt. Extreme Werte brauchen andere Mathematik.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Eine Umfrage mit 400 Befragten hat eine Fehlerspanne von etwa 5 %. Wie viele Befragte braucht man für 2,5 %?
    answer:
      value: 1600
    hints:
      - Halbe Spanne heißt vierfache Menge.
    explanation: 4 · 400 = 1600. Darum befragen Institute selten mehr als ein paar Tausend.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum so viele Dinge in der Natur glockenförmig verteilt sind.
    params:
      keywords:
        - - viele
          - many
        - - klein
          - small
          - einflüsse
          - einfluss
          - influence
          - faktor
          - factor
        - - summe
          - addier
          - sum
          - add
          - zusammen
          - together
        - - glocke
          - normal
          - bell
      min: 3
      sample: Viele Größen entstehen als Summe aus vielen kleinen, unabhängigen Einflüssen. Addiert man solche Zufälle, gleichen sich Ausreißer aus – übrig bleibt eine Glocke.
    difficulty: 3

srs:
  cards_from: ["c1", "d1", "d3"]
