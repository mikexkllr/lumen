id: stats.normal.clt
type: concept
title: "Why the bell is everywhere"
summary: "The central limit theorem: many small chances add up to a bell."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: problem
    id: c1
    widget: numeric
    prompt: With one die every number is equally frequent. You roll **two** dice and add. Which sum comes up most often?
    answer:
      value: 7
    hints:
      - "Count the ways: 1 + 6, 2 + 5, 3 + 4 …"
    explanation: Six ways lead to 7 but only one to 2. The middle wins.

  - kind: explain
    id: c2
    body: "One die is flat. The sum of two forms a triangle. With many dice it becomes a bell. That is the **central limit theorem**: sums of many chances are almost normal."

  - kind: problem
    id: c3
    widget: order
    prompt: Order from “flat” to “almost perfect bell”.
    params:
      items:
        - label: Number on one die
        - label: Sum of 2 dice
        - label: Sum of 5 dice
        - label: Sum of 30 dice
    hints:
      - The more dice, the rounder.
    explanation: From about 30 terms on the bell can hardly be told from the real one.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Does the value arise as a sum of many small chances?
    params:
      buckets:
        - id: b1
          label: Bell expected
        - id: b2
          label: No bell
      items:
        - label: Body height
          bucket: b1
        - label: Errors of a scale
          bucket: b1
        - label: Income
          bucket: b2
        - label: A single die roll
          bucket: b2
        - label: Mean of 50 readings
          bucket: b1
    hints:
      - Many small independent influences – or a few big ones?
    explanation: Height depends on many genes. Income grows rather by multiplying – that gives a skewed curve.

  - kind: problem
    id: c5
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The mean of many independent random values is roughly [[normal]] – no matter how the single values are [[spread]].
      distractors:
        - uniform
        - sorted

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The spread of a mean shrinks with the square root of n. One reading has a spread of 10. What is the spread of the mean of 100 readings?
    answer:
      value: 1
    hints:
      - 10 divided by √100.
    explanation: 10 ÷ 10 = 1. A hundred readings make it ten times as precise.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: sim
    prompt: A single IQ spreads by 15 around 100. The mean of a class of 25 spreads only by 15 ÷ √25. Set the curve for class means.
    params:
      scene: normal
    answer:
      mean: 100
      sd: 3
    explanation: Spread 3 instead of 15. That is why group means are far more stable than single values.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: You want to **halve** the spread of your mean. How many times as many readings do you need?
    answer:
      value: 4
    hints:
      - The square root of which number is 2?
    explanation: "Four times as many. Precision is costly: twice as precise costs four times as much."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: distribution
    prompt: Two four-sided dice (1–4) are added. Throw at least 100 times and see what shape appears.
    params:
      items:
        - label: "2"
          weight: 1
        - label: "3"
          weight: 2
        - label: "4"
          weight: 3
        - label: "5"
          weight: 4
        - label: "6"
          weight: 3
        - label: "7"
          weight: 2
        - label: "8"
          weight: 1
    check:
      predicate: draws >= 100
    hints:
      - Use the button for 100 throws.
      - Compare the middle with the edges.
    explanation: "A triangle: 5 comes up in 4 ways, 2 and 8 in only one. With more dice the triangle turns into a bell."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: With the two four-sided dice, how likely is a total of 5? As a fraction.
    answer:
      value: 1/4
    hints:
      - There are 4 · 4 = 16 equally likely pairs.
      - "Total 5: (1,4), (2,3), (3,2), (4,1)."
    explanation: 4 of 16 = 1/4. The middle gets the most paths – the seed of the bell.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: When does the central limit theorem fail?
    params:
      options:
        - label: When single values can be huge or all depend on one another
          correct: true
        - label: When you add very many values
          feedback: That is exactly when it works best.
        - label: When the single values are not bell-shaped
          feedback: That is the very point – any shape will do.
    hints:
      - "Think of stock crashes: rare, huge, and all prices fall together."
    explanation: Financial models with bell curves badly underestimated crashes. Extreme values need different mathematics.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A poll of 400 people has a margin of error of about 5%. How many people are needed for 2.5%?
    answer:
      value: 1600
    hints:
      - Half the margin means four times the number.
    explanation: 4 · 400 = 1600. That is why pollsters rarely ask more than a few thousand.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why so many things in nature follow a bell curve.
    params:
      keywords:
        - - viele
          - many
        - - klein
          - small
          - einflüsse
          - einfluss
          - influence
          - faktor
          - factor
        - - summe
          - addier
          - sum
          - add
          - zusammen
          - together
        - - glocke
          - normal
          - bell
      min: 3
      sample: Many quantities arise as the sum of many small, independent influences. If you add such chances, outliers cancel out – what remains is a bell.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: You roll 100 ordinary dice and add them. Each has variance 35/12. What is the standard deviation of the total? To one decimal.
    answer:
      value: 17.1
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 171) < 1
        misconception: add-sd
        text: Standard deviations do not add. Add the variances, then take the root.
    hints:
      - "Variances add up: 100 · 35/12 ≈ 291.7."
      - Take the square root of 291.7.
    explanation: √291.7 ≈ 17.1. So with 95 % the total lies between about 316 and 384 – around 350. The central limit theorem makes this prediction possible.
    difficulty: 3

srs:
  cards_from: ["c1", "d1", "d3"]
