id: stats.normal.zscore
type: concept
title: Der z-Wert
summary: Äpfel mit Birnen vergleichen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Wer ragt mehr heraus: jemand mit 2,05 m Körpergröße oder jemand mit Schuhgröße 43?"
    params:
      options:
        - label: Die Person mit 2,05 m
          correct: true
        - label: Die Schuhgröße 43
          feedback: Die ist ganz gewöhnlich.
        - label: Das kann man nicht vergleichen
          feedback: Doch – am Abstand vom Üblichen.
    hints:
      - Was ist weiter weg vom Üblichen?
    explanation: Den Abstand vom Üblichen kann man als Zahl messen.


  - kind: explain
    id: s1
    body: |
      Der **z-Wert** zählt, wie viele Standardabweichungen ein Wert vom Mittelwert entfernt ist: $z = \frac{x - \mu}{\sigma}$. So vergleicht man Werte aus ganz verschiedenen Tests.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Mittelwert {{m}}, σ = {{s}}. Welchen z-Wert hat {{m + k * s}}?
    params: { placeholder: "z" }
    answer: { value: "{{k}}" }
    hints:
      - "Abstand zum Mittelwert geteilt durch {{s}}."
    explanation: "({{m + k * s}} − {{m}}) : {{s}} = {{k}}."
    variants:
      params: { m: "int[50,80]", s: "int[4,12]", k: "int[-2,3]" }
      constraints: ["k != 0"]
      defaults: { m: 60, s: 8, k: 2 }

  - kind: problem
    id: vergleich
    widget: choice
    body: "Anna hat in Mathe 80 Punkte – Schnitt 70, σ = 5. Ben hat in Deutsch 85 Punkte – Schnitt 80, σ = 10."
    prompt: Wer war im Vergleich zur eigenen Klasse besser?
    params:
      options:
        - { label: Anna, correct: true }
        - { label: Ben, feedback: "Ben hat mehr Punkte – aber seine Klasse auch. Rechne die z-Werte." }
        - { label: Beide gleich, feedback: "Beide liegen über dem Schnitt, aber unterschiedlich weit." }
    hints:
      - Anna liegt 10 Punkte über dem Schnitt, das sind wie viele σ?
    explanation: Anna hat z = 2, Ben nur z = 0,5.

  - kind: problem
    id: zurueck
    widget: numeric
    prompt: Mittelwert 50, σ = 8. Welcher Wert hat z = {{z}}?
    params: { placeholder: "Wert" }
    answer: { value: "{{50 + 8 * z}}" }
    hints:
      - "{{z}}-mal σ zum Mittelwert dazu."
    explanation: "50 + {{z}} · 8 = {{50 + 8 * z}}."
    variants:
      params: { z: "int[1,3]" }
      defaults: { z: 2 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Anna hat in Mathe 82 Punkte (Schnitt 70, σ = 8) und in Deutsch 78 Punkte (Schnitt 72, σ = 3). In welchem Fach ist ihr z-Wert höher? Gib den höheren z-Wert an.
    answer:
      value: 2
    hints:
      - "Mathe: 12 : 8. Deutsch: 6 : 3."
    explanation: "Deutsch: z = 2 gegen 1,5 in Mathe. Weniger Punkte, aber weiter über dem Feld."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Messwert hat z = 5. Was sagt das?
    params:
      options:
        - label: Bei einer Normalverteilung wäre das rund 1 zu 3,5 Millionen – vermutlich ein Fehler oder eine Entdeckung
          correct: true
        - label: Der Wert ist fünfmal so groß wie der Mittelwert
          feedback: z zählt Standardabweichungen, nicht Vielfache.
        - label: Das ist ganz gewöhnlich
          feedback: 99,7 % liegen schon innerhalb von 3 σ.
    hints:
      - Wie viel liegt außerhalb von 3 σ? Und 5 σ ist viel weiter draußen.
    explanation: In der Teilchenphysik gilt erst »5 Sigma« als Entdeckung – so beim Higgs-Teilchen 2012.
    difficulty: 3

srs:
  cards_from: [rechnen, vergleich]
