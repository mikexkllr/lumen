id: math.growth.howlong
type: concept
title: How often to double?
summary: The question behind the logarithm.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: tausend
    widget: numeric
    prompt: How many times do you have to double 1 to get above 1000?
    params: { unit: "times" }
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) == 500"
        misconception: linear
        text: Doubling means multiplying. 2, 4, 8, 16 … count the steps.
    hints:
      - 2, 4, 8, 16, 32, 64, 128, 256, 512, …
    explanation: $2^{10} = 1024$, after 10 doublings.

  - kind: explain
    body: |
      The **logarithm** answers the question “how often to double?”. Rule of thumb: ten doublings are about times a thousand.
      Twenty are about times a million.

  - kind: problem
    id: million
    widget: choice
    prompt: A message is shared twice as often every hour. At first 2 people see it. When do over a million see it?
    params:
      options:
        - { label: After about 19 hours, correct: true }
        - { label: "After about 500,000 hours", feedback: "That would be linear. Doubling is much faster." }
        - { label: After about 3 hours, feedback: "After 3 hours, it is only 16." }
    hints:
      - Ten doublings are about times 1000.
    explanation: Twenty doublings are about a million. Starting from 2, 19 are enough.

  - kind: problem
    id: verdopplungen
    widget: numeric
    prompt: How many doublings does it take to get from 1 to {{z}}?
    params: { unit: doublings }
    answer: { value: "{{n}}" }
    hints:
      - "Count: 2, 4, 8 … up to {{z}}."
    explanation: "$2^{ {{n}} } = {{z}}$."
    variants:
      params: { n: "int[4,12]" }
      derive: { z: "2 ** n" }
      defaults: { n: 6 }

srs:
  cards_from: [tausend, verdopplungen]
