id: math.growth.howlong
type: concept
title: How often to double?
summary: The question behind the logarithm.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: tausend
    widget: numeric
    prompt: How many times do you have to double 1 to get above 1000?
    params: { unit: "times" }
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) == 500"
        misconception: linear
        text: Doubling means multiplying. 2, 4, 8, 16 … count the steps.
    hints:
      - 2, 4, 8, 16, 32, 64, 128, 256, 512, …
    explanation: $2^{10} = 1024$, after 10 doublings.

  - kind: explain
    id: s2
    body: |
      The **logarithm** answers the question “how often to double?”. Rule of thumb: ten doublings are about times a thousand.
      Twenty are about times a million.

  - kind: problem
    id: million
    widget: choice
    prompt: A message is shared twice as often every hour. At first 2 people see it. When do over a million see it?
    params:
      options:
        - { label: After about 19 hours, correct: true }
        - { label: "After about 500,000 hours", feedback: "That would be linear. Doubling is much faster." }
        - { label: After about 3 hours, feedback: "After 3 hours, it is only 16." }
    hints:
      - Ten doublings are about times 1000.
    explanation: Twenty doublings are about a million. Starting from 2, 19 are enough.

  - kind: problem
    id: verdopplungen
    widget: numeric
    prompt: How many doublings does it take to get from 1 to {{z}}?
    params: { unit: doublings }
    answer: { value: "{{n}}" }
    hints:
      - "Count: 2, 4, 8 … up to {{z}}."
    explanation: "$2^{ {{n}} } = {{z}}$."
    variants:
      params: { n: "int[4,12]" }
      derive: { z: "2 ** n" }
      defaults: { n: 6 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Ten doublings are about times a [[thousand]], twenty about times a [[million]]. The question “how often?” is answered by the [[logarithm]].
      distractors:
        - hundred
        - exponent

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A sheet is 0.1 mm thick. How often must you fold it until the stack is taller than 100 m?
    answer:
      value: 20
    hints:
      - 100 m is 1,000,000 times 0.1 mm.
    explanation: 2²⁰ ≈ 1,048,576 – after 20 folds it would be about 105 m.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "At 5% growth per year: after how many years has the value more than doubled for the first time?"
    params:
      scene: growth
    answer:
      rate: 5
      factor:
        - 2
        - 2.1
    explanation: After 15 years. The rule of 72 says 72 ÷ 5 ≈ 14.4.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: Someone thinks of a number from 1 to {{2 ** k}}. You may only ask yes–no questions. How many do you need at most if you ask cleverly?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 ** k / 2
        misconception: linear-search
        text: That is roughly what guessing one by one costs. Halve every time instead.
    hints:
      - "Ask: »Is it bigger than the middle?« That halves the options."
      - How many halvings down to 1?
    explanation: $\log_2 {{2 ** k}} = {{k}}$ questions. For a million numbers 20 are enough. This is how a computer searches sorted lists – **binary search**.
    difficulty: 2
    variants:
      params:
        k: int[4,20]
      defaults:
        k: 10

  - kind: explain
    id: mb-d2
    depth: 2
    body: "The logarithm is the **inverse** of raising to a power: from $2^n = z$ it follows that $n = \\log_2 z$. Since $2^{10} = 1024$, $\\log_2 1000 \\approx 9.97$ – just under 10."

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "At 5% interest: after how many whole years has money grown **tenfold**? (Doubling every 14.2 years; 10 ≈ 2^3.32)"
    answer:
      value: 48
      tolerance: 1
    hints:
      - 3.32 doublings times 14.2 years.
    explanation: ≈ 47.2 years, so in year 48. The logarithm converts factors into time.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: order
    prompt: Order by growth for very large n, slowest first.
    params:
      items:
        - label: log₂ n
        - label: √n
        - label: n
        - label: n · log₂ n
        - label: n²
        - label: 2ⁿ
        - label: n!
    hints:
      - Put n = 1024 in and compare.
      - 2ⁿ beats every power, n! beats even 2ⁿ.
    explanation: "At n = 1024: 10, 32, 1024, 10,240, just over a million, a number with 309 digits – and n! is far bigger. These **orders of growth** decide whether a program runs for seconds or millennia."
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "One sorting method needs n² steps, another n · log₂ n. For n = 1024: how many times faster is the second one?"
    answer:
      value: 102.4
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 10
        misconception: log-only
        text: That is log₂ 1024. Divide n² by n · log₂ n.
    hints:
      - n² / (n · log₂ n) = n / log₂ n.
      - log₂ 1024 = 10.
    explanation: 1024 / 10 = 102.4 times faster. With a million items it would be about 50,000 times.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why binary search in a million names needs only 20 steps.
    params:
      keywords:
        - - halb
          - hälfte
          - halbier
          - half
          - halv
        - - 2 hoch 20
          - 2^20
          - million
          - "1024"
          - tausend
        - - logarithmus
          - log
          - verdopp
          - logarithm
          - doubl
      sample: Each comparison with the middle halves the list. After 10 steps a thousandth is left, after 20 a millionth. Since 2 to the 20 is about a million, the base-2 logarithm of a million, 20, is enough.
    explanation: Halving is doubling backwards. That is why the logarithm counts the steps.
    difficulty: 3

srs:
  cards_from: [tausend, verdopplungen]
