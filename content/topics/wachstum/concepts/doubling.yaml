id: math.growth.doubling
type: concept
title: Die Macht des Verdoppelns
summary: Linear addiert, exponentiell multipliziert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Eine Bakterie teilt sich alle 20 Minuten. Wie viele sind es nach 10 Stunden?"
    params:
      min: 100
      max: 1000000000000
      scale: log
    answer:
      value: 1000000000
      within: 90
    explanation: "30 Verdopplungen: 2³⁰ ≈ 1 Milliarde. Unser Gefühl denkt linear und liegt fast immer weit daneben."

  - kind: problem
    id: seerosen
    widget: choice
    prompt: Seerosen verdoppeln ihre Fläche jeden Tag. Nach 30 Tagen ist der Teich voll. Wann war er halb voll?
    params:
      layout: grid
      options:
        - { label: Am Tag 29, correct: true }
        - { label: Am Tag 15, feedback: "Das wäre bei gleichmäßigem Wachstum so. Hier verdoppelt sich aber alles." }
        - { label: Am Tag 20, feedback: "Denk rückwärts. Was war einen Tag vor »voll«?" }
        - { label: Am Tag 25, feedback: "Am Tag 25 war erst ein Zweiunddreißigstel bedeckt." }
    hints:
      - Rechne rückwärts – vom vollen Teich einen Tag zurück.
    explanation: Einen Tag vor »voll« war es die Hälfte. Exponentielles Wachstum passiert am Ende fast schlagartig.

  - kind: explain
    id: s2
    body: |
      **Lineares** Wachstum addiert jedes Mal gleich viel.
      **Exponentielles** Wachstum multipliziert jedes Mal mit demselben Faktor.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Linear oder exponentiell? Ordne zu.
    params:
      buckets: [{ label: linear }, { label: exponentiell }]
      items:
        - { label: Jeden Monat 50 € mehr sparen, bucket: linear }
        - { label: Bakterien teilen sich jede Stunde, bucket: exponentiell }
        - { label: Eine Kerze brennt 1 cm pro Stunde ab, bucket: linear }
        - { label: Clip-Aufrufe verdoppeln sich täglich, bucket: exponentiell }
        - { label: Taxi kostet 2 € pro Kilometer, bucket: linear }
        - { label: Guthaben mit 5 % Zinsen pro Jahr, bucket: exponentiell }
    hints:
      - Kommt jedes Mal gleich viel dazu – oder wird malgenommen?
    explanation: Fester Betrag pro Schritt ist linear. Fester Faktor pro Schritt ist exponentiell.

  - kind: problem
    id: bakterien
    widget: numeric
    prompt: Eine Kultur hat {{s}} Zellen und verdoppelt sich jede Stunde. Wie viele sind es nach {{h}} Stunden?
    params: { unit: Zellen }
    answer: { value: "{{s * 2 ** h}}" }
    feedback:
      - when: "numval(state.input) == s * 2 * h"
        misconception: linear-thinking
        text: Das wäre lineares Wachstum. Jede Stunde wird verdoppelt, nicht nur mal 2 genommen.
    hints:
      - "Nach 1 Stunde: {{s * 2}}. Nach 2 Stunden: {{s * 4}} …"
    explanation: "{{s}} · $2^{ {{h}} }$ = {{s * 2 ** h}}."
    variants:
      params: { s: "choice[100,250,500]", h: "int[3,6]" }
      defaults: { s: 100, h: 5 }

  - kind: explain
    id: s5
    body: Wie lange dauert das Verdoppeln bei 7 % Wachstum pro Jahr?
    reveal:
      body: Etwa 10 Jahre. Die **70er-Regel** – 70 geteilt durch den Prozentsatz ergibt ungefähr die Verdopplungszeit.

  - kind: problem
    id: siebziger
    widget: numeric
    prompt: Nutze die 70er-Regel. Nach wie vielen Jahren verdoppelt sich etwas bei {{p}} % Wachstum pro Jahr?
    params: { unit: Jahre }
    answer: { value: "{{70 / p}}", tolerance: 0.5 }
    hints:
      - Rechne 70 geteilt durch {{p}}.
    explanation: "70 : {{p}} = {{70 / p}} Jahre."
    variants:
      params: { p: "choice[2,5,7,10,14]" }
      defaults: { p: 7 }

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Vergleiche linear und exponentiell bei 10 % pro Jahr: Ab welchem Jahr ist der exponentielle Wert mindestens **doppelt so groß** wie der lineare?"
    params:
      scene: growth
      controls:
        rate:
          value: 10
          fixed: true
        years:
          value: 3
      show:
        - value
        - linear
    check:
      predicate: value >= 2 * linear && years <= 27
    explanation: Nach etwa 26 Jahren. Am Anfang liegen beide Kurven fast aufeinander – das macht exponentielles Wachstum so tückisch.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Woher kommt die 70er-Regel? Verdopplung heißt $(1 + r)^T = 2$, also $T = \\frac{\\ln 2}{\\ln(1 + r)}$. Für kleine r gilt die **Näherung** $\\ln(1 + r) \\approx r$, und ln 2 ≈ 0,693. Darum T ≈ 69,3 : p."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: "Berechne die Verdopplungszeit bei 7 % pro Jahr genau: $T = \\frac{\\ln 2}{\\ln 1{,}07}$. Auf zwei Stellen."
    params:
      unit: Jahre
    answer:
      value: 10.24
      tolerance: 0.02
    feedback:
      - when: numval(state.input) == 10
        misconception: rule-of-thumb
        text: Das ist die Faustregel. Gefragt ist der genaue Wert.
    hints:
      - ln 2 ≈ 0,6931 und ln 1,07 ≈ 0,0677.
      - Teile die beiden.
    explanation: "0,6931 : 0,0677 ≈ 10,24 Jahre. Die 70er-Regel sagt 10 – nah dran, weil 7 % noch klein ist."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: "Prüf die Regel: Stell 8 % ein und finde das Jahr, in dem sich der Wert zum ersten Mal verdoppelt hat."
    params:
      scene: growth
      show:
        - value
        - factor
    answer:
      rate: 8
      factor:
        - 1.995
        - 2.1
    explanation: "Nach 9 Jahren ist der Faktor 1,08⁹ ≈ 2,0. Die Regel sagt 70 : 8 ≈ 8,75 – passt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Etwas wächst um 3 % pro Jahr. Um wie viel Prozent wächst es in 100 Jahren – grob? Nutze die 70er-Regel.
    params:
      unit: "%"
    answer:
      value: 1800
      tolerance: 250
    hints:
      - Verdopplung etwa alle 23 Jahre – also gut 4 Verdopplungen.
    explanation: 1,03¹⁰⁰ ≈ 19,2 – das 19-Fache, also plus 1800 %.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: "Auf das letzte Schachfeld kommen $2^{63}$ Körner, auf alle zusammen $2^{64} - 1$. Wie viele Stellen hat $2^{64}$? Tipp: $2^{10} \\approx 10^3$."
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 19
        misconception: rounding
        text: "Die Faustregel unterschätzt: 2¹⁰ ist 1024, etwas mehr als 1000. 2⁶⁴ ≈ 1,8 · 10¹⁹ hat 20 Stellen."
    hints:
      - $2^{64} = 2^4 \cdot (2^{10})^6 \approx 16 \cdot 10^{18}$.
      - 16 · 10¹⁸ hat schon 20 Stellen.
    explanation: $2^{64} = 18\,446\,744\,073\,709\,551\,616$ – 20 Stellen. Das wäre die Reisernte der ganzen Welt von mehreren Jahrhunderten.
    difficulty: 3

  - kind: explain
    id: mb-x2
    depth: 3
    body: Wächst etwas stetig mit $e^{kt}$, ist die Verdopplungszeit genau $\frac{\ln 2}{k}$. Bei jährlichen Zinsen ist ln(1 + r) etwas kleiner als r. Darum trifft die **72er-Regel** bei 6 bis 10 % oft besser als die 70er-Regel.

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, woher die 70 in der 70er-Regel kommt.
    params:
      keywords:
        - - ln 2
          - 0,693
          - "0.693"
          - logarithmus
          - logarithm
        - - verdopp
          - zwei
          - doubl
          - two
        - - prozent
          - klein
          - percent
          - small
          - näherung
          - approx
      sample: "Verdoppeln heißt, der Faktor hoch T ist zwei. Löst man mit dem Logarithmus, steht ln 2 ≈ 0,693 im Zähler und bei kleinen Prozentsätzen ungefähr p/100 im Nenner. Also T ≈ 69,3 : p – grob 70 : p."
    explanation: Die 70 ist 100 · ln 2, aufgerundet. Bei großen Raten wird die Näherung ungenau.
    difficulty: 3

srs:
  cards_from: [bakterien, siebziger]
