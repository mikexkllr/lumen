id: math.growth.doubling
type: concept
title: Die Macht des Verdoppelns
summary: Linear addiert, exponentiell multipliziert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Eine Bakterie teilt sich alle 20 Minuten. Wie viele sind es nach 10 Stunden?"
    params:
      min: 100
      max: 1000000000000
      scale: log
    answer:
      value: 1000000000
      within: 90
    explanation: "30 Verdopplungen: 2³⁰ ≈ 1 Milliarde. Unser Gefühl denkt linear und liegt fast immer weit daneben."


  - kind: problem
    id: seerosen
    widget: choice
    prompt: Seerosen verdoppeln ihre Fläche jeden Tag. Nach 30 Tagen ist der Teich voll. Wann war er halb voll?
    params:
      layout: grid
      options:
        - { label: Am Tag 29, correct: true }
        - { label: Am Tag 15, feedback: "Das wäre bei gleichmäßigem Wachstum so. Hier verdoppelt sich aber alles." }
        - { label: Am Tag 20, feedback: "Denk rückwärts. Was war einen Tag vor »voll«?" }
        - { label: Am Tag 25, feedback: "Am Tag 25 war erst ein Zweiunddreißigstel bedeckt." }
    hints:
      - Rechne rückwärts – vom vollen Teich einen Tag zurück.
    explanation: Einen Tag vor »voll« war es die Hälfte. Exponentielles Wachstum passiert am Ende fast schlagartig.

  - kind: explain
    id: s2
    body: |
      **Lineares** Wachstum addiert jedes Mal gleich viel.
      **Exponentielles** Wachstum multipliziert jedes Mal mit demselben Faktor.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Linear oder exponentiell? Ordne zu.
    params:
      buckets: [{ label: linear }, { label: exponentiell }]
      items:
        - { label: Jeden Monat 50 € mehr sparen, bucket: linear }
        - { label: Bakterien teilen sich jede Stunde, bucket: exponentiell }
        - { label: Eine Kerze brennt 1 cm pro Stunde ab, bucket: linear }
        - { label: Clip-Aufrufe verdoppeln sich täglich, bucket: exponentiell }
        - { label: Taxi kostet 2 € pro Kilometer, bucket: linear }
        - { label: Guthaben mit 5 % Zinsen pro Jahr, bucket: exponentiell }
    hints:
      - Kommt jedes Mal gleich viel dazu – oder wird malgenommen?
    explanation: Fester Betrag pro Schritt ist linear. Fester Faktor pro Schritt ist exponentiell.

  - kind: problem
    id: bakterien
    widget: numeric
    prompt: Eine Kultur hat {{s}} Zellen und verdoppelt sich jede Stunde. Wie viele sind es nach {{h}} Stunden?
    params: { unit: Zellen }
    answer: { value: "{{s * 2 ** h}}" }
    feedback:
      - when: "numval(state.input) == s * 2 * h"
        misconception: linear-thinking
        text: Das wäre lineares Wachstum. Jede Stunde wird verdoppelt, nicht nur mal 2 genommen.
    hints:
      - "Nach 1 Stunde: {{s * 2}}. Nach 2 Stunden: {{s * 4}} …"
    explanation: "{{s}} · $2^{ {{h}} }$ = {{s * 2 ** h}}."
    variants:
      params: { s: "choice[100,250,500]", h: "int[3,6]" }
      defaults: { s: 100, h: 5 }

  - kind: explain
    id: s5
    body: Wie lange dauert das Verdoppeln bei 7 % Wachstum pro Jahr?
    reveal:
      body: Etwa 10 Jahre. Die **70er-Regel** – 70 geteilt durch den Prozentsatz ergibt ungefähr die Verdopplungszeit.

  - kind: problem
    id: siebziger
    widget: numeric
    prompt: Nutze die 70er-Regel. Nach wie vielen Jahren verdoppelt sich etwas bei {{p}} % Wachstum pro Jahr?
    params: { unit: Jahre }
    answer: { value: "{{70 / p}}", tolerance: 0.5 }
    hints:
      - Rechne 70 geteilt durch {{p}}.
    explanation: "70 : {{p}} = {{70 / p}} Jahre."
    variants:
      params: { p: "choice[2,5,7,10,14]" }
      defaults: { p: 7 }

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Vergleiche linear und exponentiell bei 10 % pro Jahr: Ab welchem Jahr ist der exponentielle Wert mindestens **doppelt so groß** wie der lineare?"
    params:
      scene: growth
      controls:
        rate:
          value: 10
          fixed: true
        years:
          value: 3
      show:
        - value
        - linear
    check:
      predicate: value >= 2 * linear && years <= 27
    explanation: Nach etwa 26 Jahren. Am Anfang liegen beide Kurven fast aufeinander – das macht exponentielles Wachstum so tückisch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Etwas wächst um 3 % pro Jahr. Um wie viel Prozent wächst es in 100 Jahren – grob? Nutze die 70er-Regel.
    params:
      unit: "%"
    answer:
      value: 1800
      tolerance: 250
    hints:
      - Verdopplung etwa alle 23 Jahre – also gut 4 Verdopplungen.
    explanation: 1,03¹⁰⁰ ≈ 19,2 – das 19-Fache, also plus 1800 %.
    difficulty: 3

srs:
  cards_from: [bakterien, siebziger]
