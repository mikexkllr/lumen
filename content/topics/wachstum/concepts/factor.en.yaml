id: math.growth.factor
type: concept
title: The growth factor
summary: Why two rises of 10% are more than 20%.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: faktor
    widget: numeric
    prompt: A price rises by 10%. What number do you multiply the old price by?
    params: { placeholder: "Factor" }
    answer: { value: 1.1 }
    feedback:
      - when: "approx(numval(state.input), 0.1)"
        misconception: increase-only
        text: That is only the increase. The old price stays, so 1 plus 0.1.
      - when: "numval(state.input) == 10"
        misconception: percent-as-factor
        text: Times 10 would be a tenfold increase. Write 10% as a decimal.
    hints:
      - 100% of the old price plus 10% on top.
    explanation: 100% + 10% = 110% = 1.1.

  - kind: explain
    id: s2
    body: |
      Plus p% means times (1 + p/100).
      Two rises of 10% are times 1.1 · 1.1 = 1.21. That is **21%**, not 20%.

  - kind: problem
    id: zweimal
    widget: numeric
    prompt: A value rises twice in a row by {{p}}%. By what percent has it risen in total?
    params: { unit: "%" }
    answer: { value: "{{2 * p + p * p / 100}}" }
    feedback:
      - when: "numval(state.input) == 2 * p"
        misconception: add-percents
        text: The second rise is calculated on the already raised value.
    hints:
      - "Multiply by the factor {{1 + p / 100}} twice."
    explanation: "{{1 + p / 100}}² = {{(1 + p / 100) ** 2}}, so plus {{2 * p + p * p / 100}}%."
    variants:
      params: { p: "choice[10,20,30,50]" }
      defaults: { p: 10 }

  - kind: problem
    id: saeulen
    widget: chart
    prompt: A balance doubles every 10 years. Drag the last bar to the right value.
    params:
      title: Balance in thousand €
      labels: [Start, "10 yrs", "20 yrs", "30 yrs"]
      values: [2, 4, 8, 1]
      editable: [3]
      min: 0
      max: 20
      step: 1
    answer: { values: [2, 4, 8, 16] }
    hints:
      - Double once more from 8.
    explanation: 2, 4, 8, 16. Each bar is twice as tall as the one before.

  - kind: problem
    id: wer-gewinnt
    widget: choice
    prompt: Which grows more in the long run, if both start with €1000?
    params:
      options:
        - { label: 5% interest per year, correct: true }
        - { label: Add €60 every year, feedback: "At first that leads. After about 15 years, interest overtakes it and pulls away." }
        - { label: Both the same, feedback: "Interest grows along, the fixed €60 does not." }
    hints:
      - How much does interest bring when €3000 is already in the account?
    explanation: Percentages grow with the balance. Fixed amounts do not.

  - kind: problem
    id: c1
    widget: match
    prompt: Which factor belongs to which change?
    params:
      pairs:
        - left: +5 %
          right: "1.05"
        - left: −5 %
          right: "0.95"
        - left: +50 %
          right: "1.5"
        - left: +100 %
          right: "2"
        - left: −30 %
          right: "0.7"
    hints:
      - Plus p% means times (1 + p/100).
    explanation: With factors percent calculation becomes simple multiplication.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Set 10% growth per year. After how many years has 1000 grown to more than 1500 for the first time?
    params:
      scene: growth
    answer:
      rate: 10
      value:
        - 1500
        - 1650
    explanation: "After 5 years: 1.1⁵ ≈ 1.61. Linear growth would give exactly 1500."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A value grows by 33.1% in total over 3 years. How many percent is that per year?
    params:
      unit: "%"
    answer:
      value: 10
    hints:
      - Which factor multiplied by itself three times gives 1.331?
    explanation: 1.1³ = 1.331. The average is the cube root – the **geometric mean**.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "At 100 % interest a year, money doubles. If the bank pays 50 % twice, it grows by 1.5² = 2.25. Monthly: $(1 + \\frac{1}{12})^{12}$. The more often interest is paid, the more **compound interest** – but not without limit."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: What is $(1 + \frac{1}{12})^{12}$ – the yearly factor when 100 % a year is paid monthly? To two decimals.
    answer:
      value: 2.61
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 2
        misconception: simple-interest
        text: That would be once a year. Monthly, the interest also earns interest.
    hints:
      - 1 + 1/12 ≈ 1.0833.
      - Raise it to the 12th power.
    explanation: 1.0833¹² ≈ 2.613. Daily it would be 2.7146, continuously exactly e ≈ 2.7183.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A loan costs 1 % interest per month. What is the effective rate per year? To one decimal.
    params:
      unit: "%"
    answer:
      value: 12.7
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 12
        misconception: simple-interest
        text: Each month interest is also charged on the interest.
    hints:
      - Yearly factor 1.01¹².
      - 1.01¹² ≈ 1.1268.
    explanation: 1.01¹² ≈ 1.127, so 12.7 % effective. That is why banks must state the effective rate.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A fund makes +50%, then −50%, then +50%, then −50%. Where does it stand?
    params:
      options:
        - label: At about 56% of the starting value
          correct: true
        - label: Exactly at the start
          feedback: 1.5 · 0.5 = 0.75 – every pair costs a quarter.
        - label: At 75%
          feedback: That would be after one pair. There are two.
    hints:
      - Compute 1.5 · 0.5 · 1.5 · 0.5.
    explanation: 0.75² ≈ 0.56. Volatility eats returns – the arithmetic mean of 0% is deceptive.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: The sequence $\left(1 + \frac1n\right)^n$ grows with n but stays below 3. Its limit is **Euler's number** e = 2.71828… In general $\left(1 + \frac{x}{n}\right)^n \to e^x$ – continuous growth.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: A fund alternates +50 % and −50 %. By what percentage does it change per year on average? Use the geometric mean $\sqrt{1.5 \cdot 0.5}$. To one decimal, with sign.
    params:
      unit: "%"
    answer:
      value: -13.4
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 0
        misconception: arithmetic-mean
        text: The arithmetic mean of +50 and −50 is 0 – but factors multiply, they do not add.
    hints:
      - 1.5 · 0.5 = 0.75.
      - √0.75 ≈ 0.866. How many percent short of 1 is that?
    explanation: √0.75 ≈ 0.866, so −13.4 % a year. Volatility costs returns – even if the average of the percentages is zero.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is +10 % twice more than +20 %?"
    params:
      keywords:
        - - faktor
          - 1,1
          - "1.1"
          - factor
        - - mal
          - multipl
          - times
        - - zins auf zins
          - zinseszins
          - auch auf
          - compound
          - on top
          - interest on interest
      sample: Plus 10 % means times 1.1. Twice is 1.1 · 1.1 = 1.21, so 21 %. The second time, the first increase grows as well – interest on interest.
    explanation: Percentages on percentages multiply. The extra point is 10 % of 10 %.
    difficulty: 3

srs:
  cards_from: [faktor, zweimal]
