id: math.growth.decay
type: concept
title: Abnahme und Halbwertszeit
summary: Wenn der Faktor kleiner als 1 ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: medikament
    widget: numeric
    prompt: Ein Wirkstoff wird alle 4 Stunden zur Hälfte abgebaut. Von {{d}} mg – wie viel ist nach {{h}} Stunden übrig?
    params: { unit: mg }
    answer: { value: "{{d / 2 ** (h / 4)}}" }
    feedback:
      - when: "numval(state.input) == 0"
        misconception: linear-decay
        text: Bei Halbierung bleibt immer etwas übrig. Halbiere Schritt für Schritt.
    hints:
      - "{{h}} Stunden sind {{h / 4}} Halbierungen."
    explanation: "{{d}} mg halbiert {{h / 4}}-mal ergibt {{d / 2 ** (h / 4)}} mg."
    variants:
      params: { d: "choice[160,320,400,800]", h: "choice[8,12,16]" }
      defaults: { d: 200, h: 12 }

  - kind: explain
    id: s2
    body: |
      Bei **Abnahme** ist der Faktor kleiner als 1. Minus 20 % heißt mal 0,8.
      Die **Halbwertszeit** ist die Zeit, bis nur noch die Hälfte da ist.

  - kind: problem
    id: auto
    widget: numeric
    prompt: Ein Auto verliert jedes Jahr 20 % an Wert. Neu kostet es {{p}} €. Was ist es nach 2 Jahren wert?
    params: { unit: "€" }
    answer: { value: "{{p * 0.64}}" }
    feedback:
      - when: "numval(state.input) == p * 0.6"
        misconception: add-percents
        text: Der zweite Verlust rechnet vom schon kleineren Wert.
    hints:
      - Nimm den Preis zweimal mal 0,8.
    explanation: "{{p}} · 0,8 · 0,8 = {{p * 0.64}} €."
    variants:
      params: { p: "choice[20000,25000,30000,40000]" }
      defaults: { p: 25000 }

  - kind: problem
    id: zerfall
    widget: chart
    prompt: Die Halbwertszeit ist 1 Tag. Ziehe die Säulen auf die richtigen Werte.
    params:
      title: Menge in Gramm
      labels: [Tag 0, Tag 1, Tag 2, Tag 3]
      values: [16, 8, 16, 16]
      editable: [2, 3]
      min: 0
      max: 16
      step: 1
    answer: { values: [16, 8, 4, 2] }
    hints:
      - Jeden Tag halbiert sich die Menge.
    explanation: 16, 8, 4, 2 – jede Säule ist halb so hoch wie die davor.

  - kind: problem
    id: plus-minus
    widget: choice
    prompt: Ein Wert steigt erst um 50 % und fällt dann um 50 %. Wo landet er?
    params:
      options:
        - { label: Bei 75 % des Startwerts, correct: true }
        - { label: Wieder beim Startwert, feedback: "Die 50 % Verlust rechnen vom höheren Wert. Probier es mit 100 €." }
        - { label: Bei 50 % des Startwerts, feedback: "Zu tief. Rechne 100 € · 1,5 · 0,5." }
    hints:
      - Starte mit 100 €.
    explanation: 100 € · 1,5 = 150 €. Davon die Hälfte sind 75 €.

  - kind: explain
    id: s6
    body: Warum wirkt exponentielles Wachstum lange so harmlos?
    reveal:
      body: Anfangs sind die Zahlen klein. Dann verdoppelt sich plötzlich ein großer Wert. Genau so überraschen uns Pandemien, Zinsen und virale Trends.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Ein Stoff hat 5 Stunden Halbwertszeit. Nach wie vielen Stunden sind weniger als 10 % übrig? Finde den **frühesten** Zeitpunkt.
    params:
      scene: decay
      controls:
        halflife:
          value: 5
          fixed: true
    answer:
      time: 17
    explanation: Nach 17 Stunden sind es 9,5 %. Dafür braucht es gut 3,3 Halbwertszeiten – denn 2^3,3 ≈ 10.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Zerfall lässt sich mit 2 oder mit e schreiben: $N(t) = N_0 \\cdot 2^{-t/T} = N_0 \\cdot e^{-\\lambda t}$. Die **Zerfallskonstante** ist $\\lambda = \\frac{\\ln 2}{T}$. Große Konstante heißt kurze Halbwertszeit."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: Die Zeit steht fest auf 12 Stunden. Stell die Halbwertszeit so ein, dass genau 12,5 % übrig sind.
    params:
      scene: decay
      controls:
        time:
          value: 12
          fixed: true
        halflife:
          value: 2
      show:
        - left
        - halvings
    answer:
      left: 12.5
    explanation: "12,5 % = ⅛ = drei Halbierungen. 12 h : 3 = 4 h Halbwertszeit."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Du nimmst alle 8 Stunden 100 mg eines Mittels mit 8 Stunden Halbwertszeit. Wie viel mg sind auf lange Sicht direkt nach einer Einnahme im Körper?
    params:
      unit: mg
    answer:
      value: 200
    feedback:
      - when: numval(state.input) == 150
        misconception: partial-sum
        text: Das ist nach zwei Einnahmen. Die Reste früherer Dosen addieren sich weiter.
      - when: numval(state.input) == 100
        misconception: no-accumulation
        text: Von jeder alten Dosis ist noch etwas übrig.
    hints:
      - Neue Dosis 100, von der vorigen 50, davor 25, …
      - 100 + 50 + 25 + … ist eine geometrische Reihe mit q = ½.
    explanation: "100 : (1 − ½) = 200 mg. Der Spiegel pendelt sich zwischen 100 und 200 mg ein. So planen Ärzte Dosierungen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Holzkohle enthält noch 25 % des ursprünglichen C-14. Die Halbwertszeit ist 5730 Jahre. Wie alt ist sie?
    params:
      unit: Jahre
    answer:
      value: 11460
    hints:
      - 25 % sind die Hälfte der Hälfte.
    explanation: "Zwei Halbwertszeiten: 2 · 5730 = 11 460 Jahre. So datiert man Funde."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was ist eine Halbwertszeit?"
    params:
      keywords:
        - - zeit
          - dauer
          - time
          - how long
          - period
        - - hälfte
          - halb
          - half
        - - immer
          - jedes mal
          - wieder
          - gleich
          - always
          - each
          - again
          - same
      sample: Die Halbwertszeit ist die Zeit, nach der nur noch die Hälfte übrig ist. Sie ist immer gleich lang – egal, wie viel gerade da ist.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Holz enthält nur noch 10 % seines C-14. Halbwertszeit 5730 Jahre. Wie alt ist es? Es gilt $t = 5730 \cdot \log_2 10$ und $\log_2 10 \approx 3{,}32$. Auf hundert Jahre genau.
    params:
      unit: Jahre
    answer:
      value: 19000
      tolerance: 100
    feedback:
      - when: abs(numval(state.input) - 51570) < 200
        misconception: linear-decay
        text: Das wären 9 Halbwertszeiten. Bis 10 % sind es nur gut 3.
    hints:
      - Wie viele Halbierungen bis 10 %? 2^3,32 ≈ 10.
      - 5730 · 3,32.
    explanation: 5730 · 3,32 ≈ 19 000 Jahre. Mit der Formel $t = T \log_2 \frac{N_0}{N}$ lässt sich jedes Verhältnis in ein Alter übersetzen.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: Warum kann man Dinosaurier-Knochen nicht mit C-14 datieren?
    params:
      options:
        - label: Nach 66 Millionen Jahren ist praktisch kein C-14 mehr übrig.
          correct: true
        - label: Knochen enthalten kein Kohlenstoff.
          feedback: Lebewesen bestehen zu einem großen Teil aus Kohlenstoff.
        - label: C-14 zerfällt bei Kälte nicht.
          feedback: Radioaktiver Zerfall hängt nicht von der Temperatur ab.
    hints:
      - Wie viele Halbwertszeiten sind 66 Millionen Jahre?
      - Rund 11 500 Halbierungen.
    explanation: Schon nach 50 000 Jahren ist weniger als 1 % übrig, dann wird die Messung unsicher. Für Dinosaurier datiert man Vulkanasche über und unter den Knochen – mit Uran oder Kalium, deren Halbwertszeiten Milliarden Jahre betragen.
    difficulty: 3

srs:
  cards_from: [auto, medikament]
