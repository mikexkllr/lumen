id: math.growth.factor
type: concept
title: Der Wachstumsfaktor
summary: Warum zweimal 10 % mehr als 20 % sind.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: faktor
    widget: numeric
    prompt: Ein Preis steigt um 10 %. Mit welcher Zahl muss man den alten Preis malnehmen?
    params: { placeholder: "Faktor" }
    answer: { value: 1.1 }
    feedback:
      - when: "approx(numval(state.input), 0.1)"
        misconception: increase-only
        text: Das ist nur der Zuwachs. Der alte Preis bleibt ja – also 1 plus 0,1.
      - when: "numval(state.input) == 10"
        misconception: percent-as-factor
        text: Mal 10 wäre eine Verzehnfachung. Schreib 10 % als Dezimalzahl.
    hints:
      - 100 % des alten Preises plus 10 % dazu.
    explanation: 100 % + 10 % = 110 % = 1,1.

  - kind: explain
    id: s2
    body: |
      Plus p % heißt mal (1 + p/100).
      Zweimal plus 10 % ist also mal 1,1 · 1,1 = 1,21. Das sind **21 %**, nicht 20 %.

  - kind: problem
    id: zweimal
    widget: numeric
    prompt: Ein Wert steigt zweimal hintereinander um {{p}} %. Um wie viel Prozent ist er insgesamt gestiegen?
    params: { unit: "%" }
    answer: { value: "{{2 * p + p * p / 100}}" }
    feedback:
      - when: "numval(state.input) == 2 * p"
        misconception: add-percents
        text: Der zweite Anstieg rechnet auf den schon erhöhten Wert.
    hints:
      - "Rechne den Faktor {{1 + p / 100}} zweimal mal."
    explanation: "{{1 + p / 100}}² = {{(1 + p / 100) ** 2}} – also plus {{2 * p + p * p / 100}} %."
    variants:
      params: { p: "choice[10,20,30,50]" }
      defaults: { p: 10 }

  - kind: problem
    id: saeulen
    widget: chart
    prompt: Ein Guthaben verdoppelt sich alle 10 Jahre. Ziehe die letzte Säule auf den richtigen Wert.
    params:
      title: Guthaben in Tausend €
      labels: [Start, "10 J.", "20 J.", "30 J."]
      values: [2, 4, 8, 1]
      editable: [3]
      min: 0
      max: 20
      step: 1
    answer: { values: [2, 4, 8, 16] }
    hints:
      - Von 8 aus noch einmal verdoppeln.
    explanation: 2, 4, 8, 16 – jede Säule ist doppelt so hoch wie die davor.

  - kind: problem
    id: wer-gewinnt
    widget: choice
    prompt: Was wächst auf lange Sicht stärker – wenn beide mit 1000 € starten?
    params:
      options:
        - { label: 5 % Zinsen pro Jahr, correct: true }
        - { label: Jedes Jahr 60 € dazu, feedback: "Anfangs liegt das vorne. Nach rund 15 Jahren überholt der Zins – und zieht davon." }
        - { label: Beide gleich, feedback: "Der Zins wächst mit, die festen 60 € nicht." }
    hints:
      - Wie viel bringt der Zins, wenn schon 3000 € auf dem Konto liegen?
    explanation: Prozente wachsen mit dem Guthaben mit. Feste Beträge nicht.

  - kind: problem
    id: c1
    widget: match
    prompt: Welcher Faktor gehört zu welcher Änderung?
    params:
      pairs:
        - left: +5 %
          right: 1,05
        - left: −5 %
          right: 0,95
        - left: +50 %
          right: 1,5
        - left: +100 %
          right: "2"
        - left: −30 %
          right: 0,7
    hints:
      - Plus p % heißt mal (1 + p/100).
    explanation: Mit Faktoren wird aus Prozentrechnung einfaches Malnehmen.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Stell 10 % Zuwachs pro Jahr ein. Nach wie vielen Jahren sind aus 1000 zum ersten Mal mehr als 1500 geworden?
    params:
      scene: growth
    answer:
      rate: 10
      value:
        - 1500
        - 1650
    explanation: "Nach 5 Jahren: 1,1⁵ ≈ 1,61. Linear wären es genau 1500."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Wert wächst in 3 Jahren um insgesamt 33,1 %. Wie viel Prozent sind das pro Jahr?
    params:
      unit: "%"
    answer:
      value: 10
    hints:
      - Welcher Faktor ergibt dreimal mit sich selbst malgenommen 1,331?
    explanation: 1,1³ = 1,331. Der Durchschnitt ist die dritte Wurzel – das **geometrische Mittel**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Fonds macht +50 %, dann −50 %, dann +50 %, dann −50 %. Wie steht er?
    params:
      options:
        - label: Bei etwa 56 % des Startwerts
          correct: true
        - label: Genau beim Startwert
          feedback: 1,5 · 0,5 = 0,75 – jedes Paar kostet ein Viertel.
        - label: Bei 75 %
          feedback: Das wäre nach einem Paar. Es sind zwei.
    hints:
      - Rechne 1,5 · 0,5 · 1,5 · 0,5.
    explanation: 0,75² ≈ 0,56. Schwankungen fressen Rendite – das arithmetische Mittel von 0 % täuscht.
    difficulty: 3

srs:
  cards_from: [faktor, zweimal]
