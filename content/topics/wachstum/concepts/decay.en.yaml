id: math.growth.decay
type: concept
title: Decay and half-life
summary: When the factor is less than 1.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: medikament
    widget: numeric
    prompt: A drug is broken down by half every 4 hours. Starting from {{d}} mg, how much is left after {{h}} hours?
    params: { unit: mg }
    answer: { value: "{{d / 2 ** (h / 4)}}" }
    feedback:
      - when: "numval(state.input) == 0"
        misconception: linear-decay
        text: When you halve, something always remains. Halve step by step.
    hints:
      - "{{h}} hours are {{h / 4}} halvings."
    explanation: "{{d}} mg halved {{h / 4}} times gives {{d / 2 ** (h / 4)}} mg."
    variants:
      params: { d: "choice[160,320,400,800]", h: "choice[8,12,16]" }
      defaults: { d: 200, h: 12 }

  - kind: explain
    id: s2
    body: |
      In **decay**, the factor is less than 1. Minus 20% means times 0.8.
      The **half-life** is the time until only half is left.

  - kind: problem
    id: auto
    widget: numeric
    prompt: A car loses 20% of its value every year. New, it costs €{{p}}. What is it worth after 2 years?
    params: { unit: "€" }
    answer: { value: "{{p * 0.64}}" }
    feedback:
      - when: "numval(state.input) == p * 0.6"
        misconception: add-percents
        text: The second loss is taken from the already smaller value.
    hints:
      - Multiply the price by 0.8 twice.
    explanation: "{{p}} · 0.8 · 0.8 = €{{p * 0.64}}."
    variants:
      params: { p: "choice[20000,25000,30000,40000]" }
      defaults: { p: 25000 }

  - kind: problem
    id: zerfall
    widget: chart
    prompt: The half-life is 1 day. Drag the bars to the right values.
    params:
      title: Amount in grams
      labels: [Day 0, Day 1, Day 2, Day 3]
      values: [16, 8, 16, 16]
      editable: [2, 3]
      min: 0
      max: 16
      step: 1
    answer: { values: [16, 8, 4, 2] }
    hints:
      - The amount halves every day.
    explanation: 16, 8, 4, 2. Each bar is half as tall as the one before.

  - kind: problem
    id: plus-minus
    widget: choice
    prompt: A value first rises by 50%, then falls by 50%. Where does it end up?
    params:
      options:
        - { label: At 75% of the starting value, correct: true }
        - { label: Back at the starting value, feedback: "The 50% loss is taken from the higher value. Try it with €100." }
        - { label: At 50% of the starting value, feedback: "Too low. Calculate €100 · 1.5 · 0.5." }
    hints:
      - Start with €100.
    explanation: €100 · 1.5 = €150. Half of that is €75.

  - kind: explain
    id: s6
    body: Why does exponential growth look so harmless for so long?
    reveal:
      body: At first the numbers are small. Then suddenly a large value doubles. This is exactly how pandemics, interest and viral trends surprise us.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: A substance has a half-life of 5 hours. After how many hours is less than 10% left? Find the **earliest** time.
    params:
      scene: decay
      controls:
        halflife:
          value: 5
          fixed: true
    answer:
      time: 17
    explanation: After 17 hours 9.5% is left. That takes a good 3.3 half-lives – because 2^3.3 ≈ 10.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Decay can be written with 2 or with e: $N(t) = N_0 \\cdot 2^{-t/T} = N_0 \\cdot e^{-\\lambda t}$. The **decay constant** is $\\lambda = \\frac{\\ln 2}{T}$. A large constant means a short half-life."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: Time is fixed at 12 hours. Set the half-life so that exactly 12.5 % is left.
    params:
      scene: decay
      controls:
        time:
          value: 12
          fixed: true
        halflife:
          value: 2
      show:
        - left
        - halvings
    answer:
      left: 12.5
    explanation: 12.5 % = ⅛ = three halvings. 12 h / 3 = 4 h half-life.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: You take 100 mg of a drug every 8 hours. Its half-life is 8 hours. In the long run, how many mg are in the body right after a dose?
    params:
      unit: mg
    answer:
      value: 200
    feedback:
      - when: numval(state.input) == 150
        misconception: partial-sum
        text: That is after two doses. The leftovers of earlier doses keep adding up.
      - when: numval(state.input) == 100
        misconception: no-accumulation
        text: Some of every earlier dose is still there.
    hints:
      - New dose 100, from the one before 50, before that 25, …
      - 100 + 50 + 25 + … is a geometric series with q = ½.
    explanation: 100 / (1 − ½) = 200 mg. The level settles between 100 and 200 mg. That is how doctors plan dosing.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Charcoal still contains 25% of its original C-14. The half-life is 5730 years. How old is it?
    params:
      unit: years
    answer:
      value: 11460
    hints:
      - 25% is half of a half.
    explanation: "Two half-lives: 2 · 5730 = 11,460 years. This is how finds are dated."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what is a half-life?"
    params:
      keywords:
        - - zeit
          - dauer
          - time
          - how long
          - period
        - - hälfte
          - halb
          - half
        - - immer
          - jedes mal
          - wieder
          - gleich
          - always
          - each
          - again
          - same
      sample: The half-life is the time after which only half is left. It is always the same length – no matter how much is there.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Wood has only 10 % of its C-14 left. Half-life 5730 years. How old is it? Use $t = 5730 \cdot \log_2 10$ and $\log_2 10 \approx 3.32$. To the nearest hundred years.
    params:
      unit: years
    answer:
      value: 19000
      tolerance: 100
    feedback:
      - when: abs(numval(state.input) - 51570) < 200
        misconception: linear-decay
        text: That would be 9 half-lives. Down to 10 % takes only just over 3.
    hints:
      - How many halvings to 10 %? 2^3.32 ≈ 10.
      - 5730 · 3.32.
    explanation: 5730 · 3.32 ≈ 19,000 years. The formula $t = T \log_2 \frac{N_0}{N}$ turns any ratio into an age.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: Why can't dinosaur bones be dated with C-14?
    params:
      options:
        - label: After 66 million years practically no C-14 is left.
          correct: true
        - label: Living things are largely made of carbon.
          feedback: Lebewesen bestehen zu einem großen Teil aus Kohlenstoff.
        - label: Radioactive decay does not depend on temperature.
          feedback: Radioaktiver Zerfall hängt nicht von der Temperatur ab.
    hints:
      - How many half-lives are 66 million years?
      - About 11,500 halvings.
    explanation: After only 50,000 years less than 1 % is left and measurement gets unreliable. For dinosaurs one dates volcanic ash above and below the bones – with uranium or potassium, whose half-lives are billions of years.
    difficulty: 3

srs:
  cards_from: [auto, medikament]
