id: sci.em.magnets
type: concept
title: Magnete und Felder
summary: Nord, Süd und unsichtbare Linien.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: pole
    widget: choice
    prompt: Zwei Magnete liegen mit den Nordpolen zueinander. Was passiert?
    params:
      options:
        - { label: Sie stoßen sich ab., correct: true }
        - { label: Sie ziehen sich an., feedback: "Anziehen tun sich nur verschiedene Pole." }
        - { label: Nichts, feedback: "Gleiche Pole spürt man deutlich." }
    hints:
      - Gleiche Pole …
    explanation: Gleiche Pole stoßen sich ab, verschiedene ziehen sich an.

  - kind: explain
    id: s2
    body: |
      Um jeden Magneten liegt ein **Magnetfeld**. Man stellt es mit Feldlinien dar, die vom Nord- zum Südpol laufen. Auch die Erde ist ein riesiger Magnet – darum funktioniert der Kompass.

  - kind: problem
    id: material
    widget: buckets
    prompt: Wird es von einem Magneten angezogen?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Eisennagel, bucket: ja }
        - { label: Nickelmünze, bucket: ja }
        - { label: Kupferkabel, bucket: nein }
        - { label: Alufolie, bucket: nein }
        - { label: Holz, bucket: nein }
    hints:
      - Längst nicht jedes Metall ist magnetisch.
    explanation: Nur wenige Metalle wie Eisen, Nickel und Kobalt sind magnetisch.

  - kind: problem
    id: kompass
    widget: choice
    prompt: Die Nordnadel des Kompasses zeigt nach Norden. Welcher magnetische Pol liegt also im geografischen Norden?
    params:
      options:
        - { label: Ein magnetischer Südpol, correct: true }
        - { label: Ein magnetischer Nordpol, feedback: "Ein Nordpol würde die Nordnadel abstoßen." }
    hints:
      - Was zieht einen Nordpol an?
    explanation: Gegensätze ziehen sich an – im Norden liegt magnetisch ein Südpol.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Zerbricht man einen Magneten, hat jedes Stück wieder Nord- und Südpol.
          right: true
        - text: Alle Metalle werden von Magneten angezogen.
          right: false
          why: Nur Eisen, Nickel, Kobalt und wenige andere. Kupfer und Alu nicht.
        - text: Das Erdmagnetfeld schützt uns vor Teilchen von der Sonne.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Gleiche Pole [[stoßen]] sich ab, ungleiche Pole [[ziehen]] sich an.
      distractors:
        - drehen
        - lösen

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Woher kommt der Magnetismus eines Eisenstücks?
    params:
      options:
        - label: Winzige atomare Magnete richten sich gemeinsam aus
          correct: true
        - label: Aus elektrischer Ladung auf der Oberfläche
          feedback: Ein Magnet ist elektrisch neutral.
        - label: Aus einer besonderen magnetischen Flüssigkeit im Inneren
          feedback: Die Ursache sind die Elektronen der Atome.
    hints:
      - Erhitzt man einen Magneten stark, verliert er seine Kraft.
    explanation: Die Elektronen wirken wie Mini-Magnete. In Eisen ordnen sie sich in **Domänen** – Hitze zerstört die Ordnung.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Du brichst einen Stabmagneten genau in der Mitte durch. Was hast du dann?
    params:
      options:
        - label: Zwei kleinere Magnete, jeder mit Nord- und Südpol.
          correct: true
        - label: Einen Nordpol und einen Südpol, getrennt.
          feedback: An der Bruchstelle entstehen sofort neue Pole. Einzelne Pole bekommt man so nie.
        - label: Zwei unmagnetische Stücke.
          feedback: Die winzigen atomaren Magnete bleiben ausgerichtet. Jedes Stück bleibt ein Magnet.
    hints:
      - Ein Magnet besteht aus vielen winzigen Magneten in einer Reihe.
      - Was passiert, wenn man eine Reihe von Pfeilen teilt?
    explanation: Jedes Stück hat wieder zwei Pole – egal wie oft du teilst. Bis hinunter zum einzelnen Atom ist jeder Magnet ein Dipol.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Ein Kühlschrankmagnet hat an seiner Oberfläche etwa 5000 Mikrotesla. Wie stark ist das Erdmagnetfeld bei uns – in Mikrotesla?"
    params:
      min: 1
      max: 10000
      scale: log
    answer:
      value: 50
      within: 40
    explanation: Rund 50 µT – hundertmal schwächer als der Kühlschrankmagnet. Trotzdem reicht es, um eine leicht drehbare Kompassnadel auszurichten. Ein MRT-Gerät hat 1,5 bis 3 T.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gibt es einen einzelnen magnetischen Nordpol ohne Südpol?
    params:
      options:
        - label: Bisher wurde keiner gefunden – magnetische Feldlinien sind immer geschlossen
          correct: true
        - label: Ja, an den Enden langer Stabmagnete
          feedback: Auch dort gehört zu jedem Nordpol ein Südpol am anderen Ende.
        - label: Ja, die Erde hat einen
          feedback: Die Erde hat beide Pole.
    hints:
      - Was passierte beim Zerbrechen eines Magneten?
    explanation: Elektrische Ladungen gibt es einzeln, magnetische **Monopole** nicht – eine der vier Maxwell-Gleichungen.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Erhitzt man Eisen über etwa 770 °C, ist es nicht mehr magnetisch. Warum?
    params:
      options:
        - label: Die Wärmebewegung zerstört die Ordnung der atomaren Magnete.
          correct: true
        - label: Das Eisen schmilzt.
          feedback: Eisen schmilzt erst bei 1538 °C. Der Magnetismus verschwindet schon vorher.
        - label: Die Elektronen verlassen das Eisen.
          feedback: Die Elektronen bleiben. Nur ihre Ausrichtung geht verloren.
    hints:
      - Was halten die atomaren Magnete in einem Magneten?
      - Wärme heißt Zappeln.
    explanation: Oberhalb der **Curie-Temperatur** ist das Zappeln stärker als die Kraft, die die Nachbarn gleich ausrichtet. Kühlt das Eisen in einem Magnetfeld ab, friert es dessen Richtung ein.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Das Erdmagnetfeld hat sich in der Erdgeschichte oft umgepolt. Woher weiß man das?
    params:
      options:
        - label: Erkaltende Lava speichert die Feldrichtung – am Meeresboden liegen Streifen mit wechselnder Richtung.
          correct: true
        - label: Aus alten Seekarten.
          feedback: Seefahrer gibt es erst seit Jahrtausenden. Die letzte Umpolung liegt 780 000 Jahre zurück.
        - label: Aus der Form der Kontinente.
          feedback: Die Form verrät Plattenbewegung, aber nicht die Feldrichtung.
    hints:
      - Eisenhaltiges Gestein kann wie Eisen magnetisiert werden.
      - Denk an die Curie-Temperatur beim Abkühlen.
    explanation: Am mittelatlantischen Rücken quillt Lava hervor und erstarrt. Dabei friert sie die aktuelle Feldrichtung ein. So entsteht ein Streifenmuster, symmetrisch zum Rücken – zugleich ein Beweis für die Plattentektonik.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Kompass funktioniert.
    params:
      keywords:
        - - magnet
          - nadel
          - needle
        - - erde
          - earth
          - feld
          - field
        - - nord
          - north
          - süd
          - south
          - pol
          - pole
          - richt
          - align
          - dreh
          - turn
      sample: Die Nadel ist ein kleiner Magnet, der sich frei drehen kann. Die Erde hat ein Magnetfeld. Die Nadel dreht sich so, dass ihr Nordpol zum magnetischen Südpol der Erde zeigt – der liegt im Norden.
    difficulty: 3

srs:
  cards_from: [pole, material]
