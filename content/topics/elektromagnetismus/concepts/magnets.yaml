id: sci.em.magnets
type: concept
title: Magnete und Felder
summary: Nord, Süd und unsichtbare Linien.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: pole
    widget: choice
    prompt: Zwei Magnete liegen mit den Nordpolen zueinander. Was passiert?
    params:
      options:
        - { label: Sie stoßen sich ab., correct: true }
        - { label: Sie ziehen sich an., feedback: "Anziehen tun sich nur verschiedene Pole." }
        - { label: Nichts, feedback: "Gleiche Pole spürt man deutlich." }
    hints:
      - Gleiche Pole …
    explanation: Gleiche Pole stoßen sich ab, verschiedene ziehen sich an.

  - kind: explain
    id: s2
    body: |
      Um jeden Magneten liegt ein **Magnetfeld**. Man stellt es mit Feldlinien dar, die vom Nord- zum Südpol laufen. Auch die Erde ist ein riesiger Magnet – darum funktioniert der Kompass.

  - kind: problem
    id: material
    widget: buckets
    prompt: Wird es von einem Magneten angezogen?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Eisennagel, bucket: ja }
        - { label: Nickelmünze, bucket: ja }
        - { label: Kupferkabel, bucket: nein }
        - { label: Alufolie, bucket: nein }
        - { label: Holz, bucket: nein }
    hints:
      - Längst nicht jedes Metall ist magnetisch.
    explanation: Nur wenige Metalle wie Eisen, Nickel und Kobalt sind magnetisch.

  - kind: problem
    id: kompass
    widget: choice
    prompt: Die Nordnadel des Kompasses zeigt nach Norden. Welcher magnetische Pol liegt also im geografischen Norden?
    params:
      options:
        - { label: Ein magnetischer Südpol, correct: true }
        - { label: Ein magnetischer Nordpol, feedback: "Ein Nordpol würde die Nordnadel abstoßen." }
    hints:
      - Was zieht einen Nordpol an?
    explanation: Gegensätze ziehen sich an – im Norden liegt magnetisch ein Südpol.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Zerbricht man einen Magneten, hat jedes Stück wieder Nord- und Südpol.
          right: true
        - text: Alle Metalle werden von Magneten angezogen.
          right: false
          why: Nur Eisen, Nickel, Kobalt und wenige andere. Kupfer und Alu nicht.
        - text: Das Erdmagnetfeld schützt uns vor Teilchen von der Sonne.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Woher kommt der Magnetismus eines Eisenstücks?
    params:
      options:
        - label: Winzige atomare Magnete richten sich gemeinsam aus
          correct: true
        - label: Aus elektrischer Ladung auf der Oberfläche
          feedback: Ein Magnet ist elektrisch neutral.
        - label: Aus einer besonderen magnetischen Flüssigkeit im Inneren
          feedback: Die Ursache sind die Elektronen der Atome.
    hints:
      - Erhitzt man einen Magneten stark, verliert er seine Kraft.
    explanation: Die Elektronen wirken wie Mini-Magnete. In Eisen ordnen sie sich in **Domänen** – Hitze zerstört die Ordnung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gibt es einen einzelnen magnetischen Nordpol ohne Südpol?
    params:
      options:
        - label: Bisher wurde keiner gefunden – magnetische Feldlinien sind immer geschlossen
          correct: true
        - label: Ja, an den Enden langer Stabmagnete
          feedback: Auch dort gehört zu jedem Nordpol ein Südpol am anderen Ende.
        - label: Ja, die Erde hat einen
          feedback: Die Erde hat beide Pole.
    hints:
      - Was passierte beim Zerbrechen eines Magneten?
    explanation: Elektrische Ladungen gibt es einzeln, magnetische **Monopole** nicht – eine der vier Maxwell-Gleichungen.
    difficulty: 3

srs:
  cards_from: [pole, material]
