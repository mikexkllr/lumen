id: sci.em.motor
type: concept
title: The electric motor
summary: Motion from current.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many electric motors are in a modern car?"
    params:
      min: 1
      max: 300
    answer:
      value: 60
      tolerance: 35
    explanation: "Often 50 to 100: for windows, seats, mirrors, fans and pumps."

  - kind: explain
    id: s1
    body: |
      A wire carrying current in a magnetic field is pushed sideways. In an **electric motor**, a coil turns this way. A switch reverses the current every half turn so that it keeps turning.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the steps inside the motor in the right order.
    params:
      items:
        - { label: Current flows through the coil }
        - { label: The coil becomes a magnet }
        - { label: The fixed magnet turns the coil }
        - { label: The switch reverses the current }
    hints:
      - Without current, there is no magnetic field in the coil.
    explanation: Current, magnetic field, force, switching – and again from the start.

  - kind: problem
    id: umpolen
    widget: choice
    prompt: What happens if you connect the battery of a small motor the other way around?
    params:
      options:
        - { label: It turns the other way., correct: true }
        - { label: It stops., feedback: "It keeps running – only the force points the other way." }
    hints:
      - What happens to the direction of the force if the current flows the other way?
    explanation: Reversed current, reversed force, reversed rotation.

  - kind: problem
    id: wirkung
    widget: choice
    prompt: An electric car motor turns 90% of the energy into motion. A combustion engine turns about 30%. Where does the rest go in the combustion engine?
    params:
      options:
        - { label: Mostly into waste heat, correct: true }
        - { label: Into light, feedback: "Light plays hardly any role – it mostly gets hot." }
    hints:
      - What happens to an engine block as you drive?
    explanation: Most of it is lost as heat through the exhaust and radiator.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A motor turns current into [[motion]]. A generator turns motion into [[current]].
      distractors:
        - light
        - heat

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A wire carries current upward, the magnetic field points to the right. Which way does the force act?
    params:
      options:
        - label: Perpendicular to both – into or out of the page
          correct: true
        - label: To the right, with the field
          feedback: The force is always perpendicular to the field.
        - label: Upward, with the current
          feedback: The force is always perpendicular to the current.
    hints:
      - "The **three-finger rule**: thumb current, index finger field, middle finger force."
    explanation: The **Lorentz force** is perpendicular to current and field.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A 0.2 m wire lies across a magnetic field of 0.5 T. 3 A flow through it. What is the force on the wire? We have F = B · I · L.
    params:
      unit: N
    answer:
      value: 0.3
    hints:
      - "Substitute: 0.5 · 3 · 0.2."
      - The unit is newtons.
    explanation: 0.5 · 3 · 0.2 = 0.3 N. In a motor many turns act together, which is why much more force arises there.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: An electric car brakes and charges its battery. What happens in the motor?
    params:
      options:
        - label: "It works as a generator: the motion generates current and is slowed by it"
          correct: true
        - label: It runs backwards
          feedback: It keeps turning forwards – only the energy flows the other way.
        - label: The brake discs generate the current
          feedback: Brake discs only make heat.
    hints:
      - Motor and generator are the same machine.
    explanation: "**Regenerative braking**. Lenz’s law says: the generated current opposes its cause – it brakes."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: A spinning motor is also a generator. It produces a **back EMF** that grows with its speed. That is why it draws little current when running fast but a lot when stalled.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: A motor is connected to a battery, but you hold its shaft still. What happens?
    params:
      options:
        - label: Without back EMF a very large current flows – the motor gets hot.
          correct: true
        - label: No current flows at all.
          feedback: The circuit stays closed. Only the opposing back EMF is missing.
        - label: The current stays as when running.
          feedback: When running the back EMF limits the current. When stalled it is missing.
    hints:
      - What does a spinning coil in a magnetic field produce?
      - Without rotation only the small wire resistance limits the current.
    explanation: When stalled only the winding resistance limits the current – often ten times the running current. That is why blocked motors burn out.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: numeric
    prompt: A motor delivers a torque of 2 Nm at 3000 revolutions per minute. What power is that? We have P = M · ω with ω = 2π · revolutions per second. In watts.
    params:
      unit: W
    answer:
      value: 628
      tolerance: 2
    feedback:
      - when: abs(numval(state.input) - 6000) < 1
        misconception: rpm-not-omega
        text: "The speed must first be converted into ω: 50 revolutions per second times 2π."
    hints:
      - 3000 per minute is 50 per second.
      - ω = 2π · 50 ≈ 314 per second.
    explanation: P = 2 · 314 ≈ 628 W. At the same power a motor can give a lot of torque slowly or little torque fast – gearboxes trade one for the other.
    difficulty: 3

srs:
  cards_from: [ablauf, umpolen]
