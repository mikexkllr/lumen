id: sci.em.induction
type: concept
title: Current from motion
summary: Induction, generator, transformer.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: still
    widget: choice
    prompt: A magnet rests inside a coil. Does current flow?
    params:
      options:
        - { label: No – the field has to change., correct: true }
        - { label: Yes, feedback: "A steady field creates no current." }
    hints:
      - What happens once you move the magnet?
    explanation: Only a changing magnetic field creates current. This is **induction**.

  - kind: explain
    body: |
      **Generators** in power plants, wind turbines and bike dynamos spin magnets inside coils and so make current. A **transformer** changes voltages through the ratio of turns.

  - kind: problem
    id: trafo
    widget: numeric
    prompt: A transformer has {{n1}} turns on the 230 V side and {{n2}} on the other. What voltage comes out?
    params: { unit: V }
    answer: { value: "{{230 * n2 / n1}}" }
    hints:
      - The voltages are in the same ratio as the numbers of turns.
    explanation: "230 · {{n2}} ÷ {{n1}} = {{230 * n2 / n1}} V."
    variants:
      params: { n1: "choice[1000,2000]", n2: "choice[50,100,200]" }
      defaults: { n1: 1000, n2: 50 }

  - kind: problem
    id: laden
    widget: choice
    prompt: How does a phone charge on a charging pad without a cable?
    params:
      options:
        - { label: A changing magnetic field induces current in the phone., correct: true }
        - { label: Through Wi-Fi, feedback: "Wi-Fi carries data, but hardly any energy." }
    hints:
      - Two coils, one in the pad, one in the phone.
    explanation: Induction also works through air – over short distances.

srs:
  cards_from: [still, trafo]
