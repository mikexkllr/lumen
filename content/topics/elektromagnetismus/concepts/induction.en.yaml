id: sci.em.induction
type: concept
title: Current from motion
summary: Induction, generator, transformer.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: still
    widget: choice
    prompt: A magnet rests inside a coil. Does current flow?
    params:
      options:
        - { label: No – the field has to change., correct: true }
        - { label: Yes, feedback: "A steady field creates no current." }
    hints:
      - What happens once you move the magnet?
    explanation: Only a changing magnetic field creates current. This is **induction**.

  - kind: explain
    id: s2
    body: |
      **Generators** in power plants, wind turbines and bike dynamos spin magnets inside coils and so make current. A **transformer** changes voltages through the ratio of turns.

  - kind: problem
    id: trafo
    widget: numeric
    prompt: A transformer has {{n1}} turns on the 230 V side and {{n2}} on the other. What voltage comes out?
    params: { unit: V }
    answer: { value: "{{230 * n2 / n1}}" }
    hints:
      - The voltages are in the same ratio as the numbers of turns.
    explanation: "230 · {{n2}} ÷ {{n1}} = {{230 * n2 / n1}} V."
    variants:
      params: { n1: "choice[1000,2000]", n2: "choice[50,100,200]" }
      defaults: { n1: 1000, n2: 50 }

  - kind: problem
    id: laden
    widget: choice
    prompt: How does a phone charge on a charging pad without a cable?
    params:
      options:
        - { label: A changing magnetic field induces current in the phone., correct: true }
        - { label: Through Wi-Fi, feedback: "Wi-Fi carries data, but hardly any energy." }
    hints:
      - Two coils, one in the pad, one in the phone.
    explanation: Induction also works through air – over short distances.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A magnet rests in a coil.
          right: false
        - text: A magnet is pushed into the coil.
          right: true
        - text: The coil rotates in the magnetic field.
          right: true
        - text: A strong magnet lies still next to the coil.
          right: false
          why: Strength alone is not enough – the field must **change**.
      left: No current
      right: Current flows

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A transformer should lower 230 V to 11.5 V. The input coil has 1000 turns. How many does the output coil need?
    answer:
      value: 50
    hints:
      - "The voltage ratio is 20 : 1."
    explanation: 1000 ÷ 20 = 50 turns.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: sim
    prompt: A power supply should turn 230 V into about 12 V. Set the numbers of turns.
    params:
      scene: transformer
    answer:
      u2:
        - 11.5
        - 12.5
    explanation: "The ratio must be about 19 : 1, for example 950 to 50 turns. The voltages are in the same ratio as the turns."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: sim
    prompt: On the output side 1 A flows. Set the transformer so that only 0.05 A flow on the 230 V side.
    params:
      scene: transformer
    answer:
      i1: 0.05
    explanation: "At 20 : 1, 11.5 V come out. Power is conserved: 230 V · 0.05 A = 11.5 V · 1 A. What you lose in voltage you gain in current."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does a transformer only work with **alternating current**?
    params:
      options:
        - label: Only a changing magnetic field induces voltage in the second coil
          correct: true
        - label: Direct current is too weak
          feedback: Even strong direct current only produces a constant field.
        - label: It works with direct current too
          feedback: Only at the moment of switching on and off.
    hints:
      - What had to change earlier for current to flow?
    explanation: "That is why alternating current prevailed: it is easy to step up and down."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Faraday's **law of induction**: $U = -N \\frac{\\Delta \\Phi}{\\Delta t}$. Here Φ is the magnetic flux through the coil. More turns or a faster change give more voltage."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A coil has 100 turns. The flux through it changes by 0.02 Wb in 0.1 s. What is the induced voltage in volts?
    params:
      unit: V
    answer:
      value: 20
    feedback:
      - when: abs(numval(state.input) - 0.2) < 0.01
        misconception: forgot-turns
        text: That is for one turn. But there are 100 – each contributes equally.
    hints:
      - "Per turn: 0.02 Wb ÷ 0.1 s."
      - Times 100 turns.
    explanation: 0.2 V per turn, times 100 gives 20 V. Move twice as fast, double the voltage – which is why a dynamo shines brighter the faster you ride.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: You drop a strong magnet through a vertical copper pipe. Copper is not magnetic. What happens?
    params:
      options:
        - label: It falls strikingly slowly – eddy currents in the pipe brake it.
          correct: true
        - label: It falls quite normally.
          feedback: The moving magnet induces currents in the copper. Their field brakes it.
        - label: It sticks inside the pipe.
          feedback: Copper does not attract magnets. The brake only works while it moves.
    hints:
      - A moving magnet changes the field in the copper.
      - Induced currents oppose their cause (Lenz).
    explanation: The induced currents form magnets that brake the falling magnet. That is Lenz's law. Trains and roller coasters brake this way without contact.
    difficulty: 3

srs:
  cards_from: [still, trafo]
