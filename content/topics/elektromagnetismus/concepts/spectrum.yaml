id: sci.em.spectrum
type: concept
title: Licht ist elektromagnetisch
summary: Vom Radio bis zum Röntgen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Minuten braucht das Licht von der Sonne bis zur Erde?"
    params:
      min: 0
      max: 60
      unit: min
    answer:
      value: 8
      tolerance: 2
    explanation: Gut 8 Minuten. Du siehst die Sonne, wie sie vor 8 Minuten war.

  - kind: explain
    id: s1
    body: |
      Ändert sich ein elektrisches Feld, entsteht ein magnetisches – und umgekehrt. So pflanzt sich eine **elektromagnetische Welle** fort, mit Lichtgeschwindigkeit. Licht ist nur ein kleiner Ausschnitt davon.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Ordne von langer zu kurzer Wellenlänge.
    params:
      items:
        - { label: Radiowellen }
        - { label: Mikrowellen }
        - { label: Infrarot }
        - { label: Sichtbares Licht }
        - { label: Ultraviolett }
        - { label: Röntgenstrahlen }
    hints:
      - Radiowellen sind meterlang, Röntgenstrahlen kleiner als Atome.
    explanation: Je kürzer die Welle, desto mehr Energie trägt sie.

  - kind: problem
    id: mond
    widget: numeric
    prompt: Licht schafft rund 300 000 km pro Sekunde. Wie viele Sekunden braucht es für die 384 000 km vom Mond?
    params: { unit: s }
    answer: { value: 1.28, tolerance: 0.05 }
    hints:
      - 384 000 geteilt durch 300 000.
    explanation: Etwa 1,3 Sekunden – so alt ist das Mondlicht, das du siehst.

  - kind: problem
    id: wlan
    widget: choice
    prompt: Was haben WLAN und das Licht einer Lampe gemeinsam?
    params:
      options:
        - { label: Beides sind elektromagnetische Wellen., correct: true }
        - { label: Nichts, feedback: "Sie unterscheiden sich nur in der Wellenlänge." }
    hints:
      - Wo steht WLAN im Spektrum?
    explanation: WLAN sind Mikrowellen – gleiche Physik wie Licht, nur längere Wellen.

  - kind: problem
    id: d1
    depth: 2
    widget: buckets
    prompt: Welche Strahlung ist energiereicher als sichtbares Licht?
    params:
      buckets:
        - id: b1
          label: Weniger Energie
        - id: b2
          label: Mehr Energie
      items:
        - label: Radiowellen
          bucket: b1
        - label: Mikrowellen
          bucket: b1
        - label: Infrarot
          bucket: b1
        - label: Ultraviolett
          bucket: b2
        - label: Röntgen
          bucket: b2
        - label: Gammastrahlung
          bucket: b2
    hints:
      - Kürzere Wellenlänge heißt mehr Energie.
    explanation: Ab UV kann Strahlung Moleküle zerstören – darum der Sonnenbrand.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Radiowellen und Licht sind dieselbe Art Welle. Bau eine Welle mit der Frequenz 4 Hz, die sich mit 8 m/s ausbreitet.
    params:
      scene: wave
    answer:
      frequency: 4
      speed: 8
    explanation: "Wellenlänge 2 m. Bei festem Tempo gilt: höhere Frequenz, kürzere Welle."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: WLAN funkt mit 2,4 GHz, Licht läuft mit 3 · 10⁸ m/s. Wie lang ist eine WLAN-Welle – in cm?
    params:
      unit: cm
    answer:
      value: 12.5
    feedback:
      - when: abs(numval(state.input) - 0.125) < 0.001
        misconception: unit-cm
        text: Das sind Meter. Gefragt sind Zentimeter.
    hints:
      - "λ = c : f = 3 · 10⁸ : 2,4 · 10⁹."
      - Ergebnis in Metern mal 100.
    explanation: 0,125 m = 12,5 cm. Eine Mikrowelle nutzt fast dieselbe Frequenz – ihre Wellen sind ebenso lang.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Die Tür der Mikrowelle hat ein Gitter mit Löchern. Licht kommt hindurch, die Mikrowellen nicht. Warum?
    params:
      options:
        - label: Die Löcher sind viel kleiner als die 12 cm langen Mikrowellen, aber viel größer als Lichtwellen.
          correct: true
        - label: Das Gitter ist für Mikrowellen geladen.
          feedback: Das Gitter ist einfach Metall. Es kommt auf die Größe der Löcher an.
        - label: Mikrowellen sind schwächer als Licht.
          feedback: Im Gerät stecken fast 1000 W. Die Löcher halten sie trotzdem auf.
    hints:
      - Vergleiche die Lochgröße (wenige mm) mit den Wellenlängen.
      - Eine Welle passt nicht durch ein Loch, das viel kleiner ist als sie.
    explanation: Für 12 cm lange Wellen wirkt das Gitter wie eine geschlossene Metallwand. Licht mit 0,0005 mm Wellenlänge sieht dagegen riesige Öffnungen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Maxwell berechnete 1865 aus rein elektrischen und magnetischen Messwerten ein Tempo. Was kam heraus?
    params:
      options:
        - label: Genau die Lichtgeschwindigkeit – Licht musste also eine elektromagnetische Welle sein
          correct: true
        - label: Die Schallgeschwindigkeit
          feedback: Schall braucht Luft, diese Wellen nicht.
        - label: Eine unendliche Geschwindigkeit
          feedback: "Der Wert war endlich: 300 000 km/s."
    hints:
      - Das Ergebnis war rund 300 000 km/s.
    explanation: "Eine der größten Vereinheitlichungen der Physik: Elektrizität, Magnetismus und Licht sind eins."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie entsteht in einem Generator Strom?"
    params:
      keywords:
        - - magnet
        - - spule
          - draht
          - coil
          - wire
        - - beweg
          - dreh
          - änder
          - move
          - turn
          - rotat
          - chang
      sample: In einem Generator dreht sich ein Magnet in einer Spule aus Draht. Weil sich das Magnetfeld in der Spule ständig ändert, wird eine Spannung induziert und Strom fließt.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Maxwell fand: c = 1 : √(ε₀ · μ₀). Mit ε₀ = 8,85 · 10⁻¹² und μ₀ = 1,257 · 10⁻⁶ – welches c ergibt sich, in 10⁸ m/s? Auf eine Stelle."
    answer:
      value: 3
      tolerance: 0.05
    hints:
      - ε₀ · μ₀ ≈ 1,11 · 10⁻¹⁷.
      - Die Wurzel daraus ist etwa 3,34 · 10⁻⁹. Dann den Kehrwert bilden.
    explanation: "1 : 3,34 · 10⁻⁹ ≈ 3,0 · 10⁸ m/s. Zwei Konstanten aus Labor-Versuchen mit Ladungen und Strömen ergeben genau das Lichttempo. So erkannte man: Licht ist eine elektromagnetische Welle."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Eine Antenne soll eine Funkwelle senden. Was muss in ihr passieren?
    params:
      options:
        - label: Ladungen, die hin und her beschleunigt werden.
          correct: true
        - label: Ladungen, die ruhig liegen.
          feedback: Ruhende Ladungen haben nur ein festes elektrisches Feld. Es strahlt nicht.
        - label: Einen starken Dauermagneten.
          feedback: Ein festes Magnetfeld strahlt nicht. Es muss sich ständig ändern.
    hints:
      - Eine Welle ist ein Feld, das sich ständig ändert.
      - Ein Strom, der die Richtung wechselt, beschleunigt Ladungen.
    explanation: Nur beschleunigte Ladungen strahlen. Im Sendemast schwingen Elektronen millionenfach pro Sekunde hin und her. Ihr wechselndes Feld löst sich ab und läuft davon.
    difficulty: 3

srs:
  cards_from: [spektrum, wlan]
