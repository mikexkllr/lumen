id: sci.em.motor
type: concept
title: Der Elektromotor
summary: Bewegung aus Strom.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Ein stromdurchflossener Draht im Magnetfeld wird zur Seite gedrückt. Im **Elektromotor** dreht sich so eine Spule. Ein Umschalter kehrt den Strom jede halbe Drehung um – damit sie weiterdreht.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring den Ablauf im Motor in die richtige Reihenfolge.
    params:
      items:
        - { label: Strom fließt durch die Spule }
        - { label: Die Spule wird zum Magneten }
        - { label: Der feste Magnet dreht die Spule }
        - { label: Der Umschalter kehrt den Strom um }
    hints:
      - Ohne Strom kein Magnetfeld in der Spule.
    explanation: Strom, Magnetfeld, Kraft, Umschalten – und von vorn.

  - kind: problem
    id: umpolen
    widget: choice
    prompt: Was passiert, wenn du die Batterie eines kleinen Motors umgekehrt anschließt?
    params:
      options:
        - { label: Er dreht sich andersherum., correct: true }
        - { label: Er bleibt stehen., feedback: "Er läuft weiter – nur die Kraft zeigt in die andere Richtung." }
    hints:
      - Was passiert mit der Kraftrichtung, wenn der Strom andersherum fließt?
    explanation: Umgekehrter Strom, umgekehrte Kraft, umgekehrte Drehung.

  - kind: problem
    id: wirkung
    widget: choice
    prompt: Ein E-Auto-Motor setzt 90 % der Energie in Bewegung um, ein Verbrenner etwa 30 %. Wohin geht beim Verbrenner der Rest?
    params:
      options:
        - { label: Vor allem in Abwärme, correct: true }
        - { label: In Licht, feedback: "Licht spielt kaum eine Rolle – es wird vor allem heiß." }
    hints:
      - Was wird ein Motorblock beim Fahren?
    explanation: Der Großteil geht als Wärme über Auspuff und Kühler verloren.

srs:
  cards_from: [ablauf, umpolen]
