id: sci.em.motor
type: concept
title: Der Elektromotor
summary: Bewegung aus Strom.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Elektromotoren stecken in einem modernen Auto?"
    params:
      min: 1
      max: 300
    answer:
      value: 60
      tolerance: 35
    explanation: "Oft 50 bis 100: für Fenster, Sitze, Spiegel, Lüfter und Pumpen."

  - kind: explain
    id: s1
    body: |
      Ein stromdurchflossener Draht im Magnetfeld wird zur Seite gedrückt. Im **Elektromotor** dreht sich so eine Spule. Ein Umschalter kehrt den Strom jede halbe Drehung um – damit sie weiterdreht.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring den Ablauf im Motor in die richtige Reihenfolge.
    params:
      items:
        - { label: Strom fließt durch die Spule }
        - { label: Die Spule wird zum Magneten }
        - { label: Der feste Magnet dreht die Spule }
        - { label: Der Umschalter kehrt den Strom um }
    hints:
      - Ohne Strom kein Magnetfeld in der Spule.
    explanation: Strom, Magnetfeld, Kraft, Umschalten – und von vorn.

  - kind: problem
    id: umpolen
    widget: choice
    prompt: Was passiert, wenn du die Batterie eines kleinen Motors umgekehrt anschließt?
    params:
      options:
        - { label: Er dreht sich andersherum., correct: true }
        - { label: Er bleibt stehen., feedback: "Er läuft weiter – nur die Kraft zeigt in die andere Richtung." }
    hints:
      - Was passiert mit der Kraftrichtung, wenn der Strom andersherum fließt?
    explanation: Umgekehrter Strom, umgekehrte Kraft, umgekehrte Drehung.

  - kind: problem
    id: wirkung
    widget: choice
    prompt: Ein E-Auto-Motor setzt 90 % der Energie in Bewegung um, ein Verbrenner etwa 30 %. Wohin geht beim Verbrenner der Rest?
    params:
      options:
        - { label: Vor allem in Abwärme, correct: true }
        - { label: In Licht, feedback: "Licht spielt kaum eine Rolle – es wird vor allem heiß." }
    hints:
      - Was wird ein Motorblock beim Fahren?
    explanation: Der Großteil geht als Wärme über Auspuff und Kühler verloren.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Motor macht aus Strom [[Bewegung]]. Ein Generator macht aus Bewegung [[Strom]].
      distractors:
        - Licht
        - Wärme

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Draht führt Strom nach oben, das Magnetfeld zeigt nach rechts. Wohin wirkt die Kraft?
    params:
      options:
        - label: Senkrecht zu beiden – in die Seite hinein oder heraus
          correct: true
        - label: Nach rechts, mit dem Feld
          feedback: Die Kraft steht immer senkrecht auf dem Feld.
        - label: Nach oben, mit dem Strom
          feedback: Die Kraft steht immer senkrecht auf dem Strom.
    hints:
      - "Die **Drei-Finger-Regel**: Daumen Strom, Zeigefinger Feld, Mittelfinger Kraft."
    explanation: Die **Lorentzkraft** steht senkrecht auf Strom und Feld.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Ein Draht von 0,2 m Länge liegt quer in einem Magnetfeld von 0,5 T. Es fließen 3 A. Wie groß ist die Kraft auf den Draht? Es gilt F = B · I · L.
    params:
      unit: N
    answer:
      value: 0.3
    hints:
      - "Setze ein: 0,5 · 3 · 0,2."
      - Die Einheit ist Newton.
    explanation: 0,5 · 3 · 0,2 = 0,3 N. In einem Motor wirken viele Windungen zusammen, darum entsteht dort viel mehr Kraft.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein E-Auto bremst und lädt dabei seine Batterie. Was passiert im Motor?
    params:
      options:
        - label: "Er arbeitet als Generator: Die Bewegung erzeugt Strom und wird dadurch gebremst"
          correct: true
        - label: Er läuft rückwärts
          feedback: Er dreht sich weiter vorwärts – nur die Energie fließt andersherum.
        - label: Die Bremsscheiben erzeugen den Strom
          feedback: Bremsscheiben machen nur Wärme.
    hints:
      - Motor und Generator sind dieselbe Maschine.
    explanation: "**Rekuperation**. Die Lenzsche Regel sagt: Der erzeugte Strom wirkt seiner Ursache entgegen – er bremst."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Ein drehender Motor ist zugleich ein Generator. Er erzeugt eine **Gegenspannung**, die mit der Drehzahl wächst. Darum zieht er schnell laufend wenig Strom, stehend aber sehr viel.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Ein Motor hängt an der Batterie, aber du hältst seine Welle fest. Was passiert?
    params:
      options:
        - label: Ohne Gegenspannung fließt ein sehr großer Strom – der Motor wird heiß.
          correct: true
        - label: Es fließt gar kein Strom.
          feedback: Der Kreis bleibt geschlossen. Es fehlt nur die bremsende Gegenspannung.
        - label: Der Strom bleibt wie im Lauf.
          feedback: Im Lauf begrenzt die Gegenspannung den Strom. Im Stand fehlt sie.
    hints:
      - Was erzeugt eine drehende Spule im Magnetfeld?
      - Ohne Drehung bremst nur noch der kleine Drahtwiderstand.
    explanation: Im Stand begrenzt nur der Widerstand der Wicklung den Strom – oft das Zehnfache des Betriebsstroms. Darum brennen blockierte Motoren durch.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: numeric
    prompt: Ein Motor gibt bei 3000 Umdrehungen pro Minute ein Drehmoment von 2 Nm ab. Welche Leistung ist das? Es gilt P = M · ω mit ω = 2π · Drehzahl pro Sekunde. In Watt.
    params:
      unit: W
    answer:
      value: 628
      tolerance: 2
    feedback:
      - when: abs(numval(state.input) - 6000) < 1
        misconception: rpm-not-omega
        text: "Die Drehzahl muss erst in ω umgerechnet werden: 50 Umdrehungen pro Sekunde mal 2π."
    hints:
      - 3000 pro Minute sind 50 pro Sekunde.
      - ω = 2π · 50 ≈ 314 pro Sekunde.
    explanation: P = 2 · 314 ≈ 628 W. Bei gleicher Leistung kann ein Motor langsam viel Kraft oder schnell wenig Kraft liefern – Getriebe tauschen das eine gegen das andere.
    difficulty: 3

srs:
  cards_from: [ablauf, umpolen]
