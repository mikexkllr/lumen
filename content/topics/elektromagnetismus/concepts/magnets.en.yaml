id: sci.em.magnets
type: concept
title: Magnets and fields
summary: North, south and invisible lines.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: pole
    widget: choice
    prompt: Two magnets face each other with their north poles. What happens?
    params:
      options:
        - { label: They repel each other., correct: true }
        - { label: They attract each other., feedback: "Only different poles attract." }
        - { label: Nothing, feedback: "You can clearly feel like poles." }
    hints:
      - Like poles …
    explanation: Like poles repel, different poles attract.

  - kind: explain
    id: s2
    body: |
      Every magnet is surrounded by a **magnetic field**. It is drawn as field lines running from the north to the south pole. Earth is also a giant magnet – that is why a compass works.

  - kind: problem
    id: material
    widget: buckets
    prompt: Is it attracted by a magnet?
    params:
      buckets: [{ label: "yes" }, { label: "no" }]
      items:
        - { label: Iron nail, bucket: "yes" }
        - { label: Nickel coin, bucket: "yes" }
        - { label: Copper wire, bucket: "no" }
        - { label: Aluminum foil, bucket: "no" }
        - { label: Wood, bucket: "no" }
    hints:
      - Far from every metal is magnetic.
    explanation: Only a few metals, such as iron, nickel and cobalt, are magnetic.

  - kind: problem
    id: kompass
    widget: choice
    prompt: The north needle of a compass points north. So which magnetic pole lies in the geographic north?
    params:
      options:
        - { label: A magnetic south pole, correct: true }
        - { label: A magnetic north pole, feedback: "A north pole would repel the north needle." }
    hints:
      - What attracts a north pole?
    explanation: Opposites attract – magnetically, there is a south pole in the north.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: If you break a magnet, each piece again has a north and a south pole.
          right: true
        - text: All metals are attracted by magnets.
          right: false
          why: Only iron, nickel, cobalt and a few others. Not copper or aluminium.
        - text: The Earth’s magnetic field shields us from particles from the Sun.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Where does the magnetism of a piece of iron come from?
    params:
      options:
        - label: Tiny atomic magnets align together
          correct: true
        - label: From electric charge on the surface
          feedback: A magnet is electrically neutral.
        - label: From a special magnetic fluid inside
          feedback: The cause is the electrons of the atoms.
    hints:
      - If you heat a magnet strongly, it loses its strength.
    explanation: Electrons act like mini magnets. In iron they order themselves in **domains** – heat destroys the order.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is there a single magnetic north pole without a south pole?
    params:
      options:
        - label: None has been found so far – magnetic field lines are always closed
          correct: true
        - label: Yes, at the ends of long bar magnets
          feedback: There too every north pole has a south pole at the other end.
        - label: Yes, the Earth has one
          feedback: The Earth has both poles.
    hints:
      - What happened when a magnet was broken?
    explanation: Electric charges exist singly, magnetic **monopoles** do not – one of Maxwell’s four equations.
    difficulty: 3

srs:
  cards_from: [pole, material]
