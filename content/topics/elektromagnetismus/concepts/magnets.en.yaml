id: sci.em.magnets
type: concept
title: Magnets and fields
summary: North, south and invisible lines.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: pole
    widget: choice
    prompt: Two magnets face each other with their north poles. What happens?
    params:
      options:
        - { label: They repel each other., correct: true }
        - { label: They attract each other., feedback: "Only different poles attract." }
        - { label: Nothing, feedback: "You can clearly feel like poles." }
    hints:
      - Like poles …
    explanation: Like poles repel, different poles attract.

  - kind: explain
    id: s2
    body: |
      Every magnet is surrounded by a **magnetic field**. It is drawn as field lines running from the north to the south pole. Earth is also a giant magnet – that is why a compass works.

  - kind: problem
    id: material
    widget: buckets
    prompt: Is it attracted by a magnet?
    params:
      buckets: [{ label: "yes" }, { label: "no" }]
      items:
        - { label: Iron nail, bucket: "yes" }
        - { label: Nickel coin, bucket: "yes" }
        - { label: Copper wire, bucket: "no" }
        - { label: Aluminum foil, bucket: "no" }
        - { label: Wood, bucket: "no" }
    hints:
      - Far from every metal is magnetic.
    explanation: Only a few metals, such as iron, nickel and cobalt, are magnetic.

  - kind: problem
    id: kompass
    widget: choice
    prompt: The north needle of a compass points north. So which magnetic pole lies in the geographic north?
    params:
      options:
        - { label: A magnetic south pole, correct: true }
        - { label: A magnetic north pole, feedback: "A north pole would repel the north needle." }
    hints:
      - What attracts a north pole?
    explanation: Opposites attract – magnetically, there is a south pole in the north.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: If you break a magnet, each piece again has a north and a south pole.
          right: true
        - text: All metals are attracted by magnets.
          right: false
          why: Only iron, nickel, cobalt and a few others. Not copper or aluminium.
        - text: The Earth’s magnetic field shields us from particles from the Sun.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Like poles [[push]] each other away, unlike poles [[pull]] each other closer.
      distractors:
        - turn
        - loosen

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Where does the magnetism of a piece of iron come from?
    params:
      options:
        - label: Tiny atomic magnets align together
          correct: true
        - label: From electric charge on the surface
          feedback: A magnet is electrically neutral.
        - label: From a special magnetic fluid inside
          feedback: The cause is the electrons of the atoms.
    hints:
      - If you heat a magnet strongly, it loses its strength.
    explanation: Electrons act like mini magnets. In iron they order themselves in **domains** – heat destroys the order.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: You break a bar magnet exactly in the middle. What do you have then?
    params:
      options:
        - label: Two smaller magnets, each with a north and a south pole.
          correct: true
        - label: A separate north pole and south pole.
          feedback: New poles appear at once at the break. You never get single poles this way.
        - label: Two non-magnetic pieces.
          feedback: The tiny atomic magnets stay aligned. Each piece remains a magnet.
    hints:
      - A magnet is made of many tiny magnets in a row.
      - What happens when you split a row of arrows?
    explanation: Each piece again has two poles – however often you split it. Down to a single atom every magnet is a dipole.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: a fridge magnet has about 5000 microtesla at its surface. How strong is Earth's magnetic field here – in microtesla?"
    params:
      min: 1
      max: 10000
      scale: log
    answer:
      value: 50
      within: 40
    explanation: About 50 µT – a hundred times weaker than the fridge magnet. Still enough to align a freely turning compass needle. An MRI scanner has 1.5 to 3 T.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is there a single magnetic north pole without a south pole?
    params:
      options:
        - label: None has been found so far – magnetic field lines are always closed
          correct: true
        - label: Yes, at the ends of long bar magnets
          feedback: There too every north pole has a south pole at the other end.
        - label: Yes, the Earth has one
          feedback: The Earth has both poles.
    hints:
      - What happened when a magnet was broken?
    explanation: Electric charges exist singly, magnetic **monopoles** do not – one of Maxwell’s four equations.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Heated above about 770 °C, iron is no longer magnetic. Why?
    params:
      options:
        - label: Thermal motion destroys the order of the atomic magnets.
          correct: true
        - label: The iron melts.
          feedback: Iron only melts at 1538 °C. The magnetism disappears well before that.
        - label: The electrons leave the iron.
          feedback: The electrons stay. Only their alignment is lost.
    hints:
      - What do the atomic magnets in a magnet keep?
      - Heat means jiggling.
    explanation: Above the Curie temperature the jiggling beats the force that aligns neighbours. If the iron cools in a magnetic field, it freezes in that field's direction.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Earth's magnetic field has flipped many times in Earth's history. How do we know?
    params:
      options:
        - label: Cooling lava records the field direction – the sea floor shows stripes of alternating direction.
          correct: true
        - label: From old sea charts.
          feedback: Sailors have existed only for millennia. The last flip was 780,000 years ago.
        - label: From the shape of the continents.
          feedback: The shape reveals plate motion, not the field direction.
    hints:
      - Iron-rich rock can be magnetised like iron.
      - Think of the Curie temperature during cooling.
    explanation: At the Mid-Atlantic Ridge lava wells up and solidifies, freezing in the current field direction. This creates a striped pattern symmetric about the ridge – also proof of plate tectonics.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a compass works.
    params:
      keywords:
        - - magnet
          - nadel
          - needle
        - - erde
          - earth
          - feld
          - field
        - - nord
          - north
          - süd
          - south
          - pol
          - pole
          - richt
          - align
          - dreh
          - turn
      sample: The needle is a small magnet that can turn freely. Earth has a magnetic field. The needle turns so that its north pole points to Earth's magnetic south pole – which lies in the north.
    difficulty: 3

srs:
  cards_from: [pole, material]
