id: sci.em.spectrum
type: concept
title: Light is electromagnetic
summary: From radio to X-rays.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many minutes does light take from the Sun to the Earth?"
    params:
      min: 0
      max: 60
      unit: min
    answer:
      value: 8
      tolerance: 2
    explanation: A good 8 minutes. You see the Sun as it was 8 minutes ago.

  - kind: explain
    id: s1
    body: |
      If an electric field changes, a magnetic one appears – and the other way around. This is how an **electromagnetic wave** travels, at the speed of light. Visible light is only a small slice of it.

  - kind: problem
    id: spektrum
    widget: order
    prompt: Sort from long to short wavelength.
    params:
      items:
        - { label: Radio waves }
        - { label: Microwaves }
        - { label: Infrared }
        - { label: Visible light }
        - { label: Ultraviolet }
        - { label: X-rays }
    hints:
      - Radio waves are meters long. X-rays are smaller than atoms.
    explanation: The shorter the wave, the more energy it carries.

  - kind: problem
    id: mond
    widget: numeric
    prompt: Light travels about 300,000 km per second. How many seconds does it need for the 384,000 km from the Moon?
    params: { unit: s }
    answer: { value: 1.28, tolerance: 0.05 }
    hints:
      - 384,000 divided by 300,000.
    explanation: About 1.3 seconds – that is how old the moonlight is that you see.

  - kind: problem
    id: wlan
    widget: choice
    prompt: What do Wi-Fi and the light of a lamp have in common?
    params:
      options:
        - { label: Both are electromagnetic waves., correct: true }
        - { label: Nothing, feedback: "They differ only in wavelength." }
    hints:
      - Where is Wi-Fi in the spectrum?
    explanation: Wi-Fi uses microwaves – the same physics as light, just longer waves.

  - kind: problem
    id: d1
    depth: 2
    widget: buckets
    prompt: Which radiation carries more energy than visible light?
    params:
      buckets:
        - id: b1
          label: Less energy
        - id: b2
          label: More energy
      items:
        - label: Radio waves
          bucket: b1
        - label: Microwaves
          bucket: b1
        - label: Infrared
          bucket: b1
        - label: Ultraviolet
          bucket: b2
        - label: X-rays
          bucket: b2
        - label: Gamma rays
          bucket: b2
    hints:
      - Shorter wavelength means more energy.
    explanation: From UV onward radiation can destroy molecules – hence sunburn.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Radio waves and light are the same kind of wave. Build a wave with a frequency of 4 Hz that travels at 8 m/s.
    params:
      scene: wave
    answer:
      frequency: 4
      speed: 8
    explanation: "Wavelength 2 m. At a fixed speed: higher frequency, shorter wave."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Wi-Fi transmits at 2.4 GHz, light travels at 3 · 10⁸ m/s. How long is one Wi-Fi wave – in cm?
    params:
      unit: cm
    answer:
      value: 12.5
    feedback:
      - when: abs(numval(state.input) - 0.125) < 0.001
        misconception: unit-cm
        text: That is metres. Centimetres are asked for.
    hints:
      - λ = c ÷ f = 3 · 10⁸ ÷ 2.4 · 10⁹.
      - Result in metres times 100.
    explanation: 0.125 m = 12.5 cm. A microwave oven uses almost the same frequency – its waves are just as long.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: The microwave door has a mesh with holes. Light gets through, the microwaves do not. Why?
    params:
      options:
        - label: The holes are much smaller than the 12 cm microwaves but much larger than light waves.
          correct: true
        - label: The mesh is charged against microwaves.
          feedback: The mesh is just metal. What matters is the size of the holes.
        - label: Microwaves are weaker than light.
          feedback: The oven holds almost 1000 W. The holes still stop them.
    hints:
      - Compare the hole size (a few mm) with the wavelengths.
      - A wave does not get through a hole much smaller than itself.
    explanation: To 12 cm waves the mesh acts like a solid metal wall. Light with a wavelength of 0.0005 mm sees huge openings.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In 1865 Maxwell worked out a speed. He only used electric and magnetic data. What came out?
    params:
      options:
        - label: Exactly the speed of light – so light had to be an electromagnetic wave
          correct: true
        - label: The speed of sound
          feedback: Sound needs air, these waves do not.
        - label: An infinite speed
          feedback: "The value was finite: 300,000 km/s."
    hints:
      - The result was about 300,000 km/s.
    explanation: "One of the great unifications in physics: electricity, magnetism and light are one."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: how does a generator make power?"
    params:
      keywords:
        - - magnet
        - - spule
          - draht
          - coil
          - wire
        - - beweg
          - dreh
          - änder
          - move
          - turn
          - rotat
          - chang
      sample: In a generator a magnet rotates inside a coil of wire. Because the magnetic field in the coil keeps changing, a voltage is induced and current flows.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Maxwell found: c = 1 ÷ √(ε₀ · μ₀). With ε₀ = 8.85 · 10⁻¹² and μ₀ = 1.257 · 10⁻⁶ – what c results, in 10⁸ m/s? To one decimal place."
    answer:
      value: 3
      tolerance: 0.05
    hints:
      - ε₀ · μ₀ ≈ 1.11 · 10⁻¹⁷.
      - Its square root is about 3.34 · 10⁻⁹. Then take the reciprocal.
    explanation: 1 ÷ 3.34 · 10⁻⁹ ≈ 3.0 · 10⁸ m/s. Two constants from lab experiments with charges and currents give exactly the speed of light. That revealed light as an electromagnetic wave.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: An antenna is meant to send out a radio wave. What has to happen inside it?
    params:
      options:
        - label: Charges that are accelerated back and forth.
          correct: true
        - label: Charges at rest.
          feedback: Charges at rest only have a fixed electric field. It does not radiate.
        - label: A strong permanent magnet.
          feedback: A fixed magnetic field does not radiate. It has to keep changing.
    hints:
      - A wave is a field that keeps changing.
      - A current that reverses direction accelerates charges.
    explanation: Only accelerated charges radiate. In a transmitter mast electrons swing back and forth millions of times per second. Their changing field detaches and travels away.
    difficulty: 3

srs:
  cards_from: [spektrum, wlan]
