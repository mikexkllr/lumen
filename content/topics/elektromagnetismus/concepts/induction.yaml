id: sci.em.induction
type: concept
title: Strom aus Bewegung
summary: Induktion, Generator, Trafo.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: still
    widget: choice
    prompt: Ein Magnet liegt ruhig in einer Spule. Fließt Strom?
    params:
      options:
        - { label: Nein – das Feld muss sich ändern., correct: true }
        - { label: Ja, feedback: "Ein ruhendes Feld erzeugt keinen Strom." }
    hints:
      - Was passiert erst, wenn man den Magneten bewegt?
    explanation: Nur ein sich änderndes Magnetfeld erzeugt Strom – das ist **Induktion**.

  - kind: explain
    id: s2
    body: |
      **Generatoren** in Kraftwerken, Windrädern und Fahrrad-Dynamos drehen Magnete in Spulen und erzeugen so Strom. Ein **Transformator** wandelt Spannungen über das Verhältnis der Windungen um.

  - kind: problem
    id: trafo
    widget: numeric
    prompt: Ein Trafo hat {{n1}} Windungen auf der 230-V-Seite und {{n2}} auf der anderen. Welche Spannung kommt heraus?
    params: { unit: V }
    answer: { value: "{{230 * n2 / n1}}" }
    hints:
      - Die Spannungen verhalten sich wie die Windungszahlen.
    explanation: "230 · {{n2}} : {{n1}} = {{230 * n2 / n1}} V."
    variants:
      params: { n1: "choice[1000,2000]", n2: "choice[50,100,200]" }
      defaults: { n1: 1000, n2: 50 }

  - kind: problem
    id: laden
    widget: choice
    prompt: Wie lädt ein Handy auf einer Ladematte ohne Kabel?
    params:
      options:
        - { label: Ein wechselndes Magnetfeld induziert Strom im Handy., correct: true }
        - { label: Über WLAN, feedback: "WLAN überträgt Daten, aber kaum Energie." }
    hints:
      - Zwei Spulen, eine in der Matte, eine im Handy.
    explanation: Induktion funktioniert auch durch Luft – auf kurze Distanz.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Magnet ruht in einer Spule.
          right: false
        - text: Ein Magnet wird in die Spule geschoben.
          right: true
        - text: Die Spule dreht sich im Magnetfeld.
          right: true
        - text: Ein starker Magnet liegt still neben der Spule.
          right: false
          why: Stärke allein genügt nicht – das Feld muss sich **ändern**.
      left: Kein Strom
      right: Strom fließt

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Trafo soll 230 V auf 11,5 V senken. Die Eingangsspule hat 1000 Windungen. Wie viele braucht die Ausgangsspule?
    answer:
      value: 50
    hints:
      - "Das Spannungsverhältnis ist 20 : 1."
    explanation: "1000 : 20 = 50 Windungen."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: sim
    prompt: Ein Netzteil soll aus 230 V etwa 12 V machen. Stell die Windungszahlen ein.
    params:
      scene: transformer
    answer:
      u2:
        - 11.5
        - 12.5
    explanation: "Das Verhältnis muss etwa 19 : 1 sein, zum Beispiel 950 zu 50 Windungen. Die Spannungen verhalten sich wie die Windungszahlen."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: sim
    prompt: Auf der Ausgangsseite fließt 1 A. Stell den Trafo so ein, dass auf der 230-V-Seite nur 0,05 A fließen.
    params:
      scene: transformer
    answer:
      i1: 0.05
    explanation: "Bei 20 : 1 kommen 11,5 V heraus. Leistung bleibt erhalten: 230 V · 0,05 A = 11,5 V · 1 A. Was man an Spannung senkt, gewinnt man an Strom."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum funktioniert ein Transformator nur mit **Wechselstrom**?
    params:
      options:
        - label: Nur ein sich änderndes Magnetfeld induziert Spannung in der zweiten Spule
          correct: true
        - label: Gleichstrom ist zu schwach
          feedback: Auch starker Gleichstrom erzeugt nur ein konstantes Feld.
        - label: Er funktioniert auch mit Gleichstrom
          feedback: Nur im Moment des Ein- und Ausschaltens.
    hints:
      - Was musste sich vorhin ändern, damit Strom fließt?
    explanation: "Darum setzte sich Wechselstrom durch: Er lässt sich leicht hoch- und heruntertransformieren."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Das **Induktionsgesetz** von Faraday: $U = -N \\frac{\\Delta \\Phi}{\\Delta t}$. Dabei ist Φ der magnetische Fluss durch die Spule. Mehr Windungen oder eine schnellere Änderung liefern mehr Spannung."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Eine Spule hat 100 Windungen. Der Fluss durch sie ändert sich in 0,1 s um 0,02 Wb. Wie groß ist die induzierte Spannung in Volt?
    params:
      unit: V
    answer:
      value: 20
    feedback:
      - when: abs(numval(state.input) - 0.2) < 0.01
        misconception: forgot-turns
        text: Das gilt für eine Windung. Es sind aber 100 – jede liefert gleich viel.
    hints:
      - "Pro Windung: 0,02 Wb : 0,1 s."
      - Mal 100 Windungen.
    explanation: 0,2 V pro Windung, mal 100 ergibt 20 V. Doppelt so schnell bewegt, doppelte Spannung – darum leuchtet ein Dynamo heller, je schneller man fährt.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Du lässt einen starken Magneten durch ein senkrechtes Kupferrohr fallen. Kupfer ist nicht magnetisch. Was passiert?
    params:
      options:
        - label: Er fällt auffällig langsam – Wirbelströme im Rohr bremsen ihn.
          correct: true
        - label: Er fällt ganz normal.
          feedback: Der bewegte Magnet induziert Ströme im Kupfer. Ihr Feld bremst ihn.
        - label: Er bleibt im Rohr kleben.
          feedback: Kupfer zieht Magnete nicht an. Die Bremse wirkt nur, solange er sich bewegt.
    hints:
      - Ein bewegter Magnet ändert das Feld im Kupfer.
      - Induzierte Ströme wirken ihrer Ursache entgegen (Lenz).
    explanation: Die induzierten Ströme bilden Magnete, die den fallenden Magneten bremsen. Das ist die Lenzsche Regel. Züge und Achterbahnen bremsen so berührungslos.
    difficulty: 3

srs:
  cards_from: [still, trafo]
