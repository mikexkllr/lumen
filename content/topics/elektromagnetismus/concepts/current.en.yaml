id: sci.em.current
type: concept
title: Current makes magnetism
summary: The electromagnet.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wire turns magnet
    body: Wind wire into a **coil** and you get a strong magnet. Drag the number of turns up. The line shows the field inside a 10 cm coil for each current.
    visual:
      widget: slider
      interactive: true
      params:
        expr: 0.0126*n*x
        x:
          - 0
          - 5
        y:
          - 0
          - 70
        sliders:
          - id: n
            label: Turns
            min: 100
            max: 1000
            step: 100
            initial: 100

  - kind: problem
    id: hook
    widget: choice
    prompt: A crane in a scrapyard lifts cars with a magnet – and drops them again. How?
    params:
      options:
        - label: The magnet is switched on and off with electricity
          correct: true
        - label: The crane shakes them off
          feedback: That would be very laborious.
        - label: The magnet quickly weakens
          feedback: It holds as long as current flows.
    hints:
      - An ordinary magnet never lets go.
    explanation: Electricity creates magnetism. No current, no magnet.

  - kind: explain
    id: s1
    body: |
      Every current creates a magnetic field. If you wind a wire into a **coil**, the fields add up. The result is an **electromagnet** that you can switch on and off.

  - kind: problem
    id: staerker
    widget: numeric
    prompt: With the same current, a coil gets {{k}} times as many turns. Roughly how many times stronger does the field become?
    params: { unit: "×" }
    answer: { value: "{{k}}" }
    hints:
      - Every turn adds the same amount.
    explanation: "{{k}} times as many turns, {{k}} times as strong a field."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 2 }

  - kind: problem
    id: kran
    widget: choice
    prompt: A crane lifts scrap metal with an electromagnet. Why not with a normal magnet?
    params:
      options:
        - { label: You can switch it off and release the load., correct: true }
        - { label: It is cheaper., feedback: "The advantage is the switching." }
    hints:
      - How would you get the car off the magnet again?
    explanation: Current off – field gone – the scrap falls.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Is there an electromagnet inside?
    params:
      buckets: [{ label: "yes" }, { label: "no" }]
      items:
        - { label: Loudspeaker, bucket: "yes" }
        - { label: Doorbell, bucket: "yes" }
        - { label: MRI scanner, bucket: "yes" }
        - { label: Light bulb, bucket: "no" }
    hints:
      - Where does something have to be moved with current?
    explanation: Loudspeakers, doorbells and MRI scanners use switchable magnetic fields.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An electromagnet has 200 turns at 2 A. You want the same field strength with only 0.5 A. How many turns do you need?
    answer:
      value: 800
    hints:
      - Turns times current must stay the same.
    explanation: 200 · 2 = 400 = 800 · 0.5.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: A compass lies under a wire running south to north. Now a strong current is switched on. What happens?
    params:
      options:
        - label: The needle turns across the wire.
          correct: true
        - label: Nothing – current is not a magnet.
          feedback: That is exactly what Ørsted disproved with this experiment in 1820.
        - label: The needle points along the current.
          feedback: The field of a wire circles **around** it, not along it.
    hints:
      - Every current creates a magnetic field.
      - The field lines of a wire are circles around it.
    explanation: Under the wire the field points east or west, and the needle swings with it. In 1820 Ørsted discovered the link between current and magnetism this way.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: "Around a straight wire the field lines run in circles. Their direction is given by the **right-hand rule**: the thumb points along the current, the curled fingers show the direction of the field."

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In an MRI scanner hundreds of amperes flow through the coil without loss. How?
    params:
      options:
        - label: The coil is superconducting – cooled strongly it has no resistance
          correct: true
        - label: The cables are extra thick
          feedback: Thick cables have resistance too and would melt.
        - label: Alternating current is used
          feedback: The type of current does not change the resistance.
    hints:
      - The coil lies in liquid helium at −269 °C.
    explanation: In a **superconductor** current keeps flowing for years with no energy supplied.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Inside a long coil B = μ₀ · n · I with μ₀ = 1.26 · 10⁻⁶ T·m/A. The coil has n = 1000 turns per metre and carries 2 A. What is B in millitesla?
    params:
      unit: mT
    answer:
      value: 2.52
      tolerance: 0.03
    feedback:
      - when: abs(numval(state.input) - 0.00252) < 0.0001
        misconception: unit-milli
        text: That is B in tesla. Millitesla are asked for – times 1000.
    hints:
      - 1.26 · 10⁻⁶ · 1000 · 2 = ? tesla.
      - 1 T = 1000 mT.
    explanation: 2.52 · 10⁻³ T = 2.52 mT – fifty times Earth's field. An iron core boosts it a further hundred to thousand times.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Most magnets made from a coil have a core of iron. Why?
    params:
      options:
        - label: The atomic magnets in the iron align with the coil's field and multiply it many times.
          correct: true
        - label: Iron conducts current better.
          feedback: The current flows in the copper wire, not the core.
        - label: The core makes the coil sturdier.
          feedback: A plastic tube would do that too. The iron has a magnetic job.
    hints:
      - Iron is made of many small atomic magnets.
      - What do they do in an external field?
    explanation: In the coil's field the regions in the iron line up and add their fields. Soft iron loses the order again at switch-off – so the magnet can be turned off.
    difficulty: 3

srs:
  cards_from: [staerker, kran]
