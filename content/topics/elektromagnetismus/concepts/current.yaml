id: sci.em.current
type: concept
title: Strom macht Magnetismus
summary: Der Elektromagnet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Kran auf dem Schrottplatz hebt Autos mit einem Magneten – und lässt sie wieder fallen. Wie geht das?
    params:
      options:
        - label: Der Magnet wird mit Strom ein- und ausgeschaltet
          correct: true
        - label: Der Kran schüttelt sie ab
          feedback: Das wäre sehr mühsam.
        - label: Der Magnet wird schnell schwach
          feedback: Er hält, solange Strom fließt.
    hints:
      - Ein gewöhnlicher Magnet lässt nie los.
    explanation: Strom erzeugt Magnetismus. Kein Strom, kein Magnet.

  - kind: explain
    id: s1
    body: |
      Jeder Strom erzeugt ein Magnetfeld. Wickelt man einen Draht zu einer **Spule**, addieren sich die Felder – ein **Elektromagnet** entsteht, den man ein- und ausschalten kann.

  - kind: problem
    id: staerker
    widget: numeric
    prompt: Eine Spule bekommt bei gleichem Strom {{k}}-mal so viele Windungen. Wievielmal stärker wird das Feld ungefähr?
    params: { unit: "-mal" }
    answer: { value: "{{k}}" }
    hints:
      - Jede Windung trägt gleich viel bei.
    explanation: "{{k}}-mal so viele Windungen, {{k}}-mal so starkes Feld."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 2 }

  - kind: problem
    id: kran
    widget: choice
    prompt: Ein Kran hebt Schrott mit einem Elektromagneten. Warum nicht mit einem normalen Magneten?
    params:
      options:
        - { label: Man kann ihn abschalten und die Last loslassen., correct: true }
        - { label: Er ist billiger., feedback: "Der Vorteil ist das Schalten." }
    hints:
      - Wie bekommt man das Auto wieder vom Magneten?
    explanation: Strom aus – Feld weg – Schrott fällt herunter.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Steckt ein Elektromagnet drin?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Lautsprecher, bucket: ja }
        - { label: Türklingel, bucket: ja }
        - { label: MRT-Gerät, bucket: ja }
        - { label: Glühbirne, bucket: nein }
    hints:
      - Wo muss etwas mit Strom bewegt werden?
    explanation: Lautsprecher, Klingel und MRT nutzen schaltbare Magnetfelder.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Elektromagnet hat 200 Windungen bei 2 A. Du willst dieselbe Feldstärke mit nur 0,5 A. Wie viele Windungen brauchst du?
    answer:
      value: 800
    hints:
      - Windungen mal Strom muss gleich bleiben.
    explanation: 200 · 2 = 400 = 800 · 0,5.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In einem MRT-Gerät fließen Hunderte Ampere ohne Verlust durch die Spule. Wie geht das?
    params:
      options:
        - label: Die Spule ist supraleitend – stark gekühlt hat sie keinen Widerstand
          correct: true
        - label: Die Kabel sind besonders dick
          feedback: Auch dicke Kabel haben Widerstand und würden schmelzen.
        - label: Es wird Wechselstrom verwendet
          feedback: Die Stromart ändert nichts am Widerstand.
    hints:
      - Die Spule liegt in flüssigem Helium bei −269 °C.
    explanation: In einem **Supraleiter** fließt Strom jahrelang ohne Energiezufuhr weiter.
    difficulty: 3

srs:
  cards_from: [staerker, kran]
