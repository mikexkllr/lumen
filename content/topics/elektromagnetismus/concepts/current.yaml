id: sci.em.current
type: concept
title: Strom macht Magnetismus
summary: Der Elektromagnet.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Kran auf dem Schrottplatz hebt Autos mit einem Magneten – und lässt sie wieder fallen. Wie geht das?
    params:
      options:
        - label: Der Magnet wird mit Strom ein- und ausgeschaltet
          correct: true
        - label: Der Kran schüttelt sie ab
          feedback: Das wäre sehr mühsam.
        - label: Der Magnet wird schnell schwach
          feedback: Er hält, solange Strom fließt.
    hints:
      - Ein gewöhnlicher Magnet lässt nie los.
    explanation: Strom erzeugt Magnetismus. Kein Strom, kein Magnet.

  - kind: explain
    id: s1
    body: |
      Jeder Strom erzeugt ein Magnetfeld. Wickelt man einen Draht zu einer **Spule**, addieren sich die Felder – ein **Elektromagnet** entsteht, den man ein- und ausschalten kann.

  - kind: problem
    id: staerker
    widget: numeric
    prompt: Eine Spule bekommt bei gleichem Strom {{k}}-mal so viele Windungen. Wievielmal stärker wird das Feld ungefähr?
    params: { unit: "-mal" }
    answer: { value: "{{k}}" }
    hints:
      - Jede Windung trägt gleich viel bei.
    explanation: "{{k}}-mal so viele Windungen, {{k}}-mal so starkes Feld."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 2 }

  - kind: problem
    id: kran
    widget: choice
    prompt: Ein Kran hebt Schrott mit einem Elektromagneten. Warum nicht mit einem normalen Magneten?
    params:
      options:
        - { label: Man kann ihn abschalten und die Last loslassen., correct: true }
        - { label: Er ist billiger., feedback: "Der Vorteil ist das Schalten." }
    hints:
      - Wie bekommt man das Auto wieder vom Magneten?
    explanation: Strom aus – Feld weg – Schrott fällt herunter.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Steckt ein Elektromagnet drin?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Lautsprecher, bucket: ja }
        - { label: Türklingel, bucket: ja }
        - { label: MRT-Gerät, bucket: ja }
        - { label: Glühbirne, bucket: nein }
    hints:
      - Wo muss etwas mit Strom bewegt werden?
    explanation: Lautsprecher, Klingel und MRT nutzen schaltbare Magnetfelder.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Elektromagnet hat 200 Windungen bei 2 A. Du willst dieselbe Feldstärke mit nur 0,5 A. Wie viele Windungen brauchst du?
    answer:
      value: 800
    hints:
      - Windungen mal Strom muss gleich bleiben.
    explanation: 200 · 2 = 400 = 800 · 0,5.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Ein Kompass liegt unter einem Draht, der von Süd nach Nord läuft. Jetzt wird ein starker Strom eingeschaltet. Was passiert?
    params:
      options:
        - label: Die Nadel dreht sich quer zum Draht.
          correct: true
        - label: Nichts – Strom ist kein Magnet.
          feedback: Genau das widerlegte Ørsted 1820 mit diesem Versuch.
        - label: Die Nadel zeigt in Richtung des Stroms.
          feedback: Das Feld eines Drahtes läuft im Kreis **um** ihn herum, nicht entlang.
    hints:
      - Jeder Strom erzeugt ein Magnetfeld.
      - Die Feldlinien eines Drahtes sind Kreise um den Draht.
    explanation: Unter dem Draht zeigt das Feld nach Osten oder Westen. Die Nadel schwenkt mit. Ørsted entdeckte so 1820 den Zusammenhang von Strom und Magnetismus.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: "Um einen geraden Draht laufen die Feldlinien in Kreisen. Die Richtung zeigt die **Rechte-Hand-Regel**: Der Daumen zeigt in Stromrichtung, die gekrümmten Finger zeigen die Richtung des Feldes."

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In einem MRT-Gerät fließen Hunderte Ampere ohne Verlust durch die Spule. Wie geht das?
    params:
      options:
        - label: Die Spule ist supraleitend – stark gekühlt hat sie keinen Widerstand
          correct: true
        - label: Die Kabel sind besonders dick
          feedback: Auch dicke Kabel haben Widerstand und würden schmelzen.
        - label: Es wird Wechselstrom verwendet
          feedback: Die Stromart ändert nichts am Widerstand.
    hints:
      - Die Spule liegt in flüssigem Helium bei −269 °C.
    explanation: In einem **Supraleiter** fließt Strom jahrelang ohne Energiezufuhr weiter.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Im Inneren einer langen Spule ist B = μ₀ · n · I mit μ₀ = 1,26 · 10⁻⁶ T·m/A. Die Spule hat n = 1000 Windungen pro Meter und führt 2 A. Wie groß ist B in Millitesla?
    params:
      unit: mT
    answer:
      value: 2.52
      tolerance: 0.03
    feedback:
      - when: abs(numval(state.input) - 0.00252) < 0.0001
        misconception: unit-milli
        text: Das ist B in Tesla. Gefragt sind Millitesla – mal 1000.
    hints:
      - 1,26 · 10⁻⁶ · 1000 · 2 = ? Tesla.
      - 1 T = 1000 mT.
    explanation: 2,52 · 10⁻³ T = 2,52 mT – fünfzigmal so stark wie das Erdfeld. Ein Eisenkern verstärkt es noch um das Hundert- bis Tausendfache.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Warum steckt in fast jedem Elektromagneten ein Kern aus Eisen?
    params:
      options:
        - label: Die atomaren Magnete im Eisen richten sich nach dem Spulenfeld aus und verstärken es vielfach.
          correct: true
        - label: Eisen leitet den Strom besser.
          feedback: Der Strom fließt im Kupferdraht, nicht im Kern.
        - label: Der Kern macht die Spule stabiler.
          feedback: Ein Rohr aus Plastik täte das auch. Das Eisen hat eine magnetische Aufgabe.
    hints:
      - Eisen besteht aus vielen kleinen atomaren Magneten.
      - Was tun sie in einem äußeren Feld?
    explanation: Im Spulenfeld richten sich die Bereiche im Eisen aus und addieren ihr Feld. Weiches Eisen verliert die Ordnung beim Abschalten wieder – so lässt sich der Magnet ausschalten.
    difficulty: 3

srs:
  cards_from: [staerker, kran]
