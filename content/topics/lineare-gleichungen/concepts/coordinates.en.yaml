# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.coordinates
type: concept
title: Finding points
summary: First right, then up. That is how you find any point.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.coordinates]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Every place has two numbers
    body: Sat navs, maps and video games find every place with two numbers. Drag P onto the treasure S and watch its **coordinates** change. What does the minus mean?
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -5
          - 5
        y:
          - -5
          - 5
        points:
          - id: P
            x: 0
            y: 0
          - id: S
            x: 4
            y: -3
            draggable: false
        showCoordinates: true

  - kind: problem
    id: p-setzen
    widget: graph
    prompt: Drag point P to (3 | 2).
    params:
      x: [-5, 5]
      y: [-5, 5]
      points: [{ id: P, x: 0, y: 0 }]
    answer: { points: { P: { x: 3, y: 2 } } }
    feedback:
      - when: "state.points.P.x == 2 && state.points.P.y == 3"
        misconception: swapped-coordinates
        text: You swapped x and y. The first number says how far right. The second says how far up.
    hints:
      - The first number belongs to the horizontal axis.
      - From the origin, go 3 right and then 2 up.
    explanation: (3 | 2) means 3 right and 2 up.

  - kind: explain
    id: s2
    body: |
      A point has two **coordinates**: (x | y).
      **x** says how far right, or left if x is negative.
      **y** says how far up, or down.
    visual:
      widget: graph
      params:
        x: [-5, 5]
        y: [-5, 5]
        points: [{ id: P, x: 3, y: 2, draggable: false }]

  - kind: problem
    id: q-negativ
    widget: graph
    prompt: Put Q at (−2 | 4).
    params:
      points: [{ id: Q, x: 0, y: 0 }]
    answer: { points: { Q: { x: -2, y: 4 } } }
    feedback:
      - when: "state.points.Q.x == 2 && state.points.Q.y == 4"
        misconception: sign
        text: Almost! The minus in −2 means left, not right.
      - when: "state.points.Q.x == 4 && state.points.Q.y == -2"
        misconception: swapped-coordinates
        text: You swapped x and y. The horizontal value comes first.
    hints:
      - Negative x-values lie left of the origin.
    explanation: 2 left, 4 up.

  - kind: problem
    id: r-variante
    widget: graph
    prompt: Put R at ({{a}} | {{b}}).
    params:
      points: [{ id: R, x: 0, y: 0 }]
    answer: { points: { R: { x: "{{a}}", y: "{{b}}" } } }
    feedback:
      - when: "state.points.R.x == b && state.points.R.y == a && a != b"
        misconception: swapped-coordinates
        text: You swapped x and y. First right or left, then up or down.
    hints:
      - First the horizontal direction, then the vertical.
    explanation: "({{a}} | {{b}}): {{a}} on the x-axis, {{b}} on the y-axis."
    variants:
      params: { a: "nonzero[-4,4]", b: "nonzero[-4,4]" }
      defaults: { a: -3, b: -1 }

  - kind: problem
    id: wo-liegt
    widget: choice
    prompt: Where is the point (−3 | 2)?
    params:
      layout: grid
      options:
        - label: upper left
          correct: true
        - label: upper right
          feedback: The minus in −3 means left of the origin.
        - label: lower left
          feedback: y = 2 is positive, so it is up.
        - label: lower right
          feedback: Both directions are mixed up. −3 means left, 2 means up.
    hints:
      - What does the minus sign on x mean?
    explanation: x negative means left, y positive means up.

  - kind: problem
    id: waagerecht
    widget: graph
    prompt: Drag A and B so that segment AB is horizontal and exactly 4 long.
    params:
      points: [{ id: A, x: 0, y: 0 }, { id: B, x: 1, y: 2 }]
      segments: [[A, B]]
    check:
      predicate: "state.points.A.y == state.points.B.y && abs(state.points.A.x - state.points.B.x) == 4"
    feedback:
      - when: "state.points.A.y != state.points.B.y"
        text: Horizontal means both points have the same y-coordinate.
      - when: "state.points.A.y == state.points.B.y && abs(state.points.A.x - state.points.B.x) != 4"
        text: It is horizontal already. Only the length is still off.
    hints:
      - Horizontal means the same height.
      - Count the grid squares between A and B.
    explanation: For example A (0 | 0) and B (4 | 0). The y-values are equal, and the x-values are 4 apart.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: How far apart are (1 | 2) and (1 | −3)?
    answer: { value: 5 }
    feedback:
      - when: "abs(numval(state.input)) == 1"
        misconception: sign
        text: From 2 down to −3 is more steps than that. Count across zero.
    hints:
      - Both points have x = 1. So they lie one above the other.
      - Count from y = 2 to y = −3.
    explanation: From 2 to 0 is 2 steps, and from 0 to −3 is 3 more. That makes 5.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How long is the segment from (1, 1) to (4, 5)?
    answer:
      value: 5
    hints:
      - 3 right and 4 up – a right-angled triangle.
    explanation: √(3² + 4²) = 5.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: graph
    prompt: Put M exactly halfway between A and B.
    params:
      x:
        - -3
        - 5
      y:
        - -1
        - 6
      points:
        - id: A
          x: -2
          y: 1
          draggable: false
        - id: B
          x: 4
          y: 5
          draggable: false
        - id: M
          x: 0
          y: 0
      segments:
        - - A
          - B
    answer:
      points:
        M:
          x: 1
          y: 3
    hints:
      - "The middle of the x-values: (−2 + 4) : 2."
      - "The middle of the y-values: (1 + 5) : 2."
    explanation: M = (1 | 3). The midpoint is the average of both coordinates.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: In which quarter (quadrant) does the point lie?
    params:
      buckets:
        - id: b1
          label: top right
        - id: b2
          label: top left
        - id: b3
          label: bottom left
        - id: b4
          label: bottom right
      items:
        - label: (3 | 2)
          bucket: b1
        - label: (−1 | 4)
          bucket: b2
        - label: (−3 | −2)
          bucket: b3
        - label: (2 | −5)
          bucket: b4
        - label: (−4 | 1)
          bucket: b2
        - label: (5 | −1)
          bucket: b4
    hints:
      - The sign of x says right or left.
      - The sign of y says up or down.
    explanation: "x positive: right, x negative: left. y positive: up, y negative: down."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: A rectangle has corners (1 | 1), (5 | 1) and (5 | 4). The fourth corner is (1 | ?). What y-coordinate is missing?
    answer:
      value: 4
    hints:
      - The fourth corner is above (1 | 1).
      - It is as high as (5 | 4).
    explanation: (1 | 4). Opposite sides of the rectangle run parallel to the axes.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is the x-coordinate of the midpoint of the segment from (−3, 2) to (7, 6)?
    answer:
      value: 2
    hints:
      - Take the average of the two x-values.
    explanation: (−3 + 7) ÷ 2 = 2. The midpoint is (2, 4).
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: What is the area of the triangle with corners (0 | 0), (6 | 0) and (2 | 4)?
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 24
        misconception: forgot-half
        text: That is the rectangle. A triangle is half.
    hints:
      - "Base on the x-axis: 6."
      - "Height: the y-value of the top, 4."
    explanation: "6 · 4 : 2 = 12."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: In the 17th century René Descartes linked geometry and algebra. Every point becomes a pair of numbers, every line an equation. That is why the coordinate system is called **Cartesian**.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: In space a point has three coordinates (x | y | z). How many points have coordinates that are all 0 or 1?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 6
        misconception: add-options
        text: "Each of the three coordinates has 2 options: 2 · 2 · 2."
    hints:
      - 2 options each for x, y and z.
      - $2^3$.
    explanation: $2^3 = 8$ – exactly the corners of a cube.
    difficulty: 3

srs:
  cards_from: ["r-variante"]
