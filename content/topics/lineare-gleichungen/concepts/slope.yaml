# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.slope
type: concept
title: Steigung erkunden
summary: Ein Schritt nach rechts, m Schritte nach oben – das ist die Steigung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.slope]
estimated_minutes: 13
steps:
  - kind: problem
    id: durch-punkt
    widget: slider
    prompt: Stelle m so ein, dass die Gerade durch den Punkt (2 | 4) geht.
    params:
      expr: "m*x"
      sliders: [{ id: m, label: m, min: -3, max: 3, step: 0.5, initial: 0.5 }]
      markers: [{ x: 2, y: 4, label: Z }]
    answer: { values: { m: 2 } }
    hints:
      - Beobachte, was beim Verschieben des Reglers passiert.
      - Bei x = 2 soll y = 4 sein. Welches m passt zu m · 2 = 4?
    explanation: m · 2 = 4, also m = 2.

  - kind: explain
    id: s2
    body: |
      Die Zahl **m** heißt **Steigung**.
      Gehst du 1 nach rechts, geht die Gerade m nach oben.
      Bei m = 2 also 2 nach oben.
    visual:
      widget: slider
      params:
        expr: "m*x"
        sliders: [{ id: m, label: m, min: -3, max: 3, step: 0.5, initial: 2 }]

  - kind: problem
    id: zielgerade
    widget: slider
    prompt: Lege deine Linie genau auf die gestrichelte Linie.
    params:
      expr: "m*x + b"
      sliders:
        - { id: m, label: m, min: -3, max: 3, step: 0.5, initial: 1 }
        - { id: b, label: b, min: -4, max: 4, step: 1, initial: 0 }
      target: { expr: "0.5x + 1" }
    answer: { matchTarget: true }
    feedback:
      - when: "m == 0.5 && b != 1"
        text: Die Steilheit passt schon. Jetzt verschiebe die Gerade mit b nach oben oder unten.
      - when: "b == 1 && m != 0.5"
        text: Der Schnittpunkt mit der y-Achse passt. Jetzt fehlt noch die richtige Steilheit.
    hints:
      - Wo schneidet die Zielgerade die y-Achse? Das ist b.
      - Wie viel steigt sie pro Schritt nach rechts? Das ist m.
    explanation: Die Zielgerade schneidet die y-Achse bei 1 und steigt pro Schritt um 0,5. Also m = 0,5 und b = 1.
    difficulty: 2

  - kind: problem
    id: negativ
    widget: choice
    prompt: Was bewirkt ein negatives m?
    params:
      options:
        - label: Die Gerade fällt von links nach rechts.
          correct: true
        - label: Die Gerade liegt unter der x-Achse.
          feedback: Ob die Gerade oben oder unten liegt, hängt vor allem von b ab. m bestimmt die Richtung.
        - label: Die Gerade wird steiler.
          feedback: Steiler wird sie, wenn m weiter von 0 weg ist – egal ob positiv oder negativ.
    hints:
      - Probiere es oben mit dem Regler aus, oder stell dir m = −1 vor.
    explanation: Bei negativem m geht es pro Schritt nach rechts nach unten. Die Gerade fällt.

  - kind: problem
    id: b-ziehen
    widget: graph
    prompt: Ziehe B so, dass die Gerade durch A und B die Steigung 2 hat.
    params:
      points: [{ id: A, x: -1, y: -1, draggable: false }, { id: B, x: 2, y: 0 }]
      lines: [[A, B]]
    check:
      predicate: "slope('A', 'B') == 2"
    feedback:
      - when: "slope('A', 'B') == 0.5"
        misconception: run-over-rise
        text: Das ist Steigung 1/2. Du bist 2 nach rechts und 1 nach oben gegangen – umgekehrt wäre richtig.
    hints:
      - Steigung 2 heißt 1 nach rechts, 2 nach oben.
      - Starte bei A (−1 | −1) und gehe 1 nach rechts und 2 nach oben.
    explanation: Zum Beispiel B (0 | 1) – 1 nach rechts, 2 nach oben.
    difficulty: 2

  - kind: problem
    id: steigung-berechnen
    widget: numeric
    prompt: "Eine Gerade geht durch (0 | {{b}}) und ({{d}} | {{b + m * d}}). Wie groß ist ihre Steigung?"
    answer: { value: "{{m}}" }
    feedback:
      - when: "approx(numval(state.input), 1 / m) && m != 1"
        misconception: run-over-rise
        text: Du hast umgekehrt geteilt. Steigung = Höhenunterschied geteilt durch Schritte nach rechts.
      - when: "numval(state.input) == m * d && d != 1"
        text: Das ist der ganze Höhenunterschied. Teile ihn noch durch die {{d}} Schritte nach rechts.
    hints:
      - Wie viel geht es nach oben? Wie viel nach rechts?
      - "Steigung = {{m * d}} : {{d}}."
    explanation: "Höhenunterschied {{m * d}}, Schritte nach rechts {{d}}. Steigung = {{m * d}} : {{d}} = {{m}}."
    difficulty: 2
    variants:
      params: { m: "int[1,4]", b: "int[-2,2]", d: "choice[1,2,3]" }
      constraints: ["b + m * d <= 12"]
      defaults: { m: 3, b: 1, d: 2 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Bei m = 0 ist die Gerade waagerecht.
          right: true
        - text: Eine Gerade mit m = −3 steigt steil an.
          right: false
          why: Sie fällt steil.
        - text: In y = 2x + 5 schneidet die Gerade die y-Achse bei 5.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Gerade geht durch (1 | 3) und (4 | 9). Wo schneidet sie die y-Achse?
    answer:
      value: 1
    hints:
      - "Die Steigung ist 6 : 3 = 2. Geh von (1 | 3) einen Schritt nach links."
    explanation: y = 2x + 1.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Die Steigung aus zwei Punkten liefert das **Steigungsdreieck**: $m = (y_2 - y_1) : (x_2 - x_1)$. Von (1 | 3) nach (4 | 9) geht es 6 hoch und 3 nach rechts: m = 2."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Eine Gerade geht durch ({{a}} | {{b}}) und ({{a + d}} | {{b - m * d}}). Wie groß ist ihre Steigung?
    answer:
      value: "{{0 - m}}"
    feedback:
      - when: numval(state.input) == m
        misconception: sign
        text: Die Gerade fällt – die Steigung ist negativ.
    hints:
      - "Unterschied in y: {{0 - m * d}}. In x: {{d}}."
      - "{{0 - m * d}} : {{d}} = ?"
    explanation: "m = {{0 - m * d}} : {{d}} = {{0 - m}}."
    difficulty: 2
    variants:
      params:
        a: int[-3,3]
        b: int[2,8]
        d: int[1,4]
        m: int[1,3]
      defaults:
        a: 1
        b: 6
        d: 2
        m: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: slider
    prompt: Stelle m und b so ein, dass die Gerade $y = mx + b$ durch beide Punkte geht.
    params:
      expr: m*x + b
      x:
        - -2
        - 4
      y:
        - -4
        - 6
      showCoordinates: true
      sliders:
        - id: m
          label: m
          min: -3
          max: 3
          step: 0.5
          initial: 0
        - id: b
          label: b
          min: -4
          max: 4
          step: 1
          initial: 2
      markers:
        - x: 0
          y: -1
        - x: 2
          y: 3
    answer:
      values:
        m: 2
        b: -1
    hints:
      - b ist die Höhe bei x = 0.
      - "Von (0 | −1) nach (2 | 3): 4 hoch, 2 nach rechts."
    explanation: "b = −1 und m = 4 : 2 = 2. Die Gerade ist $y = 2x - 1$."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Zwei Geraden stehen senkrecht aufeinander. Eine hat die Steigung 2. Welche Steigung hat die andere?
    answer:
      value: -0.5
    hints:
      - Das Produkt der beiden Steigungen ist −1.
    explanation: 2 · (−1/2) = −1. Senkrechte Geraden haben den negativen Kehrwert als Steigung.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Zwei Geraden schneiden sich dort, wo beide Gleichungen gleichzeitig gelten. Das ist ein **Gleichungssystem**. Mit vielen Unbekannten schreibt man es als Matrix – so rechnen Computer.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Wo schneiden sich $y = 2x + 1$ und $y = -x + 7$? Gib die x-Koordinate an.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 5
        misconception: y-not-x
        text: Das ist die y-Koordinate des Schnittpunkts.
    hints:
      - "Setze beide gleich: $2x + 1 = -x + 7$."
      - $3x = 6$.
    explanation: x = 2, dann y = 5. Der Schnittpunkt ist (2 | 5).
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Wie viele Schnittpunkte haben $y = 3x + 2$ und $y = 3x - 5$?
    answer:
      value: 0
    feedback:
      - when: numval(state.input) == 1
        misconception: parallel
        text: "Gleiche Steigung, verschiedene Höhe: Die Geraden sind parallel."
    hints:
      - Vergleiche die Steigungen.
      - Gleichsetzen ergibt 2 = −5.
    explanation: Parallele Geraden treffen sich nie. Das Gleichungssystem hat keine Lösung.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was die Steigung m einer Geraden bedeutet.
    params:
      keywords:
        - - rechts
          - right
          - schritt
          - step
        - - hoch
          - oben
          - up
          - steigt
          - rises
        - - negativ
          - fällt
          - negative
          - falls
          - steil
          - steep
      sample: Die Steigung sagt, wie viel die Gerade pro Schritt nach rechts nach oben geht. Bei m = 2 geht es pro Schritt 2 hoch. Ist m negativ, fällt die Gerade.
    explanation: "Kernidee: m = Änderung in y pro Schritt in x."
    difficulty: 3

srs:
  cards_from: ["steigung-berechnen"]
