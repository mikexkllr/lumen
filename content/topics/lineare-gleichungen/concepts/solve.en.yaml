# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.solve
type: concept
title: Solving without the scale
summary: Every operation has an inverse. Use it to get x out of any simple equation.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.solve-two-step, alg.terms]
estimated_minutes: 17
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Weigh first, then calculate
    body: "Pros solve equations in their heads – but the same scale is still in there. Solve $2x + 5 = 17$ one last time with weights: first remove, then divide. Next you do the same steps with **inverse operations** only."
    visual:
      widget: balance
      interactive: true
      params:
        left:
          x: 2
          units: 5
        right:
          x: 0
          units: 17
        allow:
          - remove_unit
          - remove_x
          - divide

  - kind: problem
    id: minus
    widget: numeric
    prompt: "Solve: $x - 4 = 9$"
    answer: { value: 13 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: inverse-op
        text: You subtracted 4. But 4 was already subtracted here, so you must add 4.
    hints:
      - Which operation undoes "− 4"?
      - Add 4 on both sides.
    explanation: "x − 4 = 9 → add 4 to both sides → x = 13."

  - kind: explain
    id: s2
    body: |
      A **balance** scale can't show negative numbers. The rule still holds:
      plus and minus cancel each other, and so do times and divide.

  - kind: problem
    id: kacheln
    widget: tiles
    prompt: "Build the equation after the first step of $3x + 5 = 20$."
    params:
      tiles: ["3x", "=", "15", "25", "x", "+", "5"]
    answer:
      sequence: ["3x", "=", "15"]
    hints:
      - Remove 5 from both sides.
      - 3x stays on the left, and 20 − 5 on the right.
    feedback:
      - when: "state.placed.length == 3 && state.placed[2] == 3"
        misconception: inverse-op
        text: You added 5 instead of subtracting it.
    explanation: "3x + 5 = 20 → − 5 on both sides → 3x = 15."

  - kind: problem
    id: minus-variante
    widget: numeric
    prompt: "Solve: $x - {{a}} = {{b}}$"
    answer: { value: "{{a + b}}" }
    feedback:
      - when: "numval(state.input) == b - a"
        misconception: inverse-op
        text: You subtracted {{a}}. You undo "− {{a}}" with "+ {{a}}".
    hints:
      - Which operation undoes "− {{a}}"?
    explanation: "x = {{b}} + {{a}} = {{a + b}}."
    variants:
      params: { a: "int[2,9]", b: "int[2,12]" }
      constraints: ["b != a"]
      defaults: { a: 6, b: 8 }

  - kind: problem
    id: einsetzen
    widget: choice
    prompt: Which equation has the solution $x = 3$?
    params:
      options:
        - label: "2x + 1 = 7"
          correct: true
        - label: "x + 3 = 0"
          feedback: "Plug in: 3 + 3 = 6, not 0."
        - label: "4x = 7"
          feedback: "Plug in: 4 · 3 = 12, not 7."
        - label: "x − 3 = 3"
          feedback: "Plug in: 3 − 3 = 0, not 3."
    hints:
      - Plug in 3 for x and work out both sides.
    explanation: "Only 2 · 3 + 1 = 7 has equal sides."

  - kind: problem
    id: term-aufstellen
    widget: expression
    prompt: Write an expression for three times a number x, decreased by 2.
    answer: { equivalentTo: "3x - 2" }
    feedback:
      - when: "state.input.includes('(')"
        misconception: brackets
        text: You don't need parentheses here. Multiply by 3 first, then subtract 2.
    hints:
      - Three times x is written 3x.
      - Decreased by 2 means "− 2".
    explanation: "3x − 2"

  - kind: problem
    id: zwei-schritte-minus
    widget: numeric
    prompt: "Solve: ${{a}}x - {{u}} = {{a * b - u}}$"
    answer: { value: "{{b}}" }
    feedback:
      - when: "approx(numval(state.input), (a * b - u - u) / a)"
        misconception: inverse-op
        text: "Check this: you subtracted {{u}}. You undo \"− {{u}}\" with \"+ {{u}}\"."
    hints:
      - First add {{u}} to both sides.
      - "Then {{a}}x = {{a * b}} is left. Now divide."
    explanation: "+ {{u}}: {{a}}x = {{a * b}}. Divide by {{a}}: x = {{b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3,4]", b: "int[2,9]", u: "int[1,9]" }
      constraints: ["a * b - u > 0"]
      defaults: { a: 2, b: 7, u: 3 }

  - kind: problem
    id: klammer
    widget: expression
    prompt: "Expand the parentheses: $3(x + 2)$"
    answer: { equivalentTo: "3x + 6", form: expanded }
    feedback:
      - when: "state.input == '3x+2' || state.input == '3x + 2'"
        misconception: distributive-partial
        text: The 3 applies to both terms in the parentheses, including the 2.
    hints:
      - Multiply the 3 by each part inside the parentheses.
      - "3 · x and 3 · 2."
    explanation: "3(x + 2) = 3 · x + 3 · 2 = 3x + 6."
    difficulty: 2

  - kind: problem
    id: c1
    widget: order
    prompt: Solve $4(x - 1) = 2x + 6$. Order the steps.
    params:
      items:
        - label: $4x - 4 = 2x + 6$
        - label: $2x - 4 = 6$
        - label: $2x = 10$
        - label: $x = 5$
    hints:
      - Expand the bracket first.
    explanation: Expand, collect x, collect numbers, divide.

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: Solve $3x + 2 = 17$ on the scale until one box x is alone. Watch which inverse operation comes first.
    params:
      left:
        x: 3
        units: 2
      right:
        x: 0
        units: 17
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tipped. Always change both sides the same way.
    hints:
      - "Minus 2 undoes plus 2: take 2 weights off both sides."
      - "Dividing by 3 undoes times 3: divide both sides by 3."
    explanation: $3x + 2 = 17$ → $3x = 15$ → $x = 5$. First undo the plus, then the times.

  - kind: problem
    id: intro-c2
    widget: balance
    prompt: Solve $x + 11 = 3x + 1$ on the scale. Get one box x alone on one side.
    params:
      left:
        x: 1
        units: 11
      right:
        x: 3
        units: 1
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tipped. Always change both sides the same way.
    hints:
      - Take one box off each side, then 1 weight.
      - Then you have $10 = 2x$. Divide both sides by 2.
    explanation: $x + 11 = 3x + 1$ → $11 = 2x + 1$ → $10 = 2x$ → $5 = x$.
    difficulty: 2

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Three consecutive numbers add up to 72. What is the smallest?
    answer:
      value: 23
    hints:
      - Call them x, x + 1 and x + 2.
    explanation: 3x + 3 = 72, so x = 23.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "Solve: ${{a}}(x - {{b}}) = {{a * (s - b)}}$"
    answer:
      value: "{{s}}"
    feedback:
      - when: numval(state.input) == s - b
        misconception: stopped-early
        text: That is x − {{b}}. Now add {{b}}.
    hints:
      - Divide both sides by {{a}}.
      - $x - {{b}} = {{s - b}}$.
    explanation: $x - {{b}} = {{s - b}}$, so x = {{s}}.
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        b: int[1,3]
        s: int[4,9]
      defaults:
        a: 3
        b: 2
        s: 7

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Solve: $7 - 2x = 1$"
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == -3
        misconception: sign
        text: −2x = −6. Minus divided by minus gives plus.
    hints:
      - Subtract 7 from both sides.
      - $-2x = -6$.
    explanation: "x = 3. Check: 7 − 6 = 1."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: A rectangle is 3 cm longer than it is wide. Its perimeter is 26 cm. How wide is it?
    params:
      unit: cm
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 8
        misconception: length-not-width
        text: That is the length. The question asks for the width.
    hints:
      - Width b, length b + 3.
      - $2(b + b + 3) = 26$.
    explanation: $4b + 6 = 26$, so b = 5 cm and the length 8 cm.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A father is 40, his son 10. In how many years is the father exactly twice as old?
    answer:
      value: 20
    hints:
      - "In t years: 40 + t = 2 · (10 + t)."
    explanation: 40 + t = 20 + 2t gives t = 20. Then they are 60 and 30.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why may you do the same thing on both sides when solving an equation?"
    params:
      keywords:
        - - gleich
          - equal
          - same
          - balance
          - gleichgewicht
          - waage
        - - beide
          - both
          - seiten
          - sides
        - - lösung
          - wert
          - solution
          - value
          - stimmt
          - holds
      sample: An equation says both sides have the same value – like a scale in balance. If you change both sides alike, that stays true and the solution does not change.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "**Equivalence transformations** do not change the solutions. Squaring is not one: x = 3 turns into $x^2 = 9$ – and suddenly −3 fits too. So after squaring you need a check."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Rearrange $v = s : t$ for t. How long does a 150 km trip at 60 km/h take?"
    params:
      unit: h
    answer:
      value: 2.5
    feedback:
      - when: numval(state.input) == 9000
        misconception: multiply-instead
        text: "That is s · v. Rearranged, t = s : v."
    hints:
      - "Times t, then divide by v: $t = s : v$."
      - "150 : 60 = ?"
    explanation: "t = 150 : 60 = 2.5 h, so 2 hours 30 minutes."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Where is the mistake? $3x = 2x$, so (dividing by x) $3 = 2$.
    params:
      options:
        - label: Dividing by x – here x is 0
          correct: true
        - label: That equation is fine – it has the solution 0.
          feedback: Diese Gleichung ist in Ordnung – sie hat die Lösung 0.
        - label: Certainly not!
          feedback: Sicher nicht!
    hints:
      - Which number solves $3x = 2x$?
      - May you divide by 0?
    explanation: $3x = 2x$ only holds for x = 0. Dividing by x means dividing by 0 here – forbidden.
    difficulty: 3

srs:
  cards_from: ["minus-variante", "zwei-schritte-minus"]
