# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.solve
type: concept
title: Umformen ohne Waage
summary: Jede Rechnung hat eine Gegenrechnung – damit holst du x aus jeder einfachen Gleichung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.solve-two-step, alg.terms]
estimated_minutes: 9
steps:
  - kind: problem
    id: minus
    widget: numeric
    prompt: "Löse: $x - 4 = 9$"
    answer: { value: 13 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: inverse-op
        text: Du hast 4 abgezogen. Hier wurde aber schon 4 abgezogen – du musst 4 dazurechnen.
    hints:
      - Welche Rechnung macht »− 4« rückgängig?
      - Rechne auf beiden Seiten + 4.
    explanation: "x − 4 = 9 → auf beiden Seiten + 4 → x = 13."

  - kind: explain
    body: |
      Eine Waage kann keine negativen Zahlen zeigen. Die Regel gilt trotzdem:
      Plus und Minus heben sich auf, Mal und Geteilt auch.

  - kind: problem
    id: kacheln
    widget: tiles
    prompt: "Lege die Gleichung nach dem ersten Schritt von $3x + 5 = 20$."
    params:
      tiles: ["3x", "=", "15", "25", "x", "+", "5"]
    answer:
      sequence: ["3x", "=", "15"]
    hints:
      - Nimm auf beiden Seiten 5 weg.
      - Links bleibt 3x, rechts 20 − 5.
    feedback:
      - when: "state.placed.length == 3 && state.placed[2] == 3"
        misconception: inverse-op
        text: Du hast 5 dazugerechnet statt abgezogen.
    explanation: "3x + 5 = 20 → − 5 auf beiden Seiten → 3x = 15."

  - kind: problem
    id: minus-variante
    widget: numeric
    prompt: "Löse: $x - {{a}} = {{b}}$"
    answer: { value: "{{a + b}}" }
    feedback:
      - when: "numval(state.input) == b - a"
        misconception: inverse-op
        text: Du hast {{a}} abgezogen. Rückgängig machst du »− {{a}}« mit »+ {{a}}«.
    hints:
      - Welche Rechnung macht »− {{a}}« rückgängig?
    explanation: "x = {{b}} + {{a}} = {{a + b}}."
    variants:
      params: { a: "int[2,9]", b: "int[2,12]" }
      constraints: ["b != a"]
      defaults: { a: 6, b: 8 }

  - kind: problem
    id: einsetzen
    widget: choice
    prompt: Welche Gleichung hat die Lösung $x = 3$?
    params:
      options:
        - label: "2x + 1 = 7"
          correct: true
        - label: "x + 3 = 0"
          feedback: "Setze ein: 3 + 3 = 6, nicht 0."
        - label: "4x = 7"
          feedback: "Setze ein: 4 · 3 = 12, nicht 7."
        - label: "x − 3 = 3"
          feedback: "Setze ein: 3 − 3 = 0, nicht 3."
    hints:
      - Setze für x die 3 ein und rechne beide Seiten aus.
    explanation: "Nur bei 2 · 3 + 1 = 7 sind beide Seiten gleich."

  - kind: problem
    id: term-aufstellen
    widget: expression
    prompt: Schreibe als Term – das Dreifache einer Zahl x, vermindert um 2.
    answer: { equivalentTo: "3x - 2" }
    feedback:
      - when: "state.input.includes('(')"
        misconception: brackets
        text: Hier braucht es keine Klammer. Erst verdreifachen, dann 2 abziehen.
    hints:
      - Das Dreifache von x schreibt man 3x.
      - Vermindert um 2 heißt »− 2«.
    explanation: "3x − 2"

  - kind: problem
    id: zwei-schritte-minus
    widget: numeric
    prompt: "Löse: ${{a}}x - {{u}} = {{a * b - u}}$"
    answer: { value: "{{b}}" }
    feedback:
      - when: "approx(numval(state.input), (a * b - u - u) / a)"
        misconception: inverse-op
        text: "Prüfe: Du hast {{u}} abgezogen. Rückgängig machst du »− {{u}}« mit »+ {{u}}«."
    hints:
      - Rechne zuerst auf beiden Seiten + {{u}}.
      - "Dann bleibt {{a}}x = {{a * b}}. Jetzt teilen."
    explanation: "+ {{u}}: {{a}}x = {{a * b}}. Durch {{a}}: x = {{b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3,4]", b: "int[2,9]", u: "int[1,9]" }
      constraints: ["a * b - u > 0"]
      defaults: { a: 2, b: 7, u: 3 }

  - kind: problem
    id: klammer
    widget: expression
    prompt: "Löse die Klammer auf: $3(x + 2)$"
    answer: { equivalentTo: "3x + 6", form: expanded }
    feedback:
      - when: "state.input == '3x+2' || state.input == '3x + 2'"
        misconception: distributive-partial
        text: Die 3 gehört zu beiden Summanden in der Klammer – also auch zur 2.
    hints:
      - Die 3 multiplizierst du mit jedem Teil in der Klammer.
      - "3 · x und 3 · 2."
    explanation: "3(x + 2) = 3 · x + 3 · 2 = 3x + 6."
    difficulty: 2

srs:
  cards_from: ["steps[3]", "steps[6]"]
