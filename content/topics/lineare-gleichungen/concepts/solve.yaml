# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.solve
type: concept
title: Umformen ohne Waage
summary: Jede Rechnung hat eine Gegenrechnung – damit holst du x aus jeder einfachen Gleichung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.solve-two-step, alg.terms]
estimated_minutes: 14
steps:
  - kind: problem
    id: minus
    widget: numeric
    prompt: "Löse: $x - 4 = 9$"
    answer: { value: 13 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: inverse-op
        text: Du hast 4 abgezogen. Hier wurde aber schon 4 abgezogen – du musst 4 dazurechnen.
    hints:
      - Welche Rechnung macht »− 4« rückgängig?
      - Rechne auf beiden Seiten + 4.
    explanation: "x − 4 = 9 → auf beiden Seiten + 4 → x = 13."

  - kind: explain
    id: s2
    body: |
      Eine **Waage** kann keine negativen Zahlen zeigen. Die Regel gilt trotzdem:
      Plus und Minus heben sich auf, Mal und Geteilt auch.

  - kind: problem
    id: kacheln
    widget: tiles
    prompt: "Lege die Gleichung nach dem ersten Schritt von $3x + 5 = 20$."
    params:
      tiles: ["3x", "=", "15", "25", "x", "+", "5"]
    answer:
      sequence: ["3x", "=", "15"]
    hints:
      - Nimm auf beiden Seiten 5 weg.
      - Links bleibt 3x, rechts 20 − 5.
    feedback:
      - when: "state.placed.length == 3 && state.placed[2] == 3"
        misconception: inverse-op
        text: Du hast 5 dazugerechnet statt abgezogen.
    explanation: "3x + 5 = 20 → − 5 auf beiden Seiten → 3x = 15."

  - kind: problem
    id: minus-variante
    widget: numeric
    prompt: "Löse: $x - {{a}} = {{b}}$"
    answer: { value: "{{a + b}}" }
    feedback:
      - when: "numval(state.input) == b - a"
        misconception: inverse-op
        text: Du hast {{a}} abgezogen. Rückgängig machst du »− {{a}}« mit »+ {{a}}«.
    hints:
      - Welche Rechnung macht »− {{a}}« rückgängig?
    explanation: "x = {{b}} + {{a}} = {{a + b}}."
    variants:
      params: { a: "int[2,9]", b: "int[2,12]" }
      constraints: ["b != a"]
      defaults: { a: 6, b: 8 }

  - kind: problem
    id: einsetzen
    widget: choice
    prompt: Welche Gleichung hat die Lösung $x = 3$?
    params:
      options:
        - label: "2x + 1 = 7"
          correct: true
        - label: "x + 3 = 0"
          feedback: "Setze ein: 3 + 3 = 6, nicht 0."
        - label: "4x = 7"
          feedback: "Setze ein: 4 · 3 = 12, nicht 7."
        - label: "x − 3 = 3"
          feedback: "Setze ein: 3 − 3 = 0, nicht 3."
    hints:
      - Setze für x die 3 ein und rechne beide Seiten aus.
    explanation: "Nur bei 2 · 3 + 1 = 7 sind beide Seiten gleich."

  - kind: problem
    id: term-aufstellen
    widget: expression
    prompt: Schreibe als Term – das Dreifache einer Zahl x, vermindert um 2.
    answer: { equivalentTo: "3x - 2" }
    feedback:
      - when: "state.input.includes('(')"
        misconception: brackets
        text: Hier braucht es keine Klammer. Erst verdreifachen, dann 2 abziehen.
    hints:
      - Das Dreifache von x schreibt man 3x.
      - Vermindert um 2 heißt »− 2«.
    explanation: "3x − 2"

  - kind: problem
    id: zwei-schritte-minus
    widget: numeric
    prompt: "Löse: ${{a}}x - {{u}} = {{a * b - u}}$"
    answer: { value: "{{b}}" }
    feedback:
      - when: "approx(numval(state.input), (a * b - u - u) / a)"
        misconception: inverse-op
        text: "Prüfe: Du hast {{u}} abgezogen. Rückgängig machst du »− {{u}}« mit »+ {{u}}«."
    hints:
      - Rechne zuerst auf beiden Seiten + {{u}}.
      - "Dann bleibt {{a}}x = {{a * b}}. Jetzt teilen."
    explanation: "+ {{u}}: {{a}}x = {{a * b}}. Durch {{a}}: x = {{b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3,4]", b: "int[2,9]", u: "int[1,9]" }
      constraints: ["a * b - u > 0"]
      defaults: { a: 2, b: 7, u: 3 }

  - kind: problem
    id: klammer
    widget: expression
    prompt: "Löse die Klammer auf: $3(x + 2)$"
    answer: { equivalentTo: "3x + 6", form: expanded }
    feedback:
      - when: "state.input == '3x+2' || state.input == '3x + 2'"
        misconception: distributive-partial
        text: Die 3 gehört zu beiden Summanden in der Klammer – also auch zur 2.
    hints:
      - Die 3 multiplizierst du mit jedem Teil in der Klammer.
      - "3 · x und 3 · 2."
    explanation: "3(x + 2) = 3 · x + 3 · 2 = 3x + 6."
    difficulty: 2

  - kind: problem
    id: c1
    widget: order
    prompt: Löse $4(x - 1) = 2x + 6$. Ordne die Schritte.
    params:
      items:
        - label: $4x - 4 = 2x + 6$
        - label: $2x - 4 = 6$
        - label: $2x = 10$
        - label: $x = 5$
    hints:
      - Zuerst die Klammer auflösen.
    explanation: Klammer auf, x sammeln, Zahlen sammeln, teilen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Drei aufeinanderfolgende Zahlen ergeben zusammen 72. Wie heißt die kleinste?
    answer:
      value: 23
    hints:
      - Nenn sie x, x + 1 und x + 2.
    explanation: 3x + 3 = 72, also x = 23.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "Löse: ${{a}}(x - {{b}}) = {{a * (s - b)}}$"
    answer:
      value: "{{s}}"
    feedback:
      - when: numval(state.input) == s - b
        misconception: stopped-early
        text: Das ist x − {{b}}. Jetzt noch {{b}} addieren.
    hints:
      - Teile beide Seiten durch {{a}}.
      - $x - {{b}} = {{s - b}}$.
    explanation: $x - {{b}} = {{s - b}}$, also x = {{s}}.
    difficulty: 2
    variants:
      params:
        a: int[2,5]
        b: int[1,3]
        s: int[4,9]
      defaults:
        a: 3
        b: 2
        s: 7

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Löse: $7 - 2x = 1$"
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == -3
        misconception: sign
        text: −2x = −6. Minus durch minus ergibt plus.
    hints:
      - Zieh auf beiden Seiten 7 ab.
      - $-2x = -6$.
    explanation: "x = 3. Probe: 7 − 6 = 1."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Ein Rechteck ist 3 cm länger als breit. Sein Umfang ist 26 cm. Wie breit ist es?
    params:
      unit: cm
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 8
        misconception: length-not-width
        text: Das ist die Länge. Gefragt ist die Breite.
    hints:
      - Breite b, Länge b + 3.
      - $2(b + b + 3) = 26$.
    explanation: $4b + 6 = 26$, also b = 5 cm und die Länge 8 cm.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Vater ist 40, sein Sohn 10. In wie vielen Jahren ist der Vater genau doppelt so alt?
    answer:
      value: 20
    hints:
      - "In t Jahren: 40 + t = 2 · (10 + t)."
    explanation: 40 + t = 20 + 2t ergibt t = 20. Dann sind sie 60 und 30.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum darf man beim Lösen einer Gleichung auf beiden Seiten dasselbe tun?"
    params:
      keywords:
        - - gleich
          - equal
          - same
          - balance
          - gleichgewicht
          - waage
        - - beide
          - both
          - seiten
          - sides
        - - lösung
          - wert
          - solution
          - value
          - stimmt
          - holds
      sample: Eine Gleichung sagt, dass beide Seiten gleich viel wert sind – wie eine Waage im Gleichgewicht. Verändert man beide Seiten gleich, bleibt das so, und die Lösung ändert sich nicht.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "**Äquivalenzumformungen** ändern die Lösungen nicht. Quadrieren gehört nicht dazu: Aus x = 3 wird $x^2 = 9$ – und plötzlich passt auch −3. Darum braucht man nach dem Quadrieren eine Probe."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Stell die Formel $v = s : t$ nach t um. Wie lange dauert eine Fahrt von 150 km mit 60 km/h?"
    params:
      unit: h
    answer:
      value: 2.5
    feedback:
      - when: numval(state.input) == 9000
        misconception: multiply-instead
        text: "Das ist s · v. Umgestellt gilt t = s : v."
    hints:
      - "Mal t, dann durch v: $t = s : v$."
      - "150 : 60 = ?"
    explanation: "t = 150 : 60 = 2,5 h, also 2 Stunden 30 Minuten."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Wo steckt der Fehler? $3x = 2x$, also (durch x teilen) $3 = 2$.
    params:
      options:
        - label: Beim Teilen durch x – x ist hier 0
          correct: true
        - label: Bei $3x = 2x$
          feedback: Diese Gleichung ist in Ordnung – sie hat die Lösung 0.
        - label: Nirgends, 3 ist gleich 2
          feedback: Sicher nicht!
    hints:
      - Welche Zahl löst $3x = 2x$?
      - Darf man durch 0 teilen?
    explanation: $3x = 2x$ gilt nur für x = 0. Durch x teilen heißt hier durch 0 teilen – verboten.
    difficulty: 3

srs:
  cards_from: ["minus-variante", "zwei-schritte-minus"]
