# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.balance-02
type: concept
title: Gerecht teilen
summary: Mehrere Kisten? Teile beide Seiten durch dieselbe Zahl.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.solve-one-step, alg.solve-two-step]
estimated_minutes: 14
steps:
  - kind: problem
    id: zwei-kisten
    widget: balance
    params:
      left: { x: 2, units: 0 }
      right: { x: 0, units: 8 }
      allow: [remove_unit, remove_x, divide]
    prompt: Zwei gleich schwere Kisten wiegen zusammen 8. Bringe eine einzelne Kiste auf die Waage.
    hints:
      - Du kannst beide Seiten gerecht aufteilen.
      - Teile beide Seiten durch 2. Aus 2 Kisten wird 1, aus 8 Gewichten werden 4.
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: Die Waage kippt. Wegnehmen hilft hier nicht – versuch es mit Teilen.
    explanation: "Beide Seiten durch 2 teilen: Aus 2x = 8 wird x = 4."

  - kind: explain
    id: s2
    body: |
      **Teilen** ist erlaubt – solange du **beide** Seiten durch dieselbe Zahl teilst.
      Aus $2x = 8$ wird $x = 4$.

  - kind: problem
    id: erst-weg-dann-teilen
    widget: balance
    params:
      left: { x: "{{a}}", units: "{{u}}" }
      right: { x: 0, units: "{{a * b + u}}" }
      allow: [remove_unit, remove_x, divide]
    prompt: Bringe eine Kiste x allein auf die Waage.
    hints:
      - Nimm zuerst die einzelnen Gewichte weg.
      - Danach liegen nur noch Kisten links. Teile beide Seiten durch die Anzahl der Kisten.
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: Die Waage kippt. Verändere immer beide Seiten gleich.
    explanation: "Erst {{u}} wegnehmen: {{a}}x = {{a * b}}. Dann durch {{a}} teilen: x = {{b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3]", b: "int[2,4]", u: "int[1,4]" }
      constraints: ["a * b + u <= 16"]
      defaults: { a: 3, b: 4, u: 2 }

  - kind: problem
    id: erster-schritt
    widget: choice
    prompt: "Bei $3x + 2 = 14$: Was ist der beste erste Schritt?"
    params:
      options:
        - label: Auf beiden Seiten 2 wegnehmen
          correct: true
        - label: Beide Seiten durch 3 teilen
          feedback: Das geht nicht glatt – die 2 lässt sich nicht in 3 gleiche Teile teilen. Erst die 2 weg.
        - label: Links alle Kisten wegnehmen
          feedback: Dann wäre x verschwunden – und rechts fehlt der Ausgleich.
    hints:
      - Was stört, damit nur noch Kisten links liegen?
    explanation: "Erst 2 wegnehmen (3x = 12), dann durch 3 teilen (x = 4)."

  - kind: problem
    id: teilen-rechnen
    widget: numeric
    prompt: "Löse: ${{a}}x = {{a * b}}$"
    answer: { value: "{{b}}" }
    feedback:
      - when: "numval(state.input) == a * b - a"
        misconception: subtract-instead-of-divide
        text: "Du hast {{a}} abgezogen. Aber {{a}}x heißt {{a}} · x – das machst du mit Teilen rückgängig."
    hints:
      - "{{a}}x bedeutet: {{a}} Kisten. Wie schwer ist eine?"
      - "Teile {{a * b}} durch {{a}}."
    explanation: "Beide Seiten durch {{a}}: x = {{a * b}} : {{a}} = {{b}}."
    variants:
      params: { a: "choice[2,3,4,5]", b: "int[2,9]" }
      constraints: ["a * b - a != b"]
      defaults: { a: 4, b: 6 }

  - kind: problem
    id: reihenfolge
    widget: order
    prompt: "Bringe die Lösungsschritte für $2x + 6 = 14$ in die richtige Reihenfolge."
    params:
      items:
        - label: "2x + 6 = 14"
        - label: "2x = 8"
        - label: "x = 4"
        - label: "Probe: 2 · 4 + 6 = 14 ✓"
      startLabel: Anfang
      endLabel: Ende
    hints:
      - Was fällt zuerst weg – die 6 oder die 2 vor dem x?
    explanation: Erst 6 wegnehmen, dann durch 2 teilen. Die Probe kommt am Schluss.

  - kind: problem
    id: zwei-schritte
    widget: numeric
    prompt: "Löse: ${{a}}x + {{u}} = {{a * b + u}}$"
    answer: { value: "{{b}}" }
    feedback:
      - when: "approx(numval(state.input), (a * b + u) / a - u)"
        misconception: wrong-order
        text: Du hast zuerst geteilt und dann {{u}} abgezogen. Nimm zuerst die {{u}} weg, dann teile.
    hints:
      - Nimm zuerst die {{u}} auf beiden Seiten weg.
      - "Dann bleibt {{a}}x = {{a * b}}. Jetzt teilen."
    explanation: "{{a}}x + {{u}} = {{a * b + u}} → {{a}}x = {{a * b}} → x = {{b}}."
    difficulty: 2
    variants:
      params: { a: "choice[2,3,4,5]", b: "int[1,9]", u: "int[1,9]" }
      defaults: { a: 5, b: 3, u: 4 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Bei $3x + 2 = 14$ nimmst du erst auf beiden Seiten [[2]] weg. Dann teilst du durch [[3]]. Die Lösung ist [[4]].
      distractors:
        - "12"
        - "14"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Löse: $5x - 4 = 2x + 11$"
    answer:
      value: 5
    hints:
      - Bring alle x nach links und alle Zahlen nach rechts.
    explanation: 3x = 15, also x = 5.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Eine Gleichung zum Anfassen: 3 · x = 12. Links liegen 3 kg im Abstand x. Rechts liegen 4 kg bei 3 m. Finde x."
    params:
      scene: lever
      controls:
        m1:
          value: 3
          fixed: true
        d1:
          value: 1
        m2:
          value: 4
          fixed: true
        d2:
          value: 3
          fixed: true
    answer:
      tilt: 0
    explanation: x = 4. Die Waage ist im Gleichgewicht, wenn beide Seiten 12 ergeben.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: balance
    params:
      left:
        x: 4
        units: 1
      right:
        x: 2
        units: 9
      allow:
        - remove_unit
        - remove_x
        - divide
    prompt: "Löse auf der Waage: $4x + 1 = 2x + 9$. Am Ende soll eine Kiste x allein liegen."
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: Die Waage kippt. Verändere beide Seiten gleich.
    hints:
      - Nimm auf beiden Seiten 2 Kisten weg.
      - Dann 1 Gewicht weg und durch 2 teilen.
    explanation: $2x + 1 = 9$ → $2x = 8$ → $x = 4$.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Löse: ${{a}}x + {{u}} = {{c}}x + {{(a - c) * b + u}}$"
    answer:
      value: "{{b}}"
    hints:
      - "Bring alle x auf eine Seite: minus {{c}}x."
      - ${{a - c}}x = {{(a - c) * b}}$.
    explanation: ${{a - c}}x + {{u}} = {{(a - c) * b + u}}$, also ${{a - c}}x = {{(a - c) * b}}$ und x = {{b}}.
    difficulty: 2
    variants:
      params:
        a: int[3,6]
        c: int[1,2]
        b: int[1,6]
        u: int[1,9]
      defaults:
        a: 5
        c: 2
        b: 3
        u: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Löse: $(x + 4) : 3 = 5$"
    answer:
      value: 11
    feedback:
      - when: numval(state.input) == 1
        misconception: wrong-order
        text: Erst mal 3, dann minus 4 – die umgekehrte Reihenfolge.
    hints:
      - "Mach das Teilen zuerst rückgängig: mal 3."
      - $x + 4 = 15$.
    explanation: "x + 4 = 15, also x = 11. Probe: 15 : 3 = 5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Löse: $\\frac{x}{2} + \\frac{x}{3} = 10$"
    answer:
      value: 12
    hints:
      - Multipliziere beide Seiten mit 6.
    explanation: 3x + 2x = 60, also x = 12. Mit dem Hauptnenner malnehmen räumt Brüche weg.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Löse: $0{,}5x + 1{,}5 = 0{,}2x + 3$"
    answer:
      value: 5
    hints:
      - "Mal 10 macht alles ganzzahlig: $5x + 15 = 2x + 30$."
      - $3x = 15$.
    explanation: "x = 5. Probe: 2,5 + 1,5 = 4 und 1 + 3 = 4."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Ein Kino-Abo kostet 20 € plus 4 € pro Film. Ohne Abo zahlst du 9 € pro Film. Bei wie vielen Filmen kostet beides gleich viel?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 5
        misconception: difference-only
        text: Das ist der Preisunterschied pro Film. Teile die 20 € dadurch.
    hints:
      - "Gleichung: $20 + 4x = 9x$."
      - $20 = 5x$.
    explanation: "x = 4 Filme: beides 36 €. Ab dem 5. Film lohnt sich das Abo."
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: Bei $a \cdot x = b$ darf man nur durch a teilen, wenn a nicht 0 ist. Sonst gibt es keine oder unendlich viele Lösungen. Diese **Fallunterscheidung** taucht in der Mathematik ständig auf.

srs:
  cards_from: ["erst-weg-dann-teilen", "zwei-schritte"]
