# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.coordinates
type: concept
title: Punkte finden
summary: Erst nach rechts, dann nach oben – so findest du jeden Punkt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.coordinates]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Jeder Ort hat zwei Zahlen
    body: Navis, Landkarten und Computerspiele finden jeden Ort mit zwei Zahlen. Zieh P auf den Schatz S und beobachte, wie sich seine **Koordinaten** ändern. Was bedeutet das Minus?
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -5
          - 5
        y:
          - -5
          - 5
        points:
          - id: P
            x: 0
            y: 0
          - id: S
            x: 4
            y: -3
            draggable: false
        showCoordinates: true

  - kind: problem
    id: p-setzen
    widget: graph
    prompt: Ziehe den Punkt P auf (3 | 2).
    params:
      x: [-5, 5]
      y: [-5, 5]
      points: [{ id: P, x: 0, y: 0 }]
    answer: { points: { P: { x: 3, y: 2 } } }
    feedback:
      - when: "state.points.P.x == 2 && state.points.P.y == 3"
        misconception: swapped-coordinates
        text: Du hast x und y vertauscht. Die erste Zahl sagt, wie weit nach rechts. Die zweite, wie weit nach oben.
    hints:
      - Die erste Zahl gehört zur waagerechten Achse.
      - Gehe vom Ursprung 3 nach rechts und dann 2 nach oben.
    explanation: (3 | 2) heißt 3 nach rechts und 2 nach oben.

  - kind: explain
    id: s2
    body: |
      Ein Punkt hat zwei **Koordinaten**: (x | y).
      **x** sagt, wie weit nach rechts – oder links, wenn x negativ ist.
      **y** sagt, wie weit nach oben – oder unten.
    visual:
      widget: graph
      params:
        x: [-5, 5]
        y: [-5, 5]
        points: [{ id: P, x: 3, y: 2, draggable: false }]

  - kind: problem
    id: q-negativ
    widget: graph
    prompt: Setze Q auf (−2 | 4).
    params:
      points: [{ id: Q, x: 0, y: 0 }]
    answer: { points: { Q: { x: -2, y: 4 } } }
    feedback:
      - when: "state.points.Q.x == 2 && state.points.Q.y == 4"
        misconception: sign
        text: Fast! Das Minus bei −2 heißt nach links, nicht nach rechts.
      - when: "state.points.Q.x == 4 && state.points.Q.y == -2"
        misconception: swapped-coordinates
        text: Du hast x und y vertauscht. Erst kommt die Waagerechte.
    hints:
      - Negative x-Werte liegen links vom Ursprung.
    explanation: 2 nach links, 4 nach oben.

  - kind: problem
    id: r-variante
    widget: graph
    prompt: Setze R auf ({{a}} | {{b}}).
    params:
      points: [{ id: R, x: 0, y: 0 }]
    answer: { points: { R: { x: "{{a}}", y: "{{b}}" } } }
    feedback:
      - when: "state.points.R.x == b && state.points.R.y == a && a != b"
        misconception: swapped-coordinates
        text: Du hast x und y vertauscht. Erst rechts/links, dann oben/unten.
    hints:
      - Zuerst die waagerechte Richtung, dann die senkrechte.
    explanation: "({{a}} | {{b}}): {{a}} auf der x-Achse, {{b}} auf der y-Achse."
    variants:
      params: { a: "nonzero[-4,4]", b: "nonzero[-4,4]" }
      defaults: { a: -3, b: -1 }

  - kind: problem
    id: wo-liegt
    widget: choice
    prompt: Wo liegt der Punkt (−3 | 2)?
    params:
      layout: grid
      options:
        - label: links oben
          correct: true
        - label: rechts oben
          feedback: Das Minus bei −3 heißt links vom Ursprung.
        - label: links unten
          feedback: y = 2 ist positiv – also oben.
        - label: rechts unten
          feedback: Beide Richtungen sind vertauscht. −3 heißt links, 2 heißt oben.
    hints:
      - Was bedeutet das Minuszeichen bei x?
    explanation: x negativ → links, y positiv → oben.

  - kind: problem
    id: waagerecht
    widget: graph
    prompt: Ziehe A und B so, dass die Strecke AB waagerecht und genau 4 lang ist.
    params:
      points: [{ id: A, x: 0, y: 0 }, { id: B, x: 1, y: 2 }]
      segments: [[A, B]]
    check:
      predicate: "state.points.A.y == state.points.B.y && abs(state.points.A.x - state.points.B.x) == 4"
    feedback:
      - when: "state.points.A.y != state.points.B.y"
        text: Waagerecht heißt, beide Punkte haben dieselbe y-Koordinate.
      - when: "state.points.A.y == state.points.B.y && abs(state.points.A.x - state.points.B.x) != 4"
        text: Waagerecht ist sie schon. Jetzt stimmt nur die Länge noch nicht.
    hints:
      - Waagerecht bedeutet gleiche Höhe.
      - Zähle die Kästchen zwischen A und B.
    explanation: Zum Beispiel A (0 | 0) und B (4 | 0). Gleiche y-Werte, x-Werte 4 auseinander.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: Wie weit liegen (1 | 2) und (1 | −3) auseinander?
    answer: { value: 5 }
    feedback:
      - when: "abs(numval(state.input)) == 1"
        misconception: sign
        text: Von 2 nach unten bis −3 sind es mehr Schritte. Zähle über die Null hinweg.
    hints:
      - Beide Punkte haben x = 1. Sie liegen also übereinander.
      - Zähle von y = 2 bis y = −3.
    explanation: Von 2 bis 0 sind es 2 Schritte, von 0 bis −3 noch 3. Zusammen 5.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie lang ist die Strecke von (1 | 1) nach (4 | 5)?
    answer:
      value: 5
    hints:
      - 3 nach rechts und 4 nach oben – ein rechtwinkliges Dreieck.
    explanation: √(3² + 4²) = 5.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: graph
    prompt: Setze M genau in die Mitte zwischen A und B.
    params:
      x:
        - -3
        - 5
      y:
        - -1
        - 6
      points:
        - id: A
          x: -2
          y: 1
          draggable: false
        - id: B
          x: 4
          y: 5
          draggable: false
        - id: M
          x: 0
          y: 0
      segments:
        - - A
          - B
    answer:
      points:
        M:
          x: 1
          y: 3
    hints:
      - "Die Mitte der x-Werte: (−2 + 4) : 2."
      - "Die Mitte der y-Werte: (1 + 5) : 2."
    explanation: M = (1 | 3). Der Mittelpunkt ist der Durchschnitt beider Koordinaten.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: buckets
    prompt: In welchem Viertel (Quadranten) liegt der Punkt?
    params:
      buckets:
        - id: b1
          label: rechts oben
        - id: b2
          label: links oben
        - id: b3
          label: links unten
        - id: b4
          label: rechts unten
      items:
        - label: (3 | 2)
          bucket: b1
        - label: (−1 | 4)
          bucket: b2
        - label: (−3 | −2)
          bucket: b3
        - label: (2 | −5)
          bucket: b4
        - label: (−4 | 1)
          bucket: b2
        - label: (5 | −1)
          bucket: b4
    hints:
      - Das Vorzeichen von x sagt rechts oder links.
      - Das Vorzeichen von y sagt oben oder unten.
    explanation: "x positiv: rechts, x negativ: links. y positiv: oben, y negativ: unten."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Ein Rechteck hat die Ecken (1 | 1), (5 | 1) und (5 | 4). Die vierte Ecke ist (1 | ?). Welche y-Koordinate fehlt?
    answer:
      value: 4
    hints:
      - Die vierte Ecke liegt über (1 | 1).
      - Sie liegt so hoch wie (5 | 4).
    explanation: (1 | 4). Gegenüberliegende Seiten eines Rechtecks sind parallel zu den Achsen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Welche x-Koordinate hat der Mittelpunkt der Strecke von (−3 | 2) nach (7 | 6)?
    answer:
      value: 2
    hints:
      - Nimm den Durchschnitt der beiden x-Werte.
    explanation: "(−3 + 7) : 2 = 2. Der Mittelpunkt ist (2 | 4)."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Wie groß ist die Fläche des Dreiecks mit den Ecken (0 | 0), (6 | 0) und (2 | 4)?
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 24
        misconception: forgot-half
        text: Das ist das Rechteck. Ein Dreieck ist die Hälfte.
    hints:
      - "Grundseite auf der x-Achse: 6."
      - "Höhe: der y-Wert der Spitze, 4."
    explanation: "6 · 4 : 2 = 12."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: René Descartes verband im 17. Jahrhundert Geometrie und Algebra. Jeder Punkt wird ein Zahlenpaar, jede Linie eine Gleichung. Darum heißt das Koordinatensystem **kartesisch**.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Im Raum hat ein Punkt drei Koordinaten (x | y | z). Wie viele Punkte gibt es, deren Koordinaten alle 0 oder 1 sind?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 6
        misconception: add-options
        text: "Jede der drei Koordinaten hat 2 Möglichkeiten: 2 · 2 · 2."
    hints:
      - 2 Möglichkeiten für x, für y und für z.
      - $2^3$.
    explanation: $2^3 = 8$ – das sind genau die Ecken eines Würfels.
    difficulty: 3

srs:
  cards_from: ["r-variante"]
