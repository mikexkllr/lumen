# yaml-language-server: $schema=../../../lumen.schema.json
id: alg.linear.balance-01
type: concept
title: Equations as a balance scale
summary: Whatever you do on the left, do on the right too. Then everything stays balanced.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [alg.balance, alg.solve-one-step]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Don't let it tip!
    body: A scale shows at once whether two sides weigh the same. Take a weight off one side or add one, and watch it tip. How do you get it back into **balance**?
    visual:
      widget: balance
      interactive: true
      params:
        left:
          x: 1
          units: 2
        right:
          x: 0
          units: 8
        allow:
          - remove_unit
          - add_unit

  - kind: problem
    id: ma-hook
    widget: estimate
    prompt: "Gut feeling: a box and 3 weights weigh as much as 7 weights. How many weights does the box weigh?"
    params:
      min: 0
      max: 10
      step: 1
    answer:
      value: 4
      tolerance: 0
    explanation: 3 + 4 = 7. The box weighs 4. Next you will see how a balance solves such puzzles.

  - kind: explain
    id: s1
    body: |
      On the scale, there is a crate **x** and 3 weights on the left. There are 7 weights on the right.
      The scale is **balanced**: both sides weigh the same.
    visual:
      widget: balance
      params: { left: { x: 1, units: 3 }, right: { x: 0, units: 7 } }

  - kind: problem
    id: kippt
    widget: choice
    visual:
      widget: balance
      params: { left: { x: 1, units: 3 }, right: { x: 0, units: 7 } }
    prompt: What happens if you remove a weight from the left side only?
    params:
      options:
        - label: The scale tips to the right.
          correct: true
        - label: The scale tips to the left.
          feedback: The left side gets lighter, not heavier. The heavier side sinks.
        - label: It stays balanced.
          feedback: Then the left side is missing a weight and the right is not. The balance is gone.
    hints:
      - Which side is heavier afterward?
    explanation: The left side is missing a weight, the right is not. The right side is heavier and sinks.

  - kind: problem
    id: x-allein
    widget: balance
    params:
      left: { x: 1, units: "{{a}}" }
      right: { x: 0, units: "{{a + b}}" }
      allow: [remove_unit]
    prompt: Remove weights until crate x is alone. The scale must not tip.
    check:
      predicate: "state.left.x == 1 && state.left.units == 0 && state.right.units == b && state.balanced"
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tipped! You changed only one side. Always remove the same amount from both sides.
    hints:
      - Remove the same amount from both sides.
      - How many weights must leave the left so x is alone? Remove just as many on the right.
    explanation: There are {{a}} weights next to x on the left. Remove {{a}} from both sides. {{b}} remain on the right, so x = {{b}}.
    variants:
      params: { a: "int[1,6]", b: "int[1,8]" }
      defaults: { a: 3, b: 4 }

  - kind: explain
    id: s4
    body: |
      That was a **transformation**: you did the same thing to **both sides**.
      $x + 3 = 7$ became $x = 4$ because you removed 3 from both sides.

  - kind: problem
    id: kisten-beide-seiten
    widget: balance
    params:
      left: { x: 2, units: 1 }
      right: { x: 1, units: 6 }
      allow: [remove_unit, remove_x]
    prompt: Now there are crates on both sides. Get one crate x alone on one side.
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tips. You also remove crates from both sides at once.
    hints:
      - You can remove a crate from both sides too.
      - First remove one crate from both sides. Then deal with the weights.
    explanation: "From 2x + 1 = x + 6, removing one crate gives x + 1 = 6, then x = 5."

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: "Solve without the scale: $x + {{a}} = {{a + b}}$"
    answer: { value: "{{b}}" }
    feedback:
      - when: "numval(state.input) == a + (a + b)"
        misconception: inverse-op
        text: You added. To get x alone, you must remove {{a}} from both sides.
    hints:
      - Which number must you remove from both sides?
      - "Calculate {{a + b}} − {{a}}."
    explanation: "Remove {{a}} from both sides: x = {{a + b}} − {{a}} = {{b}}."
    difficulty: 2
    variants:
      params: { a: "int[2,9]", b: "int[1,9]" }
      defaults: { a: 5, b: 7 }

  - kind: problem
    id: welche-umformung
    widget: choice
    prompt: Which transformation keeps the scale balanced?
    params:
      options:
        - label: Remove 2 weights from both sides
          correct: true
        - label: Remove 2 from the left, add 2 to the right
          feedback: The left gets lighter and the right heavier. The scale tips twice as far.
        - label: Remove 2 weights from the right only
          feedback: Changing only one side always throws the scale off balance.
    hints:
      - Both sides must change the same way.
    explanation: The scale stays balanced only if both sides lose (or gain) the same amount.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Taking 3 away on both sides keeps the scale balanced.
          right: true
        - text: You may change only the left side.
          right: false
          why: Then the scale tips. Always treat both sides alike.
        - text: From x + 5 = 12 follows x = 7.
          right: true

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: On the left are 3 boxes and 2 weights, on the right 2 boxes and 7 weights. Get one box x alone on one side.
    params:
      left:
        x: 3
        units: 2
      right:
        x: 2
        units: 7
      allow:
        - remove_unit
        - remove_x
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tipped. Always change both sides the same way.
    hints:
      - First take the same number of boxes off both sides.
      - After removing 2 boxes you have $x + 2 = 7$. Now take 2 weights off both sides.
    explanation: $3x + 2 = 2x + 7$ → $x + 2 = 7$ → $x = 5$.

  - kind: problem
    id: intro-c2
    widget: balance
    prompt: "This time the right side has more boxes: $x + 7 = 2x + 3$. Get one box x alone on the scale – either side is fine."
    params:
      left:
        x: 1
        units: 7
      right:
        x: 2
        units: 3
      allow:
        - remove_unit
        - remove_x
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tipped. Always change both sides the same way.
    hints:
      - Take one box off each side. Then only weights are left on the left.
      - Now you have $7 = x + 3$. Take 3 weights off both sides.
    explanation: $x + 7 = 2x + 3$ → $7 = x + 3$ → $4 = x$. The box may just as well be alone on the right.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Solve: $2x + 3 = x + 10$"
    answer:
      value: 7
    hints:
      - Take one box x away on both sides.
    explanation: x + 3 = 10, so x = 7.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: balance
    params:
      left:
        x: 3
        units: 2
      right:
        x: 1
        units: 8
      allow:
        - remove_unit
        - remove_x
        - divide
    prompt: "Left: 3 boxes and 2 weights. Right: 1 box and 8 weights. Get a single box x alone on the balance."
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The balance tips! Do the same on both sides.
    hints:
      - First take one box off each side.
      - Then the weights, then divide.
    explanation: 3x + 2 = x + 8 → 2x + 2 = 8 → 2x = 6 → x = 3.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "A **check** shows whether a solution is right: put it into the equation. For x + 3 = 7 and x = 4 the left side gives 7 – it fits."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Is x = 5 the solution of $3x - 4 = 2x + 2$? Work out the left side for x = 5.
    answer:
      value: 11
    hints:
      - 3 · 5 − 4.
      - The right side gives 2 · 5 + 2 = 12.
    explanation: Left 11, right 12 – no match. x = 5 is not a solution. The right one is x = 6.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How many solutions does $x + 3 = x + 5$ have?
    params:
      options:
        - label: None
          correct: true
        - label: "Exactly one: x = 2"
          feedback: "Put in 2: 5 = 7 is false."
        - label: Infinitely many
          feedback: That would be the case for x + 3 = x + 3.
    hints:
      - Take x away on both sides. What is left?
    explanation: What remains is 3 = 5 – always false. An equation can have no, one or infinitely many solutions.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: How many solutions does $2(x + 1) = 2x + 2$ have?
    params:
      options:
        - label: "Plug in x = 0: 2 = 2. So there is at least one."
          feedback: "Setze x = 0 ein: 2 = 2. Es gibt also mindestens eine."
        - label: Try x = 0 and x = 7. Both work.
          feedback: Probiere x = 0 und x = 7. Beide passen.
        - label: Infinitely many – every number
          correct: true
    hints:
      - Expand the left side.
      - "Both sides are the same: 2x + 2."
    explanation: The same term is on both sides. The equation holds for every x.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Linear equations have no solution, one, or infinitely many. If you end up with 0 = 2, there is none. If you end up with 0 = 0, every number fits. That is called an **identity**.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what a solution of an equation is.
    params:
      keywords:
        - - einsetz
          - setzt
          - plug
          - substitut
          - put in
        - - beide seiten
          - gleich
          - both sides
          - equal
          - same
        - - wahr
          - stimmt
          - "true"
          - holds
          - balance
          - gleichgewicht
      sample: A solution is a number you plug in for x so that both sides are equal. The equation becomes true – the balance stays level.
    explanation: "Key idea: solution = a number that makes both sides equal when plugged in."
    difficulty: 3

srs:
  cards_from: ["x-allein", "rechnen"]
