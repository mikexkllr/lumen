id: ai.safety.privacy
type: concept
title: Daten und Privatsphäre
summary: Was man einer KI besser nicht erzählt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Reise deiner Worte
    body: "Ein KI-Chat fühlt sich an wie ein Gespräch unter vier Augen. Doch deine Worte gehen auf Reisen. Deck die Stationen auf: Wo landet deine **Nachricht** überall?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: ⌨️
            front: Du tippst
            back: Name, Adresse, eine Krankheit – schnell in den Chat geschrieben.
          - icon: 🖥️
            front: Der Server
            back: Der Text landet beim Anbieter und wird dort oft lange gespeichert.
          - icon: 👀
            front: Mitlesen
            back: Zur Qualitätskontrolle lesen manchmal Menschen Gespräche mit.
          - icon: 🧠
            front: Das nächste Modell
            back: Je nach Einstellung lernt ein künftiges Modell aus deinen Gesprächen.

  - kind: problem
    id: tippen
    widget: buckets
    prompt: Würdest du das in einen öffentlichen KI-Chat tippen?
    params:
      buckets: [{ label: eher unbedenklich }, { label: lieber nicht }]
      items:
        - { label: Eine Frage zu Photosynthese, bucket: eher unbedenklich }
        - { label: "Ein Rezept, das du verbessern willst", bucket: eher unbedenklich }
        - { label: Ein Passwort, bucket: lieber nicht }
        - { label: Die Krankenakte einer Freundin, bucket: lieber nicht }
    hints:
      - Wem gehören die Daten, und wer könnte sie später sehen?
    explanation: Eingaben können gespeichert und je nach Dienst ausgewertet werden.

  - kind: explain
    id: s2
    body: |
      Daten zu **anonymisieren** ist schwerer, als es klingt. Schon wenige Angaben zusammen können einen Menschen eindeutig verraten.

  - kind: problem
    id: eindeutig
    widget: choice
    prompt: Reichen Postleitzahl, Geburtsdatum und Geschlecht, um die meisten Menschen eindeutig zu erkennen?
    params:
      options:
        - { label: Ja – für die große Mehrheit, correct: true }
        - { label: Nein – dafür braucht man den Namen, feedback: "Eine bekannte Studie fand: Etwa 87 % der US-Bevölkerung sind damit eindeutig." }
    hints:
      - Wie viele Menschen teilen PLZ und genauen Geburtstag?
    explanation: Kombinationen harmloser Angaben sind oft so einzigartig wie ein Fingerabdruck.

  - kind: problem
    id: schutz
    widget: choice
    prompt: Was schützt am besten, wenn du eine KI für persönliche Texte nutzt?
    params:
      options:
        - { label: Namen und Details vorher entfernen oder ändern, correct: true }
        - { label: "Höflich bitten, nichts zu speichern", feedback: "Eine Bitte im Chat ändert nichts an der Speicherung." }
    hints:
      - Was nie eingegeben wurde, kann auch nicht verloren gehen.
    explanation: Datensparsamkeit beginnt bei dir selbst.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Persönliche Angabe oder nicht?
    params:
      buckets:
        - id: b1
          label: Persönlich
        - id: b2
          label: Nicht persönlich
      items:
        - label: Geburtsdatum
          bucket: b1
        - label: Wetter von gestern
          bucket: b2
        - label: Standortverlauf des Handys
          bucket: b1
        - label: Einwohnerzahl einer Stadt
          bucket: b2
        - label: Stimme in einer Aufnahme
          bucket: b1
    hints:
      - Lässt sich daraus auf einen einzelnen Menschen schließen?
    explanation: Persönlich ist alles, was sich einem Menschen zuordnen lässt.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Firma stellt Noten für Filme ins Netz – ohne Namen. Forscher finden trotzdem heraus, wer wer ist. Wie?
    params:
      options:
        - label: Sie gleichen die Bewertungen mit öffentlichen Profilen auf anderen Seiten ab
          correct: true
        - label: Sie hacken die Firma
          feedback: Es genügten öffentlich zugängliche Daten.
        - label: Sie raten
          feedback: Die Zuordnung war statistisch sehr sicher.
    hints:
      - Wenige Bewertungen mit Datum sind schon fast wie ein Fingerabdruck.
    explanation: So geschehen 2006 bei Netflix. Daten, die allein harmlos wirken, verraten kombiniert sehr viel.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der Menschen in den USA sind allein durch Postleitzahl, Geburtsdatum und Geschlecht eindeutig bestimmt?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 87
      tolerance: 10
    explanation: Rund 87 %. Drei harmlose Angaben zusammen wirken wie ein Name.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Es gibt rund 8000 Postleitzahlen, etwa 29 200 mögliche Geburtstage (80 Jahrgänge) und 2 Angaben zum Geschlecht. Wie viele Millionen Kombinationen sind das? Gerundet.
    answer:
      value: 467
      tolerance: 2
    hints:
      - "Multipliziere: 8000 · 29 200 · 2."
      - Das sind etwa 467 000 000.
    explanation: Rund 467 Millionen Fächer für etwa 84 Millionen Menschen. Die meisten Fächer sind leer, viele enthalten genau eine Person. Darum sind solche Angaben oft **eindeutig** – auch ohne Namen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei **Differential Privacy** fügt man Statistiken gezielt Zufallsrauschen hinzu. Was garantiert das?
    params:
      options:
        - label: Aus dem Ergebnis lässt sich praktisch nicht erkennen, ob eine bestimmte Person in den Daten war
          correct: true
        - label: Dass die Statistik exakt stimmt
          feedback: Sie wird bewusst leicht ungenau.
        - label: Dass niemand die Daten stehlen kann
          feedback: Es schützt die Auswertung, nicht den Speicher.
    hints:
      - Das Ergebnis soll mit und ohne dich fast gleich aussehen.
    explanation: "Ein messbarer Tausch: etwas Genauigkeit gegen beweisbaren Schutz. Volkszählungen und Smartphones nutzen das."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein Angreifer will wissen, ob die Daten einer bestimmten Person im Training eines Modells steckten. Geht das?
    params:
      options:
        - label: Oft teilweise – Modelle reagieren auf Trainingsbeispiele anders als auf fremde.
          correct: true
        - label: Nie – das Modell speichert keine Daten.
          feedback: Modelle können sich einzelne Beispiele merken, besonders seltene.
        - label: Immer sicher.
          feedback: Es ist ein statistischer Angriff mit Fehlern – aber ein echtes Risiko.
    hints:
      - Wie sicher ist ein Modell bei Beispielen, die es schon gesehen hat?
      - Ein Unterschied in der Sicherheit verrät etwas.
    explanation: Das heißt **Mitgliedschaftsangriff**. Er zeigt, dass Trainingsdaten durchsickern können. Abhilfe schaffen Differential Privacy, weniger Auswendiglernen und sorgfältige Datenauswahl.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum »anonyme« Daten oft gar nicht anonym sind.
    params:
      keywords:
        - - kombin
          - zusammen
          - combin
          - together
        - - eindeutig
          - einzig
          - unique
          - single
        - - postleitzahl
          - geburt
          - postcode
          - birth
      sample: Einzelne Angaben wie Postleitzahl, Geburtsdatum und Geschlecht sind harmlos. Zusammen kombiniert passen sie aber oft nur auf eine einzige Person. Mit anderen Daten kann man sie dann eindeutig erkennen.
    difficulty: 3

srs:
  cards_from: [tippen, eindeutig]
