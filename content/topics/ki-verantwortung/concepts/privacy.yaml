id: ai.safety.privacy
type: concept
title: Daten und Privatsphäre
summary: Was man einer KI besser nicht erzählt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: tippen
    widget: buckets
    prompt: Würdest du das in einen öffentlichen KI-Chat tippen?
    params:
      buckets: [{ label: eher unbedenklich }, { label: lieber nicht }]
      items:
        - { label: Eine Frage zu Photosynthese, bucket: eher unbedenklich }
        - { label: "Ein Rezept, das du verbessern willst", bucket: eher unbedenklich }
        - { label: Ein Passwort, bucket: lieber nicht }
        - { label: Die Krankenakte einer Freundin, bucket: lieber nicht }
    hints:
      - Wem gehören die Daten, und wer könnte sie später sehen?
    explanation: Eingaben können gespeichert und je nach Dienst ausgewertet werden.

  - kind: explain
    body: |
      Daten zu **anonymisieren** ist schwerer, als es klingt. Schon wenige Angaben zusammen können einen Menschen eindeutig verraten.

  - kind: problem
    id: eindeutig
    widget: choice
    prompt: Reichen Postleitzahl, Geburtsdatum und Geschlecht, um die meisten Menschen eindeutig zu erkennen?
    params:
      options:
        - { label: Ja – für die große Mehrheit, correct: true }
        - { label: Nein – dafür braucht man den Namen, feedback: "Eine bekannte Studie fand: Etwa 87 % der US-Bevölkerung sind damit eindeutig." }
    hints:
      - Wie viele Menschen teilen PLZ und genauen Geburtstag?
    explanation: Kombinationen harmloser Angaben sind oft so einzigartig wie ein Fingerabdruck.

  - kind: problem
    id: schutz
    widget: choice
    prompt: Was schützt am besten, wenn du eine KI für persönliche Texte nutzt?
    params:
      options:
        - { label: Namen und Details vorher entfernen oder ändern, correct: true }
        - { label: "Höflich bitten, nichts zu speichern", feedback: "Eine Bitte im Chat ändert nichts an der Speicherung." }
    hints:
      - Was nie eingegeben wurde, kann auch nicht verloren gehen.
    explanation: Datensparsamkeit beginnt bei dir selbst.

srs:
  cards_from: [tippen, eindeutig]
