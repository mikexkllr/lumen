id: ai.safety.privacy
type: concept
title: Data and privacy
summary: What you should better not tell an AI.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: tippen
    widget: buckets
    prompt: Would you type this into a public AI chat?
    params:
      buckets: [{ label: probably fine }, { label: better not }]
      items:
        - { label: A question about photosynthesis, bucket: probably fine }
        - { label: "A recipe you want to improve", bucket: probably fine }
        - { label: A password, bucket: better not }
        - { label: A friend's medical record, bucket: better not }
    hints:
      - Who owns the data, and who might see it later?
    explanation: Inputs can be stored and, depending on the service, analyzed.

  - kind: explain
    id: s2
    body: |
      **Anonymizing** data is harder than it sounds. Even a few details together can identify a person.

  - kind: problem
    id: eindeutig
    widget: choice
    prompt: Are ZIP code, date of birth and gender enough to uniquely identify most people?
    params:
      options:
        - { label: Yes – for the vast majority, correct: true }
        - { label: No – you need the name for that, feedback: "A well-known study found that about 87% of the US population is unique with them." }
    hints:
      - How many people share a ZIP code and an exact birthday?
    explanation: Combinations of harmless details are often as unique as a fingerprint.

  - kind: problem
    id: schutz
    widget: choice
    prompt: What protects you best when you use an AI for personal texts?
    params:
      options:
        - { label: Remove or change names and details first, correct: true }
        - { label: "Politely ask it not to save anything", feedback: "A request in the chat changes nothing about storage." }
    hints:
      - What was never entered can't be lost.
    explanation: Data minimization starts with you.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Personal data or not?
    params:
      buckets:
        - id: b1
          label: Personal
        - id: b2
          label: Not personal
      items:
        - label: Date of birth
          bucket: b1
        - label: Yesterday’s weather
          bucket: b2
        - label: Location history of the phone
          bucket: b1
        - label: Population of a city
          bucket: b2
        - label: Voice in a recording
          bucket: b1
    hints:
      - Can a single person be inferred from it?
    explanation: Personal is everything that can be tied to a person.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A firm puts film scores on the web – with no names. Still, some people find out who is who. How?
    params:
      options:
        - label: They match the ratings against public profiles on other sites
          correct: true
        - label: They hack the company
          feedback: Publicly available data sufficed.
        - label: They guess
          feedback: The matching was statistically very certain.
    hints:
      - A few ratings with dates are almost like a fingerprint.
    explanation: This happened to Netflix in 2006. Data that look harmless alone reveal a great deal when combined.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: what percentage of people in the USA are uniquely identified by postcode, date of birth and sex alone?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 87
      tolerance: 10
    explanation: About 87%. Three harmless details together act like a name.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: There are about 8,000 postcodes, about 29,200 possible birth dates (80 years) and 2 entries for sex. How many million combinations is that? Rounded.
    answer:
      value: 467
      tolerance: 2
    hints:
      - "Multiply: 8,000 · 29,200 · 2."
      - That is about 467,000,000.
    explanation: Around 467 million boxes for about 84 million people. Most boxes are empty, and many hold exactly one person. That is why such data is often unique – even without names.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: With **differential privacy** a bit of random noise is added to the numbers. What does that make sure of?
    params:
      options:
        - label: From the result it is practically impossible to tell whether a particular person was in the data
          correct: true
        - label: That the statistic is exactly right
          feedback: It is deliberately made slightly inexact.
        - label: That nobody can steal the data
          feedback: It protects the analysis, not the storage.
    hints:
      - The result should look almost the same with and without you.
    explanation: "A measurable trade: a little accuracy for provable protection. Censuses and smartphones use it."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: An attacker wants to know whether a certain person's data was in a model's training set. Is that possible?
    params:
      options:
        - label: Often in part – models react to training examples differently than to unseen ones.
          correct: true
        - label: Never – the model stores no data.
          feedback: Models can memorise individual examples, especially rare ones.
        - label: Always for sure.
          feedback: It is a statistical attack with errors – but a real risk.
    hints:
      - How confident is a model on examples it has already seen?
      - A difference in confidence gives something away.
    explanation: This is called a membership inference attack. It shows that training data can leak. Differential privacy, less memorisation and careful data selection help.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why "anonymous" data is often not anonymous at all.
    params:
      keywords:
        - - kombin
          - zusammen
          - combin
          - together
        - - eindeutig
          - einzig
          - unique
          - single
        - - postleitzahl
          - geburt
          - postcode
          - birth
      sample: Single details like postcode, date of birth and sex are harmless. But combined together they often fit only one single person, who can then be uniquely identified with other data.
    difficulty: 3

srs:
  cards_from: [tippen, eindeutig]
