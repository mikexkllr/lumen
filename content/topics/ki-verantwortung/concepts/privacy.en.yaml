id: ai.safety.privacy
type: concept
title: Data and privacy
summary: What you should better not tell an AI.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: tippen
    widget: buckets
    prompt: Would you type this into a public AI chat?
    params:
      buckets: [{ label: probably fine }, { label: better not }]
      items:
        - { label: A question about photosynthesis, bucket: probably fine }
        - { label: "A recipe you want to improve", bucket: probably fine }
        - { label: A password, bucket: better not }
        - { label: A friend's medical record, bucket: better not }
    hints:
      - Who owns the data, and who might see it later?
    explanation: Inputs can be stored and, depending on the service, analyzed.

  - kind: explain
    id: s2
    body: |
      **Anonymizing** data is harder than it sounds. Even a few details together can identify a person.

  - kind: problem
    id: eindeutig
    widget: choice
    prompt: Are ZIP code, date of birth and gender enough to uniquely identify most people?
    params:
      options:
        - { label: Yes – for the vast majority, correct: true }
        - { label: No – you need the name for that, feedback: "A well-known study found that about 87% of the US population is unique with them." }
    hints:
      - How many people share a ZIP code and an exact birthday?
    explanation: Combinations of harmless details are often as unique as a fingerprint.

  - kind: problem
    id: schutz
    widget: choice
    prompt: What protects you best when you use an AI for personal texts?
    params:
      options:
        - { label: Remove or change names and details first, correct: true }
        - { label: "Politely ask it not to save anything", feedback: "A request in the chat changes nothing about storage." }
    hints:
      - What was never entered can't be lost.
    explanation: Data minimization starts with you.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A firm puts film scores on the web – with no names. Still, some people find out who is who. How?
    params:
      options:
        - label: They match the ratings against public profiles on other sites
          correct: true
        - label: They hack the company
          feedback: Publicly available data sufficed.
        - label: They guess
          feedback: The matching was statistically very certain.
    hints:
      - A few ratings with dates are almost like a fingerprint.
    explanation: This happened to Netflix in 2006. Data that look harmless alone reveal a great deal when combined.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: With **differential privacy** a bit of random noise is added to the numbers. What does that make sure of?
    params:
      options:
        - label: From the result it is practically impossible to tell whether a particular person was in the data
          correct: true
        - label: That the statistic is exactly right
          feedback: It is deliberately made slightly inexact.
        - label: That nobody can steal the data
          feedback: It protects the analysis, not the storage.
    hints:
      - The result should look almost the same with and without you.
    explanation: "A measurable trade: a little accuracy for provable protection. Censuses and smartphones use it."
    difficulty: 3

srs:
  cards_from: [tippen, eindeutig]
