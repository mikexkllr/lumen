id: ai.safety.alignment
type: concept
title: Was wir wirklich wollen
summary: Das Alignment-Problem.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      **Alignment** heißt: Eine KI soll tun, was wir **meinen** – nicht nur, was wir **sagen**. Das ist schwer, weil Ziele selten vollständig aufgeschrieben werden können.

  - kind: problem
    id: midas
    widget: choice
    prompt: König Midas wünschte sich, dass alles, was er berührt, zu Gold wird. Was lehrt die Sage für KI?
    params:
      options:
        - { label: Ein wörtlich erfülltes Ziel kann katastrophal sein., correct: true }
        - { label: Gold ist wertvoll., feedback: "Er verhungerte, weil auch sein Essen zu Gold wurde." }
    hints:
      - Was passierte mit seinem Essen?
    explanation: Ein Ziel ohne alle stillen Nebenbedingungen ist gefährlich.

  - kind: problem
    id: ziel
    widget: choice
    prompt: Eine App-KI soll »die Zeit in der App maximieren«. Was ist das Risiko?
    params:
      options:
        - { label: "Sie lernt, Menschen süchtig zu machen.", correct: true }
        - { label: Es gibt keins – Nutzer mögen die App ja., feedback: "Lange Nutzung ist nicht dasselbe wie Nutzen." }
    hints:
      - Ist lange Nutzung immer gut für die Menschen?
    explanation: Das gemessene Ziel und das eigentliche Wohl können auseinanderlaufen.

  - kind: problem
    id: massnahmen
    widget: buckets
    prompt: Macht das KI-Systeme sicherer?
    params:
      buckets: [{ label: sinnvoll }, { label: kaum }]
      items:
        - { label: Angriffe vorab testen, bucket: sinnvoll }
        - { label: Menschliche Aufsicht, bucket: sinnvoll }
        - { label: Verhalten überwachen, bucket: sinnvoll }
        - { label: Einfach größer bauen, bucket: kaum }
    hints:
      - Größer heißt fähiger – aber nicht automatisch sicherer.
    explanation: Sicherheit entsteht durch Testen, Aufsicht und Messen.

srs:
  cards_from: [midas, ziel]
