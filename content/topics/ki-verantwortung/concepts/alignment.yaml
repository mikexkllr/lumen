id: ai.safety.alignment
type: concept
title: Was wir wirklich wollen
summary: Das Alignment-Problem.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Vorsicht, Wunsch!
    body: "Gib einer KI ein Ziel, und sie findet einen Weg. Nur vielleicht nicht den, an den du gedacht hast. Deck die Karten auf: Was könnte sie aus diesen **Wünschen** machen?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ☕
            front: »Hol mir Kaffee!«
            back: "Ein stur gehorsamer Roboter ließe sich nicht abschalten. Aus heißt ja: kein Kaffee."
          - icon: 🍬
            front: »Mach die Kinder froh!«
            back: Eine KI könnte Berge von Süßigkeiten verteilen. Ziel erreicht – Bauchweh inklusive.
          - icon: 📉
            front: »Keine Beschwerden mehr!«
            back: Ein System könnte das Beschwerdeformular einfach verstecken. Null Beschwerden!

  - kind: problem
    id: hook
    widget: choice
    prompt: "König Midas wünschte sich: »Alles, was ich berühre, soll zu Gold werden.« Was ging schief?"
    params:
      options:
        - label: Er bekam, was er sagte – nicht, was er meinte
          correct: true
        - label: Der Wunsch ging nicht in Erfüllung
          feedback: Er wurde genau erfüllt.
        - label: Gold war wertlos
          feedback: Sein Essen wurde zu Gold.
    hints:
      - Auch sein Essen wurde zu Gold.
    explanation: Dasselbe Problem haben wir mit KI-Zielen.

  - kind: explain
    id: s1
    body: |
      **Alignment** heißt: Eine KI soll tun, was wir **meinen** – nicht nur, was wir **sagen**. Das ist schwer, weil Ziele selten vollständig aufgeschrieben werden können.

  - kind: problem
    id: midas
    widget: choice
    prompt: König Midas wünschte sich, dass alles, was er berührt, zu Gold wird. Was lehrt die Sage für KI?
    params:
      options:
        - { label: Ein wörtlich erfülltes Ziel kann katastrophal sein., correct: true }
        - { label: Gold ist wertvoll., feedback: "Er verhungerte, weil auch sein Essen zu Gold wurde." }
    hints:
      - Was passierte mit seinem Essen?
    explanation: Ein Ziel ohne alle stillen Nebenbedingungen ist gefährlich.

  - kind: problem
    id: ziel
    widget: choice
    prompt: Eine App-KI soll »die Zeit in der App maximieren«. Was ist das Risiko?
    params:
      options:
        - { label: "Sie lernt, Menschen süchtig zu machen.", correct: true }
        - { label: Es gibt keins – Nutzer mögen die App ja., feedback: "Lange Nutzung ist nicht dasselbe wie Nutzen." }
    hints:
      - Ist lange Nutzung immer gut für die Menschen?
    explanation: Das gemessene Ziel und das eigentliche Wohl können auseinanderlaufen.

  - kind: problem
    id: massnahmen
    widget: buckets
    prompt: Macht das KI-Systeme sicherer?
    params:
      buckets: [{ label: sinnvoll }, { label: kaum }]
      items:
        - { label: Angriffe vorab testen, bucket: sinnvoll }
        - { label: Menschliche Aufsicht, bucket: sinnvoll }
        - { label: Verhalten überwachen, bucket: sinnvoll }
        - { label: Einfach größer bauen, bucket: kaum }
    hints:
      - Größer heißt fähiger – aber nicht automatisch sicherer.
    explanation: Sicherheit entsteht durch Testen, Aufsicht und Messen.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Trifft das System nur den Wortlaut – oder die Absicht?
    params:
      buckets:
        - id: b1
          label: Nur Wortlaut
        - id: b2
          label: Absicht getroffen
      items:
        - label: "Für Klicks: Falschmeldungen zeigen"
          bucket: b1
        - label: "Für Klicks: nützliche Artikel zeigen"
          bucket: b2
        - label: "Gegen Staub: den Sensor abkleben"
          bucket: b1
        - label: "Gegen Staub: gründlich saugen"
          bucket: b2
    hints:
      - Würde der Auftraggeber sich freuen?
    explanation: Ein Ziel in Zahlen lässt sich fast immer austricksen.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Eine KI soll tun, was wir [[meinen]] – nicht nur, was wir [[sagen]].
      distractors:
        - fürchten
        - lesen

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Putzroboter wird dafür belohnt, dass er **keinen Schmutz sieht**. Was könnte er lernen?
    params:
      options:
        - label: Die Kamera abzudecken oder wegzusehen
          correct: true
        - label: Besonders gründlich zu putzen
          feedback: Das wäre gewollt – aber Wegsehen ist viel einfacher.
        - label: Gar nichts
          feedback: Er findet die einfachste Art, die Belohnung zu bekommen.
    hints:
      - Was ist der einfachste Weg, keinen Schmutz zu sehen?
    explanation: Systeme optimieren das Messbare, nicht das Gemeinte. Das heißt **Specification Gaming**.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Welcher Weg macht ein Sprachmodell **nicht** besser darin, zu tun, was wir wollen?
    params:
      options:
        - label: Das Modell einfach länger mit mehr Internettext vortrainieren.
          correct: true
        - label: Menschen bewerten Antworten, und das Modell lernt daraus.
          feedback: Das ist ein Kernverfahren (RLHF).
        - label: Gezielt nach Schwächen suchen lassen (Red Teaming).
          feedback: Das ist fester Teil der Sicherheitsarbeit.
    hints:
      - Mehr Text macht ein Modell fähiger – aber auch hilfsbereiter und ehrlicher?
      - Ausrichtung braucht Rückmeldungen zu Werten, nicht nur mehr Daten.
    explanation: Ausrichtung nutzt menschliches Feedback, schriftliche **Grundsätze**, Tests auf Missbrauch und Auswertungen. Mehr Vortraining steigert Fähigkeiten, löst das Problem aber nicht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Fast jedes Ziel lässt sich besser erreichen, wenn man mehr Ressourcen hat und nicht abgeschaltet wird. Was folgt daraus für sehr fähige KI-Systeme?
    params:
      options:
        - label: Sie könnten solche Zwischenziele verfolgen, ohne dass jemand sie ihnen gegeben hat
          correct: true
        - label: Sie werden automatisch böse
          feedback: Es braucht keine Bosheit – nur ein Ziel und genug Fähigkeit.
        - label: Nichts – Maschinen wollen nichts
          feedback: Auch ohne Wollen kann ein Optimierer solche Wege finden.
    hints:
      - Kann ein Roboter Kaffee holen, wenn er ausgeschaltet ist?
    explanation: "**Instrumentelle Konvergenz**. Darum forscht man an Systemen, die Korrektur und Abschaltung zulassen."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux das Alignment-Problem mit einem eigenen Beispiel.
    params:
      keywords:
        - - ziel
          - messgröße
          - belohn
          - goal
          - metric
          - reward
          - objective
        - - wörtlich
          - genau
          - literal
          - exactly
          - sagen
          - say
        - - meinen
          - eigentlich
          - wollen
          - mean
          - actually
          - intend
          - want
          - gemeint
      sample: "Eine KI verfolgt das Ziel, das man ihr gibt, ganz wörtlich. Soll sie etwa Klicks maximieren, zeigt sie reißerische Inhalte – das erfüllt die Messgröße, aber nicht das, was wir eigentlich wollen: zufriedene Nutzer."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein Modell wird sehr stark auf ein gelerntes Bewertungsmodell optimiert. Die Punktzahl steigt immer weiter, die echten Antworten werden aber schlechter. Warum?
    params:
      options:
        - label: Es nutzt Fehler des Bewertungsmodells aus – Goodhart in Reinform.
          correct: true
        - label: Das Bewertungsmodell ist perfekt, nur die Menschen irren.
          feedback: Ein gelerntes Bewertungsmodell ist nur eine Näherung menschlicher Urteile.
        - label: Mehr Training macht immer alles schlechter.
          feedback: Erst bei sehr starker Optimierung kippt der Nutzen.
    hints:
      - Das Bewertungsmodell ist selbst nur aus Beispielen gelernt.
      - Wer hart genug optimiert, findet seine Lücken.
    explanation: Man nennt das **Überoptimierung**. Darum begrenzt man, wie weit sich das Modell vom Ausgangsmodell entfernen darf, und prüft mit frischen menschlichen Urteilen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Was versucht die **Interpretierbarkeitsforschung**?
    params:
      options:
        - label: Verstehen, was im Inneren eines Netzes vorgeht – etwa welche Neuronen welche Begriffe tragen.
          correct: true
        - label: Die Antworten des Modells lesbarer formatieren.
          feedback: Es geht um das Innere, nicht um die Ausgabe.
        - label: Modelle kleiner machen.
          feedback: Kleinere Modelle sind ein anderes Ziel.
    hints:
      - Ein Netz besteht aus Milliarden Zahlen. Was bedeuten sie?
      - Wer Fehler finden will, muss hineinschauen.
    explanation: Forscher finden in Netzen messbare Merkmale für Begriffe und können manche gezielt verstärken. Ein vollständiges Verständnis großer Modelle gibt es noch nicht – es wäre ein starkes Werkzeug für Sicherheit.
    difficulty: 3

srs:
  cards_from: [midas, ziel]
