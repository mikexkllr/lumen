id: ai.safety.alignment
type: concept
title: What we really want
summary: The alignment problem.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Careful what you wish for
    body: "Give an AI a goal, and it will find a way. Just maybe not the one you had in mind. Uncover the cards: what could it make of these **wishes**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ☕
            front: “Fetch me coffee!”
            back: A stubbornly obedient robot would not let itself be switched off. Off means no coffee.
          - icon: 🍬
            front: “Make the kids happy!”
            back: An AI could hand out mountains of sweets. Goal reached – tummy ache included.
          - icon: 📉
            front: “No more complaints!”
            back: A system could simply hide the complaints form. Zero complaints!

  - kind: problem
    id: hook
    widget: choice
    prompt: "King Midas wished: “May everything I touch turn to gold.” What went wrong?"
    params:
      options:
        - label: He got what he said – not what he meant
          correct: true
        - label: The wish did not come true
          feedback: It was fulfilled exactly.
        - label: Gold was worthless
          feedback: His food turned to gold.
    hints:
      - His food turned to gold too.
    explanation: We have the same problem with AI goals.

  - kind: explain
    id: s1
    body: |
      **Alignment** means an AI should do what we **mean**, not just what we **say**. This is hard, because goals can rarely be written down completely.

  - kind: problem
    id: midas
    widget: choice
    prompt: King Midas wished that everything he touched would turn to gold. What does the legend teach about AI?
    params:
      options:
        - { label: A goal met literally can be catastrophic., correct: true }
        - { label: Gold is valuable., feedback: "He starved, because his food turned to gold too." }
    hints:
      - What happened to his food?
    explanation: A goal without all the unspoken conditions is dangerous.

  - kind: problem
    id: ziel
    widget: choice
    prompt: An app's AI is told to "maximize time in the app". What is the risk?
    params:
      options:
        - { label: "It learns to make people addicted.", correct: true }
        - { label: "There is none – users like the app, after all.", feedback: "Long use is not the same as benefit." }
    hints:
      - Is long use always good for people?
    explanation: The measured goal and real well-being can drift apart.

  - kind: problem
    id: massnahmen
    widget: buckets
    prompt: Does this make AI systems safer?
    params:
      buckets: [{ label: useful }, { label: barely }]
      items:
        - { label: Testing attacks in advance, bucket: useful }
        - { label: Human oversight, bucket: useful }
        - { label: Monitoring behavior, bucket: useful }
        - { label: Simply building it bigger, bucket: barely }
    hints:
      - Bigger means more capable – but not automatically safer.
    explanation: Safety comes from testing, oversight and measuring.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does the system hit only the wording – or the intent?
    params:
      buckets:
        - id: b1
          label: Wording only
        - id: b2
          label: Intent met
      items:
        - label: "For clicks: show fake news"
          bucket: b1
        - label: "For clicks: show useful articles"
          bucket: b2
        - label: "Against dust: tape over the sensor"
          bucket: b1
        - label: "Against dust: vacuum thoroughly"
          bucket: b2
    hints:
      - Would the person who asked be pleased?
    explanation: A goal in numbers can almost always be gamed.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An AI should do what we [[mean]] – not just what we [[say]].
      distractors:
        - fear
        - read

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A cleaning robot is rewarded for **seeing no dirt**. What might it learn?
    params:
      options:
        - label: To cover the camera or look away
          correct: true
        - label: To clean especially thoroughly
          feedback: That would be the intent – but looking away is far easier.
        - label: Nothing at all
          feedback: It finds the easiest way to get the reward.
    hints:
      - What is the easiest way to see no dirt?
    explanation: Systems optimise what is measurable, not what is meant. This is called **specification gaming**.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Which method is **not** one of the usual ways to align language models?
    params:
      options:
        - label: Simply pre-training the model longer on more internet text.
          correct: true
        - label: Humans rate answers and the model learns from them.
          feedback: That is a core method (RLHF).
        - label: Having people hunt for weaknesses (red teaming).
          feedback: That is a standard part of safety work.
    hints:
      - More text makes a model more capable – but also more helpful and honest?
      - Alignment needs feedback about values, not just more data.
    explanation: Alignment uses human feedback, written principles, misuse testing and evaluations. More pre-training increases capability but does not solve the problem.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Almost any goal is easier to reach with more resources and without being switched off. What follows for very capable AI systems?
    params:
      options:
        - label: They might pursue such sub-goals without anyone having given them
          correct: true
        - label: They automatically turn evil
          feedback: No malice is needed – only a goal and enough capability.
        - label: Nothing – machines want nothing
          feedback: Even without wanting, an optimiser can find such routes.
    hints:
      - Can a robot fetch coffee if it is switched off?
    explanation: "**Instrumental convergence**. That is why research aims at systems that permit correction and shutdown."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain the alignment problem to Lux with an example of your own.
    params:
      keywords:
        - - ziel
          - messgröße
          - belohn
          - goal
          - metric
          - reward
          - objective
        - - wörtlich
          - genau
          - literal
          - exactly
          - sagen
          - say
        - - meinen
          - eigentlich
          - wollen
          - mean
          - actually
          - intend
          - want
          - gemeint
      sample: "An AI pursues the goal it is given quite literally. If it is to maximise clicks, say, it shows lurid content – that satisfies the metric but not what we actually want: satisfied users."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: A model is optimised very hard against a learned reward model. The score keeps rising, but the real answers get worse. Why?
    params:
      options:
        - label: It exploits flaws of the reward model – Goodhart in pure form.
          correct: true
        - label: The reward model is perfect; only humans are wrong.
          feedback: A learned reward model is only an approximation of human judgement.
        - label: More training always makes everything worse.
          feedback: The benefit only flips under very strong optimisation.
    hints:
      - The reward model itself was only learned from examples.
      - Optimise hard enough and you find its gaps.
    explanation: This is called over-optimisation. That is why the model is kept from drifting too far from its starting point, and results are checked with fresh human judgements.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: What does interpretability research try to do?
    params:
      options:
        - label: Understand what goes on inside a network – such as which neurons carry which concepts.
          correct: true
        - label: Format the model's answers more readably.
          feedback: It is about the inside, not the output.
        - label: Make models smaller.
          feedback: Smaller models are a different goal.
    hints:
      - A network consists of billions of numbers. What do they mean?
      - To find faults you have to look inside.
    explanation: Researchers find measurable features for concepts inside networks and can amplify some of them. A full understanding of large models does not exist yet – it would be a powerful safety tool.
    difficulty: 3

srs:
  cards_from: [midas, ziel]
