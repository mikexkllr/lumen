id: ai.safety.deepfakes
type: concept
title: Deepfakes
summary: Täuschend echt – und gefälscht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: was
    widget: choice
    prompt: Was ist ein Deepfake?
    params:
      options:
        - { label: "Ein mit KI gefälschtes Bild, Video oder Tondokument", correct: true }
        - { label: Ein besonders tiefes Foto, feedback: "Das »Deep« kommt von Deep Learning." }
    hints:
      - Deep wie Deep Learning, Fake wie Fälschung.
    explanation: Gesichter, Stimmen und Szenen lassen sich heute täuschend echt erzeugen.

  - kind: explain
    id: s2
    body: |
      Automatische Erkennung ist unzuverlässig. Besser hilft eine Prüfroutine: **Woher** kommt es? Berichten **andere** Quellen? Gibt es das Bild **früher** schon im Netz?

  - kind: problem
    id: pruefen
    widget: order
    prompt: Ein schockierendes Video geht viral. Bring die Prüfschritte in eine sinnvolle Reihenfolge.
    params:
      items:
        - { label: Innehalten statt sofort teilen }
        - { label: Ursprüngliche Quelle suchen }
        - { label: "Prüfen, ob seriöse Medien berichten" }
        - { label: "Erst dann entscheiden, ob man teilt" }
    hints:
      - Am Anfang steht die Pause.
    explanation: Fälschungen leben davon, dass Menschen schnell und emotional reagieren.

  - kind: problem
    id: anruf
    widget: choice
    prompt: Die Stimme deines Bruders ruft an und bittet dringend um Geld. Was tust du?
    params:
      options:
        - { label: Auflegen und ihn über seine bekannte Nummer zurückrufen, correct: true }
        - { label: Sofort überweisen – es ist ja seine Stimme, feedback: "Stimmen lassen sich mit wenigen Sekunden Aufnahme nachahmen." }
    hints:
      - Wie kannst du sicher sein, wer wirklich dran ist?
    explanation: Ein Rückruf oder ein vereinbartes Codewort entlarvt Stimmklone.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Hilft das beim Prüfen eines verdächtigen Bildes?
    params:
      buckets:
        - id: b1
          label: Hilft
        - id: b2
          label: Hilft kaum
      items:
        - label: Die Quelle nachschlagen
          bucket: b1
        - label: Rückwärts-Bildersuche
          bucket: b1
        - label: Aufs Bauchgefühl hören
          bucket: b2
        - label: Andere Berichte suchen
          bucket: b1
        - label: Zählen, wie oft es geteilt wurde
          bucket: b2
    hints:
      - Was liefert eine unabhängige Spur?
    explanation: Viele Shares und ein gutes Gefühl beweisen nichts.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Frag bei jedem verdächtigen Bild: [[Woher]] kommt es? Berichten [[andere]] Quellen dasselbe?"
      distractors:
        - Wohin
        - keine

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Ein echtes, belastendes Video taucht auf. Der Betroffene sagt einfach: »Das ist ein Deepfake.« Wie heißt dieses Problem?"
    params:
      options:
        - label: Die Dividende des Lügners – echte Beweise lassen sich als Fälschung abtun
          correct: true
        - label: Filterblase
          feedback: Die betrifft Empfehlungen.
        - label: Halluzination
          feedback: Die entsteht im Modell, nicht in der Debatte.
    hints:
      - Wer profitiert, wenn niemand mehr irgendeinem Video traut?
    explanation: Der Schaden von Deepfakes liegt nicht nur in Fälschungen, sondern im Zweifel an allem Echten.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Von 100 Videos ist 1 gefälscht. Ein Erkenner erkennt Fälschungen zu 95 % und hält echte Videos in 5 % der Fälle für falsch. Wie viel Prozent seiner Alarme sind echte Fälschungen? Gerundet.
    answer:
      value: 16
      tolerance: 1
    feedback:
      - when: numval(state.input) == 95
        misconception: base-rate
        text: Das ist die Erkennungsrate. Die vielen echten Videos erzeugen aber viele Fehlalarme.
    hints:
      - "Richtige Alarme: 0,95 von 1 Fälschung. Fehlalarme: 5 % von 99 echten."
      - 0,95 / (0,95 + 4,95) = ?
    explanation: Nur etwa 16 %. Weil Fälschungen **selten** sind, ist ein Alarm meist falsch. Ein Erkenner allein reicht darum nicht – Herkunft und andere Quellen zählen mit.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Was schützt eine Familie am besten vor Betrug mit geklonten Stimmen?
    params:
      options:
        - label: Ein vorher vereinbartes Codewort und Rückruf über die bekannte Nummer.
          correct: true
        - label: Genau auf die Stimme hören.
          feedback: Geklonte Stimmen können täuschend echt klingen.
        - label: Nie mehr telefonieren.
          feedback: Das schützt, ist aber unpraktisch – ein Codewort reicht.
    hints:
      - Was kann ein Betrüger nicht wissen, selbst mit perfekter Stimme?
      - Wie prüfst du, ob wirklich dein Bruder dran ist?
    explanation: "Gegen perfekte Fälschungen hilft ein **zweiter Kanal**: ein Geheimnis oder ein Rückruf. Sich auf das eigene Ohr zu verlassen, reicht nicht mehr."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Statt Fälschungen zu erkennen, setzen viele auf **Herkunftsnachweise**: Die Kamera signiert jedes Foto kryptografisch. Was ist der Vorteil?"
    params:
      options:
        - label: Man beweist, was echt ist, statt ein Wettrüsten gegen immer bessere Fälschungen zu führen
          correct: true
        - label: Fälschungen werden unmöglich
          feedback: Sie bleiben möglich – tragen aber keine gültige Signatur.
        - label: Die Fotos werden schöner
          feedback: Am Bild ändert sich nichts.
    hints:
      - Erkennung hinkt immer hinterher. Was dreht die Beweislast um?
    explanation: "Dieselbe Idee wie bei Software-Signaturen: Nicht das Böse suchen, sondern das Gute belegen."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Viele KI-Firmen versehen erzeugte Bilder mit unsichtbaren Wasserzeichen. Was gilt dafür?
    params:
      options:
        - label: "Sie helfen, sind aber kein Beweis: Sie lassen sich oft entfernen, und nicht jedes Werkzeug setzt sie."
          correct: true
        - label: Ohne Wasserzeichen ist ein Bild sicher echt.
          feedback: Offene Modelle oder bearbeitete Bilder tragen oft keins.
        - label: Wasserzeichen machen Fälschungen unmöglich.
          feedback: Sie kennzeichnen nur – sie verhindern nichts.
    hints:
      - Was passiert, wenn jemand das Bild stark bearbeitet oder ein Modell ohne Wasserzeichen nutzt?
      - Fehlt ein Zeichen, was beweist das?
    explanation: Wasserzeichen und **Herkunftsnachweise** ergänzen sich. Sie stärken echte Inhalte, beweisen aber nie allein, dass etwas echt oder falsch ist.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man ein verdächtiges virales Video prüft.
    params:
      keywords:
        - - quelle
          - herkunft
          - woher
          - source
          - origin
          - comes from
        - - andere
          - berichte
          - medien
          - other
          - reports
          - outlets
        - - früher
          - rückwärts
          - suche
          - earlier
          - reverse
          - search
      sample: Ich frage, woher das Video kommt und wer es zuerst gepostet hat. Ich schaue, ob andere seriöse Medien berichten. Mit einer Rückwärtssuche prüfe ich, ob es früher schon im Netz war.
    difficulty: 3

srs:
  cards_from: [pruefen, anruf]
