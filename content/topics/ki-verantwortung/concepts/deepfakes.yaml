id: ai.safety.deepfakes
type: concept
title: Deepfakes
summary: Täuschend echt – und gefälscht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: was
    widget: choice
    prompt: Was ist ein Deepfake?
    params:
      options:
        - { label: "Ein mit KI gefälschtes Bild, Video oder Tondokument", correct: true }
        - { label: Ein besonders tiefes Foto, feedback: "Das »Deep« kommt von Deep Learning." }
    hints:
      - Deep wie Deep Learning, Fake wie Fälschung.
    explanation: Gesichter, Stimmen und Szenen lassen sich heute täuschend echt erzeugen.

  - kind: explain
    id: s2
    body: |
      Automatische Erkennung ist unzuverlässig. Besser hilft eine Prüfroutine: **Woher** kommt es? Berichten **andere** Quellen? Gibt es das Bild **früher** schon im Netz?

  - kind: problem
    id: pruefen
    widget: order
    prompt: Ein schockierendes Video geht viral. Bring die Prüfschritte in eine sinnvolle Reihenfolge.
    params:
      items:
        - { label: Innehalten statt sofort teilen }
        - { label: Ursprüngliche Quelle suchen }
        - { label: "Prüfen, ob seriöse Medien berichten" }
        - { label: "Erst dann entscheiden, ob man teilt" }
    hints:
      - Am Anfang steht die Pause.
    explanation: Fälschungen leben davon, dass Menschen schnell und emotional reagieren.

  - kind: problem
    id: anruf
    widget: choice
    prompt: Die Stimme deines Bruders ruft an und bittet dringend um Geld. Was tust du?
    params:
      options:
        - { label: Auflegen und ihn über seine bekannte Nummer zurückrufen, correct: true }
        - { label: Sofort überweisen – es ist ja seine Stimme, feedback: "Stimmen lassen sich mit wenigen Sekunden Aufnahme nachahmen." }
    hints:
      - Wie kannst du sicher sein, wer wirklich dran ist?
    explanation: Ein Rückruf oder ein vereinbartes Codewort entlarvt Stimmklone.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Hilft das beim Prüfen eines verdächtigen Bildes?
    params:
      buckets:
        - id: b1
          label: Hilft
        - id: b2
          label: Hilft kaum
      items:
        - label: Die Quelle nachschlagen
          bucket: b1
        - label: Rückwärts-Bildersuche
          bucket: b1
        - label: Aufs Bauchgefühl hören
          bucket: b2
        - label: Andere Berichte suchen
          bucket: b1
        - label: Zählen, wie oft es geteilt wurde
          bucket: b2
    hints:
      - Was liefert eine unabhängige Spur?
    explanation: Viele Shares und ein gutes Gefühl beweisen nichts.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Frag bei jedem verdächtigen Bild: [[Woher]] kommt es? Berichten [[andere]] Quellen dasselbe?"
      distractors:
        - Wohin
        - keine

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Ein echtes, belastendes Video taucht auf. Der Betroffene sagt einfach: »Das ist ein Deepfake.« Wie heißt dieses Problem?"
    params:
      options:
        - label: Die Dividende des Lügners – echte Beweise lassen sich als Fälschung abtun
          correct: true
        - label: Filterblase
          feedback: Die betrifft Empfehlungen.
        - label: Halluzination
          feedback: Die entsteht im Modell, nicht in der Debatte.
    hints:
      - Wer profitiert, wenn niemand mehr irgendeinem Video traut?
    explanation: Der Schaden von Deepfakes liegt nicht nur in Fälschungen, sondern im Zweifel an allem Echten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Statt Fälschungen zu erkennen, setzen viele auf **Herkunftsnachweise**: Die Kamera signiert jedes Foto kryptografisch. Was ist der Vorteil?"
    params:
      options:
        - label: Man beweist, was echt ist, statt ein Wettrüsten gegen immer bessere Fälschungen zu führen
          correct: true
        - label: Fälschungen werden unmöglich
          feedback: Sie bleiben möglich – tragen aber keine gültige Signatur.
        - label: Die Fotos werden schöner
          feedback: Am Bild ändert sich nichts.
    hints:
      - Erkennung hinkt immer hinterher. Was dreht die Beweislast um?
    explanation: "Dieselbe Idee wie bei Software-Signaturen: Nicht das Böse suchen, sondern das Gute belegen."
    difficulty: 3

srs:
  cards_from: [pruefen, anruf]
