id: ai.safety.bias
type: concept
title: Verzerrte Daten
summary: Wenn KI Vorurteile lernt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bewerbung
    widget: choice
    prompt: Eine KI lernt aus den Einstellungen der letzten zehn Jahre – damals wurden fast nur Männer eingestellt. Was passiert?
    params:
      options:
        - { label: Sie bevorzugt eher Männer., correct: true }
        - { label: "Sie ist neutral, weil sie eine Maschine ist.", feedback: "Sie lernt die Muster der Vergangenheit – auch die unfairen." }
    hints:
      - Was »weiß« die KI über gute Bewerbungen?
    explanation: Ein Modell kopiert Muster aus den Daten – auch Vorurteile.

  - kind: explain
    id: s2
    body: |
      KI ist nicht automatisch **fair**. Spiegeln die Daten eine unfaire Vergangenheit, entscheidet das Modell genauso – nur schneller und in größerem Maßstab.

  - kind: problem
    id: versteckt
    widget: choice
    prompt: Man entfernt das Geschlecht aus den Daten. Trotzdem benachteiligt das Modell Frauen. Wie kann das sein?
    params:
      options:
        - { label: Andere Merkmale verraten das Geschlecht indirekt., correct: true }
        - { label: Das ist unmöglich., feedback: "Hobbys, Vereine oder Lücken im Lebenslauf können stellvertretend wirken." }
    hints:
      - Welche Angaben hängen oft mit dem Geschlecht zusammen?
    explanation: Solche Ersatzmerkmale heißen **Proxys** – darum reicht Weglassen nicht.

  - kind: problem
    id: hilft
    widget: buckets
    prompt: Hilft das gegen unfaire KI?
    params:
      buckets: [{ label: hilft }, { label: hilft kaum }]
      items:
        - { label: Fehlerraten für jede Gruppe messen, bucket: hilft }
        - { label: Trainingsdaten prüfen und ausgleichen, bucket: hilft }
        - { label: Das Modell geheim halten, bucket: hilft kaum }
        - { label: Nur das Geschlecht weglassen, bucket: hilft kaum }
    hints:
      - Was macht Unfairness sichtbar?
    explanation: Wer messen kann, wo es hakt, kann es auch beheben.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Eine KI ist objektiv, weil sie rechnet.
          right: false
          why: Sie lernt aus menschlichen Daten – mit allen Schieflagen darin.
        - text: Ein Modell kann unfair sein, obwohl niemand das beabsichtigt hat.
          right: true
        - text: Fehlerraten sollte man für jede Gruppe einzeln prüfen.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Modell lernt, was in den [[Daten]] steckt. Sind sie unfair, entscheidet es genauso [[unfair]].
      distractors:
        - Regeln
        - langsam

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Kreditmodell lehnt Menschen aus bestimmten Stadtteilen häufiger ab. Die Herkunft steht nicht in den Daten. Wie heißt das Merkmal, das sie verrät?
    params:
      options:
        - label: Stellvertreter-Merkmal (Proxy)
          correct: true
        - label: Label
          feedback: Das Label ist die Zielgröße, hier »zahlt zurück«.
        - label: Ausreißer
          feedback: Das ist ein einzelner extremer Wert.
    hints:
      - Die Postleitzahl hängt eng mit anderen Eigenschaften zusammen.
    explanation: Ein Merkmal zu löschen genügt nicht, wenn andere es **stellvertretend** verraten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Rückfall-Prognosemodell war für zwei Gruppen gleich **treffsicher** – stufte aber Unschuldige der einen Gruppe doppelt so oft fälschlich als gefährlich ein. War es fair?
    params:
      options:
        - label: Das hängt von der Definition ab – mehrere Fairness-Maße lassen sich mathematisch nicht zugleich erfüllen
          correct: true
        - label: Ja, eindeutig
          feedback: Nach einem Maß ja, nach einem anderen nein.
        - label: Nein, eindeutig
          feedback: Auch das gilt nur nach einem der Maße.
    hints:
      - Gleiche Treffsicherheit und gleiche Fehlalarmrate – geht beides, wenn die Gruppen verschieden häufig rückfällig werden?
    explanation: "Das **Unmöglichkeitstheorem der Fairness**: Welche Art von Fairness zählt, ist eine gesellschaftliche Entscheidung, keine technische."
    difficulty: 3

srs:
  cards_from: [bewerbung, versteckt]
