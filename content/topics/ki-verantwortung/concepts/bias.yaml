id: ai.safety.bias
type: concept
title: Verzerrte Daten
summary: Wenn KI Vorurteile lernt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bewerbung
    widget: choice
    prompt: Eine KI lernt aus den Einstellungen der letzten zehn Jahre – damals wurden fast nur Männer eingestellt. Was passiert?
    params:
      options:
        - { label: Sie bevorzugt eher Männer., correct: true }
        - { label: "Sie ist neutral, weil sie eine Maschine ist.", feedback: "Sie lernt die Muster der Vergangenheit – auch die unfairen." }
    hints:
      - Was »weiß« die KI über gute Bewerbungen?
    explanation: Ein Modell kopiert Muster aus den Daten – auch Vorurteile.

  - kind: explain
    body: |
      KI ist nicht automatisch fair. Spiegeln die Daten eine unfaire Vergangenheit, entscheidet das Modell genauso – nur schneller und in größerem Maßstab.

  - kind: problem
    id: versteckt
    widget: choice
    prompt: Man entfernt das Geschlecht aus den Daten. Trotzdem benachteiligt das Modell Frauen. Wie kann das sein?
    params:
      options:
        - { label: Andere Merkmale verraten das Geschlecht indirekt., correct: true }
        - { label: Das ist unmöglich., feedback: "Hobbys, Vereine oder Lücken im Lebenslauf können stellvertretend wirken." }
    hints:
      - Welche Angaben hängen oft mit dem Geschlecht zusammen?
    explanation: Solche Ersatzmerkmale heißen **Proxys** – darum reicht Weglassen nicht.

  - kind: problem
    id: hilft
    widget: buckets
    prompt: Hilft das gegen unfaire KI?
    params:
      buckets: [{ label: hilft }, { label: hilft kaum }]
      items:
        - { label: Fehlerraten für jede Gruppe messen, bucket: hilft }
        - { label: Trainingsdaten prüfen und ausgleichen, bucket: hilft }
        - { label: Das Modell geheim halten, bucket: hilft kaum }
        - { label: Nur das Geschlecht weglassen, bucket: hilft kaum }
    hints:
      - Was macht Unfairness sichtbar?
    explanation: Wer messen kann, wo es hakt, kann es auch beheben.

srs:
  cards_from: [bewerbung, versteckt]
