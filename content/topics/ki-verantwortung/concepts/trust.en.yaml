id: ai.safety.trust
type: concept
title: How much trust?
summary: Between blind faith and rejection.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: navi
    widget: choice
    prompt: Someone follows the GPS right into a river. What is this mistake called?
    params:
      options:
        - { label: Automation bias, correct: true }
        - { label: Fear of technology, feedback: "That would be the opposite – here the machine was trusted too much." }
    hints:
      - Was the machine trusted too much or too little?
    explanation: People like to switch off their own judgment around automated systems.

  - kind: explain
    body: |
      AI is a strong tool for **drafts**. The higher the stakes, the more important **human review** becomes – for health, money and law, anyway.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Is an AI draft enough here, or does it need careful checking?
    params:
      buckets: [{ label: Draft is enough }, { label: check carefully }]
      items:
        - { label: Ideas for a birthday, bucket: Draft is enough }
        - { label: Polishing a text, bucket: Draft is enough }
        - { label: A medication dose, bucket: check carefully }
        - { label: A contract, bucket: check carefully }
    hints:
      - What happens in the worst case?
    explanation: The possible harm decides how closely you look.

  - kind: problem
    id: quelle
    widget: choice
    prompt: An AI cites a study as evidence. What is the smart move?
    params:
      options:
        - { label: Find and read the study yourself, correct: true }
        - { label: Quote it directly, feedback: "Language models sometimes invent sources that don't exist." }
    hints:
      - Remember how language models generate text.
    explanation: You check evidence at the source, not in the summary.

srs:
  cards_from: [navi, wo]
