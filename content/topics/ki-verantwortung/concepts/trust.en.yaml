id: ai.safety.trust
type: concept
title: How much trust?
summary: Between blind faith and rejection.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: navi
    widget: choice
    prompt: Someone follows the GPS right into a river. What is this mistake called?
    params:
      options:
        - { label: Automation bias, correct: true }
        - { label: Fear of technology, feedback: "That would be the opposite – here the machine was trusted too much." }
    hints:
      - Was the machine trusted too much or too little?
    explanation: People like to switch off their own judgment around automated systems.

  - kind: explain
    id: s2
    body: |
      AI is a strong tool for **drafts**. The higher the stakes, the more important **human review** becomes – for health, money and law, anyway.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Is an AI draft enough here, or does it need careful checking?
    params:
      buckets: [{ label: Draft is enough }, { label: check carefully }]
      items:
        - { label: Ideas for a birthday, bucket: Draft is enough }
        - { label: Polishing a text, bucket: Draft is enough }
        - { label: A medication dose, bucket: check carefully }
        - { label: A contract, bucket: check carefully }
    hints:
      - What happens in the worst case?
    explanation: The possible harm decides how closely you look.

  - kind: problem
    id: quelle
    widget: choice
    prompt: An AI cites a study as evidence. What is the smart move?
    params:
      options:
        - { label: Find and read the study yourself, correct: true }
        - { label: Quote it directly, feedback: "Language models sometimes invent sources that don't exist." }
    hints:
      - Remember how language models generate text.
    explanation: You check evidence at the source, not in the summary.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: How thoroughly must a human check? Order from little to much.
    params:
      items:
        - label: Ideas for a birthday card
        - label: Summary of an article
        - label: Figures for the tax return
        - label: Dose of a medicine
    hints:
      - What happens if the answer is wrong?
    explanation: The costlier an error, the more checking.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The higher the [[stakes]], the more important a [[human]] check.
      distractors:
        - price
        - quick

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: An AI assistant helps doctors with diagnoses and is right 95% of the time. What danger exists precisely **because of that**?
    params:
      options:
        - label: People stop checking – and adopt the 5% of errors too
          correct: true
        - label: The doctors lose their jobs
          feedback: This is about the quality of decisions.
        - label: None – 95% is enough
          feedback: With thousands of patients 5% is a great many.
    hints:
      - How attentive are you with something that is almost always right?
    explanation: The better the system, the harder it is to stay vigilant. Good systems therefore show their **uncertainty**.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A model says "70 % sure" for each of 200 answers. 120 of them are right. What percentage are actually right?
    answer:
      value: 60
    hints:
      - Divide the correct answers by all answers.
      - 120 / 200 = ?
    explanation: 60 % instead of 70 % – the model is overconfident. Good calibration means "70 %" is right about 70 % of the time. Only then can you trust the number.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: A human has to approve every AI decision. After weeks they just click "OK". What is this risk called?
    params:
      options:
        - label: Human review turns into mere rubber-stamping.
          correct: true
        - label: Overfitting.
          feedback: That concerns models, not the people checking them.
        - label: No risk – a human did check.
          feedback: Not really. Checking needs time, knowledge and incentives.
    hints:
      - What happens to attention when almost everything is right?
      - Is "a human clicked" the same as "a human checked"?
    explanation: Real oversight needs time, expertise and spot checks with known errors. Otherwise "a human decides" is just a label.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A model says “90% sure” for each of 100 answers. How many should be right if it is well **calibrated**?
    params:
      options:
        - label: About 90
          correct: true
        - label: All 100
          feedback: Then it should have said “100% sure”.
        - label: At least 50
          feedback: "Calibrated means: the stated confidence matches the hit rate."
    hints:
      - The stated confidence should match the actual rate.
    explanation: Only with calibrated figures can you decide when a human check is needed.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: An AI draft is error-free 95 % of the time. Checking costs 2 minutes. A missed error costs 60 minutes. How many minutes of loss do you expect on average **without** checking?
    answer:
      value: 3
    hints:
      - Expected loss = error probability · cost.
      - 0.05 · 60 = ?
    explanation: 3 minutes on average – more than the 2 minutes of checking. So checking pays. The higher the stakes, the more control pays off, even with good systems.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux when you can trust an AI and when a human must look closely.
    params:
      keywords:
        - - einsatz
          - wichtig
          - gesundheit
          - geld
          - stakes
          - important
          - health
          - money
        - - prüf
          - kontroll
          - check
          - review
        - - entwurf
          - fehler
          - draft
          - error
          - mistake
      sample: For drafts and ideas AI is helpful, since mistakes cost little there. The higher the stakes, such as health or money, the more carefully a human must check.
    difficulty: 3

srs:
  cards_from: [navi, wo]
