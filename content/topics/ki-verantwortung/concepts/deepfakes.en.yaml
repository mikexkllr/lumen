id: ai.safety.deepfakes
type: concept
title: Deepfakes
summary: Deceptively real – and fake.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Seeing is not believing
    body: "A call, a video, a photo: some things look **deceptively real**, although they never happened. Uncover the stages: how does that turn into real harm?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🎬
            front: Made in minutes
            back: A few seconds of recording are often enough to clone a voice.
          - icon: 📲
            front: Shared in seconds
            back: A shocking video spreads before anyone checks it.
          - icon: 💸
            front: Real damage
            back: In 2024, an employee sent 25 million dollars – after a video call with faked colleagues.
          - icon: 🧾
            front: The correction
            back: The correction comes later – and usually reaches far fewer people.

  - kind: problem
    id: was
    widget: choice
    prompt: What is a deepfake?
    params:
      options:
        - { label: "An image, video or audio clip faked with AI", correct: true }
        - { label: An especially deep photo, feedback: "The \"deep\" comes from deep learning." }
    hints:
      - Deep as in deep learning, fake as in forgery.
    explanation: Today, faces, voices and scenes can be generated so well that they look real.

  - kind: explain
    id: s2
    body: |
      Automatic detection is unreliable. A checking routine helps more: **Where** does it come from? Do **other** sources report it? Has the image been online **before**?

  - kind: problem
    id: pruefen
    widget: order
    prompt: A shocking video goes viral. Put the checking steps in a sensible order.
    params:
      items:
        - { label: Pause instead of sharing right away }
        - { label: Look for the original source }
        - { label: "Check whether reputable media report it" }
        - { label: "Only then decide whether to share" }
    hints:
      - It starts with a pause.
    explanation: Fakes live off people reacting quickly and emotionally.

  - kind: problem
    id: anruf
    widget: choice
    prompt: Your brother's voice calls and urgently asks for money. What do you do?
    params:
      options:
        - { label: Hang up and call him back on his known number, correct: true }
        - { label: "Transfer it right away – it is his voice, after all", feedback: "Voices can be imitated from a few seconds of recording." }
    hints:
      - How can you be sure who is really on the line?
    explanation: A call back or an agreed code word exposes voice clones.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does this help in checking a suspicious picture?
    params:
      buckets:
        - id: b1
          label: Helps
        - id: b2
          label: Hardly helps
      items:
        - label: Look up the source
          bucket: b1
        - label: Reverse image search
          bucket: b1
        - label: Trust your gut feeling
          bucket: b2
        - label: Look for other reports
          bucket: b1
        - label: Count how often it was shared
          bucket: b2
    hints:
      - What gives an independent trail?
    explanation: Many shares and a good feeling prove nothing.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Ask of every suspicious picture: [[where]] does it come from? Do [[other]] sources report the same?"
      distractors:
        - whither
        - no

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "A genuine, incriminating video appears. The person concerned simply says: “That is a deepfake.” What is this problem called?"
    params:
      options:
        - label: The liar’s dividend – genuine evidence can be dismissed as fake
          correct: true
        - label: Filter bubble
          feedback: That concerns recommendations.
        - label: Hallucination
          feedback: That arises in the model, not in the debate.
    hints:
      - Who benefits if nobody trusts any video any more?
    explanation: The harm of deepfakes lies not only in fakes but in doubt about everything genuine.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: 1 in 100 videos is fake. A detector catches 95 % of fakes and wrongly flags 5 % of real videos. What percentage of its alarms are actual fakes? Rounded.
    answer:
      value: 16
      tolerance: 1
    feedback:
      - when: numval(state.input) == 95
        misconception: base-rate
        text: That is the detection rate. But the many real videos produce many false alarms.
    hints:
      - "Correct alarms: 0.95 of 1 fake. False alarms: 5 % of 99 real ones."
      - 0.95 / (0.95 + 4.95) = ?
    explanation: Only about 16 %. Because fakes are rare, an alarm is usually wrong. A detector alone is therefore not enough – origin and other sources count too.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: What best protects a family against scams using cloned voices?
    params:
      options:
        - label: A code word agreed in advance and calling back on the known number.
          correct: true
        - label: Listening closely to the voice.
          feedback: Cloned voices can sound deceptively real.
        - label: Never use the phone again.
          feedback: That protects you but is impractical – a code word is enough.
    hints:
      - What can a scammer not know, even with a perfect voice?
      - How do you check it really is your brother?
    explanation: "Against perfect fakes a second channel helps: a shared secret or a call-back. Relying on your own ears is no longer enough."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Some do not hunt for fakes. They let the camera sign each photo with a secret key. What is the gain?
    params:
      options:
        - label: You prove what is genuine instead of running an arms race against ever better fakes
          correct: true
        - label: Fakes become impossible
          feedback: They remain possible – but carry no valid signature.
        - label: The photos look nicer
          feedback: Nothing about the picture changes.
    hints:
      - Detection always lags behind. What reverses the burden of proof?
    explanation: "The same idea as with software signatures: do not hunt for the bad, certify the good."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Many AI firms hide a mark in the images they make. What is true of such marks?
    params:
      options:
        - label: "They help but are no proof: they can often be removed, and not every tool adds them."
          correct: true
        - label: Without a watermark an image is surely real.
          feedback: Open models or edited images often carry none.
        - label: Watermarks make fakes impossible.
          feedback: They only label – they prevent nothing.
    hints:
      - What happens if someone heavily edits the image or uses a model without watermarks?
      - If a mark is missing, what does that prove?
    explanation: Watermarks and provenance records complement each other. They strengthen genuine content but never prove on their own that something is real or fake.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how to check a suspicious viral video.
    params:
      keywords:
        - - quelle
          - herkunft
          - woher
          - source
          - origin
          - comes from
        - - andere
          - berichte
          - medien
          - other
          - reports
          - outlets
        - - früher
          - rückwärts
          - suche
          - earlier
          - reverse
          - search
      sample: I ask where the video comes from and who posted it first. I check whether other reliable outlets report it. With a reverse search I check whether it appeared online earlier.
    difficulty: 3

srs:
  cards_from: [pruefen, anruf]
