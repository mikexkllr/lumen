id: ai.safety.bias
type: concept
title: Biased data
summary: When AI learns prejudice.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: bewerbung
    widget: choice
    prompt: An AI learns from the last ten years of hiring. Back then, almost only men were hired. What happens?
    params:
      options:
        - { label: It tends to favor men., correct: true }
        - { label: "It is neutral, because it is a machine.", feedback: "It learns the patterns of the past – including the unfair ones." }
    hints:
      - What does the AI "know" about good applications?
    explanation: A model copies patterns from the data – including prejudice.

  - kind: explain
    body: |
      AI is not automatically fair. If the data reflects an unfair past, the model decides the same way – just faster and at a larger scale.

  - kind: problem
    id: versteckt
    widget: choice
    prompt: You remove gender from the data. The model still disadvantages women. How can that be?
    params:
      options:
        - { label: Other features reveal gender indirectly., correct: true }
        - { label: That is impossible., feedback: "Hobbies, clubs or gaps in a résumé can act as stand-ins." }
    hints:
      - Which details often go along with gender?
    explanation: Such stand-in features are called **proxies**. That is why leaving data out is not enough.

  - kind: problem
    id: hilft
    widget: buckets
    prompt: Does this help against unfair AI?
    params:
      buckets: [{ label: helps }, { label: barely helps }]
      items:
        - { label: Measuring error rates for each group, bucket: helps }
        - { label: Checking and balancing training data, bucket: helps }
        - { label: Keeping the model secret, bucket: barely helps }
        - { label: Only dropping gender, bucket: barely helps }
    hints:
      - What makes unfairness visible?
    explanation: If you can measure where it goes wrong, you can fix it.

srs:
  cards_from: [bewerbung, versteckt]
