id: ai.safety.bias
type: concept
title: Biased data
summary: When AI learns prejudice.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: bewerbung
    widget: choice
    prompt: An AI learns from the last ten years of hiring. Back then, almost only men were hired. What happens?
    params:
      options:
        - { label: It tends to favor men., correct: true }
        - { label: "It is neutral, because it is a machine.", feedback: "It learns the patterns of the past – including the unfair ones." }
    hints:
      - What does the AI "know" about good applications?
    explanation: A model copies patterns from the data – including prejudice.

  - kind: explain
    id: s2
    body: |
      AI is not automatically **fair**. If the data reflects an unfair past, the model decides the same way – just faster and at a larger scale.

  - kind: problem
    id: versteckt
    widget: choice
    prompt: You remove gender from the data. The model still disadvantages women. How can that be?
    params:
      options:
        - { label: Other features reveal gender indirectly., correct: true }
        - { label: That is impossible., feedback: "Hobbies, clubs or gaps in a résumé can act as stand-ins." }
    hints:
      - Which details often go along with gender?
    explanation: Such stand-in features are called **proxies**. That is why leaving data out is not enough.

  - kind: problem
    id: hilft
    widget: buckets
    prompt: Does this help against unfair AI?
    params:
      buckets: [{ label: helps }, { label: barely helps }]
      items:
        - { label: Measuring error rates for each group, bucket: helps }
        - { label: Checking and balancing training data, bucket: helps }
        - { label: Keeping the model secret, bucket: barely helps }
        - { label: Only dropping gender, bucket: barely helps }
    hints:
      - What makes unfairness visible?
    explanation: If you can measure where it goes wrong, you can fix it.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: An AI is objective because it calculates.
          right: false
          why: It learns from human data – with all the skews in it.
        - text: A model can be unfair although nobody intended it.
          right: true
        - text: Error rates should be checked for each group separately.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A model learns what is in the [[data]]. If they are unfair, it decides just as [[unfairly]].
      distractors:
        - rules
        - slowly

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A credit model rejects people from certain districts more often. Origin is not in the data. What is the feature that reveals it called?
    params:
      options:
        - label: Proxy feature
          correct: true
        - label: Label
          feedback: The label is the target, here “repays”.
        - label: Outlier
          feedback: That is a single extreme value.
    hints:
      - The postcode is closely linked to other characteristics.
    explanation: Deleting a feature is not enough if others reveal it **by proxy**.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A loan model approves {{a}} % of applications from group A and {{b}} % from group B. What is the ratio of B to A? To two decimals.
    answer:
      value: "{{b / a}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == a - b
        misconception: difference
        text: That is the gap in percentage points. We want the ratio.
    hints:
      - Divide B's rate by A's.
      - "{{b}} / {{a}} = ?"
    explanation: Ratio {{b / a}}. In US hiring, a value below 0.8 counts as a warning sign (the "four-fifths rule"). Equal rates are called demographic parity – only one of several ideas of fairness.
    difficulty: 2
    variants:
      params:
        a: step[50,80,10]
        b: step[20,60,10]
      constraints:
        - b < a
      defaults:
        a: 60
        b: 30

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Out of every 100 innocent people, a model wrongly flags 20 in group A and 40 in group B as dangerous. How many times higher is group B's false positive rate?
    answer:
      value: 2
    hints:
      - "False positive rate A: 20 %. B: 40 %."
      - 40 / 20 = ?
    explanation: Twice as high. Even with the same overall accuracy, kinds of error can be distributed unequally. That is why errors are checked per group.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A recidivism model was equally **accurate** for two groups – yet wrongly flagged innocents of one group as dangerous twice as often. Was it fair?
    params:
      options:
        - label: That depends on the definition – several fairness measures cannot be satisfied at once mathematically
          correct: true
        - label: Yes, clearly
          feedback: By one measure yes, by another no.
        - label: No, clearly
          feedback: That too holds only by one of the measures.
    hints:
      - Equal accuracy and equal false-alarm rate – are both possible if the groups reoffend at different rates?
    explanation: "The **impossibility theorem of fairness**: which kind of fairness counts is a societal decision, not a technical one."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: teach
    prompt: Explain to Lux why a model can be unfair even though nobody programmed it to be.
    params:
      keywords:
        - - daten
          - beispiel
          - data
          - example
        - - vergangenheit
          - früher
          - history
          - past
        - - stellvertret
          - proxy
          - verrät
          - reveal
      sample: The model learns from data from the past, which can contain unfair decisions. Even without the gender feature, a proxy such as where someone lives reveals a lot. So it copies the old unfairness.
    difficulty: 3

srs:
  cards_from: [bewerbung, versteckt]
