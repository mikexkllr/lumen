id: ai.safety.trust
type: concept
title: Wie viel Vertrauen?
summary: Zwischen blindem Glauben und Ablehnung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: navi
    widget: choice
    prompt: Jemand folgt dem Navi bis in einen Fluss. Wie nennt man diesen Fehler?
    params:
      options:
        - { label: Automatisierungsgläubigkeit, correct: true }
        - { label: Technikangst, feedback: "Das wäre das Gegenteil – hier wurde der Maschine zu sehr vertraut." }
    hints:
      - Wurde der Maschine zu viel oder zu wenig vertraut?
    explanation: Menschen schalten bei Automaten gern ihr eigenes Urteil ab.

  - kind: explain
    id: s2
    body: |
      KI ist ein starkes Werkzeug für **Entwürfe**. Je höher der Einsatz, desto wichtiger ist eine **menschliche Prüfung** – bei Gesundheit, Geld und Recht sowieso.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Reicht hier ein KI-Entwurf oder braucht es sorgfältige Prüfung?
    params:
      buckets: [{ label: Entwurf reicht }, { label: genau prüfen }]
      items:
        - { label: Ideen für einen Geburtstag, bucket: Entwurf reicht }
        - { label: Einen Text glätten, bucket: Entwurf reicht }
        - { label: Eine Medikamentendosis, bucket: genau prüfen }
        - { label: Einen Vertrag, bucket: genau prüfen }
    hints:
      - Was passiert im schlimmsten Fall?
    explanation: Der mögliche Schaden bestimmt, wie genau man hinschaut.

  - kind: problem
    id: quelle
    widget: choice
    prompt: Eine KI nennt eine Studie als Beleg. Was ist klug?
    params:
      options:
        - { label: Die Studie selbst suchen und lesen, correct: true }
        - { label: Sie direkt zitieren, feedback: "Sprachmodelle erfinden manchmal Quellen, die es nicht gibt." }
    hints:
      - Erinnere dich, wie Sprachmodelle Texte erzeugen.
    explanation: Belege prüft man an der Quelle – nicht in der Zusammenfassung.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Wie gründlich muss ein Mensch prüfen? Ordne von wenig nach viel.
    params:
      items:
        - label: Ideen für eine Geburtstagskarte
        - label: Zusammenfassung eines Artikels
        - label: Zahlen für die Steuererklärung
        - label: Dosis eines Medikaments
    hints:
      - Was passiert, wenn die Antwort falsch ist?
    explanation: Je teurer ein Fehler, desto mehr Prüfung.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Je höher der [[Einsatz]], desto wichtiger ist eine [[menschliche]] Prüfung.
      distractors:
        - Preis
        - schnelle

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein KI-Assistent hilft Ärzten bei Diagnosen und liegt zu 95 % richtig. Welche Gefahr besteht gerade **deshalb**?
    params:
      options:
        - label: Menschen prüfen nicht mehr nach – und übernehmen auch die 5 % Fehler
          correct: true
        - label: Die Ärzte verlieren ihren Job
          feedback: Hier geht es um die Qualität der Entscheidungen.
        - label: Keine – 95 % sind genug
          feedback: Bei Tausenden Patienten sind 5 % sehr viele.
    hints:
      - Wie aufmerksam bist du bei etwas, das fast immer stimmt?
    explanation: Je besser das System, desto schwerer bleibt man wachsam. Gute Systeme zeigen darum ihre **Unsicherheit**.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Modell sagt bei 200 Antworten jeweils »70 % sicher«. 120 davon stimmen. Wie viel Prozent stimmen tatsächlich?
    answer:
      value: 60
    hints:
      - Teile die richtigen durch alle Antworten.
      - 120 / 200 = ?
    explanation: "60 % statt 70 % – das Modell ist **überzuversichtlich**. Gute Kalibrierung heißt: »70 %« stimmt in etwa 70 % der Fälle. Erst dann kann man der Zahl trauen."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Mensch soll jede KI-Entscheidung freigeben. Nach Wochen klickt er nur noch »OK«. Wie nennt man das Risiko?
    params:
      options:
        - label: Die menschliche Prüfung wird zum bloßen Abnicken.
          correct: true
        - label: Überanpassung.
          feedback: Das betrifft Modelle, nicht die Menschen, die sie prüfen.
        - label: Kein Risiko – ein Mensch hat ja geprüft.
          feedback: Hat er eben nicht wirklich. Prüfen braucht Zeit, Wissen und Anreize.
    hints:
      - Was passiert mit Aufmerksamkeit, wenn fast alles stimmt?
      - Ist »ein Mensch hat geklickt« dasselbe wie »ein Mensch hat geprüft«?
    explanation: Echte **Aufsicht** braucht Zeit, Fachwissen und Stichproben mit bekannten Fehlern. Sonst ist »ein Mensch entscheidet« nur ein Etikett.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Modell sagt bei 100 Antworten jeweils »90 % sicher«. Wie viele sollten stimmen, wenn es gut **kalibriert** ist?
    params:
      options:
        - label: Etwa 90
          correct: true
        - label: Alle 100
          feedback: Dann hätte es »100 % sicher« sagen müssen.
        - label: Mindestens 50
          feedback: "Kalibriert heißt: Die genannte Sicherheit stimmt mit der Trefferquote überein."
    hints:
      - Die genannte Sicherheit soll der tatsächlichen Quote entsprechen.
    explanation: Erst mit kalibrierten Angaben kann man entscheiden, wann eine menschliche Prüfung nötig ist.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein KI-Entwurf ist zu 95 % fehlerfrei. Prüfen kostet 2 Minuten. Ein übersehener Fehler kostet 60 Minuten. Wie viele Minuten Verlust erwartest du im Schnitt **ohne** Prüfung?
    answer:
      value: 3
    hints:
      - Erwarteter Verlust = Fehlerwahrscheinlichkeit · Kosten.
      - 0,05 · 60 = ?
    explanation: 3 Minuten im Schnitt – mehr als die 2 Minuten Prüfung. Prüfen lohnt also. Je höher der **Einsatz**, desto eher lohnt sich Kontrolle, selbst bei guten Systemen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wann man einer KI vertrauen kann und wann ein Mensch genau hinsehen muss.
    params:
      keywords:
        - - einsatz
          - wichtig
          - gesundheit
          - geld
          - stakes
          - important
          - health
          - money
        - - prüf
          - kontroll
          - check
          - review
        - - entwurf
          - fehler
          - draft
          - error
          - mistake
      sample: Für Entwürfe und Ideen ist KI hilfreich, Fehler kosten dort wenig. Je wichtiger der Einsatz, etwa bei Gesundheit oder Geld, desto genauer muss ein Mensch prüfen.
    difficulty: 3

srs:
  cards_from: [navi, wo]
