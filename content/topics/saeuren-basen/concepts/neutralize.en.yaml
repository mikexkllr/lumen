id: chem.acids.neutralize
type: concept
title: Neutralization
summary: Acid plus base gives salt plus water.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Acid meets base
    body: "Acids and bases are opposites. Where they meet, something strange happens. Uncover the cards: where do you use this **neutralisation** without knowing?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐟
            front: Fishy smell
            back: The smell comes from basic substances. A squeeze of lemon binds them.
          - icon: 🦷
            front: After a meal
            back: Bacteria make your mouth acidic. Your saliva sets it right again.
          - icon: 🧴
            front: The acidic rinse
            back: After alkaline soap, an acidic rinse makes hair smooth again.

  - kind: problem
    id: hook
    widget: choice
    prompt: "You have heartburn: too much stomach acid. What helps?"
    params:
      options:
        - label: An alkaline remedy that cancels the acid
          correct: true
        - label: Lemon juice
          feedback: That would be even more acid.
        - label: Vinegar
          feedback: That is an acid too.
    hints:
      - What is the opposite of acidic?
    explanation: Acid and base cancel each other. You will now see what forms.

  - kind: explain
    id: s1
    body: |
      When H⁺ and OH⁻ meet, water forms: $H^+ + OH^- \to H_2O$. That is why an acid and a base cancel each other out. What remains is a **salt**.

  - kind: problem
    id: produkt
    widget: choice
    prompt: Hydrochloric acid HCl reacts with sodium hydroxide NaOH. What forms?
    params:
      options:
        - { label: Table salt NaCl and water, correct: true }
        - { label: Chlorine gas and sodium, feedback: "Something completely harmless forms." }
    hints:
      - H⁺ and OH⁻ become water. What is left over?
    explanation: Two corrosive substances make salt water. Chemistry can be surprising.

  - kind: problem
    id: menge
    widget: numeric
    prompt: How many moles of NaOH do you need to exactly neutralize {{n}} mol of HCl?
    params: { unit: mol }
    answer: { value: "{{n}}" }
    hints:
      - Each H⁺ needs one OH⁻.
    explanation: "One to one, so {{n}} mol."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: problem
    id: sodbrennen
    widget: choice
    prompt: How does a tablet help against heartburn?
    params:
      options:
        - { label: A weak base neutralizes excess stomach acid., correct: true }
        - { label: It dilutes the acid with water., feedback: "It reacts chemically with the acid." }
    hints:
      - What cancels out an acid?
    explanation: Antacids are bases. They turn acid into salt and water.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Acid and base together give [[water]] and a [[salt]].
      distractors:
        - gas
        - metal

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Sulfuric acid H₂SO₄ can release **two** H⁺. How many moles of NaOH are needed to neutralise 3 mol of sulfuric acid?
    params:
      unit: mol
    answer:
      value: 6
    hints:
      - Every H⁺ needs one OH⁻.
    explanation: 3 · 2 = 6 mol. What counts is the number of H⁺, not of molecules.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: tiles
    prompt: "Build the equation: hydrochloric acid reacts with caustic soda."
    params:
      tiles:
        - HCl
        - NaOH
        - +
        - +
        - →
        - NaCl
        - H₂O
        - Cl₂
        - H₂
    answer:
      anyOf:
        - - HCl
          - +
          - NaOH
          - →
          - NaCl
          - +
          - H₂O
        - - NaOH
          - +
          - HCl
          - →
          - NaCl
          - +
          - H₂O
        - - HCl
          - +
          - NaOH
          - →
          - H₂O
          - +
          - NaCl
        - - NaOH
          - +
          - HCl
          - →
          - H₂O
          - +
          - NaCl
    hints:
      - Acid plus base gives salt plus water.
      - H⁺ and OH⁻ become H₂O, Na⁺ and Cl⁻ stay behind as salt.
    explanation: HCl + NaOH → NaCl + H₂O. No Cl₂ or H₂ forms.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Calcium hydroxide Ca(OH)₂ provides two OH⁻. How many moles of HCl neutralise {{n}} mol of Ca(OH)₂?
    params:
      unit: mol
    answer:
      value: "{{2 * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: ratio-ignored
        text: Each Ca(OH)₂ brings two OH⁻ – it takes twice as much HCl.
    hints:
      - Ca(OH)₂ + 2 HCl → CaCl₂ + 2 H₂O.
      - Work out {{n}} · 2.
    explanation: "{{n}} mol of Ca(OH)₂ provide {{2 * n}} mol of OH⁻ – which needs {{2 * n}} mol of H⁺."
    difficulty: 2
    variants:
      params:
        n: int[1,9]
      defaults:
        n: 3

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Sulfuric acid H₂SO₄ reacts with potassium hydroxide KOH. Which salt forms?
    params:
      options:
        - label: K₂SO₄ – two K⁺ for one SO₄²⁻
          correct: true
        - label: KSO₄
          feedback: SO₄²⁻ carries a double charge and needs two K⁺.
        - label: KOH₂
          feedback: The salt is made of the metal and the acid's leftover.
    hints:
      - The leftover of H₂SO₄ is SO₄²⁻.
      - Balance the charge with K⁺.
    explanation: H₂SO₄ + 2 KOH → K₂SO₄ + 2 H₂O. Potassium sulfate is an important fertiliser.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Mixing strong acid and strong alkali makes the solution hot. Where does the heat come from?
    params:
      options:
        - label: Energy is released when water forms from H⁺ and OH⁻
          correct: true
        - label: From friction while mixing
          feedback: Stirring hardly warms.
        - label: The acid burns the alkali
          feedback: Nothing burns – a new bond forms.
    hints:
      - Forming bonds releases energy.
    explanation: "The reaction is **exothermic**: about 57 kJ per mole of water – always the same, whichever strong acid and base."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Every mole of water formed from H⁺ and OH⁻ releases about 57 kJ – the same for any strong acid and base. This is the **heat of neutralisation**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: "{{n}} mol of hydrochloric acid are neutralised with {{n}} mol of caustic soda. How much heat is released?"
    params:
      unit: kJ
    answer:
      value: "{{57 * n}}"
    hints:
      - "{{n}} mol of water form."
      - Work out {{n}} · 57 kJ.
    explanation: "{{n}} · 57 kJ = {{57 * n}} kJ. That is why concentrated acid is added slowly and with cooling."
    difficulty: 3
    variants:
      params:
        n: step[0.5,3,0.5]
      defaults:
        n: 2

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Sodium acetate is the salt of acetic acid and caustic soda. Dissolved, it is slightly basic. Why?
    params:
      options:
        - label: The acetate ion is a weak base and pulls H⁺ from water
          correct: true
        - label: There is leftover caustic soda
          feedback: Even pure sodium acetate is basic.
        - label: Salts are always basic
          feedback: Ammonium chloride, for instance, is slightly acidic.
    hints:
      - Acetic acid is weak – its leftover would like its H⁺ back.
      - CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻.
    explanation: The leftover of a weak acid is a base. So the point of neutralisation is not always at pH 7.
    difficulty: 3

srs:
  cards_from: [produkt, sodbrennen]
