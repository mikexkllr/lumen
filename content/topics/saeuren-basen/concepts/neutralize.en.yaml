id: chem.acids.neutralize
type: concept
title: Neutralization
summary: Acid plus base gives salt plus water.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "You have heartburn: too much stomach acid. What helps?"
    params:
      options:
        - label: An alkaline remedy that cancels the acid
          correct: true
        - label: Lemon juice
          feedback: That would be even more acid.
        - label: Vinegar
          feedback: That is an acid too.
    hints:
      - What is the opposite of acidic?
    explanation: Acid and base cancel each other. You will now see what forms.

  - kind: explain
    id: s1
    body: |
      When H⁺ and OH⁻ meet, water forms: $H^+ + OH^- \to H_2O$. That is why an acid and a base cancel each other out. What remains is a **salt**.

  - kind: problem
    id: produkt
    widget: choice
    prompt: Hydrochloric acid HCl reacts with sodium hydroxide NaOH. What forms?
    params:
      options:
        - { label: Table salt NaCl and water, correct: true }
        - { label: Chlorine gas and sodium, feedback: "Something completely harmless forms." }
    hints:
      - H⁺ and OH⁻ become water. What is left over?
    explanation: Two corrosive substances make salt water. Chemistry can be surprising.

  - kind: problem
    id: menge
    widget: numeric
    prompt: How many moles of NaOH do you need to exactly neutralize {{n}} mol of HCl?
    params: { unit: mol }
    answer: { value: "{{n}}" }
    hints:
      - Each H⁺ needs one OH⁻.
    explanation: "One to one, so {{n}} mol."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: problem
    id: sodbrennen
    widget: choice
    prompt: How does a tablet help against heartburn?
    params:
      options:
        - { label: A weak base neutralizes excess stomach acid., correct: true }
        - { label: It dilutes the acid with water., feedback: "It reacts chemically with the acid." }
    hints:
      - What cancels out an acid?
    explanation: Antacids are bases. They turn acid into salt and water.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Acid and base together give [[water]] and a [[salt]].
      distractors:
        - gas
        - metal

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Sulfuric acid H₂SO₄ can release **two** H⁺. How many moles of NaOH are needed to neutralise 3 mol of sulfuric acid?
    params:
      unit: mol
    answer:
      value: 6
    hints:
      - Every H⁺ needs one OH⁻.
    explanation: 3 · 2 = 6 mol. What counts is the number of H⁺, not of molecules.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Mixing strong acid and strong alkali makes the solution hot. Where does the heat come from?
    params:
      options:
        - label: Energy is released when water forms from H⁺ and OH⁻
          correct: true
        - label: From friction while mixing
          feedback: Stirring hardly warms.
        - label: The acid burns the alkali
          feedback: Nothing burns – a new bond forms.
    hints:
      - Forming bonds releases energy.
    explanation: "The reaction is **exothermic**: about 57 kJ per mole of water – always the same, whichever strong acid and base."
    difficulty: 3

srs:
  cards_from: [produkt, sodbrennen]
