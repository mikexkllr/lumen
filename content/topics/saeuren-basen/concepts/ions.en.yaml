id: chem.acids.ions
type: concept
title: What makes things sour
summary: Acids release H⁺.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: What do lemon, vinegar and cola have in common?
    params:
      options:
        - label: They contain acids
          correct: true
        - label: They are alkaline
          feedback: Then they would taste soapy.
        - label: Nothing
          feedback: All three taste sour.
    hints:
      - How do all three taste?
    explanation: Sour is what releases a certain particle into water.

  - kind: explain
    id: s1
    body: |
      **Acids** release hydrogen ions in water, written **H⁺**. **Bases** capture H⁺ or bring OH⁻ ions along. The more free H⁺, the more acidic the solution.

  - kind: problem
    id: gemeinsam
    widget: choice
    prompt: What do vinegar, lemon juice and hydrochloric acid have in common?
    params:
      options:
        - { label: They release H⁺ ions in water., correct: true }
        - { label: They are all poisonous., feedback: "People eat vinegar and lemon juice. The H⁺ ions are what matter." }
    hints:
      - What makes an acid an acid?
    explanation: H⁺ ions taste sour and attack limescale and metals.

  - kind: problem
    id: zerfall
    widget: choice
    prompt: Hydrogen chloride HCl dissolves in water. Which ions form?
    params:
      options:
        - { label: "H⁺ and Cl⁻", correct: true }
        - { label: "H⁻ and Cl⁺", feedback: "Chlorine takes the electron, so it becomes negative." }
    hints:
      - Acids release H⁺.
    explanation: The result is called hydrochloric acid, which is also in your stomach.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Acid or base?
    params:
      buckets: [{ label: Acid }, { label: Base }]
      items:
        - { label: Hydrochloric acid, bucket: Acid }
        - { label: Acetic acid, bucket: Acid }
        - { label: Sodium hydroxide solution, bucket: Base }
        - { label: Ammonia, bucket: Base }
    hints:
      - Alkaline solutions are dissolved bases.
    explanation: Alkaline solutions feel soapy. They dissolve fats.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Acids give off H⁺ ions.
          right: true
        - text: All acids are dangerous.
          right: false
          why: You eat citric acid and vitamin C daily.
        - text: Bases are more harmless than acids.
          right: false
          why: Strong alkalis burn skin just as badly.
        - text: An H⁺ ion is a single proton.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Acids give off [[H⁺]]. Bases catch them or bring [[OH⁻]] along.
      distractors:
        - Na⁺
        - Cl⁻

  - kind: problem
    id: mix-c2
    widget: order
    prompt: Order from acidic to alkaline.
    params:
      items:
        - label: Lemon juice
        - label: Coffee
        - label: Pure water
        - label: Soapy water
    hints:
      - What tastes most sour? And what feels slippery?
    explanation: From many free H⁺ to almost none.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Hydrochloric acid and vinegar are diluted equally. Still the first is far more acidic. Why?
    params:
      options:
        - label: Hydrochloric acid releases practically all its H⁺, acetic acid only about 1%
          correct: true
        - label: Hydrochloric acid contains more hydrogen
          feedback: Acetic acid even has four H per molecule.
        - label: Acetic acid is diluted
          feedback: The concentration is the same.
    hints:
      - Not every acid molecule lets go of its H⁺.
    explanation: "**Strong** acids dissociate completely, **weak** ones only to a small degree."
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "More precisely: an acid does not release its H⁺ into thin air. It hops onto a water molecule, forming H₃O⁺, the **hydronium ion**. Acids are H⁺ donors, bases are H⁺ catchers."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: match
    prompt: What is left once the acid has given away its H⁺?
    params:
      pairs:
        - left: HCl
          right: Cl⁻
        - left: H₂O
          right: OH⁻
        - left: NH₄⁺
          right: NH₃
        - left: H₂CO₃
          right: HCO₃⁻
        - left: CH₃COOH
          right: CH₃COO⁻
    hints:
      - Remove one H and take away one positive charge.
      - That turns NH₄⁺ into a neutral particle.
    explanation: "The acid and what is left form a **conjugate pair**: the leftover can take the H⁺ back – it is a base."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Water gives an H⁺ to ammonia but takes one from HCl. What is such a substance called?
    params:
      options:
        - label: Amphoteric – it can act as acid and as base
          correct: true
        - label: Indicator
          feedback: An indicator shows the pH by its colour.
        - label: Salt
          feedback: Water is not made of ions.
    hints:
      - Depending on its partner, water plays both roles.
      - The Greek "amphi" means "both".
    explanation: Faced with a stronger base, water acts as an acid; faced with a stronger acid, as a base.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ammonia NH₃ contains no OH – and is still a base. Why?
    params:
      options:
        - label: It takes up an H⁺ and becomes NH₄⁺
          correct: true
        - label: It is not a base at all
          feedback: Ammonia clearly turns indicators basic.
        - label: It gives off H⁺
          feedback: Then it would be an acid.
    hints:
      - According to Brønsted a base is a substance that accepts protons.
    explanation: "The **Brønsted definition**: acids donate protons, bases accept them. That is more general than “contains OH”."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Even pure water splits up a tiny bit: $2\\,H_2O \\rightleftharpoons H_3O^+ + OH^-$. At 25 °C, $[H_3O^+] \\cdot [OH^-] = 10^{-14}$ always holds. This is the **ion product** of water."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: A solution contains 10 to the −{{p}} mol/L of H₃O⁺. The OH⁻ concentration is then 10 to the minus what?
    answer:
      value: "{{14 - p}}"
    feedback:
      - when: numval(state.input) == p
        misconception: kw-same
        text: Together they make 10 to the −14. The exponents add up to 14.
    hints:
      - When you multiply, the exponents add.
      - "{{p}} + ? = 14."
    explanation: 10^−{{p}} · 10^−{{14 - p}} = 10^−14. That is also why pH + pOH = 14.
    difficulty: 3
    variants:
      params:
        p: int[1,13]
      constraints:
        - p != 7
      defaults:
        p: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Pure water at 60 °C has a pH of about 6.5. Is it acidic then?
    params:
      options:
        - label: No – it contains as many H₃O⁺ as OH⁻, so it is neutral
          correct: true
        - label: Yes, anything below 7 is acidic
          feedback: The 7 only holds at 25 °C.
        - label: The meter is badly calibrated
          feedback: The value is real.
    hints:
      - Heat makes more water split into ions.
      - "Neutral means: equal numbers of H₃O⁺ and OH⁻."
    explanation: The ion product grows with temperature. More H₃O⁺ form – but just as many OH⁻. At 60 °C, neutral simply sits at pH 6.5.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what an acid and a base are – using the picture of passing on H⁺.
    params:
      keywords:
        - - h⁺
          - h+
          - proton
          - wasserstoff-ion
          - hydrogen ion
        - - abgeb
          - spend
          - gibt
          - donor
          - donat
          - give
        - - aufnehm
          - fäng
          - nimmt
          - accept
          - take
          - catch
      sample: An acid gives away an H⁺, that is a proton – it is a donor. A base takes the H⁺. An acid–base reaction is the passing on of a proton.
    explanation: "That is the Brønsted definition: acids donate protons, bases accept them."
    difficulty: 3

srs:
  cards_from: [gemeinsam, sortieren]
