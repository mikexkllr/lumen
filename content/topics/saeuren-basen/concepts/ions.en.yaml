id: chem.acids.ions
type: concept
title: What makes things sour
summary: Acids release H⁺.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      **Acids** release hydrogen ions in water, written **H⁺**. **Bases** capture H⁺ or bring OH⁻ ions along. The more free H⁺, the more acidic the solution.

  - kind: problem
    id: gemeinsam
    widget: choice
    prompt: What do vinegar, lemon juice and hydrochloric acid have in common?
    params:
      options:
        - { label: They release H⁺ ions in water., correct: true }
        - { label: They are all poisonous., feedback: "People eat vinegar and lemon juice. The H⁺ ions are what matter." }
    hints:
      - What makes an acid an acid?
    explanation: H⁺ ions taste sour and attack limescale and metals.

  - kind: problem
    id: zerfall
    widget: choice
    prompt: Hydrogen chloride HCl dissolves in water. Which ions form?
    params:
      options:
        - { label: "H⁺ and Cl⁻", correct: true }
        - { label: "H⁻ and Cl⁺", feedback: "Chlorine takes the electron, so it becomes negative." }
    hints:
      - Acids release H⁺.
    explanation: The result is called hydrochloric acid, which is also in your stomach.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Acid or base?
    params:
      buckets: [{ label: Acid }, { label: Base }]
      items:
        - { label: Hydrochloric acid, bucket: Acid }
        - { label: Acetic acid, bucket: Acid }
        - { label: Sodium hydroxide solution, bucket: Base }
        - { label: Ammonia, bucket: Base }
    hints:
      - Alkaline solutions are dissolved bases.
    explanation: Alkaline solutions feel soapy. They dissolve fats.

srs:
  cards_from: [gemeinsam, sortieren]
