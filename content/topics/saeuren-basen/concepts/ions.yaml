id: chem.acids.ions
type: concept
title: Was sauer macht
summary: Säuren geben H⁺ ab.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Geheimnis der Säure
    body: "Säuren sind überall: in Ameisen, im Magen, in Brennnesseln. Ihr Geheimnis sind winzige Teilchen namens **H⁺-Ionen**. Tippe Felder an – jedes ist ein H⁺ im Wasser. Je mehr, desto saurer."
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 4
        cols: 6
        counter: true

  - kind: problem
    id: hook
    widget: choice
    prompt: Was haben Zitrone, Essig und Cola gemeinsam?
    params:
      options:
        - label: Sie enthalten Säuren
          correct: true
        - label: Sie sind basisch
          feedback: Dann würden sie seifig schmecken.
        - label: Nichts
          feedback: Alle drei schmecken sauer.
    hints:
      - Wie schmecken alle drei?
    explanation: Sauer schmeckt, was ein bestimmtes Teilchen ins Wasser abgibt.

  - kind: explain
    id: s1
    body: |
      **Säuren** geben in Wasser Wasserstoff-Ionen ab, kurz **H⁺**. **Basen** fangen H⁺ ein oder bringen OH⁻-Ionen mit. Je mehr freie H⁺, desto saurer die Lösung.

  - kind: problem
    id: gemeinsam
    widget: choice
    prompt: Was haben Essig, Zitronensaft und Salzsäure gemeinsam?
    params:
      options:
        - { label: Sie geben in Wasser H⁺-Ionen ab., correct: true }
        - { label: Sie sind alle giftig., feedback: "Essig und Zitronensaft isst man – entscheidend sind die H⁺-Ionen." }
    hints:
      - Was macht eine Säure aus?
    explanation: Die H⁺-Ionen schmecken sauer und greifen Kalk und Metalle an.

  - kind: problem
    id: zerfall
    widget: choice
    prompt: Chlorwasserstoff HCl löst sich in Wasser. Welche Ionen entstehen?
    params:
      options:
        - { label: "H⁺ und Cl⁻", correct: true }
        - { label: "H⁻ und Cl⁺", feedback: "Chlor nimmt das Elektron – es wird negativ." }
    hints:
      - Säuren geben H⁺ ab.
    explanation: Das Ergebnis heißt Salzsäure – so auch in deinem Magen.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Säure oder Base?
    params:
      buckets: [{ label: Säure }, { label: Base }]
      items:
        - { label: Salzsäure, bucket: Säure }
        - { label: Essigsäure, bucket: Säure }
        - { label: Natronlauge, bucket: Base }
        - { label: Ammoniak, bucket: Base }
    hints:
      - Laugen sind gelöste Basen.
    explanation: Laugen fühlen sich seifig an – sie lösen Fette.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Säuren geben H⁺-Ionen ab.
          right: true
        - text: Alle Säuren sind gefährlich.
          right: false
          why: Zitronensäure und Vitamin C isst du täglich.
        - text: Basen sind harmloser als Säuren.
          right: false
          why: Starke Laugen verätzen Haut genauso schlimm.
        - text: Ein H⁺-Ion ist ein einzelnes Proton.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Säuren geben [[H⁺]] ab. Basen fangen sie ein oder bringen [[OH⁻]] mit.
      distractors:
        - Na⁺
        - Cl⁻

  - kind: problem
    id: mix-c2
    widget: order
    prompt: Ordne von sauer nach basisch.
    params:
      items:
        - label: Zitronensaft
        - label: Kaffee
        - label: Reines Wasser
        - label: Seifenlauge
    hints:
      - Was schmeckt am saursten? Und was fühlt sich glitschig an?
    explanation: Von vielen freien H⁺ bis zu fast keinen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Salzsäure und Essig sind gleich stark verdünnt. Trotzdem ist die Salzsäure viel saurer. Warum?
    params:
      options:
        - label: Salzsäure gibt praktisch alle H⁺ ab, Essigsäure nur etwa 1 %
          correct: true
        - label: Salzsäure enthält mehr Wasserstoff
          feedback: Essigsäure hat sogar vier H pro Molekül.
        - label: Essigsäure ist verdünnt
          feedback: Die Konzentration ist dieselbe.
    hints:
      - Nicht jedes Säuremolekül lässt sein H⁺ los.
    explanation: "**Starke** Säuren zerfallen vollständig, **schwache** nur zum kleinen Teil."
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "Genauer: Eine Säure gibt ihr H⁺ nicht ins Leere ab. Es springt auf ein Wassermolekül, und es entsteht H₃O⁺, das **Oxonium-Ion**. Säuren sind H⁺-Spender, Basen H⁺-Fänger."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: match
    prompt: Was bleibt übrig, wenn die Säure ihr H⁺ abgegeben hat?
    params:
      pairs:
        - left: HCl
          right: Cl⁻
        - left: H₂O
          right: OH⁻
        - left: NH₄⁺
          right: NH₃
        - left: H₂CO₃
          right: HCO₃⁻
        - left: CH₃COOH
          right: CH₃COO⁻
    hints:
      - Nimm ein H weg und zieh eine Plusladung ab.
      - Aus NH₄⁺ wird so ein neutrales Teilchen.
    explanation: "Säure und Rest bilden ein **korrespondierendes Paar**: Der Rest kann das H⁺ wieder aufnehmen – er ist eine Base."
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Wasser gibt an Ammoniak ein H⁺ ab, nimmt aber von HCl eins auf. Wie nennt man einen solchen Stoff?
    params:
      options:
        - label: Ampholyt – er kann Säure und Base sein
          correct: true
        - label: Indikator
          feedback: Ein Indikator zeigt den pH-Wert durch Farbe an.
        - label: Salz
          feedback: Wasser besteht nicht aus Ionen.
    hints:
      - Wasser spielt je nach Partner beide Rollen.
      - Das griechische »amphi« heißt »beide«.
    explanation: Gegenüber einer stärkeren Base wirkt Wasser als Säure, gegenüber einer stärkeren Säure als Base.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ammoniak NH₃ enthält kein OH – und ist trotzdem eine Base. Warum?
    params:
      options:
        - label: Es nimmt ein H⁺ auf und wird zu NH₄⁺
          correct: true
        - label: Es ist gar keine Base
          feedback: Ammoniak färbt Indikatoren eindeutig basisch.
        - label: Es gibt H⁺ ab
          feedback: Dann wäre es eine Säure.
    hints:
      - Nach Brønsted ist eine Base ein Stoff, der Protonen aufnimmt.
    explanation: "Die **Brønsted-Definition**: Säuren geben Protonen, Basen nehmen sie. Das ist allgemeiner als »enthält OH«."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Selbst reines Wasser zerfällt ein klein wenig: $2\\,H_2O \\rightleftharpoons H_3O^+ + OH^-$. Bei 25 °C gilt immer $[H_3O^+] \\cdot [OH^-] = 10^{-14}$. Das ist das **Ionenprodukt** des Wassers."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: Eine Lösung enthält 10 hoch −{{p}} mol/L H₃O⁺. Die OH⁻-Konzentration ist dann 10 hoch minus wie viel?
    answer:
      value: "{{14 - p}}"
    feedback:
      - when: numval(state.input) == p
        misconception: kw-same
        text: Beide zusammen ergeben 10 hoch −14. Die Hochzahlen addieren sich zu 14.
    hints:
      - Beim Malnehmen addieren sich die Hochzahlen.
      - "{{p}} + ? = 14."
    explanation: 10^−{{p}} · 10^−{{14 - p}} = 10^−14. Darum gilt auch pH + pOH = 14.
    difficulty: 3
    variants:
      params:
        p: int[1,13]
      constraints:
        - p != 7
      defaults:
        p: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Reines Wasser hat bei 60 °C einen pH-Wert von etwa 6,5. Ist es dann sauer?
    params:
      options:
        - label: Nein – es enthält gleich viele H₃O⁺ wie OH⁻, ist also neutral
          correct: true
        - label: Ja, alles unter 7 ist sauer
          feedback: Die 7 gilt nur bei 25 °C.
        - label: Das Messgerät ist falsch geeicht
          feedback: Der Wert stimmt wirklich.
    hints:
      - Wärme lässt mehr Wasser in Ionen zerfallen.
      - "Neutral heißt: gleich viele H₃O⁺ und OH⁻."
    explanation: Das Ionenprodukt wächst mit der Temperatur. Es entstehen mehr H₃O⁺ – aber genauso viele OH⁻. Neutral liegt bei 60 °C eben bei pH 6,5.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was eine Säure und was eine Base ist – mit dem Bild vom H⁺-Weitergeben.
    params:
      keywords:
        - - h⁺
          - h+
          - proton
          - wasserstoff-ion
          - hydrogen ion
        - - abgeb
          - spend
          - gibt
          - donor
          - donat
          - give
        - - aufnehm
          - fäng
          - nimmt
          - accept
          - take
          - catch
      sample: Eine Säure gibt ein H⁺, also ein Proton, ab – sie ist ein Spender. Eine Base nimmt das H⁺ auf. Eine Säure-Base-Reaktion ist das Weitergeben eines Protons.
    explanation: "Das ist die Definition nach Brønsted: Säuren spenden Protonen, Basen nehmen sie auf."
    difficulty: 3

srs:
  cards_from: [gemeinsam, sortieren]
