id: chem.acids.scale
type: concept
title: Die pH-Skala genau
summary: Jede Stufe zählt zehnfach.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: faktor
    widget: numeric
    prompt: Lösung A hat pH {{a}}, Lösung B pH {{a + d}}. Wievielmal mehr H⁺-Ionen hat A?
    params: { unit: "-mal" }
    answer: { value: "{{10 ** d}}" }
    feedback:
      - when: "numval(state.input) == d"
        misconception: linear
        text: Jede Stufe ist ein Faktor 10 – nicht eins mehr.
    hints:
      - "{{d}} Stufen – {{d}}-mal mal 10."
    explanation: "$10^{ {{d}} } = {{10 ** d}}$-mal so viele H⁺-Ionen."
    variants:
      params: { a: "int[1,4]", d: "int[2,4]" }
      defaults: { a: 2, d: 3 }

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne von sauer nach basisch.
    params:
      items:
        - { label: Magensaft }
        - { label: Zitronensaft }
        - { label: Regenwasser }
        - { label: Blut }
        - { label: Seifenlauge }
    hints:
      - Blut ist ganz leicht basisch.
    explanation: Magen etwa 1,5, Zitrone 2, Regen 5,6, Blut 7,4, Seife 10.

  - kind: problem
    id: regen
    widget: choice
    prompt: Warum ist selbst sauberer Regen leicht sauer?
    params:
      options:
        - { label: Er löst CO₂ aus der Luft und bildet Kohlensäure., correct: true }
        - { label: Wegen Abgasen, feedback: "Abgase machen ihn noch saurer – aber schon saubere Luft enthält CO₂." }
    hints:
      - Welches Gas ist immer in der Luft?
    explanation: Kohlensäure senkt den pH auf etwa 5,6.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der pH-Wert ist $-\log_{10}$ der H⁺-Konzentration. Eine Lösung hat 0,001 mol/L H⁺. Welchen pH-Wert hat sie?
    answer:
      value: 3
    hints:
      - 0,001 = 10⁻³.
    explanation: pH 3 – der Exponent ohne Minuszeichen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "In Wasser gilt immer: pH + pOH = 14. Eine Lauge hat 0,01 mol/L OH⁻. Welchen pH-Wert hat sie?"
    answer:
      value: 12
    hints:
      - pOH = 2.
    explanation: 14 − 2 = 12. Selbst reines Wasser enthält je 10⁻⁷ mol/L H⁺ und OH⁻ – darum ist pH 7 neutral.
    difficulty: 3

srs:
  cards_from: [faktor, ordnen]
