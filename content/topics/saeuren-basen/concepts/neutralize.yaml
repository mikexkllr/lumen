id: chem.acids.neutralize
type: concept
title: Neutralisation
summary: Säure plus Base gibt Salz plus Wasser.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Du hast Sodbrennen: zu viel Magensäure. Was hilft?"
    params:
      options:
        - label: Ein basisches Mittel, das die Säure aufhebt
          correct: true
        - label: Zitronensaft
          feedback: Das wäre noch mehr Säure.
        - label: Essig
          feedback: Auch das ist eine Säure.
    hints:
      - Was ist das Gegenteil von sauer?
    explanation: Säure und Base heben sich auf. Was dabei entsteht, siehst du jetzt.

  - kind: explain
    id: s1
    body: |
      Treffen H⁺ und OH⁻ aufeinander, entsteht Wasser: $H^+ + OH^- \to H_2O$. Darum heben sich Säure und Base gegenseitig auf. Übrig bleibt ein **Salz**.

  - kind: problem
    id: produkt
    widget: choice
    prompt: Salzsäure HCl reagiert mit Natronlauge NaOH. Was entsteht?
    params:
      options:
        - { label: Kochsalz NaCl und Wasser, correct: true }
        - { label: Chlorgas und Natrium, feedback: "Es entsteht etwas völlig Harmloses." }
    hints:
      - H⁺ und OH⁻ werden zu Wasser. Was bleibt übrig?
    explanation: Zwei ätzende Stoffe ergeben Salzwasser – Chemie kann verblüffen.

  - kind: problem
    id: menge
    widget: numeric
    prompt: Wie viel Mol NaOH braucht man, um {{n}} mol HCl genau zu neutralisieren?
    params: { unit: mol }
    answer: { value: "{{n}}" }
    hints:
      - Jedes H⁺ braucht ein OH⁻.
    explanation: "Eins zu eins – {{n}} mol."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: problem
    id: sodbrennen
    widget: choice
    prompt: Wie hilft eine Tablette gegen Sodbrennen?
    params:
      options:
        - { label: Eine schwache Base neutralisiert überschüssige Magensäure., correct: true }
        - { label: Sie verdünnt die Säure mit Wasser., feedback: "Sie reagiert chemisch mit der Säure." }
    hints:
      - Was hebt eine Säure auf?
    explanation: Antazida sind Basen – sie verwandeln Säure in Salz und Wasser.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Säure und Base ergeben zusammen [[Wasser]] und ein [[Salz]].
      distractors:
        - Gas
        - Metall

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Schwefelsäure H₂SO₄ kann **zwei** H⁺ abgeben. Wie viel Mol NaOH braucht man, um 3 mol Schwefelsäure zu neutralisieren?
    params:
      unit: mol
    answer:
      value: 6
    hints:
      - Jedes H⁺ braucht ein OH⁻.
    explanation: 3 · 2 = 6 mol. Es kommt auf die Zahl der H⁺ an, nicht der Moleküle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Mischt man starke Säure und starke Lauge, wird die Lösung heiß. Woher kommt die Wärme?
    params:
      options:
        - label: Beim Bilden von Wasser aus H⁺ und OH⁻ wird Energie frei
          correct: true
        - label: Aus der Reibung beim Mischen
          feedback: Rühren erwärmt kaum.
        - label: Die Säure verbrennt die Lauge
          feedback: Es verbrennt nichts – es entsteht eine neue Bindung.
    hints:
      - Bindungen zu bilden setzt Energie frei.
    explanation: "Die Reaktion ist **exotherm**: rund 57 kJ pro Mol Wasser – immer gleich, egal welche starke Säure und Base."
    difficulty: 3

srs:
  cards_from: [produkt, sodbrennen]
