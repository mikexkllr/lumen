id: chem.acids.neutralize
type: concept
title: Neutralisation
summary: Säure plus Base gibt Salz plus Wasser.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Treffen H⁺ und OH⁻ aufeinander, entsteht Wasser: $H^+ + OH^- \to H_2O$. Darum heben sich Säure und Base gegenseitig auf. Übrig bleibt ein **Salz**.

  - kind: problem
    id: produkt
    widget: choice
    prompt: Salzsäure HCl reagiert mit Natronlauge NaOH. Was entsteht?
    params:
      options:
        - { label: Kochsalz NaCl und Wasser, correct: true }
        - { label: Chlorgas und Natrium, feedback: "Es entsteht etwas völlig Harmloses." }
    hints:
      - H⁺ und OH⁻ werden zu Wasser. Was bleibt übrig?
    explanation: Zwei ätzende Stoffe ergeben Salzwasser – Chemie kann verblüffen.

  - kind: problem
    id: menge
    widget: numeric
    prompt: Wie viel Mol NaOH braucht man, um {{n}} mol HCl genau zu neutralisieren?
    params: { unit: mol }
    answer: { value: "{{n}}" }
    hints:
      - Jedes H⁺ braucht ein OH⁻.
    explanation: "Eins zu eins – {{n}} mol."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: problem
    id: sodbrennen
    widget: choice
    prompt: Wie hilft eine Tablette gegen Sodbrennen?
    params:
      options:
        - { label: Eine schwache Base neutralisiert überschüssige Magensäure., correct: true }
        - { label: Sie verdünnt die Säure mit Wasser., feedback: "Sie reagiert chemisch mit der Säure." }
    hints:
      - Was hebt eine Säure auf?
    explanation: Antazida sind Basen – sie verwandeln Säure in Salz und Wasser.

srs:
  cards_from: [produkt, sodbrennen]
