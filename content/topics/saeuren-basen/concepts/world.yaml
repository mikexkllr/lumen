id: chem.acids.world
type: concept
title: Säuren in der Welt
summary: Magen, Meer und Garten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: loesungen
    widget: match
    prompt: Welches Mittel hilft?
    params:
      pairs:
        - { left: Kalk im Wasserkocher, right: Zitronensäure }
        - { left: Zu saurer Gartenboden, right: Kalk streuen }
        - { left: Sodbrennen, right: Magentablette }
    hints:
      - Säure gegen Kalk, Base gegen Säure.
    explanation: Kalk ist basisch – Säure löst ihn auf. Umgekehrt neutralisiert Kalk saure Böden.

  - kind: problem
    id: magen
    widget: choice
    prompt: Warum ist der Magen so stark sauer – mit pH 1 bis 2?
    params:
      options:
        - { label: Er tötet Keime und hilft beim Verdauen von Eiweiß., correct: true }
        - { label: Weil wir saure Dinge essen., feedback: "Der Magen produziert seine Säure selbst." }
    hints:
      - Was soll mit Bakterien im Essen passieren?
    explanation: Eine Schleimschicht schützt die Magenwand vor der eigenen Säure.

  - kind: explain
    id: s3
    body: |
      Das Meer nimmt rund ein Viertel des ausgestoßenen CO₂ auf. Dabei entsteht Kohlensäure, und der pH-Wert sinkt – die **Ozeanversauerung**.

  - kind: problem
    id: meer
    widget: choice
    prompt: Wem schadet die Ozeanversauerung besonders?
    params:
      options:
        - { label: Muscheln und Korallen mit Kalkschalen, correct: true }
        - { label: Vor allem Haien, feedback: "Am stärksten betroffen sind Tiere, die Kalk bauen." }
    hints:
      - Was macht Säure mit Kalk?
    explanation: Saures Wasser erschwert den Aufbau von Kalkschalen und -skeletten.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der pH-Wert der Ozeane sank von 8,2 auf 8,1. Um wie viel Prozent stieg die H⁺-Konzentration? (10 hoch 0,1 ≈ 1,26)
    params:
      unit: "%"
    answer:
      value: 26
      tolerance: 1
    hints:
      - Ein Unterschied von 0,1 pH ist der Faktor 10 hoch 0,1.
    explanation: 26 % mehr H⁺. Kleine pH-Änderungen sind große chemische Änderungen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was passiert bei einer Neutralisation?"
    params:
      keywords:
        - - säure
          - acid
          - h+
          - h⁺
          - proton
        - - base
          - lauge
          - alkali
          - oh
        - - wasser
          - water
        - - salz
          - salt
      min: 3
      sample: Eine Säure und eine Base reagieren miteinander. Die H⁺-Ionen der Säure und die OH⁻-Ionen der Base bilden Wasser, übrig bleibt ein Salz.
    difficulty: 3

srs:
  cards_from: [loesungen, meer]
