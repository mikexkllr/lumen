id: geo.circles.cylinder
type: concept
title: Cylinders and cans
summary: Circle area times height.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many millilitres fit into a standard drinks can?"
    params:
      min: 50
      max: 1000
      unit: ml
    answer:
      value: 330
      tolerance: 60
    explanation: 330 ml. In a moment you will check this from radius and height.


  - kind: explain
    id: s1
    body: |
      A **cylinder** is a stack of circles. Its volume is base area times height: V = π · r² · h.

  - kind: problem
    id: dose
    widget: numeric
    prompt: A can has radius {{r}} cm and height {{h}} cm. What is its volume? Use π ≈ 3.14.
    params: { unit: cm³ }
    answer: { value: "{{3.14 * r * r * h}}", tolerance: 1 }
    feedback:
      - when: "abs(numval(state.input) - 2 * 3.14 * r * h) < 1"
        misconception: perimeter-not-area
        text: For the base area, you need r², not 2 · r.
    hints:
      - "Base area 3.14 · {{r}}² – then times {{h}}."
    explanation: "3.14 · {{r * r}} · {{h}} ≈ {{3.14 * r * r * h}} cm³."
    variants:
      params: { r: "int[3,6]", h: "int[8,15]" }
      defaults: { r: 4, h: 10 }

  - kind: problem
    id: doppelt
    widget: choice
    prompt: One can is twice as wide as another, but the same height. How much more fits inside?
    params:
      options:
        - { label: Four times as much, correct: true }
        - { label: Twice as much, feedback: "The radius is squared." }
        - { label: Eight times as much, feedback: "The height stays the same – only the base area grows." }
    hints:
      - Double the radius – what happens to r²?
    explanation: Double the radius, four times the base area, four times the volume.

  - kind: problem
    id: liter
    widget: numeric
    prompt: A pipe has an inner radius of 10 cm and is 100 cm long. How many liters fit inside? π ≈ 3.14.
    params: { unit: liters }
    answer: { value: 31.4, tolerance: 0.2 }
    hints:
      - Volume in cm³, then divide by 1000.
    explanation: 3.14 · 100 · 100 = 31,400 cm³ = 31.4 liters.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A can (r = 5 cm, h = 10 cm) gets a label around its side. How large is it? π ≈ 3.14.
    params:
      unit: cm²
    answer:
      value: 314
      tolerance: 1
    hints:
      - "Unrolled the side is a rectangle: circumference times height."
    explanation: 2 · 3.14 · 5 · 10 = 314.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "For a fixed volume: which can needs the least metal?"
    params:
      options:
        - label: The one whose height equals its diameter
          correct: true
        - label: One as flat as possible
          feedback: Then lid and base become huge.
        - label: One as tall as possible
          feedback: Then the side becomes huge.
    hints:
      - Flat cans have big lids, tall ones a big side. The best lies in between.
    explanation: With calculus you find h = 2r. Real cans differ – because of stacking and seams.
    difficulty: 3

srs:
  cards_from: [dose, doppelt]
