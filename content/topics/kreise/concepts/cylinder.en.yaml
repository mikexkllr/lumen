id: geo.circles.cylinder
type: concept
title: Cylinders and cans
summary: Circle area times height.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: From circle to can
    body: Cans, pipes and candles share one shape. Turn over the cards in order. Step by step, a flat disc becomes a **cylinder** – and you see how to work out its volume.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🪙
            front: One coin
            back: A flat disc. Its area is π · r².
          - icon: 🥞
            front: A stack
            back: "Pile disc on disc: each one brings the same circle area."
          - icon: 🥫
            front: The can
            back: "A tall stack is a cylinder: volume = base area times height."

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many millilitres fit into a standard drinks can?"
    params:
      min: 50
      max: 1000
      unit: ml
    answer:
      value: 330
      tolerance: 60
    explanation: 330 ml. In a moment you will check this from radius and height.

  - kind: explain
    id: s1
    body: |
      A **cylinder** is a stack of circles. Its volume is base area times height: V = π · r² · h.

  - kind: problem
    id: dose
    widget: numeric
    prompt: A can has radius {{r}} cm and height {{h}} cm. What is its volume? Use π ≈ 3.14.
    params: { unit: cm³ }
    answer: { value: "{{3.14 * r * r * h}}", tolerance: 1 }
    feedback:
      - when: "abs(numval(state.input) - 2 * 3.14 * r * h) < 1"
        misconception: perimeter-not-area
        text: For the base area, you need r², not 2 · r.
    hints:
      - "Base area 3.14 · {{r}}² – then times {{h}}."
    explanation: "3.14 · {{r * r}} · {{h}} ≈ {{3.14 * r * r * h}} cm³."
    variants:
      params: { r: "int[3,6]", h: "int[8,15]" }
      defaults: { r: 4, h: 10 }

  - kind: problem
    id: doppelt
    widget: choice
    prompt: One can is twice as wide as another, but the same height. How much more fits inside?
    params:
      options:
        - { label: Four times as much, correct: true }
        - { label: Twice as much, feedback: "The radius is squared." }
        - { label: Eight times as much, feedback: "The height stays the same – only the base area grows." }
    hints:
      - Double the radius – what happens to r²?
    explanation: Double the radius, four times the base area, four times the volume.

  - kind: problem
    id: liter
    widget: numeric
    prompt: A pipe has an inner radius of 10 cm and is 100 cm long. How many liters fit inside? π ≈ 3.14.
    params: { unit: liters }
    answer: { value: 31.4, tolerance: 0.2 }
    hints:
      - Volume in cm³, then divide by 1000.
    explanation: 3.14 · 100 · 100 = 31,400 cm³ = 31.4 liters.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A can (r = 5 cm, h = 10 cm) gets a label around its side. How large is it? π ≈ 3.14.
    params:
      unit: cm²
    answer:
      value: 314
      tolerance: 1
    hints:
      - "Unrolled the side is a rectangle: circumference times height."
    explanation: 2 · 3.14 · 5 · 10 = 314.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: A can has r = {{r}} cm and h = {{h}} cm. How much metal do the bottom, lid and side need? π ≈ 3.14.
    params:
      unit: cm²
    answer:
      value: "{{2 * 3.14 * r * r + 2 * 3.14 * r * h}}"
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 2 * 3.14 * r * h) < 1
        misconception: mantle-only
        text: That is only the side. Bottom and lid are missing.
    hints:
      - "Two circles: 2 · 3.14 · {{r}}²."
      - "Side: circumference · height = 2 · 3.14 · {{r}} · {{h}}."
    explanation: "{{2 * 3.14 * r * r}} + {{2 * 3.14 * r * h}} = {{2 * 3.14 * r * r + 2 * 3.14 * r * h}} cm²."
    difficulty: 2
    variants:
      params:
        r: int[2,6]
        h: int[4,12]
      defaults:
        r: 5
        h: 10

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: A can has r = 4 cm and h = 10 cm. How many millilitres does it hold? 1 cm³ = 1 ml, π ≈ 3.14.
    params:
      unit: ml
    answer:
      value: 502.4
      tolerance: 1
    hints:
      - "Base: 3.14 · 16."
      - 50.24 · 10.
    explanation: 3.14 · 16 · 10 = 502.4 ml – half a litre.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: A cone has the same base and height as a cylinder. How much does it hold?
    params:
      options:
        - label: "Try it with water: pouring three times fills the cylinder."
          feedback: "Probiere es mit Wasser: Dreimal Umfüllen füllt den Zylinder."
        - label: One third
          correct: true
        - label: The cone narrows to a point – a lot is missing.
          feedback: Der Kegel wird nach oben spitz – da fehlt viel.
    hints:
      - The cone gets narrower towards the top.
      - The formula is $V = \frac{1}{3} \pi r^2 h$.
    explanation: One third. That holds for any point over any base – pyramids too.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "For a fixed volume: which can needs the least metal?"
    params:
      options:
        - label: The one whose height equals its diameter
          correct: true
        - label: One as flat as possible
          feedback: Then lid and base become huge.
        - label: One as tall as possible
          feedback: Then the side becomes huge.
    hints:
      - Flat cans have big lids, tall ones a big side. The best lies in between.
    explanation: With calculus you find h = 2r. Real cans differ – because of stacking and seams.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: A sphere has volume $V = \frac{4}{3}\pi r^3$. What is it for r = 3 cm? π ≈ 3.14.
    params:
      unit: cm³
    answer:
      value: 113.04
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 37.68) < 0.1
        misconception: square-not-cube
        text: That is $\frac{4}{3}\pi r^2$. The radius must be cubed.
    hints:
      - $3^3 = 27$.
      - $\frac{4}{3} \cdot 3.14 \cdot 27$.
    explanation: 4 · 3.14 · 9 = 113.04 cm³.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Archimedes found: a **sphere** fills exactly two thirds of the cylinder that fits tightly around it. He was so proud of this that he wanted the figure on his gravestone."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: A sphere with r = 1 sits in a cylinder with r = 1 and h = 2. What percentage of the cylinder does it fill? To one decimal.
    params:
      unit: "%"
    answer:
      value: 66.7
      tolerance: 0.1
    hints:
      - "Sphere: $\\frac{4}{3}\\pi$. Cylinder: $\\pi \\cdot 1^2 \\cdot 2 = 2\\pi$."
      - "$\\frac{4}{3} : 2 = \\frac{2}{3}$."
    explanation: 2/3 ≈ 66.7 % – π cancels out.
    difficulty: 3

srs:
  cards_from: [dose, doppelt]
