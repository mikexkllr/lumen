id: geo.circles.sectors
type: concept
title: Tortenstücke
summary: Winkel durch 360.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wie groß ist mein Stück?
    body: "Ob Torte oder Tortendiagramm: Jedes Stück hat einen Winkel. Dreh den Strahl und sieh, wie das Stück wächst. Eine volle Runde sind **360°**. Welcher Winkel gehört dann zu einer halben Torte?"
    visual:
      widget: angle
      interactive: true
      params:
        initial: 45
        max: 360
        snap: 15

  - kind: problem
    id: viertel
    widget: fraction
    prompt: Färbe ein Viertel des Kreises.
    params: { parts: 4, shape: circle }
    answer: { fraction: "1/4" }
    hints:
      - Ein Viertel ist ein Teil von vier.
    explanation: Ein Viertel entspricht einem Winkel von 90°.

  - kind: explain
    id: s2
    body: Ein **Kreisausschnitt** ist ein Tortenstück. Sein Anteil am ganzen Kreis ist sein Winkel geteilt durch 360°.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: Ein Tortenstück hat einen Winkel von {{w}}°. Welcher Anteil der Torte ist das? Gib einen Bruch an.
    params: { placeholder: "z. B. 1/3" }
    answer: { value: "{{w}}/360" }
    hints:
      - "Rechne {{w}} / 360 und kürze."
    explanation: "{{w}}/360 – gekürzt {{360 / w == round(360 / w) ? '1/' + (360 / w) : w / gcd(w, 360) + '/' + 360 / gcd(w, 360)}}."
    variants:
      params: { w: "choice[30,45,60,90,120]" }
      defaults: { w: 45 }

  - kind: problem
    id: diagramm
    widget: numeric
    prompt: In einem Tortendiagramm stehen {{p}} % für den Bus. Wie groß ist sein Winkel?
    params: { unit: "°" }
    answer: { value: "{{p * 3.6}}" }
    feedback:
      - when: "numval(state.input) == p"
        misconception: percent-as-degrees
        text: Prozent und Grad sind nicht dasselbe. 100 % sind 360°.
    hints:
      - 1 % entspricht 3,6°.
    explanation: "{{p}} · 3,6° = {{p * 3.6}}°."
    variants:
      params: { p: "choice[10,20,25,40,50]" }
      defaults: { p: 25 }

  - kind: explain
    id: s5
    body: Warum hat ein Kreis eigentlich 360 Grad?
    reveal:
      body: Das geht auf die Babylonier zurück. 360 lässt sich durch sehr viele Zahlen teilen – 2, 3, 4, 5, 6, 8, 9, 10, 12 und mehr.

  - kind: problem
    id: bogen
    widget: choice
    prompt: Wie lang ist ein Kreisbogen über 90° bei einem Radius von 2 m?
    params:
      options:
        - { label: "Etwa 3,14 m", correct: true }
        - { label: "Etwa 12,57 m", feedback: "Das ist der ganze Umfang. Gefragt ist ein Viertel davon." }
        - { label: "Etwa 6,28 m", feedback: "Das wäre ein halber Kreis." }
        - { label: "Etwa 1,57 m", feedback: "Das wäre ein Achtel des Umfangs." }
    hints:
      - Rechne erst den ganzen Umfang aus.
    explanation: Der Umfang ist 2 · π · 2 ≈ 12,57 m. Ein Viertel davon sind etwa 3,14 m.

  - kind: problem
    id: c1
    widget: match
    prompt: Welcher Winkel gehört zu welchem Anteil?
    params:
      pairs:
        - left: 90°
          right: 1/4
        - left: 120°
          right: 1/3
        - left: 45°
          right: 1/8
        - left: 72°
          right: 1/5
        - left: 270°
          right: 3/4
    hints:
      - Teile den Winkel durch 360.
    explanation: Anteil = Winkel / 360°.

  - kind: problem
    id: intro-c1
    widget: angle
    prompt: Drei Freunde teilen eine Torte gerecht. Stelle den Winkel für ein Stück ein.
    params:
      initial: 30
      max: 360
      snap: 5
    answer:
      value: 120
    hints:
      - Die ganze Torte hat 360°.
      - Teile 360° durch 3.
    explanation: "360° : 3 = 120°. Jedes Stück ist ein Drittel der Torte."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Kreisausschnitt hat den Radius 6 cm und den Winkel 60°. Wie groß ist seine Fläche? π ≈ 3,14.
    params:
      unit: cm²
    answer:
      value: 18.84
      tolerance: 0.1
    hints:
      - Ein Sechstel der Kreisfläche π · 36.
    explanation: "113,04 : 6 = 18,84."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: angle
    prompt: In einem Tortendiagramm stehen 30 % für Sport. Stelle den Winkel des Stücks ein.
    params:
      initial: 10
      snap: 1
      max: 360
    answer:
      value: 108
    hints:
      - 1 % sind 3,6°.
      - 30 · 3,6° = ?
    explanation: 30 % von 360° = 108°.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Wie lang ist ein Kreisbogen mit Radius {{r}} cm und Winkel {{w}}°? Rechne mit π ≈ 3,14.
    params:
      unit: cm
    answer:
      value: "{{2 * 3.14 * r * w / 360}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 3.14 * r * r * w / 360) < 0.1
        misconception: area-not-arc
        text: Das ist die Fläche des Ausschnitts. Gefragt ist die Länge des Bogens.
    hints:
      - Der ganze Umfang ist 2 · 3,14 · {{r}}.
      - "Davon der Anteil {{w}} : 360."
    explanation: "{{2 * 3.14 * r}} cm · {{w}}/360 ≈ {{2 * 3.14 * r * w / 360}} cm."
    difficulty: 2
    variants:
      params:
        r: int[3,9]
        w: choice[30,45,60,90,120,180]
      defaults:
        r: 6
        w: 60

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Jedes Pizzastück hat einen Winkel von 45°. In wie viele Stücke ist die Pizza geteilt?
    answer:
      value: 8
    hints:
      - Alle Stücke zusammen ergeben 360°.
      - "360 : 45 = ?"
    explanation: "360° : 45° = 8 Stücke."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Im **Bogenmaß** misst man Winkel als Bogenlänge am Einheitskreis. Wie viel sind 180° im Bogenmaß? Auf zwei Stellen.
    answer:
      value: 3.14
      tolerance: 0.01
    hints:
      - Der ganze Einheitskreis hat den Umfang 2π.
    explanation: 180° ist ein halber Kreis, also π. Im Bogenmaß werden viele Formeln einfacher.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Im **Bogenmaß** misst man einen Winkel als Bogenlänge auf dem Kreis mit Radius 1. Eine volle Drehung ist dann 2π ≈ 6,28. Der Bogen ist einfach b = r · Winkel.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Wie viel sind 90° im Bogenmaß? Auf zwei Stellen.
    answer:
      value: 1.57
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 3.14) < 0.01
        misconception: half-turn
        text: Das sind 180°. 90° ist die Hälfte davon.
    hints:
      - "360° = 2π, also 90° = 2π : 4."
      - "π : 2 ≈ ?"
    explanation: π/2 ≈ 1,57. Ein Viertelkreis mit Radius 1 hat genau diese Bogenlänge.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: sim
    prompt: "Am Einheitskreis: Stelle den Winkel so ein, dass cos und sin beide etwa −0,71 sind."
    params:
      scene: unitcircle
    answer:
      cos: -0.71
      sin: -0.71
    hints:
      - "Beide negativ heißt: links unten."
      - Genau in der Mitte zwischen 180° und 270°.
    explanation: 225° – der Punkt liegt diagonal links unten. 0,71 ≈ √2/2.
    difficulty: 3

srs:
  cards_from: [anteil, diagramm]
