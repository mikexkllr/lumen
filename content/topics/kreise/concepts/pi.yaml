id: geo.circles.pi
type: concept
title: Die Zahl π
summary: Jeder Kreis hat dasselbe Verhältnis.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Seil liegt straff um den Äquator (40 000 km). Du verlängerst es um 1 Meter. Wie viele Zentimeter hebt es überall ab?"
    params:
      min: 0
      max: 50
      unit: cm
    answer:
      value: 16
      tolerance: 4
    explanation: "1 m : (2π) ≈ 16 cm – egal wie groß die Kugel ist. Eine Katze passt darunter durch."


  - kind: problem
    id: rad
    widget: choice
    prompt: Ein Rad mit 1 m Durchmesser rollt genau eine Umdrehung. Wie weit kommt es?
    params:
      layout: grid
      options:
        - { label: Gut 3 m, correct: true }
        - { label: 1 m, feedback: "Der Rand ist viel länger als der Durchmesser. Stell dir das Rad abgerollt vor." }
        - { label: 2 m, feedback: "Schon näher – aber der Umfang ist mehr als doppelt so lang." }
        - { label: 6 m, feedback: "Zu viel. Das wäre bei 2 m Durchmesser ungefähr richtig." }
    hints:
      - Das Rad legt beim Rollen seinen Umfang zurück.
    explanation: Der Umfang ist rund 3,14 m – gut dreimal der Durchmesser.

  - kind: explain
    id: s2
    body: |
      Bei **jedem** Kreis ist der Umfang etwa 3,14-mal so lang wie der **Durchmesser**.
      Diese Zahl heißt **π** (Pi). Sie hat unendlich viele Stellen.

  - kind: problem
    id: umfang-d
    widget: numeric
    prompt: Ein Kreis hat den Durchmesser {{d}} cm. Wie lang ist sein Umfang? Rechne mit π ≈ 3,14.
    params: { unit: cm }
    answer: { value: "{{d * 3.14}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - 2 * 3.14 * d) < 0.2"
        misconception: radius-formula
        text: Du hast mit 2 · π gerechnet. Das braucht man nur beim Radius.
    hints:
      - Umfang = π · Durchmesser.
    explanation: "3,14 · {{d}} = {{d * 3.14}} cm."
    variants:
      params: { d: "int[2,20]" }
      defaults: { d: 10 }

  - kind: explain
    id: s4
    body: |
      **U = π · d = 2 · π · r.**
      Der **Radius** r ist der halbe Durchmesser.

  - kind: problem
    id: umfang-r
    widget: numeric
    prompt: Ein Kreis hat den Radius {{r}} cm. Wie lang ist sein Umfang? Rechne mit π ≈ 3,14.
    params: { unit: cm }
    answer: { value: "{{2 * 3.14 * r}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - 3.14 * r) < 0.2"
        misconception: radius-as-diameter
        text: Du hast den Radius wie den Durchmesser benutzt. Verdopple ihn zuerst.
    hints:
      - Der Durchmesser ist doppelt so lang wie der Radius.
    explanation: "2 · 3,14 · {{r}} = {{2 * 3.14 * r}} cm."
    variants:
      params: { r: "int[2,15]" }
      defaults: { r: 5 }

  - kind: explain
    id: s6
    body: Wie viele Stellen von π braucht man, um Raumsonden zu steuern?
    reveal:
      body: Nur etwa 15. Selbst bei einem Kreis so groß wie unser Sonnensystem liegt der Fehler dann bei wenigen Zentimetern.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: π ist bei jedem Kreis gleich.
          right: true
        - text: π ist genau 3,14.
          right: false
          why: π hat unendlich viele Stellen ohne Muster.
        - text: Der Umfang ist 2 · π · r.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Kreis hat den Umfang 31,4 cm. Wie groß ist sein Radius? π ≈ 3,14.
    params:
      unit: cm
    answer:
      value: 5
    hints:
      - U = 2 · π · r nach r umstellen.
    explanation: "31,4 : 6,28 = 5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Archimedes näherte π mit Vielecken an. Wie?
    params:
      options:
        - label: Er klemmte den Kreis zwischen ein inneres und ein äußeres Vieleck
          correct: true
        - label: Er maß viele Kreise aus
          feedback: Messen ist nie genau genug – er rechnete.
        - label: Er zählte Kästchen im Kreis
          feedback: Das nähert die Fläche an, er arbeitete mit dem Umfang.
    hints:
      - Der Umfang des Kreises liegt zwischen zwei Größen, die man berechnen kann.
    explanation: Mit 96 Ecken fand er 3,1408 < π < 3,1429. Dieses **Einschachteln** ist der Kern des Grenzwerts.
    difficulty: 3

srs:
  cards_from: [umfang-d, umfang-r]
