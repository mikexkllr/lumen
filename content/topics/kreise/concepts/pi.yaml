id: geo.circles.pi
type: concept
title: Die Zahl π
summary: Jeder Kreis hat dasselbe Verhältnis.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Zahl in jedem Kreis
    body: "Ob Münze oder Riesenrad: Bei jedem Kreis passt der Durchmesser gleich oft in den Umfang. Jeder Punkt ist ein Kreis – rechts sein Umfang, oben sein Durchmesser. Schieb k, bis die Gerade alle trifft. Diese Zahl heißt **π**."
    visual:
      widget: slider
      interactive: true
      params:
        expr: x/k
        x:
          - 0
          - 10
        y:
          - 0
          - 4
        showCoordinates: false
        sliders:
          - id: k
            label: k
            min: 1
            max: 5
            step: 0.1
            initial: 2
        markers:
          - x: 3.14
            y: 1
          - x: 6.28
            y: 2
          - x: 9.42
            y: 3

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Seil liegt straff um den Äquator (40 000 km). Du verlängerst es um 1 Meter. Wie viele Zentimeter hebt es überall ab?"
    params:
      min: 0
      max: 50
      unit: cm
    answer:
      value: 16
      tolerance: 4
    explanation: "1 m : (2π) ≈ 16 cm – egal wie groß die Kugel ist. Eine Katze passt darunter durch."

  - kind: problem
    id: rad
    widget: choice
    prompt: Ein Rad mit 1 m Durchmesser rollt genau eine Umdrehung. Wie weit kommt es?
    params:
      layout: grid
      options:
        - { label: Gut 3 m, correct: true }
        - { label: 1 m, feedback: "Der Rand ist viel länger als der Durchmesser. Stell dir das Rad abgerollt vor." }
        - { label: 2 m, feedback: "Schon näher – aber der Umfang ist mehr als doppelt so lang." }
        - { label: 6 m, feedback: "Zu viel. Das wäre bei 2 m Durchmesser ungefähr richtig." }
    hints:
      - Das Rad legt beim Rollen seinen Umfang zurück.
    explanation: Der Umfang ist rund 3,14 m – gut dreimal der Durchmesser.

  - kind: explain
    id: s2
    body: |
      Bei **jedem** Kreis ist der Umfang etwa 3,14-mal so lang wie der **Durchmesser**.
      Diese Zahl heißt **π** (Pi). Sie hat unendlich viele Stellen.

  - kind: problem
    id: umfang-d
    widget: numeric
    prompt: Ein Kreis hat den Durchmesser {{d}} cm. Wie lang ist sein Umfang? Rechne mit π ≈ 3,14.
    params: { unit: cm }
    answer: { value: "{{d * 3.14}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - 2 * 3.14 * d) < 0.2"
        misconception: radius-formula
        text: Du hast mit 2 · π gerechnet. Das braucht man nur beim Radius.
    hints:
      - Umfang = π · Durchmesser.
    explanation: "3,14 · {{d}} = {{d * 3.14}} cm."
    variants:
      params: { d: "int[2,20]" }
      defaults: { d: 10 }

  - kind: explain
    id: s4
    body: |
      **U = π · d = 2 · π · r.**
      Der **Radius** r ist der halbe Durchmesser.

  - kind: problem
    id: umfang-r
    widget: numeric
    prompt: Ein Kreis hat den Radius {{r}} cm. Wie lang ist sein Umfang? Rechne mit π ≈ 3,14.
    params: { unit: cm }
    answer: { value: "{{2 * 3.14 * r}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - 3.14 * r) < 0.2"
        misconception: radius-as-diameter
        text: Du hast den Radius wie den Durchmesser benutzt. Verdopple ihn zuerst.
    hints:
      - Der Durchmesser ist doppelt so lang wie der Radius.
    explanation: "2 · 3,14 · {{r}} = {{2 * 3.14 * r}} cm."
    variants:
      params: { r: "int[2,15]" }
      defaults: { r: 5 }

  - kind: explain
    id: s6
    body: Wie viele Stellen von π braucht man, um Raumsonden zu steuern?
    reveal:
      body: Nur etwa 15. Selbst bei einem Kreis so groß wie unser Sonnensystem liegt der Fehler dann bei wenigen Zentimetern.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: π ist bei jedem Kreis gleich.
          right: true
        - text: π ist genau 3,14.
          right: false
          why: π hat unendlich viele Stellen ohne Muster.
        - text: Der Umfang ist 2 · π · r.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Kreis hat den Umfang 31,4 cm. Wie groß ist sein Radius? π ≈ 3,14.
    params:
      unit: cm
    answer:
      value: 5
    hints:
      - U = 2 · π · r nach r umstellen.
    explanation: "31,4 : 6,28 = 5."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Eine Dose hat 10 cm Durchmesser. Wie lang ist ein Band, das einmal herumreicht?"
    params:
      min: 10
      max: 50
      unit: cm
    answer:
      value: 31.4
      tolerance: 2
    explanation: π · 10 cm ≈ 31,4 cm – gut dreimal der Durchmesser.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Warum hebt das Seil am Äquator 16 cm ab? Aus U = 2πr folgt: 1 m mehr Umfang sind 1 m : 2π ≈ 16 cm mehr **Radius**. Das gilt für jeden Kreis – ob Erde oder Orange."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Du verlängerst ein Seil um einen Kreis um {{L}} m. Um wie viele Zentimeter wächst der Radius? Rechne mit π ≈ 3,14 und runde auf ganze cm.
    params:
      unit: cm
    answer:
      value: "{{round(L * 100 / 6.28)}}"
      tolerance: 1
    feedback:
      - when: numval(state.input) == round(L * 100 / 3.14)
        misconception: diameter-not-radius
        text: Das ist der Zuwachs des Durchmessers. Der Radius ist die Hälfte.
    hints:
      - Mehr Umfang = 2π · mehr Radius.
      - "{{L * 100}} cm : 6,28."
    explanation: "{{L * 100}} : 6,28 ≈ {{round(L * 100 / 6.28)}} cm – egal, wie groß der Kreis ist."
    difficulty: 2
    variants:
      params:
        L: choice[1,2,3,5]
      defaults:
        L: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Archimedes näherte π mit Vielecken an. Wie?
    params:
      options:
        - label: Er klemmte den Kreis zwischen ein inneres und ein äußeres Vieleck
          correct: true
        - label: Er maß viele Kreise aus
          feedback: Messen ist nie genau genug – er rechnete.
        - label: Er zählte Kästchen im Kreis
          feedback: Das nähert die Fläche an, er arbeitete mit dem Umfang.
    hints:
      - Der Umfang des Kreises liegt zwischen zwei Größen, die man berechnen kann.
    explanation: Mit 96 Ecken fand er 3,1408 < π < 3,1429. Dieses **Einschachteln** ist der Kern des Grenzwerts.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "π ist **irrational**: Es ist kein Bruch, und seine Stellen wiederholen sich nie. 22/7 = 3,1428… ist nur eine Näherung. Johann Heinrich Lambert bewies das 1761."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Ein regelmäßiges Sechseck im Kreis mit Radius 1 hat den Umfang 6. Welche Näherung für π ergibt Umfang geteilt durch Durchmesser?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: forgot-diameter
        text: Teile noch durch den Durchmesser 2.
    hints:
      - Der Durchmesser ist 2.
      - "6 : 2 = ?"
    explanation: 3 – etwas zu klein, weil das Sechseck innen liegt. Archimedes ging bis zum 96-Eck und fand 3,1408 < π < 3,1429.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Wie weit liegt 22/7 von π ≈ 3,14159 entfernt? Auf vier Stellen nach dem Komma.
    answer:
      value: 0.0013
      tolerance: 0.0001
    hints:
      - "22 : 7 ≈ 3,14286."
      - 3,14286 − 3,14159.
    explanation: ≈ 0,0013. 22/7 ist auf zwei Stellen genau – 355/113 sogar auf sechs.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, was die Zahl π bedeutet.
    params:
      keywords:
        - - umfang
          - circumference
          - herum
          - around
        - - durchmesser
          - diameter
        - - jeder
          - immer
          - every
          - always
          - gleich
          - same
      sample: Bei jedem Kreis ist der Umfang etwa 3,14-mal so lang wie der Durchmesser. Dieses Verhältnis ist immer gleich, egal wie groß der Kreis ist. Man nennt es π.
    explanation: "Kernidee: π = Umfang : Durchmesser – für alle Kreise dieselbe Zahl."
    difficulty: 3

srs:
  cards_from: [umfang-d, umfang-r]
