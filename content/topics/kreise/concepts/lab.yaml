id: geo.circles.lab
type: concept
title: Kreis-Labor
summary: Winkel, Stücke und π zum Einstellen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Punkt fährt Karussell
    body: "Riesenrad, Uhrzeiger, Fahrradventil: Alles fährt im Kreis. Schieb den Winkel und beobachte den Punkt. Wie weit ist er rechts, wie hoch ist er oben? Diese zwei Zahlen heißen **Kosinus** und Sinus."
    visual:
      widget: sim
      interactive: true
      params:
        scene: unitcircle

  - kind: problem
    id: viertel
    widget: angle
    prompt: Stelle den Winkel für ein Viertel einer Pizza ein.
    params: { initial: 20, max: 180 }
    answer: { value: 90 }
    hints:
      - Ein ganzer Kreis hat 360°.
    explanation: "360° : 4 = 90° – ein rechter Winkel."

  - kind: problem
    id: sechstel
    widget: angle
    prompt: Die Pizza wird in 6 gleiche Stücke geteilt. Stelle den Winkel eines Stücks ein.
    params: { initial: 20, max: 180 }
    answer: { value: 60 }
    hints:
      - 360° durch 6.
    explanation: "360° : 6 = 60°."

  - kind: problem
    id: faerben
    widget: fraction
    prompt: Färbe 3/8 der Pizza.
    params: { parts: 8, shape: circle }
    answer: { fraction: "3/8" }
    hints:
      - Drei von acht Stücken.
    explanation: Drei Stücke à 45° – zusammen 135°.

  - kind: problem
    id: pi
    widget: numberline
    prompt: Markiere ungefähr, wo π liegt.
    params: { min: 3, max: 4, ticks: 10, labels: decimals }
    answer: { value: 3.1 }
    hints:
      - π = 3,14159…
    explanation: π liegt knapp über 3,1 – der Umfang ist gut dreimal so lang wie der Durchmesser.

  - kind: problem
    id: ma-d1
    depth: 2
    widget: sim
    prompt: "Am Einheitskreis: Stelle einen Winkel ein, bei dem cos = 0,5 ist."
    params:
      scene: unitcircle
    answer:
      cos: 0.5
    hints:
      - cos ist die x-Koordinate des Punktes.
      - Probiere 60°.
    explanation: "60° oder 300°: Der Punkt liegt dann halb so weit rechts wie der Radius."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Ein Kreis auf Karopapier hat den Radius 10 Kästchen. Wie viele Kästchen bedeckt er?"
    params:
      min: 0
      max: 600
    answer:
      value: 314
      tolerance: 25
    explanation: π · 10² ≈ 314 Kästchen. Das umgebende Quadrat hätte 400.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: angle
    prompt: Ein Radiant ist der Winkel, bei dem der Bogen so lang ist wie der Radius. Stelle ihn ungefähr ein.
    params:
      initial: 10
      snap: 1
      max: 180
    answer:
      value: 57
      tolerance: 3
    hints:
      - Ein halber Kreis ist π ≈ 3,14 Radiant.
      - "180° : 3,14 ≈ ?"
    explanation: 1 Radiant ≈ 57,3°. Etwas weniger als 60°.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Quadrat hat die Seite 2. Der Kreis darin hat den Radius 1. Welchen Anteil des Quadrats füllt der Kreis? In Prozent, gerundet.
    params:
      unit: "%"
    answer:
      value: 79
      tolerance: 1
    hints:
      - Kreisfläche π geteilt durch Quadratfläche 4.
    explanation: π/4 ≈ 78,5 %. Wirft man Zufallspunkte ins Quadrat, lässt sich π so schätzen – die **Monte-Carlo-Methode**.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Wie viel Grad sind 1 Radiant? Auf ganze Grad.
    answer:
      value: 57
      tolerance: 0.5
    hints:
      - 180° entsprechen π.
      - "180 : 3,14159 ≈ ?"
    explanation: "180 : π ≈ 57,3°. Darum ist 1 rad eine »krumme« Zahl in Grad – aber eine natürliche für die Mathematik."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Die **Euler-Identität** $e^{i\\pi} + 1 = 0$ verbindet fünf berühmte Zahlen: 0, 1, e, i und π. Dabei ist π ein halber Kreis im Bogenmaß."

srs:
  cards_from: [sechstel, pi]
