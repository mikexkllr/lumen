id: geo.circles.lab
type: concept
title: Circle lab
summary: Angles, slices and π to adjust.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A point on a carousel
    body: "Ferris wheel, clock hand, bike valve: they all go round in circles. Slide the angle and watch the point. How far right is it, how high up? These two numbers are called **cosine** and sine."
    visual:
      widget: sim
      interactive: true
      params:
        scene: unitcircle

  - kind: problem
    id: viertel
    widget: angle
    prompt: Set the angle for a quarter of a pizza.
    params: { initial: 20, max: 180 }
    answer: { value: 90 }
    hints:
      - A full circle has 360°.
    explanation: "360° : 4 = 90° – a right angle."

  - kind: problem
    id: sechstel
    widget: angle
    prompt: The pizza is cut into 6 equal slices. Set the angle of one slice.
    params: { initial: 20, max: 180 }
    answer: { value: 60 }
    hints:
      - 360° divided by 6.
    explanation: "360° : 6 = 60°."

  - kind: problem
    id: faerben
    widget: fraction
    prompt: Color 3/8 of the pizza.
    params: { parts: 8, shape: circle }
    answer: { fraction: "3/8" }
    hints:
      - Three of eight slices.
    explanation: Three slices of 45° each – 135° in total.

  - kind: problem
    id: pi
    widget: numberline
    prompt: Mark roughly where π lies.
    params: { min: 3, max: 4, ticks: 10, labels: decimals }
    answer: { value: 3.1 }
    hints:
      - π = 3.14159…
    explanation: π is just above 3.1 – the circumference is a good three times the diameter.

  - kind: problem
    id: ma-d1
    depth: 2
    widget: sim
    prompt: "On the unit circle: set an angle where cos = 0.5."
    params:
      scene: unitcircle
    answer:
      cos: 0.5
    hints:
      - cos is the x-coordinate of the point.
      - Try 60°.
    explanation: "60° or 300°: the point is then half a radius to the right."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: a circle on squared paper has a radius of 10 squares. How many squares does it cover?"
    params:
      min: 0
      max: 600
    answer:
      value: 314
      tolerance: 25
    explanation: π · 10² ≈ 314 squares. The surrounding square would have 400.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: angle
    prompt: One radian is the angle whose arc is as long as the radius. Set it roughly.
    params:
      initial: 10
      snap: 1
      max: 180
    answer:
      value: 57
      tolerance: 3
    hints:
      - Half a circle is π ≈ 3.14 radians.
      - "180° : 3.14 ≈ ?"
    explanation: 1 radian ≈ 57.3°. A bit less than 60°.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A square has side 2. The circle inside has radius 1. What share of the square does the circle fill? In percent, rounded.
    params:
      unit: "%"
    answer:
      value: 79
      tolerance: 1
    hints:
      - Circle area π divided by square area 4.
    explanation: π/4 ≈ 78.5%. Throwing random points into the square estimates π this way – the **Monte Carlo method**.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: How many degrees is 1 radian? To whole degrees.
    answer:
      value: 57
      tolerance: 0.5
    hints:
      - 180° corresponds to π.
      - "180 : 3.14159 ≈ ?"
    explanation: "180 : π ≈ 57.3°. That is why 1 rad is an »awkward« number in degrees – but a natural one for mathematics."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "**Euler’s identity** $e^{i\\pi} + 1 = 0$ links five famous numbers: 0, 1, e, i and π. Here π is half a circle in radians."

srs:
  cards_from: [sechstel, pi]
