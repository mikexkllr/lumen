id: geo.circles.lab
type: concept
title: Circle lab
summary: Angles, slices and π to adjust.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: viertel
    widget: angle
    prompt: Set the angle for a quarter of a pizza.
    params: { initial: 20, max: 180 }
    answer: { value: 90 }
    hints:
      - A full circle has 360°.
    explanation: "360° : 4 = 90° – a right angle."

  - kind: problem
    id: sechstel
    widget: angle
    prompt: The pizza is cut into 6 equal slices. Set the angle of one slice.
    params: { initial: 20, max: 180 }
    answer: { value: 60 }
    hints:
      - 360° divided by 6.
    explanation: "360° : 6 = 60°."

  - kind: problem
    id: faerben
    widget: fraction
    prompt: Color 3/8 of the pizza.
    params: { parts: 8, shape: circle }
    answer: { fraction: "3/8" }
    hints:
      - Three of eight slices.
    explanation: Three slices of 45° each – 135° in total.

  - kind: problem
    id: pi
    widget: numberline
    prompt: Mark roughly where π lies.
    params: { min: 3, max: 4, ticks: 10, labels: decimals }
    answer: { value: 3.1 }
    hints:
      - π = 3.14159…
    explanation: π is just above 3.1 – the circumference is a good three times the diameter.

srs:
  cards_from: [sechstel, pi]
