id: geo.circles.wheels
type: concept
title: Räder und Umdrehungen
summary: Wie oft dreht sich ein Rad?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: umfang
    widget: numeric
    prompt: Ein Fahrradrad hat 70 cm Durchmesser. Wie weit rollt es bei einer Umdrehung? Rechne mit π ≈ 3,14.
    params: { unit: cm }
    answer: { value: 219.8, tolerance: 1 }
    hints:
      - Umfang = π · d.
    explanation: 3,14 · 70 ≈ 220 cm – gut 2 Meter.

  - kind: problem
    id: umdrehungen
    widget: numeric
    prompt: Ein Rad legt pro Umdrehung {{u}} m zurück. Wie viele Umdrehungen braucht es für {{k}} km?
    params: { unit: Umdrehungen }
    answer: { value: "{{k * 1000 / u}}" }
    hints:
      - "{{k}} km sind {{k * 1000}} m."
    explanation: "{{k * 1000}} m : {{u}} m = {{k * 1000 / u}} Umdrehungen."
    variants:
      params: { u: "choice[2,2.5,4]", k: "int[1,5]" }
      defaults: { u: 2, k: 3 }

  - kind: explain
    id: s3
    body: Zwei Zahnräder greifen ineinander. Das große hat 40 Zähne, das kleine 10. Wie oft dreht sich das kleine, wenn das große einmal dreht?
    reveal:
      body: Viermal. Pro Umdrehung des großen wandern 40 Zähne vorbei – das kleine braucht dafür vier Runden. So funktionieren Fahrradgänge.

  - kind: problem
    id: gang
    widget: numeric
    prompt: Vorn hat das Fahrrad {{v}} Zähne, hinten {{h}}. Wie oft dreht sich das Hinterrad pro Pedal-Umdrehung?
    params: { unit: "-mal" }
    answer: { value: "{{v / h}}" }
    feedback:
      - when: "approx(numval(state.input), h / v)"
        misconception: inverted
        text: Andersherum – vorn geteilt durch hinten.
    hints:
      - "Vorn wandern {{v}} Zähne vorbei."
    explanation: "{{v}} : {{h}} = {{v / h}} Umdrehungen."
    variants:
      params: { v: "choice[36,48]", h: "choice[12,16,24]" }
      defaults: { v: 48, h: 16 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Rad mit 2 m Umfang dreht sich 5-mal pro Sekunde. Wie schnell fährt das Fahrrad in km/h?
    params:
      unit: km/h
    answer:
      value: 36
    hints:
      - 10 m pro Sekunde. Mal 3,6 ergibt km/h.
    explanation: 10 m/s · 3,6 = 36 km/h.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: Ein Rad hat 50 cm Durchmesser. Wie oft dreht es sich auf 1 km? Rechne mit π ≈ 3,14 und runde auf ganze Umdrehungen.
    answer:
      value: 637
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 2000) < 2
        misconception: diameter-not-circumference
        text: Du hast mit dem Durchmesser statt dem Umfang geteilt.
    hints:
      - "Umfang: 3,14 · 50 cm = 157 cm."
      - "100 000 cm : 157 cm."
    explanation: "100 000 : 157 ≈ 637 Umdrehungen."
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Bei Zahnrädern bleibt Zähne mal Umdrehungen gleich. Das ist die **Übersetzung**: Ein Rad mit 40 Zähnen treibt ein Rad mit 10 Zähnen viermal so schnell an."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Ein großes Zahnrad mit {{k * m}} Zähnen dreht sich {{n}}-mal. Es treibt ein kleines mit {{k}} Zähnen an. Wie oft dreht sich das kleine?
    answer:
      value: "{{m * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: same-turns
        text: Das kleine Rad muss schneller drehen, damit gleich viele Zähne vorbeikommen.
    hints:
      - Wie viele Zähne laufen vorbei? {{k * m}} · {{n}}.
      - Geteilt durch {{k}}.
    explanation: "{{k * m * n}} Zähne : {{k}} = {{m * n}} Umdrehungen."
    difficulty: 2
    variants:
      params:
        k: choice[10,12,15]
        m: int[2,4]
        n: int[2,6]
      defaults:
        k: 10
        m: 3
        n: 4

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Münze rollt einmal um eine gleich große, feste Münze herum. Wie oft dreht sie sich dabei um sich selbst?
    params:
      options:
        - label: Zweimal
          correct: true
        - label: Einmal
          feedback: So oft würde sie sich auf einer **geraden** Strecke gleicher Länge drehen.
        - label: Halb
          feedback: Ihr Mittelpunkt läuft auf einem Kreis mit doppeltem Radius.
    hints:
      - Welchen Weg legt der **Mittelpunkt** der rollenden Münze zurück?
    explanation: Der Mittelpunkt läuft auf einem Kreis mit Radius 2r – doppelter Weg, doppelte Drehung.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Ein Rad mit 2,1 m Umfang dreht sich 10-mal pro Sekunde. Wie schnell fährt das Fahrzeug in km/h?
    params:
      unit: km/h
    answer:
      value: 75.6
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 21) < 0.1
        misconception: units
        text: Das sind Meter pro Sekunde. Mal 3,6 ergibt km/h.
    hints:
      - 2,1 m · 10 = 21 m pro Sekunde.
      - 1 m/s = 3,6 km/h.
    explanation: 21 m/s · 3,6 = 75,6 km/h. So rechnet ein Tacho.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Ein rollendes Rad hat eine Überraschung: Der Punkt unten steht kurz still, der Punkt oben ist doppelt so schnell wie das Fahrrad. Ein Punkt am Rand zeichnet eine **Zykloide**."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Ein Fahrrad fährt 20 km/h. Wie schnell bewegt sich der oberste Punkt des Rades gegenüber der Straße?
    params:
      unit: km/h
    answer:
      value: 40
    feedback:
      - when: numval(state.input) == 20
        misconception: same-speed
        text: Oben addieren sich Fahrt und Drehung.
    hints:
      - Die Drehung allein bewegt den Rand mit 20 km/h.
      - Oben zeigt die Drehung nach vorn – plus die Fahrt.
    explanation: 20 + 20 = 40 km/h oben, 20 − 20 = 0 km/h unten.
    difficulty: 3

srs:
  cards_from: [umdrehungen, gang]
