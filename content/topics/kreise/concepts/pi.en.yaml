id: geo.circles.pi
type: concept
title: The number π
summary: Every circle has the same ratio.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a rope lies tight around the equator (40,000 km). You lengthen it by 1 metre. How many centimetres does it lift off everywhere?"
    params:
      min: 0
      max: 50
      unit: cm
    answer:
      value: 16
      tolerance: 4
    explanation: 1 m ÷ (2π) ≈ 16 cm – whatever the size of the sphere. A cat fits underneath.

  - kind: problem
    id: rad
    widget: choice
    prompt: A wheel with a 1 m diameter rolls exactly one turn. How far does it go?
    params:
      layout: grid
      options:
        - { label: A bit over 3 m, correct: true }
        - { label: 1 m, feedback: "The rim is much longer than the diameter. Picture the wheel unrolled." }
        - { label: 2 m, feedback: "Closer – but the circumference is more than twice as long." }
        - { label: 6 m, feedback: "Too much. That would be about right for a 2 m diameter." }
    hints:
      - When rolling, the wheel covers its circumference.
    explanation: The circumference is about 3.14 m – a bit over three times the diameter.

  - kind: explain
    id: s2
    body: |
      In **every** circle, the circumference is about 3.14 times as long as the **diameter**.
      This number is called **π** (pi). It has infinitely many digits.

  - kind: problem
    id: umfang-d
    widget: numeric
    prompt: A circle has a diameter of {{d}} cm. How long is its circumference? Use π ≈ 3.14.
    params: { unit: cm }
    answer: { value: "{{d * 3.14}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - 2 * 3.14 * d) < 0.2"
        misconception: radius-formula
        text: You used 2 · π. You only need that with the radius.
    hints:
      - Circumference = π · diameter.
    explanation: "3.14 · {{d}} = {{d * 3.14}} cm."
    variants:
      params: { d: "int[2,20]" }
      defaults: { d: 10 }

  - kind: explain
    id: s4
    body: |
      **C = π · d = 2 · π · r.**
      The **radius** r is half the diameter.

  - kind: problem
    id: umfang-r
    widget: numeric
    prompt: A circle has a radius of {{r}} cm. How long is its circumference? Use π ≈ 3.14.
    params: { unit: cm }
    answer: { value: "{{2 * 3.14 * r}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - 3.14 * r) < 0.2"
        misconception: radius-as-diameter
        text: You used the radius like the diameter. Double it first.
    hints:
      - The diameter is twice as long as the radius.
    explanation: "2 · 3.14 · {{r}} = {{2 * 3.14 * r}} cm."
    variants:
      params: { r: "int[2,15]" }
      defaults: { r: 5 }

  - kind: explain
    id: s6
    body: How many digits of π do you need to steer space probes?
    reveal:
      body: Only about 15. Even for a circle as large as our solar system, the error is then just a few centimeters.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: π is the same for every circle.
          right: true
        - text: π is exactly 3.14.
          right: false
          why: π has infinitely many digits with no pattern.
        - text: The circumference is 2 · π · r.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A circle has a circumference of 31.4 cm. What is its radius? π ≈ 3.14.
    params:
      unit: cm
    answer:
      value: 5
    hints:
      - Rearrange C = 2 · π · r for r.
    explanation: 31.4 ÷ 6.28 = 5.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: a can is 10 cm across. How long is a ribbon that goes once around it?"
    params:
      min: 10
      max: 50
      unit: cm
    answer:
      value: 31.4
      tolerance: 2
    explanation: π · 10 cm ≈ 31.4 cm – a bit more than three times the diameter.
    difficulty: 2

  - kind: explain
    id: ma-d2
    depth: 2
    body: "Why does the rope at the equator lift by 16 cm? From C = 2πr: 1 m more circumference means 1 m : 2π ≈ 16 cm more **radius**. That holds for every circle – Earth or orange."

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: You lengthen a rope around a circle by {{L}} m. By how many centimetres does the radius grow? Use π ≈ 3.14 and round to whole cm.
    params:
      unit: cm
    answer:
      value: "{{round(L * 100 / 6.28)}}"
      tolerance: 1
    feedback:
      - when: numval(state.input) == round(L * 100 / 3.14)
        misconception: diameter-not-radius
        text: That is the growth of the diameter. The radius is half of it.
    hints:
      - More circumference = 2π · more radius.
      - "{{L * 100}} cm : 6.28."
    explanation: "{{L * 100}} : 6.28 ≈ {{round(L * 100 / 6.28)}} cm – however big the circle is."
    difficulty: 2
    variants:
      params:
        L: choice[1,2,3,5]
      defaults:
        L: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Archimedes approximated π with polygons. How?
    params:
      options:
        - label: He squeezed the circle between an inner and an outer polygon
          correct: true
        - label: He measured many circles
          feedback: Measuring is never exact enough – he calculated.
        - label: He counted squares inside the circle
          feedback: That approximates the area; he worked with the circumference.
    hints:
      - The circumference lies between two quantities you can compute.
    explanation: With 96 corners he found 3.1408 < π < 3.1429. This **squeezing** is the heart of the limit.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "π is **irrational**: it is not a fraction, and its digits never repeat. 22/7 = 3.1428… is only an approximation. Johann Heinrich Lambert proved this in 1761."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: A regular hexagon fits inside a circle of radius 1. Its six sides add up to 6. Divide that by the width of the circle. What guess for π do you get?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: forgot-diameter
        text: Still divide by the diameter 2.
    hints:
      - The diameter is 2.
      - "6 : 2 = ?"
    explanation: 3 – a bit too small, because the hexagon lies inside. Archimedes went up to a 96-gon and found 3.1408 < π < 3.1429.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: How far is 22/7 from π ≈ 3.14159? To four decimal places.
    answer:
      value: 0.0013
      tolerance: 0.0001
    hints:
      - "22 : 7 ≈ 3.14286."
      - 3.14286 − 3.14159.
    explanation: ≈ 0.0013. 22/7 is correct to two decimals – 355/113 even to six.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what the number π means.
    params:
      keywords:
        - - umfang
          - circumference
          - herum
          - around
        - - durchmesser
          - diameter
        - - jeder
          - immer
          - every
          - always
          - gleich
          - same
      sample: For every circle the circumference is about 3.14 times the diameter. This ratio is always the same, however big the circle. It is called π.
    explanation: "Key idea: π = circumference : diameter – the same number for all circles."
    difficulty: 3

srs:
  cards_from: [umfang-d, umfang-r]
