id: math.integrals.average
type: concept
title: Der Mittelwert einer Kurve
summary: Fläche geteilt durch Breite.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Berge einebnen
    body: "Ein Navi macht aus vielen wechselnden Tempi einen einzigen Schnitt. Zieh die Säulen hoch und runter. Die Linie zeigt den **Mittelwert**: Sie ebnet alle Berge und Täler auf eine Höhe ein."
    visual:
      widget: chart
      interactive: true
      params:
        title: Tempo pro Stunde
        labels:
          - 1. h
          - 2. h
          - 3. h
          - 4. h
        values:
          - 40
          - 100
          - 60
          - 80
        editable:
          - 0
          - 1
          - 2
          - 3
        min: 0
        max: 120
        step: 10
        unit: km/h
        show:
          - mean

  - kind: problem
    id: hook
    widget: numeric
    prompt: Du fährst eine Stunde mit 60 km/h und eine Stunde mit 100 km/h. Wie schnell warst du im Schnitt?
    params:
      unit: km/h
    answer:
      value: 80
    hints:
      - Gesamte Strecke geteilt durch gesamte Zeit.
    explanation: 160 km in 2 Stunden. Bei einer Kurve geht es genauso – nur mit Flächen.

  - kind: explain
    id: s1
    body: |
      Der **Mittelwert** einer Funktion auf einem Intervall ist die Höhe eines Rechtecks mit derselben Fläche: Fläche unter der Kurve geteilt durch die Breite des Intervalls.

  - kind: problem
    id: gerade
    widget: numeric
    prompt: Die Fläche unter f(x) = 2x von 0 bis 4 ist 16. Wie groß ist der Mittelwert von f auf diesem Intervall?
    params: { placeholder: "Mittelwert" }
    answer: { value: 4 }
    hints:
      - Fläche geteilt durch Breite 4.
    explanation: "16 : 4 = 4 – genau der Funktionswert in der Mitte."

  - kind: problem
    id: tempo
    widget: numeric
    prompt: Ein Auto legt in {{t}} Stunden {{s}} km zurück – mal schneller, mal langsamer. Wie hoch war das Durchschnittstempo?
    params: { unit: km/h }
    answer: { value: "{{s / t}}" }
    hints:
      - Strecke ist die Fläche unter der Tempo-Kurve.
    explanation: "{{s}} : {{t}} = {{s / t}} km/h."
    variants:
      params: { t: "int[2,5]", v: "choice[60,75,90]" }
      derive: { s: "v * t" }
      defaults: { t: 3, v: 75 }

  - kind: problem
    id: negativ
    widget: choice
    prompt: Die Tempo-Kurve eines Autos liegt unter der Achse. Was heißt das?
    params:
      options:
        - { label: Das Auto fährt rückwärts., correct: true }
        - { label: Ein Rechenfehler, feedback: "Unter der Achse zählt die Fläche negativ – das bedeutet etwas." }
    hints:
      - Was heißt ein Tempo unter null?
    explanation: Fläche unter der Achse zählt negativ. Rückwärts fahren zieht Strecke ab.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Ein Auto fährt 4 Stunden. In den ersten drei fährt es 60, 80 und 50 km/h. Zieh die letzte Säule so, dass der Schnitt genau 70 km/h ist.
    params:
      title: Tempo pro Stunde
      labels:
        - 1. h
        - 2. h
        - 3. h
        - 4. h
      values:
        - 60
        - 80
        - 50
        - 0
      editable:
        - 3
      min: 0
      max: 120
      step: 10
      unit: km/h
      show:
        - mean
    answer:
      values:
        - 60
        - 80
        - 50
        - 90
    hints:
      - Für einen Schnitt von 70 km/h braucht das Auto in 4 Stunden 280 km.
      - Rechne 280 − 60 − 80 − 50.
    explanation: 60 + 80 + 50 + 90 = 280 km in 4 Stunden – im Schnitt 70 km/h. Die Fläche der Säulen ist die Strecke, geteilt durch die Zeit gibt sie den Mittelwert.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie groß ist der Mittelwert von $f(x) = x^2$ auf dem Intervall von 0 bis 3?
    answer:
      value: 3
    hints:
      - Fläche ist 27/3 = 9. Teile durch die Breite.
    explanation: "9 : 3 = 3. Nicht 4,5 – die Kurve ist die meiste Zeit niedrig."
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Nähere die Fläche unter y = x² von 0 bis 3 an. Der Fehler soll kleiner als 0,5 sein.
    params:
      scene: riemann
      expr: x^2
      interval:
        - 0
        - 3
    answer:
      error:
        - 0
        - 0.5
    explanation: Die Fläche ist 9. Geteilt durch die Breite 3 ergibt das den Mittelwert 3.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Der **Mittelwertsatz**: Ist f stetig, nimmt f irgendwo genau ihren Mittelwert an. Wer im Schnitt 80 km/h fuhr, hatte irgendwann exakt 80 auf dem Tacho."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie groß ist der Mittelwert von sin x auf dem Intervall von 0 bis π? Die Fläche ist 2. Auf drei Stellen.
    answer:
      value: 0.637
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.5
        misconception: sin-squared
        text: 0,5 wäre der Mittelwert von sin², nicht von sin.
      - when: numval(state.input) == 2
        misconception: no-division
        text: Das ist die Fläche. Teile durch die Breite π.
    hints:
      - "Mittelwert = Fläche : Breite."
      - "2 : π."
    explanation: "2 : π ≈ 0,637. Die mittlere Höhe eines Sinusbogens liegt bei knapp zwei Dritteln seines Gipfels."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du fährst eine Strecke hin mit 60 km/h und zurück mit 40 km/h. Wie hoch ist das Durchschnittstempo?
    params:
      options:
        - label: 48 km/h
          correct: true
        - label: 50 km/h
          feedback: Du fährst **länger** mit 40 als mit 60 – das zieht den Schnitt herunter.
        - label: 52 km/h
          feedback: Die langsame Strecke dauert länger, nicht die schnelle.
    hints:
      - "Nimm 120 km je Richtung: 2 h hin, 3 h zurück."
    explanation: 240 km in 5 h sind 48 km/h. Gemittelt wird über die **Zeit**, nicht über die Strecke.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Die Steckdose liefert Wechselspannung. Ihr Mittelwert ist null, doch sie heizt trotzdem. Entscheidend ist der Mittelwert von u², denn Leistung ∝ u². Wegen $\overline{\sin^2} = \frac12$ ist der **Effektivwert** $\frac{\hat u}{\sqrt2}$.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Die Netzspannung hat 230 V Effektivwert. Wie hoch ist ihr Scheitelwert in Volt? Auf ganze Volt.
    params:
      unit: V
    answer:
      value: 325
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 163) < 1
        misconception: divided
        text: "Andersherum: Der Scheitel ist größer als der Effektivwert – mal √2."
    hints:
      - "Effektivwert = Scheitel : √2."
      - 230 · 1,414.
    explanation: 230 · √2 ≈ 325 V. Darum müssen Bauteile am Netz mehr als 230 V aushalten.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was der Mittelwert einer Funktion auf einem Intervall ist.
    params:
      keywords:
        - - fläche
          - integral
          - area
        - - breite
          - intervall
          - width
          - interval
          - teilen
          - divide
        - - rechteck
          - gleiche fläche
          - rectangle
          - same area
      sample: Ich nehme die Fläche unter der Kurve und teile sie durch die Breite des Intervalls. Das ergibt die Höhe eines Rechtecks mit gleicher Fläche. Diese Höhe ist der Mittelwert.
    explanation: "Mittelwert = Integral : Breite – das Gegenstück zu »Summe durch Anzahl« bei Zahlen."
    difficulty: 3

srs:
  cards_from: [gerade, negativ]
