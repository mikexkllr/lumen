id: math.integrals.antiderivative
type: concept
title: Differentiating in reverse
summary: The antiderivative.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: The derivative of x² is 2x. So which function leads to 2x?
    params:
      options:
        - label: x²
          correct: true
        - label: x
          feedback: The derivative of x is 1.
        - label: "2"
          feedback: The derivative of 2 is 0.
    hints:
      - Read the first sentence backwards.
    explanation: Differentiating backwards – that is the topic now.

  - kind: explain
    id: s1
    body: |
      An **antiderivative** of f is a function F whose derivative is f. For powers, run the rule backward. $x^n$ becomes $\frac{x^{n+1}}{n+1}$.

  - kind: problem
    id: paare
    widget: match
    prompt: Match each function with an antiderivative.
    params:
      pairs:
        - { left: "2x", right: "x²" }
        - { left: "3x²", right: "x³" }
        - { left: "5", right: "5x" }
        - { left: "x", right: "x²/2" }
    hints:
      - Differentiate the right side. Do you get the left side?
    explanation: Differentiating and finding an antiderivative undo each other.

  - kind: problem
    id: bilden
    widget: expression
    prompt: "Find an antiderivative of $f(x) = 4x^3$."
    params: { variables: [x], prefix: "F(x) =" }
    answer: { equivalentTo: "x^4" }
    hints:
      - Which power has the derivative $4x^3$?
    explanation: $(x^4)' = 4x^3$.

  - kind: problem
    id: konstante
    widget: choice
    prompt: Are x² and x² + 7 both antiderivatives of 2x?
    params:
      options:
        - { label: "Yes, because the constant disappears when you differentiate.", correct: true }
        - { label: "No, only x²", feedback: "Differentiate x² + 7. The 7 vanishes." }
    hints:
      - What is the derivative of a constant?
    explanation: That is why you often write F(x) + C.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: An antiderivative of $2x$ is $x^2$.
          right: true
        - text: An antiderivative of $x^2$ is $2x$.
          right: false
          why: That is the derivative. The antiderivative is x³/3.
        - text: An antiderivative of 5 is $5x$.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: Find an antiderivative of $f(x) = 6x^2 + 4x$.
    params:
      variables:
        - x
    answer:
      equivalentTo: 2*x^3 + 2*x^2
    hints:
      - Raise each exponent by 1 and divide by the new exponent.
    explanation: "6x³/3 + 4x²/2 = 2x³ + 2x². Check: differentiate."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Every function has infinitely many antiderivatives: F(x) + C. Whether one is right is shown by **checking by differentiating**. The constant C is fixed by one known value, such as the starting point."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: We have F′(x) = 2x and F(0) = {{c}}. What is F({{a}})?
    answer:
      value: "{{a * a + c}}"
    feedback:
      - when: numval(state.input) == a * a
        misconception: forgot-constant
        text: Add the starting value F(0) = {{c}}.
      - when: numval(state.input) == 2 * a
        misconception: derivative
        text: That is F′({{a}}), not F({{a}}).
    hints:
      - F(x) = x² + C.
      - F(0) = C = {{c}}.
    explanation: F(x) = x² + {{c}}, so F({{a}}) = {{a * a + c}}.
    difficulty: 2
    variants:
      params:
        a: int[2,9]
        c: int[1,9]
      defaults:
        a: 2
        c: 3

  - kind: problem
    id: mb-d3
    depth: 2
    widget: match
    prompt: Match each function with an antiderivative.
    params:
      pairs:
        - left: cos x
          right: sin x
        - left: sin x
          right: −cos x
        - left: eˣ
          right: eˣ
        - left: 1/x (x > 0)
          right: ln x
      leftTitle: Function
      rightTitle: Antiderivative
    hints:
      - Differentiate the right side and compare.
      - (−cos x)′ = sin x.
    explanation: Every derivative rule read backwards is an integration rule. The minus in −cos is the most common trap.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The power rule fails for $f(x) = \frac{1}{x}$. Why – and what is the antiderivative?
    params:
      options:
        - label: You would divide by 0 – the antiderivative is ln x
          correct: true
        - label: "It does not fail: $x^0$"
          feedback: x⁰ = 1 has derivative 0, not 1/x.
        - label: There is no antiderivative
          feedback: There is – the area under 1/x exists.
    hints:
      - $x^{-1}$ would become $x^0 / 0$.
    explanation: The natural logarithm sits exactly in this gap – an entirely new function.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "**Substitution** is the chain rule backwards. $2x\\,(x^2 + 1)^3$ contains the inner function $u = x^2 + 1$ with $u' = 2x$. So $\\frac{(x^2 + 1)^4}{4}$ is an antiderivative."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Compute $\int_0^1 2x\,(x^2 + 1)^3\,dx$.
    answer:
      value: 3.75
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 4
        misconception: lower-limit
        text: The lower limit gives (0 + 1)⁴ / 4 = 0.25. Subtract it.
    hints:
      - F(x) = (x² + 1)⁴ / 4.
      - F(1) − F(0) = 16/4 − 1/4.
    explanation: 4 − 0.25 = 3.75.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Does $e^{x^2}$ have an antiderivative you can write down with the usual functions?
    params:
      options:
        - label: No – that has been proved. You need a new function.
          correct: true
        - label: "Differentiate it: the quotient rule gives something else."
          feedback: "Leite ab: Die Quotientenregel liefert etwas anderes."
        - label: The derivative of $e^{x^2}$ is $2x\,e^{x^2}$.
          feedback: Die Ableitung von $e^{x^2}$ ist $2x\,e^{x^2}$.
    hints:
      - Check each candidate by differentiating.
      - A factor 2x for substitution is missing.
    explanation: "Liouville proved in the 19th century: some simple functions have no elementary antiderivative. For the bell curve $e^{-x^2}$ the error function erf was introduced for this reason."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Tell Lux why one function has many antiderivatives, not just one. What can you add?
    params:
      keywords:
        - - konstante
          - constant
          - plus c
          - + c
        - - ableiten
          - ableitung
          - "null"
          - derivative
          - zero
          - differentiat
        - - verschieb
          - nach oben
          - shift
          - up
      sample: A constant has derivative zero. So I can add any constant to an antiderivative and the derivative stays the same. In the picture it is the same curve, only shifted up.
    explanation: Differentiating forgets the height; only the slope remains. That is why you need a starting value to fix C.
    difficulty: 3

srs:
  cards_from: [paare, konstante]
