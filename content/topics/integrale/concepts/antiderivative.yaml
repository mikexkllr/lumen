id: math.integrals.antiderivative
type: concept
title: Rückwärts ableiten
summary: Die Stammfunktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Beim Ableiten wird aus x² die Funktion 2x. Welche Funktion wird beim Ableiten zu 2x?
    params:
      options:
        - label: x²
          correct: true
        - label: x
          feedback: Die Ableitung von x ist 1.
        - label: "2"
          feedback: Die Ableitung von 2 ist 0.
    hints:
      - Lies den ersten Satz rückwärts.
    explanation: Ableiten rückwärts – darum geht es jetzt.

  - kind: explain
    id: s1
    body: |
      Eine **Stammfunktion** F ist eine Funktion, deren Ableitung f ergibt. Für Potenzen dreht man die Ableitungsregel um: Aus $x^n$ wird $\frac{x^{n+1}}{n+1}$.

  - kind: problem
    id: paare
    widget: match
    prompt: Verbinde die Funktion mit einer Stammfunktion.
    params:
      pairs:
        - { left: "2x", right: "x²" }
        - { left: "3x²", right: "x³" }
        - { left: "5", right: "5x" }
        - { left: "x", right: "x²/2" }
    hints:
      - Leite die rechte Seite ab – kommt die linke heraus?
    explanation: Ableiten und Stammfunktion bilden sind Gegenspieler.

  - kind: problem
    id: bilden
    widget: expression
    prompt: "Finde eine Stammfunktion von $f(x) = 4x^3$."
    params: { variables: [x], prefix: "F(x) =" }
    answer: { equivalentTo: "x^4" }
    hints:
      - Welche Potenz ergibt abgeleitet $4x^3$?
    explanation: $(x^4)' = 4x^3$.

  - kind: problem
    id: konstante
    widget: choice
    prompt: Sind x² und x² + 7 beide Stammfunktionen von 2x?
    params:
      options:
        - { label: Ja – die Konstante fällt beim Ableiten weg., correct: true }
        - { label: Nein – nur x², feedback: "Leite x² + 7 ab – die 7 verschwindet." }
    hints:
      - Was ist die Ableitung einer Konstanten?
    explanation: Darum schreibt man oft F(x) + C.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Eine Stammfunktion von $2x$ ist $x^2$.
          right: true
        - text: Eine Stammfunktion von $x^2$ ist $2x$.
          right: false
          why: Das ist die Ableitung. Die Stammfunktion ist x³/3.
        - text: Eine Stammfunktion von 5 ist $5x$.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: Finde eine Stammfunktion von $f(x) = 6x^2 + 4x$.
    params:
      variables:
        - x
    answer:
      equivalentTo: 2*x^3 + 2*x^2
    hints:
      - Erhöhe jeden Exponenten um 1 und teile durch den neuen Exponenten.
    explanation: "6x³/3 + 4x²/2 = 2x³ + 2x². Probe: ableiten."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Zu jeder Funktion gibt es unendlich viele Stammfunktionen: F(x) + C. Ob eine stimmt, zeigt die **Probe durch Ableiten**. Die Konstante C legt man mit einem bekannten Wert fest, etwa dem Startpunkt."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Es gilt F′(x) = 2x und F(0) = {{c}}. Wie groß ist F({{a}})?
    answer:
      value: "{{a * a + c}}"
    feedback:
      - when: numval(state.input) == a * a
        misconception: forgot-constant
        text: Der Startwert F(0) = {{c}} kommt noch dazu.
      - when: numval(state.input) == 2 * a
        misconception: derivative
        text: Das ist F′({{a}}), nicht F({{a}}).
    hints:
      - F(x) = x² + C.
      - F(0) = C = {{c}}.
    explanation: F(x) = x² + {{c}}, also F({{a}}) = {{a * a + c}}.
    difficulty: 2
    variants:
      params:
        a: int[2,9]
        c: int[1,9]
      defaults:
        a: 2
        c: 3

  - kind: problem
    id: mb-d3
    depth: 2
    widget: match
    prompt: Verbinde jede Funktion mit einer Stammfunktion.
    params:
      pairs:
        - left: cos x
          right: sin x
        - left: sin x
          right: −cos x
        - left: eˣ
          right: eˣ
        - left: 1/x (x > 0)
          right: ln x
      leftTitle: Funktion
      rightTitle: Stammfunktion
    hints:
      - Leite die rechte Seite ab und vergleiche.
      - (−cos x)′ = sin x.
    explanation: Jede Ableitungsregel rückwärts gelesen ist eine Integrationsregel. Das Minus bei −cos ist die häufigste Falle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Potenzregel versagt bei $f(x) = \frac{1}{x}$. Warum – und was ist die Stammfunktion?
    params:
      options:
        - label: Man müsste durch 0 teilen – die Stammfunktion ist ln x
          correct: true
        - label: "Sie versagt nicht: $x^0$"
          feedback: x⁰ = 1 hat die Ableitung 0, nicht 1/x.
        - label: Es gibt keine Stammfunktion
          feedback: Doch – die Fläche unter 1/x existiert.
    hints:
      - Aus $x^{-1}$ würde $x^0 / 0$.
    explanation: Genau in dieser Lücke sitzt der natürliche Logarithmus – eine völlig neue Funktion.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Die **Substitution** ist die Kettenregel rückwärts. In $2x\,(x^2 + 1)^3$ steckt die innere Funktion $u = x^2 + 1$ mit $u' = 2x$. Also ist $\frac{(x^2 + 1)^4}{4}$ eine Stammfunktion.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Berechne $\int_0^1 2x\,(x^2 + 1)^3\,dx$.
    answer:
      value: 3.75
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 4
        misconception: lower-limit
        text: "Die untere Grenze liefert (0 + 1)⁴ : 4 = 0,25. Zieh das ab."
    hints:
      - "F(x) = (x² + 1)⁴ : 4."
      - F(1) − F(0) = 16/4 − 1/4.
    explanation: 4 − 0,25 = 3,75.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Hat $e^{x^2}$ eine Stammfunktion, die man mit den üblichen Funktionen hinschreiben kann?
    params:
      options:
        - label: Nein – das wurde bewiesen. Man braucht eine neue Funktion.
          correct: true
        - label: "Ja: $\\frac{e^{x^2}}{2x}$"
          feedback: "Leite ab: Die Quotientenregel liefert etwas anderes."
        - label: "Ja: $e^{x^2}$ selbst"
          feedback: Die Ableitung von $e^{x^2}$ ist $2x\,e^{x^2}$.
    hints:
      - Prüfe jeden Vorschlag durch Ableiten.
      - Es fehlt ein Faktor 2x für die Substitution.
    explanation: "Liouville bewies im 19. Jahrhundert: Manche einfachen Funktionen haben keine elementare Stammfunktion. Für die Glockenkurve $e^{-x^2}$ führte man darum die Fehlerfunktion erf ein."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum zu einer Funktion viele Stammfunktionen gehören. Was darf man addieren?
    params:
      keywords:
        - - konstante
          - constant
          - plus c
          - + c
        - - ableiten
          - ableitung
          - "null"
          - derivative
          - zero
          - differentiat
        - - verschieb
          - nach oben
          - shift
          - up
      sample: Eine Konstante hat die Ableitung null. Darum kann ich zu einer Stammfunktion jede Konstante addieren, und die Ableitung bleibt gleich. Im Bild ist das dieselbe Kurve, nur nach oben verschoben.
    explanation: Ableiten vergisst die Höhe, nur die Steigung bleibt. Darum braucht man einen Startwert, um C festzulegen.
    difficulty: 3

srs:
  cards_from: [paare, konstante]
