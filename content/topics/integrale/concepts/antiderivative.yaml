id: math.integrals.antiderivative
type: concept
title: Rückwärts ableiten
summary: Die Stammfunktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Beim Ableiten wird aus x² die Funktion 2x. Welche Funktion wird beim Ableiten zu 2x?
    params:
      options:
        - label: x²
          correct: true
        - label: x
          feedback: Die Ableitung von x ist 1.
        - label: "2"
          feedback: Die Ableitung von 2 ist 0.
    hints:
      - Lies den ersten Satz rückwärts.
    explanation: Ableiten rückwärts – darum geht es jetzt.


  - kind: explain
    id: s1
    body: |
      Eine **Stammfunktion** F ist eine Funktion, deren Ableitung f ergibt. Für Potenzen dreht man die Ableitungsregel um: Aus $x^n$ wird $\frac{x^{n+1}}{n+1}$.

  - kind: problem
    id: paare
    widget: match
    prompt: Verbinde die Funktion mit einer Stammfunktion.
    params:
      pairs:
        - { left: "2x", right: "x²" }
        - { left: "3x²", right: "x³" }
        - { left: "5", right: "5x" }
        - { left: "x", right: "x²/2" }
    hints:
      - Leite die rechte Seite ab – kommt die linke heraus?
    explanation: Ableiten und Stammfunktion bilden sind Gegenspieler.

  - kind: problem
    id: bilden
    widget: expression
    prompt: "Finde eine Stammfunktion von $f(x) = 4x^3$."
    params: { variables: [x], prefix: "F(x) =" }
    answer: { equivalentTo: "x^4" }
    hints:
      - Welche Potenz ergibt abgeleitet $4x^3$?
    explanation: $(x^4)' = 4x^3$.

  - kind: problem
    id: konstante
    widget: choice
    prompt: Sind x² und x² + 7 beide Stammfunktionen von 2x?
    params:
      options:
        - { label: Ja – die Konstante fällt beim Ableiten weg., correct: true }
        - { label: Nein – nur x², feedback: "Leite x² + 7 ab – die 7 verschwindet." }
    hints:
      - Was ist die Ableitung einer Konstanten?
    explanation: Darum schreibt man oft F(x) + C.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Eine Stammfunktion von $2x$ ist $x^2$.
          right: true
        - text: Eine Stammfunktion von $x^2$ ist $2x$.
          right: false
          why: Das ist die Ableitung. Die Stammfunktion ist x³/3.
        - text: Eine Stammfunktion von 5 ist $5x$.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: Finde eine Stammfunktion von $f(x) = 6x^2 + 4x$.
    params:
      variables:
        - x
    answer:
      equivalentTo: 2*x^3 + 2*x^2
    hints:
      - Erhöhe jeden Exponenten um 1 und teile durch den neuen Exponenten.
    explanation: "6x³/3 + 4x²/2 = 2x³ + 2x². Probe: ableiten."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Potenzregel versagt bei $f(x) = \frac{1}{x}$. Warum – und was ist die Stammfunktion?
    params:
      options:
        - label: Man müsste durch 0 teilen – die Stammfunktion ist ln x
          correct: true
        - label: "Sie versagt nicht: $x^0$"
          feedback: x⁰ = 1 hat die Ableitung 0, nicht 1/x.
        - label: Es gibt keine Stammfunktion
          feedback: Doch – die Fläche unter 1/x existiert.
    hints:
      - Aus $x^{-1}$ würde $x^0 / 0$.
    explanation: Genau in dieser Lücke sitzt der natürliche Logarithmus – eine völlig neue Funktion.
    difficulty: 3

srs:
  cards_from: [paare, konstante]
