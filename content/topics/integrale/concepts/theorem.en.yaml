id: math.integrals.theorem
type: concept
title: The fundamental theorem
summary: Area equals a difference of the antiderivative.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: The odometer shows 1200 km in the morning and 1350 km in the evening. How far did you drive?
    params:
      unit: km
    answer:
      value: 150
    hints:
      - End minus start.
    explanation: You did not have to measure the speed every minute. That is exactly what the fundamental theorem says.

  - kind: explain
    id: s1
    body: |
      The **fundamental theorem** links area and derivative: $\int_a^b f(x)\,dx = F(b) - F(a)$. You do not add up endless strips. You just plug two numbers into F.

  - kind: problem
    id: dreieck
    widget: numeric
    prompt: Use the antiderivative F(x) = x² to find the area under f(x) = 2x from 0 to {{b}}.
    params: { placeholder: "Area" }
    answer: { value: "{{b * b}}" }
    hints:
      - "F({{b}}) − F(0)."
    explanation: "{{b}}² − 0 = {{b * b}}."
    variants:
      params: { b: "int[2,9]" }
      defaults: { b: 4 }

  - kind: problem
    id: grenzen
    widget: numeric
    prompt: What is the area under f(x) = 2x between {{a}} and {{b}}?
    params: { placeholder: "Area" }
    answer: { value: "{{b * b - a * a}}" }
    feedback:
      - when: "numval(state.input) == b * b"
        misconception: forgot-lower
        text: You subtract the lower limit, F(b) − F(a).
    hints:
      - "F({{b}}) − F({{a}}) with F(x) = x²."
    explanation: "{{b * b}} − {{a * a}} = {{b * b - a * a}}."
    variants:
      params: { a: "int[1,4]", b: "int[5,9]" }
      defaults: { a: 1, b: 3 }

  - kind: problem
    id: kubik
    widget: numeric
    prompt: "What is the area under f(x) = 3x² from 0 to 2? An antiderivative is x³."
    params: { placeholder: "Area" }
    answer: { value: 8 }
    hints:
      - 2³ − 0³.
    explanation: 8. Two numbers plugged in instead of infinitely many strips.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: The area under y = 2x from 0 to 3 is exactly 9. Use enough strips for the error to drop below 0.3.
    params:
      scene: riemann
      expr: 2*x
      interval:
        - 0
        - 3
    answer:
      error:
        - 0
        - 0.3
    explanation: "From 31 strips. The fundamental theorem gives the 9 without any strips: F(3) − F(0) with F(x) = x²."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Compute $\int_1^3 (2x + 1)\,dx$.
    answer:
      value: 10
    hints:
      - F(x) = x² + x. Compute F(3) − F(1).
    explanation: 12 − 2 = 10.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: Compute $\int_0^\pi \sin x\,dx$. An antiderivative is −cos x.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: sign-error
        text: "Check signs: −cos π = +1 and −cos 0 = −1."
      - when: numval(state.input) == -2
        misconception: reversed
        text: "Upper minus lower: F(π) − F(0)."
    hints:
      - F(π) = −cos π = 1.
      - F(0) = −cos 0 = −1.
    explanation: 1 − (−1) = 2. One arch of the sine has area exactly 2 – a surprisingly round number.
    difficulty: 2

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Compute $\int_1^e \frac1x\,dx$.
    answer:
      value: 1
    hints:
      - An antiderivative of 1/x is ln x.
      - ln e − ln 1.
    explanation: "1 − 0 = 1. You can even take this as the definition of e: the area under 1/x from 1 to e is exactly 1."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Compute $\int_{-2}^{2} x^3\,dx$.
    answer:
      value: 0
    hints:
      - F(x) = x⁴/4. Or look at the symmetry.
    explanation: There is as much area below the axis on the left as above it on the right. The integral counts **with sign**.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what does the fundamental theorem of calculus say?"
    params:
      keywords:
        - - fläche
          - integral
          - area
        - - stammfunktion
          - antiderivative
          - aufleit
        - - ableit
          - umkehr
          - derivative
          - inverse
          - gegenteil
          - opposite
        - - differenz
          - minus
          - difference
          - subtract
      min: 3
      sample: Integrating and differentiating are inverses of each other. The area under f is the difference of the antiderivative at the two bounds.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Proof idea: let $A(x) = \\int_a^x f(t)\\,dt$ be the **integral function**. Then A(x + h) − A(x) is a thin strip, about f(x) · h. So A′(x) = f(x). A is an antiderivative with A(a) = 0 – that gives F(b) − F(a)."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: What is the derivative of $A(x) = \int_0^x t^2\,dt$ at x = {{a}}?
    answer:
      value: "{{a * a}}"
    feedback:
      - when: numval(state.input) == a * a * a / 3
        misconception: area-not-rate
        text: That is A({{a}}), the area. Its rate of change is wanted.
    hints:
      - "The fundamental theorem says: A′(x) = f(x)."
      - f({{a}}) = {{a}}².
    explanation: A′({{a}}) = {{a}}² = {{a * a}}. How fast the area grows is the height of the curve at the edge.
    difficulty: 3
    variants:
      params:
        a: int[4,9]
      defaults:
        a: 4

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Compute $\int_{-1}^{2} x^2\,dx$.
    answer:
      value: 3
    feedback:
      - when: abs(numval(state.input) - 7 / 3) < 0.01
        misconception: sign-error
        text: F(−1) = −1/3. Minus a minus gives plus.
    hints:
      - F(x) = x³ / 3.
      - 8/3 − (−1/3).
    explanation: 8/3 + 1/3 = 3. The parabola lies entirely above the axis, so everything counts positively.
    difficulty: 3

srs:
  cards_from: [dreieck, grenzen]
