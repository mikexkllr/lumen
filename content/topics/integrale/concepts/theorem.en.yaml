id: math.integrals.theorem
type: concept
title: The fundamental theorem
summary: Area equals a difference of the antiderivative.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      The **fundamental theorem** links area and derivative: $\int_a^b f(x)\,dx = F(b) - F(a)$. You do not add up endless strips. You just plug two numbers into F.

  - kind: problem
    id: dreieck
    widget: numeric
    prompt: Use the antiderivative F(x) = x² to find the area under f(x) = 2x from 0 to {{b}}.
    params: { placeholder: "Area" }
    answer: { value: "{{b * b}}" }
    hints:
      - "F({{b}}) − F(0)."
    explanation: "{{b}}² − 0 = {{b * b}}."
    variants:
      params: { b: "int[2,9]" }
      defaults: { b: 4 }

  - kind: problem
    id: grenzen
    widget: numeric
    prompt: What is the area under f(x) = 2x between {{a}} and {{b}}?
    params: { placeholder: "Area" }
    answer: { value: "{{b * b - a * a}}" }
    feedback:
      - when: "numval(state.input) == b * b"
        misconception: forgot-lower
        text: You subtract the lower limit, F(b) − F(a).
    hints:
      - "F({{b}}) − F({{a}}) with F(x) = x²."
    explanation: "{{b * b}} − {{a * a}} = {{b * b - a * a}}."
    variants:
      params: { a: "int[1,4]", b: "int[5,9]" }
      defaults: { a: 1, b: 3 }

  - kind: problem
    id: kubik
    widget: numeric
    prompt: "What is the area under f(x) = 3x² from 0 to 2? An antiderivative is x³."
    params: { placeholder: "Area" }
    answer: { value: 8 }
    hints:
      - 2³ − 0³.
    explanation: 8. Two numbers plugged in instead of infinitely many strips.

srs:
  cards_from: [dreieck, grenzen]
