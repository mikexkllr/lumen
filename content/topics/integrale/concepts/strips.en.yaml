id: math.integrals.strips
type: concept
title: Area from strips
summary: The idea of the integral.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Rectangles versus curves
    body: Curves are in charts, blueprints and aircraft wings. Split the area under the wave into rectangles and increase their number. Watch their **sum** get closer and closer to the exact value.
    visual:
      widget: sim
      interactive: true
      params:
        scene: riemann
        expr: sin(x) + 1.5
        interval:
          - 0
          - 6

  - kind: problem
    id: hook
    widget: choice
    prompt: How do you measure the area of a curvy lake on a map?
    params:
      options:
        - label: Count squares – the smaller, the more exact
          correct: true
        - label: Length times width
          feedback: The lake is no rectangle.
        - label: It cannot be done
          feedback: With squares it works as exactly as you like.
    hints:
      - Put a grid over the map.
    explanation: Many small simple pieces add up to the curvy area.

  - kind: explain
    id: s1
    body: |
      You can estimate the area under a curve with **rectangular strips**: width times height, all added up. The narrower the strips, the more accurate the result. In the limit of infinitely narrow strips, you get the **integral** $\int f(x)\,dx$.

  - kind: problem
    id: summe
    widget: numeric
    prompt: Under f(x) = x between 0 and 4 there are four strips of width 1 with heights 1, 2, 3 and 4. What is their total area?
    params: { placeholder: "Area" }
    answer: { value: 10 }
    hints:
      - 1 + 2 + 3 + 4.
    explanation: 10. The strips stick out above the curve.

  - kind: problem
    id: genau
    widget: numeric
    prompt: The exact area under f(x) = x from 0 to 4 is a triangle. How large is it?
    params: { placeholder: "Area" }
    answer: { value: 8 }
    hints:
      - Half the base times the height.
    explanation: "4 · 4 ÷ 2 = 8. The strips overestimated by 2."

  - kind: problem
    id: schmaler
    widget: choice
    prompt: What happens if you use 400 strips instead of 4?
    params:
      options:
        - { label: The sum comes very close to the true area., correct: true }
        - { label: The sum becomes a hundred times larger., feedback: "The strips also become a hundred times narrower." }
    hints:
      - How much does a very narrow strip stick out above the curve?
    explanation: With ever narrower strips, the error vanishes. That is the integral.

  - kind: problem
    id: c1
    widget: sim
    prompt: Double the rectangles under $y = x$ (0 to 4) until the sum is at most 0.5 off the true area.
    params:
      scene: riemann
      expr: x
      interval:
        - 0
        - 4
      controls:
        n:
          value: 4
    answer:
      error:
        - 0
        - 0.5
    explanation: From 16 rectangles. The error halves when the number of strips doubles.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Left rectangles underestimate a rising curve, right ones overestimate it. Under f(x) = x from 0 to 4, 4 left strips give 6 and 4 right give 10. What is their mean?
    answer:
      value: 8
    hints:
      - (6 + 10) ÷ 2.
    explanation: 8 – here even exact. This is the **trapezoid rule**.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Instead of rectangles you can use **trapezoids**: join the curve points with straight lines. With the trapezoid rule the error shrinks like 1/n², with rectangles only like 1/n. So twice the strips means four times as accurate."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Approximate the area under $y = x^2$ from 0 to 2 with 2 trapezoids of width 1. The curve values are 0, 1 and 4.
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 1
        misconception: rectangle
        text: Those are left rectangles. A trapezoid takes the average of both edges.
    hints:
      - Trapezoid = width · (left + right height) / 2.
      - (0 + 1) / 2 + (1 + 4) / 2.
    explanation: 0.5 + 2.5 = 3. The exact value is 8/3 ≈ 2.67 – close with only two trapezoids.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: "Area under $y = x^2$ from 1 to 2: take enough rectangles to push the error below 0.05."
    params:
      scene: riemann
      expr: x^2
      interval:
        - 1
        - 2
    answer:
      error:
        - 0
        - 0.05
    explanation: The error is about 1.5 / n, so you need around 30 rectangles. The exact area is 7/3.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How is the integral defined rigorously?
    params:
      options:
        - label: As the common limit of lower and upper sums
          correct: true
        - label: As a sum of infinitely many zeros
          feedback: Infinity times zero is undefined – that is why the limit is needed.
        - label: As an area you measure
          feedback: Measuring is never exact. The definition needs no drawing.
    hints:
      - The area always lies between two computable sums.
    explanation: If both sums come arbitrarily close, the function is called **Riemann integrable**.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: For a rising curve each left rectangle misses roughly a triangle. Altogether the error is about $\frac{(f(b) - f(a))\,(b - a)}{2n}$. That lets you work out in advance how many strips a given **accuracy** needs.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: For f(x) = x from 0 to 4 the error of the left sum is exactly $\frac{8}{n}$. What is the smallest number of strips for an error of at most 0.01?
    answer:
      value: 800
    feedback:
      - when: numval(state.input) == 80
        misconception: factor-ten
        text: Then the error would be 0.1. Ten times more.
    hints:
      - 8 / n ≤ 0.01.
      - n ≥ 8 / 0.01.
    explanation: n = 800. With trapezoids the error for a straight line would be zero at once – they are exact there.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why more and narrower strips hit the area more accurately.
    params:
      keywords:
        - - schmal
          - schmaler
          - narrow
          - thin
        - - ecke
          - dreieck
          - lücke
          - corner
          - triangle
          - gap
        - - fehler
          - kleiner
          - error
          - smaller
      sample: Each rectangle does not quite fit under the curve; a small triangle is left as a gap on top. The narrower the strips, the smaller these triangles get. The error shrinks until the sum hits the area.
    explanation: Many small errors shrink faster than their number grows – that is why the sum has a limit.
    difficulty: 3

srs:
  cards_from: [genau, schmaler]
