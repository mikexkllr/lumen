id: math.integrals.strips
type: concept
title: Fläche aus Streifen
summary: Die Idee des Integrals.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Wie misst du die Fläche eines krummen Sees auf einer Karte?
    params:
      options:
        - label: Kästchen zählen – je kleiner, desto genauer
          correct: true
        - label: Länge mal Breite
          feedback: Der See ist kein Rechteck.
        - label: Das geht nicht
          feedback: Mit Kästchen geht es beliebig genau.
    hints:
      - Leg ein Gitter über die Karte.
    explanation: Viele kleine einfache Stücke ergeben die krumme Fläche.


  - kind: explain
    id: s1
    body: |
      Die Fläche unter einer Kurve schätzt man mit **Rechteckstreifen**: Breite mal Höhe, alles addiert. Je schmaler die Streifen, desto genauer. Im Grenzfall unendlich schmaler Streifen erhält man das **Integral** $\int f(x)\,dx$.

  - kind: problem
    id: summe
    widget: numeric
    prompt: Unter f(x) = x zwischen 0 und 4 liegen vier Streifen der Breite 1 mit den Höhen 1, 2, 3 und 4. Wie groß ist ihre Gesamtfläche?
    params: { placeholder: "Fläche" }
    answer: { value: 10 }
    hints:
      - 1 + 2 + 3 + 4.
    explanation: 10 – die Streifen ragen über die Kurve hinaus.

  - kind: problem
    id: genau
    widget: numeric
    prompt: Die exakte Fläche unter f(x) = x von 0 bis 4 ist ein Dreieck. Wie groß ist sie?
    params: { placeholder: "Fläche" }
    answer: { value: 8 }
    hints:
      - Halbe Grundseite mal Höhe.
    explanation: "4 · 4 : 2 = 8. Die Streifen haben um 2 überschätzt."

  - kind: problem
    id: schmaler
    widget: choice
    prompt: Was passiert, wenn man 400 statt 4 Streifen nimmt?
    params:
      options:
        - { label: Die Summe kommt der echten Fläche sehr nahe., correct: true }
        - { label: Die Summe wird hundertmal so groß., feedback: "Die Streifen werden auch hundertmal schmaler." }
    hints:
      - Wie viel ragt ein sehr schmaler Streifen über die Kurve?
    explanation: Mit immer schmaleren Streifen verschwindet der Fehler – das ist das Integral.

  - kind: problem
    id: c1
    widget: sim
    prompt: Verdopple die Rechtecke unter $y = x$ (0 bis 4), bis die Summe höchstens 0,5 von der echten Fläche abweicht.
    params:
      scene: riemann
      expr: x
      interval:
        - 0
        - 4
      controls:
        n:
          value: 4
    answer:
      error:
        - 0
        - 0.5
    explanation: Ab 16 Rechtecken. Der Fehler halbiert sich, wenn sich die Zahl der Streifen verdoppelt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Linke Rechtecke unterschätzen eine steigende Kurve, rechte überschätzen sie. Unter f(x) = x von 0 bis 4 ergeben 4 linke Streifen 6 und 4 rechte 10. Was ist ihr Mittelwert?
    answer:
      value: 8
    hints:
      - "(6 + 10) : 2."
    explanation: 8 – hier sogar exakt. Das ist die **Trapezregel**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie definiert man das Integral streng?
    params:
      options:
        - label: Als gemeinsamen Grenzwert von Unter- und Obersummen
          correct: true
        - label: Als Summe von unendlich vielen Nullen
          feedback: Unendlich mal null ist unbestimmt – darum braucht es den Grenzwert.
        - label: Als Fläche, die man ausmisst
          feedback: Messen ist nie exakt. Die Definition kommt ohne Zeichnung aus.
    hints:
      - Die Fläche liegt immer zwischen zwei berechenbaren Summen.
    explanation: Rücken beide Summen beliebig nah zusammen, heißt die Funktion **Riemann-integrierbar**.
    difficulty: 3

srs:
  cards_from: [genau, schmaler]
