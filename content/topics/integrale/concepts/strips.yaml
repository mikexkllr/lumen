id: math.integrals.strips
type: concept
title: Fläche aus Streifen
summary: Die Idee des Integrals.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Wie misst du die Fläche eines krummen Sees auf einer Karte?
    params:
      options:
        - label: Kästchen zählen – je kleiner, desto genauer
          correct: true
        - label: Länge mal Breite
          feedback: Der See ist kein Rechteck.
        - label: Das geht nicht
          feedback: Mit Kästchen geht es beliebig genau.
    hints:
      - Leg ein Gitter über die Karte.
    explanation: Viele kleine einfache Stücke ergeben die krumme Fläche.

  - kind: explain
    id: s1
    body: |
      Die Fläche unter einer Kurve schätzt man mit **Rechteckstreifen**: Breite mal Höhe, alles addiert. Je schmaler die Streifen, desto genauer. Im Grenzfall unendlich schmaler Streifen erhält man das **Integral** $\int f(x)\,dx$.

  - kind: problem
    id: summe
    widget: numeric
    prompt: Unter f(x) = x zwischen 0 und 4 liegen vier Streifen der Breite 1 mit den Höhen 1, 2, 3 und 4. Wie groß ist ihre Gesamtfläche?
    params: { placeholder: "Fläche" }
    answer: { value: 10 }
    hints:
      - 1 + 2 + 3 + 4.
    explanation: 10 – die Streifen ragen über die Kurve hinaus.

  - kind: problem
    id: genau
    widget: numeric
    prompt: Die exakte Fläche unter f(x) = x von 0 bis 4 ist ein Dreieck. Wie groß ist sie?
    params: { placeholder: "Fläche" }
    answer: { value: 8 }
    hints:
      - Halbe Grundseite mal Höhe.
    explanation: "4 · 4 : 2 = 8. Die Streifen haben um 2 überschätzt."

  - kind: problem
    id: schmaler
    widget: choice
    prompt: Was passiert, wenn man 400 statt 4 Streifen nimmt?
    params:
      options:
        - { label: Die Summe kommt der echten Fläche sehr nahe., correct: true }
        - { label: Die Summe wird hundertmal so groß., feedback: "Die Streifen werden auch hundertmal schmaler." }
    hints:
      - Wie viel ragt ein sehr schmaler Streifen über die Kurve?
    explanation: Mit immer schmaleren Streifen verschwindet der Fehler – das ist das Integral.

  - kind: problem
    id: c1
    widget: sim
    prompt: Verdopple die Rechtecke unter $y = x$ (0 bis 4), bis die Summe höchstens 0,5 von der echten Fläche abweicht.
    params:
      scene: riemann
      expr: x
      interval:
        - 0
        - 4
      controls:
        n:
          value: 4
    answer:
      error:
        - 0
        - 0.5
    explanation: Ab 16 Rechtecken. Der Fehler halbiert sich, wenn sich die Zahl der Streifen verdoppelt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Linke Rechtecke unterschätzen eine steigende Kurve, rechte überschätzen sie. Unter f(x) = x von 0 bis 4 ergeben 4 linke Streifen 6 und 4 rechte 10. Was ist ihr Mittelwert?
    answer:
      value: 8
    hints:
      - "(6 + 10) : 2."
    explanation: 8 – hier sogar exakt. Das ist die **Trapezregel**.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Statt Rechtecke kann man **Trapeze** nehmen: Man verbindet die Kurvenpunkte mit geraden Strichen. Bei der Trapezregel schrumpft der Fehler mit 1/n², bei Rechtecken nur mit 1/n. Doppelt so viele Streifen heißt also viermal genauer."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Nähere die Fläche unter $y = x^2$ von 0 bis 2 mit 2 Trapezen der Breite 1. Die Kurvenwerte sind 0, 1 und 4.
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 1
        misconception: rectangle
        text: Das sind linke Rechtecke. Ein Trapez nimmt den Mittelwert beider Ränder.
    hints:
      - "Trapez = Breite · (linke + rechte Höhe) : 2."
      - "(0 + 1) : 2 + (1 + 4) : 2."
    explanation: 0,5 + 2,5 = 3. Exakt sind es 8/3 ≈ 2,67 – schon mit zwei Trapezen nah dran.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: "Fläche unter $y = x^2$ von 1 bis 2: Nimm so viele Rechtecke, dass der Fehler unter 0,05 liegt."
    params:
      scene: riemann
      expr: x^2
      interval:
        - 1
        - 2
    answer:
      error:
        - 0
        - 0.05
    explanation: "Der Fehler ist etwa 1,5 : n, also braucht man rund 30 Rechtecke. Die exakte Fläche ist 7/3."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie definiert man das Integral streng?
    params:
      options:
        - label: Als gemeinsamen Grenzwert von Unter- und Obersummen
          correct: true
        - label: Als Summe von unendlich vielen Nullen
          feedback: Unendlich mal null ist unbestimmt – darum braucht es den Grenzwert.
        - label: Als Fläche, die man ausmisst
          feedback: Messen ist nie exakt. Die Definition kommt ohne Zeichnung aus.
    hints:
      - Die Fläche liegt immer zwischen zwei berechenbaren Summen.
    explanation: Rücken beide Summen beliebig nah zusammen, heißt die Funktion **Riemann-integrierbar**.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Bei einer steigenden Kurve fehlt jedem linken Rechteck ungefähr ein Dreieck. Zusammen ist der Fehler etwa $\frac{(f(b) - f(a))\,(b - a)}{2n}$. So kann man vorher ausrechnen, wie viele Streifen eine gewünschte **Genauigkeit** braucht.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Für f(x) = x von 0 bis 4 ist der Fehler der linken Summe genau $\frac{8}{n}$. Wie viele Streifen braucht man mindestens für einen Fehler von höchstens 0,01?
    answer:
      value: 800
    feedback:
      - when: numval(state.input) == 80
        misconception: factor-ten
        text: Dann wäre der Fehler 0,1. Noch zehnmal mehr.
    hints:
      - "8 : n ≤ 0,01."
      - "n ≥ 8 : 0,01."
    explanation: n = 800. Mit Trapezen wäre der Fehler bei einer Geraden sofort null – sie sind dort exakt.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum mehr und schmalere Streifen die Fläche genauer treffen.
    params:
      keywords:
        - - schmal
          - schmaler
          - narrow
          - thin
        - - ecke
          - dreieck
          - lücke
          - corner
          - triangle
          - gap
        - - fehler
          - kleiner
          - error
          - smaller
      sample: Jedes Rechteck passt nicht ganz unter die Kurve, oben bleibt ein kleines Dreieck als Lücke. Je schmaler die Streifen, desto kleiner werden diese Dreiecke. Der Fehler schrumpft, bis die Summe die Fläche trifft.
    explanation: Viele kleine Fehler schrumpfen schneller, als ihre Anzahl wächst – darum hat die Summe einen Grenzwert.
    difficulty: 3

srs:
  cards_from: [genau, schmaler]
