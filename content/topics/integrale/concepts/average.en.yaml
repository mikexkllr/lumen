id: math.integrals.average
type: concept
title: The average of a curve
summary: Area divided by width.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Levelling the hills
    body: "A satnav turns many changing speeds into one single average. Drag the bars up and down. The line shows the **mean**: it levels all the hills and valleys to one height."
    visual:
      widget: chart
      interactive: true
      params:
        title: Speed per hour
        labels:
          - 1st h
          - 2nd h
          - 3rd h
          - 4th h
        values:
          - 40
          - 100
          - 60
          - 80
        editable:
          - 0
          - 1
          - 2
          - 3
        min: 0
        max: 120
        step: 10
        unit: km/h
        show:
          - mean

  - kind: problem
    id: hook
    widget: numeric
    prompt: You drive one hour at 60 km/h and one hour at 100 km/h. What was your average speed?
    params:
      unit: km/h
    answer:
      value: 80
    hints:
      - Total distance divided by total time.
    explanation: 160 km in 2 hours. For a curve it works the same – just with areas.

  - kind: explain
    id: s1
    body: |
      The **average value** of a function on an interval is the height of a rectangle with the same area: the area under the curve divided by the width of the interval.

  - kind: problem
    id: gerade
    widget: numeric
    prompt: The area under f(x) = 2x from 0 to 4 is 16. What is the average value of f on this interval?
    params: { placeholder: "Average" }
    answer: { value: 4 }
    hints:
      - Area divided by width 4.
    explanation: "16 ÷ 4 = 4, exactly the function value in the middle."

  - kind: problem
    id: tempo
    widget: numeric
    prompt: A car covers {{s}} km in {{t}} hours, sometimes faster and sometimes slower. What was its average speed?
    params: { unit: km/h }
    answer: { value: "{{s / t}}" }
    hints:
      - Distance is the area under the speed curve.
    explanation: "{{s}} ÷ {{t}} = {{s / t}} km/h."
    variants:
      params: { t: "int[2,5]", v: "choice[60,75,90]" }
      derive: { s: "v * t" }
      defaults: { t: 3, v: 75 }

  - kind: problem
    id: negativ
    widget: choice
    prompt: A car's speed curve lies below the axis. What does that mean?
    params:
      options:
        - { label: The car is driving in reverse., correct: true }
        - { label: A calculation error, feedback: "Below the axis, area counts as negative, and that means something." }
    hints:
      - What does a speed below zero mean?
    explanation: Area below the axis counts as negative. Driving in reverse subtracts distance.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: A car drives for 4 hours. In the first three it goes 60, 80 and 50 km/h. Drag the last bar so that the average is exactly 70 km/h.
    params:
      title: Speed per hour
      labels:
        - 1st h
        - 2nd h
        - 3rd h
        - 4th h
      values:
        - 60
        - 80
        - 50
        - 0
      editable:
        - 3
      min: 0
      max: 120
      step: 10
      unit: km/h
      show:
        - mean
    answer:
      values:
        - 60
        - 80
        - 50
        - 90
    hints:
      - For an average of 70 km/h, the car needs 280 km in 4 hours.
      - Work out 280 − 60 − 80 − 50.
    explanation: 60 + 80 + 50 + 90 = 280 km in 4 hours – 70 km/h on average. The area of the bars is the distance; divided by the time it gives the mean.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is the mean value of $f(x) = x^2$ on the interval from 0 to 3?
    answer:
      value: 3
    hints:
      - The area is 27/3 = 9. Divide by the width.
    explanation: 9 ÷ 3 = 3. Not 4.5 – the curve is low most of the time.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Approximate the area under y = x² from 0 to 3. The error should be smaller than 0.5.
    params:
      scene: riemann
      expr: x^2
      interval:
        - 0
        - 3
    answer:
      error:
        - 0
        - 0.5
    explanation: The area is 9. Divided by the width 3 that gives the mean value 3.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "The **mean value theorem**: if f is continuous, somewhere f takes exactly its average value. Anyone who averaged 80 km/h had exactly 80 on the speedometer at some moment."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: What is the average of sin x on the interval from 0 to π? The area is 2. To three decimals.
    answer:
      value: 0.637
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.5
        misconception: sin-squared
        text: 0.5 would be the average of sin², not of sin.
      - when: numval(state.input) == 2
        misconception: no-division
        text: That is the area. Divide by the width π.
    hints:
      - Average = area / width.
      - 2 / π.
    explanation: 2 / π ≈ 0.637. The average height of a sine arch is just under two thirds of its peak.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You drive a route there at 60 km/h and back at 40 km/h. What is the average speed?
    params:
      options:
        - label: 48 km/h
          correct: true
        - label: 50 km/h
          feedback: You spend **longer** at 40 than at 60 – that drags the average down.
        - label: 52 km/h
          feedback: The slow leg takes longer, not the fast one.
    hints:
      - "Take 120 km each way: 2 h there, 3 h back."
    explanation: 240 km in 5 h is 48 km/h. You average over **time**, not distance.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: The socket delivers AC voltage. Its average is zero, yet it still heats. What counts is the average of u², because power ∝ u². Since $\overline{\sin^2} = \frac12$, the **RMS value** is $\frac{\hat u}{\sqrt2}$.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Mains voltage is 230 V RMS. What is its peak value in volts? To whole volts.
    params:
      unit: V
    answer:
      value: 325
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 163) < 1
        misconception: divided
        text: "The other way round: the peak is larger than the RMS value – times √2."
    hints:
      - RMS = peak / √2.
      - 230 · 1.414.
    explanation: 230 · √2 ≈ 325 V. That is why components on the mains must withstand more than 230 V.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux what the average of a function on an interval is.
    params:
      keywords:
        - - fläche
          - integral
          - area
        - - breite
          - intervall
          - width
          - interval
          - teilen
          - divide
        - - rechteck
          - gleiche fläche
          - rectangle
          - same area
      sample: I take the area under the curve and divide it by the width of the interval. That gives the height of a rectangle with the same area. That height is the average.
    explanation: Average = integral / width – the counterpart of »sum over count« for numbers.
    difficulty: 3

srs:
  cards_from: [gerade, negativ]
