id: math.integrals.applications
type: concept
title: Integrals in use
summary: Amounts, work, probabilities.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Measuring the bell
    body: Heights, measurement errors and test scores often follow a **bell curve**. Shift it with μ and make it wider or narrower with σ. The number shows the area between 85 and 115 as a percentage.
    visual:
      widget: sim
      interactive: true
      params:
        scene: normal

  - kind: problem
    id: wasser
    widget: numeric
    prompt: Water flows into a basin at {{r}} liters per minute for {{t}} minutes. How much water has flowed in?
    params: { unit: L }
    answer: { value: "{{r * t}}" }
    hints:
      - Rate times time. That is the area under a horizontal line.
    explanation: "{{r}} · {{t}} = {{r * t}} liters."
    variants:
      params: { r: "choice[5,8,12,20]", t: "int[5,30]" }
      defaults: { r: 12, t: 10 }

  - kind: problem
    id: wo
    widget: match
    prompt: What does the integral give you?
    params:
      pairs:
        - { left: Speed over time, right: Distance traveled }
        - { left: Power over time, right: Energy used }
        - { left: Probability density, right: Probability }
    hints:
      - Rate times time always gives an amount.
    explanation: Where a rate changes, the integral collects the total amount.

  - kind: problem
    id: glocke
    widget: choice
    prompt: How do you find what percent lies under a bell curve between two values?
    params:
      options:
        - { label: With the integral of the curve between the two values, correct: true }
        - { label: With the height of the curve, feedback: "The height is a density. Only the area is a probability." }
    hints:
      - The total area under the bell is 1.
    explanation: This is also where the 68-95-99.7 rule comes from, as areas under the bell.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: An IQ test has a mean of 100. Set μ = 100, then set σ so that about 68 % of the area lies between 85 and 115.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 67
        - 70
    hints:
      - First set μ to 100, then change σ.
      - About 68 % always lie within one spread to the left and right of the mean.
    explanation: With σ = 15, the range from 85 to 115 reaches exactly one spread to the left and right. The area there is about 68 % – an integral under the bell curve.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A spring needs the force F(x) = 20x newtons to be stretched x metres. How much work (in joules) does stretching from 0 to 0.5 m take?
    params:
      unit: J
    answer:
      value: 2.5
    hints:
      - "Work is the area under the force–distance curve: antiderivative 10x²."
    explanation: 10 · 0.25 = 2.5 J.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "A car brakes: v(t) = 10 − 2t. The area from 0 to 5 seconds is the braking distance. Find it to within 0.7 m."
    params:
      scene: riemann
      expr: 10 - 2*x
      interval:
        - 0
        - 5
    answer:
      error:
        - 0
        - 0.7
    explanation: 25 m – a triangle with width 5 and height 10.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Spinning a curve y = f(x) about the x-axis gives a **solid of revolution**. Each thin slice is a cylinder of volume $\pi f(x)^2\,dx$. So $V = \pi \int_a^b f(x)^2\,dx$.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: A semicircle $y = \sqrt{1 - x^2}$ spins into a ball. $V = \pi \int_{-1}^{1} (1 - x^2)\,dx$. What number multiplies π? To three decimals.
    answer:
      value: 1.333
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 2
        misconception: partial
        text: That is only ∫1 dx. The −x² part is missing.
    hints:
      - "Antiderivative: x − x³/3."
      - (1 − 1/3) − (−1 + 1/3).
    explanation: 4/3 ≈ 1.333. So V = 4/3 π – exactly the ball formula for r = 1.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A pipe carries $r(t) = 3t^2$ litres per minute. How many litres flow in the first 2 minutes?
    params:
      unit: L
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 12
        misconception: rate-not-amount
        text: That is the rate at t = 2. The amount – the integral – is wanted.
    hints:
      - An antiderivative of 3t² is t³.
      - 2³ − 0³.
    explanation: 8 litres. A rate integrated gives an amount – just as speed integrated gives distance.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Rotate $y = x$ from 0 to 3 about the x-axis – a cone appears. Its volume is $\pi \int_0^3 x^2 dx = \pi \cdot ?$
    answer:
      value: 9
    hints:
      - Antiderivative x³/3 at 3.
    explanation: 27/3 = 9, so 9π. Matches the cone formula ⅓ π r² h with r = h = 3.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Lifetimes often follow the **exponential distribution** with density $\lambda e^{-\lambda t}$. The total area under it is 1. The chance of lasting longer than t is $\int_t^\infty \lambda e^{-\lambda s}\,ds = e^{-\lambda t}$.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: A part lasts 1000 hours on average, exponentially distributed with λ = 1/1000. How likely does it last longer than 1000 hours? In percent, to one decimal.
    params:
      unit: "%"
    answer:
      value: 36.8
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 50
        misconception: median-mean
        text: In a skewed distribution the mean is not the middle. Most fail earlier.
    hints:
      - $e^{-\lambda t}$ with λt = 1.
      - $e^{-1} \approx 0.368$.
    explanation: Only 36.8 % outlast the mean. The median is ln 2 · 1000 ≈ 693 hours.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: "Spin $y = \\frac1x$ for x ≥ 1 about the x-axis: »Gabriel's horn«. What is true?"
    params:
      options:
        - label: It has finite volume π but infinite surface area.
          correct: true
        - label: $\pi \int_1^\infty \frac{1}{x^2}\,dx = \pi$ – the volume is finite.
          feedback: $\pi \int_1^\infty \frac{1}{x^2}\,dx = \pi$ – das Volumen ist endlich.
        - label: The surface grows at least like $\int \frac1x$, i.e. like ln x – without bound.
          feedback: Die Oberfläche wächst mindestens wie $\int \frac1x$, also wie ln x – ohne Grenze.
    hints:
      - "Volume: $\\pi \\int_1^\\infty \\frac{1}{x^2}\\,dx$."
      - The surface is bigger than $2\pi \int_1^\infty \frac1x\,dx$.
    explanation: You could fill the horn with paint but never paint its inside – a famous paradox. It dissolves because a layer of paint has a thickness.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Tell Lux how to compute the volume of a solid of revolution with slices.
    params:
      keywords:
        - - scheibe
          - zylinder
          - slice
          - disc
          - disk
          - cylinder
        - - πr²
          - pi
          - kreis
          - circle
          - f(x)²
        - - addier
          - integral
          - summe
          - add
          - sum
      sample: I cut the solid into thin slices. Each is a flat cylinder with radius f(x), so area π f(x)² times thickness dx. The integral adds all slices up to the volume.
    explanation: "As with Cavalieri: cross-section times thickness, summed up. Here the cross-section is a circle."
    difficulty: 3

srs:
  cards_from: [wasser, wo]
