id: math.integrals.theorem
type: concept
title: Der Hauptsatz
summary: Fläche gleich Differenz der Stammfunktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Der **Hauptsatz der Analysis** verbindet Fläche und Ableitung: $\int_a^b f(x)\,dx = F(b) - F(a)$. Statt unendlich viele Streifen zu addieren, setzt man zwei Zahlen in die Stammfunktion ein.

  - kind: problem
    id: dreieck
    widget: numeric
    prompt: Berechne die Fläche unter f(x) = 2x von 0 bis {{b}} mit der Stammfunktion F(x) = x².
    params: { placeholder: "Fläche" }
    answer: { value: "{{b * b}}" }
    hints:
      - "F({{b}}) − F(0)."
    explanation: "{{b}}² − 0 = {{b * b}}."
    variants:
      params: { b: "int[2,9]" }
      defaults: { b: 4 }

  - kind: problem
    id: grenzen
    widget: numeric
    prompt: Wie groß ist die Fläche unter f(x) = 2x zwischen {{a}} und {{b}}?
    params: { placeholder: "Fläche" }
    answer: { value: "{{b * b - a * a}}" }
    feedback:
      - when: "numval(state.input) == b * b"
        misconception: forgot-lower
        text: Die untere Grenze zieht man ab – F(b) − F(a).
    hints:
      - "F({{b}}) − F({{a}}) mit F(x) = x²."
    explanation: "{{b * b}} − {{a * a}} = {{b * b - a * a}}."
    variants:
      params: { a: "int[1,4]", b: "int[5,9]" }
      defaults: { a: 1, b: 3 }

  - kind: problem
    id: kubik
    widget: numeric
    prompt: Fläche unter f(x) = 3x² von 0 bis 2? Eine Stammfunktion ist x³.
    params: { placeholder: "Fläche" }
    answer: { value: 8 }
    hints:
      - 2³ − 0³.
    explanation: 8 – zwei Zahlen eingesetzt statt unendlich vieler Streifen.

srs:
  cards_from: [dreieck, grenzen]
