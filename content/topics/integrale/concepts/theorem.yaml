id: math.integrals.theorem
type: concept
title: Der Hauptsatz
summary: Fläche gleich Differenz der Stammfunktion.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: Der Kilometerzähler zeigt morgens 1200 km und abends 1350 km. Wie weit bist du gefahren?
    params:
      unit: km
    answer:
      value: 150
    hints:
      - Ende minus Anfang.
    explanation: Du musstest nicht jede Minute das Tempo messen. Genau das sagt der Hauptsatz.

  - kind: explain
    id: s1
    body: |
      Der **Hauptsatz der Analysis** verbindet Fläche und Ableitung: $\int_a^b f(x)\,dx = F(b) - F(a)$. Statt unendlich viele Streifen zu addieren, setzt man zwei Zahlen in die Stammfunktion ein.

  - kind: problem
    id: dreieck
    widget: numeric
    prompt: Berechne die Fläche unter f(x) = 2x von 0 bis {{b}} mit der Stammfunktion F(x) = x².
    params: { placeholder: "Fläche" }
    answer: { value: "{{b * b}}" }
    hints:
      - "F({{b}}) − F(0)."
    explanation: "{{b}}² − 0 = {{b * b}}."
    variants:
      params: { b: "int[2,9]" }
      defaults: { b: 4 }

  - kind: problem
    id: grenzen
    widget: numeric
    prompt: Wie groß ist die Fläche unter f(x) = 2x zwischen {{a}} und {{b}}?
    params: { placeholder: "Fläche" }
    answer: { value: "{{b * b - a * a}}" }
    feedback:
      - when: "numval(state.input) == b * b"
        misconception: forgot-lower
        text: Die untere Grenze zieht man ab – F(b) − F(a).
    hints:
      - "F({{b}}) − F({{a}}) mit F(x) = x²."
    explanation: "{{b * b}} − {{a * a}} = {{b * b - a * a}}."
    variants:
      params: { a: "int[1,4]", b: "int[5,9]" }
      defaults: { a: 1, b: 3 }

  - kind: problem
    id: kubik
    widget: numeric
    prompt: Fläche unter f(x) = 3x² von 0 bis 2? Eine Stammfunktion ist x³.
    params: { placeholder: "Fläche" }
    answer: { value: 8 }
    hints:
      - 2³ − 0³.
    explanation: 8 – zwei Zahlen eingesetzt statt unendlich vieler Streifen.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Die Fläche unter y = 2x von 0 bis 3 ist genau 9. Nimm so viele Streifen, dass der Fehler unter 0,3 fällt.
    params:
      scene: riemann
      expr: 2*x
      interval:
        - 0
        - 3
    answer:
      error:
        - 0
        - 0.3
    explanation: "Ab 31 Streifen. Der Hauptsatz liefert die 9 ganz ohne Streifen: F(3) − F(0) mit F(x) = x²."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Berechne $\int_1^3 (2x + 1)\,dx$.
    answer:
      value: 10
    hints:
      - F(x) = x² + x. Rechne F(3) − F(1).
    explanation: 12 − 2 = 10.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: Berechne $\int_0^\pi \sin x\,dx$. Eine Stammfunktion ist −cos x.
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: sign-error
        text: "Vorzeichen prüfen: −cos π = +1 und −cos 0 = −1."
      - when: numval(state.input) == -2
        misconception: reversed
        text: "Obere minus untere Grenze: F(π) − F(0)."
    hints:
      - F(π) = −cos π = 1.
      - F(0) = −cos 0 = −1.
    explanation: 1 − (−1) = 2. Ein Sinusbogen hat genau die Fläche 2 – eine überraschend glatte Zahl.
    difficulty: 2

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Berechne $\int_1^e \frac1x\,dx$.
    answer:
      value: 1
    hints:
      - Eine Stammfunktion von 1/x ist ln x.
      - ln e − ln 1.
    explanation: "1 − 0 = 1. Das kann man sogar als Definition von e nehmen: Die Fläche unter 1/x von 1 bis e ist genau 1."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Berechne $\int_{-2}^{2} x^3\,dx$.
    answer:
      value: 0
    hints:
      - F(x) = x⁴/4. Oder schau auf die Symmetrie.
    explanation: Links liegt genauso viel Fläche unter der Achse wie rechts darüber. Das Integral zählt **mit Vorzeichen**.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was sagt der Hauptsatz der Analysis?"
    params:
      keywords:
        - - fläche
          - integral
          - area
        - - stammfunktion
          - antiderivative
          - aufleit
        - - ableit
          - umkehr
          - derivative
          - inverse
          - gegenteil
          - opposite
        - - differenz
          - minus
          - difference
          - subtract
      min: 3
      sample: Integrieren und Ableiten sind Umkehrungen voneinander. Die Fläche unter f erhält man als Differenz der Stammfunktion an den beiden Grenzen.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Beweisidee: Sei $A(x) = \\int_a^x f(t)\\,dt$ die **Integralfunktion**. Dann ist A(x + h) − A(x) ein schmaler Streifen, etwa f(x) · h. Also A′(x) = f(x). A ist eine Stammfunktion mit A(a) = 0 – daraus folgt F(b) − F(a)."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wie groß ist die Ableitung von $A(x) = \int_0^x t^2\,dt$ an der Stelle x = {{a}}?
    answer:
      value: "{{a * a}}"
    feedback:
      - when: numval(state.input) == a * a * a / 3
        misconception: area-not-rate
        text: Das ist A({{a}}), die Fläche. Gefragt ist ihre Änderungsrate.
    hints:
      - "Der Hauptsatz sagt: A′(x) = f(x)."
      - f({{a}}) = {{a}}².
    explanation: A′({{a}}) = {{a}}² = {{a * a}}. Wie schnell die Fläche wächst, ist die Höhe der Kurve am Rand.
    difficulty: 3
    variants:
      params:
        a: int[4,9]
      defaults:
        a: 4

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Berechne $\int_{-1}^{2} x^2\,dx$.
    answer:
      value: 3
    feedback:
      - when: abs(numval(state.input) - 7 / 3) < 0.01
        misconception: sign-error
        text: F(−1) = −1/3. Minus minus ergibt plus.
    hints:
      - "F(x) = x³ : 3."
      - 8/3 − (−1/3).
    explanation: 8/3 + 1/3 = 3. Die Parabel liegt ganz über der Achse, also zählt alles positiv.
    difficulty: 3

srs:
  cards_from: [dreieck, grenzen]
