id: math.integrals.applications
type: concept
title: Integrale im Einsatz
summary: Mengen, Arbeit, Wahrscheinlichkeiten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: wasser
    widget: numeric
    prompt: In ein Becken fließen {{r}} Liter pro Minute, {{t}} Minuten lang. Wie viel Wasser ist hineingeflossen?
    params: { unit: L }
    answer: { value: "{{r * t}}" }
    hints:
      - Rate mal Zeit – die Fläche unter einer waagerechten Linie.
    explanation: "{{r}} · {{t}} = {{r * t}} Liter."
    variants:
      params: { r: "choice[5,8,12,20]", t: "int[5,30]" }
      defaults: { r: 12, t: 10 }

  - kind: problem
    id: wo
    widget: match
    prompt: Was liefert das Integral?
    params:
      pairs:
        - { left: Tempo über die Zeit, right: Zurückgelegte Strecke }
        - { left: Leistung über die Zeit, right: Verbrauchte Energie }
        - { left: Wahrscheinlichkeitsdichte, right: Wahrscheinlichkeit }
    hints:
      - Rate mal Zeit ergibt immer eine Menge.
    explanation: Wo sich eine Rate verändert, sammelt das Integral die Gesamtmenge.

  - kind: problem
    id: glocke
    widget: choice
    prompt: Wie berechnet man, wie viel Prozent unter einer Glockenkurve zwischen zwei Werten liegen?
    params:
      options:
        - { label: Mit dem Integral der Kurve zwischen beiden Werten, correct: true }
        - { label: Mit der Höhe der Kurve, feedback: "Die Höhe ist eine Dichte – erst die Fläche ist eine Wahrscheinlichkeit." }
    hints:
      - Die Gesamtfläche unter der Glocke ist 1.
    explanation: So entsteht auch die 68-95-99,7-Regel – als Flächen unter der Glocke.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Feder braucht die Kraft F(x) = 20x Newton, um x Meter gedehnt zu werden. Welche Arbeit (in Joule) kostet das Dehnen von 0 auf 0,5 m?
    params:
      unit: J
    answer:
      value: 2.5
    hints:
      - "Arbeit ist die Fläche unter der Kraft-Weg-Kurve: Stammfunktion 10x²."
    explanation: 10 · 0,25 = 2,5 J.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Dreh $y = x$ von 0 bis 3 um die x-Achse – es entsteht ein Kegel. Sein Volumen ist $\pi \int_0^3 x^2 dx = \pi \cdot ?$
    answer:
      value: 9
    hints:
      - Stammfunktion x³/3 bei 3.
    explanation: 27/3 = 9, also 9π. Passt zur Kegelformel ⅓ π r² h mit r = h = 3.
    difficulty: 3

srs:
  cards_from: [wasser, wo]
