id: sci.chemistry.molecules
type: concept
title: Moleküle
summary: Formeln lesen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ein Atom mehr
    body: "Wasser, Zucker, Luft: Atome verbinden sich zu **Molekülen**. Schon ein einziges Atom mehr kann alles ändern. Deck die Karten auf und staune, was ein O-Atom ausmacht."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🫧
            front: O₂ oder O₃?
            back: Zwei O-Atome atmest du ein. Drei O-Atome sind Ozon – es reizt die Lunge.
          - icon: 🥤
            front: CO₂ oder CO?
            back: CO₂ sprudelt in der Limo. Mit einem O weniger wird daraus giftiges Kohlenmonoxid.
          - icon: 💇
            front: H₂O oder H₂O₂?
            back: Ein O mehr, und aus Wasser wird ein Bleichmittel für Haare.
          - icon: 🍬
            front: Gleiche Atome, andere Ordnung
            back: Trauben- und Fruchtzucker haben dieselbe Formel – und schmecken doch verschieden süß.

  - kind: problem
    id: wasser
    widget: numeric
    prompt: Wie viele Atome hat ein Wassermolekül H₂O?
    params: { unit: Atome }
    answer: { value: 3 }
    hints:
      - Die kleine 2 gehört zum H.
    explanation: Zwei Wasserstoffatome und ein Sauerstoffatom.

  - kind: explain
    id: s2
    body: |
      Atome verbinden sich zu **Molekülen**. Die kleine Zahl in der Formel sagt, wie oft das Atom davor vorkommt. Steht keine Zahl da, ist es einmal.

  - kind: problem
    id: zucker
    widget: numeric
    prompt: Traubenzucker hat die Formel C₆H₁₂O₆. Wie viele Atome sind es insgesamt?
    params: { unit: Atome }
    answer: { value: 24 }
    hints:
      - 6 + 12 + 6.
    explanation: 6 Kohlenstoff, 12 Wasserstoff, 6 Sauerstoff – zusammen 24.

  - kind: problem
    id: namen
    widget: match
    prompt: Verbinde Formel und Stoff.
    params:
      pairs:
        - { left: "H₂O", right: Wasser }
        - { left: "CO₂", right: Kohlendioxid }
        - { left: "NaCl", right: Kochsalz }
        - { left: "O₂", right: Sauerstoffgas }
    hints:
      - Na steht für Natrium, Cl für Chlor.
    explanation: Kochsalz ist Natriumchlorid – Natrium und Chlor im Verhältnis 1 zu 1.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: CO₂ besteht aus einem Kohlenstoff- und zwei Sauerstoffatomen.
          right: true
        - text: H₂O₂ ist dasselbe wie H₂O.
          right: false
          why: Wasserstoffperoxid hat ein Sauerstoffatom mehr – und bleicht Haare.
        - text: O₂ ist ein Molekül aus zwei gleichen Atomen.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Atome stecken in **drei** Molekülen Ammoniak, 3 NH₃?
    answer:
      value: 12
    hints:
      - Ein Molekül hat 4 Atome. Die große 3 gilt für das ganze Molekül.
    explanation: 3 · 4 = 12. Die große Zahl davor zählt Moleküle, die kleine dahinter Atome.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: choice
    prompt: Was ist der Unterschied zwischen 2 H und H₂?
    params:
      options:
        - label: 2 H sind zwei einzelne Atome, H₂ ist ein Molekül aus zwei Atomen
          correct: true
        - label: Kein Unterschied
          feedback: Beide zählen zwei Atome – aber nur bei H₂ hängen sie zusammen.
        - label: H₂ sind zwei Moleküle
          feedback: Die kleine Zahl zählt die Atome in einem Molekül.
    hints:
      - Die kleine Zahl gehört zum Molekül.
      - Die große Zahl davor zählt Teilchen.
    explanation: Die große Zahl zählt Teilchen, die kleine Zahl Atome im Teilchen.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Element oder Verbindung? Ein Element besteht aus nur einer Atomsorte.
    params:
      buckets:
        - id: b1
          label: Element
        - id: b2
          label: Verbindung
      items:
        - label: O₂
          bucket: b1
        - label: N₂
          bucket: b1
        - label: O₃ (Ozon)
          bucket: b1
        - label: H₂O
          bucket: b2
        - label: CO₂
          bucket: b2
        - label: CH₄
          bucket: b2
    hints:
      - Zähle die verschiedenen Buchstaben-Symbole.
      - O₃ hat drei Atome – aber alle sind Sauerstoff.
    explanation: O₂, N₂ und O₃ sind Moleküle, aber Elemente. H₂O, CO₂ und CH₄ verbinden zwei Atomsorten.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Bei einer Verbrennung entstehen {{k}} CO₂ und {{m}} H₂O. Wie viele Sauerstoffatome sind das zusammen?
    answer:
      value: "{{2 * k + m}}"
    feedback:
      - when: numval(state.input) == k + m
        misconception: subscript-ignored
        text: Jedes CO₂ hat zwei O-Atome.
    hints:
      - CO₂ hat 2 O, H₂O hat 1 O.
      - Rechne {{k}} · 2 + {{m}} · 1.
    explanation: "{{k}} · 2 + {{m}} = {{2 * k + m}} Sauerstoffatome."
    difficulty: 2
    variants:
      params:
        k: int[1,6]
        m: int[1,6]
      defaults:
        k: 3
        m: 4

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ethanol und Dimethylether haben beide die Formel C₂H₆O. Das eine ist Trinkalkohol, das andere ein Gas. Wie kann das sein?
    params:
      options:
        - label: Die Atome sind verschieden verknüpft – die Struktur entscheidet
          correct: true
        - label: Eine der Formeln muss falsch sein
          feedback: Beide stimmen. Die Summenformel sagt nicht alles.
        - label: Sie haben verschiedene Isotope
          feedback: Isotope ändern die Chemie kaum.
    hints:
      - Dieselben Bausteine, anders zusammengesteckt.
    explanation: Solche Stoffe heißen **Isomere**. Darum zeichnen Chemiker Strukturformeln.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Löschkalk hat die Formel Ca(OH)₂. Die 2 gilt für die ganze Klammer. Wie viele Atome hat eine Formeleinheit?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: bracket-partial
        text: Auch das O steht in der Klammer – es zählt doppelt.
    hints:
      - In der Klammer stehen O und H.
      - 1 Ca + 2 · (1 O + 1 H).
    explanation: "1 + 2 · 2 = 5 Atome: ein Ca, zwei O, zwei H."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: Aluminiumsulfat hat die Formel Al₂(SO₄)₃. Wie viele Atome hat eine Formeleinheit?
    answer:
      value: 17
    feedback:
      - when: numval(state.input) == 7
        misconception: bracket-ignored
        text: Die 3 hinter der Klammer gilt für alles darin.
    hints:
      - Eine SO₄-Gruppe hat 5 Atome.
      - 2 Al + 3 · 5.
    explanation: 2 + 3 · 5 = 17 Atome.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: "Traubenzucker C₆H₁₂O₆ und Essigsäure C₂H₄O₂ sind ganz verschiedene Stoffe. Welches Atomverhältnis C : H : O haben beide?"
    params:
      options:
        - label: "1 : 2 : 1"
          correct: true
        - label: "6 : 12 : 6"
          feedback: Das ist nur der Zucker – kürze die Zahlen.
        - label: "2 : 4 : 2"
          feedback: Das gilt für die Essigsäure – kürze weiter.
    hints:
      - Teile alle drei Zahlen durch dieselbe Zahl.
      - Zucker durch 6, Essigsäure durch 2.
    explanation: Beide haben die Verhältnisformel CH₂O. Das Verhältnis allein verrät noch nicht, welcher Stoff es ist.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was bedeutet in »3 H₂O« die große 3 – und was die kleine 2?"
    params:
      keywords:
        - - molekül
          - molecule
          - teilchen
          - particle
        - - atom
        - - wasserstoff
          - hydrogen
          - zwei
          - two
      sample: "Die große 3 zählt die Moleküle: drei Wasserteilchen. Die kleine 2 zählt die Wasserstoffatome in jedem Molekül. Zusammen sind es also 6 H-Atome."
    difficulty: 3

srs:
  cards_from: [zucker, namen]
