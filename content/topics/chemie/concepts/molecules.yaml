id: sci.chemistry.molecules
type: concept
title: Moleküle
summary: Formeln lesen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wasser
    widget: numeric
    prompt: Wie viele Atome hat ein Wassermolekül H₂O?
    params: { unit: Atome }
    answer: { value: 3 }
    hints:
      - Die kleine 2 gehört zum H.
    explanation: Zwei Wasserstoffatome und ein Sauerstoffatom.

  - kind: explain
    id: s2
    body: |
      Atome verbinden sich zu **Molekülen**. Die kleine Zahl in der Formel sagt, wie oft das Atom davor vorkommt. Steht keine Zahl da, ist es einmal.

  - kind: problem
    id: zucker
    widget: numeric
    prompt: Traubenzucker hat die Formel C₆H₁₂O₆. Wie viele Atome sind es insgesamt?
    params: { unit: Atome }
    answer: { value: 24 }
    hints:
      - 6 + 12 + 6.
    explanation: 6 Kohlenstoff, 12 Wasserstoff, 6 Sauerstoff – zusammen 24.

  - kind: problem
    id: namen
    widget: match
    prompt: Verbinde Formel und Stoff.
    params:
      pairs:
        - { left: "H₂O", right: Wasser }
        - { left: "CO₂", right: Kohlendioxid }
        - { left: "NaCl", right: Kochsalz }
        - { left: "O₂", right: Sauerstoffgas }
    hints:
      - Na steht für Natrium, Cl für Chlor.
    explanation: Kochsalz ist Natriumchlorid – Natrium und Chlor im Verhältnis 1 zu 1.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: CO₂ besteht aus einem Kohlenstoff- und zwei Sauerstoffatomen.
          right: true
        - text: H₂O₂ ist dasselbe wie H₂O.
          right: false
          why: Wasserstoffperoxid hat ein Sauerstoffatom mehr – und bleicht Haare.
        - text: O₂ ist ein Molekül aus zwei gleichen Atomen.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie viele Atome stecken in **drei** Molekülen Ammoniak, 3 NH₃?
    answer:
      value: 12
    hints:
      - Ein Molekül hat 4 Atome. Die große 3 gilt für das ganze Molekül.
    explanation: 3 · 4 = 12. Die große Zahl davor zählt Moleküle, die kleine dahinter Atome.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ethanol und Dimethylether haben beide die Formel C₂H₆O. Das eine ist Trinkalkohol, das andere ein Gas. Wie kann das sein?
    params:
      options:
        - label: Die Atome sind verschieden verknüpft – die Struktur entscheidet
          correct: true
        - label: Eine der Formeln muss falsch sein
          feedback: Beide stimmen. Die Summenformel sagt nicht alles.
        - label: Sie haben verschiedene Isotope
          feedback: Isotope ändern die Chemie kaum.
    hints:
      - Dieselben Bausteine, anders zusammengesteckt.
    explanation: Solche Stoffe heißen **Isomere**. Darum zeichnen Chemiker Strukturformeln.
    difficulty: 3

srs:
  cards_from: [zucker, namen]
