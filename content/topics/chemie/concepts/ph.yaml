id: sci.chemistry.ph
type: concept
title: Sauer oder basisch
summary: Der pH-Wert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was ist saurer: Zitronensaft oder Milch?"
    params:
      options:
        - label: Zitronensaft
          correct: true
        - label: Milch
          feedback: Milch schmeckt mild.
        - label: Beide gleich
          feedback: Deine Zunge merkt den Unterschied sofort.
    hints:
      - Wobei verziehst du das Gesicht?
    explanation: "Wie sauer etwas ist, misst man mit einer Zahl: dem pH-Wert."


  - kind: explain
    id: s1
    body: |
      Der **pH-Wert** reicht von 0 bis 14. Unter 7 ist es **sauer**, 7 ist neutral, über 7 **basisch**. Jede Stufe ist zehnmal stärker als die nächste.

  - kind: problem
    id: reihe
    widget: order
    prompt: Ordne von sauer nach basisch.
    params:
      items:
        - { label: Zitronensaft }
        - { label: Kaffee }
        - { label: Reines Wasser }
        - { label: Seifenlauge }
    hints:
      - Reines Wasser ist neutral.
    explanation: Zitrone etwa pH 2, Kaffee 5, Wasser 7, Seife etwa 10.

  - kind: problem
    id: zehnfach
    widget: numeric
    prompt: Eine Lösung hat pH 3, eine andere pH 5. Wievielmal saurer ist die erste?
    params: { unit: "-mal" }
    answer: { value: 100 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: linear-scale
        text: Jede pH-Stufe ist ein Faktor 10 – nicht eins mehr.
    hints:
      - Zwei Stufen – zweimal mal 10.
    explanation: 10 · 10 = 100-mal saurer.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Sauer oder basisch?
    params:
      buckets: [{ label: sauer }, { label: basisch }]
      items:
        - { label: Essig, bucket: sauer }
        - { label: Cola, bucket: sauer }
        - { label: Magensaft, bucket: sauer }
        - { label: Natron in Wasser, bucket: basisch }
        - { label: Rohrreiniger, bucket: basisch }
    hints:
      - Saures schmeckt oft sauer – Basisches fühlt sich seifig an.
    explanation: Rohrreiniger ist stark basisch und löst Fett und Haare.

  - kind: problem
    id: c1
    widget: match
    prompt: Welcher pH-Wert passt ungefähr?
    params:
      pairs:
        - left: Magensäure
          right: pH 1–2
        - left: Zitronensaft
          right: pH 2–3
        - left: Reines Wasser
          right: pH 7
        - left: Seife
          right: pH 9–10
        - left: Rohrreiniger
          right: pH 14
    hints:
      - Sauer ist unter 7, basisch darüber.
    explanation: Sehr sauer und sehr basisch sind beide ätzend.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du verdünnst 10 ml einer Lösung mit pH 2 auf 1 Liter. Welchen pH-Wert hat sie danach?
    answer:
      value: 4
    hints:
      - Auf das Hundertfache verdünnt – das sind zwei Zehnerstufen.
    explanation: Hundertmal weniger H⁺ heißt pH + 2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Blut hält seinen pH-Wert bei 7,4 – auch wenn Säure dazukommt. Wie?
    params:
      options:
        - label: Ein Puffer aus Kohlensäure und Hydrogencarbonat fängt H⁺ ab
          correct: true
        - label: Blut enthält keine Säuren
          feedback: Der Stoffwechsel erzeugt ständig Säure.
        - label: Das Wasser im Blut verdünnt alles
          feedback: Verdünnen allein würde nicht reichen.
    hints:
      - Ein Stoffpaar, das H⁺ aufnehmen **und** abgeben kann.
    explanation: Ein **Puffer** hält den pH stabil. Schon 0,4 Abweichung wären lebensgefährlich.
    difficulty: 3

srs:
  cards_from: [zehnfach, sortieren]
