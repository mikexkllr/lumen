id: sci.chemistry.reactions
type: concept
title: Nothing is lost
summary: Reactions and equations.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Atoms swap partners
    body: Toast browns, wood burns, iron rusts – everywhere atoms swap partners. That is a **reaction**. Uncover the cards in order and follow what happens in the toaster.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🍞
            front: Cold bread
            back: Bread holds sugar and protein, their atoms firmly linked.
          - icon: 🔥
            front: Heat
            back: The heat shakes the molecules, and bonds break open.
          - icon: 🔄
            front: New partners
            back: The atoms rearrange and form brand-new substances.
          - icon: 😋
            front: Brown and fragrant
            back: "Roast flavours and brown colour: no atom has vanished, they are only regrouped."

  - kind: problem
    id: holz
    widget: choice
    prompt: A log burns and only a little ash is left. Where did the rest of the mass go?
    params:
      options:
        - { label: Into gases such as CO₂ and water vapor, correct: true }
        - { label: It was destroyed, feedback: "No mass is lost in chemical reactions." }
        - { label: Into the light of the flame, feedback: "Light carries energy, but practically no mass." }
    hints:
      - What rises above a fire?
    explanation: The atoms of the wood are now in gases that escape into the air.

  - kind: explain
    id: s2
    body: |
      In a **reaction**, atoms rearrange. None disappear and none are added. That is why a reaction equation has the same number of atoms of each kind on both sides.

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: "2 H₂ + O₂ → 2 H₂O. How many hydrogen atoms are on the left?"
    params: { unit: atoms }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: coefficient
        text: The large 2 in front doubles the whole H₂ molecule.
    hints:
      - "2 H₂ means H₂ twice."
    explanation: 2 · 2 = 4 hydrogen atoms. On the right, 2 H₂O also has 4.

  - kind: problem
    id: ausgleichen
    widget: numeric
    prompt: "N₂ + ? H₂ → 2 NH₃. Which number goes in front of H₂?"
    params: { placeholder: "Number" }
    answer: { value: 3 }
    hints:
      - On the right there are 2 · 3 = 6 hydrogen atoms.
    explanation: 3 H₂ gives 6 hydrogen atoms, as many as in 2 NH₃.

  - kind: problem
    id: c1
    widget: order
    prompt: "Balance: methane burns. Order the reasoning."
    params:
      items:
        - label: CH₄ + O₂ → CO₂ + H₂O (not yet balanced)
        - label: 4 H on the left need 2 H₂O on the right.
        - label: Now there are 4 O on the right.
        - label: "So 2 O₂ on the left: CH₄ + 2 O₂ → CO₂ + 2 H₂O"
    hints:
      - Balance C first, then H, O last.
    explanation: Oxygen comes last because it occurs in several substances.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Balance with whole numbers: 4 Fe + ? O₂ → 2 Fe₂O₃. Which number belongs in front of O₂?"
    answer:
      value: 3
    hints:
      - On the right there are 2 · 3 = 6 oxygen atoms.
    explanation: 3 O₂ supply 6 O. This is how rust forms.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: tiles
    prompt: "Methane burns: _ CH₄ + _ O₂ → _ CO₂ + _ H₂O. Place the four coefficients in order."
    params:
      tiles:
        - "1"
        - "1"
        - "2"
        - "2"
        - "3"
        - "4"
      slots: 4
    answer:
      sequence:
        - "1"
        - "2"
        - "1"
        - "2"
    hints:
      - One C on the left gives one CO₂ on the right. Four H give two H₂O.
      - The right side now has 2 + 2 = 4 O atoms. How many O₂ is that?
    explanation: "CH₄ + 2 O₂ → CO₂ + 2 H₂O. Left and right: 1 C, 4 H, 4 O."
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: "Propane burns in a gas grill: C₃H₈ + ? O₂ → 3 CO₂ + 4 H₂O. Which number goes in front of O₂?"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 10
        misconception: atoms-vs-molecules
        text: Ten is the number of O atoms. Each O₂ brings two of them.
    hints:
      - "Count the O atoms on the right: in 3 CO₂ and in 4 H₂O."
      - 6 + 4 = 10 O atoms. How many O₂ molecules?
    explanation: The right side has 10 O atoms, so 5 O₂.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: swipe
    prompt: Real reaction – or just a change of state?
    params:
      cards:
        - text: Ice melts.
          right: false
          why: It stays water, just liquid.
        - text: Wood burns.
          right: true
          why: CO₂ and water form.
        - text: Sugar dissolves in tea.
          right: false
          why: Evaporate the tea and the sugar is back.
        - text: An egg turns solid when boiled.
          right: true
          why: The proteins change for good.
        - text: Water evaporates.
          right: false
          why: Steam is still H₂O.
        - text: Iron rusts.
          right: true
          why: "A new substance forms: iron oxide."
      left: state only
      right: reaction
    explanation: A reaction makes a new substance. Melting, dissolving and evaporating leave the substance the same.
    difficulty: 2

  - kind: problem
    id: ch-d4
    depth: 2
    widget: numeric
    prompt: "{{c}} g of carbon burn completely with {{o}} g of oxygen to CO₂. How many grams of CO₂ form?"
    params:
      unit: g
    answer:
      value: "{{11 * k}}"
    hints:
      - No mass is lost, none is added.
      - Add both masses.
    explanation: "{{c}} g + {{o}} g = {{11 * k}} g. Mass is conserved."
    difficulty: 2
    variants:
      params:
        k: int[1,9]
      derive:
        c: 3 * k
        o: 8 * k
      defaults:
        k: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "In photosynthesis: 6 CO₂ + 6 H₂O → C₆H₁₂O₆ + ? O₂. Which number is missing?"
    answer:
      value: 6
    hints:
      - On the left there are 12 + 6 = 18 O. The sugar binds 6 of them.
    explanation: "12 O remain: 6 O₂. Every oxygen molecule you breathe comes from this reaction."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Around 1775, Antoine Lavoisier weighed substances before and after reactions – in sealed vessels. The mass always stayed the same. This is the law of **conservation of mass**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: A candle burns inside a tightly sealed jar standing on a scale. What does the scale show afterwards?
    params:
      options:
        - label: Exactly the same as before
          correct: true
        - label: Less, because the wax is gone
          feedback: The wax turned into CO₂ and water – and they stay in the jar.
        - label: More, because smoke is added
          feedback: The smoke forms from substances already in the jar.
    hints:
      - Can anything leave or enter the jar?
      - The atoms only rearrange.
    explanation: In a sealed jar every atom stays inside. In the open the candle loses mass because the gases escape.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: "Ethane burns: 2 C₂H₆ + ? O₂ → 4 CO₂ + 6 H₂O. Which number goes in front of O₂?"
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 14
        misconception: atoms-vs-molecules
        text: Fourteen is the number of O atoms, not O₂ molecules.
    hints:
      - "Count the O atoms on the right: 4 · 2 + 6 · 1."
      - 14 O atoms fit into 7 O₂.
    explanation: "The right side has 8 + 6 = 14 O atoms, so 7 O₂. That is why everything is doubled: one C₂H₆ would need 3.5 O₂."
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why a chemical equation has to be balanced.
    params:
      keywords:
        - - atom
        - - verschwind
          - verloren
          - erhalt
          - gleich viel
          - lost
          - conserv
          - disappear
          - same number
        - - links
          - rechts
          - seite
          - left
          - right
          - side
      sample: In a reaction no atom disappears and none is added. The atoms only rearrange. So the left and right side must have the same number of each kind of atom.
    difficulty: 3

srs:
  cards_from: [zaehlen, ausgleichen]
