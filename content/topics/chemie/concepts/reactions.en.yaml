id: sci.chemistry.reactions
type: concept
title: Nothing is lost
summary: Reactions and equations.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: holz
    widget: choice
    prompt: A log burns and only a little ash is left. Where did the rest of the mass go?
    params:
      options:
        - { label: Into gases such as CO₂ and water vapor, correct: true }
        - { label: It was destroyed, feedback: "No mass is lost in chemical reactions." }
        - { label: Into the light of the flame, feedback: "Light carries energy, but practically no mass." }
    hints:
      - What rises above a fire?
    explanation: The atoms of the wood are now in gases that escape into the air.

  - kind: explain
    body: |
      In a **reaction**, atoms rearrange. None disappear and none are added. That is why a reaction equation has the same number of atoms of each kind on both sides.

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: "2 H₂ + O₂ → 2 H₂O. How many hydrogen atoms are on the left?"
    params: { unit: atoms }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: coefficient
        text: The large 2 in front doubles the whole H₂ molecule.
    hints:
      - "2 H₂ means H₂ twice."
    explanation: 2 · 2 = 4 hydrogen atoms. On the right, 2 H₂O also has 4.

  - kind: problem
    id: ausgleichen
    widget: numeric
    prompt: "N₂ + ? H₂ → 2 NH₃. Which number goes in front of H₂?"
    params: { placeholder: "Number" }
    answer: { value: 3 }
    hints:
      - On the right there are 2 · 3 = 6 hydrogen atoms.
    explanation: 3 H₂ gives 6 hydrogen atoms, as many as in 2 NH₃.

srs:
  cards_from: [zaehlen, ausgleichen]
