id: sci.chemistry.home
type: concept
title: Chemistry at home
summary: Fizzing, rusting, not mixing.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: natron
    widget: choice
    prompt: Baking soda and vinegar fizz fiercely together. Which gas forms?
    params:
      options:
        - { label: Carbon dioxide, correct: true }
        - { label: Oxygen, feedback: "The bubbles even put out a candle. Oxygen would feed it." }
        - { label: Hydrogen, feedback: "That would take a metal and an acid." }
    hints:
      - The same gas is in sparkling water.
    explanation: Acid plus baking soda gives CO₂. This is also how baking powder makes dough rise.

  - kind: problem
    id: mischen
    widget: choice
    prompt: Why must you never mix a chlorine cleaner with an acidic cleaner?
    params:
      options:
        - { label: It releases toxic chlorine gas., correct: true }
        - { label: The cleaners just cancel each other out., feedback: "Worse. A toxic gas forms." }
    hints:
      - What is hiding in the name "chlorine cleaner"?
    explanation: Acid frees chlorine gas from the chlorine cleaner. It attacks the lungs.

  - kind: problem
    id: rost
    widget: buckets
    prompt: Does the iron rust?
    params:
      buckets: [{ label: rusts }, { label: does not rust }]
      items:
        - { label: Nail in damp air, bucket: rusts }
        - { label: Bike often left in the rain, bucket: rusts }
        - { label: Nail in dry oil, bucket: does not rust }
        - { label: Nail in a vacuum, bucket: does not rust }
    hints:
      - Rust needs water and oxygen.
    explanation: Without water or without oxygen, iron does not rust.

  - kind: problem
    id: essig
    widget: numeric
    prompt: Vinegar contains 5% acid. How many milliliters of acid are in {{v}} ml of vinegar?
    params: { unit: ml }
    answer: { value: "{{v * 5 / 100}}" }
    hints:
      - "5% of {{v}}."
    explanation: "{{v}} · 0.05 = {{v * 5 / 100}} ml."
    variants:
      params: { v: "choice[200,500,1000]" }
      defaults: { v: 500 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Why does cake batter rise with baking powder?
    params:
      options:
        - label: Acid and bicarbonate in the powder react and release CO₂
          correct: true
        - label: Heat expands the flour
          feedback: Flour hardly expands – it is gas bubbles.
        - label: Yeast in the powder breathes
          feedback: That would be yeast. Baking powder is pure chemistry.
    hints:
      - The same reaction as bicarbonate and vinegar – just slower.
    explanation: The gas bubbles get trapped in the batter while baking.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Acidic or basic – which cleaner is which?
    params:
      buckets:
        - id: b1
          label: acidic
        - id: b2
          label: basic
      items:
        - label: Descaler
          bucket: b1
        - label: Vinegar cleaner
          bucket: b1
        - label: Toilet cleaner
          bucket: b1
        - label: Drain cleaner
          bucket: b2
        - label: Oven cleaner
          bucket: b2
        - label: Soft soap
          bucket: b2
    hints:
      - Limescale is removed with acid, grease with lye.
      - Drains and ovens are full of grease.
    explanation: Acids dissolve limescale and urine scale. Lyes break down grease and hair.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Why do limescale stains vanish when you put vinegar on them?
    params:
      options:
        - label: The acid reacts with the limescale to form a soluble salt and CO₂
          correct: true
        - label: Vinegar just dilutes the limescale
          feedback: Limescale barely dissolves in water – only the acid breaks it down.
        - label: Vinegar melts the limescale
          feedback: Limescale only melts above 800 °C.
    hints:
      - "Look closely: tiny bubbles form."
      - Limescale is calcium carbonate. With acid, a gas forms.
    explanation: CaCO₃ + 2 H⁺ → Ca²⁺ + H₂O + CO₂. The bubbles are CO₂.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: order
    prompt: What happens to baking powder in a cake? Put it in order.
    params:
      items:
        - label: The batter is mixed
        - label: Moisture dissolves acid and baking soda
        - label: They react to form CO₂ bubbles
        - label: Heat expands the bubbles
        - label: The batter sets and the holes stay
    hints:
      - Without water the powder does not react.
      - At the very end the solid structure holds the shape.
    explanation: Dry in its packet, baking powder stays calm. Only water and heat make the cake fluffy.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does a bike rust faster by the sea than in the mountains?
    params:
      options:
        - label: Salt water conducts electricity and so speeds up the reaction of iron with oxygen
          correct: true
        - label: Salt eats iron directly
          feedback: Salt itself does not react with iron.
        - label: There is more oxygen by the sea
          feedback: The oxygen content is almost the same everywhere.
    hints:
      - Rusting is an electrochemical process – electrons must travel.
    explanation: Rust is a **redox reaction**. Ions in the water close the circuit.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what happens to the atoms in a chemical reaction?"
    params:
      keywords:
        - - atom
        - - neu
          - ordnen
          - umordnen
          - rearrange
          - new
          - verbind
          - combine
          - bond
        - - verlor
          - verschwind
          - erhalten
          - bleib
          - lost
          - disappear
          - conserved
          - remain
          - same
      sample: The atoms rearrange into different substances. No atom is lost and none is added – their number remains the same.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Chlorine bleach contains hypochlorite. When it meets acid, **chlorine gas** forms: $\\mathrm{OCl^- + Cl^- + 2\\,H^+ \\to Cl_2 + H_2O}$. Even a little of it burns the lungs."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: "In the equation OCl⁻ + Cl⁻ + 2 H⁺ → Cl₂ + H₂O: what is the total charge on the left?"
    answer:
      value: 0
    feedback:
      - when: numval(state.input) == 2
        misconception: charge-partial
        text: The two negative charges count too.
      - when: numval(state.input) == -2
        misconception: charge-partial
        text: The two H⁺ bring two positive charges.
    hints:
      - "Count: −1, −1 and twice +1."
      - On the right, Cl₂ and H₂O carry no charge.
    explanation: −1 − 1 + 2 = 0. The charge must balance on both sides too.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Drain cleaner granules contain lye and grains of aluminium. Why does it bubble in the drain?
    params:
      options:
        - label: Aluminium reacts with the lye – producing hydrogen and heat
          correct: true
        - label: Chlorine gas forms
          feedback: There is no chlorine in the granules.
        - label: CO₂ forms
          feedback: That would need carbonate and acid.
    hints:
      - Aluminium is a reactive metal.
      - The gas burns with a pop.
    explanation: The bubbles stir up the gunk, and the heat helps the lye break down grease. Hydrogen is flammable – so no open flames!
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: numeric
    prompt: "Baking soda breaks down when baking: 2 NaHCO₃ → Na₂CO₃ + H₂O + CO₂. How many CO₂ molecules form from {{2 * k}} NaHCO₃?"
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 * k
        misconception: ratio-ignored
        text: The equation needs two NaHCO₃ for one CO₂.
    hints:
      - "Read the ratio: 2 NaHCO₃ to 1 CO₂."
      - Divide {{2 * k}} by 2.
    explanation: "Every two NaHCO₃ give one CO₂: {{2 * k}} ÷ 2 = {{k}}."
    difficulty: 3
    variants:
      params:
        k: int[2,12]
      defaults:
        k: 5

srs:
  cards_from: [mischen, rost]
