id: sci.chemistry.home
type: concept
title: Chemistry at home
summary: Fizzing, rusting, not mixing.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: natron
    widget: choice
    prompt: Baking soda and vinegar fizz fiercely together. Which gas forms?
    params:
      options:
        - { label: Carbon dioxide, correct: true }
        - { label: Oxygen, feedback: "The bubbles even put out a candle. Oxygen would feed it." }
        - { label: Hydrogen, feedback: "That would take a metal and an acid." }
    hints:
      - The same gas is in sparkling water.
    explanation: Acid plus baking soda gives CO₂. This is also how baking powder makes dough rise.

  - kind: problem
    id: mischen
    widget: choice
    prompt: Why must you never mix a chlorine cleaner with an acidic cleaner?
    params:
      options:
        - { label: It releases toxic chlorine gas., correct: true }
        - { label: The cleaners just cancel each other out., feedback: "Worse. A toxic gas forms." }
    hints:
      - What is hiding in the name "chlorine cleaner"?
    explanation: Acid frees chlorine gas from the chlorine cleaner. It attacks the lungs.

  - kind: problem
    id: rost
    widget: buckets
    prompt: Does the iron rust?
    params:
      buckets: [{ label: rusts }, { label: does not rust }]
      items:
        - { label: Nail in damp air, bucket: rusts }
        - { label: Bike often left in the rain, bucket: rusts }
        - { label: Nail in dry oil, bucket: does not rust }
        - { label: Nail in a vacuum, bucket: does not rust }
    hints:
      - Rust needs water and oxygen.
    explanation: Without water or without oxygen, iron does not rust.

  - kind: problem
    id: essig
    widget: numeric
    prompt: Vinegar contains 5% acid. How many milliliters of acid are in {{v}} ml of vinegar?
    params: { unit: ml }
    answer: { value: "{{v * 5 / 100}}" }
    hints:
      - "5% of {{v}}."
    explanation: "{{v}} · 0.05 = {{v * 5 / 100}} ml."
    variants:
      params: { v: "choice[200,500,1000]" }
      defaults: { v: 500 }

srs:
  cards_from: [mischen, rost]
