id: sci.chemistry.home
type: concept
title: Chemie zu Hause
summary: Sprudeln, rosten, nicht mischen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Labor Küche
    body: "Deine Küche ist ein Labor. Täglich laufen dort **Reaktionen** ab, ohne dass du sie bemerkst. Deck die Karten auf: Was steckt hinter diesen Rätseln aus dem Alltag?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍌
            front: Reife Bananen
            back: Äpfel geben das Gas Ethen ab. Neben ihnen reifen Bananen viel schneller.
          - icon: 🥑
            front: Braune Avocado
            back: Sauerstoff greift das Fruchtfleisch an. Zitronensaft bremst die Reaktion.
          - icon: 🥖
            front: Altes Brot
            back: Brot wird nicht hart, weil es trocknet. Seine Stärke ordnet sich zu Kristallen.
          - icon: 🧊
            front: Kühlpack ohne Strom
            back: Knick ihn, und ein Salz löst sich in Wasser. Das zieht Wärme ab.

  - kind: problem
    id: start-nagel
    widget: choice
    prompt: Ein Eisennagel liegt wochenlang draußen im Regen. Was passiert mit ihm?
    params:
      options:
        - label: Er rostet
          correct: true
        - label: Er schmilzt
          feedback: Dafür müsste er über 1500 °C heiß werden.
        - label: Er bleibt blank
          feedback: Nur an trockener Luft bleibt Eisen lange blank.
    hints:
      - Denk an ein altes Fahrrad, das immer draußen steht.
      - Eisen und Wasser vertragen sich auf Dauer nicht.
    explanation: "Eisen reagiert mit Wasser und Sauerstoff aus der Luft. Dabei entsteht ein neuer Stoff: rotbrauner Rost."

  - kind: problem
    id: rost
    widget: buckets
    prompt: Rostet das Eisen?
    params:
      buckets: [{ label: rostet }, { label: rostet nicht }]
      items:
        - { label: Nagel in feuchter Luft, bucket: rostet }
        - { label: Fahrrad oft im Regen, bucket: rostet }
        - { label: Nagel in trockenem Öl, bucket: rostet nicht }
        - { label: Nagel in einem Vakuum, bucket: rostet nicht }
    hints:
      - Rost braucht Wasser und Sauerstoff.
    explanation: Fehlt Wasser oder Sauerstoff, rostet Eisen nicht.

  - kind: problem
    id: start-sprudel
    widget: choice
    prompt: Sprudelwasser nennt man auch »Wasser mit Kohlensäure«. Welches Gas perlt darin?
    params:
      options:
        - label: Kohlendioxid
          correct: true
        - label: Helium
          feedback: Helium füllt Ballons, aber keine Sprudelflaschen.
        - label: Wasserdampf
          feedback: Dampf entsteht erst beim Kochen. Sprudel perlt auch kalt.
    hints:
      - Der Name »Kohlensäure« verrät es fast.
      - Gesucht ist das Gas mit der Formel CO₂.
    explanation: Im Sprudel ist Kohlendioxid gelöst, kurz CO₂. Öffnest du die Flasche, perlt es heraus.

  - kind: problem
    id: natron
    widget: choice
    prompt: Natron und Essig zusammen sprudeln heftig. Welches Gas entsteht?
    params:
      options:
        - { label: Kohlendioxid, correct: true }
        - { label: Sauerstoff, feedback: "Die Bläschen löschen sogar eine Kerze – Sauerstoff würde sie anfachen." }
        - { label: Wasserstoff, feedback: "Dafür bräuchte es ein Metall und eine Säure." }
    hints:
      - Dasselbe Gas steckt in Sprudelwasser.
    explanation: Säure plus Natron ergibt CO₂ – so geht auch Backpulver auf.

  - kind: problem
    id: mischen
    widget: choice
    prompt: Warum darf man chlorhaltigen Reiniger nie mit saurem Reiniger mischen?
    params:
      options:
        - { label: Es entsteht giftiges Chlorgas., correct: true }
        - { label: Die Reiniger heben sich nur auf., feedback: "Schlimmer – es entsteht ein giftiges Gas." }
    hints:
      - Was steckt im Namen »chlorhaltig«?
    explanation: Säure setzt aus dem Chlorreiniger Chlorgas frei – das greift die Lunge an.

  - kind: problem
    id: essig
    widget: numeric
    prompt: Essig enthält 5 % Säure. Wie viele Milliliter Säure stecken in {{v}} ml Essig?
    params: { unit: ml }
    answer: { value: "{{v * 5 / 100}}" }
    hints:
      - 5 % von {{v}}.
      - 1 % von {{v}} ml sind {{v / 100}} ml. Nimm das mal 5.
    explanation: "{{v}} · 0,05 = {{v * 5 / 100}} ml."
    variants:
      params: { v: "choice[200,500,1000]" }
      defaults: { v: 500 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Warum geht Kuchenteig mit Backpulver auf?
    params:
      options:
        - label: Säure und Natron im Pulver reagieren und setzen CO₂ frei
          correct: true
        - label: Die Hitze dehnt das Mehl aus
          feedback: Mehl dehnt sich kaum aus – es sind Gasblasen.
        - label: Hefepilze im Pulver atmen
          feedback: Das wäre Hefe. Backpulver ist reine Chemie.
    hints:
      - Dieselbe Reaktion wie Natron und Essig – nur langsamer.
    explanation: Die Gasblasen werden beim Backen im Teig eingeschlossen.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Sauer oder basisch – welcher Reiniger ist was?
    params:
      buckets:
        - id: b1
          label: sauer
        - id: b2
          label: basisch
      items:
        - label: Entkalker
          bucket: b1
        - label: Essigreiniger
          bucket: b1
        - label: WC-Reiniger
          bucket: b1
        - label: Rohrreiniger
          bucket: b2
        - label: Backofenreiniger
          bucket: b2
        - label: Schmierseife
          bucket: b2
    hints:
      - Kalk löst man mit Säure, Fett mit Lauge.
      - Rohr und Backofen sind voller Fett.
    explanation: Säuren lösen Kalk und Urinstein. Laugen zerlegen Fett und Haare.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Warum verschwinden Kalkflecken, wenn man Essig darauf gibt?
    params:
      options:
        - label: Die Säure reagiert mit dem Kalk zu einem löslichen Salz und CO₂
          correct: true
        - label: Essig verdünnt den Kalk nur
          feedback: Kalk löst sich in Wasser kaum – erst die Säure zersetzt ihn.
        - label: Essig schmilzt den Kalk
          feedback: Kalk schmilzt erst bei über 800 °C.
    hints:
      - "Schau genau hin: Es bilden sich kleine Bläschen."
      - Kalk ist Calciumcarbonat. Mit Säure entsteht ein Gas.
    explanation: CaCO₃ + 2 H⁺ → Ca²⁺ + H₂O + CO₂. Die Bläschen sind CO₂.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: order
    prompt: Was passiert mit Backpulver im Kuchen? Ordne.
    params:
      items:
        - label: Teig wird angerührt
        - label: Feuchtigkeit löst Säure und Natron
        - label: Beide reagieren zu CO₂-Bläschen
        - label: Hitze dehnt die Bläschen aus
        - label: Der Teig wird fest, die Löcher bleiben
    hints:
      - Ohne Wasser reagiert das Pulver nicht.
      - Ganz am Ende hält das feste Gerüst die Form.
    explanation: Trocken in der Tüte bleibt Backpulver ruhig. Erst Wasser und Hitze machen den Kuchen locker.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum rostet ein Fahrrad am Meer schneller als im Gebirge?
    params:
      options:
        - label: Salzwasser leitet Strom und beschleunigt so die Reaktion von Eisen mit Sauerstoff
          correct: true
        - label: Salz frisst Eisen direkt auf
          feedback: Salz selbst reagiert nicht mit Eisen.
        - label: Am Meer gibt es mehr Sauerstoff
          feedback: Der Sauerstoffgehalt ist überall fast gleich.
    hints:
      - Rosten ist ein elektrochemischer Vorgang – Elektronen müssen wandern.
    explanation: Rost ist eine **Redoxreaktion**. Ionen im Wasser schließen den Stromkreis.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was passiert bei einer chemischen Reaktion mit den Atomen?"
    params:
      keywords:
        - - atom
        - - neu
          - ordnen
          - umordnen
          - rearrange
          - new
          - verbind
          - combine
          - bond
        - - verlor
          - verschwind
          - erhalten
          - bleib
          - lost
          - disappear
          - conserved
          - remain
          - same
      sample: Die Atome ordnen sich neu zu anderen Stoffen. Dabei geht kein Atom verloren und es kommt keins dazu – ihre Zahl bleibt gleich.
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "Chlorreiniger enthält Hypochlorit. Trifft es auf Säure, entsteht **Chlorgas**: $\\mathrm{OCl^- + Cl^- + 2\\,H^+ \\to Cl_2 + H_2O}$. Schon wenig davon verätzt die Lunge."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: "In der Gleichung OCl⁻ + Cl⁻ + 2 H⁺ → Cl₂ + H₂O: Welche Gesamtladung steht links?"
    answer:
      value: 0
    feedback:
      - when: numval(state.input) == 2
        misconception: charge-partial
        text: Die zwei Minusladungen zählen auch.
      - when: numval(state.input) == -2
        misconception: charge-partial
        text: Die zwei H⁺ bringen zwei Plusladungen.
    hints:
      - "Zähle: −1, −1 und zweimal +1."
      - Rechts sind Cl₂ und H₂O ungeladen.
    explanation: −1 − 1 + 2 = 0. Auch die Ladung muss links und rechts gleich sein.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Rohrreiniger-Granulat enthält Lauge und Körnchen aus Aluminium. Warum sprudelt es im Abfluss?
    params:
      options:
        - label: Aluminium reagiert mit der Lauge – dabei entstehen Wasserstoff und Wärme
          correct: true
        - label: Es entsteht Chlorgas
          feedback: Im Granulat ist kein Chlor.
        - label: Es entsteht CO₂
          feedback: Dafür bräuchte es Carbonat und Säure.
    hints:
      - Aluminium ist ein unedles Metall.
      - Das Gas brennt mit einem Knall.
    explanation: Die Bläschen wirbeln den Schmutz auf, die Wärme hilft der Lauge, Fett zu zersetzen. Wasserstoff ist brennbar – also kein offenes Feuer!
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: numeric
    prompt: "Natron zerfällt beim Backen: 2 NaHCO₃ → Na₂CO₃ + H₂O + CO₂. Wie viele CO₂-Moleküle entstehen aus {{2 * k}} NaHCO₃?"
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 * k
        misconception: ratio-ignored
        text: Die Gleichung braucht zwei NaHCO₃ für ein CO₂.
    hints:
      - "Lies das Verhältnis: 2 NaHCO₃ zu 1 CO₂."
      - Teile {{2 * k}} durch 2.
    explanation: "Je zwei NaHCO₃ geben ein CO₂: {{2 * k}} : 2 = {{k}}."
    difficulty: 3
    variants:
      params:
        k: int[2,12]
      defaults:
        k: 5

srs:
  cards_from: [mischen, rost]
