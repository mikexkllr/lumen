id: sci.chemistry.atoms
type: concept
title: Atoms
summary: The building blocks of everything.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Count the protons
    body: "Gold, oxygen, carbon – everything is made of atoms. Their nucleus holds **protons**. Tap cells: each one is a proton. With 1 you have hydrogen, with 6 carbon, with 8 oxygen."
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 3
        cols: 4
        counter: true

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many different elements does chemistry know today?"
    params:
      min: 10
      max: 500
    answer:
      value: 118
      tolerance: 20
    explanation: 118. Only about 90 occur in nature – and everything you have ever seen is made of them.

  - kind: explain
    id: s1
    body: |
      Everything is made of **atoms**: a tiny nucleus of protons and neutrons, surrounded by electrons. The number of protons decides which element it is.

  - kind: problem
    id: elektronen
    widget: numeric
    prompt: Carbon has 6 protons. How many electrons does a neutral carbon atom have?
    params: { unit: electrons }
    answer: { value: 6 }
    hints:
      - Neutral means equal amounts of positive and negative charge.
    explanation: 6 protons, 6 electrons. The charges cancel out.

  - kind: problem
    id: symbole
    widget: match
    prompt: Match each symbol to its element.
    params:
      pairs:
        - { left: H, right: Hydrogen }
        - { left: O, right: Oxygen }
        - { left: C, right: Carbon }
        - { left: Na, right: Sodium }
    hints:
      - Some symbols come from Latin. Sodium's symbol comes from its Latin name, natrium.
    explanation: H for hydrogenium, O for oxygenium, C for carboneum.

  - kind: problem
    id: leer
    widget: choice
    prompt: If an atomic nucleus were the size of a soccer ball, how big would the whole atom be?
    params:
      options:
        - { label: As big as a whole city, correct: true }
        - { label: As big as a room, feedback: "Much bigger. The electrons are very far away." }
        - { label: As big as a medicine ball, feedback: "The nucleus is tiny compared with the atom." }
    hints:
      - An atom is about 100,000 times as wide as its nucleus.
    explanation: Atoms are almost entirely empty space, and yet your hand does not fall through the table.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The nucleus holds [[protons]] and neutrons. Around it move the [[electrons]]. The number of protons determines the [[element]].
      distractors:
        - molecules
        - weight

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A sodium ion Na⁺ has 11 protons. How many electrons does it have?
    answer:
      value: 10
    hints:
      - "Singly positive means: one electron is missing."
    explanation: 11 − 1 = 10. An **ion** is an atom with unequal numbers of protons and electrons.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: Atoms of one element always have the same number of protons. The number of neutrons can vary, though. These variants are called **isotopes**. Protons plus neutrons give the mass number.

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: An atom has {{p}} protons and {{n}} neutrons. What is its mass number?
    answer:
      value: "{{p + n}}"
    feedback:
      - when: numval(state.input) == p
        misconception: mass-protons-only
        text: Those are only the protons. The neutrons count too.
    hints:
      - Electrons weigh almost nothing – they do not count.
      - Add {{p}} + {{n}}.
    explanation: "{{p}} + {{n}} = {{p + n}}. Only the nucleus counts for the mass number."
    difficulty: 2
    variants:
      params:
        p: int[3,17]
        k: int[0,2]
      derive:
        n: p + k
      defaults:
        p: 6
        k: 0

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Carbon-12 and carbon-14 are isotopes. How do they differ?
    params:
      options:
        - label: In the number of neutrons
          correct: true
        - label: In the number of protons
          feedback: Then it would no longer be carbon.
        - label: In the number of electrons
          feedback: When neutral, both have six electrons.
    hints:
      - Both are carbon – so the same number of protons.
      - 14 − 6 = 8 neutrons, 12 − 6 = 6 neutrons.
    explanation: C-12 has 6 neutrons, C-14 has 8. Chemically they behave almost the same.
    difficulty: 2

  - kind: problem
    id: ch-d4
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many times heavier than an electron is a proton?"
    params:
      min: 1
      max: 100000
      scale: log
    answer:
      value: 1836
      tolerance: 700
    explanation: About 1836 times. That is why nearly all of an atom's mass sits in the nucleus.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Atoms are almost entirely empty space. Why do you still not fall through the floor?
    params:
      options:
        - label: The electron shells repel – and two electrons may never be in the same state
          correct: true
        - label: The nuclei bump into each other
          feedback: The nuclei never get close – the shells lie between them.
        - label: Gravity holds the floor together
          feedback: Gravity is far too weak for that.
    hints:
      - What is on the very outside of every atom?
    explanation: "Electric repulsion and the **Pauli principle** make matter solid. “Touching” means: shells repel."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: An iron ion has 26 protons, 30 neutrons and a charge of 3+. How many electrons does it have?
    answer:
      value: 23
    feedback:
      - when: numval(state.input) == 26
        misconception: ion-neutral
        text: That is the neutral atom. A 3+ charge means three are missing.
      - when: numval(state.input) == 29
        misconception: ion-sign
        text: Plus means electrons are missing, not added.
    hints:
      - Neutrons play no part in the charge.
      - "Three positive charges are unbalanced: 26 − 3."
    explanation: 26 − 3 = 23 electrons. This is Fe³⁺, as found in rust.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Roughly what share of a carbon atom's mass sits in the nucleus?
    params:
      options:
        - label: Over 99.9%
          correct: true
        - label: About half
          feedback: Six electrons together weigh only about a three-hundredth of a proton.
        - label: About 90%
          feedback: Far more – electrons weigh almost nothing.
    hints:
      - An electron weighs about 1/1836 of a proton.
      - Compare 6 electrons with 12 nuclear particles.
    explanation: The electrons make up only about 0.03% of the mass. The nucleus carries the rest – in a tiny space.
    difficulty: 3

  - kind: explain
    id: ch-x3
    depth: 3
    body: Electrons do not circle on fixed tracks like planets. We can only say where they are likely to be. This region is called an **orbital**.

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: "Explain to Lux: what do all carbon atoms have in common – and how can they differ?"
    params:
      keywords:
        - - proton
        - - neutron
          - isotop
        - - elektron
          - electron
          - ion
          - ladung
          - charge
      sample: All carbon atoms have 6 protons. The number of neutrons can vary – these are isotopes like C-12 and C-14. If an atom gives away electrons, it becomes an ion.
    difficulty: 3

srs:
  cards_from: [elektronen, symbole]
