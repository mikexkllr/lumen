id: sci.chemistry.atoms
type: concept
title: Atoms
summary: The building blocks of everything.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Everything is made of **atoms**: a tiny nucleus of protons and neutrons, surrounded by electrons. The number of protons decides which element it is.

  - kind: problem
    id: elektronen
    widget: numeric
    prompt: Carbon has 6 protons. How many electrons does a neutral carbon atom have?
    params: { unit: electrons }
    answer: { value: 6 }
    hints:
      - Neutral means equal amounts of positive and negative charge.
    explanation: 6 protons, 6 electrons. The charges cancel out.

  - kind: problem
    id: symbole
    widget: match
    prompt: Match each symbol to its element.
    params:
      pairs:
        - { left: H, right: Hydrogen }
        - { left: O, right: Oxygen }
        - { left: C, right: Carbon }
        - { left: Na, right: Sodium }
    hints:
      - Some symbols come from Latin. Sodium's symbol comes from its Latin name, natrium.
    explanation: H for hydrogenium, O for oxygenium, C for carboneum.

  - kind: problem
    id: leer
    widget: choice
    prompt: If an atomic nucleus were the size of a soccer ball, how big would the whole atom be?
    params:
      options:
        - { label: As big as a whole city, correct: true }
        - { label: As big as a room, feedback: "Much bigger. The electrons are very far away." }
        - { label: As big as a medicine ball, feedback: "The nucleus is tiny compared with the atom." }
    hints:
      - An atom is about 100,000 times as wide as its nucleus.
    explanation: Atoms are almost entirely empty space, and yet your hand does not fall through the table.

srs:
  cards_from: [elektronen, symbole]
