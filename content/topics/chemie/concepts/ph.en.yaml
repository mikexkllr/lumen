id: sci.chemistry.ph
type: concept
title: Acidic or basic
summary: The pH value.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Which is more acidic: lemon juice or milk?"
    params:
      options:
        - label: Lemon juice
          correct: true
        - label: Milk
          feedback: Milk tastes mild.
        - label: Both the same
          feedback: Your tongue notices the difference at once.
    hints:
      - Which one makes you pull a face?
    explanation: "How acidic something is, is measured by a number: the pH value."


  - kind: explain
    id: s1
    body: |
      The **pH value** runs from 0 to 14. Below 7 is **acidic**, 7 is neutral, and above 7 is **basic**. Each step is ten times stronger than the next.

  - kind: problem
    id: reihe
    widget: order
    prompt: Order these from acidic to basic.
    params:
      items:
        - { label: Lemon juice }
        - { label: Coffee }
        - { label: Pure water }
        - { label: Soapy water }
    hints:
      - Pure water is neutral.
    explanation: Lemon is about pH 2, coffee 5, water 7, soap about 10.

  - kind: problem
    id: zehnfach
    widget: numeric
    prompt: One solution has pH 3, another pH 5. How many times more acidic is the first?
    params: { unit: "times" }
    answer: { value: 100 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: linear-scale
        text: Each pH step is a factor of 10, not one more.
    hints:
      - Two steps means 10 times 10.
    explanation: 10 · 10 = 100 times more acidic.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Acidic or basic?
    params:
      buckets: [{ label: acidic }, { label: basic }]
      items:
        - { label: Vinegar, bucket: acidic }
        - { label: Cola, bucket: acidic }
        - { label: Stomach acid, bucket: acidic }
        - { label: Baking soda in water, bucket: basic }
        - { label: Drain cleaner, bucket: basic }
    hints:
      - Acids often taste sour. Bases feel slippery, like soap.
    explanation: Drain cleaner is strongly basic and dissolves grease and hair.

  - kind: problem
    id: c1
    widget: match
    prompt: Which pH roughly fits?
    params:
      pairs:
        - left: Stomach acid
          right: pH 1–2
        - left: Lemon juice
          right: pH 2–3
        - left: Pure water
          right: pH 7
        - left: Soap
          right: pH 9–10
        - left: Drain cleaner
          right: pH 14
    hints:
      - Acidic is below 7, basic above.
    explanation: Very acidic and very basic are both corrosive.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You dilute 10 ml of a solution with pH 2 to 1 litre. What pH does it have afterwards?
    answer:
      value: 4
    hints:
      - Diluted a hundredfold – that is two steps of ten.
    explanation: A hundred times less H⁺ means pH + 2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Blood keeps its pH at 7.4 – even when acid is added. How?
    params:
      options:
        - label: A buffer of carbonic acid and bicarbonate captures H⁺
          correct: true
        - label: Blood contains no acids
          feedback: Metabolism constantly produces acid.
        - label: The water in blood dilutes everything
          feedback: Dilution alone would not suffice.
    hints:
      - A pair of substances that can take up **and** release H⁺.
    explanation: A **buffer** keeps pH stable. A deviation of just 0.4 would be life-threatening.
    difficulty: 3

srs:
  cards_from: [zehnfach, sortieren]
