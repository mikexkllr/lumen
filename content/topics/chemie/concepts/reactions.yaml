id: sci.chemistry.reactions
type: concept
title: Nichts geht verloren
summary: Reaktionen und Gleichungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Atome tauschen Partner
    body: Toast wird braun, Holz brennt, Eisen rostet – überall tauschen Atome ihre Partner. Das ist eine **Reaktion**. Deck die Karten der Reihe nach auf und verfolge, was im Toaster passiert.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🍞
            front: Kaltes Brot
            back: Im Brot stecken Zucker und Eiweiß, ihre Atome fest verbunden.
          - icon: 🔥
            front: Hitze
            back: Die Wärme rüttelt die Moleküle durch, Bindungen reißen auf.
          - icon: 🔄
            front: Neue Partner
            back: Die Atome ordnen sich neu und bilden ganz neue Stoffe.
          - icon: 😋
            front: Braun und duftend
            back: "Röstaromen und braune Farbe: Kein Atom ist verschwunden, alle sind nur neu sortiert."

  - kind: problem
    id: start-neu
    widget: choice
    prompt: Bei einer Reaktion entstehen neue Stoffe. Wo passiert das?
    params:
      options:
        - label: Ein Streichholz brennt ab
          correct: true
        - label: Ein Blatt Papier wird zerrissen
          feedback: Die Schnipsel sind immer noch Papier. Es ist kein neuer Stoff entstanden.
        - label: Wasser wird in ein Glas gegossen
          feedback: Das Wasser bleibt Wasser. Es wechselt nur den Ort.
    hints:
      - Wo kannst du den Vorgang nicht einfach rückgängig machen?
      - Aus dem Holz des Streichholzes werden Asche und Rauch.
    explanation: "Beim Verbrennen wird aus Holz etwas ganz anderes: Asche und Gase. Das ist eine Reaktion."

  - kind: problem
    id: holz
    widget: choice
    prompt: Ein Holzscheit verbrennt, übrig bleibt etwas Asche. Wo ist der Rest der Masse?
    params:
      options:
        - { label: In Gasen wie CO₂ und Wasserdampf, correct: true }
        - { label: Er wurde vernichtet, feedback: "Bei chemischen Reaktionen geht keine Masse verloren." }
        - { label: Im Licht der Flamme, feedback: "Das Licht trägt Energie, aber praktisch keine Masse." }
    hints:
      - Was steigt über einem Feuer auf?
    explanation: Die Atome des Holzes stecken nun in Gasen, die in die Luft gehen.

  - kind: explain
    id: s2
    body: |
      Bei einer **Reaktion** ordnen sich Atome neu. Keins verschwindet, keins kommt dazu. Darum hat eine Reaktionsgleichung links und rechts gleich viele Atome jeder Sorte.

  - kind: problem
    id: start-doppelt
    widget: numeric
    prompt: Ein Molekül H₂ besteht aus 2 Wasserstoffatomen. Wie viele Atome sind es in zwei Molekülen H₂?
    params:
      unit: Atome
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: one-molecule
        text: Das ist ein Molekül. Gefragt sind zwei davon.
    hints:
      - Jedes Molekül bringt 2 Atome mit.
      - Rechne 2 · 2.
    explanation: "2 Moleküle mit je 2 Atomen sind 4 Atome. In der Chemie schreibt man dafür kurz: 2 H₂."

  - kind: problem
    id: zaehlen
    widget: numeric
    prompt: "2 H₂ + O₂ → 2 H₂O. Wie viele Wasserstoffatome stehen links?"
    params: { unit: Atome }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: coefficient
        text: Die große 2 davor verdoppelt das ganze H₂-Molekül.
    hints:
      - "2 H₂ heißt zweimal H₂."
    explanation: 2 · 2 = 4 Wasserstoffatome – rechts in 2 H₂O ebenfalls 4.

  - kind: problem
    id: start-rechts
    widget: numeric
    prompt: 2 H₂ + O₂ → 2 H₂O. Wie viele Wasserstoffatome stehen rechts?
    params:
      unit: Atome
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: coefficient
        text: Die große 2 davor gilt für das ganze Molekül H₂O.
      - when: numval(state.input) == 6
        misconception: counted-all-atoms
        text: Zähl nur die H-Atome, nicht das O.
    hints:
      - "Rechts steht 2 H₂O: zweimal ein Wassermolekül."
      - In jedem H₂O stecken 2 H-Atome. Rechne 2 · 2.
    explanation: Auch rechts sind es 4 Wasserstoffatome. Links 4, rechts 4 – so muss es bei jeder Gleichung sein.

  - kind: problem
    id: ausgleichen
    widget: numeric
    prompt: "N₂ + ? H₂ → 2 NH₃. Welche Zahl gehört vor H₂?"
    params: { placeholder: "Zahl" }
    answer: { value: 3 }
    hints:
      - Rechts stehen 2 · 3 = 6 Wasserstoffatome.
      - Jedes H₂ bringt 2 Atome mit. Wie viele H₂ ergeben 6 Atome?
    explanation: 3 H₂ liefert 6 Wasserstoffatome – genauso viele wie in 2 NH₃.

  - kind: problem
    id: c1
    depth: 2
    widget: order
    prompt: "Gleiche aus: Methan verbrennt. Ordne die Überlegung."
    params:
      items:
        - label: CH₄ + O₂ → CO₂ + H₂O (noch unausgeglichen)
        - label: 4 H links brauchen 2 H₂O rechts.
        - label: Rechts stehen jetzt 4 O.
        - label: "Also 2 O₂ links: CH₄ + 2 O₂ → CO₂ + 2 H₂O"
    hints:
      - Erst C, dann H, zuletzt O ausgleichen.
    explanation: Sauerstoff kommt zuletzt, weil er in mehreren Stoffen steckt.
    difficulty: 2

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Gleiche aus: 2 Fe + ? O₂ … nein, mit ganzen Zahlen: 4 Fe + ? O₂ → 2 Fe₂O₃. Welche Zahl gehört vor O₂?"
    answer:
      value: 3
    hints:
      - Rechts stehen 2 · 3 = 6 Sauerstoffatome.
    explanation: 3 O₂ liefern 6 O. So entsteht Rost.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: tiles
    prompt: "Methan verbrennt: _ CH₄ + _ O₂ → _ CO₂ + _ H₂O. Lege die vier Faktoren der Reihe nach."
    params:
      tiles:
        - "1"
        - "1"
        - "2"
        - "2"
        - "3"
        - "4"
      slots: 4
    answer:
      sequence:
        - "1"
        - "2"
        - "1"
        - "2"
    hints:
      - Ein C links gibt ein CO₂ rechts. Vier H geben zwei H₂O.
      - Rechts stehen jetzt 2 + 2 = 4 O-Atome. Wie viele O₂ sind das?
    explanation: "CH₄ + 2 O₂ → CO₂ + 2 H₂O. Links und rechts: 1 C, 4 H, 4 O."
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: "Propan verbrennt im Gasgrill: C₃H₈ + ? O₂ → 3 CO₂ + 4 H₂O. Welche Zahl gehört vor O₂?"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 10
        misconception: atoms-vs-molecules
        text: Zehn sind die O-Atome. Jedes O₂ bringt zwei davon.
    hints:
      - "Zähle die O-Atome rechts: in 3 CO₂ und in 4 H₂O."
      - 6 + 4 = 10 O-Atome. Wie viele O₂-Moleküle?
    explanation: Rechts stehen 10 O-Atome, also 5 O₂.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: swipe
    prompt: Echte Reaktion – oder ändert sich nur der Zustand?
    params:
      cards:
        - text: Eis schmilzt.
          right: false
          why: Es bleibt Wasser, nur flüssig.
        - text: Holz verbrennt.
          right: true
          why: Es entstehen CO₂ und Wasser.
        - text: Zucker löst sich im Tee.
          right: false
          why: Dampft man ein, ist der Zucker wieder da.
        - text: Ein Ei wird beim Kochen fest.
          right: true
          why: Die Eiweiße verändern sich dauerhaft.
        - text: Wasser verdampft.
          right: false
          why: Dampf ist immer noch H₂O.
        - text: Eisen rostet.
          right: true
          why: "Es entsteht ein neuer Stoff: Eisenoxid."
      left: nur Zustand
      right: Reaktion
    explanation: Bei einer Reaktion entsteht ein neuer Stoff. Beim Schmelzen, Lösen und Verdampfen bleibt der Stoff derselbe.
    difficulty: 2

  - kind: problem
    id: ch-d4
    depth: 2
    widget: numeric
    prompt: "{{c}} g Kohlenstoff verbrennen mit {{o}} g Sauerstoff vollständig zu CO₂. Wie viel Gramm CO₂ entstehen?"
    params:
      unit: g
    answer:
      value: "{{11 * k}}"
    hints:
      - Keine Masse geht verloren, keine kommt dazu.
      - Addiere beide Massen.
    explanation: "{{c}} g + {{o}} g = {{11 * k}} g. Die Masse bleibt erhalten."
    difficulty: 2
    variants:
      params:
        k: int[1,9]
      derive:
        c: 3 * k
        o: 8 * k
      defaults:
        k: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Bei der Fotosynthese gilt: 6 CO₂ + 6 H₂O → C₆H₁₂O₆ + ? O₂. Welche Zahl fehlt?"
    answer:
      value: 6
    hints:
      - Links stehen 12 + 6 = 18 O. Der Zucker bindet 6 davon.
    explanation: "12 O bleiben übrig: 6 O₂. Jedes Sauerstoffmolekül, das du atmest, stammt aus dieser Reaktion."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: Antoine Lavoisier wog um 1775 Stoffe vor und nach Reaktionen – in geschlossenen Gefäßen. Die Masse blieb immer gleich. Das ist das Gesetz der **Massenerhaltung**.

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Eine Kerze brennt in einem fest verschlossenen Glas, das auf einer Waage steht. Was zeigt die Waage danach?
    params:
      options:
        - label: Genau dasselbe wie vorher
          correct: true
        - label: Weniger, denn das Wachs ist weg
          feedback: Das Wachs ist zu CO₂ und Wasser geworden – und die bleiben im Glas.
        - label: Mehr, denn Rauch kommt dazu
          feedback: Der Rauch entsteht aus Stoffen, die schon im Glas waren.
    hints:
      - Kann etwas aus dem Glas hinaus oder hinein?
      - Die Atome ordnen sich nur neu.
    explanation: Im geschlossenen Glas bleibt jedes Atom drin. Offen verliert die Kerze Masse, weil die Gase entweichen.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: numeric
    prompt: "Ethan verbrennt: 2 C₂H₆ + ? O₂ → 4 CO₂ + 6 H₂O. Welche Zahl gehört vor O₂?"
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 14
        misconception: atoms-vs-molecules
        text: Vierzehn sind die O-Atome, nicht die O₂-Moleküle.
    hints:
      - "Zähle die O-Atome rechts: 4 · 2 + 6 · 1."
      - 14 O-Atome stecken in 7 O₂.
    explanation: "Rechts sind 8 + 6 = 14 O-Atome, also 7 O₂. Darum verdoppelt man hier alles: mit einem C₂H₆ bräuchte man 3,5 O₂."
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man eine Reaktionsgleichung ausgleichen muss.
    params:
      keywords:
        - - atom
        - - verschwind
          - verloren
          - erhalt
          - gleich viel
          - lost
          - conserv
          - disappear
          - same number
        - - links
          - rechts
          - seite
          - left
          - right
          - side
      sample: Bei einer Reaktion verschwindet kein Atom, es kommt auch keins dazu. Die Atome ordnen sich nur neu. Darum müssen links und rechts von jeder Sorte gleich viele Atome stehen.
    difficulty: 3

srs:
  cards_from: [zaehlen, ausgleichen]
