id: sci.chemistry.molecules
type: concept
title: Molecules
summary: Reading formulas.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: One atom more
    body: "Water, sugar, air: atoms join up to form **molecules**. A single extra atom can change everything. Flip the cards and see what one O atom does."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🫧
            front: O₂ or O₃?
            back: You breathe in two O atoms. Three O atoms make ozone – it irritates the lungs.
          - icon: 🥤
            front: CO₂ or CO?
            back: CO₂ fizzes in lemonade. With one O fewer, it becomes poisonous carbon monoxide.
          - icon: 💇
            front: H₂O or H₂O₂?
            back: One extra O, and water turns into a hair bleach.
          - icon: 🍬
            front: Same atoms, new order
            back: Glucose and fructose share one formula – yet they differ in sweetness.

  - kind: problem
    id: start-o2
    widget: numeric
    prompt: How many O atoms are in one particle of O₂?
    body: The air you breathe contains oxygen as O₂. The O stands for one oxygen atom.
    params:
      unit: atoms
    answer:
      value: 2
    hints:
      - Look at the small number after the O.
      - "The intro says: you breathe in two O atoms."
    explanation: "The small 2 says: two O atoms are joined together. Such a particle is called a molecule."

  - kind: problem
    id: wasser
    widget: numeric
    prompt: How many atoms does a water molecule H₂O have?
    params: { unit: atoms }
    answer: { value: 3 }
    hints:
      - The small 2 belongs to the H.
    explanation: Two hydrogen atoms and one oxygen atom.

  - kind: explain
    id: s2
    body: |
      Atoms join to form **molecules**. The small number in a formula tells you how often the atom before it appears. If there is no number, it appears once.

  - kind: problem
    id: start-co2
    widget: numeric
    prompt: Carbon dioxide has the formula CO₂. How many atoms does one molecule have in total?
    params:
      unit: atoms
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 2
        misconception: subscript-scope
        text: The 2 belongs only to the O. One C comes on top.
    hints:
      - There is no number after the C – so it is one C atom.
      - "One C and two O: add them up."
    explanation: 1 carbon atom + 2 oxygen atoms = 3 atoms.

  - kind: problem
    id: zucker
    widget: numeric
    prompt: Glucose has the formula C₆H₁₂O₆. How many atoms is that in total?
    params: { unit: atoms }
    answer: { value: 24 }
    hints:
      - 6 + 12 + 6.
    explanation: 6 carbon, 12 hydrogen, 6 oxygen. That makes 24 in total.

  - kind: problem
    id: namen
    widget: match
    prompt: Match each formula to its substance.
    params:
      pairs:
        - { left: "H₂O", right: Water }
        - { left: "CO₂", right: Carbon dioxide }
        - { left: "NaCl", right: Table salt }
        - { left: "O₂", right: Oxygen gas }
    hints:
      - Na stands for sodium, Cl for chlorine.
    explanation: Table salt is sodium chloride, with sodium and chlorine in a 1 to 1 ratio.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: CO₂ consists of one carbon and two oxygen atoms.
          right: true
        - text: H₂O₂ is the same as H₂O.
          right: false
          why: Hydrogen peroxide has one more oxygen atom – and bleaches hair.
        - text: O₂ is a molecule of two identical atoms.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How many atoms are in **three** molecules of ammonia, 3 NH₃?
    answer:
      value: 12
    hints:
      - One molecule has 4 atoms. The large 3 applies to the whole molecule.
    explanation: 3 · 4 = 12. The large number in front counts molecules, the small one behind counts atoms.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: choice
    prompt: What is the difference between 2 H and H₂?
    params:
      options:
        - label: 2 H are two separate atoms, H₂ is one molecule made of two atoms
          correct: true
        - label: No difference
          feedback: Both count two atoms – but only in H₂ are they joined.
        - label: H₂ is two molecules
          feedback: The small number counts atoms inside one molecule.
    hints:
      - The small number belongs to the molecule.
      - The big number in front counts particles.
    explanation: The big number counts particles, the small number counts atoms in each particle.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: buckets
    prompt: Element or compound? An element contains only one kind of atom.
    params:
      buckets:
        - id: b1
          label: Element
        - id: b2
          label: Compound
      items:
        - label: O₂
          bucket: b1
        - label: N₂
          bucket: b1
        - label: O₃ (ozone)
          bucket: b1
        - label: H₂O
          bucket: b2
        - label: CO₂
          bucket: b2
        - label: CH₄
          bucket: b2
    hints:
      - Count the different element symbols.
      - O₃ has three atoms – but all are oxygen.
    explanation: O₂, N₂ and O₃ are molecules, but elements. H₂O, CO₂ and CH₄ combine two kinds of atom.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: A fire produces {{k}} CO₂ and {{m}} H₂O. How many oxygen atoms is that in total?
    answer:
      value: "{{2 * k + m}}"
    feedback:
      - when: numval(state.input) == k + m
        misconception: subscript-ignored
        text: Each CO₂ has two O atoms.
    hints:
      - CO₂ has 2 O, H₂O has 1 O.
      - Work out {{k}} · 2 + {{m}} · 1.
    explanation: "{{k}} · 2 + {{m}} = {{2 * k + m}} oxygen atoms."
    difficulty: 2
    variants:
      params:
        k: int[1,6]
        m: int[1,6]
      defaults:
        k: 3
        m: 4

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ethanol and dimethyl ether both have the formula C₂H₆O. One is drinking alcohol, the other a gas. How can that be?
    params:
      options:
        - label: The atoms are connected differently – structure decides
          correct: true
        - label: One of the formulas must be wrong
          feedback: Both are right. The molecular formula does not tell everything.
        - label: They have different isotopes
          feedback: Isotopes hardly change the chemistry.
    hints:
      - The same building blocks, put together differently.
    explanation: Such substances are called **isomers**. That is why chemists draw structural formulas.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Slaked lime has the formula Ca(OH)₂. The 2 applies to the whole bracket. How many atoms are in one formula unit?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: bracket-partial
        text: The O is in the bracket too – it counts twice.
    hints:
      - The bracket holds O and H.
      - 1 Ca + 2 · (1 O + 1 H).
    explanation: "1 + 2 · 2 = 5 atoms: one Ca, two O, two H."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: Aluminium sulfate has the formula Al₂(SO₄)₃. How many atoms are in one formula unit?
    answer:
      value: 17
    feedback:
      - when: numval(state.input) == 7
        misconception: bracket-ignored
        text: The 3 after the bracket applies to everything inside.
    hints:
      - One SO₄ group has 5 atoms.
      - 2 Al + 3 · 5.
    explanation: 2 + 3 · 5 = 17 atoms.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: "Glucose C₆H₁₂O₆ and acetic acid C₂H₄O₂ are very different substances. Which C : H : O ratio do both share?"
    params:
      options:
        - label: "1 : 2 : 1"
          correct: true
        - label: "6 : 12 : 6"
          feedback: That is only the sugar – reduce the numbers.
        - label: "2 : 4 : 2"
          feedback: That fits the acetic acid – reduce further.
    hints:
      - Divide all three numbers by the same number.
      - Sugar by 6, acetic acid by 2.
    explanation: Both have the empirical formula CH₂O. The ratio alone does not tell you which substance it is.
    difficulty: 3

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: 'Explain to Lux: in "3 H₂O", what does the big 3 mean – and what does the small 2 mean?'
    params:
      keywords:
        - - molekül
          - molecule
          - teilchen
          - particle
        - - atom
        - - wasserstoff
          - hydrogen
          - zwei
          - two
      sample: "The big 3 counts molecules: three water particles. The small 2 counts the hydrogen atoms in each molecule. Together that makes 6 H atoms."
    difficulty: 3

srs:
  cards_from: [zucker, namen]
