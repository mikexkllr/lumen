id: sci.chemistry.atoms
type: concept
title: Atome
summary: Die Bausteine von allem.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele verschiedene Elemente kennt die Chemie heute?"
    params:
      min: 10
      max: 500
    answer:
      value: 118
      tolerance: 20
    explanation: 118. Nur etwa 90 kommen in der Natur vor – und aus ihnen besteht alles, was du je gesehen hast.


  - kind: explain
    id: s1
    body: |
      Alles besteht aus **Atomen**: einem winzigen Kern aus Protonen und Neutronen, umgeben von Elektronen. Die Zahl der Protonen bestimmt, welches Element es ist.

  - kind: problem
    id: elektronen
    widget: numeric
    prompt: Kohlenstoff hat 6 Protonen. Wie viele Elektronen hat ein neutrales Kohlenstoffatom?
    params: { unit: Elektronen }
    answer: { value: 6 }
    hints:
      - Neutral heißt – gleich viele positive und negative Ladungen.
    explanation: 6 Protonen, 6 Elektronen – die Ladungen heben sich auf.

  - kind: problem
    id: symbole
    widget: match
    prompt: Verbinde Symbol und Element.
    params:
      pairs:
        - { left: H, right: Wasserstoff }
        - { left: O, right: Sauerstoff }
        - { left: C, right: Kohlenstoff }
        - { left: Na, right: Natrium }
    hints:
      - Manche Symbole kommen aus dem Lateinischen – Natrium heißt dort Natrium.
    explanation: H für Hydrogenium, O für Oxygenium, C für Carboneum.

  - kind: problem
    id: leer
    widget: choice
    prompt: Wäre ein Atomkern so groß wie ein Fußball – wie groß wäre dann das ganze Atom?
    params:
      options:
        - { label: So groß wie eine ganze Stadt, correct: true }
        - { label: So groß wie ein Zimmer, feedback: "Viel größer – die Elektronen sind sehr weit weg." }
        - { label: So groß wie ein Medizinball, feedback: "Der Kern ist winzig im Vergleich zum Atom." }
    hints:
      - Ein Atom ist etwa 100 000-mal so groß wie sein Kern.
    explanation: Atome sind fast völlig leer – und trotzdem fällt deine Hand nicht durch den Tisch.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Im Kern sitzen [[Protonen]] und Neutronen. Außen herum bewegen sich die [[Elektronen]]. Die Zahl der Protonen bestimmt das [[Element]].
      distractors:
        - Moleküle
        - Gewicht

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Natrium-Ion Na⁺ hat 11 Protonen. Wie viele Elektronen hat es?
    answer:
      value: 10
    hints:
      - "Einfach positiv heißt: ein Elektron fehlt."
    explanation: 11 − 1 = 10. Ein **Ion** ist ein Atom mit ungleicher Zahl von Protonen und Elektronen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Atome sind fast nur leerer Raum. Warum fällst du trotzdem nicht durch den Boden?
    params:
      options:
        - label: Die Elektronenhüllen stoßen sich ab – und zwei Elektronen dürfen nie im selben Zustand sein
          correct: true
        - label: Die Atomkerne stoßen aneinander
          feedback: Die Kerne kommen sich nie nahe – dazwischen liegen die Hüllen.
        - label: Die Schwerkraft hält den Boden zusammen
          feedback: Die Schwerkraft ist dafür viel zu schwach.
    hints:
      - Was befindet sich ganz außen an jedem Atom?
    explanation: "Elektrische Abstoßung und das **Pauli-Prinzip** machen Materie fest. »Berühren« heißt: Hüllen stoßen sich ab."
    difficulty: 3

srs:
  cards_from: [elektronen, symbole]
