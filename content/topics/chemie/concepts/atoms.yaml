id: sci.chemistry.atoms
type: concept
title: Atome
summary: Die Bausteine von allem.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele verschiedene Elemente kennt die Chemie heute?"
    params:
      min: 10
      max: 500
    answer:
      value: 118
      tolerance: 20
    explanation: 118. Nur etwa 90 kommen in der Natur vor – und aus ihnen besteht alles, was du je gesehen hast.

  - kind: explain
    id: s1
    body: |
      Alles besteht aus **Atomen**: einem winzigen Kern aus Protonen und Neutronen, umgeben von Elektronen. Die Zahl der Protonen bestimmt, welches Element es ist.

  - kind: problem
    id: elektronen
    widget: numeric
    prompt: Kohlenstoff hat 6 Protonen. Wie viele Elektronen hat ein neutrales Kohlenstoffatom?
    params: { unit: Elektronen }
    answer: { value: 6 }
    hints:
      - Neutral heißt – gleich viele positive und negative Ladungen.
    explanation: 6 Protonen, 6 Elektronen – die Ladungen heben sich auf.

  - kind: problem
    id: symbole
    widget: match
    prompt: Verbinde Symbol und Element.
    params:
      pairs:
        - { left: H, right: Wasserstoff }
        - { left: O, right: Sauerstoff }
        - { left: C, right: Kohlenstoff }
        - { left: Na, right: Natrium }
    hints:
      - Manche Symbole kommen aus dem Lateinischen – Natrium heißt dort Natrium.
    explanation: H für Hydrogenium, O für Oxygenium, C für Carboneum.

  - kind: problem
    id: leer
    widget: choice
    prompt: Wäre ein Atomkern so groß wie ein Fußball – wie groß wäre dann das ganze Atom?
    params:
      options:
        - { label: So groß wie eine ganze Stadt, correct: true }
        - { label: So groß wie ein Zimmer, feedback: "Viel größer – die Elektronen sind sehr weit weg." }
        - { label: So groß wie ein Medizinball, feedback: "Der Kern ist winzig im Vergleich zum Atom." }
    hints:
      - Ein Atom ist etwa 100 000-mal so groß wie sein Kern.
    explanation: Atome sind fast völlig leer – und trotzdem fällt deine Hand nicht durch den Tisch.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Im Kern sitzen [[Protonen]] und Neutronen. Außen herum bewegen sich die [[Elektronen]]. Die Zahl der Protonen bestimmt das [[Element]].
      distractors:
        - Moleküle
        - Gewicht

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Natrium-Ion Na⁺ hat 11 Protonen. Wie viele Elektronen hat es?
    answer:
      value: 10
    hints:
      - "Einfach positiv heißt: ein Elektron fehlt."
    explanation: 11 − 1 = 10. Ein **Ion** ist ein Atom mit ungleicher Zahl von Protonen und Elektronen.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: Atome desselben Elements haben gleich viele Protonen. Die Zahl der Neutronen kann aber schwanken. Solche Varianten heißen **Isotope**. Protonen plus Neutronen ergeben die Massenzahl.

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Ein Atom hat {{p}} Protonen und {{n}} Neutronen. Wie groß ist seine Massenzahl?
    answer:
      value: "{{p + n}}"
    feedback:
      - when: numval(state.input) == p
        misconception: mass-protons-only
        text: Das sind nur die Protonen. Die Neutronen zählen mit.
    hints:
      - Die Elektronen sind fast masselos – sie zählen nicht.
      - Rechne {{p}} + {{n}}.
    explanation: "{{p}} + {{n}} = {{p + n}}. Nur der Kern zählt für die Massenzahl."
    difficulty: 2
    variants:
      params:
        p: int[3,17]
        k: int[0,2]
      derive:
        n: p + k
      defaults:
        p: 6
        k: 0

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: Kohlenstoff-12 und Kohlenstoff-14 sind Isotope. Worin unterscheiden sie sich?
    params:
      options:
        - label: In der Zahl der Neutronen
          correct: true
        - label: In der Zahl der Protonen
          feedback: Dann wäre es kein Kohlenstoff mehr.
        - label: In der Zahl der Elektronen
          feedback: Neutral haben beide sechs Elektronen.
    hints:
      - Beide sind Kohlenstoff – also gleich viele Protonen.
      - 14 − 6 = 8 Neutronen, 12 − 6 = 6 Neutronen.
    explanation: C-12 hat 6 Neutronen, C-14 hat 8. Chemisch verhalten sich beide fast gleich.
    difficulty: 2

  - kind: problem
    id: ch-d4
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wievielmal schwerer als ein Elektron ist ein Proton?"
    params:
      min: 1
      max: 100000
      scale: log
    answer:
      value: 1836
      tolerance: 700
    explanation: Rund 1836-mal. Darum steckt fast die ganze Masse eines Atoms im Kern.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Atome sind fast nur leerer Raum. Warum fällst du trotzdem nicht durch den Boden?
    params:
      options:
        - label: Die Elektronenhüllen stoßen sich ab – und zwei Elektronen dürfen nie im selben Zustand sein
          correct: true
        - label: Die Atomkerne stoßen aneinander
          feedback: Die Kerne kommen sich nie nahe – dazwischen liegen die Hüllen.
        - label: Die Schwerkraft hält den Boden zusammen
          feedback: Die Schwerkraft ist dafür viel zu schwach.
    hints:
      - Was befindet sich ganz außen an jedem Atom?
    explanation: "Elektrische Abstoßung und das **Pauli-Prinzip** machen Materie fest. »Berühren« heißt: Hüllen stoßen sich ab."
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Ein Eisen-Ion hat 26 Protonen, 30 Neutronen und die Ladung 3+. Wie viele Elektronen hat es?
    answer:
      value: 23
    feedback:
      - when: numval(state.input) == 26
        misconception: ion-neutral
        text: "So viele hätte das neutrale Atom. Die Ladung 3+ heißt: drei fehlen."
      - when: numval(state.input) == 29
        misconception: ion-sign
        text: "Plus heißt: Elektronen fehlen, nicht dazugekommen."
    hints:
      - Neutronen spielen für die Ladung keine Rolle.
      - "Drei Plusladungen sind unausgeglichen: 26 − 3."
    explanation: 26 − 3 = 23 Elektronen. Das ist Fe³⁺, wie es in Rost steckt.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Welcher Anteil der Masse eines Kohlenstoffatoms steckt ungefähr im Kern?
    params:
      options:
        - label: Über 99,9 %
          correct: true
        - label: Etwa die Hälfte
          feedback: Sechs Elektronen wiegen zusammen nur so viel wie ein Dreihundertstel Proton.
        - label: Etwa 90 %
          feedback: Viel mehr – Elektronen sind fast masselos.
    hints:
      - Ein Elektron wiegt etwa 1/1836 Proton.
      - Vergleiche 6 Elektronen mit 12 Kernteilchen.
    explanation: Die Elektronen machen nur etwa 0,03 % der Masse aus. Der Kern trägt den Rest – auf winzigem Raum.
    difficulty: 3

  - kind: explain
    id: ch-x3
    depth: 3
    body: Elektronen kreisen nicht auf festen Bahnen wie Planeten. Man kann nur sagen, wo sie sich wahrscheinlich aufhalten. Diesen Aufenthaltsraum nennt man **Orbital**.

  - kind: problem
    id: ch-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was haben alle Kohlenstoffatome gemeinsam – und worin können sie sich unterscheiden?"
    params:
      keywords:
        - - proton
        - - neutron
          - isotop
        - - elektron
          - electron
          - ion
          - ladung
          - charge
      sample: Alle Kohlenstoffatome haben 6 Protonen. Die Zahl der Neutronen kann schwanken, das sind Isotope wie C-12 und C-14. Gibt ein Atom Elektronen ab, wird es zum Ion.
    difficulty: 3

srs:
  cards_from: [elektronen, symbole]
