id: stats.dataviz.axes
type: concept
title: Abgeschnittene Achsen
summary: Wie kleine Unterschiede riesig wirken.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Klein wirkt riesig
    body: "Werbung zeigt gern, wie viel besser ein neues Handy ist. Zieh die rechte Säule ein winziges Stück hoch – sie schießt in die Höhe! Schau auf die Zahlen an der **Achse**: Wo beginnt sie?"
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - alt
          - neu
        values:
          - 20
          - 20
        editable:
          - 1
        min: 19
        max: 22
        step: 0.5
        title: Akkulaufzeit in Stunden

  - kind: problem
    id: wirkung
    widget: choice
    visual:
      widget: chart
      params: { labels: [Firma A, Firma B], values: [98, 100], min: 96, max: 101, title: Kundenzufriedenheit }
    prompt: Wie viel zufriedener sind die Kunden von Firma B wirklich?
    params:
      options:
        - { label: Nur etwa 2 % mehr, correct: true }
        - { label: Etwa doppelt so zufrieden, feedback: "Schau auf die Achse – sie beginnt bei 96, nicht bei 0." }
    hints:
      - Wo beginnt die y-Achse?
    explanation: 98 gegen 100 – die abgeschnittene Achse bläht den Unterschied auf.

  - kind: explain
    id: s2
    body: |
      Säulen müssen **bei null beginnen**, denn ihre Länge steht für die Größe. Bei Liniendiagrammen darf die Achse abgeschnitten sein – solange es klar erkennbar ist.

  - kind: problem
    id: prozent
    widget: numeric
    prompt: Ein Wert steigt von {{a}} auf {{b}}. Um wie viel Prozent ist das?
    params: { unit: "%" }
    answer: { value: "{{(b - a) * 100 / a}}" }
    hints:
      - Zuwachs geteilt durch den Ausgangswert.
    explanation: "({{b}} − {{a}}) : {{a}} = {{(b - a) * 100 / a}} %."
    variants:
      params: { a: "choice[50,100,200]", p: "choice[2,4,5,10]" }
      derive: { b: "a + a * p / 100" }
      defaults: { a: 100, p: 2 }

  - kind: problem
    id: wann
    widget: choice
    prompt: In welchem Fall ist eine Achse, die nicht bei null beginnt, in Ordnung?
    params:
      options:
        - { label: Bei einer Fieberkurve zwischen 36 und 41 °C, correct: true }
        - { label: "Bei Säulen, die Umsätze vergleichen", feedback: "Bei Säulen täuscht die gekürzte Länge immer." }
    hints:
      - Wo ist null gar kein sinnvoller Wert?
    explanation: 0 °C Körpertemperatur ergibt keinen Sinn – hier zählen die kleinen Schwankungen.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Darf die Achse hier abgeschnitten sein?
    params:
      buckets:
        - id: b1
          label: Ja
        - id: b2
          label: Nein – muss bei 0 beginnen
      items:
        - label: Säulendiagramm
          bucket: b2
        - label: Fieberkurve von 36 bis 41 °C
          bucket: b1
        - label: Balkendiagramm
          bucket: b2
        - label: Liniendiagramm mit klarer Achse
          bucket: b1
    hints:
      - Wo steht die Länge für die Größe?
    explanation: Bei Säulen und Balken vergleicht das Auge Längen. Die müssen stimmen.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Diese Achse beginnt bei 90. Stell Säule B so ein, dass sie im Bild doppelt so hoch wirkt wie Säule A.
    params:
      labels:
        - A
        - B
      values:
        - 95
        - 91
      editable:
        - 1
      min: 90
      max: 100
    answer:
      values:
        - 95
        - 100
    hints:
      - Säule A ragt 5 Einheiten über die 90 hinaus.
      - B muss 10 über die 90 ragen – also bis 100.
    explanation: "Im Bild doppelt so hoch, in Wahrheit nur gut 5 % mehr: 100 statt 95. Genau so täuscht eine abgeschnittene **Achse**."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Grafik zeigt Wachstum auf einer **logarithmischen** y-Achse als gerade Linie. Was bedeutet das?
    params:
      options:
        - label: Exponentielles Wachstum – gleichbleibender prozentualer Zuwachs
          correct: true
        - label: Gleichmäßiges Wachstum um einen festen Betrag
          feedback: Das wäre auf einer normalen Achse gerade.
        - label: Kein Wachstum
          feedback: Dann wäre die Linie waagerecht.
    hints:
      - Auf dieser Achse sind 10, 100 und 1000 gleich weit auseinander.
    explanation: Log-Achsen zeigen Wachstums**raten**. Wer das nicht bemerkt, unterschätzt die Zahlen dramatisch.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Zwei Säulen zeigen 95 und 100, die Achse beginnt bei 90. Die eine wirkt doppelt so hoch. Um wie viel Prozent ist der Wert wirklich größer?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 5
      tolerance: 2
    explanation: Nur gut 5 %. Die abgeschnittene Achse macht daraus 100 %.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Die y-Achse beginnt bei {{s}}. Säule A zeigt {{s + d}}, Säule B zeigt {{s + d * f}}. Wievielmal höher **wirkt** B im Bild?
    answer:
      value: "{{f}}"
    feedback:
      - when: abs(numval(state.input) - (s + d * f) / (s + d)) < 0.01
        misconception: real-ratio
        text: Das ist das echte Verhältnis der Werte. Gefragt ist, was das Auge sieht.
    hints:
      - Sichtbar ist nur der Teil über {{s}}.
      - A ragt {{d}} heraus, B ragt {{d * f}} heraus.
    explanation: "Im Bild {{d * f}} : {{d}} = {{f}}-mal. In Wahrheit ist B nur etwa {{round(100 * d * (f - 1) / (s + d))}} % größer."
    difficulty: 2
    variants:
      params:
        s: choice[50,80,90]
        d: int[2,5]
        f: int[2,4]
      defaults:
        s: 90
        d: 5
        f: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Dieselbe Kurve wird einmal sehr breit und flach, einmal schmal und hoch gezeichnet. Was ändert sich?
    params:
      options:
        - label: "Nur der Eindruck: schmal wirkt dramatisch, breit wirkt harmlos"
          correct: true
        - label: Die Steigung der Daten
          feedback: Die Daten sind gleich, nur das Seitenverhältnis ist anders.
        - label: Nichts, auch nicht der Eindruck
          feedback: Das Seitenverhältnis wirkt stark auf das Gefühl.
    hints:
      - Stell dir vor, du drückst das Bild von links und rechts zusammen.
      - Was passiert mit dem Winkel der Linie?
    explanation: "Das **Seitenverhältnis** steuert, wie steil eine Linie aussieht. Eine Faustregel: Wichtige Abschnitte sollen etwa im 45°-Winkel liegen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Zwei Grafiken zeigen dieselben Daten: einmal ab 2019, einmal ab 2021. Die erste zeigt einen Rückgang, die zweite einen Anstieg. Wie heißt dieser Trick?"
    params:
      options:
        - label: Rosinenpicken – der Startpunkt wird passend gewählt
          correct: true
        - label: Runden
          feedback: Die Werte selbst sind unverändert.
        - label: Gewichten
          feedback: Es wird nichts gewichtet, nur ausgeschnitten.
    hints:
      - Wer wählt, wo die Grafik beginnt?
    explanation: "Immer fragen: Warum genau dieser Zeitraum? Der ehrliche Blick zeigt möglichst viel Verlauf."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Auf einer log-Achse liegt 1000 genauso weit über 100 wie 100 über welchem Wert?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == -800
        misconception: linear-thinking
        text: Das wäre eine normale Achse mit gleichen Differenzen.
    hints:
      - Von 100 nach 1000 ist es mal 10.
      - Geh von 100 aus um denselben Faktor zurück.
    explanation: "100 : 10 = 10. Auf log-Achsen sind gleiche Abstände gleiche Faktoren. Darum wird exponentielles Wachstum dort zur Geraden."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Ein Bericht zeigt die Zahlen bis 2019 auf einer Achse von 0 bis 100 – und ab 2020 im selben Bild auf einer Achse von 0 bis 1000. Was ist das?
    params:
      options:
        - label: Ein Skalenwechsel, der den Sprung versteckt
          correct: true
        - label: Eine log-Achse
          feedback: Bei einer log-Achse gilt eine Regel für die ganze Achse.
        - label: Ganz normal, wenn Zahlen wachsen
          feedback: Mitten im Bild die Skala zu wechseln, täuscht.
    hints:
      - Wie sähe der Sprung aus, wenn die Achse gleich bliebe?
      - Eine Achse muss überall dieselbe Regel haben.
    explanation: Ein Wechsel der Skala mitten im Bild lässt einen Zehnfach-Sprung flach aussehen. Gute Grafiken zeigen solche Brüche deutlich oder vermeiden sie.
    difficulty: 3

srs:
  cards_from: [wirkung, wann]
