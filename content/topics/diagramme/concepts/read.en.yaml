id: stats.dataviz.read
type: concept
title: Reading charts accurately
summary: Reading off, comparing, adjusting.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: ablesen
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Mon, Tue, Wed, Thu, Fri], values: [4, 6, 8, 5, 7], min: 0, max: 10, unit: k, title: Visitors }
    prompt: How many thousand visitors came on Wednesday?
    params: { unit: k }
    answer: { value: 8 }
    hints:
      - Follow the bar to the axis.
    explanation: 8,000 visitors, the busiest day.

  - kind: problem
    id: differenz
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Mon, Tue, Wed, Thu, Fri], values: [4, 6, 8, 5, 7], min: 0, max: 10, unit: k, title: Visitors }
    prompt: How many thousand more visitors came on Friday than on Monday?
    params: { unit: k }
    answer: { value: 3 }
    hints:
      - 7 − 4.
    explanation: 3,000 more, almost twice as many.

  - kind: problem
    id: einstellen
    widget: chart
    prompt: Set Saturday so that it has twice as many visitors as Monday.
    params:
      labels: [Mon, Tue, Wed, Thu, Fri, Sat]
      values: [4, 6, 8, 5, 7, 2]
      editable: [5]
      min: 0
      max: 10
    answer: { values: [4, 6, 8, 5, 7, 8] }
    hints:
      - Monday had 4.
    explanation: 2 · 4 = 8, as high as Wednesday.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A line chart shows revenue per month. The value for March is missing; the line connects February directly with April. What is problematic?
    params:
      options:
        - label: The line suggests a measured course where there are no data
          correct: true
        - label: Nothing – that is how it is done
          feedback: A visible gap is better.
        - label: Lines must never be used for revenue
          feedback: For developments they are just right.
    hints:
      - What do we know about March?
    explanation: Missing data should be made visible, not bridged.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: By what percent did visitors rise from Monday to Friday?
    visual:
      widget: chart
      params:
        labels:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
        values:
          - 4
          - 6
          - 8
          - 5
          - 7
          - 8
        max: 10
        unit: k
    params:
      unit: "%"
    answer:
      value: 75
    feedback:
      - when: numval(state.input) == 3
        misconception: points-vs-percent
        text: That is the rise in thousands of visitors. Now divide by Monday.
    hints:
      - Monday 4, Friday 7.
      - Compute 3 ÷ 4.
    explanation: (7 − 4) ÷ 4 = 0.75 = 75 %. Reading the value is step one, the right base step two.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: How many thousand visitors came per day on average? To two decimals.
    visual:
      widget: chart
      params:
        labels:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
        values:
          - 4
          - 6
          - 8
          - 5
          - 7
          - 8
        max: 10
        show:
          - mean
    answer:
      value: 6.33
      tolerance: 0.01
    hints:
      - Add all six bars.
      - 38 ÷ 6.
    explanation: 38 ÷ 6 ≈ 6.33. The mean line in the picture sits exactly there.
    difficulty: 2

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "Two line charts: phone use and short-sightedness in children have both risen since 2005. What can you read from this?"
    params:
      options:
        - label: Only that both grow over time – that alone proves no link
          correct: true
        - label: Everything that rises correlates with everything else that rises.
          feedback: Alles, was steigt, korreliert mit allem, was steigt.
        - label: The picture does not show that direction either.
          feedback: Auch diese Richtung zeigt das Bild nicht.
    hints:
      - What else has risen since 2005?
      - "A shared trend is a third factor: time."
    explanation: Two trends over time almost always correlate. Only data on individual children can show a real link.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: On a logarithmic axis 10, 100 and 1000 are equally far apart. A point lies exactly halfway between 10 and 1000. What is its value?
    params:
      options:
        - label: "100"
          correct: true
        - label: That is the middle on an ordinary axis.
          feedback: Das wäre die Mitte auf einer normalen Achse.
        - label: On a log axis factors count, not differences.
          feedback: Auf der log-Achse zählen Faktoren, nicht Differenzen.
    hints:
      - Each equal step means the same factor.
      - From 10 to 1000 there are two factor-of-ten steps.
    explanation: The middle is 100 – the geometric mean √(10 · 1000). Log axes suit growth and quantities across many powers of ten.
    difficulty: 3

srs:
  cards_from: [differenz, einstellen]
