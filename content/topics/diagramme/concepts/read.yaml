id: stats.dataviz.read
type: concept
title: Diagramme genau lesen
summary: Ablesen, vergleichen, einstellen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: ablesen
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Mo, Di, Mi, Do, Fr], values: [4, 6, 8, 5, 7], min: 0, max: 10, unit: Tsd., title: Besucher }
    prompt: Wie viele tausend Besucher kamen am Mittwoch?
    params: { unit: Tsd. }
    answer: { value: 8 }
    hints:
      - Folge der Säule bis zur Achse.
    explanation: 8000 Besucher – der stärkste Tag.

  - kind: problem
    id: differenz
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Mo, Di, Mi, Do, Fr], values: [4, 6, 8, 5, 7], min: 0, max: 10, unit: Tsd., title: Besucher }
    prompt: Wie viele tausend Besucher mehr kamen am Freitag als am Montag?
    params: { unit: Tsd. }
    answer: { value: 3 }
    hints:
      - 7 − 4.
    explanation: 3000 mehr – fast doppelt so viele.

  - kind: problem
    id: einstellen
    widget: chart
    prompt: Stell den Samstag so ein, dass er doppelt so viele Besucher hat wie Montag.
    params:
      labels: [Mo, Di, Mi, Do, Fr, Sa]
      values: [4, 6, 8, 5, 7, 2]
      editable: [5]
      min: 0
      max: 10
    answer: { values: [4, 6, 8, 5, 7, 8] }
    hints:
      - Montag hatte 4.
    explanation: 2 · 4 = 8 – so hoch wie der Mittwoch.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Liniendiagramm zeigt Umsatz pro Monat. Für März fehlt der Wert, die Linie verbindet Februar direkt mit April. Was ist problematisch?
    params:
      options:
        - label: Die Linie täuscht einen gemessenen Verlauf vor, wo keine Daten sind
          correct: true
        - label: Nichts – so macht man das
          feedback: Besser ist eine sichtbare Lücke.
        - label: Linien darf man für Umsätze nie nehmen
          feedback: Für Verläufe sind sie genau richtig.
    hints:
      - Was wissen wir über den März?
    explanation: Fehlende Daten gehören sichtbar gemacht, nicht überbrückt.
    difficulty: 2

srs:
  cards_from: [differenz, einstellen]
