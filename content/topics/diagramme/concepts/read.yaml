id: stats.dataviz.read
type: concept
title: Diagramme genau lesen
summary: Ablesen, vergleichen, einstellen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Deine Woche als Säulen
    body: Wie viele Stunden schaust du am Tag aufs Handy? Zieh jede Säule auf deinen Wert – grob geschätzt reicht. Die Linie zeigt deinen **Schnitt**. An welchem Tag liegst du weit darüber?
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - Mo
          - Di
          - Mi
          - Do
          - Fr
          - Sa
          - So
        values:
          - 3
          - 3
          - 3
          - 3
          - 3
          - 3
          - 3
        editable:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
        min: 0
        max: 10
        unit: h
        show:
          - mean
        title: Handyzeit pro Tag

  - kind: problem
    id: ablesen
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Mo, Di, Mi, Do, Fr], values: [4, 6, 8, 5, 7], min: 0, max: 10, unit: Tsd., title: Besucher }
    prompt: Wie viele tausend Besucher kamen am Mittwoch?
    params: { unit: Tsd. }
    answer: { value: 8 }
    hints:
      - Folge der Säule bis zur Achse.
    explanation: 8000 Besucher – der stärkste Tag.

  - kind: problem
    id: differenz
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Mo, Di, Mi, Do, Fr], values: [4, 6, 8, 5, 7], min: 0, max: 10, unit: Tsd., title: Besucher }
    prompt: Wie viele tausend Besucher mehr kamen am Freitag als am Montag?
    params: { unit: Tsd. }
    answer: { value: 3 }
    hints:
      - 7 − 4.
    explanation: 3000 mehr – fast doppelt so viele.

  - kind: problem
    id: einstellen
    widget: chart
    prompt: Stell den Samstag so ein, dass er doppelt so viele Besucher hat wie Montag.
    params:
      labels: [Mo, Di, Mi, Do, Fr, Sa]
      values: [4, 6, 8, 5, 7, 2]
      editable: [5]
      min: 0
      max: 10
    answer: { values: [4, 6, 8, 5, 7, 8] }
    hints:
      - Montag hatte 4.
    explanation: 2 · 4 = 8 – so hoch wie der Mittwoch.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Liniendiagramm zeigt Umsatz pro Monat. Für März fehlt der Wert, die Linie verbindet Februar direkt mit April. Was ist problematisch?
    params:
      options:
        - label: Die Linie täuscht einen gemessenen Verlauf vor, wo keine Daten sind
          correct: true
        - label: Nichts – so macht man das
          feedback: Besser ist eine sichtbare Lücke.
        - label: Linien darf man für Umsätze nie nehmen
          feedback: Für Verläufe sind sie genau richtig.
    hints:
      - Was wissen wir über den März?
    explanation: Fehlende Daten gehören sichtbar gemacht, nicht überbrückt.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Um wie viel Prozent stiegen die Besucher von Montag bis Freitag?
    visual:
      widget: chart
      params:
        labels:
          - Mo
          - Di
          - Mi
          - Do
          - Fr
          - Sa
        values:
          - 4
          - 6
          - 8
          - 5
          - 7
          - 8
        max: 10
        unit: Tsd.
    params:
      unit: "%"
    answer:
      value: 75
    feedback:
      - when: numval(state.input) == 3
        misconception: points-vs-percent
        text: Das ist der Anstieg in Tausend Besuchern. Teile noch durch den Montag.
    hints:
      - Montag 4, Freitag 7.
      - "Rechne 3 : 4."
    explanation: "(7 − 4) : 4 = 0,75 = 75 %. Ablesen ist der erste Schritt, der richtige Bezug der zweite."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Wie viele tausend Besucher kamen im Schnitt pro Tag? Auf zwei Stellen.
    visual:
      widget: chart
      params:
        labels:
          - Mo
          - Di
          - Mi
          - Do
          - Fr
          - Sa
        values:
          - 4
          - 6
          - 8
          - 5
          - 7
          - 8
        max: 10
        show:
          - mean
    answer:
      value: 6.33
      tolerance: 0.01
    hints:
      - Addiere alle sechs Säulen.
      - "38 : 6."
    explanation: "38 : 6 ≈ 6,33. Die Mittelwert-Linie im Bild liegt genau dort."
    difficulty: 2

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "Zwei Liniendiagramme: Handy-Nutzung und Kurzsichtigkeit bei Kindern steigen seit 2005 beide. Was kann man ablesen?"
    params:
      options:
        - label: Nur, dass beides mit der Zeit wächst – das allein beweist keinen Zusammenhang
          correct: true
        - label: Handys machen kurzsichtig
          feedback: Alles, was steigt, korreliert mit allem, was steigt.
        - label: Kurzsichtige nutzen öfter Handys
          feedback: Auch diese Richtung zeigt das Bild nicht.
    hints:
      - Was steigt seit 2005 noch alles?
      - "Ein gemeinsamer Trend ist eine dritte Größe: die Zeit."
    explanation: Zwei Trends über die Zeit korrelieren fast immer. Ob es einen echten Zusammenhang gibt, zeigen erst Daten über einzelne Kinder.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Auf einer **logarithmischen** Achse liegen 10, 100 und 1000 gleich weit auseinander. Ein Punkt liegt genau in der Mitte zwischen 10 und 1000. Welchen Wert hat er?
    params:
      options:
        - label: "100"
          correct: true
        - label: "505"
          feedback: Das wäre die Mitte auf einer normalen Achse.
        - label: "500"
          feedback: Auf der log-Achse zählen Faktoren, nicht Differenzen.
    hints:
      - Jeder gleich große Schritt bedeutet denselben Faktor.
      - Von 10 bis 1000 sind es zwei Zehnerschritte.
    explanation: Die Mitte ist 100 – das geometrische Mittel √(10 · 1000). Log-Achsen eignen sich für Wachstum und für Größen über viele Zehnerpotenzen.
    difficulty: 3

srs:
  cards_from: [differenz, einstellen]
