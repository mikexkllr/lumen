id: stats.dataviz.design
type: concept
title: Building good charts yourself
summary: Clear, honest, readable.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: regeln
    widget: buckets
    prompt: Good or bad practice?
    params:
      buckets: [{ label: good }, { label: bad }]
      items:
        - { label: Label the axes, bucket: good }
        - { label: State the unit and source, bucket: good }
        - { label: Sort bars by size, bucket: good }
        - { label: Ten colors with no meaning, bucket: bad }
        - { label: Bars starting at 90 instead of 0, bucket: bad }
    hints:
      - Does it help the reader or confuse them?
    explanation: Every element should explain something. Otherwise it distracts.

  - kind: explain
    id: s2
    body: |
      A strong chart has a **message** in the title, few colors with meaning, and a highlight for the most important thing. Everything else fades into the background.

  - kind: problem
    id: farbe
    widget: choice
    prompt: You want to show that one month stands out. How do you color it?
    params:
      options:
        - { label: "All bars gray, only this one in color", correct: true }
        - { label: Every bar in a different color, feedback: "Then nothing stands out. Everything shouts at once." }
    hints:
      - What draws the eye?
    explanation: Contrast guides the eye exactly to where the story is.

  - kind: problem
    id: titel
    widget: choice
    prompt: Which title is better?
    params:
      options:
        - { label: “Online sales have doubled since 2020”, correct: true }
        - { label: “Sales data 2018–2024”, feedback: "It only describes. It does not say what to look for." }
    hints:
      - Which title states the insight?
    explanation: A title with a statement saves the reader the search.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order the steps towards a good chart.
    params:
      items:
        - label: Decide on the message
        - label: Choose the fitting chart type
        - label: Leave out what is not needed
        - label: Highlight what matters most
    hints:
      - First know what you want to say.
    explanation: A chart is a sentence in picture form. It needs a statement.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: About 8% of men have red–green colour blindness. What does that mean for charts?
    params:
      options:
        - label: Never rely on red versus green alone – also use brightness, shape or labels
          correct: true
        - label: Use only black and white
          feedback: Colour is fine – just not as the only difference.
        - label: Nothing – it affects too few
          feedback: Every larger audience includes people affected.
    hints:
      - Information should never be in the colour alone.
    explanation: Good design is **accessible** – and everyone benefits, for instance with black-and-white printouts.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: match
    prompt: Which colour scale fits the data?
    params:
      pairs:
        - left: People per km²
          right: Light to dark, one hue
        - left: Deviation from average
          right: Two hues, neutral middle
        - left: Parties
          right: Clearly different hues
        - left: Highlighting one value
          right: Grey plus one colour
      leftTitle: Data
      rightTitle: Colour scale
    hints:
      - Does the quantity have a natural middle, such as zero?
      - Categories without order need no steps of lightness.
    explanation: Sequential for »more or less«, diverging for »above or below the middle«, categorical for groups. The wrong scale invents order or hides it.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A bar chart has shadows, a 3D effect, heavy gridlines and a background picture. What do experts recommend?
    params:
      options:
        - label: Remove everything that shows no data
          correct: true
        - label: Decoration distracts from the data.
          feedback: Schmuck lenkt von den Daten ab.
        - label: That too competes with the bars.
          feedback: Auch das konkurriert mit den Säulen.
    hints:
      - Which marks carry information?
      - The rest is sometimes called chartjunk.
    explanation: As much ink as possible should go to data, little to decoration. Every element has to earn its place.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux two tricks by which charts can mislead.
    params:
      keywords:
        - - achse
          - axis
          - "null"
          - zero
          - abgeschnitten
          - truncat
        - - fläche
          - größe
          - 3d
          - area
          - size
          - volume
      sample: A truncated axis that does not start at zero makes small differences look huge. And pictures that grow in height and width exaggerate, because the eye compares the area.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: When is a table better than a chart?
    params:
      options:
        - label: When people want to look up exact individual values
          correct: true
        - label: Patterns and trends are hard to see in tables.
          feedback: Muster und Trends sieht man in Tabellen schlecht.
        - label: For exact numbers the eye reading a chart is imprecise.
          feedback: Für exakte Zahlen ist das Auge am Diagramm ungenau.
    hints:
      - What does a chart do well, and what does a table?
      - Seeing patterns or looking up numbers?
    explanation: "Charts show patterns, tables deliver exact values. Often both help: the picture for the message, the table in the appendix."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A bar chart shows 15 countries. In which order should the bars stand?
    params:
      options:
        - label: Sorted by size, unless there is a natural order
          correct: true
        - label: That helps searching, not comparing.
          feedback: Das hilft beim Suchen, nicht beim Vergleichen.
        - label: Random order just makes comparing harder.
          feedback: Zufall macht den Vergleich nur schwerer.
    hints:
      - What does the reader mainly want to know?
      - Rankings are obvious when the bars are sorted.
    explanation: Sorted, the ranking jumps out. For months or age groups keep the natural order – otherwise you destroy the sequence.
    difficulty: 3

srs:
  cards_from: [regeln, farbe]
