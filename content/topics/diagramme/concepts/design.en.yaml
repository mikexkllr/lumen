id: stats.dataviz.design
type: concept
title: Building good charts yourself
summary: Clear, honest, readable.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: regeln
    widget: buckets
    prompt: Good or bad practice?
    params:
      buckets: [{ label: good }, { label: bad }]
      items:
        - { label: Label the axes, bucket: good }
        - { label: State the unit and source, bucket: good }
        - { label: Sort bars by size, bucket: good }
        - { label: Ten colors with no meaning, bucket: bad }
        - { label: Bars starting at 90 instead of 0, bucket: bad }
    hints:
      - Does it help the reader or confuse them?
    explanation: Every element should explain something. Otherwise it distracts.

  - kind: explain
    body: |
      A strong chart has a **message** in the title, few colors with meaning, and a highlight for the most important thing. Everything else fades into the background.

  - kind: problem
    id: farbe
    widget: choice
    prompt: You want to show that one month stands out. How do you color it?
    params:
      options:
        - { label: "All bars gray, only this one in color", correct: true }
        - { label: Every bar in a different color, feedback: "Then nothing stands out. Everything shouts at once." }
    hints:
      - What draws the eye?
    explanation: Contrast guides the eye exactly to where the story is.

  - kind: problem
    id: titel
    widget: choice
    prompt: Which title is better?
    params:
      options:
        - { label: “Online sales have doubled since 2020”, correct: true }
        - { label: “Sales data 2018–2024”, feedback: "It only describes. It does not say what to look for." }
    hints:
      - Which title states the insight?
    explanation: A title with a statement saves the reader the search.

srs:
  cards_from: [regeln, farbe]
