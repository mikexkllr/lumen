id: stats.dataviz.areas
type: concept
title: Täuschende Flächen
summary: Bilder, die zu groß wirken.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: tasche
    widget: numeric
    prompt: Eine Grafik zeigt einen Geldsack. Für den doppelten Umsatz wird er doppelt so hoch und doppelt so breit gezeichnet. Wievielmal größer wirkt seine Fläche?
    params: { unit: "-mal" }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: linear
        text: Höhe und Breite verdoppeln sich – die Fläche vervierfacht sich.
    hints:
      - 2 · 2.
    explanation: Vier mal so viel Fläche für doppelten Umsatz – das Auge wird getäuscht.

  - kind: explain
    body: |
      Unser Auge vergleicht **Flächen** und **Volumen**, nicht nur Längen. Wer Bildchen in beide Richtungen vergrößert, übertreibt Unterschiede. Auch 3D-Kreisdiagramme verzerren: Vordere Stücke wirken größer.

  - kind: problem
    id: wuerfel
    widget: numeric
    prompt: Ein 3D-Würfel wird in jede Richtung {{k}}-mal so groß gezeichnet. Wievielmal mehr Volumen zeigt er?
    params: { unit: "-mal" }
    answer: { value: "{{k ** 3}}" }
    hints:
      - Breite, Höhe und Tiefe wachsen.
    explanation: "{{k}}³ = {{k ** 3}} – der Eindruck ist maßlos übertrieben."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: torte
    widget: choice
    prompt: Warum sind 3D-Kreisdiagramme problematisch?
    params:
      options:
        - { label: Die Schräglage lässt vordere Stücke größer wirken., correct: true }
        - { label: Sie sind zu bunt., feedback: "Das Problem ist die Verzerrung durch die Perspektive." }
    hints:
      - Was macht die Perspektive mit nahen Stücken?
    explanation: Flach und sortiert ist fast immer ehrlicher.

srs:
  cards_from: [tasche, torte]
