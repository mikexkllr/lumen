id: stats.dataviz.areas
type: concept
title: Täuschende Flächen
summary: Bilder, die zu groß wirken.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Größer als gedacht
    body: "Grafiken malen Zahlen gern als Bildchen – Geldsäcke, Fässer, Häuser. Zieh an der Ecke des Bildes und mach es größer und kleiner. Achte auf die Zahl darunter: Die **Fläche** wächst schneller, als du denkst."
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 10
        maxH: 8
        w: 3
        h: 1
        show:
          - area
        unit: cm

  - kind: problem
    id: tasche
    widget: numeric
    prompt: Eine Grafik zeigt einen Geldsack. Für den doppelten Umsatz wird er doppelt so hoch und doppelt so breit gezeichnet. Wievielmal größer wirkt seine Fläche?
    params: { unit: "-mal" }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: linear
        text: Höhe und Breite verdoppeln sich – die Fläche vervierfacht sich.
    hints:
      - 2 · 2.
    explanation: Vier mal so viel Fläche für doppelten Umsatz – das Auge wird getäuscht.

  - kind: explain
    id: s2
    body: |
      Unser Auge vergleicht **Flächen** und **Volumen**, nicht nur Längen. Wer Bildchen in beide Richtungen vergrößert, übertreibt Unterschiede. Auch 3D-Kreisdiagramme verzerren: Vordere Stücke wirken größer.

  - kind: problem
    id: wuerfel
    widget: numeric
    prompt: Ein 3D-Würfel wird in jede Richtung {{k}}-mal so groß gezeichnet. Wievielmal mehr Volumen zeigt er?
    params: { unit: "-mal" }
    answer: { value: "{{k ** 3}}" }
    hints:
      - Breite, Höhe und Tiefe wachsen.
    explanation: "{{k}}³ = {{k ** 3}} – der Eindruck ist maßlos übertrieben."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: torte
    widget: choice
    prompt: Warum sind 3D-Kreisdiagramme problematisch?
    params:
      options:
        - { label: Die Schräglage lässt vordere Stücke größer wirken., correct: true }
        - { label: Sie sind zu bunt., feedback: "Das Problem ist die Verzerrung durch die Perspektive." }
    hints:
      - Was macht die Perspektive mit nahen Stücken?
    explanation: Flach und sortiert ist fast immer ehrlicher.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Das ganze Raster ist ein großes Bild aus 4 × 4 Feldern. Ein kleines Bild ist halb so hoch und halb so breit. Färbe die Fläche des kleinen Bildes.
    params:
      parts: 16
      shape: square
    answer:
      fraction: 1/4
    hints:
      - "Halb so hoch und halb so breit heißt: 2 × 2 Felder."
      - Das sind 4 von 16 Feldern.
    explanation: Halbe Seiten ergeben nur ein Viertel der **Fläche**. Darum wirken Bildchen, die in beide Richtungen wachsen, so übertrieben.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Kreis soll einen doppelt so großen Wert zeigen. Mit welchem Faktor muss sein **Radius** wachsen, damit die Fläche stimmt? Auf zwei Stellen.
    answer:
      value: 1.41
      tolerance: 0.01
    hints:
      - Die Fläche wächst mit dem Quadrat des Radius.
    explanation: √2 ≈ 1,41. Wer den Radius verdoppelt, zeigt das Vierfache.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Ein Kreis soll einen {{k}}-mal so großen Wert zeigen. Mit welchem Faktor muss sein Radius wachsen?
    answer:
      value: "{{sqrt(k)}}"
    feedback:
      - when: numval(state.input) == k
        misconception: linear-area
        text: Dann wächst die Fläche um {{k * k}}. Die Fläche geht mit dem Radius zum Quadrat.
    hints:
      - Die Fläche eines Kreises wächst mit r².
      - Welche Zahl ergibt quadriert {{k}}?
    explanation: √{{k}} = {{sqrt(k)}}. Dann wächst die Fläche um {{sqrt(k)}}² = {{k}}.
    difficulty: 2
    variants:
      params:
        k: choice[4,9,16,25,36]
      defaults:
        k: 9

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: In einem Blasendiagramm ist ein Wert dreimal so groß. Um welchen Faktor wächst der Radius der Blase richtig? Auf zwei Stellen.
    answer:
      value: 1.73
      tolerance: 0.01
    hints:
      - Die Fläche soll dreimal so groß werden.
      - Zieh die Wurzel aus 3.
    explanation: √3 ≈ 1,73. Viele Programme skalieren aus Versehen den Radius – dann wirkt der Wert 9-mal so groß.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welche Darstellung lässt Menschen Werte am genauesten vergleichen?
    params:
      options:
        - label: Positionen auf einer gemeinsamen Achse – wie bei Säulen
          correct: true
        - label: Winkel – wie im Kreisdiagramm
          feedback: Winkel schätzen wir deutlich ungenauer.
        - label: Farbhelligkeit
          feedback: Die ungenaueste aller gängigen Kodierungen.
    hints:
      - "Was kannst du besser: Längen an einer Linie vergleichen oder Tortenstücke?"
    explanation: "Experimente von Cleveland und McGill (1984): Position schlägt Länge, Länge schlägt Winkel, Winkel schlägt Fläche."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: "Versuche zeigen: Menschen schätzen Flächen nicht linear. Eine doppelt so große Fläche wirkt nur etwa 1,6-mal so groß. Was folgt daraus?"
    params:
      options:
        - label: Große Werte werden in Flächen-Grafiken unterschätzt
          correct: true
        - label: Flächen sind genauer als Längen
          feedback: Längen auf gemeinsamer Achse schätzt man am genauesten.
        - label: Man sollte die Fläche quadrieren
          feedback: Damit überschätzt man nur in die andere Richtung.
    hints:
      - "2 wirkt wie 1,6: Ist das zu viel oder zu wenig?"
      - Je größer der Unterschied, desto mehr wird verschluckt.
    explanation: Nach Stevens wächst der Eindruck einer Fläche etwa mit Fläche hoch 0,7. Für genaue Vergleiche sind Säulen oder Punkte auf einer Achse besser.
    difficulty: 3

srs:
  cards_from: [tasche, torte]
