id: stats.dataviz.axes
type: concept
title: Truncated axes
summary: How small differences look huge.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wirkung
    widget: choice
    visual:
      widget: chart
      params: { labels: [Company A, Company B], values: [98, 100], min: 96, max: 101, title: Customer satisfaction }
    prompt: How much more satisfied are Company B's customers really?
    params:
      options:
        - { label: Only about 2% more, correct: true }
        - { label: About twice as satisfied, feedback: "Look at the axis. It starts at 96, not at 0." }
    hints:
      - Where does the y-axis start?
    explanation: 98 versus 100. The truncated axis blows up the difference.

  - kind: explain
    id: s2
    body: |
      Bars must **start at zero**, because their length stands for size. Line charts may have a truncated axis, as long as it is clearly visible.

  - kind: problem
    id: prozent
    widget: numeric
    prompt: A value rises from {{a}} to {{b}}. By what percent is that?
    params: { unit: "%" }
    answer: { value: "{{(b - a) * 100 / a}}" }
    hints:
      - The increase divided by the starting value.
    explanation: "({{b}} − {{a}}) ÷ {{a}} = {{(b - a) * 100 / a}}%."
    variants:
      params: { a: "choice[50,100,200]", p: "choice[2,4,5,10]" }
      derive: { b: "a + a * p / 100" }
      defaults: { a: 100, p: 2 }

  - kind: problem
    id: wann
    widget: choice
    prompt: When is an axis that does not start at zero fine?
    params:
      options:
        - { label: For a fever curve between 36 and 41 °C, correct: true }
        - { label: "For bars that compare sales", feedback: "With bars, the shortened length always deceives." }
    hints:
      - Where is zero not a sensible value at all?
    explanation: A body temperature of 0 °C makes no sense. Here the small swings matter.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: May the axis be cut off here?
    params:
      buckets:
        - id: b1
          label: Yes
        - id: b2
          label: No – must start at 0
      items:
        - label: Bar chart
          bucket: b2
        - label: Fever curve from 36 to 41 °C
          bucket: b1
        - label: Horizontal bar chart
          bucket: b2
        - label: Line chart with a clear axis
          bucket: b1
    hints:
      - Where does length stand for size?
    explanation: With bars the eye compares lengths. Those must be right.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A chart shows growth on a **logarithmic** y-axis as a straight line. What does that mean?
    params:
      options:
        - label: Exponential growth – a constant percentage increase
          correct: true
        - label: Steady growth by a fixed amount
          feedback: That would be straight on a normal axis.
        - label: No growth
          feedback: Then the line would be horizontal.
    hints:
      - On this axis 10, 100 and 1000 are equally far apart.
    explanation: Log axes show growth **rates**. Whoever misses that underestimates the numbers dramatically.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: two bars show 95 and 100, the axis starts at 90. One looks twice as tall. By what percentage is the value really larger?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 5
      tolerance: 2
    explanation: Only a good 5%. The cut-off axis turns that into 100%.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Two charts show the same data: one from 2019, one from 2021. The first shows a decline, the second a rise. What is this trick called?"
    params:
      options:
        - label: Cherry-picking – the starting point is chosen to suit
          correct: true
        - label: Rounding
          feedback: The values themselves are unchanged.
        - label: Weighting
          feedback: Nothing is weighted, only cropped.
    hints:
      - Who chooses where the chart begins?
    explanation: "Always ask: why exactly this period? The honest view shows as much of the course as possible."
    difficulty: 3

srs:
  cards_from: [wirkung, wann]
