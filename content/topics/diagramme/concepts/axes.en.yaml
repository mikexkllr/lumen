id: stats.dataviz.axes
type: concept
title: Truncated axes
summary: How small differences look huge.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Small looks huge
    body: "Adverts love to show how much better a new phone is. Drag the right bar up a tiny bit – it shoots up! Look at the numbers on the **axis**: where does it start?"
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - old
          - new
        values:
          - 20
          - 20
        editable:
          - 1
        min: 19
        max: 22
        step: 0.5
        title: Battery life in hours

  - kind: problem
    id: wirkung
    widget: choice
    visual:
      widget: chart
      params: { labels: [Company A, Company B], values: [98, 100], min: 96, max: 101, title: Customer satisfaction }
    prompt: How much more satisfied are Company B's customers really?
    params:
      options:
        - { label: Only about 2% more, correct: true }
        - { label: About twice as satisfied, feedback: "Look at the axis. It starts at 96, not at 0." }
    hints:
      - Where does the y-axis start?
    explanation: 98 versus 100. The truncated axis blows up the difference.

  - kind: explain
    id: s2
    body: |
      Bars must **start at zero**, because their length stands for size. Line charts may have a truncated axis, as long as it is clearly visible.

  - kind: problem
    id: prozent
    widget: numeric
    prompt: A value rises from {{a}} to {{b}}. By what percent is that?
    params: { unit: "%" }
    answer: { value: "{{(b - a) * 100 / a}}" }
    hints:
      - The increase divided by the starting value.
    explanation: "({{b}} − {{a}}) ÷ {{a}} = {{(b - a) * 100 / a}}%."
    variants:
      params: { a: "choice[50,100,200]", p: "choice[2,4,5,10]" }
      derive: { b: "a + a * p / 100" }
      defaults: { a: 100, p: 2 }

  - kind: problem
    id: wann
    widget: choice
    prompt: When is an axis that does not start at zero fine?
    params:
      options:
        - { label: For a fever curve between 36 and 41 °C, correct: true }
        - { label: "For bars that compare sales", feedback: "With bars, the shortened length always deceives." }
    hints:
      - Where is zero not a sensible value at all?
    explanation: A body temperature of 0 °C makes no sense. Here the small swings matter.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: May the axis be cut off here?
    params:
      buckets:
        - id: b1
          label: Yes
        - id: b2
          label: No – must start at 0
      items:
        - label: Bar chart
          bucket: b2
        - label: Fever curve from 36 to 41 °C
          bucket: b1
        - label: Horizontal bar chart
          bucket: b2
        - label: Line chart with a clear axis
          bucket: b1
    hints:
      - Where does length stand for size?
    explanation: With bars the eye compares lengths. Those must be right.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: This axis starts at 90. Set bar B so that it looks twice as tall as bar A in the picture.
    params:
      labels:
        - A
        - B
      values:
        - 95
        - 91
      editable:
        - 1
      min: 90
      max: 100
    answer:
      values:
        - 95
        - 100
    hints:
      - Bar A rises 5 units above 90.
      - B has to rise 10 above 90 – so up to 100.
    explanation: "Twice as tall in the picture, but in truth only just over 5 % more: 100 instead of 95. That is how a cut-off **axis** fools you."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A chart shows growth on a **logarithmic** y-axis as a straight line. What does that mean?
    params:
      options:
        - label: Exponential growth – a constant percentage increase
          correct: true
        - label: Steady growth by a fixed amount
          feedback: That would be straight on a normal axis.
        - label: No growth
          feedback: Then the line would be horizontal.
    hints:
      - On this axis 10, 100 and 1000 are equally far apart.
    explanation: Log axes show growth **rates**. Whoever misses that underestimates the numbers dramatically.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: two bars show 95 and 100, the axis starts at 90. One looks twice as tall. By what percentage is the value really larger?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 5
      tolerance: 2
    explanation: Only a good 5%. The cut-off axis turns that into 100%.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: The y-axis starts at {{s}}. Bar A shows {{s + d}}, bar B shows {{s + d * f}}. How many times taller does B look in the picture?
    answer:
      value: "{{f}}"
    feedback:
      - when: abs(numval(state.input) - (s + d * f) / (s + d)) < 0.01
        misconception: real-ratio
        text: That is the real ratio of the values. The question is what the eye sees.
    hints:
      - Only the part above {{s}} is visible.
      - A sticks out {{d}}, B sticks out {{d * f}}.
    explanation: In the picture {{d * f}} ÷ {{d}} = {{f}} times. In truth B is only about {{round(100 * d * (f - 1) / (s + d))}} % larger.
    difficulty: 2
    variants:
      params:
        s: choice[50,80,90]
        d: int[2,5]
        f: int[2,4]
      defaults:
        s: 90
        d: 5
        f: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: The same curve is drawn once wide and flat, once narrow and tall. What changes?
    params:
      options:
        - label: "Only the impression: narrow looks dramatic, wide looks harmless"
          correct: true
        - label: The data are the same, only the aspect ratio differs.
          feedback: Die Daten sind gleich, nur das Seitenverhältnis ist anders.
        - label: The aspect ratio strongly affects the feeling.
          feedback: Das Seitenverhältnis wirkt stark auf das Gefühl.
    hints:
      - Imagine squeezing the picture from left and right.
      - What happens to the angle of the line?
    explanation: "The aspect ratio controls how steep a line looks. A rule of thumb: important segments should sit at about 45°."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Two charts show the same data: one from 2019, one from 2021. The first shows a decline, the second a rise. What is this trick called?"
    params:
      options:
        - label: Cherry-picking – the starting point is chosen to suit
          correct: true
        - label: Rounding
          feedback: The values themselves are unchanged.
        - label: Weighting
          feedback: Nothing is weighted, only cropped.
    hints:
      - Who chooses where the chart begins?
    explanation: "Always ask: why exactly this period? The honest view shows as much of the course as possible."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: On a log axis, 1000 is as far above 100 as 100 is above which value?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == -800
        misconception: linear-thinking
        text: That would be an ordinary axis with equal differences.
    hints:
      - From 100 to 1000 is times 10.
      - Go back from 100 by the same factor.
    explanation: 100 ÷ 10 = 10. On log axes equal gaps mean equal factors. That is why exponential growth becomes a straight line there.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A report shows numbers up to 2019 on an axis from 0 to 100 – and from 2020 in the same picture on an axis from 0 to 1000. What is this?
    params:
      options:
        - label: A change of scale that hides the jump
          correct: true
        - label: A log axis follows one rule along its whole length.
          feedback: Bei einer log-Achse gilt eine Regel für die ganze Achse.
        - label: Switching scale in the middle of a chart misleads.
          feedback: Mitten im Bild die Skala zu wechseln, täuscht.
    hints:
      - What would the jump look like if the axis stayed the same?
      - An axis must follow the same rule everywhere.
    explanation: A scale change mid-chart makes a tenfold jump look flat. Good charts mark such breaks clearly or avoid them.
    difficulty: 3

srs:
  cards_from: [wirkung, wann]
