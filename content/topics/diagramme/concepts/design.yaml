id: stats.dataviz.design
type: concept
title: Selbst gute Diagramme bauen
summary: Klar, ehrlich, lesbar.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: regeln
    widget: buckets
    prompt: Gute oder schlechte Praxis?
    params:
      buckets: [{ label: gut }, { label: schlecht }]
      items:
        - { label: Achsen beschriften, bucket: gut }
        - { label: Einheit und Quelle angeben, bucket: gut }
        - { label: Säulen der Größe nach sortieren, bucket: gut }
        - { label: Zehn Farben ohne Bedeutung, bucket: schlecht }
        - { label: Säulen ab 90 statt ab 0, bucket: schlecht }
    hints:
      - Hilft es dem Leser oder verwirrt es?
    explanation: Jedes Element sollte etwas erklären – sonst lenkt es ab.

  - kind: explain
    id: s2
    body: |
      Ein starkes Diagramm hat eine **Botschaft** im Titel, wenige Farben mit Bedeutung und eine Hervorhebung für das Wichtigste. Alles andere tritt in den Hintergrund.

  - kind: problem
    id: farbe
    widget: choice
    prompt: Du willst zeigen, dass ein Monat aus der Reihe fällt. Wie färbst du?
    params:
      options:
        - { label: "Alle Säulen grau, nur diese eine farbig", correct: true }
        - { label: Jede Säule in einer anderen Farbe, feedback: "Dann fällt nichts mehr auf – alles schreit gleichzeitig." }
    hints:
      - Was zieht den Blick an?
    explanation: Kontrast lenkt den Blick genau dahin, wo die Geschichte ist.

  - kind: problem
    id: titel
    widget: choice
    prompt: Welcher Titel ist besser?
    params:
      options:
        - { label: »Online-Umsatz hat sich seit 2020 verdoppelt«, correct: true }
        - { label: »Umsatzdaten 2018–2024«, feedback: "Er beschreibt nur – er sagt nicht, was man sehen soll." }
    hints:
      - Welcher Titel nennt die Erkenntnis?
    explanation: Ein Titel mit Aussage spart dem Leser die Suche.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne die Schritte zu einem guten Diagramm.
    params:
      items:
        - label: Die Botschaft festlegen
        - label: Den passenden Diagrammtyp wählen
        - label: Überflüssiges weglassen
        - label: Das Wichtigste hervorheben
    hints:
      - Erst wissen, was man sagen will.
    explanation: Ein Diagramm ist ein Satz in Bildform. Es braucht eine Aussage.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Etwa 8 % der Männer haben eine Rot-Grün-Schwäche. Was heißt das für Diagramme?
    params:
      options:
        - label: Nie allein auf Rot gegen Grün setzen – zusätzlich Helligkeit, Form oder Beschriftung nutzen
          correct: true
        - label: Nur noch Schwarz-Weiß verwenden
          feedback: Farbe ist erlaubt – nur nicht als einziger Unterschied.
        - label: Nichts – das betrifft zu wenige
          feedback: In jedem größeren Publikum sitzen Betroffene.
    hints:
      - Information sollte nie nur in der Farbe stecken.
    explanation: Gute Gestaltung ist **barrierefrei** – und davon profitieren alle, etwa beim Schwarz-Weiß-Ausdruck.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: match
    prompt: Welche Farbskala passt zu den Daten?
    params:
      pairs:
        - left: Einwohner pro km²
          right: Hell bis dunkel, eine Farbe
        - left: Abweichung vom Mittel
          right: Zwei Farben, neutrale Mitte
        - left: Parteien
          right: Klar verschiedene Farben
        - left: Hervorhebung eines Werts
          right: Grau plus eine Farbe
      leftTitle: Daten
      rightTitle: Farbskala
    hints:
      - Hat die Größe eine natürliche Mitte, etwa null?
      - Kategorien ohne Reihenfolge brauchen keine Helligkeitsstufen.
    explanation: Sequentiell für »mehr oder weniger«, divergierend für »über oder unter der Mitte«, kategorial für Gruppen. Die falsche Skala erfindet Ordnung oder versteckt sie.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Ein Säulendiagramm hat Schatten, 3D-Effekt, dicke Gitterlinien und ein Hintergrundbild. Was empfehlen Fachleute?
    params:
      options:
        - label: Alles weglassen, was keine Daten zeigt
          correct: true
        - label: Noch mehr Effekte, damit es auffällt
          feedback: Schmuck lenkt von den Daten ab.
        - label: Nur das Hintergrundbild behalten
          feedback: Auch das konkurriert mit den Säulen.
    hints:
      - Welche Striche tragen Information?
      - Der Rest heißt manchmal »Chartjunk«.
    explanation: Möglichst viel Tinte soll für Daten da sein, wenig für Schmuck. Jedes Element muss sich seinen Platz verdienen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux zwei Tricks, mit denen Diagramme täuschen können.
    params:
      keywords:
        - - achse
          - axis
          - "null"
          - zero
          - abgeschnitten
          - truncat
        - - fläche
          - größe
          - 3d
          - area
          - size
          - volume
      sample: Eine abgeschnittene Achse, die nicht bei null beginnt, lässt kleine Unterschiede riesig wirken. Und Bilder, die in Höhe und Breite wachsen, übertreiben, weil das Auge die Fläche vergleicht.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Wann ist eine Tabelle besser als ein Diagramm?
    params:
      options:
        - label: Wenn man einzelne genaue Werte nachschlagen will
          correct: true
        - label: Immer, Tabellen sind ehrlicher
          feedback: Muster und Trends sieht man in Tabellen schlecht.
        - label: Nie, Bilder sind immer besser
          feedback: Für exakte Zahlen ist das Auge am Diagramm ungenau.
    hints:
      - Was kann ein Diagramm gut, was eine Tabelle?
      - Muster sehen oder Zahlen nachschlagen?
    explanation: "Diagramme zeigen Muster, Tabellen liefern genaue Werte. Oft hilft beides: das Bild für die Botschaft, die Tabelle im Anhang."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Ein Säulendiagramm zeigt 15 Länder. In welcher Reihenfolge stehen die Säulen am besten?
    params:
      options:
        - label: Nach Größe sortiert, außer es gibt eine natürliche Reihenfolge
          correct: true
        - label: Alphabetisch
          feedback: Das hilft beim Suchen, nicht beim Vergleichen.
        - label: Zufällig, damit nichts bevorzugt wird
          feedback: Zufall macht den Vergleich nur schwerer.
    hints:
      - Was will der Leser vor allem wissen?
      - Rangfolgen sieht man sofort, wenn sortiert ist.
    explanation: Sortiert springt die Rangfolge ins Auge. Bei Monaten oder Altersgruppen bleibt die natürliche Reihenfolge – sonst zerstört man den Verlauf.
    difficulty: 3

srs:
  cards_from: [regeln, farbe]
