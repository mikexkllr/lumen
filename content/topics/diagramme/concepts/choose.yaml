id: stats.dataviz.choose
type: concept
title: Das richtige Diagramm
summary: Welche Form für welche Frage?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: zuordnen
    widget: match
    prompt: Welches Diagramm passt zur Frage?
    params:
      pairs:
        - { left: Anteile am Ganzen, right: Kreisdiagramm }
        - { left: Entwicklung über Zeit, right: Liniendiagramm }
        - { left: Gruppen vergleichen, right: Säulendiagramm }
        - { left: Zusammenhang zweier Größen, right: Streudiagramm }
    hints:
      - Zeit läuft meist auf der x-Achse einer Linie.
    explanation: Erst die Frage, dann die Form – nicht umgekehrt.

  - kind: explain
    id: s2
    body: |
      Ein gutes **Diagramm** beantwortet **eine Frage** auf einen Blick. Linien zeigen Verläufe, Säulen Vergleiche, Kreise Anteile – aber nur bei wenigen Stücken.

  - kind: problem
    id: temperatur
    widget: choice
    prompt: Du willst zeigen, wie sich die Temperatur über ein Jahr verändert. Was nimmst du?
    params:
      options:
        - { label: Ein Liniendiagramm, correct: true }
        - { label: Ein Kreisdiagramm, feedback: "Temperaturen sind keine Anteile an einem Ganzen." }
    hints:
      - Geht es um einen Verlauf?
    explanation: Linien zeigen Trends und Jahreszeiten auf einen Blick.

  - kind: problem
    id: kreis
    widget: choice
    prompt: Ein Kreisdiagramm soll 14 Parteien zeigen. Gute Idee?
    params:
      options:
        - { label: Nein – so viele schmale Stücke kann niemand vergleichen., correct: true }
        - { label: "Ja, Kreise sind immer übersichtlich.", feedback: "Ab etwa fünf Stücken werden Winkel schwer zu vergleichen." }
    hints:
      - Wie gut vergleicht man winzige Tortenstücke?
    explanation: Bei vielen Kategorien sind sortierte Säulen viel klarer.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Welches Diagramm passt am besten?
    params:
      buckets:
        - id: b1
          label: Linie
        - id: b2
          label: Säulen
        - id: b3
          label: Kreis
      items:
        - label: Temperatur über ein Jahr
          bucket: b1
        - label: Umsatz von fünf Filialen
          bucket: b2
        - label: Stimmenanteile von drei Parteien
          bucket: b3
        - label: Aktienkurs über zehn Jahre
          bucket: b1
        - label: Einwohner von vier Städten
          bucket: b2
    hints:
      - Verlauf, Vergleich oder Anteil am Ganzen?
    explanation: Die Frage bestimmt die Form.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "[[Linien]] zeigen Verläufe, [[Säulen]] zeigen Vergleiche."
      distractors:
        - Kreise
        - Punkte

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du willst zeigen, wie die Körpergrößen von 500 Menschen verteilt sind. Welches Diagramm passt?
    params:
      options:
        - label: Ein Histogramm – Säulen für Größenbereiche
          correct: true
        - label: Ein Kreisdiagramm
          feedback: Es zeigt Anteile, keine Verteilung über eine Skala.
        - label: Ein Liniendiagramm über die Zeit
          feedback: Hier gibt es keine Zeitachse.
    hints:
      - Man fasst Werte zu Klassen zusammen, etwa 160–165 cm.
    explanation: "Ein **Histogramm** zeigt die Form einer Verteilung: Gipfel, Breite, Schiefe."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: Welche Art von Daten ist das?
    params:
      buckets:
        - id: b1
          label: Kategorien ohne Reihenfolge
        - id: b2
          label: Rangfolge ohne feste Abstände
        - id: b3
          label: Messwerte mit Abständen
      items:
        - label: Lieblingsfarbe
          bucket: b1
        - label: Wohnort
          bucket: b1
        - label: Platz im Rennen
          bucket: b2
        - label: "Zufriedenheit: gut, mittel, schlecht"
          bucket: b2
        - label: Körpergröße in cm
          bucket: b3
        - label: Wartezeit in Minuten
          bucket: b3
    hints:
      - Kann man die Werte sinnvoll ordnen?
      - Kann man sinnvoll Differenzen bilden, etwa »3 cm mehr«?
    explanation: "Das **Skalenniveau** bestimmt das Diagramm: Kategorien als Säulen, Messwerte als Histogramm oder Punktwolke. Einen Mittelwert gibt es nur bei Messwerten."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Ein Histogramm der Körpergrößen hat Säulen von 10 cm Breite. Du machst sie 1 mm breit. Was passiert?
    params:
      options:
        - label: Die Säulen werden zum zufälligen Zackenmuster
          correct: true
        - label: Das Bild wird genauer
          feedback: Bei so schmalen Klassen fallen in jede nur ein, zwei Werte.
        - label: Nichts ändert sich
          feedback: Die Klassenbreite verändert das Bild stark.
    hints:
      - Wie viele Menschen landen in einer 1-mm-Klasse?
      - Zu breit verwischt, zu schmal rauscht.
    explanation: "Die **Klassenbreite** ist ein Kompromiss: zu breit versteckt die Form, zu schmal zeigt nur Zufall. Probiere immer mehrere Breiten."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein **Boxplot** zeigt Median, die mittleren 50 % als Kasten und Ausreißer als Punkte. Wofür ist er ideal?
    params:
      options:
        - label: Viele Gruppen auf einen Blick vergleichen
          correct: true
        - label: Einen zeitlichen Verlauf zeigen
          feedback: Dafür nimmt man Linien.
        - label: Anteile am Ganzen zeigen
          feedback: Dafür nimmt man Balken oder Kreise.
    hints:
      - Er fasst eine ganze Verteilung in fünf Zahlen zusammen.
    explanation: Zehn Boxplots nebeneinander zeigen mehr als zehn Histogramme – und brauchen kaum Platz.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Ein gestapeltes Säulendiagramm zeigt drei Produkte pro Jahr übereinander. Welches Produkt kann man über die Jahre gut vergleichen?
    params:
      options:
        - label: Nur das unterste
          correct: true
        - label: Alle drei
          feedback: Die oberen Teile beginnen jedes Jahr auf anderer Höhe.
        - label: Nur das oberste
          feedback: Das oberste schwebt auf den anderen.
    hints:
      - Welcher Teil steht auf einer gemeinsamen Grundlinie?
      - Längen ohne gemeinsamen Start sind schwer zu vergleichen.
    explanation: Nur das unterste Stück startet überall bei null. Für Vergleiche sind nebeneinander stehende Säulen oder kleine Einzeldiagramme besser.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Zwölf Linien für zwölf Länder liegen übereinander wie Spaghetti. Was hilft am meisten?
    params:
      options:
        - label: Zwölf kleine Diagramme mit gleichen Achsen nebeneinander
          correct: true
        - label: Mehr Farben
          feedback: Zwölf Farben kann niemand auseinanderhalten.
        - label: Ein 3D-Diagramm
          feedback: 3D verdeckt noch mehr.
    hints:
      - Gleiche Achsen machen Bilder vergleichbar.
      - Das Prinzip heißt »Small Multiples«.
    explanation: "**Small Multiples** zeigen jedes Land für sich – mit gleicher Skala bleibt der Vergleich ehrlich. Ein Land kann zusätzlich farbig hervorgehoben werden."
    difficulty: 3

srs:
  cards_from: [zuordnen, kreis]
