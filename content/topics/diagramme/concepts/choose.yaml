id: stats.dataviz.choose
type: concept
title: Das richtige Diagramm
summary: Welche Form für welche Frage?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: zuordnen
    widget: match
    prompt: Welches Diagramm passt zur Frage?
    params:
      pairs:
        - { left: Anteile am Ganzen, right: Kreisdiagramm }
        - { left: Entwicklung über Zeit, right: Liniendiagramm }
        - { left: Gruppen vergleichen, right: Säulendiagramm }
        - { left: Zusammenhang zweier Größen, right: Streudiagramm }
    hints:
      - Zeit läuft meist auf der x-Achse einer Linie.
    explanation: Erst die Frage, dann die Form – nicht umgekehrt.

  - kind: explain
    id: s2
    body: |
      Ein gutes Diagramm beantwortet **eine Frage** auf einen Blick. Linien zeigen Verläufe, Säulen Vergleiche, Kreise Anteile – aber nur bei wenigen Stücken.

  - kind: problem
    id: temperatur
    widget: choice
    prompt: Du willst zeigen, wie sich die Temperatur über ein Jahr verändert. Was nimmst du?
    params:
      options:
        - { label: Ein Liniendiagramm, correct: true }
        - { label: Ein Kreisdiagramm, feedback: "Temperaturen sind keine Anteile an einem Ganzen." }
    hints:
      - Geht es um einen Verlauf?
    explanation: Linien zeigen Trends und Jahreszeiten auf einen Blick.

  - kind: problem
    id: kreis
    widget: choice
    prompt: Ein Kreisdiagramm soll 14 Parteien zeigen. Gute Idee?
    params:
      options:
        - { label: Nein – so viele schmale Stücke kann niemand vergleichen., correct: true }
        - { label: "Ja, Kreise sind immer übersichtlich.", feedback: "Ab etwa fünf Stücken werden Winkel schwer zu vergleichen." }
    hints:
      - Wie gut vergleicht man winzige Tortenstücke?
    explanation: Bei vielen Kategorien sind sortierte Säulen viel klarer.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du willst zeigen, wie die Körpergrößen von 500 Menschen verteilt sind. Welches Diagramm passt?
    params:
      options:
        - label: Ein Histogramm – Säulen für Größenbereiche
          correct: true
        - label: Ein Kreisdiagramm
          feedback: Es zeigt Anteile, keine Verteilung über eine Skala.
        - label: Ein Liniendiagramm über die Zeit
          feedback: Hier gibt es keine Zeitachse.
    hints:
      - Man fasst Werte zu Klassen zusammen, etwa 160–165 cm.
    explanation: "Ein **Histogramm** zeigt die Form einer Verteilung: Gipfel, Breite, Schiefe."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein **Boxplot** zeigt Median, die mittleren 50 % als Kasten und Ausreißer als Punkte. Wofür ist er ideal?
    params:
      options:
        - label: Viele Gruppen auf einen Blick vergleichen
          correct: true
        - label: Einen zeitlichen Verlauf zeigen
          feedback: Dafür nimmt man Linien.
        - label: Anteile am Ganzen zeigen
          feedback: Dafür nimmt man Balken oder Kreise.
    hints:
      - Er fasst eine ganze Verteilung in fünf Zahlen zusammen.
    explanation: Zehn Boxplots nebeneinander zeigen mehr als zehn Histogramme – und brauchen kaum Platz.
    difficulty: 3

srs:
  cards_from: [zuordnen, kreis]
