id: stats.dataviz.areas
type: concept
title: Deceptive areas
summary: Pictures that look too big.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: tasche
    widget: numeric
    prompt: A graphic shows a money bag. For double the sales, it is drawn twice as tall and twice as wide. How many times larger does its area look?
    params: { unit: "times" }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: linear
        text: Height and width both double, so the area quadruples.
    hints:
      - 2 · 2.
    explanation: Four times the area for double the sales. The eye is fooled.

  - kind: explain
    id: s2
    body: |
      Our eyes compare **areas** and **volumes**, not just lengths. Enlarging icons in both directions exaggerates differences. 3D pie charts distort too: front slices look bigger.

  - kind: problem
    id: wuerfel
    widget: numeric
    prompt: A 3D cube is drawn {{k}} times as large in every direction. How many times more volume does it show?
    params: { unit: "times" }
    answer: { value: "{{k ** 3}}" }
    hints:
      - Width, height and depth all grow.
    explanation: "{{k}}³ = {{k ** 3}}. The impression is wildly exaggerated."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: torte
    widget: choice
    prompt: Why are 3D pie charts a problem?
    params:
      options:
        - { label: The tilt makes front slices look bigger., correct: true }
        - { label: They are too colorful., feedback: "The problem is the distortion from perspective." }
    hints:
      - What does perspective do to near slices?
    explanation: Flat and sorted is almost always more honest.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A circle should show a value twice as large. By what factor must its **radius** grow for the area to be right? To two places.
    answer:
      value: 1.41
      tolerance: 0.01
    hints:
      - The area grows with the square of the radius.
    explanation: √2 ≈ 1.41. Doubling the radius shows four times as much.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which kind of chart lets people compare values best?
    params:
      options:
        - label: Positions on a common axis – as with bars
          correct: true
        - label: Angles – as in a pie chart
          feedback: We estimate angles much less accurately.
        - label: Colour brightness
          feedback: The least accurate of all common encodings.
    hints:
      - "What can you do better: compare lengths along a line or pie slices?"
    explanation: "Experiments by Cleveland and McGill (1984): position beats length, length beats angle, angle beats area."
    difficulty: 3

srs:
  cards_from: [tasche, torte]
