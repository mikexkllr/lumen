id: stats.dataviz.areas
type: concept
title: Deceptive areas
summary: Pictures that look too big.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: tasche
    widget: numeric
    prompt: A graphic shows a money bag. For double the sales, it is drawn twice as tall and twice as wide. How many times larger does its area look?
    params: { unit: "times" }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: linear
        text: Height and width both double, so the area quadruples.
    hints:
      - 2 · 2.
    explanation: Four times the area for double the sales. The eye is fooled.

  - kind: explain
    id: s2
    body: |
      Our eyes compare **areas** and **volumes**, not just lengths. Enlarging icons in both directions exaggerates differences. 3D pie charts distort too: front slices look bigger.

  - kind: problem
    id: wuerfel
    widget: numeric
    prompt: A 3D cube is drawn {{k}} times as large in every direction. How many times more volume does it show?
    params: { unit: "times" }
    answer: { value: "{{k ** 3}}" }
    hints:
      - Width, height and depth all grow.
    explanation: "{{k}}³ = {{k ** 3}}. The impression is wildly exaggerated."
    variants:
      params: { k: "int[2,4]" }
      defaults: { k: 2 }

  - kind: problem
    id: torte
    widget: choice
    prompt: Why are 3D pie charts a problem?
    params:
      options:
        - { label: The tilt makes front slices look bigger., correct: true }
        - { label: They are too colorful., feedback: "The problem is the distortion from perspective." }
    hints:
      - What does perspective do to near slices?
    explanation: Flat and sorted is almost always more honest.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A circle should show a value twice as large. By what factor must its **radius** grow for the area to be right? To two places.
    answer:
      value: 1.41
      tolerance: 0.01
    hints:
      - The area grows with the square of the radius.
    explanation: √2 ≈ 1.41. Doubling the radius shows four times as much.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: A circle should show a value {{k}} times as big. By what factor must its radius grow?
    answer:
      value: "{{sqrt(k)}}"
    feedback:
      - when: numval(state.input) == k
        misconception: linear-area
        text: Then the area grows by {{k * k}}. Area goes with the radius squared.
    hints:
      - A circle's area grows with r².
      - Which number squared gives {{k}}?
    explanation: √{{k}} = {{sqrt(k)}}. Then the area grows by {{sqrt(k)}}² = {{k}}.
    difficulty: 2
    variants:
      params:
        k: choice[4,9,16,25,36]
      defaults:
        k: 9

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: In a bubble chart one value is three times as big. By what factor should the bubble's radius grow? To two decimals.
    answer:
      value: 1.73
      tolerance: 0.01
    hints:
      - The area should become three times as big.
      - Take the square root of 3.
    explanation: √3 ≈ 1.73. Many programs scale the radius by mistake – then the value looks 9 times as big.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Which kind of chart lets people compare values best?
    params:
      options:
        - label: Positions on a common axis – as with bars
          correct: true
        - label: Angles – as in a pie chart
          feedback: We estimate angles much less accurately.
        - label: Colour brightness
          feedback: The least accurate of all common encodings.
    hints:
      - "What can you do better: compare lengths along a line or pie slices?"
    explanation: "Experiments by Cleveland and McGill (1984): position beats length, length beats angle, angle beats area."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Experiments show that people do not judge areas linearly. An area twice as big looks only about 1.6 times as big. What follows?
    params:
      options:
        - label: Large values get underestimated in area charts
          correct: true
        - label: Lengths on a common axis are judged most accurately.
          feedback: Längen auf gemeinsamer Achse schätzt man am genauesten.
        - label: That would just overshoot the other way.
          feedback: Damit überschätzt man nur in die andere Richtung.
    hints:
      - "2 looks like 1.6: is that too much or too little?"
      - The bigger the difference, the more gets swallowed.
    explanation: Following Stevens, perceived area grows roughly with area to the power 0.7. For precise comparisons, bars or dots on an axis are better.
    difficulty: 3

srs:
  cards_from: [tasche, torte]
