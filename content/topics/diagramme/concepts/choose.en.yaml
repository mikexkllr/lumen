id: stats.dataviz.choose
type: concept
title: The right chart
summary: Which shape for which question?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: zuordnen
    widget: match
    prompt: Which chart fits the question?
    params:
      pairs:
        - { left: Parts of a whole, right: Pie chart }
        - { left: Change over time, right: Line chart }
        - { left: Comparing groups, right: Bar chart }
        - { left: Relationship of two quantities, right: Scatter plot }
    hints:
      - Time usually runs along the x-axis of a line.
    explanation: First the question, then the shape. Not the other way around.

  - kind: explain
    body: |
      A good chart answers **one question** at a glance. Lines show trends, bars show comparisons, pies show parts, but only with a few slices.

  - kind: problem
    id: temperatur
    widget: choice
    prompt: You want to show how temperature changes over a year. What do you use?
    params:
      options:
        - { label: A line chart, correct: true }
        - { label: A pie chart, feedback: "Temperatures are not parts of a whole." }
    hints:
      - Is it about a trend?
    explanation: Lines show trends and seasons at a glance.

  - kind: problem
    id: kreis
    widget: choice
    prompt: A pie chart should show 14 parties. Good idea?
    params:
      options:
        - { label: No. Nobody can compare so many thin slices., correct: true }
        - { label: "Yes, pies are always clear.", feedback: "From about five slices on, angles become hard to compare." }
    hints:
      - How well can you compare tiny slices?
    explanation: With many categories, sorted bars are much clearer.

srs:
  cards_from: [zuordnen, kreis]
