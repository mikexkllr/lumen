id: stats.dataviz.choose
type: concept
title: The right chart
summary: Which shape for which question?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: zuordnen
    widget: match
    prompt: Which chart fits the question?
    params:
      pairs:
        - { left: Parts of a whole, right: Pie chart }
        - { left: Change over time, right: Line chart }
        - { left: Comparing groups, right: Bar chart }
        - { left: Relationship of two quantities, right: Scatter plot }
    hints:
      - Time usually runs along the x-axis of a line.
    explanation: First the question, then the shape. Not the other way around.

  - kind: explain
    id: s2
    body: |
      A good **chart** answers **one question** at a glance. Lines show trends, bars show comparisons, pies show parts, but only with a few slices.

  - kind: problem
    id: temperatur
    widget: choice
    prompt: You want to show how temperature changes over a year. What do you use?
    params:
      options:
        - { label: A line chart, correct: true }
        - { label: A pie chart, feedback: "Temperatures are not parts of a whole." }
    hints:
      - Is it about a trend?
    explanation: Lines show trends and seasons at a glance.

  - kind: problem
    id: kreis
    widget: choice
    prompt: A pie chart should show 14 parties. Good idea?
    params:
      options:
        - { label: No. Nobody can compare so many thin slices., correct: true }
        - { label: "Yes, pies are always clear.", feedback: "From about five slices on, angles become hard to compare." }
    hints:
      - How well can you compare tiny slices?
    explanation: With many categories, sorted bars are much clearer.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Which chart fits best?
    params:
      buckets:
        - id: b1
          label: Line
        - id: b2
          label: Bars
        - id: b3
          label: Pie
      items:
        - label: Temperature over a year
          bucket: b1
        - label: Sales of five branches
          bucket: b2
        - label: Vote shares of three parties
          bucket: b3
        - label: Share price over ten years
          bucket: b1
        - label: Population of four cities
          bucket: b2
    hints:
      - Trend, comparison or share of the whole?
    explanation: The question determines the form.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "[[Lines]] show trends, [[bars]] show comparisons."
      distractors:
        - Pies
        - dots

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: You want to show how the heights of 500 people are distributed. Which chart fits?
    params:
      options:
        - label: A histogram – bars for height ranges
          correct: true
        - label: A pie chart
          feedback: It shows shares, not a distribution along a scale.
        - label: A line chart over time
          feedback: There is no time axis here.
    hints:
      - Values are grouped into classes, such as 160–165 cm.
    explanation: "A **histogram** shows the shape of a distribution: peak, width, skew."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: What kind of data is this?
    params:
      buckets:
        - id: b1
          label: Categories, no order
        - id: b2
          label: Ranks, no fixed gaps
        - id: b3
          label: Measurements with gaps
      items:
        - label: Favourite colour
          bucket: b1
        - label: Home town
          bucket: b1
        - label: Place in a race
          bucket: b2
        - label: "Satisfaction: good, OK, bad"
          bucket: b2
        - label: Height in cm
          bucket: b3
        - label: Waiting time in minutes
          bucket: b3
    hints:
      - Can the values be put in a sensible order?
      - Can you form sensible differences, like »3 cm more«?
    explanation: "The level of measurement decides the chart: categories as bars, measurements as histograms or scatter plots. A mean only exists for measurements."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A histogram of heights has bars 10 cm wide. You make them 1 mm wide. What happens?
    params:
      options:
        - label: The bars turn into a random jagged pattern
          correct: true
        - label: With such narrow bins only one or two values fall into each.
          feedback: Bei so schmalen Klassen fallen in jede nur ein, zwei Werte.
        - label: The bin width changes the picture a lot.
          feedback: Die Klassenbreite verändert das Bild stark.
    hints:
      - How many people land in a 1 mm bin?
      - Too wide blurs, too narrow is noise.
    explanation: "Bin width is a compromise: too wide hides the shape, too narrow shows only noise. Always try several widths."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A **box plot** shows the median, the middle 50% as a box and outliers as dots. What is it ideal for?
    params:
      options:
        - label: Comparing many groups at a glance
          correct: true
        - label: Showing a development over time
          feedback: Lines are used for that.
        - label: Showing shares of a whole
          feedback: Bars or pies are used for that.
    hints:
      - It summarises a whole distribution in five numbers.
    explanation: Ten box plots side by side show more than ten histograms – and need hardly any room.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: A stacked bar chart shows three products per year on top of each other. Which product can you compare well over the years?
    params:
      options:
        - label: Only the bottom one
          correct: true
        - label: The upper parts start at a different height every year.
          feedback: Die oberen Teile beginnen jedes Jahr auf anderer Höhe.
        - label: The top one floats on the others.
          feedback: Das oberste schwebt auf den anderen.
    hints:
      - Which part stands on a common baseline?
      - Lengths without a common start are hard to compare.
    explanation: Only the bottom piece starts at zero everywhere. For comparisons, side-by-side bars or small separate charts work better.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Twelve lines for twelve countries lie on top of each other like spaghetti. What helps most?
    params:
      options:
        - label: Twelve small charts with the same axes side by side
          correct: true
        - label: Nobody can tell twelve colours apart.
          feedback: Zwölf Farben kann niemand auseinanderhalten.
        - label: 3D hides even more.
          feedback: 3D verdeckt noch mehr.
    hints:
      - The same axes make pictures comparable.
      - The principle is called small multiples.
    explanation: Small multiples show each country on its own – with the same scale the comparison stays honest. One country can be highlighted in colour.
    difficulty: 3

srs:
  cards_from: [zuordnen, kreis]
