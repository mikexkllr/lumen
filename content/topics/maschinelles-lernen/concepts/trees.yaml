id: ai.ml.trees
type: concept
title: Entscheidungsbäume
summary: Eine Frage nach der anderen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Beim Spiel »Wer bin ich?« – welche erste Frage ist am klügsten?
    params:
      options:
        - label: Eine, die die Möglichkeiten etwa halbiert
          correct: true
        - label: Eine, die nur auf eine Person passt
          feedback: Meist lautet die Antwort Nein – und du weißt kaum mehr.
        - label: Irgendeine
          feedback: Gute Fragen sparen viele Runden.
    hints:
      - Welche Antwort hilft dir in jedem Fall weiter?
    explanation: Genau so wählt ein Entscheidungsbaum seine Fragen.


  - kind: explain
    id: s1
    body: |
      Ein **Entscheidungsbaum** stellt Ja-Nein-Fragen hintereinander, bis eine Antwort feststeht. Beim Lernen sucht er die Fragen, die die Beispiele am saubersten trennen.

  - kind: problem
    id: weg
    widget: network
    prompt: Eine Frucht ist rund, rot und klein. Tippe ihren Weg durch den Baum.
    params:
      start: q1
      end: kirsche
      aspect: 0.7
      nodes:
        - { id: q1, x: 50, y: 6, label: rund? }
        - { id: banane, x: 15, y: 44, label: Banane }
        - { id: q2, x: 70, y: 44, label: rot? }
        - { id: orange, x: 92, y: 94, label: Orange }
        - { id: q3, x: 48, y: 72, label: klein? }
        - { id: kirsche, x: 30, y: 96, label: Kirsche }
        - { id: apfel, x: 66, y: 96, label: Apfel }
      edges:
        - { a: q1, b: banane }
        - { a: q1, b: q2 }
        - { a: q2, b: orange }
        - { a: q2, b: q3 }
        - { a: q3, b: kirsche }
        - { a: q3, b: apfel }
    hints:
      - Rund – ja. Rot – ja. Klein – ja.
    explanation: rund? → rot? → klein? → Kirsche. Drei Fragen, eine Antwort.

  - kind: problem
    id: fragen
    widget: numeric
    prompt: Jede Ja-Nein-Frage halbiert die Möglichkeiten. Wie viele Fragen braucht ein Baum mindestens für {{2 ** k}} Klassen?
    params: { unit: Fragen }
    answer: { value: "{{k}}" }
    hints:
      - "2, 4, 8, 16 … – wie oft verdoppeln?"
    explanation: "$2^{ {{k}} } = {{2 ** k}}$ – also {{k}} Fragen."
    variants:
      params: { k: "int[3,7]" }
      defaults: { k: 4 }

  - kind: problem
    id: banken
    widget: choice
    prompt: Banken nutzen für Kredite gern Entscheidungsbäume. Warum?
    params:
      options:
        - { label: Man kann jede Entscheidung nachvollziehen., correct: true }
        - { label: Sie sind immer die genauesten Modelle., feedback: "Andere Modelle sind oft genauer – aber schwer zu erklären." }
    hints:
      - Was muss die Bank erklären, wenn sie Nein sagt?
    explanation: Ein Baum ist eine Kette von Regeln, die man lesen kann.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein einzelner Entscheidungsbaum irrt sich leicht. Was machen »Random Forests« besser?
    params:
      options:
        - label: Viele verschiedene Bäume stimmen ab – ihre Fehler gleichen sich aus
          correct: true
        - label: Sie nutzen einen besonders tiefen Baum
          feedback: Tiefe Bäume lernen eher auswendig.
        - label: Sie raten zufällig
          feedback: Zufall steckt nur im Aufbau der Bäume.
    hints:
      - Warum fragt man bei schwierigen Fragen mehrere Leute?
    explanation: "Die »Weisheit der Vielen« für Modelle: ein **Ensemble**. Es zählt zu den zuverlässigsten Verfahren überhaupt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die **Entropie** misst, wie gemischt eine Gruppe ist. Bei zwei gleich häufigen Klassen ist sie 1 Bit, bei nur einer Klasse 0. Eine Frage teilt eine 50/50-Gruppe in zwei völlig reine Hälften. Wie viele Bit Information gewinnt man?
    answer:
      value: 1
    hints:
      - Vorher 1 Bit, nachher 0.
    explanation: 1 Bit – der größtmögliche Gewinn. Der Baum wählt immer die Frage mit dem höchsten **Informationsgewinn**.
    difficulty: 3

srs:
  cards_from: [weg, banken]
