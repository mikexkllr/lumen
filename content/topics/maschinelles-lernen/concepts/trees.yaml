id: ai.ml.trees
type: concept
title: Entscheidungsbäume
summary: Eine Frage nach der anderen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Rate-Baum
    body: "Denk dir eines der vier Tiere aus. Der Baum errät es mit **Ja-Nein-Fragen**: Links heißt ja, rechts heißt nein. Tippe dich von oben nach unten durch. Landest du bei deinem Tier?"
    visual:
      widget: network
      interactive: true
      params:
        start: q1
        aspect: 0.7
        nodes:
          - id: q1
            x: 50
            y: 6
            label: fliegt?
          - id: q2
            x: 25
            y: 50
            label: nachtaktiv?
          - id: q3
            x: 75
            y: 50
            label: Fell?
          - id: eule
            x: 10
            y: 94
            label: Eule
          - id: spatz
            x: 38
            y: 94
            label: Spatz
          - id: hund
            x: 64
            y: 94
            label: Hund
          - id: fisch
            x: 90
            y: 94
            label: Fisch
        edges:
          - a: q1
            b: q2
          - a: q1
            b: q3
          - a: q2
            b: eule
          - a: q2
            b: spatz
          - a: q3
            b: hund
          - a: q3
            b: fisch

  - kind: problem
    id: hook
    widget: choice
    prompt: Beim Spiel »Wer bin ich?« – welche erste Frage ist am klügsten?
    params:
      options:
        - label: Eine, die die Möglichkeiten etwa halbiert
          correct: true
        - label: Eine, die nur auf eine Person passt
          feedback: Meist lautet die Antwort Nein – und du weißt kaum mehr.
        - label: Irgendeine
          feedback: Gute Fragen sparen viele Runden.
    hints:
      - Welche Antwort hilft dir in jedem Fall weiter?
    explanation: Genau so wählt ein Entscheidungsbaum seine Fragen.

  - kind: explain
    id: s1
    body: |
      Ein **Entscheidungsbaum** stellt Ja-Nein-Fragen hintereinander, bis eine Antwort feststeht. Beim Lernen sucht er die Fragen, die die Beispiele am saubersten trennen.

  - kind: problem
    id: weg
    widget: network
    prompt: Eine Frucht ist rund, rot und klein. Tippe ihren Weg durch den Baum.
    params:
      start: q1
      end: kirsche
      aspect: 0.7
      nodes:
        - { id: q1, x: 50, y: 6, label: rund? }
        - { id: banane, x: 15, y: 44, label: Banane }
        - { id: q2, x: 70, y: 44, label: rot? }
        - { id: orange, x: 92, y: 94, label: Orange }
        - { id: q3, x: 48, y: 72, label: klein? }
        - { id: kirsche, x: 30, y: 96, label: Kirsche }
        - { id: apfel, x: 66, y: 96, label: Apfel }
      edges:
        - { a: q1, b: banane }
        - { a: q1, b: q2 }
        - { a: q2, b: orange }
        - { a: q2, b: q3 }
        - { a: q3, b: kirsche }
        - { a: q3, b: apfel }
    hints:
      - Rund – ja. Rot – ja. Klein – ja.
    explanation: rund? → rot? → klein? → Kirsche. Drei Fragen, eine Antwort.

  - kind: problem
    id: fragen
    widget: numeric
    prompt: Jede Ja-Nein-Frage halbiert die Möglichkeiten. Wie viele Fragen braucht ein Baum mindestens für {{2 ** k}} Klassen?
    params: { unit: Fragen }
    answer: { value: "{{k}}" }
    hints:
      - "2, 4, 8, 16 … – wie oft verdoppeln?"
    explanation: "$2^{ {{k}} } = {{2 ** k}}$ – also {{k}} Fragen."
    variants:
      params: { k: "int[3,7]" }
      defaults: { k: 4 }

  - kind: problem
    id: banken
    widget: choice
    prompt: Banken nutzen für Kredite gern Entscheidungsbäume. Warum?
    params:
      options:
        - { label: Man kann jede Entscheidung nachvollziehen., correct: true }
        - { label: Sie sind immer die genauesten Modelle., feedback: "Andere Modelle sind oft genauer – aber schwer zu erklären." }
    hints:
      - Was muss die Bank erklären, wenn sie Nein sagt?
    explanation: Ein Baum ist eine Kette von Regeln, die man lesen kann.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein einzelner Entscheidungsbaum irrt sich leicht. Was machen »Random Forests« besser?
    params:
      options:
        - label: Viele verschiedene Bäume stimmen ab – ihre Fehler gleichen sich aus
          correct: true
        - label: Sie nutzen einen besonders tiefen Baum
          feedback: Tiefe Bäume lernen eher auswendig.
        - label: Sie raten zufällig
          feedback: Zufall steckt nur im Aufbau der Bäume.
    hints:
      - Warum fragt man bei schwierigen Fragen mehrere Leute?
    explanation: "Die »Weisheit der Vielen« für Modelle: ein **Ensemble**. Es zählt zu den zuverlässigsten Verfahren überhaupt."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Die **Gini-Unreinheit** einer Gruppe ist 1 minus die Summe der quadrierten Anteile. Eine Gruppe ist zu 80 % Äpfel und zu 20 % Birnen. Wie groß ist sie?
    answer:
      value: 0.32
      tolerance: 0.001
    hints:
      - "Quadrate: 0,8² = 0,64 und 0,2² = 0,04."
      - 1 − 0,68 = ?
    explanation: 0,32. Eine reine Gruppe hat 0, halb-halb hat 0,5. Ein Baum wählt die Frage, nach der die Gruppen im Schnitt am **reinsten** sind.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Baum darf beliebig tief wachsen. Am Ende steht jedes Trainingsbeispiel allein in einem Blatt. Was ist die Folge?
    params:
      options:
        - label: 100 % im Training – aber schlechte Ergebnisse bei neuen Daten.
          correct: true
        - label: Das perfekte Modell.
          feedback: Es hat jedes Rauschen mitgelernt und verallgemeinert schlecht.
        - label: Der Baum kann nichts mehr entscheiden.
          feedback: Er entscheidet – nur nach Zufälligkeiten der Trainingsdaten.
    hints:
      - Was hat der Baum gelernt, wenn jedes Blatt nur ein Beispiel enthält?
      - Wie sieht es bei neuen Beispielen aus?
    explanation: Das ist **Überanpassung**. Dagegen hilft eine Höchsttiefe, eine Mindestzahl Beispiele pro Blatt – oder viele Bäume, die abstimmen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die **Entropie** misst, wie gemischt eine Gruppe ist. Bei zwei gleich häufigen Klassen ist sie 1 Bit, bei nur einer Klasse 0. Eine Frage teilt eine 50/50-Gruppe in zwei völlig reine Hälften. Wie viele Bit Information gewinnt man?
    answer:
      value: 1
    hints:
      - Vorher 1 Bit, nachher 0.
    explanation: 1 Bit – der größtmögliche Gewinn. Der Baum wählt immer die Frage mit dem höchsten **Informationsgewinn**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Eine Gruppe besteht zu 75 % aus Klasse A und zu 25 % aus Klasse B. Wie groß ist ihre Entropie in Bit? Auf zwei Stellen. (log₂ 0,75 ≈ −0,415)
    answer:
      value: 0.81
      tolerance: 0.01
    hints:
      - Entropie = −(0,75 · log₂ 0,75 + 0,25 · log₂ 0,25).
      - log₂ 0,25 = −2. Also 0,75 · 0,415 + 0,25 · 2.
    explanation: 0,311 + 0,5 ≈ 0,81 Bit – weniger als 1 Bit bei halb-halb. Der **Informationsgewinn** einer Frage ist die Entropie vorher minus die gewichtete Entropie nachher.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Entscheidungsbaum seine Fragen auswählt.
    params:
      keywords:
        - - frage
          - question
        - - trenn
          - teil
          - split
          - separat
        - - rein
          - sauber
          - gemischt
          - pure
          - clean
          - mixed
      sample: Der Baum probiert viele mögliche Fragen aus. Er nimmt die, die die Beispiele am saubersten trennt, sodass die Gruppen danach möglichst rein sind. Dann wiederholt er das in jeder Gruppe.
    difficulty: 3

srs:
  cards_from: [weg, banken]
