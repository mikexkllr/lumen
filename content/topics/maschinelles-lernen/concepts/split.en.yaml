id: ai.ml.split
type: concept
title: Testing fairly
summary: Training and test data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The secret exam
    body: Each square is a labeled photo. Before a model learns, you put some **aside** – it never sees them. Tap the photos you hold back. How many would you pick?
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 4
        cols: 5
        counter: true

  - kind: problem
    id: gleiche
    widget: choice
    prompt: A model is tested on exactly the examples it was trained on. What does that measure?
    params:
      options:
        - { label: "Mostly how well it memorized", correct: true }
        - { label: How well it solves new cases, feedback: "It has not seen any new cases there." }
    hints:
      - Would you call an exam made of the practice problems fair?
    explanation: Only unseen examples show whether the model generalizes.

  - kind: explain
    id: s2
    body: |
      So you split the data. About **80%** is used for **training**, and you hold back the other **20%**. Only at the very end do you test with it, like an exam with new questions.

  - kind: problem
    id: teilen
    widget: numeric
    prompt: You have {{n}} labeled photos and split them 80 to 20. How many go into training?
    params: { unit: photos }
    answer: { value: "{{n * 4 / 5}}" }
    hints:
      - "80% of {{n}}."
    explanation: "{{n * 4 / 5}} for training, {{n / 5}} for testing."
    variants:
      params: { n: "choice[500,1000,2500,5000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: zukunft
    widget: choice
    prompt: A model predicts sales. Why test it on the most recent months instead of randomly chosen ones?
    params:
      options:
        - { label: "That checks whether it also works for the future.", correct: true }
        - { label: New data is more accurate., feedback: "The point is to mimic real use: predicting the future." }
    hints:
      - What will the model be used for later?
    explanation: The test should look like the later use.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order the way to a fairly tested model.
    params:
      items:
        - label: Collect data
        - label: Split into training and test
        - label: Learn with the training part only
        - label: Check with the test part at the end
    hints:
      - The test part stays untouched until the end.
    explanation: Whoever already knows the exam questions is not tested fairly.

  - kind: problem
    id: mix-c2
    widget: numeric
    prompt: You have 500 examples and hold back 20% for the test. How many examples is that?
    answer:
      value: 100
    hints:
      - A fifth of 500.
    explanation: 100 for testing, 400 for learning.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: You split your data 80 to 20. Each piece is one tenth. Shade the part the model **trains** on.
    params:
      parts: 10
      shape: bar
    answer:
      fraction: 4/5
    hints:
      - One tenth is 10 %.
      - For 80 % you shade 8 of the 10 pieces.
    explanation: 8 of 10 pieces are 80 %. The other 2 pieces, that is 20 %, stay back for the test.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A team tries 50 settings and picks the one with the best result on the **test data**. What is the problem?
    params:
      options:
        - label: The test data were used for selection – the result is now too optimistic
          correct: true
        - label: There is none
          feedback: Indirectly they trained on the test data this way.
        - label: 50 attempts are too few
          feedback: The number is not the problem but what you measure against.
    hints:
      - May test data influence decisions?
    explanation: "That is why there are three parts: training, **validation** for selecting and an untouched test."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: You split {{n}} examples into 70 % training, 15 % validation and 15 % test. How many end up in validation?
    answer:
      value: "{{n * 15 / 100}}"
    hints:
      - 15 % of {{n}}.
      - Compute {{n}} · 0.15.
    explanation: "{{n * 15 / 100}} examples. The validation set is used to choose settings. The test set stays untouched until the very end."
    difficulty: 2
    variants:
      params:
        n: step[1000,5000,1000]
      defaults:
        n: 2000

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: In 5-fold cross-validation you split the data into 5 parts. Each part serves once as the test part. How many times is the model trained?
    answer:
      value: 5
    hints:
      - Each test part needs its own training run.
      - How many parts are there?
    explanation: Five times, each with 4/5 of the data. The average of the five results varies less than a single test. That helps especially with small datasets.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A data set on loan defaults contains a column “reminders sent”. The model becomes perfect with it. What is fishy?
    params:
      options:
        - label: The column only arises **after** the default – at decision time it does not exist
          correct: true
        - label: Nothing – that is a very good feature
          feedback: It gives away the answer.
        - label: The column is too short
          feedback: Length is irrelevant.
    hints:
      - What information does the bank have **before** granting the loan?
    explanation: "A **data leak**: knowledge from the future gets into training. In deployment the model is then worthless."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: A dataset has several X-rays per patient. All images are shuffled and split at random. The model looks excellent. What is fishy?
    params:
      options:
        - label: Images of the same person are in both training and test – the model recognises the person again.
          correct: true
        - label: Nothing – random splits are always right.
          feedback: Only if the examples are independent. Here they are not.
        - label: The test set is too small.
          feedback: Size is not the problem – the overlap is.
    hints:
      - What do two images of the same person share?
      - You should split by patient, not by image.
    explanation: This is data leakage. The test then measures recognition instead of generalisation. You split by patient, place or time – the way the model will be used later.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why test data is held back until the very end.
    params:
      keywords:
        - - neu
          - ungesehen
          - nie gesehen
          - new
          - unseen
          - never seen
        - - auswendig
          - merken
          - memoris
          - memoriz
        - - klausur
          - ehrlich
          - fair
          - exam
          - honest
      sample: Test data is like an exam with new questions. If the model has never seen it, the test shows whether it generalises or only memorised. Peeking beforehand makes the test unfair.
    difficulty: 3

srs:
  cards_from: [gleiche, teilen]
