id: ai.ml.metrics
type: concept
title: Gut oder nur Glück?
summary: Trefferquote und ihre Fallen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Nadel im Heuhaufen
    body: "Banken jagen Betrug mit KI. Doch Betrug ist **selten**. Zieh 100 Zahlungen: Wie viele Betrugsfälle findest du? Was müsste ein gutes Modell hier leisten?"
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: echt
            weight: 98
          - label: Betrug
            weight: 2
        sample:
          - 10
          - 100

  - kind: problem
    id: quote
    widget: numeric
    prompt: Ein Modell liegt bei {{k}} von {{n}} Testfällen richtig. Wie hoch ist die Trefferquote?
    params: { unit: "%" }
    answer: { value: "{{p}}" }
    hints:
      - Richtige geteilt durch alle, mal 100.
    explanation: "{{k}} : {{n}} = {{p}} %."
    variants:
      params: { n: "choice[50,200,400]", p: "choice[70,85,90,95]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 200, p: 90 }

  - kind: problem
    id: falle
    widget: choice
    prompt: Nur 1 % aller Zahlungen sind Betrug. Ein Modell sagt einfach immer »kein Betrug«. Wie gut ist es?
    params:
      options:
        - { label: 99 % Trefferquote – und trotzdem nutzlos, correct: true }
        - { label: Ein sehr gutes Modell, feedback: "Es findet keinen einzigen Betrug." }
    hints:
      - Wie viele Betrugsfälle findet es?
    explanation: Bei seltenen Ereignissen täuscht die Trefferquote gewaltig.

  - kind: explain
    id: s3
    body: |
      Darum misst man zusätzlich: Wie viele **echte Fälle** findet das Modell (Trefferrate)? Und wie viele seiner **Alarme** stimmen (Genauigkeit)? Ein guter Detektor braucht beides.

  - kind: problem
    id: gefunden
    widget: numeric
    prompt: Von {{n}} echten Betrugsfällen findet das Modell {{k}}. Welcher Anteil wird gefunden?
    params: { unit: "%" }
    answer: { value: "{{p}}" }
    hints:
      - "{{k}} geteilt durch {{n}}."
    explanation: "{{k}} : {{n}} = {{p}} % Trefferrate."
    variants:
      params: { n: "choice[20,50]", p: "choice[40,60,80,90]" }
      derive: { k: "n * p / 100" }
      defaults: { n: 50, p: 60 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Modell meldet 50 Betrugsfälle, 30 davon sind echt. Insgesamt gab es 40 echte Fälle. Wie hoch ist die **Genauigkeit** seiner Alarme in Prozent?
    params:
      unit: "%"
    answer:
      value: 60
    hints:
      - Wie viele der 50 Alarme stimmen?
    explanation: 30 von 50 = 60 %. Die Trefferrate wäre 30 von 40 = 75 %.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Von 10 000 Zahlungen sind 1 % Betrug. Ein Modell findet 90 % davon. Bei den echten Zahlungen schlägt es in 5 % der Fälle falsch Alarm. Wie viel Prozent seiner Alarme sind echter Betrug? Auf eine Stelle.
    answer:
      value: 15.4
      tolerance: 0.2
    feedback:
      - when: numval(state.input) == 90
        misconception: recall-vs-precision
        text: Das ist die Trefferrate. Gefragt ist, wie viele **Alarme** stimmen.
    hints:
      - "Echte Treffer: 90 % von 100 = 90. Fehlalarme: 5 % von 9900 = 495."
      - 90 / (90 + 495) = ?
    explanation: 90 / 585 ≈ 15,4 %. Weil Betrug **selten** ist, überwiegen selbst bei einem guten Modell die Fehlalarme. Die Grundrate entscheidet mit.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Das Modell schlägt erst ab einer höheren Wahrscheinlichkeit Alarm. Was passiert typischerweise?
    params:
      options:
        - label: Weniger Fehlalarme, aber auch mehr übersehene Betrugsfälle.
          correct: true
        - label: Alles wird besser.
          feedback: Eine Schwelle verschiebt nur den Kompromiss – sie macht das Modell nicht klüger.
        - label: Mehr Alarme.
          feedback: Eine höhere Schwelle bedeutet weniger Alarme.
    hints:
      - Wer seltener Alarm schlägt, irrt sich seltener beim Alarm – aber?
      - Was passiert mit Fällen knapp unter der neuen Schwelle?
    explanation: "Genauigkeit steigt, Trefferrate sinkt. Wo die **Schwelle** liegt, hängt von den Kosten ab: Ist Übersehen teurer als ein Fehlalarm – oder umgekehrt?"
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum reicht »99 % Trefferquote« nicht, um ein Modell gut zu nennen?"
    params:
      keywords:
        - - selten
          - rare
          - wenige
          - few
          - ungleich
          - unbalanced
          - imbalanc
        - - immer
          - always
          - einfach
          - simply
          - nie
          - never
        - - finden
          - übersieht
          - findet
          - find
          - miss
          - detect
          - erkennen
      sample: Wenn das Gesuchte selten ist, etwa 1 % Betrug, erreicht ein Modell 99 %, indem es einfach immer »kein Betrug« sagt. Es übersieht dann aber jeden echten Fall und ist nutzlos.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein Modell hat eine AUC von 0,9. Was bedeutet das?
    params:
      options:
        - label: Ein zufälliger Betrugsfall bekommt mit 90 % Wahrscheinlichkeit eine höhere Punktzahl als eine zufällige echte Zahlung.
          correct: true
        - label: 90 % aller Vorhersagen stimmen.
          feedback: Das wäre die Trefferquote – die hängt von der gewählten Schwelle ab.
        - label: 90 % der Alarme sind echt.
          feedback: Das wäre die Genauigkeit bei einer bestimmten Schwelle.
    hints:
      - Die AUC bewertet die Rangfolge der Punktzahlen, nicht eine einzelne Schwelle.
      - Ziehe einen Betrugsfall und eine echte Zahlung. Wer liegt vorn?
    explanation: Die **AUC** misst, wie gut das Modell sortiert – über alle Schwellen hinweg. 0,5 ist Raten, 1 ist perfekt. Bei seltenen Fällen kann aber auch eine hohe AUC viele Fehlalarme bedeuten.
    difficulty: 3

srs:
  cards_from: [falle, gefunden]
