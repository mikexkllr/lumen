id: ai.ml.examples
type: concept
title: Aus Beispielen lernen
summary: Merkmale und Labels.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: spam
    widget: choice
    prompt: Wie lernt ein Spamfilter, was Spam ist?
    params:
      options:
        - { label: "Aus vielen E-Mails, die schon als Spam oder nicht markiert sind", correct: true }
        - { label: Jemand schreibt alle Regeln von Hand, feedback: "So fing man an – aber Spammer ändern ihre Tricks schneller, als man Regeln schreibt." }
    hints:
      - Woher kennt der Filter die richtige Antwort?
    explanation: Das ist **überwachtes Lernen** – Beispiele mit bekannter Antwort.

  - kind: explain
    body: |
      Jedes Beispiel hat **Merkmale** – das, was man messen kann – und ein **Label**, die richtige Antwort. Das Modell sucht Regeln, die von den Merkmalen auf das Label schließen.

  - kind: problem
    id: merkmale
    widget: buckets
    prompt: Ein Modell soll Äpfel von Birnen unterscheiden. Merkmal oder Label?
    params:
      buckets: [{ label: Merkmal }, { label: Label }]
      items:
        - { label: Gewicht, bucket: Merkmal }
        - { label: Farbe, bucket: Merkmal }
        - { label: Form, bucket: Merkmal }
        - { label: Apfel oder Birne, bucket: Label }
    hints:
      - Was soll das Modell am Ende sagen?
    explanation: Gewicht, Farbe und Form beschreiben die Frucht – das Label ist die Antwort.

  - kind: problem
    id: vielfalt
    widget: choice
    prompt: Ein Modell sah nur rote Äpfel. Was passiert bei einem grünen?
    params:
      options:
        - { label: Es irrt sich womöglich., correct: true }
        - { label: Es erkennt ihn sicher., feedback: "Was nie in den Beispielen vorkam, kennt das Modell nicht." }
    hints:
      - Was hat das Modell über Farbe gelernt?
    explanation: Gute Daten sind nicht nur viele, sondern auch vielfältige Beispiele.

srs:
  cards_from: [spam, merkmale]
