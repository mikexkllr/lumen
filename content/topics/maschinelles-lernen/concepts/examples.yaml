id: ai.ml.examples
type: concept
title: Aus Beispielen lernen
summary: Merkmale und Labels.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: spam
    widget: choice
    prompt: Wie lernt ein Spamfilter, was Spam ist?
    params:
      options:
        - { label: "Aus vielen E-Mails, die schon als Spam oder nicht markiert sind", correct: true }
        - { label: Jemand schreibt alle Regeln von Hand, feedback: "So fing man an – aber Spammer ändern ihre Tricks schneller, als man Regeln schreibt." }
    hints:
      - Woher kennt der Filter die richtige Antwort?
    explanation: Das ist **überwachtes Lernen** – Beispiele mit bekannter Antwort.

  - kind: explain
    id: s2
    body: |
      Jedes Beispiel hat **Merkmale** – das, was man messen kann – und ein **Label**, die richtige Antwort. Das Modell sucht Regeln, die von den Merkmalen auf das Label schließen.

  - kind: problem
    id: merkmale
    widget: buckets
    prompt: Ein Modell soll Äpfel von Birnen unterscheiden. Merkmal oder Label?
    params:
      buckets: [{ label: Merkmal }, { label: Label }]
      items:
        - { label: Gewicht, bucket: Merkmal }
        - { label: Farbe, bucket: Merkmal }
        - { label: Form, bucket: Merkmal }
        - { label: Apfel oder Birne, bucket: Label }
    hints:
      - Was soll das Modell am Ende sagen?
    explanation: Gewicht, Farbe und Form beschreiben die Frucht – das Label ist die Antwort.

  - kind: problem
    id: vielfalt
    widget: choice
    prompt: Ein Modell sah nur rote Äpfel. Was passiert bei einem grünen?
    params:
      options:
        - { label: Es irrt sich womöglich., correct: true }
        - { label: Es erkennt ihn sicher., feedback: "Was nie in den Beispielen vorkam, kennt das Modell nicht." }
    hints:
      - Was hat das Modell über Farbe gelernt?
    explanation: Gute Daten sind nicht nur viele, sondern auch vielfältige Beispiele.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Spamfilter, der aus markierten Mails lernt
          right: true
        - text: Ein Taschenrechner
          right: false
          why: Seine Regeln hat ein Mensch fest programmiert.
        - text: Eine App, die Pflanzen auf Fotos erkennt
          right: true
        - text: Eine Ampel mit festem Zeitplan
          right: false
      left: Kein Lernen
      right: Maschinelles Lernen

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: "Ein Modell lernt, indem es eine Trennlinie verschiebt. Mach es von Hand: Finde eine Linie mit höchstens 2 Fehlern."
    params:
      scene: neuron
    answer:
      errors:
        - 0
        - 2
    explanation: Genau das tut ein Lernverfahren – nur Tausende Male und ganz ohne Hände.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Modell bekommt Fotos **ohne** Labels und soll selbst Gruppen finden. Wie heißt das?
    params:
      options:
        - label: Unüberwachtes Lernen
          correct: true
        - label: Überwachtes Lernen
          feedback: Dafür bräuchte es Labels.
        - label: Bestärkendes Lernen
          feedback: Dort lernt man aus Belohnungen.
    hints:
      - Niemand sagt ihm die richtige Antwort.
    explanation: Es sucht Struktur in den Daten selbst – etwa Kundengruppen oder Themen in Texten.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: buckets
    prompt: Soll das Modell eine Klasse wählen oder eine Zahl schätzen?
    params:
      buckets:
        - id: b1
          label: Klasse (Klassifikation)
        - id: b2
          label: Zahl (Regression)
      items:
        - label: Ist diese Mail Spam?
          bucket: b1
        - label: Was kostet dieses Haus?
          bucket: b2
        - label: Wie warm wird es morgen?
          bucket: b2
        - label: Welche Ziffer von 0 bis 9 ist das?
          bucket: b1
    hints:
      - Gibt es feste Antworten zur Auswahl oder beliebige Werte?
      - Auch Ziffern sind hier Klassen – man rechnet nicht mit ihnen.
    explanation: "**Klassifikation** wählt aus festen Antworten, Regression schätzt eine Zahl. Beides ist überwachtes Lernen mit Labels."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Ein Modell sagt 3 und 5 voraus, richtig wären 4 und 7. Wie groß ist der mittlere quadratische Fehler?
    answer:
      value: 2.5
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 1.5
        misconception: no-square
        text: Das ist der mittlere Fehler ohne Quadrieren.
    hints:
      - "Fehler: 1 und 2. Quadriere sie."
      - (1 + 4) / 2 = ?
    explanation: (1² + 2²) / 2 = 2,5. Diese **Verlustfunktion** sagt dem Training, wie schlecht das Modell gerade ist. Lernen heißt, sie kleiner zu machen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das »No Free Lunch«-Theorem sagt sinngemäß …?
    params:
      options:
        - label: Kein Lernverfahren ist für alle denkbaren Probleme das beste – es kommt auf die Annahmen an
          correct: true
        - label: Maschinelles Lernen ist immer teuer
          feedback: Es geht nicht um Kosten.
        - label: Mehr Daten helfen nie
          feedback: Meist helfen sie sehr.
    hints:
      - Jedes Verfahren macht stillschweigend Annahmen über die Welt.
    explanation: Lernen heißt verallgemeinern, und das geht nur mit Vorannahmen – dem **induktiven Bias**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Warum quadriert man Fehler oft, statt nur ihren Betrag zu nehmen?
    params:
      options:
        - label: Große Fehler zählen dann viel stärker – und die Rechnung ist glatt und leicht abzuleiten.
          correct: true
        - label: Weil Quadrate immer kleiner sind.
          feedback: 3² = 9 ist größer als 3. Nur Fehler unter 1 schrumpfen.
        - label: Das hat keinen Grund.
          feedback: Die Wahl ändert, was das Modell lernt – etwa bei Ausreißern.
    hints:
      - Vergleiche einen Fehler von 1 mit einem von 10 – vor und nach dem Quadrieren.
      - Was passiert dann mit Ausreißern?
    explanation: Der quadratische Fehler bestraft große Abweichungen hart und reagiert darum stark auf **Ausreißer**. Der Betrag ist robuster. Welche Verlustfunktion passt, hängt von der Aufgabe ab.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was Merkmale und Labels sind – am Beispiel eines Spamfilters.
    params:
      keywords:
        - - merkmal
          - feature
        - - label
          - antwort
          - answer
        - - spam
          - mail
          - email
      sample: "Merkmale sind, was man an einer Mail messen kann, etwa Wörter oder Absender. Das Label ist die richtige Antwort: Spam oder kein Spam. Das Modell lernt, von den Merkmalen auf das Label zu schließen."
    difficulty: 3

srs:
  cards_from: [spam, merkmale]
