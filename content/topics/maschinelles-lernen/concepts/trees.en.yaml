id: ai.ml.trees
type: concept
title: Decision trees
summary: One question after another.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: In the game “Who am I?” – which first question is smartest?
    params:
      options:
        - label: One that roughly halves the possibilities
          correct: true
        - label: One that fits only one person
          feedback: Usually the answer is no – and you hardly know more.
        - label: Any
          feedback: Good questions save many rounds.
    hints:
      - Which answer helps you either way?
    explanation: That is exactly how a decision tree picks its questions.

  - kind: explain
    id: s1
    body: |
      A **decision tree** asks yes-no questions one after another until an answer is settled. When learning, it looks for the questions that separate the examples most cleanly.

  - kind: problem
    id: weg
    widget: network
    prompt: A fruit is round, red and small. Tap its path through the tree.
    params:
      start: q1
      end: kirsche
      aspect: 0.7
      nodes:
        - { id: q1, x: 50, y: 6, label: "round?" }
        - { id: banane, x: 15, y: 44, label: Banana }
        - { id: q2, x: 70, y: 44, label: "red?" }
        - { id: orange, x: 92, y: 94, label: Orange }
        - { id: q3, x: 48, y: 72, label: "small?" }
        - { id: kirsche, x: 30, y: 96, label: Cherry }
        - { id: apfel, x: 66, y: 96, label: Apple }
      edges:
        - { a: q1, b: banane }
        - { a: q1, b: q2 }
        - { a: q2, b: orange }
        - { a: q2, b: q3 }
        - { a: q3, b: kirsche }
        - { a: q3, b: apfel }
    hints:
      - Round, yes. Red, yes. Small, yes.
    explanation: "round? → red? → small? → cherry. Three questions, one answer."

  - kind: problem
    id: fragen
    widget: numeric
    prompt: Each yes-no question halves the possibilities. What is the minimum number of questions a tree needs for {{2 ** k}} classes?
    params: { unit: questions }
    answer: { value: "{{k}}" }
    hints:
      - "2, 4, 8, 16 … how often do you double?"
    explanation: "$2^{ {{k}} } = {{2 ** k}}$, so {{k}} questions."
    variants:
      params: { k: "int[3,7]" }
      defaults: { k: 4 }

  - kind: problem
    id: banken
    widget: choice
    prompt: Banks like to use decision trees for loans. Why?
    params:
      options:
        - { label: You can trace every decision., correct: true }
        - { label: They are always the most accurate models., feedback: "Other models are often more accurate, but hard to explain." }
    hints:
      - What must the bank explain when it says no?
    explanation: A tree is a chain of rules that you can read.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A single decision tree errs easily. What do “random forests” do better?
    params:
      options:
        - label: Many different trees vote – their errors cancel out
          correct: true
        - label: They use one especially deep tree
          feedback: Deep trees rather memorise.
        - label: They guess at random
          feedback: Randomness is only in how the trees are built.
    hints:
      - Why do you ask several people about hard questions?
    explanation: "The “wisdom of crowds” for models: an **ensemble**. It ranks among the most reliable methods of all."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: The Gini impurity of a group is 1 minus the sum of the squared shares. A group is 80 % apples and 20 % pears. How large is it?
    answer:
      value: 0.32
      tolerance: 0.001
    hints:
      - "Squares: 0.8² = 0.64 and 0.2² = 0.04."
      - 1 − 0.68 = ?
    explanation: 0.32. A pure group has 0, half-and-half has 0.5. A tree picks the question after which the groups are purest on average.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: A tree may grow as deep as it likes. In the end every training example sits alone in its own leaf. What is the result?
    params:
      options:
        - label: 100 % in training – but poor results on new data.
          correct: true
        - label: The perfect model.
          feedback: It learned every bit of noise and generalises poorly.
        - label: The tree can no longer decide anything.
          feedback: It decides – but based on quirks of the training data.
    hints:
      - What has the tree learned if each leaf holds just one example?
      - What about new examples?
    explanation: This is overfitting. A maximum depth, a minimum number of examples per leaf – or many trees that vote – help against it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "**Entropy** measures how mixed a group is. For two equally frequent classes it is 1 bit, for a single class 0. One question splits a 50/50 group into two completely pure halves. How many bits of information are gained?"
    answer:
      value: 1
    hints:
      - Before 1 bit, after 0.
    explanation: 1 bit – the largest possible gain. The tree always picks the question with the highest **information gain**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A group is 75 % class A and 25 % class B. What is its entropy in bits? To two decimals. (log₂ 0.75 ≈ −0.415)
    answer:
      value: 0.81
      tolerance: 0.01
    hints:
      - Entropy = −(0.75 · log₂ 0.75 + 0.25 · log₂ 0.25).
      - log₂ 0.25 = −2. So 0.75 · 0.415 + 0.25 · 2.
    explanation: 0.311 + 0.5 ≈ 0.81 bits – less than the 1 bit of a 50–50 split. The information gain of a question is the entropy before minus the weighted entropy after.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a decision tree chooses its questions.
    params:
      keywords:
        - - frage
          - question
        - - trenn
          - teil
          - split
          - separat
        - - rein
          - sauber
          - gemischt
          - pure
          - clean
          - mixed
      sample: The tree tries many possible questions. It takes the one that splits the examples most cleanly, so the groups afterwards are as pure as possible. Then it repeats this in each group.
    difficulty: 3

srs:
  cards_from: [weg, banken]
