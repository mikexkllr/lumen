id: ai.ml.examples
type: concept
title: Learning from examples
summary: Features and labels.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: spam
    widget: choice
    prompt: How does a spam filter learn what spam is?
    params:
      options:
        - { label: "From many emails already marked as spam or not", correct: true }
        - { label: Someone writes all the rules by hand, feedback: "That is how it started. But spammers change their tricks faster than anyone can write rules." }
    hints:
      - Where does the filter get the right answer?
    explanation: This is **supervised learning**, which uses examples with known answers.

  - kind: explain
    id: s2
    body: |
      Each example has **features**, which are things you can measure, and a **label**, the right answer. The model looks for rules that get from the features to the label.

  - kind: problem
    id: merkmale
    widget: buckets
    prompt: A model should tell apples from pears. Feature or label?
    params:
      buckets: [{ label: Feature }, { label: Label }]
      items:
        - { label: Weight, bucket: Feature }
        - { label: Color, bucket: Feature }
        - { label: Shape, bucket: Feature }
        - { label: Apple or pear, bucket: Label }
    hints:
      - What should the model say in the end?
    explanation: Weight, color and shape describe the fruit. The label is the answer.

  - kind: problem
    id: vielfalt
    widget: choice
    prompt: A model has only seen red apples. What happens with a green one?
    params:
      options:
        - { label: It may get it wrong., correct: true }
        - { label: It will surely recognize it., feedback: "The model does not know what never appeared in its examples." }
    hints:
      - What did the model learn about color?
    explanation: Good data is not just plentiful. It also has varied examples.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A spam filter learning from marked mails
          right: true
        - text: A pocket calculator
          right: false
          why: Its rules were hard-coded by a human.
        - text: An app that recognises plants in photos
          right: true
        - text: A traffic light on a fixed schedule
          right: false
      left: Not learning
      right: Machine learning

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: "A model learns by moving a dividing line. Do it by hand: find a line with at most 2 errors."
    params:
      scene: neuron
    answer:
      errors:
        - 0
        - 2
    explanation: That is exactly what a learning method does – just thousands of times and without hands.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A model gets photos **without** labels and should find groups itself. What is this called?
    params:
      options:
        - label: Unsupervised learning
          correct: true
        - label: Supervised learning
          feedback: That would need labels.
        - label: Reinforcement learning
          feedback: There you learn from rewards.
    hints:
      - Nobody tells it the right answer.
    explanation: It looks for structure in the data itself – such as customer groups or topics in texts.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: buckets
    prompt: Should the model pick a class or estimate a number?
    params:
      buckets:
        - id: b1
          label: class (classification)
        - id: b2
          label: number (regression)
      items:
        - label: Is this email spam?
          bucket: b1
        - label: What does this house cost?
          bucket: b2
        - label: How warm will it be tomorrow?
          bucket: b2
        - label: Which digit from 0 to 9 is this?
          bucket: b1
    hints:
      - Are there fixed answers to choose from or any value?
      - Digits are classes here too – you do not calculate with them.
    explanation: Classification picks from fixed answers, regression estimates a number. Both are supervised learning with labels.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: A model predicts 3 and 5; the right answers are 4 and 7. What is the mean squared error?
    answer:
      value: 2.5
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 1.5
        misconception: no-square
        text: That is the mean error without squaring.
    hints:
      - "Errors: 1 and 2. Square them."
      - (1 + 4) / 2 = ?
    explanation: (1² + 2²) / 2 = 2.5. This loss function tells training how bad the model currently is. Learning means making it smaller.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The “no free lunch” theorem says, in essence …?
    params:
      options:
        - label: No learning method is best for all conceivable problems – it depends on the assumptions
          correct: true
        - label: Machine learning is always expensive
          feedback: It is not about cost.
        - label: More data never help
          feedback: Usually they help a lot.
    hints:
      - Every method tacitly makes assumptions about the world.
    explanation: Learning means generalising, and that only works with prior assumptions – the **inductive bias**.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Why are errors often squared instead of just taking their absolute value?
    params:
      options:
        - label: Big errors then count much more – and the formula is smooth and easy to differentiate.
          correct: true
        - label: Because squares are always smaller.
          feedback: 3² = 9 is bigger than 3. Only errors below 1 shrink.
        - label: There is no reason.
          feedback: The choice changes what the model learns – for example with outliers.
    hints:
      - Compare an error of 1 with one of 10 – before and after squaring.
      - What happens to outliers then?
    explanation: Squared error punishes large deviations hard and so reacts strongly to outliers. The absolute value is more robust. Which loss fits depends on the task.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what features and labels are – using a spam filter.
    params:
      keywords:
        - - merkmal
          - feature
        - - label
          - antwort
          - answer
        - - spam
          - mail
          - email
      sample: "Features are what you can measure in an email, such as words or the sender. The label is the right answer: spam or not spam. The model learns to go from features to label."
    difficulty: 3

srs:
  cards_from: [spam, merkmale]
