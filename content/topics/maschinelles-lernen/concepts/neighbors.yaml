id: ai.ml.neighbors
type: concept
title: Frag die Nachbarn
summary: Das Nächste-Nachbarn-Verfahren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Beim **Nächste-Nachbarn-Verfahren** bekommt ein neues Beispiel das Label, das die meisten seiner nächsten Nachbarn tragen. Ähnliches liegt nah beieinander – so einfach ist die Idee.

  - kind: problem
    id: klasse
    widget: choice
    visual:
      widget: graph
      params:
        x: [0, 7]
        y: [0, 7]
        showCoordinates: false
        points:
          - { id: a1, x: 1, y: 4, draggable: false, label: A }
          - { id: a2, x: 2, y: 6, draggable: false, label: A }
          - { id: a3, x: 1, y: 6, draggable: false, label: A }
          - { id: b1, x: 5, y: 1, draggable: false, label: B }
          - { id: b2, x: 6, y: 2, draggable: false, label: B }
          - { id: b3, x: 5, y: 3, draggable: false, label: B }
          - { id: q, x: 2, y: 4, draggable: false, label: "?" }
    prompt: Welche Klasse geben die drei nächsten Nachbarn dem Punkt »?«?
    params:
      options:
        - { label: A, correct: true }
        - { label: B, feedback: "Die B-Punkte liegen alle weit rechts unten." }
    hints:
      - Welche drei Punkte liegen am nächsten?
    explanation: Alle drei nächsten Nachbarn sind A.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: Wie weit liegen die Punkte (1 | 1) und (4 | 5) auseinander?
    params: { placeholder: "Abstand" }
    answer: { value: 5 }
    hints:
      - 3 nach rechts, 4 nach oben – Pythagoras.
    explanation: $\sqrt{3^2 + 4^2} = 5$.

  - kind: problem
    id: mehrere
    widget: choice
    prompt: Warum fragt man oft fünf Nachbarn statt nur den einen nächsten?
    params:
      options:
        - { label: Ein einzelner Ausreißer entscheidet dann nicht alles., correct: true }
        - { label: Weil es schneller geht., feedback: "Mehr Nachbarn heißt sogar etwas mehr Rechnen – aber stabilere Antworten." }
    hints:
      - Was, wenn der nächste Nachbar falsch beschriftet ist?
    explanation: Mehrheiten glätten Zufall und Fehler in den Daten.

srs:
  cards_from: [klasse, mehrere]
