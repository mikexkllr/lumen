id: ai.ml.neighbors
type: concept
title: Frag die Nachbarn
summary: Das Nächste-Nachbarn-Verfahren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Gleich und gleich
    body: "Musik-Apps sortieren Songs nach **Ähnlichkeit**. Jeder Punkt ist ein Song: weiter rechts heißt schneller, weiter oben lauter. Zieh den neuen Song »?« herum. Welche Gruppe liegt ihm jeweils am nächsten?"
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 8
        y:
          - 0
          - 6
        showCoordinates: false
        points:
          - id: r1
            x: 5
            y: 5
            draggable: false
            label: Rock
          - id: r2
            x: 7
            y: 5
            draggable: false
            label: Rock
          - id: r3
            x: 6
            y: 3
            draggable: false
            label: Rock
          - id: j1
            x: 1
            y: 1
            draggable: false
            label: Jazz
          - id: j2
            x: 3
            y: 1
            draggable: false
            label: Jazz
          - id: j3
            x: 1
            y: 3
            draggable: false
            label: Jazz
          - id: q
            x: 4
            y: 3
            label: "?"

  - kind: problem
    id: hook
    widget: choice
    prompt: In einer Straße haben alle fünf Häuser um ein Haus herum Solaranlagen. Was vermutest du über das Haus in der Mitte?
    params:
      options:
        - label: Es hat wohl auch eine
          correct: true
        - label: Es hat sicher keine
          feedback: Dafür spricht nichts.
        - label: Man kann gar nichts vermuten
          feedback: Nachbarn ähneln sich oft.
    hints:
      - Nachbarn ähneln sich oft.
    explanation: Von den Nachbarn auf das Neue schließen – ein ganzes Lernverfahren.

  - kind: explain
    id: s1
    body: |
      Beim **Nächste-Nachbarn-Verfahren** bekommt ein neues Beispiel das Label, das die meisten seiner nächsten Nachbarn tragen. Ähnliches liegt nah beieinander – so einfach ist die Idee.

  - kind: problem
    id: klasse
    widget: choice
    visual:
      widget: graph
      params:
        x: [0, 7]
        y: [0, 7]
        showCoordinates: false
        points:
          - { id: a1, x: 1, y: 4, draggable: false, label: A }
          - { id: a2, x: 2, y: 6, draggable: false, label: A }
          - { id: a3, x: 1, y: 6, draggable: false, label: A }
          - { id: b1, x: 5, y: 1, draggable: false, label: B }
          - { id: b2, x: 6, y: 2, draggable: false, label: B }
          - { id: b3, x: 5, y: 3, draggable: false, label: B }
          - { id: q, x: 2, y: 4, draggable: false, label: "?" }
    prompt: Welche Klasse geben die drei nächsten Nachbarn dem Punkt »?«?
    params:
      options:
        - { label: A, correct: true }
        - { label: B, feedback: "Die B-Punkte liegen alle weit rechts unten." }
    hints:
      - Welche drei Punkte liegen am nächsten?
    explanation: Alle drei nächsten Nachbarn sind A.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: Wie weit liegen die Punkte (1 | 1) und (4 | 5) auseinander?
    params: { placeholder: "Abstand" }
    answer: { value: 5 }
    hints:
      - 3 nach rechts, 4 nach oben – Pythagoras.
    explanation: $\sqrt{3^2 + 4^2} = 5$.

  - kind: problem
    id: mehrere
    widget: choice
    prompt: Warum fragt man oft fünf Nachbarn statt nur den einen nächsten?
    params:
      options:
        - { label: Ein einzelner Ausreißer entscheidet dann nicht alles., correct: true }
        - { label: Weil es schneller geht., feedback: "Mehr Nachbarn heißt sogar etwas mehr Rechnen – aber stabilere Antworten." }
    hints:
      - Was, wenn der nächste Nachbar falsch beschriftet ist?
    explanation: Mehrheiten glätten Zufall und Fehler in den Daten.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Die 5 nächsten Nachbarn heißen: Hund, Katze, Hund, Hund, Katze. Wie viele Stimmen bekommt »Hund«?"
    answer:
      value: 3
    hints:
      - Zähl die Hunde.
    explanation: Drei von fünf. Das neue Beispiel wird als Hund eingeordnet.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein neues Beispiel bekommt das Label der [[Mehrheit]] seiner nächsten [[Nachbarn]].
      distractors:
        - Minderheit
        - Fehler

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Merkmal 1 ist das Alter (0–100), Merkmal 2 das Einkommen (0–100 000). Was passiert beim Abstand?
    params:
      options:
        - label: Das Einkommen dominiert völlig – man muss die Merkmale erst auf gleiche Skalen bringen
          correct: true
        - label: Beide zählen gleich
          feedback: 1000 € Unterschied wiegen so viel wie 1000 Jahre.
        - label: Das Alter dominiert
          feedback: Die großen Zahlen gewinnen – und die hat das Einkommen.
    hints:
      - Vergleiche einen Altersunterschied von 50 Jahren mit einem Einkommensunterschied von 500 €.
    explanation: "**Normalisieren** ist bei Abstandsverfahren Pflicht – sonst entscheidet die Einheit statt der Bedeutung."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: buckets
    prompt: Wie viele Nachbarn fragt man? Was passt zu welchem k?
    params:
      buckets:
        - id: b1
          label: k = 1
        - id: b2
          label: k sehr groß
      items:
        - label: Reagiert auf jeden Ausreißer
          bucket: b1
        - label: Glättet sehr stark
          bucket: b2
        - label: Folgt jeder Zacke der Daten
          bucket: b1
        - label: Sagt fast immer die häufigste Klasse
          bucket: b2
    hints:
      - Ein einziger Nachbar kann ein Sonderfall sein.
    explanation: Zu klein ist nervös, zu groß ist träge. Das beste k liegt dazwischen.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Wie weit liegen die Punkte ({{x}} | {{y}}) und ({{x + 3 * k}} | {{y + 4 * k}}) auseinander?
    answer:
      value: "{{5 * k}}"
    feedback:
      - when: numval(state.input) == 7 * k
        misconception: manhattan
        text: Das ist der Weg entlang der Achsen. Gefragt ist die Luftlinie.
    hints:
      - Die Unterschiede sind {{3 * k}} und {{4 * k}}.
      - "Pythagoras: √({{3 * k}}² + {{4 * k}}²)."
    explanation: √({{9 * k * k}} + {{16 * k * k}}) = {{5 * k}}. Dieser **euklidische Abstand** ist das Standardmaß beim Nächste-Nachbarn-Verfahren.
    difficulty: 2
    variants:
      params:
        x: int[0,5]
        y: int[0,5]
        k: int[1,4]
      defaults:
        x: 1
        y: 2
        k: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In 2 Dimensionen findet man leicht nahe Nachbarn. In 1000 Dimensionen sind fast alle Punkte ungefähr gleich weit voneinander entfernt. Wie heißt das?
    params:
      options:
        - label: Fluch der Dimensionalität
          correct: true
        - label: Überanpassung
          feedback: Das ist ein anderes Problem.
        - label: Kaltstart
          feedback: Der betrifft neue Nutzer.
    hints:
      - Mit jeder Dimension wächst der Raum exponentiell – die Daten werden dünn.
    explanation: Der Begriff »nächster Nachbar« verliert seinen Sinn. Darum komprimiert man Daten erst in wenige aussagekräftige Dimensionen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: In einem Würfel mit Seite 1 und {{d}} Dimensionen liegt ein innerer Würfel mit Seite 0,9. Wie viel Prozent des Volumens liegen innen? Gerundet.
    answer:
      value: "{{100 * 0.9 ** d}}"
      tolerance: 1
    hints:
      - Das Volumen ist Seite hoch Dimension.
      - Rechne 0,9^{{d}}.
    explanation: 0,9^{{d}} ≈ {{round(100 * 0.9 ** d)}} %. In hohen Dimensionen liegt fast alles am **Rand**, und alle Punkte sind ähnlich weit voneinander entfernt. Darum werden »nächste Nachbarn« dort wenig aussagekräftig.
    difficulty: 3
    variants:
      params:
        d: choice[2,10,20,50]
      defaults:
        d: 10

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie das Nächste-Nachbarn-Verfahren ein neues Beispiel einordnet.
    params:
      keywords:
        - - nächst
          - nah
          - nearest
          - close
        - - abstand
          - entfern
          - distance
        - - mehrheit
          - meisten
          - abstimm
          - majority
          - most
          - vote
      sample: Es misst den Abstand des neuen Beispiels zu allen bekannten. Dann schaut es die k nächsten an und nimmt das Label, das die meisten von ihnen haben – eine Mehrheitsabstimmung.
    difficulty: 3

srs:
  cards_from: [klasse, mehrere]
