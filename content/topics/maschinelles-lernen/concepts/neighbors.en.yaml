id: ai.ml.neighbors
type: concept
title: Ask the neighbors
summary: The nearest-neighbor method.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Birds of a feather
    body: "Music apps sort songs by **similarity**. Each dot is a song: further right means faster, higher up means louder. Drag the new song “?” around. Which group is nearest to it each time?"
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 8
        y:
          - 0
          - 6
        showCoordinates: false
        points:
          - id: r1
            x: 5
            y: 5
            draggable: false
            label: Rock
          - id: r2
            x: 7
            y: 5
            draggable: false
            label: Rock
          - id: r3
            x: 6
            y: 3
            draggable: false
            label: Rock
          - id: j1
            x: 1
            y: 1
            draggable: false
            label: Jazz
          - id: j2
            x: 3
            y: 1
            draggable: false
            label: Jazz
          - id: j3
            x: 1
            y: 3
            draggable: false
            label: Jazz
          - id: q
            x: 4
            y: 3
            label: "?"

  - kind: problem
    id: hook
    widget: choice
    prompt: In a street all five houses around one house have solar panels. What do you guess about the house in the middle?
    params:
      options:
        - label: It probably has one too
          correct: true
        - label: It surely has none
          feedback: Nothing suggests that.
        - label: Nothing can be guessed
          feedback: Neighbours are often alike.
    hints:
      - Neighbours are often alike.
    explanation: Inferring the new from its neighbours – a whole learning method.

  - kind: explain
    id: s1
    body: |
      In the **nearest-neighbor method**, a new example gets the label that most of its nearest neighbors carry. Similar things lie close together. The idea is that simple.

  - kind: problem
    id: klasse
    widget: choice
    visual:
      widget: graph
      params:
        x: [0, 7]
        y: [0, 7]
        showCoordinates: false
        points:
          - { id: a1, x: 1, y: 4, draggable: false, label: A }
          - { id: a2, x: 2, y: 6, draggable: false, label: A }
          - { id: a3, x: 1, y: 6, draggable: false, label: A }
          - { id: b1, x: 5, y: 1, draggable: false, label: B }
          - { id: b2, x: 6, y: 2, draggable: false, label: B }
          - { id: b3, x: 5, y: 3, draggable: false, label: B }
          - { id: q, x: 2, y: 4, draggable: false, label: "?" }
    prompt: Which class do the three nearest neighbors give the point “?”?
    params:
      options:
        - { label: A, correct: true }
        - { label: B, feedback: "The B points are all far to the lower right." }
    hints:
      - Which three points are nearest?
    explanation: All three nearest neighbors are A.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: How far apart are the points (1 | 1) and (4 | 5)?
    params: { placeholder: "Distance" }
    answer: { value: 5 }
    hints:
      - 3 to the right, 4 up. Pythagoras.
    explanation: $\sqrt{3^2 + 4^2} = 5$.

  - kind: problem
    id: mehrere
    widget: choice
    prompt: Why do you often ask five neighbors instead of just the nearest one?
    params:
      options:
        - { label: Then a single outlier does not decide everything., correct: true }
        - { label: Because it is faster., feedback: "More neighbors even means slightly more computing, but steadier answers." }
    hints:
      - What if the nearest neighbor is mislabeled?
    explanation: Majorities smooth out chance and errors in the data.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "The 5 nearest neighbours are: dog, cat, dog, dog, cat. How many votes does “dog” get?"
    answer:
      value: 3
    hints:
      - Count the dogs.
    explanation: Three of five. The new example is classed as a dog.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A new example gets the label of the [[majority]] of its nearest [[neighbours]].
      distractors:
        - minority
        - errors

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Feature 1 is age (0–100), feature 2 income (0–100,000). What happens to the distance?
    params:
      options:
        - label: Income dominates completely – the features must first be put on equal scales
          correct: true
        - label: Both count equally
          feedback: A €1000 difference weighs as much as 1000 years.
        - label: Age dominates
          feedback: The large numbers win – and income has them.
    hints:
      - Compare an age difference of 50 years with an income difference of €500.
    explanation: "**Normalising** is mandatory for distance methods – otherwise the unit decides instead of the meaning."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: buckets
    prompt: How many neighbours do you ask? What fits which k?
    params:
      buckets:
        - id: b1
          label: k = 1
        - id: b2
          label: k very large
      items:
        - label: Reacts to every outlier
          bucket: b1
        - label: Smooths very strongly
          bucket: b2
        - label: Follows every spike in the data
          bucket: b1
        - label: Nearly always says the top class
          bucket: b2
    hints:
      - A single neighbour may be a special case.
    explanation: Too small is jumpy, too large is sluggish. The best k lies in between.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: How far apart are the points ({{x}} | {{y}}) and ({{x + 3 * k}} | {{y + 4 * k}})?
    answer:
      value: "{{5 * k}}"
    feedback:
      - when: numval(state.input) == 7 * k
        misconception: manhattan
        text: That is the path along the axes. We want the straight line.
    hints:
      - The differences are {{3 * k}} and {{4 * k}}.
      - "Pythagoras: √({{3 * k}}² + {{4 * k}}²)."
    explanation: √({{9 * k * k}} + {{16 * k * k}}) = {{5 * k}}. This Euclidean distance is the standard measure in nearest neighbours.
    difficulty: 2
    variants:
      params:
        x: int[0,5]
        y: int[0,5]
        k: int[1,4]
      defaults:
        x: 1
        y: 2
        k: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In 2 dimensions near neighbours are easy to find. In 1000 dimensions almost all points are about equally far apart. What is this called?
    params:
      options:
        - label: Curse of dimensionality
          correct: true
        - label: Overfitting
          feedback: That is a different problem.
        - label: Cold start
          feedback: That concerns new users.
    hints:
      - With every dimension the space grows exponentially – the data become sparse.
    explanation: The notion of “nearest neighbour” loses its meaning. That is why data are first compressed into a few meaningful dimensions.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: In a cube of side 1 in {{d}} dimensions sits an inner cube of side 0.9. What percentage of the volume lies inside? Rounded.
    answer:
      value: "{{100 * 0.9 ** d}}"
      tolerance: 1
    hints:
      - Volume is side to the power of the dimension.
      - Compute 0.9^{{d}}.
    explanation: 0.9^{{d}} ≈ {{round(100 * 0.9 ** d)}} %. In high dimensions nearly everything lies near the edge, and all points are about equally far apart. That is why "nearest neighbours" become less meaningful there.
    difficulty: 3
    variants:
      params:
        d: choice[2,10,20,50]
      defaults:
        d: 10

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how nearest neighbours classifies a new example.
    params:
      keywords:
        - - nächst
          - nah
          - nearest
          - close
        - - abstand
          - entfern
          - distance
        - - mehrheit
          - meisten
          - abstimm
          - majority
          - most
          - vote
      sample: It measures the distance from the new example to all known ones. Then it looks at the k nearest and takes the label most of them have – a majority vote.
    difficulty: 3

srs:
  cards_from: [klasse, mehrere]
