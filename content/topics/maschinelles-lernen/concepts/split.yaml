id: ai.ml.split
type: concept
title: Fair testen
summary: Trainings- und Testdaten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: gleiche
    widget: choice
    prompt: Ein Modell wird mit genau den Beispielen getestet, mit denen es trainiert wurde. Was misst das?
    params:
      options:
        - { label: "Vor allem, wie gut es auswendig gelernt hat", correct: true }
        - { label: Wie gut es neue Fälle löst, feedback: "Neue Fälle hat es dabei ja gar nicht gesehen." }
    hints:
      - Würdest du eine Prüfung mit den Übungsaufgaben für fair halten?
    explanation: Nur unbekannte Beispiele zeigen, ob das Modell verallgemeinert.

  - kind: explain
    id: s2
    body: |
      Darum teilt man die Daten auf: Mit etwa **80 %** wird trainiert, die übrigen **20 %** hält man zurück. Erst ganz am Ende testet man damit – wie eine Klausur mit neuen Aufgaben.

  - kind: problem
    id: teilen
    widget: numeric
    prompt: Du hast {{n}} beschriftete Fotos und teilst 80 zu 20. Wie viele kommen ins Training?
    params: { unit: Fotos }
    answer: { value: "{{n * 4 / 5}}" }
    hints:
      - "80 % von {{n}}."
    explanation: "{{n * 4 / 5}} fürs Training, {{n / 5}} für den Test."
    variants:
      params: { n: "choice[500,1000,2500,5000]" }
      defaults: { n: 1000 }

  - kind: problem
    id: zukunft
    widget: choice
    prompt: Ein Modell sagt Verkäufe voraus. Warum testet man es mit den neuesten Monaten statt zufällig ausgewählten?
    params:
      options:
        - { label: "So prüft man, ob es auch für die Zukunft taugt.", correct: true }
        - { label: Neue Daten sind genauer., feedback: "Es geht darum, die echte Anwendung nachzustellen – Vorhersagen in die Zukunft." }
    hints:
      - Wofür wird das Modell später eingesetzt?
    explanation: Der Test sollte so aussehen wie der spätere Einsatz.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Team probiert 50 Einstellungen aus und wählt die mit dem besten Ergebnis auf den **Testdaten**. Was ist das Problem?
    params:
      options:
        - label: Die Testdaten wurden zur Auswahl benutzt – das Ergebnis ist jetzt zu optimistisch
          correct: true
        - label: Es gibt keines
          feedback: Indirekt hat man so auf den Testdaten trainiert.
        - label: 50 Versuche sind zu wenige
          feedback: Die Zahl ist nicht das Problem, sondern woran man misst.
    hints:
      - Dürfen Testdaten Entscheidungen beeinflussen?
    explanation: "Darum gibt es drei Teile: Training, **Validierung** zum Auswählen und einen unberührten Test."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In einem Datensatz für Kreditausfälle steht eine Spalte »Mahnungen verschickt«. Das Modell wird damit perfekt. Was ist faul?
    params:
      options:
        - label: Die Spalte entsteht erst **nach** dem Ausfall – zum Zeitpunkt der Entscheidung gibt es sie nicht
          correct: true
        - label: Nichts – das ist ein sehr gutes Merkmal
          feedback: Es verrät die Antwort.
        - label: Die Spalte ist zu kurz
          feedback: Die Länge ist egal.
    hints:
      - Welche Information hat die Bank, **bevor** sie den Kredit vergibt?
    explanation: "Ein **Datenleck**: Wissen aus der Zukunft gelangt ins Training. Im Einsatz ist das Modell dann wertlos."
    difficulty: 3

srs:
  cards_from: [gleiche, teilen]
