id: sci.solid.crystals
type: concept
title: "Kristalle"
summary: "Atome in Reih und Glied – und wie Röntgenlicht das Gitter sichtbar macht."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Atome liegen in einem Salzkristall auf einem einzigen Millimeter nebeneinander? Ihr Abstand ist 0,28 nm."
    params:
      min: 100
      max: 10000000000
      scale: log
    answer:
      value: 3500000
      within: 50
    explanation: "1 mm : 0,28 nm ≈ 3,5 Millionen Atome. Ein Salzkorn ist ein Würfel aus Milliarden mal Milliarden Atomen, alle in perfekter Ordnung."

  - kind: explain
    id: c1
    body: In einem **Kristallgitter** sitzen die Atome in einem Muster, das sich in alle Richtungen wiederholt. Das kleinste Stück, das sich wiederholt, heißt Elementarzelle. Aus ihr baut sich der ganze Kristall.

  - kind: problem
    id: c2
    widget: match
    prompt: Was hält diesen Kristall zusammen?
    params:
      pairs:
        - left: Kochsalz
          right: Plus- und Minus-Ionen
        - left: Kupfer
          right: Ein See freier Elektronen
        - left: Diamant
          right: Feste Elektronenpaare
        - left: Eis
          right: Wasserstoffbrücken
    hints:
      - Metalle teilen ihre äußeren Elektronen mit allen.
      - Salz besteht aus geladenen Teilchen.
    explanation: "Die Art der Bindung bestimmt die Eigenschaften: Salz ist spröde, Kupfer biegsam und leitend, Diamant extrem hart."

  - kind: problem
    id: c3
    widget: choice
    prompt: Ist Fensterglas ein Kristall?
    params:
      options:
        - label: Nein – seine Atome sind fest, aber ungeordnet wie in einer erstarrten Flüssigkeit.
          correct: true
        - label: Ja, Glas ist durchsichtig wie ein Kristall.
          feedback: Durchsichtig heißt nicht geordnet. Bergkristall und Glas sind beide klar, aber nur einer ist geordnet.
        - label: Nein, Glas ist eine Flüssigkeit.
          feedback: Glas fließt nicht messbar. Es ist ein fester, aber amorpher Stoff.
    hints:
      - Gibt es ein Muster, das sich wiederholt?
      - Ungeordnet und fest heißt amorph.
    explanation: "Glas ist **amorph**: fest, aber ohne Fernordnung. Die Legende von alten Kirchenfenstern, die nach unten geflossen sind, stimmt nicht."

  - kind: problem
    id: c4
    widget: numeric
    prompt: Im kubisch-flächenzentrierten Gitter (wie Kupfer) sitzt an jeder der 8 Würfelecken ein Atom, das zu 1/8 zur Zelle gehört. Dazu je ein Atom auf den 6 Flächen, das zur Hälfte dazugehört. Wie viele Atome hat die Zelle?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 14
        misconception: count-whole
        text: Die Atome gehören auch zu den Nachbarzellen. Zähle nur ihren Anteil.
    hints:
      - "Ecken: 8 · 1/8."
      - "Flächen: 6 · 1/2."
    explanation: 1 + 3 = 4 Atome. So packen sich Kugeln am dichtesten – wie Orangen auf dem Markt.

  - kind: explain
    id: d1
    depth: 2
    body: Röntgenlicht hat eine Wellenlänge so groß wie Atomabstände. An den Gitterebenen gestreut, verstärkt es sich nur unter bestimmten Winkeln. Das beschreibt die **Bragg-Bedingung** $2d \sin\theta = n\lambda$.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Gitterebenen im Abstand d = 0,28 nm. Röntgenlicht hat λ = 0,154 nm. Unter welchem Winkel θ tritt der erste Reflex (n = 1) auf? Auf eine Stelle.
    params:
      unit: °
    answer:
      value: 16
      tolerance: 0.2
    feedback:
      - when: abs(numval(state.input) - 33.4) < 0.3
        misconception: forgot-two
        text: "Das 2 vor dem d nicht vergessen: sin θ = λ : (2d)."
    hints:
      - "sin θ = 0,154 : 0,56 ≈ 0,275."
      - Welcher Winkel hat den Sinus 0,275?
    explanation: θ ≈ 16,0°. Aus den Winkeln vieler Reflexe rekonstruiert man das ganze Gitter – so wurde auch die DNA-Doppelhelix entschlüsselt.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Warum lässt sich Kupfer biegen, ein Salzkristall aber zerspringt beim Draufschlagen?
    params:
      options:
        - label: Im Metall gleiten Atomebenen, der Elektronensee hält sie. Im Salz geraten gleiche Ladungen nebeneinander und stoßen sich ab.
          correct: true
        - label: Kupfer ist weicher, weil es leichter ist.
          feedback: Kupfer ist sogar dichter als Salz. Es liegt an der Bindung.
        - label: Salz enthält Wasser, das es spröde macht.
          feedback: Trockenes Salz ist genauso spröde. Es geht um die Ladungen.
    hints:
      - Was passiert, wenn man eine Ionenreihe um einen Platz verschiebt?
      - Plus neben Plus stößt sich ab.
    explanation: Metallbindung ist ungerichtet, darum gleiten Ebenen einfach weiter. Im Ionengitter bricht nach einer kleinen Verschiebung die Ordnung der Ladungen zusammen – der Kristall spaltet.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Kochsalz: Die kubische Zelle hat die Kante 0,564 nm und enthält 4 NaCl-Einheiten mit je 58,44 u (1 u = 1,66 · 10⁻²⁷ kg). Welche Dichte folgt daraus – in kg/m³? Auf Zehner."
    params:
      unit: kg/m³
    answer:
      value: 2160
      tolerance: 30
    hints:
      - "Masse der Zelle: 4 · 58,44 · 1,66 · 10⁻²⁷ kg ≈ 3,88 · 10⁻²⁵ kg."
      - "Volumen: (0,564 · 10⁻⁹ m)³ ≈ 1,79 · 10⁻²⁸ m³."
    explanation: Rund 2160 kg/m³ – genau, was man mit der Waage misst. Die winzige Zelle verrät die Eigenschaft des ganzen Kristalls.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man mit Röntgenlicht in einen Kristall hineinschauen kann.
    params:
      keywords:
        - - röntgen
          - x-ray
          - wellenlänge
          - wavelength
        - - gitter
          - lattice
          - ebene
          - plane
          - abstand
          - spacing
        - - winkel
          - angle
          - verstärk
          - reinforc
          - interferenz
          - interference
          - bragg
      sample: Röntgenlicht hat eine Wellenlänge wie der Abstand der Atome. An den Gitterebenen gestreut, verstärkt es sich nur unter bestimmten Winkeln. Aus diesen Winkeln rechnet man die Abstände und das ganze Gitter aus.
    difficulty: 3

srs:
  cards_from: ["c4", "d2", "x1"]
