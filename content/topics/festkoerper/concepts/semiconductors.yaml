id: sci.solid.semiconductors
type: concept
title: "Dotierung und Diode"
summary: "Ein paar fremde Atome machen aus Silizium einen Schalter, eine Solarzelle und eine LED."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Vom Sand zum Chip
    body: "Jedes Handy steckt voller winziger Schalter aus Silizium. Ein paar fremde Atome machen sie erst möglich. Deck die Karten auf: Was alles entsteht aus dotiertem **Silizium**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏝️
            front: Quarzsand
            back: Chips beginnen als Sand. Daraus wird Silizium, reiner als fast alles auf der Erde.
          - icon: 💡
            front: LED
            back: Treffen Elektronen auf Löcher, wird Licht frei – in genau einer Farbe.
          - icon: ☀️
            front: Solarzelle
            back: "Hier läuft es umgekehrt: Licht trennt Elektron und Loch, und Strom fließt."
          - icon: 📻
            front: Detektorradio
            back: Schon vor über 100 Jahren hörte man Radio mit einem Kristall und einer Metallspitze.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Transistoren stecken in einem modernen Smartphone-Chip?"
    params:
      min: 1000
      max: 10000000000000
      scale: log
    answer:
      value: 15000000000
      within: 70
    explanation: Rund 15 bis 20 Milliarden – mehr als doppelt so viele, wie Menschen auf der Erde leben. Jeder ist ein Schalter aus gezielt verunreinigtem Silizium.

  - kind: explain
    id: c1
    body: "Bei der **Dotierung** baut man fremde Atome ins Silizium ein. Phosphor hat ein Außenelektron mehr – es wird frei: n-Typ. Bor hat eins weniger – es entsteht ein Loch: p-Typ."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Welcher Typ entsteht mit diesem Fremdatom in Silizium?
    params:
      buckets:
        - id: b1
          label: n-Typ
        - id: b2
          label: p-Typ
      items:
        - label: Phosphor
          bucket: b1
        - label: Arsen
          bucket: b1
        - label: Antimon
          bucket: b1
        - label: Bor
          bucket: b2
        - label: Gallium
          bucket: b2
        - label: Aluminium
          bucket: b2
    hints:
      - Silizium hat 4 Außenelektronen.
      - Hauptgruppe 5 gibt eins ab, Hauptgruppe 3 fehlt eins.
    explanation: "Phosphor, Arsen und Antimon haben 5 Außenelektronen: n-Typ. Bor, Gallium und Aluminium haben 3: p-Typ."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Silizium hat 5 · 10²² Atome pro cm³. Du dotierst mit einem Phosphoratom pro Million Siliziumatome. Wie viele freie Elektronen pro cm³ ergibt das – in 10¹⁶?
    answer:
      value: 5
    hints:
      - "5 · 10²² : 10⁶ = ?"
      - Jedes Phosphoratom gibt ein Elektron.
    explanation: 5 · 10¹⁶ – fünf Millionen Mal mehr als die 10¹⁰ im reinen Silizium. Ein Millionstel Fremdatome ändert die Leitfähigkeit um Millionen.

  - kind: problem
    id: c4
    widget: choice
    prompt: Warum macht so wenig Dotierung so einen großen Unterschied?
    params:
      options:
        - label: Reines Silizium hat fast keine freien Ladungen – jedes Fremdatom liefert eine.
          correct: true
        - label: Die Fremdatome sind besonders groß.
          feedback: Sie sind ähnlich groß wie Silizium. Es geht um die Elektronenzahl.
        - label: Die Fremdatome sind magnetisch.
          feedback: Magnetismus spielt keine Rolle.
    hints:
      - Wie viele freie Elektronen hat reines Silizium?
      - Vergleiche 10¹⁰ mit 5 · 10¹⁶.
    explanation: Weil der Ausgangswert winzig ist, dominiert schon eine Spur Dotierung. Darum muss Chip-Silizium zu 99,9999999 % rein sein – sonst stimmt die Dotierung nicht.

  - kind: explain
    id: d1
    depth: 2
    body: Legt man p- und n-Silizium aneinander, wandern Elektronen und Löcher über die Grenze und vernichten sich. Zurück bleibt eine **Sperrschicht** ohne freie Ladungen, mit einem eingebauten Feld. So entsteht eine Diode.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: An eine Diode legst du Plus an die p-Seite und Minus an die n-Seite. Was passiert?
    params:
      options:
        - label: Die Sperrschicht schrumpft, Strom fließt.
          correct: true
        - label: Die Sperrschicht wächst, kein Strom.
          feedback: Das passiert bei umgekehrter Polung.
        - label: Die Diode schmilzt sofort.
          feedback: Bei normaler Spannung leitet sie einfach.
    hints:
      - Plus stößt die Löcher auf der p-Seite zur Grenze.
      - Minus schiebt die Elektronen der n-Seite dorthin.
    explanation: In Durchlassrichtung werden Ladungen in die Sperrschicht gedrückt, sie verschwindet. Umgekehrt wird sie breiter – die Diode sperrt. Ein Ventil für Strom.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Ein Photon mit 2 eV trifft eine Silizium-Solarzelle (Lücke 1,1 eV). Wie viel Prozent seiner Energie können höchstens elektrisch genutzt werden?
    params:
      unit: "%"
    answer:
      value: 55
    feedback:
      - when: abs(numval(state.input) - 45) < 0.5
        misconception: complement
        text: Das ist der Teil, der als Wärme verloren geht.
    hints:
      - Nur die Lückenenergie kommt als Strom an.
      - "1,1 : 2 = ?"
    explanation: 55 %. Der Rest wird zu Wärme, weil das Elektron sofort an die Bandkante fällt. Blaue Photonen verschwenden darum mehr als rote.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Solarzelle aus nur einem Stoff macht höchstens etwa ein Drittel des Lichts zu Strom. Warum?
    params:
      options:
        - label: Zu schwache Photonen gehen ungenutzt durch, starke verlieren ihren Überschuss als Wärme.
          correct: true
        - label: Weil Silizium zu teuer ist.
          feedback: Die Grenze ist physikalisch, nicht wirtschaftlich.
        - label: Weil 67 % des Lichts gespiegelt werden.
          feedback: Gute Zellen spiegeln nur wenige Prozent.
    hints:
      - Was passiert mit Photonen unter 1,1 eV?
      - Und mit Photonen weit über 1,1 eV?
    explanation: Das ist die Shockley-Queisser-Grenze. Stapelzellen aus mehreren Halbleitern mit verschiedenen Lücken überwinden sie und erreichen über 40 %.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Ein Schalter in einem modernen Chip ist nur 20 nm breit. Zwei Atome im Silizium liegen 0,235 nm auseinander. Wie viele Atome passen etwa nebeneinander?
    answer:
      value: 85
      tolerance: 3
    hints:
      - "20 : 0,235 = ?"
      - Das Ergebnis liegt unter 100.
    explanation: Nur rund 85 Atome! Bei solchen Größen tunneln Elektronen durch dünne Schichten. Chipentwickler müssen die Quantenphysik einplanen.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Diode Strom nur in eine Richtung durchlässt.
    params:
      keywords:
        - - p-
          - n-
          - dotier
          - dop
        - - sperrschicht
          - depletion
          - grenze
          - boundary
        - - richtung
          - direction
          - durchlass
          - forward
          - sperr
          - block
      sample: Eine Diode besteht aus p- und n-Silizium. An der Grenze bildet sich eine Sperrschicht ohne freie Ladungen. Polt man richtig, werden Ladungen hineingedrückt und Strom fließt. Polt man falsch, wird die Sperrschicht breiter und sperrt.
    difficulty: 3

srs:
  cards_from: ["c3", "d3", "x2"]
