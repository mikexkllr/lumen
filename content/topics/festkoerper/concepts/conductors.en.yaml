id: sci.solid.conductors
type: concept
title: "Conductors and insulators"
summary: "Free electrons, collisions with the lattice and why metals shine and conduct."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Conduct or block
    body: "A copper cable conducts electricity, a pane of glass does not. Turn the **resistance**: how much current does a good conductor let through, and how much a poor one?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: circuit

  - kind: problem
    id: hook
    widget: choice
    prompt: Copper carries a current. Glass hardly does. Why?
    params:
      options:
        - label: Copper has freely moving electrons; in glass they are all tightly bound.
          correct: true
        - label: Copper has more electrons.
          feedback: Glass has lots of electrons too. What matters is whether they can move.
        - label: Glass is transparent, so no current can pass.
          feedback: Being transparent and insulating are linked, but that is not the cause.
    hints:
      - Current needs mobile charge.
      - In a metal all atoms share their outer electrons.
    explanation: Each copper atom gives about one electron to a shared sea. In glass all electrons sit firmly at their atoms.

  - kind: explain
    id: c1
    body: In a metal the **free electrons** move through the whole lattice. In copper there are about 8.5 · 10²⁸ per cubic metre – about one per atom. An electric field pushes them all in one direction.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Conductor, semiconductor or insulator?
    params:
      buckets:
        - id: b1
          label: Conductor
        - id: b2
          label: Semiconductor
        - id: b3
          label: Insulator
      items:
        - label: Copper
          bucket: b1
        - label: Silver
          bucket: b1
        - label: Silicon
          bucket: b2
        - label: Germanium
          bucket: b2
        - label: Glass
          bucket: b3
        - label: Rubber
          bucket: b3
    hints:
      - Metals conduct well.
      - Silicon and germanium are in chips.
    explanation: Metals conduct, glass and rubber insulate. Semiconductors lie in between – and can be tuned on purpose. That is why electronics is built from them.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Copper has a resistivity of about 10⁻⁸ Ωm, glass about 10¹² Ωm. By how many powers of ten do they differ?
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 4
        misconception: neg-exponent
        text: "The minus counts: from −8 to +12 is 20 steps."
    hints:
      - From 10⁻⁸ to 10⁰ is 8 steps.
      - Then on to 10¹².
    explanation: 20 powers of ten – hardly any other property varies so much in nature.

  - kind: problem
    id: c4
    widget: choice
    prompt: A metal wire gets hot. Does it conduct better or worse?
    params:
      options:
        - label: Worse – the more strongly vibrating atoms knock the electrons more often.
          correct: true
        - label: Better – heat makes electrons faster.
          feedback: There are no more free electrons in the metal. The collisions increase.
        - label: Equally well.
          feedback: Copper's resistance rises by about 0.4 % per degree.
    hints:
      - What do the atoms in the lattice do when it gets warmer?
      - More obstacles means more resistance.
    explanation: Heat makes the lattice jitter more. The electrons bump into it more often and make less progress. Incandescent bulbs use this as a built-in current limiter.

  - kind: explain
    id: d1
    depth: 2
    body: In the Drude model the field accelerates each electron until, after the **collision time** τ, it hits the lattice and starts again. This gives the conductivity $\sigma = \frac{n e^2 \tau}{m}$.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Copper: n = 8.5 · 10²⁸ per m³, τ = 2.5 · 10⁻¹⁴ s, e = 1.6 · 10⁻¹⁹ C, m = 9.11 · 10⁻³¹ kg. What is σ = n e² τ ÷ m – in 10⁷ S/m? To one decimal place."
    answer:
      value: 6
      tolerance: 0.2
    hints:
      - e² = 2.56 · 10⁻³⁸. n · e² ≈ 2.18 · 10⁻⁹.
      - Times τ, then divide by m.
    explanation: σ ≈ 6 · 10⁷ S/m – almost exactly the measured value. A simple picture of balls in a lattice hits the number amazingly well.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Metals conduct not only electricity well, but also heat. Why?
    params:
      options:
        - label: The free electrons also carry heat energy quickly through the metal.
          correct: true
        - label: Because metals are heavy.
          feedback: "Lead is heavy and conducts heat only moderately. It is the electrons. "
        - label: Because metals are shiny.
          feedback: Shine and heat conduction share a cause, but the shine is not the reason.
    hints:
      - What carries the current in a metal?
      - Fast particles carry energy too.
    explanation: Good electrical conductors are almost always good heat conductors – silver and copper leading. The ratio of the two conductivities is nearly the same for all metals (Wiedemann–Franz).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Even at absolute zero the electrons in copper fly around at about 1600 km/s. Why do they not stand still?
    params:
      options:
        - label: Each state can hold only one electron per spin direction – they must fill up to high energies.
          correct: true
        - label: The lattice keeps pushing them.
          feedback: At 0 K the lattice barely vibrates. The reason is the Pauli principle.
        - label: Because 0 K is never quite reached.
          feedback: Even calculated at exactly 0 K they stay fast.
    hints:
      - Electrons obey the Pauli principle.
      - How do you fill a house where each bed may be taken only once?
    explanation: The electrons stack up to the Fermi energy of about 7 eV. The top ones are very fast – pure quantum physics, with no heat at all.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: The Fermi energy of copper is about 7 eV. The thermal energy at room temperature is k · T ≈ 0.025 eV. How many times larger is the Fermi energy?
    answer:
      value: 280
    hints:
      - Divide 7 by 0.025.
      - 7 ÷ 0.025 = 7 · 40.
    explanation: 280 times. Heat can only excite the electrons right at the top edge – so metal electrons hardly contribute to the heat capacity. A puzzle of classical physics was solved this way.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why metals conduct electricity and glass does not.
    params:
      keywords:
        - - frei
          - free
          - beweglich
          - mobile
          - move
        - - elektron
          - electron
        - - gebunden
          - bound
          - fest
          - fixed
          - atom
      sample: In a metal each atom gives an electron to a shared sea. A field can push these free electrons – current flows. In glass all electrons are tightly bound to their atoms.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x2"]
