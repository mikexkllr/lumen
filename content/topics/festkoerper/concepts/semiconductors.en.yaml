id: sci.solid.semiconductors
type: concept
title: "Doping and the diode"
summary: "A few foreign atoms turn silicon into a switch, a solar cell and an LED."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: From sand to chip
    body: "Every phone is full of tiny switches made of silicon. A few foreign atoms make them possible. Flip the cards: what can be made from doped **silicon**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏝️
            front: Quartz sand
            back: Chips start out as sand. It is turned into silicon purer than almost anything on Earth.
          - icon: 💡
            front: LED
            back: When electrons meet holes, light is released – in exactly one colour.
          - icon: ☀️
            front: Solar cell
            back: "Here it runs the other way: light separates electron and hole, and current flows."
          - icon: 📻
            front: Crystal radio
            back: More than 100 years ago people heard radio with a crystal and a metal tip.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many transistors are in a modern smartphone chip?"
    params:
      min: 1000
      max: 10000000000000
      scale: log
    answer:
      value: 15000000000
      within: 70
    explanation: About 15 to 20 billion – more than twice the number of people on Earth. Each one is a switch made of deliberately contaminated silicon.

  - kind: explain
    id: c1
    body: "With **doping** foreign atoms are built into silicon. Phosphorus has one more outer electron – it becomes free: n-type. Boron has one fewer – a hole forms: p-type."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Which type results with this foreign atom in silicon?
    params:
      buckets:
        - id: b1
          label: n-type
        - id: b2
          label: p-type
      items:
        - label: Phosphorus
          bucket: b1
        - label: Arsenic
          bucket: b1
        - label: Antimony
          bucket: b1
        - label: Boron
          bucket: b2
        - label: Gallium
          bucket: b2
        - label: Aluminium
          bucket: b2
    hints:
      - Silicon has 4 outer electrons.
      - Group 15 gives one away, group 13 lacks one.
    explanation: "Phosphorus, arsenic and antimony have 5 outer electrons: n-type. Boron, gallium and aluminium have 3: p-type."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Silicon has 5 · 10²² atoms per cm³. You dope it with one phosphorus atom per million silicon atoms. How many free electrons per cm³ does that give – in 10¹⁶?
    answer:
      value: 5
    hints:
      - 5 · 10²² ÷ 10⁶ = ?
      - Each phosphorus atom gives one electron.
    explanation: 5 · 10¹⁶ – five million times more than the 10¹⁰ in pure silicon. One part per million of foreign atoms changes conductivity by millions.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why does so little doping make such a big difference?
    params:
      options:
        - label: Pure silicon has almost no free charges – each foreign atom supplies one.
          correct: true
        - label: The foreign atoms are especially large.
          feedback: They are similar in size to silicon. It is about the number of electrons.
        - label: The foreign atoms are magnetic.
          feedback: Magnetism plays no part.
    hints:
      - How many free electrons does pure silicon have?
      - Compare 10¹⁰ with 5 · 10¹⁶.
    explanation: Because the starting value is tiny, even a trace of doping dominates. That is why chip silicon must be 99.9999999 % pure – otherwise the doping would be wrong.

  - kind: explain
    id: d1
    depth: 2
    body: When p- and n-silicon meet, electrons and holes drift across the boundary and annihilate. What remains is a **depletion zone** without free charges, with a built-in field. That makes a diode.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: You connect plus to the p side of a diode and minus to the n side. What happens?
    params:
      options:
        - label: The depletion zone shrinks and current flows.
          correct: true
        - label: The depletion zone grows, no current.
          feedback: That happens with reversed polarity.
        - label: The diode melts at once.
          feedback: At normal voltage it simply conducts.
    hints:
      - Plus pushes the holes on the p side towards the boundary.
      - Minus pushes the n side's electrons there.
    explanation: In the forward direction charges are pushed into the depletion zone and it vanishes. Reversed, it widens – the diode blocks. A valve for current.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A 2 eV photon hits a silicon solar cell (gap 1.1 eV). What percentage of its energy can at most be used electrically?
    params:
      unit: "%"
    answer:
      value: 55
    feedback:
      - when: abs(numval(state.input) - 45) < 0.5
        misconception: complement
        text: That is the part lost as heat.
    hints:
      - Only the gap energy arrives as electricity.
      - 1.1 ÷ 2 = ?
    explanation: 55 %. The rest becomes heat because the electron falls straight to the band edge. Blue photons therefore waste more than red ones.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A solar cell made of a single semiconductor reaches at most about 33 % efficiency. Why?
    params:
      options:
        - label: Photons that are too weak pass unused, strong ones lose their surplus as heat.
          correct: true
        - label: Because silicon is too expensive.
          feedback: The limit is physical, not economic.
        - label: Because 67 % of the light is reflected.
          feedback: Good cells reflect only a few per cent.
    hints:
      - What happens to photons below 1.1 eV?
      - And to photons far above 1.1 eV?
    explanation: That is the Shockley–Queisser limit. Stacked cells made of several semiconductors with different gaps overcome it and reach over 40 %.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A modern transistor has a gate 20 nm wide. Neighbouring silicon atoms are 0.235 nm apart. About how many atoms fit side by side?
    answer:
      value: 85
      tolerance: 3
    hints:
      - 20 ÷ 0.235 = ?
      - The result is below 100.
    explanation: Only about 85 atoms! At these sizes electrons tunnel through thin layers. Chip designers have to plan for quantum physics.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a diode lets current through in only one direction.
    params:
      keywords:
        - - p-
          - n-
          - dotier
          - dop
        - - sperrschicht
          - depletion
          - grenze
          - boundary
        - - richtung
          - direction
          - durchlass
          - forward
          - sperr
          - block
      sample: A diode consists of p- and n-silicon. At the boundary a depletion zone without free charges forms. With the right polarity charges are pushed in and current flows. With the wrong polarity the zone widens and blocks.
    difficulty: 3

srs:
  cards_from: ["c3", "d3", "x2"]
