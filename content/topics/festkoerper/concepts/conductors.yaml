id: sci.solid.conductors
type: concept
title: "Leiter und Isolatoren"
summary: "Freie Elektronen, Stöße mit dem Gitter und warum Metalle glänzen und leiten."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Leiten oder sperren
    body: "Ein Kabel aus Kupfer leitet Strom, eine Glasscheibe nicht. Dreh am **Widerstand**: Wie viel Strom lässt ein guter Leiter durch, wie viel ein schlechter?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: circuit

  - kind: problem
    id: hook
    widget: choice
    prompt: Warum leitet Kupfer den Strom, Glas aber praktisch nicht?
    params:
      options:
        - label: In Kupfer gibt es frei bewegliche Elektronen, in Glas sind alle fest gebunden.
          correct: true
        - label: Kupfer hat mehr Elektronen.
          feedback: Auch Glas hat sehr viele Elektronen. Entscheidend ist, ob sie sich bewegen können.
        - label: Glas ist durchsichtig, darum kann kein Strom hindurch.
          feedback: Durchsichtig und isolierend hängen zusammen, sind aber nicht der Grund.
    hints:
      - Strom braucht bewegliche Ladung.
      - Im Metall teilen sich alle Atome ihre äußeren Elektronen.
    explanation: Jedes Kupferatom gibt etwa ein Elektron in einen gemeinsamen See ab. Im Glas sitzen alle Elektronen fest an ihren Atomen.

  - kind: explain
    id: c1
    body: In einem Metall bewegen sich die **freien Elektronen** durch das ganze Gitter. In Kupfer sind es rund 8,5 · 10²⁸ pro Kubikmeter – etwa eins pro Atom. Ein elektrisches Feld schiebt sie alle in eine Richtung.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Leiter, Halbleiter oder Isolator?
    params:
      buckets:
        - id: b1
          label: Leiter
        - id: b2
          label: Halbleiter
        - id: b3
          label: Isolator
      items:
        - label: Kupfer
          bucket: b1
        - label: Silber
          bucket: b1
        - label: Silizium
          bucket: b2
        - label: Germanium
          bucket: b2
        - label: Glas
          bucket: b3
        - label: Gummi
          bucket: b3
    hints:
      - Metalle leiten gut.
      - Silizium und Germanium stecken in Chips.
    explanation: Metalle leiten, Glas und Gummi isolieren. Halbleiter liegen dazwischen – und lassen sich gezielt einstellen. Darum baut man aus ihnen Elektronik.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Kupfer hat einen spezifischen Widerstand von etwa 10⁻⁸ Ωm, Glas etwa 10¹² Ωm. Um wie viele Zehnerstufen unterscheiden sie sich?
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 4
        misconception: neg-exponent
        text: "Das Minus zählt mit: Von −8 bis +12 sind es 20 Stufen."
    hints:
      - Von 10⁻⁸ bis 10⁰ sind es 8 Stufen.
      - Dann noch bis 10¹².
    explanation: 20 Zehnerstufen – kaum eine andere Eigenschaft schwankt in der Natur so stark.

  - kind: problem
    id: c4
    widget: choice
    prompt: Ein Metalldraht wird heiß. Leitet er dann besser oder schlechter?
    params:
      options:
        - label: Schlechter – die stärker schwingenden Atome stoßen die Elektronen öfter.
          correct: true
        - label: Besser – Wärme macht Elektronen schneller.
          feedback: Mehr freie Elektronen gibt es im Metall nicht. Die Stöße nehmen zu.
        - label: Gleich gut.
          feedback: Der Widerstand von Kupfer steigt pro Grad um etwa 0,4 %.
    hints:
      - Was machen die Atome im Gitter, wenn es wärmer wird?
      - Mehr Hindernisse heißt mehr Widerstand.
    explanation: Wärme lässt das Gitter stärker zittern. Die Elektronen prallen öfter an und kommen schlechter voran. Glühlampen nutzen das als eingebaute Strombremse.

  - kind: explain
    id: d1
    depth: 2
    body: Im Drude-Modell beschleunigt das Feld jedes Elektron, bis es nach der **Stoßzeit** τ an das Gitter prallt und neu startet. Daraus folgt die Leitfähigkeit $\sigma = \frac{n e^2 \tau}{m}$.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Kupfer: n = 8,5 · 10²⁸ pro m³, τ = 2,5 · 10⁻¹⁴ s, e = 1,6 · 10⁻¹⁹ C, m = 9,11 · 10⁻³¹ kg. Wie groß ist σ = n e² τ : m – in 10⁷ S/m? Auf eine Stelle."
    answer:
      value: 6
      tolerance: 0.2
    hints:
      - e² = 2,56 · 10⁻³⁸. n · e² ≈ 2,18 · 10⁻⁹.
      - Mal τ, dann durch m.
    explanation: σ ≈ 6 · 10⁷ S/m – fast genau der gemessene Wert. Ein einfaches Bild von Kugeln im Gitter trifft die Zahl erstaunlich gut.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Metalle leiten nicht nur Strom gut, sondern auch Wärme. Warum?
    params:
      options:
        - label: Die freien Elektronen tragen auch Wärmeenergie schnell durch das Metall.
          correct: true
        - label: Weil Metalle schwer sind.
          feedback: Blei ist schwer und leitet Wärme eher mäßig. Es sind die Elektronen.
        - label: Weil Metalle glänzen.
          feedback: Glanz und Wärmeleitung haben dieselbe Ursache, aber Glanz ist nicht der Grund.
    hints:
      - Wer transportiert im Metall den Strom?
      - Schnelle Teilchen tragen auch Energie.
    explanation: Gute elektrische Leiter sind fast immer gute Wärmeleiter – Silber und Kupfer vorneweg. Das Verhältnis beider Leitfähigkeiten ist bei Metallen nahezu gleich (Wiedemann-Franz).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Selbst am absoluten Nullpunkt fliegen die Elektronen in Kupfer mit rund 1600 km/s umher. Warum stehen sie nicht still?
    params:
      options:
        - label: Jeder Zustand darf nur ein Elektron je Spinrichtung tragen – sie müssen bis zu hohen Energien aufgefüllt werden.
          correct: true
        - label: Sie werden vom Gitter angestoßen.
          feedback: Bei 0 K schwingt das Gitter kaum. Der Grund ist das Pauli-Prinzip.
        - label: Weil 0 K nie ganz erreicht wird.
          feedback: Auch rechnerisch bei genau 0 K bleiben sie schnell.
    hints:
      - Elektronen gehorchen dem Pauli-Prinzip.
      - Wie füllt man ein Haus, in dem jedes Bett nur einmal belegt werden darf?
    explanation: Die Elektronen stapeln sich bis zur Fermi-Energie von rund 7 eV. Die obersten sind sehr schnell – reine Quantenphysik, ganz ohne Wärme.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Die Fermi-Energie von Kupfer ist etwa 7 eV. Die thermische Energie bei Zimmertemperatur ist k · T ≈ 0,025 eV. Wievielmal größer ist die Fermi-Energie?
    answer:
      value: 280
    hints:
      - Teile 7 durch 0,025.
      - "7 : 0,025 = 7 · 40."
    explanation: 280-mal. Wärme kann nur die Elektronen ganz oben am Rand anregen – darum tragen Metallelektronen kaum zur Wärmekapazität bei. Ein Rätsel der klassischen Physik war damit gelöst.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Metalle Strom leiten und Glas nicht.
    params:
      keywords:
        - - frei
          - free
          - beweglich
          - mobile
          - move
        - - elektron
          - electron
        - - gebunden
          - bound
          - fest
          - fixed
          - atom
      sample: Im Metall gibt jedes Atom ein Elektron in einen gemeinsamen See ab. Diese freien Elektronen kann ein Feld verschieben – es fließt Strom. Im Glas sind alle Elektronen fest an ihre Atome gebunden.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x2"]
