id: sci.solid.superconductivity
type: concept
title: "Superconductivity"
summary: "Zero resistance, floating magnets and electrons that dance in pairs."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The puzzle of the cold
    body: More than a hundred years ago, a scientist cooled a metal more than ever before. What happened next still keeps physics busy today. Uncover the story of **superconductivity**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🧊
            front: "1911: Ice cold"
            back: Kamerlingh Onnes cools mercury with liquid helium to a few degrees above absolute zero.
          - icon: 🏺
            front: "1986: Ceramics"
            back: Bednorz and Müller find ceramics that superconduct at much higher temperatures.
          - icon: 🚄
            front: "Today: floating train"
            back: In Japan a train floats on superconducting magnets – at over 600 km/h in tests.
          - icon: 🔮
            front: The dream
            back: A superconductor at room temperature – so far nobody has found one.

  - kind: problem
    id: hook
    widget: choice
    prompt: In 1911 Heike Kamerlingh Onnes cooled mercury below 4.2 K. What happened to its resistance?
    params:
      options:
        - label: It dropped abruptly to exactly zero.
          correct: true
        - label: It slowly decreased a little.
          feedback: That would be so for ordinary metals. Here it suddenly vanished completely.
        - label: It rose sharply.
          feedback: Cold makes metals conduct better. Here even perfectly.
    hints:
      - The phenomenon is called superconductivity.
      - Supra means »beyond« – beyond ordinary conduction.
    explanation: Below a critical temperature the resistance vanishes completely. In superconducting rings currents flow for years without loss.

  - kind: explain
    id: c1
    body: Below the critical temperature T_c a material becomes a **superconductor**. Its resistance is exactly zero. For metals T_c is close to absolute zero. Some ceramics work above 77 K. That is the temperature of liquid nitrogen.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Is liquid nitrogen (77 K) enough for cooling – or is liquid helium needed?
    params:
      buckets:
        - id: b1
          label: needs helium
        - id: b2
          label: nitrogen is enough
      items:
        - label: Mercury (4.2 K)
          bucket: b1
        - label: Niobium (9.2 K)
          bucket: b1
        - label: Magnesium diboride (39 K)
          bucket: b1
        - label: YBCO ceramic (92 K)
          bucket: b2
        - label: BSCCO ceramic (110 K)
          bucket: b2
    hints:
      - Compare T_c with 77 K.
      - Only above 77 K is nitrogen enough.
    explanation: Only the ceramics lie above 77 K. Liquid nitrogen is as cheap as milk, helium expensive and scarce – which is why their discovery in 1986 was a sensation.

  - kind: problem
    id: c3
    widget: numeric
    prompt: A copper cable of 0.01 Ω carries 1000 A. How many kilowatts turn into heat in it? A superconductor would lose nothing.
    params:
      unit: kW
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 10000
        misconception: unit-kw
        text: That is watts. 1 kW = 1000 W.
    hints:
      - P = I² · R.
      - 1000² · 0.01 = 10,000 W.
    explanation: 10 kW of constant heating – zero in a superconductor. That is why superconducting cables are used for huge currents, for example in particle accelerators.

  - kind: problem
    id: c4
    widget: choice
    prompt: A small magnet floats above a cooled superconductor. Why?
    params:
      options:
        - label: The superconductor pushes the magnetic field out of its interior and repels the magnet.
          correct: true
        - label: The superconductor is itself a magnet.
          feedback: It only becomes a counter-magnet because of the field. Without the magnet nothing floats.
        - label: The cold air carries it.
          feedback: Cold air is heavier but carries no magnet.
    hints:
      - Inside a superconductor the magnetic field is zero.
      - Lossless surface currents keep the field out.
    explanation: That is the Meissner–Ochsenfeld effect. Surface currents create an opposing field, and the magnet floats. Maglev trains use related effects.

  - kind: explain
    id: d1
    depth: 2
    body: Why does current flow without resistance? Via vibrations of the lattice two electrons weakly attract each other. These **Cooper pairs** all occupy the same quantum state. Single collisions cannot disturb it.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Is a superconductor only a very good wire? Or is it more?
    params:
      options:
        - label: No – it also actively expels magnetic fields; it is a state of matter of its own.
          correct: true
        - label: Yes, just without friction.
          feedback: A perfect conductor would freeze an existing field in, not throw it out.
        - label: Yes, it is just very cold.
          feedback: Cold alone is not enough – many metals never become superconducting.
    hints:
      - Cool it down in a magnetic field. What happens to the field inside?
      - The superconductor pushes it out on cooling.
    explanation: The Meissner effect shows that superconductivity is a true phase, like liquid or solid. Gold and copper, by the way, never become superconducting.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: The superconducting coil of an MRI scanner has L = 10 H and carries 300 A. How much energy does its magnetic field store? E = ½ · L · I². In MJ, to two decimals.
    params:
      unit: MJ
    answer:
      value: 0.45
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 0.0015) < 0.0001
        misconception: not-squared
        text: "The current is squared: 300² = 90,000."
    hints:
      - ½ · 10 · 300².
      - How many MJ is 450,000 J?
    explanation: 0.45 MJ – as much as a car at 100 km/h. The current circulates for years without a power source. If the coil warms up, this energy must drain away safely.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "In a superconducting ring the magnetic flux is quantised. It only comes in multiples of the **flux quantum** $\\Phi_0 = \\frac{h}{2e}$. The 2 in the denominator gives it away: the charge carriers are pairs."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Calculate the flux quantum Φ₀ = h ÷ (2e) with h = 6.63 · 10⁻³⁴ Js and e = 1.6 · 10⁻¹⁹ C. In 10⁻¹⁵ Wb, to two decimals.
    answer:
      value: 2.07
      tolerance: 0.03
    feedback:
      - when: abs(numval(state.input) - 4.14) < 0.03
        misconception: single-charge
        text: A Cooper pair's charge is 2e. Divide by 2e, not by e.
    hints:
      - 2e = 3.2 · 10⁻¹⁹ C.
      - 6.63 · 10⁻³⁴ ÷ 3.2 · 10⁻¹⁹ = ?
    explanation: Φ₀ ≈ 2.07 · 10⁻¹⁵ Wb. SQUID sensors count such flux quanta and so measure brain currents through the skull.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Many researchers hunt for a superconductor that works at room heat. Why does that matter so much?
    params:
      options:
        - label: Lossless power grids and cheap strong magnets would become possible – so far every known superconductor needs strong cooling or enormous pressure.
          correct: true
        - label: They have long been in every phone.
          feedback: Phones contain no superconductors. None has been reliably confirmed at room temperature.
        - label: So computers run colder.
          feedback: It is about lossless current, not cooling.
    hints:
      - How much electricity is lost in power lines today?
      - Cooling costs energy and effort.
    explanation: A few per cent are lost as heat in the grid. Several reported »room-temperature superconductors« did not survive scrutiny. The search goes on.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why a magnet floats above a superconductor.
    params:
      keywords:
        - - feld
          - field
          - magnetfeld
          - magnetic
        - - verdräng
          - expel
          - hinaus
          - out
          - innen
          - inside
        - - strom
          - current
          - gegen
          - oppos
          - abstoß
          - repel
      sample: A superconductor expels any magnetic field from its inside. Lossless currents flow at its surface and create an opposing field. This field repels the magnet – it floats.
    difficulty: 3

srs:
  cards_from: ["c3", "d3", "x2"]
