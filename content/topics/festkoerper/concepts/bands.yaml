id: sci.solid.bands
type: concept
title: "Das Bändermodell"
summary: "Aus Energiestufen werden Bänder – und die Lücke dazwischen entscheidet alles."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Sprung über die Lücke
    body: "Ob ein Stoff leitet, entscheidet eine Lücke. Nach rechts wird die **Bandlücke** breiter, nach oben springen mehr Elektronen hinüber. Zieh die Temperatur hoch: Was ändert die Wärme?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: exp(-x/(0.0001724*t))
        x:
          - 0
          - 0.6
        y:
          - 0
          - 1
        sliders:
          - id: t
            label: Temperatur (K)
            min: 100
            max: 1000
            step: 100
            initial: 300

  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Atom hat scharfe Energiestufen. Was passiert damit, wenn sich Milliarden Atome zu einem Kristall zusammenlagern?
    params:
      options:
        - label: Jede Stufe spaltet in unzählige dicht benachbarte Stufen auf – ein Band.
          correct: true
        - label: Die Stufen bleiben genau gleich.
          feedback: Nahe Atome beeinflussen sich. Ihre Stufen verschieben und spalten sich.
        - label: Alle Stufen verschwinden.
          feedback: Es gibt weiter erlaubte Energien – nur viel mehr davon.
    hints:
      - Zwei gekoppelte Pendel haben zwei leicht verschiedene Frequenzen.
      - Viele gekoppelte Atome, viele Stufen.
    explanation: Aus N Atomen werden N Stufen, so dicht, dass sie ein durchgehendes Band bilden. Zwischen den Bändern bleiben verbotene Bereiche.

  - kind: explain
    id: c1
    body: Im Kristall gibt es erlaubte Energiebänder und dazwischen eine **Bandlücke**. Ist das obere Band leer und die Lücke groß, kann kein Elektron hinauf – ein Isolator. Ist die Lücke klein, ist es ein Halbleiter.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Wohin gehört der Stoff nach seiner Bandlücke?
    params:
      buckets:
        - id: b1
          label: keine Lücke
        - id: b2
          label: kleine Lücke
        - id: b3
          label: große Lücke
      items:
        - label: Kupfer
          bucket: b1
        - label: Aluminium
          bucket: b1
        - label: Silizium (1,1 eV)
          bucket: b2
        - label: Germanium (0,67 eV)
          bucket: b2
        - label: Diamant (5,5 eV)
          bucket: b3
        - label: Quarzglas (9 eV)
          bucket: b3
    hints:
      - Metalle haben ein halb gefülltes Band.
      - Über 4 eV gilt als groß.
    explanation: Metalle leiten ohne Lücke, Halbleiter haben um 1 eV, Isolatoren mehrere eV. Alles Weitere – Farbe, Leitfähigkeit, Nutzen – folgt daraus.

  - kind: problem
    id: c3
    widget: numeric
    prompt: "Silizium hat eine Bandlücke von 1,1 eV. Bis zu welcher Wellenlänge kann Licht ein Elektron über die Lücke heben? λ in nm = 1240 : E in eV. Auf ganze nm."
    params:
      unit: nm
    answer:
      value: 1127
      tolerance: 5
    hints:
      - "1240 : 1,1 = ?"
      - Längere Wellen haben zu wenig Energie.
    explanation: Bis etwa 1130 nm, im nahen Infrarot. Alles sichtbare Licht kann Silizium anregen – darum taugt es für Solarzellen und Kamerachips.

  - kind: problem
    id: c4
    widget: choice
    prompt: Diamant ist durchsichtig, Silizium grau und undurchsichtig. Beide haben dasselbe Gitter. Warum der Unterschied?
    params:
      options:
        - label: Diamants Lücke (5,5 eV) ist größer als die Energie jedes sichtbaren Photons – nichts wird geschluckt.
          correct: true
        - label: Diamant ist reiner.
          feedback: Auch reines Silizium ist undurchsichtig. Es liegt an der Lücke.
        - label: Silizium ist dicker.
          feedback: Auch dünnes Silizium schluckt sichtbares Licht.
    hints:
      - Sichtbare Photonen haben 1,7 bis 3,1 eV.
      - Ein Photon wird nur geschluckt, wenn es über die Lücke heben kann.
    explanation: Silizium schluckt alle sichtbaren Photonen, Diamant keines. Glas ist aus demselben Grund durchsichtig – seine Lücke ist noch größer.

  - kind: explain
    id: d1
    depth: 2
    body: Bei der Temperatur T springen Elektronen nur selten über die Lücke. Ihr Anteil folgt dem **Boltzmann-Faktor** $e^{-E_g/(2kT)}$. Bei Zimmertemperatur ist kT nur 0,026 eV – darum ist die Größe der Lücke so entscheidend.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Wievielmal mehr Elektronen springen in Germanium (0,67 eV) über die Lücke als in Silizium (1,1 eV)? Berechne e hoch ((1,1 − 0,67) : 0,052). Auf Hunderter."
    answer:
      value: 3900
      tolerance: 300
    feedback:
      - when: abs(numval(state.input) - 8.3) < 0.1
        misconception: exponent-only
        text: Das ist der Exponent. Rechne noch e hoch 8,3.
    hints:
      - "Der Exponent ist 0,43 : 0,052 ≈ 8,3."
      - e hoch 8,3 ≈ ?
    explanation: Rund 4000-mal mehr. Eine um 0,4 eV kleinere Lücke macht einen riesigen Unterschied. Darum werden Germanium-Bauteile warm schnell unbrauchbar.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Ein Halbleiter wird wärmer. Was passiert mit seinem Widerstand – anders als beim Metall?
    params:
      options:
        - label: Er sinkt – viel mehr Elektronen springen über die Lücke.
          correct: true
        - label: Er steigt wie beim Metall.
          feedback: Mehr Stöße gibt es auch, aber die Zahl der Ladungsträger wächst viel stärker.
        - label: Er bleibt gleich.
          feedback: Halbleiter reagieren sogar besonders stark auf Temperatur.
    hints:
      - Im Halbleiter entscheidet die Zahl freier Ladungen.
      - Wärme hilft beim Sprung über die Lücke.
    explanation: "Der Boltzmann-Faktor wächst steil mit T. So funktionieren Temperatursensoren (NTC): Wärmer heißt leitfähiger."
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Springt ein Elektron ins obere Band, bleibt unten ein leerer Platz. Nachbarelektronen rücken nach, und der leere Platz wandert. Dieses **Loch** verhält sich wie ein positiver Ladungsträger.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Reines Silizium hat bei Zimmertemperatur etwa 10¹⁰ freie Elektronen pro cm³ – bei 5 · 10²² Atomen. Jedes wievielte Atom hat ein Elektron abgegeben? In 10¹².
    answer:
      value: 5
    hints:
      - "5 · 10²² : 10¹⁰ = 5 · 10¹²."
      - In 10¹² ausgedrückt bleibt die 5.
    explanation: Nur eins von 5 Billionen. Darum leitet reines Silizium schlecht – und darum reicht schon eine winzige Dotierung, um alles zu ändern.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux mit dem Bändermodell, warum Glas isoliert und Kupfer leitet.
    params:
      keywords:
        - - band
          - bänder
          - bands
        - - lücke
          - gap
          - verboten
          - forbidden
        - - leer
          - empty
          - voll
          - full
          - springen
          - jump
      sample: Im Glas ist das untere Band voll, das obere leer, und dazwischen liegt eine große Lücke. Kein Elektron schafft den Sprung, also fließt kein Strom. Im Kupfer ist ein Band nur halb voll, die Elektronen können sich frei bewegen.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x2"]
