id: sci.solid.bands
type: concept
title: "The band model"
summary: "Energy levels become bands – and the gap between them decides everything."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The jump across the gap
    body: "Whether a material conducts depends on a gap. To the right the **band gap** gets wider, upwards more electrons jump across. Drag the temperature up: what does the heat change?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: exp(-x/(0.0001724*t))
        x:
          - 0
          - 0.6
        y:
          - 0
          - 1
        sliders:
          - id: t
            label: Temperature (K)
            min: 100
            max: 1000
            step: 100
            initial: 300

  - kind: problem
    id: hook
    widget: choice
    prompt: An atom has sharp energy levels. What happens to them when billions of atoms come together in a crystal?
    params:
      options:
        - label: Each level splits into countless closely spaced levels – a band.
          correct: true
        - label: The levels stay exactly the same.
          feedback: Nearby atoms affect each other. Their levels shift and split.
        - label: All levels disappear.
          feedback: There are still allowed energies – just many more of them.
    hints:
      - Two coupled pendulums have two slightly different frequencies.
      - Many coupled atoms, many levels.
    explanation: N atoms give N levels, so close that they form a continuous band. Forbidden ranges remain between the bands.

  - kind: explain
    id: c1
    body: A crystal has allowed energy bands with a **band gap** between them. If the upper band is empty and the gap is large, no electron gets up – an insulator. A small gap makes a semiconductor.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Where does the material belong by its band gap?
    params:
      buckets:
        - id: b1
          label: no gap
        - id: b2
          label: small gap
        - id: b3
          label: large gap
      items:
        - label: Copper
          bucket: b1
        - label: Aluminium
          bucket: b1
        - label: Silicon (1.1 eV)
          bucket: b2
        - label: Germanium (0.67 eV)
          bucket: b2
        - label: Diamond (5.5 eV)
          bucket: b3
        - label: Fused silica (9 eV)
          bucket: b3
    hints:
      - Metals have a half-filled band.
      - Above 4 eV counts as large.
    explanation: Metals conduct with no gap, semiconductors have about 1 eV, insulators several eV. Everything else – colour, conductivity, use – follows from that.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Silicon has a band gap of 1.1 eV. Up to what wavelength can light lift an electron across the gap? λ in nm = 1240 ÷ E in eV. To whole nm.
    params:
      unit: nm
    answer:
      value: 1127
      tolerance: 5
    hints:
      - 1240 ÷ 1.1 = ?
      - Longer waves have too little energy.
    explanation: Up to about 1130 nm, in the near infrared. All visible light can excite silicon – which is why it suits solar cells and camera chips.

  - kind: problem
    id: c4
    widget: choice
    prompt: Diamond is transparent, silicon grey and opaque. Both have the same lattice. Why the difference?
    params:
      options:
        - label: Diamond's gap (5.5 eV) is larger than the energy of any visible photon – nothing is absorbed.
          correct: true
        - label: Diamond is purer.
          feedback: Even pure silicon is opaque. It is the gap.
        - label: Silicon is thicker.
          feedback: Even thin silicon absorbs visible light.
    hints:
      - Visible photons have 1.7 to 3.1 eV.
      - A photon is only absorbed if it can lift an electron across the gap.
    explanation: Silicon absorbs all visible photons, diamond none. Glass is transparent for the same reason – its gap is even larger.

  - kind: explain
    id: d1
    depth: 2
    body: At temperature T electrons only rarely jump across the gap. Their share follows the **Boltzmann factor** $e^{-E_g/(2kT)}$. At room temperature kT is only 0.026 eV – that is why the size of the gap is so decisive.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: How many times more electrons jump across the gap in germanium (0.67 eV) than in silicon (1.1 eV)? Calculate e to the ((1.1 − 0.67) ÷ 0.052). To the nearest hundred.
    answer:
      value: 3900
      tolerance: 300
    feedback:
      - when: abs(numval(state.input) - 8.3) < 0.1
        misconception: exponent-only
        text: That is the exponent. Still work out e to the 8.3.
    hints:
      - The exponent is 0.43 ÷ 0.052 ≈ 8.3.
      - e to the 8.3 ≈ ?
    explanation: About 4000 times more. A gap smaller by 0.4 eV makes a huge difference. That is why germanium parts become useless quickly when warm.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A semiconductor warms up. What happens to its resistance – unlike in a metal?
    params:
      options:
        - label: It falls – many more electrons jump across the gap.
          correct: true
        - label: It rises as in a metal.
          feedback: There are more collisions too, but the number of charge carriers grows far more.
        - label: It stays the same.
          feedback: Semiconductors respond particularly strongly to temperature.
    hints:
      - In a semiconductor the number of free charges decides.
      - Heat helps with the jump across the gap.
    explanation: "The Boltzmann factor grows steeply with T. That is how temperature sensors (NTC) work: warmer means more conductive."
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: When an electron jumps into the upper band, an empty spot remains below. Neighbouring electrons move up into it, and the empty spot wanders. This **hole** behaves like a positive charge carrier.

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Pure silicon at room temperature has about 10¹⁰ free electrons per cm³ – among 5 · 10²² atoms. One in how many atoms has given up an electron? In 10¹².
    answer:
      value: 5
    hints:
      - 5 · 10²² ÷ 10¹⁰ = 5 · 10¹².
      - Expressed in 10¹² that leaves 5.
    explanation: Only one in 5 trillion. That is why pure silicon conducts poorly – and why a tiny bit of doping changes everything.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux with the band model why glass insulates and copper conducts.
    params:
      keywords:
        - - band
          - bänder
          - bands
        - - lücke
          - gap
          - verboten
          - forbidden
        - - leer
          - empty
          - voll
          - full
          - springen
          - jump
      sample: In glass the lower band is full, the upper empty, with a large gap between. No electron makes the jump, so no current flows. In copper a band is only half full, and the electrons can move freely.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x2"]
