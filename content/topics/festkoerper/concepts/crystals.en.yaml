id: sci.solid.crystals
type: concept
title: "Crystals"
summary: "Atoms in neat rows – and how X-rays make the lattice visible."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many atoms sit side by side along a single millimetre of a salt crystal? Their spacing is 0.28 nm."
    params:
      min: 100
      max: 10000000000
      scale: log
    answer:
      value: 3500000
      within: 50
    explanation: 1 mm ÷ 0.28 nm ≈ 3.5 million atoms. A grain of salt is a cube of billions times billions of atoms, all in perfect order.

  - kind: explain
    id: c1
    body: In a **crystal lattice** the atoms sit in a pattern that repeats in every direction. The smallest repeating piece is called the unit cell. The whole crystal is built from it.

  - kind: problem
    id: c2
    widget: match
    prompt: What holds this crystal together?
    params:
      pairs:
        - left: Table salt
          right: Positive and negative ions
        - left: Copper
          right: A sea of free electrons
        - left: Diamond
          right: Shared electron pairs
        - left: Ice
          right: Hydrogen bonds
    hints:
      - Metals share their outer electrons with everyone.
      - Salt consists of charged particles.
    explanation: "The kind of bonding sets the properties: salt is brittle, copper bendy and conductive, diamond extremely hard."

  - kind: problem
    id: c3
    widget: choice
    prompt: Is window glass a crystal?
    params:
      options:
        - label: No – its atoms are fixed but disordered, like a frozen liquid.
          correct: true
        - label: Yes, glass is clear like a crystal.
          feedback: Clear does not mean ordered. Rock crystal and glass are both clear, but only one is ordered.
        - label: No, glass is a liquid.
          feedback: Glass does not flow measurably. It is a solid but amorphous material.
    hints:
      - Is there a pattern that repeats?
      - Disordered and solid is called amorphous.
    explanation: "Glass is amorphous: solid but without long-range order. The legend of old church windows flowing downwards is not true."

  - kind: problem
    id: c4
    widget: numeric
    prompt: In the face-centred cubic lattice of copper, each of the 8 corner atoms counts 1/8 for the cell. Each of the 6 face atoms counts half. How many atoms does the cell hold?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 14
        misconception: count-whole
        text: The atoms also belong to the neighbouring cells. Count only their share.
    hints:
      - "Corners: 8 · 1/8."
      - "Faces: 6 · 1/2."
    explanation: 1 + 3 = 4 atoms. This is the densest way to pack spheres – like oranges at the market.

  - kind: explain
    id: d1
    depth: 2
    body: X-rays have a wavelength about the size of atomic spacings. Scattered by the lattice planes, they reinforce only at certain angles. This is described by the **Bragg condition** $2d \sin\theta = n\lambda$.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Lattice planes are d = 0.28 nm apart. The X-rays have λ = 0.154 nm. At what angle θ does the first reflection (n = 1) appear? To one decimal place.
    params:
      unit: °
    answer:
      value: 16
      tolerance: 0.2
    feedback:
      - when: abs(numval(state.input) - 33.4) < 0.3
        misconception: forgot-two
        text: "Do not forget the 2 in front of d: sin θ = λ ÷ (2d)."
    hints:
      - sin θ = 0.154 ÷ 0.56 ≈ 0.275.
      - Which angle has a sine of 0.275?
    explanation: θ ≈ 16.0°. From the angles of many reflections the whole lattice is reconstructed – that is also how the DNA double helix was decoded.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Why can copper be bent, while a salt crystal shatters when struck?
    params:
      options:
        - label: In the metal atomic planes slide and the electron sea holds them. In salt like charges end up side by side and repel.
          correct: true
        - label: Copper is softer because it is lighter.
          feedback: Copper is actually denser than salt. It is the bonding.
        - label: Salt contains water that makes it brittle.
          feedback: Dry salt is just as brittle. It is about the charges.
    hints:
      - What happens if you shift a row of ions by one place?
      - Plus next to plus repels.
    explanation: Metallic bonding has no direction, so planes simply slide on. In an ionic lattice a small shift wrecks the order of charges – the crystal cleaves.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Table salt: the cubic cell has an edge of 0.564 nm and contains 4 NaCl units of 58.44 u each (1 u = 1.66 · 10⁻²⁷ kg). What density follows – in kg/m³? To the nearest ten."
    params:
      unit: kg/m³
    answer:
      value: 2160
      tolerance: 30
    hints:
      - "Mass of the cell: 4 · 58.44 · 1.66 · 10⁻²⁷ kg ≈ 3.88 · 10⁻²⁵ kg."
      - "Volume: (0.564 · 10⁻⁹ m)³ ≈ 1.79 · 10⁻²⁸ m³."
    explanation: About 2160 kg/m³ – exactly what the scales measure. The tiny cell reveals a property of the whole crystal.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how X-rays can be used to look inside a crystal.
    params:
      keywords:
        - - röntgen
          - x-ray
          - wellenlänge
          - wavelength
        - - gitter
          - lattice
          - ebene
          - plane
          - abstand
          - spacing
        - - winkel
          - angle
          - verstärk
          - reinforc
          - interferenz
          - interference
          - bragg
      sample: X-rays have a wavelength like the spacing of atoms. Scattered by the lattice planes, they reinforce only at certain angles. From these angles one calculates the spacings and the whole lattice.
    difficulty: 3

srs:
  cards_from: ["c4", "d2", "x1"]
