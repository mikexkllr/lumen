id: sci.solid.superconductivity
type: concept
title: "Supraleitung"
summary: "Null Widerstand, schwebende Magnete und Elektronen, die zu zweit tanzen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: 1911 kühlte Heike Kamerlingh Onnes Quecksilber unter 4,2 K. Was geschah mit seinem Widerstand?
    params:
      options:
        - label: Er fiel schlagartig auf genau null.
          correct: true
        - label: Er sank langsam ein wenig.
          feedback: Bei normalen Metallen wäre das so. Hier verschwand er plötzlich ganz.
        - label: Er stieg stark an.
          feedback: Kälte macht Metalle besser leitend. Hier sogar perfekt.
    hints:
      - Das Phänomen heißt Supraleitung.
      - Supra heißt »über« – über das normale Leiten hinaus.
    explanation: Unterhalb einer Sprungtemperatur verschwindet der Widerstand vollständig. In supraleitenden Ringen fließen Ströme jahrelang ohne Verlust.

  - kind: explain
    id: c1
    body: "Unterhalb der Sprungtemperatur T_c wird ein Stoff zum **Supraleiter**: Sein Widerstand ist exakt null. Bei Metallen liegt T_c nahe am absoluten Nullpunkt. Manche Keramiken schaffen über 77 K, die Temperatur von flüssigem Stickstoff."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Reicht flüssiger Stickstoff (77 K) zum Kühlen – oder braucht es flüssiges Helium?
    params:
      buckets:
        - id: b1
          label: braucht Helium
        - id: b2
          label: Stickstoff reicht
      items:
        - label: Quecksilber (4,2 K)
          bucket: b1
        - label: Niob (9,2 K)
          bucket: b1
        - label: Magnesiumdiborid (39 K)
          bucket: b1
        - label: YBCO-Keramik (92 K)
          bucket: b2
        - label: BSCCO-Keramik (110 K)
          bucket: b2
    hints:
      - Vergleiche T_c mit 77 K.
      - Nur über 77 K reicht Stickstoff.
    explanation: Nur die Keramiken liegen über 77 K. Flüssiger Stickstoff ist billig wie Milch, Helium teuer und knapp – darum war ihre Entdeckung 1986 eine Sensation.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Kupferkabel mit 0,01 Ω führt 1000 A. Wie viele Kilowatt werden darin zu Wärme? Ein Supraleiter verliert dabei nichts.
    params:
      unit: kW
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 10000
        misconception: unit-kw
        text: Das sind Watt. 1 kW = 1000 W.
    hints:
      - P = I² · R.
      - 1000² · 0,01 = 10 000 W.
    explanation: 10 kW Dauerheizung – im Supraleiter null. Darum nutzt man supraleitende Kabel für riesige Ströme, etwa in Teilchenbeschleunigern.

  - kind: problem
    id: c4
    widget: choice
    prompt: Ein kleiner Magnet schwebt über einem gekühlten Supraleiter. Warum?
    params:
      options:
        - label: Der Supraleiter drängt das Magnetfeld aus seinem Inneren hinaus und stößt den Magneten ab.
          correct: true
        - label: Der Supraleiter ist selbst ein Magnet.
          feedback: Er wird erst durch das Feld zu einem Gegenmagneten. Ohne Magnet schwebt nichts.
        - label: Die kalte Luft trägt ihn.
          feedback: Kalte Luft ist schwerer, trägt aber keinen Magneten.
    hints:
      - Im Inneren eines Supraleiters ist das Magnetfeld null.
      - Verlustfreie Ströme an der Oberfläche halten das Feld draußen.
    explanation: Das ist der **Meißner-Ochsenfeld-Effekt**. Oberflächenströme erzeugen ein Gegenfeld, und der Magnet schwebt. Magnetschwebebahnen nutzen verwandte Effekte.

  - kind: explain
    id: d1
    depth: 2
    body: Warum fließt Strom ohne Widerstand? Über Schwingungen des Gitters ziehen sich je zwei Elektronen schwach an. Diese **Cooper-Paare** besetzen alle denselben Quantenzustand. Einzelne Stöße können ihn nicht stören.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Ist ein Supraleiter einfach ein besonders perfekter Leiter?
    params:
      options:
        - label: Nein – er verdrängt zusätzlich aktiv Magnetfelder, das ist ein eigener Zustand der Materie.
          correct: true
        - label: Ja, nur ohne Reibung.
          feedback: Ein perfekter Leiter würde ein vorhandenes Feld einfrieren, nicht hinauswerfen.
        - label: Ja, er ist einfach sehr kalt.
          feedback: Kälte allein reicht nicht – viele Metalle werden nie supraleitend.
    hints:
      - Kühl ihn im Magnetfeld ab. Was passiert mit dem Feld innen?
      - Der Supraleiter stößt es beim Abkühlen hinaus.
    explanation: "Der Meißner-Effekt zeigt: Supraleitung ist eine echte Phase, wie flüssig oder fest. Gold und Kupfer werden übrigens nie supraleitend."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Die supraleitende Spule eines MRT-Geräts hat L = 10 H und führt 300 A. Wie viel Energie speichert ihr Magnetfeld? E = ½ · L · I². In MJ, auf zwei Stellen.
    params:
      unit: MJ
    answer:
      value: 0.45
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 0.0015) < 0.0001
        misconception: not-squared
        text: "Der Strom wird quadriert: 300² = 90 000."
    hints:
      - ½ · 10 · 300².
      - 450 000 J sind wie viel MJ?
    explanation: 0,45 MJ – so viel wie ein Auto bei 100 km/h. Der Strom kreist jahrelang ohne Stromquelle. Wird die Spule warm, muss diese Energie sicher abfließen.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "In einem supraleitenden Ring ist der magnetische Fluss gequantelt. Er kommt nur in Vielfachen des **Flussquants** $\\Phi_0 = \\frac{h}{2e}$ vor. Die 2 im Nenner verrät: Die Ladungsträger sind Paare."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: "Berechne das Flussquant Φ₀ = h : (2e) mit h = 6,63 · 10⁻³⁴ Js und e = 1,6 · 10⁻¹⁹ C. In 10⁻¹⁵ Wb, auf zwei Stellen."
    answer:
      value: 2.07
      tolerance: 0.03
    feedback:
      - when: abs(numval(state.input) - 4.14) < 0.03
        misconception: single-charge
        text: Die Ladung eines Cooper-Paares ist 2e. Teile durch 2e, nicht durch e.
    hints:
      - 2e = 3,2 · 10⁻¹⁹ C.
      - "6,63 · 10⁻³⁴ : 3,2 · 10⁻¹⁹ = ?"
    explanation: Φ₀ ≈ 2,07 · 10⁻¹⁵ Wb. SQUID-Sensoren zählen solche Flussquanten und messen so Hirnströme durch die Schädeldecke.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Viele Forscher suchen einen Supraleiter, der ohne Kühlung bei Zimmerwärme geht. Warum ist das so wichtig?
    params:
      options:
        - label: Verlustfreie Stromnetze und billige starke Magnete wären möglich – bisher braucht jeder bekannte Supraleiter starke Kühlung oder riesigen Druck.
          correct: true
        - label: Es gibt sie längst in jedem Handy.
          feedback: Handys enthalten keine Supraleiter. Bei Zimmertemperatur ist bisher keiner sicher bestätigt.
        - label: Damit Computer kälter werden.
          feedback: Es geht um verlustfreien Strom, nicht um Kühlung.
    hints:
      - Wie viel Strom geht heute in Leitungen verloren?
      - Kühlen kostet Energie und Aufwand.
    explanation: Im Netz gehen einige Prozent als Wärme verloren. Mehrere gemeldete »Raumtemperatur-Supraleiter« hielten der Überprüfung nicht stand. Die Suche geht weiter.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Magnet über einem Supraleiter schwebt.
    params:
      keywords:
        - - feld
          - field
          - magnetfeld
          - magnetic
        - - verdräng
          - expel
          - hinaus
          - out
          - innen
          - inside
        - - strom
          - current
          - gegen
          - oppos
          - abstoß
          - repel
      sample: Ein Supraleiter verdrängt jedes Magnetfeld aus seinem Inneren. An seiner Oberfläche fließen dafür verlustfreie Ströme, die ein Gegenfeld erzeugen. Dieses Gegenfeld stößt den Magneten ab – er schwebt.
    difficulty: 3

srs:
  cards_from: ["c3", "d3", "x2"]
