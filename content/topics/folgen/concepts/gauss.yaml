id: math.sequences.gauss
type: concept
title: Der Gauß-Trick
summary: Viele Zahlen blitzschnell addieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Was ergibt 1 + 2 + 3 + … + 100?"
    params:
      min: 100
      max: 20000
    answer:
      value: 5050
      tolerance: 700
    explanation: 5050. Der neunjährige Gauß soll das in Sekunden gelöst haben – gleich siehst du, wie.

  - kind: problem
    id: zehn
    widget: numeric
    prompt: Was ist 1 + 2 + 3 + … + 10?
    params: { placeholder: "Summe" }
    answer: { value: 55 }
    hints:
      - "Bilde Paare: 1 + 10, 2 + 9, …"
    explanation: 5 Paare zu je 11 ergeben 55.

  - kind: explain
    id: s2
    body: |
      Der junge Carl Friedrich Gauß sollte angeblich 1 bis 100 addieren. Er paarte 1 + 100, 2 + 99, … – 50 **Paare** zu je 101, also 5050. Allgemein: $1 + 2 + \dots + n = \frac{n(n+1)}{2}$.

  - kind: problem
    id: summe
    widget: numeric
    prompt: Was ist 1 + 2 + 3 + … + {{n}}?
    params: { placeholder: "Summe" }
    answer: { value: "{{n * (n + 1) / 2}}" }
    hints:
      - "Rechne {{n}} · {{n + 1}} : 2."
    explanation: "{{n}} · {{n + 1}} : 2 = {{n * (n + 1) / 2}}."
    variants:
      params: { n: "int[20,200]" }
      defaults: { n: 100 }

  - kind: problem
    id: dosen
    widget: numeric
    prompt: Eine Dosenpyramide hat unten {{n}} Dosen, in jeder Reihe darüber eine weniger, oben eine. Wie viele Dosen sind es?
    params: { unit: Dosen }
    answer: { value: "{{n * (n + 1) / 2}}" }
    hints:
      - "Das ist 1 + 2 + … + {{n}}."
    explanation: "{{n}} · {{n + 1}} : 2 = {{n * (n + 1) / 2}} Dosen."
    variants:
      params: { n: "int[5,15]" }
      defaults: { n: 8 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ist 2 + 4 + 6 + … + 100?
    answer:
      value: 2550
    hints:
      - "Klammere 2 aus: 2 · (1 + 2 + … + 50)."
    explanation: "2 · 50 · 51 : 2 = 2550."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Leg zwei **Treppen** aus Kästchen mit 1, 2, …, n Stufen aneinander, eine davon umgedreht. Zusammen bilden sie ein Rechteck n × (n + 1). Eine Treppe ist die Hälfte: $\\frac{n(n+1)}{2}$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Was ergibt {{a}} + {{a + 1}} + … + {{a + m}}?
    answer:
      value: "{{(2 * a + m) * (m + 1) / 2}}"
    feedback:
      - when: numval(state.input) == (2 * a + m) * m / 2
        misconception: fencepost
        text: Du hast eine Zahl zu wenig gezählt. Von {{a}} bis {{a + m}} sind es {{m + 1}} Zahlen.
    hints:
      - "Paare bilden: erste plus letzte Zahl ergibt {{2 * a + m}}."
      - "Es sind {{m + 1}} Zahlen, also ({{m + 1}}) : 2 Paare."
    explanation: "{{2 * a + m}} · {{m + 1}} : 2 = {{(2 * a + m) * (m + 1) / 2}}."
    difficulty: 2
    variants:
      params:
        a: int[11,40]
        m: int[20,60]
      defaults:
        a: 20
        m: 30

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: "Kugeln werden zu einer Pyramide mit quadratischen Schichten gestapelt: oben 1, dann 4, 9, … und unten {{n}} × {{n}}. Wie viele Kugeln sind es? Es gilt $1^2 + \\dots + n^2 = \\frac{n(n+1)(2n+1)}{6}$."
    answer:
      value: "{{n * (n + 1) * (2 * n + 1) / 6}}"
    feedback:
      - when: numval(state.input) == n * (n + 1) / 2
        misconception: triangular
        text: Das wären einzelne Reihen. Jede Schicht ist ein ganzes Quadrat.
    hints:
      - Setz n = {{n}} in die Formel ein.
      - "{{n}} · {{n + 1}} · {{2 * n + 1}} : 6."
    explanation: "{{n}} · {{n + 1}} · {{2 * n + 1}} : 6 = {{n * (n + 1) * (2 * n + 1) / 6}} Kugeln."
    difficulty: 2
    variants:
      params:
        n: int[3,12]
      defaults:
        n: 5

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Was ist 1 + 3 + 5 + … + 99, die Summe der ersten 50 ungeraden Zahlen?
    answer:
      value: 2500
    hints:
      - "Probier klein: 1 + 3 = 4, 1 + 3 + 5 = 9."
    explanation: Die Summe der ersten n ungeraden Zahlen ist n². Jede ungerade Zahl legt einen Winkel um das Quadrat.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Ein Wunder aus der Antike: $1^3 + 2^3 + \\dots + n^3 = (1 + 2 + \\dots + n)^2$. Die Summe der **Kubikzahlen** ist das Quadrat der Gauß-Summe. Beweisen lässt es sich mit vollständiger Induktion."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Was ergibt $1^3 + 2^3 + \dots + 10^3$?
    answer:
      value: 3025
    feedback:
      - when: numval(state.input) == 55
        misconception: no-square
        text: Das ist 1 + … + 10. Quadriere es noch.
    hints:
      - 1 + 2 + … + 10 = 55.
      - Nimm 55².
    explanation: "55² = 3025. Probe für n = 3: 1 + 8 + 27 = 36 = 6²."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: order
    prompt: Beweis durch vollständige Induktion für $1 + \dots + n = \frac{n(n+1)}{2}$. Ordne die Schritte.
    params:
      items:
        - label: "Anfang: Für n = 1 gilt 1 = 1 · 2 : 2."
        - label: "Annahme: Die Formel gilt für ein n."
        - label: "Schritt: Addiere n + 1 auf beiden Seiten."
        - label: "Umformen: n(n+1)/2 + (n+1) = (n+1)(n+2)/2."
        - label: "Schluss: Die Formel gilt für alle n."
    hints:
      - "Wie bei Dominosteinen: Erst muss der erste fallen."
      - Dann zeigt man, dass jeder Stein den nächsten umwirft.
    explanation: "Anfang und Schritt zusammen sind wie eine Dominoreihe: Der erste fällt, und jeder reißt den nächsten mit."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie der junge Gauß 1 bis 100 so schnell addiert hat.
    params:
      keywords:
        - - paar
          - paare
          - pair
          - pairs
        - - "101"
          - gleich
          - same
          - equal
        - - "50"
          - hälfte
          - half
          - mal
          - times
      sample: "Er bildete Paare von außen nach innen: 1 + 100, 2 + 99 und so weiter. Jedes Paar ergibt 101. Es gibt 50 Paare, also 50 · 101 = 5050."
    explanation: Gleich große Paare verwandeln eine lange Addition in eine einzige Multiplikation.
    difficulty: 3

srs:
  cards_from: [summe, dosen]
