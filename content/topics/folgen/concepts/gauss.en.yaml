id: math.sequences.gauss
type: concept
title: The Gauss trick
summary: Adding many numbers in a flash.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what is 1 + 2 + 3 + … + 100?"
    params:
      min: 100
      max: 20000
    answer:
      value: 5050
      tolerance: 700
    explanation: 5050. Nine-year-old Gauss is said to have solved it in seconds – you are about to see how.

  - kind: problem
    id: zehn
    widget: numeric
    prompt: What is 1 + 2 + 3 + … + 10?
    params: { placeholder: "Sum" }
    answer: { value: 55 }
    hints:
      - "Make pairs: 1 + 10, 2 + 9, …"
    explanation: 5 pairs of 11 each give 55.

  - kind: explain
    id: s2
    body: |
      The young Carl Friedrich Gauss was supposedly asked to add 1 to 100. He paired 1 + 100, 2 + 99, … That makes 50 **pairs** of 101, so 5050. In general: $1 + 2 + \dots + n = \frac{n(n+1)}{2}$.

  - kind: problem
    id: summe
    widget: numeric
    prompt: What is 1 + 2 + 3 + … + {{n}}?
    params: { placeholder: "Sum" }
    answer: { value: "{{n * (n + 1) / 2}}" }
    hints:
      - "Calculate {{n}} · {{n + 1}} ÷ 2."
    explanation: "{{n}} · {{n + 1}} ÷ 2 = {{n * (n + 1) / 2}}."
    variants:
      params: { n: "int[20,200]" }
      defaults: { n: 100 }

  - kind: problem
    id: dosen
    widget: numeric
    prompt: A pyramid of cans has {{n}} cans in the bottom row, one fewer in each row above, and one at the top. How many cans are there?
    params: { unit: cans }
    answer: { value: "{{n * (n + 1) / 2}}" }
    hints:
      - "That is 1 + 2 + … + {{n}}."
    explanation: "{{n}} · {{n + 1}} ÷ 2 = {{n * (n + 1) / 2}} cans."
    variants:
      params: { n: "int[5,15]" }
      defaults: { n: 8 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is 2 + 4 + 6 + … + 100?
    answer:
      value: 2550
    hints:
      - "Factor out 2: 2 · (1 + 2 + … + 50)."
    explanation: 2 · 50 · 51 ÷ 2 = 2550.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Put two **staircases** of boxes with 1, 2, …, n steps together, one turned upside down. Together they form an n × (n + 1) rectangle. One staircase is half of it: $\\frac{n(n+1)}{2}$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: What is {{a}} + {{a + 1}} + … + {{a + m}}?
    answer:
      value: "{{(2 * a + m) * (m + 1) / 2}}"
    feedback:
      - when: numval(state.input) == (2 * a + m) * m / 2
        misconception: fencepost
        text: You counted one number too few. From {{a}} to {{a + m}} there are {{m + 1}} numbers.
    hints:
      - "Make pairs: first plus last gives {{2 * a + m}}."
      - There are {{m + 1}} numbers, so ({{m + 1}}) / 2 pairs.
    explanation: "{{2 * a + m}} · {{m + 1}} / 2 = {{(2 * a + m) * (m + 1) / 2}}."
    difficulty: 2
    variants:
      params:
        a: int[11,40]
        m: int[20,60]
      defaults:
        a: 20
        m: 30

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: "Balls are stacked into a pyramid with square layers: 1 on top, then 4, 9, … and {{n}} × {{n}} at the bottom. How many balls are there? Use $1^2 + \\dots + n^2 = \\frac{n(n+1)(2n+1)}{6}$."
    answer:
      value: "{{n * (n + 1) * (2 * n + 1) / 6}}"
    feedback:
      - when: numval(state.input) == n * (n + 1) / 2
        misconception: triangular
        text: That would be single rows. Each layer is a full square.
    hints:
      - Put n = {{n}} into the formula.
      - "{{n}} · {{n + 1}} · {{2 * n + 1}} / 6."
    explanation: "{{n}} · {{n + 1}} · {{2 * n + 1}} / 6 = {{n * (n + 1) * (2 * n + 1) / 6}} balls."
    difficulty: 2
    variants:
      params:
        n: int[3,12]
      defaults:
        n: 5

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is 1 + 3 + 5 + … + 99, the sum of the first 50 odd numbers?
    answer:
      value: 2500
    hints:
      - "Try small: 1 + 3 = 4, 1 + 3 + 5 = 9."
    explanation: The sum of the first n odd numbers is n². Each odd number adds an L-shape around the square.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "A gem from antiquity: $1^3 + 2^3 + \\dots + n^3 = (1 + 2 + \\dots + n)^2$. The sum of the **cubes** is the square of the Gauss sum. It can be proved by induction."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: What is $1^3 + 2^3 + \dots + 10^3$?
    answer:
      value: 3025
    feedback:
      - when: numval(state.input) == 55
        misconception: no-square
        text: That is 1 + … + 10. Now square it.
    hints:
      - 1 + 2 + … + 10 = 55.
      - Take 55².
    explanation: "55² = 3025. Check for n = 3: 1 + 8 + 27 = 36 = 6²."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: order
    prompt: Proof by induction of $1 + \dots + n = \frac{n(n+1)}{2}$. Put the steps in order.
    params:
      items:
        - label: "Base case: for n = 1, 1 = 1 · 2 / 2."
        - label: "Assumption: the formula holds for some n."
        - label: "Step: add n + 1 to both sides."
        - label: "Rewrite: n(n+1)/2 + (n+1) = (n+1)(n+2)/2."
        - label: "Conclusion: the formula holds for all n."
    hints:
      - "Like dominoes: first the first one must fall."
      - Then you show each domino knocks over the next.
    explanation: "Base case and step together are like a row of dominoes: the first falls, and each knocks down the next."
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Tell Lux how young Gauss added 1 to 100 so quickly.
    params:
      keywords:
        - - paar
          - paare
          - pair
          - pairs
        - - "101"
          - gleich
          - same
          - equal
        - - "50"
          - hälfte
          - half
          - mal
          - times
      sample: "He paired numbers from the outside in: 1 + 100, 2 + 99 and so on. Each pair makes 101. There are 50 pairs, so 50 · 101 = 5050."
    explanation: Equal pairs turn a long addition into a single multiplication.
    difficulty: 3

srs:
  cards_from: [summe, dosen]
