id: math.sequences.arithmetic
type: concept
title: Immer gleich viel dazu
summary: Arithmetische Folgen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Immer der gleiche Schritt
    body: "Sparschwein, Taxiuhr, Treppenstufen: Oft kommt bei jedem Schritt gleich viel dazu. Die Gerade startet bei a und steigt pro Schritt um d. Schieb beide Regler. Was ändert sich, wenn d größer wird? So wächst eine **arithmetische Folge**."
    visual:
      widget: slider
      interactive: true
      params:
        expr: a + d*(x - 1)
        x:
          - 0
          - 6
        y:
          - 0
          - 10
        showCoordinates: false
        sliders:
          - id: a
            label: Start a
            min: 0
            max: 5
            step: 1
            initial: 1
          - id: d
            label: Schritt d
            min: 0
            max: 3
            step: 0.5
            initial: 1

  - kind: problem
    id: weiter
    widget: numeric
    prompt: "{{a}}, {{a + d}}, {{a + 2 * d}}, {{a + 3 * d}} – welche Zahl kommt als Nächstes?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{a + 4 * d}}" }
    hints:
      - Wie groß ist der Abstand zwischen zwei Nachbarn?
    explanation: "Immer + {{d}} – also {{a + 4 * d}}."
    variants:
      params: { a: "int[2,20]", d: "int[3,9]" }
      defaults: { a: 3, d: 4 }

  - kind: explain
    id: s2
    body: |
      Kommt immer dasselbe dazu, heißt die Folge **arithmetisch**. Das n-te Glied ist $a + (n-1) \cdot d$ – Startwert plus n − 1 Schritte.

  - kind: problem
    id: glied
    widget: numeric
    prompt: Eine Folge beginnt bei {{a}} und wächst immer um {{d}}. Wie lautet das {{n}}. Glied?
    params: { placeholder: "Zahl" }
    answer: { value: "{{a + (n - 1) * d}}" }
    feedback:
      - when: "numval(state.input) == a + n * d"
        misconception: off-by-one
        text: Vom 1. bis zum n-ten Glied sind es nur n − 1 Schritte.
    hints:
      - "Wie viele Schritte liegen zwischen dem 1. und dem {{n}}. Glied?"
    explanation: "{{a}} + {{n - 1}} · {{d}} = {{a + (n - 1) * d}}."
    variants:
      params: { a: "int[1,20]", d: "int[2,9]", n: "int[10,50]" }
      defaults: { a: 5, d: 3, n: 20 }

  - kind: problem
    id: taxi
    widget: choice
    prompt: Ein Taxi kostet 4 € Grundgebühr plus 2 € pro Kilometer. Welche Folge zeigt die Preise für 1, 2, 3 km?
    params:
      options:
        - { label: "6 €, 8 €, 10 €, …", correct: true }
        - { label: "4 €, 8 €, 16 €, …", feedback: "Das wäre Verdoppeln – hier kommt immer gleich viel dazu." }
        - { label: "2 €, 4 €, 6 €, …", feedback: "Die Grundgebühr fehlt." }
    hints:
      - Rechne den Preis für 1 km aus.
    explanation: 4 + 2 = 6, dann immer 2 € mehr.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 3, 7, 11, 15, …
          right: true
        - text: 1, 2, 4, 8, …
          right: false
          why: Hier wird verdoppelt, nicht addiert.
        - text: 20, 17, 14, 11, …
          right: true
        - text: 1, 4, 9, 16, …
          right: false
          why: "Die Abstände wachsen: 3, 5, 7."
      left: Nicht arithmetisch
      right: Arithmetisch

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Die Punkte zeigen die Folge 3, 5, 7, 9. Stelle Start a und Schritt d so ein, dass die Gerade durch alle Punkte geht.
    params:
      expr: a + d*(x - 1)
      x:
        - 0
        - 6
      y:
        - 0
        - 10
      showCoordinates: false
      sliders:
        - id: a
          label: a
          min: 0
          max: 5
          step: 1
          initial: 1
        - id: d
          label: d
          min: 0
          max: 3
          step: 0.5
          initial: 1
      markers:
        - x: 1
          y: 3
        - x: 2
          y: 5
        - x: 3
          y: 7
        - x: 4
          y: 9
    answer:
      values:
        a: 3
        d: 2
    hints:
      - a ist das erste Glied der Folge.
      - "d ist der Abstand zwischen zwei Nachbarn: 5 − 3."
    explanation: "Start a = 3, Schritt d = 2: Das n-te Glied ist $3 + (n - 1) \\cdot 2$."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Das 5. Glied einer arithmetischen Folge ist 17, das 9. ist 33. Wie lautet das erste Glied?
    answer:
      value: 1
    hints:
      - In 4 Schritten kommen 16 dazu. Wie groß ist ein Schritt?
    explanation: d = 4, also a = 17 − 4 · 4 = 1.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Zeichne die Glieder als Punkte (n | aₙ). Sie liegen auf einer **Geraden**: Jeder Schritt nach rechts geht d nach oben. Eine arithmetische Folge ist eine lineare Funktion, die man nur an ganzen Stellen abliest."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Die Folge beginnt bei {{a}} und wächst um {{d}}. Das wievielte Glied ist {{a + (k - 1) * d}}?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == k - 1
        misconception: off-by-one
        text: Das ist die Zahl der Schritte. Das erste Glied kommt noch dazu.
    hints:
      - Wie viele Schritte von {{d}} liegen zwischen {{a}} und {{a + (k - 1) * d}}?
      - Schritte plus 1 ergibt die Nummer.
    explanation: "({{a + (k - 1) * d}} − {{a}}) : {{d}} = {{k - 1}} Schritte, also das {{k}}. Glied."
    difficulty: 2
    variants:
      params:
        a: int[1,9]
        d: int[2,7]
        k: int[10,40]
      defaults:
        a: 4
        d: 3
        k: 33

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Addiere die ersten {{n}} Glieder der Folge {{a}}, {{a + d}}, {{a + 2 * d}}, …
    answer:
      value: "{{n * (2 * a + (n - 1) * d) / 2}}"
    feedback:
      - when: numval(state.input) == n * (2 * a + n * d) / 2
        misconception: off-by-one
        text: Das letzte Glied ist a + (n − 1) · d, nicht a + n · d.
    hints:
      - "Wie beim Gauß-Trick: erstes plus letztes Glied, mal halbe Anzahl."
      - Das letzte Glied ist {{a + (n - 1) * d}}.
    explanation: "({{a}} + {{a + (n - 1) * d}}) · {{n}} : 2 = {{n * (2 * a + (n - 1) * d) / 2}}."
    difficulty: 2
    variants:
      params:
        a: int[1,9]
        d: int[2,5]
        n: int[6,20]
      defaults:
        a: 3
        d: 4
        n: 10

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die Folge 1, 4, 9, 16, … hat die Abstände 3, 5, 7, … Welchen Abstand haben die **Abstände**?
    answer:
      value: 2
    hints:
      - 5 − 3 und 7 − 5.
    explanation: Konstante zweite Differenzen verraten eine **quadratische** Folge – eine Vorahnung der zweiten Ableitung.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Bilde von einer Folge die Abstände, dann die Abstände der Abstände. Ist die zweite **Differenzenfolge** konstant, ist die Folge quadratisch. Das ist die Ableitung im Kleinen – für ganze Schritte statt winziger.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Die Folge 2, 5, 10, 17, 26, … hat konstante zweite Differenzen. Wie lautet ihr 10. Glied?
    answer:
      value: 101
    feedback:
      - when: numval(state.input) == 82
        misconception: off-by-one
        text: Das ist das 9. Glied. Noch ein Schritt.
    hints:
      - Die Abstände sind 3, 5, 7, 9 – und die Folge sieht aus wie die Quadratzahlen plus etwas.
      - aₙ = n² + 1.
    explanation: "aₙ = n² + 1, also a₁₀ = 101. Konstante zweite Differenz 2 heißt: Leitkoeffizient 2 : 2 = 1."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum liegen die Punkte einer arithmetischen Folge auf einer Geraden?"
    params:
      keywords:
        - - gleich
          - immer
          - same
          - always
          - konstant
          - constant
        - - schritt
          - abstand
          - step
          - gap
        - - steigung
          - gerade
          - linear
          - slope
          - line
      sample: Von einem Glied zum nächsten kommt immer dasselbe d dazu. Ein Schritt nach rechts heißt also immer d nach oben. Gleiche Steigung überall ergibt eine Gerade.
    explanation: Konstanter Zuwachs pro Schritt ist konstante Steigung – genau das macht eine Gerade aus.
    difficulty: 3

srs:
  cards_from: [glied, taxi]
