id: math.sequences.arithmetic
type: concept
title: Immer gleich viel dazu
summary: Arithmetische Folgen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: weiter
    widget: numeric
    prompt: "{{a}}, {{a + d}}, {{a + 2 * d}}, {{a + 3 * d}} – welche Zahl kommt als Nächstes?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{a + 4 * d}}" }
    hints:
      - Wie groß ist der Abstand zwischen zwei Nachbarn?
    explanation: "Immer + {{d}} – also {{a + 4 * d}}."
    variants:
      params: { a: "int[2,20]", d: "int[3,9]" }
      defaults: { a: 3, d: 4 }

  - kind: explain
    id: s2
    body: |
      Kommt immer dasselbe dazu, heißt die Folge **arithmetisch**. Das n-te Glied ist $a + (n-1) \cdot d$ – Startwert plus n − 1 Schritte.

  - kind: problem
    id: glied
    widget: numeric
    prompt: Eine Folge beginnt bei {{a}} und wächst immer um {{d}}. Wie lautet das {{n}}. Glied?
    params: { placeholder: "Zahl" }
    answer: { value: "{{a + (n - 1) * d}}" }
    feedback:
      - when: "numval(state.input) == a + n * d"
        misconception: off-by-one
        text: Vom 1. bis zum n-ten Glied sind es nur n − 1 Schritte.
    hints:
      - "Wie viele Schritte liegen zwischen dem 1. und dem {{n}}. Glied?"
    explanation: "{{a}} + {{n - 1}} · {{d}} = {{a + (n - 1) * d}}."
    variants:
      params: { a: "int[1,20]", d: "int[2,9]", n: "int[10,50]" }
      defaults: { a: 5, d: 3, n: 20 }

  - kind: problem
    id: taxi
    widget: choice
    prompt: Ein Taxi kostet 4 € Grundgebühr plus 2 € pro Kilometer. Welche Folge zeigt die Preise für 1, 2, 3 km?
    params:
      options:
        - { label: "6 €, 8 €, 10 €, …", correct: true }
        - { label: "4 €, 8 €, 16 €, …", feedback: "Das wäre Verdoppeln – hier kommt immer gleich viel dazu." }
        - { label: "2 €, 4 €, 6 €, …", feedback: "Die Grundgebühr fehlt." }
    hints:
      - Rechne den Preis für 1 km aus.
    explanation: 4 + 2 = 6, dann immer 2 € mehr.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: 3, 7, 11, 15, …
          right: true
        - text: 1, 2, 4, 8, …
          right: false
          why: Hier wird verdoppelt, nicht addiert.
        - text: 20, 17, 14, 11, …
          right: true
        - text: 1, 4, 9, 16, …
          right: false
          why: "Die Abstände wachsen: 3, 5, 7."
      left: Nicht arithmetisch
      right: Arithmetisch

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Das 5. Glied einer arithmetischen Folge ist 17, das 9. ist 33. Wie lautet das erste Glied?
    answer:
      value: 1
    hints:
      - In 4 Schritten kommen 16 dazu. Wie groß ist ein Schritt?
    explanation: d = 4, also a = 17 − 4 · 4 = 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die Folge 1, 4, 9, 16, … hat die Abstände 3, 5, 7, … Welchen Abstand haben die **Abstände**?
    answer:
      value: 2
    hints:
      - 5 − 3 und 7 − 5.
    explanation: Konstante zweite Differenzen verraten eine **quadratische** Folge – eine Vorahnung der zweiten Ableitung.
    difficulty: 3

srs:
  cards_from: [glied, taxi]
