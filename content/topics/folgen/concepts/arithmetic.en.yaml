id: math.sequences.arithmetic
type: concept
title: Always the same amount added
summary: Arithmetic sequences.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Always the same step
    body: "Piggy bank, taxi meter, stairs: often each step adds the same amount. The line starts at a and climbs by d per step. Move both sliders. What changes when d gets bigger? This is an **arithmetic sequence**."
    visual:
      widget: slider
      interactive: true
      params:
        expr: a + d*(x - 1)
        x:
          - 0
          - 6
        y:
          - 0
          - 10
        showCoordinates: false
        sliders:
          - id: a
            label: start a
            min: 0
            max: 5
            step: 1
            initial: 1
          - id: d
            label: step d
            min: 0
            max: 3
            step: 0.5
            initial: 1

  - kind: problem
    id: weiter
    widget: numeric
    prompt: "{{a}}, {{a + d}}, {{a + 2 * d}}, {{a + 3 * d}}: which number comes next?"
    params: { placeholder: "Number" }
    answer: { value: "{{a + 4 * d}}" }
    hints:
      - How big is the gap between two neighbors?
    explanation: "Always + {{d}}, so {{a + 4 * d}}."
    variants:
      params: { a: "int[2,20]", d: "int[3,9]" }
      defaults: { a: 3, d: 4 }

  - kind: explain
    id: s2
    body: |
      If the same amount is always added, the sequence is **arithmetic**. The nth term is $a + (n-1) \cdot d$: the start value plus n − 1 steps.

  - kind: problem
    id: glied
    widget: numeric
    prompt: A sequence starts at {{a}} and always grows by {{d}}. What is term number {{n}}?
    params: { placeholder: "Number" }
    answer: { value: "{{a + (n - 1) * d}}" }
    feedback:
      - when: "numval(state.input) == a + n * d"
        misconception: off-by-one
        text: From the 1st to the nth term there are only n − 1 steps.
    hints:
      - "How many steps are there between term 1 and term {{n}}?"
    explanation: "{{a}} + {{n - 1}} · {{d}} = {{a + (n - 1) * d}}."
    variants:
      params: { a: "int[1,20]", d: "int[2,9]", n: "int[10,50]" }
      defaults: { a: 5, d: 3, n: 20 }

  - kind: problem
    id: taxi
    widget: choice
    prompt: A taxi costs a €4 base fare plus €2 per kilometer. Which sequence shows the prices for 1, 2, 3 km?
    params:
      options:
        - { label: "€6, €8, €10, …", correct: true }
        - { label: "€4, €8, €16, …", feedback: "That would be doubling. Here the same amount is added each time." }
        - { label: "€2, €4, €6, …", feedback: "The base fare is missing." }
    hints:
      - Work out the price for 1 km.
    explanation: 4 + 2 = 6, then always €2 more.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 3, 7, 11, 15, …
          right: true
        - text: 1, 2, 4, 8, …
          right: false
          why: This doubles rather than adds.
        - text: 20, 17, 14, 11, …
          right: true
        - text: 1, 4, 9, 16, …
          right: false
          why: "The gaps grow: 3, 5, 7."
      left: Not arithmetic
      right: Arithmetic

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: The dots show the sequence 3, 5, 7, 9. Set start a and step d so that the line passes through every dot.
    params:
      expr: a + d*(x - 1)
      x:
        - 0
        - 6
      y:
        - 0
        - 10
      showCoordinates: false
      sliders:
        - id: a
          label: a
          min: 0
          max: 5
          step: 1
          initial: 1
        - id: d
          label: d
          min: 0
          max: 3
          step: 0.5
          initial: 1
      markers:
        - x: 1
          y: 3
        - x: 2
          y: 5
        - x: 3
          y: 7
        - x: 4
          y: 9
    answer:
      values:
        a: 3
        d: 2
    hints:
      - a is the first term of the sequence.
      - "d is the gap between two neighbours: 5 − 3."
    explanation: "Start a = 3, step d = 2: the n-th term is $3 + (n - 1) \\cdot 2$."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The 5th term of an arithmetic sequence is 17, the 9th is 33. What is the first term?
    answer:
      value: 1
    hints:
      - 16 is added in 4 steps. How large is one step?
    explanation: d = 4, so a = 17 − 4 · 4 = 1.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Plot the terms as points (n | aₙ). They lie on a **straight line**: every step right goes d up. An arithmetic sequence is a linear function read off only at whole numbers."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: The sequence starts at {{a}} and grows by {{d}}. Which term number is {{a + (k - 1) * d}}?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == k - 1
        misconception: off-by-one
        text: That is the number of steps. Add the first term.
    hints:
      - How many steps of {{d}} lie between {{a}} and {{a + (k - 1) * d}}?
      - Steps plus 1 gives the number.
    explanation: ({{a + (k - 1) * d}} − {{a}}) / {{d}} = {{k - 1}} steps, so term number {{k}}.
    difficulty: 2
    variants:
      params:
        a: int[1,9]
        d: int[2,7]
        k: int[10,40]
      defaults:
        a: 4
        d: 3
        k: 33

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Add the first {{n}} terms of the sequence {{a}}, {{a + d}}, {{a + 2 * d}}, …
    answer:
      value: "{{n * (2 * a + (n - 1) * d) / 2}}"
    feedback:
      - when: numval(state.input) == n * (2 * a + n * d) / 2
        misconception: off-by-one
        text: The last term is a + (n − 1) · d, not a + n · d.
    hints:
      - "As in the Gauss trick: first plus last term, times half the count."
      - The last term is {{a + (n - 1) * d}}.
    explanation: ({{a}} + {{a + (n - 1) * d}}) · {{n}} / 2 = {{n * (2 * a + (n - 1) * d) / 2}}.
    difficulty: 2
    variants:
      params:
        a: int[1,9]
        d: int[2,5]
        n: int[6,20]
      defaults:
        a: 3
        d: 4
        n: 10

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The sequence 1, 4, 9, 16, … has gaps 3, 5, 7, … What is the gap between the **gaps**?
    answer:
      value: 2
    hints:
      - 5 − 3 and 7 − 5.
    explanation: Constant second differences reveal a **quadratic** sequence – a preview of the second derivative.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Take the gaps of a sequence, then the gaps of the gaps. If the second **difference sequence** is constant, the sequence is quadratic. This is the derivative in miniature – for whole steps instead of tiny ones.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: The sequence 2, 5, 10, 17, 26, … has constant second differences. What is its 10th term?
    answer:
      value: 101
    feedback:
      - when: numval(state.input) == 82
        misconception: off-by-one
        text: That is the 9th term. One more step.
    hints:
      - The gaps are 3, 5, 7, 9 – and the sequence looks like the squares plus something.
      - aₙ = n² + 1.
    explanation: aₙ = n² + 1, so a₁₀ = 101. A constant second difference of 2 means a leading coefficient of 2 / 2 = 1.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do the points of an arithmetic sequence lie on a straight line?"
    params:
      keywords:
        - - gleich
          - immer
          - same
          - always
          - konstant
          - constant
        - - schritt
          - abstand
          - step
          - gap
        - - steigung
          - gerade
          - linear
          - slope
          - line
      sample: From one term to the next the same d is always added. So one step right always means d up. The same slope everywhere gives a straight line.
    explanation: Constant growth per step is constant slope – exactly what makes a straight line.
    difficulty: 3

srs:
  cards_from: [glied, taxi]
