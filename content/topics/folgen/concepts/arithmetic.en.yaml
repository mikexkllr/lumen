id: math.sequences.arithmetic
type: concept
title: Always the same amount added
summary: Arithmetic sequences.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: weiter
    widget: numeric
    prompt: "{{a}}, {{a + d}}, {{a + 2 * d}}, {{a + 3 * d}}: which number comes next?"
    params: { placeholder: "Number" }
    answer: { value: "{{a + 4 * d}}" }
    hints:
      - How big is the gap between two neighbors?
    explanation: "Always + {{d}}, so {{a + 4 * d}}."
    variants:
      params: { a: "int[2,20]", d: "int[3,9]" }
      defaults: { a: 3, d: 4 }

  - kind: explain
    id: s2
    body: |
      If the same amount is always added, the sequence is **arithmetic**. The nth term is $a + (n-1) \cdot d$: the start value plus n − 1 steps.

  - kind: problem
    id: glied
    widget: numeric
    prompt: A sequence starts at {{a}} and always grows by {{d}}. What is term number {{n}}?
    params: { placeholder: "Number" }
    answer: { value: "{{a + (n - 1) * d}}" }
    feedback:
      - when: "numval(state.input) == a + n * d"
        misconception: off-by-one
        text: From the 1st to the nth term there are only n − 1 steps.
    hints:
      - "How many steps are there between term 1 and term {{n}}?"
    explanation: "{{a}} + {{n - 1}} · {{d}} = {{a + (n - 1) * d}}."
    variants:
      params: { a: "int[1,20]", d: "int[2,9]", n: "int[10,50]" }
      defaults: { a: 5, d: 3, n: 20 }

  - kind: problem
    id: taxi
    widget: choice
    prompt: A taxi costs a €4 base fare plus €2 per kilometer. Which sequence shows the prices for 1, 2, 3 km?
    params:
      options:
        - { label: "€6, €8, €10, …", correct: true }
        - { label: "€4, €8, €16, …", feedback: "That would be doubling. Here the same amount is added each time." }
        - { label: "€2, €4, €6, …", feedback: "The base fare is missing." }
    hints:
      - Work out the price for 1 km.
    explanation: 4 + 2 = 6, then always €2 more.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 3, 7, 11, 15, …
          right: true
        - text: 1, 2, 4, 8, …
          right: false
          why: This doubles rather than adds.
        - text: 20, 17, 14, 11, …
          right: true
        - text: 1, 4, 9, 16, …
          right: false
          why: "The gaps grow: 3, 5, 7."
      left: Not arithmetic
      right: Arithmetic

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The 5th term of an arithmetic sequence is 17, the 9th is 33. What is the first term?
    answer:
      value: 1
    hints:
      - 16 is added in 4 steps. How large is one step?
    explanation: d = 4, so a = 17 − 4 · 4 = 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The sequence 1, 4, 9, 16, … has gaps 3, 5, 7, … What is the gap between the **gaps**?
    answer:
      value: 2
    hints:
      - 5 − 3 and 7 − 5.
    explanation: Constant second differences reveal a **quadratic** sequence – a preview of the second derivative.
    difficulty: 3

srs:
  cards_from: [glied, taxi]
