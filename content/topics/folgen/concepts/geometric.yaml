id: math.sequences.geometric
type: concept
title: Immer mal dasselbe
summary: Geometrische Folgen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: weiter
    widget: numeric
    prompt: "{{a}}, {{a * q}}, {{a * q * q}}, … – welche Zahl kommt als Nächstes?"
    params: { placeholder: "Zahl" }
    answer: { value: "{{a * q * q * q}}" }
    feedback:
      - when: "numval(state.input) == a * q * q + (a * q * q - a * q)"
        misconception: additive
        text: Hier kommt nicht immer gleich viel dazu – es wird immer mit derselben Zahl multipliziert.
    hints:
      - Womit wird jedes Glied multipliziert?
    explanation: "Immer mal {{q}} – also {{a * q * q * q}}."
    variants:
      params: { a: "int[1,5]", q: "int[2,3]" }
      defaults: { a: 3, q: 2 }

  - kind: explain
    id: s2
    body: |
      Wird immer mit demselben Faktor q multipliziert, heißt die Folge **geometrisch**. Sie wächst anfangs harmlos – und dann explosiv.

  - kind: problem
    id: falten
    widget: numeric
    prompt: Ein Stapel Pappe ist 1 mm dick. Du legst ihn immer wieder doppelt. Wie dick ist er nach {{n}}-mal?
    params: { unit: mm }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear
        text: Jedes Falten verdoppelt die ganze Dicke – nicht nur 2 mm dazu.
    hints:
      - "1 → 2 → 4 → 8 …"
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ mm. Nach 42-mal wäre ein Blatt Papier dicker als der Weg zum Mond."
    variants:
      params: { n: "int[5,10]" }
      defaults: { n: 7 }

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Arithmetisch oder geometrisch?
    params:
      buckets: [{ label: arithmetisch }, { label: geometrisch }]
      items:
        - { label: "2, 5, 8, 11", bucket: arithmetisch }
        - { label: "100, 90, 80, 70", bucket: arithmetisch }
        - { label: "3, 6, 12, 24", bucket: geometrisch }
        - { label: "64, 32, 16, 8", bucket: geometrisch }
        - { label: "1, 10, 100, 1000", bucket: geometrisch }
    hints:
      - Plus oder mal?
    explanation: Gleiche Abstände – arithmetisch. Gleiche Faktoren – geometrisch, auch beim Halbieren.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Bei einer geometrischen Folge wird immer mit demselben [[Faktor]] malgenommen. Das n-te Glied ist $a \cdot q^{n-1}$. Für 3, 6, 12, … ist q = [[2]].
      distractors:
        - Summand
        - "3"

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Eine Folge wächst in jedem Schritt um 20 %. Nach wie vielen Schritten hat sich der Wert zum ersten Mal mehr als verdreifacht?
    params:
      scene: growth
    answer:
      rate: 20
      factor:
        - 3
        - 3.6
    explanation: "Nach 7 Schritten: 1,2⁷ ≈ 3,58."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine geometrische Folge beginnt 2, 6, 18, … Wie lautet das 7. Glied?
    answer:
      value: 1458
    hints:
      - 2 · 3⁶.
    explanation: 3⁶ = 729, mal 2 sind 1458.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Summe $S = 1 + q + q^2 + \\dots + q^{n-1}$. Mal q verschiebt alles um eins: $qS = q + \\dots + q^n$. Zieh ab, fast alles fällt weg: $qS - S = q^n - 1$. Das ist der **Verschiebungstrick**."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Berechne 3 + 6 + 12 + … mit {{n}} Gliedern – jedes doppelt so groß wie das davor.
    answer:
      value: "{{3 * (2 ** n - 1)}}"
    feedback:
      - when: numval(state.input) == 3 * 2 ** n
        misconception: off-by-one
        text: "Fast: Die Summe ist eins weniger als die nächste Zweierpotenz – mal 3."
    hints:
      - "Hol die 3 heraus: 3 · (1 + 2 + 4 + …)."
      - 1 + 2 + … + 2^(n−1) = 2ⁿ − 1.
    explanation: 3 · (2^{{n}} − 1) = {{3 * (2 ** n - 1)}}.
    difficulty: 2
    variants:
      params:
        n: int[4,12]
      defaults:
        n: 6

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Eine geometrische Folge hat das erste Glied {{a}} und das vierte Glied {{a * q ** 3}}. Wie groß ist der Faktor q?
    answer:
      value: "{{q}}"
    feedback:
      - when: numval(state.input) == q ** 3
        misconception: cube-not-root
        text: Das ist q³ – vom ersten zum vierten Glied sind es drei Schritte.
    hints:
      - Vom 1. zum 4. Glied wird dreimal mit q multipliziert.
      - "q³ = {{a * q ** 3}} : {{a}} = {{q ** 3}}. Zieh die dritte Wurzel."
    explanation: q³ = {{q ** 3}}, also q = {{q}}.
    difficulty: 2
    variants:
      params:
        a: int[1,5]
        q: int[2,5]
      defaults:
        a: 5
        q: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Summe einer geometrischen Reihe: $1 + 2 + 4 + \\dots + 2^{10}$ = ?"
    answer:
      value: 2047
    hints:
      - Die Summe ist immer um 1 kleiner als das nächste Glied.
    explanation: "$2^{11} - 1 = 2047$. Allgemein: $\\frac{q^{n+1} - 1}{q - 1}$."
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Ein Ball fällt aus 2 m Höhe. Nach jedem Aufprall springt er auf ¾ der vorigen Höhe. Welchen Gesamtweg in Metern legt er zurück – rauf und runter, unendlich oft?
    params:
      unit: m
    answer:
      value: 14
    feedback:
      - when: numval(state.input) == 8
        misconception: down-only
        text: Das ist nur der Weg nach unten. Nach jedem Aufprall geht es auch wieder hoch.
    hints:
      - "Runter: 2 + 1,5 + 1,125 + … = 2 : (1 − ¾) = 8."
      - "Rauf: dasselbe ohne die ersten 2 m, also 6."
    explanation: 8 m runter plus 6 m rauf = 14 m. Unendlich viele Sprünge, aber ein endlicher Weg – und wegen der kürzer werdenden Flugzeiten auch eine endliche Zeit.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: Ist 1, −2, 4, −8, 16, … eine geometrische Folge?
    params:
      options:
        - label: Ja, mit q = −2
          correct: true
        - label: Nein, die Vorzeichen springen.
          feedback: Ein negativer Faktor lässt die Vorzeichen springen – erlaubt ist er trotzdem.
        - label: Ja, mit q = 2
          feedback: Dann blieben alle Glieder positiv.
    hints:
      - Teile jedes Glied durch das vorige.
      - "−2 : 1, 4 : (−2), …"
    explanation: Der Quotient ist immer −2. Für |q| > 1 wächst der Betrag, für |q| < 1 schrumpft er – das Vorzeichen spielt dafür keine Rolle.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux den Verschiebungstrick für 1 + 2 + 4 + … + 2⁹.
    params:
      keywords:
        - - mal
          - doppel
          - verdopp
          - times
          - double
          - multipl
        - - ziehe
          - abziehen
          - minus
          - subtract
          - differenz
          - difference
        - - wegfallen
          - heben
          - cancel
          - bleibt
          - left
      sample: "Ich nenne die Summe S und verdopple sie: 2S = 2 + 4 + … + 2¹⁰. Ziehe ich S ab, heben sich alle mittleren Glieder weg. Es bleibt S = 2¹⁰ − 1 = 1023."
    explanation: Mal q und abziehen lässt alle Glieder außer dem ersten und letzten verschwinden.
    difficulty: 3

srs:
  cards_from: [falten, sortieren]
