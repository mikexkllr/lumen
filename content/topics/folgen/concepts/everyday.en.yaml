id: math.sequences.everyday
type: concept
title: Sequences in everyday life
summary: Savings plans, subscriptions and grains of rice.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Plus or times?
    body: Simple interest adds the same each year, compound interest multiplies each year. Slide the growth rate and the years. How far does **exponential** growth run away from linear growth?
    visual:
      widget: sim
      interactive: true
      params:
        scene: growth

  - kind: problem
    id: sparplan
    widget: numeric
    prompt: You save €{{a}} in the first month and €{{d}} more each month. How much do you save in month 12?
    params: { unit: "€" }
    answer: { value: "{{a + 11 * d}}" }
    feedback:
      - when: "numval(state.input) == a + 12 * d"
        misconception: off-by-one
        text: By month 12 there are only 11 increases.
    hints:
      - Between month 1 and month 12 there are 11 steps.
    explanation: "{{a}} + 11 · {{d}} = €{{a + 11 * d}}."
    variants:
      params: { a: "choice[20,50,100]", d: "choice[5,10,20]" }
      defaults: { a: 50, d: 10 }

  - kind: problem
    id: schach
    widget: choice
    prompt: The first chessboard square gets 1 grain of rice, and each next square twice as many. How many are on square 64?
    params:
      options:
        - { label: "2⁶³, over 9 quintillion", correct: true }
        - { label: "128", feedback: "That would be 64 · 2. Here you double 63 times." }
        - { label: "2⁶⁴", feedback: "Square 1 has 2⁰ = 1 grain, so square 64 has 2⁶³." }
    hints:
      - "Square 1: 2⁰, square 2: 2¹, square 3: 2² …"
    explanation: More rice than humanity has ever harvested. That is geometric growth.

  - kind: problem
    id: nutzer
    widget: numeric
    prompt: An app has 1000 users and grows 10% every month. How many users does it have after two months?
    params: { unit: users }
    answer: { value: 1210 }
    feedback:
      - when: "numval(state.input) == 1200"
        misconception: simple-interest
        text: In the second month the new users grow too. Take 10% of 1100.
    hints:
      - First 1000 · 1.1, then · 1.1 again.
    explanation: 1000 → 1100 → 1210. Each month multiplies by 1.1.

  - kind: problem
    id: welche
    widget: buckets
    prompt: Plus or times? Which kind of sequence is behind it?
    params:
      buckets: [{ label: arithmetic }, { label: geometric }]
      items:
        - { label: Salary rises €500 every year, bucket: arithmetic }
        - { label: Cost of a subscription over the months, bucket: arithmetic }
        - { label: Compound interest, bucket: geometric }
        - { label: Bacteria divide every hour, bucket: geometric }
    hints:
      - Is a fixed amount added, or a fixed share?
    explanation: Fixed amount means arithmetic. Fixed percentage means geometric.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "The Fibonacci sequence: 1, 1, 2, 3, 5, 8, … Each number is the sum of the two before. What is the 10th term?"
    answer:
      value: 55
    hints:
      - "Continue: 13, 21, 34, …"
    explanation: 13, 21, 34, 55. The sequence hides in sunflowers and pine cones.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: The ratio of neighbouring Fibonacci numbers approaches a number φ. Since $F_{n+1} = F_n + F_{n-1}$, in the limit $\varphi = 1 + \frac{1}{\varphi}$, so $\varphi^2 = \varphi + 1$. This is the **golden ratio**.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Solve $\varphi^2 = \varphi + 1$. Give the positive solution to three decimals.
    answer:
      value: 1.618
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) + 0.618) < 0.002
        misconception: wrong-root
        text: That is the negative solution. The positive one is wanted.
    hints:
      - "Move everything to one side: φ² − φ − 1 = 0."
      - "Quadratic formula: φ = ½ ± √(¼ + 1)."
    explanation: φ = (1 + √5) / 2 ≈ 1.618.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: At the end of each year you pay 1000 € into an account with 5 % interest. How many euros are in it right after the third payment?
    params:
      unit: €
    answer:
      value: 3152.5
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 3000
        misconception: no-interest
        text: The interest is missing. The first payment grows for two years.
      - when: abs(numval(state.input) - 3310.13) < 0.02
        misconception: one-period-too-many
        text: Then the last payment would already have earned a year of interest.
    hints:
      - The first payment grows for 2 years, the second for 1, the third not at all.
      - 1000 · (1.05² + 1.05 + 1).
    explanation: "1102.50 + 1050 + 1000 = 3152.50 €. A savings plan is a geometric series: 1000 · (1.05³ − 1) / 0.05."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Divide neighbouring Fibonacci numbers: 55 ÷ 34, 89 ÷ 55, … What value does this approach? To two places."
    answer:
      value: 1.62
      tolerance: 0.01
    hints:
      - Compute 89 ÷ 55.
    explanation: The golden ratio φ ≈ 1.618. It solves x² = x + 1 – exactly the rule of the sequence.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "**Binet's formula** gives each Fibonacci number at once: $F_n = \\frac{\\varphi^n - \\psi^n}{\\sqrt5}$ with $\\psi = \\frac{1 - \\sqrt5}{2} \\approx -0.618$. Since ψ is small, $\\psi^n$ soon dies out."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: We have $\varphi^{12} \approx 321.997$. Divide by √5 ≈ 2.236 and round. Which Fibonacci number do you get?
    answer:
      value: 144
    hints:
      - 321.997 / 2.236 ≈ 144.0.
      - "Check: … 55, 89, 144 – the 12th term."
    explanation: F₁₂ = 144. The error term ψ¹² / √5 is only about 0.001. So Fₙ is just φⁿ / √5, rounded.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Compute 8 · 21 − 13². Three neighbouring Fibonacci numbers.
    answer:
      value: -1
    hints:
      - 8 · 21 = 168.
      - 13² = 169.
    explanation: 168 − 169 = −1. **Cassini's identity** says $F_{n-1}F_{n+1} - F_n^2 = (-1)^n$. It is behind the puzzle where 64 squares seem to become 65.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does the ratio of two Fibonacci numbers approach the golden ratio?"
    params:
      keywords:
        - - summe
          - plus
          - addier
          - sum
          - add
        - - quotient
          - verhältnis
          - ratio
          - teilen
          - divide
        - - phi
          - golden
          - gleichung
          - equation
      sample: "Each number is the sum of the two before. Dividing by the middle one gives: new ratio = 1 + 1 over old ratio. When the ratio settles, it must satisfy φ = 1 + 1/φ. That is the golden ratio 1.618."
    explanation: In the limit the recursion turns into the equation φ² = φ + 1. Its positive solution is the golden ratio.
    difficulty: 3

srs:
  cards_from: [sparplan, nutzer]
