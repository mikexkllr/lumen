id: math.sequences.infinite
type: concept
title: Infinitely many steps
summary: When an infinite sum stays finite.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Half the bar
    body: You eat half a chocolate bar, then half of what is left, and so on. Shade 8 pieces, then 4, 2 and 1. Does the bar ever run out? Infinitely many steps – and still the **sum** stays finite.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 16
        shape: square

  - kind: problem
    id: schritte
    widget: numberline
    prompt: You walk 1 m, then ½ m, then ¼ m. Mark where you are now.
    params: { min: 0, max: 2, ticks: 4, labels: decimals }
    answer: { value: 1.75 }
    hints:
      - 1 + 0.5 + 0.25.
    explanation: 1.75 m. Each further step halves the remaining distance to 2.

  - kind: explain
    id: s2
    body: |
      With every step, the **distance** to 2 is halved. Infinitely many steps still add up to exactly 2: $1 + \frac12 + \frac14 + \dots = 2$. This solves the old riddle of Achilles and the tortoise.

  - kind: problem
    id: grenzwert
    widget: choice
    prompt: Where does 1 + ½ + ¼ + ⅛ + … head?
    params:
      options:
        - { label: Exactly to 2, correct: true }
        - { label: To infinity, feedback: "The steps shrink so fast that the sum never exceeds 2." }
        - { label: "To 1.99", feedback: "You get as close as you like to any number below 2, but the limit is exactly 2." }
    hints:
      - How big is the remaining distance to 2 after each step?
    explanation: The remainder keeps halving and vanishes. The sum is 2.

  - kind: problem
    id: neunen
    widget: choice
    prompt: Does 0.999… equal 1?
    params:
      options:
        - { label: "Yes, exactly equal", correct: true }
        - { label: "No, slightly smaller", feedback: "Which number would lie in between? There is none." }
    hints:
      - "One third is 0.333… What is three times one third?"
    explanation: 3 · 0.333… = 0.999… and 3 · ⅓ = 1. Both are the same number.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 1/2 + 1/4 + 1/8 + … is exactly 1.
          right: true
        - text: Infinitely many positive numbers always add up to infinity.
          right: false
          why: If they shrink fast enough, the sum stays finite.
        - text: 0.999… is exactly 1.
          right: true

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Shade $\frac12 + \frac14 + \frac18$ of the bar.
    params:
      parts: 8
      shape: bar
    answer:
      fraction: 7/8
    hints:
      - With 8 pieces, ½ is 4 pieces, ¼ is 2 and ⅛ is 1.
      - Shade 4 + 2 + 1 pieces.
    explanation: $\frac12 + \frac14 + \frac18 = \frac78$. The last eighth is missing from the whole – and each further step halves that gap.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is $1 + \frac13 + \frac19 + \frac1{27} + \dots$?
    answer:
      value: 3/2
    hints:
      - The formula is $\frac{1}{1 - q}$ with q = 1/3.
    explanation: 1 ÷ (2/3) = 3/2. This holds for every q between −1 and 1.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: The finite sum is $a \frac{1 - q^n}{1 - q}$. For |q| < 1, $q^n$ shrinks towards zero. So the **limit** of the infinite series is $\frac{a}{1 - q}$.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Write 0.{{d}}{{d}}{{d}}… with infinitely many {{d}}s as a fraction.
    answer:
      value: "{{d}}/9"
    feedback:
      - when: numval(state.input) == d / 10
        misconception: first-term-only
        text: That is only the first digit. Infinitely many more follow.
    hints:
      - 0.{{d}}{{d}}… = {{d}}/10 + {{d}}/100 + … – a geometric series with q = 1/10.
      - a / (1 − q) = ({{d}}/10) / (9/10).
    explanation: ({{d}}/10) / (9/10) = {{d}}/9. With d = 9 you get 9/9 = 1 – that is why 0.999… = 1.
    difficulty: 2
    variants:
      params:
        d: int[1,8]
      defaults:
        d: 4

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Write 0.121212… as a fraction in lowest terms.
    answer:
      value: 4/33
      form: simplified
    hints:
      - The repeating block is 12, so q = 1/100.
      - 12/100 / (99/100) = 12/99. Now reduce.
    explanation: 12/99 = 4/33. Every repeating decimal is a fraction – and every fraction has a repeating decimal.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The harmonic series $1 + \frac12 + \frac13 + \frac14 + \dots$ – what happens?
    params:
      options:
        - label: It grows beyond every bound – just extremely slowly
          correct: true
        - label: It approaches 2
          feedback: The first four terms already exceed 2.
        - label: It approaches a large but finite number
          feedback: You can keep forming groups that each add at least 1/2.
    hints:
      - 1/3 + 1/4 is more than 1/2. And 1/5 + … + 1/8?
    explanation: Infinitely many groups of at least 1/2 each. So terms going to zero is not enough.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: how can a sum of infinitely many numbers be finite?"
    params:
      keywords:
        - - klein
          - halb
          - schrumpf
          - smaller
          - half
          - shrink
        - - grenze
          - grenzwert
          - nähert
          - limit
          - approach
          - bound
        - - nie
          - überschreit
          - never
          - exceed
          - beyond
          - darüber
      sample: The numbers keep getting smaller, for example half as large each time. The sum then approaches a limit that it never exceeds.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Why does $1 + \\frac12 + \\frac13 + \\dots$ grow past every bound? Group the terms: $\\frac13 + \\frac14 > \\frac12$, $\\frac15 + \\dots + \\frac18 > \\frac12$ and so on. Infinitely many halves are **infinite**. Oresme showed this around 1350."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: estimate
    prompt: "Take a guess: how many terms of the harmonic series does it take for the sum to exceed 10?"
    params:
      min: 10
      max: 1000000
      scale: log
    answer:
      value: 12367
      within: 40
    explanation: Exactly 12,367. The sum grows like ln n + 0.577. For a sum of 100 you would need about 10⁴³ terms.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: The term 1/n tends to 0, and still the series diverges. What follows?
    params:
      options:
        - label: Terms tending to 0 are not enough – they must shrink fast enough.
          correct: true
        - label: "No: ½ + ¼ + ⅛ + … converges."
          feedback: "Nein: ½ + ¼ + ⅛ + … konvergiert."
        - label: The groups of halves show it exceeds every number.
          feedback: "Die Gruppen aus Hälften zeigen: Sie übersteigt jede Zahl."
    hints:
      - Compare 1/n with 1/2ⁿ.
      - Both tend to 0 – but only one sum stays finite.
    explanation: "Terms tending to 0 are necessary but not sufficient. 1/n shrinks too slowly; 1/n² is fast enough: that series converges to π²/6."
    difficulty: 3

srs:
  cards_from: [grenzwert, neunen]
