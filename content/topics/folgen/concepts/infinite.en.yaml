id: math.sequences.infinite
type: concept
title: Infinitely many steps
summary: When an infinite sum stays finite.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: schritte
    widget: numberline
    prompt: You walk 1 m, then ½ m, then ¼ m. Mark where you are now.
    params: { min: 0, max: 2, ticks: 4, labels: decimals }
    answer: { value: 1.75 }
    hints:
      - 1 + 0.5 + 0.25.
    explanation: 1.75 m. Each further step halves the remaining distance to 2.

  - kind: explain
    body: |
      With every step, the distance to 2 is halved. Infinitely many steps still add up to exactly 2: $1 + \frac12 + \frac14 + \dots = 2$. This solves the old riddle of Achilles and the tortoise.

  - kind: problem
    id: grenzwert
    widget: choice
    prompt: Where does 1 + ½ + ¼ + ⅛ + … head?
    params:
      options:
        - { label: Exactly to 2, correct: true }
        - { label: To infinity, feedback: "The steps shrink so fast that the sum never exceeds 2." }
        - { label: "To 1.99", feedback: "You get as close as you like to any number below 2, but the limit is exactly 2." }
    hints:
      - How big is the remaining distance to 2 after each step?
    explanation: The remainder keeps halving and vanishes. The sum is 2.

  - kind: problem
    id: neunen
    widget: choice
    prompt: Does 0.999… equal 1?
    params:
      options:
        - { label: "Yes, exactly equal", correct: true }
        - { label: "No, slightly smaller", feedback: "Which number would lie in between? There is none." }
    hints:
      - "One third is 0.333… What is three times one third?"
    explanation: 3 · 0.333… = 0.999… and 3 · ⅓ = 1. Both are the same number.

srs:
  cards_from: [grenzwert, neunen]
