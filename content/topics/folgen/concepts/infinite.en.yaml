id: math.sequences.infinite
type: concept
title: Infinitely many steps
summary: When an infinite sum stays finite.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: schritte
    widget: numberline
    prompt: You walk 1 m, then ½ m, then ¼ m. Mark where you are now.
    params: { min: 0, max: 2, ticks: 4, labels: decimals }
    answer: { value: 1.75 }
    hints:
      - 1 + 0.5 + 0.25.
    explanation: 1.75 m. Each further step halves the remaining distance to 2.

  - kind: explain
    id: s2
    body: |
      With every step, the distance to 2 is halved. Infinitely many steps still add up to exactly 2: $1 + \frac12 + \frac14 + \dots = 2$. This solves the old riddle of Achilles and the tortoise.

  - kind: problem
    id: grenzwert
    widget: choice
    prompt: Where does 1 + ½ + ¼ + ⅛ + … head?
    params:
      options:
        - { label: Exactly to 2, correct: true }
        - { label: To infinity, feedback: "The steps shrink so fast that the sum never exceeds 2." }
        - { label: "To 1.99", feedback: "You get as close as you like to any number below 2, but the limit is exactly 2." }
    hints:
      - How big is the remaining distance to 2 after each step?
    explanation: The remainder keeps halving and vanishes. The sum is 2.

  - kind: problem
    id: neunen
    widget: choice
    prompt: Does 0.999… equal 1?
    params:
      options:
        - { label: "Yes, exactly equal", correct: true }
        - { label: "No, slightly smaller", feedback: "Which number would lie in between? There is none." }
    hints:
      - "One third is 0.333… What is three times one third?"
    explanation: 3 · 0.333… = 0.999… and 3 · ⅓ = 1. Both are the same number.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: 1/2 + 1/4 + 1/8 + … is exactly 1.
          right: true
        - text: Infinitely many positive numbers always add up to infinity.
          right: false
          why: If they shrink fast enough, the sum stays finite.
        - text: 0.999… is exactly 1.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is $1 + \frac13 + \frac19 + \frac1{27} + \dots$?
    answer:
      value: 3/2
    hints:
      - The formula is $\frac{1}{1 - q}$ with q = 1/3.
    explanation: 1 ÷ (2/3) = 3/2. This holds for every q between −1 and 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The harmonic series $1 + \frac12 + \frac13 + \frac14 + \dots$ – what happens?
    params:
      options:
        - label: It grows beyond every bound – just extremely slowly
          correct: true
        - label: It approaches 2
          feedback: The first four terms already exceed 2.
        - label: It approaches a large but finite number
          feedback: You can keep forming groups that each add at least 1/2.
    hints:
      - 1/3 + 1/4 is more than 1/2. And 1/5 + … + 1/8?
    explanation: Infinitely many groups of at least 1/2 each. So terms going to zero is not enough.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: how can a sum of infinitely many numbers be finite?"
    params:
      keywords:
        - - klein
          - halb
          - schrumpf
          - smaller
          - half
          - shrink
        - - grenze
          - grenzwert
          - nähert
          - limit
          - approach
          - bound
        - - nie
          - überschreit
          - never
          - exceed
          - beyond
          - darüber
      sample: The numbers keep getting smaller, for example half as large each time. The sum then approaches a limit that it never exceeds.
    difficulty: 3

srs:
  cards_from: [grenzwert, neunen]
