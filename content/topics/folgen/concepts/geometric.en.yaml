id: math.sequences.geometric
type: concept
title: Always times the same number
summary: Geometric sequences.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Times, times, times
    body: Interest, viruses and chain letters don't grow by the same amount, but by the same **factor**. The curve shows $q^x$. Slide q to 2 and then to 0.5. What happens above 1, what below?
    visual:
      widget: slider
      interactive: true
      params:
        expr: q^x
        x:
          - 0
          - 6
        y:
          - 0
          - 8
        showCoordinates: false
        sliders:
          - id: q
            label: factor q
            min: 0.5
            max: 2
            step: 0.1
            initial: 1.2

  - kind: problem
    id: weiter
    widget: numeric
    prompt: "{{a}}, {{a * q}}, {{a * q * q}}, …: which number comes next?"
    params: { placeholder: "Number" }
    answer: { value: "{{a * q * q * q}}" }
    feedback:
      - when: "numval(state.input) == a * q * q + (a * q * q - a * q)"
        misconception: additive
        text: The same amount is not added each time. Each term is multiplied by the same number.
    hints:
      - What is each term multiplied by?
    explanation: "Always times {{q}}, so {{a * q * q * q}}."
    variants:
      params: { a: "int[1,5]", q: "int[2,3]" }
      defaults: { a: 3, q: 2 }

  - kind: explain
    id: s2
    body: |
      If you always multiply by the same factor q, the sequence is **geometric**. It grows harmlessly at first, then explosively.

  - kind: problem
    id: falten
    widget: numeric
    prompt: A stack of cardboard is 1 mm thick. You fold it in half again and again. How thick is it after {{n}} folds?
    params: { unit: mm }
    answer: { value: "{{2 ** n}}" }
    feedback:
      - when: "numval(state.input) == 2 * n"
        misconception: linear
        text: Each fold doubles the whole thickness. It does not just add 2 mm.
    hints:
      - "1 → 2 → 4 → 8 …"
    explanation: "$2^{ {{n}} } = {{2 ** n}}$ mm. After 42 folds, a sheet of paper would be thicker than the distance to the Moon."
    variants:
      params: { n: "int[5,10]" }
      defaults: { n: 7 }

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Arithmetic or geometric?
    params:
      buckets: [{ label: arithmetic }, { label: geometric }]
      items:
        - { label: "2, 5, 8, 11", bucket: arithmetic }
        - { label: "100, 90, 80, 70", bucket: arithmetic }
        - { label: "3, 6, 12, 24", bucket: geometric }
        - { label: "64, 32, 16, 8", bucket: geometric }
        - { label: "1, 10, 100, 1000", bucket: geometric }
    hints:
      - Plus or times?
    explanation: Equal differences mean arithmetic. Equal factors mean geometric, even when halving.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In a geometric sequence you always multiply by the same [[factor]]. The n-th term is $a \cdot q^{n-1}$. For 3, 6, 12, … q = [[2]].
      distractors:
        - addend
        - "3"

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: A sequence grows by 20% in each step. After how many steps has the value more than tripled for the first time?
    params:
      scene: growth
    answer:
      rate: 20
      factor:
        - 3
        - 3.6
    explanation: "After 7 steps: 1.2⁷ ≈ 3.58."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A geometric sequence begins 2, 6, 18, … What is the 7th term?
    answer:
      value: 1458
    hints:
      - 2 · 3⁶.
    explanation: 3⁶ = 729, times 2 is 1458.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Sum $S = 1 + q + q^2 + \\dots + q^{n-1}$. Times q shifts everything by one: $qS = q + \\dots + q^n$. Subtract and almost everything cancels: $qS - S = q^n - 1$. This is the **shift trick**."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Compute 3 + 6 + 12 + … with {{n}} terms – each twice the one before.
    answer:
      value: "{{3 * (2 ** n - 1)}}"
    feedback:
      - when: numval(state.input) == 3 * 2 ** n
        misconception: off-by-one
        text: "Almost: the sum is one less than the next power of two – times 3."
    hints:
      - "Factor out 3: 3 · (1 + 2 + 4 + …)."
      - 1 + 2 + … + 2^(n−1) = 2ⁿ − 1.
    explanation: 3 · (2^{{n}} − 1) = {{3 * (2 ** n - 1)}}.
    difficulty: 2
    variants:
      params:
        n: int[4,12]
      defaults:
        n: 6

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A geometric sequence has first term {{a}} and fourth term {{a * q ** 3}}. What is the factor q?
    answer:
      value: "{{q}}"
    feedback:
      - when: numval(state.input) == q ** 3
        misconception: cube-not-root
        text: That is q³ – from the first to the fourth term are three steps.
    hints:
      - From the 1st to the 4th term you multiply by q three times.
      - q³ = {{a * q ** 3}} / {{a}} = {{q ** 3}}. Take the cube root.
    explanation: q³ = {{q ** 3}}, so q = {{q}}.
    difficulty: 2
    variants:
      params:
        a: int[1,5]
        q: int[2,5]
      defaults:
        a: 5
        q: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Sum of a geometric series: $1 + 2 + 4 + \\dots + 2^{10}$ = ?"
    answer:
      value: 2047
    hints:
      - The sum is always 1 less than the next term.
    explanation: "$2^{11} - 1 = 2047$. In general: $\\frac{q^{n+1} - 1}{q - 1}$."
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: A ball drops from 2 m. After each bounce it rises to ¾ of the previous height. What total distance in metres does it travel – up and down, forever?
    params:
      unit: m
    answer:
      value: 14
    feedback:
      - when: numval(state.input) == 8
        misconception: down-only
        text: That is only the way down. After every bounce it also goes up again.
    hints:
      - "Down: 2 + 1.5 + 1.125 + … = 2 / (1 − ¾) = 8."
      - "Up: the same without the first 2 m, so 6."
    explanation: 8 m down plus 6 m up = 14 m. Infinitely many bounces but a finite distance – and, as flights get shorter, a finite time too.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: choice
    prompt: Is 1, −2, 4, −8, 16, … a geometric sequence?
    params:
      options:
        - label: Yes, with q = −2
          correct: true
        - label: A negative factor flips the signs – it is still allowed.
          feedback: Ein negativer Faktor lässt die Vorzeichen springen – erlaubt ist er trotzdem.
        - label: Then all terms would stay positive.
          feedback: Dann blieben alle Glieder positiv.
    hints:
      - Divide each term by the one before.
      - −2 / 1, 4 / (−2), …
    explanation: The ratio is always −2. For |q| > 1 the size grows, for |q| < 1 it shrinks – the sign plays no role.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux the shift trick for 1 + 2 + 4 + … + 2⁹.
    params:
      keywords:
        - - mal
          - doppel
          - verdopp
          - times
          - double
          - multipl
        - - ziehe
          - abziehen
          - minus
          - subtract
          - differenz
          - difference
        - - wegfallen
          - heben
          - cancel
          - bleibt
          - left
      sample: "I call the sum S and double it: 2S = 2 + 4 + … + 2¹⁰. Subtracting S cancels all the middle terms. What is left is S = 2¹⁰ − 1 = 1023."
    explanation: Multiplying by q and subtracting makes every term except the first and last vanish.
    difficulty: 3

srs:
  cards_from: [falten, sortieren]
