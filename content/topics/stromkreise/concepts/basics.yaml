id: sci.circuits.basics
type: concept
title: Der geschlossene Kreis
summary: Reihe ist UND, parallel ist ODER.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: kreis
    widget: choice
    prompt: Wann leuchtet eine Lampe an einer Batterie?
    params:
      options:
        - { label: Wenn ein geschlossener Weg vom Plus- zum Minuspol führt, correct: true }
        - { label: Sobald ein Kabel am Pluspol hängt, feedback: "Der Strom braucht auch einen Weg zurück." }
        - { label: Wenn die Batterie voll ist, feedback: "Voll reicht nicht. Der Kreis muss geschlossen sein." }
    hints:
      - Strom braucht einen Rundweg.
    explanation: Strom fließt nur im geschlossenen Kreis.

  - kind: explain
    body: |
      Strom fließt nur im **geschlossenen Kreis**. Ein Schalter öffnet oder schließt ihn.
      In **Reihe** fließt der Strom durch alles nacheinander. **Parallel** teilt er sich auf.

  - kind: problem
    id: reihe
    widget: gates
    prompt: Zwei Schalter liegen in Reihe vor der Lampe. Das wirkt wie ein UND. Bring die Lampe zum Leuchten.
    params:
      inputs: [{ id: S1, label: Schalter 1 }, { id: S2, label: Schalter 2 }]
      gates: [{ id: r, type: AND, in: [S1, S2] }]
      outputs: [{ id: L, from: r, label: Lampe }]
      goal: { L: 1 }
    hints:
      - In Reihe muss der Strom durch beide Schalter.
    explanation: Beide Schalter müssen geschlossen sein.

  - kind: problem
    id: parallel
    widget: choice
    prompt: Zwei Schalter liegen parallel. Wann leuchtet die Lampe?
    params:
      options:
        - { label: Sobald mindestens einer geschlossen ist, correct: true }
        - { label: Nur wenn beide geschlossen sind, feedback: "Das wäre eine Reihenschaltung." }
        - { label: Nie, feedback: "Parallel bietet sogar zwei Wege für den Strom." }
    hints:
      - Wie viele Wege hat der Strom?
    explanation: Parallel gibt es zwei Wege – einer reicht. Das wirkt wie ODER.

  - kind: problem
    id: lichterkette
    widget: choice
    prompt: In einer Lichterkette sind alle Lämpchen in Reihe. Eins geht kaputt. Was passiert?
    params:
      options:
        - { label: Alle gehen aus., correct: true }
        - { label: Nur das kaputte geht aus., feedback: "Das wäre parallel so. In Reihe ist der Kreis jetzt unterbrochen." }
        - { label: Die anderen leuchten heller., feedback: "Der Kreis ist offen – es fließt gar kein Strom mehr." }
    hints:
      - Ein kaputtes Lämpchen ist wie ein offener Schalter.
    explanation: In Reihe unterbricht eine Lücke den ganzen Kreis.

  - kind: explain
    body: Warum sind die Steckdosen im Haus parallel geschaltet?
    reveal:
      body: Damit jedes Gerät die volle Spannung bekommt und sich unabhängig ein- und ausschalten lässt.

srs:
  cards_from: [parallel, lichterkette]
