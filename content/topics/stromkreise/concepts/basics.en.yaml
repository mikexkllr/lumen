id: sci.circuits.basics
type: concept
title: The Closed Loop
summary: Series is AND, parallel is OR.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: kreis
    widget: choice
    prompt: When does a lamp light up on a battery?
    params:
      options:
        - { label: When a closed path leads from the plus to the minus terminal, correct: true }
        - { label: As soon as one wire is attached to the plus terminal, feedback: "The current also needs a path back." }
        - { label: When the battery is full, feedback: "Full isn't enough. The loop must be closed." }
    hints:
      - Current needs a loop to travel around.
    explanation: Current flows only in a closed loop.

  - kind: explain
    id: s2
    body: |
      Current flows only in a **closed loop**. A switch opens or closes it.
      In **series**, the current passes through everything in turn. In **parallel**, it splits up.

  - kind: problem
    id: reihe
    widget: gates
    prompt: Two switches are in series before the lamp. That acts like an AND. Make the lamp light up.
    params:
      inputs: [{ id: S1, label: Switch 1 }, { id: S2, label: Switch 2 }]
      gates: [{ id: r, type: AND, in: [S1, S2] }]
      outputs: [{ id: L, from: r, label: Lamp }]
      goal: { L: 1 }
    hints:
      - In series, the current must pass through both switches.
    explanation: Both switches must be closed.

  - kind: problem
    id: parallel
    widget: choice
    prompt: Two switches are in parallel. When does the lamp light up?
    params:
      options:
        - { label: As soon as at least one is closed, correct: true }
        - { label: Only when both are closed, feedback: "That would be a series circuit." }
        - { label: Never, feedback: "Parallel even offers two paths for the current." }
    hints:
      - How many paths does the current have?
    explanation: In parallel there are two paths, and one is enough. That acts like an OR.

  - kind: problem
    id: lichterkette
    widget: choice
    prompt: In a string of lights, all bulbs are in series. One breaks. What happens?
    params:
      options:
        - { label: All go out., correct: true }
        - { label: Only the broken one goes out., feedback: "That would be the case in parallel. In series, the loop is now broken." }
        - { label: The others shine brighter., feedback: "The loop is open, so no current flows at all." }
    hints:
      - A broken bulb is like an open switch.
    explanation: In series, one gap breaks the whole loop.

  - kind: explain
    id: s6
    body: Why are the outlets in a house wired in parallel?
    reveal:
      body: So every device gets the full voltage and can be switched on and off independently.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Without a closed loop no current flows.
          right: true
        - text: In a parallel circuit everything goes out when one lamp burns out.
          right: false
          why: The other branches keep shining.
        - text: The current is used up in the lamp.
          right: false
          why: As much current flows in as out – what is converted is energy.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Three identical lamps hang in parallel on a battery. 0.2 A flows through each. How much current does the battery deliver?
    params:
      unit: A
    answer:
      value: 0.6
    hints:
      - At a junction as much flows in as out.
    explanation: 3 · 0.2 = 0.6 A. This is Kirchhoff’s **junction rule**.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Current flows through a lamp. Is there less current after the lamp than before it, because the lamp »uses it up«?
    params:
      options:
        - label: No – the same current flows before and after. The lamp takes energy, not charge.
          correct: true
        - label: Yes, part of the current turns into light.
          feedback: Then charge would pile up in the circuit. Only energy turns into light.
        - label: No current flows after the lamp.
          feedback: Then the circuit would not be closed and the lamp would be off.
    hints:
      - Where else would the electrons disappear to?
      - "Think of a bicycle chain: it transfers energy but does not get shorter."
    explanation: Charge goes round like a chain. It carries energy from the battery to the lamp. That is why an ammeter shows the same before and after the lamp.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: "Current is flowing **charge** per time: I = Q ÷ t. 1 ampere means 1 coulomb per second. That is about 6.2 quintillion electrons every second."

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: A battery has 3000 mAh. A device draws a steady 0.5 A. How many hours does the battery last?
    params:
      unit: h
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 6000
        misconception: milli
        text: "Watch the unit: 3000 mAh is 3 Ah."
      - when: numval(state.input) == 1.5
        misconception: multiply-instead
        text: Charge = current · time. So time = charge **divided** by current.
    hints:
      - "mAh is a charge: milliampere times hour. 3000 mAh = 3 Ah."
      - 3 Ah ÷ 0.5 A = ?
    explanation: 3 Ah ÷ 0.5 A = 6 h. At double the current it lasts only half as long.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Electrons crawl through a cable at only fractions of a millimetre per second. Why does the light still come on instantly?
    params:
      options:
        - label: The cable is already full of electrons – the push travels at almost the speed of light
          correct: true
        - label: The electrons are really very fast
          feedback: Their drift is as slow as a snail.
        - label: The light does not come on instantly
          feedback: The delay is shorter than a millionth of a second.
    hints:
      - Think of a full garden hose.
    explanation: "As in a full hose: turn it on and water comes out at once – although the new water only enters at the back."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: estimate
    prompt: "Take a guess: how many millimetres per second do the electrons creep in a 1 mm² copper wire carrying 1 A?"
    params:
      min: 0.00001
      max: 1000
      scale: log
    answer:
      value: 0.074
      within: 50
    explanation: v = I ÷ (n · e · A) with 8.5 · 10²⁸ free electrons per m³. That gives about 0.07 mm/s – slower than a snail. The signal still travels at nearly the speed of light.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A phone battery has 4000 mAh. How much charge in coulombs is that? (1 Ah = 3600 C)
    params:
      unit: C
    answer:
      value: 14400
    hints:
      - 4000 mAh = 4 Ah.
      - 4 · 3600 = ?
    explanation: 4 Ah · 3600 = 14,400 C. That is about 9 · 10²² electrons moving through the battery per charge.
    difficulty: 3

srs:
  cards_from: [parallel, lichterkette]
