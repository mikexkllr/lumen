id: sci.circuits.basics
type: concept
title: The Closed Loop
summary: Series is AND, parallel is OR.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: kreis
    widget: choice
    prompt: When does a lamp light up on a battery?
    params:
      options:
        - { label: When a closed path leads from the plus to the minus terminal, correct: true }
        - { label: As soon as one wire is attached to the plus terminal, feedback: "The current also needs a path back." }
        - { label: When the battery is full, feedback: "Full isn't enough. The loop must be closed." }
    hints:
      - Current needs a loop to travel around.
    explanation: Current flows only in a closed loop.

  - kind: explain
    body: |
      Current flows only in a **closed loop**. A switch opens or closes it.
      In **series**, the current passes through everything in turn. In **parallel**, it splits up.

  - kind: problem
    id: reihe
    widget: gates
    prompt: Two switches are in series before the lamp. That acts like an AND. Make the lamp light up.
    params:
      inputs: [{ id: S1, label: Switch 1 }, { id: S2, label: Switch 2 }]
      gates: [{ id: r, type: AND, in: [S1, S2] }]
      outputs: [{ id: L, from: r, label: Lamp }]
      goal: { L: 1 }
    hints:
      - In series, the current must pass through both switches.
    explanation: Both switches must be closed.

  - kind: problem
    id: parallel
    widget: choice
    prompt: Two switches are in parallel. When does the lamp light up?
    params:
      options:
        - { label: As soon as at least one is closed, correct: true }
        - { label: Only when both are closed, feedback: "That would be a series circuit." }
        - { label: Never, feedback: "Parallel even offers two paths for the current." }
    hints:
      - How many paths does the current have?
    explanation: In parallel there are two paths, and one is enough. That acts like an OR.

  - kind: problem
    id: lichterkette
    widget: choice
    prompt: In a string of lights, all bulbs are in series. One breaks. What happens?
    params:
      options:
        - { label: All go out., correct: true }
        - { label: Only the broken one goes out., feedback: "That would be the case in parallel. In series, the loop is now broken." }
        - { label: The others shine brighter., feedback: "The loop is open, so no current flows at all." }
    hints:
      - A broken bulb is like an open switch.
    explanation: In series, one gap breaks the whole loop.

  - kind: explain
    body: Why are the outlets in a house wired in parallel?
    reveal:
      body: So every device gets the full voltage and can be switched on and off independently.

srs:
  cards_from: [parallel, lichterkette]
