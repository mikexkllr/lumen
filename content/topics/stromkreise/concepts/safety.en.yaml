id: sci.circuits.safety
type: concept
title: Electricity and Safety
summary: What is really dangerous.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Why must a hairdryer never fall into the bathtub?
    params:
      options:
        - label: The water conducts the current through the body
          correct: true
        - label: The hairdryer breaks
          feedback: That is the smallest problem.
        - label: The water gets too hot
          feedback: The danger is the current.
    hints:
      - Water and electricity do not mix.
    explanation: What is dangerous is the current flowing through the body.

  - kind: explain
    id: s1
    body: |
      What is dangerous is **current through the body**. Even about 50 mA can be life-threatening. Wet skin lowers the resistance, so more current flows.

  - kind: problem
    id: koerper
    widget: numeric
    prompt: At 230 V, a body has {{r}} Ω of resistance. How much current flows?
    params: { unit: mA }
    answer: { value: "{{230000 / r}}" }
    hints:
      - "Current = voltage ÷ resistance. Then multiply by 1000 for mA."
    explanation: "230 ÷ {{r}} = {{230 / r}} A, so {{230000 / r}} mA. That is far above the danger limit."
    variants:
      params: { r: "choice[1000,2000,2300,4600]" }
      defaults: { r: 2300 }

  - kind: problem
    id: fi
    widget: choice
    prompt: What is the RCD switch in the fuse box for?
    params:
      options:
        - { label: "It cuts power when current takes a wrong path.", correct: true }
        - { label: It saves electricity., feedback: "It protects people, not your wallet." }
        - { label: It only protects against overload., feedback: "That is what the normal fuse does." }
    hints:
      - What happens when current flows through a person to the ground?
    explanation: If part of the current is missing on the way back, the RCD disconnects within milliseconds.

  - kind: problem
    id: gefahr
    widget: buckets
    prompt: Dangerous or not?
    params:
      buckets: [{ label: dangerous }, { label: harmless }]
      items:
        - { label: Hair dryer on the edge of the bathtub, bucket: dangerous }
        - { label: Kite near a power line, bucket: dangerous }
        - { label: Bird on a high-voltage line, bucket: harmless }
        - { label: Phone charging on the table, bucket: harmless }
    hints:
      - Can current flow through a body to the ground?
    explanation: The bird touches only one wire, so there is no path for current through it.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Dry skin has about 100,000 Ω, wet skin only 1000 Ω. How many mA flow through wet skin at 230 V?
    params:
      unit: mA
    answer:
      value: 230
    hints:
      - 230 V ÷ 1000 Ω, then in mA.
    explanation: 0.23 A = 230 mA – far above the lethal limit of 50 mA.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Small resistance, large current: 4 A should flow at 12 V. Which resistance do you need?"
    params:
      scene: circuit
    answer:
      voltage: 12
      current: 4
    explanation: 3 Ω. If the resistance drops to a quarter, the current quadruples. That is why wet skin is so dangerous.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A bird sits on a high-voltage line and stays unharmed. Why?
    params:
      options:
        - label: There is almost no voltage between its feet – no current flows through it
          correct: true
        - label: Bird feet insulate perfectly
          feedback: If it touches the pylon as well, it dies.
        - label: The line is insulated
          feedback: Overhead lines are bare.
    hints:
      - Current flows only with a voltage **difference**.
    explanation: Voltage alone is never the danger; the difference between two touched points is.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain Ohm’s law to Lux with an everyday picture.
    params:
      keywords:
        - - spannung
          - voltage
          - druck
          - pressure
        - - strom
          - current
          - fließ
          - flow
        - - widerstand
          - resistance
          - eng
          - narrow
          - brems
      sample: "Voltage is like water pressure, current like the amount of water flowing. Resistance is a narrow pipe: the narrower, the less flows at the same pressure."
    difficulty: 3

srs:
  cards_from: [fi, gefahr]
