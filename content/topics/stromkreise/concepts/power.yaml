id: sci.circuits.power
type: concept
title: Leistung und Sicherung
summary: P = U · I und die 16-Ampere-Grenze.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wer braucht wie viel?
    body: "Ob Lampe oder Schnellzug: Jedes Gerät zieht seine eigene **Leistung** aus dem Netz. Deck die Karten auf und vergleiche, wer wie viel braucht."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚄
            front: ICE-Zug
            back: Er zieht rund 8000 Kilowatt – so viel wie 4000 Wasserkocher.
          - icon: 💡
            front: LED-Lampe
            back: Sie kommt mit etwa 10 Watt aus – ein Zweihundertstel eines Wasserkochers.
          - icon: 🧍
            front: Dein Körper
            back: In Ruhe gibt er etwa 100 Watt Wärme ab – wie eine alte Glühbirne.
          - icon: 🏠
            front: Ein ganzer Haushalt
            back: Im Mittel zieht er nur rund 300 Watt – ständig, Tag und Nacht.

  - kind: problem
    id: kocher
    widget: numeric
    prompt: Ein Wasserkocher zieht an 230 V einen Strom von 8 A. Welche Leistung hat er?
    params: { unit: W }
    answer: { value: 1840 }
    hints:
      - Leistung = Spannung · Strom.
    explanation: 230 V · 8 A = 1840 W.

  - kind: explain
    id: s2
    body: |
      **Leistung = Spannung · Strom**, also P = U · I.
      Eine **Sicherung** unterbricht den Kreis, wenn zu viel Strom fließt – im Haus meist bei 16 A.

  - kind: problem
    id: grenze
    widget: numeric
    prompt: Wie viel Leistung verträgt ein Stromkreis mit 16-A-Sicherung bei 230 V?
    params: { unit: W }
    answer: { value: 3680 }
    hints:
      - 230 · 16.
    explanation: 230 V · 16 A = 3680 W.

  - kind: problem
    id: leiste
    widget: choice
    prompt: Wasserkocher und Heizlüfter mit je 2000 W hängen am selben 16-A-Kreis. Was passiert?
    params:
      options:
        - { label: Die Sicherung löst aus., correct: true }
        - { label: Alles läuft normal., feedback: "4000 W sind mehr als die 3680 W des Kreises." }
        - { label: Beide laufen mit halber Kraft., feedback: "Geräte drosseln sich nicht von selbst." }
    hints:
      - Vergleiche die Summe mit 3680 W.
    explanation: 4000 W brauchen über 17 A. Die Sicherung schützt die Leitung vor Überhitzung.

  - kind: problem
    id: strom-geraet
    widget: numeric
    prompt: Ein Gerät mit {{p}} W hängt an 230 V. Welcher Strom fließt?
    params: { unit: A }
    answer: { value: "{{p / 230}}" }
    hints:
      - "I = P : U."
    explanation: "{{p}} W : 230 V = {{p / 230}} A."
    variants:
      params: { p: "choice[460,690,1150,2300]" }
      defaults: { p: 1150 }

  - kind: explain
    id: s6
    body: Warum hat ein Ladegerät fürs Handy nur 5 bis 20 V?
    reveal:
      body: Kleine Spannungen sind ungefährlich. Das Ladegerät wandelt die 230 V aus der Steckdose um – dabei wird es etwas warm.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Die Lampe soll an 12 V genau 24 W leisten. Stell die Schaltung ein.
    params:
      scene: circuit
    answer:
      voltage: 12
      power: 24
    explanation: Bei 6 Ω fließen 2 A. Leistung = 12 V · 2 A = 24 W.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Ladegerät liefert 20 V und 3 A. Wie lange braucht es rechnerisch, um einen 60-Wh-Akku zu füllen? In Stunden.
    params:
      unit: h
    answer:
      value: 1
    hints:
      - P = U · I = 60 W.
    explanation: "60 Wh : 60 W = 1 h."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Durch ein Kabel mit 0,5 Ω fließen 10 A. Wie viele Watt werden im Kabel zu Wärme?
    params:
      unit: W
    answer:
      value: 50
    feedback:
      - when: numval(state.input) == 5
        misconception: forgot-current
        text: P = U · I, und am Kabel liegt U = R · I = 5 V. Also P = 5 V · 10 A.
      - when: numval(state.input) == 2300
        misconception: wrong-voltage
        text: Die 230 V liegen am Gerät, nicht am Kabel. Am Kabel fallen nur 5 V ab.
    hints:
      - Mit U = R · I wird aus P = U · I die Formel P = I² · R.
      - 10² · 0,5 = ?
    explanation: P = I² · R = 100 · 0,5 = 50 W. Doppelter Strom heißt vierfache Wärme. Darum werden überlastete Kabel gefährlich heiß.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: "Zwei Lampen für 230 V: eine mit 60 W, eine mit 100 W. Welche hat den größeren Widerstand?"
    params:
      options:
        - label: Die 60-W-Lampe
          correct: true
        - label: Die 100-W-Lampe
          feedback: Bei fester Spannung braucht mehr Leistung mehr Strom – also einen **kleineren** Widerstand.
        - label: Beide gleich
          feedback: Dann würden beide gleich hell leuchten.
    hints:
      - "Bei fester Spannung gilt P = U² : R."
      - Kleineres P heißt …?
    explanation: "R = U² : P. 60 W ergibt 882 Ω, 100 W nur 529 Ω. Schaltet man beide in Reihe, leuchtet übrigens die 60-W-Lampe heller."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum überträgt man Strom über Land mit 400 000 Volt statt mit 230 Volt?
    params:
      options:
        - label: Bei hoher Spannung fließt für dieselbe Leistung viel weniger Strom – die Verluste sinken drastisch
          correct: true
        - label: Weil Strom bei hoher Spannung schneller fließt
          feedback: Das Tempo ist gleich. Es geht um die Wärmeverluste in der Leitung.
        - label: Weil Kraftwerke nur Hochspannung erzeugen können
          feedback: Sie erzeugen etwa 20 000 V – ein Trafo spannt hoch.
    hints:
      - Der Verlust in der Leitung ist I² · R.
    explanation: Zehnfache Spannung, ein Zehntel Strom, ein **Hundertstel** Verlust.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Kraftwerk schickt 1 MW über eine Leitung mit 10 Ω. Wievielmal kleiner ist der Verlust in der Leitung bei 100 kV als bei 10 kV?
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 10
        misconception: linear-loss
        text: Zehnfache Spannung heißt ein Zehntel Strom. Der Verlust wächst aber mit I².
    hints:
      - "Strom: I = P : U. Bei 10 kV sind es 100 A, bei 100 kV 10 A."
      - Verlust = I² · R.
    explanation: "Bei 10 kV: 100² · 10 = 100 kW Verlust. Bei 100 kV: 10² · 10 = 1 kW. Hundertmal weniger – darum Hochspannung."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Viele E-Autos laden mit 400 oder 800 V statt mit 12 V. Warum?
    params:
      options:
        - label: Für dieselbe Leistung braucht es viel weniger Strom – dünnere Kabel, weniger Wärme.
          correct: true
        - label: Höhere Spannung speichert mehr Energie im Akku.
          feedback: Die Energie hängt von der Zellchemie und -zahl ab. Die Spannung senkt vor allem den Strom.
        - label: Weil 12 V verboten sind.
          feedback: Verboten ist nichts. Bei 12 V bräuchte man nur gewaltige Ströme.
    hints:
      - Schnellladen mit 200 kW – welcher Strom bei 12 V?
      - P = U · I und Verluste ∝ I².
    explanation: 200 kW bei 12 V wären fast 17 000 A, bei 800 V nur 250 A. Weniger Strom heißt weniger Wärme in Kabeln und Steckern.
    difficulty: 3

srs:
  cards_from: [grenze, strom-geraet]
