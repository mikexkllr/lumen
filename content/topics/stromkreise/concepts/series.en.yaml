id: sci.circuits.series
type: concept
title: Series or Parallel?
summary: Two ways to connect devices.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Sharing the voltage
    body: If two resistors hang one after the other, they share the voltage. Turn R₁ and R₂ and see what arrives at the output. That is how a **series circuit** hides in many devices.
    visual:
      widget: sim
      interactive: true
      params:
        scene: divider

  - kind: problem
    id: kette
    widget: choice
    prompt: In a string of lights, one bulb breaks and all go out. How are they wired?
    params:
      options:
        - { label: "In series, one after another", correct: true }
        - { label: "In parallel, side by side", feedback: "Then the others would keep shining." }
    hints:
      - Must the current pass through every bulb?
    explanation: In series, the current flows through all of them. One gap breaks the whole loop.

  - kind: problem
    id: schalter
    widget: gates
    prompt: Two switches in parallel. The lamp is on if either one is on. Which gate fits?
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: g, type: "?", in: [A, B], options: [AND, OR, XOR] }
      outputs: [{ id: Q, from: g, label: Lamp }]
    check: { predicate: "table('Q') == [0, 1, 1, 1]" }
    hints:
      - It is on even when both are on.
    explanation: Parallel is OR, and series is AND.

  - kind: explain
    id: s3
    body: |
      In **series**, resistances add up. In **parallel**, every device gets the full voltage. That is how the outlets in a house are wired.

  - kind: problem
    id: reihe
    widget: numeric
    prompt: Two resistors of {{a}} Ω and {{b}} Ω are in series. What is the total resistance?
    params: { unit: Ω }
    answer: { value: "{{a + b}}" }
    hints:
      - Just add them.
    explanation: "{{a}} + {{b}} = {{a + b}} Ω."
    variants:
      params: { a: "choice[10,47,100,220]", b: "choice[22,33,68,150]" }
      defaults: { a: 100, b: 68 }

  - kind: problem
    id: parallel
    widget: numeric
    prompt: Two identical resistors of {{r}} Ω each are in parallel. What is the total resistance?
    params: { unit: Ω }
    answer: { value: "{{r / 2}}" }
    feedback:
      - when: "numval(state.input) == 2 * r"
        misconception: parallel-add
        text: In parallel there are two paths. The resistance gets smaller, not larger.
    hints:
      - Two equal paths, so the current flows twice as easily.
    explanation: "Half as large, {{r / 2}} Ω."
    variants:
      params: { r: "choice[10,20,50,100,220]" }
      defaults: { r: 100 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Sockets in a house
          right: true
        - text: Batteries in a torch
          right: false
        - text: A fuse and the device behind it
          right: false
        - text: A car’s headlights
          right: true
      left: Series
      right: Parallel

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: Two resistors in series are connected to 12 V. Exactly 4 V should be across the lower resistor R₂. Set R₁ and R₂ to match.
    params:
      scene: divider
      controls:
        voltage:
          fixed: true
    answer:
      out: 4
    hints:
      - In series, the resistors share the voltage in proportion to their size.
      - 4 V out of 12 V is one third. So R₁ must be twice as large as R₂.
    explanation: "For example R₁ = 10 kΩ and R₂ = 5 kΩ: 8 V drop across the larger resistor, 4 V across the smaller one."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 6 Ω and 3 Ω are in parallel. What is the total resistance?
    params:
      unit: Ω
    answer:
      value: 2
    hints:
      - 1/R = 1/6 + 1/3.
    explanation: 1/R = 1/2, so 2 Ω – smaller than the smallest single resistor.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Two lamps of 6 Ω each are in series: 12 Ω together. Set the resistance and find the voltage at which exactly 1 A flows."
    params:
      scene: circuit
      controls:
        resistance:
          value: 6
        voltage:
          value: 6
    answer:
      resistance: 12
      current: 1
    explanation: 12 V. In series the resistances add up – the same current needs more voltage.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "Two rules are enough for any circuit. First: at every **junction** as much flows in as flows out. Second: around every closed loop all voltages add up to zero."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: 3 A and 2 A flow into a junction. 1.5 A flow out through one wire. How much current flows out through the last wire?
    params:
      unit: A
    answer:
      value: 3.5
    feedback:
      - when: numval(state.input) == 6.5
        misconception: sign-junction
        text: The 1.5 A flow **out**, not in.
    hints:
      - "In: 3 A + 2 A = 5 A."
      - The same amount has to flow out.
    explanation: 5 A − 1.5 A = 3.5 A. Charge is neither lost nor piles up – that is the junction rule.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: Three resistors of 2 Ω, 3 Ω and 6 Ω are in parallel. What is the total resistance?
    params:
      unit: Ω
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 11
        misconception: series-parallel
        text: That would be series. In parallel you add the reciprocals.
    hints:
      - 1/R = 1/2 + 1/3 + 1/6.
      - Put everything over six.
    explanation: 3/6 + 2/6 + 1/6 = 1, so R = 1 Ω. In parallel the total is always smaller than the smallest single resistor.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "A voltage divider: 12 V across 2 Ω and 4 Ω in series. What voltage drops across the 4 Ω resistor?"
    params:
      unit: V
    answer:
      value: 8
    hints:
      - The current is 12 V ÷ 6 Ω = 2 A.
    explanation: 2 A · 4 Ω = 8 V. The voltage divides in the ratio of the resistances.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: One bulb shines alone on 12 V. Now two identical bulbs hang in series on the same 12 V. To what fraction does the power of each bulb fall? Treat R as fixed.
    answer:
      value: 1/4
    feedback:
      - when: abs(numval(state.input) - 0.5) < 0.01
        misconception: linear-power
        text: Each bulb gets half the voltage. But power depends on U².
    hints:
      - Each bulb now has only 6 V across it.
      - P = U² ÷ R. Half the voltage means …?
    explanation: "P = U²/R: half the voltage means a quarter of the power per bulb. Together both give only half as much light as one alone."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Why is the total resistance of a parallel circuit always smaller than the smallest single resistor?
    params:
      options:
        - label: Every extra branch opens another path for the current.
          correct: true
        - label: Because the voltage is shared.
          feedback: In parallel every branch gets the full voltage.
        - label: Because resistors weaken one another.
          feedback: Each resistor stays as it is. Only paths are added.
    hints:
      - Think of checkouts in a supermarket.
      - One more checkout – faster or slower?
    explanation: More parallel paths let more current flow at the same voltage. More current at the same voltage means a smaller total resistance.
    difficulty: 3

srs:
  cards_from: [kette, parallel]
