id: sci.circuits.ohm
type: concept
title: Voltage, Current, Resistance
summary: Ohm's law, U = R · I.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Push, flow and brake
    body: "Current is like water in a pipe: something drives it, something slows it down. Turn the voltage and resistance and watch the **current**. When does the most flow?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: circuit

  - kind: problem
    id: hook
    widget: choice
    prompt: You open the tap further. What happens?
    params:
      options:
        - label: More water flows
          correct: true
        - label: Less water flows
          feedback: The tap now holds back less.
        - label: Nothing
          feedback: Try it at the sink.
    hints:
      - The tap is an obstacle for the water.
    explanation: Less resistance, more flow. It is the same with electricity.

  - kind: explain
    id: s1
    body: |
      **Voltage** U (volts) drives the current. **Current** I (amperes) flows. **Resistance** R (ohms, Ω) slows it down.
      **Ohm's law** says: U = R · I.

  - kind: problem
    id: lampe
    widget: numeric
    prompt: A lamp has 12 Ω and is connected to 6 V. What is the current?
    params: { unit: A }
    answer: { value: 0.5 }
    feedback:
      - when: "numval(state.input) == 72"
        misconception: multiply
        text: "Rearranged, I = U ÷ R."
      - when: "numval(state.input) == 2"
        misconception: inverted
        text: The other way around. Voltage divided by resistance.
    hints:
      - "I = U ÷ R."
    explanation: "6 V ÷ 12 Ω = 0.5 A."

  - kind: problem
    id: strom
    widget: numeric
    prompt: A resistor of {{r}} Ω has {{u}} V across it. What is the current?
    params: { unit: A }
    answer: { value: "{{u / r}}", tolerance: 0.01 }
    feedback:
      - when: "numval(state.input) == u * r"
        misconception: multiply
        text: Divide the voltage by the resistance.
    hints:
      - "I = {{u}} V ÷ {{r}} Ω."
    explanation: "{{u}} ÷ {{r}} = {{u / r}} A."
    variants:
      params: { u: "choice[6,9,12,24]", r: "choice[2,3,4,6]" }
      defaults: { u: 12, r: 4 }

  - kind: problem
    id: widerstand
    widget: numeric
    prompt: What resistance lets exactly {{i}} A flow at 230 V?
    params: { unit: Ω }
    answer: { value: "{{230 / i}}" }
    hints:
      - "R = U ÷ I."
    explanation: "230 V ÷ {{i}} A = {{230 / i}} Ω."
    variants:
      params: { i: "choice[1,2,5,10]" }
      defaults: { i: 2 }

  - kind: problem
    id: einheiten
    widget: match
    prompt: Match each quantity with its unit.
    params:
      pairs:
        - { left: Voltage, right: Volt }
        - { left: Current, right: Ampere }
        - { left: Resistance, right: Ohm }
        - { left: Power, right: Watt }
    hints:
      - All the units are named after scientists.
    explanation: Volta, Ampère, Ohm, and Watt gave them their names.

  - kind: problem
    id: doppelt
    widget: choice
    prompt: The voltage stays the same, and the resistance doubles. What happens to the current?
    params:
      options:
        - { label: It halves., correct: true }
        - { label: It doubles., feedback: "More resistance slows it down more." }
        - { label: It stays the same., feedback: "I = U ÷ R. If R grows, I drops." }
    hints:
      - "Look at I = U ÷ R."
    explanation: Double the resistance, half the current.

  - kind: problem
    id: c1
    widget: sim
    prompt: Make exactly **2 amperes** flow through the lamp.
    params:
      scene: circuit
    answer:
      current: 2
    explanation: For example 12 V across 6 Ω. Current = voltage ÷ resistance.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: The voltage is fixed at 12 V. Set the resistance so that the lamp delivers **48 watts**.
    params:
      scene: circuit
      controls:
        voltage:
          value: 12
          fixed: true
        resistance:
          value: 12
    answer:
      power: 48
    explanation: "At 3 Ω, 4 A flows: 12 V · 4 A = 48 W. Smaller resistance, more power."
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "A wire's **resistance** grows with its length and falls with its cross-section: $R = \\rho \\cdot \\frac{L}{A}$. Twice as long means double the resistance. Twice as thick means half."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: A wire has 2 Ω. A second one of the same metal is {{l}} times as long and has {{a}} times the cross-section. What is its resistance?
    params:
      unit: Ω
    answer:
      value: "{{2 * l / a}}"
    feedback:
      - when: abs(numval(state.input) - 2 * l * a) < 0.01
        misconception: area-direction
        text: More cross-section widens the path – resistance **falls**. Divide by {{a}}.
    hints:
      - "Length: times {{l}}. Cross-section: divided by {{a}}."
      - 2 · {{l}} ÷ {{a}} = ?
    explanation: "2 Ω · {{l}} ÷ {{a}} = {{2 * l / a}} Ω. That is why cooker cables have thick cores: they carry a lot of current without getting hot."
    difficulty: 2
    variants:
      params:
        l: choice[2,3,4,6]
        a: choice[2,4]
      constraints:
        - l != a
      defaults:
        l: 6
        a: 4

  - kind: problem
    id: ph-d3
    depth: 2
    widget: graph
    prompt: A resistor has 2 Ω. The line shows U = R · I. Drag the point to where 3 A flows.
    params:
      x:
        - 0
        - 6
      y:
        - 0
        - 12
      grid: 1
      functions:
        - expr: 2*x
          label: U = 2 · I
      points:
        - id: A
          x: 0
          y: 0
          label: P
    answer:
      points:
        A:
          x: 3
          y: 6
    hints:
      - Horizontally is current I, vertically voltage U.
      - "At I = 3 A: U = 2 · 3."
    explanation: At 3 A there are 6 V across it. For an ohmic resistor the U–I graph is a straight line through zero – its slope is R.
    difficulty: 2

  - kind: problem
    id: ph-d4
    depth: 2
    widget: choice
    prompt: Does an incandescent bulb have more resistance when cold or when hot?
    params:
      options:
        - label: Hot – the glowing filament has about ten times the resistance.
          correct: true
        - label: Cold – cold slows electrons.
          feedback: In metals the thermal jiggling of the atoms impedes the current. Hot means more resistance.
        - label: The same – R is a fixed number.
          feedback: Only at constant temperature. A bulb is not an ohmic resistor.
    hints:
      - What do the atoms in the filament do when it glows?
      - Atoms that jiggle more get in the electrons' way more often.
    explanation: Tungsten at 2500 °C has about ten times its cold resistance. So a big current flows briefly at switch-on – which is when bulbs usually blow.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Power is $P = \frac{U^2}{R}$. A 1000 W heater built for 230 V is run on 115 V in the USA. How many watts does it deliver there?
    params:
      unit: W
    answer:
      value: 250
    hints:
      - Half the voltage – and the voltage is squared.
    explanation: "A quarter: 250 W. Half the voltage also drives only half the current."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: An extension cable is 100 m long, so the current runs through 200 m of copper. Cross-section 1.5 mm², ρ = 0.0175 Ω·mm²/m. What is its resistance?
    params:
      unit: Ω
    answer:
      value: 2.33
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - 1.17) < 0.05
        misconception: one-way
        text: "The current goes there **and** back: 200 m, not 100 m."
    hints:
      - R = ρ · L ÷ A.
      - 0.0175 · 200 ÷ 1.5 = ?
    explanation: R ≈ 2.33 Ω. At 16 A the cable drops 37 V and heats up with almost 600 W. That is why cable reels should always be fully unwound.
    difficulty: 3

srs:
  cards_from: [strom, doppelt]
