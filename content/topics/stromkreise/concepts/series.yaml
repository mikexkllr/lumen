id: sci.circuits.series
type: concept
title: Reihe oder parallel?
summary: Zwei Arten, Geräte zu verbinden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Spannung teilen
    body: Hängen zwei Widerstände hintereinander, teilen sie sich die Spannung. Dreh an R₁ und R₂ und schau, was am Ausgang ankommt. So steckt die **Reihenschaltung** in vielen Geräten.
    visual:
      widget: sim
      interactive: true
      params:
        scene: divider

  - kind: problem
    id: kette
    widget: choice
    prompt: Bei einer Lichterkette geht eine Lampe kaputt – und alle gehen aus. Wie sind sie geschaltet?
    params:
      options:
        - { label: In Reihe – hintereinander, correct: true }
        - { label: Parallel – nebeneinander, feedback: "Dann würden die anderen weiterleuchten." }
    hints:
      - Muss der Strom durch jede Lampe?
    explanation: In Reihe fließt der Strom durch alle. Eine Lücke unterbricht den ganzen Kreis.

  - kind: problem
    id: schalter
    widget: gates
    prompt: Zwei Schalter parallel – die Lampe brennt, wenn einer von beiden an ist. Welches Gatter passt?
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: g, type: "?", in: [A, B], options: [AND, OR, XOR] }
      outputs: [{ id: Q, from: g, label: Lampe }]
    check: { predicate: "table('Q') == [0, 1, 1, 1]" }
    hints:
      - Auch wenn beide an sind, brennt sie.
    explanation: Parallel ist ODER, in Reihe ist UND.

  - kind: explain
    id: s3
    body: |
      In **Reihe** addieren sich die Widerstände. **Parallel** bekommt jedes Gerät die volle Spannung – so sind die Steckdosen im Haus geschaltet.

  - kind: problem
    id: reihe
    widget: numeric
    prompt: Zwei Widerstände mit {{a}} Ω und {{b}} Ω liegen in Reihe. Wie groß ist der Gesamtwiderstand?
    params: { unit: Ω }
    answer: { value: "{{a + b}}" }
    hints:
      - Einfach addieren.
    explanation: "{{a}} + {{b}} = {{a + b}} Ω."
    variants:
      params: { a: "choice[10,47,100,220]", b: "choice[22,33,68,150]" }
      defaults: { a: 100, b: 68 }

  - kind: problem
    id: parallel
    widget: numeric
    prompt: Zwei gleiche Widerstände mit je {{r}} Ω liegen parallel. Wie groß ist der Gesamtwiderstand?
    params: { unit: Ω }
    answer: { value: "{{r / 2}}" }
    feedback:
      - when: "numval(state.input) == 2 * r"
        misconception: parallel-add
        text: Parallel gibt es zwei Wege – der Widerstand wird kleiner, nicht größer.
    hints:
      - Zwei gleiche Wege – der Strom fließt doppelt so leicht.
    explanation: "Halb so groß – {{r / 2}} Ω."
    variants:
      params: { r: "choice[10,20,50,100,220]" }
      defaults: { r: 100 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Steckdosen im Haus
          right: true
        - text: Batterien in einer Taschenlampe
          right: false
        - text: Sicherung und das Gerät dahinter
          right: false
        - text: Scheinwerfer eines Autos
          right: true
      left: Reihe
      right: Parallel

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: An 12 V hängen zwei Widerstände in Reihe. Am unteren Widerstand R₂ sollen genau 4 V anliegen. Stell R₁ und R₂ passend ein.
    params:
      scene: divider
      controls:
        voltage:
          fixed: true
    answer:
      out: 4
    hints:
      - In Reihe teilen sich die Widerstände die Spannung im Verhältnis ihrer Größe.
      - 4 V von 12 V sind ein Drittel. R₁ muss also doppelt so groß sein wie R₂.
    explanation: "Zum Beispiel R₁ = 10 kΩ und R₂ = 5 kΩ: Am größeren Widerstand fallen 8 V ab, am kleineren 4 V."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: 6 Ω und 3 Ω liegen parallel. Wie groß ist der Gesamtwiderstand?
    params:
      unit: Ω
    answer:
      value: 2
    hints:
      - 1/R = 1/6 + 1/3.
    explanation: 1/R = 1/2, also 2 Ω – kleiner als der kleinste Einzelwiderstand.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Zwei Lampen mit je 6 Ω hängen in Reihe: zusammen 12 Ω. Stell den Widerstand ein und finde die Spannung, bei der genau 1 A fließt."
    params:
      scene: circuit
      controls:
        resistance:
          value: 6
        voltage:
          value: 6
    answer:
      resistance: 12
      current: 1
    explanation: 12 V. In Reihe addieren sich die Widerstände – für denselben Strom braucht man mehr Spannung.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "Zwei Regeln reichen für jede Schaltung. Erstens: An jedem **Knoten** fließt so viel hinein wie heraus. Zweitens: Auf jedem geschlossenen Umlauf ergeben alle Spannungen zusammen null."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: In einen Knoten fließen 3 A und 2 A hinein. Aus einem Draht fließen 1,5 A heraus. Wie viel Strom fließt im letzten Draht heraus?
    params:
      unit: A
    answer:
      value: 3.5
    feedback:
      - when: numval(state.input) == 6.5
        misconception: sign-junction
        text: Die 1,5 A fließen **heraus**, nicht hinein.
    hints:
      - "Hinein: 3 A + 2 A = 5 A."
      - Hinaus muss genauso viel.
    explanation: 5 A − 1,5 A = 3,5 A. Ladung geht nicht verloren und staut sich nicht – das ist die Knotenregel.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: Drei Widerstände mit 2 Ω, 3 Ω und 6 Ω liegen parallel. Wie groß ist der Gesamtwiderstand?
    params:
      unit: Ω
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 11
        misconception: series-parallel
        text: Das wäre die Reihenschaltung. Parallel addiert man die Kehrwerte.
    hints:
      - 1/R = 1/2 + 1/3 + 1/6.
      - Bring alles auf Sechstel.
    explanation: 3/6 + 2/6 + 1/6 = 1, also R = 1 Ω. Parallel ist der Gesamtwiderstand immer kleiner als der kleinste einzelne.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Ein Spannungsteiler: 12 V liegen an 2 Ω und 4 Ω in Reihe. Welche Spannung fällt am 4-Ω-Widerstand ab?"
    params:
      unit: V
    answer:
      value: 8
    hints:
      - "Der Strom ist 12 V : 6 Ω = 2 A."
    explanation: 2 A · 4 Ω = 8 V. Die Spannung teilt sich im Verhältnis der Widerstände.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Eine Lampe leuchtet allein an 12 V. Jetzt hängen zwei gleiche Lampen in Reihe an denselben 12 V. Auf welchen Bruchteil sinkt die Leistung jeder Lampe? Nimm R als fest an.
    answer:
      value: 1/4
    feedback:
      - when: abs(numval(state.input) - 0.5) < 0.01
        misconception: linear-power
        text: Jede Lampe bekommt die halbe Spannung. Die Leistung hängt aber von U² ab.
    hints:
      - An jeder Lampe liegen nur noch 6 V.
      - "P = U² : R. Halbe Spannung heißt …?"
    explanation: "P = U²/R: Halbe Spannung heißt ein Viertel Leistung pro Lampe. Zusammen leuchten beide nur halb so hell wie eine allein."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Du schaltest Widerstände parallel. Zusammen haben sie immer weniger Widerstand als der kleinste von ihnen. Warum?
    params:
      options:
        - label: Jeder zusätzliche Zweig öffnet einen weiteren Weg für den Strom.
          correct: true
        - label: Weil sich die Spannung aufteilt.
          feedback: Parallel liegt an jedem Zweig die volle Spannung.
        - label: Weil Widerstände sich gegenseitig schwächen.
          feedback: Jeder Widerstand bleibt, wie er ist. Es kommen nur Wege dazu.
    hints:
      - Denk an Kassen im Supermarkt.
      - Eine Kasse mehr – geht es schneller oder langsamer?
    explanation: Mehr parallele Wege lassen bei gleicher Spannung mehr Strom fließen. Mehr Strom bei gleicher Spannung heißt kleinerer Gesamtwiderstand.
    difficulty: 3

srs:
  cards_from: [kette, parallel]
