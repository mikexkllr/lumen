id: sci.circuits.safety
type: concept
title: Strom und Sicherheit
summary: Was wirklich gefährlich ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Gefährlich ist der **Strom durch den Körper**. Schon etwa 50 mA können lebensgefährlich sein. Nasse Haut senkt den Widerstand – dann fließt mehr.

  - kind: problem
    id: koerper
    widget: numeric
    prompt: An 230 V hat ein Körper {{r}} Ω Widerstand. Wie viel Strom fließt?
    params: { unit: mA }
    answer: { value: "{{230000 / r}}" }
    hints:
      - "Strom = Spannung : Widerstand. Dann mal 1000 für mA."
    explanation: "230 : {{r}} = {{230 / r}} A, also {{230000 / r}} mA – weit über der Gefahrengrenze."
    variants:
      params: { r: "choice[1000,2000,2300,4600]" }
      defaults: { r: 2300 }

  - kind: problem
    id: fi
    widget: choice
    prompt: Wozu dient der FI-Schalter im Sicherungskasten?
    params:
      options:
        - { label: "Er schaltet ab, wenn Strom einen falschen Weg nimmt.", correct: true }
        - { label: Er spart Strom., feedback: "Er schützt Menschen, nicht den Geldbeutel." }
        - { label: Er schützt nur vor Überlastung., feedback: "Das macht die normale Sicherung." }
    hints:
      - Was passiert, wenn Strom durch einen Menschen zur Erde fließt?
    explanation: Fehlt ein Teil des Stroms auf dem Rückweg, trennt der FI in Millisekunden.

  - kind: problem
    id: gefahr
    widget: buckets
    prompt: Gefährlich oder nicht?
    params:
      buckets: [{ label: gefährlich }, { label: unbedenklich }]
      items:
        - { label: Föhn am Badewannenrand, bucket: gefährlich }
        - { label: Drachen nahe einer Stromleitung, bucket: gefährlich }
        - { label: Vogel auf einer Hochspannungsleitung, bucket: unbedenklich }
        - { label: Handy lädt auf dem Tisch, bucket: unbedenklich }
    hints:
      - Kann Strom durch einen Körper zur Erde fließen?
    explanation: Der Vogel berührt nur einen Draht – es gibt keinen Weg für den Strom durch ihn.

srs:
  cards_from: [fi, gefahr]
