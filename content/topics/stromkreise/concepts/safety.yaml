id: sci.circuits.safety
type: concept
title: Strom und Sicherheit
summary: Was wirklich gefährlich ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Retten oder schaden
    body: "Strom kann Leben retten und Leben kosten. Deck die Karten auf: Wann wird **Strom** gefährlich, und wann schützt oder hilft er?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🫀
            front: Defibrillator
            back: Ein starker Stromstoß bringt ein flimmerndes Herz wieder in den Takt.
          - icon: 🐄
            front: Kühe im Gewitter
            back: Blitzt es nahe, liegt zwischen ihren weit gespreizten Beinen eine hohe Spannung im Boden.
          - icon: 🧤
            front: Gummihandschuhe
            back: Elektriker tragen sie, weil Gummi den Strom kaum leitet.

  - kind: problem
    id: hook
    widget: choice
    prompt: Warum darf ein Föhn niemals in die Badewanne fallen?
    params:
      options:
        - label: Das Wasser leitet den Strom durch den Körper
          correct: true
        - label: Der Föhn geht kaputt
          feedback: Das ist das kleinste Problem.
        - label: Das Wasser wird zu heiß
          feedback: Die Gefahr ist der Strom.
    hints:
      - Wasser und Strom vertragen sich nicht.
    explanation: Gefährlich ist der Strom, der durch den Körper fließt.

  - kind: explain
    id: s1
    body: |
      Gefährlich ist der **Strom durch den Körper**. Schon etwa 50 mA können lebensgefährlich sein. Nasse Haut senkt den Widerstand – dann fließt mehr.

  - kind: problem
    id: koerper
    widget: numeric
    prompt: An 230 V hat ein Körper {{r}} Ω Widerstand. Wie viel Strom fließt?
    params: { unit: mA }
    answer: { value: "{{230000 / r}}" }
    hints:
      - "Strom = Spannung : Widerstand. Dann mal 1000 für mA."
    explanation: "230 : {{r}} = {{230 / r}} A, also {{230000 / r}} mA – weit über der Gefahrengrenze."
    variants:
      params: { r: "choice[1000,2000,2300,4600]" }
      defaults: { r: 2300 }

  - kind: problem
    id: fi
    widget: choice
    prompt: Wozu dient der FI-Schalter im Sicherungskasten?
    params:
      options:
        - { label: "Er schaltet ab, wenn Strom einen falschen Weg nimmt.", correct: true }
        - { label: Er spart Strom., feedback: "Er schützt Menschen, nicht den Geldbeutel." }
        - { label: Er schützt nur vor Überlastung., feedback: "Das macht die normale Sicherung." }
    hints:
      - Was passiert, wenn Strom durch einen Menschen zur Erde fließt?
    explanation: Fehlt ein Teil des Stroms auf dem Rückweg, trennt der FI in Millisekunden.

  - kind: problem
    id: gefahr
    widget: buckets
    prompt: Gefährlich oder nicht?
    params:
      buckets: [{ label: gefährlich }, { label: unbedenklich }]
      items:
        - { label: Föhn am Badewannenrand, bucket: gefährlich }
        - { label: Drachen nahe einer Stromleitung, bucket: gefährlich }
        - { label: Vogel auf einer Hochspannungsleitung, bucket: unbedenklich }
        - { label: Handy lädt auf dem Tisch, bucket: unbedenklich }
    hints:
      - Kann Strom durch einen Körper zur Erde fließen?
    explanation: Der Vogel berührt nur einen Draht – es gibt keinen Weg für den Strom durch ihn.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Trockene Haut hat etwa 100 000 Ω, nasse nur 1000 Ω. Wie viel mA fließen bei nasser Haut an 230 V?
    params:
      unit: mA
    answer:
      value: 230
    hints:
      - "230 V : 1000 Ω, dann in mA."
    explanation: 0,23 A = 230 mA – weit über der tödlichen Grenze von 50 mA.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Kleiner Widerstand, großer Strom: An 12 V sollen 4 A fließen. Welchen Widerstand brauchst du?"
    params:
      scene: circuit
    answer:
      voltage: 12
      current: 4
    explanation: 3 Ω. Sinkt der Widerstand auf ein Viertel, vervierfacht sich der Strom. Darum ist nasse Haut so gefährlich.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Wozu hat ein Wasserkocher mit Metallgehäuse einen Schutzleiter, der das Gehäuse mit der Erde verbindet?
    params:
      options:
        - label: Berührt ein loser Draht das Gehäuse, fließt der Strom über die Erde ab – und die Sicherung löst aus.
          correct: true
        - label: Er macht das Wasser schneller heiß.
          feedback: Am Heizen ist er nicht beteiligt. Er schützt nur.
        - label: Er spart Strom.
          feedback: Im Normalfall fließt über ihn gar nichts.
    hints:
      - Was passiert ohne Erde, wenn das Gehäuse unter Spannung steht?
      - Der Strom nimmt den Weg des kleinsten Widerstands.
    explanation: Ohne Schutzleiter stünde das Gehäuse unter 230 V und du wärst der Weg zur Erde. Mit ihm fließt ein großer Fehlerstrom, und Sicherung oder FI schalten sofort ab.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Ein FI-Schalter löst bei 30 mA Fehlerstrom aus. Bei welchem Körperwiderstand würden an 230 V gerade 30 mA fließen? Auf ganze Ohm.
    params:
      unit: Ω
    answer:
      value: 7667
      tolerance: 10
    feedback:
      - when: abs(numval(state.input) - 7.67) < 0.1
        misconception: milli
        text: "Erst mA in A umrechnen: 30 mA = 0,03 A."
    hints:
      - "R = U : I."
      - "230 : 0,03 = ?"
    explanation: R ≈ 7667 Ω. Nasse Haut liegt deutlich darunter. Der FI schaltet dann in Sekundenbruchteilen ab – bevor das Herz aus dem Takt kommt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Vogel sitzt auf einer Hochspannungsleitung und bleibt unverletzt. Warum?
    params:
      options:
        - label: Zwischen seinen Füßen liegt fast keine Spannung – es fließt kein Strom durch ihn
          correct: true
        - label: Vogelfüße isolieren perfekt
          feedback: Berührt er zugleich den Mast, stirbt er.
        - label: Die Leitung ist isoliert
          feedback: Freileitungen sind blank.
    hints:
      - Strom fließt nur bei einem Spannungs**unterschied**.
    explanation: Gefährlich ist nie die Spannung allein, sondern der Unterschied zwischen zwei berührten Punkten.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux das ohmsche Gesetz mit einem Bild aus dem Alltag.
    params:
      keywords:
        - - spannung
          - voltage
          - druck
          - pressure
        - - strom
          - current
          - fließ
          - flow
        - - widerstand
          - resistance
          - eng
          - narrow
          - brems
      sample: "Die Spannung ist wie der Wasserdruck, der Strom wie die fließende Wassermenge. Der Widerstand ist ein enges Rohr: Je enger, desto weniger fließt bei gleichem Druck."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Blitz transportiert 30 000 A für 0,0001 s. Wie viel Ladung fließt dabei – in Coulomb?
    params:
      unit: C
    answer:
      value: 3
    hints:
      - Ladung = Strom · Zeit.
      - 30 000 · 0,0001 = ?
    explanation: Nur 3 Coulomb – weniger als ein Handy-Akku in einer Minute liefert! Gefährlich ist der Blitz wegen der riesigen Spannung und Leistung in kurzer Zeit.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Warum ist Wechselstrom mit 50 Hz für das Herz besonders gefährlich?
    params:
      options:
        - label: Er kann den Herzrhythmus leicht stören und Kammerflimmern auslösen.
          correct: true
        - label: Weil er heißer ist als Gleichstrom.
          feedback: Gleiche Stromstärke heizt gleich. Es geht um die Wirkung auf Nerven und Herz.
        - label: Er ist gar nicht gefährlicher.
          feedback: Gerade Frequenzen um 50 Hz stören das Herz besonders leicht.
    hints:
      - Herz und Muskeln werden durch elektrische Signale gesteuert.
      - Ein Takt von 50 Hz liegt nah an dem, worauf Muskeln reagieren.
    explanation: Wechselstrom um 50 Hz reizt Nerven und Muskeln immer wieder neu. Das Herz kann dabei ins Flimmern geraten und pumpt dann nicht mehr. Darum sind schon kleine Ströme lebensgefährlich.
    difficulty: 3

srs:
  cards_from: [fi, gefahr]
