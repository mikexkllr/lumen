id: sci.circuits.safety
type: concept
title: Strom und Sicherheit
summary: Was wirklich gefährlich ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Warum darf ein Föhn niemals in die Badewanne fallen?
    params:
      options:
        - label: Das Wasser leitet den Strom durch den Körper
          correct: true
        - label: Der Föhn geht kaputt
          feedback: Das ist das kleinste Problem.
        - label: Das Wasser wird zu heiß
          feedback: Die Gefahr ist der Strom.
    hints:
      - Wasser und Strom vertragen sich nicht.
    explanation: Gefährlich ist der Strom, der durch den Körper fließt.

  - kind: explain
    id: s1
    body: |
      Gefährlich ist der **Strom durch den Körper**. Schon etwa 50 mA können lebensgefährlich sein. Nasse Haut senkt den Widerstand – dann fließt mehr.

  - kind: problem
    id: koerper
    widget: numeric
    prompt: An 230 V hat ein Körper {{r}} Ω Widerstand. Wie viel Strom fließt?
    params: { unit: mA }
    answer: { value: "{{230000 / r}}" }
    hints:
      - "Strom = Spannung : Widerstand. Dann mal 1000 für mA."
    explanation: "230 : {{r}} = {{230 / r}} A, also {{230000 / r}} mA – weit über der Gefahrengrenze."
    variants:
      params: { r: "choice[1000,2000,2300,4600]" }
      defaults: { r: 2300 }

  - kind: problem
    id: fi
    widget: choice
    prompt: Wozu dient der FI-Schalter im Sicherungskasten?
    params:
      options:
        - { label: "Er schaltet ab, wenn Strom einen falschen Weg nimmt.", correct: true }
        - { label: Er spart Strom., feedback: "Er schützt Menschen, nicht den Geldbeutel." }
        - { label: Er schützt nur vor Überlastung., feedback: "Das macht die normale Sicherung." }
    hints:
      - Was passiert, wenn Strom durch einen Menschen zur Erde fließt?
    explanation: Fehlt ein Teil des Stroms auf dem Rückweg, trennt der FI in Millisekunden.

  - kind: problem
    id: gefahr
    widget: buckets
    prompt: Gefährlich oder nicht?
    params:
      buckets: [{ label: gefährlich }, { label: unbedenklich }]
      items:
        - { label: Föhn am Badewannenrand, bucket: gefährlich }
        - { label: Drachen nahe einer Stromleitung, bucket: gefährlich }
        - { label: Vogel auf einer Hochspannungsleitung, bucket: unbedenklich }
        - { label: Handy lädt auf dem Tisch, bucket: unbedenklich }
    hints:
      - Kann Strom durch einen Körper zur Erde fließen?
    explanation: Der Vogel berührt nur einen Draht – es gibt keinen Weg für den Strom durch ihn.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Trockene Haut hat etwa 100 000 Ω, nasse nur 1000 Ω. Wie viel mA fließen bei nasser Haut an 230 V?
    params:
      unit: mA
    answer:
      value: 230
    hints:
      - "230 V : 1000 Ω, dann in mA."
    explanation: 0,23 A = 230 mA – weit über der tödlichen Grenze von 50 mA.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Kleiner Widerstand, großer Strom: An 12 V sollen 4 A fließen. Welchen Widerstand brauchst du?"
    params:
      scene: circuit
    answer:
      voltage: 12
      current: 4
    explanation: 3 Ω. Sinkt der Widerstand auf ein Viertel, vervierfacht sich der Strom. Darum ist nasse Haut so gefährlich.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Vogel sitzt auf einer Hochspannungsleitung und bleibt unverletzt. Warum?
    params:
      options:
        - label: Zwischen seinen Füßen liegt fast keine Spannung – es fließt kein Strom durch ihn
          correct: true
        - label: Vogelfüße isolieren perfekt
          feedback: Berührt er zugleich den Mast, stirbt er.
        - label: Die Leitung ist isoliert
          feedback: Freileitungen sind blank.
    hints:
      - Strom fließt nur bei einem Spannungs**unterschied**.
    explanation: Gefährlich ist nie die Spannung allein, sondern der Unterschied zwischen zwei berührten Punkten.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux das ohmsche Gesetz mit einem Bild aus dem Alltag.
    params:
      keywords:
        - - spannung
          - voltage
          - druck
          - pressure
        - - strom
          - current
          - fließ
          - flow
        - - widerstand
          - resistance
          - eng
          - narrow
          - brems
      sample: "Die Spannung ist wie der Wasserdruck, der Strom wie die fließende Wassermenge. Der Widerstand ist ein enges Rohr: Je enger, desto weniger fließt bei gleichem Druck."
    difficulty: 3

srs:
  cards_from: [fi, gefahr]
