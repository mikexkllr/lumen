id: ai.search.astar
type: concept
title: "A* – heading for the goal with an estimate"
summary: "A good estimate of the remaining distance makes search purposeful."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The straight-line trick
    body: "A navigation app plans your route in seconds. Its trick is an **estimate** of how far is left – such as the straight-line distance. Drag your dot around: the line shows the shortest possible rest of the way."
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 10
        y:
          - 0
          - 8
        showCoordinates: false
        points:
          - id: du
            x: 1
            y: 1
            label: You
          - id: z
            x: 8
            y: 6
            draggable: false
            label: Goal
        segments:
          - - du
            - z

  - kind: problem
    id: c1
    widget: network
    prompt: The numbers are kilometres. Find the shortest route from S to Z.
    params:
      start: S
      end: Z
      unit: km
      nodes:
        - id: S
          x: 4
          y: 50
        - id: A
          x: 30
          y: 12
        - id: B
          x: 30
          y: 88
        - id: C
          x: 64
          y: 12
        - id: D
          x: 64
          y: 88
        - id: Z
          x: 96
          y: 50
      edges:
        - a: S
          b: A
          w: 2
        - a: S
          b: B
          w: 4
        - a: A
          b: C
          w: 7
        - a: A
          b: B
          w: 1
        - a: B
          b: D
          w: 3
        - a: C
          b: Z
          w: 1
        - a: D
          b: Z
          w: 5
        - a: D
          b: C
          w: 2
    hints:
      - The direct route via A and C is not the shortest.
      - From A the detour to B pays off.
    explanation: S → A → B → D → C → Z = 2 + 1 + 3 + 2 + 1 = 9 km. Many small steps beat one big one here.

  - kind: explain
    id: c2
    body: "A heuristic estimates how far the goal still is – say, the straight-line distance. A* scores each place with f = g + h: path so far g plus estimated rest h. It always expands the smallest f."

  - kind: problem
    id: c3
    widget: numeric
    prompt: You have driven {{g}} km to reach a place. The straight-line distance to the goal is {{h}} km. What is f?
    answer:
      value: "{{g + h}}"
    hints:
      - f = g + h.
      - "{{g}} + {{h}} = ?"
    explanation: f = {{g + h}} is an estimate of the total length of a route through this place.
    variants:
      params:
        g: int[2,30]
        h: int[2,30]
      defaults:
        g: 4
        h: 6

  - kind: problem
    id: c4
    widget: choice
    prompt: "Three places are waiting: A with g = 2 and h = 7, B with g = 5 and h = 2, C with g = 3 and h = 5. Which one does A* expand next?"
    params:
      options:
        - label: B – f = 7 is the smallest.
          correct: true
        - label: A – the path there was shortest.
          feedback: "A* counts the rest too: A has f = 9."
        - label: C – it lies in the middle.
          feedback: C has f = 8, B has 7.
    hints:
      - Compute g + h for each place.
      - "A: 9, B: 7, C: 8."
    explanation: B has the smallest f = 7. So A* goes where the whole route is probably shortest – not just the part so far.

  - kind: problem
    id: c5
    widget: numeric
    prompt: On a grid a robot can only move horizontally and vertically. It is at ({{x}} | {{y}}), the goal at ({{x + a}} | {{y + b}}). What is the Manhattan estimate?
    answer:
      value: "{{a + b}}"
    feedback:
      - when: numval(state.input) * numval(state.input) == a * a + b * b
        misconception: euclid
        text: That is the straight line. But on the grid the robot only drives straight segments.
    hints:
      - How many steps right, how many up?
      - "{{a}} + {{b}}."
    explanation: "{{a + b}} steps – exactly right without obstacles, too optimistic with obstacles, but never too high."
    variants:
      params:
        x: int[0,5]
        y: int[0,5]
        a: int[2,8]
        b: int[2,8]
      defaults:
        x: 1
        y: 2
        a: 3
        b: 4

  - kind: problem
    id: c6
    widget: order
    prompt: Put the loop of A* in order.
    params:
      items:
        - label: Take the waiting place with the smallest f = g + h.
        - label: If it is the goal, you are done.
        - label: Compute g and h for all its neighbours.
        - label: Put the neighbours on the waiting list and start again.
    hints:
      - The goal test happens when a place is taken from the list.
      - After that the neighbours are generated.
    explanation: "Important: the goal is tested when a place is taken out, not when it is discovered. Only then is it certain that no shorter route is still waiting."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: When is A* guaranteed to find the shortest path?
    params:
      options:
        - label: When the estimate h never overestimates the remaining distance.
          correct: true
        - label: When the estimate is always too large.
          feedback: Estimates that are too large can drop a good route too early.
        - label: Always, whatever the estimate.
          feedback: With a bad estimate A* can report a detour as finished first.
    hints:
      - The straight line is never longer than the real road.
      - What if h makes a good route look much worse than it is?
    explanation: "Such an estimate is called admissible. It is optimistic: a good route never looks worse than it is, so it is not overlooked."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: buckets
    prompt: Is this estimate admissible for car trips (never too large)?
    params:
      buckets:
        - id: b1
          label: admissible
        - id: b2
          label: not admissible
      items:
        - label: straight-line distance to the goal
          bucket: b1
        - label: always 0
          bucket: b1
        - label: twice the straight line
          bucket: b2
        - label: road length plus 10 km
          bucket: b2
    hints:
      - Can the estimate be larger than the real route?
      - Even a very poor estimate can be admissible.
    explanation: The straight line and 0 are never too large. But 0 is useless – then A* becomes Dijkstra. Good heuristics are admissible and still as accurate as possible.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: In the 8-puzzle one estimate counts how many tiles are in the wrong place. In some position all 8 are misplaced. At least how many moves are needed?
    answer:
      value: 8
    hints:
      - Every move moves exactly one tile.
      - Each misplaced tile must move at least once.
    explanation: At least 8 moves. That is why the number of misplaced tiles is an admissible heuristic. The sum of Manhattan distances is admissible too – and more accurate.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What happens if you run A* with h = 0?
    params:
      options:
        - label: "It becomes Dijkstra's algorithm: correct, but with no sense of direction."
          correct: true
        - label: It no longer finds any route.
          feedback: It finds the shortest route – it just visits more places.
        - label: It becomes depth-first search.
          feedback: It still sorts by g, the cost so far.
    hints:
      - With h = 0, f = g.
      - Which method sorts by cost so far?
    explanation: The heuristic determines how goal-directed A* is. The more accurate it is without overestimating, the fewer places it must visit. With the perfect estimate it would go straight to the goal.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: A satnav uses an estimate that is sometimes slightly too large. What does it gain and what does it lose?
    params:
      options:
        - label: It searches faster but does not always find the very shortest route.
          correct: true
        - label: It gets slower and less accurate.
          feedback: A larger estimate makes the search more goal-directed, so usually faster.
        - label: Nothing – the result is identical.
          feedback: Without admissibility the guarantee of the shortest route is gone.
    hints:
      - Estimates that are too large push harder towards the goal.
      - What do you lose without admissibility?
    explanation: "That is a deliberate trade-off: slightly worse routes for much less computing time. In practice a route that is 1 % longer is often perfectly fine."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how A* finds the shortest path and what the estimate is for.
    params:
      keywords:
        - - bisher
          - gefahren
          - so far
          - travelled
        - - schätz
          - heuristik
          - luftlinie
          - estimate
          - heuristic
          - straight
        - - kleinst
          - smallest
        - - überschätz
          - nie zu groß
          - overestimat
          - never too
      sample: A* adds the path so far to an estimate of the rest, such as the straight-line distance. It always continues at the place with the smallest total. If the estimate never overestimates, it finds the shortest path.
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d1"]
