id: cs.algorithms.binsearch
type: concept
title: Halbieren statt durchsuchen
summary: Binäre Suche in wenigen Schritten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Rate-Baum
    body: "Ratespiele, Wörterbücher, Datenbanken: Überall hilft derselbe Trick. Gesucht ist hier die 11 unter 1 bis 16. Tippe den Weg von oben bis zur 11. Jeder Schritt ist **eine Frage**. Wie viele brauchst du?"
    visual:
      widget: network
      interactive: true
      params:
        start: R
        end: G
        unit: Fragen
        aspect: 0.9
        nodes:
          - id: R
            x: 50
            y: 4
            label: 1–16
          - id: A
            x: 25
            y: 28
            label: 1–8
          - id: B
            x: 75
            y: 28
            label: 9–16
          - id: C
            x: 60
            y: 52
            label: 9–12
          - id: D
            x: 90
            y: 52
            label: 13–16
          - id: E
            x: 46
            y: 76
            label: 9–10
          - id: F
            x: 74
            y: 76
            label: 11–12
          - id: G
            x: 62
            y: 97
            label: "11"
          - id: H
            x: 86
            y: 97
            label: "12"
        edges:
          - a: R
            b: A
          - a: R
            b: B
          - a: B
            b: C
          - a: B
            b: D
          - a: C
            b: E
          - a: C
            b: F
          - a: F
            b: G
          - a: F
            b: H

  - kind: problem
    id: erster
    widget: choice
    prompt: Ich denke an eine Zahl von 1 bis 100. Du hörst nur »größer« oder »kleiner«. Was rätst du zuerst?
    params:
      options:
        - { label: "50", correct: true }
        - { label: "1", feedback: "Dann schließt du im schlimmsten Fall nur eine Zahl aus." }
        - { label: "99", feedback: "Bei »kleiner« bleiben noch 98 Zahlen übrig." }
    hints:
      - Welche Antwort schließt in jedem Fall am meisten aus?
    explanation: Die Mitte halbiert den Suchraum – egal wie die Antwort lautet.

  - kind: explain
    id: s2
    body: |
      **Binäre Suche:** Frag immer in der Mitte. Jede Antwort halbiert, was übrig bleibt. So findet man in einer sortierten Liste extrem schnell alles.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: Die Zahl liegt zwischen 1 und {{2 ** k - 1}}. Wie viele Versuche brauchst du höchstens?
    params: { unit: Versuche }
    answer: { value: "{{k}}" }
    hints:
      - 1 Versuch reicht für 1 Zahl, 2 für 3 Zahlen, 3 für 7 Zahlen …
    explanation: "Mit {{k}} Versuchen deckt man $2^{ {{k}} } - 1 = {{2 ** k - 1}}$ Zahlen ab."
    variants:
      params: { k: "int[4,10]" }
      defaults: { k: 7 }

  - kind: problem
    id: telefonbuch
    widget: choice
    prompt: Eine sortierte Liste hat eine Million Namen. Wie viele Schritte braucht die binäre Suche etwa?
    params:
      options:
        - { label: "20", correct: true }
        - { label: "1000", feedback: "Viel weniger – jeder Schritt halbiert." }
        - { label: "500 000", feedback: "So viele braucht man im Schnitt, wenn man vorn anfängt." }
    hints:
      - $2^{10}$ ist etwa tausend, $2^{20}$ etwa eine Million.
    explanation: Zwanzigmal halbieren reicht für eine Million. Das ist die Macht des Logarithmus.

  - kind: problem
    id: mix-c1
    widget: estimate
    prompt: "Schätz mal: Wie viele Vergleiche braucht die binäre Suche höchstens in einer sortierten Liste mit einer Million Namen?"
    params:
      min: 1
      max: 200
    answer:
      value: 20
      tolerance: 4
    explanation: Nur 20, denn 2²⁰ ist gut eine Million.

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: Gesucht ist eine Zahl von 1 bis 32. »Größer als 16?« – Nein. »Größer als 8?« – Ja. »Größer als 12?« – Ja. Markiere alle Zahlen, die noch übrig sind.
    params:
      rows: 4
      cols: 8
      numbers:
        start: 1
      counter: true
    answer:
      pattern:
        - ........
        - ....####
        - ........
        - ........
    hints:
      - Das Nein streicht 17 bis 32, das erste Ja streicht 1 bis 8.
      - Das zweite Ja lässt nur noch 13 bis 16 übrig.
    explanation: 13, 14, 15 und 16. Drei Fragen haben 32 Zahlen auf 4 geschrumpft – nach zwei weiteren steht die Zahl fest.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In der sortierten Liste 3, 8, 12, 17, 21, 30, 44 suchst du die 30. Wie viele Vergleiche braucht die binäre Suche?
    answer:
      value: 2
    hints:
      - Mitte ist 17. Dann die Mitte der rechten Hälfte.
    explanation: Erst 17 (zu klein), dann 30 – Treffer.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: Du suchst die 52 in 2, 5, 8, 11, 17, 23, 31, 40, 52. Die Mitte wird abgerundet. Bring die Zahlen, die du nacheinander ansiehst, in die richtige Reihenfolge.
    params:
      items:
        - label: "17"
        - label: "31"
        - label: "40"
        - label: "52"
      direction: horizontal
    hints:
      - Die Mitte der 9 Zahlen ist die 5. Zahl.
      - Dann bleibt 23 bis 52 – deren Mitte, abgerundet?
    explanation: 17 → rechts weiter, 31 → rechts weiter, 40 → rechts weiter, 52. Vier Vergleiche für neun Zahlen.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Jetzt suchst du die 20 in derselben Liste. Nach wie vielen Vergleichen weißt du sicher, dass sie fehlt?
    answer:
      value: 3
    hints:
      - Erst 17, dann rechts davon die Mitte von 23 bis 52.
      - Nach 17, 31 und 23 ist der Bereich leer.
    explanation: 17 ist zu klein, 31 zu groß, 23 zu groß – zwischen 17 und 23 ist nichts mehr. Auch erfolglose Suche dauert nur log₂ n Schritte.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Die Liste 3, 7, 7, 7, 9 hat die 7 dreimal. Die einfache Suche findet irgendeine 7. Wie findet man die erste?
    params:
      options:
        - label: Bei einem Treffer nicht aufhören, sondern links weitersuchen
          correct: true
        - label: Vom Treffer aus Schritt für Schritt nach links laufen
          feedback: Das klappt, kann aber bei vielen gleichen Werten linear langsam werden.
        - label: Das geht nicht
          feedback: Es geht – mit einer kleinen Änderung der Suche.
    hints:
      - Was weißt du nach einem Treffer über die erste 7?
      - Sie liegt hier oder weiter links.
    explanation: Man merkt sich den Treffer und halbiert weiter nach links. So bleibt es bei log₂ n Schritten. In Bibliotheken heißt das oft lower_bound.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die binäre Suche stand jahrelang fehlerhaft in Lehrbüchern und Bibliotheken. Wo lag der Fehler?
    params:
      options:
        - label: (links + rechts) / 2 läuft bei riesigen Listen über den Zahlenbereich hinaus
          correct: true
        - label: Sie funktionierte nur für gerade Längen
          feedback: Ungerade Längen waren nie ein Problem.
        - label: Sie verglich in der falschen Reihenfolge
          feedback: Die Logik stimmte – die Rechnung der Mitte nicht.
    hints:
      - Was passiert, wenn links + rechts größer ist als die größte speicherbare Zahl?
    explanation: Richtig ist links + (rechts − links) / 2. Selbst einfache Algorithmen bergen Fallen.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Halbieren klappt auch ohne Liste. Gesucht ist √2 zwischen 1 und 2: Ist 1,5² zu groß? Ja, also liegt √2 links. Jede Frage halbiert das Intervall. Das heißt **Bisektion**."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Wie viele Halbierungen braucht die Bisektion, um √2 zwischen 1 und 2 auf 0,001 genau einzugrenzen?
    answer:
      value: 10
    hints:
      - Nach k Halbierungen ist das Intervall $1/2^k$ breit.
      - $2^{10}$ = 1024.
    explanation: $1/2^{10}$ ≈ 0,00098 < 0,001. Zehn Fragen für drei Nachkommastellen – das nutzen Rechner beim Lösen von Gleichungen.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Lohnt sich binäre Suche in einer verketteten Liste, in der jedes Element nur seinen Nachfolger kennt?
    params:
      options:
        - label: Nein – um zur Mitte zu kommen, muss man schon die halbe Liste ablaufen
          correct: true
        - label: Ja, genauso wie im Array
          feedback: Im Array springt man direkt zur Mitte, hier nicht.
        - label: Nur wenn die Liste kurz ist
          feedback: Gerade bei langen Listen wird das Laufen teuer.
    hints:
      - Wie kommst du in einer Kette zum mittleren Glied?
      - Die Suche braucht direkten Zugriff.
    explanation: Binäre Suche braucht Sprünge in O(1). Für verkettete Daten nimmt man Suchbäume.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die binäre Suche nur in sortierten Listen funktioniert.
    params:
      keywords:
        - - sortiert
          - sorted
          - ordnung
          - order
        - - mitte
          - middle
        - - hälfte
          - halb
          - half
          - ausschließ
          - rule out
          - wegfallen
          - discard
      sample: "Ich schaue in die Mitte. Weil die Liste sortiert ist, weiß ich: Ist die gesuchte Zahl größer, kann sie nur rechts liegen. Die ganze linke Hälfte fällt weg. Ohne Ordnung wüsste ich das nicht."
    difficulty: 3

srs:
  cards_from: [schritte, telefonbuch]
