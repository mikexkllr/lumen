id: cs.algorithms.bubble
type: concept
title: Hands-on bubble sort
summary: Swap neighbors until everything is in order.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: drei
    widget: swap
    prompt: Sort the bars from smallest to largest. You may only swap neighbors.
    params: { values: [3, 1, 2] }
    hints:
      - Swap the 3 to the right.
    explanation: Two swaps. The large number bubbles to the right.

  - kind: explain
    id: s2
    body: |
      **Bubble sort:** Walk from left to right. If a pair is the wrong way round, swap it.
      After each pass, the largest number is at the far right, like a rising bubble.

  - kind: problem
    id: fuenf
    widget: swap
    prompt: Sort with at most 7 neighbor swaps.
    params: { values: [5, 2, 4, 1, 3], maxSwaps: 7 }
    hints:
      - Only swap neighbors that are the wrong way round. Any other swap is wasted.
    explanation: Each pair that is the wrong way round needs exactly one swap. Here there are 7 such pairs.

  - kind: problem
    id: paare
    widget: numeric
    prompt: How many pairs in the row 2, 4, 1, 3 are the wrong way round?
    params: { unit: pairs }
    answer: { value: 3 }
    hints:
      - Check every pair. Is the larger number to the left of the smaller one?
    explanation: (2,1), (4,1) and (4,3). Bubble sort needs exactly 3 swaps here.

  - kind: explain
    id: s5
    body: Is bubble sort fast?
    reveal:
      body: Sadly, no. With n numbers there can be almost n² / 2 wrong pairs. For a million numbers, that is 500 billion swaps.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The row 5, 4, 3, 2, 1 is exactly reversed. How many neighbour swaps does bubble sort need?
    answer:
      value: 10
    hints:
      - "Every pair is out of order: 4 + 3 + 2 + 1."
    explanation: 10 swaps – as many as there are out-of-order pairs (**inversions**).
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: One pass of bubble sort over 5, 1, 4, 2, 8. What does the row look like afterwards?
    params:
      items:
        - label: "1"
        - label: "4"
        - label: "2"
        - label: "5"
        - label: "8"
      direction: horizontal
    hints:
      - Compare in turn 5 and 1, 5 and 4, 5 and 2, 5 and 8.
      - The 5 travels until it meets the 8.
    explanation: "5 swaps with 1, 4 and 2 and stops before the 8: 1, 4, 2, 5, 8. Not sorted yet – the 2 is out of place."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: A row of {{n}} numbers is in exactly reverse order. How many neighbour swaps does bubble sort need?
    answer:
      value: "{{n * (n - 1) / 2}}"
    feedback:
      - when: numval(state.input) == n - 1
        misconception: one-pass
        text: That is only the first round. After it only the largest number is in place.
    hints:
      - Every pair is in the wrong order. How many pairs are there?
      - "{{n - 1}} + {{n - 2}} + … + 1."
    explanation: Each neighbour swap fixes exactly one wrong pair. Here all {{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}} pairs are wrong.
    difficulty: 2
    variants:
      params:
        n: int[4,12]
      defaults:
        n: 6

  - kind: problem
    id: cs-d3
    depth: 2
    widget: swap
    prompt: Sort with at most 8 neighbour swaps. No swap may be wasted.
    params:
      values:
        - 3
        - 6
        - 1
        - 5
        - 2
        - 4
      adjacent: true
      maxSwaps: 8
    hints:
      - "Count the wrong pairs: 3 before 1 and 2, 6 before four numbers …"
      - Only swap neighbours where the larger number is on the left.
    explanation: 2 + 4 + 2 = 8 wrong pairs. Fewer neighbour swaps are impossible, more are not needed.
    difficulty: 2

  - kind: explain
    id: cs-d4
    depth: 2
    body: After round k, the k largest numbers sit at the far right – already sorted. This **invariant** explains why bubble sort is done after at most n − 1 rounds.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How many passes does bubble sort need on a list that is **already sorted** – if it stops as soon as nothing was swapped?
    params:
      options:
        - label: One
          correct: true
        - label: As many as there are elements
          feedback: Without a swap in the first pass it is done at once.
        - label: None
          feedback: It must look once to know.
    hints:
      - It only notices after one pass that there is nothing to do.
    explanation: Best case n, worst case n². An algorithm often has very different faces.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: A randomly shuffled row of n numbers has n · (n − 1) / 4 wrong pairs on average. How many is that for 100 numbers?
    answer:
      value: 2475
    hints:
      - Each pair is wrong with probability 1/2.
      - 100 · 99 / 4.
    explanation: 100 · 99 / 4 = 2475. Even on average bubble sort is quadratic – just half as bad as the worst case.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Bubble sort only swaps if the left number is strictly larger. What follows for equal numbers?
    params:
      options:
        - label: They keep their order – the method is stable
          correct: true
        - label: They get swapped at random
          feedback: Equal neighbours are never swapped.
        - label: The method gets stuck in a loop
          feedback: Without a swap it ends normally.
    hints:
      - What happens with two equal neighbours?
      - Can one 7 overtake another 7?
    explanation: Equal elements never pass each other. That matters if you sort by name first and then by city.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why bubble sort is sure to finish.
    params:
      keywords:
        - - größt
          - largest
          - biggest
        - - rechts
          - ende
          - right
          - end
        - - runde
          - durchgang
          - pass
          - round
      sample: In every round the largest unsorted number travels right to the end. After that it never needs touching again. After n − 1 rounds all numbers are in place.
    difficulty: 3

srs:
  cards_from: [paare, fuenf]
