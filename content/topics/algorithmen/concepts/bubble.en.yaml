id: cs.algorithms.bubble
type: concept
title: Hands-on bubble sort
summary: Swap neighbors until everything is in order.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: drei
    widget: swap
    prompt: Sort the bars from smallest to largest. You may only swap neighbors.
    params: { values: [3, 1, 2] }
    hints:
      - Swap the 3 to the right.
    explanation: Two swaps. The large number bubbles to the right.

  - kind: explain
    body: |
      **Bubble sort:** Walk from left to right. If a pair is the wrong way round, swap it.
      After each pass, the largest number is at the far right, like a rising bubble.

  - kind: problem
    id: fuenf
    widget: swap
    prompt: Sort with at most 7 neighbor swaps.
    params: { values: [5, 2, 4, 1, 3], maxSwaps: 7 }
    hints:
      - Only swap neighbors that are the wrong way round. Any other swap is wasted.
    explanation: Each pair that is the wrong way round needs exactly one swap. Here there are 7 such pairs.

  - kind: problem
    id: paare
    widget: numeric
    prompt: How many pairs in the row 2, 4, 1, 3 are the wrong way round?
    params: { unit: pairs }
    answer: { value: 3 }
    hints:
      - Check every pair. Is the larger number to the left of the smaller one?
    explanation: (2,1), (4,1) and (4,3). Bubble sort needs exactly 3 swaps here.

  - kind: explain
    body: Is bubble sort fast?
    reveal:
      body: Sadly, no. With n numbers there can be almost n² / 2 wrong pairs. For a million numbers, that is 500 billion swaps.

srs:
  cards_from: [paare, fuenf]
