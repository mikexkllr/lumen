id: cs.algorithms.bubble
type: concept
title: Hands-on bubble sort
summary: Swap neighbors until everything is in order.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: drei
    widget: swap
    prompt: Sort the bars from smallest to largest. You may only swap neighbors.
    params: { values: [3, 1, 2] }
    hints:
      - Swap the 3 to the right.
    explanation: Two swaps. The large number bubbles to the right.

  - kind: explain
    id: s2
    body: |
      **Bubble sort:** Walk from left to right. If a pair is the wrong way round, swap it.
      After each pass, the largest number is at the far right, like a rising bubble.

  - kind: problem
    id: fuenf
    widget: swap
    prompt: Sort with at most 7 neighbor swaps.
    params: { values: [5, 2, 4, 1, 3], maxSwaps: 7 }
    hints:
      - Only swap neighbors that are the wrong way round. Any other swap is wasted.
    explanation: Each pair that is the wrong way round needs exactly one swap. Here there are 7 such pairs.

  - kind: problem
    id: paare
    widget: numeric
    prompt: How many pairs in the row 2, 4, 1, 3 are the wrong way round?
    params: { unit: pairs }
    answer: { value: 3 }
    hints:
      - Check every pair. Is the larger number to the left of the smaller one?
    explanation: (2,1), (4,1) and (4,3). Bubble sort needs exactly 3 swaps here.

  - kind: explain
    id: s5
    body: Is bubble sort fast?
    reveal:
      body: Sadly, no. With n numbers there can be almost n² / 2 wrong pairs. For a million numbers, that is 500 billion swaps.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The row 5, 4, 3, 2, 1 is exactly reversed. How many neighbour swaps does bubble sort need?
    answer:
      value: 10
    hints:
      - "Every pair is out of order: 4 + 3 + 2 + 1."
    explanation: 10 swaps – as many as there are out-of-order pairs (**inversions**).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How many passes does bubble sort need on a list that is **already sorted** – if it stops as soon as nothing was swapped?
    params:
      options:
        - label: One
          correct: true
        - label: As many as there are elements
          feedback: Without a swap in the first pass it is done at once.
        - label: None
          feedback: It must look once to know.
    hints:
      - It only notices after one pass that there is nothing to do.
    explanation: Best case n, worst case n². An algorithm often has very different faces.
    difficulty: 3

srs:
  cards_from: [paare, fuenf]
