id: cs.algorithms.selection
type: concept
title: Tauschen mit Plan
summary: Jede Zahl direkt an ihren Platz.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wie sortierst du?
    body: Jeder Mensch sortiert anders – und Computer kennen Dutzende Wege. Deck die Karten auf. Welches **Verfahren** nutzt du selbst, wenn du Karten auf der Hand hast?
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🃏
            front: Karten auf der Hand
            back: Die meisten stecken jede neue Karte gleich an ihren Platz. Das heißt Einfügen.
          - icon: 📬
            front: Briefe nach Postleitzahl
            back: Erst nach der ersten Ziffer in zehn Fächer, dann jedes Fach weiter. So sortiert die Post.
          - icon: 📚
            front: Das Bücherregal
            back: "Wer umräumt, will wenig schleppen: Jedes Buch soll nur einmal wandern."
          - icon: 🗂️
            front: Der Stapel Rechnungen
            back: "Teilen, einzeln sortieren, wieder zusammenlegen: So bleibt es auch bei riesigen Stapeln schnell."

  - kind: problem
    id: frei
    widget: swap
    prompt: Jetzt darfst du beliebige Balken tauschen. Sortiere mit höchstens 3 Tauschen.
    params: { values: [4, 1, 3, 5, 2], adjacent: false, maxSwaps: 3 }
    hints:
      - Hol die kleinste Zahl direkt nach vorn.
      - Jeder Tausch sollte mindestens eine Zahl an ihren endgültigen Platz bringen.
    explanation: Kleinste nach vorn, dann die nächste … Jede Zahl landet mit einem Tausch an ihrem Platz.

  - kind: explain
    id: s2
    body: |
      **Selection-Sort:** Such die kleinste Zahl und tausche sie nach vorn. Dann die zweitkleinste auf Platz 2 – und so weiter.
      Das braucht höchstens n − 1 Tausche.

  - kind: problem
    id: sechs
    widget: swap
    prompt: Sortiere mit höchstens 4 Tauschen.
    params: { values: [6, 3, 8, 1, 5, 2], adjacent: false, maxSwaps: 4 }
    hints:
      - Wo muss die 1 hin? Und welche Zahl steht dort gerade?
    explanation: Mit vier gezielten Tauschen steht alles. Manche Tausche bringen sogar zwei Zahlen an ihren Platz.

  - kind: problem
    id: hoechstens
    widget: numeric
    prompt: Wie viele Tausche braucht Selection-Sort höchstens für {{n}} Zahlen?
    params: { unit: Tausche }
    answer: { value: "{{n - 1}}" }
    feedback:
      - when: "numval(state.input) == n"
        misconception: off-by-one
        text: Die letzte Zahl steht automatisch richtig, wenn alle anderen passen.
    hints:
      - Ist die vorletzte Zahl richtig, ist es auch die letzte.
    explanation: "{{n}} − 1 = {{n - 1}}."
    variants:
      params: { n: "int[5,30]" }
      defaults: { n: 10 }

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Was zählt beim Sortieren am Computer meist mehr – Tausche oder Vergleiche?
    params:
      options:
        - { label: "Vergleiche – man muss erst suchen, was wohin gehört", correct: true }
        - { label: Nur die Tausche, feedback: "Selection-Sort tauscht wenig, vergleicht aber sehr oft." }
    hints:
      - Wie findet Selection-Sort die kleinste Zahl?
    explanation: Das Suchen kostet. Selection-Sort vergleicht fast n² / 2 Mal.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Selection-Sort sucht in jeder Runde das kleinste verbleibende Element. Wie viele Vergleiche braucht er insgesamt für 6 Zahlen?
    answer:
      value: 15
    hints:
      - 5 + 4 + 3 + 2 + 1.
    explanation: 15 Vergleiche – aber höchstens 5 Tausche. Wenig schreiben, viel lesen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: Wie viele Vergleiche braucht Selection-Sort für {{n}} Zahlen?
    answer:
      value: "{{n * (n - 1) / 2}}"
    feedback:
      - when: numval(state.input) == n - 1
        misconception: swaps-vs-comparisons
        text: Das ist die Zahl der Tausche. Für jedes Minimum muss man aber viele Zahlen vergleichen.
    hints:
      - Runde 1 vergleicht {{n - 1}}-mal, Runde 2 einmal weniger.
      - "{{n - 1}} + {{n - 2}} + … + 1."
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}} Vergleiche – immer, auch wenn die Liste schon sortiert ist."
    difficulty: 2
    variants:
      params:
        n: int[5,20]
      defaults:
        n: 10

  - kind: problem
    id: cs-d2
    depth: 2
    widget: order
    prompt: Selection-Sort auf 5, 3, 4, 1, 2. Wie sieht die Liste nach zwei Runden aus?
    params:
      items:
        - label: "1"
        - label: "2"
        - label: "4"
        - label: "5"
        - label: "3"
      direction: horizontal
    hints:
      - "Runde 1: Die 1 tauscht mit der 5."
      - "Runde 2: Die 2 tauscht mit dem, was auf Platz 2 steht."
    explanation: "Runde 1: 1, 3, 4, 5, 2. Runde 2: Die 2 tauscht mit der 3: 1, 2, 4, 5, 3. Vorn wächst der sortierte Teil."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Wie viele Vergleiche braucht Selection-Sort bei einer Liste, die schon sortiert ist?
    params:
      options:
        - label: Genauso viele wie sonst – er sucht jedes Minimum vollständig
          correct: true
        - label: Keinen
          feedback: Woher sollte er wissen, dass sie sortiert ist?
        - label: n − 1
          feedback: So viele braucht ein einziger Kontrolldurchlauf – Selection-Sort macht aber keinen.
    hints:
      - Woher weiß er, dass die vorderste Zahl das Minimum ist?
      - Nur durch Vergleichen mit allen anderen.
    explanation: Selection-Sort merkt nicht, dass nichts zu tun ist. Er braucht immer n · (n − 1) / 2 Vergleiche.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wann ist ein Sortierverfahren **stabil**?
    params:
      options:
        - label: Wenn gleiche Elemente ihre ursprüngliche Reihenfolge behalten
          correct: true
        - label: Wenn es nie abstürzt
          feedback: Das ist mit »stabil« hier nicht gemeint.
        - label: Wenn es immer gleich lange dauert
          feedback: Es geht um die Reihenfolge gleicher Schlüssel.
    hints:
      - Du sortierst erst nach Vorname, dann nach Nachname. Was soll bei gleichem Nachnamen gelten?
    explanation: Mit stabilen Verfahren kann man nacheinander nach mehreren Spalten sortieren. Selection-Sort ist nicht stabil.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: Beim **Insertion-Sort** nimmt man eine Karte nach der anderen und schiebt sie an ihren Platz im schon sortierten Teil – wie beim Kartenspielen. Bei fast sortierten Listen ist er sehr schnell.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Insertion-Sort bekommt eine schon sortierte Liste mit 100 Zahlen. Wie viele Vergleiche braucht er?
    answer:
      value: 99
    feedback:
      - when: numval(state.input) == 4950
        misconception: worst-case
        text: Das wäre der schlimmste Fall. Hier passt jede Karte sofort.
    hints:
      - Jede neue Karte wird mit ihrem linken Nachbarn verglichen.
      - Passt sie, ist sie fertig. Wie viele neue Karten gibt es?
    explanation: 99 Vergleiche, kein einziger Tausch. Darum nutzen schnelle Sortierverfahren für kleine Stücke oft Insertion-Sort.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Selection-Sort auf 2a, 2b, 1 (zwei gleiche Zweien, a vor b). Was kommt heraus?
    params:
      options:
        - label: 1, 2b, 2a – die Zweien sind vertauscht
          correct: true
        - label: 1, 2a, 2b
          feedback: Die 1 tauscht mit dem vordersten Element. Wohin wandert 2a?
        - label: 2a, 2b, 1
          feedback: Die 1 ist das Minimum und muss nach vorn.
    hints:
      - "Runde 1: Die 1 tauscht mit dem vordersten Element."
      - Das vorderste Element ist 2a. Es springt ans Ende.
    explanation: Der weite Sprung reißt 2a an 2b vorbei. Selection-Sort ist also nicht stabil – anders als Bubble- und Insertion-Sort.
    difficulty: 3

srs:
  cards_from: [hoechstens, vergleich]
