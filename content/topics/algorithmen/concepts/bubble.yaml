id: cs.algorithms.bubble
type: concept
title: Bubble-Sort zum Anfassen
summary: Nachbarn tauschen, bis alles stimmt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: drei
    widget: swap
    prompt: Sortiere die Balken von klein nach groß. Du darfst nur Nachbarn tauschen.
    params: { values: [3, 1, 2] }
    hints:
      - Tausche die 3 nach rechts.
    explanation: Zwei Tausche – die große Zahl blubbert nach rechts.

  - kind: explain
    id: s2
    body: |
      **Bubble-Sort:** Geh von links nach rechts. Steht ein Paar falsch herum, tausche es.
      Nach jeder Runde ist die größte Zahl ganz rechts – wie eine aufsteigende Blase.

  - kind: problem
    id: fuenf
    widget: swap
    prompt: Sortiere mit höchstens 7 Nachbar-Tauschen.
    params: { values: [5, 2, 4, 1, 3], maxSwaps: 7 }
    hints:
      - Tausche nur Nachbarn, die falsch herum stehen. Jeder andere Tausch ist verschwendet.
    explanation: Jedes falsch herum stehende Paar braucht genau einen Tausch. Hier gibt es 7 solche Paare.

  - kind: problem
    id: paare
    widget: numeric
    prompt: Wie viele Paare stehen in der Reihe 2, 4, 1, 3 falsch herum?
    params: { unit: Paare }
    answer: { value: 3 }
    hints:
      - Prüfe jedes Paar – steht die größere Zahl links von der kleineren?
    explanation: (2,1), (4,1) und (4,3). Bubble-Sort braucht hier genau 3 Tausche.

  - kind: explain
    id: s5
    body: Ist Bubble-Sort schnell?
    reveal:
      body: Leider nein. Bei n Zahlen kann es fast n² / 2 falsche Paare geben. Für eine Million Zahlen wären das 500 Milliarden Tausche.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Reihe 5, 4, 3, 2, 1 steht genau falsch herum. Wie viele Nachbar-Tausche braucht Bubble-Sort?
    answer:
      value: 10
    hints:
      - "Jedes Paar steht falsch: 4 + 3 + 2 + 1."
    explanation: 10 Tausche – so viele, wie es falsche Paare (**Inversionen**) gibt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie viele Durchgänge braucht Bubble-Sort bei einer Liste, die **schon sortiert** ist – wenn er aufhört, sobald nichts getauscht wurde?
    params:
      options:
        - label: Einen
          correct: true
        - label: So viele wie Elemente
          feedback: Ohne Tausch im ersten Durchgang ist er sofort fertig.
        - label: Keinen
          feedback: Er muss einmal nachsehen, um das zu wissen.
    hints:
      - Er merkt erst nach einem Durchgang, dass nichts zu tun ist.
    explanation: Bester Fall n, schlimmster Fall n². Ein Algorithmus hat oft sehr verschiedene Gesichter.
    difficulty: 3

srs:
  cards_from: [paare, fuenf]
