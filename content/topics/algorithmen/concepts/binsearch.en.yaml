id: cs.algorithms.binsearch
type: concept
title: Halve instead of scan
summary: Binary search in a few steps.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: erster
    widget: choice
    prompt: I'm thinking of a number from 1 to 100. You only hear "higher" or "lower". What do you guess first?
    params:
      options:
        - { label: "50", correct: true }
        - { label: "1", feedback: "Then in the worst case you rule out only one number." }
        - { label: "99", feedback: "If the answer is “lower”, 98 numbers are still left." }
    hints:
      - Which guess rules out the most numbers in every case?
    explanation: The middle halves the search space, whatever the answer is.

  - kind: explain
    id: s2
    body: |
      **Binary search:** Always ask in the middle. Each answer halves what is left. That way you can find anything in a sorted list very fast.

  - kind: problem
    id: schritte
    widget: numeric
    prompt: The number lies between 1 and {{2 ** k - 1}}. How many guesses do you need at most?
    params: { unit: guesses }
    answer: { value: "{{k}}" }
    hints:
      - 1 guess is enough for 1 number, 2 for 3 numbers, 3 for 7 numbers …
    explanation: "With {{k}} guesses you cover $2^{ {{k}} } - 1 = {{2 ** k - 1}}$ numbers."
    variants:
      params: { k: "int[4,10]" }
      defaults: { k: 7 }

  - kind: problem
    id: telefonbuch
    widget: choice
    prompt: A sorted list has a million names. About how many steps does binary search need?
    params:
      options:
        - { label: "20", correct: true }
        - { label: "1000", feedback: "Far fewer. Each step halves the list." }
        - { label: "500,000", feedback: "That is the average if you start at the front." }
    hints:
      - $2^{10}$ is about a thousand, $2^{20}$ about a million.
    explanation: Halving twenty times is enough for a million. That is the power of the logarithm.

  - kind: problem
    id: mix-c1
    widget: estimate
    prompt: "Take a guess: how many comparisons does binary search need at most in a sorted list of a million names?"
    params:
      min: 1
      max: 200
    answer:
      value: 20
      tolerance: 4
    explanation: Only 20, since 2²⁰ is a good million.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In the sorted list 3, 8, 12, 17, 21, 30, 44 you look for 30. How many comparisons does binary search need?
    answer:
      value: 2
    hints:
      - The middle is 17. Then the middle of the right half.
    explanation: First 17 (too small), then 30 – found.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: order
    prompt: You look for 52 in 2, 5, 8, 11, 17, 23, 31, 40, 52. The middle is rounded down. Put the numbers you look at in order.
    params:
      items:
        - label: "17"
        - label: "31"
        - label: "40"
        - label: "52"
      direction: horizontal
    hints:
      - The middle of the 9 numbers is the 5th.
      - Then 23 to 52 is left – its middle, rounded down?
    explanation: 17 → go right, 31 → go right, 40 → go right, 52. Four comparisons for nine numbers.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Now you look for 20 in the same list. After how many comparisons do you know for sure that it is missing?
    answer:
      value: 3
    hints:
      - First 17, then to the right the middle of 23 to 52.
      - After 17, 31 and 23 the range is empty.
    explanation: 17 is too small, 31 too big, 23 too big – nothing is left between 17 and 23. A failed search also takes only log₂ n steps.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: The list 3, 7, 7, 7, 9 contains 7 three times. Simple search finds some 7. How do you find the first one?
    params:
      options:
        - label: On a hit, do not stop but keep searching to the left
          correct: true
        - label: Walk left step by step from the hit
          feedback: That works but can get linearly slow with many equal values.
        - label: It cannot be done
          feedback: It can – with a small change to the search.
    hints:
      - What do you know about the first 7 after a hit?
      - It is here or further left.
    explanation: You remember the hit and keep halving to the left. That keeps it at log₂ n steps. Libraries often call this lower_bound.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Binary search stood incorrectly in textbooks and libraries for years. Where was the bug?
    params:
      options:
        - label: (left + right) / 2 overflows the number range for huge lists
          correct: true
        - label: It only worked for even lengths
          feedback: Odd lengths were never a problem.
        - label: It compared in the wrong order
          feedback: The logic was right – the midpoint calculation was not.
    hints:
      - What happens if left + right exceeds the largest storable number?
    explanation: Correct is left + (right − left) / 2. Even simple algorithms hide traps.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Halving works without a list too. We want √2 between 1 and 2: is 1.5² too big? Yes, so √2 is to the left. Every question halves the interval. This is called **bisection**."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: How many halvings does bisection need to pin √2 between 1 and 2 down to within 0.001?
    answer:
      value: 10
    hints:
      - After k halvings the interval is $1/2^k$ wide.
      - $2^{10}$ = 1024.
    explanation: $1/2^{10}$ ≈ 0.00098 < 0.001. Ten questions for three decimal places – computers use this to solve equations.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Is binary search worth it in a linked list where each element only knows its successor?
    params:
      options:
        - label: No – reaching the middle already means walking half the list
          correct: true
        - label: Yes, just like in an array
          feedback: In an array you jump straight to the middle, here you cannot.
        - label: Only if the list is short
          feedback: Walking gets expensive precisely for long lists.
    hints:
      - How do you reach the middle link of a chain?
      - The search needs direct access.
    explanation: Binary search needs O(1) jumps. For linked data you use search trees.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why binary search only works on sorted lists.
    params:
      keywords:
        - - sortiert
          - sorted
          - ordnung
          - order
        - - mitte
          - middle
        - - hälfte
          - halb
          - half
          - ausschließ
          - rule out
          - wegfallen
          - discard
      sample: "I look in the middle. Because the list is sorted, I know: if the target is bigger it can only be on the right. The whole left half drops out. Without order I could not know that."
    difficulty: 3

srs:
  cards_from: [schritte, telefonbuch]
