id: cs.algorithms.merge
type: concept
title: Divide and conquer
summary: Merge sort – sorting by merging.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zusammen
    widget: choice
    prompt: Two sorted piles – 2, 5, 8 and 1, 6, 9. Which card do you put on the new pile first?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "2", feedback: "Compare the top cards of both piles." }
        - { label: "9", feedback: "We sort in ascending order, so the smallest comes first." }
    hints:
      - The smallest card is on top of one of the piles.
    explanation: You only compare the two top cards. That makes merging fast.

  - kind: explain
    body: |
      **Merge sort:** Split the pile until every card is alone. Then keep merging two sorted piles into one, until everything is a single pile again.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the steps of merge sort for 8 cards in the right order.
    params:
      items:
        - { label: Halve until every card is alone }
        - { label: Sort cards into pairs }
        - { label: Merge pairs into piles of four }
        - { label: Merge the two piles of four }
    hints:
      - First split, then merge from small to large.
    explanation: First break it all apart, then merge pile by pile.

  - kind: problem
    id: ebenen
    widget: numeric
    prompt: How many times do you have to halve {{2 ** k}} cards until each is alone?
    params: { unit: times }
    answer: { value: "{{k}}" }
    hints:
      - "{{2 ** k}} → {{2 ** (k - 1)}} → … → 1."
    explanation: "$2^{ {{k}} } = {{2 ** k}}$, so {{k}} times. That is why merge sort is so fast."
    variants:
      params: { k: "int[3,10]" }
      defaults: { k: 4 }

srs:
  cards_from: [zusammen, ebenen]
