id: cs.algorithms.merge
type: concept
title: Teile und herrsche
summary: Mergesort – sortieren durch Zusammenlegen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zusammen
    widget: choice
    prompt: Zwei sortierte Stapel – 2, 5, 8 und 1, 6, 9. Welche Karte legst du als erste auf den neuen Stapel?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "2", feedback: "Vergleiche die obersten Karten beider Stapel." }
        - { label: "9", feedback: "Wir sortieren aufsteigend – erst die kleinste." }
    hints:
      - Die kleinste Karte liegt oben auf einem der Stapel.
    explanation: Man vergleicht nur die beiden obersten Karten. Das macht das Zusammenlegen schnell.

  - kind: explain
    body: |
      **Mergesort:** Teile den Stapel, bis jede Karte allein liegt. Dann lege immer zwei sortierte Stapel zusammen – bis alles wieder ein Stapel ist.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Schritte von Mergesort für 8 Karten in die richtige Reihenfolge.
    params:
      items:
        - { label: Halbieren bis jede Karte allein liegt }
        - { label: Je zwei Karten zu Paaren sortieren }
        - { label: Je zwei Paare zu Viererstapeln legen }
        - { label: Die beiden Viererstapel zusammenlegen }
    hints:
      - Erst teilen, dann von klein nach groß zusammenlegen.
    explanation: Erst ganz zerlegen, dann Stapel für Stapel zusammenlegen.

  - kind: problem
    id: ebenen
    widget: numeric
    prompt: Wie oft muss man {{2 ** k}} Karten halbieren, bis jede allein liegt?
    params: { unit: Mal }
    answer: { value: "{{k}}" }
    hints:
      - "{{2 ** k}} → {{2 ** (k - 1)}} → … → 1."
    explanation: "$2^{ {{k}} } = {{2 ** k}}$ – also {{k}} Mal. Darum ist Mergesort so schnell."
    variants:
      params: { k: "int[3,10]" }
      defaults: { k: 4 }

srs:
  cards_from: [zusammen, ebenen]
