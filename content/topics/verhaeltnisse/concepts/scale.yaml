id: math.ratios.scale
type: concept
title: Maßstab
summary: Karten und Modelle richtig lesen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wäre die Erde ein Fußball (22 cm), wie viele Meter wäre der Mond entfernt?"
    params:
      min: 0
      max: 50
      unit: m
    answer:
      value: 6.6
      tolerance: 2
    explanation: "Der Mond ist 30 Erddurchmesser entfernt: 30 · 22 cm = 6,6 m."

  - kind: problem
    id: karte
    widget: numeric
    prompt: "Eine Wanderkarte hat den Maßstab 1 : 25 000. Auf der Karte sind es 4 cm. Wie weit ist das in Wirklichkeit?"
    params: { unit: km }
    answer: { value: 1 }
    feedback:
      - when: "numval(state.input) == 100000"
        misconception: units
        text: 100 000 cm stimmt. Rechne noch in Kilometer um.
    hints:
      - 4 cm · 25 000 = 100 000 cm.
    explanation: 100 000 cm sind 1000 m – also genau 1 km.

  - kind: explain
    id: s2
    body: |
      **Maßstab 1 : n** heißt: 1 cm auf dem Plan sind n cm in echt.
      Bei 1 : 100 000 ist 1 cm also 1 km.

  - kind: problem
    id: strecke
    widget: numeric
    prompt: "Maßstab 1 : {{m}}. Auf dem Plan misst du {{c}} cm. Wie viele Meter sind das in echt?"
    params: { unit: m }
    answer: { value: "{{c * m / 100}}" }
    hints:
      - "{{c}} · {{m}} ergibt Zentimeter. Teile durch 100 für Meter."
    explanation: "{{c}} · {{m}} = {{c * m}} cm = {{c * m / 100}} m."
    variants:
      params: { m: "choice[500,1000,5000,10000]", c: "int[2,9]" }
      defaults: { m: 1000, c: 3 }

  - kind: problem
    id: modell
    widget: choice
    prompt: "Ein Modellauto ist im Maßstab 1 : 18 gebaut und 25 cm lang. Wie lang ist das echte Auto?"
    params:
      options:
        - { label: "4,5 m", correct: true }
        - { label: "1,8 m", feedback: "Das ist zu kurz für ein Auto. Rechne 25 cm · 18." }
        - { label: 45 m, feedback: "Zu lang – 25 · 18 = 450 cm." }
    hints:
      - 25 cm · 18.
    explanation: 25 · 18 = 450 cm = 4,5 m.

  - kind: explain
    id: s5
    body: Warum steht bei Karten oft ein Strich mit »1 km« statt einer Zahl?
    reveal:
      body: "Der Strich wächst beim Kopieren und Zoomen mit. Die Zahl 1 : 25 000 stimmt nach dem Vergrößern nicht mehr."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Zimmer ist auf dem Plan (1 : 50) 8 cm mal 6 cm groß. Wie viele Quadratmeter hat es wirklich?"
    params:
      unit: m²
    answer:
      value: 12
    hints:
      - "Rechne erst beide Längen um: 8 cm · 50 und 6 cm · 50."
    explanation: 4 m · 3 m = 12 m².
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "Maßstab 1 : {{m}}. Ein Zimmer ist in echt {{L}} m lang. Wie viele Zentimeter sind das auf dem Plan?"
    params:
      unit: cm
    answer:
      value: "{{L * 100 / m}}"
    feedback:
      - when: numval(state.input) == L * m
        misconception: wrong-direction
        text: Auf dem Plan wird es kleiner, nicht größer. Teile durch {{m}}.
      - when: numval(state.input) == L / m
        misconception: units
        text: "Erst in Zentimeter umrechnen: {{L}} m = {{L * 100}} cm."
    hints:
      - "{{L}} m sind {{L * 100}} cm."
      - Teile durch {{m}}.
    explanation: "{{L * 100}} cm : {{m}} = {{L * 100 / m}} cm."
    difficulty: 2
    variants:
      params:
        m: choice[50,100,200]
        L: int[2,12]
      defaults:
        m: 50
        L: 4

  - kind: problem
    id: ma-d2
    depth: 2
    widget: choice
    prompt: Welche Karte zeigt mehr Einzelheiten?
    params:
      options:
        - label: "1 : 25 000"
          correct: true
        - label: "1 : 100 000"
          feedback: Hier ist 1 cm schon 1 km – die Karte zeigt weniger Details.
    hints:
      - Wie viele echte Meter stehen für 1 cm?
      - "Weniger Meter pro cm heißt: Alles erscheint größer."
    explanation: "Bei 1 : 25 000 ist 1 cm nur 250 m. Alles wird viermal so groß gezeichnet wie bei 1 : 100 000."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Beim Maßstab 1 : 50 – mit welchem Faktor wachsen **Flächen**?"
    params:
      options:
        - label: "2500"
          correct: true
        - label: "50"
          feedback: Das gilt nur für Längen. Flächen haben zwei Richtungen.
        - label: "100"
          feedback: 50 · 50 ist mehr.
    hints:
      - Eine Fläche wächst in Länge **und** Breite.
    explanation: Längen mal k, Flächen mal k², Volumen mal k³. Darum wiegt ein doppelt so großes Tier achtmal so viel.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Längen wachsen mit dem Faktor k, Flächen mit $k^2$, Volumen mit $k^3$. Das ist das **Quadrat-Würfel-Gesetz**. Darum kann ein Riese nicht einfach ein vergrößerter Mensch sein: Sein Gewicht wächst schneller als seine Knochen."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Ein Modellauto im Maßstab 1 : 10. Der echte Tank fasst 50 Liter. Wie viele Milliliter fasst der Modelltank?"
    params:
      unit: ml
    answer:
      value: 50
    feedback:
      - when: numval(state.input) == 5000
        misconception: linear-scaling
        text: Das ist nur durch 10. Volumen schrumpfen mit 10 · 10 · 10.
      - when: numval(state.input) == 500
        misconception: area-scaling
        text: Das ist durch 100 – wie bei Flächen. Volumen braucht durch 1000.
    hints:
      - Länge, Breite und Höhe werden je durch 10 geteilt.
      - "50 Liter : 1000 = ?"
    explanation: "50 L : 1000 = 0,05 L = 50 ml."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Ein Tier würde in allen Richtungen doppelt so groß. Um welchen Faktor wächst die Last pro Fläche Knochenquerschnitt?
    answer:
      value: 2
    hints:
      - "Gewicht ~ Volumen: Faktor 8. Querschnitt ~ Fläche: Faktor 4."
      - "8 : 4 = ?"
    explanation: Die Last pro Fläche verdoppelt sich. Große Tiere brauchen darum viel dickere Beine – wie Elefanten.
    difficulty: 3

srs:
  cards_from: [strecke, karte]
