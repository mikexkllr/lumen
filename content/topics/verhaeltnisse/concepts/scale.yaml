id: math.ratios.scale
type: concept
title: Maßstab
summary: Karten und Modelle richtig lesen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wäre die Erde ein Fußball (22 cm), wie viele Meter wäre der Mond entfernt?"
    params:
      min: 0
      max: 50
      unit: m
    answer:
      value: 6.6
      tolerance: 2
    explanation: "Der Mond ist 30 Erddurchmesser entfernt: 30 · 22 cm = 6,6 m."


  - kind: problem
    id: karte
    widget: numeric
    prompt: "Eine Wanderkarte hat den Maßstab 1 : 25 000. Auf der Karte sind es 4 cm. Wie weit ist das in Wirklichkeit?"
    params: { unit: km }
    answer: { value: 1 }
    feedback:
      - when: "numval(state.input) == 100000"
        misconception: units
        text: 100 000 cm stimmt. Rechne noch in Kilometer um.
    hints:
      - 4 cm · 25 000 = 100 000 cm.
    explanation: 100 000 cm sind 1000 m – also genau 1 km.

  - kind: explain
    id: s2
    body: |
      **Maßstab 1 : n** heißt: 1 cm auf dem Plan sind n cm in echt.
      Bei 1 : 100 000 ist 1 cm also 1 km.

  - kind: problem
    id: strecke
    widget: numeric
    prompt: "Maßstab 1 : {{m}}. Auf dem Plan misst du {{c}} cm. Wie viele Meter sind das in echt?"
    params: { unit: m }
    answer: { value: "{{c * m / 100}}" }
    hints:
      - "{{c}} · {{m}} ergibt Zentimeter. Teile durch 100 für Meter."
    explanation: "{{c}} · {{m}} = {{c * m}} cm = {{c * m / 100}} m."
    variants:
      params: { m: "choice[500,1000,5000,10000]", c: "int[2,9]" }
      defaults: { m: 1000, c: 3 }

  - kind: problem
    id: modell
    widget: choice
    prompt: "Ein Modellauto ist im Maßstab 1 : 18 gebaut und 25 cm lang. Wie lang ist das echte Auto?"
    params:
      options:
        - { label: "4,5 m", correct: true }
        - { label: "1,8 m", feedback: "Das ist zu kurz für ein Auto. Rechne 25 cm · 18." }
        - { label: 45 m, feedback: "Zu lang – 25 · 18 = 450 cm." }
    hints:
      - 25 cm · 18.
    explanation: 25 · 18 = 450 cm = 4,5 m.

  - kind: explain
    id: s5
    body: Warum steht bei Karten oft ein Strich mit »1 km« statt einer Zahl?
    reveal:
      body: "Der Strich wächst beim Kopieren und Zoomen mit. Die Zahl 1 : 25 000 stimmt nach dem Vergrößern nicht mehr."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Zimmer ist auf dem Plan (1 : 50) 8 cm mal 6 cm groß. Wie viele Quadratmeter hat es wirklich?"
    params:
      unit: m²
    answer:
      value: 12
    hints:
      - "Rechne erst beide Längen um: 8 cm · 50 und 6 cm · 50."
    explanation: 4 m · 3 m = 12 m².
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Beim Maßstab 1 : 50 – mit welchem Faktor wachsen **Flächen**?"
    params:
      options:
        - label: "2500"
          correct: true
        - label: "50"
          feedback: Das gilt nur für Längen. Flächen haben zwei Richtungen.
        - label: "100"
          feedback: 50 · 50 ist mehr.
    hints:
      - Eine Fläche wächst in Länge **und** Breite.
    explanation: Längen mal k, Flächen mal k², Volumen mal k³. Darum wiegt ein doppelt so großes Tier achtmal so viel.
    difficulty: 3

srs:
  cards_from: [strecke, karte]
