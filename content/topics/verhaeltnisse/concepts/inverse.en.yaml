id: math.ratios.inverse
type: concept
title: Inverse proportion
summary: More people, less time.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The party pizza
    body: More guests, smaller slices – you know that from every party. Split the pizza for 2, 4 or 8 people and shade one slice each time. Twice as many people each get only **half as much**.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 2
        shape: circle
        shaded:
          - 0
        partOptions:
          - 2
          - 4
          - 8

  - kind: problem
    id: maler
    widget: numeric
    prompt: 3 painters need 12 days for a house. How long do 4 painters need, if all work at the same speed?
    params: { unit: days }
    answer: { value: 9 }
    feedback:
      - when: "numval(state.input) == 16"
        misconception: proportional
        text: More painters finish sooner, not later.
    hints:
      - How long would a single painter need?
    explanation: One painter would need 36 days. Four share it – 9 days.

  - kind: explain
    id: s2
    body: |
      **Inversely proportional** means: twice as much of one quantity, half as much of the other.
      The product stays the same – here 3 · 12 = 4 · 9 = 36.

  - kind: problem
    id: art
    widget: buckets
    prompt: Proportional or inversely proportional?
    params:
      buckets: [{ label: proportional }, { label: inversely proportional }]
      items:
        - { label: Kilos of apples and price, bucket: proportional }
        - { label: Time and distance at one speed, bucket: proportional }
        - { label: Speed and time for one trip, bucket: inversely proportional }
        - { label: Helpers and duration of a job, bucket: inversely proportional }
        - { label: Guests and slices per guest, bucket: inversely proportional }
    hints:
      - When one quantity grows, does the other grow or shrink?
    explanation: With proportional quantities, both grow together. With inverse proportion, the product stays the same.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: At {{v}} km/h, a trip takes {{t}} hours. How long does it take at {{w}} km/h?
    params: { unit: hours }
    answer: { value: "{{v * t / w}}" }
    hints:
      - "The distance is {{v * t}} km."
    explanation: "{{v * t}} km : {{w}} km/h = {{v * t / w}} h."
    variants:
      params: { v: "choice[60,80,100]", t: "choice[2,3,6]", w: "choice[40,120,150]" }
      constraints: ["(v * t) % w == 0"]
      defaults: { v: 60, t: 2, w: 120 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Fuel and distance driven
          right: true
        - text: Speed and travel time for the same distance
          right: false
        - text: Number of guests and cake per guest
          right: false
        - text: Hours worked and pay
          right: true
      left: Inverse
      right: Direct

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: "Inverse proportion hands-on: on the left are 6 kg at 1 m. On the right you only have 2 kg. How far out must you slide them?"
    params:
      scene: lever
      controls:
        m1:
          value: 6
          fixed: true
        d1:
          value: 1
          fixed: true
        m2:
          value: 2
          fixed: true
    answer:
      tilt: 0
    explanation: 3 m. A third of the mass needs three times the distance.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A supply lasts 12 horses 15 days. After 5 days 8 more horses arrive. How many days does the rest last?
    answer:
      value: 6
    hints:
      - After 5 days 12 · 10 = 120 daily rations are left.
    explanation: 120 rations for 20 horses last 6 days.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: rect
    prompt: A flower bed must always be 24 m². Drag it so that it is 6 m wide.
    params:
      maxW: 12
      maxH: 8
      w: 3
      h: 2
    check:
      predicate: area == 24 && w == 6
    hints:
      - Width times height must make 24.
      - "24 : 6 = ?"
    explanation: "6 × 4 = 24. At 3 m wide it would be 8 m high: double the width, half the height."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: slider
    prompt: "Inversely proportional means y = k : x. Set k so that the curve passes through the point."
    params:
      expr: k/x
      x:
        - 1
        - 8
      y:
        - 0
        - 12
      showCoordinates: true
      sliders:
        - id: k
          label: k
          min: 4
          max: 24
          step: 2
          initial: 6
      markers:
        - x: 4
          y: 3
          label: P
    answer:
      values:
        k: 12
    hints:
      - For inverse proportion, the product x · y stays the same.
      - 4 · 3 = ?
    explanation: "k = 4 · 3 = 12. The curve is a hyperbola: it gets ever closer to the axes but never touches them."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: With 5 people the food lasts 12 days. How long does it last for 4 people?
    params:
      unit: days
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 9.6
        misconception: proportional-instead
        text: Fewer people eat less – the food lasts longer, not shorter.
    hints:
      - How many »person-days« of food are there?
      - 5 · 12 = 60.
    explanation: "5 · 12 = 60 person-days. 60 : 4 = 15 days."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What does the graph of an inverse proportion look like?
    params:
      options:
        - label: A hyperbola – it approaches the axes but never touches them
          correct: true
        - label: A falling straight line
          feedback: A line would eventually hit the axis. Here x · y stays constant.
        - label: A rising line through the origin
          feedback: That is direct proportion.
    hints:
      - We have y = k / x. What happens for very large x?
    explanation: y = k/x never becomes zero and is undefined for x = 0.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: more people, less time. What stays the same there – and what is different with “the more, the more”?"
    params:
      keywords:
        - - doppelt
          - verdoppel
          - double
          - twice
        - - halb
          - hälfte
          - half
          - halve
        - - produkt
          - product
          - konstant
          - constant
          - verhältnis
          - quotient
          - ratio
      sample: "Direct: if one quantity doubles, so does the other, and the quotient stays equal. Inverse: the other halves, and the product stays constant."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: x and y are inversely proportional. x grows by 25 %. By what percentage does y fall?
    params:
      unit: "%"
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 25
        misconception: symmetric-percent
        text: Times 1.25 is balanced by dividing by 1.25 – that is times 0.8.
    hints:
      - y is divided by 1.25.
      - "1 : 1.25 = 0.8."
    explanation: y is multiplied by 0.8 – it falls by 20 %, not 25 %.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: "For sound: speed = wavelength · frequency. A tone has double the frequency. What happens to the wavelength?"
    params:
      options:
        - label: The product has to stay the same.
          feedback: Das Produkt muss gleich bleiben.
        - label: It halves
          correct: true
        - label: Then the speed would double.
          feedback: Dann wäre die Geschwindigkeit doppelt so hoch.
    hints:
      - The speed of sound in air stays the same.
      - Double times half gives the same.
    explanation: At fixed speed, wavelength and frequency are inversely proportional. One octave up means half the wavelength.
    difficulty: 3

srs:
  cards_from: [maler, tempo]
