id: math.ratios.inverse
type: concept
title: Inverse proportion
summary: More people, less time.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: maler
    widget: numeric
    prompt: 3 painters need 12 days for a house. How long do 4 painters need, if all work at the same speed?
    params: { unit: days }
    answer: { value: 9 }
    feedback:
      - when: "numval(state.input) == 16"
        misconception: proportional
        text: More painters finish sooner, not later.
    hints:
      - How long would a single painter need?
    explanation: One painter would need 36 days. Four share it – 9 days.

  - kind: explain
    body: |
      **Inversely proportional** means: twice as much of one quantity, half as much of the other.
      The product stays the same – here 3 · 12 = 4 · 9 = 36.

  - kind: problem
    id: art
    widget: buckets
    prompt: Proportional or inversely proportional?
    params:
      buckets: [{ label: proportional }, { label: inversely proportional }]
      items:
        - { label: Kilos of apples and price, bucket: proportional }
        - { label: Time and distance at one speed, bucket: proportional }
        - { label: Speed and time for one trip, bucket: inversely proportional }
        - { label: Helpers and duration of a job, bucket: inversely proportional }
        - { label: Guests and slices per guest, bucket: inversely proportional }
    hints:
      - When one quantity grows, does the other grow or shrink?
    explanation: With proportional quantities, both grow together. With inverse proportion, the product stays the same.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: At {{v}} km/h, a trip takes {{t}} hours. How long does it take at {{w}} km/h?
    params: { unit: hours }
    answer: { value: "{{v * t / w}}" }
    hints:
      - "The distance is {{v * t}} km."
    explanation: "{{v * t}} km : {{w}} km/h = {{v * t / w}} h."
    variants:
      params: { v: "choice[60,80,100]", t: "choice[2,3,6]", w: "choice[40,120,150]" }
      constraints: ["(v * t) % w == 0"]
      defaults: { v: 60, t: 2, w: 120 }

srs:
  cards_from: [maler, tempo]
