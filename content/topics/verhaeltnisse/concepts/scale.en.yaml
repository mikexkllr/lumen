id: math.ratios.scale
type: concept
title: Scale
summary: Reading maps and models correctly.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Big and small to scale
    body: "Maps, models, floor plans: everything is smaller than in real life – or even bigger. Uncover the cards in any order. The **scale** tells you how much smaller or bigger."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚂
            front: "Model railway 1 : 87"
            back: A real 26 m carriage shrinks to 30 cm.
          - icon: 🗺️
            front: "Road map 1 : 200,000"
            back: 1 cm on the map is 2 km on the road.
          - icon: 🏠
            front: "Floor plan 1 : 100"
            back: 1 cm on the plan is 1 m in the house – handy for arranging furniture.
          - icon: 🔬
            front: A cell in a textbook
            back: "Often at a scale of 1000 : 1 – a scale can enlarge too."

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: if the Earth were a football (22 cm), how many metres away would the Moon be?"
    params:
      min: 0
      max: 50
      unit: m
    answer:
      value: 6.6
      tolerance: 2
    explanation: "The Moon is 30 Earth diameters away: 30 · 22 cm = 6.6 m."

  - kind: problem
    id: karte
    widget: numeric
    prompt: "A hiking map has a scale of 1 : 25,000. On the map it is 4 cm. How far is that in reality?"
    params: { unit: km }
    answer: { value: 1 }
    feedback:
      - when: "numval(state.input) == 100000"
        misconception: units
        text: 100,000 cm is correct. Now convert to kilometers.
    hints:
      - 4 cm · 25,000 = 100,000 cm.
    explanation: 100,000 cm is 1,000 m – exactly 1 km.

  - kind: explain
    id: s2
    body: |
      **Scale 1 : n** means: 1 cm on the plan is n cm in real life.
      At 1 ÷ 100,000, 1 cm is 1 km.

  - kind: problem
    id: strecke
    widget: numeric
    prompt: "Scale 1 : {{m}}. On the plan you measure {{c}} cm. How many meters is that in real life?"
    params: { unit: m }
    answer: { value: "{{c * m / 100}}" }
    hints:
      - "{{c}} · {{m}} gives centimeters. Divide by 100 for meters."
    explanation: "{{c}} · {{m}} = {{c * m}} cm = {{c * m / 100}} m."
    variants:
      params: { m: "choice[500,1000,5000,10000]", c: "int[2,9]" }
      defaults: { m: 1000, c: 3 }

  - kind: problem
    id: modell
    widget: choice
    prompt: "A model car is built at a scale of 1 : 18 and is 25 cm long. How long is the real car?"
    params:
      options:
        - { label: "4.5 m", correct: true }
        - { label: "1.8 m", feedback: "That is too short for a car. Calculate 25 cm · 18." }
        - { label: 45 m, feedback: "Too long – 25 · 18 = 450 cm." }
    hints:
      - 25 cm · 18.
    explanation: 25 · 18 = 450 cm = 4.5 m.

  - kind: explain
    id: s5
    body: Why do maps often show a bar labeled "1 km" instead of a number?
    reveal:
      body: "The bar grows when you copy or zoom. The number 1 ÷ 25,000 is no longer right after enlarging."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "On the plan (1 : 50) a room measures 8 cm by 6 cm. How many square metres does it really have?"
    params:
      unit: m²
    answer:
      value: 12
    hints:
      - "Convert both lengths first: 8 cm · 50 and 6 cm · 50."
    explanation: 4 m · 3 m = 12 m².
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: numeric
    prompt: "Scale 1 : {{m}}. A room is {{L}} m long in reality. How many centimetres is that on the plan?"
    params:
      unit: cm
    answer:
      value: "{{L * 100 / m}}"
    feedback:
      - when: numval(state.input) == L * m
        misconception: wrong-direction
        text: On the plan it gets smaller, not bigger. Divide by {{m}}.
      - when: numval(state.input) == L / m
        misconception: units
        text: "Convert to centimetres first: {{L}} m = {{L * 100}} cm."
    hints:
      - "{{L}} m is {{L * 100}} cm."
      - Divide by {{m}}.
    explanation: "{{L * 100}} cm : {{m}} = {{L * 100 / m}} cm."
    difficulty: 2
    variants:
      params:
        m: choice[50,100,200]
        L: int[2,12]
      defaults:
        m: 50
        L: 4

  - kind: problem
    id: ma-d2
    depth: 2
    widget: choice
    prompt: Which map shows more detail?
    params:
      options:
        - label: "1 : 25,000"
          correct: true
        - label: "1 : 100,000"
          feedback: Here 1 cm is already 1 km – the map shows less detail.
    hints:
      - How many real metres does 1 cm stand for?
      - Fewer metres per cm means everything looks bigger.
    explanation: "At 1 : 25,000, 1 cm is only 250 m. Everything is drawn four times as large as at 1 : 100,000."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "At a scale of 1 : 50 – by what factor do **areas** grow?"
    params:
      options:
        - label: "2500"
          correct: true
        - label: "50"
          feedback: That is only true for lengths. Areas have two directions.
        - label: "100"
          feedback: 50 · 50 is more.
    hints:
      - An area grows in length **and** width.
    explanation: Lengths times k, areas times k², volumes times k³. That is why an animal twice as large weighs eight times as much.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Lengths grow by the factor k, areas by $k^2$, volumes by $k^3$. This is the **square-cube law**. That is why a giant cannot simply be a scaled-up human: its weight grows faster than its bones."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "A model car at scale 1 : 10. The real tank holds 50 litres. How many millilitres does the model tank hold?"
    params:
      unit: ml
    answer:
      value: 50
    feedback:
      - when: numval(state.input) == 5000
        misconception: linear-scaling
        text: That is only divided by 10. Volumes shrink by 10 · 10 · 10.
      - when: numval(state.input) == 500
        misconception: area-scaling
        text: That is divided by 100 – like areas. Volume needs divided by 1000.
    hints:
      - Length, width and height are each divided by 10.
      - "50 litres : 1000 = ?"
    explanation: "50 L : 1000 = 0.05 L = 50 ml."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: An animal became twice as big in every direction. By what factor does the load per area of bone cross-section grow?
    answer:
      value: 2
    hints:
      - "Weight ~ volume: factor 8. Cross-section ~ area: factor 4."
      - "8 : 4 = ?"
    explanation: The load per area doubles. Large animals therefore need much thicker legs – like elephants.
    difficulty: 3

srs:
  cards_from: [strecke, karte]
