id: math.ratios.lab
type: concept
title: Verhältnis-Labor
summary: Rezepte skalieren, Rechtecke ziehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: rezept
    widget: chart
    prompt: Das Rezept ist für 4 Personen. Stell alle Mengen für 6 Personen ein.
    params:
      labels: [Mehl, Milch, Zucker]
      values: [200, 300, 100]
      editable: [0, 1, 2]
      min: 0
      max: 500
      step: 50
      unit: g
    answer: { values: [300, 450, 150] }
    hints:
      - 6 Personen sind das 1,5-Fache von 4.
    explanation: Alles mal 1,5 – das Verhältnis der Zutaten bleibt gleich.

  - kind: problem
    id: rechteck
    widget: rect
    prompt: Zieh ein Rechteck im Seitenverhältnis 2 zu 1 mit 8 m² Fläche.
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "w == 2 * h && area == 8" }
    hints:
      - Breite doppelt so lang wie Höhe.
    explanation: 4 × 2 – doppelt so breit wie hoch, Fläche 8 m².

  - kind: problem
    id: gerade
    widget: slider
    prompt: Beide Punkte liegen auf einer Geraden durch den Nullpunkt. Stelle ihre Steigung ein.
    params:
      expr: "k*x"
      x: [0, 5]
      y: [0, 8]
      showCoordinates: false
      sliders: [{ id: k, label: Faktor, min: 0, max: 3, step: 0.25, initial: 0.5 }]
      markers:
        - { x: 2, y: 3, group: a }
        - { x: 4, y: 6, group: a }
    check: { predicate: "k == 1.5" }
    hints:
      - Wie viel y pro einem x?
    explanation: "3 : 2 = 1,5. Proportionale Größen liegen auf einer Geraden durch null."

  - kind: problem
    id: anteil
    widget: numberline
    prompt: Markiere 3/4 auf dem Zahlenstrahl.
    params: { min: 0, max: 1, ticks: 4, labels: fractions }
    answer: { value: 0.75 }
    hints:
      - Drei von vier gleichen Teilen.
    explanation: 3/4 = 0,75 – drei Viertel des Weges.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Der Goldene Schnitt teilt eine Strecke so, dass lang : kurz = ganz : lang. Bei kurz = 1 ist lang ≈ ? Auf zwei Stellen."
    answer:
      value: 1.62
      tolerance: 0.01
    hints:
      - "x : 1 = (x + 1) : x, also x² = x + 1."
    explanation: Die positive Lösung ist (1 + √5)/2 ≈ 1,618.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: chart
    prompt: "Ein Saft wird aus Apfel, Orange und Wasser im Verhältnis 2 : 3 : 5 gemischt. Stell die Säulen für 500 ml ein."
    params:
      labels:
        - Apfel
        - Orange
        - Wasser
      values:
        - 50
        - 50
        - 50
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 300
      step: 50
      unit: ml
    answer:
      values:
        - 100
        - 150
        - 250
    hints:
      - 2 + 3 + 5 = 10 Teile.
      - Ein Teil sind 50 ml.
    explanation: "100 ml + 150 ml + 250 ml = 500 ml, im Verhältnis 2 : 3 : 5."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Ein 1-m-Stab wirft einen 1,5 m langen Schatten. Ein Baum wirft zur selben Zeit 12 m Schatten. Wie hoch ist der Baum?
    params:
      unit: m
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 18
        misconception: inverted-ratio
        text: Der Baum ist kürzer als sein Schatten – wie der Stab.
    hints:
      - "Höhe : Schatten ist bei beiden gleich."
      - "1 : 1,5 = x : 12."
    explanation: "12 : 1,5 = 8. Der Baum ist 8 m hoch. So maß schon Thales die Höhe der Pyramiden."
    difficulty: 2

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Fibonacci-Zahlen: 1, 1, 2, 3, 5, 8, 13, 21, … Berechne 21 : 13 auf zwei Stellen."
    answer:
      value: 1.62
      tolerance: 0.01
    hints:
      - "21 : 13 ist etwas mehr als 1,6."
      - 13 · 1,6 = 20,8.
    explanation: "21 : 13 ≈ 1,615. Die Quotienten benachbarter Fibonacci-Zahlen nähern sich dem Goldenen Schnitt 1,618…"
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Gleiche Winkel, gleiche Verhältnisse: Dreiecke mit denselben Winkeln heißen **ähnlich**. Ihre Seiten stehen alle im selben Verhältnis. Darauf beruhen Schattenmessung, Karten und Fotos."

srs:
  cards_from: [rezept, gerade]
