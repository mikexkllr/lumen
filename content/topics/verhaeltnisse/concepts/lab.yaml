id: math.ratios.lab
type: concept
title: Verhältnis-Labor
summary: Rezepte skalieren, Rechtecke ziehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: rezept
    widget: chart
    prompt: Das Rezept ist für 4 Personen. Stell alle Mengen für 6 Personen ein.
    params:
      labels: [Mehl, Milch, Zucker]
      values: [200, 300, 100]
      editable: [0, 1, 2]
      min: 0
      max: 500
      step: 50
      unit: g
    answer: { values: [300, 450, 150] }
    hints:
      - 6 Personen sind das 1,5-Fache von 4.
    explanation: Alles mal 1,5 – das Verhältnis der Zutaten bleibt gleich.

  - kind: problem
    id: rechteck
    widget: rect
    prompt: Zieh ein Rechteck im Seitenverhältnis 2 zu 1 mit 8 m² Fläche.
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "w == 2 * h && area == 8" }
    hints:
      - Breite doppelt so lang wie Höhe.
    explanation: 4 × 2 – doppelt so breit wie hoch, Fläche 8 m².

  - kind: problem
    id: gerade
    widget: slider
    prompt: Beide Punkte liegen auf einer Geraden durch den Nullpunkt. Stelle ihre Steigung ein.
    params:
      expr: "k*x"
      x: [0, 5]
      y: [0, 8]
      showCoordinates: false
      sliders: [{ id: k, label: Faktor, min: 0, max: 3, step: 0.25, initial: 0.5 }]
      markers:
        - { x: 2, y: 3, group: a }
        - { x: 4, y: 6, group: a }
    check: { predicate: "k == 1.5" }
    hints:
      - Wie viel y pro einem x?
    explanation: "3 : 2 = 1,5. Proportionale Größen liegen auf einer Geraden durch null."

  - kind: problem
    id: anteil
    widget: numberline
    prompt: Markiere 3/4 auf dem Zahlenstrahl.
    params: { min: 0, max: 1, ticks: 4, labels: fractions }
    answer: { value: 0.75 }
    hints:
      - Drei von vier gleichen Teilen.
    explanation: 3/4 = 0,75 – drei Viertel des Weges.

srs:
  cards_from: [rezept, gerade]
