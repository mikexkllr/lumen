id: math.ratios.dreisatz
type: concept
title: Dreisatz
summary: Erst auf eins schließen, dann auf die gesuchte Menge.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ratio.dreisatz]
estimated_minutes: 8
steps:
  - kind: problem
    id: broetchen
    widget: numeric
    prompt: 3 Brötchen kosten 1,50 €. Wie viel kosten 5 Brötchen?
    params: { unit: "€" }
    answer: { value: 2.5 }
    feedback:
      - when: "numval(state.input) == 0.5"
        text: 0,50 € kostet ein Brötchen. Du brauchst fünf.
    hints:
      - Was kostet ein Brötchen?
    explanation: "1,50 € : 3 = 0,50 €, und 5 · 0,50 € = 2,50 €."

  - kind: explain
    id: s2
    body: |
      **Dreisatz** – erst auf **eins** schließen, dann auf die gesuchte Menge.
      3 Brötchen kosten 1,50 €, 1 Brötchen 0,50 €, 5 Brötchen 2,50 €.

  - kind: problem
    id: hefte
    widget: numeric
    prompt: "{{a}} Hefte kosten {{a * p}} €. Was kosten {{b}} Hefte?"
    params: { unit: "€" }
    answer: { value: "{{b * p}}" }
    hints:
      - "Ein Heft kostet {{a * p}} € : {{a}}."
    explanation: "Ein Heft kostet {{p}} €, also {{b}} · {{p}} € = {{b * p}} €."
    variants:
      params: { a: "choice[2,3,4,5]", p: "int[2,5]", b: "int[6,12]" }
      defaults: { a: 4, p: 3, b: 7 }

  - kind: problem
    id: verbrauch
    widget: choice
    prompt: Ein Auto braucht 6 Liter für 100 km. Wie viel braucht es für 250 km?
    params:
      layout: grid
      options:
        - { label: "15 Liter", correct: true }
        - { label: "12 Liter", feedback: "Das reicht für 200 km." }
        - { label: "18 Liter", feedback: "Das reicht für 300 km." }
        - { label: "25 Liter", feedback: "Das wären 10 Liter auf 100 km." }
    hints:
      - 250 km sind zweieinhalbmal 100 km.
    explanation: 2,5 · 6 Liter = 15 Liter.

  - kind: explain
    id: s5
    body: |
      Nicht alles wächst im gleichen Takt. Zwei Pumpen leeren ein Becken in 6 Stunden.
      Vier Pumpen schaffen es in **3** Stunden – doppelt so viele, halb so lang.

  - kind: problem
    id: maler
    widget: numeric
    prompt: 3 Leute streichen ein Haus in 8 Tagen. Wie lange brauchen 6 Leute gleich schnell?
    params: { unit: Tage }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 16"
        misconception: proportional-instead-of-inverse
        text: Mehr Leute brauchen weniger Zeit, nicht mehr.
    hints:
      - Doppelt so viele Leute – wie viel Zeit?
    explanation: Doppelt so viele Leute brauchen die halbe Zeit, also 4 Tage.
    difficulty: 2

  - kind: problem
    id: c1
    widget: order
    prompt: "Dreisatz: 4 kg Äpfel kosten 10 €. Was kosten 6 kg? Bring die Schritte in die richtige Reihenfolge."
    params:
      items:
        - label: 4 kg kosten 10 €
        - label: 1 kg kostet 2,50 €
        - label: 6 kg kosten 15 €
    hints:
      - Erst auf 1 schließen.
    explanation: Über die Eins geht jeder Dreisatz.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Drucker schafft 45 Seiten in 3 Minuten. Wie viele Minuten braucht er für 240 Seiten?
    params:
      unit: min
    answer:
      value: 16
    hints:
      - Wie viele Seiten schafft er in 1 Minute?
    explanation: "15 Seiten pro Minute, also 240 : 15 = 16 Minuten."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: 6 Maschinen fertigen 300 Teile in 5 Stunden. Wie viele Stunden brauchen 4 Maschinen für 480 Teile?
    params:
      unit: h
    answer:
      value: 12
    hints:
      - Wie viele Teile schafft eine Maschine in einer Stunde?
      - "300 : (6 · 5) = 10 Teile."
    explanation: "4 Maschinen schaffen 40 Teile pro Stunde. 480 : 40 = 12. Zwei Dreisätze nacheinander."
    difficulty: 3

srs:
  cards_from: ["hefte"]
