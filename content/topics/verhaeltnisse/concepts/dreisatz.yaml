id: math.ratios.dreisatz
type: concept
title: Dreisatz
summary: Erst auf eins schließen, dann auf die gesuchte Menge.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ratio.dreisatz]
estimated_minutes: 12
steps:
  - kind: problem
    id: broetchen
    widget: numeric
    prompt: 3 Brötchen kosten 1,50 €. Wie viel kosten 5 Brötchen?
    params: { unit: "€" }
    answer: { value: 2.5 }
    feedback:
      - when: "numval(state.input) == 0.5"
        text: 0,50 € kostet ein Brötchen. Du brauchst fünf.
    hints:
      - Was kostet ein Brötchen?
    explanation: "1,50 € : 3 = 0,50 €, und 5 · 0,50 € = 2,50 €."

  - kind: explain
    id: s2
    body: |
      **Dreisatz** – erst auf **eins** schließen, dann auf die gesuchte Menge.
      3 Brötchen kosten 1,50 €, 1 Brötchen 0,50 €, 5 Brötchen 2,50 €.

  - kind: problem
    id: hefte
    widget: numeric
    prompt: "{{a}} Hefte kosten {{a * p}} €. Was kosten {{b}} Hefte?"
    params: { unit: "€" }
    answer: { value: "{{b * p}}" }
    hints:
      - "Ein Heft kostet {{a * p}} € : {{a}}."
    explanation: "Ein Heft kostet {{p}} €, also {{b}} · {{p}} € = {{b * p}} €."
    variants:
      params: { a: "choice[2,3,4,5]", p: "int[2,5]", b: "int[6,12]" }
      defaults: { a: 4, p: 3, b: 7 }

  - kind: problem
    id: verbrauch
    widget: choice
    prompt: Ein Auto braucht 6 Liter für 100 km. Wie viel braucht es für 250 km?
    params:
      layout: grid
      options:
        - { label: "15 Liter", correct: true }
        - { label: "12 Liter", feedback: "Das reicht für 200 km." }
        - { label: "18 Liter", feedback: "Das reicht für 300 km." }
        - { label: "25 Liter", feedback: "Das wären 10 Liter auf 100 km." }
    hints:
      - 250 km sind zweieinhalbmal 100 km.
    explanation: 2,5 · 6 Liter = 15 Liter.

  - kind: explain
    id: s5
    body: |
      Nicht alles wächst im gleichen Takt. Zwei **Pumpen** leeren ein Becken in 6 Stunden.
      Vier Pumpen schaffen es in **3** Stunden – doppelt so viele, halb so lang.

  - kind: problem
    id: maler
    widget: numeric
    prompt: 3 Leute streichen ein Haus in 8 Tagen. Wie lange brauchen 6 Leute gleich schnell?
    params: { unit: Tage }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 16"
        misconception: proportional-instead-of-inverse
        text: Mehr Leute brauchen weniger Zeit, nicht mehr.
    hints:
      - Doppelt so viele Leute – wie viel Zeit?
    explanation: Doppelt so viele Leute brauchen die halbe Zeit, also 4 Tage.
    difficulty: 2

  - kind: problem
    id: c1
    widget: order
    prompt: "Dreisatz: 4 kg Äpfel kosten 10 €. Was kosten 6 kg? Bring die Schritte in die richtige Reihenfolge."
    params:
      items:
        - label: 4 kg kosten 10 €
        - label: 1 kg kostet 2,50 €
        - label: 6 kg kosten 15 €
    hints:
      - Erst auf 1 schließen.
    explanation: Über die Eins geht jeder Dreisatz.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Drucker schafft 45 Seiten in 3 Minuten. Wie viele Minuten braucht er für 240 Seiten?
    params:
      unit: min
    answer:
      value: 16
    hints:
      - Wie viele Seiten schafft er in 1 Minute?
    explanation: "15 Seiten pro Minute, also 240 : 15 = 16 Minuten."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "**Proportional** heißt: doppelt so viel kostet doppelt so viel. Der Preis pro Stück bleibt immer gleich. Im Koordinatensystem liegen alle Paare auf einer Geraden durch null."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: slider
    prompt: 4 kg Äpfel kosten 10 €. Stelle den Preis pro Kilo k so ein, dass die Gerade y = k · x durch den Punkt geht.
    params:
      expr: k*x
      x:
        - 0
        - 6
      y:
        - 0
        - 15
      showCoordinates: true
      sliders:
        - id: k
          label: € pro kg
          min: 0
          max: 4
          step: 0.5
          initial: 1
      markers:
        - x: 4
          y: 10
          label: 4 kg
    answer:
      values:
        k: 2.5
    hints:
      - Wie viel kostet 1 kg?
      - "10 € : 4 = ?"
    explanation: 1 kg kostet 2,50 €. Die Steigung der Geraden ist der Preis pro Kilo.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Proportional oder nicht?
    params:
      buckets:
        - id: b1
          label: proportional
        - id: b2
          label: nicht proportional
      items:
        - label: Preis und Menge Äpfel
          bucket: b1
        - label: Weg und Zeit bei gleichem Tempo
          bucket: b1
        - label: Benzin und Strecke, gleicher Verbrauch
          bucket: b1
        - label: Alter und Größe eines Kindes
          bucket: b2
        - label: Taxipreis mit Grundgebühr und Strecke
          bucket: b2
        - label: Flatrate und Anzahl der Anrufe
          bucket: b2
    hints:
      - "Prüfe: Kostet doppelt so viel auch doppelt?"
      - Eine Grundgebühr verschiebt den Start – dann ist es nicht proportional.
    explanation: Proportional ist nur, was bei 0 startet und im gleichen Takt wächst. Grundgebühr, Flatrate und Wachstum von Kindern passen nicht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: 6 Maschinen fertigen 300 Teile in 5 Stunden. Wie viele Stunden brauchen 4 Maschinen für 480 Teile?
    params:
      unit: h
    answer:
      value: 12
    hints:
      - Wie viele Teile schafft eine Maschine in einer Stunde?
      - "300 : (6 · 5) = 10 Teile."
    explanation: "4 Maschinen schaffen 40 Teile pro Stunde. 480 : 40 = 12. Zwei Dreisätze nacheinander."
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Eine Kerze brennt in 4 Stunden 10 cm ab. Wie viele Minuten braucht sie für 3 cm?
    params:
      unit: min
    answer:
      value: 72
    feedback:
      - when: numval(state.input) == 1.2
        misconception: units
        text: Das sind Stunden. Gefragt sind Minuten.
    hints:
      - 4 Stunden sind 240 Minuten.
      - 1 cm dauert 24 Minuten.
    explanation: "240 : 10 = 24 Minuten pro cm, mal 3 ergibt 72 Minuten."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Anna streicht eine Wand in 3 Stunden, Ben in 6 Stunden. Wie lange brauchen sie zusammen?
    params:
      unit: h
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 4.5
        misconception: average-times
        text: Der Mittelwert passt nicht – zusammen geht es schneller als jeder allein.
      - when: numval(state.input) == 9
        misconception: add-times
        text: Zu zweit dauert es nicht länger. Addiere die Tempos, nicht die Zeiten.
    hints:
      - Wie viel Wand schafft jede Person pro Stunde?
      - 1/3 + 1/6 = 1/2 Wand pro Stunde.
    explanation: Zusammen schaffen sie eine halbe Wand pro Stunde. Für die ganze Wand brauchen sie 2 Stunden.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man beim Dreisatz erst auf eins schließt.
    params:
      keywords:
        - - eins
          - ein stück
          - einzeln
          - one
          - single
          - unit
        - - teilen
          - durch
          - geteilt
          - divid
        - - mal
          - multipl
          - times
      sample: Wenn ich weiß, was ein Stück kostet, kann ich jede andere Menge ausrechnen. Ich teile also erst durch die gegebene Menge und nehme dann mal die gesuchte Menge.
    explanation: "Kernidee: Der Wert für eins ist die Brücke zwischen zwei beliebigen Mengen."
    difficulty: 3

srs:
  cards_from: ["hefte"]
