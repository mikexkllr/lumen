id: math.ratios.lab
type: concept
title: Ratio lab
summary: Scale recipes, draw rectangles.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The long lever
    body: A long lever lets you lift almost anything. On the left are 4 kg, on the right only 2 kg. Push the 2 kg further out until the seesaw is level. Mass and distance are in inverse **ratio**.
    visual:
      widget: sim
      interactive: true
      params:
        scene: lever

  - kind: problem
    id: rezept
    widget: chart
    prompt: The recipe serves 4 people. Set all amounts for 6 people.
    params:
      labels: [Flour, Milk, Sugar]
      values: [200, 300, 100]
      editable: [0, 1, 2]
      min: 0
      max: 500
      step: 50
      unit: g
    answer: { values: [300, 450, 150] }
    hints:
      - 6 people is 1.5 times 4.
    explanation: Everything times 1.5 – the ratio of the ingredients stays the same.

  - kind: problem
    id: rechteck
    widget: rect
    prompt: Draw a rectangle with an aspect ratio of 2 to 1 and an area of 8 m².
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "w == 2 * h && area == 8" }
    hints:
      - The width is twice the height.
    explanation: 4 × 2 – twice as wide as tall, area 8 m².

  - kind: problem
    id: gerade
    widget: slider
    prompt: Both points lie on a line through the origin. Set its slope.
    params:
      expr: "k*x"
      x: [0, 5]
      y: [0, 8]
      showCoordinates: false
      sliders: [{ id: k, label: Factor, min: 0, max: 3, step: 0.25, initial: 0.5 }]
      markers:
        - { x: 2, y: 3, group: a }
        - { x: 4, y: 6, group: a }
    check: { predicate: "k == 1.5" }
    hints:
      - How much y for each x?
    explanation: "3 ÷ 2 = 1.5. Proportional quantities lie on a line through zero."

  - kind: problem
    id: anteil
    widget: numberline
    prompt: Mark 3/4 on the number line.
    params: { min: 0, max: 1, ticks: 4, labels: fractions }
    answer: { value: 0.75 }
    hints:
      - Three of four equal parts.
    explanation: 3/4 = 0.75 – three quarters of the way.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "The golden ratio splits a line so that long : short = whole : long. With short = 1, long ≈ ? To two places."
    answer:
      value: 1.62
      tolerance: 0.01
    hints:
      - "x : 1 = (x + 1) : x, so x² = x + 1."
    explanation: The positive solution is (1 + √5)/2 ≈ 1.618.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: chart
    prompt: "A drink is mixed from apple, orange and water in the ratio 2 : 3 : 5. Set the bars for 500 ml."
    params:
      labels:
        - Apple
        - Orange
        - Water
      values:
        - 50
        - 50
        - 50
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 300
      step: 50
      unit: ml
    answer:
      values:
        - 100
        - 150
        - 250
    hints:
      - 2 + 3 + 5 = 10 parts.
      - One part is 50 ml.
    explanation: "100 ml + 150 ml + 250 ml = 500 ml, in the ratio 2 : 3 : 5."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: A 1 m stick casts a 1.5 m shadow. At the same time a tree casts a 12 m shadow. How tall is the tree?
    params:
      unit: m
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 18
        misconception: inverted-ratio
        text: The tree is shorter than its shadow – just like the stick.
    hints:
      - "Height : shadow is the same for both."
      - "1 : 1.5 = x : 12."
    explanation: "12 : 1.5 = 8. The tree is 8 m tall. Thales is said to have measured the pyramids this way."
    difficulty: 2

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Fibonacci numbers: 1, 1, 2, 3, 5, 8, 13, 21, … Work out 21 : 13 to two decimals."
    answer:
      value: 1.62
      tolerance: 0.01
    hints:
      - "21 : 13 is a little more than 1.6."
      - 13 · 1.6 = 20.8.
    explanation: "21 : 13 ≈ 1.615. Ratios of neighbouring Fibonacci numbers approach the golden ratio 1.618…"
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Same angles, same ratios: triangles with equal angles are called **similar**. All their sides are in the same ratio. Shadow measuring, maps and photos rely on this."

srs:
  cards_from: [rezept, gerade]
