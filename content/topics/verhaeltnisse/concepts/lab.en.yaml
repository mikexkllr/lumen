id: math.ratios.lab
type: concept
title: Ratio lab
summary: Scale recipes, draw rectangles.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: rezept
    widget: chart
    prompt: The recipe serves 4 people. Set all amounts for 6 people.
    params:
      labels: [Flour, Milk, Sugar]
      values: [200, 300, 100]
      editable: [0, 1, 2]
      min: 0
      max: 500
      step: 50
      unit: g
    answer: { values: [300, 450, 150] }
    hints:
      - 6 people is 1.5 times 4.
    explanation: Everything times 1.5 – the ratio of the ingredients stays the same.

  - kind: problem
    id: rechteck
    widget: rect
    prompt: Draw a rectangle with an aspect ratio of 2 to 1 and an area of 8 m².
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "w == 2 * h && area == 8" }
    hints:
      - The width is twice the height.
    explanation: 4 × 2 – twice as wide as tall, area 8 m².

  - kind: problem
    id: gerade
    widget: slider
    prompt: Both points lie on a line through the origin. Set its slope.
    params:
      expr: "k*x"
      x: [0, 5]
      y: [0, 8]
      showCoordinates: false
      sliders: [{ id: k, label: Factor, min: 0, max: 3, step: 0.25, initial: 0.5 }]
      markers:
        - { x: 2, y: 3, group: a }
        - { x: 4, y: 6, group: a }
    check: { predicate: "k == 1.5" }
    hints:
      - How much y for each x?
    explanation: "3 ÷ 2 = 1.5. Proportional quantities lie on a line through zero."

  - kind: problem
    id: anteil
    widget: numberline
    prompt: Mark 3/4 on the number line.
    params: { min: 0, max: 1, ticks: 4, labels: fractions }
    answer: { value: 0.75 }
    hints:
      - Three of four equal parts.
    explanation: 3/4 = 0.75 – three quarters of the way.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "The golden ratio splits a line so that long : short = whole : long. With short = 1, long ≈ ? To two places."
    answer:
      value: 1.62
      tolerance: 0.01
    hints:
      - "x : 1 = (x + 1) : x, so x² = x + 1."
    explanation: The positive solution is (1 + √5)/2 ≈ 1.618.
    difficulty: 2

srs:
  cards_from: [rezept, gerade]
