id: math.ratios.dreisatz
type: concept
title: Unitary method
summary: First find the value of one, then scale to the amount you need.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ratio.dreisatz]
estimated_minutes: 8
steps:
  - kind: problem
    id: broetchen
    widget: numeric
    prompt: 3 rolls cost 1.50 €. How much do 5 rolls cost?
    params: { unit: "€" }
    answer: { value: 2.5 }
    feedback:
      - when: "numval(state.input) == 0.5"
        text: One roll costs 0.50 €. You need five.
    hints:
      - What does one roll cost?
    explanation: "1.50 € : 3 = 0.50 €, and 5 · 0.50 € = 2.50 €."

  - kind: explain
    id: s2
    body: |
      **Unitary method** – first find the value of **one**, then scale to the amount you need.
      3 rolls cost 1.50 €, 1 roll 0.50 €, 5 rolls 2.50 €.

  - kind: problem
    id: hefte
    widget: numeric
    prompt: "{{a}} notebooks cost {{a * p}} €. What do {{b}} notebooks cost?"
    params: { unit: "€" }
    answer: { value: "{{b * p}}" }
    hints:
      - "One notebook costs {{a * p}} € : {{a}}."
    explanation: "One notebook costs {{p}} €, so {{b}} · {{p}} € = {{b * p}} €."
    variants:
      params: { a: "choice[2,3,4,5]", p: "int[2,5]", b: "int[6,12]" }
      defaults: { a: 4, p: 3, b: 7 }

  - kind: problem
    id: verbrauch
    widget: choice
    prompt: A car uses 6 liters per 100 km. How much does it use for 250 km?
    params:
      layout: grid
      options:
        - { label: "15 liters", correct: true }
        - { label: "12 liters", feedback: "That is enough for 200 km." }
        - { label: "18 liters", feedback: "That is enough for 300 km." }
        - { label: "25 liters", feedback: "That would be 10 liters per 100 km." }
    hints:
      - 250 km is two and a half times 100 km.
    explanation: 2.5 · 6 liters = 15 liters.

  - kind: explain
    id: s5
    body: |
      Not everything grows in step. Two **pumps** empty a tank in 6 hours.
      Four pumps do it in **3** hours – twice as many, half as long.

  - kind: problem
    id: maler
    widget: numeric
    prompt: 3 people paint a house in 8 days. How long do 6 people take, working at the same speed?
    params: { unit: days }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 16"
        misconception: proportional-instead-of-inverse
        text: More people need less time, not more.
    hints:
      - Twice as many people – how much time?
    explanation: Twice as many people need half the time, so 4 days.
    difficulty: 2

  - kind: problem
    id: c1
    widget: order
    prompt: "Rule of three: 4 kg of apples cost €10. What do 6 kg cost? Put the steps in order."
    params:
      items:
        - label: 4 kg cost €10
        - label: 1 kg costs €2.50
        - label: 6 kg cost €15
    hints:
      - Go to 1 first.
    explanation: Every rule-of-three problem goes through one.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A printer does 45 pages in 3 minutes. How many minutes does it need for 240 pages?
    params:
      unit: min
    answer:
      value: 16
    hints:
      - How many pages does it do in 1 minute?
    explanation: 15 pages a minute, so 240 ÷ 15 = 16 minutes.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: 6 machines make 300 parts in 5 hours. How many hours do 4 machines need for 480 parts?
    params:
      unit: h
    answer:
      value: 12
    hints:
      - How many parts does one machine make in one hour?
      - 300 ÷ (6 · 5) = 10 parts.
    explanation: 4 machines make 40 parts an hour. 480 ÷ 40 = 12. Two rule-of-three steps in a row.
    difficulty: 3

srs:
  cards_from: ["hefte"]
