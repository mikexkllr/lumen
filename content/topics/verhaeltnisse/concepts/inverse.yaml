id: math.ratios.inverse
type: concept
title: Umgekehrter Dreisatz
summary: Mehr Leute, weniger Zeit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: maler
    widget: numeric
    prompt: 3 Maler brauchen 12 Tage für ein Haus. Wie lange brauchen 4 Maler, wenn alle gleich schnell sind?
    params: { unit: Tage }
    answer: { value: 9 }
    feedback:
      - when: "numval(state.input) == 16"
        misconception: proportional
        text: Mehr Maler sind schneller fertig, nicht langsamer.
    hints:
      - Wie lange bräuchte ein einziger Maler?
    explanation: Ein Maler bräuchte 36 Tage. Vier teilen sich das – 9 Tage.

  - kind: explain
    id: s2
    body: |
      **Antiproportional** heißt: doppelt so viel von der einen Größe, halb so viel von der anderen.
      Das Produkt bleibt gleich – hier 3 · 12 = 4 · 9 = 36.

  - kind: problem
    id: art
    widget: buckets
    prompt: Proportional oder antiproportional?
    params:
      buckets: [{ label: proportional }, { label: antiproportional }]
      items:
        - { label: Kilo Äpfel und Preis, bucket: proportional }
        - { label: Fahrzeit und Strecke bei gleichem Tempo, bucket: proportional }
        - { label: Tempo und Fahrzeit für eine Strecke, bucket: antiproportional }
        - { label: Helfer und Dauer einer Arbeit, bucket: antiproportional }
        - { label: Gäste und Pizzastücke pro Gast, bucket: antiproportional }
    hints:
      - Wird die eine Größe größer – wird die andere dann größer oder kleiner?
    explanation: Bei proportional wachsen beide zusammen, bei antiproportional bleibt das Produkt gleich.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: Mit {{v}} km/h dauert eine Fahrt {{t}} Stunden. Wie lange dauert sie mit {{w}} km/h?
    params: { unit: Stunden }
    answer: { value: "{{v * t / w}}" }
    hints:
      - "Die Strecke ist {{v * t}} km."
    explanation: "{{v * t}} km : {{w}} km/h = {{v * t / w}} h."
    variants:
      params: { v: "choice[60,80,100]", t: "choice[2,3,6]", w: "choice[40,120,150]" }
      constraints: ["(v * t) % w == 0"]
      defaults: { v: 60, t: 2, w: 120 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Benzin und gefahrene Strecke
          right: true
        - text: Tempo und Fahrzeit für dieselbe Strecke
          right: false
        - text: Zahl der Gäste und Stück Kuchen pro Gast
          right: false
        - text: Arbeitsstunden und Lohn
          right: true
      left: Antiproportional
      right: Proportional

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: "Umgekehrt proportional zum Anfassen: Links liegen 6 kg bei 1 m. Rechts hast du nur 2 kg. Wie weit musst du sie hinausschieben?"
    params:
      scene: lever
      controls:
        m1:
          value: 6
          fixed: true
        d1:
          value: 1
          fixed: true
        m2:
          value: 2
          fixed: true
    answer:
      tilt: 0
    explanation: 3 m. Ein Drittel der Masse braucht den dreifachen Abstand.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Vorrat reicht für 12 Pferde 15 Tage. Nach 5 Tagen kommen 8 Pferde dazu. Wie viele Tage reicht der Rest?
    answer:
      value: 6
    hints:
      - Nach 5 Tagen sind noch 12 · 10 = 120 Tagesrationen übrig.
    explanation: 120 Rationen für 20 Pferde reichen 6 Tage.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie sieht der Graph einer antiproportionalen Zuordnung aus?
    params:
      options:
        - label: Eine Hyperbel – sie nähert sich den Achsen, berührt sie aber nie
          correct: true
        - label: Eine fallende Gerade
          feedback: Eine Gerade würde irgendwann die Achse treffen. Hier bleibt x · y konstant.
        - label: Eine steigende Gerade durch den Ursprung
          feedback: Das ist die proportionale Zuordnung.
    hints:
      - Es gilt y = k / x. Was passiert für sehr große x?
    explanation: y = k/x wird nie null und ist für x = 0 nicht erklärt.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Mehr Leute, weniger Zeit. Was bleibt dabei gleich – und was ist bei »je mehr, desto mehr« anders?"
    params:
      keywords:
        - - doppelt
          - verdoppel
          - double
          - twice
        - - halb
          - hälfte
          - half
          - halve
        - - produkt
          - product
          - konstant
          - constant
          - verhältnis
          - quotient
          - ratio
      sample: "Proportional: Verdoppelt sich die eine Größe, verdoppelt sich auch die andere, der Quotient bleibt gleich. Antiproportional: Die andere halbiert sich, das Produkt bleibt konstant."
    difficulty: 3

srs:
  cards_from: [maler, tempo]
