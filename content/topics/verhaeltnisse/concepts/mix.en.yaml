id: math.ratios.mix
type: concept
title: Mixing and recipes
summary: Ratios in cooking and mixing.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Every part counts
    body: "When mixing drinks, every part counts. With 1 : 2, you add 2 parts water to 1 part syrup. The syrup is shaded. Split the hexagon into 6 or 12 pieces and shade the same amount. The **share** stays the same."
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 3
        shape: hexagon
        shaded:
          - 0
        partOptions:
          - 3
          - 6
          - 12

  - kind: problem
    id: saft
    widget: numeric
    prompt: "A spritzer is mixed 1 : 3 – one part juice, three parts water. How much juice do you need for 2 liters?"
    params: { unit: liters }
    answer: { value: 0.5 }
    feedback:
      - when: "approx(numval(state.input), 2/3)"
        misconception: part-to-part
        text: The whole has 1 + 3 = 4 parts, not 3.
    hints:
      - How many parts are there in total?
    explanation: 2 liters divided by 4 parts = 0.5 liters per part. Juice is one part.

  - kind: explain
    id: s2
    body: |
      In **mixtures**, you count **all parts together**. 1 : 3 means 4 parts, and one of them is juice – so one quarter.

  - kind: problem
    id: rezept
    widget: numeric
    prompt: A recipe for {{p}} people needs {{g}} g of flour. How much do you need for {{q}} people?
    params: { unit: g }
    answer: { value: "{{g * q / p}}" }
    hints:
      - First work back to one person.
    explanation: "{{g}} ÷ {{p}} · {{q}} = {{g * q / p}} g."
    variants:
      params: { p: "choice[2,4]", q: "choice[3,6,8]", g: "choice[200,300,400]" }
      constraints: ["p != q"]
      defaults: { p: 4, q: 6, g: 400 }

  - kind: problem
    id: beton
    widget: choice
    prompt: "Concrete is mixed 1 : 2 : 3 – cement, sand, gravel. How much gravel is in 60 kg of mix?"
    params:
      options:
        - { label: 30 kg, correct: true }
        - { label: 20 kg, feedback: "That would be a third. But gravel has 3 of 6 parts." }
        - { label: 18 kg, feedback: "Count all the parts: 1 + 2 + 3 = 6." }
    hints:
      - 6 parts in total – how heavy is one part?
    explanation: One part is 10 kg, and gravel has 3 parts – so 30 kg.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "With 2 : 3 there are [[5]] parts in total. The first substance has the share [[2/5]], which is [[40%]]."
      distractors:
        - 2/3
        - "6"

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: "A spritzer is mixed 1 : 4 – 1 part juice, 4 parts water. The square is the whole glass. Shade the juice."
    params:
      parts: 20
      shape: square
    answer:
      fraction: 1/5
    hints:
      - "Add up all the parts: 1 + 4 = 5."
      - Juice is 1 of 5 parts. 20 ÷ 5 = 4 cells.
    explanation: "1 : 4 means $\\frac{1}{5}$ juice – so 4 of 20 cells, or 20%."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You mix 2 litres of juice with 30% fruit and 3 litres with 80% fruit. What percent fruit does the mix have?
    params:
      unit: "%"
    answer:
      value: 60
    feedback:
      - when: numval(state.input) == 55
        misconception: unweighted-mean
        text: 55% would only be right for equal amounts. Here there is more of the strong juice.
    hints:
      - "Compute the fruit in litres: 0.6 + 2.4."
    explanation: 3 litres of fruit in 5 litres is 60%. This is a **weighted average**.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: In **mixture problems** you count the pure amount. 2 L with 30 % fruit contain 0.6 L of fruit. At the end you divide all the fruit by the total amount.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Juice and water are mixed 1 : {{k}}. How many ml of juice do you need for {{m * (k + 1)}} ml of spritzer?"
    params:
      unit: ml
    answer:
      value: "{{m}}"
    feedback:
      - when: numval(state.input) == m * (k + 1) / k
        misconception: forgot-part
        text: There are {{k + 1}} parts, not {{k}}. The juice counts too.
    hints:
      - 1 + {{k}} = {{k + 1}} parts in total.
      - "One part is {{m * (k + 1)}} : {{k + 1}}."
    explanation: "{{m * (k + 1)}} ml : {{k + 1}} = {{m}} ml of juice."
    difficulty: 2
    variants:
      params:
        k: int[2,5]
        m: step[100,400,100]
      defaults:
        k: 3
        m: 200

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: A recipe for 4 people needs 3 eggs. How many eggs for 6 people?
    answer:
      value: 4.5
    hints:
      - 6 people is 1.5 times 4.
      - 3 · 1.5 = ?
    explanation: 4.5 eggs – in the kitchen you would use 4 large or 5 small ones. Maths and real life round differently.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: You have 4 litres of juice with 50% fruit. How many litres of water must you add to get 20%?
    params:
      unit: l
    answer:
      value: 6
    hints:
      - The fruit stays at 2 litres. Of what are 2 litres exactly 20%?
    explanation: 2 litres are 20% of 10 litres. So 6 litres of water are missing.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: You need 10 L of juice with 40 % fruit. You have juice with 20 % and juice with 70 %. How many litres of the 70 % juice do you need?
    params:
      unit: L
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 5
        misconception: half-half
        text: Half and half gives 45 %. You need a bit less of the strong juice.
    hints:
      - "Take x litres of 70 % juice. Fruit: 0.7x + 0.2 · (10 − x) = 4."
      - 0.5x + 2 = 4.
    explanation: "x = 4 L of 70 % juice and 6 L of 20 % juice. Check: 2.8 + 1.2 = 4 L of fruit."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "A mix always lies between its ingredients. Its value is a **weighted average**: whatever there is more of pulls harder. 40 % is closer to 20 % – so you need more of the 20 % juice."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: "Explain to Lux why mixing 1 : 3 gives one quarter juice."
    params:
      keywords:
        - - vier
          - four
          - teile
          - parts
        - - zusammen
          - insgesamt
          - alle
          - total
          - together
          - all
        - - viertel
          - quarter
          - 1/4
      sample: One part juice and three parts water make four parts together. One of them is juice. So one quarter of the mix is juice.
    explanation: "Key idea: add up all the parts first – the share is part over total."
    difficulty: 3

srs:
  cards_from: [saft, rezept]
