id: math.ratios.mix
type: concept
title: Mixing and recipes
summary: Ratios in cooking and mixing.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: saft
    widget: numeric
    prompt: "A spritzer is mixed 1 : 3 – one part juice, three parts water. How much juice do you need for 2 liters?"
    params: { unit: liters }
    answer: { value: 0.5 }
    feedback:
      - when: "approx(numval(state.input), 2/3)"
        misconception: part-to-part
        text: The whole has 1 + 3 = 4 parts, not 3.
    hints:
      - How many parts are there in total?
    explanation: 2 liters divided by 4 parts = 0.5 liters per part. Juice is one part.

  - kind: explain
    id: s2
    body: |
      In **mixtures**, you count **all parts together**. 1 ÷ 3 means 4 parts, and one of them is juice – so one quarter.

  - kind: problem
    id: rezept
    widget: numeric
    prompt: A recipe for {{p}} people needs {{g}} g of flour. How much do you need for {{q}} people?
    params: { unit: g }
    answer: { value: "{{g * q / p}}" }
    hints:
      - First work back to one person.
    explanation: "{{g}} ÷ {{p}} · {{q}} = {{g * q / p}} g."
    variants:
      params: { p: "choice[2,4]", q: "choice[3,6,8]", g: "choice[200,300,400]" }
      constraints: ["p != q"]
      defaults: { p: 4, q: 6, g: 400 }

  - kind: problem
    id: beton
    widget: choice
    prompt: "Concrete is mixed 1 : 2 : 3 – cement, sand, gravel. How much gravel is in 60 kg of mix?"
    params:
      options:
        - { label: 30 kg, correct: true }
        - { label: 20 kg, feedback: "That would be a third. But gravel has 3 of 6 parts." }
        - { label: 18 kg, feedback: "Count all the parts: 1 + 2 + 3 = 6." }
    hints:
      - 6 parts in total – how heavy is one part?
    explanation: One part is 10 kg, and gravel has 3 parts – so 30 kg.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "With 2 : 3 there are [[5]] parts in total. The first substance has the share [[2/5]], which is [[40%]]."
      distractors:
        - 2/3
        - "6"

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You mix 2 litres of juice with 30% fruit and 3 litres with 80% fruit. What percent fruit does the mix have?
    params:
      unit: "%"
    answer:
      value: 60
    feedback:
      - when: numval(state.input) == 55
        misconception: unweighted-mean
        text: 55% would only be right for equal amounts. Here there is more of the strong juice.
    hints:
      - "Compute the fruit in litres: 0.6 + 2.4."
    explanation: 3 litres of fruit in 5 litres is 60%. This is a **weighted average**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: You have 4 litres of juice with 50% fruit. How many litres of water must you add to get 20%?
    params:
      unit: l
    answer:
      value: 6
    hints:
      - The fruit stays at 2 litres. Of what are 2 litres exactly 20%?
    explanation: 2 litres are 20% of 10 litres. So 6 litres of water are missing.
    difficulty: 3

srs:
  cards_from: [saft, rezept]
