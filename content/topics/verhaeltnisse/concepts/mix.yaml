id: math.ratios.mix
type: concept
title: Mischen und Rezepte
summary: Verhältnisse beim Kochen und Mixen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alle Teile zählen
    body: "Beim Mischen von Getränken zählt jeder Teil. Bei 1 : 2 kommen auf 1 Teil Sirup 2 Teile Wasser. Der Sirup ist gefärbt. Teile das Sechseck in 6 oder 12 Stücke und färbe gleich viel. Der **Anteil** bleibt gleich."
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 3
        shape: hexagon
        shaded:
          - 0
        partOptions:
          - 3
          - 6
          - 12

  - kind: problem
    id: saft
    widget: numeric
    prompt: "Saftschorle wird im Verhältnis 1 : 3 gemischt – ein Teil Saft, drei Teile Wasser. Wie viel Saft brauchst du für 2 Liter?"
    params: { unit: Liter }
    answer: { value: 0.5 }
    feedback:
      - when: "approx(numval(state.input), 2/3)"
        misconception: part-to-part
        text: Das Ganze hat 1 + 3 = 4 Teile, nicht 3.
    hints:
      - Wie viele Teile sind es insgesamt?
    explanation: 2 Liter durch 4 Teile = 0,5 Liter pro Teil. Saft ist ein Teil.

  - kind: explain
    id: s2
    body: |
      Bei **Mischungen** zählt man **alle Teile zusammen**. 1 : 3 heißt 4 Teile, davon ist einer Saft – also ein Viertel.

  - kind: problem
    id: rezept
    widget: numeric
    prompt: Ein Rezept für {{p}} Personen braucht {{g}} g Mehl. Wie viel brauchst du für {{q}} Personen?
    params: { unit: g }
    answer: { value: "{{g * q / p}}" }
    hints:
      - Rechne erst auf eine Person zurück.
    explanation: "{{g}} : {{p}} · {{q}} = {{g * q / p}} g."
    variants:
      params: { p: "choice[2,4]", q: "choice[3,6,8]", g: "choice[200,300,400]" }
      constraints: ["p != q"]
      defaults: { p: 4, q: 6, g: 400 }

  - kind: problem
    id: beton
    widget: choice
    prompt: "Beton wird 1 : 2 : 3 gemischt – Zement, Sand, Kies. Wie viel Kies steckt in 60 kg Mischung?"
    params:
      options:
        - { label: 30 kg, correct: true }
        - { label: 20 kg, feedback: "Das wäre ein Drittel. Kies hat aber 3 von 6 Teilen." }
        - { label: 18 kg, feedback: "Zähle alle Teile: 1 + 2 + 3 = 6." }
    hints:
      - 6 Teile insgesamt – wie schwer ist ein Teil?
    explanation: Ein Teil sind 10 kg, Kies hat 3 Teile – also 30 kg.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Bei 2 : 3 gibt es zusammen [[5]] Teile. Der erste Stoff hat den Anteil [[2/5]], das sind [[40 %]]."
      distractors:
        - 2/3
        - "6"

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: "Eine Schorle wird 1 : 4 gemischt – 1 Teil Saft, 4 Teile Wasser. Das Quadrat ist das ganze Glas. Färbe den Saft."
    params:
      parts: 20
      shape: square
    answer:
      fraction: 1/5
    hints:
      - "Zähl alle Teile zusammen: 1 + 4 = 5."
      - "Saft ist 1 von 5 Teilen. 20 : 5 = 4 Felder."
    explanation: "1 : 4 heißt $\\frac{1}{5}$ Saft – also 4 von 20 Feldern oder 20 %."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du mischst 2 Liter Saft mit 30 % Frucht und 3 Liter Saft mit 80 % Frucht. Wie viel Prozent Frucht hat die Mischung?
    params:
      unit: "%"
    answer:
      value: 60
    feedback:
      - when: numval(state.input) == 55
        misconception: unweighted-mean
        text: 55 % wäre nur bei gleichen Mengen richtig. Hier ist mehr vom starken Saft dabei.
    hints:
      - "Rechne die Fruchtmenge in Litern: 0,6 + 2,4."
    explanation: 3 Liter Frucht in 5 Litern sind 60 %. Das ist ein **gewichteter Mittelwert**.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Beim **Mischungsrechnen** zählst du die reine Menge. 2 L mit 30 % Frucht enthalten 0,6 L Frucht. Zum Schluss teilst du alle Frucht durch die ganze Menge.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Saft und Wasser werden 1 : {{k}} gemischt. Wie viele ml Saft brauchst du für {{m * (k + 1)}} ml Schorle?"
    params:
      unit: ml
    answer:
      value: "{{m}}"
    feedback:
      - when: numval(state.input) == m * (k + 1) / k
        misconception: forgot-part
        text: Es gibt {{k + 1}} Teile, nicht {{k}}. Der Saft zählt mit.
    hints:
      - 1 + {{k}} = {{k + 1}} Teile insgesamt.
      - "Ein Teil ist {{m * (k + 1)}} : {{k + 1}}."
    explanation: "{{m * (k + 1)}} ml : {{k + 1}} = {{m}} ml Saft."
    difficulty: 2
    variants:
      params:
        k: int[2,5]
        m: step[100,400,100]
      defaults:
        k: 3
        m: 200

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Ein Rezept für 4 Personen braucht 3 Eier. Wie viele Eier sind es für 6 Personen?
    answer:
      value: 4.5
    hints:
      - 6 Personen sind das 1,5-Fache von 4.
      - 3 · 1,5 = ?
    explanation: 4,5 Eier – in der Küche nimmt man dann 4 große oder 5 kleine. Mathe und Alltag runden verschieden.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Du hast 4 Liter Saft mit 50 % Frucht. Wie viele Liter Wasser musst du zugeben, damit es 20 % werden?
    params:
      unit: l
    answer:
      value: 6
    hints:
      - Die Fruchtmenge bleibt 2 Liter. Wovon sind 2 Liter genau 20 %?
    explanation: 2 Liter sind 20 % von 10 Litern. Es fehlen also 6 Liter Wasser.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Du brauchst 10 L Saft mit 40 % Frucht. Du hast Saft mit 20 % und Saft mit 70 %. Wie viele Liter vom 70 %-Saft brauchst du?
    params:
      unit: L
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 5
        misconception: half-half
        text: Halb-halb ergibt 45 %. Du brauchst etwas weniger vom starken Saft.
    hints:
      - "Nimm x Liter vom 70 %-Saft. Frucht: 0,7x + 0,2 · (10 − x) = 4."
      - 0,5x + 2 = 4.
    explanation: "x = 4 L vom 70 %-Saft und 6 L vom 20 %-Saft. Probe: 2,8 + 1,2 = 4 L Frucht."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Eine Mischung liegt immer zwischen ihren Zutaten. Ihr Wert ist ein **gewichtetes Mittel**: Was in größerer Menge drin ist, zieht stärker. Bei 40 % liegt man näher an 20 % – also braucht man mehr vom 20 %-Saft."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux, warum 1 : 3 gemischt ein Viertel Saft ergibt."
    params:
      keywords:
        - - vier
          - four
          - teile
          - parts
        - - zusammen
          - insgesamt
          - alle
          - total
          - together
          - all
        - - viertel
          - quarter
          - 1/4
      sample: Ein Teil Saft und drei Teile Wasser sind zusammen vier Teile. Einer davon ist Saft. Also ist ein Viertel der Mischung Saft.
    explanation: "Kernidee: Erst alle Teile zusammenzählen – der Anteil ist Teil durch Summe."
    difficulty: 3

srs:
  cards_from: [saft, rezept]
