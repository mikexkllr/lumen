id: math.ratios.ratio
type: concept
title: Ratios
summary: A ratio stays the same when both sides grow equally.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ratio.ratio]
estimated_minutes: 7
steps:
  - kind: problem
    id: saft
    widget: choice
    body: For juice, you mix 1 part syrup with 4 parts water. You take 3 parts syrup.
    prompt: How many parts of water do you need?
    params:
      layout: grid
      options:
        - { label: "12", correct: true }
        - { label: "6", feedback: "You added 2. With ratios, you multiply – three times the syrup, three times the water." }
        - { label: "7", feedback: "You added 3. The juice would be far too sweet." }
        - { label: "4", feedback: "Then the juice would be three times as sweet as before." }
    hints:
      - How many times does the syrup amount 1 fit into 3?
    explanation: Three times the syrup needs three times the water – 3 · 4 = 12.

  - kind: explain
    id: s2
    body: |
      A **ratio** like 1 ÷ 4 stays the same when you multiply both sides by the same number.
      1 ÷ 4 = 2 ÷ 8 = 3 ÷ 12.

  - kind: problem
    id: ergaenzen
    widget: numeric
    prompt: "Complete: {{a}} : {{b}} = {{a * k}} : ?"
    answer: { value: "{{b * k}}" }
    feedback:
      - when: "numval(state.input) == b + a * k - a"
        misconception: additive-ratio
        text: You added the same amount on both sides. In a ratio, you multiply.
    hints:
      - "What was {{a}} multiplied by?"
      - "{{a}} · {{k}} = {{a * k}}. Multiply {{b}} by {{k}} too."
    explanation: "{{b}} · {{k}} = {{b * k}}."
    variants:
      params: { a: "int[1,5]", b: "int[2,9]", k: "choice[2,3,4,5]" }
      constraints: ["a != b", "b + a * k - a != b * k"]
      defaults: { a: 2, b: 5, k: 3 }

  - kind: problem
    id: kacheln
    widget: tiles
    prompt: Build a ratio that is equal to 2 to 3.
    params:
      tiles: ["4", "6", "5", "9", "6", ":"]
    answer:
      anyOf: [["4", ":", "6"], ["6", ":", "9"]]
    hints:
      - Multiply 2 and 3 by the same number.
    explanation: 4 to 6 and 6 to 9 both equal 2 to 3.

  - kind: problem
    id: massstab
    widget: numeric
    prompt: On a map with a scale of 1 to 25,000, two towns are 4 cm apart. How many kilometers is that?
    params: { unit: km }
    answer: { value: 1 }
    hints:
      - 1 cm on the map is 25,000 cm in real life.
      - 100,000 cm is 1 km.
    explanation: 4 · 25,000 cm = 100,000 cm = 1 km.
    difficulty: 3

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: "2 : 3 and 10 : 15 are the same ratio."
          right: true
        - text: "2 : 3 and 3 : 2 are the same ratio."
          right: false
          why: Order matters – as with juice to water.
        - text: "1 : 4 stays the same if you add 2 to both sides."
          right: false
          why: "3 : 6 is 1 : 2. Only multiplying preserves the ratio."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "In a class the ratio of girls to boys is 3 : 2. There are 25 children. How many girls?"
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 10
        text: Those are the boys. The 3 parts of girls are asked for.
    hints:
      - "3 : 2 makes 5 parts in total. How big is one part?"
    explanation: "One part is 5 children, three parts 15. A ratio a : b means the share a/(a+b)."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The aspect ratio of an A-series sheet stays the same when halved. What is long side divided by short side? To two places.
    answer:
      value: 1.41
      tolerance: 0.01
    hints:
      - "Halving turns x : 1 into 1 : x/2. Both must be equal."
    explanation: x/1 = 1/(x/2) gives x² = 2, so x = √2 ≈ 1.41.
    difficulty: 3

srs:
  cards_from: ["ergaenzen"]
