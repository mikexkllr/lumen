id: math.ratios.ratio
type: concept
title: Verhältnisse
summary: Ein Verhältnis bleibt gleich, wenn beide Seiten gleich wachsen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ratio.ratio]
estimated_minutes: 13
steps:
  - kind: problem
    id: saft
    widget: choice
    body: Für Saft mischst du 1 Teil Sirup mit 4 Teilen Wasser. Du nimmst 3 Teile Sirup.
    prompt: Wie viele Teile Wasser brauchst du?
    params:
      layout: grid
      options:
        - { label: "12", correct: true }
        - { label: "6", feedback: "Du hast 2 dazugezählt. Bei Verhältnissen wird malgenommen – dreimal so viel Sirup, dreimal so viel Wasser." }
        - { label: "7", feedback: "Du hast 3 dazugezählt. Der Saft würde viel zu süß." }
        - { label: "4", feedback: "Dann wäre der Saft dreimal so süß wie vorher." }
    hints:
      - Wie oft passt die Sirup-Menge 1 in 3?
    explanation: Dreimal so viel Sirup braucht dreimal so viel Wasser – 3 · 4 = 12.

  - kind: explain
    id: s2
    body: |
      Ein **Verhältnis** wie 1 : 4 bleibt gleich, wenn du beide Seiten mit derselben Zahl malnimmst.
      1 : 4 = 2 : 8 = 3 : 12.

  - kind: problem
    id: ergaenzen
    widget: numeric
    prompt: "Ergänze: {{a}} : {{b}} = {{a * k}} : ?"
    answer: { value: "{{b * k}}" }
    feedback:
      - when: "numval(state.input) == b + a * k - a"
        misconception: additive-ratio
        text: Du hast auf beiden Seiten gleich viel addiert. Im Verhältnis wird malgenommen.
    hints:
      - "Mit welcher Zahl wurde {{a}} malgenommen?"
      - "{{a}} · {{k}} = {{a * k}}. Nimm auch {{b}} mal {{k}}."
    explanation: "{{b}} · {{k}} = {{b * k}}."
    variants:
      params: { a: "int[1,5]", b: "int[2,9]", k: "choice[2,3,4,5]" }
      constraints: ["a != b", "b + a * k - a != b * k"]
      defaults: { a: 2, b: 5, k: 3 }

  - kind: problem
    id: kacheln
    widget: tiles
    prompt: Lege ein Verhältnis, das genauso groß ist wie 2 zu 3.
    params:
      tiles: ["4", "6", "5", "9", "6", ":"]
    answer:
      anyOf: [["4", ":", "6"], ["6", ":", "9"]]
    hints:
      - Nimm 2 und 3 mit derselben Zahl mal.
    explanation: 4 zu 6 und 6 zu 9 sind beide gleich 2 zu 3.

  - kind: problem
    id: massstab
    widget: numeric
    prompt: Auf einer Karte im Maßstab 1 zu 25 000 liegen zwei Orte 4 cm auseinander. Wie viele Kilometer sind das?
    params: { unit: km }
    answer: { value: 1 }
    hints:
      - 1 cm auf der Karte sind 25 000 cm in echt.
      - 100 000 cm sind 1 km.
    explanation: 4 · 25 000 cm = 100 000 cm = 1 km.
    difficulty: 3

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: "2 : 3 und 10 : 15 sind dasselbe Verhältnis."
          right: true
        - text: "2 : 3 und 3 : 2 sind dasselbe Verhältnis."
          right: false
          why: Die Reihenfolge zählt – wie bei Saft zu Wasser.
        - text: "1 : 4 bleibt gleich, wenn man auf beiden Seiten 2 addiert."
          right: false
          why: "3 : 6 ist 1 : 2. Nur Malnehmen erhält das Verhältnis."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "In einer Klasse ist das Verhältnis Mädchen zu Jungen 3 : 2. Es sind 25 Kinder. Wie viele Mädchen?"
    answer:
      value: 15
    feedback:
      - when: numval(state.input) == 10
        text: Das sind die Jungen. Gefragt sind die 3 Teile Mädchen.
    hints:
      - "3 : 2 sind zusammen 5 Teile. Wie groß ist ein Teil?"
    explanation: "Ein Teil sind 5 Kinder, drei Teile 15. Ein Verhältnis a : b bedeutet den Anteil a/(a+b)."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Ein Verhältnis kann man **kürzen** wie einen Bruch: 12 : 18 = 2 : 3. Beide Seiten werden durch 6 geteilt. Das Verhältnis bleibt dasselbe."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Kürze so weit wie möglich: 24 : 36 = 2 : ?"
    answer:
      value: 3
    hints:
      - Welche größte Zahl teilt 24 und 36?
      - Beide durch 12.
    explanation: "24 : 12 = 2 und 36 : 12 = 3. Also 2 : 3."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Teile {{k * (a + b)}} € im Verhältnis {{a}} : {{b}}. Wie viel bekommt die erste Person?"
    params:
      unit: €
    answer:
      value: "{{k * a}}"
    feedback:
      - when: numval(state.input) == k * (a + b) / 2
        misconception: equal-split
        text: "Das wäre halbe-halbe. Bei {{a}} : {{b}} gibt es {{a + b}} Teile."
    hints:
      - Wie viele Teile gibt es insgesamt?
      - "Ein Teil ist {{k * (a + b)}} : {{a + b}} = {{k}} €."
    explanation: "{{a + b}} Teile zu je {{k}} €. Die erste Person bekommt {{a}} Teile: {{k * a}} €."
    difficulty: 2
    variants:
      params:
        a: int[1,4]
        b: int[2,5]
        k: step[5,20,5]
      constraints:
        - a != b
      defaults:
        a: 2
        b: 3
        k: 10

  - kind: problem
    id: ma-d4
    depth: 2
    widget: rect
    prompt: "Zieh ein Rechteck, dessen Breite zur Höhe im Verhältnis 3 : 2 steht und das 20 m Umfang hat."
    params:
      maxW: 10
      maxH: 8
      w: 2
      h: 2
    check:
      predicate: w * 2 == h * 3 && perimeter == 20
    hints:
      - Probiere 3 × 2 – und dann ein Vielfaches davon.
      - Breite + Höhe muss 10 ergeben.
    explanation: "6 × 4: 6 : 4 = 3 : 2 und 2 · (6 + 4) = 20."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Das Seitenverhältnis eines DIN-A-Blatts bleibt beim Halbieren gleich. Wie groß ist lange Seite geteilt durch kurze Seite? Auf zwei Stellen.
    answer:
      value: 1.41
      tolerance: 0.01
    hints:
      - "Aus x : 1 wird beim Halbieren 1 : x/2. Beide sollen gleich sein."
    explanation: x/1 = 1/(x/2) ergibt x² = 2, also x = √2 ≈ 1,41.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: "Ein Film im Format 16 : 9 läuft auf einem 4 : 3-Bildschirm, ganz in die Breite gezogen. Wie viel Prozent der Bildschirmhöhe bleiben schwarz?"
    params:
      unit: "%"
    answer:
      value: 25
    hints:
      - "Schreib 4 : 3 mit derselben Breite 16."
      - "4 : 3 = 16 : 12. Das Bild ist nur 9 hoch."
    explanation: Von 12 Höheneinheiten nutzt das Bild 9. Es bleiben 3 von 12, also 25 % – oben und unten je ein Streifen.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Zwei Verhältnisse sind gleich, wenn die **Produktgleichung** stimmt: Aus a : b = c : d folgt a · d = b · c. So prüft man 3 : 5 = 24 : 40 schnell: 3 · 40 = 5 · 24 = 120."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: "Löse: 3 : 5 = x : 40"
    answer:
      value: 24
    feedback:
      - when: numval(state.input) == 38
        misconception: additive-thinking
        text: Verhältnisse wachsen mit mal, nicht mit plus.
    hints:
      - Von 5 auf 40 ist mal 8.
      - 3 · 8 = ?
    explanation: "40 : 5 = 8, also x = 3 · 8 = 24. Probe: 3 · 40 = 120 = 5 · 24."
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux, warum 2 : 3 und 4 : 6 dasselbe Verhältnis sind."
    params:
      keywords:
        - - beide
          - both
          - jede seite
          - each side
        - - mal
          - doppelt
          - verdoppel
          - times
          - double
          - multipl
        - - gleich
          - dasselbe
          - same
          - equal
      sample: "Bei 4 : 6 sind beide Seiten doppelt so groß wie bei 2 : 3. Wenn man beide Seiten mit derselben Zahl malnimmt, bleibt das Verhältnis gleich."
    explanation: "Kernidee: Verhältnisse bleiben gleich, wenn man beide Seiten mit derselben Zahl multipliziert."
    difficulty: 3

srs:
  cards_from: ["ergaenzen"]
