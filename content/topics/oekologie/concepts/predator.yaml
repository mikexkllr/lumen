id: bio.ecology.predator
type: concept
title: "Räuber und Beute"
summary: "Warum Hasen und Luchse im Takt schwanken."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: order
    prompt: Viele Hasen, wenig Luchse. Was passiert danach? Ordne die Phasen.
    params:
      items:
        - label: "Viele Hasen: Luchse finden viel Futter"
        - label: Luchse werden mehr
        - label: Hasen werden weniger
        - label: Luchse hungern und werden weniger
        - label: Hasen erholen sich
    hints:
      - Was folgt aus viel Futter?
      - Erst die Beute, dann mit Verzögerung der Räuber.
    explanation: "Ein Kreislauf: Die Räuber folgen der Beute mit Verzögerung. Pelzhandel-Daten aus Kanada zeigen einen etwa zehnjährigen Takt."

  - kind: explain
    id: c1
    body: Räuber und Beute steuern sich gegenseitig. Viel Beute lässt die Räuber wachsen. Viele Räuber drücken die Beute. So entstehen **Populationszyklen**, bei denen die Räuber hinterherlaufen.

  - kind: problem
    id: c2
    widget: sim
    prompt: Die Beute vermehrt sich mit 60 % pro Jahr. Stell den Jagderfolg so ein, dass im Mittel etwa 20 Räuber leben.
    params:
      scene: predator
      controls:
        birth:
          fixed: true
    answer:
      predmean:
        - 19
        - 21
    explanation: Bei etwa 29 bis 30 ‰ Jagderfolg pendeln sich die Räuber um 20 ein. Je besser sie jagen, desto weniger braucht es davon.

  - kind: problem
    id: c3
    widget: sim
    prompt: Sorge dafür, dass die Beute nie über 80 Tiere steigt.
    params:
      scene: predator
    answer:
      preymax:
        - 0
        - 80
    explanation: Wenig Vermehrung der Beute oder gute Jäger dämpfen die Ausschläge.

  - kind: problem
    id: c4
    widget: choice
    prompt: Im Diagramm erreichen die Räuber ihr Maximum immer etwas nach der Beute. Warum?
    params:
      options:
        - label: Räuber brauchen Zeit, um aus viel Futter Nachwuchs zu machen.
          correct: true
        - label: Räuber sind langsamer beim Laufen.
          feedback: Es geht nicht um Tempo, sondern um Fortpflanzung.
        - label: Das ist Zufall.
          feedback: Die Verzögerung tritt jedes Mal auf.
    hints:
      - Mehr Futter heißt nicht sofort mehr Räuber.
      - Junge müssen erst geboren werden.
    explanation: Die Verzögerung ist der Motor der Zyklen. Ohne sie würde sich alles schnell einpendeln.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Stell den Jagderfolg auf 20 ‰ und dreh die Vermehrung der Beute auf 100 %. Beobachte die Mittelwerte.
    params:
      scene: predator
    answer:
      birth: 100
      hunt: 20
    explanation: Die Räuber steigen im Mittel auf über 50. Die Beute bleibt im Mittel bei gut 40.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Die Beute vermehrt sich viel stärker. Wer profitiert im Mittel davon?
    params:
      options:
        - label: Die Räuber – die mittlere Beutezahl bleibt fast gleich.
          correct: true
        - label: Die Beute – es gibt jetzt viel mehr Beutetiere.
          feedback: Die Spitzen steigen, doch der Mittelwert bleibt bei etwa 40.
        - label: Keiner, alles bleibt gleich.
          feedback: Die Räuber werden im Mittel deutlich mehr.
    hints:
      - Vergleiche die Mittelwerte im Labor.
      - Die zusätzlichen Beutetiere werden gefressen.
    explanation: Im Lotka-Volterra-Modell legt nur der Räuber fest, wie viel Beute im Mittel lebt. Mehr Beute-Nachwuchs füttert vor allem die Räuber.
    difficulty: 2

  - kind: explain
    id: d3
    depth: 2
    body: Das Modell heißt **Lotka-Volterra-Modell**. Die Beute wächst, solange wenige Räuber da sind. Die Räuber wachsen, solange genug Beute da ist. Zwei einfache Regeln ergeben endlose Schwingungen.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Gift tötet einen Teil von Schädlingen und ihren natürlichen Feinden gleichermaßen. Was sagt das Modell langfristig voraus?
    params:
      options:
        - label: Es gibt im Mittel sogar mehr Schädlinge als vorher.
          correct: true
        - label: Die Schädlinge verschwinden.
          feedback: Auch ihre Feinde werden weniger. Das entlastet die Schädlinge.
        - label: Nichts ändert sich.
          feedback: Das Gift verschiebt das Gleichgewicht.
    hints:
      - Was passiert mit den Räubern, wenn die Beute knapp wird?
      - Die Beute erholt sich schneller als ihre Feinde.
    explanation: Das ist das Volterra-Prinzip. Es erklärte, warum im Ersten Weltkrieg weniger Fischerei mehr Raubfische brachte – und warum Gift Schädlinge manchmal fördert.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Räuber und Beute im Takt schwanken.
    params:
      keywords:
        - - beute
          - prey
        - - räuber
          - raeuber
          - predator
        - - verzöger
          - verzoeger
          - später
          - spaeter
          - nach
          - delay
          - later
          - lag
        - - zyklus
          - schwank
          - kreis
          - cycle
          - oscillat
          - rise and fall
      sample: Gibt es viel Beute, wachsen die Räuber. Viele Räuber fressen die Beute weg, dann hungern sie und werden weniger. Mit Verzögerung erholt sich die Beute, und der Zyklus beginnt von vorn.
    explanation: Gegenseitige Abhängigkeit plus Verzögerung ergibt Schwingungen.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
