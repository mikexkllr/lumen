id: bio.ecology.predator
type: concept
title: "Predator and prey"
summary: "Why hares and lynx rise and fall in rhythm."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: order
    prompt: Many hares, few lynx. What happens next? Order the phases.
    params:
      items:
        - label: "Many hares: lynx find lots of food"
        - label: Lynx increase
        - label: Hares decline
        - label: Lynx starve and decline
        - label: Hares recover
    hints:
      - What follows from plenty of food?
      - First the prey, then the predator with a delay.
    explanation: "A cycle: predators follow prey with a delay. Fur-trade records from Canada show a roughly ten-year rhythm."

  - kind: explain
    id: c1
    body: Predators and prey control each other. Plenty of prey makes predators grow. Many predators push the prey down. This creates **population cycles** in which the predators lag behind.

  - kind: problem
    id: c2
    widget: sim
    prompt: The prey grows by 60 % a year. Set the hunting success so that about 20 predators live on average.
    params:
      scene: predator
      controls:
        birth:
          fixed: true
    answer:
      predmean:
        - 19
        - 21
    explanation: At about 29 to 30 ‰ hunting success the predators settle around 20. The better they hunt, the fewer of them it takes.

  - kind: problem
    id: c3
    widget: sim
    prompt: Make sure the prey never rises above 80 animals.
    params:
      scene: predator
    answer:
      preymax:
        - 0
        - 80
    explanation: Low prey growth or good hunters damp the swings.

  - kind: problem
    id: c4
    widget: choice
    prompt: In the graph the predators always peak a little after the prey. Why?
    params:
      options:
        - label: Predators need time to turn plenty of food into offspring.
          correct: true
        - label: Predators run more slowly.
          feedback: It is not about speed, but reproduction.
        - label: It is chance.
          feedback: The delay shows up every time.
    hints:
      - More food does not instantly mean more predators.
      - Young must first be born.
    explanation: The delay drives the cycles. Without it everything would settle quickly.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Set hunting success to 20 ‰ and turn prey growth up to 100 %. Watch the averages.
    params:
      scene: predator
    answer:
      birth: 100
      hunt: 20
    explanation: The predators rise to over 50 on average. The prey stays at just over 40 on average.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: The prey now breeds much faster. Who benefits on average?
    params:
      options:
        - label: The predators – average prey numbers stay almost the same.
          correct: true
        - label: The prey – there are now many more prey.
          feedback: The peaks rise, but the average stays around 40.
        - label: Nobody, everything stays the same.
          feedback: The predators clearly increase on average.
    hints:
      - Compare the averages in the lab.
      - The extra prey get eaten.
    explanation: In the Lotka–Volterra model only the predator sets the average prey level. Extra prey offspring mainly feed the predators.
    difficulty: 2

  - kind: explain
    id: d3
    depth: 2
    body: This model is called the **Lotka–Volterra model**. Prey grow as long as there are few predators. Predators grow as long as there is enough prey. Two simple rules produce endless oscillations.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A poison kills a share of pests and their natural enemies alike. What does the model predict in the long run?
    params:
      options:
        - label: On average there are even more pests than before.
          correct: true
        - label: The pests disappear.
          feedback: Their enemies decline too. That relieves the pests.
        - label: Nothing changes.
          feedback: The poison shifts the balance.
    hints:
      - What happens to the predators when prey gets scarce?
      - Prey recover faster than their enemies.
    explanation: This is Volterra’s principle. It explained why less fishing in World War I brought more predatory fish – and why pesticides sometimes boost pests.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why predators and prey rise and fall in rhythm.
    params:
      keywords:
        - - beute
          - prey
        - - räuber
          - raeuber
          - predator
        - - verzöger
          - verzoeger
          - später
          - spaeter
          - nach
          - delay
          - later
          - lag
        - - zyklus
          - schwank
          - kreis
          - cycle
          - oscillat
          - rise and fall
      sample: When there is plenty of prey, predators grow. Many predators eat up the prey, then starve and decline. With a delay the prey recovers, and the cycle starts again.
    explanation: Mutual dependence plus delay produces oscillations.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
