id: bio.ecology.cycles
type: concept
title: "Stoffkreisläufe"
summary: "Energie fließt durch, Stoffe kreisen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Atome auf Weltreise
    body: Luft besteht fast zu vier Fünfteln aus Stickstoff. Jedes Eiweiß in dir braucht ihn. Deck auf, wie ein Stickstoffatom durch Boden, Pflanze und Tier wandert – und wieder zurück. So läuft ein **Stoffkreislauf**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🌬️
            front: In der Luft
            back: Als N₂ schwebt er überall. Pflanzen können ihn so nicht nutzen.
          - icon: 🦠
            front: Bakterien im Boden
            back: Sie wandeln ihn in Stoffe um, die Wurzeln aufnehmen können.
          - icon: 🌾
            front: In Pflanze und Tier
            back: Die Pflanze baut daraus Eiweiß. Wer sie frisst, übernimmt es.
          - icon: 🍂
            front: Zurück in den Boden
            back: Zersetzer bauen Reste ab. Ein Teil wird wieder zu N₂ in der Luft.

  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Kohlenstoffatom in deinem Arm – wo war es vermutlich vor einem Jahr?
    params:
      options:
        - label: In der Luft, als CO₂ – dann in einer Pflanze und in deinem Essen
          correct: true
        - label: Schon immer in deinem Arm
          feedback: Dein Körper tauscht ständig Atome aus.
        - label: Es wurde in deinem Körper neu gemacht.
          feedback: Atome entstehen nicht im Körper. Sie wandern im Kreis.
    hints:
      - Woher kommt der Kohlenstoff in deinem Essen?
      - Pflanzen holen ihn aus der Luft.
    explanation: "Kohlenstoff kreist: Luft, Pflanze, Tier, Luft. Du atmest täglich einen Teil davon wieder aus."

  - kind: explain
    id: c1
    body: Energie kommt von der Sonne und geht als Wärme verloren. Stoffe wie Kohlenstoff und Stickstoff aber bleiben auf der Erde. Sie wandern im **Stoffkreislauf** immer wieder durch Lebewesen.

  - kind: problem
    id: c2
    widget: order
    prompt: Folge dem Kohlenstoff durch den Kreislauf.
    params:
      items:
        - label: CO₂ in der Luft
        - label: Zucker im Blatt
        - label: Fett in einem Reh
        - label: Totes Reh am Boden
        - label: Zersetzer atmen CO₂ aus
    hints:
      - Wer holt CO₂ aus der Luft?
      - Am Ende geben Pilze und Bakterien es zurück.
    explanation: Photosynthese bindet, Fressen gibt weiter, Atmung und Zersetzung lassen frei.

  - kind: problem
    id: c3
    widget: swipe
    prompt: Energie oder Stoff – fließt das im Kreis?
    params:
      cards:
        - text: Kohlenstoff
          right: true
          why: Er wird immer wieder verwendet.
        - text: Sonnenenergie
          right: false
          why: Sie endet als Wärme im Weltall.
        - text: Stickstoff
          right: true
          why: Er wandert zwischen Luft, Boden und Lebewesen.
        - text: Wasser
          right: true
          why: Regen, Fluss, Meer, Wolke – ein Kreislauf.
      left: fließt durch
      right: kreist
    explanation: Stoffe kreisen, Energie fließt nur hindurch. Darum braucht das Leben ständig Sonnenlicht.

  - kind: problem
    id: c4
    widget: choice
    prompt: Warum ist Kompost ein guter Dünger?
    params:
      options:
        - label: Zersetzer haben die Reste abgebaut und Mineralstoffe freigesetzt.
          correct: true
        - label: Kompost enthält viel Sonnenenergie.
          feedback: Pflanzen holen Energie aus Licht, nicht aus dem Boden.
        - label: Kompost ist besonders sauer.
          feedback: Säure düngt nicht. Es geht um Nährstoffe.
    hints:
      - Was machen Pilze und Würmer mit Laub?
      - Pflanzen nehmen Mineralstoffe über die Wurzeln auf.
    explanation: "Im Kompost schließt sich der Kreis: Aus Abfall werden wieder Nährstoffe für neue Pflanzen."

  - kind: explain
    id: d1
    depth: 2
    body: Luft besteht zu 78 % aus Stickstoff. Trotzdem können Pflanzen ihn so nicht nutzen. Nur einige Bakterien wandeln ihn in nutzbare Stoffe um. Das heißt **Stickstofffixierung**.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Bauern säen nach dem Weizen oft Klee oder Bohnen. Warum?
    params:
      options:
        - label: In ihren Wurzelknöllchen leben Bakterien, die Stickstoff aus der Luft binden.
          correct: true
        - label: Sie vertreiben Schädlinge.
          feedback: Das kann nebenbei passieren. Der Hauptgrund ist Dünger aus der Luft.
        - label: Sie brauchen kein Wasser.
          feedback: Auch Bohnen brauchen Wasser. Es geht um Stickstoff.
    hints:
      - Welcher Nährstoff ist im Boden oft knapp?
      - Hülsenfrüchte arbeiten mit Bakterien zusammen.
    explanation: Knöllchenbakterien düngen den Boden ganz natürlich. Das nächste Getreide wächst besser.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Bindet das Kohlenstoff – oder setzt es ihn frei?
    params:
      buckets:
        - id: b1
          label: bindet
        - id: b2
          label: setzt frei
      items:
        - label: Photosynthese
          bucket: b1
        - label: Torf wächst im Moor
          bucket: b1
        - label: Atmung
          bucket: b2
        - label: Kohle verbrennen
          bucket: b2
        - label: Laub verrottet
          bucket: b2
    hints:
      - Wird CO₂ aus der Luft geholt oder hineingegeben?
      - Im nassen Moor zersetzt sich wenig, es sammelt sich an.
    explanation: Moore und Wälder speichern Kohlenstoff. Verbrennen und Zersetzen geben ihn zurück.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kohle und Erdöl sind gespeicherter Kohlenstoff. Woher stammt er ursprünglich?
    params:
      options:
        - label: Aus CO₂, das Pflanzen und Plankton vor Millionen Jahren banden
          correct: true
        - label: Aus dem Erdinneren
          feedback: Die Gesteinswärme formte sie, aber der Kohlenstoff kam aus Lebewesen.
        - label: Aus Meteoriten
          feedback: Meteoriten liefern nur Spuren davon.
    hints:
      - Fossile Brennstoffe sind alte Lebewesen.
      - Und Lebewesen bekommen Kohlenstoff aus der Luft.
    explanation: Wer Kohle verbrennt, gibt in Jahren frei, was in Millionen Jahren gebunden wurde. So steigt CO₂ in der Luft.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Energie durch ein Ökosystem fließt, Stoffe aber kreisen.
    params:
      keywords:
        - - sonne
          - licht
          - sun
          - light
        - - wärme
          - waerme
          - heat
        - - kreis
          - cycle
          - wieder
          - again
        - - zersetz
          - pilz
          - bakter
          - decompos
          - fungi
          - bacteri
      sample: Energie kommt als Licht von der Sonne und geht als Wärme verloren. Stoffe wie Kohlenstoff bleiben. Zersetzer geben sie aus toten Resten wieder frei, und so kreisen sie immer wieder.
    explanation: Licht rein, Wärme raus – und die Stoffe dazwischen werden recycelt.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
