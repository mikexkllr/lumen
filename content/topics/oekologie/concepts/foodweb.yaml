id: bio.ecology.foodweb
type: concept
title: "Wer frisst wen?"
summary: "Nahrungsketten, Nahrungsnetze und Schlüsselarten."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: order
    prompt: Bau eine Nahrungskette auf einer Wiese. Wer wird von wem gefressen?
    params:
      items:
        - label: Gras
        - label: Heuschrecke
        - label: Frosch
        - label: Storch
      startLabel: wird gefressen
      endLabel: frisst
    hints:
      - Wer braucht kein Futter, sondern Licht?
      - Der Storch frisst Frösche.
    explanation: "Gras, Heuschrecke, Frosch, Storch: Jeder Pfeil zeigt, wohin Energie fließt."

  - kind: explain
    id: c1
    body: "Jede Nahrungskette beginnt mit **Produzenten**: Pflanzen und Algen, die aus Licht Nahrung machen. Danach kommen Konsumenten, die fressen. Zersetzer wie Pilze und Bakterien bauen tote Reste ab."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Produzent, Konsument oder Zersetzer?
    params:
      buckets:
        - id: b1
          label: Produzent
        - id: b2
          label: Konsument
        - id: b3
          label: Zersetzer
      items:
        - label: Eiche
          bucket: b1
        - label: Grünalge
          bucket: b1
        - label: Reh
          bucket: b2
        - label: Fuchs
          bucket: b2
        - label: Schimmelpilz
          bucket: b3
        - label: Bodenbakterien
          bucket: b3
    hints:
      - Wer nutzt Licht, wer frisst Lebendes, wer Totes?
      - Pilze machen keine Photosynthese.
    explanation: Produzenten bauen Nahrung, Konsumenten fressen sie, Zersetzer schließen den Kreis.

  - kind: explain
    id: c3
    body: In der Natur fressen die meisten Tiere mehr als eine Art. Aus vielen Ketten wird so ein **Nahrungsnetz**. Fällt eine Art weg, gibt es oft andere Wege.

  - kind: problem
    id: c4
    widget: choice
    prompt: In einem Wald fressen Füchse Mäuse und Kaninchen. Eine Krankheit tötet fast alle Kaninchen. Was passiert vermutlich mit den Mäusen?
    params:
      options:
        - label: Sie werden weniger, weil die Füchse mehr Mäuse jagen.
          correct: true
        - label: Sie werden mehr, weil Kaninchen fehlen.
          feedback: Konkurrenz um Futter sinkt, aber die Füchse wechseln auf Mäuse.
        - label: Nichts – Mäuse und Kaninchen haben nichts miteinander zu tun.
          feedback: Im Netz hängen sie über den Fuchs zusammen.
    hints:
      - Was fressen die Füchse jetzt?
      - Im Netz wirkt eine Änderung über Umwege.
    explanation: "Im Netz hängt alles zusammen: Der Druck der Räuber verlagert sich auf die Mäuse."

  - kind: explain
    id: d1
    depth: 2
    body: Manche Arten halten ein ganzes Netz zusammen. Fehlen sie, kippt das System. Man nennt sie **Schlüsselarten**. Ein Beispiel ist der Seeotter an der Pazifikküste.

  - kind: problem
    id: d2
    depth: 2
    widget: order
    prompt: Seeotter fressen Seeigel, Seeigel fressen Seetang. Die Otter werden gejagt. Was folgt?
    params:
      items:
        - label: Weniger Seeotter
        - label: Mehr Seeigel
        - label: Weniger Seetang
        - label: Weniger Fische im Tangwald
    hints:
      - Wer wird nicht mehr gefressen?
      - Seeigel weiden den Tang kahl.
    explanation: "Das ist eine trophische Kaskade: Die Wirkung springt Stufe für Stufe nach unten."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Stimmt das?
    params:
      cards:
        - text: Ohne Zersetzer würden Laub und tote Tiere liegen bleiben.
          right: true
          why: Erst Pilze und Bakterien machen daraus wieder Nährstoffe.
        - text: Ein Raubtier steht immer am Anfang einer Nahrungskette.
          right: false
          why: Am Anfang stehen immer Produzenten.
        - text: Ein Mensch kann auf mehreren Stufen essen.
          right: true
          why: Salat ist Stufe 1, Rindfleisch Stufe 2, Lachs noch höher.
        - text: Je mehr Arten, desto anfälliger ist ein Netz.
          right: false
          why: Meist puffern viele Arten Störungen besser ab.
    explanation: Netze sind robuster als Ketten – solange die Schlüsselarten da sind.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Robert Paine entfernte 1963 an einer Felsküste alle Seesterne. Bald lebten dort statt 15 nur noch wenige Arten. Warum weniger statt mehr?
    params:
      options:
        - label: Ohne den Räuber verdrängten Muscheln alle anderen vom Fels.
          correct: true
        - label: Die Seesterne waren die Nahrung aller anderen.
          feedback: Seesterne sind Räuber, kaum Beute.
        - label: Das Wasser wurde dadurch giftig.
          feedback: Es gab keine Vergiftung. Es ging um Konkurrenz um Platz.
    hints:
      - Platz am Fels ist knapp.
      - Der Seestern fraß vor allem die stärkste Konkurrentin.
    explanation: Der Räuber hielt den stärksten Konkurrenten klein. So blieb Platz für viele. Paine prägte daraus den Begriff Schlüsselart.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Nahrungskette und Nahrungsnetz.
    params:
      keywords:
        - - produzent
          - pflanze
          - producer
          - plant
        - - kette
          - chain
        - - netz
          - web
        - - mehr als
          - viele
          - verschiedene
          - more than
          - many
          - several
      sample: Eine Nahrungskette ist eine Reihe von der Pflanze, dem Produzenten, bis zum Räuber. In echt fressen Tiere viele verschiedene Arten. Darum verknüpfen sich viele Ketten zu einem Netz.
    explanation: Ketten sind vereinfacht, Netze zeigen die echten Verbindungen.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d2"]
