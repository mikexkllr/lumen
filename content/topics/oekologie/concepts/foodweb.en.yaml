id: bio.ecology.foodweb
type: concept
title: "Who eats whom?"
summary: "Food chains, food webs and keystone species."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: It all hangs on krill
    body: In the Southern Ocean almost everything depends on krill, tiny crustaceans. Tap a chain from the algae to the orca. Then find a second route. Many interwoven chains form a **food web**.
    visual:
      widget: network
      interactive: true
      params:
        start: A
        end: O
        nodes:
          - id: A
            x: 6
            y: 50
            label: Algae
          - id: K
            x: 32
            y: 50
            label: Krill
          - id: W
            x: 58
            y: 8
            label: Whale
          - id: F
            x: 58
            y: 50
            label: Fish
          - id: P
            x: 58
            y: 92
            label: Penguin
          - id: O
            x: 88
            y: 25
            label: Orca
          - id: S
            x: 88
            y: 70
            label: Seal
        edges:
          - a: A
            b: K
          - a: K
            b: W
          - a: K
            b: F
          - a: K
            b: P
          - a: F
            b: P
          - a: F
            b: S
          - a: P
            b: S
          - a: S
            b: O
          - a: W
            b: O
          - a: F
            b: O

  - kind: problem
    id: hook
    widget: order
    prompt: Build a food chain in a meadow. Who gets eaten by whom?
    params:
      items:
        - label: Grass
        - label: Grasshopper
        - label: Frog
        - label: Stork
      startLabel: gets eaten
      endLabel: eats
    hints:
      - Who needs no food, only light?
      - The stork eats frogs.
    explanation: "Grass, grasshopper, frog, stork: each arrow shows where energy flows."

  - kind: explain
    id: c1
    body: "Every food chain starts with **producers**: plants and algae that make food from light. Then come consumers, which eat. Decomposers such as fungi and bacteria break down dead remains."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Producer, consumer or decomposer?
    params:
      buckets:
        - id: b1
          label: Producer
        - id: b2
          label: Consumer
        - id: b3
          label: Decomposer
      items:
        - label: Oak
          bucket: b1
        - label: Green alga
          bucket: b1
        - label: Deer
          bucket: b2
        - label: Fox
          bucket: b2
        - label: Mould
          bucket: b3
        - label: Soil bacteria
          bucket: b3
    hints:
      - Who uses light, who eats the living, who the dead?
      - Fungi do not photosynthesise.
    explanation: Producers build food, consumers eat it, decomposers close the loop.

  - kind: explain
    id: c3
    body: In nature most animals eat more than one species. So many chains form a **food web**. If one species drops out, there are often other routes.

  - kind: problem
    id: c4
    widget: choice
    prompt: In a forest, foxes eat mice and rabbits. A disease kills almost all the rabbits. What probably happens to the mice?
    params:
      options:
        - label: They decline because the foxes hunt more mice.
          correct: true
        - label: They increase because rabbits are gone.
          feedback: Competition for food drops, but the foxes switch to mice.
        - label: Nothing – mice and rabbits have nothing to do with each other.
          feedback: In the web they are linked through the fox.
    hints:
      - What do the foxes eat now?
      - In a web a change acts through detours.
    explanation: "In a web everything is linked: predator pressure shifts onto the mice."

  - kind: problem
    id: intro-c1
    widget: network
    prompt: On a meadow all the mice have fallen ill and are gone. Tap a food chain from the grass to the owl anyway.
    params:
      start: G
      end: E
      nodes:
        - id: G
          x: 6
          y: 50
          label: Grass
        - id: H
          x: 34
          y: 12
          label: Cricket
        - id: M
          x: 34
          y: 50
          label: Mouse
        - id: K
          x: 34
          y: 88
          label: Hare
        - id: R
          x: 66
          y: 12
          label: Frog
        - id: E
          x: 90
          y: 40
          label: Owl
        - id: F
          x: 90
          y: 85
          label: Fox
      edges:
        - a: G
          b: H
        - a: G
          b: M
        - a: G
          b: K
        - a: H
          b: M
        - a: H
          b: R
        - a: M
          b: F
        - a: M
          b: E
        - a: K
          b: F
        - a: R
          b: E
    check:
      predicate: complete && !path.includes("M")
    solution:
      state:
        path:
          - G
          - H
          - R
          - E
        colors: {}
        edges: []
    feedback:
      - when: path.includes("M")
        text: The mouse is gone. Find a route that does not go through it.
    hints:
      - The owl does not only eat mice.
      - Go via the cricket and the frog.
    explanation: Grass → cricket → frog → owl. Because the owl has several kinds of prey, the web does not collapse.

  - kind: explain
    id: d1
    depth: 2
    body: Some species hold a whole web together. Without them the system collapses. They are called **keystone species**. One example is the sea otter on the Pacific coast.

  - kind: problem
    id: d2
    depth: 2
    widget: order
    prompt: Sea otters eat sea urchins, sea urchins eat kelp. The otters are hunted. What follows?
    params:
      items:
        - label: Fewer sea otters
        - label: More sea urchins
        - label: Less kelp
        - label: Fewer fish in the kelp forest
    hints:
      - Who is no longer eaten?
      - Sea urchins graze the kelp bare.
    explanation: "This is a trophic cascade: the effect jumps down level by level."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: True or false?
    params:
      cards:
        - text: Without decomposers, leaves and dead animals would pile up.
          right: true
          why: Only fungi and bacteria turn them back into nutrients.
        - text: A predator is always at the start of a food chain.
          right: false
          why: Producers are always at the start.
        - text: A human can eat at several levels.
          right: true
          why: Salad is level 1, beef level 2, salmon even higher.
        - text: The more species, the more fragile a web is.
          right: false
          why: Usually many species buffer disturbances better.
    explanation: Webs are more robust than chains – as long as the keystone species remain.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In 1963 Robert Paine removed all starfish from a rocky shore. Soon only a few species lived there instead of 15. Why fewer, not more?
    params:
      options:
        - label: Without the predator, mussels crowded everyone else off the rock.
          correct: true
        - label: The starfish were food for all the others.
          feedback: Starfish are predators, hardly prey.
        - label: The water became toxic.
          feedback: There was no poisoning. It was about competition for space.
    hints:
      - Space on the rock is scarce.
      - The starfish mainly ate the strongest competitor.
    explanation: The predator kept the strongest competitor in check, leaving room for many. Paine coined the term keystone species from this.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between a food chain and a food web.
    params:
      keywords:
        - - produzent
          - pflanze
          - producer
          - plant
        - - kette
          - chain
        - - netz
          - web
        - - mehr als
          - viele
          - verschiedene
          - more than
          - many
          - several
      sample: A food chain is a line from the plant, the producer, up to the predator. In reality animals eat many different species. So many chains link up into a web.
    explanation: Chains are simplified, webs show the real connections.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d2"]
