id: bio.ecology.cycles
type: concept
title: "Nutrient cycles"
summary: "Energy flows through, matter goes round."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Atoms on a world tour
    body: Air is almost four-fifths nitrogen. Every protein in you needs it. Uncover how a nitrogen atom travels through soil, plant and animal – and back again. That is how a **nutrient cycle** works.
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🌬️
            front: In the air
            back: As N₂ it floats everywhere. Plants cannot use it in this form.
          - icon: 🦠
            front: Bacteria in the soil
            back: They turn it into substances that roots can take up.
          - icon: 🌾
            front: In plant and animal
            back: The plant builds protein from it. Whoever eats the plant takes it over.
          - icon: 🍂
            front: Back to the soil
            back: Decomposers break down remains. Some of it becomes N₂ in the air again.

  - kind: problem
    id: hook
    widget: choice
    prompt: A carbon atom in your arm – where was it probably a year ago?
    params:
      options:
        - label: In the air as CO₂ – then in a plant and in your food
          correct: true
        - label: Always in your arm
          feedback: Your body constantly swaps atoms.
        - label: It was newly made in your body.
          feedback: Atoms are not created in the body. They go round in cycles.
    hints:
      - Where does the carbon in your food come from?
      - Plants take it from the air.
    explanation: "Carbon goes round: air, plant, animal, air. Every day you breathe some of it back out."

  - kind: explain
    id: c1
    body: Energy comes from the sun and is lost as heat. But substances like carbon and nitrogen stay on Earth. They pass through living things again and again in a **nutrient cycle**.

  - kind: problem
    id: c2
    widget: order
    prompt: Follow the carbon around the cycle.
    params:
      items:
        - label: CO₂ in the air
        - label: Sugar in a leaf
        - label: Fat in a deer
        - label: Dead deer on the ground
        - label: Decomposers breathe out CO₂
    hints:
      - Who takes CO₂ from the air?
      - In the end, fungi and bacteria give it back.
    explanation: Photosynthesis binds, eating passes it on, respiration and decay release it.

  - kind: problem
    id: c3
    widget: swipe
    prompt: Energy or matter – does it go round in a cycle?
    params:
      cards:
        - text: Carbon
          right: true
          why: It is used again and again.
        - text: Solar energy
          right: false
          why: It ends up as heat in space.
        - text: Nitrogen
          right: true
          why: It moves between air, soil and living things.
        - text: Water
          right: true
          why: Rain, river, sea, cloud – a cycle.
      left: flows through
      right: cycles
    explanation: Matter cycles, energy only flows through. That is why life constantly needs sunlight.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why is compost a good fertiliser?
    params:
      options:
        - label: Decomposers have broken down the remains and released minerals.
          correct: true
        - label: Compost contains lots of solar energy.
          feedback: Plants get energy from light, not from soil.
        - label: Compost is especially acidic.
          feedback: Acid does not fertilise. It is about nutrients.
    hints:
      - What do fungi and worms do with leaves?
      - Plants take up minerals through their roots.
    explanation: "In compost the loop closes: waste becomes nutrients for new plants again."

  - kind: explain
    id: d1
    depth: 2
    body: Air is 78 % nitrogen. Yet plants cannot use it in that form. Only some bacteria turn it into usable compounds. This is called **nitrogen fixation**.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: After wheat, farmers often sow clover or beans. Why?
    params:
      options:
        - label: Bacteria living in their root nodules fix nitrogen from the air.
          correct: true
        - label: They drive away pests.
          feedback: That may happen too. The main reason is fertiliser from the air.
        - label: They need no water.
          feedback: Beans need water too. It is about nitrogen.
    hints:
      - Which nutrient is often scarce in soil?
      - Legumes work together with bacteria.
    explanation: Root nodule bacteria fertilise the soil naturally. The next crop grows better.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Does this bind carbon – or release it?
    params:
      buckets:
        - id: b1
          label: binds
        - id: b2
          label: releases
      items:
        - label: Photosynthesis
          bucket: b1
        - label: Peat grows in a bog
          bucket: b1
        - label: Respiration
          bucket: b2
        - label: Burning coal
          bucket: b2
        - label: Leaves rot
          bucket: b2
    hints:
      - Is CO₂ taken from the air or put into it?
      - In a wet bog little decays, so it piles up.
    explanation: Bogs and forests store carbon. Burning and decay give it back.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Coal and oil are stored carbon. Where did it originally come from?
    params:
      options:
        - label: From CO₂ that plants and plankton bound millions of years ago
          correct: true
        - label: From deep inside the Earth
          feedback: Heat from the rock shaped them, but the carbon came from living things.
        - label: From meteorites
          feedback: Meteorites supply only traces.
    hints:
      - Fossil fuels are ancient organisms.
      - And organisms get carbon from the air.
    explanation: Burning coal releases in years what took millions of years to bind. That is why CO₂ in the air is rising.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why energy flows through an ecosystem while matter cycles.
    params:
      keywords:
        - - sonne
          - licht
          - sun
          - light
        - - wärme
          - waerme
          - heat
        - - kreis
          - cycle
          - wieder
          - again
        - - zersetz
          - pilz
          - bakter
          - decompos
          - fungi
          - bacteri
      sample: Energy arrives as light from the sun and is lost as heat. Matter like carbon stays. Decomposers release it from dead remains, so it goes round again and again.
    explanation: Light in, heat out – and the matter in between is recycled.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
