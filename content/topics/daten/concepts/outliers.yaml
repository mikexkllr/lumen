id: stats.data.outliers
type: concept
title: Ausreißer
summary: Ein Wert, der alles verzerrt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: millionaer
    widget: choice
    prompt: In einer Kneipe sitzen 9 Leute mit je 3000 € Einkommen. Eine Milliardärin kommt herein. Was passiert?
    params:
      options:
        - { label: Der Mittelwert explodiert – der Median bleibt fast gleich., correct: true }
        - { label: Beide steigen stark., feedback: "Der Median ist der mittlere Wert – er bleibt bei 3000 €." }
        - { label: Nichts ändert sich., feedback: "Der Mittelwert springt auf über 100 Millionen €." }
    hints:
      - Der Median ist der mittlere Wert der sortierten Liste.
    explanation: Ein extremer Wert zieht den Mittelwert, nicht den Median.

  - kind: explain
    id: s2
    body: |
      Ein **Ausreißer** ist ein Wert, der weit von den anderen liegt. Er kann ein Messfehler sein – oder echt.
      Bei Einkommen nennt man darum oft den Median.

  - kind: problem
    id: ziehen
    widget: chart
    prompt: Ziehe die Säule E nach oben und beobachte. Stelle sie so ein, dass der Mittelwert genau 6 ist.
    params:
      labels: [A, B, C, D, E]
      values: [4, 4, 5, 5, 2]
      editable: [4]
      min: 0
      max: 20
      step: 1
      show: [mean, median]
    check: { predicate: "avg == 6" }
    hints:
      - Für Mittelwert 6 braucht es die Summe 30.
    explanation: 4 + 4 + 5 + 5 + 12 = 30. Der Median bleibt bei 5 – er ignoriert den Ausreißer.

  - kind: problem
    id: wann
    widget: buckets
    prompt: Was ist hier aussagekräftiger?
    params:
      buckets: [{ label: Median }, { label: Mittelwert }]
      items:
        - { label: Typisches Einkommen, bucket: Median }
        - { label: Typischer Hauspreis, bucket: Median }
        - { label: Durchschnittsnote ohne Ausreißer, bucket: Mittelwert }
        - { label: Gesamte Regenmenge pro Tag im Schnitt, bucket: Mittelwert }
    hints:
      - Gibt es wenige riesige Werte?
    explanation: Bei schiefen Daten mit Extremen ist der Median robuster.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In einer Messreihe steht 172, 168, 175, 1700, 170 cm. Was tust du mit der 1700?
    params:
      options:
        - label: "Prüfen: vermutlich ein Tippfehler – begründet korrigieren oder ausschließen und das dokumentieren"
          correct: true
        - label: Immer drin lassen – Daten darf man nie anfassen
          feedback: Offensichtliche Fehler zu behalten verfälscht das Ergebnis.
        - label: Stillschweigend löschen
          feedback: Ohne Begründung und Vermerk ist das Manipulation.
    hints:
      - Ist ein 17 Meter großer Mensch plausibel?
    explanation: "Ausreißer weder blind behalten noch blind löschen: prüfen, entscheiden, offenlegen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wann ist der Median besser als der Mittelwert?"
    params:
      keywords:
        - - ausreißer
          - extrem
          - outlier
          - extreme
          - schief
          - skew
        - - mitte
          - middle
          - hälfte
          - half
        - - verzerr
          - zieh
          - beeinfluss
          - distort
          - pull
          - affect
          - robust
      sample: Wenn die Daten Ausreißer haben oder schief verteilt sind, etwa bei Einkommen. Extreme Werte verzerren den Mittelwert, während der Median als Wert in der Mitte fast unberührt bleibt.
    difficulty: 3

srs:
  cards_from: [millionaer, wann]
