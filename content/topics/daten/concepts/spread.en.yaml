id: stats.data.spread
type: concept
title: How far does it spread?
summary: Same average, completely different data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Same average, different weather
    body: Two places average 15 degrees. One is always mild, the other sometimes icy, sometimes hot. Drag the bars apart and back together. Watch the **spread** and the line of the mean.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - Jan
          - Apr
          - Jul
          - Oct
        values:
          - 15
          - 15
          - 15
          - 15
        editable:
          - 0
          - 1
          - 2
          - 3
        min: 0
        max: 30
        show:
          - mean
        title: Temperature in °C

  - kind: problem
    id: zwei-klassen
    widget: choice
    body: Class A has the grades 3, 3, 3, 3. Class B has 1, 1, 5, 5.
    prompt: What is true?
    params:
      options:
        - { label: Same average – but B spreads much more., correct: true }
        - { label: A is better., feedback: "Both have an average of 3." }
        - { label: Both are the same., feedback: "The average is the same, the distribution is not." }
    hints:
      - Calculate both means.
    explanation: The mean alone doesn't tell you how different the values are.

  - kind: explain
    id: s2
    body: |
      The **range** is the distance from the smallest to the largest value. It shows how far data spreads.
      Two data sets can have the same mean and completely different ranges.

  - kind: problem
    id: bauen
    widget: chart
    prompt: Drag the bars so that the mean stays 5, but the range is 8.
    params:
      labels: [A, B, C, D]
      values: [5, 5, 5, 5]
      editable: [0, 1, 2, 3]
      min: 0
      max: 10
      step: 1
      show: [mean]
    check: { predicate: "avg == 5 && max(values) - min(values) == 8" }
    solution: { state: { values: [1, 5, 5, 9] } }
    hints:
      - Make one bar 4 smaller and another 4 larger.
    explanation: For example 1, 5, 5, 9 – average 5, range 8.

  - kind: problem
    id: spannweite
    widget: numeric
    prompt: "Temperatures in one week: {{a}}, 12, 15, {{b}}, 14 °C. What is the range?"
    params: { unit: "°C" }
    answer: { value: "{{b - a}}" }
    hints:
      - Largest minus smallest value.
    explanation: "{{b}} − {{a}} = {{b - a}} °C."
    variants:
      params: { a: "int[3,9]", b: "int[17,25]" }
      defaults: { a: 8, b: 19 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The **standard deviation** measures the typical distance from the mean. For 2, 4, 4, 4, 5, 5, 7, 9 the mean is 5 and the sum of squared distances is 32. What is it?
    answer:
      value: 2
    hints:
      - 32 divided by 8 values, then the square root.
    explanation: √4 = 2. Squaring makes distances positive and weights large ones more.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: The mean is 100. Make the spread so large that only about half lie between 85 and 115.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 48
        - 52
    explanation: At a spread of about 22. The same mean but far more values far out.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Values: 1, 3, 5, 7, 9. The mean is 5. The variance is the mean of the squared distances. What is it?"
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 40
        misconception: forgot-divide
        text: That is the sum of squares. Now divide by 5.
      - when: numval(state.input) == 0
        misconception: no-square
        text: The distances cancel – that is why we square them.
    hints:
      - "Distances: −4, −2, 0, 2, 4. Square them."
      - 16 + 4 + 0 + 4 + 16 = 40. Divide by 5.
    explanation: "40 ÷ 5 = 8. The standard deviation is its square root: √8 ≈ 2.83."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: order
    prompt: Put the steps for computing the standard deviation by hand in order.
    params:
      items:
        - label: Compute the mean
        - label: Distance of each value from the mean
        - label: Square the distances
        - label: Average the squares – that is the variance
        - label: Take the square root
    hints:
      - Without a mean there are no distances.
      - At the end the root undoes the squaring.
    explanation: "The root brings back the unit: cm² turns into cm again."
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: chart
    prompt: Set the four bars so that the mean is 5 and every bar is exactly 2 away from the mean.
    params:
      labels:
        - A
        - B
        - C
        - D
      values:
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      step: 1
      show:
        - mean
    check:
      predicate: avg == 5 && abs(values[0] - 5) == 2 && abs(values[1] - 5) == 2 && abs(values[2] - 5) == 2 && abs(values[3] - 5) == 2
    solution:
      state:
        values:
          - 3
          - 7
          - 3
          - 7
    hints:
      - Every bar sits at 3 or at 7.
      - For the mean to stay 5 you need two of each.
    explanation: For example 3, 7, 3, 7. All distances are 2 – so the standard deviation is exactly 2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why not simply use the range for spread?
    params:
      options:
        - label: It depends only on the two most extreme values – one outlier is enough to distort it
          correct: true
        - label: It is too hard to compute
          feedback: It is the simplest quantity of all.
        - label: It is always zero
          feedback: Only if all values are equal.
    hints:
      - How many of the values enter the range?
    explanation: "More robust is the **interquartile range**: the width of the middle 50% of the data."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: You add 10 to every value. Then you double every value. What happens to the standard deviation σ = 3?
    params:
      options:
        - label: It becomes 6
          correct: true
        - label: Adding 10 only shifts; the distances stay the same.
          feedback: Plus 10 verschiebt nur, die Abstände bleiben gleich.
        - label: Doubling stretches all the distances.
          feedback: Das Verdoppeln streckt alle Abstände.
        - label: "That is the variance story: 3² · 4 = 36 = 6²."
          feedback: "Das gilt für die Varianz: 3² · 4 = 36 = 6²."
    hints:
      - What does a shift do to the distances?
      - And what does doubling do to the distances?
    explanation: Shifting leaves σ unchanged. Stretching by 2 doubles σ. The variance grows by 2² = 4.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "A shortcut: variance = mean of the squares minus the square of the mean. For 1, 2, 3 the mean of the squares is 14/3. What is the variance? As a fraction."
    answer:
      value: 2/3
    hints:
      - The mean is 2, its square is 4.
      - Compute 14/3 − 4 = 14/3 − 12/3.
    explanation: "14/3 − 12/3 = 2/3. Check: distances −1, 0, 1 → squares 1, 0, 1 → mean 2/3."
    difficulty: 3

  - kind: problem
    id: da-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why we square the distances from the mean before averaging them.
    params:
      keywords:
        - - aufheb
          - "null"
          - cancel
          - zero
          - minus
          - negativ
          - negative
        - - quadr
          - square
          - positiv
          - positive
        - - wurzel
          - root
          - einheit
          - unit
      sample: The distances above and below would cancel; their sum is zero. Squares are always positive. At the end you take the root so the unit is right again.
    explanation: Squaring makes everything positive and punishes big distances more. The root brings back the original unit.
    difficulty: 3

srs:
  cards_from: [zwei-klassen, spannweite]
