id: stats.data.spread
type: concept
title: How far does it spread?
summary: Same average, completely different data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zwei-klassen
    widget: choice
    body: Class A has the grades 3, 3, 3, 3. Class B has 1, 1, 5, 5.
    prompt: What is true?
    params:
      options:
        - { label: Same average – but B spreads much more., correct: true }
        - { label: A is better., feedback: "Both have an average of 3." }
        - { label: Both are the same., feedback: "The average is the same, the distribution is not." }
    hints:
      - Calculate both means.
    explanation: The mean alone doesn't tell you how different the values are.

  - kind: explain
    body: |
      The **range** is the distance from the smallest to the largest value. It shows how far data spreads.
      Two data sets can have the same mean and completely different ranges.

  - kind: problem
    id: bauen
    widget: chart
    prompt: Drag the bars so that the mean stays 5, but the range is 8.
    params:
      labels: [A, B, C, D]
      values: [5, 5, 5, 5]
      editable: [0, 1, 2, 3]
      min: 0
      max: 10
      step: 1
      show: [mean]
    check: { predicate: "avg == 5 && max(values) - min(values) == 8" }
    solution: { state: { values: [1, 5, 5, 9] } }
    hints:
      - Make one bar 4 smaller and another 4 larger.
    explanation: For example 1, 5, 5, 9 – average 5, range 8.

  - kind: problem
    id: spannweite
    widget: numeric
    prompt: "Temperatures in one week: {{a}}, 12, 15, {{b}}, 14 °C. What is the range?"
    params: { unit: "°C" }
    answer: { value: "{{b - a}}" }
    hints:
      - Largest minus smallest value.
    explanation: "{{b}} − {{a}} = {{b - a}} °C."
    variants:
      params: { a: "int[3,9]", b: "int[17,25]" }
      defaults: { a: 8, b: 19 }

srs:
  cards_from: [zwei-klassen, spannweite]
