id: stats.data.mean
type: concept
title: Der Mittelwert
summary: Gerecht verteilt – so viel hätte jeder.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.mean]
estimated_minutes: 11
steps:
  - kind: problem
    id: saeule
    widget: chart
    prompt: Ziehe die Säule für Freitag so, dass der Mittelwert genau 5 beträgt.
    params: { labels: [Mo, Di, Mi, Do, Fr], values: [4, 6, 5, 3, 2], editable: [4], min: 0, max: 10, show: [mean], title: Gelesene Seiten }
    check: { predicate: "mean(state.values) == 5" }
    hints:
      - Für einen Mittelwert von 5 brauchen 5 Tage zusammen 25 Seiten.
      - Mo bis Do sind schon 18 Seiten.
    explanation: "4 + 6 + 5 + 3 + 7 = 25, und 25 : 5 = 5."

  - kind: explain
    id: s2
    body: |
      Der **Mittelwert** ist die Summe aller Werte geteilt durch ihre Anzahl.
      Er sagt – so viel hätte jeder, wenn man gerecht verteilt.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Berechne den Mittelwert von {{a}}, {{b}} und {{c}}.
    answer: { value: "{{(a + b + c) / 3}}" }
    feedback:
      - when: "numval(state.input) == a + b + c"
        misconception: sum-not-mean
        text: Das ist die Summe. Teile sie noch durch die Anzahl der Werte.
    hints:
      - "Summe: {{a + b + c}}."
      - Teile durch 3.
    explanation: "({{a}} + {{b}} + {{c}}) : 3 = {{(a + b + c) / 3}}."
    variants:
      params: { a: "int[1,12]", b: "int[1,12]", c: "int[1,12]" }
      constraints: ["isInt((a + b + c) / 3)", "a != b || b != c"]
      defaults: { a: 4, b: 7, c: 10 }

  - kind: problem
    id: ablesen
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Jan, Feb, Mär, Apr, Mai], values: [2, 4, 4, 6, 9], min: 0, max: 10, title: Regentage }
    prompt: Wie groß ist der Mittelwert der Regentage?
    answer: { value: 5 }
    hints:
      - Zähle alle Säulen zusammen.
      - 25 Tage auf 5 Monate.
    explanation: "2 + 4 + 4 + 6 + 9 = 25, und 25 : 5 = 5."

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: Ein einziger Wert wird plötzlich sehr groß. Was passiert mit dem Mittelwert?
    params:
      options:
        - { label: Er steigt deutlich, correct: true }
        - { label: Er bleibt gleich, feedback: "Die Summe wird größer – also auch der Mittelwert." }
        - { label: Er sinkt, feedback: "Ein größerer Wert kann den Mittelwert nicht senken." }
    hints:
      - Was passiert mit der Summe?
    explanation: Ein sehr großer Wert zieht den Mittelwert nach oben.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Der Mittelwert kann eine Zahl sein, die in den Daten gar nicht vorkommt.
          right: true
        - text: Die Hälfte der Werte liegt immer über dem Mittelwert.
          right: false
          why: Das gilt für den Median. Bei 1, 1, 1, 9 liegt nur ein Wert über dem Mittelwert 3.
        - text: Addiert man zu jedem Wert 5, steigt auch der Mittelwert um 5.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Vier Tests ergaben im Schnitt 70 Punkte. Wie viele Punkte brauchst du im fünften Test, damit der Schnitt auf 72 steigt?
    answer:
      value: 80
    hints:
      - Fünf Tests mit Schnitt 72 ergeben zusammen 360 Punkte.
    explanation: 360 − 280 = 80. Mit Summen rechnen ist oft einfacher als mit Mittelwerten.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Die Werte 3, 5 und 10 haben den Mittelwert 6. Die Abstände zum Mittelwert sind −3, −1 und +4. Wie groß ist ihre Summe?
    answer:
      value: 0
    hints:
      - Addiere einfach die drei Zahlen mit Vorzeichen.
      - −3 − 1 = −4. Was bleibt mit +4?
    explanation: "Null – immer. Der **Mittelwert** ist der Schwerpunkt: Was unten fehlt, liegt oben zu viel."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Die Note {{a}} zählt doppelt, die Note {{b}} einfach. Wie groß ist der gewichtete Schnitt?
    answer:
      value: "{{(2 * a + b) / 3}}"
    feedback:
      - when: numval(state.input) == (a + b) / 2
        misconception: ignore-weights
        text: Das wäre der einfache Schnitt. Die {{a}} zählt aber zweimal.
    hints:
      - Zähle die doppelte Note zweimal.
      - "Rechne ({{a}} + {{a}} + {{b}}) : 3."
    explanation: "({{a}} + {{a}} + {{b}}) : 3 = {{(2 * a + b) / 3}}. Gewichte sagen, wie oft ein Wert zählt."
    difficulty: 2
    variants:
      params:
        a: int[1,6]
        b: int[1,6]
      constraints:
        - a != b
        - isInt((2 * a + b) / 3)
      defaults:
        a: 2
        b: 5

  - kind: problem
    id: da-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Du fährst hin mit 60 km/h und zurück mit 40 km/h – gleiche Strecke. Wie schnell warst du im Schnitt?"
    params:
      min: 30
      max: 70
      unit: km/h
    answer:
      value: 48
      tolerance: 1.5
    explanation: "Nicht 50! Für 120 km brauchst du 1 h + 1,5 h = 2,5 h. 120 : 2,5 = 48 km/h. Die langsame Fahrt dauert länger und zählt darum mehr."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Klasse A (20 Kinder) hat im Schnitt 60 Punkte, Klasse B (30 Kinder) 70 Punkte. Wie hoch ist der Schnitt aller 50 Kinder?
    answer:
      value: 66
    feedback:
      - when: numval(state.input) == 65
        misconception: unweighted-mean
        text: 65 wäre nur bei gleich großen Klassen richtig. B hat mehr Kinder.
    hints:
      - "Rechne die Gesamtpunkte: 20 · 60 + 30 · 70."
    explanation: "3300 : 50 = 66 – nicht 65. Größere Gruppen ziehen den **gewichteten Mittelwert** zu sich."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Du suchst eine Zahl c, bei der die Summe der quadrierten Abstände (x − c)² zu allen Werten am kleinsten ist. Welche ist das?
    params:
      options:
        - label: Der Mittelwert
          correct: true
        - label: Der Median
          feedback: Der Median macht die Summe der **einfachen** Abstände klein, nicht der quadrierten.
        - label: Der größte Wert
          feedback: Dann wären alle anderen Abstände groß.
    hints:
      - Probier es mit den Werten 0 und 10 aus.
      - Bei c = 5 ist die Summe 25 + 25 = 50. Bei c = 4 ist sie 16 + 36 = 52.
    explanation: Leitet man die Summe nach c ab und setzt null, kommt c = Mittelwert heraus. Darum steckt der Mittelwert in der Methode der kleinsten Quadrate.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Ein Kurs hat 10 Teilnehmer mit dem Schnitt 70. Einer mit 92 Punkten wechselt den Kurs. Wie groß ist der Schnitt der übrigen 9?
    answer:
      value: 68
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 70 - 92 / 10
        misconception: mean-subtract
        text: "Du hast nur 92 : 10 abgezogen. Rechne erst die neue Summe aus."
    hints:
      - Rechne zuerst die Summe aller Punkte aus.
      - 700 − 92 = 608. Teile durch 9.
    explanation: Summe 10 · 70 = 700. Ohne die 92 bleiben 608, geteilt durch 9 ist das 67,6 – gerundet 68.
    difficulty: 3

  - kind: problem
    id: da-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum der Mittelwert ein Schwerpunkt ist.
    params:
      keywords:
        - - summe
          - sum
          - addier
          - add
        - - anzahl
          - teil
          - count
          - divid
        - - ausgleich
          - gleich
          - balance
          - schwerpunkt
          - "null"
          - zero
          - cancel
      sample: Der Mittelwert ist die Summe geteilt durch die Anzahl. Die Abstände nach oben und nach unten gleichen sich genau aus – ihre Summe ist null.
    explanation: "Wie eine Wippe: Der Mittelwert ist der Punkt, an dem die Daten im Gleichgewicht sind."
    difficulty: 3

srs:
  cards_from: ["rechnen"]
