id: stats.data.mean
type: concept
title: Der Mittelwert
summary: Gerecht verteilt – so viel hätte jeder.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.mean]
estimated_minutes: 7
steps:
  - kind: problem
    id: saeule
    widget: chart
    prompt: Ziehe die Säule für Freitag so, dass der Mittelwert genau 5 beträgt.
    params: { labels: [Mo, Di, Mi, Do, Fr], values: [4, 6, 5, 3, 2], editable: [4], min: 0, max: 10, show: [mean], title: Gelesene Seiten }
    check: { predicate: "mean(state.values) == 5" }
    hints:
      - Für einen Mittelwert von 5 brauchen 5 Tage zusammen 25 Seiten.
      - Mo bis Do sind schon 18 Seiten.
    explanation: "4 + 6 + 5 + 3 + 7 = 25, und 25 : 5 = 5."

  - kind: explain
    id: s2
    body: |
      Der **Mittelwert** ist die Summe aller Werte geteilt durch ihre Anzahl.
      Er sagt – so viel hätte jeder, wenn man gerecht verteilt.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Berechne den Mittelwert von {{a}}, {{b}} und {{c}}.
    answer: { value: "{{(a + b + c) / 3}}" }
    feedback:
      - when: "numval(state.input) == a + b + c"
        misconception: sum-not-mean
        text: Das ist die Summe. Teile sie noch durch die Anzahl der Werte.
    hints:
      - "Summe: {{a + b + c}}."
      - Teile durch 3.
    explanation: "({{a}} + {{b}} + {{c}}) : 3 = {{(a + b + c) / 3}}."
    variants:
      params: { a: "int[1,12]", b: "int[1,12]", c: "int[1,12]" }
      constraints: ["isInt((a + b + c) / 3)", "a != b || b != c"]
      defaults: { a: 4, b: 7, c: 10 }

  - kind: problem
    id: ablesen
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Jan, Feb, Mär, Apr, Mai], values: [2, 4, 4, 6, 9], min: 0, max: 10, title: Regentage }
    prompt: Wie groß ist der Mittelwert der Regentage?
    answer: { value: 5 }
    hints:
      - Zähle alle Säulen zusammen.
      - 25 Tage auf 5 Monate.
    explanation: "2 + 4 + 4 + 6 + 9 = 25, und 25 : 5 = 5."

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: Ein einziger Wert wird plötzlich sehr groß. Was passiert mit dem Mittelwert?
    params:
      options:
        - { label: Er steigt deutlich, correct: true }
        - { label: Er bleibt gleich, feedback: "Die Summe wird größer – also auch der Mittelwert." }
        - { label: Er sinkt, feedback: "Ein größerer Wert kann den Mittelwert nicht senken." }
    hints:
      - Was passiert mit der Summe?
    explanation: Ein sehr großer Wert zieht den Mittelwert nach oben.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Der Mittelwert kann eine Zahl sein, die in den Daten gar nicht vorkommt.
          right: true
        - text: Die Hälfte der Werte liegt immer über dem Mittelwert.
          right: false
          why: Das gilt für den Median. Bei 1, 1, 1, 9 liegt nur ein Wert über dem Mittelwert 3.
        - text: Addiert man zu jedem Wert 5, steigt auch der Mittelwert um 5.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Vier Tests ergaben im Schnitt 70 Punkte. Wie viele Punkte brauchst du im fünften Test, damit der Schnitt auf 72 steigt?
    answer:
      value: 80
    hints:
      - Fünf Tests mit Schnitt 72 ergeben zusammen 360 Punkte.
    explanation: 360 − 280 = 80. Mit Summen rechnen ist oft einfacher als mit Mittelwerten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Klasse A (20 Kinder) hat im Schnitt 60 Punkte, Klasse B (30 Kinder) 70 Punkte. Wie hoch ist der Schnitt aller 50 Kinder?
    answer:
      value: 66
    feedback:
      - when: numval(state.input) == 65
        misconception: unweighted-mean
        text: 65 wäre nur bei gleich großen Klassen richtig. B hat mehr Kinder.
    hints:
      - "Rechne die Gesamtpunkte: 20 · 60 + 30 · 70."
    explanation: "3300 : 50 = 66 – nicht 65. Größere Gruppen ziehen den **gewichteten Mittelwert** zu sich."
    difficulty: 3

srs:
  cards_from: ["rechnen"]
