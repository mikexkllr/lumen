id: stats.data.mean
type: concept
title: The mean
summary: Shared fairly – this is what each one would get.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.mean]
estimated_minutes: 7
steps:
  - kind: problem
    id: saeule
    widget: chart
    prompt: Drag the bar for Friday so that the mean is exactly 5.
    params: { labels: [Mon, Tue, Wed, Thu, Fri], values: [4, 6, 5, 3, 2], editable: [4], min: 0, max: 10, show: [mean], title: Pages read }
    check: { predicate: "mean(state.values) == 5" }
    hints:
      - For a mean of 5, five days need 25 pages together.
      - Monday to Thursday are already 18 pages.
    explanation: "4 + 6 + 5 + 3 + 7 = 25, and 25 ÷ 5 = 5."

  - kind: explain
    id: s2
    body: |
      The **mean** is the sum of all values divided by how many there are.
      It tells you what each one would get if everything were shared fairly.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Calculate the mean of {{a}}, {{b}} and {{c}}.
    answer: { value: "{{(a + b + c) / 3}}" }
    feedback:
      - when: "numval(state.input) == a + b + c"
        misconception: sum-not-mean
        text: That is the sum. Now divide it by the number of values.
    hints:
      - "Sum: {{a + b + c}}."
      - Divide by 3.
    explanation: "({{a}} + {{b}} + {{c}}) ÷ 3 = {{(a + b + c) / 3}}."
    variants:
      params: { a: "int[1,12]", b: "int[1,12]", c: "int[1,12]" }
      constraints: ["isInt((a + b + c) / 3)", "a != b || b != c"]
      defaults: { a: 4, b: 7, c: 10 }

  - kind: problem
    id: ablesen
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Jan, Feb, Mar, Apr, May], values: [2, 4, 4, 6, 9], min: 0, max: 10, title: Rainy days }
    prompt: What is the mean number of rainy days?
    answer: { value: 5 }
    hints:
      - Add up all the bars.
      - 25 days over 5 months.
    explanation: "2 + 4 + 4 + 6 + 9 = 25, and 25 ÷ 5 = 5."

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: One single value suddenly becomes very large. What happens to the mean?
    params:
      options:
        - { label: It rises sharply, correct: true }
        - { label: It stays the same, feedback: "The sum gets bigger – so the mean does too." }
        - { label: It drops, feedback: "A larger value can't lower the mean." }
    hints:
      - What happens to the sum?
    explanation: A very large value pulls the mean up.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: The mean can be a number that does not occur in the data at all.
          right: true
        - text: Half of the values always lie above the mean.
          right: false
          why: That is true of the median. For 1, 1, 1, 9 only one value lies above the mean of 3.
        - text: If you add 5 to every value, the mean rises by 5 too.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Four tests averaged 70 points. How many points do you need in the fifth test for the average to rise to 72?
    answer:
      value: 80
    hints:
      - Five tests averaging 72 total 360 points.
    explanation: 360 − 280 = 80. Calculating with sums is often easier than with means.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Class A (20 children) averages 60 points, class B (30 children) 70 points. What is the average of all 50 children?
    answer:
      value: 66
    feedback:
      - when: numval(state.input) == 65
        misconception: unweighted-mean
        text: 65 would only be right for classes of equal size. B has more children.
    hints:
      - "Compute the total points: 20 · 60 + 30 · 70."
    explanation: 3300 ÷ 50 = 66 – not 65. Larger groups pull the **weighted mean** towards themselves.
    difficulty: 3

srs:
  cards_from: ["rechnen"]
