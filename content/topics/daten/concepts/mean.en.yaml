id: stats.data.mean
type: concept
title: The mean
summary: Shared fairly – this is what each one would get.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.mean]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Shared out fairly
    body: Four friends share their pizza after sport. Who got too much, who too little? Drag the bars up and down. The line shows the **mean** – what everyone would get if it were shared fairly.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - Ana
          - Ben
          - Cem
          - Dila
        values:
          - 2
          - 6
          - 3
          - 5
        editable:
          - 0
          - 1
          - 2
          - 3
        min: 0
        max: 8
        show:
          - mean
        title: Pizza slices

  - kind: problem
    id: start-kekse
    widget: numeric
    prompt: Ana has 2 cookies, Ben has 4. They put them all together and share fairly. How many does each get?
    params:
      unit: cookies
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: sum-not-mean
        text: That is all the cookies together. Now share them between the two children.
    hints:
      - How many cookies are there altogether?
      - "6 cookies for 2 children: work out 6 ÷ 2."
    explanation: "2 + 4 = 6 cookies, divided between 2 children: each gets 3. This number is called the mean."

  - kind: problem
    id: start-sticker
    widget: numeric
    prompt: Three friends have 12 stickers altogether. How many would each have if they share fairly?
    params:
      unit: stickers
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 36
        misconception: multiply-not-divide
        text: You multiplied. Sharing fairly means dividing.
    hints:
      - Sharing fairly means dividing by the number of friends.
      - Work out 12 ÷ 3.
    explanation: 12 ÷ 3 = 4. Each would have 4 stickers – no matter how many they had before.

  - kind: problem
    id: saeule
    widget: chart
    prompt: Drag the bar for Friday so that the mean is exactly 5.
    params: { labels: [Mon, Tue, Wed, Thu, Fri], values: [4, 6, 5, 3, 2], editable: [4], min: 0, max: 10, show: [mean], title: Pages read }
    check: { predicate: "mean(state.values) == 5" }
    hints:
      - For a mean of 5, five days need 25 pages together.
      - Monday to Thursday are already 18 pages.
    explanation: "4 + 6 + 5 + 3 + 7 = 25, and 25 ÷ 5 = 5."

  - kind: explain
    id: s2
    body: |
      The **mean** is the sum of all values divided by how many there are.
      It tells you what each one would get if everything were shared fairly.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Calculate the mean of {{a}}, {{b}} and {{c}}.
    answer: { value: "{{(a + b + c) / 3}}" }
    feedback:
      - when: "numval(state.input) == a + b + c"
        misconception: sum-not-mean
        text: That is the sum. Now divide it by the number of values.
    hints:
      - "Sum: {{a + b + c}}."
      - Divide by 3.
    explanation: "({{a}} + {{b}} + {{c}}) ÷ 3 = {{(a + b + c) / 3}}."
    variants:
      params: { a: "int[1,12]", b: "int[1,12]", c: "int[1,12]" }
      constraints: ["isInt((a + b + c) / 3)", "a != b || b != c"]
      defaults: { a: 4, b: 7, c: 10 }

  - kind: problem
    id: ablesen
    widget: numeric
    visual:
      widget: chart
      params: { labels: [Jan, Feb, Mar, Apr, May], values: [2, 4, 4, 6, 9], min: 0, max: 10, title: Rainy days }
    prompt: What is the mean number of rainy days?
    answer: { value: 5 }
    hints:
      - Add up all the bars.
      - 25 days over 5 months.
    explanation: "2 + 4 + 4 + 6 + 9 = 25, and 25 ÷ 5 = 5."

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: One single value suddenly becomes very large. What happens to the mean?
    params:
      options:
        - { label: It rises sharply, correct: true }
        - { label: It stays the same, feedback: "The sum gets bigger – so the mean does too." }
        - { label: It drops, feedback: "A larger value can't lower the mean." }
    hints:
      - What happens to the sum?
    explanation: A very large value pulls the mean up.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: The mean can be a number that does not occur in the data at all.
          right: true
        - text: Half of the values always lie above the mean.
          right: false
          why: That is true of the median. For 1, 1, 1, 9 only one value lies above the mean of 3.
        - text: If you add 5 to every value, the mean rises by 5 too.
          right: true

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Set the three bars so that their mean is 4 – but no bar shows exactly 4.
    params:
      labels:
        - A
        - B
        - C
      values:
        - 1
        - 1
        - 1
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 10
      show:
        - mean
    check:
      predicate: mean(state.values) == 4 && !state.values.includes(4)
    solution:
      state:
        values:
          - 2
          - 5
          - 5
    hints:
      - For a mean of 4, the three bars need 12 in total.
      - Try, for example, 2, 5 and 5.
    explanation: Any combination with a sum of 12 works, such as 2 + 5 + 5. The mean need not appear in the data at all.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Four tests averaged 70 points. How many points do you need in the fifth test for the average to rise to 72?
    answer:
      value: 80
    hints:
      - Five tests averaging 72 total 360 points.
    explanation: 360 − 280 = 80. Calculating with sums is often easier than with means.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: The values 3, 5 and 10 have the mean 6. Their distances from the mean are −3, −1 and +4. What is their sum?
    answer:
      value: 0
    hints:
      - Just add the three signed numbers.
      - −3 − 1 = −4. What is left with +4?
    explanation: "Zero – always. The mean is the balance point: what is missing below is too much above."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: The grade {{a}} counts twice, the grade {{b}} once. What is the weighted average?
    answer:
      value: "{{(2 * a + b) / 3}}"
    feedback:
      - when: numval(state.input) == (a + b) / 2
        misconception: ignore-weights
        text: That is the plain average. But the {{a}} counts twice.
    hints:
      - Count the double grade twice.
      - Compute ({{a}} + {{a}} + {{b}}) ÷ 3.
    explanation: ({{a}} + {{a}} + {{b}}) ÷ 3 = {{(2 * a + b) / 3}}. Weights say how often a value counts.
    difficulty: 2
    variants:
      params:
        a: int[1,6]
        b: int[1,6]
      constraints:
        - a != b
        - isInt((2 * a + b) / 3)
      defaults:
        a: 2
        b: 5

  - kind: problem
    id: da-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: you drive there at 60 km/h and back at 40 km/h – same distance. What was your average speed?"
    params:
      min: 30
      max: 70
      unit: km/h
    answer:
      value: 48
      tolerance: 1.5
    explanation: Not 50! For 120 km you need 1 h + 1.5 h = 2.5 h. 120 ÷ 2.5 = 48 km/h. The slow leg takes longer, so it counts more.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Class A (20 children) averages 60 points, class B (30 children) 70 points. What is the average of all 50 children?
    answer:
      value: 66
    feedback:
      - when: numval(state.input) == 65
        misconception: unweighted-mean
        text: 65 would only be right for classes of equal size. B has more children.
    hints:
      - "Compute the total points: 20 · 60 + 30 · 70."
    explanation: 3300 ÷ 50 = 66 – not 65. Larger groups pull the **weighted mean** towards themselves.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: You look for a number c that makes the sum of squared distances (x − c)² to all values as small as possible. Which one is it?
    params:
      options:
        - label: The mean
          correct: true
        - label: The median minimises the sum of plain distances, not squared ones.
          feedback: Der Median macht die Summe der **einfachen** Abstände klein, nicht der quadrierten.
        - label: Then all other distances would be large.
          feedback: Dann wären alle anderen Abstände groß.
    hints:
      - Try it with the values 0 and 10.
      - At c = 5 the sum is 25 + 25 = 50. At c = 4 it is 16 + 36 = 52.
    explanation: "Differentiate the sum with respect to c and set it to zero: c = mean. That is why the mean sits inside least squares."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: A course has 10 students with an average of 70. One with 92 points leaves. What is the average of the other 9?
    answer:
      value: 68
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 70 - 92 / 10
        misconception: mean-subtract
        text: You only subtracted 92 ÷ 10. Work out the new total first.
    hints:
      - First work out the total of all points.
      - 700 − 92 = 608. Divide by 9.
    explanation: Total 10 · 70 = 700. Without the 92, 608 is left; divided by 9 that is 67.6 – about 68.
    difficulty: 3

  - kind: problem
    id: da-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why the mean is a balance point.
    params:
      keywords:
        - - summe
          - sum
          - addier
          - add
        - - anzahl
          - teil
          - count
          - divid
        - - ausgleich
          - gleich
          - balance
          - schwerpunkt
          - "null"
          - zero
          - cancel
      sample: The mean is the sum divided by the count. Distances above and below cancel exactly – they add up to zero.
    explanation: "Like a seesaw: the mean is the point where the data balance."
    difficulty: 3

srs:
  cards_from: ["rechnen"]
