id: stats.data.charts
type: concept
title: Reading charts
summary: Check the axes before you marvel.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.charts]
estimated_minutes: 6
steps:
  - kind: problem
    id: meiste
    widget: choice
    visual:
      widget: chart
      params: { labels: [Mon, Tue, Wed, Thu, Fri], values: [12, 18, 9, 15, 21], min: 0, max: 25, step: 1, title: Library visitors }
    prompt: On which day did the most visitors come?
    params:
      layout: grid
      options:
        - { label: Friday, correct: true }
        - { label: Tuesday, feedback: "Tuesday had 18 – Friday had more." }
        - { label: Thursday, feedback: "Thursday had 15." }
        - { label: Wednesday, feedback: "Wednesday was the quietest day." }
    hints:
      - Look for the tallest bar.
    explanation: Friday, with 21 visitors.

  - kind: problem
    id: achse
    widget: choice
    visual:
      widget: chart
      params: { labels: [A, B], values: [42, 48], min: 40, max: 50, step: 1, title: Sales in thousand € }
    prompt: Bar B is much taller than A. Is B really about twice as large?
    params:
      options:
        - { label: "No, B is only about 14% larger", correct: true }
        - { label: "Yes, at least double", feedback: "Look at the axis. It starts at 40, not at 0." }
    hints:
      - Where does the vertical axis start?
    explanation: 48 instead of 42 is only 6 more – about 14%. The cut-off axis exaggerates.

  - kind: explain
    id: s3
    body: |
      Watch the axes. If the y-axis does **not start at 0**, small differences look huge.
      Always check the labels before you compare bars.

  - kind: problem
    id: einstellen
    widget: chart
    prompt: Set the data – A = 3, B = 7, C = 5.
    params: { labels: [A, B, C], values: [1, 1, 1], editable: [0, 1, 2], min: 0, max: 10 }
    answer: { values: [3, 7, 5] }
    hints:
      - Drag each bar to its value.
    explanation: Bar height = value.

  - kind: problem
    id: differenz
    widget: numeric
    visual:
      widget: chart
      params: { labels: ["2022", "2023", "2024"], values: [35, 50, 65], min: 0, max: 80, step: 5, title: Bikes per day }
    prompt: By what percent did the number rise from 2022 to 2024?
    params: { unit: "%" }
    answer: { value: 85.7142857, tolerance: 0.6 }
    hints:
      - From 35 to 65 is 30 more.
      - 30 out of 35 – as a percent.
    explanation: "30 ÷ 35 ≈ 0.857, so about 86%."
    difficulty: 3

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A chart shows the unemployment rate with a y-axis from 5.0% to 5.5%. The line rises steeply. What happened?
    params:
      options:
        - label: The rate rose by at most half a percentage point – the axis dramatises
          correct: true
        - label: Unemployment doubled
          feedback: For that it would have to rise from 5% to 10%.
        - label: Nothing can be read off
          feedback: The values are on the axis.
    hints:
      - Read the numbers on the axis, not the steepness.
    explanation: The steepness of a line depends solely on the chosen window.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A chart has **two** y-axes: ice cream sales on the left, sunburns on the right. The curves lie perfectly on top of each other. What is the danger?"
    params:
      options:
        - label: With two freely chosen scales almost any relationship can be “drawn into existence”
          correct: true
        - label: Two axes are forbidden
          feedback: They are allowed – but tricky.
        - label: There is no danger
          feedback: The match arises from the choice of scales.
    hints:
      - Who decides where the right-hand axis begins and ends?
    explanation: By stretching and shifting you can fit any rising curve to any other.
    difficulty: 3
