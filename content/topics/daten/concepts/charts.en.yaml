id: stats.data.charts
type: concept
title: Reading charts
summary: Check the axes before you marvel.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.charts]
estimated_minutes: 10
steps:
  - kind: problem
    id: meiste
    widget: choice
    visual:
      widget: chart
      params: { labels: [Mon, Tue, Wed, Thu, Fri], values: [12, 18, 9, 15, 21], min: 0, max: 25, step: 1, title: Library visitors }
    prompt: On which day did the most visitors come?
    params:
      layout: grid
      options:
        - { label: Friday, correct: true }
        - { label: Tuesday, feedback: "Tuesday had 18 – Friday had more." }
        - { label: Thursday, feedback: "Thursday had 15." }
        - { label: Wednesday, feedback: "Wednesday was the quietest day." }
    hints:
      - Look for the tallest bar.
    explanation: Friday, with 21 visitors.

  - kind: problem
    id: achse
    widget: choice
    visual:
      widget: chart
      params: { labels: [A, B], values: [42, 48], min: 40, max: 50, step: 1, title: Sales in thousand € }
    prompt: Bar B is much taller than A. Is B really about twice as large?
    params:
      options:
        - { label: "No, B is only about 14% larger", correct: true }
        - { label: "Yes, at least double", feedback: "Look at the axis. It starts at 40, not at 0." }
    hints:
      - Where does the vertical axis start?
    explanation: 48 instead of 42 is only 6 more – about 14%. The cut-off axis exaggerates.

  - kind: explain
    id: s3
    body: |
      Watch the axes. If the **y-axis** does **not start at 0**, small differences look huge.
      Always check the labels before you compare bars.

  - kind: problem
    id: einstellen
    widget: chart
    prompt: Set the data – A = 3, B = 7, C = 5.
    params: { labels: [A, B, C], values: [1, 1, 1], editable: [0, 1, 2], min: 0, max: 10 }
    answer: { values: [3, 7, 5] }
    hints:
      - Drag each bar to its value.
    explanation: Bar height = value.

  - kind: problem
    id: differenz
    widget: numeric
    visual:
      widget: chart
      params: { labels: ["2022", "2023", "2024"], values: [35, 50, 65], min: 0, max: 80, step: 5, title: Bikes per day }
    prompt: By what percent did the number rise from 2022 to 2024?
    params: { unit: "%" }
    answer: { value: 85.7142857, tolerance: 0.6 }
    hints:
      - From 35 to 65 is 30 more.
      - 30 out of 35 – as a percent.
    explanation: "30 ÷ 35 ≈ 0.857, so about 86%."
    difficulty: 3

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Honest or misleading?
    params:
      buckets:
        - id: b1
          label: Honest
        - id: b2
          label: Misleading
      items:
        - label: Bars start at 0
          bucket: b1
        - label: The y-axis starts at 95
          bucket: b2
        - label: Axes with labels and units
          bucket: b1
        - label: Tilted 3D pie
          bucket: b2
    hints:
      - What makes small differences look huge?
    explanation: Good charts show sizes as they are.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A chart shows the unemployment rate with a y-axis from 5.0% to 5.5%. The line rises steeply. What happened?
    params:
      options:
        - label: The rate rose by at most half a percentage point – the axis dramatises
          correct: true
        - label: Unemployment doubled
          feedback: For that it would have to rise from 5% to 10%.
        - label: Nothing can be read off
          feedback: The values are on the axis.
    hints:
      - Read the numbers on the axis, not the steepness.
    explanation: The steepness of a line depends solely on the chosen window.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: City A has 500 accidents among 1,000,000 people. City B has 100 accidents among 100,000 people. How many accidents per 10,000 people is that in B?
    answer:
      value: 10
    hints:
      - 100,000 is ten times 10,000.
      - Divide 100 by 10. In A it is only 5, by the way.
    explanation: B has 10, A only 5 per 10,000. A bar of raw accidents shows A five times higher – per person B is twice as dangerous.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A map colours districts by the number of cases. The big cities are all dark. What is the problem?
    params:
      options:
        - label: The map mostly shows where many people live
          correct: true
        - label: Without relating it to population you cannot tell.
          feedback: Ohne Bezug auf die Einwohnerzahl weiß man das nicht.
        - label: The colour is not the problem, the counting is.
          feedback: Die Farbe ist nicht das Problem, die Zählweise ist es.
    hints:
      - Where do most people live?
      - "Fair would be a rate: cases per person."
    explanation: Raw counts follow the population. Only a rate such as »per 100,000« makes areas comparable.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A chart has **two** y-axes: ice cream sales on the left, sunburns on the right. The curves lie perfectly on top of each other. What is the danger?"
    params:
      options:
        - label: With two freely chosen scales almost any relationship can be “drawn into existence”
          correct: true
        - label: Two axes are forbidden
          feedback: They are allowed – but tricky.
        - label: There is no danger
          feedback: The match arises from the choice of scales.
    hints:
      - Who decides where the right-hand axis begins and ends?
    explanation: By stretching and shifting you can fit any rising curve to any other.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: A value rises from 100 to 110. In the chart the bar grows from 2 cm to 4 cm. The lie factor is the effect in the picture divided by the effect in the data. What is it?
    answer:
      value: 10
    hints:
      - "In the picture: plus 100 %. In the data: plus what percent?"
      - Divide 100 % by 10 %.
    explanation: "Picture: +100 %, data: +10 %. Lie factor 10. Honest charts stay close to 1."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A chart shows the running total of all sales since January. The line rises every month. What can it hide?
    params:
      options:
        - label: That monthly sales are shrinking
          correct: true
        - label: A running total rises as long as anything at all is sold.
          feedback: Eine Summe steigt, solange überhaupt etwas verkauft wird.
        - label: Possible, but the main problem is the total itself.
          feedback: Möglich, aber das Hauptproblem ist die Summe selbst.
    hints:
      - Can a total of positive numbers ever fall?
      - "Watch the slope: is it getting flatter?"
    explanation: Cumulative curves always rise. A slump only shows up as a flatter slope – easy to miss.
    difficulty: 3
