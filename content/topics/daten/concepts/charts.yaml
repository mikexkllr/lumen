id: stats.data.charts
type: concept
title: Diagramme lesen
summary: Achsen prüfen, bevor man staunt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.charts]
estimated_minutes: 10
steps:
  - kind: problem
    id: meiste
    widget: choice
    visual:
      widget: chart
      params: { labels: [Mo, Di, Mi, Do, Fr], values: [12, 18, 9, 15, 21], min: 0, max: 25, step: 1, title: Besucher in der Bibliothek }
    prompt: An welchem Tag kamen die meisten Besucher?
    params:
      layout: grid
      options:
        - { label: Freitag, correct: true }
        - { label: Dienstag, feedback: "Dienstag waren es 18 – Freitag mehr." }
        - { label: Donnerstag, feedback: "Donnerstag waren es 15." }
        - { label: Mittwoch, feedback: "Mittwoch war der ruhigste Tag." }
    hints:
      - Suche die höchste Säule.
    explanation: Freitag mit 21 Besuchern.

  - kind: problem
    id: achse
    widget: choice
    visual:
      widget: chart
      params: { labels: [A, B], values: [42, 48], min: 40, max: 50, step: 1, title: Umsatz in Tausend € }
    prompt: Säule B ist viel höher als A. Ist B wirklich etwa doppelt so groß?
    params:
      options:
        - { label: "Nein, B ist nur etwa 14 % größer", correct: true }
        - { label: "Ja, mindestens doppelt", feedback: "Schau auf die Achse – sie beginnt bei 40, nicht bei 0." }
    hints:
      - Wo beginnt die senkrechte Achse?
    explanation: 48 statt 42 sind nur 6 mehr – etwa 14 %. Die abgeschnittene Achse übertreibt.

  - kind: explain
    id: s3
    body: |
      Achtung bei Achsen – beginnt die **y-Achse** **nicht bei 0**, wirken kleine Unterschiede riesig.
      Prüfe immer die Beschriftung, bevor du Säulen vergleichst.

  - kind: problem
    id: einstellen
    widget: chart
    prompt: Stelle die Daten ein – A = 3, B = 7, C = 5.
    params: { labels: [A, B, C], values: [1, 1, 1], editable: [0, 1, 2], min: 0, max: 10 }
    answer: { values: [3, 7, 5] }
    hints:
      - Ziehe jede Säule auf ihren Wert.
    explanation: Säulenhöhe = Wert.

  - kind: problem
    id: differenz
    widget: numeric
    visual:
      widget: chart
      params: { labels: ["2022", "2023", "2024"], values: [35, 50, 65], min: 0, max: 80, step: 5, title: Fahrräder pro Tag }
    prompt: Um wie viel Prozent stieg die Zahl von 2022 auf 2024?
    params: { unit: "%" }
    answer: { value: 85.7142857, tolerance: 0.6 }
    hints:
      - Von 35 auf 65 sind es 30 mehr.
      - 30 von 35 – in Prozent.
    explanation: "30 : 35 ≈ 0,857, also etwa 86 %."
    difficulty: 3

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Ehrlich oder irreführend?
    params:
      buckets:
        - id: b1
          label: Ehrlich
        - id: b2
          label: Irreführend
      items:
        - label: Säulen beginnen bei 0
          bucket: b1
        - label: Die y-Achse beginnt bei 95
          bucket: b2
        - label: Achsen mit Beschriftung und Einheit
          bucket: b1
        - label: Schräge 3D-Torte
          bucket: b2
    hints:
      - Was lässt kleine Unterschiede riesig wirken?
    explanation: Gute Diagramme zeigen Größen so, wie sie sind.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Grafik zeigt die Arbeitslosenquote mit einer y-Achse von 5,0 % bis 5,5 %. Die Linie steigt steil. Was ist passiert?
    params:
      options:
        - label: Die Quote stieg um höchstens einen halben Prozentpunkt – die Achse dramatisiert
          correct: true
        - label: Die Arbeitslosigkeit hat sich verdoppelt
          feedback: Dafür müsste sie von 5 % auf 10 % steigen.
        - label: Man kann nichts ablesen
          feedback: Die Werte stehen ja an der Achse.
    hints:
      - Lies die Zahlen an der Achse, nicht die Steilheit.
    explanation: Die Steilheit einer Linie hängt allein vom gewählten Ausschnitt ab.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Stadt A hat 500 Unfälle bei 1 000 000 Einwohnern. Stadt B hat 100 Unfälle bei 100 000 Einwohnern. Wie viele Unfälle sind das in B pro 10 000 Einwohner?
    answer:
      value: 10
    hints:
      - 100 000 sind zehnmal 10 000.
      - Teile 100 durch 10. In A sind es übrigens nur 5.
    explanation: B hat 10, A nur 5 Unfälle pro 10 000. Die Säule »Unfälle« zeigt A fünfmal höher – pro Kopf ist B doppelt so gefährlich.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Eine Karte färbt Landkreise nach der Zahl der Fälle. Die großen Städte sind alle dunkel. Was ist das Problem?
    params:
      options:
        - label: Die Karte zeigt vor allem, wo viele Menschen wohnen
          correct: true
        - label: Städte sind immer gefährlicher
          feedback: Ohne Bezug auf die Einwohnerzahl weiß man das nicht.
        - label: Dunkle Farben sind schwer zu lesen
          feedback: Die Farbe ist nicht das Problem, die Zählweise ist es.
    hints:
      - Wo leben die meisten Menschen?
      - "Fair wäre ein Anteil: Fälle pro Einwohner."
    explanation: Absolute Zahlen folgen der Bevölkerung. Erst eine **Rate** wie »pro 100 000« macht Gebiete vergleichbar.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Eine Grafik hat **zwei** y-Achsen: links Eisverkauf, rechts Sonnenbrände. Die Kurven liegen perfekt übereinander. Was ist die Gefahr?"
    params:
      options:
        - label: Mit zwei frei gewählten Skalen lässt sich fast jeder Zusammenhang »herbeizeichnen«
          correct: true
        - label: Zwei Achsen sind verboten
          feedback: Erlaubt sind sie – aber heikel.
        - label: Es gibt keine Gefahr
          feedback: Die Übereinstimmung entsteht durch die Wahl der Skalen.
    hints:
      - Wer legt fest, wo die rechte Achse beginnt und endet?
    explanation: Durch Strecken und Verschieben passt man jede steigende Kurve an jede andere an.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Ein Wert steigt von 100 auf 110. In der Grafik wächst die Säule aber von 2 cm auf 4 cm. Der **Lügenfaktor** ist Effekt im Bild durch Effekt in den Daten. Wie groß ist er?
    answer:
      value: 10
    hints:
      - "Im Bild: plus 100 %. In den Daten: plus wie viel Prozent?"
      - Teile 100 % durch 10 %.
    explanation: "Bild: +100 %, Daten: +10 %. Lügenfaktor 10. Ehrliche Grafiken liegen nahe bei 1."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Ein Diagramm zeigt die **Summe** aller Verkäufe seit Jahresbeginn. Die Linie steigt jeden Monat. Was kann sie verstecken?
    params:
      options:
        - label: Dass die Verkäufe pro Monat schrumpfen
          correct: true
        - label: Nichts – steigend heißt gut
          feedback: Eine Summe steigt, solange überhaupt etwas verkauft wird.
        - label: Dass Daten fehlen
          feedback: Möglich, aber das Hauptproblem ist die Summe selbst.
    hints:
      - Kann eine Summe aus positiven Zahlen jemals fallen?
      - "Achte auf die Steigung: Wird sie flacher?"
    explanation: Kumulierte Kurven steigen immer. Ein Einbruch zeigt sich nur als flachere Steigung – leicht zu übersehen.
    difficulty: 3
