id: stats.data.outliers
type: concept
title: Outliers
summary: One value that distorts everything.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: millionaer
    widget: choice
    prompt: In a pub, 9 people sit with an income of 3,000 € each. A billionaire walks in. What happens?
    params:
      options:
        - { label: The mean explodes – the median stays almost the same., correct: true }
        - { label: Both rise sharply., feedback: "The median is the middle value – it stays at 3,000 €." }
        - { label: Nothing changes., feedback: "The mean jumps to over 100 million €." }
    hints:
      - The median is the middle value of the sorted list.
    explanation: One extreme value pulls the mean, not the median.

  - kind: explain
    body: |
      An **outlier** is a value far from the others. It can be a measurement error – or real.
      That is why people often quote the median for incomes.

  - kind: problem
    id: ziehen
    widget: chart
    prompt: Drag bar E upward and watch. Set it so that the mean is exactly 6.
    params:
      labels: [A, B, C, D, E]
      values: [4, 4, 5, 5, 2]
      editable: [4]
      min: 0
      max: 20
      step: 1
      show: [mean, median]
    check: { predicate: "avg == 6" }
    hints:
      - A mean of 6 needs a sum of 30.
    explanation: 4 + 4 + 5 + 5 + 12 = 30. The median stays at 5 – it ignores the outlier.

  - kind: problem
    id: wann
    widget: buckets
    prompt: Which is more meaningful here?
    params:
      buckets: [{ label: Median }, { label: Mean }]
      items:
        - { label: Typical income, bucket: Median }
        - { label: Typical house price, bucket: Median }
        - { label: Average grade without outliers, bucket: Mean }
        - { label: Average daily rainfall, bucket: Mean }
    hints:
      - Are there a few huge values?
    explanation: For skewed data with extremes, the median is more robust.

srs:
  cards_from: [millionaer, wann]
