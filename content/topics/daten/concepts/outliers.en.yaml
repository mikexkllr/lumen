id: stats.data.outliers
type: concept
title: Outliers
summary: One value that distorts everything.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: millionaer
    widget: choice
    prompt: In a pub, 9 people sit with an income of 3,000 € each. A billionaire walks in. What happens?
    params:
      options:
        - { label: The mean explodes – the median stays almost the same., correct: true }
        - { label: Both rise sharply., feedback: "The median is the middle value – it stays at 3,000 €." }
        - { label: Nothing changes., feedback: "The mean jumps to over 100 million €." }
    hints:
      - The median is the middle value of the sorted list.
    explanation: One extreme value pulls the mean, not the median.

  - kind: explain
    id: s2
    body: |
      An **outlier** is a value far from the others. It can be a measurement error – or real.
      That is why people often quote the median for incomes.

  - kind: problem
    id: ziehen
    widget: chart
    prompt: Drag bar E upward and watch. Set it so that the mean is exactly 6.
    params:
      labels: [A, B, C, D, E]
      values: [4, 4, 5, 5, 2]
      editable: [4]
      min: 0
      max: 20
      step: 1
      show: [mean, median]
    check: { predicate: "avg == 6" }
    hints:
      - A mean of 6 needs a sum of 30.
    explanation: 4 + 4 + 5 + 5 + 12 = 30. The median stays at 5 – it ignores the outlier.

  - kind: problem
    id: wann
    widget: buckets
    prompt: Which is more meaningful here?
    params:
      buckets: [{ label: Median }, { label: Mean }]
      items:
        - { label: Typical income, bucket: Median }
        - { label: Typical house price, bucket: Median }
        - { label: Average grade without outliers, bucket: Mean }
        - { label: Average daily rainfall, bucket: Mean }
    hints:
      - Are there a few huge values?
    explanation: For skewed data with extremes, the median is more robust.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A series of measurements reads 172, 168, 175, 1700, 170 cm. What do you do with the 1700?
    params:
      options:
        - label: "Check it: probably a typo – correct or exclude with justification and document that"
          correct: true
        - label: Always keep it – data must never be touched
          feedback: Keeping obvious errors distorts the result.
        - label: Delete it silently
          feedback: Without justification and a note that is manipulation.
    hints:
      - Is a 17 metre tall person plausible?
    explanation: "Neither keep nor delete outliers blindly: check, decide, disclose."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: when is the median better than the mean?"
    params:
      keywords:
        - - ausreißer
          - extrem
          - outlier
          - extreme
          - schief
          - skew
        - - mitte
          - middle
          - hälfte
          - half
        - - verzerr
          - zieh
          - beeinfluss
          - distort
          - pull
          - affect
          - robust
      sample: When the data have outliers or are skewed, as with incomes. Extreme values distort the mean, while the median as the middle value stays almost untouched.
    difficulty: 3

srs:
  cards_from: [millionaer, wann]
