id: stats.data.spread
type: concept
title: Wie weit streut es?
summary: Gleicher Schnitt, ganz andere Daten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zwei-klassen
    widget: choice
    body: Klasse A hat die Noten 3, 3, 3, 3. Klasse B hat 1, 1, 5, 5.
    prompt: Was stimmt?
    params:
      options:
        - { label: Gleicher Schnitt – aber B streut viel stärker., correct: true }
        - { label: A ist besser., feedback: "Beide haben den Schnitt 3." }
        - { label: Beide sind gleich., feedback: "Der Schnitt ist gleich, die Verteilung nicht." }
    hints:
      - Rechne beide Mittelwerte aus.
    explanation: Der Mittelwert allein verrät nicht, wie unterschiedlich die Werte sind.

  - kind: explain
    id: s2
    body: |
      Die **Spannweite** ist der Abstand vom kleinsten zum größten Wert. Sie zeigt, wie weit Daten streuen.
      Zwei Datenreihen können denselben Mittelwert und völlig verschiedene Spannweiten haben.

  - kind: problem
    id: bauen
    widget: chart
    prompt: Ziehe die Säulen so, dass der Mittelwert 5 bleibt, die Spannweite aber 8 ist.
    params:
      labels: [A, B, C, D]
      values: [5, 5, 5, 5]
      editable: [0, 1, 2, 3]
      min: 0
      max: 10
      step: 1
      show: [mean]
    check: { predicate: "avg == 5 && max(values) - min(values) == 8" }
    solution: { state: { values: [1, 5, 5, 9] } }
    hints:
      - Mach eine Säule 4 kleiner und eine andere 4 größer.
    explanation: Zum Beispiel 1, 5, 5, 9 – Schnitt 5, Spannweite 8.

  - kind: problem
    id: spannweite
    widget: numeric
    prompt: "Temperaturen einer Woche: {{a}}, 12, 15, {{b}}, 14 °C. Wie groß ist die Spannweite?"
    params: { unit: "°C" }
    answer: { value: "{{b - a}}" }
    hints:
      - Größter minus kleinster Wert.
    explanation: "{{b}} − {{a}} = {{b - a}} °C."
    variants:
      params: { a: "int[3,9]", b: "int[17,25]" }
      defaults: { a: 8, b: 19 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **Standardabweichung** misst die typische Entfernung vom Mittelwert. Für 2, 4, 4, 4, 5, 5, 7, 9 ist der Mittelwert 5 und die Summe der quadrierten Abstände 32. Wie groß ist sie?
    answer:
      value: 2
    hints:
      - 32 durch 8 Werte, dann die Wurzel.
    explanation: √4 = 2. Quadrieren macht Abstände positiv und gewichtet große stärker.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum nimmt man für die Streuung nicht einfach die Spannweite?
    params:
      options:
        - label: Sie hängt nur von den zwei extremsten Werten ab – ein Ausreißer genügt, um sie zu verzerren
          correct: true
        - label: Sie ist zu schwer zu berechnen
          feedback: Sie ist die einfachste Größe überhaupt.
        - label: Sie ist immer null
          feedback: Nur wenn alle Werte gleich sind.
    hints:
      - Wie viele der Werte gehen in die Spannweite ein?
    explanation: "Robuster ist der **Quartilsabstand**: die Breite der mittleren 50 % der Daten."
    difficulty: 3

srs:
  cards_from: [zwei-klassen, spannweite]
