id: stats.data.spread
type: concept
title: Wie weit streut es?
summary: Gleicher Schnitt, ganz andere Daten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: zwei-klassen
    widget: choice
    body: Klasse A hat die Noten 3, 3, 3, 3. Klasse B hat 1, 1, 5, 5.
    prompt: Was stimmt?
    params:
      options:
        - { label: Gleicher Schnitt – aber B streut viel stärker., correct: true }
        - { label: A ist besser., feedback: "Beide haben den Schnitt 3." }
        - { label: Beide sind gleich., feedback: "Der Schnitt ist gleich, die Verteilung nicht." }
    hints:
      - Rechne beide Mittelwerte aus.
    explanation: Der Mittelwert allein verrät nicht, wie unterschiedlich die Werte sind.

  - kind: explain
    id: s2
    body: |
      Die **Spannweite** ist der Abstand vom kleinsten zum größten Wert. Sie zeigt, wie weit Daten streuen.
      Zwei Datenreihen können denselben Mittelwert und völlig verschiedene Spannweiten haben.

  - kind: problem
    id: bauen
    widget: chart
    prompt: Ziehe die Säulen so, dass der Mittelwert 5 bleibt, die Spannweite aber 8 ist.
    params:
      labels: [A, B, C, D]
      values: [5, 5, 5, 5]
      editable: [0, 1, 2, 3]
      min: 0
      max: 10
      step: 1
      show: [mean]
    check: { predicate: "avg == 5 && max(values) - min(values) == 8" }
    solution: { state: { values: [1, 5, 5, 9] } }
    hints:
      - Mach eine Säule 4 kleiner und eine andere 4 größer.
    explanation: Zum Beispiel 1, 5, 5, 9 – Schnitt 5, Spannweite 8.

  - kind: problem
    id: spannweite
    widget: numeric
    prompt: "Temperaturen einer Woche: {{a}}, 12, 15, {{b}}, 14 °C. Wie groß ist die Spannweite?"
    params: { unit: "°C" }
    answer: { value: "{{b - a}}" }
    hints:
      - Größter minus kleinster Wert.
    explanation: "{{b}} − {{a}} = {{b - a}} °C."
    variants:
      params: { a: "int[3,9]", b: "int[17,25]" }
      defaults: { a: 8, b: 19 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **Standardabweichung** misst die typische Entfernung vom Mittelwert. Für 2, 4, 4, 4, 5, 5, 7, 9 ist der Mittelwert 5 und die Summe der quadrierten Abstände 32. Wie groß ist sie?
    answer:
      value: 2
    hints:
      - 32 durch 8 Werte, dann die Wurzel.
    explanation: √4 = 2. Quadrieren macht Abstände positiv und gewichtet große stärker.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Der Schnitt ist 100. Mach die Streuung so groß, dass nur noch etwa die Hälfte zwischen 85 und 115 liegt.
    params:
      scene: normal
    answer:
      mean: 100
      share:
        - 48
        - 52
    explanation: Bei einer Streuung von etwa 22. Gleicher Schnitt, aber viel mehr Werte weit draußen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Werte: 1, 3, 5, 7, 9. Der Mittelwert ist 5. Die **Varianz** ist der Mittelwert der quadrierten Abstände. Wie groß ist sie?"
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 40
        misconception: forgot-divide
        text: Das ist die Summe der Quadrate. Teile noch durch 5.
      - when: numval(state.input) == 0
        misconception: no-square
        text: Die Abstände selbst heben sich auf – darum quadriert man sie.
    hints:
      - "Abstände: −4, −2, 0, 2, 4. Quadriere sie."
      - 16 + 4 + 0 + 4 + 16 = 40. Teile durch 5.
    explanation: "40 : 5 = 8. Die Standardabweichung ist die Wurzel daraus: √8 ≈ 2,83."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: order
    prompt: Ordne die Schritte, um die Standardabweichung von Hand zu berechnen.
    params:
      items:
        - label: Mittelwert berechnen
        - label: Abstand jedes Werts zum Mittelwert
        - label: Abstände quadrieren
        - label: Quadrate mitteln – das ist die Varianz
        - label: Wurzel ziehen
    hints:
      - Ohne Mittelwert gibt es keine Abstände.
      - Die Wurzel macht am Ende das Quadrieren rückgängig.
    explanation: "Die Wurzel bringt die Einheit zurück: Aus cm² werden wieder cm."
    difficulty: 2

  - kind: problem
    id: da-d3
    depth: 2
    widget: chart
    prompt: Stell die vier Säulen so ein, dass der Mittelwert 5 ist und jede Säule genau 2 vom Mittelwert entfernt liegt.
    params:
      labels:
        - A
        - B
        - C
        - D
      values:
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      step: 1
      show:
        - mean
    check:
      predicate: avg == 5 && abs(values[0] - 5) == 2 && abs(values[1] - 5) == 2 && abs(values[2] - 5) == 2 && abs(values[3] - 5) == 2
    solution:
      state:
        values:
          - 3
          - 7
          - 3
          - 7
    hints:
      - Jede Säule steht bei 3 oder bei 7.
      - Damit der Schnitt 5 bleibt, brauchst du zwei von jeder Sorte.
    explanation: Zum Beispiel 3, 7, 3, 7. Alle Abstände sind 2 – also ist die Standardabweichung genau 2.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum nimmt man für die Streuung nicht einfach die Spannweite?
    params:
      options:
        - label: Sie hängt nur von den zwei extremsten Werten ab – ein Ausreißer genügt, um sie zu verzerren
          correct: true
        - label: Sie ist zu schwer zu berechnen
          feedback: Sie ist die einfachste Größe überhaupt.
        - label: Sie ist immer null
          feedback: Nur wenn alle Werte gleich sind.
    hints:
      - Wie viele der Werte gehen in die Spannweite ein?
    explanation: "Robuster ist der **Quartilsabstand**: die Breite der mittleren 50 % der Daten."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Zu allen Werten addierst du 10. Danach verdoppelst du alle Werte. Was passiert mit der Standardabweichung σ = 3?
    params:
      options:
        - label: Sie wird 6
          correct: true
        - label: Sie wird 26
          feedback: Plus 10 verschiebt nur, die Abstände bleiben gleich.
        - label: Sie bleibt 3
          feedback: Das Verdoppeln streckt alle Abstände.
        - label: Sie wird 12
          feedback: "Das gilt für die Varianz: 3² · 4 = 36 = 6²."
    hints:
      - Was macht ein Verschieben mit den Abständen?
      - Und was macht ein Verdoppeln mit den Abständen?
    explanation: Verschieben ändert σ nicht. Strecken mit Faktor 2 verdoppelt σ. Die Varianz wächst dabei mit 2² = 4.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "Ein Trick: Varianz = Mittelwert der Quadrate minus Quadrat des Mittelwerts. Für 1, 2, 3 ist der Mittelwert der Quadrate 14/3. Wie groß ist die Varianz? Als Bruch."
    answer:
      value: 2/3
    hints:
      - Der Mittelwert ist 2, sein Quadrat 4.
      - Rechne 14/3 − 4 = 14/3 − 12/3.
    explanation: "14/3 − 12/3 = 2/3. Probe: Abstände −1, 0, 1 → Quadrate 1, 0, 1 → Mittel 2/3."
    difficulty: 3

  - kind: problem
    id: da-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man die Abstände zum Mittelwert quadriert, bevor man sie mittelt.
    params:
      keywords:
        - - aufheb
          - "null"
          - cancel
          - zero
          - minus
          - negativ
          - negative
        - - quadr
          - square
          - positiv
          - positive
        - - wurzel
          - root
          - einheit
          - unit
      sample: Die Abstände nach oben und unten würden sich aufheben, ihre Summe ist null. Quadrate sind immer positiv. Am Ende zieht man die Wurzel, damit die Einheit wieder stimmt.
    explanation: Quadrieren macht alles positiv und bestraft große Abstände stärker. Die Wurzel holt die alte Einheit zurück.
    difficulty: 3

srs:
  cards_from: [zwei-klassen, spannweite]
