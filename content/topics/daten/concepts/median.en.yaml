id: stats.data.median
type: concept
title: Median and outliers
summary: The middle value is hardly fazed by outliers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.median]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The middle stays cool
    body: When reporting pay, newspapers often give the **median** instead of the mean. Why? Drag the last bar right up to the top. Watch closely which line moves with it and which one stays calm.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - A
          - B
          - C
          - D
          - E
        values:
          - 2
          - 3
          - 3
          - 4
          - 4
        editable:
          - 4
        min: 0
        max: 30
        show:
          - mean
          - median
        title: Salary in thousand €

  - kind: problem
    id: mitte
    widget: numeric
    visual:
      widget: chart
      params: { labels: [A, B, C, D, E], values: [1, 2, 2, 3, 20], min: 0, max: 20, step: 1 }
    prompt: What is the median of these five values?
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 5.6"
        misconception: mean-vs-median
        text: That is the mean. The median is the value in the middle of the sorted list.
    hints:
      - Sort the values and take the middle one.
    explanation: Sorted, it is 1, 2, 2, 3, 20 – the middle one is 2.

  - kind: explain
    id: s2
    body: |
      The **median** is the value in the middle when you sort everything.
      Outliers barely move it – but they move the mean a lot.

  - kind: problem
    id: ausreisser
    widget: chart
    prompt: Drag bar E up until the mean is above 8. Watch the median as you do.
    params: { labels: [A, B, C, D, E], values: [3, 5, 6, 7, 4], editable: [4], min: 0, max: 30, show: [mean, median] }
    check: { predicate: "mean(state.values) > 8" }
    hints:
      - The sum must be above 40.
    explanation: From E = 20 on, the mean is above 8 – the median stays at 6.
    difficulty: 2

  - kind: problem
    id: median-variante
    widget: numeric
    prompt: What is the median of {{a}}, {{b}}, {{c}}, {{d}} and {{e}}?
    answer: { value: "{{median([a, b, c, d, e])}}" }
    feedback:
      - when: "numval(state.input) == c && c != median([a, b, c, d, e])"
        misconception: unsorted-median
        text: Sort first, then take the middle.
    hints:
      - Sort the five numbers.
    explanation: "Sorted, {{median([a, b, c, d, e])}} is in the middle."
    variants:
      params: { a: "int[1,20]", b: "int[1,20]", c: "int[1,20]", d: "int[1,20]", e: "int[1,20]" }
      defaults: { a: 12, b: 3, c: 15, d: 7, e: 9 }

  - kind: problem
    id: gerade-anzahl
    widget: numeric
    prompt: What is the median of 4, 9, 1 and 7?
    answer: { value: 5.5 }
    hints:
      - Sort them – 1, 4, 7, 9.
      - With an even count, take the middle of the two middle values.
    explanation: "(4 + 7) ÷ 2 = 5.5."
    difficulty: 2

  - kind: problem
    id: gehaelter
    widget: choice
    body: At a company, nine people earn 3,000 € each, and the boss earns 50,000 €.
    prompt: Which value describes the typical salary better?
    params:
      options:
        - { label: The median, correct: true }
        - { label: The mean, feedback: "The high salary pulls the mean up to 7,700 € – nobody here earns that." }
        - { label: Both equally well, feedback: "Calculate both – 3,000 € and 7,700 €." }
    hints:
      - What does the person in the middle earn?
    explanation: The median is 3,000 €, the mean 7,700 €.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The median is the value in the [[middle]] of the sorted data. For an even count you take the [[mean]] of the two middle ones. Outliers [[hardly]] shift it.
      distractors:
        - strongly
        - sum

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Set the bars so that the median is 5 but the mean is 7.
    params:
      labels:
        - A
        - B
        - C
        - D
        - E
      values:
        - 5
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
        - 4
      min: 0
      max: 20
      show:
        - mean
        - median
    check:
      predicate: median(state.values) == 5 && mean(state.values) == 7
    solution:
      state:
        values:
          - 5
          - 5
          - 5
          - 5
          - 15
    hints:
      - Keep the middle values at 5 and pull one value far up.
      - For a mean of 7, all five need 35 in total – so one bar at 15.
    explanation: "For example 5, 5, 5, 5 and 15: the median stays at 5, the outlier only pulls the mean up."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Median of 3, 9, 4, 12, 7, 5?
    answer:
      value: 6
    hints:
      - "Sorted: 3, 4, 5, 7, 9, 12. The middle lies between 5 and 7."
    explanation: (5 + 7) ÷ 2 = 6.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Values: 1, 3, 4, 6, 8, 9, 11, 12. The lower quartile is the median of the lower half (1, 3, 4, 6). What is it?"
    answer:
      value: 3.5
    hints:
      - The lower half has four values.
      - Take the middle of 3 and 4.
    explanation: (3 + 4) ÷ 2 = 3.5. A quarter of the data lies below the lower quartile.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: The upper quartile of the same values is 10 (median of 8, 9, 11, 12). What is the interquartile range – upper minus lower quartile?
    answer:
      value: 6.5
    hints:
      - The lower quartile was 3.5.
      - Compute 10 − 3.5.
    explanation: 10 − 3.5 = 6.5. The middle half of the data lies in this range – and outliers barely affect it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In a country the mean income is much higher than the median. What does that say about the distribution?
    params:
      options:
        - label: A few very high incomes pull the mean upward – it is right-skewed
          correct: true
        - label: Most earn more than the average
          feedback: "The reverse: most lie below it."
        - label: The data are faulty
          feedback: Almost all income distributions look like this.
    hints:
      - Think of the billionaire in the pub.
    explanation: The gap between mean and median measures **skewness**. For symmetric data both coincide.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Beach-goers sit at 100 m, 200 m, 250 m, 700 m and 900 m. Where should the ice-cream van stand so that the total walking distance is shortest?
    params:
      options:
        - label: At 250 m – at the median
          correct: true
        - label: The mean minimises squared distances. For plain distances the median wins.
          feedback: Der Mittelwert macht die **quadrierten** Wege klein. Für einfache Wege gewinnt der Median.
        - label: The middle of the beach ignores where people actually sit.
          feedback: Die Mitte des Strands ignoriert, wo die Leute sitzen.
    hints:
      - Move the van a little to the right of 250 m. Who walks further, who walks less?
      - Three guests would walk further, only two less.
    explanation: "At the median as many walk from the left as from the right. Any shift lengthens more walks than it shortens. Total at 250 m: 150 + 50 + 0 + 450 + 650 = 1300 m."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: You have 9 values. How many of them must you make arbitrarily large, at minimum, so that the median also becomes arbitrarily large?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 1
        misconception: median-fragile
        text: One value is enough for the mean. The median is more robust.
    hints:
      - The median is the 5th value of the sorted list.
      - How many values must be at the top for the 5th value to be huge?
    explanation: Only when 5 of 9 are huge is the middle one huge too. The median withstands almost 50 % crazy values – the mean not a single one.
    difficulty: 3

srs:
  cards_from: ["median-variante"]
