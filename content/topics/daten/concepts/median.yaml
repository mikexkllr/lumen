id: stats.data.median
type: concept
title: Median und Ausreißer
summary: Der Wert in der Mitte lässt sich von Ausreißern kaum beirren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [data.median]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Mitte bleibt cool
    body: Bei Gehältern nennen Zeitungen oft den **Median** statt des Mittelwerts. Warum nur? Zieh die letzte Säule ganz nach oben. Schau genau, welche Linie mitläuft und welche ruhig bleibt.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - A
          - B
          - C
          - D
          - E
        values:
          - 2
          - 3
          - 3
          - 4
          - 4
        editable:
          - 4
        min: 0
        max: 30
        show:
          - mean
          - median
        title: Gehalt in Tsd. €

  - kind: problem
    id: start-reihe
    widget: choice
    prompt: Fünf Kinder stellen sich der Größe nach in eine Reihe. Welches Kind steht genau in der Mitte?
    params:
      options:
        - label: Das dritte
          correct: true
        - label: Das zweite
          feedback: Dann stünden links ein Kind und rechts drei.
        - label: Das fünfte
          feedback: Das fünfte Kind steht ganz am Ende.
    hints:
      - In der Mitte stehen links und rechts gleich viele.
      - Zwei links, zwei rechts – wer bleibt?
    explanation: Das dritte Kind hat zwei Kinder links und zwei rechts. Seine Größe ist der Median der Gruppe.

  - kind: problem
    id: start-sortiert
    widget: numeric
    prompt: "Die Werte sind schon sortiert: 1, 3, 5, 8, 9. Welche Zahl steht in der Mitte?"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 5.2
        misconception: mean-vs-median
        text: Das ist der Mittelwert. Gesucht ist die Zahl, die in der Mitte steht.
      - when: numval(state.input) == 3
        misconception: position
        text: "Zähl von beiden Seiten: Die mittlere ist die dritte von fünf."
    hints:
      - Zähl von links und von rechts gleich weit nach innen.
      - Es ist die dritte der fünf Zahlen.
    explanation: In der Mitte steht die 5. Zwei Werte sind kleiner, zwei sind größer.

  - kind: problem
    id: mitte
    widget: numeric
    visual:
      widget: chart
      params: { labels: [A, B, C, D, E], values: [1, 2, 2, 3, 20], min: 0, max: 20, step: 1 }
    prompt: Wie groß ist der Median dieser fünf Werte?
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 5.6"
        misconception: mean-vs-median
        text: Das ist der Mittelwert. Der Median ist der Wert in der Mitte der sortierten Liste.
    hints:
      - Sortiere die Werte und nimm den mittleren.
    explanation: Sortiert 1, 2, 2, 3, 20 – in der Mitte steht 2.

  - kind: explain
    id: s2
    body: |
      Der **Median** ist der Wert in der Mitte, wenn man alle sortiert.
      Ausreißer verschieben ihn kaum – den Mittelwert dagegen stark.

  - kind: problem
    id: ausreisser
    widget: chart
    prompt: Ziehe Säule E so hoch, dass der Mittelwert über 8 liegt. Beobachte dabei den Median.
    params: { labels: [A, B, C, D, E], values: [3, 5, 6, 7, 4], editable: [4], min: 0, max: 30, show: [mean, median] }
    check: { predicate: "mean(state.values) > 8" }
    hints:
      - Die Summe muss über 40 liegen.
    explanation: Ab E = 20 liegt der Mittelwert über 8 – der Median bleibt bei 6.
    difficulty: 2

  - kind: problem
    id: median-variante
    widget: numeric
    prompt: Wie groß ist der Median von {{a}}, {{b}}, {{c}}, {{d}} und {{e}}?
    answer: { value: "{{median([a, b, c, d, e])}}" }
    feedback:
      - when: "numval(state.input) == c && c != median([a, b, c, d, e])"
        misconception: unsorted-median
        text: Erst sortieren, dann die Mitte nehmen.
    hints:
      - Sortiere die fünf Zahlen.
    explanation: "Sortiert steht {{median([a, b, c, d, e])}} in der Mitte."
    variants:
      params: { a: "int[1,20]", b: "int[1,20]", c: "int[1,20]", d: "int[1,20]", e: "int[1,20]" }
      defaults: { a: 12, b: 3, c: 15, d: 7, e: 9 }

  - kind: problem
    id: gehaelter
    widget: choice
    body: In einer Firma verdienen neun Leute je 3000 €, die Chefin 50 000 €.
    prompt: Welcher Wert beschreibt das typische Gehalt besser?
    params:
      options:
        - { label: Der Median, correct: true }
        - { label: Der Mittelwert, feedback: "Das hohe Gehalt zieht den Mittelwert auf 7700 € – das verdient hier niemand." }
        - { label: Beide gleich gut, feedback: "Rechne beide aus – 3000 € und 7700 €." }
    hints:
      - Was verdient die Person in der Mitte?
    explanation: Der Median ist 3000 €, der Mittelwert 7700 €.

  - kind: problem
    id: gerade-anzahl
    widget: numeric
    prompt: Wie groß ist der Median von 4, 9, 1 und 7?
    answer: { value: 5.5 }
    hints:
      - Sortiere – 1, 4, 7, 9.
      - Bei gerader Anzahl nimmst du die Mitte der beiden mittleren Werte.
    explanation: "(4 + 7) : 2 = 5,5."
    difficulty: 2

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der Median ist der Wert in der [[Mitte]] der sortierten Daten. Bei einer geraden Anzahl nimmt man den [[Mittelwert]] der beiden mittleren. Ausreißer verschieben ihn [[kaum]].
      distractors:
        - stark
        - Summe

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Stell die Säulen so ein, dass der Median 5 ist, der Mittelwert aber 7.
    params:
      labels:
        - A
        - B
        - C
        - D
        - E
      values:
        - 5
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
        - 4
      min: 0
      max: 20
      show:
        - mean
        - median
    check:
      predicate: median(state.values) == 5 && mean(state.values) == 7
    solution:
      state:
        values:
          - 5
          - 5
          - 5
          - 5
          - 15
    hints:
      - Lass die mittleren Werte bei 5 und zieh einen Wert weit nach oben.
      - Für den Mittelwert 7 brauchen alle fünf zusammen 35 – also eine Säule auf 15.
    explanation: "Zum Beispiel 5, 5, 5, 5 und 15: Der Median bleibt bei 5, der Ausreißer zieht nur den Mittelwert hoch."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Median von 3, 9, 4, 12, 7, 5?
    answer:
      value: 6
    hints:
      - "Sortiert: 3, 4, 5, 7, 9, 12. Die Mitte liegt zwischen 5 und 7."
    explanation: "(5 + 7) : 2 = 6."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Werte: 1, 3, 4, 6, 8, 9, 11, 12. Das untere **Quartil** ist der Median der unteren Hälfte (1, 3, 4, 6). Wie groß ist es?"
    answer:
      value: 3.5
    hints:
      - Die untere Hälfte hat vier Werte.
      - Nimm die Mitte von 3 und 4.
    explanation: "(3 + 4) : 2 = 3,5. Unter dem unteren Quartil liegt ein Viertel der Daten."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Das obere Quartil derselben Werte ist 10 (Median von 8, 9, 11, 12). Wie groß ist der **Quartilsabstand** – oberes minus unteres Quartil?
    answer:
      value: 6.5
    hints:
      - Das untere Quartil war 3,5.
      - Rechne 10 − 3,5.
    explanation: 10 − 3,5 = 6,5. In diesem Bereich liegt die mittlere Hälfte der Daten – und Ausreißer stören ihn kaum.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In einem Land ist das mittlere Einkommen (Mittelwert) viel höher als der Median. Was sagt das über die Verteilung?
    params:
      options:
        - label: Wenige sehr hohe Einkommen ziehen den Mittelwert nach oben – sie ist rechtsschief
          correct: true
        - label: Die meisten verdienen mehr als der Durchschnitt
          feedback: "Umgekehrt: Die meisten liegen darunter."
        - label: Die Daten sind fehlerhaft
          feedback: So sehen fast alle Einkommensverteilungen aus.
    hints:
      - Denk an die Milliardärin in der Kneipe.
    explanation: Der Abstand zwischen Mittelwert und Median misst die **Schiefe**. Bei symmetrischen Daten fallen beide zusammen.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Am Strand stehen Badegäste bei 100 m, 200 m, 250 m, 700 m und 900 m. Wo sollte der Eiswagen stehen, damit der **Gesamtweg** aller Gäste am kürzesten ist?
    params:
      options:
        - label: Bei 250 m – beim Median
          correct: true
        - label: Bei 430 m – beim Mittelwert
          feedback: Der Mittelwert macht die **quadrierten** Wege klein. Für einfache Wege gewinnt der Median.
        - label: Bei 500 m – in der Mitte des Strands
          feedback: Die Mitte des Strands ignoriert, wo die Leute sitzen.
    hints:
      - Schieb den Wagen von 250 m ein Stück nach rechts. Wer läuft dann weiter, wer kürzer?
      - Drei Gäste müssten weiter laufen, nur zwei kürzer.
    explanation: "Am Median laufen gleich viele von links wie von rechts. Jede Verschiebung verlängert mehr Wege, als sie verkürzt. Gesamtweg bei 250 m: 150 + 50 + 0 + 450 + 650 = 1300 m."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Du hast 9 Werte. Wie viele davon musst du mindestens beliebig groß machen, damit auch der Median beliebig groß wird?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 1
        misconception: median-fragile
        text: Ein Wert reicht beim Mittelwert. Der Median ist robuster.
    hints:
      - Der Median ist der 5. Wert der sortierten Reihe.
      - Wie viele Werte müssen oben liegen, damit der 5. Wert riesig ist?
    explanation: Erst wenn 5 von 9 riesig sind, ist es auch der mittlere. Der Median hält bis knapp 50 % verrückte Werte aus – der Mittelwert keinen einzigen.
    difficulty: 3

srs:
  cards_from: ["median-variante"]
