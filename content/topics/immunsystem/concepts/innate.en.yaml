id: bio.immune.innate
type: concept
title: "The first line of defence"
summary: "Barriers, eating cells, inflammation and fever."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Fortress body
    body: Every day, millions of germs land on you – and almost all of them fail. Your **innate immunity** is ready at once, with no training at all. Uncover the cards and follow an attack step by step.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🌹
            front: A thorn prick
            back: Germs slip in through the tiny hole.
          - icon: 🚨
            front: Alarm!
            back: Injured cells release messenger substances. They call for help.
          - icon: 🍽️
            front: The eaters arrive
            back: Defence cells crawl out of the blood to the wound and swallow the germs.
          - icon: 🌡️
            front: "Plan B: fever"
            back: If the germs spread anyway, the brain turns up the heating.

  - kind: problem
    id: hook
    widget: buckets
    prompt: Germs want to get in. What stops them? Sort them.
    params:
      buckets:
        - id: b1
          label: Outer barrier
        - id: b2
          label: Inner defence
      items:
        - label: Skin
          bucket: b1
        - label: Mucus in the nose
          bucket: b1
        - label: Stomach acid
          bucket: b1
        - label: Tears
          bucket: b1
        - label: Eating cells in the blood
          bucket: b2
        - label: Fever
          bucket: b2
    hints:
      - What works before a germ is inside the body?
      - Eating cells patrol the tissues.
    explanation: Most germs already fail at skin, mucus and acid. Those that get through meet cells.

  - kind: explain
    id: c1
    body: "**Innate immunity** is ready at once. It recognises typical features of germs, not one particular pathogen. Eating cells swallow intruders. It acts fast, but not in a targeted way."

  - kind: problem
    id: c2
    widget: choice
    prompt: A cut turns red, warm and swollen. What is happening?
    params:
      options:
        - label: "Inflammation: more blood brings defence cells to the wound."
          correct: true
        - label: The wound is already badly infected.
          feedback: Redness and warmth are normal and helpful.
        - label: The blood is clotting.
          feedback: Clotting stops bleeding. Red and warm comes from extra blood flow.
    hints:
      - Why does the spot get warm?
      - Widened vessels let more blood and cells through.
    explanation: Redness, warmth, swelling and pain are signs of inflammation. It calls help to the spot.

  - kind: explain
    id: c3
    body: Eating cells are also called **phagocytes**. They flow around a germ, enclose it in a bubble and digest it. Then they release messengers and call more defence cells.

  - kind: problem
    id: c4
    widget: order
    prompt: Order how a phagocyte deals with a germ.
    params:
      items:
        - label: Germ enters through a wound
        - label: Phagocyte is attracted
        - label: It flows around the germ
        - label: It digests it inside
        - label: It calls more defence cells
    hints:
      - First find, then eat.
      - At the end it sounds the alarm.
    explanation: That is how innate defence keeps many infections small before we even notice them.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: During an infection a fever rises to 39 °C. What for?
    params:
      options:
        - label: Many germs multiply worse in the heat, and defence cells work faster.
          correct: true
        - label: It is just a fault of the body.
          feedback: Fever is a deliberate response controlled by the brain.
        - label: It boils the germs to death.
          feedback: 39 °C does not kill bacteria directly. It slows them.
    hints:
      - Who sets body temperature?
      - Immune messengers shift the set point in the brain.
    explanation: Fever is homeostasis with a new set point. Only very high fever above about 41 °C becomes dangerous.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A drop of blood of 1 µl contains about {{w}} white blood cells. About 60 % of them are phagocytes. How many phagocytes is that?
    answer:
      value: "{{w * 0.6}}"
    hints:
      - 60 % is 0.6.
      - "{{w}} × 0.6"
    explanation: "{{w * 0.6}} phagocytes in one tiny drop – the most common white blood cells."
    difficulty: 2
    variants:
      params:
        w: choice[5000,6000,7000,8000]
      defaults:
        w: 7000

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Innate or not? True or false?
    params:
      cards:
        - text: Innate defence works on first contact.
          right: true
          why: It needs to learn nothing.
        - text: Innate defence remembers earlier germs.
          right: false
          why: Only adaptive immunity has a memory.
        - text: Tears contain an enzyme that attacks bacterial walls.
          right: true
          why: It is called lysozyme.
        - text: Phagocytes only eat bacteria.
          right: false
          why: They also eat dead cells, fungi and dirt.
    explanation: Innate immunity is fast, broad and has no memory.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Phagocytes spot bacteria they have never met before. How?
    params:
      options:
        - label: By building blocks many germs have but we lack – parts of the bacterial wall, for example.
          correct: true
        - label: By smell
          feedback: Cells do not smell. They have receptors for typical patterns.
        - label: They simply eat everything.
          feedback: Then they would eat the body itself.
    hints:
      - What makes a bacterial cell different from yours?
      - The receptors are called pattern recognition receptors.
    explanation: Toll-like receptors detect such patterns. Their discovery earned the 2011 Nobel Prize.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how innate defence stops germs.
    params:
      keywords:
        - - haut
          - schleim
          - barriere
          - skin
          - mucus
          - barrier
        - - fresszell
          - phagozyt
          - phagocyt
          - eating cell
        - - entzünd
          - entzuend
          - inflamm
          - fieber
          - fever
        - - schnell
          - sofort
          - fast
          - immediate
          - at once
      sample: Skin and mucus keep most germs out. Those that get through are swallowed by phagocytes. Inflammation or fever help. It works at once, but not in a targeted way.
    explanation: Barriers, phagocytes and inflammation – the fast, broad defence.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d2"]
