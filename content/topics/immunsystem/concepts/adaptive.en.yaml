id: bio.immune.adaptive
type: concept
title: "Antibodies and memory"
summary: "B cells, T cells and why you only get chickenpox once."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You usually get chickenpox only once in your life. Why?
    params:
      options:
        - label: The immune system remembers the pathogen and fights it off at once next time.
          correct: true
        - label: The virus dies out after the illness.
          feedback: The virus is still around and can infect others.
        - label: Adults are too big for the virus.
          feedback: Unprotected adults get ill too – often worse.
    hints:
      - The immune system can learn.
      - On second contact matching cells already exist.
    explanation: That is immunological memory. It is why vaccines work.

  - kind: explain
    id: c1
    body: "**Antibodies** are Y-shaped proteins. They are made by B cells. Each antibody fits only one feature of a pathogen, like a key in a lock. It tags the germ so phagocytes can find it."

  - kind: problem
    id: c2
    widget: match
    prompt: Who does what in adaptive immunity?
    params:
      pairs:
        - left: B cells
          right: Make antibodies
        - left: Helper T cells
          right: Activate other cells
        - left: Killer T cells
          right: Kill infected cells
        - left: Memory cells
          right: Recognise pathogens again
    hints:
      - "Think: B cells build antibodies."
      - Killers attack whole cells in which a virus hides.
    explanation: Adaptive immunity is a team. Helper T cells coordinate, B and killer cells strike.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Innate or adaptive immunity?
    params:
      buckets:
        - id: b1
          label: innate
        - id: b2
          label: adaptive
      items:
        - label: Works at once
          bucket: b1
        - label: Phagocytes
          bucket: b1
        - label: Needs days the first time
          bucket: b2
        - label: Highly targeted
          bucket: b2
        - label: Has a memory
          bucket: b2
    hints:
      - Which defence has to learn first?
      - Antibodies fit precisely.
    explanation: Innate is fast and broad, adaptive is slow but targeted, with a memory.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: B cells make [[antibodies]]. Each fits one feature of the pathogen, the [[antigen]]. After the infection [[memory cells]] remain.
      distractors:
        - phagocytes
        - fever
    explanation: Antibodies recognise antigens. Memory cells provide fast protection next time.

  - kind: explain
    id: d1
    depth: 2
    body: On first contact it takes one to two weeks until there are enough antibodies. On second contact **memory cells** step in. The response comes within days and is much stronger.

  - kind: problem
    id: d2
    depth: 2
    widget: chart
    prompt: "Draw the antibody level: low before infection, medium after the first, high after the second."
    params:
      title: Antibodies
      labels:
        - before
        - 1st time
        - 2nd time
      values:
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 100
      step: 5
    check:
      predicate: values[0] <= 10 && values[1] > values[0] && values[2] >= 2 * values[1]
    hints:
      - The second response is at least twice as high.
      - Beforehand there are hardly any matching antibodies.
    explanation: The second response is often ten to a hundred times stronger. That is why a second contact usually no longer makes you ill.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: An antibody against measles does not help against flu. Why?
    params:
      options:
        - label: It only fits the shape of a feature of the measles virus.
          correct: true
        - label: Flu viruses are too big.
          feedback: Size is not the problem, the fit is.
        - label: It does help, only less.
          feedback: Antibodies are very specific – almost no hits on other viruses.
    hints:
      - Key and lock.
      - The feature is called an antigen.
    explanation: Antibodies recognise antigens, specific molecular shapes. Other viruses have other shapes.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You have only about 20,000 genes. Yet you can make billions of different antibodies. How?
    params:
      options:
        - label: Each B cell shuffles gene pieces into a new combination – almost every one has its own.
          correct: true
        - label: Each antibody has its own gene.
          feedback: There are nowhere near enough genes for that.
        - label: The antibodies copy the pathogen.
          feedback: Antibodies exist before contact. Matching ones are then multiplied.
    hints:
      - Few building blocks, many combinations.
      - If a B cell fits, it is multiplied in large numbers.
    explanation: Shuffling V, D and J pieces creates enormous variety. The pathogen then selects the matching cell – clonal selection, evolution in miniature.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how antibodies work and why you get some diseases only once.
    params:
      keywords:
        - - antikörper
          - antikoerper
          - antibod
        - - passt
          - schlüssel
          - schluessel
          - spezif
          - fit
          - key
          - specific
        - - gedächtnis
          - gedaechtnis
          - memory
        - - b-zell
          - b cell
          - b-cell
      sample: B cells make antibodies that fit one pathogen exactly, like a key in a lock. After the illness, memory cells remain. On the next contact they fight off the pathogen so fast that you do not get ill.
    explanation: Precise antibodies plus memory cells give lasting protection.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
