id: bio.immune.adaptive
type: concept
title: "Antikörper und Gedächtnis"
summary: "B-Zellen, T-Zellen und warum man Windpocken nur einmal bekommt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Windpocken bekommt man meist nur einmal im Leben. Warum?
    params:
      options:
        - label: Das Immunsystem merkt sich den Erreger und wehrt ihn beim nächsten Mal sofort ab.
          correct: true
        - label: Das Virus stirbt nach der Krankheit aus.
          feedback: Das Virus gibt es weiter, du kannst andere anstecken.
        - label: Erwachsene sind zu groß für das Virus.
          feedback: Auch Erwachsene ohne Schutz erkranken – oft schwerer.
    hints:
      - Das Immunsystem kann lernen.
      - Beim zweiten Kontakt gibt es schon passende Zellen.
    explanation: Das ist das immunologische Gedächtnis. Es ist der Grund, warum Impfungen funktionieren.

  - kind: explain
    id: c1
    body: "**Antikörper** sind Y-förmige Eiweiße. Sie werden von B-Zellen gebildet. Jeder Antikörper passt nur zu einem Merkmal eines Erregers, wie ein Schlüssel ins Schloss. Er markiert den Keim, damit Fresszellen ihn finden."

  - kind: problem
    id: c2
    widget: match
    prompt: Wer macht was in der erworbenen Abwehr?
    params:
      pairs:
        - left: B-Zellen
          right: Antikörper bilden
        - left: Helfer-T-Zellen
          right: Andere Zellen aktivieren
        - left: Killer-T-Zellen
          right: Befallene Zellen töten
        - left: Gedächtniszellen
          right: Erreger wiedererkennen
    hints:
      - B wie Bildung von Antikörpern.
      - Killer greifen ganze Zellen an, in denen sich ein Virus versteckt.
    explanation: Die erworbene Abwehr ist ein Team. Helfer-T-Zellen koordinieren, B- und Killerzellen schlagen zu.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Angeborene oder erworbene Abwehr?
    params:
      buckets:
        - id: b1
          label: angeboren
        - id: b2
          label: erworben
      items:
        - label: Wirkt sofort
          bucket: b1
        - label: Fresszellen
          bucket: b1
        - label: Braucht beim ersten Mal Tage
          bucket: b2
        - label: Ganz gezielt
          bucket: b2
        - label: Hat ein Gedächtnis
          bucket: b2
    hints:
      - Welche Abwehr muss erst lernen?
      - Antikörper sind passgenau.
    explanation: Angeboren ist schnell und breit, erworben langsam, aber gezielt und mit Gedächtnis.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: B-Zellen bilden [[Antikörper]]. Jeder passt zu einem Merkmal des Erregers, dem [[Antigen]]. Nach der Infektion bleiben [[Gedächtniszellen]] zurück.
      distractors:
        - Fresszellen
        - Fieber
    explanation: Antikörper erkennen Antigene. Gedächtniszellen sorgen für den schnellen Schutz beim nächsten Mal.

  - kind: explain
    id: d1
    depth: 2
    body: Beim ersten Kontakt dauert es ein bis zwei Wochen, bis genug Antikörper da sind. Beim zweiten Kontakt springen **Gedächtniszellen** ein. Die Antwort kommt nach wenigen Tagen und ist viel stärker.

  - kind: problem
    id: d2
    depth: 2
    widget: chart
    prompt: "Zeichne die Antikörpermenge ein: niedrig vor der Infektion, mittel nach der ersten, hoch nach der zweiten."
    params:
      title: Antikörper
      labels:
        - vorher
        - 1. Mal
        - 2. Mal
      values:
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 100
      step: 5
    check:
      predicate: values[0] <= 10 && values[1] > values[0] && values[2] >= 2 * values[1]
    hints:
      - Die zweite Antwort ist mindestens doppelt so hoch.
      - Vorher gibt es kaum passende Antikörper.
    explanation: Die zweite Antwort ist oft zehn- bis hundertmal stärker. Darum macht der zweite Kontakt meist nicht mehr krank.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Ein Antikörper gegen Masern hilft nicht gegen Grippe. Warum?
    params:
      options:
        - label: Er passt nur zur Form eines Merkmals der Masernviren.
          correct: true
        - label: Grippeviren sind zu groß.
          feedback: Die Größe ist nicht das Problem, sondern die Passform.
        - label: Er hilft doch, nur schwächer.
          feedback: Antikörper sind sehr spezifisch – fast kein Treffer bei anderen Viren.
    hints:
      - Schlüssel und Schloss.
      - Das Merkmal heißt Antigen.
    explanation: Antikörper erkennen Antigene, also bestimmte Molekülformen. Andere Viren haben andere Formen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du hast nur rund 20 000 Gene. Trotzdem kannst du Milliarden verschiedene Antikörper bilden. Wie?
    params:
      options:
        - label: Jede B-Zelle mischt Genstücke neu zusammen – fast jede hat ihre eigene Kombination.
          correct: true
        - label: Jeder Antikörper hat ein eigenes Gen.
          feedback: Dafür reichen die Gene bei weitem nicht.
        - label: Die Antikörper kopieren den Erreger.
          feedback: Antikörper entstehen schon vor dem Kontakt. Passende werden dann vermehrt.
    hints:
      - Wenige Bausteine, viele Kombinationen.
      - Passt eine B-Zelle, wird sie massenhaft vermehrt.
    explanation: Durch das Mischen von V-, D- und J-Stücken entsteht riesige Vielfalt. Der Erreger wählt dann die passende Zelle aus – klonale Selektion, Evolution im Kleinen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Antikörper wirken und warum man manche Krankheiten nur einmal bekommt.
    params:
      keywords:
        - - antikörper
          - antikoerper
          - antibod
        - - passt
          - schlüssel
          - schluessel
          - spezif
          - fit
          - key
          - specific
        - - gedächtnis
          - gedaechtnis
          - memory
        - - b-zell
          - b cell
          - b-cell
      sample: B-Zellen bilden Antikörper, die genau zu einem Erreger passen wie ein Schlüssel ins Schloss. Nach der Krankheit bleiben Gedächtniszellen. Beim nächsten Kontakt wehren sie den Erreger so schnell ab, dass man nicht krank wird.
    explanation: Passgenaue Antikörper plus Gedächtniszellen ergeben langen Schutz.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
