id: bio.immune.innate
type: concept
title: "Die erste Abwehr"
summary: "Barrieren, Fresszellen, Entzündung und Fieber."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: buckets
    prompt: Keime wollen hinein. Was hält sie auf? Ordne zu.
    params:
      buckets:
        - id: b1
          label: Barriere außen
        - id: b2
          label: Abwehr innen
      items:
        - label: Haut
          bucket: b1
        - label: Schleim in der Nase
          bucket: b1
        - label: Magensäure
          bucket: b1
        - label: Tränenflüssigkeit
          bucket: b1
        - label: Fresszellen im Blut
          bucket: b2
        - label: Fieber
          bucket: b2
    hints:
      - Was wirkt, bevor ein Keim im Körper ist?
      - Fresszellen patrouillieren im Gewebe.
    explanation: Die meisten Keime scheitern schon an Haut, Schleim und Säure. Wer durchkommt, trifft auf Zellen.

  - kind: explain
    id: c1
    body: Die **angeborene Abwehr** ist sofort bereit. Sie erkennt typische Merkmale von Keimen, nicht einen bestimmten Erreger. Fresszellen verschlingen Eindringlinge. Das wirkt schnell, aber nicht gezielt.

  - kind: problem
    id: c2
    widget: choice
    prompt: Eine Schnittwunde wird rot, warm und schwillt an. Was passiert da?
    params:
      options:
        - label: "Eine Entzündung: Mehr Blut bringt Abwehrzellen zur Wunde."
          correct: true
        - label: Die Wunde ist schon schlimm vereitert.
          feedback: Rötung und Wärme sind normal und hilfreich.
        - label: Das Blut gerinnt.
          feedback: Gerinnung stoppt die Blutung. Rot und warm kommt von mehr Durchblutung.
    hints:
      - Warum wird die Stelle warm?
      - Weitere Gefäße lassen mehr Blut und Zellen durch.
    explanation: Rötung, Wärme, Schwellung und Schmerz sind Zeichen der Entzündung. Sie holt Hilfe an den Ort.

  - kind: explain
    id: c3
    body: Fresszellen heißen auch **Phagozyten**. Sie umfließen einen Keim, schließen ihn in ein Bläschen ein und verdauen ihn. Danach schütten sie Botenstoffe aus und rufen weitere Abwehrzellen.

  - kind: problem
    id: c4
    widget: order
    prompt: Ordne, wie eine Fresszelle einen Keim erledigt.
    params:
      items:
        - label: Keim dringt durch eine Wunde ein
        - label: Fresszelle wird angelockt
        - label: Sie umfließt den Keim
        - label: Sie verdaut ihn im Inneren
        - label: Sie ruft weitere Abwehrzellen
    hints:
      - Erst finden, dann fressen.
      - Zum Schluss gibt sie Alarm.
    explanation: So hält die angeborene Abwehr viele Infekte klein, bevor wir sie überhaupt merken.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Bei einem Infekt steigt das Fieber auf 39 °C. Wozu?
    params:
      options:
        - label: Viele Keime vermehren sich bei Hitze schlechter, und Abwehrzellen arbeiten schneller.
          correct: true
        - label: Es ist nur ein Fehler des Körpers.
          feedback: Fieber ist eine gezielte Reaktion, gesteuert vom Gehirn.
        - label: Es kocht die Keime tot.
          feedback: 39 °C tötet keine Bakterien direkt. Es bremst sie.
    hints:
      - Wer stellt die Körpertemperatur ein?
      - Botenstoffe der Abwehr verstellen den Sollwert im Gehirn.
    explanation: Fieber ist Homöostase mit neuem Sollwert. Erst sehr hohes Fieber über etwa 41 °C wird gefährlich.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Tropfen Blut von 1 µl enthält etwa {{w}} weiße Blutkörperchen. Rund 60 % davon sind Fresszellen. Wie viele Fresszellen sind das?
    answer:
      value: "{{w * 0.6}}"
    hints:
      - 60 % ist 0,6.
      - "{{w}} · 0,6"
    explanation: "{{w * 0.6}} Fresszellen in einem winzigen Tropfen – die häufigsten weißen Blutkörperchen."
    difficulty: 2
    variants:
      params:
        w: choice[5000,6000,7000,8000]
      defaults:
        w: 7000

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Angeboren oder nicht? Stimmt das?
    params:
      cards:
        - text: Die angeborene Abwehr wirkt schon beim ersten Kontakt.
          right: true
          why: Sie muss nichts lernen.
        - text: Die angeborene Abwehr erinnert sich an frühere Keime.
          right: false
          why: Ein Gedächtnis hat erst die erworbene Abwehr.
        - text: Tränen enthalten ein Enzym, das Bakterienwände angreift.
          right: true
          why: Es heißt Lysozym.
        - text: Fresszellen fressen nur Bakterien.
          right: false
          why: Sie fressen auch tote Zellen, Pilze und Schmutz.
    explanation: Die angeborene Abwehr ist schnell, breit und ohne Gedächtnis.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Fresszellen erkennen Bakterien, ohne sie je gesehen zu haben. Woran?
    params:
      options:
        - label: An Bausteinen, die viele Keime haben, wir aber nicht – etwa Teile der Bakterienwand.
          correct: true
        - label: Am Geruch
          feedback: Zellen riechen nicht. Sie haben Rezeptoren für typische Muster.
        - label: Sie fressen einfach alles.
          feedback: Dann würden sie den eigenen Körper fressen.
    hints:
      - Was unterscheidet eine Bakterienzelle von deiner?
      - Die Rezeptoren heißen Mustererkennungsrezeptoren.
    explanation: Toll-ähnliche Rezeptoren erkennen solche Muster. Für ihre Entdeckung gab es 2011 den Nobelpreis.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie die angeborene Abwehr Keime aufhält.
    params:
      keywords:
        - - haut
          - schleim
          - barriere
          - skin
          - mucus
          - barrier
        - - fresszell
          - phagozyt
          - phagocyt
          - eating cell
        - - entzünd
          - entzuend
          - inflamm
          - fieber
          - fever
        - - schnell
          - sofort
          - fast
          - immediate
          - at once
      sample: Haut und Schleim halten die meisten Keime draußen. Wer durchkommt, wird von Fresszellen verschlungen. Eine Entzündung oder Fieber helfen dabei. Das wirkt sofort, aber nicht gezielt.
    explanation: Barrieren, Fresszellen und Entzündung – die schnelle, breite Abwehr.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d2"]
