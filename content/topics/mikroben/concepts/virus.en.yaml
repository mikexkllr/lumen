id: bio.microbes.virus
type: concept
title: "Viruses"
summary: "A blueprint without a factory: how viruses hijack cells."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A virus has no metabolism and no ribosomes. How does it still multiply?
    params:
      options:
        - label: It smuggles its genes into a cell, and the cell builds new viruses.
          correct: true
        - label: It divides like a bacterium.
          feedback: Viruses never divide. Cells build copies of them.
        - label: It does not.
          feedback: Then there would be no flu waves.
    hints:
      - Who has the factory?
      - The virus brings only the blueprint.
    explanation: Viruses are blueprints in a coat. They force other cells to make copies.

  - kind: explain
    id: c1
    body: A **virus** consists of genetic material, DNA or RNA, inside a protein coat, the capsid. Some also have an outer fatty envelope. Viruses are about 20 to 300 nm across – much smaller than bacteria.

  - kind: problem
    id: c2
    widget: order
    prompt: Order the steps by which a virus hijacks a cell.
    params:
      items:
        - label: Docking onto the cell
        - label: Genes get inside
        - label: Cell copies the viral genes
        - label: New viruses are assembled
        - label: Viruses are released
    hints:
      - First the virus must fit and dock.
      - In the end hundreds of new viruses leave the cell.
    explanation: Dock, enter, copy, build, release – the cell often dies in the process.

  - kind: problem
    id: c3
    widget: numeric
    prompt: An infected cell releases {{n}} new viruses. Each infects another cell. How many viruses are there after 3 rounds, starting from one?
    answer:
      value: "{{n ** 3}}"
    feedback:
      - when: numval(state.input) == 3 * n
        misconception: linear
        text: Each round multiplies, it does not add.
    hints:
      - "Round 1: {{n}}. Round 2: {{n}} × {{n}}."
      - "{{n}} to the power 3"
    explanation: "{{n}}³ = {{n ** 3}}. That is why viruses multiply so strongly within hours to days."
    variants:
      params:
        n: choice[10,50,100,200]
      defaults:
        n: 100

  - kind: problem
    id: c4
    widget: choice
    prompt: Why does a flu virus infect your lungs but not your bones?
    params:
      options:
        - label: It needs matching docking sites, and they are found mainly in the airways.
          correct: true
        - label: Bones are too hard.
          feedback: It is about receptors on the cells, not hardness.
        - label: It infects every cell alike.
          feedback: "Viruses are picky: each fits only certain cells."
    hints:
      - Docking is like a key in a lock.
      - HIV infects certain immune cells, hepatitis viruses the liver.
    explanation: The virus’s surface proteins determine which cells it can infect.

  - kind: explain
    id: d1
    depth: 2
    body: Some viruses even infect bacteria. They are called **bacteriophages**, or phages. They shoot their genes in like a syringe. A drop of seawater holds millions.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: HIV has RNA as its genetic material, but builds it into the cell’s DNA. What does it need for that?
    params:
      options:
        - label: Its own enzyme that rewrites RNA into DNA
          correct: true
        - label: Nothing, RNA and DNA are the same.
          feedback: RNA is single-stranded with U instead of T. It must be rewritten.
        - label: Ribosomes
          feedback: Ribosomes build proteins, not DNA.
    hints:
      - Normally it goes from DNA to RNA.
      - HIV reverses the direction.
    explanation: Reverse transcriptase rewrites RNA into DNA. Viruses with this trick are called retroviruses.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Virus or bacterium?
    params:
      cards:
        - text: Flu
          right: true
          why: Influenza viruses, new variants every year.
        - text: Tuberculosis
          right: false
          why: The cause is a rod-shaped bacterium.
        - text: Measles
          right: true
          why: A highly contagious virus.
        - text: Tetanus
          right: false
          why: A soil bacterium makes a nerve toxin.
        - text: Chickenpox
          right: true
          why: A herpes virus that stays in the body.
      left: bacterium
      right: virus
    explanation: The kind of pathogen decides the treatment.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Corona and flu viruses mutate fast, smallpox viruses barely. What is the main reason?
    params:
      options:
        - label: RNA viruses copy their genomes with little proofreading. DNA viruses have more accurate polymerases.
          correct: true
        - label: Smallpox viruses are extinct.
          feedback: They still exist in labs – and mutated slowly before too.
        - label: RNA viruses want to change.
          feedback: Mutations are random copying errors.
    hints:
      - How accurate is the copying machine?
      - Coronaviruses even have weak proofreading. Flu has none.
    explanation: That is why the flu vaccine needs an update every year, but the smallpox vaccine does not.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a virus multiplies even though it does not live like a cell.
    params:
      keywords:
        - - erbgut
          - dna
          - rna
          - gene
        - - zelle
          - cell
          - wirt
          - host
        - - andock
          - dock
          - bind
        - - kopie
          - kopier
          - nachbau
          - copy
          - copies
          - build
      sample: The virus docks onto a matching cell and smuggles its genes inside. The cell copies them and builds new viruses. These are released and infect more cells.
    explanation: A virus is a blueprint that uses other factories.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
