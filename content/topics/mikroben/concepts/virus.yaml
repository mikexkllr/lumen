id: bio.microbes.virus
type: concept
title: "Viren"
summary: "Bauplan ohne Fabrik: wie Viren Zellen kapern."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die heimlichen Herrscher
    body: Sie sind winziger als jede Zelle und streng genommen nicht einmal lebendig. Trotzdem gibt es nichts Häufigeres auf der Erde. Deck die Karten auf und staune über die **Viren**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌌
            front: Mehr als Sterne
            back: In den Meeren gibt es mehr Viren als Sterne im ganzen Universum.
          - icon: 🧬
            front: Viren in deinen Genen
            back: Rund 8 % deines Erbguts sind Reste uralter Viren.
          - icon: 🔬
            front: Größer als Bakterien?
            back: Das Riesenvirus Mimivirus ist größer als manche Bakterien.

  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Virus hat keinen Stoffwechsel und keine Ribosomen. Wie vermehrt es sich trotzdem?
    params:
      options:
        - label: Es schleust sein Erbgut in eine Zelle, und die Zelle baut neue Viren.
          correct: true
        - label: Es teilt sich wie ein Bakterium.
          feedback: Viren teilen sich nie. Sie werden von Zellen nachgebaut.
        - label: Gar nicht.
          feedback: Dann gäbe es keine Grippewellen.
    hints:
      - Wer hat die Fabrik?
      - Das Virus bringt nur den Bauplan mit.
    explanation: Viren sind Baupläne in einer Hülle. Sie zwingen fremde Zellen, Kopien herzustellen.

  - kind: explain
    id: c1
    body: Ein **Virus** besteht aus Erbgut, also DNA oder RNA, in einer Eiweißhülle, dem Kapsid. Manche tragen außen noch eine Fetthülle. Viren sind etwa 20 bis 300 nm groß – viel kleiner als Bakterien.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne die Schritte, wie ein Virus eine Zelle kapert.
    params:
      items:
        - label: Andocken an die Zelle
        - label: Erbgut gelangt hinein
        - label: Zelle kopiert das Virus-Erbgut
        - label: Neue Viren werden zusammengebaut
        - label: Viren werden freigesetzt
    hints:
      - Zuerst muss das Virus passen und andocken.
      - Am Ende verlassen Hunderte neue Viren die Zelle.
    explanation: Andocken, eindringen, kopieren, bauen, freisetzen – oft stirbt die Zelle dabei.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Eine befallene Zelle setzt {{n}} neue Viren frei. Jedes befällt wieder eine Zelle. Wie viele Viren sind es nach 3 Runden, ausgehend von einem?
    answer:
      value: "{{n ** 3}}"
    feedback:
      - when: numval(state.input) == 3 * n
        misconception: linear
        text: Jede Runde multipliziert, sie addiert nicht.
    hints:
      - "Runde 1: {{n}}. Runde 2: {{n}} · {{n}}."
      - "{{n}} hoch 3"
    explanation: "{{n}}³ = {{n ** 3}}. Darum vermehren sich Viren in Stunden bis Tagen so stark."
    variants:
      params:
        n: choice[10,50,100,200]
      defaults:
        n: 100

  - kind: problem
    id: c4
    widget: choice
    prompt: Warum befällt ein Grippevirus deine Lunge, aber nicht deine Knochen?
    params:
      options:
        - label: Es braucht passende Andockstellen, und die gibt es vor allem in den Atemwegen.
          correct: true
        - label: Knochen sind zu hart.
          feedback: Es geht um Rezeptoren auf den Zellen, nicht um Härte.
        - label: Es befällt jede Zelle gleich.
          feedback: "Viren sind wählerisch: Jedes passt nur zu bestimmten Zellen."
    hints:
      - Andocken ist wie ein Schlüssel im Schloss.
      - HIV befällt bestimmte Abwehrzellen, Hepatitis-Viren die Leber.
    explanation: Die Oberflächen-Eiweiße des Virus bestimmen, welche Zellen es befallen kann.

  - kind: explain
    id: d1
    depth: 2
    body: Manche Viren befallen sogar Bakterien. Diese **Bakteriophagen** spritzen ihr Erbgut wie eine Spritze hinein. In jedem Milliliter Meerwasser leben Millionen von ihnen.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: HIV hat RNA als Erbgut, baut sie aber in die DNA der Zelle ein. Was braucht es dafür?
    params:
      options:
        - label: Ein eigenes Enzym, das RNA in DNA umschreibt
          correct: true
        - label: Nichts, RNA und DNA sind gleich.
          feedback: RNA ist einsträngig und hat U statt T. Sie muss umgeschrieben werden.
        - label: Ribosomen
          feedback: Ribosomen bauen Eiweiße, keine DNA.
    hints:
      - Normalerweise geht es von DNA zu RNA.
      - HIV dreht die Richtung um.
    explanation: Die Reverse Transkriptase schreibt RNA in DNA um. Viren mit diesem Trick heißen Retroviren.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Virus oder Bakterium?
    params:
      cards:
        - text: Grippe
          right: true
          why: Influenzaviren, jedes Jahr neue Varianten.
        - text: Tuberkulose
          right: false
          why: Erreger ist ein Stäbchenbakterium.
        - text: Masern
          right: true
          why: Ein sehr ansteckendes Virus.
        - text: Wundstarrkrampf
          right: false
          why: Ein Bakterium im Boden bildet ein Nervengift.
        - text: Windpocken
          right: true
          why: Ein Herpesvirus, das im Körper bleibt.
      left: Bakterium
      right: Virus
    explanation: Die Art des Erregers entscheidet über die Behandlung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Corona- und Grippeviren mutieren schnell, Pockenviren kaum. Was ist der wichtigste Grund?
    params:
      options:
        - label: RNA-Viren kopieren ihr Erbgut mit wenig Korrekturlesen. DNA-Viren haben genauere Polymerasen.
          correct: true
        - label: Pockenviren sind ausgestorben.
          feedback: Sie existieren noch in Laboren – und mutierten auch früher langsam.
        - label: RNA-Viren wollen sich verändern.
          feedback: Mutationen sind zufällige Kopierfehler.
    hints:
      - Wie genau ist die Kopiermaschine?
      - Coronaviren haben sogar eine schwache Korrektur. Grippe gar keine.
    explanation: Darum braucht die Grippeimpfung jedes Jahr ein Update, die Pockenimpfung aber nicht.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Virus sich vermehrt, obwohl es nicht lebt wie eine Zelle.
    params:
      keywords:
        - - erbgut
          - dna
          - rna
          - gene
        - - zelle
          - cell
          - wirt
          - host
        - - andock
          - dock
          - bind
        - - kopie
          - kopier
          - nachbau
          - copy
          - copies
          - build
      sample: Das Virus dockt an eine passende Zelle an und schleust sein Erbgut hinein. Die Zelle kopiert es und baut neue Viren. Die werden freigesetzt und befallen weitere Zellen.
    explanation: Ein Virus ist ein Bauplan, der fremde Fabriken nutzt.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
