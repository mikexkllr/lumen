id: bio.microbes.drugs
type: concept
title: "Antibiotics and antivirals"
summary: "Why bacteria and viruses need different drugs."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You have a cold caused by a virus. Will an antibiotic help?
    params:
      options:
        - label: No. Antibiotics attack parts of bacteria that viruses do not have.
          correct: true
        - label: Yes, it kills all germs.
          feedback: Antibiotics act only against bacteria.
        - label: Yes, but more slowly.
          feedback: Against viruses it does not work at all – but it promotes resistance.
    hints:
      - Do viruses have a cell wall or ribosomes?
      - Antibiotics target exactly such parts.
    explanation: Antibiotics are useless against viruses. They only harm useful gut bacteria.

  - kind: explain
    id: c1
    body: A good drug hits something only the pathogen has. This is **selective toxicity**. Antibiotics disrupt, for example, the cell wall or the ribosomes of bacteria. Our own cells are spared.

  - kind: problem
    id: c2
    widget: match
    prompt: Which drug hits which target?
    params:
      pairs:
        - left: Penicillin
          right: Bacterial cell wall
        - left: Tetracycline
          right: Bacterial ribosomes
        - left: Oseltamivir
          right: Exit of flu viruses
        - left: HIV drugs
          right: Reverse transcriptase
    hints:
      - Two antibiotics, two antivirals.
      - Viruses have their own enzymes that can be blocked.
    explanation: Antivirals slow viral enzymes. Because viruses use our cells, there are fewer targets.

  - kind: problem
    id: c3
    widget: sim
    prompt: An antibiotic has a half-life of 6 hours in the blood. Find the earliest time at which only 25 % remains.
    params:
      scene: decay
      controls:
        halflife:
          value: 6
          fixed: true
    answer:
      time: 12
    explanation: "Two half-lives: 50 %, then 25 %. That is why many antibiotics are taken two to three times a day."

  - kind: problem
    id: c4
    widget: numeric
    prompt: A drug has a half-life of {{t}} h. What percentage is still in the blood after {{k * t}} h?
    params:
      unit: "%"
    answer:
      value: "{{100 / 2 ** k}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 200 / 2 ** k
        misconception: one-short
        text: One halving is still missing.
    hints:
      - How many half-lives are {{k * t}} h?
      - "Halve {{k}} times: 100 → 50 → …"
    explanation: "{{k}} halvings: {{100 / 2 ** k}} %. Whatever the half-life – what counts is the number of halvings."
    variants:
      params:
        t: choice[2,4,6,8]
        k: int[2,4]
      defaults:
        t: 4
        k: 3

  - kind: explain
    id: d1
    depth: 2
    body: Viruses are harder to fight. They use the machinery of our cells. An **antiviral** must hit a part only the virus has, such as a viral enzyme. That is why there are fewer drugs against viruses.

  - kind: problem
    id: d2
    depth: 2
    widget: sim
    prompt: A drug only works while more than 10 % is in the blood. The next dose comes after 24 hours. What half-life does it need at least? Try it out.
    params:
      scene: decay
      controls:
        time:
          value: 24
          fixed: true
    answer:
      left:
        - 10
        - 100
      halflife:
        - 8
        - 8
    explanation: At 7 h, 9.3 % remains after a day; at 8 h, 12.5 %. Long half-lives allow less frequent dosing.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: HIV patients usually take three drugs at once. Why?
    params:
      options:
        - label: A virus with three matching mutations at once is extremely unlikely.
          correct: true
        - label: One drug would be too weak.
          feedback: Each works alone, but resistance would come quickly.
        - label: To have fewer side effects.
          feedback: More drugs tend to mean more side effects.
    hints:
      - How likely is a resistance mutation against one drug?
      - Independent probabilities multiply.
    explanation: If each resistance is 1 in 10,000, three at once is 1 in a trillion. That is how HIV stays suppressed today.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Resistance to each of three drugs arises with odds of 1 in 10,000. With odds of 1 in how many does it arise against all three at once?
    answer:
      value: 1000000000000
    feedback:
      - when: numval(state.input) == 30000
        misconception: added
        text: Probabilities of independent events are multiplied.
    hints:
      - 10,000 × 10,000 × 10,000
      - That is 10 to the 12th.
    explanation: 1 in 10¹² – a trillion. Combination therapy is evolutionary biology serving medicine.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why antibiotics do not help against viruses.
    params:
      keywords:
        - - zellwand
          - ribosom
          - cell wall
        - - bakter
          - bacteri
        - - virus
          - viren
        - - ziel
          - trifft
          - target
          - hit
      sample: Antibiotics hit targets only bacteria have, such as the cell wall or bacterial ribosomes. Viruses have nothing like that; they use our cells. So viruses need different drugs.
    explanation: No matching target, no effect.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
