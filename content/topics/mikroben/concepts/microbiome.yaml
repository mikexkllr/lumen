id: bio.microbes.microbiome
type: concept
title: "Das Mikrobiom"
summary: "Die Billionen Mitbewohner in deinem Darm."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Mitbewohner fürs Leben
    body: "Du bist nie allein: In dir leben Billionen Bakterien. Diese Mitbewohner mischen bei mehr mit, als du denkst. Deck die Karten auf und lerne dein **Mikrobiom** kennen."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐭
            front: Mäuse ohne Keime
            back: Wachsen sie ganz ohne Bakterien auf, bleibt ihr Immunsystem schwach.
          - icon: 😊
            front: Glück aus dem Bauch?
            back: Rund 90 % des Botenstoffs Serotonin entstehen im Darm. Bakterien reden dabei mit.
          - icon: 🌴
            front: Dschungel im Bauchnabel
            back: In nur 60 Bauchnabeln fanden Forschende über 2000 Arten von Bakterien.

  - kind: problem
    id: hook
    widget: estimate
    prompt: Wie viel wiegen alle Bakterien in deinem Körper zusammen? Schätz mal in Gramm.
    params:
      min: 1
      max: 10000
      scale: log
      unit: g
    answer:
      value: 200
      within: 50
    explanation: Rund 200 g, die meisten im Dickdarm. Früher hieß es oft 1 bis 2 kg – neuere Schätzungen sind viel kleiner.

  - kind: explain
    id: c1
    body: In deinem Darm leben Billionen Bakterien aus Hunderten Arten. Zusammen heißen sie **Mikrobiom**. Sie verdauen Ballaststoffe, bilden Vitamine und trainieren dein Immunsystem.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Hilft das Mikrobiom dabei?
    params:
      buckets:
        - id: b1
          label: ja
        - id: b2
          label: nein
      items:
        - label: Ballaststoffe abbauen
          bucket: b1
        - label: Vitamin K bilden
          bucket: b1
        - label: Krankheitskeime verdrängen
          bucket: b1
        - label: Sauerstoff ins Blut bringen
          bucket: b2
        - label: Gedanken speichern
          bucket: b2
    hints:
      - Darmbakterien arbeiten im Darm.
      - Sauerstoff transportieren rote Blutkörperchen.
    explanation: Das Mikrobiom ist wie ein zusätzliches Organ für Verdauung und Abwehr.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Du hast etwa 30 Billionen eigene Zellen und 38 Billionen Bakterien. Wie viele Bakterien kommen auf eine eigene Zelle? Runde auf eine Stelle.
    answer:
      value: 1.3
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 10
        misconception: ten-to-one
        text: Die alte Faustregel »zehnmal mehr« gilt als überholt. Rechne nach.
    hints:
      - Teile Bakterien durch eigene Zellen.
      - "38 : 30"
    explanation: Etwa 1,3 zu 1 – ungefähr gleich viele. Nach einem Stuhlgang verschiebt sich das sogar Richtung 1 zu 1.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die Bakterien im Darm heißen zusammen [[Mikrobiom]]. Sie bauen [[Ballaststoffe]] ab und bilden [[Vitamine]].
      distractors:
        - Hormone
        - Viren
    explanation: Ein Mitbewohner, der mitarbeitet.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Nach einer langen Antibiotika-Kur bekommen manche Menschen schweren Durchfall durch das Bakterium C. difficile. Warum?
    params:
      options:
        - label: Die nützlichen Bakterien wurden mit vernichtet. Der resistente Keim hat freie Bahn.
          correct: true
        - label: Antibiotika erzeugen C. difficile.
          feedback: Der Keim war schon da oder kam dazu. Er wird nur nicht mehr verdrängt.
        - label: Der Darm verträgt keine Tabletten.
          feedback: Es geht um das Gleichgewicht der Bakterien.
    hints:
      - Wer hielt den Keim vorher in Schach?
      - Leere Plätze werden schnell neu besiedelt.
    explanation: Ein gesundes Mikrobiom schützt durch Konkurrenz. Fällt es aus, übernehmen Störenfriede.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: Bei schweren Rückfällen von C. difficile hilft eine **Stuhltransplantation**. Gereinigter Stuhl eines Gesunden bringt ein ganzes Mikrobiom zurück. Das heilt die meisten Patienten – besser als weitere Antibiotika.

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: "Mikrobiom-Forschung: Stimmt das?"
    params:
      cards:
        - text: Babys bekommen erste Bakterien bei der Geburt.
          right: true
          why: Bei natürlicher Geburt vor allem von der Mutter.
        - text: Ballaststoffe füttern nützliche Darmbakterien.
          right: true
          why: Sie machen daraus kurzkettige Fettsäuren für die Darmzellen.
        - text: Alle Menschen haben das gleiche Mikrobiom.
          right: false
          why: Es ist so individuell wie ein Fingerabdruck.
        - text: Weniger Bakterien sind immer gesünder.
          right: false
          why: Vielfalt ist meist ein Zeichen von Gesundheit.
    explanation: Ein vielfältiges Mikrobiom ist robust. Ernährung und Medikamente formen es.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Eine Studie findet: Menschen mit Übergewicht haben ein anderes Mikrobiom. Was folgt daraus sicher?"
    params:
      options:
        - label: Nur ein Zusammenhang. Ob das Mikrobiom Ursache oder Folge ist, muss man getrennt prüfen.
          correct: true
        - label: Das Mikrobiom macht dick.
          feedback: Vielleicht – doch auch die Ernährung formt das Mikrobiom.
        - label: Gar nichts.
          feedback: Ein Zusammenhang ist ein Hinweis, nur kein Beweis.
    hints:
      - Korrelation ist nicht Kausalität.
      - Wie könnte man die Richtung prüfen?
    explanation: In Versuchen mit keimfreien Mäusen übertrug sich mit dem Mikrobiom auch Gewichtszunahme. Beim Menschen ist es komplizierter.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was das Mikrobiom ist und warum Antibiotika es stören.
    params:
      keywords:
        - - darm
          - gut
        - - bakter
          - bacteri
        - - verdau
          - vitamin
          - abwehr
          - immun
          - digest
          - defen
        - - antibiot
      sample: Das Mikrobiom sind die Billionen Bakterien in deinem Darm. Sie helfen beim Verdauen, bilden Vitamine und stärken die Abwehr. Antibiotika töten auch diese nützlichen Bakterien.
    explanation: Nützliche Mitbewohner – und darum Antibiotika nur, wenn nötig.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
