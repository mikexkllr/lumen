id: bio.microbes.microbiome
type: concept
title: "The microbiome"
summary: "The trillions of lodgers in your gut."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Lodgers for life
    body: "You are never alone: trillions of bacteria live inside you. These lodgers have a say in more than you think. Uncover the cards and get to know your **microbiome**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐭
            front: Germ-free mice
            back: If they grow up without any bacteria, their immune system stays weak.
          - icon: 😊
            front: Happiness from the gut?
            back: About 90 % of the messenger serotonin is made in the gut. Bacteria have a say in it.
          - icon: 🌴
            front: A jungle in your belly button
            back: In just 60 belly buttons, researchers found over 2,000 kinds of bacteria.

  - kind: problem
    id: hook
    widget: estimate
    prompt: How much do all the bacteria in your body weigh together? Guess in grams.
    params:
      min: 1
      max: 10000
      scale: log
      unit: g
    answer:
      value: 200
      within: 50
    explanation: About 200 g, most of them in the large intestine. People used to say 1 to 2 kg – newer estimates are much lower.

  - kind: explain
    id: c1
    body: Trillions of bacteria from hundreds of species live in your gut. Together they are called the **microbiome**. They digest fibre, make vitamins and train your immune system.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Does the microbiome help with this?
    params:
      buckets:
        - id: b1
          label: yes
        - id: b2
          label: no
      items:
        - label: Breaking down fibre
          bucket: b1
        - label: Making vitamin K
          bucket: b1
        - label: Crowding out pathogens
          bucket: b1
        - label: Carrying oxygen into blood
          bucket: b2
        - label: Storing thoughts
          bucket: b2
    hints:
      - Gut bacteria work in the gut.
      - Red blood cells carry oxygen.
    explanation: The microbiome is like an extra organ for digestion and defence.

  - kind: problem
    id: c3
    widget: numeric
    prompt: You have about 30 trillion of your own cells and 38 trillion bacteria. How many bacteria are there per human cell? Round to one decimal.
    answer:
      value: 1.3
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 10
        misconception: ten-to-one
        text: The old rule of thumb "ten times more" is outdated. Do the maths.
    hints:
      - Divide bacteria by human cells.
      - 38 ÷ 30
    explanation: About 1.3 to 1 – roughly equal. After a bowel movement it even shifts towards 1 to 1.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Together the bacteria in the gut are called the [[microbiome]]. They break down [[fibre]] and make [[vitamins]].
      distractors:
        - hormones
        - viruses
    explanation: A lodger who pitches in.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: After a long course of antibiotics some people get severe diarrhoea from the bacterium C. difficile. Why?
    params:
      options:
        - label: The useful bacteria were wiped out too. The resistant germ has free rein.
          correct: true
        - label: Antibiotics create C. difficile.
          feedback: The germ was already there or arrived. It is simply no longer crowded out.
        - label: The gut cannot tolerate pills.
          feedback: It is about the balance of bacteria.
    hints:
      - Who kept the germ in check before?
      - Empty places are quickly recolonised.
    explanation: A healthy microbiome protects through competition. When it fails, troublemakers take over.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: For severe relapses of C. difficile a **faecal transplant** helps. Purified stool from a healthy person brings back a whole microbiome. It cures most patients – better than more antibiotics.

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: "Microbiome research: true or false?"
    params:
      cards:
        - text: Babies get their first bacteria at birth.
          right: true
          why: In a natural birth mainly from the mother.
        - text: Fibre feeds useful gut bacteria.
          right: true
          why: They turn it into short-chain fatty acids for gut cells.
        - text: Everyone has the same microbiome.
          right: false
          why: It is as individual as a fingerprint.
        - text: Fewer bacteria are always healthier.
          right: false
          why: Diversity is usually a sign of health.
    explanation: A diverse microbiome is robust. Diet and medication shape it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A study finds: people with obesity have a different microbiome. What follows for certain?"
    params:
      options:
        - label: Only a correlation. Whether the microbiome is cause or effect must be tested separately.
          correct: true
        - label: The microbiome makes people fat.
          feedback: Maybe – but diet also shapes the microbiome.
        - label: Nothing at all.
          feedback: A correlation is a clue, just not proof.
    hints:
      - Correlation is not causation.
      - How could you test the direction?
    explanation: In experiments with germ-free mice, weight gain transferred along with the microbiome. In humans it is more complicated.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what the microbiome is and why antibiotics disturb it.
    params:
      keywords:
        - - darm
          - gut
        - - bakter
          - bacteri
        - - verdau
          - vitamin
          - abwehr
          - immun
          - digest
          - defen
        - - antibiot
      sample: The microbiome is the trillions of bacteria in your gut. They help with digestion, make vitamins and strengthen your defences. Antibiotics kill these useful bacteria too.
    explanation: Useful lodgers – so antibiotics only when necessary.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
