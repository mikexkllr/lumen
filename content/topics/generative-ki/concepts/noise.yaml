id: ai.generative.noise
type: concept
title: Aus Rauschen wird Bild
summary: Die Grundidee der Bildgeneratoren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: start
    widget: choice
    prompt: Womit beginnt ein Bildgenerator, bevor er ein Bild malt?
    params:
      options:
        - { label: Mit reinem Zufallsrauschen, correct: true }
        - { label: Mit einem passenden Foto aus dem Internet, feedback: "Er kopiert kein Foto – er formt Rauschen Schritt für Schritt." }
        - { label: Mit einer weißen Fläche, feedback: "Weiß wäre zu gleichförmig – der Zufall liefert die Vielfalt." }
    hints:
      - Wie sieht ein Fernseher ohne Empfang aus?
    explanation: Aus dem Rauschen wird in vielen Schritten ein Bild.

  - kind: explain
    id: s2
    body: |
      **Diffusionsmodelle** lernen das Gegenteil von Verrauschen: Man gibt ihnen Bilder mit etwas Rauschen und lässt sie raten, welches Rauschen entfernt werden muss. Millionen Mal.

  - kind: problem
    id: training
    widget: order
    prompt: Bring einen Trainingsschritt in die richtige Reihenfolge.
    params:
      items:
        - { label: Ein echtes Bild nehmen }
        - { label: Zufälliges Rauschen hinzufügen }
        - { label: Das Modell rät das Rauschen }
        - { label: Aus dem Fehler lernen }
    hints:
      - Das Modell muss erraten, was dazugefügt wurde.
    explanation: Wer Rauschen erkennen kann, kann es auch entfernen.

  - kind: problem
    id: dauer
    widget: numeric
    prompt: Ein Generator braucht {{n}} Schritte zu je 0,1 Sekunden. Wie lange dauert ein Bild?
    params: { unit: s }
    answer: { value: "{{n / 10}}" }
    hints:
      - "{{n}} · 0,1."
    explanation: "{{n / 10}} Sekunden – darum arbeiten Forscher an Verfahren mit weniger Schritten."
    variants:
      params: { n: "choice[20,30,50,100]" }
      defaults: { n: 50 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Bildgenerator startet mit Zufallsrauschen.
          right: true
        - text: Er setzt das Bild aus gespeicherten Fotos zusammen.
          right: false
          why: Er hat keine Bilder gespeichert – nur gelernte Muster in Gewichten.
        - text: Derselbe Prompt kann sehr verschiedene Bilder ergeben.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Im Training werden echte Bilder schrittweise verrauscht. Was genau soll das Modell vorhersagen?
    params:
      options:
        - label: Das Rauschen, das hinzugefügt wurde
          correct: true
        - label: Den Namen des Bildes
          feedback: Das wäre Bilderkennung.
        - label: Das nächste Bild einer Serie
          feedback: Es geht um ein einzelnes Bild.
    hints:
      - Wer das Rauschen kennt, kann es abziehen.
    explanation: Die Aufgabe ist einfach zu stellen und braucht keine Beschriftung – so lassen sich Milliarden Bilder nutzen.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein verrauschtes Trainingsbild ist a · Bild + b · Rauschen mit a² + b² = 1. Bei einem Schritt ist a = 0,8. Wie groß ist b?
    answer:
      value: 0.6
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.2
        misconception: linear
        text: a und b ergeben nicht zusammen 1 – ihre **Quadrate** tun das.
    hints:
      - b² = 1 − a² = 1 − 0,64.
      - √0,36 = ?
    explanation: b = 0,6. Über viele Schritte sinkt a gegen 0 und b steigt gegen 1 – am Ende bleibt **reines Rauschen**. Die Quadrat-Regel hält die Gesamtstärke des Signals konstant.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Vor Diffusionsmodellen waren GANs verbreitet. Wie lernt ein GAN?
    params:
      options:
        - label: Ein Netz fälscht Bilder, ein zweites versucht, Fälschungen zu erkennen – beide werden besser.
          correct: true
        - label: Es entfernt Rauschen in vielen kleinen Schritten.
          feedback: Das ist die Idee der Diffusion.
        - label: Es kopiert Bilder aus einer Datenbank.
          feedback: Es erzeugt neue Bilder – es speichert keine Bibliothek.
    hints:
      - GAN heißt »Generative Adversarial Network« – adversarial bedeutet gegnerisch.
      - Wer sind die zwei Gegner?
    explanation: "Fälscher gegen **Prüfer**: Ein GAN erzeugt in einem einzigen Schritt, ist also schnell. Das Training ist aber oft instabil. Diffusion ist langsamer, aber gutmütiger und vielseitiger."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Neue Bild-KIs arbeiten nicht mit den Pixeln selbst. Sie nutzen eine viel kleinere Fassung des Bildes. Warum?
    params:
      options:
        - label: Das spart enorm Rechenzeit – ein zweites Netz übersetzt am Ende zurück in Pixel
          correct: true
        - label: Die Bilder werden dadurch schärfer
          feedback: Es geht um Effizienz.
        - label: Pixel kann man nicht verrauschen
          feedback: Das kann man – es ist nur teuer.
    hints:
      - Eine Million Pixel oder ein paar tausend Zahlen – was ist schneller?
    explanation: "**Latente Diffusion**: Ein Autoencoder komprimiert das Bild etwa 50-fach. Erst das machte Generatoren auf normalen Rechnern möglich."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Das Modell sagt nur das Rauschen in einem Bild voraus. Warum reicht das, um ein sauberes Bild zu schätzen?
    params:
      options:
        - label: Kennt man Mischung und Rauschen, kann man das Rauschen abziehen und zurückrechnen.
          correct: true
        - label: Es reicht nicht – man braucht ein zweites Modell.
          feedback: "Ein Modell genügt: Bild = (Mischung − b · Rauschen) / a."
        - label: Weil Rauschen und Bild dasselbe sind.
          feedback: Sie sind verschieden – genau darum kann man sie trennen.
    hints:
      - Mischung = a · Bild + b · Rauschen, a und b sind bekannt.
      - Stelle nach dem Bild um.
    explanation: Bild ≈ (Mischung − b · geschätztes Rauschen) / a. Die Schätzung ist anfangs grob. Darum geht man nur einen **kleinen Schritt** in ihre Richtung und schätzt dann neu.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Diffusionsmodell trainiert wird.
    params:
      keywords:
        - - rausch
          - noise
        - - echt
          - foto
          - bild
          - real
          - photo
          - image
        - - vorhersag
          - rat
          - schätz
          - predict
          - guess
          - estimate
      sample: Man nimmt echte Bilder und fügt Rauschen hinzu. Das Modell soll vorhersagen, welches Rauschen hinzugefügt wurde. Liegt es daneben, werden die Gewichte korrigiert – millionenfach.
    difficulty: 3

srs:
  cards_from: [start, training]
