id: ai.generative.diffusion
type: concept
title: Step by step to an image
summary: How text steers the noise.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ink in reverse
    body: "A picture out of nothing, in a few seconds. Behind it is an idea called **diffusion**. Uncover the cards: where does it come from, and what else can it do?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 💧
            front: Ink in water
            back: "The name comes from physics: ink spreads out in water. The model plays this backwards."
          - icon: ⏱️
            front: Many small steps
            back: An image often takes 20 to 50 denoising steps.
          - icon: 🧬
            front: New proteins
            back: The same technique now even designs proteins that never existed in nature.
          - icon: 🎬
            front: Videos too
            back: Video generators denoise many frames at once – so that everything fits together.

  - kind: problem
    id: hook
    widget: choice
    prompt: "A sculptor says: “The figure is already in the stone. I only remove what does not belong.” What does an image AI start with?"
    params:
      options:
        - label: With pure noise
          correct: true
        - label: With a finished photo
          feedback: Then it would have nothing to create.
        - label: With a white sheet
          feedback: It removes – it does not paint on.
    hints:
      - What can you carve something out of?
    explanation: Step by step noise becomes a picture.

  - kind: explain
    id: s1
    body: |
      When generating, the model removes a little noise in each step. The **text** steers the direction: the gray becomes a cat one time and a lighthouse another.

  - kind: problem
    id: seed
    widget: choice
    prompt: Same text, but a different random start. What comes out?
    params:
      options:
        - { label: A different image on the same topic, correct: true }
        - { label: Exactly the same image, feedback: "You only get the same image with the same random start." }
    hints:
      - What else does the result depend on besides the text?
    explanation: The random start is called the **seed**. With it, you can repeat images exactly.

  - kind: problem
    id: zahlen
    widget: numeric
    prompt: A color image has {{s}} × {{s}} pixels with three color values each. How many numbers must the model denoise?
    params: { placeholder: "Number" }
    answer: { value: "{{s * s * 3}}" }
    hints:
      - Pixels times 3.
    explanation: "{{s * s * 3}} numbers – that is why many models work in a shrunken space."
    variants:
      params: { s: "choice[64,128,256,512]" }
      defaults: { s: 256 }

  - kind: problem
    id: klein
    widget: choice
    prompt: Why remove the noise in many small steps instead of one big one?
    params:
      options:
        - { label: Small corrections are much easier to guess right., correct: true }
        - { label: Because computers can only take small steps., feedback: "It is a question of learnability, not computing power." }
    hints:
      - Is it easier to guess a whole image or just a small improvement?
    explanation: Many small, well-learned steps add up to a big result.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: "From noise to picture: order the stages."
    params:
      items:
        - label: Pure noise
        - label: Rough areas and colours
        - label: Recognisable outlines
        - label: Fine details
    hints:
      - First the rough, then the fine.
    explanation: Each step removes a little noise. Details come at the very end.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A control called “guidance” determines how strongly the model sticks to the text. What happens at a very high value?
    params:
      options:
        - label: The image matches the text more closely but often looks oversaturated and unnatural
          correct: true
        - label: The image becomes more random
          feedback: "On the contrary: it is tied more tightly to the text."
        - label: Nothing
          feedback: The control has a big influence.
    hints:
      - Too much of a good thing.
    explanation: "As with temperature: a control between fidelity and variety."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "With guidance you mix two estimates: without text u, with text t. Result = u + w · (t − u). With u = 1, t = 2 and w = 3 – what comes out?"
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: w-one
        text: That would be w = 1 – just the text estimate. Guidance exaggerates the difference.
    hints:
      - t − u = 1.
      - 1 + 3 · 1 = ?
    explanation: With w > 1 you go beyond the text estimate – towards "even more like the text". Too large a w makes images overdone and uniform.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An image of 512 × 512 pixels is represented in latent space as a 64 × 64 grid with 4 channels. By what factor is that smaller than the 512 × 512 × 3 pixel values?
    answer:
      value: 48
    hints:
      - 786,432 divided by 16,384.
    explanation: 48 times fewer numbers – at almost the same image quality.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Newer methods create images in 1 to 4 steps instead of 50. How is that usually done?
    params:
      options:
        - label: A student model learns to do several of the teacher model's steps at once.
          correct: true
        - label: You simply skip steps.
          feedback: Without adjustment the images get much worse.
        - label: With more noise at the start.
          feedback: More noise makes the task harder, not shorter.
    hints:
      - The slow model knows the way from noise to image.
      - Can a second model learn to take shortcuts?
    explanation: This distillation saves a lot of computing time but often costs some variety or detail. Better numerical methods for the steps themselves help too.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how the text prompt steers image generation step by step.
    params:
      keywords:
        - - schritt
          - step
        - - rausch
          - noise
        - - text
          - prompt
          - richtung
          - direction
      sample: The model starts with noise and removes a little in every step. The text sets the direction, so the grey gradually turns into a matching picture.
    difficulty: 3

srs:
  cards_from: [seed, klein]
