id: ai.generative.prompts
type: concept
title: Bilder beschreiben
summary: Was ein Bild-Prompt steuert.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: besser
    widget: choice
    prompt: Welcher Prompt liefert eher das gewünschte Bild?
    params:
      options:
        - { label: "»Ein roter Fuchs im Schnee, Morgenlicht, Aquarell«", correct: true }
        - { label: »Mach was Schönes mit Tieren«, feedback: "Ohne Motiv, Stil und Licht muss das Modell alles raten." }
    hints:
      - Was, wo, welches Licht, welcher Stil?
    explanation: Motiv, Umgebung, Licht und Stil geben dem Rauschen eine klare Richtung.

  - kind: explain
    id: s2
    body: |
      Der **Prompt** wird in einen Vektor übersetzt, der jeden Entrauschungsschritt lenkt. Begriffe, die in den Trainingsbildern häufig vorkamen, wirken stärker als seltene.

  - kind: problem
    id: wirkung
    widget: buckets
    prompt: Beeinflusst das das Bild stark?
    params:
      buckets: [{ label: stark }, { label: kaum }]
      items:
        - { label: Das Motiv, bucket: stark }
        - { label: Der Malstil, bucket: stark }
        - { label: Die Lichtstimmung, bucket: stark }
        - { label: »Bitte« und »danke«, bucket: kaum }
    hints:
      - Was sieht man auf einem Bild?
    explanation: Höflichkeit schadet nicht – aber sichtbar wird nur, was sich zeigen lässt.

  - kind: problem
    id: haende
    widget: choice
    prompt: Warum hatten Bildgeneratoren lange Probleme mit Händen?
    params:
      options:
        - { label: Hände sehen auf Fotos in sehr vielen Haltungen anders aus., correct: true }
        - { label: Hände sind verboten., feedback: "Es liegt an der Vielfalt und den verdeckten Fingern." }
    hints:
      - Wie oft sieht man auf Fotos alle fünf Finger deutlich?
    explanation: Viele Haltungen, oft verdeckte Finger – das Muster ist schwer zu lernen.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Genauer oder vager Bild-Prompt?
    params:
      buckets:
        - id: b1
          label: Genau
        - id: b2
          label: Vage
      items:
        - label: »Roter Fuchs im Schnee, Abendlicht«
          bucket: b1
        - label: »Ein schönes Bild«
          bucket: b2
        - label: »Ölgemälde, Weitwinkel, Nebel«
          bucket: b1
        - label: »Irgendwas mit Tieren«
          bucket: b2
    hints:
      - Was davon kann man sich sofort vorstellen?
    explanation: Motiv, Stil und Licht geben dem Modell eine klare Richtung.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Der [[Prompt]] lenkt jeden Schritt. Häufige Begriffe aus dem Training wirken [[stärker]] als seltene.
      distractors:
        - Zufall
        - leiser

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein **negativer Prompt** nennt, was **nicht** im Bild sein soll. Wie wirkt er technisch?
    params:
      options:
        - label: Das Modell wird bei jedem Schritt von dieser Beschreibung weggelenkt
          correct: true
        - label: Die Wörter werden einfach gelöscht
          feedback: Sie werden aktiv als Gegenrichtung genutzt.
        - label: Das Bild wird danach retuschiert
          feedback: Es wirkt während der Erzeugung.
    hints:
      - Ein Text lenkt hin – ein anderer lenkt weg.
    explanation: Im Vektorraum sind »hin zu« und »weg von« nur zwei Richtungen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Generator malt auf »Arzt« fast nur Männer und auf »Pflegekraft« fast nur Frauen. Woher kommt das?
    params:
      options:
        - label: Aus den Trainingsbildern – und das Modell verstärkt solche Häufungen oft noch
          correct: true
        - label: Die Entwickler haben es so eingestellt
          feedback: Es entsteht aus den Daten.
        - label: Zufall
          feedback: Es wiederholt sich bei jedem Versuch.
    hints:
      - Das Modell bildet ab, was es am häufigsten gesehen hat.
    explanation: "Aus »meistens« wird leicht »immer«: Modelle neigen zum häufigsten Fall und verstärken so Klischees."
    difficulty: 3

srs:
  cards_from: [besser, haende]
