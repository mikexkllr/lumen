id: ai.generative.diffusion
type: concept
title: Schritt für Schritt zum Bild
summary: Wie Text das Rauschen lenkt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Ein Bildhauer sagt: »Die Figur steckt schon im Stein. Ich nehme nur weg, was nicht dazugehört.« Womit beginnt eine Bild-KI?"
    params:
      options:
        - label: Mit reinem Rauschen
          correct: true
        - label: Mit einem fertigen Foto
          feedback: Dann müsste sie nichts erzeugen.
        - label: Mit einem weißen Blatt
          feedback: Sie nimmt weg – sie malt nicht auf.
    hints:
      - Woraus kann man etwas herausarbeiten?
    explanation: Aus Rauschen wird Schritt für Schritt ein Bild.

  - kind: explain
    id: s1
    body: |
      Beim Erzeugen entfernt das Modell in jedem Schritt ein wenig Rauschen. Der **Text** lenkt dabei, in welche Richtung: Aus dem Grau wird mal eine Katze, mal ein Leuchtturm.

  - kind: problem
    id: seed
    widget: choice
    prompt: Gleicher Text, aber ein anderer Zufallsstart. Was kommt heraus?
    params:
      options:
        - { label: Ein anderes Bild zum selben Thema, correct: true }
        - { label: Exakt dasselbe Bild, feedback: "Nur mit gleichem Zufallsstart entsteht dasselbe Bild." }
    hints:
      - Wovon hängt das Ergebnis außer dem Text noch ab?
    explanation: Der Zufallsstart heißt **Seed** – mit ihm lassen sich Bilder exakt wiederholen.

  - kind: problem
    id: zahlen
    widget: numeric
    prompt: Ein Farbbild hat {{s}} × {{s}} Pixel mit je drei Farbwerten. Wie viele Zahlen muss das Modell entrauschen?
    params: { placeholder: "Zahl" }
    answer: { value: "{{s * s * 3}}" }
    hints:
      - Pixel mal 3.
    explanation: "{{s * s * 3}} Zahlen – darum arbeiten viele Modelle in einem verkleinerten Raum."
    variants:
      params: { s: "choice[64,128,256,512]" }
      defaults: { s: 256 }

  - kind: problem
    id: klein
    widget: choice
    prompt: Warum entfernt man das Rauschen in vielen kleinen Schritten statt in einem großen?
    params:
      options:
        - { label: Kleine Korrekturen sind viel leichter richtig zu raten., correct: true }
        - { label: Weil Computer nur kleine Schritte können., feedback: "Es ist eine Frage der Lernbarkeit, nicht der Rechenleistung." }
    hints:
      - Ist es leichter, ein ganzes Bild zu erraten oder nur eine kleine Verbesserung?
    explanation: Viele kleine, gut gelernte Schritte ergeben zusammen ein großes Ergebnis.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: "Vom Rauschen zum Bild: Ordne die Zwischenstufen."
    params:
      items:
        - label: Reines Rauschen
        - label: Grobe Flächen und Farben
        - label: Erkennbare Umrisse
        - label: Feine Details
    hints:
      - Erst das Grobe, dann das Feine.
    explanation: Jeder Schritt entfernt ein wenig Rauschen. Details kommen ganz zum Schluss.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Regler namens »Guidance« bestimmt, wie stark sich das Modell an den Text hält. Was passiert bei sehr hohem Wert?
    params:
      options:
        - label: Das Bild passt genauer zum Text, wirkt aber oft übersättigt und unnatürlich
          correct: true
        - label: Das Bild wird zufälliger
          feedback: "Im Gegenteil: Es wird enger an den Text gebunden."
        - label: Nichts
          feedback: Der Regler hat großen Einfluss.
    hints:
      - Zu viel von etwas Gutem.
    explanation: "Wie bei der Temperatur: ein Regler zwischen Treue und Vielfalt."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Bei der Guidance mischt man zwei Schätzungen: ohne Text u, mit Text t. Ergebnis = u + w · (t − u). Mit u = 1, t = 2 und w = 3 – was kommt heraus?"
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: w-one
        text: Das wäre w = 1 – nur die Schätzung mit Text. Guidance übertreibt den Unterschied.
    hints:
      - t − u = 1.
      - 1 + 3 · 1 = ?
    explanation: Bei w > 1 geht man über die Text-Schätzung **hinaus** – in Richtung »noch mehr wie der Text«. Zu große w machen Bilder überzeichnet und eintönig.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Bild mit 512 × 512 Pixeln wird im latenten Raum als 64 × 64 Raster mit 4 Kanälen dargestellt. Um welchen Faktor ist das kleiner als die 512 × 512 × 3 Pixelwerte?
    answer:
      value: 48
    hints:
      - 786 432 geteilt durch 16 384.
    explanation: 48-mal weniger Zahlen – bei fast gleicher Bildqualität.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Neuere Verfahren erzeugen Bilder in 1 bis 4 statt 50 Schritten. Wie geht das meist?
    params:
      options:
        - label: Ein Schülermodell lernt, mehrere Schritte des Lehrermodells auf einmal zu machen.
          correct: true
        - label: Man lässt einfach Schritte weg.
          feedback: Ohne Anpassung werden die Bilder dann deutlich schlechter.
        - label: Mit mehr Rauschen am Anfang.
          feedback: Mehr Rauschen macht die Aufgabe schwerer, nicht kürzer.
    hints:
      - Das langsame Modell kennt den Weg vom Rauschen zum Bild.
      - Kann ein zweites Modell lernen, Abkürzungen zu nehmen?
    explanation: Diese **Destillation** spart viel Rechenzeit, kostet aber oft etwas Vielfalt oder Detail. Dazu kommen bessere Rechenverfahren für die Schritte selbst.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie der Text-Prompt die Bilderzeugung Schritt für Schritt lenkt.
    params:
      keywords:
        - - schritt
          - step
        - - rausch
          - noise
        - - text
          - prompt
          - richtung
          - direction
      sample: Das Modell startet mit Rauschen und entfernt in jedem Schritt ein wenig davon. Der Text gibt dabei die Richtung vor, sodass aus dem Grau nach und nach ein passendes Bild wird.
    difficulty: 3

srs:
  cards_from: [seed, klein]
