id: ai.generative.diffusion
type: concept
title: Schritt für Schritt zum Bild
summary: Wie Text das Rauschen lenkt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Ein Bildhauer sagt: »Die Figur steckt schon im Stein. Ich nehme nur weg, was nicht dazugehört.« Womit beginnt eine Bild-KI?"
    params:
      options:
        - label: Mit reinem Rauschen
          correct: true
        - label: Mit einem fertigen Foto
          feedback: Dann müsste sie nichts erzeugen.
        - label: Mit einem weißen Blatt
          feedback: Sie nimmt weg – sie malt nicht auf.
    hints:
      - Woraus kann man etwas herausarbeiten?
    explanation: Aus Rauschen wird Schritt für Schritt ein Bild.


  - kind: explain
    id: s1
    body: |
      Beim Erzeugen entfernt das Modell in jedem Schritt ein wenig Rauschen. Der **Text** lenkt dabei, in welche Richtung: Aus dem Grau wird mal eine Katze, mal ein Leuchtturm.

  - kind: problem
    id: seed
    widget: choice
    prompt: Gleicher Text, aber ein anderer Zufallsstart. Was kommt heraus?
    params:
      options:
        - { label: Ein anderes Bild zum selben Thema, correct: true }
        - { label: Exakt dasselbe Bild, feedback: "Nur mit gleichem Zufallsstart entsteht dasselbe Bild." }
    hints:
      - Wovon hängt das Ergebnis außer dem Text noch ab?
    explanation: Der Zufallsstart heißt **Seed** – mit ihm lassen sich Bilder exakt wiederholen.

  - kind: problem
    id: zahlen
    widget: numeric
    prompt: Ein Farbbild hat {{s}} × {{s}} Pixel mit je drei Farbwerten. Wie viele Zahlen muss das Modell entrauschen?
    params: { placeholder: "Zahl" }
    answer: { value: "{{s * s * 3}}" }
    hints:
      - Pixel mal 3.
    explanation: "{{s * s * 3}} Zahlen – darum arbeiten viele Modelle in einem verkleinerten Raum."
    variants:
      params: { s: "choice[64,128,256,512]" }
      defaults: { s: 256 }

  - kind: problem
    id: klein
    widget: choice
    prompt: Warum entfernt man das Rauschen in vielen kleinen Schritten statt in einem großen?
    params:
      options:
        - { label: Kleine Korrekturen sind viel leichter richtig zu raten., correct: true }
        - { label: Weil Computer nur kleine Schritte können., feedback: "Es ist eine Frage der Lernbarkeit, nicht der Rechenleistung." }
    hints:
      - Ist es leichter, ein ganzes Bild zu erraten oder nur eine kleine Verbesserung?
    explanation: Viele kleine, gut gelernte Schritte ergeben zusammen ein großes Ergebnis.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Regler namens »Guidance« bestimmt, wie stark sich das Modell an den Text hält. Was passiert bei sehr hohem Wert?
    params:
      options:
        - label: Das Bild passt genauer zum Text, wirkt aber oft übersättigt und unnatürlich
          correct: true
        - label: Das Bild wird zufälliger
          feedback: "Im Gegenteil: Es wird enger an den Text gebunden."
        - label: Nichts
          feedback: Der Regler hat großen Einfluss.
    hints:
      - Zu viel von etwas Gutem.
    explanation: "Wie bei der Temperatur: ein Regler zwischen Treue und Vielfalt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Bild mit 512 × 512 Pixeln wird im latenten Raum als 64 × 64 Raster mit 4 Kanälen dargestellt. Um welchen Faktor ist das kleiner als die 512 × 512 × 3 Pixelwerte?
    answer:
      value: 48
    hints:
      - 786 432 geteilt durch 16 384.
    explanation: 48-mal weniger Zahlen – bei fast gleicher Bildqualität.
    difficulty: 3

srs:
  cards_from: [seed, klein]
