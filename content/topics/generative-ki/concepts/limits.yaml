id: ai.generative.limits
type: concept
title: Grenzen und Rechte
summary: Urheberrecht, Kennzeichnung, Missbrauch.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wem gehört das Bild?
    body: "KI-Bilder sind in Sekunden gemacht. Doch wem gehören sie – und wessen Werke stecken darin? Deck die Karten auf: Wo stößt das **Urheberrecht** an Grenzen?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏷️
            front: Das verzerrte Wasserzeichen
            back: Ein Bildgenerator malte das Wasserzeichen einer Fotoagentur nach. Die Agentur zog vor Gericht.
          - icon: 🐒
            front: Das Affen-Selfie
            back: "Wem gehört ein Bild, das kein Mensch gemacht hat? In den USA oft: niemandem."
          - icon: 🎨
            front: Im Stil von …
            back: Lebende Künstler fanden ihren Stil in Tausenden KI-Bildern wieder – ungefragt.

  - kind: problem
    id: erkennen
    widget: choice
    prompt: Kann man KI-Bilder sicher von echten Fotos unterscheiden?
    params:
      options:
        - { label: Nicht zuverlässig – Herkunftsnachweise helfen mehr., correct: true }
        - { label: "Ja, an falschen Fingern", feedback: "Solche Fehler werden mit jeder Modellgeneration seltener." }
    hints:
      - Werden die Modelle besser oder schlechter?
    explanation: Digitale Herkunftssignaturen und Wasserzeichen sind verlässlicher als Detektive.

  - kind: explain
    id: s2
    body: |
      Generative Modelle lernen aus Milliarden fremder Bilder und Texte. Ob und wie das **Urheberrecht** dafür gilt, wird gerade vor Gerichten geklärt. Klar ist: Was du erzeugst, darf andere nicht täuschen oder verletzen.

  - kind: problem
    id: einsatz
    widget: buckets
    prompt: Unproblematisch oder heikel?
    params:
      buckets: [{ label: unproblematisch }, { label: heikel }]
      items:
        - { label: Moodboard für die Wohnung, bucket: unproblematisch }
        - { label: Einladung zum Geburtstag, bucket: unproblematisch }
        - { label: Echter Politiker in Fake-Szene, bucket: heikel }
        - { label: Fremdes Firmenlogo kopieren, bucket: heikel }
    hints:
      - Wird jemand getäuscht oder in seinen Rechten verletzt?
    explanation: Echte Personen und fremde Marken sind die heikelsten Fälle.

  - kind: problem
    id: kennzeichnen
    widget: choice
    prompt: Warum verlangen viele Plattformen, KI-Bilder zu kennzeichnen?
    params:
      options:
        - { label: "Damit Betrachter wissen, was echt ist.", correct: true }
        - { label: Weil KI-Bilder hässlicher sind., feedback: "Es geht um Transparenz, nicht um Qualität." }
    hints:
      - Was passiert, wenn niemand mehr weiß, was echt ist?
    explanation: Kennzeichnung schützt das Vertrauen in Bilder überhaupt.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Was gelingt Bildmodellen meist – und wo hakt es oft?
    params:
      buckets:
        - id: b1
          label: Gelingt meist
        - id: b2
          label: Hakt oft
      items:
        - label: Stimmung und Stil
          bucket: b1
        - label: Längerer Text im Bild
          bucket: b2
        - label: Landschaften
          bucket: b1
        - label: Genau sieben Äpfel
          bucket: b2
    hints:
      - Das Modell lernt Muster – es zählt und buchstabiert nicht.
    explanation: Was genaue Regeln braucht, fällt Mustererkennern schwer.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Generator gibt manchmal fast exakt ein Trainingsbild wieder. Wann passiert das am ehesten?
    params:
      options:
        - label: Wenn ein Bild sehr oft in den Trainingsdaten vorkam
          correct: true
        - label: Bei jedem Bild
          feedback: Die allermeisten Bilder sind neu zusammengesetzt.
        - label: Nie
          feedback: Es wurde nachgewiesen – selten, aber messbar.
    hints:
      - Was man tausendmal sieht, lernt man auswendig.
    explanation: Das ist **Memorisierung** – Überanpassung an einzelne Beispiele. Darum entfernt man Duplikate aus Trainingsdaten.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Ein Modell wird immer wieder nur mit Bildern trainiert, die ein früheres Modell erzeugt hat. Was beobachtet man?
    params:
      options:
        - label: Die Vielfalt schrumpft, seltene Dinge verschwinden – das Modell »verarmt«.
          correct: true
        - label: Es wird immer besser.
          feedback: Es lernt eigene Fehler mit und verliert die Ränder der echten Welt.
        - label: Es passiert nichts.
          feedback: Experimente zeigen deutliche Verluste über mehrere Runden.
    hints:
      - "Was erzeugt ein Modell häufiger: typische oder seltene Bilder?"
      - Was passiert über viele Runden mit dem Seltenen?
    explanation: Forscher nennen das **Modellkollaps**. Echte, vielfältige Daten bleiben darum wertvoll – auch wenn das Netz voller KI-Inhalte ist.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux in einfachen Worten, wie ein Bildgenerator aus einem Text ein Bild macht.
    params:
      keywords:
        - - rauschen
          - noise
          - zufall
          - random
        - - schritt
          - step
          - nach und nach
          - gradual
          - entfern
          - remov
        - - text
          - prompt
          - beschreib
          - descri
        - - lenk
          - steuer
          - richtung
          - guide
          - steer
          - direct
      min: 3
      sample: Er beginnt mit reinem Rauschen und entfernt es Schritt für Schritt. Der Text lenkt dabei jeden Schritt in eine Richtung, sodass aus dem Rauschen nach und nach ein passendes Bild entsteht.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Eine Künstlerin verlangt, dass ein fertiges Modell ihre Bilder »vergisst«. Wie einfach ist das?
    params:
      options:
        - label: Schwierig – ihr Einfluss steckt verteilt in Milliarden Gewichten. Zuverlässig hilft oft nur neues Training ohne sie.
          correct: true
        - label: "Ganz einfach: Man löscht die Bilder aus dem Modell."
          feedback: Das Modell enthält keine Bilddateien, die man löschen könnte.
        - label: Unnötig – Modelle lernen nichts von einzelnen Bildern.
          feedback: Besonders häufige oder markante Werke können sehr wohl Spuren hinterlassen.
    hints:
      - Wo »wohnt« das Gelernte in einem neuronalen Netz?
      - Lässt sich der Beitrag eines Bildes aus allen Gewichten herausrechnen?
    explanation: "**Maschinelles Verlernen** ist ein offenes Forschungsfeld. Darum sind Fragen zu Trainingsdaten schon vor dem Training wichtig: Herkunft, Erlaubnis und Möglichkeiten zum Widerspruch."
    difficulty: 3

srs:
  cards_from: [erkennen, einsatz]
