id: ai.generative.prompts
type: concept
title: Describing images
summary: What an image prompt controls.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: besser
    widget: choice
    prompt: Which prompt is more likely to give the image you want?
    params:
      options:
        - { label: "\"A red fox in the snow, morning light, watercolor\"", correct: true }
        - { label: '"Make something nice with animals"', feedback: "Without subject, style and light, the model has to guess everything." }
    hints:
      - What, where, which light, which style?
    explanation: Subject, setting, light and style give the noise a clear direction.

  - kind: explain
    id: s2
    body: |
      The **prompt** is translated into a vector that steers every denoising step. Terms that were common in the training images have a stronger effect than rare ones.

  - kind: problem
    id: wirkung
    widget: buckets
    prompt: Does it strongly influence the image?
    params:
      buckets: [{ label: strongly }, { label: barely }]
      items:
        - { label: The subject, bucket: strongly }
        - { label: The painting style, bucket: strongly }
        - { label: The lighting mood, bucket: strongly }
        - { label: '"Please" and "thank you"', bucket: barely }
    hints:
      - What can you see in an image?
    explanation: Politeness doesn't hurt – but only what can be shown becomes visible.

  - kind: problem
    id: haende
    widget: choice
    prompt: Why did image generators struggle with hands for so long?
    params:
      options:
        - { label: Hands look different in photos in a great many poses., correct: true }
        - { label: Hands are banned., feedback: "It comes down to the variety and the hidden fingers." }
    hints:
      - How often do you see all five fingers clearly in photos?
    explanation: Many poses, often hidden fingers – the pattern is hard to learn.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Precise or vague image prompt?
    params:
      buckets:
        - id: b1
          label: Precise
        - id: b2
          label: Vague
      items:
        - label: “Red fox in snow, evening light”
          bucket: b1
        - label: “A nice picture”
          bucket: b2
        - label: “Oil painting, wide angle, fog”
          bucket: b1
        - label: “Something with animals”
          bucket: b2
    hints:
      - Which of these can you picture at once?
    explanation: Subject, style and light give the model a clear direction.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[prompt]] steers every step. Common terms from training act [[more strongly]] than rare ones.
      distractors:
        - chance
        - more quietly

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A **negative prompt** names what should **not** be in the image. How does it work technically?
    params:
      options:
        - label: At every step the model is steered away from that description
          correct: true
        - label: The words are simply deleted
          feedback: They are actively used as the opposite direction.
        - label: The image is retouched afterwards
          feedback: It acts during generation.
    hints:
      - One text steers towards – another steers away.
    explanation: In vector space “towards” and “away from” are just two directions.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Same prompt, same seed, same settings. What comes out?
    params:
      options:
        - label: Practically the same image.
          correct: true
        - label: A different image every time.
          feedback: The randomness lives in the starting noise – which the seed fixes.
        - label: Nothing at all.
          feedback: The seed blocks nothing – it only makes the randomness repeatable.
    hints:
      - Where is the randomness in an image generator?
      - A seed always produces the same starting noise.
    explanation: With a fixed seed you can repeat an image and change only the prompt on purpose. Small differences due to hardware are possible.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: For “doctor” a generator draws almost only men and for “nurse” almost only women. Where does that come from?
    params:
      options:
        - label: From the training images – and the model often amplifies such skews further
          correct: true
        - label: The developers set it that way
          feedback: It arises from the data.
        - label: Chance
          feedback: It repeats with every attempt.
    hints:
      - The model reproduces what it has seen most often.
    explanation: "“Mostly” easily becomes “always”: models lean towards the most frequent case and thus amplify stereotypes."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: For a long time image generators could not paint correct lettering. What helped most?
    params:
      options:
        - label: Stronger text-understanding models and more training images with precisely described lettering.
          correct: true
        - label: A higher temperature.
          feedback: Image models have no temperature like language models – and more randomness does not help letters.
        - label: Smaller images.
          feedback: Smaller images make letters less legible, if anything.
    hints:
      - What must the model know to spell "OPEN" correctly?
      - It needs the letters in the text and matching image examples.
    explanation: "Lettering demands exact details: one wrong stroke makes a different letter. Better text encoders and more precise image descriptions in training have improved this a lot."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what makes a good image prompt.
    params:
      keywords:
        - - motiv
          - objekt
          - subject
          - object
        - - stil
          - licht
          - farbe
          - style
          - light
          - colour
          - color
        - - genau
          - konkret
          - detail
          - precise
          - concrete
          - specific
      sample: A good image prompt names the subject precisely, plus style, light and colours. The more concrete the description, the more likely you get the image you want.
    difficulty: 3

srs:
  cards_from: [besser, haende]
