id: ai.generative.multimodal
type: concept
title: Text, image and sound
summary: Models that connect several senses.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Three senses, one space
    body: Modern AI understands text, images and sounds at once. To do this, it puts everything into **one shared space**. Drag the dots so that what belongs together sits together.
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 9
        y:
          - 0
          - 6
        showCoordinates: false
        points:
          - id: fhund
            x: 1
            y: 5
            label: 📷 dog
          - id: twellen
            x: 4
            y: 5
            label: 🔊 waves
          - id: whund
            x: 7
            y: 5
            label: “dog”
          - id: wmeer
            x: 1
            y: 1
            label: “sea”
          - id: tbellen
            x: 4
            y: 1
            label: 🔊 bark
          - id: fstrand
            x: 7
            y: 1
            label: 📷 beach

  - kind: problem
    id: hook
    widget: choice
    prompt: You see a photo of a dog. Then you read the word “dog”. What happens in your head?
    params:
      options:
        - label: Both call up the same idea
          correct: true
        - label: Two completely different things
          feedback: You think of a dog both times.
        - label: Nothing
          feedback: You recognise both at once.
    hints:
      - What do you think of in both cases?
    explanation: Some AI models bring picture and word together in just this way.

  - kind: explain
    id: s1
    body: |
      **Multimodal** models translate text, images and sound into a **shared vector space**. A photo of a dog and the word "dog" land close together there.

  - kind: problem
    id: richtungen
    widget: match
    prompt: What does the model do?
    params:
      pairs:
        - { left: Text to image, right: Image generator }
        - { left: Image to text, right: Image captioning }
        - { left: Sound to text, right: Speech recognition }
        - { left: Text to sound, right: Speech synthesis }
    hints:
      - Input first, output after.
    explanation: With a shared space, you can train every direction.

  - kind: problem
    id: suche
    widget: choice
    prompt: How does a photo app find all pictures of the "beach" without you labeling them?
    params:
      options:
        - { label: Images and the word sit close together in the same vector space., correct: true }
        - { label: It reads the file names., feedback: "File names are usually just numbers." }
    hints:
      - Where do image and word meet?
    explanation: The app looks for the images whose vectors are most similar to the word's vector.

  - kind: problem
    id: video
    widget: numeric
    prompt: A video has 24 frames per second. How many frames does a {{s}}-second clip have?
    params: { unit: frames }
    answer: { value: "{{24 * s}}" }
    hints:
      - "24 · {{s}}."
    explanation: "{{24 * s}} frames – and all of them must fit together. That is why video is so hard."
    variants:
      params: { s: "int[3,20]" }
      defaults: { s: 10 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: How does a model such as CLIP learn to place images and texts in the same space?
    params:
      options:
        - label: "With millions of image–text pairs: matching pairs are pulled together, non-matching pushed apart"
          correct: true
        - label: Humans arrange every vector by hand
          feedback: That would be impossible for billions of pairs.
        - label: It first translates images into words
          feedback: It compares the vectors directly.
    hints:
      - The photo and its caption should land close together.
    explanation: "**Contrastive learning**. The captions of the internet are the free labelling."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: An image of 224 × 224 pixels is cut into tiles of 16 × 16 pixels. Each tile becomes a token. How many tokens is that?
    answer:
      value: 196
    feedback:
      - when: numval(state.input) == 14
        misconception: one-row
        text: That is one row. There are 14 rows of 14 tiles each.
    hints:
      - 224 / 16 = 14 tiles per row.
      - 14 · 14 = ?
    explanation: "14 · 14 = 196 tokens. That is how a vision transformer handles images: as a sequence of tiles, just like text as a sequence of word pieces."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: When training CLIP you compare {{n}} images with {{n}} texts – each with each. Only the true pairs should be similar. How many comparisons are **wrong** pairs?
    answer:
      value: "{{n * n - n}}"
    feedback:
      - when: numval(state.input) == n * n
        misconception: all
        text: That is all comparisons. The {{n}} true pairs do not count.
    hints:
      - "All comparisons: {{n}} · {{n}}."
      - "{{n}} of them are true pairs."
    explanation: "{{n * n}} − {{n}} = {{n * n - n}}. Training pulls the {{n}} true pairs together and pushes the others apart. This contrastive learning needs no further labels."
    difficulty: 2
    variants:
      params:
        n: int[3,12]
      defaults:
        n: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A video generator produces 5 seconds at 24 frames per second in 512 × 512 pixels and 3 colour values. How many million numbers is that? Rounded.
    answer:
      value: 94
      tolerance: 1
    hints:
      - 120 frames times 786,432 values.
    explanation: About 94 million – and all must fit together, or the video flickers.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: How can CLIP assign a photo to a class it was never trained on as a class?
    params:
      options:
        - label: You compare the image with texts such as "a photo of a dog" and pick the most similar one.
          correct: true
        - label: Not at all – it only knows fixed classes.
          feedback: CLIP has no fixed classes, only image and text vectors.
        - label: It looks it up on the internet.
          feedback: It works only with its learned vectors.
    hints:
      - Images and texts live in the same space.
      - Write a short text for each class.
    explanation: "This is called zero-shot classification: the classes are just texts. A new class costs only a new sentence – no new training."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a photo app finds pictures of "the beach" without anyone labelling them.
    params:
      keywords:
        - - vektor
          - zahlen
          - vector
          - number
        - - gemeinsam
          - gleich
          - raum
          - shared
          - same
          - space
        - - nah
          - ähnlich
          - close
          - similar
      sample: A model turns images and words into vectors in the same space. Beach photos lie close to the word "beach" there. The app looks for the images most similar to the word.
    difficulty: 3

srs:
  cards_from: [richtungen, suche]
