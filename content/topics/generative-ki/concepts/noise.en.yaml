id: ai.generative.noise
type: concept
title: From noise to image
summary: The basic idea of image generators.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: start
    widget: choice
    prompt: What does an image generator start with before it paints a picture?
    params:
      options:
        - { label: Pure random noise, correct: true }
        - { label: A matching photo from the internet, feedback: "It doesn't copy a photo – it shapes noise step by step." }
        - { label: A white canvas, feedback: "White would be too uniform – randomness provides the variety." }
    hints:
      - What does a TV look like without a signal?
    explanation: In many steps, the noise becomes an image.

  - kind: explain
    id: s2
    body: |
      **Diffusion models** learn the opposite of adding noise. You give them images with some noise and let them guess which noise must be removed. Millions of times.

  - kind: problem
    id: training
    widget: order
    prompt: Put one training step in the right order.
    params:
      items:
        - { label: Take a real image }
        - { label: Add random noise }
        - { label: The model guesses the noise }
        - { label: Learn from the error }
    hints:
      - The model has to guess what was added.
    explanation: If you can recognize noise, you can also remove it.

  - kind: problem
    id: dauer
    widget: numeric
    prompt: A generator needs {{n}} steps of 0.1 seconds each. How long does one image take?
    params: { unit: s }
    answer: { value: "{{n / 10}}" }
    hints:
      - "{{n}} · 0.1."
    explanation: "{{n / 10}} seconds – that is why researchers work on methods with fewer steps."
    variants:
      params: { n: "choice[20,30,50,100]" }
      defaults: { n: 50 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: An image generator starts from random noise.
          right: true
        - text: It assembles the image from stored photos.
          right: false
          why: It has stored no images – only learnt patterns in weights.
        - text: The same prompt can give very different images.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In training real images are noised step by step. What exactly should the model predict?
    params:
      options:
        - label: The noise that was added
          correct: true
        - label: The name of the image
          feedback: That would be image recognition.
        - label: The next image of a series
          feedback: It is about a single image.
    hints:
      - Whoever knows the noise can subtract it.
    explanation: The task is easy to set and needs no labelling – so billions of images can be used.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A noisy training image is a · image + b · noise with a² + b² = 1. At one step a = 0.8. What is b?
    answer:
      value: 0.6
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 0.2
        misconception: linear
        text: a and b do not add up to 1 – their **squares** do.
    hints:
      - b² = 1 − a² = 1 − 0.64.
      - √0.36 = ?
    explanation: b = 0.6. Over many steps a falls towards 0 and b rises towards 1 – in the end only pure noise is left. The square rule keeps the total signal strength constant.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Before diffusion models, GANs were common. How does a GAN learn?
    params:
      options:
        - label: One network fakes images, a second tries to spot the fakes – both get better.
          correct: true
        - label: It removes noise in many small steps.
          feedback: That is the idea of diffusion.
        - label: It copies images from a database.
          feedback: It creates new images – it does not store a library.
    hints:
      - GAN stands for "generative adversarial network" – adversarial means opposing.
      - Who are the two opponents?
    explanation: "Forger against checker: a GAN generates in a single step and is fast, but its training is often unstable. Diffusion is slower but better behaved and more versatile."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: New image AIs do not work on the pixels as such. They use a much smaller form of the image. Why?
    params:
      options:
        - label: That saves an enormous amount of computation – a second network translates back into pixels at the end
          correct: true
        - label: That makes the images sharper
          feedback: It is about efficiency.
        - label: Pixels cannot be noised
          feedback: They can – it is just expensive.
    hints:
      - A million pixels or a few thousand numbers – which is faster?
    explanation: "**Latent diffusion**: an autoencoder compresses the image about 50-fold. Only that made generators possible on ordinary computers."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: The model only predicts the noise in an image. Why is that enough to estimate a clean image?
    params:
      options:
        - label: If you know the mix and the noise, you can subtract the noise and solve back.
          correct: true
        - label: It is not enough – you need a second model.
          feedback: "One model suffices: image = (mix − b · noise) / a."
        - label: Because noise and image are the same.
          feedback: They differ – that is exactly why they can be separated.
    hints:
      - Mix = a · image + b · noise, with a and b known.
      - Solve for the image.
    explanation: Image ≈ (mix − b · estimated noise) / a. The estimate is rough at first, so you take only a small step towards it and then estimate again.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a diffusion model is trained.
    params:
      keywords:
        - - rausch
          - noise
        - - echt
          - foto
          - bild
          - real
          - photo
          - image
        - - vorhersag
          - rat
          - schätz
          - predict
          - guess
          - estimate
      sample: You take real images and add noise. The model must predict which noise was added. If it is off, its weights are corrected – millions of times.
    difficulty: 3

srs:
  cards_from: [start, training]
