id: ai.generative.multimodal
type: concept
title: Text, Bild und Ton
summary: Modelle, die mehrere Sinne verbinden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du siehst das Foto eines Hundes. Dann liest du das Wort »Hund«. Was passiert in deinem Kopf?
    params:
      options:
        - label: Beides weckt dieselbe Vorstellung
          correct: true
        - label: Zwei völlig verschiedene Dinge
          feedback: Du denkst beide Male an einen Hund.
        - label: Nichts
          feedback: Du erkennst beides sofort.
    hints:
      - Woran denkst du in beiden Fällen?
    explanation: Manche KI-Modelle bringen Bild und Wort genauso zusammen.

  - kind: explain
    id: s1
    body: |
      **Multimodale** Modelle übersetzen Text, Bilder und Ton in einen **gemeinsamen Vektorraum**. Ein Foto vom Hund und das Wort »Hund« landen dort nah beieinander.

  - kind: problem
    id: richtungen
    widget: match
    prompt: Was macht das Modell?
    params:
      pairs:
        - { left: Text zu Bild, right: Bildgenerator }
        - { left: Bild zu Text, right: Bildbeschreibung }
        - { left: Ton zu Text, right: Spracherkennung }
        - { left: Text zu Ton, right: Sprachausgabe }
    hints:
      - Eingabe zuerst, Ausgabe danach.
    explanation: Mit einem gemeinsamen Raum lässt sich jede Richtung trainieren.

  - kind: problem
    id: suche
    widget: choice
    prompt: Wie findet eine Foto-App alle Bilder vom »Strand«, ohne dass du sie beschriftet hast?
    params:
      options:
        - { label: Bilder und Wort liegen im gleichen Vektorraum nah beieinander., correct: true }
        - { label: Sie liest die Dateinamen., feedback: "Die Dateinamen sind meist nur Nummern." }
    hints:
      - Wo treffen sich Bild und Wort?
    explanation: Die App sucht die Bilder, deren Vektoren dem Wort-Vektor am ähnlichsten sind.

  - kind: problem
    id: video
    widget: numeric
    prompt: Ein Video hat 24 Bilder pro Sekunde. Wie viele Bilder hat ein {{s}}-Sekunden-Clip?
    params: { unit: Bilder }
    answer: { value: "{{24 * s}}" }
    hints:
      - "24 · {{s}}."
    explanation: "{{24 * s}} Bilder – und alle müssen zueinander passen. Darum ist Video so schwer."
    variants:
      params: { s: "int[3,20]" }
      defaults: { s: 10 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Wie lernt ein Modell wie CLIP, Bilder und Texte in denselben Raum zu legen?
    params:
      options:
        - label: "Mit Millionen Bild-Text-Paaren: Passende Paare werden zusammengezogen, unpassende auseinandergeschoben"
          correct: true
        - label: Menschen ordnen jeden Vektor von Hand
          feedback: Das wäre bei Milliarden Paaren unmöglich.
        - label: Es übersetzt Bilder zuerst in Wörter
          feedback: Es vergleicht direkt die Vektoren.
    hints:
      - Das Foto und seine Bildunterschrift sollen nah beieinander landen.
    explanation: "**Kontrastives Lernen**. Die Bildunterschriften des Internets sind die kostenlose Beschriftung."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Bild mit 224 × 224 Pixeln wird in Kacheln von 16 × 16 Pixeln zerlegt. Jede Kachel wird ein Token. Wie viele Tokens sind das?
    answer:
      value: 196
    feedback:
      - when: numval(state.input) == 14
        misconception: one-row
        text: Das ist eine Reihe. Es gibt 14 Reihen mit je 14 Kacheln.
    hints:
      - 224 / 16 = 14 Kacheln pro Reihe.
      - 14 · 14 = ?
    explanation: "14 · 14 = 196 Tokens. So verarbeitet ein **Vision Transformer** Bilder: als Folge von Kacheln, genau wie Text als Folge von Wortstücken."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Beim Training von CLIP vergleicht man {{n}} Bilder mit {{n}} Texten – jedes mit jedem. Nur die echten Paare sollen ähnlich sein. Wie viele Vergleiche sind **falsche** Paare?
    answer:
      value: "{{n * n - n}}"
    feedback:
      - when: numval(state.input) == n * n
        misconception: all
        text: Das sind alle Vergleiche. Die {{n}} echten Paare gehören nicht dazu.
    hints:
      - "Alle Vergleiche: {{n}} · {{n}}."
      - Davon sind {{n}} echte Paare.
    explanation: "{{n * n}} − {{n}} = {{n * n - n}}. Das Training zieht die {{n}} echten Paare zusammen und drückt die anderen auseinander. Dieses **kontrastive Lernen** braucht keine weiteren Beschriftungen."
    difficulty: 2
    variants:
      params:
        n: int[3,12]
      defaults:
        n: 4

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Videogenerator erzeugt 5 Sekunden mit 24 Bildern pro Sekunde in 512 × 512 Pixeln und 3 Farbwerten. Wie viele Millionen Zahlen sind das? Gerundet.
    answer:
      value: 94
      tolerance: 1
    hints:
      - 120 Bilder mal 786 432 Werte.
    explanation: Rund 94 Millionen – und alle müssen zueinander passen, sonst flackert das Video.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Wie kann CLIP ein Foto einer Klasse zuordnen, die es nie als Klasse trainiert hat?
    params:
      options:
        - label: Man vergleicht das Bild mit Texten wie »ein Foto von einem Hund« und wählt den ähnlichsten.
          correct: true
        - label: Gar nicht – es kennt nur feste Klassen.
          feedback: CLIP hat keine festen Klassen, nur Bild- und Textvektoren.
        - label: Es fragt im Internet nach.
          feedback: Es arbeitet nur mit seinen gelernten Vektoren.
    hints:
      - Bild und Text liegen im selben Raum.
      - Schreibe für jede Klasse einen kurzen Text.
    explanation: "Das heißt **Zero-Shot-Klassifikation**: Die Klassen sind einfach Texte. Neue Klassen kosten nur einen neuen Satz – kein neues Training."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Foto-App Bilder vom »Strand« findet, ohne dass sie jemand beschriftet hat.
    params:
      keywords:
        - - vektor
          - zahlen
          - vector
          - number
        - - gemeinsam
          - gleich
          - raum
          - shared
          - same
          - space
        - - nah
          - ähnlich
          - close
          - similar
      sample: Ein Modell übersetzt Bilder und Wörter in Vektoren im gleichen Raum. Strandfotos liegen dort nah beim Wort »Strand«. Die App sucht die Bilder, die dem Wort am ähnlichsten sind.
    difficulty: 3

srs:
  cards_from: [richtungen, suche]
