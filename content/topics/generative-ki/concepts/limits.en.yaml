id: ai.generative.limits
type: concept
title: Limits and rights
summary: Copyright, labeling, misuse.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: erkennen
    widget: choice
    prompt: Can you reliably tell AI images from real photos?
    params:
      options:
        - { label: Not reliably – proof of origin helps more., correct: true }
        - { label: "Yes, by the wrong fingers", feedback: "Such errors get rarer with every model generation." }
    hints:
      - Are the models getting better or worse?
    explanation: Digital provenance signatures and watermarks are more reliable than detectives.

  - kind: explain
    id: s2
    body: |
      Generative models learn from billions of other people's images and texts. Courts are now deciding whether and how copyright applies. One thing is clear: what you create must not deceive or harm others.

  - kind: problem
    id: einsatz
    widget: buckets
    prompt: Harmless or risky?
    params:
      buckets: [{ label: harmless }, { label: risky }]
      items:
        - { label: Mood board for your home, bucket: harmless }
        - { label: Birthday invitation, bucket: harmless }
        - { label: Real politician in a fake scene, bucket: risky }
        - { label: Copying another company's logo, bucket: risky }
    hints:
      - Is anyone deceived, or are their rights violated?
    explanation: Real people and other people's brands are the riskiest cases.

  - kind: problem
    id: kennzeichnen
    widget: choice
    prompt: Why do many platforms require AI images to be labeled?
    params:
      options:
        - { label: "So viewers know what is real.", correct: true }
        - { label: Because AI images are uglier., feedback: "It is about transparency, not quality." }
    hints:
      - What happens when nobody knows what is real anymore?
    explanation: Labeling protects trust in images at all.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: An image AI can at times copy a picture it was trained on. When is that most likely?
    params:
      options:
        - label: When an image occurred very often in the training data
          correct: true
        - label: With every image
          feedback: The vast majority of images are newly composed.
        - label: Never
          feedback: It has been demonstrated – rare but measurable.
    hints:
      - What you see a thousand times you learn by heart.
    explanation: This is **memorisation** – overfitting to single examples. That is why duplicates are removed from training data.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux in simple words how an image generator turns a text into an image.
    params:
      keywords:
        - - rauschen
          - noise
          - zufall
          - random
        - - schritt
          - step
          - nach und nach
          - gradual
          - entfern
          - remov
        - - text
          - prompt
          - beschreib
          - descri
        - - lenk
          - steuer
          - richtung
          - guide
          - steer
          - direct
      min: 3
      sample: It starts with pure noise and removes it step by step. The text steers each step in a direction, so that a matching image gradually emerges from the noise.
    difficulty: 3

srs:
  cards_from: [erkennen, einsatz]
