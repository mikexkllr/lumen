id: math.trig.unitcircle
type: concept
title: Der Einheitskreis
summary: Sinus ist Höhe, Kosinus ist Breite.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: explain
    body: |
      Dreh den Punkt auf dem Kreis mit Radius 1. Die **Breite** heißt Kosinus, die **Höhe** heißt Sinus.
      Probier verschiedene Winkel aus.
    visual: { widget: angle, interactive: true, params: { initial: 30, trig: true } }

  - kind: problem
    id: hoechster
    widget: angle
    prompt: Bei welchem Winkel ist der Sinus am größten? Stelle ihn ein.
    params: { initial: 20, trig: true }
    answer: { value: 90 }
    hints:
      - Wann ist der Punkt ganz oben?
    explanation: Bei 90° liegt der Punkt ganz oben – sin 90° = 1.

  - kind: problem
    id: cos-halb
    widget: angle
    prompt: Stelle einen Winkel unter 90° ein, bei dem der Kosinus genau 0,5 ist.
    params: { initial: 10, trig: true, max: 90 }
    check: { predicate: "abs(cos - 0.5) < 0.01" }
    hints:
      - Die Breite soll genau halb so groß sein wie der Radius.
    explanation: Bei 60° ist cos = 0,5. Der Punkt liegt genau über der Mitte des Radius.

  - kind: problem
    id: sin-dreissig
    widget: numeric
    prompt: Wie groß ist sin 30°? Probier es am Kreis, wenn du magst.
    params: { placeholder: "Dezimalzahl" }
    answer: { value: 0.5, tolerance: 0.01 }
    hints:
      - Bei 30° ist die Höhe halb so groß wie bei 90°.
    explanation: sin 30° = 0,5.

  - kind: explain
    body: Warum gilt immer sin² + cos² = 1?
    reveal:
      body: Breite und Höhe bilden mit dem Radius ein rechtwinkliges Dreieck. Nach Pythagoras ist Breite² + Höhe² = 1² – egal bei welchem Winkel.

  - kind: problem
    id: negativ
    widget: choice
    prompt: In welchem Bereich ist der Kosinus negativ?
    params:
      options:
        - { label: Zwischen 90° und 270°, correct: true }
        - { label: Zwischen 0° und 180°, feedback: "Dort ist der Sinus positiv. Der Kosinus wird ab 90° negativ." }
        - { label: Nie, feedback: "Dreh über 90° hinaus – der Punkt geht nach links." }
    hints:
      - Wann liegt der Punkt links von der Mitte?
    explanation: Links von der Mitte ist die Breite negativ – von 90° bis 270°.

srs:
  cards_from: [sin-dreissig, negativ]
