id: math.trig.unitcircle
type: concept
title: Der Einheitskreis
summary: Sinus ist Höhe, Kosinus ist Breite.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Kreis rechnet mit
    body: Sinus und Kosinus klingen nach Schule – doch sie stecken in Spielen, Musik und Seefahrt. Deck die Karten auf. Danach drehst du selbst am **Einheitskreis**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎮
            front: Drehen im Spiel
            back: Jede Drehung einer Spielfigur rechnet mit Sinus und Kosinus – viele Male pro Sekunde.
          - icon: 🔊
            front: Ein reiner Ton
            back: Eine Stimmgabel schwingt genau wie eine Sinuskurve hin und her.
          - icon: ⛵
            front: Seefahrt
            back: Seeleute rechneten mit Sinustafeln aus, wie weit sie nach Norden und Osten gesegelt waren.
          - icon: ☀️
            front: Solardach
            back: Wie viel Licht ein Solardach einfängt, hängt vom Kosinus des Sonnenwinkels ab.

  - kind: explain
    id: s1
    body: |
      Dreh den Punkt auf dem Kreis mit Radius 1. Die **Breite** heißt Kosinus, die **Höhe** heißt Sinus.
      Probier verschiedene Winkel aus.
    visual: { widget: angle, interactive: true, params: { initial: 30, trig: true } }

  - kind: problem
    id: hoechster
    widget: angle
    prompt: Bei welchem Winkel ist der Sinus am größten? Stelle ihn ein.
    params: { initial: 20, trig: true }
    answer: { value: 90 }
    hints:
      - Wann ist der Punkt ganz oben?
    explanation: Bei 90° liegt der Punkt ganz oben – sin 90° = 1.

  - kind: problem
    id: cos-halb
    widget: angle
    prompt: Stelle einen Winkel unter 90° ein, bei dem der Kosinus genau 0,5 ist.
    params: { initial: 10, trig: true, max: 90 }
    check: { predicate: "abs(cos - 0.5) < 0.01" }
    hints:
      - Die Breite soll genau halb so groß sein wie der Radius.
    explanation: Bei 60° ist cos = 0,5. Der Punkt liegt genau über der Mitte des Radius.

  - kind: problem
    id: sin-dreissig
    widget: numeric
    prompt: Wie groß ist sin 30°? Probier es am Kreis, wenn du magst.
    params: { placeholder: "Dezimalzahl" }
    answer: { value: 0.5, tolerance: 0.01 }
    hints:
      - Bei 30° ist die Höhe halb so groß wie bei 90°.
    explanation: sin 30° = 0,5.

  - kind: explain
    id: s5
    body: Warum gilt immer sin² + cos² = 1?
    reveal:
      body: Breite und Höhe bilden mit dem Radius ein rechtwinkliges Dreieck. Nach Pythagoras ist Breite² + Höhe² = 1² – egal bei welchem Winkel.

  - kind: problem
    id: negativ
    widget: choice
    prompt: In welchem Bereich ist der Kosinus negativ?
    params:
      options:
        - { label: Zwischen 90° und 270°, correct: true }
        - { label: Zwischen 0° und 180°, feedback: "Dort ist der Sinus positiv. Der Kosinus wird ab 90° negativ." }
        - { label: Nie, feedback: "Dreh über 90° hinaus – der Punkt geht nach links." }
    hints:
      - Wann liegt der Punkt links von der Mitte?
    explanation: Links von der Mitte ist die Breite negativ – von 90° bis 270°.

  - kind: problem
    id: c1
    widget: sim
    prompt: Dreh den Punkt, bis Sinus und Kosinus **gleich groß** und beide positiv sind.
    params:
      scene: unitcircle
    answer:
      angle: 45
    explanation: "Bei 45° sind Breite und Höhe gleich: je etwa 0,71."

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Finde einen Winkel, bei dem der Sinus −1 ist.
    params:
      scene: unitcircle
    answer:
      angle: 270
    explanation: "Bei 270° steht der Punkt ganz unten: Höhe −1, Breite 0."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: sin 150° ist genauso groß wie der Sinus welches Winkels zwischen 0° und 90°?
    params:
      unit: °
    answer:
      value: 30
    hints:
      - Spiegle den Punkt an der senkrechten Achse.
    explanation: sin(180° − α) = sin α. Die Höhe bleibt beim Spiegeln gleich.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Der Kreis ist voller **Symmetrie**: Spiegeln an der y-Achse zeigt $\\sin(180° - \\alpha) = \\sin\\alpha$. Spiegeln an der x-Achse zeigt $\\cos(-\\alpha) = \\cos\\alpha$. Und nach 360° wiederholt sich alles."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: Dreh den Punkt in das zweite Viertel, bis der Kosinus genau −0,5 ist.
    params:
      scene: unitcircle
    answer:
      cos: -0.5
      angle:
        - 90
        - 180
    explanation: "Bei 120°: Das ist 60° gespiegelt an der y-Achse. cos 60° = 0,5, also cos 120° = −0,5."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Wie groß ist sin 210°?
    answer:
      value: -0.5
    feedback:
      - when: numval(state.input) == 0.5
        misconception: sign-quadrant
        text: Bei 210° liegt der Punkt unter der x-Achse. Der Sinus ist negativ.
    hints:
      - 210° = 180° + 30°.
      - Gleiche Höhe wie bei 30°, aber unten.
    explanation: sin 210° = −sin 30° = −0,5.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie groß ist $\cos 60° \cdot \sin 30° + \sin 60° \cdot \cos 30°$?
    answer:
      value: 1
    hints:
      - Das ist das Additionstheorem für sin(30° + 60°).
    explanation: "sin 90° = 1. Probe: 0,5 · 0,5 + 0,866 · 0,866 = 0,25 + 0,75."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Das **Additionstheorem** $\\sin(\\alpha + \\beta) = \\sin\\alpha\\cos\\beta + \\cos\\alpha\\sin\\beta$ kommt aus dem Drehen: Zwei Drehungen nacheinander sind eine Drehung um α + β. Multipliziert man ihre Drehmatrizen, steht es da."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Berechne sin 75° = sin(45° + 30°) mit dem Additionstheorem. Auf drei Stellen.
    answer:
      value: 0.966
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 1.207) < 0.002
        misconception: additive-sine
        text: sin 45° + sin 30° ist nicht sin 75°. Sinus ist nicht additiv.
    hints:
      - sin 45° = cos 45° ≈ 0,7071, sin 30° = 0,5, cos 30° ≈ 0,8660.
      - 0,7071 · 0,8660 + 0,7071 · 0,5.
    explanation: "0,6124 + 0,3536 = 0,9659. Genau: $\\frac{\\sqrt6 + \\sqrt2}{4}$."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Es ist sin α = 0,6 und cos α = 0,8. Wie groß ist sin 2α? Setz β = α ins Additionstheorem.
    answer:
      value: 0.96
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 1.2
        misconception: linear-sine
        text: Doppelter Winkel heißt nicht doppelter Sinus.
    hints:
      - sin 2α = 2 · sin α · cos α.
      - 2 · 0,6 · 0,8.
    explanation: 2 · 0,6 · 0,8 = 0,96. Das ist das Doppelwinkel-Gesetz – und der Grund für sin 2α in der Wurfweite.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum gilt für jeden Winkel sin² + cos² = 1?"
    params:
      keywords:
        - - pythagoras
          - rechtwinklig
          - right triangle
          - right-angled
        - - radius
          - eins
          - one
          - hypotenuse
        - - breite
          - höhe
          - width
          - height
          - kosinus
          - sinus
          - cosine
          - sine
      sample: Der Punkt auf dem Einheitskreis hat die Breite cos und die Höhe sin. Mit dem Radius 1 bilden sie ein rechtwinkliges Dreieck. Nach Pythagoras ist Breite² + Höhe² = Radius² = 1.
    explanation: Die Gleichung ist Pythagoras im Einheitskreis. Sie gilt auch in den anderen Vierteln, weil Quadrate die Vorzeichen verschlucken.
    difficulty: 3

srs:
  cards_from: [sin-dreissig, negativ]
