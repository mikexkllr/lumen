id: math.trig.triangle
type: concept
title: Höhen und Steigungen berechnen
summary: Sinus, Kosinus und Tangens im Dreieck.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Zwei Rampen sind beide 10 m lang. Eine ist steil, die andere flach. Welche bringt dich höher?
    params:
      options:
        - label: Die steile
          correct: true
        - label: Die flache
          feedback: Sie steigt weniger an.
        - label: Beide gleich hoch
          feedback: Der Winkel macht den Unterschied.
    hints:
      - Der Winkel entscheidet.
    explanation: Wie hoch genau, rechnet man aus dem Winkel aus.

  - kind: explain
    id: s1
    body: |
      Die längste Seite im Dreieck mit rechtem Winkel ist die **Hypotenuse**. Am Winkel α liegt die **Ankathete**, ihm gegenüber die **Gegenkathete**.
      Dann gilt: sin = Gegen : Hyp. cos = An : Hyp. tan = Gegen : An.

  - kind: problem
    id: leiter
    widget: numeric
    prompt: Eine 4 m lange Leiter lehnt im Winkel von 30° zum Boden an der Wand. Wie hoch reicht sie? sin 30° = 0,5.
    params: { unit: m }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 8"
        misconception: divide-by-sin
        text: Höhe = Länge · sin α. Nicht durch den Sinus teilen.
    hints:
      - Die Leiter ist die Hypotenuse, die Höhe die Gegenkathete.
    explanation: 4 m · 0,5 = 2 m.

  - kind: problem
    id: rampe
    widget: numeric
    prompt: Eine Rampe ist {{l}} m lang und steigt im Winkel α mit sin α = {{s}}. Wie hoch ist sie?
    params: { unit: m }
    answer: { value: "{{l * s}}", tolerance: 0.01 }
    hints:
      - Höhe = Länge · sin α.
    explanation: "{{l}} · {{s}} = {{l * s}} m."
    variants:
      params: { l: "choice[5,8,10,12]", s: "choice[0.1,0.2,0.25,0.5]" }
      defaults: { l: 10, s: 0.2 }

  - kind: problem
    id: steigung
    widget: choice
    prompt: Eine Straße hat 100 % Steigung. Welchem Winkel entspricht das?
    params:
      options:
        - { label: "45°", correct: true }
        - { label: "90°", feedback: "90° wäre eine senkrechte Wand. 100 % heißt – so hoch wie weit." }
        - { label: "100°", feedback: "Prozent sind keine Grad." }
    hints:
      - 100 % Steigung – auf 1 m nach vorn kommt 1 m nach oben.
    explanation: Gleich viel hoch wie weit ergibt tan α = 1 – also 45°.

  - kind: problem
    id: steil
    widget: angle
    prompt: Steilste Straßen der Welt haben etwa 35 % Steigung. Stelle ungefähr ihren Winkel ein.
    params: { initial: 45, max: 90, showValue: false }
    answer: { value: 20, tolerance: 5 }
    hints:
      - 100 % sind 45°. 35 % ist deutlich flacher – etwas unter der Hälfte davon.
    explanation: 35 % Steigung sind etwa 19°. Es fühlt sich viel steiler an.

  - kind: problem
    id: c1
    widget: match
    prompt: Welches Verhältnis ist das?
    params:
      pairs:
        - left: "Gegenkathete : Hypotenuse"
          right: Sinus
        - left: "Ankathete : Hypotenuse"
          right: Kosinus
        - left: "Gegenkathete : Ankathete"
          right: Tangens
    hints:
      - Die Hypotenuse steht bei Sinus und Kosinus unten.
    explanation: Die drei Verhältnisse hängen nur vom Winkel ab, nicht von der Größe des Dreiecks.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Bei welchem Winkel im ersten Viertel ist die Breite – der Kosinus – genau 0,5?
    params:
      scene: unitcircle
    answer:
      cos: 0.5
      angle:
        - 0
        - 90
    explanation: Bei 60°. Sinus von 30° und Kosinus von 60° sind gleich.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Flugzeug steigt im Winkel von 30°. Wie viele Meter Höhe gewinnt es auf 2000 m Flugstrecke?
    params:
      unit: m
    answer:
      value: 1000
    hints:
      - Höhe = Strecke · sin 30°.
    explanation: 2000 · 0,5 = 1000 m.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "In jedem Dreieck gilt der **Sinussatz**: $\\frac{a}{\\sin\\alpha} = \\frac{b}{\\sin\\beta} = \\frac{c}{\\sin\\gamma}$. Große Seiten liegen großen Winkeln gegenüber. Damit rechnet man auch in Dreiecken ohne rechten Winkel."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: In einem Dreieck ist a = 10 cm, α = 30° und β = 45°. Wie lang ist b? Auf zwei Stellen. (sin 45° ≈ 0,7071)
    params:
      unit: cm
    answer:
      value: 14.14
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 7.07) < 0.01
        misconception: swapped-ratio
        text: Du hast durch sin 45° statt durch sin 30° geteilt.
    hints:
      - "b = a · sin β : sin α."
      - "10 · 0,7071 : 0,5."
    explanation: "b = 10 · 0,7071 : 0,5 ≈ 14,14 cm. Der größere Winkel β liegt der längeren Seite gegenüber."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Ein Dreieck hat die Seiten 3, 5 und 7. Wie groß ist der Winkel gegenüber der Seite 7, in Grad?
    params:
      unit: °
    answer:
      value: 120
    feedback:
      - when: numval(state.input) == 60
        misconception: sign-cos
        text: cos γ ist negativ, also ist γ stumpf.
    hints:
      - "Kosinussatz umgestellt: cos γ = (a² + b² − c²) : (2ab)."
      - "(9 + 25 − 49) : 30 = −0,5."
    explanation: cos γ = −0,5, also γ = 120°. Ein stumpfer Winkel – 7² ist größer als 3² + 5².
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In einem Dreieck sind zwei Seiten 5 und 8 lang und schließen 60° ein. Wie lang ist die dritte Seite? (cos 60° = 0,5)
    answer:
      value: 7
    hints:
      - "Kosinussatz: c² = a² + b² − 2ab · cos γ."
    explanation: 25 + 64 − 40 = 49, also c = 7. Der Kosinussatz ist Pythagoras für beliebige Dreiecke.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Der **Kosinussatz** $c^2 = a^2 + b^2 - 2ab\\cos\\gamma$ ist Pythagoras mit Korrektur. Beweis mit Vektoren: $|\\vec a - \\vec b|^2 = |\\vec a|^2 + |\\vec b|^2 - 2\\,\\vec a \\cdot \\vec b$. Bei γ = 90° ist das Skalarprodukt null."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Zwei Seiten eines Dreiecks sind {{a}} cm und {{b}} cm lang und schließen 30° ein. Wie groß ist die Fläche $\frac12 ab \sin\gamma$ in cm²?
    params:
      unit: cm²
    answer:
      value: "{{a * b / 4}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == a * b / 2
        misconception: right-angle
        text: Das wäre bei 90°. Bei 30° ist die Höhe nur halb so groß.
    hints:
      - "Die Höhe auf a ist b · sin 30° = b : 2."
      - ½ · {{a}} · {{b}} · 0,5.
    explanation: ½ · {{a}} · {{b}} · ½ = {{a * b / 4}} cm².
    difficulty: 3
    variants:
      params:
        a: int[3,12]
        b: step[4,16,2]
      defaults:
        a: 6
        b: 8

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum steckt Pythagoras im Kosinussatz?"
    params:
      keywords:
        - - "90"
          - rechter winkel
          - right angle
        - - "null"
          - zero
          - cos 90
        - - korrektur
          - abzug
          - minus
          - correction
          - subtract
      sample: Der Kosinussatz lautet c² = a² + b² − 2ab cos γ. Bei einem rechten Winkel von 90° ist cos γ null, und der Abzug verschwindet. Dann bleibt genau Pythagoras.
    explanation: "Der Zusatzterm misst, wie weit γ von 90° abweicht: spitz macht c kürzer, stumpf länger."
    difficulty: 3

srs:
  cards_from: [leiter, steigung]
