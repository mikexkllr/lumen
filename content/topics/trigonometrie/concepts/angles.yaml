id: math.trig.angles
type: concept
title: Winkel mit Gefühl
summary: Schätzen, einstellen, messen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: rechter
    widget: angle
    prompt: Stelle einen rechten Winkel ein.
    params: { initial: 20 }
    answer: { value: 90 }
    hints:
      - Ein rechter Winkel ist eine Vierteldrehung.
    explanation: 90° – eine Vierteldrehung, wie eine Zimmerecke.

  - kind: problem
    id: einstellen
    widget: angle
    prompt: Stelle {{w}}° ein.
    params: { initial: 10 }
    answer: { value: "{{w}}" }
    hints:
      - 90° ist eine Vierteldrehung, 180° eine halbe.
    explanation: "{{w}}° – genau eingestellt."
    variants:
      params: { w: "choice[45,135,210,300]" }
      defaults: { w: 135 }

  - kind: explain
    body: Winkel misst man in **Grad**. Eine volle Drehung hat 360°, eine halbe 180°, eine viertel 90°.

  - kind: problem
    id: schaetzen
    widget: angle
    prompt: Ohne Skala – stelle ungefähr 60° ein.
    params: { initial: 5, showValue: false }
    answer: { value: 60, tolerance: 10 }
    hints:
      - 60° ist zwei Drittel eines rechten Winkels.
    explanation: Ein Drittel einer halben Drehung. Bis 10° daneben zählt als gut geschätzt.

  - kind: problem
    id: uhr
    widget: numeric
    prompt: Welchen Winkel bilden die Zeiger einer Uhr um 4 Uhr?
    params: { unit: "°" }
    answer: { value: 120 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: hours-not-degrees
        text: Gesucht sind Grad. Eine Stunde auf dem Zifferblatt sind 30°.
    hints:
      - 12 Stunden sind 360°. Wie viel ist eine Stunde?
    explanation: 4 · 30° = 120°.

srs:
  cards_from: [einstellen, uhr]
