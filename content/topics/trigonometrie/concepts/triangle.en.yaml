id: math.trig.triangle
type: concept
title: Calculating Heights and Slopes
summary: Sine, cosine, and tangent in a triangle.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Two ramps are both 10 m long. One is steep, the other flat. Which takes you higher?
    params:
      options:
        - label: The steep one
          correct: true
        - label: The flat one
          feedback: It rises less.
        - label: Both equally high
          feedback: The angle makes the difference.
    hints:
      - The angle decides.
    explanation: How high exactly is calculated from the angle.

  - kind: explain
    id: s1
    body: |
      The longest side of a right triangle is the **hypotenuse**. At the angle α, the **adjacent** side touches it, and the **opposite** side lies across from it.
      Then: sin = opp ÷ hyp. cos = adj ÷ hyp. tan = opp ÷ adj.

  - kind: problem
    id: leiter
    widget: numeric
    prompt: A 4 m long ladder leans against a wall at an angle of 30° to the ground. How high does it reach? sin 30° = 0.5.
    params: { unit: m }
    answer: { value: 2 }
    feedback:
      - when: "numval(state.input) == 8"
        misconception: divide-by-sin
        text: Height = length · sin α. Don't divide by the sine.
    hints:
      - The ladder is the hypotenuse, and the height is the opposite side.
    explanation: 4 m · 0.5 = 2 m.

  - kind: problem
    id: rampe
    widget: numeric
    prompt: A ramp is {{l}} m long and rises at an angle α with sin α = {{s}}. How high is it?
    params: { unit: m }
    answer: { value: "{{l * s}}", tolerance: 0.01 }
    hints:
      - Height = length · sin α.
    explanation: "{{l}} · {{s}} = {{l * s}} m."
    variants:
      params: { l: "choice[5,8,10,12]", s: "choice[0.1,0.2,0.25,0.5]" }
      defaults: { l: 10, s: 0.2 }

  - kind: problem
    id: steigung
    widget: choice
    prompt: A road has a 100 % grade. What angle is that?
    params:
      options:
        - { label: "45°", correct: true }
        - { label: "90°", feedback: "90° would be a vertical wall. 100 % means as high as it is long horizontally." }
        - { label: "100°", feedback: "Percent is not degrees." }
    hints:
      - 100 % grade means 1 m up for every 1 m forward.
    explanation: Rising as much as it runs gives tan α = 1, so 45°.

  - kind: problem
    id: steil
    widget: angle
    prompt: The steepest streets in the world have about a 35 % grade. Set roughly their angle.
    params: { initial: 45, max: 90, showValue: false }
    answer: { value: 20, tolerance: 5 }
    hints:
      - 100 % is 45°. 35 % is much flatter, a bit under half of that.
    explanation: A 35 % grade is about 19°. It feels much steeper.

  - kind: problem
    id: c1
    widget: match
    prompt: Which ratio is this?
    params:
      pairs:
        - left: "opposite : hypotenuse"
          right: sine
        - left: "adjacent : hypotenuse"
          right: cosine
        - left: "opposite : adjacent"
          right: tangent
    hints:
      - The hypotenuse is at the bottom for sine and cosine.
    explanation: The three ratios depend only on the angle, not on the size of the triangle.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: At which angle in the first quarter is the width – the cosine – exactly 0.5?
    params:
      scene: unitcircle
    answer:
      cos: 0.5
      angle:
        - 0
        - 90
    explanation: At 60°. The sine of 30° and the cosine of 60° are equal.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A plane climbs at an angle of 30°. How many metres of height does it gain over 2000 m of flight path?
    params:
      unit: m
    answer:
      value: 1000
    hints:
      - Height = path · sin 30°.
    explanation: 2000 · 0.5 = 1000 m.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "In every triangle the **law of sines** holds: $\\frac{a}{\\sin\\alpha} = \\frac{b}{\\sin\\beta} = \\frac{c}{\\sin\\gamma}$. Big sides face big angles. This also works in triangles without a right angle."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: In a triangle a = 10 cm, α = 30° and β = 45°. How long is b? To two decimals. (sin 45° ≈ 0.7071)
    params:
      unit: cm
    answer:
      value: 14.14
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 7.07) < 0.01
        misconception: swapped-ratio
        text: You divided by sin 45° instead of sin 30°.
    hints:
      - b = a · sin β / sin α.
      - 10 · 0.7071 / 0.5.
    explanation: b = 10 · 0.7071 / 0.5 ≈ 14.14 cm. The bigger angle β faces the longer side.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: A triangle has sides 3, 5 and 7. How large is the angle opposite the side 7, in degrees?
    params:
      unit: °
    answer:
      value: 120
    feedback:
      - when: numval(state.input) == 60
        misconception: sign-cos
        text: cos γ is negative, so γ is obtuse.
    hints:
      - "Law of cosines rearranged: cos γ = (a² + b² − c²) / (2ab)."
      - (9 + 25 − 49) / 30 = −0.5.
    explanation: cos γ = −0.5, so γ = 120°. An obtuse angle – 7² is bigger than 3² + 5².
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: In a triangle two sides are 5 and 8 long and enclose 60°. How long is the third side? (cos 60° = 0.5)
    answer:
      value: 7
    hints:
      - "Law of cosines: c² = a² + b² − 2ab · cos γ."
    explanation: 25 + 64 − 40 = 49, so c = 7. The law of cosines is Pythagoras for arbitrary triangles.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "The **law of cosines** $c^2 = a^2 + b^2 - 2ab\\cos\\gamma$ is Pythagoras with a correction. Proof with vectors: $|\\vec a - \\vec b|^2 = |\\vec a|^2 + |\\vec b|^2 - 2\\,\\vec a \\cdot \\vec b$. At γ = 90° the dot product is zero."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Two sides of a triangle are {{a}} cm and {{b}} cm long and enclose 30°. What is the area $\frac12 ab \sin\gamma$ in cm²?
    params:
      unit: cm²
    answer:
      value: "{{a * b / 4}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == a * b / 2
        misconception: right-angle
        text: That would be at 90°. At 30° the height is only half as big.
    hints:
      - The height on a is b · sin 30° = b / 2.
      - ½ · {{a}} · {{b}} · 0.5.
    explanation: ½ · {{a}} · {{b}} · ½ = {{a * b / 4}} cm².
    difficulty: 3
    variants:
      params:
        a: int[3,12]
        b: step[4,16,2]
      defaults:
        a: 6
        b: 8

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is the law of cosines a generalisation of Pythagoras?"
    params:
      keywords:
        - - "90"
          - rechter winkel
          - right angle
        - - "null"
          - zero
          - cos 90
        - - korrektur
          - abzug
          - minus
          - correction
          - subtract
      sample: The law of cosines says c² = a² + b² − 2ab cos γ. For a right angle of 90° cos γ is zero and the subtraction vanishes. Then exactly Pythagoras is left.
    explanation: "The extra term measures how far γ is from 90°: acute makes c shorter, obtuse longer."
    difficulty: 3

srs:
  cards_from: [leiter, steigung]
