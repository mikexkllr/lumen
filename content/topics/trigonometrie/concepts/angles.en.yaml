id: math.trig.angles
type: concept
title: A Feel for Angles
summary: Estimate, set, measure.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: rechter
    widget: angle
    prompt: Set a right angle.
    params: { initial: 20 }
    answer: { value: 90 }
    hints:
      - A right angle is a quarter turn.
    explanation: 90°, a quarter turn, like the corner of a room.

  - kind: problem
    id: einstellen
    widget: angle
    prompt: Set {{w}}°.
    params: { initial: 10 }
    answer: { value: "{{w}}" }
    hints:
      - 90° is a quarter turn, and 180° is a half turn.
    explanation: "{{w}}°, set exactly."
    variants:
      params: { w: "choice[45,135,210,300]" }
      defaults: { w: 135 }

  - kind: explain
    body: Angles are measured in **degrees**. A full turn is 360°, a half turn 180°, and a quarter turn 90°.

  - kind: problem
    id: schaetzen
    widget: angle
    prompt: Without a scale, set roughly 60°.
    params: { initial: 5, showValue: false }
    answer: { value: 60, tolerance: 10 }
    hints:
      - 60° is two thirds of a right angle.
    explanation: A third of a half turn. Within 10° counts as a good estimate.

  - kind: problem
    id: uhr
    widget: numeric
    prompt: What angle do the hands of a clock form at 4 o'clock?
    params: { unit: "°" }
    answer: { value: 120 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: hours-not-degrees
        text: The question asks for degrees. One hour on the clock face is 30°.
    hints:
      - 12 hours are 360°. How much is one hour?
    explanation: 4 · 30° = 120°.

srs:
  cards_from: [einstellen, uhr]
