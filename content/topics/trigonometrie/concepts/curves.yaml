id: math.trig.curves
type: concept
title: Die Sinuskurve
summary: Ein Kreis, abgerollt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wellen nach Maß
    body: "Töne, Wasserwellen und Wechselstrom haben dieselbe Form: die **Sinuswelle**. Zieh an den Reglern a und b. Welcher macht die Welle höher, welcher lässt sie schneller schwingen?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: a*sin(b*x)
        x:
          - 0
          - 12.5
        y:
          - -3
          - 3
        showCoordinates: false
        sliders:
          - id: a
            label: a
            min: 0.5
            max: 3
            step: 0.5
            initial: 1
          - id: b
            label: b
            min: 0.5
            max: 3
            step: 0.5
            initial: 1

  - kind: problem
    id: hook
    widget: choice
    prompt: Du sitzt in einem Riesenrad. Wie ändert sich deine Höhe mit der Zeit?
    params:
      options:
        - label: Sie schwingt gleichmäßig auf und ab
          correct: true
        - label: Sie steigt immer weiter
          feedback: Nach oben kommt wieder unten.
        - label: Sie bleibt gleich
          feedback: Du fährst im Kreis.
    hints:
      - Hoch, runter, hoch, runter …
    explanation: Zeichnet man die Höhe auf, entsteht eine berühmte Kurve.

  - kind: explain
    id: s1
    body: |
      Trägt man die Höhe des Punktes auf dem Einheitskreis über dem Winkel ab, entsteht die **Sinuskurve**.
      Sie wiederholt sich nach jeder vollen Drehung.

  - kind: problem
    id: hoehe
    widget: slider
    prompt: Stelle die Kurve y = a · sin(x) so ein, dass sie die gestrichelte trifft.
    params:
      expr: "a*sin(x)"
      x: [0, 6.5]
      y: [-3, 3]
      sliders: [{ id: a, label: a, min: 0.5, max: 3, step: 0.5, initial: 1 }]
      target: { expr: "2*sin(x)" }
    answer: { matchTarget: true }
    hints:
      - Die gestrichelte Kurve reicht bis 2 hinauf.
    explanation: a streckt die Kurve in die Höhe. Bei a = 2 schwingt sie von −2 bis 2.

  - kind: problem
    id: verschieben
    widget: slider
    prompt: Jetzt verschieben – y = sin(x) + c soll durch die gestrichelte Kurve gehen.
    params:
      expr: "sin(x) + c"
      x: [0, 6.5]
      y: [-3, 3]
      sliders: [{ id: c, label: c, min: -2, max: 2, step: 0.5, initial: 0 }]
      target: { expr: "sin(x) + 1" }
    answer: { matchTarget: true }
    hints:
      - Die gestrichelte Kurve liegt höher, schwingt aber genauso.
    explanation: c schiebt die Kurve nach oben oder unten.

  - kind: problem
    id: wo
    widget: choice
    prompt: Wo begegnen dir Sinuskurven im Alltag?
    params:
      options:
        - { label: Im Wechselstrom aus der Steckdose, correct: true }
        - { label: In einem Einkaufszettel, feedback: "Da schwingt nichts." }
        - { label: Im Kontostand mit festen Abbuchungen, feedback: "Das wäre eher eine fallende Gerade." }
    hints:
      - Was wiederholt sich regelmäßig hin und her?
    explanation: Wechselstrom schwingt 50-mal pro Sekunde als Sinuskurve – genauso wie Schall, Licht und Pendel.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was bewirkt die 3 in $y = \sin(3x)$?
    params:
      options:
        - label: Die Kurve schwingt dreimal so schnell – die Periode wird ein Drittel
          correct: true
        - label: Die Kurve wird dreimal so hoch
          feedback: Das wäre 3 · sin(x).
        - label: Die Kurve wird um 3 verschoben
          feedback: Das wäre sin(x + 3) oder sin(x) + 3.
    hints:
      - Bei welchem x ist 3x schon eine volle Drehung?
    explanation: Ein Faktor **im** Sinus staucht waagerecht, ein Faktor **davor** streckt senkrecht.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Die Sinuskurve hat ein Tal. Dreh den Punkt dorthin, wo der Sinus am kleinsten ist.
    params:
      scene: unitcircle
    answer:
      sin: -1
    explanation: "Bei 270° ist der Punkt ganz unten: Sinus −1."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Die allgemeine Sinuskurve ist $y = a \\sin(b x) + d$. a ist die **Amplitude**, d die Mittellinie. Die Periode wird mit b kürzer: Sie ist 360° : b, im Bogenmaß 2π : b."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie lang ist die Periode von $y = \sin({{b}}x)$ in Grad?
    params:
      unit: °
    answer:
      value: "{{360 / b}}"
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 360 * b
        misconception: inverse-period
        text: Ein größeres b macht die Schwingung schneller – die Periode kürzer.
    hints:
      - Eine volle Schwingung, wenn {{b}}x = 360°.
      - "x = 360° : {{b}}."
    explanation: "360° : {{b}} = {{360 / b}}°."
    difficulty: 2
    variants:
      params:
        b: choice[2,3,4,5,6,8]
      defaults:
        b: 3

  - kind: problem
    id: mb-d3
    depth: 2
    widget: slider
    prompt: Stell a und b so ein, dass $y = a \sin(b x)$ genau auf der gestrichelten Kurve liegt.
    params:
      expr: a*sin(b*x)
      x:
        - -4
        - 4
      y:
        - -3
        - 3
      sliders:
        - id: a
          label: a
          min: -3
          max: 3
          step: 0.5
          initial: 1
        - id: b
          label: b
          min: 0.5
          max: 3
          step: 0.5
          initial: 1
      target:
        expr: 2*sin(2*x)
    answer:
      matchTarget: true
    hints:
      - Wie hoch schwingt die Zielkurve? Das ist a.
      - "Zähl die Wellen: Sie schwingt doppelt so schnell."
    explanation: a = 2 (Höhe) und b = 2 (doppeltes Tempo, halbe Periode π).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was besagt die Idee von Fourier?
    params:
      options:
        - label: Jede periodische Schwingung lässt sich aus Sinuskurven zusammensetzen
          correct: true
        - label: Alle Schwingungen sind Sinuskurven
          feedback: Eine Rechteckschwingung ist keine – aber eine Summe aus vielen.
        - label: Sinuskurven lassen sich nicht addieren
          feedback: Doch – genau darauf beruht die Idee.
    hints:
      - Denk an einen Akkord aus mehreren Tönen.
    explanation: MP3, JPEG und Rauschunterdrückung zerlegen Signale so in Frequenzen.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Ein Riesenrad hat 50 m Durchmesser. Die Achse ist 30 m hoch, eine Runde dauert 20 Minuten. Du steigst unten ein. Wie hoch bist du nach 5 Minuten?
    params:
      unit: m
    answer:
      value: 30
    feedback:
      - when: numval(state.input) == 55
        misconception: half-turn
        text: Ganz oben bist du erst nach einer halben Runde, also nach 10 Minuten.
      - when: abs(numval(state.input) - 17.5) < 0.1
        misconception: linear-height
        text: Die Höhe wächst nicht gleichmäßig – nach einer Vierteldrehung bist du auf Achshöhe.
    hints:
      - Die Höhe ist $30 - 25\cos(\frac{360°}{20} \cdot t)$.
      - "Nach 5 Minuten: 90°, und cos 90° = 0."
    explanation: "h(5) = 30 − 25 · cos 90° = 30 m: eine Vierteldrehung, genau auf Achshöhe."
    difficulty: 3

  - kind: explain
    id: mb-x2
    depth: 3
    body: "Fourier zeigte: Jede periodische Kurve ist eine Summe von Sinuswellen. Eine **Rechteckwelle** ist $\\frac4\\pi\\left(\\sin x + \\frac13 \\sin 3x + \\frac15 \\sin 5x + \\dots\\right)$. Darauf beruhen MP3, JPEG und die Spektren der Physik."

  - kind: problem
    id: mb-x3
    depth: 3
    widget: choice
    prompt: Eine Flöte und eine Geige spielen denselben Ton, also dieselbe Grundfrequenz. Warum klingen sie verschieden?
    params:
      options:
        - label: Sie mischen verschieden starke Obertöne – Vielfache der Grundfrequenz – dazu.
          correct: true
        - label: Ihre Töne haben verschiedene Perioden.
          feedback: Gleicher Ton heißt gleiche Periode.
        - label: Die Geige ist lauter.
          feedback: Lautstärke ändert die Amplitude, nicht die Klangfarbe.
    hints:
      - "Denk an Fourier: Welche Sinuswellen stecken im Ton?"
      - Neben dem Grundton schwingen 2-, 3-, 4-mal so schnelle Wellen mit.
    explanation: Die Mischung der Obertöne ist die **Klangfarbe**. Eine Flöte klingt fast wie ein reiner Sinus, eine Geige hat viele kräftige Obertöne.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Sinuskurve ein abgerollter Kreis ist.
    params:
      keywords:
        - - höhe
          - height
        - - kreis
          - drehen
          - dreht
          - circle
          - rotat
          - turn
        - - winkel
          - zeit
          - angle
          - time
          - abrollen
          - unroll
      sample: Ein Punkt dreht sich auf dem Einheitskreis. Ich trage seine Höhe über dem Winkel ab. Weil sich die Drehung nach 360 Grad wiederholt, wiederholt sich auch die Kurve – das ist die Sinuskurve.
    explanation: Sinus ist die Höhe beim Drehen. Alles, was sich gleichmäßig dreht oder schwingt, erzeugt darum Sinuskurven.
    difficulty: 3

srs:
  cards_from: [hoehe, wo]
