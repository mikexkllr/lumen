id: math.trig.measure
type: concept
title: Höhen messen ohne Leiter
summary: Mit dem Tangens auf den Baum.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Vermessen aus der Ferne
    body: Den Mount Everest und den Mond hat niemand mit dem Maßband vermessen. Ein **Winkel** und ein Abstand genügten. Deck die Karten auf und staune, wie weit das reicht.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏔️
            front: Mount Everest
            back: Landvermesser bestimmten 1856 seine Höhe mit Winkeln – aus über 100 km Entfernung.
          - icon: 🌙
            front: Der Mond
            back: Vor über 2000 Jahren schätzte Hipparch seinen Abstand mit Winkeln erstaunlich genau.
          - icon: 🌲
            front: Förster
            back: Mit einem Winkelmesser und ein paar Schritten Abstand schätzen sie, wie hoch ein Baum ist.
          - icon: 📱
            front: Dein Handy
            back: Mess-Apps nutzen Kamera und Neigungssensor – also Abstand und Winkel.

  - kind: problem
    id: baum
    widget: numeric
    body: Du stehst 20 m vor einem Baum und siehst seine Spitze unter 45°.
    prompt: Wie hoch ist der Baum über deiner Augenhöhe?
    params: { unit: m }
    answer: { value: 20 }
    hints:
      - Bei 45° sind beide Katheten gleich lang.
    explanation: tan 45° = 1. Die Höhe ist so groß wie der Abstand – 20 m.

  - kind: explain
    id: s2
    body: |
      **tan α = Höhe : Abstand.** Wer Abstand und **Winkel** kennt, kennt die Höhe: Höhe = Abstand · tan α.

  - kind: problem
    id: turm
    widget: numeric
    prompt: Du stehst {{d}} m vor einem Turm und siehst die Spitze unter einem Winkel mit tan α = {{t}}. Wie hoch ist der Turm über deinen Augen?
    params: { unit: m }
    answer: { value: "{{d * t}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - d / t) < 0.1"
        misconception: divide
        text: Höhe = Abstand · tan α. Nicht teilen.
    hints:
      - "{{d}} · {{t}}."
    explanation: "{{d}} · {{t}} = {{d * t}} m."
    variants:
      params: { d: "choice[10,30,50,80]", t: "choice[0.5,1.2,2]" }
      defaults: { d: 30, t: 1.2 }

  - kind: problem
    id: schatten
    widget: angle
    prompt: Die Sonne steht so, dass ein 1 m hoher Stab einen 1 m langen Schatten wirft. Stelle den Sonnenwinkel ein.
    params: { initial: 10, max: 90 }
    answer: { value: 45 }
    hints:
      - Höhe und Schatten sind gleich lang.
    explanation: Gleich lange Katheten ergeben 45°.

  - kind: explain
    id: s5
    body: Wie maß man früher die Höhe der Pyramiden?
    reveal:
      body: Thales wartete, bis sein Schatten so lang war wie er selbst. In diesem Moment war auch der Schatten der Pyramide so lang wie ihre Höhe.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Ein Turm steht 20 m entfernt, seine Spitze ist 25 m über deinen Augen. Stell tan α so ein, dass die Sichtlinie genau die Spitze trifft.
    params:
      expr: t*x
      x:
        - 0
        - 25
      y:
        - 0
        - 30
      showCoordinates: false
      sliders:
        - id: t
          label: tan α
          min: 0.25
          max: 2
          step: 0.25
          initial: 0.5
      markers:
        - x: 20
          y: 25
          label: Spitze
    answer:
      values:
        t: 1.25
    hints:
      - "tan α = Höhe : Abstand."
      - "Rechne 25 : 20."
    explanation: "tan α = 25 : 20 = 1,25. Größer als 1 heißt: Der Winkel ist steiler als 45°."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein 1,80 m großer Mensch wirft einen 1,20 m langen Schatten. Ein Baum daneben wirft 8 m Schatten. Wie hoch ist der Baum?
    params:
      unit: m
    answer:
      value: 12
    hints:
      - "Das Verhältnis Höhe zu Schatten ist bei beiden gleich: 1,5."
    explanation: 8 m · 1,5 = 12 m. Gleicher Sonnenwinkel, gleicher Tangens.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Du wirfst mit 20 m/s. Bei welchem Winkel fliegt der Ball am weitesten – über 40 m?
    params:
      scene: projectile
      controls:
        speed:
          value: 20
          fixed: true
    answer:
      range:
        - 40
        - 42
    explanation: Bei 45°. Die Weite hängt am Sinus des doppelten Winkels – und der ist bei 90° am größten.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: Du stehst 50 m vor einem Turm und siehst die Spitze unter 30°. Wie hoch ist der Turm über deinen Augen? (tan 30° ≈ 0,577) Auf eine Stelle.
    params:
      unit: m
    answer:
      value: 28.9
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 25
        misconception: sin-not-tan
        text: Das wäre mit sin 30° = 0,5. Höhe zu Abstand ist aber der Tangens.
    hints:
      - Höhe = Abstand · tan α.
      - 50 · 0,577.
    explanation: 50 · 0,577 ≈ 28,9 m.
    difficulty: 2

  - kind: explain
    id: mb-d2
    depth: 2
    body: Mit Dreiecken vermisst man ganze Länder. Man misst eine Grundlinie genau und dann nur noch Winkel zu fernen Punkten. Diese **Triangulation** nutzte Snellius 1615 in den Niederlanden – GPS rechnet heute ähnlich, nur mit Laufzeiten.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eratosthenes maß um 240 v. Chr. den Erdumfang. Was brauchte er dafür?
    params:
      options:
        - label: Zwei Schattenwinkel an verschiedenen Orten und deren Abstand
          correct: true
        - label: Ein Schiff, das um die Erde fuhr
          feedback: Das gelang erst 1700 Jahre später.
        - label: Die Entfernung zum Mond
          feedback: Er brauchte nur die Sonne, einen Stab und eine Strecke.
    hints:
      - In Syene stand die Sonne senkrecht, in Alexandria warf ein Stab 7,2° Schatten.
    explanation: 7,2° sind 1/50 des Kreises. 50 mal die Strecke ergab rund 40 000 km – fast exakt.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: Vor einem Baum siehst du die Spitze unter 45°. Du gehst 20 m zurück und siehst sie unter 30°. Wie hoch ist der Baum über deinen Augen? (tan 30° ≈ 0,5774) Auf eine Stelle.
    params:
      unit: m
    answer:
      value: 27.3
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 20
        misconception: baseline-as-distance
        text: Der Abstand zum Baum ist unbekannt – nicht 20 m.
    hints:
      - Bei 45° ist die Höhe h gleich dem Abstand x.
      - h = (h + 20) · 0,5774. Löse nach h.
    explanation: h · (1 − 0,5774) = 11,55, also h ≈ 27,3 m. So misst man Berge, deren Fuß man nicht erreicht.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Wie weit sieht ein 1,80 m großer Mensch am Meer bis zum Horizont? Pythagoras im Dreieck mit dem Erdradius R = 6371 km liefert $d \approx \sqrt{2Rh}$. Antwort in km, auf eine Stelle.
    params:
      unit: km
    answer:
      value: 4.8
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 151) < 2
        misconception: units
        text: "Achte auf die Einheiten: h = 0,0018 km."
    hints:
      - "Rechne alles in km: h = 0,0018 km."
      - √(2 · 6371 · 0,0018) = √22,9.
    explanation: √22,9 ≈ 4,8 km. Von einem 100 m hohen Turm wären es schon 36 km.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man mit dem Tangens die Höhe eines Turms misst, ohne hinaufzusteigen.
    params:
      keywords:
        - - abstand
          - entfernung
          - distance
        - - winkel
          - angle
        - - tangens
          - tan
          - tangent
      sample: Ich messe meinen Abstand zum Turm und den Winkel, unter dem ich die Spitze sehe. Der Tangens des Winkels ist Höhe durch Abstand. Also ist die Höhe Abstand mal Tangens – plus meine Augenhöhe.
    explanation: Ein Winkel und eine Strecke legen ein rechtwinkliges Dreieck fest. Den Rest rechnet der Tangens.
    difficulty: 3

srs:
  cards_from: [turm, baum]
