id: math.trig.measure
type: concept
title: Höhen messen ohne Leiter
summary: Mit dem Tangens auf den Baum.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: baum
    widget: numeric
    body: Du stehst 20 m vor einem Baum und siehst seine Spitze unter 45°.
    prompt: Wie hoch ist der Baum über deiner Augenhöhe?
    params: { unit: m }
    answer: { value: 20 }
    hints:
      - Bei 45° sind beide Katheten gleich lang.
    explanation: tan 45° = 1. Die Höhe ist so groß wie der Abstand – 20 m.

  - kind: explain
    body: |
      **tan α = Höhe : Abstand.** Wer Abstand und Winkel kennt, kennt die Höhe: Höhe = Abstand · tan α.

  - kind: problem
    id: turm
    widget: numeric
    prompt: Du stehst {{d}} m vor einem Turm und siehst die Spitze unter einem Winkel mit tan α = {{t}}. Wie hoch ist der Turm über deinen Augen?
    params: { unit: m }
    answer: { value: "{{d * t}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - d / t) < 0.1"
        misconception: divide
        text: Höhe = Abstand · tan α. Nicht teilen.
    hints:
      - "{{d}} · {{t}}."
    explanation: "{{d}} · {{t}} = {{d * t}} m."
    variants:
      params: { d: "choice[10,30,50,80]", t: "choice[0.5,1.2,2]" }
      defaults: { d: 30, t: 1.2 }

  - kind: problem
    id: schatten
    widget: angle
    prompt: Die Sonne steht so, dass ein 1 m hoher Stab einen 1 m langen Schatten wirft. Stelle den Sonnenwinkel ein.
    params: { initial: 10, max: 90 }
    answer: { value: 45 }
    hints:
      - Höhe und Schatten sind gleich lang.
    explanation: Gleich lange Katheten ergeben 45°.

  - kind: explain
    body: Wie maß man früher die Höhe der Pyramiden?
    reveal:
      body: Thales wartete, bis sein Schatten so lang war wie er selbst. In diesem Moment war auch der Schatten der Pyramide so lang wie ihre Höhe.

srs:
  cards_from: [turm, baum]
