id: math.trig.measure
type: concept
title: Measuring Heights Without a Ladder
summary: Reach the tree with the tangent.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: baum
    widget: numeric
    body: You stand 20 m from a tree and see its top at 45°.
    prompt: How tall is the tree above your eye level?
    params: { unit: m }
    answer: { value: 20 }
    hints:
      - At 45°, both legs are equal in length.
    explanation: tan 45° = 1. The height equals the distance, 20 m.

  - kind: explain
    body: |
      **tan α = height ÷ distance.** If you know the distance and the angle, you know the height: height = distance · tan α.

  - kind: problem
    id: turm
    widget: numeric
    prompt: You stand {{d}} m from a tower and see its top at an angle with tan α = {{t}}. How tall is the tower above your eyes?
    params: { unit: m }
    answer: { value: "{{d * t}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - d / t) < 0.1"
        misconception: divide
        text: Height = distance · tan α. Don't divide.
    hints:
      - "{{d}} · {{t}}."
    explanation: "{{d}} · {{t}} = {{d * t}} m."
    variants:
      params: { d: "choice[10,30,50,80]", t: "choice[0.5,1.2,2]" }
      defaults: { d: 30, t: 1.2 }

  - kind: problem
    id: schatten
    widget: angle
    prompt: The sun is positioned so that a 1 m tall stick casts a 1 m long shadow. Set the sun's angle.
    params: { initial: 10, max: 90 }
    answer: { value: 45 }
    hints:
      - Height and shadow are equal in length.
    explanation: Equal legs give 45°.

  - kind: explain
    body: How did people measure the height of the pyramids long ago?
    reveal:
      body: Thales waited until his shadow was as long as he was tall. At that moment, the pyramid's shadow was as long as its height.

srs:
  cards_from: [turm, baum]
