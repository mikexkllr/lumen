id: math.trig.measure
type: concept
title: Measuring Heights Without a Ladder
summary: Reach the tree with the tangent.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Measuring from afar
    body: Nobody measured Mount Everest or the Moon with a tape measure. An **angle** and a distance were enough. Uncover the cards and see how far that gets you.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏔️
            front: Mount Everest
            back: In 1856, surveyors worked out its height using angles – from more than 100 km away.
          - icon: 🌙
            front: The Moon
            back: More than 2000 years ago, Hipparchus estimated its distance surprisingly well using angles.
          - icon: 🌲
            front: Foresters
            back: With an angle gauge and a few paces of distance, they estimate how tall a tree is.
          - icon: 📱
            front: Your phone
            back: Measuring apps use the camera and the tilt sensor – that is, distance and angle.

  - kind: problem
    id: baum
    widget: numeric
    body: You stand 20 m from a tree and see its top at 45°.
    prompt: How tall is the tree above your eye level?
    params: { unit: m }
    answer: { value: 20 }
    hints:
      - At 45°, both legs are equal in length.
    explanation: tan 45° = 1. The height equals the distance, 20 m.

  - kind: explain
    id: s2
    body: |
      **tan α = height ÷ distance.** If you know the distance and the **angle**, you know the height: height = distance · tan α.

  - kind: problem
    id: turm
    widget: numeric
    prompt: You stand {{d}} m from a tower and see its top at an angle with tan α = {{t}}. How tall is the tower above your eyes?
    params: { unit: m }
    answer: { value: "{{d * t}}", tolerance: 0.1 }
    feedback:
      - when: "abs(numval(state.input) - d / t) < 0.1"
        misconception: divide
        text: Height = distance · tan α. Don't divide.
    hints:
      - "{{d}} · {{t}}."
    explanation: "{{d}} · {{t}} = {{d * t}} m."
    variants:
      params: { d: "choice[10,30,50,80]", t: "choice[0.5,1.2,2]" }
      defaults: { d: 30, t: 1.2 }

  - kind: problem
    id: schatten
    widget: angle
    prompt: The sun is positioned so that a 1 m tall stick casts a 1 m long shadow. Set the sun's angle.
    params: { initial: 10, max: 90 }
    answer: { value: 45 }
    hints:
      - Height and shadow are equal in length.
    explanation: Equal legs give 45°.

  - kind: explain
    id: s5
    body: How did people measure the height of the pyramids long ago?
    reveal:
      body: Thales waited until his shadow was as long as he was tall. At that moment, the pyramid's shadow was as long as its height.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: A tower stands 20 m away, and its top is 25 m above your eyes. Set tan α so that your line of sight hits the top exactly.
    params:
      expr: t*x
      x:
        - 0
        - 25
      y:
        - 0
        - 30
      showCoordinates: false
      sliders:
        - id: t
          label: tan α
          min: 0.25
          max: 2
          step: 0.25
          initial: 0.5
      markers:
        - x: 20
          y: 25
          label: Top
    answer:
      values:
        t: 1.25
    hints:
      - "tan α = height : distance."
      - "Work out 25 : 20."
    explanation: "tan α = 25 : 20 = 1.25. Greater than 1 means the angle is steeper than 45°."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A person 1.80 m tall casts a 1.20 m shadow. A tree next to them casts an 8 m shadow. How tall is the tree?
    params:
      unit: m
    answer:
      value: 12
    hints:
      - "The ratio of height to shadow is the same for both: 1.5."
    explanation: 8 m · 1.5 = 12 m. Same sun angle, same tangent.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: You throw at 20 m/s. At which angle does the ball fly furthest – over 40 m?
    params:
      scene: projectile
      controls:
        speed:
          value: 20
          fixed: true
    answer:
      range:
        - 40
        - 42
    explanation: At 45°. The range depends on the sine of twice the angle – and that is largest at 90°.
    difficulty: 2

  - kind: problem
    id: mb-d1
    depth: 2
    widget: numeric
    prompt: You stand 50 m from a tower and see the top at 30°. How high is the tower above your eyes? (tan 30° ≈ 0.577) To one decimal.
    params:
      unit: m
    answer:
      value: 28.9
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 25
        misconception: sin-not-tan
        text: That would use sin 30° = 0.5. But height over distance is the tangent.
    hints:
      - Height = distance · tan α.
      - 50 · 0.577.
    explanation: 50 · 0.577 ≈ 28.9 m.
    difficulty: 2

  - kind: explain
    id: mb-d2
    depth: 2
    body: With triangles you can survey whole countries. You measure one baseline exactly and then only angles to distant points. Snellius used this **triangulation** in the Netherlands in 1615 – GPS works similarly today, with signal travel times.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eratosthenes measured the size of the Earth around 240 BC. What did he need for it?
    params:
      options:
        - label: Two shadow angles at different places and the distance between them
          correct: true
        - label: A ship that sailed around the Earth
          feedback: That only succeeded 1700 years later.
        - label: The distance to the Moon
          feedback: He only needed the Sun, a stick and a distance.
    hints:
      - In Syene the Sun stood overhead; in Alexandria a stick cast a 7.2° shadow.
    explanation: 7.2° is 1/50 of the circle. 50 times the distance gave about 40,000 km – almost exact.
    difficulty: 3

  - kind: problem
    id: mb-x1
    depth: 3
    widget: numeric
    prompt: In front of a tree you see the top at 45°. You step back 20 m and see it at 30°. How high is the tree above your eyes? (tan 30° ≈ 0.5774) To one decimal.
    params:
      unit: m
    answer:
      value: 27.3
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 20
        misconception: baseline-as-distance
        text: The distance to the tree is unknown – not 20 m.
    hints:
      - At 45° the height h equals the distance x.
      - h = (h + 20) · 0.5774. Solve for h.
    explanation: h · (1 − 0.5774) = 11.55, so h ≈ 27.3 m. That is how you measure mountains whose foot you cannot reach.
    difficulty: 3

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: How far can a 1.80 m tall person see to the horizon at sea? Pythagoras in the triangle with Earth's radius R = 6371 km gives $d \approx \sqrt{2Rh}$. Answer in km, to one decimal.
    params:
      unit: km
    answer:
      value: 4.8
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 151) < 2
        misconception: units
        text: "Mind the units: h = 0.0018 km."
    hints:
      - "Work in km: h = 0.0018 km."
      - √(2 · 6371 · 0.0018) = √22.9.
    explanation: √22.9 ≈ 4.8 km. From a 100 m tower it would already be 36 km.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux how to measure a tower's height with the tangent without climbing it.
    params:
      keywords:
        - - abstand
          - entfernung
          - distance
        - - winkel
          - angle
        - - tangens
          - tan
          - tangent
      sample: I measure my distance to the tower and the angle at which I see the top. The tangent of the angle is height over distance. So the height is distance times tangent – plus my eye height.
    explanation: One angle and one length fix a right triangle. The tangent does the rest.
    difficulty: 3

srs:
  cards_from: [turm, baum]
