id: math.trig.unitcircle
type: concept
title: The Unit Circle
summary: Sine is height, cosine is width.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: s1
    body: |
      Rotate the point on the circle with radius 1. Its **width** is the cosine, and its **height** is the sine.
      Try different angles.
    visual: { widget: angle, interactive: true, params: { initial: 30, trig: true } }

  - kind: problem
    id: hoechster
    widget: angle
    prompt: At which angle is the sine largest? Set it.
    params: { initial: 20, trig: true }
    answer: { value: 90 }
    hints:
      - When is the point at the very top?
    explanation: At 90°, the point is at the very top, so sin 90° = 1.

  - kind: problem
    id: cos-halb
    widget: angle
    prompt: Set an angle below 90° where the cosine is exactly 0.5.
    params: { initial: 10, trig: true, max: 90 }
    check: { predicate: "abs(cos - 0.5) < 0.01" }
    hints:
      - The width should be exactly half the radius.
    explanation: At 60°, cos = 0.5. The point sits exactly above the middle of the radius.

  - kind: problem
    id: sin-dreissig
    widget: numeric
    prompt: What is sin 30°? Try it on the circle if you like.
    params: { placeholder: "Decimal" }
    answer: { value: 0.5, tolerance: 0.01 }
    hints:
      - At 30°, the height is half as large as at 90°.
    explanation: sin 30° = 0.5.

  - kind: explain
    id: s5
    body: Why does sin² + cos² = 1 always hold?
    reveal:
      body: Width and height form a right triangle with the radius. By Pythagoras, width² + height² = 1², no matter the angle.

  - kind: problem
    id: negativ
    widget: choice
    prompt: In which range is the cosine negative?
    params:
      options:
        - { label: Between 90° and 270°, correct: true }
        - { label: Between 0° and 180°, feedback: "There, the sine is positive. The cosine turns negative from 90°." }
        - { label: Never, feedback: "Turn past 90°. The point moves to the left." }
    hints:
      - When is the point left of the center?
    explanation: Left of the center, the width is negative, from 90° to 270°.

  - kind: problem
    id: c1
    widget: sim
    prompt: Turn the point until sine and cosine are **equal** and both positive.
    params:
      scene: unitcircle
    answer:
      angle: 45
    explanation: "At 45° width and height are equal: about 0.71 each."

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Find an angle at which the sine is −1.
    params:
      scene: unitcircle
    answer:
      angle: 270
    explanation: "At 270° the point is at the very bottom: height −1, width 0."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: sin 150° equals the sine of which angle between 0° and 90°?
    params:
      unit: °
    answer:
      value: 30
    hints:
      - Mirror the point in the vertical axis.
    explanation: sin(180° − α) = sin α. The height stays the same when mirroring.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is $\cos 60° \cdot \sin 30° + \sin 60° \cdot \cos 30°$?
    answer:
      value: 1
    hints:
      - This is the addition theorem for sin(30° + 60°).
    explanation: "sin 90° = 1. Check: 0.5 · 0.5 + 0.866 · 0.866 = 0.25 + 0.75."
    difficulty: 3

srs:
  cards_from: [sin-dreissig, negativ]
