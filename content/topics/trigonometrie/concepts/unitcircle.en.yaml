id: math.trig.unitcircle
type: concept
title: The Unit Circle
summary: Sine is height, cosine is width.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: s1
    body: |
      Rotate the point on the circle with radius 1. Its **width** is the cosine, and its **height** is the sine.
      Try different angles.
    visual: { widget: angle, interactive: true, params: { initial: 30, trig: true } }

  - kind: problem
    id: hoechster
    widget: angle
    prompt: At which angle is the sine largest? Set it.
    params: { initial: 20, trig: true }
    answer: { value: 90 }
    hints:
      - When is the point at the very top?
    explanation: At 90°, the point is at the very top, so sin 90° = 1.

  - kind: problem
    id: cos-halb
    widget: angle
    prompt: Set an angle below 90° where the cosine is exactly 0.5.
    params: { initial: 10, trig: true, max: 90 }
    check: { predicate: "abs(cos - 0.5) < 0.01" }
    hints:
      - The width should be exactly half the radius.
    explanation: At 60°, cos = 0.5. The point sits exactly above the middle of the radius.

  - kind: problem
    id: sin-dreissig
    widget: numeric
    prompt: What is sin 30°? Try it on the circle if you like.
    params: { placeholder: "Decimal" }
    answer: { value: 0.5, tolerance: 0.01 }
    hints:
      - At 30°, the height is half as large as at 90°.
    explanation: sin 30° = 0.5.

  - kind: explain
    id: s5
    body: Why does sin² + cos² = 1 always hold?
    reveal:
      body: Width and height form a right triangle with the radius. By Pythagoras, width² + height² = 1², no matter the angle.

  - kind: problem
    id: negativ
    widget: choice
    prompt: In which range is the cosine negative?
    params:
      options:
        - { label: Between 90° and 270°, correct: true }
        - { label: Between 0° and 180°, feedback: "There, the sine is positive. The cosine turns negative from 90°." }
        - { label: Never, feedback: "Turn past 90°. The point moves to the left." }
    hints:
      - When is the point left of the center?
    explanation: Left of the center, the width is negative, from 90° to 270°.

  - kind: problem
    id: c1
    widget: sim
    prompt: Turn the point until sine and cosine are **equal** and both positive.
    params:
      scene: unitcircle
    answer:
      angle: 45
    explanation: "At 45° width and height are equal: about 0.71 each."

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Find an angle at which the sine is −1.
    params:
      scene: unitcircle
    answer:
      angle: 270
    explanation: "At 270° the point is at the very bottom: height −1, width 0."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: sin 150° equals the sine of which angle between 0° and 90°?
    params:
      unit: °
    answer:
      value: 30
    hints:
      - Mirror the point in the vertical axis.
    explanation: sin(180° − α) = sin α. The height stays the same when mirroring.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "The circle is full of **symmetry**: mirroring in the y-axis shows $\\sin(180° - \\alpha) = \\sin\\alpha$. Mirroring in the x-axis shows $\\cos(-\\alpha) = \\cos\\alpha$. And after 360° everything repeats."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: sim
    prompt: Turn the point into the second quarter until the cosine is exactly −0.5.
    params:
      scene: unitcircle
    answer:
      cos: -0.5
      angle:
        - 90
        - 180
    explanation: "At 120°: that is 60° mirrored in the y-axis. cos 60° = 0.5, so cos 120° = −0.5."
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: What is sin 210°?
    answer:
      value: -0.5
    feedback:
      - when: numval(state.input) == 0.5
        misconception: sign-quadrant
        text: At 210° the point lies below the x-axis. The sine is negative.
    hints:
      - 210° = 180° + 30°.
      - Same height as at 30°, but below.
    explanation: sin 210° = −sin 30° = −0.5.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is $\cos 60° \cdot \sin 30° + \sin 60° \cdot \cos 30°$?
    answer:
      value: 1
    hints:
      - This is the addition theorem for sin(30° + 60°).
    explanation: "sin 90° = 1. Check: 0.5 · 0.5 + 0.866 · 0.866 = 0.25 + 0.75."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "The **addition formula** $\\sin(\\alpha + \\beta) = \\sin\\alpha\\cos\\beta + \\cos\\alpha\\sin\\beta$ comes from rotating: two rotations in a row are one rotation by α + β. Multiply their rotation matrices and there it is."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Compute sin 75° = sin(45° + 30°) with the addition formula. To three decimals.
    answer:
      value: 0.966
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 1.207) < 0.002
        misconception: additive-sine
        text: sin 45° + sin 30° is not sin 75°. The sine is not additive.
    hints:
      - sin 45° = cos 45° ≈ 0.7071, sin 30° = 0.5, cos 30° ≈ 0.8660.
      - 0.7071 · 0.8660 + 0.7071 · 0.5.
    explanation: "0.6124 + 0.3536 = 0.9659. Exactly: $\\frac{\\sqrt6 + \\sqrt2}{4}$."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: We have sin α = 0.6 and cos α = 0.8. What is sin 2α? Put β = α into the addition formula.
    answer:
      value: 0.96
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 1.2
        misconception: linear-sine
        text: Double the angle does not mean double the sine.
    hints:
      - sin 2α = 2 · sin α · cos α.
      - 2 · 0.6 · 0.8.
    explanation: 2 · 0.6 · 0.8 = 0.96. That is the double-angle formula – and the reason for sin 2α in the range of a throw.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does sin² + cos² = 1 hold for every angle?"
    params:
      keywords:
        - - pythagoras
          - rechtwinklig
          - right triangle
          - right-angled
        - - radius
          - eins
          - one
          - hypotenuse
        - - breite
          - höhe
          - width
          - height
          - kosinus
          - sinus
          - cosine
          - sine
      sample: The point on the unit circle has width cos and height sin. With the radius 1 they form a right triangle. By Pythagoras width² + height² = radius² = 1.
    explanation: The equation is Pythagoras in the unit circle. It also holds in the other quarters because squares swallow the signs.
    difficulty: 3

srs:
  cards_from: [sin-dreissig, negativ]
