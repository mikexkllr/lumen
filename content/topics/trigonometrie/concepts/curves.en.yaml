id: math.trig.curves
type: concept
title: The Sine Curve
summary: A circle, unrolled.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You sit in a Ferris wheel. How does your height change over time?
    params:
      options:
        - label: It swings evenly up and down
          correct: true
        - label: It keeps rising
          feedback: After the top comes the bottom again.
        - label: It stays the same
          feedback: You ride in a circle.
    hints:
      - Up, down, up, down …
    explanation: If you plot the height, a famous curve appears.

  - kind: explain
    id: s1
    body: |
      If you plot the height of the point on the unit circle against the angle, you get the **sine curve**.
      It repeats after every full turn.

  - kind: problem
    id: hoehe
    widget: slider
    prompt: Adjust the curve y = a · sin(x) so that it hits the dashed one.
    params:
      expr: "a*sin(x)"
      x: [0, 6.5]
      y: [-3, 3]
      sliders: [{ id: a, label: a, min: 0.5, max: 3, step: 0.5, initial: 1 }]
      target: { expr: "2*sin(x)" }
    answer: { matchTarget: true }
    hints:
      - The dashed curve reaches up to 2.
    explanation: a stretches the curve vertically. At a = 2, it swings from −2 to 2.

  - kind: problem
    id: verschieben
    widget: slider
    prompt: Now shift it. y = sin(x) + c should pass through the dashed curve.
    params:
      expr: "sin(x) + c"
      x: [0, 6.5]
      y: [-3, 3]
      sliders: [{ id: c, label: c, min: -2, max: 2, step: 0.5, initial: 0 }]
      target: { expr: "sin(x) + 1" }
    answer: { matchTarget: true }
    hints:
      - The dashed curve sits higher but swings the same way.
    explanation: c shifts the curve up or down.

  - kind: problem
    id: wo
    widget: choice
    prompt: Where do you meet sine curves in everyday life?
    params:
      options:
        - { label: In the alternating current from a wall outlet, correct: true }
        - { label: In a shopping list, feedback: "Nothing oscillates there." }
        - { label: In a bank balance with fixed withdrawals, feedback: "That would be more like a falling straight line." }
    hints:
      - What repeats back and forth regularly?
    explanation: Alternating current oscillates as a sine curve 50 times per second, just like sound, light, and pendulums.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What does the 3 do in $y = \sin(3x)$?
    params:
      options:
        - label: The curve oscillates three times as fast – the period becomes a third
          correct: true
        - label: The curve becomes three times as tall
          feedback: That would be 3 · sin(x).
        - label: The curve is shifted by 3
          feedback: That would be sin(x + 3) or sin(x) + 3.
    hints:
      - At which x is 3x already a full turn?
    explanation: A factor **inside** the sine compresses horizontally, a factor **in front** stretches vertically.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: The sine curve has a trough. Turn the point to where the sine is smallest.
    params:
      scene: unitcircle
    answer:
      sin: -1
    explanation: "At 270° the point is at the very bottom: sine −1."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What does Fourier’s idea say?
    params:
      options:
        - label: Every periodic oscillation can be built from sine curves
          correct: true
        - label: All oscillations are sine curves
          feedback: A square wave is not one – but it is a sum of many.
        - label: Sine curves cannot be added
          feedback: They can – that is exactly the idea.
    hints:
      - Think of a chord made of several notes.
    explanation: MP3, JPEG and noise cancelling break signals into frequencies this way.
    difficulty: 3

srs:
  cards_from: [hoehe, wo]
