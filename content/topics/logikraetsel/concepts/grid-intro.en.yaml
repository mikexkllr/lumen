# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.grid-intro
type: concept
title: Who Has Which Pet?
summary: Cross out what is impossible, and the solution remains.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.elimination]
estimated_minutes: 9
steps:
  - kind: problem
    id: ada
    widget: choice
    body: Ada, Ben, and Cleo each have a different pet, either a cat, a dog, or a fish. Ada has neither the cat nor the dog.
    prompt: Which pet does Ada have?
    params:
      options:
        - label: the fish
          correct: true
        - label: the cat
          feedback: The cat is ruled out. Read the last sentence again.
        - label: the dog
          feedback: The dog is ruled out. Read the last sentence again.
        - label: You can't know.
          feedback: Yes, you can! Two of the three pets are ruled out. What is left?
    hints:
      - Which pets remain if you cross out the cat and the dog?
    explanation: The cat and the dog are ruled out. Only the fish remains.

  - kind: explain
    body: |
      This is the **process of elimination**: cross out what is impossible.
      If only one option remains, it is the solution.
      A grid helps you keep track.

  - kind: problem
    id: gitter-klein
    widget: logic-grid
    prompt: Who has which pet? Tap a cell once for ✗, twice for ✓.
    params:
      categories:
        - { name: Child, items: [Ada, Ben, Cleo] }
        - { name: Pet, items: [Cat, Dog, Fish] }
      clues:
        - text: Ada has no cat.
          rule: { not: [Ada, Cat] }
        - text: The dog belongs to neither Ada nor Cleo.
          rules: [{ not: [Ada, Dog] }, { not: [Cleo, Dog] }]
    hints:
      - First mark every ✗ that the clues state directly.
      - The dog belongs neither to Ada nor to Cleo. Who is left?
    explanation: Ben has the dog. Then Ada has the fish and Cleo the cat.

  - kind: problem
    id: leeres-feld
    widget: choice
    prompt: A row has two ✗ and one empty cell. What holds for the empty cell?
    params:
      options:
        - label: It must be a ✓.
          correct: true
        - label: It must be a ✗.
          feedback: Then the person would have no pet at all. But everyone has exactly one.
        - label: You can't know yet.
          feedback: Everyone has exactly one pet. If two are ruled out, only the third remains.
    hints:
      - How many pets does each person have?
    explanation: Each person has exactly one pet. Two ✗ leave only one ✓.

  - kind: problem
    id: fahrzeuge
    widget: logic-grid
    prompt: Who rides what, and in which color?
    params:
      categories:
        - { name: Child, items: [Mia, Noah, Lea] }
        - { name: Vehicle, items: [Bicycle, Scooter, Skateboard] }
        - { name: Color, items: [Red, Yellow, Blue] }
      clues:
        - text: The bicycle is yellow.
          rule: { is: [Bicycle, Yellow] }
        - text: Noah rides the scooter.
          rule: { is: [Noah, Scooter] }
        - text: The scooter is not blue.
          rule: { not: [Scooter, Blue] }
        - text: Mia's vehicle is not yellow.
          rule: { not: [Mia, Yellow] }
    hints:
      - Mia doesn't have yellow, so she doesn't have the yellow bicycle either.
      - Noah has the scooter. What is left for Mia?
    explanation: Mia rides the blue skateboard, Noah the red scooter, and Lea the yellow bicycle.
    difficulty: 2

  - kind: problem
    id: hobbys
    widget: logic-grid
    prompt: Who has which hobby?
    params:
      categories:
        - { name: Person, items: [Jana, Kemal, Lio, Maya] }
        - { name: Hobby, items: [Chess, Dancing, Guitar, Soccer] }
      clues:
        - text: Jana plays neither chess nor soccer.
          rules: [{ not: [Jana, Chess] }, { not: [Jana, Soccer] }]
        - text: Kemal dances.
          rule: { is: [Kemal, Dancing] }
        - text: Maya doesn't play soccer.
          rule: { not: [Maya, Soccer] }
    hints:
      - Kemal dances. What is left for Jana?
      - Jana plays guitar. Who plays soccer now?
    explanation: Jana plays guitar, Kemal dances, Lio plays soccer, and Maya plays chess.
    difficulty: 3
