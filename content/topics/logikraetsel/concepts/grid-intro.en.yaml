# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.grid-intro
type: concept
title: Who Has Which Pet?
summary: Cross out what is impossible, and the solution remains.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.elimination]
estimated_minutes: 10
steps:
  - kind: problem
    id: ada
    widget: choice
    body: Ada, Ben, and Cleo each have a different pet, either a cat, a dog, or a fish. Ada has neither the cat nor the dog.
    prompt: Which pet does Ada have?
    params:
      options:
        - label: the fish
          correct: true
        - label: the cat
          feedback: The cat is ruled out. Read the last sentence again.
        - label: the dog
          feedback: The dog is ruled out. Read the last sentence again.
        - label: You can't know.
          feedback: Yes, you can! Two of the three pets are ruled out. What is left?
    hints:
      - Which pets remain if you cross out the cat and the dog?
    explanation: The cat and the dog are ruled out. Only the fish remains.

  - kind: explain
    id: s2
    body: |
      This is the **process of elimination**: cross out what is impossible.
      If only one option remains, it is the solution.
      A grid helps you keep track.

  - kind: problem
    id: gitter-klein
    widget: logic-grid
    prompt: Who has which pet? Tap a cell once for ✗, twice for ✓.
    params:
      categories:
        - { name: Child, items: [Ada, Ben, Cleo] }
        - { name: Pet, items: [Cat, Dog, Fish] }
      clues:
        - text: Ada has no cat.
          rule: { not: [Ada, Cat] }
        - text: The dog belongs to neither Ada nor Cleo.
          rules: [{ not: [Ada, Dog] }, { not: [Cleo, Dog] }]
    hints:
      - First mark every ✗ that the clues state directly.
      - The dog belongs neither to Ada nor to Cleo. Who is left?
    explanation: Ben has the dog. Then Ada has the fish and Cleo the cat.

  - kind: problem
    id: leeres-feld
    widget: choice
    prompt: A row has two ✗ and one empty cell. What holds for the empty cell?
    params:
      options:
        - label: It must be a ✓.
          correct: true
        - label: It must be a ✗.
          feedback: Then the person would have no pet at all. But everyone has exactly one.
        - label: You can't know yet.
          feedback: Everyone has exactly one pet. If two are ruled out, only the third remains.
    hints:
      - How many pets does each person have?
    explanation: Each person has exactly one pet. Two ✗ leave only one ✓.

  - kind: problem
    id: fahrzeuge
    widget: logic-grid
    prompt: Who rides what, and in which color?
    params:
      categories:
        - { name: Child, items: [Mia, Noah, Lea] }
        - { name: Vehicle, items: [Bicycle, Scooter, Skateboard] }
        - { name: Color, items: [Red, Yellow, Blue] }
      clues:
        - text: The bicycle is yellow.
          rule: { is: [Bicycle, Yellow] }
        - text: Noah rides the scooter.
          rule: { is: [Noah, Scooter] }
        - text: The scooter is not blue.
          rule: { not: [Scooter, Blue] }
        - text: Mia's vehicle is not yellow.
          rule: { not: [Mia, Yellow] }
    hints:
      - Mia doesn't have yellow, so she doesn't have the yellow bicycle either.
      - Noah has the scooter. What is left for Mia?
    explanation: Mia rides the blue skateboard, Noah the red scooter, and Lea the yellow bicycle.
    difficulty: 2

  - kind: problem
    id: hobbys
    widget: logic-grid
    prompt: Who has which hobby?
    params:
      categories:
        - { name: Person, items: [Jana, Kemal, Lio, Maya] }
        - { name: Hobby, items: [Chess, Dancing, Guitar, Soccer] }
      clues:
        - text: Jana plays neither chess nor soccer.
          rules: [{ not: [Jana, Chess] }, { not: [Jana, Soccer] }]
        - text: Kemal dances.
          rule: { is: [Kemal, Dancing] }
        - text: Maya doesn't play soccer.
          rule: { not: [Maya, Soccer] }
    hints:
      - Kemal dances. What is left for Jana?
      - Jana plays guitar. Who plays soccer now?
    explanation: Jana plays guitar, Kemal dances, Lio plays soccer, and Maya plays chess.
    difficulty: 3

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Three children, three pets: how many different assignments are possible **without** any clues?"
    answer:
      value: 6
    hints:
      - The first child has 3 options, the second 2, the third 1.
    explanation: 3 · 2 · 1 = 6. Every clue strikes out some of them – until one remains.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Four children, four snacks. Who eats what?
    params:
      categories:
        - name: Child
          items:
            - Ada
            - Ben
            - Cleo
            - Dani
        - name: Snack
          items:
            - apple
            - pretzel
            - cookie
            - nuts
      clues:
        - text: Ben eats the pretzel.
          rule:
            is:
              - Ben
              - pretzel
        - text: Ada eats neither the apple nor the cookie.
          rules:
            - not:
                - Ada
                - apple
            - not:
                - Ada
                - cookie
        - text: Dani does not eat the apple.
          rule:
            not:
              - Dani
              - apple
    hints:
      - Place the sure tick for Ben first. What is left for Ada?
      - Ada has the nuts. Only two snacks remain for Dani, and one is ruled out.
    explanation: Ben – pretzel, Ada – nuts, Dani – cookie, Cleo – apple. Every tick creates new crosses in its row and column.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: For Ole and Pia only the cat and the dog are still open – the same two for both. What follows for Quinn?
    params:
      options:
        - label: Quinn has neither the cat nor the dog.
          correct: true
        - label: Quinn has the cat.
          feedback: The cat goes to Ole or Pia – it is not left for Quinn.
        - label: Nothing follows.
          feedback: "It does: two people share two pets, so both pets are taken."
    hints:
      - Ole and Pia together need exactly two pets.
      - Which pets do the two of them get for sure?
    explanation: "This is the pair trick: two people with the same two options use up both values – even if it is still open who gets which."
    difficulty: 2

  - kind: problem
    id: la-d3
    depth: 2
    widget: numeric
    prompt: How many matchings are there without clues for {{n}} children and {{n}} pets?
    answer:
      value: "{{f}}"
    feedback:
      - when: numval(state.input) == n * n
        misconception: cells-vs-matchings
        text: That is the number of cells in the grid, not the number of matchings.
    hints:
      - The first child has {{n}} options. How many are left for the second?
      - Multiply {{n}} · ({{n}} − 1) · … · 1.
    explanation: That is {{n}}! (factorial) = {{f}}. With 10 children it would be over 3.6 million – that is why systematic elimination pays off.
    difficulty: 2
    variants:
      params:
        n: int[3,6]
      derive:
        f: "n == 3 ? 6 : n == 4 ? 24 : n == 5 ? 120 : 720"
      defaults:
        n: 4

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A puzzle with 5 people and 5 houses has 120 possible assignments. How many yes/no clues are needed **at least** to pin down exactly one?
    params:
      options:
        - label: 7 – because 2⁷ = 128 is the first power of two above 120
          correct: true
        - label: 5 – one per person
          feedback: With that you can distinguish 2⁵ = 32 cases – too few.
        - label: 120 – one per possibility
          feedback: A good clue halves the possibilities.
    hints:
      - Each yes/no clue can at most halve the possibilities.
    explanation: log₂ 120 ≈ 6.9. Information is measured in bits – each bit halves the uncertainty.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "A puzzle has three categories with 4 values each: person, pet and colour. How many solutions are possible without clues?"
    answer:
      value: 576
    feedback:
      - when: numval(state.input) == 24
        misconception: one-category
        text: That only counts person – pet. The colours come on top.
      - when: numval(state.input) == 64
        misconception: with-repetition
        text: Each value may occur only once. These are orderings, not free choices.
    hints:
      - "Person – pet: 4! = 24 options. And independently person – colour?"
      - Multiply the two numbers.
    explanation: 24 · 24 = 576. Each extra category multiplies by 4! – that is why such puzzles grow so fast.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: "Explain to Lux: why does a single tick in the grid give you several crosses at once?"
    params:
      keywords:
        - - genau
          - eins
          - einmal
          - exactly
          - one
          - once
        - - zeile
          - spalte
          - row
          - column
        - - kreuz
          - streich
          - ausschließ
          - cross
          - rule out
          - eliminat
      sample: Each person has exactly one pet and each pet belongs to exactly one person. So a tick crosses out every other cell in its row and column.
    difficulty: 3
