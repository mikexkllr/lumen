id: logic.puzzles.sequences
type: concept
title: Zahlenfolgen
summary: Finde die Regel – dann kennst du jede nächste Zahl.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.sequences]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Muster im Turm
    body: Zahlenfolgen stecken in Kristallen, Kaninchen und Kontoständen. Hier wächst jede Säule nach einer festen **Regel**. Erkennst du sie? Zieh die fünfte Säule auf die Höhe, die als Nächstes kommt.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - "1."
          - "2."
          - "3."
          - "4."
          - "5."
        values:
          - 1
          - 3
          - 6
          - 10
          - 0
        editable:
          - 4
        min: 0
        max: 20
        step: 1

  - kind: problem
    id: plus-drei
    widget: numeric
    prompt: Wie geht es weiter? 3, 6, 9, 12, …
    answer: { value: 15 }
    hints:
      - Um wie viel wächst jede Zahl?
    explanation: Jedes Mal plus 3.

  - kind: problem
    id: verdoppeln
    widget: numeric
    prompt: Wie geht es weiter? 2, 4, 8, 16, …
    answer: { value: 32 }
    feedback:
      - when: "numval(state.input) == 18 || numval(state.input) == 24"
        misconception: additive-pattern
        text: Hier wird nicht immer gleich viel addiert. Jede Zahl ist das Doppelte der vorigen.
    hints:
      - Vergleiche 4 mit 2 und 8 mit 4.
    explanation: Jede Zahl ist das Doppelte der vorigen – 16 · 2 = 32.

  - kind: explain
    id: s3
    body: |
      Bei Folgen suchst du die **Regel**. Wird addiert? Multipliziert?
      Oder ändern sich die Abstände selbst nach einem Muster?

  - kind: problem
    id: quadrate
    widget: numeric
    prompt: Wie geht es weiter? 1, 4, 9, 16, 25, …
    answer: { value: 36 }
    hints:
      - Die Abstände sind 3, 5, 7, 9 …
      - Oder anders – 1 · 1, 2 · 2, 3 · 3 …
    explanation: Das sind die Quadratzahlen – 6 · 6 = 36.

  - kind: problem
    id: fibonacci
    widget: numeric
    prompt: Wie geht es weiter? 1, 1, 2, 3, 5, 8, …
    answer: { value: 13 }
    hints:
      - Schau dir immer zwei Nachbarn zusammen an.
      - Jede Zahl ist die Summe der beiden davor.
    explanation: 5 + 8 = 13.
    difficulty: 2

  - kind: problem
    id: arithmetisch
    widget: numeric
    prompt: Wie geht es weiter? {{a}}, {{a + d}}, {{a + 2 * d}}, {{a + 3 * d}}, …
    answer: { value: "{{a + 4 * d}}" }
    hints:
      - Wie groß ist der Abstand zwischen zwei Nachbarn?
    explanation: "Jedes Mal plus {{d}} – {{a + 3 * d}} + {{d}} = {{a + 4 * d}}."
    variants:
      params: { a: "int[1,20]", d: "int[2,9]" }
      defaults: { a: 7, d: 4 }

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: Welche Zahl passt nicht in die Folge 2, 5, 8, 12, 14?
    params:
      layout: grid
      options:
        - { label: "12", correct: true }
        - { label: "2", feedback: "2, 5, 8 – das passt mit plus 3." }
        - { label: "8", feedback: "8 = 5 + 3, das passt." }
        - { label: "14", feedback: "Wenn 12 eine 11 wäre, passte 14 genau." }
    hints:
      - Die ersten drei Zahlen wachsen um je 3.
    explanation: Richtig wäre 11 – dann geht es mit plus 3 bis 14 weiter.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: Die Säulen zeigen 1, 2, 4, 7, 11. Die Abstände wachsen jedes Mal um 1. Stell die sechste Säule ein.
    params:
      labels:
        - "1."
        - "2."
        - "3."
        - "4."
        - "5."
        - "6."
      values:
        - 1
        - 2
        - 4
        - 7
        - 11
        - 0
      editable:
        - 5
      min: 0
      max: 20
      step: 1
    answer:
      values:
        - 1
        - 2
        - 4
        - 7
        - 11
        - 16
    hints:
      - "Schau auf die Abstände zwischen zwei Säulen: 1, 2, 3, 4."
      - Der nächste Abstand ist 5. Rechne 11 + 5.
    explanation: "Die Abstände wachsen jedes Mal um 1: 1, 2, 3, 4, dann 5. Also folgt auf 11 die 16."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie geht es weiter? 2, 6, 12, 20, 30, …
    answer:
      value: 42
    hints:
      - Die Abstände sind 4, 6, 8, 10.
    explanation: "Plus 12 ergibt 42. Die Folge ist n · (n + 1): 1 · 2, 2 · 3, 3 · 4 …"
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Wie geht es weiter? 1, 3, 7, 13, 21, …
    answer:
      value: 31
    feedback:
      - when: numval(state.input) == 29
        misconception: constant-gap
        text: Die Abstände wachsen – sie bleiben nicht bei 8.
    hints:
      - Schreib die Abstände zwischen den Zahlen auf.
      - Die Abstände sind 2, 4, 6, 8 – welcher kommt als Nächstes?
    explanation: "Die **Differenzen** 2, 4, 6, 8, 10 bilden selbst eine einfache Folge. 21 + 10 = 31. Sind die zweiten Differenzen gleich, steckt eine quadratische Regel dahinter: hier n² − n + 1."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Die Folge beginnt mit {{a}} und wächst immer um {{d}}: {{a}}, {{a + d}}, {{a + 2 * d}}, … Welche Zahl steht an Stelle {{n}}?"
    answer:
      value: "{{a + (n - 1) * d}}"
    feedback:
      - when: numval(state.input) == a + n * d
        misconception: off-by-one
        text: "Einmal zu viel addiert: Stelle 1 ist {{a}} – da wurde noch nichts addiert."
    hints:
      - Wie oft wurde {{d}} bis zur Stelle 3 addiert? Und bis zur Stelle {{n}}?
      - Bis zur Stelle {{n}} wird ({{n}} − 1)-mal addiert.
    explanation: "{{a}} + ({{n}} − 1) · {{d}} = {{a + (n - 1) * d}}. Die Formel a + (n − 1) · d spart das Abzählen."
    difficulty: 2
    variants:
      params:
        a: int[1,9]
        d: int[2,9]
        n: int[10,30]
      defaults:
        a: 4
        d: 3
        n: 20

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Folge beginnt 1, 2, 4, 8, 16. Was kommt als Nächstes?
    params:
      options:
        - label: Streng genommen kann man es nicht wissen – 32 ist nur die einfachste Fortsetzung
          correct: true
        - label: Sicher 32
          feedback: Die Anzahl der Gebiete eines Kreises bei 6 Punkten auf dem Rand ist 31.
        - label: Sicher 31
          feedback: Auch das ist nur eine mögliche Regel.
    hints:
      - "Verbinde Punkte auf einem Kreis und zähle die Gebiete: 1, 2, 4, 8, 16, 31."
    explanation: Endlich viele Zahlen legen nie eine Regel fest. Ein Muster ist eine Vermutung – erst ein Beweis macht es sicher.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Die Folge beschreibt sich selbst: 1, 11, 21, 1211, 111221, … Welche Zahl kommt als Nächstes?"
    answer:
      value: 312211
    hints:
      - "Lies 1211 laut: »eine Eins, eine Zwei, zwei Einsen«. Das ergibt 111221."
      - "Lies jetzt 111221: drei Einsen, zwei Zweien, eine Eins."
    explanation: "Drei Einsen, zwei Zweien, eine Eins: 312211. Die Regel ist keine Rechnung, sondern eine Beschreibung. Folgen können also Regeln jeder Art haben."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man aus den ersten Gliedern einer Folge nie sicher auf die Regel schließen kann.
    params:
      keywords:
        - - regel
          - regeln
          - rule
          - rules
        - - mehrere
          - viele
          - verschiedene
          - several
          - many
          - different
        - - passen
          - passt
          - fit
          - fits
          - match
      sample: Zu endlich vielen Zahlen passen immer mehrere Regeln. Die nächste Zahl kann bei jeder Regel anders sein. Erst wer die Regel nennt, legt die Folge fest.
    difficulty: 3

srs:
  cards_from: ["arithmetisch"]
