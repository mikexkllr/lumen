id: logic.puzzles.conditional
type: concept
title: Wenn – dann
summary: Was aus einer Regel wirklich folgt – und was nicht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.conditional]
estimated_minutes: 11
steps:
  - kind: problem
    id: regen
    widget: choice
    body: Regel – wenn es regnet, ist die Straße nass. Du siehst – die Straße ist nass.
    prompt: Hat es geregnet?
    params:
      options:
        - { label: Nicht sicher, correct: true }
        - { label: "Ja, ganz sicher", feedback: "Die Straße kann auch aus anderen Gründen nass sein – etwa durch einen Rasensprenger." }
        - { label: "Nein, sicher nicht", feedback: "Regen ist durchaus möglich – nur nicht sicher." }
    hints:
      - Gibt es andere Gründe für eine nasse Straße?
    explanation: Die Regel sagt nur, was bei Regen passiert – nicht, was ohne Regen passiert.

  - kind: explain
    id: s2
    body: |
      »Wenn A, dann B« sagt nichts darüber, was ohne A geschieht.
      Sicher folgt nur – ist B **falsch**, dann war auch A falsch.

  - kind: problem
    id: schwimmen
    widget: choice
    body: Wenn Ali Zeit hat, geht er schwimmen. Heute ist Ali nicht schwimmen gegangen.
    prompt: Was folgt daraus sicher?
    params:
      options:
        - { label: Ali hatte keine Zeit, correct: true }
        - { label: Ali hatte Zeit, feedback: "Dann wäre er laut Regel schwimmen gegangen." }
        - { label: Gar nichts, feedback: "Doch – ist B falsch, muss auch A falsch sein." }
    hints:
      - Hätte Ali Zeit gehabt – was wäre passiert?
    explanation: Mit Zeit wäre er schwimmen gegangen. Er ging nicht, also hatte er keine Zeit.

  - kind: problem
    id: karten
    widget: choice
    body: Regel – zeigt eine Karte vorne einen Vokal, steht hinten eine gerade Zahl. Vor dir liegen die Karten E, K, 4 und 7.
    prompt: Welche Karten musst du umdrehen, um die Regel zu prüfen? Wähle alle nötigen.
    params:
      multiple: true
      layout: grid
      options:
        - { label: E, correct: true }
        - { label: "7", correct: true }
        - { label: K, feedback: "Für Konsonanten sagt die Regel nichts." }
        - { label: "4", feedback: "Hinter der 4 darf alles stehen – die Regel verbietet nichts." }
    hints:
      - Welche Karte könnte die Regel brechen?
      - Ein Vokal mit ungerader Zahl würde sie brechen.
    explanation: Hinter E könnte eine ungerade Zahl stehen, hinter 7 ein Vokal. Nur diese beiden können die Regel widerlegen.
    difficulty: 3

  - kind: problem
    id: kontraposition
    widget: choice
    prompt: Welche Aussage bedeutet dasselbe wie »Wenn ich müde bin, trinke ich Tee«?
    params:
      options:
        - { label: "Wenn ich keinen Tee trinke, bin ich nicht müde", correct: true }
        - { label: "Wenn ich Tee trinke, bin ich müde", feedback: "Das ist die Umkehrung – vielleicht trinkst du Tee auch einfach gern." }
        - { label: "Wenn ich nicht müde bin, trinke ich keinen Tee", feedback: "Die Regel verbietet keinen Tee am Morgen." }
    hints:
      - Was muss gelten, wenn B nicht passiert?
    explanation: Aus »wenn A, dann B« folgt »wenn nicht B, dann nicht A«.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: "Regel: Wenn es schneit, ist es kalt. Es schneit. Also ist es kalt."
          right: true
        - text: "Regel: Wenn es schneit, ist es kalt. Es ist kalt. Also schneit es."
          right: false
          why: Kalt kann es auch ohne Schnee sein.
        - text: "Regel: Wenn es schneit, ist es kalt. Es ist nicht kalt. Also schneit es nicht."
          right: true
        - text: "Regel: Wenn es schneit, ist es kalt. Es schneit nicht. Also ist es nicht kalt."
          right: false
      left: Folgt nicht
      right: Folgt sicher

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: "Regel: »Wenn die Ampel rot ist, hält das Auto.« Passt die Beobachtung?"
    params:
      buckets:
        - id: b1
          label: Passt zur Regel
        - id: b2
          label: Verletzt die Regel
      items:
        - label: Rot, das Auto hält
          bucket: b1
        - label: Grün, das Auto hält
          bucket: b1
        - label: Grün, das Auto fährt
          bucket: b1
        - label: Rot, das Auto fährt
          bucket: b2
    hints:
      - Die Regel sagt nichts über Grün.
    explanation: "Nur ein Fall verletzt die Regel: A stimmt, B aber nicht."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ist B [[falsch]], dann war auch A falsch. Aus B allein folgt dagegen [[nichts]].
      distractors:
        - wahr
        - alles

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Regel in einer Bar: »Wer Alkohol trinkt, muss über 18 sein.« Vier Gäste: einer trinkt Bier, einer Cola, einer ist 25, einer ist 16. Wen musst du prüfen?"
    params:
      options:
        - label: Den Biertrinker und den 16-Jährigen
          correct: true
        - label: Den Biertrinker und den 25-Jährigen
          feedback: Der 25-Jährige darf trinken, was er will.
        - label: Alle vier
          feedback: Der Cola-Trinker und der 25-Jährige können die Regel nicht brechen.
    hints:
      - Wer könnte die Regel überhaupt verletzen?
    explanation: Dieselbe Logik wie beim Kartenrätsel – aber im Alltagsgewand lösen es fast alle richtig.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: "Die Mutter sagt: »Du bekommst nur dann Eis, wenn du aufgegessen hast.« Was ist damit sicher?"
    params:
      options:
        - label: Wer Eis bekommt, hat aufgegessen.
          correct: true
        - label: Wer aufgegessen hat, bekommt sicher Eis.
          feedback: Das hat sie nicht versprochen. »Nur wenn« nennt eine Bedingung, keine Garantie.
        - label: Wer nicht aufgegessen hat, bekommt vielleicht trotzdem Eis.
          feedback: Genau das schließt »nur wenn« aus.
    hints:
      - "»Nur wenn A, dann B« heißt: ohne A kein B."
      - "Dreh es um: Gibt es Eis, dann …?"
    explanation: »B nur wenn A« bedeutet »Wenn B, dann A«. Aufessen ist **notwendig** für Eis, aber nicht unbedingt ausreichend.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: In »Wenn es regnet, ist die Straße nass« ist Regen [[hinreichend]] für eine nasse Straße. Eine nasse Straße ist [[notwendig]] für Regen.
      distractors:
        - unmöglich
        - zufällig
    hints:
      - "Hinreichend heißt: Das allein reicht schon. Notwendig heißt: Ohne das geht es nicht."
    explanation: Bei »Wenn A, dann B« ist A hinreichend für B und B notwendig für A. Regnet es, ist die Straße sicher nass. Ist sie trocken, kann es nicht regnen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum folgt aus »Wenn es regnet, ist die Straße nass« nicht, dass es geregnet hat, wenn die Straße nass ist?"
    params:
      keywords:
        - - andere
          - anderer
          - other
          - another
          - auch
          - also
        - - grund
          - ursache
          - reason
          - cause
        - - richtung
          - umkehr
          - rückwärts
          - direction
          - reverse
          - converse
          - eine richtung
          - one way
      sample: Die Regel gilt nur in eine Richtung. Die Straße kann auch aus einem anderen Grund nass sein, etwa durch einen Rasensprenger – die Umkehrung folgt nicht.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Neue Regel: »Eine Karte hat **genau dann** einen Vokal, wenn auf der Rückseite eine gerade Zahl steht.« Du siehst A, K, 4 und 7. Wie viele Karten musst du umdrehen?"
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: one-direction
        text: Das reicht für ein einfaches »wenn – dann«. »Genau dann« gilt aber in beide Richtungen.
    hints:
      - "»Genau dann, wenn« heißt: Wenn Vokal, dann gerade – und wenn gerade, dann Vokal."
      - Jede Richtung verlangt zwei Karten. Überschneiden sie sich?
    explanation: Für »Vokal → gerade« prüfst du A und 7. Für »gerade → Vokal« prüfst du 4 und K. Bei einer Genau-dann-Regel kann jede Karte sie verletzen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: "Es gilt: Wenn A, dann B. Wenn B, dann C. Du erfährst: C ist falsch. Was folgt?"
    params:
      options:
        - label: A und B sind beide falsch.
          correct: true
        - label: Nur B ist falsch, über A weiß man nichts.
          feedback: "Ist B falsch, folgt mit der ersten Regel auch: A ist falsch."
        - label: A ist wahr.
          feedback: Dann wäre B wahr und damit C – aber C ist falsch.
    hints:
      - "Geh die Kette rückwärts: Was folgt aus »nicht C« mit der zweiten Regel?"
      - Wende denselben Schluss auf die erste Regel an.
    explanation: "Zweimal Rückschluss (Modus tollens): nicht C, also nicht B. Nicht B, also nicht A. Ketten von Wenn-dann-Regeln lassen sich so rückwärts abbauen."
    difficulty: 3
