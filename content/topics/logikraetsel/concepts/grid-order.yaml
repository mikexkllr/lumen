# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.grid-order
type: concept
title: Wer ist zuerst?
summary: Aus »schneller als« und »älter als« eine ganze Reihenfolge bauen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.ordering]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Alle in einer Reihe
    body: "Ranglisten sind überall: im Sport, in den Charts, in der Warteschlange. Bring die vier der Größe nach in eine **Reihenfolge**. Tippe zwei Nachbarn an, um sie zu tauschen – bis die Reihe von klein nach groß steht."
    visual:
      widget: swap
      interactive: true
      params:
        values:
          - 172
          - 158
          - 185
          - 165
        labels:
          - Ida
          - Jan
          - Kim
          - Lou

  - kind: problem
    id: schnecken
    widget: order
    body: Drei Schnecken laufen um die Wette. Rosa ist schneller als Max. Max ist schneller als Fritz.
    prompt: Sortiere vom ersten bis zum letzten Platz.
    params:
      items: [{ label: Rosa }, { label: Max }, { label: Fritz }]
      startLabel: 1. Platz
      endLabel: letzter Platz
    hints:
      - Wer ist schneller als alle anderen?
    explanation: Rosa vor Max, Max vor Fritz – also Rosa, Max, Fritz.

  - kind: problem
    id: groesse
    widget: choice
    body: Ella ist größer als Finn. Gabi ist kleiner als Finn.
    prompt: Wer ist am kleinsten?
    params:
      options:
        - label: Gabi
          correct: true
        - label: Finn
          feedback: Gabi ist noch kleiner als Finn.
        - label: Ella
          feedback: Ella ist größer als Finn – sie ist die Größte.
        - label: Das kann man nicht sagen.
          feedback: Doch. Bringe die drei in eine Reihe – Ella, Finn, Gabi.
    hints:
      - Ordne die drei von groß nach klein.
    explanation: Ella > Finn > Gabi. Gabi ist am kleinsten.

  - kind: explain
    id: s2
    body: |
      »Schneller als« ist eine **Reihenfolge**. Sie gilt weiter:
      Ist A schneller als B und B schneller als C, dann ist A auch schneller als C.

  - kind: problem
    id: plaetze
    widget: logic-grid
    prompt: Wer belegt welchen Platz?
    params:
      categories:
        - { name: Kind, items: [Ole, Pia, Rina] }
        - { name: Platz, items: [1. Platz, 2. Platz, 3. Platz] }
      ordered: 1
      clues:
        - text: Pia war schneller als Ole.
          rule: { less: [Pia, Ole] }
        - text: Ole wurde nicht Letzter.
          rule: { not: [Ole, 3. Platz] }
    hints:
      - Ole ist nicht Letzter. Kann er Erster sein, wenn Pia schneller war?
    explanation: Ole kann weder Erster noch Letzter sein – er ist Zweiter. Pia ist Erste, Rina Dritte.

  - kind: problem
    id: schlange
    widget: order
    body: Ali steht vor Bea. Cem steht hinter Bea. Dana steht direkt vor Ali.
    prompt: Wie stehen die vier in der Schlange?
    params:
      items: [{ label: Dana }, { label: Ali }, { label: Bea }, { label: Cem }]
      startLabel: vorne
      endLabel: hinten
    hints:
      - Beginne mit Ali und Bea. Wo passt Dana hin?
    explanation: Dana steht direkt vor Ali, Ali vor Bea, Cem hinter Bea.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ist A größer als B und B größer als C, dann ist A größer als C.
          right: true
        - text: Mag A B und B mag C, dann mag A auch C.
          right: false
          why: »Mögen« überträgt sich nicht automatisch.
        - text: Aus »A vor B« und »B vor C« folgt eine eindeutige Reihenfolge der drei.
          right: true

  - kind: problem
    id: alter
    widget: logic-grid
    prompt: Wie alt ist wer?
    params:
      categories:
        - { name: Kind, items: [Tim, Una, Vera, Wim] }
        - { name: Alter, items: [8 Jahre, 9 Jahre, 10 Jahre, 11 Jahre] }
      ordered: 1
      clues:
        - text: Tim ist genau ein Jahr älter als Una.
          rule: { offset: [Una, Tim, 1] }
        - text: Vera ist die Jüngste.
          rule: { is: [Vera, 8 Jahre] }
        - text: Wim ist älter als Tim.
          rule: { less: [Tim, Wim] }
    hints:
      - Vera ist 8. Für die anderen bleiben 9, 10 und 11.
      - Wim ist älter als Tim, und Tim ist älter als Una. Wer ist also 11?
    explanation: Vera 8, Una 9, Tim 10, Wim 11.
    difficulty: 2

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Fünf Läufer: A ist vor B, C ist vor D, B ist vor C, E ist Letzter. Auf welchem Platz landet C?"
    answer:
      value: 3
    hints:
      - "Bau die Kette: A, B, C, D – und E am Ende."
    explanation: A, B, C, D, E – C ist Dritter.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Wer belegt welchen Platz beim Wettlauf?
    params:
      categories:
        - name: Läufer
          items:
            - Ali
            - Bea
            - Cem
            - Dora
        - name: Platz
          items:
            - 1. Platz
            - 2. Platz
            - 3. Platz
            - 4. Platz
      ordered: 1
      clues:
        - text: Bea kam direkt vor Cem ins Ziel.
          rule:
            offset:
              - Bea
              - Cem
              - 1
        - text: Ali kam irgendwann vor Dora ins Ziel.
          rule:
            less:
              - Ali
              - Dora
        - text: Dora wurde nicht Letzte.
          rule:
            not:
              - Dora
              - 4. Platz
    hints:
      - Dora ist nicht Erste (Ali ist vor ihr) und nicht Letzte. Welche Plätze bleiben?
      - Bea und Cem brauchen zwei Plätze direkt nacheinander. Probiere Dora auf Platz 2 und auf Platz 3.
    explanation: Ali 1., Dora 2., Bea 3., Cem 4. Mit Dora auf Platz 3 fände das Paar Bea–Cem keine zwei Nachbarplätze.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: order
    prompt: Ute ist größer als Tom. Tom ist größer als Lia. Max ist kleiner als Lia, aber größer als Ben. Ordne von groß nach klein.
    params:
      items:
        - label: Ute
        - label: Tom
        - label: Lia
        - label: Max
        - label: Ben
      startLabel: größte
      endLabel: kleinste
    hints:
      - Wer wird nie als kleiner genannt?
      - "Hänge die Paare zu einer Kette: Ute > Tom > Lia > …"
    explanation: "Weil »größer als« **transitiv** ist, ergeben vier Paare eine einzige Kette: Ute > Tom > Lia > Max > Ben."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Schere schlägt Papier, Papier schlägt Stein, Stein schlägt Schere. Warum gibt es hier keine »beste« Wahl?
    params:
      options:
        - label: Die Beziehung ist nicht transitiv – sie läuft im Kreis
          correct: true
        - label: Weil es nur drei Möglichkeiten gibt
          feedback: Auch mit drei könnte es eine klare Rangfolge geben.
        - label: Weil das Spiel unfair ist
          feedback: Es ist vollkommen ausgeglichen.
    hints:
      - Versuch, die drei in eine Reihenfolge zu bringen.
    explanation: Eine Reihenfolge braucht **Transitivität**. Auch Mehrheitswahlen können im Kreis laufen – das Condorcet-Paradox.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Drei Hinweise: A ist schneller als B. B ist schneller als C. C ist schneller als A. Was folgt?"
    params:
      options:
        - label: Mindestens ein Hinweis ist falsch.
          correct: true
        - label: Alle drei sind gleich schnell.
          feedback: »Schneller als« schließt Gleichstand aus – sonst wäre schon der erste Hinweis falsch.
        - label: A gewinnt das Rennen.
          feedback: Aus den ersten beiden Hinweisen folgt A > C – der dritte sagt aber C > A.
    hints:
      - Was folgt aus den ersten beiden Hinweisen über A und C?
      - Kann A zugleich schneller und langsamer als C sein?
    explanation: Eine echte Reihenfolge hat nie einen Kreis. Aus A > B > C folgt A > C. Dazu passt C > A nicht. Bei Schere, Stein, Papier ist das anders – dort geht es nicht um eine Reihenfolge.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: numeric
    prompt: Vier Läufer sollen nur durch Zweier-Rennen in eine Rangfolge gebracht werden. Wie viele Rennen braucht man im schlimmsten Fall mindestens?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 6
        misconception: all-pairs
        text: Sechs reichen, aber es geht mit einem Rennen weniger.
      - when: numval(state.input) == 3
        misconception: too-few
        text: Mit drei Rennen gibt es nur 2³ = 8 mögliche Ausgänge – aber 24 Rangfolgen.
    hints:
      - Wie viele Rangfolgen von 4 Läufern gibt es? Jedes Rennen hat 2 Ausgänge.
      - 2⁴ = 16 ist kleiner als 24. Also reichen 4 Rennen nicht.
    explanation: Es gibt 4! = 24 Rangfolgen. k Rennen unterscheiden höchstens 2ᵏ Fälle, also braucht man k ≥ 5. Und 5 reichen tatsächlich. Diese Grenze gilt für jedes Sortierverfahren mit Vergleichen.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was »transitiv« heißt – und warum man damit aus wenigen Hinweisen eine ganze Reihenfolge bekommt.
    params:
      keywords:
        - - transitiv
          - weiter
          - überträgt
          - transitive
          - carries
          - also holds
        - - vor
          - schneller
          - größer
          - ahead
          - faster
          - taller
          - before
        - - kette
          - reihenfolge
          - chain
          - order
      sample: Ist A vor B und B vor C, dann ist A auch vor C. Diese Eigenschaft heißt transitiv. So hängt man Paare zu einer Kette zusammen und erhält die ganze Reihenfolge.
    difficulty: 3
