id: logic.puzzles.sequences
type: concept
title: Number Sequences
summary: Find the rule, and you know every next number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.sequences]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The pattern in the tower
    body: Number sequences hide in crystals, rabbits and bank balances. Here every bar grows by a fixed **rule**. Can you spot it? Drag the fifth bar to the height that comes next.
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - "1."
          - "2."
          - "3."
          - "4."
          - "5."
        values:
          - 1
          - 3
          - 6
          - 10
          - 0
        editable:
          - 4
        min: 0
        max: 20
        step: 1

  - kind: problem
    id: plus-drei
    widget: numeric
    prompt: What comes next? 3, 6, 9, 12, …
    answer: { value: 15 }
    hints:
      - By how much does each number grow?
    explanation: Plus 3 each time.

  - kind: problem
    id: verdoppeln
    widget: numeric
    prompt: What comes next? 2, 4, 8, 16, …
    answer: { value: 32 }
    feedback:
      - when: "numval(state.input) == 18 || numval(state.input) == 24"
        misconception: additive-pattern
        text: The same amount isn't added each time. Each number is double the previous one.
    hints:
      - Compare 4 with 2 and 8 with 4.
    explanation: Each number is double the previous one. 16 · 2 = 32.

  - kind: explain
    id: s3
    body: |
      With sequences, you look for the **rule**. Is it adding? Multiplying?
      Or do the gaps themselves follow a pattern?

  - kind: problem
    id: quadrate
    widget: numeric
    prompt: What comes next? 1, 4, 9, 16, 25, …
    answer: { value: 36 }
    hints:
      - The gaps are 3, 5, 7, 9 …
      - "Or try this: 1 · 1, 2 · 2, 3 · 3 …"
    explanation: These are the square numbers. 6 · 6 = 36.

  - kind: problem
    id: fibonacci
    widget: numeric
    prompt: What comes next? 1, 1, 2, 3, 5, 8, …
    answer: { value: 13 }
    hints:
      - Always look at two neighbors together.
      - Each number is the sum of the two before it.
    explanation: 5 + 8 = 13.
    difficulty: 2

  - kind: problem
    id: arithmetisch
    widget: numeric
    prompt: What comes next? {{a}}, {{a + d}}, {{a + 2 * d}}, {{a + 3 * d}}, …
    answer: { value: "{{a + 4 * d}}" }
    hints:
      - What is the gap between two neighbors?
    explanation: "Plus {{d}} each time. {{a + 3 * d}} + {{d}} = {{a + 4 * d}}."
    variants:
      params: { a: "int[1,20]", d: "int[2,9]" }
      defaults: { a: 7, d: 4 }

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: Which number doesn't fit the sequence 2, 5, 8, 12, 14?
    params:
      layout: grid
      options:
        - { label: "12", correct: true }
        - { label: "2", feedback: "2, 5, 8 fits with plus 3." }
        - { label: "8", feedback: "8 = 5 + 3, that fits." }
        - { label: "14", feedback: "If 12 were 11, then 14 would fit exactly." }
    hints:
      - The first three numbers grow by 3 each.
    explanation: The correct number would be 11. Then plus 3 continues up to 14.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: The bars show 1, 2, 4, 7, 11. The gaps grow by 1 each time. Set the sixth bar.
    params:
      labels:
        - "1."
        - "2."
        - "3."
        - "4."
        - "5."
        - "6."
      values:
        - 1
        - 2
        - 4
        - 7
        - 11
        - 0
      editable:
        - 5
      min: 0
      max: 20
      step: 1
    answer:
      values:
        - 1
        - 2
        - 4
        - 7
        - 11
        - 16
    hints:
      - "Look at the gaps between neighbouring bars: 1, 2, 3, 4."
      - The next gap is 5. Work out 11 + 5.
    explanation: "The gaps grow by 1 each time: 1, 2, 3, 4, then 5. So 16 comes after 11."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What comes next? 2, 6, 12, 20, 30, …
    answer:
      value: 42
    hints:
      - The gaps are 4, 6, 8, 10.
    explanation: "Plus 12 gives 42. The sequence is n · (n + 1): 1 · 2, 2 · 3, 3 · 4 …"
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: What comes next? 1, 3, 7, 13, 21, …
    answer:
      value: 31
    feedback:
      - when: numval(state.input) == 29
        misconception: constant-gap
        text: The gaps grow – they do not stay at 8.
    hints:
      - Write down the gaps between the numbers.
      - The gaps are 2, 4, 6, 8 – which comes next?
    explanation: "The differences 2, 4, 6, 8, 10 form a simple sequence of their own. 21 + 10 = 31. When the second differences are constant, the rule is quadratic: here n² − n + 1."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "The sequence starts at {{a}} and always grows by {{d}}: {{a}}, {{a + d}}, {{a + 2 * d}}, … Which number is in position {{n}}?"
    answer:
      value: "{{a + (n - 1) * d}}"
    feedback:
      - when: numval(state.input) == a + n * d
        misconception: off-by-one
        text: "One step too many: position 1 is {{a}}, where nothing has been added yet."
    hints:
      - How often was {{d}} added up to position 3? And up to position {{n}}?
      - Up to position {{n}} you add ({{n}} − 1) times.
    explanation: "{{a}} + ({{n}} − 1) · {{d}} = {{a + (n - 1) * d}}. The formula a + (n − 1) · d saves counting."
    difficulty: 2
    variants:
      params:
        a: int[1,9]
        d: int[2,9]
        n: int[10,30]
      defaults:
        a: 4
        d: 3
        n: 20

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The sequence begins 1, 2, 4, 8, 16. What comes next?
    params:
      options:
        - label: Strictly speaking you cannot know – 32 is merely the simplest continuation
          correct: true
        - label: Certainly 32
          feedback: The number of regions of a circle with 6 points on the edge is 31.
        - label: Certainly 31
          feedback: That too is just one possible rule.
    hints:
      - "Connect points on a circle and count the regions: 1, 2, 4, 8, 16, 31."
    explanation: Finitely many numbers never fix a rule. A pattern is a conjecture – only a proof makes it certain.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "The sequence describes itself: 1, 11, 21, 1211, 111221, … Which number comes next?"
    answer:
      value: 312211
    hints:
      - 'Read 1211 aloud: "one one, one two, two ones". That gives 111221.'
      - "Now read 111221: three ones, two twos, one one."
    explanation: "Three ones, two twos, one one: 312211. The rule is not arithmetic but a description – sequences can follow any kind of rule."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why the first few terms of a sequence never pin down the rule for sure.
    params:
      keywords:
        - - regel
          - regeln
          - rule
          - rules
        - - mehrere
          - viele
          - verschiedene
          - several
          - many
          - different
        - - passen
          - passt
          - fit
          - fits
          - match
      sample: Several rules always fit finitely many numbers, and each rule can give a different next number. Only stating the rule fixes the sequence.
    difficulty: 3

srs:
  cards_from: ["arithmetisch"]
