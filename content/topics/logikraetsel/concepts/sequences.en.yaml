id: logic.puzzles.sequences
type: concept
title: Number Sequences
summary: Find the rule, and you know every next number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.sequences]
estimated_minutes: 7
steps:
  - kind: problem
    id: plus-drei
    widget: numeric
    prompt: What comes next? 3, 6, 9, 12, …
    answer: { value: 15 }
    hints:
      - By how much does each number grow?
    explanation: Plus 3 each time.

  - kind: problem
    id: verdoppeln
    widget: numeric
    prompt: What comes next? 2, 4, 8, 16, …
    answer: { value: 32 }
    feedback:
      - when: "numval(state.input) == 18 || numval(state.input) == 24"
        misconception: additive-pattern
        text: The same amount isn't added each time. Each number is double the previous one.
    hints:
      - Compare 4 with 2 and 8 with 4.
    explanation: Each number is double the previous one. 16 · 2 = 32.

  - kind: explain
    id: s3
    body: |
      With sequences, you look for the **rule**. Is it adding? Multiplying?
      Or do the gaps themselves follow a pattern?

  - kind: problem
    id: quadrate
    widget: numeric
    prompt: What comes next? 1, 4, 9, 16, 25, …
    answer: { value: 36 }
    hints:
      - The gaps are 3, 5, 7, 9 …
      - "Or try this: 1 · 1, 2 · 2, 3 · 3 …"
    explanation: These are the square numbers. 6 · 6 = 36.

  - kind: problem
    id: fibonacci
    widget: numeric
    prompt: What comes next? 1, 1, 2, 3, 5, 8, …
    answer: { value: 13 }
    hints:
      - Always look at two neighbors together.
      - Each number is the sum of the two before it.
    explanation: 5 + 8 = 13.
    difficulty: 2

  - kind: problem
    id: arithmetisch
    widget: numeric
    prompt: What comes next? {{a}}, {{a + d}}, {{a + 2 * d}}, {{a + 3 * d}}, …
    answer: { value: "{{a + 4 * d}}" }
    hints:
      - What is the gap between two neighbors?
    explanation: "Plus {{d}} each time. {{a + 3 * d}} + {{d}} = {{a + 4 * d}}."
    variants:
      params: { a: "int[1,20]", d: "int[2,9]" }
      defaults: { a: 7, d: 4 }

  - kind: problem
    id: ausreisser
    widget: choice
    prompt: Which number doesn't fit the sequence 2, 5, 8, 12, 14?
    params:
      layout: grid
      options:
        - { label: "12", correct: true }
        - { label: "2", feedback: "2, 5, 8 fits with plus 3." }
        - { label: "8", feedback: "8 = 5 + 3, that fits." }
        - { label: "14", feedback: "If 12 were 11, then 14 would fit exactly." }
    hints:
      - The first three numbers grow by 3 each.
    explanation: The correct number would be 11. Then plus 3 continues up to 14.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What comes next? 2, 6, 12, 20, 30, …
    answer:
      value: 42
    hints:
      - The gaps are 4, 6, 8, 10.
    explanation: "Plus 12 gives 42. The sequence is n · (n + 1): 1 · 2, 2 · 3, 3 · 4 …"
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The sequence begins 1, 2, 4, 8, 16. What comes next?
    params:
      options:
        - label: Strictly speaking you cannot know – 32 is merely the simplest continuation
          correct: true
        - label: Certainly 32
          feedback: The number of regions of a circle with 6 points on the edge is 31.
        - label: Certainly 31
          feedback: That too is just one possible rule.
    hints:
      - "Connect points on a circle and count the regions: 1, 2, 4, 8, 16, 31."
    explanation: Finitely many numbers never fix a rule. A pattern is a conjecture – only a proof makes it certain.
    difficulty: 3

srs:
  cards_from: ["arithmetisch"]
