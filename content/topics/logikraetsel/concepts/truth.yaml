# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.truth
type: concept
title: Ehrliche und Schwindler
summary: Nimm etwas an und prüfe, ob es zu einem Widerspruch führt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.truth]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Insel der Lügner
    body: "Stell dir eine Insel vor, auf der manche immer lügen. Klingt nach Chaos – ist aber ein Paradies für Logiker. Deck die Karten auf: Sie zeigen, warum ein **Lügner** so viel verrät."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚪
            front: Zwei Türen, zwei Wächter
            back: Einer lügt immer, einer nie. Mit nur einer klugen Frage findest du trotzdem die richtige Tür.
          - icon: 🔄
            front: Lügen ist berechenbar
            back: Wer immer lügt, verrät die Wahrheit genauso sicher – du drehst einfach jeden Satz um.
          - icon: 🎩
            front: Raymond Smullyan
            back: Der Logiker und Zauberkünstler füllte ganze Bücher mit Rätseln über Ritter und Schurken.
          - icon: 🎲
            front: Raten verboten
            back: In diesen Rätseln gibt es keinen Zufall. Jede Antwort folgt sicher aus dem, was gesagt wird.

  - kind: problem
    id: start-wahr
    widget: choice
    body: Auf der Insel Wahrlund leben Ehrliche und Schwindler. Ehrliche sagen immer die Wahrheit. Draußen scheint die Sonne.
    prompt: Was sagt ein Ehrlicher über das Wetter?
    params:
      options:
        - label: »Die Sonne scheint.«
          correct: true
        - label: »Die Sonne scheint nicht.«
          feedback: Das wäre gelogen. Ehrliche lügen nie.
        - label: »Es ist Nacht.«
          feedback: Auch das stimmt nicht – und Ehrliche sagen nur Wahres.
    hints:
      - Ein Ehrlicher sagt nur, was stimmt.
      - Wie ist das Wetter gerade wirklich?
    explanation: Ehrliche sagen immer, was stimmt. Bei ihnen kannst du jeden Satz wörtlich nehmen.

  - kind: problem
    id: start-luege
    widget: choice
    body: Schwindler lügen immer. Draußen scheint immer noch die Sonne.
    prompt: Was kann ein Schwindler über das Wetter sagen?
    params:
      options:
        - label: »Die Sonne scheint nicht.«
          correct: true
        - label: »Die Sonne scheint.«
          feedback: Das wäre die Wahrheit. Ein Schwindler sagt nie etwas Wahres.
        - label: »Es ist hell draußen.«
          feedback: Auch das stimmt. So etwas sagt ein Schwindler nicht.
    hints:
      - Ein Schwindler sagt nur Sätze, die falsch sind.
      - Welcher der drei Sätze stimmt gerade nicht?
    explanation: "Ein Schwindler sagt nur Falsches. Du erfährst trotzdem etwas: Dreh seinen Satz einfach um."

  - kind: problem
    id: start-frage
    widget: choice
    prompt: "Du fragst einen Schwindler: »Bist du ein Schwindler?« Was antwortet er?"
    params:
      options:
        - label: »Nein.«
          correct: true
        - label: »Ja.«
          feedback: Das wäre die Wahrheit. Er lügt aber immer.
        - label: Er schweigt.
          feedback: Er antwortet – nur eben gelogen.
    hints:
      - Die wahre Antwort wäre »Ja«.
      - Ein Schwindler sagt immer das Gegenteil der Wahrheit.
    explanation: Er lügt und sagt »Nein«. Ein Ehrlicher sagt auch »Nein« – und meint es ernst. Beide geben also dieselbe Antwort!

  - kind: problem
    id: ich-luege
    widget: choice
    body: Auf der Insel Wahrlund gibt es Ehrliche und Schwindler. Ehrliche sagen immer die Wahrheit. Schwindler lügen immer. Jemand sagt »Ich bin ein Schwindler«.
    prompt: Kann das auf Wahrlund passieren?
    params:
      options:
        - label: Nein, das sagt dort niemand.
          correct: true
        - label: Ja, dann ist es ein Schwindler.
          feedback: Ein Schwindler lügt. Er würde also behaupten, ehrlich zu sein.
        - label: Ja, dann ist es ein Ehrlicher.
          feedback: Ein Ehrlicher sagt die Wahrheit – er würde nicht behaupten, ein Schwindler zu sein.
    hints:
      - Probiere beide Fälle aus. Was würde ein Ehrlicher sagen? Was ein Schwindler?
    explanation: Für Ehrliche wäre der Satz eine Lüge, für Schwindler die Wahrheit. Beides geht nicht.

  - kind: problem
    id: was-sagt-schwindler
    widget: choice
    prompt: Welche Sätze könnte ein Schwindler sagen? Wähle alle passenden.
    params:
      multiple: true
      options:
        - label: "»Ich bin ehrlich.«"
          correct: true
        - label: "»2 + 2 = 5«"
          correct: true
        - label: "»Ich bin ein Schwindler.«"
          feedback: Dieser Satz wäre aus seinem Mund wahr. Schwindler sagen nie die Wahrheit.
        - label: "»Ein Jahr hat 12 Monate.«"
          feedback: Das stimmt – so etwas sagt ein Schwindler nicht.
    hints:
      - Ein Schwindler sagt nur Sätze, die falsch sind.
    explanation: Ein Schwindler sagt nur Falsches. »Ich bin ehrlich« und »2 + 2 = 5« sind aus seinem Mund falsch.

  - kind: explain
    id: s2
    body: |
      Trick für solche Rätsel: Nimm an, jemand ist ehrlich. Prüfe dann, ob alles zusammenpasst.
      Gibt es einen **Widerspruch**, war die Annahme falsch.

  - kind: problem
    id: ina
    widget: choice
    body: Ina sagt »Jo und ich sind beide Schwindler«.
    prompt: Was ist Ina?
    params:
      options:
        - label: Schwindlerin
          correct: true
        - label: Ehrlich
          feedback: Wäre Ina ehrlich, wäre ihr Satz wahr – dann wäre sie aber eine Schwindlerin. Widerspruch!
    hints:
      - Nimm an, Ina ist ehrlich. Was folgt dann aus ihrem Satz?
    explanation: Ehrlich kann Ina nicht sein, das führt zum Widerspruch. Sie lügt also.

  - kind: problem
    id: jo
    widget: choice
    body: Ina sagt »Jo und ich sind beide Schwindler«. Du weißt jetzt, dass Ina lügt.
    prompt: Was ist Jo?
    params:
      options:
        - label: Ehrlich
          correct: true
        - label: Schwindler
          feedback: Dann wären beide Schwindler – und Inas Satz wäre wahr. Aber Ina lügt!
    hints:
      - Inas Satz ist falsch. Was ist das Gegenteil von »beide sind Schwindler«?
    explanation: Inas Satz ist gelogen. Also sind nicht beide Schwindler – Jo muss ehrlich sein.
    difficulty: 2

  - kind: problem
    id: mix-c1
    widget: swipe
    prompt: Ein Schwindler lügt immer. Kann er diesen Satz sagen?
    params:
      cards:
        - text: »Ich bin ein Schwindler.«
          right: false
          why: Das wäre die Wahrheit.
        - text: »Ich bin ehrlich.«
          right: true
        - text: »2 + 2 = 5.«
          right: true
        - text: »2 + 2 = 4.«
          right: false
      left: Kann er nicht sagen
      right: Kann er sagen

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Nimm an, jemand ist [[ehrlich]]. Führt das zu einem [[Widerspruch]], war die Annahme falsch.
      distractors:
        - müde
        - Beweis

  - kind: problem
    id: mix-c3
    widget: order
    prompt: So löst du ein Wahrheitsrätsel. Ordne.
    params:
      items:
        - label: Eine Person als ehrlich annehmen
        - label: Ihre Aussage als wahr eintragen
        - label: Alle anderen Aussagen prüfen
        - label: Bei Widerspruch die Annahme umdrehen
    hints:
      - Erst annehmen, dann folgern, dann prüfen.
    explanation: "Zwei Fälle genügen: ehrlich oder nicht. Einer bleibt übrig."

  - kind: problem
    id: kai-lu
    depth: 2
    widget: choice
    body: Kai sagt »Lu ist ehrlich«. Lu sagt »Kai und ich sind verschieden«.
    prompt: Was sind die beiden?
    params:
      options:
        - label: Beide sind Schwindler.
          correct: true
        - label: Beide sind ehrlich.
          feedback: Dann wäre Lus Satz wahr – aber beide wären gleich. Widerspruch!
        - label: Kai ist ehrlich, Lu schwindelt.
          feedback: Ist Kai ehrlich, stimmt sein Satz – dann wäre Lu ehrlich.
        - label: Kai schwindelt, Lu ist ehrlich.
          feedback: Dann wäre Kais Satz »Lu ist ehrlich« wahr. Kai lügt aber immer.
    hints:
      - Nimm an, Kai ist ehrlich. Was folgt für Lu? Passt Lus Satz dazu?
      - Kai ist nicht ehrlich. Was heißt das für seinen Satz über Lu?
    explanation: Kai lügt, also ist Lu kein Ehrlicher. Lus Satz »wir sind verschieden« ist gelogen – beide schwindeln.
    difficulty: 3

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Auf der Insel lügen Schwindler immer, Ehrliche nie. A sagt: »B ist ein Schwindler.« B sagt: »Wir sind beide vom selben Typ.« Was ist A?"
    params:
      options:
        - label: Ehrlich
          correct: true
        - label: Ein Schwindler
          feedback: Dann wäre B ehrlich, und sein Satz »selber Typ« wäre falsch – das geht nicht.
        - label: Unmöglich zu sagen
          feedback: Probier beide Fälle für B durch – nur einer geht auf.
    hints:
      - Wäre B ehrlich, wäre auch A ehrlich – aber A nennt B einen Schwindler.
    explanation: "B muss ein Schwindler sein. Sein Satz ist dann gelogen: Die Typen sind verschieden – A ist ehrlich, und A’s Aussage stimmt."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: "Auf einer Insel leben nur Ehrliche und Schwindler. Jeder der 5 Bewohner sagt: »Ich bin ehrlich.« Wie viele von ihnen können das sagen?"
    answer:
      value: 5
    hints:
      - Was sagt ein Ehrlicher über sich? Und ein Schwindler?
    explanation: Alle fünf. Der Satz verrät gar nichts – jeder sagt ihn.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "A sagt: »B ist ein Schwindler.« B sagt: »C ist ein Schwindler.« C sagt: »A und B sind beide Schwindler.« Wie viele der drei sind ehrlich?"
    answer:
      value: 1
    hints:
      - Nimm an, C ist ehrlich. Dann wären A und B Schwindler. Passt das zu As Satz?
      - C lügt also. Dann ist Bs Satz wahr – was ist B? Und was folgt für A?
    explanation: Wäre C ehrlich, wäre A ein Schwindler – dann wäre B ehrlich. Widerspruch! Also lügt C. Bs Satz stimmt, B ist ehrlich. A nennt B einen Schwindler und lügt. Nur B ist ehrlich.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: buckets
    prompt: Wer kann diesen Satz sagen?
    params:
      buckets:
        - id: b1
          label: nur Ehrliche
        - id: b2
          label: nur Schwindler
        - id: b3
          label: beide
        - id: b4
          label: niemand
      items:
        - label: »2 + 2 = 4.«
          bucket: b1
        - label: »Ich bin ehrlich und 2 + 2 = 5.«
          bucket: b2
        - label: »Ich bin ehrlich.«
          bucket: b3
        - label: »Ich bin ein Schwindler.«
          bucket: b4
        - label: »Ich bin ein Schwindler oder 2 + 2 = 4.«
          bucket: b1
    hints:
      - "Prüfe für jeden Satz: Ist er wahr oder falsch, wenn ihn ein Ehrlicher sagt? Und bei einem Schwindler?"
      - Ein »und« ist schon falsch, wenn ein Teil falsch ist. Ein »oder« ist schon wahr, wenn ein Teil wahr ist.
    explanation: Ehrliche sagen nur Wahres, Schwindler nur Falsches. »Ich bin ehrlich und 2 + 2 = 5« ist immer falsch – also nur für Schwindler. »… oder 2 + 2 = 4« ist immer wahr – also nur für Ehrliche.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Bewohner sagt: »Ich bin ein Schwindler.« Was folgt?"
    params:
      options:
        - label: Das kann dort niemand sagen – der Satz wäre weder wahr noch gelogen
          correct: true
        - label: Er ist ein Schwindler
          feedback: Dann hätte er die Wahrheit gesagt – das tun Schwindler nie.
        - label: Er ist ehrlich
          feedback: Dann wäre seine Aussage falsch – Ehrliche lügen nie.
    hints:
      - Prüf beide Fälle.
    explanation: "Das **Lügner-Paradox**: Sätze, die über sich selbst reden, können die Logik sprengen. Darauf baut Gödels berühmter Beweis."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "A sagt: »Wenn ich ehrlich bin, dann ist B ehrlich.« Was sind A und B?"
    params:
      options:
        - label: Beide sind ehrlich.
          correct: true
        - label: A ist ein Schwindler.
          feedback: Ist A Schwindler, hat der Satz eine falsche Wenn-Hälfte – dann ist er wahr. Ein Schwindler sagt aber nie Wahres.
        - label: A ist ehrlich, B ist ein Schwindler.
          feedback: Dann wäre die Wenn-Hälfte wahr und die Dann-Hälfte falsch – der Satz wäre gelogen.
    hints:
      - Ein »Wenn A, dann B« mit falscher Wenn-Hälfte ist immer wahr. Was heißt das für einen Schwindler A?
      - A muss ehrlich sein. Damit ist die Wenn-Hälfte wahr – was muss dann gelten?
    explanation: "Formal: A sagt S genau dann, wenn A ehrlich ist und S wahr – oder A lügt und S falsch ist. Ein Schwindler würde hier etwas Wahres sagen. Also ist A ehrlich, und dann muss B ehrlich sein."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man ein Ehrlich-Schwindler-Rätsel mit einer Annahme löst.
    params:
      keywords:
        - - annehmen
          - angenommen
          - annahme
          - assume
          - suppose
          - assumption
        - - widerspruch
          - passt nicht
          - contradiction
          - does not fit
        - - falsch
          - gegenteil
          - wrong
          - opposite
          - other
      sample: Ich nehme an, eine Person ist ehrlich, und prüfe alle Sätze. Führt das zu einem Widerspruch, war die Annahme falsch – dann ist sie ein Schwindler.
    difficulty: 3
