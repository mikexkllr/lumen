# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.grid-intro
type: concept
title: Wer hat welches Tier?
summary: Streiche aus, was nicht geht – dann bleibt die Lösung übrig.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.elimination]
estimated_minutes: 9
steps:
  - kind: problem
    id: ada
    widget: choice
    body: Ada, Ben und Cleo haben je ein anderes Tier – eine Katze, einen Hund oder einen Fisch. Ada hat weder die Katze noch den Hund.
    prompt: Welches Tier hat Ada?
    params:
      options:
        - label: den Fisch
          correct: true
        - label: die Katze
          feedback: Die Katze ist ausgeschlossen – lies den letzten Satz noch einmal.
        - label: den Hund
          feedback: Der Hund ist ausgeschlossen – lies den letzten Satz noch einmal.
        - label: Das kann man nicht wissen.
          feedback: Doch! Von drei Tieren sind zwei ausgeschlossen. Was bleibt übrig?
    hints:
      - Welche Tiere bleiben übrig, wenn du Katze und Hund streichst?
    explanation: Katze und Hund sind ausgeschlossen. Es bleibt nur der Fisch.

  - kind: explain
    body: |
      Das ist das **Ausschlussprinzip**: Streiche, was nicht geht.
      Bleibt nur eine Möglichkeit übrig, ist sie die Lösung.
      Ein Gitter hilft dir, den Überblick zu behalten.

  - kind: problem
    id: gitter-klein
    widget: logic-grid
    prompt: Wer hat welches Tier? Tippe auf ein Feld – einmal für ✗, zweimal für ✓.
    params:
      categories:
        - { name: Kind, items: [Ada, Ben, Cleo] }
        - { name: Tier, items: [Katze, Hund, Fisch] }
      clues:
        - text: Ada hat keine Katze.
          rule: { not: [Ada, Katze] }
        - text: Der Hund gehört weder Ada noch Cleo.
          rules: [{ not: [Ada, Hund] }, { not: [Cleo, Hund] }]
    hints:
      - Markiere zuerst alle ✗, die direkt in den Hinweisen stehen.
      - Der Hund gehört nicht Ada und nicht Cleo. Wem dann?
    explanation: Ben hat den Hund. Ada hat dann den Fisch, Cleo die Katze.

  - kind: problem
    id: leeres-feld
    widget: choice
    prompt: In einer Zeile stehen zwei ✗ und ein leeres Feld. Was gilt für das leere Feld?
    params:
      options:
        - label: Dort muss ein ✓ hin.
          correct: true
        - label: Dort muss ein ✗ hin.
          feedback: Dann hätte die Person gar kein Tier. Jede Person hat aber genau eins.
        - label: Das weiß man noch nicht.
          feedback: Jede Person hat genau ein Tier. Sind zwei ausgeschlossen, bleibt nur das dritte.
    hints:
      - Wie viele Tiere hat jede Person?
    explanation: Jede Person hat genau ein Tier. Zwei ✗ lassen nur ein ✓ übrig.

  - kind: problem
    id: fahrzeuge
    widget: logic-grid
    prompt: Wer fährt was – und in welcher Farbe?
    params:
      categories:
        - { name: Kind, items: [Mia, Noah, Lea] }
        - { name: Fahrzeug, items: [Fahrrad, Roller, Skateboard] }
        - { name: Farbe, items: [Rot, Gelb, Blau] }
      clues:
        - text: Das Fahrrad ist gelb.
          rule: { is: [Fahrrad, Gelb] }
        - text: Noah fährt Roller.
          rule: { is: [Noah, Roller] }
        - text: Der Roller ist nicht blau.
          rule: { not: [Roller, Blau] }
        - text: Mias Fahrzeug ist nicht gelb.
          rule: { not: [Mia, Gelb] }
    hints:
      - Mia hat nicht Gelb – also auch nicht das gelbe Fahrrad.
      - Noah hat den Roller. Was bleibt für Mia übrig?
    explanation: Mia fährt das blaue Skateboard, Noah den roten Roller, Lea das gelbe Fahrrad.
    difficulty: 2

  - kind: problem
    id: hobbys
    widget: logic-grid
    prompt: Wer hat welches Hobby?
    params:
      categories:
        - { name: Person, items: [Jana, Kemal, Lio, Maya] }
        - { name: Hobby, items: [Schach, Tanzen, Gitarre, Fußball] }
      clues:
        - text: Jana spielt weder Schach noch Fußball.
          rules: [{ not: [Jana, Schach] }, { not: [Jana, Fußball] }]
        - text: Kemal tanzt.
          rule: { is: [Kemal, Tanzen] }
        - text: Maya spielt nicht Fußball.
          rule: { not: [Maya, Fußball] }
    hints:
      - Kemal tanzt. Was bleibt dann für Jana?
      - Jana spielt Gitarre. Wer spielt nun Fußball?
    explanation: Jana spielt Gitarre, Kemal tanzt, Lio spielt Fußball und Maya Schach.
    difficulty: 3
