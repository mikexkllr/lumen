# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.truth
type: concept
title: Truth-Tellers and Liars
summary: Assume something and check whether it leads to a contradiction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.truth]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The island of liars
    body: "Picture an island where some people always lie. Sounds like chaos – but it is a paradise for logicians. Uncover the cards: they show why a **liar** gives so much away."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🚪
            front: Two doors, two guards
            back: One always lies, one never does. With just one clever question you can still find the right door.
          - icon: 🔄
            front: Lying is predictable
            back: Someone who always lies gives the truth away just as surely – you simply flip every sentence.
          - icon: 🎩
            front: Raymond Smullyan
            back: The logician and stage magician filled whole books with puzzles about knights and knaves.
          - icon: 🎲
            front: No guessing
            back: These puzzles involve no luck. Every answer follows for sure from what is said.

  - kind: problem
    id: ich-luege
    widget: choice
    body: On the island of Truthland, there are truth-tellers and liars. Truth-tellers always tell the truth. Liars always lie. Someone says "I am a liar."
    prompt: Can this happen on Truthland?
    params:
      options:
        - label: No, nobody there says that.
          correct: true
        - label: Yes, then it is a liar.
          feedback: A liar lies. So a liar would claim to be a truth-teller.
        - label: Yes, then it is a truth-teller.
          feedback: A truth-teller tells the truth, so they wouldn't claim to be a liar.
    hints:
      - Try both cases. What would a truth-teller say? What would a liar say?
    explanation: For a truth-teller, the sentence would be a lie. For a liar, it would be the truth. Neither works.

  - kind: explain
    id: s2
    body: |
      A trick for puzzles like these: assume someone is a truth-teller. Then check whether everything fits.
      If there is a **contradiction**, the assumption was wrong.

  - kind: problem
    id: ina
    widget: choice
    body: Ina says "Jo and I are both liars."
    prompt: What is Ina?
    params:
      options:
        - label: Liar
          correct: true
        - label: Truth-teller
          feedback: If Ina were a truth-teller, her sentence would be true. But then she would be a liar. Contradiction!
    hints:
      - Assume Ina is a truth-teller. What follows from her sentence?
    explanation: Ina can't be a truth-teller, since that leads to a contradiction. So she lies.

  - kind: problem
    id: jo
    widget: choice
    body: Ina says "Jo and I are both liars." You now know that Ina lies.
    prompt: What is Jo?
    params:
      options:
        - label: Truth-teller
          correct: true
        - label: Liar
          feedback: Then both would be liars, and Ina's sentence would be true. But Ina lies!
    hints:
      - Ina's sentence is false. What is the opposite of "both are liars"?
    explanation: Ina's sentence is a lie. So they are not both liars, and Jo must be a truth-teller.
    difficulty: 2

  - kind: problem
    id: kai-lu
    widget: choice
    body: Kai says "Lu is a truth-teller." Lu says "Kai and I are different."
    prompt: What are the two?
    params:
      options:
        - label: Both are liars.
          correct: true
        - label: Both are truth-tellers.
          feedback: Then Lu's sentence would be true, but both would be the same. Contradiction!
        - label: Kai is a truth-teller, Lu lies.
          feedback: If Kai is a truth-teller, his sentence is true, so Lu would be a truth-teller.
        - label: Kai lies, Lu is a truth-teller.
          feedback: Then Kai's sentence "Lu is a truth-teller" would be true. But Kai always lies.
    hints:
      - Assume Kai is a truth-teller. What follows for Lu? Does Lu's sentence fit?
      - Kai is not a truth-teller. What does that mean for his sentence about Lu?
    explanation: Kai lies, so Lu is not a truth-teller. Lu's sentence "we are different" is a lie, so both lie.
    difficulty: 3

  - kind: problem
    id: was-sagt-schwindler
    widget: choice
    prompt: Which sentences could a liar say? Choose all that apply.
    params:
      multiple: true
      options:
        - label: '"I am a truth-teller."'
          correct: true
        - label: '"2 + 2 = 5"'
          correct: true
        - label: '"I am a liar."'
          feedback: From a liar's mouth, this sentence would be true. Liars never tell the truth.
        - label: '"A year has 12 months."'
          feedback: That is true, and a liar wouldn't say it.
    hints:
      - A liar only says sentences that are false.
    explanation: A liar only says false things. "I am a truth-teller" and "2 + 2 = 5" are false coming from a liar.

  - kind: problem
    id: mix-c1
    widget: swipe
    prompt: A liar always lies. Can he say this sentence?
    params:
      cards:
        - text: “I am a liar.”
          right: false
          why: That would be the truth.
        - text: “I am honest.”
          right: true
        - text: “2 + 2 = 5.”
          right: true
        - text: “2 + 2 = 4.”
          right: false
      left: Cannot say it
      right: Can say it

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Suppose someone is [[honest]]. If that leads to a [[contradiction]], the assumption was wrong.
      distractors:
        - tired
        - proof

  - kind: problem
    id: mix-c3
    widget: order
    prompt: This is how you solve a truth puzzle. Order.
    params:
      items:
        - label: Assume one person is honest
        - label: Enter their statement as true
        - label: Check all other statements
        - label: On contradiction flip the assumption
    hints:
      - First assume, then infer, then check.
    explanation: "Two cases suffice: honest or not. One remains."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "On the island liars always lie, truth-tellers never. A says: “B is a liar.” B says: “We are both of the same type.” What is A?"
    params:
      options:
        - label: A truth-teller
          correct: true
        - label: A liar
          feedback: Then B would be truthful, and his sentence “same type” would be false – impossible.
        - label: Impossible to say
          feedback: Go through both cases for B – only one works out.
    hints:
      - If B were truthful, A would be truthful too – but A calls B a liar.
    explanation: "B must be a liar. His sentence is then a lie: the types differ – A is truthful, and A’s statement is correct."
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: "Only honest people and liars live on an island. Each of the 5 inhabitants says: “I am honest.” How many of them can say that?"
    answer:
      value: 5
    hints:
      - What does an honest person say about themselves? And a liar?
    explanation: All five. The sentence reveals nothing – everyone says it.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: 'A says: "B is a liar." B says: "C is a liar." C says: "A and B are both liars." How many of the three are honest?'
    answer:
      value: 1
    hints:
      - Assume C is honest. Then A and B are liars. Does that fit what A says?
      - So C lies. Then B told the truth – what is B? And what follows for A?
    explanation: If C were honest, A would be a liar, so B would be honest. Contradiction! So C lies, B told the truth and is honest, and A, who called B a liar, lies. Only B is honest.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: buckets
    prompt: Who can say this sentence?
    params:
      buckets:
        - id: b1
          label: honest only
        - id: b2
          label: liars only
        - id: b3
          label: both
        - id: b4
          label: nobody
      items:
        - label: '"2 + 2 = 4."'
          bucket: b1
        - label: '"I am honest and 2 + 2 = 5."'
          bucket: b2
        - label: '"I am honest."'
          bucket: b3
        - label: '"I am a liar."'
          bucket: b4
        - label: '"I am a liar or 2 + 2 = 4."'
          bucket: b1
    hints:
      - "For each sentence check: is it true or false when an honest person says it? And a liar?"
      - An "and" is false as soon as one part is false. An "or" is true as soon as one part is true.
    explanation: Honest people say only true things, liars only false ones. "I am honest and 2 + 2 = 5" is always false, so only liars can say it. "… or 2 + 2 = 4" is always true, so only honest people can.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "An islander says: “I am a liar.” What follows?"
    params:
      options:
        - label: Nobody there can say that – the sentence would be neither true nor a lie
          correct: true
        - label: He is a liar
          feedback: Then he would have told the truth – liars never do.
        - label: He is truthful
          feedback: Then his statement would be false – truth-tellers never lie.
    hints:
      - Check both cases.
    explanation: "The **liar paradox**: sentences that talk about themselves can break logic. Gödel’s famous proof builds on this."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: 'A says: "If I am honest, then B is honest." What are A and B?'
    params:
      options:
        - label: Both are honest.
          correct: true
        - label: A is a liar.
          feedback: If A is a liar, the if-part is false, which makes the sentence true. But a liar never says something true.
        - label: A is honest, B is a liar.
          feedback: Then the if-part is true and the then-part false – the sentence would be a lie.
    hints:
      - An "if … then …" with a false if-part is always true. What does that mean for a liar A?
      - A must be honest. Then the if-part is true – what must hold?
    explanation: "Formally: A says S exactly when A is honest and S is true, or A lies and S is false. A liar would be saying something true here. So A is honest, and then B must be honest too."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how to solve an honest–liar puzzle by making an assumption.
    params:
      keywords:
        - - annehmen
          - angenommen
          - annahme
          - assume
          - suppose
          - assumption
        - - widerspruch
          - passt nicht
          - contradiction
          - does not fit
        - - falsch
          - gegenteil
          - wrong
          - opposite
          - other
      sample: I assume one person is honest and check every statement. If that leads to a contradiction, the assumption was wrong, so that person is a liar.
    difficulty: 3
