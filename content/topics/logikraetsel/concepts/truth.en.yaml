# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.truth
type: concept
title: Truth-Tellers and Liars
summary: Assume something and check whether it leads to a contradiction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.truth]
estimated_minutes: 8
steps:
  - kind: problem
    id: ich-luege
    widget: choice
    body: On the island of Truthland, there are truth-tellers and liars. Truth-tellers always tell the truth. Liars always lie. Someone says "I am a liar."
    prompt: Can this happen on Truthland?
    params:
      options:
        - label: No, nobody there says that.
          correct: true
        - label: Yes, then it is a liar.
          feedback: A liar lies. So a liar would claim to be a truth-teller.
        - label: Yes, then it is a truth-teller.
          feedback: A truth-teller tells the truth, so they wouldn't claim to be a liar.
    hints:
      - Try both cases. What would a truth-teller say? What would a liar say?
    explanation: For a truth-teller, the sentence would be a lie. For a liar, it would be the truth. Neither works.

  - kind: explain
    id: s2
    body: |
      A trick for puzzles like these: assume someone is a truth-teller. Then check whether everything fits.
      If there is a contradiction, the assumption was wrong.

  - kind: problem
    id: ina
    widget: choice
    body: Ina says "Jo and I are both liars."
    prompt: What is Ina?
    params:
      options:
        - label: Liar
          correct: true
        - label: Truth-teller
          feedback: If Ina were a truth-teller, her sentence would be true. But then she would be a liar. Contradiction!
    hints:
      - Assume Ina is a truth-teller. What follows from her sentence?
    explanation: Ina can't be a truth-teller, since that leads to a contradiction. So she lies.

  - kind: problem
    id: jo
    widget: choice
    body: Ina says "Jo and I are both liars." You now know that Ina lies.
    prompt: What is Jo?
    params:
      options:
        - label: Truth-teller
          correct: true
        - label: Liar
          feedback: Then both would be liars, and Ina's sentence would be true. But Ina lies!
    hints:
      - Ina's sentence is false. What is the opposite of "both are liars"?
    explanation: Ina's sentence is a lie. So they are not both liars, and Jo must be a truth-teller.
    difficulty: 2

  - kind: problem
    id: kai-lu
    widget: choice
    body: Kai says "Lu is a truth-teller." Lu says "Kai and I are different."
    prompt: What are the two?
    params:
      options:
        - label: Both are liars.
          correct: true
        - label: Both are truth-tellers.
          feedback: Then Lu's sentence would be true, but both would be the same. Contradiction!
        - label: Kai is a truth-teller, Lu lies.
          feedback: If Kai is a truth-teller, his sentence is true, so Lu would be a truth-teller.
        - label: Kai lies, Lu is a truth-teller.
          feedback: Then Kai's sentence "Lu is a truth-teller" would be true. But Kai always lies.
    hints:
      - Assume Kai is a truth-teller. What follows for Lu? Does Lu's sentence fit?
      - Kai is not a truth-teller. What does that mean for his sentence about Lu?
    explanation: Kai lies, so Lu is not a truth-teller. Lu's sentence "we are different" is a lie, so both lie.
    difficulty: 3

  - kind: problem
    id: was-sagt-schwindler
    widget: choice
    prompt: Which sentences could a liar say? Choose all that apply.
    params:
      multiple: true
      options:
        - label: '"I am a truth-teller."'
          correct: true
        - label: '"2 + 2 = 5"'
          correct: true
        - label: '"I am a liar."'
          feedback: From a liar's mouth, this sentence would be true. Liars never tell the truth.
        - label: '"A year has 12 months."'
          feedback: That is true, and a liar wouldn't say it.
    hints:
      - A liar only says sentences that are false.
    explanation: A liar only says false things. "I am a truth-teller" and "2 + 2 = 5" are false coming from a liar.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "On the island liars always lie, truth-tellers never. A says: “B is a liar.” B says: “We are both of the same type.” What is A?"
    params:
      options:
        - label: A truth-teller
          correct: true
        - label: A liar
          feedback: Then B would be truthful, and his sentence “same type” would be false – impossible.
        - label: Impossible to say
          feedback: Go through both cases for B – only one works out.
    hints:
      - If B were truthful, A would be truthful too – but A calls B a liar.
    explanation: "B must be a liar. His sentence is then a lie: the types differ – A is truthful, and A’s statement is correct."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "An islander says: “I am a liar.” What follows?"
    params:
      options:
        - label: Nobody there can say that – the sentence would be neither true nor a lie
          correct: true
        - label: He is a liar
          feedback: Then he would have told the truth – liars never do.
        - label: He is truthful
          feedback: Then his statement would be false – truth-tellers never lie.
    hints:
      - Check both cases.
    explanation: "The **liar paradox**: sentences that talk about themselves can break logic. Gödel’s famous proof builds on this."
    difficulty: 3
