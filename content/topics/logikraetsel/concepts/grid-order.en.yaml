# yaml-language-server: $schema=../../../lumen.schema.json
id: logic.puzzles.grid-order
type: concept
title: Who Is First?
summary: Build a full ranking from "faster than" and "older than."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.ordering]
estimated_minutes: 11
steps:
  - kind: problem
    id: schnecken
    widget: order
    body: Three snails race. Rosa is faster than Max. Max is faster than Fritz.
    prompt: Sort them from first to last place.
    params:
      items: [{ label: Rosa }, { label: Max }, { label: Fritz }]
      startLabel: 1st place
      endLabel: last place
    hints:
      - Who is faster than all the others?
    explanation: Rosa before Max, Max before Fritz, so Rosa, Max, Fritz.

  - kind: explain
    id: s2
    body: |
      "Faster than" defines an **order**. It carries over:
      If A is faster than B and B is faster than C, then A is faster than C.

  - kind: problem
    id: plaetze
    widget: logic-grid
    prompt: Who takes which place?
    params:
      categories:
        - { name: Child, items: [Ole, Pia, Rina] }
        - { name: Place, items: [1st place, 2nd place, 3rd place] }
      ordered: 1
      clues:
        - text: Pia was faster than Ole.
          rule: { less: [Pia, Ole] }
        - text: Ole did not finish last.
          rule: { not: [Ole, 3rd place] }
    hints:
      - Ole is not last. Can he be first if Pia was faster?
    explanation: Ole can be neither first nor last, so he is second. Pia is first and Rina third.

  - kind: problem
    id: alter
    widget: logic-grid
    prompt: How old is each child?
    params:
      categories:
        - { name: Child, items: [Tim, Una, Vera, Wim] }
        - { name: Age, items: [8 years, 9 years, 10 years, 11 years] }
      ordered: 1
      clues:
        - text: Tim is exactly one year older than Una.
          rule: { offset: [Una, Tim, 1] }
        - text: Vera is the youngest.
          rule: { is: [Vera, 8 years] }
        - text: Wim is older than Tim.
          rule: { less: [Tim, Wim] }
    hints:
      - Vera is 8. The others get 9, 10, and 11.
      - Wim is older than Tim, and Tim is older than Una. So who is 11?
    explanation: Vera 8, Una 9, Tim 10, Wim 11.
    difficulty: 2

  - kind: problem
    id: groesse
    widget: choice
    body: Ella is taller than Finn. Gabi is shorter than Finn.
    prompt: Who is the shortest?
    params:
      options:
        - label: Gabi
          correct: true
        - label: Finn
          feedback: Gabi is even shorter than Finn.
        - label: Ella
          feedback: Ella is taller than Finn, so she is the tallest.
        - label: You can't say.
          feedback: Yes, you can. Line the three up as Ella, Finn, Gabi.
    hints:
      - Order the three from tall to short.
    explanation: Ella > Finn > Gabi. Gabi is the shortest.

  - kind: problem
    id: schlange
    widget: order
    body: Ali stands before Bea. Cem stands behind Bea. Dana stands directly before Ali.
    prompt: How do the four stand in line?
    params:
      items: [{ label: Dana }, { label: Ali }, { label: Bea }, { label: Cem }]
      startLabel: front
      endLabel: back
    hints:
      - Start with Ali and Bea. Where does Dana fit?
    explanation: Dana stands directly before Ali, Ali before Bea, and Cem behind Bea.
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: If A is taller than B and B taller than C, then A is taller than C.
          right: true
        - text: If A likes B and B likes C, then A likes C too.
          right: false
          why: “Liking” does not carry over automatically.
        - text: From “A before B” and “B before C” a unique order of the three follows.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Five runners: A is ahead of B, C ahead of D, B ahead of C, E is last. In which place does C finish?"
    answer:
      value: 3
    hints:
      - "Build the chain: A, B, C, D – and E at the end."
    explanation: A, B, C, D, E – C is third.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Who finishes in which place in the race?
    params:
      categories:
        - name: Runner
          items:
            - Ali
            - Bea
            - Cem
            - Dora
        - name: Place
          items:
            - 1st
            - 2nd
            - 3rd
            - 4th
      ordered: 1
      clues:
        - text: Bea finished directly ahead of Cem.
          rule:
            offset:
              - Bea
              - Cem
              - 1
        - text: Ali finished somewhere ahead of Dora.
          rule:
            less:
              - Ali
              - Dora
        - text: Dora did not finish last.
          rule:
            not:
              - Dora
              - 4th
    hints:
      - Dora is not first (Ali is ahead of her) and not last. Which places remain?
      - Bea and Cem need two places in a row. Try Dora in 2nd and in 3rd place.
    explanation: Ali 1st, Dora 2nd, Bea 3rd, Cem 4th. With Dora in 3rd, the pair Bea–Cem would find no two neighbouring places.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: order
    prompt: Ute is taller than Tom. Tom is taller than Lia. Max is shorter than Lia but taller than Ben. Order from tallest to shortest.
    params:
      items:
        - label: Ute
        - label: Tom
        - label: Lia
        - label: Max
        - label: Ben
      startLabel: tallest
      endLabel: shortest
    hints:
      - Who is never named as the shorter one?
      - "Chain the pairs: Ute > Tom > Lia > …"
    explanation: 'Because "taller than" is transitive, four pairs make a single chain: Ute > Tom > Lia > Max > Ben.'
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Scissors beats paper, paper beats rock, rock beats scissors. Why is there no “best” choice here?
    params:
      options:
        - label: The relation is not transitive – it runs in a circle
          correct: true
        - label: Because there are only three options
          feedback: Even with three there could be a clear ranking.
        - label: Because the game is unfair
          feedback: It is perfectly balanced.
    hints:
      - Try to put the three in an order.
    explanation: An ordering needs **transitivity**. Majority votes can run in circles too – the Condorcet paradox.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Three clues: A is faster than B. B is faster than C. C is faster than A. What follows?"
    params:
      options:
        - label: At least one clue is false.
          correct: true
        - label: All three are equally fast.
          feedback: '"Faster than" rules out a tie – otherwise the first clue would already be false.'
        - label: A wins the race.
          feedback: The first two clues give A > C – but the third says C > A.
    hints:
      - What do the first two clues say about A and C?
      - Can A be both faster and slower than C?
    explanation: "A real order never has a cycle. A > B > C gives A > C, which contradicts C > A. Rock–paper–scissors is different: it is not an order at all."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: numeric
    prompt: Four runners are to be ranked using only two-person races. In the worst case, how many races do you need at least?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 6
        misconception: all-pairs
        text: Six are enough, but one fewer will do.
      - when: numval(state.input) == 3
        misconception: too-few
        text: Three races have only 2³ = 8 outcomes – but there are 24 rankings.
    hints:
      - How many rankings of 4 runners are there? Each race has 2 outcomes.
      - 2⁴ = 16 is less than 24, so 4 races are not enough.
    explanation: There are 4! = 24 rankings. k races tell apart at most 2ᵏ cases, so k ≥ 5. And 5 really are enough. This bound holds for every comparison-based sorting method.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what "transitive" means – and why it lets you build a whole order from a few clues.
    params:
      keywords:
        - - transitiv
          - weiter
          - überträgt
          - transitive
          - carries
          - also holds
        - - vor
          - schneller
          - größer
          - ahead
          - faster
          - taller
          - before
        - - kette
          - reihenfolge
          - chain
          - order
      sample: If A is ahead of B and B ahead of C, then A is ahead of C. That property is called transitive. It lets you chain pairs into one order.
    difficulty: 3
