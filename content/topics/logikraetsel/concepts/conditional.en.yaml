id: logic.puzzles.conditional
type: concept
title: If-Then
summary: What a rule really implies, and what it doesn't.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.conditional]
estimated_minutes: 8
steps:
  - kind: problem
    id: regen
    widget: choice
    body: Rule - if it rains, the street is wet. You see that the street is wet.
    prompt: Did it rain?
    params:
      options:
        - { label: Not sure, correct: true }
        - { label: "Yes, for sure", feedback: "The street can be wet for other reasons, such as a lawn sprinkler." }
        - { label: "No, definitely not", feedback: "Rain is quite possible, just not certain." }
    hints:
      - Are there other reasons for a wet street?
    explanation: The rule only says what happens when it rains. It doesn't say what happens without rain.

  - kind: explain
    id: s2
    body: |
      "If A, then B" says nothing about what happens without A.
      Only this follows for sure: if B is **false**, then A was false too.

  - kind: problem
    id: schwimmen
    widget: choice
    body: If Ali has time, he goes swimming. Today Ali did not go swimming.
    prompt: What follows for sure?
    params:
      options:
        - { label: Ali had no time, correct: true }
        - { label: Ali had time, feedback: "Then, by the rule, he would have gone swimming." }
        - { label: Nothing at all, feedback: "Yes, something does follow. If B is false, A must be false too." }
    hints:
      - If Ali had had time, what would have happened?
    explanation: With time, he would have gone swimming. He didn't, so he had no time.

  - kind: problem
    id: karten
    widget: choice
    body: Rule - a card with a vowel on the front has an even number on the back. You see the cards E, K, 4, and 7.
    prompt: Which cards must you turn over to test the rule?
    params:
      multiple: true
      layout: grid
      options:
        - { label: E, correct: true }
        - { label: "7", correct: true }
        - { label: K, feedback: "The rule says nothing about consonants." }
        - { label: "4", feedback: "Anything may be behind the 4. The rule forbids nothing." }
    hints:
      - Which card could break the rule?
      - A vowel with an odd number would break it.
    explanation: Behind E there could be an odd number, and behind 7 a vowel. Only these two can disprove the rule.
    difficulty: 3

  - kind: problem
    id: kontraposition
    widget: choice
    prompt: Which statement means the same as "If I am tired, I drink tea"?
    params:
      options:
        - { label: "If I don't drink tea, I am not tired", correct: true }
        - { label: "If I drink tea, I am tired", feedback: "That is the converse. Maybe you just like tea." }
        - { label: "If I am not tired, I don't drink tea", feedback: "The rule doesn't forbid tea in the morning." }
    hints:
      - What must hold if B doesn't happen?
    explanation: From "if A, then B" it follows that "if not B, then not A".
    difficulty: 2

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: "Rule: if it snows, it is cold. It snows. So it is cold."
          right: true
        - text: "Rule: if it snows, it is cold. It is cold. So it snows."
          right: false
          why: It can be cold without snow.
        - text: "Rule: if it snows, it is cold. It is not cold. So it does not snow."
          right: true
        - text: "Rule: if it snows, it is cold. It does not snow. So it is not cold."
          right: false
      left: Does not follow
      right: Follows for sure

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Rule in a bar: “Whoever drinks alcohol must be over 18.” Four guests: one drinks beer, one cola, one is 25, one is 16. Whom must you check?"
    params:
      options:
        - label: The beer drinker and the 16-year-old
          correct: true
        - label: The beer drinker and the 25-year-old
          feedback: The 25-year-old may drink whatever he likes.
        - label: All four
          feedback: The cola drinker and the 25-year-old cannot break the rule.
    hints:
      - Who could break the rule at all?
    explanation: The same logic as the card puzzle – but dressed in everyday terms almost everyone gets it right.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does “if it rains, the street is wet” not imply that it rained when the street is wet?"
    params:
      keywords:
        - - andere
          - anderer
          - other
          - another
          - auch
          - also
        - - grund
          - ursache
          - reason
          - cause
        - - richtung
          - umkehr
          - rückwärts
          - direction
          - reverse
          - converse
          - eine richtung
          - one way
      sample: The rule only works in one direction. The street can also be wet for another reason, such as a sprinkler – the converse does not follow.
    difficulty: 3
