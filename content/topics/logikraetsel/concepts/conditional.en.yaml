id: logic.puzzles.conditional
type: concept
title: If-Then
summary: What a rule really implies, and what it doesn't.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [logic.conditional]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The little word "if"
    body: '"If – then" hides in rules, contracts and every computer program. Yet even clever people trip over it. Uncover the cards and see where the **condition** lurks.'
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎲
            front: Game rules
            back: '"If you roll a six, you go again." Board games are full of conditions.'
          - icon: 💻
            front: In the computer
            back: 'Every program is full of "if – then": if the battery is nearly flat, the phone warns you.'
          - icon: ⚖️
            front: In the law
            back: "Laws are if-then sentences: if you drive too fast, you risk a fine."
          - icon: 🗣️
            front: In conversation
            back: In daily life, "if" often means more than the sentence strictly says in logic.

  - kind: problem
    id: start-sechs
    widget: choice
    body: "Game rule: if you roll a six, you may roll again."
    prompt: You roll a six. What follows?
    params:
      options:
        - label: You may roll again.
          correct: true
        - label: You have to miss a turn.
          feedback: The rule says nothing about that.
        - label: You cannot know.
          feedback: "You can: the condition is met, so the consequence holds too."
    hints:
      - Is the condition of the rule met?
      - The six is there. So the second part of the rule applies.
    explanation: The condition is true, so the consequence holds. This is the simplest conclusion with "if – then".

  - kind: problem
    id: start-schirm
    widget: choice
    body: "Rule: if it rains, Mia takes her umbrella. Today the sun is shining."
    prompt: May Mia take the umbrella anyway without breaking the rule?
    params:
      options:
        - label: Yes – the rule says nothing about days without rain.
          correct: true
        - label: No – without rain the umbrella is forbidden.
          feedback: The rule forbids nothing. It only says what happens when it rains.
        - label: That depends on tomorrow's weather.
          feedback: The rule only talks about rainy days – and today is not one.
    hints:
      - "What does the rule talk about: rainy days or all days?"
      - For sunny days the rule fixes nothing.
    explanation: '"If A, then B" only covers the case that A happens. Without rain anything goes – with or without an umbrella.'

  - kind: problem
    id: regen
    widget: choice
    body: Rule - if it rains, the street is wet. You see that the street is wet.
    prompt: Did it rain?
    params:
      options:
        - { label: Not sure, correct: true }
        - { label: "Yes, for sure", feedback: "The street can be wet for other reasons, such as a lawn sprinkler." }
        - { label: "No, definitely not", feedback: "Rain is quite possible, just not certain." }
    hints:
      - Are there other reasons for a wet street?
    explanation: The rule only says what happens when it rains. It doesn't say what happens without rain.

  - kind: explain
    id: s2
    body: |
      "If A, then B" says nothing about what happens without A.
      Only this follows for sure: if B is **false**, then A was false too.

  - kind: problem
    id: schwimmen
    widget: choice
    body: If Ali has time, he goes swimming. Today Ali did not go swimming.
    prompt: What follows for sure?
    params:
      options:
        - { label: Ali had no time, correct: true }
        - { label: Ali had time, feedback: "Then, by the rule, he would have gone swimming." }
        - { label: Nothing at all, feedback: "Yes, something does follow. If B is false, A must be false too." }
    hints:
      - If Ali had had time, what would have happened?
    explanation: With time, he would have gone swimming. He didn't, so he had no time.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: "Rule: “If the light is red, the car stops.” Does the observation fit?"
    params:
      buckets:
        - id: b1
          label: Fits the rule
        - id: b2
          label: Breaks the rule
      items:
        - label: Red, the car stops
          bucket: b1
        - label: Green, the car stops
          bucket: b1
        - label: Green, the car drives
          bucket: b1
        - label: Red, the car drives
          bucket: b2
    hints:
      - The rule says nothing about green.
    explanation: "Only one case breaks the rule: A holds but B does not."

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: "Rule: if it snows, it is cold. It snows. So it is cold."
          right: true
        - text: "Rule: if it snows, it is cold. It is cold. So it snows."
          right: false
          why: It can be cold without snow.
        - text: "Rule: if it snows, it is cold. It is not cold. So it does not snow."
          right: true
        - text: "Rule: if it snows, it is cold. It does not snow. So it is not cold."
          right: false
      left: Does not follow
      right: Follows for sure

  - kind: problem
    id: kontraposition
    widget: choice
    prompt: Which statement means the same as "If I am tired, I drink tea"?
    params:
      options:
        - { label: "If I don't drink tea, I am not tired", correct: true }
        - { label: "If I drink tea, I am tired", feedback: "That is the converse. Maybe you just like tea." }
        - { label: "If I am not tired, I don't drink tea", feedback: "The rule doesn't forbid tea in the morning." }
    hints:
      - What must hold if B doesn't happen?
    explanation: From "if A, then B" it follows that "if not B, then not A".
    difficulty: 2

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: If B is [[false]], then A was false too. From B alone, however, [[nothing]] follows.
      distractors:
        - "true"
        - everything

  - kind: problem
    id: karten
    depth: 2
    widget: choice
    body: Rule - a card with a vowel on the front has an even number on the back. You see the cards E, K, 4, and 7.
    prompt: Which cards must you turn over to test the rule?
    params:
      multiple: true
      layout: grid
      options:
        - { label: E, correct: true }
        - { label: "7", correct: true }
        - { label: K, feedback: "The rule says nothing about consonants." }
        - { label: "4", feedback: "Anything may be behind the 4. The rule forbids nothing." }
    hints:
      - Which card could break the rule?
      - A vowel with an odd number would break it.
    explanation: Behind E there could be an odd number, and behind 7 a vowel. Only these two can disprove the rule.
    difficulty: 3

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Rule in a bar: “Whoever drinks alcohol must be over 18.” Four guests: one drinks beer, one cola, one is 25, one is 16. Whom must you check?"
    params:
      options:
        - label: The beer drinker and the 16-year-old
          correct: true
        - label: The beer drinker and the 25-year-old
          feedback: The 25-year-old may drink whatever he likes.
        - label: All four
          feedback: The cola drinker and the 25-year-old cannot break the rule.
    hints:
      - Who could break the rule at all?
    explanation: The same logic as the card puzzle – but dressed in everyday terms almost everyone gets it right.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: 'Mum says: "You get ice cream only if you have finished your plate." What is certain?'
    params:
      options:
        - label: Whoever gets ice cream has finished the plate.
          correct: true
        - label: Whoever has finished surely gets ice cream.
          feedback: She did not promise that. "Only if" names a condition, not a guarantee.
        - label: Someone who has not finished might still get ice cream.
          feedback: That is exactly what "only if" rules out.
    hints:
      - '"B only if A" means: no A, no B.'
      - "Turn it round: if there is ice cream, then …?"
    explanation: '"B only if A" means "if B, then A". Finishing is necessary for ice cream, but not necessarily enough.'
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In "If it rains, the street is wet", rain is [[sufficient]] for a wet street. A wet street is [[necessary]] for rain.
      distractors:
        - impossible
        - random
    hints:
      - "Sufficient means: that alone is enough. Necessary means: it cannot happen without it."
    explanation: In "if A, then B", A is sufficient for B and B is necessary for A. If it rains, the street is surely wet; if it is dry, it cannot be raining.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does “if it rains, the street is wet” not imply that it rained when the street is wet?"
    params:
      keywords:
        - - andere
          - anderer
          - other
          - another
          - auch
          - also
        - - grund
          - ursache
          - reason
          - cause
        - - richtung
          - umkehr
          - rückwärts
          - direction
          - reverse
          - converse
          - eine richtung
          - one way
      sample: The rule only works in one direction. The street can also be wet for another reason, such as a sprinkler – the converse does not follow.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: 'New rule: "A card has a vowel **if and only if** its back shows an even number." You see A, K, 4 and 7. How many cards must you turn over?'
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: one-direction
        text: That is enough for a plain "if … then". But "if and only if" works in both directions.
    hints:
      - '"If and only if" means: if vowel then even – and if even then vowel.'
      - Each direction needs two cards. Do they overlap?
    explanation: For "vowel → even" you check A and 7. For "even → vowel" you check 4 and K. With an if-and-only-if rule, any card can break it.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: "Given: if A, then B. If B, then C. You learn: C is false. What follows?"
    params:
      options:
        - label: A and B are both false.
          correct: true
        - label: Only B is false; nothing is known about A.
          feedback: If B is false, the first rule gives that A is false too.
        - label: A is true.
          feedback: Then B would be true and so would C – but C is false.
    hints:
      - 'Walk the chain backwards: what does "not C" give with the second rule?'
      - Apply the same step to the first rule.
    explanation: "Two backward steps (modus tollens): not C, so not B; not B, so not A. Chains of if–then rules can be undone backwards like this."
    difficulty: 3
