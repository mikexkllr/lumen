id: math.money.inflation
type: concept
title: Inflation und Kaufkraft
summary: Was dein Geld morgen noch wert ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: kaufkraft
    widget: choice
    prompt: Die Preise steigen um 5 % im Jahr. Dein Konto bringt 2 % Zinsen. Was passiert mit deiner Kaufkraft?
    params:
      options:
        - { label: Sie sinkt., correct: true }
        - { label: Sie steigt., feedback: "Du hast zwar mehr Euro – aber alles kostet noch mehr." }
        - { label: Sie bleibt gleich., feedback: "Zins und Teuerung sind verschieden hoch." }
    hints:
      - Was wächst schneller – dein Geld oder die Preise?
    explanation: Die Preise steigen schneller als dein Guthaben. Du kannst dir weniger kaufen.

  - kind: explain
    id: s2
    body: |
      **Inflation** heißt: Dinge werden teurer.
      Bei 3 % Inflation kostet ein Einkauf für 100 € nach einem Jahr 103 €.

  - kind: problem
    id: einkauf
    widget: numeric
    prompt: Ein Einkauf kostet heute {{p}} €. Was kostet er bei {{i}} % Inflation in 2 Jahren? Runde auf Cent.
    params: { unit: "€" }
    answer: { value: "{{round(p * (1 + i / 100) ** 2, 2)}}", tolerance: 0.01 }
    feedback:
      - when: "abs(numval(state.input) - p * (1 + 2 * i / 100)) < 0.01"
        misconception: simple-interest
        text: Fast. Im zweiten Jahr steigt der schon höhere Preis.
    hints:
      - "Nimm {{p}} zweimal mal {{1 + i / 100}}."
    explanation: "{{p}} · {{1 + i / 100}}² ≈ {{round(p * (1 + i / 100) ** 2, 2)}} €."
    variants:
      params: { p: "choice[50,80,100,120]", i: "choice[2,3,4,5]" }
      defaults: { p: 100, i: 3 }

  - kind: problem
    id: realzins
    widget: numeric
    prompt: Dein Konto bringt {{z}} % Zinsen, die Inflation liegt bei {{i}} %. Wie viel Prozent Kaufkraft gewinnst du ungefähr? Minus heißt Verlust.
    params: { unit: "%" }
    answer: { value: "{{z - i}}" }
    feedback:
      - when: "numval(state.input) == i - z"
        misconception: sign
        text: Das Vorzeichen ist vertauscht. Rechne Zins minus Inflation.
    hints:
      - Faustregel – Zins minus Inflation.
    explanation: "{{z}} % − {{i}} % = {{z - i}} %. Das nennt man **Realzins**."
    variants:
      params: { z: "int[0,5]", i: "int[1,6]" }
      constraints: ["z != i"]
      defaults: { z: 2, i: 5 }

  - kind: explain
    id: s5
    body: In wie vielen Jahren halbiert sich die Kaufkraft bei 3,5 % Inflation?
    reveal:
      body: In etwa 20 Jahren. Die 70er-Regel gilt auch hier – 70 geteilt durch 3,5 ergibt 20.

  - kind: problem
    id: kredit
    widget: choice
    prompt: Jemand hat einen Kredit über 10 000 € mit festem Zins. Dann steigt die Inflation stark. Wer profitiert?
    params:
      options:
        - { label: Wer den Kredit zurückzahlt, correct: true }
        - { label: Die Bank, feedback: "Die Bank bekommt feste Euro zurück – die aber weniger wert sind." }
        - { label: Niemand, feedback: "Die Schuld bleibt gleich hoch, das Geld wird aber weniger wert." }
    hints:
      - Die 10 000 € bleiben gleich. Was ist mit ihrem Wert?
    explanation: Die feste Schuld verliert real an Wert. Das hilft dem, der zurückzahlt.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Bei 2 % Inflation kostet ein 100-€-Einkauf nächstes Jahr 102 €.
          right: true
        - text: Inflation macht Schulden schwerer.
          right: false
          why: Sie entwertet Schulden – die Summe bleibt, das Geld ist weniger wert.
        - text: Wer 3 % Zinsen bei 5 % Inflation bekommt, wird reicher.
          right: false
          why: Die Kaufkraft sinkt um etwa 2 % im Jahr.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Die Preise steigen um 3 % pro Jahr. Nach wie vielen Jahren kostet ein Einkauf von 1000 € zum ersten Mal über 1300 €?
    params:
      scene: growth
    answer:
      rate: 3
      value:
        - 1300
        - 1340
    explanation: Nach 9 Jahren. Kleine Prozente wirken über die Jahre stark.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bei 2 % Inflation: Wie viel sind 100 € in 10 Jahren noch wert? Auf ganze Euro."
    params:
      unit: €
    answer:
      value: 82
      tolerance: 1
    hints:
      - Teile 100 durch $1{,}02^{10}$ ≈ 1,219.
    explanation: "100 : 1,219 ≈ 82 €. Nicht 80 € – der Verlust wirkt jedes Jahr auf einen kleineren Rest."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Inflation misst man mit einem **Warenkorb**: Lebensmittel, Miete, Energie, Kleidung und vieles mehr. Kostet der ganze Korb 3 % mehr als vor einem Jahr, ist die Inflation 3 %."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Bei 3 % Inflation im Jahr: Wie viel sind 1000 € nach 5 Jahren in heutiger Kaufkraft noch wert? Auf ganze Euro."
    params:
      unit: €
    answer:
      value: 863
      tolerance: 1
    feedback:
      - when: numval(state.input) == 850
        misconception: linear-inflation
        text: Das ist linear gerechnet. Die Preise steigen aber jedes Jahr auf die schon gestiegenen.
    hints:
      - Teile durch den Preisfaktor $1{,}03^5$.
      - $1{,}03^5 \approx 1{,}159$.
    explanation: "1000 € : 1,159 ≈ 863 €. Du verlierst fast 14 % Kaufkraft."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Wer verliert bei hoher Inflation, wer gewinnt?
    params:
      buckets:
        - id: b1
          label: verliert
        - id: b2
          label: gewinnt
      items:
        - label: Bargeld unter der Matratze
          bucket: b1
        - label: Feste Rente ohne Anpassung
          bucket: b1
        - label: Sparbuch mit 0,5 % Zins
          bucket: b1
        - label: Kredit mit festem Zins
          bucket: b2
        - label: Staat mit hohen Schulden
          bucket: b2
    hints:
      - Wer Geld besitzt, verliert Kaufkraft.
      - Wer Geld schuldet, zahlt mit weniger wertvollem Geld zurück.
    explanation: Inflation entwertet Geld. Gläubiger verlieren, Schuldner mit festem Zins gewinnen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Zins 5 %, Inflation 3 %. Wie hoch ist der **reale** Zins genau? Auf zwei Stellen.
    params:
      unit: "%"
    answer:
      value: 1.94
      tolerance: 0.01
    hints:
      - Rechne 1,05 geteilt durch 1,03.
    explanation: 1,05 / 1,03 = 1,0194. Die Faustregel 5 − 3 = 2 ist nur eine Näherung.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: In einer Hyperinflation verdoppeln sich die Preise jeden Monat. Mit welchem Faktor sind sie nach einem Jahr gestiegen?
    answer:
      value: 4096
    feedback:
      - when: numval(state.input) == 24
        misconception: add-doublings
        text: Verdoppeln heißt mal 2 – zwölfmal hintereinander.
    hints:
      - Zwölfmal verdoppeln.
      - $2^{12} = ?$
    explanation: $2^{12} = 4096$. Ein Brot für 2 € kostet dann über 8000 €. In Deutschland 1923 war es noch viel schlimmer.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: Bei Deflation sinken die Preise. Warum fürchten Ökonomen das?
    params:
      options:
        - label: Menschen warten mit Käufen, Firmen verkaufen weniger und die Wirtschaft schrumpft
          correct: true
        - label: Weil dann alles zu billig ist
          feedback: Billig klingt gut – das Problem ist das Warten.
        - label: Weil Geld dann wertlos wird
          feedback: Bei Deflation wird Geld wertvoller.
    hints:
      - Was tust du, wenn ein Handy nächsten Monat billiger ist?
      - Wenn alle warten, verkauft niemand.
    explanation: Sinkende Preise verleiten zum Abwarten. Das kann eine Abwärtsspirale auslösen. Darum zielen Zentralbanken auf etwa 2 % Inflation.
    difficulty: 3

srs:
  cards_from: [einkauf, realzins]
