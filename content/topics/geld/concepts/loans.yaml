id: math.money.loans
type: concept
title: Raten, Kredite und Rabatte
summary: Den wahren Preis erkennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: raten
    widget: numeric
    prompt: Ein Gerät kostet {{p}} € – oder {{n}} Raten zu {{r}} €. Wie viel zahlst du mit Raten mehr?
    params: { unit: "€" }
    answer: { value: "{{n * r - p}}" }
    feedback:
      - when: "numval(state.input) == n * r"
        misconception: total-not-extra
        text: Das ist der Gesamtpreis. Gefragt ist der Aufpreis.
    hints:
      - "Rechne erst {{n}} · {{r}} aus."
    explanation: "{{n}} · {{r}} € = {{n * r}} €, also {{n * r - p}} € mehr."
    variants:
      params: { p: "choice[480,600,900]", n: "choice[12,24]" }
      derive: { r: "ceil(p * 1.15 / n)" }
      defaults: { p: 600, n: 24 }

  - kind: explain
    id: s2
    body: |
      Der **effektive Jahreszins** zeigt die wahren Kosten eines Kredits – mit allen Gebühren.
      Nur er macht Angebote vergleichbar.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Du leihst 1000 € für ein Jahr. Was ist billiger?
    params:
      options:
        - { label: B – 6 % effektiver Jahreszins, correct: true }
        - { label: A – 0 % Zins und 99 € Gebühr, feedback: "99 € auf 1000 € sind fast 10 %. Null Prozent heißt nicht kostenlos." }
        - { label: Beide gleich, feedback: "Rechne beide Kosten in Euro aus." }
    hints:
      - Wie viel Euro kostet jedes Angebot?
    explanation: B kostet rund 60 €, A kostet 99 €.

  - kind: explain
    id: s4
    body: |
      **Rabatt-Falle:** Erst plus 25 %, dann »20 % Rabatt«. Der Preis ist wieder genau gleich.
      Die Prozente beziehen sich auf verschiedene Grundwerte.

  - kind: problem
    id: rabatt
    widget: numeric
    prompt: Ein Shop erhöht {{p}} € um 25 % und gibt dann 20 % Rabatt. Was kostet es jetzt?
    params: { unit: "€" }
    answer: { value: "{{p}}" }
    feedback:
      - when: "numval(state.input) == p * 1.05"
        misconception: add-percents
        text: Die 20 % beziehen sich auf den erhöhten Preis.
    hints:
      - "Erst {{p}} · 1,25 rechnen, dann mal 0,8."
    explanation: "{{p}} · 1,25 · 0,8 = {{p}} €. Der »Rabatt« macht nur die Erhöhung rückgängig."
    variants:
      params: { p: "choice[40,80,120,200]" }
      defaults: { p: 80 }

  - kind: problem
    id: tilgung
    widget: numeric
    prompt: Du leihst dir {{s}} € ohne Zinsen und zahlst {{r}} € im Monat zurück. Wie viele Monate dauert es?
    params: { unit: Monate }
    answer: { value: "{{s / r}}" }
    hints:
      - "Wie oft passt {{r}} in {{s}}?"
    explanation: "{{s}} : {{r}} = {{s / r}} Monate."
    variants:
      params: { s: "choice[900,1200,1500,1800]", r: "choice[50,75,100]" }
      defaults: { s: 1200, r: 75 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Der effektive Jahreszins enthält auch Gebühren.
          right: true
        - text: »0 % Finanzierung« ist immer kostenlos.
          right: false
          why: Oft stecken Gebühren, Versicherungen oder ein höherer Preis dahinter.
        - text: +25 % und dann −25 % ergibt den alten Preis.
          right: false
          why: 1,25 · 0,75 = 0,9375 – billiger als vorher.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du überziehst dein Konto einen Monat um 600 € bei 12 % Zinsen pro Jahr. Wie viel Zinsen zahlst du?
    params:
      unit: €
    answer:
      value: 6
    hints:
      - 12 % im Jahr sind 1 % im Monat.
    explanation: 1 % von 600 € sind 6 €.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Bei einem **Ratenkredit** zahlst du jeden Monat dieselbe Rate. Darin stecken Zinsen und Tilgung. Am Anfang ist der Zinsanteil groß, am Ende fast null.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Du hast {{s}} € Schulden zu {{p}} % Zins pro Jahr. Wie viel Zinsen fallen in einem Monat an?
    params:
      unit: €
    answer:
      value: "{{s * p / 1200}}"
    feedback:
      - when: numval(state.input) == s * p / 100
        misconception: year-not-month
        text: Das ist der Zins für ein ganzes Jahr. Ein Monat ist ein Zwölftel.
    hints:
      - "Jahreszins: {{s * p / 100}} €."
      - Durch 12.
    explanation: "{{s}} € · {{p}} % : 12 = {{s * p / 1200}} €."
    difficulty: 2
    variants:
      params:
        s: step[1200,6000,1200]
        p: choice[6,12]
      defaults:
        s: 2400
        p: 6

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Kredit 2000 €, Zins 6 % pro Jahr, Rate 100 € im Monat. Wie viel der ersten Rate tilgt die Schuld wirklich?
    params:
      unit: €
    answer:
      value: 90
    feedback:
      - when: numval(state.input) == 100
        misconception: all-repayment
        text: Ein Teil der Rate sind Zinsen. Zieh sie ab.
    hints:
      - "Zins im ersten Monat: 2000 € · 6 % : 12."
      - 100 € − 10 € = ?
    explanation: 10 € sind Zinsen, 90 € Tilgung. Die Restschuld sinkt auf 1910 €.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Ein Kredit von 1000 € zu 10 % wird in 2 Jahren getilgt: Jedes Jahr zahlst du 500 € plus die Zinsen auf die Restschuld. Wie viel Zinsen insgesamt?"
    params:
      unit: €
    answer:
      value: 150
    hints:
      - Im ersten Jahr schuldest du 1000 €, im zweiten nur noch 500 €.
    explanation: 100 € + 50 € = 150 €. Wer schneller tilgt, zahlt weniger Zinsen.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Eine Kreditkartenschuld wächst mit 18 % pro Jahr, du zahlst nichts. Nach wie vielen Jahren hat sie sich etwa verdoppelt? Nutze die 72er-Regel.
    params:
      unit: Jahre
    answer:
      value: 4
    hints:
      - 72 geteilt durch den Zinssatz.
      - "72 : 18 = ?"
    explanation: "72 : 18 = 4 Jahre. Genau: $1{,}18^4 \\approx 1{,}94$. Schulden wachsen genauso exponentiell wie Guthaben."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Faustregel für Kreditkosten: Durchschnittsschuld · Zins · Zeit. 1200 € werden in 12 Monaten getilgt, im Schnitt schuldest du 600 €. Bei 1 % pro Monat – etwa wie viel Zinsen?"
    params:
      unit: €
    answer:
      value: 72
      tolerance: 5
    feedback:
      - when: numval(state.input) == 144
        misconception: full-debt
        text: Du hast mit der vollen Schuld gerechnet. Sie sinkt aber jeden Monat.
    hints:
      - 600 € · 1 % = 6 € pro Monat.
      - 6 € · 12 = ?
    explanation: Etwa 72 €. Tilgt man jeden Monat 100 € und zahlt Zins auf den Rest, sind es genau 78 € – die Faustregel liegt nah dran.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man Kredite am effektiven Jahreszins vergleicht.
    params:
      keywords:
        - - gebühr
          - kosten
          - fee
          - cost
          - charges
        - - vergleich
          - compare
          - gleich
          - same
        - - jahr
          - year
          - effektiv
          - effective
          - apr
      sample: Der effektive Jahreszins rechnet alle Kosten ein, auch Gebühren. Er rechnet sie auf ein Jahr um. So kann man verschiedene Angebote fair vergleichen.
    explanation: "Kernidee: Nur eine Zahl, die alle Kosten auf dieselbe Zeit umrechnet, ist vergleichbar."
    difficulty: 3

srs:
  cards_from: [raten, rabatt]
