id: math.money.lab
type: concept
title: Money Lab
summary: Compound interest, savings plans, and discounts you can play with.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: zinseszins
    widget: chart
    prompt: An amount grows 50% every year. Set the bar for year 2.
    params:
      labels: [Start, Year 1, Year 2]
      values: [100, 150, 100]
      editable: [2]
      min: 0
      max: 300
      step: 25
      unit: "€"
    answer: { values: [100, 150, 225] }
    feedback:
      - when: "values[2] == 200"
        misconception: simple-interest
        text: The 50% applies to the new balance of €150 – not just the first €100.
    hints:
      - Half of €150 gets added.
    explanation: 150 + 75 = €225. Interest on interest – that is why the bar grows ever faster.

  - kind: problem
    id: sparrate
    widget: slider
    prompt: You want to save €1200 in 12 months. Set the monthly savings rate.
    params:
      expr: "r*x"
      x: [0, 12]
      y: [0, 1500]
      showCoordinates: false
      sliders: [{ id: r, label: "Savings rate (€)", min: 25, max: 200, step: 25, initial: 50 }]
      markers:
        - { x: 12, y: 1200, group: a }
    check: { predicate: "r == 100" }
    hints:
      - The line should hit the point after 12 months.
    explanation: "€1200 ÷ 12 = €100 per month."

  - kind: problem
    id: kosten
    widget: buckets
    prompt: Fixed costs or variable costs?
    params:
      buckets: [{ label: fixed }, { label: variable }]
      items:
        - { label: Rent, bucket: fixed }
        - { label: Phone contract, bucket: fixed }
        - { label: Insurance, bucket: fixed }
        - { label: Groceries, bucket: variable }
        - { label: Movies, bucket: variable }
        - { label: Gas, bucket: variable }
    hints:
      - Is the amount the same every month?
    explanation: When saving, you usually start with the variable costs.

  - kind: problem
    id: rabatt
    widget: tiles
    prompt: Build the calculation for 25% off €80.
    params:
      tiles: ["80", "·", "0.75", "0.25", "=", "60", "20"]
    answer:
      sequence: ["80", "·", "0.75", "=", "60"]
      anyOf: [["0.75", "·", "80", "=", "60"]]
    hints:
      - After 25% off, you still pay 75%.
    explanation: €80 · 0.75 = €60. With the factor, you calculate in one step.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "At 10% growth a year: after how many years is the exponential value **three times** the start (factor 2.9 to 3.2)?"
    params:
      scene: growth
      controls:
        rate:
          value: 10
          fixed: true
        years:
          value: 2
      show:
        - value
        - linear
        - factor
    answer:
      factor:
        - 2.9
        - 3.2
    explanation: "After 12 years: $1.1^{12} ≈ 3.14$. Linearly it would be only 2.2."
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: chart
    prompt: "Simple interest: €1000 at 10 %, interest is paid out and collected. Set the total for years 1 to 3."
    params:
      labels:
        - Year 1
        - Year 2
        - Year 3
      values:
        - 1000
        - 1000
        - 1000
      editable:
        - 0
        - 1
        - 2
      min: 900
      max: 1500
      step: 50
      unit: €
    answer:
      values:
        - 1100
        - 1200
        - 1300
    hints:
      - Every year you get 10 % of €1000.
      - Always €100 more.
    explanation: 1100, 1200, 1300 – equal steps. With compounding it would be 1100, 1210, 1331.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: sim
    prompt: Set rate and time so that €1000 grows to at least €5000 – within 20 years at most.
    params:
      scene: growth
    answer:
      years:
        - 1
        - 20
      value:
        - 5000
        - 100000
    hints:
      - Five times in 20 years needs a high rate.
      - Try 9 % or more.
    explanation: At 9 % and 20 years it is just over €5600. At 6 % it would only be €3200.
    difficulty: 2

  - kind: problem
    id: ma-x1
    depth: 3
    widget: choice
    prompt: If someone had invested one cent at 5 % compound interest in year 0 – how much would it be after 2000 years?
    params:
      options:
        - label: Far too little – 2000 years mean far more than 30 doublings.
          feedback: Viel zu wenig – 2000 Jahre sind über 30 Verdopplungen … und noch viel mehr.
        - label: Still far too little.
          feedback: Immer noch viel zu wenig.
        - label: More than billions of Earth-sized balls of pure gold
          correct: true
    hints:
      - At 5 % money doubles about every 14 years.
      - "2000 : 14 ≈ 140 doublings."
    explanation: $0.01 \cdot 1.05^{2000} \approx €2 \cdot 10^{40}$. This thought experiment is known as »Joseph’s penny«.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: No account and no economy grows at 5 % for 2000 years. **Compound interest** is a model, not a law of nature. Exponential growth always hits limits sooner or later.

srs:
  cards_from: [zinseszins, rabatt]
