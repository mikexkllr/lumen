id: math.money.inflation
type: concept
title: Inflation and Purchasing Power
summary: What your money will still be worth tomorrow.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: kaufkraft
    widget: choice
    prompt: Prices rise 5% a year. Your account pays 2% interest. What happens to your purchasing power?
    params:
      options:
        - { label: It falls., correct: true }
        - { label: It rises., feedback: "You do have more euros – but everything costs even more." }
        - { label: It stays the same., feedback: "Interest and price increases are different amounts." }
    hints:
      - What grows faster – your money or prices?
    explanation: Prices rise faster than your balance. You can buy less.

  - kind: explain
    id: s2
    body: |
      **Inflation** means things get more expensive.
      With 3% inflation, a €100 shopping trip costs €103 after one year.

  - kind: problem
    id: einkauf
    widget: numeric
    prompt: A shopping trip costs €{{p}} today. What will it cost in 2 years at {{i}}% inflation? Round to the cent.
    params: { unit: "€" }
    answer: { value: "{{round(p * (1 + i / 100) ** 2, 2)}}", tolerance: 0.01 }
    feedback:
      - when: "abs(numval(state.input) - p * (1 + 2 * i / 100)) < 0.01"
        misconception: simple-interest
        text: Close. In the second year, the already higher price rises again.
    hints:
      - "Multiply {{p}} by {{1 + i / 100}} twice."
    explanation: "{{p}} · {{1 + i / 100}}² ≈ €{{round(p * (1 + i / 100) ** 2, 2)}}."
    variants:
      params: { p: "choice[50,80,100,120]", i: "choice[2,3,4,5]" }
      defaults: { p: 100, i: 3 }

  - kind: problem
    id: realzins
    widget: numeric
    prompt: Your account pays {{z}}% interest, and inflation is {{i}}%. By roughly what percent does your purchasing power change? Minus means a loss.
    params: { unit: "%" }
    answer: { value: "{{z - i}}" }
    feedback:
      - when: "numval(state.input) == i - z"
        misconception: sign
        text: The sign is flipped. Calculate interest minus inflation.
    hints:
      - "Rule of thumb: interest minus inflation."
    explanation: "{{z}}% − {{i}}% = {{z - i}}%. This is called the **real interest rate**."
    variants:
      params: { z: "int[0,5]", i: "int[1,6]" }
      constraints: ["z != i"]
      defaults: { z: 2, i: 5 }

  - kind: explain
    id: s5
    body: In how many years does purchasing power halve at 3.5% inflation?
    reveal:
      body: In about 20 years. The rule of 70 applies here too – 70 divided by 3.5 is 20.

  - kind: problem
    id: kredit
    widget: choice
    prompt: Someone has a €10,000 loan with a fixed rate. Then inflation rises sharply. Who benefits?
    params:
      options:
        - { label: The person repaying the loan, correct: true }
        - { label: The bank, feedback: "The bank gets back fixed euros – but they are worth less." }
        - { label: Nobody, feedback: "The debt stays the same size, but the money is worth less." }
    hints:
      - The €10,000 stays the same. What about its value?
    explanation: The fixed debt loses value in real terms. That helps the person repaying it.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: At 2% inflation a €100 shop costs €102 next year.
          right: true
        - text: Inflation makes debts heavier.
          right: false
          why: It devalues debts – the sum stays, the money is worth less.
        - text: Earning 3% interest at 5% inflation makes you richer.
          right: false
          why: Purchasing power falls by about 2% a year.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Prices rise by 3% a year. After how many years does a 1000 € purchase cost over 1300 € for the first time?
    params:
      scene: growth
    answer:
      rate: 3
      value:
        - 1300
        - 1340
    explanation: After 9 years. Small percentages have a strong effect over the years.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "At 2% inflation: how much are €100 still worth in 10 years? To whole euros."
    params:
      unit: €
    answer:
      value: 82
      tolerance: 1
    hints:
      - Divide 100 by $1.02^{10}$ ≈ 1.219.
    explanation: 100 ÷ 1.219 ≈ €82. Not €80 – each year the loss acts on a smaller remainder.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Inflation is measured with a **basket of goods**: food, rent, energy, clothes and much more. If the whole basket costs 3 % more than a year ago, inflation is 3 %."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "At 3 % inflation a year: what are €1000 worth in today’s money after 5 years? To the whole euro."
    params:
      unit: €
    answer:
      value: 863
      tolerance: 1
    feedback:
      - when: numval(state.input) == 850
        misconception: linear-inflation
        text: That is linear. But prices rise on top of the already risen ones each year.
    hints:
      - Divide by the price factor $1.03^5$.
      - $1.03^5 \approx 1.159$.
    explanation: "€1000 : 1.159 ≈ €863. You lose almost 14 % of purchasing power."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Who loses with high inflation, and who wins?
    params:
      buckets:
        - id: b1
          label: loses
        - id: b2
          label: wins
      items:
        - label: Cash under the mattress
          bucket: b1
        - label: Fixed pension, never adjusted
          bucket: b1
        - label: Savings book at 0.5 %
          bucket: b1
        - label: Loan at a fixed rate
          bucket: b2
        - label: State with high debts
          bucket: b2
    hints:
      - Whoever owns money loses purchasing power.
      - Whoever owes money pays back with less valuable money.
    explanation: Inflation devalues money. Lenders lose, borrowers with a fixed rate win.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Interest 5%, inflation 3%. What exactly is the **real** interest rate? To two places.
    params:
      unit: "%"
    answer:
      value: 1.94
      tolerance: 0.01
    hints:
      - Compute 1.05 divided by 1.03.
    explanation: 1.05 / 1.03 = 1.0194. The rule of thumb 5 − 3 = 2 is only an approximation.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: In hyperinflation, prices double every month. By what factor have they risen after one year?
    answer:
      value: 4096
    feedback:
      - when: numval(state.input) == 24
        misconception: add-doublings
        text: Doubling means times 2 – twelve times in a row.
    hints:
      - Double twelve times.
      - $2^{12} = ?$
    explanation: $2^{12} = 4096$. A €2 loaf then costs over €8000. In Germany in 1923 it was far worse.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: In deflation, prices fall. Why do economists fear it?
    params:
      options:
        - label: People delay purchases, firms sell less and the economy shrinks
          correct: true
        - label: Cheap sounds good – the problem is the waiting.
          feedback: Billig klingt gut – das Problem ist das Warten.
        - label: In deflation money gains value.
          feedback: Bei Deflation wird Geld wertvoller.
    hints:
      - What do you do if a phone will be cheaper next month?
      - If everyone waits, nobody sells.
    explanation: Falling prices tempt people to wait. That can trigger a downward spiral. So central banks aim for about 2 % inflation.
    difficulty: 3

srs:
  cards_from: [einkauf, realzins]
