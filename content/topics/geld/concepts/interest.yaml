id: math.money.interest
type: concept
title: Zinsen und Zinseszins
summary: Wenn Zinsen selbst Zinsen bringen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Du legst 1000 € zu 7 % Zinseszins an. Wie viel ist nach 40 Jahren da?"
    params:
      min: 1000
      max: 30000
      unit: €
    answer:
      value: 14974
      tolerance: 2500
    explanation: Fast 15 000 € – das Fünfzehnfache. Ohne Zinseszins wären es nur 3800 €.

  - kind: problem
    id: ein-jahr
    widget: numeric
    prompt: Du legst {{k}} € zu {{p}} % Zinsen im Jahr an. Wie viel Zinsen bekommst du nach einem Jahr?
    params: { unit: "€" }
    answer: { value: "{{k * p / 100}}" }
    feedback:
      - when: "numval(state.input) == k + k * p / 100"
        misconception: total-not-interest
        text: Das ist das ganze Guthaben. Gefragt sind nur die Zinsen.
    hints:
      - "{{p}} % von {{k}} € – also {{k}} · {{p}} / 100."
    explanation: "{{p}} % von {{k}} € sind {{k * p / 100}} €."
    variants:
      params: { k: "choice[500,1000,2000,5000]", p: "choice[2,3,4,5]" }
      defaults: { k: 1000, p: 3 }

  - kind: explain
    id: s2
    body: |
      **Zinseszins** – die Zinsen bleiben auf dem Konto und werden mitverzinst.
      Nach n Jahren hat man $K \cdot (1 + p/100)^n$.

  - kind: problem
    id: zwei-jahre
    widget: numeric
    prompt: 1000 € liegen 2 Jahre lang bei 10 % Zinsen. Die Zinsen bleiben drauf. Wie viel hast du am Ende?
    params: { unit: "€" }
    answer: { value: 1210 }
    feedback:
      - when: "numval(state.input) == 1200"
        misconception: simple-interest
        text: Das wäre ohne Zinseszins. Im zweiten Jahr gibt es 10 % auf 1100 €.
    hints:
      - "Jahr 1: 1000 € + 100 €. Jahr 2: 10 % auf das neue Guthaben."
    explanation: 1100 € + 110 € = 1210 €.

  - kind: problem
    id: n-jahre
    widget: numeric
    prompt: Wie viel werden {{k}} € nach {{n}} Jahren bei {{p}} % Zinseszins? Runde auf ganze Euro.
    params: { unit: "€" }
    answer: { value: "{{round(k * (1 + p / 100) ** n)}}", tolerance: 1 }
    feedback:
      - when: "abs(numval(state.input) - (k + k * p / 100 * n)) < 1 && n > 1"
        misconception: simple-interest
        text: Das ist ohne Zinseszins gerechnet. Nimm den Faktor {{1 + p / 100}} insgesamt {{n}}-mal.
    hints:
      - "Rechne {{k}} · {{1 + p / 100}} hoch {{n}}."
    explanation: "{{k}} · {{1 + p / 100}}^{{n}} ≈ {{round(k * (1 + p / 100) ** n)}} €."
    variants:
      params: { k: "choice[1000,2000,5000]", p: "choice[2,4,5]", n: "choice[2,3]" }
      defaults: { k: 2000, p: 5, n: 3 }

  - kind: explain
    id: s5
    body: Zwei Menschen legen monatlich 100 € zu 5 % an. Eine beginnt mit 25, einer mit 35. Was haben sie mit 65?
    reveal:
      body: Die Frühstarterin hat rund 148 000 €, der Spätstarter rund 82 000 €. Sie hat nur 12 000 € mehr eingezahlt. Der Rest ist Zinseszins.

  - kind: problem
    id: frueh
    widget: choice
    prompt: Was bringt beim Zinseszins am meisten?
    params:
      options:
        - { label: Früh anfangen, correct: true }
        - { label: Oft das Konto wechseln, feedback: "Das bringt selten viel. Entscheidend ist die Zeit." }
        - { label: Zinsen jedes Jahr abheben, feedback: "Dann fehlt genau der Zinseszins." }
    hints:
      - Was steht beim Zinseszins im Exponenten?
    explanation: Die Zeit steht im Exponenten. Jedes Jahr mehr wirkt wie ein weiterer Faktor.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Finde einen Zinssatz und eine Laufzeit, bei denen sich das Geld ungefähr **verdoppelt** (Faktor 1,95 bis 2,05).
    params:
      scene: growth
      show:
        - value
        - factor
    answer:
      factor:
        - 1.95
        - 2.05
    explanation: "Zum Beispiel 7 % und 10 Jahre. Die **72er-Regel**: 72 geteilt durch den Zinssatz ergibt die Verdopplungszeit."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Nutze die 72er-Regel: In wie vielen Jahren verdoppelt sich Geld bei 6 % Zins?"
    answer:
      value: 12
    hints:
      - 72 geteilt durch den Zinssatz.
    explanation: "72 : 6 = 12 Jahre. Genau gerechnet sind es 11,9."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Bei **einfachen Zinsen** kommt jedes Jahr derselbe Betrag dazu. Das Konto wächst wie eine Treppe mit gleichen Stufen. Beim Zinseszins werden die Stufen jedes Jahr höher.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "{{k}} € liegen {{n}} Jahre zu {{p}} % einfachen Zinsen. Die Zinsen werden jedes Jahr ausgezahlt. Wie viel Zinsen sind es insgesamt?"
    params:
      unit: €
    answer:
      value: "{{k * p * n / 100}}"
    hints:
      - Ein Jahr bringt {{k * p / 100}} €.
      - Mal {{n}} Jahre.
    explanation: "{{k * p / 100}} € · {{n}} = {{k * p * n / 100}} €. Ohne Zinseszins wächst das Geld linear."
    difficulty: 2
    variants:
      params:
        k: step[500,5000,500]
        p: choice[2,3,4,5]
        n: int[2,10]
      defaults:
        k: 2000
        p: 3
        n: 5

  - kind: problem
    id: ma-d3
    depth: 2
    widget: sim
    prompt: "Bei 10 %: Nach wie vielen Jahren liegt der Zinseszins zum ersten Mal mindestens 1000 € über den einfachen Zinsen? Start 1000 €."
    params:
      scene: growth
    answer:
      rate: 10
      years: 13
    hints:
      - Stell 10 % ein und vergleiche »Exponentiell« mit »Linear«.
      - Nach 12 Jahren fehlt noch ein Stück.
    explanation: "Nach 13 Jahren: 3452 € gegen 2300 €. Am Anfang ist der Unterschied winzig – dann explodiert er."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Woher kommt die 72 in der 72er-Regel?
    params:
      options:
        - label: Aus ln 2 ≈ 0,693 – aufgerundet auf eine Zahl mit vielen Teilern
          correct: true
        - label: Aus den 72 Monaten eines Kredits
          feedback: Die Regel gilt für jede Laufzeit.
        - label: Sie ist reiner Zufall
          feedback: Sie folgt aus der Gleichung (1 + p/100)ⁿ = 2.
    hints:
      - Löse $(1 + p/100)^n = 2$ mit dem Logarithmus nach n.
    explanation: n = ln 2 / ln(1 + p/100) ≈ 69,3 / p. Die 72 gleicht den Fehler für übliche Zinssätze aus.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: 100 % Zins im Jahr verdoppelt 1 €. Was wird aus 1 €, wenn es zweimal im Jahr 50 % gibt?
    params:
      unit: €
    answer:
      value: 2.25
    feedback:
      - when: numval(state.input) == 2
        misconception: no-compounding
        text: Die zweiten 50 % gibt es auch auf die ersten Zinsen.
    hints:
      - "Nach einem halben Jahr: 1,50 €."
      - 1,50 € · 1,5 = ?
    explanation: $1{,}5^2 = 2{,}25$. Öfter verzinsen bringt mehr.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "12 % Zins im Jahr, aber monatlich verzinst: Jeden Monat gibt es 1 %. Was wird aus 100 € nach einem Jahr? Auf Cent."
    params:
      unit: €
    answer:
      value: 112.68
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 112
        misconception: simple-interest
        text: Das wäre ohne Zinseszins. Zwölfmal mal 1,01!
    hints:
      - Zwölfmal mal 1,01.
      - $100 \cdot 1{,}01^{12}$
    explanation: $100 \cdot 1{,}01^{12} \approx 112{,}68$ €. Der effektive Jahreszins ist 12,68 % statt 12 %.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: Verzinst man immer öfter – täglich, stündlich, jede Sekunde –, wächst 1 € bei 100 % nicht ins Unendliche. Er nähert sich der **eulerschen Zahl** e ≈ 2,718.

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum früh anfangen beim Sparen mit Zinseszins so viel bringt.
    params:
      keywords:
        - - zinsen auf zinsen
          - zinseszins
          - mitverzinst
          - interest on interest
          - compound
        - - zeit
          - jahre
          - länger
          - time
          - years
          - longer
        - - wächst
          - exponentiell
          - schneller
          - grows
          - exponential
          - faster
      sample: Beim Zinseszins bekommt man Zinsen auf Zinsen. Je mehr Jahre das Geld liegt, desto schneller wächst es, denn der Zuwachs wird jedes Jahr größer. Die letzten Jahre bringen am meisten.
    explanation: "Kernidee: Exponentielles Wachstum belohnt Zeit – die späten Jahre bringen den größten Zuwachs."
    difficulty: 3

srs:
  cards_from: [ein-jahr, zwei-jahre]
