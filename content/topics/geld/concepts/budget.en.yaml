id: math.money.budget
type: concept
title: Your Own Budget
summary: Percentages of income.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: anteil
    widget: numeric
    prompt: Of your net income of €{{e}}, €{{m}} goes to rent. What percent is that?
    params: { unit: "%" }
    answer: { value: "{{100 * m / e}}" }
    hints:
      - "{{m}} divided by {{e}}, times 100."
    explanation: "{{m}} ÷ {{e}} = {{m / e}} – so {{100 * m / e}}%."
    variants:
      params: { e: "choice[2000,2500,3000]", m: "choice[500,750,1000]" }
      defaults: { e: 2500, m: 750 }

  - kind: explain
    id: s2
    body: |
      A well-known **rule of thumb** is **50-30-20**. 50% for fixed costs, 30% for wants, 20% for savings.
      It is not a law – but it is a good starting point.

  - kind: problem
    id: sparen
    widget: numeric
    prompt: By the 50-30-20 rule, how much does someone with €{{e}} a month save?
    params: { unit: "€" }
    answer: { value: "{{e * 0.2}}" }
    hints:
      - "20% is one fifth."
    explanation: "€{{e}} ÷ 5 = €{{e * 0.2}}."
    variants:
      params: { e: "step[1500,4000,500]" }
      defaults: { e: 2500 }

  - kind: problem
    id: abo
    widget: numeric
    prompt: Three subscriptions cost €9.99, €12.99, and €4.99 a month. How much is that per year? Round to whole euros.
    params: { unit: "€" }
    answer: { value: 336, tolerance: 1 }
    hints:
      - Roughly 10 + 13 + 5 = €28 a month.
    explanation: €27.97 · 12 ≈ €336. Small amounts add up.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You save €150 every month for 5 years, without interest. How much do you have at the end?
    params:
      unit: €
    answer:
      value: 9000
    hints:
      - 5 years are 60 months.
    explanation: 60 · €150 = €9000.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A €3.50 coffee every working day (220 a year). What does that cost over 10 years – without interest?
    params:
      options:
        - label: €7700
          correct: true
        - label: €770
          feedback: That is one year.
        - label: €77,000
          feedback: One zero too many.
    hints:
      - "First one year: 220 · €3.50."
    explanation: €770 a year, €7700 in ten. Small regular amounts add up.
    difficulty: 3

srs:
  cards_from: [anteil, sparen]
