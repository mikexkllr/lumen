id: math.money.interest
type: concept
title: Interest and Compound Interest
summary: When interest earns interest.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Interest on interest
    body: If you leave interest in the account, it earns interest itself. The dashed line grows by the same amount every year. Set the rate to 5% and follow the curve. When does **compound interest** pull away?
    visual:
      widget: slider
      interactive: true
      params:
        expr: 1000*(1 + p/100)^x
        x:
          - 0
          - 40
        y:
          - 0
          - 8000
        showCoordinates: false
        sliders:
          - id: p
            label: Interest (%)
            min: 1
            max: 6
            step: 1
            initial: 2
        target:
          expr: 1000 + 50*x
          label: 5% simple interest

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: you invest €1000 at 7% compound interest. How much is there after 40 years?"
    params:
      min: 1000
      max: 30000
      unit: €
    answer:
      value: 14974
      tolerance: 2500
    explanation: Almost €15,000 – fifteen times as much. Without compounding it would be only €3800.

  - kind: problem
    id: ein-jahr
    widget: numeric
    prompt: You invest €{{k}} at {{p}}% interest per year. How much interest do you get after one year?
    params: { unit: "€" }
    answer: { value: "{{k * p / 100}}" }
    feedback:
      - when: "numval(state.input) == k + k * p / 100"
        misconception: total-not-interest
        text: That is the whole balance. The question asks only for the interest.
    hints:
      - "{{p}}% of €{{k}} – that is {{k}} · {{p}} / 100."
    explanation: "{{p}}% of €{{k}} is €{{k * p / 100}}."
    variants:
      params: { k: "choice[500,1000,2000,5000]", p: "choice[2,3,4,5]" }
      defaults: { k: 1000, p: 3 }

  - kind: explain
    id: s2
    body: |
      **Compound interest** – the interest stays in the account and earns interest too.
      After n years you have $K \cdot (1 + p/100)^n$.

  - kind: problem
    id: zwei-jahre
    widget: numeric
    prompt: €1000 sits for 2 years at 10% interest. The interest stays in. How much do you have at the end?
    params: { unit: "€" }
    answer: { value: 1210 }
    feedback:
      - when: "numval(state.input) == 1200"
        misconception: simple-interest
        text: That would be without compounding. In the second year you earn 10% on €1100.
    hints:
      - "Year 1: €1000 + €100. Year 2: 10% on the new balance."
    explanation: €1100 + €110 = €1210.

  - kind: problem
    id: n-jahre
    widget: numeric
    prompt: How much will €{{k}} be after {{n}} years at {{p}}% compound interest? Round to whole euros.
    params: { unit: "€" }
    answer: { value: "{{round(k * (1 + p / 100) ** n)}}", tolerance: 1 }
    feedback:
      - when: "abs(numval(state.input) - (k + k * p / 100 * n)) < 1 && n > 1"
        misconception: simple-interest
        text: That is calculated without compounding. Use the factor {{1 + p / 100}} a total of {{n}} times.
    hints:
      - "Calculate {{k}} · {{1 + p / 100}} to the power of {{n}}."
    explanation: "{{k}} · {{1 + p / 100}}^{{n}} ≈ €{{round(k * (1 + p / 100) ** n)}}."
    variants:
      params: { k: "choice[1000,2000,5000]", p: "choice[2,4,5]", n: "choice[2,3]" }
      defaults: { k: 2000, p: 5, n: 3 }

  - kind: explain
    id: s5
    body: Two people each invest €100 a month at 5%. One starts at 25, the other at 35. What do they have at 65?
    reveal:
      body: The early starter has about €148,000, the late starter about €82,000. She paid in only €12,000 more. The rest is compound interest.

  - kind: problem
    id: frueh
    widget: choice
    prompt: What matters most for compound interest?
    params:
      options:
        - { label: Starting early, correct: true }
        - { label: Switching accounts often, feedback: "That rarely adds much. Time is what counts." }
        - { label: Withdrawing the interest every year, feedback: "Then you lose exactly the compounding." }
    hints:
      - What is in the exponent for compound interest?
    explanation: Time is in the exponent. Each extra year acts like another factor.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: Find an interest rate and a term at which the money roughly **doubles** (factor 1.95 to 2.05).
    params:
      scene: growth
      show:
        - value
        - factor
    answer:
      factor:
        - 1.95
        - 2.05
    explanation: "For example 7% and 10 years. The **rule of 72**: 72 divided by the rate gives the doubling time."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Use the rule of 72: in how many years does money double at 6% interest?"
    answer:
      value: 12
    hints:
      - 72 divided by the interest rate.
    explanation: 72 ÷ 6 = 12 years. The exact figure is 11.9.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: With **simple interest** the same amount is added every year. The account grows like a staircase with equal steps. With compound interest the steps get taller every year.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: €{{k}} is invested for {{n}} years at {{p}} % simple interest. The interest is paid out every year. How much interest is that in total?
    params:
      unit: €
    answer:
      value: "{{k * p * n / 100}}"
    hints:
      - One year brings €{{k * p / 100}}.
      - Times {{n}} years.
    explanation: €{{k * p / 100}} · {{n}} = €{{k * p * n / 100}}. Without compounding, money grows linearly.
    difficulty: 2
    variants:
      params:
        k: step[500,5000,500]
        p: choice[2,3,4,5]
        n: int[2,10]
      defaults:
        k: 2000
        p: 3
        n: 5

  - kind: problem
    id: ma-d3
    depth: 2
    widget: sim
    prompt: "At 10 %: after how many years is compound interest first at least €1000 ahead of simple interest? Start €1000."
    params:
      scene: growth
    answer:
      rate: 10
      years: 13
    hints:
      - Set 10 % and compare »Exponential« with »Linear«.
      - After 12 years it is not quite there.
    explanation: "After 13 years: €3452 against €2300. At first the gap is tiny – then it explodes."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Where does the 72 in the rule of 72 come from?
    params:
      options:
        - label: From ln 2 ≈ 0.693 – rounded up to a number with many divisors
          correct: true
        - label: From the 72 months of a loan
          feedback: The rule works for any term.
        - label: It is pure coincidence
          feedback: It follows from the equation (1 + p/100)ⁿ = 2.
    hints:
      - Solve $(1 + p/100)^n = 2$ for n with the logarithm.
    explanation: n = ln 2 / ln(1 + p/100) ≈ 69.3 / p. The 72 offsets the error for typical rates.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: 100 % interest per year doubles €1. What becomes of €1 if you get 50 % twice a year?
    params:
      unit: €
    answer:
      value: 2.25
    feedback:
      - when: numval(state.input) == 2
        misconception: no-compounding
        text: The second 50 % also applies to the first interest.
    hints:
      - "After half a year: €1.50."
      - €1.50 · 1.5 = ?
    explanation: $1.5^2 = 2.25$. Compounding more often pays more.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "12 % per year, but compounded monthly: each month you get 1 %. What do €100 become after one year? To the cent."
    params:
      unit: €
    answer:
      value: 112.68
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 112
        misconception: simple-interest
        text: That would be without compounding. Twelve times times 1.01!
    hints:
      - Twelve times times 1.01.
      - $100 \cdot 1.01^{12}$
    explanation: $100 \cdot 1.01^{12} \approx €112.68$. The effective annual rate is 12.68 % instead of 12 %.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: If you compound ever more often – daily, hourly, every second – €1 at 100 % does not grow without limit. It approaches **Euler’s number** e ≈ 2.718.

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why starting early makes such a difference with compound interest.
    params:
      keywords:
        - - zinsen auf zinsen
          - zinseszins
          - mitverzinst
          - interest on interest
          - compound
        - - zeit
          - jahre
          - länger
          - time
          - years
          - longer
        - - wächst
          - exponentiell
          - schneller
          - grows
          - exponential
          - faster
      sample: With compound interest you earn interest on interest. The more years the money sits, the faster it grows, because the growth gets bigger every year. The last years bring the most.
    explanation: "Key idea: exponential growth rewards time – the late years bring the biggest gains."
    difficulty: 3

srs:
  cards_from: [ein-jahr, zwei-jahre]
