id: math.money.budget
type: concept
title: Das eigene Budget
summary: Prozente vom Einkommen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wohin fließt dein Geld?
    body: Am Monatsende fragen sich viele, wo das Geld geblieben ist. Der Kreis ist dein Monatsgeld, jedes Stück 10 %. Färbe so viel, wie Miete und Essen kosten. Wie viel bleibt übrig? So beginnt jedes **Budget**.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 10
        shape: circle

  - kind: problem
    id: anteil
    widget: numeric
    prompt: Von {{e}} € netto gehen {{m}} € für die Miete weg. Wie viel Prozent sind das?
    params: { unit: "%" }
    answer: { value: "{{100 * m / e}}" }
    hints:
      - "{{m}} geteilt durch {{e}}, mal 100."
    explanation: "{{m}} : {{e}} = {{m / e}} – also {{100 * m / e}} %."
    variants:
      params: { e: "choice[2000,2500,3000]", m: "choice[500,750,1000]" }
      defaults: { e: 2500, m: 750 }

  - kind: explain
    id: s2
    body: |
      Eine bekannte **Faustregel** heißt **50-30-20**. 50 % für Fixkosten, 30 % für Wünsche, 20 % zum Sparen.
      Sie ist kein Gesetz – aber ein guter Startpunkt.

  - kind: problem
    id: sparen
    widget: numeric
    prompt: Nach der 50-30-20-Regel – wie viel spart jemand mit {{e}} € im Monat?
    params: { unit: "€" }
    answer: { value: "{{e * 0.2}}" }
    hints:
      - "20 % sind ein Fünftel."
    explanation: "{{e}} : 5 = {{e * 0.2}} €."
    variants:
      params: { e: "step[1500,4000,500]" }
      defaults: { e: 2500 }

  - kind: problem
    id: abo
    widget: numeric
    prompt: Drei Abos kosten 9,99 €, 12,99 € und 4,99 € im Monat. Wie viel ist das im Jahr? Runde auf Euro.
    params: { unit: "€" }
    answer: { value: 336, tolerance: 1 }
    hints:
      - Rund 10 + 13 + 5 = 28 € im Monat.
    explanation: 27,97 € · 12 ≈ 336 €. Kleine Beträge summieren sich.

  - kind: problem
    id: ma-c1
    widget: chart
    prompt: Teile 2000 € nach der 50-30-20-Regel auf. Stell die Säulen ein.
    params:
      labels:
        - Fixkosten
        - Wünsche
        - Sparen
      values:
        - 200
        - 200
        - 200
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 1200
      step: 100
      unit: €
    answer:
      values:
        - 1000
        - 600
        - 400
    hints:
      - 50 % von 2000 € sind 1000 €.
      - 10 % sind 200 €.
    explanation: 1000 € + 600 € + 400 € = 2000 €.

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Lina verdient 400 € im Monat und spart 60 €. Das Quadrat ist ihr ganzes Geld. Färbe den Sparanteil.
    params:
      parts: 20
      shape: square
    answer:
      fraction: 3/20
    hints:
      - "Ein Teil des Quadrats ist 400 € : 20 = 20 €."
      - 60 € sind 3 Teile zu je 20 €. Färbe 3 Teile.
    explanation: 60 von 400 € sind $\frac{3}{20}$, also 15 % – weniger als die 20 % der Faustregel.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du sparst 5 Jahre lang jeden Monat 150 €, ohne Zinsen. Wie viel hast du am Ende?
    params:
      unit: €
    answer:
      value: 9000
    hints:
      - 5 Jahre sind 60 Monate.
    explanation: 60 · 150 € = 9000 €.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: buckets
    prompt: Bedarf oder Wunsch?
    params:
      buckets:
        - id: b1
          label: Bedarf
        - id: b2
          label: Wunsch
      items:
        - label: Miete
          bucket: b1
        - label: Strom
          bucket: b1
        - label: Lebensmittel
          bucket: b1
        - label: Kino
          bucket: b2
        - label: Streaming-Abo
          bucket: b2
        - label: Neue Sneaker
          bucket: b2
    hints:
      - Was brauchst du, um gut zu leben?
      - Worauf könntest du einen Monat verzichten?
    explanation: Miete, Strom und Essen sind Fixkosten. Kino, Abo und Sneaker sind Wünsche – schön, aber verzichtbar.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Du bekommst 40 € im Monat und sparst davon 25 %. Nach wie vielen Monaten hast du 120 € für ein Spiel?
    params:
      unit: Monate
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 3
        misconception: all-saved
        text: "Du sparst nicht alles, nur ein Viertel: 10 € im Monat."
    hints:
      - 25 % von 40 € sind 10 €.
      - "120 € : 10 € = ?"
    explanation: 10 € pro Monat, also 12 Monate. Mit 50 % ginge es doppelt so schnell.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Kaffee für 3,50 € an jedem Arbeitstag (220 im Jahr). Was kostet das in 10 Jahren – ohne Zinsen?
    params:
      options:
        - label: 7700 €
          correct: true
        - label: 770 €
          feedback: Das ist ein Jahr.
        - label: 77 000 €
          feedback: Eine Null zu viel.
    hints:
      - "Erst ein Jahr: 220 · 3,50 €."
    explanation: 770 € im Jahr, 7700 € in zehn. Kleine regelmäßige Beträge summieren sich.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Netto 2000 €, Ausgaben 1800 €. Dann steigt das Gehalt um 10 %, die Ausgaben aber um 15 %. Wie hoch ist die Sparquote danach? In %, auf eine Stelle.
    params:
      unit: "%"
    answer:
      value: 5.9
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 10
        misconception: old-rate
        text: Das war die alte Quote. Rechne neues Gehalt minus neue Ausgaben.
    hints:
      - "Neu: 2200 € Gehalt, 2070 € Ausgaben."
      - 130 € von 2200 €.
    explanation: "130 : 2200 ≈ 5,9 %. Vorher waren es 10 %. Wachsen die Ausgaben schneller als das Gehalt, schrumpft das Sparen."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Du zahlst drei Jahre lang am Jahresanfang 1000 € ein, zu 5 % Zinseszins. Wie viel ist am Ende des dritten Jahres da? Auf Euro.
    params:
      unit: €
    answer:
      value: 3310
      tolerance: 1
    feedback:
      - when: numval(state.input) == 3000
        misconception: no-interest
        text: Jede Einzahlung bekommt Zinsen – die erste dreimal.
      - when: numval(state.input) == 3473
        misconception: all-three-years
        text: Nicht jede Einzahlung liegt drei Jahre. Die letzte nur eins.
    hints:
      - Die erste Einzahlung wächst 3 Jahre, die zweite 2, die dritte 1.
      - $1000 \cdot (1{,}05^3 + 1{,}05^2 + 1{,}05)$
    explanation: 1157,63 + 1102,50 + 1050 ≈ 3310 €. Eine Summe aus Potenzen heißt geometrische Reihe.
    difficulty: 3

srs:
  cards_from: [anteil, sparen]
