id: math.money.budget
type: concept
title: Das eigene Budget
summary: Prozente vom Einkommen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: anteil
    widget: numeric
    prompt: Von {{e}} € netto gehen {{m}} € für die Miete weg. Wie viel Prozent sind das?
    params: { unit: "%" }
    answer: { value: "{{100 * m / e}}" }
    hints:
      - "{{m}} geteilt durch {{e}}, mal 100."
    explanation: "{{m}} : {{e}} = {{m / e}} – also {{100 * m / e}} %."
    variants:
      params: { e: "choice[2000,2500,3000]", m: "choice[500,750,1000]" }
      defaults: { e: 2500, m: 750 }

  - kind: explain
    body: |
      Eine bekannte Faustregel heißt **50-30-20**. 50 % für Fixkosten, 30 % für Wünsche, 20 % zum Sparen.
      Sie ist kein Gesetz – aber ein guter Startpunkt.

  - kind: problem
    id: sparen
    widget: numeric
    prompt: Nach der 50-30-20-Regel – wie viel spart jemand mit {{e}} € im Monat?
    params: { unit: "€" }
    answer: { value: "{{e * 0.2}}" }
    hints:
      - "20 % sind ein Fünftel."
    explanation: "{{e}} : 5 = {{e * 0.2}} €."
    variants:
      params: { e: "step[1500,4000,500]" }
      defaults: { e: 2500 }

  - kind: problem
    id: abo
    widget: numeric
    prompt: Drei Abos kosten 9,99 €, 12,99 € und 4,99 € im Monat. Wie viel ist das im Jahr? Runde auf Euro.
    params: { unit: "€" }
    answer: { value: 336, tolerance: 1 }
    hints:
      - Rund 10 + 13 + 5 = 28 € im Monat.
    explanation: 27,97 € · 12 ≈ 336 €. Kleine Beträge summieren sich.

srs:
  cards_from: [anteil, sparen]
