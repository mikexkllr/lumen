id: math.money.budget
type: concept
title: Das eigene Budget
summary: Prozente vom Einkommen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: anteil
    widget: numeric
    prompt: Von {{e}} € netto gehen {{m}} € für die Miete weg. Wie viel Prozent sind das?
    params: { unit: "%" }
    answer: { value: "{{100 * m / e}}" }
    hints:
      - "{{m}} geteilt durch {{e}}, mal 100."
    explanation: "{{m}} : {{e}} = {{m / e}} – also {{100 * m / e}} %."
    variants:
      params: { e: "choice[2000,2500,3000]", m: "choice[500,750,1000]" }
      defaults: { e: 2500, m: 750 }

  - kind: explain
    id: s2
    body: |
      Eine bekannte **Faustregel** heißt **50-30-20**. 50 % für Fixkosten, 30 % für Wünsche, 20 % zum Sparen.
      Sie ist kein Gesetz – aber ein guter Startpunkt.

  - kind: problem
    id: sparen
    widget: numeric
    prompt: Nach der 50-30-20-Regel – wie viel spart jemand mit {{e}} € im Monat?
    params: { unit: "€" }
    answer: { value: "{{e * 0.2}}" }
    hints:
      - "20 % sind ein Fünftel."
    explanation: "{{e}} : 5 = {{e * 0.2}} €."
    variants:
      params: { e: "step[1500,4000,500]" }
      defaults: { e: 2500 }

  - kind: problem
    id: abo
    widget: numeric
    prompt: Drei Abos kosten 9,99 €, 12,99 € und 4,99 € im Monat. Wie viel ist das im Jahr? Runde auf Euro.
    params: { unit: "€" }
    answer: { value: 336, tolerance: 1 }
    hints:
      - Rund 10 + 13 + 5 = 28 € im Monat.
    explanation: 27,97 € · 12 ≈ 336 €. Kleine Beträge summieren sich.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Du sparst 5 Jahre lang jeden Monat 150 €, ohne Zinsen. Wie viel hast du am Ende?
    params:
      unit: €
    answer:
      value: 9000
    hints:
      - 5 Jahre sind 60 Monate.
    explanation: 60 · 150 € = 9000 €.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Kaffee für 3,50 € an jedem Arbeitstag (220 im Jahr). Was kostet das in 10 Jahren – ohne Zinsen?
    params:
      options:
        - label: 7700 €
          correct: true
        - label: 770 €
          feedback: Das ist ein Jahr.
        - label: 77 000 €
          feedback: Eine Null zu viel.
    hints:
      - "Erst ein Jahr: 220 · 3,50 €."
    explanation: 770 € im Jahr, 7700 € in zehn. Kleine regelmäßige Beträge summieren sich.
    difficulty: 3

srs:
  cards_from: [anteil, sparen]
