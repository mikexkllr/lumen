id: math.money.loans
type: concept
title: Installments, Loans, and Discounts
summary: Seeing the true price.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The debt spiral
    body: Loans are handy – but they can go round in circles. Uncover how a small minus turns into a spiral. In the end, only what you pay **in total** counts.
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 💳
            front: The account in the red
            back: For an overdraft, banks often charge over 10% interest a year.
          - icon: 📈
            front: The interest grows
            back: The debt gets bigger even if you buy nothing more.
          - icon: 🛍️
            front: New instalments
            back: Small instalments for the next purchase make the minus even deeper.
          - icon: 🔁
            front: The spiral
            back: Anyone who only pays the interest is soon stuck at the start again.

  - kind: problem
    id: raten
    widget: numeric
    prompt: A device costs €{{p}} – or {{n}} installments of €{{r}}. How much more do you pay with installments?
    params: { unit: "€" }
    answer: { value: "{{n * r - p}}" }
    feedback:
      - when: "numval(state.input) == n * r"
        misconception: total-not-extra
        text: That is the total price. The question asks for the extra cost.
    hints:
      - "First calculate {{n}} · {{r}}."
    explanation: "{{n}} · €{{r}} = €{{n * r}}, so €{{n * r - p}} more."
    variants:
      params: { p: "choice[480,600,900]", n: "choice[12,24]" }
      derive: { r: "ceil(p * 1.15 / n)" }
      defaults: { p: 600, n: 24 }

  - kind: explain
    id: s2
    body: |
      The **effective annual rate** shows the true cost of a loan – including all fees.
      Only it makes offers comparable.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: You borrow €1000 for one year. Which is cheaper?
    params:
      options:
        - { label: B – 6% effective annual rate, correct: true }
        - { label: A – 0% interest and a €99 fee, feedback: "€99 on €1000 is almost 10%. Zero percent does not mean free." }
        - { label: Both the same, feedback: "Calculate both costs in euros." }
    hints:
      - How many euros does each offer cost?
    explanation: B costs about €60, A costs €99.

  - kind: explain
    id: s4
    body: |
      **Discount trap:** First add 25%, then “20% off.” The price is exactly the same again.
      The percentages refer to different base values.

  - kind: problem
    id: rabatt
    widget: numeric
    prompt: A shop raises €{{p}} by 25% and then gives 20% off. What does it cost now?
    params: { unit: "€" }
    answer: { value: "{{p}}" }
    feedback:
      - when: "numval(state.input) == p * 1.05"
        misconception: add-percents
        text: The 20% applies to the raised price.
    hints:
      - "First calculate {{p}} · 1.25, then times 0.8."
    explanation: "{{p}} · 1.25 · 0.8 = €{{p}}. The “discount” only undoes the increase."
    variants:
      params: { p: "choice[40,80,120,200]" }
      defaults: { p: 80 }

  - kind: problem
    id: tilgung
    widget: numeric
    prompt: You borrow €{{s}} interest-free and repay €{{r}} a month. How many months does it take?
    params: { unit: months }
    answer: { value: "{{s / r}}" }
    hints:
      - "How many times does {{r}} fit into {{s}}?"
    explanation: "{{s}} ÷ {{r}} = {{s / r}} months."
    variants:
      params: { s: "choice[900,1200,1500,1800]", r: "choice[50,75,100]" }
      defaults: { s: 1200, r: 75 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: The effective annual rate includes fees too.
          right: true
        - text: “0% financing” is always free.
          right: false
          why: Fees, insurance or a higher price often hide behind it.
        - text: +25% and then −25% gives the old price.
          right: false
          why: 1.25 · 0.75 = 0.9375 – cheaper than before.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: You overdraw your account by €600 for one month at 12% interest per year. How much interest do you pay?
    params:
      unit: €
    answer:
      value: 6
    hints:
      - 12% a year is 1% a month.
    explanation: 1% of €600 is €6.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: With an **instalment loan** you pay the same rate every month. It contains interest and repayment. At first the interest share is large, at the end almost zero.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: You owe €{{s}} at {{p}} % interest per year. How much interest builds up in one month?
    params:
      unit: €
    answer:
      value: "{{s * p / 1200}}"
    feedback:
      - when: numval(state.input) == s * p / 100
        misconception: year-not-month
        text: That is the interest for a whole year. One month is a twelfth.
    hints:
      - "Yearly interest: €{{s * p / 100}}."
      - Divided by 12.
    explanation: "€{{s}} · {{p}} % : 12 = €{{s * p / 1200}}."
    difficulty: 2
    variants:
      params:
        s: step[1200,6000,1200]
        p: choice[6,12]
      defaults:
        s: 2400
        p: 6

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Loan €2000, 6 % interest per year, €100 rate per month. How much of the first payment actually reduces the debt?
    params:
      unit: €
    answer:
      value: 90
    feedback:
      - when: numval(state.input) == 100
        misconception: all-repayment
        text: Part of the payment is interest. Subtract it.
    hints:
      - "Interest in month one: €2000 · 6 % : 12."
      - €100 − €10 = ?
    explanation: €10 is interest, €90 repayment. The debt falls to €1910.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "A €1000 loan at 10% is repaid in 2 years: each year you pay €500 plus the interest on the remaining debt. How much interest in total?"
    params:
      unit: €
    answer:
      value: 150
    hints:
      - In year one you owe €1000, in year two only €500.
    explanation: €100 + €50 = €150. Repaying faster means paying less interest.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: A credit card debt grows at 18 % per year and you pay nothing. After about how many years has it doubled? Use the rule of 72.
    params:
      unit: years
    answer:
      value: 4
    hints:
      - 72 divided by the interest rate.
      - "72 : 18 = ?"
    explanation: "72 : 18 = 4 years. Exactly: $1.18^4 \\approx 1.94$. Debt grows just as exponentially as savings."
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: "Rule of thumb for loan costs: average debt · rate · time. €1200 is repaid over 12 months, on average you owe €600. At 1 % per month – roughly how much interest?"
    params:
      unit: €
    answer:
      value: 72
      tolerance: 5
    feedback:
      - when: numval(state.input) == 144
        misconception: full-debt
        text: You used the full debt. But it shrinks every month.
    hints:
      - €600 · 1 % = €6 per month.
      - €6 · 12 = ?
    explanation: About €72. Repaying €100 a month plus interest on the rest gives exactly €78 – the rule of thumb comes close.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why loans are compared by their effective annual rate (APR).
    params:
      keywords:
        - - gebühr
          - kosten
          - fee
          - cost
          - charges
        - - vergleich
          - compare
          - gleich
          - same
        - - jahr
          - year
          - effektiv
          - effective
          - apr
      sample: The effective annual rate includes all costs, fees too. It converts them to one year. That way different offers can be compared fairly.
    explanation: "Key idea: only a number that converts all costs to the same time span is comparable."
    difficulty: 3

srs:
  cards_from: [raten, rabatt]
