id: logic.constraints.three
type: concept
title: Three categories
summary: Chaining clues.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ana drinks tea. Whoever drinks tea has a dog. What do you know about Ana?
    params:
      options:
        - label: She has a dog
          correct: true
        - label: She has a cat
          feedback: That was not mentioned.
        - label: Nothing
          feedback: Two clues together give something new.
    hints:
      - Chain the two sentences.
    explanation: Chaining clues – that is how big puzzles are solved too.


  - kind: explain
    id: s1
    body: |
      With three categories, clues also link attributes to each other: “Whoever drinks coffee likes blue.” Once you know who drinks coffee, you also know their color.

  - kind: problem
    id: cafe
    widget: logic-grid
    prompt: Who drinks what, and who likes which color?
    params:
      categories:
        - { name: Person, items: [Ida, Jan, Kai] }
        - { name: Drink, items: [Tea, Coffee, Juice] }
        - { name: Color, items: [Red, Green, Blue] }
      clues:
        - text: Ida drinks tea.
          rule: { is: [Ida, Tea] }
        - text: Whoever drinks coffee likes blue.
          rule: { is: [Coffee, Blue] }
        - text: Jan likes red.
          rule: { is: [Jan, Red] }
        - text: Kai does not drink juice.
          rule: { not: [Kai, Juice] }
    hints:
      - Kai drinks neither tea nor juice.
    explanation: Kai drinks coffee and likes blue, Jan drinks juice, Ida likes green.

  - kind: problem
    id: kette
    widget: choice
    prompt: You know Kai drinks coffee, and coffee drinkers like blue. What follows?
    params:
      options:
        - { label: Kai likes blue., correct: true }
        - { label: Nothing – those are separate categories., feedback: "Clues can be chained – that is exactly the trick." }
    hints:
      - If A belongs to B and B belongs to C, then …
    explanation: Chains of equalities carry over across categories.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Clues: “Ana drinks tea.” “Whoever drinks tea does not like red.” “Ben likes red.” What follows about Ben?"
    params:
      options:
        - label: Ben does not drink tea
          correct: true
        - label: Ben drinks tea
          feedback: Then he should not like red.
        - label: Nothing
          feedback: The rule can be used backwards.
    hints:
      - Whoever likes red cannot be a tea drinker.
    explanation: "The rule was applied in reverse: contraposition. A clue works in both directions."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The famous “Einstein puzzle” has 5 houses and 5 categories with 5 values each. How many assignments are there without clues? Enter the number of digits. (120⁵)
    answer:
      value: 11
    hints:
      - 120⁵ ≈ 2.5 · 10¹⁰.
    explanation: About 25 billion – and 15 clues suffice to pin down exactly one.
    difficulty: 3

srs:
  cards_from: [cafe, kette]
