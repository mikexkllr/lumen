id: logic.constraints.three
type: concept
title: Three categories
summary: Chaining clues.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A chain of clues
    body: Detectives link clues that say little on their own. Uncover the cards in order. Each clue leads to the next – until there is a **conclusion** that no single clue gives away.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🎩
            front: Clue 1
            back: The culprit wore a red hat.
          - icon: 🚆
            front: Clue 2
            back: Whoever wore a red hat today came by train.
          - icon: 🕗
            front: Clue 3
            back: The only train arrived at 8 o'clock.
          - icon: 💡
            front: The conclusion
            back: The culprit was in town from 8 o'clock – although no clue says so directly.

  - kind: problem
    id: hook
    widget: choice
    prompt: Ana drinks tea. Whoever drinks tea has a dog. What do you know about Ana?
    params:
      options:
        - label: She has a dog
          correct: true
        - label: She has a cat
          feedback: That was not mentioned.
        - label: Nothing
          feedback: Two clues together give something new.
    hints:
      - Chain the two sentences.
    explanation: Chaining clues – that is how big puzzles are solved too.

  - kind: explain
    id: s1
    body: |
      With three **categories**, clues also link attributes to each other: “Whoever drinks coffee likes blue.” Once you know who drinks coffee, you also know their color.

  - kind: problem
    id: cafe
    widget: logic-grid
    prompt: Who drinks what, and who likes which color?
    params:
      categories:
        - { name: Person, items: [Ida, Jan, Kai] }
        - { name: Drink, items: [Tea, Coffee, Juice] }
        - { name: Color, items: [Red, Green, Blue] }
      clues:
        - text: Ida drinks tea.
          rule: { is: [Ida, Tea] }
        - text: Whoever drinks coffee likes blue.
          rule: { is: [Coffee, Blue] }
        - text: Jan likes red.
          rule: { is: [Jan, Red] }
    hints:
      - Jan likes red. Can he drink coffee, then?
    explanation: Kai drinks coffee and likes blue, Jan drinks juice, Ida likes green.

  - kind: problem
    id: kette
    widget: choice
    prompt: You know Kai drinks coffee, and coffee drinkers like blue. What follows?
    params:
      options:
        - { label: Kai likes blue., correct: true }
        - { label: Nothing – those are separate categories., feedback: "Clues can be chained – that is exactly the trick." }
    hints:
      - If A belongs to B and B belongs to C, then …
    explanation: Chains of equalities carry over across categories.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Clues can be [[chained]]: if Ana drinks coffee and coffee drinkers like blue, then Ana likes [[blue]]."
      distractors:
        - deleted
        - tea

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Clues: “Ana drinks tea.” “Whoever drinks tea does not like red.” “Ben likes red.” What follows about Ben?"
    params:
      options:
        - label: Ben does not drink tea
          correct: true
        - label: Ben drinks tea
          feedback: Then he should not like red.
        - label: Nothing
          feedback: The rule can be used backwards.
    hints:
      - Whoever likes red cannot be a tea drinker.
    explanation: "The rule was applied in reverse: contraposition. A clue works in both directions."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Who drinks what, and who likes which colour?
    params:
      categories:
        - name: Person
          items:
            - Ana
            - Ben
            - Cleo
            - Dan
        - name: Drink
          items:
            - coffee
            - tea
            - juice
            - water
        - name: Colour
          items:
            - red
            - blue
            - green
            - yellow
      clues:
        - text: The coffee drinker likes blue.
          rule:
            is:
              - coffee
              - blue
        - text: Ana drinks tea.
          rule:
            is:
              - Ana
              - tea
        - text: Ben does not like blue and does not drink juice.
          rules:
            - not:
                - Ben
                - blue
            - not:
                - Ben
                - juice
        - text: The juice drinker likes green.
          rule:
            is:
              - juice
              - green
        - text: Cleo does not like green.
          rule:
            not:
              - Cleo
              - green
        - text: Ana does not like red.
          rule:
            not:
              - Ana
              - red
    hints:
      - Ben drinks no juice, no tea – and no coffee, since coffee means blue.
      - Juice means green, and Cleo does not like green. So what does Cleo drink?
    explanation: "Ana: tea, yellow. Ben: water, red. Cleo: coffee, blue. Dan: juice, green. Every tick between two categories carries over into the third."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The famous “Einstein puzzle” has 5 houses and 5 categories with 5 values each. How many assignments are there without clues? Enter the number of digits. (120⁵)
    answer:
      value: 11
    hints:
      - 120⁵ ≈ 2.5 · 10¹⁰.
    explanation: About 25 billion – and 15 clues suffice to pin down exactly one.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: The grid shows Ana – tea ✓ and tea – red ✗. What may you enter right away?
    params:
      options:
        - label: Ana – red ✗
          correct: true
        - label: Ana – red ✓
          feedback: Ana drinks tea, and the tea drinker does not like red.
        - label: Nothing – those are different sub-grids.
          feedback: 'A tick links the sub-grids: Ana and "tea" are the same row of the solution.'
    hints:
      - Ana and the tea belong to the same person.
      - So whatever holds for the tea also holds for Ana.
    explanation: "A ✓ makes two values equivalent: all ✓ and ✗ of one carry over to the other. That is the most important trick with three categories."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a clue like "the coffee drinker likes blue" helps with three categories.
    params:
      keywords:
        - - kaffee
          - coffee
        - - blau
          - blue
        - - übertrag
          - gilt auch
          - ebenso
          - carry
          - also
          - same
      sample: Coffee and blue belong to the same person. Once I know who drinks coffee, I also know their colour. Every cross for coffee also holds for blue – it carries over.
    difficulty: 3

srs:
  cards_from: [cafe, kette]
