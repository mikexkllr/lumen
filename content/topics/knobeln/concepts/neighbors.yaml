id: logic.constraints.neighbors
type: concept
title: Nachbarn
summary: Wer wohnt neben wem?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: strasse
    widget: logic-grid
    prompt: Wer wohnt in welchem Haus, und wer hat welches Tier?
    params:
      categories:
        - { name: Haus, items: [Haus 1, Haus 2, Haus 3] }
        - { name: Person, items: [Pia, Quinn, Rosa] }
        - { name: Tier, items: [Hund, Katze, Vogel] }
      ordered: 0
      clues:
        - text: Pia wohnt in Haus 1.
          rule: { is: [Pia, Haus 1] }
        - text: Rosa hat den Vogel.
          rule: { is: [Rosa, Vogel] }
        - text: Quinn wohnt nicht in Haus 3.
          rule: { not: [Quinn, Haus 3] }
        - text: Pia hat keine Katze.
          rule: { not: [Pia, Katze] }
    hints:
      - Wenn Quinn nicht in Haus 3 und Pia in Haus 1 wohnt …
    explanation: Quinn in Haus 2, Rosa in Haus 3 mit dem Vogel. Pia hat den Hund, Quinn die Katze.

  - kind: problem
    id: sitzplan
    widget: logic-grid
    prompt: Wer sitzt wo auf der Bank?
    params:
      categories:
        - { name: Person, items: [Tom, Uli, Vera] }
        - { name: Platz, items: [links, Mitte, rechts] }
      ordered: 1
      clues:
        - text: Uli sitzt direkt rechts von Tom.
          rule: { offset: [Tom, Uli, 1] }
        - text: Tom sitzt nicht links.
          rule: { not: [Tom, links] }
    hints:
      - Wenn Tom nicht links sitzt und Uli rechts von ihm …
    explanation: Tom in der Mitte, Uli rechts, Vera links.

  - kind: problem
    id: neben
    widget: choice
    prompt: Was folgt aus »Der Hund wohnt direkt neben der Katze« bei drei Häusern in einer Reihe?
    params:
      options:
        - { label: Hund und Katze wohnen nicht in Haus 1 und Haus 3 zugleich., correct: true }
        - { label: Einer von beiden wohnt in Haus 2., feedback: "Das stimmt auch – aber genauer ist: 1 und 3 sind als Paar ausgeschlossen." }
        - { label: Nichts, feedback: "Nachbarschaft schließt die beiden Randhäuser als Paar aus." }
    hints:
      - Welche Paare sind Nachbarn?
    explanation: Nachbarpaare sind 1–2 und 2–3. Daraus folgt auch, dass Haus 2 beteiligt ist.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: Fünf Häuser stehen in einer Reihe. Wie viele Paare direkter Nachbarn gibt es?
    answer:
      value: 4
    hints:
      - Zähl die Lücken zwischen den Häusern.
    explanation: Vier. Ein Hinweis mit »neben« hat also nur vier mögliche Plätze.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Vier Plätze in einer Reihe. »A sitzt neben B.« »B sitzt neben C.« »A sitzt nicht neben C.« Wer sitzt sicher **nicht** am Rand?
    params:
      options:
        - label: B – er hat zwei Nachbarn
          correct: true
        - label: A
          feedback: A könnte am Rand sitzen.
        - label: C
          feedback: Auch C könnte am Rand sitzen.
    hints:
      - Wer zwei Nachbarn hat, sitzt nicht am Rand.
    explanation: B sitzt zwischen A und C. Die Reihenfolge ist A–B–C oder C–B–A.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Vier Häuser in einer Reihe. Wer wohnt wo, und wer hat welches Tier?
    params:
      categories:
        - name: Person
          items:
            - Ali
            - Bo
            - Cara
            - Dev
        - name: Haus
          items:
            - Haus 1
            - Haus 2
            - Haus 3
            - Haus 4
        - name: Tier
          items:
            - Hund
            - Katze
            - Maus
            - Vogel
      ordered: 1
      clues:
        - text: Ali wohnt in Haus 1.
          rule:
            is:
              - Ali
              - Haus 1
        - text: Bo wohnt zwei Häuser rechts von Ali.
          rule:
            offset:
              - Ali
              - Bo
              - 2
        - text: Bo hat den Vogel.
          rule:
            is:
              - Bo
              - Vogel
        - text: Dev wohnt links von Cara.
          rule:
            less:
              - Dev
              - Cara
        - text: Hund und Katze wohnen direkt nebeneinander.
          rule:
            adjacent:
              - Hund
              - Katze
        - text: Ali hat keinen Hund.
          rule:
            not:
              - Ali
              - Hund
    hints:
      - "Erst die Häuser: Ali 1, Bo 3. Für Dev und Cara bleiben 2 und 4."
      - Hund und Katze brauchen zwei Nachbarhäuser – aber Haus 3 hat schon den Vogel.
    explanation: Ali 1 mit Katze, Dev 2 mit Hund, Bo 3 mit Vogel, Cara 4 mit Maus. Nur Haus 1 und 2 bleiben als Nachbarpaar für Hund und Katze.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Auf wie viele Arten können A und B nebeneinander auf {{n}} Plätzen in einer Reihe sitzen? A darf links oder rechts sein.
    answer:
      value: "{{2 * (n - 1)}}"
    feedback:
      - when: numval(state.input) == n - 1
        misconception: one-direction
        text: Das sind die Nachbarpaare. Jedes Paar lässt sich noch auf zwei Arten besetzen.
    hints:
      - Wie viele Paare direkt benachbarter Plätze hat eine Reihe mit {{n}} Plätzen?
      - Es sind {{n - 1}} Paare – und A kann links oder rechts sitzen.
    explanation: "{{n - 1}} Nachbarpaare mal 2 Richtungen = {{2 * (n - 1)}}. In einem Kreis gäbe es {{n}} Nachbarpaare, weil auch der letzte Platz neben dem ersten liegt."
    difficulty: 2
    variants:
      params:
        n: int[4,12]
      defaults:
        n: 6

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Sudoku ist auch ein Rätsel aus Bedingungen. Wie löst ein Programm es am geschicktesten?
    params:
      options:
        - label: Erst alles folgern, was feststeht – und nur dann raten, wenn nichts mehr folgt, am besten beim Feld mit den wenigsten Möglichkeiten
          correct: true
        - label: Alle Kombinationen durchprobieren
          feedback: Das wären mehr als 10²⁰.
        - label: Zufällig Zahlen eintragen
          feedback: Das findet praktisch nie eine Lösung.
    hints:
      - Folgern ist billig, Raten ist teuer.
    explanation: "**Constraint-Programmierung**: folgern, verzweigen, zurückgehen. So entstehen auch Stundenpläne und Schichtpläne."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "{{n}} Leute setzen sich an einen runden Tisch. Zwei Sitzordnungen gelten als gleich, wenn jeder dieselben Nachbarn links und rechts hat. Wie viele verschiedene gibt es?"
    answer:
      value: "{{f}}"
    feedback:
      - when: numval(state.input) == n * f
        misconception: rotations
        text: Das zählt jede Drehung extra. Beim runden Tisch ist eine Drehung dieselbe Ordnung.
    hints:
      - Setze eine Person fest auf einen Platz. Drehungen zählen dann nicht mehr doppelt.
      - Die übrigen {{n - 1}} Personen kannst du beliebig anordnen.
    explanation: ({{n - 1}})! = {{f}}. Von den {{n}}! Reihen-Ordnungen sind je {{n}} nur Drehungen voneinander. Wer Symmetrien herausrechnet, zählt richtig.
    difficulty: 3
    variants:
      params:
        n: int[4,7]
      derive:
        f: "n == 4 ? 6 : n == 5 ? 24 : n == 6 ? 120 : 720"
      defaults:
        n: 5

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum der Hinweis »direkt nebeneinander« bei Häusern am Rand besonders stark ist.
    params:
      keywords:
        - - rand
          - außen
          - ende
          - edge
          - end
        - - nachbar
          - neben
          - neighbour
          - next
        - - ein
          - nur
          - one
          - only
      sample: Ein Haus am Rand hat nur einen Nachbarn. Steht dort einer der beiden, muss der andere genau in diesem einen Nachbarhaus wohnen. So bleiben kaum Möglichkeiten übrig.
    difficulty: 3

srs:
  cards_from: [strasse, sitzplan]
