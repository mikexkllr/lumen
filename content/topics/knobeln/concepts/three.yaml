id: logic.constraints.three
type: concept
title: Drei Kategorien
summary: Hinweise verketten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ana trinkt Tee. Wer Tee trinkt, hat einen Hund. Was weißt du über Ana?
    params:
      options:
        - label: Sie hat einen Hund
          correct: true
        - label: Sie hat eine Katze
          feedback: Davon war nicht die Rede.
        - label: Nichts
          feedback: Zwei Hinweise ergeben zusammen etwas Neues.
    hints:
      - Häng die beiden Sätze aneinander.
    explanation: Hinweise verketten – so löst man auch große Rätsel.

  - kind: explain
    id: s1
    body: |
      Mit drei **Kategorien** verbinden Hinweise auch Eigenschaften untereinander: »Wer Kaffee trinkt, mag Blau.« Sobald du weißt, wer Kaffee trinkt, weißt du auch seine Farbe.

  - kind: problem
    id: cafe
    widget: logic-grid
    prompt: Wer trinkt was, und wer mag welche Farbe?
    params:
      categories:
        - { name: Person, items: [Ida, Jan, Kai] }
        - { name: Getränk, items: [Tee, Kaffee, Saft] }
        - { name: Farbe, items: [Rot, Grün, Blau] }
      clues:
        - text: Ida trinkt Tee.
          rule: { is: [Ida, Tee] }
        - text: Wer Kaffee trinkt, mag Blau.
          rule: { is: [Kaffee, Blau] }
        - text: Jan mag Rot.
          rule: { is: [Jan, Rot] }
        - text: Kai trinkt keinen Saft.
          rule: { not: [Kai, Saft] }
    hints:
      - Kai trinkt weder Tee noch Saft.
    explanation: Kai trinkt Kaffee und mag Blau, Jan trinkt Saft, Ida mag Grün.

  - kind: problem
    id: kette
    widget: choice
    prompt: Du weißt, dass Kai Kaffee trinkt, und dass Kaffee-Trinker Blau mögen. Was folgt?
    params:
      options:
        - { label: Kai mag Blau., correct: true }
        - { label: Nichts – das sind getrennte Kategorien., feedback: "Hinweise lassen sich verketten – genau das ist der Trick." }
    hints:
      - Wenn A zu B gehört und B zu C, dann …
    explanation: Ketten von Gleichheiten übertragen sich über Kategorien hinweg.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Hinweise lassen sich [[verketten]]: Trinkt Ana Kaffee und mögen Kaffeetrinker Blau, dann mag Ana [[Blau]]."
      distractors:
        - löschen
        - Tee

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Hinweise: »Ana trinkt Tee.« »Wer Tee trinkt, mag nicht Rot.« »Ben mag Rot.« Was folgt über Ben?"
    params:
      options:
        - label: Ben trinkt keinen Tee
          correct: true
        - label: Ben trinkt Tee
          feedback: Dann dürfte er Rot nicht mögen.
        - label: Nichts
          feedback: Die Regel lässt sich rückwärts nutzen.
    hints:
      - Wer Rot mag, kann kein Teetrinker sein.
    explanation: "Die Regel wurde umgekehrt angewandt: Kontraposition. Ein Hinweis wirkt in beide Richtungen."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Wer trinkt was, und wer mag welche Farbe?
    params:
      categories:
        - name: Person
          items:
            - Ana
            - Ben
            - Cleo
            - Dan
        - name: Getränk
          items:
            - Kaffee
            - Tee
            - Saft
            - Wasser
        - name: Farbe
          items:
            - Rot
            - Blau
            - Grün
            - Gelb
      clues:
        - text: Wer Kaffee trinkt, mag Blau.
          rule:
            is:
              - Kaffee
              - Blau
        - text: Ana trinkt Tee.
          rule:
            is:
              - Ana
              - Tee
        - text: Ben mag kein Blau und trinkt keinen Saft.
          rules:
            - not:
                - Ben
                - Blau
            - not:
                - Ben
                - Saft
        - text: Wer Saft trinkt, mag Grün.
          rule:
            is:
              - Saft
              - Grün
        - text: Cleo mag kein Grün.
          rule:
            not:
              - Cleo
              - Grün
        - text: Ana mag kein Rot.
          rule:
            not:
              - Ana
              - Rot
    hints:
      - Ben trinkt keinen Saft, keinen Tee – und keinen Kaffee, denn Kaffee heißt Blau.
      - Saft heißt Grün, und Cleo mag kein Grün. Was trinkt Cleo also?
    explanation: "Ana: Tee, Gelb. Ben: Wasser, Rot. Cleo: Kaffee, Blau. Dan: Saft, Grün. Jeder Haken zwischen zwei Kategorien wandert in die dritte weiter."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Das berühmte »Einstein-Rätsel« hat 5 Häuser und 5 Kategorien mit je 5 Werten. Wie viele Zuordnungen gibt es ohne Hinweise? Gib die Zahl der Stellen an. (120⁵)
    answer:
      value: 11
    hints:
      - 120⁵ ≈ 2,5 · 10¹⁰.
    explanation: Rund 25 Milliarden – und 15 Hinweise genügen, um genau eine zu bestimmen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Im Gitter steht: Ana – Tee ✓ und Tee – Rot ✗. Was darfst du sofort eintragen?"
    params:
      options:
        - label: Ana – Rot ✗
          correct: true
        - label: Ana – Rot ✓
          feedback: Ana trinkt Tee, und wer Tee trinkt, mag kein Rot.
        - label: Nichts, das sind verschiedene Teilgitter.
          feedback: "Ein Haken verbindet die Teilgitter: Ana und »Tee« sind dieselbe Zeile der Lösung."
    hints:
      - Ana und der Tee gehören zur selben Person.
      - Was für den Tee gilt, gilt also auch für Ana.
    explanation: "Ein ✓ macht zwei Werte **gleichwertig**: Alle ✓ und ✗ des einen übertragen sich auf den anderen. Das ist der wichtigste Trick bei drei Kategorien."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Hinweis wie »Wer Kaffee trinkt, mag Blau« bei drei Kategorien hilft.
    params:
      keywords:
        - - kaffee
          - coffee
        - - blau
          - blue
        - - übertrag
          - gilt auch
          - ebenso
          - carry
          - also
          - same
      sample: Kaffee und Blau gehören zur selben Person. Weiß ich, wer Kaffee trinkt, kenne ich auch seine Farbe. Jedes Kreuz bei Kaffee gilt auch bei Blau – es überträgt sich.
    difficulty: 3

srs:
  cards_from: [cafe, kette]
