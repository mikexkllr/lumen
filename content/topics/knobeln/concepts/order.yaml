id: logic.constraints.order
type: concept
title: Reihenfolgen
summary: Vorher, nachher, direkt daneben.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wer steht wo?
    body: "In Warteschlangen, Ranglisten und Stundenplänen zählt die **Reihenfolge**. Hier stehen drei Leute an. Tippe ins Gitter: einmal ✗, zweimal ✓. Wer steht vorne, wer ganz hinten?"
    visual:
      widget: logic-grid
      interactive: true
      params:
        categories:
          - name: Person
            items:
              - Uwe
              - Vera
              - Wim
          - name: Platz
            items:
              - Platz 1
              - Platz 2
              - Platz 3
        ordered: 1
        clues:
          - text: Vera steht direkt vor Uwe.
            rule:
              offset:
                - Vera
                - Uwe
                - 1
          - text: Wim steht nicht auf Platz 1.
            rule:
              not:
                - Wim
                - Platz 1

  - kind: problem
    id: haus
    widget: logic-grid
    prompt: Wer wohnt auf welcher Etage?
    params:
      categories:
        - { name: Person, items: [Dana, Emil, Fritz, Gina] }
        - { name: Etage, items: [1. Etage, 2. Etage, 3. Etage, 4. Etage] }
      ordered: 1
      clues:
        - text: Emil wohnt direkt über Dana.
          rule: { offset: [Dana, Emil, 1] }
        - text: Gina wohnt ganz oben.
          rule: { is: [Gina, 4. Etage] }
        - text: Fritz wohnt nicht in der 1. Etage.
          rule: { not: [Fritz, 1. Etage] }
    hints:
      - Dana und Emil brauchen zwei benachbarte freie Etagen.
    explanation: Gina oben, Fritz in der 3. – nur so bleiben zwei Nachbaretagen für Dana und Emil.

  - kind: explain
    id: s2
    body: |
      Bei Reihenfolgen helfen **Paare**: »direkt über« oder »direkt vor« braucht zwei benachbarte freie Plätze. Oft gibt es dafür nur eine Möglichkeit.

  - kind: problem
    id: lauf
    widget: logic-grid
    prompt: Wer wurde welcher beim Lauf?
    params:
      categories:
        - { name: Person, items: [Lea, Mo, Nia, Ole] }
        - { name: Platz, items: [1. Platz, 2. Platz, 3. Platz, 4. Platz] }
      ordered: 1
      clues:
        - text: Lea kam direkt vor Mo ins Ziel.
          rule: { offset: [Lea, Mo, 1] }
        - text: Ole wurde Zweiter.
          rule: { is: [Ole, 2. Platz] }
    hints:
      - Wo ist noch Platz für zwei direkt aufeinanderfolgende Läufer?
    explanation: Ole auf 2 lässt für Lea und Mo nur 3 und 4 – Nia ist Erste.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Fünf Häuser in einer Reihe. Hinweis: »Das rote Haus steht direkt links vom blauen.« Wo kann das rote Haus **nicht** stehen?"
    params:
      options:
        - label: An Position 5 – rechts davon ist kein Platz mehr
          correct: true
        - label: An Position 1
          feedback: Dann steht das blaue an Position 2.
        - label: An Position 3
          feedback: Dann steht das blaue an Position 4.
    hints:
      - Das blaue Haus braucht einen Platz rechts daneben.
    explanation: "Ränder schränken ein: Jeder Paar-Hinweis streicht mindestens ein Randfeld."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Fünf Kinder sitzen in einer Reihe. Wer sitzt wo?
    params:
      categories:
        - name: Kind
          items:
            - Ana
            - Ben
            - Cem
            - Dila
            - Emil
        - name: Platz
          items:
            - Platz 1
            - Platz 2
            - Platz 3
            - Platz 4
            - Platz 5
      ordered: 1
      clues:
        - text: Ben sitzt direkt rechts neben Ana.
          rule:
            offset:
              - Ana
              - Ben
              - 1
        - text: Dila sitzt irgendwo links von Ana.
          rule:
            less:
              - Dila
              - Ana
        - text: Emil sitzt irgendwo rechts von Ben.
          rule:
            less:
              - Ben
              - Emil
        - text: Dila sitzt nicht auf Platz 1.
          rule:
            not:
              - Dila
              - Platz 1
    hints:
      - "Vier Kinder stehen in fester Reihenfolge: Dila, Ana, Ben, Emil."
      - Dila ist nicht auf Platz 1 – wer bleibt für Platz 1 übrig?
    explanation: Cem 1, Dila 2, Ana 3, Ben 4, Emil 5. Die Kette Dila – Ana – Ben – Emil braucht vier Plätze. Cem füllt die Lücke.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Vier Läufer. Hinweise: A kam vor B. C kam vor D. Wie viele der 24 möglichen Reihenfolgen passen noch?"
    answer:
      value: 6
    hints:
      - Jeder Hinweis halbiert die Möglichkeiten.
    explanation: "24 : 2 : 2 = 6. Unabhängige Hinweise multiplizieren ihre Wirkung."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "{{n}} Leute stellen sich in eine Reihe. A soll direkt vor B stehen. Wie viele Reihenfolgen gibt es?"
    answer:
      value: "{{f}}"
    feedback:
      - when: numval(state.input) == 2 * f
        misconception: both-directions
        text: Das zählt auch »B direkt vor A«. Hier ist die Richtung fest.
    hints:
      - Klebe A und B zu einem Block zusammen.
      - "Dann ordnest du {{n - 1}} Dinge an: ({{n - 1}})! Möglichkeiten."
    explanation: Der Block AB zählt als ein Ding. ({{n - 1}})! = {{f}}. Dieser **Block-Trick** macht aus »direkt nebeneinander« eine einfache Zählung.
    difficulty: 3
    variants:
      params:
        n: int[4,7]
      derive:
        f: "n == 4 ? 6 : n == 5 ? 24 : n == 6 ? 120 : 720"
      defaults:
        n: 5

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Hinweis wie »direkt vor« in einer Reihenfolge die Möglichkeiten einschränkt.
    params:
      keywords:
        - - zwei
          - paar
          - block
          - two
          - pair
        - - nebeneinander
          - benachbart
          - direkt
          - next to
          - adjacent
          - directly
        - - platz
          - plätze
          - stelle
          - seat
          - place
          - position
      sample: Direkt vor heißt, dass die zwei als Paar nebeneinander stehen. Sie brauchen also zwei benachbarte freie Plätze. Oft gibt es dafür nur eine Stelle.
    difficulty: 3

srs:
  cards_from: [haus, lauf]
