id: logic.constraints.exclude
type: concept
title: Ausschließen
summary: Was nicht geht, zeigt, was geht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Streichen wie ein Profi
    body: "Sudoku, Krimis, Fehlersuche: Oft findest du die Lösung, indem du **ausschließt**. Tippe ins Gitter – einmal für ✗, zweimal für ✓. Streich, was die Hinweise verbieten. Wer macht welchen Sport?"
    visual:
      widget: logic-grid
      interactive: true
      params:
        categories:
          - name: Person
            items:
              - Ole
              - Pia
              - Rui
          - name: Sport
            items:
              - Judo
              - Tennis
              - Yoga
        clues:
          - text: Ole macht weder Judo noch Yoga.
            rules:
              - not:
                  - Ole
                  - Judo
              - not:
                  - Ole
                  - Yoga
          - text: Pia macht kein Judo.
            rule:
              not:
                - Pia
                - Judo

  - kind: problem
    id: hook
    widget: choice
    prompt: "Drei Becher, unter einem liegt eine Münze. Du hebst zwei hoch: beide leer. Wo ist die Münze?"
    params:
      options:
        - label: Unter dem dritten Becher
          correct: true
        - label: Das weiß man nicht
          feedback: Es bleibt nur eine Möglichkeit.
        - label: Unter keinem
          feedback: Unter einem liegt sie sicher.
    hints:
      - Was bleibt übrig?
    explanation: Du musstest nicht nachsehen. Ausschließen genügt.

  - kind: explain
    id: s1
    body: |
      Logikgitter löst man vor allem durch **Ausschließen**: Jedes »nicht« streicht ein Feld. Bleibt in einer Zeile nur noch ein Feld frei, steht die Antwort fest – und streicht wiederum andere.

  - kind: problem
    id: tiere
    widget: logic-grid
    prompt: Wer hat welches Haustier?
    params:
      categories:
        - { name: Person, items: [Anna, Ben, Cleo] }
        - { name: Tier, items: [Hund, Katze, Fisch] }
      clues:
        - text: Anna hat keinen Hund.
          rule: { not: [Anna, Hund] }
        - text: Ben hat die Katze.
          rule: { is: [Ben, Katze] }
    hints:
      - Ben hat die Katze – welche Tiere bleiben für Anna?
    explanation: Anna kann weder Hund noch Katze haben – also den Fisch. Cleo bleibt der Hund.

  - kind: problem
    id: strategie
    widget: choice
    prompt: In einer Zeile ist nur noch ein Feld frei. Was folgt daraus?
    params:
      options:
        - { label: Dieses Feld ist richtig – und alle anderen in seiner Spalte sind falsch., correct: true }
        - { label: Man muss raten., feedback: "Raten ist nie nötig – ein einziges freies Feld ist zwingend." }
    hints:
      - Jede Person hat genau ein Tier.
    explanation: Jeder sichere Treffer streicht weitere Felder – so kommt die Lösung ins Rollen.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Drei Kinder, drei Tiere: Hund, Katze, Fisch. Ana hat weder Hund noch Katze. Wie viele Tiere kommen für die beiden anderen Kinder noch infrage?"
    answer:
      value: 2
    hints:
      - Ana hat den Fisch. Der ist vergeben.
    explanation: Hund und Katze. Jeder Ausschluss macht auch die anderen Zeilen kleiner.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Logikgitter hat 4 Personen und 4 Berufe. Wie viele Felder hat das Gitter?
    answer:
      value: 16
    hints:
      - 4 Zeilen, 4 Spalten.
    explanation: 16 Felder – am Ende stehen 4 Haken und 12 Kreuze darin.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Wer spielt welches Instrument? Achte auch auf die **Spalten**.
    params:
      categories:
        - name: Kind
          items:
            - Ana
            - Ben
            - Cem
            - Dila
        - name: Instrument
          items:
            - Flöte
            - Geige
            - Gitarre
            - Trommel
      clues:
        - text: Die Flöte spielen weder Ana noch Ben noch Cem.
          rules:
            - not:
                - Ana
                - Flöte
            - not:
                - Ben
                - Flöte
            - not:
                - Cem
                - Flöte
        - text: Ana spielt weder Geige noch Trommel.
          rules:
            - not:
                - Ana
                - Geige
            - not:
                - Ana
                - Trommel
        - text: Ben spielt nicht Trommel.
          rule:
            not:
              - Ben
              - Trommel
    hints:
      - In der Flöten-Spalte bleibt nur ein Feld frei.
      - Dann bleibt Ana nur noch die Gitarre.
    explanation: Dila – Flöte, Ana – Gitarre, Ben – Geige, Cem – Trommel. Ausschließen klappt in Zeilen **und** Spalten.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: In der Spalte »Geige« ist nur noch bei Ben ein Feld frei. In Bens Zeile sind aber noch drei Felder frei. Was folgt?
    params:
      options:
        - label: Ben spielt Geige – die Geige muss ja irgendwem gehören.
          correct: true
        - label: Noch nichts, Bens Zeile ist nicht fertig.
          feedback: "Die Spalte reicht: Jedes Instrument gehört genau einem Kind."
        - label: Ben spielt keine Geige.
          feedback: Dann hätte niemand die Geige.
    hints:
      - Wie viele Kinder spielen die Geige?
      - Ein freies Feld in einer Spalte wirkt genauso wie ein freies Feld in einer Zeile.
    explanation: "Der **Spalten-Trick**: Bleibt in einer Spalte nur ein Feld, ist es ein ✓ – egal, wie voll die Zeile ist. Profis prüfen darum immer beide Richtungen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du setzt in einem 4 × 4-Gitter einen Haken. Wie viele Kreuze folgen daraus sofort?
    params:
      options:
        - label: 6 – drei in derselben Zeile, drei in derselben Spalte
          correct: true
        - label: "3"
          feedback: Zeile **und** Spalte werden ausgeschlossen.
        - label: "15"
          feedback: Nur Zeile und Spalte des Hakens sind betroffen.
    hints:
      - Jede Person hat genau einen Beruf – und jeder Beruf genau eine Person.
    explanation: Eine Entscheidung zieht viele nach sich. Diese **Fortpflanzung** von Folgerungen nutzen auch Sudoku-Löser.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein Rätsel mit 3 Personen und 3 Tieren soll **nur** aus »nicht«-Hinweisen bestehen. Wie viele solche Hinweise braucht man mindestens für eine eindeutige Lösung?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 2
        misconception: too-few
        text: Zwei Kreuze schließen höchstens 4 der 5 falschen Zuordnungen aus.
    hints:
      - Es gibt 6 Zuordnungen, 5 davon müssen weg. Wie viele streicht ein einzelnes Kreuz höchstens?
      - Jedes Feld kommt in genau 2 der 6 Zuordnungen vor.
    explanation: "Ein Kreuz streicht höchstens 2 Zuordnungen. Für 5 braucht man also mindestens 3. Drei reichen auch: »A nicht 2, A nicht 3, B nicht 3«. Solche **Schranken** zählen, was jede Information höchstens leistet."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man in einem Logikgitter Zeilen **und** Spalten prüfen sollte.
    params:
      keywords:
        - - zeile
          - row
        - - spalte
          - column
        - - genau ein
          - genau eins
          - exactly one
        - - frei
          - übrig
          - left
          - open
      sample: "Jede Person hat genau ein Tier, und jedes Tier gehört genau einer Person. Darum gilt: Ist in einer Zeile oder in einer Spalte nur ein Feld frei, muss dort ein Haken hin."
    difficulty: 3

srs:
  cards_from: [tiere, strategie]
