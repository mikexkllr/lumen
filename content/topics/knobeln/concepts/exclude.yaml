id: logic.constraints.exclude
type: concept
title: Ausschließen
summary: Was nicht geht, zeigt, was geht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Drei Becher, unter einem liegt eine Münze. Du hebst zwei hoch: beide leer. Wo ist die Münze?"
    params:
      options:
        - label: Unter dem dritten Becher
          correct: true
        - label: Das weiß man nicht
          feedback: Es bleibt nur eine Möglichkeit.
        - label: Unter keinem
          feedback: Unter einem liegt sie sicher.
    hints:
      - Was bleibt übrig?
    explanation: Du musstest nicht nachsehen. Ausschließen genügt.

  - kind: explain
    id: s1
    body: |
      Logikgitter löst man vor allem durch **Ausschließen**: Jedes »nicht« streicht ein Feld. Bleibt in einer Zeile nur noch ein Feld frei, steht die Antwort fest – und streicht wiederum andere.

  - kind: problem
    id: tiere
    widget: logic-grid
    prompt: Wer hat welches Haustier?
    params:
      categories:
        - { name: Person, items: [Anna, Ben, Cleo] }
        - { name: Tier, items: [Hund, Katze, Fisch] }
      clues:
        - text: Anna hat keinen Hund.
          rule: { not: [Anna, Hund] }
        - text: Ben hat die Katze.
          rule: { is: [Ben, Katze] }
    hints:
      - Ben hat die Katze – welche Tiere bleiben für Anna?
    explanation: Anna kann weder Hund noch Katze haben – also den Fisch. Cleo bleibt der Hund.

  - kind: problem
    id: strategie
    widget: choice
    prompt: In einer Zeile ist nur noch ein Feld frei. Was folgt daraus?
    params:
      options:
        - { label: Dieses Feld ist richtig – und alle anderen in seiner Spalte sind falsch., correct: true }
        - { label: Man muss raten., feedback: "Raten ist nie nötig – ein einziges freies Feld ist zwingend." }
    hints:
      - Jede Person hat genau ein Tier.
    explanation: Jeder sichere Treffer streicht weitere Felder – so kommt die Lösung ins Rollen.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Drei Kinder, drei Tiere: Hund, Katze, Fisch. Ana hat weder Hund noch Katze. Wie viele Tiere kommen für die beiden anderen Kinder noch infrage?"
    answer:
      value: 2
    hints:
      - Ana hat den Fisch. Der ist vergeben.
    explanation: Hund und Katze. Jeder Ausschluss macht auch die anderen Zeilen kleiner.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Logikgitter hat 4 Personen und 4 Berufe. Wie viele Felder hat das Gitter?
    answer:
      value: 16
    hints:
      - 4 Zeilen, 4 Spalten.
    explanation: 16 Felder – am Ende stehen 4 Haken und 12 Kreuze darin.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du setzt in einem 4 × 4-Gitter einen Haken. Wie viele Kreuze folgen daraus sofort?
    params:
      options:
        - label: 6 – drei in derselben Zeile, drei in derselben Spalte
          correct: true
        - label: "3"
          feedback: Zeile **und** Spalte werden ausgeschlossen.
        - label: "15"
          feedback: Nur Zeile und Spalte des Hakens sind betroffen.
    hints:
      - Jede Person hat genau einen Beruf – und jeder Beruf genau eine Person.
    explanation: Eine Entscheidung zieht viele nach sich. Diese **Fortpflanzung** von Folgerungen nutzen auch Sudoku-Löser.
    difficulty: 3

srs:
  cards_from: [tiere, strategie]
