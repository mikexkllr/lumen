id: logic.constraints.exclude
type: concept
title: Eliminating
summary: What does not fit shows what does.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Three cups, a coin under one. You lift two: both empty. Where is the coin?"
    params:
      options:
        - label: Under the third cup
          correct: true
        - label: You cannot know
          feedback: Only one possibility is left.
        - label: Under none
          feedback: It is surely under one.
    hints:
      - What is left?
    explanation: You did not have to look. Ruling out is enough.


  - kind: explain
    id: s1
    body: |
      You solve logic grids mainly by **elimination**: every “not” crosses out a cell. If only one cell is left free in a row, the answer is settled – and it crosses out others in turn.

  - kind: problem
    id: tiere
    widget: logic-grid
    prompt: Who has which pet?
    params:
      categories:
        - { name: Person, items: [Anna, Ben, Cleo] }
        - { name: Pet, items: [Dog, Cat, Fish] }
      clues:
        - text: Anna does not have a dog.
          rule: { not: [Anna, Dog] }
        - text: Ben has the cat.
          rule: { is: [Ben, Cat] }
    hints:
      - Ben has the cat – which pets are left for Anna?
    explanation: Anna can have neither the dog nor the cat – so she has the fish. Cleo is left with the dog.

  - kind: problem
    id: strategie
    widget: choice
    prompt: Only one cell is still free in a row. What follows?
    params:
      options:
        - { label: That cell is correct – and all others in its column are wrong., correct: true }
        - { label: You have to guess., feedback: "Guessing is never needed – a single free cell is forced." }
    hints:
      - Each person has exactly one pet.
    explanation: Every sure hit crosses out more cells – that gets the solution rolling.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A logic grid has 4 people and 4 jobs. How many cells does the grid have?
    answer:
      value: 16
    hints:
      - 4 rows, 4 columns.
    explanation: 16 cells – in the end they hold 4 ticks and 12 crosses.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You place one tick in a 4 × 4 grid. How many crosses follow from it immediately?
    params:
      options:
        - label: 6 – three in the same row, three in the same column
          correct: true
        - label: "3"
          feedback: Row **and** column are ruled out.
        - label: "15"
          feedback: Only the row and column of the tick are affected.
    hints:
      - Each person has exactly one job – and each job exactly one person.
    explanation: One decision entails many others. Sudoku solvers use this **propagation** of consequences too.
    difficulty: 3

srs:
  cards_from: [tiere, strategie]
