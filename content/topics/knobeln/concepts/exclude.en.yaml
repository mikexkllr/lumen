id: logic.constraints.exclude
type: concept
title: Eliminating
summary: What does not fit shows what does.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Cross out like a pro
    body: "Sudoku, crime novels, bug hunting: you often find the answer by **ruling things out**. Tap the grid – once for ✗, twice for ✓. Cross out what the clues forbid. Who does which sport?"
    visual:
      widget: logic-grid
      interactive: true
      params:
        categories:
          - name: Person
            items:
              - Ole
              - Pia
              - Rui
          - name: Sport
            items:
              - judo
              - tennis
              - yoga
        clues:
          - text: Ole does neither judo nor yoga.
            rules:
              - not:
                  - Ole
                  - judo
              - not:
                  - Ole
                  - yoga
          - text: Pia does not do judo.
            rule:
              not:
                - Pia
                - judo

  - kind: problem
    id: hook
    widget: choice
    prompt: "Three cups, a coin under one. You lift two: both empty. Where is the coin?"
    params:
      options:
        - label: Under the third cup
          correct: true
        - label: You cannot know
          feedback: Only one possibility is left.
        - label: Under none
          feedback: It is surely under one.
    hints:
      - What is left?
    explanation: You did not have to look. Ruling out is enough.

  - kind: explain
    id: s1
    body: |
      You solve logic grids mainly by **elimination**: every “not” crosses out a cell. If only one cell is left free in a row, the answer is settled – and it crosses out others in turn.

  - kind: problem
    id: tiere
    widget: logic-grid
    prompt: Who has which pet?
    params:
      categories:
        - { name: Person, items: [Anna, Ben, Cleo] }
        - { name: Pet, items: [Dog, Cat, Fish] }
      clues:
        - text: Anna does not have a dog.
          rule: { not: [Anna, Dog] }
        - text: Ben has the cat.
          rule: { is: [Ben, Cat] }
    hints:
      - Ben has the cat – which pets are left for Anna?
    explanation: Anna can have neither the dog nor the cat – so she has the fish. Cleo is left with the dog.

  - kind: problem
    id: strategie
    widget: choice
    prompt: Only one cell is still free in a row. What follows?
    params:
      options:
        - { label: That cell is correct – and all others in its column are wrong., correct: true }
        - { label: You have to guess., feedback: "Guessing is never needed – a single free cell is forced." }
    hints:
      - Each person has exactly one pet.
    explanation: Every sure hit crosses out more cells – that gets the solution rolling.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Three children, three pets: dog, cat, fish. Ana has neither dog nor cat. How many pets are still possible for the other two children?"
    answer:
      value: 2
    hints:
      - Ana has the fish. That one is taken.
    explanation: Dog and cat. Every exclusion shrinks the other rows too.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A logic grid has 4 people and 4 jobs. How many cells does the grid have?
    answer:
      value: 16
    hints:
      - 4 rows, 4 columns.
    explanation: 16 cells – in the end they hold 4 ticks and 12 crosses.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Who plays which instrument? Watch the **columns** too.
    params:
      categories:
        - name: Child
          items:
            - Ana
            - Ben
            - Cem
            - Dila
        - name: Instrument
          items:
            - flute
            - violin
            - guitar
            - drum
      clues:
        - text: Neither Ana nor Ben nor Cem plays the flute.
          rules:
            - not:
                - Ana
                - flute
            - not:
                - Ben
                - flute
            - not:
                - Cem
                - flute
        - text: Ana plays neither the violin nor the drum.
          rules:
            - not:
                - Ana
                - violin
            - not:
                - Ana
                - drum
        - text: Ben does not play the drum.
          rule:
            not:
              - Ben
              - drum
    hints:
      - In the flute column only one cell is left.
      - Then only the guitar is left for Ana.
    explanation: Dila – flute, Ana – guitar, Ben – violin, Cem – drum. Elimination works in rows **and** columns.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: In the "violin" column only Ben's cell is still open. But Ben's row still has three open cells. What follows?
    params:
      options:
        - label: Ben plays the violin – the violin has to belong to someone.
          correct: true
        - label: Nothing yet – Ben's row is not finished.
          feedback: "The column is enough: each instrument belongs to exactly one child."
        - label: Ben does not play the violin.
          feedback: Then nobody would have the violin.
    hints:
      - How many children play the violin?
      - One open cell in a column works just like one open cell in a row.
    explanation: "The column trick: if only one cell is left in a column, it is a ✓ – however full the row is. Experts always check both directions."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You place one tick in a 4 × 4 grid. How many crosses follow from it immediately?
    params:
      options:
        - label: 6 – three in the same row, three in the same column
          correct: true
        - label: "3"
          feedback: Row **and** column are ruled out.
        - label: "15"
          feedback: Only the row and column of the tick are affected.
    hints:
      - Each person has exactly one job – and each job exactly one person.
    explanation: One decision entails many others. Sudoku solvers use this **propagation** of consequences too.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A puzzle with 3 people and 3 pets should use **only** "not" clues. At least how many such clues do you need for a unique solution?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 2
        misconception: too-few
        text: Two crosses rule out at most 4 of the 5 wrong matchings.
    hints:
      - There are 6 matchings and 5 must go. How many does a single cross remove at most?
      - Each cell appears in exactly 2 of the 6 matchings.
    explanation: 'A cross removes at most 2 matchings, so 5 need at least 3. Three also suffice: "A not 2, A not 3, B not 3". Such bounds count the most each piece of information can do.'
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why you should check rows **and** columns in a logic grid.
    params:
      keywords:
        - - zeile
          - row
        - - spalte
          - column
        - - genau ein
          - genau eins
          - exactly one
        - - frei
          - übrig
          - left
          - open
      sample: Each person has exactly one pet and each pet belongs to exactly one person. So if only one cell is open in a row or in a column, it must get a tick.
    difficulty: 3

srs:
  cards_from: [tiere, strategie]
