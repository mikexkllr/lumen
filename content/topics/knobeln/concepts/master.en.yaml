id: logic.constraints.master
type: concept
title: Master puzzle
summary: Everything together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Puzzles for pros
    body: "Now it gets serious: master puzzles have more categories and more traps. Experts crack them without guessing, purely by **method**. Uncover the cards and meet the stars of the puzzle world."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦓
            front: Who owns the zebra?
            back: The famous puzzle appeared in a magazine in 1962. That Einstein wrote it is a legend.
          - icon: 🔢
            front: Sudoku
            back: A good sudoku has exactly one solution – and needs at least 17 given digits for that.
          - icon: 🏆
            front: World championship
            back: Since 1992, puzzle experts have competed in a world championship of their own.
          - icon: 📅
            front: The timetable
            back: "Every school solves a giant puzzle each year: who teaches when, in which room?"

  - kind: problem
    id: la-hook
    widget: estimate
    prompt: "Take a guess: four talks, four time slots, four topics. How many matchings are possible without clues?"
    params:
      min: 10
      max: 10000
      scale: log
    answer:
      value: 576
      within: 30
    explanation: "Person – time: 4! = 24. Person – topic: another 24. Together 24 · 24 = 576 – the clues must strike out 575 of them."

  - kind: problem
    id: konferenz
    widget: logic-grid
    prompt: Four talks, four times, four topics. Match them all up.
    params:
      categories:
        - { name: Person, items: [Alma, Bo, Cem, Dila] }
        - { name: Time, items: ["9 am", "10 am", "11 am", "12 pm"] }
        - { name: Topic, items: [AI, Climate, Spaceflight, Music] }
      ordered: 1
      clues:
        - text: Alma speaks at 9 am.
          rule: { is: [Alma, 9 am] }
        - text: The AI talk comes right after Alma's talk.
          rule: { offset: [Alma, AI, 1] }
        - text: Cem speaks about spaceflight.
          rule: { is: [Cem, Spaceflight] }
        - text: Dila speaks last.
          rule: { is: [Dila, 12 pm] }
        - text: Dila does not speak about music.
          rule: { not: [Dila, Music] }
    hints:
      - Who speaks at 10 am – and what is the topic of that talk?
      - Bo speaks at 10 am about AI. What is left for Cem?
    explanation: Alma 9 am music, Bo 10 am AI, Cem 11 am spaceflight, Dila 12 pm climate.

  - kind: problem
    id: vorgehen
    widget: order
    prompt: What is your approach? Put the steps in order.
    params:
      items:
        - { label: Enter sure hits }
        - { label: Cross out consequences }
        - { label: Use pairs and chains }
        - { label: Try cases at the end }
    hints:
      - Trying cases is the last resort.
    explanation: First the sure things, then their consequences. Try cases only when nothing else works.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "You are stuck: no clue directly yields a cell any more. What is the best next step?"
    params:
      options:
        - label: Make an assumption and check whether it leads to a contradiction
          correct: true
        - label: Give up
          feedback: With a case distinction it almost always continues.
        - label: Guess a cell and hope
          feedback: Guessing without checking leads to hidden errors.
    hints:
      - If an assumption fails, you know the opposite for certain.
    explanation: "Proof by contradiction in miniature: what cannot be shows what must hold."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Four morning talks. Who speaks when, and about what?
    params:
      categories:
        - name: Speaker
          items:
            - Eva
            - Finn
            - Gil
            - Hana
        - name: Time
          items:
            - 9:00
            - 10:00
            - 11:00
            - 12:00
        - name: Topic
          items:
            - Mars
            - whales
            - volcanoes
            - robots
      ordered: 1
      clues:
        - text: Right after Eva, someone talks about Mars.
          rule:
            offset:
              - Eva
              - Mars
              - 1
        - text: Finn talks about robots at 10:00.
          rules:
            - is:
                - Finn
                - robots
            - is:
                - Finn
                - 10:00
        - text: The talk on whales comes after the one on robots.
          rule:
            less:
              - robots
              - whales
        - text: Gil does not talk about volcanoes.
          rule:
            not:
              - Gil
              - volcanoes
    hints:
      - Can Eva speak at 9:00? Then Mars would be at 10:00 – but that is Finn on robots.
      - Eva speaks at 11:00 and Mars comes at 12:00. Where do whales and volcanoes go?
    explanation: Hana 9:00 volcanoes, Finn 10:00 robots, Eva 11:00 whales, Gil 12:00 Mars. The key was the assumption "Eva at 9:00" – it led straight to a contradiction.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain your strategy for a hard logic puzzle to Lux.
    params:
      keywords:
        - - ausschließ
          - streich
          - eliminat
          - cross
          - rule out
          - exclude
        - - hinweis
          - clue
          - bedingung
          - constraint
        - - folger
          - schluss
          - deduc
          - conclude
          - infer
          - kombinier
          - combine
        - - annahme
          - widerspruch
          - assum
          - contradict
          - fall
          - case
      min: 3
      sample: First I enter all direct clues and cross out what they rule out. Then I combine clues to deduce new things. If I get stuck, I make an assumption and check whether it leads to a contradiction.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Logic grids, sudoku and timetables are constraint puzzles. What is known about them as they grow arbitrarily large?
    params:
      options:
        - label: No method is known that solves every large puzzle quickly.
          correct: true
        - label: A computer solves each one in seconds.
          feedback: Many, yes – but in the worst case the effort probably grows exponentially.
        - label: They are all unsolvable.
          feedback: They can be solved – the question is only how fast.
    hints:
      - How many matchings are there for 10 people and 3 categories?
      - Generalised sudoku is one of the "NP-complete" problems.
    explanation: Generalised sudoku is NP-complete. A fast method for it would give one for thousands of other problems. In practice, deduction plus clever guessing with backtracking helps.
    difficulty: 3

srs:
  cards_from: [konferenz, vorgehen]
