id: logic.constraints.master
type: concept
title: Master puzzle
summary: Everything together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: konferenz
    widget: logic-grid
    prompt: Four talks, four times, four topics. Match them all up.
    params:
      categories:
        - { name: Person, items: [Alma, Bo, Cem, Dila] }
        - { name: Time, items: ["9 am", "10 am", "11 am", "12 pm"] }
        - { name: Topic, items: [AI, Climate, Spaceflight, Music] }
      ordered: 1
      clues:
        - text: Alma speaks at 9 am.
          rule: { is: [Alma, 9 am] }
        - text: The AI talk comes right after Alma's talk.
          rule: { offset: [Alma, AI, 1] }
        - text: Cem speaks about spaceflight.
          rule: { is: [Cem, Spaceflight] }
        - text: Dila speaks last.
          rule: { is: [Dila, 12 pm] }
        - text: Dila does not speak about music.
          rule: { not: [Dila, Music] }
    hints:
      - Who speaks at 10 am – and what is the topic of that talk?
      - Bo speaks at 10 am about AI. What is left for Cem?
    explanation: Alma 9 am music, Bo 10 am AI, Cem 11 am spaceflight, Dila 12 pm climate.

  - kind: problem
    id: vorgehen
    widget: order
    prompt: What is your approach? Put the steps in order.
    params:
      items:
        - { label: Enter sure hits }
        - { label: Cross out consequences }
        - { label: Use pairs and chains }
        - { label: Try cases at the end }
    hints:
      - Trying cases is the last resort.
    explanation: First the sure things, then their consequences. Try cases only when nothing else works.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "You are stuck: no clue directly yields a cell any more. What is the best next step?"
    params:
      options:
        - label: Make an assumption and check whether it leads to a contradiction
          correct: true
        - label: Give up
          feedback: With a case distinction it almost always continues.
        - label: Guess a cell and hope
          feedback: Guessing without checking leads to hidden errors.
    hints:
      - If an assumption fails, you know the opposite for certain.
    explanation: "Proof by contradiction in miniature: what cannot be shows what must hold."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain your strategy for a hard logic puzzle to Lux.
    params:
      keywords:
        - - ausschließ
          - streich
          - eliminat
          - cross
          - rule out
          - exclude
        - - hinweis
          - clue
          - bedingung
          - constraint
        - - folger
          - schluss
          - deduc
          - conclude
          - infer
          - kombinier
          - combine
        - - annahme
          - widerspruch
          - assum
          - contradict
          - fall
          - case
      min: 3
      sample: First I enter all direct clues and cross out what they rule out. Then I combine clues to deduce new things. If I get stuck, I make an assumption and check whether it leads to a contradiction.
    difficulty: 3

srs:
  cards_from: [konferenz, vorgehen]
