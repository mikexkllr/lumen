id: logic.constraints.master
type: concept
title: Meisterrätsel
summary: Alles zusammen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Rätsel für Profis
    body: "Jetzt wird es ernst: Meisterrätsel haben mehr Kategorien und mehr Fallen. Profis knacken sie ohne Raten, nur mit **System**. Deck die Karten auf und triff die Stars der Rätselwelt."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🦓
            front: Wem gehört das Zebra?
            back: Das berühmte Rätsel erschien 1962 in einer Zeitschrift. Dass es von Einstein stammt, ist eine Legende.
          - icon: 🔢
            front: Sudoku
            back: Ein gutes Sudoku hat genau eine Lösung – und braucht dafür mindestens 17 Vorgaben.
          - icon: 🏆
            front: Weltmeisterschaft
            back: Seit 1992 treten Rätselprofis bei einer eigenen Weltmeisterschaft gegeneinander an.
          - icon: 📅
            front: Der Stundenplan
            back: "Jede Schule löst jedes Jahr ein Riesenrätsel: Wer unterrichtet wann in welchem Raum?"

  - kind: problem
    id: la-hook
    widget: estimate
    prompt: "Schätz mal: Vier Vorträge, vier Uhrzeiten, vier Themen. Wie viele Zuordnungen sind ohne Hinweise denkbar?"
    params:
      min: 10
      max: 10000
      scale: log
    answer:
      value: 576
      within: 30
    explanation: "Person – Zeit: 4! = 24. Person – Thema: noch einmal 24. Zusammen 24 · 24 = 576 – die Hinweise müssen 575 davon streichen."

  - kind: problem
    id: konferenz
    widget: logic-grid
    prompt: Vier Vorträge, vier Uhrzeiten, vier Themen. Ordne alles zu.
    params:
      categories:
        - { name: Person, items: [Alma, Bo, Cem, Dila] }
        - { name: Uhrzeit, items: [9 Uhr, 10 Uhr, 11 Uhr, 12 Uhr] }
        - { name: Thema, items: [KI, Klima, Raumfahrt, Musik] }
      ordered: 1
      clues:
        - text: Alma spricht um 9 Uhr.
          rule: { is: [Alma, 9 Uhr] }
        - text: Der KI-Vortrag kommt direkt nach Almas Vortrag.
          rule: { offset: [Alma, KI, 1] }
        - text: Cem spricht über Raumfahrt.
          rule: { is: [Cem, Raumfahrt] }
        - text: Dila spricht als Letzte.
          rule: { is: [Dila, 12 Uhr] }
        - text: Dila spricht nicht über Musik.
          rule: { not: [Dila, Musik] }
    hints:
      - Wer spricht um 10 Uhr – und welches Thema hat dieser Vortrag?
      - Bo spricht um 10 Uhr über KI. Was bleibt für Cem?
    explanation: Alma 9 Uhr Musik, Bo 10 Uhr KI, Cem 11 Uhr Raumfahrt, Dila 12 Uhr Klima.

  - kind: problem
    id: vorgehen
    widget: order
    prompt: Wie gehst du vor? Bring die Schritte in Reihenfolge.
    params:
      items:
        - { label: Sichere Treffer eintragen }
        - { label: Folgen streichen }
        - { label: Paare und Ketten nutzen }
        - { label: Zum Schluss Fälle probieren }
    hints:
      - Probieren ist der letzte Ausweg.
    explanation: Erst das Sichere, dann die Folgen. Probieren nur, wenn nichts mehr geht.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Du steckst fest: Kein Hinweis liefert mehr direkt ein Feld. Was ist der beste nächste Schritt?"
    params:
      options:
        - label: Eine Annahme treffen und prüfen, ob sie zum Widerspruch führt
          correct: true
        - label: Aufgeben
          feedback: Mit einer Fallunterscheidung geht es fast immer weiter.
        - label: Ein Feld raten und hoffen
          feedback: Raten ohne Prüfung führt zu versteckten Fehlern.
    hints:
      - Wenn eine Annahme scheitert, weißt du sicher das Gegenteil.
    explanation: "Der Widerspruchsbeweis im Kleinen: Was nicht geht, zeigt, was gelten muss."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Vier Vorträge am Morgen. Wer spricht wann, und worüber?
    params:
      categories:
        - name: Person
          items:
            - Eva
            - Finn
            - Gil
            - Hana
        - name: Uhrzeit
          items:
            - 9 Uhr
            - 10 Uhr
            - 11 Uhr
            - 12 Uhr
        - name: Thema
          items:
            - Mars
            - Wale
            - Vulkane
            - Roboter
      ordered: 1
      clues:
        - text: Direkt nach Eva spricht jemand über den Mars.
          rule:
            offset:
              - Eva
              - Mars
              - 1
        - text: Finn spricht um 10 Uhr über Roboter.
          rules:
            - is:
                - Finn
                - Roboter
            - is:
                - Finn
                - 10 Uhr
        - text: Der Vortrag über Wale kommt nach dem über Roboter.
          rule:
            less:
              - Roboter
              - Wale
        - text: Gil spricht nicht über Vulkane.
          rule:
            not:
              - Gil
              - Vulkane
    hints:
      - Kann Eva um 9 Uhr sprechen? Dann käme der Mars um 10 – aber da spricht Finn über Roboter.
      - Eva spricht um 11, der Mars kommt um 12. Wo bleiben Wale und Vulkane?
    explanation: Hana 9 Uhr Vulkane, Finn 10 Uhr Roboter, Eva 11 Uhr Wale, Gil 12 Uhr Mars. Der Schlüssel war die Annahme »Eva um 9« – sie führte sofort zum Widerspruch.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux deine Strategie für ein schwieriges Logikrätsel.
    params:
      keywords:
        - - ausschließ
          - streich
          - eliminat
          - cross
          - rule out
          - exclude
        - - hinweis
          - clue
          - bedingung
          - constraint
        - - folger
          - schluss
          - deduc
          - conclude
          - infer
          - kombinier
          - combine
        - - annahme
          - widerspruch
          - assum
          - contradict
          - fall
          - case
      min: 3
      sample: Ich trage zuerst alle direkten Hinweise ein und streiche, was dadurch ausgeschlossen ist. Dann kombiniere ich Hinweise zu neuen Folgerungen. Komme ich nicht weiter, treffe ich eine Annahme und prüfe, ob sie zum Widerspruch führt.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Logikgitter, Sudoku und Stundenpläne sind Bedingungsrätsel. Was weiß man über sie, wenn sie beliebig groß werden?
    params:
      options:
        - label: Man kennt kein Verfahren, das jedes große Rätsel schnell löst.
          correct: true
        - label: Ein Computer löst jedes in Sekunden.
          feedback: Viele schon – aber im schlimmsten Fall wächst der Aufwand vermutlich exponentiell.
        - label: Sie sind alle unlösbar.
          feedback: Lösbar sind sie – die Frage ist nur, wie schnell.
    hints:
      - Wie viele Zuordnungen gibt es bei 10 Personen und 3 Kategorien?
      - Verallgemeinertes Sudoku gehört zu den »NP-vollständigen« Problemen.
    explanation: Verallgemeinertes Sudoku ist **NP-vollständig**. Gäbe es dafür ein schnelles Verfahren, gäbe es eins für Tausende andere Probleme. In der Praxis helfen Folgern plus geschicktes Raten mit Zurücknehmen.
    difficulty: 3

srs:
  cards_from: [konferenz, vorgehen]
