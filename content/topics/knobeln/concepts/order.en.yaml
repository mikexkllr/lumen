id: logic.constraints.order
type: concept
title: Orderings
summary: Before, after, right next to.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: haus
    widget: logic-grid
    prompt: Who lives on which floor?
    params:
      categories:
        - { name: Person, items: [Dana, Emil, Fritz, Gina] }
        - { name: Floor, items: [1st floor, 2nd floor, 3rd floor, 4th floor] }
      ordered: 1
      clues:
        - text: Emil lives directly above Dana.
          rule: { offset: [Dana, Emil, 1] }
        - text: Gina lives on the top floor.
          rule: { is: [Gina, 4th floor] }
        - text: Fritz does not live on the 1st floor.
          rule: { not: [Fritz, 1st floor] }
    hints:
      - Dana and Emil need two free floors next to each other.
    explanation: Gina on top, Fritz on the 3rd – only then are two adjacent floors left for Dana and Emil.

  - kind: explain
    body: |
      For orderings, **pairs** help: “directly above” or “directly before” needs two free spots next to each other. Often there is only one way to do that.

  - kind: problem
    id: lauf
    widget: logic-grid
    prompt: Who finished in which place in the race?
    params:
      categories:
        - { name: Person, items: [Lea, Mo, Nia, Ole] }
        - { name: Place, items: [1st place, 2nd place, 3rd place, 4th place] }
      ordered: 1
      clues:
        - text: Lea finished right before Mo.
          rule: { offset: [Lea, Mo, 1] }
        - text: Nia finished first or last.
          rule: { either: [Nia, 1st place, 4th place] }
        - text: Ole finished second.
          rule: { is: [Ole, 2nd place] }
    hints:
      - Where is there still room for two runners in a row?
    explanation: Ole in 2nd leaves only 3rd and 4th for Lea and Mo – Nia is first.

srs:
  cards_from: [haus, lauf]
