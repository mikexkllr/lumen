id: logic.constraints.order
type: concept
title: Orderings
summary: Before, after, right next to.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: haus
    widget: logic-grid
    prompt: Who lives on which floor?
    params:
      categories:
        - { name: Person, items: [Dana, Emil, Fritz, Gina] }
        - { name: Floor, items: [1st floor, 2nd floor, 3rd floor, 4th floor] }
      ordered: 1
      clues:
        - text: Emil lives directly above Dana.
          rule: { offset: [Dana, Emil, 1] }
        - text: Gina lives on the top floor.
          rule: { is: [Gina, 4th floor] }
        - text: Fritz does not live on the 1st floor.
          rule: { not: [Fritz, 1st floor] }
    hints:
      - Dana and Emil need two free floors next to each other.
    explanation: Gina on top, Fritz on the 3rd – only then are two adjacent floors left for Dana and Emil.

  - kind: explain
    id: s2
    body: |
      For orderings, **pairs** help: “directly above” or “directly before” needs two free spots next to each other. Often there is only one way to do that.

  - kind: problem
    id: lauf
    widget: logic-grid
    prompt: Who finished in which place in the race?
    params:
      categories:
        - { name: Person, items: [Lea, Mo, Nia, Ole] }
        - { name: Place, items: [1st place, 2nd place, 3rd place, 4th place] }
      ordered: 1
      clues:
        - text: Lea finished right before Mo.
          rule: { offset: [Lea, Mo, 1] }
        - text: Nia finished first or last.
          rule: { either: [Nia, 1st place, 4th place] }
        - text: Ole finished second.
          rule: { is: [Ole, 2nd place] }
    hints:
      - Where is there still room for two runners in a row?
    explanation: Ole in 2nd leaves only 3rd and 4th for Lea and Mo – Nia is first.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Five houses in a row. Clue: “The red house is directly left of the blue one.” Where can the red house **not** be?"
    params:
      options:
        - label: At position 5 – there is no room to its right
          correct: true
        - label: At position 1
          feedback: Then the blue one is at position 2.
        - label: At position 3
          feedback: Then the blue one is at position 4.
    hints:
      - The blue house needs a place to the right.
    explanation: "Edges constrain: every pair clue strikes out at least one edge cell."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: logic-grid
    prompt: Five children sit in a row. Who sits where?
    params:
      categories:
        - name: Child
          items:
            - Ana
            - Ben
            - Cem
            - Dila
            - Emil
        - name: Seat
          items:
            - seat 1
            - seat 2
            - seat 3
            - seat 4
            - seat 5
      ordered: 1
      clues:
        - text: Ben sits directly to the right of Ana.
          rule:
            offset:
              - Ana
              - Ben
              - 1
        - text: Dila sits somewhere to the left of Ana.
          rule:
            less:
              - Dila
              - Ana
        - text: Emil sits somewhere to the right of Ben.
          rule:
            less:
              - Ben
              - Emil
        - text: Dila does not sit in seat 1.
          rule:
            not:
              - Dila
              - seat 1
    hints:
      - "Four children are in a fixed order: Dila, Ana, Ben, Emil."
      - Dila is not in seat 1 – who is left for seat 1?
    explanation: Cem 1, Dila 2, Ana 3, Ben 4, Emil 5. The chain Dila – Ana – Ben – Emil needs four seats, and Cem fills the gap.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Four runners. Clues: A finished before B. C finished before D. How many of the 24 possible orders still fit?"
    answer:
      value: 6
    hints:
      - Each clue halves the possibilities.
    explanation: 24 ÷ 2 ÷ 2 = 6. Independent clues multiply their effect.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "{{n}} people line up. A must stand directly in front of B. How many orders are there?"
    answer:
      value: "{{f}}"
    feedback:
      - when: numval(state.input) == 2 * f
        misconception: both-directions
        text: That also counts "B directly in front of A". Here the direction is fixed.
    hints:
      - Glue A and B together into one block.
      - "Then you arrange {{n - 1}} things: ({{n - 1}})! ways."
    explanation: The block AB counts as one item. ({{n - 1}})! = {{f}}. This block trick turns "right next to each other" into a simple count.
    difficulty: 3
    variants:
      params:
        n: int[4,7]
      derive:
        f: "n == 4 ? 6 : n == 5 ? 24 : n == 6 ? 120 : 720"
      defaults:
        n: 5

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a clue like "directly in front of" narrows the options in an order.
    params:
      keywords:
        - - zwei
          - paar
          - block
          - two
          - pair
        - - nebeneinander
          - benachbart
          - direkt
          - next to
          - adjacent
          - directly
        - - platz
          - plätze
          - stelle
          - seat
          - place
          - position
      sample: Directly in front means the two stand as a pair next to each other. They need two adjacent free places, and often there is only one spot for that.
    difficulty: 3

srs:
  cards_from: [haus, lauf]
