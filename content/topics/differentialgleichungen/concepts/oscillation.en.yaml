id: math.diffeq.oscillation
type: concept
title: "Oscillations"
summary: "Springs, pendulums and circuits – one single equation with two derivatives."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: sim
    prompt: Set the mass on a spring so that one oscillation takes exactly one second.
    params:
      scene: spring
    answer:
      period:
        - 0.98
        - 1.02
    explanation: For example 0.5 kg on a spring of 20 N/m. Heavy masses swing more slowly, stiff springs faster.

  - kind: explain
    id: c1
    body: "The spring pulls back with F = −D · x, and Newton says F = m · x″. Together: $x'' = -\\frac Dm\\,x$. The acceleration always points to the middle. This is **simple harmonic motion**."

  - kind: problem
    id: c2
    widget: choice
    prompt: Which function satisfies $x'' = -x$?
    params:
      options:
        - label: $x = \cos t$
          correct: true
        - label: Differentiated twice it stays $e^t$ – the minus is missing.
          feedback: Zweimal abgeleitet bleibt $e^t$ – das Minus fehlt.
        - label: The second derivative is 2, not −t².
          feedback: Die zweite Ableitung ist 2, nicht −t².
    hints:
      - Differentiate twice.
      - cos → −sin → −cos.
    explanation: (cos t)″ = −cos t. Also sin t and every mix $a\cos t + b\sin t$ fit.

  - kind: problem
    id: c3
    widget: numeric
    prompt: For $x'' = -\omega^2 x$, ω is the angular frequency, and $\omega = \sqrt{D/m}$. What is ω for D = {{D}} N/m and m = {{m}} kg?
    params:
      unit: 1/s
    answer:
      value: "{{w}}"
    feedback:
      - when: numval(state.input) == D / m
        misconception: no-root
        text: The square root is missing.
    hints:
      - D / m = {{D / m}}.
      - Take the square root.
    explanation: ω = √{{D / m}} = {{w}}. The period is 2π / ω ≈ {{round(628.32 / w) / 100}} s.
    variants:
      params:
        m: choice[1,4]
        w: int[2,8]
      derive:
        D: w * w * m
      defaults:
        m: 4
        w: 5

  - kind: problem
    id: c4
    widget: sim
    prompt: The spring has D = 10 N/m. With 1 kg one oscillation takes 1.99 s. Set the mass so that it takes twice as long.
    params:
      scene: spring
      controls:
        stiffness:
          value: 10
          fixed: true
      show:
        - period
        - frequency
    answer:
      period:
        - 3.95
        - 4
    explanation: "4 kg. The period grows with the square root of the mass: double the time needs four times the mass."

  - kind: explain
    id: d1
    depth: 2
    body: "In the oscillation energy moves back and forth: $\\frac12 m v^2 + \\frac12 D x^2$ stays constant. At the far end it is all in the spring, in the middle all in the motion. This is **conservation of energy**."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A spring with D = 10 N/m is stretched by 0.1 m. How much energy in joules is in the oscillation?
    params:
      unit: J
    answer:
      value: 0.05
      tolerance: 0.0001
    feedback:
      - when: numval(state.input) == 0.1
        misconception: no-half
        text: The factor ½ is missing.
      - when: numval(state.input) == 0.5
        misconception: no-square
        text: "The stretch is squared: 0.1² = 0.01."
    hints:
      - E = ½ · D · x².
      - ½ · 10 · 0.01.
    explanation: "0.05 J. In the middle it is all motion: with 1 kg, v = √0.1 ≈ 0.32 m/s."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: The solution is $x = A\cos(\omega t)$. The largest speed is A · ω. What is it for A = 0.1 m and ω = {{w}} per second?
    params:
      unit: m/s
    answer:
      value: "{{0.1 * w}}"
      tolerance: 0.001
    hints:
      - "Differentiate: $x' = -A\\omega\\sin(\\omega t)$."
      - The sine is at most 1.
    explanation: 0.1 · {{w}} = {{0.1 * w}} m/s, reached in the middle.
    difficulty: 2
    variants:
      params:
        w: int[2,9]
      defaults:
        w: 3

  - kind: explain
    id: x1
    depth: 3
    body: "An LC circuit obeys the same equation: $L\\,q'' = -\\frac{q}{C}$. So $\\omega = \\frac{1}{\\sqrt{LC}}$. Drive it at exactly this frequency and it builds up – **resonance**. That is how a radio picks a station."

  - kind: problem
    id: x2
    depth: 3
    widget: sim
    prompt: Tune the LC circuit to the mains frequency of 50 Hz (49 to 52 Hz).
    params:
      scene: resonance
    answer:
      f0:
        - 49
        - 52
    explanation: "For example L = 100 mH and C = 100 µF: $f = \\frac{1}{2\\pi\\sqrt{LC}} \\approx 50.3$ Hz. The spring and the circuit are mathematically the same."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Why should soldiers not march in step across bridges?
    params:
      options:
        - label: The rhythm could hit the bridge's natural frequency and build up its swinging.
          correct: true
        - label: The weight is the same with or without marching in step.
          feedback: Das Gewicht ist mit und ohne Gleichschritt dasselbe.
        - label: Noise is not the issue here.
          feedback: Lärm ist hier nicht das Problem.
    hints:
      - Marching in step is a regular driving force.
      - What happens when you drive at the natural frequency?
    explanation: "Resonance: small pushes at the right rhythm add up. In 1831 the Broughton bridge in England collapsed under marching soldiers."
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Tell Lux why a mass on a spring swings back and forth instead of just stopping in the middle.
    params:
      keywords:
        - - schwung
          - tempo
          - geschwindigkeit
          - momentum
          - speed
          - velocity
        - - mitte
          - middle
          - centre
          - center
        - - zurück
          - zieht
          - rückstell
          - back
          - pulls
          - restor
      sample: The spring always pulls the mass back to the middle. There the force is zero, but the mass has its greatest speed and overshoots. On the other side the spring slows it down and pulls it back again.
    explanation: Force and speed are out of step – that is the quarter period between cos and sin.
    difficulty: 3

srs:
  cards_from: ["c3", "d3"]
