id: ee.measure.multimeter
type: concept
title: "Das Multimeter"
summary: "Ein Gerät für Volt, Ampere und Ohm – mit dem richtigen Bereich."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Dein Blick in den Draht
    body: "Strom kannst du weder sehen noch hören. Ein Messgerät macht ihn **sichtbar**. Dreh an Spannung und Widerstand und beobachte die Anzeige: Wann fließt der meiste Strom?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: circuit

  - kind: problem
    id: hook
    widget: choice
    prompt: Ist die AA-Batterie noch voll? Auf welche Stellung drehst du das Multimeter?
    params:
      options:
        - label: V⎓ im 20-V-Bereich
          correct: true
        - label: A im 10-A-Bereich
          feedback: Strom misst man in Reihe. An der Batterie allein wäre das ein Kurzschluss.
        - label: Ω
          feedback: Widerstand misst man nur an Bauteilen ohne Spannung.
    hints:
      - Gefragt ist die Spannung der Batterie.
      - Batterien liefern Gleichspannung.
    explanation: Spannung misst du direkt an den Polen. Eine volle Zelle zeigt etwa 1,5 bis 1,6 V, eine leere unter 1,2 V.

  - kind: explain
    id: c1
    body: Ein **Multimeter** misst Spannung, Strom und Widerstand. Am Drehschalter wählst du Größe und Bereich. Die schwarze Leitung steckt in COM. Die rote steckt für Spannung in V, für Strom in A.

  - kind: problem
    id: c2
    widget: match
    prompt: Was misst welche Stellung?
    params:
      pairs:
        - left: V⎓
          right: Gleichspannung
        - left: V~
          right: Wechselspannung
        - left: A⎓
          right: Gleichstrom
        - left: Ω
          right: Widerstand
        - left: •)))
          right: Durchgang mit Piepton
      leftTitle: Stellung
      rightTitle: Messgröße
    hints:
      - Der gerade Strich steht für Gleich-, die Welle für Wechselgrößen.
      - Ω ist die Einheit des Widerstands.
    explanation: Der Durchgangsprüfer piept, wenn der Widerstand sehr klein ist, etwa unter 50 Ω. So findest du Kabelbrüche schnell.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Welche Stellung brauchst du?
    params:
      buckets:
        - id: b1
          label: V⎓
        - id: b2
          label: V~
        - id: b3
          label: Ω / Durchgang
      items:
        - label: Spannung einer Steckdose
          bucket: b2
        - label: Spannung eines Handy-Akkus
          bucket: b1
        - label: Ist die Sicherung durchgebrannt?
          bucket: b3
        - label: Wert eines ausgebauten Widerstands
          bucket: b3
        - label: Ausgang eines USB-Ladegeräts
          bucket: b1
        - label: Kabelbruch im Ladekabel suchen
          bucket: b3
    hints:
      - Steckdosen liefern Wechselspannung.
      - Sicherung und Kabel prüft man stromlos auf Durchgang.
    explanation: Akku und USB sind Gleichspannung, die Steckdose Wechselspannung. Sicherung, Kabel und Widerstand prüfst du ohne Spannung im Ω-Bereich.

  - kind: problem
    id: c4
    widget: choice
    prompt: Du misst eine Spannung. Die rote Leitung steckt noch in der A-Buchse. Was passiert?
    params:
      options:
        - label: Kurzschluss über das Messgerät – die interne Sicherung brennt durch
          correct: true
        - label: Nichts, das Gerät erkennt das
          feedback: Die A-Buchse hat fast keinen Widerstand.
        - label: Es zeigt die Spannung in Ampere
          feedback: Es fließt ein riesiger Strom.
    hints:
      - Wie groß ist der Widerstand zwischen A und COM?
      - Fast null Ohm direkt an einer Quelle heißt Kurzschluss.
    explanation: Zwischen A und COM liegt ein winziger Messwiderstand. An einer Quelle fließt sofort ein riesiger Strom. Gute Geräte haben deshalb eine flinke Sicherung.

  - kind: explain
    id: d1
    depth: 2
    body: Der **Messbereich** ist der größte Wert, den eine Stellung anzeigen kann. Wähle den kleinsten Bereich, der noch reicht. Ist er zu klein, zeigt das Gerät »OL« für Überlauf.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Multimeter zeigt höchstens 1999 Einheiten an. Welche kleinste Stufe hat es im {{r}}-V-Bereich?
    params:
      unit: V
    answer:
      value: "{{r / 2000}}"
    hints:
      - Der Bereich wird in rund 2000 Stufen geteilt.
      - "{{r}} V : 2000."
    explanation: "{{r}} V : 2000 = {{r / 2000}} V. Im kleineren Bereich siehst du feinere Stufen."
    difficulty: 2
    variants:
      params:
        r: choice[2,20,200]
      defaults:
        r: 20

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Du misst 9 V im 2-V-Bereich. Was zeigt das Gerät?
    params:
      options:
        - label: »OL« oder eine einzelne 1 für Überlauf
          correct: true
        - label: 9,00
          feedback: Mehr als 1,999 V passen nicht in den 2-V-Bereich.
        - label: 0,00
          feedback: Das Gerät sieht eine Spannung, kann sie aber nicht darstellen.
    hints:
      - Was ist der größte Wert im 2-V-Bereich?
      - 9 V ist mehr als 1,999 V.
    explanation: Der Wert liegt über dem Bereich. Dann schaltest du hoch auf 20 V. Geräte mit Autorange machen das selbst.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: match
    prompt: "Messkategorien: Wo darf ein Gerät mit dieser Angabe messen?"
    params:
      pairs:
        - left: CAT II
          right: Geräte an der Steckdose
        - left: CAT III
          right: Verteiler im Gebäude
        - left: CAT IV
          right: Hausanschluss und Zähler
      leftTitle: Kategorie
      rightTitle: Einsatzort
    hints:
      - Je näher an der Quelle, desto höher die Kategorie.
      - Der Hausanschluss liegt ganz vorn.
    explanation: Nahe der Quelle sind Überspannungsspitzen viel energiereicher. Ein CAT-II-Gerät im Zählerkasten kann explodieren.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Warum misst du den Widerstand eines Bauteils nicht, während die Schaltung eingeschaltet ist?
    params:
      options:
        - label: Das Ohmmeter schickt eigenen Messstrom; fremde Spannung verfälscht oder zerstört es
          correct: true
        - label: Weil Widerstände nur kalt einen Wert haben
          feedback: Die Temperatur spielt kaum eine Rolle.
        - label: Weil man dann zu viele Nachkommastellen bekommt
          feedback: Es geht um das Messprinzip.
    hints:
      - Wie misst ein Ohmmeter?
      - Es misst die Spannung bei einem bekannten kleinen Strom.
    explanation: "Das Ohmmeter rechnet R = U : I mit seinem eigenen kleinen Strom. Jede fremde Spannung stört die Rechnung. Auch parallele Wege in der Schaltung verfälschen den Wert."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux Schritt für Schritt, wie man mit einem Multimeter sicher eine Batteriespannung misst.
    params:
      keywords:
        - - com
          - schwarz
          - black
        - - rot
          - red
          - v-buchse
          - v socket
        - - bereich
          - range
          - 20 v
          - stellung
          - setting
        - - parallel
          - pole
          - terminal
          - anlegen
          - touch
          - plus
      sample: Schwarze Leitung in COM, rote in V. Schalter auf V⎓ und einen Bereich über der erwarteten Spannung, etwa 20 V. Dann die Spitzen parallel an Plus und Minus der Batterie halten und ablesen.
    explanation: "Kern: richtige Buchsen, richtige Größe, passender Bereich, parallel anlegen."
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "d3"]
