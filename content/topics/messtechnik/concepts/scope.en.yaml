id: ee.measure.scope
type: concept
title: "The oscilloscope"
summary: "Seeing voltage over time: count divisions, find frequency, probes and bandwidth."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Watching voltage dance
    body: "With an **oscilloscope**, engineers look inside lightning-fast signals. This screen shows 10 ms. Turn the amplitude and frequency: how high do the peaks get, and how many waves fit in?"
    visual:
      widget: slider
      interactive: true
      params:
        expr: a*sin(2*pi*f*x/1000)
        x:
          - 0
          - 10
        y:
          - -6
          - 6
        showCoordinates: false
        sliders:
          - id: a
            label: Amplitude in V
            min: 1
            max: 5
            step: 0.5
            initial: 2
          - id: f
            label: Frequency in Hz
            min: 100
            max: 1000
            step: 100
            initial: 200

  - kind: problem
    id: hook
    widget: choice
    prompt: A multimeter just shows “230 V” at a socket. What extra does an oscilloscope show?
    params:
      options:
        - label: How the voltage changes from moment to moment
          correct: true
        - label: A more precise number
          feedback: Not more precise, but as a picture over time.
        - label: The current instead of the voltage
          feedback: An oscilloscope measures voltage.
    hints:
      - The multimeter shows one value.
      - The oscilloscope draws a curve.
    explanation: "It draws the sine curve: peaks, zero crossings, glitches. A multimeter squeezes all that into a single number."

  - kind: explain
    id: c1
    body: An **oscilloscope** plots voltage over time. The screen has a grid of divisions. Vertically you set volts per division, horizontally time per division. Then you simply count divisions.

  - kind: problem
    id: c2
    widget: numeric
    prompt: The peak of a curve lies {{k}} divisions above the centre line. The setting is {{v}} V per division. What is the peak voltage?
    params:
      unit: V
    answer:
      value: "{{k * v}}"
    hints:
      - Divisions times volts per division.
      - "{{k}} × {{v}}."
    explanation: "{{k}} × {{v}} V = {{k * v}} V."
    variants:
      params:
        k: choice[2,3,4,2.5]
        v: choice[0.5,1,2,5]
      defaults:
        k: 3
        v: 2

  - kind: problem
    id: c3
    widget: numeric
    prompt: One period is {{k}} divisions wide at {{t}} ms per division. What is the signal’s frequency?
    params:
      unit: Hz
    answer:
      value: "{{1000 / (k * t)}}"
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - k * t) < 0.1
        misconception: period-not-freq
        text: That is the period in ms. The frequency is its reciprocal.
    hints:
      - Period T = {{k}} × {{t}} ms.
      - f = 1 ÷ T, with T in seconds.
    explanation: T = {{k * t}} ms, so f = 1000 ÷ {{k * t}} = {{round(1000 / (k * t), 1)}} Hz.
    variants:
      params:
        k: choice[4,5,8,10]
        t: choice[1,2,5]
      defaults:
        k: 4
        t: 5

  - kind: problem
    id: c4
    widget: sim
    prompt: Set the signal so that one period lasts exactly 0.5 s.
    params:
      scene: wave
      show:
        - period
    answer:
      period: 0.5
    explanation: "A 0.5 s period means 2 cycles per second: f = 2 Hz."

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: The screen (10 ms) should show exactly 5 full periods. Set the frequency.
    params:
      expr: a*sin(2*pi*f*x/1000)
      x:
        - 0
        - 10
      y:
        - -6
        - 6
      showCoordinates: false
      sliders:
        - id: a
          label: Amplitude in V
          min: 1
          max: 5
          step: 0.5
          initial: 2
        - id: f
          label: Frequency in Hz
          min: 100
          max: 1000
          step: 100
          initial: 200
    answer:
      values:
        f: 500
    hints:
      - "5 periods in 10 ms: how long does one take?"
      - T = 2 ms, and f = 1 ÷ T.
    explanation: T = 10 ms ÷ 5 = 2 ms, so f = 1 ÷ 0.002 s = 500 Hz. The amplitude plays no part.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The picture on the oscilloscope keeps scrolling and flickering. What do you adjust?
    params:
      options:
        - label: "The trigger: it starts each sweep at the same point of the curve"
          correct: true
        - label: Volts per division
          feedback: That only changes the height.
        - label: The probe tip
          feedback: The signal is there, it just doesn’t stand still.
    hints:
      - Each new sweep must start at the same spot.
      - For example whenever the curve crosses 0 V going up.
    explanation: The trigger waits until the signal crosses a threshold in one direction, then draws. That makes periodic signals stand still.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "A probe divides 10 : 1. The oscilloscope is set to 1 : 1 and shows 1.2 V. What is the real voltage?"
    params:
      unit: V
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 0.12
        misconception: direction
        text: The probe makes the signal smaller. The real voltage is larger.
    hints:
      - The probe passes only a tenth.
      - 1.2 V × 10.
    explanation: "1.2 V × 10 = 12 V. A 10:1 probe loads the circuit ten times less: about 10 MΩ instead of 1 MΩ."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An oscilloscope has 100 MHz bandwidth. At that frequency it shows only 70.7 % of the amplitude. How tall does a 2 V sine at 100 MHz appear? To two decimal places.
    params:
      unit: V
    answer:
      value: 1.41
      tolerance: 0.01
    hints:
      - 70.7 % of 2 V.
      - 2 × 0.707.
    explanation: "2 × 0.707 ≈ 1.41 V. Rule of thumb: the bandwidth should be at least five times the highest signal frequency."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: The fastest rise time an oscilloscope can show is about 0.35 ÷ bandwidth. How many ns is that at 350 MHz?
    params:
      unit: ns
    answer:
      value: 1
      tolerance: 0.01
    hints:
      - 0.35 ÷ 350,000,000 Hz in seconds.
      - 1 ns = 0.000000001 s.
    explanation: 0.35 ÷ 350 MHz = 1 ns. Faster edges appear smeared out.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how to find a signal’s frequency with an oscilloscope.
    params:
      keywords:
        - - kästchen
          - kaestchen
          - division
          - raster
          - grid
        - - zeit
          - time
          - ms
          - zeitbasis
          - timebase
        - - periode
          - period
          - schwingung
          - cycle
        - - kehrwert
          - reciprocal
          - "1 :"
          - 1/
          - geteilt
          - divide
      sample: "I count how many divisions one period spans and multiply by the time per division. That gives the period T. The frequency is the reciprocal: f = 1 ÷ T."
    explanation: "The core: count divisions, read the period, take the reciprocal. Many scopes also do this automatically."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
