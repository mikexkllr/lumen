id: logic.fallacies.mixed
type: concept
title: Fehlschluss-Detektiv
summary: Alle Tricks im Mix.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Im Kreis gedacht
    body: Manche Begründungen klingen solide und drehen sich doch nur **im Kreis**. Deck die Karten der Reihe nach auf und folge dem Gespräch. Merkst du, wo es hakt?
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🙋
            front: Ist er ehrlich?
            back: »Ja, er ist ehrlich – das hat er mir selbst gesagt.«
          - icon: 🤔
            front: Warum glaubst du ihm?
            back: »Weil er die Wahrheit sagt.«
          - icon: 🔍
            front: Woher weißt du das?
            back: »Na, weil er ehrlich ist.«
          - icon: 🔁
            front: Zurück zum Anfang
            back: "Der Grund setzt voraus, was er beweisen soll: ein Zirkelschluss. Er dreht sich endlos."

  - kind: problem
    id: zuordnen
    widget: match
    prompt: Welcher Fehlschluss steckt im Satz?
    params:
      pairs:
        - { left: »Hat nicht mal studiert.«, right: Angriff auf Person }
        - { left: »Ganz oder gar nicht!«, right: Falsches Dilemma }
        - { left: »Seit dem Mast bin ich müde.«, right: Scheinursache }
        - { left: »Alle machen das so.«, right: Mehrheits-Appell }
    hints:
      - Achte darauf, wovon der Satz ablenkt.
    explanation: Wer die Muster kennt, erkennt sie überall – in Werbung, Politik und Streit.

  - kind: problem
    id: werbung
    widget: choice
    prompt: »9 von 10 Zahnärzten empfehlen …« Was fragst du dich zuerst?
    params:
      options:
        - { label: Wie viele wurden gefragt und wie wurde ausgewählt?, correct: true }
        - { label: Gar nichts – 90 % sind überzeugend., feedback: "Zehn handverlesene Zahnärzte wären kein Beweis." }
    hints:
      - Wer waren die zehn?
    explanation: Die Stichprobe entscheidet, ob eine Zahl etwas bedeutet.

  - kind: problem
    id: selbst
    widget: choice
    prompt: Welche Haltung schützt am besten vor Fehlschlüssen?
    params:
      options:
        - { label: Auch eigene Lieblingsmeinungen prüfen, correct: true }
        - { label: Nur die Argumente der Gegenseite prüfen, feedback: "Am leichtesten übersieht man Fehler, die einem gefallen." }
    hints:
      - Wo schauen wir am wenigsten genau hin?
    explanation: Kritisches Denken beginnt bei den eigenen Überzeugungen.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Frag bei jedem Argument: Stützen die [[Gründe]] wirklich den [[Schluss]]?"
      distractors:
        - Gefühle
        - Sprecher

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: »Niemand hat bewiesen, dass es keine Geister gibt – also gibt es sie.« Was ist das?
    params:
      options:
        - label: Ein Argument aus Unwissenheit – die Beweislast wird umgekehrt
          correct: true
        - label: Ein Dammbruch-Argument
          feedback: Es gibt keine Kette von Schritten.
        - label: Ein gültiger Schluss
          feedback: Fehlender Gegenbeweis ist kein Beweis.
    hints:
      - Wer muss eine Behauptung belegen?
    explanation: Wer etwas behauptet, trägt die **Beweislast**. Sonst müsste man auch an unsichtbare Einhörner glauben.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: match
    prompt: Welcher Denkfehler steckt dahinter?
    params:
      pairs:
        - left: »Die Zeitung lügt nie, sagt sie.«
          right: Zirkelschluss
        - left: »Natürlich, also gesund.«
          right: Natürlichkeits-Appell
        - left: »8-mal Rot – jetzt kommt Schwarz!«
          right: Spielerfehlschluss
        - left: »Weniger Zucker? Also Kuchenverbot!«
          right: Strohmann
      leftTitle: Satz
      rightTitle: Denkfehler
    hints:
      - Achte darauf, was jeweils vorausgesetzt oder verdreht wird.
      - Beim Zirkelschluss steckt das Ergebnis schon in der Begründung.
    explanation: "Zirkelschluss: Das Ergebnis begründet sich selbst. Natur ist nicht automatisch gut (Knollenblätterpilze sind natürlich). Das Rad hat kein Gedächtnis. Der Strohmann verzerrt die Position."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Beim Roulette kam achtmal hintereinander Rot. Was ist beim nächsten Dreh wahrscheinlicher?
    params:
      options:
        - label: Keins von beiden – die Chancen sind dieselben wie immer.
          correct: true
        - label: Schwarz, es muss sich ausgleichen.
          feedback: Die Kugel weiß nichts von früheren Drehs. Ausgleich gibt es nur im Durchschnitt über sehr viele Drehs.
        - label: Rot, das Rad ist gerade heiß.
          feedback: Bei einem fairen Rad ist auch das ein Irrtum.
    hints:
      - Hängt ein Dreh vom vorigen ab?
      - Bei unabhängigen Ereignissen bleibt die Wahrscheinlichkeit gleich.
    explanation: Die Drehs sind **unabhängig**. Rot und Schwarz haben je 18 von 37 Feldern – vorher wie nachher. Der Glaube an einen Ausgleich heißt Spielerfehlschluss.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux zwei Denkfehler, auf die du in Zukunft achten willst – mit je einem Beispiel.
    params:
      keywords:
        - - person
          - autorität
          - mehrheit
          - authority
          - majority
          - strohmann
          - straw
        - - ursache
          - zusammenhang
          - danach
          - cause
          - correlat
          - after
        - - beispiel
          - etwa
          - zum beispiel
          - example
          - such as
          - instance
          - einzelfall
      min: 2
      sample: "Erstens der Angriff auf die Person: Ein Argument wird nicht falsch, nur weil ich den Sprecher nicht mag. Zweitens die Scheinursache: Dass etwas danach passiert, heißt nicht deswegen – zum Beispiel beim Glückshemd."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Jemand begründet »Rauchen schadet« mit einem schlechten Argument. Was folgt daraus?
    params:
      options:
        - label: Nur, dass dieses Argument nichts zeigt – die Aussage kann trotzdem wahr sein.
          correct: true
        - label: Dass Rauchen nicht schadet.
          feedback: Ein schlechter Grund macht die Aussage nicht falsch.
        - label: Dass man nie über Rauchen reden sollte.
          feedback: Man sollte bessere Gründe suchen – nicht schweigen.
    hints:
      - Was beweist ein Fehlschluss – über das Argument und über die Aussage?
      - Kann eine wahre Aussage schlecht begründet sein?
    explanation: "Wer aus einem Fehlschluss folgert, die Aussage sei falsch, begeht selbst einen: den **Fehlschluss-Fehlschluss**. Ein schwaches Argument entfernt nur einen Grund – nicht die Wahrheit."
    difficulty: 3

srs:
  cards_from: [zuordnen, werbung]
