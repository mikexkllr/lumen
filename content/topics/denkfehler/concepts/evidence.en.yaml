id: logic.fallacies.evidence
type: concept
title: Single Cases and Cherry-Picking
summary: Anecdotes instead of data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: opa
    widget: choice
    prompt: "“My grandpa smoked and lived to 95. So smoking is not harmful.” What is the problem?"
    params:
      options:
        - { label: A single case does not refute statistics covering millions., correct: true }
        - { label: None – grandpa proves it., feedback: "Some people have also survived a fall from a plane." }
    hints:
      - How many smokers do not reach 95?
    explanation: Anecdotes stick in memory – but data on many people counts.

  - kind: explain
    body: |
      **Cherry-picking** means showing only the evidence that fits and hiding the rest. If you only hear success stories, you get a completely false picture.

  - kind: problem
    id: rosinen
    widget: choice
    prompt: A fund advertises its three best years ever. What is missing?
    params:
      options:
        - { label: The bad years and the average, correct: true }
        - { label: Nothing – three good years are enough., feedback: "Without the other years, you cannot tell how good it was overall." }
    hints:
      - What was left out?
    explanation: Good decisions need the whole picture.

  - kind: problem
    id: belege
    widget: buckets
    prompt: Strong or weak evidence?
    params:
      buckets: [{ label: strong }, { label: weak }]
      items:
        - { label: Study with thousands of participants, bucket: strong }
        - { label: Several independent studies, bucket: strong }
        - { label: A friend's personal account, bucket: weak }
        - { label: Selected customer testimonials, bucket: weak }
    hints:
      - How many cases are behind it, and was it selected?
    explanation: Many independent cases beat any story, however good.

srs:
  cards_from: [opa, rosinen]
