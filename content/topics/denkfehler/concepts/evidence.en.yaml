id: logic.fallacies.evidence
type: concept
title: Single Cases and Cherry-Picking
summary: Anecdotes instead of data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: opa
    widget: choice
    prompt: "“My grandpa smoked and lived to 95. So smoking is not harmful.” What is the problem?"
    params:
      options:
        - { label: A single case does not refute statistics covering millions., correct: true }
        - { label: None – grandpa proves it., feedback: "Some people have also survived a fall from a plane." }
    hints:
      - How many smokers do not reach 95?
    explanation: Anecdotes stick in memory – but data on many people counts.

  - kind: explain
    id: s2
    body: |
      **Cherry-picking** means showing only the evidence that fits and hiding the rest. If you only hear success stories, you get a completely false picture.

  - kind: problem
    id: rosinen
    widget: choice
    prompt: A fund advertises its three best years ever. What is missing?
    params:
      options:
        - { label: The bad years and the average, correct: true }
        - { label: Nothing – three good years are enough., feedback: "Without the other years, you cannot tell how good it was overall." }
    hints:
      - What was left out?
    explanation: Good decisions need the whole picture.

  - kind: problem
    id: belege
    widget: buckets
    prompt: Strong or weak evidence?
    params:
      buckets: [{ label: strong }, { label: weak }]
      items:
        - { label: Study with thousands of participants, bucket: strong }
        - { label: Several independent studies, bucket: strong }
        - { label: A friend's personal account, bucket: weak }
        - { label: Selected customer testimonials, bucket: weak }
    hints:
      - How many cases are behind it, and was it selected?
    explanation: Many independent cases beat any story, however good.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Strong or weak evidence?
    params:
      buckets:
        - id: b1
          label: Strong
        - id: b2
          label: Weak
      items:
        - label: Study with 10,000 randomly chosen people
          bucket: b1
        - label: “My grandpa smoked and lived to 95.”
          bucket: b2
        - label: Three hand-picked success stories
          bucket: b2
        - label: All data, including what does not fit
          bucket: b1
    hints:
      - Many random cases – or a few chosen ones?
    explanation: Single cases are vivid but they prove little.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "[[Cherry-picking]] means: showing only the evidence that fits and hiding the [[rest]]."
      distractors:
        - Generalising
        - start

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: You believe the full moon makes people restless. Which nights do you remember especially well?
    params:
      options:
        - label: The restless full-moon nights – calm ones go unnoticed
          correct: true
        - label: All equally well
          feedback: Memory is selective.
        - label: None
          feedback: Fitting cases stick.
    hints:
      - What fits a belief is remembered more easily.
    explanation: "**Confirmation bias**: we seek out and remember what supports our view."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: In wartime, people counted bullet holes on planes that came back – mostly on the wings. Where should the armour be strengthened?
    params:
      options:
        - label: Where the returning planes had **no** holes – for example at the engine.
          correct: true
        - label: On the wings, where most holes are.
          feedback: These planes made it back despite the holes, so hits there were survivable.
        - label: Equally everywhere.
          feedback: Armour is heavy and costly – it is needed where hits are deadly.
    hints:
      - Which planes are missing from the count?
      - Where were the ones hit that never came back?
    explanation: Only the survivors were visible. Planes hit in the engine crashed and never appeared in the data. This error is called survivorship bias.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: A fund advertises three years of +20 % each. In the other 7 of 10 years it made −5 % each. What is the average per year in percent?
    answer:
      value: 2.5
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 20
        misconception: cherry
        text: Those are only the best years – exactly the cherries.
    hints:
      - "Add up all 10 years: 3 · 20 and 7 · (−5)."
      - (60 − 35) / 10 = ?
    explanation: (60 − 35) / 10 = 2.5 % – far from the advertised 20 %. (Computed exactly with compounding it would be even a little less.)
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How do you test a belief of your own most honestly?
    params:
      options:
        - label: Deliberately look for evidence that could **refute** it
          correct: true
        - label: Collect as many confirming examples as possible
          feedback: Confirmations can be found for almost anything.
        - label: Ask friends who think the same
          feedback: That only reinforces the bubble.
    hints:
      - A thousand white swans do not prove all are white. One black swan refutes it.
    explanation: "Karl Popper’s **falsification**: a good thesis states clearly what would refute it."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Researchers test 100 foods for a link to a disease. In truth none has an effect. Each test fires by chance with 5 % probability. How many "hits" do you expect?
    answer:
      value: 5
    hints:
      - "Expected value: number of tests times probability."
      - 100 · 0.05 = ?
    explanation: On average 5 chance hits. Reporting only those is painting the target around the bullet holes. Serious studies fix in advance what they test and correct for multiple tests.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why a single case does not disprove a statistic.
    params:
      keywords:
        - - einzel
          - ein fall
          - eine person
          - single
          - one case
          - one person
        - - durchschnitt
          - meisten
          - häufig
          - wahrscheinlich
          - average
          - most
          - likely
          - often
        - - statistik
          - viele
          - daten
          - statistic
          - many
          - data
      sample: A statistic says what happens to many people on average. A single case can still turn out differently. Smoking makes cancer more likely, not certain.
    difficulty: 3

srs:
  cards_from: [opa, rosinen]
