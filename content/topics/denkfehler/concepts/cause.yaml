id: logic.fallacies.cause
type: concept
title: Danach heißt nicht deswegen
summary: Scheinursachen erkennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Störche bringen Babys?
    body: "Zwei Dinge passieren oft zusammen – also hängt das eine vom anderen ab? Nicht unbedingt. Deck die Karten auf: Hinter jedem Paar steckt eine andere **Erklärung** als die naheliegende."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐦
            front: Störche und Babys
            back: Wo mehr Störche nisten, kommen oft mehr Babys zur Welt. Beides ist auf dem Land häufiger.
          - icon: 🍫
            front: Schokolade und Nobelpreise
            back: Länder, die viel Schokolade essen, haben mehr Nobelpreisträger. Klug macht sie trotzdem nicht.
          - icon: 🎬
            front: Filme und Pools
            back: Eine Zeit lang passten Filme mit Nicolas Cage und Unfälle im Pool erstaunlich gut zusammen. Purer Zufall.
          - icon: 👟
            front: Schuhe im Bett
            back: "Wer mit Schuhen schläft, wacht oft mit Kopfweh auf. Die wahre Ursache: ein langer Abend davor."

  - kind: problem
    id: hemd
    widget: choice
    prompt: Seit ich mein Glückshemd trage, gewinnt meine Mannschaft öfter. Bringt das Hemd Glück?
    params:
      options:
        - { label: Nein – danach heißt nicht deswegen., correct: true }
        - { label: Ja – die Siege beweisen es., feedback: "Die Siege hätten auch ohne Hemd kommen können – es fehlt ein Mechanismus und ein Vergleich." }
    hints:
      - Gibt es einen plausiblen Weg, wie ein Hemd ein Spiel beeinflusst?
    explanation: Zeitliche Abfolge allein beweist keine Ursache.

  - kind: explain
    id: s2
    body: |
      Zwei Dinge können gemeinsam auftreten, weil eine **dritte Ursache** beide bewirkt, weil die Ursache **andersherum** wirkt oder einfach durch **Zufall**. Erst Vergleiche und Experimente klären das.

  - kind: problem
    id: dritte
    widget: choice
    prompt: Im Sommer steigen Eisverkäufe und Sonnenbrände. Macht Eis Sonnenbrand?
    params:
      options:
        - { label: Nein – das sonnige Wetter verursacht beides., correct: true }
        - { label: Ja, feedback: "Es gibt eine gemeinsame Ursache – die Sonne." }
    hints:
      - Was steckt hinter beidem?
    explanation: Eine dritte Größe kann zwei Dinge zugleich antreiben.

  - kind: problem
    id: richtung
    widget: choice
    prompt: Menschen in Krankenhäusern sind öfter krank als andere. Machen Krankenhäuser krank?
    params:
      options:
        - { label: "Nein – Kranke gehen ins Krankenhaus, nicht umgekehrt.", correct: true }
        - { label: Ja, feedback: "Die Ursache wirkt hier andersherum." }
    hints:
      - Was war zuerst da?
    explanation: Die Richtung des Zusammenhangs ist oft umgekehrt, als man denkt.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Was steckt wirklich hinter dem Zusammenhang?
    params:
      buckets:
        - id: b1
          label: Dritte Ursache
        - id: b2
          label: Richtung umgekehrt
        - id: b3
          label: Zufall
      items:
        - label: Mehr Eis, mehr Badeunfälle
          bucket: b1
        - label: Im Krankenhaus sind mehr Kranke
          bucket: b2
        - label: Große Füße, besseres Lesen (Kinder)
          bucket: b1
        - label: Mehr Käse, mehr Lottogewinne
          bucket: b3
    hints:
      - Sommer, Krankheit, Alter – oder gar nichts?
    explanation: Die Hitze, die Krankheit und das Alter erklären drei der Fälle. Der vierte ist bloßer Zufall.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Aus »danach« folgt nicht »[[deswegen]]«. Zwei Dinge können auch durch eine [[dritte]] Ursache zusammenhängen.
      distractors:
        - trotzdem
        - erste

  - kind: problem
    id: mix-c3
    widget: order
    prompt: Wie prüft man, ob A wirklich B bewirkt? Ordne die Schritte.
    params:
      items:
        - label: Einen Zusammenhang bemerken
        - label: Andere Erklärungen sammeln
        - label: Ein Experiment mit Zufallsgruppen machen
        - label: Andere das Ergebnis wiederholen lassen
    hints:
      - Erst zweifeln, dann testen, dann bestätigen lassen.
    explanation: Erst das Experiment trennt Ursache von bloßem Zusammentreffen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In Städten mit mehr Feuerwehrleuten gibt es mehr Brandschäden. Sollte man Feuerwehrleute entlassen?
    params:
      options:
        - label: "Nein – große Städte haben beides: mehr Brände und mehr Feuerwehr"
          correct: true
        - label: Ja – weniger Feuerwehr heißt weniger Schaden
          feedback: Das verwechselt Ursache und gemeinsame Ursache.
        - label: Vielleicht – das müsste man ausprobieren
          feedback: Die dritte Größe erklärt es vollständig.
    hints:
      - Was beeinflusst beides?
    explanation: Die Größe der Stadt ist die versteckte dritte Ursache.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Nach der Impfung bekam er Schnupfen. Also war es die Impfung.
          right: false
          why: Danach heißt nicht deswegen.
        - text: Im Zufallsversuch hilft das Mittel besser als ein Placebo.
          right: true
        - text: Seit ich den Glücksbringer trage, gewinne ich.
          right: false
        - text: Schaltet man die Pumpe ab, fällt der Druck – jedes Mal.
          right: true
      left: Kein Beleg
      right: Guter Beleg
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Ein Trainer schimpft nur nach sehr schlechten Spielen. Danach spielt das Team meist besser. Beweist das, dass Schimpfen hilft?
    params:
      options:
        - label: Nein – nach einem Ausreißer nach unten folgt oft von selbst ein normaleres Spiel.
          correct: true
        - label: Ja, das Team zeigt ja eine Reaktion.
          feedback: Ohne Vergleich weiß man nicht, ob es ohne Schimpfen genauso gekommen wäre.
        - label: Nein, Schimpfen schadet immer.
          feedback: Auch das folgt aus den Daten nicht.
    hints:
      - Ein sehr schlechtes Spiel ist selten. Was ist danach wahrscheinlicher?
      - Auch ohne Trainer würde das nächste Spiel eher durchschnittlich werden.
    explanation: Das ist die **Regression zur Mitte**. Extreme Werte enthalten viel Zufall, darum liegt der nächste Wert meist näher am Durchschnitt. Ob das Schimpfen wirkt, zeigt nur ein Vergleich.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Menschen mit Fitnessarmband sind im Schnitt sportlicher. Was ist eine plausible andere Erklärung als »das Armband macht sportlich«?
    params:
      options:
        - label: Wer ohnehin Sport treibt, kauft eher ein Armband.
          correct: true
        - label: Die Armbänder messen falsch.
          feedback: Selbst bei richtigen Messungen bliebe die Frage, was Ursache ist.
        - label: Es gibt keine andere Erklärung.
          feedback: "Doch: Die Wirkung kann andersherum laufen."
    hints:
      - Wer entscheidet sich eher für so ein Armband?
      - Könnte die Sportlichkeit das Armband »verursachen«?
    explanation: "Die Ursache kann **umgekehrt** wirken: Sportlichkeit führt zum Kauf. Klarheit bringt nur ein Versuch, bei dem das Los entscheidet, wer ein Armband bekommt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: »Nach der Impfung bekam das Kind Fieber – also hat die Impfung das Fieber verursacht.« Wie prüft man das wirklich?
    params:
      options:
        - label: "Mit einer Vergleichsgruppe: Bekommen Ungeimpfte im selben Zeitraum genauso oft Fieber?"
          correct: true
        - label: Gar nicht – der zeitliche Zusammenhang genügt
          feedback: Kinder haben oft Fieber, auch ohne Impfung.
        - label: Indem man viele solche Berichte sammelt
          feedback: Auch tausend Einzelfälle ohne Vergleich beweisen nichts.
    hints:
      - Was wäre ohne die Impfung passiert?
    explanation: "Die Frage nach dem **Kontrafaktischen**: Ursache ist, was den Unterschied macht."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Behandlung A heilt kleine Nierensteine zu 93 %, große zu 73 %. B schafft 87 % und 69 %. Insgesamt heilt aber B mehr: 83 % gegen 78 %. Wie ist das möglich?"
    params:
      options:
        - label: A wurde meist bei den schweren, großen Steinen eingesetzt.
          correct: true
        - label: Die Zahlen müssen falsch sein.
          feedback: Sie stammen aus einer echten Studie – und passen zusammen.
        - label: B ist eben doch besser.
          feedback: In jeder Gruppe einzeln ist A besser.
    hints:
      - Wie viele Patienten mit großen Steinen bekamen A, wie viele B?
      - Große Steine sind schwerer zu heilen. Wer mehr davon behandelt, sieht insgesamt schlechter aus.
    explanation: Das ist das **Simpson-Paradox**. Die Steingröße beeinflusst Wahl und Erfolg zugleich. Die Gesamtzahlen vermischen ungleiche Gruppen. Darum vergleicht man innerhalb der Gruppen – oder lost zu.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum zwei Dinge zusammen auftreten können, ohne dass eins das andere verursacht.
    params:
      keywords:
        - - dritte
          - gemeinsam
          - beide
          - third
          - common
          - both
        - - umgekehrt
          - andersherum
          - reverse
          - other way
        - - zufall
          - chance
          - coincidence
        - - vergleich
          - versuch
          - kontroll
          - comparison
          - experiment
          - control
      sample: Eine dritte Ursache kann beides bewirken, die Wirkung kann umgekehrt laufen, oder es ist Zufall. Erst ein fairer Vergleich mit Kontrollgruppe zeigt die Ursache.
    difficulty: 3

srs:
  cards_from: [hemd, dritte]
