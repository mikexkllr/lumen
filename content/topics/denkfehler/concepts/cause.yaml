id: logic.fallacies.cause
type: concept
title: Danach heißt nicht deswegen
summary: Scheinursachen erkennen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: hemd
    widget: choice
    prompt: Seit ich mein Glückshemd trage, gewinnt meine Mannschaft öfter. Bringt das Hemd Glück?
    params:
      options:
        - { label: Nein – danach heißt nicht deswegen., correct: true }
        - { label: Ja – die Siege beweisen es., feedback: "Die Siege hätten auch ohne Hemd kommen können – es fehlt ein Mechanismus und ein Vergleich." }
    hints:
      - Gibt es einen plausiblen Weg, wie ein Hemd ein Spiel beeinflusst?
    explanation: Zeitliche Abfolge allein beweist keine Ursache.

  - kind: explain
    id: s2
    body: |
      Zwei Dinge können gemeinsam auftreten, weil eine **dritte Ursache** beide bewirkt, weil die Ursache **andersherum** wirkt oder einfach durch **Zufall**. Erst Vergleiche und Experimente klären das.

  - kind: problem
    id: dritte
    widget: choice
    prompt: Im Sommer steigen Eisverkäufe und Sonnenbrände. Macht Eis Sonnenbrand?
    params:
      options:
        - { label: Nein – das sonnige Wetter verursacht beides., correct: true }
        - { label: Ja, feedback: "Es gibt eine gemeinsame Ursache – die Sonne." }
    hints:
      - Was steckt hinter beidem?
    explanation: Eine dritte Größe kann zwei Dinge zugleich antreiben.

  - kind: problem
    id: richtung
    widget: choice
    prompt: Menschen in Krankenhäusern sind öfter krank als andere. Machen Krankenhäuser krank?
    params:
      options:
        - { label: "Nein – Kranke gehen ins Krankenhaus, nicht umgekehrt.", correct: true }
        - { label: Ja, feedback: "Die Ursache wirkt hier andersherum." }
    hints:
      - Was war zuerst da?
    explanation: Die Richtung des Zusammenhangs ist oft umgekehrt, als man denkt.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In Städten mit mehr Feuerwehrleuten gibt es mehr Brandschäden. Sollte man Feuerwehrleute entlassen?
    params:
      options:
        - label: "Nein – große Städte haben beides: mehr Brände und mehr Feuerwehr"
          correct: true
        - label: Ja – weniger Feuerwehr heißt weniger Schaden
          feedback: Das verwechselt Ursache und gemeinsame Ursache.
        - label: Vielleicht – das müsste man ausprobieren
          feedback: Die dritte Größe erklärt es vollständig.
    hints:
      - Was beeinflusst beides?
    explanation: Die Größe der Stadt ist die versteckte dritte Ursache.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: »Nach der Impfung bekam das Kind Fieber – also hat die Impfung das Fieber verursacht.« Wie prüft man das wirklich?
    params:
      options:
        - label: "Mit einer Vergleichsgruppe: Bekommen Ungeimpfte im selben Zeitraum genauso oft Fieber?"
          correct: true
        - label: Gar nicht – der zeitliche Zusammenhang genügt
          feedback: Kinder haben oft Fieber, auch ohne Impfung.
        - label: Indem man viele solche Berichte sammelt
          feedback: Auch tausend Einzelfälle ohne Vergleich beweisen nichts.
    hints:
      - Was wäre ohne die Impfung passiert?
    explanation: "Die Frage nach dem **Kontrafaktischen**: Ursache ist, was den Unterschied macht."
    difficulty: 3

srs:
  cards_from: [hemd, dritte]
