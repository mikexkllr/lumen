id: logic.fallacies.person
type: concept
title: Wer etwas sagt
summary: Angriffe auf die Person und falsche Autorität.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Warum wir hereinfallen
    body: Werbung, Talkshows und Kommentare nutzen dieselben Tricks. Sie wirken, weil unser Kopf gern **Abkürzungen** nimmt. Deck die Karten auf und erfahre, warum wir darauf hereinfallen.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ✨
            front: Der Glanz-Effekt
            back: Wer berühmt oder schön ist, wirkt auf uns auch klüger. Ein gut erforschter Irrtum.
          - icon: 🐑
            front: Der Herdentrieb
            back: Was viele glauben, fühlt sich wahr an. Doch Mehrheiten haben sich schon oft geirrt.
          - icon: 😠
            front: Gefühl schlägt Grund
            back: Was uns ärgert oder begeistert, prüfen wir weniger genau.
          - icon: 🧠
            front: Die Abkürzung im Kopf
            back: »Wer sagt das?« ist schneller gefragt als »Stimmt das?«. Unser Gehirn liebt Abkürzungen.

  - kind: problem
    id: angriff
    widget: choice
    body: »Du willst mir etwas über gesunde Ernährung erzählen? Du isst doch selbst ständig Pommes!«
    prompt: Was ist das Problem an diesem Einwand?
    params:
      options:
        - { label: Er greift die Person an statt das Argument., correct: true }
        - { label: Er ist völlig berechtigt., feedback: "Ob jemand Pommes isst, sagt nichts darüber, ob seine Aussage stimmt." }
    hints:
      - Wird die Aussage selbst widerlegt?
    explanation: Ein Argument wird nicht falsch, weil die Person sich selbst nicht daran hält.

  - kind: explain
    id: s2
    body: |
      Ein Argument steht und fällt mit seinen **Gründen** – nicht damit, wer es vorbringt. Weder ein Angriff auf die Person noch ein berühmter Name macht eine Aussage wahr oder falsch.

  - kind: problem
    id: autoritaet
    widget: choice
    prompt: Ein berühmter Schauspieler empfiehlt ein Mittel gegen Erkältung. Wie viel Gewicht hat das?
    params:
      options:
        - { label: Wenig – er ist kein Fachmann für Medizin., correct: true }
        - { label: Viel – er ist sehr bekannt., feedback: "Bekanntheit ist keine Fachkenntnis." }
    hints:
      - Worin ist er Experte?
    explanation: Autorität zählt nur im eigenen Fachgebiet – und auch dort ersetzt sie keine Belege.

  - kind: problem
    id: mehrheit
    widget: choice
    prompt: »Millionen Menschen glauben daran, also muss es stimmen.« Was ist das?
    params:
      options:
        - { label: Ein Appell an die Mehrheit – kein Beweis, correct: true }
        - { label: Ein starkes Argument, feedback: "Früher glaubten Millionen, die Erde sei der Mittelpunkt des Universums." }
    hints:
      - Hatte die Mehrheit immer recht?
    explanation: Beliebtheit ist kein Beleg für Wahrheit.

  - kind: problem
    id: c1
    widget: match
    prompt: Welcher Fehlschluss ist das?
    params:
      pairs:
        - left: »Der hat keinen Abschluss.«
          right: Angriff auf die Person
        - left: »Ein Nobelpreisträger sagt das.«
          right: Falsche Autorität
        - left: »Das glauben doch alle.«
          right: Appell an die Mehrheit
        - left: »Das war schon immer so.«
          right: Appell an die Tradition
    hints:
      - Worauf stützt sich der Satz – auf Gründe oder auf etwas anderes?
    explanation: Keiner dieser Sätze nennt einen Grund, der die Sache selbst betrifft.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Worum geht es in dem Satz?
    params:
      buckets:
        - id: b1
          label: Angriff auf die Person
        - id: b2
          label: Berufung auf Autorität
        - id: b3
          label: Sachlicher Grund
      items:
        - label: »Das sagst ausgerechnet du!«
          bucket: b1
        - label: »Ein Nobelpreisträger sagt das auch.«
          bucket: b2
        - label: »Die Messung zeigt 5 % mehr.«
          bucket: b3
        - label: »Von dem lasse ich mir nichts sagen.«
          bucket: b1
        - label: »Die Studie hatte nur 8 Teilnehmer.«
          bucket: b3
    hints:
      - Geht es um die Sache – oder darum, wer spricht?
    explanation: Nur Gründe zur Sache können eine Behauptung stützen oder schwächen.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Argument steht und fällt mit seinen [[Gründen]] – nicht mit der [[Person]], die es vorbringt.
      distractors:
        - Folgen
        - Lautstärke

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Ärztin, die selbst raucht, rät dir vom Rauchen ab. Ist ihr Rat deshalb falsch?
    params:
      options:
        - label: Nein – ob Rauchen schadet, hängt nicht von ihrem Verhalten ab
          correct: true
        - label: Ja – sie hält sich ja selbst nicht daran
          feedback: Das macht sie vielleicht inkonsequent, aber nicht ihre Aussage falsch.
        - label: Das kann man nicht wissen
          feedback: Die Belege zum Rauchen sind eindeutig.
    hints:
      - Trenne die Aussage von der Person.
    explanation: "Der **Tu-quoque-Fehlschluss**: »Du machst es doch selbst« widerlegt kein Argument."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: swipe
    prompt: Fairer Einwand oder Angriff auf die Person?
    params:
      cards:
        - text: Er ist vorbestraft, also ist sein Vorschlag zur Steuer falsch.
          right: false
          why: Die Vorstrafe sagt nichts über die Steuer-Gründe.
        - text: Die Studie bezahlte der Hersteller – lass sie unabhängig prüfen.
          right: true
          why: Ein Interessenkonflikt ist ein guter Grund, genauer hinzusehen. Er widerlegt aber noch nichts.
        - text: Du isst selbst Fleisch, also zählt dein Argument für Tierschutz nicht.
          right: false
          why: Das ist »Du auch!« – das Argument steht unabhängig vom Verhalten.
        - text: Der Zeuge war in jener Nacht nachweislich gar nicht vor Ort.
          right: true
          why: Bei einer Zeugenaussage zählt, ob die Person etwas wissen kann.
      left: Fehlschluss
      right: fair
    explanation: Gründe prüft man an der Sache. Interessen und Zuverlässigkeit einer Person sind nur dann wichtig, wenn wir ihr etwas **glauben** sollen.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: »Diese Idee stammt von einem Diktator – also ist sie schlecht.« Was ist der Fehler?
    params:
      options:
        - label: Die Idee wird nach ihrer Herkunft beurteilt statt nach ihren Gründen.
          correct: true
        - label: Gar keiner – schlechte Menschen haben nur schlechte Ideen.
          feedback: Auch Diktatoren bauten Straßen oder Schulen. Jede Idee muss man selbst prüfen.
        - label: Ein Zirkelschluss.
          feedback: Hier setzt niemand das Ergebnis voraus – es wird nur die Quelle angegriffen.
    hints:
      - Was sagt die Herkunft einer Idee über ihre Folgen?
      - Welche Gründe für oder gegen die Idee selbst werden genannt?
    explanation: "Das heißt **genetischer Fehlschluss**: Man urteilt nach der Entstehung, nicht nach dem Inhalt. Eine Idee wird nicht besser oder schlechter, weil jemand sie hatte."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wann ist es **vernünftig**, sich auf eine Autorität zu berufen?
    params:
      options:
        - label: Wenn sie auf genau diesem Gebiet Fachwissen hat und die Fachwelt weitgehend zustimmt
          correct: true
        - label: Nie – das ist immer ein Fehlschluss
          feedback: Niemand kann alles selbst prüfen. Vertrauen in Fachleute ist oft klug.
        - label: Immer, wenn die Person berühmt ist
          feedback: Berühmtheit ist kein Fachwissen.
    hints:
      - Ein Physiker über Physik – oder über Ernährung?
    explanation: Der Fehler liegt nicht im Vertrauen, sondern im Vertrauen in die **falsche** Autorität.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Wann ist es **kein** Fehlschluss, die Person zu kritisieren?
    params:
      options:
        - label: Wenn wir nur ihrer Aussage glauben sollen – etwa als Zeugin.
          correct: true
        - label: Wenn sie unsympathisch ist.
          feedback: Sympathie sagt nichts über Wahrheit.
        - label: Nie – Kritik an Personen ist immer ein Fehlschluss.
          feedback: Bei Aussagen, die man nicht selbst prüfen kann, zählt die Glaubwürdigkeit.
    hints:
      - Unterscheide ein **Argument** (Gründe) von einer **Aussage**, der man vertraut.
      - Ein Argument kann man selbst prüfen. Einer Zeugin muss man glauben.
    explanation: Ein Argument trägt sich selbst – dort ist der Angriff auf die Person ein Fehler. Bei **Zeugnis** hängt alles an der Zuverlässigkeit der Quelle. Dann ist berechtigt, nach Interessen und Fehlern zu fragen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Angriff auf die Person ein Argument nicht widerlegt.
    params:
      keywords:
        - - gründe
          - grund
          - argument
          - reasons
          - reason
        - - person
          - wer
          - sprecher
          - who
          - speaker
        - - wahr
          - falsch
          - "true"
          - "false"
      sample: Ob ein Argument stimmt, hängt von seinen Gründen ab, nicht davon, wer es sagt. Auch ein unsympathischer Mensch kann recht haben. Man muss also die Gründe prüfen, um zu wissen, ob es wahr oder falsch ist.
    difficulty: 3

srs:
  cards_from: [angriff, mehrheit]
