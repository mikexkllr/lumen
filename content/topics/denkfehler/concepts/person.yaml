id: logic.fallacies.person
type: concept
title: Wer etwas sagt
summary: Angriffe auf die Person und falsche Autorität.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: angriff
    widget: choice
    body: »Du willst mir etwas über gesunde Ernährung erzählen? Du isst doch selbst ständig Pommes!«
    prompt: Was ist das Problem an diesem Einwand?
    params:
      options:
        - { label: Er greift die Person an statt das Argument., correct: true }
        - { label: Er ist völlig berechtigt., feedback: "Ob jemand Pommes isst, sagt nichts darüber, ob seine Aussage stimmt." }
    hints:
      - Wird die Aussage selbst widerlegt?
    explanation: Ein Argument wird nicht falsch, weil die Person sich selbst nicht daran hält.

  - kind: explain
    id: s2
    body: |
      Ein Argument steht und fällt mit seinen **Gründen** – nicht damit, wer es vorbringt. Weder ein Angriff auf die Person noch ein berühmter Name macht eine Aussage wahr oder falsch.

  - kind: problem
    id: autoritaet
    widget: choice
    prompt: Ein berühmter Schauspieler empfiehlt ein Mittel gegen Erkältung. Wie viel Gewicht hat das?
    params:
      options:
        - { label: Wenig – er ist kein Fachmann für Medizin., correct: true }
        - { label: Viel – er ist sehr bekannt., feedback: "Bekanntheit ist keine Fachkenntnis." }
    hints:
      - Worin ist er Experte?
    explanation: Autorität zählt nur im eigenen Fachgebiet – und auch dort ersetzt sie keine Belege.

  - kind: problem
    id: mehrheit
    widget: choice
    prompt: »Millionen Menschen glauben daran, also muss es stimmen.« Was ist das?
    params:
      options:
        - { label: Ein Appell an die Mehrheit – kein Beweis, correct: true }
        - { label: Ein starkes Argument, feedback: "Früher glaubten Millionen, die Erde sei der Mittelpunkt des Universums." }
    hints:
      - Hatte die Mehrheit immer recht?
    explanation: Beliebtheit ist kein Beleg für Wahrheit.

  - kind: problem
    id: c1
    widget: match
    prompt: Welcher Fehlschluss ist das?
    params:
      pairs:
        - left: »Der hat keinen Abschluss.«
          right: Angriff auf die Person
        - left: »Ein Nobelpreisträger sagt das.«
          right: Falsche Autorität
        - left: »Das glauben doch alle.«
          right: Appell an die Mehrheit
        - left: »Das war schon immer so.«
          right: Appell an die Tradition
    hints:
      - Worauf stützt sich der Satz – auf Gründe oder auf etwas anderes?
    explanation: Keiner dieser Sätze nennt einen Grund, der die Sache selbst betrifft.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Eine Ärztin, die selbst raucht, rät dir vom Rauchen ab. Ist ihr Rat deshalb falsch?
    params:
      options:
        - label: Nein – ob Rauchen schadet, hängt nicht von ihrem Verhalten ab
          correct: true
        - label: Ja – sie hält sich ja selbst nicht daran
          feedback: Das macht sie vielleicht inkonsequent, aber nicht ihre Aussage falsch.
        - label: Das kann man nicht wissen
          feedback: Die Belege zum Rauchen sind eindeutig.
    hints:
      - Trenne die Aussage von der Person.
    explanation: "Der **Tu-quoque-Fehlschluss**: »Du machst es doch selbst« widerlegt kein Argument."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wann ist es **vernünftig**, sich auf eine Autorität zu berufen?
    params:
      options:
        - label: Wenn sie auf genau diesem Gebiet Fachwissen hat und die Fachwelt weitgehend zustimmt
          correct: true
        - label: Nie – das ist immer ein Fehlschluss
          feedback: Niemand kann alles selbst prüfen. Vertrauen in Fachleute ist oft klug.
        - label: Immer, wenn die Person berühmt ist
          feedback: Berühmtheit ist kein Fachwissen.
    hints:
      - Ein Physiker über Physik – oder über Ernährung?
    explanation: Der Fehler liegt nicht im Vertrauen, sondern im Vertrauen in die **falsche** Autorität.
    difficulty: 3

srs:
  cards_from: [angriff, mehrheit]
