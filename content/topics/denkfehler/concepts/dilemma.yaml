id: logic.fallacies.dilemma
type: concept
title: Falsche Entweder-oder
summary: Scheinbare Alternativen und Dammbruch.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: entweder
    widget: choice
    body: »Entweder du bist für mein Projekt, oder du willst, dass die Firma scheitert.«
    prompt: Was stimmt an diesem Satz nicht?
    params:
      options:
        - { label: Es gibt mehr als diese zwei Möglichkeiten., correct: true }
        - { label: Nichts – so ist es eben., feedback: "Man kann das Projekt ablehnen und trotzdem den Erfolg der Firma wollen." }
    hints:
      - Gibt es eine dritte Haltung?
    explanation: Ein **falsches Dilemma** tut so, als gäbe es nur zwei Optionen.

  - kind: explain
    id: s2
    body: |
      Beim **Dammbruch-Argument** wird behauptet, ein kleiner Schritt führe zwangsläufig zur Katastrophe. Das kann stimmen – muss aber begründet werden, Schritt für Schritt.

  - kind: problem
    id: dammbruch
    widget: choice
    body: »Wenn wir Hausaufgaben am Wochenende erlauben, gibt es bald keine Freizeit mehr, und dann bricht die Gesellschaft zusammen.«
    prompt: Wie nennt man diesen Fehlschluss?
    params:
      options:
        - { label: Dammbruch-Argument, correct: true }
        - { label: Zirkelschluss, feedback: "Ein Zirkelschluss setzt voraus, was er beweisen will." }
    hints:
      - Ein kleiner Schritt soll unausweichlich ins Chaos führen.
    explanation: Jeder Schritt der Kette müsste belegt werden – hier wird er einfach behauptet.

  - kind: problem
    id: erkennen
    widget: buckets
    prompt: Fairer Einwand oder Fehlschluss?
    params:
      buckets: [{ label: fair }, { label: Fehlschluss }]
      items:
        - { label: Die Studie hatte nur 12 Teilnehmer., bucket: fair }
        - { label: Die Zahlen widersprechen der Behauptung., bucket: fair }
        - { label: "Du bist zu jung, um das zu verstehen.", bucket: Fehlschluss }
        - { label: "Wer das nicht will, hasst Kinder.", bucket: Fehlschluss }
    hints:
      - Geht es um die Sache oder um die Person und Schwarz-Weiß?
    explanation: Faire Einwände prüfen Belege – Fehlschlüsse lenken davon ab.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Welcher Fehlschluss steckt darin?
    params:
      buckets:
        - id: b1
          label: Falsches Entweder-oder
        - id: b2
          label: Dammbruch
      items:
        - label: »Wer nicht für uns ist, ist gegen uns.«
          bucket: b1
        - label: »Erst Tempolimit, dann Autoverbot.«
          bucket: b2
        - label: »Entweder Wachstum oder Umweltschutz.«
          bucket: b1
        - label: »Erlauben wir das, geht bald alles.«
          bucket: b2
    hints:
      - Nur zwei Möglichkeiten – oder eine Kette bis zur Katastrophe?
    explanation: "Beide Muster lassen Möglichkeiten weg: den Mittelweg oder den Halt auf halber Strecke."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Beim falschen Dilemma werden nur [[zwei]] Möglichkeiten genannt, obwohl es [[mehr]] gibt.
      distractors:
        - alle
        - keine

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: »Du willst die Regel lockern? Dann findest du also, dass jeder machen darf, was er will!« Welcher Trick ist das?
    params:
      options:
        - label: Ein Strohmann – die Position wird übertrieben, um sie leichter anzugreifen
          correct: true
        - label: Ein Angriff auf die Person
          feedback: Angegriffen wird eine verzerrte Fassung der Meinung.
        - label: Ein Appell an die Mehrheit
          feedback: Von einer Mehrheit ist nicht die Rede.
    hints:
      - Hat der andere das wirklich gesagt?
    explanation: Man baut eine Strohpuppe auf und wirft sie um. Fair wäre, die **stärkste** Fassung der Gegenmeinung zu prüfen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wann ist ein Dammbruch-Argument **berechtigt**?
    params:
      options:
        - label: Wenn sich für jeden Schritt der Kette gute Gründe oder Belege nennen lassen
          correct: true
        - label: Nie
          feedback: Manche Entwicklungen verstärken sich wirklich selbst.
        - label: Immer, wenn die Folge schlimm genug wäre
          feedback: Wie schlimm etwas wäre, sagt nichts darüber, wie wahrscheinlich es ist.
    hints:
      - Eine Kette ist so stark wie ihr schwächstes Glied.
    explanation: Sind fünf Schritte je zu 70 % wahrscheinlich, tritt das Ende nur mit 17 % ein.
    difficulty: 3

srs:
  cards_from: [entweder, erkennen]
