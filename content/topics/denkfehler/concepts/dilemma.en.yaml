id: logic.fallacies.dilemma
type: concept
title: False Either-Or
summary: Seeming alternatives and the slippery slope.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: entweder
    widget: choice
    body: "“Either you are for my project, or you want the company to fail.”"
    prompt: What is wrong with this sentence?
    params:
      options:
        - { label: There are more than these two possibilities., correct: true }
        - { label: Nothing – that is just how it is., feedback: "You can reject the project and still want the company to succeed." }
    hints:
      - Is there a third stance?
    explanation: A **false dilemma** pretends there are only two options.

  - kind: explain
    id: s2
    body: |
      A **slippery slope** argument claims that one small step inevitably leads to disaster. That can be true – but it must be justified, step by step.

  - kind: problem
    id: dammbruch
    widget: choice
    body: "“If we allow homework on weekends, soon there will be no free time left, and then society will collapse.”"
    prompt: What is this fallacy called?
    params:
      options:
        - { label: Slippery slope argument, correct: true }
        - { label: Circular reasoning, feedback: "Circular reasoning assumes what it wants to prove." }
    hints:
      - One small step is supposed to lead inevitably to chaos.
    explanation: Every step in the chain would need evidence – here each is simply asserted.

  - kind: problem
    id: erkennen
    widget: buckets
    prompt: Fair objection or fallacy?
    params:
      buckets: [{ label: fair }, { label: fallacy }]
      items:
        - { label: The study had only 12 participants., bucket: fair }
        - { label: The numbers contradict the claim., bucket: fair }
        - { label: "You are too young to understand this.", bucket: fallacy }
        - { label: "Anyone who disagrees hates children.", bucket: fallacy }
    hints:
      - Is it about the issue, or about the person and black-and-white thinking?
    explanation: Fair objections test the evidence. Fallacies distract from it.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Which fallacy is in it?
    params:
      buckets:
        - id: b1
          label: False either-or
        - id: b2
          label: Slippery slope
      items:
        - label: “Whoever is not for us is against us.”
          bucket: b1
        - label: “First a speed limit, then a car ban.”
          bucket: b2
        - label: “Either growth or the environment.”
          bucket: b1
        - label: “Allow this and soon anything goes.”
          bucket: b2
    hints:
      - Only two options – or a chain down to disaster?
    explanation: "Both patterns leave out options: the middle way or stopping halfway."

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: In a false dilemma only [[two]] options are named although there are [[more]].
      distractors:
        - all
        - none

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “You want to relax the rule? So you think everyone may do whatever they like!” Which trick is this?
    params:
      options:
        - label: A straw man – the position is exaggerated to make it easier to attack
          correct: true
        - label: An attack on the person
          feedback: What is attacked is a distorted version of the view.
        - label: An appeal to the majority
          feedback: No majority is mentioned.
    hints:
      - Did the other person really say that?
    explanation: You set up a straw doll and knock it down. It would be fair to examine the **strongest** version of the opposing view.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A slippery-slope argument has 5 steps. Each step follows from the one before with 80 % probability. How likely is the whole chain? In percent, rounded.
    answer:
      value: 33
      tolerance: 1
    feedback:
      - when: numval(state.input) == 80
        misconception: single-step
        text: That is for one step. All five have to happen.
    hints:
      - All steps must happen in turn – multiply.
      - 0.8 · 0.8 · 0.8 · 0.8 · 0.8 = ?
    explanation: 0.8⁵ ≈ 0.33. Every single step sounds likely, but the chain hardly is. Long chains quickly become unlikely.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: What is the opposite of a straw man?
    params:
      options:
        - label: Restating the opposing view in its strongest form – and then testing it.
          correct: true
        - label: Not mentioning the opposing view at all.
          feedback: Then nothing is tested – that is dodging.
        - label: Simply agreeing with the other side.
          feedback: Agreeing is not testing. What is meant is a fair account.
    hints:
      - A straw man makes the other view weaker than it is.
      - What would be the fair direction?
    explanation: "This is called a steelman: the best version of the opposing argument. Refuting that shows something real."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: When is a slippery slope argument **justified**?
    params:
      options:
        - label: When good reasons or evidence can be given for every step of the chain
          correct: true
        - label: Never
          feedback: Some developments really do reinforce themselves.
        - label: Whenever the consequence would be bad enough
          feedback: How bad something would be says nothing about how likely it is.
    hints:
      - A chain is as strong as its weakest link.
    explanation: If five steps are each 70% likely, the end occurs with only 17%.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Which either–or is **genuine** and not a false dilemma?
    params:
      options:
        - label: A whole number is either even or odd.
          correct: true
        - label: Either you are with us or against us.
          feedback: You can be neutral or agree in part.
        - label: Either we ban cars or the city chokes.
          feedback: "There are many options in between: buses, cycle lanes, speed limits."
    hints:
      - For which pair is there truly no third option?
      - Does every whole number leave remainder 0 or 1 when divided by 2?
    explanation: An either–or is genuine only if the options cover everything and exclude each other. That holds for even and odd numbers but almost never for opinions.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how to spot a false dilemma.
    params:
      keywords:
        - - zwei
          - two
        - - dritte
          - weitere
          - mehr
          - andere
          - third
          - more
          - other
        - - möglichkeit
          - option
          - wahl
          - possibilit
          - choice
      sample: "A false dilemma pretends there are only two options. Ask: is there a third or other possibility? Usually there are many paths in between."
    difficulty: 3

srs:
  cards_from: [entweder, erkennen]
