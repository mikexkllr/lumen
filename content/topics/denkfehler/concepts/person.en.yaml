id: logic.fallacies.person
type: concept
title: Who Says It
summary: Personal attacks and false authority.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: angriff
    widget: choice
    body: "“You want to tell me about healthy eating? You eat fries all the time yourself!”"
    prompt: What is the problem with this objection?
    params:
      options:
        - { label: It attacks the person instead of the argument., correct: true }
        - { label: It is completely justified., feedback: "Whether someone eats fries says nothing about whether their statement is true." }
    hints:
      - Is the statement itself refuted?
    explanation: An argument does not become false because the speaker does not follow it.

  - kind: explain
    body: |
      An argument stands or falls with its **reasons** – not with who presents it. Neither an attack on the person nor a famous name makes a statement true or false.

  - kind: problem
    id: autoritaet
    widget: choice
    prompt: A famous actor recommends a cold remedy. How much weight does that carry?
    params:
      options:
        - { label: Little – he is not an expert in medicine., correct: true }
        - { label: A lot – he is very well known., feedback: "Fame is not expertise." }
    hints:
      - What is he an expert in?
    explanation: Authority counts only in its own field – and even there it does not replace evidence.

  - kind: problem
    id: mehrheit
    widget: choice
    prompt: "“Millions of people believe in it, so it must be true.” What is this?"
    params:
      options:
        - { label: An appeal to the majority – not proof, correct: true }
        - { label: A strong argument, feedback: "Millions once believed that the Earth was the center of the universe." }
    hints:
      - Was the majority always right?
    explanation: Popularity is not evidence of truth.

srs:
  cards_from: [angriff, mehrheit]
