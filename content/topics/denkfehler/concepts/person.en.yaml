id: logic.fallacies.person
type: concept
title: Who Says It
summary: Personal attacks and false authority.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: angriff
    widget: choice
    body: "“You want to tell me about healthy eating? You eat fries all the time yourself!”"
    prompt: What is the problem with this objection?
    params:
      options:
        - { label: It attacks the person instead of the argument., correct: true }
        - { label: It is completely justified., feedback: "Whether someone eats fries says nothing about whether their statement is true." }
    hints:
      - Is the statement itself refuted?
    explanation: An argument does not become false because the speaker does not follow it.

  - kind: explain
    id: s2
    body: |
      An argument stands or falls with its **reasons** – not with who presents it. Neither an attack on the person nor a famous name makes a statement true or false.

  - kind: problem
    id: autoritaet
    widget: choice
    prompt: A famous actor recommends a cold remedy. How much weight does that carry?
    params:
      options:
        - { label: Little – he is not an expert in medicine., correct: true }
        - { label: A lot – he is very well known., feedback: "Fame is not expertise." }
    hints:
      - What is he an expert in?
    explanation: Authority counts only in its own field – and even there it does not replace evidence.

  - kind: problem
    id: mehrheit
    widget: choice
    prompt: "“Millions of people believe in it, so it must be true.” What is this?"
    params:
      options:
        - { label: An appeal to the majority – not proof, correct: true }
        - { label: A strong argument, feedback: "Millions once believed that the Earth was the center of the universe." }
    hints:
      - Was the majority always right?
    explanation: Popularity is not evidence of truth.

  - kind: problem
    id: c1
    widget: match
    prompt: Which fallacy is this?
    params:
      pairs:
        - left: “He has no degree.”
          right: Attack on the person
        - left: “A Nobel laureate says so.”
          right: False authority
        - left: “Everyone believes that.”
          right: Appeal to the majority
        - left: “It has always been this way.”
          right: Appeal to tradition
    hints:
      - What does the sentence rest on – reasons or something else?
    explanation: None of these sentences gives a reason that concerns the matter itself.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: What is the sentence about?
    params:
      buckets:
        - id: b1
          label: Attack on the person
        - id: b2
          label: Appeal to authority
        - id: b3
          label: Factual reason
      items:
        - label: “You of all people say that!”
          bucket: b1
        - label: “A Nobel laureate says so too.”
          bucket: b2
        - label: “The measurement shows 5% more.”
          bucket: b3
        - label: “I take nothing from him.”
          bucket: b1
        - label: “The study had only 8 participants.”
          bucket: b3
    hints:
      - Is it about the matter – or about who is speaking?
    explanation: Only reasons about the matter can support or weaken a claim.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An argument stands and falls with its [[reasons]] – not with the [[person]] who makes it.
      distractors:
        - effects
        - volume

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A doctor who smokes herself advises you against smoking. Is her advice therefore wrong?
    params:
      options:
        - label: No – whether smoking harms does not depend on her behaviour
          correct: true
        - label: Yes – she does not follow it herself
          feedback: That may make her inconsistent but not her statement wrong.
        - label: That cannot be known
          feedback: The evidence on smoking is clear.
    hints:
      - Separate the statement from the person.
    explanation: "The **tu quoque fallacy**: “you do it yourself” refutes no argument."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: swipe
    prompt: Fair objection or attack on the person?
    params:
      cards:
        - text: He has a criminal record, so his tax proposal is wrong.
          right: false
          why: His record says nothing about the reasons on tax.
        - text: The manufacturer paid for the study – have it checked independently.
          right: true
          why: A conflict of interest is a good reason to look closer. It does not refute anything yet.
        - text: You eat meat yourself, so your argument for animal welfare does not count.
          right: false
          why: That is "you too!" – the argument stands regardless of behaviour.
        - text: The witness was provably not even there that night.
          right: true
          why: For testimony it matters whether the person can know anything.
      left: fallacy
      right: fair
    explanation: Reasons are judged on the merits. A person's interests and reliability matter only when we are asked to take their word.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: '"This idea comes from a dictator – so it is bad." What is the mistake?'
    params:
      options:
        - label: The idea is judged by where it came from, not by its reasons.
          correct: true
        - label: None – bad people only have bad ideas.
          feedback: Dictators also built roads or schools. Each idea has to be checked on its own.
        - label: Circular reasoning.
          feedback: Nobody assumes the conclusion here – only the source is attacked.
    hints:
      - What does an idea's origin say about its effects?
      - Which reasons for or against the idea itself are given?
    explanation: "This is the genetic fallacy: judging by origin, not content. An idea gets neither better nor worse because of who had it."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: When is it **reasonable** to appeal to an authority?
    params:
      options:
        - label: When they have expertise in exactly this field and the experts largely agree
          correct: true
        - label: Never – that is always a fallacy
          feedback: Nobody can check everything themselves. Trusting experts is often wise.
        - label: Whenever the person is famous
          feedback: Fame is not expertise.
    hints:
      - A physicist on physics – or on nutrition?
    explanation: The error lies not in trusting but in trusting the **wrong** authority.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: When is it **not** a fallacy to criticise the person?
    params:
      options:
        - label: When we are only asked to trust her word – for example as a witness.
          correct: true
        - label: When she is unpleasant.
          feedback: Likeability says nothing about truth.
        - label: Never – criticising people is always a fallacy.
          feedback: For claims you cannot check yourself, credibility counts.
    hints:
      - Tell apart an argument (reasons) and a claim you trust.
      - You can check an argument yourself. A witness you have to believe.
    explanation: An argument stands on its own, so attacking the person is a mistake there. With testimony everything hangs on the source's reliability, so asking about interests and track record is fair.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why attacking the person does not refute an argument.
    params:
      keywords:
        - - gründe
          - grund
          - argument
          - reasons
          - reason
        - - person
          - wer
          - sprecher
          - who
          - speaker
        - - wahr
          - falsch
          - "true"
          - "false"
      sample: Whether an argument holds depends on its reasons, not on who says it. An unpleasant person can be right. You have to check the reasons to know if it is true or false.
    difficulty: 3

srs:
  cards_from: [angriff, mehrheit]
