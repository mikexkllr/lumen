id: logic.fallacies.mixed
type: concept
title: Fallacy Detective
summary: All the tricks mixed together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: zuordnen
    widget: match
    prompt: Which fallacy is hidden in the sentence?
    params:
      pairs:
        - { left: "“He never even went to college.”", right: Personal attack }
        - { left: "“All or nothing!”", right: False dilemma }
        - { left: "“Tired since the new mast.”", right: False cause }
        - { left: "“Everyone does it this way.”", right: Appeal to the majority }
    hints:
      - Notice what the sentence distracts from.
    explanation: Once you know the patterns, you see them everywhere – in ads, politics, and arguments.

  - kind: problem
    id: werbung
    widget: choice
    prompt: "“9 out of 10 dentists recommend …” What do you ask first?"
    params:
      options:
        - { label: "How many were asked, and how were they chosen?", correct: true }
        - { label: Nothing – 90% is convincing., feedback: "Ten hand-picked dentists would be no proof." }
    hints:
      - Who were the ten?
    explanation: The sample decides whether a number means anything.

  - kind: problem
    id: selbst
    widget: choice
    prompt: Which attitude protects best against fallacies?
    params:
      options:
        - { label: Also testing your own favorite opinions, correct: true }
        - { label: Testing only the other side's arguments, feedback: "The easiest errors to miss are the ones you like." }
    hints:
      - Where do we look least closely?
    explanation: Critical thinking starts with your own beliefs.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Ask of every argument: do the [[reasons]] really support the [[conclusion]]?"
      distractors:
        - feelings
        - speaker

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: “Nobody has proved that ghosts do not exist – so they exist.” What is this?
    params:
      options:
        - label: An argument from ignorance – the burden of proof is reversed
          correct: true
        - label: A slippery slope
          feedback: There is no chain of steps.
        - label: A valid inference
          feedback: A missing disproof is not a proof.
    hints:
      - Who has to support a claim?
    explanation: Whoever claims something bears the **burden of proof**. Otherwise you would have to believe in invisible unicorns too.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: match
    prompt: Which error is behind it?
    params:
      pairs:
        - left: '"The paper says it never lies."'
          right: circular reasoning
        - left: '"Natural, so it is healthy."'
          right: appeal to nature
        - left: '"8 reds – black is due now!"'
          right: gambler's fallacy
        - left: '"Less sugar? So, ban all cake!"'
          right: straw man
      leftTitle: statement
      rightTitle: error
    hints:
      - Look at what is assumed or twisted in each one.
      - In circular reasoning the conclusion is already in the reason.
    explanation: "Circular reasoning: the conclusion justifies itself. Natural is not automatically good (death caps are natural). The wheel has no memory. The straw man distorts the position."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: At roulette red has come up eight times in a row. What is more likely on the next spin?
    params:
      options:
        - label: Neither – the chances are the same as always.
          correct: true
        - label: Black, it has to even out.
          feedback: The ball knows nothing of earlier spins. Evening out only happens on average over very many spins.
        - label: Red, the wheel is hot.
          feedback: With a fair wheel that is a mistake too.
    hints:
      - Does one spin depend on the one before?
      - For independent events the probability stays the same.
    explanation: The spins are independent. Red and black each have 18 of 37 pockets – before and after. Believing in evening out is the gambler's fallacy.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux two thinking errors you want to watch out for in future – with an example each.
    params:
      keywords:
        - - person
          - autorität
          - mehrheit
          - authority
          - majority
          - strohmann
          - straw
        - - ursache
          - zusammenhang
          - danach
          - cause
          - correlat
          - after
        - - beispiel
          - etwa
          - zum beispiel
          - example
          - such as
          - instance
          - einzelfall
      min: 2
      sample: "First the attack on the person: an argument does not become false just because I dislike the speaker. Second the false cause: that something happens afterwards does not mean because of it – for example with the lucky shirt."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Someone backs up "smoking is harmful" with a bad argument. What follows?
    params:
      options:
        - label: Only that this argument shows nothing – the claim can still be true.
          correct: true
        - label: That smoking is not harmful.
          feedback: A bad reason does not make the claim false.
        - label: That nobody should talk about smoking.
          feedback: One should look for better reasons – not stay silent.
    hints:
      - What does a fallacy prove – about the argument and about the claim?
      - Can a true claim be badly argued?
    explanation: "Concluding from a fallacy that the claim is false is itself a fallacy: the fallacy fallacy. A weak argument removes one reason – not the truth."
    difficulty: 3

srs:
  cards_from: [zuordnen, werbung]
