id: logic.fallacies.cause
type: concept
title: After Does Not Mean Because
summary: Spotting false causes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hemd
    widget: choice
    prompt: Since I started wearing my lucky shirt, my team wins more often. Does the shirt bring luck?
    params:
      options:
        - { label: No – after does not mean because., correct: true }
        - { label: Yes – the wins prove it., feedback: "The wins could have come without the shirt. There is no mechanism and no comparison." }
    hints:
      - Is there a plausible way for a shirt to affect a game?
    explanation: A time sequence alone does not prove a cause.

  - kind: explain
    id: s2
    body: |
      Two things can occur together because a **third cause** drives both, because the cause works the **other way around**, or just by **chance**. Only comparisons and experiments settle it.

  - kind: problem
    id: dritte
    widget: choice
    prompt: In summer, ice cream sales and sunburns both rise. Does ice cream cause sunburn?
    params:
      options:
        - { label: No – sunny weather causes both., correct: true }
        - { label: "Yes", feedback: "There is a common cause – the sun." }
    hints:
      - What is behind both?
    explanation: A third factor can drive two things at once.

  - kind: problem
    id: richtung
    widget: choice
    prompt: People in hospitals are sick more often than others. Do hospitals make people sick?
    params:
      options:
        - { label: "No – sick people go to the hospital, not the other way around.", correct: true }
        - { label: "Yes", feedback: "Here the cause works the other way around." }
    hints:
      - What came first?
    explanation: The direction of a link is often the reverse of what you expect.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: What is really behind the link?
    params:
      buckets:
        - id: b1
          label: Third cause
        - id: b2
          label: Direction reversed
        - id: b3
          label: Chance
      items:
        - label: More ice cream, more bathing accidents
          bucket: b1
        - label: Hospitals hold more ill people
          bucket: b2
        - label: Big feet, better reading (kids)
          bucket: b1
        - label: More cheese, more lottery wins
          bucket: b3
    hints:
      - Summer, illness, age – or nothing at all?
    explanation: The heat, the illness and age explain three of the cases. The fourth is mere chance.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: “After” does not mean “[[because]]”. Two things can also be linked by a [[third]] cause.
      distractors:
        - anyway
        - first

  - kind: problem
    id: mix-c3
    widget: order
    prompt: How do you check whether A really causes B? Order the steps.
    params:
      items:
        - label: Notice a link
        - label: Collect other explanations
        - label: Run an experiment with random groups
        - label: Let others repeat the result
    hints:
      - First doubt, then test, then have it confirmed.
    explanation: Only the experiment separates cause from mere coincidence.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Cities with more firefighters have more fire damage. Should firefighters be laid off?
    params:
      options:
        - label: "No – large cities have both: more fires and more firefighters"
          correct: true
        - label: Yes – fewer firefighters means less damage
          feedback: That confuses cause with common cause.
        - label: Maybe – that would have to be tried
          feedback: The third variable explains it completely.
    hints:
      - What influences both?
    explanation: The size of the city is the hidden third cause.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: After the jab he caught a cold. So it was the jab.
          right: false
          why: After does not mean because.
        - text: In a random trial the drug helps better than a placebo.
          right: true
        - text: Since I wear the lucky charm I keep winning.
          right: false
        - text: If the pump is switched off, the pressure drops – every time.
          right: true
      left: No evidence
      right: Good evidence
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: “After the vaccination the child got a fever – so the vaccine caused the fever.” How is that really tested?
    params:
      options:
        - label: "With a comparison group: do the unvaccinated get a fever just as often in the same period?"
          correct: true
        - label: Not at all – the timing suffices
          feedback: Children often have a fever, even without vaccination.
        - label: By collecting many such reports
          feedback: Even a thousand single cases without comparison prove nothing.
    hints:
      - What would have happened without the vaccination?
    explanation: "The question of the **counterfactual**: a cause is what makes the difference."
    difficulty: 3

srs:
  cards_from: [hemd, dritte]
