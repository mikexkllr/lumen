id: logic.fallacies.cause
type: concept
title: After Does Not Mean Because
summary: Spotting false causes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: hemd
    widget: choice
    prompt: Since I started wearing my lucky shirt, my team wins more often. Does the shirt bring luck?
    params:
      options:
        - { label: No – after does not mean because., correct: true }
        - { label: Yes – the wins prove it., feedback: "The wins could have come without the shirt. There is no mechanism and no comparison." }
    hints:
      - Is there a plausible way for a shirt to affect a game?
    explanation: A time sequence alone does not prove a cause.

  - kind: explain
    body: |
      Two things can occur together because a **third cause** drives both, because the cause works the **other way around**, or just by **chance**. Only comparisons and experiments settle it.

  - kind: problem
    id: dritte
    widget: choice
    prompt: In summer, ice cream sales and sunburns both rise. Does ice cream cause sunburn?
    params:
      options:
        - { label: No – sunny weather causes both., correct: true }
        - { label: "Yes", feedback: "There is a common cause – the sun." }
    hints:
      - What is behind both?
    explanation: A third factor can drive two things at once.

  - kind: problem
    id: richtung
    widget: choice
    prompt: People in hospitals are sick more often than others. Do hospitals make people sick?
    params:
      options:
        - { label: "No – sick people go to the hospital, not the other way around.", correct: true }
        - { label: "Yes", feedback: "Here the cause works the other way around." }
    hints:
      - What came first?
    explanation: The direction of a link is often the reverse of what you expect.

srs:
  cards_from: [hemd, dritte]
