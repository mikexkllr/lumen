id: logic.fallacies.evidence
type: concept
title: Einzelfälle und Rosinen
summary: Anekdoten statt Daten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: opa
    widget: choice
    prompt: »Mein Opa hat geraucht und wurde 95. Rauchen ist also nicht schädlich.« Was ist das Problem?
    params:
      options:
        - { label: Ein Einzelfall widerlegt keine Statistik über Millionen., correct: true }
        - { label: Gar keins – der Opa beweist es., feedback: "Es gibt auch Menschen, die einen Sturz aus dem Flugzeug überlebten." }
    hints:
      - Wie viele Raucher werden nicht 95?
    explanation: Anekdoten bleiben im Gedächtnis – aber Daten über viele Menschen zählen.

  - kind: explain
    id: s2
    body: |
      **Rosinenpicken** heißt: Nur die Belege zeigen, die passen, und den Rest verschweigen. Wer nur Erfolgsgeschichten hört, sieht ein völlig falsches Bild.

  - kind: problem
    id: rosinen
    widget: choice
    prompt: Ein Fonds wirbt mit den drei besten Jahren seiner Geschichte. Was fehlt?
    params:
      options:
        - { label: Die schlechten Jahre und der Durchschnitt, correct: true }
        - { label: Nichts – drei gute Jahre reichen., feedback: "Ohne die übrigen Jahre weiß man nicht, wie gut er insgesamt war." }
    hints:
      - Was wurde ausgelassen?
    explanation: Gute Entscheidungen brauchen das ganze Bild.

  - kind: problem
    id: belege
    widget: buckets
    prompt: Starker oder schwacher Beleg?
    params:
      buckets: [{ label: stark }, { label: schwach }]
      items:
        - { label: Studie mit tausenden Teilnehmenden, bucket: stark }
        - { label: Mehrere unabhängige Studien, bucket: stark }
        - { label: Erfahrungsbericht einer Freundin, bucket: schwach }
        - { label: Ausgewählte Kundenstimmen, bucket: schwach }
    hints:
      - Wie viele Fälle stecken dahinter, und wurde ausgewählt?
    explanation: Viele unabhängige Fälle schlagen jede noch so gute Geschichte.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Starker oder schwacher Beleg?
    params:
      buckets:
        - id: b1
          label: Stark
        - id: b2
          label: Schwach
      items:
        - label: Studie mit 10 000 zufällig Gewählten
          bucket: b1
        - label: »Mein Opa rauchte und wurde 95.«
          bucket: b2
        - label: Drei ausgesuchte Erfolgsgeschichten
          bucket: b2
        - label: Alle Daten, auch die unpassenden
          bucket: b1
    hints:
      - Viele zufällige Fälle – oder wenige ausgesuchte?
    explanation: Einzelfälle sind lebendig, aber sie beweisen wenig.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "[[Rosinenpicken]] heißt: Nur die passenden Belege zeigen und den [[Rest]] verschweigen."
      distractors:
        - Verallgemeinern
        - Anfang

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du glaubst, dass Vollmond die Menschen unruhig macht. An welche Nächte erinnerst du dich besonders gut?
    params:
      options:
        - label: An die unruhigen Vollmondnächte – ruhige fallen nicht auf
          correct: true
        - label: An alle gleich gut
          feedback: Das Gedächtnis ist wählerisch.
        - label: An keine
          feedback: Passende Fälle bleiben hängen.
    hints:
      - Was zu einer Überzeugung passt, merkt man sich leichter.
    explanation: "Der **Bestätigungsfehler**: Wir suchen und merken uns, was unsere Meinung stützt."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Im Krieg zählte man Einschusslöcher an heimkehrenden Flugzeugen – vor allem an den Flügeln. Wo sollte man die Panzerung verstärken?
    params:
      options:
        - label: Dort, wo die Heimkehrer **keine** Löcher hatten – etwa am Motor.
          correct: true
        - label: An den Flügeln, wo die meisten Löcher sind.
          feedback: Diese Flugzeuge kamen trotz Löchern zurück. Treffer dort waren überlebbar.
        - label: Überall gleich stark.
          feedback: Panzerung ist schwer und teuer – man braucht sie dort, wo Treffer tödlich sind.
    hints:
      - Welche Flugzeuge fehlen in der Zählung?
      - Wo wurden die getroffen, die nicht zurückkamen?
    explanation: Man sah nur die **Überlebenden**. Flugzeuge mit Treffern am Motor stürzten ab und tauchten nie in der Statistik auf. Dieser Denkfehler heißt Survivorship Bias.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Ein Fonds wirbt mit drei Jahren mit je +20 %. In den übrigen 7 von 10 Jahren lag er bei je −5 %. Was ist der Durchschnitt pro Jahr in Prozent?
    answer:
      value: 2.5
      tolerance: 0.05
    feedback:
      - when: numval(state.input) == 20
        misconception: cherry
        text: Das sind nur die besten Jahre – genau die Rosinen.
    hints:
      - "Addiere alle 10 Jahre: 3 · 20 und 7 · (−5)."
      - (60 − 35) / 10 = ?
    explanation: (60 − 35) / 10 = 2,5 % – weit weg von den beworbenen 20 %. (Genau gerechnet mit Zinseszins wäre es sogar etwas weniger.)
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie prüft man eine eigene Überzeugung am ehrlichsten?
    params:
      options:
        - label: Gezielt nach Belegen suchen, die sie **widerlegen** könnten
          correct: true
        - label: Möglichst viele bestätigende Beispiele sammeln
          feedback: Bestätigungen findet man für fast alles.
        - label: Freunde fragen, die dasselbe denken
          feedback: Das verstärkt nur die Blase.
    hints:
      - Tausend weiße Schwäne beweisen nicht, dass alle weiß sind. Ein schwarzer widerlegt es.
    explanation: "Karl Poppers **Falsifikation**: Eine gute These sagt klar, was sie widerlegen würde."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Forscher testen 100 Lebensmittel auf einen Zusammenhang mit einer Krankheit. In Wahrheit wirkt keins. Jeder Test schlägt mit 5 % Wahrscheinlichkeit zufällig an. Wie viele »Treffer« erwartest du?
    answer:
      value: 5
    hints:
      - "Erwartungswert: Anzahl der Tests mal Wahrscheinlichkeit."
      - 100 · 0,05 = ?
    explanation: Im Schnitt 5 Zufallstreffer. Wer nur sie berichtet, malt die Zielscheibe um die Einschüsse. Seriöse Studien legen vorher fest, was sie prüfen, und korrigieren für **viele Tests**.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Einzelfall eine Statistik nicht widerlegt.
    params:
      keywords:
        - - einzel
          - ein fall
          - eine person
          - single
          - one case
          - one person
        - - durchschnitt
          - meisten
          - häufig
          - wahrscheinlich
          - average
          - most
          - likely
          - often
        - - statistik
          - viele
          - daten
          - statistic
          - many
          - data
      sample: Eine Statistik sagt, was bei vielen Menschen im Durchschnitt passiert. Ein Einzelfall kann trotzdem anders ausgehen. Rauchen macht Krebs wahrscheinlicher, nicht sicher.
    difficulty: 3

srs:
  cards_from: [opa, rosinen]
