id: math.matrices.intro
type: concept
title: Tabellen, die rechnen
summary: Was eine Matrix ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Handyfoto hat 12 Millionen Bildpunkte mit je drei Farbwerten. Aus wie vielen Millionen Zahlen besteht es?"
    params:
      min: 1
      max: 100
    answer:
      value: 36
      tolerance: 6
    explanation: 36 Millionen Zahlen, sauber in Zeilen und Spalten.

  - kind: explain
    id: s1
    body: |
      Eine **Matrix** ist eine rechteckige Tabelle aus Zahlen. Ein Foto ist eine Matrix aus Helligkeiten, eine Tabellenkalkulation auch – und KI-Modelle bestehen fast nur aus Matrizen.

  - kind: problem
    id: eintraege
    widget: numeric
    prompt: Eine Matrix hat {{r}} Zeilen und {{c}} Spalten. Wie viele Einträge hat sie?
    params: { unit: Einträge }
    answer: { value: "{{r * c}}" }
    hints:
      - Zeilen mal Spalten.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "int[2,9]", c: "int[2,9]" }
      defaults: { r: 3, c: 4 }

  - kind: problem
    id: bild
    widget: choice
    prompt: Ein Graustufenfoto hat 1920 × 1080 Pixel. Wie sieht es als Matrix aus?
    params:
      options:
        - { label: 1080 Zeilen und 1920 Spalten, correct: true }
        - { label: Eine einzige Zeile mit 1920 Zahlen, feedback: "Jede Pixelzeile wird eine Matrixzeile – es sind 1080." }
    hints:
      - Jede Bildzeile wird eine Zeile der Matrix.
    explanation: Über zwei Millionen Zahlen – jede eine Helligkeit.

  - kind: problem
    id: strecken
    widget: numeric
    body: "Die Matrix (2 0 | 0 3) wirkt auf einen Vektor: oben mal 2, unten mal 3."
    prompt: Was wird aus dem Vektor (4, 5)? Gib den oberen Wert an.
    params: { placeholder: "x" }
    answer: { value: 8 }
    hints:
      - 2 · 4.
    explanation: (8, 15) – die Matrix streckt in x-Richtung doppelt, in y-Richtung dreifach.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Graustufenbild ist eine Matrix aus Helligkeitswerten.
          right: true
        - text: Eine 2×3-Matrix hat 2 Spalten und 3 Zeilen.
          right: false
          why: "Zeilen zuerst: 2 Zeilen, 3 Spalten."
        - text: Zwei Matrizen gleicher Größe addiert man Eintrag für Eintrag.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Einheitsmatrix hat Einsen auf der Diagonale und sonst Nullen. Was macht sie aus dem Vektor (7, −3)? Gib den oberen Wert an.
    answer:
      value: 7
    hints:
      - "Oben: 1 · 7 + 0 · (−3)."
    explanation: Sie lässt jeden Vektor unverändert – die »1« der Matrizen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Farbbild mit 1000 × 1000 Pixeln hat drei Farbkanäle. Wie viele Zahlen speichert es?
    answer:
      value: 3000000
    hints:
      - Drei Matrizen übereinander.
    explanation: 3 Millionen. Solche gestapelten Matrizen heißen **Tensoren** – das Datenformat der KI.
    difficulty: 3

srs:
  cards_from: [eintraege, bild]
