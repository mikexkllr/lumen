id: math.matrices.intro
type: concept
title: Tabellen, die rechnen
summary: Was eine Matrix ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Bilder aus Zahlen
    body: Jedes Foto auf deinem Handy ist eine Tabelle aus Zahlen. Hier steht jedes Feld für eine Zahl von 0 bis 3. Tippe Felder an und mal ein eigenes Bild – du schreibst damit eine **Matrix**.
    visual:
      widget: pixels
      interactive: true
      params:
        shades: 4
        cells:
          - ......
          - .3..3.
          - ......
          - 2....2
          - .2222.
          - ......

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Handyfoto hat 12 Millionen Bildpunkte mit je drei Farbwerten. Aus wie vielen Millionen Zahlen besteht es?"
    params:
      min: 1
      max: 100
    answer:
      value: 36
      tolerance: 6
    explanation: 36 Millionen Zahlen, sauber in Zeilen und Spalten.

  - kind: explain
    id: s1
    body: |
      Eine **Matrix** ist eine rechteckige Tabelle aus Zahlen. Ein Foto ist eine Matrix aus Helligkeiten, eine Tabellenkalkulation auch – und KI-Modelle bestehen fast nur aus Matrizen.

  - kind: problem
    id: eintraege
    widget: numeric
    prompt: Eine Matrix hat {{r}} Zeilen und {{c}} Spalten. Wie viele Einträge hat sie?
    params: { unit: Einträge }
    answer: { value: "{{r * c}}" }
    hints:
      - Zeilen mal Spalten.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "int[2,9]", c: "int[2,9]" }
      defaults: { r: 3, c: 4 }

  - kind: problem
    id: bild
    widget: choice
    prompt: Ein Graustufenfoto hat 1920 × 1080 Pixel. Wie sieht es als Matrix aus?
    params:
      options:
        - { label: 1080 Zeilen und 1920 Spalten, correct: true }
        - { label: Eine einzige Zeile mit 1920 Zahlen, feedback: "Jede Pixelzeile wird eine Matrixzeile – es sind 1080." }
    hints:
      - Jede Bildzeile wird eine Zeile der Matrix.
    explanation: Über zwei Millionen Zahlen – jede eine Helligkeit.

  - kind: problem
    id: strecken
    widget: numeric
    body: "Die Matrix (2 0 | 0 3) wirkt auf einen Vektor: oben mal 2, unten mal 3."
    prompt: Was wird aus dem Vektor (4, 5)? Gib den oberen Wert an.
    params: { placeholder: "x" }
    answer: { value: 8 }
    hints:
      - 2 · 4.
    explanation: (8, 15) – die Matrix streckt in x-Richtung doppelt, in y-Richtung dreifach.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Graustufenbild ist eine Matrix aus Helligkeitswerten.
          right: true
        - text: Eine 2×3-Matrix hat 2 Spalten und 3 Zeilen.
          right: false
          why: "Zeilen zuerst: 2 Zeilen, 3 Spalten."
        - text: Zwei Matrizen gleicher Größe addiert man Eintrag für Eintrag.
          right: true

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: "Diese Matrix mit 3 Zeilen und 4 Spalten ist ein Bild: $\\begin{pmatrix}1&1&1&1\\\\0&1&1&0\\\\0&1&1&0\\end{pmatrix}$. Färbe jedes Feld, in dem eine 1 steht."
    params:
      rows: 3
      cols: 4
    answer:
      pattern:
        - "####"
        - .##.
        - .##.
    hints:
      - Die erste Zeile ist ganz voll.
      - In den Zeilen 2 und 3 sind nur die mittleren zwei Felder eine 1.
    explanation: Zeile für Zeile gelesen entsteht ein T. Genau so speichert ein Rechner ein Schwarz-Weiß-Bild.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Einheitsmatrix hat Einsen auf der Diagonale und sonst Nullen. Was macht sie aus dem Vektor (7, −3)? Gib den oberen Wert an.
    answer:
      value: 7
    hints:
      - "Oben: 1 · 7 + 0 · (−3)."
    explanation: Sie lässt jeden Vektor unverändert – die »1« der Matrizen.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Auch Netze sind Matrizen. In der **Adjazenzmatrix** steht in Zeile i, Spalte j eine 1, wenn i und j befreundet sind, sonst eine 0. Die Zeilensumme zählt die Freunde einer Person.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Drei Leute sind alle miteinander befreundet. Wie viele Einsen hat ihre Adjazenzmatrix? Niemand ist mit sich selbst befreundet.
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 3
        misconception: once-per-edge
        text: "Jede Freundschaft steht zweimal drin: bei A→B und bei B→A."
      - when: numval(state.input) == 9
        misconception: diagonal
        text: Die Diagonale bleibt 0 – niemand ist mit sich selbst befreundet.
    hints:
      - Die Matrix ist 3 × 3, die Diagonale ist 0.
      - 9 − 3.
    explanation: 6 Einsen für 3 Freundschaften. Die Matrix ist symmetrisch, weil Freundschaft beidseitig ist.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Farbbild mit 1000 × 1000 Pixeln hat drei Farbkanäle. Wie viele Zahlen speichert es?
    answer:
      value: 3000000
    hints:
      - Drei Matrizen übereinander.
    explanation: 3 Millionen. Solche gestapelten Matrizen heißen **Tensoren** – das Datenformat der KI.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Quadriert man die Adjazenzmatrix, zählt der Eintrag $(A^2)_{ij}$ die **Wege der Länge 2** von i nach j. Allgemein zählt $A^n$ die Wege der Länge n. So rechnen Suchmaschinen und soziale Netze.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Im Dreieck A, B, C sind alle verbunden. Wie viele Wege der Länge 2 führen von A zurück nach A?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: no-return
        text: "Ein Weg darf zurückkehren: A → B → A zählt."
    hints:
      - Erster Schritt nach B oder C.
      - Von dort direkt zurück.
    explanation: A → B → A und A → C → A. Der Diagonaleintrag von A² ist die Zahl der Freunde – hier 2.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Graustufenfoto als Matrix gespeichert wird.
    params:
      keywords:
        - - pixel
          - bildpunkt
          - point
        - - zeile
          - spalte
          - row
          - column
        - - helligkeit
          - zahl
          - brightness
          - number
          - wert
          - value
      sample: Jeder Bildpunkt bekommt eine Zahl für seine Helligkeit. Die Zahlen stehen in Zeilen und Spalten genau so, wie die Pixel im Bild angeordnet sind. Das ergibt eine Matrix.
    explanation: Zeile = Höhe im Bild, Spalte = Position von links, Eintrag = Helligkeit. Farbbilder haben drei solche Matrizen.
    difficulty: 3

srs:
  cards_from: [eintraege, bild]
