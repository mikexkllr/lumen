id: math.matrices.intro
type: concept
title: Tabellen, die rechnen
summary: Was eine Matrix ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Eine **Matrix** ist eine rechteckige Tabelle aus Zahlen. Ein Foto ist eine Matrix aus Helligkeiten, eine Tabellenkalkulation auch – und KI-Modelle bestehen fast nur aus Matrizen.

  - kind: problem
    id: eintraege
    widget: numeric
    prompt: Eine Matrix hat {{r}} Zeilen und {{c}} Spalten. Wie viele Einträge hat sie?
    params: { unit: Einträge }
    answer: { value: "{{r * c}}" }
    hints:
      - Zeilen mal Spalten.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "int[2,9]", c: "int[2,9]" }
      defaults: { r: 3, c: 4 }

  - kind: problem
    id: bild
    widget: choice
    prompt: Ein Graustufenfoto hat 1920 × 1080 Pixel. Wie sieht es als Matrix aus?
    params:
      options:
        - { label: 1080 Zeilen und 1920 Spalten, correct: true }
        - { label: Eine einzige Zeile mit 1920 Zahlen, feedback: "Jede Pixelzeile wird eine Matrixzeile – es sind 1080." }
    hints:
      - Jede Bildzeile wird eine Zeile der Matrix.
    explanation: Über zwei Millionen Zahlen – jede eine Helligkeit.

  - kind: problem
    id: strecken
    widget: numeric
    body: "Die Matrix (2 0 | 0 3) wirkt auf einen Vektor: oben mal 2, unten mal 3."
    prompt: Was wird aus dem Vektor (4, 5)? Gib den oberen Wert an.
    params: { placeholder: "x" }
    answer: { value: 8 }
    hints:
      - 2 · 4.
    explanation: (8, 15) – die Matrix streckt in x-Richtung doppelt, in y-Richtung dreifach.

srs:
  cards_from: [eintraege, bild]
