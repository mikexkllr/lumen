id: math.matrices.systems
type: concept
title: Systems of equations
summary: Many equations at once.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zwei
    widget: numeric
    prompt: "x + y = {{s}} and x − y = {{d}}. What is x?"
    params: { placeholder: "x" }
    answer: { value: "{{(s + d) / 2}}" }
    hints:
      - Add both equations. y drops out.
    explanation: "2x = {{s + d}}, so x = {{(s + d) / 2}}."
    variants:
      params: { a: "int[3,12]", b: "int[1,6]" }
      derive: { s: "a + b", d: "a - b" }
      constraints: ["a > b"]
      defaults: { a: 6, b: 4 }

  - kind: explain
    body: |
      You write a **system of equations** as matrix times vector equals result. Computers solve systems with millions of unknowns this way, for weather forecasts, structural engineering and AI training.

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: "2x + y = 7 and x + y = 4. What is x?"
    params: { placeholder: "x" }
    answer: { value: 3 }
    hints:
      - Subtract the second equation from the first.
    explanation: (2x + y) − (x + y) = 7 − 4, so x = 3 and y = 1.

  - kind: problem
    id: parallel
    widget: choice
    prompt: "x + y = 3 and x + y = 5. How many solutions are there?"
    params:
      options:
        - { label: None, correct: true }
        - { label: Exactly one, feedback: "The same sum cannot be 3 and 5 at once." }
        - { label: Infinitely many, feedback: "That would be the case if both equations were the same." }
    hints:
      - Can x + y be 3 and 5 at the same time?
    explanation: The lines are parallel and never meet. The matrix is then not invertible.

srs:
  cards_from: [zwei, parallel]
