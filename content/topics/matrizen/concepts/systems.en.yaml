id: math.matrices.systems
type: concept
title: Systems of equations
summary: Many equations at once.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: zwei
    widget: numeric
    prompt: "x + y = {{s}} and x − y = {{d}}. What is x?"
    params: { placeholder: "x" }
    answer: { value: "{{(s + d) / 2}}" }
    hints:
      - Add both equations. y drops out.
    explanation: "2x = {{s + d}}, so x = {{(s + d) / 2}}."
    variants:
      params: { a: "int[3,12]", b: "int[1,6]" }
      derive: { s: "a + b", d: "a - b" }
      constraints: ["a > b"]
      defaults: { a: 6, b: 4 }

  - kind: explain
    id: s2
    body: |
      You write a **system of equations** as matrix times vector equals result. Computers solve systems with millions of unknowns this way, for weather forecasts, structural engineering and AI training.

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: "2x + y = 7 and x + y = 4. What is x?"
    params: { placeholder: "x" }
    answer: { value: 3 }
    hints:
      - Subtract the second equation from the first.
    explanation: (2x + y) − (x + y) = 7 − 4, so x = 3 and y = 1.

  - kind: problem
    id: parallel
    widget: choice
    prompt: "x + y = 3 and x + y = 5. How many solutions are there?"
    params:
      options:
        - { label: None, correct: true }
        - { label: Exactly one, feedback: "The same sum cannot be 3 and 5 at once." }
        - { label: Infinitely many, feedback: "That would be the case if both equations were the same." }
    hints:
      - Can x + y be 3 and 5 at the same time?
    explanation: The lines are parallel and never meet. The matrix is then not invertible.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Solve: 3x + 2y = 16 and x − y = 2. What is y?"
    answer:
      value: 2
    hints:
      - Substitute x = y + 2 into the first equation.
    explanation: 3(y + 2) + 2y = 16 gives 5y = 10.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Gaussian elimination uses only three **row operations**: swap rows, multiply a row by a number, add a multiple of one row to another. At the end there is a staircase that you solve from the bottom up."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: "Solve from the bottom: x + y + z = 6, y + 2z = 8, 3z = 9. What is x?"
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 3
        misconception: gave-z
        text: That is z. Substitute it upwards.
    hints:
      - z = 3, then y = 8 − 6 = 2.
      - x = 6 − 2 − 3.
    explanation: x = 1, y = 2, z = 3. Back-substitution is the easy part – the work is in building the staircase.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Gaussian elimination for a system with three unknowns. Order the steps.
    params:
      items:
        - label: Use the first equation to remove x from the other two.
        - label: Use the second equation to remove y from the third.
        - label: Solve the third equation for z.
        - label: Substitute z and compute y, then x.
    hints:
      - First create a triangle shape downwards, then substitute from the bottom up.
    explanation: This is how computers solve systems with millions of unknowns – in about n³ steps.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what does a matrix have to do with a motion of the plane?"
    params:
      keywords:
        - - punkt
          - vektor
          - point
          - vector
        - - dreh
          - streck
          - spiegel
          - rotate
          - stretch
          - reflect
          - scale
          - verschieb
        - - multipl
          - mal
          - times
          - produkt
          - product
      sample: When you multiply a matrix by a vector, the point lands in a new place. That way a matrix can rotate, stretch or reflect all points.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Many data points for one line rarely fit exactly. So you seek the best line: the one with the smallest sum of squared errors. With this **method of least squares** Gauss found the lost dwarf planet Ceres in 1801."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Three measurements give 2, 4 and 9. Which number c makes $(2 - c)^2 + (4 - c)^2 + (9 - c)^2$ smallest?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: median
        text: 4 is the median. With squares the mean wins.
    hints:
      - "Set the derivative to zero: −2(2 − c) − 2(4 − c) − 2(9 − c) = 0."
      - 3c = 15.
    explanation: c = 5, the mean. The mean is the least-squares solution. Minimising the absolute errors would give the median 4.
    difficulty: 3

srs:
  cards_from: [zwei, parallel]
