id: math.matrices.multiply
type: concept
title: Matrix times vector
summary: Row times column.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Matrix times vector: each **row** of the matrix is combined with the vector, entry times entry, then added up. $\begin{pmatrix}1 & 2\\3 & 4\end{pmatrix}\begin{pmatrix}5\\6\end{pmatrix}$ gives $1 \cdot 5 + 2 \cdot 6 = 17$ on top.

  - kind: problem
    id: oben
    widget: numeric
    prompt: "The first row of the matrix is ({{a}} {{b}}), and the vector is ({{x}}, {{y}}). What is the top result?"
    params: { placeholder: "Number" }
    answer: { value: "{{a * x + b * y}}" }
    feedback:
      - when: "numval(state.input) == a * x"
        misconception: forgot-sum
        text: Both products count. Then add them.
    hints:
      - "{{a}} · {{x}} + {{b}} · {{y}}."
    explanation: "{{a * x}} + {{b * y}} = {{a * x + b * y}}."
    variants:
      params: { a: "int[1,5]", b: "int[1,5]", x: "int[1,6]", y: "int[1,6]" }
      defaults: { a: 1, b: 2, x: 5, y: 6 }

  - kind: problem
    id: unten
    widget: numeric
    prompt: "Matrix (1 2 | 3 4) times vector (5, 6): what is the bottom result?"
    params: { placeholder: "Number" }
    answer: { value: 39 }
    hints:
      - Second row, 3 · 5 + 4 · 6.
    explanation: 15 + 24 = 39. The result is the vector (17, 39).

  - kind: problem
    id: tauschen
    widget: choice
    prompt: Is A · B = B · A always true for matrices?
    params:
      options:
        - { label: "No, the order matters.", correct: true }
        - { label: "Yes, as with numbers", feedback: "Rotating first, then reflecting, is different from reflecting first, then rotating." }
    hints:
      - Matrices stand for motions. Does the order of motions not matter?
    explanation: Matrix multiplication is not commutative, a big difference from ordinary numbers.

srs:
  cards_from: [oben, tauschen]
