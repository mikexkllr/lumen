id: math.matrices.determinant
type: concept
title: "The determinant"
summary: "One number reveals how much a matrix changes areas."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: numeric
    prompt: A matrix makes everything twice as wide and three times as tall. By what factor does the area of a square grow?
    answer:
      value: 6
    hints:
      - Width times height.
    explanation: 2 · 3 = 6. This area factor is called the determinant.

  - kind: explain
    id: c2
    body: "The **determinant** tells by what factor a matrix changes areas. For the matrix (a b | c d) you compute: **a · d − b · c**."

  - kind: problem
    id: c3
    widget: numeric
    prompt: What is the determinant of (4 1 | 2 3)?
    answer:
      value: 10
    hints:
      - 4 · 3 − 1 · 2.
    explanation: 12 − 2 = 10. Every area becomes ten times as large.

  - kind: problem
    id: c4
    widget: numeric
    prompt: And of (2 4 | 1 2)?
    answer:
      value: 0
    hints:
      - 2 · 2 − 4 · 1.
    explanation: 4 − 4 = 0. The area vanishes.

  - kind: problem
    id: c5
    widget: choice
    prompt: Determinant zero – what does the matrix do to the plane?
    params:
      options:
        - label: It squashes everything onto a line
          correct: true
        - label: It leaves everything as it is
          feedback: Then the determinant would be 1.
        - label: It turns everything by 90°
          feedback: A rotation keeps areas.
    hints:
      - Which shape has area zero?
    explanation: The second row is just a multiple of the first. One direction is lost.

  - kind: problem
    id: c6
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A rotation has determinant 1.
          right: true
          why: Turning changes no area.
        - text: If width and height both double, the determinant is 2.
          right: false
          why: It is 2 · 2 = 4.
        - text: A reflection has determinant −1.
          right: true
        - text: With determinant 0 the map can be undone.
          right: false
          why: What was squashed onto a line cannot be unfolded.
      left: "False"
      right: "True"

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What does a **negative** determinant mean?
    params:
      options:
        - label: The matrix reflects – clockwise becomes anticlockwise
          correct: true
        - label: The area becomes negative
          feedback: Areas stay positive, the absolute value is the factor.
        - label: The matrix is faulty
          feedback: Negative values are perfectly normal.
    hints:
      - Think of the reflection with determinant −1.
    explanation: The sign shows the orientation, the absolute value the area factor.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Matrix A has determinant 3, matrix B has determinant −2. What is the determinant of their composition A · B?
    answer:
      value: -6
    hints:
      - Area factors in sequence multiply.
    explanation: 3 · (−2) = −6. First reflect and double, then triple.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The system 2x + k · y = 1 and 4x + 6y = 5 has no unique solution for exactly one k. For which k?
    answer:
      value: 3
    hints:
      - The determinant 2 · 6 − k · 4 must be zero.
    explanation: 12 − 4k = 0, so k = 3. Then both lines are parallel.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: What does the determinant of a 3 × 3 matrix measure?
    params:
      options:
        - label: The factor by which volumes change
          correct: true
        - label: The sum of all entries
          feedback: That would say nothing about the map.
        - label: The number of rows
          feedback: That is always 3.
    hints:
      - In the plane it is areas. And in space?
    explanation: "In n dimensions it measures n-dimensional volume. Zero always means: something is flattened."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what a determinant of zero means.
    params:
      keywords:
        - - fläche
          - area
          - volumen
          - volume
        - - "null"
          - zero
        - - linie
          - line
          - platt
          - flach
          - flat
          - quetsch
          - squash
        - - umkehr
          - rückgängig
          - invert
          - undo
          - reverse
      min: 3
      sample: "The matrix squashes the whole plane onto a line. Every area becomes zero. So the map cannot be inverted: you no longer know where a point came from."
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
