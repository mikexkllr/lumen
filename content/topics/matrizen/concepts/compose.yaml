id: math.matrices.compose
type: concept
title: Bewegungen verketten
summary: Matrix mal Matrix.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Gelenk für Gelenk
    body: Ein Roboterarm greift präzise nach einer Schraube. Jedes Gelenk dreht ein Stück – und alle Drehungen zusammen ergeben **eine einzige Matrix**. Deck die Stationen der Reihe nach auf.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 💪
            front: Die Schulter
            back: Sie dreht den ganzen Arm – das ist die erste Matrix.
          - icon: 🦾
            front: Der Ellbogen
            back: Er dreht den Unterarm noch einmal – die zweite Matrix kommt dazu.
          - icon: ✋
            front: Das Handgelenk
            back: Eine dritte Drehung richtet den Greifer aus.
          - icon: 🎯
            front: Das Ziel
            back: Der Computer multipliziert alle drei Matrizen zu einer. So weiß er sofort, wo die Hand landet.

  - kind: problem
    id: hook
    widget: choice
    prompt: Du drehst ein Blatt um 90° und dann noch einmal um 90°. Was ist das zusammen?
    params:
      options:
        - label: Eine Drehung um 180°
          correct: true
        - label: Keine Bewegung
          feedback: Das Blatt steht jetzt auf dem Kopf.
        - label: Eine Spiegelung
          feedback: Zwei Drehungen bleiben eine Drehung.
    hints:
      - 90 + 90.
    explanation: Zwei Bewegungen ergeben wieder eine. Wie man das rechnet, siehst du jetzt.

  - kind: explain
    id: s1
    body: |
      Zwei Bewegungen nacheinander sind wieder eine Bewegung. Ihre Matrix ist das **Produkt** der beiden. So fasst ein Spiel Hunderte Schritte zu einer Rechnung zusammen.

  - kind: problem
    id: zweimal
    widget: choice
    prompt: Was ergibt zweimal hintereinander eine Drehung um 90°?
    params:
      options:
        - { label: Eine Drehung um 180°, correct: true }
        - { label: Eine Spiegelung, feedback: "Zwei Drehungen ergeben wieder eine Drehung." }
        - { label: Eine Drehung um 90°, feedback: "Die Winkel addieren sich." }
    hints:
      - Die Winkel addieren sich.
    explanation: 90° + 90° = 180° – jeder Punkt landet gegenüber.

  - kind: problem
    id: faktoren
    widget: numeric
    prompt: Erst wird alles mit {{a}} gestreckt, dann mit {{b}}. Mit welchem Faktor insgesamt?
    params: { placeholder: "Faktor" }
    answer: { value: "{{a * b}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: add-scales
        text: Streckungen hintereinander multiplizieren sich.
    hints:
      - Streckungen multiplizieren sich.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[2,5]", b: "int[3,5]" }
      defaults: { a: 2, b: 3 }

  - kind: problem
    id: reihenfolge
    widget: choice
    prompt: Ein Spiel dreht eine Figur und verschiebt sie dann. Ist das dasselbe wie erst verschieben, dann drehen?
    params:
      options:
        - { label: Nein – die Figur landet woanders., correct: true }
        - { label: Ja, feedback: "Wer erst verschiebt, dreht danach um einen anderen Mittelpunkt." }
    hints:
      - Um welchen Punkt wird gedreht?
    explanation: Die Reihenfolge der Matrizen entscheidet – darum ist A · B nicht B · A.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Zwei Bewegungen nacheinander ergeben eine neue. Ihre Matrix ist das [[Produkt]] der beiden – und die [[Reihenfolge]] zählt.
      distractors:
        - Summe
        - Farbe

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: "Erst um 90° gegen den Uhrzeigersinn drehen, dann an der x-Achse spiegeln: Wohin wandert P = (2 | 1)? Zieh Q dorthin."
    params:
      x:
        - -4
        - 4
      y:
        - -4
        - 4
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
        - id: P
          x: 2
          y: 1
          draggable: false
        - id: Q
          x: 1
          y: 3
      segments:
        - - O
          - P
        - - O
          - Q
    answer:
      points:
        Q:
          x: -1
          y: -2
    hints:
      - Die Drehung um 90° macht aus (x | y) den Punkt (−y | x).
      - Danach kehrt die Spiegelung das Vorzeichen von y um.
    explanation: "(2 | 1) → (−1 | 2) → (−1 | −2). Beide Bewegungen zusammen sind eine einzige Matrix: eine Spiegelung an der Geraden y = −x."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie oft muss man eine Drehung um 45° hintereinander ausführen, bis alles wieder am Platz ist?
    answer:
      value: 8
    hints:
      - "360 : 45."
    explanation: Die achte Potenz der Drehmatrix ist die Einheitsmatrix.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Die **Inverse** einer 2 × 2-Matrix: Tausche a und d, dreh die Vorzeichen von b und c um und teile durch die Determinante: $\\frac{1}{ad - bc}\\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}$. Ist die Determinante 0, gibt es keine."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Bestimme die Inverse von (2 1 | 1 1). Welcher Eintrag steht oben rechts?
    answer:
      value: -1
    feedback:
      - when: numval(state.input) == 1
        misconception: no-sign-flip
        text: Bei b und c dreht sich das Vorzeichen um.
    hints:
      - "Determinante: 2 · 1 − 1 · 1 = 1."
      - "Inverse: (1 −1 | −1 2)."
    explanation: "Oben rechts steht −1. Probe: (2 1 | 1 1) · (1 −1 | −1 2) = (1 0 | 0 1)."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Inverse $A^{-1}$ macht A rückgängig. Was ist $(A \cdot B)^{-1}$?
    params:
      options:
        - label: $B^{-1} \cdot A^{-1}$ – in umgekehrter Reihenfolge
          correct: true
        - label: $A^{-1} \cdot B^{-1}$
          feedback: Zuletzt angezogen wird zuerst ausgezogen – wie Socken und Schuhe.
        - label: Das gibt es nicht
          feedback: Sind A und B umkehrbar, ist es auch ihr Produkt.
    hints:
      - Erst Socken, dann Schuhe. Wie ziehst du sie wieder aus?
    explanation: Rückgängig macht man in umgekehrter Reihenfolge.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Erst um β drehen, dann um α, ist eine Drehung um α + β. Multipliziert man die zwei Drehmatrizen aus, steht oben links $\cos\alpha\cos\beta - \sin\alpha\sin\beta$. Das muss cos(α + β) sein – so beweist man die **Additionstheoreme**.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Die Scherung S = (1 1 | 0 1) wird {{n}}-mal hintereinander angewendet. Welcher Eintrag steht dann oben rechts in $S^{ {{n}} }$?
    answer:
      value: "{{n}}"
    feedback:
      - when: numval(state.input) == 1
        misconception: no-growth
        text: "Rechne S² aus: (1 2 | 0 1). Der Eintrag wächst."
      - when: numval(state.input) == 2 ** n
        misconception: exponential
        text: Er verdoppelt sich nicht – es kommt jedes Mal 1 dazu.
    hints:
      - S² = (1 2 | 0 1), S³ = (1 3 | 0 1).
      - Jede Scherung schiebt um eine weitere Einheit.
    explanation: $S^{ {{n}} }$ = (1 {{n}} | 0 1). Scherungen addieren sich – wie Verschiebungen im Kleinen.
    difficulty: 3
    variants:
      params:
        n: int[2,12]
      defaults:
        n: 5

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum (A · B)⁻¹ = B⁻¹ · A⁻¹ ist – mit Socken und Schuhen.
    params:
      keywords:
        - - socken
          - socks
        - - schuhe
          - shoes
        - - umgekehrt
          - rückwärts
          - reverse
          - backwards
          - zuerst
          - first
      sample: "Morgens ziehe ich erst Socken, dann Schuhe an. Abends mache ich es rückgängig in umgekehrter Reihenfolge: erst Schuhe aus, dann Socken. Genauso macht man A · B rückgängig: in umgekehrter Reihenfolge, also B⁻¹ · A⁻¹."
    explanation: Was zuletzt gemacht wurde, wird zuerst rückgängig gemacht.
    difficulty: 3

srs:
  cards_from: [zweimal, faktoren]
