id: math.matrices.transform
type: concept
title: Matrices move images
summary: Stretching, rotating, reflecting.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Turning with two numbers
    body: Games turn characters, robots turn their arms – using a **rotation matrix**. Turn the arrow of length 1 and watch its tip. Its two numbers, cos and sin, are exactly what goes into that matrix.
    visual:
      widget: angle
      interactive: true
      params:
        initial: 30
        trig: true

  - kind: problem
    id: hook
    widget: choice
    prompt: You rotate a photo on your phone by 90°. What happens to each single pixel?
    params:
      options:
        - label: It gets a new place by a fixed rule
          correct: true
        - label: It changes its colour
          feedback: The colours stay.
        - label: Nothing
          feedback: The picture looks different afterwards.
    hints:
      - The picture stays the same – only turned.
    explanation: This rule is a small table of four numbers.

  - kind: explain
    id: s1
    body: |
      Every 2×2 matrix moves all points of the plane in a fixed way. $\begin{pmatrix}0 & -1\\1 & 0\end{pmatrix}$ rotates by 90° **counterclockwise**: $(x, y)$ becomes $(-y, x)$.

  - kind: problem
    id: drehen
    widget: graph
    prompt: Rotate P = (3 | 1) by 90° with this matrix. Drag Q to the result.
    params:
      x: [-4, 4]
      y: [-4, 4]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 3, y: 1, draggable: false }
        - { id: Q, x: 1, y: -2 }
      segments: [[O, P], [O, Q]]
    answer: { points: { Q: { x: -1, y: 3 } } }
    hints:
      - (x, y) becomes (−y, x).
    explanation: (−1 | 3). The arrow has turned by a quarter turn.

  - kind: problem
    id: wirkung
    widget: match
    prompt: What does the matrix do?
    params:
      pairs:
        - { left: "(2 0 | 0 2)", right: Doubles everything }
        - { left: "(1 0 | 0 −1)", right: Reflects across the x-axis }
        - { left: "(0 −1 | 1 0)", right: Rotates by 90° }
    hints:
      - Try each matrix on the point (1, 1).
    explanation: A few numbers make a whole motion. This is how games rotate their 3D worlds.

  - kind: problem
    id: flaeche
    widget: numeric
    prompt: The matrix (3 0 | 0 2) stretches a square with area 1. What is the area afterward?
    params: { placeholder: "Area" }
    answer: { value: 6 }
    hints:
      - Width times 3, height times 2.
    explanation: 3 · 2 = 6. This area factor is called the **determinant**.

  - kind: problem
    id: c1
    widget: match
    prompt: What does the matrix do to the point (1, 0)?
    params:
      pairs:
        - left: (2 0 | 0 2)
          right: lands on (2, 0)
        - left: (0 −1 | 1 0)
          right: lands on (0, 1)
        - left: (−1 0 | 0 1)
          right: lands on (−1, 0)
        - left: (1 0 | 0 −1)
          right: stays on (1, 0)
    hints:
      - The first **column** of the matrix is the image of (1, 0).
    explanation: The columns of a matrix show where the basis vectors go.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The **determinant** of (a b | c d) is ad − bc. It gives the area factor. What is it for (3 1 | 2 4)?
    answer:
      value: 10
    hints:
      - 3 · 4 − 1 · 2.
    explanation: "12 − 2 = 10: every area becomes ten times as large."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "The **columns** of a matrix tell you everything: the first is the image of (1, 0), the second the image of (0, 1). Where the grid goes decides where every point goes."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: graph
    prompt: The shear (2 1 | 0 1) acts on P = (1 | 1). Drag Q to the image.
    params:
      x:
        - -1
        - 5
      y:
        - -1
        - 4
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
        - id: P
          x: 1
          y: 1
          draggable: false
        - id: Q
          x: 0
          y: 2
      segments:
        - - O
          - P
        - - O
          - Q
    answer:
      points:
        Q:
          x: 3
          y: 1
    hints:
      - "Top: 2 · 1 + 1 · 1."
      - "Bottom: 0 · 1 + 1 · 1."
    explanation: Q = (3 | 1). The height stays, x is stretched and shifted by y.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What does determinant = 0 mean?
    params:
      options:
        - label: The matrix squashes the plane onto a line – that cannot be undone
          correct: true
        - label: The matrix changes nothing
          feedback: That would be the identity matrix with determinant 1.
        - label: The matrix reflects
          feedback: Reflections have determinant −1.
    hints:
      - "Area factor zero: how large is an image without area?"
    explanation: Information is lost. Such matrices have no inverse – the matching system of equations has no unique solution.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: The **rotation matrix** for angle θ has the columns (cos θ, sin θ) and (−sin θ, cos θ) – the rotated axes. For θ = 90° this gives exactly (0 −1 | 1 0).

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Rotate (2, 0) by 30°. What y-coordinate does the result have?
    answer:
      value: 1
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 1.732) < 0.01
        misconception: swapped
        text: That is the x-coordinate 2 · cos 30°.
    hints:
      - (2, 0) becomes (2 cos 30°, 2 sin 30°).
      - 2 · 0.5.
    explanation: 2 · sin 30° = 1. The image is (√3, 1).
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: What is the determinant of every rotation matrix (cos θ −sin θ | sin θ cos θ)?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 0
        misconception: sign-error
        text: "Compute ad − bc: cos² θ − (−sin² θ)."
    hints:
      - ad − bc = cos θ · cos θ − (−sin θ) · sin θ.
      - cos² + sin² = ?
    explanation: cos² θ + sin² θ = 1. Rotating changes no areas and does not mirror.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Tell Lux how the columns of a matrix show what it does to the plane.
    params:
      keywords:
        - - spalte
          - column
        - - pfeil
          - arrow
          - einheit
          - basis
          - unit
          - achse
          - axis
        - - bild
          - landet
          - image
          - lands
          - goes
      sample: The first column shows where the arrow (1, 0) lands, the second where (0, 1) lands. Every other point is a combination of these two arrows, so it lands at the same combination of the columns.
    explanation: "Linear maps preserve combinations: A(x, y) = x · column 1 + y · column 2."
    difficulty: 3

srs:
  cards_from: [drehen, wirkung]
