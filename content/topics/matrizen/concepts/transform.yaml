id: math.matrices.transform
type: concept
title: Matrizen bewegen Bilder
summary: Strecken, drehen, spiegeln.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Drehen mit zwei Zahlen
    body: Spiele drehen Figuren, Roboter drehen ihre Arme – mit einer **Drehmatrix**. Dreh den Pfeil der Länge 1 und schau auf seine Spitze. Ihre zwei Zahlen cos und sin stehen genau in dieser Matrix.
    visual:
      widget: angle
      interactive: true
      params:
        initial: 30
        trig: true

  - kind: problem
    id: hook
    widget: choice
    prompt: Du drehst ein Foto auf dem Handy um 90°. Was passiert mit jedem einzelnen Bildpunkt?
    params:
      options:
        - label: Er bekommt nach einer festen Regel einen neuen Platz
          correct: true
        - label: Er ändert seine Farbe
          feedback: Die Farben bleiben.
        - label: Nichts
          feedback: Das Bild sieht danach anders aus.
    hints:
      - Das Bild bleibt dasselbe – nur gedreht.
    explanation: Diese Regel ist eine kleine Tabelle aus vier Zahlen.

  - kind: explain
    id: s1
    body: |
      Jede 2×2-Matrix verschiebt alle Punkte der Ebene auf eine feste Art. $\begin{pmatrix}0 & -1\\1 & 0\end{pmatrix}$ dreht um 90° gegen den **Uhrzeigersinn**: aus $(x, y)$ wird $(-y, x)$.

  - kind: problem
    id: drehen
    widget: graph
    prompt: Drehe P = (3 | 1) mit dieser Matrix um 90°. Zieh Q an das Ergebnis.
    params:
      x: [-4, 4]
      y: [-4, 4]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: P, x: 3, y: 1, draggable: false }
        - { id: Q, x: 1, y: -2 }
      segments: [[O, P], [O, Q]]
    answer: { points: { Q: { x: -1, y: 3 } } }
    hints:
      - Aus (x, y) wird (−y, x).
    explanation: (−1 | 3) – der Pfeil hat sich um eine Vierteldrehung gedreht.

  - kind: problem
    id: wirkung
    widget: match
    prompt: Was macht die Matrix?
    params:
      pairs:
        - { left: "(2 0 | 0 2)", right: Verdoppelt alles }
        - { left: "(1 0 | 0 −1)", right: Spiegelt an der x-Achse }
        - { left: "(0 −1 | 1 0)", right: Dreht um 90° }
    hints:
      - Probier jede Matrix an dem Punkt (1, 1).
    explanation: Aus wenigen Zahlen wird eine ganze Bewegung – so drehen Spiele ihre 3D-Welten.

  - kind: problem
    id: flaeche
    widget: numeric
    prompt: Die Matrix (3 0 | 0 2) streckt ein Quadrat mit Fläche 1. Wie groß ist die Fläche danach?
    params: { placeholder: "Fläche" }
    answer: { value: 6 }
    hints:
      - Breite mal 3, Höhe mal 2.
    explanation: 3 · 2 = 6 – dieser Flächenfaktor heißt **Determinante**.

  - kind: problem
    id: c1
    widget: match
    prompt: Was macht die Matrix mit dem Punkt (1 | 0)?
    params:
      pairs:
        - left: (2 0 | 0 2)
          right: landet auf (2 | 0)
        - left: (0 −1 | 1 0)
          right: landet auf (0 | 1)
        - left: (−1 0 | 0 1)
          right: landet auf (−1 | 0)
        - left: (1 0 | 0 −1)
          right: bleibt auf (1 | 0)
    hints:
      - Die erste **Spalte** der Matrix ist das Bild von (1 | 0).
    explanation: Die Spalten einer Matrix zeigen, wohin die Grundvektoren wandern.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **Determinante** von (a b | c d) ist ad − bc. Sie gibt den Flächenfaktor an. Wie groß ist sie für (3 1 | 2 4)?
    answer:
      value: 10
    hints:
      - 3 · 4 − 1 · 2.
    explanation: "12 − 2 = 10: Jede Fläche wird zehnmal so groß."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Die **Spalten** einer Matrix verraten alles: Die erste ist das Bild von (1, 0), die zweite das Bild von (0, 1). Wohin das Gitter geht, bestimmt, wohin jeder Punkt geht."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: graph
    prompt: Die Scherung (2 1 | 0 1) wirkt auf P = (1 | 1). Zieh Q an das Bild.
    params:
      x:
        - -1
        - 5
      y:
        - -1
        - 4
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
        - id: P
          x: 1
          y: 1
          draggable: false
        - id: Q
          x: 0
          y: 2
      segments:
        - - O
          - P
        - - O
          - Q
    answer:
      points:
        Q:
          x: 3
          y: 1
    hints:
      - "Oben: 2 · 1 + 1 · 1."
      - "Unten: 0 · 1 + 1 · 1."
    explanation: Q = (3 | 1). Die Höhe bleibt, x wird gestreckt und um y verschoben.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was bedeutet Determinante = 0?
    params:
      options:
        - label: Die Matrix drückt die Ebene auf eine Linie – das lässt sich nicht umkehren
          correct: true
        - label: Die Matrix ändert nichts
          feedback: Das wäre die Einheitsmatrix mit Determinante 1.
        - label: Die Matrix spiegelt
          feedback: Spiegelungen haben Determinante −1.
    hints:
      - "Flächenfaktor null: Wie groß ist ein Bild ohne Fläche?"
    explanation: Information geht verloren. Solche Matrizen haben keine Inverse – das zugehörige Gleichungssystem ist nicht eindeutig lösbar.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Die **Drehmatrix** um den Winkel θ hat die Spalten (cos θ, sin θ) und (−sin θ, cos θ) – die gedrehten Achsen. Für θ = 90° ergibt das genau (0 −1 | 1 0).

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Drehe (2, 0) um 30°. Welche y-Koordinate hat das Ergebnis?
    answer:
      value: 1
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 1.732) < 0.01
        misconception: swapped
        text: Das ist die x-Koordinate 2 · cos 30°.
    hints:
      - (2, 0) wird zu (2 cos 30°, 2 sin 30°).
      - 2 · 0,5.
    explanation: 2 · sin 30° = 1. Das Bild ist (√3, 1).
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: numeric
    prompt: Wie groß ist die Determinante jeder Drehmatrix (cos θ −sin θ | sin θ cos θ)?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 0
        misconception: sign-error
        text: "Rechne ad − bc: cos² θ − (−sin² θ)."
    hints:
      - ad − bc = cos θ · cos θ − (−sin θ) · sin θ.
      - cos² + sin² = ?
    explanation: cos² θ + sin² θ = 1. Drehen ändert keine Flächen und spiegelt nicht.
    difficulty: 3

  - kind: problem
    id: mb-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man an den Spalten einer Matrix sieht, was sie mit der Ebene macht.
    params:
      keywords:
        - - spalte
          - column
        - - pfeil
          - arrow
          - einheit
          - basis
          - unit
          - achse
          - axis
        - - bild
          - landet
          - image
          - lands
          - goes
      sample: Die erste Spalte zeigt, wo der Pfeil (1, 0) landet, die zweite, wo (0, 1) landet. Jeder andere Punkt ist eine Kombination dieser zwei Pfeile, also landet er an derselben Kombination der Spalten.
    explanation: "Lineare Abbildungen erhalten Kombinationen: A(x, y) = x · Spalte 1 + y · Spalte 2."
    difficulty: 3

srs:
  cards_from: [drehen, wirkung]
