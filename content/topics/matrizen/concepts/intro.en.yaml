id: math.matrices.intro
type: concept
title: Tables that calculate
summary: What a matrix is.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pictures made of numbers
    body: Every photo on your phone is a table of numbers. Here each cell stands for a number from 0 to 3. Tap the cells and paint your own picture – you are writing a **matrix**.
    visual:
      widget: pixels
      interactive: true
      params:
        shades: 4
        cells:
          - ......
          - .3..3.
          - ......
          - 2....2
          - .2222.
          - ......

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a phone photo has 12 million pixels with three colour values each. How many million numbers does it consist of?"
    params:
      min: 1
      max: 100
    answer:
      value: 36
      tolerance: 6
    explanation: 36 million numbers, neatly in rows and columns.

  - kind: explain
    id: s1
    body: |
      A **matrix** is a rectangular table of numbers. A photo is a matrix of brightness values, and so is a spreadsheet. AI models consist almost entirely of matrices.

  - kind: problem
    id: eintraege
    widget: numeric
    prompt: A matrix has {{r}} rows and {{c}} columns. How many entries does it have?
    params: { unit: entries }
    answer: { value: "{{r * c}}" }
    hints:
      - Rows times columns.
    explanation: "{{r}} · {{c}} = {{r * c}}."
    variants:
      params: { r: "int[2,9]", c: "int[2,9]" }
      defaults: { r: 3, c: 4 }

  - kind: problem
    id: bild
    widget: choice
    prompt: A grayscale photo has 1920 × 1080 pixels. What does it look like as a matrix?
    params:
      options:
        - { label: 1080 rows and 1920 columns, correct: true }
        - { label: A single row of 1920 numbers, feedback: "Each pixel row becomes a matrix row. There are 1080 of them." }
    hints:
      - Each row of the image becomes a row of the matrix.
    explanation: Over two million numbers, each one a brightness.

  - kind: problem
    id: strecken
    widget: numeric
    body: "The matrix (2 0 | 0 3) acts on a vector: top times 2, bottom times 3."
    prompt: What does the vector (4, 5) become? Give the top value.
    params: { placeholder: "x" }
    answer: { value: 8 }
    hints:
      - 2 · 4.
    explanation: (8, 15). The matrix stretches by 2 in the x direction and by 3 in the y direction.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A greyscale image is a matrix of brightness values.
          right: true
        - text: A 2×3 matrix has 2 columns and 3 rows.
          right: false
          why: "Rows first: 2 rows, 3 columns."
        - text: Two matrices of the same size are added entry by entry.
          right: true

  - kind: problem
    id: intro-c1
    widget: pixels
    prompt: "This matrix with 3 rows and 4 columns is a picture: $\\begin{pmatrix}1&1&1&1\\\\0&1&1&0\\\\0&1&1&0\\end{pmatrix}$. Fill in every cell that holds a 1."
    params:
      rows: 3
      cols: 4
    answer:
      pattern:
        - "####"
        - .##.
        - .##.
    hints:
      - The first row is completely full.
      - In rows 2 and 3, only the middle two cells are a 1.
    explanation: Read row by row, a T appears. That is exactly how a computer stores a black-and-white picture.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The identity matrix has ones on the diagonal and zeros elsewhere. What does it make of the vector (7, −3)? Give the top value.
    answer:
      value: 7
    hints:
      - "Top: 1 · 7 + 0 · (−3)."
    explanation: It leaves every vector unchanged – the “1” of matrices.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: Networks are matrices too. In the **adjacency matrix**, row i, column j holds a 1 if i and j are friends, otherwise a 0. A row sum counts a person's friends.

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Three people are all friends with each other. How many ones does their adjacency matrix have? Nobody is their own friend.
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 3
        misconception: once-per-edge
        text: "Each friendship appears twice: at A→B and at B→A."
      - when: numval(state.input) == 9
        misconception: diagonal
        text: The diagonal stays 0 – nobody is their own friend.
    hints:
      - The matrix is 3 × 3, the diagonal is 0.
      - 9 − 3.
    explanation: 6 ones for 3 friendships. The matrix is symmetric because friendship goes both ways.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A colour image of 1000 × 1000 pixels has three colour channels. How many numbers does it store?
    answer:
      value: 3000000
    hints:
      - Three matrices stacked.
    explanation: 3 million. Such stacked matrices are called **tensors** – the data format of AI.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Squaring the adjacency matrix, the entry $(A^2)_{ij}$ counts the **walks of length 2** from i to j. In general $A^n$ counts walks of length n. Search engines and social networks compute like this.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: In the triangle A, B, C everyone is linked. How many walks of length 2 lead from A back to A?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: no-return
        text: "A walk may come back: A → B → A counts."
    hints:
      - First step to B or C.
      - From there straight back.
    explanation: A → B → A and A → C → A. The diagonal entry of A² is the number of friends – here 2.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux how a greyscale photo is stored as a matrix.
    params:
      keywords:
        - - pixel
          - bildpunkt
          - point
        - - zeile
          - spalte
          - row
          - column
        - - helligkeit
          - zahl
          - brightness
          - number
          - wert
          - value
      sample: Each pixel gets a number for its brightness. The numbers sit in rows and columns exactly as the pixels are arranged in the picture. That forms a matrix.
    explanation: Row = height in the picture, column = position from the left, entry = brightness. Colour images have three such matrices.
    difficulty: 3

srs:
  cards_from: [eintraege, bild]
