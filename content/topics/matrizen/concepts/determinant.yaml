id: math.matrices.determinant
type: concept
title: "Die Determinante"
summary: "Eine Zahl verrät, wie stark eine Matrix Flächen verändert."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: c1
    widget: numeric
    prompt: Eine Matrix macht alles doppelt so breit und dreimal so hoch. Auf das Wievielfache wächst die Fläche eines Quadrats?
    answer:
      value: 6
    hints:
      - Breite mal Höhe.
    explanation: 2 · 3 = 6. Dieser Flächenfaktor heißt Determinante.

  - kind: explain
    id: c2
    body: "Die **Determinante** gibt an, um welchen Faktor eine Matrix Flächen verändert. Für die Matrix (a b | c d) rechnet man: **a · d − b · c**."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Wie groß ist die Determinante von (4 1 | 2 3)?
    answer:
      value: 10
    hints:
      - 4 · 3 − 1 · 2.
    explanation: 12 − 2 = 10. Jede Fläche wird zehnmal so groß.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Und von (2 4 | 1 2)?
    answer:
      value: 0
    hints:
      - 2 · 2 − 4 · 1.
    explanation: 4 − 4 = 0. Die Fläche verschwindet.

  - kind: problem
    id: c5
    widget: choice
    prompt: Determinante null – was macht die Matrix mit der Ebene?
    params:
      options:
        - label: Sie quetscht alles auf eine Linie
          correct: true
        - label: Sie lässt alles, wie es ist
          feedback: Dann wäre die Determinante 1.
        - label: Sie dreht alles um 90°
          feedback: Eine Drehung erhält Flächen.
    hints:
      - Welche Figur hat die Fläche null?
    explanation: Die zweite Zeile ist nur ein Vielfaches der ersten. Eine Richtung geht verloren.

  - kind: problem
    id: c6
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Eine Drehung hat die Determinante 1.
          right: true
          why: Drehen ändert keine Fläche.
        - text: Verdoppelt man Breite und Höhe, ist die Determinante 2.
          right: false
          why: Sie ist 2 · 2 = 4.
        - text: Eine Spiegelung hat die Determinante −1.
          right: true
        - text: Bei Determinante 0 kann man die Abbildung rückgängig machen.
          right: false
          why: Was auf eine Linie gequetscht wurde, lässt sich nicht entfalten.
      left: Falsch
      right: Wahr

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was bedeutet eine **negative** Determinante?
    params:
      options:
        - label: Die Matrix spiegelt – aus einem Rechtsherum wird ein Linksherum
          correct: true
        - label: Die Fläche wird negativ
          feedback: Flächen bleiben positiv, der Betrag ist der Faktor.
        - label: Die Matrix ist fehlerhaft
          feedback: Negative Werte sind ganz normal.
    hints:
      - Denk an die Spiegelung mit Determinante −1.
    explanation: Das Vorzeichen zeigt die Orientierung, der Betrag den Flächenfaktor.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Matrix A hat die Determinante 3, Matrix B die Determinante −2. Welche Determinante hat ihre Verkettung A · B?
    answer:
      value: -6
    hints:
      - Flächenfaktoren hintereinander multiplizieren sich.
    explanation: 3 · (−2) = −6. Erst spiegeln und verdoppeln, dann verdreifachen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Das System 2x + k · y = 1 und 4x + 6y = 5 hat für genau ein k keine eindeutige Lösung. Für welches k?
    answer:
      value: 3
    hints:
      - Die Determinante 2 · 6 − k · 4 muss null sein.
    explanation: 12 − 4k = 0, also k = 3. Dann sind beide Geraden parallel.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Was misst die Determinante einer 3 × 3-Matrix?
    params:
      options:
        - label: Den Faktor, um den sich Volumen ändern
          correct: true
        - label: Die Summe aller Einträge
          feedback: Das wäre keine Aussage über die Abbildung.
        - label: Die Zahl der Zeilen
          feedback: Die ist immer 3.
    hints:
      - In der Ebene sind es Flächen. Und im Raum?
    explanation: "In n Dimensionen misst sie das n-dimensionale Volumen. Null heißt immer: Es wird etwas plattgedrückt."
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was eine Determinante von null bedeutet.
    params:
      keywords:
        - - fläche
          - area
          - volumen
          - volume
        - - "null"
          - zero
        - - linie
          - line
          - platt
          - flach
          - flat
          - quetsch
          - squash
        - - umkehr
          - rückgängig
          - invert
          - undo
          - reverse
      min: 3
      sample: "Die Matrix quetscht die ganze Ebene auf eine Linie. Jede Fläche wird null. Darum kann man die Abbildung nicht umkehren: Man weiß nicht mehr, woher ein Punkt kam."
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
