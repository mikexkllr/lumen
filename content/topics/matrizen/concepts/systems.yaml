id: math.matrices.systems
type: concept
title: Gleichungssysteme
summary: Viele Gleichungen auf einmal.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: zwei
    widget: numeric
    prompt: "x + y = {{s}} und x − y = {{d}}. Was ist x?"
    params: { placeholder: "x" }
    answer: { value: "{{(s + d) / 2}}" }
    hints:
      - Addiere beide Gleichungen – y fällt weg.
    explanation: "2x = {{s + d}}, also x = {{(s + d) / 2}}."
    variants:
      params: { a: "int[3,12]", b: "int[1,6]" }
      derive: { s: "a + b", d: "a - b" }
      constraints: ["a > b"]
      defaults: { a: 6, b: 4 }

  - kind: explain
    id: s2
    body: |
      Ein **Gleichungssystem** schreibt man als Matrix mal Vektor gleich Ergebnis. Computer lösen so Systeme mit Millionen Unbekannten – für Wettervorhersagen, Statik und das Training von KI.

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: "2x + y = 7 und x + y = 4. Was ist x?"
    params: { placeholder: "x" }
    answer: { value: 3 }
    hints:
      - Ziehe die zweite Gleichung von der ersten ab.
    explanation: (2x + y) − (x + y) = 7 − 4, also x = 3 und y = 1.

  - kind: problem
    id: parallel
    widget: choice
    prompt: "x + y = 3 und x + y = 5. Wie viele Lösungen gibt es?"
    params:
      options:
        - { label: Keine, correct: true }
        - { label: Genau eine, feedback: "Dieselbe Summe kann nicht 3 und 5 zugleich sein." }
        - { label: Unendlich viele, feedback: "Das wäre so, wenn beide Gleichungen gleich wären." }
    hints:
      - Kann x + y zugleich 3 und 5 sein?
    explanation: Die Geraden sind parallel und schneiden sich nie – die Matrix ist dann nicht umkehrbar.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Löse: 3x + 2y = 16 und x − y = 2. Wie groß ist y?"
    answer:
      value: 2
    hints:
      - Setze x = y + 2 in die erste Gleichung ein.
    explanation: 3(y + 2) + 2y = 16 ergibt 5y = 10.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Das Gauß-Verfahren arbeitet nur mit drei **Zeilenumformungen**: Zeilen tauschen, eine Zeile mit einer Zahl malnehmen, ein Vielfaches einer Zeile zu einer anderen addieren. Am Ende steht eine Treppe, die man von unten löst."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: "Löse von unten: x + y + z = 6, y + 2z = 8, 3z = 9. Wie groß ist x?"
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 3
        misconception: gave-z
        text: Das ist z. Setz es nach oben ein.
    hints:
      - z = 3, dann y = 8 − 6 = 2.
      - x = 6 − 2 − 3.
    explanation: x = 1, y = 2, z = 3. Rückwärts einsetzen ist der leichte Teil – die Arbeit steckt im Herstellen der Treppe.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Das Gauß-Verfahren für ein System mit drei Unbekannten. Ordne die Schritte.
    params:
      items:
        - label: Mit der ersten Gleichung x aus den anderen beiden entfernen.
        - label: Mit der zweiten Gleichung y aus der dritten entfernen.
        - label: Die dritte Gleichung nach z auflösen.
        - label: z einsetzen und y berechnen, dann x.
    hints:
      - Erst nach unten Dreiecksform erzeugen, dann von unten nach oben einsetzen.
    explanation: So lösen Computer Systeme mit Millionen Unbekannten – in etwa n³ Rechenschritten.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was hat eine Matrix mit einer Bewegung der Ebene zu tun?"
    params:
      keywords:
        - - punkt
          - vektor
          - point
          - vector
        - - dreh
          - streck
          - spiegel
          - rotate
          - stretch
          - reflect
          - scale
          - verschieb
        - - multipl
          - mal
          - times
          - produkt
          - product
      sample: Multipliziert man eine Matrix mit einem Vektor, landet der Punkt an einer neuen Stelle. So kann eine Matrix alle Punkte drehen, strecken oder spiegeln.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Mehr Gleichungen als Unbekannte, etwa viele Messpunkte für eine Gerade, haben meist keine exakte Lösung. Man sucht die beste: Die Summe der quadrierten Fehler soll minimal sein. Mit dieser **Methode der kleinsten Quadrate** fand Gauß 1801 den Zwergplaneten Ceres wieder."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Drei Messungen ergeben 2, 4 und 9. Welche Zahl c macht $(2 - c)^2 + (4 - c)^2 + (9 - c)^2$ am kleinsten?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: median
        text: 4 ist der Median. Bei Quadraten gewinnt der Mittelwert.
    hints:
      - "Ableitung null setzen: −2(2 − c) − 2(4 − c) − 2(9 − c) = 0."
      - 3c = 15.
    explanation: c = 5, der Mittelwert. Der Mittelwert ist die Lösung kleinster Quadrate. Hätte man die Beträge der Fehler minimiert, wäre der Median 4 herausgekommen.
    difficulty: 3

srs:
  cards_from: [zwei, parallel]
