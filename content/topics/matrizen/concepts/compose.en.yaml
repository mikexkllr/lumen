id: math.matrices.compose
type: concept
title: Chaining motions
summary: Matrix times matrix.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Joint by joint
    body: A robot arm reaches precisely for a screw. Each joint turns a little – and all the turns together make **one single matrix**. Uncover the stages in order.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 💪
            front: The shoulder
            back: It turns the whole arm – that is the first matrix.
          - icon: 🦾
            front: The elbow
            back: It turns the forearm once more – a second matrix joins in.
          - icon: ✋
            front: The wrist
            back: A third turn lines up the gripper.
          - icon: 🎯
            front: The target
            back: The computer multiplies all three matrices into one. So it knows at once where the hand will end up.

  - kind: problem
    id: hook
    widget: choice
    prompt: You turn a sheet by 90° and then by 90° again. What is that together?
    params:
      options:
        - label: A rotation by 180°
          correct: true
        - label: No movement
          feedback: The sheet is now upside down.
        - label: A reflection
          feedback: Two rotations remain a rotation.
    hints:
      - 90 + 90.
    explanation: Two movements make one again. You will now see how to compute that.

  - kind: explain
    id: s1
    body: |
      Two motions in a row are again one motion. Its matrix is the **product** of the two. This is how a game folds hundreds of steps into one calculation.

  - kind: problem
    id: zweimal
    widget: choice
    prompt: What do you get from rotating by 90° twice in a row?
    params:
      options:
        - { label: A rotation by 180°, correct: true }
        - { label: A reflection, feedback: "Two rotations give a rotation again." }
        - { label: A rotation by 90°, feedback: "The angles add up." }
    hints:
      - The angles add up.
    explanation: 90° + 90° = 180°. Every point lands on the opposite side.

  - kind: problem
    id: faktoren
    widget: numeric
    prompt: First everything is stretched by {{a}}, then by {{b}}. What is the total factor?
    params: { placeholder: "Factor" }
    answer: { value: "{{a * b}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: add-scales
        text: Stretches in a row multiply.
    hints:
      - Stretches multiply.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[2,5]", b: "int[3,5]" }
      defaults: { a: 2, b: 3 }

  - kind: problem
    id: reihenfolge
    widget: choice
    prompt: A game rotates a figure and then moves it. Is that the same as moving first, then rotating?
    params:
      options:
        - { label: "No, the figure ends up somewhere else.", correct: true }
        - { label: Yes, feedback: "If you move first, you then rotate around a different center." }
    hints:
      - Around which point does it rotate?
    explanation: The order of the matrices matters, which is why A · B is not B · A.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Two movements in a row make a new one. Its matrix is the [[product]] of the two – and the [[order]] matters.
      distractors:
        - sum
        - colour

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: "First turn by 90° anticlockwise, then reflect in the x-axis: where does P = (2, 1) end up? Drag Q there."
    params:
      x:
        - -4
        - 4
      y:
        - -4
        - 4
      points:
        - id: O
          x: 0
          y: 0
          draggable: false
        - id: P
          x: 2
          y: 1
          draggable: false
        - id: Q
          x: 1
          y: 3
      segments:
        - - O
          - P
        - - O
          - Q
    answer:
      points:
        Q:
          x: -1
          y: -2
    hints:
      - The 90° turn makes (x, y) into the point (−y, x).
      - Then the reflection flips the sign of y.
    explanation: "(2, 1) → (−1, 2) → (−1, −2). Together the two moves are one single matrix: a reflection in the line y = −x."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How often must you apply a 45° rotation in a row until everything is back in place?
    answer:
      value: 8
    hints:
      - 360 ÷ 45.
    explanation: The eighth power of the rotation matrix is the identity matrix.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "The **inverse** of a 2 × 2 matrix: swap a and d, flip the signs of b and c and divide by the determinant: $\\frac{1}{ad - bc}\\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}$. If the determinant is 0, there is none."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Find the inverse of (2 1 | 1 1). Which entry is top right?
    answer:
      value: -1
    feedback:
      - when: numval(state.input) == 1
        misconception: no-sign-flip
        text: The signs of b and c flip.
    hints:
      - "Determinant: 2 · 1 − 1 · 1 = 1."
      - "Inverse: (1 −1 | −1 2)."
    explanation: "The top right entry is −1. Check: (2 1 | 1 1) · (1 −1 | −1 2) = (1 0 | 0 1)."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The inverse $A^{-1}$ undoes A. What is $(A \cdot B)^{-1}$?
    params:
      options:
        - label: $B^{-1} \cdot A^{-1}$ – in reverse order
          correct: true
        - label: $A^{-1} \cdot B^{-1}$
          feedback: Last on, first off – like socks and shoes.
        - label: That does not exist
          feedback: If A and B are invertible, so is their product.
    hints:
      - First socks, then shoes. How do you take them off?
    explanation: You undo things in reverse order.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Rotating by β and then by α is a rotation by α + β. Multiply the two rotation matrices and the top left shows $\cos\alpha\cos\beta - \sin\alpha\sin\beta$. That must be cos(α + β) – this proves the **addition formulas**.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: The shear S = (1 1 | 0 1) is applied {{n}} times in a row. Which entry is top right in $S^{ {{n}} }$?
    answer:
      value: "{{n}}"
    feedback:
      - when: numval(state.input) == 1
        misconception: no-growth
        text: "Compute S²: (1 2 | 0 1). The entry grows."
      - when: numval(state.input) == 2 ** n
        misconception: exponential
        text: It does not double – 1 is added each time.
    hints:
      - S² = (1 2 | 0 1), S³ = (1 3 | 0 1).
      - Each shear shifts by one more unit.
    explanation: $S^{ {{n}} }$ = (1 {{n}} | 0 1). Shears add up – like small shifts.
    difficulty: 3
    variants:
      params:
        n: int[2,12]
      defaults:
        n: 5

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why (A · B)⁻¹ = B⁻¹ · A⁻¹ – using socks and shoes.
    params:
      keywords:
        - - socken
          - socks
        - - schuhe
          - shoes
        - - umgekehrt
          - rückwärts
          - reverse
          - backwards
          - zuerst
          - first
      sample: "In the morning I put on socks first, then shoes. In the evening I undo it in reverse order: shoes off first, then socks. A · B is undone the same way, in reverse: B⁻¹ · A⁻¹."
    explanation: What was done last is undone first.
    difficulty: 3

srs:
  cards_from: [zweimal, faktoren]
