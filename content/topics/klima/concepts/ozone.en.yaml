id: chem.climate.ozone
type: concept
title: Ozone, shield and pollutant
summary: One molecule, two faces.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The smell of a storm
    body: "**Ozone** has two faces – and you have surely smelled it before. Uncover the cards and meet the molecule made of three oxygen atoms."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌩️
            front: After the storm
            back: Lightning makes ozone. That is why the air smells so fresh and sharp afterwards.
          - icon: 🖨️
            front: The laser printer
            back: It makes a little ozone too – hence the typical office smell.
          - icon: 🚰
            front: Clean water
            back: Many waterworks kill germs with ozone instead of chlorine.
          - icon: 🔵
            front: Blue poison
            back: Liquid ozone is deep blue and can explode.

  - kind: problem
    id: hook
    widget: choice
    prompt: Why do you get sunburnt faster in the mountains?
    params:
      options:
        - label: There is less air above you to filter UV light
          correct: true
        - label: You are much closer to the Sun
          feedback: A few kilometres do not matter out of 150 million.
        - label: It is warmer there
          feedback: It is colder up there.
    hints:
      - The air acts like a filter.
    explanation: The most important UV filter is a special gas high up.

  - kind: explain
    id: s1
    body: |
      **Ozone** O₃ consists of three oxygen atoms. High up in the ozone layer, it absorbs dangerous UV light. At ground level, it irritates eyes and lungs as summer smog.

  - kind: problem
    id: ort
    widget: buckets
    prompt: Useful or harmful?
    params:
      buckets: [{ label: useful }, { label: harmful }]
      items:
        - { label: Ozone at 25 km altitude, bucket: useful }
        - { label: Ozone on a hot city day, bucket: harmful }
    hints:
      - Where does it protect against UV?
    explanation: Same molecule, different place, different effect.

  - kind: problem
    id: fckw
    widget: choice
    prompt: In the 1980s, an ozone hole was discovered. What caused it?
    params:
      options:
        - { label: CFCs from sprays and refrigerators, correct: true }
        - { label: "Airplanes tearing holes", feedback: "It was chemistry. Chlorine atoms break ozone apart." }
    hints:
      - Which substances were banned worldwide afterward?
    explanation: Chlorine from CFCs destroys ozone. One atom can break apart thousands of molecules.

  - kind: problem
    id: erfolg
    widget: order
    prompt: Put the story of the ozone hole in the right order.
    params:
      items:
        - { label: Researchers measure a thinner ozone layer }
        - { label: CFCs are identified as the cause }
        - { label: Worldwide ban in the Montreal Protocol }
        - { label: The ozone layer slowly recovers }
    hints:
      - First measure, then understand, then act.
    explanation: A rare example of the whole world solving an environmental problem together.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: "Ozone: shield or pollutant?"
    params:
      buckets:
        - id: b1
          label: Protects us
        - id: b2
          label: Harms us
      items:
        - label: Ozone layer 20 km up
          bucket: b1
        - label: Ozone in summer smog
          bucket: b2
        - label: Ozone absorbs UV light
          bucket: b1
        - label: Ozone in the air we breathe
          bucket: b2
    hints:
      - It depends on where it is.
    explanation: "The same substance: a shield above, an irritant below."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A single chlorine atom from CFCs destroys up to 100,000 ozone molecules. How is that possible?
    params:
      options:
        - label: "It acts as a catalyst: after each reaction it is released again"
          correct: true
        - label: It is as large as 100,000 ozone molecules
          feedback: It is a single small atom.
        - label: It multiplies
          feedback: Atoms do not multiply.
    hints:
      - It is not used up in the reaction.
    explanation: Cl + O₃ → ClO + O₂, then ClO + O → Cl + O₂. The chlorine is back.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "High up, hard UV light splits O₂ into two single O atoms. Each one joins an O₂: O + O₂ → O₃. In this way ozone keeps forming anew – in the **Chapman cycle**."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: "Overall, oxygen becomes ozone: 3 O₂ → 2 O₃. How many O₃ molecules form from {{3 * k}} O₂ molecules?"
    answer:
      value: "{{2 * k}}"
    feedback:
      - when: numval(state.input) == 3 * k
        misconception: ratio-ignored
        text: 3 O₂ become only 2 O₃ – the atoms are shared out anew.
    hints:
      - Every 3 O₂ give 2 O₃.
      - Work out {{3 * k}} ÷ 3 · 2.
    explanation: "{{3 * k}} O₂ have {{6 * k}} O atoms. They fit into {{2 * k}} O₃."
    difficulty: 2
    variants:
      params:
        k: int[2,20]
      defaults:
        k: 10

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: if you squeezed the whole ozone layer down to the air pressure at the ground – how thick would it be?"
    params:
      min: 0.1
      max: 1000
      scale: log
      unit: mm
    answer:
      value: 3
      tolerance: 1
    explanation: Only about 3 millimetres! This wafer-thin layer shields all life from UV-C and most UV-B.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The 1987 Montreal Protocol banned CFCs. What has happened since?
    params:
      options:
        - label: The ozone layer is slowly recovering – an example of successful environmental protection
          correct: true
        - label: Nothing – the hole keeps growing
          feedback: It is shrinking and should be closed around 2066.
        - label: The hole was gone after a year
          feedback: CFCs persist in the atmosphere for decades.
    hints:
      - CFCs stay in the air for 50 to 100 years.
    explanation: Science identified the problem, the world acted together – and it works.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: order
    prompt: This is how one chlorine atom destroys ozone again and again. Order the cycle.
    params:
      items:
        - label: UV light splits a Cl atom off the CFC
        - label: Cl + O₃ → ClO + O₂
        - label: ClO + O → Cl + O₂
        - label: The free Cl attacks the next O₃
    hints:
      - At the start, the chlorine has to be set free.
      - At the end the Cl is free again – like a catalyst.
    explanation: "Overall: O₃ + O → 2 O₂. The chlorine leaves the cycle unchanged and keeps going until it gets bound."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Why does the ozone hole form over Antarctica – and in its spring?
    params:
      options:
        - label: In the freezing polar night, chlorine is released on cloud crystals, and the first sunlight then starts the destruction
          correct: true
        - label: That is where most CFCs are used
          feedback: CFCs spread out over the whole Earth.
        - label: In spring the Sun is weakest there
          feedback: It is precisely the first sunlight that is needed.
    hints:
      - Below −78 °C, polar stratospheric clouds form.
      - The destruction needs UV light.
    explanation: On the ice crystals, bound chlorine becomes reactive. When the Sun returns in September, ozone collapses within weeks.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why ozone is good up high but bad down low.
    params:
      keywords:
        - - uv
          - ultraviolett
          - ultraviolet
        - - schütz
          - schluckt
          - absorb
          - protect
          - shield
        - - lunge
          - atem
          - reiz
          - lung
          - breath
          - irritat
          - smog
      sample: "In the stratosphere, ozone absorbs dangerous UV light and so protects skin and eyes. At ground level, though, we breathe it in: it irritates the lungs and is part of summer smog."
    explanation: The same molecule – what matters is where it is.
    difficulty: 3

srs:
  cards_from: [fckw, erfolg]
