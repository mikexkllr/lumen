id: chem.climate.ozone
type: concept
title: Ozon – Schutz und Schadstoff
summary: Ein Molekül, zwei Gesichter.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der Geruch nach Gewitter
    body: "**Ozon** hat zwei Gesichter – und du hast es sicher schon gerochen. Deck die Karten auf und lerne das Molekül aus drei Sauerstoffatomen kennen."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌩️
            front: Nach dem Gewitter
            back: Blitze bilden Ozon. Darum riecht die Luft danach so frisch und scharf.
          - icon: 🖨️
            front: Der Laserdrucker
            back: Auch er bildet etwas Ozon – daher der typische Geruch im Büro.
          - icon: 🚰
            front: Sauberes Wasser
            back: Viele Wasserwerke töten Keime mit Ozon statt mit Chlor.
          - icon: 🔵
            front: Blaues Gift
            back: Flüssiges Ozon ist tiefblau und kann explodieren.

  - kind: problem
    id: hook
    widget: choice
    prompt: Warum bekommt man in den Bergen schneller einen Sonnenbrand?
    params:
      options:
        - label: Über dir ist weniger Luft, die UV-Licht filtert
          correct: true
        - label: Man ist der Sonne viel näher
          feedback: Ein paar Kilometer machen bei 150 Millionen nichts aus.
        - label: Es ist dort wärmer
          feedback: Oben ist es kälter.
    hints:
      - Die Luft wirkt wie ein Filter.
    explanation: Den wichtigsten UV-Filter bildet ein besonderes Gas weit oben.

  - kind: explain
    id: s1
    body: |
      **Ozon** O₃ besteht aus drei Sauerstoffatomen. Hoch oben in der Ozonschicht schluckt es gefährliches UV-Licht. Am Boden dagegen reizt es Augen und Lunge – Sommersmog.

  - kind: problem
    id: ort
    widget: buckets
    prompt: Nützlich oder schädlich?
    params:
      buckets: [{ label: nützlich }, { label: schädlich }]
      items:
        - { label: Ozon in 25 km Höhe, bucket: nützlich }
        - { label: Ozon an einem heißen Stadttag, bucket: schädlich }
    hints:
      - Wo schützt es vor UV?
    explanation: Gleiches Molekül, anderer Ort – andere Wirkung.

  - kind: problem
    id: fckw
    widget: choice
    prompt: In den 1980ern entdeckte man ein Ozonloch. Was hatte es verursacht?
    params:
      options:
        - { label: FCKW aus Sprays und Kühlschränken, correct: true }
        - { label: "Flugzeuge, die Löcher reißen", feedback: "Es war Chemie – Chloratome zerlegen Ozon." }
    hints:
      - Welche Stoffe wurden daraufhin weltweit verboten?
    explanation: Chlor aus FCKW zerstört Ozon – ein Atom kann Tausende Moleküle zerlegen.

  - kind: problem
    id: erfolg
    widget: order
    prompt: Bring die Geschichte des Ozonlochs in die richtige Reihenfolge.
    params:
      items:
        - { label: Forscher messen dünnere Ozonschicht }
        - { label: FCKW werden als Ursache erkannt }
        - { label: Weltweites Verbot im Montreal-Protokoll }
        - { label: Die Ozonschicht erholt sich langsam }
    hints:
      - Erst messen, dann verstehen, dann handeln.
    explanation: Ein seltenes Beispiel, wie die ganze Welt ein Umweltproblem gemeinsam löste.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: "Ozon: Schutz oder Schadstoff?"
    params:
      buckets:
        - id: b1
          label: Schützt uns
        - id: b2
          label: Schadet uns
      items:
        - label: Ozonschicht in 20 km Höhe
          bucket: b1
        - label: Ozon im Sommersmog
          bucket: b2
        - label: Ozon schluckt UV-Licht
          bucket: b1
        - label: Ozon in der Atemluft
          bucket: b2
    hints:
      - Es kommt darauf an, wo es ist.
    explanation: "Derselbe Stoff: oben ein Schutzschild, unten ein Reizgas."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein einziges Chloratom aus FCKW zerstört bis zu 100 000 Ozonmoleküle. Wie ist das möglich?
    params:
      options:
        - label: "Es wirkt als Katalysator: Nach jeder Reaktion wird es wieder frei"
          correct: true
        - label: Es ist so groß wie 100 000 Ozonmoleküle
          feedback: Es ist ein einzelnes kleines Atom.
        - label: Es vermehrt sich
          feedback: Atome vermehren sich nicht.
    hints:
      - Es wird bei der Reaktion nicht verbraucht.
    explanation: Cl + O₃ → ClO + O₂, dann ClO + O → Cl + O₂. Das Chlor ist wieder da.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: "Hoch oben spaltet hartes UV-Licht O₂ in zwei einzelne O-Atome. Jedes lagert sich an ein O₂ an: O + O₂ → O₃. So entsteht Ozon ständig neu – im **Chapman-Zyklus**."

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: "Unterm Strich wird aus Sauerstoff Ozon: 3 O₂ → 2 O₃. Wie viele O₃-Moleküle entstehen aus {{3 * k}} O₂-Molekülen?"
    answer:
      value: "{{2 * k}}"
    feedback:
      - when: numval(state.input) == 3 * k
        misconception: ratio-ignored
        text: Aus 3 O₂ werden nur 2 O₃ – die Atome werden neu verteilt.
    hints:
      - Je 3 O₂ ergeben 2 O₃.
      - "Rechne {{3 * k}} : 3 · 2."
    explanation: "{{3 * k}} O₂ haben {{6 * k}} O-Atome. Die passen in {{2 * k}} O₃."
    difficulty: 2
    variants:
      params:
        k: int[2,20]
      defaults:
        k: 10

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wenn man die ganze Ozonschicht auf den Luftdruck am Boden zusammenpresst – wie dick wäre sie?"
    params:
      min: 0.1
      max: 1000
      scale: log
      unit: mm
    answer:
      value: 3
      tolerance: 1
    explanation: Nur etwa 3 Millimeter! Diese hauchdünne Schicht schützt alles Leben vor UV-C und dem meisten UV-B.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das Montreal-Protokoll von 1987 verbot FCKW. Was ist seither passiert?
    params:
      options:
        - label: Die Ozonschicht erholt sich langsam – ein Beispiel für gelungenen Umweltschutz
          correct: true
        - label: Nichts – das Loch wächst weiter
          feedback: Es schrumpft und dürfte um 2066 geschlossen sein.
        - label: Das Loch war nach einem Jahr verschwunden
          feedback: FCKW halten sich Jahrzehnte in der Atmosphäre.
    hints:
      - FCKW bleiben 50 bis 100 Jahre in der Luft.
    explanation: Wissenschaft erkannte das Problem, die Welt handelte gemeinsam – und es wirkt.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: order
    prompt: So zerstört ein Chloratom Ozon immer wieder. Ordne den Kreislauf.
    params:
      items:
        - label: UV-Licht spaltet ein Cl-Atom aus dem FCKW ab
        - label: Cl + O₃ → ClO + O₂
        - label: ClO + O → Cl + O₂
        - label: Das freie Cl greift das nächste O₃ an
    hints:
      - Am Anfang muss das Chlor erst frei werden.
      - Am Ende ist das Cl wieder frei – wie ein Katalysator.
    explanation: "Unterm Strich: O₃ + O → 2 O₂. Das Chlor geht unverändert aus dem Kreislauf hervor und macht weiter, bis es gebunden wird."
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Warum entsteht das Ozonloch über der Antarktis – und zwar im Frühling dort?
    params:
      options:
        - label: In der eiskalten Polarnacht wird Chlor an Wolkenkristallen freigesetzt, die erste Sonne startet dann den Abbau
          correct: true
        - label: Dort werden die meisten FCKW benutzt
          feedback: FCKW verteilen sich über die ganze Erde.
        - label: Im Frühling ist die Sonne dort am schwächsten
          feedback: Gerade das erste Sonnenlicht wird gebraucht.
    hints:
      - Bei unter −78 °C bilden sich polare Stratosphärenwolken.
      - Für den Abbau braucht es UV-Licht.
    explanation: Auf den Eiskristallen wird gebundenes Chlor reaktiv. Kehrt im September die Sonne zurück, bricht das Ozon binnen Wochen ein.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Ozon oben gut und unten schlecht ist.
    params:
      keywords:
        - - uv
          - ultraviolett
          - ultraviolet
        - - schütz
          - schluckt
          - absorb
          - protect
          - shield
        - - lunge
          - atem
          - reiz
          - lung
          - breath
          - irritat
          - smog
      sample: "In der Stratosphäre schluckt Ozon gefährliches UV-Licht und schützt so Haut und Augen. Am Boden atmen wir es aber ein: Es reizt die Lunge und ist Teil des Sommersmogs."
    explanation: Dasselbe Molekül – entscheidend ist, wo es sich befindet.
    difficulty: 3

srs:
  cards_from: [fckw, erfolg]
