id: chem.climate.ozone
type: concept
title: Ozon – Schutz und Schadstoff
summary: Ein Molekül, zwei Gesichter.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Warum bekommt man in den Bergen schneller einen Sonnenbrand?
    params:
      options:
        - label: Über dir ist weniger Luft, die UV-Licht filtert
          correct: true
        - label: Man ist der Sonne viel näher
          feedback: Ein paar Kilometer machen bei 150 Millionen nichts aus.
        - label: Es ist dort wärmer
          feedback: Oben ist es kälter.
    hints:
      - Die Luft wirkt wie ein Filter.
    explanation: Den wichtigsten UV-Filter bildet ein besonderes Gas weit oben.

  - kind: explain
    id: s1
    body: |
      **Ozon** O₃ besteht aus drei Sauerstoffatomen. Hoch oben in der Ozonschicht schluckt es gefährliches UV-Licht. Am Boden dagegen reizt es Augen und Lunge – Sommersmog.

  - kind: problem
    id: ort
    widget: buckets
    prompt: Nützlich oder schädlich?
    params:
      buckets: [{ label: nützlich }, { label: schädlich }]
      items:
        - { label: Ozon in 25 km Höhe, bucket: nützlich }
        - { label: Ozon an einem heißen Stadttag, bucket: schädlich }
    hints:
      - Wo schützt es vor UV?
    explanation: Gleiches Molekül, anderer Ort – andere Wirkung.

  - kind: problem
    id: fckw
    widget: choice
    prompt: In den 1980ern entdeckte man ein Ozonloch. Was hatte es verursacht?
    params:
      options:
        - { label: FCKW aus Sprays und Kühlschränken, correct: true }
        - { label: "Flugzeuge, die Löcher reißen", feedback: "Es war Chemie – Chloratome zerlegen Ozon." }
    hints:
      - Welche Stoffe wurden daraufhin weltweit verboten?
    explanation: Chlor aus FCKW zerstört Ozon – ein Atom kann Tausende Moleküle zerlegen.

  - kind: problem
    id: erfolg
    widget: order
    prompt: Bring die Geschichte des Ozonlochs in die richtige Reihenfolge.
    params:
      items:
        - { label: Forscher messen dünnere Ozonschicht }
        - { label: FCKW werden als Ursache erkannt }
        - { label: Weltweites Verbot im Montreal-Protokoll }
        - { label: Die Ozonschicht erholt sich langsam }
    hints:
      - Erst messen, dann verstehen, dann handeln.
    explanation: Ein seltenes Beispiel, wie die ganze Welt ein Umweltproblem gemeinsam löste.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: "Ozon: Schutz oder Schadstoff?"
    params:
      buckets:
        - id: b1
          label: Schützt uns
        - id: b2
          label: Schadet uns
      items:
        - label: Ozonschicht in 20 km Höhe
          bucket: b1
        - label: Ozon im Sommersmog
          bucket: b2
        - label: Ozon schluckt UV-Licht
          bucket: b1
        - label: Ozon in der Atemluft
          bucket: b2
    hints:
      - Es kommt darauf an, wo es ist.
    explanation: "Derselbe Stoff: oben ein Schutzschild, unten ein Reizgas."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein einziges Chloratom aus FCKW zerstört bis zu 100 000 Ozonmoleküle. Wie ist das möglich?
    params:
      options:
        - label: "Es wirkt als Katalysator: Nach jeder Reaktion wird es wieder frei"
          correct: true
        - label: Es ist so groß wie 100 000 Ozonmoleküle
          feedback: Es ist ein einzelnes kleines Atom.
        - label: Es vermehrt sich
          feedback: Atome vermehren sich nicht.
    hints:
      - Es wird bei der Reaktion nicht verbraucht.
    explanation: Cl + O₃ → ClO + O₂, dann ClO + O → Cl + O₂. Das Chlor ist wieder da.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das Montreal-Protokoll von 1987 verbot FCKW. Was ist seither passiert?
    params:
      options:
        - label: Die Ozonschicht erholt sich langsam – ein Beispiel für gelungenen Umweltschutz
          correct: true
        - label: Nichts – das Loch wächst weiter
          feedback: Es schrumpft und dürfte um 2066 geschlossen sein.
        - label: Das Loch war nach einem Jahr verschwunden
          feedback: FCKW halten sich Jahrzehnte in der Atmosphäre.
    hints:
      - FCKW bleiben 50 bis 100 Jahre in der Luft.
    explanation: Wissenschaft erkannte das Problem, die Welt handelte gemeinsam – und es wirkt.
    difficulty: 3

srs:
  cards_from: [fckw, erfolg]
