id: chem.climate.air
type: concept
title: Woraus Luft besteht
summary: Ein Gasgemisch mit Überraschungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der Luft sind Sauerstoff?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 21
      tolerance: 5
    explanation: 21 %. Der größte Teil der Luft – 78 % – ist Stickstoff.


  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne die Gase der Luft nach ihrem Anteil, den größten zuerst.
    params:
      items:
        - { label: Stickstoff }
        - { label: Sauerstoff }
        - { label: Argon }
        - { label: Kohlendioxid }
    hints:
      - Den größten Teil atmen wir einfach wieder aus, ohne ihn zu nutzen.
    explanation: Stickstoff 78 %, Sauerstoff 21 %, Argon 0,9 %, CO₂ nur 0,04 %.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: CO₂ macht etwa 0,04 % der Luft aus. Wie viele von 10 000 Luftteilchen sind CO₂?
    params: { unit: Teilchen }
    answer: { value: 4 }
    hints:
      - 0,04 % von 10 000.
    explanation: Nur 4 von 10 000 – und trotzdem prägt CO₂ das Klima.

  - kind: explain
    id: s3
    body: |
      Dass so wenig CO₂ so viel bewirkt, liegt an seiner Bauweise: Das Molekül kann **Wärmestrahlung** aufnehmen. Stickstoff und Sauerstoff lassen sie einfach durch.

  - kind: problem
    id: atmen
    widget: choice
    prompt: Was ist in ausgeatmeter Luft deutlich mehr als in eingeatmeter?
    params:
      options:
        - { label: Kohlendioxid, correct: true }
        - { label: Stickstoff, feedback: "Stickstoff nutzt der Körper nicht – sein Anteil bleibt fast gleich." }
    hints:
      - Was entsteht bei der Atmung in den Zellen?
    explanation: Ausgeatmete Luft enthält rund hundertmal so viel CO₂ wie Frischluft.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die CO₂-Konzentration liegt bei 420 ppm (Teile pro Million). Wie viel Prozent sind das?
    params:
      unit: "%"
    answer:
      value: 0.042
    hints:
      - 1 % sind 10 000 ppm.
    explanation: "420 : 10 000 = 0,042 %."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum nehmen CO₂ und Wasser Wärmestrahlung auf, Stickstoff N₂ und Sauerstoff O₂ aber nicht?
    params:
      options:
        - label: Moleküle aus mehreren Atomsorten können so schwingen, dass sich ihre Ladungsverteilung ändert
          correct: true
        - label: Weil CO₂ schwerer ist
          feedback: Argon ist ähnlich schwer und völlig wirkungslos.
        - label: Weil CO₂ künstlich ist
          feedback: CO₂ ist natürlich – nur die Menge ist das Problem.
    hints:
      - N₂ und O₂ bestehen aus zwei gleichen Atomen – völlig symmetrisch.
    explanation: Infrarotlicht regt Schwingungen an – aber nur, wenn sich dabei ein elektrischer **Dipol** ändert.
    difficulty: 3

srs:
  cards_from: [ordnen, anteil]
