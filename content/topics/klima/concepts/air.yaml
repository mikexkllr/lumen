id: chem.climate.air
type: concept
title: Woraus Luft besteht
summary: Ein Gasgemisch mit Überraschungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der Luft sind Sauerstoff?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 21
      tolerance: 5
    explanation: 21 %. Der größte Teil der Luft – 78 % – ist Stickstoff.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne die Gase der Luft nach ihrem Anteil, den größten zuerst.
    params:
      items:
        - { label: Stickstoff }
        - { label: Sauerstoff }
        - { label: Argon }
        - { label: Kohlendioxid }
    hints:
      - Den größten Teil atmen wir einfach wieder aus, ohne ihn zu nutzen.
    explanation: Stickstoff 78 %, Sauerstoff 21 %, Argon 0,9 %, CO₂ nur 0,04 %.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: CO₂ macht etwa 0,04 % der Luft aus. Wie viele von 10 000 Luftteilchen sind CO₂?
    params: { unit: Teilchen }
    answer: { value: 4 }
    hints:
      - 0,04 % von 10 000.
    explanation: Nur 4 von 10 000 – und trotzdem prägt CO₂ das Klima.

  - kind: explain
    id: s3
    body: |
      Dass so wenig CO₂ so viel bewirkt, liegt an seiner Bauweise: Das Molekül kann **Wärmestrahlung** aufnehmen. Stickstoff und Sauerstoff lassen sie einfach durch.

  - kind: problem
    id: atmen
    widget: choice
    prompt: Was ist in ausgeatmeter Luft deutlich mehr als in eingeatmeter?
    params:
      options:
        - { label: Kohlendioxid, correct: true }
        - { label: Stickstoff, feedback: "Stickstoff nutzt der Körper nicht – sein Anteil bleibt fast gleich." }
    hints:
      - Was entsteht bei der Atmung in den Zellen?
    explanation: Ausgeatmete Luft enthält rund hundertmal so viel CO₂ wie Frischluft.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die CO₂-Konzentration liegt bei 420 ppm (Teile pro Million). Wie viel Prozent sind das?
    params:
      unit: "%"
    answer:
      value: 0.042
    hints:
      - 1 % sind 10 000 ppm.
    explanation: "420 : 10 000 = 0,042 %."
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: choice
    prompt: Stickstoff und Sauerstoff sind die Nummer 1 und 2 der Luft. Welches Gas ist Nummer 3?
    params:
      options:
        - label: Argon
          correct: true
        - label: Kohlendioxid
          feedback: CO₂ hat nur 0,04 %, Argon fast 1 %.
        - label: Wasserstoff
          feedback: Freier Wasserstoff ist in der Luft fast nicht vorhanden.
    hints:
      - Es ist ein Edelgas.
      - Es macht knapp 1 % der Luft aus.
    explanation: Argon hat 0,93 % – über zwanzigmal mehr als CO₂. Es entsteht aus radioaktivem Kalium im Gestein.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Die Luft enthält 420 ppm CO₂. Wie viele Milliliter CO₂ stecken in {{v}} Litern Luft?
    params:
      unit: ml
    answer:
      value: "{{0.42 * v}}"
      tolerance: 0.01
    hints:
      - ppm heißt Teile pro Million. {{v}} Liter sind {{1000 * v}} ml.
      - "Rechne {{1000 * v}} ml · 420 : 1 000 000."
    explanation: "{{1000 * v}} ml · 0,00042 = {{0.42 * v}} ml. Ein Fingerhut voll in einem großen Koffer Luft."
    difficulty: 2
    variants:
      params:
        v: step[10,100,10]
      defaults:
        v: 50

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viel wiegt die Luftsäule über einem Quadratmeter Boden – bis ganz nach oben?"
    params:
      min: 1
      max: 100000
      scale: log
      unit: kg
    answer:
      value: 10000
      tolerance: 2500
    explanation: Rund 10 Tonnen! Dieser Druck von etwa 1 bar drückt ständig auf dich – von allen Seiten, darum spürst du ihn nicht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum nehmen CO₂ und Wasser Wärmestrahlung auf, Stickstoff N₂ und Sauerstoff O₂ aber nicht?
    params:
      options:
        - label: Moleküle aus mehreren Atomsorten können so schwingen, dass sich ihre Ladungsverteilung ändert
          correct: true
        - label: Weil CO₂ schwerer ist
          feedback: Argon ist ähnlich schwer und völlig wirkungslos.
        - label: Weil CO₂ künstlich ist
          feedback: CO₂ ist natürlich – nur die Menge ist das Problem.
    hints:
      - N₂ und O₂ bestehen aus zwei gleichen Atomen – völlig symmetrisch.
    explanation: Infrarotlicht regt Schwingungen an – aber nur, wenn sich dabei ein elektrischer **Dipol** ändert.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Luft besteht grob aus 78 % N₂ (28 g/mol), 21 % O₂ (32 g/mol) und 1 % Ar (40 g/mol). Welche mittlere molare Masse hat sie? Auf ganze g/mol.
    answer:
      value: 29
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 33.3) < 0.5
        misconception: unweighted-mean
        text: Nicht einfach mitteln – gewichte mit den Anteilen.
    hints:
      - "Gewichtetes Mittel: 0,78 · 28 + 0,21 · 32 + 0,01 · 40."
      - 21,8 + 6,7 + 0,4.
    explanation: Etwa 29 g/mol. Gase mit kleinerer molarer Masse steigen in Luft auf, schwerere sinken ab.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Bei der Weingärung entsteht CO₂ (44 g/mol). Warum ist es in Weinkellern gefährlich, sich zu bücken?
    params:
      options:
        - label: CO₂ ist schwerer als Luft und sammelt sich am Boden
          correct: true
        - label: CO₂ steigt nach oben
          feedback: Mit 44 g/mol gegen 29 g/mol sinkt es ab.
        - label: Am Boden ist es kälter
          feedback: Die Temperatur ist nicht das Problem.
    hints:
      - Vergleiche 44 g/mol mit der Luft.
      - Schwere Gase fließen wie unsichtbares Wasser nach unten.
    explanation: "Am Boden kann sich eine Schicht mit wenig Sauerstoff bilden. Früher nahm man eine Kerze mit: Erlosch sie, hieß es raus."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Argon ist ein einzelnes Atom. Kann es Wärmestrahlung schlucken wie CO₂?
    params:
      options:
        - label: Nein – ein einzelnes Atom hat keine Bindung, die schwingen könnte
          correct: true
        - label: Ja, es ist ja ein Edelgas
          feedback: Edelgas sein hilft dabei gar nicht.
        - label: Ja, sogar stärker als CO₂
          feedback: Argon wirkt gar nicht als Treibhausgas.
    hints:
      - Treibhausgase schlucken Infrarot über Schwingungen ihrer Bindungen.
      - Wo keine Bindung ist, schwingt nichts.
    explanation: Infrarot wird nur geschluckt, wenn eine Schwingung die Ladung im Molekül verschiebt. Atome und symmetrische Paare wie N₂ können das nicht.
    difficulty: 3

srs:
  cards_from: [ordnen, anteil]
