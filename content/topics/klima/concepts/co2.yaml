id: chem.climate.co2
type: concept
title: Woher das CO₂ kommt
summary: Verbrennung in Zahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Dein CO₂-Tag
    body: Jeden Tag entsteht CO₂ – beim Atmen, Essen und Fahren. Vieles davon überrascht. Deck die Karten auf und rate vorher, wo am meisten **Kohlendioxid** entsteht.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🫁
            front: Atmen
            back: Du atmest am Tag rund ein Kilogramm CO₂ aus.
          - icon: 🥩
            front: Ein Steak
            back: Ein Kilo Rindfleisch verursacht oft mehr Treibhausgas als 100 Kilometer Autofahrt.
          - icon: 🌳
            front: Ein Baum
            back: Eine Buche braucht rund 80 Jahre, um eine Tonne CO₂ zu binden.
          - icon: 📱
            front: Handy laden
            back: Ein Jahr lang täglich laden verursacht nur wenige Kilo CO₂.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Auto verbrennt 1 Liter Benzin. Wie viel Kilogramm CO₂ entstehen dabei?"
    params:
      min: 0
      max: 10
      unit: kg
    answer:
      value: 2.3
      tolerance: 0.6
    explanation: Rund 2,3 kg – mehr, als das Benzin selbst wiegt.

  - kind: explain
    id: s1
    body: |
      Beim Verbrennen verbindet sich der **Kohlenstoff** im Brennstoff mit Sauerstoff aus der Luft. Darum wiegt das entstehende CO₂ **mehr** als der Brennstoff: Ein Liter Benzin ergibt rund 2,3 kg CO₂.

  - kind: problem
    id: tank
    widget: numeric
    prompt: Ein Auto verbraucht {{l}} Liter Benzin. Wie viel CO₂ entsteht ungefähr?
    params: { unit: kg }
    answer: { value: "{{l * 2.3}}", tolerance: 0.5 }
    hints:
      - "2,3 kg pro Liter."
    explanation: "{{l}} · 2,3 ≈ {{round(l * 2.3, 1)}} kg CO₂."
    variants:
      params: { l: "choice[5,10,40,50]" }
      defaults: { l: 40 }

  - kind: problem
    id: schwerer
    widget: choice
    prompt: Wie kann aus 1 kg Benzin mehr als 3 kg CO₂ werden?
    params:
      options:
        - { label: Der Sauerstoff aus der Luft kommt dazu., correct: true }
        - { label: Das ist ein Messfehler., feedback: "Es stimmt – jedes C-Atom bekommt zwei schwere O-Atome dazu." }
    hints:
      - "C wiegt 12, O₂ wiegt 32."
    explanation: Aus 12 g Kohlenstoff werden 44 g CO₂.

  - kind: problem
    id: kurve
    widget: chart
    prompt: Die CO₂-Konzentration lag 1960 bei etwa 320 und 1990 bei 350 ppm. Stell den Wert für 2020 ein – er stieg seitdem schneller.
    params:
      labels: ["1960", "1990", "2020"]
      values: [320, 350, 320]
      editable: [2]
      min: 300
      max: 450
      step: 10
      unit: ppm
    answer: { values: [320, 350, 410] }
    hints:
      - Rund 60 ppm mehr als 1990.
    explanation: Etwa 410 ppm – vor der Industrialisierung waren es rund 280.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Kohlenstoff wiegt 12 g pro Mol, CO₂ 44 g pro Mol. Wie viel Kilogramm CO₂ entstehen beim Verbrennen von 3 kg reinem Kohlenstoff?
    params:
      unit: kg
    answer:
      value: 11
    hints:
      - "Das Verhältnis ist 44 : 12."
    explanation: 3 · 44/12 = 11 kg. Jedes C-Atom holt sich zwei O-Atome aus der Luft.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: "Benzin besteht großteils aus Octan: 2 C₈H₁₈ + ? O₂ → 16 CO₂ + 18 H₂O. Welche Zahl gehört vor O₂?"
    answer:
      value: 25
    feedback:
      - when: numval(state.input) == 50
        misconception: atoms-vs-molecules
        text: Fünfzig sind die O-Atome. Jedes O₂ trägt zwei.
    hints:
      - "Zähle die O-Atome rechts: 16 · 2 + 18."
      - 50 O-Atome stecken in 25 O₂.
    explanation: 32 + 18 = 50 O-Atome, also 25 O₂. Ein Auto braucht pro Liter Benzin rund 9000 Liter Luft.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: 1 mol Octan C₈H₁₈ wiegt 114 g. Wie viel Gramm CO₂ (44 g/mol) entstehen beim Verbrennen dieses einen Mols?
    answer:
      value: 352
    feedback:
      - when: numval(state.input) == 44
        misconception: atom-count
        text: Ein Octan hat acht C-Atome – jedes wird zu einem CO₂.
      - when: numval(state.input) == 704
        misconception: coefficient-misread
        text: Für ein Mol Octan entstehen 8 mol CO₂, nicht 16.
    hints:
      - Aus 1 mol Octan entstehen 8 mol CO₂.
      - Rechne 8 · 44 g.
    explanation: 8 · 44 g = 352 g CO₂ aus 114 g Octan – gut das Dreifache. Das passt zu 2,3 kg CO₂ pro Liter Benzin.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: "Die gemessene CO₂-Kurve zackt jedes Jahr wie eine Säge: im Mai hoch, im Herbst tief. Warum?"
    params:
      options:
        - label: Die Pflanzen der Nordhalbkugel nehmen im Sommer CO₂ auf und geben es im Winter wieder ab
          correct: true
        - label: Im Sommer fahren weniger Autos
          feedback: Der Verkehr schwankt viel zu wenig dafür.
        - label: Im Winter friert CO₂ aus
          feedback: CO₂ gefriert erst bei −78 °C.
    hints:
      - Auf der Nordhalbkugel liegt der meiste Wald.
      - Wachsende Blätter binden CO₂, verrottendes Laub gibt es zurück.
    explanation: Die Erde »atmet« im Jahrestakt. Darunter liegt der stetige Anstieg durch fossile Brennstoffe.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Flug verursacht 0,25 kg CO₂ pro Person und Kilometer. Wie viele Tonnen sind das für eine Reise von 8000 km hin und zurück?
    params:
      unit: t
    answer:
      value: 4
    hints:
      - 16 000 km · 0,25 kg.
    explanation: 4000 kg = 4 Tonnen – fast die Hälfte des Jahresausstoßes eines Menschen in Deutschland.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Methan CH₄ liefert beim Verbrennen 890 kJ pro Mol und 44 g CO₂. Wie viel Gramm CO₂ entstehen pro 1000 kJ Wärme? Auf ganze Gramm.
    answer:
      value: 49
      tolerance: 0.6
    hints:
      - "Rechne den Dreisatz: 44 g zu 890 kJ."
      - "44 : 890 · 1000."
    explanation: Etwa 49 g. Bei reinem Kohlenstoff (394 kJ pro 44 g) sind es 112 g – mehr als das Doppelte. Bei Methan liefert auch der Wasserstoff Energie.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: 1 ppm CO₂ in der Atmosphäre entspricht etwa 7,8 Milliarden Tonnen CO₂. Wir stoßen rund 40 Milliarden Tonnen pro Jahr aus. Um wie viel ppm müsste der Wert jährlich steigen? Auf eine Nachkommastelle.
    answer:
      value: 5.1
      tolerance: 0.1
    hints:
      - Teile die Menge durch die Menge pro ppm.
      - "Rechne 40 : 7,8."
    explanation: Etwa 5,1 ppm. Gemessen werden aber nur rund 2,5 ppm pro Jahr – wohin geht der Rest?
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Von unserem CO₂ bleibt nur rund die Hälfte in der Luft. Wo landet der Rest?
    params:
      options:
        - label: Im Meer und in Pflanzen und Böden an Land
          correct: true
        - label: Es zerfällt in der Sonne zu Sauerstoff
          feedback: CO₂ ist sehr stabil. Erst Pflanzen trennen C und O.
        - label: Es entweicht ins Weltall
          feedback: CO₂ ist zu schwer, um zu entweichen.
    hints:
      - Was macht die Ozeane saurer?
      - Was wächst mit CO₂ und Licht?
    explanation: Meer und Land schlucken je etwa ein Viertel. Das bremst die Erwärmung – aber das Meer versauert dabei.
    difficulty: 3

srs:
  cards_from: [tank, schwerer]
