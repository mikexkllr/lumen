id: chem.climate.co2
type: concept
title: Woher das CO₂ kommt
summary: Verbrennung in Zahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Auto verbrennt 1 Liter Benzin. Wie viel Kilogramm CO₂ entstehen dabei?"
    params:
      min: 0
      max: 10
      unit: kg
    answer:
      value: 2.3
      tolerance: 0.6
    explanation: Rund 2,3 kg – mehr, als das Benzin selbst wiegt.


  - kind: explain
    id: s1
    body: |
      Beim Verbrennen verbindet sich der Kohlenstoff im Brennstoff mit Sauerstoff aus der Luft. Darum wiegt das entstehende CO₂ **mehr** als der Brennstoff: Ein Liter Benzin ergibt rund 2,3 kg CO₂.

  - kind: problem
    id: tank
    widget: numeric
    prompt: Ein Auto verbraucht {{l}} Liter Benzin. Wie viel CO₂ entsteht ungefähr?
    params: { unit: kg }
    answer: { value: "{{l * 2.3}}", tolerance: 0.5 }
    hints:
      - "2,3 kg pro Liter."
    explanation: "{{l}} · 2,3 ≈ {{round(l * 2.3, 1)}} kg CO₂."
    variants:
      params: { l: "choice[5,10,40,50]" }
      defaults: { l: 40 }

  - kind: problem
    id: schwerer
    widget: choice
    prompt: Wie kann aus 1 kg Benzin mehr als 3 kg CO₂ werden?
    params:
      options:
        - { label: Der Sauerstoff aus der Luft kommt dazu., correct: true }
        - { label: Das ist ein Messfehler., feedback: "Es stimmt – jedes C-Atom bekommt zwei schwere O-Atome dazu." }
    hints:
      - "C wiegt 12, O₂ wiegt 32."
    explanation: Aus 12 g Kohlenstoff werden 44 g CO₂.

  - kind: problem
    id: kurve
    widget: chart
    prompt: Die CO₂-Konzentration lag 1960 bei etwa 320 und 1990 bei 350 ppm. Stell den Wert für 2020 ein – er stieg seitdem schneller.
    params:
      labels: ["1960", "1990", "2020"]
      values: [320, 350, 320]
      editable: [2]
      min: 300
      max: 450
      step: 10
      unit: ppm
    answer: { values: [320, 350, 410] }
    hints:
      - Rund 60 ppm mehr als 1990.
    explanation: Etwa 410 ppm – vor der Industrialisierung waren es rund 280.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Kohlenstoff wiegt 12 g pro Mol, CO₂ 44 g pro Mol. Wie viel Kilogramm CO₂ entstehen beim Verbrennen von 3 kg reinem Kohlenstoff?
    params:
      unit: kg
    answer:
      value: 11
    hints:
      - "Das Verhältnis ist 44 : 12."
    explanation: 3 · 44/12 = 11 kg. Jedes C-Atom holt sich zwei O-Atome aus der Luft.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein Flug verursacht 0,25 kg CO₂ pro Person und Kilometer. Wie viele Tonnen sind das für eine Reise von 8000 km hin und zurück?
    params:
      unit: t
    answer:
      value: 4
    hints:
      - 16 000 km · 0,25 kg.
    explanation: 4000 kg = 4 Tonnen – fast die Hälfte des Jahresausstoßes eines Menschen in Deutschland.
    difficulty: 3

srs:
  cards_from: [tank, schwerer]
