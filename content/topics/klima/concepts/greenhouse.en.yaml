id: chem.climate.greenhouse
type: concept
title: The greenhouse effect
summary: Why trace gases warm the Earth.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the greenhouse effect in the right order.
    params:
      items:
        - { label: Sunlight warms the ground }
        - { label: The ground radiates heat }
        - { label: Greenhouse gases absorb heat }
        - { label: They radiate some of it back to Earth }
    hints:
      - Light comes in, and heat wants to get out.
    explanation: The gases act like a blanket. Without them, Earth would average about −18 °C.

  - kind: problem
    id: gase
    widget: buckets
    prompt: Greenhouse gas or not?
    params:
      buckets: [{ label: Greenhouse gas }, { label: Not a greenhouse gas }]
      items:
        - { label: Carbon dioxide, bucket: Greenhouse gas }
        - { label: Methane, bucket: Greenhouse gas }
        - { label: Water vapor, bucket: Greenhouse gas }
        - { label: Nitrogen, bucket: Not a greenhouse gas }
        - { label: Oxygen, bucket: Not a greenhouse gas }
    hints:
      - Molecules of three or more atoms can absorb heat radiation.
    explanation: Two-atom gases like N₂ and O₂ let heat radiation pass almost unhindered.

  - kind: problem
    id: methan
    widget: choice
    prompt: Per molecule, methane is a much stronger greenhouse gas than CO₂. Why do we mostly talk about CO₂ anyway?
    params:
      options:
        - { label: "We emit far more CO₂, and it stays for centuries.", correct: true }
        - { label: Methane is harmless., feedback: "Methane is very potent, but it breaks down within decades. CO₂ stays much longer." }
    hints:
      - Amount and lifetime both count.
    explanation: Methane acts strongly but briefly. CO₂ is weaker, but it comes in huge amounts and lasts long.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Without the natural greenhouse effect the Earth would average −18 °C.
          right: true
        - text: The greenhouse effect is caused by the ozone hole.
          right: false
          why: Those are two different problems.
        - text: Water vapour is the most important natural greenhouse gas.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Over 100 years methane acts about 28 times as strongly as CO₂. How many tonnes of CO₂ correspond to 5 tonnes of methane?
    params:
      unit: t
    answer:
      value: 140
    hints:
      - 5 · 28.
    explanation: 140 tonnes of **CO₂ equivalents**. This is how gases are made comparable.
    difficulty: 2

  - kind: explain
    id: ch-d1
    depth: 2
    body: The hot Sun mostly gives off visible light. The cool Earth, by contrast, gives off invisible **infrared**. Greenhouse gases let the light through but hold back part of the infrared.

  - kind: problem
    id: ch-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: what would Earth's average temperature be without any greenhouse effect?"
    params:
      min: -60
      max: 40
      unit: °C
    answer:
      value: -18
      tolerance: 6
    explanation: About −18 °C. Today the average is about +15 °C. The natural greenhouse effect is what makes Earth habitable.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Without a greenhouse effect, the mean temperature would be −18 °C; today it is +15 °C. By how many kelvin does the effect warm Earth?
    answer:
      value: 33
    feedback:
      - when: numval(state.input) == -3 || numval(state.input) == 3
        misconception: negative-difference
        text: "From −18 to +15 is further: work out 15 − (−18)."
    hints:
      - A difference of 1 °C is also 1 K.
      - 18 up to zero, then 15 more.
    explanation: "15 − (−18) = 33 K. The human-made part comes on top: about 1.2 to 1.3 K so far."
    difficulty: 2

  - kind: problem
    id: ch-d4
    depth: 2
    widget: buckets
    prompt: Does the process amplify or slow down warming?
    params:
      buckets:
        - id: b1
          label: amplifies
        - id: b2
          label: slows down
      items:
        - label: Ice melts, exposing dark ground
          bucket: b1
        - label: Warmer air holds more water vapour
          bucket: b1
        - label: Thawing permafrost releases methane
          bucket: b1
        - label: A warmer Earth radiates more heat
          bucket: b2
        - label: Plants grow faster with more CO₂
          bucket: b2
    hints:
      - "Ask: is there more or less greenhouse effect afterwards?"
      - Warm bodies radiate more strongly – that cools.
    explanation: Stronger radiation is the main brake – without it the climate would run away. The amplifiers, though, make warming more than twice as big.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warmer air holds more water vapour – and water vapour is a greenhouse gas. What follows?
    params:
      options:
        - label: "A feedback loop: warming amplifies itself"
          correct: true
        - label: Water vapour is the real cause of climate change
          feedback: It only responds to temperature – CO₂ gives the push.
        - label: The effects cancel
          feedback: They add up.
    hints:
      - More heat, more vapour, more heat …
    explanation: "**Positive feedback**: it roughly doubles the effect of CO₂ alone."
    difficulty: 3

  - kind: explain
    id: ch-x1
    depth: 3
    body: "More CO₂ holds back more heat – but not linearly. The effect grows with the **logarithm** of the concentration: each doubling adds about the same extra heating power."

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: The extra heating power from CO₂ is roughly ΔF = 5.35 · ln(C/C₀) in W/m². How big is it for a doubling? (ln 2 ≈ 0.693) Give one decimal place.
    answer:
      value: 3.7
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - 10.7) < 0.1
        misconception: log-ignored
        text: "Not 5.35 · 2: what counts is ln 2, not the 2."
    hints:
      - For a doubling, C/C₀ = 2.
      - Work out 5.35 · 0.693.
    explanation: 5.35 · 0.693 ≈ 3.7 W/m² – on every square metre of Earth, day and night. That is like a small lamp on every square metre.
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: "How much will Earth warm in the long run if CO₂ doubles from pre-industrial levels? According to the IPCC:"
    params:
      options:
        - label: About 3 °C, likely between 2.5 and 4 °C
          correct: true
        - label: About 0.1 °C
          feedback: That is far less than we have already measured.
        - label: About 15 °C
          feedback: Neither measurements nor models show that much.
    hints:
      - CO₂ alone would give just over 1 °C – feedbacks add to it.
      - Water vapour and melting ice amplify the effect.
    explanation: This number is called climate sensitivity. It comes from measurements, Earth's history and models, which all point to the same range.
    difficulty: 3

srs:
  cards_from: [ablauf, gase]
