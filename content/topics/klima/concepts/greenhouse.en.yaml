id: chem.climate.greenhouse
type: concept
title: The greenhouse effect
summary: Why trace gases warm the Earth.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: ablauf
    widget: order
    prompt: Put the greenhouse effect in the right order.
    params:
      items:
        - { label: Sunlight warms the ground }
        - { label: The ground radiates heat }
        - { label: Greenhouse gases absorb heat }
        - { label: They radiate some of it back to Earth }
    hints:
      - Light comes in, and heat wants to get out.
    explanation: The gases act like a blanket. Without them, Earth would average about −18 °C.

  - kind: problem
    id: gase
    widget: buckets
    prompt: Greenhouse gas or not?
    params:
      buckets: [{ label: Greenhouse gas }, { label: Not a greenhouse gas }]
      items:
        - { label: Carbon dioxide, bucket: Greenhouse gas }
        - { label: Methane, bucket: Greenhouse gas }
        - { label: Water vapor, bucket: Greenhouse gas }
        - { label: Nitrogen, bucket: Not a greenhouse gas }
        - { label: Oxygen, bucket: Not a greenhouse gas }
    hints:
      - Molecules of three or more atoms can absorb heat radiation.
    explanation: Two-atom gases like N₂ and O₂ let heat radiation pass almost unhindered.

  - kind: problem
    id: methan
    widget: choice
    prompt: Per molecule, methane is a much stronger greenhouse gas than CO₂. Why do we mostly talk about CO₂ anyway?
    params:
      options:
        - { label: "We emit far more CO₂, and it stays for centuries.", correct: true }
        - { label: Methane is harmless., feedback: "Methane is very potent, but it breaks down within decades. CO₂ stays much longer." }
    hints:
      - Amount and lifetime both count.
    explanation: Methane acts strongly but briefly. CO₂ is weaker, but it comes in huge amounts and lasts long.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Without the natural greenhouse effect the Earth would average −18 °C.
          right: true
        - text: The greenhouse effect is caused by the ozone hole.
          right: false
          why: Those are two different problems.
        - text: Water vapour is the most important natural greenhouse gas.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Over 100 years methane acts about 28 times as strongly as CO₂. How many tonnes of CO₂ correspond to 5 tonnes of methane?
    params:
      unit: t
    answer:
      value: 140
    hints:
      - 5 · 28.
    explanation: 140 tonnes of **CO₂ equivalents**. This is how gases are made comparable.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warmer air holds more water vapour – and water vapour is a greenhouse gas. What follows?
    params:
      options:
        - label: "A feedback loop: warming amplifies itself"
          correct: true
        - label: Water vapour is the real cause of climate change
          feedback: It only responds to temperature – CO₂ gives the push.
        - label: The effects cancel
          feedback: They add up.
    hints:
      - More heat, more vapour, more heat …
    explanation: "**Positive feedback**: it roughly doubles the effect of CO₂ alone."
    difficulty: 3

srs:
  cards_from: [ablauf, gase]
