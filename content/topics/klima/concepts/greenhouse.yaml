id: chem.climate.greenhouse
type: concept
title: Der Treibhauseffekt
summary: Warum Spurengase die Erde wärmen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring den Treibhauseffekt in die richtige Reihenfolge.
    params:
      items:
        - { label: Sonnenlicht erwärmt den Boden }
        - { label: Der Boden strahlt Wärme ab }
        - { label: Treibhausgase nehmen Wärme auf }
        - { label: Sie strahlen einen Teil zurück zur Erde }
    hints:
      - Licht kommt herein, Wärme will hinaus.
    explanation: Die Gase wirken wie eine Decke – ohne sie wäre die Erde im Schnitt etwa −18 °C kalt.

  - kind: problem
    id: gase
    widget: buckets
    prompt: Treibhausgas oder nicht?
    params:
      buckets: [{ label: Treibhausgas }, { label: kein Treibhausgas }]
      items:
        - { label: Kohlendioxid, bucket: Treibhausgas }
        - { label: Methan, bucket: Treibhausgas }
        - { label: Wasserdampf, bucket: Treibhausgas }
        - { label: Stickstoff, bucket: kein Treibhausgas }
        - { label: Sauerstoff, bucket: kein Treibhausgas }
    hints:
      - Moleküle aus drei oder mehr Atomen können Wärmestrahlung schlucken.
    explanation: Zweiatomige Gase wie N₂ und O₂ lassen Wärmestrahlung fast ungehindert durch.

  - kind: problem
    id: methan
    widget: choice
    prompt: Methan ist pro Molekül ein viel stärkeres Treibhausgas als CO₂. Warum spricht man trotzdem meist über CO₂?
    params:
      options:
        - { label: "Wir stoßen viel mehr CO₂ aus, und es bleibt Jahrhunderte.", correct: true }
        - { label: Methan ist ungefährlich., feedback: "Methan ist sehr wirksam – aber es zerfällt in einigen Jahrzehnten, CO₂ bleibt viel länger." }
    hints:
      - Menge und Lebensdauer zählen.
    explanation: Methan wirkt stark, aber kurz – CO₂ schwächer, aber in riesigen Mengen und lange.

srs:
  cards_from: [ablauf, gase]
