id: chem.climate.greenhouse
type: concept
title: Der Treibhauseffekt
summary: Warum Spurengase die Erde wärmen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring den Treibhauseffekt in die richtige Reihenfolge.
    params:
      items:
        - { label: Sonnenlicht erwärmt den Boden }
        - { label: Der Boden strahlt Wärme ab }
        - { label: Treibhausgase nehmen Wärme auf }
        - { label: Sie strahlen einen Teil zurück zur Erde }
    hints:
      - Licht kommt herein, Wärme will hinaus.
    explanation: Die Gase wirken wie eine Decke – ohne sie wäre die Erde im Schnitt etwa −18 °C kalt.

  - kind: problem
    id: gase
    widget: buckets
    prompt: Treibhausgas oder nicht?
    params:
      buckets: [{ label: Treibhausgas }, { label: kein Treibhausgas }]
      items:
        - { label: Kohlendioxid, bucket: Treibhausgas }
        - { label: Methan, bucket: Treibhausgas }
        - { label: Wasserdampf, bucket: Treibhausgas }
        - { label: Stickstoff, bucket: kein Treibhausgas }
        - { label: Sauerstoff, bucket: kein Treibhausgas }
    hints:
      - Moleküle aus drei oder mehr Atomen können Wärmestrahlung schlucken.
    explanation: Zweiatomige Gase wie N₂ und O₂ lassen Wärmestrahlung fast ungehindert durch.

  - kind: problem
    id: methan
    widget: choice
    prompt: Methan ist pro Molekül ein viel stärkeres Treibhausgas als CO₂. Warum spricht man trotzdem meist über CO₂?
    params:
      options:
        - { label: "Wir stoßen viel mehr CO₂ aus, und es bleibt Jahrhunderte.", correct: true }
        - { label: Methan ist ungefährlich., feedback: "Methan ist sehr wirksam – aber es zerfällt in einigen Jahrzehnten, CO₂ bleibt viel länger." }
    hints:
      - Menge und Lebensdauer zählen.
    explanation: Methan wirkt stark, aber kurz – CO₂ schwächer, aber in riesigen Mengen und lange.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ohne natürlichen Treibhauseffekt wäre die Erde im Schnitt −18 °C kalt.
          right: true
        - text: Der Treibhauseffekt entsteht durch das Ozonloch.
          right: false
          why: Das sind zwei verschiedene Probleme.
        - text: Wasserdampf ist das wichtigste natürliche Treibhausgas.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Methan wirkt über 100 Jahre etwa 28-mal so stark wie CO₂. Wie viel Tonnen CO₂ entsprechen 5 Tonnen Methan?
    params:
      unit: t
    answer:
      value: 140
    hints:
      - 5 · 28.
    explanation: 140 Tonnen **CO₂-Äquivalente**. So macht man Gase vergleichbar.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wärmere Luft hält mehr Wasserdampf – und Wasserdampf ist ein Treibhausgas. Was folgt daraus?
    params:
      options:
        - label: "Eine Rückkopplung: Erwärmung verstärkt sich selbst"
          correct: true
        - label: Wasserdampf ist die eigentliche Ursache des Klimawandels
          feedback: Er reagiert nur auf die Temperatur – den Anstoß gibt das CO₂.
        - label: Die Effekte heben sich auf
          feedback: Sie addieren sich.
    hints:
      - Mehr Wärme, mehr Dampf, mehr Wärme …
    explanation: "**Positive Rückkopplung**: Sie verdoppelt etwa die Wirkung des CO₂ allein."
    difficulty: 3

srs:
  cards_from: [ablauf, gase]
