id: chem.climate.co2
type: concept
title: Where CO₂ comes from
summary: Combustion in numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a car burns 1 litre of petrol. How many kilograms of CO₂ does that make?"
    params:
      min: 0
      max: 10
      unit: kg
    answer:
      value: 2.3
      tolerance: 0.6
    explanation: About 2.3 kg – more than the petrol itself weighs.


  - kind: explain
    id: s1
    body: |
      When fuel burns, its **carbon** combines with oxygen from the air. That is why the CO₂ formed weighs **more** than the fuel. One liter of gasoline gives about 2.3 kg of CO₂.

  - kind: problem
    id: tank
    widget: numeric
    prompt: A car uses {{l}} liters of gasoline. About how much CO₂ is produced?
    params: { unit: kg }
    answer: { value: "{{l * 2.3}}", tolerance: 0.5 }
    hints:
      - "2.3 kg per liter."
    explanation: "{{l}} · 2.3 ≈ {{round(l * 2.3, 1)}} kg CO₂."
    variants:
      params: { l: "choice[5,10,40,50]" }
      defaults: { l: 40 }

  - kind: problem
    id: schwerer
    widget: choice
    prompt: How can 1 kg of gasoline become more than 3 kg of CO₂?
    params:
      options:
        - { label: Oxygen from the air is added., correct: true }
        - { label: That is a measurement error., feedback: "It is true. Each C atom gains two heavy O atoms." }
    hints:
      - "C weighs 12, O₂ weighs 32."
    explanation: 12 g of carbon becomes 44 g of CO₂.

  - kind: problem
    id: kurve
    widget: chart
    prompt: CO₂ concentration was about 320 ppm in 1960 and 350 ppm in 1990. Set the value for 2020. It has risen faster since then.
    params:
      labels: ["1960", "1990", "2020"]
      values: [320, 350, 320]
      editable: [2]
      min: 300
      max: 450
      step: 10
      unit: ppm
    answer: { values: [320, 350, 410] }
    hints:
      - About 60 ppm more than in 1990.
    explanation: About 410 ppm. Before industrialization it was around 280.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Carbon weighs 12 g per mole, CO₂ 44 g per mole. How many kilograms of CO₂ form when 3 kg of pure carbon burn?
    params:
      unit: kg
    answer:
      value: 11
    hints:
      - "The ratio is 44 : 12."
    explanation: 3 · 44/12 = 11 kg. Each C atom grabs two O atoms from the air.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A flight causes 0.25 kg of CO₂ per person and kilometre. How many tonnes is that for a trip of 8000 km there and back?
    params:
      unit: t
    answer:
      value: 4
    hints:
      - 16,000 km · 0.25 kg.
    explanation: 4000 kg = 4 tonnes – almost half the yearly emissions of a person in Germany.
    difficulty: 3

srs:
  cards_from: [tank, schwerer]
