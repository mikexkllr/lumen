id: chem.climate.co2
type: concept
title: Where CO₂ comes from
summary: Combustion in numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a car burns 1 litre of petrol. How many kilograms of CO₂ does that make?"
    params:
      min: 0
      max: 10
      unit: kg
    answer:
      value: 2.3
      tolerance: 0.6
    explanation: About 2.3 kg – more than the petrol itself weighs.

  - kind: explain
    id: s1
    body: |
      When fuel burns, its **carbon** combines with oxygen from the air. That is why the CO₂ formed weighs **more** than the fuel. One liter of gasoline gives about 2.3 kg of CO₂.

  - kind: problem
    id: tank
    widget: numeric
    prompt: A car uses {{l}} liters of gasoline. About how much CO₂ is produced?
    params: { unit: kg }
    answer: { value: "{{l * 2.3}}", tolerance: 0.5 }
    hints:
      - "2.3 kg per liter."
    explanation: "{{l}} · 2.3 ≈ {{round(l * 2.3, 1)}} kg CO₂."
    variants:
      params: { l: "choice[5,10,40,50]" }
      defaults: { l: 40 }

  - kind: problem
    id: schwerer
    widget: choice
    prompt: How can 1 kg of gasoline become more than 3 kg of CO₂?
    params:
      options:
        - { label: Oxygen from the air is added., correct: true }
        - { label: That is a measurement error., feedback: "It is true. Each C atom gains two heavy O atoms." }
    hints:
      - "C weighs 12, O₂ weighs 32."
    explanation: 12 g of carbon becomes 44 g of CO₂.

  - kind: problem
    id: kurve
    widget: chart
    prompt: CO₂ concentration was about 320 ppm in 1960 and 350 ppm in 1990. Set the value for 2020. It has risen faster since then.
    params:
      labels: ["1960", "1990", "2020"]
      values: [320, 350, 320]
      editable: [2]
      min: 300
      max: 450
      step: 10
      unit: ppm
    answer: { values: [320, 350, 410] }
    hints:
      - About 60 ppm more than in 1990.
    explanation: About 410 ppm. Before industrialization it was around 280.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Carbon weighs 12 g per mole, CO₂ 44 g per mole. How many kilograms of CO₂ form when 3 kg of pure carbon burn?
    params:
      unit: kg
    answer:
      value: 11
    hints:
      - "The ratio is 44 : 12."
    explanation: 3 · 44/12 = 11 kg. Each C atom grabs two O atoms from the air.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: numeric
    prompt: "Petrol is mostly octane: 2 C₈H₁₈ + ? O₂ → 16 CO₂ + 18 H₂O. Which number goes in front of O₂?"
    answer:
      value: 25
    feedback:
      - when: numval(state.input) == 50
        misconception: atoms-vs-molecules
        text: Fifty is the number of O atoms. Each O₂ carries two.
    hints:
      - "Count the O atoms on the right: 16 · 2 + 18."
      - 50 O atoms fit into 25 O₂.
    explanation: 32 + 18 = 50 O atoms, so 25 O₂. A car needs about 9,000 litres of air for each litre of petrol.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: 1 mol of octane C₈H₁₈ weighs 114 g. How many grams of CO₂ (44 g/mol) form when this one mole burns?
    answer:
      value: 352
    feedback:
      - when: numval(state.input) == 44
        misconception: atom-count
        text: One octane has eight C atoms – each one becomes a CO₂.
      - when: numval(state.input) == 704
        misconception: coefficient-misread
        text: One mole of octane gives 8 mol of CO₂, not 16.
    hints:
      - 1 mol of octane gives 8 mol of CO₂.
      - Work out 8 · 44 g.
    explanation: 8 · 44 g = 352 g of CO₂ from 114 g of octane – just over three times as much. That fits 2.3 kg of CO₂ per litre of petrol.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: choice
    prompt: "The measured CO₂ curve zigzags every year like a saw: high in May, low in autumn. Why?"
    params:
      options:
        - label: Plants of the northern hemisphere take up CO₂ in summer and release it again in winter
          correct: true
        - label: Fewer cars drive in summer
          feedback: Traffic varies far too little for that.
        - label: CO₂ freezes out in winter
          feedback: CO₂ only freezes at −78 °C.
    hints:
      - Most of the forest is in the northern hemisphere.
      - Growing leaves bind CO₂, rotting leaves give it back.
    explanation: Earth "breathes" once a year. Underneath lies the steady rise from fossil fuels.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A flight causes 0.25 kg of CO₂ per person and kilometre. How many tonnes is that for a trip of 8000 km there and back?
    params:
      unit: t
    answer:
      value: 4
    hints:
      - 16,000 km · 0.25 kg.
    explanation: 4000 kg = 4 tonnes – almost half the yearly emissions of a person in Germany.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Burning methane CH₄ yields 890 kJ per mole and 44 g of CO₂. How many grams of CO₂ form per 1000 kJ of heat? Round to whole grams.
    answer:
      value: 49
      tolerance: 0.6
    hints:
      - "Use simple proportion: 44 g per 890 kJ."
      - 44 ÷ 890 · 1000.
    explanation: About 49 g. For pure carbon (394 kJ per 44 g) it is 112 g – more than double. In methane, the hydrogen supplies energy too.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: numeric
    prompt: 1 ppm of CO₂ in the atmosphere is about 7.8 billion tonnes of CO₂. We emit about 40 billion tonnes per year. By how many ppm should the level rise each year? Give one decimal place.
    answer:
      value: 5.1
      tolerance: 0.1
    hints:
      - Divide the amount by the amount per ppm.
      - Work out 40 ÷ 7.8.
    explanation: About 5.1 ppm. But only about 2.5 ppm per year are measured – where does the rest go?
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Only about half of our CO₂ stays in the air. Where does the rest end up?
    params:
      options:
        - label: In the ocean and in plants and soils on land
          correct: true
        - label: It breaks down into oxygen in sunlight
          feedback: CO₂ is very stable. Only plants split C from O.
        - label: It escapes into space
          feedback: CO₂ is too heavy to escape.
    hints:
      - What is making the oceans more acidic?
      - What grows with CO₂ and light?
    explanation: Sea and land each swallow about a quarter. That slows warming – but the sea becomes more acidic.
    difficulty: 3

srs:
  cards_from: [tank, schwerer]
