id: chem.climate.solutions
type: concept
title: Solutions from chemistry
summary: Closing cycles.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: wirkt
    widget: buckets
    prompt: Does this lower the amount of CO₂ in the air?
    params:
      buckets: [{ label: lowers }, { label: does not lower }]
      items:
        - { label: Planting forests, bucket: lowers }
        - { label: Electricity from wind instead of coal, bucket: lowers }
        - { label: Rewetting peat bogs, bucket: lowers }
        - { label: Burning more coal, bucket: does not lower }
    hints:
      - Plants and bogs bind carbon.
    explanation: Burn less and bind more. Both work.

  - kind: explain
    id: s2
    body: |
      In the **carbon cycle**, carbon moves between air, plants, soil and sea. Fossil fuels bring back carbon that lay underground for millions of years. They do it faster than nature can bind it again.

  - kind: problem
    id: kreislauf
    widget: choice
    prompt: Why is wood from a sustainable forest considered more climate-friendly than coal?
    params:
      options:
        - { label: Regrowing trees bind the CO₂ again., correct: true }
        - { label: Wood releases no CO₂ when burned., feedback: "Wood also releases CO₂, but it is bound again." }
    hints:
      - Where did the tree get its carbon?
    explanation: The cycle closes. With coal, it doesn't.

  - kind: problem
    id: fussabdruck
    widget: numeric
    prompt: A person causes {{t}} tonnes of CO₂ per year. A tree binds about 0.01 tonnes per year. How many trees would it take to offset that?
    params: { unit: trees }
    answer: { value: "{{t * 100}}" }
    hints:
      - "{{t}} divided by 0.01."
    explanation: "{{t * 100}} trees. Plants alone are not enough, and lower emissions are what matters."
    variants:
      params: { t: "int[5,11]" }
      defaults: { t: 8 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Electricity from coal causes about 1000 g of CO₂ per kWh, from wind about 10 g. How many kilograms of CO₂ does a household using 3000 kWh a year save by switching?
    params:
      unit: kg
    answer:
      value: 2970
    hints:
      - 990 g less per kWh.
    explanation: 3000 · 0.99 kg = 2970 kg – almost 3 tonnes.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Does burning this fuel produce CO₂?
    params:
      buckets:
        - id: b1
          label: yes
        - id: b2
          label: no
      items:
        - label: Natural gas CH₄
          bucket: b1
        - label: Petrol
          bucket: b1
        - label: Ethanol
          bucket: b1
        - label: Wood
          bucket: b1
        - label: Hydrogen H₂
          bucket: b2
        - label: Ammonia NH₃
          bucket: b2
    hints:
      - CO₂ only forms if the fuel contains carbon.
      - Ammonia burns to nitrogen and water.
    explanation: H₂ and NH₃ contain no C. But they are only climate-friendly if they are made without fossil energy.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Cement causes about 8% of the world's CO₂ – and much of it would remain even with green electricity. Why?
    params:
      options:
        - label: "Burning limestone releases CO₂ chemically: CaCO₃ → CaO + CO₂"
          correct: true
        - label: Cement mixers run on diesel
          feedback: Transport is only a small part.
        - label: Cement gives off CO₂ while drying
          feedback: Setting concrete actually takes up some CO₂.
    hints:
      - Limestone is calcium carbonate.
      - The CO₂ is already locked in the rock.
    explanation: More than half of cement's CO₂ comes from the rock itself, not from the fire. Only capturing it or another building material can help.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Limestone CaCO₃ (100 g/mol) breaks down when burnt into CaO and CO₂ (44 g/mol). How many kg of CO₂ are released from {{m}} kg of limestone?
    params:
      unit: kg
    answer:
      value: "{{0.44 * m}}"
      tolerance: 0.01
    hints:
      - 1 mol of CaCO₃ gives 1 mol of CO₂.
      - So 44 out of 100 parts by mass are CO₂ locked in the limestone.
    explanation: "{{m}} · 44/100 = {{0.44 * m}} kg of CO₂. Almost half the rock escapes as gas."
    difficulty: 2
    variants:
      params:
        m: step[50,500,50]
      defaults:
        m: 100

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain the greenhouse effect to Lux in two or three sentences.
    params:
      keywords:
        - - sonne
          - licht
          - sun
          - light
        - - wärme
          - infrarot
          - heat
          - infrared
          - strahl
          - radiat
        - - gas
          - co2
          - co₂
          - methan
          - methane
          - atmosphäre
          - atmosphere
        - - zurück
          - hält
          - festhalten
          - back
          - trap
          - absorb
          - aufnehm
      min: 3
      sample: Sunlight warms the Earth, and the Earth radiates heat back as infrared. Gases such as CO₂ in the atmosphere absorb part of this radiation and send it back – so it stays warmer.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: "Quicklime CaO (56 g/mol) can capture CO₂ again: CaO + CO₂ → CaCO₃. At most how many kg of CO₂ can 1 tonne of CaO bind? Round to whole kg."
    answer:
      value: 786
      tolerance: 1
    hints:
      - 1000 kg of CaO is 1000 ÷ 56 kmol.
      - Each mole of CaO binds one mole of CO₂ at 44 g. Work out 1000 · 44 ÷ 56.
    explanation: About 786 kg. Such limestone loops are being tested for CO₂ capture – but the burning step must then run without fossil energy.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: "E-fuels: green hydrogen and CO₂ are turned into synthetic petrol. Why are they seen as inefficient for cars?"
    params:
      options:
        - label: Energy is lost at every conversion – an electric car goes about five times as far on the same electricity
          correct: true
        - label: They release more CO₂ than went in
          feedback: Ideally the balance is even.
        - label: Synthetic petrol does not burn
          feedback: It burns just like normal petrol.
    hints:
      - "Electricity → hydrogen → petrol → engine: every step has losses."
      - A combustion engine uses only about a third of the energy.
    explanation: With e-fuels only about 15% of the electricity reaches the wheels, with batteries 70 to 80%. E-fuels make sense where batteries hardly work – such as in planes.
    difficulty: 3

srs:
  cards_from: [wirkt, kreislauf]
