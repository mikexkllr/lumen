id: chem.climate.solutions
type: concept
title: Solutions from chemistry
summary: Closing cycles.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: wirkt
    widget: buckets
    prompt: Does this lower the amount of CO₂ in the air?
    params:
      buckets: [{ label: lowers }, { label: does not lower }]
      items:
        - { label: Planting forests, bucket: lowers }
        - { label: Electricity from wind instead of coal, bucket: lowers }
        - { label: Rewetting peat bogs, bucket: lowers }
        - { label: Burning more coal, bucket: does not lower }
    hints:
      - Plants and bogs bind carbon.
    explanation: Burn less and bind more. Both work.

  - kind: explain
    id: s2
    body: |
      In the **carbon cycle**, carbon moves between air, plants, soil and sea. Fossil fuels bring back carbon that lay underground for millions of years. They do it faster than nature can bind it again.

  - kind: problem
    id: kreislauf
    widget: choice
    prompt: Why is wood from a sustainable forest considered more climate-friendly than coal?
    params:
      options:
        - { label: Regrowing trees bind the CO₂ again., correct: true }
        - { label: Wood releases no CO₂ when burned., feedback: "Wood also releases CO₂, but it is bound again." }
    hints:
      - Where did the tree get its carbon?
    explanation: The cycle closes. With coal, it doesn't.

  - kind: problem
    id: fussabdruck
    widget: numeric
    prompt: A person causes {{t}} tonnes of CO₂ per year. A tree binds about 0.01 tonnes per year. How many trees would it take to offset that?
    params: { unit: trees }
    answer: { value: "{{t * 100}}" }
    hints:
      - "{{t}} divided by 0.01."
    explanation: "{{t * 100}} trees. Plants alone are not enough, and lower emissions are what matters."
    variants:
      params: { t: "int[5,11]" }
      defaults: { t: 8 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Electricity from coal causes about 1000 g of CO₂ per kWh, from wind about 10 g. How many kilograms of CO₂ does a household using 3000 kWh a year save by switching?
    params:
      unit: kg
    answer:
      value: 2970
    hints:
      - 990 g less per kWh.
    explanation: 3000 · 0.99 kg = 2970 kg – almost 3 tonnes.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain the greenhouse effect to Lux in two or three sentences.
    params:
      keywords:
        - - sonne
          - licht
          - sun
          - light
        - - wärme
          - infrarot
          - heat
          - infrared
          - strahl
          - radiat
        - - gas
          - co2
          - co₂
          - methan
          - methane
          - atmosphäre
          - atmosphere
        - - zurück
          - hält
          - festhalten
          - back
          - trap
          - absorb
          - aufnehm
      min: 3
      sample: Sunlight warms the Earth, and the Earth radiates heat back as infrared. Gases such as CO₂ in the atmosphere absorb part of this radiation and send it back – so it stays warmer.
    difficulty: 3

srs:
  cards_from: [wirkt, kreislauf]
