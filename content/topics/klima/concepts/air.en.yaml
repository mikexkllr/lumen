id: chem.climate.air
type: concept
title: What air is made of
summary: A gas mixture with surprises.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of air is oxygen?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 21
      tolerance: 5
    explanation: 21%. Most of the air – 78% – is nitrogen.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort the gases in air by their share, largest first.
    params:
      items:
        - { label: Nitrogen }
        - { label: Oxygen }
        - { label: Argon }
        - { label: Carbon dioxide }
    hints:
      - We simply breathe most of it out again without using it.
    explanation: Nitrogen 78 %, oxygen 21 %, argon 0.9 %, CO₂ only 0.04 %.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: CO₂ makes up about 0.04 % of air. How many of 10,000 air particles are CO₂?
    params: { unit: particles }
    answer: { value: 4 }
    hints:
      - 0.04 % of 10,000.
    explanation: Only 4 of 10,000, and yet CO₂ shapes the climate.

  - kind: explain
    id: s3
    body: |
      So little CO₂ has such a big effect because of its structure. The molecule can absorb **heat radiation**. Nitrogen and oxygen let it pass right through.

  - kind: problem
    id: atmen
    widget: choice
    prompt: What is much higher in exhaled air than in inhaled air?
    params:
      options:
        - { label: Carbon dioxide, correct: true }
        - { label: Nitrogen, feedback: "The body doesn't use nitrogen, so its share stays almost the same." }
    hints:
      - What does cellular respiration produce?
    explanation: Exhaled air contains about a hundred times as much CO₂ as fresh air.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The CO₂ concentration is 420 ppm (parts per million). What percent is that?
    params:
      unit: "%"
    answer:
      value: 0.042
    hints:
      - 1% is 10,000 ppm.
    explanation: 420 ÷ 10,000 = 0.042%.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: choice
    prompt: Nitrogen and oxygen are numbers 1 and 2 in air. Which gas is number 3?
    params:
      options:
        - label: Argon
          correct: true
        - label: Carbon dioxide
          feedback: CO₂ is only 0.04%, argon almost 1%.
        - label: Hydrogen
          feedback: There is hardly any free hydrogen in air.
    hints:
      - It is a noble gas.
      - It makes up almost 1% of air.
    explanation: Argon is 0.93% – over twenty times more than CO₂. It comes from radioactive potassium in rock.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: numeric
    prompt: Air contains 420 ppm of CO₂. How many millilitres of CO₂ are in {{v}} litres of air?
    params:
      unit: ml
    answer:
      value: "{{0.42 * v}}"
      tolerance: 0.01
    hints:
      - ppm means parts per million. {{v}} litres are {{1000 * v}} ml.
      - Work out {{1000 * v}} ml · 420 ÷ 1,000,000.
    explanation: "{{1000 * v}} ml · 0.00042 = {{0.42 * v}} ml. A thimbleful in a big suitcase of air."
    difficulty: 2
    variants:
      params:
        v: step[10,100,10]
      defaults:
        v: 50

  - kind: problem
    id: ch-d3
    depth: 2
    widget: estimate
    prompt: "Take a guess: how much does the column of air above one square metre of ground weigh – all the way up?"
    params:
      min: 1
      max: 100000
      scale: log
      unit: kg
    answer:
      value: 10000
      tolerance: 2500
    explanation: About 10 tonnes! This pressure of about 1 bar presses on you all the time – from every side, so you do not feel it.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do CO₂ and water absorb heat radiation while nitrogen N₂ and oxygen O₂ do not?
    params:
      options:
        - label: Molecules of several kinds of atoms can vibrate so that their charge distribution changes
          correct: true
        - label: Because CO₂ is heavier
          feedback: Argon is similarly heavy and has no effect at all.
        - label: Because CO₂ is artificial
          feedback: CO₂ is natural – only the amount is the problem.
    hints:
      - N₂ and O₂ consist of two identical atoms – completely symmetric.
    explanation: Infrared light excites vibrations – but only if an electric **dipole** changes in the process.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: Air is roughly 78% N₂ (28 g/mol), 21% O₂ (32 g/mol) and 1% Ar (40 g/mol). What is its mean molar mass? Round to whole g/mol.
    answer:
      value: 29
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 33.3) < 0.5
        misconception: unweighted-mean
        text: Do not just average – weight by the shares.
    hints:
      - "Weighted mean: 0.78 · 28 + 0.21 · 32 + 0.01 · 40."
      - 21.8 + 6.7 + 0.4.
    explanation: About 29 g/mol. Gases with a smaller molar mass rise in air, heavier ones sink.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: Fermenting wine produces CO₂ (44 g/mol). Why is it dangerous to bend down in a wine cellar?
    params:
      options:
        - label: CO₂ is heavier than air and collects at the floor
          correct: true
        - label: CO₂ rises
          feedback: At 44 g/mol versus 29 g/mol it sinks.
        - label: It is colder near the floor
          feedback: Temperature is not the problem.
    hints:
      - Compare 44 g/mol with air.
      - Heavy gases flow downwards like invisible water.
    explanation: "A layer with little oxygen can build up at the floor. People used to carry a candle: if it went out, they got out."
    difficulty: 3

  - kind: problem
    id: ch-x3
    depth: 3
    widget: choice
    prompt: Argon is a single atom. Can it absorb heat radiation the way CO₂ does?
    params:
      options:
        - label: No – a single atom has no bond that could vibrate
          correct: true
        - label: Yes, because it is a noble gas
          feedback: Being a noble gas does not help at all.
        - label: Yes, even more than CO₂
          feedback: Argon does not act as a greenhouse gas at all.
    hints:
      - Greenhouse gases absorb infrared through vibrations of their bonds.
      - Where there is no bond, nothing vibrates.
    explanation: Infrared is only absorbed if a vibration shifts the charge in the molecule. Single atoms and symmetrical pairs like N₂ cannot do that.
    difficulty: 3

srs:
  cards_from: [ordnen, anteil]
