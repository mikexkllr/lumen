id: chem.climate.air
type: concept
title: What air is made of
summary: A gas mixture with surprises.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort the gases in air by their share, largest first.
    params:
      items:
        - { label: Nitrogen }
        - { label: Oxygen }
        - { label: Argon }
        - { label: Carbon dioxide }
    hints:
      - We simply breathe most of it out again without using it.
    explanation: Nitrogen 78 %, oxygen 21 %, argon 0.9 %, CO₂ only 0.04 %.

  - kind: problem
    id: anteil
    widget: numeric
    prompt: CO₂ makes up about 0.04 % of air. How many of 10,000 air particles are CO₂?
    params: { unit: particles }
    answer: { value: 4 }
    hints:
      - 0.04 % of 10,000.
    explanation: Only 4 of 10,000, and yet CO₂ shapes the climate.

  - kind: explain
    body: |
      So little CO₂ has such a big effect because of its structure. The molecule can absorb **heat radiation**. Nitrogen and oxygen let it pass right through.

  - kind: problem
    id: atmen
    widget: choice
    prompt: What is much higher in exhaled air than in inhaled air?
    params:
      options:
        - { label: Carbon dioxide, correct: true }
        - { label: Nitrogen, feedback: "The body doesn't use nitrogen, so its share stays almost the same." }
    hints:
      - What does cellular respiration produce?
    explanation: Exhaled air contains about a hundred times as much CO₂ as fresh air.

srs:
  cards_from: [ordnen, anteil]
