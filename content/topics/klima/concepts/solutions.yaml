id: chem.climate.solutions
type: concept
title: Lösungen aus der Chemie
summary: Kreisläufe schließen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: wirkt
    widget: buckets
    prompt: Senkt das die CO₂-Menge in der Luft?
    params:
      buckets: [{ label: senkt }, { label: senkt nicht }]
      items:
        - { label: Wälder aufforsten, bucket: senkt }
        - { label: Strom aus Wind statt Kohle, bucket: senkt }
        - { label: Moore wieder vernässen, bucket: senkt }
        - { label: Mehr Kohle verbrennen, bucket: senkt nicht }
    hints:
      - Pflanzen und Moore binden Kohlenstoff.
    explanation: Weniger verbrennen und mehr binden – beides wirkt.

  - kind: explain
    id: s2
    body: |
      Im **Kohlenstoffkreislauf** wandert Kohlenstoff zwischen Luft, Pflanzen, Böden und Meer. Fossile Brennstoffe holen Kohlenstoff zurück, der Millionen Jahre im Boden lag – schneller, als die Natur ihn wieder binden kann.

  - kind: problem
    id: kreislauf
    widget: choice
    prompt: Warum gilt Holz aus nachhaltigem Wald als klimafreundlicher als Kohle?
    params:
      options:
        - { label: Nachwachsende Bäume binden das CO₂ wieder., correct: true }
        - { label: Holz setzt beim Brennen kein CO₂ frei., feedback: "Auch Holz setzt CO₂ frei – aber es wird wieder gebunden." }
    hints:
      - Woher hatte der Baum seinen Kohlenstoff?
    explanation: Der Kreislauf schließt sich – bei Kohle nicht.

  - kind: problem
    id: fussabdruck
    widget: numeric
    prompt: Eine Person verursacht {{t}} Tonnen CO₂ im Jahr. Ein Baum bindet etwa 0,01 Tonnen pro Jahr. Wie viele Bäume bräuchte es zum Ausgleich?
    params: { unit: Bäume }
    answer: { value: "{{t * 100}}" }
    hints:
      - "{{t}} geteilt durch 0,01."
    explanation: "{{t * 100}} Bäume – Pflanzen allein reichen nicht, weniger Ausstoß ist entscheidend."
    variants:
      params: { t: "int[5,11]" }
      defaults: { t: 8 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Strom aus Kohle verursacht etwa 1000 g CO₂ pro kWh, Strom aus Wind etwa 10 g. Wie viel Kilogramm CO₂ spart ein Haushalt mit 3000 kWh im Jahr beim Wechsel?
    params:
      unit: kg
    answer:
      value: 2970
    hints:
      - 990 g weniger pro kWh.
    explanation: 3000 · 0,99 kg = 2970 kg – fast 3 Tonnen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux den Treibhauseffekt in zwei, drei Sätzen.
    params:
      keywords:
        - - sonne
          - licht
          - sun
          - light
        - - wärme
          - infrarot
          - heat
          - infrared
          - strahl
          - radiat
        - - gas
          - co2
          - co₂
          - methan
          - methane
          - atmosphäre
          - atmosphere
        - - zurück
          - hält
          - festhalten
          - back
          - trap
          - absorb
          - aufnehm
      min: 3
      sample: Sonnenlicht erwärmt die Erde, und die Erde strahlt Wärme als Infrarot wieder ab. Gase wie CO₂ in der Atmosphäre nehmen einen Teil dieser Strahlung auf und schicken ihn zurück – so bleibt es wärmer.
    difficulty: 3

srs:
  cards_from: [wirkt, kreislauf]
