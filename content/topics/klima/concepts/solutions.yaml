id: chem.climate.solutions
type: concept
title: Lösungen aus der Chemie
summary: Kreisläufe schließen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Reise des Kohlenstoffs
    body: "Jedes Kohlenstoffatom in dir war schon in Luft, Pflanzen und Tieren. Deck den **Kohlenstoffkreislauf** Schritt für Schritt auf. Überleg dabei: Wo greifen wir Menschen ein?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🌬️
            front: In der Luft
            back: Kohlenstoff schwebt als CO₂ in der Luft.
          - icon: 🌳
            front: In der Pflanze
            back: Blätter holen CO₂ und bauen daraus Holz und Zucker.
          - icon: 🐄
            front: Im Tier
            back: Tiere fressen Pflanzen und nutzen den Kohlenstoff als Energie.
          - icon: 🍂
            front: Im Boden
            back: Laub und Tiere verrotten. Dabei wird wieder CO₂ frei.

  - kind: problem
    id: wirkt
    widget: buckets
    prompt: Senkt das die CO₂-Menge in der Luft?
    params:
      buckets: [{ label: senkt }, { label: senkt nicht }]
      items:
        - { label: Wälder aufforsten, bucket: senkt }
        - { label: Strom aus Wind statt Kohle, bucket: senkt }
        - { label: Moore wieder vernässen, bucket: senkt }
        - { label: Mehr Kohle verbrennen, bucket: senkt nicht }
    hints:
      - Pflanzen und Moore binden Kohlenstoff.
    explanation: Weniger verbrennen und mehr binden – beides wirkt.

  - kind: explain
    id: s2
    body: |
      Im **Kohlenstoffkreislauf** wandert Kohlenstoff zwischen Luft, Pflanzen, Böden und Meer. Fossile Brennstoffe holen Kohlenstoff zurück, der Millionen Jahre im Boden lag – schneller, als die Natur ihn wieder binden kann.

  - kind: problem
    id: kreislauf
    widget: choice
    prompt: Warum gilt Holz aus nachhaltigem Wald als klimafreundlicher als Kohle?
    params:
      options:
        - { label: Nachwachsende Bäume binden das CO₂ wieder., correct: true }
        - { label: Holz setzt beim Brennen kein CO₂ frei., feedback: "Auch Holz setzt CO₂ frei – aber es wird wieder gebunden." }
    hints:
      - Woher hatte der Baum seinen Kohlenstoff?
    explanation: Der Kreislauf schließt sich – bei Kohle nicht.

  - kind: problem
    id: fussabdruck
    widget: numeric
    prompt: Eine Person verursacht {{t}} Tonnen CO₂ im Jahr. Ein Baum bindet etwa 0,01 Tonnen pro Jahr. Wie viele Bäume bräuchte es zum Ausgleich?
    params: { unit: Bäume }
    answer: { value: "{{t * 100}}" }
    hints:
      - "{{t}} geteilt durch 0,01."
    explanation: "{{t * 100}} Bäume – Pflanzen allein reichen nicht, weniger Ausstoß ist entscheidend."
    variants:
      params: { t: "int[5,11]" }
      defaults: { t: 8 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Strom aus Kohle verursacht etwa 1000 g CO₂ pro kWh, Strom aus Wind etwa 10 g. Wie viel Kilogramm CO₂ spart ein Haushalt mit 3000 kWh im Jahr beim Wechsel?
    params:
      unit: kg
    answer:
      value: 2970
    hints:
      - 990 g weniger pro kWh.
    explanation: 3000 · 0,99 kg = 2970 kg – fast 3 Tonnen.
    difficulty: 2

  - kind: problem
    id: ch-d1
    depth: 2
    widget: buckets
    prompt: Entsteht beim Verbrennen dieses Brennstoffs CO₂?
    params:
      buckets:
        - id: b1
          label: ja
        - id: b2
          label: nein
      items:
        - label: Erdgas CH₄
          bucket: b1
        - label: Benzin
          bucket: b1
        - label: Ethanol
          bucket: b1
        - label: Holz
          bucket: b1
        - label: Wasserstoff H₂
          bucket: b2
        - label: Ammoniak NH₃
          bucket: b2
    hints:
      - CO₂ entsteht nur, wenn Kohlenstoff im Brennstoff ist.
      - Ammoniak verbrennt zu Stickstoff und Wasser.
    explanation: H₂ und NH₃ enthalten kein C. Klimafreundlich sind sie aber nur, wenn ihre Herstellung ohne fossile Energie auskommt.
    difficulty: 2

  - kind: problem
    id: ch-d2
    depth: 2
    widget: choice
    prompt: Zement verursacht rund 8 % des weltweiten CO₂ – selbst mit Ökostrom bliebe viel davon. Warum?
    params:
      options:
        - label: "Beim Brennen von Kalk wird CO₂ chemisch frei: CaCO₃ → CaO + CO₂"
          correct: true
        - label: Die Zementmischer fahren mit Diesel
          feedback: Der Transport ist nur ein kleiner Teil.
        - label: Zement verdunstet CO₂ beim Trocknen
          feedback: Beim Abbinden nimmt Beton eher CO₂ auf.
    hints:
      - Kalkstein ist Calciumcarbonat.
      - Das CO₂ steckt schon im Gestein.
    explanation: Mehr als die Hälfte des Zement-CO₂ stammt aus dem Gestein selbst, nicht aus dem Feuer. Hier hilft nur Abscheiden oder ein anderer Baustoff.
    difficulty: 2

  - kind: problem
    id: ch-d3
    depth: 2
    widget: numeric
    prompt: Kalkstein CaCO₃ (100 g/mol) zerfällt beim Brennen in CaO und CO₂ (44 g/mol). Wie viel kg CO₂ werden aus {{m}} kg Kalkstein frei?
    params:
      unit: kg
    answer:
      value: "{{0.44 * m}}"
      tolerance: 0.01
    hints:
      - Aus 1 mol CaCO₃ entsteht 1 mol CO₂.
      - Also stecken 44 von 100 Massenteilen als CO₂ im Kalk.
    explanation: "{{m}} · 44/100 = {{0.44 * m}} kg CO₂. Fast die Hälfte des Gesteins entweicht als Gas."
    difficulty: 2
    variants:
      params:
        m: step[50,500,50]
      defaults:
        m: 100

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux den Treibhauseffekt in zwei, drei Sätzen.
    params:
      keywords:
        - - sonne
          - licht
          - sun
          - light
        - - wärme
          - infrarot
          - heat
          - infrared
          - strahl
          - radiat
        - - gas
          - co2
          - co₂
          - methan
          - methane
          - atmosphäre
          - atmosphere
        - - zurück
          - hält
          - festhalten
          - back
          - trap
          - absorb
          - aufnehm
      min: 3
      sample: Sonnenlicht erwärmt die Erde, und die Erde strahlt Wärme als Infrarot wieder ab. Gase wie CO₂ in der Atmosphäre nehmen einen Teil dieser Strahlung auf und schicken ihn zurück – so bleibt es wärmer.
    difficulty: 3

  - kind: problem
    id: ch-x1
    depth: 3
    widget: numeric
    prompt: "Branntkalk CaO (56 g/mol) kann CO₂ wieder binden: CaO + CO₂ → CaCO₃. Wie viel kg CO₂ bindet 1 Tonne CaO höchstens? Auf ganze kg."
    answer:
      value: 786
      tolerance: 1
    hints:
      - "1000 kg CaO sind 1000 : 56 kmol."
      - "Jedes Mol CaO bindet ein Mol CO₂ mit 44 g. Rechne 1000 · 44 : 56."
    explanation: Etwa 786 kg. Solche Kreisläufe mit Kalk werden als CO₂-Abscheidung erprobt – nur das Brennen muss dann ohne fossile Energie laufen.
    difficulty: 3

  - kind: problem
    id: ch-x2
    depth: 3
    widget: choice
    prompt: "E-Fuels: Aus grünem Wasserstoff und CO₂ entsteht synthetisches Benzin. Warum gelten sie fürs Auto als wenig effizient?"
    params:
      options:
        - label: Bei jeder Umwandlung geht Energie verloren – ein E-Auto fährt mit demselben Strom etwa fünfmal so weit
          correct: true
        - label: Sie setzen mehr CO₂ frei, als hineinging
          feedback: Im Idealfall ist die Bilanz ausgeglichen.
        - label: Synthetisches Benzin brennt nicht
          feedback: Es brennt genau wie normales Benzin.
    hints:
      - "Strom → Wasserstoff → Benzin → Motor: Jeder Schritt hat Verluste."
      - Ein Verbrennungsmotor nutzt nur etwa ein Drittel der Energie.
    explanation: Vom Strom kommen beim E-Fuel nur rund 15 % am Rad an, beim Akku 70 bis 80 %. Sinnvoll sind E-Fuels dort, wo Akkus kaum gehen – etwa im Flugzeug.
    difficulty: 3

srs:
  cards_from: [wirkt, kreislauf]
