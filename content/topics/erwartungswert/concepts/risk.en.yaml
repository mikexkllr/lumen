id: stats.expected.risk
type: concept
title: Same average, different risk
summary: How much does the result swing?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Same average, wilder ride
    body: Two investments pay the same on average. Yet one feels much wilder. Move the **spread** slider up and down. How often do you still land close to the average?
    visual:
      widget: sim
      interactive: true
      params:
        scene: normal
        controls:
          mean:
            value: 100
            fixed: true

  - kind: problem
    id: zwei-spiele
    widget: choice
    body: Game A – a sure 10 €. Game B – a coin flip for 0 € or 20 €.
    prompt: What is true?
    params:
      options:
        - { label: Same expected value – B is riskier., correct: true }
        - { label: B pays more on average., feedback: "1/2 · 20 € = 10 € – just like A." }
        - { label: A pays more on average., feedback: "Both pay 10 € on average." }
    hints:
      - Work out both expected values.
    explanation: The average is the same, the swing is not.

  - kind: explain
    id: s2
    body: |
      The expected value only tells you what comes out **on average**. The **spread** shows how much it swings.
      Many people pay for less swing – that is the core of every insurance.

  - kind: problem
    id: schnitt
    widget: numeric
    prompt: "A game – with a 1/{{k}} chance you win {{g}} €, otherwise nothing. What is the expected value?"
    params: { unit: "€" }
    answer: { value: "{{g / k}}" }
    hints:
      - "{{g}} € · 1/{{k}}."
    explanation: "{{g}} / {{k}} = {{g / k}} €."
    variants:
      params: { k: "choice[2,4,5,10]", g: "choice[20,40,100]" }
      defaults: { k: 4, g: 40 }

  - kind: problem
    id: lieber
    widget: buckets
    prompt: Rather little or a lot of swing?
    params:
      buckets: [{ label: little swing }, { label: a lot of swing }]
      items:
        - { label: Fixed salary, bucket: little swing }
        - { label: Savings account, bucket: little swing }
        - { label: Lotto, bucket: a lot of swing }
        - { label: Commission on sales, bucket: a lot of swing }
        - { label: A single stock, bucket: a lot of swing }
    hints:
      - How certain is the result?
    explanation: The same expectation can carry very different risk.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: How much does the result vary?
    params:
      buckets:
        - id: b1
          label: Little variation
        - id: b2
          label: Much variation
      items:
        - label: Savings account
          bucket: b1
        - label: Lottery ticket
          bucket: b2
        - label: Fixed salary
          bucket: b1
        - label: A single share
          bucket: b2
    hints:
      - Where do you know fairly exactly beforehand what comes out?
    explanation: The average alone does not tell how risky something is.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: "Set four rounds of a risky game: €5 on average, but at least €8 between the best and the worst round."
    params:
      labels:
        - Round 1
        - Round 2
        - Round 3
        - Round 4
      values:
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      unit: €
      show:
        - mean
    check:
      predicate: avg == 5 && max(values) - min(values) >= 8
    solution:
      state:
        values:
          - 1
          - 9
          - 1
          - 9
    hints:
      - Whatever you add to one round, you have to take from another.
      - For example €1, €9, €1 and €9 – the average stays €5.
    explanation: "Same expected value, much more **spread**: that is exactly what sets a risky game apart from a safe one."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Two offers: a sure €3000 – or an 80% chance of €4000. Most take the €3000. What is this called?"
    params:
      options:
        - label: Risk aversion – you give up expected gain for certainty
          correct: true
        - label: A calculation error
          feedback: It is a deliberate and often reasonable trade-off.
        - label: Gambler’s fallacy
          feedback: That concerns the belief in “due” outcomes.
    hints:
      - The expected value of the bet is €3200.
    explanation: The second thousand brings less satisfaction than the first. That is why insurance exists.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: A game gives either {{2 * g}} € or 0 €, 50 % each. What is the standard deviation?
    params:
      unit: €
    answer:
      value: "{{g}}"
    hints:
      - The expected value is {{g}} €.
      - Both outcomes are exactly {{g}} € away from the expected value.
    explanation: Both distances are {{g}}, so σ = {{g}} €. The standard deviation measures risk in euros.
    difficulty: 2
    variants:
      params:
        g: choice[5,10,25,50,100]
      defaults:
        g: 10

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: One investment fluctuates with σ = 20 %. You split your money equally across 4 such investments that fluctuate independently. What is σ now?
    params:
      unit: "%"
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 5
        misconception: divide-by-n
        text: Dividing by 4 is too optimistic. The spread falls with √n.
    hints:
      - Averaging n independent values shrinks σ by √n.
      - 20 ÷ √4.
    explanation: "20 ÷ 2 = 10 %. That is diversification: same expected value, half the risk."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: People feel a loss of €100 about twice as strongly as a gain of €100. What follows?
    params:
      options:
        - label: They reject fair bets and hold on to losses too long
          correct: true
        - label: They especially like to gamble
          feedback: Fear of loss rather keeps people from gambling.
        - label: Nothing – it evens out
          feedback: The asymmetry measurably distorts decisions.
    hints:
      - Would you toss a coin for ±€100?
    explanation: "**Loss aversion** from Kahneman and Tversky’s prospect theory – Nobel Prize 2002."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Two independent risks have σ = 3 and σ = 4. What is the standard deviation of their sum?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 7
        misconception: add-sd
        text: Standard deviations do not add – variances do.
    hints:
      - "Add the variances: 9 + 16."
      - Take the square root of 25.
    explanation: √(9 + 16) = 5 – just like Pythagoras. Independent risks are, in a sense, at right angles.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: A bank spreads loans across 1000 homeowners in the same region. Why did that barely help in 2008?
    params:
      options:
        - label: The risks were linked – when house prices fall, everyone is hit at once
          correct: true
        - label: Even a million would not help if they all fall together.
          feedback: Auch eine Million hilft nicht, wenn alle gemeinsam fallen.
        - label: That was exactly the mistake.
          feedback: Genau das war der Irrtum.
    hints:
      - The √n rule needs one condition. Which?
      - Independence is missing when a common factor acts.
    explanation: With correlated risks a remainder stays that no spreading averages away. Banks underestimated how strongly defaults were linked.
    difficulty: 3

srs:
  cards_from: [zwei-spiele, schnitt]
