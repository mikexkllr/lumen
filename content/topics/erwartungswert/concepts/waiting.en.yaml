id: stats.expected.waiting
type: concept
title: How long do I have to wait?
summary: On average, six rolls until a six.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Waiting for the six
    body: How long do you wait for a six in a board game? Roll one throw at a time and count until it comes. Reset and try a few times. Does the **waiting** feel the same each time?
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: "1"
          - label: "2"
          - label: "3"
          - label: "4"
          - label: "5"
          - label: "6"
        sample:
          - 1

  - kind: problem
    id: sechs
    widget: numeric
    prompt: How many times do you have to roll on average until the first 6 comes up?
    params: { unit: rolls }
    answer: { value: 6 }
    hints:
      - The chance per roll is 1/6.
    explanation: With a 1/6 chance, it takes 6 rolls on average.

  - kind: explain
    id: s2
    body: |
      If an event has chance p per try, you wait **1/p** **tries** on average.
      At 1%, that is 100 tries on average.

  - kind: problem
    id: wartezeit
    widget: numeric
    prompt: A collector card is in {{p}}% of the packs. How many packs do you open on average until it shows up?
    params: { unit: packs }
    answer: { value: "{{100 / p}}" }
    hints:
      - "1 divided by {{p / 100}}."
    explanation: "100 / {{p}} = {{100 / p}} packs."
    variants:
      params: { p: "choice[2,4,5,10,20,25]" }
      defaults: { p: 5 }

  - kind: problem
    id: gedaechtnis
    widget: choice
    prompt: You have already rolled 10 times without a 6. How many more rolls does it take on average now?
    params:
      options:
        - { label: Still 6, correct: true }
        - { label: Fewer – it is overdue, feedback: "The die has no memory." }
        - { label: More – today is just unlucky, feedback: "Bad luck is not a property of the die." }
    hints:
      - Does the die know what came before?
    explanation: Every roll starts fresh. The waiting time starts over each time.

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: A prize wheel hits with chance 1/4 on every spin. Mark how many spins you need on average until the first hit.
    params:
      min: 0
      max: 10
      ticks: 1
    answer:
      value: 4
    hints:
      - With chance p you wait 1/p tries on average.
      - 1 ÷ 1/4 = 4.
    explanation: 4 spins on average. Sometimes it works at once, sometimes it takes much longer – the average stays 4.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A collector’s album has 6 different pictures, each equally frequent. How many packs do you need on average for **all** six? (6/6 + 6/5 + 6/4 + 6/3 + 6/2 + 6/1)
    answer:
      value: 14.7
      tolerance: 0.1
    hints:
      - 1 + 1.2 + 1.5 + 2 + 3 + 6.
    explanation: 14.7 packs. The last picture alone costs 6 on average – the **coupon collector’s problem**.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: How likely is it that the first 6 comes exactly on the third roll? As a fraction.
    answer:
      value: 25/216
    hints:
      - The first two rolls are not a 6, the third is.
      - 5/6 · 5/6 · 1/6.
    explanation: (5/6)² · 1/6 = 25/216 ≈ 11.6 %. That is the geometric distribution. Its expected value is 1/p = 6.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: an album has 50 different stickers; each pack has one at random. How many packs do you need on average for all 50?"
    params:
      min: 50
      max: 1000
    answer:
      value: 225
      within: 20
    explanation: "50 · (1/50 + 1/49 + … + 1/1) ≈ 50 · 4.5 ≈ 225. The last stickers cost the most: for the very last one you wait 50 packs on average."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Buses come every 10 minutes on average, but irregularly. You arrive at the stop at random. How long do you wait on average?
    params:
      options:
        - label: Longer than 5 minutes – you are more likely to hit one of the long gaps
          correct: true
        - label: Exactly 5 minutes
          feedback: That only holds for perfectly regular buses.
        - label: Shorter than 5 minutes
          feedback: Short gaps are hit less often.
    hints:
      - Long gaps take up more time – you land in them more often.
    explanation: The **waiting time paradox**. With completely random gaps you even wait a full 10 minutes on average.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: You flip a coin until two heads in a row appear (HH). How many flips does it take on average?
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 4
        misconception: hh-vs-ht
        text: 4 flips is the average for HT. HH takes longer.
    hints:
      - After a miss T you start over. After HT as well.
      - Let E be the waiting time. Then E = ½(1 + E) + ¼(2 + E) + ¼ · 2.
    explanation: Solving the equation gives E = 6. For HT it is only 4 flips, although both patterns have probability 1/4.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Why do you wait longer for HH than for HT, although both are equally likely?
    params:
      options:
        - label: With HH a miss destroys your progress, with HT it does not
          correct: true
        - label: The coin is fair.
          feedback: Die Münze ist fair.
        - label: Simulations show 6 versus 4.
          feedback: Simulationen zeigen 6 gegen 4.
    hints:
      - You already have an H. What happens on the next T?
      - "With HT: after H you just wait for T – another H does no harm."
    explanation: With HT, an H after an H is still a good start. With HH a T resets everything. Patterns that overlap themselves wait differently – important for searching DNA and text.
    difficulty: 3

srs:
  cards_from: [wartezeit, gedaechtnis]
