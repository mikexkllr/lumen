id: stats.expected.games
type: concept
title: Lotto, roulette and fair games
summary: Why the house always wins.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percent of lottery stakes is paid out again as winnings?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 50
      tolerance: 8
    explanation: Only about 50%. Of every euro staked half comes back on average.

  - kind: problem
    id: lotto
    widget: numeric
    prompt: In a 6-from-49 lotto there are almost 14 million possible tickets. One ticket costs 1.20 €. What does it cost to play them all? In millions of euros.
    params: { unit: million € }
    answer: { value: 16.8, tolerance: 0.6 }
    hints:
      - Calculate 14 · 1.2.
    explanation: About 14 million · 1.20 € ≈ 16.8 million €.

  - kind: explain
    id: s2
    body: |
      A game is **fair** if the expected gain is zero.
      Casinos and lotteries are never fair. On average, they keep part of all stakes.

  - kind: problem
    id: roulette
    widget: choice
    prompt: Roulette has 18 red, 18 black and one green number. You bet 10 € on red. What do you expect on average?
    params:
      options:
        - { label: "About −0.27 €", correct: true }
        - { label: Exactly 0 €, feedback: "The green zero tips the balance in the casino's favor." }
        - { label: About +5 €, feedback: "Red does not win half the time – it wins 18 times out of 37." }
        - { label: About −5 €, feedback: "It is not that bad. You win almost half the time." }
    hints:
      - You win in 18 of 37 cases and lose in 19 of 37.
    explanation: 18/37 · 10 € − 19/37 · 10 € = −10/37 € ≈ −0.27 €.

  - kind: problem
    id: kasse
    widget: numeric
    prompt: What percent of stakes does the casino keep on average in roulette? That is 1/37 – rounded to one decimal place.
    params: { unit: "%" }
    answer: { value: 2.7, tolerance: 0.05 }
    hints:
      - Calculate 100 / 37.
    explanation: 1/37 ≈ 2.7%.

  - kind: explain
    id: s5
    body: Why do so many people play lotto anyway?
    reveal:
      body: The small stake feels harmless, and the jackpot feels huge. Our gut turns "1 in 14 million" into "maybe".

  - kind: problem
    id: sicher-oder-wurf
    widget: choice
    prompt: Which has the higher expected value – a sure 50 €, or a coin flip for 120 € or nothing?
    params:
      options:
        - { label: The coin flip, correct: true }
        - { label: The sure 50 €, feedback: "Sure feels better. But the flip's expected value is 60 €." }
        - { label: Both the same, feedback: "Calculate 1/2 · 120 €." }
    hints:
      - How much does the flip pay on average?
    explanation: 1/2 · 120 € = 60 € – more than 50 €. Many people still choose the sure thing. That is risk aversion, not a math error.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: At roulette you bet €1 on a single number (37 pockets). On a hit you get €36 back. What is the expected loss in cents, rounded?
    params:
      unit: ct
    answer:
      value: 2.7
      tolerance: 0.1
    hints:
      - "Expected payback: €36/37."
    explanation: 1 − 36/37 ≈ 2.7 cents. Whatever you bet on – the house edge stays the same.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: you play one »6 from 49« ticket every week. How many years does it take on average to hit all six? (1 in 13,983,816)"
    params:
      min: 10
      max: 10000000
      scale: log
      unit: years
    answer:
      value: 268919
      within: 30
    explanation: 13,983,816 ÷ 52 ≈ 269,000 years. That is longer than modern humans have existed.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A game pays exactly 20 € with probability 1/5, otherwise nothing. From which stake do you lose in the long run?
    params:
      options:
        - label: At more than 4 €
          correct: true
        - label: You only get 20 € one time in five.
          feedback: 20 € gibt es nur jedes fünfte Mal.
        - label: Work out the average payout.
          feedback: Rechne die durchschnittliche Auszahlung aus.
    hints:
      - What does the game pay per round on average?
      - 20 € · 1/5.
    explanation: The average payout is 4 €. If a round costs exactly that, it is fair. Every cent more is a loss in the long run.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The martingale strategy: double the stake after every loss. Eventually you win, after all. Where is the catch?"
    params:
      options:
        - label: A long losing streak demands huge stakes – money and table limits are finite
          correct: true
        - label: There is none – that is how you beat the bank
          feedback: The expected value stays negative.
        - label: You win too rarely
          feedback: You actually win often – but small amounts.
    hints:
      - After 10 losses the stake is 1024-fold.
    explanation: Many small wins, rarely a total loss. No staking strategy turns a negative expected value into a positive one.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: You have 2 € and play fair coin flips for 1 € each. You stop at 0 € or at 10 €. How likely do you reach 10 €? In percent.
    answer:
      value: 20
    hints:
      - "In a fair game the expected value of your money stays the same: 2 €."
      - At the end you have 10 € with probability p, otherwise 0 €. So 10 · p = 2.
    explanation: "p = 2/10 = 20 %. This is gambler's ruin: against a bank with almost unlimited money you almost surely lose everything – even in fair games."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: In the lottery every combination has the same chance. Yet it pays to avoid tickets like 1-2-3-4-5-6. Why?
    params:
      options:
        - label: Many people play them – a win would be shared with many
          correct: true
        - label: The balls know no patterns.
          feedback: Die Kugeln kennen keine Muster.
        - label: Every combination is allowed.
          feedback: Jede Reihe ist erlaubt.
    hints:
      - The chance is the same – what about the size of the prize?
      - The prize pool is split among all winners.
    explanation: "The probability is the same, but the expected value is not: popular combinations share the pot with more people."
    difficulty: 3

srs:
  cards_from: [roulette, sicher-oder-wurf]
