id: stats.expected.games
type: concept
title: Lotto, Roulette und faire Spiele
summary: Warum die Bank immer gewinnt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der Lotto-Einsätze werden als Gewinne wieder ausgeschüttet?"
    params:
      min: 0
      max: 100
      unit: "%"
    answer:
      value: 50
      tolerance: 8
    explanation: Nur etwa 50 %. Von jedem Euro Einsatz kommt im Schnitt die Hälfte zurück.


  - kind: problem
    id: lotto
    widget: numeric
    prompt: Beim Lotto 6 aus 49 gibt es fast 14 Millionen Tipps. Ein Tipp kostet 1,20 €. Was kostet es, alle zu spielen? In Millionen Euro.
    params: { unit: Mio. € }
    answer: { value: 16.8, tolerance: 0.6 }
    hints:
      - Rechne 14 · 1,2.
    explanation: Etwa 14 Millionen · 1,20 € ≈ 16,8 Millionen €.

  - kind: explain
    id: s2
    body: |
      Ein Spiel ist **fair**, wenn der erwartete Gewinn null ist.
      Casinos und Lotterien sind nie fair. Sie behalten im Schnitt einen Teil aller Einsätze.

  - kind: problem
    id: roulette
    widget: choice
    prompt: Roulette hat 18 rote, 18 schwarze und eine grüne Zahl. Du setzt 10 € auf Rot. Was erwartest du im Schnitt?
    params:
      options:
        - { label: "Etwa −0,27 €", correct: true }
        - { label: Genau 0 €, feedback: "Die grüne Null kippt die Bilanz zugunsten des Casinos." }
        - { label: Etwa +5 €, feedback: "Rot gewinnt nicht in der Hälfte der Fälle – sondern in 18 von 37." }
        - { label: Etwa −5 €, feedback: "So schlimm ist es nicht. Du gewinnst fast in der Hälfte der Fälle." }
    hints:
      - Gewinn bei 18 von 37, Verlust bei 19 von 37.
    explanation: 18/37 · 10 € − 19/37 · 10 € = −10/37 € ≈ −0,27 €.

  - kind: problem
    id: kasse
    widget: numeric
    prompt: Wie viel Prozent der Einsätze behält das Casino beim Roulette im Schnitt? Das ist 1/37 – gerundet auf eine Stelle.
    params: { unit: "%" }
    answer: { value: 2.7, tolerance: 0.05 }
    hints:
      - Rechne 100 / 37.
    explanation: 1/37 ≈ 2,7 %.

  - kind: explain
    id: s5
    body: Warum spielen trotzdem so viele Menschen Lotto?
    reveal:
      body: Der kleine Einsatz fühlt sich harmlos an, der Jackpot riesig. Unser Gefühl macht aus »1 zu 14 Millionen« ein »vielleicht«.

  - kind: problem
    id: sicher-oder-wurf
    widget: choice
    prompt: Was hat den höheren Erwartungswert – sicher 50 € oder ein Münzwurf um 120 € oder nichts?
    params:
      options:
        - { label: Der Münzwurf, correct: true }
        - { label: Die sicheren 50 €, feedback: "Sicher fühlt sich besser an. Der Erwartungswert des Wurfs ist aber 60 €." }
        - { label: Beide gleich, feedback: "Rechne 1/2 · 120 €." }
    hints:
      - Wie viel bringt der Wurf im Schnitt?
    explanation: 1/2 · 120 € = 60 € – mehr als 50 €. Viele wählen trotzdem das Sichere. Das ist Risikoscheu, kein Rechenfehler.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Beim Roulette setzt du 1 € auf eine einzelne Zahl (37 Felder). Bei Treffer bekommst du 36 € zurück. Wie hoch ist der erwartete Verlust in Cent, gerundet?
    params:
      unit: ct
    answer:
      value: 2.7
      tolerance: 0.1
    hints:
      - "Erwartete Rückzahlung: 36/37 €."
    explanation: 1 − 36/37 ≈ 2,7 Cent. Egal worauf man setzt – der Hausvorteil bleibt gleich.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Die Martingale-Strategie: Nach jedem Verlust den Einsatz verdoppeln. Irgendwann gewinnt man ja. Wo ist der Haken?"
    params:
      options:
        - label: Eine lange Pechsträhne verlangt riesige Einsätze – Geld und Tischlimit sind endlich
          correct: true
        - label: Es gibt keinen – so schlägt man die Bank
          feedback: Der Erwartungswert bleibt negativ.
        - label: Man gewinnt zu selten
          feedback: Man gewinnt sogar oft – aber kleine Beträge.
    hints:
      - Nach 10 Verlusten liegt der Einsatz beim 1024-Fachen.
    explanation: Viele kleine Gewinne, selten ein Totalverlust. Keine Einsatzstrategie macht aus einem negativen Erwartungswert einen positiven.
    difficulty: 3

srs:
  cards_from: [roulette, sicher-oder-wurf]
