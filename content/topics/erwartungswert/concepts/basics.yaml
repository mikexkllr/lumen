id: stats.expected.basics
type: concept
title: Was bringt es im Schnitt?
summary: Ergebnis mal Wahrscheinlichkeit, dann addieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Was bringt ein Dreh?
    body: "Lotto, Glücksrad, Versicherung – überall geht es um die Frage: Was bringt das auf Dauer? Dreh das Rad 10-mal, dann 100-mal. Wie viel Geld bringt dir ein Dreh im **Schnitt**?"
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: 4 €
            weight: 1
          - label: 1 €
            weight: 1
          - label: 0 €
            weight: 2
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: wuerfelspiel
    widget: choice
    prompt: Du würfelst. Bei einer 6 gewinnst du 5 €, sonst verlierst du 1 €. Was passiert auf Dauer?
    params:
      options:
        - { label: Es geht ungefähr plus minus null auf., correct: true }
        - { label: Ich gewinne im Schnitt., feedback: "Fünfmal 1 € verlieren gleicht einmal 5 € gewinnen genau aus." }
        - { label: Ich verliere im Schnitt., feedback: "Rechne sechs Würfe durch – ein Gewinn, fünf Verluste." }
    hints:
      - Spiel in Gedanken sechs Runden.
    explanation: In 6 Runden etwa +5 € und 5 · (−1 €). Zusammen 0 €.

  - kind: explain
    id: s2
    body: |
      Der **Erwartungswert** ist der Durchschnitt auf lange Sicht.
      Jedes Ergebnis mal seine Wahrscheinlichkeit – dann alles addieren.

  - kind: problem
    id: augenzahl
    widget: numeric
    prompt: Welche Augenzahl erwartest du im Schnitt bei einem fairen Würfel?
    params: { placeholder: "Zahl" }
    answer: { value: 3.5 }
    feedback:
      - when: "numval(state.input) == 3"
        misconception: integer-only
        text: Der Durchschnitt muss keine ganze Zahl sein.
    hints:
      - Addiere 1 bis 6 und teile durch 6.
    explanation: (1 + 2 + 3 + 4 + 5 + 6) / 6 = 21 / 6 = 3,5.

  - kind: explain
    id: s4
    body: Kann man eine 3,5 würfeln?
    reveal:
      body: Nein. Der Erwartungswert muss kein mögliches Ergebnis sein. Er beschreibt den Schnitt vieler Würfe.

  - kind: problem
    id: los
    widget: numeric
    prompt: Ein Los kostet 2 €. Jedes zehnte Los gewinnt {{g}} €. Was ist dein Gewinn pro Los im Schnitt? Minus heißt Verlust.
    params: { unit: "€" }
    answer: { value: "{{g / 10 - 2}}" }
    feedback:
      - when: "numval(state.input) == g / 10"
        misconception: ignore-stake
        text: Zieh noch den Einsatz von 2 € ab.
    hints:
      - "Im Schnitt bringt ein Los {{g}} € / 10 = {{g / 10}} €."
    explanation: "{{g / 10}} € − 2 € = {{g / 10 - 2}} € pro Los."
    variants:
      params: { g: "choice[10,15,25,30]" }
      defaults: { g: 15 }

  - kind: problem
    id: gluecksrad
    widget: numeric
    prompt: Ein Glücksrad zahlt mit Chance 1/4 genau 8 €, sonst nichts. Wie viel darf ein Dreh höchstens kosten, damit das Spiel fair ist?
    params: { unit: "€" }
    answer: { value: 2 }
    hints:
      - Ein fairer Preis entspricht dem Erwartungswert.
    explanation: 1/4 · 8 € = 2 €. Mehr Einsatz wäre unfair für dich.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Der Erwartungswert eines Würfels ist 3,5.
          right: true
        - text: Der Erwartungswert ist das wahrscheinlichste Ergebnis.
          right: false
          why: Er ist der Durchschnitt auf lange Sicht – oft ein Wert, der nie vorkommt.
        - text: Ein faires Spiel hat den erwarteten Gewinn null.
          right: true

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: Ein Glücksrad zahlt mit Chance 1/2 nichts, mit 1/4 genau 2 € und mit 1/4 genau 6 €. Markiere den Erwartungswert in Euro.
    params:
      min: 0
      max: 6
      ticks: 2
      labels: decimals
    answer:
      value: 2
    hints:
      - Rechne jedes Ergebnis mal seine Chance.
      - 1/4 · 2 + 1/4 · 6 = 0,5 + 1,5.
    explanation: 0 + 0,5 + 1,5 = 2 €. Kein einzelner Dreh zahlt 2 € – aber im Schnitt kommt genau das heraus.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Spiel: Mit 50 % gewinnst du 10 €, mit 30 % verlierst du 5 €, mit 20 % verlierst du 20 €. Wie hoch ist der Erwartungswert in Euro?"
    params:
      unit: €
    answer:
      value: -0.5
    hints:
      - 0,5 · 10 − 0,3 · 5 − 0,2 · 20.
    explanation: 5 − 1,5 − 4 = −0,5 €. Obwohl du in der Hälfte der Fälle gewinnst, verlierst du auf Dauer.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Ein Spiel kostet 1 €. Bei einer 6 bekommst du {{g}} €, sonst nichts. Wie hoch ist dein Gewinn pro Spiel im Schnitt? Minus heißt Verlust.
    params:
      unit: €
    answer:
      value: "{{g / 6 - 1}}"
    feedback:
      - when: numval(state.input) == g / 6
        misconception: forgot-stake
        text: Den Einsatz von 1 € musst du noch abziehen.
    hints:
      - Im Schnitt zahlt das Spiel {{g}} · 1/6 aus.
      - "Zieh den Einsatz ab: {{g / 6}} − 1."
    explanation: "{{g}}/6 − 1 = {{g / 6 - 1}} €. Bei einer Auszahlung von 6 € wäre das Spiel genau fair."
    difficulty: 2
    variants:
      params:
        g: choice[3,6,9,12,18]
      defaults:
        g: 3

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Du wirfst drei Würfel und addierst. Welche Augensumme erwartest du im Schnitt?
    answer:
      value: 10.5
    hints:
      - Ein Würfel bringt im Schnitt 3,5.
      - Erwartungswerte darf man einfach addieren.
    explanation: "3 · 3,5 = 10,5. Die **Linearität**: E(X + Y) = E(X) + E(Y) – sogar, wenn X und Y voneinander abhängen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Das St.-Petersburg-Spiel: Eine Münze wird geworfen, bis Kopf kommt. Beim n-ten Wurf gewinnst du 2ⁿ €. Wie hoch ist der Erwartungswert?"
    params:
      options:
        - label: Unendlich – jeder Summand trägt 1 € bei
          correct: true
        - label: 2 €
          feedback: Das ist nur der erste Summand.
        - label: "Null"
          feedback: Man kann hier nichts verlieren.
    hints:
      - ½ · 2 + ¼ · 4 + ⅛ · 8 + …
    explanation: "Trotzdem würde kaum jemand 100 € Einsatz zahlen. Das Paradox zeigt: Der Nutzen von Geld wächst nicht linear."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Die Varianz eines Würfels ist E(X²) − E(X)². Es gilt E(X²) = 91/6 und E(X) = 3,5. Wie groß ist die Varianz? Als Bruch.
    answer:
      value: 35/12
      tolerance: 0.01
    hints:
      - 3,5² = 49/4.
      - "Bring beides auf den Nenner 12: 182/12 − 147/12."
    explanation: 91/6 − 49/4 = 35/12 ≈ 2,92. Die Standardabweichung ist √(35/12) ≈ 1,71 Augen.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Zehn Briefe werden zufällig in zehn adressierte Umschläge gesteckt. Wie viele landen im Schnitt im richtigen Umschlag?
    answer:
      value: 1
    hints:
      - Jeder einzelne Brief trifft mit Chance 1/10.
      - Addiere die Erwartung für alle zehn Briefe.
    explanation: "10 · 1/10 = 1 – und das für jede Zahl von Briefen! Der Trick: Zähle jeden Brief einzeln mit 0 oder 1 und nutze die Linearität."
    difficulty: 3

srs:
  cards_from: [augenzahl, los]
