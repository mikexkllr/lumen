id: stats.expected.decisions
type: concept
title: Warranties and insurance
summary: When protection is worth it.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: schaden
    widget: numeric
    prompt: A phone costs {{p}} €. It breaks with a {{q}}% probability per year. What is the expected damage per year?
    params: { unit: "€" }
    answer: { value: "{{p * q / 100}}" }
    hints:
      - "{{q}}% of {{p}} €."
    explanation: "{{q}}% · {{p}} € = {{p * q / 100}} € per year."
    variants:
      params: { p: "choice[600,800,1000,1200]", q: "choice[5,10]" }
      defaults: { p: 800, q: 5 }

  - kind: explain
    id: s2
    body: |
      On average, insurance costs **more** than the expected damage – otherwise nobody would profit from it.
      It pays off for losses you could not bear alone.

  - kind: problem
    id: garantie
    widget: numeric
    prompt: A warranty costs 30 €. The 150 € device breaks with a 10% probability. How much do you lose on average by buying the warranty?
    params: { unit: "€" }
    answer: { value: 15 }
    feedback:
      - when: "numval(state.input) == 30"
        misconception: ignore-benefit
        text: The warranty pays out too. Subtract the expected damage.
    hints:
      - The expected damage is 10% of 150 €.
    explanation: You pay 30 €, and the damage is 15 € on average. You lose 15 € on average.

  - kind: problem
    id: absichern
    widget: buckets
    prompt: What speaks more for insuring, and what for bearing the cost yourself?
    params:
      buckets: [{ label: insure }, { label: bear yourself }]
      items:
        - { label: Liability for million-euro damages, bucket: insure }
        - { label: Fire in your own house, bucket: insure }
        - { label: High medical costs, bucket: insure }
        - { label: Glasses for 200 €, bucket: bear yourself }
        - { label: Warranty for a toaster, bucket: bear yourself }
        - { label: Scratch on a phone screen, bucket: bear yourself }
    hints:
      - Would the loss ruin you financially?
    explanation: Small losses are better borne yourself. Large, rare risks are worth insuring.

  - kind: explain
    id: s5
    body: When is the expected value a poor guide?
    reveal:
      body: When a rare outcome is ruinous. If you bet everything on one card, you can lose it all despite a positive expected value.

  - kind: problem
    id: ablehnen
    widget: choice
    prompt: Which bet has a negative expected value?
    params:
      options:
        - { label: "Coin flip – plus 10 € or minus 12 €", correct: true }
        - { label: "Coin flip – plus 10 € or minus 8 €", feedback: "Here you win 1 € on average." }
        - { label: "Die – plus 7 € on a 6, otherwise minus 1 €", feedback: "7/6 − 5/6 = +1/3 € – a small edge for you." }
    hints:
      - Work out the average for each bet.
    explanation: 1/2 · 10 € − 1/2 · 12 € = −1 €.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Liability insurance costs €60 a year. It covers a €1 million loss that occurs with 0.002% per year. What is the expected loss in euros?
    params:
      unit: €
    answer:
      value: 20
    hints:
      - 1,000,000 · 0.00002.
    explanation: "€20 – you pay €40 “too much”. Still it makes sense: the loss would be ruinous."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A coin toss: 50% for +50% of your wealth, 50% for −40%. The expected value per round is +5%. Should you bet everything again and again?"
    params:
      options:
        - label: "No – in the long run your wealth shrinks: 1.5 · 0.6 = 0.9"
          correct: true
        - label: Yes – the expected value is positive
          feedback: The average over many players rises, but almost every individual loses.
        - label: It does not matter
          feedback: After one win and one loss only 90% remain.
    hints:
      - What remains after one win and one loss?
    explanation: In repeated bets the **geometric** mean counts. The Kelly criterion tells which fraction would be optimal.
    difficulty: 3

srs:
  cards_from: [schaden, garantie]
