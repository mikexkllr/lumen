id: stats.expected.decisions
type: concept
title: Garantien und Versicherungen
summary: Wann sich Absichern lohnt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: schaden
    widget: numeric
    prompt: Ein Handy kostet {{p}} €. Es geht mit {{q}} % Wahrscheinlichkeit pro Jahr kaputt. Wie hoch ist der erwartete Schaden pro Jahr?
    params: { unit: "€" }
    answer: { value: "{{p * q / 100}}" }
    hints:
      - "{{q}} % von {{p}} €."
    explanation: "{{q}} % · {{p}} € = {{p * q / 100}} € pro Jahr."
    variants:
      params: { p: "choice[600,800,1000,1200]", q: "choice[5,10]" }
      defaults: { p: 800, q: 5 }

  - kind: explain
    id: s2
    body: |
      **Versicherungen** kosten im Schnitt **mehr** als der erwartete Schaden – sonst verdient niemand daran.
      Sie lohnen sich bei Schäden, die man allein nicht tragen könnte.

  - kind: problem
    id: garantie
    widget: numeric
    prompt: Eine Garantie kostet 30 €. Das Gerät für 150 € geht mit 10 % Wahrscheinlichkeit kaputt. Wie viel verlierst du durch die Garantie im Schnitt?
    params: { unit: "€" }
    answer: { value: 15 }
    feedback:
      - when: "numval(state.input) == 30"
        misconception: ignore-benefit
        text: Die Garantie zahlt ja auch etwas. Zieh den erwarteten Schaden ab.
    hints:
      - Der erwartete Schaden ist 10 % von 150 €.
    explanation: Du zahlst 30 €, der Schaden ist im Schnitt 15 €. Du verlierst im Schnitt 15 €.

  - kind: problem
    id: absichern
    widget: buckets
    prompt: Was spricht eher fürs Versichern, was fürs Selbst-Tragen?
    params:
      buckets: [{ label: versichern }, { label: selbst tragen }]
      items:
        - { label: Haftung bei Millionenschäden, bucket: versichern }
        - { label: Feuer im eigenen Haus, bucket: versichern }
        - { label: Hohe Arztkosten, bucket: versichern }
        - { label: Brille für 200 €, bucket: selbst tragen }
        - { label: Garantie für einen Toaster, bucket: selbst tragen }
        - { label: Kratzer im Handy-Display, bucket: selbst tragen }
    hints:
      - Würde der Schaden dich finanziell ruinieren?
    explanation: Kleine Schäden trägt man besser selbst. Große, seltene Risiken sichert man ab.

  - kind: explain
    id: s5
    body: Wann ist der Erwartungswert ein schlechter Ratgeber?
    reveal:
      body: Wenn ein seltenes Ergebnis ruinös ist. Wer alles auf eine Karte setzt, kann trotz positivem Erwartungswert alles verlieren.

  - kind: problem
    id: ablehnen
    widget: choice
    prompt: Welche Wette hat einen negativen Erwartungswert?
    params:
      options:
        - { label: "Münzwurf – plus 10 € oder minus 12 €", correct: true }
        - { label: "Münzwurf – plus 10 € oder minus 8 €", feedback: "Hier gewinnst du im Schnitt 1 €." }
        - { label: "Würfel – bei 6 plus 7 €, sonst minus 1 €", feedback: "7/6 − 5/6 = +1/3 € – ein kleiner Vorteil für dich." }
    hints:
      - Rechne für jede Wette den Schnitt aus.
    explanation: 1/2 · 10 € − 1/2 · 12 € = −1 €.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Haftpflichtversicherung kostet 60 € im Jahr. Sie deckt einen Schaden von 1 Million €, der mit 0,002 % pro Jahr eintritt. Wie hoch ist der erwartete Schaden in Euro?
    params:
      unit: €
    answer:
      value: 20
    hints:
      - 1 000 000 · 0,00002.
    explanation: "20 € – du zahlst 40 € »zu viel«. Trotzdem ist sie sinnvoll: Der Schaden wäre ruinös."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Eine Versicherung kostet {{p}} € im Jahr. Sie deckt einen Schaden von 2000 €, der mit {{q}} % pro Jahr eintritt. Wie viel zahlst du im Schnitt pro Jahr drauf?
    params:
      unit: €
    answer:
      value: "{{p - 20 * q}}"
    hints:
      - Der erwartete Schaden ist 2000 € · {{q}} %.
      - "Zieh ihn von der Prämie ab: {{p}} − {{20 * q}}."
    explanation: "Erwarteter Schaden {{20 * q}} €, Prämie {{p}} €: im Schnitt {{p - 20 * q}} € Aufschlag. Das ist der Preis dafür, nie 2000 € auf einmal zahlen zu müssen."
    difficulty: 2
    variants:
      params:
        p: step[60,150,10]
        q: int[1,4]
      constraints:
        - p > 20 * q
      defaults:
        p: 100
        q: 3

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Für jemanden mit 100 € sind 100 € mehr ein großes Glück. Für eine Millionärin kaum. Was beschreibt das?
    params:
      options:
        - label: Abnehmender Grenznutzen – jeder weitere Euro bringt weniger Freude
          correct: true
        - label: Gier
          feedback: Es geht nicht um Charakter, sondern um den Nutzen pro Euro.
        - label: Den Erwartungswert
          feedback: Der Erwartungswert zählt jeden Euro gleich.
    hints:
      - Wie viel ist der hundertste Euro wert, wie viel der millionste?
      - Bernoulli schlug 1738 vor, mit dem Logarithmus des Geldes zu rechnen.
    explanation: Weil der **Nutzen** langsamer wächst als das Geld, ist ein sicherer Betrag mehr wert als eine Wette mit gleichem Erwartungswert. Daraus erklärt sich, warum man sich versichert.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Münzwurf: 50 % auf +50 % deines Vermögens, 50 % auf −40 %. Der Erwartungswert pro Runde ist +5 %. Solltest du immer wieder alles setzen?"
    params:
      options:
        - label: "Nein – auf Dauer schrumpft dein Vermögen: 1,5 · 0,6 = 0,9"
          correct: true
        - label: Ja – der Erwartungswert ist positiv
          feedback: Der Durchschnitt über viele Spieler steigt, aber fast jeder Einzelne verliert.
        - label: Es ist egal
          feedback: Nach je einem Gewinn und Verlust bleiben nur 90 %.
    hints:
      - Was bleibt nach einem Gewinn und einem Verlust?
    explanation: Bei wiederholten Wetten zählt das **geometrische** Mittel. Das Kelly-Kriterium sagt, welcher Anteil optimal wäre.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Eine Wette gewinnt mit 60 % und zahlt den Einsatz doppelt zurück, sonst ist er weg. Die **Kelly-Formel** sagt: Setze den Anteil p − q deines Vermögens. Wie viel Prozent sind das?"
    answer:
      value: 20
    hints:
      - p = 0,6, q = 1 − p = 0,4.
      - Rechne 0,6 − 0,4.
    explanation: 20 %. Kelly maximiert das langfristige Wachstum. Wer alles setzt, geht trotz Vorteil irgendwann pleite.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: "Münzwurf: +50 % oder −40 % deines Vermögens. Nach einem Gewinn und einem Verlust hast du das 1,5 · 0,6 = 0,9-Fache. Wie viel Prozent verlierst du im Schnitt **pro Runde**? (√0,9 ≈ 0,949)"
    answer:
      value: 5.1
      tolerance: 0.2
    feedback:
      - when: numval(state.input) == 10
        misconception: two-rounds
        text: Das ist der Verlust für zwei Runden. Pro Runde ist es die Wurzel davon.
    hints:
      - Pro Runde wächst das Vermögen um den Faktor √0,9.
      - 1 − 0,949 = ?
    explanation: Etwa −5,1 % pro Runde – obwohl der Erwartungswert +5 % ist. Für dein Vermögen zählt das geometrische Mittel, nicht das arithmetische.
    difficulty: 3

srs:
  cards_from: [schaden, garantie]
