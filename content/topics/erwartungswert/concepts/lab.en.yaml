id: stats.expected.lab
type: concept
title: Prize wheel lab
summary: Build fair games.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wuerfel
    widget: numberline
    prompt: Mark the average number on a fair die.
    params: { min: 1, max: 6, ticks: 2, labels: decimals }
    answer: { value: 3.5 }
    hints:
      - "(1 + 2 + 3 + 4 + 5 + 6) ÷ 6."
    explanation: "21 ÷ 6 = 3.5 – a value no single roll shows."

  - kind: problem
    id: drehen
    widget: distribution
    body: A prize wheel has 10 slots – 1 jackpot, 3 small prizes, 6 blanks.
    prompt: Spin the wheel at least 100 times.
    params:
      items: [{ label: Jackpot, weight: 1 }, { label: Small prize, weight: 3 }, { label: Blank, weight: 6 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Many rounds at once.
    explanation: About one in ten rounds hits the jackpot.

  - kind: problem
    id: fair
    widget: chart
    body: A spin costs 2 €. A small prize pays 1 €, a blank pays nothing.
    prompt: Set the jackpot payout so that the game is exactly fair.
    params:
      labels: [Jackpot]
      values: [5]
      editable: [0]
      min: 0
      max: 30
      unit: "€"
    answer: { values: [17] }
    hints:
      - On average, 2 € must come out – 1/10 · x + 3/10 · 1 = 2.
    explanation: x = 17 € – then the wheel pays back exactly the stake on average.

  - kind: problem
    id: da-d1
    depth: 2
    widget: distribution
    prompt: A wheel pays 0 € (half the wheel), 2 € (a quarter) or 6 € (a quarter). Spin it at least 100 times.
    params:
      items:
        - label: 0 €
          weight: 2
        - label: 2 €
          weight: 1
        - label: 6 €
          weight: 1
    check:
      predicate: draws >= 100
    hints:
      - Use the button for 100 spins.
      - Roughly note how often each payout came up.
    explanation: Half the spins pay nothing. Still the wheel pays on average – see the next task.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: How much does this wheel pay per spin on average?
    params:
      unit: €
    answer:
      value: 2
    hints:
      - Compute 0 · ½ + 2 · ¼ + 6 · ¼.
      - 0.5 + 1.5.
    explanation: 0 + 0.5 + 1.5 = 2 €. If a spin costs 2 €, the game is fair.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why is insurance worthwhile although it costs more on average than the loss?"
    params:
      keywords:
        - - erwartungswert
          - schnitt
          - durchschnitt
          - expected
          - average
        - - ruin
          - groß
          - tragen
          - existenz
          - huge
          - large
          - afford
          - catastroph
        - - sicher
          - risiko
          - schwank
          - certain
          - risk
          - security
          - protect
          - schutz
      sample: On average you lose a little money with insurance. But it protects against a rare, huge loss you could not bear alone – you swap a small certain loss for a ruinous risk.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: What is the standard deviation of this wheel? To two decimals. (E(X²) = 0 · ½ + 4 · ¼ + 36 · ¼)
    answer:
      value: 2.45
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 6) < 0.01
        misconception: variance-not-sd
        text: That is the variance. Now take the root.
    hints:
      - E(X²) = 1 + 9 = 10. Variance = 10 − 2².
      - Take the square root of 6.
    explanation: Variance 10 − 4 = 6, so σ = √6 ≈ 2.45 €. A wheel paying a fixed 2 € has the same mean but σ = 0.
    difficulty: 3

srs:
  cards_from: [wuerfel, fair]
