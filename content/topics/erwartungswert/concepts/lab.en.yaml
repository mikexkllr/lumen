id: stats.expected.lab
type: concept
title: Prize wheel lab
summary: Build fair games.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wuerfel
    widget: numberline
    prompt: Mark the average number on a fair die.
    params: { min: 1, max: 6, ticks: 2, labels: decimals }
    answer: { value: 3.5 }
    hints:
      - "(1 + 2 + 3 + 4 + 5 + 6) ÷ 6."
    explanation: "21 ÷ 6 = 3.5 – a value no single roll shows."

  - kind: problem
    id: drehen
    widget: distribution
    body: A prize wheel has 10 slots – 1 jackpot, 3 small prizes, 6 blanks.
    prompt: Spin the wheel at least 100 times.
    params:
      items: [{ label: Jackpot, weight: 1 }, { label: Small prize, weight: 3 }, { label: Blank, weight: 6 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Many rounds at once.
    explanation: About one in ten rounds hits the jackpot.

  - kind: problem
    id: fair
    widget: chart
    body: A spin costs 2 €. A small prize pays 1 €, a blank pays nothing.
    prompt: Set the jackpot payout so that the game is exactly fair.
    params:
      labels: [Jackpot]
      values: [5]
      editable: [0]
      min: 0
      max: 30
      unit: "€"
    answer: { values: [17] }
    hints:
      - On average, 2 € must come out – 1/10 · x + 3/10 · 1 = 2.
    explanation: x = 17 € – then the wheel pays back exactly the stake on average.

srs:
  cards_from: [wuerfel, fair]
