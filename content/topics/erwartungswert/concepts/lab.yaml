id: stats.expected.lab
type: concept
title: Glücksrad-Labor
summary: Faire Spiele bauen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wuerfel
    widget: numberline
    prompt: Markiere die durchschnittliche Augenzahl eines fairen Würfels.
    params: { min: 1, max: 6, ticks: 2, labels: decimals }
    answer: { value: 3.5 }
    hints:
      - "(1 + 2 + 3 + 4 + 5 + 6) : 6."
    explanation: "21 : 6 = 3,5 – ein Wert, den kein einzelner Wurf zeigt."

  - kind: problem
    id: drehen
    widget: distribution
    body: Ein Glücksrad hat 10 Felder – 1 Jackpot, 3 kleine Gewinne, 6 Nieten.
    prompt: Dreh das Rad mindestens 100-mal.
    params:
      items: [{ label: Jackpot, weight: 1 }, { label: Kleingewinn, weight: 3 }, { label: Niete, weight: 6 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Viele Runden auf einmal.
    explanation: Etwa jede zehnte Runde bringt den Jackpot.

  - kind: problem
    id: fair
    widget: chart
    body: Ein Dreh kostet 2 €. Ein Kleingewinn zahlt 1 € aus, eine Niete nichts.
    prompt: Stell die Auszahlung für den Jackpot so ein, dass das Spiel genau fair ist.
    params:
      labels: [Jackpot]
      values: [5]
      editable: [0]
      min: 0
      max: 30
      unit: "€"
    answer: { values: [17] }
    hints:
      - Im Schnitt muss 2 € herauskommen – 1/10 · x + 3/10 · 1 = 2.
    explanation: x = 17 € – dann zahlt das Rad im Schnitt genau den Einsatz zurück.

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum lohnt sich eine Versicherung, obwohl sie im Schnitt mehr kostet als der Schaden?"
    params:
      keywords:
        - - erwartungswert
          - schnitt
          - durchschnitt
          - expected
          - average
        - - ruin
          - groß
          - tragen
          - existenz
          - huge
          - large
          - afford
          - catastroph
        - - sicher
          - risiko
          - schwank
          - certain
          - risk
          - security
          - protect
          - schutz
      sample: Im Durchschnitt verliert man mit der Versicherung etwas Geld. Aber sie schützt vor einem seltenen, riesigen Schaden, den man allein nicht tragen könnte – man tauscht einen kleinen sicheren Verlust gegen ein ruinöses Risiko.
    difficulty: 3

srs:
  cards_from: [wuerfel, fair]
