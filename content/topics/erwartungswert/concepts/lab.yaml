id: stats.expected.lab
type: concept
title: Glücksrad-Labor
summary: Faire Spiele bauen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Dein eigenes Würfelspiel
    body: "Bau dein eigenes Würfelspiel! Jede Säule ist die Auszahlung für eine Augenzahl – zieh sie, wie du willst. Die Linie zeigt den **Erwartungswert**: So viel zahlt ein Wurf im Schnitt aus. Wäre ein Einsatz von 2 € fair?"
    visual:
      widget: chart
      interactive: true
      params:
        labels:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        values:
          - 0
          - 0
          - 0
          - 0
          - 0
          - 6
        editable:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
        min: 0
        max: 10
        unit: €
        show:
          - mean
        title: Auszahlung

  - kind: problem
    id: wuerfel
    widget: numberline
    prompt: Markiere die durchschnittliche Augenzahl eines fairen Würfels.
    params: { min: 1, max: 6, ticks: 2, labels: decimals }
    answer: { value: 3.5 }
    hints:
      - "(1 + 2 + 3 + 4 + 5 + 6) : 6."
    explanation: "21 : 6 = 3,5 – ein Wert, den kein einzelner Wurf zeigt."

  - kind: problem
    id: drehen
    widget: distribution
    body: Ein Glücksrad hat 10 Felder – 1 Jackpot, 3 kleine Gewinne, 6 Nieten.
    prompt: Dreh das Rad mindestens 100-mal.
    params:
      items: [{ label: Jackpot, weight: 1 }, { label: Kleingewinn, weight: 3 }, { label: Niete, weight: 6 }]
    check: { predicate: "draws >= 100" }
    hints:
      - Viele Runden auf einmal.
    explanation: Etwa jede zehnte Runde bringt den Jackpot.

  - kind: problem
    id: fair
    widget: chart
    body: Ein Dreh kostet 2 €. Ein Kleingewinn zahlt 1 € aus, eine Niete nichts.
    prompt: Stell die Auszahlung für den Jackpot so ein, dass das Spiel genau fair ist.
    params:
      labels: [Jackpot]
      values: [5]
      editable: [0]
      min: 0
      max: 30
      unit: "€"
    answer: { values: [17] }
    hints:
      - Im Schnitt muss 2 € herauskommen – 1/10 · x + 3/10 · 1 = 2.
    explanation: x = 17 € – dann zahlt das Rad im Schnitt genau den Einsatz zurück.

  - kind: problem
    id: da-d1
    depth: 2
    widget: distribution
    prompt: Ein Rad zahlt 0 € (halbes Rad), 2 € (Viertel) oder 6 € (Viertel). Dreh es mindestens 100-mal.
    params:
      items:
        - label: 0 €
          weight: 2
        - label: 2 €
          weight: 1
        - label: 6 €
          weight: 1
    check:
      predicate: draws >= 100
    hints:
      - Nutze den Knopf für 100 Drehungen.
      - Merk dir grob, wie oft jede Auszahlung kam.
    explanation: Die Hälfte der Drehungen bringt nichts. Trotzdem lohnt sich das Rad im Schnitt – siehe nächste Aufgabe.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Wie viel zahlt dieses Rad im Schnitt pro Drehung?
    params:
      unit: €
    answer:
      value: 2
    hints:
      - Rechne 0 · ½ + 2 · ¼ + 6 · ¼.
      - 0,5 + 1,5.
    explanation: 0 + 0,5 + 1,5 = 2 €. Kostet ein Dreh 2 €, ist das Spiel fair.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum lohnt sich eine Versicherung, obwohl sie im Schnitt mehr kostet als der Schaden?"
    params:
      keywords:
        - - erwartungswert
          - schnitt
          - durchschnitt
          - expected
          - average
        - - ruin
          - groß
          - tragen
          - existenz
          - huge
          - large
          - afford
          - catastroph
        - - sicher
          - risiko
          - schwank
          - certain
          - risk
          - security
          - protect
          - schutz
      sample: Im Durchschnitt verliert man mit der Versicherung etwas Geld. Aber sie schützt vor einem seltenen, riesigen Schaden, den man allein nicht tragen könnte – man tauscht einen kleinen sicheren Verlust gegen ein ruinöses Risiko.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Wie groß ist die Standardabweichung dieses Rads? Auf zwei Stellen. (E(X²) = 0 · ½ + 4 · ¼ + 36 · ¼)
    answer:
      value: 2.45
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 6) < 0.01
        misconception: variance-not-sd
        text: Das ist die Varianz. Zieh noch die Wurzel.
    hints:
      - E(X²) = 1 + 9 = 10. Varianz = 10 − 2².
      - Zieh die Wurzel aus 6.
    explanation: Varianz 10 − 4 = 6, also σ = √6 ≈ 2,45 €. Ein Rad mit festen 2 € hätte denselben Schnitt, aber σ = 0.
    difficulty: 3

srs:
  cards_from: [wuerfel, fair]
