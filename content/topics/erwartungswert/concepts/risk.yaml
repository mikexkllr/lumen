id: stats.expected.risk
type: concept
title: Gleicher Schnitt, anderes Risiko
summary: Wie stark schwankt das Ergebnis?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Gleicher Schnitt, wilderes Leben
    body: Zwei Geldanlagen bringen im Schnitt gleich viel. Trotzdem fühlt sich die eine viel wilder an. Zieh den Regler für die **Streuung** hoch und runter. Wie oft landest du dann noch nahe am Schnitt?
    visual:
      widget: sim
      interactive: true
      params:
        scene: normal
        controls:
          mean:
            value: 100
            fixed: true

  - kind: problem
    id: zwei-spiele
    widget: choice
    body: Spiel A – sicher 10 €. Spiel B – Münzwurf um 0 € oder 20 €.
    prompt: Was stimmt?
    params:
      options:
        - { label: Gleicher Erwartungswert – B ist riskanter., correct: true }
        - { label: B bringt im Schnitt mehr., feedback: "1/2 · 20 € = 10 € – genau wie A." }
        - { label: A bringt im Schnitt mehr., feedback: "Beide bringen im Schnitt 10 €." }
    hints:
      - Rechne beide Erwartungswerte aus.
    explanation: Der Schnitt ist gleich, die Schwankung nicht.

  - kind: explain
    id: s2
    body: |
      Der Erwartungswert sagt nur, was **im Schnitt** herauskommt. Wie stark es schwankt, zeigt die **Streuung**.
      Viele Menschen zahlen für weniger Schwankung – das ist der Kern jeder Versicherung.

  - kind: problem
    id: schnitt
    widget: numeric
    prompt: "Spiel – mit 1/{{k}} gewinnst du {{g}} €, sonst nichts. Was ist der Erwartungswert?"
    params: { unit: "€" }
    answer: { value: "{{g / k}}" }
    hints:
      - "{{g}} € · 1/{{k}}."
    explanation: "{{g}} / {{k}} = {{g / k}} €."
    variants:
      params: { k: "choice[2,4,5,10]", g: "choice[20,40,100]" }
      defaults: { k: 4, g: 40 }

  - kind: problem
    id: lieber
    widget: buckets
    prompt: Eher wenig oder viel Schwankung?
    params:
      buckets: [{ label: wenig Schwankung }, { label: viel Schwankung }]
      items:
        - { label: Festes Gehalt, bucket: wenig Schwankung }
        - { label: Sparbuch, bucket: wenig Schwankung }
        - { label: Lotto, bucket: viel Schwankung }
        - { label: Provision nach Verkäufen, bucket: viel Schwankung }
        - { label: Einzelne Aktie, bucket: viel Schwankung }
    hints:
      - Wie sicher ist das Ergebnis?
    explanation: Gleiche Erwartung kann sehr verschieden riskant sein.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Wie stark schwankt das Ergebnis?
    params:
      buckets:
        - id: b1
          label: Wenig Schwankung
        - id: b2
          label: Viel Schwankung
      items:
        - label: Sparbuch
          bucket: b1
        - label: Lotterielos
          bucket: b2
        - label: Festes Gehalt
          bucket: b1
        - label: Eine einzelne Aktie
          bucket: b2
    hints:
      - Wo weißt du vorher ziemlich genau, was herauskommt?
    explanation: Der Schnitt allein sagt nicht, wie riskant etwas ist.

  - kind: problem
    id: intro-c1
    widget: chart
    prompt: "Stell vier Runden eines riskanten Spiels ein: im Schnitt 5 €, aber mit mindestens 8 € Abstand zwischen bester und schlechtester Runde."
    params:
      labels:
        - Runde 1
        - Runde 2
        - Runde 3
        - Runde 4
      values:
        - 5
        - 5
        - 5
        - 5
      editable:
        - 0
        - 1
        - 2
        - 3
      min: 0
      max: 10
      unit: €
      show:
        - mean
    check:
      predicate: avg == 5 && max(values) - min(values) >= 8
    solution:
      state:
        values:
          - 1
          - 9
          - 1
          - 9
    hints:
      - Was du einer Runde nach oben gibst, musst du einer anderen nach unten nehmen.
      - Zum Beispiel 1, 9, 1 und 9 € – der Schnitt bleibt 5 €.
    explanation: "Gleicher Erwartungswert, viel mehr **Streuung**: Genau das unterscheidet ein riskantes von einem sicheren Spiel."

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Zwei Angebote: sicher 3000 € – oder 80 % Chance auf 4000 €. Die meisten nehmen die 3000 €. Wie nennt man das?"
    params:
      options:
        - label: Risikoaversion – man verzichtet auf erwarteten Gewinn für Sicherheit
          correct: true
        - label: Einen Rechenfehler
          feedback: Es ist eine bewusste und oft vernünftige Abwägung.
        - label: Spielerfehlschluss
          feedback: Der betrifft den Glauben an »fällige« Ergebnisse.
    hints:
      - Der Erwartungswert der Wette ist 3200 €.
    explanation: Der zweite Tausender bringt weniger Zufriedenheit als der erste. Darum gibt es Versicherungen.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: Ein Spiel bringt mit je 50 % entweder {{2 * g}} € oder 0 €. Wie groß ist die Standardabweichung?
    params:
      unit: €
    answer:
      value: "{{g}}"
    hints:
      - Der Erwartungswert ist {{g}} €.
      - Beide Ergebnisse liegen genau {{g}} € vom Erwartungswert weg.
    explanation: Beide Abstände sind {{g}}, also ist σ = {{g}} €. Die **Standardabweichung** misst das Risiko in Euro.
    difficulty: 2
    variants:
      params:
        g: choice[5,10,25,50,100]
      defaults:
        g: 10

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Eine Anlage schwankt mit σ = 20 %. Du verteilst dein Geld gleich auf 4 solche Anlagen, die unabhängig voneinander schwanken. Wie groß ist σ jetzt?
    params:
      unit: "%"
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 5
        misconception: divide-by-n
        text: Geteilt durch 4 wäre zu optimistisch. Die Streuung sinkt mit √n.
    hints:
      - Beim Mitteln von n unabhängigen Werten schrumpft σ um √n.
      - "20 : √4."
    explanation: "20 : 2 = 10 %. Das ist **Risikostreuung**: gleicher Erwartungswert, halbes Risiko."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Menschen empfinden einen Verlust von 100 € etwa doppelt so stark wie einen Gewinn von 100 €. Was folgt daraus?
    params:
      options:
        - label: Sie lehnen faire Wetten ab und halten zu lange an Verlusten fest
          correct: true
        - label: Sie spielen besonders gern
          feedback: Verlustangst hält eher vom Spielen ab.
        - label: Nichts – das gleicht sich aus
          feedback: Die Asymmetrie verzerrt Entscheidungen messbar.
    hints:
      - Würdest du um ±100 € eine Münze werfen?
    explanation: "**Verlustaversion** aus der Prospect-Theorie von Kahneman und Tversky – Nobelpreis 2002."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: Zwei unabhängige Risiken haben σ = 3 und σ = 4. Wie groß ist die Standardabweichung ihrer Summe?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 7
        misconception: add-sd
        text: Standardabweichungen addieren sich nicht – Varianzen schon.
    hints:
      - "Addiere die Varianzen: 9 + 16."
      - Zieh die Wurzel aus 25.
    explanation: √(9 + 16) = 5 – wie beim Satz des Pythagoras. Unabhängige Risiken stehen gewissermaßen senkrecht aufeinander.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Eine Bank verteilt Kredite auf 1000 Hausbesitzer in derselben Region. Warum schützt das 2008 kaum?
    params:
      options:
        - label: Die Risiken hingen zusammen – fallen die Hauspreise, trifft es alle zugleich
          correct: true
        - label: 1000 sind zu wenige
          feedback: Auch eine Million hilft nicht, wenn alle gemeinsam fallen.
        - label: Kredite haben kein Risiko
          feedback: Genau das war der Irrtum.
    hints:
      - Die √n-Regel braucht eine Voraussetzung. Welche?
      - Unabhängigkeit fehlt, wenn ein gemeinsamer Faktor wirkt.
    explanation: Bei korrelierten Risiken bleibt ein Rest, den keine Streuung wegmittelt. Banken unterschätzten, wie stark die Ausfälle zusammenhingen.
    difficulty: 3

srs:
  cards_from: [zwei-spiele, schnitt]
