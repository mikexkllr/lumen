id: stats.information.questions
type: concept
title: "Zwanzig Fragen"
summary: "Ja-Nein-Fragen als Maß für Information."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Ja, nein, ja, ja
    body: "Beim Spiel »20 Fragen« errät man fast alles mit Ja und Nein. Jede Lampe hier ist eine Antwort: an heißt Ja. Schalte sie und schau, wie viele **verschiedene** Zahlen du mit vier Antworten erreichst."
    visual:
      widget: bits
      interactive: true
      params:
        bits: 4

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ich denke an eine Zahl von 1 bis 1000. Wie viele Ja-Nein-Fragen brauchst du höchstens, wenn du klug fragst?"
    params:
      min: 1
      max: 100
    answer:
      value: 10
      tolerance: 1
    explanation: "Jede kluge Frage halbiert die Möglichkeiten: 1000 → 500 → 250 … Nach 10 Fragen bleibt eine. Denn 2¹⁰ = 1024 ≥ 1000."

  - kind: explain
    id: c1
    body: Ein **Bit** ist die Antwort auf eine Ja-Nein-Frage, die beide Möglichkeiten gleich wahrscheinlich macht. Mit n Bits unterscheidet man 2ⁿ Fälle.

  - kind: problem
    id: c2
    widget: numeric
    prompt: Wie viele verschiedene Dinge kann man mit 20 Ja-Nein-Fragen sicher unterscheiden?
    answer:
      value: 1048576
    feedback:
      - when: numval(state.input) == 40
        misconception: linear-bits
        text: Fragen verdoppeln die Möglichkeiten, sie addieren sie nicht.
    hints:
      - Jede Frage verdoppelt die Zahl der Fälle.
      - Rechne 2²⁰.
    explanation: 2²⁰ = 1 048 576 – über eine Million. Darum klappt das Spiel »20 Fragen« so gut.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Wie viele Ja-Nein-Fragen brauchst du mindestens, um eine von {{n}} gleich wahrscheinlichen Möglichkeiten sicher zu finden?
    answer:
      value: "{{k}}"
    hints:
      - Suche die kleinste Zweierpotenz, die mindestens {{n}} ist.
      - 2^{{k - 1}} = {{2 ** (k - 1)}} reicht nicht, 2^{{k}} = {{2 ** k}} schon.
    explanation: "{{k}} Fragen, denn 2^{{k}} = {{2 ** k}} ≥ {{n}}. Die Informationsmenge ist log₂ {{n}} Bit, aufgerundet auf ganze Fragen."
    variants:
      params:
        k: int[3,9]
        e: int[1,3]
      derive:
        n: 2 ** (k - 1) + e * 2 ** (k - 3)
      defaults:
        k: 5
        e: 2

  - kind: problem
    id: c4
    widget: choice
    prompt: Du suchst eine Person aus 64. Welche erste Frage ist am besten?
    params:
      options:
        - label: Eine, die die Gruppe genau halbiert
          correct: true
        - label: »Ist es Anna?«
          feedback: Mit 1/64 Chance ein Volltreffer – meist lernst du fast nichts.
        - label: »Trägt die Person eine Brille?« – wenn 5 von 64 eine tragen
          feedback: Das teilt sehr ungleich. Meist ist die Antwort »nein«.
    hints:
      - Welche Frage bringt im ungünstigsten Fall am meisten?
      - Bei einer 50:50-Frage bleiben immer 32 übrig.
    explanation: Eine Frage mit 50:50-Antwort liefert genau 1 Bit. Ungleiche Fragen liefern im Schnitt **weniger** als ein Bit.

  - kind: problem
    id: c5
    widget: order
    prompt: Ordne nach Informationsmenge – von wenig bis viel.
    params:
      items:
        - label: Ein Münzwurf
        - label: Ein Würfelwurf
        - label: Ein Buchstabe von A bis Z, alle gleich häufig
        - label: Eine Karte aus 52
        - label: Eine Zahl von 1 bis 1000
    hints:
      - Mehr gleich wahrscheinliche Möglichkeiten heißt mehr Bits.
      - 2, 6, 26, 52, 1000 Möglichkeiten.
    explanation: log₂ 2 = 1, log₂ 6 ≈ 2,6, log₂ 26 ≈ 4,7, log₂ 52 ≈ 5,7, log₂ 1000 ≈ 10 Bit.

  - kind: problem
    id: intro-c1
    widget: bits
    prompt: Jede Lampe ist eine Ja-Nein-Antwort. Stelle mit sechs Lampen die Zahl 37 ein.
    params:
      bits: 6
      showValue: false
    answer:
      value: 37
    hints:
      - Welche Zweierpotenzen ergeben zusammen 37?
      - 37 = 32 + 4 + 1 – schalte diese drei Lampen an.
    explanation: 100101 = 32 + 4 + 1 = 37. Sechs Ja-Nein-Antworten unterscheiden 64 Zahlen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Würfelwurf hat log₂ 6 ≈ 2,585 Bit. Wie viele ganze Bits braucht man mindestens, um **fünf** Würfe zusammen zu speichern? (6⁵ = 7776)
    answer:
      value: 13
    feedback:
      - when: numval(state.input) == 15
        misconception: per-symbol
        text: 3 Bit pro Wurf geht – verschenkt aber Platz. Speichere alle fünf zusammen.
    hints:
      - Die fünf Würfe haben 7776 Möglichkeiten.
      - 2¹² = 4096 ist zu wenig, 2¹³ = 8192 reicht.
    explanation: 13 Bit statt 15. Je mehr Würfe man bündelt, desto näher kommt man an 2,585 Bit pro Wurf. Information kann **Bruchteile** von Bits haben.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Beim Spiel »Mastermind« bringt eine Frage nicht nur ja oder nein, sondern eine von vielen Antworten. Was bedeutet das?
    params:
      options:
        - label: Eine Frage kann mehr als 1 Bit liefern
          correct: true
        - label: Jede Frage liefert genau 1 Bit
          feedback: Das gilt nur für Ja-Nein mit 50:50.
        - label: Mehr Antworten machen es schwerer
          feedback: Mehr mögliche Antworten heißt mehr Information pro Zug.
    hints:
      - Bei k gleich wahrscheinlichen Antworten erhält man log₂ k Bit.
      - Eine Frage mit 4 gleich wahrscheinlichen Antworten bringt 2 Bit.
    explanation: Wer Fragen so stellt, dass alle Antworten etwa gleich wahrscheinlich sind, kommt am schnellsten ans Ziel. Das ist die **Strategie** der maximalen Information.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Du sortierst 8 Karten nur mit Vergleichen »Ist A kleiner als B?«. Es gibt 8! = 40 320 Reihenfolgen. Wie viele Vergleiche braucht jedes Verfahren im ungünstigsten Fall mindestens? (2¹⁵ = 32 768, 2¹⁶ = 65 536)
    answer:
      value: 16
    hints:
      - Jeder Vergleich ist eine Ja-Nein-Frage.
      - Welche Zweierpotenz reicht für 40 320?
    explanation: Mindestens 16. Allgemein braucht Sortieren mindestens log₂(n!) ≈ n log₂ n Vergleiche – eine **untere Schranke** aus reiner Informationstheorie.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: "12 Münzen, eine ist falsch – leichter oder schwerer. Eine Balkenwaage hat drei Ausgänge: links, rechts, gleich. Wie viele Wägungen braucht man mindestens?"
    params:
      options:
        - label: 3 – denn 3³ = 27 ≥ 24 Möglichkeiten
          correct: true
        - label: "2"
          feedback: 3² = 9 Ausgänge reichen nicht für 24 Fälle.
        - label: 5, weil log₂ 24 ≈ 4,6
          feedback: Die Waage hat drei Ausgänge, nicht zwei.
    hints:
      - Wie viele Fälle gibt es? 12 Münzen mal 2 (leichter oder schwerer).
      - Jede Wägung verdreifacht die unterscheidbaren Fälle.
    explanation: 24 Fälle brauchen mindestens log₃ 24 ≈ 2,9, also 3 Wägungen – und mit Geschick reichen 3 tatsächlich. **Informationsgrenzen** sagen, was überhaupt möglich ist.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein Bit ist und warum 20 Fragen für eine Million Dinge reichen.
    params:
      keywords:
        - - ja
          - nein
          - yes
          - no
          - frage
          - question
        - - halb
          - halbier
          - half
          - halve
          - verdoppel
          - double
        - - million
          - 2^20
          - zwanzig
          - twenty
          - "1048576"
      sample: Ein Bit ist die Antwort auf eine Ja-Nein-Frage, die die Möglichkeiten halbiert. Jede Frage verdoppelt, was man unterscheiden kann. Nach zwanzig Fragen sind das 2^20, also etwa eine Million.
    explanation: Halbieren ist exponentiell stark – darum wächst die Zahl der Fragen nur mit dem Logarithmus.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
