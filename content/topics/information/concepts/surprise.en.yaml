id: stats.information.surprise
type: concept
title: "Surprise in bits"
summary: "Rare things tell you more: −log₂ p."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Two messages: »The sun will rise tomorrow.« and »It will snow in the Sahara tomorrow.« Which contains more information?"
    params:
      options:
        - label: The one about snow – it is surprising
          correct: true
        - label: Information measures surprise, not importance.
          feedback: Information misst Überraschung, nicht Wichtigkeit.
        - label: Length does not count, only probability.
          feedback: Die Länge zählt nicht, nur die Wahrscheinlichkeit.
    hints:
      - What would you have expected anyway?
      - A certain message does not change what you know.
    explanation: The less likely a message, the more you learn. Shannon called this the information content.

  - kind: explain
    id: c1
    body: The **information content** of a message with probability p is −log₂ p bits. At p = 1/2 it is 1 bit, at p = 1/4 it is 2 bits, at p = 1 zero bits.

  - kind: problem
    id: c2
    widget: numeric
    prompt: An event has probability 1/{{2 ** k}}. How many bits of surprise does it bring?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == 2 ** k
        misconception: no-log
        text: "You counted the options. The question is the halvings: log₂."
    hints:
      - How often must you halve 1 to get 1/{{2 ** k}}?
      - 1/{{2 ** k}} = (1/2)^{{k}}.
    explanation: −log₂(1/{{2 ** k}}) = {{k}} bits. Each halving of the probability adds one bit.
    variants:
      params:
        k: int[1,10]
      defaults:
        k: 3

  - kind: problem
    id: c3
    widget: numeric
    prompt: You roll a 6 twice. The surprise of one 6 is log₂ 6 ≈ 2.585 bits. How big is the surprise of »two sixes«? To one decimal.
    answer:
      value: 5.2
      tolerance: 0.05
    hints:
      - "Independent probabilities multiply: 1/36."
      - "The logarithm turns multiplying into adding: 2 · 2.585."
    explanation: "≈ 5.2 bits. That is why the logarithm is used: information from independent events simply adds up."

  - kind: problem
    id: c4
    widget: buckets
    prompt: Much or little surprise?
    params:
      buckets:
        - id: b1
          label: Below 1 bit
        - id: b2
          label: Above 3 bits
      items:
        - label: No rain in the desert
          bucket: b1
        - label: Lottery win
          bucket: b2
        - label: The bus is on time (90 %)
          bucket: b1
        - label: A specific card out of 52
          bucket: b2
        - label: No six on a die
          bucket: b1
    hints:
      - Likely things bring few bits.
      - "Below 1 bit means: probability above 50 %."
    explanation: P = 5/6 brings only 0.26 bits, one card out of 52 brings 5.7 bits, a lottery win over 23 bits.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Six correct numbers in the lottery have a chance of 1 in 13,983,816. How many bits of surprise is that? Rounded to whole bits. (2²³ ≈ 8.4 million, 2²⁴ ≈ 16.8 million)
    answer:
      value: 24
      tolerance: 0.5
    hints:
      - You need log₂ 13,983,816.
      - The number lies between 2²³ and 2²⁴, closer to 2²⁴.
    explanation: log₂ 13,983,816 ≈ 23.7 bits – almost as surprising as 24 coin flips all showing heads.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: In Morse code E is just a dot, while Q is »− − · −«. Why?
    params:
      options:
        - label: Common letters get short codes – that saves time
          correct: true
        - label: The lengths roughly follow letter frequency in English.
          feedback: Die Längen folgen grob der Häufigkeit im Englischen.
        - label: It is about frequency, not importance.
          feedback: Es geht um Häufigkeit, nicht Wichtigkeit.
    hints:
      - Which letter is most common in English?
      - Little surprise deserves little length.
    explanation: The ideal code length of a symbol is its information content −log₂ p. Morse came close to this intuitively in the 1840s.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why measure surprise with −log p and not, say, with 1/p?
    params:
      options:
        - label: Only the logarithm makes information from independent events additive
          correct: true
        - label: The size is beside the point – additivity is what matters.
          feedback: Die Größe ist Nebensache – entscheidend ist die Addition.
        - label: The reason is mathematical, not technical.
          feedback: Der Grund ist mathematisch, nicht technisch.
    hints:
      - For two independent events P = p · q.
      - Which function turns products into sums?
    explanation: "Demanding »certain = 0«, »rarer = more« and »independent = add« leaves only −log p. Base 2 just sets the unit: bits."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: With the natural logarithm information is measured in »nats«. 1 nat is 1/ln 2 bits. How many bits is 1 nat? To two decimals. (ln 2 ≈ 0.693)
    answer:
      value: 1.44
      tolerance: 0.01
    hints:
      - Compute 1 ÷ 0.693.
      - About 1.44.
    explanation: 1 nat ≈ 1.44 bits. Physicists and AI researchers often use nats, communications engineers bits – like metres and feet.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why rare messages carry more information.
    params:
      keywords:
        - - selten
          - unwahrscheinlich
          - rare
          - unlikely
        - - überrasch
          - surpris
          - erwart
          - expect
        - - log
          - bit
          - halb
          - half
      sample: A rare message is surprising because you do not expect it. It rules out many possibilities. This is measured with minus log base 2 of the probability, in bits.
    explanation: Whoever only hears the expected learns nothing. Information is the gap between expectation and event.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
