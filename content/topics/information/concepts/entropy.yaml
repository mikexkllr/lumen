id: stats.information.entropy
type: concept
title: "Shannon-Entropie"
summary: "Die mittlere Überraschung einer Quelle."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Welche Münze ist schwerer vorherzusagen: eine faire oder eine, die zu 90 % Kopf zeigt?"
    params:
      options:
        - label: Die faire
          correct: true
        - label: Die gezinkte
          feedback: Bei ihr tippst du fast immer richtig auf Kopf.
        - label: Beide gleich
          feedback: Die Ungewissheit hängt stark von p ab.
    hints:
      - Bei welcher Münze liegst du mit dem besten Tipp öfter richtig?
      - Ungewissheit ist am größten, wenn alles gleich wahrscheinlich ist.
    explanation: Die faire Münze hat 1 Bit Ungewissheit, die gezinkte nur etwa 0,47 Bit. Dieses Maß heißt **Entropie**.

  - kind: explain
    id: c1
    body: "Die **Entropie** ist die mittlere Überraschung: H = Σ p · (−log₂ p). Sie misst, wie viele Bit man im Schnitt pro Zeichen braucht. Gleichverteilung hat die höchste Entropie."
    visual:
      widget: distribution
      params:
        items:
          - label: A
            weight: 2
          - label: B
            weight: 1
          - label: C
            weight: 1

  - kind: problem
    id: c2
    widget: numeric
    prompt: Eine Quelle sendet A mit 1/2, B mit 1/4 und C mit 1/4. Wie groß ist ihre Entropie in Bit?
    answer:
      value: 1.5
    feedback:
      - when: abs(numval(state.input) - 1.585) < 0.01
        misconception: assume-uniform
        text: Das wäre log₂ 3 – die Entropie bei drei **gleich** häufigen Zeichen.
    hints:
      - "Überraschungen: A 1 Bit, B und C je 2 Bit."
      - "Gewichte: ½ · 1 + ¼ · 2 + ¼ · 2."
    explanation: 0,5 + 0,5 + 0,5 = 1,5 Bit. Weniger als log₂ 3 ≈ 1,58, weil A vorhersehbarer ist.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Eine Quelle hat {{2 ** k}} gleich häufige Zeichen. Wie groß ist ihre Entropie?
    answer:
      value: "{{k}}"
    hints:
      - "Bei Gleichverteilung ist jede Überraschung gleich: log₂ {{2 ** k}}."
      - 2^{{k}} = {{2 ** k}}.
    explanation: H = log₂ {{2 ** k}} = {{k}} Bit – das Maximum für {{2 ** k}} Zeichen.
    variants:
      params:
        k: int[1,8]
      defaults:
        k: 3

  - kind: problem
    id: c4
    widget: order
    prompt: Ordne nach Entropie – von klein nach groß.
    params:
      items:
        - label: Münze, die immer Kopf zeigt
        - label: Münze mit 90 % Kopf
        - label: Faire Münze
        - label: Fairer Würfel
        - label: Faires 20er-Glücksrad
    hints:
      - Sicheres hat Entropie 0.
      - Mehr gleich wahrscheinliche Ausgänge heißt mehr Entropie.
    explanation: "0 < 0,47 < 1 < 2,58 < 4,32 Bit. Entropie misst **Ungewissheit**: wie viel man noch nicht weiß."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Berechne die Entropie der 90-%-Münze: H = 0,9 · log₂(1/0,9) + 0,1 · log₂(1/0,1). Es gilt log₂(1/0,9) ≈ 0,152 und log₂ 10 ≈ 3,322. Auf zwei Stellen."
    answer:
      value: 0.47
      tolerance: 0.01
    hints:
      - 0,9 · 0,152 ≈ 0,137.
      - 0,1 · 3,322 ≈ 0,332. Addiere.
    explanation: ≈ 0,47 Bit. 1000 Würfe dieser Münze lassen sich darum auf rund 470 Bit packen statt 1000.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Bit Information steckt im Schnitt in einem Buchstaben eines normalen englischen Texts? (26 gleich häufige Buchstaben hätten 4,7 Bit.)"
    params:
      min: 0
      max: 5
      step: 0.1
    answer:
      value: 1
      tolerance: 0.5
    explanation: Shannon schätzte 1951 etwa 0,6 bis 1,3 Bit pro Buchstabe. Regeln, Wörter und Sinn machen Text **vorhersehbar** – darum lässt er sich stark komprimieren.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Entropie einer Münze mit Kopf-Chance p ist H(p) = −p log₂ p − (1 − p) log₂(1 − p). Wo liegt ihr Maximum?
    params:
      options:
        - label: Bei p = 1/2 mit 1 Bit
          correct: true
        - label: Bei p = 1
          feedback: Dann ist alles sicher – Entropie 0.
        - label: Bei p = 0,9
          feedback: Dort ist sie nur 0,47 Bit.
    hints:
      - "H ist symmetrisch: H(p) = H(1 − p)."
      - Die Ableitung log₂((1 − p)/p) wird bei p = 1/2 null.
    explanation: Unter allen Verteilungen auf n Zeichen hat die **Gleichverteilung** die größte Entropie, nämlich log₂ n. Die Normalverteilung spielt diese Rolle bei fester Varianz.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Die Entropie in der Physik (Boltzmann, S = k · ln W) und die Shannon-Entropie heißen gleich. Was verbindet sie?
    params:
      options:
        - label: Beide zählen, wie viele Möglichkeiten zu dem passen, was man weiß – logarithmisch
          correct: true
        - label: Nichts, es ist nur derselbe Name
          feedback: Der Zusammenhang ist tief und mathematisch genau.
        - label: Beide messen Temperatur
          feedback: Temperatur ist eine andere Größe.
    hints:
      - W ist die Zahl der Mikrozustände zu einem Makrozustand.
      - log₂ W Bit braucht man, um den genauen Zustand anzugeben.
    explanation: Bei W gleich wahrscheinlichen Zuständen ist Shannons H = log W. Boltzmann misst dasselbe in Naturkonstanten. Information hat sogar einen Energiepreis (**Landauer-Prinzip**).
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was Entropie misst – mit Münzen als Beispiel.
    params:
      keywords:
        - - überrasch
          - ungewiss
          - surpris
          - uncertain
        - - mittel
          - mittler
          - schnitt
          - average
          - mean
        - - fair
          - gleich
          - gezinkt
          - loaded
          - equal
          - bit
      sample: Entropie ist die mittlere Überraschung oder Ungewissheit einer Quelle. Eine faire Münze hat 1 Bit, weil beide Seiten gleich wahrscheinlich sind. Eine gezinkte Münze ist vorhersehbarer und hat weniger.
    explanation: Entropie ist der Schnitt aller Überraschungen – gewichtet mit ihrer Häufigkeit.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
