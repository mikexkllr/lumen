id: cs.gates.design
type: concept
title: Schaltungen für den Alltag
summary: Alarmanlage, Vergleicher, Prüfbit.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Jury entscheidet
    body: In einer Castingshow drücken drei Juroren auf Knöpfe. Das Licht soll angehen, wenn **die Mehrheit** Ja sagt. Probier alle Kombinationen aus. Stimmt die Schaltung?
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: A
            label: Jury 1
          - id: B
            label: Jury 2
          - id: C
            label: Jury 3
        gates:
          - id: ab
            type: AND
            in:
              - A
              - B
          - id: ac
            type: AND
            in:
              - A
              - C
          - id: bc
            type: AND
            in:
              - B
              - C
          - id: g
            type: OR
            in:
              - ab
              - ac
              - bc
        outputs:
          - id: Q
            from: g
            label: Ja!

  - kind: problem
    id: alarm
    widget: gates
    prompt: Der Alarm soll losgehen, wenn die Anlage scharf ist (S) und Tür (T) oder Fenster (F) offen ist.
    params:
      inputs: [{ id: S }, { id: T }, { id: F }]
      gates:
        - { id: o, type: "?", in: [T, F], options: [AND, OR] }
        - { id: g, type: "?", in: [S, o], options: [AND, OR] }
      outputs: [{ id: Q, from: g, label: Alarm }]
    check: { predicate: "table('Q') == [0, 0, 0, 0, 0, 1, 1, 1]" }
    hints:
      - Erst Tür und Fenster verbinden, dann mit S.
    explanation: S UND (T ODER F) – genau wie im Satz.

  - kind: problem
    id: gleich
    widget: gates
    prompt: Die Lampe soll leuchten, wenn A und B gleich sind.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: x, type: "?", in: [A, B], options: [AND, OR, XOR] }
        - { id: n, type: NOT, in: [x] }
      outputs: [{ id: Q, from: n, label: gleich }]
    check: { predicate: "table('Q') == [1, 0, 0, 1]" }
    hints:
      - Welches Gatter erkennt, dass zwei Eingänge verschieden sind?
    explanation: XOR meldet »verschieden«, NICHT dreht es zu »gleich«. So vergleichen Chips Zahlen.

  - kind: explain
    id: s3
    body: |
      **Prüfbit:** Beim Senden hängt man ein Bit an, das zählt, ob die Zahl der Einsen ungerade ist. Kippt unterwegs ein Bit, passt das Prüfbit nicht mehr.

  - kind: problem
    id: paritaet
    widget: gates
    prompt: Baue das Prüfbit für drei Bits – 1 bei ungerader Zahl von Einsen.
    params:
      inputs: [{ id: A }, { id: B }, { id: C }]
      gates:
        - { id: g1, type: "?", in: [A, B], options: [AND, OR, XOR] }
        - { id: g2, type: "?", in: [g1, C], options: [AND, OR, XOR] }
      outputs: [{ id: Q, from: g2, label: ungerade }]
    check: { predicate: "table('Q') == [0, 1, 1, 0, 1, 0, 0, 1]" }
    hints:
      - Welches Gatter gibt bei zwei Einsen eine 0?
    explanation: XOR hintereinander zählt die Einsen modulo 2.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Byte 1011 0010 wird mit Prüfbit gesendet. Unterwegs kippen **zwei** Bits. Was passiert?
    params:
      options:
        - label: Der Fehler bleibt unentdeckt – die Zahl der Einsen ist wieder passend
          correct: true
        - label: Der Fehler wird erkannt
          feedback: Zwei Kipper heben sich in der Parität auf.
        - label: Der Fehler wird automatisch repariert
          feedback: Ein Prüfbit kann nur erkennen, nie reparieren.
    hints:
      - Gerade plus zwei ist wieder gerade.
    explanation: Ein Prüfbit erkennt nur eine ungerade Zahl von Fehlern. Mehr Schutz braucht mehr Bits.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: gates
    prompt: "Ein Vergleicher: Die Lampe soll leuchten, wenn A größer als B ist – also A = 1 und B = 0. Wähle das zweite Gatter."
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: nb
          type: NOT
          in:
            - B
        - id: g
          type: "?"
          in:
            - A
            - nb
          options:
            - AND
            - OR
            - XOR
      outputs:
        - id: Q
          from: g
    check:
      predicate: table('Q') == [0, 0, 1, 0]
    hints:
      - Das NICHT liefert 1, wenn B aus ist.
      - A muss an sein und NICHT B auch.
    explanation: A UND (NICHT B). Ketten solcher Vergleicher vergleichen ganze Zahlen – Bit für Bit von links.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: gates
    prompt: "Ein Umschalter (Multiplexer): Ist S = 0, zeigt die Lampe A, ist S = 1, zeigt sie B. Wähle die beiden UND-Kandidaten."
    params:
      inputs:
        - id: S
        - id: A
        - id: B
      gates:
        - id: ns
          type: NOT
          in:
            - S
        - id: g1
          type: "?"
          in:
            - A
            - ns
          options:
            - AND
            - OR
        - id: g2
          type: "?"
          in:
            - B
            - S
          options:
            - AND
            - OR
        - id: g3
          type: OR
          in:
            - g1
            - g2
      outputs:
        - id: Q
          from: g3
    check:
      predicate: table('Q') == [0, 0, 1, 1, 0, 1, 0, 1]
    hints:
      - g1 soll A nur durchlassen, wenn S = 0 ist.
      - "Durchlassen heißt: A UND Erlaubnis."
    explanation: (A UND NICHT S) ODER (B UND S). So wählt ein Prozessor zwischen Rechenergebnissen aus.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: bits
    prompt: "Die ersten 7 Bits sind Daten, das rechte ist das Prüfbit. Stelle es richtig ein: 1 bei ungerader Zahl von Einsen in den Daten, sonst 0."
    params:
      bits: 8
      initial: "{{bin(n)}}{{1 - p}}"
      locked:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      showValue: false
      placeValues: false
    answer:
      value: "{{2 * n + p}}"
    hints:
      - Zähle die Einsen in den ersten sieben Bits.
      - Ungerade Anzahl → Prüfbit 1, gerade → 0.
    explanation: Die Daten {{bin(n)}} haben {{c}} Einsen, also Prüfbit {{p}}. Danach ist die Zahl der Einsen immer gerade.
    variants:
      params:
        n: int[65,127]
      derive:
        c: mod(n, 2) + mod(floor(n / 2), 2) + mod(floor(n / 4), 2) + mod(floor(n / 8), 2) + mod(floor(n / 16), 2) + mod(floor(n / 32), 2) + mod(floor(n / 64), 2)
        p: mod(c, 2)
      defaults:
        n: 89
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie kann ein Computer aus einfachen Schaltern rechnen?"
    params:
      keywords:
        - - gatter
          - gate
          - schalter
          - switch
          - transistor
        - - und
          - oder
          - nicht
          - and
          - or
          - not
          - xor
          - logik
          - logic
        - - addier
          - rechn
          - add
          - calculat
          - übertrag
          - carry
          - bit
      sample: Schalter werden zu Logikgattern wie UND, ODER und XOR verbunden. Kombiniert man Gatter geschickt, können sie zwei Bits addieren und einen Übertrag bilden – viele davon rechnen mit ganzen Zahlen.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: Ein Prüfbit erkennt einen Fehler, findet ihn aber nicht. Der **Hamming-Code** nutzt mehrere Prüfbits, die sich überlappen. Aus dem Muster der falschen Prüfbits liest man die Fehlerstelle ab und kippt sie zurück.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: "Hamming(7,4): 4 Datenbits, 3 Prüfbits. Die 3 Prüfbits bilden $2^3$ Muster, eines davon heißt »kein Fehler«. Wie viele Fehlerstellen lassen sich damit unterscheiden?"
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 8
        misconception: forgot-ok
        text: Ein Muster ist für »alles in Ordnung« reserviert.
    hints:
      - Wie viele Muster bleiben für Fehler übrig?
      - 8 − 1.
    explanation: "7 Muster für 7 Stellen – genau die Länge des Codes. Das ist kein Zufall: Hamming-Codes nutzen jedes Muster aus."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Warum haben Server meist einen Speicher, der Fehler selbst heilt (ECC)?
    params:
      options:
        - label: Strahlung und Störungen kippen gelegentlich Bits – ECC repariert sie unbemerkt
          correct: true
        - label: Weil Server-Programme mehr Fehler haben
          feedback: ECC repariert Hardware-Bits, keine Programmierfehler.
        - label: Damit der Speicher schneller ist
          feedback: ECC kostet eher ein wenig Tempo.
    hints:
      - Was passiert, wenn in Millionen Rechnern ab und zu ein Bit kippt?
      - Ein Hamming-artiger Code steckt in jedem Speicherwort.
    explanation: Kosmische Strahlung kippt tatsächlich Bits. Bei Tausenden Servern passiert das täglich. ECC korrigiert einzelne Fehler und meldet doppelte.
    difficulty: 3

srs:
  cards_from: [gleich, paritaet]
