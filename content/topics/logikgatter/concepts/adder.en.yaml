id: cs.gates.adder
type: concept
title: Building an arithmetic unit
summary: Add in binary with two gates.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: From switch to calculator
    body: Your phone calculates billions of times per second – with nothing but switches. Uncover the stages one by one. This is how **on and off** becomes a calculator.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔌
            front: The switch
            back: A transistor is a tiny switch. Current on means 1, current off means 0.
          - icon: 🚪
            front: The gate
            back: A few transistors together form a gate such as AND or XOR.
          - icon: ➕
            front: The adder
            back: Just two gates can add two bits – carry included.
          - icon: 📱
            front: The processor
            back: Billions of gates together make the chip in your phone.

  - kind: problem
    id: hook
    widget: numeric
    prompt: The binary system has only 0 and 1. How do you write two there?
    answer:
      value: 10
    hints:
      - A new place begins – like 9 + 1 in the decimal system.
    explanation: 1 + 1 = 10. This carry is the heart of every adder.

  - kind: explain
    id: s1
    body: |
      Adding in binary works like written addition: 0 + 1 = 1 and 1 + 1 = **10**.
      With 1 + 1, a **carry** goes into the next place.

  - kind: problem
    id: eins-plus-eins
    widget: numeric
    prompt: What is 1 + 1 in binary?
    params: { placeholder: "only 0 and 1" }
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: decimal
        text: That is right in the decimal system. How do you write 2 in binary?
    hints:
      - In binary, 2 has two digits.
    explanation: 2 is 10 in binary – a 0 in the place and a 1 as the carry.

  - kind: problem
    id: halbaddierer
    widget: gates
    prompt: Build a half adder. S is the sum digit, C the carry. Choose both gates.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: gs, type: "?", in: [A, B], options: [AND, OR, XOR] }
        - { id: gu, type: "?", in: [A, B], options: [AND, OR, XOR] }
      outputs: [{ id: S, from: gs, label: S }, { id: U, from: gu, label: C }]
    check: { predicate: "table('S') == [0, 1, 1, 0] && table('U') == [0, 0, 0, 1]" }
    hints:
      - The sum digit is 1 when exactly one input is 1.
      - A carry only happens with 1 + 1.
    explanation: S is an XOR, C an AND. Together they add two bits.

  - kind: problem
    id: uebertrag
    widget: gates
    prompt: Set the switches so that a carry occurs and the sum digit is 0.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: gs, type: XOR, in: [A, B] }
        - { id: gu, type: AND, in: [A, B] }
      outputs: [{ id: S, from: gs, label: S }, { id: U, from: gu, label: C }]
      goal: { S: 0, U: 1 }
    hints:
      - When is there a carry?
    explanation: 1 + 1 = 10 – sum digit 0, carry 1.

  - kind: problem
    id: addieren
    widget: bits
    prompt: Calculate 0101 + 0011 in binary and set the result.
    params: { bits: 4, showValue: false }
    answer: { value: 8 }
    hints:
      - First translate to decimal – 5 and 3.
    explanation: 5 + 3 = 8, which is 1000 in binary. Three carries move to the left.

  - kind: explain
    id: s6
    body: A processor contains billions of **transistors**. At its core, it does exactly this – switch gates and add bits. Just very, very fast.

  - kind: problem
    id: d1
    depth: 2
    widget: bits
    prompt: Compute 1011 + 0110 in binary and set the result.
    params:
      bits: 5
      showValue: false
    answer:
      value: 17
    hints:
      - 11 + 6 – or digit by digit with carries from the right.
    explanation: 11 + 6 = 17 = 10001. The carry travels through three digits.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "A **full adder** adds three bits: A, B and the carry from the right. It is made of two half adders and an OR that combines their carries."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: gates
    prompt: Complete the full adder. C is the carry from the right. Pick the two open gates.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
          label: Cin
      gates:
        - id: x1
          type: XOR
          in:
            - A
            - B
        - id: s
          type: "?"
          in:
            - x1
            - C
          options:
            - AND
            - OR
            - XOR
        - id: a1
          type: AND
          in:
            - A
            - B
        - id: a2
          type: "?"
          in:
            - x1
            - C
          options:
            - AND
            - OR
            - XOR
        - id: co
          type: OR
          in:
            - a1
            - a2
      outputs:
        - id: S
          from: s
          label: S
        - id: U
          from: co
          label: Cout
    check:
      predicate: table('S') == [0, 1, 1, 0, 1, 0, 0, 1] && table('U') == [0, 0, 0, 1, 0, 1, 1, 1]
    hints:
      - The sum is 1 when an odd number of the three bits are on.
      - The second carry only appears when x1 and C are both 1.
    explanation: S = A XOR B XOR C. The carry comes from A AND B or from (A XOR B) AND C.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: gates
    prompt: Set A, B and the carry-in so that S = 1 and the carry-out = 1.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
          label: Cin
      gates:
        - id: x1
          type: XOR
          in:
            - A
            - B
        - id: s
          type: XOR
          in:
            - x1
            - C
        - id: a1
          type: AND
          in:
            - A
            - B
        - id: a2
          type: AND
          in:
            - x1
            - C
        - id: co
          type: OR
          in:
            - a1
            - a2
      outputs:
        - id: S
          from: s
          label: S
        - id: U
          from: co
          label: Cout
      goal:
        S: 1
        U: 1
    hints:
      - Which sum of three bits gives 11 in binary?
      - 1 + 1 + 1 = 3 = 11.
    explanation: "All three on: 1 + 1 + 1 = 3, binary 11 – sum bit 1, carry 1."
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: An 8-bit adder computes 11111111 + 1. How many digits flip from 1 to 0?
    answer:
      value: 8
    hints:
      - Like 999 + 1 in decimal.
      - The carry runs through every digit.
    explanation: All 8 digits flip and the carry falls off the left. Result 00000000 – an overflow. For the adder this is the slowest case.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A half adder adds two bits. Why is it not enough for multi-digit numbers?
    params:
      options:
        - label: From the second digit on the carry comes in as a third input
          correct: true
        - label: It is too slow
          feedback: An input is missing, not speed.
        - label: It can only compute 0 + 0
          feedback: It handles all four cases correctly.
    hints:
      - What must you include from the second digit on when adding on paper?
    explanation: A **full adder** has three inputs. 64 of them in a row add 64-bit numbers.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Each full adder needs 2 ns until its carry is ready. How many ns does a 64-bit adder need if the carry ripples through all digits?
    params:
      unit: ns
    answer:
      value: 128
    hints:
      - Every digit waits for the carry from the right.
      - 64 · 2 ns.
    explanation: 64 · 2 ns = 128 ns – almost 400 cycles at 3 GHz. Real processors therefore compute carries ahead in parallel (carry-lookahead).
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: bits
    prompt: The adder computes 7 − 3 as 0111 + 1101 (that is −3 in two's complement). Set the 4-bit result – the carry is dropped.
    params:
      bits: 4
      showValue: false
    answer:
      value: 4
    hints:
      - 0111 + 1101 = 10100.
      - Only the right 4 digits count.
    explanation: 0111 + 1101 = 1 0100. Without the carry, 0100 = 4 is left. That is why a processor needs no separate subtractor.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: How many full adders does an adder need to add two 32-bit numbers in one go?
    params:
      options:
        - label: 32 – one per digit
          correct: true
        - label: "64"
          feedback: Each digit handles one bit from each number at once.
        - label: 1 that computes 32 times
          feedback: Possible, but 32 times slower.
    hints:
      - A full adder handles A, B and the carry of one digit.
      - How many digits do the numbers have?
    explanation: 32 full adders in a chain. At the far right a half adder is even enough, since no carry comes in there.
    difficulty: 3

srs:
  cards_from: [eins-plus-eins, uebertrag]
