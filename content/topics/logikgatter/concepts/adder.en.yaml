id: cs.gates.adder
type: concept
title: Building an arithmetic unit
summary: Add in binary with two gates.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: The binary system has only 0 and 1. How do you write two there?
    answer:
      value: 10
    hints:
      - A new place begins – like 9 + 1 in the decimal system.
    explanation: 1 + 1 = 10. This carry is the heart of every adder.


  - kind: explain
    id: s1
    body: |
      Adding in binary works like written addition: 0 + 1 = 1 and 1 + 1 = **10**.
      With 1 + 1, a **carry** goes into the next place.

  - kind: problem
    id: eins-plus-eins
    widget: numeric
    prompt: What is 1 + 1 in binary?
    params: { placeholder: "only 0 and 1" }
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: decimal
        text: That is right in the decimal system. How do you write 2 in binary?
    hints:
      - In binary, 2 has two digits.
    explanation: 2 is 10 in binary – a 0 in the place and a 1 as the carry.

  - kind: problem
    id: halbaddierer
    widget: gates
    prompt: Build a half adder. S is the sum digit, C the carry. Choose both gates.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: gs, type: "?", in: [A, B], options: [AND, OR, XOR] }
        - { id: gu, type: "?", in: [A, B], options: [AND, OR, XOR] }
      outputs: [{ id: S, from: gs, label: S }, { id: U, from: gu, label: C }]
    check: { predicate: "table('S') == [0, 1, 1, 0] && table('U') == [0, 0, 0, 1]" }
    hints:
      - The sum digit is 1 when exactly one input is 1.
      - A carry only happens with 1 + 1.
    explanation: S is an XOR, C an AND. Together they add two bits.

  - kind: problem
    id: uebertrag
    widget: gates
    prompt: Set the switches so that a carry occurs and the sum digit is 0.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: gs, type: XOR, in: [A, B] }
        - { id: gu, type: AND, in: [A, B] }
      outputs: [{ id: S, from: gs, label: S }, { id: U, from: gu, label: C }]
      goal: { S: 0, U: 1 }
    hints:
      - When is there a carry?
    explanation: 1 + 1 = 10 – sum digit 0, carry 1.

  - kind: problem
    id: addieren
    widget: bits
    prompt: Calculate 0101 + 0011 in binary and set the result.
    params: { bits: 4, showValue: false }
    answer: { value: 8 }
    hints:
      - First translate to decimal – 5 and 3.
    explanation: 5 + 3 = 8, which is 1000 in binary. Three carries move to the left.

  - kind: explain
    id: s6
    body: A processor contains billions of **transistors**. At its core, it does exactly this – switch gates and add bits. Just very, very fast.

  - kind: problem
    id: d1
    depth: 2
    widget: bits
    prompt: Compute 1011 + 0110 in binary and set the result.
    params:
      bits: 5
      showValue: false
    answer:
      value: 17
    hints:
      - 11 + 6 – or digit by digit with carries from the right.
    explanation: 11 + 6 = 17 = 10001. The carry travels through three digits.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A half adder adds two bits. Why is it not enough for multi-digit numbers?
    params:
      options:
        - label: From the second digit on the carry comes in as a third input
          correct: true
        - label: It is too slow
          feedback: An input is missing, not speed.
        - label: It can only compute 0 + 0
          feedback: It handles all four cases correctly.
    hints:
      - What must you include from the second digit on when adding on paper?
    explanation: A **full adder** has three inputs. 64 of them in a row add 64-bit numbers.
    difficulty: 3

srs:
  cards_from: [eins-plus-eins, uebertrag]
