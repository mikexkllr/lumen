id: cs.gates.basic
type: concept
title: UND, ODER, NICHT
summary: Drei Bausteine für jede Entscheidung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: und
    widget: gates
    prompt: Die Lampe hängt an einem UND-Gatter. Bring sie zum Leuchten.
    params:
      inputs: [{ id: A }, { id: B }]
      gates: [{ id: g, type: AND, in: [A, B] }]
      outputs: [{ id: Q, from: g, label: Lampe }]
      goal: { Q: 1 }
    hints:
      - Ein Schalter allein reicht nicht.
    explanation: UND gibt nur dann 1, wenn beide Eingänge 1 sind.

  - kind: explain
    id: s2
    body: |
      **UND** gibt 1, wenn beide Eingänge 1 sind. **ODER** gibt 1, sobald einer 1 ist. **NICHT** dreht den Wert um.
      Probier das ODER-Gatter aus.
    visual:
      widget: gates
      interactive: true
      params:
        inputs: [{ id: A }, { id: B }]
        gates: [{ id: g, type: OR, in: [A, B] }]
        outputs: [{ id: Q, from: g, label: Lampe }]

  - kind: problem
    id: nicht
    widget: gates
    prompt: Hier steckt ein NICHT-Gatter. Wie muss der Schalter stehen, damit die Lampe leuchtet?
    params:
      inputs: [{ id: A, value: 1 }]
      gates: [{ id: n, type: NOT, in: [A] }]
      outputs: [{ id: Q, from: n, label: Lampe }]
      goal: { Q: 1 }
    hints:
      - NICHT macht aus 1 eine 0 und aus 0 eine 1.
    explanation: Der Schalter muss aus sein. NICHT macht daraus eine 1.

  - kind: problem
    id: welches
    widget: gates
    prompt: A ist an, B ist aus. Welches Gatter lässt die Lampe leuchten? Tippe es an.
    params:
      inputs: [{ id: A, value: 1, fixed: true }, { id: B, value: 0, fixed: true }]
      gates: [{ id: g, type: "?", in: [A, B], options: [AND, OR] }]
      outputs: [{ id: Q, from: g, label: Lampe }]
      goal: { Q: 1 }
    hints:
      - Reicht ein Eingang mit 1?
    explanation: ODER reicht ein Eingang mit 1. UND bräuchte beide.

  - kind: problem
    id: alarm
    widget: choice
    prompt: Ein Alarm soll losgehen, wenn die Tür offen ist oder das Fenster. Welches Gatter passt?
    params:
      options:
        - { label: ODER, correct: true }
        - { label: UND, feedback: "Dann bräuchte es Tür und Fenster gleichzeitig offen." }
        - { label: NICHT, feedback: "NICHT hat nur einen Eingang und dreht ihn um." }
    hints:
      - Reicht schon eins von beiden?
    explanation: Schon eine offene Stelle soll reichen – das ist ODER.

  - kind: problem
    id: tabelle
    widget: gates
    prompt: Wähle das Gatter, das nur leuchtet, wenn beide Schalter an sind.
    body: Geprüft wird für alle vier Schalter-Stellungen.
    params:
      inputs: [{ id: A }, { id: B }]
      gates: [{ id: g, type: "?", in: [A, B], options: [OR, AND] }]
      outputs: [{ id: Q, from: g, label: Lampe }]
    check: { predicate: "table('Q') == [0, 0, 0, 1]" }
    hints:
      - Probier die Schalter aus und beobachte die Lampe.
    explanation: Das ist UND. Es gibt nur bei 1 und 1 eine 1.

  - kind: problem
    id: c1
    widget: match
    prompt: Welches Gatter passt zur Regel?
    params:
      pairs:
        - left: 1 nur wenn beide 1 sind
          right: UND
        - left: 1 wenn mindestens einer 1 ist
          right: ODER
        - left: dreht 0 und 1 um
          right: NICHT
    hints:
      - Denk an Schalter in Reihe und parallel.
    explanation: Aus diesen drei Bausteinen lässt sich jede logische Regel bauen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Gatter hat 3 Eingänge. Wie viele Zeilen hat seine Wahrheitstabelle?
    answer:
      value: 8
    hints:
      - Jeder Eingang kann 0 oder 1 sein.
    explanation: 2³ = 8. Mit jedem weiteren Eingang verdoppelt sich die Tabelle.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: gates
    prompt: Wähle das Gatter, das nur leuchtet, wenn beide Schalter aus sind.
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: g
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
            - NAND
            - NOR
      outputs:
        - id: Q
          from: g
    check:
      predicate: table('Q') == [1, 0, 0, 0]
    hints:
      - Probier jedes Gatter mit beiden Schaltern aus.
      - Es ist das Gegenteil von ODER.
    explanation: "NOR heißt »nicht oder«: Es leuchtet nur, wenn keiner der Eingänge an ist."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: gates
    prompt: Q = (A UND B) ODER C. Der Schalter C klemmt auf 0. Bring die Lampe trotzdem zum Leuchten.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
          value: 0
          fixed: true
      gates:
        - id: g1
          type: AND
          in:
            - A
            - B
        - id: g2
          type: OR
          in:
            - g1
            - C
      outputs:
        - id: Q
          from: g2
      goal:
        Q: 1
    hints:
      - Wenn C aus ist, muss der andere Eingang des ODER an sein.
      - Das UND braucht beide Schalter.
    explanation: A = 1 und B = 1 machen das UND zu 1 – und damit auch das ODER.
    difficulty: 2

  - kind: explain
    id: cs-d3
    depth: 2
    body: Eine **Wahrheitstabelle** listet jede Kombination der Eingänge mit dem Ergebnis. Bei n Eingängen hat sie $2^n$ Zeilen. Sie beschreibt eine Schaltung vollständig.

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: Q = (A UND B) ODER C. In wie vielen der 8 Zeilen der Wahrheitstabelle leuchtet Q?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: missed-case
        text: Das sind nur die Zeilen mit C = 1. Eine kommt noch dazu.
    hints:
      - Ist C = 1, leuchtet Q immer. In wie vielen Zeilen ist C = 1?
      - Ist C = 0, braucht es A = B = 1.
    explanation: 4 Zeilen mit C = 1, dazu die Zeile A = 1, B = 1, C = 0. Zusammen 5.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie viele **verschiedene** Gatter mit zwei Eingängen kann es überhaupt geben?
    answer:
      value: 16
    hints:
      - Die Tabelle hat 4 Zeilen, und in jeder steht 0 oder 1.
    explanation: 2⁴ = 16. UND, ODER, XOR, NAND sind nur vier davon.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: gates
    prompt: "Baue ein NOR aus zwei Gattern: Die Lampe leuchtet nur, wenn beide Schalter aus sind. Wähle das erste Gatter."
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: g1
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
            - XOR
        - id: g2
          type: NOT
          in:
            - g1
      outputs:
        - id: Q
          from: g2
    check:
      predicate: table('Q') == [1, 0, 0, 0]
    hints:
      - Das NICHT dreht das Ergebnis des ersten Gatters um.
      - Welches Gatter ist nur bei 0, 0 aus?
    explanation: NICHT (A ODER B) ist NOR. Nach De Morgan ist das dasselbe wie (NICHT A) UND (NICHT B).
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Ein Gatter hat 3 Eingänge. Wie viele verschiedene Gatter dieser Art gibt es? Jede Tabelle zählt als ein Gatter.
    answer:
      value: 256
    feedback:
      - when: numval(state.input) == 16
        misconception: two-inputs
        text: Das gilt für 2 Eingänge. Mit 3 Eingängen hat die Tabelle 8 Zeilen.
      - when: numval(state.input) == 8
        misconception: rows-vs-tables
        text: Das sind die Zeilen. Jede Zeile kann 0 oder 1 ergeben.
    hints:
      - Die Tabelle hat 8 Zeilen. In jeder steht 0 oder 1.
      - $2^8$.
    explanation: "8 Zeilen, je 2 Möglichkeiten: $2^8$ = 256. Allgemein gibt es $2^{2^n}$ Gatter mit n Eingängen."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was UND, ODER und NICHT tun – mit einem Beispiel aus dem Alltag.
    params:
      keywords:
        - - beide
          - both
          - alle
          - all
        - - einer
          - mindestens
          - either
          - at least
          - one of
        - - umdreh
          - gegenteil
          - invert
          - opposite
          - flip
      sample: UND ist nur an, wenn beide Eingänge an sind – wie ein Auto, das nur mit Schlüssel und Fuß auf der Bremse startet. ODER ist an, sobald mindestens einer an ist – wie eine Klingel mit zwei Knöpfen. NICHT dreht den Wert um, ins Gegenteil.
    difficulty: 3

srs:
  cards_from: [welches, alarm]
