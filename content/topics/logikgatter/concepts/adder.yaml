id: cs.gates.adder
type: concept
title: Ein Rechenwerk bauen
summary: Mit zwei Gattern binär addieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Vom Schalter zum Rechner
    body: Dein Handy rechnet Milliarden Mal pro Sekunde – mit nichts als Schaltern. Deck die Stufen nacheinander auf. So wird aus **an und aus** ein Rechenwerk.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔌
            front: Der Schalter
            back: Ein Transistor ist ein winziger Schalter. Strom an heißt 1, Strom aus heißt 0.
          - icon: 🚪
            front: Das Gatter
            back: Ein paar Transistoren bilden zusammen ein Gatter wie UND oder XOR.
          - icon: ➕
            front: Der Addierer
            back: Schon zwei Gatter können zwei Bits zusammenzählen – samt Übertrag.
          - icon: 📱
            front: Der Prozessor
            back: Milliarden Gatter zusammen ergeben den Chip in deinem Handy.

  - kind: problem
    id: hook
    widget: numeric
    prompt: Im Zweiersystem gibt es nur 0 und 1. Wie schreibt man dort die Zwei?
    answer:
      value: 10
    hints:
      - Eine neue Stelle beginnt – wie bei 9 + 1 im Zehnersystem.
    explanation: 1 + 1 = 10. Dieser Übertrag ist der Kern jedes Rechenwerks.

  - kind: explain
    id: s1
    body: |
      Binär addieren geht wie schriftlich rechnen: 0 + 1 = 1 und 1 + 1 = **10**.
      Bei 1 + 1 entsteht ein **Übertrag** in die nächste Stelle.

  - kind: problem
    id: eins-plus-eins
    widget: numeric
    prompt: Was ergibt 1 + 1 im Zweiersystem?
    params: { placeholder: "nur 0 und 1" }
    answer: { value: 10 }
    feedback:
      - when: "numval(state.input) == 2"
        misconception: decimal
        text: Das stimmt im Zehnersystem. Wie schreibt man 2 binär?
    hints:
      - Die 2 hat binär zwei Stellen.
    explanation: 2 ist binär 10 – eine 0 in der Stelle und eine 1 als Übertrag.

  - kind: problem
    id: halbaddierer
    widget: gates
    prompt: Baue einen Halbaddierer. S ist die Summenstelle, Ü der Übertrag. Wähle beide Gatter.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: gs, type: "?", in: [A, B], options: [AND, OR, XOR] }
        - { id: gu, type: "?", in: [A, B], options: [AND, OR, XOR] }
      outputs: [{ id: S, from: gs, label: S }, { id: U, from: gu, label: Ü }]
    check: { predicate: "table('S') == [0, 1, 1, 0] && table('U') == [0, 0, 0, 1]" }
    hints:
      - Die Summenstelle ist 1, wenn genau ein Eingang 1 ist.
      - Ein Übertrag entsteht nur bei 1 + 1.
    explanation: S ist ein XOR, Ü ein UND. Zusammen addieren sie zwei Bits.

  - kind: problem
    id: uebertrag
    widget: gates
    prompt: Stelle die Schalter so, dass ein Übertrag entsteht und die Summenstelle 0 ist.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: gs, type: XOR, in: [A, B] }
        - { id: gu, type: AND, in: [A, B] }
      outputs: [{ id: S, from: gs, label: S }, { id: U, from: gu, label: Ü }]
      goal: { S: 0, U: 1 }
    hints:
      - Wann gibt es einen Übertrag?
    explanation: 1 + 1 = 10 – Summenstelle 0, Übertrag 1.

  - kind: problem
    id: addieren
    widget: bits
    prompt: Rechne binär 0101 + 0011 und stelle das Ergebnis ein.
    params: { bits: 4, showValue: false }
    answer: { value: 8 }
    hints:
      - Übersetze erst in Dezimalzahlen – 5 und 3.
    explanation: 5 + 3 = 8, binär 1000. Drei Überträge wandern nach links.

  - kind: explain
    id: s6
    body: Ein Prozessor enthält Milliarden **Transistoren**. Im Kern tut er genau das – Gatter schalten und Bits addieren. Nur sehr, sehr schnell.

  - kind: problem
    id: d1
    depth: 2
    widget: bits
    prompt: Rechne binär 1011 + 0110 und stelle das Ergebnis ein.
    params:
      bits: 5
      showValue: false
    answer:
      value: 17
    hints:
      - 11 + 6 – oder stellenweise mit Übertrag von rechts.
    explanation: 11 + 6 = 17 = 10001. Der Übertrag wandert durch drei Stellen.
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "Ein **Volladdierer** addiert drei Bits: A, B und den Übertrag von rechts. Er besteht aus zwei Halbaddierern und einem ODER, das ihre Überträge zusammenfasst."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: gates
    prompt: Vervollständige den Volladdierer. C ist der Übertrag von rechts. Wähle die beiden offenen Gatter.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
          label: Cin
      gates:
        - id: x1
          type: XOR
          in:
            - A
            - B
        - id: s
          type: "?"
          in:
            - x1
            - C
          options:
            - AND
            - OR
            - XOR
        - id: a1
          type: AND
          in:
            - A
            - B
        - id: a2
          type: "?"
          in:
            - x1
            - C
          options:
            - AND
            - OR
            - XOR
        - id: co
          type: OR
          in:
            - a1
            - a2
      outputs:
        - id: S
          from: s
          label: S
        - id: U
          from: co
          label: Cout
    check:
      predicate: table('S') == [0, 1, 1, 0, 1, 0, 0, 1] && table('U') == [0, 0, 0, 1, 0, 1, 1, 1]
    hints:
      - Die Summe ist 1, wenn ungerade viele der drei Bits an sind.
      - Der zweite Übertrag entsteht nur, wenn x1 und C beide 1 sind.
    explanation: S = A XOR B XOR C. Der Übertrag kommt aus A UND B oder aus (A XOR B) UND C.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: gates
    prompt: Stelle A, B und den Eingangs-Übertrag so ein, dass S = 1 und der Ausgangs-Übertrag = 1 ist.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
          label: Cin
      gates:
        - id: x1
          type: XOR
          in:
            - A
            - B
        - id: s
          type: XOR
          in:
            - x1
            - C
        - id: a1
          type: AND
          in:
            - A
            - B
        - id: a2
          type: AND
          in:
            - x1
            - C
        - id: co
          type: OR
          in:
            - a1
            - a2
      outputs:
        - id: S
          from: s
          label: S
        - id: U
          from: co
          label: Cout
      goal:
        S: 1
        U: 1
    hints:
      - Welche Summe dreier Bits ergibt binär 11?
      - 1 + 1 + 1 = 3 = 11.
    explanation: "Alle drei an: 1 + 1 + 1 = 3, binär 11 – Summenbit 1, Übertrag 1."
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: Ein 8-Bit-Addierwerk rechnet 11111111 + 1. Wie viele Stellen kippen dabei von 1 auf 0?
    answer:
      value: 8
    hints:
      - Wie beim Zehnersystem 999 + 1.
      - Der Übertrag läuft durch jede Stelle.
    explanation: Alle 8 Stellen kippen, der Übertrag fällt links heraus. Ergebnis 00000000 – ein Überlauf. Für das Addierwerk ist das der langsamste Fall.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Halbaddierer addiert zwei Bits. Warum reicht er für mehrstellige Zahlen nicht aus?
    params:
      options:
        - label: Ab der zweiten Stelle kommt der Übertrag als dritter Eingang dazu
          correct: true
        - label: Er ist zu langsam
          feedback: Es fehlt ein Eingang, nicht Tempo.
        - label: Er kann nur 0 + 0 rechnen
          feedback: Er rechnet alle vier Fälle richtig.
    hints:
      - Was musst du beim schriftlichen Addieren ab der zweiten Stelle mitrechnen?
    explanation: Ein **Volladdierer** hat drei Eingänge. 64 davon hintereinander addieren 64-Bit-Zahlen.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Jeder Volladdierer braucht 2 ns, bis sein Übertrag fertig ist. Wie viele ns braucht ein 64-Bit-Addierer, wenn der Übertrag durch alle Stellen läuft?
    params:
      unit: ns
    answer:
      value: 128
    hints:
      - Jede Stelle wartet auf den Übertrag von rechts.
      - 64 · 2 ns.
    explanation: 64 · 2 ns = 128 ns – bei 3 GHz wären das fast 400 Takte. Echte Prozessoren berechnen die Überträge darum vorausschauend und parallel (Carry-Lookahead).
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: bits
    prompt: Das Addierwerk rechnet 7 − 3 als 0111 + 1101 (das ist −3 im Zweierkomplement). Stelle das 4-Bit-Ergebnis ein – der Übertrag fällt weg.
    params:
      bits: 4
      showValue: false
    answer:
      value: 4
    hints:
      - 0111 + 1101 = 10100.
      - Nur die rechten 4 Stellen zählen.
    explanation: 0111 + 1101 = 1 0100. Ohne den Übertrag bleibt 0100 = 4. Darum braucht ein Prozessor kein eigenes Subtrahierwerk.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Wie viele Volladdierer braucht ein Addierwerk, das zwei 32-Bit-Zahlen in einem Rutsch addiert?
    params:
      options:
        - label: 32 – einen pro Stelle
          correct: true
        - label: "64"
          feedback: Jede Stelle verarbeitet ein Bit aus jeder Zahl gleichzeitig.
        - label: 1, der 32-mal rechnet
          feedback: Das ginge, wäre aber 32-mal langsamer.
    hints:
      - Ein Volladdierer verarbeitet A, B und den Übertrag einer Stelle.
      - Wie viele Stellen haben die Zahlen?
    explanation: 32 Volladdierer in einer Kette. Ganz rechts genügt sogar ein Halbaddierer, weil dort kein Übertrag hereinkommt.
    difficulty: 3

srs:
  cards_from: [eins-plus-eins, uebertrag]
