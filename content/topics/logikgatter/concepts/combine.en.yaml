id: cs.gates.combine
type: concept
title: Combining gates
summary: XOR, NAND and the stairwell light.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Two gates, one riddle
    body: Two gates in a row can do more than either one alone. Switch A and B through all four combinations. In which one does the lamp light up – and why **only** there?
    visual:
      widget: gates
      interactive: true
      params:
        inputs:
          - id: A
          - id: B
        gates:
          - id: o
            type: OR
            in:
              - A
              - B
          - id: n
            type: NOT
            in:
              - o
        outputs:
          - id: Q
            from: n
            label: Lamp

  - kind: problem
    id: kette
    widget: gates
    prompt: Two gates in a row. Make the lamp light up.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NOT, in: [B] }
        - { id: g, type: AND, in: [A, n] }
      outputs: [{ id: Q, from: g, label: Lamp }]
      goal: { Q: 1 }
    hints:
      - Follow the path of B. What does the NOT make of it?
    explanation: A must be on, B off. The NOT turns B = 0 into a 1.

  - kind: explain
    id: s2
    body: |
      **XOR** means “either or”. It gives 1 when **exactly one** of the inputs is 1.
      If both are on, the lamp stays off.

  - kind: problem
    id: xor
    widget: gates
    prompt: Choose the gate that lights up when exactly one switch is on.
    params:
      inputs: [{ id: A }, { id: B }]
      gates: [{ id: g, type: "?", in: [A, B], options: [AND, OR, XOR] }]
      outputs: [{ id: Q, from: g, label: Lamp }]
    check: { predicate: "table('Q') == [0, 1, 1, 0]" }
    hints:
      - What should happen when both are on?
    explanation: XOR – with 1 and 1 it stays off, unlike OR.

  - kind: problem
    id: treppe
    widget: choice
    prompt: In a stairwell, each of two switches toggles the light. Which gate describes that?
    params:
      options:
        - { label: XOR, correct: true }
        - { label: OR, feedback: "With OR, the light would stay on if you flipped the second switch too." }
        - { label: AND, feedback: "Then you would always need both switches." }
    hints:
      - What happens when both switches are flipped?
    explanation: Every change flips the result – that is XOR.

  - kind: problem
    id: nand
    widget: gates
    prompt: The lamp should always light up – except when both switches are on. Choose the first gate.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: g, type: "?", in: [A, B], options: [OR, AND] }
        - { id: n, type: NOT, in: [g] }
      outputs: [{ id: Q, from: n, label: Lamp }]
    check: { predicate: "table('Q') == [1, 1, 1, 0]" }
    hints:
      - The NOT flips everything at the end. What must come before it?
    explanation: AND with a NOT after it – that is called NAND.

  - kind: explain
    id: s6
    body: You can build any computer from a single type of gate. Which one is it?
    reveal:
      body: NAND. You can assemble AND, OR and NOT from NAND gates – and with them, everything else.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which expression is the same as “NOT (A AND B)”?
    params:
      options:
        - label: (NOT A) OR (NOT B)
          correct: true
        - label: (NOT A) AND (NOT B)
          feedback: That would be “neither” – stricter than “not both”.
        - label: A OR B
          feedback: For A = B = 1 that would be 1, but the original 0.
    hints:
      - "“Not both on” means: at least one is off."
    explanation: "**De Morgan’s law**: negation turns AND into OR – and vice versa."
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: gates
    prompt: "Majority vote: the lamp should light up when at least two of three switches are on. Pick the first three gates."
    params:
      inputs:
        - id: A
        - id: B
        - id: C
      gates:
        - id: g1
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
        - id: g2
          type: "?"
          in:
            - A
            - C
          options:
            - AND
            - OR
        - id: g3
          type: "?"
          in:
            - B
            - C
          options:
            - AND
            - OR
        - id: g4
          type: OR
          in:
            - g1
            - g2
            - g3
      outputs:
        - id: Q
          from: g4
    check:
      predicate: table('Q') == [0, 0, 0, 1, 0, 1, 1, 1]
    hints:
      - Each of the three gates checks one pair of switches.
      - A pair counts only if both are on.
    explanation: "(A AND B) OR (A AND C) OR (B AND C): as soon as any pair is on, two have agreed."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: How many of the 16 rows of A XOR B XOR C XOR D give 1?
    answer:
      value: 8
    hints:
      - An XOR chain is 1 when an odd number of inputs are on.
      - Exactly half of all rows have an odd number of ones.
    explanation: Flipping A flips the result. So the rows come in pairs of 0 and 1 – 8 out of 16.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Which simpler expression equals A OR (A AND B)?
    params:
      options:
        - label: A
          correct: true
        - label: A AND B
          feedback: At A = 1, B = 0 the expression is 1, but A AND B is 0.
        - label: B
          feedback: At A = 1, B = 0 the expression is 1, but B is 0.
    hints:
      - Try all four rows.
      - If A = 1, everything is 1. If A = 0, A AND B is 0 too.
    explanation: This is the absorption law. Rules like this save gates, power and space in chips.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "XOR has a special property: (A XOR B) XOR B = ?"
    params:
      options:
        - label: A – the same XOR twice cancels out
          correct: true
        - label: B
          feedback: "Try A = 1, B = 0: the result is 1, i.e. A."
        - label: Always 0
          feedback: For A = 1 the result is 1.
    hints:
      - Try all four combinations.
    explanation: "That is why XOR is used for encryption: apply the key to encrypt, the same key again to decrypt."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: "XOR swap: a = 6 (110), b = 3 (011). The first step computes a = a XOR b. What is a afterwards?"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 9
        misconception: xor-as-add
        text: "XOR is not addition: 1 XOR 1 gives 0, with no carry."
    hints:
      - "Compare digit by digit: equal gives 0, different gives 1."
      - 110 XOR 011 = 101.
    explanation: a = 101 = 5. Then b = a XOR b = 101 XOR 011 = 110 = 6 and a = 101 XOR 110 = 011 = 3. Swapped – without a helper variable.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Can you build a NOT from AND and OR gates alone, without any NOT?
    params:
      options:
        - label: No – with all inputs at 0 they always output 0
          correct: true
        - label: Yes, with enough gates
          feedback: "However many: AND and OR never turn 0 into 1."
        - label: Yes, with an XOR
          feedback: XOR is not AND or OR.
    hints:
      - What does AND(0, 0) give? And OR(0, 0)?
      - NOT must turn 0 into 1.
    explanation: "AND and OR are monotone: more ones at the input never produce fewer ones at the output. NOT is not monotone – so it is needed on its own."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how the stairway light with two switches works.
    params:
      keywords:
        - - xor
          - entweder
          - either
          - genau einer
          - exactly one
        - - umschalt
          - wechsel
          - toggle
          - flip
          - ändert
          - change
        - - beide
          - zwei schalter
          - two switches
          - both
      sample: "The light is an XOR of both switches: it is on when exactly one is up. Whichever switch you flip, the result changes every time. If both are the same, it is off."
    difficulty: 3

srs:
  cards_from: [xor, treppe]
