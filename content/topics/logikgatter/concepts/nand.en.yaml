id: cs.gates.nand
type: concept
title: One gate for everything
summary: With NAND, you can build any chip.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many transistors are in the chip of a current phone?"
    params:
      min: 1000
      max: 1000000000000
      scale: log
    answer:
      value: 15000000000
      within: 85
    explanation: Over 15 billion. And almost all of it could be built from a single kind of gate.


  - kind: explain
    id: s1
    body: |
      **NAND** means “not and”. It outputs 0 only when both inputs are 1. The special thing – from NAND alone, you can build every other gate.

  - kind: problem
    id: nicht
    widget: gates
    prompt: Build a NOT. Both inputs are connected to A.
    params:
      inputs: [{ id: A }]
      gates:
        - { id: g, type: "?", in: [A, A], options: [AND, OR, NAND] }
      outputs: [{ id: Q, from: g }]
    check: { predicate: "table('Q') == [1, 0]" }
    hints:
      - Which gate turns 1 and 1 into a 0?
    explanation: NAND(A, A) is 0 exactly when A = 1 – so NOT A.

  - kind: problem
    id: und
    widget: gates
    prompt: Build an AND from two gates. The first is already a NAND.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NAND, in: [A, B] }
        - { id: g, type: "?", in: [n, n], options: [AND, OR, NAND] }
      outputs: [{ id: Q, from: g }]
    check: { predicate: "table('Q') == [0, 0, 0, 1]" }
    hints:
      - AND is “not NAND”. How do you build a NOT?
    explanation: The second NAND reverses the first – together they make an AND.

  - kind: problem
    id: oder
    widget: gates
    prompt: Now OR. Choose the first two gates.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: x, type: "?", in: [A, A], options: [AND, NAND] }
        - { id: y, type: "?", in: [B, B], options: [AND, NAND] }
        - { id: g, type: NAND, in: [x, y] }
      outputs: [{ id: Q, from: g }]
    check: { predicate: "table('Q') == [0, 1, 1, 1]" }
    hints:
      - First invert both inputs.
    explanation: NAND of “not A” and “not B” is “A or B” – De Morgan in hardware.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An AND made of NAND gates needs 2 gates, an OR needs 3. How many NAND gates does an XOR need at least?
    answer:
      value: 4
    hints:
      - It works with one shared first NAND that is reused twice.
    explanation: Four. Chip designers save gates wherever they can – each costs space and power.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Two NAND gates are cross-connected: the output of one is an input of the other. What results?"
    params:
      options:
        - label: A memory for one bit – the circuit remembers its state
          correct: true
        - label: A short circuit
          feedback: The circuit is stable and has two possible states.
        - label: A faster NAND
          feedback: "Something entirely new arises: memory."
    hints:
      - Through the feedback the output depends on the past.
    explanation: A **flip-flop**. Feedback turns gates without memory into storage – the second basic building block of every computer.
    difficulty: 3

srs:
  cards_from: [nicht, oder]
