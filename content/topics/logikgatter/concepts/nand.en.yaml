id: cs.gates.nand
type: concept
title: One gate for everything
summary: With NAND, you can build any chip.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many transistors are in the chip of a current phone?"
    params:
      min: 1000
      max: 1000000000000
      scale: log
    answer:
      value: 15000000000
      within: 85
    explanation: Over 15 billion. And almost all of it could be built from a single kind of gate.

  - kind: explain
    id: s1
    body: |
      **NAND** means “not and”. It outputs 0 only when both inputs are 1. The special thing – from NAND alone, you can build every other gate.

  - kind: problem
    id: nicht
    widget: gates
    prompt: Build a NOT. Both inputs are connected to A.
    params:
      inputs: [{ id: A }]
      gates:
        - { id: g, type: "?", in: [A, A], options: [AND, OR, NAND] }
      outputs: [{ id: Q, from: g }]
    check: { predicate: "table('Q') == [1, 0]" }
    hints:
      - Which gate turns 1 and 1 into a 0?
    explanation: NAND(A, A) is 0 exactly when A = 1 – so NOT A.

  - kind: problem
    id: und
    widget: gates
    prompt: Build an AND from two gates. The first is already a NAND.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NAND, in: [A, B] }
        - { id: g, type: "?", in: [n, n], options: [AND, OR, NAND] }
      outputs: [{ id: Q, from: g }]
    check: { predicate: "table('Q') == [0, 0, 0, 1]" }
    hints:
      - AND is “not NAND”. How do you build a NOT?
    explanation: The second NAND reverses the first – together they make an AND.

  - kind: problem
    id: oder
    widget: gates
    prompt: Now OR. Choose the first two gates.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: x, type: "?", in: [A, A], options: [AND, NAND] }
        - { id: y, type: "?", in: [B, B], options: [AND, NAND] }
        - { id: g, type: NAND, in: [x, y] }
      outputs: [{ id: Q, from: g }]
    check: { predicate: "table('Q') == [0, 1, 1, 1]" }
    hints:
      - First invert both inputs.
    explanation: NAND of “not A” and “not B” is “A or B” – De Morgan in hardware.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An AND made of NAND gates needs 2 gates, an OR needs 3. How many NAND gates does an XOR need at least?
    answer:
      value: 4
    hints:
      - It works with one shared first NAND that is reused twice.
    explanation: Four. Chip designers save gates wherever they can – each costs space and power.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: gates
    prompt: An XOR from four NAND gates. One gate is still open – pick it.
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: n1
          type: NAND
          in:
            - A
            - B
        - id: n2
          type: "?"
          in:
            - A
            - n1
          options:
            - AND
            - OR
            - NAND
        - id: n3
          type: NAND
          in:
            - B
            - n1
        - id: n4
          type: NAND
          in:
            - n2
            - n3
      outputs:
        - id: Q
          from: n4
    check:
      predicate: table('Q') == [0, 1, 1, 0]
    hints:
      - "The plan is symmetric: what does the gate on the B side do?"
      - "Test A = 1, B = 0: the lamp must light up."
    explanation: All four are NAND. The design is symmetric and needs no other gate type.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: An OR needs 3 NAND gates. How many does a NOR need at least?
    answer:
      value: 4
    hints:
      - NOR is NOT of OR.
      - A NOT made of NAND costs one gate.
    explanation: "3 for the OR plus 1 for the NOT: 4 NAND gates."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Why do chipmakers like to build everything from a single gate type?
    params:
      options:
        - label: One building block can be made identically billions of times and optimised
          correct: true
        - label: Because other gates are forbidden
          feedback: Everything is allowed – it is about manufacturing.
        - label: Because NAND computes faster than AND
          feedback: In CMOS NAND is even simpler than AND – AND is a NAND plus a NOT.
    hints:
      - Think of Lego with only one kind of brick.
      - Fewer kinds means simpler factories.
    explanation: In CMOS a NAND needs only 4 transistors. A uniform building block simplifies design, testing and manufacturing.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Two NAND gates are cross-connected: the output of one is an input of the other. What results?"
    params:
      options:
        - label: A memory for one bit – the circuit remembers its state
          correct: true
        - label: A short circuit
          feedback: The circuit is stable and has two possible states.
        - label: A faster NAND
          feedback: "Something entirely new arises: memory."
    hints:
      - Through the feedback the output depends on the past.
    explanation: A **flip-flop**. Feedback turns gates without memory into storage – the second basic building block of every computer.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: A set of gates is **functionally complete** if it can build every truth table. NAND alone is enough, and so is NOR. AND with OR is not – the NOT is missing.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: "{NOR} is functionally complete."
          right: true
          why: NOR with itself gives NOT, and everything follows.
        - text: "{AND, OR} is functionally complete."
          right: false
          why: Without NOT, all zeros never give a 1.
        - text: "{AND, NOT} is functionally complete."
          right: true
          why: From these you build NAND – and NAND suffices.
        - text: "{XOR} is functionally complete."
          right: false
          why: XOR turns all zeros into 0 – no NOT that way.
        - text: "{OR, NOT} is functionally complete."
          right: true
          why: NOT of OR is NOR.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: In CMOS a NAND gate has 4 transistors. How many transistors does an XOR built from 4 NANDs need?
    answer:
      value: 16
    hints:
      - Each gate has 4 transistors.
      - 4 · 4.
    explanation: 4 · 4 = 16. Clever circuits do XOR with fewer – chip design is the art of finding such shortcuts.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why a single gate type is enough for a whole computer.
    params:
      keywords:
        - - nand
        - - nicht
          - not
          - und
          - and
          - oder
          - or
        - - jede
          - alle
          - every
          - any
          - all
      sample: From NAND you can build NOT, AND and OR. With these three you can assemble every truth table – so any circuit, from adders to memory.
    difficulty: 3

srs:
  cards_from: [nicht, oder]
