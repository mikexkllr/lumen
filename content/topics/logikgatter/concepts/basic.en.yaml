id: cs.gates.basic
type: concept
title: AND, OR, NOT
summary: Three building blocks for every decision.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: problem
    id: und
    widget: gates
    prompt: The lamp is connected to an AND gate. Make it light up.
    params:
      inputs: [{ id: A }, { id: B }]
      gates: [{ id: g, type: AND, in: [A, B] }]
      outputs: [{ id: Q, from: g, label: Lamp }]
      goal: { Q: 1 }
    hints:
      - One switch alone is not enough.
    explanation: AND gives 1 only when both inputs are 1.

  - kind: explain
    id: s2
    body: |
      **AND** gives 1 when both inputs are 1. **OR** gives 1 as soon as one is 1. **NOT** flips the value.
      Try out the OR gate.
    visual:
      widget: gates
      interactive: true
      params:
        inputs: [{ id: A }, { id: B }]
        gates: [{ id: g, type: OR, in: [A, B] }]
        outputs: [{ id: Q, from: g, label: Lamp }]

  - kind: problem
    id: nicht
    widget: gates
    prompt: This one has a NOT gate. How must the switch be set so the lamp lights up?
    params:
      inputs: [{ id: A, value: 1 }]
      gates: [{ id: n, type: NOT, in: [A] }]
      outputs: [{ id: Q, from: n, label: Lamp }]
      goal: { Q: 1 }
    hints:
      - NOT turns a 1 into a 0 and a 0 into a 1.
    explanation: The switch must be off. NOT turns that into a 1.

  - kind: problem
    id: welches
    widget: gates
    prompt: A is on, B is off. Which gate makes the lamp light up? Tap it.
    params:
      inputs: [{ id: A, value: 1, fixed: true }, { id: B, value: 0, fixed: true }]
      gates: [{ id: g, type: "?", in: [A, B], options: [AND, OR] }]
      outputs: [{ id: Q, from: g, label: Lamp }]
      goal: { Q: 1 }
    hints:
      - Is one input with 1 enough?
    explanation: For OR, one input with 1 is enough. AND would need both.

  - kind: problem
    id: alarm
    widget: choice
    prompt: An alarm should go off when the door is open or the window is. Which gate fits?
    params:
      options:
        - { label: OR, correct: true }
        - { label: AND, feedback: "Then the door and window would both have to be open at once." }
        - { label: NOT, feedback: "NOT has only one input and flips it." }
    hints:
      - Is one of the two already enough?
    explanation: A single open spot should be enough – that is OR.

  - kind: problem
    id: tabelle
    widget: gates
    prompt: Choose the gate that lights up only when both switches are on.
    body: It is checked for all four switch positions.
    params:
      inputs: [{ id: A }, { id: B }]
      gates: [{ id: g, type: "?", in: [A, B], options: [OR, AND] }]
      outputs: [{ id: Q, from: g, label: Lamp }]
    check: { predicate: "table('Q') == [0, 0, 0, 1]" }
    hints:
      - Try the switches and watch the lamp.
    explanation: That is AND. It gives a 1 only for 1 and 1.

  - kind: problem
    id: c1
    widget: match
    prompt: Which gate fits the rule?
    params:
      pairs:
        - left: 1 only if both are 1
          right: AND
        - left: 1 if at least one is 1
          right: OR
        - left: flips 0 and 1
          right: NOT
    hints:
      - Think of switches in series and in parallel.
    explanation: Every logical rule can be built from these three blocks.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A gate has 3 inputs. How many rows does its truth table have?
    answer:
      value: 8
    hints:
      - Each input can be 0 or 1.
    explanation: 2³ = 8. With every additional input the table doubles.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: gates
    prompt: Pick the gate that lights up only when both switches are off.
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: g
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
            - NAND
            - NOR
      outputs:
        - id: Q
          from: g
    check:
      predicate: table('Q') == [1, 0, 0, 0]
    hints:
      - Try each gate with both switches off.
      - It is the opposite of OR.
    explanation: "NOR means »not or«: it lights up only when neither input is on."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: gates
    prompt: Q = (A AND B) OR C. Switch C is stuck at 0. Make the lamp light up anyway.
    params:
      inputs:
        - id: A
        - id: B
        - id: C
          value: 0
          fixed: true
      gates:
        - id: g1
          type: AND
          in:
            - A
            - B
        - id: g2
          type: OR
          in:
            - g1
            - C
      outputs:
        - id: Q
          from: g2
      goal:
        Q: 1
    hints:
      - If C is off, the other input of the OR must be on.
      - The AND needs both switches.
    explanation: A = 1 and B = 1 make the AND 1 – and so the OR as well.
    difficulty: 2

  - kind: explain
    id: cs-d3
    depth: 2
    body: A **truth table** lists every combination of inputs with the result. With n inputs it has $2^n$ rows. It describes a circuit completely.

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: Q = (A AND B) OR C. In how many of the 8 rows of the truth table is Q on?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 4
        misconception: missed-case
        text: Those are just the rows with C = 1. One more comes in.
    hints:
      - If C = 1, Q is always on. In how many rows is C = 1?
      - If C = 0, it needs A = B = 1.
    explanation: 4 rows with C = 1, plus the row A = 1, B = 1, C = 0. Together 5.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: How many **different** gates with two inputs can there possibly be?
    answer:
      value: 16
    hints:
      - The table has 4 rows, and each holds 0 or 1.
    explanation: 2⁴ = 16. AND, OR, XOR, NAND are just four of them.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: gates
    prompt: "Build a NOR from two gates: the lamp lights only when both switches are off. Pick the first gate."
    params:
      inputs:
        - id: A
        - id: B
      gates:
        - id: g1
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
            - XOR
        - id: g2
          type: NOT
          in:
            - g1
      outputs:
        - id: Q
          from: g2
    check:
      predicate: table('Q') == [1, 0, 0, 0]
    hints:
      - The NOT flips the result of the first gate.
      - Which gate is off only at 0, 0?
    explanation: NOT (A OR B) is NOR. By De Morgan this equals (NOT A) AND (NOT B).
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: How many different gates with 3 inputs can there be – that is, different truth tables?
    answer:
      value: 256
    feedback:
      - when: numval(state.input) == 16
        misconception: two-inputs
        text: That is for 2 inputs. With 3 inputs the table has 8 rows.
      - when: numval(state.input) == 8
        misconception: rows-vs-tables
        text: Those are the rows. Each row can give 0 or 1.
    hints:
      - The table has 8 rows. Each holds 0 or 1.
      - $2^8$.
    explanation: "8 rows, 2 options each: $2^8$ = 256. In general there are $2^{2^n}$ gates with n inputs."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what AND, OR and NOT do – with an everyday example.
    params:
      keywords:
        - - beide
          - both
          - alle
          - all
        - - einer
          - mindestens
          - either
          - at least
          - one of
        - - umdreh
          - gegenteil
          - invert
          - opposite
          - flip
      sample: AND is on only if both inputs are on – like a car that starts only with the key and a foot on the brake. OR is on as soon as at least one is on – like a bell with two buttons. NOT flips the value to its opposite.
    difficulty: 3

srs:
  cards_from: [welches, alarm]
