id: cs.gates.combine
type: concept
title: Gatter kombinieren
summary: XOR, NAND und das Treppenhaus-Licht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: problem
    id: kette
    widget: gates
    prompt: Zwei Gatter hintereinander. Bring die Lampe zum Leuchten.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: n, type: NOT, in: [B] }
        - { id: g, type: AND, in: [A, n] }
      outputs: [{ id: Q, from: g, label: Lampe }]
      goal: { Q: 1 }
    hints:
      - Verfolge den Weg von B. Was macht das NICHT daraus?
    explanation: A muss an sein, B aus. Das NICHT macht aus B = 0 eine 1.

  - kind: explain
    id: s2
    body: |
      **XOR** heißt »entweder oder«. Es gibt 1, wenn **genau einer** der Eingänge 1 ist.
      Sind beide an, bleibt die Lampe aus.

  - kind: problem
    id: xor
    widget: gates
    prompt: Wähle das Gatter, das leuchtet, wenn genau ein Schalter an ist.
    params:
      inputs: [{ id: A }, { id: B }]
      gates: [{ id: g, type: "?", in: [A, B], options: [AND, OR, XOR] }]
      outputs: [{ id: Q, from: g, label: Lampe }]
    check: { predicate: "table('Q') == [0, 1, 1, 0]" }
    hints:
      - Was soll passieren, wenn beide an sind?
    explanation: XOR – bei 1 und 1 bleibt es aus, anders als bei ODER.

  - kind: problem
    id: treppe
    widget: choice
    prompt: Im Treppenhaus schaltet jeder der zwei Schalter das Licht um. Welches Gatter beschreibt das?
    params:
      options:
        - { label: XOR, correct: true }
        - { label: ODER, feedback: "Bei ODER bliebe das Licht an, wenn man den zweiten Schalter auch drückt." }
        - { label: UND, feedback: "Dann bräuchte es immer beide Schalter." }
    hints:
      - Was passiert, wenn beide Schalter umgelegt sind?
    explanation: Jeder Wechsel kippt das Ergebnis – das ist XOR.

  - kind: problem
    id: nand
    widget: gates
    prompt: Die Lampe soll immer leuchten – außer wenn beide Schalter an sind. Wähle das erste Gatter.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: g, type: "?", in: [A, B], options: [OR, AND] }
        - { id: n, type: NOT, in: [g] }
      outputs: [{ id: Q, from: n, label: Lampe }]
    check: { predicate: "table('Q') == [1, 1, 1, 0]" }
    hints:
      - Das NICHT dreht am Ende alles um. Was muss davor stehen?
    explanation: UND mit NICHT dahinter – das heißt NAND.

  - kind: explain
    id: s6
    body: Mit einem einzigen Gatter-Typ lässt sich jeder Computer bauen. Welcher ist es?
    reveal:
      body: NAND. Aus NAND-Gattern lassen sich UND, ODER und NICHT zusammensetzen – und damit alles andere.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Welcher Ausdruck ist dasselbe wie »NICHT (A UND B)«?
    params:
      options:
        - label: (NICHT A) ODER (NICHT B)
          correct: true
        - label: (NICHT A) UND (NICHT B)
          feedback: Das wäre »keiner von beiden« – strenger als »nicht beide«.
        - label: A ODER B
          feedback: Bei A = B = 1 wäre das 1, das Original aber 0.
    hints:
      - "»Nicht beide an« heißt: mindestens einer ist aus."
    explanation: "Das **De-Morgan-Gesetz**: Beim Verneinen wird aus UND ein ODER – und umgekehrt."
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: gates
    prompt: "Mehrheitsentscheid: Die Lampe soll leuchten, wenn mindestens zwei von drei Schaltern an sind. Wähle die ersten drei Gatter."
    params:
      inputs:
        - id: A
        - id: B
        - id: C
      gates:
        - id: g1
          type: "?"
          in:
            - A
            - B
          options:
            - AND
            - OR
        - id: g2
          type: "?"
          in:
            - A
            - C
          options:
            - AND
            - OR
        - id: g3
          type: "?"
          in:
            - B
            - C
          options:
            - AND
            - OR
        - id: g4
          type: OR
          in:
            - g1
            - g2
            - g3
      outputs:
        - id: Q
          from: g4
    check:
      predicate: table('Q') == [0, 0, 0, 1, 0, 1, 1, 1]
    hints:
      - Jedes der drei Gatter prüft ein Paar von Schaltern.
      - Ein Paar zählt nur, wenn beide an sind.
    explanation: "(A UND B) ODER (A UND C) ODER (B UND C): Sobald irgendein Paar an ist, haben zwei zugestimmt."
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Wie viele der 16 Zeilen von A XOR B XOR C XOR D ergeben 1?
    answer:
      value: 8
    hints:
      - Eine XOR-Kette ist 1, wenn ungerade viele Eingänge an sind.
      - Genau die Hälfte aller Zeilen hat eine ungerade Zahl von Einsen.
    explanation: Drehst du A um, kippt das Ergebnis. So bilden die Zeilen Paare mit 0 und 1 – also 8 von 16.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Welcher einfachere Ausdruck ist dasselbe wie A ODER (A UND B)?
    params:
      options:
        - label: A
          correct: true
        - label: A UND B
          feedback: Bei A = 1, B = 0 ist der Ausdruck 1, A UND B aber 0.
        - label: B
          feedback: Bei A = 1, B = 0 ist der Ausdruck 1, B aber 0.
    hints:
      - Probier alle vier Zeilen aus.
      - Ist A = 1, ist alles 1. Ist A = 0, ist auch A UND B gleich 0.
    explanation: Das ist die Absorptionsregel. Mit solchen Regeln spart man in Chips Gatter, Strom und Platz.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "XOR hat eine besondere Eigenschaft: (A XOR B) XOR B = ?"
    params:
      options:
        - label: A – zweimal dasselbe XOR hebt sich auf
          correct: true
        - label: B
          feedback: "Probier A = 1, B = 0: Es kommt 1 heraus, also A."
        - label: Immer 0
          feedback: Bei A = 1 ist das Ergebnis 1.
    hints:
      - Probier alle vier Kombinationen.
    explanation: "Darum verschlüsselt man mit XOR: Schlüssel drauf zum Verschlüsseln, derselbe Schlüssel nochmal zum Entschlüsseln."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: "XOR-Tausch: a = 6 (110), b = 3 (011). Der erste Schritt rechnet a = a XOR b. Welchen Wert hat a danach?"
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 9
        misconception: xor-as-add
        text: "XOR ist keine Addition: 1 XOR 1 ergibt 0, ohne Übertrag."
    hints:
      - "Vergleiche Stelle für Stelle: gleich gibt 0, verschieden gibt 1."
      - 110 XOR 011 = 101.
    explanation: a = 101 = 5. Dann b = a XOR b = 101 XOR 011 = 110 = 6 und a = 101 XOR 110 = 011 = 3. Getauscht – ganz ohne Hilfsvariable.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Kann man aus UND- und ODER-Gattern allein, ganz ohne NICHT, ein NICHT bauen?
    params:
      options:
        - label: Nein – bei lauter Nullen am Eingang geben sie immer 0 aus
          correct: true
        - label: Ja, mit genug Gattern
          feedback: "Egal wie viele: Aus 0 machen UND und ODER nie eine 1."
        - label: Ja, mit einem XOR
          feedback: XOR ist kein UND oder ODER.
    hints:
      - Was gibt UND(0, 0)? Was gibt ODER(0, 0)?
      - NICHT muss aus 0 eine 1 machen.
    explanation: "UND und ODER sind monoton: Mehr Einsen am Eingang erzeugen nie weniger Einsen am Ausgang. NICHT ist nicht monoton – darum braucht man es extra."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie das Licht im Treppenhaus mit zwei Schaltern funktioniert.
    params:
      keywords:
        - - xor
          - entweder
          - either
          - genau einer
          - exactly one
        - - umschalt
          - wechsel
          - toggle
          - flip
          - ändert
          - change
        - - beide
          - zwei schalter
          - two switches
          - both
      sample: "Das Licht ist ein XOR der beiden Schalter: Es brennt, wenn genau einer oben ist. Egal, welcher Schalter umgelegt wird – das Ergebnis wechselt jedes Mal. Sind beide gleich, ist es aus."
    difficulty: 3

srs:
  cards_from: [xor, treppe]
