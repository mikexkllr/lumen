id: ee.networks.internal
type: concept
title: "Internal resistance"
summary: "Why real batteries sag under load – and when they deliver the most power."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: When the battery sags
    body: An old battery shows full voltage with no load and still fails. The curve shows its voltage as the current rises. Drag the **internal resistance** and see how far it sags.
    visual:
      widget: slider
      interactive: true
      params:
        expr: 12.6 - r*x/1000
        x:
          - 0
          - 200
        y:
          - 0
          - 14
        showCoordinates: false
        sliders:
          - id: r
            label: Internal resistance in mΩ
            min: 5
            max: 40
            step: 5
            initial: 10

  - kind: problem
    id: hook
    widget: choice
    prompt: You start a car with the headlights on. The lights dim for a moment. Why?
    params:
      options:
        - label: The starter draws so much current that the battery voltage drops
          correct: true
        - label: The engine steals current from the lamps
          feedback: Lamps and starter are in parallel. It is about the battery voltage.
        - label: The lamps are broken
          feedback: Afterwards they shine normally again.
    hints:
      - The starter draws about 150 A.
      - The battery itself contains a small resistance.
    explanation: At 150 A, the resistance inside the battery quickly drops 1 to 2 V. Less is left for the lamps.

  - kind: explain
    id: c1
    body: Every real source has an **internal resistance** Rᵢ. When current I flows, voltage drops across it. What remains outside is the terminal voltage U = U₀ − I × Rᵢ. U₀ is the no-load voltage without current.

  - kind: problem
    id: c2
    widget: numeric
    prompt: A car battery has U₀ = 12.6 V and Rᵢ = {{r}} Ω. The starter draws {{i}} A. What is the terminal voltage?
    params:
      unit: V
    answer:
      value: "{{12.6 - i * r}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - i * r) < 0.01
        misconception: drop-only
        text: That is the internal drop. Subtract it from 12.6 V.
    hints:
      - "Internal drop: I × Rᵢ = {{i}} × {{r}}."
      - U = 12.6 V − {{i * r}} V.
    explanation: 12.6 − {{i * r}} = {{12.6 - i * r}} V. If it drops below about 9.6 V, the battery counts as weak.
    variants:
      params:
        r: choice[0.005,0.01,0.02]
        i: choice[100,150,200]
      defaults:
        r: 0.01
        i: 200

  - kind: problem
    id: c3
    widget: numeric
    prompt: A cell reads {{u0}} V without load. With a {{i}} A load you measure {{u0 - d}} V. What is its internal resistance?
    params:
      unit: Ω
    answer:
      value: "{{d / i}}"
      tolerance: 0.001
    hints:
      - How much voltage is missing under load?
      - Rᵢ = missing voltage ÷ current.
    explanation: "{{d}} V ÷ {{i}} A = {{d / i}} Ω. This is how a battery tester checks cells."
    variants:
      params:
        u0: choice[1.5,3.7]
        d: choice[0.1,0.2,0.3]
        i: choice[0.5,1,2]
      defaults:
        u0: 1.5
        d: 0.2
        i: 2

  - kind: problem
    id: c4
    widget: sim
    prompt: "Battery model: the source is U₀ = 12 V, R₁ = 4 kΩ is the internal resistance, R₂ the device. Which device makes the terminal voltage drop to half?"
    params:
      scene: divider
      controls:
        voltage:
          fixed: true
        r1:
          fixed: true
          value: 4
        r2:
          value: 20
      show:
        - out
        - current
    answer:
      out: 6
    explanation: At R₂ = Rᵢ = 4 kΩ the voltage splits half and half. That is exactly where the source delivers the most power.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: At 150 A the battery should still hold 11.1 V. Set the internal resistance so that the curve passes through the dot.
    params:
      expr: 12.6 - r*x/1000
      x:
        - 0
        - 200
      y:
        - 6
        - 13
      showCoordinates: false
      sliders:
        - id: r
          label: Internal resistance in mΩ
          min: 5
          max: 40
          step: 5
          initial: 25
      markers:
        - x: 150
          y: 11.1
          group: a
    answer:
      values:
        r: 10
    hints:
      - U = U₀ − I × Rᵢ. 12.6 V − 11.1 V = 1.5 V are missing.
      - Rᵢ = 1.5 V ÷ 150 A.
    explanation: 1.5 V ÷ 150 A = 0.01 Ω = 10 mΩ. Even this little internal resistance costs 1.5 V when starting.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The short-circuit current is I = U₀ ÷ Rᵢ. How large is it for a car battery with 12.6 V and 0.01 Ω?
    params:
      unit: A
    answer:
      value: 1260
    hints:
      - There is no outside resistance any more.
      - 12.6 ÷ 0.01.
    explanation: 1260 A! A spanner across the terminals glows and melts. That is why you connect plus first and disconnect minus first.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A source has U₀ = 9 V and Rᵢ = 3 Ω. How much power does a 3 Ω device receive?
    params:
      unit: W
    answer:
      value: 6.75
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 27
        misconception: ignore-ri
        text: That would be without internal resistance. The current is 9 V ÷ 6 Ω.
    hints:
      - "Current: 9 V ÷ (3 + 3) Ω = 1.5 A."
      - P = I² × R = 1.5² × 3.
    explanation: 2.25 × 3 = 6.75 W. Another 6.75 W heat the source. The efficiency is only 50 %.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: slider
    prompt: The curve shows the power in the device versus its resistance x at 9 V. Set the internal resistance r so that the peak sits on the dot.
    params:
      expr: 81*x/(r+x)^2
      x:
        - 0
        - 10
      y:
        - 0
        - 12
      showCoordinates: false
      sliders:
        - id: r
          label: Rᵢ in Ω
          min: 0.5
          max: 5
          step: 0.5
          initial: 4
      markers:
        - x: 2
          y: 10.125
          group: a
    check:
      predicate: r == 2
    hints:
      - The dot is at x = 2 Ω.
      - The peak is always where the device equals Rᵢ.
    explanation: "With r = 2 Ω the peak is at x = 2 Ω: P = 81 ÷ 8 ≈ 10.1 W. This is called impedance matching."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: With matched load, half the energy is lost in the source. Where is it used anyway?
    params:
      options:
        - label: In antennas and signal lines, where every microwatt counts
          correct: true
        - label: In power plants, for maximum power
          feedback: There efficiency counts. Grids run far from matched load.
        - label: When charging batteries
          feedback: There you want as little loss as possible.
    hints:
      - Where is the signal tiny and the energy cheap?
      - Think of radio and 50 Ω cables.
    explanation: "In power engineering you want high efficiency: the load is much larger than Rᵢ. In radio the transferred power matters, so you match, for example to 50 Ω."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A device R hangs on a source with Rᵢ. The efficiency is η = R ÷ (R + Rᵢ). What percentage is it for R = {{k}} × Rᵢ? To one decimal place.
    params:
      unit: "%"
    answer:
      value: "{{round(100 * k / (k + 1), 1)}}"
      tolerance: 0.05
    hints:
      - "Insert R = {{k}} Rᵢ: η = {{k}} ÷ ({{k}} + 1)."
      - Multiply by 100 for percent.
    explanation: "{{k}} ÷ {{k + 1}} ≈ {{round(100 * k / (k + 1), 1)}} %. Large load, small current, little loss – but also less power."
    difficulty: 3
    variants:
      params:
        k: choice[1,3,9,19,99]
      defaults:
        k: 9

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why a battery delivers less voltage under load.
    params:
      keywords:
        - - innenwiderstand
          - internal resistance
          - innen
          - inside
        - - strom
          - current
        - - spannung
          - voltage
          - abfall
          - drop
          - fällt
          - faellt
        - - last
          - load
          - verbraucher
          - device
      sample: "Inside the battery is a small internal resistance. When a device draws current, voltage drops across it: I times Rᵢ. That voltage is then missing at the terminals. The more current, the bigger the loss."
    explanation: "The core: U = U₀ − I × Rᵢ. The internal resistance also limits the short-circuit current."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
