id: logic.gametheory.nim
type: concept
title: Schlag den Computer
summary: Nim – das Spiel mit der geheimen Formel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Steine gegen Silizium
    body: Schon 1951 spielte ein Computer namens Nimrod dieses Spiel vor staunendem Publikum. Nimm aus einer Reihe beliebig viele Steine. Wer den letzten nimmt, gewinnt. Hinter jedem Sieg steckt eine **Formel**.
    visual:
      widget: nim
      interactive: true
      params:
        piles:
          - 1
          - 3
          - 5

  - kind: problem
    id: warmup
    widget: nim
    prompt: Der Computer spielt perfekt. Kannst du trotzdem gewinnen?
    params: { piles: [5], maxTake: 3 }
    hints:
      - Lass dem Computer 4 Steine übrig.
    explanation: Wer vor 4 Steinen steht, verliert. Du nimmst 1 – danach ergänzt du immer auf 4.

  - kind: problem
    id: neun
    widget: nim
    prompt: Jetzt mit 9 Steinen. Gleiche Regeln.
    params: { piles: [9], maxTake: 3 }
    hints:
      - Lass dem Computer immer ein Vielfaches von 4 übrig.
    explanation: Nimm 1, dann bleiben 8. Danach ergänzt du jeden Zug des Computers auf 4.

  - kind: explain
    id: s3
    body: |
      Beim echten **Nim** gibt es mehrere Reihen. Man nimmt beliebig viele Steine – aber nur aus einer Reihe.
      Die Gewinnformel steckt im Zweiersystem.

  - kind: problem
    id: drei-reihen
    widget: nim
    prompt: Drei Reihen mit 3, 4 und 5 Steinen. Der Computer wartet. Viel Glück!
    params: { piles: [3, 4, 5] }
    hints:
      - Versuch, gleich große Reihen zu hinterlassen – dann kannst du jeden Zug spiegeln.
      - Ein guter erster Zug – nimm 2 aus der Reihe mit 3.
    explanation: Mit 1, 4, 5 übrig steht der Computer schlecht. Danach spiegelst du – aus zwei gleichen Reihen machst du immer wieder zwei gleiche.

  - kind: explain
    id: s5
    body: Was ist die geheime Formel?
    reveal:
      body: Schreib die Reihen binär und addiere jede Stelle ohne Übertrag. Ist das Ergebnis überall 0, verliert der, der am Zug ist. Das nennt man die **Nim-Summe**.

  - kind: problem
    id: spiegeln
    widget: choice
    prompt: Zwei Reihen mit je 6 Steinen, und der Computer ist dran. Wer gewinnt, wenn du klug spielst?
    params:
      options:
        - { label: Du, correct: true }
        - { label: Der Computer, feedback: "Bei zwei gleichen Reihen kannst du jeden Zug in der anderen Reihe nachmachen." }
    hints:
      - Mach jeden Zug des Computers in der anderen Reihe nach.
    explanation: Du spiegelst jeden Zug. So nimmst du am Ende den letzten Stein.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Nim mit einem Haufen: Man nimmt 1 bis 3 Steine, wer den letzten nimmt, gewinnt. Es liegen 9 da, du bist dran. Wie viele nimmst du?"
    answer:
      value: 1
    hints:
      - Lass ein Vielfaches von 4 übrig.
    explanation: 9 − 1 = 8. Danach ergänzt du jeden Zug des Computers auf 4.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: nim
    prompt: "Drei Reihen: 2, 4 und 7 Steine. Beliebig viele aus einer Reihe. Es gibt genau einen Gewinnzug – finde ihn!"
    params:
      piles:
        - 2
        - 4
        - 7
    hints:
      - "Binär: 010, 100, 111. Die Nim-Summe ist 001 = 1."
      - Welche Reihe wird kleiner, wenn du sie mit 1 XOR-st? Nur 7 XOR 1 = 6.
    explanation: Nimm 1 aus der Siebenerreihe. 2, 4 und 6 haben die Nim-Summe 0 – danach hältst du sie bei 0.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Drei Reihen: 3, 4 und 5 Steine. Binär: 011, 100, 101. Die Nim-Summe ist 010 = 2. Du musst sie auf 0 bringen. Wie viele Steine nimmst du aus der Reihe mit 3?"
    answer:
      value: 2
    hints:
      - Aus 011 muss 001 werden, damit jede Spalte gerade viele Einsen hat.
    explanation: "1, 4 und 5: 001, 100, 101 – jede Spalte hat zwei Einsen oder keine. Jetzt verliert der Gegner."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Bei einem Haufen, von dem man 1 bis 3 Steine nehmen darf, ist die **Grundy-Zahl** der Rest beim Teilen durch 4. Welche Grundy-Zahl hat ein solcher Haufen mit {{n}} Steinen?
    answer:
      value: "{{mod(n, 4)}}"
    hints:
      - Teile {{n}} durch 4.
      - Der Rest ist die Grundy-Zahl.
    explanation: "Grundy-Zahl {{mod(n, 4)}}: Der Haufen verhält sich wie ein Nim-Haufen dieser Größe. Spielt man mehrere Spiele zugleich, XOR-t man die Grundy-Zahlen – wie bei Nim."
    difficulty: 3
    variants:
      params:
        n: int[5,30]
      defaults:
        n: 6

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Was besagt der Satz von Sprague und Grundy?
    params:
      options:
        - label: Jedes faire Zugspiel ohne Zufall verhält sich wie ein einzelner Nim-Haufen.
          correct: true
        - label: Wer anfängt, gewinnt jedes Spiel.
          feedback: Nim mit zwei gleichen Reihen verliert der Erste.
        - label: Nur Nim lässt sich exakt lösen.
          feedback: "Im Gegenteil: Der Satz überträgt die Nim-Lösung auf viele andere Spiele."
    hints:
      - "»Fair« heißt hier: Beide Spieler haben in jeder Stellung dieselben Züge."
      - Jede Stellung bekommt eine Zahl – die Größe des passenden Nim-Haufens.
    explanation: Jede Stellung hat eine Grundy-Zahl. Bei 0 verliert, wer am Zug ist. Summen von Spielen behandelt man mit der Nim-Summe. So wird Nim zum **Baukasten** für ganze Spielfamilien.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was eine Verliererstellung ist und wie man sie bei Nim erkennt.
    params:
      keywords:
        - - jeder zug
          - jedem zug
          - egal
          - every move
          - whatever
        - - nim-summe
          - nimsumme
          - xor
          - nim-sum
          - nim sum
        - - "null"
          - zero
      sample: In einer Verliererstellung führt jeder Zug in eine Stellung, aus der der Gegner gewinnt. Bei Nim erkennt man sie daran, dass die Nim-Summe null ist.
    difficulty: 3

srs:
  cards_from: [spiegeln, warmup]
