id: logic.gametheory.dilemma
type: concept
title: The Prisoner's Dilemma
summary: When smart for each is bad for all.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: verraten
    widget: choice
    body: Two suspects are questioned separately. If both stay silent, each gets 1 year. If one betrays, he goes free and the other gets 5 years. If both betray, each gets 3.
    prompt: What is better for you – whatever the other does?
    params:
      options:
        - { label: Betray, correct: true }
        - { label: Stay silent, feedback: "If the other stays silent, betraying sets you free. If he betrays, betraying gets you 3 years instead of 5." }
    hints:
      - Check both cases separately – the other stays silent, or he betrays.
    explanation: In both cases, betraying is better for you. This is called a **dominant strategy**.

  - kind: problem
    id: ergebnis
    widget: numeric
    prompt: Both think this way and betray. How many years do they get together?
    params: { unit: years }
    answer: { value: 6 }
    hints:
      - Each gets 3 years.
    explanation: 3 + 3 = 6 years – although silence would have cost only 2 years together.

  - kind: explain
    id: s3
    body: |
      This is the **dilemma**. Each acts smartly for themselves. Still, both end up worse off than if they had cooperated.

  - kind: problem
    id: alltag
    widget: buckets
    prompt: A dilemma like the prisoners' – or not?
    params:
      buckets: [{ label: Dilemma }, { label: No dilemma }]
      items:
        - { label: Two firms keep undercutting each other, bucket: Dilemma }
        - { label: Everyone fishes – the seas run empty, bucket: Dilemma }
        - { label: In a traffic jam everyone pushes ahead, bucket: Dilemma }
        - { label: Two friends share a pizza, bucket: No dilemma }
        - { label: A game of chess, bucket: No dilemma }
    hints:
      - Does selfishness pay for each person – but hurt everyone together?
    explanation: Price wars, overfishing, and pushing ahead all follow the same pattern.

  - kind: explain
    id: s5
    body: What helps against such dilemmas?
    reveal:
      body: Contracts, rules, trust – and above all repetition. If you will meet again, you have a reason to cooperate.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: "Overfishing: everyone catches as much as they can until the sea is empty."
          right: true
        - text: Everyone drives on the right so nobody collides.
          right: false
          why: Nobody has an incentive to deviate here.
        - text: An arms race between two states.
          right: true
        - text: Everyone in the stadium stands up to see better.
          right: true
      left: No dilemma
      right: Dilemma

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Both prisoners betray. Could **one alone** improve by staying silent after all?
    params:
      options:
        - label: No – they would get the maximum sentence. That is why betrayal persists
          correct: true
        - label: Yes, they would get less
          feedback: Whoever stays silent alone is punished hardest.
        - label: That is unclear
          feedback: The payoffs are unambiguous.
    hints:
      - What happens to the one who stays silent while the other betrays?
    explanation: "A **Nash equilibrium**: neither can improve alone – even though both together would be far better off."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A pasture belongs to everyone in the village. Each drives as many cows onto it as possible until it is bare. What is this pattern called?
    params:
      options:
        - label: Tragedy of the commons
          correct: true
        - label: Winner’s curse
          feedback: That belongs to auctions.
        - label: Gambler’s fallacy
          feedback: That concerns chance.
    hints:
      - The gain from one more cow belongs to one – the harm is shared by all.
    explanation: A prisoner’s dilemma with many players. Elinor Ostrom showed that communities can solve it with their own rules – Nobel Prize 2009.
    difficulty: 3

srs:
  cards_from: [verraten, alltag]
