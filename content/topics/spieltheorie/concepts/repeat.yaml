id: logic.gametheory.repeat
type: concept
title: Wie du mir, so ich dir
summary: Warum Kooperation sich auf Dauer lohnt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein Händler sieht dich nur einmal – oder jede Woche. Wann lohnt es sich für ihn eher, fair zu sein?
    params:
      options:
        - label: Wenn ihr euch jede Woche seht
          correct: true
        - label: Beim einmaligen Treffen
          feedback: Da hat Betrug keine Folgen.
        - label: Das ist egal
          feedback: Die Zukunft ändert das Verhalten.
    hints:
      - Wer wiederkommt, kann sich revanchieren.
    explanation: Wiederholung verändert das ganze Spiel.

  - kind: explain
    id: s1
    body: |
      In einem berühmten **Turnier** spielten Programme das Dilemma hunderte Male gegeneinander.
      Gewonnen hat eine einfache Strategie – **Wie du mir, so ich dir**.

  - kind: problem
    id: regel
    widget: choice
    prompt: Was tut »Wie du mir, so ich dir«?
    params:
      options:
        - { label: Erst kooperieren – dann den letzten Zug des anderen nachmachen, correct: true }
        - { label: Immer verraten, feedback: "Das ist die Strategie für ein einziges Spiel. Auf Dauer verliert sie." }
        - { label: Zufällig spielen, feedback: "Zufall macht dich unberechenbar – aber kein guter Partner." }
    hints:
      - Der Name verrät es.
    explanation: Freundlich anfangen, nachtragend nur einen Zug lang, leicht zu durchschauen.

  - kind: problem
    id: runden
    widget: numeric
    body: Pro Runde bringt beidseitige Kooperation je 3 Punkte. Beidseitiger Verrat bringt je 1 Punkt.
    prompt: Zwei faire Spieler kooperieren {{n}} Runden lang. Wie viele Punkte hat jeder?
    params: { unit: Punkte }
    answer: { value: "{{3 * n}}" }
    hints:
      - Jede Runde gibt 3 Punkte.
    explanation: "{{n}} · 3 = {{3 * n}} Punkte – dreimal so viel wie bei ständigem Verrat."
    variants:
      params: { n: "int[5,20]" }
      defaults: { n: 10 }

  - kind: problem
    id: eigenschaften
    widget: buckets
    prompt: Welche Eigenschaften machten die Gewinner-Strategie aus?
    params:
      buckets: [{ label: hilft }, { label: schadet }]
      items:
        - { label: Freundlich anfangen, bucket: hilft }
        - { label: Verrat sofort beantworten, bucket: hilft }
        - { label: Schnell verzeihen, bucket: hilft }
        - { label: Ewig nachtragend sein, bucket: schadet }
        - { label: Zuerst verraten, bucket: schadet }
    hints:
      - Wer will mit dir auf Dauer kooperieren?
    explanation: Freundlich, wehrhaft, versöhnlich – so lohnt sich Kooperation.

  - kind: explain
    id: s5
    body: Was folgt daraus für das echte Leben?
    reveal:
      body: Wo Menschen sich wiederholt begegnen, lohnt sich Fairness – selbst für Egoisten. Kurzfristiger Vorteil kostet langfristig Vertrauen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Auszahlung pro Runde: beide kooperieren 3 Punkte, Verrat gegen Kooperation 5, beide verraten 1. Du verrätst in Runde 1 einen »Wie du mir, so ich dir«-Spieler und danach verraten beide. Wie viele Punkte hast du nach 5 Runden?"
    answer:
      value: 9
    hints:
      - Runde 1 bringt 5, danach viermal 1.
    explanation: 5 + 4 = 9 – mit Kooperation wären es 15 gewesen. Verrat lohnt sich nur ganz kurz.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das Spiel wird genau 10 Runden gespielt, und beide wissen das. Was sagt die strenge Logik voraus?
    params:
      options:
        - label: Verrat von Anfang an – in der letzten Runde lohnt Kooperation nicht mehr, also auch nicht in der vorletzten …
          correct: true
        - label: Kooperation bis zum Schluss
          feedback: In Runde 10 gibt es keine Zukunft mehr, die man schützen müsste.
        - label: Zufälliges Verhalten
          feedback: Die Rückwärtsüberlegung ist eindeutig.
    hints:
      - "Denk vom Ende her: Was tust du in Runde 10? Und dann in Runde 9?"
    explanation: "**Rückwärtsinduktion**. Echte Menschen kooperieren trotzdem – Kooperation braucht eine offene Zukunft, keine perfekte Logik."
    difficulty: 3

srs:
  cards_from: [regel, runden]
