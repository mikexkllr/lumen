id: logic.gametheory.auction
type: concept
title: Bieten mit Verstand
summary: Auktionen und der Fluch des Gewinners.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wer bietet mehr?
    body: Auktionen entscheiden über Kunstwerke, Werbeplätze und Milliarden. Wer dort klug bietet, braucht **Strategie** statt Bauchgefühl. Deck die Karten auf und staune, was alles versteigert wird.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📶
            front: Funkfrequenzen
            back: Im Jahr 2000 versteigerte Deutschland Mobilfunk-Lizenzen – für rund 50 Milliarden Euro.
          - icon: 🖼️
            front: Ein Gemälde
            back: Ein Bild, das Leonardo da Vinci zugeschrieben wird, brachte 2017 rund 450 Millionen Dollar.
          - icon: 🔎
            front: Jede Suche
            back: Bei vielen Suchen im Netz läuft in Millisekunden eine Auktion um die Werbeplätze.
          - icon: 🌷
            front: Fallende Preise
            back: Bei Blumenauktionen in den Niederlanden fällt der Preis, bis der Erste zugreift.

  - kind: problem
    id: zweitpreis
    widget: choice
    body: Bei einer verdeckten Zweitpreis-Auktion gewinnt das höchste Gebot – gezahlt wird aber nur das zweithöchste.
    prompt: Was bietest du am besten?
    params:
      options:
        - { label: "Genau so viel, wie es mir wert ist", correct: true }
        - { label: Weniger als es mir wert ist, feedback: "Dann verlierst du womöglich, obwohl du es günstig bekommen hättest." }
        - { label: Mehr als es mir wert ist, feedback: "Dann gewinnst du vielleicht zu einem Preis über deinem Wert." }
    hints:
      - Dein Gebot bestimmt nur, ob du gewinnst – nicht den Preis.
    explanation: Ehrlich bieten ist hier die beste Strategie. Online-Auktionen funktionieren ähnlich.

  - kind: explain
    id: s2
    body: |
      **Fluch des Gewinners:** Viele schätzen den Wert eines Ölfelds. Wer am höchsten schätzt, gewinnt – hat aber wahrscheinlich überschätzt.

  - kind: problem
    id: glas
    widget: numeric
    body: Ein Münzglas ist 50 € wert. 20 Leute schätzen – im Schnitt richtig, aber zwischen 30 und 70 €.
    prompt: Wer am höchsten schätzt, kauft das Glas zu seinem Gebot. Wie viel verliert er bei 70 €?
    params: { unit: "€" }
    answer: { value: 20 }
    hints:
      - 70 € gezahlt für 50 € Wert.
    explanation: 20 € Verlust. Wer gewinnt, hat meist am stärksten überschätzt.

  - kind: problem
    id: lehre
    widget: choice
    prompt: Was folgt daraus für dein Gebot?
    params:
      options:
        - { label: Etwas unter der eigenen Schätzung bieten, correct: true }
        - { label: Immer das Höchste bieten, feedback: "Genau das führt zum Fluch des Gewinners." }
    hints:
      - Wenn du gewinnst – was sagt das über deine Schätzung?
    explanation: Wer gewinnt, lag wahrscheinlich zu hoch. Ein Abschlag schützt davor.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Zweitpreis-Auktion: Der Höchstbietende zahlt das zweithöchste Gebot. Du bietest 80 €, der Nächste 55 €. Was zahlst du?"
    params:
      unit: €
    answer:
      value: 55
    hints:
      - Du gewinnst – aber zum zweithöchsten Gebot.
    explanation: 55 €. Dein eigenes Gebot bestimmt nur, ob du gewinnst.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Bei einer Zweitpreis-Auktion zahlt der Höchstbietende nur das **zweithöchste** Gebot. Warum lohnt es sich dort, ehrlich zu bieten?
    params:
      options:
        - label: Dein Gebot bestimmt nur, **ob** du gewinnst – nicht, was du zahlst
          correct: true
        - label: Weil der Verkäufer es verlangt
          feedback: Es liegt im eigenen Interesse.
        - label: Es lohnt sich nicht
          feedback: Zu niedrig bieten kostet dich Gewinne, zu hoch Verluste.
    hints:
      - Was ändert sich am Preis, wenn du höher bietest?
    explanation: "Die **Vickrey-Auktion**: Ehrlichkeit ist die beste Strategie. Fast jede Online-Werbung wird so versteigert."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Drei Bieter schätzen ein Bild auf 50, 80 und 120 €. Der Preis steigt in kleinen Schritten, bis nur noch einer bietet. Bei etwa welchem Preis endet die Auktion?
    answer:
      value: 80
    feedback:
      - when: numval(state.input) == 120
        misconception: own-value
        text: Der Höchstbietende muss nur so lange mitgehen, bis der Zweite aussteigt.
    hints:
      - Wer steigt zuerst aus, wer als Zweiter?
      - Sobald der Preis über 80 € steigt, ist nur noch einer übrig.
    explanation: Die steigende Auktion endet beim **zweithöchsten** Wert. Darum entspricht sie im Ergebnis der Zweitpreis-Auktion.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Beim Ölfeld schätzen viele Bieter denselben unbekannten Wert. Was sollst du tun, wenn **mehr** Bieter mitmachen?
    params:
      options:
        - label: Noch vorsichtiger bieten – wer gewinnt, hat dann eher stark überschätzt.
          correct: true
        - label: Höher bieten, um sicher zu gewinnen.
          feedback: Gerade dann trifft dich der Fluch des Gewinners.
        - label: Nichts ändern.
          feedback: Mit der Zahl der Bieter wächst die höchste Fehlschätzung.
    hints:
      - Unter vielen Schätzungen – wie weit liegt die höchste meist über dem echten Wert?
      - Wer gewinnt, hat die höchste Schätzung abgegeben.
    explanation: Je mehr Schätzungen, desto extremer die höchste. Kluge Bieter rechnen ein, was ein Sieg über die eigene Schätzung **verrät**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux das Gefangenendilemma und was es über Zusammenarbeit lehrt.
    params:
      keywords:
        - - einzeln
          - selbst
          - jeder
          - individual
          - each
          - alone
          - eigen
        - - verrat
          - verraten
          - defect
          - betray
          - egoist
          - selfish
        - - beide
          - zusammen
          - gemeinsam
          - both
          - together
        - - schlechter
          - besser
          - worse
          - better
      min: 3
      sample: Für jeden einzeln ist Verraten immer die bessere Wahl. Tun es aber beide, stehen sie schlechter da, als wenn beide geschwiegen hätten. Zusammenarbeit braucht darum Vertrauen, Regeln oder Wiederholung.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Zwei Bieter, deren Werte zufällig gleichverteilt zwischen 0 und 100 € liegen. In der Zweitpreis-Auktion zahlt der Sieger den kleineren Wert. Wie viel nimmt der Verkäufer im Schnitt ein?
    params:
      unit: €
    answer:
      value: 33.3
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 50
        misconception: mean-not-min
        text: Das ist der Durchschnitt eines Werts. Das Minimum von zwei Werten liegt tiefer.
    hints:
      - Zwei zufällige Punkte teilen die Strecke 0–100 im Schnitt in drei gleiche Teile.
      - Der kleinere Wert liegt also im Schnitt bei 100 / 3.
    explanation: Im Schnitt 33,3 €. In der Erstpreis-Auktion bietet jeder im Gleichgewicht die Hälfte seines Werts. Erwartet sind das ½ · 66,7 € – ebenfalls 33,3 €. Das ist das **Erlösäquivalenz-Theorem**.
    difficulty: 3

srs:
  cards_from: [zweitpreis, lehre]
