id: logic.gametheory.auction
type: concept
title: Bieten mit Verstand
summary: Auktionen und der Fluch des Gewinners.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zweitpreis
    widget: choice
    body: Bei einer verdeckten Zweitpreis-Auktion gewinnt das höchste Gebot – gezahlt wird aber nur das zweithöchste.
    prompt: Was bietest du am besten?
    params:
      options:
        - { label: "Genau so viel, wie es mir wert ist", correct: true }
        - { label: Weniger als es mir wert ist, feedback: "Dann verlierst du womöglich, obwohl du es günstig bekommen hättest." }
        - { label: Mehr als es mir wert ist, feedback: "Dann gewinnst du vielleicht zu einem Preis über deinem Wert." }
    hints:
      - Dein Gebot bestimmt nur, ob du gewinnst – nicht den Preis.
    explanation: Ehrlich bieten ist hier die beste Strategie. Online-Auktionen funktionieren ähnlich.

  - kind: explain
    body: |
      **Fluch des Gewinners:** Viele schätzen den Wert eines Ölfelds. Wer am höchsten schätzt, gewinnt – hat aber wahrscheinlich überschätzt.

  - kind: problem
    id: glas
    widget: numeric
    body: Ein Münzglas ist 50 € wert. 20 Leute schätzen – im Schnitt richtig, aber zwischen 30 und 70 €.
    prompt: Wer am höchsten schätzt, kauft das Glas zu seinem Gebot. Wie viel verliert er bei 70 €?
    params: { unit: "€" }
    answer: { value: 20 }
    hints:
      - 70 € gezahlt für 50 € Wert.
    explanation: 20 € Verlust. Wer gewinnt, hat meist am stärksten überschätzt.

  - kind: problem
    id: lehre
    widget: choice
    prompt: Was folgt daraus für dein Gebot?
    params:
      options:
        - { label: Etwas unter der eigenen Schätzung bieten, correct: true }
        - { label: Immer das Höchste bieten, feedback: "Genau das führt zum Fluch des Gewinners." }
    hints:
      - Wenn du gewinnst – was sagt das über deine Schätzung?
    explanation: Wer gewinnt, lag wahrscheinlich zu hoch. Ein Abschlag schützt davor.

srs:
  cards_from: [zweitpreis, lehre]
