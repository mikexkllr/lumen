id: logic.gametheory.dilemma
type: concept
title: Das Gefangenendilemma
summary: Wenn klug für jeden schlecht für alle ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: verraten
    widget: choice
    body: Zwei Verdächtige werden getrennt verhört. Schweigen beide, bekommen sie je 1 Jahr. Verrät einer, geht er frei, der andere bekommt 5 Jahre. Verraten beide, bekommen beide 3 Jahre.
    prompt: Was ist für dich besser – egal, was der andere tut?
    params:
      options:
        - { label: Verraten, correct: true }
        - { label: Schweigen, feedback: "Schweigt der andere, wärst du mit Verrat frei. Verrät er, bekommst du mit Verrat 3 statt 5 Jahre." }
    hints:
      - Prüfe beide Fälle einzeln – der andere schweigt, oder er verrät.
    explanation: In beiden Fällen ist Verraten besser für dich. Das nennt man eine **dominante Strategie**.

  - kind: problem
    id: ergebnis
    widget: numeric
    prompt: Beide denken so und verraten. Wie viele Jahre bekommen sie zusammen?
    params: { unit: Jahre }
    answer: { value: 6 }
    hints:
      - Jeder bekommt 3 Jahre.
    explanation: 3 + 3 = 6 Jahre – obwohl Schweigen nur 2 Jahre zusammen gebracht hätte.

  - kind: explain
    body: |
      Das ist das **Dilemma**. Jeder handelt klug für sich. Trotzdem stehen beide schlechter da, als wenn sie kooperiert hätten.

  - kind: problem
    id: alltag
    widget: buckets
    prompt: Ein Dilemma wie beim Gefangenen – oder nicht?
    params:
      buckets: [{ label: Dilemma }, { label: kein Dilemma }]
      items:
        - { label: Zwei Firmen unterbieten sich ständig, bucket: Dilemma }
        - { label: Alle fischen – die Meere werden leer, bucket: Dilemma }
        - { label: Im Stau drängelt jeder vor, bucket: Dilemma }
        - { label: Zwei Freunde teilen eine Pizza, bucket: kein Dilemma }
        - { label: Ein Schachspiel, bucket: kein Dilemma }
    hints:
      - Lohnt sich Egoismus für jeden einzeln – schadet aber allen zusammen?
    explanation: Preiskriege, Überfischung und Drängeln folgen demselben Muster.

  - kind: explain
    body: Was hilft gegen solche Dilemmas?
    reveal:
      body: Verträge, Regeln, Vertrauen – und vor allem Wiederholung. Wer sich wieder begegnet, hat einen Grund zu kooperieren.

srs:
  cards_from: [verraten, alltag]
