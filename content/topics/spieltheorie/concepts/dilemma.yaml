id: logic.gametheory.dilemma
type: concept
title: Das Gefangenendilemma
summary: Wenn klug für jeden schlecht für alle ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Spirale des Misstrauens
    body: "Warum geben Länder Milliarden für Waffen aus, die keiner einsetzen will? Deck die Karten der Reihe nach auf. Sie zeigen eine Falle, in der kluge Entscheidungen alle ärmer machen: ein **Dilemma**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🛡️
            front: Land A rüstet auf
            back: Es fühlt sich bedroht und kauft neue Waffen – nur zur Sicherheit.
          - icon: 😟
            front: Land B sieht das
            back: Jetzt fühlt sich B bedroht. Abwarten wäre riskant, also rüstet es auch auf.
          - icon: 💸
            front: Beide zahlen
            back: Keiner ist sicherer als vorher. Aber beide geben viel mehr Geld aus.
          - icon: 🔁
            front: Und wieder von vorn
            back: A fühlt sich erneut bedroht – die nächste Runde beginnt. Jeder handelt klug, alle verlieren.

  - kind: problem
    id: verraten
    widget: choice
    body: Zwei Verdächtige werden getrennt verhört. Schweigen beide, bekommen sie je 1 Jahr. Verrät einer, geht er frei, der andere bekommt 5 Jahre. Verraten beide, bekommen beide 3 Jahre.
    prompt: Was ist für dich besser – egal, was der andere tut?
    params:
      options:
        - { label: Verraten, correct: true }
        - { label: Schweigen, feedback: "Schweigt der andere, wärst du mit Verrat frei. Verrät er, bekommst du mit Verrat 3 statt 5 Jahre." }
    hints:
      - Prüfe beide Fälle einzeln – der andere schweigt, oder er verrät.
    explanation: In beiden Fällen ist Verraten besser für dich. Das nennt man eine **dominante Strategie**.

  - kind: problem
    id: ergebnis
    widget: numeric
    prompt: Beide denken so und verraten. Wie viele Jahre bekommen sie zusammen?
    params: { unit: Jahre }
    answer: { value: 6 }
    hints:
      - Jeder bekommt 3 Jahre.
    explanation: 3 + 3 = 6 Jahre – obwohl Schweigen nur 2 Jahre zusammen gebracht hätte.

  - kind: explain
    id: s3
    body: |
      Das ist das **Dilemma**. Jeder handelt klug für sich. Trotzdem stehen beide schlechter da, als wenn sie kooperiert hätten.

  - kind: problem
    id: alltag
    widget: buckets
    prompt: Ein Dilemma wie beim Gefangenen – oder nicht?
    params:
      buckets: [{ label: Dilemma }, { label: kein Dilemma }]
      items:
        - { label: Zwei Firmen unterbieten sich ständig, bucket: Dilemma }
        - { label: Alle fischen – die Meere werden leer, bucket: Dilemma }
        - { label: Im Stau drängelt jeder vor, bucket: Dilemma }
        - { label: Zwei Freunde teilen eine Pizza, bucket: kein Dilemma }
        - { label: Ein Schachspiel, bucket: kein Dilemma }
    hints:
      - Lohnt sich Egoismus für jeden einzeln – schadet aber allen zusammen?
    explanation: Preiskriege, Überfischung und Drängeln folgen demselben Muster.

  - kind: explain
    id: s5
    body: Was hilft gegen solche Dilemmas?
    reveal:
      body: Verträge, Regeln, Vertrauen – und vor allem Wiederholung. Wer sich wieder begegnet, hat einen Grund zu kooperieren.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: "Überfischung: Jeder fängt so viel er kann, bis das Meer leer ist."
          right: true
        - text: Alle fahren rechts, damit niemand zusammenstößt.
          right: false
          why: Hier hat niemand einen Anreiz abzuweichen.
        - text: Wettrüsten zwischen zwei Staaten.
          right: true
        - text: Im Stadion stehen alle auf, um besser zu sehen.
          right: true
      left: Kein Dilemma
      right: Dilemma

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Beide Gefangenen verraten. Könnte sich **einer allein** verbessern, indem er doch schweigt?
    params:
      options:
        - label: Nein – er bekäme die Höchststrafe. Darum bleibt es beim Verrat
          correct: true
        - label: Ja, er bekäme weniger
          feedback: Wer allein schweigt, wird am härtesten bestraft.
        - label: Das ist unklar
          feedback: Die Auszahlungen sind eindeutig.
    hints:
      - Was passiert mit dem, der schweigt, während der andere verrät?
    explanation: "Ein **Nash-Gleichgewicht**: Keiner kann sich allein verbessern – auch wenn beide gemeinsam viel besser dastünden."
    difficulty: 2

  - kind: explain
    id: la-d1
    depth: 2
    body: Ein **Nash-Gleichgewicht** ist eine Wahl beider Spieler, bei der keiner sich allein verbessern kann. Beim Gefangenendilemma ist das »beide verraten« – obwohl Schweigen für beide besser wäre.

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Zwei Firmen wählen einen hohen oder niedrigen Preis. Gewinne: beide hoch je 5, beide niedrig je 3. Wer allein niedrig geht, bekommt 7, der andere 1. Welchen Gewinn hat jede Firma im Nash-Gleichgewicht?"
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 5
        misconception: cooperative-outcome
        text: 5 wäre schön – aber bei »beide hoch« lohnt es sich für jede Firma, allein auf niedrig zu gehen.
    hints:
      - Was ist für Firma A besser, wenn B hoch wählt? Und wenn B niedrig wählt?
      - Niedrig ist in beiden Fällen besser (7 > 5 und 3 > 1). Was wählen also beide?
    explanation: Niedrig ist eine **dominante Strategie**. Beide wählen sie und landen bei je 3 statt je 5. Das ist ein Gefangenendilemma – und der Grund, warum Preisabsprachen verboten sind.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Weide gehört allen im Dorf. Jeder treibt möglichst viele Kühe hinauf, bis sie kahl ist. Wie heißt dieses Muster?
    params:
      options:
        - label: Tragik der Allmende
          correct: true
        - label: Fluch des Gewinners
          feedback: Der gehört zu Auktionen.
        - label: Spielerfehlschluss
          feedback: Der betrifft Zufall.
    hints:
      - Der Nutzen einer weiteren Kuh gehört einem – der Schaden verteilt sich auf alle.
    explanation: Ein Gefangenendilemma mit vielen Spielern. Elinor Ostrom zeigte, dass Gemeinschaften es mit eigenen Regeln lösen können – Nobelpreis 2009.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Das Gleichgewicht »beide niedrig« (3, 3) ist nicht **Pareto-optimal**. Was heißt das?
    params:
      options:
        - label: Es gibt ein Ergebnis, bei dem beide besser dastehen – (5, 5).
          correct: true
        - label: Keiner kann sich verbessern.
          feedback: Das beschreibt das Nash-Gleichgewicht, nicht Pareto.
        - label: Eine Firma gewinnt mehr als die andere.
          feedback: Bei (3, 3) bekommen beide gleich viel – gerecht, aber nicht optimal.
    hints:
      - "Pareto-optimal heißt: Niemand kann besser gestellt werden, ohne dass ein anderer verliert."
      - Vergleiche (3, 3) mit (5, 5).
    explanation: "Nash fragt: Lohnt sich **allein** abzuweichen? Pareto fragt: Geht es **gemeinsam** besser? Im Dilemma fallen beide auseinander – das ist sein Kern."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein Nash-Gleichgewicht ist – am Beispiel des Gefangenendilemmas.
    params:
      keywords:
        - - allein
          - einseitig
          - alone
          - unilateral
        - - verbesser
          - besser
          - improve
          - better
        - - verraten
          - verrat
          - betray
          - defect
      sample: Im Nash-Gleichgewicht kann sich keiner allein verbessern, wenn der andere bei seiner Wahl bleibt. Beim Gefangenendilemma ist das beide verraten, obwohl Schweigen für beide besser wäre.
    difficulty: 3

srs:
  cards_from: [verraten, alltag]
