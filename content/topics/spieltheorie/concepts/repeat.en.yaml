id: logic.gametheory.repeat
type: concept
title: Tit for Tat
summary: Why cooperation pays off in the long run.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A trader sees you only once – or every week. When does it pay more for him to be fair?
    params:
      options:
        - label: If you meet every week
          correct: true
        - label: At the single meeting
          feedback: There cheating has no consequences.
        - label: It makes no difference
          feedback: The future changes behaviour.
    hints:
      - Whoever returns can retaliate.
    explanation: Repetition changes the whole game.

  - kind: explain
    id: s1
    body: |
      In a famous tournament, programs played the dilemma against each other hundreds of times.
      A simple strategy won – **tit for tat**.

  - kind: problem
    id: regel
    widget: choice
    prompt: What does “tit for tat” do?
    params:
      options:
        - { label: Cooperate first – then copy the other's last move, correct: true }
        - { label: Always betray, feedback: "That is the strategy for a single game. In the long run, it loses." }
        - { label: Play randomly, feedback: "Randomness makes you unpredictable – but not a good partner." }
    hints:
      - The name gives it away.
    explanation: Start friendly, hold a grudge for one move only, and be easy to read.

  - kind: problem
    id: runden
    widget: numeric
    body: Each round, mutual cooperation gives 3 points to each player. Mutual betrayal gives 1 point each.
    prompt: Two fair players cooperate for {{n}} rounds. How many points does each have?
    params: { unit: points }
    answer: { value: "{{3 * n}}" }
    hints:
      - Each round gives 3 points.
    explanation: "{{n}} · 3 = {{3 * n}} points – three times as many as with constant betrayal."
    variants:
      params: { n: "int[5,20]" }
      defaults: { n: 10 }

  - kind: problem
    id: eigenschaften
    widget: buckets
    prompt: Which traits made up the winning strategy?
    params:
      buckets: [{ label: helps }, { label: harms }]
      items:
        - { label: Starting friendly, bucket: helps }
        - { label: Answering betrayal right away, bucket: helps }
        - { label: Forgiving quickly, bucket: helps }
        - { label: Holding a grudge forever, bucket: harms }
        - { label: Betraying first, bucket: harms }
    hints:
      - Who wants to cooperate with you in the long run?
    explanation: Friendly, firm, and forgiving – that is how cooperation pays.

  - kind: explain
    id: s5
    body: What follows for real life?
    reveal:
      body: Where people meet repeatedly, fairness pays – even for egoists. A short-term gain costs trust in the long run.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Payoff per round: both cooperate 3 points, betrayal against cooperation 5, both betray 1. You betray a tit-for-tat player in round 1 and then both betray. How many points do you have after 5 rounds?"
    answer:
      value: 9
    hints:
      - Round 1 gives 5, then four times 1.
    explanation: 5 + 4 = 9 – with cooperation it would have been 15. Betrayal pays only very briefly.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The game is played for exactly 10 rounds, and both know it. What does strict logic predict?
    params:
      options:
        - label: Betrayal from the start – in the last round cooperation no longer pays, so neither in the second to last …
          correct: true
        - label: Cooperation to the end
          feedback: In round 10 there is no future left to protect.
        - label: Random behaviour
          feedback: The backward reasoning is unambiguous.
    hints:
      - "Think from the end: what do you do in round 10? And then in round 9?"
    explanation: "**Backward induction**. Real people cooperate anyway – cooperation needs an open future, not perfect logic."
    difficulty: 3

srs:
  cards_from: [regel, runden]
