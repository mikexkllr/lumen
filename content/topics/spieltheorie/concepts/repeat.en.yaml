id: logic.gametheory.repeat
type: concept
title: Tit for Tat
summary: Why cooperation pays off in the long run.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: A trader sees you only once – or every week. When does it pay more for him to be fair?
    params:
      options:
        - label: If you meet every week
          correct: true
        - label: At the single meeting
          feedback: There cheating has no consequences.
        - label: It makes no difference
          feedback: The future changes behaviour.
    hints:
      - Whoever returns can retaliate.
    explanation: Repetition changes the whole game.

  - kind: explain
    id: s1
    body: |
      In a famous **tournament**, programs played the dilemma against each other hundreds of times.
      A simple strategy won – **tit for tat**.

  - kind: problem
    id: regel
    widget: choice
    prompt: What does “tit for tat” do?
    params:
      options:
        - { label: Cooperate first – then copy the other's last move, correct: true }
        - { label: Always betray, feedback: "That is the strategy for a single game. In the long run, it loses." }
        - { label: Play randomly, feedback: "Randomness makes you unpredictable – but not a good partner." }
    hints:
      - The name gives it away.
    explanation: Start friendly, hold a grudge for one move only, and be easy to read.

  - kind: problem
    id: runden
    widget: numeric
    body: Each round, mutual cooperation gives 3 points to each player. Mutual betrayal gives 1 point each.
    prompt: Two fair players cooperate for {{n}} rounds. How many points does each have?
    params: { unit: points }
    answer: { value: "{{3 * n}}" }
    hints:
      - Each round gives 3 points.
    explanation: "{{n}} · 3 = {{3 * n}} points – three times as many as with constant betrayal."
    variants:
      params: { n: "int[5,20]" }
      defaults: { n: 10 }

  - kind: problem
    id: eigenschaften
    widget: buckets
    prompt: Which traits made up the winning strategy?
    params:
      buckets: [{ label: helps }, { label: harms }]
      items:
        - { label: Starting friendly, bucket: helps }
        - { label: Answering betrayal right away, bucket: helps }
        - { label: Forgiving quickly, bucket: helps }
        - { label: Holding a grudge forever, bucket: harms }
        - { label: Betraying first, bucket: harms }
    hints:
      - Who wants to cooperate with you in the long run?
    explanation: Friendly, firm, and forgiving – that is how cooperation pays.

  - kind: explain
    id: s5
    body: What follows for real life?
    reveal:
      body: Where people meet repeatedly, fairness pays – even for egoists. A short-term gain costs trust in the long run.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Payoff per round: both cooperate 3 points, betrayal against cooperation 5, both betray 1. You betray a tit-for-tat player in round 1 and then both betray. How many points do you have after 5 rounds?"
    answer:
      value: 9
    hints:
      - Round 1 gives 5, then four times 1.
    explanation: 5 + 4 = 9 – with cooperation it would have been 15. Betrayal pays only very briefly.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Cooperating gives 3 points per round. A betrayer gets 5 once and only 1 forever after. After each round the game continues with probability w. From which w does cooperation pay? In percent.
    answer:
      value: 50
      tolerance: 0.5
    hints:
      - "Expected: cooperation gives 3 / (1 − w). Betrayal gives 5 + w · 1 / (1 − w)."
      - "Set them equal and multiply by (1 − w): 3 = 5 − 4w."
    explanation: From 3 = 5(1 − w) + w follows w = 0.5. If the future is likely enough, loyalty beats the quick gain. Game theorists call this the shadow of the future.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Tit for tat meets itself. In round 3 one move is wrongly reported as a betrayal. What happens next?
    params:
      options:
        - label: The two punish each other in turn – forever.
          correct: true
        - label: Both go straight back to cooperating.
          feedback: The deceived one answers with betrayal, then the other does too …
        - label: The game ends.
          feedback: It goes on – just worse.
    hints:
      - Each copies the other's last move.
      - Play a few rounds on paper.
    explanation: With noise, tit for tat falls into a revenge loop. More generous variants forgive a betrayal now and then – and do better in practice.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The game is played for exactly 10 rounds, and both know it. What does strict logic predict?
    params:
      options:
        - label: Betrayal from the start – in the last round cooperation no longer pays, so neither in the second to last …
          correct: true
        - label: Cooperation to the end
          feedback: In round 10 there is no future left to protect.
        - label: Random behaviour
          feedback: The backward reasoning is unambiguous.
    hints:
      - "Think from the end: what do you do in round 10? And then in round 9?"
    explanation: "**Backward induction**. Real people cooperate anyway – cooperation needs an open future, not perfect logic."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: A few tit-for-tat players appear in a group of permanent betrayers. When can they win through?
    params:
      options:
        - label: If they meet each other often enough and play long games together.
          correct: true
        - label: Never – betrayal always wins.
          feedback: Among themselves they earn 3 points per round, betrayers only 1.
        - label: Always, even alone.
          feedback: A lone one loses the first round against every betrayer and never gains anything back.
    hints:
      - What does a tit-for-tat player earn against a betrayer, and against one of its own kind?
      - What matters is how often cooperators meet.
    explanation: Alone, cooperators perish. In clusters that meet often, though, they earn enough to overtake the betrayers. This is how evolutionary biology explains how cooperation can arise.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why cooperation pays even for egoists in repeated games.
    params:
      keywords:
        - - wieder
          - wiederholt
          - nächste
          - zukunft
          - again
          - repeated
          - next
          - future
        - - verrat
          - verraten
          - betray
          - defect
        - - strafe
          - bestraf
          - rache
          - vergelt
          - punish
          - revenge
          - retaliat
      sample: When players meet again, betrayal can be punished in the next round. The quick gain from betraying then costs many points in the future. So cooperation pays even for egoists.
    difficulty: 3

srs:
  cards_from: [regel, runden]
