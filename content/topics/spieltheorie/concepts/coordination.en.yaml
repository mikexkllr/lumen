id: logic.gametheory.coordination
type: concept
title: Meeting Points Without Agreement
summary: When everyone has to think the same.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Great minds think alike
    body: Two strangers with no agreement often choose the same thing – surprisingly often. Imagine a stranger sees this grid too. Tap the cell you think they will pick. You only win with the **same choice**.
    visual:
      widget: pixels
      interactive: true
      params:
        rows: 4
        cols: 4

  - kind: problem
    id: treffen
    widget: choice
    prompt: You are to meet a stranger in Paris tomorrow – with no agreement on place or time. Where and when do you go?
    params:
      options:
        - { label: At noon at the Eiffel Tower, correct: true }
        - { label: At 3:37 p.m. in a side street, feedback: "The other person will never guess that. You need the most obvious choice." }
    hints:
      - What would almost everyone choose?
    explanation: Such obvious solutions are called **focal points**. Without agreement, people pick the obvious.

  - kind: explain
    id: s2
    body: |
      In **coordination games**, everyone wins if they choose the same thing. Example: driving on the right or the left. Either works – what matters is that everyone does the same.

  - kind: problem
    id: art
    widget: buckets
    prompt: Coordination or competition?
    params:
      buckets: [{ label: Coordination }, { label: Competition }]
      items:
        - { label: Which side of the road to drive on, bucket: Coordination }
        - { label: Which charging plug wins out, bucket: Coordination }
        - { label: Two bidders for one house, bucket: Competition }
        - { label: Taking and saving a penalty kick, bucket: Competition }
    hints:
      - Do both benefit if they do the same thing?
    explanation: In coordination, everyone wins together. In competition, one wins at the other's expense.

  - kind: problem
    id: elfmeter
    widget: choice
    prompt: Why do pros shoot penalties to both sides?
    params:
      options:
        - { label: "A fixed habit is easy to guess.", correct: true }
        - { label: Because they forget., feedback: "It is on purpose. Chance stops the keeper from guessing." }
    hints:
      - What does the goalkeeper do with a pattern?
    explanation: In competition, chance is a strategy. It is called a **mixed strategy**.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does everyone want to choose the same here – or just the opposite?
    params:
      buckets:
        - id: b1
          label: All the same
        - id: b2
          label: Against each other
      items:
        - label: Driving on the right or left
          bucket: b1
        - label: Which messenger do we use?
          bucket: b1
        - label: The last piece of cake
          bucket: b2
        - label: Meeting point in a strange city
          bucket: b1
        - label: "Penalty: shooter against keeper"
          bucket: b2
    hints:
      - Do both win if they choose alike?
    explanation: Coordination is helped by agreement. At a penalty only unpredictability helps.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Two hunters: together they can bring down a stag. Each alone can surely catch a hare. What is the risk?"
    params:
      options:
        - label: Whoever goes for the stag and is left alone ends up with nothing – trust decides
          correct: true
        - label: There is none – the stag is always better
          feedback: Only if the other joins in.
        - label: Hares are poisonous
          feedback: The hare is the safe choice.
    hints:
      - What happens if you wait for the stag and the other hunts hares?
    explanation: "The **stag hunt**: two equilibria, one better, one safer. Many team projects are exactly like this."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Two cars meet on a narrow road. Each swerves left or right. How many Nash equilibria are there?
    params:
      options:
        - label: "Two: both left or both right (from their own view)."
          correct: true
        - label: "One: both right."
          feedback: Right is just custom. Both left works just as well.
        - label: None.
          feedback: If both swerve the same way, neither wants to switch alone – that is an equilibrium.
    hints:
      - "Check each of the four combinations: does one want to switch alone?"
      - With the same side nobody wants to switch; with different sides both do.
    explanation: Coordination games often have several equilibria. Habits or laws pick one – such as driving on the right.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: 'In rock–paper–scissors: with what probability do you play "rock" in equilibrium? In percent, to one decimal.'
    answer:
      value: 33.3
      tolerance: 0.1
    hints:
      - If rock were more frequent, the opponent could play paper more often.
      - Only if all three come equally often can the opponent exploit nothing.
    explanation: "1/3 each ≈ 33.3 %. This game has no pure equilibrium, only a mixed one: randomness is the best strategy here."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "At a penalty: the shooter scores on the left with 90% if the keeper dives the wrong way, otherwise 50%. The same holds on the right. How often should they shoot left to be unpredictable? In percent."
    params:
      unit: "%"
    answer:
      value: 50
    hints:
      - Both sides are equally good – so there is no reason to prefer one.
    explanation: "50%. A **mixed strategy**: chance as protection against being read."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Penalty. Shot left: goal 50 % if the keeper dives left, otherwise 90 %. Shot right: goal 90 % if he dives left, otherwise 30 %. How often does the keeper dive left in equilibrium? In percent."
    answer:
      value: 60
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 50
        misconception: symmetric
        text: That would be right if both of the shooter's sides were equally strong. On the right he is weaker.
    hints:
      - The keeper dives left with q. He picks q so that both sides are **equally** good for the shooter.
      - "Left: 0.5q + 0.9(1 − q). Right: 0.9q + 0.3(1 − q). Set them equal."
    explanation: 0.9 − 0.4q = 0.3 + 0.6q gives q = 0.6. The shooter then scores 66 % on both sides. You mix to make your opponent indifferent – not yourself.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Why must every option played in a mixed equilibrium give the player the same payoff?
    params:
      options:
        - label: If one paid more, he would choose only that one – then it would not be an equilibrium.
          correct: true
        - label: Because chance has to be fair.
          feedback: Fairness plays no part – it is about self-interest.
        - label: It does not have to.
          feedback: "It does: otherwise it pays to leave the mix."
    hints:
      - Imagine "left" pays slightly more than "right". What would the player do?
      - Would his mix still be a best response?
    explanation: This is the indifference principle. Nash proved in 1950 that every finite game has at least one equilibrium – once mixed strategies are allowed.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why a penalty taker should pick a side at random on purpose.
    params:
      keywords:
        - - zufall
          - zufällig
          - random
        - - berechenbar
          - vorhersag
          - durchschau
          - predictable
          - predict
          - read
        - - ausnutz
          - ausgenutzt
          - exploit
      sample: A shooter who always picks the same side is predictable, and the keeper dives there. Mixing at random stops the opponent from exploiting a pattern.
    difficulty: 3

srs:
  cards_from: [art, elfmeter]
