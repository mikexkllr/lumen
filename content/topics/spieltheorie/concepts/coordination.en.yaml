id: logic.gametheory.coordination
type: concept
title: Meeting Points Without Agreement
summary: When everyone has to think the same.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: treffen
    widget: choice
    prompt: You are to meet a stranger in Paris tomorrow – with no agreement on place or time. Where and when do you go?
    params:
      options:
        - { label: At noon at the Eiffel Tower, correct: true }
        - { label: At 3:37 p.m. in a side street, feedback: "The other person will never guess that. You need the most obvious choice." }
    hints:
      - What would almost everyone choose?
    explanation: Such obvious solutions are called **focal points**. Without agreement, people pick the obvious.

  - kind: explain
    id: s2
    body: |
      In **coordination games**, everyone wins if they choose the same thing. Example: driving on the right or the left. Either works – what matters is that everyone does the same.

  - kind: problem
    id: art
    widget: buckets
    prompt: Coordination or competition?
    params:
      buckets: [{ label: Coordination }, { label: Competition }]
      items:
        - { label: Which side of the road to drive on, bucket: Coordination }
        - { label: Which charging plug wins out, bucket: Coordination }
        - { label: Two bidders for one house, bucket: Competition }
        - { label: Taking and saving a penalty kick, bucket: Competition }
    hints:
      - Do both benefit if they do the same thing?
    explanation: In coordination, everyone wins together. In competition, one wins at the other's expense.

  - kind: problem
    id: elfmeter
    widget: choice
    prompt: Why do pros shoot penalties to both sides?
    params:
      options:
        - { label: "A fixed habit is easy to guess.", correct: true }
        - { label: Because they forget., feedback: "It is on purpose. Chance stops the keeper from guessing." }
    hints:
      - What does the goalkeeper do with a pattern?
    explanation: In competition, chance is a strategy. It is called a **mixed strategy**.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Two hunters: together they can bring down a stag. Each alone can surely catch a hare. What is the risk?"
    params:
      options:
        - label: Whoever goes for the stag and is left alone ends up with nothing – trust decides
          correct: true
        - label: There is none – the stag is always better
          feedback: Only if the other joins in.
        - label: Hares are poisonous
          feedback: The hare is the safe choice.
    hints:
      - What happens if you wait for the stag and the other hunts hares?
    explanation: "The **stag hunt**: two equilibria, one better, one safer. Many team projects are exactly like this."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "At a penalty: the shooter scores on the left with 90% if the keeper dives the wrong way, otherwise 50%. The same holds on the right. How often should they shoot left to be unpredictable? In percent."
    params:
      unit: "%"
    answer:
      value: 50
    hints:
      - Both sides are equally good – so there is no reason to prefer one.
    explanation: "50%. A **mixed strategy**: chance as protection against being read."
    difficulty: 3

srs:
  cards_from: [art, elfmeter]
