id: logic.gametheory.auction
type: concept
title: Bidding Wisely
summary: Auctions and the winner's curse.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: zweitpreis
    widget: choice
    body: In a sealed-bid second-price auction, the highest bid wins – but the winner pays only the second-highest bid.
    prompt: What is the best bid?
    params:
      options:
        - { label: "Exactly what it is worth to me", correct: true }
        - { label: Less than it is worth to me, feedback: "Then you may lose, even though you could have got it cheaply." }
        - { label: More than it is worth to me, feedback: "Then you might win at a price above your value." }
    hints:
      - Your bid only decides whether you win – not the price.
    explanation: Bidding honestly is the best strategy here. Online auctions work in a similar way.

  - kind: explain
    id: s2
    body: |
      **Winner's curse:** Many people estimate the value of an oil field. The highest estimate wins – but it is probably an overestimate.

  - kind: problem
    id: glas
    widget: numeric
    body: A jar of coins is worth €50. 20 people estimate – right on average, but between €30 and €70.
    prompt: The highest estimator buys the jar at their bid. How much do they lose at €70?
    params: { unit: "€" }
    answer: { value: 20 }
    hints:
      - €70 paid for a value of €50.
    explanation: A €20 loss. The winner has usually overestimated the most.

  - kind: problem
    id: lehre
    widget: choice
    prompt: What follows for your bid?
    params:
      options:
        - { label: Bid a bit below your own estimate, correct: true }
        - { label: Always bid the highest, feedback: "That is exactly what leads to the winner's curse." }
    hints:
      - If you win – what does that say about your estimate?
    explanation: The winner was probably too high. A discount protects against that.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Second-price auction: the top bidder pays the second-highest bid. You bid €80, the next one €55. What do you pay?"
    params:
      unit: €
    answer:
      value: 55
    hints:
      - You win – but at the second-highest bid.
    explanation: €55. Your own bid only decides whether you win.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In a second-price auction the highest bidder pays only the **second-highest** bid. Why does it pay to bid honestly there?
    params:
      options:
        - label: Your bid only determines **whether** you win – not what you pay
          correct: true
        - label: Because the seller demands it
          feedback: It is in your own interest.
        - label: It does not pay
          feedback: Bidding too low costs you wins, too high costs losses.
    hints:
      - What changes about the price if you bid higher?
    explanation: "The **Vickrey auction**: honesty is the best strategy. Almost all online advertising is auctioned this way."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Tell Lux what the prisoner’s dilemma is and what it says about working together.
    params:
      keywords:
        - - einzeln
          - selbst
          - jeder
          - individual
          - each
          - alone
          - eigen
        - - verrat
          - verraten
          - defect
          - betray
          - egoist
          - selfish
        - - beide
          - zusammen
          - gemeinsam
          - both
          - together
        - - schlechter
          - besser
          - worse
          - better
      min: 3
      sample: For each one alone, to betray is always the better choice. But if both do it, they end up worse off than if both had kept quiet. So working together needs trust, rules or many rounds.
    difficulty: 3

srs:
  cards_from: [zweitpreis, lehre]
