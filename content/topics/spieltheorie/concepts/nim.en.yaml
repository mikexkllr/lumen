id: logic.gametheory.nim
type: concept
title: Beat the Computer
summary: Nim – the game with a secret formula.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: warmup
    widget: nim
    prompt: The computer plays perfectly. Can you still win?
    params: { piles: [5], maxTake: 3 }
    hints:
      - Leave the computer 4 stones.
    explanation: Whoever faces 4 stones loses. You take 1 – after that, you always top up to 4.

  - kind: problem
    id: neun
    widget: nim
    prompt: Now with 9 stones. Same rules.
    params: { piles: [9], maxTake: 3 }
    hints:
      - Always leave the computer a multiple of 4.
    explanation: Take 1, which leaves 8. After that, you top up every computer move to 4.

  - kind: explain
    body: |
      In real **Nim**, there are several rows. You take as many stones as you like – but only from one row.
      The winning formula hides in the binary system.

  - kind: problem
    id: drei-reihen
    widget: nim
    prompt: Three rows with 3, 4, and 5 stones. The computer is waiting. Good luck!
    params: { piles: [3, 4, 5] }
    hints:
      - Try to leave rows of equal size – then you can mirror every move.
      - A good first move – take 2 from the row with 3.
    explanation: With 1, 4, 5 left, the computer is in trouble. After that, you mirror – from two equal rows, you keep making two equal rows.

  - kind: explain
    body: What is the secret formula?
    reveal:
      body: Write the rows in binary and add each place without carrying. If the result is 0 everywhere, the player to move loses. This is called the **nim-sum**.

  - kind: problem
    id: spiegeln
    widget: choice
    prompt: Two rows of 6 stones each, and it is the computer's turn. Who wins if you play smart?
    params:
      options:
        - { label: You, correct: true }
        - { label: The computer, feedback: "With two equal rows, you can copy every move in the other row." }
    hints:
      - Copy every computer move in the other row.
    explanation: You mirror every move. That way you take the last stone in the end.

srs:
  cards_from: [spiegeln, warmup]
