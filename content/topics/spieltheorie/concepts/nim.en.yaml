id: logic.gametheory.nim
type: concept
title: Beat the Computer
summary: Nim – the game with a secret formula.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: warmup
    widget: nim
    prompt: The computer plays perfectly. Can you still win?
    params: { piles: [5], maxTake: 3 }
    hints:
      - Leave the computer 4 stones.
    explanation: Whoever faces 4 stones loses. You take 1 – after that, you always top up to 4.

  - kind: problem
    id: neun
    widget: nim
    prompt: Now with 9 stones. Same rules.
    params: { piles: [9], maxTake: 3 }
    hints:
      - Always leave the computer a multiple of 4.
    explanation: Take 1, which leaves 8. After that, you top up every computer move to 4.

  - kind: explain
    id: s3
    body: |
      In real **Nim**, there are several rows. You take as many stones as you like – but only from one row.
      The winning formula hides in the binary system.

  - kind: problem
    id: drei-reihen
    widget: nim
    prompt: Three rows with 3, 4, and 5 stones. The computer is waiting. Good luck!
    params: { piles: [3, 4, 5] }
    hints:
      - Try to leave rows of equal size – then you can mirror every move.
      - A good first move – take 2 from the row with 3.
    explanation: With 1, 4, 5 left, the computer is in trouble. After that, you mirror – from two equal rows, you keep making two equal rows.

  - kind: explain
    id: s5
    body: What is the secret formula?
    reveal:
      body: Write the rows in binary and add each place without carrying. If the result is 0 everywhere, the player to move loses. This is called the **nim-sum**.

  - kind: problem
    id: spiegeln
    widget: choice
    prompt: Two rows of 6 stones each, and it is the computer's turn. Who wins if you play smart?
    params:
      options:
        - { label: You, correct: true }
        - { label: The computer, feedback: "With two equal rows, you can copy every move in the other row." }
    hints:
      - Copy every computer move in the other row.
    explanation: You mirror every move. That way you take the last stone in the end.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Nim with one heap: you take 1 to 3 stones, whoever takes the last wins. There are 9, it is your turn. How many do you take?"
    answer:
      value: 1
    hints:
      - Leave a multiple of 4.
    explanation: 9 − 1 = 8. After that you complete each of the computer’s moves to 4.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: nim
    prompt: "Three rows: 2, 4 and 7 stones. Any number from one row. There is exactly one winning move – find it!"
    params:
      piles:
        - 2
        - 4
        - 7
    hints:
      - "In binary: 010, 100, 111. The nim-sum is 001 = 1."
      - Which row gets smaller when you XOR it with 1? Only 7 XOR 1 = 6.
    explanation: Take 1 from the row of 7. 2, 4 and 6 have nim-sum 0 – after that you keep it at 0.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Three rows: 3, 4 and 5 stones. In binary: 011, 100, 101. The nim-sum is 010 = 2. You must bring it to 0. How many stones do you take from the row with 3?"
    answer:
      value: 2
    hints:
      - 011 must become 001 so that every column has an even number of ones.
    explanation: "1, 4 and 5: 001, 100, 101 – every column has two ones or none. Now the opponent loses."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: For a pile from which you may take 1 to 3 stones, the Grundy number is the remainder when dividing by 4. What is the Grundy number of such a pile with {{n}} stones?
    answer:
      value: "{{mod(n, 4)}}"
    hints:
      - Divide {{n}} by 4.
      - The remainder is the Grundy number.
    explanation: "Grundy number {{mod(n, 4)}}: the pile behaves like a nim heap of that size. When several games are played side by side, you XOR the Grundy numbers – just like Nim."
    difficulty: 3
    variants:
      params:
        n: int[5,30]
      defaults:
        n: 6

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: What does the Sprague–Grundy theorem say?
    params:
      options:
        - label: Every impartial game without chance behaves like a single nim heap.
          correct: true
        - label: The first player wins every game.
          feedback: Nim with two equal rows is lost by the first player.
        - label: Only Nim can be solved exactly.
          feedback: "On the contrary: the theorem carries the Nim solution over to many other games."
    hints:
      - '"Impartial" here means both players have the same moves in every position.'
      - Every position gets a number – the size of the matching nim heap.
    explanation: Every position has a Grundy number. At 0 the player to move loses. Sums of games are handled with the nim-sum. So Nim becomes a toolkit for whole families of games.
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what a losing position is and how you recognise it in Nim.
    params:
      keywords:
        - - jeder zug
          - jedem zug
          - egal
          - every move
          - whatever
        - - nim-summe
          - nimsumme
          - xor
          - nim-sum
          - nim sum
        - - "null"
          - zero
      sample: In a losing position every move leads to a position from which the opponent wins. In Nim you recognise it because the nim-sum is zero.
    difficulty: 3

srs:
  cards_from: [spiegeln, warmup]
