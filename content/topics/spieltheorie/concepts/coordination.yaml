id: logic.gametheory.coordination
type: concept
title: Treffpunkte ohne Absprache
summary: Wenn alle das Gleiche denken müssen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: treffen
    widget: choice
    prompt: Du sollst einen Fremden morgen in Paris treffen – ohne Absprache über Ort und Zeit. Wo und wann gehst du hin?
    params:
      options:
        - { label: Mittags am Eiffelturm, correct: true }
        - { label: Um 15:37 in einer Seitenstraße, feedback: "Darauf kommt der andere nie. Gesucht ist das Naheliegendste." }
    hints:
      - Was würde fast jeder wählen?
    explanation: Solche naheliegenden Lösungen heißen **Fokuspunkte**. Ohne Absprache wählt man das Offensichtliche.

  - kind: explain
    id: s2
    body: |
      Bei **Koordinationsspielen** gewinnen alle, wenn sie dasselbe wählen. Beispiel: Rechts- oder Linksverkehr. Beides funktioniert – Hauptsache, alle machen es gleich.

  - kind: problem
    id: art
    widget: buckets
    prompt: Koordination oder Konkurrenz?
    params:
      buckets: [{ label: Koordination }, { label: Konkurrenz }]
      items:
        - { label: Auf welcher Straßenseite fahren, bucket: Koordination }
        - { label: Welcher Ladestecker sich durchsetzt, bucket: Koordination }
        - { label: Zwei Bieter auf ein Haus, bucket: Konkurrenz }
        - { label: Elfmeter schießen und halten, bucket: Konkurrenz }
    hints:
      - Profitieren beide, wenn sie dasselbe tun?
    explanation: Bei Koordination gewinnen alle gemeinsam, bei Konkurrenz gewinnt einer auf Kosten des anderen.

  - kind: problem
    id: elfmeter
    widget: choice
    prompt: Warum schießen Profis beim Elfmeter mal links, mal rechts?
    params:
      options:
        - { label: "Wer berechenbar ist, wird durchschaut.", correct: true }
        - { label: Weil sie es vergessen., feedback: "Es ist Absicht – Zufall schützt vor Vorhersage." }
    hints:
      - Was macht der Torwart mit einem Muster?
    explanation: In Konkurrenzspielen ist Zufall eine Strategie. Man nennt das eine **gemischte Strategie**.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Zwei Jäger: Gemeinsam können sie einen Hirsch erlegen. Jeder allein fängt sicher einen Hasen. Was ist das Risiko?"
    params:
      options:
        - label: Wer auf den Hirsch setzt und allein bleibt, geht leer aus – Vertrauen entscheidet
          correct: true
        - label: Es gibt keines – Hirsch ist immer besser
          feedback: Nur wenn der andere mitmacht.
        - label: Hasen sind giftig
          feedback: Der Hase ist die sichere Wahl.
    hints:
      - Was passiert, wenn du auf den Hirsch wartest und der andere Hasen jagt?
    explanation: "Die **Hirschjagd**: zwei Gleichgewichte, eines besser, eines sicherer. Viele Teamprojekte sind genau so."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Beim Elfmeter: Der Schütze trifft links zu 90 %, wenn der Torwart falsch springt, sonst zu 50 %. Rechts gilt dasselbe. Wie oft sollte er links schießen, um nicht ausrechenbar zu sein? In Prozent."
    params:
      unit: "%"
    answer:
      value: 50
    hints:
      - Beide Seiten sind gleich gut – also gibt es keinen Grund, eine zu bevorzugen.
    explanation: "50 %. Eine **gemischte Strategie**: Zufall als Schutz davor, durchschaut zu werden."
    difficulty: 3

srs:
  cards_from: [art, elfmeter]
