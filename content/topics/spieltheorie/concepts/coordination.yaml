id: logic.gametheory.coordination
type: concept
title: Treffpunkte ohne Absprache
summary: Wenn alle das Gleiche denken müssen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: treffen
    widget: choice
    prompt: Du sollst einen Fremden morgen in Paris treffen – ohne Absprache über Ort und Zeit. Wo und wann gehst du hin?
    params:
      options:
        - { label: Mittags am Eiffelturm, correct: true }
        - { label: Um 15:37 in einer Seitenstraße, feedback: "Darauf kommt der andere nie. Gesucht ist das Naheliegendste." }
    hints:
      - Was würde fast jeder wählen?
    explanation: Solche naheliegenden Lösungen heißen **Fokuspunkte**. Ohne Absprache wählt man das Offensichtliche.

  - kind: explain
    id: s2
    body: |
      Bei **Koordinationsspielen** gewinnen alle, wenn sie dasselbe wählen. Beispiel: Rechts- oder Linksverkehr. Beides funktioniert – Hauptsache, alle machen es gleich.

  - kind: problem
    id: art
    widget: buckets
    prompt: Koordination oder Konkurrenz?
    params:
      buckets: [{ label: Koordination }, { label: Konkurrenz }]
      items:
        - { label: Auf welcher Straßenseite fahren, bucket: Koordination }
        - { label: Welcher Ladestecker sich durchsetzt, bucket: Koordination }
        - { label: Zwei Bieter auf ein Haus, bucket: Konkurrenz }
        - { label: Elfmeter schießen und halten, bucket: Konkurrenz }
    hints:
      - Profitieren beide, wenn sie dasselbe tun?
    explanation: Bei Koordination gewinnen alle gemeinsam, bei Konkurrenz gewinnt einer auf Kosten des anderen.

  - kind: problem
    id: elfmeter
    widget: choice
    prompt: Warum schießen Profis beim Elfmeter mal links, mal rechts?
    params:
      options:
        - { label: "Wer berechenbar ist, wird durchschaut.", correct: true }
        - { label: Weil sie es vergessen., feedback: "Es ist Absicht – Zufall schützt vor Vorhersage." }
    hints:
      - Was macht der Torwart mit einem Muster?
    explanation: In Konkurrenzspielen ist Zufall eine Strategie. Man nennt das eine **gemischte Strategie**.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Wollen hier alle dasselbe wählen – oder gerade nicht?
    params:
      buckets:
        - id: b1
          label: Alle dasselbe
        - id: b2
          label: Gegeneinander
      items:
        - label: Rechts- oder Linksverkehr
          bucket: b1
        - label: Welchen Messenger nutzen wir?
          bucket: b1
        - label: Das letzte Stück Kuchen
          bucket: b2
        - label: Treffpunkt in einer fremden Stadt
          bucket: b1
        - label: "Elfmeter: Schütze gegen Torwart"
          bucket: b2
    hints:
      - Gewinnen beide, wenn sie gleich wählen?
    explanation: Bei Koordination hilft Absprache. Beim Elfmeter hilft nur Unberechenbarkeit.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Zwei Jäger: Gemeinsam können sie einen Hirsch erlegen. Jeder allein fängt sicher einen Hasen. Was ist das Risiko?"
    params:
      options:
        - label: Wer auf den Hirsch setzt und allein bleibt, geht leer aus – Vertrauen entscheidet
          correct: true
        - label: Es gibt keines – Hirsch ist immer besser
          feedback: Nur wenn der andere mitmacht.
        - label: Hasen sind giftig
          feedback: Der Hase ist die sichere Wahl.
    hints:
      - Was passiert, wenn du auf den Hirsch wartest und der andere Hasen jagt?
    explanation: "Die **Hirschjagd**: zwei Gleichgewichte, eines besser, eines sicherer. Viele Teamprojekte sind genau so."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Zwei Autos kommen sich auf einer schmalen Straße entgegen. Beide weichen nach links oder nach rechts aus. Wie viele Nash-Gleichgewichte gibt es?
    params:
      options:
        - label: "Zwei: beide links oder beide rechts (aus ihrer Sicht)."
          correct: true
        - label: "Eins: beide rechts."
          feedback: Rechts ist nur Gewohnheit. Beide links funktioniert genauso.
        - label: Keins.
          feedback: Weichen beide gleich aus, will keiner allein wechseln – das ist ein Gleichgewicht.
    hints:
      - "Prüfe für jede der vier Kombinationen: Will einer allein wechseln?"
      - Bei gleicher Seite will keiner wechseln, bei verschiedener Seite beide.
    explanation: Koordinationsspiele haben oft **mehrere** Gleichgewichte. Welches gilt, legen Gewohnheiten oder Gesetze fest – etwa der Rechtsverkehr.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Bei Schere, Stein, Papier: Mit welcher Wahrscheinlichkeit spielt man im Gleichgewicht »Stein«? In Prozent, auf eine Stelle."
    answer:
      value: 33.3
      tolerance: 0.1
    hints:
      - Wäre Stein häufiger, könnte der Gegner öfter Papier spielen.
      - Nur wenn alle drei gleich oft kommen, kann der Gegner nichts ausnutzen.
    explanation: "Je 1/3 ≈ 33,3 %. Dieses Spiel hat **kein** reines Gleichgewicht, nur ein **gemischtes**: Zufall ist hier die beste Strategie."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Beim Elfmeter: Der Schütze trifft links zu 90 %, wenn der Torwart falsch springt, sonst zu 50 %. Rechts gilt dasselbe. Wie oft sollte er links schießen, um nicht ausrechenbar zu sein? In Prozent."
    params:
      unit: "%"
    answer:
      value: 50
    hints:
      - Beide Seiten sind gleich gut – also gibt es keinen Grund, eine zu bevorzugen.
    explanation: "50 %. Eine **gemischte Strategie**: Zufall als Schutz davor, durchschaut zu werden."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Elfmeter. Schuss links: Tor zu 50 %, wenn der Torwart links springt, sonst zu 90 %. Schuss rechts: Tor zu 90 %, wenn er links springt, sonst zu 30 %. Wie oft springt der Torwart im Gleichgewicht links? In Prozent."
    answer:
      value: 60
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 50
        misconception: symmetric
        text: Das wäre richtig, wenn beide Seiten des Schützen gleich stark wären. Rechts ist er schwächer.
    hints:
      - Der Torwart springt mit q links. Er wählt q so, dass dem Schützen beide Seiten **gleich** viel bringen.
      - "Links: 0,5q + 0,9(1 − q). Rechts: 0,9q + 0,3(1 − q). Setze gleich."
    explanation: 0,9 − 0,4q = 0,3 + 0,6q ergibt q = 0,6. Dann trifft der Schütze auf beiden Seiten zu 66 %. Man mischt, um den **Gegner** gleichgültig zu machen – nicht sich selbst.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Warum muss im gemischten Gleichgewicht jede gespielte Möglichkeit dem Spieler gleich viel bringen?
    params:
      options:
        - label: Brächte eine mehr, würde er nur noch sie wählen – dann wäre es kein Gleichgewicht.
          correct: true
        - label: Weil der Zufall fair sein muss.
          feedback: Fairness spielt keine Rolle – es geht um Eigennutz.
        - label: Muss sie nicht.
          feedback: "Doch: Sonst lohnt es sich, von der Mischung abzuweichen."
    hints:
      - Stell dir vor, »links« bringt etwas mehr als »rechts«. Was würde der Spieler tun?
      - Wäre seine Mischung dann noch eine beste Antwort?
    explanation: "Das ist das **Indifferenzprinzip**. Nash bewies 1950: Jedes endliche Spiel hat mindestens ein Gleichgewicht – wenn man gemischte Strategien zulässt."
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Schütze beim Elfmeter mit Absicht zufällig schießen soll.
    params:
      keywords:
        - - zufall
          - zufällig
          - random
        - - berechenbar
          - vorhersag
          - durchschau
          - predictable
          - predict
          - read
        - - ausnutz
          - ausgenutzt
          - exploit
      sample: Wer immer gleich schießt, ist berechenbar, und der Torwart springt dorthin. Zufällig zu mischen verhindert, dass der Gegner ein Muster ausnutzt.
    difficulty: 3

srs:
  cards_from: [art, elfmeter]
