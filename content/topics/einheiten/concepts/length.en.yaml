id: math.units.length
type: concept
title: "Converting lengths"
summary: "Millimetres, centimetres, metres, kilometres – and how to jump between them."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many centimetres tall is a room door?"
    params:
      min: 50
      max: 400
      unit: cm
    answer:
      value: 200
      tolerance: 20
    explanation: About 2 m, so roughly 200 cm. A tall adult just fits through.

  - kind: explain
    id: c1
    body: We measure length in **metres**. 1 m = 100 cm = 1000 mm. And 1 km = 1000 m. Kilo means thousand, centi one hundredth, milli one thousandth.

  - kind: problem
    id: c2
    widget: numberline
    prompt: The number line is a metre stick. Mark 15 cm.
    params:
      min: 0
      max: 1
      ticks: 20
      labels: decimals
    answer:
      value: 0.15
    hints:
      - 100 cm make 1 m.
      - 15 cm = 0.15 m.
    explanation: "15 cm are 15 hundredths of a metre: 0.15 m."

  - kind: problem
    id: c3
    widget: numeric
    prompt: How many centimetres are {{m}} m?
    params:
      unit: cm
    answer:
      value: "{{m * 100}}"
    feedback:
      - when: numval(state.input) == m * 10
        misconception: factor-10
        text: From m to cm is times 100, not times 10.
    hints:
      - 1 m = 100 cm.
      - Work out {{m}} · 100.
    explanation: "{{m}} · 100 = {{m * 100}} cm. The decimal point moves two places right."
    variants:
      params:
        m: choice[1.5,2.3,0.8,4.25,3,12]
      defaults:
        m: 1.5

  - kind: problem
    id: c4
    widget: numeric
    prompt: How many metres are {{c}} cm?
    params:
      unit: m
    answer:
      value: "{{c / 100}}"
    feedback:
      - when: numval(state.input) == c * 100
        misconception: wrong-direction
        text: Metres are bigger than centimetres – the number must get smaller.
    hints:
      - Big unit, small number.
      - Divide by 100.
    explanation: "{{c}} : 100 = {{c / 100}} m."
    variants:
      params:
        c: choice[250,75,1200,5,340]
      defaults:
        c: 250

  - kind: problem
    id: c5
    widget: order
    prompt: Order from shortest to longest.
    params:
      items:
        - label: 3 mm
        - label: 2 cm
        - label: 25 mm
        - label: 0.5 m
        - label: 80 cm
        - label: 1 km
    hints:
      - Convert everything to millimetres.
      - 2 cm = 20 mm, 0.5 m = 500 mm.
    explanation: 3 mm < 20 mm < 25 mm < 500 mm < 800 mm < 1,000,000 mm.

  - kind: problem
    id: c6
    widget: buckets
    prompt: Which unit fits best?
    params:
      buckets:
        - id: b1
          label: mm
        - id: b2
          label: cm
        - id: b3
          label: m
        - id: b4
          label: km
      items:
        - label: Ant
          bucket: b1
        - label: Grain of rice
          bucket: b1
        - label: Phone
          bucket: b2
        - label: Sports hall
          bucket: b3
        - label: Way to the next town
          bucket: b4
    hints:
      - Roughly how big is the thing?
      - Tiny things in mm, huge distances in km.
    explanation: Ants and rice grains in mm, phones in cm, halls in m, distances between towns in km.

  - kind: explain
    id: d1
    depth: 2
    body: From mm to cm, from cm to dm and from dm to m, each step is times 10. From m to km it is a step of a thousand. This order is the **decimal system**.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A marathon is 42.195 km long. How many metres is that?
    params:
      unit: m
    answer:
      value: 42195
    feedback:
      - when: numval(state.input) == 4219.5
        misconception: factor-100
        text: From km to m is times 1000, not times 100.
    hints:
      - 1 km = 1000 m.
      - The decimal point moves three places right.
    explanation: 42.195 · 1000 = 42,195 m.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A sheet of paper is 0.1 mm thick. How tall is a stack of 500 sheets – in centimetres?
    params:
      unit: cm
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 50
        misconception: units
        text: Those are millimetres. 10 mm make 1 cm.
    hints:
      - 500 · 0.1 mm = 50 mm.
      - 50 mm in cm.
    explanation: 50 mm = 5 cm – one pack of printer paper.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "A **metre** is now defined by light: it is the distance light travels in 1/299,792,458 of a second. That way every lab in the world can reproduce it exactly."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A screen has a 10-inch diagonal. 1 inch is 2.54 cm. How many centimetres is that?
    params:
      unit: cm
    answer:
      value: 25.4
    hints:
      - Times 2.54.
      - 10 · 2.54 = ?
    explanation: 25.4 cm. Inches, feet and miles are older units that do not go in steps of ten.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: Light travels about 300,000 km per second. How many kilometres does it cover in one minute?
    params:
      unit: km
    answer:
      value: 18000000
    hints:
      - One minute has 60 seconds.
      - 300,000 · 60.
    explanation: 18 million km per minute. Light still needs just over 8 minutes to reach the Sun.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how to convert 3.5 m into centimetres.
    params:
      keywords:
        - - "100"
          - hundert
          - hundred
        - - mal
          - times
          - multipl
        - - komma
          - stellen
          - decimal
          - places
          - point
      sample: "A metre has 100 centimetres. So I take 3.5 times 100. The decimal point moves two places right: 350 cm."
    explanation: "Key idea: into the smaller unit means multiplying by the conversion factor."
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
