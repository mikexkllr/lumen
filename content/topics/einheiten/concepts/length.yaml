id: math.units.length
type: concept
title: "Längen umrechnen"
summary: "Millimeter, Zentimeter, Meter, Kilometer – und wie man zwischen ihnen springt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 11
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Zentimeter hoch ist eine Zimmertür?"
    params:
      min: 50
      max: 400
      unit: cm
    answer:
      value: 200
      tolerance: 20
    explanation: Etwa 2 m, also rund 200 cm. Ein großer Erwachsener passt gerade hindurch.

  - kind: explain
    id: c1
    body: Längen messen wir in **Metern**. 1 m = 100 cm = 1000 mm. Und 1 km = 1000 m. Kilo heißt tausend, Zenti ein Hundertstel, Milli ein Tausendstel.

  - kind: problem
    id: c2
    widget: numberline
    prompt: Der Zahlenstrahl ist ein Meterstab. Markiere 15 cm.
    params:
      min: 0
      max: 1
      ticks: 20
      labels: decimals
    answer:
      value: 0.15
    hints:
      - 100 cm sind 1 m.
      - 15 cm = 0,15 m.
    explanation: "15 cm sind 15 Hundertstel Meter: 0,15 m."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Wie viele Zentimeter sind {{m}} m?
    params:
      unit: cm
    answer:
      value: "{{m * 100}}"
    feedback:
      - when: numval(state.input) == m * 10
        misconception: factor-10
        text: Von m zu cm ist es mal 100, nicht mal 10.
    hints:
      - 1 m = 100 cm.
      - Rechne {{m}} · 100.
    explanation: "{{m}} · 100 = {{m * 100}} cm. Das Komma rückt zwei Stellen nach rechts."
    variants:
      params:
        m: choice[1.5,2.3,0.8,4.25,3,12]
      defaults:
        m: 1.5

  - kind: problem
    id: c4
    widget: numeric
    prompt: Wie viele Meter sind {{c}} cm?
    params:
      unit: m
    answer:
      value: "{{c / 100}}"
    feedback:
      - when: numval(state.input) == c * 100
        misconception: wrong-direction
        text: Meter sind größer als Zentimeter – die Zahl muss kleiner werden.
    hints:
      - Große Einheit, kleine Zahl.
      - Teile durch 100.
    explanation: "{{c}} : 100 = {{c / 100}} m."
    variants:
      params:
        c: choice[250,75,1200,5,340]
      defaults:
        c: 250

  - kind: problem
    id: c5
    widget: order
    prompt: Ordne von kurz nach lang.
    params:
      items:
        - label: 3 mm
        - label: 2 cm
        - label: 25 mm
        - label: 0,5 m
        - label: 80 cm
        - label: 1 km
    hints:
      - Rechne alles in Millimeter um.
      - 2 cm = 20 mm, 0,5 m = 500 mm.
    explanation: 3 mm < 20 mm < 25 mm < 500 mm < 800 mm < 1 000 000 mm.

  - kind: problem
    id: c6
    widget: buckets
    prompt: Welche Einheit passt am besten?
    params:
      buckets:
        - id: b1
          label: mm
        - id: b2
          label: cm
        - id: b3
          label: m
        - id: b4
          label: km
      items:
        - label: Ameise
          bucket: b1
        - label: Reiskorn
          bucket: b1
        - label: Handy
          bucket: b2
        - label: Turnhalle
          bucket: b3
        - label: Weg zur nächsten Stadt
          bucket: b4
    hints:
      - Wie groß ist das Ding ungefähr?
      - Kleines in mm, Riesiges in km.
    explanation: Ameisen und Reiskörner misst man in mm, Handys in cm, Hallen in m, Wege zwischen Städten in km.

  - kind: explain
    id: d1
    depth: 2
    body: Von mm zu cm, von cm zu dm und von dm zu m ist jeder Schritt mal 10. Von m zu km ist es ein Tausenderschritt. Diese Ordnung heißt **Dezimalsystem**.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Marathon ist 42,195 km lang. Wie viele Meter sind das?
    params:
      unit: m
    answer:
      value: 42195
    feedback:
      - when: numval(state.input) == 4219.5
        misconception: factor-100
        text: Von km zu m ist es mal 1000, nicht mal 100.
    hints:
      - 1 km = 1000 m.
      - Das Komma rückt drei Stellen nach rechts.
    explanation: 42,195 · 1000 = 42 195 m.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Ein Blatt Papier ist 0,1 mm dick. Wie hoch ist ein Stapel aus 500 Blatt – in Zentimetern?
    params:
      unit: cm
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 50
        misconception: units
        text: Das sind Millimeter. 10 mm sind 1 cm.
    hints:
      - 500 · 0,1 mm = 50 mm.
      - 50 mm in cm.
    explanation: 50 mm = 5 cm – ein Paket Druckerpapier.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Ein **Meter** ist heute über das Licht festgelegt: Er ist die Strecke, die Licht in 1/299 792 458 Sekunde zurücklegt. So kann jedes Labor der Welt ihn genau nachbauen."

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Ein Bildschirm hat 10 Zoll Diagonale. 1 Zoll sind 2,54 cm. Wie viele Zentimeter sind das?
    params:
      unit: cm
    answer:
      value: 25.4
    hints:
      - Mal 2,54.
      - 10 · 2,54 = ?
    explanation: 25,4 cm. Zoll, Fuß und Meile sind ältere Einheiten, die nicht in Zehnerschritten gehen.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: numeric
    prompt: Licht legt etwa 300 000 km pro Sekunde zurück. Wie viele Kilometer schafft es in einer Minute?
    params:
      unit: km
    answer:
      value: 18000000
    hints:
      - Eine Minute hat 60 Sekunden.
      - 300 000 · 60.
    explanation: 18 Millionen km pro Minute. Bis zur Sonne braucht das Licht trotzdem gut 8 Minuten.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man 3,5 m in Zentimeter umrechnet.
    params:
      keywords:
        - - "100"
          - hundert
          - hundred
        - - mal
          - times
          - multipl
        - - komma
          - stellen
          - decimal
          - places
          - point
      sample: "Ein Meter hat 100 Zentimeter. Also nehme ich 3,5 mal 100. Das Komma rückt zwei Stellen nach rechts: 350 cm."
    explanation: "Kernidee: in die kleinere Einheit heißt mal den Umrechnungsfaktor."
    difficulty: 3

srs:
  cards_from: ["c3", "c4", "d2"]
