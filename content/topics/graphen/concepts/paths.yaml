id: cs.graphs.paths
type: concept
title: Kürzeste Wege
summary: Weniger Stationen heißt nicht kürzer.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Abkürzung gesucht
    body: Dein Navi findet in Sekunden den besten Weg durch Millionen Kreuzungen. Hier sind es nur sechs. Tippe einen Weg von »Start« bis »Ziel«. Unten stehen die Minuten. Geht es **noch schneller**?
    visual:
      widget: network
      interactive: true
      params:
        start: S
        end: Z
        unit: min
        nodes:
          - id: S
            x: 8
            y: 50
            label: Start
          - id: A
            x: 35
            y: 10
          - id: B
            x: 35
            y: 90
          - id: C
            x: 55
            y: 55
          - id: D
            x: 75
            y: 90
          - id: Z
            x: 92
            y: 50
            label: Ziel
        edges:
          - a: S
            b: A
            w: 5
          - a: A
            b: Z
            w: 9
          - a: S
            b: B
            w: 3
          - a: B
            b: C
            w: 2
          - a: C
            b: Z
            w: 6
          - a: B
            b: D
            w: 4
          - a: D
            b: Z
            w: 2
          - a: C
            b: D
            w: 3
          - a: A
            b: C
            w: 4

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Kreuzungen (Knoten) hat das Straßennetz Europas ungefähr – in Millionen?"
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 50
      within: 80
    explanation: Rund 50 Millionen. Ein Navi findet darin trotzdem in Millisekunden den kürzesten Weg.

  - kind: problem
    id: route-a-f
    widget: network
    prompt: Finde den kürzesten Weg von A nach F. Tippe die Orte nacheinander an.
    params:
      start: A
      end: F
      unit: km
      nodes:
        - { id: A, x: 4, y: 50 }
        - { id: B, x: 35, y: 10 }
        - { id: C, x: 35, y: 90 }
        - { id: D, x: 66, y: 10 }
        - { id: E, x: 66, y: 90 }
        - { id: F, x: 96, y: 50 }
      edges:
        - { a: A, b: B, w: 4 }
        - { a: A, b: C, w: 2 }
        - { a: B, b: C, w: 1 }
        - { a: B, b: D, w: 5 }
        - { a: C, b: E, w: 3 }
        - { a: C, b: D, w: 8 }
        - { a: D, b: F, w: 2 }
        - { a: E, b: F, w: 6 }
    hints:
      - Der direkte Weg von A nach B ist nicht der günstigste.
      - Über C kommst du billiger zu B.
    explanation: A → C → B → D → F kostet 2 + 1 + 5 + 2 = 10 km.

  - kind: explain
    id: s2
    body: |
      Ein **Netzwerk** besteht aus **Knoten** (Orten) und **Kanten** (Verbindungen mit einer Länge).
      Navis lösen genau diese Aufgabe – mit Millionen Kreuzungen.

  - kind: explain
    id: s3
    body: Ist der kürzeste Weg immer der mit den wenigsten Stationen?
    reveal:
      body: Nein. Ein Umweg über mehr Knoten kann kürzer sein – so wie eben über C nach B.

  - kind: problem
    id: route-s-t
    widget: network
    prompt: Neue Karte. Finde den kürzesten Weg von S nach T.
    params:
      start: S
      end: T
      unit: km
      nodes:
        - { id: S, x: 4, y: 30 }
        - { id: A, x: 32, y: 6 }
        - { id: B, x: 32, y: 62 }
        - { id: C, x: 64, y: 30 }
        - { id: D, x: 64, y: 94 }
        - { id: T, x: 96, y: 60 }
      edges:
        - { a: S, b: A, w: 3 }
        - { a: S, b: B, w: 6 }
        - { a: A, b: B, w: 2 }
        - { a: A, b: C, w: 4 }
        - { a: B, b: C, w: 1 }
        - { a: C, b: T, w: 5 }
        - { a: B, b: D, w: 4 }
        - { a: D, b: T, w: 3 }
    hints:
      - Rechne für jeden Ort aus, wie weit er höchstens von S entfernt ist.
    explanation: S → A → B → C → T = 3 + 2 + 1 + 5 = 11 km.

  - kind: problem
    id: laenge
    widget: numeric
    visual:
      widget: network
      params:
        unit: km
        nodes:
          - { id: A, x: 6, y: 50 }
          - { id: B, x: 50, y: 8 }
          - { id: C, x: 50, y: 92 }
          - { id: D, x: 94, y: 50 }
        edges:
          - { a: A, b: B, w: 2 }
          - { a: B, b: D, w: 3 }
          - { a: A, b: C, w: 4 }
          - { a: C, b: D, w: 1 }
          - { a: B, b: C, w: 1 }
    prompt: Wie lang ist der kürzeste Weg von A nach D?
    params: { unit: km }
    answer: { value: 4 }
    feedback:
      - when: "numval(state.input) == 5"
        misconception: direct-route
        text: Fast. Es gibt eine Abkürzung über die kurze Kante in der Mitte.
    hints:
      - Probier A → B → C → D.
    explanation: A → B → C → D = 2 + 1 + 1 = 4 km.

  - kind: problem
    id: reihenfolgen
    widget: choice
    prompt: Ein Lieferdienst hat 10 Stopps. Wie viele Reihenfolgen gibt es, sie abzufahren?
    params:
      options:
        - { label: "Rund 3,6 Millionen", correct: true }
        - { label: "100", feedback: "Das wäre 10 · 10. Mit jedem Stopp sinkt aber die Auswahl und es wird multipliziert." }
        - { label: "55", feedback: "Das ist 1 + 2 + … + 10. Reihenfolgen multiplizieren sich." }
        - { label: Rund 1000, feedback: "Viel mehr. Rechne 10 · 9 · 8 · … · 1." }
    hints:
      - Für den ersten Stopp gibt es 10 Möglichkeiten, dann 9, dann 8 …
    explanation: 10 · 9 · … · 1 = 3 628 800. Darum probieren Computer nicht alles aus, sondern nutzen schlaue Abkürzungen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Dijkstras Algorithmus findet kürzeste Wege. Was ist seine Grundidee?
    params:
      options:
        - label: Immer den nächstgelegenen noch unbesuchten Ort abschließen und von dort weiterrechnen
          correct: true
        - label: Alle möglichen Wege ausprobieren
          feedback: Das wären viel zu viele.
        - label: Immer die kürzeste Kante nehmen
          feedback: Eine kurze erste Kante kann in eine Sackgasse führen.
    hints:
      - Der nächstgelegene Ort kann auf keinem Umweg schneller erreicht werden.
    explanation: "Wie eine Welle, die sich vom Start ausbreitet: Was sie zuerst erreicht, ist sicher am nächsten."
    difficulty: 2

  - kind: explain
    id: cs-d1
    depth: 2
    body: "So arbeitet **Dijkstra**: Jeder Ort hat eine vorläufige Entfernung. Nimm den nächsten noch offenen Ort und mach ihn fest. Dann prüfe, ob es über ihn zu seinen Nachbarn kürzer geht."

  - kind: problem
    id: cs-d2
    depth: 2
    widget: network
    prompt: Finde den kürzesten Weg von S nach T. Denk wie Dijkstra – der kürzeste Weg hat hier viele Stationen.
    params:
      start: S
      end: T
      unit: km
      nodes:
        - id: S
          x: 4
          y: 50
        - id: A
          x: 30
          y: 12
        - id: B
          x: 30
          y: 88
        - id: D
          x: 55
          y: 55
        - id: C
          x: 72
          y: 12
        - id: E
          x: 72
          y: 88
        - id: T
          x: 96
          y: 50
      edges:
        - a: S
          b: A
          w: 2
        - a: S
          b: B
          w: 5
        - a: A
          b: B
          w: 2
        - a: A
          b: C
          w: 7
        - a: B
          b: D
          w: 3
        - a: D
          b: C
          w: 1
        - a: C
          b: T
          w: 2
        - a: D
          b: E
          w: 4
        - a: B
          b: E
          w: 7
        - a: E
          b: T
          w: 2
    hints:
      - "Über A ist B schneller erreicht als direkt: 2 + 2 = 4."
      - Von B über D nach C ist kürzer als von A direkt nach C.
    explanation: "S → A → B → D → C → T: 2 + 2 + 3 + 1 + 2 = 10 km. Sechs Orte, und doch der kürzeste Weg."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: order
    prompt: In welcher Reihenfolge macht Dijkstra im Netz eben die Orte fest, wenn er bis zum Schluss weiterläuft?
    params:
      items:
        - label: S (0)
        - label: A (2)
        - label: B (4)
        - label: D (7)
        - label: C (8)
        - label: T (10)
        - label: E (11)
    hints:
      - Immer der offene Ort mit der kleinsten Entfernung zuerst.
      - B ist über A bei 4, D über B bei 7.
    explanation: "Die Entfernungen steigen beim Festmachen nur an: 0, 2, 4, 7, 8, 10, 11. Darum ist ein fest gemachter Ort endgültig."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Das Problem des Handlungsreisenden: die kürzeste Rundreise durch 50 Städte finden. Warum ist das so schwer?"
    params:
      options:
        - label: Es gibt mehr Reihenfolgen als Atome im Universum – und kein Verfahren, das sie geschickt umgeht
          correct: true
        - label: Weil Computer keine Entfernungen berechnen können
          feedback: Das können sie mühelos.
        - label: Weil es keine Lösung gibt
          feedback: Es gibt immer eine beste Route – man findet sie nur nicht schnell.
    hints:
      - 49! Reihenfolgen – eine Zahl mit 63 Stellen.
    explanation: Ein **NP-schweres** Problem. In der Praxis nutzt man Näherungen, die fast optimal sind.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Warum versagt Dijkstra, wenn manche Kanten negative Längen haben?
    params:
      options:
        - label: Ein fest gemachter Ort könnte über eine negative Kante später doch noch billiger werden
          correct: true
        - label: Er rechnet dann mit falschen Zahlen
          feedback: Die Rechnung stimmt – nur die Annahme »fest heißt endgültig« nicht.
        - label: Er versagt nicht
          feedback: Ein Gegenbeispiel mit drei Orten reicht.
    hints:
      - Warum durfte man einen Ort bisher endgültig festmachen?
      - Jeder Umweg war bisher länger – mit negativen Kanten nicht mehr.
    explanation: Für negative Kanten nimmt man das Verfahren von Bellman und Ford. Es ist langsamer, erkennt aber sogar Kreise mit negativer Länge.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Dijkstra mit Prioritätswarteschlange braucht etwa (Kanten + Knoten) · log₂(Knoten) Schritte. Wie viele Millionen sind das für 1 Million Knoten und 3 Millionen Kanten?
    answer:
      value: 80
      tolerance: 2
    hints:
      - log₂ einer Million ist etwa 20.
      - (3 + 1) Millionen · 20.
    explanation: 4 Millionen · 20 = 80 Millionen Schritte – auf dem Handy eine Zehntelsekunde. Darum rechnen Navis in Echtzeit.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Navis nutzen oft A* statt reinem Dijkstra. Was ist der Trick?
    params:
      options:
        - label: Sie schätzen die Restentfernung per Luftlinie und suchen zuerst in Richtung Ziel
          correct: true
        - label: Sie nehmen immer die Autobahn
          feedback: Das wäre eine Faustregel ohne Garantie.
        - label: Sie raten zufällig
          feedback: A* ist planvoll und findet weiterhin den kürzesten Weg.
    hints:
      - Dijkstra breitet sich wie ein Kreis in alle Richtungen aus.
      - Die Luftlinie ist nie länger als der echte Weg.
    explanation: Weil die Luftlinie nie überschätzt, findet A* garantiert den kürzesten Weg – besucht aber viel weniger Orte.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Dijkstra den kürzesten Weg findet.
    params:
      keywords:
        - - nächst
          - kleinste
          - closest
          - smallest
          - nearest
        - - fest
          - endgültig
          - final
          - settle
          - fix
        - - nachbar
          - neighbo
        - - kürzer
          - verbesser
          - shorter
          - improve
          - update
      sample: Jeder Ort hat eine vorläufige Entfernung, der Start 0. Ich nehme immer den nächsten offenen Ort und mache ihn fest – seine Entfernung ist dann endgültig. Für jeden Nachbarn prüfe ich, ob der Weg über diesen Ort kürzer ist, und verbessere die Zahl.
    difficulty: 3

srs:
  cards_from: [laenge, route-s-t]
