id: cs.graphs.coloring
type: concept
title: Coloring without conflicts
summary: From maps to exam schedules.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Neighboring countries on a map should get different colors.
      As a network, each country is a node. A shared border is an edge.

  - kind: problem
    id: fuenfeck
    widget: network
    prompt: Color all the points. Connected points need different colors. You have 3 colors.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: A, x: 50, y: 6 }
        - { id: B, x: 92, y: 38 }
        - { id: C, x: 76, y: 94 }
        - { id: D, x: 24, y: 94 }
        - { id: E, x: 8, y: 38 }
      edges:
        - { a: A, b: B }
        - { a: B, b: C }
        - { a: C, b: D }
        - { a: D, b: E }
        - { a: E, b: A }
    hints:
      - Tap a point several times to change its color.
      - Alternating two colors almost works. One point needs the third.
    explanation: Two colors alternate, and the last point gets the third.

  - kind: problem
    id: zwei-farben
    widget: choice
    prompt: Are 2 colors enough for the pentagon?
    params:
      options:
        - { label: "No. A cycle with an odd number of points needs 3.", correct: true }
        - { label: "Yes, if you start cleverly.", feedback: "Try it. When you alternate, two equal colors meet at the end." }
        - { label: "Yes, always.", feedback: "With 5 points in a cycle, alternating does not work." }
    hints:
      - Alternate in your head. Red, blue, red, blue, …?
    explanation: With an odd length, the alternation clashes with itself. Even cycles manage with 2 colors.

  - kind: explain
    body: |
      The same problem hides in **timetables**. Subjects that share students must not be scheduled at the same time.
      The colors are then time slots.

  - kind: problem
    id: pruefungen
    widget: network
    prompt: Connected subjects share students. Assign them to 3 time slots without a conflict.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: Ma, x: 10, y: 22 }
        - { id: Bi, x: 50, y: 6 }
        - { id: Ch, x: 90, y: 22 }
        - { id: Ku, x: 28, y: 92 }
        - { id: Sp, x: 72, y: 92 }
      edges:
        - { a: Ma, b: Bi }
        - { a: Bi, b: Ch }
        - { a: Ma, b: Ch }
        - { a: Ch, b: Sp }
        - { a: Ku, b: Sp }
        - { a: Ma, b: Ku }
    hints:
      - Math (Ma), biology (Bi) and chemistry (Ch) are all connected. They need three different colors.
    explanation: The triangle uses all three time slots. Art (Ku) and PE (Sp) fit into the remaining gaps.

  - kind: explain
    body: How many colors does any map need at most, however complicated?
    reveal:
      body: Four. This is the **four color theorem**. It was proved in 1976, as one of the first major theorems proved with computer help.

srs:
  cards_from: [zwei-farben, pruefungen]
