id: cs.graphs.coloring
type: concept
title: Coloring without conflicts
summary: From maps to exam schedules.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "What do you think: how many colours suffice for **any** map if neighbours must never share a colour?"
    params:
      options:
        - label: "4"
          correct: true
        - label: "3"
          feedback: Some maps need a fourth colour.
        - label: "7"
          feedback: Fewer will do.
    hints:
      - Surprisingly few.
    explanation: Four always suffice. The proof came only in 1976 – with a computer.

  - kind: explain
    id: s1
    body: |
      Neighboring countries on a map should get different colors.
      As a network, each country is a **node**. A shared border is an edge.

  - kind: problem
    id: fuenfeck
    widget: network
    prompt: Color all the points. Connected points need different colors. You have 3 colors.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: A, x: 50, y: 6 }
        - { id: B, x: 92, y: 38 }
        - { id: C, x: 76, y: 94 }
        - { id: D, x: 24, y: 94 }
        - { id: E, x: 8, y: 38 }
      edges:
        - { a: A, b: B }
        - { a: B, b: C }
        - { a: C, b: D }
        - { a: D, b: E }
        - { a: E, b: A }
    hints:
      - Tap a point several times to change its color.
      - Alternating two colors almost works. One point needs the third.
    explanation: Two colors alternate, and the last point gets the third.

  - kind: problem
    id: zwei-farben
    widget: choice
    prompt: Are 2 colors enough for the pentagon?
    params:
      options:
        - { label: "No. A cycle with an odd number of points needs 3.", correct: true }
        - { label: "Yes, if you start cleverly.", feedback: "Try it. When you alternate, two equal colors meet at the end." }
        - { label: "Yes, always.", feedback: "With 5 points in a cycle, alternating does not work." }
    hints:
      - Alternate in your head. Red, blue, red, blue, …?
    explanation: With an odd length, the alternation clashes with itself. Even cycles manage with 2 colors.

  - kind: explain
    id: s4
    body: |
      The same problem hides in **timetables**. Subjects that share students must not be scheduled at the same time.
      The colors are then time slots.

  - kind: problem
    id: pruefungen
    widget: network
    prompt: Connected subjects share students. Assign them to 3 time slots without a conflict.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: Ma, x: 10, y: 22 }
        - { id: Bi, x: 50, y: 6 }
        - { id: Ch, x: 90, y: 22 }
        - { id: Ku, x: 28, y: 92 }
        - { id: Sp, x: 72, y: 92 }
      edges:
        - { a: Ma, b: Bi }
        - { a: Bi, b: Ch }
        - { a: Ma, b: Ch }
        - { a: Ch, b: Sp }
        - { a: Ku, b: Sp }
        - { a: Ma, b: Ku }
    hints:
      - Math (Ma), biology (Bi) and chemistry (Ch) are all connected. They need three different colors.
    explanation: The triangle uses all three time slots. Art (Ku) and PE (Sp) fit into the remaining gaps.

  - kind: explain
    id: s6
    body: How many colors does any map need at most, however complicated?
    reveal:
      body: Four. This is the **four color theorem**. It was proved in 1976, as one of the first major theorems proved with computer help.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Three countries all border one another: each touches the other two. How many colours are needed at least?"
    answer:
      value: 3
    hints:
      - No two may share a colour.
    explanation: Three. Every country is a neighbour of every other.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A network can be coloured with **two** colours. What do you then know about its cycles?
    params:
      options:
        - label: All cycles have even length
          correct: true
        - label: It has no cycles at all
          feedback: A square is a cycle and two-colourable.
        - label: All cycles have odd length
          feedback: A triangle already needs three colours.
    hints:
      - With the pentagon it failed. And with the square?
    explanation: "Such networks are called **bipartite**: two groups, edges only between them. Like applicants and jobs."
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: network
    prompt: This time you have only 2 colours. Colour the network without a conflict.
    params:
      mode: color
      colors: 2
      nodes:
        - id: A
          x: 10
          y: 20
        - id: B
          x: 50
          y: 6
        - id: C
          x: 90
          y: 20
        - id: D
          x: 90
          y: 80
        - id: E
          x: 50
          y: 94
        - id: F
          x: 10
          y: 80
      edges:
        - a: A
          b: B
        - a: B
          b: C
        - a: C
          b: D
        - a: D
          b: E
        - a: E
          b: F
        - a: F
          b: A
        - a: A
          b: D
        - a: B
          b: E
    hints:
      - Give A a colour. Then each neighbour's colour is forced.
      - Alternate around the circle.
    explanation: A, C, E get one colour, B, D, F the other. The cross links fit too – the network has only even cycles.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: network
    prompt: "A wheel: a hub and a pentagon around it. Colour it without conflicts."
    params:
      mode: color
      colors: 4
      nodes:
        - id: M
          x: 50
          y: 50
        - id: P1
          x: 50
          y: 5
        - id: P2
          x: 93
          y: 36
        - id: P3
          x: 77
          y: 94
        - id: P4
          x: 23
          y: 94
        - id: P5
          x: 7
          y: 36
      edges:
        - a: P1
          b: P2
        - a: P2
          b: P3
        - a: P3
          b: P4
        - a: P4
          b: P5
        - a: P5
          b: P1
        - a: M
          b: P1
        - a: M
          b: P2
        - a: M
          b: P3
        - a: M
          b: P4
        - a: M
          b: P5
    hints:
      - The hub touches all – it needs a colour of its own.
      - A pentagon alone already needs 3 colours.
    explanation: "1 colour for the hub, 3 for the odd pentagon: 4 in total."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: What is the minimum number of colours for the wheel of hub and pentagon?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: odd-cycle
        text: The pentagon already needs 3, and the hub touches all three colours.
    hints:
      - A cycle with an odd number of corners needs 3 colours.
      - The hub may not take any of them.
    explanation: 3 + 1 = 4. The wheel is an example without four mutual neighbours that still needs 4 colours.
    difficulty: 2

  - kind: explain
    id: cs-d4
    depth: 2
    body: "**Greedy colouring** goes through the nodes in turn and always takes the smallest free colour. It never needs more than the highest degree plus 1 colours – but often more than necessary."

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The four colour theorem was proved in 1976 with a computer that checked 1900 cases. Why did that spark a debate?
    params:
      options:
        - label: No human can check the proof completely by hand
          correct: true
        - label: The computer had miscalculated
          feedback: The proof was later confirmed several times.
        - label: The theorem is actually false
          feedback: It holds – what was disputed was the kind of proof.
    hints:
      - What is traditionally demanded of a mathematical proof?
    explanation: Is something proved if only a machine can check it? Today proof assistants verify such proofs formally.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Compilers assign variables to a few processor registers. What problem lies behind this?
    params:
      options:
        - label: Graph colouring – variables needed at the same time need different registers
          correct: true
        - label: Shortest paths
          feedback: It is about conflicts, not routes.
        - label: Sorting
          feedback: The order of the variables does not matter here.
    hints:
      - When may two variables not share a register?
      - Conflicts as edges, registers as colours.
    explanation: Nodes are variables, edges connect those alive at the same time. A colouring with k colours fits into k registers.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: To decide if any given network can be coloured with 3 colours is …
    params:
      options:
        - label: NP-complete – no fast method is known
          correct: true
        - label: easy, as with 2 colours
          feedback: With 2 colours alternating suffices – with 3 it does not.
        - label: impossible
          feedback: Trying everything always works – it just takes time.
    hints:
      - With 2 colours every colour is forced. With 3?
      - You would have to try many possibilities.
    explanation: "2 colours: quickly checkable. 3 colours: NP-complete. A tiny difference in the question, a huge one in effort."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: A sudoku is a colouring problem with 81 nodes and 9 colours. How many other cells is each cell connected to?
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 24
        misconception: double-count
        text: 4 cells of the row and column already lie in the own block – do not count them twice.
    hints:
      - 8 in the row, 8 in the column. And in the box?
      - In the 3 × 3 box only 4 new ones are added.
    explanation: 8 + 8 + 4 = 20 neighbours. The whole sudoku network has 81 · 20 / 2 = 810 edges.
    difficulty: 3

srs:
  cards_from: [zwei-farben, pruefungen]
