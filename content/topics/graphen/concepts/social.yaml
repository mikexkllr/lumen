id: cs.graphs.social
type: concept
title: Soziale Netze
summary: Freunde von Freunden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Welt ist ein Dorf
    body: Kennst du jemanden, der jemanden kennt, der einen Star kennt? Deck die Karten auf. Unsere Welt ist **viel kleiner**, als sie aussieht.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ✉️
            front: Milgrams Briefe (1967)
            back: Briefe erreichten Fremde über eine Kette von Bekannten – im Schnitt mit etwa sechs Stationen.
          - icon: 🎬
            front: Kevin Bacon
            back: Die allermeisten Filmstars sind über höchstens drei Filme mit Kevin Bacon verbunden.
          - icon: 🌍
            front: Acht Milliarden Menschen
            back: Trotzdem trennt dich von fast jedem nur eine erstaunlich kurze Kette.

  - kind: problem
    id: kette
    widget: network
    prompt: Über möglichst wenige Bekannte zum Star. Tippe die Kette an.
    params:
      start: U
      end: S
      unit: Schritte
      nodes:
        - { id: U, x: 4, y: 50, label: Du }
        - { id: A, x: 30, y: 12, label: Ali }
        - { id: B, x: 30, y: 88, label: Bea }
        - { id: C, x: 55, y: 42, label: Cem }
        - { id: D, x: 66, y: 90, label: Dana }
        - { id: E, x: 78, y: 12, label: Eli }
        - { id: S, x: 96, y: 55, label: Star }
      edges:
        - { a: U, b: A }
        - { a: U, b: B }
        - { a: A, b: C }
        - { a: C, b: E }
        - { a: E, b: S }
        - { a: B, b: D }
        - { a: D, b: S }
        - { a: B, b: C }
    hints:
      - Jede Linie ist eine Bekanntschaft. Zähle Schritte.
    explanation: Du → Bea → Dana → Star – drei Schritte.

  - kind: problem
    id: freunde
    widget: numeric
    prompt: Wie viele direkte Kontakte hat Bea im Netz oben?
    params: { unit: Kontakte }
    answer: { value: 3 }
    hints:
      - Zähle die Linien an Bea.
    explanation: Du, Cem und Dana. In der Graphentheorie heißt das der **Grad**.

  - kind: explain
    id: s3
    body: |
      In echten Netzen sind fast alle über wenige Schritte verbunden. Der Grund sind **Knoten mit sehr vielen Kontakten** – sie verbinden ferne **Gruppen**.

  - kind: problem
    id: wachstum
    widget: numeric
    prompt: Jeder kennt {{k}} Leute. Wie viele erreicht man über zwei Schritte höchstens?
    params: { unit: Leute }
    answer: { value: "{{k * k}}" }
    hints:
      - "{{k}} Freunde mit je {{k}} Freunden."
    explanation: "{{k}} · {{k}} = {{k * k}} – ohne Überschneidungen. Nach wenigen Schritten ist man bei Millionen."
    variants:
      params: { k: "choice[50,100,150,200]" }
      defaults: { k: 100 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einem Netz mit 6 Personen kennt jeder jeden. Wie viele Verbindungen gibt es?
    answer:
      value: 15
    hints:
      - 6 · 5 geteilt durch 2.
    explanation: 15. Bei einer Milliarde Nutzern wären es 5 · 10¹⁷ mögliche Verbindungen.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: In einer Gruppe von {{n}} Personen kennt jeder jeden. Wie viele Bekanntschaften gibt es?
    answer:
      value: "{{n * (n - 1) / 2}}"
    feedback:
      - when: numval(state.input) == n * (n - 1)
        misconception: double-count
        text: Jede Bekanntschaft zählst du so doppelt – einmal von jeder Seite.
    hints:
      - Jede Person kennt {{n - 1}} andere.
      - "{{n}} · {{n - 1}}, durch 2."
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}}. Die Zahl der Paare wächst quadratisch."
    difficulty: 2
    variants:
      params:
        n: int[5,30]
      defaults:
        n: 10

  - kind: problem
    id: cs-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Über wie viele Zwischenpersonen war 2016 im Schnitt jeder Facebook-Nutzer mit jedem anderen verbunden?"
    params:
      min: 1
      max: 20
    answer:
      value: 3.6
      tolerance: 1
    explanation: Eine Auswertung von 2016 ergab im Schnitt etwa 3,6 Zwischenpersonen. Die »sechs Schritte« aus alten Experimenten sind im Netz noch weniger geworden.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Wie findet man am schnellsten die kürzeste Bekanntenkette zwischen zwei Personen?
    params:
      options:
        - label: "Breitensuche: erst alle direkten Freunde, dann deren Freunde …"
          correct: true
        - label: "Tiefensuche: einer Kette möglichst weit folgen"
          feedback: Sie findet irgendeinen Weg, nicht unbedingt den kürzesten.
        - label: Alle Ketten aufzählen
          feedback: Davon gibt es astronomisch viele.
    hints:
      - Ohne Gewichte zählt nur die Zahl der Schritte.
      - Ring für Ring nach außen.
    explanation: Die Breitensuche findet jede Person zuerst über die kürzeste Kette. Sie ist Dijkstra für Netze, in denen jede Kante 1 kostet.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Deine Freunde haben im Schnitt **mehr** Freunde als du. Das gilt für fast jeden. Warum?
    params:
      options:
        - label: Leute mit vielen Freunden tauchen in viel mehr Freundeslisten auf
          correct: true
        - label: Weil man sich unterschätzt
          feedback: Es ist eine rein mathematische Verzerrung.
        - label: Das stimmt nicht
          feedback: Es ist in echten Netzen messbar.
    hints:
      - Wer 500 Freunde hat, wird 500-mal als »Freund von jemandem« gezählt.
    explanation: Das **Freundschaftsparadox** – ein Auswahleffekt. Man nutzt es, um Epidemien früh zu erkennen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was ist ein Graph – und wofür braucht man ihn?"
    params:
      keywords:
        - - knoten
          - punkt
          - node
          - point
          - vertex
        - - kante
          - verbindung
          - linie
          - edge
          - connection
          - link
        - - weg
          - netz
          - karte
          - route
          - path
          - network
          - map
      sample: Ein Graph besteht aus Knoten und Kanten, die sie verbinden. Damit beschreibt man Netze aller Art, etwa Straßenkarten für kürzeste Wege oder Freundschaften in sozialen Netzen.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Bea hat 4 Freunde. Von den möglichen Paaren unter ihnen sind 3 befreundet. Welcher Anteil der Paare ist das? (Das ist Beas Clustering-Koeffizient.)
    answer:
      value: 0.5
    hints:
      - Wie viele Paare bilden 4 Personen?
      - 4 · 3 / 2 = 6 Paare.
    explanation: "3 von 6 = 0,5. In sozialen Netzen ist dieser Wert hoch: Freunde von Freunden sind oft selbst befreundet."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Google bewertete Webseiten früh mit PageRank. Was zählt dabei am meisten?
    params:
      options:
        - label: Wie viele wichtige Seiten auf eine Seite verlinken
          correct: true
        - label: Wie oft ein Suchwort auf der Seite steht
          feedback: Das ließ sich zu leicht austricksen.
        - label: Wie neu die Seite ist
          feedback: Das Alter spielte beim PageRank keine Rolle.
    hints:
      - Ein Link ist wie eine Stimme.
      - Eine Stimme von einer wichtigen Seite zählt mehr.
    explanation: Wichtig ist, wer von Wichtigen verlinkt wird – eine rekursive Definition. Mathematisch ist PageRank ein Eigenvektor der Link-Matrix.
    difficulty: 3

srs:
  cards_from: [freunde, wachstum]
