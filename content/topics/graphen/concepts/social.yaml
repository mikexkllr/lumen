id: cs.graphs.social
type: concept
title: Soziale Netze
summary: Freunde von Freunden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: kette
    widget: network
    prompt: Über möglichst wenige Bekannte zum Star. Tippe die Kette an.
    params:
      start: U
      end: S
      unit: Schritte
      nodes:
        - { id: U, x: 4, y: 50, label: Du }
        - { id: A, x: 30, y: 12, label: Ali }
        - { id: B, x: 30, y: 88, label: Bea }
        - { id: C, x: 55, y: 42, label: Cem }
        - { id: D, x: 66, y: 90, label: Dana }
        - { id: E, x: 78, y: 12, label: Eli }
        - { id: S, x: 96, y: 55, label: Star }
      edges:
        - { a: U, b: A }
        - { a: U, b: B }
        - { a: A, b: C }
        - { a: C, b: E }
        - { a: E, b: S }
        - { a: B, b: D }
        - { a: D, b: S }
        - { a: B, b: C }
    hints:
      - Jede Linie ist eine Bekanntschaft. Zähle Schritte.
    explanation: Du → Bea → Dana → Star – drei Schritte.

  - kind: problem
    id: freunde
    widget: numeric
    prompt: Wie viele direkte Kontakte hat Bea im Netz oben?
    params: { unit: Kontakte }
    answer: { value: 3 }
    hints:
      - Zähle die Linien an Bea.
    explanation: Du, Cem und Dana. In der Graphentheorie heißt das der **Grad**.

  - kind: explain
    id: s3
    body: |
      In echten Netzen sind fast alle über wenige Schritte verbunden. Der Grund sind **Knoten mit sehr vielen Kontakten** – sie verbinden ferne Gruppen.

  - kind: problem
    id: wachstum
    widget: numeric
    prompt: Jeder kennt {{k}} Leute. Wie viele erreicht man über zwei Schritte höchstens?
    params: { unit: Leute }
    answer: { value: "{{k * k}}" }
    hints:
      - "{{k}} Freunde mit je {{k}} Freunden."
    explanation: "{{k}} · {{k}} = {{k * k}} – ohne Überschneidungen. Nach wenigen Schritten ist man bei Millionen."
    variants:
      params: { k: "choice[50,100,150,200]" }
      defaults: { k: 100 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In einem Netz mit 6 Personen kennt jeder jeden. Wie viele Verbindungen gibt es?
    answer:
      value: 15
    hints:
      - 6 · 5 geteilt durch 2.
    explanation: 15. Bei einer Milliarde Nutzern wären es 5 · 10¹⁷ mögliche Verbindungen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Deine Freunde haben im Schnitt **mehr** Freunde als du. Das gilt für fast jeden. Warum?
    params:
      options:
        - label: Leute mit vielen Freunden tauchen in viel mehr Freundeslisten auf
          correct: true
        - label: Weil man sich unterschätzt
          feedback: Es ist eine rein mathematische Verzerrung.
        - label: Das stimmt nicht
          feedback: Es ist in echten Netzen messbar.
    hints:
      - Wer 500 Freunde hat, wird 500-mal als »Freund von jemandem« gezählt.
    explanation: Das **Freundschaftsparadox** – ein Auswahleffekt. Man nutzt es, um Epidemien früh zu erkennen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was ist ein Graph – und wofür braucht man ihn?"
    params:
      keywords:
        - - knoten
          - punkt
          - node
          - point
          - vertex
        - - kante
          - verbindung
          - linie
          - edge
          - connection
          - link
        - - weg
          - netz
          - karte
          - route
          - path
          - network
          - map
      sample: Ein Graph besteht aus Knoten und Kanten, die sie verbinden. Damit beschreibt man Netze aller Art, etwa Straßenkarten für kürzeste Wege oder Freundschaften in sozialen Netzen.
    difficulty: 3

srs:
  cards_from: [freunde, wachstum]
