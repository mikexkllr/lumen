id: cs.graphs.coloring
type: concept
title: Färben ohne Konflikt
summary: Von Landkarten zu Prüfungsplänen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Nachbarländer auf einer Karte sollen verschiedene Farben bekommen.
      Als Netzwerk: Jedes Land ist ein Knoten. Eine gemeinsame Grenze ist eine Kante.

  - kind: problem
    id: fuenfeck
    widget: network
    prompt: Färbe alle Punkte. Verbundene Punkte brauchen verschiedene Farben. Du hast 3 Farben.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: A, x: 50, y: 6 }
        - { id: B, x: 92, y: 38 }
        - { id: C, x: 76, y: 94 }
        - { id: D, x: 24, y: 94 }
        - { id: E, x: 8, y: 38 }
      edges:
        - { a: A, b: B }
        - { a: B, b: C }
        - { a: C, b: D }
        - { a: D, b: E }
        - { a: E, b: A }
    hints:
      - Tippe einen Punkt mehrmals an, um seine Farbe zu wechseln.
      - Abwechselnd zwei Farben geht fast – ein Punkt braucht die dritte.
    explanation: Zwei Farben wechseln sich ab, der letzte Punkt bekommt die dritte.

  - kind: problem
    id: zwei-farben
    widget: choice
    prompt: Reichen beim Fünfeck auch 2 Farben?
    params:
      options:
        - { label: "Nein – ein Kreis mit ungerade vielen Punkten braucht 3.", correct: true }
        - { label: "Ja, wenn man geschickt anfängt.", feedback: "Probier es: Beim Abwechseln stoßen am Ende zwei gleiche Farben zusammen." }
        - { label: "Ja, immer.", feedback: "Bei 5 Punkten im Kreis klappt das Abwechseln nicht." }
    hints:
      - Wechsle im Kopf ab – rot, blau, rot, blau, …?
    explanation: Bei ungerader Länge trifft das Abwechseln auf sich selbst. Gerade Kreise kommen mit 2 Farben aus.

  - kind: explain
    body: |
      Dasselbe Problem steckt in **Stundenplänen**. Fächer mit gemeinsamen Schülern dürfen nicht gleichzeitig liegen.
      Die Farben sind dann Zeitfenster.

  - kind: problem
    id: pruefungen
    widget: network
    prompt: Verbundene Fächer haben gemeinsame Schüler. Verteile sie auf 3 Zeitfenster ohne Konflikt.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: Ma, x: 10, y: 22 }
        - { id: Bi, x: 50, y: 6 }
        - { id: Ch, x: 90, y: 22 }
        - { id: Ku, x: 28, y: 92 }
        - { id: Sp, x: 72, y: 92 }
      edges:
        - { a: Ma, b: Bi }
        - { a: Bi, b: Ch }
        - { a: Ma, b: Ch }
        - { a: Ch, b: Sp }
        - { a: Ku, b: Sp }
        - { a: Ma, b: Ku }
    hints:
      - Mathe, Biologie und Chemie hängen alle zusammen. Sie brauchen drei verschiedene Farben.
    explanation: Das Dreieck braucht alle drei Zeitfenster. Kunst und Sport passen dann in die übrigen Lücken.

  - kind: explain
    body: Wie viele Farben braucht jede Landkarte höchstens – egal wie kompliziert?
    reveal:
      body: Vier. Das ist der **Vierfarbensatz**. Er wurde 1976 bewiesen – als einer der ersten großen Sätze mit Computerhilfe.

srs:
  cards_from: [zwei-farben, pruefungen]
