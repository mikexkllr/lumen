id: cs.graphs.coloring
type: concept
title: Färben ohne Konflikt
summary: Von Landkarten zu Prüfungsplänen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was glaubst du: Wie viele Farben reichen für **jede** Landkarte, wenn Nachbarn nie dieselbe Farbe haben sollen?"
    params:
      options:
        - label: "4"
          correct: true
        - label: "3"
          feedback: Manche Karten brauchen eine vierte Farbe.
        - label: "7"
          feedback: Es geht mit weniger.
    hints:
      - Erstaunlich wenige.
    explanation: Vier reichen immer. Der Beweis gelang erst 1976 – mit einem Computer.

  - kind: explain
    id: s1
    body: |
      Nachbarländer auf einer Karte sollen verschiedene Farben bekommen.
      Als Netzwerk: Jedes Land ist ein **Knoten**. Eine gemeinsame Grenze ist eine Kante.

  - kind: problem
    id: fuenfeck
    widget: network
    prompt: Färbe alle Punkte. Verbundene Punkte brauchen verschiedene Farben. Du hast 3 Farben.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: A, x: 50, y: 6 }
        - { id: B, x: 92, y: 38 }
        - { id: C, x: 76, y: 94 }
        - { id: D, x: 24, y: 94 }
        - { id: E, x: 8, y: 38 }
      edges:
        - { a: A, b: B }
        - { a: B, b: C }
        - { a: C, b: D }
        - { a: D, b: E }
        - { a: E, b: A }
    hints:
      - Tippe einen Punkt mehrmals an, um seine Farbe zu wechseln.
      - Abwechselnd zwei Farben geht fast – ein Punkt braucht die dritte.
    explanation: Zwei Farben wechseln sich ab, der letzte Punkt bekommt die dritte.

  - kind: problem
    id: zwei-farben
    widget: choice
    prompt: Reichen beim Fünfeck auch 2 Farben?
    params:
      options:
        - { label: "Nein – ein Kreis mit ungerade vielen Punkten braucht 3.", correct: true }
        - { label: "Ja, wenn man geschickt anfängt.", feedback: "Probier es: Beim Abwechseln stoßen am Ende zwei gleiche Farben zusammen." }
        - { label: "Ja, immer.", feedback: "Bei 5 Punkten im Kreis klappt das Abwechseln nicht." }
    hints:
      - Wechsle im Kopf ab – rot, blau, rot, blau, …?
    explanation: Bei ungerader Länge trifft das Abwechseln auf sich selbst. Gerade Kreise kommen mit 2 Farben aus.

  - kind: explain
    id: s4
    body: |
      Dasselbe Problem steckt in **Stundenplänen**. Fächer mit gemeinsamen Schülern dürfen nicht gleichzeitig liegen.
      Die Farben sind dann Zeitfenster.

  - kind: problem
    id: pruefungen
    widget: network
    prompt: Verbundene Fächer haben gemeinsame Schüler. Verteile sie auf 3 Zeitfenster ohne Konflikt.
    params:
      mode: color
      colors: 3
      nodes:
        - { id: Ma, x: 10, y: 22 }
        - { id: Bi, x: 50, y: 6 }
        - { id: Ch, x: 90, y: 22 }
        - { id: Ku, x: 28, y: 92 }
        - { id: Sp, x: 72, y: 92 }
      edges:
        - { a: Ma, b: Bi }
        - { a: Bi, b: Ch }
        - { a: Ma, b: Ch }
        - { a: Ch, b: Sp }
        - { a: Ku, b: Sp }
        - { a: Ma, b: Ku }
    hints:
      - Mathe, Biologie und Chemie hängen alle zusammen. Sie brauchen drei verschiedene Farben.
    explanation: Das Dreieck braucht alle drei Zeitfenster. Kunst und Sport passen dann in die übrigen Lücken.

  - kind: explain
    id: s6
    body: Wie viele Farben braucht jede Landkarte höchstens – egal wie kompliziert?
    reveal:
      body: Vier. Das ist der **Vierfarbensatz**. Er wurde 1976 bewiesen – als einer der ersten großen Sätze mit Computerhilfe.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: "Drei Länder grenzen alle aneinander: jedes an die beiden anderen. Wie viele Farben braucht man mindestens?"
    answer:
      value: 3
    hints:
      - Keine zwei dürfen dieselbe Farbe haben.
    explanation: Drei. Jedes Land ist Nachbar von jedem anderen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Netz lässt sich mit **zwei** Farben färben. Was weißt du dann über seine Kreise?
    params:
      options:
        - label: Alle Kreise haben gerade Länge
          correct: true
        - label: Es hat gar keine Kreise
          feedback: Ein Quadrat ist ein Kreis und zweifärbbar.
        - label: Alle Kreise haben ungerade Länge
          feedback: Ein Dreieck braucht schon drei Farben.
    hints:
      - Beim Fünfeck ging es nicht. Und beim Quadrat?
    explanation: "Solche Netze heißen **bipartit**: zwei Gruppen, Kanten nur dazwischen. Wie Bewerber und Stellen."
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: network
    prompt: Diesmal hast du nur 2 Farben. Färbe das Netz ohne Konflikt.
    params:
      mode: color
      colors: 2
      nodes:
        - id: A
          x: 10
          y: 20
        - id: B
          x: 50
          y: 6
        - id: C
          x: 90
          y: 20
        - id: D
          x: 90
          y: 80
        - id: E
          x: 50
          y: 94
        - id: F
          x: 10
          y: 80
      edges:
        - a: A
          b: B
        - a: B
          b: C
        - a: C
          b: D
        - a: D
          b: E
        - a: E
          b: F
        - a: F
          b: A
        - a: A
          b: D
        - a: B
          b: E
    hints:
      - Gib A eine Farbe. Dann ist die Farbe jedes Nachbarn festgelegt.
      - Abwechselnd um den Kreis herum.
    explanation: A, C, E bekommen die eine Farbe, B, D, F die andere. Die Querverbindungen passen auch – das Netz hat nur gerade Kreise.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: network
    prompt: "Ein Rad: eine Mitte und ein Fünfeck drumherum. Färbe es konfliktfrei."
    params:
      mode: color
      colors: 4
      nodes:
        - id: M
          x: 50
          y: 50
        - id: P1
          x: 50
          y: 5
        - id: P2
          x: 93
          y: 36
        - id: P3
          x: 77
          y: 94
        - id: P4
          x: 23
          y: 94
        - id: P5
          x: 7
          y: 36
      edges:
        - a: P1
          b: P2
        - a: P2
          b: P3
        - a: P3
          b: P4
        - a: P4
          b: P5
        - a: P5
          b: P1
        - a: M
          b: P1
        - a: M
          b: P2
        - a: M
          b: P3
        - a: M
          b: P4
        - a: M
          b: P5
    hints:
      - Die Mitte grenzt an alle – sie braucht eine eigene Farbe.
      - Ein Fünfeck braucht allein schon 3 Farben.
    explanation: "1 Farbe für die Mitte, 3 für das ungerade Fünfeck: zusammen 4."
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Wie viele Farben braucht das Rad aus Mitte und Fünfeck mindestens?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: odd-cycle
        text: Das Fünfeck braucht schon 3, und die Mitte grenzt an alle drei Farben.
    hints:
      - Ein Kreis mit ungerade vielen Ecken braucht 3 Farben.
      - Die Mitte darf keine davon nehmen.
    explanation: 3 + 1 = 4. Das Rad ist ein Beispiel ohne vier gegenseitige Nachbarn, das trotzdem 4 Farben braucht.
    difficulty: 2

  - kind: explain
    id: cs-d4
    depth: 2
    body: Die **Greedy-Färbung** geht die Knoten der Reihe nach durch und nimmt jeweils die kleinste freie Farbe. Sie braucht nie mehr als höchster Grad plus 1 Farben – oft aber mehr als nötig.

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Vierfarbensatz wurde 1976 mit einem Computer bewiesen, der 1900 Fälle durchprüfte. Warum löste das eine Debatte aus?
    params:
      options:
        - label: Kein Mensch kann den Beweis vollständig von Hand nachprüfen
          correct: true
        - label: Der Computer hatte sich verrechnet
          feedback: Der Beweis wurde später mehrfach bestätigt.
        - label: Der Satz ist in Wahrheit falsch
          feedback: Er gilt – strittig war die Art des Beweises.
    hints:
      - Was verlangt man traditionell von einem mathematischen Beweis?
    explanation: Ist etwas bewiesen, wenn nur eine Maschine es prüfen kann? Heute verifizieren Beweisassistenten solche Beweise formal.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: Ein Compiler legt Variablen in wenige Fächer im Chip, die Register. Welches Problem steckt dahinter?
    params:
      options:
        - label: Graphenfärbung – Variablen, die gleichzeitig gebraucht werden, brauchen verschiedene Register
          correct: true
        - label: Kürzeste Wege
          feedback: Es geht nicht um Wege, sondern um Konflikte.
        - label: Sortieren
          feedback: Die Reihenfolge der Variablen ist hier egal.
    hints:
      - Wann dürfen zwei Variablen nicht dasselbe Register teilen?
      - Konflikte als Kanten, Register als Farben.
    explanation: Knoten sind Variablen, Kanten verbinden gleichzeitig lebende. Eine Färbung mit k Farben passt in k Register.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Zu entscheiden, ob ein beliebiges Netz mit 3 Farben färbbar ist, ist …
    params:
      options:
        - label: NP-vollständig – man kennt kein schnelles Verfahren
          correct: true
        - label: leicht, wie bei 2 Farben
          feedback: Bei 2 Farben genügt Abwechseln – bei 3 nicht.
        - label: unmöglich
          feedback: Durchprobieren klappt immer – es dauert nur.
    hints:
      - Bei 2 Farben ist jede Farbe erzwungen. Bei 3?
      - Man müsste viele Möglichkeiten durchprobieren.
    explanation: "2 Farben: schnell prüfbar. 3 Farben: NP-vollständig. Ein winziger Unterschied in der Frage, ein riesiger im Aufwand."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Ein Sudoku ist ein Färbeproblem mit 81 Knoten und 9 Farben. Mit wie vielen anderen Feldern ist jedes Feld verbunden?
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 24
        misconception: double-count
        text: Im eigenen Block liegen schon 4 Felder aus Zeile und Spalte – nicht doppelt zählen.
    hints:
      - 8 in der Zeile, 8 in der Spalte. Und im Block?
      - Im 3 × 3-Block kommen nur noch 4 neue dazu.
    explanation: 8 + 8 + 4 = 20 Nachbarn. Das ganze Sudoku-Netz hat 81 · 20 / 2 = 810 Kanten.
    difficulty: 3

srs:
  cards_from: [zwei-farben, pruefungen]
