id: cs.graphs.trees
type: concept
title: Connecting cheaply
summary: Spanning trees and Kruskal's trick.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: glasfaser
    widget: network
    prompt: Connect all the houses with fiber. Choose the lines so that everything is connected and the cost is lowest.
    params:
      mode: select
      unit: km
      nodes:
        - { id: A, x: 8, y: 20 }
        - { id: B, x: 46, y: 6 }
        - { id: C, x: 90, y: 24 }
        - { id: D, x: 72, y: 92 }
        - { id: E, x: 24, y: 90 }
      edges:
        - { a: A, b: B, w: 3 }
        - { a: B, b: C, w: 4 }
        - { a: C, b: D, w: 2 }
        - { a: D, b: E, w: 5 }
        - { a: E, b: A, w: 4 }
        - { a: A, b: D, w: 7 }
        - { a: B, b: E, w: 6 }
        - { a: B, b: D, w: 6 }
    hints:
      - Tap lines to select them.
      - Start with the cheapest ones.
    explanation: C–D, A–B, B–C and A–E connect everything for 13 km.

  - kind: explain
    id: s2
    body: |
      A network without cycles that connects all nodes is called a **spanning tree**.
      With n nodes, it always has exactly n − 1 edges.

  - kind: problem
    id: kanten
    widget: numeric
    prompt: How many lines does a spanning tree need for {{n}} houses?
    params: { unit: lines }
    answer: { value: "{{n - 1}}" }
    feedback:
      - when: "numval(state.input) == n"
        misconception: nodes-equals-edges
        text: Close. A tree always has one edge fewer than nodes.
    hints:
      - Two houses need one line, three houses need two …
    explanation: "{{n}} houses need {{n - 1}} lines."
    variants:
      params: { n: "int[6,24]" }
      defaults: { n: 12 }

  - kind: explain
    id: s4
    body: |
      **Kruskal's trick:** Always take the cheapest line that does not close a cycle.
      Keep going until everything is connected.

  - kind: problem
    id: kruskal
    widget: network
    prompt: Use Kruskal's trick. Connect all six places as cheaply as possible.
    params:
      mode: select
      unit: km
      nodes:
        - { id: P, x: 4, y: 50 }
        - { id: Q, x: 35, y: 8 }
        - { id: R, x: 35, y: 92 }
        - { id: S, x: 66, y: 8 }
        - { id: T, x: 66, y: 92 }
        - { id: U, x: 96, y: 50 }
      edges:
        - { a: P, b: Q, w: 2 }
        - { a: P, b: R, w: 3 }
        - { a: Q, b: R, w: 4 }
        - { a: Q, b: S, w: 5 }
        - { a: R, b: T, w: 1 }
        - { a: S, b: T, w: 6 }
        - { a: S, b: U, w: 2 }
        - { a: T, b: U, w: 7 }
    hints:
      - The order is 1, 2, 2, 3 … Skip anything that closes a cycle.
    explanation: R–T, P–Q, S–U, P–R and Q–S, 13 km in total.

  - kind: problem
    id: kreis
    widget: choice
    prompt: Why is a cycle redundant in a cable network?
    params:
      options:
        - { label: "You can drop one line in the cycle, and everything stays connected.", correct: true }
        - { label: Cycles disturb the signal., feedback: "There are technical reasons for that, but this is about connectivity." }
        - { label: Cycles are forbidden., feedback: "Not forbidden, just needlessly expensive." }
    hints:
      - What happens if you remove one edge from a cycle?
    explanation: In a cycle there are two ways between two points. One of them is enough.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A network has 8 nodes and 15 edges. How many edges must be removed at least so that no cycle is left and everything still stays connected?
    answer:
      value: 8
    hints:
      - A spanning tree has n − 1 edges.
    explanation: 15 − 7 = 8. Each removed edge destroys at least one cycle.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: network
    prompt: Seven places, twelve possible lines. Build the cheapest network that connects them all.
    params:
      mode: select
      unit: km
      nodes:
        - id: P
          x: 4
          y: 20
        - id: Q
          x: 32
          y: 6
        - id: R
          x: 62
          y: 10
        - id: S
          x: 94
          y: 24
        - id: T
          x: 82
          y: 82
        - id: U
          x: 46
          y: 94
        - id: V
          x: 12
          y: 80
      edges:
        - a: P
          b: Q
          w: 4
        - a: Q
          b: R
          w: 3
        - a: R
          b: S
          w: 6
        - a: S
          b: T
          w: 2
        - a: T
          b: U
          w: 5
        - a: U
          b: V
          w: 3
        - a: V
          b: P
          w: 7
        - a: Q
          b: U
          w: 8
        - a: R
          b: T
          w: 4
        - a: P
          b: U
          w: 6
        - a: Q
          b: V
          w: 5
        - a: R
          b: U
          w: 7
    hints:
      - "Kruskal: sort the lines by price and take the cheapest that closes no cycle."
      - 2, 3, 3, 4, 4 – then one line to the group U, V is still missing.
    explanation: "S–T 2, Q–R 3, U–V 3, P–Q 4, R–T 4 and one line for 5 to U or V: 21 km in total."
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: "**Prim's method** grows from a starting point: always take the cheapest line that attaches a new place to the network so far. It finds the same lowest price as Kruskal."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Four places are all connected to each other. How many different spanning trees are there?
    answer:
      value: 16
    hints:
      - A spanning tree has 3 of the 6 edges. Not every choice is free of cycles.
      - Of 20 choices, 4 form a triangle plus a lone point.
    explanation: 20 − 4 = 16. In general a complete network on n places has $n^{n-2}$ spanning trees (Cayley's formula).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kruskal’s trick always takes the cheapest thing possible right now – without planning ahead. Why does it work here but not for other problems?
    params:
      options:
        - label: Here it can be proved that the cheapest allowed edge always belongs to some best solution
          correct: true
        - label: It always works everywhere
          feedback: For the round trip “always to the nearest place” often gives bad tours.
        - label: It only works by chance
          feedback: It is mathematically proven.
    hints:
      - Such methods are called “greedy”.
    explanation: "**Greedy algorithms** are fast but optimal only for problems with a suitable structure."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: By Cayley the complete network on {{n}} places has $n^{n-2}$ spanning trees. How many is that?
    answer:
      value: "{{n ** (n - 2)}}"
    hints:
      - Plug in n = {{n}}.
      - "{{n}} to the power {{n - 2}}."
    explanation: $ {{n}}^{ {{n - 2}} } $ = {{n ** (n - 2)}}. Trying them all would be hopeless – yet Kruskal needs only a fraction of a second.
    difficulty: 3
    variants:
      params:
        n: int[3,8]
      defaults:
        n: 5

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Why does the cheapest line between two parts of the network always belong to some cheapest spanning tree?
    params:
      options:
        - label: If it is missing, you can add it and drop a pricier line between the same parts
          correct: true
        - label: Because cheap lines are always good
          feedback: Cheap alone is not enough – it must not close a cycle.
        - label: That is not true
          feedback: It is the core of the proof for Kruskal and Prim.
    hints:
      - Imagine a tree without this line.
      - Some other line must connect the two parts.
    explanation: The swap does not make the tree more expensive. This cut property explains why greedy is optimal here.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Three houses form an equilateral triangle with 1 km sides. If you may build a junction in the middle, how long is the shortest network? Round to two decimals.
    params:
      unit: km
    answer:
      value: 1.73
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 2
        misconception: no-steiner
        text: That is the spanning tree without a junction. Using the centre is shorter.
    hints:
      - From the centre to each corner is 1/√3 km.
      - 3 · 1/√3 = √3.
    explanation: √3 ≈ 1.73 km instead of 2 km. Such Steiner trees matter when building networks – and are NP-hard in general.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux how Kruskal builds a cheap network.
    params:
      keywords:
        - - billig
          - günstig
          - cheap
          - kleinste
          - smallest
        - - kreis
          - cycle
          - loop
          - ring
        - - verbunden
          - verbind
          - connect
      sample: I sort all lines by price and always take the cheapest that closes no cycle. Lines that would close a cycle are redundant. As soon as all places are connected, I am done.
    difficulty: 3

srs:
  cards_from: [kanten, kreis]
