id: cs.graphs.trees
type: concept
title: Günstig verbinden
summary: Spannbäume und Kruskals Trick.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: glasfaser
    widget: network
    prompt: Verbinde alle Häuser mit Glasfaser. Wähle die Leitungen so, dass alles verbunden ist und es am wenigsten kostet.
    params:
      mode: select
      unit: km
      nodes:
        - { id: A, x: 8, y: 20 }
        - { id: B, x: 46, y: 6 }
        - { id: C, x: 90, y: 24 }
        - { id: D, x: 72, y: 92 }
        - { id: E, x: 24, y: 90 }
      edges:
        - { a: A, b: B, w: 3 }
        - { a: B, b: C, w: 4 }
        - { a: C, b: D, w: 2 }
        - { a: D, b: E, w: 5 }
        - { a: E, b: A, w: 4 }
        - { a: A, b: D, w: 7 }
        - { a: B, b: E, w: 6 }
        - { a: B, b: D, w: 6 }
    hints:
      - Tippe Leitungen an, um sie zu wählen.
      - Fang mit den billigsten an.
    explanation: C–D, A–B, B–C und A–E verbinden alles für 13 km.

  - kind: explain
    id: s2
    body: |
      Ein Netz ohne Kreise, das alle Knoten verbindet, heißt **Spannbaum**.
      Bei n Knoten hat er immer genau n − 1 Kanten.

  - kind: problem
    id: kanten
    widget: numeric
    prompt: Wie viele Leitungen braucht ein Spannbaum für {{n}} Häuser?
    params: { unit: Leitungen }
    answer: { value: "{{n - 1}}" }
    feedback:
      - when: "numval(state.input) == n"
        misconception: nodes-equals-edges
        text: Fast. Ein Baum hat immer eine Kante weniger als Knoten.
    hints:
      - Zwei Häuser brauchen eine Leitung, drei Häuser zwei …
    explanation: "{{n}} Häuser brauchen {{n - 1}} Leitungen."
    variants:
      params: { n: "int[6,24]" }
      defaults: { n: 12 }

  - kind: explain
    id: s4
    body: |
      **Kruskals Trick:** Nimm immer die billigste Leitung, die keinen Kreis schließt.
      Mach weiter, bis alles verbunden ist.

  - kind: problem
    id: kruskal
    widget: network
    prompt: Wende Kruskals Trick an. Verbinde alle sechs Orte so günstig wie möglich.
    params:
      mode: select
      unit: km
      nodes:
        - { id: P, x: 4, y: 50 }
        - { id: Q, x: 35, y: 8 }
        - { id: R, x: 35, y: 92 }
        - { id: S, x: 66, y: 8 }
        - { id: T, x: 66, y: 92 }
        - { id: U, x: 96, y: 50 }
      edges:
        - { a: P, b: Q, w: 2 }
        - { a: P, b: R, w: 3 }
        - { a: Q, b: R, w: 4 }
        - { a: Q, b: S, w: 5 }
        - { a: R, b: T, w: 1 }
        - { a: S, b: T, w: 6 }
        - { a: S, b: U, w: 2 }
        - { a: T, b: U, w: 7 }
    hints:
      - Die Reihenfolge ist 1, 2, 2, 3 … Überspringe alles, was einen Kreis schließt.
    explanation: R–T, P–Q, S–U, P–R und Q–S – zusammen 13 km.

  - kind: problem
    id: kreis
    widget: choice
    prompt: Warum ist ein Kreis im Kabelnetz überflüssig?
    params:
      options:
        - { label: Eine Leitung im Kreis kann man weglassen – alles bleibt verbunden., correct: true }
        - { label: Kreise stören das Signal., feedback: "Technisch gibt es Gründe dafür, aber hier geht es um die Verbindung." }
        - { label: Kreise sind verboten., feedback: "Verboten nicht – nur unnötig teuer." }
    hints:
      - Was passiert, wenn du eine Kante aus einem Kreis entfernst?
    explanation: Im Kreis gibt es zwei Wege zwischen zwei Punkten. Einer davon reicht.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Netz hat 8 Knoten und 15 Kanten. Wie viele Kanten muss man mindestens entfernen, damit kein Kreis mehr übrig ist und trotzdem alles verbunden bleibt?
    answer:
      value: 8
    hints:
      - Ein Spannbaum hat n − 1 Kanten.
    explanation: 15 − 7 = 8. Jede entfernte Kante zerstört mindestens einen Kreis.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: network
    prompt: Sieben Orte, zwölf mögliche Leitungen. Baue das günstigste Netz, das alle verbindet.
    params:
      mode: select
      unit: km
      nodes:
        - id: P
          x: 4
          y: 20
        - id: Q
          x: 32
          y: 6
        - id: R
          x: 62
          y: 10
        - id: S
          x: 94
          y: 24
        - id: T
          x: 82
          y: 82
        - id: U
          x: 46
          y: 94
        - id: V
          x: 12
          y: 80
      edges:
        - a: P
          b: Q
          w: 4
        - a: Q
          b: R
          w: 3
        - a: R
          b: S
          w: 6
        - a: S
          b: T
          w: 2
        - a: T
          b: U
          w: 5
        - a: U
          b: V
          w: 3
        - a: V
          b: P
          w: 7
        - a: Q
          b: U
          w: 8
        - a: R
          b: T
          w: 4
        - a: P
          b: U
          w: 6
        - a: Q
          b: V
          w: 5
        - a: R
          b: U
          w: 7
    hints:
      - "Kruskal: Sortiere die Leitungen nach Preis und nimm die billigste, die keinen Kreis schließt."
      - 2, 3, 3, 4, 4 – dann fehlt noch eine Leitung zur Gruppe U, V.
    explanation: "S–T 2, Q–R 3, U–V 3, P–Q 4, R–T 4 und eine Leitung für 5 zu U oder V: zusammen 21 km."
    difficulty: 2

  - kind: explain
    id: cs-d2
    depth: 2
    body: "**Prims Verfahren** wächst von einem Startpunkt aus: Nimm immer die billigste Leitung, die einen neuen Ort ans bisherige Netz hängt. Es findet denselben günstigsten Preis wie Kruskal."

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: Vier Orte sind alle miteinander verbunden. Wie viele verschiedene Spannbäume gibt es?
    answer:
      value: 16
    hints:
      - Ein Spannbaum hat 3 der 6 Kanten. Nicht jede Auswahl ist kreisfrei.
      - Von 20 Auswahlen bilden 4 ein Dreieck plus Einzelpunkt.
    explanation: 20 − 4 = 16. Allgemein hat ein vollständiges Netz mit n Orten $n^{n-2}$ Spannbäume (Formel von Cayley).
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kruskals Trick nimmt immer das Billigste, was gerade geht – ohne vorauszuplanen. Warum klappt das hier, bei anderen Problemen aber nicht?
    params:
      options:
        - label: Hier lässt sich beweisen, dass die billigste erlaubte Kante immer zu einer besten Lösung gehört
          correct: true
        - label: Es klappt immer und überall
          feedback: Bei der Rundreise führt »immer zum nächsten Ort« oft zu schlechten Touren.
        - label: Es klappt nur zufällig
          feedback: Es ist mathematisch bewiesen.
    hints:
      - Solche Verfahren heißen »gierig«.
    explanation: "**Greedy-Algorithmen** sind schnell, aber nur bei Problemen mit passender Struktur optimal."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Nach Cayley hat das vollständige Netz mit {{n}} Orten $n^{n-2}$ Spannbäume. Wie viele sind das?
    answer:
      value: "{{n ** (n - 2)}}"
    hints:
      - Setze n = {{n}} ein.
      - "{{n}} hoch {{n - 2}}."
    explanation: $ {{n}}^{ {{n - 2}} } $ = {{n ** (n - 2)}}. Alle durchzuprobieren wäre hoffnungslos – Kruskal braucht trotzdem nur Sekundenbruchteile.
    difficulty: 3
    variants:
      params:
        n: int[3,8]
      defaults:
        n: 5

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Warum gehört die billigste Leitung zwischen zwei Teilen des Netzes immer in einen günstigsten Spannbaum?
    params:
      options:
        - label: Fehlt sie, kann man sie einbauen und dafür eine teurere Leitung zwischen denselben Teilen streichen
          correct: true
        - label: Weil billige Leitungen immer gut sind
          feedback: Billig allein reicht nicht – sie darf keinen Kreis schließen.
        - label: Das stimmt nicht
          feedback: Es ist der Kern des Beweises für Kruskal und Prim.
    hints:
      - Stell dir einen Baum ohne diese Leitung vor.
      - Irgendeine andere Leitung muss die beiden Teile verbinden.
    explanation: Der Tausch macht den Baum nicht teurer. Diese Schnitt-Eigenschaft erklärt, warum hier gieriges Vorgehen optimal ist.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Drei Häuser bilden ein gleichseitiges Dreieck mit 1 km Seitenlänge. Darf man in der Mitte einen Knotenpunkt bauen, wie lang ist das kürzeste Netz? Runde auf zwei Stellen.
    params:
      unit: km
    answer:
      value: 1.73
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 2
        misconception: no-steiner
        text: Das ist der Spannbaum ohne Knotenpunkt. Mit der Mitte geht es kürzer.
    hints:
      - Vom Mittelpunkt zu jeder Ecke sind es 1/√3 km.
      - 3 · 1/√3 = √3.
    explanation: √3 ≈ 1,73 km statt 2 km. Solche Steiner-Bäume sind beim Netzbau wichtig – und im Allgemeinen NP-schwer.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Kruskal ein günstiges Netz baut.
    params:
      keywords:
        - - billig
          - günstig
          - cheap
          - kleinste
          - smallest
        - - kreis
          - cycle
          - loop
          - ring
        - - verbunden
          - verbind
          - connect
      sample: Ich sortiere alle Leitungen nach Preis und nehme immer die billigste, die keinen Kreis schließt. Leitungen, die einen Kreis schließen würden, sind überflüssig. Sobald alle Orte verbunden sind, bin ich fertig.
    difficulty: 3

srs:
  cards_from: [kanten, kreis]
