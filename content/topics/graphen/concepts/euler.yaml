id: cs.graphs.euler
type: concept
title: In einem Zug
summary: Wann man jede Linie genau einmal abläuft.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: grad
    widget: numeric
    visual:
      widget: network
      params:
        aspect: 0.9
        nodes:
          - { id: A, x: 15, y: 95 }
          - { id: B, x: 85, y: 95 }
          - { id: C, x: 15, y: 45 }
          - { id: D, x: 85, y: 45 }
          - { id: E, x: 50, y: 5 }
        edges:
          - { a: A, b: B }
          - { a: A, b: C }
          - { a: B, b: D }
          - { a: C, b: D }
          - { a: A, b: D }
          - { a: B, b: C }
          - { a: C, b: E }
          - { a: D, b: E }
    prompt: Wie viele Linien treffen sich in der Ecke A?
    params: { unit: Linien }
    answer: { value: 3 }
    hints:
      - Zähle die Linien, die bei A enden.
    explanation: A hat Grad 3 – eine ungerade Zahl.

  - kind: explain
    id: s2
    body: |
      **Eulers Regel:** Eine Figur lässt sich in einem Zug zeichnen, wenn höchstens zwei Ecken einen ungeraden Grad haben. Man startet dann an einer davon.

  - kind: problem
    id: start
    widget: choice
    prompt: Wo musst du anfangen, um das Haus oben in einem Zug zu zeichnen?
    params:
      options:
        - { label: An einer der unteren Ecken, correct: true }
        - { label: An der Dachspitze, feedback: "Die Spitze hat Grad 2 – dort endet der Zug nicht." }
        - { label: Egal wo, feedback: "Nur A und B haben ungeraden Grad." }
    hints:
      - Welche Ecken haben ungeraden Grad?
    explanation: A und B haben Grad 3. Der Zug startet an einer und endet an der anderen.

  - kind: problem
    id: welche
    widget: buckets
    prompt: In einem Zug zeichenbar?
    params:
      buckets: [{ label: ja }, { label: nein }]
      items:
        - { label: Quadrat, bucket: ja }
        - { label: Fünfzackiger Stern, bucket: ja }
        - { label: Quadrat mit beiden Diagonalen, bucket: nein }
        - { label: Zwei getrennte Dreiecke, bucket: nein }
    hints:
      - Zähle in jeder Figur die Ecken mit ungeradem Grad.
    explanation: Mit Diagonalen haben alle vier Ecken Grad 3 – zu viele ungerade. Getrennte Teile gehen nie in einem Zug.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Lässt sich die Figur in einem Zug zeichnen?
    params:
      buckets:
        - id: b1
          label: Geht in einem Zug
        - id: b2
          label: Geht nicht
      items:
        - label: Keine Ecke mit ungeradem Grad
          bucket: b1
        - label: Zwei Ecken mit ungeradem Grad
          bucket: b1
        - label: Vier Ecken mit ungeradem Grad
          bucket: b2
        - label: Sechs Ecken mit ungeradem Grad
          bucket: b2
    hints:
      - Eulers Regel erlaubt höchstens zwei.
    explanation: An jeder Ecke unterwegs kommt man an und geht wieder. Das braucht gerade viele Linien.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Königsberg hat vier Stadtteile und sieben Brücken. Jeder Stadtteil hat ungerade viele Brücken. Kann man jede Brücke genau einmal überqueren?
    params:
      options:
        - label: Nein – vier Knoten mit ungeradem Grad sind zu viele
          correct: true
        - label: Ja, wenn man am richtigen Ort startet
          feedback: Höchstens zwei Knoten dürfen ungerade sein.
        - label: Das hängt vom Tempo ab
          feedback: Es ist eine Frage der Struktur, nicht der Zeit.
    hints:
      - "Eulers Regel: höchstens zwei Ecken mit ungeradem Grad."
    explanation: Mit dieser Überlegung begründete Euler 1736 die **Graphentheorie**.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: network
    prompt: "Das Haus vom Nikolaus: Zeichne es in einem Zug. Tippe die Ecken nacheinander an, jede Linie genau einmal."
    params:
      aspect: 1
      nodes:
        - id: A
          x: 20
          y: 95
        - id: B
          x: 80
          y: 95
        - id: C
          x: 20
          y: 45
        - id: D
          x: 80
          y: 45
        - id: E
          x: 50
          y: 5
      edges:
        - a: A
          b: B
        - a: A
          b: C
        - a: B
          b: D
        - a: C
          b: D
        - a: A
          b: D
        - a: B
          b: C
        - a: C
          b: E
        - a: D
          b: E
    check:
      predicate: everyEdgeOnce
    solution:
      state:
        path:
          - A
          - C
          - E
          - D
          - C
          - B
          - D
          - A
          - B
        colors: {}
        edges: []
    hints:
      - Die unteren Ecken A und B haben ungeraden Grad. Starte an einer davon.
      - Hebe dir die Linie A–B für den Schluss auf.
    explanation: Zum Beispiel A, C, E, D, C, B, D, A, B. Start und Ende liegen an den beiden ungeraden Ecken.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: Die Ecken eines Netzes haben die Grade 3, 3, 2, 2 und 4. Wie viele Kanten hat es?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 14
        misconception: double-count
        text: Jede Kante hat zwei Enden und wird darum doppelt gezählt.
    hints:
      - Addiere alle Grade.
      - Jede Kante zählt an beiden Enden.
    explanation: 3 + 3 + 2 + 2 + 4 = 14, geteilt durch 2 ergibt 7. Das ist das Handschlag-Lemma.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: Kann ein Netz genau eine Ecke mit ungeradem Grad haben?
    params:
      options:
        - label: Nein – die Summe aller Grade ist doppelt so groß wie die Zahl der Kanten, also gerade
          correct: true
        - label: Ja, zum Beispiel ein Dreieck
          feedback: Im Dreieck haben alle Ecken Grad 2.
        - label: Nur in großen Netzen
          feedback: Die Größe spielt keine Rolle.
    hints:
      - Was weißt du über die Summe aller Grade?
      - Eine einzelne ungerade Zahl macht eine Summe ungerade.
    explanation: "Ungerade Ecken gibt es immer in gerader Anzahl: 0, 2, 4 … Darum hat ein Zug durch alle Kanten nie genau ein loses Ende."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Jede **Kante** einmal ablaufen (Euler) ist leicht zu prüfen. Jeden **Knoten** einmal besuchen (Hamilton) dagegen …?
    params:
      options:
        - label: … ist extrem schwer – man kennt kein schnelles Verfahren
          correct: true
        - label: … ist genauso leicht
          feedback: Für Knoten gibt es keine einfache Regel wie bei den Kanten.
        - label: … ist immer unmöglich
          feedback: In vielen Netzen geht es – man findet es nur schwer heraus.
    hints:
      - Fast dieselbe Frage – völlig andere Schwierigkeit.
    explanation: Eine winzige Änderung der Frage macht aus einem leichten Problem ein NP-vollständiges.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: In Königsberg haben die vier Stadtteile die Grade 5, 3, 3 und 3. Wie viele Brücken muss man mindestens neu bauen, damit ein Spaziergang über jede Brücke genau einmal möglich wird? Start und Ende dürfen verschieden sein.
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 2
        misconception: closed-walk
        text: Zwei ungerade Ecken dürfen bleiben – Start und Ende.
    hints:
      - Wie viele ungerade Ecken darf ein offener Weg haben?
      - Eine neue Brücke macht zwei ungerade Ecken gerade.
    explanation: Eine Brücke zwischen zwei ungeraden Stadtteilen lässt genau zwei ungerade übrig. Für einen Rundweg bräuchte man 2.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Ein Postbote muss jede Straße mindestens einmal ablaufen und zum Start zurück. Was tut er bei ungeraden Ecken?
    params:
      options:
        - label: Er läuft einige Straßen doppelt – möglichst kurze, die ungerade Ecken paarweise verbinden
          correct: true
        - label: Er lässt Straßen aus
          feedback: Jede Straße muss bedient werden.
        - label: Nichts, das geht immer ohne Umweg
          feedback: Nur ohne ungerade Ecken.
    hints:
      - Ungerade Ecken verhindern einen Rundweg.
      - Doppelt gelaufene Straßen wirken wie neue Kanten.
    explanation: Das ist das Briefträgerproblem. Es lässt sich schnell lösen, mit kürzesten Wegen und Paarungen – anders als das Rundreiseproblem.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Eulers Regel mit den ungeraden Ecken stimmt.
    params:
      keywords:
        - - rein
          - raus
          - hinein
          - hinaus
          - in and out
          - enter
          - leave
        - - paar
          - gerade
          - even
          - pair
        - - start
          - ende
          - end
          - anfang
          - begin
      sample: Jedes Mal, wenn ich durch eine Ecke laufe, komme ich hinein und wieder hinaus – das verbraucht zwei Linien, ein Paar. Durchlaufene Ecken haben also geraden Grad. Nur am Start und am Ende darf eine Linie übrig sein.
    difficulty: 3

srs:
  cards_from: [start, welche]
