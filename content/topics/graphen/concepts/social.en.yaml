id: cs.graphs.social
type: concept
title: Social networks
summary: Friends of friends.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: kette
    widget: network
    prompt: Reach the star through as few acquaintances as possible. Tap the chain.
    params:
      start: U
      end: S
      unit: steps
      nodes:
        - { id: U, x: 4, y: 50, label: You }
        - { id: A, x: 30, y: 12, label: Ali }
        - { id: B, x: 30, y: 88, label: Bea }
        - { id: C, x: 55, y: 42, label: Cem }
        - { id: D, x: 66, y: 90, label: Dana }
        - { id: E, x: 78, y: 12, label: Eli }
        - { id: S, x: 96, y: 55, label: Star }
      edges:
        - { a: U, b: A }
        - { a: U, b: B }
        - { a: A, b: C }
        - { a: C, b: E }
        - { a: E, b: S }
        - { a: B, b: D }
        - { a: D, b: S }
        - { a: B, b: C }
    hints:
      - Each line is an acquaintance. Count steps.
    explanation: You → Bea → Dana → Star, three steps.

  - kind: problem
    id: freunde
    widget: numeric
    prompt: How many direct contacts does Bea have in the network above?
    params: { unit: contacts }
    answer: { value: 3 }
    hints:
      - Count the lines at Bea.
    explanation: You, Cem and Dana. In graph theory, this is called the **degree**.

  - kind: explain
    id: s3
    body: |
      In real networks, almost everyone is connected within a few steps. The reason is **nodes with very many contacts**. They link distant **groups**.

  - kind: problem
    id: wachstum
    widget: numeric
    prompt: Everyone knows {{k}} people. How many people can you reach in two steps at most?
    params: { unit: people }
    answer: { value: "{{k * k}}" }
    hints:
      - "{{k}} friends with {{k}} friends each."
    explanation: "{{k}} · {{k}} = {{k * k}}, with no overlaps. After a few steps, you reach millions."
    variants:
      params: { k: "choice[50,100,150,200]" }
      defaults: { k: 100 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In a network of 6 people everyone knows everyone. How many connections are there?
    answer:
      value: 15
    hints:
      - 6 · 5 divided by 2.
    explanation: 15. With a billion users it would be 5 · 10¹⁷ possible connections.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: In a group of {{n}} people everyone knows everyone. How many acquaintances are there?
    answer:
      value: "{{n * (n - 1) / 2}}"
    feedback:
      - when: numval(state.input) == n * (n - 1)
        misconception: double-count
        text: That counts each acquaintance twice – once from each side.
    hints:
      - Each person knows {{n - 1}} others.
      - "{{n}} · {{n - 1}}, divided by 2."
    explanation: "{{n}} · {{n - 1}} / 2 = {{n * (n - 1) / 2}}. The number of pairs grows quadratically."
    difficulty: 2
    variants:
      params:
        n: int[5,30]
      defaults:
        n: 10

  - kind: problem
    id: cs-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: through how many people in between was each Facebook user linked to any other in 2016, on average?"
    params:
      min: 1
      max: 20
    answer:
      value: 3.6
      tolerance: 1
    explanation: A 2016 analysis found about 3.6 people in between on average. The »six degrees« of old experiments have shrunk further online.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: What is the fastest way to find the shortest chain of acquaintances between two people?
    params:
      options:
        - label: "Breadth-first search: first all direct friends, then their friends …"
          correct: true
        - label: "Depth-first search: follow one chain as far as possible"
          feedback: It finds some path, not necessarily the shortest.
        - label: List all chains
          feedback: There are astronomically many.
    hints:
      - Without weights only the number of steps counts.
      - Ring by ring outwards.
    explanation: Breadth-first search reaches each person first via the shortest chain. It is Dijkstra for networks where every edge costs 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Your friends have **more** friends on average than you. That is true for almost everyone. Why?
    params:
      options:
        - label: People with many friends show up in far more friend lists
          correct: true
        - label: Because you underestimate yourself
          feedback: It is a purely mathematical bias.
        - label: That is not true
          feedback: It is measurable in real networks.
    hints:
      - Someone with 500 friends is counted 500 times as “someone’s friend”.
    explanation: The **friendship paradox** – a selection effect. It is used to detect epidemics early.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what is a graph – and what is it needed for?"
    params:
      keywords:
        - - knoten
          - punkt
          - node
          - point
          - vertex
        - - kante
          - verbindung
          - linie
          - edge
          - connection
          - link
        - - weg
          - netz
          - karte
          - route
          - path
          - network
          - map
      sample: A graph consists of nodes and edges that connect them. It describes networks of all kinds, such as road maps for shortest paths or friendships in social networks.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Bea has 4 friends. Of the possible pairs among them, 3 are friends. What fraction of the pairs is that? (This is Bea's clustering coefficient.)
    answer:
      value: 0.5
    hints:
      - How many pairs do 4 people form?
      - 4 · 3 / 2 = 6 pairs.
    explanation: "3 of 6 = 0.5. In social networks this value is high: friends of friends are often friends themselves."
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Google rated web pages early on with PageRank. What counts most?
    params:
      options:
        - label: How many important pages link to a page
          correct: true
        - label: How often a search word appears on the page
          feedback: That was too easy to game.
        - label: How new the page is
          feedback: Age played no role in PageRank.
    hints:
      - A link is like a vote.
      - A vote from an important page counts more.
    explanation: Important is whoever is linked by important pages – a recursive definition. Mathematically PageRank is an eigenvector of the link matrix.
    difficulty: 3

srs:
  cards_from: [freunde, wachstum]
