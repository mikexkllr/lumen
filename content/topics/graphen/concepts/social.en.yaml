id: cs.graphs.social
type: concept
title: Social networks
summary: Friends of friends.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: kette
    widget: network
    prompt: Reach the star through as few acquaintances as possible. Tap the chain.
    params:
      start: U
      end: S
      unit: steps
      nodes:
        - { id: U, x: 4, y: 50, label: You }
        - { id: A, x: 30, y: 12, label: Ali }
        - { id: B, x: 30, y: 88, label: Bea }
        - { id: C, x: 55, y: 42, label: Cem }
        - { id: D, x: 66, y: 90, label: Dana }
        - { id: E, x: 78, y: 12, label: Eli }
        - { id: S, x: 96, y: 55, label: Star }
      edges:
        - { a: U, b: A }
        - { a: U, b: B }
        - { a: A, b: C }
        - { a: C, b: E }
        - { a: E, b: S }
        - { a: B, b: D }
        - { a: D, b: S }
        - { a: B, b: C }
    hints:
      - Each line is an acquaintance. Count steps.
    explanation: You → Bea → Dana → Star, three steps.

  - kind: problem
    id: freunde
    widget: numeric
    prompt: How many direct contacts does Bea have in the network above?
    params: { unit: contacts }
    answer: { value: 3 }
    hints:
      - Count the lines at Bea.
    explanation: You, Cem and Dana. In graph theory, this is called the **degree**.

  - kind: explain
    id: s3
    body: |
      In real networks, almost everyone is connected within a few steps. The reason is **nodes with very many contacts**. They link distant groups.

  - kind: problem
    id: wachstum
    widget: numeric
    prompt: Everyone knows {{k}} people. How many people can you reach in two steps at most?
    params: { unit: people }
    answer: { value: "{{k * k}}" }
    hints:
      - "{{k}} friends with {{k}} friends each."
    explanation: "{{k}} · {{k}} = {{k * k}}, with no overlaps. After a few steps, you reach millions."
    variants:
      params: { k: "choice[50,100,150,200]" }
      defaults: { k: 100 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In a network of 6 people everyone knows everyone. How many connections are there?
    answer:
      value: 15
    hints:
      - 6 · 5 divided by 2.
    explanation: 15. With a billion users it would be 5 · 10¹⁷ possible connections.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Your friends have **more** friends on average than you. That is true for almost everyone. Why?
    params:
      options:
        - label: People with many friends show up in far more friend lists
          correct: true
        - label: Because you underestimate yourself
          feedback: It is a purely mathematical bias.
        - label: That is not true
          feedback: It is measurable in real networks.
    hints:
      - Someone with 500 friends is counted 500 times as “someone’s friend”.
    explanation: The **friendship paradox** – a selection effect. It is used to detect epidemics early.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what is a graph – and what is it needed for?"
    params:
      keywords:
        - - knoten
          - punkt
          - node
          - point
          - vertex
        - - kante
          - verbindung
          - linie
          - edge
          - connection
          - link
        - - weg
          - netz
          - karte
          - route
          - path
          - network
          - map
      sample: A graph consists of nodes and edges that connect them. It describes networks of all kinds, such as road maps for shortest paths or friendships in social networks.
    difficulty: 3

srs:
  cards_from: [freunde, wachstum]
