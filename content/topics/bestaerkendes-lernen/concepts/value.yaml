id: ai.rl.value
type: concept
title: Was ist eine Lage wert?
summary: Belohnungen in der Zukunft.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Ein Agent lernt für jede Situation einen **Wert**: wie viel Belohnung er von dort aus noch erwarten kann. Spätere Belohnungen zählen etwas weniger – jeder Schritt **diskontiert** sie, zum Beispiel um 10 %.

  - kind: problem
    id: abzug
    widget: numeric
    prompt: In {{k}} Schritten wartet eine Belohnung von 100. Jeder Schritt zählt 10 % weniger. Wie viel ist sie jetzt wert?
    params: { placeholder: "Wert" }
    answer: { value: "{{100 * 0.9 ** k}}", tolerance: 0.01 }
    hints:
      - "100 · 0,9 hoch {{k}}."
    explanation: "100 · 0,9^{{k}} ≈ {{round(100 * 0.9 ** k, 2)}}."
    variants:
      params: { k: "int[1,3]" }
      defaults: { k: 2 }

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum zählen ferne Belohnungen weniger?
    params:
      options:
        - { label: Sie sind unsicherer und der Agent soll zügig handeln., correct: true }
        - { label: Weil sie kleiner sind., feedback: "Die Belohnung selbst ist gleich groß – sie liegt nur weiter weg." }
    hints:
      - Lieber jetzt 100 € oder in zehn Jahren?
    explanation: Ohne Abzug würde ein Agent Belohnungen endlos aufschieben.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Weg A bringt sofort 50. Weg B bringt 100 in 10 Schritten, jeder Schritt zählt 10 % weniger. Was ist mehr wert?
    params:
      options:
        - { label: Weg A, correct: true }
        - { label: Weg B, feedback: "100 · 0,9^10 sind nur etwa 35." }
    hints:
      - "0,9^10 ist etwa 0,35."
    explanation: Geduld lohnt sich nur, wenn die spätere Belohnung groß genug ist.

srs:
  cards_from: [abzug, vergleich]
