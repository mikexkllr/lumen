id: ai.rl.value
type: concept
title: Was ist eine Lage wert?
summary: Belohnungen in der Zukunft.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Schach: Du kannst sofort einen Bauern schlagen. Oder du machst einen Zug, der in drei Zügen die Dame gewinnt. Was ist besser?"
    params:
      options:
        - label: Der Zug zur Dame
          correct: true
        - label: Der Bauer – sicher ist sicher
          feedback: Die Dame ist viel mehr wert.
        - label: Egal
          feedback: Die Züge führen zu sehr verschiedenen Lagen.
    hints:
      - Zählt nur, was sofort passiert?
    explanation: Eine gute Lage ist mehr wert als ein schneller Gewinn.

  - kind: explain
    id: s1
    body: |
      Ein Agent lernt für jede Situation einen **Wert**: wie viel Belohnung er von dort aus noch erwarten kann. Spätere Belohnungen zählen etwas weniger – jeder Schritt **diskontiert** sie, zum Beispiel um 10 %.

  - kind: problem
    id: abzug
    widget: numeric
    prompt: In {{k}} Schritten wartet eine Belohnung von 100. Jeder Schritt zählt 10 % weniger. Wie viel ist sie jetzt wert?
    params: { placeholder: "Wert" }
    answer: { value: "{{100 * 0.9 ** k}}", tolerance: 0.01 }
    hints:
      - "100 · 0,9 hoch {{k}}."
    explanation: "100 · 0,9^{{k}} ≈ {{round(100 * 0.9 ** k, 2)}}."
    variants:
      params: { k: "int[1,3]" }
      defaults: { k: 2 }

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum zählen ferne Belohnungen weniger?
    params:
      options:
        - { label: Sie sind unsicherer und der Agent soll zügig handeln., correct: true }
        - { label: Weil sie kleiner sind., feedback: "Die Belohnung selbst ist gleich groß – sie liegt nur weiter weg." }
    hints:
      - Lieber jetzt 100 € oder in zehn Jahren?
    explanation: Ohne Abzug würde ein Agent Belohnungen endlos aufschieben.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Weg A bringt sofort 50. Weg B bringt 100 in 10 Schritten, jeder Schritt zählt 10 % weniger. Was ist mehr wert?
    params:
      options:
        - { label: Weg A, correct: true }
        - { label: Weg B, feedback: "100 · 0,9^10 sind nur etwa 35." }
    hints:
      - "0,9^10 ist etwa 0,35."
    explanation: Geduld lohnt sich nur, wenn die spätere Belohnung groß genug ist.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: "Zehn Punkte Belohnung: Wann sind sie für den Agenten am meisten wert? Ordne vom höchsten Wert zum kleinsten."
    params:
      items:
        - label: Sofort
        - label: In 2 Zügen
        - label: In 10 Zügen
        - label: In 100 Zügen
    hints:
      - Spätere Belohnungen zählen etwas weniger.
    explanation: Dieses Abwerten heißt Diskontierung. Es macht den Agenten zielstrebig.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Agent bekommt in jedem Schritt für immer die Belohnung 1. Jeder weitere Schritt zählt 10 % weniger (Faktor 0,9). Wie viel ist das insgesamt wert?
    answer:
      value: 10
    hints:
      - "Geometrische Reihe: 1 : (1 − 0,9)."
    explanation: 1 + 0,9 + 0,81 + … = 10. Durch das Abzinsen bleibt selbst eine unendliche Zukunft endlich viel wert.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Q-Lernen: Q ← Q + α · (r + γ · Q_max − Q). Es gilt Q = 0, α = 0,5, Belohnung r = 0, γ = 0,9. Der beste Wert im nächsten Zustand ist Q_max = 10. Wie lautet das neue Q?"
    answer:
      value: 4.5
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 9
        misconception: no-alpha
        text: Das ist das Ziel r + γ · Q_max. Mit α = 0,5 geht man nur die Hälfte des Wegs dorthin.
    hints:
      - "Ziel: r + γ · Q_max = 0 + 0,9 · 10 = 9."
      - Q + 0,5 · (9 − 0) = ?
    explanation: 0 + 0,5 · 9 = 4,5. Der Wert des Ziels »sickert« so Schritt für Schritt zurück zu früheren Zuständen. Das ist **Q-Lernen** von Hand.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Die **Bellman-Gleichung** sagt: Der Wert einer Lage ist …?"
    params:
      options:
        - label: … die sofortige Belohnung plus der abgezinste Wert der besten Folgelage
          correct: true
        - label: … die Summe aller Belohnungen, die es je gab
          feedback: Es zählt die Zukunft, nicht die Vergangenheit.
        - label: … immer null
          feedback: Nur in einer Lage ohne jede Aussicht.
    hints:
      - Der Wert von heute hängt vom Wert von morgen ab.
    explanation: "Eine rekursive Definition: So lässt sich ein riesiges Planungsproblem in lauter Ein-Schritt-Probleme zerlegen."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Derselbe Übergang passiert noch einmal: Q = 4,5, r = 0, γ = 0,9, Q_max = 10, α = 0,5. Wie lautet das Q danach?"
    answer:
      value: 6.75
      tolerance: 0.001
    hints:
      - Das Ziel ist wieder 9.
      - 4,5 + 0,5 · (9 − 4,5) = ?
    explanation: 6,75 – Q nähert sich der 9 wie 4,5, 6,75, 7,875 … Jedes Update schließt die halbe Lücke. Mit genug Erkundung führt Q-Lernen zu den **optimalen** Werten.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Q-Lernen nutzt im Update Q_max – den Wert der **besten** nächsten Aktion –, auch wenn der Agent gerade zufällig erkundet. Was folgt daraus?
    params:
      options:
        - label: Es lernt die Werte der besten Strategie, während es eine andere ausführt.
          correct: true
        - label: Es kann nicht erkunden.
          feedback: Erkunden darf es – das Update bewertet nur trotzdem das Beste.
        - label: Es lernt die Werte der Zufallsstrategie.
          feedback: Dafür müsste es den Wert der tatsächlich gewählten Aktion nutzen.
    hints:
      - Welche Aktion steckt in Q_max – die gewählte oder die beste?
      - Verhalten und Lernziel dürfen hier verschieden sein.
    explanation: "Q-Lernen ist **off-policy**: Es handelt erkundend, lernt aber gierig. Darum kann es auch aus alten oder fremden Erfahrungen lernen."
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Q-Lernen den Wert einer Aktion Schritt für Schritt verbessert.
    params:
      keywords:
        - - belohnung
          - reward
        - - nächst
          - später
          - zukunft
          - next
          - later
          - future
        - - schätz
          - korrigier
          - näher
          - estimate
          - correct
          - closer
          - update
      sample: Nach jeder Aktion vergleicht der Agent seine Schätzung mit der Belohnung plus dem abgezinsten besten Wert im nächsten Zustand. Dann rückt er seine Schätzung ein Stück näher an diesen Wert.
    difficulty: 3

srs:
  cards_from: [abzug, vergleich]
