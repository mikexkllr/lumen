id: ai.rl.explore
type: concept
title: Erkunden oder ausnutzen?
summary: Das Dilemma jedes Lernenden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Bleiben oder wagen?
    body: "Bewährtes nutzen oder Neues **erkunden**? Vor dieser Frage stehst du täglich – und jede lernende Maschine auch. Deck die Karten auf: Was kostet es, nur das eine zu tun?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎵
            front: Nur Lieblingssongs?
            back: Hörst du nur, was du kennst, findest du nie einen neuen Lieblingssong.
          - icon: 🗺️
            front: Immer neue Wege?
            back: Wer jeden Tag einen neuen Weg zur Arbeit testet, kommt oft zu spät.
          - icon: 🤖
            front: Und ein Roboter?
            back: Ein lernender Agent hat dasselbe Problem – bei jedem einzelnen Zug.

  - kind: problem
    id: restaurant
    widget: choice
    prompt: Du kennst ein gutes Restaurant. Gehst du immer dorthin oder probierst du neue aus?
    params:
      options:
        - { label: "Meistens das bekannte, ab und zu ein neues", correct: true }
        - { label: Immer das bekannte, feedback: "Dann findest du nie heraus, ob es ein besseres gibt." }
        - { label: Immer ein neues, feedback: "Dann nutzt du nie, was du schon weißt." }
    hints:
      - Beides hat Kosten.
    explanation: Genau diese Mischung brauchen auch lernende Agenten.

  - kind: explain
    id: s2
    body: |
      **Ausnutzen** heißt, die bisher beste Aktion zu wählen. **Erkunden** heißt, etwas Neues zu probieren. Eine einfache Strategie: Mit kleiner Wahrscheinlichkeit ε handelt der Agent zufällig, sonst nutzt er sein Wissen.

  - kind: problem
    id: epsilon
    widget: numeric
    prompt: Ein Agent erkundet mit ε = {{e}} %. Wie viele von {{n}} Zügen sind ungefähr zufällig?
    params: { unit: Züge }
    answer: { value: "{{n * e / 100}}" }
    hints:
      - "{{e}} % von {{n}}."
    explanation: "{{n}} · {{e}} % = {{n * e / 100}} Züge."
    variants:
      params: { e: "choice[5,10,20]", n: "choice[100,200,500]" }
      defaults: { e: 10, n: 200 }

  - kind: problem
    id: spaeter
    widget: choice
    prompt: Wie sollte sich ε im Laufe des Lernens verändern?
    params:
      options:
        - { label: Es sollte langsam kleiner werden., correct: true }
        - { label: Es sollte wachsen., feedback: "Mit mehr Wissen lohnt sich Ausprobieren immer weniger." }
    hints:
      - Wann weiß der Agent mehr – am Anfang oder später?
    explanation: Erst viel erkunden, dann immer mehr das Gelernte nutzen.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Erkunden oder ausnutzen?
    params:
      buckets:
        - id: b1
          label: Erkunden
        - id: b2
          label: Ausnutzen
      items:
        - label: Ein neues Restaurant testen
          bucket: b1
        - label: Das Lieblingsgericht bestellen
          bucket: b2
        - label: Eine unbekannte Abkürzung nehmen
          bucket: b1
        - label: Den gewohnten Heimweg gehen
          bucket: b2
    hints:
      - Neues probieren – oder Bewährtes wiederholen?
    explanation: Wer nur ausnutzt, verpasst Besseres. Wer nur erkundet, nutzt sein Wissen nie.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Drei Spielautomaten zahlen im Schnitt 2 €, 5 € und 3 € pro Zug. Ein Agent wählt mit 90 % den besten und mit 10 % zufällig einen der drei. Wie viel gewinnt er im Schnitt pro Zug? Auf zwei Stellen.
    params:
      unit: €
    answer:
      value: 4.83
      tolerance: 0.01
    hints:
      - "0,9 · 5 + 0,1 · (2 + 5 + 3) : 3."
    explanation: 4,50 + 0,33 = 4,83 €. Das Erkunden kostet 17 Cent pro Zug – der Preis fürs Lernen.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Agent schätzt einen Automaten auf 4 € – aus 4 Versuchen. Der 5. Versuch bringt 9 €. Neue Schätzung = alte + (Gewinn − alte) / 5. Wie lautet sie?
    answer:
      value: 5
    hints:
      - Gewinn − alte Schätzung = 9 − 4 = 5.
      - 4 + 5 / 5 = ?
    explanation: "Das ist genau der Mittelwert aller 5 Versuche: (16 + 9) / 5 = 5. Diese **schrittweise Mittelung** braucht keine alte Liste – nur die Schätzung und die Anzahl."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Eine klügere Strategie als Zufall: Probiere bevorzugt, worüber du **am wenigsten weißt**. Warum ist das sinnvoll?"
    params:
      options:
        - label: Dort ist die Chance am größten, etwas zu entdecken, das besser ist als gedacht
          correct: true
        - label: Unbekanntes ist immer besser
          feedback: Oft ist es schlechter – aber man lernt am meisten.
        - label: Es spart Rechenzeit
          feedback: Der Grund ist der Informationsgewinn.
    hints:
      - Ein Automat, den du erst einmal gespielt hast, könnte ein Geheimtipp sein.
    explanation: »Optimismus bei Unsicherheit«. So entscheiden auch Ärzte, welche neue Therapie man testen sollte.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Der beste Automat zahlt im Schnitt 5 €, der Agent bekommt im Schnitt 4,83 € pro Zug. Wie viel Euro verliert er gegenüber dem Besten in 1000 Zügen?
    answer:
      value: 170
      tolerance: 1
    hints:
      - "Verlust pro Zug: 5 − 4,83."
      - 0,17 · 1000 = ?
    explanation: 170 €. Dieser Verlust heißt **Regret**. Mit festem ε wächst er für immer mit. Gute Strategien lassen ihn nur noch sehr langsam wachsen, etwa logarithmisch.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux das Dilemma zwischen Erkunden und Ausnutzen.
    params:
      keywords:
        - - erkund
          - neu
          - explor
          - new
        - - ausnutz
          - beste
          - bekannt
          - exploit
          - best
          - known
        - - verpass
          - verlust
          - risiko
          - miss
          - loss
          - risk
      sample: Ausnutzen heißt, das bisher Beste zu wählen. Erkunden heißt, Neues zu probieren. Wer nie erkundet, verpasst vielleicht etwas Besseres. Wer nur erkundet, verschenkt sichere Gewinne.
    difficulty: 3

srs:
  cards_from: [restaurant, spaeter]
