id: ai.rl.games
type: concept
title: Mastering games
summary: Training against yourself.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many digits does the number of possible Go positions have?"
    params:
      min: 10
      max: 500
    answer:
      value: 171
      tolerance: 40
    explanation: About 10¹⁷⁰ – far more than atoms in the universe (10⁸⁰). Trying them all is hopeless.

  - kind: problem
    id: selbst
    widget: choice
    prompt: How did Go programs become better than all humans?
    params:
      options:
        - { label: They played millions of games against themselves., correct: true }
        - { label: Programmers coded in all the rules for good moves., feedback: "Go has more positions than there are atoms in the universe. You can't do that by hand." }
    hints:
      - Who is the ideal training partner that never gets tired?
    explanation: Through self-play they found moves that professionals first took for mistakes.

  - kind: explain
    id: s2
    body: |
      Reinforcement learning shines where results are easy to judge but hard to demonstrate. Examples are games, robot movements and controllers. The **reward** is clear there: win, don't fall over, save energy.

  - kind: problem
    id: art
    widget: buckets
    prompt: Is this reinforcement learning or supervised learning?
    params:
      buckets: [{ label: reinforcement }, { label: supervised }]
      items:
        - { label: A robot learns to walk, bucket: reinforcement }
        - { label: A program plays chess, bucket: reinforcement }
        - { label: Recognizing cat photos, bucket: supervised }
        - { label: Filtering spam emails, bucket: supervised }
    hints:
      - Are there ready-made examples with solutions?
    explanation: With labeled examples you learn in a supervised way. With rewards, it is reinforcement learning.

  - kind: problem
    id: zuege
    widget: numeric
    prompt: An agent plays {{n}} games of about 200 moves each. How many moves is that in total?
    params: { unit: moves }
    answer: { value: "{{n * 200}}" }
    hints:
      - "{{n}} · 200."
    explanation: "{{n * 200}} moves. The agent learns a little from each one."
    variants:
      params: { n: "choice[1000,5000,20000]" }
      defaults: { n: 5000 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In 2016 AlphaGo played “move 37”, which professionals first took for a mistake. It decided the game. What does that show?
    params:
      options:
        - label: A learning system can find strategies humans did not come up with in millennia
          correct: true
        - label: The move was chance
          feedback: The system had rated it as strong.
        - label: The professionals were bad
          feedback: They were the best in the world.
    hints:
      - It learnt not only from human games but from its own play.
    explanation: Through **self-play** an agent is not limited to human knowledge.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A chess position has about 35 possible moves. Roughly how many million positions are there after 4 half-moves? To one decimal.
    answer:
      value: 1.5
      tolerance: 0.1
    hints:
      - Each half-move multiplies by 35.
      - 35⁴ = 1,500,625.
    explanation: About 1.5 million after just 4 half-moves. The game tree grows exponentially. That is why strong programs only search promising branches – guided by learned evaluations.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Why is training against itself so effective?
    params:
      options:
        - label: The opponent is always exactly as strong as you – and improves with you.
          correct: true
        - label: Because you never lose.
          feedback: You lose all the time – to yourself.
        - label: Because human games are bad.
          feedback: Human games often help a lot at the start – self-play just goes further.
    hints:
      - Against a much weaker opponent you learn little. Against a much stronger one too.
      - What is guaranteed in self-play?
    explanation: Self-play supplies unlimited games at the right level. It can get stuck in dead ends, though, so systems often also train against older versions of themselves.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A robot learns to walk perfectly in a simulation – and stumbles at once in the real world. Why?
    params:
      options:
        - label: The simulation differs slightly from reality in friction, delays and sensor errors
          correct: true
        - label: Real robots cannot learn
          feedback: They can – real training is just slow and expensive.
        - label: The robot forgot it
          feedback: What it learnt just does not fit exactly.
    hints:
      - The agent exploited every quirk of the simulation.
    explanation: "The **sim-to-real gap**. The remedy: deliberately vary the simulation at random."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Strong Go and chess programs combine two things. Which?
    params:
      options:
        - label: A tree search over future moves and a network that evaluates positions and suggests good moves.
          correct: true
        - label: A database of all games plus randomness.
          feedback: There are far more positions than were ever played.
        - label: Only a very large network without any search.
          feedback: Networks alone play well – search makes them much stronger.
    hints:
      - The network supplies intuition. What does the search supply?
      - The search checks whether the intuition still holds a few moves later.
    explanation: Monte Carlo tree search looks ahead, while the network prunes it to good branches and evaluates positions. Both keep improving through self-play.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why reinforcement learning works especially well for games.
    params:
      keywords:
        - - belohnung
          - gewinn
          - sieg
          - reward
          - win
        - - klar
          - eindeutig
          - regel
          - clear
          - rules
        - - selbst
          - million
          - partien
          - self
          - million
          - games
      sample: "In games the reward is clear: won or lost. The rules are exactly known, and a program can play millions of games against itself. That way it gathers more experience than any human ever could."
    difficulty: 3

srs:
  cards_from: [selbst, art]
