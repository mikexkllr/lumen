id: ai.rl.value
type: concept
title: What is a situation worth?
summary: Rewards in the future.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Chess: you can take a pawn right now. Or you make a move that wins the queen in three moves. Which is better?"
    params:
      options:
        - label: The move towards the queen
          correct: true
        - label: The pawn – better safe
          feedback: The queen is worth far more.
        - label: It does not matter
          feedback: The moves lead to very different positions.
    hints:
      - Does only what happens right away count?
    explanation: A good position is worth more than a quick gain.

  - kind: explain
    id: s1
    body: |
      For every situation, an agent learns a **value**: how much reward it can still expect from there. Later rewards count a little less. Each step **discounts** them, for example by 10 %.

  - kind: problem
    id: abzug
    widget: numeric
    prompt: A reward of 100 waits {{k}} steps away. Each step counts 10 % less. How much is it worth now?
    params: { placeholder: "Value" }
    answer: { value: "{{100 * 0.9 ** k}}", tolerance: 0.01 }
    hints:
      - "100 · 0.9 to the power {{k}}."
    explanation: "100 · 0.9^{{k}} ≈ {{round(100 * 0.9 ** k, 2)}}."
    variants:
      params: { k: "int[1,3]" }
      defaults: { k: 2 }

  - kind: problem
    id: warum
    widget: choice
    prompt: Why do distant rewards count less?
    params:
      options:
        - { label: "They are less certain, and the agent should act quickly.", correct: true }
        - { label: Because they are smaller., feedback: "The reward itself is the same size. It is just further away." }
    hints:
      - Would you rather have 100 € now or in ten years?
    explanation: Without a discount, an agent would put off rewards forever.

  - kind: problem
    id: vergleich
    widget: choice
    prompt: Path A gives 50 right away. Path B gives 100 in 10 steps, and each step counts 10 % less. Which is worth more?
    params:
      options:
        - { label: Path A, correct: true }
        - { label: Path B, feedback: "100 · 0.9^10 is only about 35." }
    hints:
      - "0.9^10 is about 0.35."
    explanation: Patience only pays off if the later reward is big enough.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: "Ten points of reward: when are they worth most to the agent? Order from highest value to lowest."
    params:
      items:
        - label: Right now
        - label: In 2 moves
        - label: In 10 moves
        - label: In 100 moves
    hints:
      - Later rewards count a little less.
    explanation: This marking down is called discounting. It makes the agent purposeful.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An agent receives a reward of 1 at every step forever. Each further step counts 10% less (factor 0.9). How much is that worth in total?
    answer:
      value: 10
    hints:
      - "Geometric series: 1 ÷ (1 − 0.9)."
    explanation: 1 + 0.9 + 0.81 + … = 10. Discounting keeps even an infinite future worth a finite amount.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Q-learning: Q ← Q + α · (r + γ · Q_max − Q). Here Q = 0, α = 0.5, reward r = 0, γ = 0.9. The best value in the next state is Q_max = 10. What is the new Q?"
    answer:
      value: 4.5
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 9
        misconception: no-alpha
        text: That is the target r + γ · Q_max. With α = 0.5 you only go halfway there.
    hints:
      - "Target: r + γ · Q_max = 0 + 0.9 · 10 = 9."
      - Q + 0.5 · (9 − 0) = ?
    explanation: 0 + 0.5 · 9 = 4.5. The goal's value "trickles" back to earlier states step by step. That is Q-learning by hand.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The **Bellman equation** says: the value of a state is …?"
    params:
      options:
        - label: … the immediate reward plus the discounted value of the best next state
          correct: true
        - label: … the sum of all rewards there ever were
          feedback: The future counts, not the past.
        - label: … always zero
          feedback: Only in a state with no prospects at all.
    hints:
      - Today’s value depends on tomorrow’s value.
    explanation: "A recursive definition: it breaks a huge planning problem into nothing but one-step problems."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "The same transition happens again: Q = 4.5, r = 0, γ = 0.9, Q_max = 10, α = 0.5. What is Q afterwards?"
    answer:
      value: 6.75
      tolerance: 0.001
    hints:
      - The target is 9 again.
      - 4.5 + 0.5 · (9 − 4.5) = ?
    explanation: 6.75 – Q approaches 9 like 4.5, 6.75, 7.875 … Each update closes half the gap. With enough exploration Q-learning converges to the optimal values.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Q-learning uses Q_max – the value of the **best** next action – in its update, even when the agent is exploring at random. What follows?
    params:
      options:
        - label: It learns the values of the best strategy while following a different one.
          correct: true
        - label: It cannot explore.
          feedback: It may explore – the update simply still scores the best option.
        - label: It learns the values of the random strategy.
          feedback: For that it would have to use the value of the action actually taken.
    hints:
      - Which action is inside Q_max – the chosen one or the best?
      - Behaviour and learning target can differ here.
    explanation: "Q-learning is off-policy: it acts exploratively but learns greedily. That is why it can also learn from old or other agents' experience."
    difficulty: 3

  - kind: problem
    id: la-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how Q-learning improves the value of an action step by step.
    params:
      keywords:
        - - belohnung
          - reward
        - - nächst
          - später
          - zukunft
          - next
          - later
          - future
        - - schätz
          - korrigier
          - näher
          - estimate
          - correct
          - closer
          - update
      sample: After each action the agent compares its estimate with the reward plus the discounted best value of the next state. Then it moves its estimate a bit closer to that value.
    difficulty: 3

srs:
  cards_from: [abzug, vergleich]
