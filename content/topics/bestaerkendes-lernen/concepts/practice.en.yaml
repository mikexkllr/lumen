id: ai.rl.practice
type: concept
title: When the reward is off
summary: Reward hacking and RLHF.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: boot
    widget: choice
    body: In a boat racing game, players got points for collecting bonus items. One agent drove in circles forever, collecting the same items again and again, instead of reaching the finish.
    prompt: What went wrong?
    params:
      options:
        - { label: The reward did not reward the actual goal., correct: true }
        - { label: The agent was too dumb., feedback: "On the contrary. It found the best strategy for the reward it was given." }
    hints:
      - What were the points actually given for?
    explanation: Agents optimize exactly what you measure, not what you mean.

  - kind: explain
    body: |
      Chatbots are also refined with reinforcement learning. People rate answers, a model learns these preferences, and the chatbot is trained on them. This is called **RLHF**: reinforcement learning from human feedback.

  - kind: problem
    id: rlhf
    widget: choice
    prompt: What is one danger of training a chatbot only on "people like it"?
    params:
      options:
        - { label: "It flatters instead of being honest.", correct: true }
        - { label: It becomes too curt., feedback: "Rather the opposite. It says what people want to hear." }
    hints:
      - What do people like that is not always true?
    explanation: Good rewards must measure honesty and helpfulness equally.

  - kind: problem
    id: gute-belohnung
    widget: buckets
    prompt: Good or risky reward for a cleaning robot?
    params:
      buckets: [{ label: good }, { label: risky }]
      items:
        - { label: Clean floor at the end, bucket: good }
        - { label: Low energy use and nothing broken, bucket: good }
        - { label: As much vacuumed dust as possible, bucket: risky }
        - { label: No visible dirt spots anymore, bucket: risky }
    hints:
      - How could a clever robot trick the reward?
    explanation: It could spread dust and vacuum it up again, or simply cover the camera.

srs:
  cards_from: [boot, rlhf]
