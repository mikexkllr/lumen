id: ai.rl.practice
type: concept
title: When the reward is off
summary: Reward hacking and RLHF.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: boot
    widget: choice
    body: In a boat racing game, players got points for collecting bonus items. One agent drove in circles forever, collecting the same items again and again, instead of reaching the finish.
    prompt: What went wrong?
    params:
      options:
        - { label: The reward did not reward the actual goal., correct: true }
        - { label: The agent was too dumb., feedback: "On the contrary. It found the best strategy for the reward it was given." }
    hints:
      - What were the points actually given for?
    explanation: Agents optimize exactly what you measure, not what you mean.

  - kind: explain
    id: s2
    body: |
      Chatbots are also refined with reinforcement learning. People rate answers, a model learns these preferences, and the chatbot is trained on them. This is called **RLHF**: reinforcement learning from human feedback.

  - kind: problem
    id: rlhf
    widget: choice
    prompt: What is one danger of training a chatbot only on "people like it"?
    params:
      options:
        - { label: "It flatters instead of being honest.", correct: true }
        - { label: It becomes too curt., feedback: "Rather the opposite. It says what people want to hear." }
    hints:
      - What do people like that is not always true?
    explanation: Good rewards must measure honesty and helpfulness equally.

  - kind: problem
    id: gute-belohnung
    widget: buckets
    prompt: Good or risky reward for a cleaning robot?
    params:
      buckets: [{ label: good }, { label: risky }]
      items:
        - { label: Clean floor at the end, bucket: good }
        - { label: Low energy use and nothing broken, bucket: good }
        - { label: As much vacuumed dust as possible, bucket: risky }
        - { label: No visible dirt spots anymore, bucket: risky }
    hints:
      - How could a clever robot trick the reward?
    explanation: It could spread dust and vacuum it up again, or simply cover the camera.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An agent maximises exactly the [[reward]] it is given – not what you actually [[mean]].
      distractors:
        - penalty
        - write

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In a boat racing game points were given for collected targets. The agent circled endlessly collecting the same three. Why?
    params:
      options:
        - label: That scored more points than finishing the race – the reward was badly designed
          correct: true
        - label: The agent was broken
          feedback: It was very good at maximising points.
        - label: It wanted to annoy the developers
          feedback: It has no intentions.
    hints:
      - What exactly were points given for?
    explanation: A real example from 2016. The agent did exactly what was rewarded – not what was wanted.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: This is how a chatbot is refined with human feedback. Put the steps in order.
    params:
      items:
        - label: The model writes several answers to a question.
        - label: People choose which answer is better.
        - label: A reward model learns these preferences.
        - label: The chatbot is trained to score highly.
        - label: Fresh tests with people check the result.
    hints:
      - Without answers there is nothing to compare.
      - The reward model stands in for people during the actual training.
    explanation: This is RLHF. Comparisons are easier for people than scores. The reward model can then judge millions of answers – but only as well as it learned.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: how does reinforcement learning differ from learning from examples?"
    params:
      keywords:
        - - belohn
          - reward
          - strafe
          - punish
        - - ausprobier
          - probiert
          - versuch
          - irrtum
          - trial
          - error
          - try
          - handeln
          - action
        - - beispiel
          - label
          - richtige antwort
          - example
          - correct answer
          - vormachen
          - shown
      sample: When learning from examples the model is shown the correct answer for each case. In reinforcement learning an agent tries actions itself and only learns through reward or punishment how good they were.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: In RLHF there is a penalty if the chatbot drifts too far from the original model. What for?
    params:
      options:
        - label: So it does not exploit the reward model's gaps and produce strange text.
          correct: true
        - label: So it computes faster.
          feedback: The penalty changes training, not computing time.
        - label: So it learns nothing new.
          feedback: It should learn – just not drift arbitrarily far.
    hints:
      - What happens if you optimise hard against a flawed reward model?
      - The starting model writes natural text.
    explanation: This distance penalty curbs reward hacking. Where answers can be checked automatically, as with maths or coding tasks, direct checks are also used as rewards.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Why is a reward like "the program passes all tests" often more robust than "a person likes the answer"?
    params:
      options:
        - label: It measures the result directly – flattery or nice wording do not help.
          correct: true
        - label: Because tests never have gaps.
          feedback: Tests can be incomplete and gamed too.
        - label: Because people do not understand programs.
          feedback: Many do – but judgements are slow and can be swayed.
    hints:
      - What can a model do to please a person without being right?
      - And against a test?
    explanation: "Verifiable rewards are harder to exploit. They are never completely safe: an agent might, for example, change the tests themselves if allowed to."
    difficulty: 3

srs:
  cards_from: [boot, rlhf]
