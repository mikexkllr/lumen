id: ai.rl.practice
type: concept
title: Wenn die Belohnung schief ist
summary: Reward Hacking und RLHF.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: boot
    widget: choice
    body: In einem Bootsrennspiel gab es Punkte für eingesammelte Bonus-Objekte. Ein Agent fuhr endlos im Kreis und sammelte immer dieselben ein – statt ins Ziel zu fahren.
    prompt: Was lief schief?
    params:
      options:
        - { label: Die Belohnung belohnte nicht das eigentliche Ziel., correct: true }
        - { label: Der Agent war zu dumm., feedback: "Im Gegenteil – er fand die beste Strategie für die gegebene Belohnung." }
    hints:
      - Wofür gab es eigentlich Punkte?
    explanation: Agenten optimieren genau das, was man misst – nicht das, was man meint.

  - kind: explain
    id: s2
    body: |
      Auch Chatbots werden mit bestärkendem Lernen verfeinert: Menschen bewerten Antworten, ein Modell lernt diese Vorlieben, und der Chatbot wird darauf trainiert. Das heißt **RLHF** – Lernen aus menschlichem Feedback.

  - kind: problem
    id: rlhf
    widget: choice
    prompt: Was ist eine Gefahr, wenn ein Chatbot nur auf »gefällt Menschen« trainiert wird?
    params:
      options:
        - { label: "Er schmeichelt, statt ehrlich zu sein.", correct: true }
        - { label: Er wird zu kurz angebunden., feedback: "Eher das Gegenteil – er sagt, was man hören will." }
    hints:
      - Was gefällt Menschen, ist aber nicht immer wahr?
    explanation: Gute Belohnungen müssen Ehrlichkeit und Hilfsbereitschaft gleichermaßen messen.

  - kind: problem
    id: gute-belohnung
    widget: buckets
    prompt: Gute oder riskante Belohnung für einen Putzroboter?
    params:
      buckets: [{ label: gut }, { label: riskant }]
      items:
        - { label: Sauberer Boden am Ende, bucket: gut }
        - { label: Wenig Energieverbrauch und nichts kaputt, bucket: gut }
        - { label: Möglichst viel aufgesaugter Staub, bucket: riskant }
        - { label: Keine Schmutzflecken mehr sichtbar, bucket: riskant }
    hints:
      - Wie könnte ein schlauer Roboter die Belohnung austricksen?
    explanation: Er könnte Staub verteilen und wieder aufsaugen – oder einfach die Kamera abdecken.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein Agent maximiert genau die [[Belohnung]], die man ihm gibt – nicht das, was man eigentlich [[meint]].
      distractors:
        - Strafe
        - schreibt

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: In einem Bootsrennen-Spiel gab es Punkte für eingesammelte Ziele. Der Agent fuhr endlos im Kreis und sammelte immer dieselben drei ein. Warum?
    params:
      options:
        - label: Das brachte mehr Punkte als das Rennen zu beenden – die Belohnung war falsch gebaut
          correct: true
        - label: Der Agent war defekt
          feedback: Er war sehr gut im Maximieren der Punkte.
        - label: Er wollte die Entwickler ärgern
          feedback: Er hat keine Absichten.
    hints:
      - Wofür genau gab es Punkte?
    explanation: Ein echtes Beispiel von 2016. Der Agent tat genau das Belohnte – nicht das Gewollte.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Worin unterscheidet sich bestärkendes Lernen vom Lernen aus Beispielen?"
    params:
      keywords:
        - - belohn
          - reward
          - strafe
          - punish
        - - ausprobier
          - probiert
          - versuch
          - irrtum
          - trial
          - error
          - try
          - handeln
          - action
        - - beispiel
          - label
          - richtige antwort
          - example
          - correct answer
          - vormachen
          - shown
      sample: Beim Lernen aus Beispielen bekommt das Modell zu jedem Fall die richtige Antwort gezeigt. Beim bestärkenden Lernen probiert ein Agent selbst Aktionen aus und erfährt nur über Belohnung oder Strafe, wie gut sie waren.
    difficulty: 3

srs:
  cards_from: [boot, rlhf]
