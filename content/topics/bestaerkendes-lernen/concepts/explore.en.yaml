id: ai.rl.explore
type: concept
title: Explore or exploit?
summary: The dilemma of every learner.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: restaurant
    widget: choice
    prompt: You know a good restaurant. Do you always go there, or do you try new ones?
    params:
      options:
        - { label: "Mostly the familiar one, sometimes a new one", correct: true }
        - { label: Always the familiar one, feedback: "Then you never find out whether there is a better one." }
        - { label: Always a new one, feedback: "Then you never use what you already know." }
    hints:
      - Both have costs.
    explanation: Learning agents need exactly this mix.

  - kind: explain
    id: s2
    body: |
      **Exploiting** means choosing the best action known so far. **Exploring** means trying something new. A simple strategy: with a small probability ε the agent acts at random. Otherwise it uses its knowledge.

  - kind: problem
    id: epsilon
    widget: numeric
    prompt: An agent explores with ε = {{e}} %. About how many of {{n}} moves are random?
    params: { unit: moves }
    answer: { value: "{{n * e / 100}}" }
    hints:
      - "{{e}} % of {{n}}."
    explanation: "{{n}} · {{e}} % = {{n * e / 100}} moves."
    variants:
      params: { e: "choice[5,10,20]", n: "choice[100,200,500]" }
      defaults: { e: 10, n: 200 }

  - kind: problem
    id: spaeter
    widget: choice
    prompt: How should ε change over the course of learning?
    params:
      options:
        - { label: It should slowly get smaller., correct: true }
        - { label: It should grow., feedback: "With more knowledge, trying things out pays off less and less." }
    hints:
      - When does the agent know more, at the start or later?
    explanation: Explore a lot first, then rely more and more on what you have learned.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Explore or exploit?
    params:
      buckets:
        - id: b1
          label: Explore
        - id: b2
          label: Exploit
      items:
        - label: Try a new restaurant
          bucket: b1
        - label: Order the favourite dish
          bucket: b2
        - label: Take an unknown shortcut
          bucket: b1
        - label: Walk the usual way home
          bucket: b2
    hints:
      - Try something new – or repeat what works?
    explanation: Whoever only exploits misses better things. Whoever only explores never uses their knowledge.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Three slot machines pay €2, €5 and €3 per pull on average. An agent picks the best with 90% and one of the three at random with 10%. How much does it win per pull on average? To two places.
    params:
      unit: €
    answer:
      value: 4.83
      tolerance: 0.01
    hints:
      - 0.9 · 5 + 0.1 · (2 + 5 + 3) ÷ 3.
    explanation: 4.50 + 0.33 = €4.83. Exploring costs 17 cents per pull – the price of learning.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A smarter strategy than chance: prefer to try what you **know least about**. Why does that make sense?"
    params:
      options:
        - label: That is where the chance is greatest of discovering something better than assumed
          correct: true
        - label: The unknown is always better
          feedback: Often it is worse – but you learn the most.
        - label: It saves computing time
          feedback: The reason is the information gain.
    hints:
      - A machine you have played only once might be a hidden gem.
    explanation: “Optimism in the face of uncertainty”. This is also how doctors decide which new therapy to test.
    difficulty: 3

srs:
  cards_from: [restaurant, spaeter]
