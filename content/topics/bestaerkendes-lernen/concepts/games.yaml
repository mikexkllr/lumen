id: ai.rl.games
type: concept
title: Spiele meistern
summary: Gegen sich selbst trainieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Maschinen am Spielbrett
    body: "Spiele sind das **Labor** der KI: klare Regeln, klarer Sieger. Deck die Stationen auf: Wann schlugen Maschinen die Besten – und womit?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: ♚
            front: "1997: Schach"
            back: Ein Computer schlug den Weltmeister – mit roher Rechenkraft und Regeln von Menschen.
          - icon: ⚫
            front: "2016: Go"
            back: Eine KI spielte einen Zug, den Profis für einen Fehler hielten. Sie gewann die Partie.
          - icon: ♟️
            front: "2017: Schach in Stunden"
            back: Eine KI lernte Schach in wenigen Stunden – und schlug danach das beste Schachprogramm.
          - icon: 🃏
            front: "2019: Poker"
            back: Ein Programm schlug Profis beim Poker – samt Bluffen.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Stellen hat die Zahl der möglichen Go-Stellungen?"
    params:
      min: 10
      max: 500
    answer:
      value: 171
      tolerance: 40
    explanation: Etwa 10¹⁷⁰ – weit mehr als Atome im Universum (10⁸⁰). Durchprobieren ist aussichtslos.

  - kind: problem
    id: selbst
    widget: choice
    prompt: Wie wurden Go-Programme besser als alle Menschen?
    params:
      options:
        - { label: Sie spielten Millionen Partien gegen sich selbst., correct: true }
        - { label: Man programmierte alle Regeln für gute Züge ein., feedback: "Go hat mehr Stellungen als Atome im Universum – das geht nicht von Hand." }
    hints:
      - Wer ist der ideale Trainingspartner, der nie müde wird?
    explanation: Durch Selbstspiel entdeckten sie Züge, die Profis zuerst für Fehler hielten.

  - kind: explain
    id: s2
    body: |
      Bestärkendes Lernen glänzt, wo man Ergebnisse leicht bewerten, aber schwer vormachen kann: Spiele, Roboterbewegungen, Steuerungen. Die **Belohnung** ist dort klar – gewinnen, nicht umfallen, Energie sparen.

  - kind: problem
    id: art
    widget: buckets
    prompt: Passt eher bestärkendes oder überwachtes Lernen?
    params:
      buckets: [{ label: bestärkend }, { label: überwacht }]
      items:
        - { label: Ein Roboter lernt laufen, bucket: bestärkend }
        - { label: Ein Programm spielt Schach, bucket: bestärkend }
        - { label: Katzenfotos erkennen, bucket: überwacht }
        - { label: Spam-Mails aussortieren, bucket: überwacht }
    hints:
      - Gibt es fertige Beispiele mit Lösung?
    explanation: Mit beschrifteten Beispielen lernt man überwacht, mit Belohnungen bestärkend.

  - kind: problem
    id: zuege
    widget: numeric
    prompt: Ein Agent spielt {{n}} Partien mit je etwa 200 Zügen. Wie viele Züge sind das insgesamt?
    params: { unit: Züge }
    answer: { value: "{{n * 200}}" }
    hints:
      - "{{n}} · 200."
    explanation: "{{n * 200}} Züge – aus jedem lernt der Agent ein bisschen."
    variants:
      params: { n: "choice[1000,5000,20000]" }
      defaults: { n: 5000 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: AlphaGo spielte 2016 den »Zug 37«, den Profis erst für einen Fehler hielten. Er war spielentscheidend. Was zeigt das?
    params:
      options:
        - label: Ein lernendes System kann Strategien finden, auf die Menschen in Jahrtausenden nicht kamen
          correct: true
        - label: Der Zug war Zufall
          feedback: Das System hatte ihn als stark bewertet.
        - label: Die Profis waren schlecht
          feedback: Es waren die besten der Welt.
    hints:
      - Es lernte nicht nur aus menschlichen Partien, sondern aus eigenem Spiel.
    explanation: Durch **Selbstspiel** ist ein Agent nicht auf menschliches Wissen begrenzt.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: In einer Schachstellung gibt es etwa 35 mögliche Züge. Wie viele Millionen Stellungen gibt es ungefähr nach 4 Halbzügen? Auf eine Stelle.
    answer:
      value: 1.5
      tolerance: 0.1
    hints:
      - Jeder Halbzug multipliziert mit 35.
      - 35⁴ = 1 500 625.
    explanation: Rund 1,5 Millionen nach nur 4 Halbzügen. Der **Spielbaum** wächst exponentiell. Darum durchsuchen starke Programme nur vielversprechende Äste – gelenkt von gelernten Bewertungen.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Warum ist Training gegen sich selbst so wirksam?
    params:
      options:
        - label: Der Gegner ist immer genau so stark wie man selbst – und wird mit besser.
          correct: true
        - label: Weil man dabei nie verliert.
          feedback: Man verliert ständig – gegen sich selbst.
        - label: Weil menschliche Partien schlecht sind.
          feedback: Menschliche Partien helfen am Anfang oft sehr – Selbstspiel geht nur weiter.
    hints:
      - Gegen einen viel schwächeren Gegner lernt man wenig. Gegen einen viel stärkeren auch.
      - Was ist beim Selbstspiel garantiert?
    explanation: "**Selbstspiel** liefert unbegrenzt Partien auf passendem Niveau. Es kann aber in Sackgassen geraten. Darum trainiert man oft auch gegen ältere Versionen von sich."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Roboter lernt in einer Simulation perfekt zu laufen – und stolpert in der echten Welt sofort. Warum?
    params:
      options:
        - label: Die Simulation weicht in Reibung, Verzögerung und Messfehlern leicht von der Wirklichkeit ab
          correct: true
        - label: Echte Roboter können nicht lernen
          feedback: Sie lernen – nur ist echtes Training langsam und teuer.
        - label: Der Roboter hat es vergessen
          feedback: Das Gelernte passt nur nicht genau.
    hints:
      - Der Agent hat jede Eigenheit der Simulation ausgenutzt.
    explanation: "Die **Sim-to-Real-Lücke**. Abhilfe: die Simulation absichtlich zufällig variieren."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Starke Go- und Schachprogramme kombinieren zwei Dinge. Welche?
    params:
      options:
        - label: Eine Baumsuche über künftige Züge und ein Netz, das Stellungen bewertet und gute Züge vorschlägt.
          correct: true
        - label: Eine Datenbank aller Partien und Zufall.
          feedback: Es gibt viel mehr Stellungen, als je gespielt wurden.
        - label: Nur ein sehr großes Netz ohne jede Suche.
          feedback: Netze allein spielen stark – Suche macht sie aber deutlich stärker.
    hints:
      - Das Netz liefert die Intuition. Was liefert die Suche?
      - Die Suche prüft, ob die Intuition ein paar Züge später noch hält.
    explanation: Die **Monte-Carlo-Baumsuche** schaut voraus, das Netz kürzt sie auf gute Äste und bewertet Stellungen. Beide werden im Selbstspiel immer wieder verbessert.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum bestärkendes Lernen gerade bei Spielen so gut funktioniert.
    params:
      keywords:
        - - belohnung
          - gewinn
          - sieg
          - reward
          - win
        - - klar
          - eindeutig
          - regel
          - clear
          - rules
        - - selbst
          - million
          - partien
          - self
          - million
          - games
      sample: "Bei Spielen ist die Belohnung klar: gewonnen oder verloren. Die Regeln sind genau bekannt, und ein Programm kann Millionen Partien gegen sich selbst spielen. So sammelt es mehr Erfahrung, als je ein Mensch hätte."
    difficulty: 3

srs:
  cards_from: [selbst, art]
