id: ai.rl.games
type: concept
title: Spiele meistern
summary: Gegen sich selbst trainieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Stellen hat die Zahl der möglichen Go-Stellungen?"
    params:
      min: 10
      max: 500
    answer:
      value: 171
      tolerance: 40
    explanation: Etwa 10¹⁷⁰ – weit mehr als Atome im Universum (10⁸⁰). Durchprobieren ist aussichtslos.


  - kind: problem
    id: selbst
    widget: choice
    prompt: Wie wurden Go-Programme besser als alle Menschen?
    params:
      options:
        - { label: Sie spielten Millionen Partien gegen sich selbst., correct: true }
        - { label: Man programmierte alle Regeln für gute Züge ein., feedback: "Go hat mehr Stellungen als Atome im Universum – das geht nicht von Hand." }
    hints:
      - Wer ist der ideale Trainingspartner, der nie müde wird?
    explanation: Durch Selbstspiel entdeckten sie Züge, die Profis zuerst für Fehler hielten.

  - kind: explain
    id: s2
    body: |
      Bestärkendes Lernen glänzt, wo man Ergebnisse leicht bewerten, aber schwer vormachen kann: Spiele, Roboterbewegungen, Steuerungen. Die Belohnung ist dort klar – gewinnen, nicht umfallen, Energie sparen.

  - kind: problem
    id: art
    widget: buckets
    prompt: Passt eher bestärkendes oder überwachtes Lernen?
    params:
      buckets: [{ label: bestärkend }, { label: überwacht }]
      items:
        - { label: Ein Roboter lernt laufen, bucket: bestärkend }
        - { label: Ein Programm spielt Schach, bucket: bestärkend }
        - { label: Katzenfotos erkennen, bucket: überwacht }
        - { label: Spam-Mails aussortieren, bucket: überwacht }
    hints:
      - Gibt es fertige Beispiele mit Lösung?
    explanation: Mit beschrifteten Beispielen lernt man überwacht, mit Belohnungen bestärkend.

  - kind: problem
    id: zuege
    widget: numeric
    prompt: Ein Agent spielt {{n}} Partien mit je etwa 200 Zügen. Wie viele Züge sind das insgesamt?
    params: { unit: Züge }
    answer: { value: "{{n * 200}}" }
    hints:
      - "{{n}} · 200."
    explanation: "{{n * 200}} Züge – aus jedem lernt der Agent ein bisschen."
    variants:
      params: { n: "choice[1000,5000,20000]" }
      defaults: { n: 5000 }

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: AlphaGo spielte 2016 den »Zug 37«, den Profis erst für einen Fehler hielten. Er war spielentscheidend. Was zeigt das?
    params:
      options:
        - label: Ein lernendes System kann Strategien finden, auf die Menschen in Jahrtausenden nicht kamen
          correct: true
        - label: Der Zug war Zufall
          feedback: Das System hatte ihn als stark bewertet.
        - label: Die Profis waren schlecht
          feedback: Es waren die besten der Welt.
    hints:
      - Es lernte nicht nur aus menschlichen Partien, sondern aus eigenem Spiel.
    explanation: Durch **Selbstspiel** ist ein Agent nicht auf menschliches Wissen begrenzt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Roboter lernt in einer Simulation perfekt zu laufen – und stolpert in der echten Welt sofort. Warum?
    params:
      options:
        - label: Die Simulation weicht in Reibung, Verzögerung und Messfehlern leicht von der Wirklichkeit ab
          correct: true
        - label: Echte Roboter können nicht lernen
          feedback: Sie lernen – nur ist echtes Training langsam und teuer.
        - label: Der Roboter hat es vergessen
          feedback: Das Gelernte passt nur nicht genau.
    hints:
      - Der Agent hat jede Eigenheit der Simulation ausgenutzt.
    explanation: "Die **Sim-to-Real-Lücke**. Abhilfe: die Simulation absichtlich zufällig variieren."
    difficulty: 3

srs:
  cards_from: [selbst, art]
