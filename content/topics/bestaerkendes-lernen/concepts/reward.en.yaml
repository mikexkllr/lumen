id: ai.rl.reward
type: concept
title: Rewards instead of examples
summary: Agent, environment, reward.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      In **reinforcement learning**, an **agent** tries out actions and receives rewards or penalties. Nobody shows it the right solution. It learns what pays off in the long run.

  - kind: problem
    id: hund
    widget: choice
    prompt: Which example is most like reinforcement learning?
    params:
      options:
        - { label: A dog learns tricks through treats., correct: true }
        - { label: You learn vocabulary from a list., feedback: "With a list, the right answers are already there." }
        - { label: You sort photos using a template., feedback: "With a template, that is supervised learning." }
    hints:
      - Where is there only feedback, but no model solution?
    explanation: The dog tries things, and the reward reinforces what works.

  - kind: problem
    id: weg
    widget: network
    prompt: The agent must reach goal Z. Every connection costs penalty points. Find the path with the smallest total penalty.
    params:
      start: S
      end: Z
      unit: penalty points
      nodes:
        - { id: S, x: 4, y: 50 }
        - { id: A, x: 32, y: 12 }
        - { id: B, x: 32, y: 88 }
        - { id: C, x: 66, y: 12 }
        - { id: D, x: 66, y: 88 }
        - { id: Z, x: 96, y: 50 }
      edges:
        - { a: S, b: A, w: 1 }
        - { a: S, b: B, w: 4 }
        - { a: A, b: C, w: 5 }
        - { a: A, b: D, w: 2 }
        - { a: B, b: D, w: 1 }
        - { a: C, b: Z, w: 1 }
        - { a: D, b: Z, w: 3 }
    hints:
      - The cheapest first step is not always part of the best path. Work out the whole paths.
    explanation: S → A → D → Z costs 6. An agent learns exactly such a path through many tries.

  - kind: problem
    id: ziel
    widget: choice
    prompt: What does an agent try to maximize in reinforcement learning?
    params:
      options:
        - { label: The sum of all future rewards, correct: true }
        - { label: Only the next reward, feedback: "Then it would never make a small sacrifice for a big gain." }
    hints:
      - Think of chess. Sometimes you sacrifice a piece.
    explanation: Smart agents give something up now to get more later.

srs:
  cards_from: [hund, ziel]
