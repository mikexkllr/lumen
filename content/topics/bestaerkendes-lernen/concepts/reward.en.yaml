id: ai.rl.reward
type: concept
title: Rewards instead of examples
summary: Agent, environment, reward.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: How does a dog learn the command “sit”?
    params:
      options:
        - label: It gets a treat when it does it right
          correct: true
        - label: You explain it in detail
          feedback: Dogs do not understand explanations.
        - label: It reads up on it
          feedback: Dogs cannot read.
    hints:
      - What motivates a dog?
    explanation: Try and get rewarded. Some AI systems learn the same way.


  - kind: explain
    id: s1
    body: |
      In **reinforcement learning**, an **agent** tries out actions and receives rewards or penalties. Nobody shows it the right solution. It learns what pays off in the long run.

  - kind: problem
    id: hund
    widget: choice
    prompt: Which example is most like reinforcement learning?
    params:
      options:
        - { label: A dog learns tricks through treats., correct: true }
        - { label: You learn vocabulary from a list., feedback: "With a list, the right answers are already there." }
        - { label: You sort photos using a template., feedback: "With a template, that is supervised learning." }
    hints:
      - Where is there only feedback, but no model solution?
    explanation: The dog tries things, and the reward reinforces what works.

  - kind: problem
    id: weg
    widget: network
    prompt: The agent must reach goal Z. Every connection costs penalty points. Find the path with the smallest total penalty.
    params:
      start: S
      end: Z
      unit: penalty points
      nodes:
        - { id: S, x: 4, y: 50 }
        - { id: A, x: 32, y: 12 }
        - { id: B, x: 32, y: 88 }
        - { id: C, x: 66, y: 12 }
        - { id: D, x: 66, y: 88 }
        - { id: Z, x: 96, y: 50 }
      edges:
        - { a: S, b: A, w: 1 }
        - { a: S, b: B, w: 4 }
        - { a: A, b: C, w: 5 }
        - { a: A, b: D, w: 2 }
        - { a: B, b: D, w: 1 }
        - { a: C, b: Z, w: 1 }
        - { a: D, b: Z, w: 3 }
    hints:
      - The cheapest first step is not always part of the best path. Work out the whole paths.
    explanation: S → A → D → Z costs 6. An agent learns exactly such a path through many tries.

  - kind: problem
    id: ziel
    widget: choice
    prompt: What does an agent try to maximize in reinforcement learning?
    params:
      options:
        - { label: The sum of all future rewards, correct: true }
        - { label: Only the next reward, feedback: "Then it would never make a small sacrifice for a big gain." }
    hints:
      - Think of chess. Sometimes you sacrifice a piece.
    explanation: Smart agents give something up now to get more later.

  - kind: problem
    id: c1
    widget: match
    prompt: What is what when playing chess?
    params:
      pairs:
        - left: Agent
          right: the chess program
        - left: Environment
          right: the board with the opponent
        - left: Action
          right: a move
        - left: Reward
          right: win or loss
    hints:
      - The agent acts, the environment responds.
    explanation: These four terms describe every reinforcement learning problem.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: An agent wins a chess game after 60 moves. Which move was decisive? Why is that hard to say?
    params:
      options:
        - label: The reward only comes at the end – it must be spread over all earlier moves
          correct: true
        - label: Because chess is too simple
          feedback: Chess is a prime example of it.
        - label: It is always the last move
          feedback: Often the decision fell much earlier.
    hints:
      - Many moves lie between the good idea and the win.
    explanation: "The **credit assignment problem**: which earlier action deserves the praise? It is the core of reinforcement learning."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A robot should learn to walk. There is a reward only at the goal 100 metres away. What is the problem?
    params:
      options:
        - label: By random flailing it never reaches the goal – there is nothing to learn from
          correct: true
        - label: The reward is too large
          feedback: It simply never arrives.
        - label: There is none
          feedback: Without intermediate signals it stays down.
    hints:
      - How likely is it to walk 100 metres by chance?
    explanation: "**Sparse rewards**. The remedy: reward intermediate goals – which again opens loopholes."
    difficulty: 3

srs:
  cards_from: [hund, ziel]
