id: ai.rl.reward
type: concept
title: Belohnung statt Beispiele
summary: Agent, Umgebung, Belohnung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Wie lernt ein Hund das Kommando »Sitz«?
    params:
      options:
        - label: Er bekommt ein Leckerli, wenn er es richtig macht
          correct: true
        - label: Man erklärt es ihm genau
          feedback: Hunde verstehen keine Erklärungen.
        - label: Er liest es nach
          feedback: Hunde können nicht lesen.
    hints:
      - Was motiviert einen Hund?
    explanation: Ausprobieren und belohnt werden. So lernen auch manche KI-Systeme.


  - kind: explain
    id: s1
    body: |
      Beim **bestärkenden Lernen** probiert ein **Agent** Aktionen aus und bekommt Belohnungen oder Strafen. Niemand zeigt ihm die richtige Lösung – er lernt, was sich auf Dauer lohnt.

  - kind: problem
    id: hund
    widget: choice
    prompt: Welches Beispiel ähnelt bestärkendem Lernen am meisten?
    params:
      options:
        - { label: Ein Hund lernt Tricks durch Leckerlis., correct: true }
        - { label: Man lernt Vokabeln aus einer Liste., feedback: "Bei einer Liste stehen die richtigen Antworten schon da." }
        - { label: Man sortiert Fotos nach Vorlage., feedback: "Mit Vorlage ist das überwachtes Lernen." }
    hints:
      - Wo gibt es nur Rückmeldung, aber keine Musterlösung?
    explanation: Der Hund probiert, und die Belohnung verstärkt, was funktioniert.

  - kind: problem
    id: weg
    widget: network
    prompt: Der Agent soll zum Ziel Z. Jede Verbindung kostet Strafpunkte. Finde den Weg mit der kleinsten Gesamtstrafe.
    params:
      start: S
      end: Z
      unit: Strafpunkte
      nodes:
        - { id: S, x: 4, y: 50 }
        - { id: A, x: 32, y: 12 }
        - { id: B, x: 32, y: 88 }
        - { id: C, x: 66, y: 12 }
        - { id: D, x: 66, y: 88 }
        - { id: Z, x: 96, y: 50 }
      edges:
        - { a: S, b: A, w: 1 }
        - { a: S, b: B, w: 4 }
        - { a: A, b: C, w: 5 }
        - { a: A, b: D, w: 2 }
        - { a: B, b: D, w: 1 }
        - { a: C, b: Z, w: 1 }
        - { a: D, b: Z, w: 3 }
    hints:
      - Der billigste erste Schritt ist nicht immer Teil des besten Wegs – rechne die ganzen Wege durch.
    explanation: S → A → D → Z kostet 6. Genau so einen Weg lernt ein Agent durch viele Versuche.

  - kind: problem
    id: ziel
    widget: choice
    prompt: Was versucht ein Agent beim bestärkenden Lernen zu maximieren?
    params:
      options:
        - { label: Die Summe aller künftigen Belohnungen, correct: true }
        - { label: Nur die nächste Belohnung, feedback: "Dann würde er nie ein kleines Opfer für einen großen Gewinn bringen." }
    hints:
      - Denk an Schach – manchmal opfert man eine Figur.
    explanation: Kluge Agenten verzichten jetzt, um später mehr zu bekommen.

  - kind: problem
    id: c1
    widget: match
    prompt: Was ist was beim Schachspielen?
    params:
      pairs:
        - left: Agent
          right: das Schachprogramm
        - left: Umgebung
          right: das Brett mit dem Gegner
        - left: Aktion
          right: ein Zug
        - left: Belohnung
          right: Sieg oder Niederlage
    hints:
      - Der Agent handelt, die Umgebung antwortet.
    explanation: Diese vier Begriffe beschreiben jedes Problem des bestärkenden Lernens.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Agent gewinnt eine Schachpartie nach 60 Zügen. Welcher Zug war der entscheidende? Warum ist das schwer zu sagen?
    params:
      options:
        - label: Die Belohnung kommt erst am Ende – sie muss auf alle früheren Züge verteilt werden
          correct: true
        - label: Weil Schach zu einfach ist
          feedback: Schach ist dafür ein Paradebeispiel.
        - label: Es ist immer der letzte Zug
          feedback: Oft fiel die Entscheidung viel früher.
    hints:
      - Zwischen der guten Idee und dem Sieg liegen viele Züge.
    explanation: "Das **Zuordnungsproblem**: Welche frühere Aktion verdient das Lob? Es ist der Kern des bestärkenden Lernens."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Roboter soll laufen lernen. Belohnung gibt es nur am Ziel in 100 Metern. Was ist das Problem?
    params:
      options:
        - label: Durch zufälliges Zappeln erreicht er das Ziel nie – es gibt nichts, woraus er lernen könnte
          correct: true
        - label: Die Belohnung ist zu groß
          feedback: Sie kommt schlicht nie an.
        - label: Es gibt keines
          feedback: Ohne Zwischensignale bleibt er liegen.
    hints:
      - Wie wahrscheinlich läuft man zufällig 100 Meter?
    explanation: "**Seltene Belohnungen**. Abhilfe: Zwischenziele belohnen – was aber wieder Schlupflöcher öffnet."
    difficulty: 3

srs:
  cards_from: [hund, ziel]
