id: ai.rl.reward
type: concept
title: Belohnung statt Beispiele
summary: Agent, Umgebung, Belohnung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Von null auf rennen
    body: "Wie lernt man laufen, wenn es einem niemand zeigt? Durch **Versuch und Irrtum**. Deck die Stationen auf: So brachte sich ein Roboter das Rennen bei."
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🤖
            front: Versuch 1
            back: Ein simulierter Roboter zappelt wild herum und fällt sofort um.
          - icon: ⭐
            front: Ein Punkt
            back: Kommt er ein Stück voran, gibt es einen Punkt. Sonst nichts – keine Anleitung.
          - icon: 🔁
            front: Versuch 10 000
            back: Was Punkte brachte, macht er öfter. Was nicht, lässt er bleiben.
          - icon: 🏃
            front: Versuch 1 000 000
            back: Er rennt, springt und klettert – obwohl niemand es ihm gezeigt hat.

  - kind: problem
    id: hook
    widget: choice
    prompt: Wie lernt ein Hund das Kommando »Sitz«?
    params:
      options:
        - label: Er bekommt ein Leckerli, wenn er es richtig macht
          correct: true
        - label: Man erklärt es ihm genau
          feedback: Hunde verstehen keine Erklärungen.
        - label: Er liest es nach
          feedback: Hunde können nicht lesen.
    hints:
      - Was motiviert einen Hund?
    explanation: Ausprobieren und belohnt werden. So lernen auch manche KI-Systeme.

  - kind: explain
    id: s1
    body: |
      Beim **bestärkenden Lernen** probiert ein **Agent** Aktionen aus und bekommt Belohnungen oder Strafen. Niemand zeigt ihm die richtige Lösung – er lernt, was sich auf Dauer lohnt.

  - kind: problem
    id: hund
    widget: choice
    prompt: Welches Beispiel ähnelt bestärkendem Lernen am meisten?
    params:
      options:
        - { label: Ein Hund lernt Tricks durch Leckerlis., correct: true }
        - { label: Man lernt Vokabeln aus einer Liste., feedback: "Bei einer Liste stehen die richtigen Antworten schon da." }
        - { label: Man sortiert Fotos nach Vorlage., feedback: "Mit Vorlage ist das überwachtes Lernen." }
    hints:
      - Wo gibt es nur Rückmeldung, aber keine Musterlösung?
    explanation: Der Hund probiert, und die Belohnung verstärkt, was funktioniert.

  - kind: problem
    id: weg
    widget: network
    prompt: Der Agent soll zum Ziel Z. Jede Verbindung kostet Strafpunkte. Finde den Weg mit der kleinsten Gesamtstrafe.
    params:
      start: S
      end: Z
      unit: Strafpunkte
      nodes:
        - { id: S, x: 4, y: 50 }
        - { id: A, x: 32, y: 12 }
        - { id: B, x: 32, y: 88 }
        - { id: C, x: 66, y: 12 }
        - { id: D, x: 66, y: 88 }
        - { id: Z, x: 96, y: 50 }
      edges:
        - { a: S, b: A, w: 1 }
        - { a: S, b: B, w: 4 }
        - { a: A, b: C, w: 5 }
        - { a: A, b: D, w: 2 }
        - { a: B, b: D, w: 1 }
        - { a: C, b: Z, w: 1 }
        - { a: D, b: Z, w: 3 }
    hints:
      - Der billigste erste Schritt ist nicht immer Teil des besten Wegs – rechne die ganzen Wege durch.
    explanation: S → A → D → Z kostet 6. Genau so einen Weg lernt ein Agent durch viele Versuche.

  - kind: problem
    id: ziel
    widget: choice
    prompt: Was versucht ein Agent beim bestärkenden Lernen zu maximieren?
    params:
      options:
        - { label: Die Summe aller künftigen Belohnungen, correct: true }
        - { label: Nur die nächste Belohnung, feedback: "Dann würde er nie ein kleines Opfer für einen großen Gewinn bringen." }
    hints:
      - Denk an Schach – manchmal opfert man eine Figur.
    explanation: Kluge Agenten verzichten jetzt, um später mehr zu bekommen.

  - kind: problem
    id: c1
    widget: match
    prompt: Was ist was beim Schachspielen?
    params:
      pairs:
        - left: Agent
          right: das Schachprogramm
        - left: Umgebung
          right: das Brett mit dem Gegner
        - left: Aktion
          right: ein Zug
        - left: Belohnung
          right: Sieg oder Niederlage
    hints:
      - Der Agent handelt, die Umgebung antwortet.
    explanation: Diese vier Begriffe beschreiben jedes Problem des bestärkenden Lernens.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne die Schleife des bestärkenden Lernens.
    params:
      items:
        - label: Die Lage beobachten
        - label: Eine Aktion wählen
        - label: Belohnung oder Strafe bekommen
        - label: Das Verhalten anpassen
    hints:
      - Erst schauen, dann handeln, dann lernen.
    explanation: Diese Schleife läuft millionenfach – so entsteht Können ohne Lehrer.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein [[Agent]] probiert Aktionen aus und bekommt dafür [[Belohnungen]]. Niemand zeigt ihm die richtige Lösung.
      distractors:
        - Lehrer
        - Beispiele

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Agent gewinnt eine Schachpartie nach 60 Zügen. Welcher Zug war der entscheidende? Warum ist das schwer zu sagen?
    params:
      options:
        - label: Die Belohnung kommt erst am Ende – sie muss auf alle früheren Züge verteilt werden
          correct: true
        - label: Weil Schach zu einfach ist
          feedback: Schach ist dafür ein Paradebeispiel.
        - label: Es ist immer der letzte Zug
          feedback: Oft fiel die Entscheidung viel früher.
    hints:
      - Zwischen der guten Idee und dem Sieg liegen viele Züge.
    explanation: "Das **Zuordnungsproblem**: Welche frühere Aktion verdient das Lob? Es ist der Kern des bestärkenden Lernens."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Roboter bekommt für jeden Schritt −1 und am Ziel +10. Sein Weg dauert {{k}} Schritte. Wie groß ist seine Gesamtbelohnung?
    answer:
      value: "{{10 - k}}"
    feedback:
      - when: numval(state.input) == 10 + k
        misconception: sign
        text: Die Schritte kosten – sie werden abgezogen.
    hints:
      - "{{k}} Schritte zu je −1 ergeben −{{k}}."
      - Dazu kommt +10 am Ziel.
    explanation: 10 − {{k}} = {{10 - k}}. Die kleine **Schrittstrafe** sorgt dafür, dass kurze Wege mehr wert sind – ohne dass man dem Roboter den Weg zeigt.
    difficulty: 2
    variants:
      params:
        k: int[2,9]
      defaults:
        k: 4

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Roboter soll laufen lernen. Belohnung gibt es nur am Ziel in 100 Metern. Was ist das Problem?
    params:
      options:
        - label: Durch zufälliges Zappeln erreicht er das Ziel nie – es gibt nichts, woraus er lernen könnte
          correct: true
        - label: Die Belohnung ist zu groß
          feedback: Sie kommt schlicht nie an.
        - label: Es gibt keines
          feedback: Ohne Zwischensignale bleibt er liegen.
    hints:
      - Wie wahrscheinlich läuft man zufällig 100 Meter?
    explanation: "**Seltene Belohnungen**. Abhilfe: Zwischenziele belohnen – was aber wieder Schlupflöcher öffnet."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Damit der Roboter schneller lernt, gibt man ihm Zwischenbelohnungen für »näher am Ziel«. Was ist das Risiko?
    params:
      options:
        - label: Er lernt vielleicht, die Zwischenbelohnungen zu sammeln, statt anzukommen.
          correct: true
        - label: Gar keins – mehr Belohnung ist immer besser.
          feedback: Jede Belohnung ist ein Ziel, das ausgenutzt werden kann.
        - label: Er lernt dann gar nichts mehr.
          feedback: Meist lernt er schneller – nur eben manchmal das Falsche.
    hints:
      - Was, wenn man durch Hin- und Herlaufen immer wieder »näher« kommt?
      - Belohnt wird, was gemessen wird.
    explanation: Solches **Reward Shaping** hilft oft, muss aber sorgfältig gebaut sein. Belohnt man nur Fortschritt, der sich nicht wiederholen lässt, bleibt das eigentliche Ziel dasselbe.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Agent beim bestärkenden Lernen lernt.
    params:
      keywords:
        - - aktion
          - handl
          - ausprobier
          - action
          - act
          - try
        - - belohnung
          - strafe
          - reward
          - penalty
        - - zukunft
          - summe
          - langfristig
          - future
          - sum
          - long
      sample: Der Agent probiert Aktionen aus und bekommt dafür Belohnungen oder Strafen. Er merkt sich, was auf Dauer die größte Summe an Belohnungen bringt, und handelt immer öfter so.
    difficulty: 3

srs:
  cards_from: [hund, ziel]
