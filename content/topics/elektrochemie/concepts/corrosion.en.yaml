id: chem.electrochem.corrosion
type: concept
title: "Corrosion and protection"
summary: "Rust as a tiny battery – and how to outwit it."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: what percentage of the world's economic output does corrosion cost each year?"
    params:
      min: 0
      max: 20
      unit: "%"
    answer:
      value: 3.4
      tolerance: 1.5
    explanation: Studies estimate about 3 to 4% – trillions for bridges, pipes, ships and cars.

  - kind: explain
    id: c1
    body: Corrosion is a galvanic cell on a single piece of metal. At one spot iron dissolves, at another oxygen takes up the electrons. This is called a **corrosion cell**.

  - kind: problem
    id: c2
    widget: order
    prompt: A drop of water sits on iron. Order what happens.
    params:
      items:
        - label: "In the middle of the drop: Fe → Fe²⁺ + 2 e⁻"
        - label: The electrons travel through the iron to the edge
        - label: "At the edge: O₂ + 2 H₂O + 4 e⁻ → 4 OH⁻"
        - label: Fe²⁺ and OH⁻ meet and a ring of rust forms
    hints:
      - The most oxygen reaches the edge.
      - Where there is little oxygen, the iron dissolves.
    explanation: "A paradox: the iron is eaten away where there is least oxygen. That is why it rusts especially under dirt and in crevices."

  - kind: problem
    id: c3
    widget: buckets
    prompt: An iron pipe touches another metal. Does that metal protect the iron or make it rust faster?
    params:
      buckets:
        - id: b1
          label: protects the iron
        - id: b2
          label: speeds up rusting
      items:
        - label: Zinc
          bucket: b1
        - label: Magnesium
          bucket: b1
        - label: Aluminium
          bucket: b1
        - label: Copper
          bucket: b2
        - label: Tin
          bucket: b2
        - label: Silver
          bucket: b2
    hints:
      - The less noble metal becomes the anode and dissolves.
      - Tin (−0.14 V) is more noble than iron (−0.44 V).
    explanation: Less noble metals sacrifice themselves. More noble ones turn the iron into the anode – it rusts faster than on its own.

  - kind: problem
    id: c4
    widget: choice
    prompt: Tin cans are made of tin-plated steel. What happens if the tin layer gets a deep scratch?
    params:
      options:
        - label: The iron in the scratch rusts even faster than unprotected iron
          correct: true
        - label: The tin sacrifices itself for the iron
          feedback: For that tin would need to be less noble – it is not.
        - label: Nothing – the tin heals the scratch
          feedback: Tin forms no protective layer over the scratch.
    hints:
      - Compare tin and iron in the series.
      - The less noble metal becomes the anode.
    explanation: Tin only protects while its layer is intact. Galvanised (zinc-coated) steel, by contrast, protects even in a scratch.

  - kind: explain
    id: d1
    depth: 2
    body: Pipes and bridges are often kept safe by **cathodic protection**. A weak power supply pushes electrons into the iron. Then the iron is the cathode everywhere, so it cannot dissolve.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A zinc sacrificial anode supplies 1 A of protective current for a year (3.16 · 10⁷ s). How many kg of zinc (65.4 g/mol, Zn²⁺) dissolve? (F = 96,485 C/mol) Give one decimal place.
    params:
      unit: kg
    answer:
      value: 10.7
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 21.4) < 0.2
        misconception: charge-ignored
        text: Each zinc gives up two electrons – divide by 2.
    hints:
      - Moles of electrons = 3.16 · 10⁷ ÷ 96,485 ≈ 328 mol.
      - "Half as much zinc: 164 mol · 65.4 g/mol."
    explanation: About 10.7 kg of zinc per year. That is why sacrificial anodes on ships are replaced regularly.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Why does iron rust much faster in acidic water than in neutral water?
    params:
      options:
        - label: Not only oxygen but now H⁺ too takes up electrons
          correct: true
        - label: Acid makes iron less noble
          feedback: The potential of the iron stays the same.
        - label: Acidic water is warmer
          feedback: The temperature is the same.
    hints:
      - Whatever takes up electrons at the cathode drives the corrosion.
      - 2 H⁺ + 2 e⁻ → H₂.
    explanation: With H⁺ as a second electron-catcher, the cell runs faster. That is how acid rain has damaged bridges and statues.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Stainless steel can suddenly get deep pits in salt water, even though the surface stays shiny. How does this pitting corrosion arise?
    params:
      options:
        - label: Chloride breaks the protective layer at one point – a tiny anode faces a huge cathode
          correct: true
        - label: The chromium evaporates
          feedback: Chromium does not evaporate at room temperature.
        - label: Salt is more noble than steel
          feedback: Salt is not a metal in the series.
    hints:
      - All the current from the large surface flows through the small pit.
      - Inside the pit it gets acidic and rich in chloride – which keeps it open.
    explanation: "Small anode, large cathode: the metal dissolves at a point, very fast. For seawater, steel with molybdenum is used."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Stainless steel screws are fitted to an aluminium boat. What threatens in seawater?
    params:
      options:
        - label: The aluminium around the screws corrodes
          correct: true
        - label: The screws rust away
          feedback: The more noble side is protected.
        - label: Nothing – both metals are rustproof
          feedback: In contact they form a cell.
    hints:
      - Two different metals plus salt water make a battery.
      - Aluminium is the less noble metal.
    explanation: This is called galvanic corrosion. Plastic washers separate the metals electrically and prevent it.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a zinc sacrificial anode protects a steel ship's hull.
    params:
      keywords:
        - - zink
          - zinc
        - - unedl
          - less noble
          - reaktiv
          - reactive
          - leichter
          - more easily
        - - elektron
          - electron
        - - anode
          - opfer
          - sacrific
          - löst
          - dissolv
      sample: Zinc is less noble than iron and gives up its electrons more easily. It becomes the anode and dissolves. Its electrons flow into the steel, which becomes the cathode and does not rust.
    explanation: The zinc sacrifices itself – the steel stays intact.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x1"]
