id: chem.electrochem.galvanic
type: concept
title: "The galvanic cell"
summary: "Anode, cathode, salt bridge – how a cell delivers current."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Power from a frog's leg
    body: Two different metals and a little salt water – that is all a battery needs. It was discovered by chance. Uncover the cards and follow the trail to the first **galvanic cell**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🐸
            front: "Around 1780: Galvani"
            back: He saw dead frog legs twitch when two metals touched them.
          - icon: 📚
            front: "1800: Volta"
            back: Volta stacked zinc, copper and card soaked in brine – the first battery.
          - icon: 🔋
            front: "1836: Daniell"
            back: Daniell separated the zinc and copper sides. His cell gave a steady current for a long time.
          - icon: 🦷
            front: Today
            back: Bite on foil and a metal filling may sting – a tiny cell in your mouth.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a zinc nail and a copper nail are stuck into a lemon. What voltage do you measure?"
    params:
      min: 0
      max: 5
      unit: V
    answer:
      value: 0.9
      tolerance: 0.2
    explanation: About 0.9 volts. The lemon only provides the ion conductor – the energy is in the zinc, which gives up electrons.

  - kind: explain
    id: c1
    body: In the Daniell cell, zinc stands in zinc sulfate and copper in copper sulfate. A wire joins the metals and a **salt bridge** joins the solutions. Only when both paths are closed does current flow.

  - kind: problem
    id: c2
    widget: match
    prompt: What happens where in the galvanic cell?
    params:
      pairs:
        - left: Anode (negative)
          right: "oxidation: Zn → Zn²⁺ + 2 e⁻"
        - left: Cathode (positive)
          right: "reduction: Cu²⁺ + 2 e⁻ → Cu"
        - left: Wire
          right: carries electrons
        - left: Salt bridge
          right: carries ions
    hints:
      - Oxidation always happens at the anode.
      - Electrons only travel through metal, ions only through solution.
    explanation: 'Memory aid: "An Ox" and "Red Cat" – anode oxidation, reduction cathode.'

  - kind: problem
    id: c3
    widget: order
    prompt: Order the path of charge in the Daniell cell.
    params:
      items:
        - label: Zinc gives up electrons and dissolves
        - label: The electrons flow through the wire
        - label: Cu²⁺ takes them at the copper
        - label: Ions travel through the salt bridge
    hints:
      - It starts with oxidation.
      - The salt bridge balances the charge in the solutions.
    explanation: "A closed loop: electrons outside, ions inside."

  - kind: problem
    id: c4
    widget: choice
    prompt: What happens if you remove the salt bridge?
    params:
      options:
        - label: The current stops at once because the solutions become charged
          correct: true
        - label: The voltage doubles
          feedback: Without an ion path nothing flows at all.
        - label: Nothing – the wire is enough
          feedback: Then the circuit is not closed.
    hints:
      - On the left Zn²⁺ forms, on the right Cu²⁺ disappears.
      - Excess charge stops the flow of electrons.
    explanation: The left side would turn positive, the right negative. Even tiny charges stop the current.

  - kind: explain
    id: d1
    depth: 2
    body: "A cell is written briefly as a **cell diagram**: Zn | Zn²⁺ ‖ Cu²⁺ | Cu. The anode goes on the left, | is a phase boundary, ‖ is the salt bridge."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Zn | Zn²⁺ ‖ Ag⁺ | Ag. Zinc sits at −0.76 V, silver at +0.80 V. What voltage does the cell deliver?
    params:
      unit: V
    answer:
      value: 1.56
      tolerance: 0.005
    feedback:
      - when: abs(numval(state.input) - 0.04) < 0.005
        misconception: potential-sign
        text: "Subtract the anode from the cathode: 0.80 − (−0.76)."
    hints:
      - E = E(cathode) − E(anode).
      - 0.80 + 0.76.
    explanation: 1.56 V. Silver oxide–zinc button cells use a similar pair and deliver about 1.55 V.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Look at the cell Mg | Mg²⁺ ‖ Cu²⁺ | Cu. At which metal do the electrons leave?
    params:
      options:
        - label: At the magnesium
          correct: true
        - label: At the copper
          feedback: Copper is on the right – that is the cathode.
        - label: At the salt bridge
          feedback: Only ions travel there.
    hints:
      - The anode is on the left of the diagram.
      - Magnesium is far less noble than copper.
    explanation: The less noble metal is the anode and is oxidised. This cell delivers 0.34 + 2.37 = 2.71 V.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: What is ΔG of the cell Zn | Zn²⁺ ‖ Ag⁺ | Ag with E = 1.56 V? Two electrons move per reaction (F = 96,485 C/mol). Round to whole kJ/mol.
    params:
      unit: kJ/mol
    answer:
      value: -301
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 301) < 1
        misconception: dg-sign
        text: Spontaneous reactions have a negative ΔG.
    hints:
      - ΔG = −n · F · E.
      - −2 · 96,485 · 1.56 J/mol.
    explanation: ΔG ≈ −301 kJ/mol. That is the most electrical work one mole of zinc can deliver.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: "A large and a tiny zinc–copper cell: what is the same for both?"
    params:
      options:
        - label: The voltage – it depends only on the substances
          correct: true
        - label: The stored energy
          feedback: More zinc means more energy.
        - label: The maximum current
          feedback: Larger surfaces allow more current.
    hints:
      - Voltage is energy per charge.
      - Size changes the amount, not the kind of reaction.
    explanation: That is why AA and D batteries are both 1.5 V. The big cell just lasts longer.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a galvanic cell turns a reaction into electric current.
    params:
      keywords:
        - - getrennt
          - trenn
          - separat
          - apart
        - - elektron
          - draht
          - electron
          - wire
        - - salzbrücke
          - ionen
          - salt bridge
          - ions
        - - oxid
          - redu
          - anode
          - kathode
          - cathode
      sample: "Oxidation and reduction happen apart: at the anode zinc gives up electrons, at the cathode copper takes them. The electrons have to go through the wire – that is the current. The salt bridge lets ions move and closes the circuit."
    explanation: Separate half-cells force the electrons through the outer circuit.
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x1"]
