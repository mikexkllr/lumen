id: chem.electrochem.galvanic
type: concept
title: "Die galvanische Zelle"
summary: "Anode, Kathode, Salzbrücke – wie eine Zelle Strom liefert."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Strom aus dem Froschbein
    body: Zwei verschiedene Metalle und etwas Salzwasser – mehr braucht eine Batterie nicht. Entdeckt wurde das durch Zufall. Deck die Karten auf und folge der Spur bis zur ersten **galvanischen Zelle**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🐸
            front: "Um 1780: Galvani"
            back: Er sah tote Froschschenkel zucken, wenn zwei Metalle sie berührten.
          - icon: 📚
            front: "1800: Volta"
            back: Volta stapelte Zink, Kupfer und Pappe mit Salzwasser – die erste Batterie.
          - icon: 🔋
            front: "1836: Daniell"
            back: Daniell trennte Zink- und Kupferseite. Seine Zelle lieferte lange gleichmäßig Strom.
          - icon: 🦷
            front: Heute
            back: Beißt du auf Alufolie, kann eine Metallfüllung zwicken – eine Mini-Zelle im Mund.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Zinknagel und ein Kupfernagel stecken in einer Zitrone. Wie viel Spannung misst du?"
    params:
      min: 0
      max: 5
      unit: V
    answer:
      value: 0.9
      tolerance: 0.2
    explanation: Rund 0,9 Volt. Die Zitrone liefert nur den Ionenleiter – die Energie steckt im Zink, das Elektronen abgibt.

  - kind: explain
    id: c1
    body: In der Daniell-Zelle steht Zink in Zinksulfat, Kupfer in Kupfersulfat. Ein Draht verbindet die Metalle, eine **Salzbrücke** die Lösungen. Erst wenn beide Wege geschlossen sind, fließt Strom.

  - kind: problem
    id: c2
    widget: match
    prompt: Was passiert wo in der galvanischen Zelle?
    params:
      pairs:
        - left: Anode (Minuspol)
          right: "Oxidation: Zn → Zn²⁺ + 2 e⁻"
        - left: Kathode (Pluspol)
          right: "Reduktion: Cu²⁺ + 2 e⁻ → Cu"
        - left: Draht
          right: leitet Elektronen
        - left: Salzbrücke
          right: leitet Ionen
    hints:
      - An der Anode findet immer die Oxidation statt.
      - Elektronen laufen nur durch Metall, Ionen nur durch Lösung.
    explanation: "Merkhilfe: Anode – Oxidation, Kathode – Reduktion. Beide beginnen mit einem Vokal bzw. einem Konsonanten."

  - kind: problem
    id: c3
    widget: order
    prompt: Ordne den Weg der Ladung in der Daniell-Zelle.
    params:
      items:
        - label: Zink gibt Elektronen ab und geht in Lösung
        - label: Die Elektronen fließen durch den Draht
        - label: Cu²⁺ nimmt sie am Kupfer auf
        - label: Ionen wandern durch die Salzbrücke
    hints:
      - Am Anfang steht die Oxidation.
      - Die Salzbrücke gleicht die Ladung der Lösungen aus.
    explanation: "Ein geschlossener Kreis: außen Elektronen, innen Ionen."

  - kind: problem
    id: c4
    widget: choice
    prompt: Was passiert, wenn man die Salzbrücke entfernt?
    params:
      options:
        - label: Der Strom bricht sofort ab, weil sich die Lösungen aufladen
          correct: true
        - label: Die Spannung verdoppelt sich
          feedback: Ohne Ionenweg fließt gar nichts.
        - label: Nichts – der Draht reicht
          feedback: Der Kreis ist dann nicht geschlossen.
    hints:
      - Links entstehen Zn²⁺, rechts verschwinden Cu²⁺.
      - Überschüssige Ladung stoppt den Elektronenfluss.
    explanation: Links würde es positiv, rechts negativ. Schon winzige Ladungen stoppen den Strom.

  - kind: explain
    id: d1
    depth: 2
    body: "Kurz schreibt man eine Zelle als **Zelldiagramm**: Zn | Zn²⁺ ‖ Cu²⁺ | Cu. Links steht die Anode, | ist eine Phasengrenze, ‖ die Salzbrücke."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Zn | Zn²⁺ ‖ Ag⁺ | Ag. Zink steht bei −0,76 V, Silber bei +0,80 V. Welche Spannung liefert die Zelle?
    params:
      unit: V
    answer:
      value: 1.56
      tolerance: 0.005
    feedback:
      - when: abs(numval(state.input) - 0.04) < 0.005
        misconception: potential-sign
        text: "Ziehe die Anode von der Kathode ab: 0,80 − (−0,76)."
    hints:
      - E = E(Kathode) − E(Anode).
      - 0,80 + 0,76.
    explanation: 1,56 V. Silberoxid-Zink-Knopfzellen nutzen eine ähnliche Paarung und liefern etwa 1,55 V.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Mg | Mg²⁺ ‖ Cu²⁺ | Cu. An welchem Metall werden Elektronen abgegeben?
    params:
      options:
        - label: Am Magnesium
          correct: true
        - label: Am Kupfer
          feedback: Kupfer steht rechts – dort ist die Kathode.
        - label: An der Salzbrücke
          feedback: Dort wandern nur Ionen.
    hints:
      - Links im Diagramm steht die Anode.
      - Magnesium ist viel unedler als Kupfer.
    explanation: Das unedlere Metall ist die Anode und wird oxidiert. Diese Zelle liefert 0,34 + 2,37 = 2,71 V.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie groß ist ΔG der Zelle Zn | Zn²⁺ ‖ Ag⁺ | Ag mit E = 1,56 V? Pro Formelumsatz wandern 2 Elektronen (F = 96 485 C/mol). Auf ganze kJ/mol.
    params:
      unit: kJ/mol
    answer:
      value: -301
      tolerance: 1
    feedback:
      - when: abs(numval(state.input) - 301) < 1
        misconception: dg-sign
        text: Freiwillige Reaktionen haben ein negatives ΔG.
    hints:
      - ΔG = −n · F · E.
      - −2 · 96 485 · 1,56 J/mol.
    explanation: ΔG ≈ −301 kJ/mol. So viel elektrische Arbeit liefert ein Mol Zink höchstens.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: "Eine große und eine winzige Zink-Kupfer-Zelle: Was ist bei beiden gleich?"
    params:
      options:
        - label: Die Spannung – sie hängt nur von den Stoffen ab
          correct: true
        - label: Die gespeicherte Energie
          feedback: Mehr Zink heißt mehr Energie.
        - label: Der größte Strom
          feedback: Größere Flächen erlauben mehr Strom.
    hints:
      - Spannung ist Energie pro Ladung.
      - Größe ändert die Menge, nicht die Art der Reaktion.
    explanation: Darum sind AA- und D-Batterien beide 1,5 V. Die dicke Zelle hält nur länger.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine galvanische Zelle aus einer Reaktion Strom macht.
    params:
      keywords:
        - - getrennt
          - trenn
          - separat
          - apart
        - - elektron
          - draht
          - electron
          - wire
        - - salzbrücke
          - ionen
          - salt bridge
          - ions
        - - oxid
          - redu
          - anode
          - kathode
          - cathode
      sample: "Oxidation und Reduktion laufen getrennt ab: An der Anode gibt Zink Elektronen ab, an der Kathode nimmt Kupfer sie auf. Die Elektronen müssen durch den Draht – das ist der Strom. Die Salzbrücke lässt Ionen wandern und schließt den Kreis."
    explanation: Getrennte Halbzellen zwingen die Elektronen durch den äußeren Kreis.
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x1"]
