id: chem.electrochem.corrosion
type: concept
title: "Korrosion und Schutz"
summary: "Rost als winzige Batterie – und wie man sie austrickst."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Der ewige Kampf
    body: "Rost frisst jedes Jahr Brücken, Türme und Schiffe. Manches Eisen hält trotzdem Jahrhunderte. Deck die Karten auf: Wie kämpfen Menschen gegen die **Korrosion** – und wo verlieren sie?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🗼
            front: Der Eiffelturm
            back: Alle sieben Jahre bekommt er rund 60 Tonnen frische Farbe gegen Rost.
          - icon: 🏛️
            front: Die Säule von Delhi
            back: Diese Eisensäule steht seit rund 1600 Jahren – und rostet kaum.
          - icon: 🚢
            front: Die Titanic
            back: Am Meeresgrund fressen Bakterien ihren Rost. In einigen Jahrzehnten könnte das Wrack zerfallen sein.
          - icon: 🌉
            front: Die Golden Gate Bridge
            back: Maler streichen sie ständig nach – Salz und Nebel greifen den Stahl an.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel Prozent der weltweiten Wirtschaftsleistung kostet Korrosion jedes Jahr?"
    params:
      min: 0
      max: 20
      unit: "%"
    answer:
      value: 3.4
      tolerance: 1.5
    explanation: Studien schätzen rund 3 bis 4 % – Billionen Euro für Brücken, Rohre, Schiffe und Autos.

  - kind: explain
    id: c1
    body: Korrosion ist eine galvanische Zelle auf einem einzigen Stück Metall. An einer Stelle löst sich Eisen, an einer anderen nimmt Sauerstoff die Elektronen auf. Das nennt man ein **Korrosionselement**.

  - kind: problem
    id: c2
    widget: order
    prompt: Ein Wassertropfen liegt auf Eisen. Ordne, was passiert.
    params:
      items:
        - label: "In der Tropfenmitte: Fe → Fe²⁺ + 2 e⁻"
        - label: Die Elektronen wandern durchs Eisen zum Rand
        - label: "Am Rand: O₂ + 2 H₂O + 4 e⁻ → 4 OH⁻"
        - label: Fe²⁺ und OH⁻ treffen sich, ein Rostring entsteht
    hints:
      - Am Rand kommt am meisten Sauerstoff hin.
      - Wo wenig Sauerstoff ist, löst sich das Eisen.
    explanation: "Paradox: Das Eisen frisst sich dort weg, wo am wenigsten Sauerstoff ist. Darum rostet es unter Schmutz und in Spalten besonders."

  - kind: problem
    id: c3
    widget: buckets
    prompt: Ein Eisenrohr berührt ein anderes Metall. Schützt das Metall das Eisen oder lässt es das Eisen schneller rosten?
    params:
      buckets:
        - id: b1
          label: schützt das Eisen
        - id: b2
          label: beschleunigt das Rosten
      items:
        - label: Zink
          bucket: b1
        - label: Magnesium
          bucket: b1
        - label: Aluminium
          bucket: b1
        - label: Kupfer
          bucket: b2
        - label: Zinn
          bucket: b2
        - label: Silber
          bucket: b2
    hints:
      - Das unedlere Metall wird zur Anode und löst sich.
      - Zinn (−0,14 V) ist edler als Eisen (−0,44 V).
    explanation: Unedlere Metalle opfern sich. Edlere machen das Eisen zur Anode – es rostet schneller als allein.

  - kind: problem
    id: c4
    widget: choice
    prompt: Konservendosen sind aus verzinntem Stahl. Was passiert, wenn die Zinnschicht einen tiefen Kratzer bekommt?
    params:
      options:
        - label: Das Eisen im Kratzer rostet sogar schneller als ungeschütztes Eisen
          correct: true
        - label: Das Zinn opfert sich für das Eisen
          feedback: Dafür müsste Zinn unedler sein – ist es aber nicht.
        - label: Nichts – Zinn heilt den Kratzer
          feedback: Zinn bildet keine Schutzschicht über dem Kratzer.
    hints:
      - Vergleiche Zinn und Eisen in der Spannungsreihe.
      - Das unedlere Metall wird zur Anode.
    explanation: Zinn schützt nur, solange die Schicht dicht ist. Verzinkter Stahl schützt dagegen auch im Kratzer.

  - kind: explain
    id: d1
    depth: 2
    body: "Pipelines und Brücken schützt man oft mit **kathodischem Schutz**: Eine schwache Spannungsquelle drückt Elektronen ins Eisen. So wird es überall zur Kathode und kann sich nicht auflösen."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Eine Zink-Opferanode liefert ein Jahr lang 1 A Schutzstrom (3,16 · 10⁷ s). Wie viel kg Zink (65,4 g/mol, Zn²⁺) löst sich dabei auf? (F = 96 485 C/mol) Auf eine Nachkommastelle.
    params:
      unit: kg
    answer:
      value: 10.7
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 21.4) < 0.2
        misconception: charge-ignored
        text: Jedes Zink gibt zwei Elektronen ab – teile durch 2.
    hints:
      - "Mol Elektronen = 3,16 · 10⁷ : 96 485 ≈ 328 mol."
      - "Halb so viel Zink: 164 mol · 65,4 g/mol."
    explanation: Etwa 10,7 kg Zink pro Jahr. Darum tauscht man Opferanoden an Schiffen regelmäßig.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Warum rostet Eisen in saurem Wasser viel schneller als in neutralem?
    params:
      options:
        - label: Nicht nur Sauerstoff, auch H⁺ nimmt jetzt Elektronen auf
          correct: true
        - label: Säure macht das Eisen unedler
          feedback: Das Potenzial des Eisens bleibt gleich.
        - label: Saures Wasser ist wärmer
          feedback: Die Temperatur ist gleich.
    hints:
      - Wer an der Kathode Elektronen aufnimmt, treibt die Korrosion an.
      - 2 H⁺ + 2 e⁻ → H₂.
    explanation: Mit H⁺ als zweitem Elektronen-Fänger läuft die Zelle schneller. Saurer Regen hat darum Brücken und Statuen zugesetzt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Edelstahl kann in Salzwasser plötzlich tiefe Löcher bekommen, obwohl die Fläche blank bleibt. Wie entsteht diese Lochfraß-Korrosion?
    params:
      options:
        - label: Chlorid durchbricht die Schutzschicht an einem Punkt – eine winzige Anode steht einer riesigen Kathode gegenüber
          correct: true
        - label: Das Chrom verdampft
          feedback: Chrom verdampft nicht bei Raumtemperatur.
        - label: Salz ist edler als Stahl
          feedback: Salz ist kein Metall in der Spannungsreihe.
    hints:
      - Der ganze Strom der großen Fläche fließt durch das kleine Loch.
      - Im Loch wird es sauer und chloridreich – das hält es offen.
    explanation: "Kleine Anode, große Kathode: Das Metall löst sich punktförmig und rasend schnell. Für Meerwasser nimmt man Stahl mit Molybdän."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: An einem Aluminiumboot werden Schrauben aus Edelstahl verbaut. Was droht im Meerwasser?
    params:
      options:
        - label: Das Aluminium um die Schrauben herum korrodiert
          correct: true
        - label: Die Schrauben rosten weg
          feedback: Die edlere Seite ist geschützt.
        - label: Nichts – beide Metalle sind rostfrei
          feedback: Im Kontakt bilden sie eine Zelle.
    hints:
      - Zwei verschiedene Metalle plus Salzwasser ergeben eine Batterie.
      - Aluminium ist das unedlere Metall.
    explanation: Das nennt man Kontaktkorrosion. Kunststoff-Unterlegscheiben trennen die Metalle elektrisch und verhindern sie.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Opferanode aus Zink einen Schiffsrumpf aus Stahl schützt.
    params:
      keywords:
        - - zink
          - zinc
        - - unedl
          - less noble
          - reaktiv
          - reactive
          - leichter
          - more easily
        - - elektron
          - electron
        - - anode
          - opfer
          - sacrific
          - löst
          - dissolv
      sample: Zink ist unedler als Eisen und gibt seine Elektronen leichter ab. Es wird zur Anode und löst sich auf. Seine Elektronen fließen in den Stahl, der so zur Kathode wird und nicht rostet.
    explanation: Das Zink opfert sich – der Stahl bleibt heil.
    difficulty: 3

srs:
  cards_from: ["c3", "d2", "x1"]
