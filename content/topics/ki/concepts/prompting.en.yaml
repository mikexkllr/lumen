id: ai.llm.prompting
type: concept
title: Good instructions
summary: What makes a prompt better.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: problem
    id: besser
    widget: choice
    prompt: Which prompt is more likely to give a usable answer?
    params:
      options:
        - { label: "“Explain to beginners in 5 sentences how a puppy gets house-trained.”", correct: true }
        - { label: “Write something about dogs.”, feedback: "Without a goal and format, the model has to guess." }
    hints:
      - Which one says who it is for and in what form?
    explanation: A goal, an audience and a format make the answer more on target.

  - kind: explain
    id: s2
    body: |
      A language model continues your text. The clearer the start, the better the continuation. Good prompts state the **goal**, the **context** and the **format** – and often show an example.

  - kind: problem
    id: hilft
    widget: buckets
    prompt: Does this make the prompt better?
    params:
      buckets: [{ label: better }, { label: no use }]
      items:
        - { label: State the audience, bucket: better }
        - { label: State the format you want, bucket: better }
        - { label: Show an example, bucket: better }
        - { label: Repeat the request five times, bucket: no use }
        - { label: Write everything in capitals, bucket: no use }
    hints:
      - What gives the model new information?
    explanation: What helps is what adds information – not what is just louder.

  - kind: problem
    id: beispiel
    widget: choice
    body: "Prompt: “Dog → Hund. Cat → Katze. Mouse → ”"
    prompt: What will the model very likely write?
    params:
      options:
        - { label: Maus, correct: true }
        - { label: A text about mice, feedback: "The examples make the pattern clear." }
    hints:
      - What pattern do the examples show?
    explanation: Two examples are often enough for the model to adopt the format.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Build a good prompt. Order the steps.
    params:
      items:
        - label: State the goal
        - label: Give the context
        - label: Fix the format
        - label: Check the result and refine
    hints:
      - First say what you want. Then what for and in which form.
    explanation: A good prompt almost never arises on the first try.

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Good or weak prompt?
    params:
      buckets:
        - id: b1
          label: Good
        - id: b2
          label: Weak
      items:
        - label: “Write something about dogs.”
          bucket: b2
        - label: “Explain interest to kids in 5 lines.”
          bucket: b1
        - label: “Make this better.”
          bucket: b2
        - label: “Sum up the text in 3 points.”
          bucket: b1
    hints:
      - Does it state a goal, an audience or a format?
    explanation: The clearer the task, the better the answer.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: You give the model two examples of a question and the desired answer before asking your actual question. What is this called?
    params:
      options:
        - label: Few-shot prompting
          correct: true
        - label: Training
          feedback: The model’s weights do not change in the process.
        - label: Hallucination
          feedback: That is invented content.
    hints:
      - The model recognises the pattern in the examples.
    explanation: Examples often show format and tone better than any description.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: You give three examples that are all the same length and structure. What will the model probably do?
    params:
      options:
        - label: It copies length and structure – even if that was not intended.
          correct: true
        - label: It ignores the examples.
          feedback: Examples have a strong effect – often stronger than the instruction.
        - label: It picks one at random.
          feedback: It imitates the shared pattern.
    hints:
      - A language model continues patterns.
      - What do the three examples have in common?
    explanation: In few-shot prompting the model adopts every shared pattern. Good examples are therefore varied – and show exactly what should stay the same.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do models often give better answers to hard tasks when asked to think “step by step”?
    params:
      options:
        - label: Every written intermediate step is in the context and helps with the next
          correct: true
        - label: The model then tries harder
          feedback: It has no ambition – but it can build on its own text.
        - label: The wording unlocks a better model
          feedback: It stays the same model.
    hints:
      - The model only sees what is already written.
    explanation: Without intermediate steps the whole calculation would have to succeed in a single word step.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: How do you check whether a new prompt is really better than the old one?
    params:
      options:
        - label: Run both on many typical test cases and compare the results.
          correct: true
        - label: Try once – if the answer is good, it works.
          feedback: One answer is one draw. Only many cases show the difference.
        - label: Ask the model which prompt is better.
          feedback: Its opinion is not a measurement.
    hints:
      - Answers vary from one try to the next.
      - How do you measure a difference hidden in randomness?
    explanation: "Prompts are not programs with a fixed result. You test them like an experiment: many cases, clear criteria, comparison. That is how teams building AI products work."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what makes a good prompt.
    params:
      keywords:
        - - ziel
          - aufgabe
          - goal
          - task
        - - kontext
          - hintergrund
          - context
          - background
        - - format
          - form
          - länge
          - length
        - - beispiel
          - example
      sample: "A good prompt states the goal and the context: for whom and what for. It says which format and length the answer should have. An example often helps."
    difficulty: 3

srs:
  cards_from: [besser, hilft]
