id: ai.llm.tokens
type: concept
title: Tokens
summary: Models do not read letters, but word pieces.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.tokens]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Text in pieces
    body: "A language model does not read letters. It chops text into **tokens**: numbered word pieces. Uncover the cards: what surprising things follow from that?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍓
            front: How many r’s?
            back: Chatbots long stumbled over “How many r’s are in strawberry?”. They see pieces, not letters.
          - icon: 🇩🇪
            front: German costs more
            back: The same content often needs more tokens in German than in English.
          - icon: 🔢
            front: Numbers in chunks
            back: A long number often breaks into chunks like 123 · 456 · 7. That makes maths tricky.
          - icon: 😀
            front: One emoji, many tokens
            back: A single emoji can take up several tokens.

  - kind: problem
    id: zerlegen
    widget: choice
    body: Language models split text into **tokens**. Common words are one token, rare ones are cut into pieces.
    prompt: How will “snowboarding” probably be split?
    params:
      options:
        - { label: "snow · board · ing", correct: true }
        - { label: "s · n · o · w · b · o · a · r · d …", feedback: "Single letters would be far too many tokens." }
        - { label: A single token, feedback: "The word is too rare for that." }
    hints:
      - Which parts appear in many words?
    explanation: Common building blocks like “snow”, “board” and “ing” are tokens of their own.

  - kind: problem
    id: bauen
    widget: tiles
    prompt: Put the tokens together to form the word “unbelievable”.
    params: { tiles: ["believ", "able", "un", "ship", "luck"] }
    answer: { sequence: ["un", "believ", "able"] }
    hints:
      - How does the word begin?
    explanation: un · believ · able.

  - kind: explain
    id: s3
    body: |
      So a model does not see letters, but numbers for **tokens**.
      That is why it sometimes struggles with tasks like “How many r’s are in strawberry?” – the letters are hidden inside the token.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: One token equals about 0.75 words on average. About how many tokens is a text with 750 words?
    answer: { value: 1000, tolerance: 20 }
    feedback:
      - when: "abs(numval(state.input) - 562.5) < 20"
        text: There are more tokens than words – a word is often more than one token. Divide by 0.75.
    hints:
      - 750 words divided by 0.75 words per token.
    explanation: "750 ÷ 0.75 = 1000 tokens."
    difficulty: 2

  - kind: problem
    id: grenze
    widget: choice
    prompt: Why do chatbots often count tokens instead of words?
    params:
      options:
        - { label: Because the model only processes tokens internally, correct: true }
        - { label: Because words are counted too imprecisely, feedback: "Words are easy to count – but the model works in tokens." }
        - { label: Because tokens are always whole sentences, feedback: "Tokens are mostly word pieces, not sentences." }
    hints:
      - What does the model really see?
    explanation: A model's computing time and limits depend on the number of tokens.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A model costs €3 per million input tokens. You send a book of 90,000 words (one token ≈ 0.75 words). What does that cost in cents?
    params:
      unit: ct
    answer:
      value: 36
    hints:
      - 90,000 ÷ 0.75 = 120,000 tokens.
    explanation: 0.12 million · €3 = €0.36. Reading a whole book for 36 cents.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: This is how a tokenizer learns its word pieces (byte-pair encoding). Put in order.
    params:
      items:
        - label: Start with single characters as tokens.
        - label: Count which pair of neighbouring tokens is most frequent.
        - label: Merge that pair into a new token.
        - label: Repeat until the vocabulary is large enough.
    hints:
      - At the start the tokenizer only knows letters.
      - Frequent pairs like "e" + "n" are merged first.
    explanation: That way tokens appear for common syllables and words. Rare words stay split into pieces.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: The same sentence often needs more tokens in German than in English. What is the usual reason?
    params:
      options:
        - label: Many tokenizers learned mostly from English text – German words break into more pieces.
          correct: true
        - label: German has more letters in the alphabet.
          feedback: The few umlauts hardly make a difference.
        - label: The model does not understand German.
          feedback: It often understands it well – it just needs more pieces.
    hints:
      - Which word pieces become frequent in tokenizer training?
      - Long compound words add to this.
    explanation: What is frequent in the training data gets its own tokens. More tokens mean higher cost and less room in the context – a real disadvantage for many languages.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why is text split into word pieces rather than whole words or single letters?
    params:
      options:
        - label: "A compromise: a limited vocabulary, and still any new word can be assembled"
          correct: true
        - label: Because computers do not know letters
          feedback: They could process letters too – texts would just become very long.
        - label: Because whole words are forbidden
          feedback: Frequent words are often a single token.
    hints:
      - How many different words exist – including all names and typos?
    explanation: "The method is called **byte-pair encoding**: frequent character sequences are merged step by step into tokens."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: A model knows 50,000 tokens. Each token has a vector of 4096 numbers. How many million numbers does this table hold?
    answer:
      value: 204.8
      tolerance: 0.1
    hints:
      - Compute 50,000 · 4096.
      - That is 204,800,000. In millions?
    explanation: Around 205 million weights just for the embedding table. A bigger vocabulary saves tokens per text but costs memory – a trade-off.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why a language model sometimes miscounts how many "r"s are in a word.
    params:
      keywords:
        - - token
          - stück
          - piece
        - - buchstab
          - letter
          - zeichen
          - character
        - - nummer
          - zahl
          - sieht nicht
          - number
          - cannot see
          - does not see
      sample: The model does not see letters but tokens – word pieces that arrive as numbers. The single letters are hidden inside, so it has to guess instead of count.
    difficulty: 3
