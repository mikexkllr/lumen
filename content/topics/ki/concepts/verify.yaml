id: ai.llm.verify
type: concept
title: KI-Antworten prüfen
summary: Plausibel ist nicht dasselbe wie richtig.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.verify]
estimated_minutes: 11
steps:
  - kind: problem
    id: zugspitze
    widget: choice
    body: Ein Chatbot schreibt – »Die Zugspitze ist mit 2962 m höher als der Mont Blanc.«
    prompt: Was stimmt?
    params:
      options:
        - { label: Der Mont Blanc ist deutlich höher – die Aussage ist falsch, correct: true }
        - { label: Alles korrekt, feedback: "Der Mont Blanc ist über 4800 m hoch." }
        - { label: Das kann man nicht prüfen, feedback: "Berghöhen stehen in jedem Atlas." }
    hints:
      - Der Mont Blanc ist der höchste Berg der Alpen.
    explanation: Die Höhe der Zugspitze stimmt – der Vergleich aber nicht. Mischungen aus Wahrem und Falschem sind typisch.

  - kind: explain
    id: s2
    body: |
      Ein Sprachmodell schreibt Texte, die **echt klingen**. Ob sie stimmen, prüft es nicht.
      Klingt etwas sicher, ist aber erfunden, heißt das **Halluzination**.

  - kind: problem
    id: strategien
    widget: choice
    prompt: Welche Strategien helfen beim Prüfen? Wähle alle passenden.
    params:
      multiple: true
      options:
        - { label: Mit einer verlässlichen Quelle vergleichen, correct: true }
        - { label: Rechnungen selbst nachrechnen, correct: true }
        - { label: "Glauben, weil es selbstsicher klingt", feedback: "Ein Modell klingt auch bei Fehlern sicher." }
        - { label: "Fragen, bis die Antwort gefällt", feedback: "Damit findest du die gewünschte, nicht die richtige Antwort." }
    hints:
      - Was würdest du bei einer Aussage eines Menschen tun?
    explanation: Quellen vergleichen und selbst nachrechnen.

  - kind: problem
    id: nachrechnen
    widget: numeric
    body: Eine KI rechnet – »17 · 23 = 381«.
    prompt: Rechne nach. Was ist 17 · 23 wirklich?
    answer: { value: 391 }
    hints:
      - 17 · 20 = 340, dazu 17 · 3.
    explanation: 340 + 51 = 391. Die KI lag um 10 daneben.

  - kind: problem
    id: code
    widget: choice
    prompt: Eine KI schreibt Code, der prüfen soll, ob eine Zahl gerade ist. Wie stellst du sicher, dass er stimmt?
    params:
      options:
        - { label: "Mit Testfällen prüfen – etwa 0, 1, 2 und −3", correct: true }
        - { label: Den Code einfach übernehmen, feedback: "Auch generierter Code kann Fehler haben – besonders bei Sonderfällen." }
        - { label: "Nur prüfen, ob er kurz ist", feedback: "Kurz heißt nicht richtig." }
    hints:
      - Welche Zahlen sind knifflig?
    explanation: Gezielte Testfälle, auch Sonderfälle wie 0 und negative Zahlen, decken Fehler auf.

  - kind: problem
    id: reihenfolge
    widget: order
    prompt: Bring die Schritte beim Arbeiten mit KI in eine sinnvolle Reihenfolge.
    params:
      items:
        - { label: Aufgabe klar beschreiben }
        - { label: Antwort lesen }
        - { label: Wichtige Fakten prüfen }
        - { label: Ergebnis verwenden }
    hints:
      - Wann prüfst du – vor oder nach dem Verwenden?
    explanation: Erst klar fragen, dann lesen, prüfen und erst danach verwenden.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Wenn eine KI eine Quelle nennt, existiert diese Quelle auch.
          right: false
          why: Modelle erfinden manchmal Titel, Autoren und Links.
        - text: Eine flüssige, sichere Antwort kann trotzdem falsch sein.
          right: true
        - text: Bei wichtigen Entscheidungen sollte man eine zweite Quelle prüfen.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Klingt eine Antwort sicher, ist aber erfunden, heißt das [[Halluzination]]. Wichtiges prüft man an einer zweiten [[Quelle]].
      distractors:
        - Temperatur
        - Frage

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du fragst dieselbe Frage dreimal und bekommst drei verschiedene Jahreszahlen. Was sagt das?
    params:
      options:
        - label: Das Modell ist hier unsicher – die Antwort sollte man nachschlagen
          correct: true
        - label: Die dritte Antwort stimmt
          feedback: Die Reihenfolge sagt nichts über die Richtigkeit.
        - label: Alle drei stimmen
          feedback: Ein Ereignis hat nur ein Jahr.
    hints:
      - Bei sicherem Wissen wäre die Antwort stabil.
    explanation: Schwankende Antworten sind ein gutes Warnsignal für Halluzinationen.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Modell beantwortet solche Fragen in 80 % der Fälle richtig. Du stellst 3 unabhängige Fragen. Wie wahrscheinlich sind **alle** Antworten richtig? In Prozent.
    answer:
      value: 51.2
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 80
        misconception: single
        text: Das gilt für eine Frage. Alle drei müssen stimmen.
    hints:
      - Multipliziere die Wahrscheinlichkeiten.
      - 0,8 · 0,8 · 0,8 = ?
    explanation: 0,8³ = 0,512. Schon bei drei Fakten ist fast jede zweite Antwort irgendwo falsch. Lange Texte brauchen darum besonders **sorgfältige** Prüfung.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: buckets
    prompt: Wie prüfst du das am besten?
    params:
      buckets:
        - id: b1
          label: selbst nachrechnen oder testen
        - id: b2
          label: in einer Quelle nachschlagen
      items:
        - label: das Ergebnis von 17 · 23
          bucket: b1
        - label: das Jahr eines Ereignisses
          bucket: b2
        - label: ob eine Code-Funktion läuft
          bucket: b1
        - label: ein Zitat einer Person
          bucket: b2
    hints:
      - Rechnungen und Code kannst du selbst ausführen.
      - Fakten über die Welt brauchen eine Quelle.
    explanation: Was man ausrechnen oder ausprobieren kann, prüft man **selbst**. Fakten, Zitate und Zahlen über die Welt prüft man in verlässlichen Quellen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum halluzinieren Sprachmodelle überhaupt?
    params:
      options:
        - label: Sie erzeugen das Wahrscheinlichste – auch wenn sie nichts Passendes gelernt haben, entsteht etwas, das plausibel klingt
          correct: true
        - label: Sie wollen täuschen
          feedback: Sie haben keine Absicht.
        - label: Ihnen fehlt Rechenleistung
          feedback: Auch die größten Modelle halluzinieren.
    hints:
      - Ein Modell hat kein eingebautes »Das weiß ich nicht«.
    explanation: "Es gibt keine getrennte Wissensdatenbank – nur Muster in Gewichten. Abhilfe: dem Modell Quellen mitgeben und Belege verlangen."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein Chatbot sucht erst passende Dokumente und antwortet dann mit Quellenangabe. Was gilt?
    params:
      options:
        - label: Das senkt erfundene Antworten oft deutlich – verhindert sie aber nicht ganz.
          correct: true
        - label: Dann kann es nicht mehr halluzinieren.
          feedback: Es kann Quellen falsch zusammenfassen oder die falschen finden.
        - label: Quellen machen es unzuverlässiger.
          feedback: Im Gegenteil – man kann die Antwort jetzt viel leichter prüfen.
    hints:
      - Was kann bei der Suche schiefgehen? Und beim Zusammenfassen?
      - "Ein großer Vorteil: Du kannst die Quelle selbst öffnen."
    explanation: "Mit Quellen wird eine Antwort **überprüfbar**. Fehler bleiben möglich: falsche Treffer, veraltete Seiten oder ein verzerrtes Zitat. Ein kurzer Blick in die Quelle lohnt sich."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man KI-Antworten prüfen sollte, auch wenn sie sehr überzeugend klingen.
    params:
      keywords:
        - - wahrscheinlich
          - klingt
          - plausibel
          - likely
          - sounds
          - plausible
        - - erfind
          - halluzin
          - falsch
          - invent
          - hallucinat
          - wrong
        - - quelle
          - prüf
          - nachrechn
          - source
          - check
          - verify
      sample: Ein Sprachmodell schreibt, was wahrscheinlich klingt, und prüft keine Fakten. Darum kann es Dinge erfinden, die überzeugend wirken. Wichtiges prüfe ich mit einer Quelle oder rechne es nach.
    difficulty: 3
