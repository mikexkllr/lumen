id: ai.llm.prompting
type: concept
title: Gute Anweisungen
summary: Was einen Prompt besser macht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Kunst der Frage
    body: "Dieselbe Frage, anders gestellt – und die KI antwortet viel besser. Deck die Karten auf: Welche kleinen **Kniffe** wirken erstaunlich stark?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🪜
            front: Ein magischer Satz?
            back: »Denk Schritt für Schritt« machte frühe Modelle bei Rechenaufgaben viel besser.
          - icon: 🎭
            front: Eine Rolle geben
            back: »Du bist ein strenger Lektor« ändert Ton und Blickwinkel der ganzen Antwort.
          - icon: 📋
            front: Ein Beispiel zeigen
            back: Mit einem Beispiel ahmt das Modell Form und Länge nach – oft besser als jede Beschreibung.
          - icon: 🙋
            front: Rückfragen erlauben
            back: Bitte das Modell, erst nachzufragen. Dann füllt es Lücken nicht mit Vermutungen.

  - kind: problem
    id: besser
    widget: choice
    prompt: Welcher Prompt liefert eher eine brauchbare Antwort?
    params:
      options:
        - { label: "»Erkläre Neulingen in 5 Sätzen, wie ein Welpe stubenrein wird.«", correct: true }
        - { label: »Schreib was über Hunde.«, feedback: "Ohne Ziel und Format muss das Modell raten." }
    hints:
      - Welcher sagt, für wen und in welcher Form?
    explanation: Ziel, Zielgruppe und Format machen die Antwort treffender.

  - kind: explain
    id: s2
    body: |
      Ein Sprachmodell setzt deinen Text fort. Je klarer der Anfang, desto besser die Fortsetzung. Gute Prompts nennen **Ziel**, **Kontext** und **Format** – und zeigen oft ein Beispiel.

  - kind: problem
    id: hilft
    widget: buckets
    prompt: Macht das den Prompt besser?
    params:
      buckets: [{ label: besser }, { label: bringt nichts }]
      items:
        - { label: Die Zielgruppe nennen, bucket: besser }
        - { label: Das gewünschte Format nennen, bucket: besser }
        - { label: Ein Beispiel zeigen, bucket: besser }
        - { label: Die Bitte fünfmal wiederholen, bucket: bringt nichts }
        - { label: Alles in Großbuchstaben, bucket: bringt nichts }
    hints:
      - Was gibt dem Modell neue Information?
    explanation: Hilfreich ist, was Information hinzufügt – nicht, was nur lauter ist.

  - kind: problem
    id: beispiel
    widget: choice
    body: "Prompt: »Hund → dog. Katze → cat. Maus → «"
    prompt: Was schreibt das Modell sehr wahrscheinlich?
    params:
      options:
        - { label: mouse, correct: true }
        - { label: Ein Text über Mäuse, feedback: "Die Beispiele geben das Muster klar vor." }
    hints:
      - Welches Muster zeigen die Beispiele?
    explanation: Zwei Beispiele reichen oft, damit das Modell das Format übernimmt.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Bau einen guten Prompt. Ordne die Schritte.
    params:
      items:
        - label: Das Ziel nennen
        - label: Den Kontext geben
        - label: Das Format festlegen
        - label: Das Ergebnis prüfen und nachbessern
    hints:
      - Erst sagen, was du willst. Dann, wofür und in welcher Form.
    explanation: Ein guter Prompt entsteht fast nie beim ersten Versuch.

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Guter oder schwacher Prompt?
    params:
      buckets:
        - id: b1
          label: Gut
        - id: b2
          label: Schwach
      items:
        - label: »Schreib was über Hunde.«
          bucket: b2
        - label: »Erkläre Zinsen für Kinder in 5 Sätzen.«
          bucket: b1
        - label: »Mach das besser.«
          bucket: b2
        - label: »Fasse den Text in 3 Punkten zusammen.«
          bucket: b1
    hints:
      - Stehen Ziel, Zielgruppe oder Format darin?
    explanation: Je klarer der Auftrag, desto besser die Antwort.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Du gibst dem Modell zwei Beispiele für Frage und gewünschte Antwort, bevor du deine eigentliche Frage stellst. Wie heißt das?
    params:
      options:
        - label: Few-Shot-Prompting
          correct: true
        - label: Training
          feedback: Die Gewichte des Modells ändern sich dabei nicht.
        - label: Halluzination
          feedback: Das ist erfundener Inhalt.
    hints:
      - Das Modell erkennt das Muster in den Beispielen.
    explanation: Beispiele zeigen Format und Ton oft besser als jede Beschreibung.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Du gibst drei Beispiele vor, die alle gleich lang und gleich aufgebaut sind. Was tut das Modell wahrscheinlich?
    params:
      options:
        - label: Es kopiert Länge und Aufbau – auch wenn das gar nicht gemeint war.
          correct: true
        - label: Es ignoriert die Beispiele.
          feedback: Beispiele wirken stark – oft stärker als die Anweisung.
        - label: Es wählt zufällig eins aus.
          feedback: Es ahmt das gemeinsame Muster nach.
    hints:
      - Ein Sprachmodell setzt Muster fort.
      - Was haben die drei Beispiele gemeinsam?
    explanation: Beim **Few-Shot-Prompting** übernimmt das Modell jedes gemeinsame Muster. Gute Beispiele sind darum vielfältig – und zeigen genau das, was gleich bleiben soll.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum liefern Modelle bei schwierigen Aufgaben oft bessere Antworten, wenn man sie bittet, »Schritt für Schritt« zu denken?
    params:
      options:
        - label: Jeder geschriebene Zwischenschritt steht im Kontext und hilft beim nächsten
          correct: true
        - label: Das Modell strengt sich dann mehr an
          feedback: Es hat keinen Ehrgeiz – aber es kann auf seinen eigenen Text aufbauen.
        - label: Die Formulierung schaltet ein besseres Modell frei
          feedback: Es bleibt dasselbe Modell.
    hints:
      - Das Modell sieht nur, was schon dasteht.
    explanation: Ohne Zwischenschritte müsste die ganze Rechnung in einem einzigen Wortschritt gelingen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Wie prüfst du, ob ein neuer Prompt wirklich besser ist als der alte?
    params:
      options:
        - label: Beide an vielen typischen Testfällen laufen lassen und die Ergebnisse vergleichen.
          correct: true
        - label: Einmal ausprobieren – wenn die Antwort gut ist, passt es.
          feedback: Eine Antwort ist eine Ziehung. Erst viele Fälle zeigen den Unterschied.
        - label: Das Modell fragen, welcher Prompt besser ist.
          feedback: Seine Meinung ist kein Messergebnis.
    hints:
      - Antworten schwanken von Mal zu Mal.
      - Wie misst man einen Unterschied, der im Zufall versteckt ist?
    explanation: "Prompts sind keine Programme mit festem Ergebnis. Man prüft sie wie ein Experiment: viele Fälle, klare Kriterien, **Vergleich**. Genau so arbeiten Teams, die KI-Produkte bauen."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was einen guten Prompt ausmacht.
    params:
      keywords:
        - - ziel
          - aufgabe
          - goal
          - task
        - - kontext
          - hintergrund
          - context
          - background
        - - format
          - form
          - länge
          - length
        - - beispiel
          - example
      sample: Ein guter Prompt nennt das Ziel und den Kontext, also für wen und wozu. Er sagt, welches Format und welche Länge die Antwort haben soll. Oft hilft ein Beispiel.
    difficulty: 3

srs:
  cards_from: [besser, hilft]
