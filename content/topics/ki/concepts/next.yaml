id: ai.llm.next
type: concept
title: Das nächste Wort vorhersagen
summary: Ein Sprachmodell schätzt, welches Wort als nächstes kommt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.next]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Was kommt als Nächstes?
    body: Dein Handy schlägt beim Tippen das **nächste Wort** vor. Ein Sprachmodell macht im Kern dasselbe. Tippe ein paar Mal auf »Nächstes Wort ziehen«. Kommt immer dasselbe Wort?
    visual:
      widget: distribution
      interactive: true
      params:
        mode: tokens
        context: Ich hätte gern ein Eis mit
        items:
          - label: Schokolade
            logit: 3
          - label: Vanille
            logit: 2.6
          - label: Erdbeere
            logit: 2.2
          - label: Sahne
            logit: 1.4
          - label: Senf
            logit: -1
        sample:
          - 1
          - 10

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Aus wie vielen verschiedenen Tokens wählt ein großes Sprachmodell bei jedem Schritt ungefähr?"
    params:
      min: 100
      max: 10000000
      scale: log
    answer:
      value: 100000
      within: 70
    explanation: Etwa 100 000. Für jedes einzelne berechnet es eine Wahrscheinlichkeit – bei jedem Wort neu.

  - kind: problem
    id: lueckensatz
    widget: choice
    body: Ein Satz bricht ab – »Zum Frühstück trinke ich gern eine Tasse …«
    prompt: Welches Wort ist am wahrscheinlichsten?
    params:
      layout: grid
      options:
        - { label: Kaffee, correct: true }
        - { label: Fahrrad, feedback: "Grammatisch geht das, aber es kommt in Texten so gut wie nie vor." }
        - { label: Mond, feedback: "Eine Tasse Mond liest man fast nie." }
        - { label: laufen, feedback: "Nach »eine Tasse« erwartet man ein Nomen, kein Verb." }
    hints:
      - Was liest man nach »eine Tasse« besonders oft?
    explanation: In Texten folgt auf »eine Tasse« sehr oft ein Getränk.

  - kind: explain
    id: s2
    body: |
      Ein Sprachmodell tut im Kern genau das. Es schätzt für jedes mögliche nächste Wort eine **Wahrscheinlichkeit**.
      Gelernt hat es das aus riesigen Mengen Text.

  - kind: explain
    id: s3
    body: |
      Probier es aus – ziehe ein paar Wörter. Meist kommt »Kaffee«, aber nicht immer.
    visual:
      widget: distribution
      interactive: true
      params:
        mode: tokens
        context: Zum Frühstück trinke ich gern eine Tasse
        items: [{ label: Kaffee, logit: 3.2 }, { label: Tee, logit: 2.8 }, { label: Kakao, logit: 1.6 }, { label: Milch, logit: 1.0 }, { label: Wasser, logit: 0.6 }]
        sample: [1, 10]

  - kind: problem
    id: erwartung
    widget: numeric
    prompt: »Kaffee« hat eine Wahrscheinlichkeit von 45 %. Wie oft erwartest du »Kaffee« bei 200 Ziehungen?
    answer: { value: 90 }
    hints:
      - 45 % von 200.
    explanation: 0,45 · 200 = 90.

  - kind: problem
    id: verschieden
    widget: choice
    prompt: Warum gibt ein Chatbot auf dieselbe Frage manchmal verschiedene Antworten?
    params:
      options:
        - { label: Er zieht Wörter zufällig nach ihren Wahrscheinlichkeiten, correct: true }
        - { label: Er hat sich beim ersten Mal verhört, feedback: "Der Text kommt jedes Mal gleich an." }
        - { label: Er sucht jedes Mal neu im Internet, feedback: "Das Grundprinzip ist die Wortvorhersage – nicht die Websuche." }
    hints:
      - Denk an das Ziehen eben.
    explanation: Weil gezogen wird, kann jedes Mal ein anderes – wahrscheinliches – Wort kommen.

  - kind: problem
    id: ablauf
    widget: order
    prompt: Bring die Arbeitsschritte eines Sprachmodells in die richtige Reihenfolge.
    params:
      items:
        - { label: Text in Tokens zerlegen }
        - { label: Wahrscheinlichkeiten für das nächste Token berechnen }
        - { label: Ein Token auswählen }
        - { label: Token anhängen und von vorn }
    hints:
      - Am Ende beginnt alles wieder von vorn – mit einem Token mehr.
    explanation: Zerlegen, Wahrscheinlichkeiten, Auswahl, anhängen – Wort für Wort.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Modell gibt »sonnig« 60 %, »regnerisch« 30 % und »neblig« 10 %. Wie wahrscheinlich kommt bei **zwei** unabhängigen Ziehungen zweimal »sonnig«? In Prozent.
    params:
      unit: "%"
    answer:
      value: 36
    hints:
      - 0,6 · 0,6.
    explanation: 36 %. Je länger ein Text, desto unwahrscheinlicher ist genau diese eine Fassung.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Ein Modell schätzt: »Der« 50 %, dann »Hund« 20 %, dann »bellt« 60 %. Wie wahrscheinlich ist der ganze Satz »Der Hund bellt«? In Prozent."
    answer:
      value: 6
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 130
        misconception: added
        text: Wahrscheinlichkeiten hintereinander werden multipliziert, nicht addiert.
    hints:
      - Jedes Wort hängt an den vorigen – multipliziere.
      - 0,5 · 0,2 · 0,6 = ?
    explanation: 0,5 · 0,2 · 0,6 = 0,06. Ein Sprachmodell zerlegt jeden Text so in eine **Kette** von Wahrscheinlichkeiten – Token für Token.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Modell nimmt **immer** das wahrscheinlichste nächste Wort. Was passiert bei langen Texten oft?
    params:
      options:
        - label: Der Text wird eintönig und wiederholt sich.
          correct: true
        - label: Der Text wird perfekt.
          feedback: Das wahrscheinlichste Wort ist nicht immer das beste – Ketten davon geraten leicht in Schleifen.
        - label: Das Modell erfindet mehr.
          feedback: "Eher im Gegenteil: Ohne Zufall wird es vorhersehbar."
    hints:
      - Was passiert, wenn ein häufiger Satz immer weiter fortgesetzt wird?
      - Ein wenig Zufall sorgt für Abwechslung.
    explanation: Immer das Beste zu nehmen heißt **gierige Suche**. Sie führt oft zu Wiederholungen. Darum zieht man meist mit etwas Zufall – gesteuert durch die Temperatur.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Sprachmodell hat nur gelernt, das nächste Wort vorherzusagen. Warum kann es trotzdem Matheaufgaben lösen und Gedichte schreiben?
    params:
      options:
        - label: Um das nächste Wort gut zu treffen, muss es Zusammenhänge der Welt abbilden
          correct: true
        - label: Es hat alle Antworten auswendig gelernt
          feedback: Es löst auch Aufgaben, die nie irgendwo standen.
        - label: Menschen tippen die Antworten heimlich
          feedback: Die Antworten erzeugt das Modell.
    hints:
      - Wie sagt man das Ende eines Krimis vorher, ohne die Handlung zu verstehen?
    explanation: Ein einfaches Ziel, in riesigem Maßstab verfolgt, erzwingt erstaunlich viel Struktur. Wie tief dieses »Verstehen« reicht, wird noch erforscht.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Im Training gab das Modell dem richtigen nächsten Token die Wahrscheinlichkeit {{p}}. Der Fehler ist −log₂({{p}}) Bit. Wie groß ist er?
    answer:
      value: "{{k}}"
    hints:
      - Wie oft musst du 1 halbieren, um {{p}} zu bekommen?
      - "{{p}} = 1 / 2^{{k}}."
    explanation: "{{k}} Bit. Das ist die **Kreuzentropie**: Je weniger Wahrscheinlichkeit das Modell der Wahrheit gab, desto größer der Fehler. Training heißt, diesen Fehler über Billionen Tokens zu senken."
    difficulty: 3
    variants:
      params:
        k: int[1,5]
      derive:
        p: 1 / 2 ** k
      defaults:
        k: 2
