id: ai.llm.context
type: concept
title: What the AI sees right now
summary: Training, context window and knowledge gaps.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "You ask an AI: “What is my dog called?” It does not know you. When can it know anyway?"
    params:
      options:
        - label: If it is written earlier in the chat
          correct: true
        - label: Always – it knows everything
          feedback: Nothing about your dog was in its training.
        - label: Never
          feedback: You can tell it in the chat.
    hints:
      - What can the AI read right now?
    explanation: It sees what is in the chat. The rest it knows only from training.


  - kind: explain
    id: s1
    body: |
      A model knows two things: what it learned in **training** and what is in the **context window** – the current conversation. It knows nothing else.

  - kind: problem
    id: woher
    widget: buckets
    prompt: How can the AI know this?
    params:
      buckets: [{ label: from training }, { label: only from the conversation }]
      items:
        - { label: The capital of France, bucket: from training }
        - { label: How photosynthesis works, bucket: from training }
        - { label: What your last email said, bucket: only from the conversation }
        - { label: Your appointments for tomorrow, bucket: only from the conversation }
    hints:
      - Is it publicly and permanently available somewhere?
    explanation: You have to give the AI anything personal or new.

  - kind: problem
    id: woerter
    widget: numeric
    prompt: One token is on average about ¾ of a word. About how many words fit in {{t}} tokens?
    params: { unit: words }
    answer: { value: "{{t * 3 / 4}}" }
    hints:
      - "{{t}} · 3 ÷ 4."
    explanation: "About {{t * 3 / 4}} words."
    variants:
      params: { t: "choice[4000,8000,32000,200000]" }
      defaults: { t: 8000 }

  - kind: problem
    id: neu
    widget: choice
    prompt: The AI does not know about an event from last week. Why?
    params:
      options:
        - { label: Its training ended earlier., correct: true }
        - { label: It is hiding it on purpose., feedback: "It simply cannot know – unless you tell it." }
    hints:
      - When was the model trained?
    explanation: Every model has a knowledge cutoff. New information only arrives through the conversation or a search.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A chatbot answers questions about a company’s internal documents that were never in training. How?
    params:
      options:
        - label: Matching passages are retrieved and placed into the prompt
          correct: true
        - label: The model guesses
          feedback: Then it would hallucinate.
        - label: It was secretly retrained
          feedback: Usually inserting into the context suffices.
    hints:
      - What is in the context window, the model “knows”.
    explanation: This is called **RAG** – retrieval-augmented generation. Search plus language model.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux in simple words how a language model writes a text.
    params:
      keywords:
        - - nächste
          - next
        - - wort
          - token
          - word
        - - wahrscheinlich
          - probab
          - likely
        - - wiederhol
          - schritt
          - immer wieder
          - repeat
          - step
          - again
          - anhäng
          - append
      min: 3
      sample: It computes a probability for every possible next word and draws one of them. It appends that to the text and repeats the step – word by word until the answer is finished.
    difficulty: 3

srs:
  cards_from: [woher, neu]
