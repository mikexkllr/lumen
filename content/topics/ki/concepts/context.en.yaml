id: ai.llm.context
type: concept
title: What the AI sees right now
summary: Training, context window and knowledge gaps.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      A model knows two things: what it learned in **training** and what is in the **context window** – the current conversation. It knows nothing else.

  - kind: problem
    id: woher
    widget: buckets
    prompt: How can the AI know this?
    params:
      buckets: [{ label: from training }, { label: only from the conversation }]
      items:
        - { label: The capital of France, bucket: from training }
        - { label: How photosynthesis works, bucket: from training }
        - { label: What your last email said, bucket: only from the conversation }
        - { label: Your appointments for tomorrow, bucket: only from the conversation }
    hints:
      - Is it publicly and permanently available somewhere?
    explanation: You have to give the AI anything personal or new.

  - kind: problem
    id: woerter
    widget: numeric
    prompt: One token is on average about ¾ of a word. About how many words fit in {{t}} tokens?
    params: { unit: words }
    answer: { value: "{{t * 3 / 4}}" }
    hints:
      - "{{t}} · 3 ÷ 4."
    explanation: "About {{t * 3 / 4}} words."
    variants:
      params: { t: "choice[4000,8000,32000,200000]" }
      defaults: { t: 8000 }

  - kind: problem
    id: neu
    widget: choice
    prompt: The AI does not know about an event from last week. Why?
    params:
      options:
        - { label: Its training ended earlier., correct: true }
        - { label: It is hiding it on purpose., feedback: "It simply cannot know – unless you tell it." }
    hints:
      - When was the model trained?
    explanation: Every model has a knowledge cutoff. New information only arrives through the conversation or a search.

srs:
  cards_from: [woher, neu]
