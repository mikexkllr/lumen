id: ai.llm.context
type: concept
title: What the AI sees right now
summary: Training, context window and knowledge gaps.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "You ask an AI: “What is my dog called?” It does not know you. When can it know anyway?"
    params:
      options:
        - label: If it is written earlier in the chat
          correct: true
        - label: Always – it knows everything
          feedback: Nothing about your dog was in its training.
        - label: Never
          feedback: You can tell it in the chat.
    hints:
      - What can the AI read right now?
    explanation: It sees what is in the chat. The rest it knows only from training.

  - kind: explain
    id: s1
    body: |
      A model knows two things: what it learned in **training** and what is in the **context window** – the current conversation. It knows nothing else.

  - kind: problem
    id: woher
    widget: buckets
    prompt: How can the AI know this?
    params:
      buckets: [{ label: from training }, { label: only from the conversation }]
      items:
        - { label: The capital of France, bucket: from training }
        - { label: How photosynthesis works, bucket: from training }
        - { label: What your last email said, bucket: only from the conversation }
        - { label: Your appointments for tomorrow, bucket: only from the conversation }
    hints:
      - Is it publicly and permanently available somewhere?
    explanation: You have to give the AI anything personal or new.

  - kind: problem
    id: woerter
    widget: numeric
    prompt: One token is on average about ¾ of a word. About how many words fit in {{t}} tokens?
    params: { unit: words }
    answer: { value: "{{t * 3 / 4}}" }
    hints:
      - "{{t}} · 3 ÷ 4."
    explanation: "About {{t * 3 / 4}} words."
    variants:
      params: { t: "choice[4000,8000,32000,200000]" }
      defaults: { t: 8000 }

  - kind: problem
    id: neu
    widget: choice
    prompt: The AI does not know about an event from last week. Why?
    params:
      options:
        - { label: Its training ended earlier., correct: true }
        - { label: It is hiding it on purpose., feedback: "It simply cannot know – unless you tell it." }
    hints:
      - When was the model trained?
    explanation: Every model has a knowledge cutoff. New information only arrives through the conversation or a search.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A chatbot answers questions about a company’s internal documents that were never in training. How?
    params:
      options:
        - label: Matching passages are retrieved and placed into the prompt
          correct: true
        - label: The model guesses
          feedback: Then it would hallucinate.
        - label: It was secretly retrained
          feedback: Usually inserting into the context suffices.
    hints:
      - What is in the context window, the model “knows”.
    explanation: This is called **RAG** – retrieval-augmented generation. Search plus language model.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A context window holds 200,000 tokens. A token is about ¾ of a word, and a book page has about 300 words. Roughly how many pages fit in?
    answer:
      value: 500
      tolerance: 10
    hints:
      - "First convert to words: 200,000 · ¾."
      - 150,000 words divided by 300.
    explanation: About 500 pages – a thick book. Still, anything not in the window is invisible to the model.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: A chatbot "remembers" your name in a new conversation. How does that usually work?
    params:
      options:
        - label: The app saved notes and inserts them into the context.
          correct: true
        - label: The model learned anew from your chat.
          feedback: The weights do not change while chatting.
        - label: It guessed your name.
          feedback: Guessing would be luck – there is stored information behind it.
    hints:
      - Does the model itself change while you talk to it?
      - What it sees is in the context. Who can put something there?
    explanation: '"Memory" is usually storage outside the model. The app puts relevant notes into the context next time. The model itself stays the same.'
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux in simple words how a language model writes a text.
    params:
      keywords:
        - - nächste
          - next
        - - wort
          - token
          - word
        - - wahrscheinlich
          - probab
          - likely
        - - wiederhol
          - schritt
          - immer wieder
          - repeat
          - step
          - again
          - anhäng
          - append
      min: 3
      sample: It computes a probability for every possible next word and draws one of them. It appends that to the text and repeats the step – word by word until the answer is finished.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: A company chatbot retrieves text passages and answers from them. The search finds an outdated price list. What will probably happen?
    params:
      options:
        - label: It states the old prices – confidently and with a citation.
          correct: true
        - label: It notices that the list is outdated.
          feedback: Only if something in the context hints at it, such as a date.
        - label: It does not answer at all.
          feedback: It did find text that matches.
    hints:
      - Where does the model take its answer from?
      - Can it know what is not in the context?
    explanation: "With RAG the answer depends on the search: wrong hits lead to wrong but well-cited answers. That is why the documents are maintained and dates and sources are shown."
    difficulty: 3

srs:
  cards_from: [woher, neu]
