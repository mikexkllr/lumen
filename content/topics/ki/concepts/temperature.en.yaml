id: ai.llm.temperature
type: concept
title: Temperature
summary: How bold the model is when drawing.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.temperature]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Sensible or wild?
    body: "Why does an AI sometimes sound sensible and sometimes wild? A dial controls it: the **temperature**. Slide it all the way left, then all the way right. When does the dragon stand a chance?"
    visual:
      widget: distribution
      interactive: true
      params:
        mode: tokens
        context: My pet is a
        items:
          - label: dog
            logit: 3
          - label: cat
            logit: 2.8
          - label: hamster
            logit: 1.6
          - label: parrot
            logit: 0.8
          - label: dragon
            logit: -1.5
        temperature:
          min: 0.2
          max: 2
          step: 0.2
          initial: 1
        sample:
          - 1
          - 10

  - kind: problem
    id: kalt
    widget: distribution
    prompt: Set the temperature so that “blue” has a probability above 80%.
    params:
      mode: tokens
      context: The sky today is
      items: [{ label: blue, logit: 3.0 }, { label: gray, logit: 2.2 }, { label: cloudy, logit: 1.8 }, { label: clear, logit: 1.4 }, { label: green, logit: -1.0 }]
      temperature: { min: 0.2, max: 2, step: 0.2, initial: 1 }
      sample: [1, 10]
    check: { predicate: "prob('blue') > 0.8" }
    hints:
      - Move the slider and watch the bars.
      - A low temperature makes the most likely word even more likely.
    explanation: At a low temperature, the most likely word dominates.

  - kind: explain
    id: s2
    body: |
      The **temperature** controls how boldly the model chooses.
      Low – almost always the most likely word. High – rare words come up more often. That is more creative, but more error-prone.

  - kind: problem
    id: heiss
    widget: distribution
    prompt: Set the temperature so that even “green” gets at least 4%.
    params:
      mode: tokens
      context: The sky today is
      items: [{ label: blue, logit: 3.0 }, { label: gray, logit: 2.2 }, { label: cloudy, logit: 1.8 }, { label: clear, logit: 1.4 }, { label: green, logit: -1.0 }]
      temperature: { min: 0.2, max: 2, step: 0.2, initial: 1 }
      sample: [1, 10]
    check: { predicate: "prob('green') >= 0.04" }
    hints:
      - Rare words need a high temperature.
    explanation: Only at a high temperature does the unlikely word get a real chance.
    difficulty: 2

  - kind: problem
    id: wofuer
    widget: choice
    prompt: For a math problem or a cooking recipe – which temperature is better?
    params:
      options:
        - { label: Low, correct: true }
        - { label: High, feedback: "A high temperature adds variety – but with facts, also more errors." }
        - { label: Doesn't matter, feedback: "With facts, reliability counts – and that depends on the temperature." }
    hints:
      - Do you need creativity or reliability here?
    explanation: With facts and calculations, you want the most likely, most reliable word.

  - kind: problem
    id: nahe-null
    widget: choice
    prompt: What happens at a temperature near 0?
    params:
      options:
        - { label: You get almost the same answer every time, correct: true }
        - { label: The model does not answer at all, feedback: "It answers – just very predictably." }
        - { label: The answers become especially creative, feedback: "That happens at a high temperature." }
    hints:
      - Try the lowest temperature above.
    explanation: Almost all the probability then sits on the most common word.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What happens in **top-k sampling** with k = 3?
    params:
      options:
        - label: The model draws only from the three most probable tokens
          correct: true
        - label: It produces three answers
          feedback: It limits the choice per step.
        - label: It repeats every word three times
          feedback: It is about selection, not repetition.
    hints:
      - All other tokens are excluded.
    explanation: That keeps very unfitting words out – even at high temperature.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: distribution
    prompt: Make the model so bold that the most popular word drops **below 40 %**.
    params:
      mode: tokens
      context: For breakfast I drink
      items:
        - label: tea
          logit: 2
        - label: coffee
          logit: 1.5
        - label: juice
          logit: 0.5
        - label: water
          logit: 0
      temperature:
        min: 0.2
        max: 3
        step: 0.2
        initial: 1
      sample:
        - 1
        - 10
    check:
      predicate: temperature >= 1.75
    hints:
      - At T = 1, "tea" has about 51 %. Which way must you turn?
      - High temperature flattens the distribution.
    explanation: From about T = 1.8, "tea" is below 40 %. The logits are divided by T – a large T shrinks the gaps.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Two tokens have logits 2 and 0, temperature 1. With softmax: p = e² / (e² + e⁰). What percentage does the first token get? Rounded."
    answer:
      value: 88
      tolerance: 1
    feedback:
      - when: numval(state.input) == 100
        misconception: exp-zero
        text: e⁰ = 1, not 0 – the second token gets a share too.
    hints:
      - e² ≈ 7.39 and e⁰ = 1.
      - 7.39 / 8.39 = ?
    explanation: "7.39 / 8.39 ≈ 0.88. Softmax turns any numbers into probabilities: positive and summing to 1. A logit gap of 2 means about 7 times as likely."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The temperature T divides the raw scores (logits) before they become probabilities. Two tokens have logits 2 and 0. What is the difference after dividing by T = 0.5?
    answer:
      value: 4
    hints:
      - 2 ÷ 0.5 and 0 ÷ 0.5.
    explanation: "2 becomes 4: low temperature widens gaps, the favourite dominates. High temperature levels them."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: With top-p sampling at p = 0.9, the model keeps the most likely tokens until together they have at least 90 %. The tokens have 50 %, 30 %, 15 % and 5 %. How many remain?
    answer:
      value: 3
    hints:
      - "Add from the top: 50, 80, 95 …"
      - When does the sum first reach at least 90 %?
    explanation: "50 + 30 = 80 is not enough, 50 + 30 + 15 = 95 is. Unlike top-k, top-p adapts: when the model is sure, few tokens remain, otherwise many."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what the temperature changes in a language model.
    params:
      keywords:
        - - niedrig
          - klein
          - low
        - - hoch
          - hoh
          - groß
          - high
        - - wahrscheinlich
          - selten
          - likely
          - rare
        - - kreativ
          - vorhersehbar
          - zufällig
          - creative
          - predictable
          - random
      sample: At low temperature the model nearly always picks the most likely word, so answers are predictable. At high temperature rare words get chosen too – more creative, but more error-prone.
    difficulty: 3
