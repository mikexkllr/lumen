id: ai.llm.context
type: concept
title: Was die KI gerade sieht
summary: Training, Kontextfenster und Wissenslücken.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Du fragst eine KI: »Wie heißt mein Hund?« Sie kennt dich nicht. Wann kann sie es trotzdem wissen?"
    params:
      options:
        - label: Wenn es weiter oben im Gespräch steht
          correct: true
        - label: Immer – sie weiß alles
          feedback: Über deinen Hund stand nichts im Training.
        - label: Nie
          feedback: Im Gespräch kannst du es ihr sagen.
    hints:
      - Was kann die KI gerade lesen?
    explanation: Was im Gespräch steht, sieht sie. Den Rest kennt sie nur aus dem Training.

  - kind: explain
    id: s1
    body: |
      Ein Modell weiß zweierlei: was es im **Training** gelernt hat und was im **Kontextfenster** steht – also im aktuellen Gespräch. Alles andere kennt es nicht.

  - kind: problem
    id: woher
    widget: buckets
    prompt: Woher kann die KI das wissen?
    params:
      buckets: [{ label: aus dem Training }, { label: nur aus dem Gespräch }]
      items:
        - { label: Die Hauptstadt von Frankreich, bucket: aus dem Training }
        - { label: Wie Photosynthese funktioniert, bucket: aus dem Training }
        - { label: Was in deiner letzten E-Mail stand, bucket: nur aus dem Gespräch }
        - { label: Deine Termine für morgen, bucket: nur aus dem Gespräch }
    hints:
      - Steht das irgendwo öffentlich und dauerhaft?
    explanation: Persönliches und Neues muss man der KI mitgeben.

  - kind: problem
    id: woerter
    widget: numeric
    prompt: Ein Token ist im Schnitt etwa ¾ Wort. Wie viele Wörter passen etwa in {{t}} Tokens?
    params: { unit: Wörter }
    answer: { value: "{{t * 3 / 4}}" }
    hints:
      - "{{t}} · 3 : 4."
    explanation: "Etwa {{t * 3 / 4}} Wörter."
    variants:
      params: { t: "choice[4000,8000,32000,200000]" }
      defaults: { t: 8000 }

  - kind: problem
    id: neu
    widget: choice
    prompt: Die KI kennt ein Ereignis von letzter Woche nicht. Warum?
    params:
      options:
        - { label: Ihr Training endete vorher., correct: true }
        - { label: Sie verschweigt es absichtlich., feedback: "Sie kann es schlicht nicht wissen – außer man gibt es ihr." }
    hints:
      - Wann wurde das Modell trainiert?
    explanation: Jedes Modell hat einen Wissensstand. Neues kommt nur über das Gespräch oder eine Suche hinzu.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Chatbot beantwortet Fragen zu den internen Dokumenten einer Firma, die nie im Training waren. Wie geht das?
    params:
      options:
        - label: Passende Textstellen werden gesucht und mit in den Prompt gelegt
          correct: true
        - label: Das Modell rät
          feedback: Dann würde es halluzinieren.
        - label: Es wurde heimlich nachtrainiert
          feedback: Meist genügt das Einfügen in den Kontext.
    hints:
      - Was im Kontextfenster steht, »weiß« das Modell.
    explanation: Das heißt **RAG** – Retrieval-Augmented Generation. Suchen plus Sprachmodell.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Kontextfenster fasst 200 000 Tokens. Ein Token ist etwa ¾ Wort, eine Buchseite hat etwa 300 Wörter. Wie viele Seiten passen ungefähr hinein?
    answer:
      value: 500
      tolerance: 10
    hints:
      - "Erst in Wörter umrechnen: 200 000 · ¾."
      - 150 000 Wörter geteilt durch 300.
    explanation: "Etwa 500 Seiten – ein dickes Buch. Trotzdem gilt: Was **nicht** im Fenster steht, sieht das Modell nicht."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Chatbot »erinnert« sich in einem neuen Gespräch an deinen Namen. Wie funktioniert das meist?
    params:
      options:
        - label: Die App hat sich Notizen gespeichert und fügt sie in den Kontext ein.
          correct: true
        - label: Das Modell hat aus deinem Gespräch neu gelernt.
          feedback: Die Gewichte ändern sich beim Chatten nicht.
        - label: Es hat deinen Namen geraten.
          feedback: Raten wäre Glück – hier steckt eine gespeicherte Information dahinter.
    hints:
      - Ändert sich das Modell selbst, während du mit ihm sprichst?
      - Was es sieht, steht im Kontext. Wer kann etwas dort hineinlegen?
    explanation: »Gedächtnis« ist meist ein **Speicher** außerhalb des Modells. Die App legt passende Notizen beim nächsten Mal in den Kontext. Das Modell selbst bleibt gleich.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux in einfachen Worten, wie ein Sprachmodell einen Text schreibt.
    params:
      keywords:
        - - nächste
          - next
        - - wort
          - token
          - word
        - - wahrscheinlich
          - probab
          - likely
        - - wiederhol
          - schritt
          - immer wieder
          - repeat
          - step
          - again
          - anhäng
          - append
      min: 3
      sample: Es berechnet für jedes mögliche nächste Wort eine Wahrscheinlichkeit und zieht eines davon. Das hängt es an den Text an und wiederholt den Schritt – Wort für Wort, bis die Antwort fertig ist.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein Firmen-Chatbot sucht Textstellen und antwortet daraus. Die Suche findet eine veraltete Preisliste. Was passiert wahrscheinlich?
    params:
      options:
        - label: Es nennt die alten Preise – überzeugt und mit Quelle.
          correct: true
        - label: Es merkt, dass die Liste veraltet ist.
          feedback: Nur wenn im Kontext etwas darauf hinweist, etwa ein Datum.
        - label: Es antwortet gar nicht.
          feedback: Es hat ja Text gefunden, der passt.
    hints:
      - Woher nimmt das Modell seine Antwort?
      - Kann es wissen, was nicht im Kontext steht?
    explanation: "Bei **RAG** hängt die Antwort an der Suche: Falsche Treffer führen zu falschen, aber gut belegten Antworten. Darum pflegt man die Dokumente und zeigt Datum und Quelle an."
    difficulty: 3

srs:
  cards_from: [woher, neu]
