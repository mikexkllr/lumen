id: ai.llm.tokens
type: concept
title: Tokens
summary: Modelle lesen keine Buchstaben, sondern Wortstücke.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.tokens]
estimated_minutes: 6
steps:
  - kind: problem
    id: zerlegen
    widget: choice
    body: Sprachmodelle zerlegen Text in **Tokens**. Häufige Wörter sind ein Token, seltene werden in Stücke geteilt.
    prompt: Wie wird »Fahrradschlauch« wahrscheinlich zerlegt?
    params:
      options:
        - { label: "Fahr · rad · schlauch", correct: true }
        - { label: "F · a · h · r · r · a · d …", feedback: "Einzelne Buchstaben wären viel zu viele Tokens." }
        - { label: Ein einziges Token, feedback: "Dafür ist das Wort zu selten." }
    hints:
      - Welche Teile kommen in vielen Wörtern vor?
    explanation: Häufige Bausteine wie »Fahr«, »rad«, »schlauch« sind eigene Tokens.

  - kind: problem
    id: bauen
    widget: tiles
    prompt: Setze die Tokens zum Wort »unglaublich« zusammen.
    params: { tiles: ["glaub", "lich", "un", "bar", "glück"] }
    answer: { sequence: ["un", "glaub", "lich"] }
    hints:
      - Womit fängt das Wort an?
    explanation: un · glaub · lich.

  - kind: explain
    id: s3
    body: |
      Ein Modell sieht also keine Buchstaben, sondern Nummern für Tokens.
      Darum tut es sich manchmal schwer mit Aufgaben wie »Wie viele e hat Erdbeere?« – die Buchstaben stecken im Token versteckt.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Ein Token entspricht im Schnitt etwa 0,75 Wörtern. Wie viele Tokens hat ein Text mit 750 Wörtern ungefähr?
    answer: { value: 1000, tolerance: 20 }
    feedback:
      - when: "abs(numval(state.input) - 562.5) < 20"
        text: Mehr Tokens als Wörter – ein Wort ist oft mehr als ein Token. Teile durch 0,75.
    hints:
      - 750 Wörter durch 0,75 Wörter pro Token.
    explanation: "750 : 0,75 = 1000 Tokens."
    difficulty: 2

  - kind: problem
    id: grenze
    widget: choice
    prompt: Warum zählt bei Chatbots oft die Zahl der Tokens statt der Wörter?
    params:
      options:
        - { label: Weil das Modell intern nur Tokens verarbeitet, correct: true }
        - { label: Weil Wörter zu ungenau gezählt werden, feedback: "Wörter lassen sich gut zählen – das Modell rechnet aber in Tokens." }
        - { label: Weil Tokens immer ganze Sätze sind, feedback: "Tokens sind meist Wortstücke, keine Sätze." }
    hints:
      - Was sieht das Modell wirklich?
    explanation: Rechenzeit und Grenzen eines Modells hängen an der Zahl der Tokens.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Modell kostet 3 € pro Million Eingabe-Tokens. Du schickst ein Buch mit 90 000 Wörtern (ein Token ≈ 0,75 Wörter). Was kostet das in Cent?
    params:
      unit: ct
    answer:
      value: 36
    hints:
      - "90 000 : 0,75 = 120 000 Tokens."
    explanation: 0,12 Millionen · 3 € = 0,36 €. Ein ganzes Buch lesen für 36 Cent.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum zerlegt man Text in Wortstücke statt in ganze Wörter oder einzelne Buchstaben?
    params:
      options:
        - label: "Ein Kompromiss: begrenzter Wortschatz, und trotzdem lässt sich jedes neue Wort zusammensetzen"
          correct: true
        - label: Weil Computer keine Buchstaben kennen
          feedback: Sie könnten auch Buchstaben verarbeiten – nur würden Texte sehr lang.
        - label: Weil ganze Wörter verboten sind
          feedback: Häufige Wörter sind oft ein einziges Token.
    hints:
      - Wie viele verschiedene Wörter gibt es – mit allen Namen und Tippfehlern?
    explanation: "Das Verfahren heißt **Byte-Pair-Encoding**: Häufige Zeichenfolgen werden schrittweise zu Tokens verschmolzen."
    difficulty: 3
