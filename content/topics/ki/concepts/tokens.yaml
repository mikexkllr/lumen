id: ai.llm.tokens
type: concept
title: Tokens
summary: Modelle lesen keine Buchstaben, sondern Wortstücke.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.tokens]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Text in Stücken
    body: "Ein Sprachmodell liest keine Buchstaben. Es zerlegt Text in **Tokens**: Wortstücke mit Nummern. Deck die Karten auf: Was folgt daraus Überraschendes?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍓
            front: Wie viele r?
            back: Lange stolperten Chatbots über »Wie viele r hat strawberry?«. Sie sehen Stücke, keine Buchstaben.
          - icon: 🇩🇪
            front: Deutsch kostet mehr
            back: Für denselben Inhalt braucht Deutsch oft mehr Tokens als Englisch.
          - icon: 🔢
            front: Zahlen in Brocken
            back: Eine lange Zahl zerfällt oft in Brocken wie 123 · 456 · 7. Rechnen wird so knifflig.
          - icon: 😀
            front: Ein Emoji, viele Tokens
            back: Ein einziges Emoji kann mehrere Tokens belegen.

  - kind: problem
    id: zerlegen
    widget: choice
    body: Sprachmodelle zerlegen Text in **Tokens**. Häufige Wörter sind ein Token, seltene werden in Stücke geteilt.
    prompt: Wie wird »Fahrradschlauch« wahrscheinlich zerlegt?
    params:
      options:
        - { label: "Fahr · rad · schlauch", correct: true }
        - { label: "F · a · h · r · r · a · d …", feedback: "Einzelne Buchstaben wären viel zu viele Tokens." }
        - { label: Ein einziges Token, feedback: "Dafür ist das Wort zu selten." }
    hints:
      - Welche Teile kommen in vielen Wörtern vor?
    explanation: Häufige Bausteine wie »Fahr«, »rad«, »schlauch« sind eigene Tokens.

  - kind: problem
    id: bauen
    widget: tiles
    prompt: Setze die Tokens zum Wort »unglaublich« zusammen.
    params: { tiles: ["glaub", "lich", "un", "bar", "glück"] }
    answer: { sequence: ["un", "glaub", "lich"] }
    hints:
      - Womit fängt das Wort an?
    explanation: un · glaub · lich.

  - kind: explain
    id: s3
    body: |
      Ein Modell sieht also keine Buchstaben, sondern Nummern für **Tokens**.
      Darum tut es sich manchmal schwer mit Aufgaben wie »Wie viele e hat Erdbeere?« – die Buchstaben stecken im Token versteckt.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Ein Token entspricht im Schnitt etwa 0,75 Wörtern. Wie viele Tokens hat ein Text mit 750 Wörtern ungefähr?
    answer: { value: 1000, tolerance: 20 }
    feedback:
      - when: "abs(numval(state.input) - 562.5) < 20"
        text: Mehr Tokens als Wörter – ein Wort ist oft mehr als ein Token. Teile durch 0,75.
    hints:
      - 750 Wörter durch 0,75 Wörter pro Token.
    explanation: "750 : 0,75 = 1000 Tokens."
    difficulty: 2

  - kind: problem
    id: grenze
    widget: choice
    prompt: Warum zählt bei Chatbots oft die Zahl der Tokens statt der Wörter?
    params:
      options:
        - { label: Weil das Modell intern nur Tokens verarbeitet, correct: true }
        - { label: Weil Wörter zu ungenau gezählt werden, feedback: "Wörter lassen sich gut zählen – das Modell rechnet aber in Tokens." }
        - { label: Weil Tokens immer ganze Sätze sind, feedback: "Tokens sind meist Wortstücke, keine Sätze." }
    hints:
      - Was sieht das Modell wirklich?
    explanation: Rechenzeit und Grenzen eines Modells hängen an der Zahl der Tokens.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Modell kostet 3 € pro Million Eingabe-Tokens. Du schickst ein Buch mit 90 000 Wörtern (ein Token ≈ 0,75 Wörter). Was kostet das in Cent?
    params:
      unit: ct
    answer:
      value: 36
    hints:
      - "90 000 : 0,75 = 120 000 Tokens."
    explanation: 0,12 Millionen · 3 € = 0,36 €. Ein ganzes Buch lesen für 36 Cent.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: So lernt ein Tokenizer seine Wortstücke (Byte-Pair-Encoding). Ordne.
    params:
      items:
        - label: Starte mit einzelnen Zeichen als Tokens.
        - label: Zähle, welches Paar benachbarter Tokens am häufigsten ist.
        - label: Verschmelze dieses Paar zu einem neuen Token.
        - label: Wiederhole, bis der Wortschatz groß genug ist.
    hints:
      - Am Anfang kennt der Tokenizer nur Buchstaben.
      - Häufige Paare wie »e« + »n« werden zuerst verschmolzen.
    explanation: So entstehen Tokens für häufige Silben und Wörter. Seltene Wörter bleiben in **Stücke** zerlegt.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Derselbe Satz braucht auf Deutsch oft mehr Tokens als auf Englisch. Woran liegt das meist?
    params:
      options:
        - label: Viele Tokenizer lernten vor allem an englischem Text – deutsche Wörter zerfallen in mehr Stücke.
          correct: true
        - label: Deutsch hat mehr Buchstaben im Alphabet.
          feedback: Die paar Umlaute machen kaum einen Unterschied.
        - label: Das Modell versteht Deutsch nicht.
          feedback: Es versteht es oft gut – es braucht nur mehr Stücke dafür.
    hints:
      - Welche Wortstücke werden beim Tokenizer-Training häufig?
      - Lange zusammengesetzte Wörter kommen dazu.
    explanation: Was in den Trainingsdaten häufig ist, bekommt eigene Tokens. Mehr Tokens heißt mehr **Kosten** und weniger Platz im Kontext – ein echter Nachteil für viele Sprachen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum zerlegt man Text in Wortstücke statt in ganze Wörter oder einzelne Buchstaben?
    params:
      options:
        - label: "Ein Kompromiss: begrenzter Wortschatz, und trotzdem lässt sich jedes neue Wort zusammensetzen"
          correct: true
        - label: Weil Computer keine Buchstaben kennen
          feedback: Sie könnten auch Buchstaben verarbeiten – nur würden Texte sehr lang.
        - label: Weil ganze Wörter verboten sind
          feedback: Häufige Wörter sind oft ein einziges Token.
    hints:
      - Wie viele verschiedene Wörter gibt es – mit allen Namen und Tippfehlern?
    explanation: "Das Verfahren heißt **Byte-Pair-Encoding**: Häufige Zeichenfolgen werden schrittweise zu Tokens verschmolzen."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein Modell kennt 50 000 Tokens. Jedes Token hat einen Vektor mit 4096 Zahlen. Wie viele Millionen Zahlen hat diese Tabelle?
    answer:
      value: 204.8
      tolerance: 0.1
    hints:
      - Rechne 50 000 · 4096.
      - Das sind 204 800 000. In Millionen?
    explanation: Rund 205 Millionen Gewichte nur für die **Einbettungstabelle**. Ein größerer Wortschatz spart Tokens pro Text, kostet aber Speicher – ein Kompromiss.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Sprachmodell manchmal falsch zählt, wie viele »r« in einem Wort stecken.
    params:
      keywords:
        - - token
          - stück
          - piece
        - - buchstab
          - letter
          - zeichen
          - character
        - - nummer
          - zahl
          - sieht nicht
          - number
          - cannot see
          - does not see
      sample: Das Modell sieht keine Buchstaben, sondern Tokens – Wortstücke, die als Nummern ankommen. Die einzelnen Buchstaben stecken darin verborgen. Darum muss es raten, statt zu zählen.
    difficulty: 3
