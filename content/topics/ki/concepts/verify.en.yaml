id: ai.llm.verify
type: concept
title: Checking AI answers
summary: Plausible is not the same as correct.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.verify]
estimated_minutes: 11
steps:
  - kind: problem
    id: zugspitze
    widget: choice
    body: A chatbot writes – “The Zugspitze, at 2962 m, is higher than Mont Blanc.”
    prompt: What is true?
    params:
      options:
        - { label: Mont Blanc is much higher – the statement is false, correct: true }
        - { label: All correct, feedback: "Mont Blanc is over 4800 m high." }
        - { label: You cannot check that, feedback: "Mountain heights are in every atlas." }
    hints:
      - Mont Blanc is the highest mountain in the Alps.
    explanation: The height of the Zugspitze is right – but the comparison is not. Mixes of true and false are typical.

  - kind: explain
    id: s2
    body: |
      A language model writes text that **sounds real**. It does not check whether it is true.
      When something sounds sure but is made up, it is called a **hallucination**.

  - kind: problem
    id: strategien
    widget: choice
    prompt: Which strategies help with checking? Select all that apply.
    params:
      multiple: true
      options:
        - { label: Compare with a reliable source, correct: true }
        - { label: Redo calculations yourself, correct: true }
        - { label: "Believe it because it sounds confident", feedback: "A model sounds confident even when it is wrong." }
        - { label: "Ask until you like the answer", feedback: "That finds the answer you want, not the correct one." }
    hints:
      - What would you do with a statement from a person?
    explanation: Compare sources and redo the math yourself.

  - kind: problem
    id: nachrechnen
    widget: numeric
    body: An AI calculates – “17 · 23 = 381”.
    prompt: Check it. What is 17 · 23 really?
    answer: { value: 391 }
    hints:
      - 17 · 20 = 340, plus 17 · 3.
    explanation: 340 + 51 = 391. The AI was off by 10.

  - kind: problem
    id: code
    widget: choice
    prompt: An AI writes code that should check whether a number is even. How do you make sure it is correct?
    params:
      options:
        - { label: "Check with test cases – such as 0, 1, 2 and −3", correct: true }
        - { label: Just use the code, feedback: "Generated code can have bugs too – especially with special cases." }
        - { label: "Only check that it is short", feedback: "Short does not mean correct." }
    hints:
      - Which numbers are tricky?
    explanation: Targeted test cases, including special cases like 0 and negative numbers, reveal errors.

  - kind: problem
    id: reihenfolge
    widget: order
    prompt: Put the steps of working with AI in a sensible order.
    params:
      items:
        - { label: Describe the task clearly }
        - { label: Read the answer }
        - { label: Check the key facts }
        - { label: Use the result }
    hints:
      - Do you check before or after you use it?
    explanation: First ask clearly, then read, check, and only then use.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: If an AI names a source, that source exists.
          right: false
          why: Models sometimes invent titles, authors and links.
        - text: A fluent, confident answer can still be wrong.
          right: true
        - text: For important decisions a second source should be checked.
          right: true

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: If an answer sounds sure but is made up, that is a [[hallucination]]. Important things are checked against a second [[source]].
      distractors:
        - temperature
        - question

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: You ask the same question three times and get three different years. What does that say?
    params:
      options:
        - label: The model is uncertain here – the answer should be looked up
          correct: true
        - label: The third answer is right
          feedback: The order says nothing about correctness.
        - label: All three are right
          feedback: An event has only one year.
    hints:
      - With solid knowledge the answer would be stable.
    explanation: Fluctuating answers are a good warning sign of hallucinations.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A model answers such questions correctly 80 % of the time. You ask 3 independent questions. How likely are **all** answers correct? In percent.
    answer:
      value: 51.2
      tolerance: 0.5
    feedback:
      - when: numval(state.input) == 80
        misconception: single
        text: That is for one question. All three must be right.
    hints:
      - Multiply the probabilities.
      - 0.8 · 0.8 · 0.8 = ?
    explanation: 0.8³ = 0.512. Even with three facts nearly every second answer is wrong somewhere. Long texts therefore need especially careful checking.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: buckets
    prompt: How do you best check this?
    params:
      buckets:
        - id: b1
          label: recompute or test yourself
        - id: b2
          label: look it up in a source
      items:
        - label: the result of 17 · 23
          bucket: b1
        - label: the year of an event
          bucket: b2
        - label: whether a code function works
          bucket: b1
        - label: a quote from a person
          bucket: b2
    hints:
      - Calculations and code you can run yourself.
      - Facts about the world need a source.
    explanation: What you can compute or try out, you check yourself. Facts, quotes and figures about the world you check in reliable sources.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why do language models hallucinate at all?
    params:
      options:
        - label: They produce what is most probable – even with nothing fitting learnt, something plausible-sounding emerges
          correct: true
        - label: They want to deceive
          feedback: They have no intent.
        - label: They lack computing power
          feedback: Even the largest models hallucinate.
    hints:
      - A model has no built-in “I do not know that”.
    explanation: "There is no separate knowledge base – only patterns in weights. The remedy: give the model sources and demand evidence."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: A chatbot first retrieves matching documents and then answers with citations. What holds?
    params:
      options:
        - label: That often reduces made-up answers a lot – but does not prevent them completely.
          correct: true
        - label: Then it can no longer hallucinate.
          feedback: It can summarise sources wrongly or retrieve the wrong ones.
        - label: Sources make it less reliable.
          feedback: On the contrary – the answer is now much easier to check.
    hints:
      - What can go wrong in the search? And in the summary?
      - "A big advantage: you can open the source yourself."
    explanation: "With sources an answer becomes checkable. Errors remain possible: wrong hits, outdated pages or a distorted quote. A quick look at the source pays off."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why you should check AI answers even when they sound very convincing.
    params:
      keywords:
        - - wahrscheinlich
          - klingt
          - plausibel
          - likely
          - sounds
          - plausible
        - - erfind
          - halluzin
          - falsch
          - invent
          - hallucinat
          - wrong
        - - quelle
          - prüf
          - nachrechn
          - source
          - check
          - verify
      sample: A language model writes what sounds likely and does not check facts. So it can invent things that seem convincing. I check important things with a source or recompute them.
    difficulty: 3
