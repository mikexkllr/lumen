id: ai.llm.temperature
type: concept
title: Temperatur
summary: Wie mutig das Modell beim Ziehen ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.temperature]
estimated_minutes: 7
steps:
  - kind: problem
    id: kalt
    widget: distribution
    prompt: Stelle die Temperatur so ein, dass »blau« eine Wahrscheinlichkeit von über 80 % hat.
    params:
      mode: tokens
      context: Der Himmel ist heute
      items: [{ label: blau, logit: 3.0 }, { label: grau, logit: 2.2 }, { label: wolkig, logit: 1.8 }, { label: klar, logit: 1.4 }, { label: grün, logit: -1.0 }]
      temperature: { min: 0.2, max: 2, step: 0.2, initial: 1 }
      sample: [1, 10]
    check: { predicate: "prob('blau') > 0.8" }
    hints:
      - Schiebe den Regler und beobachte die Balken.
      - Niedrige Temperatur macht das wahrscheinlichste Wort noch wahrscheinlicher.
    explanation: Bei niedriger Temperatur dominiert das wahrscheinlichste Wort.

  - kind: explain
    id: s2
    body: |
      Die **Temperatur** steuert, wie mutig das Modell wählt.
      Niedrig – fast immer das wahrscheinlichste Wort. Hoch – auch seltene Wörter kommen öfter dran. Das ist kreativer, aber fehleranfälliger.

  - kind: problem
    id: heiss
    widget: distribution
    prompt: Stelle die Temperatur so ein, dass auch »grün« mindestens 4 % bekommt.
    params:
      mode: tokens
      context: Der Himmel ist heute
      items: [{ label: blau, logit: 3.0 }, { label: grau, logit: 2.2 }, { label: wolkig, logit: 1.8 }, { label: klar, logit: 1.4 }, { label: grün, logit: -1.0 }]
      temperature: { min: 0.2, max: 2, step: 0.2, initial: 1 }
      sample: [1, 10]
    check: { predicate: "prob('grün') >= 0.04" }
    hints:
      - Seltene Wörter brauchen eine hohe Temperatur.
    explanation: Erst bei hoher Temperatur bekommt das unwahrscheinliche Wort eine echte Chance.
    difficulty: 2

  - kind: problem
    id: wofuer
    widget: choice
    prompt: Für eine Matheaufgabe oder ein Kochrezept – welche Temperatur ist besser?
    params:
      options:
        - { label: Niedrig, correct: true }
        - { label: Hoch, feedback: "Hohe Temperatur bringt Abwechslung – bei Fakten aber auch mehr Fehler." }
        - { label: Egal, feedback: "Bei Fakten zählt Zuverlässigkeit – das hängt von der Temperatur ab." }
    hints:
      - Brauchst du hier Kreativität oder Verlässlichkeit?
    explanation: Bei Fakten und Rechnungen will man das wahrscheinlichste, verlässlichste Wort.

  - kind: problem
    id: nahe-null
    widget: choice
    prompt: Was passiert bei einer Temperatur nahe 0?
    params:
      options:
        - { label: Es kommt fast immer dieselbe Antwort, correct: true }
        - { label: Das Modell antwortet gar nicht, feedback: "Es antwortet – nur sehr vorhersehbar." }
        - { label: Die Antworten werden besonders kreativ, feedback: "Das ist bei hoher Temperatur so." }
    hints:
      - Probiere oben die kleinste Temperatur aus.
    explanation: Fast die ganze Wahrscheinlichkeit liegt dann auf dem häufigsten Wort.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Bei **Top-k-Sampling** mit k = 3 passiert was?
    params:
      options:
        - label: Das Modell zieht nur aus den drei wahrscheinlichsten Tokens
          correct: true
        - label: Es erzeugt drei Antworten
          feedback: Es begrenzt die Auswahl pro Schritt.
        - label: Es wiederholt jedes Wort dreimal
          feedback: Es geht um die Auswahl, nicht um Wiederholung.
    hints:
      - Alle anderen Tokens werden ausgeschlossen.
    explanation: So bleiben sehr unpassende Wörter draußen – auch bei hoher Temperatur.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die Temperatur T teilt die Rohwerte (Logits) vor der Umrechnung in Wahrscheinlichkeiten. Zwei Tokens haben die Logits 2 und 0. Wie groß ist der Unterschied nach der Division durch T = 0,5?
    answer:
      value: 4
    hints:
      - "2 : 0,5 und 0 : 0,5."
    explanation: "Aus 2 wird 4: Niedrige Temperatur vergrößert Abstände, der Favorit dominiert. Hohe Temperatur ebnet sie ein."
    difficulty: 3
