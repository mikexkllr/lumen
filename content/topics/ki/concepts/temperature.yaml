id: ai.llm.temperature
type: concept
title: Temperatur
summary: Wie mutig das Modell beim Ziehen ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [ai.temperature]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Brav oder verrückt?
    body: "Warum klingt eine KI mal brav und mal verrückt? Das steuert ein Regler: die **Temperatur**. Schieb ihn ganz nach links, dann ganz nach rechts. Wann hat der Drache eine Chance?"
    visual:
      widget: distribution
      interactive: true
      params:
        mode: tokens
        context: Mein Haustier ist ein
        items:
          - label: Hund
            logit: 3
          - label: Kater
            logit: 2.8
          - label: Hamster
            logit: 1.6
          - label: Papagei
            logit: 0.8
          - label: Drache
            logit: -1.5
        temperature:
          min: 0.2
          max: 2
          step: 0.2
          initial: 1
        sample:
          - 1
          - 10

  - kind: problem
    id: kalt
    widget: distribution
    prompt: Stelle die Temperatur so ein, dass »blau« eine Wahrscheinlichkeit von über 80 % hat.
    params:
      mode: tokens
      context: Der Himmel ist heute
      items: [{ label: blau, logit: 3.0 }, { label: grau, logit: 2.2 }, { label: wolkig, logit: 1.8 }, { label: klar, logit: 1.4 }, { label: grün, logit: -1.0 }]
      temperature: { min: 0.2, max: 2, step: 0.2, initial: 1 }
      sample: [1, 10]
    check: { predicate: "prob('blau') > 0.8" }
    hints:
      - Schiebe den Regler und beobachte die Balken.
      - Niedrige Temperatur macht das wahrscheinlichste Wort noch wahrscheinlicher.
    explanation: Bei niedriger Temperatur dominiert das wahrscheinlichste Wort.

  - kind: explain
    id: s2
    body: |
      Die **Temperatur** steuert, wie mutig das Modell wählt.
      Niedrig – fast immer das wahrscheinlichste Wort. Hoch – auch seltene Wörter kommen öfter dran. Das ist kreativer, aber fehleranfälliger.

  - kind: problem
    id: heiss
    widget: distribution
    prompt: Stelle die Temperatur so ein, dass auch »grün« mindestens 4 % bekommt.
    params:
      mode: tokens
      context: Der Himmel ist heute
      items: [{ label: blau, logit: 3.0 }, { label: grau, logit: 2.2 }, { label: wolkig, logit: 1.8 }, { label: klar, logit: 1.4 }, { label: grün, logit: -1.0 }]
      temperature: { min: 0.2, max: 2, step: 0.2, initial: 1 }
      sample: [1, 10]
    check: { predicate: "prob('grün') >= 0.04" }
    hints:
      - Seltene Wörter brauchen eine hohe Temperatur.
    explanation: Erst bei hoher Temperatur bekommt das unwahrscheinliche Wort eine echte Chance.
    difficulty: 2

  - kind: problem
    id: wofuer
    widget: choice
    prompt: Für eine Matheaufgabe oder ein Kochrezept – welche Temperatur ist besser?
    params:
      options:
        - { label: Niedrig, correct: true }
        - { label: Hoch, feedback: "Hohe Temperatur bringt Abwechslung – bei Fakten aber auch mehr Fehler." }
        - { label: Egal, feedback: "Bei Fakten zählt Zuverlässigkeit – das hängt von der Temperatur ab." }
    hints:
      - Brauchst du hier Kreativität oder Verlässlichkeit?
    explanation: Bei Fakten und Rechnungen will man das wahrscheinlichste, verlässlichste Wort.

  - kind: problem
    id: nahe-null
    widget: choice
    prompt: Was passiert bei einer Temperatur nahe 0?
    params:
      options:
        - { label: Es kommt fast immer dieselbe Antwort, correct: true }
        - { label: Das Modell antwortet gar nicht, feedback: "Es antwortet – nur sehr vorhersehbar." }
        - { label: Die Antworten werden besonders kreativ, feedback: "Das ist bei hoher Temperatur so." }
    hints:
      - Probiere oben die kleinste Temperatur aus.
    explanation: Fast die ganze Wahrscheinlichkeit liegt dann auf dem häufigsten Wort.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Bei **Top-k-Sampling** mit k = 3 passiert was?
    params:
      options:
        - label: Das Modell zieht nur aus den drei wahrscheinlichsten Tokens
          correct: true
        - label: Es erzeugt drei Antworten
          feedback: Es begrenzt die Auswahl pro Schritt.
        - label: Es wiederholt jedes Wort dreimal
          feedback: Es geht um die Auswahl, nicht um Wiederholung.
    hints:
      - Alle anderen Tokens werden ausgeschlossen.
    explanation: So bleiben sehr unpassende Wörter draußen – auch bei hoher Temperatur.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: distribution
    prompt: Mach das Modell so mutig, dass das beliebteste Wort **unter 40 %** fällt.
    params:
      mode: tokens
      context: Zum Frühstück trinke ich
      items:
        - label: Tee
          logit: 2
        - label: Kaffee
          logit: 1.5
        - label: Saft
          logit: 0.5
        - label: Wasser
          logit: 0
      temperature:
        min: 0.2
        max: 3
        step: 0.2
        initial: 1
      sample:
        - 1
        - 10
    check:
      predicate: temperature >= 1.75
    hints:
      - Bei T = 1 hat »Tee« etwa 51 %. In welche Richtung musst du drehen?
      - Hohe Temperatur macht die Verteilung flacher.
    explanation: Ab etwa T = 1,8 liegt »Tee« unter 40 %. Die Logits werden durch T geteilt – große T schrumpfen die Abstände.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Zwei Tokens haben die Logits 2 und 0, die Temperatur ist 1. Mit Softmax: p = e² / (e² + e⁰). Wie viel Prozent bekommt das erste Token? Gerundet."
    answer:
      value: 88
      tolerance: 1
    feedback:
      - when: numval(state.input) == 100
        misconception: exp-zero
        text: e⁰ = 1, nicht 0 – auch das zweite Token bekommt etwas ab.
    hints:
      - e² ≈ 7,39 und e⁰ = 1.
      - 7,39 / 8,39 = ?
    explanation: "7,39 / 8,39 ≈ 0,88. **Softmax** macht aus beliebigen Zahlen Wahrscheinlichkeiten: positiv und mit Summe 1. Ein Logit-Abstand von 2 heißt etwa 7-mal so wahrscheinlich."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die Temperatur T teilt die Rohwerte (Logits) vor der Umrechnung in Wahrscheinlichkeiten. Zwei Tokens haben die Logits 2 und 0. Wie groß ist der Unterschied nach der Division durch T = 0,5?
    answer:
      value: 4
    hints:
      - "2 : 0,5 und 0 : 0,5."
    explanation: "Aus 2 wird 4: Niedrige Temperatur vergrößert Abstände, der Favorit dominiert. Hohe Temperatur ebnet sie ein."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Beim **Top-p-Sampling** mit p = 0,9 behält das Modell die wahrscheinlichsten Tokens, bis sie zusammen mindestens 90 % haben. Die Tokens haben 50 %, 30 %, 15 % und 5 %. Wie viele bleiben?
    answer:
      value: 3
    hints:
      - "Addiere von oben: 50, 80, 95 …"
      - Wann ist die Summe erstmals mindestens 90 %?
    explanation: "50 + 30 = 80 reicht nicht, 50 + 30 + 15 = 95 schon. Anders als Top-k passt sich Top-p an: Ist das Modell sicher, bleiben wenige Tokens, sonst viele."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was die Temperatur bei einem Sprachmodell verändert.
    params:
      keywords:
        - - niedrig
          - klein
          - low
        - - hoch
          - hoh
          - groß
          - high
        - - wahrscheinlich
          - selten
          - likely
          - rare
        - - kreativ
          - vorhersehbar
          - zufällig
          - creative
          - predictable
          - random
      sample: Bei niedriger Temperatur nimmt das Modell fast immer das wahrscheinlichste Wort, die Antwort ist vorhersehbar. Bei hoher Temperatur kommen auch seltene Wörter dran – das ist kreativer, aber fehleranfälliger.
    difficulty: 3
