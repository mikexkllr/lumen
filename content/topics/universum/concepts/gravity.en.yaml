id: sci.space.gravity
type: concept
title: Heavier on Jupiter
summary: Mass stays, weight changes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Your **mass** is the same everywhere. Your **weight** depends on how strongly the celestial body pulls. On the Moon, it is about a sixth.

  - kind: problem
    id: mond
    widget: numeric
    prompt: A scale shows {{m}} kg on Earth. What would it show on the Moon?
    params: { unit: kg }
    answer: { value: "{{m / 6}}" }
    hints:
      - "{{m}} ÷ 6."
    explanation: "About {{m / 6}} kg. But the mass is still {{m}} kg."
    variants:
      params: { m: "choice[60,72,90,120,150]" }
      defaults: { m: 90 }

  - kind: problem
    id: masse
    widget: choice
    prompt: How much mass does the same person have on the Moon?
    params:
      options:
        - { label: Just as much as on Earth, correct: true }
        - { label: A sixth, feedback: "That is the weight. The mass doesn't change." }
    hints:
      - Do you lose atoms on the Moon?
    explanation: Mass is how much matter there is. That stays the same.

  - kind: problem
    id: planeten
    widget: match
    prompt: How strong is gravity compared to Earth?
    params:
      pairs:
        - { left: Moon, right: "about ⅙" }
        - { left: Mars, right: "about ⅓" }
        - { left: Earth, right: "1" }
        - { left: Jupiter, right: "about 2.5 times" }
    hints:
      - The bigger and heavier the body, the stronger the pull.
    explanation: Jupiter is huge. There you would weigh more than twice as much.

srs:
  cards_from: [mond, masse]
