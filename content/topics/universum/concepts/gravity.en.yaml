id: sci.space.gravity
type: concept
title: Heavier on Jupiter
summary: Mass stays, weight changes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 16
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Throwing on Jupiter
    body: Every planet pulls with a different strength. Look at the throw at 9.8 – that is how hard the Earth pulls. Then set the **gravity** to 24.8, as on Jupiter. How far does the ball fly now?
    visual:
      widget: sim
      interactive: true
      params:
        scene: projectile
        controls:
          g:
            fixed: false

  - kind: problem
    id: start-springen
    widget: choice
    prompt: The Moon pulls on you much more weakly than Earth. Where do you jump higher?
    params:
      options:
        - label: On the Moon
          correct: true
        - label: On Earth
          feedback: Earth pulls harder. It brings you back down sooner.
        - label: Equally high everywhere
          feedback: Gravity slows your jump. If it is weaker, you get higher.
    hints:
      - What pulls you back down after you take off?
      - With a weaker pull downward, you keep rising for longer.
    explanation: On the Moon you jump much higher. Astronauts bounced around there as if in slow motion, despite their heavy spacesuits.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: on Earth you jump 50 cm high. How high would you get on the Moon?"
    params:
      min: 0
      max: 1000
      unit: cm
    answer:
      value: 300
      tolerance: 80
    explanation: About 3 metres. The Moon pulls only a sixth as hard.

  - kind: explain
    id: s1
    body: |
      Your **mass** is the same everywhere. Your **weight** depends on how strongly the celestial body pulls. On the Moon, it is about a sixth.

  - kind: problem
    id: start-tasche
    widget: numeric
    prompt: A bag shows 6 kg on a scale on Earth. On the Moon everything weighs only one sixth. What does the scale show there?
    params:
      unit: kg
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 36
        misconception: multiply-not-divide
        text: "You multiplied by 6. On the Moon everything gets lighter: divide by 6."
    hints:
      - "One sixth means: divided by 6."
      - Work out 6 ÷ 6.
    explanation: 6 ÷ 6 = 1. The scale shows only 1 kg. But there is just as much in the bag as before.

  - kind: problem
    id: mond
    widget: numeric
    prompt: A scale shows {{m}} kg on Earth. What would it show on the Moon?
    params: { unit: kg }
    answer: { value: "{{m / 6}}" }
    hints:
      - "{{m}} ÷ 6."
    explanation: "About {{m / 6}} kg. But the mass is still {{m}} kg."
    variants:
      params: { m: "choice[60,72,90,120,150]" }
      defaults: { m: 90 }

  - kind: problem
    id: masse
    widget: choice
    prompt: How much mass does the same person have on the Moon?
    params:
      options:
        - { label: Just as much as on Earth, correct: true }
        - { label: A sixth, feedback: "That is the weight. The mass doesn't change." }
    hints:
      - Do you lose atoms on the Moon?
    explanation: Mass is how much matter there is. That stays the same.

  - kind: problem
    id: planeten
    widget: match
    prompt: How strong is gravity compared to Earth?
    params:
      pairs:
        - { left: Moon, right: "about ⅙" }
        - { left: Mars, right: "about ⅓" }
        - { left: Earth, right: "1" }
        - { left: Jupiter, right: "about 2.5 times" }
    hints:
      - The bigger and heavier the body, the stronger the pull.
    explanation: Jupiter is huge. There you would weigh more than twice as much.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: On the Moon you weigh less, but your mass stays the same.
          right: true
        - text: There is no gravity in space.
          right: false
          why: The space station falls around the Earth constantly – gravity there is almost as strong as here.
        - text: The Sun’s gravity keeps the planets on their orbits.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Gravity falls with the square of the distance. You are three times as far from the Earth’s centre. To what fraction does your weight drop?
    answer:
      value: 1/9
    hints:
      - 1 divided by 3².
    explanation: One ninth. This is Newton’s **inverse-square law**.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: On Mars g = 3.7 m/s². Set the gravity and use a pendulum 1 m long. How long does one swing take?
    params:
      scene: pendulum
      controls:
        g:
          fixed: false
          value: 9.8
          min: 1.6
          max: 9.8
          step: 0.1
        mass:
          fixed: true
    answer:
      g: 3.7
      length: 1
    explanation: About 3.3 s instead of 2 s on Earth. With a pendulum you can measure the gravity of a planet.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "Newton found the **law of gravitation**: two masses attract with $F = G \\frac{m_1 m_2}{r^2}$. Double the mass means double the force. Double the distance means a quarter of the force."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: "A planet has {{m}} times Earth's mass and {{r}} times its radius. What is the gravitational acceleration g there? On Earth: 10 m/s²."
    params:
      unit: m/s²
    answer:
      value: "{{10 * m / (r * r)}}"
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 10 * m / r) < 0.01
        misconception: radius-not-squared
        text: The radius is squared in the denominator. Divide by {{r * r}}, not by {{r}}.
    hints:
      - More mass pulls harder; a larger radius puts you farther away.
      - g = 10 · mass factor ÷ radius factor².
    explanation: g = 10 · {{m}} ÷ {{r * r}} = {{10 * m / (r * r)}} m/s². Mass counts once, distance squared.
    difficulty: 2
    variants:
      params:
        m: choice[2,4,8,16]
        r: choice[2,4]
      defaults:
        m: 8
        r: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: The ISS flies 400 km up. Earth's radius is 6,400 km. What percentage of the ground-level gravity still acts there?
    params:
      unit: "%"
    answer:
      value: 89
      tolerance: 1.5
    feedback:
      - when: numval(state.input) < 5
        misconception: no-gravity-in-orbit
        text: Gravity has not vanished there! It is only a little weaker.
    hints:
      - "Distance from Earth's centre: 6,800 km instead of 6,400 km."
      - Work out (6400 ÷ 6800)².
    explanation: (6400/6800)² ≈ 0.89. Almost 90 % of gravity acts in the ISS. You float because you fall freely around Earth together with the station.
    difficulty: 2

  - kind: problem
    id: ph-d4
    depth: 2
    widget: sim
    prompt: The satellite starts horizontally at 1.5 Earth radii. It must not hit Earth – but fly as slowly as possible. At most 5.9 km/s.
    params:
      scene: orbit
      controls:
        radius:
          value: 1.5
          fixed: true
        speed:
          value: 4
    answer:
      kind: 0
      speed:
        - 5.75
        - 5.9
    explanation: Below circular speed the orbit becomes an ellipse that dips towards Earth. From about 5.8 km/s it just misses the surface.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: "Put the satellite on a **circular orbit**: set the speed so that the eccentricity is at most 0.03."
    params:
      scene: orbit
      controls:
        radius:
          value: 2
          fixed: true
        speed:
          value: 3
    answer:
      ecc:
        - 0
        - 0.03
    explanation: At 5.6 km/s. Too slow and it crashes, too fast and the orbit becomes an ellipse – or it escapes.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "On a circular orbit gravity provides the force towards the centre: $\\frac{GMm}{r^2} = \\frac{m v^2}{r}$. Inserting $v = \\frac{2\\pi r}{T}$ gives $T^2 = \\frac{4\\pi^2}{GM} r^3$ – **Kepler's third law**."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: By Kepler, T² ∝ r³. An asteroid orbits {{k}} times as far from the Sun as Earth. How many years does one orbit take?
    params:
      unit: years
    answer:
      value: "{{k * sqrt(k)}}"
    feedback:
      - when: numval(state.input) == k * k
        misconception: kepler-square
        text: That would be T ∝ r². Kepler says T² ∝ r³, so T ∝ r to the power 1.5.
      - when: numval(state.input) == k
        misconception: kepler-linear
        text: Farther out the path is longer **and** the speed is lower.
    hints:
      - T² = {{k}}³ = {{k * k * k}}.
      - Take the square root.
    explanation: "T = √({{k}}³) = {{k * sqrt(k)}} years. Earth is the yardstick: 1 distance, 1 year."
    difficulty: 3
    variants:
      params:
        k: choice[4,9,16]
      defaults:
        k: 4

  - kind: problem
    id: ph-x3
    depth: 3
    widget: estimate
    prompt: "Take a guess: how many minutes does the ISS (400 km up, 7.7 km/s) need for one lap around Earth?"
    params:
      min: 10
      max: 600
    answer:
      value: 92
      tolerance: 12
    explanation: Circumference 2π · 6,800 km ≈ 42,700 km, divided by 7.7 km/s ≈ 5,500 s ≈ 92 minutes. The crew sees 16 sunrises a day.
    difficulty: 3

  - kind: problem
    id: ph-x4
    depth: 3
    widget: teach
    prompt: "Explain to Lux: why do astronauts float in the ISS although almost full gravity acts there?"
    params:
      keywords:
        - - fall
          - fällt
          - falling
          - fallen
        - - gleich
          - same
          - zusammen
          - together
          - mit
          - station
        - - schnell
          - fast
          - seitwärts
          - sideways
          - vorbei
          - around
          - verfehl
          - miss
      sample: Station and astronauts fall towards Earth together. Because they fly sideways so fast, they keep missing Earth. Everything falls the same, so nothing presses on the floor.
    difficulty: 3

srs:
  cards_from: [mond, masse]
