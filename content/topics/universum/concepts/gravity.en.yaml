id: sci.space.gravity
type: concept
title: Heavier on Jupiter
summary: Mass stays, weight changes.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: on Earth you jump 50 cm high. How high would you get on the Moon?"
    params:
      min: 0
      max: 1000
      unit: cm
    answer:
      value: 300
      tolerance: 80
    explanation: About 3 metres. The Moon pulls only a sixth as hard.

  - kind: explain
    id: s1
    body: |
      Your **mass** is the same everywhere. Your **weight** depends on how strongly the celestial body pulls. On the Moon, it is about a sixth.

  - kind: problem
    id: mond
    widget: numeric
    prompt: A scale shows {{m}} kg on Earth. What would it show on the Moon?
    params: { unit: kg }
    answer: { value: "{{m / 6}}" }
    hints:
      - "{{m}} ÷ 6."
    explanation: "About {{m / 6}} kg. But the mass is still {{m}} kg."
    variants:
      params: { m: "choice[60,72,90,120,150]" }
      defaults: { m: 90 }

  - kind: problem
    id: masse
    widget: choice
    prompt: How much mass does the same person have on the Moon?
    params:
      options:
        - { label: Just as much as on Earth, correct: true }
        - { label: A sixth, feedback: "That is the weight. The mass doesn't change." }
    hints:
      - Do you lose atoms on the Moon?
    explanation: Mass is how much matter there is. That stays the same.

  - kind: problem
    id: planeten
    widget: match
    prompt: How strong is gravity compared to Earth?
    params:
      pairs:
        - { left: Moon, right: "about ⅙" }
        - { left: Mars, right: "about ⅓" }
        - { left: Earth, right: "1" }
        - { left: Jupiter, right: "about 2.5 times" }
    hints:
      - The bigger and heavier the body, the stronger the pull.
    explanation: Jupiter is huge. There you would weigh more than twice as much.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: On the Moon you weigh less, but your mass stays the same.
          right: true
        - text: There is no gravity in space.
          right: false
          why: The space station falls around the Earth constantly – gravity there is almost as strong as here.
        - text: The Sun’s gravity keeps the planets on their orbits.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Gravity falls with the square of the distance. You are three times as far from the Earth’s centre. To what fraction does your weight drop?
    answer:
      value: 1/9
    hints:
      - 1 divided by 3².
    explanation: One ninth. This is Newton’s **inverse-square law**.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: On Mars g = 3.7 m/s². Set the gravity and use a pendulum 1 m long. How long does one swing take?
    params:
      scene: pendulum
      controls:
        g:
          fixed: false
          value: 9.8
          min: 1.6
          max: 9.8
          step: 0.1
        mass:
          fixed: true
    answer:
      g: 3.7
      length: 1
    explanation: About 3.3 s instead of 2 s on Earth. With a pendulum you can measure the gravity of a planet.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: sim
    prompt: "Put the satellite on a **circular orbit**: set the speed so that the eccentricity is at most 0.03."
    params:
      scene: orbit
      controls:
        radius:
          value: 2
          fixed: true
        speed:
          value: 3
    answer:
      ecc:
        - 0
        - 0.03
    explanation: At 5.6 km/s. Too slow and it crashes, too fast and the orbit becomes an ellipse – or it escapes.
    difficulty: 3

srs:
  cards_from: [mond, masse]
