id: sci.space.seasons
type: concept
title: Why Summer Comes
summary: Earth's tilted axis.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: warum
    widget: choice
    prompt: Why is it warmer in summer where we live?
    params:
      options:
        - { label: "Earth's axis is tilted, so the Sun stands higher.", correct: true }
        - { label: Earth is closer to the Sun then., feedback: "In January, Earth is actually closest to the Sun." }
    hints:
      - At the same time, it is winter in the Southern Hemisphere.
    explanation: If closeness were the reason, both halves would have summer at once.

  - kind: explain
    id: s2
    body: |
      Earth's axis is tilted by about **23°**. In summer, our half leans toward the Sun. The Sun stands higher, its light hits more steeply, and the days are longer.

  - kind: problem
    id: sommer
    widget: numeric
    prompt: "At noon in summer: Sun height = 90° − latitude + 23°. How high is the Sun at {{b}}° north?"
    params: { unit: "°" }
    answer: { value: "{{113 - b}}" }
    hints:
      - "90 − {{b}} + 23."
    explanation: "{{113 - b}}° above the horizon."
    variants:
      params: { b: "int[47,55]" }
      defaults: { b: 52 }

  - kind: problem
    id: winter
    widget: numeric
    prompt: In winter, you subtract the 23° instead of adding it. By how many degrees is the Sun higher in summer than in winter?
    params: { unit: "°" }
    answer: { value: 46 }
    hints:
      - Once + 23, once − 23.
    explanation: 2 · 23 = 46°. That makes the difference between July and December.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: In summer the Earth is closer to the Sun.
          right: false
          why: In January it is actually closest to the Sun.
        - text: When it is summer here, it is winter in Australia.
          right: true
        - text: At the equator day and night are almost always equally long.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: At which latitude does the Sun stand exactly overhead at noon on 21 June?
    params:
      unit: ° N
    answer:
      value: 23
      tolerance: 0.5
    hints:
      - "Sun height 90° means: 90 − latitude + 23 = 90."
    explanation: At 23° north – the **Tropic of Cancer**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What if the Earth’s axis were **not tilted at all**?
    params:
      options:
        - label: There would be no seasons – day and night would be equal everywhere
          correct: true
        - label: The seasons would be stronger
          feedback: Without tilt the cause of the seasons vanishes.
        - label: It would be equally warm everywhere
          feedback: At the equator light would still strike more steeply than at the poles.
    hints:
      - The tilt is the only cause of the seasons.
    explanation: "Uranus lies almost on its side: there day and night at the poles last 42 years each."
    difficulty: 3

srs:
  cards_from: [warum, sommer]
