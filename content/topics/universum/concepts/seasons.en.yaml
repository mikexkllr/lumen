id: sci.space.seasons
type: concept
title: Why Summer Comes
summary: Earth's tilted axis.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Summer in December
    body: "Whether it is summer or winter depends on where you live. Flip the cards: what does the year look like in other places on **Earth**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏖️
            front: Australia
            back: Many people there celebrate Christmas on the beach – at 30 degrees.
          - icon: 🌞
            front: Northern Norway in June
            back: The Sun does not set for weeks – not even at midnight.
          - icon: 🌑
            front: Northern Norway in December
            back: For weeks the Sun does not rise at all. This is called the polar night.
          - icon: 🌴
            front: At the equator
            back: Day and night are almost exactly the same length all year.

  - kind: problem
    id: start-australien
    widget: choice
    prompt: It is December in Europe, and it is winter. What season is it in Australia then?
    params:
      options:
        - label: Summer
          correct: true
        - label: Winter as well
          feedback: Australia lies in the Southern Hemisphere. The seasons are swapped there.
        - label: There are no seasons there
          feedback: There are – just the other way round from Europe.
    hints:
      - "Think of the card from the intro: Christmas on the beach."
      - In the Southern Hemisphere it is summer when it is winter in the north.
    explanation: In Australia, December is midsummer. The Northern and Southern Hemispheres always have opposite seasons.

  - kind: problem
    id: start-mittag
    widget: choice
    prompt: When is the midday Sun higher in the sky?
    params:
      options:
        - label: In summer
          correct: true
        - label: In winter
          feedback: In winter the Sun stays low above the horizon. Shadows are long.
        - label: Always equally high
          feedback: "Watch your shadow: at midday in winter it is much longer."
    hints:
      - When is your shadow shorter at midday?
      - A short shadow means the Sun is high.
    explanation: In summer the midday Sun is high, in winter it is low. That is exactly what makes the difference between warm and cold.

  - kind: problem
    id: warum
    widget: choice
    prompt: Why is it warmer in summer where we live?
    params:
      options:
        - { label: "Earth's axis is tilted, so the Sun stands higher.", correct: true }
        - { label: Earth is closer to the Sun then., feedback: "In January, Earth is actually closest to the Sun." }
    hints:
      - At the same time, it is winter in the Southern Hemisphere.
    explanation: If closeness were the reason, both halves would have summer at once.

  - kind: explain
    id: s2
    body: |
      Earth's **axis** is tilted by about **23°**. In summer, our half leans toward the Sun. The Sun stands higher, its light hits more steeply, and the days are longer.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: In summer the Earth is closer to the Sun.
          right: false
          why: In January it is actually closest to the Sun.
        - text: When it is summer here, it is winter in Australia.
          right: true
        - text: At the equator day and night are almost always equally long.
          right: true

  - kind: explain
    id: start-breite
    body: The **latitude** tells you how far a place is from the equator. At the equator it is 0°, at the North Pole 90°. Berlin lies at about 52° north.

  - kind: problem
    id: sommer
    widget: numeric
    prompt: "At noon in summer: Sun height = 90° − latitude + 23°. How high is the Sun at {{b}}° north?"
    params: { unit: "°" }
    answer: { value: "{{113 - b}}" }
    hints:
      - "90 − {{b}} + 23."
    explanation: "{{113 - b}}° above the horizon."
    variants:
      params: { b: "int[47,55]" }
      defaults: { b: 52 }

  - kind: problem
    id: winter
    widget: numeric
    prompt: In winter, you subtract the 23° instead of adding it. By how many degrees is the Sun higher in summer than in winter?
    params: { unit: "°" }
    answer: { value: 46 }
    hints:
      - Once + 23, once − 23.
    explanation: 2 · 23 = 46°. That makes the difference between July and December.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: The curve shows how high the noon Sun stands over the year (0 = January, 12 = December). Drag the latitude until the June peak hits the point.
    params:
      expr: 90 - b + 23*sin(2*pi*(x - 2.7)/12)
      x:
        - 0
        - 12
      y:
        - 0
        - 90
      showCoordinates: false
      sliders:
        - id: b
          label: Latitude (° north)
          min: 0
          max: 70
          step: 5
          initial: 20
      markers:
        - x: 5.7
          y: 63
          label: 63°
    answer:
      values:
        b: 50
    hints:
      - "On 21 June the Sun stands highest: 90° − latitude + 23°."
      - Work out 113° − 63°.
    explanation: At 50° north, around Frankfurt, the June Sun stands 63° high at noon. In December it is only 17°.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: At which latitude does the Sun stand exactly overhead at noon on 21 June?
    params:
      unit: ° N
    answer:
      value: 23
      tolerance: 0.5
    hints:
      - "Sun height 90° means: 90 − latitude + 23 = 90."
    explanation: At 23° north – the **Tropic of Cancer**.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Is Earth closer to the Sun in July than in January?
    params:
      options:
        - label: No – it is closest in early January.
          correct: true
        - label: Yes, that is why we have summer.
          feedback: Then the southern hemisphere would have summer at the same time. But it has winter.
        - label: The distance is always exactly the same.
          feedback: The orbit is a slight ellipse. The distance varies by about 3 %.
    hints:
      - When is it summer in Australia?
      - The distance varies only a little – and at the wrong time.
    explanation: Earth is closest to the Sun in January and farthest in July. Seasons come from the tilted axis, not from distance.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: When the Sun is low, a beam of light spreads over a larger area. At 30° elevation the area doubles. Each square metre then gets only half as much **radiation**.

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: In Berlin the midday Sun is 61° high in summer and 14° in winter. Radiation per m² is proportional to sin(elevation). sin 61° ≈ 0.87 and sin 14° ≈ 0.24. How many times more is it in summer?
    answer:
      value: 3.6
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 4.4) < 0.1
        misconception: angle-ratio
        text: That is the ratio of the angles. What counts is the ratio of the sine values.
    hints:
      - Divide the two sine values.
      - 0.87 ÷ 0.24 = ?
    explanation: 0.87 ÷ 0.24 ≈ 3.6. On top come the longer days. Together a summer day delivers many times the energy.
    difficulty: 2

  - kind: problem
    id: ph-d4
    depth: 2
    widget: numeric
    prompt: "At the Arctic Circle (66.5° north): how high is the Sun at noon on 21 December? Use an axial tilt of 23.5°."
    params:
      unit: °
    answer:
      value: 0
      tolerance: 0.5
    hints:
      - "In winter: 90° − latitude − 23.5°."
      - 90 − 66.5 − 23.5 = ?
    explanation: "Exactly 0°: at noon the Sun just grazes the horizon. Farther north it does not rise at all – polar night."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What if the Earth’s axis were **not tilted at all**?
    params:
      options:
        - label: There would be no seasons – day and night would be equal everywhere
          correct: true
        - label: The seasons would be stronger
          feedback: Without tilt the cause of the seasons vanishes.
        - label: It would be equally warm everywhere
          feedback: At the equator light would still strike more steeply than at the poles.
    hints:
      - The tilt is the only cause of the seasons.
    explanation: "Uranus lies almost on its side: there day and night at the poles last 42 years each."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: The Sun is highest on 21 June. Why is July usually warmer anyway?
    params:
      options:
        - label: Oceans and ground store heat and warm up with a delay.
          correct: true
        - label: Earth is closer to the Sun in July.
          feedback: In July it is at its farthest.
        - label: The Sun shines more strongly in July.
          feedback: Its output barely changes.
    hints:
      - "Think of a pot on the stove: when is it hottest?"
      - Heat has to build up first.
    explanation: As long as more energy arrives by day than leaves at night, it keeps warming – even after 21 June. The ocean adds to the delay.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Earth's axis wobbles like a spinning top, once in about 26,000 years. What follows?
    params:
      options:
        - label: Polaris will not stay the pole star forever.
          correct: true
        - label: The tilt jumps between 0° and 90°.
          feedback: The tilt only varies a little, between about 22° and 24.5°.
        - label: Earth will soon spin the other way.
          feedback: The direction of spin stays. Only the axis points elsewhere.
    hints:
      - The axis points at a spot in the sky.
      - If the axis moves, that spot moves.
    explanation: The axis traces a cone. In about 12,000 years it will point near Vega. This precession also slowly shifts when summer and closest approach coincide.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why there are seasons – and why the distance to the Sun is not the cause.
    params:
      keywords:
        - - achse
          - axis
          - geneigt
          - tilt
          - schief
          - neig
        - - steil
          - steep
          - höhe
          - high
          - flach
          - low
          - winkel
          - angle
        - - tag
          - day
          - länger
          - longer
          - abstand
          - distance
          - südhalbkugel
          - southern
      sample: "Earth's axis is tilted. In summer our half leans towards the Sun: it stands higher, light hits more steeply and days are longer. It cannot be distance, or the southern hemisphere would have summer at the same time."
    difficulty: 3

srs:
  cards_from: [warum, sommer]
