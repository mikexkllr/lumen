id: sci.space.sizes
type: concept
title: Vom Atom zur Galaxie
summary: Größen in Zehnerpotenzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Leiter der Zehner
    body: "Vom Atom bis zur Milchstraße passt alles auf eine Leiter. Jede Stufe ist **zehnmal größer** als die davor. Zieh den Punkt: Wie viele Stufen liegen zwischen dir und der Erde?"
    visual:
      widget: numberline
      interactive: true
      params:
        min: -10
        max: 21
        ticks: 1
        labels: integers
        initial: 0
        markers:
          - value: -10
            label: Atom
          - value: 0
            label: Mensch
          - value: 7
            label: Erde
          - value: 21
            label: Milchstraße

  - kind: problem
    id: start-groesser
    widget: choice
    prompt: Was ist am größten?
    params:
      options:
        - label: Die Sonne
          correct: true
        - label: Die Erde
          feedback: Die Erde ist riesig. In die Sonne würde sie aber über eine Million Mal passen.
        - label: Der Mond
          feedback: Der Mond ist sogar kleiner als die Erde.
    hints:
      - Welcher der drei spendet uns Licht und Wärme?
      - Die Sonne sieht nur klein aus, weil sie so weit weg ist.
    explanation: Die Sonne ist der größte der drei. Am Himmel wirkt sie nur klein, weil sie 150 Millionen km entfernt ist.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne vom Kleinsten zum Größten.
    params:
      startLabel: klein
      endLabel: groß
      items:
        - { label: Atom }
        - { label: Bakterie }
        - { label: Ameise }
        - { label: Mensch }
        - { label: Mount Everest }
        - { label: Erde }
        - { label: Sonne }
        - { label: Milchstraße }
    hints:
      - Eine Bakterie ist viel größer als ein Atom, aber viel kleiner als eine Ameise.
      - Ganz am Ende stehen Erde, Sonne und Milchstraße – in dieser Reihenfolge.
    explanation: Zwischen Atom und Milchstraße liegen rund 31 Zehnerpotenzen.

  - kind: problem
    id: start-stufe
    widget: numeric
    prompt: Welche Länge kommt als Nächstes?
    body: "Auf der Leiter ist jede Stufe zehnmal größer: 1 m, 10 m, 100 m …"
    params:
      unit: m
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 200
        misconception: additive-step
        text: Es kommt nicht 100 dazu. Jede Stufe ist **zehnmal** so groß wie die davor.
    hints:
      - "Von 1 zu 10 und von 10 zu 100: Was passiert jedes Mal?"
      - Rechne 100 · 10. Es kommt einfach eine Null dazu.
    explanation: 100 · 10 = 1000. Jede Stufe hängt eine Null an.

  - kind: explain
    id: s2
    body: "So große Zahlen schreibt man kurz als **Zehnerpotenzen**. Die kleine Zahl oben zählt die Nullen: $10^3$ ist 1000. Die Erde ist etwa $10^7$ m breit. Ein Mensch steht auf Stufe 0, denn $10^0$ m ist 1 m."

  - kind: problem
    id: start-nullen
    widget: numeric
    prompt: Wie viele Nullen hat $10^6$, wenn du die Zahl ausschreibst?
    params:
      unit: Nullen
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 1000000
        misconception: wrote-number
        text: Das ist die ausgeschriebene Zahl. Gefragt ist, wie viele Nullen sie hat.
      - when: numval(state.input) == 60
        misconception: exponent-as-factor
        text: Nicht 6 · 10 rechnen. Die kleine 6 zählt die Nullen.
    hints:
      - Die kleine Zahl oben zählt die Nullen.
      - $10^3$ ist 1000 und hat drei Nullen. Und $10^6$?
    explanation: $10^6$ ist 1 000 000 – eine Million, also eine 1 mit sechs Nullen.

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: Die Sonne ist etwa 1 000 000 000 m breit. Markiere auf der Leiter, auf welcher Stufe sie steht.
    params:
      min: -10
      max: 21
      ticks: 1
      labels: integers
      markers:
        - value: 0
          label: Mensch
        - value: 7
          label: Erde
    answer:
      value: 9
    hints:
      - Jede Stufe hängt eine Null an. Der Mensch mit 1 m steht auf Stufe 0.
      - Zähle die Nullen hinter der 1.
    explanation: Neun Nullen heißen $10^9$ m – zwei Stufen über der Erde. Die Sonne ist also rund hundertmal so breit wie die Erde.

  - kind: problem
    id: c1
    widget: match
    prompt: Welche Größenordnung passt?
    params:
      pairs:
        - left: Atom
          right: $10^{-10}$ m
        - left: Mensch
          right: $10^{0}$ m
        - left: Erde
          right: $10^{7}$ m
        - left: Sonne
          right: $10^{9}$ m
        - left: Milchstraße
          right: $10^{21}$ m
    hints:
      - Ordne erst vom Kleinsten zum Größten.
      - "Die kleinste Hochzahl gehört zum kleinsten Ding. Ein Minus heißt: kleiner als 1 m."
    explanation: Zwischen Atom und Galaxie liegen 31 Zehnerpotenzen.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Sterne hat die Milchstraße?"
    params:
      min: 1000000
      max: 1000000000000000
      scale: log
    answer:
      value: 100000000000
      within: 90
    explanation: Rund 100 Milliarden – und es gibt etwa ebenso viele Galaxien.

  - kind: problem
    id: sterne
    widget: numeric
    prompt: Die Milchstraße hat etwa 100 Milliarden Sterne. Das ist 10 hoch …?
    params: { prefix: "10^" }
    answer: { value: 11 }
    feedback:
      - when: "numval(state.input) == 9"
        misconception: billion
        text: Eine Milliarde ist $10^9$. Hundert Milliarden sind zwei Stufen mehr.
    hints:
      - Eine Milliarde hat 9 Nullen.
      - Hundert hat zwei Nullen. Zähl sie zu den 9 dazu.
    explanation: 100 · $10^9$ = $10^{11}$.

  - kind: problem
    id: erden
    depth: 2
    widget: numeric
    prompt: Die Sonne ist etwa 1 400 000 km breit, die Erde etwa 12 700 km. Wie viele Erden passen nebeneinander hinein?
    params: { unit: Erden }
    answer: { value: 110, tolerance: 5 }
    hints:
      - 1 400 000 geteilt durch 12 700.
    explanation: Gut 100 Erden nebeneinander – und über eine Million passen ins Innere.
    difficulty: 2

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Atom ist etwa $10^{-10}$ m groß, ein Mensch $10^{0}$ m, die Milchstraße $10^{21}$ m. Der Mensch ist wievielmal größer als ein Atom? Gib den Exponenten an: 10 hoch …"
    answer:
      value: 10
    hints:
      - "Zieh die Exponenten voneinander ab: 0 − (−10)."
    explanation: 10¹⁰ – zehn Milliarden Mal. Wir stehen größenmäßig näher am Atom als an der Galaxie.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Erden passen nebeneinander in die Lücke zwischen Erde und Mond?"
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 30
      within: 30
    explanation: Etwa 30. Der Mond ist 384 000 km entfernt, die Erde 12 700 km breit. Bilder in Büchern zeigen den Mond fast immer viel zu nah.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: Für Schätzungen reicht oft die **Größenordnung**. Man rundet auf eine Ziffer mal eine Zehnerpotenz. Aus 384 000 km wird 4 · 10⁵ km. Damit kann man im Kopf rechnen.

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: 10 hoch {{a}} mal 10 hoch {{b}} ergibt 10 hoch …?
    answer:
      value: "{{a + b}}"
    feedback:
      - when: numval(state.input) == a * b
        misconception: exp-multiply
        text: Du hast die Exponenten multipliziert. Beim Malnehmen werden sie **addiert**.
    hints:
      - "Schreib es aus: 10³ · 10² = 1000 · 100."
      - Zähl die Nullen beider Zahlen zusammen.
    explanation: "{{a}} Nullen und {{b}} Nullen ergeben {{a + b}} Nullen. Darum gilt: Exponenten addieren."
    difficulty: 2
    variants:
      params:
        a: int[2,9]
        b: int[2,9]
      constraints:
        - a * b != a + b
      defaults:
        a: 6
        b: 3

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die Sonne hat 110-mal den Durchmesser der Erde. Wie viele Erden passen ungefähr in ihr **Volumen**? In Millionen, gerundet auf eine Stelle.
    answer:
      value: 1.3
      tolerance: 0.1
    hints:
      - "Volumen wächst mit der dritten Potenz: 110³."
    explanation: 110³ ≈ 1,3 Millionen.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: estimate
    prompt: "Fermi-Frage: Wie viele Atome stecken in deinem Körper? Tipp: Du bist vor allem Wasser."
    params:
      min: 1000000000000000
      max: 1e+40
      scale: log
    answer:
      value: 7e+27
      within: 80
    explanation: 70 kg Wasser sind etwa 3900 mol Moleküle. Jedes hat 3 Atome, ein Mol hat 6 · 10²³ Teilchen. Das ergibt rund 7 · 10²⁷ Atome.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Ein Proton misst etwa 10⁻¹⁵ m, das sichtbare Universum etwa 10²⁷ m. Wie viele Zehnerstufen liegen dazwischen?
    answer:
      value: 42
      tolerance: 1
    feedback:
      - when: numval(state.input) == 12
        misconception: neg-exponent
        text: "Das Minus zählt mit: Von −15 bis 0 sind es schon 15 Stufen."
    hints:
      - Wie viele Stufen von 10⁻¹⁵ bis 10⁰?
      - Dann noch von 10⁰ bis 10²⁷ dazuzählen.
    explanation: 15 + 27 = 42 Zehnerstufen. Ein Mensch liegt mit 10⁰ m ungefähr in der Mitte – rechnerisch.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man Größen im Universum mit Zehnerpotenzen schreibt.
    params:
      keywords:
        - - zehn
          - ten
          - potenz
          - power
          - exponent
          - "null"
          - zero
        - - groß
          - klein
          - large
          - small
          - huge
          - tiny
          - riesig
          - winzig
        - - vergleich
          - compare
          - stufe
          - step
          - faktor
          - factor
          - kopf
          - head
      sample: Die Größen reichen von winzig bis riesig. Mit Zehnerpotenzen zählt man nur die Stufen, jede ist zehnmal größer. So kann man vergleichen und im Kopf rechnen.
    difficulty: 3

srs:
  cards_from: [ordnen, sterne]
