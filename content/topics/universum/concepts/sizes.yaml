id: sci.space.sizes
type: concept
title: Vom Atom zur Galaxie
summary: Größen in Zehnerpotenzen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Sterne hat die Milchstraße?"
    params:
      min: 1000000
      max: 1000000000000000
      scale: log
    answer:
      value: 100000000000
      within: 90
    explanation: Rund 100 Milliarden – und es gibt etwa ebenso viele Galaxien.


  - kind: problem
    id: ordnen
    widget: order
    prompt: Ordne vom Kleinsten zum Größten.
    params:
      startLabel: klein
      endLabel: groß
      items:
        - { label: Atom }
        - { label: Bakterie }
        - { label: Ameise }
        - { label: Mensch }
        - { label: Mount Everest }
        - { label: Erde }
        - { label: Sonne }
        - { label: Milchstraße }
    hints:
      - Eine Bakterie ist viel größer als ein Atom, aber viel kleiner als eine Ameise.
    explanation: Zwischen Atom und Milchstraße liegen rund 31 Zehnerpotenzen.

  - kind: explain
    id: s2
    body: |
      So große Unterschiede schreibt man mit **Zehnerpotenzen**. Ein Mensch ist etwa $10^0$ m groß, die Erde $10^7$ m.
      Jede Stufe ist zehnmal größer.

  - kind: problem
    id: erden
    widget: numeric
    prompt: Die Sonne ist etwa 1 400 000 km breit, die Erde etwa 12 700 km. Wie viele Erden passen nebeneinander hinein?
    params: { unit: Erden }
    answer: { value: 110, tolerance: 5 }
    hints:
      - 1 400 000 geteilt durch 12 700.
    explanation: Gut 100 Erden nebeneinander – und über eine Million passen ins Innere.

  - kind: problem
    id: sterne
    widget: numeric
    prompt: Die Milchstraße hat etwa 100 Milliarden Sterne. Das ist 10 hoch …?
    params: { prefix: "10^" }
    answer: { value: 11 }
    feedback:
      - when: "numval(state.input) == 9"
        misconception: billion
        text: Eine Milliarde ist $10^9$. Hundert Milliarden sind zwei Stufen mehr.
    hints:
      - Eine Milliarde hat 9 Nullen.
    explanation: 100 · $10^9$ = $10^{11}$.

  - kind: problem
    id: c1
    widget: match
    prompt: Welche Größenordnung passt?
    params:
      pairs:
        - left: Atom
          right: $10^{-10}$ m
        - left: Mensch
          right: $10^{0}$ m
        - left: Erde
          right: $10^{7}$ m
        - left: Sonne
          right: $10^{9}$ m
        - left: Milchstraße
          right: $10^{21}$ m
    hints:
      - Ordne erst vom Kleinsten zum Größten.
    explanation: Zwischen Atom und Galaxie liegen 31 Zehnerpotenzen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Ein Atom ist etwa $10^{-10}$ m groß, ein Mensch $10^{0}$ m, die Milchstraße $10^{21}$ m. Der Mensch ist wievielmal größer als ein Atom? Gib den Exponenten an: 10 hoch …"
    answer:
      value: 10
    hints:
      - "Zieh die Exponenten voneinander ab: 0 − (−10)."
    explanation: 10¹⁰ – zehn Milliarden Mal. Wir stehen größenmäßig näher am Atom als an der Galaxie.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Die Sonne hat 110-mal den Durchmesser der Erde. Wie viele Erden passen ungefähr in ihr **Volumen**? In Millionen, gerundet auf eine Stelle.
    answer:
      value: 1.3
      tolerance: 0.1
    hints:
      - "Volumen wächst mit der dritten Potenz: 110³."
    explanation: 110³ ≈ 1,3 Millionen.
    difficulty: 3

srs:
  cards_from: [ordnen, sterne]
