id: sci.space.model
type: concept
title: Das Sonnensystem im Maßstab
summary: Wenn die Erde eine Murmel wäre.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: sonne-gross
    widget: numeric
    body: Stell dir die Erde als Murmel mit 1 cm Durchmesser vor. Die Sonne ist 109-mal so breit.
    prompt: Wie breit ist die Sonne im Modell? In Metern.
    params: { unit: m }
    answer: { value: 1.09, tolerance: 0.05 }
    feedback:
      - when: "numval(state.input) == 109"
        misconception: units
        text: 109 cm stimmt – gefragt sind Meter.
    hints:
      - 109 cm sind wie viele Meter?
    explanation: 109 cm – eine Kugel so groß wie ein Gymnastikball.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: Im echten Leben ist die Sonne 11 700 Erddurchmesser entfernt. Wie weit weg liegt sie im Modell? In Metern.
    params: { unit: m }
    answer: { value: 117, tolerance: 2 }
    hints:
      - Jeder Erddurchmesser ist 1 cm.
    explanation: 11 700 cm = 117 m – über ein Fußballfeld entfernt.

  - kind: explain
    id: s3
    body: Im Modell ist die Sonne ein großer Ball. Die Erde ist eine **Murmel** 117 m daneben. Der Rest ist fast nur leerer Raum.

  - kind: problem
    id: neptun
    widget: choice
    prompt: Neptun ist 30-mal so weit von der Sonne entfernt wie die Erde. Wie weit im Murmel-Modell?
    params:
      options:
        - { label: "Etwa 3,5 km", correct: true }
        - { label: Etwa 350 m, feedback: "Zu kurz – 30 · 117 m ist mehr." }
        - { label: Etwa 30 m, feedback: "Die Erde liegt schon 117 m weit weg." }
    hints:
      - 30 · 117 m.
    explanation: 30 · 117 m ≈ 3,5 km. Der nächste Stern läge im Modell bei Japan.

  - kind: explain
    id: s5
    body: Warum sieht man das Sonnensystem nie maßstabsgetreu in Büchern?
    reveal:
      body: Weil es nicht auf eine Seite passt. Malt man die Planeten sichtbar groß, müssten die Abstände kilometerlang sein.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Im Murmel-Modell (Erde = 1 cm) liegt die Sonne 117 m entfernt. Der nächste Stern ist 270 000-mal so weit weg. Wie viele Kilometer wären das im Modell?
    params:
      unit: km
    answer:
      value: 31600
      tolerance: 600
    hints:
      - 117 m · 270 000, dann durch 1000.
    explanation: Rund 31 600 km – fast einmal um die Erde. Der Raum zwischen den Sternen ist leer.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Im Murmel-Modell ist die Erde 1 cm breit. Der Mond ist 30 Erddurchmesser entfernt. Wie viele Zentimeter liegen im Modell zwischen Erde und Mond?
    params:
      unit: cm
    answer:
      value: 30
    hints:
      - Ein Erddurchmesser ist im Modell 1 cm.
      - Mal 30 nehmen.
    explanation: 30 cm – ein Lineal lang. Der Mond selbst wäre ein Krümel von knapp 3 mm. Bis zur Sonne sind es dann 117 m.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Fermi-Frage: Du fährst mit dem Auto (100 km/h) ohne Pause zur Sonne, 150 Millionen km. Wie viele Jahre dauert das?"
    params:
      min: 1
      max: 10000
      scale: log
    answer:
      value: 171
      within: 30
    explanation: "150 000 000 km : 100 km/h = 1,5 Millionen Stunden. Das sind rund 171 Jahre. Licht schafft es in 8 Minuten."
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: order
    prompt: Ordne die Planeten nach ihrem Abstand zur Sonne – den nächsten zuerst.
    params:
      items:
        - label: Merkur
        - label: Venus
        - label: Erde
        - label: Mars
        - label: Jupiter
        - label: Saturn
        - label: Uranus
        - label: Neptun
    hints:
      - Die vier Gesteinsplaneten liegen innen.
      - "Außen folgen die Riesen: erst die zwei größten."
    explanation: Innen die Gesteinsplaneten Merkur, Venus, Erde, Mars. Dann die Gasriesen Jupiter und Saturn, außen die Eisriesen Uranus und Neptun.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie maß man zum ersten Mal die Entfernung zu einem Stern?
    params:
      options:
        - label: "Mit der Parallaxe: Der Stern scheint sich übers Jahr leicht zu verschieben"
          correct: true
        - label: Mit Radar
          feedback: Ein Echo bräuchte Jahre und wäre viel zu schwach.
        - label: Aus der Helligkeit allein
          feedback: Man weiß nicht, wie hell der Stern wirklich ist.
    hints:
      - Halt den Daumen vor die Nase und schließ abwechselnd ein Auge.
    explanation: Aus dem Winkel und dem Durchmesser der Erdbahn folgt die Entfernung – reine Trigonometrie.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Licht braucht von der Sonne zur Erde 8,3 Minuten. Neptun ist 30-mal so weit weg. Wie viele Stunden braucht Licht bis zum Neptun?
    params:
      unit: h
    answer:
      value: 4.15
      tolerance: 0.1
    hints:
      - "Erst die Minuten: 8,3 · 30."
      - Dann durch 60 teilen.
    explanation: 8,3 · 30 = 249 Minuten, also gut 4 Stunden. Funksignale zu Sonden am Rand des Sonnensystems sind fast einen Tag unterwegs.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: In einigen Milliarden Jahren stoßen Milchstraße und Andromeda zusammen. Wie oft prallen dabei zwei Sterne direkt aufeinander?
    params:
      options:
        - label: Fast nie – zwischen den Sternen ist riesig viel Platz.
          correct: true
        - label: Ständig – Milliarden Sterne krachen zusammen.
          feedback: Im Murmel-Modell liegen Sterne Tausende Kilometer auseinander.
        - label: Genau einmal pro Stern.
          feedback: Dafür gibt es keinen Grund. Die Abstände sind gewaltig.
    hints:
      - "Denk an das Murmel-Modell: Wie weit wäre der nächste Stern?"
      - Gut 30 000 km – bei Sternen so groß wie Bälle.
    explanation: Sterne sind winzig im Vergleich zu ihren Abständen. Die Galaxien durchdringen sich, ihre Form ändert sich – aber Sterne treffen sich so gut wie nie.
    difficulty: 3

srs:
  cards_from: [abstand, neptun]
