id: sci.space.model
type: concept
title: Das Sonnensystem im Maßstab
summary: Wenn die Erde eine Murmel wäre.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sonne-gross
    widget: numeric
    body: Stell dir die Erde als Murmel mit 1 cm Durchmesser vor. Die Sonne ist 109-mal so breit.
    prompt: Wie breit ist die Sonne im Modell? In Metern.
    params: { unit: m }
    answer: { value: 1.09, tolerance: 0.05 }
    feedback:
      - when: "numval(state.input) == 109"
        misconception: units
        text: 109 cm stimmt – gefragt sind Meter.
    hints:
      - 109 cm sind wie viele Meter?
    explanation: 109 cm – eine Kugel so groß wie ein Gymnastikball.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: Im echten Leben ist die Sonne 11 700 Erddurchmesser entfernt. Wie weit weg liegt sie im Modell? In Metern.
    params: { unit: m }
    answer: { value: 117, tolerance: 2 }
    hints:
      - Jeder Erddurchmesser ist 1 cm.
    explanation: 11 700 cm = 117 m – über ein Fußballfeld entfernt.

  - kind: explain
    id: s3
    body: Im Modell ist die Sonne ein großer Ball. Die Erde ist eine Murmel 117 m daneben. Der Rest ist fast nur leerer Raum.

  - kind: problem
    id: neptun
    widget: choice
    prompt: Neptun ist 30-mal so weit von der Sonne entfernt wie die Erde. Wie weit im Murmel-Modell?
    params:
      options:
        - { label: "Etwa 3,5 km", correct: true }
        - { label: Etwa 350 m, feedback: "Zu kurz – 30 · 117 m ist mehr." }
        - { label: Etwa 30 m, feedback: "Die Erde liegt schon 117 m weit weg." }
    hints:
      - 30 · 117 m.
    explanation: 30 · 117 m ≈ 3,5 km. Der nächste Stern läge im Modell bei Japan.

  - kind: explain
    id: s5
    body: Warum sieht man das Sonnensystem nie maßstabsgetreu in Büchern?
    reveal:
      body: Weil es nicht auf eine Seite passt. Malt man die Planeten sichtbar groß, müssten die Abstände kilometerlang sein.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Im Murmel-Modell (Erde = 1 cm) liegt die Sonne 117 m entfernt. Der nächste Stern ist 270 000-mal so weit weg. Wie viele Kilometer wären das im Modell?
    params:
      unit: km
    answer:
      value: 31600
      tolerance: 600
    hints:
      - 117 m · 270 000, dann durch 1000.
    explanation: Rund 31 600 km – fast einmal um die Erde. Der Raum zwischen den Sternen ist leer.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie maß man zum ersten Mal die Entfernung zu einem Stern?
    params:
      options:
        - label: "Mit der Parallaxe: Der Stern scheint sich übers Jahr leicht zu verschieben"
          correct: true
        - label: Mit Radar
          feedback: Ein Echo bräuchte Jahre und wäre viel zu schwach.
        - label: Aus der Helligkeit allein
          feedback: Man weiß nicht, wie hell der Stern wirklich ist.
    hints:
      - Halt den Daumen vor die Nase und schließ abwechselnd ein Auge.
    explanation: Aus dem Winkel und dem Durchmesser der Erdbahn folgt die Entfernung – reine Trigonometrie.
    difficulty: 3

srs:
  cards_from: [abstand, neptun]
