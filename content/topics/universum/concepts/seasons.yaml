id: sci.space.seasons
type: concept
title: Warum es Sommer wird
summary: Die schiefe Erdachse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: warum
    widget: choice
    prompt: Warum ist es bei uns im Sommer wärmer?
    params:
      options:
        - { label: Die Erdachse ist geneigt – die Sonne steht höher., correct: true }
        - { label: Die Erde ist dann näher an der Sonne., feedback: "Im Januar ist die Erde sogar am nächsten an der Sonne." }
    hints:
      - Auf der Südhalbkugel ist gleichzeitig Winter.
    explanation: Wäre die Nähe der Grund, hätten beide Hälften gleichzeitig Sommer.

  - kind: explain
    body: |
      Die Erdachse ist um etwa **23°** geneigt. Im Sommer neigt sich unsere Hälfte zur Sonne. Sie steht höher, ihr Licht trifft steiler auf und die Tage sind länger.

  - kind: problem
    id: sommer
    widget: numeric
    prompt: "Mittags im Sommer gilt: Sonnenhöhe = 90° − Breitengrad + 23°. Wie hoch steht die Sonne bei {{b}}° Nord?"
    params: { unit: "°" }
    answer: { value: "{{113 - b}}" }
    hints:
      - "90 − {{b}} + 23."
    explanation: "{{113 - b}}° über dem Horizont."
    variants:
      params: { b: "int[47,55]" }
      defaults: { b: 52 }

  - kind: problem
    id: winter
    widget: numeric
    prompt: Im Winter zieht man die 23° ab statt sie zu addieren. Um wie viel Grad steht die Sonne im Sommer höher als im Winter?
    params: { unit: "°" }
    answer: { value: 46 }
    hints:
      - Einmal + 23, einmal − 23.
    explanation: 2 · 23 = 46°. Das macht den Unterschied zwischen Juli und Dezember.

srs:
  cards_from: [warum, sommer]
