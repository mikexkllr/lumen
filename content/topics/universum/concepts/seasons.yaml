id: sci.space.seasons
type: concept
title: Warum es Sommer wird
summary: Die schiefe Erdachse.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Sommer im Dezember
    body: "Ob Sommer oder Winter, hängt davon ab, wo du lebst. Deck die Karten auf: Wie sieht das Jahr an anderen Orten der **Erde** aus?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🏖️
            front: Australien
            back: Dort feiern viele Weihnachten am Strand – bei 30 Grad.
          - icon: 🌞
            front: Nordnorwegen im Juni
            back: Die Sonne geht wochenlang nicht unter – auch nicht um Mitternacht.
          - icon: 🌑
            front: Nordnorwegen im Dezember
            back: Wochenlang geht die Sonne gar nicht auf. Das heißt Polarnacht.
          - icon: 🌴
            front: Am Äquator
            back: Tag und Nacht sind das ganze Jahr fast genau gleich lang.

  - kind: problem
    id: start-australien
    widget: choice
    prompt: In Europa ist Dezember, und es ist Winter. Welche Jahreszeit ist dann in Australien?
    params:
      options:
        - label: Sommer
          correct: true
        - label: Auch Winter
          feedback: Australien liegt auf der Südhalbkugel. Dort sind die Jahreszeiten vertauscht.
        - label: Dort gibt es keine Jahreszeiten
          feedback: Doch – nur genau andersherum als in Europa.
    hints:
      - "Denk an die Karte aus der Einleitung: Weihnachten am Strand."
      - Auf der Südhalbkugel ist Sommer, wenn im Norden Winter ist.
    explanation: In Australien ist im Dezember Hochsommer. Die Nordhalbkugel und die Südhalbkugel haben immer entgegengesetzte Jahreszeiten.

  - kind: problem
    id: start-mittag
    widget: choice
    prompt: Wann steht die Sonne mittags höher am Himmel?
    params:
      options:
        - label: Im Sommer
          correct: true
        - label: Im Winter
          feedback: Im Winter bleibt die Sonne flach über dem Horizont. Die Schatten sind lang.
        - label: Immer gleich hoch
          feedback: "Achte mal auf deinen Schatten: Im Winter ist er mittags viel länger."
    hints:
      - Wann ist dein Schatten mittags kürzer?
      - "Ein kurzer Schatten heißt: Die Sonne steht hoch."
    explanation: Im Sommer steht die Sonne mittags hoch, im Winter flach. Genau das macht den Unterschied zwischen warm und kalt.

  - kind: problem
    id: warum
    widget: choice
    prompt: Warum ist es bei uns im Sommer wärmer?
    params:
      options:
        - { label: Die Erdachse ist geneigt – die Sonne steht höher., correct: true }
        - { label: Die Erde ist dann näher an der Sonne., feedback: "Im Januar ist die Erde sogar am nächsten an der Sonne." }
    hints:
      - Auf der Südhalbkugel ist gleichzeitig Winter.
    explanation: Wäre die Nähe der Grund, hätten beide Hälften gleichzeitig Sommer.

  - kind: explain
    id: s2
    body: |
      Die **Erdachse** ist um etwa **23°** geneigt. Im Sommer neigt sich unsere Hälfte zur Sonne. Sie steht höher, ihr Licht trifft steiler auf und die Tage sind länger.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Im Sommer ist die Erde der Sonne näher.
          right: false
          why: Im Januar ist sie der Sonne sogar am nächsten.
        - text: Wenn bei uns Sommer ist, ist in Australien Winter.
          right: true
        - text: Am Äquator sind Tag und Nacht fast immer gleich lang.
          right: true

  - kind: explain
    id: start-breite
    body: Der **Breitengrad** sagt, wie weit ein Ort vom Äquator entfernt ist. Am Äquator sind es 0°, am Nordpol 90°. Berlin liegt bei etwa 52° Nord.

  - kind: problem
    id: sommer
    widget: numeric
    prompt: "Mittags im Sommer gilt: Sonnenhöhe = 90° − Breitengrad + 23°. Wie hoch steht die Sonne bei {{b}}° Nord?"
    params: { unit: "°" }
    answer: { value: "{{113 - b}}" }
    hints:
      - "90 − {{b}} + 23."
    explanation: "{{113 - b}}° über dem Horizont."
    variants:
      params: { b: "int[47,55]" }
      defaults: { b: 52 }

  - kind: problem
    id: winter
    widget: numeric
    prompt: Im Winter zieht man die 23° ab statt sie zu addieren. Um wie viel Grad steht die Sonne im Sommer höher als im Winter?
    params: { unit: "°" }
    answer: { value: 46 }
    hints:
      - Einmal + 23, einmal − 23.
    explanation: 2 · 23 = 46°. Das macht den Unterschied zwischen Juli und Dezember.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Die Kurve zeigt, wie hoch die Mittagssonne im Jahr steht (0 = Januar, 12 = Dezember). Zieh den Breitengrad so, dass der Gipfel im Juni den Punkt trifft.
    params:
      expr: 90 - b + 23*sin(2*pi*(x - 2.7)/12)
      x:
        - 0
        - 12
      y:
        - 0
        - 90
      showCoordinates: false
      sliders:
        - id: b
          label: Breitengrad (° Nord)
          min: 0
          max: 70
          step: 5
          initial: 20
      markers:
        - x: 5.7
          y: 63
          label: 63°
    answer:
      values:
        b: 50
    hints:
      - "Am 21. Juni steht die Sonne am höchsten: 90° − Breitengrad + 23°."
      - Rechne 113° − 63°.
    explanation: Bei 50° Nord, etwa in Frankfurt, steht die Junisonne mittags 63° hoch. Im Dezember sind es nur 17°.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Bei welchem Breitengrad steht die Sonne am 21. Juni mittags genau senkrecht über dir?
    params:
      unit: ° N
    answer:
      value: 23
      tolerance: 0.5
    hints:
      - "Sonnenhöhe 90° heißt: 90 − Breite + 23 = 90."
    explanation: Bei 23° Nord – dem **nördlichen Wendekreis**.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: choice
    prompt: Ist die Erde im Juli näher an der Sonne als im Januar?
    params:
      options:
        - label: Nein – Anfang Januar ist sie am nächsten.
          correct: true
        - label: Ja, darum ist bei uns Sommer.
          feedback: Dann hätte die Südhalbkugel gleichzeitig Sommer. Sie hat aber Winter.
        - label: Der Abstand ist immer genau gleich.
          feedback: Die Bahn ist eine leichte Ellipse. Der Abstand schwankt um etwa 3 %.
    hints:
      - Wann ist in Australien Sommer?
      - Der Abstand schwankt nur wenig – und zur falschen Zeit.
    explanation: Im Januar ist die Erde der Sonne am nächsten, im Juli am fernsten. Die Jahreszeiten kommen von der geneigten Achse, nicht vom Abstand.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: Steht die Sonne flach, verteilt sich ein Lichtbündel auf eine größere Fläche. Bei 30° Sonnenhöhe ist sie doppelt so groß. Jeder Quadratmeter bekommt dann nur halb so viel **Strahlung**.

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: In Berlin steht die Sonne mittags im Sommer 61° hoch, im Winter 14°. Die Strahlung pro m² ist proportional zu sin(Höhe). sin 61° ≈ 0,87 und sin 14° ≈ 0,24. Wievielmal mehr ist es im Sommer?
    answer:
      value: 3.6
      tolerance: 0.1
    feedback:
      - when: abs(numval(state.input) - 4.4) < 0.1
        misconception: angle-ratio
        text: Das ist das Verhältnis der Winkel. Es zählt das Verhältnis der Sinuswerte.
    hints:
      - Teile die beiden Sinuswerte.
      - "0,87 : 0,24 = ?"
    explanation: "0,87 : 0,24 ≈ 3,6. Dazu kommen die längeren Tage. Zusammen liefert ein Sommertag ein Vielfaches an Energie."
    difficulty: 2

  - kind: problem
    id: ph-d4
    depth: 2
    widget: numeric
    prompt: "Am Polarkreis (66,5° Nord): Wie hoch steht die Sonne am 21. Dezember mittags? Rechne mit 23,5° Achsneigung."
    params:
      unit: °
    answer:
      value: 0
      tolerance: 0.5
    hints:
      - "Im Winter gilt: 90° − Breite − 23,5°."
      - 90 − 66,5 − 23,5 = ?
    explanation: "Genau 0°: Die Sonne kratzt mittags am Horizont. Weiter nördlich geht sie gar nicht auf – Polarnacht."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was wäre, wenn die Erdachse **gar nicht** geneigt wäre?
    params:
      options:
        - label: Es gäbe keine Jahreszeiten – überall wären Tag und Nacht gleich lang
          correct: true
        - label: Die Jahreszeiten wären stärker
          feedback: Ohne Neigung fällt der Grund für die Jahreszeiten weg.
        - label: Es wäre überall gleich warm
          feedback: Am Äquator träfe das Licht weiter steiler auf als an den Polen.
    hints:
      - Die Neigung ist der einzige Grund für die Jahreszeiten.
    explanation: "Uranus liegt fast auf der Seite: Dort dauern Tag und Nacht an den Polen je 42 Jahre."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: choice
    prompt: Am 21. Juni steht die Sonne am höchsten. Warum ist der Juli trotzdem meist wärmer?
    params:
      options:
        - label: Meere und Boden speichern Wärme und erwärmen sich verzögert.
          correct: true
        - label: Im Juli ist die Erde näher an der Sonne.
          feedback: Im Juli ist sie am fernsten.
        - label: Die Sonne strahlt im Juli stärker.
          feedback: Ihre Leistung schwankt kaum.
    hints:
      - "Denk an einen Topf auf dem Herd: Wann ist er am heißesten?"
      - Wärme muss sich erst ansammeln.
    explanation: Solange tagsüber mehr Energie ankommt als nachts abfließt, wird es wärmer – auch nach dem 21. Juni noch. Das Meer verstärkt die Verzögerung.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Die Erdachse taumelt wie ein Kreisel einmal in rund 26 000 Jahren. Was folgt daraus?
    params:
      options:
        - label: Der Polarstern bleibt nicht für immer Polarstern.
          correct: true
        - label: Die Neigung springt zwischen 0° und 90°.
          feedback: Die Neigung schwankt nur wenig, um etwa 22° bis 24,5°.
        - label: Die Erde dreht sich bald andersherum.
          feedback: Die Drehrichtung bleibt. Nur die Achse zeigt woandershin.
    hints:
      - Die Achse zeigt auf einen Punkt am Himmel.
      - Wandert die Achse, wandert dieser Punkt.
    explanation: Die Achse beschreibt einen Kegel. In etwa 12 000 Jahren zeigt sie nahe an die Wega. Diese Präzession verschiebt auch langsam, wann Sommer und Sonnennähe zusammenfallen.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum es Jahreszeiten gibt – und warum der Abstand zur Sonne nicht schuld ist.
    params:
      keywords:
        - - achse
          - axis
          - geneigt
          - tilt
          - schief
          - neig
        - - steil
          - steep
          - höhe
          - high
          - flach
          - low
          - winkel
          - angle
        - - tag
          - day
          - länger
          - longer
          - abstand
          - distance
          - südhalbkugel
          - southern
      sample: "Die Erdachse ist geneigt. Im Sommer neigt sich unsere Hälfte zur Sonne: Sie steht höher, das Licht trifft steiler und die Tage sind länger. Der Abstand kann es nicht sein, sonst hätte die Südhalbkugel gleichzeitig Sommer."
    difficulty: 3

srs:
  cards_from: [warum, sommer]
