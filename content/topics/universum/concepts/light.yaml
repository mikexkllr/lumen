id: sci.space.light
type: concept
title: Lichtjahre
summary: Entfernungen in Reisezeit des Lichts.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Minuten braucht das Licht von der Sonne zur Erde?"
    params:
      min: 0
      max: 60
      unit: min
    answer:
      value: 8.3
      tolerance: 2
    explanation: Gut 8 Minuten. Würde die Sonne erlöschen, merkten wir es erst dann.


  - kind: problem
    id: sonne
    widget: numeric
    body: Licht braucht von der Sonne zur Erde gut 8 Minuten, also rund 500 Sekunden. Die Strecke ist 150 Millionen km lang.
    prompt: Wie schnell ist Licht – in km pro Sekunde?
    params: { unit: km/s }
    answer: { value: 300000, tolerance: 10000 }
    hints:
      - 150 000 000 geteilt durch 500.
    explanation: Rund 300 000 km pro Sekunde – siebenmal um die Erde in einer Sekunde.

  - kind: problem
    id: mond
    widget: numeric
    prompt: Der Mond ist 384 000 km entfernt. Wie viele Sekunden braucht Licht dorthin?
    params: { unit: s }
    answer: { value: 1.28, tolerance: 0.05 }
    hints:
      - 384 000 geteilt durch 300 000.
    explanation: Etwa 1,3 Sekunden. Funkverkehr zum Mond hat also eine spürbare Pause.

  - kind: explain
    id: s3
    body: |
      Ein **Lichtjahr** ist keine Zeit, sondern eine Strecke. Es ist der Weg, den Licht in einem Jahr zurücklegt – fast 10 Billionen km.

  - kind: problem
    id: blick
    widget: choice
    prompt: Ein Stern ist 100 Lichtjahre entfernt. Was siehst du, wenn du ihn anschaust?
    params:
      options:
        - { label: Sein Licht von vor 100 Jahren, correct: true }
        - { label: Den Stern genau jetzt, feedback: "Das Licht war 100 Jahre unterwegs." }
        - { label: Sein Licht in 100 Jahren, feedback: "Licht aus der Zukunft gibt es nicht." }
    hints:
      - Wie lange war das Licht unterwegs?
    explanation: Ein Blick in den Himmel ist ein Blick in die Vergangenheit.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der nächste Stern, Proxima Centauri, ist 4,2 Lichtjahre entfernt. Eine Sonde fliegt mit 1/10 der Lichtgeschwindigkeit. Wie viele Jahre braucht sie?
    params:
      unit: Jahre
    answer:
      value: 42
    hints:
      - Zehnmal langsamer als Licht heißt zehnmal so lange.
    explanation: 42 Jahre. Unsere schnellsten Sonden bräuchten Zehntausende Jahre.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Andromeda-Galaxie ist 2,5 Millionen Lichtjahre entfernt. Was heißt das für unser Bild von ihr?
    params:
      options:
        - label: Wir sehen sie so, wie sie war, bevor es Menschen gab
          correct: true
        - label: Wir sehen sie, wie sie jetzt ist
          feedback: Das Licht war 2,5 Millionen Jahre unterwegs.
        - label: Sie ist zu weit weg, um sie zu sehen
          feedback: In dunklen Nächten sieht man sie mit bloßem Auge.
    hints:
      - Wie lange war das Licht unterwegs?
    explanation: In die Ferne schauen heißt in die Vergangenheit schauen. So sehen Teleskope das junge Universum.
    difficulty: 3

srs:
  cards_from: [sonne, blick]
