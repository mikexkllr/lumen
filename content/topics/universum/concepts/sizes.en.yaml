id: sci.space.sizes
type: concept
title: From Atom to Galaxy
summary: Sizes in powers of ten.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The ladder of tens
    body: "From an atom to the Milky Way, everything fits on one ladder. Each step is **ten times bigger** than the one before. Drag the point: how many steps lie between you and the Earth?"
    visual:
      widget: numberline
      interactive: true
      params:
        min: -10
        max: 21
        ticks: 1
        labels: integers
        initial: 0
        markers:
          - value: -10
            label: Atom
          - value: 0
            label: Human
          - value: 7
            label: Earth
          - value: 21
            label: Milky Way

  - kind: problem
    id: start-groesser
    widget: choice
    prompt: Which one is the biggest?
    params:
      options:
        - label: The Sun
          correct: true
        - label: Earth
          feedback: Earth is huge. But it would fit into the Sun more than a million times.
        - label: The Moon
          feedback: The Moon is even smaller than Earth.
    hints:
      - Which of the three gives us light and warmth?
      - The Sun only looks small because it is so far away.
    explanation: The Sun is the biggest of the three. It only looks small in the sky because it is 150 million km away.

  - kind: problem
    id: ordnen
    widget: order
    prompt: Sort from smallest to largest.
    params:
      startLabel: small
      endLabel: large
      items:
        - { label: Atom }
        - { label: Bacterium }
        - { label: Ant }
        - { label: Human }
        - { label: Mount Everest }
        - { label: Earth }
        - { label: Sun }
        - { label: Milky Way }
    hints:
      - A bacterium is much larger than an atom, but much smaller than an ant.
      - Earth, Sun and Milky Way come last – in that order.
    explanation: Between an atom and the Milky Way lie about 31 powers of ten.

  - kind: problem
    id: start-stufe
    widget: numeric
    prompt: Which length comes next?
    body: "On the ladder each step is ten times bigger: 1 m, 10 m, 100 m …"
    params:
      unit: m
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 200
        misconception: additive-step
        text: You don't add 100. Each step is **ten times** as big as the one before.
    hints:
      - "From 1 to 10 and from 10 to 100: what happens each time?"
      - Work out 100 · 10. You simply add one more zero.
    explanation: 100 · 10 = 1000. Each step adds one zero.

  - kind: explain
    id: s2
    body: "Such huge numbers are written in short as **powers of ten**. The small number on top counts the zeros: $10^3$ is 1000. Earth is about $10^7$ m wide. A human sits on step 0, because $10^0$ m is 1 m."

  - kind: problem
    id: start-nullen
    widget: numeric
    prompt: How many zeros does $10^6$ have when you write the number out?
    params:
      unit: zeros
    answer:
      value: 6
    feedback:
      - when: numval(state.input) == 1000000
        misconception: wrote-number
        text: That is the number written out. The question is how many zeros it has.
      - when: numval(state.input) == 60
        misconception: exponent-as-factor
        text: Don't work out 6 · 10. The small 6 counts the zeros.
    hints:
      - The small number on top counts the zeros.
      - $10^3$ is 1000 and has three zeros. And $10^6$?
    explanation: $10^6$ is 1,000,000 – one million, a 1 followed by six zeros.

  - kind: problem
    id: intro-c1
    widget: numberline
    prompt: The Sun is about 1 000 000 000 m wide. Mark the step of the ladder it sits on.
    params:
      min: -10
      max: 21
      ticks: 1
      labels: integers
      markers:
        - value: 0
          label: Human
        - value: 7
          label: Earth
    answer:
      value: 9
    hints:
      - Each step adds a zero. A human at 1 m sits on step 0.
      - Count the zeros after the 1.
    explanation: Nine zeros mean $10^9$ m – two steps above the Earth. So the Sun is about a hundred times as wide as the Earth.

  - kind: problem
    id: c1
    widget: match
    prompt: Which order of magnitude fits?
    params:
      pairs:
        - left: Atom
          right: $10^{-10}$ m
        - left: Human
          right: $10^{0}$ m
        - left: Earth
          right: $10^{7}$ m
        - left: Sun
          right: $10^{9}$ m
        - left: Milky Way
          right: $10^{21}$ m
    hints:
      - First order from smallest to largest.
      - "The smallest exponent belongs to the smallest thing. A minus means: smaller than 1 m."
    explanation: 31 powers of ten lie between atom and galaxy.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many stars does the Milky Way have?"
    params:
      min: 1000000
      max: 1000000000000000
      scale: log
    answer:
      value: 100000000000
      within: 90
    explanation: Around 100 billion – and there are about as many galaxies.

  - kind: problem
    id: sterne
    widget: numeric
    prompt: The Milky Way has about 100 billion stars. That is 10 to the power of …?
    params: { prefix: "10^" }
    answer: { value: 11 }
    feedback:
      - when: "numval(state.input) == 9"
        misconception: billion
        text: One billion is $10^9$. A hundred billion is two steps more.
    hints:
      - A billion has 9 zeros.
      - A hundred has two zeros. Add them to the 9.
    explanation: 100 · $10^9$ = $10^{11}$.

  - kind: problem
    id: erden
    depth: 2
    widget: numeric
    prompt: The Sun is about 1,400,000 km wide, and Earth about 12,700 km. How many Earths fit side by side across it?
    params: { unit: Earths }
    answer: { value: 110, tolerance: 5 }
    hints:
      - 1,400,000 divided by 12,700.
    explanation: A good 100 Earths side by side, and over a million fit inside.
    difficulty: 2

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "An atom is about $10^{-10}$ m, a human $10^{0}$ m, the Milky Way $10^{21}$ m. A human is how many times larger than an atom? Give the exponent: 10 to the …"
    answer:
      value: 10
    hints:
      - "Subtract the exponents: 0 − (−10)."
    explanation: 10¹⁰ – ten billion times. In size we are closer to the atom than to the galaxy.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many Earths fit side by side in the gap between Earth and Moon?"
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 30
      within: 30
    explanation: About 30. The Moon is 384,000 km away and Earth is 12,700 km across. Pictures in books almost always draw the Moon far too close.
    difficulty: 2

  - kind: explain
    id: ph-d2
    depth: 2
    body: For estimates the **order of magnitude** is often enough. You round to one digit times a power of ten. 384,000 km becomes 4 · 10⁵ km. Now you can calculate in your head.

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: 10 to the {{a}} times 10 to the {{b}} gives 10 to the …?
    answer:
      value: "{{a + b}}"
    feedback:
      - when: numval(state.input) == a * b
        misconception: exp-multiply
        text: You multiplied the exponents. When you multiply powers, the exponents **add**.
    hints:
      - "Write it out: 10³ · 10² = 1000 · 100."
      - Add up the zeros of both numbers.
    explanation: "{{a}} zeros and {{b}} zeros make {{a + b}} zeros. That is why exponents add."
    difficulty: 2
    variants:
      params:
        a: int[2,9]
        b: int[2,9]
      constraints:
        - a * b != a + b
      defaults:
        a: 6
        b: 3

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: The Sun has 110 times the Earth’s diameter. Roughly how many Earths fit into its **volume**? In millions, to one place.
    answer:
      value: 1.3
      tolerance: 0.1
    hints:
      - "Volume grows with the cube: 110³."
    explanation: 110³ ≈ 1.3 million.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: estimate
    prompt: "Fermi question: how many atoms are in your body? Tip: you are mostly water."
    params:
      min: 1000000000000000
      max: 1e+40
      scale: log
    answer:
      value: 7e+27
      within: 80
    explanation: 70 kg of water is about 3,900 mol of molecules. Each has 3 atoms, and a mole has 6 · 10²³ particles. That gives roughly 7 · 10²⁷ atoms.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A proton measures about 10⁻¹⁵ m, the observable universe about 10²⁷ m. How many powers of ten lie in between?
    answer:
      value: 42
      tolerance: 1
    feedback:
      - when: numval(state.input) == 12
        misconception: neg-exponent
        text: "The minus sign counts: from −15 to 0 is already 15 steps."
    hints:
      - How many steps from 10⁻¹⁵ to 10⁰?
      - Then add the steps from 10⁰ to 10²⁷.
    explanation: 15 + 27 = 42 powers of ten. A human at 10⁰ m sits roughly in the middle – on paper.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why sizes in the universe are written with powers of ten.
    params:
      keywords:
        - - zehn
          - ten
          - potenz
          - power
          - exponent
          - "null"
          - zero
        - - groß
          - klein
          - large
          - small
          - huge
          - tiny
          - riesig
          - winzig
        - - vergleich
          - compare
          - stufe
          - step
          - faktor
          - factor
          - kopf
          - head
      sample: Sizes range from tiny to huge. With powers of ten you just count steps, each ten times bigger. That makes comparing and mental maths easy.
    difficulty: 3

srs:
  cards_from: [ordnen, sterne]
