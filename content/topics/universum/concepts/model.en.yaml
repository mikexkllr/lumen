id: sci.space.model
type: concept
title: The Solar System to Scale
summary: If Earth were a marble.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Earth as a marble
    body: "The solar system is bigger than any picture shows. Picture the Earth as a **marble** 1 cm wide. Flip the cards one by one: where is the rest in this model?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🛰️
            front: The space station
            back: It circles only 0.3 mm above the marble.
          - icon: 🍊
            front: Jupiter
            back: A grapefruit 11 cm wide, about 600 m from the Sun.
          - icon: 🪨
            front: Pluto
            back: A crumb 2 mm wide – almost 5 km out.
          - icon: 🚀
            front: Voyager 1
            back: After almost 50 years of flight the probe is only about 20 km away.

  - kind: problem
    id: sonne-gross
    widget: numeric
    body: Imagine Earth as a marble 1 cm in diameter. The Sun is 109 times as wide.
    prompt: How wide is the Sun in the model? In meters.
    params: { unit: m }
    answer: { value: 1.09, tolerance: 0.05 }
    feedback:
      - when: "numval(state.input) == 109"
        misconception: units
        text: 109 cm is right, but the question asks for meters.
    hints:
      - How many meters is 109 cm?
    explanation: 109 cm, a ball as big as an exercise ball.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: In real life, the Sun is 11,700 Earth diameters away. How far away is it in the model? In meters.
    params: { unit: m }
    answer: { value: 117, tolerance: 2 }
    hints:
      - Each Earth diameter is 1 cm.
    explanation: 11,700 cm = 117 m, more than a football field away.

  - kind: explain
    id: s3
    body: In the model, the Sun is a big ball. Earth is a **marble** 117 m away. The rest is almost entirely empty space.

  - kind: problem
    id: neptun
    widget: choice
    prompt: Neptune is 30 times as far from the Sun as Earth. How far is that in the marble model?
    params:
      options:
        - { label: "About 3.5 km", correct: true }
        - { label: About 350 m, feedback: "Too short. 30 · 117 m is more." }
        - { label: About 30 m, feedback: "Earth is already 117 m away." }
    hints:
      - 30 · 117 m.
    explanation: 30 · 117 m ≈ 3.5 km. The nearest star would be about 32,000 km away in this model.

  - kind: explain
    id: s5
    body: Why do books never show the solar system to scale?
    reveal:
      body: Because it doesn't fit on a page. If you draw the planets at a visible size, the distances would have to be kilometers long.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In the marble model (Earth = 1 cm) the Sun is 117 m away. The nearest star is 270,000 times as far. How many kilometres would that be in the model?
    params:
      unit: km
    answer:
      value: 31600
      tolerance: 600
    hints:
      - 117 m · 270,000, then divide by 1000.
    explanation: About 31,600 km – almost once around the Earth. The space between stars is empty.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: In the marble model Earth is 1 cm wide. The Moon is 30 Earth diameters away. How many centimetres separate Earth and Moon in the model?
    params:
      unit: cm
    answer:
      value: 30
    hints:
      - One Earth diameter is 1 cm in the model.
      - Multiply by 30.
    explanation: 30 cm – one ruler. The Moon itself would be a crumb of almost 3 mm. The Sun is then 117 m away.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Fermi question: you drive non-stop to the Sun at 100 km/h, 150 million km. How many years does it take?"
    params:
      min: 1
      max: 10000
      scale: log
    answer:
      value: 171
      within: 30
    explanation: 150,000,000 km ÷ 100 km/h = 1.5 million hours. That is about 171 years. Light does it in 8 minutes.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: order
    prompt: Order the planets by their distance from the Sun – nearest first.
    params:
      items:
        - label: Mercury
        - label: Venus
        - label: Earth
        - label: Mars
        - label: Jupiter
        - label: Saturn
        - label: Uranus
        - label: Neptune
    hints:
      - The four rocky planets are on the inside.
      - "The giants follow outside: the two largest first."
    explanation: Inside the rocky planets Mercury, Venus, Earth and Mars. Then the gas giants Jupiter and Saturn, and outside the ice giants Uranus and Neptune.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How was the distance to a star first measured?
    params:
      options:
        - label: "With parallax: the star seems to shift slightly over the year"
          correct: true
        - label: With radar
          feedback: An echo would take years and be far too weak.
        - label: From brightness alone
          feedback: You do not know how bright the star really is.
    hints:
      - Hold your thumb in front of your nose and close one eye at a time.
    explanation: The distance follows from the angle and the diameter of Earth’s orbit – pure trigonometry.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Light takes 8.3 minutes from the Sun to Earth. Neptune is 30 times as far. How many hours does light need to reach Neptune?
    params:
      unit: h
    answer:
      value: 4.15
      tolerance: 0.1
    hints:
      - "First the minutes: 8.3 · 30."
      - Then divide by 60.
    explanation: 8.3 · 30 = 249 minutes, a little over 4 hours. Radio signals to probes at the edge of the Solar System take almost a day.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: In a few billion years the Milky Way and Andromeda will collide. How often will two stars hit each other head-on?
    params:
      options:
        - label: Almost never – there is a huge amount of space between stars.
          correct: true
        - label: All the time – billions of stars crash.
          feedback: In the marble model stars are thousands of kilometres apart.
        - label: Exactly once per star.
          feedback: There is no reason for that. The gaps are enormous.
    hints:
      - "Think of the marble model: how far would the next star be?"
      - Over 30,000 km – for stars the size of balls.
    explanation: Stars are tiny compared with the gaps between them. The galaxies pass through each other and change shape – but stars almost never meet.
    difficulty: 3

srs:
  cards_from: [abstand, neptun]
