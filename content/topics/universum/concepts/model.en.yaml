id: sci.space.model
type: concept
title: The Solar System to Scale
summary: If Earth were a marble.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sonne-gross
    widget: numeric
    body: Imagine Earth as a marble 1 cm in diameter. The Sun is 109 times as wide.
    prompt: How wide is the Sun in the model? In meters.
    params: { unit: m }
    answer: { value: 1.09, tolerance: 0.05 }
    feedback:
      - when: "numval(state.input) == 109"
        misconception: units
        text: 109 cm is right, but the question asks for meters.
    hints:
      - How many meters is 109 cm?
    explanation: 109 cm, a ball as big as an exercise ball.

  - kind: problem
    id: abstand
    widget: numeric
    prompt: In real life, the Sun is 11,700 Earth diameters away. How far away is it in the model? In meters.
    params: { unit: m }
    answer: { value: 117, tolerance: 2 }
    hints:
      - Each Earth diameter is 1 cm.
    explanation: 11,700 cm = 117 m, more than a football field away.

  - kind: explain
    body: In the model, the Sun is a big ball. Earth is a marble 117 m away. The rest is almost entirely empty space.

  - kind: problem
    id: neptun
    widget: choice
    prompt: Neptune is 30 times as far from the Sun as Earth. How far is that in the marble model?
    params:
      options:
        - { label: "About 3.5 km", correct: true }
        - { label: About 350 m, feedback: "Too short. 30 · 117 m is more." }
        - { label: About 30 m, feedback: "Earth is already 117 m away." }
    hints:
      - 30 · 117 m.
    explanation: 30 · 117 m ≈ 3.5 km. The nearest star would be about 32,000 km away in this model.

  - kind: explain
    body: Why do books never show the solar system to scale?
    reveal:
      body: Because it doesn't fit on a page. If you draw the planets at a visible size, the distances would have to be kilometers long.

srs:
  cards_from: [abstand, neptun]
