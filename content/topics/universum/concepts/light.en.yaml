id: sci.space.light
type: concept
title: Light-Years
summary: Distances as the travel time of light.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Mail from the past
    body: "When you look at the night sky, you travel in time. Light needs time for every distance. Flip the cards: how old is the **light** that reaches you right now?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🪐
            front: Jupiter
            back: Its light travels about 40 minutes to reach you.
          - icon: ⭐
            front: Pole Star
            back: Its light set off around the year 1600 – in Shakespeare's time.
          - icon: 🌌
            front: Andromeda
            back: Its light flew for 2.5 million years. Back then the first early humans lived.
          - icon: 🔥
            front: The oldest light
            back: It is 13.8 billion years old – almost as old as the universe itself.

  - kind: problem
    id: start-blitz
    widget: choice
    prompt: In a thunderstorm you see the lightning first. The thunder comes later. Which is faster?
    params:
      options:
        - label: Light
          correct: true
        - label: Sound
          feedback: Then you would hear the thunder first.
        - label: Both are equally fast
          feedback: Then lightning and thunder would reach you at the same time.
    hints:
      - "What reaches you first: what you see or what you hear?"
      - Lightning is light, thunder is sound.
    explanation: Light is almost a million times faster than sound. Even so, light also needs time for its journey.

  - kind: problem
    id: start-mond
    widget: choice
    prompt: The Moon is much closer to Earth than the Sun. Whose light takes less time to reach you?
    params:
      options:
        - label: Light from the Moon
          correct: true
        - label: Light from the Sun
          feedback: The Sun is much farther away. Its light takes longer.
        - label: Both take the same time
          feedback: Light always travels at the same speed. So a longer way takes longer.
    hints:
      - Light always travels at the same speed. Which way is shorter?
      - Shorter way, shorter time.
    explanation: Light from the Moon is on its way only briefly. From the Sun it takes much longer – in a moment you will guess how long.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many minutes does light take from the Sun to the Earth?"
    params:
      min: 0
      max: 60
      unit: min
    answer:
      value: 8.3
      tolerance: 2
    explanation: A good 8 minutes. If the Sun went out, we would only notice then.

  - kind: explain
    id: s3
    body: |
      A **light-year** is not a time but a distance. It is the path light travels in one year, almost 10 trillion km.

  - kind: problem
    id: blick
    widget: choice
    prompt: A star is 100 light-years away. What do you see when you look at it?
    params:
      options:
        - { label: Its light from 100 years ago, correct: true }
        - { label: The star exactly as it is now, feedback: "The light was on its way for 100 years." }
        - { label: Its light in 100 years, feedback: "There is no light from the future." }
    hints:
      - How long was the light traveling?
    explanation: Looking at the sky is looking into the past.

  - kind: problem
    id: sonne
    widget: numeric
    body: Light takes a good 8 minutes to get from the Sun to Earth, about 500 seconds. The distance is 150 million km.
    prompt: How fast is light, in km per second?
    params: { unit: km/s }
    answer: { value: 300000, tolerance: 10000 }
    hints:
      - 150,000,000 divided by 500.
      - "Drop two zeros from both numbers: 1,500,000 divided by 5."
    explanation: About 300,000 km per second. That is seven times around the Earth in one second.

  - kind: problem
    id: start-zwei
    widget: numeric
    prompt: Light covers about 300,000 km in one second. How many kilometres does it cover in 2 seconds?
    params:
      unit: km
    answer:
      value: 600000
    feedback:
      - when: numval(state.input) == 150000
        misconception: divide-not-multiply
        text: You divided. In twice the time, light gets twice as far.
    hints:
      - Twice the time, twice the distance.
      - Work out 300,000 · 2.
    explanation: 300,000 km · 2 = 600,000 km. That is farther than the way to the Moon.

  - kind: problem
    id: mond
    depth: 2
    widget: numeric
    prompt: The Moon is 384,000 km away. How many seconds does light take to get there?
    params: { unit: s }
    answer: { value: 1.28, tolerance: 0.05 }
    hints:
      - 384,000 divided by 300,000.
    explanation: About 1.3 seconds. Radio contact with the Moon has a noticeable pause.
    difficulty: 2

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The nearest star, Proxima Centauri, is 4.2 light-years away. A probe flies at 1/10 the speed of light. How many years does it take?
    params:
      unit: years
    answer:
      value: 42
    hints:
      - Ten times slower than light means ten times as long.
    explanation: 42 years. Our fastest probes would need tens of thousands of years.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Light covers 300,000 km per second. A year has about 31.5 million seconds. How far does light get in a year – in trillions of km?
    answer:
      value: 9.45
      tolerance: 0.1
    hints:
      - Multiply speed and time.
      - 3 · 10⁵ km/s · 3.15 · 10⁷ s = ?
    explanation: 3 · 10⁵ · 3.15 · 10⁷ = 9.45 · 10¹² km – almost 10 trillion kilometres.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Mars is currently {{d}} million km away. How many minutes does a radio command to the rover take?
    params:
      unit: min
    answer:
      value: "{{d / 18}}"
      tolerance: 0.2
    hints:
      - "Radio is light: 300,000 km per second."
      - Work out the seconds first, then divide by 60.
    explanation: "{{d}} million km ÷ 300,000 km/s gives seconds; divide by 60 for minutes. That is why rovers often drive on their own – real-time remote control is impossible."
    difficulty: 2
    variants:
      params:
        d: choice[60,100,225,400]
      defaults:
        d: 225

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The Andromeda galaxy is 2.5 million light-years away. What does that mean for our image of it?
    params:
      options:
        - label: We see it as it was before humans existed
          correct: true
        - label: We see it as it is now
          feedback: The light travelled for 2.5 million years.
        - label: It is too far to see
          feedback: On dark nights you can see it with the naked eye.
    hints:
      - How long was the light under way?
    explanation: Looking far means looking into the past. That is how telescopes see the young universe.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: In 1676 Ole Rømer noticed that the eclipses of Jupiter's moon Io arrive up to 1000 s late when Earth is 300 million km farther away. What speed of light follows – in km/s?
    answer:
      value: 300000
      tolerance: 1000
    hints:
      - The delay is the time light needs for the extra distance.
      - Speed = distance ÷ time.
    explanation: 300,000,000 km ÷ 1000 s = 300,000 km/s. Rømer's own estimate was too low because his orbital data were rough – but the idea was brilliant.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: The oldest light we see has travelled for 13.8 billion years. Yet its source is now about 46 billion light-years away. How?
    params:
      options:
        - label: Space expanded while the light was travelling.
          correct: true
        - label: Light was faster than c.
          feedback: Nothing outruns light through space. Here space itself grows.
        - label: The number is a calculation error.
          feedback: It is well measured. The key is the expansion of space.
    hints:
      - What has been happening to the distance between galaxies since the Big Bang?
      - The path behind the light kept stretching.
    explanation: The universe expands. Space kept growing behind the light, so today's distance is far larger than 13.8 billion light-years.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: teach
    prompt: "Explain to Lux: why is looking into space always looking into the past?"
    params:
      keywords:
        - - licht
          - light
          - strahl
        - - zeit
          - time
          - dauer
          - unterwegs
          - travel
          - braucht
          - takes
        - - vergangen
          - past
          - früher
          - alt
          - old
          - damals
          - ago
      sample: Light is fast but not infinitely fast. It travels a long time from the star to us, so we see the star as it was when the light left – in the past.
    difficulty: 3

srs:
  cards_from: [sonne, blick]
