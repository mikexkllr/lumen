id: sci.space.light
type: concept
title: Light-Years
summary: Distances as the travel time of light.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: sonne
    widget: numeric
    body: Light takes a good 8 minutes to get from the Sun to Earth, about 500 seconds. The distance is 150 million km.
    prompt: How fast is light, in km per second?
    params: { unit: km/s }
    answer: { value: 300000, tolerance: 10000 }
    hints:
      - 150,000,000 divided by 500.
    explanation: About 300,000 km per second. That is seven times around the Earth in one second.

  - kind: problem
    id: mond
    widget: numeric
    prompt: The Moon is 384,000 km away. How many seconds does light take to get there?
    params: { unit: s }
    answer: { value: 1.28, tolerance: 0.05 }
    hints:
      - 384,000 divided by 300,000.
    explanation: About 1.3 seconds. Radio contact with the Moon has a noticeable pause.

  - kind: explain
    body: |
      A **light-year** is not a time but a distance. It is the path light travels in one year, almost 10 trillion km.

  - kind: problem
    id: blick
    widget: choice
    prompt: A star is 100 light-years away. What do you see when you look at it?
    params:
      options:
        - { label: Its light from 100 years ago, correct: true }
        - { label: The star exactly as it is now, feedback: "The light was on its way for 100 years." }
        - { label: Its light in 100 years, feedback: "There is no light from the future." }
    hints:
      - How long was the light traveling?
    explanation: Looking at the sky is looking into the past.

srs:
  cards_from: [sonne, blick]
