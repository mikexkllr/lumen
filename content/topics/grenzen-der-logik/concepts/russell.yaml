id: logic.limits.russell
type: concept
title: Russells Menge
summary: Die Krise der Mengenlehre.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: enthalten
    widget: choice
    prompt: Die Menge aller Mengen mit mehr als drei Elementen – enthält sie sich selbst?
    params:
      options:
        - { label: Ja – sie hat selbst mehr als drei Elemente., correct: true }
        - { label: Nein, feedback: "Es gibt unendlich viele solcher Mengen – sie gehört also dazu." }
    hints:
      - Wie viele Elemente hat diese Menge?
    explanation: Manche Mengen enthalten sich selbst – das klingt seltsam, ist aber erlaubt.

  - kind: explain
    id: s2
    body: |
      **Bertrand Russell** betrachtete 1901 **die Menge aller Mengen, die sich nicht selbst enthalten**. Enthält sie sich selbst? Wenn ja, dürfte sie nicht drin sein. Wenn nein, müsste sie drin sein.

  - kind: problem
    id: russell
    widget: choice
    prompt: Was folgt aus Russells Paradox?
    params:
      options:
        - { label: Man darf Mengen nicht beliebig bilden., correct: true }
        - { label: Mengenlehre ist sinnlos., feedback: "Sie wurde repariert – mit genauen Regeln, welche Mengen erlaubt sind." }
    hints:
      - Wie repariert man eine Theorie mit Widerspruch?
    explanation: Heute legen Axiome genau fest, welche Mengen existieren.

  - kind: problem
    id: verwandt
    widget: choice
    prompt: Welches Paradox hat dieselbe Struktur wie Russells Menge?
    params:
      options:
        - { label: "Der Barbier, der alle rasiert, die sich nicht selbst rasieren", correct: true }
        - { label: Achilles und die Schildkröte, feedback: "Das ist ein Paradox über unendliche Summen, nicht über Selbstbezug." }
    hints:
      - Wo geht es um »alle, die nicht selbst …«?
    explanation: Barbier und Menge – beide stolpern über dieselbe Selbstverneinung.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Enthält die Menge sich selbst?
    params:
      buckets:
        - id: b1
          label: Enthält sich nicht
        - id: b2
          label: Enthält sich selbst
      items:
        - label: Die Menge aller Hunde
          bucket: b1
        - label: Die Menge aller Mengen
          bucket: b2
        - label: Die Menge aller Zahlen
          bucket: b1
        - label: Die Menge aller Nicht-Hunde
          bucket: b2
    hints:
      - Ist die Menge selbst eines ihrer Elemente?
    explanation: Die Menge aller Hunde ist kein Hund. Die Menge aller Nicht-Hunde ist aber selbst ein Nicht-Hund.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Russell fragte nach der Menge aller Mengen, die sich nicht [[selbst]] enthalten. Beide Antworten führen zum [[Widerspruch]].
      distractors:
        - immer
        - Beweis

  - kind: problem
    id: mix-c3
    widget: order
    prompt: R sei die Menge aller Mengen, die sich nicht selbst enthalten. Ordne die Schleife.
    params:
      items:
        - label: Angenommen, R enthält sich selbst
        - label: Dann verletzt R seine eigene Bedingung
        - label: Also enthält R sich nicht
        - label: Dann erfüllt R die Bedingung und gehört hinein
    hints:
      - Prüf nach jedem Schritt die Bedingung von R.
    explanation: Beide Annahmen kippen ins Gegenteil. So eine Menge kann es nicht geben.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Katalog soll alle Kataloge auflisten, die sich **nicht selbst** auflisten. Listet er sich selbst auf?
    params:
      options:
        - label: Beides führt zum Widerspruch – einen solchen Katalog kann es nicht geben
          correct: true
        - label: Ja
          feedback: Dann listet er einen Katalog, der sich selbst auflistet – verboten.
        - label: Nein
          feedback: Dann fehlt ein Katalog, der sich nicht selbst auflistet.
    hints:
      - Prüf beide Antworten.
    explanation: "Russells Paradox im Bibliotheksgewand. Die Lösung: Der Katalog existiert nicht."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Gibt es in der heutigen Mengenlehre eine »Menge aller Mengen«?
    params:
      options:
        - label: Nein – aus ihr könnte man Russells Menge aussondern.
          correct: true
        - label: Ja, sie enthält einfach alles.
          feedback: Dann gäbe es auch R = {x in ihr | x ∉ x} – und das Paradox wäre zurück.
        - label: Ja, aber sie ist leer.
          feedback: Die leere Menge ist eine Menge – eine Menge aller Mengen wäre also nicht leer.
    hints:
      - Aus einer gegebenen Menge darf man Teilmengen mit einer Eigenschaft bilden.
      - Welche Teilmenge der »Menge aller Mengen« macht Ärger?
    explanation: Wäre V die Menge aller Mengen, wäre R = {x ∈ V | x ∉ x} eine Menge – und widersprüchlich. Darum ist V in der üblichen Mengenlehre **keine Menge**, sondern nur eine »Klasse«.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie verhindert die moderne Mengenlehre Russells Paradox?
    params:
      options:
        - label: Neue Mengen darf man nur aus bereits vorhandenen Mengen aussondern – nicht frei aus beliebigen Eigenschaften bilden
          correct: true
        - label: Sie verbietet unendliche Mengen
          feedback: Unendliche Mengen sind ausdrücklich erlaubt.
        - label: Sie ignoriert das Problem
          feedback: Die Axiome wurden gezielt umgebaut.
    hints:
      - Eine »Menge aller Mengen« lässt sich dann gar nicht bilden.
    explanation: Die **Zermelo-Fraenkel-Axiome** von 1908 bis 1922. Auf ihnen ruht bis heute fast die gesamte Mathematik.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Russells Menge R enthält genau die Mengen x, für die x ∉ x gilt. Welcher berühmte Beweis hat dieselbe Bauart?
    params:
      options:
        - label: Cantors Diagonalargument – man dreht die »Diagonale« x ∈ x um.
          correct: true
        - label: Euklids Beweis der unendlich vielen Primzahlen.
          feedback: Euklid multipliziert und addiert 1 – mit Selbstbezug hat das nichts zu tun.
        - label: Der Satz des Pythagoras.
          feedback: Dort geht es um Flächen, nicht um Diagonalen einer Tabelle.
    hints:
      - "Stell dir eine Tabelle vor: Zeile x, Spalte y, Eintrag »x ∈ y«."
      - R nimmt genau die Diagonale und kehrt sie um.
    explanation: "Cantor, Russell, Gödel und Turing nutzen alle dasselbe **Diagonal-Muster**: Etwas, das sich von jedem Listeneintrag an dessen eigener Stelle unterscheidet, kann nicht in der Liste stehen."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux Russells Paradox mit dem Barbier.
    params:
      keywords:
        - - selbst
          - sich
          - himself
          - self
        - - rasier
          - shave
        - - widerspruch
          - weder
          - contradiction
          - neither
      sample: Der Barbier rasiert genau die Männer, die sich nicht selbst rasieren. Rasiert er sich selbst, dürfte er es nicht. Rasiert er sich nicht, müsste er es. Beides ist ein Widerspruch – so einen Barbier kann es nicht geben.
    difficulty: 3

srs:
  cards_from: [russell, verwandt]
