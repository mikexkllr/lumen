id: logic.limits.lab
type: concept
title: Unendlichkeits-Labor
summary: Diagonale bauen, Zahlen nummerieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: diagonale
    widget: bits
    body: "Liste: 1. Folge 011…, 2. Folge 110…, 3. Folge 100…"
    prompt: Baue Cantors neue Folge – die Diagonalziffern umgedreht.
    params: { bits: 3, showValue: false, labels: ["1.", "2.", "3."] }
    answer: { value: 5 }
    hints:
      - Nimm von der n-ten Folge die n-te Ziffer und dreh sie um.
    explanation: Diagonale 0, 1, 0 – umgedreht 1, 0, 1. Diese Folge steht nirgends in der Liste.

  - kind: problem
    id: zickzack
    widget: order
    prompt: Bring die ganzen Zahlen in Cantors Zickzack-Reihenfolge.
    params:
      items:
        - { label: "0" }
        - { label: "1" }
        - { label: "−1" }
        - { label: "2" }
        - { label: "−2" }
    hints:
      - Abwechselnd positiv und negativ, vom Nullpunkt nach außen.
    explanation: So bekommt jede ganze Zahl eine Nummer – sie sind abzählbar.

  - kind: problem
    id: paradoxe
    widget: match
    prompt: Was ist der Kern jedes Paradoxes?
    params:
      pairs:
        - { left: Lügner, right: Satz über sich selbst }
        - { left: Barbier, right: Regel schließt sich selbst ein }
        - { left: Hilberts Hotel, right: Unendlich plus eins }
    hints:
      - Zwei handeln von Selbstbezug, eines vom Unendlichen.
    explanation: Selbstbezug und Unendlichkeit – die beiden großen Quellen logischer Überraschungen.

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: "Turing zeigt: Kein Programm H kann für jedes Programm sagen, ob es anhält. Ordne den Beweis."
    params:
      items:
        - label: Angenommen, H gibt es.
        - label: "Baue D: D fragt H, ob P mit Eingabe P anhält."
        - label: Sagt H »hält«, läuft D endlos. Sonst hält D.
        - label: "Starte D mit sich selbst: D hält genau dann, wenn D nicht hält."
        - label: Widerspruch – also gibt es H nicht.
    hints:
      - Wie jeder Widerspruchsbeweis beginnt er mit einer Annahme.
      - D tut immer das Gegenteil dessen, was H vorhersagt.
    explanation: "Das ist das **Halteproblem**. D ist die Diagonale: Es widerspricht H an genau der Stelle »D mit Eingabe D«. Dieselbe Idee wie bei Cantor und Gödel."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Was heißt das Halteproblem für die Praxis?
    params:
      options:
        - label: Kein Programm kann **jedes** Programm sicher auf Endlosschleifen prüfen.
          correct: true
        - label: Kein Programm kann je etwas über ein anderes Programm sagen.
          feedback: Für viele einzelne Programme klappt das sehr wohl – nur nicht für alle.
        - label: Computer werden das mit mehr Rechenkraft lösen.
          feedback: Der Beweis gilt für jeden Computer, egal wie schnell.
    hints:
      - Der Beweis sagt »nicht für alle«, nicht »für keins«.
      - Zählt Rechenzeit im Beweis eine Rolle?
    explanation: "Prüfprogramme arbeiten darum mit **Näherungen**: Sie warnen manchmal zu viel oder übersehen etwas. Eine perfekte Prüfung ist logisch unmöglich."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux in eigenen Worten, was Gödel über die Mathematik herausgefunden hat.
    params:
      keywords:
        - - wahr
          - "true"
        - - beweis
          - bewiesen
          - beweisbar
          - prove
          - proof
          - provable
        - - system
          - regeln
          - axiom
          - rules
        - - nicht
          - grenze
          - unvollständig
          - cannot
          - limit
          - incomplete
      min: 3
      sample: In jedem widerspruchsfreien System von Regeln, das stark genug für das Rechnen mit Zahlen ist, gibt es Aussagen, die wahr sind, sich aber innerhalb dieses Systems nicht beweisen lassen. Die Mathematik ist also unvollständig.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Kann es einen Virenscanner geben, der **jedes** Schadprogramm sicher erkennt und nie falschen Alarm gibt?
    params:
      options:
        - label: Nein – damit könnte man auch das Halteproblem lösen.
          correct: true
        - label: Ja, mit genug Beispielen im Training.
          feedback: Beispiele helfen bei bekannten Fällen, nicht bei jedem denkbaren Programm.
        - label: Ja, wenn er jedes Programm einmal ausführt.
          feedback: Manche Programme werden erst nach langer Zeit böse – oder nie fertig.
    hints:
      - "»Ist schädlich« kann heißen: »erreicht irgendwann diese Zeile«."
      - Ob ein Programm eine Zeile je erreicht, ist so schwer wie das Halteproblem.
    explanation: Nach dem **Satz von Rice** ist jede echte Frage nach dem Verhalten von Programmen unentscheidbar. Darum gibt es immer Lücken oder Fehlalarme – auch mit KI.
    difficulty: 3

srs:
  cards_from: [diagonale, zickzack]
