id: logic.limits.russell
type: concept
title: Russell's Set
summary: The crisis of set theory.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A letter full of dynamite
    body: In 1902, a single letter shook a life's work. Uncover the cards in order and see how a harmless question about **sets** rocked mathematics.
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 📚
            front: Almost done
            back: Gottlob Frege wants to found numbers on pure logic – using sets. His great work is almost printed.
          - icon: ✉️
            front: A letter, 1902
            back: "The young Bertrand Russell writes to him: there is a contradiction in your system."
          - icon: 😱
            front: The reply
            back: Frege replies that the foundations of his work have been shaken.
          - icon: ❓
            front: The question
            back: Russell's question fits on one line – and yet it kept mathematics busy for decades.

  - kind: problem
    id: enthalten
    widget: choice
    prompt: The set of all sets with more than three elements – does it contain itself?
    params:
      options:
        - { label: Yes – it has more than three elements itself., correct: true }
        - { label: "No", feedback: "There are infinitely many such sets – so it belongs to them." }
    hints:
      - How many elements does this set have?
    explanation: Some sets contain themselves – that sounds strange, but it is allowed.

  - kind: explain
    id: s2
    body: |
      In 1901, **Bertrand Russell** considered **the set of all sets that do not contain themselves**. Does it contain itself? If yes, it should not be in it. If no, it should be in it.

  - kind: problem
    id: russell
    widget: choice
    prompt: What follows from Russell's paradox?
    params:
      options:
        - { label: You may not form sets arbitrarily., correct: true }
        - { label: Set theory is pointless., feedback: "It was repaired – with precise rules about which sets are allowed." }
    hints:
      - How do you repair a theory that has a contradiction?
    explanation: Today, axioms define exactly which sets exist.

  - kind: problem
    id: verwandt
    widget: choice
    prompt: Which paradox has the same structure as Russell's set?
    params:
      options:
        - { label: "The barber who shaves everyone who does not shave themselves", correct: true }
        - { label: Achilles and the tortoise, feedback: "That is a paradox about infinite sums, not about self-reference." }
    hints:
      - Where is it about “all who do not … themselves”?
    explanation: Barber and set – both stumble over the same self-denial.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Does the set contain itself?
    params:
      buckets:
        - id: b1
          label: Does not contain itself
        - id: b2
          label: Contains itself
      items:
        - label: The set of all dogs
          bucket: b1
        - label: The set of all sets
          bucket: b2
        - label: The set of all numbers
          bucket: b1
        - label: The set of all non-dogs
          bucket: b2
    hints:
      - Is the set itself one of its elements?
    explanation: The set of all dogs is not a dog. But the set of all non-dogs is itself a non-dog.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: Russell asked about the set of all sets that do not contain [[themselves]]. Both answers lead to a [[contradiction]].
      distractors:
        - always
        - proof

  - kind: problem
    id: mix-c3
    widget: order
    prompt: Let R be the set of all sets that do not contain themselves. Order the loop.
    params:
      items:
        - label: Suppose R contains itself
        - label: Then R breaks its own condition
        - label: So R does not contain itself
        - label: Then R meets the condition and belongs inside
    hints:
      - Check the condition of R after each step.
    explanation: Both assumptions flip into their opposite. Such a set cannot exist.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: A catalogue is to list all catalogues that do **not list themselves**. Does it list itself?
    params:
      options:
        - label: Both lead to contradiction – such a catalogue cannot exist
          correct: true
        - label: Yes
          feedback: Then it lists a catalogue that lists itself – forbidden.
        - label: No
          feedback: Then a catalogue that does not list itself is missing.
    hints:
      - Check both answers.
    explanation: "Russell’s paradox in library dress. The solution: the catalogue does not exist."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Does today's set theory have a "set of all sets"?
    params:
      options:
        - label: No – Russell's set could be carved out of it.
          correct: true
        - label: Yes, it simply contains everything.
          feedback: Then R = {x in it | x ∉ x} would exist too – and the paradox would be back.
        - label: Yes, but it is empty.
          feedback: The empty set is a set – so a set of all sets would not be empty.
    hints:
      - From a given set you may form subsets with a property.
      - Which subset of the "set of all sets" causes trouble?
    explanation: If V were the set of all sets, R = {x ∈ V | x ∉ x} would be a set – and contradictory. So in standard set theory V is not a set, only a "class".
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How does modern set theory prevent Russell’s paradox?
    params:
      options:
        - label: New sets may only be separated out of existing sets – not formed freely from arbitrary properties
          correct: true
        - label: It forbids infinite sets
          feedback: Infinite sets are expressly allowed.
        - label: It ignores the problem
          feedback: The axioms were deliberately rebuilt.
    hints:
      - A “set of all sets” then cannot be formed at all.
    explanation: The **Zermelo–Fraenkel axioms** from 1908 to 1922. Almost all of mathematics rests on them to this day.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Russell's set R contains exactly the sets x with x ∉ x. Which famous proof has the same design?
    params:
      options:
        - label: Cantor's diagonal argument – you flip the "diagonal" x ∈ x.
          correct: true
        - label: Euclid's proof of infinitely many primes.
          feedback: Euclid multiplies and adds 1 – that has nothing to do with self-reference.
        - label: Pythagoras' theorem.
          feedback: That is about areas, not diagonals of a table.
    hints:
      - 'Picture a table: row x, column y, entry "x ∈ y".'
      - R takes exactly the diagonal and reverses it.
    explanation: "Cantor, Russell, Gödel and Turing all use the same diagonal pattern: something that differs from every list entry at that entry's own position cannot be in the list."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain Russell's paradox to Lux using the barber.
    params:
      keywords:
        - - selbst
          - sich
          - himself
          - self
        - - rasier
          - shave
        - - widerspruch
          - weder
          - contradiction
          - neither
      sample: The barber shaves exactly the men who do not shave themselves. If he shaves himself, he must not; if he does not, he must. Both are a contradiction – such a barber cannot exist.
    difficulty: 3

srs:
  cards_from: [russell, verwandt]
