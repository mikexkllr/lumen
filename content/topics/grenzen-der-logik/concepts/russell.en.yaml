id: logic.limits.russell
type: concept
title: Russell's Set
summary: The crisis of set theory.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: enthalten
    widget: choice
    prompt: The set of all sets with more than three elements – does it contain itself?
    params:
      options:
        - { label: Yes – it has more than three elements itself., correct: true }
        - { label: "No", feedback: "There are infinitely many such sets – so it belongs to them." }
    hints:
      - How many elements does this set have?
    explanation: Some sets contain themselves – that sounds strange, but it is allowed.

  - kind: explain
    body: |
      In 1901, Bertrand Russell considered **the set of all sets that do not contain themselves**. Does it contain itself? If yes, it should not be in it. If no, it should be in it.

  - kind: problem
    id: russell
    widget: choice
    prompt: What follows from Russell's paradox?
    params:
      options:
        - { label: You may not form sets arbitrarily., correct: true }
        - { label: Set theory is pointless., feedback: "It was repaired – with precise rules about which sets are allowed." }
    hints:
      - How do you repair a theory that has a contradiction?
    explanation: Today, axioms define exactly which sets exist.

  - kind: problem
    id: verwandt
    widget: choice
    prompt: Which paradox has the same structure as Russell's set?
    params:
      options:
        - { label: "The barber who shaves everyone who does not shave themselves", correct: true }
        - { label: Achilles and the tortoise, feedback: "That is a paradox about infinite sums, not about self-reference." }
    hints:
      - Where is it about “all who do not … themselves”?
    explanation: Barber and set – both stumble over the same self-denial.

srs:
  cards_from: [russell, verwandt]
