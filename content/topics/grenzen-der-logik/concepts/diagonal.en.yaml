id: logic.limits.diagonal
type: concept
title: Cantor's Diagonal Trick
summary: There are bigger infinities.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Are all infinities the same size?
    params:
      options:
        - label: No – some are bigger than others
          correct: true
        - label: Yes – infinite is infinite
          feedback: That is what people thought until 1874.
        - label: The question makes no sense
          feedback: It can be answered rigorously.
    hints:
      - Georg Cantor surprised everyone.
    explanation: The proof is short and one of the most beautiful in mathematics.

  - kind: explain
    id: s1
    body: |
      Suppose someone lists **all** infinite 0-1 sequences. Cantor builds a new **sequence**. Its first digit is the flipped first digit of sequence 1. Its second digit is the flipped second digit of sequence 2, and so on.

  - kind: problem
    id: bauen
    widget: choice
    body: "List: sequence 1 is 0110…, sequence 2 is 1111…, sequence 3 is 0001…"
    prompt: How does Cantor's new sequence begin?
    params:
      options:
        - { label: "101…", correct: true }
        - { label: "010…", feedback: "That is the diagonal itself – every digit must be flipped." }
        - { label: "111…", feedback: "Check the 2nd digit of the 2nd sequence – it is 1, so it becomes 0." }
    hints:
      - Take the n-th digit of the n-th sequence and flip it.
    explanation: The diagonal is 0, 1, 0 – flipped, 1, 0, 1.

  - kind: problem
    id: fehlt
    widget: choice
    prompt: Why can the new sequence not appear anywhere in the list?
    params:
      options:
        - { label: It differs from every sequence in at least one place., correct: true }
        - { label: Because the list is too short., feedback: "The list is infinite – this sequence is missing anyway." }
    hints:
      - Compare it with the n-th sequence at the n-th place.
    explanation: So every list is incomplete – these sequences are **uncountable**.

  - kind: problem
    id: reelle
    widget: choice
    prompt: What follows for the real numbers between 0 and 1?
    params:
      options:
        - { label: There are more of them than natural numbers., correct: true }
        - { label: There are as many as fractions., feedback: "Fractions can be listed – real numbers cannot." }
    hints:
      - Every real number has an infinite string of digits.
    explanation: Infinite does not equal infinite – one of the most astonishing insights in mathematics.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order Cantor’s proof.
    params:
      items:
        - label: "Assumption: all sequences are in one list"
        - label: Read the digits on the diagonal
        - label: Flip each of these digits
        - label: The new sequence is missing from the list
    hints:
      - First assume, then build, then find the contradiction.
    explanation: The list was meant to be complete – and it is not.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The new sequence differs from the n-th sequence at the [[n-th]] digit. So it is [[nowhere]] in the list.
      distractors:
        - first
        - everywhere

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "A list begins: 1st sequence 0110…, 2nd 1011…, 3rd 0010…, 4th 1101… The diagonal reads 0, 0, 1, 1. What is Cantor’s new sequence as a four-digit binary number – in decimal?"
    answer:
      value: 12
    hints:
      - "Flip every diagonal digit: 1, 1, 0, 0."
    explanation: 1100 in binary is 12. This sequence differs from the n-th sequence at the n-th digit.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: The diagonal of a list reads 1, 0, 1, 1. You flip every digit. How many ones does the new sequence have?
    answer:
      value: 1
    hints:
      - 1 becomes 0, 0 becomes 1.
    explanation: The new sequence is 0, 1, 0, 0.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is there an infinity **between** that of the natural and that of the real numbers?
    params:
      options:
        - label: That can be neither proved nor refuted from the usual axioms
          correct: true
        - label: Yes, certainly
          feedback: Nobody has found such a set.
        - label: No, certainly not
          feedback: That is not provable either.
    hints:
      - Gödel showed one half in 1940, Cohen the other in 1963.
    explanation: The **continuum hypothesis** is independent of the axioms. Some questions in mathematics have no answer.
    difficulty: 3

srs:
  cards_from: [fehlt, reelle]
