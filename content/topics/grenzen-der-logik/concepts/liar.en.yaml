id: logic.limits.liar
type: concept
title: The Liar Paradox
summary: A sentence about itself.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: satz
    widget: choice
    body: "“This sentence is false.”"
    prompt: Is the sentence true or false?
    params:
      options:
        - { label: Neither works without contradiction., correct: true }
        - { label: "True", feedback: "Then what it says holds – so it would be false." }
        - { label: "False", feedback: "Then the opposite holds – so it would be true." }
    hints:
      - Try out both assumptions.
    explanation: Each assumption leads to its opposite – a genuine paradox.

  - kind: explain
    id: s2
    body: |
      The problem is **self-reference**: the sentence talks about itself. Self-reference lies behind many deep results – from Russell to Gödel to Turing.

  - kind: problem
    id: barbier
    widget: choice
    body: A barber shaves exactly those men in the village who do not shave themselves.
    prompt: Does the barber shave himself?
    params:
      options:
        - { label: Neither yes nor no is possible., correct: true }
        - { label: "Yes", feedback: "Then he is one of those he must not shave." }
        - { label: "No", feedback: "Then he is one of those he must shave." }
    hints:
      - Is the barber one of his own customers?
    explanation: Such a barber simply cannot exist.

  - kind: problem
    id: harmlos
    widget: choice
    prompt: Which self-referential sentence is harmless?
    params:
      options:
        - { label: "“This sentence has five words.”", correct: true }
        - { label: "“This sentence is false.”", feedback: "That is exactly the paradox." }
    hints:
      - Count the words.
    explanation: Self-reference is not always a problem – only when it denies itself.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Paradox or harmless?
    params:
      buckets:
        - id: b1
          label: Paradox
        - id: b2
          label: Harmless
      items:
        - label: “This sentence is false.”
          bucket: b1
        - label: “This sentence has five words.”
          bucket: b2
        - label: “I am lying right now.”
          bucket: b1
        - label: “This sentence stands here.”
          bucket: b2
    hints:
      - Self-reference alone is harmless. It gets dangerous with “false”.
    explanation: A sentence may talk about itself. It just must not deny its own truth.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "The problem is [[self-reference]]: the sentence talks about [[itself]]."
      distractors:
        - chance
        - others

  - kind: problem
    id: mix-c3
    widget: order
    prompt: Follow the loop of “This sentence is false”.
    params:
      items:
        - label: Suppose the sentence is true
        - label: "Then what it says holds: it is false"
        - label: If false, its claim does not hold
        - label: So it is true – and it all starts again
    hints:
      - Each step flips the result.
    explanation: The loop never ends. That is why the sentence has no truth value.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Sentence A: “Sentence B is true.” Sentence B: “Sentence A is false.” What happens?"
    params:
      options:
        - label: A paradox – although neither sentence talks about itself
          correct: true
        - label: Both are true
          feedback: Then A would be false – contradiction.
        - label: Both are false
          feedback: Then B would be true – contradiction.
    hints:
      - Assume A is true and follow the chain.
    explanation: Self-reference can hide behind a detour. So direct bans do not help.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Is the sentence "This sentence is true" a paradox?
    params:
      options:
        - label: No contradiction – but nothing decides whether it is true or false.
          correct: true
        - label: Yes, just like the liar.
          feedback: "Try both cases: true fits, false fits too. There is no contradiction."
        - label: No, it is clearly true.
          feedback: What makes it true? Only itself – that is no reason.
    hints:
      - Assume it is true. Does that fit? Assume it is false. Does that fit too?
      - With the liar neither case fits. Here both do.
    explanation: "The truth-teller sentence is the liar's counterpart: it is not contradictory but undetermined. Self-reference can cause two kinds of trouble."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: 'Call a word "self-blind" if it does not fit itself: "long" is a short word, "blue" is not blue. Is "self-blind" self-blind?'
    params:
      options:
        - label: Neither yes nor no is possible without contradiction.
          correct: true
        - label: Yes.
          feedback: Then it describes itself – so it is not self-blind.
        - label: No.
          feedback: Then it does not describe itself – which is exactly what self-blind means.
    hints:
      - 'Check the case "yes": does the word then describe itself?'
      - And the case "no"?
    explanation: "This is the Grelling paradox. It has the same form as Russell's set: something is defined by the property of not applying to itself."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Alfred Tarski resolved the liar paradox like this: “true” must not be defined within the language itself. What does that mean?"
    params:
      options:
        - label: The truth of sentences of a language is discussed in a higher language
          correct: true
        - label: Nobody may talk about truth any more
          feedback: You may – just one level above.
        - label: All sentences are true
          feedback: That is not at issue.
    hints:
      - "Think of levels: language and language about the language."
    explanation: "The separation of **object language and metalanguage**. The price: no language can fully capture its own truth."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: 'What happens if you replace "true" by "provable" in the liar: "This sentence is not provable"?'
    params:
      options:
        - label: No paradox any more – but a true sentence that cannot be proven.
          correct: true
        - label: A paradox again.
          feedback: If it is unprovable, it is simply true. That is no contradiction.
        - label: A false sentence.
          feedback: Then it would be provable – and proving a false sentence makes the system inconsistent.
    hints:
      - Suppose the sentence were provable. What would it then claim?
      - A consistent system proves nothing false.
    explanation: "That is exactly Gödel's idea: he built this sentence in the language of numbers. The liar paradox turns into a theorem about the limits of proof."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why "This sentence is false" can be neither true nor false.
    params:
      keywords:
        - - wahr
          - "true"
        - - falsch
          - "false"
        - - widerspruch
          - umgekehrt
          - contradiction
          - the other way
      sample: If the sentence is true, what it says holds – so it is false. If it is false, the opposite holds – so it is true. Both lead to a contradiction.
    difficulty: 3

srs:
  cards_from: [satz, barbier]
