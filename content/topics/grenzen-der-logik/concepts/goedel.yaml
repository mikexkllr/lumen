id: logic.limits.goedel
type: concept
title: Gödels Unvollständigkeit
summary: Wahr, aber unbeweisbar.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was glaubst du: Lässt sich in der Mathematik jede wahre Aussage auch beweisen?"
    params:
      options:
        - label: Nein
          correct: true
        - label: Ja, mit genug Mühe
          feedback: Das hoffte man bis 1931.
        - label: Nur die einfachen nicht
          feedback: Es liegt nicht an der Schwierigkeit.
    hints:
      - Ein 25-Jähriger erschütterte 1931 die Mathematik.
    explanation: "Kurt Gödel zeigte: Es gibt wahre Sätze ohne Beweis."

  - kind: explain
    id: s1
    body: |
      Kurt Gödel konstruierte 1931 einen mathematischen Satz, der sinngemäß sagt: **»Ich bin nicht beweisbar.«** Ist das System widerspruchsfrei, dann ist dieser Satz wahr – aber nicht beweisbar.

  - kind: problem
    id: aussage
    widget: choice
    prompt: Was zeigt Gödels Unvollständigkeitssatz?
    params:
      options:
        - { label: "In jedem ausreichend starken System gibt es wahre, aber unbeweisbare Aussagen.", correct: true }
        - { label: Die Mathematik ist voller Fehler., feedback: "Es geht nicht um Fehler, sondern um prinzipielle Grenzen des Beweisens." }
        - { label: Man kann gar nichts beweisen., feedback: "Fast alles Alltägliche bleibt beweisbar – nur nie restlos alles." }
    hints:
      - Wahr und beweisbar sind nicht dasselbe.
    explanation: Kein Regelwerk erfasst alle mathematischen Wahrheiten.

  - kind: problem
    id: verwandt
    widget: match
    prompt: Welche Idee steckt hinter welchem Ergebnis?
    params:
      pairs:
        - { left: Lügner-Paradox, right: Satz gegen sich }
        - { left: Gödel, right: Satz gegen Beweis }
        - { left: Turing, right: Programm gegen Prognose }
    hints:
      - Alle drei spielen mit Selbstbezug.
    explanation: Derselbe Trick des Selbstbezugs zieht Grenzen für Sprache, Beweise und Computer.

  - kind: problem
    id: axiom
    widget: choice
    prompt: Man nimmt Gödels Satz einfach als neues Axiom auf. Ist das System dann vollständig?
    params:
      options:
        - { label: Nein – man kann wieder einen neuen solchen Satz bauen., correct: true }
        - { label: Ja, feedback: "Für das erweiterte System gibt es einen neuen unbeweisbaren Satz." }
    hints:
      - Gilt Gödels Satz auch für das neue System?
    explanation: Die Lücke wandert mit – Vollständigkeit bleibt für immer unerreichbar.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Gödels Satz sagt: »Ich bin nicht [[beweisbar]].« Ist das System widerspruchsfrei, dann ist der Satz [[wahr]]."
      distractors:
        - lesbar
        - falsch

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: Was folgt aus Gödels Ergebnis?
    params:
      buckets:
        - id: b1
          label: Folgt
        - id: b2
          label: Folgt nicht
      items:
        - label: Es gibt wahre Sätze ohne Beweis
          bucket: b1
        - label: Die Mathematik ist falsch
          bucket: b2
        - label: Neue Axiome schließen nie alle Lücken
          bucket: b1
        - label: Nichts lässt sich beweisen
          bucket: b2
    hints:
      - Gödel zeigt eine Grenze – keinen Fehler.
    explanation: Fast alles bleibt beweisbar. Aber eben nie alles.

  - kind: problem
    id: mix-c3
    widget: order
    prompt: Ordne die Entdeckungen nach der Zeit.
    params:
      items:
        - label: Hilbert fordert Beweise für alles (1900)
        - label: Russell findet sein Paradox (1901)
        - label: Gödel zeigt die Unvollständigkeit (1931)
        - label: Turing zeigt das Halteproblem (1936)
    hints:
      - Die Jahreszahlen helfen.
    explanation: In nur 36 Jahren fand die Mathematik ihre eigenen Grenzen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Wie brachte Gödel einen Satz über Zahlen dazu, über Beweise zu reden?
    params:
      options:
        - label: Er gab jeder Formel und jedem Beweis eine Nummer – so werden Aussagen über Beweise zu Aussagen über Zahlen
          correct: true
        - label: Er erfand eine neue Sprache
          feedback: Er blieb beim Rechnen mit Zahlen.
        - label: Er benutzte einen Computer
          feedback: Die gab es 1931 noch nicht.
    hints:
      - Ähnlich wie ein Computer Text als Zahlen speichert.
    explanation: "Die **Gödelnummerierung**. Dieselbe Idee steckt in jedem Computer: Programme sind Daten."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: match
    prompt: Was bedeutet welcher Begriff?
    params:
      pairs:
        - left: vollständig
          right: A oder ¬A ist immer beweisbar
        - left: widerspruchsfrei
          right: nie A und ¬A beweisbar
        - left: Axiom
          right: ohne Beweis angenommen
        - left: entscheidbar
          right: ein Verfahren sagt ja oder nein
      leftTitle: Begriff
      rightTitle: Bedeutung
    hints:
      - "Vollständig heißt: Keine Frage bleibt offen."
      - "Widerspruchsfrei heißt: Man kann nicht beides beweisen."
    explanation: "Gödel zeigte: Ein widerspruchsfreies System, das die Arithmetik enthält, ist nie vollständig. Turing zeigte bald darauf: Die Arithmetik ist auch nicht **entscheidbar**."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Gödel verwandelt Zeichenfolgen in Zahlen. Die Folge (2, 1, 3) wird zu 2² · 3¹ · 5³. Welche Zahl ist das?
    answer:
      value: 1500
    hints:
      - 2² = 4, 3¹ = 3, 5³ = 125.
      - Multipliziere 4 · 3 · 125.
    explanation: 4 · 3 · 125 = 1500. Wegen der eindeutigen Primfaktorzerlegung kann man aus 1500 die Folge zurückgewinnen. So wird jeder **Beweis** zu einer Zahl – und Aussagen über Beweise werden Aussagen über Zahlen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gödels **zweiter** Unvollständigkeitssatz sagt …?
    params:
      options:
        - label: Ein widerspruchsfreies System kann seine eigene Widerspruchsfreiheit nicht beweisen
          correct: true
        - label: Die Mathematik ist widersprüchlich
          feedback: Das behauptet der Satz nicht.
        - label: Alles Wahre ist beweisbar
          feedback: Der erste Satz zeigt das Gegenteil.
    hints:
      - Kann man sich selbst das Zeugnis ausstellen?
    explanation: Hilberts Traum, die Mathematik aus sich selbst heraus abzusichern, war damit unerfüllbar.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Was folgt **nicht** aus Gödels Unvollständigkeitssatz?
    params:
      options:
        - label: Dass Mathematik unzuverlässig ist und alles relativ.
          correct: true
        - label: Dass es wahre, aber im System unbeweisbare Sätze gibt.
          feedback: Genau das folgt – für widerspruchsfreie Systeme mit Arithmetik.
        - label: Dass kein solches System seine eigene Widerspruchsfreiheit beweist.
          feedback: Das ist der zweite Unvollständigkeitssatz.
    hints:
      - Bewiesene Sätze bleiben bewiesen. Was ändert Gödel also nicht?
      - Der Satz gilt nur für bestimmte formale Systeme.
    explanation: Gödel zeigt eine **Grenze** formaler Systeme, keine Beliebigkeit. Jeder bewiesene Satz bleibt gültig. Viele populäre Deutungen übertreiben weit, was der Satz sagt.
    difficulty: 3

srs:
  cards_from: [aussage, axiom]
