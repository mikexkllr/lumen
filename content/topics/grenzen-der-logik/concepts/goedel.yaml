id: logic.limits.goedel
type: concept
title: Gödels Unvollständigkeit
summary: Wahr, aber unbeweisbar.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was glaubst du: Lässt sich in der Mathematik jede wahre Aussage auch beweisen?"
    params:
      options:
        - label: Nein
          correct: true
        - label: Ja, mit genug Mühe
          feedback: Das hoffte man bis 1931.
        - label: Nur die einfachen nicht
          feedback: Es liegt nicht an der Schwierigkeit.
    hints:
      - Ein 25-Jähriger erschütterte 1931 die Mathematik.
    explanation: "Kurt Gödel zeigte: Es gibt wahre Sätze ohne Beweis."


  - kind: explain
    id: s1
    body: |
      Kurt Gödel konstruierte 1931 einen mathematischen Satz, der sinngemäß sagt: **»Ich bin nicht beweisbar.«** Ist das System widerspruchsfrei, dann ist dieser Satz wahr – aber nicht beweisbar.

  - kind: problem
    id: aussage
    widget: choice
    prompt: Was zeigt Gödels Unvollständigkeitssatz?
    params:
      options:
        - { label: "In jedem ausreichend starken System gibt es wahre, aber unbeweisbare Aussagen.", correct: true }
        - { label: Die Mathematik ist voller Fehler., feedback: "Es geht nicht um Fehler, sondern um prinzipielle Grenzen des Beweisens." }
        - { label: Man kann gar nichts beweisen., feedback: "Fast alles Alltägliche bleibt beweisbar – nur nie restlos alles." }
    hints:
      - Wahr und beweisbar sind nicht dasselbe.
    explanation: Kein Regelwerk erfasst alle mathematischen Wahrheiten.

  - kind: problem
    id: verwandt
    widget: match
    prompt: Welche Idee steckt hinter welchem Ergebnis?
    params:
      pairs:
        - { left: Lügner-Paradox, right: Satz gegen sich }
        - { left: Gödel, right: Satz gegen Beweis }
        - { left: Turing, right: Programm gegen Prognose }
    hints:
      - Alle drei spielen mit Selbstbezug.
    explanation: Derselbe Trick des Selbstbezugs zieht Grenzen für Sprache, Beweise und Computer.

  - kind: problem
    id: axiom
    widget: choice
    prompt: Man nimmt Gödels Satz einfach als neues Axiom auf. Ist das System dann vollständig?
    params:
      options:
        - { label: Nein – man kann wieder einen neuen solchen Satz bauen., correct: true }
        - { label: Ja, feedback: "Für das erweiterte System gibt es einen neuen unbeweisbaren Satz." }
    hints:
      - Gilt Gödels Satz auch für das neue System?
    explanation: Die Lücke wandert mit – Vollständigkeit bleibt für immer unerreichbar.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Wie brachte Gödel einen Satz über Zahlen dazu, über Beweise zu reden?
    params:
      options:
        - label: Er gab jeder Formel und jedem Beweis eine Nummer – so werden Aussagen über Beweise zu Aussagen über Zahlen
          correct: true
        - label: Er erfand eine neue Sprache
          feedback: Er blieb beim Rechnen mit Zahlen.
        - label: Er benutzte einen Computer
          feedback: Die gab es 1931 noch nicht.
    hints:
      - Ähnlich wie ein Computer Text als Zahlen speichert.
    explanation: "Die **Gödelnummerierung**. Dieselbe Idee steckt in jedem Computer: Programme sind Daten."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gödels **zweiter** Unvollständigkeitssatz sagt …?
    params:
      options:
        - label: Ein widerspruchsfreies System kann seine eigene Widerspruchsfreiheit nicht beweisen
          correct: true
        - label: Die Mathematik ist widersprüchlich
          feedback: Das behauptet der Satz nicht.
        - label: Alles Wahre ist beweisbar
          feedback: Der erste Satz zeigt das Gegenteil.
    hints:
      - Kann man sich selbst das Zeugnis ausstellen?
    explanation: Hilberts Traum, die Mathematik aus sich selbst heraus abzusichern, war damit unerfüllbar.
    difficulty: 3

srs:
  cards_from: [aussage, axiom]
