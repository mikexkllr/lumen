id: logic.limits.goedel
type: concept
title: Gödels Unvollständigkeit
summary: Wahr, aber unbeweisbar.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      Kurt Gödel konstruierte 1931 einen mathematischen Satz, der sinngemäß sagt: **»Ich bin nicht beweisbar.«** Ist das System widerspruchsfrei, dann ist dieser Satz wahr – aber nicht beweisbar.

  - kind: problem
    id: aussage
    widget: choice
    prompt: Was zeigt Gödels Unvollständigkeitssatz?
    params:
      options:
        - { label: "In jedem ausreichend starken System gibt es wahre, aber unbeweisbare Aussagen.", correct: true }
        - { label: Die Mathematik ist voller Fehler., feedback: "Es geht nicht um Fehler, sondern um prinzipielle Grenzen des Beweisens." }
        - { label: Man kann gar nichts beweisen., feedback: "Fast alles Alltägliche bleibt beweisbar – nur nie restlos alles." }
    hints:
      - Wahr und beweisbar sind nicht dasselbe.
    explanation: Kein Regelwerk erfasst alle mathematischen Wahrheiten.

  - kind: problem
    id: verwandt
    widget: match
    prompt: Welche Idee steckt hinter welchem Ergebnis?
    params:
      pairs:
        - { left: Lügner-Paradox, right: Satz gegen sich }
        - { left: Gödel, right: Satz gegen Beweis }
        - { left: Turing, right: Programm gegen Prognose }
    hints:
      - Alle drei spielen mit Selbstbezug.
    explanation: Derselbe Trick des Selbstbezugs zieht Grenzen für Sprache, Beweise und Computer.

  - kind: problem
    id: axiom
    widget: choice
    prompt: Man nimmt Gödels Satz einfach als neues Axiom auf. Ist das System dann vollständig?
    params:
      options:
        - { label: Nein – man kann wieder einen neuen solchen Satz bauen., correct: true }
        - { label: Ja, feedback: "Für das erweiterte System gibt es einen neuen unbeweisbaren Satz." }
    hints:
      - Gilt Gödels Satz auch für das neue System?
    explanation: Die Lücke wandert mit – Vollständigkeit bleibt für immer unerreichbar.

srs:
  cards_from: [aussage, axiom]
