id: logic.limits.goedel
type: concept
title: Gödel's Incompleteness
summary: True, but unprovable.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A genius in Vienna
    body: In 1931, a young man in Vienna put mathematics itself to the test. Uncover the cards and meet Kurt Gödel – one of the greatest **logicians** of all time.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 📜
            front: Hilbert's great wish
            back: David Hilbert wanted to show that every mathematical question can be settled by fixed rules.
          - icon: 🎓
            front: In his mid-twenties
            back: Gödel was in his mid-twenties when he published his most famous proof in 1931.
          - icon: 🚶
            front: Walks with Einstein
            back: In Princeton, Gödel and Albert Einstein walked to work together almost every day for years.
          - icon: ⚖️
            front: Before the judge
            back: At his US citizenship hearing, Gödel wanted to explain a loophole in the constitution to the judge.

  - kind: problem
    id: hook
    widget: choice
    prompt: "What do you think: can every true statement in mathematics also be proved?"
    params:
      options:
        - label: No
          correct: true
        - label: Yes, with enough effort
          feedback: That was the hope until 1931.
        - label: Only not the simple ones
          feedback: Difficulty is not the issue.
    hints:
      - In 1931 a 25-year-old shook mathematics.
    explanation: "Kurt Gödel showed: there are true statements without proof."

  - kind: explain
    id: s1
    body: |
      In 1931, Kurt Gödel constructed a mathematical statement that, in essence, says: **“I am not provable.”** If the system is consistent, this statement is true – but not provable.

  - kind: problem
    id: aussage
    widget: choice
    prompt: What does Gödel's incompleteness theorem show?
    params:
      options:
        - { label: "Every sufficiently strong system has true but unprovable statements.", correct: true }
        - { label: Mathematics is full of errors., feedback: "It is not about errors, but about fundamental limits of proof." }
        - { label: Nothing can be proved at all., feedback: "Almost everything ordinary remains provable – just never absolutely everything." }
    hints:
      - True and provable are not the same thing.
    explanation: No set of rules captures all mathematical truths.

  - kind: problem
    id: verwandt
    widget: match
    prompt: Which idea lies behind which result?
    params:
      pairs:
        - { left: Liar paradox, right: Sentence against itself }
        - { left: Gödel, right: Sentence against proof }
        - { left: Turing, right: Program against prediction }
    hints:
      - All three play with self-reference.
    explanation: The same trick of self-reference sets limits for language, proofs, and computers.

  - kind: problem
    id: axiom
    widget: choice
    prompt: You simply add Gödel's statement as a new axiom. Is the system complete then?
    params:
      options:
        - { label: No – you can build a new such statement again., correct: true }
        - { label: "Yes", feedback: "The extended system has a new unprovable statement." }
    hints:
      - Does Gödel's theorem apply to the new system too?
    explanation: The gap moves along – completeness stays out of reach forever.

  - kind: problem
    id: mix-c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "Gödel’s sentence says: “I am not [[provable]].” If the system is consistent, the sentence is [[true]]."
      distractors:
        - readable
        - "false"

  - kind: problem
    id: mix-c2
    widget: buckets
    prompt: What follows from Gödel’s result?
    params:
      buckets:
        - id: b1
          label: Follows
        - id: b2
          label: Does not follow
      items:
        - label: There are true statements without proof
          bucket: b1
        - label: Mathematics is wrong
          bucket: b2
        - label: New axioms never close all gaps
          bucket: b1
        - label: Nothing can be proved
          bucket: b2
    hints:
      - Gödel shows a limit – not an error.
    explanation: Almost everything stays provable. But never everything.

  - kind: problem
    id: mix-c3
    widget: order
    prompt: Order the discoveries by time.
    params:
      items:
        - label: Hilbert demands proofs for everything (1900)
        - label: Russell finds his paradox (1901)
        - label: Gödel shows incompleteness (1931)
        - label: Turing shows the halting problem (1936)
    hints:
      - The years help.
    explanation: In just 36 years mathematics found its own limits.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: How did Gödel get a sentence about numbers to talk about proofs?
    params:
      options:
        - label: He gave every formula and every proof a number – so statements about proofs become statements about numbers
          correct: true
        - label: He invented a new language
          feedback: He stayed with plain number maths.
        - label: He used a computer
          feedback: They did not exist in 1931.
    hints:
      - Much as a computer stores text as numbers.
    explanation: "**Gödel numbering**. The same idea is in every computer: programs are data."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: match
    prompt: What does each term mean?
    params:
      pairs:
        - left: complete
          right: A or ¬A is always provable
        - left: consistent
          right: never both A and ¬A provable
        - left: axiom
          right: assumed without proof
        - left: decidable
          right: a method says yes or no
      leftTitle: term
      rightTitle: meaning
    hints:
      - "Complete means: no question remains open."
      - "Consistent means: you cannot prove both."
    explanation: Gödel showed that a consistent system containing arithmetic is never complete. Soon after, Turing showed that arithmetic is not decidable either.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: Gödel turns strings of symbols into numbers. The sequence (2, 1, 3) becomes 2² · 3¹ · 5³. Which number is that?
    answer:
      value: 1500
    hints:
      - 2² = 4, 3¹ = 3, 5³ = 125.
      - Multiply 4 · 3 · 125.
    explanation: 4 · 3 · 125 = 1500. Because prime factorisation is unique, you can recover the sequence from 1500. So every proof becomes a number – and statements about proofs become statements about numbers.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gödel’s **second** incompleteness theorem says …?
    params:
      options:
        - label: A consistent system cannot prove its own consistency
          correct: true
        - label: Mathematics is inconsistent
          feedback: The theorem does not claim that.
        - label: Everything true is provable
          feedback: The first theorem shows the opposite.
    hints:
      - Can you issue your own certificate?
    explanation: Hilbert’s dream of securing mathematics from within was thereby unfulfillable.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: What does **not** follow from Gödel's incompleteness theorem?
    params:
      options:
        - label: That mathematics is unreliable and everything is relative.
          correct: true
        - label: That there are true statements unprovable in the system.
          feedback: That is exactly what follows – for consistent systems containing arithmetic.
        - label: That no such system proves its own consistency.
          feedback: That is the second incompleteness theorem.
    hints:
      - Proven theorems stay proven. So what does Gödel not change?
      - The theorem only applies to certain formal systems.
    explanation: Gödel shows a limit of formal systems, not arbitrariness. Every proven theorem stays valid. Many popular readings greatly overstate what the theorem says.
    difficulty: 3

srs:
  cards_from: [aussage, axiom]
