id: logic.limits.liar
type: concept
title: Das Lügner-Paradox
summary: Ein Satz über sich selbst.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: satz
    widget: choice
    body: "»Dieser Satz ist falsch.«"
    prompt: Ist der Satz wahr oder falsch?
    params:
      options:
        - { label: Keins von beiden geht widerspruchsfrei., correct: true }
        - { label: Wahr, feedback: "Dann stimmt, was er sagt – also wäre er falsch." }
        - { label: Falsch, feedback: "Dann stimmt das Gegenteil – also wäre er wahr." }
    hints:
      - Probiere beide Annahmen durch.
    explanation: Jede Annahme führt zu ihrem Gegenteil – ein echtes Paradox.

  - kind: explain
    id: s2
    body: |
      Das Problem ist der **Selbstbezug**: Der Satz redet über sich selbst. Selbstbezug steckt hinter vielen tiefen Ergebnissen – von Russell über Gödel bis Turing.

  - kind: problem
    id: barbier
    widget: choice
    body: Ein Barbier rasiert genau alle Männer im Dorf, die sich nicht selbst rasieren.
    prompt: Rasiert sich der Barbier selbst?
    params:
      options:
        - { label: Weder ja noch nein ist möglich., correct: true }
        - { label: Ja, feedback: "Dann gehört er zu denen, die er nicht rasieren darf." }
        - { label: Nein, feedback: "Dann gehört er zu denen, die er rasieren muss." }
    hints:
      - Gehört der Barbier zu seinen eigenen Kunden?
    explanation: So einen Barbier kann es schlicht nicht geben.

  - kind: problem
    id: harmlos
    widget: choice
    prompt: Welcher Satz mit Selbstbezug ist harmlos?
    params:
      options:
        - { label: »Dieser Satz hat fünf Wörter.«, correct: true }
        - { label: »Dieser Satz ist falsch.«, feedback: "Das ist genau das Paradox." }
    hints:
      - Zähle nach.
    explanation: Selbstbezug ist nicht immer schlimm – nur wenn er sich selbst verneint.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Satz A: »Satz B ist wahr.« Satz B: »Satz A ist falsch.« Was passiert?"
    params:
      options:
        - label: Ein Paradox – obwohl keiner der Sätze über sich selbst spricht
          correct: true
        - label: Beide sind wahr
          feedback: Dann wäre A falsch – Widerspruch.
        - label: Beide sind falsch
          feedback: Dann wäre B wahr – Widerspruch.
    hints:
      - Nimm an, A ist wahr, und folge der Kette.
    explanation: Der Selbstbezug kann sich über einen Umweg verstecken. Direkte Verbote helfen also nicht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Alfred Tarski löste das Lügner-Paradox so: »wahr« darf nicht in der Sprache selbst definiert werden. Was heißt das?"
    params:
      options:
        - label: Über die Wahrheit von Sätzen einer Sprache spricht man in einer höheren Sprache
          correct: true
        - label: Niemand darf mehr von Wahrheit reden
          feedback: Man darf – nur eine Ebene darüber.
        - label: Alle Sätze sind wahr
          feedback: Davon ist keine Rede.
    hints:
      - "Denk an Ebenen: Sprache und Sprache über die Sprache."
    explanation: "Die Trennung von **Objekt- und Metasprache**. Der Preis: Keine Sprache kann ihre eigene Wahrheit vollständig fassen."
    difficulty: 3

srs:
  cards_from: [satz, barbier]
