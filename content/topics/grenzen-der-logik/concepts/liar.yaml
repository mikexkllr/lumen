id: logic.limits.liar
type: concept
title: Das Lügner-Paradox
summary: Ein Satz über sich selbst.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: satz
    widget: choice
    body: "»Dieser Satz ist falsch.«"
    prompt: Ist der Satz wahr oder falsch?
    params:
      options:
        - { label: Keins von beiden geht widerspruchsfrei., correct: true }
        - { label: Wahr, feedback: "Dann stimmt, was er sagt – also wäre er falsch." }
        - { label: Falsch, feedback: "Dann stimmt das Gegenteil – also wäre er wahr." }
    hints:
      - Probiere beide Annahmen durch.
    explanation: Jede Annahme führt zu ihrem Gegenteil – ein echtes Paradox.

  - kind: explain
    id: s2
    body: |
      Das Problem ist der **Selbstbezug**: Der Satz redet über sich selbst. Selbstbezug steckt hinter vielen tiefen Ergebnissen – von Russell über Gödel bis Turing.

  - kind: problem
    id: barbier
    widget: choice
    body: Ein Barbier rasiert genau alle Männer im Dorf, die sich nicht selbst rasieren.
    prompt: Rasiert sich der Barbier selbst?
    params:
      options:
        - { label: Weder ja noch nein ist möglich., correct: true }
        - { label: Ja, feedback: "Dann gehört er zu denen, die er nicht rasieren darf." }
        - { label: Nein, feedback: "Dann gehört er zu denen, die er rasieren muss." }
    hints:
      - Gehört der Barbier zu seinen eigenen Kunden?
    explanation: So einen Barbier kann es schlicht nicht geben.

  - kind: problem
    id: harmlos
    widget: choice
    prompt: Welcher Satz mit Selbstbezug ist harmlos?
    params:
      options:
        - { label: »Dieser Satz hat fünf Wörter.«, correct: true }
        - { label: »Dieser Satz ist falsch.«, feedback: "Das ist genau das Paradox." }
    hints:
      - Zähle nach.
    explanation: Selbstbezug ist nicht immer schlimm – nur wenn er sich selbst verneint.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Paradox oder harmlos?
    params:
      buckets:
        - id: b1
          label: Paradox
        - id: b2
          label: Harmlos
      items:
        - label: »Dieser Satz ist falsch.«
          bucket: b1
        - label: »Dieser Satz hat fünf Wörter.«
          bucket: b2
        - label: »Ich lüge gerade.«
          bucket: b1
        - label: »Dieser Satz steht hier.«
          bucket: b2
    hints:
      - Selbstbezug allein ist harmlos. Gefährlich wird er mit »falsch«.
    explanation: Ein Satz darf über sich reden. Nur seine eigene Wahrheit darf er nicht bestreiten.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Das Problem ist der [[Selbstbezug]]: Der Satz redet über sich [[selbst]]."
      distractors:
        - Zufall
        - andere

  - kind: problem
    id: mix-c3
    widget: order
    prompt: Folge der Schleife von »Dieser Satz ist falsch«.
    params:
      items:
        - label: Angenommen, der Satz ist wahr
        - label: "Dann stimmt, was er sagt: Er ist falsch"
        - label: Ist er falsch, stimmt seine Aussage nicht
        - label: Also ist er wahr – und alles beginnt neu
    hints:
      - Jeder Schritt dreht das Ergebnis um.
    explanation: Die Schleife endet nie. Darum hat der Satz keinen Wahrheitswert.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: "Satz A: »Satz B ist wahr.« Satz B: »Satz A ist falsch.« Was passiert?"
    params:
      options:
        - label: Ein Paradox – obwohl keiner der Sätze über sich selbst spricht
          correct: true
        - label: Beide sind wahr
          feedback: Dann wäre A falsch – Widerspruch.
        - label: Beide sind falsch
          feedback: Dann wäre B wahr – Widerspruch.
    hints:
      - Nimm an, A ist wahr, und folge der Kette.
    explanation: Der Selbstbezug kann sich über einen Umweg verstecken. Direkte Verbote helfen also nicht.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: Ist der Satz »Dieser Satz ist wahr« ein Paradox?
    params:
      options:
        - label: Kein Widerspruch – aber nichts legt fest, ob er wahr oder falsch ist.
          correct: true
        - label: Ja, genau wie der Lügner.
          feedback: "Probier beide Fälle: Wahr passt, falsch passt auch. Es gibt keinen Widerspruch."
        - label: Nein, er ist eindeutig wahr.
          feedback: Was macht ihn wahr? Nur er selbst – das ist kein Grund.
    hints:
      - Nimm an, er ist wahr. Passt das? Nimm an, er ist falsch. Passt das auch?
      - Beim Lügner passt keiner der beiden Fälle. Hier passen beide.
    explanation: "Der **Wahrsager-Satz** ist das Gegenstück zum Lügner: Er ist nicht widersprüchlich, sondern unbestimmt. Selbstbezug kann also zu zwei Arten von Problemen führen."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: "Ein Wort heißt »heterologisch«, wenn es nicht auf sich selbst zutrifft: »lang« ist kurz, »einsilbig« hat vier Silben. Ist »heterologisch« heterologisch?"
    params:
      options:
        - label: Weder ja noch nein ist widerspruchsfrei möglich.
          correct: true
        - label: Ja.
          feedback: Dann trifft es auf sich selbst zu – also ist es nicht heterologisch.
        - label: Nein.
          feedback: Dann trifft es nicht auf sich zu – genau das heißt heterologisch.
    hints:
      - "Prüfe den Fall »ja«: Trifft das Wort dann auf sich selbst zu?"
      - Und der Fall »nein«?
    explanation: "Das ist das **Grelling-Paradox**. Es hat dieselbe Form wie Russells Menge: Etwas wird über die Eigenschaft definiert, sich selbst nicht zu erfüllen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Alfred Tarski löste das Lügner-Paradox so: »wahr« darf nicht in der Sprache selbst definiert werden. Was heißt das?"
    params:
      options:
        - label: Über die Wahrheit von Sätzen einer Sprache spricht man in einer höheren Sprache
          correct: true
        - label: Niemand darf mehr von Wahrheit reden
          feedback: Man darf – nur eine Ebene darüber.
        - label: Alle Sätze sind wahr
          feedback: Davon ist keine Rede.
    hints:
      - "Denk an Ebenen: Sprache und Sprache über die Sprache."
    explanation: "Die Trennung von **Objekt- und Metasprache**. Der Preis: Keine Sprache kann ihre eigene Wahrheit vollständig fassen."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Was passiert, wenn man im Lügner-Satz »wahr« durch »beweisbar« ersetzt: »Dieser Satz ist nicht beweisbar«?"
    params:
      options:
        - label: Kein Paradox mehr – sondern ein wahrer Satz, den man nicht beweisen kann.
          correct: true
        - label: Wieder ein Paradox.
          feedback: Ist er unbeweisbar, dann stimmt er einfach. Das ist kein Widerspruch.
        - label: Ein falscher Satz.
          feedback: Dann wäre er beweisbar – und ein Beweis eines falschen Satzes macht das System widersprüchlich.
    hints:
      - Angenommen, der Satz wäre beweisbar. Was würde er dann behaupten?
      - Ein widerspruchsfreies System beweist nichts Falsches.
    explanation: "Genau das ist **Gödels Idee**: Er baute diesen Satz in der Sprache der Zahlen. Aus dem Lügner-Paradox wird so ein Satz über die Grenzen des Beweisens."
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum »Dieser Satz ist falsch« weder wahr noch falsch sein kann.
    params:
      keywords:
        - - wahr
          - "true"
        - - falsch
          - "false"
        - - widerspruch
          - umgekehrt
          - contradiction
          - the other way
      sample: Ist der Satz wahr, dann stimmt, was er sagt – also ist er falsch. Ist er falsch, dann stimmt das Gegenteil – also ist er wahr. Beides führt zum Widerspruch.
    difficulty: 3

srs:
  cards_from: [satz, barbier]
