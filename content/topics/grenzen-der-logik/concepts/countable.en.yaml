id: logic.limits.countable
type: concept
title: Countably Infinite
summary: As many fractions as whole numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Counting without numbers
    body: Can you compare infinitely many things without counting them? Yes – with **pairs**. Uncover the cards and discover the trick mathematicians use to measure infinities.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🪑
            front: Chairs and guests
            back: If every guest sits on a chair and none is left free, there are equally many – no counting needed.
          - icon: 🖐️
            front: How children count
            back: Small children match each thing to a finger. Mathematicians compare infinite sets the same way.
          - icon: 🏷️
            front: A number for everyone
            back: "Countable means: every element gets a number 1, 2, 3 … – and none is forgotten."
          - icon: 📖
            front: All the words in the world
            back: "Even all possible words can be numbered: first the short ones, then the longer ones."

  - kind: problem
    id: hook
    widget: choice
    prompt: "Which are there more of: the numbers 1, 2, 3 … or the even numbers 2, 4, 6 …?"
    params:
      options:
        - label: Equally many – strange as it sounds
          correct: true
        - label: More of 1, 2, 3 …
          feedback: With infinite sets intuition deceives.
        - label: More even numbers
          feedback: There is no reason for that.
    hints:
      - Each number has exactly one double.
    explanation: "You can pair them up: 1 with 2, 2 with 4, 3 with 6 …"

  - kind: explain
    id: s1
    body: |
      An infinite set is **countable** if you can number its elements: 1st, 2nd, 3rd, … – without skipping any. The even numbers are countable, and so are the integers.

  - kind: problem
    id: ganze
    widget: choice
    prompt: How do you number all the integers, including the negative ones?
    params:
      options:
        - { label: "0, 1, −1, 2, −2, 3, −3, …", correct: true }
        - { label: "First all the positive ones, then all the negative ones", feedback: "You would never finish the positive ones – the negative ones would never get a turn." }
    hints:
      - You have to alternate.
    explanation: In a zigzag, every integer gets a fixed number.

  - kind: problem
    id: brueche
    widget: choice
    prompt: Are there more fractions than natural numbers?
    params:
      options:
        - { label: No – you can number all the fractions., correct: true }
        - { label: Yes – there are infinitely many fractions between any two numbers., feedback: "That is true, but they can still be put into a list." }
    hints:
      - Write all the fractions in a table and walk through it diagonally.
    explanation: Cantor found a zigzag order through the table of all fractions.

  - kind: problem
    id: nummer
    widget: numeric
    prompt: "In the list 0, 1, −1, 2, −2, 3, −3, … – at which position is {{k}}?"
    params: { placeholder: "Position" }
    answer: { value: "{{2 * k}}" }
    hints:
      - "1 is at position 2, 2 at position 4, 3 at position 6 …"
    explanation: "The positive number {{k}} is at position {{2 * k}}."
    variants:
      params: { k: "int[4,50]" }
      defaults: { k: 10 }

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Can the set be numbered through?
    params:
      buckets:
        - id: b1
          label: Countable
        - id: b2
          label: Not countable
      items:
        - label: The even numbers
          bucket: b1
        - label: The fractions
          bucket: b1
        - label: The real numbers
          bucket: b2
        - label: The integers
          bucket: b1
        - label: All infinite 0-1 sequences
          bucket: b2
    hints:
      - Is there a list in which every element gets its turn?
    explanation: Fractions can be listed in a zigzag. For real numbers every list fails.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Cantor’s pairing for fractions zigzags: 1/1, then 1/2, 2/1, then 3/1, 2/2, 1/3 … On the n-th diagonal numerator plus denominator is n + 1. How many fractions are on the 5th diagonal?"
    answer:
      value: 5
    hints:
      - "Numerator and denominator add up to 6: 1/5, 2/4, 3/3, 4/2, 5/1."
    explanation: Five. Every diagonal is finite – that is why every fraction eventually gets its turn.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: How many fractions p/q with p, q ≥ 1 have p + q ≤ {{s}}? Unreduced ones like 2/2 count too.
    answer:
      value: "{{(s - 1) * s / 2}}"
    hints:
      - With sum 2 there is 1 fraction, with sum 3 two, with sum 4 three …
      - Add 1 + 2 + … + {{s - 1}}.
    explanation: 1 + 2 + … + {{s - 1}} = {{(s - 1) * s / 2}}. Each diagonal is finite – that is why Cantor's zigzag reaches every fraction after finitely many steps.
    difficulty: 2
    variants:
      params:
        s: int[4,12]
      defaults:
        s: 6

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Algebraic numbers are solutions of equations like 3x² − 2 = 0 with integer coefficients. Are they countable?
    params:
      options:
        - label: Yes – there are countably many such equations, each with finitely many solutions.
          correct: true
        - label: No, they include numbers like √2.
          feedback: Irrational numbers can also be countably many. It depends on how they are described.
        - label: No, there are infinitely many equations.
          feedback: Infinite does not mean uncountable – there are infinitely many fractions too.
    hints:
      - Each equation is a finite list of integers.
      - Finite lists of integers can be numbered.
    explanation: Countably many equations times finitely many solutions stays countable. Since the reals are uncountable, almost all real numbers are not algebraic – they are called transcendental, like π.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Is the set of **all computer programs** countable?
    params:
      options:
        - label: Yes – every program is a finite text, and finite texts can be listed by length
          correct: true
        - label: No – there are infinitely many
          feedback: Infinite does not automatically mean uncountable.
        - label: Nobody knows
          feedback: It is easy to show.
    hints:
      - First list all texts of 1 character, then of 2 characters …
    explanation: Programs are countable, real numbers are not – so there are numbers that **no** program can ever compute.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Every description of a number is a finite text. What follows for the real numbers?
    params:
      options:
        - label: Almost all real numbers can never be described or computed.
          correct: true
        - label: Every real number can be described by a text.
          feedback: There are only countably many texts but uncountably many numbers.
        - label: There are only countably many real numbers.
          feedback: Cantor's proof shows the opposite – only the describable ones are countable.
    hints:
      - How many finite texts are there? Countably many or more?
      - And how many real numbers?
    explanation: Texts and programs are countable, real numbers are not. So computable numbers like π or √2 are a tiny exception.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what "countably infinite" means – with an example.
    params:
      keywords:
        - - nummer
          - durchnummer
          - liste
          - number
          - list
        - - jede
          - keine auslass
          - every
          - none left out
          - missing
        - - unendlich
          - infinite
      sample: "An infinite set is countable if you can number it so every element comes up at some point. The even numbers work: 2 is number 1, 4 is number 2, and so on."
    difficulty: 3

srs:
  cards_from: [ganze, brueche]
