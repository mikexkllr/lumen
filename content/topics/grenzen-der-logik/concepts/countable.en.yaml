id: logic.limits.countable
type: concept
title: Countably Infinite
summary: As many fractions as whole numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      An infinite set is **countable** if you can number its elements: 1st, 2nd, 3rd, … – without skipping any. The even numbers are countable, and so are the integers.

  - kind: problem
    id: ganze
    widget: choice
    prompt: How do you number all the integers, including the negative ones?
    params:
      options:
        - { label: "0, 1, −1, 2, −2, 3, −3, …", correct: true }
        - { label: "First all the positive ones, then all the negative ones", feedback: "You would never finish the positive ones – the negative ones would never get a turn." }
    hints:
      - You have to alternate.
    explanation: In a zigzag, every integer gets a fixed number.

  - kind: problem
    id: brueche
    widget: choice
    prompt: Are there more fractions than natural numbers?
    params:
      options:
        - { label: No – you can number all the fractions., correct: true }
        - { label: Yes – there are infinitely many fractions between any two numbers., feedback: "That is true, but they can still be put into a list." }
    hints:
      - Write all the fractions in a table and walk through it diagonally.
    explanation: Cantor found a zigzag order through the table of all fractions.

  - kind: problem
    id: nummer
    widget: numeric
    prompt: "In the list 0, 1, −1, 2, −2, 3, −3, … – at which position is {{k}}?"
    params: { placeholder: "Position" }
    answer: { value: "{{2 * k}}" }
    hints:
      - "1 is at position 2, 2 at position 4, 3 at position 6 …"
    explanation: "The positive number {{k}} is at position {{2 * k}}."
    variants:
      params: { k: "int[4,50]" }
      defaults: { k: 10 }

srs:
  cards_from: [ganze, brueche]
