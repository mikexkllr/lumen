id: logic.limits.diagonal
type: concept
title: Cantors Diagonaltrick
summary: Es gibt größere Unendlichkeiten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Sind alle Unendlichkeiten gleich groß?
    params:
      options:
        - label: Nein – manche sind größer als andere
          correct: true
        - label: Ja – unendlich ist unendlich
          feedback: Das dachte man bis 1874.
        - label: Die Frage ergibt keinen Sinn
          feedback: Sie lässt sich streng beantworten.
    hints:
      - Georg Cantor hat alle überrascht.
    explanation: Der Beweis ist kurz und einer der schönsten der Mathematik.


  - kind: explain
    id: s1
    body: |
      Angenommen, jemand listet **alle** unendlichen 0-1-Folgen auf. Cantor baut eine neue Folge: Ihre erste Ziffer ist die umgedrehte erste Ziffer der 1. Folge, ihre zweite die umgedrehte zweite Ziffer der 2. Folge, und so weiter.

  - kind: problem
    id: bauen
    widget: choice
    body: "Liste: 1. Folge 0110…, 2. Folge 1111…, 3. Folge 0001…"
    prompt: Wie beginnt Cantors neue Folge?
    params:
      options:
        - { label: "101…", correct: true }
        - { label: "010…", feedback: "Das ist die Diagonale selbst – jede Ziffer wird umgedreht." }
        - { label: "111…", feedback: "Prüf die 2. Stelle der 2. Folge – sie ist 1, also kommt 0." }
    hints:
      - Nimm von der n-ten Folge die n-te Ziffer und dreh sie um.
    explanation: Die Diagonale ist 0, 1, 0 – umgedreht 1, 0, 1.

  - kind: problem
    id: fehlt
    widget: choice
    prompt: Warum kann die neue Folge nirgends in der Liste stehen?
    params:
      options:
        - { label: Sie unterscheidet sich von jeder Folge an mindestens einer Stelle., correct: true }
        - { label: Weil die Liste zu kurz ist., feedback: "Die Liste ist unendlich – trotzdem fehlt diese Folge." }
    hints:
      - Vergleiche sie mit der n-ten Folge an der n-ten Stelle.
    explanation: Also ist jede Liste unvollständig – diese Folgen sind **überabzählbar**.

  - kind: problem
    id: reelle
    widget: choice
    prompt: Was folgt daraus für die reellen Zahlen zwischen 0 und 1?
    params:
      options:
        - { label: Es gibt mehr davon als natürliche Zahlen., correct: true }
        - { label: Es gibt genauso viele wie Brüche., feedback: "Brüche lassen sich auflisten – reelle Zahlen nicht." }
    hints:
      - Jede reelle Zahl hat eine unendliche Ziffernfolge.
    explanation: Unendlich ist nicht gleich unendlich – eine der verblüffendsten Erkenntnisse der Mathematik.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Eine Liste beginnt: 1. Folge 0110…, 2. Folge 1011…, 3. Folge 0010…, 4. Folge 1101… Die Diagonale lautet 0, 0, 1, 1. Wie lautet Cantors neue Folge als vierstellige Binärzahl – in Dezimal?"
    answer:
      value: 12
    hints:
      - "Dreh jede Diagonalziffer um: 1, 1, 0, 0."
    explanation: 1100 binär ist 12. Diese Folge weicht von der n-ten Folge an der n-ten Stelle ab.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gibt es eine Unendlichkeit **zwischen** der der natürlichen und der der reellen Zahlen?
    params:
      options:
        - label: Das lässt sich aus den üblichen Axiomen weder beweisen noch widerlegen
          correct: true
        - label: Ja, sicher
          feedback: Niemand hat eine solche Menge gefunden.
        - label: Nein, sicher nicht
          feedback: Auch das ist nicht beweisbar.
    hints:
      - Gödel zeigte 1940 die eine Hälfte, Cohen 1963 die andere.
    explanation: Die **Kontinuumshypothese** ist unabhängig von den Axiomen. Manche Fragen haben in der Mathematik keine Antwort.
    difficulty: 3

srs:
  cards_from: [fehlt, reelle]
