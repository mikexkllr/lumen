id: logic.limits.diagonal
type: concept
title: Cantors Diagonaltrick
summary: Es gibt größere Unendlichkeiten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Sind alle Unendlichkeiten gleich groß?
    params:
      options:
        - label: Nein – manche sind größer als andere
          correct: true
        - label: Ja – unendlich ist unendlich
          feedback: Das dachte man bis 1874.
        - label: Die Frage ergibt keinen Sinn
          feedback: Sie lässt sich streng beantworten.
    hints:
      - Georg Cantor hat alle überrascht.
    explanation: Der Beweis ist kurz und einer der schönsten der Mathematik.

  - kind: explain
    id: s1
    body: |
      Angenommen, jemand listet **alle** unendlichen 0-1-Folgen auf. Cantor baut eine neue **Folge**: Ihre erste Ziffer ist die umgedrehte erste Ziffer der 1. Folge, ihre zweite die umgedrehte zweite Ziffer der 2. Folge, und so weiter.

  - kind: problem
    id: bauen
    widget: choice
    body: "Liste: 1. Folge 0110…, 2. Folge 1111…, 3. Folge 0001…"
    prompt: Wie beginnt Cantors neue Folge?
    params:
      options:
        - { label: "101…", correct: true }
        - { label: "010…", feedback: "Das ist die Diagonale selbst – jede Ziffer wird umgedreht." }
        - { label: "111…", feedback: "Prüf die 2. Stelle der 2. Folge – sie ist 1, also kommt 0." }
    hints:
      - Nimm von der n-ten Folge die n-te Ziffer und dreh sie um.
    explanation: Die Diagonale ist 0, 1, 0 – umgedreht 1, 0, 1.

  - kind: problem
    id: fehlt
    widget: choice
    prompt: Warum kann die neue Folge nirgends in der Liste stehen?
    params:
      options:
        - { label: Sie unterscheidet sich von jeder Folge an mindestens einer Stelle., correct: true }
        - { label: Weil die Liste zu kurz ist., feedback: "Die Liste ist unendlich – trotzdem fehlt diese Folge." }
    hints:
      - Vergleiche sie mit der n-ten Folge an der n-ten Stelle.
    explanation: Also ist jede Liste unvollständig – diese Folgen sind **überabzählbar**.

  - kind: problem
    id: reelle
    widget: choice
    prompt: Was folgt daraus für die reellen Zahlen zwischen 0 und 1?
    params:
      options:
        - { label: Es gibt mehr davon als natürliche Zahlen., correct: true }
        - { label: Es gibt genauso viele wie Brüche., feedback: "Brüche lassen sich auflisten – reelle Zahlen nicht." }
    hints:
      - Jede reelle Zahl hat eine unendliche Ziffernfolge.
    explanation: Unendlich ist nicht gleich unendlich – eine der verblüffendsten Erkenntnisse der Mathematik.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne Cantors Beweis.
    params:
      items:
        - label: "Annahme: Alle Folgen stehen in einer Liste"
        - label: Lies die Ziffern auf der Diagonale
        - label: Dreh jede dieser Ziffern um
        - label: Die neue Folge fehlt in der Liste
    hints:
      - Erst annehmen, dann bauen, dann den Widerspruch finden.
    explanation: Die Liste sollte vollständig sein – und ist es nicht.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die neue Folge weicht von der n-ten Folge an der [[n-ten]] Stelle ab. Also steht sie [[nirgends]] in der Liste.
      distractors:
        - ersten
        - überall

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Eine Liste beginnt: 1. Folge 0110…, 2. Folge 1011…, 3. Folge 0010…, 4. Folge 1101… Die Diagonale lautet 0, 0, 1, 1. Wie lautet Cantors neue Folge als vierstellige Binärzahl – in Dezimal?"
    answer:
      value: 12
    hints:
      - "Dreh jede Diagonalziffer um: 1, 1, 0, 0."
    explanation: 1100 binär ist 12. Diese Folge weicht von der n-ten Folge an der n-ten Stelle ab.
    difficulty: 2

  - kind: problem
    id: mix-d1
    depth: 2
    widget: numeric
    prompt: Die Diagonale einer Liste lautet 1, 0, 1, 1. Du drehst jede Ziffer um. Wie viele Einsen hat die neue Folge?
    answer:
      value: 1
    hints:
      - Aus 1 wird 0, aus 0 wird 1.
    explanation: Die neue Folge ist 0, 1, 0, 0.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Eine Liste beginnt mit 0,3141…, 0,2718…, 0,1414… und 0,5772… Nimm von der n-ten Zahl die n-te Nachkommastelle und zähle 1 dazu. Welche vier Ziffern entstehen? Gib sie als Zahl ein.
    answer:
      value: 4823
    hints:
      - Die Diagonale lautet 3, 7, 1, 2.
      - "Jede Ziffer plus 1: 4, 8, 2, 3."
    explanation: 0,4823… unterscheidet sich von jeder Zahl der Liste an deren eigener Stelle. Also fehlt sie in der Liste – egal, wie die Liste weitergeht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Gibt es eine Unendlichkeit **zwischen** der der natürlichen und der der reellen Zahlen?
    params:
      options:
        - label: Das lässt sich aus den üblichen Axiomen weder beweisen noch widerlegen
          correct: true
        - label: Ja, sicher
          feedback: Niemand hat eine solche Menge gefunden.
        - label: Nein, sicher nicht
          feedback: Auch das ist nicht beweisbar.
    hints:
      - Gödel zeigte 1940 die eine Hälfte, Cohen 1963 die andere.
    explanation: Die **Kontinuumshypothese** ist unabhängig von den Axiomen. Manche Fragen haben in der Mathematik keine Antwort.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Bei Dezimalzahlen vermeidet man im Diagonaltrick die Ziffern 0 und 9 – man nimmt etwa immer 5 oder 6. Warum?
    params:
      options:
        - label: Weil 0,1999… und 0,2000… dieselbe Zahl sind.
          correct: true
        - label: Weil 0 und 9 keine echten Ziffern sind.
          feedback: Sie sind echte Ziffern – aber sie machen doppelte Schreibweisen möglich.
        - label: Weil sonst die Liste zu lang wird.
          feedback: Die Länge der Liste spielt keine Rolle.
    hints:
      - Wie viel ist 0,999…?
      - Eine Zahl mit zwei Schreibweisen könnte sich nur scheinbar unterscheiden.
    explanation: Manche Zahlen haben zwei Dezimaldarstellungen. Die neue Zahl könnte sonst nur in der **Schreibweise** abweichen und doch in der Liste stehen. Mit 5 und 6 ist das ausgeschlossen.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux Cantors Diagonaltrick: Warum kann keine Liste alle unendlichen 0-1-Folgen enthalten?"
    params:
      keywords:
        - - diagonal
          - n-te
          - nte
          - n-th
        - - umdreh
          - umgedreht
          - ander
          - flip
          - change
          - differ
        - - fehlt
          - nicht in der liste
          - nirgends
          - missing
          - not in the list
          - nowhere
      sample: Ich nehme von der n-ten Folge die n-te Ziffer und drehe sie um. Die neue Folge ist an der n-ten Stelle anders als die n-te Folge. Also fehlt sie in der Liste – keine Liste ist vollständig.
    difficulty: 3

srs:
  cards_from: [fehlt, reelle]
