id: logic.limits.lab
type: concept
title: Infinity Lab
summary: Build a diagonal, number integers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zigzag through the fractions
    body: Are there more fractions than whole numbers? Cantor found a way to number them all. Tap your way from 1/1 along the line in a **zigzag**. Which fraction would come next?
    visual:
      widget: network
      interactive: true
      params:
        mode: path
        start: f11
        end: f41
        aspect: 0.8
        nodes:
          - id: f11
            x: 10
            y: 8
            label: 1/1
          - id: f21
            x: 37
            y: 8
            label: 2/1
          - id: f31
            x: 64
            y: 8
            label: 3/1
          - id: f41
            x: 91
            y: 8
            label: 4/1
          - id: f12
            x: 10
            y: 36
            label: 1/2
          - id: f22
            x: 37
            y: 36
            label: 2/2
          - id: f32
            x: 64
            y: 36
            label: 3/2
          - id: f13
            x: 10
            y: 64
            label: 1/3
          - id: f23
            x: 37
            y: 64
            label: 2/3
          - id: f14
            x: 10
            y: 92
            label: 1/4
        edges:
          - a: f11
            b: f12
          - a: f12
            b: f21
          - a: f21
            b: f31
          - a: f31
            b: f22
          - a: f22
            b: f13
          - a: f13
            b: f14
          - a: f14
            b: f23
          - a: f23
            b: f32
          - a: f32
            b: f41

  - kind: problem
    id: diagonale
    widget: bits
    body: "List: sequence 1 is 011…, sequence 2 is 110…, sequence 3 is 100…"
    prompt: Build Cantor's new sequence – the diagonal digits flipped.
    params: { bits: 3, showValue: false, labels: ["1.", "2.", "3."] }
    answer: { value: 5 }
    hints:
      - Take the n-th digit of the n-th sequence and flip it.
    explanation: The diagonal is 0, 1, 0 – flipped, 1, 0, 1. This sequence appears nowhere in the list.

  - kind: problem
    id: zickzack
    widget: order
    prompt: Put the integers in Cantor's zigzag order.
    params:
      items:
        - { label: "0" }
        - { label: "1" }
        - { label: "−1" }
        - { label: "2" }
        - { label: "−2" }
    hints:
      - Alternate positive and negative, moving outward from zero.
    explanation: This way every integer gets a number – they are countable.

  - kind: problem
    id: paradoxe
    widget: match
    prompt: What is the core of each paradox?
    params:
      pairs:
        - { left: Liar, right: Sentence about itself }
        - { left: Barber, right: Rule includes itself }
        - { left: Hilbert's Hotel, right: Infinity plus one }
    hints:
      - Two are about self-reference, one is about infinity.
    explanation: Self-reference and infinity – the two great sources of logical surprises.

  - kind: problem
    id: la-d1
    depth: 2
    widget: order
    prompt: Turing shows that no program H can tell for every program whether it halts. Put the proof in order.
    params:
      items:
        - label: Suppose H exists.
        - label: "Build D: D asks H whether P halts on input P."
        - label: If H says "halts", D runs forever. Otherwise D halts.
        - label: "Run D on itself: D halts exactly when D does not halt."
        - label: Contradiction – so H does not exist.
    hints:
      - Like every proof by contradiction, it begins with an assumption.
      - D always does the opposite of what H predicts.
    explanation: 'This is the halting problem. D is the diagonal: it contradicts H exactly at the spot "D on input D". The same idea as with Cantor and Gödel.'
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: What does the halting problem mean in practice?
    params:
      options:
        - label: No program can reliably check **every** program for infinite loops.
          correct: true
        - label: No program can ever say anything about another program.
          feedback: For many individual programs it works fine – just not for all.
        - label: Computers will solve it with more power.
          feedback: The proof holds for every computer, however fast.
    hints:
      - The proof says "not for all", not "for none".
      - Does computing time play a part in the proof?
    explanation: "So checking tools work with approximations: they sometimes warn too much or miss something. A perfect check is logically impossible."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Explain to Lux in your own words what Gödel discovered about mathematics.
    params:
      keywords:
        - - wahr
          - "true"
        - - beweis
          - bewiesen
          - beweisbar
          - prove
          - proof
          - provable
        - - system
          - regeln
          - axiom
          - rules
        - - nicht
          - grenze
          - unvollständig
          - cannot
          - limit
          - incomplete
      min: 3
      sample: In every consistent system of rules strong enough for arithmetic there are statements that are true but cannot be proved within that system. So mathematics is incomplete.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Can there be a virus scanner that recognises **every** malicious program for sure and never raises a false alarm?
    params:
      options:
        - label: No – it could then be used to solve the halting problem.
          correct: true
        - label: Yes, with enough training examples.
          feedback: Examples help with known cases, not with every possible program.
        - label: Yes, if it runs every program once.
          feedback: Some programs only turn malicious after a long time – or never finish.
    hints:
      - '"Is malicious" can mean: "eventually reaches this line".'
      - Whether a program ever reaches a line is as hard as the halting problem.
    explanation: By Rice's theorem, every non-trivial question about what programs do is undecidable. So there are always gaps or false alarms – even with AI.
    difficulty: 3

srs:
  cards_from: [diagonale, zickzack]
