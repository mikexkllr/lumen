id: logic.limits.countable
type: concept
title: Abzählbar unendlich
summary: Gleich viele Brüche wie Zahlen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Wovon gibt es mehr: von den Zahlen 1, 2, 3 … oder von den geraden Zahlen 2, 4, 6 …?"
    params:
      options:
        - label: Gleich viele – so seltsam das klingt
          correct: true
        - label: Mehr von 1, 2, 3 …
          feedback: Bei unendlichen Mengen täuscht das Gefühl.
        - label: Mehr gerade Zahlen
          feedback: Dafür gibt es keinen Grund.
    hints:
      - Zu jeder Zahl gehört genau ihr Doppeltes.
    explanation: "Man kann sie paarweise zuordnen: 1 zu 2, 2 zu 4, 3 zu 6 …"

  - kind: explain
    id: s1
    body: |
      Eine unendliche Menge heißt **abzählbar**, wenn man ihre Elemente durchnummerieren kann: 1., 2., 3., … – ohne eines auszulassen. Die geraden Zahlen sind abzählbar, die ganzen Zahlen auch.

  - kind: problem
    id: ganze
    widget: choice
    prompt: Wie nummeriert man alle ganzen Zahlen, auch die negativen?
    params:
      options:
        - { label: "0, 1, −1, 2, −2, 3, −3, …", correct: true }
        - { label: "Erst alle positiven, dann alle negativen", feedback: "Mit den positiven wird man nie fertig – die negativen kämen nie dran." }
    hints:
      - Man muss abwechseln.
    explanation: Im Zickzack bekommt jede ganze Zahl eine feste Nummer.

  - kind: problem
    id: brueche
    widget: choice
    prompt: Gibt es mehr Brüche als natürliche Zahlen?
    params:
      options:
        - { label: Nein – man kann alle Brüche durchnummerieren., correct: true }
        - { label: Ja – zwischen zwei Zahlen liegen unendlich viele Brüche., feedback: "Das stimmt, aber trotzdem lassen sie sich in eine Liste bringen." }
    hints:
      - Schreib alle Brüche in eine Tabelle und lauf sie diagonal ab.
    explanation: Cantor fand eine Zickzack-Reihenfolge durch die Tabelle aller Brüche.

  - kind: problem
    id: nummer
    widget: numeric
    prompt: "In der Liste 0, 1, −1, 2, −2, 3, −3, … – an welcher Stelle steht {{k}}?"
    params: { placeholder: "Stelle" }
    answer: { value: "{{2 * k}}" }
    hints:
      - "1 steht an Stelle 2, 2 an Stelle 4, 3 an Stelle 6 …"
    explanation: "Die positive Zahl {{k}} steht an Stelle {{2 * k}}."
    variants:
      params: { k: "int[4,50]" }
      defaults: { k: 10 }

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Lässt sich die Menge durchnummerieren?
    params:
      buckets:
        - id: b1
          label: Abzählbar
        - id: b2
          label: Nicht abzählbar
      items:
        - label: Die geraden Zahlen
          bucket: b1
        - label: Die Brüche
          bucket: b1
        - label: Die reellen Zahlen
          bucket: b2
        - label: Die ganzen Zahlen
          bucket: b1
        - label: Alle unendlichen 0-1-Folgen
          bucket: b2
    hints:
      - Gibt es eine Liste, in der jedes Element irgendwann drankommt?
    explanation: Brüche lassen sich im Zickzack auflisten. Bei reellen Zahlen scheitert jede Liste.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Cantors Paarung für die Brüche läuft im Zickzack: 1/1, dann 1/2, 2/1, dann 3/1, 2/2, 1/3 … Auf der n-ten Diagonale ist die Summe aus Zähler und Nenner n + 1. Wie viele Brüche stehen auf der 5. Diagonale?"
    answer:
      value: 5
    hints:
      - "Zähler und Nenner ergeben zusammen 6: 1/5, 2/4, 3/3, 4/2, 5/1."
    explanation: Fünf. Jede Diagonale ist endlich – darum kommt jeder Bruch irgendwann dran.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Wie viele Brüche p/q mit p, q ≥ 1 haben p + q ≤ {{s}}? Ungekürzte wie 2/2 zählen mit.
    answer:
      value: "{{(s - 1) * s / 2}}"
    hints:
      - Bei Summe 2 gibt es 1 Bruch, bei Summe 3 zwei, bei Summe 4 drei …
      - Addiere 1 + 2 + … + {{s - 1}}.
    explanation: 1 + 2 + … + {{s - 1}} = {{(s - 1) * s / 2}}. Jede Diagonale ist **endlich** – darum kommt Cantors Zickzack an jedem Bruch nach endlich vielen Schritten vorbei.
    difficulty: 2
    variants:
      params:
        s: int[4,12]
      defaults:
        s: 6

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Algebraische Zahlen sind Lösungen von Gleichungen wie 3x² − 2 = 0 mit ganzzahligen Koeffizienten. Sind sie abzählbar?
    params:
      options:
        - label: Ja – es gibt abzählbar viele solche Gleichungen, jede mit endlich vielen Lösungen.
          correct: true
        - label: Nein, dazu gehören ja Zahlen wie √2.
          feedback: Auch irrationale Zahlen können abzählbar viele sein. Es kommt auf die Beschreibung an.
        - label: Nein, es sind ja unendlich viele Gleichungen.
          feedback: Unendlich heißt nicht überabzählbar – Brüche sind auch unendlich viele.
    hints:
      - Jede Gleichung ist eine endliche Liste ganzer Zahlen.
      - Endliche Listen ganzer Zahlen kann man durchnummerieren.
    explanation: Abzählbar viele Gleichungen mal endlich viele Lösungen bleibt **abzählbar**. Da die reellen Zahlen überabzählbar sind, sind fast alle reellen Zahlen nicht algebraisch – sie heißen transzendent, etwa π.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ist die Menge **aller Computerprogramme** abzählbar?
    params:
      options:
        - label: Ja – jedes Programm ist ein endlicher Text, und endliche Texte lassen sich der Länge nach auflisten
          correct: true
        - label: Nein – es gibt unendlich viele
          feedback: Unendlich heißt nicht automatisch überabzählbar.
        - label: Das weiß niemand
          feedback: Es ist leicht zu zeigen.
    hints:
      - Liste erst alle Texte mit 1 Zeichen auf, dann mit 2 Zeichen …
    explanation: Programme sind abzählbar, reelle Zahlen nicht – also gibt es Zahlen, die **kein** Programm je berechnen kann.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Jede Beschreibung einer Zahl ist ein endlicher Text. Was folgt daraus für die reellen Zahlen?
    params:
      options:
        - label: Fast alle reellen Zahlen lassen sich nie beschreiben oder berechnen.
          correct: true
        - label: Man kann jede reelle Zahl durch einen Text beschreiben.
          feedback: Es gibt nur abzählbar viele Texte, aber überabzählbar viele Zahlen.
        - label: Es gibt nur abzählbar viele reelle Zahlen.
          feedback: Cantors Beweis zeigt das Gegenteil – nur die beschreibbaren sind abzählbar.
    hints:
      - Wie viele endliche Texte gibt es? Abzählbar oder mehr?
      - Und wie viele reelle Zahlen?
    explanation: Texte und Programme sind abzählbar, reelle Zahlen nicht. Die **berechenbaren** Zahlen wie π oder √2 sind also eine winzige Ausnahme.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was »abzählbar unendlich« heißt – mit einem Beispiel.
    params:
      keywords:
        - - nummer
          - durchnummer
          - liste
          - number
          - list
        - - jede
          - keine auslass
          - every
          - none left out
          - missing
        - - unendlich
          - infinite
      sample: "Eine unendliche Menge ist abzählbar, wenn man sie durchnummerieren kann, sodass jede Zahl irgendwann drankommt. Die geraden Zahlen gehen so: 2 ist Nummer 1, 4 ist Nummer 2 und so weiter."
    difficulty: 3

srs:
  cards_from: [ganze, brueche]
