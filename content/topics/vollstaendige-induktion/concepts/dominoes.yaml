id: logic.induction.dominoes
type: concept
title: "Anfang und Schritt"
summary: "Wenn der erste Stein fällt und jeder den nächsten umwirft, fallen alle."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Was, wenn einer fehlt?
    body: "Dominoketten faszinieren – und sie erklären einen der stärksten Beweise der Mathematik. Deck die Karten auf: Was passiert in welchem Fall? Daraus entsteht die **Induktion**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🛑
            front: Der erste fällt nicht
            back: Dann bleibt die ganze Reihe stehen – egal, wie gut sie aufgebaut ist.
          - icon: 🕳️
            front: Eine Lücke in der Reihe
            back: Dann fallen nur die Steine bis zur Lücke. Dahinter bleibt alles stehen.
          - icon: 🔢
            front: Zahlen statt Steine
            back: "Mathematiker stellen Aussagen wie Steine auf: eine für 1, eine für 2, eine für 3 …"
          - icon: 🏆
            front: Der Weltrekord
            back: 2009 fielen in den Niederlanden über 4,4 Millionen Steine bei einer einzigen Aktion.

  - kind: problem
    id: c1
    widget: numeric
    prompt: "Addiere die ersten {{n}} ungeraden Zahlen: 1 + 3 + 5 + … Was kommt heraus?"
    answer:
      value: "{{n * n}}"
    hints:
      - "Probiere klein: 1, dann 1 + 3, dann 1 + 3 + 5."
      - 1, 4, 9 … das sind Quadratzahlen.
    explanation: "{{n}}² = {{n * n}}. Das Muster stimmt für die ersten Fälle. Aber stimmt es **immer**? Dafür braucht man einen Beweis."
    variants:
      params:
        n: int[3,9]
      defaults:
        n: 4

  - kind: problem
    id: c2
    widget: choice
    prompt: Eine lange Reihe Dominosteine. Was musst du wissen, um sicher zu sein, dass **alle** fallen?
    params:
      options:
        - label: Der erste fällt, und jeder fallende Stein wirft den nächsten um.
          correct: true
        - label: Die ersten zehn fallen.
          feedback: Vielleicht steht Stein 11 zu weit weg.
        - label: Jeder Stein kann umfallen.
          feedback: Können reicht nicht – irgendetwas muss ihn anstoßen.
    hints:
      - "Zwei Dinge: Wie startet es – und wie geht es weiter?"
      - Ohne Start fällt nichts, ohne Weitergabe stoppt es.
    explanation: Start plus Weitergabe – das ist die ganze Idee der vollständigen Induktion.

  - kind: explain
    id: c3
    body: "Ein Induktionsbeweis hat zwei Teile. Der **Induktionsanfang** zeigt die Aussage für n = 1. Der Induktionsschritt zeigt: Gilt sie für n, dann auch für n + 1. Dann gilt sie für alle n."

  - kind: problem
    id: c4
    widget: order
    prompt: "Beweise: 1 + 3 + … + (2n − 1) = n². Ordne die Schritte."
    params:
      items:
        - label: "Anfang: Für n = 1 ist die Summe 1 = 1²."
        - label: "Annahme: Die Formel gilt für ein n."
        - label: Die nächste ungerade Zahl ist 2n + 1.
        - label: Also ist die neue Summe n² + 2n + 1 = (n + 1)².
        - label: Damit gilt die Formel für alle n.
    hints:
      - Erst der Anfang, dann die Annahme für n.
      - Im Schritt addierst du die nächste ungerade Zahl.
    explanation: "Der Schritt nutzt die **Annahme** für n und baut daraus n + 1. Das ist kein Zirkel: Bewiesen wird nur »aus n folgt n + 1«."

  - kind: problem
    id: c5
    widget: choice
    prompt: "Jemand zeigt: »Gilt n = n + 1, dann gilt auch n + 1 = n + 2.« Ist damit bewiesen, dass jede Zahl gleich ihrem Nachfolger ist?"
    params:
      options:
        - label: Nein – der Schritt stimmt, aber es gibt keinen Anfang.
          correct: true
        - label: Ja, der Schritt ist korrekt.
          feedback: Ohne einen ersten wahren Fall fällt kein einziger Stein.
        - label: Nein, der Schritt ist falsch.
          feedback: "Der Schritt stimmt sogar: Man addiert auf beiden Seiten 1."
    hints:
      - "Prüfe den Anfang: Ist 1 = 2?"
      - Ein Schritt allein überträgt nur Wahrheit, die schon da ist.
    explanation: Der Schritt überträgt nur Wahrheit – aber hier gibt es keine. Der **Anfang** ist darum kein Formalismus, sondern unverzichtbar.

  - kind: problem
    id: c6
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Bei der Induktion zeigt man zuerst den [[Anfang]] für n = 1. Dann zeigt man im [[Schritt]], dass aus n immer n + 1 folgt.
      distractors:
        - Beweis
        - Beispiel
    hints:
      - "Denk an die Dominosteine: erster Stein, dann Weitergabe."
    explanation: Anfang und Schritt zusammen ergeben einen Beweis für unendlich viele Fälle.

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: "Beweise: 2ⁿ ≥ n + 1 für alle n ≥ 1. Ordne."
    params:
      items:
        - label: "Anfang: 2¹ = 2 ≥ 2."
        - label: "Annahme: 2ⁿ ≥ n + 1."
        - label: Dann ist 2ⁿ⁺¹ = 2 · 2ⁿ ≥ 2n + 2.
        - label: Und 2n + 2 ≥ n + 2, weil n ≥ 0.
        - label: Also gilt 2ⁿ⁺¹ ≥ (n + 1) + 1.
    hints:
      - Im Schritt verdoppelt sich die linke Seite.
      - Dann musst du nur noch abschätzen, dass das genug ist.
    explanation: "Bei Ungleichungen braucht der Schritt oft eine **Abschätzung**: Man zeigt, dass das Doppelte mehr als genug ist."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Kann man mit Induktion etwas für alle **reellen** Zahlen zwischen 0 und 1 beweisen?
    params:
      options:
        - label: Nicht so einfach – es gibt keine »nächste« reelle Zahl, die man erreichen könnte.
          correct: true
        - label: Ja, man geht in kleinen Schritten von 0 nach 1.
          feedback: Egal wie klein die Schritte – unendlich viele Zahlen dazwischen bleiben unerreicht.
        - label: Ja, genau wie bei natürlichen Zahlen.
          feedback: Induktion braucht, dass man jede Zahl vom Start aus in endlich vielen Schritten erreicht.
    hints:
      - Was ist die nächste Zahl nach 0,5?
      - Bei natürlichen Zahlen gibt es immer genau einen Nachfolger.
    explanation: Induktion funktioniert, weil jede natürliche Zahl ein **Nachfolger** des Vorgängers ist. Die reellen Zahlen haben diese Struktur nicht.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "»Jede Zahl ist klein: 1 ist klein, und wenn n klein ist, dann auch n + 1.« Wo steckt das Problem?"
    params:
      options:
        - label: »Klein« ist unscharf – der Schritt klingt plausibel, ist aber kein sauberer Schluss.
          correct: true
        - label: Der Anfang ist falsch.
          feedback: 1 ist wohl klein – der Anfang ist nicht das Problem.
        - label: Gar keins, jede Zahl ist klein.
          feedback: Eine Billion ist nicht klein. Irgendwo muss die Kette reißen.
    hints:
      - Gibt es eine genaue Grenze, ab der eine Zahl nicht mehr klein ist?
      - Induktion braucht Aussagen, die klar wahr oder falsch sind.
    explanation: "Das ist das **Haufen-Paradox**: Kleine Schritte summieren sich. Induktion funktioniert nur mit scharfen Begriffen – »n² ist gerade« ja, »n ist klein« nein."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux mit den Dominosteinen, warum ein Induktionsbeweis für alle Zahlen gilt.
    params:
      keywords:
        - - erste
          - anfang
          - start
          - first
          - base
        - - nächste
          - schritt
          - n + 1
          - n+1
          - next
          - step
        - - alle
          - jede
          - all
          - every
      sample: Der Anfang zeigt, dass der erste Stein fällt. Der Schritt zeigt, dass jeder fallende Stein den nächsten umwirft. Zusammen fallen alle Steine – also gilt die Aussage für jede Zahl.
    difficulty: 3

srs:
  cards_from: ["c1", "c4", "d1"]
