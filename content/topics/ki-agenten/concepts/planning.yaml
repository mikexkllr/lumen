id: ai.agents.planning
type: concept
title: Große Aufgaben zerlegen
summary: Ein Plan aus kleinen Schritten.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: reise
    widget: order
    prompt: Ein Agent soll eine Reise buchen. Welche Reihenfolge ist sinnvoll?
    params:
      items:
        - { label: Wünsche erfragen }
        - { label: Flüge suchen }
        - { label: Angebot zeigen }
        - { label: Nach Bestätigung buchen }
    hints:
      - Gebucht wird ganz am Ende.
    explanation: Erst klären, dann suchen, dann fragen – und erst danach handeln.

  - kind: problem
    id: fehler
    widget: numeric
    prompt: Jeder Schritt gelingt mit {{p}} % Wahrscheinlichkeit. Wie wahrscheinlich gelingen 2 Schritte hintereinander?
    params: { unit: "%" }
    answer: { value: "{{p * p / 100}}", tolerance: 0.5 }
    hints:
      - "{{p}} % von {{p}} %."
    explanation: "{{p}} % · {{p}} % = {{round(p * p / 100, 1)}} % – lange Pläne werden fehleranfällig."
    variants:
      params: { p: "choice[80,90,95]" }
      defaults: { p: 90 }

  - kind: explain
    id: s3
    body: |
      Fehler häufen sich mit jedem Schritt. Gute Agenten **prüfen** darum zwischendurch, ob sie noch auf Kurs sind. Wenn nicht, passen sie den Plan an.

  - kind: problem
    id: anpassen
    widget: choice
    prompt: Der gewünschte Flug ist ausgebucht. Was sollte ein guter Agent tun?
    params:
      options:
        - { label: Alternativen suchen und nachfragen, correct: true }
        - { label: Trotzdem buchen, feedback: "Das scheitert sicher – der Plan muss sich an die Beobachtung anpassen." }
    hints:
      - Was sagt die Beobachtung über den Plan?
    explanation: Beobachtungen ändern den Plan – das ist die Stärke der Schleife.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Jeder Schritt eines Agenten gelingt mit 95 %. Wie wahrscheinlich gelingt eine Aufgabe mit 20 Schritten? In Prozent, gerundet. (0,95²⁰ ≈ 0,358)
    params:
      unit: "%"
    answer:
      value: 36
      tolerance: 1
    hints:
      - Alle 20 Schritte müssen klappen.
    explanation: Nur 36 %. Lange Aufgaben verlangen extrem zuverlässige Einzelschritte – oder Prüfpunkte.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie erhöht man die Erfolgsquote bei langen Aufgaben am wirksamsten?
    params:
      options:
        - label: Zwischenergebnisse prüfen und bei Fehlern korrigieren, statt blind weiterzumachen
          correct: true
        - label: Die Aufgabe in einem einzigen Schritt lösen lassen
          feedback: Das überfordert das Modell meist.
        - label: Den Agenten schneller machen
          feedback: Tempo ändert die Fehlerquote nicht.
    hints:
      - Ein erkannter Fehler ist kein Fehler mehr.
    explanation: Selbstprüfung macht aus einer Kette, die am schwächsten Glied reißt, ein System, das Fehler abfängt.
    difficulty: 3

srs:
  cards_from: [reise, fehler]
