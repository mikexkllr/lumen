id: ai.agents.evaluation
type: concept
title: Agenten testen
summary: Wie man misst, ob ein Agent taugt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: quote
    widget: numeric
    prompt: Ein Agent löst {{k}} von {{n}} Testaufgaben. Wie hoch ist seine Erfolgsquote?
    params: { unit: "%" }
    answer: { value: "{{100 * k / n}}" }
    hints:
      - Gelöste geteilt durch alle.
    explanation: "{{k}} : {{n}} = {{100 * k / n}} %."
    variants:
      params: { n: "choice[20,50]", k: "choice[10,15,18]" }
      defaults: { n: 20, k: 15 }

  - kind: explain
    body: |
      Ein Agent kann bei derselben Aufgabe mal gewinnen, mal scheitern. Darum testet man jede Aufgabe **mehrmals** und auf vielen verschiedenen Aufgaben. Ein einzelner Erfolg sagt wenig.

  - kind: problem
    id: streuung
    widget: distribution
    prompt: Lass den Agenten mindestens 50-mal dieselbe Aufgabe lösen. Wie oft klappt es?
    params:
      items: [{ label: gelöst, weight: 7 }, { label: gescheitert, weight: 3 }]
    check: { predicate: "draws >= 50" }
    hints:
      - Viele Durchgänge zeigen die echte Quote.
    explanation: Erst viele Versuche zeigen, wie zuverlässig der Agent wirklich ist.

  - kind: problem
    id: gut
    widget: choice
    prompt: Was macht einen guten Test für Agenten aus?
    params:
      options:
        - { label: "Aufgaben, die er im Training nicht gesehen hat", correct: true }
        - { label: Aufgaben aus seinem Training, feedback: "Dann misst man Auswendiglernen, nicht Können." }
    hints:
      - Was soll der Test eigentlich messen?
    explanation: Neue Aufgaben zeigen, ob der Agent wirklich verallgemeinert.

srs:
  cards_from: [quote, gut]
