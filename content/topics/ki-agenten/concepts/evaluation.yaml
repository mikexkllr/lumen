id: ai.agents.evaluation
type: concept
title: Agenten testen
summary: Wie man misst, ob ein Agent taugt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: quote
    widget: numeric
    prompt: Ein Agent löst {{k}} von {{n}} Testaufgaben. Wie hoch ist seine Erfolgsquote?
    params: { unit: "%" }
    answer: { value: "{{100 * k / n}}" }
    hints:
      - Gelöste geteilt durch alle.
    explanation: "{{k}} : {{n}} = {{100 * k / n}} %."
    variants:
      params: { n: "choice[20,50]", k: "choice[10,15,18]" }
      defaults: { n: 20, k: 15 }

  - kind: explain
    id: s2
    body: |
      Ein Agent kann bei derselben Aufgabe mal gewinnen, mal scheitern. Darum testet man jede Aufgabe **mehrmals** und auf vielen verschiedenen Aufgaben. Ein einzelner Erfolg sagt wenig.

  - kind: problem
    id: streuung
    widget: distribution
    prompt: Lass den Agenten mindestens 50-mal dieselbe Aufgabe lösen. Wie oft klappt es?
    params:
      items: [{ label: gelöst, weight: 7 }, { label: gescheitert, weight: 3 }]
    check: { predicate: "draws >= 50" }
    hints:
      - Viele Durchgänge zeigen die echte Quote.
    explanation: Erst viele Versuche zeigen, wie zuverlässig der Agent wirklich ist.

  - kind: problem
    id: gut
    widget: choice
    prompt: Was macht einen guten Test für Agenten aus?
    params:
      options:
        - { label: "Aufgaben, die er im Training nicht gesehen hat", correct: true }
        - { label: Aufgaben aus seinem Training, feedback: "Dann misst man Auswendiglernen, nicht Können." }
    hints:
      - Was soll der Test eigentlich messen?
    explanation: Neue Aufgaben zeigen, ob der Agent wirklich verallgemeinert.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Agent löst eine Aufgabe in 6 von 10 Versuchen. Wie wahrscheinlich gelingt sie in **mindestens einem** von 3 Versuchen? In Prozent, auf eine Stelle.
    params:
      unit: "%"
    answer:
      value: 93.6
      tolerance: 0.1
    hints:
      - "1 minus die Chance, dreimal zu scheitern: 0,4³."
    explanation: 1 − 0,064 = 93,6 %. Wiederholen hilft – wenn man erkennt, welcher Versuch gelungen ist.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Agent löst eine Aufgabe in 60 % der Versuche. Wie wahrscheinlich gelingt sie **dreimal hintereinander**? In Prozent, auf eine Stelle.
    answer:
      value: 21.6
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 93.6
        misconception: at-least-one
        text: Das ist »mindestens einmal in drei Versuchen«. Hier müssen alle drei klappen.
    hints:
      - "Alle drei müssen gelingen: multipliziere."
      - 0,6³ = ?
    explanation: 0,6³ = 0,216. »Klappt irgendwann« und »klappt **zuverlässig**« sind sehr verschiedene Maße. Für den Alltag zählt meist das zweite.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Agent glänzt auf einem bekannten Test. Bei neuen, ähnlichen Aufgaben schneidet er viel schlechter ab. Was ist ein wahrscheinlicher Grund?
    params:
      options:
        - label: Die Testaufgaben oder ihre Lösungen standen in den Trainingsdaten.
          correct: true
        - label: Neue Aufgaben sind immer unfair.
          feedback: Neue Aufgaben zeigen gerade, was er wirklich kann.
        - label: Der Agent wird müde.
          feedback: Programme werden nicht müde.
    hints:
      - Woher könnte das Modell die Testaufgaben kennen?
      - Bekannte Tests stehen oft im Internet.
    explanation: Das heißt **Kontamination**. Gute Bewertungen nutzen darum neue oder geheim gehaltene Aufgaben und prüfen, ob Teile davon im Netz kursieren.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum brauchen KI-Agenten klare Grenzen und Rückfragen?"
    params:
      keywords:
        - - fehler
          - irren
          - falsch
          - error
          - mistake
          - wrong
        - - handeln
          - aktion
          - ausführ
          - act
          - action
          - execut
          - tun
        - - rückgängig
          - schaden
          - folgen
          - undo
          - harm
          - damage
          - consequen
          - irreversib
        - - fragen
          - erlaubnis
          - bestätig
          - ask
          - permission
          - confirm
          - approv
      min: 3
      sample: Ein Agent handelt selbst und kann sich dabei irren oder von fremden Texten getäuscht werden. Manche Aktionen wie Löschen oder Bezahlen lassen sich nicht rückgängig machen – darum sollte er vorher um Erlaubnis fragen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: Ein Agent löst 30 von 50 Testaufgaben. Der Standardfehler ist √(p · (1 − p) / n). Wie groß ist er in Prozentpunkten? Auf eine Stelle.
    answer:
      value: 6.9
      tolerance: 0.2
    hints:
      - p = 0,6. Also √(0,6 · 0,4 / 50).
      - √0,0048 ≈ 0,069.
    explanation: Rund ±7 Punkte. Ein anderer Agent mit 64 % ist also nicht klar besser. Kleine Tests brauchen **Fehlerbalken**, bevor man Sieger kürt.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: Ein Sprachmodell bewertet die Antworten zweier Agenten. Worauf sollte man dabei achten?
    params:
      options:
        - label: Es kann Vorlieben haben – etwa für längere Antworten oder die zuerst gezeigte.
          correct: true
        - label: Auf nichts, Modelle sind neutral.
          feedback: Auch Bewerter-Modelle haben messbare Verzerrungen.
        - label: Dass es zu streng ist.
          feedback: Häufiger ist es zu großzügig mit langen, selbstsicheren Texten.
    hints:
      - Vertausche die Reihenfolge der Antworten. Ändert sich das Urteil?
      - Lange Texte wirken gründlich – sind sie es?
    explanation: Man prüft **Bewerter-Modelle** mit Menschen, vertauscht die Reihenfolge und nutzt klare Kriterien. Wo möglich, ersetzt man Urteile durch prüfbare Ergebnisse.
    difficulty: 3

srs:
  cards_from: [quote, gut]
