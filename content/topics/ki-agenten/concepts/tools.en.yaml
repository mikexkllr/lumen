id: ai.agents.tools
type: concept
title: Using tools
summary: What a model can't do itself, it calls.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Guessing, not calculating
    body: This mini model is asked to work out 387 · 29. Sample ten answers – the right one is 11223. How often does it hit? Which **tool** would you reach for in its place?
    visual:
      widget: distribution
      interactive: true
      params:
        mode: tokens
        context: 387 · 29 =
        items:
          - label: "11223"
            logit: 2
          - label: "11233"
            logit: 1.7
          - label: "11123"
            logit: 1.5
          - label: "10223"
            logit: 1
          - label: "12223"
            logit: 0.8
        sample:
          - 1
          - 10

  - kind: problem
    id: wahl
    widget: match
    prompt: Which tool fits which task?
    params:
      pairs:
        - { left: Tomorrow's weather, right: Web search }
        - { left: 3817 times 492, right: Calculator }
        - { left: Adding an appointment, right: Calendar }
    hints:
      - What does the model not know from its training?
    explanation: Tools supply current data and exact calculations.

  - kind: explain
    id: s2
    body: |
      The model does not run a tool itself. It writes a **request** with a name and arguments. The program around it runs the tool and returns the result.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: Why should an agent multiply large numbers with a calculator?
    params:
      options:
        - { label: Language models guess digits and easily miscalculate., correct: true }
        - { label: Because it types faster., feedback: "It is about accuracy. The model generates text. It does not calculate exactly." }
    hints:
      - How does a language model produce an answer?
    explanation: A calculator is exact. A language model is only probably right.

  - kind: problem
    id: brauchen
    widget: buckets
    prompt: Does the agent need a tool for this?
    params:
      buckets: [{ label: Tool }, { label: no tool }]
      items:
        - { label: Current price of a stock, bucket: Tool }
        - { label: Saving a file, bucket: Tool }
        - { label: Writing a poem, bucket: no tool }
        - { label: Shortening a text, bucket: no tool }
    hints:
      - Is it about the outside world or just language?
    explanation: The model handles language itself. For the outside world, it needs tools.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order a tool call.
    params:
      items:
        - label: The model writes a request
        - label: The program runs the tool
        - label: The result goes back to the model
        - label: The model words the answer
    hints:
      - The model only asks – execution happens elsewhere.
    explanation: The model itself can do nothing but write text.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: How does a model know which tools exist and how to call them?
    params:
      options:
        - label: Their descriptions are in the prompt – name, purpose and expected inputs
          correct: true
        - label: It was retrained for each tool
          feedback: Usually the description in context suffices.
        - label: It guesses
          feedback: It reads the description.
    hints:
      - What is in the context window the model can use.
    explanation: "A good tool description is like good instructions: it decides whether the agent uses the tool correctly."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: 'The model writes a tool call "transfer(amount: 5000)". What should the surrounding program do before running it?'
    params:
      options:
        - label: Check the arguments and permissions – and ask the human for an action like this.
          correct: true
        - label: Run it at once – the model knows what it is doing.
          feedback: Models make mistakes and can be tricked. The program is the last safeguard.
        - label: Ignore the call.
          feedback: Then the tool would be useless. The point is checking, not refusing.
    hints:
      - Who actually runs the call – the model or the program?
      - Can a transfer be undone?
    explanation: "The tool call is only the model's proposal. The program decides whether to run it: with validation rules, limits and confirmation for costly or irreversible actions."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: An agent has 50 tools to choose from. What often happens?
    params:
      options:
        - label: It picks the wrong one more often – fewer, clearly separated tools work better
          correct: true
        - label: It gets ever more capable
          feedback: More choice also means more confusion.
        - label: It always uses all of them
          feedback: It chooses – and errs in doing so.
    hints:
      - How easily do you find the right tool in an overfull box?
    explanation: "Good design applies to agents too: few building blocks with a clear job."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: An agent may write and run code. Where should that code run?
    params:
      options:
        - label: In an isolated sandbox without access to private files and with limited network.
          correct: true
        - label: Directly on the user's computer with all permissions.
          feedback: A bug or an attack could then damage everything.
        - label: Nowhere – code is always dangerous.
          feedback: Code is very useful – it just needs to be contained.
    hints:
      - What can go wrong if generated code is buggy or manipulated?
      - How do you limit the possible damage?
    explanation: A sandbox limits the damage when something goes wrong. That way the agent can compute and test without access to everything.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a language model uses a tool such as a calculator.
    params:
      keywords:
        - - anfrage
          - aufruf
          - schreibt
          - request
          - call
          - writes
        - - programm
          - führt aus
          - ausführ
          - program
          - runs
          - execut
        - - ergebnis
          - zurück
          - result
          - back
      sample: The model writes a request with the tool's name and the numbers. The surrounding program runs it and puts the result back into the context. Then the model continues writing.
    difficulty: 3

srs:
  cards_from: [wahl, brauchen]
