id: ai.agents.tools
type: concept
title: Using tools
summary: What a model can't do itself, it calls.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: wahl
    widget: match
    prompt: Which tool fits which task?
    params:
      pairs:
        - { left: Tomorrow's weather, right: Web search }
        - { left: 3817 times 492, right: Calculator }
        - { left: Adding an appointment, right: Calendar }
    hints:
      - What does the model not know from its training?
    explanation: Tools supply current data and exact calculations.

  - kind: explain
    body: |
      The model does not run a tool itself. It writes a **request** with a name and arguments. The program around it runs the tool and returns the result.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: Why should an agent multiply large numbers with a calculator?
    params:
      options:
        - { label: Language models guess digits and easily miscalculate., correct: true }
        - { label: Because it types faster., feedback: "It is about accuracy. The model generates text. It does not calculate exactly." }
    hints:
      - How does a language model produce an answer?
    explanation: A calculator is exact. A language model is only probably right.

  - kind: problem
    id: brauchen
    widget: buckets
    prompt: Does the agent need a tool for this?
    params:
      buckets: [{ label: Tool }, { label: no tool }]
      items:
        - { label: Current price of a stock, bucket: Tool }
        - { label: Saving a file, bucket: Tool }
        - { label: Writing a poem, bucket: no tool }
        - { label: Shortening a text, bucket: no tool }
    hints:
      - Is it about the outside world or just language?
    explanation: The model handles language itself. For the outside world, it needs tools.

srs:
  cards_from: [wahl, brauchen]
