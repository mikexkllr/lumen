id: ai.agents.loop
type: concept
title: The agent loop
summary: Think, act, observe, and start again.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You are looking for your key. How do you go about it?
    params:
      options:
        - label: Look, think, look elsewhere – until it is there
          correct: true
        - label: Look once and give up
          feedback: You rarely find anything that way.
        - label: Only think
          feedback: Without looking you find nothing.
    hints:
      - One try is rarely enough.
    explanation: Act, look at the result, plan again. An AI agent works the same way.


  - kind: explain
    id: s1
    body: |
      An **agent** is a language model that does not only answer but acts. It plans one step, carries it out and looks at the result. Then it decides what comes next.

  - kind: problem
    id: schleife
    widget: order
    prompt: Put the agent loop in the right order.
    params:
      items:
        - { label: Understand the goal }
        - { label: Plan the next step }
        - { label: Run a tool }
        - { label: Observe the result }
    hints:
      - First think, then act, then check.
    explanation: After observing, the loop starts again, until the goal is reached.

  - kind: problem
    id: unterschied
    widget: choice
    prompt: What sets an agent apart from a simple chatbot?
    params:
      options:
        - { label: "It takes actions and reacts to their results.", correct: true }
        - { label: It has a bigger model., feedback: "Size is not what matters. What matters is that it can act and observe." }
    hints:
      - What happens between two answers?
    explanation: The loop of acting and observing makes the difference.

  - kind: problem
    id: runden
    widget: numeric
    prompt: An agent needs {{s}} seconds per round. How long do {{r}} rounds take?
    params: { unit: s }
    answer: { value: "{{s * r}}" }
    hints:
      - Rounds times duration.
    explanation: "{{r}} · {{s}} = {{s * r}} seconds. That is why every round saved counts."
    variants:
      params: { s: "int[2,6]", r: "int[3,9]" }
      defaults: { s: 4, r: 5 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "An agent works in a loop: it [[plans]] a step, carries it out with a [[tool]] and [[observes]] the result."
      distractors:
        - forgets
        - chance

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: An agent keeps calling the same tool with the same inputs and makes no progress. What is it missing?
    params:
      options:
        - label: A stopping criterion and the ability to recognise that an approach is not working
          correct: true
        - label: More computing power
          feedback: Running in circles faster does not help.
        - label: A better tool
          feedback: The tool works – the plan does not.
    hints:
      - As with an infinite loop in a program.
    explanation: Good agents have step limits and ask when they are stuck.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why are agents with language models so hard to make predictable?
    params:
      options:
        - label: Every decision is a draw from probabilities – and small deviations branch out over many steps
          correct: true
        - label: Because they lie on purpose
          feedback: It is about chance and chaining.
        - label: They are completely predictable
          feedback: The same task can run very differently.
    hints:
      - A different first step leads to an entirely different path.
    explanation: That is why tests over many runs, logs and clear limits are needed.
    difficulty: 3

srs:
  cards_from: [schleife, unterschied]
