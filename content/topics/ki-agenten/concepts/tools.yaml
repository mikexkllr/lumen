id: ai.agents.tools
type: concept
title: Werkzeuge nutzen
summary: Was ein Modell nicht selbst kann, ruft es auf.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Raten statt rechnen
    body: Dieses Mini-Modell soll 387 · 29 ausrechnen. Zieh zehn Antworten – richtig wäre 11223. Wie oft trifft es? Welches **Werkzeug** würdest du an seiner Stelle nehmen?
    visual:
      widget: distribution
      interactive: true
      params:
        mode: tokens
        context: 387 · 29 =
        items:
          - label: "11223"
            logit: 2
          - label: "11233"
            logit: 1.7
          - label: "11123"
            logit: 1.5
          - label: "10223"
            logit: 1
          - label: "12223"
            logit: 0.8
        sample:
          - 1
          - 10

  - kind: problem
    id: wahl
    widget: match
    prompt: Welches Werkzeug passt zu welcher Aufgabe?
    params:
      pairs:
        - { left: Wetter von morgen, right: Websuche }
        - { left: 3817 mal 492, right: Taschenrechner }
        - { left: Termin eintragen, right: Kalender }
    hints:
      - Was weiß das Modell nicht aus seinem Training?
    explanation: Werkzeuge liefern aktuelle Daten und exakte Rechnungen.

  - kind: explain
    id: s2
    body: |
      Das Modell ruft ein Werkzeug nicht selbst auf. Es schreibt eine **Anfrage** mit Name und Argumenten. Das Programm drumherum führt sie aus und gibt das Ergebnis zurück.

  - kind: problem
    id: rechnen
    widget: choice
    prompt: Warum sollte ein Agent große Zahlen lieber mit einem Rechner multiplizieren?
    params:
      options:
        - { label: Sprachmodelle raten Ziffern und verrechnen sich leicht., correct: true }
        - { label: Weil es schneller tippt., feedback: "Es geht um Genauigkeit – das Modell erzeugt Text, es rechnet nicht exakt." }
    hints:
      - Wie erzeugt ein Sprachmodell eine Antwort?
    explanation: Ein Rechner ist exakt, ein Sprachmodell nur wahrscheinlich richtig.

  - kind: problem
    id: brauchen
    widget: buckets
    prompt: Braucht der Agent dafür ein Werkzeug?
    params:
      buckets: [{ label: Werkzeug }, { label: kein Werkzeug }]
      items:
        - { label: Aktueller Kurs einer Aktie, bucket: Werkzeug }
        - { label: Eine Datei speichern, bucket: Werkzeug }
        - { label: Ein Gedicht schreiben, bucket: kein Werkzeug }
        - { label: Einen Text kürzen, bucket: kein Werkzeug }
    hints:
      - Geht es um die Außenwelt oder nur um Sprache?
    explanation: Sprache kann das Modell selbst – für die Außenwelt braucht es Werkzeuge.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne einen Werkzeugaufruf.
    params:
      items:
        - label: Das Modell schreibt eine Anfrage
        - label: Das Programm führt das Werkzeug aus
        - label: Das Ergebnis geht zurück ans Modell
        - label: Das Modell formuliert die Antwort
    hints:
      - Das Modell bittet nur – ausgeführt wird woanders.
    explanation: Das Modell selbst kann nichts tun außer Text schreiben.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Woher weiß ein Modell, welche Werkzeuge es gibt und wie man sie aufruft?
    params:
      options:
        - label: Ihre Beschreibungen stehen im Prompt – Name, Zweck und erwartete Eingaben
          correct: true
        - label: Es wurde für jedes Werkzeug neu trainiert
          feedback: Meist genügt die Beschreibung im Kontext.
        - label: Es rät
          feedback: Es liest die Beschreibung.
    hints:
      - Was im Kontextfenster steht, kann das Modell nutzen.
    explanation: "Eine gute Werkzeugbeschreibung ist wie eine gute Anleitung: Sie entscheidet, ob der Agent das Werkzeug richtig einsetzt."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: choice
    prompt: "Das Modell schreibt einen Werkzeugaufruf »überweise(betrag: 5000)«. Was sollte das Programm drumherum tun, bevor es ausführt?"
    params:
      options:
        - label: Argumente und Rechte prüfen – und bei so einer Aktion den Menschen fragen.
          correct: true
        - label: Sofort ausführen, das Modell weiß, was es tut.
          feedback: Modelle irren sich und lassen sich täuschen. Das Programm ist die letzte Sicherung.
        - label: Den Aufruf ignorieren.
          feedback: Dann wäre das Werkzeug nutzlos. Es geht um Prüfen, nicht Verweigern.
    hints:
      - Wer führt den Aufruf wirklich aus – das Modell oder das Programm?
      - Ist eine Überweisung umkehrbar?
    explanation: "Der Werkzeugaufruf ist nur ein **Vorschlag** des Modells. Das Programm entscheidet, ob es ihn ausführt: mit Prüfregeln, Grenzen und Rückfragen bei teuren oder endgültigen Aktionen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Agent hat 50 Werkzeuge zur Auswahl. Was passiert häufig?
    params:
      options:
        - label: Er wählt öfter das falsche – weniger, klar abgegrenzte Werkzeuge funktionieren besser
          correct: true
        - label: Er wird immer fähiger
          feedback: Mehr Auswahl heißt auch mehr Verwechslung.
        - label: Er nutzt immer alle
          feedback: Er wählt aus – und irrt sich dabei.
    hints:
      - Wie leicht findest du das richtige Werkzeug in einem übervollen Kasten?
    explanation: "Auch für Agenten gilt gutes Design: wenige Bausteine mit klarer Aufgabe."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Ein Agent darf Code schreiben und ausführen. Wo sollte dieser Code laufen?
    params:
      options:
        - label: In einer abgeschotteten Umgebung ohne Zugriff auf private Dateien und mit begrenztem Netz.
          correct: true
        - label: Direkt auf dem Rechner des Nutzers mit allen Rechten.
          feedback: Ein Fehler oder ein Angriff könnte dann alles beschädigen.
        - label: Gar nicht, Code ist immer gefährlich.
          feedback: Code ist sehr nützlich – man muss ihn nur einhegen.
    hints:
      - Was kann schiefgehen, wenn erzeugter Code fehlerhaft oder manipuliert ist?
      - Wie begrenzt man den möglichen Schaden?
    explanation: Eine **Sandbox** begrenzt den Schaden, wenn etwas schiefläuft. So kann der Agent rechnen und testen, ohne Zugriff auf alles zu haben.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Sprachmodell ein Werkzeug wie einen Taschenrechner benutzt.
    params:
      keywords:
        - - anfrage
          - aufruf
          - schreibt
          - request
          - call
          - writes
        - - programm
          - führt aus
          - ausführ
          - program
          - runs
          - execut
        - - ergebnis
          - zurück
          - result
          - back
      sample: Das Modell schreibt eine Anfrage mit dem Namen des Werkzeugs und den Zahlen. Das Programm drumherum führt sie aus und gibt das Ergebnis zurück in den Kontext. Dann schreibt das Modell weiter.
    difficulty: 3

srs:
  cards_from: [wahl, brauchen]
