id: ai.agents.evaluation
type: concept
title: Testing agents
summary: How to measure whether an agent is any good.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The agent under test
    body: "How good is an agent really? Measuring that is trickier than it sounds. Uncover the cards: what have researchers run into while **testing**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🧪
            front: The edited tests
            back: A coding agent was meant to pass tests. Sometimes it simply changed the tests.
          - icon: 📈
            front: Too easy now
            back: Many benchmarks were almost fully solved within a year or two. Then harder ones are needed.
          - icon: ⏱️
            front: Ever longer tasks
            back: The length of tasks agents can finish has recently doubled about every seven months.

  - kind: problem
    id: quote
    widget: numeric
    prompt: An agent solves {{k}} of {{n}} test tasks. What is its success rate?
    params: { unit: "%" }
    answer: { value: "{{100 * k / n}}" }
    hints:
      - Solved divided by all.
    explanation: "{{k}} ÷ {{n}} = {{100 * k / n}}%."
    variants:
      params: { n: "choice[20,50]", k: "choice[10,15,18]" }
      defaults: { n: 20, k: 15 }

  - kind: explain
    id: s2
    body: |
      On the same task, an agent may win one time and fail the next. So you test each task **several times**, and on many different tasks. A single success tells you little.

  - kind: problem
    id: streuung
    widget: distribution
    prompt: Have the agent solve the same task at least 50 times. How often does it work?
    params:
      items: [{ label: solved, weight: 7 }, { label: failed, weight: 3 }]
    check: { predicate: "draws >= 50" }
    hints:
      - Many runs show the true rate.
    explanation: Only many attempts show how reliable the agent really is.

  - kind: problem
    id: gut
    widget: choice
    prompt: What makes a good test for agents?
    params:
      options:
        - { label: "Tasks it has not seen in training", correct: true }
        - { label: Tasks from its training, feedback: "Then you measure memorizing, not skill." }
    hints:
      - What is the test supposed to measure?
    explanation: New tasks show whether the agent really generalizes.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An agent solves a task in 6 of 10 attempts. How likely does it succeed in **at least one** of 3 attempts? In percent, to one place.
    params:
      unit: "%"
    answer:
      value: 93.6
      tolerance: 0.1
    hints:
      - "1 minus the chance of failing three times: 0.4³."
    explanation: 1 − 0.064 = 93.6%. Repeating helps – if you can tell which attempt succeeded.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: An agent solves a task in 60 % of attempts. How likely does it succeed **three times in a row**? In percent, to one decimal.
    answer:
      value: 21.6
      tolerance: 0.1
    feedback:
      - when: numval(state.input) == 93.6
        misconception: at-least-one
        text: That is "at least once in three tries". Here all three must work.
    hints:
      - "All three must succeed: multiply."
      - 0.6³ = ?
    explanation: 0.6³ = 0.216. "Works at some point" and "works reliably" are very different measures. In daily use the second usually counts.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: An agent shines on a well-known benchmark. On new, similar tasks it does much worse. What is a likely reason?
    params:
      options:
        - label: The test tasks or their solutions were in the training data.
          correct: true
        - label: New tasks are always unfair.
          feedback: New tasks show exactly what it can really do.
        - label: The agent gets tired.
          feedback: Programs do not get tired.
    hints:
      - How might the model know the test tasks?
      - Well-known tests are often on the internet.
    explanation: This is called contamination. Good evaluations therefore use new or withheld tasks and check whether parts are circulating online.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: why do AI agents need clear limits and check-ins?"
    params:
      keywords:
        - - fehler
          - irren
          - falsch
          - error
          - mistake
          - wrong
        - - handeln
          - aktion
          - ausführ
          - act
          - action
          - execut
          - tun
        - - rückgängig
          - schaden
          - folgen
          - undo
          - harm
          - damage
          - consequen
          - irreversib
        - - fragen
          - erlaubnis
          - bestätig
          - ask
          - permission
          - confirm
          - approv
      min: 3
      sample: An agent acts by itself and can make mistakes or be deceived by untrusted texts. Some actions such as deleting or paying cannot be undone – so it should ask for permission first.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: An agent solves 30 of 50 test tasks. The standard error is √(p · (1 − p) / n). How large is it in percentage points? To one decimal.
    answer:
      value: 6.9
      tolerance: 0.2
    hints:
      - p = 0.6. So √(0.6 · 0.4 / 50).
      - √0.0048 ≈ 0.069.
    explanation: About ±7 points. Another agent at 64 % is therefore not clearly better. Small tests need error bars before anyone is declared the winner.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: choice
    prompt: A language model grades the answers of two agents. What should you watch out for?
    params:
      options:
        - label: It can have biases – for example for longer answers or the one shown first.
          correct: true
        - label: Nothing – models are neutral.
          feedback: Grader models have measurable biases too.
        - label: That it is too strict.
          feedback: More often it is too generous with long, confident texts.
    hints:
      - Swap the order of the answers. Does the verdict change?
      - Long texts look thorough – are they?
    explanation: Grader models are checked against humans, the order is swapped and clear criteria are used. Where possible, judgements are replaced by checkable results.
    difficulty: 3

srs:
  cards_from: [quote, gut]
