id: ai.agents.loop
type: concept
title: Die Agenten-Schleife
summary: Denken, handeln, beobachten – und wieder von vorn.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Denken, tun, schauen
    body: "Ein **Agent** soll für dich einen Tisch reservieren – ganz allein. Deck die Stationen auf: Wie geht er dabei vor?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🤔
            front: Denken
            back: "Er plant: Zuerst prüfe ich das Lieblingslokal."
          - icon: 🛠️
            front: Handeln
            back: Er öffnet die Buchungsseite des Lokals.
          - icon: 👀
            front: Beobachten
            back: Ausgebucht! Das Ergebnis fließt in den nächsten Gedanken ein.
          - icon: ✅
            front: Fertig?
            back: Noch nicht – also beginnt die Runde von vorn, diesmal mit dem Lokal nebenan.

  - kind: problem
    id: hook
    widget: choice
    prompt: Du suchst deinen Schlüssel. Wie gehst du vor?
    params:
      options:
        - label: Nachsehen, überlegen, woanders nachsehen – bis er da ist
          correct: true
        - label: Einmal nachsehen und aufgeben
          feedback: So findet man selten etwas.
        - label: Nur nachdenken
          feedback: Ohne Nachsehen findest du nichts.
    hints:
      - Ein Versuch reicht selten.
    explanation: Handeln, Ergebnis ansehen, neu planen. So arbeitet auch ein KI-Agent.

  - kind: explain
    id: s1
    body: |
      Ein **Agent** ist ein Sprachmodell, das nicht nur antwortet, sondern handelt. Es plant einen Schritt, führt ihn aus und schaut sich das Ergebnis an. Dann entscheidet es, was als Nächstes kommt.

  - kind: problem
    id: schleife
    widget: order
    prompt: Bring die Agenten-Schleife in die richtige Reihenfolge.
    params:
      items:
        - { label: Ziel verstehen }
        - { label: Nächsten Schritt planen }
        - { label: Werkzeug ausführen }
        - { label: Ergebnis beobachten }
    hints:
      - Erst denken, dann handeln, dann prüfen.
    explanation: Nach dem Beobachten beginnt die Schleife neu – bis das Ziel erreicht ist.

  - kind: problem
    id: unterschied
    widget: choice
    prompt: Was unterscheidet einen Agenten von einem einfachen Chatbot?
    params:
      options:
        - { label: Er führt Aktionen aus und reagiert auf deren Ergebnisse., correct: true }
        - { label: Er hat ein größeres Modell., feedback: "Die Größe ist nicht entscheidend – sondern dass er handeln und beobachten kann." }
    hints:
      - Was passiert zwischen zwei Antworten?
    explanation: Die Schleife aus Handeln und Beobachten macht den Unterschied.

  - kind: problem
    id: runden
    widget: numeric
    prompt: Ein Agent braucht pro Runde {{s}} Sekunden. Wie lange dauern {{r}} Runden?
    params: { unit: s }
    answer: { value: "{{s * r}}" }
    hints:
      - Runden mal Dauer.
    explanation: "{{r}} · {{s}} = {{s * r}} Sekunden – darum zählt jede eingesparte Runde."
    variants:
      params: { s: "int[2,6]", r: "int[3,9]" }
      defaults: { s: 4, r: 5 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Ein Agent arbeitet in einer Schleife: Er [[plant]] einen Schritt, führt ihn mit einem [[Werkzeug]] aus und [[beobachtet]] das Ergebnis."
      distractors:
        - vergisst
        - Zufall

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Ein Agent ruft immer wieder dasselbe Werkzeug mit denselben Eingaben auf und kommt nicht voran. Was fehlt ihm?
    params:
      options:
        - label: Ein Abbruchkriterium und die Fähigkeit zu erkennen, dass ein Ansatz nicht funktioniert
          correct: true
        - label: Mehr Rechenleistung
          feedback: Schneller im Kreis laufen hilft nicht.
        - label: Ein besseres Werkzeug
          feedback: Das Werkzeug funktioniert – der Plan nicht.
    hints:
      - Wie bei einer Endlosschleife im Programm.
    explanation: Gute Agenten haben Schritt-Limits und fragen nach, wenn sie feststecken.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Jede Runde der Agenten-Schleife fügt dem Kontext etwa {{t}} Tokens hinzu: Gedanke, Aufruf, Ergebnis. Wie viele Tokens sind es nach {{r}} Runden?"
    answer:
      value: "{{t * r}}"
    hints:
      - Jede Runde kommt dazu – nichts fällt weg.
      - "{{t}} · {{r}} = ?"
    explanation: "{{t * r}} Tokens. Lange Aufgaben füllen das **Kontextfenster** schnell. Gute Agenten fassen darum alte Schritte zusammen oder speichern Notizen außerhalb."
    difficulty: 2
    variants:
      params:
        t: step[500,3000,500]
        r: int[5,30]
      defaults:
        t: 2000
        r: 10

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum sind Agenten mit Sprachmodellen so schwer vorhersehbar zu machen?
    params:
      options:
        - label: Jede Entscheidung ist eine Ziehung aus Wahrscheinlichkeiten – und kleine Abweichungen verzweigen sich über viele Schritte
          correct: true
        - label: Weil sie absichtlich lügen
          feedback: Es geht um Zufall und Verkettung.
        - label: Sie sind vollkommen vorhersehbar
          feedback: Derselbe Auftrag kann sehr verschieden verlaufen.
    hints:
      - Ein anderer erster Schritt führt zu einem ganz anderen Weg.
    explanation: Darum braucht man Tests über viele Durchläufe, Protokolle und klare Grenzen.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: "Viele Agenten wechseln ab: kurz überlegen, eine Aktion ausführen, das Ergebnis lesen, wieder überlegen. Was ist der Vorteil gegenüber »erst alles planen, dann alles ausführen«?"
    params:
      options:
        - label: Jede Beobachtung kann den nächsten Schritt korrigieren.
          correct: true
        - label: Es ist immer schneller.
          feedback: Es braucht oft mehr Runden – dafür passt es sich an.
        - label: Der Agent muss nie nachdenken.
          feedback: Er denkt laufend nach – nur in kleinen Portionen.
    hints:
      - Was weiß ein Agent vor dem ersten Schritt noch nicht?
      - Was passiert mit einem festen Plan, wenn Schritt 2 scheitert?
    explanation: Dieses Muster aus Denken und Handeln heißt oft **ReAct**. Ergebnisse aus der echten Welt fließen sofort in die nächste Entscheidung ein – wie bei einem Menschen, der beim Suchen nachdenkt.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen einem Chatbot und einem Agenten.
    params:
      keywords:
        - - antwort
          - text
          - answer
        - - handl
          - aktion
          - werkzeug
          - act
          - action
          - tool
        - - ergebnis
          - beobacht
          - schleife
          - result
          - observ
          - loop
      sample: "Ein Chatbot gibt nur eine Antwort als Text. Ein Agent handelt: Er ruft Werkzeuge auf, schaut sich das Ergebnis an und entscheidet in einer Schleife, was als Nächstes kommt."
    difficulty: 3

srs:
  cards_from: [schleife, unterschied]
