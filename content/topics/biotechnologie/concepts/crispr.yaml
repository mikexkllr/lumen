id: bio.biotech.crispr
type: concept
title: "CRISPR-Cas9"
summary: "Die Genschere und wie sie ihr Ziel findet."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Bakterien speichern Stücke von Viren, die sie einmal befallen haben, in ihrem Erbgut. Wozu?
    params:
      options:
        - label: "Als Gedächtnis: Beim nächsten Angriff erkennen und zerschneiden sie das Virus-Erbgut."
          correct: true
        - label: Als Nahrung
          feedback: Gespeichert wird nur eine Erinnerung, kein Futter.
        - label: Aus Versehen
          feedback: Das System ist präzise und weit verbreitet.
    hints:
      - Denk an das Immunsystem.
      - Eine gespeicherte Folge dient als Fahndungsfoto.
    explanation: Das ist CRISPR – ein Immunsystem der Bakterien. Forschende machten daraus ein Werkzeug.

  - kind: explain
    id: c1
    body: Bei **CRISPR-Cas9** führt ein kurzes RNA-Stück das Enzym Cas9 zu einer passenden DNA-Stelle. Die Führungs-RNA ist etwa 20 Basen lang. Cas9 schneidet dort beide Stränge durch.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne, wie CRISPR ein Gen verändert.
    params:
      items:
        - label: Führungs-RNA passend zum Ziel bauen
        - label: Cas9 mit Führung in die Zelle bringen
        - label: Führung paart mit der Ziel-DNA
        - label: Cas9 schneidet den Doppelstrang
        - label: Die Zelle repariert den Schnitt
    hints:
      - Erst das Ziel festlegen.
      - Die eigentliche Änderung entsteht bei der Reparatur.
    explanation: Cas9 schneidet nur – die Änderung macht die Reparatur der Zelle.

  - kind: problem
    id: c3
    widget: choice
    prompt: Die Führungs-RNA soll an die DNA-Folge 5’-GATTACA-3’ binden. Wie muss der passende Teil der RNA lauten?
    params:
      options:
        - label: 3’-CUAAUGU-5’
          correct: true
        - label: 3’-CTAATGT-5’
          feedback: Fast – aber RNA hat U statt T.
        - label: 3’-GAUUACA-5’
          feedback: Das ist eine Kopie, kein Gegenstück.
    hints:
      - G–C und A–U.
      - Die Richtung ist gegenläufig.
    explanation: Basenpaarung wie immer, nur mit Uracil. So findet die Führung ihr Ziel.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Was passiert bei der Reparatur?
    params:
      buckets:
        - id: b1
          label: Gen wird ausgeschaltet
        - id: b2
          label: neue Folge wird eingebaut
      items:
        - label: Schnell geflickt, Basen fehlen
          bucket: b1
        - label: Leseraster verschoben
          bucket: b1
        - label: Mit Vorlage repariert
          bucket: b2
        - label: Gesunde Variante kopiert
          bucket: b2
    hints:
      - Ohne Vorlage passieren oft kleine Fehler.
      - Mit Vorlage kopiert die Zelle die gelieferte Folge.
    explanation: Schnelle Reparatur zerstört oft das Gen. Reparatur mit Vorlage kann gezielt korrigieren.

  - kind: explain
    id: d1
    depth: 2
    body: "Cas9 schneidet nur, wenn neben dem Ziel eine kurze Erkennungsfolge liegt, das **PAM**. Bei Cas9 ist das NGG: irgendeine Base, dann zwei G. Ohne PAM kein Schnitt, auch wenn die Führung passt."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Wie viele verschiedene Folgen gibt es für eine Führung aus 20 Basen? Gib die Zehnerpotenz an, gerundet. (4²⁰ ≈ 1,1 · 10¹²)
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 20
        misconception: length
        text: 20 ist die Länge. Gesucht ist die Zehnerpotenz von 4²⁰.
    hints:
      - Jede Stelle hat 4 Möglichkeiten.
      - 4²⁰ ≈ 1,1 · 10¹²
    explanation: Rund 10¹² Folgen bei nur 3,2 · 10⁹ Basen im Erbgut. Eine 20er-Folge kommt meist nur einmal vor – darum trifft CRISPR so genau.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Die erste zugelassene CRISPR-Therapie (2023) behandelt Sichelzellkrankheit. Wie wirkt sie?
    params:
      options:
        - label: Blutstammzellen werden entnommen, verändert und zurückgegeben. Sie bilden wieder kindliches Hämoglobin.
          correct: true
        - label: Alle Zellen des Körpers werden verändert.
          feedback: Verändert werden nur Blutstammzellen außerhalb des Körpers.
        - label: Die Kinder der Patienten werden geheilt.
          feedback: Keimzellen werden nicht verändert. Die Änderung wird nicht vererbt.
    hints:
      - Wo entstehen rote Blutkörperchen?
      - Kindliches Hämoglobin sichelt nicht.
    explanation: Die Therapie schaltet einen Schalter aus, der das kindliche Hämoglobin nach der Geburt abschaltet. Eine Änderung an Körperzellen, nicht vererbbar.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Führung passt auch an einer zweiten Stelle mit nur einem Fehler. Was ist das Risiko?
    params:
      options:
        - label: Ein Schnitt am falschen Ort, der ein anderes Gen beschädigt
          correct: true
        - label: Kein Risiko, Cas9 schneidet nur perfekt Passendes.
          feedback: Einzelne Fehlpaarungen werden oft toleriert.
        - label: Die Zelle wird zum Virus.
          feedback: Das passiert nicht. Das Risiko sind Fehlschnitte.
    hints:
      - Passt »fast« auch manchmal?
      - Man nennt das Off-Target-Effekte.
    explanation: Darum prüft man Führungen am Computer auf ähnliche Stellen im Erbgut und nutzt genauere Cas9-Varianten.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie CRISPR-Cas9 eine bestimmte Stelle im Erbgut findet und verändert.
    params:
      keywords:
        - - führung
          - fuehrung
          - guide
          - rna
        - - paar
          - passend
          - pair
          - match
        - - schneid
          - schnitt
          - cut
        - - reparier
          - repair
      sample: Eine Führungs-RNA aus etwa 20 Basen paart mit der passenden DNA-Stelle. Cas9 schneidet dort beide Stränge. Die Zelle repariert den Schnitt, und dabei wird das Gen ausgeschaltet oder neu geschrieben.
    explanation: Finden durch Basenpaarung, schneiden durch Cas9, ändern durch Reparatur.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
