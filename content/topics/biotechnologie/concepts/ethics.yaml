id: bio.biotech.ethics
type: concept
title: "Ethik der Biotechnologie"
summary: "Was wir dürfen, sollen und lassen sollten."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Was wäre, wenn …?
    body: "Biotechnik kann Krankheiten besiegen – und Tiere neu erschaffen. Deck ein Gedankenspiel Schritt für Schritt auf. An jeder Station stellt sich dieselbe Frage: Dürfen wir das? Genau darum geht es in der **Ethik**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🦣
            front: Der Plan
            back: Eine Firma in den USA will das Mammut zurückholen.
          - icon: 🧬
            front: Gene einbauen
            back: Elefantenzellen sollen Mammut-Gene für Fell und Kälteschutz bekommen.
          - icon: 🐘
            front: Die Leihmutter
            back: Eine Elefantenkuh müsste das Kalb 22 Monate lang austragen.
          - icon: ❓
            front: Und dann?
            back: Ein Herdentier ohne Herde, in einer Welt, die es nicht kennt. Wer trägt die Verantwortung?

  - kind: problem
    id: hook
    widget: swipe
    prompt: Biotechnik im Alltag – gibt es das schon?
    params:
      cards:
        - text: Bakterien stellen menschliches Insulin her.
          right: true
          why: Seit 1982 ist es als Medikament zugelassen.
        - text: Ein Reis, der Vorstufen von Vitamin A bildet
          right: true
          why: Goldener Reis wurde 2021 auf den Philippinen zum Anbau zugelassen.
        - text: Eltern können die Intelligenz ihres Babys per Gentest wählen.
          right: false
          why: Intelligenz hängt von Tausenden Genen und der Umwelt ab.
        - text: Waschmittel enthalten Enzyme aus Mikroben.
          right: true
          why: Sie lösen Eiweiß- und Fettflecken.
      left: nein
      right: ja
    explanation: Biotechnik ist längst Alltag – doch nicht alles, was man liest, ist möglich.

  - kind: explain
    id: c1
    body: Man unterscheidet zwei Arten von Gentherapie. Bei der **somatischen** Therapie ändert man Körperzellen eines Menschen. Bei der Keimbahntherapie ändert man Ei, Spermium oder Embryo. Dann erben auch alle Nachkommen die Änderung.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Somatisch oder Keimbahn?
    params:
      buckets:
        - id: b1
          label: somatisch
        - id: b2
          label: Keimbahn
      items:
        - label: Blutstammzellen gegen Sichelzellen
          bucket: b1
        - label: Augenzellen gegen Erblindung
          bucket: b1
        - label: Embryo vor der Einnistung
          bucket: b2
        - label: Veränderte Eizelle
          bucket: b2
    hints:
      - Wird die Änderung an Kinder weitergegeben?
      - "Keimbahn heißt: Ei, Samen oder frühester Embryo."
    explanation: Somatische Therapie betrifft nur einen Menschen. Keimbahn-Eingriffe wirken auf alle künftigen Generationen.

  - kind: problem
    id: c3
    widget: choice
    prompt: 2018 veränderte ein Forscher in China das Erbgut von Embryonen. Zwei Mädchen wurden geboren. Warum wurde das weltweit verurteilt?
    params:
      options:
        - label: Es gab keinen medizinischen Bedarf, die Risiken waren unbekannt, und die Kinder konnten nicht zustimmen.
          correct: true
        - label: CRISPR ist überall verboten.
          feedback: CRISPR wird weltweit in Forschung und Therapie genutzt.
        - label: Weil es nicht funktioniert hat.
          feedback: Die Kritik betraf das Vorgehen, nicht nur das Ergebnis.
    hints:
      - Wer trägt das Risiko, und wer hat zugestimmt?
      - Die Änderung kann an künftige Kinder gehen.
    explanation: Der Forscher wurde zu drei Jahren Haft verurteilt. Viele Länder verbieten Keimbahn-Eingriffe für Schwangerschaften.

  - kind: explain
    id: d1
    depth: 2
    body: Ethik fragt nicht »Geht das?«, sondern »Sollen wir das?«. Wichtige Prinzipien sind **Nutzen**, Schadensvermeidung, Selbstbestimmung und Gerechtigkeit. Oft stehen sie im Konflikt.

  - kind: problem
    id: d2
    depth: 2
    widget: match
    prompt: Welches Prinzip steckt hinter dem Argument?
    params:
      pairs:
        - left: Heilt eine tödliche Krankheit
          right: Nutzen
        - left: Fehlschnitte könnten schaden
          right: Schaden vermeiden
        - left: Patienten entscheiden selbst
          right: Selbstbestimmung
        - left: Kostet zwei Millionen Euro
          right: Gerechtigkeit
    hints:
      - Wer profitiert, wer riskiert, wer entscheidet, wer kann zahlen?
      - Hoher Preis berührt den gerechten Zugang.
    explanation: Gute Ethik wägt alle Prinzipien ab, statt nur eines zu sehen.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Wie sehen viele Fachleute das heute?
    params:
      buckets:
        - id: b1
          label: weithin akzeptiert
        - id: b2
          label: stark umstritten
      items:
        - label: Insulin aus Bakterien
          bucket: b1
        - label: Somatische Therapie bei Erbkrankheit
          bucket: b1
        - label: Keimbahn-Eingriff für Schwangerschaft
          bucket: b2
        - label: Gene für bessere Leistung ändern
          bucket: b2
    hints:
      - Heilen ist anders bewertet als Verbessern.
      - Vererbbare Änderungen sind besonders heikel.
    explanation: Behandeln findet breite Zustimmung, Verbessern und Vererben nicht. Gesellschaften müssen die Grenzen aushandeln.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Gene Drive kann ein Gen in wenigen Jahren durch eine ganze Mückenart verbreiten – etwa eines, das Weibchen unfruchtbar macht. Was ist das zentrale Problem?
    params:
      options:
        - label: Er wirkt über Ländergrenzen und ist kaum rückholbar. Wer darf darüber entscheiden?
          correct: true
        - label: Er funktioniert nur im Labor.
          feedback: In Käfigversuchen brachte er Mückenpopulationen schon zum Zusammenbruch.
        - label: Es gibt kein Problem, Mücken sind lästig.
          feedback: Malaria zu besiegen wäre ein großer Nutzen. Doch die Folgen für Ökosysteme sind unklar.
    hints:
      - Ein Gene Drive umgeht Mendels 50-%-Regel.
      - Mücken halten sich nicht an Grenzen.
    explanation: Gene Drives verbinden riesigen Nutzen mit globalem Risiko. Darum fordern Fachleute schrittweise Tests und internationale Regeln.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Normal erbt ein Kind ein bestimmtes Allel mit 50 %. Ein Gene Drive gibt es mit 95 % weiter. Wie viel Prozent der Enkel tragen es, wenn die Kinder sich nur mit Partnern ohne das Allel paaren? Runde auf ganze Prozent.
    answer:
      value: 90
      tolerance: 1
    feedback:
      - when: numval(state.input) == 25
        misconception: mendel
        text: "Das wäre ohne Gene Drive: 50 % von 50 %."
    hints:
      - "Kinder: 95 %. Davon geben sie es wieder mit 95 % weiter."
      - 0,95 · 0,95
    explanation: 0,95² ≈ 90 % statt 25 % bei Mendel. So kann sich ein Gen in wenigen Generationen durchsetzen.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum ist ein Eingriff in die Keimbahn heikler als eine Therapie am Körper?"
    params:
      keywords:
        - - keimbahn
          - germline
          - embryo
        - - vererb
          - nachkommen
          - kinder
          - inherit
          - descend
          - children
        - - zustimm
          - einwillig
          - consent
        - - risiko
          - unbekannt
          - risk
          - unknown
      sample: Somatische Therapie ändert nur die Zellen eines Menschen, der zustimmen kann. Keimbahn-Eingriffe am Embryo werden an alle Nachkommen vererbt. Die Kinder können nicht zustimmen, und die Risiken sind unbekannt.
    explanation: Vererbbarkeit plus fehlende Zustimmung plus unklare Risiken.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
