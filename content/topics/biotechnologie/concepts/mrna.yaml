id: bio.biotech.mrna
type: concept
title: "mRNA-Impfstoffe"
summary: "Ein Bauplan auf Zeit für das Immunsystem."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein mRNA-Impfstoff enthält kein Virus, nur einen Bauplan. Was macht dein Körper damit?
    params:
      options:
        - label: Zellen bauen nach dem Plan ein Virus-Eiweiß, und das Immunsystem lernt es kennen.
          correct: true
        - label: Er baut daraus ganze Viren.
          feedback: Der Plan enthält nur ein einziges Eiweiß, kein Virus.
        - label: Er baut den Plan in die DNA ein.
          feedback: mRNA gelangt nicht in den Zellkern und wird in Tagen abgebaut.
    hints:
      - mRNA ist eine Anleitung für Ribosomen.
      - Welche Teile eines Virus erkennt ein Antikörper?
    explanation: Die Zelle wird kurz zur Eiweißfabrik. Das Immunsystem bildet Antikörper und Gedächtniszellen.

  - kind: explain
    id: c1
    body: Ein **mRNA-Impfstoff** verpackt Boten-RNA in winzige Fettkügelchen. Sie verschmelzen mit Muskelzellen am Oberarm. Ribosomen lesen die mRNA und bauen das Virus-Eiweiß. Danach wird die mRNA abgebaut.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne, was nach der Impfung passiert.
    params:
      items:
        - label: Fettkügelchen bringen mRNA in Zellen
        - label: Ribosomen bauen das Virus-Eiweiß
        - label: Das Eiweiß erscheint auf der Zelle
        - label: Immunzellen erkennen es
        - label: Antikörper und Gedächtniszellen entstehen
    hints:
      - Erst muss der Plan in die Zelle.
      - Das Immunsystem reagiert auf das fertige Eiweiß.
    explanation: Vom Bauplan zum Gedächtnis in wenigen Tagen.

  - kind: problem
    id: c3
    widget: swipe
    prompt: Stimmt das?
    params:
      cards:
        - text: mRNA-Impfstoffe verändern dein Erbgut.
          right: false
          why: mRNA gelangt nicht in den Zellkern und wird nicht in DNA umgeschrieben.
        - text: Die mRNA wird nach wenigen Tagen abgebaut.
          right: true
          why: RNA ist sehr kurzlebig.
        - text: Der Impfstoff enthält keine lebenden Viren.
          right: true
          why: Nur den Bauplan für ein Eiweiß.
        - text: mRNA-Impfstoffe wurden erst 2020 erfunden.
          right: false
          why: Die Forschung dazu lief seit den 1990er-Jahren.
    explanation: Kurzlebig, ohne Virus und ohne Zugriff auf die DNA – so funktioniert die Technik.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die [[mRNA]] steckt in winzigen [[Fettkügelchen]]. In der Zelle bauen [[Ribosomen]] danach ein Virus-Eiweiß.
      distractors:
        - Zellkern
        - Antibiotika
    explanation: Verpackung, Ablesen, Eiweiß – mehr macht die mRNA nicht.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Frühe mRNA-Versuche lösten starke Entzündungen aus. Karikó und Weissman fanden die Lösung – Nobelpreis 2023. Welche?
    params:
      options:
        - label: Ein leicht veränderter Baustein statt Uridin, den das angeborene Immunsystem nicht als fremd erkennt
          correct: true
        - label: Mehr mRNA pro Dosis
          feedback: Mehr fremde RNA hätte noch mehr Entzündung gebracht.
        - label: Impfen in die Vene
          feedback: Der Ort war nicht das Problem, sondern die RNA selbst.
    hints:
      - Fremde RNA ist für Zellen ein Virus-Alarm.
      - Ein kleiner chemischer Unterschied tarnt die RNA.
    explanation: Pseudouridin-Bausteine machen die mRNA unauffällig und sorgen dafür, dass mehr Eiweiß entsteht.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Impfstoff enthält 30 µg mRNA. Ein Bauplan wiegt etwa 2,3 · 10⁻¹⁸ g pro Molekül (2,3 Attogramm). Wie viele Billionen mRNA-Moleküle sind das ungefähr? Runde auf eine ganze Zahl.
    params:
      unit: Billionen
    answer:
      value: 13
      tolerance: 1
    hints:
      - 30 µg = 3 · 10⁻⁵ g.
      - "3 · 10⁻⁵ : 2,3 · 10⁻¹⁸"
    explanation: Rund 1,3 · 10¹³, also 13 Billionen Moleküle – gut ein Drittel so viele, wie du Zellen hast.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Der erste mRNA-Impfstoff gegen Covid-19 musste bei etwa −70 °C lagern. Warum?
    params:
      options:
        - label: mRNA und Fettkügelchen zerfallen bei Wärme schnell.
          correct: true
        - label: Damit die Viren darin schlafen.
          feedback: Es sind gar keine Viren darin.
        - label: Kälte macht ihn stärker.
          feedback: Kälte erhält ihn nur, sie verstärkt nichts.
    hints:
      - RNA ist ein empfindliches Molekül.
      - Enzyme, die RNA abbauen, sind fast überall.
    explanation: Neuere Rezepturen halten im Kühlschrank länger. Die Kühlkette blieb trotzdem eine Herausforderung für arme Länder.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ließen sich mRNA-Impfstoffe 2020 so schnell entwickeln?
    params:
      options:
        - label: Man braucht nur die Gensequenz. Sie lag wenige Tage nach dem Ausbruch online vor.
          correct: true
        - label: Weil man Sicherheitsprüfungen wegließ.
          feedback: Die Studien liefen mit Zehntausenden Menschen, nur parallel statt nacheinander.
        - label: Weil das Virus harmlos war.
          feedback: Es war gefährlich. Schnell ging es wegen der Technik.
    hints:
      - Was braucht man, um eine mRNA zu bauen?
      - Kein Virus muss gezüchtet werden.
    explanation: Die Plattform war jahrzehntelang vorbereitet. Neu war nur die Sequenz – das ist der große Vorteil der Technik.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein mRNA-Impfstoff schützt, ohne das Erbgut zu verändern.
    params:
      keywords:
        - - mrna
          - bauplan
          - blueprint
        - - ribosom
          - eiweiß
          - eiweiss
          - protein
        - - abgebaut
          - kern
          - nucleus
          - broken down
          - degrad
        - - antikörper
          - antikoerper
          - gedächtnis
          - gedaechtnis
          - antibod
          - memory
      sample: Die mRNA ist ein Bauplan für ein Virus-Eiweiß. Ribosomen bauen das Eiweiß, und das Immunsystem bildet Antikörper und Gedächtniszellen. Die mRNA kommt nicht in den Zellkern und wird nach Tagen abgebaut.
    explanation: Ein Bauplan auf Zeit – das Gedächtnis bleibt, die mRNA nicht.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
