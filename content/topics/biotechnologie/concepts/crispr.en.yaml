id: bio.biotech.crispr
type: concept
title: "CRISPR-Cas9"
summary: "The gene scissors and how they find their target."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Bacteria store pieces of viruses that once attacked them in their own genome. What for?
    params:
      options:
        - label: "As a memory: on the next attack they recognise and cut up the viral genes."
          correct: true
        - label: As food
          feedback: Only a memory is stored, not food.
        - label: By accident
          feedback: The system is precise and widespread.
    hints:
      - Think of the immune system.
      - A stored sequence serves as a mugshot.
    explanation: That is CRISPR – a bacterial immune system. Researchers turned it into a tool.

  - kind: explain
    id: c1
    body: In **CRISPR-Cas9** a short piece of RNA guides the enzyme Cas9 to a matching DNA site. The guide RNA is about 20 bases long. Cas9 cuts both strands there.

  - kind: problem
    id: c2
    widget: order
    prompt: Order how CRISPR changes a gene.
    params:
      items:
        - label: Design a guide RNA matching the target
        - label: Bring Cas9 with the guide into the cell
        - label: Guide pairs with the target DNA
        - label: Cas9 cuts the double strand
        - label: The cell repairs the cut
    hints:
      - First decide on the target.
      - The actual change happens during repair.
    explanation: Cas9 only cuts – the change comes from the cell’s repair.

  - kind: problem
    id: c3
    widget: choice
    prompt: The guide RNA should bind to the DNA sequence 5’-GATTACA-3’. What must the matching part of the RNA be?
    params:
      options:
        - label: 3’-CUAAUGU-5’
          correct: true
        - label: 3’-CTAATGT-5’
          feedback: Almost – but RNA has U instead of T.
        - label: 3’-GAUUACA-5’
          feedback: That is a copy, not a complement.
    hints:
      - G–C and A–U.
      - The direction is reversed.
    explanation: Base pairing as always, just with uracil. That is how the guide finds its target.

  - kind: problem
    id: c4
    widget: buckets
    prompt: What happens during repair?
    params:
      buckets:
        - id: b1
          label: Gene is knocked out
        - id: b2
          label: new sequence is inserted
      items:
        - label: Quickly patched, bases lost
          bucket: b1
        - label: Reading frame shifted
          bucket: b1
        - label: Repaired using a template
          bucket: b2
        - label: Healthy variant copied in
          bucket: b2
    hints:
      - Without a template small errors often happen.
      - With a template the cell copies the supplied sequence.
    explanation: Quick repair often destroys the gene. Repair with a template can correct precisely.

  - kind: explain
    id: d1
    depth: 2
    body: "Cas9 only cuts if a short recognition sequence lies next to the target: the **PAM**. For Cas9 it is NGG: any base, then two Gs. No PAM, no cut, even if the guide matches."

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: How many different sequences are there for a 20-base guide? Give the power of ten, rounded. (4²⁰ ≈ 1.1 × 10¹²)
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 20
        misconception: length
        text: 20 is the length. You need the power of ten of 4²⁰.
    hints:
      - Each position has 4 options.
      - 4²⁰ ≈ 1.1 × 10¹²
    explanation: About 10¹² sequences against only 3.2 × 10⁹ bases in the genome. A 20-base sequence usually occurs only once – that is why CRISPR is so precise.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: The first approved CRISPR therapy (2023) treats sickle cell disease. How does it work?
    params:
      options:
        - label: Blood stem cells are taken out, edited and returned. They make fetal haemoglobin again.
          correct: true
        - label: Every cell in the body is edited.
          feedback: Only blood stem cells are edited, outside the body.
        - label: The patients’ children are cured.
          feedback: Germ cells are not changed. The edit is not inherited.
    hints:
      - Where are red blood cells made?
      - Fetal haemoglobin does not sickle.
    explanation: The therapy disables a switch that turns off fetal haemoglobin after birth. A change to body cells, not inheritable.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A guide also matches a second site with just one mismatch. What is the risk?
    params:
      options:
        - label: A cut at the wrong place that damages another gene
          correct: true
        - label: No risk, Cas9 only cuts perfect matches.
          feedback: Single mismatches are often tolerated.
        - label: The cell turns into a virus.
          feedback: That does not happen. The risk is off-target cuts.
    hints:
      - Does "almost" sometimes fit?
      - These are called off-target effects.
    explanation: That is why guides are checked by computer for similar sites in the genome, and more precise Cas9 variants are used.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how CRISPR-Cas9 finds and changes a particular spot in the genome.
    params:
      keywords:
        - - führung
          - fuehrung
          - guide
          - rna
        - - paar
          - passend
          - pair
          - match
        - - schneid
          - schnitt
          - cut
        - - reparier
          - repair
      sample: A guide RNA of about 20 bases pairs with the matching DNA site. Cas9 cuts both strands there. The cell repairs the cut, and in doing so the gene is switched off or rewritten.
    explanation: Find by base pairing, cut with Cas9, change through repair.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
