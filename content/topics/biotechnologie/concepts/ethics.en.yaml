id: bio.biotech.ethics
type: concept
title: "The ethics of biotechnology"
summary: "What we may, should and should not do."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: swipe
    prompt: Biotech in everyday life – does it already exist?
    params:
      cards:
        - text: Bacteria make human insulin.
          right: true
          why: It has been an approved drug since 1982.
        - text: A rice that makes vitamin A precursors
          right: true
          why: Golden Rice was approved for growing in the Philippines in 2021.
        - text: Parents can choose their baby’s intelligence by gene test.
          right: false
          why: Intelligence depends on thousands of genes and the environment.
        - text: Washing powders contain enzymes from microbes.
          right: true
          why: They dissolve protein and grease stains.
      left: no
      right: yes
    explanation: Biotech is already everyday life – but not everything you read about is possible.

  - kind: explain
    id: c1
    body: There are two kinds of gene therapy. In **somatic** therapy you change body cells of one person. In germline therapy you change an egg, sperm or embryo. Then all descendants inherit the change too.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Somatic or germline?
    params:
      buckets:
        - id: b1
          label: somatic
        - id: b2
          label: germline
      items:
        - label: Blood stem cells against sickle cell
          bucket: b1
        - label: Eye cells against blindness
          bucket: b1
        - label: Embryo before implantation
          bucket: b2
        - label: Edited egg cell
          bucket: b2
    hints:
      - Is the change passed on to children?
      - Germline means egg, sperm or the earliest embryo.
    explanation: Somatic therapy affects only one person. Germline edits affect all future generations.

  - kind: problem
    id: c3
    widget: choice
    prompt: In 2018 a researcher in China edited the genomes of embryos. Two girls were born. Why was this condemned worldwide?
    params:
      options:
        - label: There was no medical need, the risks were unknown, and the children could not consent.
          correct: true
        - label: CRISPR is banned everywhere.
          feedback: CRISPR is used worldwide in research and therapy.
        - label: Because it did not work.
          feedback: The criticism was about the conduct, not only the result.
    hints:
      - Who bears the risk, and who consented?
      - The change can pass to future children.
    explanation: The researcher was sentenced to three years in prison. Many countries ban germline editing for pregnancies.

  - kind: explain
    id: d1
    depth: 2
    body: Ethics does not ask "Can we?" but "Should we?". Key principles are **benefit**, avoiding harm, self-determination and fairness. They often conflict.

  - kind: problem
    id: d2
    depth: 2
    widget: match
    prompt: Which principle lies behind the argument?
    params:
      pairs:
        - left: Cures a deadly disease
          right: Benefit
        - left: Off-target cuts could harm
          right: Avoiding harm
        - left: Patients decide themselves
          right: Self-determination
        - left: Costs two million euros
          right: Fairness
    hints:
      - Who benefits, who risks, who decides, who can pay?
      - A high price touches fair access.
    explanation: Good ethics weighs all principles instead of seeing only one.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: How do many experts see this today?
    params:
      buckets:
        - id: b1
          label: widely accepted
        - id: b2
          label: highly contested
      items:
        - label: Insulin from bacteria
          bucket: b1
        - label: Somatic therapy for inherited disease
          bucket: b1
        - label: Germline edit for a pregnancy
          bucket: b2
        - label: Editing genes to boost performance
          bucket: b2
    hints:
      - Healing is judged differently from enhancing.
      - Heritable changes are especially sensitive.
    explanation: Treatment finds broad support, enhancement and heritability do not. Societies must negotiate the limits.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A gene drive can spread a gene through an entire mosquito species within a few years – for example one that makes females infertile. What is the central problem?
    params:
      options:
        - label: It acts across borders and can hardly be recalled. Who gets to decide?
          correct: true
        - label: It only works in the lab.
          feedback: In cage trials it has already crashed mosquito populations.
        - label: There is no problem, mosquitoes are a nuisance.
          feedback: Beating malaria would be a huge benefit. But the effects on ecosystems are unclear.
    hints:
      - A gene drive sidesteps Mendel’s 50 % rule.
      - Mosquitoes do not respect borders.
    explanation: Gene drives combine huge benefits with global risk. That is why experts call for step-by-step testing and international rules.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Normally a child inherits a particular allele with 50 % probability. A gene drive passes it on with 95 %. What percentage of grandchildren carry it if the children only mate with partners without the allele? Round to whole percent.
    answer:
      value: 90
      tolerance: 1
    feedback:
      - when: numval(state.input) == 25
        misconception: mendel
        text: "That would be without a gene drive: 50 % of 50 %."
    hints:
      - "Children: 95 %. They pass it on again with 95 %."
      - 0.95 × 0.95
    explanation: 0.95² ≈ 90 % instead of 25 % under Mendel. That is how a gene can take over within a few generations.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why germline edits are more controversial than somatic gene therapy.
    params:
      keywords:
        - - keimbahn
          - germline
          - embryo
        - - vererb
          - nachkommen
          - kinder
          - inherit
          - descend
          - children
        - - zustimm
          - einwillig
          - consent
        - - risiko
          - unbekannt
          - risk
          - unknown
      sample: Somatic therapy changes only the cells of one person who can consent. Germline edits to an embryo are inherited by all descendants. The children cannot consent, and the risks are unknown.
    explanation: Heritability plus missing consent plus unclear risks.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
