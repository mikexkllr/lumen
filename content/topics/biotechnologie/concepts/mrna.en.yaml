id: bio.biotech.mrna
type: concept
title: "mRNA vaccines"
summary: "A temporary blueprint for the immune system."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A blueprint with an expiry date
    body: "An mRNA vaccine only delivers a **blueprint** to your cells – and it does not last for ever. Slide the half-life and the time: how much is left after one day?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: decay

  - kind: problem
    id: hook
    widget: choice
    prompt: An mRNA vaccine contains no virus, just a blueprint. What does your body do with it?
    params:
      options:
        - label: Cells build a viral protein from the plan, and the immune system learns to recognise it.
          correct: true
        - label: It builds whole viruses from it.
          feedback: The plan contains only a single protein, not a virus.
        - label: It builds the plan into its DNA.
          feedback: mRNA does not enter the nucleus and is broken down within days.
    hints:
      - mRNA is an instruction for ribosomes.
      - Which parts of a virus does an antibody recognise?
    explanation: The cell briefly becomes a protein factory. The immune system makes antibodies and memory cells.

  - kind: explain
    id: c1
    body: An **mRNA vaccine** packs messenger RNA into tiny fat droplets. They fuse with muscle cells in the upper arm. Ribosomes read the mRNA and build the viral protein. Afterwards the mRNA is broken down.

  - kind: problem
    id: c2
    widget: order
    prompt: Order what happens after vaccination.
    params:
      items:
        - label: Fat droplets carry mRNA into cells
        - label: Ribosomes build the viral protein
        - label: The protein appears on the cell
        - label: Immune cells recognise it
        - label: Antibodies and memory cells form
    hints:
      - First the plan must get into the cell.
      - The immune system reacts to the finished protein.
    explanation: From blueprint to memory within a few days.

  - kind: problem
    id: c3
    widget: swipe
    prompt: True or false?
    params:
      cards:
        - text: mRNA vaccines change your genome.
          right: false
          why: mRNA does not enter the nucleus and is not turned into DNA.
        - text: The mRNA is broken down after a few days.
          right: true
          why: RNA is very short-lived.
        - text: The vaccine contains no live viruses.
          right: true
          why: Just the blueprint for one protein.
        - text: mRNA vaccines were only invented in 2020.
          right: false
          why: Research on them had been going on since the 1990s.
    explanation: Short-lived, without virus and without access to DNA – that is how the technology works.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: The [[mRNA]] is packed in tiny [[fat droplets]]. Inside the cell [[ribosomes]] then build a viral protein.
      distractors:
        - nucleus
        - antibiotics
    explanation: Packaging, reading, protein – that is all the mRNA does.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Early mRNA attempts triggered strong inflammation. Karikó and Weissman found the solution – Nobel Prize 2023. Which?
    params:
      options:
        - label: A slightly modified building block instead of uridine that innate immunity does not see as foreign
          correct: true
        - label: More mRNA per dose
          feedback: More foreign RNA would have caused even more inflammation.
        - label: Injecting into a vein
          feedback: The site was not the problem, the RNA itself was.
    hints:
      - Foreign RNA is a virus alarm for cells.
      - A small chemical change disguises the RNA.
    explanation: Pseudouridine building blocks make the mRNA inconspicuous and lead to more protein being made.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A vaccine dose contains 30 µg of mRNA. One blueprint weighs about 2.3 × 10⁻¹⁸ g per molecule (2.3 attograms). About how many trillion mRNA molecules is that? Round to a whole number.
    params:
      unit: trillion
    answer:
      value: 13
      tolerance: 1
    hints:
      - 30 µg = 3 × 10⁻⁵ g.
      - 3 × 10⁻⁵ ÷ 2.3 × 10⁻¹⁸
    explanation: About 1.3 × 10¹³, so 13 trillion molecules – over a third as many as you have cells.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: The first mRNA vaccine against Covid-19 had to be stored at about −70 °C. Why?
    params:
      options:
        - label: mRNA and the fat droplets break down quickly when warm.
          correct: true
        - label: So that the viruses inside stay dormant.
          feedback: There are no viruses in it at all.
        - label: Cold makes it stronger.
          feedback: Cold only preserves it, it strengthens nothing.
    hints:
      - RNA is a fragile molecule.
      - Enzymes that break down RNA are almost everywhere.
    explanation: Newer formulations last longer in a fridge. The cold chain still remained a challenge for poor countries.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why could mRNA vaccines be developed so quickly in 2020?
    params:
      options:
        - label: You only need the gene sequence. It was online a few days after the outbreak.
          correct: true
        - label: Because safety tests were skipped.
          feedback: Trials ran with tens of thousands of people, just in parallel instead of one after another.
        - label: Because the virus was harmless.
          feedback: It was dangerous. Speed came from the technology.
    hints:
      - What do you need to build an mRNA?
      - No virus needs to be grown.
    explanation: The platform had been prepared for decades. Only the sequence was new – that is the great advantage of the technology.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how an mRNA vaccine protects without changing your genome.
    params:
      keywords:
        - - mrna
          - bauplan
          - blueprint
        - - ribosom
          - eiweiß
          - eiweiss
          - protein
        - - abgebaut
          - kern
          - nucleus
          - broken down
          - degrad
        - - antikörper
          - antikoerper
          - gedächtnis
          - gedaechtnis
          - antibod
          - memory
      sample: The mRNA is a blueprint for one viral protein. Ribosomes build the protein, and the immune system makes antibodies and memory cells. The mRNA does not enter the nucleus and is broken down after a few days.
    explanation: A temporary blueprint – the memory stays, the mRNA does not.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
