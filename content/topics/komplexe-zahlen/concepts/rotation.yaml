id: math.complex.rotation
type: concept
title: Drehungen rechnen
summary: Die Ebene mit i drehen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: drehen
    widget: graph
    prompt: "z = 2 + i ist eingezeichnet. Wo landet i · z? Zieh W dorthin."
    params:
      x: [-4, 4]
      y: [-4, 4]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: Z, x: 2, y: 1, draggable: false }
        - { id: W, x: 1, y: -2 }
      segments: [[O, Z], [O, W]]
    answer: { points: { W: { x: -1, y: 2 } } }
    hints:
      - "i · (2 + i) = 2i + i² = −1 + 2i."
    explanation: (−1 | 2) – eine Vierteldrehung gegen den Uhrzeigersinn.

  - kind: problem
    id: rundum
    widget: numeric
    prompt: Wie oft musst du mit i multiplizieren, um einmal ganz herumzudrehen?
    params: { unit: Mal }
    answer: { value: 4 }
    hints:
      - Jedes Mal eine Vierteldrehung.
    explanation: 4 · 90° = 360° – darum ist i⁴ = 1.

  - kind: explain
    id: s3
    body: |
      Weil Multiplikation dreht, beschreiben komplexe Zahlen alles, was schwingt oder rotiert: **Wechselstrom**, Funkwellen, Quantenzustände. Statt Sinus und Kosinus rechnet man mit Drehungen in der Ebene.

  - kind: problem
    id: anwendung
    widget: buckets
    prompt: Rechnet man hier oft mit komplexen Zahlen?
    params:
      buckets: [{ label: oft }, { label: kaum }]
      items:
        - { label: Wechselstrom im Stromnetz, bucket: oft }
        - { label: Quantenphysik, bucket: oft }
        - { label: Audio- und Bildkompression, bucket: oft }
        - { label: Einkaufsliste addieren, bucket: kaum }
    hints:
      - Wo schwingt oder dreht sich etwas?
    explanation: Überall, wo Schwingungen auftreten, sind komplexe Zahlen das Werkzeug der Wahl.

  - kind: problem
    id: c1
    widget: sim
    prompt: Eine komplexe Zahl der Länge 1 ist $\cos\varphi + i\,\sin\varphi$. Stell den Winkel so ein, dass die Zahl genau **i** ist.
    params:
      scene: unitcircle
    answer:
      angle: 90
    explanation: "Bei 90°: cos = 0 und sin = 1. Die Zahl i ist eine Vierteldrehung."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die Gleichung $z^3 = 1$ hat drei komplexe Lösungen. Sie liegen gleichmäßig auf dem Einheitskreis. Welchen Winkel hat die zweite?
    params:
      unit: °
    answer:
      value: 120
    hints:
      - Dreimal derselbe Winkel muss 360° ergeben.
    explanation: 0°, 120° und 240°. Die n-ten **Einheitswurzeln** bilden ein regelmäßiges n-Eck.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die Eulersche Formel lautet $e^{i\varphi} = \cos\varphi + i\,\sin\varphi$. Was folgt für $\varphi = \pi$?
    params:
      options:
        - label: $e^{i\pi} + 1 = 0$
          correct: true
        - label: $e^{i\pi} = 1$
          feedback: Eine halbe Drehung landet bei −1, nicht bei 1.
        - label: $e^{i\pi} = i$
          feedback: Das wäre eine Vierteldrehung, also π/2.
    hints:
      - π im Bogenmaß ist eine halbe Drehung.
    explanation: Die fünf wichtigsten Zahlen – 0, 1, e, i und π – in einer Gleichung. Viele halten sie für die schönste der Mathematik.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was passiert in der Zahlenebene, wenn man mit i multipliziert?"
    params:
      keywords:
        - - dreh
          - rotat
          - turn
        - - "90"
          - viertel
          - quarter
          - rechter winkel
          - right angle
        - - länge
          - betrag
          - length
          - abstand
          - size
          - gleich
      sample: Die Zahl wird um 90 Grad gegen den Uhrzeigersinn gedreht. Ihre Länge bleibt dabei gleich, weil i die Länge 1 hat.
    difficulty: 3

srs:
  cards_from: [drehen, rundum]
