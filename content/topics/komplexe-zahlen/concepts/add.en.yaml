id: math.complex.add
type: concept
title: Adding like arrows
summary: Adding complex numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      You add complex numbers separately: real parts together, imaginary parts together. In the plane, this is exactly like placing arrows end to end.

  - kind: problem
    id: summe
    widget: choice
    prompt: What is (2 + 3i) + (1 − i)?
    params:
      options:
        - { label: "3 + 2i", correct: true }
        - { label: "3 + 4i", feedback: "3i + (−i) gives 2i." }
        - { label: "5i", feedback: "Real and imaginary parts stay separate." }
    hints:
      - First 2 + 1, then 3i − i.
    explanation: (2 + 1) + (3 − 1)i = 3 + 2i.

  - kind: problem
    id: realteil
    widget: numeric
    prompt: What is the real part of ({{a}} + {{b}}i) + ({{c}} − {{d}}i)?
    params: { placeholder: "Real part" }
    answer: { value: "{{a + c}}" }
    hints:
      - Only the numbers without i.
    explanation: "{{a}} + {{c}} = {{a + c}}."
    variants:
      params: { a: "int[1,9]", b: "int[1,9]", c: "int[1,9]", d: "int[1,9]" }
      defaults: { a: 4, b: 2, c: 3, d: 5 }

  - kind: problem
    id: pfeil
    widget: graph
    prompt: "z₁ = 2 + i is drawn. Attach z₂ = 1 + 2i and drag S to the sum."
    params:
      x: [-1, 5]
      y: [-1, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 2, y: 1, draggable: false }
        - { id: S, x: 4, y: 1 }
      segments: [[O, A], [A, S]]
    answer: { points: { S: { x: 3, y: 3 } } }
    hints:
      - From A, go 1 to the right and 2 up.
    explanation: (2 + 1) + (1 + 2)i = 3 + 3i.

srs:
  cards_from: [summe, realteil]
