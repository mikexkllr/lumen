id: math.complex.add
type: concept
title: Adding like arrows
summary: Adding complex numbers.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: numeric
    prompt: You walk 3 steps right and 2 up. Then 1 right and 4 up. How many steps have you gone up in total?
    answer:
      value: 6
    hints:
      - 2 + 4.
    explanation: Right and up are added separately. Complex numbers are added in just this way.

  - kind: explain
    id: s1
    body: |
      You add complex numbers separately: real parts together, imaginary parts together. In the plane, this is exactly like placing **arrows** end to end.

  - kind: problem
    id: summe
    widget: choice
    prompt: What is (2 + 3i) + (1 − i)?
    params:
      options:
        - { label: "3 + 2i", correct: true }
        - { label: "3 + 4i", feedback: "3i + (−i) gives 2i." }
        - { label: "5i", feedback: "Real and imaginary parts stay separate." }
    hints:
      - First 2 + 1, then 3i − i.
    explanation: (2 + 1) + (3 − 1)i = 3 + 2i.

  - kind: problem
    id: realteil
    widget: numeric
    prompt: What is the real part of ({{a}} + {{b}}i) + ({{c}} − {{d}}i)?
    params: { placeholder: "Real part" }
    answer: { value: "{{a + c}}" }
    hints:
      - Only the numbers without i.
    explanation: "{{a}} + {{c}} = {{a + c}}."
    variants:
      params: { a: "int[1,9]", b: "int[1,9]", c: "int[1,9]", d: "int[1,9]" }
      defaults: { a: 4, b: 2, c: 3, d: 5 }

  - kind: problem
    id: pfeil
    widget: graph
    prompt: "z₁ = 2 + i is drawn. Attach z₂ = 1 + 2i and drag S to the sum."
    params:
      x: [-1, 5]
      y: [-1, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 2, y: 1, draggable: false }
        - { id: S, x: 4, y: 1 }
      segments: [[O, A], [A, S]]
    answer: { points: { S: { x: 3, y: 3 } } }
    hints:
      - From A, go 1 to the right and 2 up.
    explanation: (2 + 1) + (1 + 2)i = 3 + 3i.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is $(5 + 2i) - (3 - 4i)$? Give the imaginary part.
    answer:
      value: 6
    hints:
      - 2 − (−4).
    explanation: 2 + 6i. Minus a negative becomes plus.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Can complex numbers be ordered by size, that is, can you say whether $i < 1$?
    params:
      options:
        - label: No – a plane has no order compatible with arithmetic
          correct: true
        - label: Yes, by absolute value
          feedback: Then i and 1 would be “equal in size” although they differ.
        - label: Yes, by real part
          feedback: Then i would equal 0 in the order, and i² = −1 would break the rules.
    hints:
      - If i > 0, then i · i would have to be > 0 too.
    explanation: Both i > 0 and i < 0 lead to −1 > 0. The complex numbers are not an ordered field.
    difficulty: 3

srs:
  cards_from: [summe, realteil]
