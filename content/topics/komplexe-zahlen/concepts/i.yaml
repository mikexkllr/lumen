id: math.complex.i
type: concept
title: Die Zahl i
summary: Die Wurzel aus minus eins.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die erfundene Zahl
    body: Sie heißt **i** und galt lange als Spinnerei. Heute rechnen Ingenieure, Physikerinnen und Grafiker täglich mit ihr. Deck die Karten auf und sieh, wo sie überall steckt.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ⚡
            front: Stromnetz
            back: Ingenieure berechnen Wechselstrom mit i – sie schreiben es nur als j.
          - icon: ⚛️
            front: Quantenphysik
            back: In der Grundgleichung der Quantenwelt steht ein i – ganz vorn.
          - icon: 🌀
            front: Fraktale
            back: Das berühmte Apfelmännchen entsteht aus einer einfachen Rechnung mit i.
          - icon: 🎵
            front: Musik-Apps
            back: Wer Töne zerlegt, etwa für einen Equalizer, rechnet mit i.

  - kind: problem
    id: keine
    widget: choice
    prompt: Welche reelle Zahl ergibt mit sich selbst multipliziert −1?
    params:
      options:
        - { label: Keine, correct: true }
        - { label: "−1", feedback: "(−1) · (−1) = +1." }
        - { label: "1", feedback: "1 · 1 = 1." }
    hints:
      - Minus mal minus ergibt plus.
    explanation: Jedes Quadrat einer reellen Zahl ist mindestens 0.

  - kind: explain
    id: s2
    body: |
      Mathematiker erfanden einfach eine neue Zahl: $i$ mit $i^2 = -1$. Klingt nach Trick – ist aber so nützlich, dass Elektrotechnik und **Quantenphysik** ohne sie kaum auskommen.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: Was ist ({{k}}i)²?
    params: { placeholder: "Zahl" }
    answer: { value: "{{-k * k}}" }
    feedback:
      - when: "numval(state.input) == k * k"
        misconception: forgot-sign
        text: i² ist −1 – das Vorzeichen dreht sich.
    hints:
      - "{{k}}² · i²."
    explanation: "{{k * k}} · (−1) = {{-k * k}}."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 3 }

  - kind: problem
    id: hoch4
    widget: choice
    prompt: Was ist i⁴?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "−1", feedback: "Das ist i². Noch einmal quadrieren." }
        - { label: "4i", feedback: "Hoch 4 heißt viermal mit sich selbst multiplizieren." }
    hints:
      - i⁴ = i² · i².
    explanation: (−1) · (−1) = 1. Die Potenzen von i wiederholen sich – i, −1, −i, 1.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Die Potenzen von i wiederholen sich: $i^1 = i$, $i^2$ = [[−1]], $i^3$ = [[−i]], $i^4$ = [[1]]."
      distractors:
        - "0"
        - 2i

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ist $i^{22}$? Gib die reelle Zahl an.
    answer:
      value: -1
    hints:
      - 22 = 5 · 4 + 2. Der Zyklus hat die Länge 4.
    explanation: i²² = i² = −1.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Die Potenzen von i laufen im **Zyklus**: i, −1, −i, 1, dann wieder i. Für $i^n$ zählt also nur der Rest von n beim Teilen durch 4 – Rechnen modulo 4."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Welchen Realteil hat $i^{ {{k}} }$?
    answer:
      value: "{{re}}"
    hints:
      - Welchen Rest lässt {{k}} beim Teilen durch 4?
      - Rest 0 → 1, Rest 1 → i, Rest 2 → −1, Rest 3 → −i.
    explanation: "{{k}} ≡ {{mod(k, 4)}} (mod 4), also Realteil {{re}}."
    difficulty: 2
    variants:
      params:
        k: int[10,99]
      derive:
        re: "mod(k, 4) == 0 ? 1 : mod(k, 4) == 2 ? -1 : 0"
      defaults:
        k: 22

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Rechne $(1 + i)^2$ aus. Welchen Imaginärteil hat das Ergebnis?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: cancelled-all
        text: "Binomische Formel: 1 + 2i + i². Nur der Realteil fällt weg."
    hints:
      - (1 + i)² = 1 + 2i + i².
      - i² = −1.
    explanation: 1 + 2i − 1 = 2i. Ein rein imaginäres Ergebnis aus einer »halb reellen« Zahl.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Welche Lösungen hat $x^2 + 2x + 5 = 0$?
    params:
      options:
        - label: −1 + 2i und −1 − 2i
          correct: true
        - label: Keine – auch nicht komplex
          feedback: Mit i hat **jede** quadratische Gleichung Lösungen.
        - label: 1 + 2i und 1 − 2i
          feedback: −p/2 ist −1, nicht +1.
    hints:
      - "pq-Formel: −1 ± √(1 − 5)."
    explanation: "√(−4) = 2i. Der **Fundamentalsatz der Algebra**: Jedes Polynom vom Grad n hat genau n komplexe Nullstellen."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: Erfunden wurde i nicht für x² = −1, sondern für kubische Gleichungen. Cardanos Formel von 1545 führt bei x³ = 15x + 4 auf Wurzeln aus −121. **Bombelli** rechnete trotzdem weiter – und erhielt am Ende die reelle Lösung 4.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "Prüfe Bombellis Lösung: Welche positive ganze Zahl löst $x^3 = 15x + 4$?"
    answer:
      value: 4
    hints:
      - "Probiere kleine Zahlen: 1, 2, 3, 4."
      - 4³ = 64 und 15 · 4 + 4 = 64.
    explanation: 64 = 64. Der Umweg über $\sqrt{-121} = 11i$ führte zu einer echten Zahl – der erste Beweis, dass komplexe Zahlen nützlich sind.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wozu man eine Zahl braucht, deren Quadrat −1 ist.
    params:
      keywords:
        - - gleichung
          - lösung
          - equation
          - solution
        - - drehung
          - drehen
          - rotation
          - rotate
          - schwing
          - oscillat
        - - technik
          - physik
          - strom
          - engineering
          - physics
          - current
      sample: Mit i hat jede quadratische Gleichung eine Lösung, und Formeln für höhere Gleichungen funktionieren. Außerdem beschreibt Malnehmen mit i eine Drehung. Darum rechnen Physik und Technik mit i, etwa beim Wechselstrom.
    explanation: i schließt Lücken beim Lösen und macht Drehungen zur Multiplikation.
    difficulty: 3

srs:
  cards_from: [quadrat, hoch4]
