id: math.complex.i
type: concept
title: Die Zahl i
summary: Die Wurzel aus minus eins.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: keine
    widget: choice
    prompt: Welche reelle Zahl ergibt mit sich selbst multipliziert −1?
    params:
      options:
        - { label: Keine, correct: true }
        - { label: "−1", feedback: "(−1) · (−1) = +1." }
        - { label: "1", feedback: "1 · 1 = 1." }
    hints:
      - Minus mal minus ergibt plus.
    explanation: Jedes Quadrat einer reellen Zahl ist mindestens 0.

  - kind: explain
    body: |
      Mathematiker erfanden einfach eine neue Zahl: $i$ mit $i^2 = -1$. Klingt nach Trick – ist aber so nützlich, dass Elektrotechnik und Quantenphysik ohne sie kaum auskommen.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: Was ist ({{k}}i)²?
    params: { placeholder: "Zahl" }
    answer: { value: "{{-k * k}}" }
    feedback:
      - when: "numval(state.input) == k * k"
        misconception: forgot-sign
        text: i² ist −1 – das Vorzeichen dreht sich.
    hints:
      - "{{k}}² · i²."
    explanation: "{{k * k}} · (−1) = {{-k * k}}."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 3 }

  - kind: problem
    id: hoch4
    widget: choice
    prompt: Was ist i⁴?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "−1", feedback: "Das ist i². Noch einmal quadrieren." }
        - { label: "4i", feedback: "Hoch 4 heißt viermal mit sich selbst multiplizieren." }
    hints:
      - i⁴ = i² · i².
    explanation: (−1) · (−1) = 1. Die Potenzen von i wiederholen sich – i, −1, −i, 1.

srs:
  cards_from: [quadrat, hoch4]
