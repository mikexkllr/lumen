id: math.complex.i
type: concept
title: The number i
summary: The square root of minus one.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: keine
    widget: choice
    prompt: Which real number gives −1 when multiplied by itself?
    params:
      options:
        - { label: None, correct: true }
        - { label: "−1", feedback: "(−1) · (−1) = +1." }
        - { label: "1", feedback: "1 · 1 = 1." }
    hints:
      - Minus times minus is plus.
    explanation: The square of any real number is at least 0.

  - kind: explain
    id: s2
    body: |
      Mathematicians simply invented a new number: $i$ with $i^2 = -1$. It sounds like a trick. But it is so useful that electrical engineering and **quantum physics** can hardly do without it.

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: What is ({{k}}i)²?
    params: { placeholder: "Number" }
    answer: { value: "{{-k * k}}" }
    feedback:
      - when: "numval(state.input) == k * k"
        misconception: forgot-sign
        text: i² is −1 – the sign flips.
    hints:
      - "{{k}}² · i²."
    explanation: "{{k * k}} · (−1) = {{-k * k}}."
    variants:
      params: { k: "int[2,9]" }
      defaults: { k: 3 }

  - kind: problem
    id: hoch4
    widget: choice
    prompt: What is i⁴?
    params:
      options:
        - { label: "1", correct: true }
        - { label: "−1", feedback: "That is i². Square it once more." }
        - { label: "4i", feedback: "To the power of 4 means multiplying by itself four times." }
    hints:
      - i⁴ = i² · i².
    explanation: (−1) · (−1) = 1. The powers of i repeat – i, −1, −i, 1.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "The powers of i repeat: $i^1 = i$, $i^2$ = [[−1]], $i^3$ = [[−i]], $i^4$ = [[1]]."
      distractors:
        - "0"
        - 2i

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is $i^{22}$? Enter the real number.
    answer:
      value: -1
    hints:
      - 22 = 5 · 4 + 2. The cycle has length 4.
    explanation: i²² = i² = −1.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "The powers of i run in a **cycle**: i, −1, −i, 1, then i again. So for $i^n$ only the remainder of n divided by 4 matters – arithmetic modulo 4."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: What is the real part of $i^{ {{k}} }$?
    answer:
      value: "{{re}}"
    hints:
      - What remainder does {{k}} leave when divided by 4?
      - Remainder 0 → 1, 1 → i, 2 → −1, 3 → −i.
    explanation: "{{k}} ≡ {{mod(k, 4)}} (mod 4), so the real part is {{re}}."
    difficulty: 2
    variants:
      params:
        k: int[10,99]
      derive:
        re: "mod(k, 4) == 0 ? 1 : mod(k, 4) == 2 ? -1 : 0"
      defaults:
        k: 22

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Expand $(1 + i)^2$. What is the imaginary part of the result?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: cancelled-all
        text: "Binomial formula: 1 + 2i + i². Only the real part cancels."
    hints:
      - (1 + i)² = 1 + 2i + i².
      - i² = −1.
    explanation: 1 + 2i − 1 = 2i. A purely imaginary result from a »half real« number.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What are the solutions of $x^2 + 2x + 5 = 0$?
    params:
      options:
        - label: −1 + 2i and −1 − 2i
          correct: true
        - label: None – not even complex
          feedback: With i **every** quadratic equation has solutions.
        - label: 1 + 2i and 1 − 2i
          feedback: −p/2 is −1, not +1.
    hints:
      - "pq formula: −1 ± √(1 − 5)."
    explanation: "√(−4) = 2i. The **fundamental theorem of algebra**: every polynomial of degree n has exactly n complex roots."
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: i was not invented for x² = −1 but for cubic equations. Cardano's formula of 1545 leads to square roots of −121 for x³ = 15x + 4. **Bombelli** kept calculating anyway – and in the end got the real solution 4.

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: "Check the answer Bombelli found: which whole number above 0 solves $x^3 = 15x + 4$?"
    answer:
      value: 4
    hints:
      - "Try small numbers: 1, 2, 3, 4."
      - 4³ = 64 and 15 · 4 + 4 = 64.
    explanation: 64 = 64. The detour via $\sqrt{-121} = 11i$ led to a real number – the first proof that complex numbers are useful.
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why we need a number whose square is −1.
    params:
      keywords:
        - - gleichung
          - lösung
          - equation
          - solution
        - - drehung
          - drehen
          - rotation
          - rotate
          - schwing
          - oscillat
        - - technik
          - physik
          - strom
          - engineering
          - physics
          - current
      sample: With i every quadratic equation has a solution, and formulas for higher equations work. Also, multiplying by i describes a rotation. That is why physics and engineering use i, for example for alternating current.
    explanation: i closes gaps in solving and turns rotations into multiplication.
    difficulty: 3

srs:
  cards_from: [quadrat, hoch4]
