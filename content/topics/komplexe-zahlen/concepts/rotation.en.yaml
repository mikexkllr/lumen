id: math.complex.rotation
type: concept
title: Calculating rotations
summary: Rotating the plane with i.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: drehen
    widget: graph
    prompt: "z = 2 + i is drawn. Where does i · z land? Drag W there."
    params:
      x: [-4, 4]
      y: [-4, 4]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: Z, x: 2, y: 1, draggable: false }
        - { id: W, x: 1, y: -2 }
      segments: [[O, Z], [O, W]]
    answer: { points: { W: { x: -1, y: 2 } } }
    hints:
      - "i · (2 + i) = 2i + i² = −1 + 2i."
    explanation: (−1 | 2) – a quarter turn counterclockwise.

  - kind: problem
    id: rundum
    widget: numeric
    prompt: How many times must you multiply by i to turn all the way around once?
    params: { unit: times }
    answer: { value: 4 }
    hints:
      - Each time is a quarter turn.
    explanation: 4 · 90° = 360° – that is why i⁴ = 1.

  - kind: explain
    id: s3
    body: |
      Multiplying rotates. So complex numbers can describe anything that swings or spins: **AC power**, radio waves, quantum states. You use turns in the plane instead of sine and cosine.

  - kind: problem
    id: anwendung
    widget: buckets
    prompt: Do people often calculate with complex numbers here?
    params:
      buckets: [{ label: often }, { label: rarely }]
      items:
        - { label: Alternating current in the power grid, bucket: often }
        - { label: Quantum physics, bucket: often }
        - { label: Audio and image compression, bucket: often }
        - { label: Adding up a shopping list, bucket: rarely }
    hints:
      - Where does something oscillate or rotate?
    explanation: Wherever oscillations occur, complex numbers are the tool of choice.

  - kind: problem
    id: c1
    widget: sim
    prompt: A complex number of length 1 is $\cos\varphi + i\,\sin\varphi$. Set the angle so that the number is exactly **i**.
    params:
      scene: unitcircle
    answer:
      angle: 90
    explanation: "At 90°: cos = 0 and sin = 1. The number i is a quarter turn."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The equation $z^3 = 1$ has three complex solutions. They lie evenly on the unit circle. What is the angle of the second?
    params:
      unit: °
    answer:
      value: 120
    hints:
      - Three times the same angle must give 360°.
    explanation: 0°, 120° and 240°. The n-th **roots of unity** form a regular n-gon.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Euler’s formula reads $e^{i\varphi} = \cos\varphi + i\,\sin\varphi$. What follows for $\varphi = \pi$?
    params:
      options:
        - label: $e^{i\pi} + 1 = 0$
          correct: true
        - label: $e^{i\pi} = 1$
          feedback: Half a turn lands at −1, not 1.
        - label: $e^{i\pi} = i$
          feedback: That would be a quarter turn, i.e. π/2.
    hints:
      - π radians is half a turn.
    explanation: The five most important numbers – 0, 1, e, i and π – in one equation. Many consider it the most beautiful in mathematics.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: what happens in the number plane when you multiply by i?"
    params:
      keywords:
        - - dreh
          - rotat
          - turn
        - - "90"
          - viertel
          - quarter
          - rechter winkel
          - right angle
        - - länge
          - betrag
          - length
          - abstand
          - size
          - gleich
      sample: The number is rotated by 90 degrees anticlockwise. Its length stays the same because i has length 1.
    difficulty: 3

srs:
  cards_from: [drehen, rundum]
