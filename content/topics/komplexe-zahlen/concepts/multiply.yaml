id: math.complex.multiply
type: concept
title: Multiplizieren heißt drehen
summary: Längen mal, Winkel plus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: produkt
    widget: numeric
    prompt: Was ist (1 + i) · (1 − i)?
    params: { placeholder: "Zahl" }
    answer: { value: 2 }
    hints:
      - "Ausmultiplizieren: 1 − i + i − i²."
    explanation: 1 − i² = 1 − (−1) = 2 – ganz ohne i.

  - kind: explain
    id: s2
    body: |
      Beim Multiplizieren komplexer Zahlen **multiplizieren sich die Längen** und **addieren sich die Winkel**. Mal i heißt also: Länge bleibt, eine Vierteldrehung dazu.

  - kind: problem
    id: mal-i
    widget: choice
    prompt: Was passiert mit einer Zahl in der Ebene, wenn man sie mit i multipliziert?
    params:
      options:
        - { label: Sie dreht sich um 90° gegen den Uhrzeigersinn., correct: true }
        - { label: Sie wird gespiegelt., feedback: "Die Länge bleibt, die Richtung dreht sich." }
        - { label: Sie wird doppelt so lang., feedback: "i hat die Länge 1 – die Länge bleibt." }
    hints:
      - "i liegt bei 90°, mit Länge 1."
    explanation: Darum ergibt i · i eine halbe Drehung – genau −1.

  - kind: problem
    id: laengen
    widget: numeric
    prompt: z hat die Länge {{a}}, w die Länge {{b}}. Wie lang ist z · w?
    params: { placeholder: "Länge" }
    answer: { value: "{{a * b}}" }
    hints:
      - Längen multiplizieren sich.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[2,6]", b: "int[2,6]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ist $(2 + i)(3 + 2i)$? Gib den Realteil an.
    answer:
      value: 4
    hints:
      - Ausmultiplizieren und i² = −1 einsetzen.
    explanation: 6 + 4i + 3i + 2i² = 4 + 7i.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Mal i heißt: um 90° drehen. Der Punkt steht bei 30°. Multipliziere zweimal mit i. Wo landet er?"
    params:
      scene: unitcircle
      controls:
        angle:
          value: 30
    answer:
      angle: 210
    explanation: "30° + 90° + 90° = 210°. Zweimal mal i ist mal −1: genau gegenüber."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Ausmultiplizieren mit $i^2 = -1$ liefert die **Produktformel**: $(a + bi)(c + di) = (ac - bd) + (ad + bc)\\,i$. Mehr braucht man nicht – die Drehung steckt schon darin."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Berechne $(3 + 2i)(1 - i)$. Gib den Realteil an.
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 1
        misconception: sign-i2
        text: i · (−i) = −i² = +1. Das Vorzeichen dreht sich um.
      - when: numval(state.input) == 3
        misconception: missing-term
        text: Der Teil 2i · (−i) fehlt noch.
    hints:
      - 3 · 1 + 3 · (−i) + 2i · 1 + 2i · (−i).
      - 2i · (−i) = −2i² = +2.
    explanation: 3 + 2 = 5 und −3i + 2i = −i, also 5 − i.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: z liegt auf dem Einheitskreis bei 75°. Stell den Winkel von z² ein.
    params:
      scene: unitcircle
    answer:
      angle: 150
    explanation: "Beim Quadrieren verdoppelt sich der Winkel: 2 · 75° = 150°. Die Länge 1 bleibt 1."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: $(1 + i)$ hat den Winkel 45° und die Länge √2. Was ist $(1 + i)^8$?
    answer:
      value: 16
    hints:
      - "Länge: (√2)⁸. Winkel: 8 · 45°."
    explanation: Länge 16, Winkel 360° – also die reelle Zahl 16. Potenzieren ist Drehen und Strecken.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Aus »Winkel addieren« folgt die Formel von **de Moivre**: $(\\cos\\varphi + i\\sin\\varphi)^n = \\cos n\\varphi + i\\sin n\\varphi$. Rechnet man links aus, fallen Formeln für cos 2φ, cos 3φ und mehr heraus."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Was ist $(1 + i)^4$? Länge √2, Winkel 45°.
    answer:
      value: -4
    feedback:
      - when: numval(state.input) == 4
        misconception: sign
        text: Winkel 4 · 45° = 180° zeigt nach links – das Vorzeichen ist negativ.
    hints:
      - "Länge: (√2)⁴ = 4."
      - "Winkel: 4 · 45° = 180°."
    explanation: "Länge 4, Winkel 180°: das ist −4. Probe: (1 + i)² = 2i, und (2i)² = −4."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum sich beim Multiplizieren komplexer Zahlen die Winkel addieren.
    params:
      keywords:
        - - winkel
          - angle
        - - länge
          - betrag
          - length
          - modulus
        - - drehen
          - drehung
          - rotate
          - rotation
          - turn
      sample: Malnehmen mit z dreht die Ebene um den Winkel von z und streckt sie um seine Länge. Dreht man erst um den einen, dann um den anderen Winkel, ist das zusammen eine Drehung um die Summe. Die Längen werden dabei malgenommen.
    explanation: Multiplikation = Drehstreckung. Zwei Drehungen nacheinander addieren ihre Winkel.
    difficulty: 3

srs:
  cards_from: [produkt, mal-i]
