id: math.complex.multiply
type: concept
title: Multiplizieren heißt drehen
summary: Längen mal, Winkel plus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: produkt
    widget: numeric
    prompt: Was ist (1 + i) · (1 − i)?
    params: { placeholder: "Zahl" }
    answer: { value: 2 }
    hints:
      - "Ausmultiplizieren: 1 − i + i − i²."
    explanation: 1 − i² = 1 − (−1) = 2 – ganz ohne i.

  - kind: explain
    id: s2
    body: |
      Beim Multiplizieren komplexer Zahlen **multiplizieren sich die Längen** und **addieren sich die Winkel**. Mal i heißt also: Länge bleibt, eine Vierteldrehung dazu.

  - kind: problem
    id: mal-i
    widget: choice
    prompt: Was passiert mit einer Zahl in der Ebene, wenn man sie mit i multipliziert?
    params:
      options:
        - { label: Sie dreht sich um 90° gegen den Uhrzeigersinn., correct: true }
        - { label: Sie wird gespiegelt., feedback: "Die Länge bleibt, die Richtung dreht sich." }
        - { label: Sie wird doppelt so lang., feedback: "i hat die Länge 1 – die Länge bleibt." }
    hints:
      - "i liegt bei 90°, mit Länge 1."
    explanation: Darum ergibt i · i eine halbe Drehung – genau −1.

  - kind: problem
    id: laengen
    widget: numeric
    prompt: z hat die Länge {{a}}, w die Länge {{b}}. Wie lang ist z · w?
    params: { placeholder: "Länge" }
    answer: { value: "{{a * b}}" }
    hints:
      - Längen multiplizieren sich.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[2,6]", b: "int[2,6]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ist $(2 + i)(3 + 2i)$? Gib den Realteil an.
    answer:
      value: 4
    hints:
      - Ausmultiplizieren und i² = −1 einsetzen.
    explanation: 6 + 4i + 3i + 2i² = 4 + 7i.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Mal i heißt: um 90° drehen. Der Punkt steht bei 30°. Multipliziere zweimal mit i. Wo landet er?"
    params:
      scene: unitcircle
      controls:
        angle:
          value: 30
    answer:
      angle: 210
    explanation: "30° + 90° + 90° = 210°. Zweimal mal i ist mal −1: genau gegenüber."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: $(1 + i)$ hat den Winkel 45° und die Länge √2. Was ist $(1 + i)^8$?
    answer:
      value: 16
    hints:
      - "Länge: (√2)⁸. Winkel: 8 · 45°."
    explanation: Länge 16, Winkel 360° – also die reelle Zahl 16. Potenzieren ist Drehen und Strecken.
    difficulty: 3

srs:
  cards_from: [produkt, mal-i]
