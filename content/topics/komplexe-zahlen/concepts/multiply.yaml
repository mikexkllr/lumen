id: math.complex.multiply
type: concept
title: Multiplizieren heißt drehen
summary: Längen mal, Winkel plus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: produkt
    widget: numeric
    prompt: Was ist (1 + i) · (1 − i)?
    params: { placeholder: "Zahl" }
    answer: { value: 2 }
    hints:
      - "Ausmultiplizieren: 1 − i + i − i²."
    explanation: 1 − i² = 1 − (−1) = 2 – ganz ohne i.

  - kind: explain
    body: |
      Beim Multiplizieren komplexer Zahlen **multiplizieren sich die Längen** und **addieren sich die Winkel**. Mal i heißt also: Länge bleibt, eine Vierteldrehung dazu.

  - kind: problem
    id: mal-i
    widget: choice
    prompt: Was passiert mit einer Zahl in der Ebene, wenn man sie mit i multipliziert?
    params:
      options:
        - { label: Sie dreht sich um 90° gegen den Uhrzeigersinn., correct: true }
        - { label: Sie wird gespiegelt., feedback: "Die Länge bleibt, die Richtung dreht sich." }
        - { label: Sie wird doppelt so lang., feedback: "i hat die Länge 1 – die Länge bleibt." }
    hints:
      - "i liegt bei 90°, mit Länge 1."
    explanation: Darum ergibt i · i eine halbe Drehung – genau −1.

  - kind: problem
    id: laengen
    widget: numeric
    prompt: z hat die Länge {{a}}, w die Länge {{b}}. Wie lang ist z · w?
    params: { placeholder: "Länge" }
    answer: { value: "{{a * b}}" }
    hints:
      - Längen multiplizieren sich.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[2,6]", b: "int[2,6]" }
      defaults: { a: 3, b: 2 }

srs:
  cards_from: [produkt, mal-i]
