id: math.complex.multiply
type: concept
title: Multiplying means rotating
summary: Lengths multiply, angles add.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: produkt
    widget: numeric
    prompt: What is (1 + i) · (1 − i)?
    params: { placeholder: "Number" }
    answer: { value: 2 }
    hints:
      - "Expand: 1 − i + i − i²."
    explanation: 1 − i² = 1 − (−1) = 2 – with no i at all.

  - kind: explain
    id: s2
    body: |
      When you multiply complex numbers, the **lengths multiply** and the **angles add**. So times i means: the length stays, and a quarter turn is added.

  - kind: problem
    id: mal-i
    widget: choice
    prompt: What happens to a number in the plane when you multiply it by i?
    params:
      options:
        - { label: It rotates 90° counterclockwise., correct: true }
        - { label: It is mirrored., feedback: "The length stays, the direction rotates." }
        - { label: It becomes twice as long., feedback: "i has length 1 – the length stays." }
    hints:
      - "i sits at 90°, with length 1."
    explanation: That is why i · i gives a half turn – exactly −1.

  - kind: problem
    id: laengen
    widget: numeric
    prompt: z has length {{a}}, w has length {{b}}. How long is z · w?
    params: { placeholder: "Length" }
    answer: { value: "{{a * b}}" }
    hints:
      - Lengths multiply.
    explanation: "{{a}} · {{b}} = {{a * b}}."
    variants:
      params: { a: "int[2,6]", b: "int[2,6]" }
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is $(2 + i)(3 + 2i)$? Give the real part.
    answer:
      value: 4
    hints:
      - Expand and use i² = −1.
    explanation: 6 + 4i + 3i + 2i² = 4 + 7i.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: "Times i means: turn by 90°. The point is at 30°. Multiply by i twice. Where does it land?"
    params:
      scene: unitcircle
      controls:
        angle:
          value: 30
    answer:
      angle: 210
    explanation: "30° + 90° + 90° = 210°. Twice times i is times −1: exactly opposite."
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Expanding with $i^2 = -1$ gives the **product formula**: $(a + bi)(c + di) = (ac - bd) + (ad + bc)\\,i$. That is all you need – the rotation is already inside."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Compute $(3 + 2i)(1 - i)$. Give the real part.
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 1
        misconception: sign-i2
        text: i · (−i) = −i² = +1. The sign flips.
      - when: numval(state.input) == 3
        misconception: missing-term
        text: The term 2i · (−i) is still missing.
    hints:
      - 3 · 1 + 3 · (−i) + 2i · 1 + 2i · (−i).
      - 2i · (−i) = −2i² = +2.
    explanation: 3 + 2 = 5 and −3i + 2i = −i, so 5 − i.
    difficulty: 2

  - kind: problem
    id: mb-d3
    depth: 2
    widget: sim
    prompt: z lies on the unit circle at 75°. Set the angle of z².
    params:
      scene: unitcircle
    answer:
      angle: 150
    explanation: "Squaring doubles the angle: 2 · 75° = 150°. The length 1 stays 1."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: $(1 + i)$ has angle 45° and length √2. What is $(1 + i)^8$?
    answer:
      value: 16
    hints:
      - "Length: (√2)⁸. Angle: 8 · 45°."
    explanation: Length 16, angle 360° – so the real number 16. Raising to a power is rotating and stretching.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "»Adding angles« yields **de Moivre's** formula: $(\\cos\\varphi + i\\sin\\varphi)^n = \\cos n\\varphi + i\\sin n\\varphi$. Expanding the left side produces formulas for cos 2φ, cos 3φ and more."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: What is $(1 + i)^4$? Length √2, angle 45°.
    answer:
      value: -4
    feedback:
      - when: numval(state.input) == 4
        misconception: sign
        text: Angle 4 · 45° = 180° points left – the sign is negative.
    hints:
      - "Length: (√2)⁴ = 4."
      - "Angle: 4 · 45° = 180°."
    explanation: "Length 4, angle 180°: that is −4. Check: (1 + i)² = 2i, and (2i)² = −4."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Tell Lux why angles add when complex numbers are multiplied.
    params:
      keywords:
        - - winkel
          - angle
        - - länge
          - betrag
          - length
          - modulus
        - - drehen
          - drehung
          - rotate
          - rotation
          - turn
      sample: Multiplying by z rotates the plane by the angle of z and stretches it by its length. Rotating first by one angle and then by another is one rotation by the sum. The lengths multiply.
    explanation: Multiplication = rotation plus scaling. Two rotations in a row add their angles.
    difficulty: 3

srs:
  cards_from: [produkt, mal-i]
