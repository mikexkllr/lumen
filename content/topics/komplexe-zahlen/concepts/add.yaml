id: math.complex.add
type: concept
title: Addieren wie Pfeile
summary: Komplexe Zahlen addieren.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pfeile auf Reisen
    body: "Ingenieure addieren Wechselströme wie Pfeile – mit komplexen Zahlen. Zieh A: Das ist die erste Zahl. Zieh B: Der Weg von A nach B ist die zweite. Der Pfeil von O nach B zeigt die **Summe**."
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - -1
          - 6
        y:
          - -1
          - 6
        points:
          - id: O
            x: 0
            y: 0
            draggable: false
          - id: A
            x: 1
            y: 2
          - id: B
            x: 4
            y: 3
        segments:
          - - O
            - A
          - - A
            - B
          - - O
            - B

  - kind: problem
    id: hook
    widget: numeric
    prompt: Du gehst 3 Schritte nach rechts und 2 nach oben. Dann 1 nach rechts und 4 nach oben. Wie viele Schritte bist du insgesamt nach oben gegangen?
    answer:
      value: 6
    hints:
      - 2 + 4.
    explanation: Rechts und oben rechnet man getrennt. Genau so addiert man komplexe Zahlen.

  - kind: explain
    id: s1
    body: |
      Komplexe Zahlen addiert man getrennt: reelle Teile zusammen, imaginäre Teile zusammen. In der Ebene ist das genau wie das Aneinanderhängen von **Pfeilen**.

  - kind: problem
    id: summe
    widget: choice
    prompt: Was ist (2 + 3i) + (1 − i)?
    params:
      options:
        - { label: "3 + 2i", correct: true }
        - { label: "3 + 4i", feedback: "3i + (−i) ergibt 2i." }
        - { label: "5i", feedback: "Reelle und imaginäre Teile bleiben getrennt." }
    hints:
      - Erst 2 + 1, dann 3i − i.
    explanation: (2 + 1) + (3 − 1)i = 3 + 2i.

  - kind: problem
    id: realteil
    widget: numeric
    prompt: Welchen reellen Teil hat ({{a}} + {{b}}i) + ({{c}} − {{d}}i)?
    params: { placeholder: "Realteil" }
    answer: { value: "{{a + c}}" }
    hints:
      - Nur die Zahlen ohne i.
    explanation: "{{a}} + {{c}} = {{a + c}}."
    variants:
      params: { a: "int[1,9]", b: "int[1,9]", c: "int[1,9]", d: "int[1,9]" }
      defaults: { a: 4, b: 2, c: 3, d: 5 }

  - kind: problem
    id: pfeil
    widget: graph
    prompt: "z₁ = 2 + i ist eingezeichnet. Häng z₂ = 1 + 2i an und zieh S an die Summe."
    params:
      x: [-1, 5]
      y: [-1, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: A, x: 2, y: 1, draggable: false }
        - { id: S, x: 4, y: 1 }
      segments: [[O, A], [A, S]]
    answer: { points: { S: { x: 3, y: 3 } } }
    hints:
      - Von A aus 1 nach rechts, 2 nach oben.
    explanation: (2 + 1) + (1 + 2)i = 3 + 3i.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Was ist $(5 + 2i) - (3 - 4i)$? Gib den Imaginärteil an.
    answer:
      value: 6
    hints:
      - 2 − (−4).
    explanation: 2 + 6i. Minus eine negative Zahl wird plus.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Der Abstand zweier komplexer Zahlen ist der Betrag ihrer **Differenz**: |z − w|. Das ist derselbe Pfeil von w nach z wie bei Vektoren."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie weit liegen $1 + 2i$ und $4 + 6i$ in der Ebene auseinander?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 7
        misconception: manhattan
        text: Das ist der Weg entlang der Achsen. Gesucht ist die Luftlinie.
    hints:
      - "Differenz: 3 + 4i."
      - "|3 + 4i|."
    explanation: "|3 + 4i| = 5."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kann man komplexe Zahlen der Größe nach ordnen, also sagen, ob $i < 1$ ist?
    params:
      options:
        - label: Nein – eine Ebene hat keine Reihenfolge, die zum Rechnen passt
          correct: true
        - label: Ja, nach dem Betrag
          feedback: Dann wären i und 1 »gleich groß«, obwohl sie verschieden sind.
        - label: Ja, nach dem Realteil
          feedback: Dann wäre i = 0 in der Ordnung, und i² = −1 widerspräche den Regeln.
    hints:
      - Wäre i > 0, müsste auch i · i > 0 sein.
    explanation: Sowohl i > 0 als auch i < 0 führen zu −1 > 0. Die komplexen Zahlen sind kein geordneter Körper.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Es gilt die **Dreiecksungleichung**: |z + w| ≤ |z| + |w|. Zwei Pfeile hintereinander sind nie länger als ihre Summe. Gleichheit gibt es nur, wenn beide in dieselbe Richtung zeigen."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Es ist |z| = 3 und |w| = 5. Wie klein kann |z + w| höchstens werden?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 8
        misconception: max-not-min
        text: Das ist der größte Wert. Wann wird die Summe am kürzesten?
      - when: numval(state.input) == 0
        misconception: zero
        text: Null ginge nur bei gleich langen Pfeilen.
    hints:
      - Lass die Pfeile in entgegengesetzte Richtungen zeigen.
      - 5 − 3.
    explanation: "|z + w| liegt zwischen 5 − 3 = 2 und 5 + 3 = 8."
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man komplexe Zahlen wie Pfeile addiert.
    params:
      keywords:
        - - realteil
          - real
        - - imaginärteil
          - imaginary
        - - pfeil
          - aneinander
          - arrow
          - end to end
          - vektor
          - vector
      sample: "Man addiert Realteil zu Realteil und Imaginärteil zu Imaginärteil, genau wie x- und y-Komponenten von Vektoren. In der Ebene heißt das: Pfeile aneinanderhängen."
    explanation: Fürs Addieren sind komplexe Zahlen einfach Vektoren. Neu ist erst das Malnehmen.
    difficulty: 3

srs:
  cards_from: [summe, realteil]
