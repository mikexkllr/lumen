id: math.complex.plane
type: concept
title: Die Zahlenebene
summary: Zahlen als Punkte.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Kein Platz auf der Linie?
    body: "Auf dieser Linie wohnen alle Zahlen, die du kennst: positive, negative, Brüche. Zieh den Punkt und quadriere die Zahl im Kopf. Egal, wohin du ziehst – das Quadrat ist **nie negativ**."
    visual:
      widget: numberline
      interactive: true
      params:
        min: -3
        max: 3
        ticks: 2
        labels: integers
        initial: 1

  - kind: problem
    id: hook
    widget: choice
    prompt: Auf dem Zahlenstrahl liegen alle gewohnten Zahlen. Wo ist Platz für i, die Wurzel aus −1?
    params:
      options:
        - label: Daneben – man braucht eine zweite Richtung
          correct: true
        - label: Zwischen 0 und 1
          feedback: Dort liegen nur gewöhnliche Zahlen.
        - label: Nirgends
          feedback: Man kann i sehr wohl zeichnen.
    hints:
      - Der Strahl ist schon voll.
    explanation: Aus dem Strahl wird eine Ebene.

  - kind: explain
    id: s1
    body: |
      Eine **komplexe Zahl** $a + bi$ hat einen reellen Teil a und einen imaginären Teil b. Man zeichnet sie als Punkt $(a \mid b)$ in eine Ebene – nach rechts reell, nach oben imaginär.

  - kind: problem
    id: setzen
    widget: graph
    prompt: Setze z = {{a}} + {{b}}i in die Zahlenebene.
    params:
      x: [-5, 5]
      y: [-5, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: Z, x: 1, y: 1 }
      segments: [[O, Z]]
    answer: { points: { Z: { x: "{{a}}", y: "{{b}}" } } }
    hints:
      - "{{a}} nach rechts, {{b}} nach oben."
    explanation: "z liegt bei ({{a}} | {{b}})."
    variants:
      params: { a: "int[-4,4]", b: "int[-4,4]" }
      constraints: ["a != 0", "b != 0", "a != 1"]
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: betrag
    widget: numeric
    prompt: Wie weit ist z = 3 + 4i vom Nullpunkt entfernt?
    params: { placeholder: "Betrag" }
    answer: { value: 5 }
    hints:
      - Pythagoras mit 3 und 4.
    explanation: $\sqrt{3^2 + 4^2} = 5$ – der **Betrag** von z.

  - kind: problem
    id: reell
    widget: choice
    prompt: Wo liegen die gewöhnlichen reellen Zahlen in dieser Ebene?
    params:
      options:
        - { label: Auf der waagerechten Achse, correct: true }
        - { label: Auf der senkrechten Achse, feedback: "Dort liegen die rein imaginären Zahlen wie 2i." }
    hints:
      - Reelle Zahlen haben den Imaginärteil 0.
    explanation: Die Zahlengerade ist nur eine Linie in einer viel größeren Ebene.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **konjugierte** Zahl zu 3 + 4i ist 3 − 4i. Was ergibt ihr Produkt?
    answer:
      value: 25
    hints:
      - (a + bi)(a − bi) = a² + b².
    explanation: 9 + 16 = 25 – das Quadrat des Betrags. Immer reell.
    difficulty: 2

  - kind: explain
    id: mb-d1
    depth: 2
    body: "Der **Betrag** |z| ist der Abstand vom Nullpunkt: $|a + bi| = \\sqrt{a^2 + b^2}$. Die konjugierte Zahl $\\bar z = a - bi$ ist z an der reellen Achse gespiegelt. Es gilt $z \\cdot \\bar z = |z|^2$."

  - kind: problem
    id: mb-d2
    depth: 2
    widget: numeric
    prompt: Wie groß ist $|{{5 * k}} - {{12 * k}}i|$?
    answer:
      value: "{{13 * k}}"
    feedback:
      - when: numval(state.input) == -7 * k
        misconception: subtract
        text: Der Betrag ist eine Länge – nie negativ. Quadriere beide Teile.
    hints:
      - √(({{5 * k}})² + ({{12 * k}})²).
      - 5, 12, 13 ist ein pythagoreisches Tripel.
    explanation: √({{25 * k * k}} + {{144 * k * k}}) = {{13 * k}}.
    difficulty: 2
    variants:
      params:
        k: int[1,4]
      defaults:
        k: 1

  - kind: problem
    id: mb-d3
    depth: 2
    widget: numeric
    prompt: Berechne $\frac{1}{3 + 4i}$. Erweitere mit $3 - 4i$. Welchen Realteil hat das Ergebnis?
    answer:
      value: 0.12
      tolerance: 0.001
    feedback:
      - when: abs(numval(state.input) - 0.333) < 0.002
        misconception: ignore-imaginary
        text: 1/3 wäre richtig ohne den Imaginärteil. Der Nenner wird |z|² = 25.
    hints:
      - "Nenner: (3 + 4i)(3 − 4i) = 9 + 16 = 25."
      - "Ergebnis: (3 − 4i) : 25."
    explanation: "3/25 = 0,12, der Imaginärteil ist −0,16. Teilen heißt: mit der Konjugierten erweitern, dann ist der Nenner reell."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Berechne $\frac{10}{1 + 2i}$. Gib den Realteil an.
    answer:
      value: 2
    hints:
      - Erweitere mit der konjugierten Zahl 1 − 2i.
    explanation: 10(1 − 2i) / 5 = 2 − 4i. Die Konjugierte macht den Nenner reell.
    difficulty: 3

  - kind: explain
    id: mb-x1
    depth: 3
    body: "Jede komplexe Zahl hat eine **Polarform**: Länge r und Winkel φ, also $z = r(\\cos\\varphi + i\\sin\\varphi)$. Der Winkel heißt Argument. Für Plus ist die Form a + bi bequem, für Mal die Polarform."

  - kind: problem
    id: mb-x2
    depth: 3
    widget: numeric
    prompt: Welchen Winkel in Grad hat $z = 1 + \sqrt3\,i$?
    params:
      unit: °
    answer:
      value: 60
    feedback:
      - when: numval(state.input) == 30
        misconception: swapped
        text: "tan φ = √3 : 1. Das gehört zu 60°, nicht zu 30°."
    hints:
      - "tan φ = Imaginärteil : Realteil = √3."
      - Bei welchem Winkel ist der Tangens √3?
    explanation: φ = 60° und r = 2, also z = 2(cos 60° + i sin 60°).
    difficulty: 3

  - kind: problem
    id: mb-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie man eine komplexe Zahl als Punkt zeichnet.
    params:
      keywords:
        - - realteil
          - reell
          - rechts
          - real
          - right
        - - imaginärteil
          - imaginär
          - oben
          - imaginary
          - up
        - - punkt
          - ebene
          - point
          - plane
      sample: Ich gehe so weit nach rechts, wie der Realteil angibt, und so weit nach oben, wie der Imaginärteil angibt. Dort liegt der Punkt in der Zahlenebene.
    explanation: a + bi ↔ (a | b). Die reellen Zahlen sind die waagerechte Achse, die imaginären die senkrechte.
    difficulty: 3

srs:
  cards_from: [setzen, betrag]
