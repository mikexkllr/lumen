id: math.complex.plane
type: concept
title: Die Zahlenebene
summary: Zahlen als Punkte.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Auf dem Zahlenstrahl liegen alle gewohnten Zahlen. Wo ist Platz für i, die Wurzel aus −1?
    params:
      options:
        - label: Daneben – man braucht eine zweite Richtung
          correct: true
        - label: Zwischen 0 und 1
          feedback: Dort liegen nur gewöhnliche Zahlen.
        - label: Nirgends
          feedback: Man kann i sehr wohl zeichnen.
    hints:
      - Der Strahl ist schon voll.
    explanation: Aus dem Strahl wird eine Ebene.

  - kind: explain
    id: s1
    body: |
      Eine **komplexe Zahl** $a + bi$ hat einen reellen Teil a und einen imaginären Teil b. Man zeichnet sie als Punkt $(a \mid b)$ in eine Ebene – nach rechts reell, nach oben imaginär.

  - kind: problem
    id: setzen
    widget: graph
    prompt: Setze z = {{a}} + {{b}}i in die Zahlenebene.
    params:
      x: [-5, 5]
      y: [-5, 5]
      points:
        - { id: O, x: 0, y: 0, draggable: false }
        - { id: Z, x: 1, y: 1 }
      segments: [[O, Z]]
    answer: { points: { Z: { x: "{{a}}", y: "{{b}}" } } }
    hints:
      - "{{a}} nach rechts, {{b}} nach oben."
    explanation: "z liegt bei ({{a}} | {{b}})."
    variants:
      params: { a: "int[-4,4]", b: "int[-4,4]" }
      constraints: ["a != 0", "b != 0", "a != 1"]
      defaults: { a: 3, b: 2 }

  - kind: problem
    id: betrag
    widget: numeric
    prompt: Wie weit ist z = 3 + 4i vom Nullpunkt entfernt?
    params: { placeholder: "Betrag" }
    answer: { value: 5 }
    hints:
      - Pythagoras mit 3 und 4.
    explanation: $\sqrt{3^2 + 4^2} = 5$ – der **Betrag** von z.

  - kind: problem
    id: reell
    widget: choice
    prompt: Wo liegen die gewöhnlichen reellen Zahlen in dieser Ebene?
    params:
      options:
        - { label: Auf der waagerechten Achse, correct: true }
        - { label: Auf der senkrechten Achse, feedback: "Dort liegen die rein imaginären Zahlen wie 2i." }
    hints:
      - Reelle Zahlen haben den Imaginärteil 0.
    explanation: Die Zahlengerade ist nur eine Linie in einer viel größeren Ebene.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die **konjugierte** Zahl zu 3 + 4i ist 3 − 4i. Was ergibt ihr Produkt?
    answer:
      value: 25
    hints:
      - (a + bi)(a − bi) = a² + b².
    explanation: 9 + 16 = 25 – das Quadrat des Betrags. Immer reell.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Berechne $\frac{10}{1 + 2i}$. Gib den Realteil an.
    answer:
      value: 2
    hints:
      - Erweitere mit der konjugierten Zahl 1 − 2i.
    explanation: 10(1 − 2i) / 5 = 2 − 4i. Die Konjugierte macht den Nenner reell.
    difficulty: 3

srs:
  cards_from: [setzen, betrag]
