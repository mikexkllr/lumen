id: stats.correlation.chance
type: concept
title: Zufall und Ausreißer
summary: Regression zur Mitte und Zufallstreffer.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Nach dem Hoch das Tief
    body: "Nach einem Hoch kommt oft ein Tief – ganz ohne Grund? Deck die Karten auf, in beliebiger Reihenfolge. Hinter allen dreien steckt derselbe Effekt: die **Regression zur Mitte**."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: ✈️
            front: Lob oder Tadel?
            back: "Fluglehrer merkten: Nach Lob flogen Schüler oft schlechter, nach Tadel besser. Lag es am Tadel?"
          - icon: 📰
            front: Der Fluch des Titelbilds
            back: Wer aufs Titelbild eines Sportmagazins kommt, hat danach oft eine schwächere Saison. Ist das Bild verflucht?
          - icon: 🤒
            front: Das Wundermittel
            back: Zum Arzt geht man, wenn es einem besonders schlecht geht. Danach geht es oft besser – mit jedem Mittel.

  - kind: problem
    id: rekord
    widget: choice
    prompt: Ein Team spielt eine Rekordsaison. Im Jahr danach läuft es schlechter. Was ist die wahrscheinlichste Erklärung?
    params:
      options:
        - { label: Im Rekord steckte auch viel Glück., correct: true }
        - { label: Der Erfolg hat das Team faul gemacht., feedback: "Möglich, aber unnötig. Es gibt eine einfachere Erklärung." }
        - { label: Ein Fluch liegt auf Meistern., feedback: "Klingt spannend, erklärt aber nichts." }
    hints:
      - Wie viel Glück braucht man für einen Rekord?
    explanation: Extreme enthalten meist Glück. Danach folgen oft normalere Werte.

  - kind: explain
    id: s2
    body: |
      **Regression zur Mitte:** Auf extreme Ergebnisse folgen oft normalere.
      Extreme enthalten meist auch Glück oder Pech – und das wiederholt sich selten.

  - kind: problem
    id: nachhilfe
    widget: choice
    prompt: Die Schüler mit den schlechtesten Noten bekommen Nachhilfe. Danach sind sie besser. Beweist das die Wirkung?
    params:
      options:
        - { label: "Nein – man braucht eine Vergleichsgruppe.", correct: true }
        - { label: "Ja, sie sind ja besser geworden.", feedback: "Sie wären vermutlich auch ohne Nachhilfe etwas besser geworden – Regression zur Mitte." }
    hints:
      - Wären die Schwächsten auch ohne Nachhilfe besser geworden?
    explanation: Erst ein Vergleich mit Schülern ohne Nachhilfe zeigt die echte Wirkung.

  - kind: explain
    id: s4
    body: |
      Wer viel vergleicht, findet **zufällige** Zusammenhänge.
      Hat jeder Test 5 % Chance auf einen Zufallstreffer, findet man bei 20 Tests im Schnitt einen.

  - kind: problem
    id: treffer
    widget: numeric
    prompt: Jeder Test hat 5 % Chance auf einen Zufallstreffer. Wie viele Treffer erwartest du bei {{n}} Tests, auch wenn nichts dahintersteckt?
    params: { unit: Treffer }
    answer: { value: "{{n * 0.05}}" }
    hints:
      - "5 % von {{n}}."
    explanation: "{{n}} · 0,05 = {{n * 0.05}} Zufallstreffer."
    variants:
      params: { n: "choice[20,40,60,100]" }
      defaults: { n: 40 }

  - kind: problem
    id: frage
    widget: choice
    prompt: Welche Frage hilft bei jeder Studie am meisten?
    params:
      options:
        - { label: Gab es eine zufällige Vergleichsgruppe?, correct: true }
        - { label: Klingt das Ergebnis überraschend?, feedback: "Überraschende Ergebnisse sind spannend – aber öfter Zufall." }
        - { label: Wurde viel Geld ausgegeben?, feedback: "Teuer heißt nicht richtig." }
    hints:
      - Was trennt Ursache von Zufall?
    explanation: Erst ein fairer Vergleich trennt Wirkung von Zufall und dritten Größen.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: Jeder Test hat 5 % Chance auf einen reinen Zufallstreffer. Wie viele Zufallstreffer erwartest du bei 100 Tests?
    answer:
      value: 5
    hints:
      - 5 % von 100.
    explanation: Fünf Treffer – obwohl nirgends etwas dahintersteckt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Bei 20 unabhängigen Tests mit je 5 % Fehlalarm-Chance: Wie groß ist die Wahrscheinlichkeit für **mindestens einen** Zufallstreffer? In Prozent. (0,95²⁰ ≈ 0,358)"
    params:
      unit: "%"
    answer:
      value: 64
      tolerance: 1
    hints:
      - 1 − 0,358.
    explanation: 64 %. Wer genug testet, findet fast sicher »etwas« – auch wenn nichts da ist.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Zwei Tests korrelieren mit r = 0,5. Der Schnitt ist 100. Jemand hatte im ersten Test {{x}}. Was erwartest du im zweiten? Formel: 100 + r · ({{x}} − 100)."
    answer:
      value: "{{100 + 0.5 * (x - 100)}}"
    feedback:
      - when: numval(state.input) == x
        misconception: no-regression
        text: Dann gäbe es keine Regression zur Mitte – das gilt nur bei r = 1.
    hints:
      - Der Abstand zum Schnitt ist {{x - 100}}.
      - Nur die Hälfte davon bleibt erhalten.
    explanation: 100 + 0,5 · ({{x - 100}}) = {{100 + 0.5 * (x - 100)}}. Der Rest des Ausschlags war Glück oder Pech.
    difficulty: 2
    variants:
      params:
        x: choice[60,70,80,120,130,140]
      defaults:
        x: 130

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Forscher probieren viele Auswertungen aus und berichten nur die, die »signifikant« ist. Wie heißt das?
    params:
      options:
        - label: p-Hacking
          correct: true
        - label: Peer Review
          feedback: Das ist die Begutachtung durch Fachkollegen.
        - label: Randomisierung
          feedback: Das ist das zufällige Einteilen in Gruppen.
    hints:
      - Man »hackt« so lange an den Daten, bis der p-Wert passt.
    explanation: "Abhilfe: die Auswertung **vorab registrieren**. Dann kann man sich nichts mehr schönrechnen."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Sportler auf dem Titel einer großen Zeitschrift sind danach oft schwächer. Manche sprechen von einem Fluch. Was steckt eher dahinter?
    params:
      options:
        - label: Auf den Titel kommt man nach einem Hoch – danach geht es meist zurück zur Mitte
          correct: true
        - label: Der Druck durch die Berühmtheit
          feedback: Möglich, aber man braucht keinen Druck, um das Muster zu erklären.
        - label: Die Zeitschrift wählt schlechte Sportler
          feedback: "Im Gegenteil: Sie wählt die mit der besten Phase."
    hints:
      - Wann kommt jemand auf den Titel?
      - Ein Hoch enthält meist auch Glück.
    explanation: Auswahl nach einem Extremwert garantiert **Regression zur Mitte**. Ohne Vergleichsgruppe sieht das aus wie ein Effekt.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Jeder Test hat 5 % Fehlalarm-Chance. Wie wahrscheinlich ist bei 10 unabhängigen Tests mindestens ein Zufallstreffer? In Prozent. (0,95¹⁰ ≈ 0,599)
    answer:
      value: 40
      tolerance: 1
    feedback:
      - when: numval(state.input) == 50
        misconception: add-chances
        text: Einfach 10 · 5 % zu rechnen, überschätzt – Treffer können sich überlappen.
    hints:
      - "Gegenteil: kein einziger Treffer, Chance 0,95¹⁰."
      - Rechne 1 − 0,599.
    explanation: 1 − 0,599 ≈ 40 %. Schon zehn Vergleiche machen einen Zufallsfund fast so wahrscheinlich wie einen Münzwurf.
    difficulty: 3

srs:
  cards_from: [rekord, treffer]
