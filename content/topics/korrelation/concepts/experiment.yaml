id: stats.correlation.experiment
type: concept
title: Ein faires Experiment
summary: Zufall, Vergleichsgruppe, Blindtest.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zitronen, Los und Schein-OP
    body: Wirkt ein Mittel wirklich – oder glauben wir es nur? Seit fast 300 Jahren suchen Forscher nach fairen Tests. Deck die Karten auf, in beliebiger Reihenfolge, und entdecke drei berühmte **Experimente**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍋
            front: "1747: Zitronen auf See"
            back: James Lind gab zwölf kranken Seeleuten verschiedene Mittel. Nur die mit Zitrusfrüchten wurden schnell gesund.
          - icon: 🎟️
            front: "1948: Das Los entscheidet"
            back: Im ersten modernen Test entschied das Los, wer gegen Tuberkulose das neue Mittel bekam.
          - icon: 🦵
            front: Operation zum Schein
            back: In einer Knie-Studie bekam eine Gruppe nur eine Schein-OP. Ihr ging es danach genauso gut wie den anderen.

  - kind: problem
    id: schritte
    widget: order
    prompt: Bring die Schritte eines fairen Tests in die richtige Reihenfolge.
    params:
      items:
        - { label: Frage festlegen – hilft das Mittel? }
        - { label: Teilnehmer zufällig auf zwei Gruppen verteilen }
        - { label: "Eine Gruppe bekommt das Mittel, die andere ein Placebo" }
        - { label: "Niemand weiß, wer was bekommt" }
        - { label: Ergebnisse beider Gruppen vergleichen }
    hints:
      - Erst die Frage, zuletzt der Vergleich.
    explanation: Zufall, Placebo und Verblindung schalten andere Einflüsse aus.

  - kind: explain
    id: s2
    body: |
      **Placebo-Effekt:** Schon der Glaube an ein Mittel kann helfen. Darum bekommt die Vergleichsgruppe ein Schein-Mittel.
      **Doppelblind** heißt: Weder Teilnehmer noch Ärzte wissen, wer was bekommt.

  - kind: problem
    id: fehler
    widget: buckets
    prompt: Fair oder unfair?
    params:
      buckets: [{ label: fair }, { label: unfair }]
      items:
        - { label: Gruppen per Los verteilen, bucket: fair }
        - { label: Placebo für die Vergleichsgruppe, bucket: fair }
        - { label: Gesündere bekommen das neue Mittel, bucket: unfair }
        - { label: "Ärzte wissen, wer behandelt wird", bucket: unfair }
        - { label: Nur gute Ergebnisse veröffentlichen, bucket: unfair }
    hints:
      - Kann das Ergebnis schon vorher in eine Richtung kippen?
    explanation: Alles, was die Gruppen ungleich macht, verfälscht das Ergebnis.

  - kind: explain
    id: s4
    body: Warum gilt der zufällige Doppelblind-Test als Goldstandard?
    reveal:
      body: Er ist die einzige Methode, die Ursache und Zufall sauber trennt. Ohne ihn bleibt jede Wirkung eine Vermutung.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Warum teilt man Versuchspersonen per **Zufall** in die Gruppen ein, statt sie selbst wählen zu lassen?
    params:
      options:
        - label: Nur so verteilen sich alle anderen Einflüsse gleichmäßig auf beide Gruppen
          correct: true
        - label: Es geht schneller
          feedback: Der Grund ist die Fairness des Vergleichs.
        - label: Damit niemand weiß, dass er teilnimmt
          feedback: Alle wissen es – nur nicht, in welcher Gruppe sie sind.
    hints:
      - Wer würde freiwillig das neue Mittel wählen?
    explanation: "**Randomisierung** schaltet auch Störgrößen aus, an die niemand gedacht hat."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: Experiment oder Beobachtung?
    params:
      buckets:
        - id: b1
          label: Experiment
        - id: b2
          label: Beobachtungsstudie
      items:
        - label: Das Los teilt in Gruppen.
          bucket: b1
        - label: Man befragt Raucher und Nichtraucher.
          bucket: b2
        - label: Die Hälfte bekommt ein Placebo.
          bucket: b1
        - label: Man wertet alte Krankenakten aus.
          bucket: b2
        - label: Webseite zeigt zufällig A oder B.
          bucket: b1
        - label: Länder mit viel und wenig Sport
          bucket: b2
    hints:
      - "Frag: Hat der Forscher die Ursache selbst verteilt?"
      - Wer nur zuschaut, macht eine Beobachtungsstudie.
    explanation: Nur wenn der Zufall die Ursache verteilt, sind die Gruppen im Schnitt gleich. Beobachtung zeigt Zusammenhänge, Experimente zeigen Ursachen.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Ein Hustensaft wird getestet. Nach einer Woche geht es 80 % der Kranken besser. Warum reicht das nicht als Beleg?
    params:
      options:
        - label: Husten heilt oft von allein – ohne Vergleichsgruppe weiß man nicht, wie viele es ohnehin wären
          correct: true
        - label: 80 % ist zu wenig
          feedback: Auch 99 % wären ohne Vergleich kein Beleg.
        - label: Eine Woche ist zu lang
          feedback: Die Dauer ist nicht der Kern des Problems.
    hints:
      - Was passiert mit Husten, wenn man nichts tut?
      - Man braucht eine Gruppe, die keinen Saft bekommt.
    explanation: Erst der Vergleich mit einer **Kontrollgruppe** zeigt den Anteil, den der Saft wirklich beiträgt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen Korrelation und Kausalität mit einem Beispiel.
    params:
      keywords:
        - - zusammenhang
          - gemeinsam
          - korrel
          - correlat
          - together
          - related
        - - ursache
          - bewirk
          - verursach
          - cause
        - - dritte
          - andere
          - third
          - another
          - hidden
          - versteckt
          - sommer
          - summer
          - hitze
          - heat
      sample: "Korrelation heißt, dass zwei Größen gemeinsam auftreten. Kausalität heißt, dass die eine die andere bewirkt. Eisverkauf und Sonnenbrände hängen zusammen, aber die Ursache ist eine dritte Größe: der Sommer."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: In einer Studie werden 30 % der Placebo-Gruppe krank, aber nur 20 % der Gruppe mit dem Mittel. Wie viele Menschen muss man behandeln, damit **einer** weniger krank wird?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 3
        misconception: nnt-wrong-base
        text: Rechne mit der Differenz der Risiken, nicht mit 30 %.
    hints:
      - Die absolute Senkung ist 10 Prozentpunkte.
      - Die **Number Needed to Treat** ist 1 geteilt durch diese Senkung.
    explanation: "1 : 0,10 = 10. Von zehn Behandelten hat im Schnitt einer einen Nutzen. Neun wären auch so gesund geblieben – oder trotzdem krank geworden."
    difficulty: 3

srs:
  cards_from: [schritte, fehler]
