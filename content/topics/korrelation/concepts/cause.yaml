id: stats.correlation.cause
type: concept
title: Störche bringen keine Babys
summary: Die dritte Größe hinter dem Zusammenhang.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: stoerche
    widget: choice
    prompt: In Gegenden mit mehr Störchen werden mehr Babys geboren. Was ist die beste Erklärung?
    params:
      options:
        - { label: Auf dem Land gibt es von beidem mehr., correct: true }
        - { label: Störche bringen Babys., feedback: "Ein hübsches Märchen – aber keine Erklärung." }
        - { label: Babys locken Störche an., feedback: "Die Richtung ist umgekehrt, aber genauso unplausibel." }
    hints:
      - Gibt es etwas, das beides beeinflusst?
    explanation: Eine **dritte Größe** – ländliche Gegenden – erklärt beides.

  - kind: explain
    id: s2
    body: |
      Hängt A mit B zusammen, gibt es mehrere Möglichkeiten. A bewirkt B. B bewirkt A.
      Eine **dritte Größe** steckt hinter beidem. Oder es ist reiner Zufall.

  - kind: problem
    id: dritte
    widget: match
    prompt: Welche dritte Größe steckt hinter dem Zusammenhang?
    params:
      leftTitle: Zusammenhang
      rightTitle: Dritte Größe
      pairs:
        - { left: Eisverkauf und Sonnenbrand, right: Sommerwetter }
        - { left: Feuerwehrleute und Brandschaden, right: Größe des Brandes }
        - { left: Schuhgröße und Lesen bei Kindern, right: Alter }
        - { left: Kirchen und Kneipen in Städten, right: Einwohnerzahl }
    hints:
      - Frag jeweils – was macht beides gleichzeitig größer?
    explanation: Wetter, Brandgröße, Alter und Stadtgröße treiben jeweils beide Werte.

  - kind: explain
    id: s4
    body: Wie findet man heraus, ob A wirklich B bewirkt?
    reveal:
      body: Mit einem **Experiment**. Man teilt zufällig in zwei Gruppen und ändert nur A. Der Zufall verteilt alle anderen Einflüsse gleichmäßig.

  - kind: problem
    id: kaffee
    widget: choice
    prompt: Eine Studie findet – wer Kaffee trinkt, lebt im Schnitt länger. Was ist der vorsichtigste Schluss?
    params:
      options:
        - { label: Es gibt einen Zusammenhang. Die Ursache ist offen., correct: true }
        - { label: Kaffee verlängert das Leben., feedback: "Vielleicht – aber das zeigt eine Beobachtung allein nicht." }
        - { label: Die Studie ist falsch., feedback: "Der Zusammenhang kann echt sein. Nur die Ursache ist unklar." }
    hints:
      - Wurde hier ein Experiment gemacht?
    explanation: Ohne Experiment bleibt es ein Zusammenhang. Vielleicht trinken gesündere Menschen einfach mehr Kaffee.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Echte Ursache oder nur ein Zusammenhang?
    params:
      buckets:
        - id: b1
          label: Echte Ursache
        - id: b2
          label: Nur Zusammenhang
      items:
        - label: Rauchen und Lungenkrebs
          bucket: b1
        - label: Störche und Geburten
          bucket: b2
        - label: Regen und nasse Straßen
          bucket: b1
        - label: Eisverkauf und Sonnenbrand
          bucket: b2
    hints:
      - Gibt es einen Mechanismus – oder eine dritte Größe?
    explanation: Die Sonne treibt Eisverkauf und Sonnenbrand zugleich.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Hängt A mit B zusammen, kann eine [[dritte]] Größe hinter beidem stecken. Sicherheit bringt erst ein [[Experiment]].
      distractors:
        - erste
        - Diagramm

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Menschen, die viel Sport treiben, sind glücklicher. Welche Erklärung wird oft vergessen?
    params:
      options:
        - label: "Umgekehrte Richtung: Wer glücklich ist, hat mehr Energie für Sport"
          correct: true
        - label: Sport macht unglücklich
          feedback: Dann wäre der Zusammenhang negativ.
        - label: Es gibt gar keinen Zusammenhang
          feedback: Der Zusammenhang ist da – offen ist die Richtung.
    hints:
      - Was ist Ursache, was Wirkung?
    explanation: "**Umgekehrte Kausalität**. Oft wirkt beides: Sport hebt die Stimmung, gute Stimmung fördert Sport."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: match
    prompt: Was steckt hinter dem Zusammenhang?
    params:
      pairs:
        - left: Mehr Feuerwehr, mehr Schaden
          right: "Dritte Größe: Brandgröße"
        - left: Glückliche machen mehr Sport
          right: Umgekehrte Richtung
        - left: Käse und Unfälle im Bett
          right: Zufall beim Datensuchen
        - left: Kranke im Krankenhaus
          right: Auswahl der Fälle
      leftTitle: Beobachtung
      rightTitle: Erklärung
    hints:
      - "Frag bei jedem Paar: Was könnte beides gleichzeitig beeinflussen?"
      - Wer viele Zahlenreihen vergleicht, findet immer irgendwo Paare.
    explanation: "Vier Wege zu einem Schein-Zusammenhang: dritte Größe, umgekehrte Richtung, Zufall und Auswahl."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: Kaffeetrinker bekommen öfter Lungenkrebs. Aber Kaffeetrinker rauchen auch öfter. Wie prüft man, ob Kaffee selbst schuld ist?
    params:
      options:
        - label: Raucher und Nichtraucher getrennt vergleichen
          correct: true
        - label: Mehr Kaffeetrinker befragen
          feedback: Mehr Daten mit derselben Vermischung helfen nicht.
        - label: Den Zusammenhang einfach als Ursache werten
          feedback: Genau das ist die Falle.
    hints:
      - Das Rauchen ist ein **Störfaktor**.
      - "Halte ihn fest: Schau nur auf Nichtraucher."
    explanation: "Bei Nichtrauchern allein verschwindet der Effekt von Kaffee weitgehend. Man nennt das: für den **Störfaktor** kontrollieren."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In einem Krankenhaus sind unter den Patienten zwei Krankheiten negativ korreliert – in der Bevölkerung aber nicht. Wie kann das sein?
    params:
      options:
        - label: Ins Krankenhaus kommt nur, wer mindestens eine hat – die Auswahl erzeugt den Zusammenhang
          correct: true
        - label: Die eine Krankheit heilt die andere
          feedback: Dann gäbe es den Effekt auch draußen.
        - label: Das Krankenhaus misst falsch
          feedback: Die Zahlen stimmen – die Stichprobe ist das Problem.
    hints:
      - Wer weder die eine noch die andere hat, fehlt in den Daten.
    explanation: "**Berksons Paradox** – ein Auswahleffekt. Darum scheinen attraktive Menschen oft unsympathischer: Man datet nur, wer mindestens eines von beidem bietet."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Für Rauchen und Lungenkrebs gab es nie ein Experiment mit Menschen. Welche Beobachtung stützte trotzdem die Kausalität?
    params:
      options:
        - label: Je mehr Zigaretten pro Tag, desto höher das Risiko
          correct: true
        - label: Raucher sind oft älter
          feedback: Das wäre ein Störfaktor, kein Beleg.
        - label: Viele Raucher werden alt
          feedback: Einzelfälle sagen wenig über das Risiko.
    hints:
      - Was erwartet man, wenn A wirklich B bewirkt?
      - Mehr Ursache – mehr Wirkung.
    explanation: Eine **Dosis-Wirkungs-Beziehung**, die richtige zeitliche Reihenfolge, Stärke und Wiederholbarkeit zählen zu den Bradford-Hill-Kriterien (1965).
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Sport senkt das Gewicht, und weniger Gewicht senkt den Blutdruck. Eine Studie rechnet das Gewicht »heraus«. Was passiert mit der gemessenen Wirkung von Sport auf den Blutdruck?
    params:
      options:
        - label: Sie wird kleiner – ein Teil der echten Wirkung wird weggerechnet
          correct: true
        - label: Sie wird genauer
          feedback: Gewicht ist hier kein Störfaktor, sondern der Weg der Wirkung.
        - label: Nichts
          feedback: Das Gewicht liegt genau auf dem Wirkungsweg.
    hints:
      - Liegt das Gewicht vor oder hinter dem Sport in der Kette?
      - Eine Größe auf dem Wirkungsweg heißt Mediator.
    explanation: Für einen **Mediator** zu kontrollieren, schneidet die Wirkung durch. Erst das Ursachen-Diagramm sagt, was man herausrechnen darf.
    difficulty: 3

srs:
  cards_from: [dritte, kaffee]
