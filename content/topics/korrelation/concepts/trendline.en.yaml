id: stats.correlation.trendline
type: concept
title: The trend line
summary: A straight line through the scatter plot.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A line through the cloud
    body: The older a used car, the cheaper it is – usually. A line through the data helps you estimate. Drag points A and B until the line runs nicely through the cloud. That is a **trend line**.
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 8
        y:
          - 0
          - 8
        showCoordinates: false
        points:
          - id: a
            x: 1
            y: 7
            draggable: false
            label: ""
          - id: b
            x: 2
            y: 6
            draggable: false
            label: ""
          - id: c
            x: 2
            y: 5
            draggable: false
            label: ""
          - id: d
            x: 3
            y: 5
            draggable: false
            label: ""
          - id: e
            x: 4
            y: 4
            draggable: false
            label: ""
          - id: f
            x: 5
            y: 3
            draggable: false
            label: ""
          - id: g
            x: 5
            y: 4
            draggable: false
            label: ""
          - id: h
            x: 6
            y: 2
            draggable: false
            label: ""
          - id: i
            x: 7
            y: 2
            draggable: false
            label: ""
          - id: A
            x: 1
            y: 1
            label: A
          - id: B
            x: 7
            y: 7
            label: B
        lines:
          - - A
            - B

  - kind: problem
    id: anpassen
    widget: slider
    prompt: Place the line through the points so that it fits the trend well.
    params:
      expr: "m*x + b"
      x: [0, 8]
      y: [0, 6]
      showCoordinates: false
      sliders:
        - { id: m, label: Slope, min: -1, max: 2, step: 0.25, initial: 0 }
        - { id: b, label: Start, min: -2, max: 4, step: 0.5, initial: 3 }
      markers:
        - { x: 1, y: 1.5 }
        - { x: 2, y: 1.5 }
        - { x: 3, y: 2.5 }
        - { x: 4, y: 2.5 }
        - { x: 5, y: 3.5 }
        - { x: 6, y: 3.5 }
        - { x: 7, y: 4.5 }
    check: { predicate: "m >= 0.5 && m <= 0.75 && b >= 0 && b <= 1" }
    hints:
      - For each step right, the cloud rises by about a half.
    explanation: About y = 0.5 · x + 1. With a line like this, you can estimate values.

  - kind: explain
    id: s2
    body: |
      A **trend line** sums up a scatter plot. Its slope says how much y grows on average when x grows by 1.
      It is only rough – individual points deviate.

  - kind: problem
    id: vorhersage
    widget: numeric
    prompt: "Trend: price = {{m}} € · area in m² + {{b}} €. What is the estimated price for {{a}} m²?"
    params: { unit: "€" }
    answer: { value: "{{m * a + b}}" }
    hints:
      - "{{m}} · {{a}} + {{b}}."
    explanation: "{{m * a}} + {{b}} = {{m * a + b}} €."
    variants:
      params: { m: "choice[10,12,15]", b: "choice[100,200]", a: "choice[30,50,80]" }
      defaults: { m: 12, b: 200, a: 50 }

  - kind: problem
    id: grenzen
    widget: choice
    prompt: A trend line for children's heights rises 6 cm per year. What does it say about 40-year-olds?
    params:
      options:
        - { label: Nothing – it does not apply outside the data., correct: true }
        - { label: "They are over 2.5 m tall.", feedback: "Adults do not keep growing. The line only applies within the measured range." }
    hints:
      - Were adults measured at all?
    explanation: Extending trends beyond the range of the data is dangerous.

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: The trend line is y = 0.5x + 1. Drag point P onto the line at x = 6 – that is the estimate for x = 6.
    params:
      x:
        - 0
        - 8
      y:
        - 0
        - 6
      showCoordinates: false
      functions:
        - expr: 0.5x + 1
      points:
        - id: a
          x: 1
          y: 2
          draggable: false
          label: ""
        - id: b
          x: 2
          y: 2
          draggable: false
          label: ""
        - id: c
          x: 3
          y: 2
          draggable: false
          label: ""
        - id: d
          x: 4
          y: 3
          draggable: false
          label: ""
        - id: e
          x: 5
          y: 4
          draggable: false
          label: ""
        - id: f
          x: 7
          y: 4
          draggable: false
          label: ""
        - id: P
          x: 2
          y: 5
          label: P
    answer:
      points:
        P:
          x: 6
          y: 4
    hints:
      - Put x = 6 into the equation of the line.
      - 0.5 · 6 + 1 = 4 – drag P to (6, 4).
    explanation: At x = 6 the line estimates the value 4. Single real points can differ from it.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Trend line: revenue = 3 · advertising spend + 20 (in thousand €). How much revenue does **one additional** thousand of advertising bring by this trend?"
    params:
      unit: k€
    answer:
      value: 3
    hints:
      - That is the slope.
    explanation: 3 thousand € per thousand of advertising. The 20 is the revenue with no advertising at all.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Three points: (1, 2), (2, 3), (3, 7). The means are x = 2 and y = 4. The slope of the best line is Σ(Δx · Δy) ÷ Σ(Δx²). What is it?"
    answer:
      value: 2.5
    hints:
      - "Δx: −1, 0, 1. Δy: −2, −1, 3."
      - Σ(Δx · Δy) = 2 + 0 + 3 = 5 and Σ(Δx²) = 2.
    explanation: 5 ÷ 2 = 2.5. The line rises 2.5 per step in x – averaged over all points.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: The best line always passes through the point of means (2, 4). Its slope is 2.5. Where does it cross the y-axis?
    answer:
      value: -1
    feedback:
      - when: numval(state.input) == 4
        misconception: intercept-at-mean
        text: That is the y-value at x = 2, not at x = 0.
    hints:
      - Go two steps left from x = 2.
      - Compute 4 − 2 · 2.5.
    explanation: 4 − 5 = −1. The line is y = 2.5x − 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How do you fit the “best” line through a scatter plot?
    params:
      options:
        - label: So that the sum of the **squared** vertical distances becomes as small as possible
          correct: true
        - label: Through the first and the last point
          feedback: Then everything hinges on two random points.
        - label: So that equally many points lie above and below
          feedback: Many lines satisfy that.
    hints:
      - Large deviations should be penalised more than small ones.
    explanation: Gauss’s **method of least squares** – to this day the basis of regression and machine learning.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "The slope can also be written with r: slope = r · s_y ÷ s_x. Here r = 0.8, s_y = 10 and s_x = 5. What is the slope?"
    answer:
      value: 1.6
    hints:
      - s_y ÷ s_x = 2.
      - Multiply by r = 0.8.
    explanation: "0.8 · 2 = 1.6. In z-scores the slope is exactly r: one σ more in x gives r σ more in y."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: You fit the best line once for »y from x« and once for »x from y«. Are they the same line?
    params:
      options:
        - label: No – unless all points lie exactly on a line
          correct: true
        - label: The first minimises vertical distances, the second horizontal ones.
          feedback: Die erste macht senkrechte Abstände klein, die zweite waagrechte.
        - label: They still differ then.
          feedback: Auch dann unterscheiden sie sich.
    hints:
      - Which distances are squared in each case?
      - Vertical and horizontal distances are different.
    explanation: Only at r = ±1 do they coincide. Otherwise the »x from y« line is steeper. The line with slope s_y ÷ s_x lies right between them – regression to the mean in both directions.
    difficulty: 3

srs:
  cards_from: [vorhersage, grenzen]
