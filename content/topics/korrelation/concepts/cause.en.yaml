id: stats.correlation.cause
type: concept
title: Storks do not bring babies
summary: The third factor behind a relationship.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: stoerche
    widget: choice
    prompt: In areas with more storks, more babies are born. What is the best explanation?
    params:
      options:
        - { label: There is more of both in the countryside., correct: true }
        - { label: Storks bring babies., feedback: "A pretty fairy tale – but not an explanation." }
        - { label: Babies attract storks., feedback: "The direction is reversed, but just as implausible." }
    hints:
      - Is there something that affects both?
    explanation: A **third factor** – rural areas – explains both.

  - kind: explain
    id: s2
    body: |
      If A is linked to B, there are several possibilities. A causes B. B causes A.
      A **third factor** is behind both. Or it is pure chance.

  - kind: problem
    id: dritte
    widget: match
    prompt: Which third factor is behind the relationship?
    params:
      leftTitle: Relationship
      rightTitle: Third factor
      pairs:
        - { left: Ice cream sales and sunburn, right: Summer weather }
        - { left: Firefighters and fire damage, right: Size of the fire }
        - { left: Shoe size and reading in children, right: Age }
        - { left: Churches and pubs in cities, right: Population }
    hints:
      - Ask each time – what makes both bigger at once?
    explanation: Weather, fire size, age and city size each drive both values.

  - kind: explain
    id: s4
    body: How do you find out whether A really causes B?
    reveal:
      body: With an **experiment**. You split people randomly into two groups and change only A. Chance spreads all other influences evenly.

  - kind: problem
    id: kaffee
    widget: choice
    prompt: A study finds that people who drink coffee live longer on average. What is the most careful conclusion?
    params:
      options:
        - { label: There is a relationship. The cause is open., correct: true }
        - { label: Coffee extends life., feedback: "Maybe – but an observation alone does not show that." }
        - { label: The study is wrong., feedback: "The relationship may be real. Only the cause is unclear." }
    hints:
      - Was an experiment done here?
    explanation: Without an experiment, it stays a relationship. Maybe healthier people simply drink more coffee.

  - kind: problem
    id: mix-c1
    widget: buckets
    prompt: Real cause or just a link?
    params:
      buckets:
        - id: b1
          label: Real cause
        - id: b2
          label: Just a link
      items:
        - label: Smoking and lung cancer
          bucket: b1
        - label: Storks and births
          bucket: b2
        - label: Rain and wet roads
          bucket: b1
        - label: Ice cream sales and sunburn
          bucket: b2
    hints:
      - Is there a mechanism – or a third factor?
    explanation: The Sun drives ice cream sales and sunburn at once.

  - kind: problem
    id: mix-c2
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: If A is linked to B, a [[third]] factor may be behind both. Only an [[experiment]] gives certainty.
      distractors:
        - first
        - chart

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: People who exercise a lot are happier. Which explanation is often forgotten?
    params:
      options:
        - label: "The reverse direction: those who are happy have more energy for sport"
          correct: true
        - label: Sport makes you unhappy
          feedback: Then the relationship would be negative.
        - label: There is no relationship at all
          feedback: The relationship is there – the direction is open.
    hints:
      - What is cause, what is effect?
    explanation: "**Reverse causality**. Often both act: sport lifts mood, good mood promotes sport."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In a hospital two diseases are negatively correlated among patients – but not in the population. How can that be?
    params:
      options:
        - label: Only those with at least one are admitted – the selection creates the relationship
          correct: true
        - label: One disease cures the other
          feedback: Then the effect would exist outside too.
        - label: The hospital measures wrongly
          feedback: The numbers are right – the sample is the problem.
    hints:
      - Those who have neither are missing from the data.
    explanation: "**Berkson’s paradox** – a selection effect. That is why attractive people often seem less likeable: you only date those who offer at least one of the two."
    difficulty: 3

srs:
  cards_from: [dritte, kaffee]
