id: stats.correlation.chance
type: concept
title: Chance and outliers
summary: Regression to the mean and lucky hits.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: rekord
    widget: choice
    prompt: A team has a record season. The next year goes worse. What is the most likely explanation?
    params:
      options:
        - { label: The record also involved a lot of luck., correct: true }
        - { label: Success made the team lazy., feedback: "Possible, but unnecessary. There is a simpler explanation." }
        - { label: There is a curse on champions., feedback: "Sounds exciting, but explains nothing." }
    hints:
      - How much luck does a record take?
    explanation: Extremes usually include luck. More normal values often follow.

  - kind: explain
    id: s2
    body: |
      **Regression to the mean:** Extreme results are often followed by more normal ones.
      Extremes usually include some luck or bad luck – and that rarely repeats.

  - kind: problem
    id: nachhilfe
    widget: choice
    prompt: The students with the worst grades get tutoring. Afterward, they do better. Does that prove the tutoring works?
    params:
      options:
        - { label: "No – you need a comparison group.", correct: true }
        - { label: "Yes, they did get better.", feedback: "They probably would have improved a bit without tutoring – regression to the mean." }
    hints:
      - Would the weakest students have improved without tutoring?
    explanation: Only a comparison with students who had no tutoring shows the real effect.

  - kind: explain
    id: s4
    body: |
      If you compare a lot, you find **chance** relationships.
      If each test has a 5% chance of a lucky hit, you find one on average in 20 tests.

  - kind: problem
    id: treffer
    widget: numeric
    prompt: Each test has a 5% chance of a lucky hit. How many hits do you expect in {{n}} tests, even if nothing is behind it?
    params: { unit: hits }
    answer: { value: "{{n * 0.05}}" }
    hints:
      - "5% of {{n}}."
    explanation: "{{n}} · 0.05 = {{n * 0.05}} lucky hits."
    variants:
      params: { n: "choice[20,40,60,100]" }
      defaults: { n: 40 }

  - kind: problem
    id: frage
    widget: choice
    prompt: Which question helps most with any study?
    params:
      options:
        - { label: Was there a random comparison group?, correct: true }
        - { label: Does the result sound surprising?, feedback: "Surprising results are exciting – but are more often chance." }
        - { label: Was a lot of money spent?, feedback: "Expensive does not mean correct." }
    hints:
      - What separates cause from chance?
    explanation: Only a fair comparison separates effect from chance and third factors.

  - kind: problem
    id: mix-c1
    widget: numeric
    prompt: Each test has a 5% chance of a pure chance hit. How many chance hits do you expect in 100 tests?
    answer:
      value: 5
    hints:
      - 5% of 100.
    explanation: Five hits – although nothing is behind any of them.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "With 20 independent tests each with a 5% false-alarm chance: what is the probability of **at least one** chance hit? In percent. (0.95²⁰ ≈ 0.358)"
    params:
      unit: "%"
    answer:
      value: 64
      tolerance: 1
    hints:
      - 1 − 0.358.
    explanation: 64%. Whoever tests enough will almost certainly find “something” – even if nothing is there.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Two tests correlate with r = 0.5. The average is 100. Someone scored {{x}} on the first test. What do you expect on the second? Formula: 100 + r · ({{x}} − 100)."
    answer:
      value: "{{100 + 0.5 * (x - 100)}}"
    feedback:
      - when: numval(state.input) == x
        misconception: no-regression
        text: Then there would be no regression to the mean – that only holds for r = 1.
    hints:
      - The distance from the average is {{x - 100}}.
      - Only half of it remains.
    explanation: 100 + 0.5 · ({{x - 100}}) = {{100 + 0.5 * (x - 100)}}. The rest of the swing was luck.
    difficulty: 2
    variants:
      params:
        x: choice[60,70,80,120,130,140]
      defaults:
        x: 130

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Researchers try many analyses and report only the one that is “significant”. What is this called?
    params:
      options:
        - label: p-hacking
          correct: true
        - label: Peer review
          feedback: That is assessment by fellow experts.
        - label: Randomisation
          feedback: That is assigning to groups at random.
    hints:
      - You “hack” at the data until the p-value fits.
    explanation: "The remedy: **pre-register** the analysis. Then nothing can be massaged afterwards."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Athletes on the cover of a big magazine often do worse afterwards. Some call it a curse. What is more likely behind it?
    params:
      options:
        - label: You make the cover after a peak – afterwards things drift back to the mean
          correct: true
        - label: Possible, but you need no pressure to explain the pattern.
          feedback: Möglich, aber man braucht keinen Druck, um das Muster zu erklären.
        - label: "On the contrary: it picks those in their best phase."
          feedback: "Im Gegenteil: Sie wählt die mit der besten Phase."
    hints:
      - When does someone make the cover?
      - A peak usually contains some luck.
    explanation: Selecting on an extreme value guarantees regression to the mean. Without a comparison group it looks like an effect.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Each test has a 5 % chance of a false alarm. How likely is at least one chance hit in 10 independent tests? In percent. (0.95¹⁰ ≈ 0.599)
    answer:
      value: 40
      tolerance: 1
    feedback:
      - when: numval(state.input) == 50
        misconception: add-chances
        text: Just computing 10 · 5 % overestimates – hits can overlap.
    hints:
      - "Complement: no hit at all, probability 0.95¹⁰."
      - Compute 1 − 0.599.
    explanation: 1 − 0.599 ≈ 40 %. Just ten comparisons make a chance find almost as likely as a coin flip.
    difficulty: 3

srs:
  cards_from: [rekord, treffer]
