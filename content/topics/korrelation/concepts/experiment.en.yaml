id: stats.correlation.experiment
type: concept
title: A fair experiment
summary: Randomness, comparison group, blind test.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: schritte
    widget: order
    prompt: Put the steps of a fair test in the right order.
    params:
      items:
        - { label: Set the question – does the remedy work? }
        - { label: Assign participants randomly to two groups }
        - { label: "One group gets the remedy, the other a placebo" }
        - { label: "Nobody knows who gets what" }
        - { label: Compare the results of both groups }
    hints:
      - The question first, the comparison last.
    explanation: Randomness, placebo and blinding rule out other influences.

  - kind: explain
    id: s2
    body: |
      **Placebo effect:** Even believing in a remedy can help. That is why the comparison group gets a fake remedy.
      **Double-blind** means: neither participants nor doctors know who gets what.

  - kind: problem
    id: fehler
    widget: buckets
    prompt: Fair or unfair?
    params:
      buckets: [{ label: fair }, { label: unfair }]
      items:
        - { label: Assign groups by lot, bucket: fair }
        - { label: Placebo for the comparison group, bucket: fair }
        - { label: Healthier people get the new remedy, bucket: unfair }
        - { label: "Doctors know who is treated", bucket: unfair }
        - { label: Publish only good results, bucket: unfair }
    hints:
      - Can the result already tip in one direction?
    explanation: Anything that makes the groups unequal distorts the result.

  - kind: explain
    id: s4
    body: Why is the randomized double-blind test the gold standard?
    reveal:
      body: It is the only method that cleanly separates cause from chance. Without it, every effect stays a guess.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Why are test subjects assigned to the groups at **random** instead of letting them choose?
    params:
      options:
        - label: Only then are all other influences spread evenly over both groups
          correct: true
        - label: It is faster
          feedback: The reason is the fairness of the comparison.
        - label: So that nobody knows they are taking part
          feedback: Everyone knows – just not which group they are in.
    hints:
      - Who would voluntarily choose the new drug?
    explanation: "**Randomisation** also eliminates confounders nobody thought of."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux with an example: what is the gap between correlation and cause?"
    params:
      keywords:
        - - zusammenhang
          - gemeinsam
          - korrel
          - correlat
          - together
          - related
        - - ursache
          - bewirk
          - verursach
          - cause
        - - dritte
          - andere
          - third
          - another
          - hidden
          - versteckt
          - sommer
          - summer
          - hitze
          - heat
      sample: "Correlation means two quantities occur together. Causation means one causes the other. Ice cream sales and sunburns are related, but the cause is a third quantity: summer."
    difficulty: 3

srs:
  cards_from: [schritte, fehler]
