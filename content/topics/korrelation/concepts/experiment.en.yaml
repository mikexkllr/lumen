id: stats.correlation.experiment
type: concept
title: A fair experiment
summary: Randomness, comparison group, blind test.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Lemons, lotteries and fake surgery
    body: Does a remedy really work – or do we just believe it? For almost 300 years, researchers have looked for fair tests. Uncover the cards in any order and discover three famous **experiments**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍋
            front: "1747: Lemons at sea"
            back: James Lind gave twelve sick sailors different remedies. Only those with citrus fruit got well fast.
          - icon: 🎟️
            front: "1948: The lottery decides"
            back: In the first modern trial, a lottery decided who got the new drug against tuberculosis.
          - icon: 🦵
            front: Pretend surgery
            back: In a knee study, one group got only a fake operation. They did just as well afterwards as the others.

  - kind: problem
    id: schritte
    widget: order
    prompt: Put the steps of a fair test in the right order.
    params:
      items:
        - { label: Set the question – does the remedy work? }
        - { label: Assign participants randomly to two groups }
        - { label: "One group gets the remedy, the other a placebo" }
        - { label: "Nobody knows who gets what" }
        - { label: Compare the results of both groups }
    hints:
      - The question first, the comparison last.
    explanation: Randomness, placebo and blinding rule out other influences.

  - kind: explain
    id: s2
    body: |
      **Placebo effect:** Even believing in a remedy can help. That is why the comparison group gets a fake remedy.
      **Double-blind** means: neither participants nor doctors know who gets what.

  - kind: problem
    id: fehler
    widget: buckets
    prompt: Fair or unfair?
    params:
      buckets: [{ label: fair }, { label: unfair }]
      items:
        - { label: Assign groups by lot, bucket: fair }
        - { label: Placebo for the comparison group, bucket: fair }
        - { label: Healthier people get the new remedy, bucket: unfair }
        - { label: "Doctors know who is treated", bucket: unfair }
        - { label: Publish only good results, bucket: unfair }
    hints:
      - Can the result already tip in one direction?
    explanation: Anything that makes the groups unequal distorts the result.

  - kind: explain
    id: s4
    body: Why is the randomized double-blind test the gold standard?
    reveal:
      body: It is the only method that cleanly separates cause from chance. Without it, every effect stays a guess.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Why are test subjects assigned to the groups at **random** instead of letting them choose?
    params:
      options:
        - label: Only then are all other influences spread evenly over both groups
          correct: true
        - label: It is faster
          feedback: The reason is the fairness of the comparison.
        - label: So that nobody knows they are taking part
          feedback: Everyone knows – just not which group they are in.
    hints:
      - Who would voluntarily choose the new drug?
    explanation: "**Randomisation** also eliminates confounders nobody thought of."
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: buckets
    prompt: Experiment or observation?
    params:
      buckets:
        - id: b1
          label: Experiment
        - id: b2
          label: Observational study
      items:
        - label: A lottery assigns the groups.
          bucket: b1
        - label: Smokers and non-smokers are surveyed.
          bucket: b2
        - label: Half get a placebo.
          bucket: b1
        - label: Old medical records are analysed.
          bucket: b2
        - label: Website randomly shows A or B.
          bucket: b1
        - label: Countries with more or less sport
          bucket: b2
    hints:
      - "Ask: did the researcher assign the cause?"
      - Whoever only watches runs an observational study.
    explanation: Only when chance assigns the cause are the groups alike on average. Observation shows links, experiments show causes.
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: choice
    prompt: A cough syrup is tested. After one week 80 % of the patients feel better. Why is that not enough evidence?
    params:
      options:
        - label: Coughs often heal on their own – without a comparison group you do not know how many would anyway
          correct: true
        - label: Even 99 % would be no proof without a comparison.
          feedback: Auch 99 % wären ohne Vergleich kein Beleg.
        - label: The length is not the core problem.
          feedback: Die Dauer ist nicht der Kern des Problems.
    hints:
      - What happens to a cough if you do nothing?
      - You need a group that gets no syrup.
    explanation: Only the comparison with a control group shows the share the syrup really adds.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux with an example: what is the gap between correlation and cause?"
    params:
      keywords:
        - - zusammenhang
          - gemeinsam
          - korrel
          - correlat
          - together
          - related
        - - ursache
          - bewirk
          - verursach
          - cause
        - - dritte
          - andere
          - third
          - another
          - hidden
          - versteckt
          - sommer
          - summer
          - hitze
          - heat
      sample: "Correlation means two quantities occur together. Causation means one causes the other. Ice cream sales and sunburns are related, but the cause is a third quantity: summer."
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: In a trial 30 % of the placebo group fall ill, but only 20 % of the treated group. How many people must be treated for one fewer to fall ill?
    answer:
      value: 10
    feedback:
      - when: numval(state.input) == 3
        misconception: nnt-wrong-base
        text: Use the difference in risks, not 30 %.
    hints:
      - The absolute reduction is 10 percentage points.
      - The number needed to treat is 1 divided by this reduction.
    explanation: 1 ÷ 0.10 = 10. Of ten treated people, on average one benefits. The other nine would have stayed well anyway – or fallen ill regardless.
    difficulty: 3

srs:
  cards_from: [schritte, fehler]
