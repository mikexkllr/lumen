id: stats.correlation.scatter
type: concept
title: Punktwolken lesen
summary: Positiv, negativ oder gar nicht.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Punkte mit Richtung
    body: "Größere Menschen haben meist größere Füße. Solche **Zusammenhänge** siehst du in einer Punktwolke. Zieh die Punkte herum: Bau eine Wolke, die steigt, eine, die fällt, und eine ganz ohne Muster."
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 8
        y:
          - 0
          - 6
        showCoordinates: false
        points:
          - id: a
            x: 1
            y: 4
            label: ""
          - id: b
            x: 2
            y: 2
            label: ""
          - id: c
            x: 3
            y: 5
            label: ""
          - id: d
            x: 4
            y: 1
            label: ""
          - id: e
            x: 5
            y: 3
            label: ""
          - id: f
            x: 6
            y: 5
            label: ""
          - id: g
            x: 7
            y: 2
            label: ""

  - kind: problem
    id: wolke
    widget: choice
    visual:
      widget: graph
      params:
        x: [0, 8]
        y: [0, 6]
        showCoordinates: false
        points:
          - { id: a, x: 1, y: 1, draggable: false, label: "" }
          - { id: b, x: 2, y: 1, draggable: false, label: "" }
          - { id: c, x: 2, y: 2, draggable: false, label: "" }
          - { id: d, x: 3, y: 2, draggable: false, label: "" }
          - { id: e, x: 4, y: 3, draggable: false, label: "" }
          - { id: f, x: 5, y: 3, draggable: false, label: "" }
          - { id: g, x: 5, y: 4, draggable: false, label: "" }
          - { id: h, x: 6, y: 4, draggable: false, label: "" }
          - { id: i, x: 7, y: 5, draggable: false, label: "" }
    prompt: Was zeigt diese Punktwolke?
    params:
      options:
        - { label: "Je größer x, desto größer y.", correct: true }
        - { label: "Je größer x, desto kleiner y.", feedback: "Die Punkte steigen nach rechts an." }
        - { label: Keinen Zusammenhang., feedback: "Die Punkte liegen ziemlich klar entlang einer Linie." }
    hints:
      - Lies die Wolke von links nach rechts.
    explanation: Die Punkte steigen nach rechts – ein positiver Zusammenhang.

  - kind: explain
    id: s2
    body: |
      Eine **Korrelation** ist ein statistischer Zusammenhang.
      Steigen beide Größen gemeinsam, ist sie positiv. Fällt eine, wenn die andere steigt, ist sie negativ.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Positiv, negativ oder kein Zusammenhang?
    params:
      buckets: [{ label: positiv }, { label: negativ }, { label: keiner }]
      items:
        - { label: Körpergröße und Schuhgröße, bucket: positiv }
        - { label: Außentemperatur und Heizkosten, bucket: negativ }
        - { label: Schuhgröße und Lieblingsfarbe, bucket: keiner }
        - { label: Übungszeit und Fehlerzahl, bucket: negativ }
        - { label: Lernzeit und Testergebnis, bucket: positiv }
        - { label: Hausnummer und Einkommen, bucket: keiner }
    hints:
      - Frag dich – wenn das eine steigt, was macht das andere meist?
    explanation: Größe passt zu Schuhgröße, Wärme senkt Heizkosten, Hausnummern sagen nichts übers Einkommen.

  - kind: problem
    id: trend
    widget: graph
    prompt: Ziehe den grünen Punkt bei x = 6 so, dass er zum Trend der Wolke passt.
    params:
      x: [0, 8]
      y: [0, 6]
      showCoordinates: false
      points:
        - { id: a, x: 1, y: 1, draggable: false, label: "" }
        - { id: b, x: 2, y: 2, draggable: false, label: "" }
        - { id: c, x: 3, y: 2, draggable: false, label: "" }
        - { id: d, x: 4, y: 3, draggable: false, label: "" }
        - { id: e, x: 5, y: 4, draggable: false, label: "" }
        - { id: f, x: 7, y: 5, draggable: false, label: "" }
        - { id: Q, x: 6, y: 0, label: "?" }
    check: { predicate: "state.points.Q.x == 6 && state.points.Q.y >= 4 && state.points.Q.y <= 5" }
    solution: { state: { points: { Q: { x: 6, y: 4 } } } }
    hints:
      - Zwischen x = 5 und x = 7 liegen die Punkte bei 4 und 5.
    explanation: Bei x = 6 liegt der Trend zwischen 4 und 5.

  - kind: problem
    id: staerke
    widget: choice
    prompt: Zwei Größen korrelieren stark. Was folgt daraus sicher?
    params:
      options:
        - { label: Man kann die eine gut aus der anderen schätzen., correct: true }
        - { label: Die eine verursacht die andere., feedback: "Das folgt daraus nicht. Darum geht es in der nächsten Lektion." }
        - { label: Beide sind gleich groß., feedback: "Korrelation sagt nichts über die Größe der Werte." }
    hints:
      - Was bedeutet »die Punkte liegen nah an einer Linie«?
    explanation: Eine starke Korrelation erlaubt gute Schätzungen – mehr nicht.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Körpergröße und Schuhgröße
          right: true
        - text: Alter eines Autos und sein Wert
          right: false
        - text: Lernzeit und Testergebnis
          right: true
        - text: Höhe über dem Meer und Lufttemperatur
          right: false
      left: Negativ
      right: Positiv

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Der Korrelationskoeffizient r liegt zwischen −1 und +1. Was bedeutet r = −0,9?
    params:
      options:
        - label: "Ein starker Zusammenhang: Steigt die eine Größe, fällt die andere fast immer"
          correct: true
        - label: Fast kein Zusammenhang
          feedback: Das wäre r nahe 0.
        - label: Ein Rechenfehler – r kann nicht negativ sein
          feedback: Negativ heißt gegenläufig.
    hints:
      - Das Vorzeichen zeigt die Richtung, der Betrag die Stärke.
    explanation: r = −0,9 ist genauso stark wie r = +0,9 – nur andersherum.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie groß ist der Korrelationskoeffizient r dieser Punktwolke?"
    visual:
      widget: graph
      params:
        x:
          - 0
          - 9
        y:
          - 0
          - 8
        showCoordinates: false
        points:
          - id: a
            x: 1
            y: 2
            draggable: false
            label: ""
          - id: b
            x: 2
            y: 1
            draggable: false
            label: ""
          - id: c
            x: 3
            y: 4
            draggable: false
            label: ""
          - id: d
            x: 4
            y: 3
            draggable: false
            label: ""
          - id: e
            x: 5
            y: 6
            draggable: false
            label: ""
          - id: f
            x: 6
            y: 4
            draggable: false
            label: ""
          - id: g
            x: 7
            y: 7
            draggable: false
            label: ""
          - id: h
            x: 8
            y: 6
            draggable: false
            label: ""
    params:
      min: -1
      max: 1
      step: 0.05
    answer:
      value: 0.85
      tolerance: 0.15
    explanation: "r ≈ 0,85: deutlich steigend, aber nicht exakt auf einer Geraden. Bei r = 1 lägen alle Punkte auf einer steigenden Linie."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: match
    prompt: Welche Punktwolke passt zu welchem r?
    params:
      pairs:
        - left: r = 1
          right: Alle auf einer steigenden Linie
        - left: r = −0,9
          right: Eng um eine fallende Linie
        - left: r = 0,3
          right: Breite Wolke, leicht steigend
        - left: r = 0
          right: Kein linearer Trend
      leftTitle: Koeffizient
      rightTitle: Punktwolke
    hints:
      - Das Vorzeichen sagt die Richtung.
      - Der Betrag sagt, wie eng die Punkte an der Linie liegen.
    explanation: "Vorzeichen = Richtung, Betrag = Enge. r = 0,3 ist schwach: Man erkennt den Trend kaum mit bloßem Auge."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Die Punkte liegen genau auf einer Parabel: links fallend, rechts steigend. Der Korrelationskoeffizient ist 0. Was lernt man daraus?"
    params:
      options:
        - label: r misst nur **lineare** Zusammenhänge – es kann trotzdem eine perfekte Abhängigkeit geben
          correct: true
        - label: Die Daten hängen nicht zusammen
          feedback: Kennt man x, kennt man y exakt.
        - label: r wurde falsch berechnet
          feedback: Für eine symmetrische Parabel ist r wirklich 0.
    hints:
      - Der fallende und der steigende Teil heben sich auf.
    explanation: Immer erst die Punktwolke ansehen. Eine Zahl allein verrät nicht, was los ist.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: Du misst die Körpergröße in Zoll statt in Zentimetern. Was passiert mit der Korrelation zwischen Größe und Gewicht?
    params:
      options:
        - label: Nichts – r hat keine Einheit
          correct: true
        - label: Sie wird 2,54-mal kleiner
          feedback: Das gilt für die Steigung einer Geraden, nicht für r.
        - label: Sie wird größer
          feedback: Strecken ändert nicht, wie eng die Punkte liegen.
    hints:
      - "r rechnet mit z-Werten: Abstand vom Mittel durch Standardabweichung."
      - Was passiert mit einem z-Wert, wenn alle Werte mit demselben Faktor gestreckt werden?
    explanation: r ist der Mittelwert der Produkte zₓ · zᵧ. Einheiten kürzen sich heraus. Darum kann man r über Fächer hinweg vergleichen.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Berechne r von Hand für x = 1, 2, 3 und y = 1, 3, 2. Beide Mittelwerte sind 2. Nutze $r = \frac{\sum \Delta x \, \Delta y}{\sqrt{\sum \Delta x^2 \cdot \sum \Delta y^2}}$.
    answer:
      value: 0.5
    hints:
      - Δx = −1, 0, 1 und Δy = −1, 1, 0.
      - Oben steht 1 + 0 + 0 = 1, unten √(2 · 2) = 2.
    explanation: "r = 1/2 = 0,5. Formel: r = Σ(Δx · Δy) / √(ΣΔx² · ΣΔy²). Sie ist der Kosinus des Winkels zwischen den Abstands-Vektoren."
    difficulty: 3

srs:
  cards_from: [sortieren, staerke]
