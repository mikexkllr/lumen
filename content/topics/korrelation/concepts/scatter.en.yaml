id: stats.correlation.scatter
type: concept
title: Reading scatter plots
summary: Positive, negative or none at all.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Points with a direction
    body: "Taller people usually have bigger feet. You can see such **relationships** in a scatter plot. Drag the points around: build a cloud that rises, one that falls and one with no pattern at all."
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 8
        y:
          - 0
          - 6
        showCoordinates: false
        points:
          - id: a
            x: 1
            y: 4
            label: ""
          - id: b
            x: 2
            y: 2
            label: ""
          - id: c
            x: 3
            y: 5
            label: ""
          - id: d
            x: 4
            y: 1
            label: ""
          - id: e
            x: 5
            y: 3
            label: ""
          - id: f
            x: 6
            y: 5
            label: ""
          - id: g
            x: 7
            y: 2
            label: ""

  - kind: problem
    id: wolke
    widget: choice
    visual:
      widget: graph
      params:
        x: [0, 8]
        y: [0, 6]
        showCoordinates: false
        points:
          - { id: a, x: 1, y: 1, draggable: false, label: "" }
          - { id: b, x: 2, y: 1, draggable: false, label: "" }
          - { id: c, x: 2, y: 2, draggable: false, label: "" }
          - { id: d, x: 3, y: 2, draggable: false, label: "" }
          - { id: e, x: 4, y: 3, draggable: false, label: "" }
          - { id: f, x: 5, y: 3, draggable: false, label: "" }
          - { id: g, x: 5, y: 4, draggable: false, label: "" }
          - { id: h, x: 6, y: 4, draggable: false, label: "" }
          - { id: i, x: 7, y: 5, draggable: false, label: "" }
    prompt: What does this scatter plot show?
    params:
      options:
        - { label: "The larger x is, the larger y is.", correct: true }
        - { label: "The larger x is, the smaller y is.", feedback: "The points rise toward the right." }
        - { label: No relationship., feedback: "The points lie fairly clearly along a line." }
    hints:
      - Read the cloud from left to right.
    explanation: The points rise toward the right – a positive relationship.

  - kind: explain
    id: s2
    body: |
      A **correlation** is a statistical relationship.
      If both quantities rise together, it is positive. If one falls while the other rises, it is negative.

  - kind: problem
    id: sortieren
    widget: buckets
    prompt: Positive, negative or no relationship?
    params:
      buckets: [{ label: positive }, { label: negative }, { label: none }]
      items:
        - { label: Height and shoe size, bucket: positive }
        - { label: Outdoor temperature and heating costs, bucket: negative }
        - { label: Shoe size and favorite color, bucket: none }
        - { label: Practice time and number of errors, bucket: negative }
        - { label: Study time and test score, bucket: positive }
        - { label: House number and income, bucket: none }
    hints:
      - Ask yourself – when one rises, what does the other usually do?
    explanation: Height fits shoe size, warmth lowers heating costs, house numbers say nothing about income.

  - kind: problem
    id: trend
    widget: graph
    prompt: Drag the green point at x = 6 so that it fits the trend of the cloud.
    params:
      x: [0, 8]
      y: [0, 6]
      showCoordinates: false
      points:
        - { id: a, x: 1, y: 1, draggable: false, label: "" }
        - { id: b, x: 2, y: 2, draggable: false, label: "" }
        - { id: c, x: 3, y: 2, draggable: false, label: "" }
        - { id: d, x: 4, y: 3, draggable: false, label: "" }
        - { id: e, x: 5, y: 4, draggable: false, label: "" }
        - { id: f, x: 7, y: 5, draggable: false, label: "" }
        - { id: Q, x: 6, y: 0, label: "?" }
    check: { predicate: "state.points.Q.x == 6 && state.points.Q.y >= 4 && state.points.Q.y <= 5" }
    solution: { state: { points: { Q: { x: 6, y: 4 } } } }
    hints:
      - Between x = 5 and x = 7, the points are at 4 and 5.
    explanation: At x = 6, the trend lies between 4 and 5.

  - kind: problem
    id: staerke
    widget: choice
    prompt: Two quantities correlate strongly. What definitely follows?
    params:
      options:
        - { label: You can estimate one well from the other., correct: true }
        - { label: One causes the other., feedback: "That does not follow. The next lesson covers this." }
        - { label: Both are the same size., feedback: "Correlation says nothing about the size of the values." }
    hints:
      - What does “the points lie close to a line” mean?
    explanation: A strong correlation allows good estimates – nothing more.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Body height and shoe size
          right: true
        - text: Age of a car and its value
          right: false
        - text: Study time and test result
          right: true
        - text: Altitude and air temperature
          right: false
      left: Negative
      right: Positive

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: The correlation coefficient r lies between −1 and +1. What does r = −0.9 mean?
    params:
      options:
        - label: "A strong relationship: when one quantity rises, the other almost always falls"
          correct: true
        - label: Almost no relationship
          feedback: That would be r near 0.
        - label: A calculation error – r cannot be negative
          feedback: Negative means opposite directions.
    hints:
      - The sign shows the direction, the magnitude the strength.
    explanation: r = −0.9 is just as strong as r = +0.9 – only the other way round.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: what is the correlation coefficient r of this scatter plot?"
    visual:
      widget: graph
      params:
        x:
          - 0
          - 9
        y:
          - 0
          - 8
        showCoordinates: false
        points:
          - id: a
            x: 1
            y: 2
            draggable: false
            label: ""
          - id: b
            x: 2
            y: 1
            draggable: false
            label: ""
          - id: c
            x: 3
            y: 4
            draggable: false
            label: ""
          - id: d
            x: 4
            y: 3
            draggable: false
            label: ""
          - id: e
            x: 5
            y: 6
            draggable: false
            label: ""
          - id: f
            x: 6
            y: 4
            draggable: false
            label: ""
          - id: g
            x: 7
            y: 7
            draggable: false
            label: ""
          - id: h
            x: 8
            y: 6
            draggable: false
            label: ""
    params:
      min: -1
      max: 1
      step: 0.05
    answer:
      value: 0.85
      tolerance: 0.15
    explanation: "r ≈ 0.85: clearly rising, but not exactly on a line. At r = 1 all points would lie on a rising line."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: match
    prompt: Which scatter plot fits which r?
    params:
      pairs:
        - left: r = 1
          right: All on a rising line
        - left: r = −0.9
          right: Tight around a falling line
        - left: r = 0.3
          right: Wide cloud, slightly rising
        - left: r = 0
          right: No linear trend
      leftTitle: Coefficient
      rightTitle: Scatter plot
    hints:
      - The sign tells the direction.
      - The size tells how tightly the points hug the line.
    explanation: "Sign = direction, size = tightness. r = 0.3 is weak: you barely see the trend by eye."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The points lie exactly on a parabola: falling on the left, rising on the right. The correlation coefficient is 0. What does that teach?"
    params:
      options:
        - label: r measures only **linear** relationships – there can still be a perfect dependence
          correct: true
        - label: The data are unrelated
          feedback: Knowing x you know y exactly.
        - label: r was calculated wrongly
          feedback: For a symmetric parabola r really is 0.
    hints:
      - The falling and the rising part cancel.
    explanation: Always look at the scatter plot first. A single number does not tell what is going on.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: choice
    prompt: You measure height in inches instead of centimetres. What happens to the correlation between height and weight?
    params:
      options:
        - label: Nothing – r has no unit
          correct: true
        - label: That is true for the slope of a line, not for r.
          feedback: Das gilt für die Steigung einer Geraden, nicht für r.
        - label: Stretching does not change how tight the points are.
          feedback: Strecken ändert nicht, wie eng die Punkte liegen.
    hints:
      - "r works with z-scores: distance from the mean divided by the standard deviation."
      - What happens to a z-score when all values are stretched by the same factor?
    explanation: r is the mean of the products zₓ · zᵧ. Units cancel out. That is why r can be compared across fields.
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: numeric
    prompt: Compute r by hand for x = 1, 2, 3 and y = 1, 3, 2. Both means are 2. Use $r = \frac{\sum \Delta x \, \Delta y}{\sqrt{\sum \Delta x^2 \cdot \sum \Delta y^2}}$.
    answer:
      value: 0.5
    hints:
      - Δx = −1, 0, 1 and Δy = −1, 1, 0.
      - The top is 1 + 0 + 0 = 1, the bottom √(2 · 2) = 2.
    explanation: "r = 1/2 = 0.5. Formula: r = Σ(Δx · Δy) / √(ΣΔx² · ΣΔy²). It is the cosine of the angle between the deviation vectors."
    difficulty: 3

srs:
  cards_from: [sortieren, staerke]
