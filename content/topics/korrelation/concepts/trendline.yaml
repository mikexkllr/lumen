id: stats.correlation.trendline
type: concept
title: Die Trendlinie
summary: Eine Gerade durch die Punktwolke.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Eine Linie durch die Wolke
    body: Je älter ein Gebrauchtwagen, desto billiger ist er – meistens. Eine Linie durch die Daten hilft beim Schätzen. Zieh die Punkte A und B, bis die Linie gut durch die Wolke läuft. Das ist eine **Trendlinie**.
    visual:
      widget: graph
      interactive: true
      params:
        x:
          - 0
          - 8
        y:
          - 0
          - 8
        showCoordinates: false
        points:
          - id: a
            x: 1
            y: 7
            draggable: false
            label: ""
          - id: b
            x: 2
            y: 6
            draggable: false
            label: ""
          - id: c
            x: 2
            y: 5
            draggable: false
            label: ""
          - id: d
            x: 3
            y: 5
            draggable: false
            label: ""
          - id: e
            x: 4
            y: 4
            draggable: false
            label: ""
          - id: f
            x: 5
            y: 3
            draggable: false
            label: ""
          - id: g
            x: 5
            y: 4
            draggable: false
            label: ""
          - id: h
            x: 6
            y: 2
            draggable: false
            label: ""
          - id: i
            x: 7
            y: 2
            draggable: false
            label: ""
          - id: A
            x: 1
            y: 1
            label: A
          - id: B
            x: 7
            y: 7
            label: B
        lines:
          - - A
            - B

  - kind: problem
    id: anpassen
    widget: slider
    prompt: Lege die Gerade so durch die Punkte, dass sie den Trend gut trifft.
    params:
      expr: "m*x + b"
      x: [0, 8]
      y: [0, 6]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: -1, max: 2, step: 0.25, initial: 0 }
        - { id: b, label: Start, min: -2, max: 4, step: 0.5, initial: 3 }
      markers:
        - { x: 1, y: 1.5 }
        - { x: 2, y: 1.5 }
        - { x: 3, y: 2.5 }
        - { x: 4, y: 2.5 }
        - { x: 5, y: 3.5 }
        - { x: 6, y: 3.5 }
        - { x: 7, y: 4.5 }
    check: { predicate: "m >= 0.5 && m <= 0.75 && b >= 0 && b <= 1" }
    hints:
      - Pro Schritt nach rechts steigt die Wolke etwa um einen halben.
    explanation: Etwa y = 0,5 · x + 1. Mit so einer Linie kann man Werte schätzen.

  - kind: explain
    id: s2
    body: |
      Eine **Trendlinie** fasst eine Punktwolke zusammen. Ihre Steigung sagt, um wie viel y im Schnitt wächst, wenn x um 1 wächst.
      Sie gilt nur grob – einzelne Punkte weichen ab.

  - kind: problem
    id: vorhersage
    widget: numeric
    prompt: "Trend: Preis = {{m}} € · Fläche in m² + {{b}} €. Was ist der geschätzte Preis für {{a}} m²?"
    params: { unit: "€" }
    answer: { value: "{{m * a + b}}" }
    hints:
      - "{{m}} · {{a}} + {{b}}."
    explanation: "{{m * a}} + {{b}} = {{m * a + b}} €."
    variants:
      params: { m: "choice[10,12,15]", b: "choice[100,200]", a: "choice[30,50,80]" }
      defaults: { m: 12, b: 200, a: 50 }

  - kind: problem
    id: grenzen
    widget: choice
    prompt: Eine Trendlinie über Körpergrößen von Kindern steigt pro Jahr um 6 cm. Was sagt sie über 40-Jährige?
    params:
      options:
        - { label: Nichts – außerhalb der Daten gilt sie nicht., correct: true }
        - { label: "Sie sind über 2,5 m groß.", feedback: "Erwachsene wachsen nicht weiter. Die Linie gilt nur im gemessenen Bereich." }
    hints:
      - Wurden Erwachsene überhaupt gemessen?
    explanation: Trends über den Datenbereich hinaus zu verlängern ist gefährlich.

  - kind: problem
    id: intro-c1
    widget: graph
    prompt: Die Trendlinie lautet y = 0,5x + 1. Zieh den Punkt P auf die Linie bei x = 6 – das ist die Schätzung für x = 6.
    params:
      x:
        - 0
        - 8
      y:
        - 0
        - 6
      showCoordinates: false
      functions:
        - expr: 0.5x + 1
      points:
        - id: a
          x: 1
          y: 2
          draggable: false
          label: ""
        - id: b
          x: 2
          y: 2
          draggable: false
          label: ""
        - id: c
          x: 3
          y: 2
          draggable: false
          label: ""
        - id: d
          x: 4
          y: 3
          draggable: false
          label: ""
        - id: e
          x: 5
          y: 4
          draggable: false
          label: ""
        - id: f
          x: 7
          y: 4
          draggable: false
          label: ""
        - id: P
          x: 2
          y: 5
          label: P
    answer:
      points:
        P:
          x: 6
          y: 4
    hints:
      - Setze x = 6 in die Gleichung der Linie ein.
      - 0,5 · 6 + 1 = 4 – zieh P auf (6 | 4).
    explanation: Die Linie schätzt bei x = 6 den Wert 4. Einzelne echte Punkte können davon abweichen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Trendlinie: Umsatz = 3 · Werbeausgaben + 20 (in Tausend €). Wie viel Umsatz bringt nach diesem Trend **ein zusätzlicher** Tausender Werbung?"
    params:
      unit: Tsd. €
    answer:
      value: 3
    hints:
      - Das ist die Steigung.
    explanation: 3 Tausend € pro Tausender Werbung. Die 20 sind der Umsatz ganz ohne Werbung.
    difficulty: 2

  - kind: problem
    id: da-d1
    depth: 2
    widget: numeric
    prompt: "Drei Punkte: (1 | 2), (2 | 3), (3 | 7). Die Mittelwerte sind x = 2 und y = 4. Die Steigung der besten Geraden ist Σ(Δx · Δy) : Σ(Δx²). Wie groß ist sie?"
    answer:
      value: 2.5
    hints:
      - "Δx: −1, 0, 1. Δy: −2, −1, 3."
      - Σ(Δx · Δy) = 2 + 0 + 3 = 5 und Σ(Δx²) = 2.
    explanation: "5 : 2 = 2,5. Die Gerade steigt pro x-Schritt um 2,5 – im Mittel über alle Punkte."
    difficulty: 2

  - kind: problem
    id: da-d2
    depth: 2
    widget: numeric
    prompt: Die beste Gerade geht immer durch den Punkt der Mittelwerte (2 | 4). Ihre Steigung ist 2,5. Wo schneidet sie die y-Achse?
    answer:
      value: -1
    feedback:
      - when: numval(state.input) == 4
        misconception: intercept-at-mean
        text: Das ist der y-Wert bei x = 2, nicht bei x = 0.
    hints:
      - Geh von x = 2 zwei Schritte nach links.
      - Rechne 4 − 2 · 2,5.
    explanation: 4 − 5 = −1. Die Gerade lautet y = 2,5x − 1.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie legt man die »beste« Gerade durch eine Punktwolke?
    params:
      options:
        - label: So, dass die Summe der **quadrierten** senkrechten Abstände möglichst klein wird
          correct: true
        - label: Durch den ersten und den letzten Punkt
          feedback: Dann hängt alles an zwei zufälligen Punkten.
        - label: So, dass gleich viele Punkte darüber und darunter liegen
          feedback: Das erfüllen viele Geraden.
    hints:
      - Große Abweichungen sollen stärker bestraft werden als kleine.
    explanation: Die **Methode der kleinsten Quadrate** von Gauß – bis heute die Grundlage von Regression und maschinellem Lernen.
    difficulty: 3

  - kind: problem
    id: da-x1
    depth: 3
    widget: numeric
    prompt: "Die Steigung lässt sich auch aus r schreiben: Steigung = r · sᵧ : sₓ. Es gilt r = 0,8, sᵧ = 10 und sₓ = 5. Wie groß ist die Steigung?"
    answer:
      value: 1.6
    hints:
      - "sᵧ : sₓ = 2."
      - Multipliziere mit r = 0,8.
    explanation: "0,8 · 2 = 1,6. In z-Werten ist die Steigung genau r: Ein σ mehr bei x bringt r σ mehr bei y."
    difficulty: 3

  - kind: problem
    id: da-x2
    depth: 3
    widget: choice
    prompt: Man rechnet einmal »y aus x« und einmal »x aus y« als beste Gerade. Sind das dieselben Linien?
    params:
      options:
        - label: Nein – außer alle Punkte liegen genau auf einer Geraden
          correct: true
        - label: Ja, eine Gerade ist eine Gerade
          feedback: Die erste macht senkrechte Abstände klein, die zweite waagrechte.
        - label: Ja, wenn r positiv ist
          feedback: Auch dann unterscheiden sie sich.
    hints:
      - Welche Abstände werden jeweils quadriert?
      - Senkrechte und waagrechte Abstände sind verschieden.
    explanation: "Nur bei r = ±1 fallen beide zusammen. Sonst liegt die »x aus y«-Gerade steiler. Die Linie mit Steigung sᵧ : sₓ liegt genau dazwischen – Regression zur Mitte in beide Richtungen."
    difficulty: 3

srs:
  cards_from: [vorhersage, grenzen]
