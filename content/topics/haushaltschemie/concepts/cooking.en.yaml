id: chem.everyday.cooking
type: concept
title: "Cooking is chemistry"
summary: "Egg sets, sugar caramelises, apples turn brown."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Recipe experiment
    body: "Every recipe is a small experiment. When you bake, boil or fry, substances change. Uncover the cards: where does something truly **new** appear – and where not?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍞
            front: Yeast dough
            back: Yeast eats sugar and gives off CO₂. The bubbles make the dough rise.
          - icon: 🍍
            front: Pineapple and jelly
            back: "Fresh pineapple stops jelly from setting: an enzyme cuts up the gelatine."
          - icon: 🍯
            front: Everlasting honey
            back: Edible honey was found in pharaohs' tombs. So much sugar dries out germs.
          - icon: 🍿
            front: Popcorn
            back: The water in the kernel turns to steam and bursts the shell – no new substances at all.

  - kind: problem
    id: hook
    widget: choice
    prompt: A raw egg is runny, a boiled one firm. What happened during cooking?
    params:
      options:
        - label: The protein molecules unfolded and clumped together
          correct: true
        - label: The water evaporated
          feedback: Hardly any water is lost through the shell.
        - label: The egg froze
          feedback: It was heated.
    hints:
      - Heat changes the shape of proteins.
      - The clumped chains trap water.
    explanation: This is called **denaturation**. It cannot be reversed – a boiled egg never turns raw again.

  - kind: problem
    id: c1
    widget: buckets
    prompt: "What happens in the kitchen: just a change of state or a real reaction?"
    params:
      buckets:
        - id: b1
          label: state only
        - id: b2
          label: reaction
      items:
        - label: Butter melts in the pan
          bucket: b1
        - label: Pasta water boils
          bucket: b1
        - label: Salt dissolves in the soup
          bucket: b1
        - label: Toast turns brown
          bucket: b2
        - label: Sugar turns into caramel
          bucket: b2
        - label: A fried egg sets
          bucket: b2
    hints:
      - Does a new substance with a new taste form?
      - Melted butter turns solid again when it cools.
    explanation: Changes of state can be reversed, reactions usually cannot. Browning and setting create new substances.

  - kind: problem
    id: c2
    widget: choice
    prompt: You add a spoonful of salt to the pasta water. Does it then boil noticeably hotter?
    params:
      options:
        - label: Barely – the boiling point rises by only a fraction of a degree
          correct: true
        - label: Yes, by about 10 °C
          feedback: That would take an enormous amount of salt.
        - label: No, it boils cooler
          feedback: Dissolved substances raise the boiling point, not lower it.
    hints:
      - 10 g of salt per litre is only about 0.17 mol.
      - Per mole of particles the boiling point rises by about half a degree.
    explanation: About 0.2 °C more. The salt is there for flavour, not temperature.

  - kind: problem
    id: c3
    widget: choice
    prompt: Cutting onions makes your eyes water. What is behind it?
    params:
      options:
        - label: Cutting mixes substances from the cells, and an enzyme makes an irritating gas
          correct: true
        - label: Onions are as acidic as lemons
          feedback: Acid would not be felt in the air.
        - label: The onion juice squirts into your eye
          feedback: Your eyes water even without splashes.
    hints:
      - In a whole onion the substances are kept apart.
      - The gas dissolves in your tears.
    explanation: "The gas contains sulfur. Chilled onions and sharp knives help: cold slows the enzyme, clean cuts destroy fewer cells."

  - kind: problem
    id: d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: from what temperature in Celsius does table sugar start to caramelise?"
    params:
      min: 50
      max: 300
      unit: °C
    answer:
      value: 165
      tolerance: 15
    explanation: From about 160 °C. The sugar breaks down and forms hundreds of new substances – brown, bittersweet and fragrant.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: In **caramelisation**, sugar gives off water in the heat and breaks down. The fragments form aroma compounds and brown pigments. All it needs is sugar and heat.

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: How much energy does it take to heat {{m}} L of water from {{t}} °C to 100 °C? (4.2 kJ per litre per degree)
    params:
      unit: kJ
    answer:
      value: "{{4.2 * m * (100 - t)}}"
      tolerance: 0.01
    hints:
      - "Temperature difference: 100 − {{t}} = {{100 - t}} degrees."
      - Work out 4.2 · {{m}} · {{100 - t}}.
    explanation: "{{4.2 * m * (100 - t)}} kJ. A lid on the pot saves a noticeable share of it."
    difficulty: 2
    variants:
      params:
        m: choice[0.5,1,2]
        t: choice[10,20]
      defaults:
        m: 1
        t: 20

  - kind: problem
    id: d4
    depth: 2
    widget: choice
    prompt: A cut apple turns brown – not with lemon juice on it. Why?
    params:
      options:
        - label: The acid slows the browning enzyme, and vitamin C intercepts the oxygen
          correct: true
        - label: Lemon juice dyes the apple yellow
          feedback: It is almost colourless.
        - label: Lemon juice is cold
          feedback: Warm juice helps too.
    hints:
      - An enzyme oxidises substances in the apple with oxygen from the air.
      - Enzymes need the right pH.
    explanation: Ascorbic acid (vitamin C) gets oxidised more readily than the apple's compounds – it sacrifices itself, like zinc on a ship.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eggs cooked at 63 °C often have firm-ish white but still runny yolk. How is that possible?
    params:
      options:
        - label: Different proteins denature at different temperatures
          correct: true
        - label: The yolk is better insulated
          feedback: With a long cook the whole egg is at 63 °C.
        - label: Yolk contains no protein
          feedback: Yolk is rich in proteins.
    hints:
      - One protein in the white sets at about 62 °C.
      - The yolk only thickens from about 65 °C.
    explanation: Setting the temperature precisely decides the texture. That is the idea behind water-bath cooking (sous-vide).
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: For ceviche, raw fish is only marinated in lime juice. Yet it turns white and firm. Why?
    params:
      options:
        - label: Acid denatures proteins too – not only heat
          correct: true
        - label: The juice is hot
          feedback: It is cool.
        - label: The fish dries out
          feedback: It is lying in liquid.
    hints:
      - Acid changes the charges on the side chains.
      - Different charges, different folding.
    explanation: Acid "cooks" the protein chemically. But it does not kill germs as reliably as heat – so the fish must be very fresh.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what happens chemically when you boil an egg.
    params:
      keywords:
        - - protein
          - eiweiß
        - - denatur
          - entfalt
          - unfold
        - - verklump
          - vernetz
          - fest
          - clump
          - solid
          - firm
      sample: Egg white is made of folded proteins. The heat breaks the hydrogen bonds and the proteins unfold – they denature. The open chains clump together and the egg turns firm.
    explanation: Unfolding and clumping – a reaction with no way back.
    difficulty: 3

srs:
  cards_from: ["c1", "d3", "x1"]
