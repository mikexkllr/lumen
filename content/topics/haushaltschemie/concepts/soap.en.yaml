id: chem.everyday.soap
type: concept
title: "Soap and surfactants"
summary: "A two-faced molecule pulls grease into water."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Little grease hunters
    body: "Water alone cannot shift grease. A drop of soap does it in seconds. Uncover the cards: what else can these **surfactants** do?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌶️
            front: The pepper escape
            back: "Sprinkle pepper on water and dab in washing-up liquid: the pepper flees to the edge."
          - icon: 🫧
            front: Soap bubbles
            back: Their skin is a hundred times thinner than a hair – held by soap molecules.
          - icon: 🏺
            front: Ancient invention
            back: Over 4000 years ago, people were boiling soap from fat and ashes.
          - icon: 🧺
            front: Laundry detergent
            back: It contains enzymes that literally cut up egg and gravy stains.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: for how many seconds should you wash your hands with soap for it to work?"
    params:
      min: 1
      max: 120
      unit: s
    answer:
      value: 20
      tolerance: 6
    explanation: At least 20 seconds – about two rounds of "Happy Birthday". That is how long soap molecules need to lift grease and germs.

  - kind: explain
    id: c1
    body: "A **surfactant** has two ends: a charged head that loves water and a long tail of CH chains that loves grease. Soap is the best-known surfactant."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Head or tail of the soap molecule?
    params:
      buckets:
        - id: b1
          label: Head
        - id: b2
          label: Tail
      items:
        - label: carries a charge
          bucket: b1
        - label: is polar
          bucket: b1
        - label: points into the water
          bucket: b1
        - label: is a long CH chain
          bucket: b2
        - label: is non-polar
          bucket: b2
        - label: dips into the grease
          bucket: b2
    hints:
      - Like dissolves like.
      - Water is polar, grease is non-polar.
    explanation: The head is usually a carboxylate group –COO⁻, the tail a chain of 12 to 18 C atoms.

  - kind: problem
    id: c3
    widget: order
    prompt: Order how soap removes a grease stain.
    params:
      items:
        - label: The tails dip into the grease
        - label: The soap wraps up small grease droplets
        - label: The heads point outwards into the water
        - label: The rinse water carries the little balls away
    hints:
      - The grease-loving part acts first.
      - At the end the grease is spread through the water.
    explanation: Soap does not make grease soluble in water – it just packs it into small, water-friendly wrappers.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why can you hardly get butter off your fingers with cold water alone?
    params:
      options:
        - label: Fat is non-polar and does not mix with polar water
          correct: true
        - label: Butter is too heavy
          feedback: Butter actually floats on water.
        - label: Cold water is too thick
          feedback: Thickness is not the issue.
    hints:
      - Think of oil on a puddle.
      - Water prefers to stay with water.
    explanation: Only a surfactant connects the two worlds. Warm water just helps by softening the fat.

  - kind: explain
    id: d1
    depth: 2
    body: "In water, soap molecules cluster into balls: tails inwards, heads outwards. Such a ball is called a **micelle**. Grease gets trapped inside it."

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: In very hard water soap barely lathers, and a grey scum stays in the basin. Why?
    params:
      options:
        - label: Calcium ions form insoluble lime soap with soap
          correct: true
        - label: Hard water is too cold
          feedback: Hardness means dissolved minerals, not temperature.
        - label: The soap turns acidic
          feedback: A salt precipitates.
    hints:
      - Hard water contains a lot of Ca²⁺.
      - Ca²⁺ firmly binds two soap anions.
    explanation: The lime soap drops out as scum and is lost for washing. Modern detergents use surfactants that stay soluble with calcium.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A paperclip floats carefully on water. One drop of washing-up liquid beside it – and it sinks. Why?
    params:
      options:
        - label: The surfactant lowers surface tension, and the water's "skin" breaks
          correct: true
        - label: The liquid makes the clip heavier
          feedback: Its mass does not change.
        - label: The liquid dissolves the metal
          feedback: There is neither the time nor any acid for that.
    hints:
      - Water molecules at the surface hold together via hydrogen bonds.
      - Surfactants push in between those molecules.
    explanation: Surfactant heads dip in, tails stick out – the surface barely holds any more. That is why soapy water wets every corner.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: "Soap forms when fat is boiled with caustic soda: fat + 3 NaOH → glycerol + 3 soap. How many moles of NaOH are needed for {{n}} mol of fat?"
    params:
      unit: mol
    answer:
      value: "{{3 * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: ratio-ignored
        text: A fat has three fatty acids – each one needs one NaOH.
    hints:
      - "Read the ratio: 1 fat to 3 NaOH."
      - Work out {{n}} · 3.
    explanation: "{{n}} · 3 = {{3 * n}} mol of NaOH. Soap makers calculate exactly so that no caustic lye is left over."
    difficulty: 2
    variants:
      params:
        n: step[0.5,5,0.5]
      defaults:
        n: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does washing your hands with soap make viruses with a fatty envelope – such as flu or coronaviruses – harmless?
    params:
      options:
        - label: The surfactant tails break up the fatty envelope, and the virus falls apart
          correct: true
        - label: Soap is an antibiotic
          feedback: Antibiotics act on bacteria, not viruses.
        - label: Soap freezes the viruses
          feedback: The temperature does not change.
    hints:
      - The virus envelope is made of fatty molecules, like a cell membrane.
      - Grease-loving tails mix into that layer.
    explanation: Without its envelope the virus can no longer infect cells. Thorough washing therefore often works as well as disinfectant.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Classic soap has a pH of about 9 to 10 in water. Why is it basic?
    params:
      options:
        - label: It is the salt of a weak acid – the anion catches H⁺ from the water
          correct: true
        - label: There is leftover caustic soda
          feedback: Well-made soap contains no free lye.
        - label: Fat is basic
          feedback: Fat itself is neutral.
    hints:
      - Fatty acids are weak acids.
      - R–COO⁻ + H₂O ⇌ R–COOH + OH⁻.
    explanation: Our skin is slightly acidic (pH around 5). Soap-free "syndets" are therefore often set to pH 5.5.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how soap gets grease off your hands.
    params:
      keywords:
        - - kopf
          - head
          - polar
          - wasserliebend
          - water-loving
        - - schwanz
          - tail
          - unpolar
          - non-polar
          - fettliebend
          - grease-loving
        - - mizell
          - micelle
          - kugel
          - ball
          - umhüll
          - wrap
      sample: Soap has a polar head that loves water and a non-polar tail that loves grease. The tails dip into the grease, the heads into the water. So the grease is packed into small balls, micelles, and rinsed away.
    explanation: Two ends, two worlds – soap is the bridge.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d4"]
