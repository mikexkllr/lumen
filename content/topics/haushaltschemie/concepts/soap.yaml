id: chem.everyday.soap
type: concept
title: "Seife und Tenside"
summary: "Ein Molekül mit zwei Gesichtern holt Fett ins Wasser."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Kleine Fettjäger
    body: "Wasser allein bekommt Fett nicht ab. Ein Tropfen Seife schafft das in Sekunden. Deck die Karten auf: Was können diese **Tenside** noch alles?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🌶️
            front: Die Pfeffer-Flucht
            back: "Streu Pfeffer auf Wasser und tupf Spülmittel hinein: Der Pfeffer flieht an den Rand."
          - icon: 🫧
            front: Seifenblasen
            back: Ihre Haut ist hundertmal dünner als ein Haar – gehalten von Seifenmolekülen.
          - icon: 🏺
            front: Uralte Erfindung
            back: Schon vor über 4000 Jahren kochten Menschen Seife aus Fett und Asche.
          - icon: 🧺
            front: Waschmittel
            back: Es enthält Enzyme, die Flecken aus Ei und Soße regelrecht zerschneiden.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Sekunden sollte man die Hände mit Seife waschen, damit es wirkt?"
    params:
      min: 1
      max: 120
      unit: s
    answer:
      value: 20
      tolerance: 6
    explanation: Mindestens 20 Sekunden – etwa zweimal »Happy Birthday« summen. So lange brauchen die Seifenmoleküle, um Fett und Keime zu lösen.

  - kind: explain
    id: c1
    body: "Ein **Tensid** hat zwei Enden: einen geladenen Kopf, der Wasser liebt, und einen langen Schwanz aus CH-Ketten, der Fett liebt. Seife ist das bekannteste Tensid."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Kopf oder Schwanz des Seifenmoleküls?
    params:
      buckets:
        - id: b1
          label: Kopf
        - id: b2
          label: Schwanz
      items:
        - label: trägt eine Ladung
          bucket: b1
        - label: ist polar
          bucket: b1
        - label: zeigt ins Wasser
          bucket: b1
        - label: ist eine lange CH-Kette
          bucket: b2
        - label: ist unpolar
          bucket: b2
        - label: taucht ins Fett ein
          bucket: b2
    hints:
      - Gleiches löst Gleiches.
      - Wasser ist polar, Fett unpolar.
    explanation: Der Kopf ist meist eine Carboxylat-Gruppe –COO⁻, der Schwanz eine Kette aus 12 bis 18 C-Atomen.

  - kind: problem
    id: c3
    widget: order
    prompt: Ordne, wie Seife einen Fettfleck entfernt.
    params:
      items:
        - label: Die Schwänze tauchen ins Fett
        - label: Die Seife umhüllt kleine Fett-Tröpfchen
        - label: Die Köpfe zeigen nach außen ins Wasser
        - label: Das Spülwasser trägt die Kügelchen fort
    hints:
      - Erst greift der fettliebende Teil an.
      - Am Ende ist das Fett im Wasser verteilt.
    explanation: Seife macht Fett nicht wasserlöslich – sie verpackt es nur in kleine, wasserfreundliche Hüllen.

  - kind: problem
    id: c4
    widget: choice
    prompt: Warum bekommst du Butter an den Fingern mit kaltem Wasser allein kaum ab?
    params:
      options:
        - label: Fett ist unpolar und mischt sich nicht mit polarem Wasser
          correct: true
        - label: Butter ist zu schwer
          feedback: Butter schwimmt sogar auf Wasser.
        - label: Kaltes Wasser ist zu dick
          feedback: An der Dicke liegt es nicht.
    hints:
      - Denk an Öl auf einer Pfütze.
      - Wasser bleibt lieber bei Wasser.
    explanation: Erst ein Tensid verbindet beide Welten. Warmes Wasser hilft nur, weil Fett weicher wird.

  - kind: explain
    id: d1
    depth: 2
    body: "Im Wasser lagern sich Seifenmoleküle zu Kugeln zusammen: Schwänze nach innen, Köpfe nach außen. Eine solche Kugel heißt **Mizelle**. In ihrem Inneren wird Fett eingeschlossen."

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: In sehr hartem Wasser schäumt Seife kaum, und ein grauer Belag bleibt im Waschbecken. Warum?
    params:
      options:
        - label: Calcium-Ionen bilden mit Seife unlösliche Kalkseife
          correct: true
        - label: Hartes Wasser ist zu kalt
          feedback: Härte meint gelöste Mineralien, nicht Temperatur.
        - label: Die Seife wird sauer
          feedback: Es fällt ein Salz aus.
    hints:
      - Hartes Wasser enthält viel Ca²⁺.
      - Ca²⁺ bindet zwei Seifen-Anionen fest.
    explanation: Die Kalkseife fällt als Belag aus und fehlt beim Waschen. Moderne Waschmittel nutzen Tenside, die mit Calcium löslich bleiben.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Eine Büroklammer schwimmt vorsichtig auf Wasser. Ein Tropfen Spülmittel daneben – und sie sinkt. Warum?
    params:
      options:
        - label: Das Tensid senkt die Oberflächenspannung, die »Haut« des Wassers reißt
          correct: true
        - label: Das Spülmittel macht die Klammer schwerer
          feedback: Die Masse ändert sich nicht.
        - label: Das Spülmittel löst das Metall
          feedback: Dafür ist keine Zeit und keine Säure da.
    hints:
      - Wassermoleküle an der Oberfläche halten über Brücken zusammen.
      - Tenside schieben sich zwischen diese Moleküle.
    explanation: Tensid-Köpfe tauchen ein, Schwänze ragen heraus – die Oberfläche hält kaum noch. Darum benetzt Spülwasser jede Ecke.
    difficulty: 2

  - kind: problem
    id: d4
    depth: 2
    widget: numeric
    prompt: "Seife entsteht beim Kochen von Fett mit Natronlauge: Fett + 3 NaOH → Glycerin + 3 Seife. Wie viel Mol NaOH braucht man für {{n}} mol Fett?"
    params:
      unit: mol
    answer:
      value: "{{3 * n}}"
    feedback:
      - when: numval(state.input) == n
        misconception: ratio-ignored
        text: Ein Fett hat drei Fettsäuren – jede braucht ein NaOH.
    hints:
      - "Lies das Verhältnis: 1 Fett zu 3 NaOH."
      - Rechne {{n}} · 3.
    explanation: "{{n}} · 3 = {{3 * n}} mol NaOH. Seifensieder rechnen genau, damit keine ätzende Lauge übrig bleibt."
    difficulty: 2
    variants:
      params:
        n: step[0.5,5,0.5]
      defaults:
        n: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Viele Viren haben eine Hülle aus Fett, etwa Grippeviren. Warum macht Seife sie unschädlich?
    params:
      options:
        - label: Die Tensid-Schwänze lösen die fettige Hülle auf, das Virus fällt auseinander
          correct: true
        - label: Seife ist ein Antibiotikum
          feedback: Antibiotika wirken gegen Bakterien, nicht gegen Viren.
        - label: Seife friert die Viren ein
          feedback: Die Temperatur ändert sich nicht.
    hints:
      - Die Virushülle besteht aus Fett-Molekülen wie eine Zellmembran.
      - Fettliebende Schwänze mischen sich in diese Schicht.
    explanation: Ohne Hülle kann das Virus keine Zellen mehr befallen. Gründliches Waschen wirkt darum oft so gut wie Desinfektion.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Klassische Seife hat in Wasser einen pH-Wert von etwa 9 bis 10. Warum ist sie basisch?
    params:
      options:
        - label: Sie ist das Salz einer schwachen Säure – das Anion fängt H⁺ aus dem Wasser
          correct: true
        - label: Es ist Natronlauge übrig
          feedback: Gut gemachte Seife enthält keine freie Lauge.
        - label: Fett ist basisch
          feedback: Fett selbst ist neutral.
    hints:
      - Fettsäuren sind schwache Säuren.
      - R–COO⁻ + H₂O ⇌ R–COOH + OH⁻.
    explanation: Unsere Haut ist leicht sauer (pH um 5). Seifenfreie »Syndets« sind darum oft auf pH 5,5 eingestellt.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Seife Fett von den Händen holt.
    params:
      keywords:
        - - kopf
          - head
          - polar
          - wasserliebend
          - water-loving
        - - schwanz
          - tail
          - unpolar
          - non-polar
          - fettliebend
          - grease-loving
        - - mizell
          - micelle
          - kugel
          - ball
          - umhüll
          - wrap
      sample: Seife hat einen polaren Kopf, der Wasser liebt, und einen unpolaren Schwanz, der Fett liebt. Die Schwänze tauchen ins Fett, die Köpfe ins Wasser. So wird das Fett in kleine Kugeln, Mizellen, verpackt und weggespült.
    explanation: Zwei Enden, zwei Welten – die Seife ist die Brücke.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d4"]
