id: chem.everyday.maillard
type: concept
title: "The Maillard reaction"
summary: "Why crusts, coffee and pretzels taste so good."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Fried meat tastes completely different from boiled meat. What is the main reason?
    params:
      options:
        - label: In the pan it gets hotter than 140 °C – in water never above 100 °C
          correct: true
        - label: The oil brings the flavour
          feedback: Even grilled without oil, meat browns.
        - label: Boiling washes out salt
          feedback: Even salted, boiled meat tastes different.
    hints:
      - Water cannot get hotter than 100 °C.
      - The brown crust needs high heat.
    explanation: Only at high temperature does the Maillard reaction run fast enough. It creates the roasted flavours.

  - kind: explain
    id: c1
    body: In the **Maillard reaction**, sugars and amino acids react with each other in the heat. Hundreds of aroma compounds and brown pigments form – the crust on bread and roasts.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Is the Maillard reaction behind it?
    params:
      buckets:
        - id: b1
          label: yes
        - id: b2
          label: no
      items:
        - label: Bread crust
          bucket: b1
        - label: Crust on a steak
          bucket: b1
        - label: Roasted coffee beans
          bucket: b1
        - label: Dark malt in beer
          bucket: b1
        - label: Boiled potato
          bucket: b2
        - label: Pure caramel
          bucket: b2
    hints:
      - It needs sugar, amino acids and over 120 °C.
      - Pure sugar has no amino acids.
    explanation: Caramel browns by caramelisation – with no amino acids at all. Boiled potatoes stay below 100 °C.

  - kind: problem
    id: c3
    widget: estimate
    prompt: "Take a guess: from what temperature does the Maillard reaction run really fast?"
    params:
      min: 50
      max: 300
      unit: °C
    answer:
      value: 150
      tolerance: 20
    explanation: Roughly between 140 and 165 °C. Above that the surface soon chars and turns bitter.

  - kind: problem
    id: c4
    widget: choice
    prompt: Cooks pat meat dry before searing it. Why?
    params:
      options:
        - label: While water is evaporating, the surface stays at 100 °C – too cool for a crust
          correct: true
        - label: Water makes the meat poisonous
          feedback: Water is harmless.
        - label: Dry meat is lighter
          feedback: Weight does not matter.
    hints:
      - Evaporation swallows a lot of heat.
      - Only once the water is gone does the temperature rise.
    explanation: Wet meat stews in the pan instead of frying. For the same reason you do not crowd the pan.

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: Put the Maillard reaction roughly into its steps.
    params:
      items:
        - label: Sugar and amino acid join
        - label: Water is split off
        - label: The molecule rearranges
        - label: It breaks into many aroma compounds
        - label: Brown giant molecules form
    hints:
      - At the start, the amino group reacts with the sugar.
      - The brown colour comes right at the end.
    explanation: The brown end products are called melanoidins. Depending on the amino acid, it smells of bread, meat, nuts or chocolate.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Pretzels are dipped briefly in dilute caustic soda before baking. Why do they turn such a deep brown?
    params:
      options:
        - label: In a basic environment the Maillard reaction runs much faster
          correct: true
        - label: The lye is brown
          feedback: Caustic soda is colourless.
        - label: The lye burns the dough
          feedback: It reacts away during baking and is harmless afterwards.
    hints:
      - The amino group reacts better when it carries no H⁺.
      - In acid it is blocked as –NH₃⁺.
    explanation: The lye reacts with CO₂ during baking to harmless sodium carbonate. A pinch of baking soda browns onions faster too.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: In bread only the crust turns brown; the inside stays pale. Why?
    params:
      options:
        - label: Inside, water evaporates and keeps it at about 100 °C
          correct: true
        - label: There is no sugar inside
          feedback: There is sugar throughout the dough.
        - label: There is no oxygen inside
          feedback: The Maillard reaction does not need oxygen.
    hints:
      - Wherever there is still water, it gets no hotter than 100 °C.
      - The surface dries out first.
    explanation: The dry crust reaches over 150 °C, the moist crumb never does. That is why bread has two such different tastes.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: When potatoes are fried hard, acrylamide forms, a possible carcinogen. What is the rule of thumb because of this?
    params:
      options:
        - label: '"Golden, not burnt" – do not fry too hot or too dark'
          correct: true
        - label: Never fry at all
          feedback: Moderate browning is considered fine.
        - label: Use more salt
          feedback: Salt does not prevent acrylamide.
    hints:
      - Acrylamide forms from the amino acid asparagine and sugar.
      - A lot of it forms especially above 170 °C.
    explanation: Acrylamide is a by-product of the Maillard reaction. Frying at no more than 175 °C and golden rather than dark brown chips lower it clearly.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Dough with honey browns faster than dough with the same amount of table sugar. Why?
    params:
      options:
        - label: Honey contains glucose and fructose with a free reactive group, sucrose does not
          correct: true
        - label: Honey is darker
          feedback: Honey's colour is not what browns the crust.
        - label: Honey contains fat
          feedback: Honey is almost fat-free.
    hints:
      - For Maillard, the sugar needs an open carbonyl group.
      - In sucrose both sugars are linked by exactly these groups.
    explanation: Only "reducing" sugars react directly. Sucrose first has to be split into glucose and fructose.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why a frying pan creates roasted flavours but a cooking pot does not.
    params:
      keywords:
        - - maillard
        - - zucker
          - aminosäure
          - sugar
          - amino acid
        - - "100"
          - temperatur
          - temperature
          - heiß
          - hot
          - wasser
          - water
      sample: Roasted flavours come from the Maillard reaction between sugars and amino acids. It needs over 140 °C. In a pot the water keeps everything at 100 °C; in a dry pan the surface gets much hotter.
    explanation: Water is a temperature cap at 100 °C.
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x2"]
