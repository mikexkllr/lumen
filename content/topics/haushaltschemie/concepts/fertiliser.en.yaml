id: chem.everyday.fertiliser
type: concept
title: "Fertilisers"
summary: "Nitrogen, phosphorus, potassium – and what too much of them does."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Food for plants
    body: "Plants build themselves from air and water – but without a few salts from the soil they hardly grow. Uncover the cards: why is **fertiliser** so valuable – and when does it do harm?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🐦
            front: Bird droppings as treasure
            back: In the 19th century, guano was so prized that countries went to war over it.
          - icon: ⚡
            front: Fertiliser from the sky
            back: Lightning splits nitrogen from the air. Rain carries it into the soil.
          - icon: 🧍
            front: Nitrogen in you
            back: About half the nitrogen in your body comes from synthetic fertiliser.
          - icon: 🥀
            front: Too much of a good thing
            back: "Too much fertiliser burns roots: the salt draws water out of them."

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many kilograms of nitrogen does one hectare of wheat need each year?"
    params:
      min: 0
      max: 1000
      unit: kg
    answer:
      value: 180
      tolerance: 60
    explanation: About 150 to 220 kg – roughly what a hectare of wheat stores as protein in its grains, plus losses.

  - kind: explain
    id: c1
    body: "Plants above all need three **major nutrients**: nitrogen (N), phosphorus (P) and potassium (K). That is why every bag of fertiliser carries an NPK label such as 15-15-15."

  - kind: problem
    id: c2
    widget: match
    prompt: What does the plant need the element for?
    params:
      pairs:
        - left: Nitrogen (N)
          right: protein and green leaves
        - left: Phosphorus (P)
          right: energy molecules and roots
        - left: Potassium (K)
          right: water balance
        - left: Magnesium (Mg)
          right: centre of chlorophyll
    hints:
      - Amino acids contain nitrogen.
      - ATP and DNA carry phosphate groups.
    explanation: If one nutrient is missing it limits all growth – however much of the others there is.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Urea CO(NH₂)₂ (60 g/mol) is the most used nitrogen fertiliser. What percentage of its mass is nitrogen (N = 14)? Round to whole percent.
    params:
      unit: "%"
    answer:
      value: 47
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 23) < 0.5
        misconception: atom-count
        text: Urea has two NH₂ groups – two N atoms.
    hints:
      - "Count the N atoms: two."
      - 28 ÷ 60 · 100.
    explanation: About 47% – more N than almost any other solid fertiliser.

  - kind: problem
    id: c4
    widget: choice
    prompt: Air is 78% nitrogen. Why can plants still not use it directly?
    params:
      options:
        - label: The triple bond in N₂ is too stable – only some bacteria can crack it
          correct: true
        - label: Nitrogen is poisonous
          feedback: We breathe it all the time.
        - label: It is too heavy for the leaves
          feedback: Gases get into leaves easily.
    hints:
      - N≡N is among the strongest bonds there is.
      - Beans and clover have helpers in their roots.
    explanation: Nodule bacteria on legumes fix N₂ with an enzyme. That is why a crop rotation with clover fertilises the soil.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A fertiliser is labelled NPK 15-15-15 – these are mass percentages. How many kg of nitrogen are in {{m}} kg of it?
    params:
      unit: kg
    answer:
      value: "{{0.15 * m}}"
      tolerance: 0.01
    hints:
      - 15% means 0.15 times.
      - Work out {{m}} · 0.15.
    explanation: "{{m}} · 0.15 = {{0.15 * m}} kg of N. The rest is P, K, oxygen and filler."
    difficulty: 2
    variants:
      params:
        m: step[10,100,10]
      defaults:
        m: 50

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: After heavy fertilising, nitrate reaches a lake. In summer the fish suddenly die. Why?
    params:
      options:
        - label: Algae run riot and die, and breaking them down uses up the oxygen in the water
          correct: true
        - label: Nitrate kills fish instantly
          feedback: The amount is usually too small for direct poisoning.
        - label: The water gets too warm
          feedback: Fertiliser does not change the temperature.
    hints:
      - Fertiliser makes algae grow too.
      - Bacteria need oxygen to break things down.
    explanation: This is called eutrophication. More fertiliser than the plants can take up harms lakes and groundwater.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Many farmers sow clover or peas between two years of grain. What does that do for the soil?
    params:
      options:
        - label: Their root bacteria fix nitrogen from the air – the soil gets fertilised
          correct: true
        - label: They pull phosphorus from the air
          feedback: There is no phosphorus in the air.
        - label: They make the soil more acidic
          feedback: The goal is nitrogen, not acid.
    hints:
      - Legumes live together with nodule bacteria.
      - These bacteria can split N₂.
    explanation: A pea crop can put over 100 kg of nitrogen per hectare into the soil – without any factory.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Phosphate fertiliser comes from rock such as Ca₃(PO₄)₂ (310 g/mol). What percentage of its mass is phosphorus (P = 31)? Round to whole percent.
    params:
      unit: "%"
    answer:
      value: 20
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 10) < 0.5
        misconception: atom-count
        text: The formula contains two phosphate groups – two P.
    hints:
      - "(PO₄)₂: two P atoms."
      - 62 ÷ 310 · 100.
    explanation: 20%. Phosphorus cannot be made from air like nitrogen – the deposits in rock are finite. That is why it is now also recovered from sewage sludge.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Fertilised soil gives off some nitrous oxide, N₂O. Why does that matter for the climate?
    params:
      options:
        - label: Per kilogram, N₂O is almost 300 times as strong as CO₂ and also damages the ozone layer
          correct: true
        - label: N₂O cools the Earth
          feedback: It is a greenhouse gas.
        - label: N₂O is harmless because there is little of it
          feedback: Precisely because it is so strong, even a little counts.
    hints:
      - N₂O has three atoms and can absorb infrared.
      - It stays in the air for over 100 years.
    explanation: Nitrous oxide is a large part of farming's climate impact. Precisely dosed fertiliser reduces it.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Ammonium fertiliser makes soils more acidic over time. Where does the acid come from?
    params:
      options:
        - label: Soil bacteria oxidise NH₄⁺ to nitrate – releasing H⁺ ions
          correct: true
        - label: Ammonium is a strong acid
          feedback: It is only a very weak acid.
        - label: The rain washes in lime
          feedback: Lime makes soils more basic.
    hints:
      - NH₄⁺ + 2 O₂ → NO₃⁻ + 2 H⁺ + H₂O.
      - Two H⁺ per ammonium.
    explanation: "That is why farmers lime their fields: lime neutralises the acid. Here redox and acid–base chemistry meet."
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why plants need fertiliser – and why too much of it does harm.
    params:
      keywords:
        - - stickstoff
          - nitrogen
          - phosphor
          - kalium
          - potassium
          - npk
        - - eiweiß
          - protein
          - wachs
          - grow
          - nährstoff
          - nutrient
        - - überdüng
          - algen
          - algae
          - grundwasser
          - groundwater
          - see
          - lake
          - sauerstoff
          - oxygen
          - nitrat
          - nitrate
      sample: Plants need nutrients such as nitrogen, phosphorus and potassium to build protein and grow. Whatever they do not take up ends up as nitrate in groundwater and lakes. There it makes algae run riot, and their breakdown uses up the oxygen.
    explanation: The right amount at the right time – otherwise you fertilise the lake instead of the field.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "x1"]
