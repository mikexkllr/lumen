id: chem.everyday.cooking
type: concept
title: "Kochen ist Chemie"
summary: "Eiweiß stockt, Zucker karamellisiert, Äpfel werden braun."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Ein rohes Ei ist flüssig, ein gekochtes fest. Was ist beim Kochen passiert?
    params:
      options:
        - label: Die Eiweiß-Moleküle haben sich entfaltet und verklumpt
          correct: true
        - label: Das Wasser ist verdampft
          feedback: Durch die Schale geht kaum Wasser verloren.
        - label: Das Ei ist gefroren
          feedback: Es wurde ja erhitzt.
    hints:
      - Wärme verändert die Form von Proteinen.
      - Die verklumpten Ketten halten Wasser fest.
    explanation: Das nennt man **Denaturierung**. Sie lässt sich nicht umkehren – ein gekochtes Ei wird nie wieder roh.

  - kind: problem
    id: c1
    widget: buckets
    prompt: "Was passiert in der Küche: nur Zustand oder echte Reaktion?"
    params:
      buckets:
        - id: b1
          label: nur Zustand
        - id: b2
          label: Reaktion
      items:
        - label: Butter schmilzt in der Pfanne
          bucket: b1
        - label: Nudelwasser kocht
          bucket: b1
        - label: Salz löst sich in der Suppe
          bucket: b1
        - label: Toast wird braun
          bucket: b2
        - label: Zucker wird zu Karamell
          bucket: b2
        - label: Ein Spiegelei stockt
          bucket: b2
    hints:
      - Entsteht ein neuer Stoff mit neuem Geschmack?
      - Geschmolzene Butter wird beim Abkühlen wieder fest.
    explanation: Zustandsänderungen lassen sich umkehren, Reaktionen meist nicht. Bräunen und Stocken erzeugen neue Stoffe.

  - kind: problem
    id: c2
    widget: choice
    prompt: Man gibt einen Löffel Salz ins Nudelwasser. Kocht es dann deutlich heißer?
    params:
      options:
        - label: Kaum – der Siedepunkt steigt nur um Bruchteile eines Grades
          correct: true
        - label: Ja, um etwa 10 °C
          feedback: Dafür bräuchte man extrem viel Salz.
        - label: Nein, es kocht kälter
          feedback: Gelöste Stoffe heben den Siedepunkt, nicht senken.
    hints:
      - 10 g Salz pro Liter sind nur etwa 0,17 mol.
      - Pro Mol Teilchen steigt der Siedepunkt um gut ein halbes Grad.
    explanation: Etwa 0,2 °C mehr. Das Salz ist für den Geschmack da, nicht für die Temperatur.

  - kind: problem
    id: c3
    widget: choice
    prompt: Beim Zwiebelschneiden tränen die Augen. Was steckt dahinter?
    params:
      options:
        - label: Beim Schneiden mischen sich Stoffe aus den Zellen, ein Enzym bildet ein reizendes Gas
          correct: true
        - label: Zwiebeln sind sauer wie Zitronen
          feedback: Säure wäre in der Luft nicht zu spüren.
        - label: Der Zwiebelsaft spritzt ins Auge
          feedback: Es tränt auch ohne Spritzer.
    hints:
      - In der heilen Zwiebel sind die Stoffe getrennt.
      - Das Gas löst sich in der Tränenflüssigkeit.
    explanation: "Das Gas enthält Schwefel. Gekühlte Zwiebeln und scharfe Messer helfen: Kälte bremst das Enzym, glatte Schnitte zerstören weniger Zellen."

  - kind: problem
    id: d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Ab wie viel Grad Celsius beginnt Haushaltszucker zu karamellisieren?"
    params:
      min: 50
      max: 300
      unit: °C
    answer:
      value: 165
      tolerance: 15
    explanation: Ab etwa 160 °C. Dabei zerfällt der Zucker und bildet Hunderte neue Stoffe – braun, bitter-süß und duftend.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: Bei der **Karamellisierung** spaltet Zucker in der Hitze Wasser ab und zerfällt. Aus den Bruchstücken entstehen Aromastoffe und braune Farbstoffe. Es braucht dafür nur Zucker und Hitze.

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Wie viel Energie braucht man, um {{m}} L Wasser von {{t}} °C auf 100 °C zu erhitzen? (4,2 kJ pro Liter und Grad)
    params:
      unit: kJ
    answer:
      value: "{{4.2 * m * (100 - t)}}"
      tolerance: 0.01
    hints:
      - "Temperaturunterschied: 100 − {{t}} = {{100 - t}} Grad."
      - Rechne 4,2 · {{m}} · {{100 - t}}.
    explanation: "{{4.2 * m * (100 - t)}} kJ. Ein Deckel auf dem Topf spart davon spürbar Energie."
    difficulty: 2
    variants:
      params:
        m: choice[0.5,1,2]
        t: choice[10,20]
      defaults:
        m: 1
        t: 20

  - kind: problem
    id: d4
    depth: 2
    widget: choice
    prompt: Ein angeschnittener Apfel wird braun – mit Zitronensaft nicht. Warum?
    params:
      options:
        - label: Die Säure bremst das Bräunungs-Enzym, und Vitamin C fängt den Sauerstoff ab
          correct: true
        - label: Zitronensaft färbt den Apfel gelb
          feedback: Er ist fast farblos.
        - label: Zitronensaft ist kalt
          feedback: Auch warmer Saft hilft.
    hints:
      - Ein Enzym oxidiert Stoffe im Apfel mit Luftsauerstoff.
      - Enzyme brauchen den richtigen pH.
    explanation: Ascorbinsäure (Vitamin C) wird lieber oxidiert als die Apfel-Stoffe – sie opfert sich wie Zink am Schiff.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei 63 °C gegarte Eier haben oft schon festes Eiweiß, aber noch fließendes Eigelb. Wie ist das möglich?
    params:
      options:
        - label: Verschiedene Proteine denaturieren bei verschiedenen Temperaturen
          correct: true
        - label: Das Eigelb ist besser isoliert
          feedback: Bei langer Garzeit hat das ganze Ei 63 °C.
        - label: Eigelb enthält kein Eiweiß
          feedback: Eigelb ist reich an Proteinen.
    hints:
      - Ein Protein im Eiklar wird schon um 62 °C fest.
      - Das Eigelb dickt erst ab etwa 65 °C ein.
    explanation: Wer die Temperatur genau einstellt, bestimmt die Konsistenz. Darauf beruht das Garen im Wasserbad (Sous-vide).
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Für Ceviche wird roher Fisch nur in Limettensaft eingelegt. Trotzdem wird er weiß und fest. Warum?
    params:
      options:
        - label: Auch Säure denaturiert Proteine – nicht nur Hitze
          correct: true
        - label: Der Saft ist heiß
          feedback: Er ist kühl.
        - label: Der Fisch trocknet aus
          feedback: Er liegt ja in Flüssigkeit.
    hints:
      - Säure ändert die Ladungen der Seitenketten.
      - Andere Ladungen, andere Faltung.
    explanation: Säure »gart« das Eiweiß chemisch. Keime tötet sie aber nicht so sicher wie Hitze – darum braucht es sehr frischen Fisch.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was beim Kochen eines Eis chemisch passiert.
    params:
      keywords:
        - - protein
          - eiweiß
        - - denatur
          - entfalt
          - unfold
        - - verklump
          - vernetz
          - fest
          - clump
          - solid
          - firm
      sample: Eiweiß besteht aus gefalteten Proteinen. Die Hitze bricht die Wasserstoffbrücken, die Proteine entfalten sich – sie denaturieren. Die offenen Ketten verklumpen miteinander, und das Ei wird fest.
    explanation: Entfalten und Verklumpen – eine Reaktion ohne Rückweg.
    difficulty: 3

srs:
  cards_from: ["c1", "d3", "x1"]
