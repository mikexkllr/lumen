id: chem.everyday.plastics
type: concept
title: "Kunststoffe und Recycling"
summary: "Recycling-Codes, Schwimm-Sink-Test und warum Plastik so lange bleibt."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Millionen Tonnen Kunststoff stellt die Welt pro Jahr her?"
    params:
      min: 1
      max: 10000
      scale: log
      unit: Mio. t
    answer:
      value: 400
      tolerance: 120
    explanation: Rund 400 Millionen Tonnen – etwa 50 kg pro Mensch. 1950 waren es nur 2 Millionen.

  - kind: explain
    id: c1
    body: "Ein **Thermoplast** besteht aus losen Ketten. Beim Erwärmen gleiten sie aneinander vorbei: Er wird weich und lässt sich neu formen. Darum kann man Flaschen und Becher einschmelzen und recyceln."

  - kind: problem
    id: c2
    widget: match
    prompt: Welcher Kunststoff steckt hinter dem Recycling-Code?
    params:
      pairs:
        - left: 1 – PET
          right: Getränkeflaschen
        - left: 2 – HDPE
          right: Shampooflaschen
        - left: 4 – LDPE
          right: Frischhaltefolie
        - left: 5 – PP
          right: Joghurtbecher
        - left: 6 – PS
          right: Styropor
    hints:
      - PET ist klar und fest.
      - LDPE ist weich und dehnbar.
    explanation: Die Zahl im Dreieck hilft beim Sortieren. Sie heißt nicht, dass das Teil auch wirklich recycelt wird.

  - kind: problem
    id: c3
    widget: buckets
    prompt: "Schwimm-Sink-Test in Wasser: Was schwimmt, was sinkt?"
    params:
      buckets:
        - id: b1
          label: schwimmt (leichter als Wasser)
        - id: b2
          label: sinkt (schwerer als Wasser)
      items:
        - label: PP, Dichte 0,9 g/cm³
          bucket: b1
        - label: PE, Dichte 0,95 g/cm³
          bucket: b1
        - label: PS, Dichte 1,05 g/cm³
          bucket: b2
        - label: PET, Dichte 1,38 g/cm³
          bucket: b2
        - label: PVC, Dichte 1,4 g/cm³
          bucket: b2
    hints:
      - Wasser hat 1,0 g/cm³.
      - Kleiner als 1 schwimmt.
    explanation: Sortieranlagen trennen Kunststoffe so in großen Becken – wie beim Trennen von Gemischen nach der Dichte.

  - kind: problem
    id: c4
    widget: choice
    prompt: Warum lässt sich ein Mix aus vielen Kunststoffen schlecht recyceln?
    params:
      options:
        - label: Die Sorten schmelzen bei verschiedenen Temperaturen und vertragen sich nicht – das Gemisch wird brüchig
          correct: true
        - label: Kunststoffe brennen beim Schmelzen
          feedback: Recyceln geschieht ohne Flamme.
        - label: Gemischter Kunststoff ist giftig
          feedback: Das Problem ist die Qualität.
    hints:
      - Polare und unpolare Ketten mischen sich schlecht.
      - Wie Öl und Wasser – nur fest.
    explanation: Sortenreines Material lässt sich gut wiederverwerten. Darum sind Mehrschicht-Verpackungen ein Problem.

  - kind: explain
    id: d1
    depth: 2
    body: Beim **chemischen Recycling** zerlegt man die Ketten wieder in kleine Moleküle – etwa PET mit Methanol in seine Bausteine. Daraus baut man neuen Kunststoff in Neuware-Qualität.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Der Baustein von PET hat die Formel C₁₀H₈O₄ (192 g/mol). Beim Verbrennen wird jedes C zu CO₂ (44 g/mol). Wie viel kg CO₂ entstehen aus 1 kg PET? Auf zwei Nachkommastellen.
    params:
      unit: kg
    answer:
      value: 2.29
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 0.23) < 0.01
        misconception: atom-count
        text: Ein Baustein hat zehn C-Atome – zehn CO₂.
    hints:
      - Ein Baustein ergibt 10 CO₂, also 440 g.
      - "Rechne 440 : 192."
    explanation: Etwa 2,29 kg CO₂ pro kg PET. Verbrennen gewinnt Wärme zurück, aber Recycling spart dieses CO₂.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Recyceltes Plastik wird oft zu Parkbänken statt wieder zu Flaschen. Warum?
    params:
      options:
        - label: Bei jedem Einschmelzen brechen Ketten – das Material wird schwächer
          correct: true
        - label: Bänke sind beliebter
          feedback: Es geht um die Materialqualität.
        - label: Flaschen dürfen nie recycelt werden
          feedback: PET-Flaschen werden oft wieder zu Flaschen.
    hints:
      - Hitze und Scherkräfte treffen die Ketten.
      - Kürzere Ketten haften schlechter aneinander.
    explanation: Das heißt Downcycling. Sauber gesammeltes PET aus dem Pfandsystem lässt sich dagegen gut wieder zu Flaschen machen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Eine PET-Kette hat {{192 * n}} g/mol. Ein Baustein wiegt 192 g/mol. Wie viele Bausteine hat die Kette?
    answer:
      value: "{{n}}"
    hints:
      - Teile die Kettenmasse durch die Bausteinmasse.
      - "Rechne {{192 * n}} : 192."
    explanation: "{{n}} Bausteine. Sinkt die Zahl beim Recyceln zu stark, wird die Flasche spröde."
    difficulty: 3
    variants:
      params:
        n: step[100,300,50]
      defaults:
        n: 200

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Mikroplastik zerfällt im Meer zu immer kleineren Teilchen – verschwindet aber nicht. Warum?
    params:
      options:
        - label: UV-Licht zerbricht die Teilchen, aber kaum ein Lebewesen kann die C–C-Ketten verdauen
          correct: true
        - label: Es ist schwerer als Wasser
          feedback: Viele Sorten schwimmen sogar.
        - label: Salz konserviert es
          feedback: Salz spielt dabei keine Rolle.
    hints:
      - Zum Abbau braucht es passende Enzyme.
      - Kunststoffe gibt es erst seit gut 100 Jahren.
    explanation: Die Evolution hatte kaum Zeit, Enzyme für Polyethylen zu entwickeln. Erste Bakterien, die PET spalten, wurden 2016 entdeckt.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Becher aus PLA gelten als »kompostierbar«. Was ist der Haken?
    params:
      options:
        - label: Sie zerfallen nur in Industrieanlagen bei rund 60 °C – im Garten oder Meer kaum
          correct: true
        - label: PLA ist aus Erdöl
          feedback: PLA wird meist aus Maisstärke gewonnen.
        - label: PLA ist giftig
          feedback: PLA ist für Lebensmittel zugelassen.
    hints:
      - Zum Abbau braucht die Esterbindung Wärme und Feuchte.
      - Ein Gartenkompost wird selten so heiß.
    explanation: Biobasiert heißt nicht automatisch biologisch abbaubar. Im Restmüll verbrennt PLA meist einfach.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man Kunststoffe nach Sorten trennen muss, bevor man sie recycelt.
    params:
      keywords:
        - - sorte
          - type
          - kind
          - pet
          - polyethylen
          - polyethylene
        - - schmelz
          - melt
          - temperatur
          - temperature
        - - mischen
          - misch
          - mix
          - vertrag
          - blend
          - qualität
          - quality
          - brüchig
          - brittle
      sample: Jede Kunststoffsorte hat eigene Ketten und schmilzt bei einer anderen Temperatur. Mischt man sie, vertragen sie sich nicht, und das Material wird brüchig. Sortenrein kann man es dagegen zu guter Qualität einschmelzen.
    explanation: Recycling ist Trennen von Gemischen – nur mit Kunststoffen.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
