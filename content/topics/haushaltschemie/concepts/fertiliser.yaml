id: chem.everyday.fertiliser
type: concept
title: "Dünger"
summary: "Stickstoff, Phosphor, Kalium – und was zu viel davon anrichtet."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele Kilogramm Stickstoff braucht ein Hektar Weizen pro Jahr?"
    params:
      min: 0
      max: 1000
      unit: kg
    answer:
      value: 180
      tolerance: 60
    explanation: Rund 150 bis 220 kg – etwa so viel, wie ein Hektar Weizen an Eiweiß in den Körnern speichert, plus Verluste.

  - kind: explain
    id: c1
    body: "Pflanzen brauchen vor allem drei **Hauptnährstoffe**: Stickstoff (N), Phosphor (P) und Kalium (K). Auf jedem Düngersack steht darum eine NPK-Angabe wie 15-15-15."

  - kind: problem
    id: c2
    widget: match
    prompt: Wofür braucht die Pflanze das Element?
    params:
      pairs:
        - left: Stickstoff (N)
          right: Eiweiß und Blattgrün
        - left: Phosphor (P)
          right: Energie-Moleküle und Wurzeln
        - left: Kalium (K)
          right: Wasserhaushalt
        - left: Magnesium (Mg)
          right: Mitte des Chlorophylls
    hints:
      - Aminosäuren enthalten Stickstoff.
      - ATP und DNA tragen Phosphatgruppen.
    explanation: Fehlt ein Nährstoff, begrenzt er das ganze Wachstum – egal, wie viel von den anderen da ist.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Harnstoff CO(NH₂)₂ (60 g/mol) ist der meistgenutzte Stickstoffdünger. Wie viel Prozent seiner Masse ist Stickstoff (N = 14)? Auf ganze Prozent.
    params:
      unit: "%"
    answer:
      value: 47
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 23) < 0.5
        misconception: atom-count
        text: Harnstoff enthält zwei NH₂-Gruppen – zwei N-Atome.
    hints:
      - "Zähle die N-Atome: zwei."
      - "28 : 60 · 100."
    explanation: Etwa 47 % – so viel N wie kaum ein anderer fester Dünger.

  - kind: problem
    id: c4
    widget: choice
    prompt: Die Luft besteht zu 78 % aus Stickstoff. Warum können Pflanzen ihn trotzdem nicht direkt nutzen?
    params:
      options:
        - label: Die Dreifachbindung in N₂ ist zu stabil – nur einige Bakterien können sie knacken
          correct: true
        - label: Stickstoff ist giftig
          feedback: Wir atmen ihn ständig ein.
        - label: Er ist zu schwer für die Blätter
          feedback: Gase gelangen leicht in die Blätter.
    hints:
      - N≡N gehört zu den stärksten Bindungen überhaupt.
      - Bohnen und Klee haben Helfer in den Wurzeln.
    explanation: Knöllchenbakterien an Hülsenfrüchten binden N₂ mit einem Enzym. Darum düngt eine Fruchtfolge mit Klee den Boden.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Dünger trägt die Angabe NPK 15-15-15 – das sind Massenprozente. Wie viel kg Stickstoff stecken in {{m}} kg davon?
    params:
      unit: kg
    answer:
      value: "{{0.15 * m}}"
      tolerance: 0.01
    hints:
      - 15 % heißt 0,15-mal.
      - Rechne {{m}} · 0,15.
    explanation: "{{m}} · 0,15 = {{0.15 * m}} kg N. Der Rest sind P, K, Sauerstoff und Füllstoffe."
    difficulty: 2
    variants:
      params:
        m: step[10,100,10]
      defaults:
        m: 50

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Nach starkem Düngen gelangt Nitrat in einen See. Im Sommer sterben dort plötzlich die Fische. Warum?
    params:
      options:
        - label: Algen wuchern, sterben ab, und ihr Abbau verbraucht den Sauerstoff im Wasser
          correct: true
        - label: Nitrat ist für Fische sofort tödlich
          feedback: Die Menge ist meist zu klein für eine direkte Vergiftung.
        - label: Das Wasser wird zu warm
          feedback: Der Dünger ändert die Temperatur nicht.
    hints:
      - Dünger lässt auch Algen wachsen.
      - Bakterien brauchen zum Abbau Sauerstoff.
    explanation: Das heißt Überdüngung oder Eutrophierung. Mehr Dünger als die Pflanze aufnimmt, schadet Gewässern und Grundwasser.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Viele Bauern säen zwischen zwei Getreidejahren Klee oder Erbsen. Was bringt das dem Boden?
    params:
      options:
        - label: Ihre Wurzel-Bakterien binden Stickstoff aus der Luft – der Boden wird gedüngt
          correct: true
        - label: Sie holen Phosphor aus der Luft
          feedback: Phosphor gibt es in der Luft nicht.
        - label: Sie machen den Boden saurer
          feedback: Ziel ist Stickstoff, nicht Säure.
    hints:
      - Hülsenfrüchte leben mit Knöllchenbakterien zusammen.
      - Diese Bakterien können N₂ spalten.
    explanation: Eine Erbsenkultur kann über 100 kg Stickstoff pro Hektar in den Boden bringen – ganz ohne Fabrik.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Phosphatdünger stammt aus Gestein wie Ca₃(PO₄)₂ (310 g/mol). Wie viel Prozent seiner Masse ist Phosphor (P = 31)? Auf ganze Prozent.
    params:
      unit: "%"
    answer:
      value: 20
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 10) < 0.5
        misconception: atom-count
        text: Die Formel enthält zwei Phosphat-Gruppen – zwei P.
    hints:
      - "(PO₄)₂: zwei P-Atome."
      - "62 : 310 · 100."
    explanation: 20 %. Phosphor lässt sich nicht aus Luft gewinnen wie Stickstoff – die Lager im Gestein sind endlich. Darum holt man ihn heute auch aus Klärschlamm zurück.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Aus gedüngtem Boden entweicht etwas Lachgas N₂O. Warum ist das fürs Klima wichtig?
    params:
      options:
        - label: N₂O wirkt pro Kilogramm fast 300-mal so stark wie CO₂ und schädigt auch die Ozonschicht
          correct: true
        - label: N₂O kühlt die Erde
          feedback: Es ist ein Treibhausgas.
        - label: N₂O ist harmlos, weil es wenig ist
          feedback: Gerade wegen seiner Stärke zählt schon wenig.
    hints:
      - N₂O hat drei Atome und kann Infrarot schlucken.
      - Es bleibt über 100 Jahre in der Luft.
    explanation: Lachgas aus der Landwirtschaft ist ein großer Teil ihrer Klimawirkung. Genau dosierter Dünger senkt es.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Ammonium-Dünger macht Böden mit der Zeit saurer. Woher kommt die Säure?
    params:
      options:
        - label: Bodenbakterien oxidieren NH₄⁺ zu Nitrat – dabei werden H⁺-Ionen frei
          correct: true
        - label: Ammonium ist eine starke Säure
          feedback: Es ist nur eine sehr schwache Säure.
        - label: Der Regen spült Kalk hinein
          feedback: Kalk macht Böden basischer.
    hints:
      - NH₄⁺ + 2 O₂ → NO₃⁻ + 2 H⁺ + H₂O.
      - Zwei H⁺ pro Ammonium.
    explanation: "Darum kalken Landwirte ihre Felder: Kalk neutralisiert die Säure. Hier treffen Redox und Säure-Base zusammen."
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Pflanzen Dünger brauchen – und warum zu viel davon schadet.
    params:
      keywords:
        - - stickstoff
          - nitrogen
          - phosphor
          - kalium
          - potassium
          - npk
        - - eiweiß
          - protein
          - wachs
          - grow
          - nährstoff
          - nutrient
        - - überdüng
          - algen
          - algae
          - grundwasser
          - groundwater
          - see
          - lake
          - sauerstoff
          - oxygen
          - nitrat
          - nitrate
      sample: Pflanzen brauchen Nährstoffe wie Stickstoff, Phosphor und Kalium, um Eiweiß zu bilden und zu wachsen. Was sie nicht aufnehmen, gelangt als Nitrat ins Grundwasser und in Seen. Dort lässt es Algen wuchern, die beim Abbau den Sauerstoff verbrauchen.
    explanation: Die richtige Menge zur richtigen Zeit – sonst düngt man den See statt das Feld.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "x1"]
