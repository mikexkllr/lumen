id: chem.everyday.plastics
type: concept
title: "Plastics and recycling"
summary: "Recycling codes, the float–sink test and why plastic lasts so long."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many million tonnes of plastic does the world make each year?"
    params:
      min: 1
      max: 10000
      scale: log
      unit: million t
    answer:
      value: 400
      tolerance: 120
    explanation: About 400 million tonnes – roughly 50 kg per person. In 1950 it was only 2 million.

  - kind: explain
    id: c1
    body: "A **thermoplastic** is made of loose chains. When heated they slide past one another: it softens and can be reshaped. That is why bottles and cups can be melted down and recycled."

  - kind: problem
    id: c2
    widget: match
    prompt: Which plastic is behind the recycling code?
    params:
      pairs:
        - left: 1 – PET
          right: drinks bottles
        - left: 2 – HDPE
          right: shampoo bottles
        - left: 4 – LDPE
          right: cling film
        - left: 5 – PP
          right: yoghurt pots
        - left: 6 – PS
          right: polystyrene foam
    hints:
      - PET is clear and stiff.
      - LDPE is soft and stretchy.
    explanation: The number in the triangle helps with sorting. It does not mean the item actually gets recycled.

  - kind: problem
    id: c3
    widget: buckets
    prompt: "Float–sink test in water: what floats, what sinks?"
    params:
      buckets:
        - id: b1
          label: floats (lighter than water)
        - id: b2
          label: sinks (heavier than water)
      items:
        - label: PP, density 0.9 g/cm³
          bucket: b1
        - label: PE, density 0.95 g/cm³
          bucket: b1
        - label: PS, density 1.05 g/cm³
          bucket: b2
        - label: PET, density 1.38 g/cm³
          bucket: b2
        - label: PVC, density 1.4 g/cm³
          bucket: b2
    hints:
      - Water is 1.0 g/cm³.
      - Less than 1 floats.
    explanation: Sorting plants separate plastics this way in big tanks – just like separating mixtures by density.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why is a mix of many plastics hard to recycle?
    params:
      options:
        - label: The types melt at different temperatures and do not blend – the mixture turns brittle
          correct: true
        - label: Plastics burn when melted
          feedback: Recycling is done without a flame.
        - label: Mixed plastic is poisonous
          feedback: The problem is quality.
    hints:
      - Polar and non-polar chains mix badly.
      - Like oil and water – only solid.
    explanation: Single-type material recycles well. That is why multi-layer packaging is a problem.

  - kind: explain
    id: d1
    depth: 2
    body: In **chemical recycling**, the chains are broken back down into small molecules – PET, for example, into its building blocks using methanol. These are made into new plastic as good as new.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: The building block of PET has the formula C₁₀H₈O₄ (192 g/mol). When burnt, each C becomes CO₂ (44 g/mol). How many kg of CO₂ form from 1 kg of PET? Give two decimal places.
    params:
      unit: kg
    answer:
      value: 2.29
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 0.23) < 0.01
        misconception: atom-count
        text: One unit has ten C atoms – ten CO₂.
    hints:
      - One unit gives 10 CO₂, that is 440 g.
      - Work out 440 ÷ 192.
    explanation: About 2.29 kg of CO₂ per kg of PET. Burning recovers heat, but recycling saves this CO₂.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Old plastic often ends up as park benches, not new bottles. Why?
    params:
      options:
        - label: Each time it is melted, chains break – the material gets weaker
          correct: true
        - label: Benches are more popular
          feedback: It is about material quality.
        - label: Bottles may never be recycled
          feedback: PET bottles are often turned back into bottles.
    hints:
      - Heat and shearing hit the chains.
      - Shorter chains hold together less well.
    explanation: This is called downcycling. Cleanly collected PET from deposit schemes, on the other hand, can be made back into bottles well.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A PET chain has {{192 * n}} g/mol. One unit weighs 192 g/mol. How many units does the chain have?
    answer:
      value: "{{n}}"
    hints:
      - Divide the chain mass by the unit mass.
      - Work out {{192 * n}} ÷ 192.
    explanation: "{{n}} units. If the number drops too far during recycling, the bottle becomes brittle."
    difficulty: 3
    variants:
      params:
        n: step[100,300,50]
      defaults:
        n: 200

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Microplastic breaks into ever smaller particles in the sea – but does not disappear. Why?
    params:
      options:
        - label: UV light breaks the particles, but hardly any organism can digest the C–C chains
          correct: true
        - label: It is heavier than water
          feedback: Many types actually float.
        - label: Salt preserves it
          feedback: Salt plays no part.
    hints:
      - Breaking it down needs suitable enzymes.
      - Plastics have only existed for about 100 years.
    explanation: Evolution has had little time to develop enzymes for polyethylene. The first bacteria that split PET were discovered in 2016.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: choice
    prompt: Cups made of PLA are called "compostable". What is the catch?
    params:
      options:
        - label: They only break down in industrial plants at about 60 °C – hardly at all in a garden or the sea
          correct: true
        - label: PLA is made from oil
          feedback: PLA is usually made from corn starch.
        - label: PLA is poisonous
          feedback: PLA is approved for food.
    hints:
      - Breaking the ester bond needs heat and moisture.
      - A garden compost rarely gets that hot.
    explanation: Bio-based does not automatically mean biodegradable. In general waste, PLA is usually just burnt.
    difficulty: 3

  - kind: problem
    id: x4
    depth: 3
    widget: teach
    prompt: Explain to Lux why plastics have to be sorted by type before they are recycled.
    params:
      keywords:
        - - sorte
          - type
          - kind
          - pet
          - polyethylen
          - polyethylene
        - - schmelz
          - melt
          - temperatur
          - temperature
        - - mischen
          - misch
          - mix
          - vertrag
          - blend
          - qualität
          - quality
          - brüchig
          - brittle
      sample: Each type of plastic has its own chains and melts at a different temperature. Mix them and they do not blend, and the material turns brittle. Sorted by type, it can be melted down into good quality.
    explanation: Recycling is separating mixtures – only with plastics.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
