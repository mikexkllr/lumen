id: chem.everyday.maillard
type: concept
title: "Die Maillard-Reaktion"
summary: "Warum Kruste, Kaffee und Brezeln so gut schmecken."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Gebratenes Fleisch schmeckt ganz anders als gekochtes. Woran liegt das vor allem?
    params:
      options:
        - label: In der Pfanne wird es über 140 °C heiß – im Wasser nie mehr als 100 °C
          correct: true
        - label: Das Öl bringt den Geschmack
          feedback: Auch ohne Öl gegrillt bräunt Fleisch.
        - label: Kochen wäscht Salz aus
          feedback: Auch gesalzen schmeckt gekochtes Fleisch anders.
    hints:
      - Wasser kann nicht heißer als 100 °C werden.
      - Die braune Kruste braucht hohe Hitze.
    explanation: Erst bei hoher Temperatur läuft die Maillard-Reaktion schnell genug. Sie erzeugt die Röstaromen.

  - kind: explain
    id: c1
    body: Bei der **Maillard-Reaktion** reagieren Zucker und Aminosäuren in der Hitze miteinander. Es entstehen Hunderte Aromastoffe und braune Farbstoffe – die Kruste von Brot und Braten.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Steckt die Maillard-Reaktion dahinter?
    params:
      buckets:
        - id: b1
          label: ja
        - id: b2
          label: nein
      items:
        - label: Brotkruste
          bucket: b1
        - label: Kruste auf dem Steak
          bucket: b1
        - label: geröstete Kaffeebohnen
          bucket: b1
        - label: dunkles Malz im Bier
          bucket: b1
        - label: gekochte Kartoffel
          bucket: b2
        - label: reiner Karamell
          bucket: b2
    hints:
      - Es braucht Zucker, Aminosäuren und über 120 °C.
      - Reiner Zucker hat keine Aminosäuren.
    explanation: Karamell bräunt durch Karamellisierung – ganz ohne Aminosäuren. Gekochte Kartoffeln bleiben unter 100 °C.

  - kind: problem
    id: c3
    widget: estimate
    prompt: "Schätz mal: Ab welcher Temperatur läuft die Maillard-Reaktion richtig schnell?"
    params:
      min: 50
      max: 300
      unit: °C
    answer:
      value: 150
      tolerance: 20
    explanation: Etwa zwischen 140 und 165 °C. Darüber verkohlt die Oberfläche bald und wird bitter.

  - kind: problem
    id: c4
    widget: choice
    prompt: Köche tupfen Fleisch vor dem Anbraten trocken. Warum?
    params:
      options:
        - label: Solange Wasser verdampft, bleibt die Oberfläche bei 100 °C – zu kühl für die Kruste
          correct: true
        - label: Wasser macht das Fleisch giftig
          feedback: Wasser ist harmlos.
        - label: Trockenes Fleisch ist leichter
          feedback: Das Gewicht spielt keine Rolle.
    hints:
      - Verdampfen schluckt viel Wärme.
      - Erst wenn das Wasser weg ist, steigt die Temperatur.
    explanation: Nasses Fleisch kocht in der Pfanne, statt zu braten. Aus demselben Grund brät man nicht zu viel auf einmal.

  - kind: problem
    id: d1
    depth: 2
    widget: order
    prompt: Ordne die Maillard-Reaktion grob in ihre Schritte.
    params:
      items:
        - label: Zucker und Aminosäure verbinden sich
        - label: Wasser wird abgespalten
        - label: Das Molekül lagert sich um
        - label: Es zerfällt in viele Aromastoffe
        - label: Braune Riesenmoleküle entstehen
    hints:
      - Am Anfang reagiert die Aminogruppe mit dem Zucker.
      - Die braune Farbe kommt ganz am Schluss.
    explanation: Die braunen Endprodukte heißen Melanoidine. Je nach Aminosäure riecht es nach Brot, Fleisch, Nuss oder Schokolade.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Laugenbrezeln werden vor dem Backen kurz in verdünnte Natronlauge getaucht. Warum werden sie so tiefbraun?
    params:
      options:
        - label: In basischer Umgebung läuft die Maillard-Reaktion viel schneller
          correct: true
        - label: Die Lauge ist braun
          feedback: Natronlauge ist farblos.
        - label: Die Lauge verbrennt den Teig
          feedback: Sie reagiert beim Backen ab und ist danach harmlos.
    hints:
      - Die Aminogruppe reagiert besser, wenn sie kein H⁺ trägt.
      - Im Sauren ist sie als –NH₃⁺ blockiert.
    explanation: Die Lauge reagiert beim Backen mit CO₂ zu harmlosem Natriumcarbonat. Ein Hauch Natron im Teig bräunt auch Zwiebeln schneller.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Im Brot wird nur die Kruste braun, das Innere bleibt hell. Warum?
    params:
      options:
        - label: Innen verdampft Wasser und hält es bei etwa 100 °C
          correct: true
        - label: Innen fehlt der Zucker
          feedback: Zucker ist überall im Teig.
        - label: Innen ist kein Sauerstoff
          feedback: Die Maillard-Reaktion braucht keinen Sauerstoff.
    hints:
      - Wo noch Wasser ist, wird es nicht heißer als 100 °C.
      - Die Oberfläche trocknet zuerst aus.
    explanation: Die trockene Kruste erreicht über 150 °C, die feuchte Krume nie. Darum hat Brot zwei so verschiedene Geschmäcker.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Beim starken Frittieren von Kartoffeln entsteht Acrylamid, ein möglicher Krebsstoff. Was gilt deshalb als Faustregel?
    params:
      options:
        - label: »Vergolden statt verkohlen« – nicht zu heiß und nicht zu dunkel braten
          correct: true
        - label: Gar nicht mehr braten
          feedback: Mäßiges Bräunen gilt als unbedenklich.
        - label: Mehr Salz verwenden
          feedback: Salz verhindert Acrylamid nicht.
    hints:
      - Acrylamid entsteht aus der Aminosäure Asparagin und Zucker.
      - Es wird vor allem über 170 °C viel.
    explanation: Acrylamid ist ein Nebenprodukt der Maillard-Reaktion. Frittieren bei höchstens 175 °C und goldene statt dunkelbraune Pommes senken es deutlich.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Ein Teig mit Honig bräunt schneller als einer mit gleich viel Haushaltszucker. Warum?
    params:
      options:
        - label: Honig enthält Glucose und Fructose mit freier reaktiver Gruppe, Saccharose nicht
          correct: true
        - label: Honig ist dunkler
          feedback: Die Farbe des Honigs macht die Kruste nicht braun.
        - label: Honig enthält Fett
          feedback: Honig ist fast fettfrei.
    hints:
      - Für Maillard braucht der Zucker eine offene Carbonylgruppe.
      - In Saccharose sind beide Zucker über genau diese Gruppen verbunden.
    explanation: Nur »reduzierende« Zucker reagieren direkt. Saccharose muss erst in Glucose und Fructose gespalten werden.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum eine Pfanne Röstaromen erzeugt, ein Kochtopf aber nicht.
    params:
      keywords:
        - - maillard
        - - zucker
          - aminosäure
          - sugar
          - amino acid
        - - "100"
          - temperatur
          - temperature
          - heiß
          - hot
          - wasser
          - water
      sample: Röstaromen entstehen bei der Maillard-Reaktion zwischen Zucker und Aminosäuren. Sie braucht über 140 °C. Im Kochtopf hält das Wasser alles bei 100 °C, in der trockenen Pfanne wird die Oberfläche viel heißer.
    explanation: Wasser ist ein Temperatur-Deckel bei 100 °C.
    difficulty: 3

srs:
  cards_from: ["c2", "d2", "x2"]
