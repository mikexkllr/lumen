id: sci.fluids.depth
type: concept
title: Druck unter Wasser
summary: Alle 10 Meter ein bar mehr.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel bar Druck herrschen am tiefsten Punkt der Meere, im Marianengraben (11 km)?"
    params:
      min: 1
      max: 5000
      unit: bar
    answer:
      value: 1100
      tolerance: 200
    explanation: Rund 1100 bar – als stünde ein Kleinwagen auf deinem Daumennagel.


  - kind: explain
    id: s1
    body: |
      Im Wasser steigt der Druck alle **10 Meter** um etwa **1 bar**. An der Oberfläche drückt schon die Luft mit rund 1 bar.

  - kind: problem
    id: tiefe
    widget: numeric
    prompt: Wie viel bar Druck herrschen in {{d}} m Wassertiefe insgesamt?
    params: { unit: bar }
    answer: { value: "{{1 + d / 10}}" }
    feedback:
      - when: "numval(state.input) == d / 10"
        misconception: forgot-air
        text: Die Luft über dem Wasser drückt auch – 1 bar kommt dazu.
    hints:
      - "Luft plus {{d}} : 10."
    explanation: "1 + {{d / 10}} = {{1 + d / 10}} bar."
    variants:
      params: { d: "choice[10,20,30,40,50]" }
      defaults: { d: 30 }

  - kind: problem
    id: ohren
    widget: choice
    prompt: Warum drückt es beim Tauchen in den Ohren?
    params:
      options:
        - { label: Außen drückt das Wasser stärker als innen die Luft., correct: true }
        - { label: Das Wasser ist kalt., feedback: "Auch in warmem Wasser drückt es." }
    hints:
      - Auf welcher Seite des Trommelfells ist der Druck größer?
    explanation: Beim Druckausgleich schiebt man Luft ins Mittelohr, bis innen und außen gleich sind.

  - kind: problem
    id: damm
    widget: choice
    prompt: Warum ist eine Staumauer unten viel dicker als oben?
    params:
      options:
        - { label: Unten ist der Wasserdruck am größten., correct: true }
        - { label: Damit sie schöner aussieht., feedback: "Es ist reine Physik – unten drückt am meisten Wasser." }
    hints:
      - Wo ist das meiste Wasser über einem Punkt?
    explanation: Der Druck wächst mit der Tiefe – die Mauer muss unten am stärksten sein.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Luftballon hat an der Oberfläche 6 Liter. Du nimmst ihn auf 20 m Tiefe mit. Wie viele Liter hat er dort?
    params:
      unit: l
    answer:
      value: 2
    hints:
      - In 20 m herrschen 3 bar – dreimal so viel wie oben.
    explanation: "Dreifacher Druck, ein Drittel Volumen: **Boyle-Mariotte**."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Drei Gefäße sind gleich hoch mit Wasser gefüllt: ein schmales Rohr, ein Eimer, ein breiter Trichter. Wo ist der Druck am Boden am größten?"
    params:
      options:
        - label: Überall gleich
          correct: true
        - label: Im Trichter – dort ist am meisten Wasser
          feedback: Der Druck hängt nur von der Tiefe ab, nicht von der Menge.
        - label: Im Rohr – dort ist es am engsten
          feedback: Die Form spielt keine Rolle.
    hints:
      - Wovon hing der Druck unter Wasser ab?
    explanation: "Das **hydrostatische Paradoxon**: p = ρ · g · h. Nur die Höhe zählt."
    difficulty: 3

srs:
  cards_from: [tiefe, damm]
