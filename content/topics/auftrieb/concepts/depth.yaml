id: sci.fluids.depth
type: concept
title: Druck unter Wasser
summary: Alle 10 Meter ein bar mehr.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Im Wasser steigt der Druck alle **10 Meter** um etwa **1 bar**. An der Oberfläche drückt schon die Luft mit rund 1 bar.

  - kind: problem
    id: tiefe
    widget: numeric
    prompt: Wie viel bar Druck herrschen in {{d}} m Wassertiefe insgesamt?
    params: { unit: bar }
    answer: { value: "{{1 + d / 10}}" }
    feedback:
      - when: "numval(state.input) == d / 10"
        misconception: forgot-air
        text: Die Luft über dem Wasser drückt auch – 1 bar kommt dazu.
    hints:
      - "Luft plus {{d}} : 10."
    explanation: "1 + {{d / 10}} = {{1 + d / 10}} bar."
    variants:
      params: { d: "choice[10,20,30,40,50]" }
      defaults: { d: 30 }

  - kind: problem
    id: ohren
    widget: choice
    prompt: Warum drückt es beim Tauchen in den Ohren?
    params:
      options:
        - { label: Außen drückt das Wasser stärker als innen die Luft., correct: true }
        - { label: Das Wasser ist kalt., feedback: "Auch in warmem Wasser drückt es." }
    hints:
      - Auf welcher Seite des Trommelfells ist der Druck größer?
    explanation: Beim Druckausgleich schiebt man Luft ins Mittelohr, bis innen und außen gleich sind.

  - kind: problem
    id: damm
    widget: choice
    prompt: Warum ist eine Staumauer unten viel dicker als oben?
    params:
      options:
        - { label: Unten ist der Wasserdruck am größten., correct: true }
        - { label: Damit sie schöner aussieht., feedback: "Es ist reine Physik – unten drückt am meisten Wasser." }
    hints:
      - Wo ist das meiste Wasser über einem Punkt?
    explanation: Der Druck wächst mit der Tiefe – die Mauer muss unten am stärksten sein.

srs:
  cards_from: [tiefe, damm]
