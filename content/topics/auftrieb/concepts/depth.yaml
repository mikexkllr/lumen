id: sci.fluids.depth
type: concept
title: Druck unter Wasser
summary: Alle 10 Meter ein bar mehr.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viel bar Druck herrschen am tiefsten Punkt der Meere, im Marianengraben (11 km)?"
    params:
      min: 1
      max: 5000
      unit: bar
    answer:
      value: 1100
      tolerance: 200
    explanation: Rund 1100 bar – als stünde ein Kleinwagen auf deinem Daumennagel.

  - kind: explain
    id: s1
    body: |
      Im Wasser steigt der Druck alle **10 Meter** um etwa **1 bar**. An der Oberfläche drückt schon die Luft mit rund 1 bar.

  - kind: problem
    id: tiefe
    widget: numeric
    prompt: Wie viel bar Druck herrschen in {{d}} m Wassertiefe insgesamt?
    params: { unit: bar }
    answer: { value: "{{1 + d / 10}}" }
    feedback:
      - when: "numval(state.input) == d / 10"
        misconception: forgot-air
        text: Die Luft über dem Wasser drückt auch – 1 bar kommt dazu.
    hints:
      - "Luft plus {{d}} : 10."
    explanation: "1 + {{d / 10}} = {{1 + d / 10}} bar."
    variants:
      params: { d: "choice[10,20,30,40,50]" }
      defaults: { d: 30 }

  - kind: problem
    id: ohren
    widget: choice
    prompt: Warum drückt es beim Tauchen in den Ohren?
    params:
      options:
        - { label: Außen drückt das Wasser stärker als innen die Luft., correct: true }
        - { label: Das Wasser ist kalt., feedback: "Auch in warmem Wasser drückt es." }
    hints:
      - Auf welcher Seite des Trommelfells ist der Druck größer?
    explanation: Beim Druckausgleich schiebt man Luft ins Mittelohr, bis innen und außen gleich sind.

  - kind: problem
    id: damm
    widget: choice
    prompt: Warum ist eine Staumauer unten viel dicker als oben?
    params:
      options:
        - { label: Unten ist der Wasserdruck am größten., correct: true }
        - { label: Damit sie schöner aussieht., feedback: "Es ist reine Physik – unten drückt am meisten Wasser." }
    hints:
      - Wo ist das meiste Wasser über einem Punkt?
    explanation: Der Druck wächst mit der Tiefe – die Mauer muss unten am stärksten sein.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Luftballon hat an der Oberfläche 6 Liter. Du nimmst ihn auf 20 m Tiefe mit. Wie viele Liter hat er dort?
    params:
      unit: l
    answer:
      value: 2
    hints:
      - In 20 m herrschen 3 bar – dreimal so viel wie oben.
    explanation: "Dreifacher Druck, ein Drittel Volumen: **Boyle-Mariotte**."
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Warum 1 bar pro 10 m? Über 1 m² stehen in 10 m Tiefe 10 m³ Wasser, also 10 000 kg. Ihr Gewicht von 100 000 N drückt auf 1 m². Das ist der **Schweredruck** $p = \rho g h$.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Quecksilber ist 13,6-mal so dicht wie Wasser. Wie hoch muss eine Quecksilbersäule sein, damit sie so stark drückt wie 10 m Wasser? In cm.
    params:
      unit: cm
    answer:
      value: 73.5
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 13600) < 50
        misconception: inverse-density
        text: "Dichter heißt **kürzer**: Für denselben Druck braucht man weniger Höhe."
    hints:
      - "Bei gleichem Druck gilt: Dichte mal Höhe bleibt gleich."
      - "1000 cm : 13,6 = ?"
    explanation: "1000 : 13,6 ≈ 73,5 cm. Torricelli baute 1643 so das erste Barometer: Die Luft hält eine etwa 76 cm hohe Quecksilbersäule."
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: choice
    prompt: Warum kann man mit einem langen Schnorchel nicht in 2 m Tiefe atmen?
    params:
      options:
        - label: Das Wasser drückt mit 0,2 bar extra auf die Brust – dagegen schaffen die Atemmuskeln es nicht.
          correct: true
        - label: Die Luft im Rohr wird zu dünn.
          feedback: Im Rohr ist normale Luft. Das Problem ist der Druck auf den Brustkorb.
        - label: Der Schnorchel läuft voll Wasser.
          feedback: Er ragt ja aus dem Wasser. Trotzdem klappt es nicht.
    hints:
      - Wie groß ist der Druck in 2 m Tiefe?
      - Die Luft in der Lunge hat nur den Druck an der Oberfläche.
    explanation: Außen 1,2 bar, in der Lunge nur 1 bar. 0,2 bar sind 2000 kg pro m² Brust. Darum atmen Taucher Luft mit dem Druck ihrer Tiefe.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Drei Gefäße sind gleich hoch mit Wasser gefüllt: ein schmales Rohr, ein Eimer, ein breiter Trichter. Wo ist der Druck am Boden am größten?"
    params:
      options:
        - label: Überall gleich
          correct: true
        - label: Im Trichter – dort ist am meisten Wasser
          feedback: Der Druck hängt nur von der Tiefe ab, nicht von der Menge.
        - label: Im Rohr – dort ist es am engsten
          feedback: Die Form spielt keine Rolle.
    hints:
      - Wovon hing der Druck unter Wasser ab?
    explanation: "Das **hydrostatische Paradoxon**: p = ρ · g · h. Nur die Höhe zählt."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein Taucher atmet in 30 m Tiefe aus der Flasche. Wievielmal so viel Luft – gemessen in Teilchen – verbraucht jeder Atemzug dort wie an der Oberfläche?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: forgot-air-pressure
        text: An der Oberfläche herrscht schon 1 bar. In 30 m sind es 4 bar, nicht 3.
    hints:
      - "Gesamtdruck in 30 m: 1 bar Luft plus 3 bar Wasser."
      - Gleiches Lungenvolumen bei vierfachem Druck heißt vierfache Luftmenge.
    explanation: Bei 4 bar steckt in jedem Atemzug viermal so viel Luft. Die Flasche ist dort also viermal so schnell leer.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Warum darf ein Gerätetaucher beim Auftauchen niemals die Luft anhalten?
    params:
      options:
        - label: Der Druck sinkt, die Luft in der Lunge dehnt sich aus und kann sie verletzen.
          correct: true
        - label: Er bekommt sonst zu wenig Sauerstoff.
          feedback: Das Problem ist nicht der Sauerstoff, sondern das wachsende Volumen.
        - label: Das Wasser drückt dann stärker.
          feedback: Beim Aufsteigen wird der Druck kleiner, nicht größer.
    hints:
      - Denk an den Luftballon, der in der Tiefe schrumpft.
      - Was passiert auf dem Rückweg nach oben?
    explanation: Nach Boyle gilt p · V = konstant. Von 2 bar auf 1 bar verdoppelt sich das Volumen. Angehaltene Luft würde die Lunge überdehnen.
    difficulty: 3

srs:
  cards_from: [tiefe, damm]
