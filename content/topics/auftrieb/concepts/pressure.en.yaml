id: sci.fluids.pressure
type: concept
title: Force per Area
summary: What pressure is.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: schnee
    widget: choice
    prompt: Why do you sink in less with snowshoes?
    params:
      options:
        - { label: Your weight spreads over a larger area., correct: true }
        - { label: You become lighter., feedback: "Your weight stays the same. Only the area changes." }
    hints:
      - What changes about the area under you?
    explanation: The same force on a larger area means less pressure.

  - kind: explain
    id: s2
    body: |
      **Pressure** is force divided by area. The same force on a small area presses much harder. That is why knives cut and needles pierce.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: A person presses with {{f}} N on {{a}} cm² of shoe sole. What is the pressure?
    params: { unit: N/cm² }
    answer: { value: "{{f / a}}" }
    hints:
      - Force divided by area.
    explanation: "{{f}} ÷ {{a}} = {{f / a}} N per cm²."
    variants:
      params: { f: "choice[600,800,1000]", a: "choice[200,400]" }
      defaults: { f: 800, a: 400 }

  - kind: problem
    id: wo
    widget: buckets
    prompt: High or low pressure on the ground?
    params:
      buckets: [{ label: high }, { label: low }]
      items:
        - { label: Stiletto heel, bucket: high }
        - { label: Tip of a thumbtack, bucket: high }
        - { label: Ski, bucket: low }
        - { label: Wide tractor tire, bucket: low }
    hints:
      - Small area, high pressure.
    explanation: A heel has a tiny area, so it presses harder than an elephant's foot.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Stiletto heel
          right: true
        - text: Skis on snow
          right: false
        - text: Knife edge
          right: true
        - text: Tank track
          right: false
      left: Low pressure
      right: High pressure

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An elephant (5000 kg) stands on four feet of 1000 cm² each. A woman (60 kg) balances on one heel of 1 cm². How many times larger is her pressure?
    answer:
      value: 48
    hints:
      - "Elephant: 5000 kg on 4000 cm². Woman: 60 kg on 1 cm²."
    explanation: 1.25 against 60 kg per cm² – the heel presses 48 times as hard.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Pressure arises in gases too. Push the piston in until the pressure reaches about 250 kPa.
    params:
      scene: gas
      controls:
        temperature:
          fixed: true
    answer:
      pressure:
        - 240
        - 260
    explanation: At 2 litres. The same particles in less space hit the wall more often.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Pressure is measured in pascals: 1 Pa = 1 N per m². A person weighing 600 N stands on 300 cm² of sole – that is 0.03 m². How many pascals is that?"
    params:
      unit: Pa
    answer:
      value: 20000
    feedback:
      - when: numval(state.input) == 2
        misconception: cm2-vs-m2
        text: That is N per cm². One m² has 10,000 cm².
    hints:
      - Pressure = force ÷ area – with the area in m².
      - 600 N ÷ 0.03 m² = ?
    explanation: 600 ÷ 0.03 = 20,000 Pa. The air presses with about 100,000 Pa – five times as hard as your feet.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: A balloon pops on a single needle. But you can press it onto a board with 1000 nails without it popping. Why?
    params:
      options:
        - label: The force is spread over 1000 points – the pressure per point is small.
          correct: true
        - label: The nails are blunter.
          feedback: They are the same points. It is the number that matters.
        - label: The balloon gets harder.
          feedback: The balloon stays the same. The area is the difference.
    hints:
      - Pressure = force ÷ area. What changes?
      - A thousand points have a thousand times the area.
    explanation: With the same force the pressure falls to a thousandth. That is how fakirs lie on beds of nails.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Hydraulics: a small piston (2 cm²) is pushed with 50 N. What force appears at the large piston (100 cm²)?"
    params:
      unit: N
    answer:
      value: 2500
    hints:
      - "The pressure is the same everywhere: 25 N per cm²."
    explanation: 25 · 100 = 2500 N. In return the large piston moves only one fiftieth as far.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Hydraulics saves force but not energy. The displaced **volume** is the same on both sides: $A_1 \\cdot s_1 = A_2 \\cdot s_2$. So the small piston has to be pushed much farther."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Small piston 2 cm², large piston 100 cm². The car on the large piston should rise 10 cm. How many centimetres must you push the small piston?
    params:
      unit: cm
    answer:
      value: 500
    feedback:
      - when: numval(state.input) == 0.2
        misconception: inverse-ratio
        text: "The other way round: the small piston moves **farther**, not less."
    hints:
      - "Volume stays the same: 100 cm² · 10 cm = 2 cm² · s."
      - s = 1000 ÷ 2.
    explanation: 1000 cm³ ÷ 2 cm² = 500 cm = 5 m. That is why a car jack needs many short strokes.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Where does the pressure a gas exerts on its container wall come from?
    params:
      options:
        - label: Countless particles keep bouncing off the wall.
          correct: true
        - label: The gas is heavy and pushes down.
          feedback: Gas presses equally in all directions, also against the ceiling.
        - label: The particles repel one another.
          feedback: In an ideal gas they hardly do. It is the collisions with the wall.
    hints:
      - Imagine ping-pong balls in a shaken box.
      - Every collision transfers momentum to the wall.
    explanation: Every impact gives the wall a tiny push. Billions per second add up to a steady force. Warmer means faster particles and more pressure.
    difficulty: 3

srs:
  cards_from: [schnee, rechnen]
