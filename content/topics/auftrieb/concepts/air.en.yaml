id: sci.fluids.air
type: concept
title: Air Lifts
summary: Balloons, air pressure, and wings.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: ballon
    widget: choice
    prompt: Why does a hot-air balloon rise?
    params:
      options:
        - { label: Warm air is less dense than cold air., correct: true }
        - { label: Warm air contains a light gas., feedback: "It is ordinary air, just warmer." }
    hints:
      - What happens to air when you heat it?
    explanation: Warm air expands. The balloon displaces heavier cold air and gets lift.

  - kind: explain
    id: s2
    body: |
      Air has weight too. A **column of air** presses on every square centimeter with about **1 kg**, or roughly **10 N**.

  - kind: problem
    id: hand
    widget: numeric
    prompt: With how many newtons does the air press on a palm of {{a}} cm²?
    params: { unit: N }
    answer: { value: "{{a * 10}}" }
    hints:
      - 10 N per cm².
    explanation: "{{a}} · 10 = {{a * 10}} N. We don't feel it, because the body pushes back just as hard."
    variants:
      params: { a: "choice[80,100,150]" }
      defaults: { a: 100 }

  - kind: problem
    id: fluegel
    widget: choice
    prompt: How does a wing keep an airplane in the air?
    params:
      options:
        - { label: "It deflects air downward, and the air pushes it up.", correct: true }
        - { label: The engine pushes upward., feedback: "The engine pushes forward. The wing creates the lift." }
        - { label: Air is lighter above the wing., feedback: "What matters is how the wing redirects the air." }
    hints:
      - What happens to the air behind a wing?
    explanation: A tilted wing deflects a lot of air downward. The reaction force lifts the wing.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order by air pressure – from highest to lowest.
    params:
      items:
        - label: At the sea
        - label: On the Zugspitze (3000 m)
        - label: On Mount Everest
        - label: Outside a plane (11 km)
    hints:
      - The higher, the less air lies above you.
    explanation: The pressure comes from the weight of the air above.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Air pressure halves about every 5500 m. Roughly what percent of ground pressure is there on Mount Everest (8800 m)?
    params:
      unit: "%"
    answer:
      value: 33
      tolerance: 3
    hints:
      - 8800 ÷ 5500 = 1.6 halvings. 0.5 to the 1.6 ≈ 0.33.
    explanation: About a third. That is why climbers often need oxygen bottles.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: 1 m³ of cold air weighs 1.2 kg, hot air (100 °C) only 0.95 kg. How many m³ of hot air does a balloon need to carry 500 kg?
    params:
      unit: m³
    answer:
      value: 2000
    feedback:
      - when: abs(numval(state.input) - 526) < 3
        misconception: not-difference
        text: "Only the **difference** lifts: 1.2 − 0.95 = 0.25 kg per m³."
    hints:
      - How many kilograms does each m³ carry?
      - 500 kg ÷ 0.25 kg per m³ = ?
    explanation: 500 ÷ 0.25 = 2000 m³. That is why hot-air balloons are so huge – a sphere over 15 m across.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Air pressure roughly halves every 5.5 km. At what height is only a quarter left? In km.
    params:
      unit: km
    answer:
      value: 11
    feedback:
      - when: abs(numval(state.input) - 22) < 0.1
        misconception: halvings
        text: A quarter is halved twice, not four times.
    hints:
      - How many halvings get you to a quarter?
      - Twice 5.5 km.
    explanation: "Two halvings: 11 km. That is where airliners fly. That is why the cabin needs to be pressurised."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A helium balloon rises. When does it stop rising?
    params:
      options:
        - label: When the surrounding air is so thin that it weighs as little as the balloon
          correct: true
        - label: Never – it flies into space
          feedback: Without air there is no buoyancy.
        - label: When the helium is used up
          feedback: Helium is not used up.
    hints:
      - Buoyancy is the weight of the **displaced** air.
    explanation: Archimedes holds in air too. Weather balloons usually burst first because they expand strongly up high.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "When air flows faster, its pressure drops. This is described by the **Bernoulli equation**: $p + \\frac{1}{2}\\rho v^2 = \\text{constant}$. It follows from energy conservation for flowing air."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: A storm at 30 m/s blows over a flat roof. The suction is ½ · ρ · v² with ρ = 1.2 kg/m³. With what force does it pull on 100 m² of roof – in kN?
    params:
      unit: kN
    answer:
      value: 54
    feedback:
      - when: abs(numval(state.input) - 108) < 1
        misconception: forgot-half
        text: Do not forget the ½.
      - when: abs(numval(state.input) - 1.8) < 0.1
        misconception: not-squared
        text: "The speed is squared: 30² = 900."
    hints:
      - "Suction: 0.5 · 1.2 · 900 Pa."
      - 540 Pa times 100 m² gives newtons.
    explanation: 540 Pa · 100 m² = 54,000 N = 54 kN – the weight of over 5 tonnes. That is why storms tear off roofs.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: estimate
    prompt: "Take a guess: with how many tonnes does the air press down on a 100 m² roof?"
    params:
      min: 1
      max: 10000
      scale: log
    answer:
      value: 1000
      within: 30
    explanation: 100,000 Pa · 100 m² = 10 million N, the weight of 1000 tonnes. The roof does not break because the air inside pushes up just as hard.
    difficulty: 3

srs:
  cards_from: [ballon, hand]
