id: sci.fluids.air
type: concept
title: Luft trägt
summary: Ballons, Luftdruck und Flügel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Das Gewicht der Luft
    body: Luft fühlt sich nach nichts an – doch ihre Teilchen prallen ständig gegen alles. Ändere Temperatur und Volumen im Kolben. Beobachte, wie der **Luftdruck** steigt und fällt.
    visual:
      widget: sim
      interactive: true
      params:
        scene: gas

  - kind: problem
    id: ballon
    widget: choice
    prompt: Warum steigt ein Heißluftballon?
    params:
      options:
        - { label: Warme Luft ist weniger dicht als kalte., correct: true }
        - { label: Warme Luft enthält ein leichtes Gas., feedback: "Es ist ganz normale Luft – nur wärmer." }
    hints:
      - Was passiert mit Luft, wenn man sie erwärmt?
    explanation: Warme Luft dehnt sich aus. Der Ballon verdrängt schwerere kalte Luft und bekommt Auftrieb.

  - kind: explain
    id: s2
    body: |
      Auch Luft hat Gewicht. Auf jeden Quadratzentimeter drückt eine **Luftsäule** von etwa **1 kg** – rund **10 N**.

  - kind: problem
    id: hand
    widget: numeric
    prompt: Mit wie viel Newton drückt die Luft auf eine Handfläche von {{a}} cm²?
    params: { unit: N }
    answer: { value: "{{a * 10}}" }
    hints:
      - 10 N pro cm².
    explanation: "{{a}} · 10 = {{a * 10}} N – wir merken es nicht, weil im Körper genauso viel dagegendrückt."
    variants:
      params: { a: "choice[80,100,150]" }
      defaults: { a: 100 }

  - kind: problem
    id: fluegel
    widget: choice
    prompt: Wie hält ein Flügel das Flugzeug in der Luft?
    params:
      options:
        - { label: Er lenkt Luft nach unten – die drückt ihn nach oben., correct: true }
        - { label: Der Motor schiebt nach oben., feedback: "Der Motor schiebt nach vorn. Den Auftrieb macht der Flügel." }
        - { label: Luft ist oben leichter., feedback: "Entscheidend ist, wie der Flügel die Luft umlenkt." }
    hints:
      - Was passiert mit der Luft hinter einem Flügel?
    explanation: Der schräg angeströmte Flügel lenkt viel Luft nach unten – als Gegenkraft hebt er sich.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Luftdruck – vom höchsten zum niedrigsten.
    params:
      items:
        - label: Am Meer
        - label: Auf der Zugspitze (3000 m)
        - label: Auf dem Mount Everest
        - label: Im Flugzeug außen (11 km)
    hints:
      - Je höher, desto weniger Luft liegt über dir.
    explanation: Der Druck kommt vom Gewicht der Luft darüber.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: Eine Chipstüte reist ins Gebirge. Oben ist der Luftdruck nur halb so groß. Zieh das Volumen auf, bis der Druck auf etwa 50 kPa fällt.
    params:
      scene: gas
      controls:
        temperature:
          fixed: true
    answer:
      pressure:
        - 49
        - 51
    hints:
      - "Halber Druck heißt: Die Luft in der Tüte braucht mehr Platz."
      - Verdopple das Volumen vom Start.
    explanation: "Bei 10 Litern: doppeltes Volumen, halber Druck. Darum bläht sich die Tüte auf dem Berg auf."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Luftdruck halbiert sich etwa alle 5500 m. Wie viel Prozent des Drucks am Boden herrscht auf dem Mount Everest (8800 m) ungefähr?
    params:
      unit: "%"
    answer:
      value: 33
      tolerance: 3
    hints:
      - "8800 : 5500 = 1,6 Halbierungen. 0,5 hoch 1,6 ≈ 0,33."
    explanation: Rund ein Drittel. Darum brauchen Bergsteiger oft Sauerstoffflaschen.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: 1 m³ kalte Luft wiegt 1,2 kg, heiße Luft (100 °C) nur 0,95 kg. Wie viele m³ heiße Luft braucht ein Ballon, um 500 kg zu tragen?
    params:
      unit: m³
    answer:
      value: 2000
    feedback:
      - when: abs(numval(state.input) - 526) < 3
        misconception: not-difference
        text: "Es trägt nur der **Unterschied**: 1,2 − 0,95 = 0,25 kg pro m³."
    hints:
      - Wie viel Kilogramm trägt jeder m³?
      - "500 kg : 0,25 kg pro m³ = ?"
    explanation: "500 : 0,25 = 2000 m³. Darum sind Heißluftballone so riesig – eine Kugel mit über 15 m Durchmesser."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Der Luftdruck halbiert sich etwa alle 5,5 km. In welcher Höhe ist nur noch ein Viertel übrig? In km.
    params:
      unit: km
    answer:
      value: 11
    feedback:
      - when: abs(numval(state.input) - 22) < 0.1
        misconception: halvings
        text: Ein Viertel ist zweimal halbiert, nicht viermal.
    hints:
      - Wie oft muss man halbieren, um auf ein Viertel zu kommen?
      - Zweimal 5,5 km.
    explanation: "Zwei Halbierungen: 11 km. Dort fliegen Verkehrsflugzeuge. Darum braucht die Kabine eine Druckanlage."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Heliumballon steigt. Wann hört er auf zu steigen?
    params:
      options:
        - label: Wenn die Luft um ihn so dünn ist, dass sie so wenig wiegt wie der Ballon
          correct: true
        - label: Nie – er fliegt ins All
          feedback: Ohne Luft gibt es keinen Auftrieb mehr.
        - label: Wenn das Helium verbraucht ist
          feedback: Helium wird nicht verbraucht.
    hints:
      - Auftrieb ist das Gewicht der **verdrängten** Luft.
    explanation: Archimedes gilt auch in Luft. Wetterballons platzen meist vorher, weil sie sich oben stark ausdehnen.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Strömt Luft schneller, sinkt ihr Druck. Das beschreibt die **Bernoulli-Gleichung**: $p + \\frac{1}{2}\\rho v^2 = \\text{konstant}$. Sie folgt aus der Energieerhaltung für strömende Luft."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Sturm mit 30 m/s über einem Flachdach. Der Unterdruck ist ½ · ρ · v² mit ρ = 1,2 kg/m³. Mit welcher Kraft zieht er an 100 m² Dach – in kN?
    params:
      unit: kN
    answer:
      value: 54
    feedback:
      - when: abs(numval(state.input) - 108) < 1
        misconception: forgot-half
        text: Das ½ nicht vergessen.
      - when: abs(numval(state.input) - 1.8) < 0.1
        misconception: not-squared
        text: "Das Tempo wird quadriert: 30² = 900."
    hints:
      - "Unterdruck: 0,5 · 1,2 · 900 Pa."
      - 540 Pa mal 100 m² ergibt Newton.
    explanation: 540 Pa · 100 m² = 54 000 N = 54 kN – das Gewicht von über 5 Tonnen. Darum deckt Sturm Dächer ab.
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: estimate
    prompt: "Schätz mal: Mit wie vielen Tonnen drückt die Luft von oben auf ein Dach von 100 m²?"
    params:
      min: 1
      max: 10000
      scale: log
    answer:
      value: 1000
      within: 30
    explanation: 100 000 Pa · 100 m² = 10 Millionen N, das Gewicht von 1000 Tonnen. Das Dach bricht nicht, weil die Luft im Haus genauso stark nach oben drückt.
    difficulty: 3

srs:
  cards_from: [ballon, hand]
