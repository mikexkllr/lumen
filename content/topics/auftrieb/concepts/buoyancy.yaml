id: sci.fluids.buoyancy
type: concept
title: Warum Schiffe schwimmen
summary: Das Prinzip des Archimedes.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Abtauchen und auftauchen
    body: "Ein U-Boot kann schwimmen, sinken und schweben – ohne seine Form zu ändern. Deck den Tauchgang Schritt für Schritt auf: Wie steuert es seinen **Auftrieb**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🚢
            front: An der Oberfläche
            back: Mit leeren Tanks liegt es oben wie ein Schiff.
          - icon: 🌊
            front: Abtauchen
            back: Klappen öffnen sich, Wasser strömt in die Tanks. Das Boot wird schwerer und sinkt.
          - icon: ⚖️
            front: Schweben
            back: Mit genau der richtigen Menge Wasser bleibt es in der Tiefe stehen.
          - icon: 🫧
            front: Auftauchen
            back: Pressluft drückt das Wasser aus den Tanks. Das Boot wird leichter und steigt.

  - kind: problem
    id: stahl
    widget: choice
    prompt: Warum schwimmt ein Schiff aus Stahl?
    params:
      options:
        - { label: "Es verdrängt so viel Wasser, wie es wiegt.", correct: true }
        - { label: Stahl ist leichter als Wasser., feedback: "Ein Stahlklotz geht unter. Es liegt an der Form." }
        - { label: Der Motor hält es oben., feedback: "Auch ein Schiff ohne Motor schwimmt." }
    hints:
      - Ein Schiff ist innen fast leer.
    explanation: Der hohle Rumpf verdrängt viel Wasser – das drückt das Schiff nach oben.

  - kind: explain
    id: s2
    body: |
      **Archimedes:** Ein Körper im Wasser wird mit der Gewichtskraft des verdrängten Wassers nach oben gedrückt. Ein Liter Wasser wiegt 1 kg.

  - kind: problem
    id: leichter
    widget: numeric
    prompt: Ein Stein verdrängt {{v}} Liter Wasser. Um wie viel Kilogramm wirkt er unter Wasser leichter?
    params: { unit: kg }
    answer: { value: "{{v}}" }
    hints:
      - Wie viel wiegt das verdrängte Wasser?
    explanation: "{{v}} Liter Wasser wiegen {{v}} kg – genau so stark drückt das Wasser nach oben."
    variants:
      params: { v: "int[2,9]" }
      defaults: { v: 3 }

  - kind: problem
    id: schwimmt
    widget: buckets
    prompt: Schwimmt es auf Wasser oder sinkt es?
    params:
      buckets: [{ label: schwimmt }, { label: sinkt }]
      items:
        - { label: Holz, bucket: schwimmt }
        - { label: Eis, bucket: schwimmt }
        - { label: Speiseöl, bucket: schwimmt }
        - { label: Eisenschraube, bucket: sinkt }
        - { label: Kieselstein, bucket: sinkt }
    hints:
      - Ist es leichter oder schwerer als dieselbe Menge Wasser?
    explanation: Alles, was pro Liter weniger wiegt als Wasser, schwimmt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Boot wiegt mit Ladung 800 kg. Wie viele Liter Wasser muss es verdrängen, um zu schwimmen?
    params:
      unit: l
    answer:
      value: 800
    hints:
      - Ein Liter Wasser wiegt 1 kg.
    explanation: 800 Liter. Beim Schwimmen ist das verdrängte Wasser genau so schwer wie der Körper.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "**Auftrieb** entsteht, weil der Wasserdruck unten größer ist als oben. Der Unterschied zwischen Unter- und Oberseite drückt den Körper hoch. Er ist genau so groß wie das Gewicht des verdrängten Wassers."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Ein Stein hat {{m}} kg und {{v}} Liter Volumen. Er hängt ganz unter Wasser an einer Federwaage. Was zeigt sie in kg?
    params:
      unit: kg
    answer:
      value: "{{m - v}}"
    feedback:
      - when: numval(state.input) == m + v
        misconception: buoyancy-sign
        text: Der Auftrieb zeigt nach **oben**. Er macht den Stein leichter, nicht schwerer.
    hints:
      - Wie viel Wasser verdrängt der Stein?
      - "{{v}} L Wasser wiegen {{v}} kg – so viel wird er leichter."
    explanation: "{{m}} − {{v}} = {{m - v}} kg. So bestimmte Archimedes Volumen – und damit die Dichte."
    difficulty: 2
    variants:
      params:
        m: int[3,9]
        v: int[1,2]
      defaults:
        m: 5
        v: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: choice
    prompt: Ein Schiff fährt vom Fluss ins Meer. Salzwasser ist etwas dichter. Was passiert?
    params:
      options:
        - label: Es liegt etwas höher im Wasser.
          correct: true
        - label: Es sinkt tiefer ein.
          feedback: Dichteres Wasser trägt besser. Für dasselbe Gewicht reicht weniger Volumen.
        - label: Nichts ändert sich.
          feedback: Es kommt auf das Gewicht des verdrängten Wassers an – und Salzwasser ist schwerer.
    hints:
      - Das Schiff muss sein Gewicht an Wasser verdrängen.
      - Ein Liter Salzwasser wiegt mehr als ein Liter Süßwasser.
    explanation: Im Meer reicht weniger verdrängtes Volumen. Schiffe tragen darum Lademarken für Süß- und Salzwasser. Im Toten Meer kann man sogar lesend auf dem Rücken liegen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Boot mit einem Stein an Bord schwimmt in einem Pool. Du wirfst den Stein ins Wasser. Was macht der Wasserspiegel?
    params:
      options:
        - label: Er sinkt
          correct: true
        - label: Er steigt
          feedback: Im Boot verdrängte der Stein sein **Gewicht** an Wasser, versunken nur noch sein Volumen.
        - label: Er bleibt gleich
          feedback: Der Stein ist dichter als Wasser – das macht den Unterschied.
    hints:
      - Wie viel Wasser verdrängt der Stein im Boot – und wie viel am Grund?
    explanation: Ein Stein mit Dichte 3 verdrängt im Boot dreimal so viel Wasser wie am Grund.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Ein U-Boot hat 1000 m³ Volumen. Meerwasser hat 1,03 Tonnen pro m³. Wie viele Tonnen muss das Boot wiegen, um im Wasser zu schweben?
    params:
      unit: t
    answer:
      value: 1030
    hints:
      - "Schweben heißt: Auftrieb = Gewicht."
      - "Gewicht des verdrängten Wassers: 1000 · 1,03 t."
    explanation: "Genau 1030 t. Mit Tanks, die es flutet oder leer bläst, stellt es sein Gewicht fein ein: schwerer sinkt es, leichter steigt es."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Schiff aus Stahl schwimmt, ein Stahlklotz aber sinkt.
    params:
      keywords:
        - - verdräng
          - displac
          - wasser
          - water
        - - gewicht
          - weight
          - schwer
          - heavy
          - masse
          - mass
        - - hohl
          - hollow
          - luft
          - air
          - volumen
          - volume
          - form
          - shape
      sample: Der Auftrieb ist so groß wie das Gewicht des verdrängten Wassers. Der Klotz verdrängt wenig Wasser und sinkt. Das hohle Schiff ist voller Luft und verdrängt so viel Wasser, wie es selbst wiegt.
    difficulty: 3

srs:
  cards_from: [stahl, leichter]
