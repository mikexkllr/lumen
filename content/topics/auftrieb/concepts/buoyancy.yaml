id: sci.fluids.buoyancy
type: concept
title: Warum Schiffe schwimmen
summary: Das Prinzip des Archimedes.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: stahl
    widget: choice
    prompt: Warum schwimmt ein Schiff aus Stahl?
    params:
      options:
        - { label: "Es verdrängt so viel Wasser, wie es wiegt.", correct: true }
        - { label: Stahl ist leichter als Wasser., feedback: "Ein Stahlklotz geht unter. Es liegt an der Form." }
        - { label: Der Motor hält es oben., feedback: "Auch ein Schiff ohne Motor schwimmt." }
    hints:
      - Ein Schiff ist innen fast leer.
    explanation: Der hohle Rumpf verdrängt viel Wasser – das drückt das Schiff nach oben.

  - kind: explain
    id: s2
    body: |
      **Archimedes:** Ein Körper im Wasser wird mit der Gewichtskraft des verdrängten Wassers nach oben gedrückt. Ein Liter Wasser wiegt 1 kg.

  - kind: problem
    id: leichter
    widget: numeric
    prompt: Ein Stein verdrängt {{v}} Liter Wasser. Um wie viel Kilogramm wirkt er unter Wasser leichter?
    params: { unit: kg }
    answer: { value: "{{v}}" }
    hints:
      - Wie viel wiegt das verdrängte Wasser?
    explanation: "{{v}} Liter Wasser wiegen {{v}} kg – genau so stark drückt das Wasser nach oben."
    variants:
      params: { v: "int[2,9]" }
      defaults: { v: 3 }

  - kind: problem
    id: schwimmt
    widget: buckets
    prompt: Schwimmt es auf Wasser oder sinkt es?
    params:
      buckets: [{ label: schwimmt }, { label: sinkt }]
      items:
        - { label: Holz, bucket: schwimmt }
        - { label: Eis, bucket: schwimmt }
        - { label: Speiseöl, bucket: schwimmt }
        - { label: Eisenschraube, bucket: sinkt }
        - { label: Kieselstein, bucket: sinkt }
    hints:
      - Ist es leichter oder schwerer als dieselbe Menge Wasser?
    explanation: Alles, was pro Liter weniger wiegt als Wasser, schwimmt.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Boot wiegt mit Ladung 800 kg. Wie viele Liter Wasser muss es verdrängen, um zu schwimmen?
    params:
      unit: l
    answer:
      value: 800
    hints:
      - Ein Liter Wasser wiegt 1 kg.
    explanation: 800 Liter. Beim Schwimmen ist das verdrängte Wasser genau so schwer wie der Körper.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Boot mit einem Stein an Bord schwimmt in einem Pool. Du wirfst den Stein ins Wasser. Was macht der Wasserspiegel?
    params:
      options:
        - label: Er sinkt
          correct: true
        - label: Er steigt
          feedback: Im Boot verdrängte der Stein sein **Gewicht** an Wasser, versunken nur noch sein Volumen.
        - label: Er bleibt gleich
          feedback: Der Stein ist dichter als Wasser – das macht den Unterschied.
    hints:
      - Wie viel Wasser verdrängt der Stein im Boot – und wie viel am Grund?
    explanation: Ein Stein mit Dichte 3 verdrängt im Boot dreimal so viel Wasser wie am Grund.
    difficulty: 3

srs:
  cards_from: [stahl, leichter]
