id: sci.fluids.density
type: concept
title: Dichte
summary: Wie schwer ein Liter ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Kork gegen Gold
    body: "Ein Liter Kork wiegt fast nichts, ein Liter Gold so viel wie ein kleines Kind. Zieh die **Dichte** hoch: Die Linie zeigt, wie schwer 1 bis 5 Liter eines Stoffes sind."
    visual:
      widget: slider
      interactive: true
      params:
        expr: d*x
        x:
          - 0
          - 5
        y:
          - 0
          - 100
        sliders:
          - id: d
            label: Dichte (kg/L)
            min: 0.5
            max: 19.5
            step: 0.5
            initial: 1

  - kind: problem
    id: hook
    widget: choice
    prompt: "Was ist schwerer: ein Liter Wasser oder ein Liter Öl?"
    params:
      options:
        - label: Das Wasser
          correct: true
        - label: Das Öl
          feedback: Öl schwimmt auf Wasser.
        - label: Beide gleich
          feedback: Gleiches Volumen heißt nicht gleiches Gewicht.
    hints:
      - Was schwimmt in der Salatsoße oben?
    explanation: Öl ist pro Liter leichter. Darum schwimmt es oben.

  - kind: explain
    id: s1
    body: |
      **Dichte** ist Masse geteilt durch Volumen. Wasser hat etwa 1 kg pro Liter. Was eine kleinere Dichte hat, schwimmt.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Ein Klotz hat {{v}} Liter Volumen und wiegt {{m}} kg. Wie groß ist seine Dichte?
    params: { unit: kg/L }
    answer: { value: "{{d}}" }
    hints:
      - Masse geteilt durch Volumen.
    explanation: "{{m}} : {{v}} = {{d}} kg pro Liter."
    variants:
      params: { v: "choice[2,4,8]", d: "choice[0.25,0.5,2,3]" }
      derive: { m: "v * d" }
      defaults: { v: 4, d: 0.5 }

  - kind: problem
    id: eisberg
    widget: choice
    prompt: Eis hat die Dichte 0,9 kg/L. Wie viel eines Eisbergs liegt unter Wasser?
    params:
      options:
        - { label: Etwa 90 %, correct: true }
        - { label: Etwa die Hälfte, feedback: "Eis ist nur ein bisschen leichter als Wasser." }
        - { label: Etwa 10 %, feedback: "Andersherum – 10 % schauen heraus." }
    hints:
      - Eis ist fast so dicht wie Wasser.
    explanation: Der Anteil unter Wasser entspricht dem Dichteverhältnis 0,9.

  - kind: problem
    id: meter
    widget: numeric
    prompt: Ein Eisberg ist insgesamt {{h}} m hoch. Wie viele Meter davon liegen ungefähr unter Wasser?
    params: { unit: m }
    answer: { value: "{{h * 9 / 10}}" }
    hints:
      - "90 % von {{h}}."
    explanation: "Etwa {{h * 9 / 10}} m – nur die Spitze ist zu sehen."
    variants:
      params: { h: "choice[50,100,200,300]" }
      defaults: { h: 200 }

  - kind: problem
    id: c1
    widget: order
    prompt: Ordne nach der Dichte, das Leichteste zuerst.
    params:
      items:
        - label: Luft
        - label: Holz
        - label: Wasser
        - label: Eisen
        - label: Gold
    hints:
      - Was schwimmt, steht vor dem Wasser.
    explanation: Luft 0,0012 – Holz 0,6 – Wasser 1 – Eisen 7,9 – Gold 19,3 kg pro Liter.

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Ein Holzklotz hat 4 Liter Volumen und wiegt 3 kg. Stelle seine Dichte so ein, dass die Linie durch den Punkt geht. Schwimmt er?
    params:
      expr: d*x
      x:
        - 0
        - 5
      y:
        - 0
        - 6
      showCoordinates: false
      sliders:
        - id: d
          label: Dichte (kg/L)
          min: 0.25
          max: 1.5
          step: 0.25
          initial: 1.5
      markers:
        - x: 4
          y: 3
          label: 4 L, 3 kg
    answer:
      values:
        d: 0.75
    hints:
      - "Dichte = Masse : Volumen."
      - "Rechne 3 kg : 4 L."
    explanation: "3 kg : 4 L = 0,75 kg/L. Das ist weniger als Wasser mit 1 kg/L – der Klotz schwimmt."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Krone wiegt 1,5 kg und verdrängt 0,1 Liter Wasser. Reines Gold hat 19,3 kg/L. Welche Dichte hat die Krone?
    params:
      unit: kg/L
    answer:
      value: 15
    hints:
      - Masse durch Volumen.
    explanation: 15 kg/L – kein reines Gold. So entlarvte Archimedes einen Betrüger.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Wie viele Kilogramm wiegt die Luft in einem Zimmer von 4 m × 5 m × 2,5 m?"
    params:
      min: 0
      max: 200
    answer:
      value: 60
      tolerance: 15
    explanation: 50 m³ Luft mit 1,2 kg pro m³ wiegen 60 kg – so viel wie ein Mensch. Wir merken es nicht, weil die Luft von allen Seiten drückt.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Du sägst einen großen Holzklotz in zwei ungleiche Stücke. Welches hat die größere Dichte?
    params:
      options:
        - label: Beide gleich.
          correct: true
        - label: Das große Stück.
          feedback: Es ist schwerer, aber auch größer. Masse durch Volumen bleibt gleich.
        - label: Das kleine Stück.
          feedback: Kleiner heißt nicht dichter – es ist derselbe Stoff.
    hints:
      - "Dichte = Masse : Volumen."
      - Was passiert mit beiden Größen beim Zersägen?
    explanation: Dichte ist eine Eigenschaft des Stoffes, nicht der Größe. Darum schwimmt ein Holzspan genauso wie ein Baumstamm.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist es so wichtig, dass Eis **leichter** ist als Wasser?
    params:
      options:
        - label: Seen frieren von oben zu – darunter können Fische überleben
          correct: true
        - label: Damit Eiswürfel im Glas schön aussehen
          feedback: Es geht um das Leben in Gewässern.
        - label: Es ist nicht wichtig
          feedback: Sänke Eis, würden Seen vom Grund her durchfrieren.
    hints:
      - Was wäre, wenn Eis auf den Grund sänke?
    explanation: Wasser ist bei 4 °C am dichtesten – eine seltene **Anomalie**. Fast alle anderen Stoffe sind fest dichter als flüssig.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Die Krone von eben hat 15 kg/L. Sie besteht aus Gold (19,3 kg/L) und Silber (10,5 kg/L). Welchen Anteil ihres Volumens macht das Gold aus – in Prozent?
    params:
      unit: "%"
    answer:
      value: 51
      tolerance: 1
    hints:
      - "Mit Gold-Anteil x gilt: 19,3 · x + 10,5 · (1 − x) = 15."
      - 8,8 · x = 4,5.
    explanation: "x = 4,5 : 8,8 ≈ 0,51. Nur gut die Hälfte des Volumens ist Gold. Der Goldschmied hatte also kräftig gemogelt."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Wasser ist bei 4 °C am dichtesten. Welche Temperatur hat ein tiefer See im Winter ganz unten?
    params:
      options:
        - label: Etwa 4 °C
          correct: true
        - label: 0 °C
          feedback: 0 °C kaltes Wasser ist leichter und bleibt oben, dort friert es.
        - label: So kalt wie die Luft
          feedback: Das Eis oben dämmt, und das dichteste Wasser sinkt nach unten.
    hints:
      - Das dichteste Wasser sinkt nach unten.
      - Welche Temperatur hat das dichteste Wasser?
    explanation: Das 4 °C warme Wasser sammelt sich am Grund. Fische überwintern dort. Fast jeder andere Stoff ist fest dichter als flüssig – Wasser ist eine Ausnahme.
    difficulty: 3

srs:
  cards_from: [rechnen, eisberg]
