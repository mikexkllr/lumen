id: sci.fluids.density
type: concept
title: Dichte
summary: Wie schwer ein Liter ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Was ist schwerer: ein Liter Wasser oder ein Liter Öl?"
    params:
      options:
        - label: Das Wasser
          correct: true
        - label: Das Öl
          feedback: Öl schwimmt auf Wasser.
        - label: Beide gleich
          feedback: Gleiches Volumen heißt nicht gleiches Gewicht.
    hints:
      - Was schwimmt in der Salatsoße oben?
    explanation: Öl ist pro Liter leichter. Darum schwimmt es oben.


  - kind: explain
    id: s1
    body: |
      **Dichte** ist Masse geteilt durch Volumen. Wasser hat etwa 1 kg pro Liter. Was eine kleinere Dichte hat, schwimmt.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Ein Klotz hat {{v}} Liter Volumen und wiegt {{m}} kg. Wie groß ist seine Dichte?
    params: { unit: kg/L }
    answer: { value: "{{d}}" }
    hints:
      - Masse geteilt durch Volumen.
    explanation: "{{m}} : {{v}} = {{d}} kg pro Liter."
    variants:
      params: { v: "choice[2,4,8]", d: "choice[0.25,0.5,2,3]" }
      derive: { m: "v * d" }
      defaults: { v: 4, d: 0.5 }

  - kind: problem
    id: eisberg
    widget: choice
    prompt: Eis hat die Dichte 0,9 kg/L. Wie viel eines Eisbergs liegt unter Wasser?
    params:
      options:
        - { label: Etwa 90 %, correct: true }
        - { label: Etwa die Hälfte, feedback: "Eis ist nur ein bisschen leichter als Wasser." }
        - { label: Etwa 10 %, feedback: "Andersherum – 10 % schauen heraus." }
    hints:
      - Eis ist fast so dicht wie Wasser.
    explanation: Der Anteil unter Wasser entspricht dem Dichteverhältnis 0,9.

  - kind: problem
    id: meter
    widget: numeric
    prompt: Ein Eisberg ist insgesamt {{h}} m hoch. Wie viele Meter davon liegen ungefähr unter Wasser?
    params: { unit: m }
    answer: { value: "{{h * 9 / 10}}" }
    hints:
      - "90 % von {{h}}."
    explanation: "Etwa {{h * 9 / 10}} m – nur die Spitze ist zu sehen."
    variants:
      params: { h: "choice[50,100,200,300]" }
      defaults: { h: 200 }

  - kind: problem
    id: c1
    widget: order
    prompt: Ordne nach der Dichte, das Leichteste zuerst.
    params:
      items:
        - label: Luft
        - label: Holz
        - label: Wasser
        - label: Eisen
        - label: Gold
    hints:
      - Was schwimmt, steht vor dem Wasser.
    explanation: Luft 0,0012 – Holz 0,6 – Wasser 1 – Eisen 7,9 – Gold 19,3 kg pro Liter.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine Krone wiegt 1,5 kg und verdrängt 0,1 Liter Wasser. Reines Gold hat 19,3 kg/L. Welche Dichte hat die Krone?
    params:
      unit: kg/L
    answer:
      value: 15
    hints:
      - Masse durch Volumen.
    explanation: 15 kg/L – kein reines Gold. So entlarvte Archimedes einen Betrüger.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum ist es so wichtig, dass Eis **leichter** ist als Wasser?
    params:
      options:
        - label: Seen frieren von oben zu – darunter können Fische überleben
          correct: true
        - label: Damit Eiswürfel im Glas schön aussehen
          feedback: Es geht um das Leben in Gewässern.
        - label: Es ist nicht wichtig
          feedback: Sänke Eis, würden Seen vom Grund her durchfrieren.
    hints:
      - Was wäre, wenn Eis auf den Grund sänke?
    explanation: Wasser ist bei 4 °C am dichtesten – eine seltene **Anomalie**. Fast alle anderen Stoffe sind fest dichter als flüssig.
    difficulty: 3

srs:
  cards_from: [rechnen, eisberg]
