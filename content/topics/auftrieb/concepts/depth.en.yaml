id: sci.fluids.depth
type: concept
title: Pressure Underwater
summary: One more bar every 10 meters.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many bar of pressure are there at the deepest point of the oceans, the Mariana Trench (11 km)?"
    params:
      min: 1
      max: 5000
      unit: bar
    answer:
      value: 1100
      tolerance: 200
    explanation: About 1100 bar – like a small car standing on your thumbnail.


  - kind: explain
    id: s1
    body: |
      In water, pressure rises by about **1 bar** every **10 meters**. At the surface, the air already presses with about 1 bar.

  - kind: problem
    id: tiefe
    widget: numeric
    prompt: What is the total pressure in bar at a water depth of {{d}} m?
    params: { unit: bar }
    answer: { value: "{{1 + d / 10}}" }
    feedback:
      - when: "numval(state.input) == d / 10"
        misconception: forgot-air
        text: The air above the water presses too. Add 1 bar.
    hints:
      - "Air plus {{d}} ÷ 10."
    explanation: "1 + {{d / 10}} = {{1 + d / 10}} bar."
    variants:
      params: { d: "choice[10,20,30,40,50]" }
      defaults: { d: 30 }

  - kind: problem
    id: ohren
    widget: choice
    prompt: Why do your ears hurt when you dive?
    params:
      options:
        - { label: The water presses harder outside than the air does inside., correct: true }
        - { label: The water is cold., feedback: "It hurts in warm water too." }
    hints:
      - On which side of the eardrum is the pressure higher?
    explanation: To equalize, you push air into the middle ear until the pressure inside and outside is equal.

  - kind: problem
    id: damm
    widget: choice
    prompt: Why is a dam much thicker at the bottom than at the top?
    params:
      options:
        - { label: Water pressure is highest at the bottom., correct: true }
        - { label: To make it look better., feedback: "It is pure physics. The most water presses at the bottom." }
    hints:
      - Where is the most water above a point?
    explanation: Pressure grows with depth, so the wall must be strongest at the bottom.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A balloon has 6 litres at the surface. You take it down to 20 m. How many litres does it have there?
    params:
      unit: l
    answer:
      value: 2
    hints:
      - At 20 m the pressure is 3 bar – three times as much as above.
    explanation: "Triple the pressure, a third of the volume: **Boyle’s law**."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Three vessels are filled with water to the same height: a narrow tube, a bucket, a wide funnel. Where is the pressure at the bottom greatest?"
    params:
      options:
        - label: The same everywhere
          correct: true
        - label: In the funnel – it holds the most water
          feedback: Pressure depends only on depth, not on the amount.
        - label: In the tube – it is narrowest
          feedback: The shape plays no role.
    hints:
      - What did pressure under water depend on?
    explanation: "The **hydrostatic paradox**: p = ρ · g · h. Only the height counts."
    difficulty: 3

srs:
  cards_from: [tiefe, damm]
