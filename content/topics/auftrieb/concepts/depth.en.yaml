id: sci.fluids.depth
type: concept
title: Pressure Underwater
summary: One more bar every 10 meters.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many bar of pressure are there at the deepest point of the oceans, the Mariana Trench (11 km)?"
    params:
      min: 1
      max: 5000
      unit: bar
    answer:
      value: 1100
      tolerance: 200
    explanation: About 1100 bar – like a small car standing on your thumbnail.

  - kind: explain
    id: s1
    body: |
      In water, pressure rises by about **1 bar** every **10 meters**. At the surface, the air already presses with about 1 bar.

  - kind: problem
    id: tiefe
    widget: numeric
    prompt: What is the total pressure in bar at a water depth of {{d}} m?
    params: { unit: bar }
    answer: { value: "{{1 + d / 10}}" }
    feedback:
      - when: "numval(state.input) == d / 10"
        misconception: forgot-air
        text: The air above the water presses too. Add 1 bar.
    hints:
      - "Air plus {{d}} ÷ 10."
    explanation: "1 + {{d / 10}} = {{1 + d / 10}} bar."
    variants:
      params: { d: "choice[10,20,30,40,50]" }
      defaults: { d: 30 }

  - kind: problem
    id: ohren
    widget: choice
    prompt: Why do your ears hurt when you dive?
    params:
      options:
        - { label: The water presses harder outside than the air does inside., correct: true }
        - { label: The water is cold., feedback: "It hurts in warm water too." }
    hints:
      - On which side of the eardrum is the pressure higher?
    explanation: To equalize, you push air into the middle ear until the pressure inside and outside is equal.

  - kind: problem
    id: damm
    widget: choice
    prompt: Why is a dam much thicker at the bottom than at the top?
    params:
      options:
        - { label: Water pressure is highest at the bottom., correct: true }
        - { label: To make it look better., feedback: "It is pure physics. The most water presses at the bottom." }
    hints:
      - Where is the most water above a point?
    explanation: Pressure grows with depth, so the wall must be strongest at the bottom.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A balloon has 6 litres at the surface. You take it down to 20 m. How many litres does it have there?
    params:
      unit: l
    answer:
      value: 2
    hints:
      - At 20 m the pressure is 3 bar – three times as much as above.
    explanation: "Triple the pressure, a third of the volume: **Boyle’s law**."
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Why 1 bar per 10 m? At 10 m depth there are 10 m³ of water above each m², that is 10,000 kg. Its weight of 100,000 N presses on 1 m². That is the **hydrostatic pressure** $p = \rho g h$.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Mercury is 13.6 times as dense as water. How tall must a column of mercury be to press as hard as 10 m of water? In cm.
    params:
      unit: cm
    answer:
      value: 73.5
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 13600) < 50
        misconception: inverse-density
        text: "Denser means **shorter**: the same pressure needs less height."
    hints:
      - "At equal pressure: density times height stays the same."
      - 1000 cm ÷ 13.6 = ?
    explanation: "1000 ÷ 13.6 ≈ 73.5 cm. In 1643 Torricelli built the first barometer this way: the air holds up a column of mercury about 76 cm high."
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: choice
    prompt: Why can you not breathe through a long snorkel at 2 m depth?
    params:
      options:
        - label: The water presses on the chest with an extra 0.2 bar – the breathing muscles cannot work against that.
          correct: true
        - label: The air in the tube gets too thin.
          feedback: The tube holds normal air. The problem is the pressure on the chest.
        - label: The snorkel fills with water.
          feedback: It sticks out of the water. It still does not work.
    hints:
      - How large is the pressure at 2 m depth?
      - The air in the lungs is only at surface pressure.
    explanation: Outside 1.2 bar, in the lungs only 1 bar. 0.2 bar is 2000 kg per m² of chest. That is why divers breathe air at the pressure of their depth.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Three vessels are filled with water to the same height: a narrow tube, a bucket, a wide funnel. Where is the pressure at the bottom greatest?"
    params:
      options:
        - label: The same everywhere
          correct: true
        - label: In the funnel – it holds the most water
          feedback: Pressure depends only on depth, not on the amount.
        - label: In the tube – it is narrowest
          feedback: The shape plays no role.
    hints:
      - What did pressure under water depend on?
    explanation: "The **hydrostatic paradox**: p = ρ · g · h. Only the height counts."
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A diver breathes from a tank at 30 m depth. How many times as much air – counted in particles – does each breath use there compared with the surface?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 3
        misconception: forgot-air-pressure
        text: There is already 1 bar at the surface. At 30 m it is 4 bar, not 3.
    hints:
      - "Total pressure at 30 m: 1 bar of air plus 3 bar of water."
      - Same lung volume at four times the pressure means four times the air.
    explanation: At 4 bar each breath holds four times as much air. So the tank empties four times as fast down there.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Why must a scuba diver never hold their breath while ascending?
    params:
      options:
        - label: The pressure falls, the air in the lungs expands and can injure them.
          correct: true
        - label: Otherwise he gets too little oxygen.
          feedback: The problem is not oxygen but the growing volume.
        - label: The water presses harder then.
          feedback: On the way up the pressure gets smaller, not larger.
    hints:
      - Think of the balloon that shrinks at depth.
      - What happens on the way back up?
    explanation: By Boyle's law p · V = constant. From 2 bar to 1 bar the volume doubles. Trapped air would overstretch the lungs.
    difficulty: 3

srs:
  cards_from: [tiefe, damm]
