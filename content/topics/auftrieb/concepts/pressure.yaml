id: sci.fluids.pressure
type: concept
title: Kraft pro Fläche
summary: Was Druck ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: schnee
    widget: choice
    prompt: Warum sinkt man mit Schneeschuhen weniger tief ein?
    params:
      options:
        - { label: Das Gewicht verteilt sich auf mehr Fläche., correct: true }
        - { label: Man wird leichter., feedback: "Das Gewicht bleibt gleich – nur die Fläche ändert sich." }
    hints:
      - Was ändert sich an der Fläche unter dir?
    explanation: Gleiche Kraft auf mehr Fläche – weniger Druck.

  - kind: explain
    id: s2
    body: |
      **Druck** ist Kraft geteilt durch Fläche. Dieselbe Kraft auf einer kleinen Fläche drückt viel stärker – darum schneiden Messer und stechen Nadeln.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Eine Person drückt mit {{f}} N auf {{a}} cm² Schuhsohle. Wie groß ist der Druck?
    params: { unit: N/cm² }
    answer: { value: "{{f / a}}" }
    hints:
      - Kraft geteilt durch Fläche.
    explanation: "{{f}} : {{a}} = {{f / a}} N pro cm²."
    variants:
      params: { f: "choice[600,800,1000]", a: "choice[200,400]" }
      defaults: { f: 800, a: 400 }

  - kind: problem
    id: wo
    widget: buckets
    prompt: Hoher oder niedriger Druck auf den Boden?
    params:
      buckets: [{ label: hoch }, { label: niedrig }]
      items:
        - { label: Stöckelschuh-Absatz, bucket: hoch }
        - { label: Spitze einer Reißzwecke, bucket: hoch }
        - { label: Ski, bucket: niedrig }
        - { label: Breite Traktorreifen, bucket: niedrig }
    hints:
      - Kleine Fläche, hoher Druck.
    explanation: Ein Absatz hat winzige Fläche – er drückt stärker als ein Elefantenfuß.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Stöckelschuh
          right: true
        - text: Ski im Schnee
          right: false
        - text: Messerschneide
          right: true
        - text: Raupenkette eines Panzers
          right: false
      left: Wenig Druck
      right: Viel Druck

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Elefant (5000 kg) steht auf vier Füßen mit je 1000 cm². Eine Frau (60 kg) balanciert auf einem Absatz mit 1 cm². Wievielmal größer ist ihr Druck?
    answer:
      value: 48
    hints:
      - "Elefant: 5000 kg auf 4000 cm². Frau: 60 kg auf 1 cm²."
    explanation: 1,25 gegen 60 kg pro cm² – der Absatz drückt 48-mal so stark.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Hydraulik: Ein kleiner Kolben (2 cm²) wird mit 50 N gedrückt. Welche Kraft entsteht am großen Kolben (100 cm²)?"
    params:
      unit: N
    answer:
      value: 2500
    hints:
      - "Der Druck ist überall gleich: 25 N pro cm²."
    explanation: 25 · 100 = 2500 N. Dafür bewegt sich der große Kolben nur ein Fünfzigstel so weit.
    difficulty: 3

srs:
  cards_from: [schnee, rechnen]
