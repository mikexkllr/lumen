id: sci.fluids.pressure
type: concept
title: Kraft pro Fläche
summary: Was Druck ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Spitz gegen breit
    body: "Mit einer Nadel stichst du leicht durch Stoff, mit dem Finger nie. Dabei drückst du gleich fest. Deck die Karten auf: Wo entsteht im Alltag großer **Druck**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🔪
            front: Messer
            back: Die Schneide ist hauchdünn. Schon wenig Kraft trennt eine Tomate.
          - icon: 📌
            front: Reißzwecke
            back: Oben breit für den Daumen, unten spitz für die Wand – mit derselben Kraft.
          - icon: 🦟
            front: Mücke
            back: Ihr Rüssel ist so fein, dass sie mit winziger Kraft durch deine Haut kommt.
          - icon: ⛸️
            front: Schlittschuh
            back: Die schmale Kufe drückt dein ganzes Gewicht auf einen dünnen Streifen Eis.

  - kind: problem
    id: schnee
    widget: choice
    prompt: Warum sinkt man mit Schneeschuhen weniger tief ein?
    params:
      options:
        - { label: Das Gewicht verteilt sich auf mehr Fläche., correct: true }
        - { label: Man wird leichter., feedback: "Das Gewicht bleibt gleich – nur die Fläche ändert sich." }
    hints:
      - Was ändert sich an der Fläche unter dir?
    explanation: Gleiche Kraft auf mehr Fläche – weniger Druck.

  - kind: explain
    id: s2
    body: |
      **Druck** ist Kraft geteilt durch Fläche. Dieselbe Kraft auf einer kleinen Fläche drückt viel stärker – darum schneiden Messer und stechen Nadeln.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Eine Person drückt mit {{f}} N auf {{a}} cm² Schuhsohle. Wie groß ist der Druck?
    params: { unit: N/cm² }
    answer: { value: "{{f / a}}" }
    hints:
      - Kraft geteilt durch Fläche.
    explanation: "{{f}} : {{a}} = {{f / a}} N pro cm²."
    variants:
      params: { f: "choice[600,800,1000]", a: "choice[200,400]" }
      defaults: { f: 800, a: 400 }

  - kind: problem
    id: wo
    widget: buckets
    prompt: Hoher oder niedriger Druck auf den Boden?
    params:
      buckets: [{ label: hoch }, { label: niedrig }]
      items:
        - { label: Stöckelschuh-Absatz, bucket: hoch }
        - { label: Spitze einer Reißzwecke, bucket: hoch }
        - { label: Ski, bucket: niedrig }
        - { label: Breite Traktorreifen, bucket: niedrig }
    hints:
      - Kleine Fläche, hoher Druck.
    explanation: Ein Absatz hat winzige Fläche – er drückt stärker als ein Elefantenfuß.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Stöckelschuh
          right: true
        - text: Ski im Schnee
          right: false
        - text: Messerschneide
          right: true
        - text: Raupenkette eines Panzers
          right: false
      left: Wenig Druck
      right: Viel Druck

  - kind: problem
    id: intro-c1
    widget: slider
    prompt: Eine Person mit 600 N steht auf beiden Schuhen. Der Druck auf den Boden ist 2 N pro cm². Stelle die Sohlenfläche so ein, dass die Linie den Punkt trifft.
    params:
      expr: x/a
      x:
        - 0
        - 1000
      y:
        - 0
        - 20
      showCoordinates: false
      sliders:
        - id: a
          label: Fläche (cm²)
          min: 50
          max: 500
          step: 50
          initial: 50
      markers:
        - x: 600
          y: 2
          label: 600 N
    answer:
      values:
        a: 300
    hints:
      - "Druck = Kraft : Fläche. Mehr Fläche heißt weniger Druck."
      - "Welche Fläche ergibt 600 N : Fläche = 2?"
    explanation: "600 N : 300 cm² = 2 N/cm². Mit Schneeschuhen wäre die Fläche zehnmal so groß – und der Druck zehnmal kleiner."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Elefant (5000 kg) steht auf vier Füßen mit je 1000 cm². Eine Frau (60 kg) balanciert auf einem Absatz mit 1 cm². Wievielmal größer ist ihr Druck?
    answer:
      value: 48
    hints:
      - "Elefant: 5000 kg auf 4000 cm². Frau: 60 kg auf 1 cm²."
    explanation: 1,25 gegen 60 kg pro cm² – der Absatz drückt 48-mal so stark.
    difficulty: 2

  - kind: problem
    id: lab-d1
    depth: 2
    widget: sim
    prompt: Druck entsteht auch in Gasen. Drück den Kolben zusammen, bis der Druck etwa 250 kPa erreicht.
    params:
      scene: gas
      controls:
        temperature:
          fixed: true
    answer:
      pressure:
        - 240
        - 260
    explanation: Bei 2 Litern. Dieselben Teilchen auf weniger Raum stoßen öfter gegen die Wand.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Druck misst man in Pascal: 1 Pa = 1 N pro m². Eine Person mit 600 N steht auf 300 cm² Sohle – das sind 0,03 m². Wie viele Pascal sind das?"
    params:
      unit: Pa
    answer:
      value: 20000
    feedback:
      - when: numval(state.input) == 2
        misconception: cm2-vs-m2
        text: Das sind N pro cm². Ein m² hat 10 000 cm².
    hints:
      - "Druck = Kraft : Fläche – mit der Fläche in m²."
      - "600 N : 0,03 m² = ?"
    explanation: "600 : 0,03 = 20 000 Pa. Die Luft drückt mit rund 100 000 Pa – fünfmal so stark wie deine Füße."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Ein Ballon platzt an einer einzigen Nadel. Auf ein Brett mit 1000 Nägeln kann man ihn drücken, ohne dass er platzt. Warum?
    params:
      options:
        - label: Die Kraft verteilt sich auf 1000 Spitzen – der Druck pro Spitze ist klein.
          correct: true
        - label: Die Nägel sind stumpfer.
          feedback: Es sind dieselben Spitzen. Es kommt auf die Zahl an.
        - label: Der Ballon wird dabei härter.
          feedback: Der Ballon bleibt gleich. Die Fläche ist der Unterschied.
    hints:
      - "Druck = Kraft : Fläche. Was ändert sich?"
      - Tausend Spitzen haben tausendmal so viel Fläche.
    explanation: Bei gleicher Kraft sinkt der Druck auf ein Tausendstel. So liegen Fakire auf Nagelbetten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Hydraulik: Ein kleiner Kolben (2 cm²) wird mit 50 N gedrückt. Welche Kraft entsteht am großen Kolben (100 cm²)?"
    params:
      unit: N
    answer:
      value: 2500
    hints:
      - "Der Druck ist überall gleich: 25 N pro cm²."
    explanation: 25 · 100 = 2500 N. Dafür bewegt sich der große Kolben nur ein Fünfzigstel so weit.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: "Hydraulik spart Kraft, aber nicht Energie. Das verdrängte **Volumen** ist auf beiden Seiten gleich: $A_1 \\cdot s_1 = A_2 \\cdot s_2$. Der kleine Kolben muss also viel weiter gedrückt werden."

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Kleiner Kolben 2 cm², großer Kolben 100 cm². Das Auto auf dem großen Kolben soll 10 cm steigen. Wie viele Zentimeter musst du den kleinen Kolben drücken?
    params:
      unit: cm
    answer:
      value: 500
    feedback:
      - when: numval(state.input) == 0.2
        misconception: inverse-ratio
        text: "Umgekehrt: Der kleine Kolben bewegt sich **weiter**, nicht weniger weit."
    hints:
      - "Volumen bleibt gleich: 100 cm² · 10 cm = 2 cm² · s."
      - "s = 1000 : 2."
    explanation: "1000 cm³ : 2 cm² = 500 cm = 5 m. Darum pumpt man bei einem Wagenheber viele kurze Hübe."
    difficulty: 3

  - kind: problem
    id: ph-x3
    depth: 3
    widget: choice
    prompt: Woher kommt der Druck, den ein Gas auf die Wand seines Behälters ausübt?
    params:
      options:
        - label: Unzählige Teilchen prallen ständig gegen die Wand.
          correct: true
        - label: Das Gas ist schwer und drückt nach unten.
          feedback: Gas drückt in alle Richtungen gleich, auch gegen die Decke.
        - label: Die Teilchen stoßen sich gegenseitig ab.
          feedback: In einem idealen Gas tun sie das kaum. Es sind die Stöße an der Wand.
    hints:
      - Stell dir Tischtennisbälle in einer geschüttelten Kiste vor.
      - Jeder Stoß überträgt Impuls auf die Wand.
    explanation: Jeder Aufprall gibt der Wand einen kleinen Stoß. Milliarden pro Sekunde ergeben eine gleichmäßige Kraft. Wärmer heißt schnellere Teilchen und mehr Druck.
    difficulty: 3

srs:
  cards_from: [schnee, rechnen]
