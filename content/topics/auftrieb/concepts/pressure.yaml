id: sci.fluids.pressure
type: concept
title: Kraft pro Fläche
summary: Was Druck ist.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: schnee
    widget: choice
    prompt: Warum sinkt man mit Schneeschuhen weniger tief ein?
    params:
      options:
        - { label: Das Gewicht verteilt sich auf mehr Fläche., correct: true }
        - { label: Man wird leichter., feedback: "Das Gewicht bleibt gleich – nur die Fläche ändert sich." }
    hints:
      - Was ändert sich an der Fläche unter dir?
    explanation: Gleiche Kraft auf mehr Fläche – weniger Druck.

  - kind: explain
    body: |
      **Druck** ist Kraft geteilt durch Fläche. Dieselbe Kraft auf einer kleinen Fläche drückt viel stärker – darum schneiden Messer und stechen Nadeln.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Eine Person drückt mit {{f}} N auf {{a}} cm² Schuhsohle. Wie groß ist der Druck?
    params: { unit: N/cm² }
    answer: { value: "{{f / a}}" }
    hints:
      - Kraft geteilt durch Fläche.
    explanation: "{{f}} : {{a}} = {{f / a}} N pro cm²."
    variants:
      params: { f: "choice[600,800,1000]", a: "choice[200,400]" }
      defaults: { f: 800, a: 400 }

  - kind: problem
    id: wo
    widget: buckets
    prompt: Hoher oder niedriger Druck auf den Boden?
    params:
      buckets: [{ label: hoch }, { label: niedrig }]
      items:
        - { label: Stöckelschuh-Absatz, bucket: hoch }
        - { label: Spitze einer Reißzwecke, bucket: hoch }
        - { label: Ski, bucket: niedrig }
        - { label: Breite Traktorreifen, bucket: niedrig }
    hints:
      - Kleine Fläche, hoher Druck.
    explanation: Ein Absatz hat winzige Fläche – er drückt stärker als ein Elefantenfuß.

srs:
  cards_from: [schnee, rechnen]
