id: sci.fluids.density
type: concept
title: Density
summary: How heavy a liter is.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: "Which is heavier: a litre of water or a litre of oil?"
    params:
      options:
        - label: The water
          correct: true
        - label: The oil
          feedback: Oil floats on water.
        - label: Both the same
          feedback: Equal volume does not mean equal weight.
    hints:
      - What floats on top in salad dressing?
    explanation: Oil is lighter per litre. That is why it floats on top.

  - kind: explain
    id: s1
    body: |
      **Density** is mass divided by volume. Water has about 1 kg per liter. Anything with a lower density floats.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: A block has a volume of {{v}} liters and weighs {{m}} kg. What is its density?
    params: { unit: kg/L }
    answer: { value: "{{d}}" }
    hints:
      - Mass divided by volume.
    explanation: "{{m}} ÷ {{v}} = {{d}} kg per liter."
    variants:
      params: { v: "choice[2,4,8]", d: "choice[0.25,0.5,2,3]" }
      derive: { m: "v * d" }
      defaults: { v: 4, d: 0.5 }

  - kind: problem
    id: eisberg
    widget: choice
    prompt: Ice has a density of 0.9 kg/L. How much of an iceberg lies under water?
    params:
      options:
        - { label: About 90 %, correct: true }
        - { label: About half, feedback: "Ice is only slightly lighter than water." }
        - { label: About 10 %, feedback: "The other way around. 10 % sticks out." }
    hints:
      - Ice is almost as dense as water.
    explanation: The share under water equals the density ratio, 0.9.

  - kind: problem
    id: meter
    widget: numeric
    prompt: An iceberg is {{h}} m tall in total. About how many meters of it lie under water?
    params: { unit: m }
    answer: { value: "{{h * 9 / 10}}" }
    hints:
      - "90 % of {{h}}."
    explanation: "About {{h * 9 / 10}} m. Only the tip is visible."
    variants:
      params: { h: "choice[50,100,200,300]" }
      defaults: { h: 200 }

  - kind: problem
    id: c1
    widget: order
    prompt: Order by density, lightest first.
    params:
      items:
        - label: Air
        - label: Wood
        - label: Water
        - label: Iron
        - label: Gold
    hints:
      - What floats comes before water.
    explanation: Air 0.0012 – wood 0.6 – water 1 – iron 7.9 – gold 19.3 kg per litre.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A crown weighs 1.5 kg and displaces 0.1 litres of water. Pure gold has 19.3 kg/L. What is the density of the crown?
    params:
      unit: kg/L
    answer:
      value: 15
    hints:
      - Mass divided by volume.
    explanation: 15 kg/L – not pure gold. This is how Archimedes exposed a fraud.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many kilograms does the air in a 4 m × 5 m × 2.5 m room weigh?"
    params:
      min: 0
      max: 200
    answer:
      value: 60
      tolerance: 15
    explanation: 50 m³ of air at 1.2 kg per m³ weighs 60 kg – as much as a person. We do not notice because air presses from all sides.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: You saw a big wooden block into two unequal pieces. Which has the higher density?
    params:
      options:
        - label: Both the same.
          correct: true
        - label: The big piece.
          feedback: It is heavier but also larger. Mass divided by volume stays the same.
        - label: The small piece.
          feedback: Smaller does not mean denser – it is the same material.
    hints:
      - Density = mass ÷ volume.
      - What happens to both quantities when you saw?
    explanation: Density is a property of the material, not the size. That is why a wood chip floats just like a tree trunk.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why does it matter so much that ice is **lighter** than water?
    params:
      options:
        - label: Lakes freeze from the top – fish can survive underneath
          correct: true
        - label: So ice cubes look nice in a glass
          feedback: It is about life in bodies of water.
        - label: It does not matter
          feedback: If ice sank, lakes would freeze solid from the bottom.
    hints:
      - What if ice sank to the bottom?
    explanation: Water is densest at 4 °C – a rare **anomaly**. Almost all other substances are denser solid than liquid.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: The crown from before has 15 kg/L. It is made of gold (19.3 kg/L) and silver (10.5 kg/L). What share of its volume is gold – in percent?
    params:
      unit: "%"
    answer:
      value: 51
      tolerance: 1
    hints:
      - "With a gold share x: 19.3 · x + 10.5 · (1 − x) = 15."
      - 8.8 · x = 4.5.
    explanation: x = 4.5 ÷ 8.8 ≈ 0.51. Only about half the volume is gold. The goldsmith had cheated heavily.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Water is densest at 4 °C. What is the temperature at the bottom of a deep lake in winter?
    params:
      options:
        - label: About 4 °C
          correct: true
        - label: 0 °C
          feedback: Water at 0 °C is lighter and stays on top, where it freezes.
        - label: As cold as the air
          feedback: The ice on top insulates, and the densest water sinks down.
    hints:
      - The densest water sinks to the bottom.
      - What temperature is the densest water?
    explanation: Water at 4 °C collects on the bottom. Fish spend the winter there. Almost every other substance is denser as a solid than as a liquid – water is an exception.
    difficulty: 3

srs:
  cards_from: [rechnen, eisberg]
