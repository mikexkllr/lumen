id: sci.fluids.buoyancy
type: concept
title: Why Ships Float
summary: Archimedes' principle.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: stahl
    widget: choice
    prompt: Why does a steel ship float?
    params:
      options:
        - { label: "It displaces as much water as it weighs.", correct: true }
        - { label: Steel is lighter than water., feedback: "A block of steel sinks. It comes down to the shape." }
        - { label: The engine keeps it up., feedback: "A ship without an engine floats too." }
    hints:
      - A ship is almost empty inside.
    explanation: The hollow hull displaces a lot of water, and that pushes the ship up.

  - kind: explain
    id: s2
    body: |
      **Archimedes:** A body in water is pushed up with a force equal to the weight of the water it displaces. One liter of water weighs 1 kg.

  - kind: problem
    id: leichter
    widget: numeric
    prompt: A stone displaces {{v}} liters of water. By how many kilograms does it feel lighter underwater?
    params: { unit: kg }
    answer: { value: "{{v}}" }
    hints:
      - How much does the displaced water weigh?
    explanation: "{{v}} liters of water weigh {{v}} kg. That is exactly how hard the water pushes up."
    variants:
      params: { v: "int[2,9]" }
      defaults: { v: 3 }

  - kind: problem
    id: schwimmt
    widget: buckets
    prompt: Does it float on water or sink?
    params:
      buckets: [{ label: floats }, { label: sinks }]
      items:
        - { label: Wood, bucket: floats }
        - { label: Ice, bucket: floats }
        - { label: Cooking oil, bucket: floats }
        - { label: Iron screw, bucket: sinks }
        - { label: Pebble, bucket: sinks }
    hints:
      - Is it lighter or heavier than the same amount of water?
    explanation: Anything that weighs less per liter than water floats.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A boat weighs 800 kg with its load. How many litres of water must it displace to float?
    params:
      unit: l
    answer:
      value: 800
    hints:
      - One litre of water weighs 1 kg.
    explanation: 800 litres. When floating, the displaced water weighs exactly as much as the body.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A boat with a stone on board floats in a pool. You throw the stone into the water. What does the water level do?
    params:
      options:
        - label: It falls
          correct: true
        - label: It rises
          feedback: In the boat the stone displaced its **weight** in water; sunk it displaces only its volume.
        - label: It stays the same
          feedback: The stone is denser than water – that makes the difference.
    hints:
      - How much water does the stone displace in the boat – and how much on the bottom?
    explanation: A stone of density 3 displaces three times as much water in the boat as on the bottom.
    difficulty: 3

srs:
  cards_from: [stahl, leichter]
