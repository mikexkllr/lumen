id: sci.fluids.buoyancy
type: concept
title: Why Ships Float
summary: Archimedes' principle.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Dive and surface
    body: "A submarine can float, sink and hover – without changing its shape. Uncover the dive step by step: how does it control its **buoyancy**?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🚢
            front: On the surface
            back: With empty tanks it floats on top like a ship.
          - icon: 🌊
            front: Diving
            back: Valves open and water flows into the tanks. The boat gets heavier and sinks.
          - icon: ⚖️
            front: Hovering
            back: With exactly the right amount of water it stays put at depth.
          - icon: 🫧
            front: Surfacing
            back: Compressed air pushes the water out of the tanks. The boat gets lighter and rises.

  - kind: problem
    id: stahl
    widget: choice
    prompt: Why does a steel ship float?
    params:
      options:
        - { label: "It displaces as much water as it weighs.", correct: true }
        - { label: Steel is lighter than water., feedback: "A block of steel sinks. It comes down to the shape." }
        - { label: The engine keeps it up., feedback: "A ship without an engine floats too." }
    hints:
      - A ship is almost empty inside.
    explanation: The hollow hull displaces a lot of water, and that pushes the ship up.

  - kind: explain
    id: s2
    body: |
      **Archimedes:** A body in water is pushed up with a force equal to the weight of the water it displaces. One liter of water weighs 1 kg.

  - kind: problem
    id: leichter
    widget: numeric
    prompt: A stone displaces {{v}} liters of water. By how many kilograms does it feel lighter underwater?
    params: { unit: kg }
    answer: { value: "{{v}}" }
    hints:
      - How much does the displaced water weigh?
    explanation: "{{v}} liters of water weigh {{v}} kg. That is exactly how hard the water pushes up."
    variants:
      params: { v: "int[2,9]" }
      defaults: { v: 3 }

  - kind: problem
    id: schwimmt
    widget: buckets
    prompt: Does it float on water or sink?
    params:
      buckets: [{ label: floats }, { label: sinks }]
      items:
        - { label: Wood, bucket: floats }
        - { label: Ice, bucket: floats }
        - { label: Cooking oil, bucket: floats }
        - { label: Iron screw, bucket: sinks }
        - { label: Pebble, bucket: sinks }
    hints:
      - Is it lighter or heavier than the same amount of water?
    explanation: Anything that weighs less per liter than water floats.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A boat weighs 800 kg with its load. How many litres of water must it displace to float?
    params:
      unit: l
    answer:
      value: 800
    hints:
      - One litre of water weighs 1 kg.
    explanation: 800 litres. When floating, the displaced water weighs exactly as much as the body.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: "**Buoyancy** arises because water pressure is larger below than above. The difference between bottom and top pushes the body up. It equals exactly the weight of the displaced water."

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: A stone has {{m}} kg and a volume of {{v}} litres. It hangs fully under water from a spring scale. What does it show in kg?
    params:
      unit: kg
    answer:
      value: "{{m - v}}"
    feedback:
      - when: numval(state.input) == m + v
        misconception: buoyancy-sign
        text: Buoyancy points **upwards**. It makes the stone lighter, not heavier.
    hints:
      - How much water does the stone displace?
      - "{{v}} L of water weighs {{v}} kg – that is how much lighter it gets."
    explanation: "{{m}} − {{v}} = {{m - v}} kg. That is how Archimedes found volume – and with it density."
    difficulty: 2
    variants:
      params:
        m: int[3,9]
        v: int[1,2]
      defaults:
        m: 5
        v: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: choice
    prompt: A ship sails from a river into the sea. Salt water is slightly denser. What happens?
    params:
      options:
        - label: It rides a little higher in the water.
          correct: true
        - label: It sinks deeper.
          feedback: Denser water carries better. Less volume suffices for the same weight.
        - label: Nothing changes.
          feedback: What matters is the weight of the displaced water – and salt water is heavier.
    hints:
      - The ship must displace its own weight of water.
      - A litre of salt water weighs more than a litre of fresh water.
    explanation: At sea less displaced volume is enough. Ships therefore carry load lines for fresh and salt water. In the Dead Sea you can even lie on your back and read.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A boat with a stone on board floats in a pool. You throw the stone into the water. What does the water level do?
    params:
      options:
        - label: It falls
          correct: true
        - label: It rises
          feedback: In the boat the stone displaced its **weight** in water; sunk it displaces only its volume.
        - label: It stays the same
          feedback: The stone is denser than water – that makes the difference.
    hints:
      - How much water does the stone displace in the boat – and how much on the bottom?
    explanation: A stone of density 3 displaces three times as much water in the boat as on the bottom.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A submarine has a volume of 1000 m³. Sea water has 1.03 tonnes per m³. How many tonnes must the boat weigh to hover in the water?
    params:
      unit: t
    answer:
      value: 1030
    hints:
      - "Hovering means: buoyancy = weight."
      - "Weight of displaced water: 1000 · 1.03 t."
    explanation: "Exactly 1030 t. With tanks it floods or blows empty it fine-tunes its weight: heavier it sinks, lighter it rises."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why a steel ship floats but a block of steel sinks.
    params:
      keywords:
        - - verdräng
          - displac
          - wasser
          - water
        - - gewicht
          - weight
          - schwer
          - heavy
          - masse
          - mass
        - - hohl
          - hollow
          - luft
          - air
          - volumen
          - volume
          - form
          - shape
      sample: Buoyancy equals the weight of the displaced water. The block displaces little water and sinks. The hollow ship is full of air and displaces as much water as it weighs.
    difficulty: 3

srs:
  cards_from: [stahl, leichter]
