id: geo.basics.angles
type: concept
title: Angle sums
summary: In a triangle, they always add up to 180°.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [geo.angles]
estimated_minutes: 6
steps:
  - kind: problem
    id: dritter
    widget: numeric
    prompt: A triangle has angles of 50° and 60°. How large is the third angle?
    params: { unit: "°" }
    answer: { value: 70 }
    hints:
      - All three angles together make 180°.
    explanation: 180° − 50° − 60° = 70°.

  - kind: explain
    body: |
      The three angles in **every** triangle add up to **180°**.
      A straight line, which is a straight angle, is also 180°.

  - kind: problem
    id: dritter-variante
    widget: numeric
    prompt: A triangle has angles of {{a}}° and {{b}}°. How large is the third?
    params: { unit: "°" }
    answer: { value: "{{180 - a - b}}" }
    feedback:
      - when: "numval(state.input) == 360 - a - b"
        misconception: angle-sum
        text: 360° is the angle sum of a quadrilateral. In a triangle it is 180°.
    hints:
      - "180° − {{a}}° − {{b}}°."
    explanation: "180° − {{a}}° − {{b}}° = {{180 - a - b}}°."
    variants:
      params: { a: "int[20,90]", b: "int[20,80]" }
      constraints: ["a + b < 170"]
      defaults: { a: 35, b: 85 }

  - kind: problem
    id: nebenwinkel
    widget: numeric
    prompt: Two angles sit side by side on a straight line. One is 115°. How large is the other?
    params: { unit: "°" }
    answer: { value: 65 }
    hints:
      - A straight line is 180°.
    explanation: 180° − 115° = 65°.

  - kind: problem
    id: viereck
    widget: choice
    prompt: What is the angle sum of a quadrilateral?
    params:
      layout: grid
      options:
        - { label: "360°", correct: true }
        - { label: "180°", feedback: "That is for a triangle. A quadrilateral can be split into two triangles." }
        - { label: "270°", feedback: "Think of a rectangle. It has four right angles." }
        - { label: "540°", feedback: "That would be a pentagon." }
    hints:
      - Draw a diagonal in the quadrilateral.
    explanation: A diagonal splits the quadrilateral into two triangles. 2 · 180° = 360°.

  - kind: problem
    id: dritter-winkel
    widget: angle
    prompt: A triangle has angles of 50° and 70°. Set the third angle.
    params: { initial: 20, max: 180 }
    answer: { value: 60 }
    hints:
      - All three together make 180°.
    explanation: 180° − 50° − 70° = 60°.

srs:
  cards_from: ["steps[2]"]
