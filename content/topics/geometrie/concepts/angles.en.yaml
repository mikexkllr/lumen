id: geo.basics.angles
type: concept
title: Angle sums
summary: In a triangle, they always add up to 180°.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [geo.angles]
estimated_minutes: 13
steps:
  - kind: problem
    id: dritter
    widget: numeric
    prompt: A triangle has angles of 50° and 60°. How large is the third angle?
    params: { unit: "°" }
    answer: { value: 70 }
    hints:
      - All three angles together make 180°.
    explanation: 180° − 50° − 60° = 70°.

  - kind: explain
    id: s2
    body: |
      The three angles in **every** **triangle** add up to **180°**.
      A straight line, which is a straight angle, is also 180°.

  - kind: problem
    id: dritter-variante
    widget: numeric
    prompt: A triangle has angles of {{a}}° and {{b}}°. How large is the third?
    params: { unit: "°" }
    answer: { value: "{{180 - a - b}}" }
    feedback:
      - when: "numval(state.input) == 360 - a - b"
        misconception: angle-sum
        text: 360° is the angle sum of a quadrilateral. In a triangle it is 180°.
    hints:
      - "180° − {{a}}° − {{b}}°."
    explanation: "180° − {{a}}° − {{b}}° = {{180 - a - b}}°."
    variants:
      params: { a: "int[20,90]", b: "int[20,80]" }
      constraints: ["a + b < 170"]
      defaults: { a: 35, b: 85 }

  - kind: problem
    id: nebenwinkel
    widget: numeric
    prompt: Two angles sit side by side on a straight line. One is 115°. How large is the other?
    params: { unit: "°" }
    answer: { value: 65 }
    hints:
      - A straight line is 180°.
    explanation: 180° − 115° = 65°.

  - kind: problem
    id: viereck
    widget: choice
    prompt: What is the angle sum of a quadrilateral?
    params:
      layout: grid
      options:
        - { label: "360°", correct: true }
        - { label: "180°", feedback: "That is for a triangle. A quadrilateral can be split into two triangles." }
        - { label: "270°", feedback: "Think of a rectangle. It has four right angles." }
        - { label: "540°", feedback: "That would be a pentagon." }
    hints:
      - Draw a diagonal in the quadrilateral.
    explanation: A diagonal splits the quadrilateral into two triangles. 2 · 180° = 360°.

  - kind: problem
    id: dritter-winkel
    widget: angle
    prompt: A triangle has angles of 50° and 70°. Set the third angle.
    params: { initial: 20, max: 180 }
    answer: { value: 60 }
    hints:
      - All three together make 180°.
    explanation: 180° − 50° − 70° = 60°.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: A triangle can have the angles 90°, 45° and 45°.
          right: true
        - text: A triangle can have the angles 100°, 50° and 40°.
          right: false
          why: That adds up to 190°.
        - text: In an equilateral triangle every angle is 60°.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What is the angle sum of a heptagon?
    params:
      unit: °
    answer:
      value: 900
    hints:
      - From one corner any n-gon splits into n − 2 triangles.
    explanation: "5 triangles of 180° each make 900°. In general: (n − 2) · 180°."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: When two lines cross, **vertical angles** lie opposite each other. They are always equal. Angles side by side add up to 180°.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: angle
    prompt: Two lines cross. One angle is 40°. Set the angle next to it.
    params:
      initial: 10
      snap: 5
      max: 180
    answer:
      value: 140
    hints:
      - Adjacent angles together make a straight line.
      - 180° − 40° = ?
    explanation: 180° − 40° = 140°. The opposite angle is 40° again.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: An isosceles triangle has {{a}}° at the top. How big is each of the two base angles?
    params:
      unit: °
    answer:
      value: "{{(180 - a) / 2}}"
    feedback:
      - when: numval(state.input) == 180 - a
        misconception: forgot-halve
        text: That is both base angles together. They are equal – divide by 2.
    hints:
      - The base gets 180° − {{a}}°.
      - The two base angles are equal.
    explanation: "(180° − {{a}}°) : 2 = {{(180 - a) / 2}}°."
    difficulty: 2
    variants:
      params:
        a: step[20,140,10]
      defaults:
        a: 40

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: A pentagon has angles of 100°, 110°, 120° and 90°. How big is the fifth angle?
    params:
      unit: °
    answer:
      value: 120
    feedback:
      - when: numval(state.input) == -60
        misconception: quad-sum
        text: A pentagon does not have 360°. It is made of three triangles.
    hints:
      - "Angle sum: (5 − 2) · 180° = 540°."
      - 540° − 420° = ?
    explanation: 540° − (100° + 110° + 120° + 90°) = 120°.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Why does every triangle have 180°? Order the proof.
    params:
      items:
        - label: Draw a line through the apex C parallel to the base.
        - label: The angle at A reappears at the parallel as an alternate angle.
        - label: The same holds for the angle at B.
        - label: At C the three angles sit side by side on a straight line.
        - label: A straight line has 180° – so does the angle sum.
    hints:
      - First you need an auxiliary line.
    explanation: The proof uses parallels. A sphere has none – there triangles have more than 180°.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: You walk once around a hexagon and turn left at every corner. By how many degrees have you turned in total?
    params:
      unit: °
    answer:
      value: 360
    feedback:
      - when: numval(state.input) == 720
        misconception: interior-sum
        text: That is the sum of the interior angles. You turn by the exterior angles.
    hints:
      - At the end you face the same direction as at the start.
      - One full turn.
    explanation: The exterior angles of any polygon add up to 360° – however many corners.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "On a **sphere** the 180° rule fails. A triangle from the North Pole to the equator, a quarter around the Earth and back, has three right angles: 270°."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why the angles in any quadrilateral add up to 360°.
    params:
      keywords:
        - - dreieck
          - triangle
        - - diagonale
          - diagonal
          - teilen
          - split
          - cut
        - - "180"
          - zwei
          - two
          - twice
      sample: I split the quadrilateral along a diagonal into two triangles. Each triangle has 180 degrees. Together that is two times 180, so 360 degrees.
    explanation: "Key idea: every n-gon splits into n − 2 triangles."
    difficulty: 3

srs:
  cards_from: ["dritter-variante"]
