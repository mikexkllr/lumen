id: geo.basics.triangles
type: concept
title: Types of triangles
summary: Acute, right, obtuse, and always 180°.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: dritter
    widget: angle
    prompt: A triangle has angles of {{a}}° and {{b}}°. Set the third angle.
    params: { initial: 10, max: 180 }
    answer: { value: "{{180 - a - b}}" }
    hints:
      - Together they always make 180°.
    explanation: "180° − {{a}}° − {{b}}° = {{180 - a - b}}°."
    variants:
      params: { a: "step[30,80,5]", b: "step[20,70,5]" }
      defaults: { a: 45, b: 65 }

  - kind: explain
    id: s2
    body: |
      Triangles are sorted by their largest angle: **acute** (all under 90°), **right** (exactly 90°), **obtuse** (one over 90°).

  - kind: problem
    id: arten
    widget: buckets
    prompt: What type of triangle is this?
    params:
      buckets: [{ label: acute }, { label: right }, { label: obtuse }]
      items:
        - { label: "60°, 60°, 60°", bucket: acute }
        - { label: "50°, 70°, 60°", bucket: acute }
        - { label: "90°, 30°, 60°", bucket: right }
        - { label: "120°, 30°, 30°", bucket: obtuse }
        - { label: "100°, 40°, 40°", bucket: obtuse }
    hints:
      - Look only at the largest angle.
    explanation: The largest angle decides.

  - kind: problem
    id: zwei-rechte
    widget: choice
    prompt: Can a triangle have two right angles?
    params:
      options:
        - { label: "No: nothing would be left for the third", correct: true }
        - { label: "Yes", feedback: "90° + 90° = 180°. Nothing is left for the third angle." }
    hints:
      - Work out the sum.
    explanation: Two right angles already use up all 180°.

  - kind: problem
    id: ma-c1
    widget: angle
    prompt: Set an obtuse angle – bigger than 90°, but smaller than 180°.
    params:
      initial: 30
      snap: 5
      max: 180
    answer:
      value: 135
      tolerance: 40
    hints:
      - A right angle is a corner like a sheet of paper.
      - Turn past the corner, but not to a straight line.
    explanation: Obtuse angles lie between 90° and 180°. A triangle can have at most one.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Which three lengths do **not** form a triangle?
    params:
      options:
        - label: 2, 3 and 6
          correct: true
        - label: 3, 4 and 5
          feedback: 3 + 4 is greater than 5 – that works.
        - label: 5, 5 and 9
          feedback: 5 + 5 is greater than 9 – that just works.
    hints:
      - Can the two short sides bridge the long one?
    explanation: "The **triangle inequality**: two sides together are always longer than the third."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "The **triangle inequality**: two sides together are always longer than the third. Otherwise their ends cannot meet."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Two sides of a triangle are {{a}} cm and {{b}} cm long. How long can the third side be at most? Whole centimetres.
    params:
      unit: cm
    answer:
      value: "{{a + b - 1}}"
    feedback:
      - when: numval(state.input) == a + b
        misconception: flat-triangle
        text: Then the triangle would lie flat on a line. It must be strictly shorter.
    hints:
      - The third side must be shorter than {{a}} + {{b}}.
      - The largest whole number below {{a + b}}.
    explanation: "{{a + b - 1}} cm is the longest whole length below {{a + b}} cm."
    difficulty: 2
    variants:
      params:
        a: int[3,9]
        b: int[3,9]
      defaults:
        a: 4
        b: 7

  - kind: problem
    id: ma-d3
    depth: 2
    widget: buckets
    prompt: Sort the triangles by their sides.
    params:
      buckets:
        - id: b1
          label: equilateral
        - id: b2
          label: isosceles
        - id: b3
          label: scalene
      items:
        - label: 5, 5, 5
          bucket: b1
        - label: 9, 9, 9
          bucket: b1
        - label: 4, 4, 6
          bucket: b2
        - label: 7, 7, 3
          bucket: b2
        - label: 3, 4, 5
          bucket: b3
        - label: 6, 7, 8
          bucket: b3
    hints:
      - How many sides are equal?
      - "Three equal: equilateral. Two equal: isosceles."
    explanation: Equilateral has three equal sides, isosceles two, scalene none.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: An exterior angle of a triangle measures 130°. One of the two non-adjacent interior angles is 55°. How large is the other?
    params:
      unit: °
    answer:
      value: 75
    hints:
      - The exterior angle equals the two non-adjacent interior angles together.
    explanation: 130° − 55° = 75°.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: How many different triangles with whole-number sides have perimeter 12? The same sides in another order do not count again.
    answer:
      value: 3
    hints:
      - The longest side must be below 6.
      - Check longest side 4 and 5.
    explanation: (4, 4, 4), (3, 4, 5) and (2, 5, 5). With a side of 6 the triangle would be flat.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: choice
    prompt: "The angles of a triangle are in the ratio 1 : 2 : 3. What kind of triangle is it?"
    params:
      options:
        - label: The largest angle is exactly 90°.
          feedback: Der größte Winkel ist genau 90°.
        - label: right-angled
          correct: true
        - label: "Work out the angles: 6 parts are 180°."
          feedback: "Rechne die Winkel aus: 6 Teile sind 180°."
    hints:
      - 1 + 2 + 3 = 6 parts.
      - One part is 30°.
    explanation: 30°, 60° and 90° – right-angled. It is half an equilateral triangle.
    difficulty: 3

  - kind: explain
    id: ma-x3
    depth: 3
    body: An **exterior angle** equals the two opposite interior angles together. Because the exterior angle and its neighbour make 180° – just like all three interior angles.

srs:
  cards_from: [dritter, arten]
