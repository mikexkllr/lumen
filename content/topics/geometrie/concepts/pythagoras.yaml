id: geo.basics.pythagoras
type: concept
title: Satz des Pythagoras
summary: a² + b² = c² im rechtwinkligen Dreieck.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [geo.pythagoras]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Ein Fernseher ist 120 cm breit und 50 cm hoch. Wie lang ist die Diagonale?"
    params:
      min: 100
      max: 200
      unit: cm
    answer:
      value: 130
      tolerance: 6
    explanation: 130 cm. Nur 10 cm mehr als die Breite – gleich siehst du, wie man das ausrechnet.

  - kind: problem
    id: drei-vier
    widget: numeric
    prompt: Ein rechtwinkliges Dreieck hat die kurzen Seiten 3 cm und 4 cm. Wie lang ist die längste Seite?
    visual:
      widget: graph
      params: { x: [0, 5], y: [0, 4], points: [{ id: A, x: 0, y: 0, draggable: false }, { id: B, x: 4, y: 0, draggable: false }, { id: C, x: 4, y: 3, draggable: false }], segments: [[A, B], [B, C], [C, A]], showCoordinates: false }
    params: { unit: cm }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-sides
        text: Die Abkürzung ist kürzer als der Umweg. Seitenlängen addieren sich nicht einfach.
    hints:
      - Zähle die Kästchen nicht – denk an Quadrate auf den Seiten.
      - 3² + 4² = 9 + 16.
    explanation: 9 + 16 = 25, und √25 = 5.

  - kind: explain
    id: s2
    body: |
      Im **rechtwinkligen** Dreieck gilt $a^2 + b^2 = c^2$.
      c ist die längste Seite, sie liegt gegenüber dem rechten Winkel.
      $3^2 + 4^2 = 25 = 5^2$.

  - kind: problem
    id: hypotenuse
    widget: numeric
    prompt: Die kurzen Seiten sind {{a}} und {{b}} lang. Wie lang ist die längste Seite?
    answer: { value: "{{c}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: add-sides
        text: Nicht die Seiten addieren, sondern ihre Quadrate.
    hints:
      - "{{a}}² + {{b}}² = {{a * a + b * b}}."
      - "Welche Zahl mal sich selbst ergibt {{a * a + b * b}}?"
    explanation: "{{a}}² + {{b}}² = {{c * c}} = {{c}}²."
    difficulty: 2
    variants:
      params: { t: "choice[0,1]", k: "choice[1,2,3]" }
      derive: { a: "t == 0 ? 3 * k : 5 * k", b: "t == 0 ? 4 * k : 12 * k", c: "t == 0 ? 5 * k : 13 * k" }
      constraints: ["c <= 39"]
      defaults: { t: 0, k: 2 }

  - kind: problem
    id: abstand
    widget: numeric
    prompt: Wie weit sind A und B voneinander entfernt?
    visual:
      widget: graph
      params: { x: [0, 8], y: [0, 8], points: [{ id: A, x: 0, y: 0, draggable: false }, { id: B, x: 6, y: 8, draggable: false }], segments: [[A, B]] }
    answer: { value: 10 }
    hints:
      - Wie weit geht es nach rechts, wie weit nach oben?
      - 6 nach rechts und 8 nach oben.
    explanation: 6² + 8² = 36 + 64 = 100 = 10².
    difficulty: 2

  - kind: problem
    id: leiter
    widget: numeric
    prompt: Eine 5 m lange Leiter lehnt an einer Wand. Ihr Fuß steht 3 m von der Wand entfernt. Wie hoch reicht sie?
    params: { unit: m }
    answer: { value: 4 }
    hints:
      - Die Leiter ist die längste Seite.
      - 3² + h² = 5².
    explanation: 25 − 9 = 16, und √16 = 4.

  - kind: problem
    id: rechtwinklig
    widget: choice
    prompt: Ist ein Dreieck mit den Seiten 6, 8 und 11 rechtwinklig?
    params:
      options:
        - { label: Nein, correct: true }
        - { label: Ja, feedback: "Prüfe – 6² + 8² = 100, aber 11² = 121." }
    hints:
      - Vergleiche 6² + 8² mit 11².
    explanation: 36 + 64 = 100 ≠ 121. Also nicht rechtwinklig.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein gleichschenkliges Dreieck hat die Schenkel 13 cm und die Grundseite 10 cm. Wie hoch ist es?
    params:
      unit: cm
    answer:
      value: 12
    hints:
      - Die Höhe teilt die Grundseite in zwei Stücke von 5 cm.
    explanation: 13² − 5² = 144 = 12². Die Höhe macht aus dem Dreieck zwei rechtwinklige.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Warum gilt $a^2 + b^2 = c^2$?
    reveal:
      body: Lege vier gleiche Dreiecke in ein Quadrat der Seite a + b. Frei bleibt ein Quadrat $c^2$. Schiebst du sie anders, bleiben $a^2$ und $b^2$ frei. Die freie Fläche ist beide Male gleich.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Die längste Seite eines rechtwinkligen Dreiecks ist {{13 * k}} cm, eine kurze Seite {{5 * k}} cm. Wie lang ist die andere kurze Seite?
    params:
      unit: cm
    answer:
      value: "{{12 * k}}"
    feedback:
      - when: numval(state.input) == 8 * k
        misconception: subtract-sides
        text: Man zieht nicht die Seiten ab, sondern ihre Quadrate.
    hints:
      - $b^2 = c^2 - a^2$.
      - "{{169 * k * k}} − {{25 * k * k}} = {{144 * k * k}}."
    explanation: $\sqrt{ {{144 * k * k}} } = {{12 * k}}$ cm.
    difficulty: 2
    variants:
      params:
        k: int[1,3]
      defaults:
        k: 1

  - kind: problem
    id: ma-d3
    depth: 2
    widget: graph
    prompt: Ziehe B so, dass die Strecke AB genau 5 lang ist – aber weder waagerecht noch senkrecht.
    params:
      x:
        - -1
        - 5
      y:
        - -1
        - 5
      points:
        - id: A
          x: 0
          y: 0
          draggable: false
        - id: B
          x: 1
          y: 1
      segments:
        - - A
          - B
    check:
      predicate: dist('A', 'B') == 5 && state.points.B.x != 0 && state.points.B.y != 0
    solution:
      state:
        points:
          A:
            x: 0
            y: 0
          B:
            x: 3
            y: 4
    hints:
      - "Gesucht: x² + y² = 25 mit ganzen Zahlen."
      - Denk an 3, 4, 5.
    explanation: "B = (3 | 4) oder (4 | 3): $3^2 + 4^2 = 25 = 5^2$."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Wie lang ist die Raumdiagonale eines Quaders mit den Kanten 2, 3 und 6?
    answer:
      value: 7
    hints:
      - "Wende Pythagoras zweimal an: erst die Bodendiagonale, dann nach oben."
    explanation: 2² + 3² + 6² = 49 = 7². In drei Dimensionen kommt einfach ein Quadrat dazu.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Ist ein Dreieck mit den Seiten 20, 21 und 29 rechtwinklig? Berechne $20^2 + 21^2$.
    answer:
      value: 841
    hints:
      - 400 + 441.
      - Vergleiche mit $29^2$.
    explanation: 400 + 441 = 841 = 29². Ja – die Umkehrung des Satzes garantiert den rechten Winkel.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Pythagoras gilt nur mit rechtem Winkel. Allgemein gilt der **Kosinussatz**: $c^2 = a^2 + b^2 - 2ab \\cos\\gamma$. Bei 90° ist $\\cos\\gamma = 0$, und Pythagoras bleibt übrig."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Wie weit ist der Punkt (1 | 2 | 2) im Raum vom Ursprung entfernt?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 5
        misconception: sum-coordinates
        text: Das ist die Summe der Koordinaten. Quadriere sie erst.
    hints:
      - "Im Raum: $\\sqrt{x^2 + y^2 + z^2}$."
      - 1 + 4 + 4 = 9.
    explanation: $\sqrt{9} = 3$. Pythagoras zweimal angewendet – so misst man später Vektorlängen.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wann man den Satz des Pythagoras benutzen darf und was er sagt.
    params:
      keywords:
        - - rechtwinklig
          - rechter winkel
          - right angle
          - right triangle
          - right-angled
        - - quadrat
          - square
        - - längste
          - hypotenuse
          - longest
          - gegenüber
          - opposite
      sample: Nur im rechtwinkligen Dreieck. Die Quadrate der beiden kurzen Seiten ergeben zusammen das Quadrat der längsten Seite, die gegenüber vom rechten Winkel liegt.
    explanation: "Kernidee: a² + b² = c² – nur mit rechtem Winkel, c gegenüber."
    difficulty: 3

srs:
  cards_from: ["hypotenuse"]
