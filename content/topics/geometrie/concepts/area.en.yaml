id: geo.basics.area
type: concept
title: Area
summary: How many unit squares fit inside?
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [geo.area]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Counting squares
    body: How much carpet does a room need, how much turf a garden? Drag the rectangle bigger and smaller and count the squares. The **area** says how many unit squares fit inside. Is there a quick way to count them?
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 10
        maxH: 8
        w: 3
        h: 2
        show:
          - area

  - kind: problem
    id: rechteck
    widget: numeric
    prompt: A rectangle is 7 m long and 4 m wide. What is its area?
    params: { unit: "m²" }
    answer: { value: 28 }
    feedback:
      - when: "numval(state.input) == 22"
        misconception: area-perimeter
        text: 22 m is the perimeter. The area counts the squares inside, which is 7 rows of 4.
    hints:
      - How many 1 × 1 squares fit inside?
    explanation: 7 · 4 = 28 m².

  - kind: explain
    id: s2
    body: |
      The area of a rectangle is **length times width**.
      A triangle is half as big as the rectangle around it: $A = \frac{b \cdot h}{2}$ (b = base, h = height).

  - kind: problem
    id: dreieck
    widget: numeric
    prompt: A triangle has a base of {{g}} cm and a height of {{h}} cm. What is its area?
    params: { unit: "cm²" }
    answer: { value: "{{g * h / 2}}" }
    feedback:
      - when: "numval(state.input) == g * h"
        misconception: triangle-half
        text: That is the whole rectangle. The triangle is half as big.
    hints:
      - "Base times height, divided by 2."
    explanation: "{{g}} · {{h}} ÷ 2 = {{g * h / 2}} cm²."
    variants:
      params: { g: "int[3,12]", h: "int[2,10]" }
      constraints: ["isInt(g * h / 2)"]
      defaults: { g: 8, h: 5 }

  - kind: problem
    id: punkt-c
    widget: graph
    prompt: Drag C so that triangle ABC has an area of 6.
    params:
      x: [-1, 5]
      y: [-4, 4]
      points: [{ id: A, x: 0, y: 0, draggable: false }, { id: B, x: 4, y: 0, draggable: false }, { id: C, x: 1, y: 1 }]
      segments: [[A, B], [B, C], [C, A]]
    check: { predicate: "abs(state.points.C.y) == 3" }
    feedback:
      - when: "abs(state.points.C.y) == 6 || abs(state.points.C.y) == 1.5"
        text: "The base is 4 long. Which height gives 4 · h : 2 = 6?"
    hints:
      - The base AB is 4 long.
      - "4 · h : 2 = 6, so h = 3."
    explanation: "With height 3, 4 · 3 ÷ 2 = 6. It doesn't matter where C is horizontally."
    difficulty: 2

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: A square has an area of 49 cm². How long is one side?
    params: { unit: cm }
    answer: { value: 7 }
    hints:
      - Which number times itself gives 49?
    explanation: 7 · 7 = 49.

  - kind: problem
    id: rechteck-bauen
    widget: rect
    prompt: Drag out a rectangle with an area of 12 m² and a perimeter of 14 m.
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "area == 12 && perimeter == 14" }
    hints:
      - Which rectangles have 12 m²? Check the perimeter of each.
    explanation: 4 × 3 gives an area of 12 m² and a perimeter of 2 · (4 + 3) = 14 m.

  - kind: problem
    id: c1
    widget: match
    prompt: Which formula belongs to which area?
    params:
      pairs:
        - left: Rectangle
          right: $a \cdot b$
        - left: Triangle
          right: $\frac{g \cdot h}{2}$
        - left: Square
          right: $a^2$
        - left: Parallelogram
          right: $g \cdot h$
        - left: Trapezium
          right: $\frac{(a + c) \cdot h}{2}$
    hints:
      - A parallelogram can be rearranged into a rectangle.
    explanation: All formulas trace back to length times width.

  - kind: problem
    id: intro-c1
    widget: rect
    prompt: A triangle has an area of 10 m². Drag a rectangle that is twice as big – like the rectangle around a triangle.
    params:
      maxW: 10
      maxH: 8
      w: 2
      h: 2
      show:
        - area
    check:
      predicate: area == 20
    hints:
      - A triangle is half as big as the rectangle around it.
      - So the rectangle needs 2 · 10 m² = 20 m², for example 4 m by 5 m.
    explanation: "Any rectangle with 20 m² works, such as 4 × 5 or 2 × 10. A triangle with the same base and height has half of it: 10 m²."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A trapezium has parallel sides of 8 cm and 4 cm and height 5 cm. How large is its area?
    params:
      unit: cm²
    answer:
      value: 30
    hints:
      - Take the mean of the two parallel sides times the height.
    explanation: (8 + 4) ÷ 2 · 5 = 30.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "A **parallelogram** can be rebuilt into a rectangle: cut a triangle off one side and attach it to the other. So A = b · h."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: A parallelogram has base {{g}} cm and height {{h}} cm. What is its area?
    params:
      unit: cm²
    answer:
      value: "{{g * h}}"
    feedback:
      - when: numval(state.input) == g * h / 2
        misconception: triangle-formula
        text: That would be a triangle. The parallelogram is a rebuilt rectangle.
    hints:
      - Rebuild it into a rectangle.
      - Base times height.
    explanation: "{{g}} · {{h}} = {{g * h}} cm². The slanted side does not matter – only the height."
    difficulty: 2
    variants:
      params:
        g: int[4,12]
        h: int[2,9]
      defaults:
        g: 7
        h: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: rect
    prompt: Drag a rectangle with an area of 24 m² and the smallest possible perimeter.
    params:
      maxW: 12
      maxH: 8
      w: 2
      h: 2
    check:
      predicate: area == 24 && perimeter == 20
    hints:
      - Try 2 × 12, 3 × 8, 4 × 6.
      - The closer to a square, the smaller the perimeter.
    explanation: 4 × 6 has a 20 m perimeter, 3 × 8 has 22 m, 2 × 12 already 28 m. Square-like shapes are the most economical.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: A rectangle is 8 m long and 6 m wide. A 3 m × 3 m square is missing from one corner. What is the area of the L shape?
    params:
      unit: m²
    answer:
      value: 39
    feedback:
      - when: numval(state.input) == 45
        misconception: side-not-area
        text: The square is 9 m², not 3 m².
    hints:
      - Whole rectangle minus the missing piece.
      - 48 − 9 = ?
    explanation: 8 · 6 − 3 · 3 = 48 − 9 = 39 m².
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You have 20 m of fence for a rectangular bed. Which shape gives the largest area?
    params:
      options:
        - label: A square with 5 m sides
          correct: true
        - label: Long and narrow, about 9 m by 1 m
          feedback: That is only 9 m² – the square has 25 m².
        - label: All rectangles with a 20 m perimeter are equal
          feedback: 6 · 4 = 24, but 5 · 5 = 25.
    hints:
      - Try 6 · 4 and 5 · 5.
    explanation: (5 + d)(5 − d) = 25 − d². Every departure from the square costs area.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: How many square centimetres are in a square metre?
    params:
      unit: cm²
    answer:
      value: 10000
    feedback:
      - when: numval(state.input) == 100
        misconception: linear-conversion
        text: 100 cm is one side. The area is 100 · 100.
    hints:
      - 1 m = 100 cm – in both directions.
      - 100 cm · 100 cm = ?
    explanation: 100 · 100 = 10,000 cm². Area units jump by a factor of 100, not 10.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "**Pick’s theorem**: a polygon with all corners on grid points has area I + B/2 − 1. Here I counts the points inside and B the points on the boundary."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: A grid polygon has 4 grid points inside and 10 on its boundary. What is its area by Pick’s theorem?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 9
        misconception: forgot-minus-one
        text: Subtract 1 at the end.
    hints:
      - I = 4, B = 10.
      - "4 + 10 : 2 − 1 = ?"
    explanation: 4 + 5 − 1 = 8 square units – without any formula for the shape.
    difficulty: 3

srs:
  cards_from: ["dreieck"]
