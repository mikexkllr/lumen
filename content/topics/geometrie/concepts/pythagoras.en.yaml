id: geo.basics.pythagoras
type: concept
title: The Pythagorean theorem
summary: a² + b² = c² in a right triangle.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [geo.pythagoras]
estimated_minutes: 13
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: a TV is 120 cm wide and 50 cm high. How long is the diagonal?"
    params:
      min: 100
      max: 200
      unit: cm
    answer:
      value: 130
      tolerance: 6
    explanation: 130 cm. Only 10 cm more than the width – you are about to see how to work that out.

  - kind: problem
    id: drei-vier
    widget: numeric
    prompt: A right triangle has short sides of 3 cm and 4 cm. How long is the longest side?
    visual:
      widget: graph
      params: { x: [0, 5], y: [0, 4], points: [{ id: A, x: 0, y: 0, draggable: false }, { id: B, x: 4, y: 0, draggable: false }, { id: C, x: 4, y: 3, draggable: false }], segments: [[A, B], [B, C], [C, A]], showCoordinates: false }
    params: { unit: cm }
    answer: { value: 5 }
    feedback:
      - when: "numval(state.input) == 7"
        misconception: add-sides
        text: The shortcut is shorter than the detour. Side lengths don't simply add up.
    hints:
      - Don't count grid squares. Think of squares on the sides.
      - 3² + 4² = 9 + 16.
    explanation: 9 + 16 = 25, and √25 = 5.

  - kind: explain
    id: s2
    body: |
      In a **right** triangle, $a^2 + b^2 = c^2$.
      c is the longest side. It lies opposite the right angle.
      $3^2 + 4^2 = 25 = 5^2$.

  - kind: problem
    id: hypotenuse
    widget: numeric
    prompt: The short sides are {{a}} and {{b}} long. How long is the longest side?
    answer: { value: "{{c}}" }
    feedback:
      - when: "numval(state.input) == a + b"
        misconception: add-sides
        text: Don't add the sides. Add their squares.
    hints:
      - "{{a}}² + {{b}}² = {{a * a + b * b}}."
      - "Which number times itself gives {{a * a + b * b}}?"
    explanation: "{{a}}² + {{b}}² = {{c * c}} = {{c}}²."
    difficulty: 2
    variants:
      params: { t: "choice[0,1]", k: "choice[1,2,3]" }
      derive: { a: "t == 0 ? 3 * k : 5 * k", b: "t == 0 ? 4 * k : 12 * k", c: "t == 0 ? 5 * k : 13 * k" }
      constraints: ["c <= 39"]
      defaults: { t: 0, k: 2 }

  - kind: problem
    id: abstand
    widget: numeric
    prompt: How far apart are A and B?
    visual:
      widget: graph
      params: { x: [0, 8], y: [0, 8], points: [{ id: A, x: 0, y: 0, draggable: false }, { id: B, x: 6, y: 8, draggable: false }], segments: [[A, B]] }
    answer: { value: 10 }
    hints:
      - How far is it to the right, and how far up?
      - 6 to the right and 8 up.
    explanation: 6² + 8² = 36 + 64 = 100 = 10².
    difficulty: 2

  - kind: problem
    id: leiter
    widget: numeric
    prompt: A 5 m ladder leans against a wall. Its foot is 3 m from the wall. How high does it reach?
    params: { unit: m }
    answer: { value: 4 }
    hints:
      - The ladder is the longest side.
      - 3² + h² = 5².
    explanation: 25 − 9 = 16, and √16 = 4.

  - kind: problem
    id: rechtwinklig
    widget: choice
    prompt: Is a triangle with sides 6, 8 and 11 a right triangle?
    params:
      options:
        - { label: "No", correct: true }
        - { label: "Yes", feedback: "Check: 6² + 8² = 100, but 11² = 121." }
    hints:
      - Compare 6² + 8² with 11².
    explanation: 36 + 64 = 100 ≠ 121. So it is not a right triangle.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An isosceles triangle has legs of 13 cm and a base of 10 cm. How tall is it?
    params:
      unit: cm
    answer:
      value: 12
    hints:
      - The height splits the base into two pieces of 5 cm.
    explanation: 13² − 5² = 144 = 12². The height turns the triangle into two right-angled ones.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Why does $a^2 + b^2 = c^2$ hold?
    reveal:
      body: Put four equal triangles into a square of side a + b. A square $c^2$ stays free. Arrange them differently and $a^2$ and $b^2$ stay free. The free area is the same both times.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: The longest side of a right triangle is {{13 * k}} cm, one short side {{5 * k}} cm. How long is the other short side?
    params:
      unit: cm
    answer:
      value: "{{12 * k}}"
    feedback:
      - when: numval(state.input) == 8 * k
        misconception: subtract-sides
        text: You subtract the squares, not the sides.
    hints:
      - $b^2 = c^2 - a^2$.
      - "{{169 * k * k}} − {{25 * k * k}} = {{144 * k * k}}."
    explanation: $\sqrt{ {{144 * k * k}} } = {{12 * k}}$ cm.
    difficulty: 2
    variants:
      params:
        k: int[1,3]
      defaults:
        k: 1

  - kind: problem
    id: ma-d3
    depth: 2
    widget: graph
    prompt: Drag B so that segment AB is exactly 5 long – but neither horizontal nor vertical.
    params:
      x:
        - -1
        - 5
      y:
        - -1
        - 5
      points:
        - id: A
          x: 0
          y: 0
          draggable: false
        - id: B
          x: 1
          y: 1
      segments:
        - - A
          - B
    check:
      predicate: dist('A', 'B') == 5 && state.points.B.x != 0 && state.points.B.y != 0
    solution:
      state:
        points:
          A:
            x: 0
            y: 0
          B:
            x: 3
            y: 4
    hints:
      - You need x² + y² = 25 with whole numbers.
      - Think of 3, 4, 5.
    explanation: "B = (3 | 4) or (4 | 3): $3^2 + 4^2 = 25 = 5^2$."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: How long is the space diagonal of a cuboid with edges 2, 3 and 6?
    answer:
      value: 7
    hints:
      - "Apply Pythagoras twice: first the floor diagonal, then upwards."
    explanation: 2² + 3² + 6² = 49 = 7². In three dimensions one more square is simply added.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Is a triangle with sides 20, 21 and 29 a right triangle? Work out $20^2 + 21^2$.
    answer:
      value: 841
    hints:
      - 400 + 441.
      - Compare with $29^2$.
    explanation: 400 + 441 = 841 = 29². Yes – the converse of the theorem guarantees the right angle.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Pythagoras only holds with a right angle. In general the **law of cosines** holds: $c^2 = a^2 + b^2 - 2ab \\cos\\gamma$. At 90°, $\\cos\\gamma = 0$ and Pythagoras remains."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: How far is the point (1 | 2 | 2) in space from the origin?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 5
        misconception: sum-coordinates
        text: That is the sum of the coordinates. Square them first.
    hints:
      - "In space: $\\sqrt{x^2 + y^2 + z^2}$."
      - 1 + 4 + 4 = 9.
    explanation: $\sqrt{9} = 3$. Pythagoras applied twice – later this gives vector lengths.
    difficulty: 3

  - kind: problem
    id: ma-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux when you may use Pythagoras’ theorem and what it says.
    params:
      keywords:
        - - rechtwinklig
          - rechter winkel
          - right angle
          - right triangle
          - right-angled
        - - quadrat
          - square
        - - längste
          - hypotenuse
          - longest
          - gegenüber
          - opposite
      sample: Only in a right triangle. The squares of the two short sides add up to the square of the longest side, which lies opposite the right angle.
    explanation: "Key idea: a² + b² = c² – only with a right angle, c opposite it."
    difficulty: 3

srs:
  cards_from: ["hypotenuse"]
