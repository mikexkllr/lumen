id: geo.basics.area
type: concept
title: Flächeninhalt
summary: Wie viele Einheitsquadrate passen hinein?
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [geo.area]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Kästchen zählen
    body: Wie viel Teppich braucht ein Zimmer, wie viel Rasen ein Garten? Zieh das Rechteck größer und kleiner und zähl die Kästchen. Die **Fläche** sagt, wie viele Einheitsquadrate hineinpassen. Gibt es einen schnellen Weg zum Zählen?
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 10
        maxH: 8
        w: 3
        h: 2
        show:
          - area

  - kind: problem
    id: rechteck
    widget: numeric
    prompt: Ein Rechteck ist 7 m lang und 4 m breit. Wie groß ist seine Fläche?
    params: { unit: "m²" }
    answer: { value: 28 }
    feedback:
      - when: "numval(state.input) == 22"
        misconception: area-perimeter
        text: 22 m ist der Umfang. Die Fläche zählt die Quadrate darin – 7 Reihen mit je 4.
    hints:
      - Wie viele 1 × 1-Quadrate passen hinein?
    explanation: 7 · 4 = 28 m².

  - kind: explain
    id: s2
    body: |
      Fläche eines Rechtecks – **Länge mal Breite**.
      Ein Dreieck ist halb so groß wie das Rechteck um es herum: $A = \frac{g \cdot h}{2}$.

  - kind: problem
    id: dreieck
    widget: numeric
    prompt: Ein Dreieck hat die Grundseite {{g}} cm und die Höhe {{h}} cm. Wie groß ist seine Fläche?
    params: { unit: "cm²" }
    answer: { value: "{{g * h / 2}}" }
    feedback:
      - when: "numval(state.input) == g * h"
        misconception: triangle-half
        text: Das ist das ganze Rechteck. Das Dreieck ist halb so groß.
    hints:
      - "Grundseite mal Höhe, durch 2."
    explanation: "{{g}} · {{h}} : 2 = {{g * h / 2}} cm²."
    variants:
      params: { g: "int[3,12]", h: "int[2,10]" }
      constraints: ["isInt(g * h / 2)"]
      defaults: { g: 8, h: 5 }

  - kind: problem
    id: punkt-c
    widget: graph
    prompt: Ziehe C so, dass das Dreieck ABC die Fläche 6 hat.
    params:
      x: [-1, 5]
      y: [-4, 4]
      points: [{ id: A, x: 0, y: 0, draggable: false }, { id: B, x: 4, y: 0, draggable: false }, { id: C, x: 1, y: 1 }]
      segments: [[A, B], [B, C], [C, A]]
    check: { predicate: "abs(state.points.C.y) == 3" }
    feedback:
      - when: "abs(state.points.C.y) == 6 || abs(state.points.C.y) == 1.5"
        text: "Die Grundseite ist 4 lang. Welche Höhe ergibt 4 · h : 2 = 6?"
    hints:
      - Die Grundseite AB ist 4 lang.
      - "4 · h : 2 = 6 – also h = 3."
    explanation: "Mit Höhe 3 gilt 4 · 3 : 2 = 6. Wo C waagerecht liegt, ist egal!"
    difficulty: 2

  - kind: problem
    id: quadrat
    widget: numeric
    prompt: Ein Quadrat hat die Fläche 49 cm². Wie lang ist eine Seite?
    params: { unit: cm }
    answer: { value: 7 }
    hints:
      - Welche Zahl mal sich selbst ergibt 49?
    explanation: 7 · 7 = 49.

  - kind: problem
    id: rechteck-bauen
    widget: rect
    prompt: Zieh ein Rechteck mit 12 m² Fläche und 14 m Umfang.
    params: { maxW: 10, maxH: 8, w: 2, h: 2 }
    check: { predicate: "area == 12 && perimeter == 14" }
    hints:
      - Welche Rechtecke haben 12 m²? Prüfe bei jedem den Umfang.
    explanation: 4 × 3 – Fläche 12 m², Umfang 2 · (4 + 3) = 14 m.

  - kind: problem
    id: c1
    widget: match
    prompt: Welche Formel gehört zu welcher Fläche?
    params:
      pairs:
        - left: Rechteck
          right: $a \cdot b$
        - left: Dreieck
          right: $\frac{g \cdot h}{2}$
        - left: Quadrat
          right: $a^2$
        - left: Parallelogramm
          right: $g \cdot h$
        - left: Trapez
          right: $\frac{(a + c) \cdot h}{2}$
    hints:
      - Ein Parallelogramm lässt sich zu einem Rechteck umbauen.
    explanation: Alle Formeln führen auf Länge mal Breite zurück.

  - kind: problem
    id: intro-c1
    widget: rect
    prompt: Ein Dreieck hat 10 m² Fläche. Zieh ein Rechteck, das doppelt so groß ist – so wie das Rechteck um ein Dreieck herum.
    params:
      maxW: 10
      maxH: 8
      w: 2
      h: 2
      show:
        - area
    check:
      predicate: area == 20
    hints:
      - Ein Dreieck ist halb so groß wie das Rechteck um es herum.
      - Das Rechteck braucht also 2 · 10 m² = 20 m², zum Beispiel 4 m mal 5 m.
    explanation: "Jedes Rechteck mit 20 m² passt, etwa 4 × 5 oder 2 × 10. Ein Dreieck mit gleicher Grundseite und Höhe hat die Hälfte: 10 m²."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Trapez hat die parallelen Seiten 8 cm und 4 cm und die Höhe 5 cm. Wie groß ist seine Fläche?
    params:
      unit: cm²
    answer:
      value: 30
    hints:
      - Nimm den Mittelwert der beiden parallelen Seiten mal die Höhe.
    explanation: "(8 + 4) : 2 · 5 = 30."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Ein **Parallelogramm** lässt sich zum Rechteck umbauen: Schneide an einer Seite ein Dreieck ab und setze es auf der anderen Seite an. Darum gilt A = g · h."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Ein Parallelogramm hat die Grundseite {{g}} cm und die Höhe {{h}} cm. Wie groß ist seine Fläche?
    params:
      unit: cm²
    answer:
      value: "{{g * h}}"
    feedback:
      - when: numval(state.input) == g * h / 2
        misconception: triangle-formula
        text: Das wäre ein Dreieck. Das Parallelogramm ist ein umgebautes Rechteck.
    hints:
      - Bau es zum Rechteck um.
      - Grundseite mal Höhe.
    explanation: "{{g}} · {{h}} = {{g * h}} cm². Die schräge Seite spielt keine Rolle – nur die Höhe."
    difficulty: 2
    variants:
      params:
        g: int[4,12]
        h: int[2,9]
      defaults:
        g: 7
        h: 4

  - kind: problem
    id: ma-d3
    depth: 2
    widget: rect
    prompt: Zieh ein Rechteck mit 24 m² Fläche und möglichst kleinem Umfang.
    params:
      maxW: 12
      maxH: 8
      w: 2
      h: 2
    check:
      predicate: area == 24 && perimeter == 20
    hints:
      - Probiere 2 × 12, 3 × 8, 4 × 6.
      - Je näher an einem Quadrat, desto kleiner der Umfang.
    explanation: 4 × 6 hat 20 m Umfang, 3 × 8 hat 22 m, 2 × 12 schon 28 m. Quadratähnliche Formen sind am sparsamsten.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Ein Rechteck ist 8 m lang und 6 m breit. In einer Ecke fehlt ein Quadrat von 3 m × 3 m. Wie groß ist die L-förmige Fläche?
    params:
      unit: m²
    answer:
      value: 39
    feedback:
      - when: numval(state.input) == 45
        misconception: side-not-area
        text: Das Quadrat hat 9 m², nicht 3 m².
    hints:
      - Ganzes Rechteck minus das fehlende Stück.
      - 48 − 9 = ?
    explanation: 8 · 6 − 3 · 3 = 48 − 9 = 39 m².
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Du hast 20 m Zaun für ein rechteckiges Beet. Welche Form gibt die größte Fläche?
    params:
      options:
        - label: Ein Quadrat mit 5 m Seite
          correct: true
        - label: Lang und schmal, etwa 9 m mal 1 m
          feedback: Das sind nur 9 m² – das Quadrat hat 25 m².
        - label: Alle Rechtecke mit 20 m Umfang sind gleich groß
          feedback: 6 · 4 = 24, aber 5 · 5 = 25.
    hints:
      - Probier 6 · 4 und 5 · 5.
    explanation: (5 + d)(5 − d) = 25 − d². Jede Abweichung vom Quadrat kostet Fläche.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Wie viele Quadratzentimeter hat ein Quadratmeter?
    params:
      unit: cm²
    answer:
      value: 10000
    feedback:
      - when: numval(state.input) == 100
        misconception: linear-conversion
        text: 100 cm ist eine Seite. Die Fläche ist 100 · 100.
    hints:
      - 1 m = 100 cm – in beide Richtungen.
      - 100 cm · 100 cm = ?
    explanation: 100 · 100 = 10 000 cm². Flächeneinheiten springen um den Faktor 100, nicht 10.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Der **Satz von Pick**: Ein Vieleck mit allen Ecken auf Gitterpunkten hat die Fläche I + R/2 − 1. Dabei zählt I die Punkte innen und R die Punkte auf dem Rand."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: Ein Gitter-Vieleck hat 4 Gitterpunkte im Inneren und 10 auf dem Rand. Wie groß ist seine Fläche nach Pick?
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 9
        misconception: forgot-minus-one
        text: Am Ende noch minus 1.
    hints:
      - I = 4, R = 10.
      - "4 + 10 : 2 − 1 = ?"
    explanation: 4 + 5 − 1 = 8 Flächeneinheiten – ganz ohne Formel für die Form.
    difficulty: 3

srs:
  cards_from: ["dreieck"]
