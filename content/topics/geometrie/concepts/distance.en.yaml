id: geo.basics.distance
type: concept
title: Pythagoras in everyday life
summary: Diagonals and shortcuts.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wiese
    widget: numeric
    prompt: A rectangular field is 30 m wide and 40 m long. How long is the path straight across the diagonal?
    params: { unit: m }
    answer: { value: 50 }
    feedback:
      - when: "numval(state.input) == 70"
        misconception: add-sides
        text: 70 m is the way around the edge. The diagonal is shorter.
    hints:
      - 30² + 40² = c².
    explanation: 900 + 1600 = 2500, and $\sqrt{2500} = 50$. The shortcut saves 20 m.

  - kind: explain
    body: |
      Whole numbers that fit exactly are called **Pythagorean triples**. 3, 4, 5 is the best known, along with every multiple of it.
      Builders use them to check right angles.

  - kind: problem
    id: tripel
    widget: numeric
    prompt: The legs are {{3 * k}} cm and {{4 * k}} cm long. How long is the hypotenuse?
    params: { unit: cm }
    answer: { value: "{{5 * k}}" }
    hints:
      - This is the 3-4-5 triangle, {{k}} times as big.
    explanation: "{{5 * k}} cm, which is {{k}} times 5."
    variants:
      params: { k: "int[2,12]" }
      defaults: { k: 3 }

  - kind: problem
    id: rechtwinklig
    widget: choice
    prompt: A triangle has sides 5, 12 and 13. Is it a right triangle?
    params:
      options:
        - { label: "Yes: 25 + 144 = 169", correct: true }
        - { label: "No", feedback: "Check 5² + 12² against 13²." }
    hints:
      - Compare a² + b² with c².
    explanation: 5² + 12² = 169 = 13². So it is a right triangle.

  - kind: problem
    id: bildschirm
    widget: choice
    prompt: A screen is 48 cm wide and 36 cm tall. What is its diagonal?
    params:
      layout: grid
      options:
        - { label: 60 cm, correct: true }
        - { label: 84 cm, feedback: "That is width plus height." }
        - { label: 52 cm, feedback: "Work out 48² + 36²." }
    hints:
      - 48 = 4 · 12 and 36 = 3 · 12.
    explanation: That is 3-4-5 times 12, so 60 cm.

srs:
  cards_from: [tripel, rechtwinklig]
