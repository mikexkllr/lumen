id: geo.basics.distance
type: concept
title: Pythagoras in everyday life
summary: Diagonals and shortcuts.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: wiese
    widget: numeric
    prompt: A rectangular field is 30 m wide and 40 m long. How long is the path straight across the diagonal?
    params: { unit: m }
    answer: { value: 50 }
    feedback:
      - when: "numval(state.input) == 70"
        misconception: add-sides
        text: 70 m is the way around the edge. The diagonal is shorter.
    hints:
      - 30² + 40² = c².
    explanation: 900 + 1600 = 2500, and $\sqrt{2500} = 50$. The shortcut saves 20 m.

  - kind: explain
    id: s2
    body: |
      Whole numbers that fit exactly are called **Pythagorean triples**. 3, 4, 5 is the best known, along with every multiple of it.
      Builders use them to check right angles.

  - kind: problem
    id: tripel
    widget: numeric
    prompt: The legs are {{3 * k}} cm and {{4 * k}} cm long. How long is the hypotenuse?
    params: { unit: cm }
    answer: { value: "{{5 * k}}" }
    hints:
      - This is the 3-4-5 triangle, {{k}} times as big.
    explanation: "{{5 * k}} cm, which is {{k}} times 5."
    variants:
      params: { k: "int[2,12]" }
      defaults: { k: 3 }

  - kind: problem
    id: rechtwinklig
    widget: choice
    prompt: A triangle has sides 5, 12 and 13. Is it a right triangle?
    params:
      options:
        - { label: "Yes: 25 + 144 = 169", correct: true }
        - { label: "No", feedback: "Check 5² + 12² against 13²." }
    hints:
      - Compare a² + b² with c².
    explanation: 5² + 12² = 169 = 13². So it is a right triangle.

  - kind: problem
    id: bildschirm
    widget: choice
    prompt: A screen is 48 cm wide and 36 cm tall. What is its diagonal?
    params:
      layout: grid
      options:
        - { label: 60 cm, correct: true }
        - { label: 84 cm, feedback: "That is width plus height." }
        - { label: 52 cm, feedback: "Work out 48² + 36²." }
    hints:
      - 48 = 4 · 12 and 36 = 3 · 12.
    explanation: That is 3-4-5 times 12, so 60 cm.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How far apart are the points (−2, 1) and (4, 9)?
    answer:
      value: 10
    hints:
      - The differences are 6 and 8 – those are the legs.
    explanation: √(6² + 8²) = 10. The distance formula is Pythagoras on the coordinate plane.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "The **distance formula** is Pythagoras on a grid: $d = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$. The differences in x and y are the legs."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: How far apart are ({{a}} | {{b}}) and ({{a + 3 * k}} | {{b + 4 * k}})?
    answer:
      value: "{{5 * k}}"
    feedback:
      - when: numval(state.input) == 7 * k
        misconception: manhattan
        text: That is the path around the corner. The straight line is shorter.
    hints:
      - "Difference in x: {{3 * k}}, in y: {{4 * k}}."
      - $\sqrt{ {{9 * k * k}} + {{16 * k * k}} }$
    explanation: $\sqrt{ {{25 * k * k}} } = {{5 * k}}$.
    difficulty: 2
    variants:
      params:
        a: int[-4,4]
        b: int[-4,4]
        k: int[1,3]
      defaults:
        a: 1
        b: 2
        k: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: graph
    prompt: Drag B so that segment AB is exactly 10 long and slanted.
    params:
      x:
        - -1
        - 9
      y:
        - -1
        - 9
      points:
        - id: A
          x: 0
          y: 0
          draggable: false
        - id: B
          x: 2
          y: 1
      segments:
        - - A
          - B
    check:
      predicate: dist('A', 'B') == 10 && state.points.B.x != 0 && state.points.B.y != 0
    solution:
      state:
        points:
          A:
            x: 0
            y: 0
          B:
            x: 6
            y: 8
    hints:
      - Double the triple 3, 4, 5.
      - B = (6 | 8) or (8 | 6).
    explanation: $6^2 + 8^2 = 100 = 10^2$. Every multiple of a triple is a triple again.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How many Pythagorean triples are there that are **not** multiples of one another?
    params:
      options:
        - label: Infinitely many
          correct: true
        - label: Only 3-4-5 and 5-12-13
          feedback: 8-15-17 and 7-24-25 belong too.
        - label: About a hundred
          feedback: The formula (m² − n², 2mn, m² + n²) keeps giving new ones.
    hints:
      - Try m = 4 and n = 1 in (m² − n², 2mn, m² + n²).
    explanation: Euclid’s formula generates all of them. For exponents above 2 there is no solution – Fermat’s last theorem.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "**Euclid’s formula**: for whole numbers m > n, $m^2 - n^2$, $2mn$ and $m^2 + n^2$ always form a Pythagorean triple. With m = 2 and n = 1 you get 3, 4, 5."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Put m = 3 and n = 2 into Euclid’s formula. How long is the hypotenuse $m^2 + n^2$?
    answer:
      value: 13
    hints:
      - 9 + 4.
      - The legs are 5 and 12.
    explanation: "5, 12, 13: 25 + 144 = 169 = 13²."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: In Manhattan a taxi only drives along the grid of streets. How far is it from (0 | 0) to (3 | 4)?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 5
        misconception: euclid-distance
        text: That is as the crow flies. The taxi cannot drive diagonally through buildings.
    hints:
      - First 3 to the right, then 4 up.
      - 3 + 4 = ?
    explanation: 7 blocks. This »taxicab metric« is another way to measure distance – mathematicians study many such metrics.
    difficulty: 3

srs:
  cards_from: [tripel, rechtwinklig]
