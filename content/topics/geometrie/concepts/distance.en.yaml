id: geo.basics.distance
type: concept
title: Pythagoras in everyday life
summary: Diagonals and shortcuts.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: wiese
    widget: numeric
    prompt: A rectangular field is 30 m wide and 40 m long. How long is the path straight across the diagonal?
    params: { unit: m }
    answer: { value: 50 }
    feedback:
      - when: "numval(state.input) == 70"
        misconception: add-sides
        text: 70 m is the way around the edge. The diagonal is shorter.
    hints:
      - 30² + 40² = c².
    explanation: 900 + 1600 = 2500, and $\sqrt{2500} = 50$. The shortcut saves 20 m.

  - kind: explain
    id: s2
    body: |
      Whole numbers that fit exactly are called **Pythagorean triples**. 3, 4, 5 is the best known, along with every multiple of it.
      Builders use them to check right angles.

  - kind: problem
    id: tripel
    widget: numeric
    prompt: The legs are {{3 * k}} cm and {{4 * k}} cm long. How long is the hypotenuse?
    params: { unit: cm }
    answer: { value: "{{5 * k}}" }
    hints:
      - This is the 3-4-5 triangle, {{k}} times as big.
    explanation: "{{5 * k}} cm, which is {{k}} times 5."
    variants:
      params: { k: "int[2,12]" }
      defaults: { k: 3 }

  - kind: problem
    id: rechtwinklig
    widget: choice
    prompt: A triangle has sides 5, 12 and 13. Is it a right triangle?
    params:
      options:
        - { label: "Yes: 25 + 144 = 169", correct: true }
        - { label: "No", feedback: "Check 5² + 12² against 13²." }
    hints:
      - Compare a² + b² with c².
    explanation: 5² + 12² = 169 = 13². So it is a right triangle.

  - kind: problem
    id: bildschirm
    widget: choice
    prompt: A screen is 48 cm wide and 36 cm tall. What is its diagonal?
    params:
      layout: grid
      options:
        - { label: 60 cm, correct: true }
        - { label: 84 cm, feedback: "That is width plus height." }
        - { label: 52 cm, feedback: "Work out 48² + 36²." }
    hints:
      - 48 = 4 · 12 and 36 = 3 · 12.
    explanation: That is 3-4-5 times 12, so 60 cm.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How far apart are the points (−2, 1) and (4, 9)?
    answer:
      value: 10
    hints:
      - The differences are 6 and 8 – those are the legs.
    explanation: √(6² + 8²) = 10. The distance formula is Pythagoras on the coordinate plane.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How many Pythagorean triples are there that are **not** multiples of one another?
    params:
      options:
        - label: Infinitely many
          correct: true
        - label: Only 3-4-5 and 5-12-13
          feedback: 8-15-17 and 7-24-25 belong too.
        - label: About a hundred
          feedback: The formula (m² − n², 2mn, m² + n²) keeps giving new ones.
    hints:
      - Try m = 4 and n = 1 in (m² − n², 2mn, m² + n²).
    explanation: Euclid’s formula generates all of them. For exponents above 2 there is no solution – Fermat’s last theorem.
    difficulty: 3

srs:
  cards_from: [tripel, rechtwinklig]
