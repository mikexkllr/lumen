id: geo.basics.distance
type: concept
title: Pythagoras im Alltag
summary: Diagonalen und Abkürzungen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: wiese
    widget: numeric
    prompt: Ein rechteckiges Feld ist 30 m breit und 40 m lang. Wie lang ist der Weg quer über die Diagonale?
    params: { unit: m }
    answer: { value: 50 }
    feedback:
      - when: "numval(state.input) == 70"
        misconception: add-sides
        text: 70 m ist der Weg außen herum. Die Diagonale ist kürzer.
    hints:
      - 30² + 40² = c².
    explanation: 900 + 1600 = 2500, und $\sqrt{2500} = 50$. Die Abkürzung spart 20 m.

  - kind: explain
    id: s2
    body: |
      Ganze Zahlen, die genau passen, heißen **pythagoreische Tripel**. 3, 4, 5 ist das bekannteste – und jedes Vielfache davon.
      Handwerker prüfen damit rechte Winkel.

  - kind: problem
    id: tripel
    widget: numeric
    prompt: Die Katheten sind {{3 * k}} cm und {{4 * k}} cm lang. Wie lang ist die Hypotenuse?
    params: { unit: cm }
    answer: { value: "{{5 * k}}" }
    hints:
      - Das ist das 3-4-5-Dreieck, {{k}}-mal so groß.
    explanation: "{{5 * k}} cm – das {{k}}-Fache von 5."
    variants:
      params: { k: "int[2,12]" }
      defaults: { k: 3 }

  - kind: problem
    id: rechtwinklig
    widget: choice
    prompt: Ein Dreieck hat die Seiten 5, 12 und 13. Ist es rechtwinklig?
    params:
      options:
        - { label: "Ja – 25 + 144 = 169", correct: true }
        - { label: Nein, feedback: "Prüfe 5² + 12² gegen 13²." }
    hints:
      - Vergleiche a² + b² mit c².
    explanation: 5² + 12² = 169 = 13². Also rechtwinklig.

  - kind: problem
    id: bildschirm
    widget: choice
    prompt: Ein Bildschirm ist 48 cm breit und 36 cm hoch. Wie groß ist seine Diagonale?
    params:
      layout: grid
      options:
        - { label: 60 cm, correct: true }
        - { label: 84 cm, feedback: "Das ist Breite plus Höhe." }
        - { label: 52 cm, feedback: "Rechne 48² + 36²." }
    hints:
      - 48 = 4 · 12 und 36 = 3 · 12.
    explanation: Das ist 3-4-5 mal 12 – also 60 cm.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie weit sind die Punkte (−2 | 1) und (4 | 9) voneinander entfernt?
    answer:
      value: 10
    hints:
      - Die Unterschiede sind 6 und 8 – das sind die Katheten.
    explanation: √(6² + 8²) = 10. Die Abstandsformel ist Pythagoras im Koordinatensystem.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Die **Abstandsformel** ist Pythagoras im Koordinatensystem: $d = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$. Die Unterschiede in x und y sind die Katheten."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Wie weit sind ({{a}} | {{b}}) und ({{a + 3 * k}} | {{b + 4 * k}}) voneinander entfernt?
    answer:
      value: "{{5 * k}}"
    feedback:
      - when: numval(state.input) == 7 * k
        misconception: manhattan
        text: Das ist der Weg um die Ecke. Die direkte Strecke ist kürzer.
    hints:
      - "Unterschied in x: {{3 * k}}, in y: {{4 * k}}."
      - $\sqrt{ {{9 * k * k}} + {{16 * k * k}} }$
    explanation: $\sqrt{ {{25 * k * k}} } = {{5 * k}}$.
    difficulty: 2
    variants:
      params:
        a: int[-4,4]
        b: int[-4,4]
        k: int[1,3]
      defaults:
        a: 1
        b: 2
        k: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: graph
    prompt: Ziehe B so, dass die Strecke AB genau 10 lang ist und schräg verläuft.
    params:
      x:
        - -1
        - 9
      y:
        - -1
        - 9
      points:
        - id: A
          x: 0
          y: 0
          draggable: false
        - id: B
          x: 2
          y: 1
      segments:
        - - A
          - B
    check:
      predicate: dist('A', 'B') == 10 && state.points.B.x != 0 && state.points.B.y != 0
    solution:
      state:
        points:
          A:
            x: 0
            y: 0
          B:
            x: 6
            y: 8
    hints:
      - Verdopple das Tripel 3, 4, 5.
      - B = (6 | 8) oder (8 | 6).
    explanation: $6^2 + 8^2 = 100 = 10^2$. Jedes Vielfache eines Tripels ist wieder eines.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie viele pythagoreische Tripel gibt es, die **keine** Vielfachen voneinander sind?
    params:
      options:
        - label: Unendlich viele
          correct: true
        - label: Nur 3-4-5 und 5-12-13
          feedback: Auch 8-15-17 und 7-24-25 gehören dazu.
        - label: Etwa hundert
          feedback: Die Formel (m² − n², 2mn, m² + n²) liefert immer neue.
    hints:
      - Probier m = 4 und n = 1 in (m² − n², 2mn, m² + n²).
    explanation: Euklids Formel erzeugt alle. Für Hochzahlen über 2 gibt es dagegen keine Lösung – Fermats letzter Satz.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "**Euklids Formel**: Für ganze Zahlen m > n liefern $m^2 - n^2$, $2mn$ und $m^2 + n^2$ immer ein pythagoreisches Tripel. Mit m = 2 und n = 1 entsteht 3, 4, 5."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Setze m = 3 und n = 2 in Euklids Formel ein. Wie lang ist die Hypotenuse $m^2 + n^2$?
    answer:
      value: 13
    hints:
      - 9 + 4.
      - Die Katheten sind 5 und 12.
    explanation: "5, 12, 13: 25 + 144 = 169 = 13²."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: numeric
    prompt: In Manhattan fährt ein Taxi nur entlang der Straßen im Gitter. Wie weit ist es von (0 | 0) nach (3 | 4)?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 5
        misconception: euclid-distance
        text: Das ist der Luftweg. Das Taxi kann nicht schräg durch die Häuser.
    hints:
      - Erst 3 nach rechts, dann 4 nach oben.
      - 3 + 4 = ?
    explanation: 7 Blocks. Diese »Taxi-Metrik« ist eine andere Art, Abstand zu messen – Mathematiker untersuchen viele solche Metriken.
    difficulty: 3

srs:
  cards_from: [tripel, rechtwinklig]
