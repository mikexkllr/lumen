id: geo.basics.angles
type: concept
title: Winkelsummen
summary: Im Dreieck sind es immer 180°.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [geo.angles]
estimated_minutes: 13
steps:
  - kind: problem
    id: dritter
    widget: numeric
    prompt: Ein Dreieck hat die Winkel 50° und 60°. Wie groß ist der dritte Winkel?
    params: { unit: "°" }
    answer: { value: 70 }
    hints:
      - Alle drei Winkel zusammen ergeben 180°.
    explanation: 180° − 50° − 60° = 70°.

  - kind: explain
    id: s2
    body: |
      Die drei Winkel in **jedem** **Dreieck** ergeben zusammen **180°**.
      Eine gerade Linie – ein gestreckter Winkel – hat ebenfalls 180°.

  - kind: problem
    id: dritter-variante
    widget: numeric
    prompt: Ein Dreieck hat die Winkel {{a}}° und {{b}}°. Wie groß ist der dritte?
    params: { unit: "°" }
    answer: { value: "{{180 - a - b}}" }
    feedback:
      - when: "numval(state.input) == 360 - a - b"
        misconception: angle-sum
        text: 360° ist die Winkelsumme im Viereck. Im Dreieck sind es 180°.
    hints:
      - "180° − {{a}}° − {{b}}°."
    explanation: "180° − {{a}}° − {{b}}° = {{180 - a - b}}°."
    variants:
      params: { a: "int[20,90]", b: "int[20,80]" }
      constraints: ["a + b < 170"]
      defaults: { a: 35, b: 85 }

  - kind: problem
    id: nebenwinkel
    widget: numeric
    prompt: Zwei Winkel liegen nebeneinander an einer geraden Linie. Einer ist 115°. Wie groß ist der andere?
    params: { unit: "°" }
    answer: { value: 65 }
    hints:
      - Eine gerade Linie hat 180°.
    explanation: 180° − 115° = 65°.

  - kind: problem
    id: viereck
    widget: choice
    prompt: Wie groß ist die Winkelsumme im Viereck?
    params:
      layout: grid
      options:
        - { label: "360°", correct: true }
        - { label: "180°", feedback: "Das gilt fürs Dreieck. Ein Viereck lässt sich in zwei Dreiecke teilen." }
        - { label: "270°", feedback: "Denk an ein Rechteck – vier rechte Winkel." }
        - { label: "540°", feedback: "Das wäre ein Fünfeck." }
    hints:
      - Zeichne eine Diagonale ins Viereck.
    explanation: Eine Diagonale teilt das Viereck in zwei Dreiecke – 2 · 180° = 360°.

  - kind: problem
    id: dritter-winkel
    widget: angle
    prompt: Ein Dreieck hat die Winkel 50° und 70°. Stelle den dritten Winkel ein.
    params: { initial: 20, max: 180 }
    answer: { value: 60 }
    hints:
      - Alle drei zusammen ergeben 180°.
    explanation: 180° − 50° − 70° = 60°.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Ein Dreieck kann die Winkel 90°, 45° und 45° haben.
          right: true
        - text: Ein Dreieck kann die Winkel 100°, 50° und 40° haben.
          right: false
          why: Das sind zusammen 190°.
        - text: Im gleichseitigen Dreieck hat jeder Winkel 60°.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Wie groß ist die Winkelsumme im Siebeneck?
    params:
      unit: °
    answer:
      value: 900
    hints:
      - Von einer Ecke aus lässt sich jedes n-Eck in n − 2 Dreiecke teilen.
    explanation: "5 Dreiecke zu je 180° sind 900°. Allgemein: (n − 2) · 180°."
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: Kreuzen sich zwei Geraden, liegen sich **Scheitelwinkel** gegenüber. Sie sind immer gleich groß. Nebeneinander liegende Winkel ergänzen sich zu 180°.

  - kind: problem
    id: ma-d2
    depth: 2
    widget: angle
    prompt: Zwei Geraden kreuzen sich. Ein Winkel misst 40°. Stelle den Winkel daneben ein.
    params:
      initial: 10
      snap: 5
      max: 180
    answer:
      value: 140
    hints:
      - Nebenwinkel ergeben zusammen eine gerade Linie.
      - 180° − 40° = ?
    explanation: 180° − 40° = 140°. Der gegenüberliegende Winkel ist wieder 40°.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: Ein gleichschenkliges Dreieck hat an der Spitze {{a}}°. Wie groß ist jeder der beiden Basiswinkel?
    params:
      unit: °
    answer:
      value: "{{(180 - a) / 2}}"
    feedback:
      - when: numval(state.input) == 180 - a
        misconception: forgot-halve
        text: Das sind beide Basiswinkel zusammen. Sie sind gleich groß – teile durch 2.
    hints:
      - Für die Basis bleiben 180° − {{a}}°.
      - Die beiden Basiswinkel sind gleich.
    explanation: "(180° − {{a}}°) : 2 = {{(180 - a) / 2}}°."
    difficulty: 2
    variants:
      params:
        a: step[20,140,10]
      defaults:
        a: 40

  - kind: problem
    id: ma-d4
    depth: 2
    widget: numeric
    prompt: Ein Fünfeck hat die Winkel 100°, 110°, 120° und 90°. Wie groß ist der fünfte Winkel?
    params:
      unit: °
    answer:
      value: 120
    feedback:
      - when: numval(state.input) == -60
        misconception: quad-sum
        text: Ein Fünfeck hat nicht 360°. Es besteht aus drei Dreiecken.
    hints:
      - "Winkelsumme: (5 − 2) · 180° = 540°."
      - 540° − 420° = ?
    explanation: 540° − (100° + 110° + 120° + 90°) = 120°.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: order
    prompt: Warum hat jedes Dreieck 180°? Ordne den Beweis.
    params:
      items:
        - label: Zeichne durch die Spitze C eine Parallele zur Grundseite.
        - label: Der Winkel bei A taucht an der Parallele als Wechselwinkel wieder auf.
        - label: Dasselbe gilt für den Winkel bei B.
        - label: Die drei Winkel liegen bei C nebeneinander auf einer Geraden.
        - label: Eine Gerade hat 180° – also auch die Winkelsumme.
    hints:
      - Zuerst braucht man eine Hilfslinie.
    explanation: Der Beweis nutzt Parallelen. Auf einer Kugel gibt es keine – dort haben Dreiecke mehr als 180°.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: numeric
    prompt: Du läufst einmal um ein Sechseck herum und drehst dich an jeder Ecke nach links. Um wie viel Grad hast du dich insgesamt gedreht?
    params:
      unit: °
    answer:
      value: 360
    feedback:
      - when: numval(state.input) == 720
        misconception: interior-sum
        text: Das ist die Summe der Innenwinkel. Gedreht wird um die Außenwinkel.
    hints:
      - Am Ende schaust du wieder in dieselbe Richtung wie am Start.
      - Eine volle Umdrehung.
    explanation: Die Außenwinkel jedes Vielecks ergeben zusammen 360° – egal wie viele Ecken.
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: "Auf einer **Kugel** gilt die 180°-Regel nicht. Ein Dreieck vom Nordpol zum Äquator, ein Viertel um die Erde und zurück hat drei rechte Winkel: 270°."

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum die Winkel in jedem Viereck zusammen 360° ergeben.
    params:
      keywords:
        - - dreieck
          - triangle
        - - diagonale
          - diagonal
          - teilen
          - split
          - cut
        - - "180"
          - zwei
          - two
          - twice
      sample: Ich teile das Viereck mit einer Diagonale in zwei Dreiecke. Jedes Dreieck hat 180 Grad. Zusammen sind das zweimal 180, also 360 Grad.
    explanation: "Kernidee: Jedes n-Eck zerfällt in n − 2 Dreiecke."
    difficulty: 3

srs:
  cards_from: ["dritter-variante"]
