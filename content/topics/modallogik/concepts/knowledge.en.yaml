id: logic.modal.knowledge
type: concept
title: "Who knows what?"
summary: "Knowing means: it is true in every world I consider possible."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: Ann and Ben wear hats, red or blue. Each sees only the other's hat. Ann sees a red hat. Does Ann know the colour of her own hat?
    params:
      options:
        - label: No – for her both "red" and "blue" are still possible.
          correct: true
        - label: Yes, red – like Ben's.
          feedback: Nothing says both hats are the same.
        - label: Yes, blue – they must differ.
          feedback: That was not said either.
    hints:
      - Which situations fit what Ann sees?
      - She only sees Ben's hat.
    explanation: "Ann considers two worlds possible: (red, red) and (blue, red). Since her hat differs between them, she does not know it."

  - kind: explain
    id: c2
    body: The logic of knowledge thinks in possible worlds. Someone knows something exactly when it is true in every world they still consider possible after their observations.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Three children wear hats, each red or blue. How many possible worlds are there in total?
    answer:
      value: 8
    hints:
      - Each child has 2 options.
      - 2 · 2 · 2 = ?
    explanation: 2³ = 8 worlds. Every observation and every announcement strikes out worlds – just like clues in a logic grid.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Child A sees the hats of B and C, not its own. How many of the 8 worlds does A still consider possible?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 8
        misconception: no-update
        text: A does see two hats – that rules out many worlds.
    hints:
      - B and C are fixed. What is still open?
      - "Only its own hat: red or blue."
    explanation: Two worlds remain, differing only in A's own hat. In this logic, seeing means ruling out worlds.

  - kind: problem
    id: c5
    widget: choice
    prompt: 'The teacher says aloud: "At least one hat is red." A sees two blue hats. What does A know now?'
    params:
      options:
        - label: My hat is red.
          correct: true
        - label: Nothing new.
          feedback: One of A's two worlds contradicts the announcement.
        - label: My hat is blue.
          feedback: Then there would be no red hat – the announcement would be false.
    hints:
      - Which of A's two worlds does not fit the announcement?
      - (blue, blue, blue) has no red hat.
    explanation: The announcement strikes out the world "all blue". A single world remains – and in it A's hat is red.

  - kind: problem
    id: c6
    widget: buckets
    prompt: The teacher said "at least one hat is red". Does A know its colour?
    params:
      buckets:
        - id: b1
          label: A knows
        - id: b2
          label: A does not know
      items:
        - label: A sees blue and blue
          bucket: b1
        - label: A sees red and blue
          bucket: b2
        - label: A sees red and red
          bucket: b2
    hints:
      - Check whether the announcement strikes one of A's worlds.
      - If A already sees a red hat, it strikes nothing.
    explanation: Only if A sees no red hat does the announcement reveal something. Otherwise A already knew – the announcement changes nothing for A.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: What distinguishes "Ann knows that p" from "Ann believes that p"?
    params:
      options:
        - label: Knowledge must be true – belief can be false.
          correct: true
        - label: Nothing.
          feedback: You can believe something false, but not know it.
        - label: Knowledge is surer but can also be false.
          feedback: Then it would be belief. Knowledge rules out error.
    hints:
      - Can you know that 2 + 2 = 5?
      - You can believe it, though.
    explanation: "For knowledge the rule holds: if someone knows p, then p is true. That is because the actual world is always among the worlds one considers possible. This does not hold for belief."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A sees two red hats. Does A know that B knows that at least one hat is red – even without any announcement?
    params:
      options:
        - label: Yes – B sees C's red hat, and A sees that B sees it.
          correct: true
        - label: No, A does not know its own hat.
          feedback: A does not need it here – B can see C.
        - label: Only if A's hat is red.
          feedback: Even then all that counts is that B sees a red hat – C's.
    hints:
      - Which hats does B see?
      - C's hat is red – A sees it too.
    explanation: "Knowledge can be nested: A knows that B knows … Such chains decide in hat puzzles whether an announcement brings anything new."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The logic of knowledge often assumes: if I know p, then I know that I know p. What does that presuppose?"
    params:
      options:
        - label: An ideal reasoner who fully surveys their own state of knowledge.
          correct: true
        - label: Nothing – it holds for every person.
          feedback: People often know things without knowing that they know them.
        - label: That p is false.
          feedback: Knowledge presupposes that p is true.
    hints:
      - Have you ever known something without being aware of it?
      - Puzzle logic imagines perfect logicians.
    explanation: This introspection suits perfect logicians in puzzles. For real people it is disputed. Different systems of modal logic adopt different such rules.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what it means in logic to "know" something.
    params:
      keywords:
        - - welt
          - welten
          - world
        - - möglich
          - possible
        - - alle
          - jede
          - all
          - every
        - - wahr
          - "true"
      sample: You picture all worlds that are still possible given your observations. Knowing means the statement is true in all of these worlds. If there is a possible world where it is false, you do not know it.
    difficulty: 3

srs:
  cards_from: ["c1", "c3", "d1"]
