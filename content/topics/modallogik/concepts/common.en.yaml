id: logic.modal.common
type: concept
title: "Common knowledge"
summary: "Everyone knows it – and everyone knows that everyone knows it. Why arrangements can fail because of this."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: What everyone knows
    body: Why do money, traffic lights and arrangements work? Because we don't just know something – we also know that others know it. Uncover the cards and discover **common knowledge**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 👑
            front: The emperor's new clothes
            back: Everyone saw he was naked. Only when a child shouted it did all know that all knew.
          - icon: 💶
            front: A banknote
            back: Paper is worth little. A note counts because everyone knows that all the others accept it.
          - icon: 🚦
            front: Green means go
            back: You drive off at green because you know the others know what red means.
          - icon: 🗣️
            front: A rumour
            back: Perhaps everyone knows it. But nobody knows whether the others know it too.

  - kind: problem
    id: c1
    widget: numeric
    prompt: 'On an island {{n}} people have blue eyes. Nobody knows their own eye colour. Whoever learns it must leave that same evening. A visitor says publicly: "I see someone with blue eyes." On which evening do the blue-eyed leave?'
    answer:
      value: "{{n}}"
    hints:
      - This is the muddy children puzzle in new clothes.
      - With {{n}} blue-eyed people it takes {{n}} evenings.
    explanation: On evening {{n}}. Each blue-eyed person sees {{n - 1}} others and waits to see whether they leave on evening {{n - 1}}. If not, he knows.
    variants:
      params:
        n: int[2,9]
      defaults:
        n: 3

  - kind: explain
    id: c2
    body: Something is common knowledge if everyone knows it, everyone knows that everyone knows it, and so on without end. A public announcement creates it at once. A rumour that each person hears alone does not.

  - kind: problem
    id: c3
    widget: order
    prompt: Order the levels from weak to strong.
    params:
      items:
        - label: Ann knows p.
        - label: Ann and Ben know p.
        - label: Both know that the other knows p.
        - label: p is common knowledge.
    hints:
      - Each level contains the one before.
      - Common knowledge is the infinite top.
    explanation: Each level is strictly stronger. Common knowledge covers all finite levels at once.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why do people agree on a meeting point out loud in the group rather than by separate messages to each person?
    params:
      options:
        - label: Then everyone knows that all the others know it too – and can rely on it.
          correct: true
        - label: Because it is faster.
          feedback: It is not about time but about knowledge of what others know.
        - label: It makes no difference.
          feedback: With separate messages it stays unclear whether the others know.
    hints:
      - "With a separate message: do you know the others got one too?"
      - Coordination needs confidence in what the others know.
    explanation: Coordination needs common knowledge. That is why public signals such as traffic lights, laws or announcements are so effective.

  - kind: problem
    id: c5
    widget: numeric
    prompt: 'Ann sends Ben a messenger: "Meet at 8." Ben sends a confirmation back, Ann confirms the confirmation. How many messengers is that? Enter the number of messengers.'
    answer:
      value: 3
    hints:
      - Message, confirmation, confirmation of the confirmation.
      - Count them.
    explanation: Three messengers. But after the third Ben does not know whether it arrived. Each confirmation adds one level – common knowledge is never reached this way.

  - kind: problem
    id: c6
    widget: swipe
    prompt: Is common knowledge created here?
    params:
      cards:
        - text: The teacher says it aloud to the class.
          right: true
        - text: Everyone gets the same message privately.
          right: false
          why: Nobody knows for sure the others have it too.
        - text: A traffic light that everyone at the junction sees.
          right: true
        - text: A rumour that each person hears alone.
          right: false
          why: Heard alone does not mean known in common.
      left: no
      right: yes
    explanation: Common knowledge needs a public event where everyone sees that everyone sees it.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Two generals want to attack only **together**. Messengers can be intercepted. Is there a procedure with finitely many messengers that is sure to work?
    params:
      options:
        - label: No – the last messenger might always be missing, and then the sender hesitates.
          correct: true
        - label: Yes, with enough confirmations.
          feedback: Every confirmation again needs a confirmation – it never ends.
        - label: Yes, with two messengers.
          feedback: The second messenger can be intercepted too.
    hints:
      - Take the shortest procedure that supposedly works. What if its last messenger is lost?
      - Then an even shorter procedure would be just as good – contradiction.
    explanation: The two generals problem is unsolvable – a proof by smallest counterexample. That is why computer networks work with probabilities and timeouts instead of certainty.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: On the island with three blue-eyed people, everyone sees at least two blue-eyed people. What does the announcement "I see someone with blue eyes" add?
    params:
      options:
        - label: That everyone knows that everyone knows that everyone knows it – the third level was missing.
          correct: true
        - label: Nothing – everyone knew already.
          feedback: Everyone knew it, but not at every level.
        - label: That the visitor is lying.
          feedback: The visitor tells the truth.
    hints:
      - With three blue-eyed people the reasoning needs three levels.
      - Which level can nobody be sure of before the announcement?
    explanation: Before the announcement only two levels existed. The announcement makes the fact common knowledge and so starts the chain.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Two people share the same basic assumptions and reason soundly. Their probabilities for an event are common knowledge. What did the economist Robert Aumann show?
    params:
      options:
        - label: Their probabilities must then be equal – they cannot "agree to disagree".
          correct: true
        - label: They always stay in disagreement.
          feedback: Under these conditions each learns from the other's opinion until they match.
        - label: Common knowledge does not exist.
          feedback: Public announcements certainly create it.
    hints:
      - If I know you estimate differently, what does that tell me?
      - Both share the same basic assumptions.
    explanation: This is Aumann's agreement theorem. In everyday life its conditions are rarely met – which is why real disagreements exist. The theorem shows how strong common knowledge is.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux the difference between "everyone knows it" and "it is common knowledge".
    params:
      keywords:
        - - alle wissen
          - everyone knows
        - - dass alle
          - wissen dass
          - knows that
          - that everyone
        - - öffentlich
          - ansage
          - laut
          - public
          - announce
          - aloud
      sample: Even if everyone knows it, each can still be unsure whether the others know it. Common knowledge means everyone knows it, everyone knows that everyone knows it, and so on. A public announcement creates it.
    difficulty: 3

srs:
  cards_from: ["c1", "c4", "d1"]
