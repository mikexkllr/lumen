id: logic.modal.knowledge
type: concept
title: "Wer weiß was?"
summary: "Wissen heißt: In allen Welten, die ich für möglich halte, ist es wahr."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: Ann und Ben tragen Hüte, rot oder blau. Jeder sieht nur den Hut des anderen. Ann sieht einen roten Hut. Weiß Ann, welche Farbe ihr eigener Hut hat?
    params:
      options:
        - label: Nein – für sie sind »rot« und »blau« beide noch möglich.
          correct: true
        - label: Ja, rot – wie bei Ben.
          feedback: Nichts sagt, dass beide Hüte gleich sind.
        - label: Ja, blau – es muss ja verschieden sein.
          feedback: Auch das wurde nicht gesagt.
    hints:
      - Welche Lagen passen zu dem, was Ann sieht?
      - Sie sieht nur Bens Hut.
    explanation: "Ann hält zwei Welten für möglich: (rot, rot) und (blau, rot). Weil sich ihr Hut darin unterscheidet, **weiß** sie ihn nicht."

  - kind: explain
    id: c2
    body: Die Logik des Wissens denkt in **möglichen Welten**. Jemand weiß etwas genau dann, wenn es in allen Welten wahr ist, die er nach seinen Beobachtungen noch für möglich hält.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Drei Kinder tragen Hüte, jeder rot oder blau. Wie viele mögliche Welten gibt es insgesamt?
    answer:
      value: 8
    hints:
      - Jedes Kind hat 2 Möglichkeiten.
      - 2 · 2 · 2 = ?
    explanation: 2³ = 8 Welten. Jede Beobachtung und jede Ansage **streicht** Welten – genau wie Hinweise in einem Logikgitter.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Kind A sieht die Hüte von B und C, nicht den eigenen. Wie viele der 8 Welten hält A danach noch für möglich?
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 8
        misconception: no-update
        text: A sieht doch zwei Hüte – das streicht viele Welten.
    hints:
      - B und C stehen fest. Was ist noch offen?
      - "Nur der eigene Hut: rot oder blau."
    explanation: "Zwei Welten bleiben, die sich nur in A's eigenem Hut unterscheiden. **Sehen** heißt in dieser Logik: Welten ausschließen."

  - kind: problem
    id: c5
    widget: choice
    prompt: "Die Lehrerin sagt laut: »Mindestens ein Hut ist rot.« A sieht zwei blaue Hüte. Was weiß A jetzt?"
    params:
      options:
        - label: Mein Hut ist rot.
          correct: true
        - label: Nichts Neues.
          feedback: Von A's zwei Welten widerspricht eine der Ansage.
        - label: Mein Hut ist blau.
          feedback: Dann gäbe es keinen roten Hut – die Ansage wäre falsch.
    hints:
      - Welche von A's zwei Welten passt nicht zur Ansage?
      - (blau, blau, blau) hat keinen roten Hut.
    explanation: Die **Ansage** streicht die Welt »alle blau«. Übrig bleibt eine einzige Welt – und darin ist A's Hut rot.

  - kind: problem
    id: c6
    widget: buckets
    prompt: Die Lehrerin hat gesagt »mindestens ein Hut ist rot«. Weiß A seine Farbe?
    params:
      buckets:
        - id: b1
          label: A weiß es
        - id: b2
          label: A weiß es nicht
      items:
        - label: A sieht blau und blau
          bucket: b1
        - label: A sieht rot und blau
          bucket: b2
        - label: A sieht rot und rot
          bucket: b2
    hints:
      - Prüfe, ob die Ansage eine von A's Welten streicht.
      - Sieht A schon einen roten Hut, streicht sie nichts.
    explanation: Nur wenn A keinen roten Hut sieht, verrät die Ansage etwas. Sonst wusste A das schon – die Ansage ändert **für A** nichts.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Was unterscheidet »Ann weiß, dass p« von »Ann glaubt, dass p«?
    params:
      options:
        - label: Wissen muss wahr sein – Glauben kann falsch sein.
          correct: true
        - label: Gar nichts.
          feedback: Man kann Falsches glauben, aber nicht Falsches wissen.
        - label: Wissen ist sicherer, aber kann auch falsch sein.
          feedback: Dann wäre es Glauben. Wissen schließt Irrtum aus.
    hints:
      - Kann man wissen, dass 2 + 2 = 5 ist?
      - Glauben kann man es schon.
    explanation: "Für Wissen gilt die Regel: Weiß jemand p, dann ist p **wahr**. Denn die wirkliche Welt gehört immer zu den Welten, die man für möglich hält. Für Glauben gilt das nicht."
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A sieht zwei rote Hüte. Weiß A, dass B weiß, dass mindestens ein Hut rot ist – auch ohne Ansage?
    params:
      options:
        - label: Ja – B sieht ja C's roten Hut, und A sieht, dass B ihn sieht.
          correct: true
        - label: Nein, A kennt seinen eigenen Hut nicht.
          feedback: Den braucht A hier nicht – B sieht ja C.
        - label: Nur wenn A's Hut rot ist.
          feedback: Auch dann zählt nur, dass B einen roten Hut sieht – nämlich C's.
    hints:
      - Welche Hüte sieht B?
      - C's Hut ist rot – A sieht ihn auch.
    explanation: "Wissen kann **verschachtelt** sein: A weiß, dass B weiß … Solche Ketten entscheiden bei Hut-Rätseln, ob eine Ansage etwas Neues bringt."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "In der Logik des Wissens gilt oft: Weiß ich p, dann weiß ich auch, dass ich p weiß. Was setzt das voraus?"
    params:
      options:
        - label: Ein idealer Denker, der seinen eigenen Wissensstand vollständig überblickt.
          correct: true
        - label: Nichts – das gilt für jeden Menschen.
          feedback: Menschen wissen oft Dinge, ohne zu wissen, dass sie sie wissen.
        - label: Dass p falsch ist.
          feedback: Wissen setzt voraus, dass p wahr ist.
    hints:
      - Hast du schon einmal etwas gewusst, ohne dass es dir bewusst war?
      - Die Rätsel-Logik denkt sich perfekte Logiker.
    explanation: Diese **Introspektion** passt zu perfekten Logikern in Rätseln. Für echte Menschen ist sie umstritten. Verschiedene Systeme der Modallogik nehmen verschiedene solcher Regeln an.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was es in der Logik heißt, etwas zu »wissen«.
    params:
      keywords:
        - - welt
          - welten
          - world
        - - möglich
          - possible
        - - alle
          - jede
          - all
          - every
        - - wahr
          - "true"
      sample: "Man stellt sich alle Welten vor, die nach den eigenen Beobachtungen noch möglich sind. Wissen heißt: Die Aussage ist in allen diesen Welten wahr. Gibt es eine mögliche Welt, in der sie falsch ist, weiß man es nicht."
    difficulty: 3

srs:
  cards_from: ["c1", "c3", "d1"]
