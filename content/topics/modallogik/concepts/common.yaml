id: logic.modal.common
type: concept
title: "Gemeinsames Wissen"
summary: "Alle wissen es – und alle wissen, dass alle es wissen. Warum Verabredungen daran scheitern können."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Was alle von allen wissen
    body: Warum funktionieren Geld, Ampeln und Verabredungen? Weil wir nicht nur etwas wissen – sondern auch wissen, dass die anderen es wissen. Deck die Karten auf und entdecke **gemeinsames Wissen**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 👑
            front: Des Kaisers neue Kleider
            back: Alle sahen, dass er nackt war. Erst als ein Kind es laut rief, wussten alle, dass alle es wissen.
          - icon: 💶
            front: Ein Geldschein
            back: Papier ist wenig wert. Ein Schein gilt, weil jeder weiß, dass alle anderen ihn annehmen.
          - icon: 🚦
            front: Grün heißt fahren
            back: Du fährst bei Grün los, weil du weißt, dass die anderen wissen, was Rot bedeutet.
          - icon: 🗣️
            front: Ein Gerücht
            back: Vielleicht kennt es jeder. Aber keiner weiß, ob die anderen es auch kennen.

  - kind: problem
    id: c1
    widget: numeric
    prompt: "Auf einer Insel haben {{n}} Menschen blaue Augen. Niemand kennt die eigene Augenfarbe. Wer seine kennt, muss am selben Abend abreisen. Ein Gast sagt öffentlich: »Ich sehe jemanden mit blauen Augen.« Am wievielten Abend reisen die Blauäugigen ab?"
    answer:
      value: "{{n}}"
    hints:
      - Das ist das Rätsel der schmutzigen Kinder in neuem Gewand.
      - Mit {{n}} Blauäugigen dauert es {{n}} Abende.
    explanation: Am {{n}}. Abend. Jeder Blauäugige sieht {{n - 1}} andere und wartet, ob sie am Abend {{n - 1}} gehen. Tun sie es nicht, weiß er Bescheid.
    variants:
      params:
        n: int[2,9]
      defaults:
        n: 3

  - kind: explain
    id: c2
    body: Etwas ist **gemeinsames Wissen**, wenn alle es wissen, alle wissen, dass alle es wissen, und so weiter ohne Ende. Eine öffentliche Ansage erzeugt das sofort. Ein Gerücht, das jeder einzeln hört, nicht.

  - kind: problem
    id: c3
    widget: order
    prompt: Ordne die Stufen von schwach nach stark.
    params:
      items:
        - label: Ann weiß p.
        - label: Ann und Ben wissen p.
        - label: Beide wissen, dass der andere p weiß.
        - label: p ist gemeinsames Wissen.
    hints:
      - Jede Stufe enthält die vorige.
      - Gemeinsames Wissen ist die unendliche Spitze.
    explanation: Jede Stufe ist echt stärker. **Gemeinsames Wissen** umfasst alle endlichen Stufen zugleich.

  - kind: problem
    id: c4
    widget: choice
    prompt: Warum vereinbart man Treffpunkte lieber laut in der Gruppe als einzeln per Nachricht an jeden?
    params:
      options:
        - label: Dann weiß jeder, dass alle anderen es auch wissen – und kann sich darauf verlassen.
          correct: true
        - label: Weil es schneller geht.
          feedback: Es geht nicht um Zeit, sondern um Wissen über das Wissen der anderen.
        - label: Das ist egal.
          feedback: Bei Einzelnachrichten bleibt unklar, ob die anderen Bescheid wissen.
    hints:
      - "Bei einer Einzelnachricht: Weißt du, dass die anderen sie auch bekommen haben?"
      - Koordination braucht Vertrauen in das Wissen der anderen.
    explanation: Koordination braucht **gemeinsames Wissen**. Darum sind öffentliche Signale wie Ampeln, Gesetze oder Ansagen so wirksam.

  - kind: problem
    id: c5
    widget: numeric
    prompt: "Ann schickt Ben einen Boten: »Treffen um 8.« Ben schickt eine Bestätigung zurück, Ann bestätigt die Bestätigung. Wie viele Boten sind das? Gib die Zahl der Boten an."
    answer:
      value: 3
    hints:
      - Nachricht, Bestätigung, Bestätigung der Bestätigung.
      - Zähle sie.
    explanation: Drei Boten. Ben weiß nach dem dritten aber nicht, ob er ankam. Jede Bestätigung fügt **eine Stufe** hinzu – gemeinsames Wissen erreicht man so nie.

  - kind: problem
    id: c6
    widget: swipe
    prompt: Wird hier gemeinsames Wissen geschaffen?
    params:
      cards:
        - text: Die Lehrerin sagt es laut vor der Klasse.
          right: true
        - text: Jeder bekommt dieselbe Nachricht privat.
          right: false
          why: Keiner weiß sicher, dass die anderen sie auch haben.
        - text: Eine Ampel, die alle an der Kreuzung sehen.
          right: true
        - text: Ein Gerücht, das jeder einzeln hört.
          right: false
          why: "Einzeln gehört heißt nicht: gemeinsam gewusst."
      left: nein
      right: ja
    explanation: Gemeinsames Wissen braucht ein **öffentliches** Ereignis, bei dem alle sehen, dass alle es sehen.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: Zwei Generäle wollen nur **gemeinsam** angreifen. Boten können abgefangen werden. Gibt es ein Verfahren mit endlich vielen Boten, das sicher funktioniert?
    params:
      options:
        - label: Nein – der letzte Bote könnte immer fehlen, und dann zögert der Absender.
          correct: true
        - label: Ja, mit genug Bestätigungen.
          feedback: Jede Bestätigung braucht wieder eine Bestätigung – das endet nie.
        - label: Ja, mit zwei Boten.
          feedback: Auch der zweite Bote kann abgefangen werden.
    hints:
      - Nimm das kürzeste Verfahren, das angeblich funktioniert. Was, wenn sein letzter Bote verloren geht?
      - Dann wäre ein noch kürzeres Verfahren genauso gut – Widerspruch.
    explanation: Das **Zwei-Generäle-Problem** ist unlösbar – ein Beweis mit dem kleinsten Gegenbeispiel. Darum arbeiten Computernetze mit Wahrscheinlichkeiten und Zeitlimits statt mit Gewissheit.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Auf der Insel mit drei Blauäugigen sieht jeder mindestens zwei Blauäugige. Was fügt die Ansage »Ich sehe jemanden mit blauen Augen« hinzu?
    params:
      options:
        - label: Dass alle wissen, dass alle wissen, dass alle es wissen – die dritte Stufe fehlte.
          correct: true
        - label: Nichts, alle wussten es schon.
          feedback: Alle wussten es, aber nicht auf allen Stufen.
        - label: Dass der Gast lügt.
          feedback: Der Gast sagt die Wahrheit.
    hints:
      - Bei drei Blauäugigen braucht die Rechnung drei Stufen.
      - Welche Stufe kann vor der Ansage niemand sicher haben?
    explanation: Vor der Ansage gab es nur zwei **Stufen**. Die Ansage macht die Tatsache zu gemeinsamem Wissen und startet so die Kette.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Zwei Menschen haben dieselben Grundannahmen und denken klug. Ihre Schätzungen für ein Ereignis sind gemeinsames Wissen. Was zeigte Robert Aumann?
    params:
      options:
        - label: Ihre Wahrscheinlichkeiten müssen dann gleich sein – sie können nicht »vereinbaren, uneins zu sein«.
          correct: true
        - label: Sie bleiben immer uneins.
          feedback: Unter diesen Bedingungen lernt jeder aus der Meinung des anderen, bis sie übereinstimmen.
        - label: Gemeinsames Wissen gibt es nicht.
          feedback: Öffentliche Ansagen erzeugen es sehr wohl.
    hints:
      - Wenn ich weiß, dass du anders schätzt, was verrät mir das?
      - Beide haben dieselben Grundannahmen.
    explanation: Das ist **Aumanns Einigungssatz**. Im Alltag sind die Bedingungen selten erfüllt – darum gibt es echte Meinungsverschiedenheiten. Der Satz zeigt, wie stark gemeinsames Wissen ist.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux den Unterschied zwischen »alle wissen es« und »es ist gemeinsames Wissen«.
    params:
      keywords:
        - - alle wissen
          - everyone knows
        - - dass alle
          - wissen dass
          - knows that
          - that everyone
        - - öffentlich
          - ansage
          - laut
          - public
          - announce
          - aloud
      sample: "Wenn alle es wissen, kann trotzdem jeder unsicher sein, ob die anderen es wissen. Gemeinsames Wissen heißt: Alle wissen es, alle wissen, dass alle es wissen, und so weiter. Eine öffentliche Ansage schafft das."
    difficulty: 3

srs:
  cards_from: ["c1", "c4", "d1"]
