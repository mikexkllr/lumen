id: cs.binary.places
type: concept
title: Place Values with 0 and 1
summary: Each place is worth twice as much.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: up to what number can you count on ten fingers if each finger is a bit?"
    params:
      min: 10
      max: 5000
    answer:
      value: 1023
      tolerance: 150
    explanation: Up to 1023 – instead of just 10. Each finger doubles the possibilities.

  - kind: problem
    id: fuenf
    widget: bits
    prompt: Switch the lamps so that they add up to exactly 5.
    params: { bits: 3 }
    answer: { value: 5 }
    hints:
      - The lamps count 4, 2, and 1.
    explanation: 4 + 1 = 5. In binary, that is written 101.

  - kind: explain
    id: s2
    body: |
      Each place is worth **twice as much** as the one to its right: 1, 2, 4, 8 …
      A place is on (1) or off (0). Try it out.
    visual: { widget: bits, interactive: true, params: { bits: 4, initial: "1010" } }

  - kind: problem
    id: einstellen
    widget: bits
    prompt: Set the number {{n}} – this time without a display.
    params: { bits: 4, showValue: false }
    answer: { value: "{{n}}" }
    hints:
      - Start on the left with the largest place that still fits.
      - "Subtract it from {{n}} and continue with the remainder."
    explanation: "{{n}} = {{bin(n)}} in the binary system."
    variants:
      params: { n: "int[3,15]" }
      defaults: { n: 11 }

  - kind: problem
    id: lesen
    widget: numeric
    prompt: Which number is written as 1101 in binary?
    params: { placeholder: "Decimal number" }
    answer: { value: 13 }
    feedback:
      - when: "numval(state.input) == 1101"
        misconception: decimal-reading
        text: That reads it as a decimal number. Calculate with 8, 4, 2, and 1.
    hints:
      - From the right, the places are worth 1, 2, 4, and 8.
    explanation: 8 + 4 + 0 + 1 = 13.

  - kind: explain
    id: s5
    body: With 4 bits you can reach 15. How far can you get with 8 bits?
    reveal:
      body: Up to 255. Each new bit doubles the possibilities. With 8 bits there are $2^8 = 256$ values – from 0 to 255.

  - kind: problem
    id: werte
    widget: choice
    prompt: How many different values fit into 5 bits?
    params:
      options:
        - { label: "32", correct: true }
        - { label: "31", feedback: "31 is the largest value. But 0 counts too." }
        - { label: "25", feedback: "That would be 5 · 5. But bits double." }
        - { label: "10", feedback: "Each bit doubles the count instead of adding just 2." }
    hints:
      - 1 bit has 2 values, 2 bits have 4 values …
    explanation: $2^5 = 32$ values, namely 0 to 31.

  - kind: problem
    id: maximum
    widget: bits
    prompt: Set the largest number that fits into 6 bits.
    params: { bits: 6, showValue: false }
    answer: { value: 63 }
    hints:
      - Which lamps must be on for that?
    explanation: All six on – 32 + 16 + 8 + 4 + 2 + 1 = 63.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: What number is 101010 in binary?
    answer:
      value: 42
    hints:
      - The ones sit on 32, 8 and 2.
    explanation: 32 + 8 + 2 = 42.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: bits
    prompt: Set {{n}} with eight bits – no display this time.
    params:
      bits: 8
      showValue: false
    answer:
      value: "{{n}}"
    hints:
      - "Start on the left: does 128 fit?"
      - Subtract every power of two that fits and carry on with the rest.
    explanation: "{{n}} is {{bin(n)}} in binary."
    variants:
      params:
        n: int[100,250]
      defaults:
        n: 182
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: What is the largest number that fits in {{k}} bits?
    answer:
      value: "{{2 ** k - 1}}"
    feedback:
      - when: numval(state.input) == 2 ** k
        misconception: off-by-one
        text: That is the number of values. Zero counts too – the largest number is one less.
    hints:
      - How many different values do {{k}} bits give?
      - The smallest value is 0. So the largest is 2 to the {{k}} minus 1.
    explanation: "All {{k}} bits on: $2^{ {{k}} } - 1 = {{2 ** k - 1}}$."
    difficulty: 2
    variants:
      params:
        k: int[5,16]
      defaults:
        k: 10

  - kind: explain
    id: cs-d3
    depth: 2
    body: Why is 1111 exactly one less than 10000?
    reveal:
      body: Add one. All the ones flip to 0 and the carry runs all the way left. That is why 1 + 2 + 4 + 8 = 16 − 1.

  - kind: problem
    id: cs-d4
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Every odd number ends in 1 in binary.
          right: true
          why: The last digit is worth 1 – only it can make a number odd.
        - text: Binary 1000 means a thousand.
          right: false
          why: Binary 1000 is 8.
        - text: A 5-digit binary number without a leading zero is at least 16.
          right: true
          why: The leading digit is worth 16.
        - text: With 8 bits you can count up to 256.
          right: false
          why: Up to 255 – together with 0 that makes 256 values.
        - text: Appending a 1 on the right turns n into 2n + 1.
          right: true
          why: Appending doubles, and the new 1 adds one.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: You append a 0 to the right of a binary number. What happens to its value?
    params:
      options:
        - label: It doubles
          correct: true
        - label: It grows tenfold
          feedback: That is true in the decimal system.
        - label: It stays the same
          feedback: Only a zero on the **left** changes nothing.
    hints:
      - Every digit moves one place left – and is worth twice as much there.
    explanation: "Computers multiply by 2 by shifting bits: a **shift**. That is lightning fast."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: The number {{n}} is {{bin(n)}} in binary. You delete the last digit. Which number is left?
    answer:
      value: "{{floor(n / 2)}}"
    feedback:
      - when: numval(state.input) == n * 2
        misconception: shift-direction
        text: Appending doubles – deleting does the opposite.
    hints:
      - Appending a digit doubles. What does deleting do?
      - Halve and round down – the deleted 1 is lost.
    explanation: "Deleting is a right shift: divide by 2 and round down. {{bin(n)}} becomes {{bin(floor(n / 2))}}."
    difficulty: 3
    variants:
      params:
        n: int[21,99]
      constraints:
        - n % 2 == 1
      defaults:
        n: 45

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: How many binary digits does the number {{n}} need?
    answer:
      value: "{{k}}"
    hints:
      - What is the largest power of two that fits into {{n}}?
      - The top digit is worth {{2 ** (k - 1)}}. Count the places from 1 up to it.
    explanation: $2^{ {{k - 1}} } = {{2 ** (k - 1)}}$ fits, $2^{ {{k}} } = {{2 ** k}}$ does not. So {{k}} digits.
    difficulty: 3
    variants:
      params:
        k: int[6,11]
        r: int[0,500]
      derive:
        n: 2 ** (k - 1) + mod(r, 2 ** (k - 1))
      defaults:
        k: 10
        r: 488

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: "Explain to Lux: why do n bits give exactly 2ⁿ different values?"
    params:
      keywords:
        - - verdoppel
          - doppelt
          - double
          - mal 2
          - times 2
        - - bit
          - stelle
          - digit
          - place
        - - zwei zustände
          - 0 oder 1
          - null oder eins
          - two states
          - 0 or 1
          - zero or one
      sample: "Each bit is 0 or 1 – two states. A new bit doubles the possibilities: every old combination appears once with a 0 and once with a 1 in front. n bits means doubling n times, so 2ⁿ."
    difficulty: 3

srs:
  cards_from: [einstellen, lesen]
