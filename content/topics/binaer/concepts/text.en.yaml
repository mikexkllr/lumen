id: cs.binary.text
type: concept
title: Letters as Numbers
summary: How text fits into bits.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A number for every character
    body: "Every message you type travels across the net as numbers. Flip the cards: **every character has a number** – even your favourite emoji."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 😀
            front: An emoji
            back: "Even 😀 is just a number: 128,512. Your phone draws a face from it."
          - icon: 📨
            front: The text message
            back: A text message holds 160 characters. That is 140 bytes, at 7 bits per character.
          - icon: 🔠
            front: Upper and lower case
            back: A and a differ in just one single bit.
          - icon: 🌍
            front: Every script
            back: Unicode has numbers for about 150,000 characters from almost every script in the world.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many different characters can 8 bits tell apart?"
    params:
      min: 8
      max: 1000
    answer:
      value: 256
      tolerance: 60
    explanation: 2⁸ = 256. Enough for all letters, digits and punctuation.

  - kind: explain
    id: s1
    body: |
      Computers only know numbers. So every character has a number – A is 65, B is 66, and so on. This table is called **ASCII**.

  - kind: problem
    id: nummer
    widget: numeric
    prompt: What number does the letter {{chr(k)}} have?
    params: { placeholder: "Number" }
    answer: { value: "{{k}}" }
    hints:
      - A = 65. Keep counting through the alphabet.
    explanation: "{{chr(k)}} is letter number {{k - 64}} – 64 + {{k - 64}} = {{k}}."
    variants:
      params: { k: "int[66,90]" }
      defaults: { k: 72 }

  - kind: problem
    id: a-bits
    widget: bits
    prompt: Set the letter A – that is, the number 65.
    params: { bits: 7, showValue: false }
    answer: { value: 65 }
    hints:
      - 65 = 64 + 1.
    explanation: 1000001 – that is how an A is stored in memory.

  - kind: problem
    id: bytes
    widget: buckets
    prompt: How much space does the character need in UTF-8?
    params:
      buckets: [{ label: 1 byte }, { label: more than 1 byte }]
      items:
        - { label: "A", bucket: 1 byte }
        - { label: "7", bucket: 1 byte }
        - { label: "!", bucket: 1 byte }
        - { label: "ä", bucket: more than 1 byte }
        - { label: "€", bucket: more than 1 byte }
        - { label: "😀", bucket: more than 1 byte }
    hints:
      - One byte is only enough for the old ASCII characters.
    explanation: Umlauts, symbols, and emojis need 2 to 4 bytes.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The gap between “A” (65) and “a” (97) in ASCII is exactly one bit. What is the value of that bit?
    answer:
      value: 32
    hints:
      - 97 − 65.
    explanation: 32 = 2⁵. Upper and lower case are switched by flipping a single bit.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: bits
    prompt: This is »A« (65). Turn it into a lowercase »a« – flip exactly one bit.
    params:
      bits: 8
      initial: "01000001"
    answer:
      value: 97
    hints:
      - »a« is number 97. How far is that from 65?
      - The gap of 32 is exactly one bit.
    explanation: 65 + 32 = 97. In ASCII a single bit separates upper and lower case.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: In ASCII the digit »0« has code 48. What code does the digit »{{d}}« have?
    answer:
      value: "{{48 + d}}"
    feedback:
      - when: numval(state.input) == d
        misconception: char-vs-number
        text: The character »{{d}}« is not the number {{d}}. Its code starts at 48.
    hints:
      - The digits come in order.
      - 48 + {{d}}.
    explanation: »{{d}}« has code {{48 + d}}. Turning text into a number means subtracting 48.
    difficulty: 2
    variants:
      params:
        d: int[1,9]
      defaults:
        d: 7

  - kind: explain
    id: cs-d3
    depth: 2
    body: "**UTF-8** stores ASCII characters in 1 byte. Umlauts like ä need 2 bytes, most Chinese characters 3 and emojis 4."

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: How many bytes does the word »Grüße« take in UTF-8?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 5
        misconception: chars-vs-bytes
        text: That is the character count. ü and ß are not ASCII.
    hints:
      - G, r and e are ASCII. What about ü and ß?
      - ü and ß need 2 bytes each.
    explanation: 1 + 1 + 2 + 2 + 1 = 7 bytes for 5 characters.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Unicode has over 140,000 signs. Why not just use 4 bytes for each one?
    params:
      options:
        - label: UTF-8 gives common characters few bytes – that saves a lot of space in most texts
          correct: true
        - label: 4 bytes are not enough for all characters
          feedback: They suffice for 4 billion.
        - label: Computers can read only 1 byte at a time
          feedback: They usually read 8 bytes at once.
    hints:
      - An English text would become four times as large.
    explanation: "Variable length: frequent = short. The same idea is behind all data compression."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: how can a computer store text, images and music with only 0 and 1?"
    params:
      keywords:
        - - zahl
          - number
          - nummer
        - - code
          - tabelle
          - vereinbar
          - table
          - agree
          - standard
          - bedeut
          - mean
        - - bit
          - binär
          - binary
          - 0 und 1
          - 0 and 1
      sample: "Everything is translated into numbers: each letter has a number in a table, each pixel three colour values. The computer writes these numbers in binary with bits."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: A UTF-8 byte starting with [[0]] is an ASCII character. Continuation bytes always start with [[10]]. A lead byte starting with 1110 announces [[three]] bytes.
      distractors:
        - "11"
        - two
        - four
    hints:
      - Continuation bytes must differ from lead bytes.
      - The number of leading ones in the lead byte is the length.
    explanation: 0xxxxxxx is ASCII, 110 starts 2 bytes, 1110 starts 3, 11110 starts 4, and 10 means continuation. That way you can find the start of a character even mid-text.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: A web page shows »GrÃ¼ÃŸe« instead of »Grüße«. What happened?
    params:
      options:
        - label: UTF-8 bytes were read as an old 8-bit encoding – each byte as its own character
          correct: true
        - label: The file is broken
          feedback: The bytes are fine, just misread.
        - label: The font has no ü
          feedback: Then you would see a box, not two characters.
    hints:
      - ü takes two bytes in UTF-8. How many characters do you see instead of ü?
      - Two characters per umlaut – so each byte was translated on its own.
    explanation: ü is C3 BC. In Windows-1252, C3 is »Ã« and BC is »¼«. This garbled text is called mojibake.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Unicode code points go up to 0x10FFFF, i.e. 1,114,111. How many bits do you need at least to store any of them?
    answer:
      value: 21
    hints:
      - $2^{20}$ is 1,048,576. Is that enough?
      - Just not – so one more bit.
    explanation: $2^{20}$ < 1,114,111 < $2^{21}$. 21 bits – exactly what the longest 4-byte UTF-8 pattern carries.
    difficulty: 3

srs:
  cards_from: [nummer, bytes]
