id: cs.binary.bytes
type: concept
title: Bytes, Storage, and Colors
summary: From 8 bits to millions of colors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 15
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pictures made of numbers
    body: Every photo on your phone is just a huge table of numbers. Tap the cells to change their brightness. Every shade is a number – **pictures are bits**.
    visual:
      widget: pixels
      interactive: true
      params:
        shades: 4
        cells:
          - .33.33.
          - "3223223"
          - "3222223"
          - .32223.
          - ..323..
          - ...3...

  - kind: problem
    id: byte
    widget: choice
    prompt: A byte has 8 bits. How many different values can a byte store?
    params:
      options:
        - { label: "256", correct: true }
        - { label: "255", feedback: "255 is the largest value. Counting 0 as well, there are 256." }
        - { label: "8", feedback: "8 is the number of bits. Each bit doubles the number of values." }
        - { label: "64", feedback: "6 bits give 64 values." }
    hints:
      - Calculate 2 to the power of 8.
    explanation: $2^8 = 256$ values, from 0 to 255.

  - kind: explain
    id: s2
    body: |
      Storage grows in steps of one thousand:
      A **kilobyte** (kB) is 1000 bytes, a **megabyte** (MB) is a million, and a **gigabyte** (GB) is a billion.

  - kind: problem
    id: fotos
    widget: numeric
    prompt: A photo is {{s}} MB. How many whole photos fit on a card with {{g}} GB?
    body: Use 1 GB = 1000 MB.
    params: { unit: photos }
    answer: { value: "{{floor(g * 1000 / s)}}" }
    feedback:
      - when: "numval(state.input) == floor(g / s)"
        misconception: unit-mismatch
        text: First convert the GB to MB.
    hints:
      - "{{g}} GB is {{g * 1000}} MB."
    explanation: "{{g * 1000}} MB : {{s}} MB ≈ {{floor(g * 1000 / s)}} photos."
    variants:
      params: { s: "int[3,7]", g: "choice[8,16,32,64]" }
      defaults: { s: 4, g: 16 }

  - kind: explain
    id: s4
    body: |
      Screens mix **red, green, and blue**. Each channel gets one byte, so 0 to 255.
      (255, 0, 0) is pure red, (0, 0, 0) is black.

  - kind: problem
    id: gelb
    widget: choice
    prompt: What color does the screen show for (255, 255, 0)?
    params:
      layout: grid
      options:
        - { label: Yellow, correct: true }
        - { label: White, feedback: "White would need all three channels at full." }
        - { label: Green, feedback: "Red is at full here too." }
        - { label: Purple, feedback: "Purple mixes red with blue. Here blue is 0." }
    hints:
      - Light mixes differently from paint in a paint box.
    explanation: Red and green light together make yellow.

  - kind: problem
    id: farben
    widget: numeric
    prompt: With 3 bytes per pixel, how many colors are there? Enter the exponent. 2 to the power of …
    params: { prefix: "2^" }
    answer: { value: 24 }
    feedback:
      - when: "numval(state.input) == 3"
        misconception: bytes-vs-bits
        text: Each byte has 8 bits. How many bits is that in total?
    hints:
      - 3 bytes are 3 · 8 bits.
    explanation: 24 bits give $2^{24}$ – about 16.7 million colors.

  - kind: problem
    id: groessen
    widget: buckets
    prompt: How big is it, roughly? Sort the items.
    params:
      buckets: [{ label: kB }, { label: MB }, { label: GB }]
      items:
        - { label: A short message, bucket: kB }
        - { label: An email without attachment, bucket: kB }
        - { label: A phone photo, bucket: MB }
        - { label: A song as MP3, bucket: MB }
        - { label: A feature film in HD, bucket: GB }
        - { label: A big video game, bucket: GB }
    hints:
      - Text is tiny, videos are huge.
    explanation: Text needs kilobytes, photos and music need megabytes, films and games need gigabytes.

  - kind: problem
    id: intro-c1
    widget: bits
    prompt: The green value of a pixel is 200. Set this byte in bits.
    params:
      bits: 8
      showValue: false
    answer:
      value: 200
    hints:
      - The lamps count 128, 64, 32, 16, 8, 4, 2 and 1.
      - Take 128 and 64 – then 8 is still missing.
    explanation: 200 = 128 + 64 + 8, so 11001000. Three bytes like this for red, green and blue make every colour.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: An uncompressed image has 1000 × 1000 pixels with 3 bytes each. How many megabytes is that?
    params:
      unit: MB
    answer:
      value: 3
    hints:
      - A million pixels times 3 bytes.
    explanation: 3 million bytes = 3 MB. As a JPEG it would be only about 0.3 MB.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: An image has {{w}} × {{h}} pixels with 3 bytes each. How many megabytes is that uncompressed? Round to one decimal.
    params:
      unit: MB
    answer:
      value: "{{w * h * 3 / 1000000}}"
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - w * h / 1000000) < 0.06
        misconception: forgot-channels
        text: That is just the pixel count. Each pixel needs 3 bytes.
    hints:
      - Pixels times bytes per pixel gives the bytes.
      - One million bytes are 1 MB.
    explanation: "{{w}} · {{h}} · 3 = {{w * h * 3}} bytes ≈ {{round(w * h * 3 / 100000) / 10}} MB."
    difficulty: 2
    variants:
      params:
        w: choice[1280,1920,3840]
      derive:
        h: w * 9 / 16
      defaults:
        w: 1920

  - kind: problem
    id: cs-d2
    depth: 2
    widget: estimate
    prompt: "Take a guess: how many megabytes does one minute of CD-quality music take? 44,100 samples per second, 2 bytes each, two channels."
    params:
      min: 1
      max: 100
      unit: MB
    answer:
      value: 10.6
      within: 25
    explanation: 44,100 · 2 · 2 · 60 = 10,584,000 bytes, so just over 10 MB. MP3 shrinks that to about 1 MB.
    difficulty: 2

  - kind: explain
    id: cs-d3
    depth: 2
    body: "Careful, two conventions: makers count 1 kB = 1000 bytes. Operating systems often count 1 **kibibyte** (KiB) = 1024 bytes. That is why a 1 TB drive shows only about 931 GiB."

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: How many bytes are in a mebibyte (MiB), i.e. 1024 · 1024 bytes?
    answer:
      value: 1048576
    hints:
      - 1024 is $2^{10}$.
      - $2^{20}$ = 1024 · 1024.
    explanation: $2^{20}$ = 1,048,576 – almost 5 % more than a million.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A computer adds 0.1 and 0.2. The result is not exactly 0.3 but a tiny bit more. Why?
    params:
      options:
        - label: 0.1 cannot be written exactly in binary – like 1/3 in decimal
          correct: true
        - label: The processor is faulty
          feedback: Every computer shows this result.
        - label: The programming language has a bug
          feedback: It is due to the number format, not the language.
    hints:
      - In binary only fractions whose denominator is a power of two terminate.
    explanation: 1/10 is periodic in binary. **Floating-point numbers** are almost always approximations – that is why money is computed in cents.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Computers store decimals as **floating-point numbers**: sign, mantissa and exponent, like 1.5 · 2³ = 12. A double has 64 bits – 1 for the sign, 11 for the exponent, 52 for the mantissa."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Which of these numbers can a double store **exactly**?
    params:
      multiple: true
      options:
        - label: "0.5"
          correct: true
        - label: "0.375"
          correct: true
        - label: "0.1"
          feedback: 1/10 repeats forever in binary – like 1/3 in decimal.
        - label: "0.2"
          feedback: 1/5 has no finite binary form.
    hints:
      - Only fractions with a power of two below the line work exactly.
      - 0.375 = 3/8. And 0.1 = 1/10?
    explanation: 1/2 and 3/8 have powers of two below the line. 1/10 and 1/5 contain the factor 5 – in binary they repeat and must be rounded.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: A double has 53 bits of precision. What happens to $2^{53} + 1$?
    params:
      options:
        - label: It is rounded to $2^{53}$ – the +1 is lost
          correct: true
        - label: It is stored exactly
          feedback: That would need 54 mantissa digits.
        - label: The program crashes
          feedback: Floating point rounds silently, without an error.
    hints:
      - How many binary digits does $2^{53} + 1$ have?
      - 54 digits do not fit into 53.
    explanation: From $2^{53}$ on, neighbouring doubles are 2 apart. Odd numbers there cannot be stored – one reason not to use floats for money.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: choice
    prompt: Why do programs not test `0.1 + 0.2 == 0.3`?
    params:
      options:
        - label: Rounding makes it false – you check whether the difference is tiny
          correct: true
        - label: Because == is not allowed for decimals
          feedback: It is allowed, it just gives false here.
        - label: Because the computer does not know 0.3
          feedback: It knows a number very close to 0.3 – just not the same one.
    hints:
      - Both sides are rounded – but differently.
      - You compare |a − b| with a small bound.
    explanation: 0.1 + 0.2 gives 0.30000000000000004. Safe is |a − b| < ε. For money you compute in whole cents instead.
    difficulty: 3

srs:
  cards_from: [fotos, byte]
