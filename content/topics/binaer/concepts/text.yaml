id: cs.binary.text
type: concept
title: Buchstaben als Zahlen
summary: Wie Text in Bits passt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Jedes Zeichen eine Nummer
    body: "Jede Nachricht, die du tippst, reist als Zahlen durchs Netz. Deck die Karten auf: **Jedes Zeichen hat eine Nummer** – sogar dein Lieblings-Emoji."
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 😀
            front: Ein Emoji
            back: "Auch 😀 ist nur eine Nummer: 128 512. Dein Handy malt daraus ein Gesicht."
          - icon: 📨
            front: Die SMS
            back: Eine SMS fasst 160 Zeichen. Das sind 140 Bytes, mit je 7 Bit pro Zeichen.
          - icon: 🔠
            front: Groß und klein
            back: A und a unterscheiden sich in nur einem einzigen Bit.
          - icon: 🌍
            front: Alle Schriften
            back: Unicode hat Nummern für rund 150 000 Zeichen aus fast allen Schriften der Welt.

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie viele verschiedene Zeichen kann man mit 8 Bits unterscheiden?"
    params:
      min: 8
      max: 1000
    answer:
      value: 256
      tolerance: 60
    explanation: 2⁸ = 256. Genug für alle Buchstaben, Ziffern und Satzzeichen.

  - kind: explain
    id: s1
    body: |
      Computer kennen nur Zahlen. Darum hat jedes Zeichen eine Nummer – A ist 65, B ist 66 und so weiter. Diese Tabelle heißt **ASCII**.

  - kind: problem
    id: nummer
    widget: numeric
    prompt: Welche Nummer hat der Buchstabe {{chr(k)}}?
    params: { placeholder: "Zahl" }
    answer: { value: "{{k}}" }
    hints:
      - A = 65. Zähle im Alphabet weiter.
    explanation: "{{chr(k)}} ist der {{k - 64}}. Buchstabe – 64 + {{k - 64}} = {{k}}."
    variants:
      params: { k: "int[66,90]" }
      defaults: { k: 72 }

  - kind: problem
    id: a-bits
    widget: bits
    prompt: Stelle den Buchstaben A ein – also die Zahl 65.
    params: { bits: 7, showValue: false }
    answer: { value: 65 }
    hints:
      - 65 = 64 + 1.
    explanation: 1000001 – so steht ein A im Speicher.

  - kind: problem
    id: bytes
    widget: buckets
    prompt: Wie viel Platz braucht das Zeichen in UTF-8?
    params:
      buckets: [{ label: 1 Byte }, { label: mehr als 1 Byte }]
      items:
        - { label: "A", bucket: 1 Byte }
        - { label: "7", bucket: 1 Byte }
        - { label: "!", bucket: 1 Byte }
        - { label: "ä", bucket: mehr als 1 Byte }
        - { label: "€", bucket: mehr als 1 Byte }
        - { label: "😀", bucket: mehr als 1 Byte }
    hints:
      - Ein Byte reicht nur für die alten ASCII-Zeichen.
    explanation: Umlaute, Symbole und Emojis brauchen 2 bis 4 Bytes.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Abstand zwischen »A« (65) und »a« (97) ist in ASCII genau ein Bit. Welchen Wert hat dieses Bit?
    answer:
      value: 32
    hints:
      - 97 − 65.
    explanation: 32 = 2⁵. Groß- und Kleinschreibung wechselt man durch Umschalten eines einzigen Bits.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: bits
    prompt: Hier steht »A« (65). Mach daraus ein kleines »a« – schalte genau ein Bit um.
    params:
      bits: 8
      initial: "01000001"
    answer:
      value: 97
    hints:
      - »a« hat die Nummer 97. Wie groß ist der Abstand zu 65?
      - Der Abstand 32 ist genau ein Bit.
    explanation: 65 + 32 = 97. In ASCII unterscheidet ein einziges Bit Groß und Klein.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: In ASCII hat die Ziffer »0« die Nummer 48. Welche Nummer hat die Ziffer »{{d}}«?
    answer:
      value: "{{48 + d}}"
    feedback:
      - when: numval(state.input) == d
        misconception: char-vs-number
        text: Das Zeichen »{{d}}« ist nicht die Zahl {{d}}. Seine Nummer beginnt bei 48.
    hints:
      - Die Ziffern stehen der Reihe nach.
      - 48 + {{d}}.
    explanation: »{{d}}« hat die Nummer {{48 + d}}. Wer aus Text eine Zahl macht, zieht 48 ab.
    difficulty: 2
    variants:
      params:
        d: int[1,9]
      defaults:
        d: 7

  - kind: explain
    id: cs-d3
    depth: 2
    body: "**UTF-8** speichert ASCII-Zeichen in 1 Byte. Umlaute wie ä brauchen 2 Bytes, die meisten chinesischen Zeichen 3 und Emojis 4."

  - kind: problem
    id: cs-d4
    depth: 2
    widget: numeric
    prompt: Wie viele Bytes braucht das Wort »Grüße« in UTF-8?
    answer:
      value: 7
    feedback:
      - when: numval(state.input) == 5
        misconception: chars-vs-bytes
        text: Das sind die Zeichen. ü und ß sind keine ASCII-Zeichen.
    hints:
      - G, r und e sind ASCII. Und ü, ß?
      - ü und ß brauchen je 2 Bytes.
    explanation: 1 + 1 + 2 + 2 + 1 = 7 Bytes für 5 Zeichen.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Unicode kennt über 140 000 Zeichen. Warum nutzt man nicht einfach für jedes Zeichen 4 Bytes?
    params:
      options:
        - label: UTF-8 gibt häufigen Zeichen wenige Bytes – das spart bei den meisten Texten viel Platz
          correct: true
        - label: 4 Bytes reichen nicht für alle Zeichen
          feedback: Sie reichen für 4 Milliarden.
        - label: Computer können nur 1 Byte auf einmal lesen
          feedback: Sie lesen meist 8 Bytes auf einmal.
    hints:
      - Ein englischer Text würde viermal so groß.
    explanation: "Variable Länge: häufig = kurz. Dieselbe Idee steckt in jeder Datenkompression."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie kann ein Computer mit nur 0 und 1 Texte, Bilder und Musik speichern?"
    params:
      keywords:
        - - zahl
          - number
          - nummer
        - - code
          - tabelle
          - vereinbar
          - table
          - agree
          - standard
          - bedeut
          - mean
        - - bit
          - binär
          - binary
          - 0 und 1
          - 0 and 1
      sample: "Alles wird in Zahlen übersetzt: Jeder Buchstabe hat eine Nummer in einer Tabelle, jedes Pixel drei Farbwerte. Diese Zahlen schreibt der Computer binär mit Bits."
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Ein UTF-8-Byte, das mit [[0]] beginnt, ist ein ASCII-Zeichen. Folgebytes beginnen immer mit [[10]]. Ein Startbyte mit 1110 kündigt [[drei]] Bytes an.
      distractors:
        - "11"
        - zwei
        - vier
    hints:
      - Folgebytes müssen sich von Startbytes unterscheiden.
      - Die Zahl der Einsen vorn im Startbyte ist die Länge.
    explanation: 0xxxxxxx ist ASCII, 110 startet 2 Bytes, 1110 startet 3, 11110 startet 4, 10 heißt »Folgebyte«. So findet man auch mitten im Text den Anfang eines Zeichens.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Eine Webseite zeigt »GrÃ¼ÃŸe« statt »Grüße«. Was ist passiert?
    params:
      options:
        - label: UTF-8-Bytes wurden als alte 8-Bit-Codierung gelesen – jedes Byte als eigenes Zeichen
          correct: true
        - label: Die Datei ist kaputt
          feedback: Die Bytes sind in Ordnung, nur falsch gedeutet.
        - label: Die Schrift kennt kein ü
          feedback: Dann sähe man ein Ersatzkästchen, nicht zwei Zeichen.
    hints:
      - ü braucht in UTF-8 zwei Bytes. Wie viele Zeichen siehst du statt ü?
      - Zwei Zeichen pro Umlaut – also wurde jedes Byte einzeln übersetzt.
    explanation: ü ist C3 BC. In Windows-1252 ist C3 »Ã« und BC »¼«. Dieses Zeichensalat-Phänomen heißt Mojibake.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: Unicode-Nummern reichen bis 0x10FFFF, also 1 114 111. Wie viele Bits braucht man mindestens, um jede davon zu speichern?
    answer:
      value: 21
    hints:
      - $2^{20}$ ist 1 048 576. Reicht das?
      - Knapp nicht – also ein Bit mehr.
    explanation: $2^{20}$ < 1 114 111 < $2^{21}$. 21 Bits – genau so viele trägt das längste UTF-8-Muster mit 4 Bytes.
    difficulty: 3

srs:
  cards_from: [nummer, bytes]
