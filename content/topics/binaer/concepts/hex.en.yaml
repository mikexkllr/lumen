id: cs.binary.hex
type: concept
title: Colors in Hex
summary: How web pages write colors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Colours as code
    body: Every colour on a web page hides in six characters. First guess which colour is behind a code. Then flip the card. Each pair of characters stands for **red, green and blue**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🎨
            front: "#FFFF00"
            back: "Yellow: red and green fully on, blue off. On a screen that mixes to yellow."
          - icon: 🖌️
            front: "#FF8800"
            back: "Orange: red fully on, green about half, blue off."
          - icon: 🖍️
            front: "#00FFFF"
            back: "Cyan: green and blue fully on, red completely off."
          - icon: 💡
            front: "#FFC0CB"
            back: 'Pink: lots of red, a bit less green and blue. On the web it is simply called "pink".'

  - kind: problem
    id: vier-bits
    widget: bits
    prompt: Four bits make one hex digit. Set the largest one.
    params: { bits: 4, showValue: false }
    answer: { value: 15 }
    hints:
      - All lamps on.
    explanation: 8 + 4 + 2 + 1 = 15. In hex, this is written F.

  - kind: explain
    id: s2
    body: |
      **Hexadecimal** counts up to 16: 0–9, then A to F for 10 to 15. Two hex digits describe one byte – 00 to FF, which is 0 to 255.

  - kind: problem
    id: lesen
    widget: numeric
    prompt: What is hex {{hex(n)}} in the decimal system?
    params: { placeholder: "Number" }
    answer: { value: "{{n}}" }
    hints:
      - Multiply the first digit by 16, then add the second.
      - A = 10, B = 11, … F = 15.
    explanation: "{{hex(n)}} = {{floor(n / 16)}} · 16 + {{mod(n, 16)}} = {{n}}."
    variants:
      params: { n: "int[20,250]" }
      defaults: { n: 171 }

  - kind: problem
    id: farbe
    widget: match
    prompt: Web colors have three bytes – red, green, blue. Match them up.
    params:
      pairs:
        - { left: "#FF0000", right: Red }
        - { left: "#00FF00", right: Green }
        - { left: "#FFFFFF", right: White }
        - { left: "#000000", right: Black }
    hints:
      - FF means full power, 00 means off.
    explanation: All three channels at full make white. All off make black.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: How much is hex FF in decimal?
    answer:
      value: 255
    hints:
      - F is 15. Compute 15 · 16 + 15.
    explanation: 240 + 15 = 255 – the largest value of a byte.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: match
    prompt: Every four bits make one hex digit. Match them.
    params:
      pairs:
        - left: "1010"
          right: A
        - left: "1111"
          right: F
        - left: "1100"
          right: C
        - left: "0111"
          right: "7"
        - left: "1001"
          right: "9"
      leftTitle: Binary
      rightTitle: Hex
    hints:
      - Work out the four bits in decimal first.
      - A is 10, B 11, C 12 … F 15.
    explanation: 8 + 2 = 10 = A, 15 = F, 8 + 4 = 12 = C, 7 stays 7, 8 + 1 = 9.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: "A web colour #RRGGBB has six hex digits. How many different colours are there?"
    answer:
      value: 16777216
    feedback:
      - when: numval(state.input) == 96
        misconception: multiply-wrong
        text: "You multiply the possibilities, not the digits: 16 · 16 · …"
    hints:
      - Each hex digit has 16 options.
      - $16^6$ or $2^{24}$.
    explanation: $16^6 = 2^{24}$ = 16,777,216 – about 16.7 million colours.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: "#000000 is white."
          right: false
          why: All channels off – that is black.
        - text: "#FFFFFF is white."
          right: true
          why: Red, green and blue at full give white.
        - text: "#FF00FF is magenta."
          right: true
          why: Red plus blue without green.
        - text: "#00FFFF is yellow."
          right: false
          why: "Green plus blue is cyan. Yellow would be #FFFF00."
        - text: "#333333 is darker than #CCCCCC."
          right: true
          why: 33 is 51, CC is 204.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "The web colour #808080 – which colour is that?"
    params:
      options:
        - label: Medium grey
          correct: true
        - label: White
          feedback: "White would be #FFFFFF."
        - label: Dark red
          feedback: For that only the first channel would have to be high.
    hints:
      - 80 hex is 128 – half of 255. All three channels are equal.
    explanation: Equal values for red, green and blue always give grey.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: A **bit mask** lets you pick out single bits. x AND 0x0F keeps only the right four bits and clears the rest. So 0xB6 becomes 0x06.

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: You compute 0x{{hex(n)}} AND 0x0F. What do you get? Give the number in decimal.
    answer:
      value: "{{mod(n, 16)}}"
    feedback:
      - when: numval(state.input) == floor(n / 16)
        misconception: mask-side
        text: That is the left hex digit. The mask 0F keeps the right one.
    hints:
      - 0x0F is 00001111 in binary.
      - Only the right hex digit remains.
    explanation: The right digit of {{hex(n)}} is {{hex(mod(n, 16))}}, i.e. {{mod(n, 16)}}. That equals {{n}} mod 16.
    difficulty: 3
    variants:
      params:
        n: int[26,250]
      constraints:
        - mod(n, 16) > 0
      defaults:
        n: 182

  - kind: problem
    id: cs-x3
    depth: 3
    widget: numeric
    prompt: An IPv6 address has 128 bits. How many hex digits does it take to write it down?
    answer:
      value: 32
    hints:
      - How many bits are in one hex digit?
      - 128 divided by 4.
    explanation: 128 / 4 = 32 digits, written as 8 groups of 4 – like 2001:0db8:….
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: choice
    prompt: Why do programmers like to write bytes in hex and not in decimal?
    params:
      options:
        - label: Each hex digit is exactly 4 bits – you can see the bits directly
          correct: true
        - label: Hex numbers are smaller
          feedback: It is the same number, just written differently.
        - label: The computer computes in hex internally
          feedback: Internally it uses binary. Hex is just notation for humans.
    hints:
      - How many bits match one decimal digit?
      - "With hex the boundary fits exactly: 16 = $2^4$."
    explanation: "Decimal digits do not line up with bits. In hex you read it off: 0xB6 = 1011 0110."
    difficulty: 3

srs:
  cards_from: [lesen, farbe]
