id: cs.binary.hex
type: concept
title: Colors in Hex
summary: How web pages write colors.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: vier-bits
    widget: bits
    prompt: Four bits make one hex digit. Set the largest one.
    params: { bits: 4, showValue: false }
    answer: { value: 15 }
    hints:
      - All lamps on.
    explanation: 8 + 4 + 2 + 1 = 15. In hex, this is written F.

  - kind: explain
    body: |
      **Hexadecimal** counts up to 16: 0–9, then A to F for 10 to 15. Two hex digits describe one byte – 00 to FF, which is 0 to 255.

  - kind: problem
    id: lesen
    widget: numeric
    prompt: What is hex {{hex(n)}} in the decimal system?
    params: { placeholder: "Number" }
    answer: { value: "{{n}}" }
    hints:
      - Multiply the first digit by 16, then add the second.
      - A = 10, B = 11, … F = 15.
    explanation: "{{hex(n)}} = {{floor(n / 16)}} · 16 + {{mod(n, 16)}} = {{n}}."
    variants:
      params: { n: "int[20,250]" }
      defaults: { n: 171 }

  - kind: problem
    id: farbe
    widget: match
    prompt: Web colors have three bytes – red, green, blue. Match them up.
    params:
      pairs:
        - { left: "#FF0000", right: Red }
        - { left: "#00FF00", right: Green }
        - { left: "#FFFFFF", right: White }
        - { left: "#000000", right: Black }
    hints:
      - FF means full power, 00 means off.
    explanation: All three channels at full make white. All off make black.

srs:
  cards_from: [lesen, farbe]
