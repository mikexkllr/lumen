id: cs.binary.convert
type: concept
title: Hin und zurück rechnen
summary: Binär in dezimal und umgekehrt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 14
steps:
  - kind: problem
    id: nach-dezimal
    widget: numeric
    prompt: Rechne die Binärzahl {{b}} in eine Dezimalzahl um.
    params: { placeholder: "Dezimalzahl" }
    answer: { value: "{{n}}" }
    hints:
      - Schreib über jede Stelle ihren Wert – von rechts 1, 2, 4, 8, 16.
      - Zähle nur die Stellen mit einer 1 zusammen.
    explanation: "{{b}} ergibt {{n}}."
    variants:
      params: { n: "int[9,31]" }
      derive: { b: "bin(n)" }
      defaults: { n: 22 }

  - kind: explain
    id: s2
    body: |
      **Dezimal nach binär:** Nimm die größte Zweierpotenz, die passt. Zieh sie ab. Wiederhole mit dem Rest.
      Beispiel: 11 = 8 + 2 + 1 – also **1011**.

  - kind: problem
    id: nach-binaer
    widget: numeric
    prompt: Schreibe {{n}} als Binärzahl.
    params: { placeholder: "nur 0 und 1", keypad: true }
    answer: { value: "{{bin(n)}}" }
    hints:
      - Welche Zweierpotenz ist die größte, die in {{n}} passt?
    explanation: "{{n}} = {{bin(n)}}."
    variants:
      params: { n: "int[5,20]" }
      defaults: { n: 6 }

  - kind: problem
    id: plus-eins
    widget: bits
    prompt: Zähle eins weiter. Welche Zahl kommt nach 0111?
    params: { bits: 4, initial: "0111", showValue: false }
    answer: { value: 8 }
    hints:
      - Wie beim Zehnersystem nach 0999 – es gibt einen Übertrag.
    explanation: Alle Einsen kippen auf 0, die nächste Stelle springt auf 1. Aus 0111 wird 1000.

  - kind: problem
    id: paare
    widget: match
    prompt: Verbinde jede Binärzahl mit ihrem Wert.
    params:
      leftTitle: Binär
      rightTitle: Dezimal
      pairs:
        - { left: "101", right: "5" }
        - { left: "1001", right: "9" }
        - { left: "111", right: "7" }
        - { left: "1100", right: "12" }
    hints:
      - Fang mit der kürzesten Zahl an.
    explanation: 101 = 5, 111 = 7, 1001 = 9 und 1100 = 12.

  - kind: explain
    id: s6
    body: Warum rechnen Computer überhaupt mit 0 und 1?
    reveal:
      body: Ein Transistor kennt zwei sichere Zustände – Strom an oder aus. Zwei Zustände lassen sich kaum verwechseln. Das macht Rechnen robust.

  - kind: problem
    id: gerade
    widget: choice
    prompt: Eine Binärzahl endet auf 0. Was weißt du sicher über sie?
    params:
      options:
        - { label: Sie ist gerade., correct: true }
        - { label: Sie ist ungerade., feedback: "Die letzte Stelle ist die Einerstelle. Ist sie 0, fehlt die 1." }
        - { label: Sie ist durch 10 teilbar., feedback: "Das gilt im Zehnersystem. Hier sind die Stellen 1, 2, 4 …" }
        - { label: Nichts., feedback: "Die letzte Stelle verrät doch etwas. Welchen Wert hat sie?" }
    hints:
      - Alle anderen Stellen sind 2, 4, 8 … wert.
    explanation: Nur die letzte Stelle ist ungerade (1). Fehlt sie, bleibt eine gerade Summe.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Binär 1000 ist 8.
          right: true
        - text: Binär 111 ist 8.
          right: false
          why: 4 + 2 + 1 = 7.
        - text: Eine Binärzahl, die auf 1 endet, ist ungerade.
          right: true
        - text: Binär 10 + 10 = 20.
          right: false
          why: 2 + 2 = 4, also binär 100.

  - kind: problem
    id: d1
    depth: 2
    widget: bits
    prompt: Rechne binär 0110 + 0111 und stelle das Ergebnis ein.
    params:
      bits: 5
      showValue: false
    answer:
      value: 13
    hints:
      - 6 + 7 im Kopf – oder stellenweise mit Übertrag.
    explanation: 6 + 7 = 13 = 01101.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "Addiere binär: {{bin(a)}} + {{bin(b)}}. Schreib die Summe binär."
    params:
      placeholder: nur 0 und 1
    answer:
      value: "{{bin(a + b)}}"
    feedback:
      - when: numval(state.input) == a + b
        misconception: wrong-base
        text: Das ist die Summe als Dezimalzahl. Gefragt ist sie binär.
    hints:
      - Rechne von rechts nach links. 1 + 1 ergibt 0, Übertrag 1.
      - "Zur Kontrolle: {{a}} + {{b}} = {{a + b}}. Wandle das um."
    explanation: "{{a}} + {{b}} = {{a + b}}, binär {{bin(a + b)}}."
    difficulty: 2
    variants:
      params:
        a: int[5,15]
        b: int[3,15]
      defaults:
        a: 11
        b: 6

  - kind: explain
    id: cs-d2
    depth: 2
    body: Negative Zahlen speichert der Computer im **Zweierkomplement**. Bei 8 Bits zählt das linke Bit −128 statt +128. So ist 11111111 = −128 + 127 = −1.

  - kind: problem
    id: cs-d3
    depth: 2
    widget: bits
    prompt: Stelle −{{n}} im Zweierkomplement ein. Das linke Bit zählt −128.
    params:
      bits: 8
      showValue: false
      placeValues: false
      labels:
        - −128
        - "64"
        - "32"
        - "16"
        - "8"
        - "4"
        - "2"
        - "1"
    answer:
      value: "{{256 - n}}"
    hints:
      - Ohne das linke Bit ist alles positiv. Das linke Bit muss also an.
      - −128 + {{128 - n}} = −{{n}}. Stelle mit den übrigen Bits {{128 - n}} ein.
    explanation: −{{n}} = −128 + {{128 - n}}, also {{bin(256 - n)}}.
    variants:
      params:
        n: int[2,30]
      defaults:
        n: 3
    difficulty: 2

  - kind: problem
    id: cs-d4
    depth: 2
    widget: choice
    prompt: Wie kommt man schnell von 5 (00000101) zu −5?
    params:
      options:
        - label: Alle Bits umdrehen, dann 1 addieren
          correct: true
        - label: Nur das linke Bit auf 1 setzen
          feedback: Das ergibt −128 + 5 = −123.
        - label: Alle Bits umdrehen
          feedback: Fast – 11111010 ist −6. Es fehlt noch +1.
    hints:
      - "Probier es aus: Was ist 11111010 im Zweierkomplement?"
      - Umdrehen ergibt −6. Was fehlt bis −5?
    explanation: Umdrehen liefert −x − 1, plus 1 ergibt −x. 00000101 → 11111010 → 11111011.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie speichert ein Computer mit 8 Bits die Zahl −1?
    params:
      options:
        - label: Als 11111111 – das Zweierkomplement
          correct: true
        - label: Als 10000001 – ein Bit fürs Vorzeichen
          feedback: Das wäre naheliegend, aber dann gäbe es zwei Nullen und das Rechnen wäre umständlich.
        - label: Gar nicht – Bits können nicht negativ sein
          feedback: Es ist eine Frage der Vereinbarung.
    hints:
      - Addiere 1 zu 11111111 und lass den Übertrag wegfallen.
    explanation: 11111111 + 1 = 00000000. Im **Zweierkomplement** funktioniert dieselbe Addierschaltung für plus und minus.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: Welche ist die kleinste Zahl, die 8 Bits im Zweierkomplement speichern?
    answer:
      value: -128
    feedback:
      - when: numval(state.input) == -127
        misconception: sign-magnitude
        text: Das wäre bei »Vorzeichen plus Betrag«. Das Zweierkomplement hat eine negative Zahl mehr.
      - when: numval(state.input) == -255
        misconception: unsigned-range
        text: Mit 8 Bits gibt es nur 256 Werte – von negativ bis positiv.
    hints:
      - Nur das linke Bit ist an, alle anderen aus.
      - Das linke Bit zählt −128.
    explanation: 10000000 = −128. Der Bereich reicht von −128 bis 127 – 256 Werte.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: Ein 8-Bit-Zähler mit Vorzeichen steht bei 127 (01111111). Du addierst 1. Was steht danach drin?
    params:
      options:
        - label: −128 – ein Überlauf
          correct: true
        - label: "128"
          feedback: 128 passt nicht in 8 Bits mit Vorzeichen.
        - label: "0"
          feedback: Auf 0 springt erst 11111111 + 1.
    hints:
      - Rechne 01111111 + 1 binär.
      - Heraus kommt 10000000. Was zählt das linke Bit?
    explanation: "Der Übertrag landet im Vorzeichenbit: Aus 127 wird −128. Solche **Überläufe** haben schon echte Systeme lahmgelegt – 1996 etwa die Rakete Ariane 5."
    difficulty: 3

  - kind: explain
    id: cs-x3
    depth: 3
    body: Warum rechnen Computer so gern im Zweierkomplement?
    reveal:
      body: Addieren geht wie immer, ohne Sonderfall fürs Vorzeichen. 00000101 + 11111011 = 1 00000000. Der Übertrag fällt aus den 8 Bits – übrig bleibt 0, also 5 + (−5).

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie ein Computer mit 8 Bits die Zahl −1 speichert – und warum gerade so.
    params:
      keywords:
        - - "11111111"
          - alle einsen
          - all ones
        - - "-128"
          - minus 128
          - −128
        - - addier
          - plus
          - add
          - summe
          - sum
      sample: "Als 11111111. Im Zweierkomplement zählt das linke Bit −128, die übrigen zusammen 127. −128 + 127 = −1. Der Vorteil: Addieren klappt ohne Sonderregel, denn −1 plus 1 ergibt 0, weil der Übertrag herausfällt."
    difficulty: 3

srs:
  cards_from: [nach-dezimal, nach-binaer]
