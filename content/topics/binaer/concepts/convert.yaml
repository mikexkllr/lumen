id: cs.binary.convert
type: concept
title: Hin und zurück rechnen
summary: Binär in dezimal und umgekehrt.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: problem
    id: nach-dezimal
    widget: numeric
    prompt: Rechne die Binärzahl {{b}} in eine Dezimalzahl um.
    params: { placeholder: "Dezimalzahl" }
    answer: { value: "{{n}}" }
    hints:
      - Schreib über jede Stelle ihren Wert – von rechts 1, 2, 4, 8, 16.
      - Zähle nur die Stellen mit einer 1 zusammen.
    explanation: "{{b}} ergibt {{n}}."
    variants:
      params: { n: "int[9,31]" }
      derive: { b: "bin(n)" }
      defaults: { n: 22 }

  - kind: explain
    id: s2
    body: |
      **Dezimal nach binär:** Nimm die größte Zweierpotenz, die passt. Zieh sie ab. Wiederhole mit dem Rest.
      Beispiel: 11 = 8 + 2 + 1 – also **1011**.

  - kind: problem
    id: nach-binaer
    widget: numeric
    prompt: Schreibe {{n}} als Binärzahl.
    params: { placeholder: "nur 0 und 1", keypad: true }
    answer: { value: "{{bin(n)}}" }
    hints:
      - Welche Zweierpotenz ist die größte, die in {{n}} passt?
    explanation: "{{n}} = {{bin(n)}}."
    variants:
      params: { n: "int[5,20]" }
      defaults: { n: 6 }

  - kind: problem
    id: plus-eins
    widget: bits
    prompt: Zähle eins weiter. Welche Zahl kommt nach 0111?
    params: { bits: 4, initial: "0111", showValue: false }
    answer: { value: 8 }
    hints:
      - Wie beim Zehnersystem nach 0999 – es gibt einen Übertrag.
    explanation: Alle Einsen kippen auf 0, die nächste Stelle springt auf 1. Aus 0111 wird 1000.

  - kind: problem
    id: paare
    widget: match
    prompt: Verbinde jede Binärzahl mit ihrem Wert.
    params:
      leftTitle: Binär
      rightTitle: Dezimal
      pairs:
        - { left: "101", right: "5" }
        - { left: "1001", right: "9" }
        - { left: "111", right: "7" }
        - { left: "1100", right: "12" }
    hints:
      - Fang mit der kürzesten Zahl an.
    explanation: 101 = 5, 111 = 7, 1001 = 9 und 1100 = 12.

  - kind: explain
    id: s6
    body: Warum rechnen Computer überhaupt mit 0 und 1?
    reveal:
      body: Ein Transistor kennt zwei sichere Zustände – Strom an oder aus. Zwei Zustände lassen sich kaum verwechseln. Das macht Rechnen robust.

  - kind: problem
    id: gerade
    widget: choice
    prompt: Eine Binärzahl endet auf 0. Was weißt du sicher über sie?
    params:
      options:
        - { label: Sie ist gerade., correct: true }
        - { label: Sie ist ungerade., feedback: "Die letzte Stelle ist die Einerstelle. Ist sie 0, fehlt die 1." }
        - { label: Sie ist durch 10 teilbar., feedback: "Das gilt im Zehnersystem. Hier sind die Stellen 1, 2, 4 …" }
        - { label: Nichts., feedback: "Die letzte Stelle verrät doch etwas. Welchen Wert hat sie?" }
    hints:
      - Alle anderen Stellen sind 2, 4, 8 … wert.
    explanation: Nur die letzte Stelle ist ungerade (1). Fehlt sie, bleibt eine gerade Summe.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Binär 1000 ist 8.
          right: true
        - text: Binär 111 ist 8.
          right: false
          why: 4 + 2 + 1 = 7.
        - text: Eine Binärzahl, die auf 1 endet, ist ungerade.
          right: true
        - text: Binär 10 + 10 = 20.
          right: false
          why: 2 + 2 = 4, also binär 100.

  - kind: problem
    id: d1
    depth: 2
    widget: bits
    prompt: Rechne binär 0110 + 0111 und stelle das Ergebnis ein.
    params:
      bits: 5
      showValue: false
    answer:
      value: 13
    hints:
      - 6 + 7 im Kopf – oder stellenweise mit Übertrag.
    explanation: 6 + 7 = 13 = 01101.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie speichert ein Computer mit 8 Bits die Zahl −1?
    params:
      options:
        - label: Als 11111111 – das Zweierkomplement
          correct: true
        - label: Als 10000001 – ein Bit fürs Vorzeichen
          feedback: Das wäre naheliegend, aber dann gäbe es zwei Nullen und das Rechnen wäre umständlich.
        - label: Gar nicht – Bits können nicht negativ sein
          feedback: Es ist eine Frage der Vereinbarung.
    hints:
      - Addiere 1 zu 11111111 und lass den Übertrag wegfallen.
    explanation: 11111111 + 1 = 00000000. Im **Zweierkomplement** funktioniert dieselbe Addierschaltung für plus und minus.
    difficulty: 3

srs:
  cards_from: [nach-dezimal, nach-binaer]
