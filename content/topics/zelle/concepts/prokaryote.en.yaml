id: bio.cell.prokaryote
type: concept
title: "With and without a nucleus"
summary: "Prokaryotes and eukaryotes compared."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Bacteria have existed for about 3.5 billion years, cells with a nucleus for about 2 billion. So which came first?
    params:
      options:
        - label: Cells without a nucleus
          correct: true
        - label: Cells with a nucleus
          feedback: The oldest traces come from cells without one.
        - label: Both at the same time
          feedback: About 1.5 billion years lie between them.
    hints:
      - Compare the two numbers.
      - 3.5 billion years ago is longer ago than 2 billion.
    explanation: For over a billion years there were only cells without a nucleus.

  - kind: explain
    id: c1
    body: "**Prokaryotes** are cells without a nucleus: bacteria and archaea. Their DNA lies free in the cytoplasm, usually as a ring. They are small, mostly 1 to 10 µm."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Where is this found?
    params:
      buckets:
        - id: b1
          label: prokaryote only
        - id: b2
          label: both
        - id: b3
          label: eukaryote only
      items:
        - label: DNA free in cytoplasm
          bucket: b1
        - label: Ribosomes
          bucket: b2
        - label: Cell membrane
          bucket: b2
        - label: DNA as genetic material
          bucket: b2
        - label: Nucleus
          bucket: b3
        - label: Mitochondria
          bucket: b3
    hints:
      - Every cell needs a boundary and protein factories.
      - Organelles with membranes are found only in eukaryotes.
    explanation: Every cell has a membrane, ribosomes and DNA. Only eukaryotes have a nucleus and mitochondria.

  - kind: problem
    id: c3
    widget: choice
    prompt: A cell is 50 µm across and has many membrane compartments. What is it probably?
    params:
      options:
        - label: A eukaryote
          correct: true
        - label: A bacterium
          feedback: Bacteria are usually much smaller and have no membrane-bound organelles.
        - label: A virus
          feedback: Viruses are not cells and are much smaller.
    hints:
      - How big are prokaryotes usually?
      - Membrane compartments are organelles.
    explanation: Eukaryotes are usually 10 to 100 µm and full of organelles.

  - kind: problem
    id: c4
    widget: numeric
    prompt: A bacterium is 2 µm, a body cell {{d}} µm across. How many times larger is the body cell’s diameter?
    answer:
      value: "{{d / 2}}"
    hints:
      - Divide the two diameters.
      - "{{d}} ÷ 2"
    explanation: "{{d}} µm ÷ 2 µm = {{d / 2}}. In volume the difference is far bigger: {{(d / 2) ** 3}} times."
    variants:
      params:
        d: choice[10,20,30,40]
      defaults:
        d: 20

  - kind: explain
    id: d1
    depth: 2
    body: Many bacteria carry small DNA rings in addition to their main ring. They can swap these **plasmids** with each other. That is how genes spread, for example for antibiotic resistance.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: An antibiotic attacks the cell wall of bacteria. Why doesn’t it harm your cells?
    params:
      options:
        - label: Human cells have no such cell wall.
          correct: true
        - label: It is too weak for large cells.
          feedback: It is about the target, not the size.
        - label: Our immune system keeps it away.
          feedback: The antibiotic is everywhere in the blood. It simply finds no target in us.
    hints:
      - Do animal cells have a cell wall?
      - A good drug hits something only the pathogen has.
    explanation: Penicillin disrupts building of the bacterial cell wall. Animal cells have none – which makes it so well tolerated.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Prokaryote or eukaryote?
    params:
      cards:
        - text: Cyanobacteria that photosynthesise
          right: false
          why: "Photosynthesis without chloroplasts: they are bacteria themselves."
        - text: Yeast cell
          right: true
          why: Yeast is a fungus with a nucleus.
        - text: Archaea from hot springs
          right: false
          why: Archaea have no nucleus.
        - text: Paramecium
          right: true
          why: A single cell with a nucleus – even two.
      left: prokaryote
      right: eukaryote
    explanation: Single-celled does not mean prokaryotic. The nucleus is what counts.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eukaryotes probably arose from an archaeon that took up a bacterium. Which finding fits this?
    params:
      options:
        - label: Many of our genes for reading DNA resemble those of archaea.
          correct: true
        - label: Humans have no bacterial genes.
          feedback: They do – the mitochondria come from bacteria.
        - label: Archaea have mitochondria.
          feedback: Archaea have no mitochondria. Those came later.
    hints:
      - Two partners, two traces in the genome.
      - DNA reading is ancient and reveals ancestry.
    explanation: Our nucleus shows archaeal traces, our mitochondria bacterial ones. Eukaryotes are a merger.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Explain to Lux: how do cells with and without a nucleus differ?"
    params:
      keywords:
        - - kern
          - nucleus
        - - bakter
          - archae
        - - organell
          - mitochond
        - - klein
          - groß
          - gross
          - groesser
          - small
          - larg
          - size
      sample: Prokaryotes such as bacteria and archaea have no nucleus and no membrane-bound organelles. Eukaryotes have a nucleus and mitochondria and are usually much larger.
    explanation: The nucleus is the key feature, plus organelles and size.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
