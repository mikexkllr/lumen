id: bio.cell.membrane
type: concept
title: "Membranes and diffusion"
summary: "How substances get into the cell."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: You put a drop of ink into a glass of water and don’t stir. What happens?
    params:
      options:
        - label: The ink slowly spreads through the whole glass by itself.
          correct: true
        - label: It stays a drop forever.
          feedback: Particles jiggle constantly and mix.
        - label: It only sinks to the bottom.
          feedback: Maybe a little – but then it spreads everywhere.
    hints:
      - Particles are never completely still.
      - Where there is a lot of ink, it moves to where there is little.
    explanation: "That is diffusion: random motion spreads particles until they are equally dense everywhere."

  - kind: explain
    id: c1
    body: In **diffusion** particles move by themselves from where they are concentrated to where they are scarce. They are driven by random heat motion. This needs no energy.

  - kind: problem
    id: c2
    widget: choice
    prompt: The lungs hold lots of oxygen, the blood little. Where does it diffuse?
    params:
      options:
        - label: From the lungs into the blood
          correct: true
        - label: From the blood into the lungs
          feedback: Diffusion goes from high to low.
        - label: Nowhere – that needs a pump.
          feedback: For oxygen, diffusion is enough.
    hints:
      - Where is the concentration higher?
      - Diffusion evens out differences.
    explanation: Oxygen diffuses into the blood, carbon dioxide into the lungs – each from high to low.

  - kind: explain
    id: c3
    body: The **cell membrane** is a double layer of fat molecules. Their heads like water, their tails do not. Small gases slip through. Sugar and ions need their own channels.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Does the substance pass straight through the membrane – or does it need a channel?
    params:
      buckets:
        - id: b1
          label: passes directly
        - id: b2
          label: needs channel or carrier
      items:
        - label: Oxygen O₂
          bucket: b1
        - label: Carbon dioxide CO₂
          bucket: b1
        - label: Glucose
          bucket: b2
        - label: Sodium ions Na⁺
          bucket: b2
        - label: Potassium ions K⁺
          bucket: b2
    hints:
      - The inside of the membrane is fatty.
      - Charged or large particles pass badly through fat.
    explanation: Small uncharged gases dissolve in the membrane’s fat. Ions and sugar need protein gates.

  - kind: explain
    id: d1
    depth: 2
    body: Sometimes a cell must pump substances against the gradient. This is called **active transport** and costs energy in the form of ATP. The sodium–potassium pump moves 3 Na⁺ out and 2 K⁺ in per ATP.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A pump uses {{n}} ATP. How many Na⁺ ions has it moved out?
    answer:
      value: "{{3 * n}}"
    feedback:
      - when: numval(state.input) == 2 * n
        misconception: k-na
        text: That is the K⁺ ions that come in.
    hints:
      - How many Na⁺ per ATP?
      - 3 × {{n}}
    explanation: "3 Na⁺ per ATP: {{3 * n}} sodium ions out, {{2 * n}} potassium ions in."
    difficulty: 2
    variants:
      params:
        n: int[2,20]
      defaults:
        n: 10

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Passive or active?
    params:
      buckets:
        - id: b1
          label: passive, no energy
        - id: b2
          label: active, uses ATP
      items:
        - label: O₂ enters the blood
          bucket: b1
        - label: Water flows through channels
          bucket: b1
        - label: Na⁺–K⁺ pump works
          bucket: b2
        - label: Gut takes up the last sugar
          bucket: b2
    hints:
      - Is it with or against the gradient?
      - Against the gradient needs energy.
    explanation: With the gradient it happens by itself. Against it you need an ATP-driven pump.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A small molecule takes 0.1 s to diffuse 10 µm. The time grows with the square of the distance. How many seconds does it take for 1 mm?
    params:
      unit: s
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 10
        misconception: linear-diffusion
        text: That would be linear. The distance is 100 times longer, so the time is 100² times.
    hints:
      - How many times longer is 1 mm than 10 µm?
      - 100 times as far means 10,000 times as long.
    explanation: 0.1 s × 100² = 1000 s, a good quarter of an hour. For cells diffusion is fast, for large bodies far too slow – hence circulatory systems.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how substances get into and out of a cell.
    params:
      keywords:
        - - diffus
        - - konzentration
          - viel
          - wenig
          - concentrat
          - high
          - low
        - - membran
          - membrane
        - - kanal
          - pumpe
          - träger
          - traeger
          - channel
          - pump
          - carrier
        - - energie
          - atp
          - energy
      sample: By diffusion substances move from high to low concentration through the membrane. Ions and sugar need channels. Pumps work against the gradient using energy from ATP.
    explanation: Passive with the gradient, active against it – and the membrane decides who gets through.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "x1"]
