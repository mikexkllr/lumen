id: bio.cell.size
type: concept
title: "Why cells are small"
summary: "Surface, volume and their ratio."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The secret of the edges
    body: Almost every cell in you is thinner than a hair. Split the square into smaller and smaller pieces. The area stays the same – but count the **edges**! That holds the secret of small cells.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 1
        shape: square
        partOptions:
          - 4
          - 9
          - 16
          - 25

  - kind: problem
    id: hook
    widget: choice
    prompt: Why is there no single cell as big as a football that lives like your cells do?
    params:
      options:
        - label: Substances could not get through the surface into the inside fast enough.
          correct: true
        - label: It would be too heavy to move.
          feedback: Even cells that do not move stay small.
        - label: There is not enough DNA for it.
          feedback: DNA could be copied. The problem is supply.
    hints:
      - Everything a cell needs must pass through its boundary.
      - Compare how fast the surface and the contents grow.
    explanation: As a cell grows, its volume grows faster than its surface. Supply becomes too scarce.

  - kind: explain
    id: c1
    body: "A cube with edge a has surface 6·a² and volume a³. So the **surface-to-volume ratio** is 6 : a. The bigger the cube, the smaller it gets."

  - kind: problem
    id: c2
    widget: chart
    prompt: Set the surface-to-volume ratio for cube cells with edges of 1, 2 and 3 µm.
    params:
      title: "Surface : volume"
      labels:
        - 1 µm
        - 2 µm
        - 3 µm
      values:
        - 1
        - 1
        - 1
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 8
      step: 1
    answer:
      values:
        - 6
        - 3
        - 2
    hints:
      - "The ratio is 6 : a."
      - 6 ÷ 1, 6 ÷ 2 and 6 ÷ 3.
    explanation: "6, 3 and 2: double the edge, half the ratio. Big cells have little surface per volume."

  - kind: problem
    id: c3
    widget: numeric
    prompt: A cube has an edge of {{a}} µm. What is its surface-to-volume ratio (in 1/µm)?
    answer:
      value: "{{6 / a}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == a / 6
        misconception: inverted-ratio
        text: "Upside down: surface divided by volume, so 6 ÷ a."
    hints:
      - Surface 6 × {{a}}², volume {{a}}³.
      - "Simplify: 6 ÷ {{a}}."
    explanation: 6 × {{a}}² ÷ {{a}}³ = 6 ÷ {{a}} ≈ {{round(600 / a) / 100}}.
    variants:
      params:
        a: choice[2,3,4,5,10]
      defaults:
        a: 4

  - kind: explain
    id: d1
    depth: 2
    body: Cells have tricks against the problem. Gut cells carry tiny projections called **microvilli**. Nerve cells become long and thin. Red blood cells are flat discs.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A cell doubles its edge length. How do surface and volume change?
    params:
      options:
        - label: Surface times 4, volume times 8
          correct: true
        - label: Both times 2
          feedback: Area has two dimensions, volume three.
        - label: Surface times 8, volume times 4
          feedback: "Swapped: volume grows faster."
    hints:
      - Area grows with the square.
      - 2² = 4 and 2³ = 8.
    explanation: Four times the surface must supply eight times the contents. Per volume, the surface halves.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Does the shape raise the surface-to-volume ratio?
    params:
      buckets:
        - id: b1
          label: yes, more surface
        - id: b2
          label: no
      items:
        - label: Flat disc
          bucket: b1
        - label: Long thin thread
          bucket: b1
        - label: Many folds
          bucket: b1
        - label: Large sphere
          bucket: b2
        - label: Fat cube
          bucket: b2
    hints:
      - In which shape is every point close to the surface?
      - The sphere has the smallest surface for a given volume.
    explanation: Flat, thin and folded adds surface. Spheres and fat cubes are compact.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: An ostrich egg is a single cell and many centimetres across. How is that possible?
    params:
      options:
        - label: Most of it is yolk as a store, not active cytoplasm.
          correct: true
        - label: Ostriches have especially strong cells.
          feedback: Strength is irrelevant. The contents are barely active.
        - label: Eggs need no exchange.
          feedback: They do – gases pass through the shell. But yolk uses hardly anything.
    hints:
      - What is the yellow part of the egg?
      - A store uses hardly any energy.
    explanation: The living part of the egg is just a small spot on the yolk. After fertilisation it divides into many small cells.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: A spherical cell grows to {{k}} times its diameter. By what factor does its surface-to-volume ratio fall?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == k * k
        misconception: area-only
        text: That is how the surface grows. The ratio is k² ÷ k³.
      - when: numval(state.input) == k * k * k
        misconception: volume-only
        text: That is how volume grows. Now divide the surface by it.
    hints:
      - Surface times {{k}}², volume times {{k}}³.
      - "{{k}}² ÷ {{k}}³ = 1 ÷ {{k}}."
    explanation: The ratio drops to 1/{{k}}. A growing cell must eventually divide.
    difficulty: 3
    variants:
      params:
        k: int[2,5]
      defaults:
        k: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why cells have to stay small.
    params:
      keywords:
        - - oberfläche
          - oberflaeche
          - surface
        - - volumen
          - volume
        - - schneller
          - quadrat
          - hoch drei
          - faster
          - square
          - cube
        - - nachschub
          - austausch
          - versorg
          - diffus
          - supply
          - exchange
      sample: When a cell grows, its volume grows with the cube but its surface only with the square. Then the boundary is not enough for exchange. So cells divide instead.
    explanation: "The ratio 6 : a explains why life is made of many small cells."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
