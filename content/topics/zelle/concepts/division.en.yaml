id: bio.cell.division
type: concept
title: "Cell division"
summary: "Mitosis: one cell becomes two identical ones."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The cycle of cells
    body: While you read this, millions of cells in you are dividing. Every division follows a fixed routine. Uncover the **cell cycle** – at the end it starts over.
    visual:
      widget: flip
      interactive: true
      params:
        layout: cycle
        cards:
          - icon: 🌱
            front: Grow
            back: The young cell grows and does its normal work.
          - icon: 📄
            front: Copy the DNA
            back: Every chromosome is doubled, letter by letter.
          - icon: 🔍
            front: Check
            back: Is everything intact? Only then does it go on.
          - icon: ✂️
            front: Divide
            back: In mitosis, two identical daughter cells form.

  - kind: problem
    id: hook
    widget: estimate
    prompt: One fertilised egg becomes 37 trillion cells. At least how many times must the cell number double?
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 46
      within: 25
    explanation: 2 to the 46th is about 70 trillion. Just 46 doublings are enough – doubling grows enormously.

  - kind: explain
    id: c1
    body: In **mitosis** a cell divides into two identical daughter cells. First it copies its DNA. Each daughter gets a complete set of 46 chromosomes.

  - kind: problem
    id: c2
    widget: order
    prompt: Put the phases of mitosis in order.
    params:
      items:
        - label: "Prophase: chromosomes become visible"
        - label: "Metaphase: they line up in the middle"
        - label: "Anaphase: the halves are pulled apart"
        - label: "Telophase: two new nuclei form"
    hints:
      - "Mnemonic: PMAT."
      - First line up, then separate.
    explanation: "Pro, meta, ana, telo: become visible, line up, separate, new nuclei. Then the cytoplasm divides."

  - kind: problem
    id: c3
    widget: numeric
    prompt: A skin cell with 46 chromosomes divides by mitosis. How many chromosomes does each daughter cell have?
    answer:
      value: 46
    feedback:
      - when: numval(state.input) == 23
        misconception: meiosis-confusion
        text: Half is for egg and sperm cells, not for mitosis.
      - when: numval(state.input) == 92
        misconception: doubled
        text: Just before division the chromosomes are doubled. Afterwards each daughter gets one set.
    hints:
      - The daughters should match the mother cell.
      - The DNA was doubled beforehand.
    explanation: Each daughter again gets 46 chromosomes – an exact copy.

  - kind: problem
    id: c4
    widget: choice
    prompt: Why do the cells in your body keep dividing?
    params:
      options:
        - label: For growth and to replace old or injured cells
          correct: true
        - label: So that you have more DNA
          feedback: Each cell has the same amount of DNA. It is about more cells.
        - label: Only in childhood, never later
          feedback: Adults keep renewing skin, blood and gut too.
    hints:
      - Think of a graze.
      - Red blood cells live only about 120 days.
    explanation: Division builds and repairs. The gut lining renews itself every few days.

  - kind: explain
    id: d1
    depth: 2
    body: The **cell cycle** has checkpoints. The cell checks whether its DNA is intact and whether division is needed. If these brakes fail, it divides without control. That is how cancer begins.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: A tumour starts with one cell. At about a billion cells it can be felt. About how many doublings is that? (2 to the 10th ≈ 1000)
    answer:
      value: 30
      tolerance: 1
    feedback:
      - when: numval(state.input) == 9
        misconception: base-ten
        text: Those would be powers of ten. The question asks for doublings.
    hints:
      - A billion is 1000 × 1000 × 1000.
      - Each 1000 is about 10 doublings.
    explanation: 2³⁰ ≈ 1.07 billion. So a tumour you can feel has already doubled about 30 times.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Many cancer drugs attack dividing cells. Why does hair often fall out?
    params:
      options:
        - label: Hair root cells also divide very fast.
          correct: true
        - label: The drugs dissolve hair.
          feedback: They act on dividing cells – not on the hair itself.
        - label: Hair contains cancer cells.
          feedback: Hair is not affected by cancer. Its roots just divide fast.
    hints:
      - Which healthy cells also divide often?
      - Skin, gut, blood and hair roots are fast.
    explanation: The drugs hit all fast-dividing cells. That is why the gut and blood formation suffer too.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Human connective tissue cells divide only about 50 times in a dish. How many cells could one cell produce at most? Give the power of ten (2 to the 10th ≈ 10 to the 3rd).
    answer:
      value: 15
      tolerance: 0.5
    hints:
      - 2 to the 50th = (2 to the 10th) to the 5th.
      - (10³)⁵ = 10 to the what?
    explanation: "2⁵⁰ ≈ 10¹⁵ – a quadrillion. The limit is called the Hayflick limit: with each division the telomeres at the chromosome ends get shorter."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a cell divides and why it must be controlled.
    params:
      keywords:
        - - mitose
          - mitosis
        - - chromosom
        - - kopie
          - kopier
          - gleich
          - verdoppel
          - copy
          - copies
          - identical
          - doubl
        - - krebs
          - kontroll
          - bremse
          - cancer
          - control
          - checkpoint
      sample: In mitosis the cell copies its DNA and shares the chromosomes equally between two daughter cells. Checkpoints act as brakes. If they fail, cancer can develop.
    explanation: Division is vital, but only safe with brakes.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "x1"]
