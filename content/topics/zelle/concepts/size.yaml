id: bio.cell.size
type: concept
title: "Warum Zellen klein sind"
summary: "Oberfläche, Volumen und ihr Verhältnis."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Warum gibt es keine einzelne Zelle so groß wie ein Fußball, die wie deine Zellen lebt?
    params:
      options:
        - label: Stoffe kämen nicht schnell genug durch die Oberfläche ins Innere.
          correct: true
        - label: Sie wäre zu schwer zum Bewegen.
          feedback: Auch unbewegliche Zellen bleiben klein.
        - label: Es gibt nicht genug DNA dafür.
          feedback: DNA ließe sich kopieren. Das Problem ist der Nachschub.
    hints:
      - Alles, was die Zelle braucht, muss durch ihre Hülle.
      - Vergleiche, wie schnell Hülle und Inhalt wachsen.
    explanation: Wächst eine Zelle, wächst ihr Volumen schneller als ihre Oberfläche. Der Nachschub wird zu knapp.

  - kind: explain
    id: c1
    body: "Ein Würfel mit Kante a hat die Oberfläche 6·a² und das Volumen a³. Das Verhältnis von **Oberfläche zu Volumen** ist also 6 : a. Je größer der Würfel, desto kleiner wird es."

  - kind: problem
    id: c2
    widget: chart
    prompt: Stell für Würfelzellen mit 1, 2 und 3 µm Kante das Verhältnis Oberfläche zu Volumen ein.
    params:
      title: "Oberfläche : Volumen"
      labels:
        - 1 µm
        - 2 µm
        - 3 µm
      values:
        - 1
        - 1
        - 1
      editable:
        - 0
        - 1
        - 2
      min: 0
      max: 8
      step: 1
    answer:
      values:
        - 6
        - 3
        - 2
    hints:
      - "Das Verhältnis ist 6 : a."
      - "6 : 1, 6 : 2 und 6 : 3."
    explanation: "6, 3 und 2: Doppelte Kante, halbes Verhältnis. Große Zellen haben pro Volumen wenig Hülle."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Ein Würfel hat {{a}} µm Kante. Wie groß ist das Verhältnis Oberfläche zu Volumen (in 1/µm)?
    answer:
      value: "{{6 / a}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == a / 6
        misconception: inverted-ratio
        text: "Umgedreht: Oberfläche durch Volumen, also 6 : a."
    hints:
      - Oberfläche 6 · {{a}}², Volumen {{a}}³.
      - "Kürze: 6 : {{a}}."
    explanation: "6 · {{a}}² : {{a}}³ = 6 : {{a}} ≈ {{round(600 / a) / 100}}."
    variants:
      params:
        a: choice[2,3,4,5,10]
      defaults:
        a: 4

  - kind: explain
    id: d1
    depth: 2
    body: Zellen haben Tricks gegen das Problem. Darmzellen tragen winzige Ausstülpungen, die **Mikrovilli**. Nervenzellen werden lang und dünn. Rote Blutzellen sind flache Scheiben.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Eine Zelle verdoppelt ihre Kantenlänge. Wie ändern sich Oberfläche und Volumen?
    params:
      options:
        - label: Oberfläche mal 4, Volumen mal 8
          correct: true
        - label: Beide mal 2
          feedback: Fläche hat zwei Dimensionen, Volumen drei.
        - label: Oberfläche mal 8, Volumen mal 4
          feedback: "Vertauscht: Das Volumen wächst schneller."
    hints:
      - Fläche wächst mit dem Quadrat.
      - 2² = 4 und 2³ = 8.
    explanation: Viermal mehr Hülle muss achtmal mehr Inhalt versorgen. Pro Volumen halbiert sich die Fläche.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Erhöht die Form das Verhältnis Oberfläche zu Volumen?
    params:
      buckets:
        - id: b1
          label: ja, mehr Fläche
        - id: b2
          label: nein
      items:
        - label: Flache Scheibe
          bucket: b1
        - label: Langer dünner Faden
          bucket: b1
        - label: Viele Falten
          bucket: b1
        - label: Große Kugel
          bucket: b2
        - label: Dicker Würfel
          bucket: b2
    hints:
      - Bei welcher Form ist jeder Punkt nah an der Oberfläche?
      - Die Kugel hat bei gleichem Volumen die kleinste Oberfläche.
    explanation: Flach, dünn und gefaltet bringt Fläche. Kugeln und dicke Würfel sind kompakt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Ein Straußenei ist eine einzige Zelle und viele Zentimeter groß. Warum geht das?
    params:
      options:
        - label: Der Großteil ist Dotter als Vorrat, kein aktives Zellplasma.
          correct: true
        - label: Strauße haben besonders starke Zellen.
          feedback: Stärke spielt keine Rolle. Der Inhalt ist kaum aktiv.
        - label: Eier brauchen keinen Stoffaustausch.
          feedback: Doch, Gase gehen durch die Schale. Aber der Dotter verbraucht kaum etwas.
    hints:
      - Was ist der gelbe Teil des Eis?
      - Ein Vorrat verbraucht kaum Energie.
    explanation: Die lebendige Eizelle ist nur ein kleiner Fleck auf dem Dotter. Erst nach der Befruchtung teilt sie sich in viele kleine Zellen.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: numeric
    prompt: Eine Kugelzelle wächst auf den {{k}}-fachen Durchmesser. Um welchen Faktor sinkt ihr Verhältnis Oberfläche zu Volumen?
    answer:
      value: "{{k}}"
    feedback:
      - when: numval(state.input) == k * k
        misconception: area-only
        text: "So wächst nur die Oberfläche. Das Verhältnis ist k² : k³."
      - when: numval(state.input) == k * k * k
        misconception: volume-only
        text: So wächst das Volumen. Teile noch die Fläche dadurch.
    hints:
      - Oberfläche mal {{k}}², Volumen mal {{k}}³.
      - "{{k}}² : {{k}}³ = 1 : {{k}}."
    explanation: Das Verhältnis fällt auf 1/{{k}}. Wer wächst, muss sich irgendwann teilen.
    difficulty: 3
    variants:
      params:
        k: int[2,5]
      defaults:
        k: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum Zellen klein bleiben müssen.
    params:
      keywords:
        - - oberfläche
          - oberflaeche
          - surface
        - - volumen
          - volume
        - - schneller
          - quadrat
          - hoch drei
          - faster
          - square
          - cube
        - - nachschub
          - austausch
          - versorg
          - diffus
          - supply
          - exchange
      sample: Wächst eine Zelle, wächst das Volumen mit hoch drei, die Oberfläche nur mit dem Quadrat. Dann reicht die Hülle nicht mehr für den Austausch. Darum teilen sich Zellen lieber.
    explanation: "Das Verhältnis 6 : a erklärt, warum Leben aus vielen kleinen Zellen besteht."
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
