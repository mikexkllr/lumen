id: bio.cell.organelles
type: concept
title: "Die Zelle als Stadt"
summary: "Zellkern, Mitochondrien, Ribosomen und mehr."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: match
    prompt: Stell dir die Zelle als Stadt vor. Wer hat welchen Job?
    params:
      pairs:
        - left: Zellkern
          right: Rathaus mit Bauplänen
        - left: Mitochondrium
          right: Kraftwerk
        - left: Ribosom
          right: Fabrik für Eiweiße
        - left: Zellmembran
          right: Stadtmauer mit Toren
        - left: Golgi-Apparat
          right: Post, die verpackt
    hints:
      - Wo liegen die Baupläne, also die DNA?
      - Mitochondrien liefern Energie.
    explanation: Jedes Organell hat eine Aufgabe – wie die Gebäude einer Stadt.

  - kind: explain
    id: c1
    body: Zellen enthalten kleine Räume mit eigener Aufgabe. Man nennt sie **Organellen**, also kleine Organe. Der Zellkern speichert die DNA. Mitochondrien gewinnen Energie aus Zucker.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Haben Tier- und Pflanzenzellen das beide – oder nur Pflanzen?
    params:
      buckets:
        - id: b1
          label: beide
        - id: b2
          label: nur Pflanzenzelle
      items:
        - label: Zellkern
          bucket: b1
        - label: Mitochondrien
          bucket: b1
        - label: Zellmembran
          bucket: b1
        - label: Ribosomen
          bucket: b1
        - label: Zellwand
          bucket: b2
        - label: Chloroplasten
          bucket: b2
        - label: Große Vakuole
          bucket: b2
    hints:
      - Was braucht eine Pflanze, das ein Tier nicht braucht?
      - Pflanzen machen Photosynthese und stehen ohne Skelett aufrecht.
    explanation: Pflanzen haben zusätzlich Zellwand, Chloroplasten und eine große Vakuole. Mitochondrien haben beide.

  - kind: problem
    id: c3
    widget: choice
    prompt: Eine Pflanzenzelle hat Chloroplasten. Braucht sie dann noch Mitochondrien?
    params:
      options:
        - label: Ja. Chloroplasten machen Zucker, Mitochondrien gewinnen daraus Energie.
          correct: true
        - label: Nein, Chloroplasten ersetzen sie.
          feedback: Chloroplasten bauen Zucker. Verbrannt wird er in den Mitochondrien.
        - label: Nur nachts, wenn kein Licht da ist.
          feedback: Mitochondrien arbeiten Tag und Nacht.
    hints:
      - Herstellen und Verbrauchen sind zwei Jobs.
      - Auch Pflanzen atmen.
    explanation: "Pflanzen haben beides: Chloroplasten zum Herstellen, Mitochondrien zum Verwerten."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Die DNA liegt im [[Zellkern]]. Eiweiße entstehen an den [[Ribosomen]]. Energie liefern die [[Mitochondrien]].
      distractors:
        - Zellwand
        - Vakuole
        - Membran
    explanation: Kern für Baupläne, Ribosomen für Eiweiße, Mitochondrien für Energie.

  - kind: explain
    id: d1
    depth: 2
    body: Viele Eiweiße verlassen die Zelle, zum Beispiel Verdauungsenzyme. Sie entstehen am rauen **endoplasmatischen Retikulum**, kurz ER. Das ist ein Netz aus Membranen mit Ribosomen darauf.

  - kind: problem
    id: d2
    depth: 2
    widget: order
    prompt: Ein Verdauungsenzym wird gebaut und ausgeschickt. Ordne die Stationen.
    params:
      items:
        - label: Bauplan im Zellkern
        - label: Ribosom am rauen ER
        - label: Golgi-Apparat
        - label: Bläschen
        - label: Zellmembran
    hints:
      - Zuerst braucht es die Anleitung.
      - Der Golgi-Apparat verpackt in Bläschen, die zur Membran wandern.
    explanation: "Kern, ER, Golgi, Bläschen, Membran: eine Fertigungsstraße mit Versand."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Muskelzellen haben besonders viele Mitochondrien. Warum?
    params:
      options:
        - label: Sie brauchen viel Energie für die Bewegung.
          correct: true
        - label: Sie speichern damit Fett.
          feedback: Fett liegt in Fetttröpfchen, nicht in Mitochondrien.
        - label: Mitochondrien machen Muskeln hart.
          feedback: Härte kommt von Eiweißfasern. Mitochondrien liefern Energie.
    hints:
      - Was tun Mitochondrien?
      - Wo wird viel Energie verbraucht?
    explanation: Die Zahl der Mitochondrien passt sich dem Bedarf an. Herzmuskel ist zu etwa einem Drittel Mitochondrien.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: "Mitochondrien haben eigene ringförmige DNA, eine Doppelmembran und Ribosomen wie Bakterien. Darum glaubt man: Sie waren einst freie Bakterien, die eine Zelle aufnahm. Das heißt **Endosymbiose**."

  - kind: problem
    id: x2
    depth: 3
    widget: swipe
    prompt: Spricht das für die Endosymbiose?
    params:
      cards:
        - text: Mitochondrien teilen sich selbst, wie Bakterien.
          right: true
          why: Die Zelle kann sie nicht neu bauen, nur vermehren lassen.
        - text: Ihre DNA ist ringförmig wie bei Bakterien.
          right: true
          why: Kern-DNA ist dagegen linear.
        - text: Mitochondrien sind sehr klein.
          right: false
          why: Klein sind auch andere Organellen. Größe allein beweist nichts.
        - text: Chloroplasten ähneln Cyanobakterien.
          right: true
          why: Auch sie stammen wohl von Bakterien ab.
      left: nein
      right: ja
    explanation: Eigene DNA, eigene Teilung und bakterienartige Ribosomen sind starke Hinweise.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Zelle wie eine Stadt organisiert ist.
    params:
      keywords:
        - - kern
          - nucleus
          - dna
        - - mitochond
          - energie
          - energy
        - - ribosom
          - eiweiß
          - eiweiss
          - protein
        - - membran
          - membrane
      sample: Der Zellkern ist das Rathaus mit der DNA. Mitochondrien sind Kraftwerke und liefern Energie. Ribosomen bauen Eiweiße. Die Membran ist die Mauer mit Toren.
    explanation: Arbeitsteilung in Räumen macht die Zelle effizient.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d2"]
