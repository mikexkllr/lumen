id: bio.cell.prokaryote
type: concept
title: "Mit und ohne Kern"
summary: "Prokaryoten und Eukaryoten im Vergleich."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Groß gegen winzig
    body: "Zellen gibt es in sehr verschiedenen Größen. Sortiere diese vier nach Größe, von klein nach groß – die Zahlen sind Mikrometer. Wer bleibt winzig? Ein Tipp: Es hat mit dem **Zellkern** zu tun."
    visual:
      widget: swap
      interactive: true
      params:
        values:
          - 30
          - 2
          - 100
          - 5
        labels:
          - Hautzelle
          - Bakterium
          - Eizelle
          - Hefe
        adjacent: false

  - kind: problem
    id: hook
    widget: choice
    prompt: Bakterien gibt es seit rund 3,5 Milliarden Jahren. Zellen mit Kern seit etwa 2 Milliarden. Was kam also zuerst?
    params:
      options:
        - label: Zellen ohne Kern
          correct: true
        - label: Zellen mit Kern
          feedback: Die ältesten Spuren stammen von Zellen ohne Kern.
        - label: Beide gleichzeitig
          feedback: Zwischen beiden liegen rund 1,5 Milliarden Jahre.
    hints:
      - Vergleiche die beiden Zahlen.
      - 3,5 Milliarden Jahre ist länger her als 2 Milliarden.
    explanation: Über eine Milliarde Jahre lang gab es nur Zellen ohne Kern.

  - kind: explain
    id: c1
    body: "**Prokaryoten** sind Zellen ohne Zellkern: Bakterien und Archaeen. Ihre DNA liegt frei im Zellplasma, meist als Ring. Sie sind klein, meist 1 bis 10 µm."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Wo kommt das vor?
    params:
      buckets:
        - id: b1
          label: nur Prokaryot
        - id: b2
          label: beide
        - id: b3
          label: nur Eukaryot
      items:
        - label: DNA frei im Zellplasma
          bucket: b1
        - label: Ribosomen
          bucket: b2
        - label: Zellmembran
          bucket: b2
        - label: DNA als Erbgut
          bucket: b2
        - label: Zellkern
          bucket: b3
        - label: Mitochondrien
          bucket: b3
    hints:
      - Jede Zelle braucht eine Hülle und Eiweißfabriken.
      - Organellen mit Membran gibt es nur bei Eukaryoten.
    explanation: Membran, Ribosomen und DNA hat jede Zelle. Kern und Mitochondrien nur Eukaryoten.

  - kind: problem
    id: c3
    widget: choice
    prompt: Eine Zelle misst 50 µm und hat viele Membranräume. Was ist sie vermutlich?
    params:
      options:
        - label: Ein Eukaryot
          correct: true
        - label: Ein Bakterium
          feedback: Bakterien sind meist viel kleiner und haben keine Organellen mit Membran.
        - label: Ein Virus
          feedback: Viren sind keine Zellen und viel kleiner.
    hints:
      - Wie groß sind Prokaryoten meist?
      - Membranräume sind Organellen.
    explanation: Eukaryoten sind meist 10 bis 100 µm groß und voller Organellen.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Ein Bakterium misst 2 µm, eine Körperzelle {{d}} µm. Wievielmal größer ist der Durchmesser der Körperzelle?
    answer:
      value: "{{d / 2}}"
    hints:
      - Teile die beiden Durchmesser.
      - "{{d}} : 2"
    explanation: "{{d}} µm : 2 µm = {{d / 2}}. Beim Volumen ist der Unterschied noch viel größer: {{(d / 2) ** 3}}-mal."
    variants:
      params:
        d: choice[10,20,30,40]
      defaults:
        d: 20

  - kind: explain
    id: d1
    depth: 2
    body: Viele Bakterien tragen kleine DNA-Ringe zusätzlich zum Hauptring. Diese **Plasmide** können sie untereinander tauschen. So verbreiten sich Gene, etwa für Resistenz gegen Antibiotika.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Ein Antibiotikum greift die Zellwand von Bakterien an. Warum schadet es deinen Zellen nicht?
    params:
      options:
        - label: Menschliche Zellen haben keine solche Zellwand.
          correct: true
        - label: Es ist zu schwach für große Zellen.
          feedback: Es geht um das Ziel, nicht um die Größe.
        - label: Unser Immunsystem hält es fern.
          feedback: Das Antibiotikum ist überall im Blut. Es findet bei uns nur kein Ziel.
    hints:
      - Haben Tierzellen eine Zellwand?
      - Ein gutes Medikament trifft etwas, das nur der Erreger hat.
    explanation: Penicillin stört den Bau der bakteriellen Zellwand. Tierzellen haben keine – das macht es so verträglich.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Prokaryot oder Eukaryot?
    params:
      cards:
        - text: Cyanobakterien, die Photosynthese machen
          right: false
          why: "Photosynthese ohne Chloroplasten: Sie sind selbst Bakterien."
        - text: Hefezelle
          right: true
          why: Hefe ist ein Pilz mit Zellkern.
        - text: Archaeen aus heißen Quellen
          right: false
          why: Archaeen haben keinen Zellkern.
        - text: Pantoffeltierchen
          right: true
          why: Ein Einzeller mit Kern – sogar mit zwei.
      left: Prokaryot
      right: Eukaryot
    explanation: Einzeller sind nicht automatisch Prokaryoten. Es zählt der Zellkern.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eukaryoten sind wohl aus einer Archaee entstanden, die ein Bakterium aufnahm. Welcher Befund passt dazu?
    params:
      options:
        - label: Viele unserer Gene für das Ablesen der DNA ähneln denen von Archaeen.
          correct: true
        - label: Menschen haben keine Bakteriengene.
          feedback: Doch – die Mitochondrien stammen ja von Bakterien ab.
        - label: Archaeen haben Mitochondrien.
          feedback: Archaeen haben keine Mitochondrien. Die kamen erst später dazu.
    hints:
      - Zwei Partner, zwei Spuren im Erbgut.
      - Das Ablesen der DNA ist uralt und verrät die Herkunft.
    explanation: Unser Kern zeigt Archaeen-Spuren, unsere Mitochondrien Bakterien-Spuren. Eukaryoten sind eine Fusion.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wie unterscheiden sich Zellen mit und ohne Kern?"
    params:
      keywords:
        - - kern
          - nucleus
        - - bakter
          - archae
        - - organell
          - mitochond
        - - klein
          - groß
          - gross
          - groesser
          - small
          - larg
          - size
      sample: Prokaryoten wie Bakterien und Archaeen haben keinen Zellkern und keine Organellen mit Membran. Eukaryoten haben einen Kern und Mitochondrien und sind meist viel größer.
    explanation: Der Kern ist das entscheidende Merkmal, dazu Organellen und Größe.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
