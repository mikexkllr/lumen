id: bio.cell.osmosis
type: concept
title: "Osmose"
summary: "Wasser folgt dem Salz."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Du legst Salatblätter in Salzwasser. Nach einer Stunde sind sie schlapp. Warum?
    params:
      options:
        - label: Wasser strömt aus den Zellen ins salzige Wasser.
          correct: true
        - label: Das Salz frisst die Blätter auf.
          feedback: Salz zersetzt keine Blätter. Es zieht Wasser an.
        - label: Die Blätter saugen zu viel Salz auf.
          feedback: Das Problem ist Wasser, das hinausgeht.
    hints:
      - "Wo ist mehr Salz gelöst: in der Zelle oder im Wasser?"
      - Wasser wandert dorthin, wo mehr gelöst ist.
    explanation: Wasser wandert durch die Membran zur salzigeren Seite. Die Zellen verlieren Wasser und Druck.

  - kind: explain
    id: c1
    body: Eine Membran lässt Wasser durch, aber viele gelöste Stoffe nicht. Dann wandert Wasser zur Seite mit mehr gelöstem Stoff. Das ist **Osmose**. Das Wasser verdünnt dort, bis beide Seiten gleich sind.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Was passiert mit einer roten Blutzelle?
    params:
      buckets:
        - id: b1
          label: schwillt an
        - id: b2
          label: bleibt gleich
        - id: b3
          label: schrumpft
      items:
        - label: In reinem Wasser
          bucket: b1
        - label: In Regenwasser
          bucket: b1
        - label: In 0,9-prozentiger Salzlösung
          bucket: b2
        - label: In Meerwasser
          bucket: b3
        - label: In starker Zuckerlösung
          bucket: b3
    hints:
      - Die Zelle enthält etwa so viel Gelöstes wie 0,9 % Salz.
      - Wasser strömt zur Seite mit mehr gelöstem Stoff.
    explanation: In reinem Wasser strömt Wasser hinein, bis die Zelle platzt. In Meerwasser verliert sie Wasser und schrumpelt.

  - kind: problem
    id: c3
    widget: numeric
    prompt: Eine Infusion ist 0,9-prozentige Kochsalzlösung. Wie viel Gramm Salz sind in {{v}} ml?
    params:
      unit: g
    answer:
      value: "{{0.009 * v}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 0.09 * v
        misconception: percent-shift
        text: "Zehnmal zu viel: 0,9 % ist 0,009 als Anteil."
    hints:
      - 1 ml Wasser wiegt etwa 1 g.
      - 0,9 % von {{v}} g.
    explanation: 0,9 % von {{v}} g sind {{0.009 * v}} g. Diese Lösung ist so salzig wie das Blut – die Zellen bleiben heil.
    variants:
      params:
        v: choice[250,500,1000]
      defaults:
        v: 500

  - kind: explain
    id: d1
    depth: 2
    body: Pflanzenzellen platzen in Wasser nicht. Ihre feste Zellwand hält dagegen. Das Wasser drückt von innen gegen die Wand. Dieser **Turgor** lässt Blätter und Stängel stehen.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Eine Topfpflanze welkt, wenn du sie vergisst zu gießen. Was ist in den Zellen passiert?
    params:
      options:
        - label: "Der Turgor ist gesunken: Die Vakuolen haben Wasser verloren."
          correct: true
        - label: Die Zellwände sind geschmolzen.
          feedback: Die Wände bleiben. Es fehlt der Druck von innen.
        - label: Die Zellen haben sich geteilt.
          feedback: Teilung macht eine Pflanze nicht schlapp.
    hints:
      - Was hält Pflanzen aufrecht?
      - Wie ein Luftballon ohne Luft.
    explanation: Ohne Wasser sinkt der Innendruck. Gießt du rechtzeitig, richtet sich die Pflanze wieder auf.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Osmose im Alltag – stimmt das?
    params:
      cards:
        - text: Salz auf Schnecken ist grausam, weil es ihnen Wasser entzieht.
          right: true
          why: Osmose entzieht der Haut Wasser.
        - text: Gesalzener Fisch verdirbt langsamer.
          right: true
          why: Bakterien verlieren im Salz Wasser und wachsen kaum.
        - text: Meerwasser trinken löscht den Durst.
          right: false
          why: Es ist salziger als dein Blut. Die Nieren brauchen mehr Wasser, um das Salz loszuwerden.
        - text: Kirschen platzen nach langem Regen.
          right: true
          why: Wasser dringt ein, weil der Saft viel Zucker enthält.
    explanation: Wasser folgt immer dem gelösten Stoff – im Salzfass, im Meer und in der Kirsche.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Kochsalz NaCl zerfällt in Wasser in Na⁺ und Cl⁻. Wie viele Mol gelöste Teilchen ergibt eine Lösung mit {{c}} mol/L NaCl?
    params:
      unit: mol/L
    answer:
      value: "{{2 * c}}"
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == c
        misconception: no-dissociation
        text: Für die Osmose zählen alle Teilchen. NaCl zerfällt in zwei.
    hints:
      - Osmose zählt Teilchen, nicht Formeln.
      - Jedes NaCl gibt zwei Ionen.
    explanation: "{{c}} mol/L NaCl ergeben {{2 * c}} mol/L Teilchen. Bei 0,15 mol/L sind das rund 0,3 – fast genau der Wert im Blut."
    difficulty: 3
    variants:
      params:
        c: choice[0.15,0.2,0.5,1]
      defaults:
        c: 0.15

  - kind: problem
    id: x2
    depth: 3
    widget: estimate
    prompt: Blut enthält etwa 0,3 mol gelöste Teilchen pro Liter. Wie groß wäre der osmotische Druck gegen reines Wasser? Schätz mal in bar.
    params:
      min: 0.1
      max: 100
      scale: log
      unit: bar
    answer:
      value: 7.5
      within: 30
    explanation: "Nach van ’t Hoff: π = c · R · T ≈ 0,3 · 0,083 · 310 ≈ 7,5 bar. Das ist dreimal so viel wie in einem Autoreifen!"
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, was Osmose ist und warum Blutzellen in reinem Wasser platzen.
    params:
      keywords:
        - - wasser
          - water
        - - membran
          - membrane
        - - salz
          - gelöst
          - geloest
          - konzentration
          - salt
          - solute
          - dissolved
          - concentrat
        - - platz
          - schwill
          - burst
          - swell
      sample: Bei Osmose wandert Wasser durch eine Membran zur Seite mit mehr gelöstem Stoff. In der Blutzelle ist mehr gelöst als in reinem Wasser. Darum strömt Wasser hinein, bis die Zelle platzt.
    explanation: Wasser gleicht Konzentrationen aus, und eine Zelle ohne Wand hat dem nichts entgegenzusetzen.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
