id: bio.cell.division
type: concept
title: "Zellteilung"
summary: "Mitose: aus einer Zelle werden zwei gleiche."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: Aus einer befruchteten Eizelle werden 37 Billionen Zellen. Wie oft muss sich die Zellzahl dafür mindestens verdoppeln?
    params:
      min: 1
      max: 1000
      scale: log
    answer:
      value: 46
      within: 25
    explanation: 2 hoch 46 sind rund 70 Billionen. Schon 46 Verdopplungen reichen – Verdoppeln wächst gewaltig.

  - kind: explain
    id: c1
    body: Bei der **Mitose** teilt sich eine Zelle in zwei gleiche Tochterzellen. Vorher kopiert sie ihre DNA. Jede Tochter bekommt einen vollständigen Satz von 46 Chromosomen.

  - kind: problem
    id: c2
    widget: order
    prompt: Ordne die Phasen der Mitose.
    params:
      items:
        - label: "Prophase: Chromosomen werden sichtbar"
        - label: "Metaphase: Sie reihen sich in der Mitte auf"
        - label: "Anaphase: Die Hälften werden auseinandergezogen"
        - label: "Telophase: Zwei neue Kerne bilden sich"
    hints:
      - "Merkwort: PMAT."
      - Erst aufreihen, dann trennen.
    explanation: "Pro, Meta, Ana, Telo: sichtbar werden, aufreihen, trennen, neue Kerne. Danach teilt sich das Zellplasma."

  - kind: problem
    id: c3
    widget: numeric
    prompt: Eine Hautzelle mit 46 Chromosomen teilt sich durch Mitose. Wie viele Chromosomen hat jede Tochterzelle?
    answer:
      value: 46
    feedback:
      - when: numval(state.input) == 23
        misconception: meiosis-confusion
        text: Die Hälfte gibt es bei Ei- und Samenzellen, nicht bei der Mitose.
      - when: numval(state.input) == 92
        misconception: doubled
        text: Kurz vor der Teilung sind die Chromosomen doppelt. Danach bekommt jede Tochter einen Satz.
    hints:
      - Die Töchter sollen gleich sein wie die Mutterzelle.
      - Die DNA wurde vorher verdoppelt.
    explanation: Jede Tochter bekommt wieder 46 Chromosomen – eine genaue Kopie.

  - kind: problem
    id: c4
    widget: choice
    prompt: Wozu teilen sich Zellen in deinem Körper ständig?
    params:
      options:
        - label: Für Wachstum und um alte oder verletzte Zellen zu ersetzen
          correct: true
        - label: Damit du mehr DNA hast
          feedback: Jede Zelle hat dieselbe DNA-Menge. Es geht um mehr Zellen.
        - label: Nur in der Kindheit, später nie
          feedback: Auch Erwachsene erneuern Haut, Blut und Darm ständig.
    hints:
      - Denk an eine Schürfwunde.
      - Rote Blutzellen leben nur etwa 120 Tage.
    explanation: Teilung baut auf und repariert. Die Darmschleimhaut erneuert sich etwa alle paar Tage.

  - kind: explain
    id: d1
    depth: 2
    body: Der **Zellzyklus** hat Kontrollpunkte. Die Zelle prüft, ob ihre DNA heil ist und ob Teilung nötig ist. Fallen diese Bremsen aus, teilt sie sich ungebremst. So entsteht Krebs.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Ein Tumor beginnt mit einer Zelle. Ab etwa einer Milliarde Zellen ertastet man ihn. Wie viele Verdopplungen sind das ungefähr? (2 hoch 10 ≈ 1000)
    answer:
      value: 30
      tolerance: 1
    feedback:
      - when: numval(state.input) == 9
        misconception: base-ten
        text: Das wären Zehnerpotenzen. Gefragt sind Verdopplungen.
    hints:
      - Eine Milliarde ist 1000 · 1000 · 1000.
      - Jedes 1000 sind etwa 10 Verdopplungen.
    explanation: 2³⁰ ≈ 1,07 Milliarden. Ein tastbarer Tumor hat also schon rund 30 Verdopplungen hinter sich.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Viele Krebsmedikamente greifen Zellen an, die sich teilen. Warum fallen dabei oft die Haare aus?
    params:
      options:
        - label: Haarwurzelzellen teilen sich ebenfalls sehr schnell.
          correct: true
        - label: Die Medikamente lösen Haare auf.
          feedback: Sie wirken auf Zellen, die sich teilen – nicht auf das Haar selbst.
        - label: Haare enthalten Krebszellen.
          feedback: Haare sind nicht befallen. Ihre Wurzeln teilen sich nur schnell.
    hints:
      - Welche gesunden Zellen teilen sich auch oft?
      - Haut, Darm, Blut und Haarwurzeln sind schnell.
    explanation: Die Mittel treffen alle schnell teilenden Zellen. Darum leiden auch Darm und Blutbildung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Menschliche Bindegewebszellen teilen sich in der Kulturschale nur etwa 50-mal. Wie viele Zellen könnten aus einer einzigen höchstens entstehen? Gib die Zehnerpotenz an (2 hoch 10 ≈ 10 hoch 3).
    answer:
      value: 15
      tolerance: 0.5
    hints:
      - 2 hoch 50 = (2 hoch 10) hoch 5.
      - (10³)⁵ = 10 hoch wie viel?
    explanation: "2⁵⁰ ≈ 10¹⁵ – eine Billiarde. Die Grenze heißt Hayflick-Limit: Bei jeder Teilung werden die Telomere an den Chromosomenenden kürzer."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie eine Zelle sich teilt und warum das kontrolliert sein muss.
    params:
      keywords:
        - - mitose
          - mitosis
        - - chromosom
        - - kopie
          - kopier
          - gleich
          - verdoppel
          - copy
          - copies
          - identical
          - doubl
        - - krebs
          - kontroll
          - bremse
          - cancer
          - control
          - checkpoint
      sample: Bei der Mitose kopiert die Zelle ihre DNA und verteilt die Chromosomen gleich auf zwei Tochterzellen. Kontrollpunkte bremsen die Teilung. Fallen sie aus, kann Krebs entstehen.
    explanation: Teilung ist lebenswichtig, aber nur mit Bremsen sicher.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "x1"]
