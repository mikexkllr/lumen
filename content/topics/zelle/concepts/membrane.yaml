id: bio.cell.membrane
type: concept
title: "Membran und Diffusion"
summary: "Wie Stoffe in die Zelle gelangen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Nichts steht still
    body: "Auch wenn alles ruhig aussieht: Die Teilchen in deinen Zellen zittern und flitzen ständig. Dreh die Temperatur hoch und sieh, wie sie rasen. Was diese **Wärmebewegung** bewirkt, erfährst du gleich."
    visual:
      widget: sim
      interactive: true
      params:
        scene: gas
        controls:
          volume:
            fixed: true

  - kind: problem
    id: hook
    widget: choice
    prompt: Du gibst einen Tropfen Tinte in ein Glas Wasser und rührst nicht. Was passiert?
    params:
      options:
        - label: Die Tinte verteilt sich langsam von selbst im ganzen Glas.
          correct: true
        - label: Sie bleibt für immer ein Tropfen.
          feedback: Teilchen zittern ständig und mischen sich.
        - label: Sie sinkt nur nach unten.
          feedback: Ein wenig vielleicht – aber dann verteilt sie sich überall.
    hints:
      - Teilchen sind nie ganz still.
      - Wo viel Tinte ist, wandert sie dahin, wo wenig ist.
    explanation: "Das ist Diffusion: Zufällige Bewegung verteilt Teilchen, bis sie überall gleich dicht sind."

  - kind: explain
    id: c1
    body: Bei der **Diffusion** wandern Teilchen von selbst vom Ort hoher zum Ort niedriger Konzentration. Antrieb ist ihre zufällige Wärmebewegung. Dafür braucht es keine Energie.

  - kind: problem
    id: c2
    widget: choice
    prompt: In der Lunge ist viel Sauerstoff, im Blut wenig. Wohin diffundiert er?
    params:
      options:
        - label: Von der Lunge ins Blut
          correct: true
        - label: Vom Blut in die Lunge
          feedback: Diffusion geht von viel nach wenig.
        - label: Gar nicht – dafür braucht es eine Pumpe.
          feedback: Für Sauerstoff reicht Diffusion.
    hints:
      - Wo ist die Konzentration höher?
      - Diffusion gleicht Unterschiede aus.
    explanation: Sauerstoff diffundiert ins Blut, Kohlendioxid in die Lunge – jeweils von viel nach wenig.

  - kind: explain
    id: c3
    body: Die **Zellmembran** ist eine Doppelschicht aus Fettmolekülen. Ihre Köpfe mögen Wasser, ihre Schwänze nicht. Kleine Gase schlüpfen durch. Für Zucker und Ionen gibt es eigene Kanäle.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Kommt der Stoff einfach durch die Membran – oder braucht er einen Kanal?
    params:
      buckets:
        - id: b1
          label: geht direkt durch
        - id: b2
          label: braucht Kanal oder Träger
      items:
        - label: Sauerstoff O₂
          bucket: b1
        - label: Kohlendioxid CO₂
          bucket: b1
        - label: Traubenzucker
          bucket: b2
        - label: Natrium-Ionen Na⁺
          bucket: b2
        - label: Kalium-Ionen K⁺
          bucket: b2
    hints:
      - Das Innere der Membran ist fettig.
      - Geladene oder große Teilchen kommen schlecht durch Fett.
    explanation: Kleine ungeladene Gase lösen sich im Fett der Membran. Ionen und Zucker brauchen Eiweiß-Tore.

  - kind: explain
    id: d1
    depth: 2
    body: Manchmal muss eine Zelle Stoffe gegen das Gefälle pumpen. Das heißt **aktiver Transport** und kostet Energie in Form von ATP. Die Natrium-Kalium-Pumpe schafft pro ATP 3 Na⁺ hinaus und 2 K⁺ hinein.

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Eine Pumpe verbraucht {{n}} ATP. Wie viele Na⁺-Ionen hat sie hinausgeschafft?
    answer:
      value: "{{3 * n}}"
    feedback:
      - when: numval(state.input) == 2 * n
        misconception: k-na
        text: Das sind die K⁺-Ionen, die hineinkommen.
    hints:
      - Wie viele Na⁺ pro ATP?
      - 3 · {{n}}
    explanation: "3 Na⁺ pro ATP: {{3 * n}} Natrium-Ionen hinaus, {{2 * n}} Kalium-Ionen hinein."
    difficulty: 2
    variants:
      params:
        n: int[2,20]
      defaults:
        n: 10

  - kind: problem
    id: d3
    depth: 2
    widget: buckets
    prompt: Passiv oder aktiv?
    params:
      buckets:
        - id: b1
          label: passiv, ohne Energie
        - id: b2
          label: aktiv, mit ATP
      items:
        - label: O₂ geht ins Blut
          bucket: b1
        - label: Wasser fließt durch Kanäle
          bucket: b1
        - label: Na⁺-K⁺-Pumpe arbeitet
          bucket: b2
        - label: Darm holt den letzten Zucker
          bucket: b2
    hints:
      - Geht es mit oder gegen das Gefälle?
      - Gegen das Gefälle braucht es Energie.
    explanation: Mit dem Gefälle geht es von selbst. Gegen das Gefälle braucht es eine Pumpe mit ATP.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Ein kleines Molekül braucht 0,1 s, um 10 µm weit zu diffundieren. Die Zeit wächst mit dem Quadrat des Weges. Wie viele Sekunden braucht es für 1 mm?
    params:
      unit: s
    answer:
      value: 1000
    feedback:
      - when: numval(state.input) == 10
        misconception: linear-diffusion
        text: Das wäre linear. Der Weg ist 100-mal so lang, die Zeit also 100²-mal.
    hints:
      - Wievielmal so lang ist 1 mm wie 10 µm?
      - 100-mal so weit heißt 10 000-mal so lange.
    explanation: 0,1 s · 100² = 1000 s, also eine gute Viertelstunde. Für Zellen ist Diffusion schnell, für große Körper viel zu langsam – darum gibt es Kreisläufe.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie Stoffe in eine Zelle hinein- und hinauskommen.
    params:
      keywords:
        - - diffus
        - - konzentration
          - viel
          - wenig
          - concentrat
          - high
          - low
        - - membran
          - membrane
        - - kanal
          - pumpe
          - träger
          - traeger
          - channel
          - pump
          - carrier
        - - energie
          - atp
          - energy
      sample: Durch Diffusion wandern Stoffe von hoher zu niedriger Konzentration durch die Membran. Ionen und Zucker brauchen Kanäle. Gegen das Gefälle arbeiten Pumpen mit Energie aus ATP.
    explanation: Passiv mit dem Gefälle, aktiv dagegen – und die Membran entscheidet, wer durchdarf.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "x1"]
