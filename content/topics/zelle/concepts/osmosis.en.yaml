id: bio.cell.osmosis
type: concept
title: "Osmosis"
summary: "Water follows salt."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Water on the move
    body: Why do raisins plump up again in water? And why do some fish never drink? Behind both is the same trick of water. Uncover the cards – its name is **osmosis**.
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍇
            front: Raisins in water
            back: Overnight the wrinkly berries become plump and round again.
          - icon: 🐟
            front: Fish that never drink
            back: Water flows into freshwater fish by itself. They constantly have to get rid of it.
          - icon: 🌱
            front: Roots without a pump
            back: Water flows into the root without the plant pumping it.

  - kind: problem
    id: hook
    widget: choice
    prompt: You put lettuce leaves into salty water. After an hour they are limp. Why?
    params:
      options:
        - label: Water flows out of the cells into the salty water.
          correct: true
        - label: The salt eats the leaves.
          feedback: Salt does not break down leaves. It draws water.
        - label: The leaves soak up too much salt.
          feedback: The problem is water going out.
    hints:
      - "Where is more salt dissolved: in the cell or in the water?"
      - Water moves to where more is dissolved.
    explanation: Water moves through the membrane to the saltier side. The cells lose water and pressure.

  - kind: explain
    id: c1
    body: A membrane lets water through but not many dissolved substances. Then water moves to the side with more solute. This is **osmosis**. The water dilutes that side until both sides match.

  - kind: problem
    id: c2
    widget: buckets
    prompt: What happens to a red blood cell?
    params:
      buckets:
        - id: b1
          label: swells
        - id: b2
          label: stays the same
        - id: b3
          label: shrinks
      items:
        - label: In pure water
          bucket: b1
        - label: In rainwater
          bucket: b1
        - label: In 0.9 % salt solution
          bucket: b2
        - label: In seawater
          bucket: b3
        - label: In strong sugar solution
          bucket: b3
    hints:
      - The cell contains about as much solute as 0.9 % salt.
      - Water flows to the side with more solute.
    explanation: In pure water, water flows in until the cell bursts. In seawater it loses water and shrivels.

  - kind: problem
    id: c3
    widget: numeric
    prompt: An IV drip is 0.9 % saline. How many grams of salt are in {{v}} ml?
    params:
      unit: g
    answer:
      value: "{{0.009 * v}}"
      tolerance: 0.01
    feedback:
      - when: numval(state.input) == 0.09 * v
        misconception: percent-shift
        text: "Ten times too much: 0.9 % is 0.009 as a fraction."
    hints:
      - 1 ml of water weighs about 1 g.
      - 0.9 % of {{v}} g.
    explanation: 0.9 % of {{v}} g is {{0.009 * v}} g. This solution is as salty as blood – cells stay intact.
    variants:
      params:
        v: choice[250,500,1000]
      defaults:
        v: 500

  - kind: explain
    id: d1
    depth: 2
    body: Plant cells do not burst in water. Their firm cell wall pushes back. The water presses against the wall from inside. This **turgor** keeps leaves and stems upright.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: A potted plant wilts when you forget to water it. What has happened in its cells?
    params:
      options:
        - label: "Turgor has dropped: the vacuoles have lost water."
          correct: true
        - label: The cell walls have melted.
          feedback: The walls remain. The pressure from inside is missing.
        - label: The cells have divided.
          feedback: Division does not make a plant limp.
    hints:
      - What keeps plants upright?
      - Like a balloon without air.
    explanation: Without water the internal pressure drops. Water it in time and the plant stands up again.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: swipe
    prompt: Osmosis in everyday life – true or false?
    params:
      cards:
        - text: Salt on slugs is cruel because it draws water out of them.
          right: true
          why: Osmosis draws water from the skin.
        - text: Salted fish spoils more slowly.
          right: true
          why: Bacteria lose water in salt and barely grow.
        - text: Drinking seawater quenches thirst.
          right: false
          why: It is saltier than your blood. The kidneys need more water to get rid of the salt.
        - text: Cherries split after long rain.
          right: true
          why: Water gets in because the juice is full of sugar.
    explanation: Water always follows the solute – in the salt jar, the sea and the cherry.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: Table salt NaCl splits in water into Na⁺ and Cl⁻. How many moles of dissolved particles does a {{c}} mol/L NaCl solution give?
    params:
      unit: mol/L
    answer:
      value: "{{2 * c}}"
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == c
        misconception: no-dissociation
        text: For osmosis every particle counts. NaCl splits into two.
    hints:
      - Osmosis counts particles, not formulas.
      - Each NaCl gives two ions.
    explanation: "{{c}} mol/L NaCl gives {{2 * c}} mol/L particles. At 0.15 mol/L that is about 0.3 – almost exactly the value in blood."
    difficulty: 3
    variants:
      params:
        c: choice[0.15,0.2,0.5,1]
      defaults:
        c: 0.15

  - kind: problem
    id: x2
    depth: 3
    widget: estimate
    prompt: Blood contains about 0.3 mol of dissolved particles per litre. How large would its osmotic pressure against pure water be? Guess in bar.
    params:
      min: 0.1
      max: 100
      scale: log
      unit: bar
    answer:
      value: 7.5
      within: 30
    explanation: "By van ’t Hoff: π = c · R · T ≈ 0.3 × 0.083 × 310 ≈ 7.5 bar. That is three times the pressure in a car tyre!"
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux what osmosis is and why blood cells burst in pure water.
    params:
      keywords:
        - - wasser
          - water
        - - membran
          - membrane
        - - salz
          - gelöst
          - geloest
          - konzentration
          - salt
          - solute
          - dissolved
          - concentrat
        - - platz
          - schwill
          - burst
          - swell
      sample: In osmosis water moves through a membrane to the side with more solute. A blood cell holds more solute than pure water. So water flows in until the cell bursts.
    explanation: Water evens out concentrations, and a cell without a wall cannot resist it.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
