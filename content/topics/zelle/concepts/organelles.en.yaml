id: bio.cell.organelles
type: concept
title: "The cell as a city"
summary: "Nucleus, mitochondria, ribosomes and more."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: problem
    id: hook
    widget: match
    prompt: Imagine the cell as a city. Who has which job?
    params:
      pairs:
        - left: Nucleus
          right: Town hall with blueprints
        - left: Mitochondrion
          right: Power plant
        - left: Ribosome
          right: Protein factory
        - left: Cell membrane
          right: City wall with gates
        - left: Golgi apparatus
          right: Post office that packs
    hints:
      - Where are the blueprints, the DNA, kept?
      - Mitochondria supply energy.
    explanation: Each organelle has a job – like the buildings of a city.

  - kind: explain
    id: c1
    body: Cells contain small compartments with their own jobs. They are called **organelles**, little organs. The nucleus stores the DNA. Mitochondria get energy from sugar.

  - kind: problem
    id: c2
    widget: buckets
    prompt: Do animal and plant cells both have this – or only plants?
    params:
      buckets:
        - id: b1
          label: both
        - id: b2
          label: plant cell only
      items:
        - label: Nucleus
          bucket: b1
        - label: Mitochondria
          bucket: b1
        - label: Cell membrane
          bucket: b1
        - label: Ribosomes
          bucket: b1
        - label: Cell wall
          bucket: b2
        - label: Chloroplasts
          bucket: b2
        - label: Large vacuole
          bucket: b2
    hints:
      - What does a plant need that an animal does not?
      - Plants photosynthesise and stand upright without a skeleton.
    explanation: Plants also have a cell wall, chloroplasts and a large vacuole. Both have mitochondria.

  - kind: problem
    id: c3
    widget: choice
    prompt: A plant cell has chloroplasts. Does it still need mitochondria?
    params:
      options:
        - label: Yes. Chloroplasts make sugar, mitochondria get energy from it.
          correct: true
        - label: No, chloroplasts replace them.
          feedback: Chloroplasts build sugar. It is burned in the mitochondria.
        - label: Only at night, when there is no light.
          feedback: Mitochondria work day and night.
    hints:
      - Making and using are two jobs.
      - Plants breathe too.
    explanation: "Plants have both: chloroplasts for making, mitochondria for using."

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: DNA lies in the [[nucleus]]. Proteins are made at the [[ribosomes]]. Energy comes from the [[mitochondria]].
      distractors:
        - cell wall
        - vacuole
        - membrane
    explanation: Nucleus for blueprints, ribosomes for proteins, mitochondria for energy.

  - kind: explain
    id: d1
    depth: 2
    body: Many proteins leave the cell, digestive enzymes for example. They are made at the rough **endoplasmic reticulum**, ER for short. It is a network of membranes studded with ribosomes.

  - kind: problem
    id: d2
    depth: 2
    widget: order
    prompt: A digestive enzyme is built and shipped out. Order the stops.
    params:
      items:
        - label: Blueprint in the nucleus
        - label: Ribosome on the rough ER
        - label: Golgi apparatus
        - label: Vesicle
        - label: Cell membrane
    hints:
      - First it needs the instructions.
      - The Golgi packs it into vesicles that travel to the membrane.
    explanation: "Nucleus, ER, Golgi, vesicle, membrane: a production line with shipping."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Muscle cells have especially many mitochondria. Why?
    params:
      options:
        - label: They need a lot of energy for movement.
          correct: true
        - label: They use them to store fat.
          feedback: Fat sits in droplets, not in mitochondria.
        - label: Mitochondria make muscles hard.
          feedback: Hardness comes from protein fibres. Mitochondria supply energy.
    hints:
      - What do mitochondria do?
      - Where is a lot of energy used?
    explanation: The number of mitochondria matches demand. Heart muscle is about one third mitochondria.
    difficulty: 2

  - kind: explain
    id: x1
    depth: 3
    body: Mitochondria have their own ring-shaped DNA, a double membrane and bacteria-like ribosomes. So scientists think they were once free bacteria taken up by a cell. This is called **endosymbiosis**.

  - kind: problem
    id: x2
    depth: 3
    widget: swipe
    prompt: Does this support endosymbiosis?
    params:
      cards:
        - text: Mitochondria divide by themselves, like bacteria.
          right: true
          why: The cell cannot build them anew, only let them multiply.
        - text: Their DNA is ring-shaped like in bacteria.
          right: true
          why: Nuclear DNA, in contrast, is linear.
        - text: Mitochondria are very small.
          right: false
          why: Other organelles are small too. Size alone proves nothing.
        - text: Chloroplasts resemble cyanobacteria.
          right: true
          why: They too probably descend from bacteria.
      left: no
      right: yes
    explanation: Own DNA, own division and bacteria-like ribosomes are strong clues.
    difficulty: 3

  - kind: problem
    id: x3
    depth: 3
    widget: teach
    prompt: Explain to Lux how a cell is organised like a city.
    params:
      keywords:
        - - kern
          - nucleus
          - dna
        - - mitochond
          - energie
          - energy
        - - ribosom
          - eiweiß
          - eiweiss
          - protein
        - - membran
          - membrane
      sample: The nucleus is the town hall with the DNA. Mitochondria are power plants that supply energy. Ribosomes build proteins. The membrane is the wall with gates.
    explanation: Dividing work into compartments makes the cell efficient.
    difficulty: 3

srs:
  cards_from: ["hook", "c2", "d2"]
