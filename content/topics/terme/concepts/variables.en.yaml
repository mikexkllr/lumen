id: alg.terms.variables
type: concept
title: Variables
summary: A letter as a placeholder for any possible number.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.variables]
estimated_minutes: 13
steps:
  - kind: problem
    id: kino
    widget: numeric
    body: A movie ticket costs x €. Popcorn costs 4 €.
    prompt: What do ticket and popcorn cost together if x = 9?
    params: { unit: "€" }
    answer: { value: 13 }
    hints:
      - Put 9 in for x.
    explanation: x + 4 = 9 + 4 = 13.

  - kind: explain
    id: s2
    body: |
      A **variable** is a placeholder for a number.
      The expression $x + 4$ describes the price for **any** ticket price x.

  - kind: problem
    id: drei-tickets
    widget: expression
    prompt: Write it as an expression – three tickets and one popcorn.
    answer: { equivalentTo: "3x + 4" }
    hints:
      - Three tickets cost 3 · x, or 3x for short.
    explanation: 3x + 4

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: 'Calculate $2x + {{b}}$ for $x = {{a}}$.'
    answer: { value: "{{2 * a + b}}" }
    feedback:
      - when: "numval(state.input) == 20 + a + b"
        misconception: juxtaposition
        text: 2x means 2 · x – not “2 and then x”.
    hints:
      - "2x means 2 · {{a}}."
    explanation: "2 · {{a}} + {{b}} = {{2 * a + b}}."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]" }
      defaults: { a: 5, b: 3 }

  - kind: problem
    id: uebersetzen
    widget: choice
    prompt: Which expression means “double a number, plus 5”?
    params:
      options:
        - { label: "$2x + 5$", correct: true }
        - { label: "$2(x + 5)$", feedback: "That would be double x + 5." }
        - { label: "$x^2 + 5$", feedback: "x² is x · x, not 2 · x." }
        - { label: "$5x + 2$", feedback: "Here the number was multiplied by five." }
    hints:
      - Double x is 2x.
    explanation: First double (2x), then add 5.

  - kind: problem
    id: c1
    widget: match
    prompt: Which expression matches the text?
    params:
      pairs:
        - left: twice x
          right: $2x$
        - left: x decreased by 2
          right: $x - 2$
        - left: half of x
          right: $\frac{x}{2}$
        - left: x times itself
          right: $x^2$
        - left: 2 decreased by x
          right: $2 - x$
    hints:
      - Put 6 in for x and check.
    explanation: Expressions translate language into calculations. The order matters.

  - kind: problem
    id: ma-c1
    widget: tiles
    prompt: "Build a term for: three times a number x, plus 2."
    params:
      tiles:
        - 3x
        - +
        - "2"
        - 2x
        - −
        - "3"
      slots: 3
    answer:
      equivalentTo: 3x + 2
    hints:
      - Three times x is written 3x.
      - Then add plus 2.
    explanation: 3x + 2. 2 + 3x is right too – the order of addition does not matter.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Evaluate $x^2 - 3x + 2$ for $x = -2$.
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 4 || numval(state.input) == -8 || numval(state.input) == 0
        misconception: sign-error
        text: "Watch the signs: (−2)² = +4 and −3 · (−2) = +6."
    hints:
      - "Put −2 in with brackets: (−2)² − 3 · (−2) + 2."
    explanation: 4 + 6 + 2 = 12. Brackets when substituting save the sign.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "A term is like a **calculating machine**: you put in a number for x and a value comes out. With x = 5, 2x + 1 turns it into 11."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: A term gives the values 5, 8, 11 for x = 1, 2, 3. What is its value for x = 10?
    answer:
      value: 32
    feedback:
      - when: numval(state.input) == 50
        misconception: proportional-guess
        text: The term is not 5x. It grows by 3 per step.
    hints:
      - By how much does the value grow each step?
      - The term is 3x + 2.
    explanation: "Plus 3 per step and 5 at x = 1: that is 3x + 2. For x = 10 it gives 32."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: expression
    prompt: A rectangle is x long and 3 wide. Write a term for its perimeter.
    params:
      variables:
        - x
    answer:
      equivalentTo: 2x + 6
    feedback:
      - when: state.input == '3x'
        misconception: area-not-perimeter
        text: 3x is the area. The perimeter goes all the way round.
    hints:
      - The perimeter is the sum of all four sides.
      - x + 3 + x + 3.
    explanation: x + 3 + x + 3 = 2x + 6. 2(x + 3) is also right.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: choice
    prompt: Is 2x always greater than x?
    params:
      options:
        - label: Try x = −3.
          feedback: Probiere x = −3.
        - label: No – for x = 0 they are equal, for negative x, 2x is smaller
          correct: true
        - label: It is about the sign, not about even numbers.
          feedback: Es geht um das Vorzeichen, nicht um gerade.
    hints:
      - Plug in x = −3.
      - 2 · (−3) = −6 and −6 < −3.
    explanation: A variable can be any number – also 0 or negative. So you test statements with different values.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A magic trick: think of a number, double it, add 6, halve, subtract your number. Why is the result always 3?"
    params:
      options:
        - label: Because $(2x + 6)/2 - x = 3$ holds for every x
          correct: true
        - label: Because most people pick 3
          feedback: The chosen number drops out completely.
        - label: It only works for even numbers
          feedback: Doubling makes every number even, so halving always works.
    hints:
      - Call the number x and write each step as an expression.
    explanation: (2x + 6)/2 = x + 3, minus x leaves 3. With variables you prove something for **all** numbers at once.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: expression
    prompt: You lay a row of n squares side by side out of matches. Neighbouring squares share a match. How many matches do you need? A term in n.
    params:
      variables:
        - n
    answer:
      equivalentTo: 3n + 1
    feedback:
      - when: state.input == '4n'
        misconception: no-sharing
        text: 4n counts the shared matches twice.
    hints:
      - "1 square: 4 matches. 2 squares: 7. 3 squares: 10."
      - Each new square needs 3 matches.
    explanation: "One first match on the left, then 3 per square: 3n + 1. For 10 squares that is 31 matches."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Letters play different roles. In x + 3 = 7, x is an **unknown**. In A = a · b, a is a placeholder. In y = 2x, x is a variable that changes.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why mathematics uses letters.
    params:
      keywords:
        - - jede
          - alle
          - every
          - any
          - all
        - - zahl
          - number
          - wert
          - value
        - - platzhalter
          - allgemein
          - regel
          - placeholder
          - general
          - rule
      sample: A letter is a placeholder for any number. That way you can write down a rule that holds for all numbers instead of working each one out.
    explanation: "Key idea: with variables you describe infinitely many calculations at once."
    difficulty: 3

srs:
  cards_from: ["einsetzen"]
