id: alg.terms.simplify
type: concept
title: Combining like terms
summary: Only like terms can be added together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.simplify]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Apples and oranges
    body: "When shopping you count apples with apples, not with oranges. Algebra works the same way. Turn over the cards: what can you **combine**, and what stays as it is?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍎
            front: Three apples plus two apples
            back: Five apples. Things of the same kind simply add up.
          - icon: 🧺
            front: Three apples plus two oranges
            back: Stays as it is. Different kinds can't be merged into one number.
          - icon: 📦
            front: x + x + x
            back: "That's 3x: the same box three times."
          - icon: ✖️
            front: x · x
            back: That's x², not 2x. Multiplying is not the same as adding.

  - kind: problem
    id: fuenf-x
    widget: expression
    prompt: 'Simplify: $3x + 2x$'
    answer: { equivalentTo: "5x", form: expanded }
    feedback:
      - when: "state.input.includes('^') || state.input.includes('²')"
        misconception: add-to-power
        text: x + x is 2x, not x². When adding, you count the x's.
    hints:
      - 3 x plus 2 x – how many x is that?
    explanation: 3x + 2x = 5x.

  - kind: explain
    id: s2
    body: |
      Only **like** terms can be combined: $3x + 2x = 5x$.
      But $3x + 2$ stays $3x + 2$ – apples and oranges.

  - kind: problem
    id: gemischt
    widget: expression
    prompt: 'Simplify: $4x + 3 + 2x - 1$'
    answer: { equivalentTo: "6x + 2", form: expanded }
    hints:
      - Sort them – first the x terms, then the numbers.
      - 4x + 2x and 3 − 1.
    explanation: 4x + 2x = 6x and 3 − 1 = 2.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Which expression equals $2x + 3x + 4$?
    params:
      options:
        - { label: "$5x + 4$", correct: true }
        - { label: "$9x$", feedback: "The 4 has no x – it stands alone." }
        - { label: "$5x^2 + 4$", feedback: "Adding does not create a square." }
        - { label: "$6x + 3$", feedback: "Check – 2x + 3x." }
    hints:
      - Combine only the x terms.
    explanation: 2x + 3x = 5x, the 4 stays.

  - kind: problem
    id: variante
    widget: expression
    prompt: 'Simplify: ${{a}}x + {{b}} + {{c}}x$'
    answer: { equivalentTo: "{{a + c}}x + {{b}}", form: expanded }
    hints:
      - "Combine {{a}}x and {{c}}x."
    explanation: "{{a}}x + {{c}}x = {{a + c}}x. Result {{a + c}}x + {{b}}."
    variants:
      params: { a: "int[2,7]", b: "int[1,9]", c: "int[2,7]" }
      defaults: { a: 3, b: 5, c: 4 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: $3x + 4x = 7x$
          right: true
        - text: $3x + 4 = 7x$
          right: false
          why: 3x and 4 are not like terms.
        - text: $x + x = x^2$
          right: false
          why: x + x = 2x. x² would be x times x.
        - text: $5a - a = 4a$
          right: true

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: "Boxes with boxes, weights with weights: solve $3x + 4 = x + 10$ on the scale. At the end one box x is alone."
    params:
      left:
        x: 3
        units: 4
      right:
        x: 1
        units: 10
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tipped. Always change both sides the same way.
    hints:
      - First take one box off each side – like with like.
      - Then take 4 weights off both sides and divide by 2.
    explanation: $3x + 4 = x + 10$ → $2x + 4 = 10$ → $2x = 6$ → $x = 3$.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Simplify: $2x^2 + 3x - x^2 + 5x - 4$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^2 + 8x - 4
      form: expanded
    hints:
      - Sort into x², x and plain numbers.
    explanation: x² and x are different kinds. Only equal powers can be combined.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: buckets
    prompt: Can the term be combined with 3x?
    params:
      buckets:
        - id: b1
          label: yes
        - id: b2
          label: no
      items:
        - label: 5x
          bucket: b1
        - label: −x
          bucket: b1
        - label: ½x
          bucket: b1
        - label: "3"
          bucket: b2
        - label: x²
          bucket: b2
        - label: 3y
          bucket: b2
    hints:
      - Like terms have the same letter with the same power.
      - x² is not the same as x.
    explanation: 5x, −x and ½x are multiples of x. 3 is a number, x² a different power, 3y a different letter.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: expression
    prompt: "Simplify: $3a + 2b - a + 4b$"
    params:
      variables:
        - a
        - b
    answer:
      equivalentTo: 2a + 6b
      form: expanded
    hints:
      - "Sort: first all a, then all b."
      - 3a − a and 2b + 4b.
    explanation: "3a − a = 2a and 2b + 4b = 6b. Result: 2a + 6b."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Tom simplifies 3x + 2 to 5x. Check with x = 2: what is the value of 3x + 2?"
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 10
        misconception: took-wrong-term
        text: That is 5x for x = 2. The original term 3x + 2 gives something else.
    hints:
      - 3 · 2 = 6.
      - 6 + 2 = ?
    explanation: 3x + 2 = 8, but 5x = 10. One counterexample shows Tom’s step is wrong.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why may $3x + 2x$ be combined into $5x$?
    params:
      options:
        - label: "Because of the distributive law: $(3 + 2) \\cdot x$"
          correct: true
        - label: Because you may simply count equal letters
          feedback: That is the rule of thumb – the reason behind it is factoring out x.
        - label: Because addition is commutative
          feedback: That only allows swapping, not combining.
    hints:
      - Factor out x.
    explanation: "Combining is factoring: $3x + 2x = (3 + 2)x$."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Two terms are equivalent if they give the same value for **every** number. A single **counterexample** is enough to disprove it.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: expression
    prompt: "Simplify: $\\frac{1}{2}x + \\frac{1}{3}x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 5x/6
      form: expanded
    hints:
      - "Combine the numbers in front of x: 1/2 + 1/3."
      - 1/2 + 1/3 = 5/6.
    explanation: $\frac{1}{2}x + \frac{1}{3}x = \frac{5}{6}x$ – fraction arithmetic in front of the x.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Are $x^2 + x^2$ and $x^4$ equivalent?
    params:
      options:
        - label: "Try x = 2: 4 + 4 = 8, but 2⁴ = 16."
          feedback: "Probiere x = 2: 4 + 4 = 8, aber 2⁴ = 16."
        - label: No – $x^2 + x^2 = 2x^2$
          correct: true
        - label: For x = 2 in particular they differ.
          feedback: Gerade für x = 2 sind sie verschieden.
    hints:
      - Plug in x = 2.
      - Adding two equal things means doubling.
    explanation: "Adding doubles: $2x^2$. Exponents add only when multiplying: $x^2 \\cdot x^2 = x^4$."
    difficulty: 3

srs:
  cards_from: ["variante"]
