id: alg.terms.simplify
type: concept
title: Combining like terms
summary: Only like terms can be added together.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.simplify]
estimated_minutes: 6
steps:
  - kind: problem
    id: fuenf-x
    widget: expression
    prompt: 'Simplify: $3x + 2x$'
    answer: { equivalentTo: "5x", form: expanded }
    feedback:
      - when: "state.input.includes('^') || state.input.includes('²')"
        misconception: add-to-power
        text: x + x is 2x, not x². When adding, you count the x's.
    hints:
      - 3 x plus 2 x – how many x is that?
    explanation: 3x + 2x = 5x.

  - kind: explain
    body: |
      Only **like** terms can be combined: $3x + 2x = 5x$.
      But $3x + 2$ stays $3x + 2$ – apples and oranges.

  - kind: problem
    id: gemischt
    widget: expression
    prompt: 'Simplify: $4x + 3 + 2x - 1$'
    answer: { equivalentTo: "6x + 2", form: expanded }
    hints:
      - Sort them – first the x terms, then the numbers.
      - 4x + 2x and 3 − 1.
    explanation: 4x + 2x = 6x and 3 − 1 = 2.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Which expression equals $2x + 3x + 4$?
    params:
      options:
        - { label: "$5x + 4$", correct: true }
        - { label: "$9x$", feedback: "The 4 has no x – it stands alone." }
        - { label: "$5x^2 + 4$", feedback: "Adding does not create a square." }
        - { label: "$6x + 3$", feedback: "Check – 2x + 3x." }
    hints:
      - Combine only the x terms.
    explanation: 2x + 3x = 5x, the 4 stays.

  - kind: problem
    id: variante
    widget: expression
    prompt: 'Simplify: ${{a}}x + {{b}} + {{c}}x$'
    answer: { equivalentTo: "{{a + c}}x + {{b}}", form: expanded }
    hints:
      - "Combine {{a}}x and {{c}}x."
    explanation: "{{a}}x + {{c}}x = {{a + c}}x. Result {{a + c}}x + {{b}}."
    variants:
      params: { a: "int[2,7]", b: "int[1,9]", c: "int[2,7]" }
      defaults: { a: 3, b: 5, c: 4 }

srs:
  cards_from: ["steps[4]"]
