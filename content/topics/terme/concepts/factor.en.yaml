id: alg.terms.factor
type: concept
title: Factoring out
summary: Put what they share in front.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Numbers as rectangles
    body: A tiler has 24 tiles. He can lay them as 4 · 6 or 3 · 8. Drag the rectangle and find sides with exactly 24 squares. Each answer writes the number as a **product** – just like factoring out.
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 12
        maxH: 8
        w: 2
        h: 2
        show:
          - area

  - kind: problem
    id: gemeinsam
    widget: choice
    prompt: What is in both terms of 6x + 9?
    params:
      layout: grid
      options:
        - { label: "3", correct: true }
        - { label: "x", feedback: "There is no x in the 9." }
        - { label: "6", feedback: "9 is not divisible by 6." }
    hints:
      - Which number divides 6 and 9?
    explanation: 6x + 9 = 3 · (2x + 3).

  - kind: explain
    id: s2
    body: |
      **Factoring out** is expanding in reverse. You look for what is in every term and put it in front of the bracket.
      4x + 8 = 4 · (x + 2).

  - kind: problem
    id: klammern
    widget: expression
    prompt: Factor out – ${{a}}x + {{a * b}}$.
    params: { variables: [x] }
    answer: { equivalentTo: "{{a}}(x + {{b}})", form: factored }
    hints:
      - "{{a}} is in both parts."
    explanation: "{{a}} · (x + {{b}})."
    variants:
      params: { a: "int[2,7]", b: "int[2,9]" }
      defaults: { a: 4, b: 3 }

  - kind: problem
    id: x-ausklammern
    widget: choice
    prompt: What is x² + 5x with x factored out?
    params:
      options:
        - { label: "x · (x + 5)", correct: true }
        - { label: "x · (x + 5x)", feedback: "Then you would have x² + 5x² – too much." }
        - { label: "5 · (x² + x)", feedback: "There is no 5 in x²." }
    hints:
      - Both terms contain an x.
    explanation: x · x + x · 5 = x² + 5x.

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: On the left are 3 boxes and 3 weights – that is three parcels $(x + 1)$. On the right are 15 weights. Get one box x alone on the scale.
    params:
      left:
        x: 3
        units: 3
      right:
        x: 0
        units: 15
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: The scale tipped. Always change both sides the same way.
    hints:
      - Every term on the left contains a 3. Divide both sides by 3.
      - Then $x + 1 = 5$ remains. Take one weight off each side.
    explanation: $3x + 3 = 3 \cdot (x + 1) = 15$ → $x + 1 = 5$ → $x = 4$.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Factor out as much as possible: $12x^2 + 18x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 6x(2x + 3)
      form: factored
    hints:
      - The gcd of 12 and 18 is 6. And both terms contain x.
    explanation: 6x · 2x = 12x² and 6x · 3 = 18x.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: expression
    prompt: "Factor out: $15x - 10$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 5(3x - 2)
      form: factored
    hints:
      - Which number is in both 15 and 10?
      - 15x = 5 · 3x and 10 = 5 · 2.
    explanation: "$15x - 10 = 5(3x - 2)$. Check: expanding gives $15x - 10$ again."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Calculate cleverly: 37 · 23 + 37 · 77"
    answer:
      value: 3700
    hints:
      - 37 is in both terms.
      - 37 · (23 + 77).
    explanation: 37 · 100 = 3700. Factoring out saves two hard multiplications here.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: What is the greatest common factor of $8x^2$ and $12x$?
    params:
      options:
        - label: There is an x in both too.
          feedback: Auch ein x steckt in beiden.
        - label: 4x
          correct: true
        - label: 4 divides 8 and 12 – you can go bigger.
          feedback: 4 teilt 8 und 12 – es geht größer.
        - label: 12x contains only one x.
          feedback: In 12x steckt nur ein x.
    hints:
      - gcd of 8 and 12?
      - How many x does each contain at least?
    explanation: "gcd(8, 12) = 4 and one x in both: 4x. So $8x^2 + 12x = 4x(2x + 3)$."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Compute cleverly by factoring: $x^2 + 5x$ for $x = 95$."
    answer:
      value: 9500
    hints:
      - x(x + 5) = 95 · 100.
    explanation: Factoring turns two hard calculations into one easy one.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: how are factoring out and expanding related?"
    params:
      keywords:
        - - umkehr
          - rückwärts
          - gegenteil
          - reverse
          - inverse
          - opposite
          - undo
        - - gemeinsam
          - common
          - shared
          - faktor
          - factor
        - - klammer
          - bracket
          - parenthes
      sample: Factoring out is expanding in reverse. You pull the common factor in front of the bracket – when expanding you distribute it again.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Factoring helps you solve. If a **product** is zero, one of its factors must be zero. From $x(x - 5) = 0$ it follows: x = 0 or x = 5."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Solve $x^2 = 7x$. One solution is 0. What is the other?
    answer:
      value: 7
    hints:
      - "Bring everything to one side: $x^2 - 7x = 0$."
      - "Factor out x: $x(x - 7) = 0$."
    explanation: $x(x - 7) = 0$ means x = 0 or x = 7. Dividing by x would lose the solution 0!
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: expression
    prompt: "Factorise completely: $x^3 - x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x(x - 1)(x + 1)
      form: factored
    hints:
      - Factor out x first.
      - $x^2 - 1$ is a difference of squares.
    explanation: $x^3 - x = x(x^2 - 1) = x(x - 1)(x + 1)$ – three consecutive numbers. That is why $x^3 - x$ is always divisible by 6.
    difficulty: 3

srs:
  cards_from: [gemeinsam, klammern]
