id: alg.terms.factor
type: concept
title: Factoring out
summary: Put what they share in front.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: gemeinsam
    widget: choice
    prompt: What is in both terms of 6x + 9?
    params:
      layout: grid
      options:
        - { label: "3", correct: true }
        - { label: "x", feedback: "There is no x in the 9." }
        - { label: "6", feedback: "9 is not divisible by 6." }
    hints:
      - Which number divides 6 and 9?
    explanation: 6x + 9 = 3 · (2x + 3).

  - kind: explain
    body: |
      **Factoring out** is expanding in reverse. You look for what is in every term and put it in front of the bracket.
      4x + 8 = 4 · (x + 2).

  - kind: problem
    id: klammern
    widget: expression
    prompt: Factor out – ${{a}}x + {{a * b}}$.
    params: { variables: [x] }
    answer: { equivalentTo: "{{a}}(x + {{b}})", form: factored }
    hints:
      - "{{a}} is in both parts."
    explanation: "{{a}} · (x + {{b}})."
    variants:
      params: { a: "int[2,7]", b: "int[2,9]" }
      defaults: { a: 4, b: 3 }

  - kind: problem
    id: x-ausklammern
    widget: choice
    prompt: What is x² + 5x with x factored out?
    params:
      options:
        - { label: "x · (x + 5)", correct: true }
        - { label: "x · (x + 5x)", feedback: "Then you would have x² + 5x² – too much." }
        - { label: "5 · (x² + x)", feedback: "There is no 5 in x²." }
    hints:
      - Both terms contain an x.
    explanation: x · x + x · 5 = x² + 5x.

srs:
  cards_from: [gemeinsam, klammern]
