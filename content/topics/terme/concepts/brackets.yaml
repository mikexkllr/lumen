id: alg.terms.brackets
type: concept
title: Klammern auflösen
summary: Der Faktor vor der Klammer gilt für jedes Glied darin.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.brackets]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Päckchen auf der Waage
    body: "Wer zwei gleiche Päckchen packt, packt **jedes Teil** doppelt ein. Links liegen 2 Päckchen aus je einer Kiste x und 3 Gewichten: $2 \\cdot (x + 3)$. Teile beide Seiten durch 2. Was bleibt von einem Päckchen?"
    visual:
      widget: balance
      interactive: true
      params:
        left:
          x: 2
          units: 6
        right:
          x: 0
          units: 16
        allow:
          - remove_unit
          - divide

  - kind: problem
    id: einstieg
    widget: choice
    prompt: Was ist $4 \cdot (x + 3)$?
    params:
      options:
        - { label: "$4x + 12$", correct: true }
        - { label: "$4x + 3$", feedback: "Die 4 muss auch mit der 3 malgenommen werden." }
        - { label: "$x + 12$", feedback: "Die 4 gehört auch zum x." }
        - { label: "$7x$", feedback: "x und 3 lassen sich nicht zusammenfassen." }
    hints:
      - Stell dir 4 Pakete vor, in jedem x und 3.
    explanation: 4 · x + 4 · 3 = 4x + 12.

  - kind: explain
    id: s2
    body: |
      Der Faktor vor der Klammer wird mit **jedem** Glied malgenommen:
      $a(b + c) = ab + ac$. Man nennt das **Ausmultiplizieren**.

  - kind: problem
    id: ausmultiplizieren
    widget: expression
    prompt: 'Multipliziere aus: ${{a}}(x + {{b}})$'
    answer: { equivalentTo: "{{a}}x + {{a * b}}", form: expanded }
    hints:
      - "{{a}} · x und {{a}} · {{b}}."
    explanation: "{{a}}(x + {{b}}) = {{a}}x + {{a * b}}."
    variants:
      params: { a: "int[2,9]", b: "int[2,9]" }
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: minus-klammer
    widget: expression
    prompt: 'Multipliziere aus: $-2(x - 5)$'
    answer: { equivalentTo: "-2x + 10", form: expanded }
    hints:
      - (−2) · x und (−2) · (−5).
      - Minus mal minus ergibt plus.
    explanation: −2 · x = −2x und (−2) · (−5) = +10.
    difficulty: 2

  - kind: problem
    id: ausklammern
    widget: expression
    prompt: 'Klammere aus: $6x + 9$'
    answer: { equivalentTo: "3(2x + 3)", form: factored }
    hints:
      - Welche Zahl teilt 6 und 9?
      - Beide sind durch 3 teilbar.
    explanation: 6x + 9 = 3 · 2x + 3 · 3 = 3(2x + 3).
    difficulty: 2

  - kind: problem
    id: richtig
    widget: choice
    prompt: Welche Umformung ist richtig?
    params:
      options:
        - { label: "$5(x - 2) = 5x - 10$", correct: true }
        - { label: "$3 \\cdot 2x = 6x + 3$", feedback: "3 · 2x ist einfach 6x." }
        - { label: "$(x + 1) \\cdot 2 = 2x + 1$", feedback: "Die 2 gehört auch zur 1." }
        - { label: "$-(x + 4) = -x + 4$", feedback: "Das Minus gilt für beide Glieder – also −x − 4." }
    hints:
      - Prüfe, ob jedes Glied in der Klammer malgenommen wurde.
    explanation: 5 · x − 5 · 2 = 5x − 10.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Bei $-(x - 3)$ dreht das Minus **jedes** Vorzeichen um: Es wird [[−x + 3]]. Bei $2(x + 4)$ wird es [[2x + 8]]."
      distractors:
        - −x − 3
        - 2x + 4

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: "Links liegt $3 \\cdot (x + 2)$: drei Päckchen aus je einer Kiste und 2 Gewichten. Rechts liegen 15 Gewichte. Bring eine Kiste x allein auf die Waage."
    params:
      left:
        x: 3
        units: 6
      right:
        x: 0
        units: 15
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: Die Waage kippt. Verändere immer beide Seiten gleich.
    hints:
      - "Teile beide Seiten durch 3: Dann liegt links nur noch ein Päckchen."
      - Danach nimm auf beiden Seiten 2 Gewichte weg.
    explanation: "$3(x + 2) = 15$ → $x + 2 = 5$ → $x = 3$. Ausmultipliziert ist es dieselbe Waage: $3x + 6 = 15$."

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Multipliziere aus und fasse zusammen: $(x + 2)(x + 5)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^2 + 7x + 10
      form: expanded
    hints:
      - "Jedes Glied der ersten Klammer mal jedes der zweiten: vier Produkte."
    explanation: x² + 5x + 2x + 10. Die mittleren Glieder ergeben 7x.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Ein Minus vor der Klammer wirkt wie mal −1: Jedes **Vorzeichen** in der Klammer kippt. $-(x - 3) = -x + 3$."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: expression
    prompt: "Löse die Klammer auf und fasse zusammen: $-(x - {{b}}) + {{c}}x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: "{{c - 1}}x + {{b}}"
      form: expanded
    hints:
      - $-(x - {{b}}) = -x + {{b}}$.
      - Dann $-x + {{c}}x$.
    explanation: $-x + {{b}} + {{c}}x = {{c - 1}}x + {{b}}$.
    variants:
      params:
        b: int[2,9]
        c: int[3,7]
      defaults:
        b: 3
        c: 4
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Rechne geschickt mit einer Klammer: 7 · 98 = 7 · (100 − 2)."
    answer:
      value: 686
    feedback:
      - when: numval(state.input) == 698
        misconception: partial-distribution
        text: Auch die 2 muss mit 7 malgenommen werden.
    hints:
      - 7 · 100 − 7 · 2.
      - 700 − 14 = ?
    explanation: 700 − 14 = 686. Das Kopfrechnen-Zerlegen ist genau das Ausmultiplizieren.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: expression
    prompt: "Löse auf: $3x - 2(x - 4) - (5 - x)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 2x + 3
      form: expanded
    hints:
      - −2 · (−4) = +8 und −(−x) = +x.
    explanation: 3x − 2x + 8 − 5 + x = 2x + 3.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: expression
    prompt: "Multipliziere aus: $(x - 3)(x + 4)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^2 + x - 12
      form: expanded
    hints:
      - "Jedes Glied mal jedes Glied: vier Produkte."
      - $x^2 + 4x - 3x - 12$.
    explanation: $x^2 + 4x - 3x - 12 = x^2 + x - 12$.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: expression
    prompt: "Multipliziere aus – es passiert etwas Erstaunliches: $(x + 1)(x^2 - x + 1)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^3 + 1
      form: expanded
    hints:
      - Erst x mal die ganze zweite Klammer, dann 1 mal die zweite Klammer.
      - $x^3 - x^2 + x + x^2 - x + 1$.
    explanation: "Fast alles hebt sich weg: $x^3 + 1$. Umgekehrt zerlegt man so Summen von Kuben."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum $3(x + 2)$ dasselbe ist wie $3x + 6$.
    params:
      keywords:
        - - jede
          - beide
          - each
          - both
          - every
        - - mal
          - times
          - multipl
          - acts on
          - wirkt
        - - dreimal
          - drei
          - three
          - gruppen
          - groups
      sample: "3(x + 2) heißt: dreimal die Gruppe x + 2. Das sind drei x und dreimal die 2. Der Faktor 3 wirkt also auf beide Glieder: 3x + 6."
    explanation: "Kernidee: Der Faktor vor der Klammer gilt für jedes Glied darin."
    difficulty: 3

srs:
  cards_from: ["ausmultiplizieren"]
