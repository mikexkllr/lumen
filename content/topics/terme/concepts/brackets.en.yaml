id: alg.terms.brackets
type: concept
title: Removing brackets
summary: The factor before the bracket applies to every term inside.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.brackets]
estimated_minutes: 8
steps:
  - kind: problem
    id: einstieg
    widget: choice
    prompt: What is $4 \cdot (x + 3)$?
    params:
      options:
        - { label: "$4x + 12$", correct: true }
        - { label: "$4x + 3$", feedback: "The 4 must be multiplied with the 3 as well." }
        - { label: "$x + 12$", feedback: "The 4 belongs to the x as well." }
        - { label: "$7x$", feedback: "x and 3 cannot be combined." }
    hints:
      - Picture 4 packages, each with x and 3.
    explanation: 4 · x + 4 · 3 = 4x + 12.

  - kind: explain
    body: |
      The factor before the bracket is multiplied with **every** term:
      $a(b + c) = ab + ac$. This is called **expanding**.

  - kind: problem
    id: ausmultiplizieren
    widget: expression
    prompt: 'Expand: ${{a}}(x + {{b}})$'
    answer: { equivalentTo: "{{a}}x + {{a * b}}", form: expanded }
    hints:
      - "{{a}} · x and {{a}} · {{b}}."
    explanation: "{{a}}(x + {{b}}) = {{a}}x + {{a * b}}."
    variants:
      params: { a: "int[2,9]", b: "int[2,9]" }
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: minus-klammer
    widget: expression
    prompt: 'Expand: $-2(x - 5)$'
    answer: { equivalentTo: "-2x + 10", form: expanded }
    hints:
      - (−2) · x and (−2) · (−5).
      - A negative times a negative is positive.
    explanation: −2 · x = −2x and (−2) · (−5) = +10.
    difficulty: 2

  - kind: problem
    id: ausklammern
    widget: expression
    prompt: 'Factor out: $6x + 9$'
    answer: { equivalentTo: "3(2x + 3)", form: factored }
    hints:
      - Which number divides 6 and 9?
      - Both are divisible by 3.
    explanation: 6x + 9 = 3 · 2x + 3 · 3 = 3(2x + 3).
    difficulty: 2

  - kind: problem
    id: richtig
    widget: choice
    prompt: Which rearrangement is correct?
    params:
      options:
        - { label: "$5(x - 2) = 5x - 10$", correct: true }
        - { label: "$3 \\cdot 2x = 6x + 3$", feedback: "3 · 2x is simply 6x." }
        - { label: "$(x + 1) \\cdot 2 = 2x + 1$", feedback: "The 2 belongs to the 1 as well." }
        - { label: "$-(x + 4) = -x + 4$", feedback: "The minus applies to both terms – so −x − 4." }
    hints:
      - Check whether every term in the bracket was multiplied.
    explanation: 5 · x − 5 · 2 = 5x − 10.

srs:
  cards_from: ["steps[2]"]
