id: alg.terms.brackets
type: concept
title: Removing brackets
summary: The factor before the bracket applies to every term inside.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.brackets]
estimated_minutes: 12
steps:
  - kind: problem
    id: einstieg
    widget: choice
    prompt: What is $4 \cdot (x + 3)$?
    params:
      options:
        - { label: "$4x + 12$", correct: true }
        - { label: "$4x + 3$", feedback: "The 4 must be multiplied with the 3 as well." }
        - { label: "$x + 12$", feedback: "The 4 belongs to the x as well." }
        - { label: "$7x$", feedback: "x and 3 cannot be combined." }
    hints:
      - Picture 4 packages, each with x and 3.
    explanation: 4 · x + 4 · 3 = 4x + 12.

  - kind: explain
    id: s2
    body: |
      The factor before the bracket is multiplied with **every** term:
      $a(b + c) = ab + ac$. This is called **expanding**.

  - kind: problem
    id: ausmultiplizieren
    widget: expression
    prompt: 'Expand: ${{a}}(x + {{b}})$'
    answer: { equivalentTo: "{{a}}x + {{a * b}}", form: expanded }
    hints:
      - "{{a}} · x and {{a}} · {{b}}."
    explanation: "{{a}}(x + {{b}}) = {{a}}x + {{a * b}}."
    variants:
      params: { a: "int[2,9]", b: "int[2,9]" }
      defaults: { a: 3, b: 5 }

  - kind: problem
    id: minus-klammer
    widget: expression
    prompt: 'Expand: $-2(x - 5)$'
    answer: { equivalentTo: "-2x + 10", form: expanded }
    hints:
      - (−2) · x and (−2) · (−5).
      - A negative times a negative is positive.
    explanation: −2 · x = −2x and (−2) · (−5) = +10.
    difficulty: 2

  - kind: problem
    id: ausklammern
    widget: expression
    prompt: 'Factor out: $6x + 9$'
    answer: { equivalentTo: "3(2x + 3)", form: factored }
    hints:
      - Which number divides 6 and 9?
      - Both are divisible by 3.
    explanation: 6x + 9 = 3 · 2x + 3 · 3 = 3(2x + 3).
    difficulty: 2

  - kind: problem
    id: richtig
    widget: choice
    prompt: Which rearrangement is correct?
    params:
      options:
        - { label: "$5(x - 2) = 5x - 10$", correct: true }
        - { label: "$3 \\cdot 2x = 6x + 3$", feedback: "3 · 2x is simply 6x." }
        - { label: "$(x + 1) \\cdot 2 = 2x + 1$", feedback: "The 2 belongs to the 1 as well." }
        - { label: "$-(x + 4) = -x + 4$", feedback: "The minus applies to both terms – so −x − 4." }
    hints:
      - Check whether every term in the bracket was multiplied.
    explanation: 5 · x − 5 · 2 = 5x − 10.

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: "In $-(x - 3)$ the minus flips **every** sign: it becomes [[−x + 3]]. For $2(x + 4)$ it becomes [[2x + 8]]."
      distractors:
        - −x − 3
        - 2x + 4

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Expand and simplify: $(x + 2)(x + 5)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^2 + 7x + 10
      form: expanded
    hints:
      - "Each term of the first bracket times each of the second: four products."
    explanation: x² + 5x + 2x + 10. The middle terms give 7x.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "A minus in front of brackets acts like times −1: every **sign** inside flips. $-(x - 3) = -x + 3$."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: expression
    prompt: "Remove the brackets and simplify: $-(x - {{b}}) + {{c}}x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: "{{c - 1}}x + {{b}}"
      form: expanded
    hints:
      - $-(x - {{b}}) = -x + {{b}}$.
      - Then $-x + {{c}}x$.
    explanation: $-x + {{b}} + {{c}}x = {{c - 1}}x + {{b}}$.
    variants:
      params:
        b: int[2,9]
        c: int[3,7]
      defaults:
        b: 3
        c: 4
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Calculate cleverly using brackets: 7 · 98 = 7 · (100 − 2)."
    answer:
      value: 686
    feedback:
      - when: numval(state.input) == 698
        misconception: partial-distribution
        text: The 2 must be multiplied by 7 too.
    hints:
      - 7 · 100 − 7 · 2.
      - 700 − 14 = ?
    explanation: 700 − 14 = 686. Splitting in mental maths is exactly expanding brackets.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: expression
    prompt: "Expand: $3x - 2(x - 4) - (5 - x)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 2x + 3
      form: expanded
    hints:
      - −2 · (−4) = +8 and −(−x) = +x.
    explanation: 3x − 2x + 8 − 5 + x = 2x + 3.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: expression
    prompt: "Expand: $(x - 3)(x + 4)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^2 + x - 12
      form: expanded
    hints:
      - "Each term times each term: four products."
      - $x^2 + 4x - 3x - 12$.
    explanation: $x^2 + 4x - 3x - 12 = x^2 + x - 12$.
    difficulty: 3

  - kind: problem
    id: ma-x2
    depth: 3
    widget: expression
    prompt: "Expand – something surprising happens: $(x + 1)(x^2 - x + 1)$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^3 + 1
      form: expanded
    hints:
      - First x times the whole second bracket, then 1 times it.
      - $x^3 - x^2 + x + x^2 - x + 1$.
    explanation: "Almost everything cancels: $x^3 + 1$. Backwards, this factors sums of cubes."
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux why $3(x + 2)$ is the same as $3x + 6$.
    params:
      keywords:
        - - jede
          - beide
          - each
          - both
          - every
        - - mal
          - times
          - multipl
          - acts on
          - wirkt
        - - dreimal
          - drei
          - three
          - gruppen
          - groups
      sample: "3(x + 2) means three groups of x + 2. That is three x and three 2s. So the factor 3 acts on both terms: 3x + 6."
    explanation: "Key idea: the factor in front of the brackets applies to every term inside."
    difficulty: 3

srs:
  cards_from: ["ausmultiplizieren"]
