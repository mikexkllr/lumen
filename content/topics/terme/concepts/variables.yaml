id: alg.terms.variables
type: concept
title: Variablen
summary: Ein Buchstabe als Platzhalter für jede mögliche Zahl.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.variables]
estimated_minutes: 14
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Was steckt in der Kiste?
    body: "Ein Preis, den du noch nicht kennst, ein Alter, ein Gewicht: Dafür schreibt man einen Buchstaben – eine **Variable**. Hier steckt die Zahl in der Kiste x. Nimm links und rechts gleich viele Gewichte weg. Was verrät die Waage?"
    visual:
      widget: balance
      interactive: true
      params:
        left:
          x: 1
          units: 4
        right:
          x: 0
          units: 9
        allow:
          - remove_unit

  - kind: problem
    id: kino
    widget: numeric
    body: Ein Kinoticket kostet x €. Popcorn kostet 4 €.
    prompt: Was kosten Ticket und Popcorn zusammen, wenn x = 9 ist?
    params: { unit: "€" }
    answer: { value: 13 }
    hints:
      - Setze 9 für x ein.
    explanation: x + 4 = 9 + 4 = 13.

  - kind: explain
    id: s2
    body: |
      Eine **Variable** ist ein Platzhalter für eine Zahl.
      Der Term $x + 4$ beschreibt den Preis für **jeden** Ticketpreis x.

  - kind: problem
    id: drei-tickets
    widget: expression
    prompt: Schreibe als Term – drei Tickets und ein Popcorn.
    answer: { equivalentTo: "3x + 4" }
    hints:
      - Drei Tickets kosten 3 · x, kurz 3x.
    explanation: 3x + 4

  - kind: problem
    id: einsetzen
    widget: numeric
    prompt: 'Berechne $2x + {{b}}$ für $x = {{a}}$.'
    answer: { value: "{{2 * a + b}}" }
    feedback:
      - when: "numval(state.input) == 20 + a + b"
        misconception: juxtaposition
        text: 2x heißt 2 · x – nicht »2 und dann x«.
    hints:
      - "2x bedeutet 2 · {{a}}."
    explanation: "2 · {{a}} + {{b}} = {{2 * a + b}}."
    variants:
      params: { a: "int[2,9]", b: "int[1,9]" }
      defaults: { a: 5, b: 3 }

  - kind: problem
    id: uebersetzen
    widget: choice
    prompt: Welcher Term bedeutet »das Doppelte einer Zahl, plus 5«?
    params:
      options:
        - { label: "$2x + 5$", correct: true }
        - { label: "$2(x + 5)$", feedback: "Das wäre das Doppelte von x + 5." }
        - { label: "$x^2 + 5$", feedback: "x² ist x · x, nicht 2 · x." }
        - { label: "$5x + 2$", feedback: "Hier wurde das Fünffache genommen." }
    hints:
      - Das Doppelte von x ist 2x.
    explanation: Erst verdoppeln (2x), dann 5 addieren.

  - kind: problem
    id: c1
    widget: match
    prompt: Welcher Term passt zum Text?
    params:
      pairs:
        - left: das Doppelte von x
          right: $2x$
        - left: x vermindert um 2
          right: $x - 2$
        - left: die Hälfte von x
          right: $\frac{x}{2}$
        - left: x mit sich selbst mal
          right: $x^2$
        - left: 2 vermindert um x
          right: $2 - x$
    hints:
      - Setz für x die Zahl 6 ein und prüf nach.
    explanation: Terme übersetzen Sprache in Rechnungen. Auf die Reihenfolge kommt es an.

  - kind: problem
    id: ma-c1
    widget: tiles
    prompt: "Lege einen Term für: das Dreifache einer Zahl x, plus 2."
    params:
      tiles:
        - 3x
        - +
        - "2"
        - 2x
        - −
        - "3"
      slots: 3
    answer:
      equivalentTo: 3x + 2
    hints:
      - Das Dreifache von x schreibt man 3x.
      - Dann kommt plus 2 dazu.
    explanation: 3x + 2. Auch 2 + 3x ist richtig – die Reihenfolge beim Addieren ist egal.

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: Zwei gleiche Kisten und 2 Gewichte wiegen so viel wie 10 Gewichte. Welche Zahl steckt in einer Kiste? Bring eine Kiste x allein auf die Waage.
    params:
      left:
        x: 2
        units: 2
      right:
        x: 0
        units: 10
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: Die Waage kippt. Verändere immer beide Seiten gleich.
    hints:
      - Nimm zuerst auf beiden Seiten 2 Gewichte weg.
      - Dann wiegen 2 Kisten so viel wie 8 Gewichte. Teile beide Seiten durch 2.
    explanation: $2x + 2 = 10$ → $2x = 8$ → $x = 4$. In jeder Kiste steckt die 4.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Berechne $x^2 - 3x + 2$ für $x = -2$.
    answer:
      value: 12
    feedback:
      - when: numval(state.input) == 4 || numval(state.input) == -8 || numval(state.input) == 0
        misconception: sign-error
        text: "Achte auf die Vorzeichen: (−2)² = +4 und −3 · (−2) = +6."
    hints:
      - "Setz −2 in Klammern ein: (−2)² − 3 · (−2) + 2."
    explanation: 4 + 6 + 2 = 12. Klammern beim Einsetzen retten das Vorzeichen.
    difficulty: 2

  - kind: explain
    id: ma-d1
    depth: 2
    body: "Ein Term ist wie eine **Rechenmaschine**: Du steckst eine Zahl für x hinein, und heraus kommt ein Wert. Mit x = 5 macht 2x + 1 daraus 11."

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: Ein Term ergibt für x = 1, 2, 3 die Werte 5, 8, 11. Welchen Wert hat er für x = 10?
    answer:
      value: 32
    feedback:
      - when: numval(state.input) == 50
        misconception: proportional-guess
        text: Der Term ist nicht 5x. Er wächst pro Schritt um 3.
    hints:
      - Um wie viel wächst der Wert pro Schritt?
      - Der Term ist 3x + 2.
    explanation: "Plus 3 pro Schritt und 5 bei x = 1: Das ist 3x + 2. Für x = 10 ergibt das 32."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: expression
    prompt: Ein Rechteck ist x lang und 3 breit. Schreib einen Term für seinen Umfang.
    params:
      variables:
        - x
    answer:
      equivalentTo: 2x + 6
    feedback:
      - when: state.input == '3x'
        misconception: area-not-perimeter
        text: 3x ist die Fläche. Der Umfang läuft einmal ringsherum.
    hints:
      - Der Umfang ist die Summe aller vier Seiten.
      - x + 3 + x + 3.
    explanation: x + 3 + x + 3 = 2x + 6. Auch 2(x + 3) ist richtig.
    difficulty: 2

  - kind: problem
    id: ma-d4
    depth: 2
    widget: choice
    prompt: Ist 2x immer größer als x?
    params:
      options:
        - label: Ja, das Doppelte ist immer mehr
          feedback: Probiere x = −3.
        - label: Nein – für x = 0 sind beide gleich, für negative x ist 2x kleiner
          correct: true
        - label: Nur für gerade x
          feedback: Es geht um das Vorzeichen, nicht um gerade.
    hints:
      - Setze x = −3 ein.
      - 2 · (−3) = −6 und −6 < −3.
    explanation: Eine Variable kann jede Zahl sein – auch 0 oder negativ. Darum prüft man Aussagen mit verschiedenen Werten.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Zaubertrick: Denk dir eine Zahl, verdopple sie, addiere 6, halbiere, zieh die gedachte Zahl ab. Warum kommt immer 3 heraus?"
    params:
      options:
        - label: Weil $(2x + 6)/2 - x = 3$ für jedes x gilt
          correct: true
        - label: Weil die meisten Leute 3 wählen
          feedback: Die gewählte Zahl fällt komplett heraus.
        - label: Es klappt nur bei geraden Zahlen
          feedback: Verdoppeln macht jede Zahl gerade, das Halbieren geht immer auf.
    hints:
      - Nenn die gedachte Zahl x und schreib jeden Schritt als Term.
    explanation: (2x + 6)/2 = x + 3, minus x bleibt 3. Mit Variablen beweist man etwas für **alle** Zahlen auf einmal.
    difficulty: 3

  - kind: problem
    id: ma-x1
    depth: 3
    widget: expression
    prompt: Aus Streichhölzern legst du eine Reihe von n Quadraten nebeneinander. Benachbarte Quadrate teilen sich ein Holz. Wie viele Hölzer brauchst du? Term mit n.
    params:
      variables:
        - n
    answer:
      equivalentTo: 3n + 1
    feedback:
      - when: state.input == '4n'
        misconception: no-sharing
        text: 4n zählt die geteilten Hölzer doppelt.
    hints:
      - "1 Quadrat: 4 Hölzer. 2 Quadrate: 7. 3 Quadrate: 10."
      - Jedes neue Quadrat braucht 3 Hölzer.
    explanation: "Ein erstes Holz links, dann pro Quadrat 3: 3n + 1. Für 10 Quadrate also 31 Hölzer."
    difficulty: 3

  - kind: explain
    id: ma-x2
    depth: 3
    body: Buchstaben spielen verschiedene Rollen. In x + 3 = 7 ist x eine **Unbekannte**. In A = a · b ist a ein Platzhalter. In y = 2x ist x eine Veränderliche.

  - kind: problem
    id: ma-x3
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum man in der Mathematik mit Buchstaben rechnet.
    params:
      keywords:
        - - jede
          - alle
          - every
          - any
          - all
        - - zahl
          - number
          - wert
          - value
        - - platzhalter
          - allgemein
          - regel
          - placeholder
          - general
          - rule
      sample: Ein Buchstabe ist ein Platzhalter für jede Zahl. So kann man eine Regel aufschreiben, die für alle Zahlen gilt, statt jede einzeln auszurechnen.
    explanation: "Kernidee: Mit Variablen beschreibt man unendlich viele Rechnungen auf einmal."
    difficulty: 3

srs:
  cards_from: ["einsetzen"]
