id: alg.terms.simplify
type: concept
title: Terme zusammenfassen
summary: Nur Gleichartiges lässt sich zusammenzählen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: [terms.simplify]
estimated_minutes: 13
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Äpfel und Birnen
    body: "Beim Einkaufen zählst du Äpfel zu Äpfeln, nicht zu Birnen. In der Algebra ist es genauso. Deck die Karten auf: Was lässt sich **zusammenfassen**, und was bleibt, wie es ist?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: grid
        cards:
          - icon: 🍎
            front: Drei Äpfel plus zwei Äpfel
            back: Fünf Äpfel. Gleiche Sorten darf man einfach zusammenzählen.
          - icon: 🧺
            front: Drei Äpfel plus zwei Birnen
            back: Bleibt so. Verschiedene Sorten lassen sich nicht zu einer Zahl machen.
          - icon: 📦
            front: x + x + x
            back: "Das ist 3x: dreimal dieselbe Kiste."
          - icon: ✖️
            front: x · x
            back: Das ist x², nicht 2x. Malnehmen ist etwas anderes als Zusammenzählen.

  - kind: problem
    id: fuenf-x
    widget: expression
    prompt: 'Fasse zusammen: $3x + 2x$'
    answer: { equivalentTo: "5x", form: expanded }
    feedback:
      - when: "state.input.includes('^') || state.input.includes('²')"
        misconception: add-to-power
        text: x + x ist 2x, nicht x². Beim Addieren zählst du die x.
    hints:
      - 3 x plus 2 x – wie viele x sind das?
    explanation: 3x + 2x = 5x.

  - kind: explain
    id: s2
    body: |
      Nur **gleichartige** Terme lassen sich zusammenfassen: $3x + 2x = 5x$.
      Aber $3x + 2$ bleibt $3x + 2$ – Äpfel und Birnen.

  - kind: problem
    id: gemischt
    widget: expression
    prompt: 'Vereinfache: $4x + 3 + 2x - 1$'
    answer: { equivalentTo: "6x + 2", form: expanded }
    hints:
      - Sortiere – erst die x, dann die Zahlen.
      - 4x + 2x und 3 − 1.
    explanation: 4x + 2x = 6x und 3 − 1 = 2.

  - kind: problem
    id: gleich
    widget: choice
    prompt: Welcher Term ist gleich $2x + 3x + 4$?
    params:
      options:
        - { label: "$5x + 4$", correct: true }
        - { label: "$9x$", feedback: "Die 4 ist keine x-Zahl – sie bleibt allein stehen." }
        - { label: "$5x^2 + 4$", feedback: "Beim Addieren entsteht kein Quadrat." }
        - { label: "$6x + 3$", feedback: "Prüfe – 2x + 3x." }
    hints:
      - Fasse nur die x-Terme zusammen.
    explanation: 2x + 3x = 5x, die 4 bleibt.

  - kind: problem
    id: variante
    widget: expression
    prompt: 'Vereinfache: ${{a}}x + {{b}} + {{c}}x$'
    answer: { equivalentTo: "{{a + c}}x + {{b}}", form: expanded }
    hints:
      - "Fasse {{a}}x und {{c}}x zusammen."
    explanation: "{{a}}x + {{c}}x = {{a + c}}x. Ergebnis {{a + c}}x + {{b}}."
    variants:
      params: { a: "int[2,7]", b: "int[1,9]", c: "int[2,7]" }
      defaults: { a: 3, b: 5, c: 4 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: $3x + 4x = 7x$
          right: true
        - text: $3x + 4 = 7x$
          right: false
          why: 3x und 4 sind nicht gleichartig.
        - text: $x + x = x^2$
          right: false
          why: x + x = 2x. x² wäre x mal x.
        - text: $5a - a = 4a$
          right: true

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: "Kisten zu Kisten, Gewichte zu Gewichten: Löse $3x + 4 = x + 10$ auf der Waage. Am Ende liegt eine Kiste x allein."
    params:
      left:
        x: 3
        units: 4
      right:
        x: 1
        units: 10
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: Die Waage kippt. Verändere immer beide Seiten gleich.
    hints:
      - Nimm zuerst auf beiden Seiten eine Kiste weg – Gleiches zu Gleichem.
      - Dann nimm 4 Gewichte von beiden Seiten und teile durch 2.
    explanation: $3x + 4 = x + 10$ → $2x + 4 = 10$ → $2x = 6$ → $x = 3$.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Vereinfache: $2x^2 + 3x - x^2 + 5x - 4$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x^2 + 8x - 4
      form: expanded
    hints:
      - Sortiere nach x², x und Zahlen.
    explanation: x² und x sind verschiedene Sorten. Nur gleiche Potenzen lassen sich zusammenfassen.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: buckets
    prompt: Lässt sich der Term mit 3x zusammenfassen?
    params:
      buckets:
        - id: b1
          label: ja
        - id: b2
          label: nein
      items:
        - label: 5x
          bucket: b1
        - label: −x
          bucket: b1
        - label: ½x
          bucket: b1
        - label: "3"
          bucket: b2
        - label: x²
          bucket: b2
        - label: 3y
          bucket: b2
    hints:
      - "Gleichartig heißt: derselbe Buchstabe mit derselben Hochzahl."
      - x² ist nicht dasselbe wie x.
    explanation: 5x, −x und ½x sind Vielfache von x. 3 ist eine Zahl, x² eine andere Potenz, 3y ein anderer Buchstabe.
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: expression
    prompt: "Vereinfache: $3a + 2b - a + 4b$"
    params:
      variables:
        - a
        - b
    answer:
      equivalentTo: 2a + 6b
      form: expanded
    hints:
      - "Sortiere: erst alle a, dann alle b."
      - 3a − a und 2b + 4b.
    explanation: "3a − a = 2a und 2b + 4b = 6b. Ergebnis: 2a + 6b."
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: numeric
    prompt: "Tom vereinfacht 3x + 2 zu 5x. Prüfe mit x = 2: Welchen Wert hat 3x + 2?"
    answer:
      value: 8
    feedback:
      - when: numval(state.input) == 10
        misconception: took-wrong-term
        text: Das ist 5x für x = 2. Der Originalterm 3x + 2 ergibt etwas anderes.
    hints:
      - 3 · 2 = 6.
      - 6 + 2 = ?
    explanation: "3x + 2 = 8, aber 5x = 10. Ein Gegenbeispiel zeigt: Toms Umformung ist falsch."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum darf man $3x + 2x$ zu $5x$ zusammenfassen?
    params:
      options:
        - label: "Wegen des Distributivgesetzes: $(3 + 2) \\cdot x$"
          correct: true
        - label: Weil man gleiche Buchstaben einfach zählen darf
          feedback: Das ist die Faustregel – der Grund dahinter ist das Ausklammern von x.
        - label: Weil Addition kommutativ ist
          feedback: Das erlaubt nur das Vertauschen, nicht das Zusammenfassen.
    hints:
      - Klammere x aus.
    explanation: "Zusammenfassen ist Ausklammern: $3x + 2x = (3 + 2)x$."
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: Zwei Terme sind gleichwertig, wenn sie für **jede** Zahl dasselbe ergeben. Ein einziges **Gegenbeispiel** genügt, um das zu widerlegen.

  - kind: problem
    id: ma-x2
    depth: 3
    widget: expression
    prompt: "Vereinfache: $\\frac{1}{2}x + \\frac{1}{3}x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 5x/6
      form: expanded
    hints:
      - "Fasse die Zahlen vor x zusammen: 1/2 + 1/3."
      - 1/2 + 1/3 = 5/6.
    explanation: $\frac{1}{2}x + \frac{1}{3}x = \frac{5}{6}x$ – Bruchrechnung vor dem x.
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: choice
    prompt: Sind $x^2 + x^2$ und $x^4$ gleichwertig?
    params:
      options:
        - label: Ja
          feedback: "Probiere x = 2: 4 + 4 = 8, aber 2⁴ = 16."
        - label: Nein – $x^2 + x^2 = 2x^2$
          correct: true
        - label: Nur für x = 2
          feedback: Gerade für x = 2 sind sie verschieden.
    hints:
      - Setze x = 2 ein.
      - Zwei gleiche Dinge addieren heißt verdoppeln.
    explanation: "Addieren verdoppelt: $2x^2$. Hochzahlen addieren sich nur beim Malnehmen: $x^2 \\cdot x^2 = x^4$."
    difficulty: 3

srs:
  cards_from: ["variante"]
