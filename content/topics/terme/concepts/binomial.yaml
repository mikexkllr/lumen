id: alg.terms.binomial
type: concept
title: Die binomischen Formeln
summary: (a + b)² ist mehr als a² + b².
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: flaeche
    widget: choice
    prompt: Ein Quadrat hat die Seite a + b. Ist seine Fläche a² + b²?
    params:
      options:
        - { label: "Nein – es fehlen zwei Rechtecke a · b", correct: true }
        - { label: "Ja, genau", feedback: "Zeichne es auf: Es gibt zwei Quadrate und zwei Rechtecke." }
    hints:
      - Teile das große Quadrat in vier Stücke.
    explanation: (a + b)² = a² + 2ab + b². Die zwei Rechtecke werden gern vergessen.

  - kind: explain
    id: s2
    body: |
      **Binomische Formeln:**
      (a + b)² = a² + 2ab + b²
      (a − b)² = a² − 2ab + b²
      (a + b)(a − b) = a² − b²

  - kind: problem
    id: ausmultiplizieren
    widget: expression
    prompt: Multipliziere aus – $(x + {{n}})^2$.
    params: { variables: [x] }
    answer: { equivalentTo: "x^2 + {{2 * n}}x + {{n * n}}", form: expanded }
    hints:
      - "a = x, b = {{n}}. Dann a² + 2ab + b²."
    explanation: "x² + {{2 * n}}x + {{n * n}}."
    variants:
      params: { n: "int[2,9]" }
      defaults: { n: 3 }

  - kind: problem
    id: kopfrechnen
    widget: numeric
    prompt: Rechne geschickt – {{a}} · {{b}}.
    params: { placeholder: "Ergebnis" }
    answer: { value: "{{a * b}}" }
    hints:
      - "Das ist ({{(a + b) / 2}} + {{(b - a) / 2}})({{(a + b) / 2}} − {{(b - a) / 2}})."
    explanation: "{{(a + b) / 2}}² − {{(b - a) / 2}}² = {{a * b}}."
    variants:
      params: { m: "choice[20,30,40,50]", d: "int[1,4]" }
      derive: { a: "m - d", b: "m + d" }
      defaults: { m: 20, d: 1 }

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: $(a + b)^2 = a^2 + b^2$
          right: false
          why: Es fehlt 2ab – die zwei Rechtecke.
        - text: $(x - 3)^2 = x^2 - 6x + 9$
          right: true
        - text: $(x + 4)(x - 4) = x^2 - 16$
          right: true
        - text: $(x - 5)^2 = x^2 - 25$
          right: false
          why: "Richtig: x² − 10x + 25."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "Rechne geschickt: $103^2$"
    answer:
      value: 10609
    hints:
      - (100 + 3)² = 100² + 2 · 100 · 3 + 3².
    explanation: 10 000 + 600 + 9 = 10 609.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: expression
    prompt: "Faktorisiere: $x^2 - 14x + 49$"
    params:
      variables:
        - x
    answer:
      equivalentTo: (x - 7)^2
      form: factored
    hints:
      - 49 = 7² und 14 = 2 · 7. Welche binomische Formel passt?
    explanation: "Die zweite Formel rückwärts: (x − 7)²."
    difficulty: 3

srs:
  cards_from: [ausmultiplizieren, kopfrechnen]
