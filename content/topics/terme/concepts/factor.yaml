id: alg.terms.factor
type: concept
title: Ausklammern
summary: Das Gemeinsame nach vorn.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: gemeinsam
    widget: choice
    prompt: Was steckt in 6x + 9 in beiden Summanden?
    params:
      layout: grid
      options:
        - { label: "3", correct: true }
        - { label: "x", feedback: "In der 9 steckt kein x." }
        - { label: "6", feedback: "9 ist nicht durch 6 teilbar." }
    hints:
      - Welche Zahl teilt 6 und 9?
    explanation: 6x + 9 = 3 · (2x + 3).

  - kind: explain
    body: |
      **Ausklammern** ist Ausmultiplizieren rückwärts. Man sucht, was in jedem Summanden steckt, und stellt es vor die Klammer.
      4x + 8 = 4 · (x + 2).

  - kind: problem
    id: klammern
    widget: expression
    prompt: Klammere aus – ${{a}}x + {{a * b}}$.
    params: { variables: [x] }
    answer: { equivalentTo: "{{a}}(x + {{b}})", form: factored }
    hints:
      - "{{a}} steckt in beiden Teilen."
    explanation: "{{a}} · (x + {{b}})."
    variants:
      params: { a: "int[2,7]", b: "int[2,9]" }
      defaults: { a: 4, b: 3 }

  - kind: problem
    id: x-ausklammern
    widget: choice
    prompt: Wie lautet x² + 5x ausgeklammert?
    params:
      options:
        - { label: "x · (x + 5)", correct: true }
        - { label: "x · (x + 5x)", feedback: "Dann hätte man x² + 5x² – zu viel." }
        - { label: "5 · (x² + x)", feedback: "Im x² steckt keine 5." }
    hints:
      - Beide Summanden enthalten ein x.
    explanation: x · x + x · 5 = x² + 5x.

srs:
  cards_from: [gemeinsam, klammern]
