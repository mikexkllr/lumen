id: alg.terms.factor
type: concept
title: Ausklammern
summary: Das Gemeinsame nach vorn.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Zahlen als Rechtecke
    body: Ein Fliesenleger hat 24 Fliesen. Er kann sie als 4 · 6 oder 3 · 8 verlegen. Zieh das Rechteck und finde Seiten mit genau 24 Kästchen. Jede Lösung schreibt die Zahl als **Produkt** – wie beim Ausklammern.
    visual:
      widget: rect
      interactive: true
      params:
        maxW: 12
        maxH: 8
        w: 2
        h: 2
        show:
          - area

  - kind: problem
    id: gemeinsam
    widget: choice
    prompt: Was steckt in 6x + 9 in beiden Summanden?
    params:
      layout: grid
      options:
        - { label: "3", correct: true }
        - { label: "x", feedback: "In der 9 steckt kein x." }
        - { label: "6", feedback: "9 ist nicht durch 6 teilbar." }
    hints:
      - Welche Zahl teilt 6 und 9?
    explanation: 6x + 9 = 3 · (2x + 3).

  - kind: explain
    id: s2
    body: |
      **Ausklammern** ist Ausmultiplizieren rückwärts. Man sucht, was in jedem Summanden steckt, und stellt es vor die Klammer.
      4x + 8 = 4 · (x + 2).

  - kind: problem
    id: klammern
    widget: expression
    prompt: Klammere aus – ${{a}}x + {{a * b}}$.
    params: { variables: [x] }
    answer: { equivalentTo: "{{a}}(x + {{b}})", form: factored }
    hints:
      - "{{a}} steckt in beiden Teilen."
    explanation: "{{a}} · (x + {{b}})."
    variants:
      params: { a: "int[2,7]", b: "int[2,9]" }
      defaults: { a: 4, b: 3 }

  - kind: problem
    id: x-ausklammern
    widget: choice
    prompt: Wie lautet x² + 5x ausgeklammert?
    params:
      options:
        - { label: "x · (x + 5)", correct: true }
        - { label: "x · (x + 5x)", feedback: "Dann hätte man x² + 5x² – zu viel." }
        - { label: "5 · (x² + x)", feedback: "Im x² steckt keine 5." }
    hints:
      - Beide Summanden enthalten ein x.
    explanation: x · x + x · 5 = x² + 5x.

  - kind: problem
    id: intro-c1
    widget: balance
    prompt: Links liegen 3 Kisten und 3 Gewichte – das sind drei Päckchen $(x + 1)$. Rechts liegen 15 Gewichte. Bring eine Kiste x allein auf die Waage.
    params:
      left:
        x: 3
        units: 3
      right:
        x: 0
        units: 15
      allow:
        - remove_unit
        - remove_x
        - divide
    feedback:
      - when: "!state.balanced"
        misconception: only-one-side
        text: Die Waage kippt. Verändere immer beide Seiten gleich.
    hints:
      - In jedem Summanden links steckt die 3. Teile beide Seiten durch 3.
      - Dann bleibt $x + 1 = 5$. Nimm auf beiden Seiten ein Gewicht weg.
    explanation: $3x + 3 = 3 \cdot (x + 1) = 15$ → $x + 1 = 5$ → $x = 4$.

  - kind: problem
    id: d1
    depth: 2
    widget: expression
    prompt: "Klammere so viel wie möglich aus: $12x^2 + 18x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 6x(2x + 3)
      form: factored
    hints:
      - Der ggT von 12 und 18 ist 6. Und beide Glieder enthalten x.
    explanation: 6x · 2x = 12x² und 6x · 3 = 18x.
    difficulty: 2

  - kind: problem
    id: ma-d1
    depth: 2
    widget: expression
    prompt: "Klammere aus: $15x - 10$"
    params:
      variables:
        - x
    answer:
      equivalentTo: 5(3x - 2)
      form: factored
    hints:
      - Welche Zahl steckt in 15 und in 10?
      - 15x = 5 · 3x und 10 = 5 · 2.
    explanation: "$15x - 10 = 5(3x - 2)$. Probe: ausmultiplizieren ergibt wieder $15x - 10$."
    difficulty: 2

  - kind: problem
    id: ma-d2
    depth: 2
    widget: numeric
    prompt: "Rechne geschickt: 37 · 23 + 37 · 77"
    answer:
      value: 3700
    hints:
      - 37 steckt in beiden Summanden.
      - 37 · (23 + 77).
    explanation: 37 · 100 = 3700. Ausklammern spart hier zwei schwere Malaufgaben.
    difficulty: 2

  - kind: problem
    id: ma-d3
    depth: 2
    widget: choice
    prompt: Was ist der größte gemeinsame Faktor von $8x^2$ und $12x$?
    params:
      options:
        - label: "4"
          feedback: Auch ein x steckt in beiden.
        - label: 4x
          correct: true
        - label: 2x
          feedback: 4 teilt 8 und 12 – es geht größer.
        - label: $4x^2$
          feedback: In 12x steckt nur ein x.
    hints:
      - ggT von 8 und 12?
      - Wie oft steckt x mindestens drin?
    explanation: "ggT(8, 12) = 4 und ein x in beiden: 4x. Also $8x^2 + 12x = 4x(2x + 3)$."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Rechne geschickt durch Ausklammern: $x^2 + 5x$ für $x = 95$."
    answer:
      value: 9500
    hints:
      - x(x + 5) = 95 · 100.
    explanation: Ausklammern macht aus zwei schweren Rechnungen eine leichte.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was haben Ausklammern und Ausmultiplizieren miteinander zu tun?"
    params:
      keywords:
        - - umkehr
          - rückwärts
          - gegenteil
          - reverse
          - inverse
          - opposite
          - undo
        - - gemeinsam
          - common
          - shared
          - faktor
          - factor
        - - klammer
          - bracket
          - parenthes
      sample: Ausklammern ist Ausmultiplizieren rückwärts. Man zieht den gemeinsamen Faktor vor die Klammer – beim Ausmultiplizieren verteilt man ihn wieder.
    difficulty: 3

  - kind: explain
    id: ma-x1
    depth: 3
    body: "Ausklammern hilft beim Lösen. Ist ein **Produkt** null, muss einer der Faktoren null sein. Aus $x(x - 5) = 0$ folgt: x = 0 oder x = 5."

  - kind: problem
    id: ma-x2
    depth: 3
    widget: numeric
    prompt: Löse $x^2 = 7x$. Eine Lösung ist 0. Welche ist die andere?
    answer:
      value: 7
    hints:
      - "Bring alles auf eine Seite: $x^2 - 7x = 0$."
      - "Klammere x aus: $x(x - 7) = 0$."
    explanation: $x(x - 7) = 0$ heißt x = 0 oder x = 7. Wer einfach durch x teilt, verliert die Lösung 0!
    difficulty: 3

  - kind: problem
    id: ma-x3
    depth: 3
    widget: expression
    prompt: "Faktorisiere vollständig: $x^3 - x$"
    params:
      variables:
        - x
    answer:
      equivalentTo: x(x - 1)(x + 1)
      form: factored
    hints:
      - Klammere erst x aus.
      - $x^2 - 1$ ist eine dritte binomische Formel.
    explanation: $x^3 - x = x(x^2 - 1) = x(x - 1)(x + 1)$ – drei aufeinanderfolgende Zahlen. Darum ist $x^3 - x$ immer durch 6 teilbar.
    difficulty: 3

srs:
  cards_from: [gemeinsam, klammern]
