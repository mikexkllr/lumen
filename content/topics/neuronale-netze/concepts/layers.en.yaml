id: ai.neural.layers
type: concept
title: Hidden Layers
summary: Why networks need to be deep.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 8
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Layer upon layer
    body: "Face recognition, translation, chess: behind them are networks with many **layers**. Uncover the stages: what does each layer of an image network recognise?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🔲
            front: Pixels
            back: The first layer sees only brightness – number by number.
          - icon: 📐
            front: Edges
            back: The next layer finds lines and edges.
          - icon: 👁️
            front: Shapes
            back: Further up, these become eyes, ears and wheels.
          - icon: 🐱
            front: Things
            back: "At the very top is the answer: this is a cat."

  - kind: problem
    id: unmoeglich
    widget: choice
    visual:
      widget: slider
      interactive: true
      params:
        expr: "m*x + b"
        x: [-4, 4]
        y: [-4, 4]
        showCoordinates: false
        sliders:
          - { id: m, label: Slope, min: -3, max: 3, step: 0.25, initial: 0.5 }
          - { id: b, label: Height, min: -3, max: 3, step: 0.5, initial: 0 }
        markers:
          - { x: -2, y: 2, group: a }
          - { x: 2, y: -2, group: a }
          - { x: 2, y: 2, group: b }
          - { x: -2, y: -2, group: b }
    prompt: Try it out. Is there a line that separates blue from orange?
    params:
      options:
        - { label: No – not a single one, correct: true }
        - { label: "Yes", feedback: "Keep trying – every line leaves a point on the wrong side." }
    hints:
      - Blue is diagonal, and so is orange.
    explanation: This pattern is called **XOR**. A single neuron cannot handle it.

  - kind: explain
    id: s2
    body: |
      The solution: a **hidden layer**. Two neurons each draw a line, and a third combines them. More layers allow ever finer shapes.

  - kind: problem
    id: xor
    widget: gates
    prompt: Build XOR from two hidden neurons and an AND at the output.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: h1, type: "?", in: [A, B], options: [OR, AND] }
        - { id: h2, type: "?", in: [A, B], options: [NAND, NOR] }
        - { id: g, type: AND, in: [h1, h2] }
      outputs: [{ id: Q, from: g, label: XOR }]
    check: { predicate: "table('Q') == [0, 1, 1, 0]" }
    hints:
      - XOR means at least one, but not both.
    explanation: “At least one” (OR) and “not both” (NAND) – together they make XOR.

  - kind: problem
    id: gewichte
    widget: numeric
    prompt: A network has {{a}} inputs, {{h}} hidden neurons, and 1 output. Each layer is fully connected. How many weights are there?
    params: { unit: weights }
    answer: { value: "{{a * h + h}}" }
    hints:
      - "Inputs to hidden: {{a}} · {{h}}. Hidden to output: {{h}}."
    explanation: "{{a * h}} + {{h}} = {{a * h + h}}. Large language models have billions of them."
    variants:
      params: { a: "int[2,6]", h: "int[3,8]" }
      defaults: { a: 3, h: 4 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A network has 784 inputs (an image of 28 × 28 pixels), a hidden layer of 100 neurons and 10 outputs. How many weights does it have – without biases?
    answer:
      value: 79400
    hints:
      - 784 · 100 + 100 · 10.
    explanation: 78,400 + 1000 = 79,400. Even this tiny network recognises handwritten digits at 97%.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: A network has {{a}} inputs, {{h}} hidden neurons and {{o}} outputs, fully connected. Every neuron has a bias. How many parameters is that?
    answer:
      value: "{{a * h + h + h * o + o}}"
    feedback:
      - when: numval(state.input) == a * h + h * o
        misconception: no-bias
        text: "The biases are missing: one per hidden and per output neuron."
    hints:
      - "Weights: {{a}} · {{h}} + {{h}} · {{o}}."
      - "Biases: {{h}} + {{o}}."
    explanation: "{{a * h + h * o}} weights + {{h + o}} biases = {{a * h + h + h * o + o}}. Large models have billions of parameters like this – all adjusted in training."
    difficulty: 2
    variants:
      params:
        a: int[2,8]
        h: int[3,10]
        o: int[1,4]
      defaults:
        a: 4
        h: 5
        o: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: A network of ReLU neurons draws a curve. What does it look like close up?
    params:
      options:
        - label: Like many straight pieces with kinks – more neurons, more kinks.
          correct: true
        - label: Perfectly smooth.
          feedback: ReLU itself has a kink at 0. Sums of it are piecewise straight.
        - label: Like one single line.
          feedback: That would be without activation – ReLU creates kinks.
    hints:
      - ReLU is 0 on the left and a straight line on the right.
      - What do you get when adding many shifted ReLUs?
    explanation: Each ReLU neuron adds a kink. With enough kinks any reasonable curve can be approximated – like a polygon approximates a circle.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "A theorem says: even **one** hidden layer can approximate any reasonable function arbitrarily well. Why build deep networks anyway?"
    params:
      options:
        - label: One layer would often need absurdly many neurons for that – depth is far more economical
          correct: true
        - label: The theorem is false
          feedback: It is proven.
        - label: Deep networks look more impressive
          feedback: The reason is efficiency.
    hints:
      - "Edges → shapes → objects: levels build on each other."
    explanation: Depth allows reuse of intermediate results – like functions in programming.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: teach
    prompt: Explain to Lux why a network needs hidden layers to learn XOR.
    params:
      keywords:
        - - gerade
          - linie
          - line
        - - xor
          - entweder
        - - schicht
          - versteckt
          - kombinier
          - layer
          - hidden
          - combin
      sample: A single neuron draws only one line, and no line separates the XOR points. In a hidden layer two neurons each draw a line, and a third combines them.
    difficulty: 3

srs:
  cards_from: [xor, gewichte]
