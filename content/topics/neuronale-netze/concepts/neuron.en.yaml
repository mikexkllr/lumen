id: ai.neural.neuron
type: concept
title: An Artificial Neuron
summary: Weigh, add, decide.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: summe
    widget: numeric
    body: A neuron multiplies each input by its weight and adds everything up. If the sum is greater than 0, it “fires.”
    prompt: Inputs 2 and 3, weights 0.5 and −1. What is the sum?
    params: { placeholder: "Sum" }
    answer: { value: -2 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: sign
        text: The weight −1 is negative. 3 · (−1) gives −3.
    hints:
      - "Calculate 2 · 0.5 and 3 · (−1)."
    explanation: 1 + (−3) = −2.

  - kind: explain
    id: s2
    body: |
      A **neuron** weights its inputs. A large weight means this input matters.
      A negative weight holds back. The sum decides whether it fires.

  - kind: problem
    id: feuert
    widget: choice
    prompt: Does the neuron from before fire?
    params:
      options:
        - { label: "No, −2 is not greater than 0.", correct: true }
        - { label: "Yes, it has inputs, after all.", feedback: "Inputs alone are not enough. The sum is what counts." }
    hints:
      - Compare the sum with 0.
    explanation: The sum is negative – the neuron stays silent.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Inputs {{x}} and {{y}}, weights {{a}} and {{b}}. What is the weighted sum?
    params: { placeholder: "Sum" }
    answer: { value: "{{x * a + y * b}}" }
    feedback:
      - when: "numval(state.input) == x + y"
        misconception: ignore-weights
        text: Multiply each input by its weight.
    hints:
      - "{{x}} · {{a}} plus {{y}} · {{b}}."
    explanation: "{{x}} · {{a}} + {{y}} · {{b}} = {{x * a + y * b}}."
    variants:
      params: { x: "int[1,5]", y: "int[1,5]", a: "choice[-2,-1,2,3]", b: "choice[-3,-1,1,2]" }
      constraints: ["x * a + y * b != x + y"]
      defaults: { x: 4, y: 2, a: 2, b: -3 }

  - kind: problem
    id: und-neuron
    widget: choice
    prompt: A neuron has two inputs (0 or 1) with weight 1. At what threshold does it behave like an AND?
    params:
      options:
        - { label: "It fires only when the sum is above 1.5.", correct: true }
        - { label: "It fires when the sum is above 0.5.", feedback: "Then a single 1 is enough. That would be an OR." }
        - { label: "It fires when the sum is above 2.5.", feedback: "Then it never fires – the sum cannot exceed 2." }
    hints:
      - The possible sums are 0, 1, and 2.
    explanation: Only 1 + 1 = 2 exceeds the threshold 1.5. That is AND.

  - kind: explain
    id: s6
    body: How many such neurons are in a large language model?
    reveal:
      body: It has billions of weights. But each single neuron calculates only as simply as here – the sheer quantity makes the difference.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A **ReLU** activation outputs the sum if it is positive, otherwise 0. Inputs 3 and 2, weights 1 and −2, bias +0.5. What does the neuron output?
    answer:
      value: 0
    hints:
      - 3 · 1 + 2 · (−2) + 0.5.
    explanation: The sum is −0.5 – so 0. ReLU is the most common activation in modern networks.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "A ReLU neuron: inputs {{x}} and {{y}}, weights {{a}} and −1, bias {{b}}. Output = max(0, sum). What does it output?"
    answer:
      value: "{{max(0, x * a - y + b)}}"
    feedback:
      - when: x * a - y + b < 0 && numval(state.input) == x * a - y + b
        misconception: relu-negative
        text: The sum is negative – ReLU turns it into 0.
    hints:
      - "Sum: {{x}} · {{a}} + {{y}} · (−1) + {{b}}."
      - The sum is {{x * a - y + b}}. If it is negative, the output is 0.
    explanation: Sum {{x * a - y + b}}, output {{max(0, x * a - y + b)}}. ReLU lets positive values through and cuts off negative ones – simple and fast.
    difficulty: 2
    variants:
      params:
        x: int[1,5]
        y: int[1,9]
        a: int[1,3]
        b: int[-3,3]
      constraints:
        - x * a - y + b != 0
      defaults:
        x: 3
        y: 4
        a: 2
        b: 1

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Two inputs (0 or 1), both with weight 1. Which threshold makes the neuron act like an OR?
    params:
      options:
        - label: It fires when the sum is above 0.5.
          correct: true
        - label: It fires when the sum is above 1.5.
          feedback: Then it fires only when both are on – that is AND.
        - label: It fires when the sum is above 2.5.
          feedback: The sum is at most 2 – it never fires.
    hints:
      - OR should fire as soon as at least one input is 1.
      - Then the sum is at least 1.
    explanation: "Threshold 0.5: a sum of 0 stays silent, 1 or 2 fires. The same weights give OR or AND depending on the threshold."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: What happens if all activation functions are removed from a deep network?
    params:
      options:
        - label: The whole network is just a single linear computation – like one neuron
          correct: true
        - label: It gets faster and better
          feedback: It loses all its expressive power.
        - label: Nothing changes
          feedback: Without non-linearity layers achieve nothing.
    hints:
      - A straight line plugged into a straight line gives a straight line again.
    explanation: Only the “kink” of the activation allows curved boundaries. Depth without non-linearity is useless.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: The sigmoid σ(z) = 1 / (1 + e⁻ᶻ) is almost flat for large |z|. What problem does that cause in learning?
    params:
      options:
        - label: The slope is nearly 0 – the neuron barely gets any learning signal.
          correct: true
        - label: The output becomes infinitely large.
          feedback: Sigmoid always stays between 0 and 1.
        - label: None – flat is stable.
          feedback: Stable, yes, but then the weight hardly changes.
    hints:
      - Weights change in proportion to the slope.
      - How steep is an almost horizontal curve?
    explanation: The sigmoid's slope is at most 0.25 and nearly 0 far out. Over many layers the signal vanishes. ReLU has slope 1 for positive values – one reason it took over.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what an artificial neuron computes.
    params:
      keywords:
        - - gewicht
          - weight
        - - summe
          - addier
          - sum
          - add
        - - schwelle
          - aktivier
          - feuer
          - bias
          - threshold
          - activat
          - fire
      sample: A neuron multiplies each input by a weight and adds them up, plus a bias. An activation then decides what comes out – such as whether it fires.
    difficulty: 3

srs:
  cards_from: [rechnen, und-neuron]
