id: ai.neural.boundary
type: concept
title: Die Entscheidungsgrenze
summary: Ein Neuron zieht eine Gerade.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: trennen
    widget: slider
    prompt: Stelle die Gerade so ein, dass alle blauen Punkte über ihr liegen und alle orangen darunter.
    params:
      expr: "m*x + b"
      x: [-4, 4]
      y: [-3, 5]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: -2, max: 2, step: 0.25, initial: 1 }
        - { id: b, label: Höhe, min: -3, max: 3, step: 0.5, initial: -2 }
      markers:
        - { x: -2, y: 3, group: a }
        - { x: 0, y: 3, group: a }
        - { x: 2, y: 4, group: a }
        - { x: -2, y: -1, group: b }
        - { x: 1, y: 0, group: b }
        - { x: 3, y: 1, group: b }
    check: { predicate: "3 > -2 * m + b && 3 > b && 4 > 2 * m + b && -1 < -2 * m + b && 0 < m + b && 1 < 3 * m + b" }
    hints:
      - Eine flache Gerade in mittlerer Höhe klappt hier.
    explanation: Zum Beispiel y = 1,5. Alles Blaue liegt darüber, alles Orange darunter.

  - kind: explain
    id: s2
    body: |
      Ein Neuron mit zwei Eingaben zieht eine **Gerade** durch die Ebene. Auf der einen Seite feuert es, auf der anderen nicht.
      **Lernen** heißt – die Gewichte so drehen, dass die Gerade gut trennt.

  - kind: problem
    id: schraeg
    widget: slider
    prompt: Neue Daten. Diesmal brauchst du eine Steigung.
    params:
      expr: "m*x + b"
      x: [-4, 4]
      y: [-3, 5]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: -2, max: 2, step: 0.25, initial: 0 }
        - { id: b, label: Höhe, min: -3, max: 3, step: 0.5, initial: 0 }
      markers:
        - { x: -3, y: -1, group: a }
        - { x: -1, y: 1, group: a }
        - { x: 1, y: 3, group: a }
        - { x: -1, y: -2, group: b }
        - { x: 1, y: 0, group: b }
        - { x: 3, y: 1, group: b }
    check: { predicate: "-1 > -3 * m + b && 1 > -m + b && 3 > m + b && -2 < -m + b && 0 < m + b && 1 < 3 * m + b" }
    hints:
      - Die blauen Punkte steigen nach rechts an. Die Gerade sollte das auch tun.
    explanation: Zum Beispiel y = x + 0,5 trennt beide Gruppen.

  - kind: problem
    id: xor
    widget: choice
    prompt: Welches Muster kann ein einzelnes Neuron NICHT trennen?
    params:
      options:
        - { label: "Ein Schachbrett – blau oben links und unten rechts", correct: true }
        - { label: "Blau links, orange rechts", feedback: "Das trennt eine senkrechte Gerade." }
        - { label: "Blau oben, orange unten", feedback: "Das trennt eine waagerechte Gerade." }
    hints:
      - Versuch im Kopf, eine einzige Gerade durch ein Schachbrett zu legen.
    explanation: Das Schachbrett-Muster ist wie XOR. Keine einzelne Gerade trennt es.

  - kind: explain
    id: s5
    body: Und wie trennt man das Schachbrett?
    reveal:
      body: Mit mehreren Neuronen in Schichten. Jede Schicht zieht eigene Geraden. Zusammen entstehen beliebige Formen – das ist **Deep Learning**.

  - kind: problem
    id: c1
    widget: sim
    prompt: Dreh an den Gewichten und am Bias, bis das Neuron **alle 10 Punkte** richtig trennt.
    params:
      scene: neuron
    answer:
      correct: 10
    explanation: Zum Beispiel w₁ = 1, w₂ = 1, b = −6. Die Gewichte drehen die Gerade, der Bias verschiebt sie.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Neue Daten: Diesmal liegen die orangen Punkte **links**. Finde wieder eine perfekte Trennung."
    params:
      scene: neuron
      points:
        - x: 1
          y: 1
          label: 1
        - x: 1.5
          y: 3
          label: 1
        - x: 0.5
          y: 4.5
          label: 1
        - x: 2
          y: 5
          label: 1
        - x: 1.5
          y: 2
          label: 1
        - x: 4
          y: 1
          label: 0
        - x: 5
          y: 2.5
          label: 0
        - x: 4.5
          y: 4
          label: 0
        - x: 5.5
          y: 5
          label: 0
        - x: 3.5
          y: 3
          label: 0
    answer:
      correct: 10
    explanation: "Jetzt muss w₁ negativ sein: Je weiter rechts, desto weniger feuert das Neuron."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Bias b verschiebt die Entscheidungsgrenze. Was wäre ein Neuron **ohne** Bias?
    params:
      options:
        - label: Seine Gerade müsste immer durch den Nullpunkt gehen
          correct: true
        - label: Es könnte gar nichts trennen
          feedback: Manches schon – aber nur mit Geraden durch den Ursprung.
        - label: Es wäre genauso gut
          feedback: Viele Daten liegen nicht passend um den Nullpunkt.
    hints:
      - Setz x = 0 und y = 0 in w₁x + w₂y = 0 ein.
    explanation: "Wie das b in y = mx + b: ohne Achsenabschnitt keine frei verschiebbare Gerade."
    difficulty: 3

srs:
  cards_from: [trennen, xor]
