id: ai.neural.boundary
type: concept
title: Die Entscheidungsgrenze
summary: Ein Neuron zieht eine Gerade.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Wo die Grenze verläuft
    body: "Ein Neuron teilt die Welt in zwei Hälften: Auf der orangen Seite **feuert** es. Dreh an den Gewichten und am Bias. Wie kippt und wandert die Linie?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: neuron
        points:
          - x: 1
            y: 4.5
            label: 1
          - x: 2.5
            y: 5
            label: 1
          - x: 4
            y: 4
            label: 1
          - x: 5
            y: 5.5
            label: 1
          - x: 3
            y: 5.5
            label: 1
          - x: 1
            y: 1
            label: 0
          - x: 2
            y: 2
            label: 0
          - x: 3.5
            y: 1
            label: 0
          - x: 5
            y: 1.5
            label: 0
          - x: 4.5
            y: 2.5
            label: 0

  - kind: problem
    id: trennen
    widget: slider
    prompt: Stelle die Gerade so ein, dass alle blauen Punkte über ihr liegen und alle orangen darunter.
    params:
      expr: "m*x + b"
      x: [-4, 4]
      y: [-3, 5]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: -2, max: 2, step: 0.25, initial: 1 }
        - { id: b, label: Höhe, min: -3, max: 3, step: 0.5, initial: -2 }
      markers:
        - { x: -2, y: 3, group: a }
        - { x: 0, y: 3, group: a }
        - { x: 2, y: 4, group: a }
        - { x: -2, y: -1, group: b }
        - { x: 1, y: 0, group: b }
        - { x: 3, y: 1, group: b }
    check: { predicate: "3 > -2 * m + b && 3 > b && 4 > 2 * m + b && -1 < -2 * m + b && 0 < m + b && 1 < 3 * m + b" }
    hints:
      - Eine flache Gerade in mittlerer Höhe klappt hier.
    explanation: Zum Beispiel y = 1,5. Alles Blaue liegt darüber, alles Orange darunter.

  - kind: explain
    id: s2
    body: |
      Ein Neuron mit zwei Eingaben zieht eine **Gerade** durch die Ebene. Auf der einen Seite feuert es, auf der anderen nicht.
      **Lernen** heißt – die Gewichte so drehen, dass die Gerade gut trennt.

  - kind: problem
    id: schraeg
    widget: slider
    prompt: Neue Daten. Diesmal brauchst du eine Steigung.
    params:
      expr: "m*x + b"
      x: [-4, 4]
      y: [-3, 5]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: -2, max: 2, step: 0.25, initial: 0 }
        - { id: b, label: Höhe, min: -3, max: 3, step: 0.5, initial: 0 }
      markers:
        - { x: -3, y: -1, group: a }
        - { x: -1, y: 1, group: a }
        - { x: 1, y: 3, group: a }
        - { x: -1, y: -2, group: b }
        - { x: 1, y: 0, group: b }
        - { x: 3, y: 1, group: b }
    check: { predicate: "-1 > -3 * m + b && 1 > -m + b && 3 > m + b && -2 < -m + b && 0 < m + b && 1 < 3 * m + b" }
    hints:
      - Die blauen Punkte steigen nach rechts an. Die Gerade sollte das auch tun.
    explanation: Zum Beispiel y = x + 0,5 trennt beide Gruppen.

  - kind: problem
    id: xor
    widget: choice
    prompt: Welches Muster kann ein einzelnes Neuron NICHT trennen?
    params:
      options:
        - { label: "Ein Schachbrett – blau oben links und unten rechts", correct: true }
        - { label: "Blau links, orange rechts", feedback: "Das trennt eine senkrechte Gerade." }
        - { label: "Blau oben, orange unten", feedback: "Das trennt eine waagerechte Gerade." }
    hints:
      - Versuch im Kopf, eine einzige Gerade durch ein Schachbrett zu legen.
    explanation: Das Schachbrett-Muster ist wie XOR. Keine einzelne Gerade trennt es.

  - kind: explain
    id: s5
    body: Und wie trennt man das Schachbrett?
    reveal:
      body: Mit mehreren Neuronen in Schichten. Jede Schicht zieht eigene Geraden. Zusammen entstehen beliebige Formen – das ist **Deep Learning**.

  - kind: problem
    id: c1
    widget: sim
    prompt: Dreh an den Gewichten und am Bias, bis das Neuron **alle 10 Punkte** richtig trennt.
    params:
      scene: neuron
    answer:
      correct: 10
    explanation: Zum Beispiel w₁ = 1, w₂ = 1, b = −6. Die Gewichte drehen die Gerade, der Bias verschiebt sie.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Neue Daten: Diesmal liegen die orangen Punkte **links**. Finde wieder eine perfekte Trennung."
    params:
      scene: neuron
      points:
        - x: 1
          y: 1
          label: 1
        - x: 1.5
          y: 3
          label: 1
        - x: 0.5
          y: 4.5
          label: 1
        - x: 2
          y: 5
          label: 1
        - x: 1.5
          y: 2
          label: 1
        - x: 4
          y: 1
          label: 0
        - x: 5
          y: 2.5
          label: 0
        - x: 4.5
          y: 4
          label: 0
        - x: 5.5
          y: 5
          label: 0
        - x: 3.5
          y: 3
          label: 0
    answer:
      correct: 10
    explanation: "Jetzt muss w₁ negativ sein: Je weiter rechts, desto weniger feuert das Neuron."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: sim
    prompt: Diesmal liegen die blauen Punkte links oben, die orangen rechts unten. Trenne alle 10 – die Grenze muss schräg liegen.
    params:
      scene: neuron
      points:
        - x: 1
          y: 3
          label: 1
        - x: 2
          y: 4
          label: 1
        - x: 1
          y: 2
          label: 1
        - x: 3
          y: 5
          label: 1
        - x: 0.5
          y: 4
          label: 1
        - x: 3
          y: 1
          label: 0
        - x: 4
          y: 2
          label: 0
        - x: 2
          y: 1
          label: 0
        - x: 5
          y: 3
          label: 0
        - x: 4
          y: 0.5
          label: 0
    answer:
      correct: 10
    hints:
      - Die Grenze ist etwa die Gerade y = x.
      - Probiere w₁ = −1, w₂ = 1 und b = 0.
    explanation: "−x + y > 0 heißt y > x: Alles über der Diagonale feuert. Die Gewichte geben die **Richtung** der Grenze an, der Bias ihre Lage."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Perzeptron-Regel: w ← w + η · (Soll − Ist) · x. Es gilt w₁ = 1, x₁ = 2, η = 0,5. Soll war 1, das Neuron gab 0. Wie lautet das neue w₁?"
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: sign
        text: "Falsches Vorzeichen: Das Neuron soll stärker feuern, das Gewicht muss wachsen."
    hints:
      - Soll − Ist = 1 − 0 = 1.
      - 1 + 0,5 · 1 · 2 = ?
    explanation: w₁ = 1 + 0,5 · 1 · 2 = 2. Bei einem Fehler wird jedes Gewicht in Richtung seiner Eingabe verschoben. Stimmt die Antwort, ändert sich nichts. Das ist die **Perzeptron-Regel**.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Bias b verschiebt die Entscheidungsgrenze. Was wäre ein Neuron **ohne** Bias?
    params:
      options:
        - label: Seine Gerade müsste immer durch den Nullpunkt gehen
          correct: true
        - label: Es könnte gar nichts trennen
          feedback: Manches schon – aber nur mit Geraden durch den Ursprung.
        - label: Es wäre genauso gut
          feedback: Viele Daten liegen nicht passend um den Nullpunkt.
    hints:
      - Setz x = 0 und y = 0 in w₁x + w₂y = 0 ein.
    explanation: "Wie das b in y = mx + b: ohne Achsenabschnitt keine frei verschiebbare Gerade."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Was weiß man über die Perzeptron-Regel?
    params:
      options:
        - label: Sind die Daten durch eine Gerade trennbar, findet sie nach endlich vielen Fehlern eine Trennung.
          correct: true
        - label: Sie findet für jede Datenmenge eine perfekte Trennung.
          feedback: Bei XOR gibt es keine Gerade – dann pendelt sie ewig.
        - label: Sie braucht immer genau so viele Schritte, wie es Punkte gibt.
          feedback: Die Zahl der Schritte hängt vom Abstand der Klassen ab.
    hints:
      - "Denk an XOR: Gibt es dort überhaupt eine Lösung?"
      - Wo es eine Lösung gibt, ist das Verfahren garantiert erfolgreich.
    explanation: Das ist der **Konvergenzsatz** des Perzeptrons. Ohne Trennbarkeit hilft er nicht. Das zeigte die Grenzen einzelner Neuronen und führte zu Netzen mit versteckten Schichten.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie die Gewichte und der Bias die Entscheidungsgrenze eines Neurons verändern.
    params:
      keywords:
        - - gewicht
          - weight
        - - dreh
          - richtung
          - neig
          - rotat
          - direction
          - tilt
        - - bias
          - verschieb
          - shift
          - move
      sample: Das Neuron zieht eine Gerade durch die Ebene. Die Gewichte drehen die Gerade und bestimmen ihre Richtung. Der Bias verschiebt sie, ohne sie zu drehen.
    difficulty: 3

srs:
  cards_from: [trennen, xor]
