id: ai.neural.neuron
type: concept
title: Ein künstliches Neuron
summary: Gewichten, addieren, entscheiden.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Die Zelle, die rechnet
    body: "Dein Gehirn hat rund 86 Milliarden Nervenzellen. Ein künstliches **Neuron** ahmt eine davon nach – mit ganz einfacher Rechnung. Deck die Stationen auf: Wie wird aus Signalen eine Entscheidung?"
    visual:
      widget: flip
      interactive: true
      params:
        layout: flow
        cards:
          - icon: 🧠
            front: Das Vorbild
            back: Eine Nervenzelle sammelt Signale von Tausenden Nachbarn.
          - icon: ⚖️
            front: Gewichte
            back: Manche Signale zählen viel, manche wenig, manche bremsen sogar.
          - icon: ➕
            front: Die Summe
            back: Alles zusammen ergibt eine einzige Zahl.
          - icon: ⚡
            front: Feuern
            back: Ist die Zahl groß genug, schickt die Zelle ein Signal weiter.

  - kind: problem
    id: summe
    widget: numeric
    body: Ein Neuron nimmt jede Eingabe mal ihr Gewicht und addiert alles. Ist die Summe größer als 0, »feuert« es.
    prompt: Eingaben 2 und 3, Gewichte 0,5 und −1. Wie groß ist die Summe?
    params: { placeholder: "Summe" }
    answer: { value: -2 }
    feedback:
      - when: "numval(state.input) == 4"
        misconception: sign
        text: Das Gewicht −1 ist negativ. 3 · (−1) ergibt −3.
    hints:
      - "Rechne 2 · 0,5 und 3 · (−1)."
    explanation: 1 + (−3) = −2.

  - kind: explain
    id: s2
    body: |
      Ein **Neuron** gewichtet seine Eingaben. Ein großes Gewicht heißt – das ist wichtig.
      Ein negatives Gewicht bremst. Die Summe entscheidet, ob es feuert.

  - kind: problem
    id: feuert
    widget: choice
    prompt: Feuert das Neuron von eben?
    params:
      options:
        - { label: "Nein, −2 ist nicht größer als 0.", correct: true }
        - { label: "Ja, es hat ja Eingaben.", feedback: "Eingaben allein reichen nicht. Es kommt auf die Summe an." }
    hints:
      - Vergleiche die Summe mit 0.
    explanation: Die Summe ist negativ – das Neuron bleibt still.

  - kind: problem
    id: rechnen
    widget: numeric
    prompt: Eingaben {{x}} und {{y}}, Gewichte {{a}} und {{b}}. Wie groß ist die gewichtete Summe?
    params: { placeholder: "Summe" }
    answer: { value: "{{x * a + y * b}}" }
    feedback:
      - when: "numval(state.input) == x + y"
        misconception: ignore-weights
        text: Nimm jede Eingabe mit ihrem Gewicht mal.
    hints:
      - "{{x}} · {{a}} plus {{y}} · {{b}}."
    explanation: "{{x}} · {{a}} + {{y}} · {{b}} = {{x * a + y * b}}."
    variants:
      params: { x: "int[1,5]", y: "int[1,5]", a: "choice[-2,-1,2,3]", b: "choice[-3,-1,1,2]" }
      constraints: ["x * a + y * b != x + y"]
      defaults: { x: 4, y: 2, a: 2, b: -3 }

  - kind: problem
    id: und-neuron
    widget: choice
    prompt: Ein Neuron hat zwei Eingaben (0 oder 1) mit Gewicht 1. Ab welcher Schwelle verhält es sich wie ein UND?
    params:
      options:
        - { label: "Es feuert erst bei einer Summe über 1,5.", correct: true }
        - { label: "Es feuert bei einer Summe über 0,5.", feedback: "Dann reicht schon eine 1. Das wäre ein ODER." }
        - { label: "Es feuert bei einer Summe über 2,5.", feedback: "Dann feuert es nie – mehr als 2 geht nicht." }
    hints:
      - Mögliche Summen sind 0, 1 und 2.
    explanation: Nur bei 1 + 1 = 2 wird die Schwelle 1,5 überschritten. Das ist UND.

  - kind: explain
    id: s6
    body: Wie viele solcher Neuronen steckt in einem großen Sprachmodell?
    reveal:
      body: Es hat Milliarden Gewichte. Jedes einzelne Neuron rechnet aber nur so einfach wie hier – die Menge macht den Unterschied.

  - kind: problem
    id: intro-c1
    widget: sim
    prompt: "Die vier Punkte sind die vier Fälle von UND: Nur oben rechts sind beide Eingaben an. Stell das Neuron so ein, dass es **nur dort** feuert."
    params:
      scene: neuron
      points:
        - x: 1
          y: 1
          label: 0
        - x: 1
          y: 5
          label: 0
        - x: 5
          y: 1
          label: 0
        - x: 5
          y: 5
          label: 1
    answer:
      correct: 4
    hints:
      - Die orange Fläche zeigt, wo das Neuron feuert. Nur der orange Punkt soll darin liegen.
      - Setz beide Gewichte auf 1 und schieb den Bias weit nach unten, etwa auf −6.
    explanation: "Mit w₁ = w₂ = 1 und b = −6 ist die Summe nur bei (5 | 5) positiv: 5 + 5 − 6 = 4. Bei (5 | 1) ergibt sie 0 – kein Feuern. Ein Neuron kann also UND."

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Eine **ReLU**-Aktivierung gibt die Summe aus, wenn sie positiv ist, sonst 0. Eingaben 3 und 2, Gewichte 1 und −2, Bias +0,5. Was gibt das Neuron aus?
    answer:
      value: 0
    hints:
      - 3 · 1 + 2 · (−2) + 0,5.
    explanation: Die Summe ist −0,5 – also 0. ReLU ist die häufigste Aktivierung moderner Netze.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: "Ein Neuron mit ReLU: Eingaben {{x}} und {{y}}, Gewichte {{a}} und −1, Bias {{b}}. Ausgabe = max(0, Summe). Was gibt es aus?"
    answer:
      value: "{{max(0, x * a - y + b)}}"
    feedback:
      - when: x * a - y + b < 0 && numval(state.input) == x * a - y + b
        misconception: relu-negative
        text: Die Summe ist negativ – ReLU macht daraus 0.
    hints:
      - "Summe: {{x}} · {{a}} + {{y}} · (−1) + {{b}}."
      - Die Summe ist {{x * a - y + b}}. Ist sie negativ, kommt 0 heraus.
    explanation: Summe {{x * a - y + b}}, Ausgabe {{max(0, x * a - y + b)}}. **ReLU** lässt Positives durch und schneidet Negatives ab – einfach und schnell.
    difficulty: 2
    variants:
      params:
        x: int[1,5]
        y: int[1,9]
        a: int[1,3]
        b: int[-3,3]
      constraints:
        - x * a - y + b != 0
      defaults:
        x: 3
        y: 4
        a: 2
        b: 1

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Zwei Eingaben (0 oder 1), beide mit Gewicht 1. Ab welcher Schwelle wirkt das Neuron wie ein ODER?
    params:
      options:
        - label: Es feuert ab einer Summe über 0,5.
          correct: true
        - label: Es feuert ab einer Summe über 1,5.
          feedback: Dann feuert es nur, wenn beide an sind – das ist UND.
        - label: Es feuert ab einer Summe über 2,5.
          feedback: Die Summe ist höchstens 2 – es feuert nie.
    hints:
      - ODER soll feuern, sobald mindestens ein Eingang 1 ist.
      - Dann ist die Summe mindestens 1.
    explanation: "Schwelle 0,5: Summe 0 bleibt still, Summe 1 oder 2 feuert. Dieselben Gewichte ergeben je nach **Schwelle** ODER oder UND."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Was passiert, wenn man in einem tiefen Netz alle Aktivierungsfunktionen weglässt?
    params:
      options:
        - label: Das ganze Netz ist nur noch eine einzige lineare Rechnung – wie ein Neuron
          correct: true
        - label: Es wird schneller und besser
          feedback: Es verliert seine ganze Ausdruckskraft.
        - label: Nichts ändert sich
          feedback: Ohne Nichtlinearität bringen Schichten nichts.
    hints:
      - Eine Gerade in eine Gerade eingesetzt ergibt wieder eine Gerade.
    explanation: Erst der »Knick« der Aktivierung erlaubt gekrümmte Grenzen. Tiefe ohne Nichtlinearität ist nutzlos.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Die Sigmoid-Funktion σ(z) = 1 / (1 + e⁻ᶻ) ist für große |z| fast flach. Welches Problem macht das beim Lernen?
    params:
      options:
        - label: Die Steigung ist fast 0 – das Neuron bekommt kaum noch Lernsignal.
          correct: true
        - label: Die Ausgabe wird unendlich groß.
          feedback: Sigmoid bleibt immer zwischen 0 und 1.
        - label: Gar keins – flach ist stabil.
          feedback: Stabil schon, aber das Gewicht ändert sich dann kaum.
    hints:
      - Gewichte ändern sich proportional zur Steigung.
      - Wie steil ist eine fast waagrechte Kurve?
    explanation: Die Steigung von Sigmoid ist höchstens 0,25 und weit draußen fast 0. Über viele Schichten **verschwindet** das Signal. ReLU hat für positive Werte die Steigung 1 – ein Grund, warum es sich durchgesetzt hat.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was ein künstliches Neuron rechnet.
    params:
      keywords:
        - - gewicht
          - weight
        - - summe
          - addier
          - sum
          - add
        - - schwelle
          - aktivier
          - feuer
          - bias
          - threshold
          - activat
          - fire
      sample: Ein Neuron multipliziert jede Eingabe mit einem Gewicht und bildet die Summe, dazu kommt ein Bias. Eine Aktivierung entscheidet dann, was herauskommt – etwa ob es feuert.
    difficulty: 3

srs:
  cards_from: [rechnen, und-neuron]
