id: ai.neural.overfitting
type: concept
title: Learned by Heart
summary: When a model only knows the practice data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: klausur
    widget: choice
    prompt: Someone memorizes a practice exam word for word. The real exam has new questions. What happens?
    params:
      options:
        - { label: It goes badly – nothing was understood., correct: true }
        - { label: It goes perfectly., feedback: "Memorized answers do not help with new questions." }
    hints:
      - What did the person really learn?
    explanation: This is exactly what happens to models too. It is called **overfitting**.

  - kind: explain
    body: |
      A model can memorize training data, random noise included. That is why you test it with **test data** it has never seen.

  - kind: problem
    id: luecke
    widget: numeric
    prompt: "A model scores {{tr}}% in training but only {{te}}% in the test. How big is the gap?"
    params: { unit: percentage points }
    answer: { value: "{{tr - te}}" }
    hints:
      - Subtract.
    explanation: "{{tr - te}} percentage points – a clear sign of memorizing."
    variants:
      params: { tr: "int[95,99]", te: "int[60,80]" }
      defaults: { tr: 98, te: 71 }

  - kind: problem
    id: hilft
    widget: buckets
    prompt: What helps against overfitting?
    params:
      buckets: [{ label: helps }, { label: does not help }]
      items:
        - { label: More training data, bucket: helps }
        - { label: A simpler model, bucket: helps }
        - { label: Stopping training earlier, bucket: helps }
        - { label: Training even longer, bucket: does not help }
        - { label: Training on the test data, bucket: does not help }
    hints:
      - What forces the model to find general patterns?
    explanation: If you train on the test data, it no longer measures anything – that is cheating, not a solution.

srs:
  cards_from: [klausur, hilft]
