id: ai.neural.overfitting
type: concept
title: Learned by Heart
summary: When a model only knows the practice data.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: klausur
    widget: choice
    prompt: Someone memorizes a practice exam word for word. The real exam has new questions. What happens?
    params:
      options:
        - { label: It goes badly – nothing was understood., correct: true }
        - { label: It goes perfectly., feedback: "Memorized answers do not help with new questions." }
    hints:
      - What did the person really learn?
    explanation: This is exactly what happens to models too. It is called **overfitting**.

  - kind: explain
    id: s2
    body: |
      A model can memorize training data, random noise included. That is why you test it with **test data** it has never seen.

  - kind: problem
    id: luecke
    widget: numeric
    prompt: "A model scores {{tr}}% in training but only {{te}}% in the test. How big is the gap?"
    params: { unit: percentage points }
    answer: { value: "{{tr - te}}" }
    hints:
      - Subtract.
    explanation: "{{tr - te}} percentage points – a clear sign of memorizing."
    variants:
      params: { tr: "int[95,99]", te: "int[60,80]" }
      defaults: { tr: 98, te: 71 }

  - kind: problem
    id: hilft
    widget: buckets
    prompt: What helps against overfitting?
    params:
      buckets: [{ label: helps }, { label: does not help }]
      items:
        - { label: More training data, bucket: helps }
        - { label: A simpler model, bucket: helps }
        - { label: Stopping training earlier, bucket: helps }
        - { label: Training even longer, bucket: does not help }
        - { label: Training on the test data, bucket: does not help }
    hints:
      - What forces the model to find general patterns?
    explanation: If you train on the test data, it no longer measures anything – that is cheating, not a solution.

  - kind: problem
    id: d1
    depth: 2
    widget: choice
    prompt: During training the training error keeps falling. The error on new data first falls – then rises again. When should you stop?
    params:
      options:
        - label: When the error on the new data is smallest
          correct: true
        - label: When the training error is zero
          feedback: By then the network has long been memorising.
        - label: Never
          feedback: From some point on it only gets worse.
    hints:
      - Which of the two errors counts in real use?
    explanation: "**Early stopping** – one of the simplest and most effective measures against overfitting."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Through {{n}} points with different x-values there always passes a polynomial of degree …?
    answer:
      value: "{{n - 1}}"
    feedback:
      - when: numval(state.input) == n
        misconception: off-by-one
        text: For 2 points a line, degree 1, is enough. The degree is one less.
    hints:
      - "2 points: a line (degree 1). 3 points: a parabola (degree 2)."
      - So with {{n}} points?
    explanation: "Degree {{n - 1}} hits every point exactly – noise included. Between the points the curve often swings wildly. Perfect in training does not mean good: that is overfitting."
    difficulty: 2
    variants:
      params:
        n: int[3,12]
      defaults:
        n: 6

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: In training you add a penalty for large weights ("weight decay"). What for?
    params:
      options:
        - label: Small weights give smoother functions that copy noise less.
          correct: true
        - label: So the model computes faster.
          feedback: The computing time stays the same – only the values get smaller.
        - label: So the training error falls.
          feedback: It usually rises slightly – in return the error on new data falls.
    hints:
      - Wild curves need large weights.
      - "Which matters more: training or test error?"
    explanation: This regularisation trades a little training accuracy for generalisation. More data, dropout and early stopping work in a similar way.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: "Tell Lux: how does a neural network “learn”?"
    params:
      keywords:
        - - gewicht
          - weight
        - - fehler
          - error
          - loss
        - - klein
          - verkleiner
          - senk
          - reduce
          - lower
          - smaller
          - minimi
        - - beispiel
          - daten
          - example
          - data
          - schritt
          - step
      min: 3
      sample: The network makes a prediction for an example and measures the error. Then it changes each weight a little in the direction that reduces the error – millions of times with many examples.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: Very large networks can memorise their training data – and still often generalise well. What is observed there?
    params:
      options:
        - label: The test error can fall again after a rise, as parameters keep growing.
          correct: true
        - label: Bigger networks always overfit more.
          feedback: Classically expected – but often not what happens in practice.
        - label: Large networks never make mistakes.
          feedback: They do make mistakes, just often fewer than expected.
    hints:
      - Classically the test error eventually rises with model size.
      - What happens if you go much bigger still?
    explanation: This double descent has been measured in many experiments. Why large networks generalise so well is not yet fully understood – an active research field.
    difficulty: 3

srs:
  cards_from: [klausur, hilft]
