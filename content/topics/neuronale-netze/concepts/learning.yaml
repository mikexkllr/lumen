id: ai.neural.learning
type: concept
title: Lernen heißt Fehler verkleinern
summary: Training, Fehler und Auswendiglernen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: anpassen
    widget: slider
    prompt: Stelle die Gerade so ein, dass sie genau durch alle Punkte geht.
    params:
      expr: "m*x + b"
      x: [-3, 5]
      y: [-2, 4]
      showCoordinates: false
      sliders:
        - { id: m, label: Steigung, min: -1, max: 2, step: 0.25, initial: 1.5 }
        - { id: b, label: Höhe, min: -2, max: 3, step: 0.5, initial: -1 }
      markers:
        - { x: -2, y: 0 }
        - { x: 0, y: 1 }
        - { x: 2, y: 2 }
        - { x: 4, y: 3 }
    answer: { values: { m: 0.5, b: 1 } }
    hints:
      - Wo schneidet die Gerade die y-Achse?
      - Pro Schritt nach rechts geht es einen halben nach oben.
    explanation: y = 0,5 · x + 1. Genau das macht Training – Regler drehen, bis der Fehler verschwindet.

  - kind: explain
    id: s2
    body: |
      Ein Netz lernt aus Beispielen. Es misst den **Fehler** – wie weit liegt es daneben?
      Dann dreht es jedes Gewicht ein kleines Stück so, dass der Fehler kleiner wird.

  - kind: problem
    id: fehler
    widget: numeric
    prompt: Das Modell sagt 3, 5 und 8 voraus. Richtig wären 4, 5 und 6. Wie groß ist der mittlere Fehler (ohne Vorzeichen)?
    params: { placeholder: "Fehler" }
    answer: { value: 1 }
    feedback:
      - when: "numval(state.input) == 3"
        misconception: sum-not-mean
        text: Das ist der Gesamtfehler. Teile noch durch die Zahl der Beispiele.
    hints:
      - Die Abstände sind 1, 0 und 2.
    explanation: (1 + 0 + 2) / 3 = 1.

  - kind: explain
    id: s4
    body: |
      **Überanpassung:** Ein Modell, das die Beispiele auswendig lernt, versagt bei neuen Daten.
      Darum prüft man es mit Daten, die es nie gesehen hat.

  - kind: problem
    id: auswendig
    widget: choice
    prompt: Ein Modell erkennt 100 % der Trainingsbilder, aber nur 60 % neuer Bilder. Was ist passiert?
    params:
      options:
        - { label: Es hat auswendig gelernt., correct: true }
        - { label: Die neuen Bilder sind falsch., feedback: "Möglich, aber unwahrscheinlich. Der große Abstand ist ein typisches Warnsignal." }
        - { label: Es braucht mehr Training mit denselben Bildern., feedback: "Das würde das Auswendiglernen eher verstärken." }
    hints:
      - Was bedeutet es, wenn Training und Test so weit auseinanderliegen?
    explanation: Das ist **Überanpassung**. Mehr verschiedene Daten oder ein einfacheres Modell helfen.

  - kind: problem
    id: daten
    widget: buckets
    prompt: Hilft das dem Training – oder schadet es?
    params:
      buckets: [{ label: hilft }, { label: schadet }]
      items:
        - { label: Viele verschiedene Beispiele, bucket: hilft }
        - { label: Testdaten getrennt halten, bucket: hilft }
        - { label: Beispiele aus allen Gruppen, bucket: hilft }
        - { label: Nur Fotos bei Sonnenschein, bucket: schadet }
        - { label: Falsche Beschriftungen, bucket: schadet }
        - { label: Mit den Testdaten trainieren, bucket: schadet }
    hints:
      - Was soll das Modell später können?
    explanation: Gute Daten sind vielfältig, korrekt beschriftet und vom Test getrennt.

  - kind: problem
    id: c1
    widget: sim
    prompt: Der Ball rollt den Fehlerberg hinab. Stell die Lernrate so ein, dass der Fehler nach **höchstens 5 Schritten** unter 0,01 liegt.
    params:
      scene: descent
    answer:
      loss:
        - 0
        - 0.01
      steps:
        - 0
        - 5
    explanation: Mit einer mittleren Lernrate um 0,5 ist man fast sofort im Tal. Zu klein, und es dauert ewig.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Jetzt übertreib es: Wähle 5 Schritte und eine Lernrate, bei der der Fehler **explodiert** – über 100."
    params:
      scene: descent
    answer:
      steps: 5
      loss:
        - 100
        - 1000000
    explanation: Über 1,0 springt der Ball jedes Mal weiter über das Tal hinaus – das Training **divergiert**.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: sim
    prompt: Der Fehler ist x², der Ball startet bei x = 4. Finde die Lernrate, mit der er **in einem einzigen Schritt** genau im Tal landet.
    params:
      scene: descent
    answer:
      steps: 1
      loss:
        - 0
        - 0.001
    hints:
      - Stell die Schritte auf 1. Ein Schritt rechnet x − Lernrate · 2x.
      - Für x − r · 2x = 0 muss 2r = 1 sein.
    explanation: Bei r = 0,5 springt der Ball genau auf 0. Bei x² ist das die perfekte Lernrate – bei echten Netzen kennt man sie nicht und muss sie **ausprobieren**.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: sim
    prompt: "Finde eine Lernrate, bei der der Ball ewig hin und her springt: Nach mindestens 5 Schritten soll der Fehler immer noch 16 sein."
    params:
      scene: descent
    answer:
      steps:
        - 5
        - 20
      loss:
        - 15.9
        - 16.1
    hints:
      - "16 ist der Startfehler: x = 4 oder x = −4."
      - Bei welcher Rate wird aus 4 genau −4?
    explanation: "Bei r = 1 wird x ← x − 2x = −x: Der Ball pendelt zwischen 4 und −4. Darunter schrumpft der Fehler, darüber **explodiert** er."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Wie erfährt ein Gewicht tief im Netz, in welche Richtung es sich ändern soll?
    params:
      options:
        - label: Der Fehler wird Schicht für Schicht rückwärts durchgerechnet – mit der Kettenregel
          correct: true
        - label: Jedes Gewicht wird zufällig geändert und geprüft
          feedback: Bei Milliarden Gewichten wäre das hoffnungslos langsam.
        - label: Ein Mensch stellt sie ein
          feedback: Niemand könnte Milliarden Zahlen von Hand einstellen.
    hints:
      - Der Fehler hängt über viele verkettete Funktionen von jedem Gewicht ab.
    explanation: "**Backpropagation**: Ein einziger Rückwärtsdurchlauf liefert die Steigung für alle Gewichte auf einmal."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Gradientenabstieg auf f(x) = x²: Die Steigung ist 2x. Du stehst bei x = {{x}}, die Lernrate ist 0,1. Wo stehst du nach einem Schritt?"
    answer:
      value: "{{0.8 * x}}"
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 1.2 * x
        misconception: wrong-direction
        text: Du bist bergauf gegangen. Man geht **gegen** die Steigung.
    hints:
      - "Steigung bei {{x}}: 2 · {{x}} = {{2 * x}}."
      - Neues x = {{x}} − 0,1 · {{2 * x}}.
    explanation: "{{x}} − {{0.2 * x}} = {{0.8 * x}}. Jeder Schritt multipliziert x hier mit 1 − 2 · 0,1 = 0,8. Ist dieser Faktor im Betrag größer als 1, schaukelt sich der Fehler auf."
    difficulty: 3
    variants:
      params:
        x: int[2,9]
      defaults:
        x: 4

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Erklär Lux, was die Lernrate beim Training bewirkt.
    params:
      keywords:
        - - schritt
          - step
        - - klein
          - langsam
          - small
          - slow
        - - groß
          - spring
          - explod
          - large
          - jump
          - explode
      sample: Die Lernrate bestimmt, wie groß jeder Schritt bergab ist. Zu klein, und das Lernen dauert ewig. Zu groß, und man springt über das Tal hinaus – der Fehler kann explodieren.
    difficulty: 3

srs:
  cards_from: [fehler, auswendig]
