id: ai.neural.boundary
type: concept
title: The Decision Boundary
summary: A neuron draws a line.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Where the line runs
    body: "A neuron splits the world into two halves: on the orange side, it **fires**. Turn the weights and the bias. How does the line tilt and move?"
    visual:
      widget: sim
      interactive: true
      params:
        scene: neuron
        points:
          - x: 1
            y: 4.5
            label: 1
          - x: 2.5
            y: 5
            label: 1
          - x: 4
            y: 4
            label: 1
          - x: 5
            y: 5.5
            label: 1
          - x: 3
            y: 5.5
            label: 1
          - x: 1
            y: 1
            label: 0
          - x: 2
            y: 2
            label: 0
          - x: 3.5
            y: 1
            label: 0
          - x: 5
            y: 1.5
            label: 0
          - x: 4.5
            y: 2.5
            label: 0

  - kind: problem
    id: trennen
    widget: slider
    prompt: Set the line so that all blue points lie above it and all orange points below it.
    params:
      expr: "m*x + b"
      x: [-4, 4]
      y: [-3, 5]
      showCoordinates: false
      sliders:
        - { id: m, label: Slope, min: -2, max: 2, step: 0.25, initial: 1 }
        - { id: b, label: Height, min: -3, max: 3, step: 0.5, initial: -2 }
      markers:
        - { x: -2, y: 3, group: a }
        - { x: 0, y: 3, group: a }
        - { x: 2, y: 4, group: a }
        - { x: -2, y: -1, group: b }
        - { x: 1, y: 0, group: b }
        - { x: 3, y: 1, group: b }
    check: { predicate: "3 > -2 * m + b && 3 > b && 4 > 2 * m + b && -1 < -2 * m + b && 0 < m + b && 1 < 3 * m + b" }
    hints:
      - A flat line at medium height works here.
    explanation: For example y = 1.5. Everything blue lies above it, everything orange below.

  - kind: explain
    id: s2
    body: |
      A neuron with two inputs draws a **line** through the plane. On one side it fires, on the other it does not.
      **Learning** means turning the weights so that the line separates well.

  - kind: problem
    id: schraeg
    widget: slider
    prompt: New data. This time you need a slope.
    params:
      expr: "m*x + b"
      x: [-4, 4]
      y: [-3, 5]
      showCoordinates: false
      sliders:
        - { id: m, label: Slope, min: -2, max: 2, step: 0.25, initial: 0 }
        - { id: b, label: Height, min: -3, max: 3, step: 0.5, initial: 0 }
      markers:
        - { x: -3, y: -1, group: a }
        - { x: -1, y: 1, group: a }
        - { x: 1, y: 3, group: a }
        - { x: -1, y: -2, group: b }
        - { x: 1, y: 0, group: b }
        - { x: 3, y: 1, group: b }
    check: { predicate: "-1 > -3 * m + b && 1 > -m + b && 3 > m + b && -2 < -m + b && 0 < m + b && 1 < 3 * m + b" }
    hints:
      - The blue points rise to the right. The line should do the same.
    explanation: For example, y = x + 0.5 separates both groups.

  - kind: problem
    id: xor
    widget: choice
    prompt: Which pattern can a single neuron NOT separate?
    params:
      options:
        - { label: "A checkerboard – blue at top left and bottom right", correct: true }
        - { label: "Blue on the left, orange on the right", feedback: "A vertical line separates that." }
        - { label: "Blue on top, orange on the bottom", feedback: "A horizontal line separates that." }
    hints:
      - Try to lay a single line through a checkerboard in your head.
    explanation: The checkerboard pattern is like XOR. No single line separates it.

  - kind: explain
    id: s5
    body: And how do you separate the checkerboard?
    reveal:
      body: With several neurons in layers. Each layer draws its own lines. Together they make arbitrary shapes – this is **deep learning**.

  - kind: problem
    id: c1
    widget: sim
    prompt: Turn the weights and the bias until the neuron separates **all 10 points** correctly.
    params:
      scene: neuron
    answer:
      correct: 10
    explanation: For example w₁ = 1, w₂ = 1, b = −6. The weights turn the line, the bias shifts it.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "New data: this time the orange points lie on the **left**. Find a perfect separation again."
    params:
      scene: neuron
      points:
        - x: 1
          y: 1
          label: 1
        - x: 1.5
          y: 3
          label: 1
        - x: 0.5
          y: 4.5
          label: 1
        - x: 2
          y: 5
          label: 1
        - x: 1.5
          y: 2
          label: 1
        - x: 4
          y: 1
          label: 0
        - x: 5
          y: 2.5
          label: 0
        - x: 4.5
          y: 4
          label: 0
        - x: 5.5
          y: 5
          label: 0
        - x: 3.5
          y: 3
          label: 0
    answer:
      correct: 10
    explanation: "Now w₁ must be negative: the further right, the less the neuron fires."
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: sim
    prompt: This time the blue points are top left and the orange ones bottom right. Separate all 10 – the boundary has to be diagonal.
    params:
      scene: neuron
      points:
        - x: 1
          y: 3
          label: 1
        - x: 2
          y: 4
          label: 1
        - x: 1
          y: 2
          label: 1
        - x: 3
          y: 5
          label: 1
        - x: 0.5
          y: 4
          label: 1
        - x: 3
          y: 1
          label: 0
        - x: 4
          y: 2
          label: 0
        - x: 2
          y: 1
          label: 0
        - x: 5
          y: 3
          label: 0
        - x: 4
          y: 0.5
          label: 0
    answer:
      correct: 10
    hints:
      - The boundary is roughly the line y = x.
      - Try w₁ = −1, w₂ = 1 and b = 0.
    explanation: "−x + y > 0 means y > x: everything above the diagonal fires. The weights set the direction of the boundary, the bias its position."
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: numeric
    prompt: "Perceptron rule: w ← w + η · (target − output) · x. Here w₁ = 1, x₁ = 2, η = 0.5. The target was 1, the neuron gave 0. What is the new w₁?"
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 0
        misconception: sign
        text: "Wrong sign: the neuron should fire more, so the weight must grow."
    hints:
      - Target − output = 1 − 0 = 1.
      - 1 + 0.5 · 1 · 2 = ?
    explanation: w₁ = 1 + 0.5 · 1 · 2 = 2. On a mistake each weight moves in the direction of its input; on a correct answer nothing changes. That is the perceptron rule.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The bias b shifts the decision boundary. What would a neuron **without** bias be?
    params:
      options:
        - label: Its line would always have to pass through the origin
          correct: true
        - label: It could not separate anything
          feedback: Some things it could – but only with lines through the origin.
        - label: It would be just as good
          feedback: Much data does not lie suitably around the origin.
    hints:
      - Put x = 0 and y = 0 into w₁x + w₂y = 0.
    explanation: "Like the b in y = mx + b: without an intercept no freely movable line."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: choice
    prompt: What is known about the perceptron rule?
    params:
      options:
        - label: If the data can be split by a line, it finds a separation after finitely many mistakes.
          correct: true
        - label: It finds a perfect separation for any data.
          feedback: For XOR there is no line – then it oscillates forever.
        - label: It always needs exactly as many steps as there are points.
          feedback: The number of steps depends on how far apart the classes are.
    hints:
      - "Think of XOR: is there a solution at all?"
      - Where a solution exists, the method is guaranteed to succeed.
    explanation: This is the perceptron convergence theorem. Without separability it does not help. That revealed the limits of single neurons and led to networks with hidden layers.
    difficulty: 3

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how the weights and the bias change a neuron's decision boundary.
    params:
      keywords:
        - - gewicht
          - weight
        - - dreh
          - richtung
          - neig
          - rotat
          - direction
          - tilt
        - - bias
          - verschieb
          - shift
          - move
      sample: The neuron draws a line through the plane. The weights rotate it and set its direction. The bias shifts it without rotating it.
    difficulty: 3

srs:
  cards_from: [trennen, xor]
