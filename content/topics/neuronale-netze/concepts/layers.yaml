id: ai.neural.layers
type: concept
title: Versteckte Schichten
summary: Warum Netze tief sein müssen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 7
steps:
  - kind: problem
    id: unmoeglich
    widget: choice
    visual:
      widget: slider
      interactive: true
      params:
        expr: "m*x + b"
        x: [-4, 4]
        y: [-4, 4]
        showCoordinates: false
        sliders:
          - { id: m, label: Steigung, min: -3, max: 3, step: 0.25, initial: 0.5 }
          - { id: b, label: Höhe, min: -3, max: 3, step: 0.5, initial: 0 }
        markers:
          - { x: -2, y: 2, group: a }
          - { x: 2, y: -2, group: a }
          - { x: 2, y: 2, group: b }
          - { x: -2, y: -2, group: b }
    prompt: Probier es aus. Gibt es eine Gerade, die Blau von Orange trennt?
    params:
      options:
        - { label: Nein – keine einzige, correct: true }
        - { label: Ja, feedback: "Probier weiter – jede Gerade lässt einen Punkt auf der falschen Seite." }
    hints:
      - Blau liegt über Kreuz, Orange auch.
    explanation: Dieses Muster heißt **XOR**. Ein einzelnes Neuron schafft es nicht.

  - kind: explain
    id: s2
    body: |
      Die Lösung: eine **versteckte Schicht**. Zwei Neuronen ziehen je eine Gerade, ein drittes kombiniert sie. Mehr Schichten erlauben immer feinere Formen.

  - kind: problem
    id: xor
    widget: gates
    prompt: Baue XOR aus zwei versteckten Neuronen und einem UND am Ausgang.
    params:
      inputs: [{ id: A }, { id: B }]
      gates:
        - { id: h1, type: "?", in: [A, B], options: [OR, AND] }
        - { id: h2, type: "?", in: [A, B], options: [NAND, NOR] }
        - { id: g, type: AND, in: [h1, h2] }
      outputs: [{ id: Q, from: g, label: XOR }]
    check: { predicate: "table('Q') == [0, 1, 1, 0]" }
    hints:
      - XOR heißt – mindestens eins, aber nicht beide.
    explanation: »Mindestens eins« (ODER) und »nicht beide« (NAND) – zusammen XOR.

  - kind: problem
    id: gewichte
    widget: numeric
    prompt: Ein Netz hat {{a}} Eingänge, {{h}} versteckte Neuronen und 1 Ausgang. Jede Schicht ist voll verbunden. Wie viele Gewichte gibt es?
    params: { unit: Gewichte }
    answer: { value: "{{a * h + h}}" }
    hints:
      - "Eingänge zu versteckt: {{a}} · {{h}}. Versteckt zum Ausgang: {{h}}."
    explanation: "{{a * h}} + {{h}} = {{a * h + h}}. Große Sprachmodelle haben Milliarden davon."
    variants:
      params: { a: "int[2,6]", h: "int[3,8]" }
      defaults: { a: 3, h: 4 }

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Netz hat 784 Eingänge (ein Bild mit 28 × 28 Pixeln), eine versteckte Schicht mit 100 Neuronen und 10 Ausgänge. Wie viele Gewichte hat es – ohne Bias?
    answer:
      value: 79400
    hints:
      - 784 · 100 + 100 · 10.
    explanation: 78 400 + 1000 = 79 400. Schon dieses winzige Netz erkennt handgeschriebene Ziffern zu 97 %.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: numeric
    prompt: Ein Netz hat {{a}} Eingänge, {{h}} versteckte Neuronen und {{o}} Ausgänge, voll verbunden. Jedes Neuron hat einen Bias. Wie viele Parameter sind das?
    answer:
      value: "{{a * h + h + h * o + o}}"
    feedback:
      - when: numval(state.input) == a * h + h * o
        misconception: no-bias
        text: "Die Biase fehlen: einer pro verstecktem und pro Ausgangs-Neuron."
    hints:
      - "Gewichte: {{a}} · {{h}} + {{h}} · {{o}}."
      - "Biase: {{h}} + {{o}}."
    explanation: "{{a * h + h * o}} Gewichte + {{h + o}} Biase = {{a * h + h + h * o + o}}. Große Modelle haben so Milliarden **Parameter** – alle werden beim Training angepasst."
    difficulty: 2
    variants:
      params:
        a: int[2,8]
        h: int[3,10]
        o: int[1,4]
      defaults:
        a: 4
        h: 5
        o: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: choice
    prompt: Ein Netz aus ReLU-Neuronen zeichnet eine Kurve. Wie sieht sie aus der Nähe aus?
    params:
      options:
        - label: Wie viele gerade Stücke mit Knicken – mehr Neuronen, mehr Knicke.
          correct: true
        - label: Vollkommen glatt.
          feedback: ReLU hat selbst einen Knick bei 0. Summen davon sind stückweise gerade.
        - label: Wie eine einzige Gerade.
          feedback: Das wäre ohne Aktivierung so – mit ReLU entstehen Knicke.
    hints:
      - ReLU ist links 0 und rechts eine Gerade.
      - Was entsteht, wenn man viele verschobene ReLUs addiert?
    explanation: Jedes ReLU-Neuron fügt einen Knick hinzu. Mit genug Knicken lässt sich jede vernünftige Kurve **annähern** – wie ein Polygon einen Kreis.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "Ein Satz sagt: Schon **eine** versteckte Schicht kann jede vernünftige Funktion beliebig genau nachbilden. Warum baut man trotzdem tiefe Netze?"
    params:
      options:
        - label: Eine Schicht bräuchte dafür oft absurd viele Neuronen – Tiefe ist viel sparsamer
          correct: true
        - label: Der Satz ist falsch
          feedback: Er ist bewiesen.
        - label: Tiefe Netze sehen beeindruckender aus
          feedback: Der Grund ist Effizienz.
    hints:
      - "Kanten → Formen → Objekte: Stufen bauen aufeinander auf."
    explanation: Tiefe erlaubt Wiederverwendung von Zwischenergebnissen – wie Funktionen beim Programmieren.
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: teach
    prompt: Erklär Lux, warum ein Netz versteckte Schichten braucht, um XOR zu lernen.
    params:
      keywords:
        - - gerade
          - linie
          - line
        - - xor
          - entweder
        - - schicht
          - versteckt
          - kombinier
          - layer
          - hidden
          - combin
      sample: Ein einzelnes Neuron zieht nur eine Gerade, und keine Gerade trennt die XOR-Punkte. In einer versteckten Schicht ziehen zwei Neuronen je eine Gerade, und ein drittes kombiniert sie.
    difficulty: 3

srs:
  cards_from: [xor, gewichte]
