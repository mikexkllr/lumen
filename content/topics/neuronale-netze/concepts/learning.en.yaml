id: ai.neural.learning
type: concept
title: Learning Means Shrinking the Error
summary: Training, error, and memorizing.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Down into the valley
    body: Training means making the **error** smaller step by step – like a ball rolling into a valley. Set the learning rate and the steps. When does the ball arrive, and when does it overshoot?
    visual:
      widget: sim
      interactive: true
      params:
        scene: descent

  - kind: problem
    id: anpassen
    widget: slider
    prompt: Set the line so that it passes exactly through all the points.
    params:
      expr: "m*x + b"
      x: [-3, 5]
      y: [-2, 4]
      showCoordinates: false
      sliders:
        - { id: m, label: Slope, min: -1, max: 2, step: 0.25, initial: 1.5 }
        - { id: b, label: Height, min: -2, max: 3, step: 0.5, initial: -1 }
      markers:
        - { x: -2, y: 0 }
        - { x: 0, y: 1 }
        - { x: 2, y: 2 }
        - { x: 4, y: 3 }
    answer: { values: { m: 0.5, b: 1 } }
    hints:
      - Where does the line cross the y-axis?
      - For each step to the right, it goes up half a step.
    explanation: y = 0.5 · x + 1. That is exactly what training does – turn the dials until the error disappears.

  - kind: explain
    id: s2
    body: |
      A network learns from examples. It measures the **error** – how far off is it?
      Then it turns each weight a little so that the error gets smaller.

  - kind: problem
    id: fehler
    widget: numeric
    prompt: The model predicts 3, 5, and 8. The correct values are 4, 5, and 6. What is the mean error (ignoring sign)?
    params: { placeholder: "Error" }
    answer: { value: 1 }
    feedback:
      - when: "numval(state.input) == 3"
        misconception: sum-not-mean
        text: That is the total error. Also divide by the number of examples.
    hints:
      - The distances are 1, 0, and 2.
    explanation: (1 + 0 + 2) / 3 = 1.

  - kind: explain
    id: s4
    body: |
      **Overfitting:** A model that memorizes the examples fails on new data.
      That is why you test it with data it has never seen.

  - kind: problem
    id: auswendig
    widget: choice
    prompt: A model recognizes 100% of the training images, but only 60% of new images. What happened?
    params:
      options:
        - { label: It memorized them., correct: true }
        - { label: The new images are wrong., feedback: "Possible, but unlikely. The large gap is a typical warning sign." }
        - { label: It needs more training on the same images., feedback: "That would reinforce the memorizing." }
    hints:
      - What does it mean when training and test results are so far apart?
    explanation: This is **overfitting**. More varied data or a simpler model helps.

  - kind: problem
    id: daten
    widget: buckets
    prompt: Does this help training – or harm it?
    params:
      buckets: [{ label: helps }, { label: harms }]
      items:
        - { label: Many different examples, bucket: helps }
        - { label: Keeping test data separate, bucket: helps }
        - { label: Examples from all groups, bucket: helps }
        - { label: Only photos in sunshine, bucket: harms }
        - { label: Wrong labels, bucket: harms }
        - { label: Training on the test data, bucket: harms }
    hints:
      - What should the model be able to do later?
    explanation: Good data is varied, correctly labeled, and kept apart from the test.

  - kind: problem
    id: c1
    widget: sim
    prompt: The ball rolls down the error hill. Set the learning rate so that the error is below 0.01 after **at most 5 steps**.
    params:
      scene: descent
    answer:
      loss:
        - 0
        - 0.01
      steps:
        - 0
        - 5
    explanation: With a medium learning rate around 0.5 you are in the valley almost at once. Too small, and it takes forever.

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Now overdo it: choose 5 steps and a learning rate at which the error **explodes** – above 100."
    params:
      scene: descent
    answer:
      steps: 5
      loss:
        - 100
        - 1000000
    explanation: Above 1.0 the ball jumps further beyond the valley each time – training **diverges**.
    difficulty: 2

  - kind: problem
    id: la-d1
    depth: 2
    widget: sim
    prompt: The loss is x², the ball starts at x = 4. Find the learning rate that lands it exactly in the valley **in a single step**.
    params:
      scene: descent
    answer:
      steps: 1
      loss:
        - 0
        - 0.001
    hints:
      - Set the steps to 1. One step computes x − rate · 2x.
      - For x − r · 2x = 0 you need 2r = 1.
    explanation: At r = 0.5 the ball jumps exactly to 0. For x² that is the perfect rate – for real networks nobody knows it, so it has to be tuned by trial.
    difficulty: 2

  - kind: problem
    id: la-d2
    depth: 2
    widget: sim
    prompt: "Find a learning rate at which the ball bounces back and forth forever: after at least 5 steps the loss should still be 16."
    params:
      scene: descent
    answer:
      steps:
        - 5
        - 20
      loss:
        - 15.9
        - 16.1
    hints:
      - "16 is the starting loss: x = 4 or x = −4."
      - At which rate does 4 turn into exactly −4?
    explanation: "At r = 1, x ← x − 2x = −x: the ball swings between 4 and −4. Below that the loss shrinks; above it, it explodes."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: How does a weight deep inside the network learn which way to change?
    params:
      options:
        - label: The error is computed backwards layer by layer – with the chain rule
          correct: true
        - label: Each weight is changed at random and checked
          feedback: With billions of weights that would be hopelessly slow.
        - label: A human sets them
          feedback: Nobody could set billions of numbers by hand.
    hints:
      - The error depends on each weight through many chained functions.
    explanation: "**Backpropagation**: a single backward pass yields the slope for all weights at once."
    difficulty: 3

  - kind: problem
    id: la-x1
    depth: 3
    widget: numeric
    prompt: "Gradient descent on f(x) = x²: the slope is 2x. You are at x = {{x}}, the learning rate is 0.1. Where are you after one step?"
    answer:
      value: "{{0.8 * x}}"
      tolerance: 0.001
    feedback:
      - when: numval(state.input) == 1.2 * x
        misconception: wrong-direction
        text: You went uphill. You step **against** the slope.
    hints:
      - "Slope at {{x}}: 2 · {{x}} = {{2 * x}}."
      - New x = {{x}} − 0.1 · {{2 * x}}.
    explanation: "{{x}} − {{0.2 * x}} = {{0.8 * x}}. Each step multiplies x by 1 − 2 · 0.1 = 0.8 here. If this factor exceeds 1 in size, the loss blows up."
    difficulty: 3
    variants:
      params:
        x: int[2,9]
      defaults:
        x: 4

  - kind: problem
    id: la-x2
    depth: 3
    widget: teach
    prompt: Explain to Lux what the learning rate does in training.
    params:
      keywords:
        - - schritt
          - step
        - - klein
          - langsam
          - small
          - slow
        - - groß
          - spring
          - explod
          - large
          - jump
          - explode
      sample: The learning rate sets how big each downhill step is. Too small and learning takes forever. Too large and you jump over the valley – the loss can explode.
    difficulty: 3

srs:
  cards_from: [fehler, auswendig]
