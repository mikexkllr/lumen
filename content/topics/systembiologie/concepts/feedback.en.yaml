id: bio.systems.feedback
type: concept
title: "Feedback loops"
summary: "How bodies and cells regulate themselves."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: After a piece of cake your blood sugar rises. An hour later it is back to normal. Who regulated it?
    params:
      options:
        - label: The pancreas releases insulin and the cells take up sugar.
          correct: true
        - label: The sugar evaporates.
          feedback: Sugar does not evaporate. It is taken up into cells.
        - label: The heart pumps it out.
          feedback: The heart moves blood, it does not filter sugar.
    hints:
      - A hormone lowers blood sugar.
      - In diabetes it is missing or works poorly.
    explanation: When sugar rises, insulin comes. When it falls, glucagon comes. The value settles.

  - kind: explain
    id: c1
    body: In **negative feedback** a change works against itself. When a value rises, it sets off something that lowers it again. That keeps temperature, blood sugar and blood pressure stable.

  - kind: problem
    id: c2
    widget: order
    prompt: "Blood sugar loop: order the steps."
    params:
      items:
        - label: Blood sugar rises
        - label: Pancreas cells sense it
        - label: Insulin is released
        - label: Muscle and liver take up sugar
        - label: Blood sugar falls again
    hints:
      - First sense, then respond.
      - In the end the cause is removed.
    explanation: Sense, counteract, target reached – like a thermostat.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Negative or positive feedback?
    params:
      buckets:
        - id: b1
          label: "negative: stabilises"
        - id: b2
          label: "positive: amplifies"
      items:
        - label: Sweating in heat
          bucket: b1
        - label: Insulin after eating
          bucket: b1
        - label: Blood clotting at a wound
          bucket: b2
        - label: Contractions in childbirth
          bucket: b2
        - label: Na⁺ channels in a nerve impulse
          bucket: b2
    hints:
      - Does the response brake or build itself up?
      - In childbirth, contractions boost the release of the hormone oxytocin.
    explanation: Negative feedback holds values steady. Positive feedback drives a process quickly to completion.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: When blood sugar rises, the body releases [[insulin]]. When it falls, [[glucagon]] comes. That is [[negative]] feedback.
      distractors:
        - adrenaline
        - positive
    explanation: Two opposing hormones keep blood sugar within a narrow range.

  - kind: explain
    id: d1
    depth: 2
    body: "If the counter-reaction comes too late, the system overshoots its target. Then it **oscillates**: too high, too low, too high. Delayed negative feedback creates rhythms."

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Your internal clock runs about 24 hours even without daylight. How does a cell produce this rhythm?
    params:
      options:
        - label: A protein shuts down its own gene after hours. Once it is broken down, the gene restarts.
          correct: true
        - label: The cell counts seconds.
          feedback: Cells do not count. The rhythm comes from a slow loop.
        - label: Only light controls the rhythm.
          feedback: Light resets the clock, but it runs in the dark too.
    hints:
      - Think of delayed negative feedback.
      - Make, accumulate, switch off, break down – and again.
    explanation: The discovery of this gene loop won the 2017 Nobel Prize. Predators and prey oscillate on the same principle.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: A thermostat measures every 10 minutes and then heats for 10 minutes. The heater warms by 0.3 °C per minute. By how many degrees can the temperature overshoot if it reaches the target right after a measurement?
    params:
      unit: °C
    answer:
      value: 3
      tolerance: 0.01
    hints:
      - Until the next measurement it keeps heating.
      - 10 × 0.3
    explanation: 3 °C too warm – delay causes overshoot. Hormones act with a delay too.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: In type 1 diabetes the immune system destroys the insulin-producing cells. What does that mean for the feedback loop?
    params:
      options:
        - label: The lowering arm is missing. Blood sugar rises until insulin is given from outside.
          correct: true
        - label: Blood sugar keeps falling.
          feedback: Without insulin sugar barely enters cells and stays in the blood.
        - label: Glucagon takes over the job.
          feedback: Glucagon raises sugar, it does not lower it.
    hints:
      - Which hormone lowers, which raises?
      - A feedback loop needs both directions.
    explanation: Insulin pumps with sensors close the loop again today – as an artificial pancreas.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Explain to Lux: when does feedback hold things steady, and when does it build up?"
    params:
      keywords:
        - - negativ
          - negative
        - - positiv
          - positive
        - - stabil
          - gleich
          - ausgleich
          - steady
          - stable
          - balance
        - - verstärk
          - verstaerk
          - aufschaukel
          - amplif
          - boost
          - build
      sample: Negative feedback counteracts a change and keeps values stable, such as blood sugar. Positive feedback amplifies a change, as in blood clotting. With a delay, negative feedback can also oscillate.
    explanation: Counteracting stabilises, reinforcing amplifies.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
