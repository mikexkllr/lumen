id: bio.systems.feedback
type: concept
title: "Rückkopplung"
summary: "Wie Körper und Zellen sich selbst regeln."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Nach einem Stück Kuchen steigt dein Blutzucker. Eine Stunde später ist er wieder normal. Wer hat das geregelt?
    params:
      options:
        - label: Die Bauchspeicheldrüse schüttet Insulin aus, und die Zellen nehmen Zucker auf.
          correct: true
        - label: Der Zucker verdunstet.
          feedback: Zucker verdunstet nicht. Er wird in Zellen aufgenommen.
        - label: Das Herz pumpt ihn hinaus.
          feedback: Das Herz bewegt Blut, es filtert keinen Zucker.
    hints:
      - Ein Hormon senkt den Blutzucker.
      - Bei Diabetes fehlt es oder wirkt schlecht.
    explanation: Steigt der Zucker, kommt Insulin. Sinkt er, kommt Glukagon. Der Wert pendelt sich ein.

  - kind: explain
    id: c1
    body: Bei der **negativen Rückkopplung** wirkt eine Änderung gegen sich selbst. Steigt ein Wert, setzt das etwas in Gang, das ihn wieder senkt. So bleiben Temperatur, Blutzucker und Blutdruck stabil.

  - kind: problem
    id: c2
    widget: order
    prompt: "Blutzucker-Regelkreis: Ordne die Schritte."
    params:
      items:
        - label: Blutzucker steigt
        - label: Zellen der Bauchspeicheldrüse messen es
        - label: Insulin wird ausgeschüttet
        - label: Muskel und Leber nehmen Zucker auf
        - label: Blutzucker sinkt wieder
    hints:
      - Erst messen, dann reagieren.
      - Am Ende ist die Ursache beseitigt.
    explanation: Messen, gegensteuern, Ziel erreicht – wie ein Thermostat.

  - kind: problem
    id: c3
    widget: buckets
    prompt: Negative oder positive Rückkopplung?
    params:
      buckets:
        - id: b1
          label: "negativ: stabilisiert"
        - id: b2
          label: "positiv: verstärkt"
      items:
        - label: Schwitzen bei Hitze
          bucket: b1
        - label: Insulin nach dem Essen
          bucket: b1
        - label: Blutgerinnung an der Wunde
          bucket: b2
        - label: Wehen bei der Geburt
          bucket: b2
        - label: Na⁺-Kanäle beim Nervenimpuls
          bucket: b2
    hints:
      - Bremst die Reaktion oder schaukelt sie sich auf?
      - Bei der Geburt verstärken Wehen die Ausschüttung des Hormons Oxytocin.
    explanation: Negative Rückkopplung hält Werte stabil. Positive treibt einen Vorgang schnell zu Ende.

  - kind: problem
    id: c4
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: Steigt der Blutzucker, schüttet der Körper [[Insulin]] aus. Sinkt er, kommt [[Glukagon]]. Das ist [[negative]] Rückkopplung.
      distractors:
        - Adrenalin
        - positive
    explanation: Zwei Gegenspieler halten den Blutzucker in einem engen Bereich.

  - kind: explain
    id: d1
    depth: 2
    body: "Kommt die Gegenreaktion zu spät, schießt das System über das Ziel hinaus. Dann **schwingt** es: zu hoch, zu tief, zu hoch. Verzögerte negative Rückkopplung erzeugt Rhythmen."

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Deine innere Uhr läuft auch ohne Tageslicht etwa 24 Stunden. Wie entsteht dieser Takt in einer Zelle?
    params:
      options:
        - label: Ein Eiweiß bremst nach Stunden sein eigenes Gen. Ist es abgebaut, startet das Gen neu.
          correct: true
        - label: Die Zelle zählt Sekunden.
          feedback: Zellen zählen nicht. Der Takt entsteht aus einer langsamen Schleife.
        - label: Nur das Licht steuert den Takt.
          feedback: Licht stellt die Uhr nach, doch sie läuft auch im Dunkeln.
    hints:
      - Denk an verzögerte negative Rückkopplung.
      - Herstellen, Ansammeln, Abschalten, Abbauen – und von vorn.
    explanation: Für die Entdeckung dieser Genschleife gab es 2017 den Nobelpreis. Räuber und Beute schwingen nach demselben Prinzip.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Ein Thermostat misst alle 10 Minuten und heizt dann 10 Minuten lang. Die Heizung erwärmt um 0,3 °C pro Minute. Um wie viel Grad kann die Temperatur über das Ziel schießen, wenn sie direkt nach einer Messung ankommt?
    params:
      unit: °C
    answer:
      value: 3
      tolerance: 0.01
    hints:
      - Bis zur nächsten Messung heizt er weiter.
      - 10 · 0,3
    explanation: 3 °C zu warm – Verzögerung macht Überschwingen. Auch Hormone wirken mit Verzögerung.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Bei Typ-1-Diabetes zerstört das Immunsystem die Insulin bildenden Zellen. Was bedeutet das für den Regelkreis?
    params:
      options:
        - label: Der senkende Arm fehlt. Der Blutzucker steigt, bis man Insulin von außen gibt.
          correct: true
        - label: Der Blutzucker sinkt dauernd.
          feedback: Ohne Insulin kommt Zucker kaum in die Zellen und bleibt im Blut.
        - label: Glukagon übernimmt die Aufgabe.
          feedback: Glukagon hebt den Zucker, es senkt ihn nicht.
    hints:
      - Welches Hormon senkt, welches hebt?
      - Ein Regelkreis braucht beide Richtungen.
    explanation: Insulinpumpen mit Sensor schließen den Kreis heute wieder – als künstliche Bauchspeicheldrüse.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Wann bremst eine Rückkopplung, und wann schaukelt sie sich auf?"
    params:
      keywords:
        - - negativ
          - negative
        - - positiv
          - positive
        - - stabil
          - gleich
          - ausgleich
          - steady
          - stable
          - balance
        - - verstärk
          - verstaerk
          - aufschaukel
          - amplif
          - boost
          - build
      sample: Negative Rückkopplung wirkt einer Änderung entgegen und hält Werte stabil, etwa den Blutzucker. Positive Rückkopplung verstärkt eine Änderung, wie bei der Blutgerinnung. Mit Verzögerung kann negative Rückkopplung auch schwingen.
    explanation: Gegensteuern stabilisiert, Mitsteuern verstärkt.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
