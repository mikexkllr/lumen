id: cs.recursion.basecase
type: concept
title: Wann ist Schluss?
summary: Ohne Abbruch läuft Rekursion ewig.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: fehlt
    widget: choice
    body: "countdown(n): sag n, dann rufe countdown(n − 1) auf."
    prompt: Was passiert bei countdown(3)?
    params:
      options:
        - { label: "3, 2, 1, 0, −1, … ohne Ende", correct: true }
        - { label: "3, 2, 1 und Schluss", feedback: "Nichts sagt der Funktion, dass sie bei 1 aufhören soll." }
    hints:
      - Wo steht, dass sie aufhören soll?
    explanation: Es fehlt der **Basisfall** – zum Beispiel »bei 0 aufhören«.

  - kind: explain
    id: s2
    body: |
      Jede Rekursion braucht zwei Teile: einen **Basisfall**, der sofort antwortet, und einen **Schritt**, der das Problem kleiner macht.

  - kind: problem
    id: fakultaet
    widget: numeric
    body: "fak(1) = 1 und fak(n) = n · fak(n − 1)."
    prompt: Was ist fak(5)?
    params: { placeholder: "Zahl" }
    answer: { value: 120 }
    hints:
      - fak(2) = 2, fak(3) = 6 …
    explanation: 5 · 4 · 3 · 2 · 1 = 120.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Wo steckt Rekursion drin?
    params:
      buckets: [{ label: rekursiv }, { label: nicht rekursiv }]
      items:
        - { label: Ordner in Ordnern, bucket: rekursiv }
        - { label: Matroschka-Puppen, bucket: rekursiv }
        - { label: Zwei Spiegel gegenüber, bucket: rekursiv }
        - { label: Eine Einkaufsliste, bucket: nicht rekursiv }
        - { label: Ein Stundenplan, bucket: nicht rekursiv }
    hints:
      - Enthält das Ding eine kleinere Version von sich selbst?
    explanation: Rekursiv ist alles, was sich selbst im Kleinen enthält.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: pow(b, n) = b · pow(b, n − 1), und pow(b, 0) = 1. Wie viele Multiplikationen braucht pow(2, 10)?
    answer:
      value: 10
    hints:
      - Eine pro Rekursionsschritt.
    explanation: "10. Mit einem Trick geht es in 4: b¹⁰ = (b⁵)², und b⁵ = b · (b²)²."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: teach
    prompt: Erklär Lux Rekursion mit einem Beispiel aus dem Alltag.
    params:
      keywords:
        - - selbst
          - sich
          - itself
          - self
          - selves
        - - kleiner
          - kleinere
          - smaller
          - teil
          - part
          - unter
          - sub
        - - ende
          - schluss
          - abbruch
          - basisfall
          - stop
          - end
          - base
      sample: Ein Ordner enthält Dateien und Unterordner, die selbst wieder Ordner sind. Um alle Dateien zu zählen, zählt man jeden Unterordner auf dieselbe Weise – bis ein Ordner keine Unterordner mehr hat, dann ist Schluss.
    difficulty: 3

srs:
  cards_from: [fehlt, fakultaet]
