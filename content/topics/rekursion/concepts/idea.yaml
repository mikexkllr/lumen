id: cs.recursion.idea
type: concept
title: Die Idee der Rekursion
summary: Ein großes Problem als kleineres derselben Art.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: problem
    id: fak-vier
    widget: numeric
    body: "fak(n) = n · fak(n − 1), und fak(1) = 1."
    prompt: Wenn fak(3) = 6 ist – was ist fak(4)?
    params: { placeholder: "Ergebnis" }
    answer: { value: 24 }
    hints:
      - fak(4) = 4 · fak(3).
    explanation: 4 · 6 = 24.

  - kind: explain
    id: s2
    body: |
      **Rekursion** heißt: Eine Funktion löst ein Problem, indem sie sich selbst mit einer kleineren Version aufruft.
      Dazu braucht sie eine **Abbruchbedingung** – sonst hört sie nie auf.

  - kind: problem
    id: reihenfolge
    widget: order
    prompt: fak(4) wird aufgerufen. In welcher Reihenfolge werden die Aufrufe fertig?
    params:
      startLabel: zuerst fertig
      endLabel: zuletzt fertig
      items:
        - { label: "fak(1) = 1" }
        - { label: "fak(2) = 2" }
        - { label: "fak(3) = 6" }
        - { label: "fak(4) = 24" }
    hints:
      - fak(4) muss auf fak(3) warten, das auf fak(2) …
    explanation: Der innerste Aufruf ist zuerst fertig. Dann rechnen alle anderen rückwärts weiter.

  - kind: problem
    id: ohne-abbruch
    widget: choice
    prompt: Was passiert, wenn die Abbruchbedingung fehlt?
    params:
      options:
        - { label: Die Funktion ruft sich endlos auf – bis der Speicher voll ist., correct: true }
        - { label: Sie gibt 0 zurück., feedback: "Ohne Abbruch gibt sie gar nichts zurück." }
        - { label: Nichts Besonderes., feedback: "Jeder Aufruf belegt Speicher. Irgendwann ist er voll." }
    hints:
      - Wann würde die Kette der Aufrufe enden?
    explanation: Das nennt man einen **Stack Overflow** – den Namen trägt sogar eine bekannte Programmierer-Webseite.

  - kind: problem
    id: fibonacci
    widget: numeric
    body: f(1) = f(2) = 1, und jede weitere Zahl ist die Summe der zwei davor.
    prompt: Was ist f({{n}})?
    params: { placeholder: "Zahl" }
    answer: { value: "{{v}}" }
    hints:
      - 1, 1, 2, 3, 5, 8 …
    explanation: "f({{n}}) = {{v}}."
    variants:
      params: { n: "choice[6,7,8,10]" }
      derive: { v: "n == 6 ? 8 : n == 7 ? 13 : n == 8 ? 21 : 55" }
      defaults: { n: 7 }

  - kind: problem
    id: c1
    widget: cloze
    prompt: Fülle die Lücken.
    params:
      text: "Rekursion braucht zwei Dinge: einen [[Basisfall]], der sofort antwortet, und einen Schritt, der das Problem [[kleiner]] macht."
      distractors:
        - größer
        - Zähler

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: sum(n) gibt n + sum(n − 1) zurück, und sum(0) = 0. Was ist sum(10)?
    answer:
      value: 55
    hints:
      - 10 + 9 + 8 + … + 1.
    explanation: 55 – die rekursive Fassung der Gauß-Summe.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "qs(n): Ist n < 10, gib n zurück. Sonst gib qs(n ohne letzte Ziffer) + letzte Ziffer zurück. Was ist qs({{n}})?"
    answer:
      value: "{{s}}"
    hints:
      - qs({{n}}) = qs({{floor(n / 10)}}) + {{mod(n, 10)}}.
      - Schäle Ziffer für Ziffer ab, bis eine einzige übrig ist.
    explanation: "Die Funktion bildet die Quersumme: {{s}}. Jeder Aufruf macht die Zahl eine Stelle kürzer – irgendwann greift der Basisfall."
    difficulty: 2
    variants:
      params:
        n: int[100,9999]
      derive:
        s: mod(n, 10) + mod(floor(n / 10), 10) + mod(floor(n / 100), 10) + floor(n / 1000)
      defaults:
        n: 4096

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: fak(n) wird rekursiv für n = 1000 aufgerufen. Wie viele Aufrufe liegen gleichzeitig auf dem Stapel, wenn gerade fak(1) rechnet?
    answer:
      value: 1000
    hints:
      - Keiner der Aufrufe ist fertig, bevor fak(1) antwortet.
      - fak(1000), fak(999), …, fak(1).
    explanation: Alle 1000 warten übereinander. Darum kann tiefe Rekursion den Stapel sprengen – die Schleife braucht nur eine Variable.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: bin(n) schreibt bin(n // 2) und hängt n mod 2 an. bin(1) ist »1«. Was ergibt bin(6)?
    params:
      options:
        - label: "110"
          correct: true
        - label: "011"
          feedback: Die letzte Ziffer kommt zuletzt dazu – hinten, nicht vorn.
        - label: "101"
          feedback: Das ist 5.
    hints:
      - bin(6) = bin(3) + »0«.
      - bin(3) = bin(1) + »1« = »11«.
    explanation: »11« + »0« = 110 = 6. Die Rekursion liefert die Ziffern in der richtigen Reihenfolge, weil sie erst nach dem Aufruf anhängt.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Kann man jede Rekursion auch als Schleife schreiben?
    params:
      options:
        - label: Ja – notfalls mit einem eigenen Stapel
          correct: true
        - label: Nein – manche Probleme gehen nur rekursiv
          feedback: Der Computer macht intern auch nichts anderes als Schleife plus Stapel.
        - label: Nur bei Zahlen
          feedback: Es gilt für jede Rekursion.
    hints:
      - Wie setzt der Computer selbst Rekursion um?
    explanation: Beides ist gleich mächtig. Rekursion ist oft eleganter, Schleifen oft sparsamer.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "Warum ist eine Rekursion richtig? Wie bei der **Induktion**: Der Basisfall stimmt. Und wenn der Aufruf für n − 1 stimmt, stimmt auch der für n. Also stimmt er für jedes n."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: choice
    prompt: f(n) = f(n − 2) + 1, und f(0) = 0. Was passiert bei f(5)?
    params:
      options:
        - label: "Sie endet nie: 5, 3, 1, −1 … – die 0 wird übersprungen"
          correct: true
        - label: Sie gibt 3 zurück
          feedback: Dafür müsste sie bei 0 ankommen.
        - label: Sie gibt 2,5 zurück
          feedback: Hier wird nichts geteilt.
    hints:
      - Welche Zahlen durchläuft n?
      - Ungerade Zahlen minus 2 bleiben ungerade.
    explanation: "Ein Basisfall nützt nur, wenn jede Kette ihn auch erreicht. Abhilfe: zusätzlich f(1) = 0 oder »n ≤ 0« als Abbruch."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: In »gib summe(n − 1, acc + n) zurück« ist der rekursive Aufruf das Allerletzte. Was kann ein Compiler daraus machen?
    params:
      options:
        - label: Eine Schleife – der Stapel wächst nicht mehr
          correct: true
        - label: Nichts – Rekursion bleibt Rekursion
          feedback: Viele Compiler wandeln solche Aufrufe um.
        - label: Einen schnelleren Algorithmus
          feedback: Der Algorithmus bleibt gleich, nur der Speicherbedarf sinkt.
    hints:
      - Muss der Aufrufer nach dem Aufruf noch etwas tun?
      - Wenn nicht, braucht man seinen Platz auf dem Stapel nicht mehr.
    explanation: Das heißt Endrekursion. Der Compiler ersetzt den Aufruf durch einen Sprung an den Anfang – Speicher O(1) statt O(n).
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Erklär Lux, wie fak(4) rechnet.
    params:
      keywords:
        - - fak(3)
          - fact(3)
          - fak 3
          - fact 3
          - 3!
        - - fak(1)
          - fact(1)
          - basis
          - base
          - abbruch
        - - zurück
          - return
          - ergebnis
          - result
          - "24"
      sample: "fak(4) braucht fak(3), das braucht fak(2), das braucht fak(1). fak(1) ist der Basisfall und gibt 1 zurück. Dann geht es zurück: 2 · 1 = 2, 3 · 2 = 6, 4 · 6 = 24."
    difficulty: 3

srs:
  cards_from: [fak-vier, ohne-abbruch]
