id: cs.recursion.fractals
type: concept
title: Fractals
summary: Patterns that contain themselves.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: s1
    body: A **fractal** contains itself. This triangle is made of three smaller copies – and those of three more each.
    visual: { widget: pixels, params: { cells: ["#.......", "##......", "#.#.....", "####....", "#...#...", "##..##..", "#.#.#.#.", "########"] } }

  - kind: problem
    id: dreiecke
    widget: numeric
    prompt: Each step replaces every triangle with 3 smaller ones. How many small triangles are there after {{n}} steps?
    params: { unit: triangles }
    answer: { value: "{{3 ** n}}" }
    feedback:
      - when: "numval(state.input) == 3 * n"
        misconception: linear
        text: Each triangle triples. That is multiplying, not adding.
    hints:
      - 1, 3, 9, 27 …
    explanation: "$3^{ {{n}} } = {{3 ** n}}$."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: koch
    widget: numeric
    body: In the Koch curve, each line is replaced by four pieces, each a third as long.
    prompt: How long is a 1 m line after 2 steps? Round to two decimal places.
    params: { unit: m }
    answer: { value: 1.78, tolerance: 0.01 }
    feedback:
      - when: "approx(numval(state.input), 4/3)"
        misconception: one-step
        text: That is after one step. Use the factor 4/3 twice.
    hints:
      - Each step multiplies the length by 4/3.
    explanation: (4/3)² = 16/9 ≈ 1.78 m. After infinitely many steps, the line becomes infinitely long.

  - kind: problem
    id: natur
    widget: buckets
    prompt: Fractal or not?
    params:
      buckets: [{ label: fractal }, { label: not fractal }]
      items:
        - { label: Fern leaf, bucket: fractal }
        - { label: Romanesco broccoli, bucket: fractal }
        - { label: Coastline, bucket: fractal }
        - { label: Soccer ball, bucket: not fractal }
        - { label: Brick, bucket: not fractal }
    hints:
      - Does a part look like the whole?
    explanation: In ferns, romanesco and coastlines, the shape repeats on a smaller scale.

  - kind: explain
    id: s5
    body: How long is the coast of Great Britain?
    reveal:
      body: That depends on the ruler. The finer you measure, the more bays count – the length keeps growing. The mathematician Mandelbrot discovered this.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In the Koch curve each segment is replaced by 4 segments of 1/3 the length. By what factor does the total length grow per step? As a fraction.
    answer:
      value: 4/3
    hints:
      - 4 pieces, each a third as long.
    explanation: 4/3. After infinitely many steps the curve is infinitely long – in finite space.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The **fractal dimension** is log(number of copies) / log(scaling factor). For the Sierpinski triangle: 3 copies, each half the size. What is it? To two places. (log 3 / log 2)"
    answer:
      value: 1.58
      tolerance: 0.01
    hints:
      - log 3 ≈ 0.477 and log 2 ≈ 0.301.
    explanation: 1.58 – more than a line, less than a surface. Fractals have fractional dimensions.
    difficulty: 3

srs:
  cards_from: [dreiecke, koch]
