id: cs.recursion.fractals
type: concept
title: Fractals
summary: Patterns that contain themselves.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: s1
    body: A **fractal** contains itself. This triangle is made of three smaller copies – and those of three more each.
    visual: { widget: pixels, params: { cells: ["#.......", "##......", "#.#.....", "####....", "#...#...", "##..##..", "#.#.#.#.", "########"] } }

  - kind: problem
    id: dreiecke
    widget: numeric
    prompt: Each step replaces every triangle with 3 smaller ones. How many small triangles are there after {{n}} steps?
    params: { unit: triangles }
    answer: { value: "{{3 ** n}}" }
    feedback:
      - when: "numval(state.input) == 3 * n"
        misconception: linear
        text: Each triangle triples. That is multiplying, not adding.
    hints:
      - 1, 3, 9, 27 …
    explanation: "$3^{ {{n}} } = {{3 ** n}}$."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: koch
    widget: numeric
    body: In the Koch curve, each line is replaced by four pieces, each a third as long.
    prompt: How long is a 1 m line after 2 steps? Round to two decimal places.
    params: { unit: m }
    answer: { value: 1.78, tolerance: 0.01 }
    feedback:
      - when: "approx(numval(state.input), 4/3)"
        misconception: one-step
        text: That is after one step. Use the factor 4/3 twice.
    hints:
      - Each step multiplies the length by 4/3.
    explanation: (4/3)² = 16/9 ≈ 1.78 m. After infinitely many steps, the line becomes infinitely long.

  - kind: problem
    id: natur
    widget: buckets
    prompt: Fractal or not?
    params:
      buckets: [{ label: fractal }, { label: not fractal }]
      items:
        - { label: Fern leaf, bucket: fractal }
        - { label: Romanesco broccoli, bucket: fractal }
        - { label: Coastline, bucket: fractal }
        - { label: Soccer ball, bucket: not fractal }
        - { label: Brick, bucket: not fractal }
    hints:
      - Does a part look like the whole?
    explanation: In ferns, romanesco and coastlines, the shape repeats on a smaller scale.

  - kind: explain
    id: s5
    body: How long is the coast of Great Britain?
    reveal:
      body: That depends on the ruler. The finer you measure, the more bays count – the length keeps growing. The mathematician Mandelbrot discovered this.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: In the Koch curve each segment is replaced by 4 segments of 1/3 the length. By what factor does the total length grow per step? As a fraction.
    answer:
      value: 4/3
    hints:
      - 4 pieces, each a third as long.
    explanation: 4/3. After infinitely many steps the curve is infinitely long – in finite space.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: pixels
    prompt: "Rule: a cell is on if exactly one of the two cells above it is on – directly above or above-left. Fill in the last row."
    params:
      cells:
        - "#...."
        - "##..."
        - "#.#.."
        - "####."
        - .....
      locked:
        - xxxxx
        - xxxxx
        - xxxxx
        - xxxxx
        - .....
    answer:
      pattern:
        - "#...."
        - "##..."
        - "#.#.."
        - "####."
        - "#...#"
    hints:
      - The row above is full except for the last cell.
      - Two full cells above give off. Only far left and far right have exactly one on.
    explanation: This is Pascal's triangle with the odd numbers coloured. Continued, it becomes the Sierpinski triangle.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: The Koch curve starts at 1 m and grows by a factor of 4/3 each step. How long is it after 5 steps? Round to two decimals.
    params:
      unit: m
    answer:
      value: 4.21
      tolerance: 0.01
    feedback:
      - when: abs(numval(state.input) - 2.67) < 0.02
        misconception: linear-growth
        text: "That would be linear: 1 + 5 · 1/3. But the length is multiplied each time."
    hints:
      - Compute $(4/3)^5$.
      - $4^5$ = 1024, $3^5$ = 243.
    explanation: 1024 / 243 ≈ 4.21 m. After 100 steps it would be longer than the way to the Moon – inside a 1 m box.
    difficulty: 2

  - kind: problem
    id: cs-d3
    depth: 2
    widget: numeric
    prompt: The Koch snowflake starts as a triangle of 3 segments. Each step turns every segment into 4. How many segments does it have after {{n}} steps?
    answer:
      value: "{{3 * 4 ** n}}"
    feedback:
      - when: numval(state.input) == 4 ** n
        misconception: forgot-start
        text: You started with one segment. The flake has three.
    hints:
      - Each step multiplies by 4.
      - 3 · $4^{ {{n}} }$.
    explanation: "3 · $4^{ {{n}} }$ = {{3 * 4 ** n}} segments. A program draws it recursively: segment = four smaller segments."
    difficulty: 2
    variants:
      params:
        n: int[1,6]
      defaults:
        n: 3

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "The **fractal dimension** is log(number of copies) / log(scaling factor). For the Sierpinski triangle: 3 copies, each half the size. What is it? To two places. (log 3 / log 2)"
    answer:
      value: 1.58
      tolerance: 0.01
    hints:
      - log 3 ≈ 0.477 and log 2 ≈ 0.301.
    explanation: 1.58 – more than a line, less than a surface. Fractals have fractional dimensions.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: numeric
    prompt: The Koch curve consists of 4 copies, each scaled down by a factor of 3. What is its fractal dimension log 4 / log 3? Round to two decimals.
    answer:
      value: 1.26
      tolerance: 0.01
    hints:
      - log 4 ≈ 0.602, log 3 ≈ 0.477.
      - Divide the two numbers.
    explanation: 0.602 / 0.477 ≈ 1.26. More than a line (1), less than an area (2).
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: "The Sierpinski carpet: a square is cut into 9 parts and the middle one removed. 8 copies at a factor of 3 remain. What is its dimension? Round to two decimals."
    answer:
      value: 1.89
      tolerance: 0.01
    hints:
      - Dimension = log(copies) / log(factor).
      - log 8 / log 3 ≈ 0.903 / 0.477.
    explanation: log 8 / log 3 ≈ 1.89 – almost an area, but not quite.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: In the Sierpinski triangle a quarter of the area is removed each step. What is left after infinitely many steps?
    params:
      options:
        - label: Area 0 – even though infinitely many points remain
          correct: true
        - label: A quarter of the area
          feedback: Another quarter is removed every step.
        - label: Nothing at all
          feedback: All corners and edges remain.
    hints:
      - After n steps $(3/4)^n$ of the area is left.
      - What happens to $(3/4)^n$ for large n?
    explanation: $(3/4)^n$ tends to 0. The fractal has no area – and yet infinitely many points. That is why its dimension lies between 1 and 2.
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: Explain to Lux what a fractal is.
    params:
      keywords:
        - - selbst
          - self
          - kopie
          - copy
          - sich
        - - kleiner
          - smaller
          - verklein
          - scale
        - - immer wieder
          - unendlich
          - forever
          - infinit
          - again
      sample: A fractal contains smaller copies of itself. Each copy again consists of even smaller copies – again and again, in principle infinitely. That is why it can be drawn recursively.
    difficulty: 3

srs:
  cards_from: [dreiecke, koch]
