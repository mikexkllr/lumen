id: cs.recursion.dp
type: concept
title: "Merken statt neu rechnen"
summary: "Dynamische Programmierung: kleine Lösungen merken und zu großen zusammensetzen."
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 13
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: Du hast 37 · 48 mühsam ausgerechnet. Zwei Minuten später fragt jemand dasselbe. Was tust du?
    params:
      options:
        - label: Das Ergebnis vom Zettel ablesen
          correct: true
        - label: Noch einmal rechnen
          feedback: Das wäre doppelte Arbeit.
        - label: Raten
          feedback: Du kennst die Antwort doch schon.
    hints:
      - Du hast es doch schon einmal gelöst.
    explanation: Computer vergessen so etwas – wenn man es ihnen nicht ausdrücklich sagt.

  - kind: explain
    id: c2
    body: "**Dynamische Programmierung** heißt: Teilergebnisse merken und wiederverwenden. Man löst erst die kleinen Fälle und setzt daraus die großen zusammen."

  - kind: problem
    id: c3
    widget: numeric
    prompt: "Eine Treppe, Schritte über 1 oder 2 Stufen. Die Tabelle: Stufe 3 hat 3 Wege, Stufe 4 hat 5, Stufe 5 hat 8. Wie viele Wege führen auf Stufe 6?"
    answer:
      value: 13
    hints:
      - Die zwei letzten Einträge addieren.
    explanation: 5 + 8 = 13. Eine Addition genügt, weil die Tabelle alles Frühere kennt.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Die Tabelle beginnt mit Stufe 1 und 2. Wie viele Additionen brauchst du, um sie bis Stufe 30 zu füllen?
    answer:
      value: 28
    hints:
      - Eine Addition je Stufe – von 3 bis 30.
    explanation: Nur 28. Ohne Merken wären es über eine Million Aufrufe.

  - kind: problem
    id: c5
    widget: order
    prompt: Ordne die Schritte der Methode.
    params:
      items:
        - label: Das Problem in kleinere Teile zerlegen
        - label: Die kleinsten Fälle direkt lösen
        - label: Jedes Ergebnis in einer Tabelle merken
        - label: Große Fälle aus der Tabelle zusammensetzen
    hints:
      - Vom Kleinen zum Großen.
    explanation: Zerlegen, lösen, merken, zusammensetzen.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "In einem Gitter aus 3 × 3 Feldern darfst du nur nach rechts oder unten gehen. Jedes Feld zählt: Wege von oben plus Wege von links. Wie viele Wege führen von oben links nach unten rechts?"
    answer:
      value: 6
    hints:
      - "Erste Zeile und Spalte: überall 1. Die Mitte: 1 + 1 = 2."
    explanation: Die letzte Zeile lautet 1, 3, 6. So zählt man auch Wege durch riesige Gitter.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: Es gibt Münzen mit den Werten 1, 3 und 4. Wie viele Münzen braucht man **mindestens** für den Betrag 6?
    answer:
      value: 2
    hints:
      - Die größte Münze zuerst ist nicht immer am besten.
    explanation: "3 + 3. Wer gierig mit der 4 beginnt, braucht drei Münzen: 4 + 1 + 1."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Warum findet die Tabelle hier die bessere Lösung als »immer die größte Münze«?
    params:
      options:
        - label: Sie kennt für jeden kleineren Betrag schon die beste Lösung
          correct: true
        - label: Sie hat Glück
          feedback: Sie prüft alles systematisch.
        - label: Sie rechnet schneller
          feedback: Es geht um die richtige Antwort, nicht ums Tempo.
    hints:
      - "Für 6 prüft sie: 6 − 1, 6 − 3 und 6 − 4."
    explanation: Gierig entscheidet einmal und bleibt dabei. Die Tabelle vergleicht alle Wege.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: numeric
    prompt: "Du gehst von der linken oberen zur rechten unteren Ecke eines Gitters: {{a}} Schritte nach rechts, {{b}} nach unten, beliebig gemischt. Wie viele Wege gibt es?"
    answer:
      value: "{{c}}"
    hints:
      - "Fülle eine Tabelle: Jedes Feld = Wege von oben + Wege von links."
      - Der Rand hat überall genau 1 Weg.
    explanation: "Es sind {{c}} Wege. Das ist »{{a + b}} über {{a}}«: Man wählt, welche der {{a + b}} Schritte nach rechts gehen."
    difficulty: 2
    variants:
      params:
        a: choice[2,3,4]
        b: int[2,4]
      derive:
        n: a + b
        c: "a == 2 ? n * (n - 1) / 2 : a == 3 ? n * (n - 1) * (n - 2) / 6 : n * (n - 1) * (n - 2) * (n - 3) / 24"
      defaults:
        a: 3
        b: 3

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: "Wie viele Änderungen braucht man mindestens von »KATZE« zu »SATZ«? Erlaubt: Buchstabe einfügen, löschen oder ersetzen."
    answer:
      value: 2
    hints:
      - Ein Buchstabe muss weg – die Längen unterscheiden sich.
      - K wird zu S, das E fällt weg.
    explanation: "Ersetzen und Löschen: 2. Weniger geht nicht, weil schon die Längen und der erste Buchstabe verschieden sind. Diese Editierdistanz berechnet man per DP – so arbeiten Rechtschreibprüfungen."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Ein Rucksack trägt 5 kg. Zur Wahl: A mit 2 kg für 3 €, B mit 3 kg für 4 €, C mit 4 kg für 5 €, D mit 5 kg für 6 €. Welchen Wert kann man höchstens einpacken?"
    params:
      unit: €
    answer:
      value: 7
    hints:
      - Vergleich D allein mit A und B zusammen.
    explanation: A und B wiegen 5 kg und bringen 7 €. Das Rucksackproblem ist ein Klassiker der Methode.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: Wann lohnt sich dynamische Programmierung?
    params:
      options:
        - label: Wenn dieselben Teilprobleme immer wieder auftauchen
          correct: true
        - label: Immer
          feedback: Tauchen keine Teile doppelt auf, bringt das Merken nichts.
        - label: Nur bei Zahlenfolgen
          feedback: Sie hilft auch bei Texten, Wegen und Plänen.
    hints:
      - Was hat das Merken bei Fibonacci gespart?
    explanation: Sie tauscht Speicher gegen Zeit. So vergleichen Programme DNA und korrigieren Tippfehler.
    difficulty: 3

  - kind: explain
    id: cs-x1
    depth: 3
    body: "DP braucht zwei Zutaten. Erstens **optimale Teilstruktur**: Die beste Lösung setzt sich aus besten Teillösungen zusammen. Zweitens überlappende Teilprobleme, die immer wieder auftauchen."

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: Münzen zu 1, 10 und 25 Cent. Wie viele Münzen braucht man mindestens für 30 Cent?
    answer:
      value: 3
    feedback:
      - when: numval(state.input) == 6
        misconception: greedy
        text: Das ist die gierige Lösung 25 + 5 · 1. Ohne die 25 geht es besser.
    hints:
      - Probier es ohne die 25.
      - 10 + 10 + 10.
    explanation: 3 · 10 = 30 mit 3 Münzen. Gierig gäbe 25 + 1 + 1 + 1 + 1 + 1 = 6 Münzen. Die DP-Tabelle findet die 3, weil sie für jeden kleineren Betrag die beste Lösung kennt.
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: choice
    prompt: Die Münz-Tabelle hat einen Eintrag pro Betrag bis B. Für jeden prüft man k Münzsorten. Wie viele Schritte braucht sie?
    params:
      options:
        - label: Etwa B · k
          correct: true
        - label: Etwa $k^B$
          feedback: Das wäre bloßes Ausprobieren aller Kombinationen.
        - label: Etwa B + k
          feedback: Für jeden Betrag prüft man alle k Sorten.
    hints:
      - Zähle Tabelleneinträge mal Arbeit pro Eintrag.
      - B Einträge, je k Vergleiche.
    explanation: "B · k Schritte. Vorsicht: Das ist polynomiell in B, aber B hat nur log₂ B Stellen. Solche Verfahren heißen pseudopolynomiell."
    difficulty: 3

  - kind: problem
    id: cs-x4
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Was macht DP anders als eine schlichte Rekursion?"
    params:
      keywords:
        - - merk
          - tabelle
          - speicher
          - table
          - store
          - memo
        - - einmal
          - nur einmal
          - once
        - - klein
          - small
          - teilproblem
          - subproblem
      sample: Die naive Rekursion rechnet dieselben Teilprobleme immer wieder neu. Dynamische Programmierung löst jedes kleine Teilproblem nur einmal, merkt sich das Ergebnis in einer Tabelle und baut daraus die großen Lösungen.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "d2"]
