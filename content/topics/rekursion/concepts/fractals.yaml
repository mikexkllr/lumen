id: cs.recursion.fractals
type: concept
title: Fraktale
summary: Muster, die in sich selbst stecken.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    id: s1
    body: Ein **Fraktal** enthält sich selbst. Dieses Dreieck besteht aus drei kleineren Kopien – und die wieder aus dreien.
    visual: { widget: pixels, params: { cells: ["#.......", "##......", "#.#.....", "####....", "#...#...", "##..##..", "#.#.#.#.", "########"] } }

  - kind: problem
    id: dreiecke
    widget: numeric
    prompt: Jeder Schritt ersetzt jedes Dreieck durch 3 kleinere. Wie viele kleine Dreiecke gibt es nach {{n}} Schritten?
    params: { unit: Dreiecke }
    answer: { value: "{{3 ** n}}" }
    feedback:
      - when: "numval(state.input) == 3 * n"
        misconception: linear
        text: Jedes Dreieck verdreifacht sich. Das ist malnehmen, nicht addieren.
    hints:
      - 1, 3, 9, 27 …
    explanation: "$3^{ {{n}} } = {{3 ** n}}$."
    variants:
      params: { n: "int[2,6]" }
      defaults: { n: 3 }

  - kind: problem
    id: koch
    widget: numeric
    body: Bei der Koch-Kurve wird jede Linie in vier Stücke ersetzt, jedes ein Drittel so lang.
    prompt: Wie lang ist eine 1 m lange Linie nach 2 Schritten? Runde auf zwei Stellen.
    params: { unit: m }
    answer: { value: 1.78, tolerance: 0.01 }
    feedback:
      - when: "approx(numval(state.input), 4/3)"
        misconception: one-step
        text: Das ist nach einem Schritt. Nimm den Faktor 4/3 zweimal.
    hints:
      - Jeder Schritt multipliziert die Länge mit 4/3.
    explanation: (4/3)² = 16/9 ≈ 1,78 m. Nach unendlich vielen Schritten wird die Linie unendlich lang.

  - kind: problem
    id: natur
    widget: buckets
    prompt: Fraktal oder nicht?
    params:
      buckets: [{ label: fraktal }, { label: nicht fraktal }]
      items:
        - { label: Farnblatt, bucket: fraktal }
        - { label: Romanesco-Kohl, bucket: fraktal }
        - { label: Küstenlinie, bucket: fraktal }
        - { label: Fußball, bucket: nicht fraktal }
        - { label: Ziegelstein, bucket: nicht fraktal }
    hints:
      - Sieht ein Teil aus wie das Ganze?
    explanation: Bei Farn, Romanesco und Küsten wiederholt sich die Form im Kleinen.

  - kind: explain
    id: s5
    body: Wie lang ist die Küste von Großbritannien?
    reveal:
      body: Das hängt vom Lineal ab. Je feiner man misst, desto mehr Buchten zählen mit – die Länge wächst immer weiter. Das fand der Mathematiker Mandelbrot heraus.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Bei der Koch-Kurve wird jede Strecke durch 4 Strecken von je 1/3 Länge ersetzt. Um welchen Faktor wächst die Gesamtlänge pro Schritt? Als Bruch.
    answer:
      value: 4/3
    hints:
      - 4 Stücke, jedes ein Drittel so lang.
    explanation: 4/3. Nach unendlich vielen Schritten ist die Kurve unendlich lang – auf endlichem Raum.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "Die **fraktale Dimension** ist log(Anzahl der Kopien) / log(Verkleinerungsfaktor). Für das Sierpinski-Dreieck: 3 Kopien, je halb so groß. Wie groß ist sie? Auf zwei Stellen. (log 3 / log 2)"
    answer:
      value: 1.58
      tolerance: 0.01
    hints:
      - log 3 ≈ 0,477 und log 2 ≈ 0,301.
    explanation: 1,58 – mehr als eine Linie, weniger als eine Fläche. Fraktale haben gebrochene Dimensionen.
    difficulty: 3

srs:
  cards_from: [dreiecke, koch]
