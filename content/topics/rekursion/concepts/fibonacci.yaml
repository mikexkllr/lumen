id: cs.recursion.fibonacci
type: concept
title: Treppen und Kaninchen
summary: Jede Zahl aus den zwei davor.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: folge
    widget: numeric
    prompt: "Jede Zahl ist die Summe der zwei davor: 1, 1, 2, 3, 5, 8, 13, … Welche kommt nach 13?"
    params: { placeholder: "Zahl" }
    answer: { value: 21 }
    hints:
      - 8 + 13.
    explanation: 8 + 13 = 21. Das ist die **Fibonacci-Folge**.

  - kind: problem
    id: regel
    widget: numeric
    prompt: Eine Folge nach derselben Regel endet mit {{a}} und {{b}}. Was kommt als Nächstes?
    params: { placeholder: "Zahl" }
    answer: { value: "{{a + b}}" }
    hints:
      - Addiere die letzten beiden.
    explanation: "{{a}} + {{b}} = {{a + b}}."
    variants:
      params: { a: "int[10,60]", b: "int[20,90]" }
      defaults: { a: 34, b: 55 }

  - kind: explain
    id: s3
    body: |
      Du steigst eine **Treppe** und nimmst 1 oder 2 Stufen auf einmal. Bis Stufe n kommst du von Stufe n − 1 oder von Stufe n − 2. Also gilt: Wege(n) = Wege(n − 1) + Wege(n − 2).

  - kind: problem
    id: treppe
    widget: numeric
    prompt: Stufe 1 hat 1 Weg, Stufe 2 hat 2 Wege. Wie viele Wege führen auf Stufe 5?
    params: { unit: Wege }
    answer: { value: 8 }
    hints:
      - Stufe 3 hat 1 + 2 = 3 Wege. Mach weiter.
    explanation: 1, 2, 3, 5, 8 – wieder Fibonacci.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Die naive Rekursion fib(n) = fib(n − 1) + fib(n − 2) wird für fib(5) gestartet. Wie viele Aufrufe gibt es insgesamt – den ersten mitgezählt?
    answer:
      value: 9
    hints:
      - Aufrufe(n) = Aufrufe(n − 1) + Aufrufe(n − 2) + 1, mit je 1 für n = 1 und n = 2.
    explanation: 1, 1, 3, 5, 9. Die Zahl der Aufrufe wächst selbst wie die Fibonacci-Folge – exponentiell.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Die naive Fibonacci-Rekursion braucht für fib(50) Milliarden Aufrufe. Wie macht man sie blitzschnell?
    params:
      options:
        - label: Bereits berechnete Werte merken und wiederverwenden
          correct: true
        - label: Einen schnelleren Computer kaufen
          feedback: Der Aufwand wächst exponentiell – Hardware hilft nicht.
        - label: Die Abbruchbedingung weglassen
          feedback: Dann endet die Rekursion gar nicht.
    hints:
      - fib(48) wird immer wieder neu berechnet. Muss das sein?
    explanation: "**Memoisation** macht aus Milliarden Aufrufen 50. Die Grundidee der **dynamischen Programmierung**."
    difficulty: 3

srs:
  cards_from: [regel, treppe]
