id: cs.recursion.fibonacci
type: concept
title: Treppen und Kaninchen
summary: Jede Zahl aus den zwei davor.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: folge
    widget: numeric
    prompt: "Jede Zahl ist die Summe der zwei davor: 1, 1, 2, 3, 5, 8, 13, … Welche kommt nach 13?"
    params: { placeholder: "Zahl" }
    answer: { value: 21 }
    hints:
      - 8 + 13.
    explanation: 8 + 13 = 21. Das ist die **Fibonacci-Folge**.

  - kind: problem
    id: regel
    widget: numeric
    prompt: Eine Folge nach derselben Regel endet mit {{a}} und {{b}}. Was kommt als Nächstes?
    params: { placeholder: "Zahl" }
    answer: { value: "{{a + b}}" }
    hints:
      - Addiere die letzten beiden.
    explanation: "{{a}} + {{b}} = {{a + b}}."
    variants:
      params: { a: "int[10,60]", b: "int[20,90]" }
      defaults: { a: 34, b: 55 }

  - kind: explain
    body: |
      Du steigst eine Treppe und nimmst 1 oder 2 Stufen auf einmal. Bis Stufe n kommst du von Stufe n − 1 oder von Stufe n − 2. Also gilt: Wege(n) = Wege(n − 1) + Wege(n − 2).

  - kind: problem
    id: treppe
    widget: numeric
    prompt: Stufe 1 hat 1 Weg, Stufe 2 hat 2 Wege. Wie viele Wege führen auf Stufe 5?
    params: { unit: Wege }
    answer: { value: 8 }
    hints:
      - Stufe 3 hat 1 + 2 = 3 Wege. Mach weiter.
    explanation: 1, 2, 3, 5, 8 – wieder Fibonacci.

srs:
  cards_from: [regel, treppe]
