id: cs.recursion.towers
type: concept
title: Thinking recursively about Hanoi
summary: Solve n with the help of n − 1.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 12
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: The end of the world
    body: Legend says monks are moving a tower of 64 golden disks. When they finish, the world ends. Try it with **three disks**. How many moves do you need?
    visual:
      widget: hanoi
      interactive: true
      params:
        disks: 3

  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how many moves does the Tower of Hanoi with 10 discs need at least?"
    params:
      min: 10
      max: 5000
    answer:
      value: 1023
      tolerance: 200
    explanation: 1023 – that is 2¹⁰ − 1. Every additional disc doubles the effort.

  - kind: explain
    id: s1
    body: |
      Thought of recursively, Hanoi is simple: move the tower of n − 1 **disks** aside. Then the largest to the goal. Then the small tower on top.

  - kind: problem
    id: vier
    widget: hanoi
    prompt: Try it with four disks – think in towers, not in disks.
    params: { disks: 4 }
    hints:
      - First three disks to B. That is a smaller Hanoi.
    explanation: If you think recursively, you never need to remember more than one step.

  - kind: problem
    id: formel
    widget: numeric
    body: For n disks, T(n) = 2 · T(n − 1) + 1.
    prompt: T({{n}}) is {{t}}. What is T({{n + 1}})?
    params: { unit: moves }
    answer: { value: "{{2 * t + 1}}" }
    feedback:
      - when: "numval(state.input) == 2 * t"
        misconception: forget-plus-one
        text: Do not forget the one move for the largest disk.
    hints:
      - "Move the small tower twice, the big disk once."
    explanation: "2 · {{t}} + 1 = {{2 * t + 1}}."
    variants:
      params: { n: "int[3,7]" }
      derive: { t: "2 ** n - 1" }
      defaults: { n: 4 }

  - kind: problem
    id: wie-oft
    widget: choice
    prompt: How often does the largest disk move in the best solution?
    params:
      options:
        - { label: Exactly once, correct: true }
        - { label: As often as the smallest, feedback: "The smallest moves constantly. The largest moves only once." }
        - { label: Twice, feedback: "One move is enough when the path is clear." }
    hints:
      - When is it even allowed to move?
    explanation: The largest disk moves exactly once – when all the others are on the spare peg.

  - kind: explain
    id: s5
    body: This sounds like a trick. Where does it show up in daily life?
    reveal:
      body: Folders hold folders. Sentences hold clauses. Mirrors show mirrors. Programs search folders this way.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: According to legend monks move a tower of 64 discs, one per second. How many digits does the number of seconds needed (2⁶⁴ − 1) have?
    answer:
      value: 20
    hints:
      - 2¹⁰ ≈ 10³, so 2⁶⁴ ≈ 16 · 10¹⁸.
    explanation: 1.8 · 10¹⁹ seconds – about 585 billion years, 40 times the age of the universe.
    difficulty: 2

  - kind: problem
    id: cs-d1
    depth: 2
    widget: hanoi
    prompt: Four disks in at most 15 moves – this time onto the middle peg.
    params:
      disks: 4
      target: 1
      maxMoves: 15
    hints:
      - Where must the top three go so the largest can move to the middle?
      - Three disks to the right, the largest to the middle, then the three on top.
    explanation: 7 + 1 + 7 = 15 moves. The target does not change the idea.
    difficulty: 2

  - kind: problem
    id: cs-d2
    depth: 2
    widget: numeric
    prompt: How often does the smallest disk move in the best solution with {{n}} disks?
    answer:
      value: "{{2 ** (n - 1)}}"
    feedback:
      - when: numval(state.input) == 2 ** n - 1
        misconception: all-moves
        text: That is all the moves together. The smallest makes exactly every other one.
    hints:
      - "Try it with 2 disks: how often does the small one move?"
      - Every other move belongs to the smallest disk.
    explanation: Of $2^{ {{n}} }$ − 1 moves, {{2 ** (n - 1)}} belong to the smallest – moves 1, 3, 5 …
    difficulty: 2
    variants:
      params:
        n: int[3,10]
      defaults:
        n: 5

  - kind: problem
    id: cs-d3
    depth: 2
    widget: choice
    prompt: "A trick without recursion: the smallest disk always moves on round the circle. What do you do on every other move?"
    params:
      options:
        - label: The only legal move that does not involve the smallest disk
          correct: true
        - label: Move the largest disk
          feedback: The largest moves only once.
        - label: Any move
          feedback: There is exactly one legal move at that point.
    hints:
      - The smallest is on one peg. Which other disks can move?
      - Between the other two pegs only one direction is allowed.
    explanation: The smaller of the other two top disks may go onto the larger. This yields the same move sequence as the recursion.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why can it **not** be done faster than 2ⁿ − 1 moves?
    params:
      options:
        - label: To move the largest disc all others must first be stacked elsewhere – and afterwards put back on top
          correct: true
        - label: It can be faster, it just has not been found yet
          feedback: The minimum is proven.
        - label: Because you only have one hand
          feedback: The rule “one disc per move” is part of the puzzle.
    hints:
      - T(n) = 2 · T(n − 1) + 1. Why **twice**?
    explanation: Twice the small tower plus one move for the large disc. The recursion **is** the proof.
    difficulty: 3

  - kind: problem
    id: cs-x1
    depth: 3
    widget: choice
    prompt: "Proof by induction: assume T(n − 1) = $2^{n-1}$ − 1. What does T(n) = 2 · T(n − 1) + 1 give?"
    params:
      options:
        - label: $2^n$ − 1
          correct: true
        - label: $2^n$ + 1
          feedback: 2 · (−1) + 1 = −1, not +1.
        - label: $2^{n-1}$
          feedback: The 2 in front raises the exponent.
    hints:
      - "Multiply out: 2 · ($2^{n-1}$ − 1)."
      - $2^n$ − 2 + 1.
    explanation: 2 · $2^{n-1}$ − 2 + 1 = $2^n$ − 1. With T(1) = 1 as the start, the formula holds for every n.
    difficulty: 3

  - kind: problem
    id: cs-x2
    depth: 3
    widget: numeric
    prompt: A fourth peg makes it faster. What is the minimum number of moves for 3 disks on 4 pegs?
    answer:
      value: 5
    feedback:
      - when: numval(state.input) == 7
        misconception: three-pegs
        text: That is the 3-peg solution. The fourth peg saves moves.
    hints:
      - With two free pegs every small disk can get a peg of its own.
      - Small away, medium away, large to the target, then back.
    explanation: "Small, medium, large, medium, small: 5 moves. For any number of pegs the best count is still only partly proven."
    difficulty: 3

  - kind: problem
    id: cs-x3
    depth: 3
    widget: teach
    prompt: Explain to Lux the recursive solution of the Tower of Hanoi.
    params:
      keywords:
        - - n − 1
          - n-1
          - kleiner turm
          - smaller tower
          - kleineren
        - - größte
          - largest
          - biggest
          - unterste
          - bottom
        - - obendrauf
          - darauf
          - on top
          - zurück
          - back
      sample: To move n disks, I first move the smaller tower of n − 1 disks aside. Then the largest disk to the target. Then the small tower back on top. The smaller tower works the same way.
    difficulty: 3

srs:
  cards_from: [formel, wie-oft]
