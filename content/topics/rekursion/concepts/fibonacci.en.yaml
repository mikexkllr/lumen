id: cs.recursion.fibonacci
type: concept
title: Stairs and rabbits
summary: Each number from the two before it.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: folge
    widget: numeric
    prompt: "Each number is the sum of the two before it: 1, 1, 2, 3, 5, 8, 13, … Which comes after 13?"
    params: { placeholder: "Number" }
    answer: { value: 21 }
    hints:
      - 8 + 13.
    explanation: 8 + 13 = 21. This is the **Fibonacci sequence**.

  - kind: problem
    id: regel
    widget: numeric
    prompt: A sequence following the same rule ends with {{a}} and {{b}}. What comes next?
    params: { placeholder: "Number" }
    answer: { value: "{{a + b}}" }
    hints:
      - Add the last two.
    explanation: "{{a}} + {{b}} = {{a + b}}."
    variants:
      params: { a: "int[10,60]", b: "int[20,90]" }
      defaults: { a: 34, b: 55 }

  - kind: explain
    id: s3
    body: |
      You climb a staircase and take 1 or 2 steps at a time. You reach step n from step n − 1 or from step n − 2. So: ways(n) = ways(n − 1) + ways(n − 2).

  - kind: problem
    id: treppe
    widget: numeric
    prompt: Step 1 has 1 way, step 2 has 2 ways. How many ways lead to step 5?
    params: { unit: ways }
    answer: { value: 8 }
    hints:
      - Step 3 has 1 + 2 = 3 ways. Keep going.
    explanation: 1, 2, 3, 5, 8 – Fibonacci again.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The naive recursion fib(n) = fib(n − 1) + fib(n − 2) is started for fib(5). How many calls are there in total – counting the first?
    answer:
      value: 9
    hints:
      - Calls(n) = calls(n − 1) + calls(n − 2) + 1, with 1 each for n = 1 and n = 2.
    explanation: 1, 1, 3, 5, 9. The number of calls itself grows like the Fibonacci sequence – exponentially.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The naive Fibonacci recursion needs billions of calls for fib(50). How do you make it lightning fast?
    params:
      options:
        - label: Remember values already computed and reuse them
          correct: true
        - label: Buy a faster computer
          feedback: The effort grows exponentially – hardware does not help.
        - label: Leave out the base case
          feedback: Then the recursion never ends.
    hints:
      - fib(48) is recomputed again and again. Is that necessary?
    explanation: "**Memoisation** turns billions of calls into 50. The basic idea of **dynamic programming**."
    difficulty: 3

srs:
  cards_from: [regel, treppe]
