id: cs.recursion.fibonacci
type: concept
title: Stairs and rabbits
summary: Each number from the two before it.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: folge
    widget: numeric
    prompt: "Each number is the sum of the two before it: 1, 1, 2, 3, 5, 8, 13, … Which comes after 13?"
    params: { placeholder: "Number" }
    answer: { value: 21 }
    hints:
      - 8 + 13.
    explanation: 8 + 13 = 21. This is the **Fibonacci sequence**.

  - kind: problem
    id: regel
    widget: numeric
    prompt: A sequence following the same rule ends with {{a}} and {{b}}. What comes next?
    params: { placeholder: "Number" }
    answer: { value: "{{a + b}}" }
    hints:
      - Add the last two.
    explanation: "{{a}} + {{b}} = {{a + b}}."
    variants:
      params: { a: "int[10,60]", b: "int[20,90]" }
      defaults: { a: 34, b: 55 }

  - kind: explain
    body: |
      You climb a staircase and take 1 or 2 steps at a time. You reach step n from step n − 1 or from step n − 2. So: ways(n) = ways(n − 1) + ways(n − 2).

  - kind: problem
    id: treppe
    widget: numeric
    prompt: Step 1 has 1 way, step 2 has 2 ways. How many ways lead to step 5?
    params: { unit: ways }
    answer: { value: 8 }
    hints:
      - Step 3 has 1 + 2 = 3 ways. Keep going.
    explanation: 1, 2, 3, 5, 8 – Fibonacci again.

srs:
  cards_from: [regel, treppe]
