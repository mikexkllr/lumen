id: cs.recursion.basecase
type: concept
title: When does it stop?
summary: Without a stopping rule, recursion runs forever.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: fehlt
    widget: choice
    body: "countdown(n): say n, then call countdown(n − 1)."
    prompt: What happens with countdown(3)?
    params:
      options:
        - { label: "3, 2, 1, 0, −1, … without end", correct: true }
        - { label: "3, 2, 1 and done", feedback: "Nothing tells the function to stop at 1." }
    hints:
      - Where does it say it should stop?
    explanation: The **base case** is missing – for example “stop at 0”.

  - kind: explain
    body: |
      Every recursion needs two parts: a **base case** that answers right away, and a **step** that makes the problem smaller.

  - kind: problem
    id: fakultaet
    widget: numeric
    body: "fact(1) = 1 and fact(n) = n · fact(n − 1)."
    prompt: What is fact(5)?
    params: { placeholder: "Number" }
    answer: { value: 120 }
    hints:
      - fact(2) = 2, fact(3) = 6 …
    explanation: 5 · 4 · 3 · 2 · 1 = 120.

  - kind: problem
    id: wo
    widget: buckets
    prompt: Where is recursion hiding?
    params:
      buckets: [{ label: recursive }, { label: not recursive }]
      items:
        - { label: Folders inside folders, bucket: recursive }
        - { label: Nesting dolls, bucket: recursive }
        - { label: Two mirrors facing each other, bucket: recursive }
        - { label: A shopping list, bucket: not recursive }
        - { label: A class schedule, bucket: not recursive }
    hints:
      - Does the thing contain a smaller version of itself?
    explanation: Anything that contains itself on a smaller scale is recursive.

srs:
  cards_from: [fehlt, fakultaet]
