id: cs.recursion.dp
type: concept
title: "Remember instead of recomputing"
summary: "Dynamic programming: remember small solutions and build big ones from them."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: c1
    widget: choice
    prompt: You have laboriously worked out 37 · 48. Two minutes later someone asks the same. What do you do?
    params:
      options:
        - label: Read the result off your note
          correct: true
        - label: Calculate again
          feedback: That would be double work.
        - label: Guess
          feedback: You already know the answer.
    hints:
      - You have solved it once already.
    explanation: Computers forget such things – unless you tell them explicitly.

  - kind: explain
    id: c2
    body: "**Dynamic programming** means: remember partial results and reuse them. You first solve the small cases and build the big ones from them."

  - kind: problem
    id: c3
    widget: numeric
    prompt: "A staircase, steps over 1 or 2 stairs. The table: stair 3 has 3 ways, stair 4 has 5, stair 5 has 8. How many ways lead to stair 6?"
    answer:
      value: 13
    hints:
      - Add the last two entries.
    explanation: 5 + 8 = 13. One addition is enough because the table knows everything before.

  - kind: problem
    id: c4
    widget: numeric
    prompt: The table starts with stairs 1 and 2. How many additions do you need to fill it up to stair 30?
    answer:
      value: 28
    hints:
      - One addition per stair – from 3 to 30.
    explanation: Only 28. Without remembering it would be over a million calls.

  - kind: problem
    id: c5
    widget: order
    prompt: Order the steps of the method.
    params:
      items:
        - label: Split the problem into smaller parts
        - label: Solve the smallest cases directly
        - label: Remember each result in a table
        - label: Build big cases from the table
    hints:
      - From small to large.
    explanation: Split, solve, remember, build.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: "In a grid of 3 × 3 cells you may only move right or down. Each cell counts: ways from above plus ways from the left. How many ways lead from top left to bottom right?"
    answer:
      value: 6
    hints:
      - "First row and column: 1 everywhere. The middle: 1 + 1 = 2."
    explanation: The last row reads 1, 3, 6. That is how ways through huge grids are counted too.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: There are coins with the values 1, 3 and 4. How many coins do you need **at least** for the amount 6?
    answer:
      value: 2
    hints:
      - The largest coin first is not always best.
    explanation: "3 + 3. Whoever greedily starts with the 4 needs three coins: 4 + 1 + 1."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: Why does the table find the better solution here than “always the largest coin”?
    params:
      options:
        - label: It already knows the best solution for every smaller amount
          correct: true
        - label: It is lucky
          feedback: It checks everything systematically.
        - label: It calculates faster
          feedback: It is about the right answer, not speed.
    hints:
      - "For 6 it checks: 6 − 1, 6 − 3 and 6 − 4."
    explanation: Greedy decides once and sticks to it. The table compares all paths.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: "A rucksack carries 5 kg. On offer: A with 2 kg for €3, B with 3 kg for €4, C with 4 kg for €5, D with 5 kg for €6. What is the highest value you can pack?"
    params:
      unit: €
    answer:
      value: 7
    hints:
      - Compare D alone with A and B together.
    explanation: A and B weigh 5 kg and give €7. The knapsack problem is a classic of the method.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: choice
    prompt: When is dynamic programming worthwhile?
    params:
      options:
        - label: When the same subproblems come up again and again
          correct: true
        - label: Always
          feedback: If no parts recur, remembering gains nothing.
        - label: Only for number sequences
          feedback: It also helps with texts, routes and plans.
    hints:
      - What did remembering save with Fibonacci?
    explanation: It trades memory for time. That is how programs compare DNA and fix typos.
    difficulty: 3

srs:
  cards_from: ["c3", "d1", "d2"]
