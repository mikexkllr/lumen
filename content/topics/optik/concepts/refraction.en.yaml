id: sci.optics.refraction
type: concept
title: Refraction
summary: Light changes direction.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: strohhalm
    widget: choice
    prompt: Why does a straw in a glass of water look bent?
    params:
      options:
        - { label: Light changes direction as it passes from water to air., correct: true }
        - { label: The water bends the straw., feedback: "Pull it out – it is straight. The light is bent." }
    hints:
      - What happens to light at the water surface?
    explanation: This is called **refraction**.

  - kind: explain
    id: s2
    body: |
      In water and glass, light is **slower** than in air. When it hits the boundary at an angle, it bends. The **refractive index** n says how many times slower: light travels at $c / n$ there.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: A material has a refractive index of {{n}}. How fast is light in it, if light travels 300,000 km/s in a vacuum?
    params: { unit: km/s }
    answer: { value: "{{300000 / n}}" }
    hints:
      - "300,000 ÷ {{n}}."
    explanation: "300,000 ÷ {{n}} = {{300000 / n}} km/s."
    variants:
      params: { n: "choice[1.25,1.5,2,2.4]" }
      defaults: { n: 1.5 }

  - kind: problem
    id: regenbogen
    widget: choice
    prompt: How does a rainbow form?
    params:
      options:
        - { label: Water droplets bend each color a little differently., correct: true }
        - { label: The clouds are colored., feedback: "The colors are in the white sunlight itself." }
    hints:
      - White light is made of all colors.
    explanation: Blue is bent more than red – the light fans out.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order by the speed of light – from fastest to slowest.
    params:
      items:
        - label: Vacuum
        - label: Water
        - label: Glass
        - label: Diamond
    hints:
      - The larger the refractive index, the slower the light.
    explanation: In diamond light is less than half as fast. That is why it sparkles so much.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Glass has a refractive index of 1.5, water 1.33. By what percent is light faster in water than in glass? Rounded.
    params:
      unit: "%"
    answer:
      value: 13
      tolerance: 1
    hints:
      - The speed is c/n. Compare 1/1.33 with 1/1.5.
    explanation: 1.5 ÷ 1.33 ≈ 1.13 – about 13% faster.
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Snell's **law of refraction** reads $n_1 \sin\alpha_1 = n_2 \sin\alpha_2$. Angles are measured from the normal. In the denser material with larger n the ray runs steeper, closer to the normal.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Light passes from air (n = 1) at 30° to the normal into glass (n = 1.5). At what angle does it continue in the glass? To one decimal place.
    params:
      unit: °
    answer:
      value: 19.5
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 20) < 0.01
        misconception: divide-angles
        text: Close – but you do not divide the angles directly. Divide the sine first.
      - when: abs(numval(state.input) - 48.6) < 0.5
        misconception: away-from-normal
        text: In glass the ray bends **towards** the normal. The angle gets smaller.
    hints:
      - sin α₂ = sin 30° ÷ 1.5 = 0.5 ÷ 1.5.
      - Which angle has a sine of 0.333?
    explanation: sin α₂ = 0.333, so α₂ ≈ 19.5°. The ray bends towards the normal because it is slower in glass.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: A pool is 2 m deep. Seen from above it looks shallower by the factor n = 1.33. How deep does it appear? In m, to one decimal place.
    params:
      unit: m
    answer:
      value: 1.5
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - 2.66) < 0.05
        misconception: deeper
        text: The water makes the bottom look **higher**, not deeper.
    hints:
      - "Shallower means: divided by 1.33."
      - 2 ÷ 1.33 = ?
    explanation: 2 ÷ 1.33 ≈ 1.5 m. People jumping in get a surprise. Fish are not where they appear either – that is why spear fishers aim lower.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Light travels from water very flatly towards the surface. What happens beyond a certain angle?
    params:
      options:
        - label: It is reflected completely – total internal reflection
          correct: true
        - label: It always exits, just bent more
          feedback: The refracted ray would have to bend beyond 90° – impossible.
        - label: It is swallowed by the water
          feedback: The energy is not lost, it stays in the water.
    hints:
      - On exit the ray is bent **away** from the normal. What when 90° is reached?
    explanation: For water the **critical angle** is 49°. That is why the surface shines like a mirror from below.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Why does Snell's law hold? A **wavefront** hits glass at a slant. One end is slowed first. In the same time it covers only $v_2 t$ in the glass instead of $v_1 t$. The geometry gives $\frac{\sin\alpha_1}{\sin\alpha_2} = \frac{v_1}{v_2}$.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Light travels from glass (n = 1.5) into air. Beyond what angle to the normal is it totally reflected? We have sin θ = 1 ÷ n. To one decimal place.
    params:
      unit: °
    answer:
      value: 41.8
      tolerance: 0.3
    hints:
      - sin θ = 1 ÷ 1.5 = 0.667.
      - Which angle has a sine of 0.667?
    explanation: θ ≈ 41.8°. Light hitting more obliquely cannot get out. Diamond (n = 2.4) has only 24.6° – which is why it sparkles so much.
    difficulty: 3

srs:
  cards_from: [strohhalm, regenbogen]
