id: sci.optics.mirrors
type: concept
title: Mirrors
summary: Angle of incidence equals angle of reflection.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Take a guess: how tall must a mirror be at least for you to see all of yourself – in percent of your height?"
    params:
      min: 0
      max: 150
      unit: "%"
    answer:
      value: 50
      tolerance: 8
    explanation: Half is enough – no matter how far away you stand.

  - kind: explain
    id: s1
    body: |
      A **mirror** reflects light so that the **angle of incidence equals the angle of reflection** – measured from the normal, the perpendicular to the mirror.

  - kind: problem
    id: winkel
    widget: numeric
    prompt: A light ray hits a mirror at {{a}}° to the normal. At what angle is it reflected?
    params: { unit: "°" }
    answer: { value: "{{a}}" }
    hints:
      - Angle of incidence equals angle of reflection.
    explanation: "Also {{a}}° – on the other side of the normal."
    variants:
      params: { a: "int[10,80]" }
      defaults: { a: 35 }

  - kind: problem
    id: groesse
    widget: numeric
    prompt: You are {{h}} cm tall. How tall must a wall mirror be at least for you to see your whole self?
    params: { unit: cm }
    answer: { value: "{{h / 2}}" }
    hints:
      - Try rays from your head and your feet to your eyes.
    explanation: "Half – {{h / 2}} cm, no matter how far away you stand."
    variants:
      params: { h: "choice[160,170,180,190]" }
      defaults: { h: 180 }

  - kind: problem
    id: seiten
    widget: choice
    prompt: What does a mirror actually swap?
    params:
      options:
        - { label: Front and back, correct: true }
        - { label: Left and right, feedback: "Your left hand stays on the left in the image – what flips is depth." }
    hints:
      - Point to the side with your right hand. Which side is it on in the mirror?
    explanation: The mirror flips the direction toward the mirror – that is why the image looks reversed.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Lightning round: true or false?"
    params:
      cards:
        - text: Your reflection is as far behind the mirror as you are in front.
          right: true
        - text: A mirror swaps left and right.
          right: false
          why: It swaps front and back. Your left hand stays on the left.
        - text: Angle of incidence and angle of reflection are equal.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Two mirrors stand at a right angle. A ray hits the first at 30° to the normal. By how many degrees is it deflected in total after **both** reflections?
    params:
      unit: °
    answer:
      value: 180
    hints:
      - Try another angle – the result does not change.
    explanation: "Always 180°: the ray goes straight back. That is how bicycle reflectors and the mirrors on the Moon work."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "**Fermat’s principle** explains reflection and refraction at once. What does it say?"
    params:
      options:
        - label: Light takes the path that needs the least time
          correct: true
        - label: Light always takes the shortest path
          feedback: In refraction the fastest path is not the shortest.
        - label: Light always moves straight
          feedback: At boundaries it bends.
    hints:
      - A lifeguard runs far along the beach before jumping into the water.
    explanation: "Like the lifeguard: more distance in the fast medium, less in the slow one. The law of refraction follows from this."
    difficulty: 3

srs:
  cards_from: [winkel, seiten]
