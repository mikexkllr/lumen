id: sci.optics.lenses
type: concept
title: Linsen
summary: Licht bündeln und zerstreuen.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Mit einer Lupe kann man in der Sonne Papier anzünden. Was macht die Lupe mit dem Licht?
    params:
      options:
        - label: Sie bündelt es auf einen Punkt
          correct: true
        - label: Sie macht mehr Licht
          feedback: Eine Linse erzeugt kein Licht.
        - label: Sie färbt es
          feedback: Das Licht bleibt weiß.
    hints:
      - Achte auf den hellen Fleck.
    explanation: "Dieser Punkt hat einen Namen: der Brennpunkt."

  - kind: explain
    id: s1
    body: |
      Eine **Sammellinse** ist in der Mitte dicker und bündelt parallele Strahlen in einem Punkt, dem **Brennpunkt**. Eine **Zerstreuungslinse** ist in der Mitte dünner und fächert Licht auf.

  - kind: problem
    id: art
    widget: buckets
    prompt: Sammellinse oder Zerstreuungslinse?
    params:
      buckets: [{ label: Sammellinse }, { label: Zerstreuungslinse }]
      items:
        - { label: Lupe, bucket: Sammellinse }
        - { label: Kameraobjektiv, bucket: Sammellinse }
        - { label: Brille bei Weitsicht, bucket: Sammellinse }
        - { label: Brille bei Kurzsicht, bucket: Zerstreuungslinse }
    hints:
      - Kurzsichtige Augen bündeln zu stark.
    explanation: Bei Kurzsicht liegt der Brennpunkt zu weit vorn – eine Zerstreuungslinse schiebt ihn zurück.

  - kind: problem
    id: dioptrie
    widget: numeric
    prompt: Die Stärke einer Linse in Dioptrien ist 1 geteilt durch die Brennweite in Metern. Welche Stärke hat eine Linse mit {{f}} m Brennweite?
    params: { unit: dpt }
    answer: { value: "{{1 / f}}" }
    hints:
      - "1 : {{f}}."
    explanation: "1 : {{f}} = {{1 / f}} Dioptrien."
    variants:
      params: { f: "choice[0.25,0.5,1,2]" }
      defaults: { f: 0.5 }

  - kind: problem
    id: feuer
    widget: choice
    prompt: Warum kann man mit einer Lupe Papier anzünden?
    params:
      options:
        - { label: Sie bündelt das Sonnenlicht auf einen winzigen Fleck., correct: true }
        - { label: Glas erzeugt Wärme., feedback: "Das Glas selbst bleibt kühl – es konzentriert nur das Licht." }
    hints:
      - Was passiert im Brennpunkt?
    explanation: Viel Licht auf kleiner Fläche – daher der Name Brennpunkt.

  - kind: problem
    id: c1
    widget: sim
    prompt: Die Linse hat 10 cm Brennweite. Schieb den Gegenstand so, dass das Bild **genauso groß** ist wie er selbst.
    params:
      scene: lens
      controls:
        focal:
          value: 10
          fixed: true
    answer:
      magnification: 1
    explanation: "Bei doppelter Brennweite: 20 cm. Dann ist auch das Bild 20 cm entfernt."

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Bau einen Projektor: Das Bild soll **doppelt so groß** sein wie der Gegenstand."
    params:
      scene: lens
    answer:
      magnification: 2
    explanation: Der Gegenstand muss zwischen einfacher und doppelter Brennweite stehen, etwa 12 cm bei f = 8 cm.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "Die Linsengleichung: $\\frac{1}{f} = \\frac{1}{g} + \\frac{1}{b}$. Ein Gegenstand steht 30 cm vor einer Linse mit f = 10 cm. Wo entsteht das Bild?"
    params:
      unit: cm
    answer:
      value: 15
    hints:
      - 1/b = 1/10 − 1/30.
    explanation: 1/b = 2/30, also b = 15 cm.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Eine Linse hat 10 cm Brennweite. Ein Gegenstand steht {{g}} cm davor. In welchem Abstand hinter der Linse entsteht das Bild? Nutze 1/f = 1/g + 1/b.
    params:
      unit: cm
    answer:
      value: "{{g * 10 / (g - 10)}}"
    feedback:
      - when: numval(state.input) == g - 10
        misconception: subtract-distances
        text: "Man zieht nicht die Abstände ab, sondern die Kehrwerte: 1/b = 1/f − 1/g."
    hints:
      - 1/b = 1/10 − 1/{{g}}.
      - Bilde den Kehrwert des Ergebnisses.
    explanation: "b = g · f : (g − f) = {{g * 10 / (g - 10)}} cm. Je näher der Gegenstand am Brennpunkt, desto weiter weg und größer das Bild."
    difficulty: 2
    variants:
      params:
        g: choice[15,20,30,60]
      defaults:
        g: 15

  - kind: problem
    id: ph-d2
    depth: 2
    widget: sim
    prompt: "Mach eine Kamera: Das Bild soll halb so groß sein wie der Gegenstand."
    params:
      scene: lens
    answer:
      magnification:
        - 0.48
        - 0.52
    explanation: Halbe Größe gibt es, wenn der Gegenstand dreimal so weit weg ist wie die Brennweite, etwa 30 cm bei f = 10 cm. Kameras machen Bilder fast immer kleiner.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Der Gegenstand rückt **näher** an die Linse als die Brennweite. Was passiert?
    params:
      options:
        - label: Es entsteht kein Bild auf dem Schirm – man sieht durch die Linse ein vergrößertes, aufrechtes Bild
          correct: true
        - label: Das Bild wird winzig klein
          feedback: Es wird größer – so arbeitet eine Lupe.
        - label: Das Bild entsteht direkt auf der Linse
          feedback: Die Strahlen laufen hinter der Linse auseinander.
    hints:
      - So benutzt du eine Lupe.
    explanation: "Ein **virtuelles Bild**: Die Strahlen scheinen von einem Punkt hinter dem Gegenstand zu kommen."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Im Auge ist der Abstand zur Netzhaut fest. Um scharf zu stellen, ändert die Augenlinse ihre Brennweite – das heißt **Akkommodation**. Im Alter wird die Linse steif. Dann hilft eine Lesebrille.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Ein Auge kann höchstens auf 50 cm Nähe scharf stellen. Du willst in 25 cm Abstand lesen. Welche Brillenstärke brauchst du? Rechne D = 1/0,25 m − 1/0,5 m.
    params:
      unit: dpt
    answer:
      value: 2
    hints:
      - "1 : 0,25 = 4 und 1 : 0,5 = 2."
      - Die Differenz ist die nötige Zusatzstärke.
    explanation: 4 − 2 = +2 Dioptrien. Die Sammellinse übernimmt, was die Augenlinse nicht mehr schafft. Kurzsichtige brauchen dagegen Zerstreuungslinsen mit Minus.
    difficulty: 3

srs:
  cards_from: [art, dioptrie]
