id: sci.optics.mirrors
type: concept
title: Spiegel
summary: Einfallswinkel gleich Ausfallswinkel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie hoch muss ein Spiegel mindestens sein, damit du dich ganz siehst – in Prozent deiner Körpergröße?"
    params:
      min: 0
      max: 150
      unit: "%"
    answer:
      value: 50
      tolerance: 8
    explanation: Die Hälfte reicht – egal, wie weit du weg stehst.

  - kind: explain
    id: s1
    body: |
      An einem **Spiegel** wird Licht so zurückgeworfen, dass **Einfallswinkel und Ausfallswinkel gleich** sind – gemessen zum Lot, der Senkrechten auf dem Spiegel.

  - kind: problem
    id: winkel
    widget: numeric
    prompt: Ein Lichtstrahl trifft mit {{a}}° zum Lot auf einen Spiegel. Unter welchem Winkel wird er reflektiert?
    params: { unit: "°" }
    answer: { value: "{{a}}" }
    hints:
      - Einfallswinkel gleich Ausfallswinkel.
    explanation: "Ebenfalls {{a}}° – auf der anderen Seite des Lots."
    variants:
      params: { a: "int[10,80]" }
      defaults: { a: 35 }

  - kind: problem
    id: groesse
    widget: numeric
    prompt: Du bist {{h}} cm groß. Wie hoch muss ein Wandspiegel mindestens sein, damit du dich ganz siehst?
    params: { unit: cm }
    answer: { value: "{{h / 2}}" }
    hints:
      - Probier es mit Strahlen von Kopf und Füßen zu deinen Augen.
    explanation: "Die Hälfte – {{h / 2}} cm, egal wie weit du wegstehst."
    variants:
      params: { h: "choice[160,170,180,190]" }
      defaults: { h: 180 }

  - kind: problem
    id: seiten
    widget: choice
    prompt: Was vertauscht ein Spiegel eigentlich?
    params:
      options:
        - { label: Vorne und hinten, correct: true }
        - { label: Links und rechts, feedback: "Deine linke Hand bleibt links im Bild – vertauscht wird die Tiefe." }
    hints:
      - Zeig mit der rechten Hand zur Seite. Auf welcher Seite ist sie im Spiegel?
    explanation: Der Spiegel stülpt die Richtung zum Spiegel hin um – darum wirkt das Bild seitenverkehrt.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Dein Spiegelbild ist genauso weit hinter dem Spiegel wie du davor.
          right: true
        - text: Ein Spiegel vertauscht links und rechts.
          right: false
          why: Er vertauscht vorn und hinten. Deine linke Hand bleibt links.
        - text: Einfallswinkel und Ausfallswinkel sind gleich.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Zwei Spiegel stehen im rechten Winkel zueinander. Ein Strahl trifft den ersten unter 30° zum Lot. Um wie viel Grad ist er nach **beiden** Reflexionen insgesamt umgelenkt?
    params:
      unit: °
    answer:
      value: 180
    hints:
      - Probier einen anderen Winkel – das Ergebnis ändert sich nicht.
    explanation: "Immer 180°: Der Strahl läuft genau zurück. So funktionieren Fahrradreflektoren und die Spiegel auf dem Mond."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: Ein Lichtstrahl trifft einen Spiegel. Du drehst den Spiegel um 10°. Um wie viel Grad dreht sich der zurückgeworfene Strahl?
    params:
      unit: °
    answer:
      value: 20
    feedback:
      - when: numval(state.input) == 10
        misconception: mirror-angle
        text: Das Lot dreht sich um 10°. Einfalls- **und** Ausfallswinkel ändern sich dadurch – zusammen 20°.
    hints:
      - Mit dem Spiegel dreht sich auch das Lot um 10°.
      - Der Einfallswinkel ändert sich um 10°, der Ausfallswinkel auch.
    explanation: "Doppelter Winkel: 20°. Messgeräte nutzen das als Lichtzeiger – eine winzige Drehung wird an der Wand zu einem großen Ausschlag."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: estimate
    prompt: "Schätz mal: Astronauten stellten Spiegel auf den Mond. Wie viele Sekunden braucht ein Laserpuls zum Mond (384 000 km) und zurück?"
    params:
      min: 0
      max: 10
    answer:
      value: 2.56
      tolerance: 0.3
    explanation: "2 · 384 000 km : 300 000 km/s ≈ 2,56 s. So misst man den Mondabstand auf Zentimeter genau – und weiß: Er wächst um knapp 4 cm pro Jahr."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das **Fermatsche Prinzip** erklärt Reflexion und Brechung zugleich. Was besagt es?
    params:
      options:
        - label: Licht nimmt den Weg, für den es die kürzeste Zeit braucht
          correct: true
        - label: Licht nimmt immer den kürzesten Weg
          feedback: Bei der Brechung ist der schnellste Weg nicht der kürzeste.
        - label: Licht bewegt sich immer geradeaus
          feedback: An Grenzflächen knickt es ab.
    hints:
      - Ein Rettungsschwimmer läuft erst weit über den Strand, bevor er ins Wasser springt.
    explanation: "Wie der Rettungsschwimmer: mehr Weg im schnellen Medium, weniger im langsamen. Daraus folgt das Brechungsgesetz."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Warum gilt Einfallswinkel gleich Ausfallswinkel? Licht läuft von A über den Spiegel nach B auf dem kürzesten Weg. Spiegle B hinter den Spiegel. Die Gerade von A zum **Spiegelpunkt** trifft genau dort, wo beide Winkel gleich sind.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: Du gehst mit 1 m/s auf einen Wandspiegel zu. Mit welchem Tempo nähert sich dein Spiegelbild dir? In m/s.
    params:
      unit: m/s
    answer:
      value: 2
    feedback:
      - when: numval(state.input) == 1
        misconception: image-static
        text: Das Bild kommt dir auch entgegen – mit 1 m/s auf den Spiegel zu. Zusammen?
    hints:
      - Dein Bild ist immer genauso weit hinter dem Spiegel wie du davor.
      - Der Abstand zwischen dir und dem Bild ist das Doppelte deines Abstands zum Spiegel.
    explanation: Der Abstand zu deinem Bild ist 2 · d. Schrumpft d um 1 m pro Sekunde, schrumpft 2 · d um 2 m pro Sekunde.
    difficulty: 3

srs:
  cards_from: [winkel, seiten]
