id: sci.optics.mirrors
type: concept
title: Spiegel
summary: Einfallswinkel gleich Ausfallswinkel.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: hook
    widget: estimate
    prompt: "Schätz mal: Wie hoch muss ein Spiegel mindestens sein, damit du dich ganz siehst – in Prozent deiner Körpergröße?"
    params:
      min: 0
      max: 150
      unit: "%"
    answer:
      value: 50
      tolerance: 8
    explanation: Die Hälfte reicht – egal, wie weit du weg stehst.


  - kind: explain
    id: s1
    body: |
      An einem Spiegel wird Licht so zurückgeworfen, dass **Einfallswinkel und Ausfallswinkel gleich** sind – gemessen zum Lot, der Senkrechten auf dem Spiegel.

  - kind: problem
    id: winkel
    widget: numeric
    prompt: Ein Lichtstrahl trifft mit {{a}}° zum Lot auf einen Spiegel. Unter welchem Winkel wird er reflektiert?
    params: { unit: "°" }
    answer: { value: "{{a}}" }
    hints:
      - Einfallswinkel gleich Ausfallswinkel.
    explanation: "Ebenfalls {{a}}° – auf der anderen Seite des Lots."
    variants:
      params: { a: "int[10,80]" }
      defaults: { a: 35 }

  - kind: problem
    id: groesse
    widget: numeric
    prompt: Du bist {{h}} cm groß. Wie hoch muss ein Wandspiegel mindestens sein, damit du dich ganz siehst?
    params: { unit: cm }
    answer: { value: "{{h / 2}}" }
    hints:
      - Probier es mit Strahlen von Kopf und Füßen zu deinen Augen.
    explanation: "Die Hälfte – {{h / 2}} cm, egal wie weit du wegstehst."
    variants:
      params: { h: "choice[160,170,180,190]" }
      defaults: { h: 180 }

  - kind: problem
    id: seiten
    widget: choice
    prompt: Was vertauscht ein Spiegel eigentlich?
    params:
      options:
        - { label: Vorne und hinten, correct: true }
        - { label: Links und rechts, feedback: "Deine linke Hand bleibt links im Bild – vertauscht wird die Tiefe." }
    hints:
      - Zeig mit der rechten Hand zur Seite. Auf welcher Seite ist sie im Spiegel?
    explanation: Der Spiegel stülpt die Richtung zum Spiegel hin um – darum wirkt das Bild seitenverkehrt.

  - kind: problem
    id: c1
    widget: swipe
    prompt: "Blitzrunde: Stimmt das?"
    params:
      cards:
        - text: Dein Spiegelbild ist genauso weit hinter dem Spiegel wie du davor.
          right: true
        - text: Ein Spiegel vertauscht links und rechts.
          right: false
          why: Er vertauscht vorn und hinten. Deine linke Hand bleibt links.
        - text: Einfallswinkel und Ausfallswinkel sind gleich.
          right: true

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Zwei Spiegel stehen im rechten Winkel zueinander. Ein Strahl trifft den ersten unter 30° zum Lot. Um wie viel Grad ist er nach **beiden** Reflexionen insgesamt umgelenkt?
    params:
      unit: °
    answer:
      value: 180
    hints:
      - Probier einen anderen Winkel – das Ergebnis ändert sich nicht.
    explanation: "Immer 180°: Der Strahl läuft genau zurück. So funktionieren Fahrradreflektoren und die Spiegel auf dem Mond."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Das **Fermatsche Prinzip** erklärt Reflexion und Brechung zugleich. Was besagt es?
    params:
      options:
        - label: Licht nimmt den Weg, für den es die kürzeste Zeit braucht
          correct: true
        - label: Licht nimmt immer den kürzesten Weg
          feedback: Bei der Brechung ist der schnellste Weg nicht der kürzeste.
        - label: Licht bewegt sich immer geradeaus
          feedback: An Grenzflächen knickt es ab.
    hints:
      - Ein Rettungsschwimmer läuft erst weit über den Strand, bevor er ins Wasser springt.
    explanation: "Wie der Rettungsschwimmer: mehr Weg im schnellen Medium, weniger im langsamen. Daraus folgt das Brechungsgesetz."
    difficulty: 3

srs:
  cards_from: [winkel, seiten]
