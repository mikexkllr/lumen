id: sci.optics.shadows
type: concept
title: Licht und Schatten
summary: Licht läuft geradeaus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Wann ist dein Schatten am längsten?
    params:
      options:
        - label: Morgens und abends
          correct: true
        - label: Mittags
          feedback: Da steht die Sonne hoch und der Schatten ist kurz.
        - label: Immer gleich
          feedback: Er ändert sich über den Tag.
    hints:
      - Wann steht die Sonne tief?
    explanation: Licht läuft gerade. Darum hängt der Schatten vom Sonnenstand ab.

  - kind: explain
    id: s1
    body: |
      Licht breitet sich in **geraden Linien** aus. Darum entstehen Schatten – und darum kann man Höhen über Schattenlängen messen: Gleich hohe Sonne, gleiche Verhältnisse.

  - kind: problem
    id: baum
    widget: numeric
    prompt: Ein 2 m hoher Stab wirft 3 m Schatten. Ein Baum wirft gleichzeitig {{s}} m Schatten. Wie hoch ist der Baum?
    params: { unit: m }
    answer: { value: "{{s * 2 / 3}}" }
    feedback:
      - when: "numval(state.input) == s * 3 / 2"
        misconception: inverted-ratio
        text: Der Schatten ist länger als das Objekt – der Baum muss also kürzer sein als sein Schatten.
    hints:
      - Höhe zu Schatten ist 2 zu 3.
    explanation: "{{s}} · 2 : 3 = {{s * 2 / 3}} m. So maß schon Thales die Pyramiden."
    variants:
      params: { s: "choice[6,9,12,15]" }
      defaults: { s: 9 }

  - kind: problem
    id: finsternis
    widget: choice
    prompt: Was ist eine Sonnenfinsternis?
    params:
      options:
        - { label: Der Schatten des Mondes fällt auf die Erde., correct: true }
        - { label: Der Schatten der Erde fällt auf den Mond., feedback: "Das wäre eine Mondfinsternis." }
    hints:
      - Wer steht zwischen Sonne und Erde?
    explanation: Der Mond verdeckt die Sonne – sein Schatten wandert über die Erde.

  - kind: problem
    id: weich
    widget: choice
    prompt: Warum werfen Dinge unter bewölktem Himmel kaum scharfe Schatten?
    params:
      options:
        - { label: Das Licht kommt von einer riesigen Fläche statt einem Punkt., correct: true }
        - { label: Weil es dunkler ist., feedback: "Es geht um die Größe der Lichtquelle, nicht um die Helligkeit." }
    hints:
      - Wie groß ist die Lichtquelle, wenn Wolken leuchten?
    explanation: Kleine Lichtquellen geben harte Schatten, große weiche.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach Schattenlänge – vom kürzesten zum längsten Schatten.
    params:
      items:
        - label: Mittags im Sommer
        - label: Mittags im Winter
        - label: Am späten Nachmittag
        - label: Kurz vor Sonnenuntergang
    hints:
      - Je tiefer die Sonne steht, desto länger der Schatten.
    explanation: Im Winter steht die Sonne auch mittags tief.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Der Mond ist 3500 km breit und 384 000 km entfernt. Die Sonne ist 400-mal so breit. Wievielmal weiter muss sie entfernt sein, damit beide am Himmel gleich groß erscheinen?
    answer:
      value: 400
    hints:
      - Gleiches Verhältnis von Größe zu Entfernung.
    explanation: 400-mal – ein kosmischer Zufall, der totale Sonnenfinsternisse erst möglich macht.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Vor 2200 Jahren: In Syene steht die Sonne mittags senkrecht. In Alexandria, 800 km weiter nördlich, fällt ihr Licht zur gleichen Zeit unter 7,2° ein. Wie groß ist der Erdumfang in km?"
    params:
      unit: km
    answer:
      value: 40000
      tolerance: 100
    hints:
      - 7,2° ist welcher Teil eines vollen Kreises von 360°?
      - "360 : 7,2 = 50. Also ist der Umfang 50 · 800 km."
    explanation: 50 · 800 km = 40 000 km. Eratosthenes maß die Erde nur mit Schatten und Geometrie – und lag erstaunlich nah dran.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Zwei Lampen beleuchten einen Ball von zwei Seiten. Hinter dem Ball gibt es helle, halbdunkle und dunkle Stellen. Wo ist es ganz dunkel?
    params:
      options:
        - label: Nur dort, wo das Licht keiner der beiden Lampen hinkommt.
          correct: true
        - label: Überall, wo der Schatten einer Lampe liegt.
          feedback: Dort kommt noch Licht der anderen Lampe an. Das ist Halbschatten.
        - label: Nirgends – zwei Lampen leuchten alles aus.
          feedback: Direkt hinter dem Ball kommt keine der beiden hin.
    hints:
      - Zeichne von jeder Lampe gerade Strahlen am Ball vorbei.
      - Wo überlappen beide Schatten?
    explanation: "Wo sich beide Schatten überlappen, ist **Kernschatten**. Wo nur eine Lampe fehlt, ist Halbschatten. Bei einer Sonnenfinsternis heißt das: total oder nur teilweise."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Eine Lochkamera ist nur ein dunkler Kasten mit einem winzigen Loch. Wie sieht das Bild auf der Rückwand aus?
    params:
      options:
        - label: Es steht auf dem Kopf und ist seitenverkehrt
          correct: true
        - label: Es steht aufrecht
          feedback: Strahlen von oben laufen durch das Loch nach unten.
        - label: Es entsteht kein Bild ohne Linse
          feedback: Das Loch lässt von jedem Punkt nur einen schmalen Strahl durch – das genügt.
    hints:
      - Zeichne einen Strahl von der Baumspitze durch das Loch.
    explanation: Die Strahlen kreuzen sich im Loch. Dein Auge macht dasselbe – das Gehirn dreht das Bild um.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: Eine Lochkamera ist 20 cm tief. Ein 10 m hoher Baum steht 50 m vor dem Loch. Wie groß ist sein Bild auf der Rückwand – in cm?
    params:
      unit: cm
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2500
        misconception: inverse-ratio
        text: "Umgekehrt: Das Bild ist viel **kleiner** als der Baum."
    hints:
      - Die Strahlen durch das Loch bilden zwei ähnliche Dreiecke.
      - "Bildgröße : 0,2 m = 10 m : 50 m."
    explanation: "10 m · 0,2 : 50 = 0,04 m = 4 cm, auf dem Kopf. Dasselbe Prinzip steckt in jedem Fotoapparat und im Auge."
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Manchmal bedeckt der Mond bei einer Sonnenfinsternis die Sonne nicht ganz – ein heller Ring bleibt. Warum?
    params:
      options:
        - label: Der Mond ist dann gerade weiter von der Erde weg und wirkt kleiner.
          correct: true
        - label: Die Sonne ist dann größer geworden.
          feedback: Die Sonne ändert ihre Größe nicht. Der Abstand des Mondes schwankt.
        - label: Der Mond ist dann durchsichtig.
          feedback: Der Mond ist nie durchsichtig. Er verdeckt nur weniger.
    hints:
      - Die Mondbahn ist eine leichte Ellipse.
      - Was ändert sich am Himmel, wenn der Mond weiter weg ist?
    explanation: Der Mondabstand schwankt zwischen etwa 356 000 und 407 000 km. In Erdferne ist der Mond am Himmel kleiner als die Sonne – es bleibt ein Feuerring.
    difficulty: 3

srs:
  cards_from: [baum, finsternis]
