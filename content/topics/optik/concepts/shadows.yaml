id: sci.optics.shadows
type: concept
title: Licht und Schatten
summary: Licht läuft geradeaus.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: explain
    body: |
      Licht breitet sich in **geraden Linien** aus. Darum entstehen Schatten – und darum kann man Höhen über Schattenlängen messen: Gleich hohe Sonne, gleiche Verhältnisse.

  - kind: problem
    id: baum
    widget: numeric
    prompt: Ein 2 m hoher Stab wirft 3 m Schatten. Ein Baum wirft gleichzeitig {{s}} m Schatten. Wie hoch ist der Baum?
    params: { unit: m }
    answer: { value: "{{s * 2 / 3}}" }
    feedback:
      - when: "numval(state.input) == s * 3 / 2"
        misconception: inverted-ratio
        text: Der Schatten ist länger als das Objekt – der Baum muss also kürzer sein als sein Schatten.
    hints:
      - Höhe zu Schatten ist 2 zu 3.
    explanation: "{{s}} · 2 : 3 = {{s * 2 / 3}} m. So maß schon Thales die Pyramiden."
    variants:
      params: { s: "choice[6,9,12,15]" }
      defaults: { s: 9 }

  - kind: problem
    id: finsternis
    widget: choice
    prompt: Was ist eine Sonnenfinsternis?
    params:
      options:
        - { label: Der Schatten des Mondes fällt auf die Erde., correct: true }
        - { label: Der Schatten der Erde fällt auf den Mond., feedback: "Das wäre eine Mondfinsternis." }
    hints:
      - Wer steht zwischen Sonne und Erde?
    explanation: Der Mond verdeckt die Sonne – sein Schatten wandert über die Erde.

  - kind: problem
    id: weich
    widget: choice
    prompt: Warum werfen Dinge unter bewölktem Himmel kaum scharfe Schatten?
    params:
      options:
        - { label: Das Licht kommt von einer riesigen Fläche statt einem Punkt., correct: true }
        - { label: Weil es dunkler ist., feedback: "Es geht um die Größe der Lichtquelle, nicht um die Helligkeit." }
    hints:
      - Wie groß ist die Lichtquelle, wenn Wolken leuchten?
    explanation: Kleine Lichtquellen geben harte Schatten, große weiche.

srs:
  cards_from: [baum, finsternis]
