id: sci.optics.refraction
type: concept
title: Brechung
summary: Licht ändert die Richtung.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: strohhalm
    widget: choice
    prompt: Warum sieht ein Strohhalm im Wasserglas geknickt aus?
    params:
      options:
        - { label: Licht ändert beim Übergang von Wasser zu Luft die Richtung., correct: true }
        - { label: Das Wasser biegt den Strohhalm., feedback: "Zieh ihn heraus – er ist gerade. Das Licht wird geknickt." }
    hints:
      - Was passiert mit Licht an der Wasseroberfläche?
    explanation: Das nennt man **Brechung**.

  - kind: explain
    id: s2
    body: |
      In Wasser und Glas ist Licht **langsamer** als in Luft. Trifft es schräg auf die Grenze, knickt es ab. Die **Brechzahl** n sagt, wievielmal langsamer: Licht ist dort $c / n$ schnell.

  - kind: problem
    id: tempo
    widget: numeric
    prompt: Ein Stoff hat die Brechzahl {{n}}. Wie schnell ist Licht darin, wenn es im Vakuum 300 000 km/s schafft?
    params: { unit: km/s }
    answer: { value: "{{300000 / n}}" }
    hints:
      - "300 000 : {{n}}."
    explanation: "300 000 : {{n}} = {{300000 / n}} km/s."
    variants:
      params: { n: "choice[1.25,1.5,2,2.4]" }
      defaults: { n: 1.5 }

  - kind: problem
    id: regenbogen
    widget: choice
    prompt: Wie entsteht ein Regenbogen?
    params:
      options:
        - { label: Wassertropfen brechen jede Farbe etwas anders., correct: true }
        - { label: Die Wolken sind bunt gefärbt., feedback: "Die Farben stecken im weißen Sonnenlicht selbst." }
    hints:
      - Weißes Licht besteht aus allen Farben.
    explanation: Blau wird stärker gebrochen als Rot – das Licht fächert sich auf.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Ordne nach dem Tempo des Lichts – vom schnellsten zum langsamsten.
    params:
      items:
        - label: Vakuum
        - label: Wasser
        - label: Glas
        - label: Diamant
    hints:
      - Je größer die Brechzahl, desto langsamer das Licht.
    explanation: Im Diamanten ist Licht weniger als halb so schnell. Darum funkelt er so stark.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Glas hat die Brechzahl 1,5, Wasser 1,33. Wie viel Prozent schneller ist Licht in Wasser als in Glas? Gerundet.
    params:
      unit: "%"
    answer:
      value: 13
      tolerance: 1
    hints:
      - Das Tempo ist c/n. Vergleiche 1/1,33 mit 1/1,5.
    explanation: "1,5 : 1,33 ≈ 1,13 – rund 13 % schneller."
    difficulty: 2

  - kind: explain
    id: ph-d1
    depth: 2
    body: Das **Brechungsgesetz** von Snellius lautet $n_1 \sin\alpha_1 = n_2 \sin\alpha_2$. Die Winkel misst man zum Lot. Im dichteren Stoff mit größerem n läuft der Strahl steiler, näher am Lot.

  - kind: problem
    id: ph-d2
    depth: 2
    widget: numeric
    prompt: Licht fällt aus Luft (n = 1) unter 30° zum Lot auf Glas (n = 1,5). Unter welchem Winkel läuft es im Glas weiter? Auf eine Stelle.
    params:
      unit: °
    answer:
      value: 19.5
      tolerance: 0.5
    feedback:
      - when: abs(numval(state.input) - 20) < 0.01
        misconception: divide-angles
        text: Nah dran – aber die Winkel teilt man nicht direkt. Erst den Sinus teilen.
      - when: abs(numval(state.input) - 48.6) < 0.5
        misconception: away-from-normal
        text: Im Glas knickt der Strahl **zum** Lot hin. Der Winkel wird kleiner.
    hints:
      - "sin α₂ = sin 30° : 1,5 = 0,5 : 1,5."
      - Welcher Winkel hat den Sinus 0,333?
    explanation: sin α₂ = 0,333, also α₂ ≈ 19,5°. Der Strahl knickt zum Lot hin, weil er im Glas langsamer ist.
    difficulty: 2

  - kind: problem
    id: ph-d3
    depth: 2
    widget: numeric
    prompt: Ein Becken ist 2 m tief. Von oben gesehen wirkt es um den Faktor n = 1,33 flacher. Wie tief scheint es? In m, auf eine Stelle.
    params:
      unit: m
    answer:
      value: 1.5
      tolerance: 0.05
    feedback:
      - when: abs(numval(state.input) - 2.66) < 0.05
        misconception: deeper
        text: Das Wasser lässt den Boden **höher** erscheinen, nicht tiefer.
    hints:
      - "Flacher heißt: geteilt durch 1,33."
      - "2 : 1,33 = ?"
    explanation: "2 : 1,33 ≈ 1,5 m. Wer hineinspringt, ist überrascht. Fische sind auch nicht dort, wo man sie sieht – darum zielen Speerfischer tiefer."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Licht läuft aus Wasser sehr flach gegen die Oberfläche. Was passiert ab einem bestimmten Winkel?
    params:
      options:
        - label: Es wird vollständig zurückgeworfen – Totalreflexion
          correct: true
        - label: Es tritt immer aus, nur stärker gebrochen
          feedback: Der gebrochene Strahl müsste über 90° abknicken – das geht nicht.
        - label: Es wird vom Wasser verschluckt
          feedback: Die Energie geht nicht verloren, sie bleibt im Wasser.
    hints:
      - Beim Austritt wird der Strahl vom Lot **weg** gebrochen. Was, wenn 90° erreicht sind?
    explanation: Für Wasser liegt der **Grenzwinkel** bei 49°. Darum glänzt die Wasseroberfläche von unten wie ein Spiegel.
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: Warum gilt Snellius? Eine **Wellenfront** trifft schräg auf Glas. Ihr eines Ende wird zuerst gebremst. In derselben Zeit läuft sie im Glas nur $v_2 t$ statt $v_1 t$. Die Geometrie ergibt $\frac{\sin\alpha_1}{\sin\alpha_2} = \frac{v_1}{v_2}$.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: "Licht läuft aus Glas (n = 1,5) in Luft. Ab welchem Winkel zum Lot wird es total reflektiert? Es gilt sin θ = 1 : n. Auf eine Stelle."
    params:
      unit: °
    answer:
      value: 41.8
      tolerance: 0.3
    hints:
      - "sin θ = 1 : 1,5 = 0,667."
      - Welcher Winkel hat den Sinus 0,667?
    explanation: θ ≈ 41,8°. Flacher auftreffendes Licht kommt nicht mehr hinaus. Diamant (n = 2,4) hat nur 24,6° – darum funkelt er so stark.
    difficulty: 3

srs:
  cards_from: [strohhalm, regenbogen]
