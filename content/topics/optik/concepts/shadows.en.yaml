id: sci.optics.shadows
type: concept
title: Light and shadow
summary: Light travels straight.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: When is your shadow longest?
    params:
      options:
        - label: In the morning and evening
          correct: true
        - label: At noon
          feedback: Then the Sun is high and the shadow short.
        - label: Always the same
          feedback: It changes over the day.
    hints:
      - When is the Sun low?
    explanation: Light travels straight. That is why the shadow depends on the Sun’s height.

  - kind: explain
    id: s1
    body: |
      Light travels in **straight lines**. That is why shadows form – and why you can measure heights from shadow lengths: same sun height, same ratios.

  - kind: problem
    id: baum
    widget: numeric
    prompt: A 2 m tall stick casts a 3 m shadow. At the same time, a tree casts a {{s}} m shadow. How tall is the tree?
    params: { unit: m }
    answer: { value: "{{s * 2 / 3}}" }
    feedback:
      - when: "numval(state.input) == s * 3 / 2"
        misconception: inverted-ratio
        text: The shadow is longer than the object – so the tree must be shorter than its shadow.
    hints:
      - Height to shadow is 2 to 3.
    explanation: "{{s}} · 2 ÷ 3 = {{s * 2 / 3}} m. That is how Thales measured the pyramids."
    variants:
      params: { s: "choice[6,9,12,15]" }
      defaults: { s: 9 }

  - kind: problem
    id: finsternis
    widget: choice
    prompt: What is a solar eclipse?
    params:
      options:
        - { label: The Moon's shadow falls on the Earth., correct: true }
        - { label: The Earth's shadow falls on the Moon., feedback: "That would be a lunar eclipse." }
    hints:
      - What stands between the Sun and the Earth?
    explanation: The Moon covers the Sun – its shadow moves across the Earth.

  - kind: problem
    id: weich
    widget: choice
    prompt: Why do objects cast hardly any sharp shadows under an overcast sky?
    params:
      options:
        - { label: The light comes from a huge area instead of a point., correct: true }
        - { label: Because it is darker., feedback: "It is about the size of the light source, not the brightness." }
    hints:
      - How big is the light source when clouds glow?
    explanation: Small light sources give hard shadows, large ones give soft shadows.

  - kind: problem
    id: mix-c1
    widget: order
    prompt: Order by shadow length – from the shortest to the longest shadow.
    params:
      items:
        - label: Noon in summer
        - label: Noon in winter
        - label: Late afternoon
        - label: Just before sunset
    hints:
      - The lower the Sun, the longer the shadow.
    explanation: In winter the Sun is low even at noon.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: The Moon is 3500 km wide and 384,000 km away. The Sun is 400 times as wide. How many times farther must it be so that both look the same size in the sky?
    answer:
      value: 400
    hints:
      - The same ratio of size to distance.
    explanation: 400 times – a cosmic coincidence that makes total solar eclipses possible.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "2200 years ago: in Syene the midday Sun is directly overhead. In Alexandria, 800 km farther north, its light arrives at 7.2° at the same time. What is Earth's circumference in km?"
    params:
      unit: km
    answer:
      value: 40000
      tolerance: 100
    hints:
      - 7.2° is what fraction of a full 360° circle?
      - 360 ÷ 7.2 = 50. So the circumference is 50 · 800 km.
    explanation: 50 · 800 km = 40,000 km. Eratosthenes measured Earth with nothing but shadows and geometry – and came amazingly close.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Two lamps light a ball from two sides. Behind the ball there are bright, half-dark and dark areas. Where is it completely dark?
    params:
      options:
        - label: Only where light from neither lamp arrives.
          correct: true
        - label: Everywhere in the shadow of one lamp.
          feedback: Light from the other lamp still arrives there. That is half-shadow.
        - label: Nowhere – two lamps light up everything.
          feedback: Right behind the ball neither reaches.
    hints:
      - Draw straight rays from each lamp past the ball.
      - Where do both shadows overlap?
    explanation: Where both shadows overlap is the umbra. Where only one lamp is blocked is the penumbra. In a solar eclipse that means total or only partial.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: A pinhole camera is just a dark box with a tiny hole. What does the image on the back wall look like?
    params:
      options:
        - label: It is upside down and reversed left to right
          correct: true
        - label: It is upright
          feedback: Rays from above pass through the hole downward.
        - label: No image forms without a lens
          feedback: The hole lets only a narrow ray through from each point – that is enough.
    hints:
      - Draw a ray from the treetop through the hole.
    explanation: The rays cross in the hole. Your eye does the same – the brain flips the image.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: A pinhole camera is 20 cm deep. A 10 m tall tree stands 50 m from the hole. How large is its image on the back wall – in cm?
    params:
      unit: cm
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2500
        misconception: inverse-ratio
        text: "The other way round: the image is much **smaller** than the tree."
    hints:
      - The rays through the hole form two similar triangles.
      - Image size ÷ 0.2 m = 10 m ÷ 50 m.
    explanation: 10 m · 0.2 ÷ 50 = 0.04 m = 4 cm, upside down. The same principle is in every camera and in the eye.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Sometimes during a solar eclipse the Moon does not fully cover the Sun – a bright ring remains. Why?
    params:
      options:
        - label: The Moon is then farther from Earth than usual and looks smaller.
          correct: true
        - label: The Sun has grown bigger.
          feedback: The Sun does not change size. The Moon's distance varies.
        - label: The Moon is transparent then.
          feedback: The Moon is never transparent. It just covers less.
    hints:
      - The Moon's orbit is a slight ellipse.
      - What changes in the sky when the Moon is farther away?
    explanation: The Moon's distance varies between about 356,000 and 407,000 km. At its farthest the Moon looks smaller than the Sun – a ring of fire remains.
    difficulty: 3

srs:
  cards_from: [baum, finsternis]
