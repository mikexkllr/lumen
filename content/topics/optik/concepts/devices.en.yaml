id: sci.optics.devices
type: concept
title: Optical devices
summary: Camera, telescope, optical fiber.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 5
steps:
  - kind: problem
    id: geraete
    widget: match
    prompt: What does the device do?
    params:
      pairs:
        - { left: Camera, right: Puts an image on the sensor }
        - { left: Telescope, right: Collects light from distant stars }
        - { left: Microscope, right: Magnifies tiny things }
        - { left: Optical fiber, right: Guides light around corners }
    hints:
      - Optical fibers carry the internet under the oceans.
    explanation: All four steer light with lenses, mirrors or boundary surfaces.

  - kind: explain
    body: |
      In an **optical fiber**, light hits the wall at such a shallow angle that it is reflected completely – **total internal reflection**. That is how it travels for miles through thin fibers.

  - kind: problem
    id: spiegel
    widget: numeric
    prompt: A telescope mirror gets {{k}} times the diameter. How many times more light does it collect?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: The area counts – and it grows with the square.
    hints:
      - The area of a circle grows with the square of the diameter.
    explanation: "{{k}}² = {{k * k}} times as much light."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 2 }

  - kind: problem
    id: gross
    widget: choice
    prompt: Why do astronomers keep building larger telescopes?
    params:
      options:
        - { label: Larger mirrors collect more light and show fainter objects., correct: true }
        - { label: To be closer to the stars., feedback: "A few extra meters of height make no difference." }
    hints:
      - What is missing when you look at distant galaxies?
    explanation: More light means deeper into space and further back in time.

srs:
  cards_from: [geraete, spiegel]
