id: sci.optics.devices
type: concept
title: Optical devices
summary: Camera, telescope, optical fiber.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: geraete
    widget: match
    prompt: What does the device do?
    params:
      pairs:
        - { left: Camera, right: Puts an image on the sensor }
        - { left: Telescope, right: Collects light from distant stars }
        - { left: Microscope, right: Magnifies tiny things }
        - { left: Optical fiber, right: Guides light around corners }
    hints:
      - Optical fibers carry the internet under the oceans.
    explanation: All four steer light with lenses, mirrors or boundary surfaces.

  - kind: explain
    id: s2
    body: |
      In an **optical fiber**, light hits the wall at such a shallow angle that it is reflected completely – **total internal reflection**. That is how it travels for miles through thin fibers.

  - kind: problem
    id: spiegel
    widget: numeric
    prompt: A telescope mirror gets {{k}} times the diameter. How many times more light does it collect?
    params: { unit: "times" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: The area counts – and it grows with the square.
    hints:
      - The area of a circle grows with the square of the diameter.
    explanation: "{{k}}² = {{k * k}} times as much light."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 2 }

  - kind: problem
    id: gross
    widget: choice
    prompt: Why do astronomers keep building larger telescopes?
    params:
      options:
        - { label: Larger mirrors collect more light and show fainter objects., correct: true }
        - { label: To be closer to the stars., feedback: "A few extra meters of height make no difference." }
    hints:
      - What is missing when you look at distant galaxies?
    explanation: More light means deeper into space and further back in time.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: A projector turns a small slide into a big picture. Move the slide close to the focal point until the magnification is at least 3.
    params:
      scene: lens
      controls:
        focal:
          fixed: true
    answer:
      magnification:
        - 3
        - 6
    explanation: At 12 cm, just beyond the focal length of 10 cm. The picture is then five times as large.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: A telescope has an objective of 1000 mm and an eyepiece of 25 mm focal length. What is its magnification?
    answer:
      value: 40
    hints:
      - Focal length of the objective divided by that of the eyepiece.
    explanation: 1000 ÷ 25 = 40 times.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: On a camera you change the aperture from f/4 to f/2. Light through the opening is proportional to 1 ÷ f-number². How many times more light gets in?
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: diameter-not-area
        text: The f-number measures the diameter. Light counts the area – and that grows with the square.
    hints:
      - Half the f-number means double the diameter.
      - Double the diameter, how many times the area?
    explanation: (4 ÷ 2)² = 4. Four times the light allows a four times shorter exposure – important for sharp photos of motion.
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: You open your eyes under water. Why does it all look blurred?
    params:
      options:
        - label: The cornea hardly refracts in water – water and eye have almost the same refractive index.
          correct: true
        - label: The water is murky.
          feedback: Even in clear water it is blurry. It is about refraction.
        - label: The eye lens swells.
          feedback: The lens stays the same. What is missing is the jump from air to cornea.
    hints:
      - Where is light refracted most strongly in the eye?
      - Refraction needs a difference in refractive index.
    explanation: Two thirds of the focusing power come from the air–cornea boundary. In water it almost vanishes. Goggles restore a layer of air in front of the eye.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Why can no light microscope show single atoms – however good the lenses?
    params:
      options:
        - label: Light cannot image anything much smaller than its wavelength
          correct: true
        - label: Lenses cannot be ground precisely enough
          feedback: Even perfect lenses hit this limit.
        - label: Atoms emit no light
          feedback: They do – but the wave is a thousand times larger than the atom.
    hints:
      - Visible light has about 500 nm, an atom 0.1 nm.
    explanation: The **diffraction limit**. Electron microscopes use particles with a much shorter wavelength.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Tell Lux: why does light bend when it goes from air into water?"
    params:
      keywords:
        - - langsam
          - slower
          - slow
          - tempo
          - speed
          - geschwindigkeit
        - - schräg
          - winkel
          - angle
          - slant
          - oblique
        - - richtung
          - direction
          - knick
          - bend
          - brech
          - refract
      sample: Light is slower in water than in air. When it hits the boundary at an angle, one side of the wave is slowed first – that changes the direction.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Even a perfect telescope resolves angles only down to θ ≈ 1.22 · λ ÷ D because of diffraction. Hubble: D = 2.4 m, λ = 550 nm. What is θ – in millionths of a radian?"
    answer:
      value: 0.28
      tolerance: 0.02
    hints:
      - 1.22 · 550 · 10⁻⁹ m ÷ 2.4 m.
      - The result is about 2.8 · 10⁻⁷.
    explanation: θ ≈ 0.28 µrad. With that Hubble could make out a coin 100 km away. Larger mirrors and shorter waves resolve finer detail.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Internet data travels long distances through thin glass fibres, not copper cables. Why?
    params:
      options:
        - label: Light oscillates extremely fast and loses hardly any energy in glass – huge amounts of data fit through.
          correct: true
        - label: Light is faster than current in copper.
          feedback: Both signals are similarly fast. What matters is bandwidth and loss.
        - label: Glass is cheaper than copper.
          feedback: Price is not the main reason. It is about the amount of data.
    hints:
      - The higher the frequency, the more data per second.
      - Light oscillates about 10¹⁴ times per second.
    explanation: Light has frequencies around 200 THz and travels many kilometres through pure glass almost without loss. A single fibre today carries terabits per second.
    difficulty: 3

srs:
  cards_from: [geraete, spiegel]
