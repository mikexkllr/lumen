id: sci.optics.devices
type: concept
title: Optische Geräte
summary: Kamera, Teleskop, Glasfaser.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 10
steps:
  - kind: problem
    id: geraete
    widget: match
    prompt: Was leistet das Gerät?
    params:
      pairs:
        - { left: Kamera, right: Bild auf den Sensor }
        - { left: Teleskop, right: Licht ferner Sterne sammeln }
        - { left: Mikroskop, right: Winziges vergrößern }
        - { left: Glasfaser, right: Licht um Ecken leiten }
    hints:
      - Glasfasern tragen das Internet unter den Ozeanen.
    explanation: Alle vier lenken Licht mit Linsen, Spiegeln oder Grenzflächen.

  - kind: explain
    id: s2
    body: |
      In einer **Glasfaser** trifft Licht so flach auf die Wand, dass es komplett zurückgeworfen wird – **Totalreflexion**. So läuft es kilometerweit durch dünne Fasern.

  - kind: problem
    id: spiegel
    widget: numeric
    prompt: Ein Teleskopspiegel bekommt den {{k}}-fachen Durchmesser. Wievielmal mehr Licht sammelt er?
    params: { unit: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Es zählt die Fläche – und die wächst mit dem Quadrat.
    hints:
      - Die Fläche eines Kreises wächst mit dem Quadrat des Durchmessers.
    explanation: "{{k}}² = {{k * k}}-mal so viel Licht."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 2 }

  - kind: problem
    id: gross
    widget: choice
    prompt: Warum bauen Astronomen immer größere Teleskope?
    params:
      options:
        - { label: Größere Spiegel sammeln mehr Licht und zeigen schwächere Objekte., correct: true }
        - { label: Damit sie näher an den Sternen sind., feedback: "Ein paar Meter mehr Höhe spielen keine Rolle." }
    hints:
      - Was fehlt beim Blick auf ferne Galaxien?
    explanation: Mehr Licht heißt tiefer ins All und weiter zurück in die Zeit.

  - kind: problem
    id: lab-c1
    widget: sim
    prompt: Ein Beamer macht aus einem kleinen Dia ein großes Bild. Schieb das Dia nah an den Brennpunkt, bis die Vergrößerung mindestens 3 beträgt.
    params:
      scene: lens
      controls:
        focal:
          fixed: true
    answer:
      magnification:
        - 3
        - 6
    explanation: Bei 12 cm, knapp hinter der Brennweite von 10 cm. Das Bild ist dann fünfmal so groß.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Teleskop hat ein Objektiv mit 1000 mm und ein Okular mit 25 mm Brennweite. Wie stark vergrößert es?
    answer:
      value: 40
    hints:
      - Brennweite Objektiv geteilt durch Brennweite Okular.
    explanation: "1000 : 25 = 40-fach."
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: "Bei einer Kamera stellst du die Blende von f/4 auf f/2. Durch die Öffnung fällt Licht proportional zu 1 : Blendenzahl². Wievielmal mehr Licht fällt ein?"
    answer:
      value: 4
    feedback:
      - when: numval(state.input) == 2
        misconception: diameter-not-area
        text: Die Blendenzahl misst den Durchmesser. Licht zählt die Fläche – und die wächst im Quadrat.
    hints:
      - Halbe Blendenzahl heißt doppelter Durchmesser.
      - Doppelter Durchmesser, wievielmal Fläche?
    explanation: "(4 : 2)² = 4. Vierfaches Licht erlaubt eine viermal kürzere Belichtung – wichtig für scharfe Fotos von Bewegung."
    difficulty: 2

  - kind: problem
    id: ph-d2
    depth: 2
    widget: choice
    prompt: Warum siehst du unter Wasser ohne Taucherbrille alles verschwommen?
    params:
      options:
        - label: Die Hornhaut bricht im Wasser kaum noch – Wasser und Auge haben fast dieselbe Brechzahl.
          correct: true
        - label: Das Wasser ist trüb.
          feedback: Auch in klarem Wasser ist es unscharf. Es liegt an der Brechung.
        - label: Die Augenlinse quillt auf.
          feedback: Die Linse bleibt gleich. Es fehlt der Sprung von Luft zu Hornhaut.
    hints:
      - Wo wird Licht im Auge am stärksten gebrochen?
      - Brechung braucht einen Unterschied in der Brechzahl.
    explanation: Zwei Drittel der Brechkraft stecken im Übergang Luft–Hornhaut. Im Wasser fällt er fast weg. Die Brille schafft wieder eine Luftschicht vor dem Auge.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum kann kein Lichtmikroskop einzelne Atome zeigen – egal wie gut die Linsen sind?
    params:
      options:
        - label: Licht kann nichts abbilden, was viel kleiner ist als seine Wellenlänge
          correct: true
        - label: Die Linsen lassen sich nicht genau genug schleifen
          feedback: Selbst perfekte Linsen stoßen an diese Grenze.
        - label: Atome senden kein Licht aus
          feedback: Das tun sie – aber die Welle ist tausendmal größer als das Atom.
    hints:
      - Sichtbares Licht hat rund 500 nm, ein Atom 0,1 nm.
    explanation: Die **Beugungsgrenze**. Elektronenmikroskope nutzen Teilchen mit viel kürzerer Wellenlänge.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum knickt Licht ab, wenn es von Luft in Wasser geht?"
    params:
      keywords:
        - - langsam
          - slower
          - slow
          - tempo
          - speed
          - geschwindigkeit
        - - schräg
          - winkel
          - angle
          - slant
          - oblique
        - - richtung
          - direction
          - knick
          - bend
          - brech
          - refract
      sample: Licht ist im Wasser langsamer als in Luft. Trifft es schräg auf die Grenze, wird eine Seite der Welle zuerst gebremst – dadurch ändert sich die Richtung.
    difficulty: 3

  - kind: problem
    id: ph-x1
    depth: 3
    widget: numeric
    prompt: "Selbst ein perfektes Teleskop löst wegen der Beugung nur Winkel bis θ ≈ 1,22 · λ : D auf. Hubble: D = 2,4 m, λ = 550 nm. Wie groß ist θ – in Millionstel Radiant?"
    answer:
      value: 0.28
      tolerance: 0.02
    hints:
      - "1,22 · 550 · 10⁻⁹ m : 2,4 m."
      - Das Ergebnis ist etwa 2,8 · 10⁻⁷.
    explanation: θ ≈ 0,28 µrad. Damit könnte Hubble eine Münze in 100 km Entfernung erkennen. Größere Spiegel und kürzere Wellen lösen feiner auf.
    difficulty: 3

  - kind: problem
    id: ph-x2
    depth: 3
    widget: choice
    prompt: Daten für das Internet reisen weit durch dünne Fasern aus Glas, nicht durch Kabel aus Kupfer. Warum?
    params:
      options:
        - label: Licht schwingt extrem schnell und verliert im Glas kaum Energie – es passen riesige Datenmengen hindurch.
          correct: true
        - label: Licht ist schneller als Strom im Kupfer.
          feedback: Beide Signale sind ähnlich schnell. Entscheidend sind Bandbreite und Verlust.
        - label: Glas ist billiger als Kupfer.
          feedback: Der Preis ist nicht der Hauptgrund. Es geht um die Datenmenge.
    hints:
      - Je höher die Frequenz, desto mehr Daten pro Sekunde.
      - Licht schwingt etwa 10¹⁴-mal pro Sekunde.
    explanation: Licht hat Frequenzen um 200 THz und läuft durch reines Glas viele Kilometer fast ohne Verlust. Eine einzige Faser trägt heute Terabits pro Sekunde.
    difficulty: 3

srs:
  cards_from: [geraete, spiegel]
