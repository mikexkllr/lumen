id: sci.optics.devices
type: concept
title: Optische Geräte
summary: Kamera, Teleskop, Glasfaser.
locale: de
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: problem
    id: geraete
    widget: match
    prompt: Was leistet das Gerät?
    params:
      pairs:
        - { left: Kamera, right: Bild auf den Sensor }
        - { left: Teleskop, right: Licht ferner Sterne sammeln }
        - { left: Mikroskop, right: Winziges vergrößern }
        - { left: Glasfaser, right: Licht um Ecken leiten }
    hints:
      - Glasfasern tragen das Internet unter den Ozeanen.
    explanation: Alle vier lenken Licht mit Linsen, Spiegeln oder Grenzflächen.

  - kind: explain
    id: s2
    body: |
      In einer **Glasfaser** trifft Licht so flach auf die Wand, dass es komplett zurückgeworfen wird – **Totalreflexion**. So läuft es kilometerweit durch dünne Fasern.

  - kind: problem
    id: spiegel
    widget: numeric
    prompt: Ein Teleskopspiegel bekommt den {{k}}-fachen Durchmesser. Wievielmal mehr Licht sammelt er?
    params: { unit: "-mal" }
    answer: { value: "{{k * k}}" }
    feedback:
      - when: "numval(state.input) == k"
        misconception: linear
        text: Es zählt die Fläche – und die wächst mit dem Quadrat.
    hints:
      - Die Fläche eines Kreises wächst mit dem Quadrat des Durchmessers.
    explanation: "{{k}}² = {{k * k}}-mal so viel Licht."
    variants:
      params: { k: "int[2,5]" }
      defaults: { k: 2 }

  - kind: problem
    id: gross
    widget: choice
    prompt: Warum bauen Astronomen immer größere Teleskope?
    params:
      options:
        - { label: Größere Spiegel sammeln mehr Licht und zeigen schwächere Objekte., correct: true }
        - { label: Damit sie näher an den Sternen sind., feedback: "Ein paar Meter mehr Höhe spielen keine Rolle." }
    hints:
      - Was fehlt beim Blick auf ferne Galaxien?
    explanation: Mehr Licht heißt tiefer ins All und weiter zurück in die Zeit.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Ein Teleskop hat ein Objektiv mit 1000 mm und ein Okular mit 25 mm Brennweite. Wie stark vergrößert es?
    answer:
      value: 40
    hints:
      - Brennweite Objektiv geteilt durch Brennweite Okular.
    explanation: "1000 : 25 = 40-fach."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: Warum kann kein Lichtmikroskop einzelne Atome zeigen – egal wie gut die Linsen sind?
    params:
      options:
        - label: Licht kann nichts abbilden, was viel kleiner ist als seine Wellenlänge
          correct: true
        - label: Die Linsen lassen sich nicht genau genug schleifen
          feedback: Selbst perfekte Linsen stoßen an diese Grenze.
        - label: Atome senden kein Licht aus
          feedback: Das tun sie – aber die Welle ist tausendmal größer als das Atom.
    hints:
      - Sichtbares Licht hat rund 500 nm, ein Atom 0,1 nm.
    explanation: Die **Beugungsgrenze**. Elektronenmikroskope nutzen Teilchen mit viel kürzerer Wellenlänge.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: "Erklär Lux: Warum knickt Licht ab, wenn es von Luft in Wasser geht?"
    params:
      keywords:
        - - langsam
          - slower
          - slow
          - tempo
          - speed
          - geschwindigkeit
        - - schräg
          - winkel
          - angle
          - slant
          - oblique
        - - richtung
          - direction
          - knick
          - bend
          - brech
          - refract
      sample: Licht ist im Wasser langsamer als in Luft. Trifft es schräg auf die Grenze, wird eine Seite der Welle zuerst gebremst – dadurch ändert sich die Richtung.
    difficulty: 3

srs:
  cards_from: [geraete, spiegel]
