id: sci.optics.lenses
type: concept
title: Lenses
summary: Focusing and spreading light.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 11
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: Pictures from glass
    body: Every camera and every eye contains a lens. Move the object and change the focal length. When does the **image** get bigger, and when smaller?
    visual:
      widget: sim
      interactive: true
      params:
        scene: lens

  - kind: problem
    id: hook
    widget: choice
    prompt: With a magnifying glass you can light paper in the sun. What does the glass do to the light?
    params:
      options:
        - label: It focuses it on one point
          correct: true
        - label: It makes more light
          feedback: A lens produces no light.
        - label: It colours it
          feedback: The light stays white.
    hints:
      - Look at the bright spot.
    explanation: "This point has a name: the focal point."

  - kind: explain
    id: s1
    body: |
      A **converging lens** is thicker in the middle and focuses parallel rays at one point, the **focal point**. A **diverging lens** is thinner in the middle and fans light out.

  - kind: problem
    id: art
    widget: buckets
    prompt: Converging or diverging lens?
    params:
      buckets: [{ label: Converging lens }, { label: Diverging lens }]
      items:
        - { label: Magnifying glass, bucket: Converging lens }
        - { label: Camera lens, bucket: Converging lens }
        - { label: Glasses for farsightedness, bucket: Converging lens }
        - { label: Glasses for nearsightedness, bucket: Diverging lens }
    hints:
      - Nearsighted eyes focus too strongly.
    explanation: With nearsightedness, the focal point lies too far forward – a diverging lens pushes it back.

  - kind: problem
    id: dioptrie
    widget: numeric
    prompt: A lens's power in diopters is 1 divided by the focal length in meters. What power does a lens with a {{f}} m focal length have?
    params: { unit: dpt }
    answer: { value: "{{1 / f}}" }
    hints:
      - "1 ÷ {{f}}."
    explanation: "1 ÷ {{f}} = {{1 / f}} diopters."
    variants:
      params: { f: "choice[0.25,0.5,1,2]" }
      defaults: { f: 0.5 }

  - kind: problem
    id: feuer
    widget: choice
    prompt: Why can you set paper on fire with a magnifying glass?
    params:
      options:
        - { label: It focuses sunlight onto a tiny spot., correct: true }
        - { label: Glass produces heat., feedback: "The glass itself stays cool – it only concentrates the light." }
    hints:
      - What happens at the focal point?
    explanation: A lot of light on a small area – hence the name “focal point”.

  - kind: problem
    id: c1
    widget: sim
    prompt: The lens has a focal length of 10 cm. Move the object so that the image is **exactly as large** as the object.
    params:
      scene: lens
      controls:
        focal:
          value: 10
          fixed: true
    answer:
      magnification: 1
    explanation: "At twice the focal length: 20 cm. Then the image is 20 cm away too."

  - kind: problem
    id: d1
    depth: 2
    widget: sim
    prompt: "Build a projector: the image should be **twice as large** as the object."
    params:
      scene: lens
    answer:
      magnification: 2
    explanation: The object must sit between one and two focal lengths, for example 12 cm with f = 8 cm.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: "The lens equation: $\\frac{1}{f} = \\frac{1}{g} + \\frac{1}{b}$. An object stands 30 cm in front of a lens with f = 10 cm. Where does the image form?"
    params:
      unit: cm
    answer:
      value: 15
    hints:
      - 1/b = 1/10 − 1/30.
    explanation: 1/b = 2/30, so b = 15 cm.
    difficulty: 2

  - kind: problem
    id: ph-d1
    depth: 2
    widget: numeric
    prompt: A lens has a focal length of 10 cm. An object stands {{g}} cm in front of it. At what distance behind the lens does the image form? Use 1/f = 1/g + 1/b.
    params:
      unit: cm
    answer:
      value: "{{g * 10 / (g - 10)}}"
    feedback:
      - when: numval(state.input) == g - 10
        misconception: subtract-distances
        text: "You do not subtract the distances but their reciprocals: 1/b = 1/f − 1/g."
    hints:
      - 1/b = 1/10 − 1/{{g}}.
      - Take the reciprocal of the result.
    explanation: b = g · f ÷ (g − f) = {{g * 10 / (g - 10)}} cm. The closer the object is to the focal point, the farther and larger the image.
    difficulty: 2
    variants:
      params:
        g: choice[15,20,30,60]
      defaults:
        g: 15

  - kind: problem
    id: ph-d2
    depth: 2
    widget: sim
    prompt: "Make a camera: the image should be half the size of the object."
    params:
      scene: lens
    answer:
      magnification:
        - 0.48
        - 0.52
    explanation: Half size occurs when the object is three times the focal length away, about 30 cm at f = 10 cm. Cameras almost always make images smaller.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: The object moves **closer** to the lens than the focal length. What happens?
    params:
      options:
        - label: No image forms on a screen – through the lens you see an enlarged, upright image
          correct: true
        - label: The image becomes tiny
          feedback: It gets larger – that is how a magnifying glass works.
        - label: The image forms right on the lens
          feedback: The rays diverge behind the lens.
    hints:
      - That is how you use a magnifying glass.
    explanation: "A **virtual image**: the rays seem to come from a point behind the object."
    difficulty: 3

  - kind: explain
    id: ph-x1
    depth: 3
    body: In the eye the distance to the retina is fixed. To focus, the eye lens changes its focal length – that is called **accommodation**. With age the lens stiffens. Then reading glasses help.

  - kind: problem
    id: ph-x2
    depth: 3
    widget: numeric
    prompt: An eye can focus no closer than 50 cm. You want to read at 25 cm. What lens power do you need? Calculate D = 1/0.25 m − 1/0.5 m.
    params:
      unit: dpt
    answer:
      value: 2
    hints:
      - 1 ÷ 0.25 = 4 and 1 ÷ 0.5 = 2.
      - The difference is the extra power needed.
    explanation: 4 − 2 = +2 dioptres. The converging lens does what the eye lens can no longer manage. Short-sighted people need diverging lenses with a minus instead.
    difficulty: 3

srs:
  cards_from: [art, dioptrie]
