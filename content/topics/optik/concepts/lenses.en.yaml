id: sci.optics.lenses
type: concept
title: Lenses
summary: Focusing and spreading light.
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
estimated_minutes: 6
steps:
  - kind: explain
    body: |
      A **converging lens** is thicker in the middle and focuses parallel rays at one point, the **focal point**. A **diverging lens** is thinner in the middle and fans light out.

  - kind: problem
    id: art
    widget: buckets
    prompt: Converging or diverging lens?
    params:
      buckets: [{ label: Converging lens }, { label: Diverging lens }]
      items:
        - { label: Magnifying glass, bucket: Converging lens }
        - { label: Camera lens, bucket: Converging lens }
        - { label: Glasses for farsightedness, bucket: Converging lens }
        - { label: Glasses for nearsightedness, bucket: Diverging lens }
    hints:
      - Nearsighted eyes focus too strongly.
    explanation: With nearsightedness, the focal point lies too far forward – a diverging lens pushes it back.

  - kind: problem
    id: dioptrie
    widget: numeric
    prompt: A lens's power in diopters is 1 divided by the focal length in meters. What power does a lens with a {{f}} m focal length have?
    params: { unit: dpt }
    answer: { value: "{{1 / f}}" }
    hints:
      - "1 ÷ {{f}}."
    explanation: "1 ÷ {{f}} = {{1 / f}} diopters."
    variants:
      params: { f: "choice[0.25,0.5,1,2]" }
      defaults: { f: 0.5 }

  - kind: problem
    id: feuer
    widget: choice
    prompt: Why can you set paper on fire with a magnifying glass?
    params:
      options:
        - { label: It focuses sunlight onto a tiny spot., correct: true }
        - { label: Glass produces heat., feedback: "The glass itself stays cool – it only concentrates the light." }
    hints:
      - What happens at the focal point?
    explanation: A lot of light on a small area – hence the name “focal point”.

srs:
  cards_from: [art, dioptrie]
