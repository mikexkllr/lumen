id: bio.genetics.human
type: concept
title: "Blood groups and sex"
summary: "Codominance, the ABO system and X-linked inheritance."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 9
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: X or Y?
    body: "Whether a baby has the chromosomes XX or XY is decided by the **sperm**. It carries either an X or a Y. Draw one baby, then ten, then a hundred: how close do you get to half and half?"
    visual:
      widget: distribution
      interactive: true
      params:
        items:
          - label: X → girl
            weight: 1
          - label: Y → boy
            weight: 1
        sample:
          - 1
          - 10
          - 100

  - kind: problem
    id: hook
    widget: choice
    prompt: A father has blood group A, a mother blood group B. Can their child have blood group O?
    params:
      options:
        - label: Yes, if both carry an O allele.
          correct: true
        - label: No, never.
          feedback: A and B can carry a hidden O.
        - label: Only if the child is adopted.
          feedback: It is entirely possible biologically.
    hints:
      - Blood group A can be AO genetically.
      - O is recessive.
    explanation: "AO × BO: with 25 % chance each passes on an O. Then the child is OO, blood group O."

  - kind: explain
    id: c1
    body: "The alleles A and B are both dominant over O. When A and B meet, both show. This is called **codominance**. That gives blood group AB: the cells carry both markers."

  - kind: problem
    id: c2
    widget: venn
    prompt: The circles show red blood cells with marker A and with marker B. Shade the region for blood group AB.
    params:
      sets:
        - Marker A
        - Marker B
      outside: true
    answer:
      regions:
        - AB
    hints:
      - AB cells carry both markers.
      - That is the overlap.
    explanation: Blood group AB is in the overlap, blood group O outside both circles.

  - kind: problem
    id: c3
    widget: venn
    prompt: Now shade every region whose blood carries marker A.
    params:
      sets:
        - Marker A
        - Marker B
      outside: true
    answer:
      regions:
        - A
        - AB
    hints:
      - AB also has marker A.
      - The whole circle A.
    explanation: Blood groups A and AB carry marker A. People with group B or O make antibodies against it.

  - kind: problem
    id: c4
    widget: buckets
    prompt: Which blood group does this genotype have?
    params:
      buckets:
        - id: b1
          label: A
        - id: b2
          label: B
        - id: b3
          label: AB
        - id: b4
          label: O
      items:
        - label: AA
          bucket: b1
        - label: AO
          bucket: b1
        - label: BO
          bucket: b2
        - label: AB
          bucket: b3
        - label: OO
          bucket: b4
    hints:
      - O is recessive.
      - A and B are codominant.
    explanation: AO looks like A, BO like B. Only OO is group O.

  - kind: explain
    id: d1
    depth: 2
    body: Women have two X chromosomes, men one X and one Y. A recessive allele on the X shows up in men straight away. They have no second X to make up for it. This is **X-linked** inheritance.

  - kind: problem
    id: d2
    depth: 2
    widget: choice
    prompt: Red–green colour blindness is X-linked recessive. Why is it far more common in men (about 8 %) than in women (about 0.5 %)?
    params:
      options:
        - label: Men need only one affected X, women two.
          correct: true
        - label: Men have worse eyesight.
          feedback: It is about one gene, not eyesight in general.
        - label: The allele is on the Y.
          feedback: Then women would never have it.
    hints:
      - How many X chromosomes does a man have?
      - A woman needs the allele on both X chromosomes.
    explanation: "8 % of X chromosomes carry the allele. A woman needs it twice: about 0.08 × 0.08 ≈ 0.6 %."
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A colour-blind father and a mother without the allele have a son. Is the son colour-blind?
    params:
      options:
        - label: No. The son gets the Y from his father, not the X.
          correct: true
        - label: Yes, he inherits it from his father.
          feedback: A son always gets the Y from his father.
        - label: With 50 % probability
          feedback: The mother lacks the allele, and the father passes his X only to daughters.
    hints:
      - Where does a son get his X?
      - From his mother.
    explanation: Sons inherit their X from their mother. But all of this father’s daughters are carriers.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A carrier woman (X^A X^a) and an unaffected man (X^A Y) have a son. How likely is he to be affected? Give a fraction.
    answer:
      value: 1/2
      form: fraction
    feedback:
      - when: numval(state.input) == 1/4
        misconception: ignore-condition
        text: 1/4 is for all children together. The question assumes it is already a son.
    hints:
      - The son gets the Y from his father. Which X from his mother?
      - X^A or X^a, half the time each.
    explanation: "Among the sons every second one is affected: 1/2. Among all children it would be 1/4."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how a child of A and B parents can have blood group O.
    params:
      keywords:
        - - a0
          - ao
          - verdeckt
          - träger
          - traeger
          - carrier
          - hidden
        - - rezessiv
          - recessive
        - - "00"
          - oo
          - beide
          - both
        - - "25"
          - viertel
          - quarter
      sample: Father AO and mother BO each carry a hidden, recessive O allele. If both pass on their O, the child is OO and so has blood group O. That happens with 25 % chance.
    explanation: Hidden alleles make surprises possible – and predictable.
    difficulty: 3

srs:
  cards_from: ["c2", "c4", "d2"]
