id: bio.genetics.mendel
type: concept
title: "Mendel’s peas"
summary: "Dominant, recessive and the 3 to 1 ratio."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 8
steps:
  - kind: problem
    id: hook
    widget: choice
    prompt: Mendel crossed true-breeding purple-flowered peas with white-flowered ones. What colour were all the offspring?
    params:
      options:
        - label: All purple
          correct: true
        - label: All pale purple, a blend
          feedback: That is what people thought back then. But the colours did not blend.
        - label: Half purple, half white
          feedback: That only happens a generation later – and not half and half.
    hints:
      - One factor can hide the other.
      - White only reappeared in the next generation.
    explanation: All offspring were purple. The factor for white was not gone – only hidden.

  - kind: explain
    id: c1
    body: "A **gene** is a section of DNA for one trait, such as flower colour. Each gene comes in versions called alleles. You have two alleles of each gene: one from your mother, one from your father."

  - kind: problem
    id: c2
    widget: buckets
    prompt: Purple (A) is dominant over white (a). What colour is the plant?
    params:
      buckets:
        - id: b1
          label: purple
        - id: b2
          label: white
      items:
        - label: AA
          bucket: b1
        - label: Aa
          bucket: b1
        - label: aa
          bucket: b2
    hints:
      - A dominant allele always shows.
      - White needs two recessive alleles.
    explanation: A single A makes purple. Only aa flowers white. The genetic make-up is the genotype, the appearance the phenotype.

  - kind: problem
    id: c3
    widget: cloze
    prompt: Fill in the gaps.
    params:
      text: An allele that already shows in Aa is called [[dominant]]. A hidden allele is called [[recessive]]. The versions of a gene are called [[alleles]].
      distractors:
        - chromosomes
        - mutated
    explanation: Dominant shows through, recessive needs two copies.

  - kind: problem
    id: c4
    widget: numeric
    prompt: Mendel crossed the purple offspring (Aa) with each other. Of {{n}} grandchildren – how many are likely to be purple?
    answer:
      value: "{{3 * n / 4}}"
    feedback:
      - when: numval(state.input) == n / 2
        misconception: half
        text: "Not half and half: three of four combinations contain an A."
      - when: numval(state.input) == n / 4
        misconception: swapped
        text: Those are the white ones. The question asks for purple.
    hints:
      - Aa × Aa gives AA, Aa, aA and aa.
      - Three of four have at least one A.
    explanation: 3/4 of {{n}} = {{3 * n / 4}} purple, {{n / 4}} white – the 3 to 1 ratio.
    variants:
      params:
        n: choice[100,400,800,1000]
      defaults:
        n: 400

  - kind: problem
    id: d1
    depth: 2
    widget: distribution
    prompt: Draw at least 100 grandchildren from the cross Aa × Aa. How close do you get to 3 to 1?
    params:
      items:
        - label: purple
          weight: 3
        - label: white
          weight: 1
    check:
      predicate: draws >= 100
    hints:
      - Draw 100 at once.
      - Compare the frequencies with 75 % and 25 %.
    explanation: Chance scatters. Only with many plants does the ratio approach 3 to 1. That is why Mendel counted thousands.
    difficulty: 2

  - kind: problem
    id: d2
    depth: 2
    widget: numeric
    prompt: For flower colour Mendel counted 705 purple and 224 white plants. What is the ratio? Round to two decimals.
    answer:
      value: 3.15
      tolerance: 0.01
    hints:
      - Divide purple by white.
      - 705 ÷ 224
    explanation: 705 ÷ 224 ≈ 3.15 – very close to 3. That is how Mendel found a rule in chance.
    difficulty: 2

  - kind: problem
    id: d3
    depth: 2
    widget: choice
    prompt: A pea has purple flowers. How can you find out whether it is AA or Aa?
    params:
      options:
        - label: Cross it with a white one (aa). If white offspring appear, it was Aa.
          correct: true
        - label: Look closely – Aa is paler.
          feedback: With true dominance AA and Aa look the same.
        - label: Cross it with another purple one.
          feedback: If the other is AA, you never see white. That tells you nothing.
    hints:
      - You need a partner that passes on only a.
      - This is called a test cross.
    explanation: With Aa × aa every second offspring is white, with AA × aa none. The test cross reveals the genotype.
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: choice
    prompt: "In snapdragons red × white gives pink offspring. Pink × pink gives red, pink and white in a ratio of 1 : 2 : 1. What does that show?"
    params:
      options:
        - label: The alleles are inherited separately, even though their effects blend.
          correct: true
        - label: Mendel’s rules do not apply here.
          feedback: "They do – just neither allele is dominant. The 1 : 2 : 1 split is pure Mendel."
        - label: The colours have blended for good.
          feedback: Then pink × pink would never give red and white again.
    hints:
      - What would happen if hereditary factors really blended?
      - Red and white reappear unchanged.
    explanation: This is incomplete dominance. The appearance is mixed, the alleles stay unchanged.
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux why two purple peas can have white offspring.
    params:
      keywords:
        - - allel
          - allele
          - anlage
        - - dominant
        - - rezessiv
          - recessive
          - verdeckt
          - hidden
        - - aa
          - beide
          - zwei
          - both
          - two
      sample: "Both parents are Aa: they look purple because A is dominant. But each passes on the recessive allele a with half chance. A child that gets a from both is aa and flowers white."
    explanation: Hidden alleles are kept and can come together again.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d2"]
