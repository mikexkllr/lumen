id: bio.genetics.punnett
type: concept
title: "The Punnett square"
summary: "Working out crosses and finding probabilities."
locale: en
license: CC-BY-SA-4.0
authors: ["Lumen-Team"]
skills: []
estimated_minutes: 10
steps:
  - kind: explain
    id: intro-hook
    intro: true
    title: A grid full of children
    body: With a **Punnett square**, breeders predict what offspring might look like. Every box in the grid is one possible child. Tap boxes and see their share. Then split the grid into 16 boxes.
    visual:
      widget: fraction
      interactive: true
      params:
        parts: 4
        shape: square
        partOptions:
          - 4
          - 16

  - kind: problem
    id: hook
    widget: choice
    prompt: Both parents are Aa. How likely is an aa child?
    params:
      options:
        - label: 25 %
          correct: true
        - label: 50 %
          feedback: "Each parent passes on a with 50 %. Both must do it: 50 % of 50 %."
        - label: 0 %
          feedback: Both carry an a. They can come together.
    hints:
      - Both must pass on an a.
      - 1/2 × 1/2
    explanation: "Each passes on a with 1/2. Together: 1/2 × 1/2 = 1/4 = 25 %."

  - kind: explain
    id: c1
    body: A **Punnett square** is a table. The mother’s alleles go along the top, the father’s down the side. In each box you write what comes together. Every box is equally likely.

  - kind: problem
    id: c2
    widget: match
    prompt: "Cross Aa × aa: which boxes appear? Match the share."
    params:
      pairs:
        - left: Aa
          right: 50 %
        - left: aa
          right: 50 %, the other half
        - left: AA
          right: 0 %
    hints:
      - The aa parent always gives a.
      - The other gives A or a, half the time each.
    explanation: Two boxes Aa, two boxes aa, none AA. That is why this cross reveals the genotype so clearly.

  - kind: problem
    id: c3
    widget: numeric
    prompt: One parent is AA, the other aa. What percentage of the children are Aa?
    params:
      unit: "%"
    answer:
      value: 100
    feedback:
      - when: numval(state.input) == 50
        misconception: half
        text: One always gives A, the other always a. Every child gets both.
    hints:
      - What can each parent pass on?
      - There is only one combination.
    explanation: "Every box is Aa: 100 %. This is Mendel’s first law, uniformity."

  - kind: problem
    id: c4
    widget: choice
    prompt: Two Aa parents already have three children with AA or Aa. How likely is the fourth child to be aa?
    params:
      options:
        - label: Still 25 %
          correct: true
        - label: 100 %, because it is due now
          feedback: Chance has no memory. Each child is a fresh draw.
        - label: 0 %, because it never happened before
          feedback: Earlier children do not change the parents’ alleles.
    hints:
      - Do the parents’ alleles change?
      - Each fertilisation is a new throw.
    explanation: "Each child is independent. The 3 : 1 holds on average over many families, not within one."

  - kind: problem
    id: intro-c1
    widget: fraction
    prompt: Both parents are Aa, and violet (A) is dominant. In the Punnett square, shade every box whose child has violet flowers.
    params:
      parts: 4
      shape: square
    answer:
      fraction: 3/4
    hints:
      - The four boxes are AA, Aa, aA and aa.
      - Every box with at least one A is violet.
    explanation: AA, Aa and aA have violet flowers, only aa is white. That is 3 of the 4 boxes.

  - kind: problem
    id: d1
    depth: 2
    widget: numeric
    prompt: Two parents are carriers (Aa) of a recessive disease. How likely is it that both of their two children are affected? Give a fraction.
    answer:
      value: 1/16
      form: fraction
    feedback:
      - when: numval(state.input) == 1/4
        misconception: one-child
        text: That is one child. For two children, multiply.
      - when: numval(state.input) == 1/2
        misconception: added
        text: You do not add probabilities of independent events.
    hints:
      - "Each child: 1/4."
      - 1/4 × 1/4
    explanation: 1/4 × 1/4 = 1/16. Independent events are multiplied.
    difficulty: 2

  - kind: explain
    id: d2
    depth: 2
    body: "With two traits you need a bigger square. Each AaBb parent makes four kinds of sex cells: AB, Ab, aB and ab. That gives 16 boxes. Mendel called this the **law of independent assortment**."

  - kind: problem
    id: d3
    depth: 2
    widget: numeric
    prompt: Cross AaBb × AaBb. How many of the 16 boxes show both recessive traits (aabb)?
    answer:
      value: 1
    feedback:
      - when: numval(state.input) == 4
        misconception: one-trait
        text: aa alone appears in 4 boxes. For aabb, bb must also be right.
    hints:
      - How likely is aa? And bb?
      - 1/4 × 1/4 of 16 boxes
    explanation: "Just one box: ab × ab. Overall this gives the 9 : 3 : 3 : 1 split."
    difficulty: 2

  - kind: problem
    id: x1
    depth: 3
    widget: numeric
    prompt: A healthy child of two Aa parents wants to know whether it is a carrier. What is the probability? Give a fraction.
    answer:
      value: 2/3
      form: fraction
    feedback:
      - when: numval(state.input) == 1/2
        misconception: ignore-condition
        text: Without information it would be 1/2. But aa is already ruled out.
      - when: numval(state.input) == 3/4
        misconception: wrong-ratio
        text: That is the chance of being healthy. Among the healthy, count only the Aa.
    hints:
      - Which boxes remain if the child is healthy?
      - "AA, Aa, aA: how many of them are carriers?"
    explanation: "Of three healthy boxes, two are Aa: 2/3. A conditional probability – genetic counselling calculates exactly like this."
    difficulty: 3

  - kind: problem
    id: x2
    depth: 3
    widget: teach
    prompt: Explain to Lux how to find a probability with a Punnett square.
    params:
      keywords:
        - - mutter
          - vater
          - eltern
          - mother
          - father
          - parent
        - - allel
          - allele
          - keimzell
          - gamet
        - - feld
          - kästchen
          - kaestchen
          - box
          - square
          - cell
        - - gleich wahrscheinlich
          - viertel
          - equally likely
          - quarter
          - "25"
      sample: You write the mother’s alleles along the top and the father’s down the side. Each box gets the combination. Every box is equally likely, so with four boxes each is a quarter.
    explanation: The square counts equally likely cases – then probability is just counting.
    difficulty: 3

srs:
  cards_from: ["c2", "c3", "d1"]
