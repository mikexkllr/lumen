# Placement: rule-based and deterministic. The first wrong answer
# decides where learning starts.
type: placement
locale: en
mastered: { topic: alg.linear, unit: alg.linear.u3 }
items:
  - recommends: { topic: math.start, unit: math.start.u1 }
    step:
      kind: problem
      widget: numeric
      prompt: What is 8 + 5?
      answer: { value: 13 }
  - recommends: { topic: math.start, unit: math.start.u2 }
    step:
      kind: problem
      widget: choice
      prompt: What is 4 · 6?
      params:
        layout: grid
        options:
          - { label: "24", correct: true }
          - { label: "10" }
          - { label: "20" }
          - { label: "46" }
  - recommends: { topic: math.fractions, unit: math.fractions.u1 }
    step:
      kind: problem
      widget: choice
      prompt: Which fraction describes 3 of 4 equal parts?
      params:
        layout: grid
        options:
          - { label: "3/4", correct: true }
          - { label: "4/3" }
          - { label: "1/4" }
          - { label: "3/7" }
  - recommends: { topic: math.fractions, unit: math.fractions.u2 }
    step:
      kind: problem
      widget: numeric
      prompt: "Simplify as far as possible: 6/8"
      answer: { value: "3/4", form: simplified }
  - recommends: { topic: alg.linear, unit: alg.linear.u1 }
    step:
      kind: problem
      widget: numeric
      prompt: "x + 6 = 10. What is x?"
      answer: { value: 4 }
  - recommends: { topic: alg.linear, unit: alg.linear.u2 }
    step:
      kind: problem
      widget: numeric
      prompt: "Solve: 2x − 3 = 9"
      answer: { value: 6 }
  - recommends: { topic: alg.linear, unit: alg.linear.u3 }
    step:
      kind: problem
      widget: choice
      prompt: Which point lies in the upper right of the coordinate plane?
      params:
        layout: grid
        options:
          - { label: "(2, 3)", correct: true }
          - { label: "(−2, 3)" }
          - { label: "(2, −3)" }
          - { label: "(−2, −3)" }
